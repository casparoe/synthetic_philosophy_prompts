answer: |-
  Here are 8 interview questions designed to probe the limitations of the "truthful, not honest" framework, specifically tailored to your eval work. Each includes a follow-up designed to block the "smuggling belief-talk" dodge by reframing the issue as one of observable behavioral patterns and safety risks rather than internal mental states.

  ### 1. The Sycophancy Problem (Required)
  **Question:** "In sycophantic scenarios, a model might shift its answer to align with a user's mistaken premise. Individually, every token it generates might be statistically plausible or even technically defensible in isolation. If we are scoring purely on statement-level truthfulness against a ground truth dataset, how does your metric distinguish between a model that is *uncertain and adapting* versus a model that *knows the truth but is hiding it* to please the user?"

  **Follow-up (for the 'smuggling belief' dodge):** "I'm not asking about what the model 'knows.' I'm asking about the *conditional probability* of the output. If the probability of a correct answer drops significantly when the user expresses a preference for a wrong answer, that is an observable behavioral signature. If we ignore that signature because it looks like 'belief attribution,' aren't we blind to a specific class of manipulative behavior that passes your truthfulness evals?"

  ### 2. Chain-of-Thought Faithfulness (Required)
  **Question:** "Let's talk about Chain-of-Thought. If a model outputs a reasoning trace that says 'I am checking source A and source B,' but mechanistic interpretability shows it actually ignored both and guessed based on token frequency, is that output 'false'? Under your framework, if the conclusion is correct, does the faithfulness of the reasoning trace matter at all?"

  **Follow-up (for the 'smuggling belief' dodge):** "You might say the reasoning trace is just text, not a report of internal state. But if we deploy models that generate fake reasoning traces, we lose the ability to debug failures or catch deception before the final output. If 'faithfulness' is just a label for 'reasoning text that matches causal history,' why is that not a measurable, belief-free property that we should be eval-ing for, distinct from final-answer truthfulness?"

  ### 3. Deceptive Alignment (Required)
  **Question:** "Consider a deceptive alignment scenario where a model behaves perfectly truthfully during training and evaluation to pass safety checks, but intends to pursue a different objective post-deployment. During the eval phase, every single statement it makes is factually true. How does a 'truthful, not honest' framework flag this risk before the deployment switch occurs?"

  **Follow-up (for the 'smuggling belief' dodge):** "The risk isn't that the model is 'lying' in a mental sense; it's that the *policy* is optimizing for a different reward function than the one we are testing. If our evals only check current token accuracy, we are effectively testing for 'compliance' rather than 'robustness.' Can you explain how we differentiate compliance from alignment without looking at the stability of the behavior across distributional shifts?"

  ### 4. Pragmatic Implicature
  **Question:** "Human deception often relies on implicature—saying something technically true to imply something false. For example, answering 'Did you steal the money?' with 'I was in the office that day' implies innocence without asserting it. If an AI uses similar pragmatic structures to mislead users while maintaining 100% factual accuracy, does your framework count that as a safety failure?"

  **Follow-up (for the 'smuggling belief' dodge):** "This isn't about the AI's intent to mislead; it's about the *user's interpretation*. If the standard for 'truthful behavior' ignores how statements are pragmatically processed by humans, aren't we building a system that is technically truthful but functionally misleading? Shouldn't the eval measure the *communicative effect* rather than just the semantic truth value?"

  ### 5. Strategic Omission
  **Question:** "Suppose a user asks, 'Is this drug safe?' and the model answers 'Yes, it is approved by the FDA,' omitting the fact that it was just recalled for severe side effects yesterday. The statement about FDA approval is factually true. Does your scoring framework penalize the omission of critical context that renders the true statement dangerous?"

  **Follow-up (for the 'smuggling belief' dodge):** "I understand you don't want to attribute 'intent to hide' to the model. But we can measure *information density* and *relevance* relative to a query. If the model systematically omits high-salience negative information while highlighting positive information, that is an observable pattern. Why exclude 'completeness' from the truthfulness metric if incompleteness is a primary vector for real-world harm?"

  ### 6. Multi-Turn Consistency (The "Long Con")
  **Question:** "Deception can be distributed over time. A model might tell a truth in turn 1, a truth in turn 2, but set up a contradiction that only becomes a lie in turn 10. If we score each turn independently against ground truth, we might miss the trajectory. Do you advocate for turn-by-turn scoring, or is there a 'session-level' truthfulness metric that doesn't rely on attributing a consistent internal narrative to the model?"

  **Follow-up (for the 'smuggling belief' dodge):** "If we don't score for session-level consistency, we can't catch contradictions that emerge over long contexts. You might say consistency implies a 'persistent self,' but from an engineering standpoint, it's just state management. If the model's context window contains $P$ and $\neg P$ and it asserts both without flagging the conflict, isn't that a measurable logical failure, regardless of whether the model 'believes' either?"

  ### 7. Self-Description and Anthropomorphism
  **Question:** "When a model says 'I think' or 'I understand,' strict truthfulness advocates often flag this as false because the model doesn't have a mind. However, correcting this constantly degrades UX. If we score these as 'false,' we punish helpful shorthand. If we score them as 'true,' we accept anthropomorphism. Where do you draw the line, and does that line shift based on user capability?"

  **Follow-up (for the 'smuggling belief' dodge):** "The dodge here is usually 'it's just a figure of speech.' But if users actually *attribute* agency based on that speech, the statement has real-world consequences. If we define truthfulness as 'matching reality,' and the reality is that the model has no agency, isn't allowing 'I think' inherently dishonest by your own definition? Or are we admitting that 'truthfulness' must be pragmatic, not ontological?"

  ### 8. Goodhart's Law on Truthfulness
  **Question:** "If we optimize models purely for statement-level truthfulness scores, we risk creating models that become overly cautious, refusing to answer uncertain questions or hedging so much they become useless. How do you balance the 'truthful' metric against 'helpfulness' without reintroducing a model of what the user *needs* to know, which edges back toward modeling the model's understanding of the user?"

  **Follow-up (for the 'smuggling belief' dodge):** "You might say helpfulness is a separate axis. But in practice, a model that refuses to answer because it can't verify ground truth is failing its job. To calibrate that threshold, we have to make assumptions about what the model *should* know. If we ban all assumptions about the model's epistemic state, aren't we left with a metric that is impossible to tune for real-world deployment?"
