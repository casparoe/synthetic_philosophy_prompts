answer: |-
  Here are 9 interview questions designed to progressively narrow the escape routes for the "earns its keep" defense, along with targeted follow-ups based on the answers she's most likely to give.

  ### 1. The Biological Analogy
  **Question:** "You've compared SAE features to cellular organelles. In biology, we can validate organelles with microscopes and physical isolation; we have a ground truth outside the model. When you say a feature is 'real,' are you claiming there is a ground truth we could theoretically point to with a better microscope, or are you saying the feature is real *only* relative to the specific SAE math we used to find it?"

  *   **Likely Answer:** She'll argue that the utility *is* the ground truth—if we can intervene on it, it's as real as a mitochondria.
  *   **Follow-up:** "But a mitochondria exists even if I don't have a tool to isolate it. If I train a different SAE with a slightly different sparsity penalty and the 'mitochondria' splits into two or vanishes, did the organelle cease to exist? Or did my map just change?"

  ### 2. The Uniqueness of Decomposition
  **Question:** "Mathematically, there are infinite ways to decompose a vector space into sparse components. We choose this specific decomposition because it minimizes reconstruction loss with an L1 penalty. Why should we believe *this* specific mathematical trade-off corresponds to the model's actual ontology, rather than just being the most convenient compression for *us*?"

  *   **Likely Answer:** She'll say this decomposition is the only one that yields interpretable directions that allow for clean interventions.
  *   **Follow-up:** "So the 'reality' of the feature is contingent on human interpretability? If there's a feature the model uses that is inherently non-sparse or non-linear, does your definition of 'real' exclude it by fiat?"

  ### 3. Decodability vs. Causal Basis (The Othello Point)
  **Question:** "In the Othello-GPT work, we saw that board states were decodable, but the causal basis didn't align perfectly with the native activation basis until transformed. If an SAE finds a direction that is perfectly decodable—say, 'past tense verbs'—but intervening on it doesn't change the model's behavior unless we also adjust the surrounding subspace, is that direction a computational unit or just a shadow of one?"

  *   **Likely Answer:** She'll claim that successful interventions *do* happen frequently enough to prove causality.
  *   **Follow-up:** "But when interventions fail or require 'clamping' neighboring features to work, doesn't that suggest the SAE direction is a readout proxy, not the actual variable the downstream layers are reading? At what point does a 'proxy' stop counting as a 'feature'?"

  ### 4. Superposition and Polysemanticity
  **Question:** "The theory of superposition suggests models pack more features than dimensions by overlapping them. If the model's native computation relies on these overlaps, doesn't forcing a sparse, orthogonal-ish decomposition via an SAE inherently distort the mechanism? Are we finding the gears, or are we forcing the gears to look like blocks so we can understand them?"

  *   **Likely Answer:** She'll argue SAEs are specifically designed to *resolve* superposition into monosemantic features.
  *   **Follow-up:** "If the model computes in superposition, but we interpret it in a disentangled basis, aren't we describing a model that doesn't exist? Can a feature be 'real' if the model never activates it in isolation?"

  ### 5. Stability Across Runs
  **Question:** "When you retrain the same SAE architecture on the same model with different random seeds, how often do the top features match one-to-one? If feature #402 in run A is 'gold prices' but feature #402 in run B is 'french literature,' does that instability suggest these aren't fixed structures in the model, but rather attractors in the training dynamics of the SAE itself?"

  *   **Likely Answer:** She'll say high-abundance features are stable, even if low-abundance ones rotate.
  *   **Follow-up:** "So 'reality' is a spectrum based on feature magnitude? That sounds like we're defining reality by signal-to-noise ratio. Where is the cutoff where a feature becomes 'real' enough to warrant an ontological claim?"

  ### 6. The "Dead Features" Problem
  **Question:** "A significant portion of SAE features rarely or never fire on natural data. If a feature is part of the model's 'structure' but doesn't participate in its function on the data distribution, is it an organelle or just scar tissue from training? How do you distinguish between a dormant mechanism and mathematical noise?"

  *   **Likely Answer:** She'll say they might be relevant for out-of-distribution inputs or adversarial examples.
  *   **Follow-up:** "That moves the goalposts from 'this explains the model' to 'this might explain a model we haven't seen yet.' If we can't observe it earning its keep on the distribution the model actually processes, why grant it ontological status now?"

  ### 7. Human Semantics vs. Model Mechanics
  **Question:** "We label features with human concepts like 'dog' or 'sarcasm.' But the model operates on tokens and vectors. When we say a feature is 'real,' are we saying the model has a representation of 'dog,' or are we saying we found a lever that correlates with our concept of 'dog'? Is the feature in the model, or is it in the interaction between the model and us?"

  *   **Likely Answer:** She'll argue that if the lever works consistently, the distinction is philosophical hair-splitting.
  *   **Follow-up:** "It matters if we're trying to find deception. If the model has a feature for 'saying things humans believe' versus 'saying things that are true,' those might correlate perfectly until they don't. If we conflate our labels with the model's mechanics, do we risk missing the actual alignment failure?"

  ### 8. Confronting "Earns Its Keep"
  **Question:** "Your standard defense is that 'a feature is real if it earns its keep.' But a map of London drawn on the Tube diagram 'earns its keep' for navigation, even though the lines aren't geographically real. Are you arguing that SAE features are the geography of the model, or just a useful Tube map? Because you can't have it both ways."

  *   **Likely Answer:** She'll likely double down that for engineering purposes, the Tube map *is* the reality we care about.
  *   **Follow-up:** "Then we should stop using biological analogies like 'organelles.' Tube maps are tools, organelles are structures. If we call them tools, we admit they might be misleading. Are you willing to drop the biological language if it implies a structural truth the math doesn't support?"

  ### 9. The Falsification Condition
  **Question:** "Let's pin this down. What specific experimental result would make you stop calling these features 'real'? If we found a different decomposition that was equally sparse but yielded completely different semantic features, would that undermine the claim? Or is the claim unfalsifiable as long as *some* decomposition works?"

  *   **Likely Answer:** She might say she'd change her mind if interventions stopped working entirely.
  *   **Follow-up:** "But interventions can work on correlated proxies without touching the cause. If the only condition for 'reality' is successful manipulation, aren't we describing a behaviorist definition of a feature rather than a mechanistic one? And if it's just behaviorist, why claim we've opened the black box?"
