      *   *Motivation:* He wanted scientific proof of an afterlife to resolve the "dualism of practical reason" (the conflict between self-interest and universal good/utilitarianism). If there's no afterlife/reward, why be moral?
      *   *Methodology:* Rigorous, skeptical, empirical. He wasn't a gullible believer. He co-founded the SPR to bring scientific scrutiny to the occult.
      *   *Outcome:* He accepted telepathy (based on the *Census of Hallucinations* and similar data) but rejected survival (due to fraud, lack of reproducibility, alternative explanations).
      *   *Key Trait:* "Scientific caution." He was willing to follow the evidence but set a very high bar for extraordinary claims.

  3.  **Deconstruct Daryl Bem's "Feeling the Future" (2011):**
      *   *Claim:* Precognition (psi) exists.
      *   *Method:* Standard social psychology protocols (retroactive priming, etc.).
      *   *Result:* Statistically significant p-values (< .05).
      *   *Aftermath:* Triggered the Replication Crisis. Critics (Wagenmakers, etc.) pointed out p-hacking, flexible data analysis, low power, and publication bias. Most replication attempts failed.
      *   *Significance:* It highlighted flaws in mainstream statistical practices, not just psi research.

  4.  **Synthesize: Sidgwick vs. Bem:**
      *   *Initial Reaction:* Sidgwick would likely be intrigued. Bem used *mainstream* methods, which aligns with Sidgwick's desire to legitimize the field.
      *   *Scrutiny:* Sidgwick was obsessed with eliminating fraud and error. He would look closely at the methodology.
      *   *The Statistical Issue:* Sidgwick dealt with probability (e.g., in the Census of Hallucinations). He understood chance. Would he accept p < .05 as proof of precognition? Probably not. He knew that "chance" can look like "signal" in small samples or with flexible analysis.
      *   *Replication:* The SPR emphasized cumulative evidence. Sidgwick would demand independent replication. Since Bem's results largely failed to replicate, Sidgwick would likely reject the conclusion.
      *   *The "Newness":* Sidgwick fought against spiritualist fraud (slate writing, seances). Bem's "fraud" wasn't malicious cheating but *methodological flexibility* (p-hacking). Sidgwick might see this as a sophisticated form of the same problem: data looking convincing but being unreliable.

  5.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* Acknowledge the depth of the user's research. Validate the connection between Sidgwick's philosophical stakes (utilitarianism/morality) and his psychical research.
      *   *Sidgwick's Epistemology:* Emphasize his "scientific naturalism." He wasn't a true believer; he was a critical investigator. He distinguished between "probability" and "proof."
      *   *Reaction to Bem's Methods:* Bem used standard psych methods. Sidgwick would appreciate the attempt at respectability but would be wary of relying solely on statistical significance without mechanistic explanation.
      *   *Reaction to the Replication Crisis:* This is the crux. Sidgwick valued *cumulative* evidence. The failure to replicate would be decisive for him. He would side with the skeptics/replicators (Wagenmakers et al.).
