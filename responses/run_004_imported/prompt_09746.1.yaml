answer: |-
  This is a fascinating intersection of intellectual history, philosophy of science, and the sociology of psychology. You have correctly identified the tension at the heart of Sidgwick's psychical research: a profound *desire* for evidence of the transcendent (driven by his ethical worries) checked by a rigorous *commitment* to scientific naturalism.

  If Henry Sidgwick were transported to 2011 to evaluate Daryl Bem's "Feeling the Future," I argue he would ultimately side with the statisticians and replicators (such as Eric-Jan Wagenmakers and the ManyLabs project) rather than Bem's defenders. However, his reasoning would be nuanced, rooted in his specific experience with the Society for Psychical Research (SPR).

  Here is how Sidgwick's investigative habits and philosophical commitments suggest he would analyze the Bem controversy.

  ### 1. The Standard of Evidence: "Scientific Caution"
  Sidgwick was not a gullible spiritualist; he was a critical empiricist. He famously stated that the SPR was formed to investigate claims "without prejudice or prepossession, but also without skepticism or credulity." However, in practice, Sidgwick's bar for proof was exceptionally high.

  While he accepted telepathy as a "provisional truth" based on the sheer volume of anecdotal data (like the *Census of Hallucinations*), he refused to accept survival after death because the evidence was tainted by fraud or alternative explanations.

  **Applied to Bem:** Sidgwick would appreciate that Bem used mainstream psychological protocols rather than seance-room tricks. This aligns with Sidgwick's goal of legitimizing the field. However, Sidgwick understood that **methodological respectability does not guarantee truth.** He spent decades debunking reputable witnesses who were nonetheless mistaken. He would likely view Bem's statistically significant p-values not as proof of precognition, but as "anomalous data" requiring independent verification. Given that Bem's effects proved fragile and difficult to replicate, Sidgwick would classify them alongside the many "promising" mediumistic phenomena that evaporated under stricter controls.

  ### 2. Fraud vs. Bias: A New Kind of Error
  You noted Sidgwick's disillusionment with fraudulent mediums in the 1870s. In the Victorian era, "fraud" usually meant conscious deception (sleight of hand, hidden wires).

  The Bem controversy introduced the scientific community to **Questionable Research Practices (QRPs)**: p-hacking, publication bias, and flexible data analysis. This is unconscious or systemic bias rather than conscious fraud.

  **Sidgwick's Take:** Sidgwick was acutely aware of the "fallibility of human testimony." He spent years analyzing how honest people could perceive false patterns. He would likely recognize QRPs as a sophisticated, modern version of the same problem he faced with mediums. To Sidgwick, a result generated by flexible analysis is epistemologically similar to a result generated by a tricked-out seance table: **the data does not reflect the phenomenon, but rather the methodology.** He would likely be more alarmed by the implication that mainstream psychology was systematically producing false positives than by the claim of precognition itself.

  ### 3. The Replication Imperative
  The core of the SPR's method was the accumulation of cases. Sidgwick believed that a single experiment, no matter how significant, was insufficient for an extraordinary claim. He sought *cumulative* evidence.

  **Applied to Bem:** The defining feature of the post-2011 landscape was the failure of large-scale replications to reproduce Bem's effects. For Sidgwick, this would be decisive. In his own work, when evidence failed to hold up under repeated scrutiny (as with physical mediumship), he discarded the hypothesis. He would view the replication crisis not as an attack on psychology, but as the scientific immune system functioning correctly. He would side with the replicators because they adhered to the SPR's founding principle: **verifiability is the only path to validity.**

  ### 4. The Philosophical Stakes: Does Precognition Help?
  This is the most critical philosophical point. Sidgwick's interest in psychical research was not idle curiosity; it was driven by the **"Dualism of Practical Reason."** In *The Methods of Ethics*, he worried that if death is the end, there is no rational reconciliation between self-interest and universal duty (utilitarianism). He needed proof of an afterlife (and divine justice) to make morality fully rational.

  **Applied to Bem:** Precognition (knowing the future) does not prove survival after death. In fact, it complicates the picture of causality without solving the ethical dilemma. Sidgwick might view Bem's work as a **distraction.** Even if precognition were proven, it doesn't resolve the conflict between egoism and utilitarianism. Therefore, Sidgwick would lack the *personal motivational bias* to defend Bem's findings. He would be free to follow the negative evidence where it led.

  ### 5. Would He See Anything "New"?
  You asked if he would see anything genuinely new in the controversy.
  *   **No:** He would recognize the pattern of "extraordinary claim $\rightarrow$ initial excitement $\rightarrow$ methodological critique $\rightarrow$ failure to replicate." He lived through this with spiritualism.
  *   **Yes:** He would be shocked by the **institutionalization of error.** In Sidgwick's time, error was located in the *medium* or the *witness*. In the Bem controversy, the error was located in the *discipline's standard practices* (NHST, p < .05). Sidgwick would find it profound that "mainstream science" was capable of generating systematic illusions without any conscious deceit. This would validate his deepest fear: that human cognition is inherently prone to self-deception, even (and especially) within the academy.

  ### Conclusion
  Sidgwick would likely view Daryl Bem as a sincere investigator who fell victim to the limitations of the statistical tools of his time, much like the Victorian researchers who were fooled by clever mediums.

  He would side with the **skeptics and replicators**, not because he was hostile to psi (he wasn't), but because the **evidentiary chain was broken.** For Sidgwick, the "Feeling the Future" episode would serve as a cautionary tale confirming his lifelong maxim: **the desire for a truth must never outweigh the rigor required to establish it.** He would likely conclude that while the *methods* of psychology needed reform (which they subsequently underwent), the *phenomenon* of precognition remained, as he would put it, "not proven."
