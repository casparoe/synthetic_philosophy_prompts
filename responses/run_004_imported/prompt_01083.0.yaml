prompt: |-
  So I fell down a rabbit hole this week that started from that old Yudkowsky post "The Futility of Emergence" (the one arguing that calling something "emergent" is basically a curiosity-stopper — it feels like an explanation but never cashes out into an actual prediction). Made me want to go read whoever actually coined "emergent" in this sense, instead of just getting it third-hand. Turns out that's George Henry Lewes, 1875, in *Problems of Life and Mind*. Dug up the actual passage and its rougher going than I expected. Here's the core of it (his paragraph numbers):

  "65. Thus, although each effect is the resultant of its components, the product of its factors, we cannot always trace the steps of the process, so as to see in the product the mode of operation of each factor. In this latter case, I propose to call the effect an emergent. It arises out of the combined agencies, but in a form which does not display the agents in action. [...] Every resultant is either a sum or a difference of the co-operant forces: their sum, when their directions are the same; their difference, when their directions are contrary. Further, every resultant is clearly traceable in its components, because these are homogeneous and commensurable.

  66. It is otherwise with emergents, when, instead of adding measurable motion to measurable motion, or things of one kind to other individuals of their kind, there is a co-operation of things of unlike kinds. Add heat to heat, and there is a measurable resultant; but add heat to different substances, and you get various effects, qualitatively unlike: expansion of one, liquefaction of a second, crystallization of a third [...]. The emergent is unlike its components in so far as these are incommensurable, and it cannot be reduced either to their sum or their difference. But, on the other hand, it is like its components, or, more strictly speaking, it is these; nothing can be more like the coalescence of the components than the emergent which is their coalescence. Unlike as water is to oxygen or hydrogen separately, or to both when uncombined, nothing can be more like water than their combination, which is water."

  And then a bit later, in 67, he adds that "the real effect is always an emergent, since we never know with absolute accuracy enough of all the factors to trace their operation," but that this "is no longer true of ideal constructions, wherein the factors are accurately defined."

  What I can't work out is whether Lewes has one coherent notion here or is quietly running two different ones together. 65-66 read like a real, in-the-world distinction — some combinations are additive/traceable, others produce genuinely novel "incommensurable" qualities, water really is a different kind of thing than H and O. But then he says the emergent just IS its components coalesced, nothing extra over them, and paragraph 67 seems to walk the whole thing back into a purely epistemic claim, where "emergent" just means "we don't currently have a complete enough model to trace it," and something with "ideal," fully-specified knowledge of the factors wouldn't see any emergents at all.

  So which is it — is water-from-hydrogen-and-oxygen supposed to be emergent even relative to perfect/complete knowledge of the factors, or only relative to our ignorance of them? Basically I can't tell if 19th-century Lewes had already spotted the exact tension Yudkowsky is complaining about, or is just sitting in it unknowingly, or if I'm misreading the "ideal constructions" line entirely.
