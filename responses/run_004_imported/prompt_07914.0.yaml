              2.  **Robustness:** Does it hold across inputs, not just the test set?
              3.  **Composability:** Can I combine feature A and B to get behavior A+B?
          *   Advice on the production system: Trust the steering vector *only* if it passes causal scrubbing, not just if it looks good on a dashboard.
      *   **Conclusion:** Reiterate the stance. Representations are functional joints, not carved nature.

  4.  **Refining and Polishing:**
      *   *Tone Check:* Is it too academic? Keep the engineering analogies strong (compilers, debugging, production).
      *   *Philosophy Check:* Don't overdo Dennett or Putnam. Use them to clarify, not obscure.
