answer: |-
  It is a pleasure to speak with someone who actually understands the biology behind the philosophy. You have put your finger on the exact nerve that has kept the philosophy of mind community awake for the last 30 years.

  Your intuition that "proper function" risks collapsing into "statistical normalcy" is not just a layperson's confusion; it is the core of the **Indeterminacy Problem** (sometimes called the Distality Problem), and it is the primary reason why teleosemantics, while influential, is no longer viewed as the "silver bullet" it once seemed to be in the 1980s and 90s.

  However, to answer your specific question: Philosophers credit teleosemantics with *addressing* the disjunction problem (rather than necessarily *solving* it to everyone's satisfaction) because Millikan makes a move that causal theorists like Fodor could not. She shifts the ground from **current covariance** to **historical success conditions**.

  Here is the breakdown of why the distinction matters, why your skepticism is warranted, and where the theory currently stands.

  ### 1. Proper Function is Etiological, Not Statistical
  You wrote: *"a proper function just seems to be whatever the mechanism reliably or normally does."*

  From a biological standpoint, I suspect you might actually agree with Millikan more than you think, once we clarify the definition. In biology, we distinguish between what an organ *does* and what it is *for*.
  *   **Statistical/Descriptive:** The heart makes a thumping sound. It does this 100% of the time it beats. It is statistically normal.
  *   **Etiological/Proper:** The heart pumps blood. This is its proper function.

  Why? Because the heart exists today *because* ancestors pumped blood successfully. The thumping sound contributed nothing to the replication of the trait.

  Millikan applies this to the frog.
  *   **Fodor's Causal Theory:** If the neuron fires for Flies and BBs, the content is "Fly or BB." (This is the disjunction problem).
  *   **Millikan's Teleosemantics:** We ignore what the frog does *now*. We ask: **Under what conditions did the ancestors of this frog survive and reproduce to pass on this detector?**

  The ancestors survived because they caught **flies**. They did not survive because they caught BBs (BBs didn't exist in the Environment of Evolutionary Adaptedness). Therefore, the "success condition" of the mechanism is the presence of a fly. When the frog snaps at a BB, the mechanism is **malfunctioning**, even if it is behaving consistently with its current inputs.

  So, "proper function" is not "what it normally does now"; it is "what it was selected to do then." This allows Millikan to say the content is "Fly" (singular), not "Fly or BB" (disjunction), because only "Fly" explains the existence of the trait.

  ### 2. Why Your "Bait-and-Switch" Feeling is Correct
  Despite the logical move above, your feeling of a bait-and-switch is shared by many critics (including Jerry Fodor, Peter Godfrey-Smith, and Karen Neander). Here is why your biologist brain is ringing alarm bells:

  **A. The Grain of Selection (Indeterminacy)**
  You suggested the content should be "small dark moving thing." Millikan says it's "fly." But selection doesn't care about the ontology of "fly." Selection cares about **nutrition**.
  *   Did the ancestor survive because it caught *Musca domestica*?
  *   Or because it caught *nutritious morsels*?
  *   Or because it caught *small moving things*?

  If the proper function is defined by the *benefit* conferred (nutrition), then the content should be "food," not "fly." If the content is "food," then a BB is not an error if the frog thinks it's food. If the content is "small moving thing," the BB is a perfect hit.
  Teleosemantics struggles to pin down the *level of abstraction* at which selection fixed the content. Evolution selects for fitness outcomes, not semantic truth conditions.

  **B. Novel Representations**
  As a biologist, you know evolution is a tinkerer. But humans can think about things that never existed in the EEA (gluons, infinite sets, unicorns).
  If content is fixed by historical selection, how do we have thoughts about things our ancestors never encountered? Millikan has to argue that these are "derived proper functions" built from basic building blocks, but the explanation gets very convoluted very quickly.

  **C. The Swampman Objection**
  If a lightning strike creates a molecule-for-molecule duplicate of you (Swampman) out of the swamp, he has no evolutionary history. Millikan must say Swampman has no mental content. Most philosophers (and biologists, I suspect) find this counter-intuitive. If his neurons fire exactly like yours, surely he sees a tree?

  ### 3. So Why Does Teleosemantics Still Have Credit?
  If the problems are this glaring, why is Millikan still a giant in the field?

  1.  **It Naturalized the Normative:** Before Millikan, it was hard to explain how a physical state could be *wrong* (misrepresentation). Causal theories couldn't handle error (if I think "Fly" when there is a BB, the state was caused by the BB, so why is it wrong?). Millikan showed that **biological malfunction** provides a naturalistic basis for **semantic error**. That was a massive breakthrough, even if the details are messy.
  2.  **It Shifted the Burden:** She forced externalists to take history seriously. You can't just look at the current causal matrix; you have to look at the lineage.
  3.  **It Aligns with Predictive Processing:** Interestingly, modern computational neuroscience (like the Free Energy Principle) is circling back toward teleological ideas. The brain minimizes surprise based on models built to keep the organism alive. The "goal" (homeostasis/survival) fixes the "meaning" of the signals.

  ### Summary
  You aren't missing a trick; you're seeing the crack in the foundation.
  *   **Millikan's Defense:** Proper function is historical (what worked in the past), not statistical (what happens now). This solves the Disjunction Problem by classifying BB-snapping as a *malfunction*.
  *   **The Biologist's Rebuttal:** Selection fixes fitness outcomes, not semantic contents. The "grain" of selection is too coarse to fix specific content like "fly" vs. "nutritious thing."

  Philosophers credit teleosemantics because it was the first robust attempt to ground meaning in biology without magic. But most contemporary philosophers of mind agree with you: it hasn't fully solved the problem. It traded the "spookiness" of dualism for the "indeterminacy" of evolutionary history.

  If you are looking for where the field has gone since Millikan, you might look into **Role Functionalism** or the more recent **Predictive Processing/Active Inference** frameworks. They try to keep the naturalism but ground the "function" in current system dynamics rather than deep history, which might sit better with your skepticism about relying solely on the EEA.
