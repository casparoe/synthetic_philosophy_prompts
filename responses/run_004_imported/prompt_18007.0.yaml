answer: |-
  G. E. Moore is on a date at a stunning mountain overlook. His partner turns to him, gestures at the sunset, and says, "Isn't this perfect? Just you, me, and this view. It feels like the love and the beauty make something bigger than just the two of them."

  Moore beams. "Precisely! It's an *Organic Unity*. The value of the whole experience far exceeds the sum of 'affection' plus 'scenery'. In fact, it's close to the greatest good imaginable."

  "So," she says, leaning in, "let's enjoy the whole thing."

  "I can't," Moore says, pulling a blindfold out of his pocket.

  "Why not?"

  "Because I have to verify that the scenery is good even if no one perceives it. If I look at it, I contaminate the intrinsic value. So I'll just stand here blindfolded while you look. That way, we maximize the theoretical good."

  She dumps him on the spot and drives away.

  As her taillights disappear, Moore turns back to the mountain, sighs contentedly, and notes, "Well, the relationship is over, but objectively speaking, this landscape is still better than a heap of filth."
