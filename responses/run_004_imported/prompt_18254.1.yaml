answer: |-
  **CONSTITUTIONAL COMMISSION ON ELECTORAL LAW**
  **MEMORANDUM OF DECISION**

  **TO:** The Plenary Session of the Constitutional Commission
  **FROM:** The Drafting Committee on Legislative Structure
  **DATE:** 24 October 202X
  **SUBJECT:** Recommendation Regarding the Proposal to Abolish Political Parties

  **I. SUMMARY OF PROPOSAL**

  A member of this Commission has proposed a radical departure from standard electoral design: the prohibition of organized political parties in contests for the new Parliament. Under this proposal, only independent candidates would be permitted to stand. Parliamentary alliances would be permissible for the formation of a government but would be required to dissolve following every substantive vote, reconstituting only as necessary for the next legislative question.

  This proposal is grounded in the moral philosophy of Simone Weil, specifically her 1943 essay *On the Abolition of All Political Parties*. The argument posits that parties are inherently totalitarian in spirit, prioritizing their own preservation over truth and justice, and coercing members into surrendering individual judgment to a collective line. The proponent argues that in a nation emerging from civil conflict, the "manufacture of collective passion" inherent to parties poses an existential threat to peace. Legitimacy, on this view, derives solely from conformity to truth, not from majority rule.

  **II. ASSESSMENT OF THE WEILIAN CRITIQUE**

  The Committee has deliberated on this proposal with the seriousness it commands. We explicitly reject the notion that Weil's argument is merely utopian or historically obsolete. Her diagnosis of the party mechanism is piercingly accurate, perhaps especially for a post-conflict society.

  We acknowledge the following truths in the proposal:
  1.  **The Suppression of Judgment:** Party discipline often forces representatives to vote against their conscience and the specific interests of their constituents to maintain a unified front.
  2.  **The Priority of Growth:** Parties often act to expand their own power rather than to solve national problems, turning governance into a zero-sum game.
  3.  **The Danger of Passion:** In a country recently torn by civil war, institutionalizing factions risks hardening the ethnic, regional, or ideological fault lines that fueled the conflict.

  To ignore these dangers would be negligent. A parliament that functions merely as a battleground for entrenched tribalisms, disguised as parties, will not sustain peace.

  **III. STRUCTURAL AND PRACTICAL CONSTRAINTS**

  However, the Commission must also weigh this moral philosophy against the mechanical realities of the system we have been mandated to design: a Westminster-style parliament.

  1.  **Executive Stability:** The Westminster system fuses the legislative and executive branches. The Government holds office only so long as it commands the confidence of the House. This requires a stable majority capable of passing budgets and confidence motions. A parliament of independents, forming and dissolving alliances vote-by-vote, cannot sustain a government. It invites chronic instability, frequent elections, and executive paralysis.
  2.  **Accountability:** In a party-less system, voters cannot easily assign credit or blame. If a policy fails, who is responsible? The shifting alliance of independents? Without the "brand name" of a party, accountability dissipates.
  3.  **The Risk of Informal Factions:** History suggests that banning formal parties does not eliminate factions; it drives them underground. In the absence of transparent party structures, power will coalesce around patronage networks, warlords, or ethnic strongmen. These informal blocs will exert the same pressure as parties but without public manifestos, membership rolls, or regulatory oversight. In a post-conflict environment, opaque patronage is more dangerous than transparent partisanship.

  **IV. DECISION**

  The Commission **rejects** the proposal to ban political parties.

  We conclude that while parties are imperfect vessels, they are necessary infrastructure for a Westminster democracy. To remove them would be to remove the load-bearing walls of the system while expecting the roof to stand. The risk of state collapse and a return to conflict via informal warlordism outweighs the risk of partisan polarization.

  **V. MODIFIED RECOMMENDATIONS (THE WEILIAN SAFEGUARDS)**

  While we reject the abolition of parties, we accept the validity of Weil's critique. Therefore, the Electoral Law shall include specific mechanisms to mitigate the "totalitarian spirit" of the party system:

  1.  **Conscience Clauses:** The Standing Orders of the Parliament must explicitly protect the right of Members of Parliament (MPs) to vote according to conscience on matters of fundamental rights, ethics, and constitutional amendment, without fear of expulsion from their party caucus.
  2.  **Transparency of Funding and Membership:** To prevent parties from becoming opaque machines, strict disclosure laws regarding donor sources and membership rolls will be enforced. Parties must be democratic internally; leadership selection cannot be restricted to a closed elite.
  3.  **Cross-Party Committee System:** Substantive legislative work will be routed through specialized committees where party whips are relaxed, encouraging deliberation based on evidence rather than party line.
  4.  **Electoral Thresholds:** To prevent the fragmentation of the parliament into irreconcilable ethnic micro-parties, a reasonable electoral threshold will be maintained, encouraging broader coalitions *before* elections rather than unstable horse-trading *after* them.

  **VI. STATEMENT OF COST**

  The Commission must state plainly what this recommendation costs us.

  By retaining political parties, we are institutionalizing a mechanism that Simone Weil correctly identified as inherently prone to corruption. We are accepting that the new Parliament will, at times, prioritize political survival over truth. We are accepting that MPs will sometimes be pressured to silence their judgment. We are accepting that the "collective passion" of the electorate may be manipulated for electoral gain.

  This is a moral compromise. We choose this compromise not because parties are good, but because the alternative—a state unable to govern itself or accountable to no one—is worse. The cost of this decision is eternal vigilance. The Constitution cannot cure the human tendency toward faction; it can only channel it. If the citizenry and the representatives do not actively cultivate the individual judgment Weil demands, the legal safeguards we propose will eventually be hollowed out.

  We are building a system for humans as they are, not as they ought to be. We choose the risk of partisanship over the certainty of chaos.

  **VII. RECOMMENDATION**

  The Drafting Committee recommends the Plenary adopt the Electoral Law with the provisions for registered political parties, subject to the internal democracy and conscience protections outlined in Section V.

  **Signed,**

  *The Drafting Committee on Legislative Structure*
  *Constitutional Commission*
