          *   **Crucial:** Commit to an actual verdict/position. Do not end on "reasonable people disagree."
          *   Nuance is allowed (qualified answer).

  2.  **Deconstruct the Philosophical Landscape:**
      *   *The Optimist Case:* Testimony works for facts (Peru exists). Why not values? We rely on critics daily. If a trusted expert says it's good, believing it is rational. Denying this leads to skepticism about art criticism.
      *   *The Pessimist Case:* Aesthetic judgment requires *experience*. It's not just propositional knowledge ("Film X is good"); it's a response ("Film X moves me"). Kant's *sensus communis*. The "acquaintance principle." If you haven't felt it, you don't *know* it's beautiful, you just know *someone else thinks* it is.
      *   *The Moral Parallel:* Doing good because told vs. doing good because understood. Virtue requires internal motivation. Similarly, aesthetic appreciation requires internal resonance.
      *   *The Distinction:* Propositional knowledge (knowing *that*) vs. Experiential knowledge (knowing *what it's like* / appreciative knowledge).

  3.  **Formulate a Thesis/Verdict:**
      *   I need to take a side. A pure Optimist view feels too reductive (ignores the phenomenology of art). A pure Pessimist view feels too elitist/impractical (ignores how we actually navigate culture).
      *   *Best Path:* A Qualified Pessimism (or a Nuanced Distinction).
      *   *Thesis:* Testimony can justify *belief* in a proposition (e.g., "This film is widely regarded as brilliant"), but it cannot justify the *aesthetic judgment* itself (e.g., "This film is brilliant" *as an expression of taste*). The friend is confusing factual knowledge with appreciative understanding. We can trust critics to guide us, but we cannot appropriate their judgment as our own without the requisite experience.
      *   *Refinement:* Let's argue that aesthetic judgments are *normative* claims about response, not just *descriptive* claims about quality. Therefore, testimony fails to transfer the *authority* to make the claim, even if it transfers the *information*.

  4.  **Drafting - Section by Section:**

      *   **Introduction:**
