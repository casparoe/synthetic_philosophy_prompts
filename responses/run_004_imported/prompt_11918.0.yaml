answer: |-
  **The Borrowed Jacket: Why Aesthetic Testimony Cannot Substitute for Experience**

  The disagreement you describe is a classic philosophical intuition pump, one that cuts to the heart of how we value art. Your friend's analogy is seductive in its simplicity: if we trust experts on the existence of Peru, the age of the earth, or the safety of a vaccine, why should the quality of a film be held to a stricter evidential standard? This is the core of the "Optimist" position regarding aesthetic testimony. It appeals to our desire for efficiency and consistency. If we reject testimony in aesthetics, do we not risk a paralyzing skepticism where we can only speak on what we have personally verified?

  However, your nagging sensation—that claiming a film is "brilliant" without seeing it feels like reporting someone else's opinion rather than holding your own—aligns with the "Pessimist" tradition, stretching from Kant to contemporary philosophy of art. This intuition suggests that aesthetic judgments are fundamentally different from geographical facts.

  To resolve this, we must look beyond a simple tally of pros and cons. We need to understand *what* an aesthetic judgment actually is. The Optimist treats "This film is brilliant" as a statement of fact about the object, similar to "This film is 120 minutes long." The Pessimist treats it as a report on a relationship between the object and a viewer. By analyzing this distinction, we can arrive at a definitive verdict: Your friend is mistaken. While testimony can rationally guide your *actions* (what to watch), it cannot rationally ground your *judgments* (what is beautiful). You can trust the critic, but you cannot appropriate their taste as your own.

  **The Optimist's Case: Consistency and Efficiency**

  The Optimist argument relies on the principle of uniformity. We navigate the world almost entirely on testimony. You believe Napoleon lost at Waterloo not because you were there, but because historians say so. You believe your friend is honest because others vouch for them. In this view, aesthetic properties are just another set of facts waiting to be transmitted. If a critic like Roger Ebert or Mark Kermode says a film is brilliant, they have perceived a property ("brilliance") that exists in the film. By trusting their competence and honesty, you inherit their knowledge.

  There is a strong pragmatic force here. Life is short; art is long. If we insist on first-hand acquaintance for every aesthetic claim, our cultural vocabulary would shrink drastically. We would be unable to discuss the merits of *The Godfather Part II* if we haven't recently re-watched it. The Optimist argues that denying testimony renders art criticism pointless. If a review cannot transfer knowledge of quality, what is its function? Merely to suggest? The Optimist insists it should be able to inform belief.

  Furthermore, the Optimist points to the moral parallel. If a moral expert tells you that a specific action is unjust, and you believe them, you are not necessarily morally deficient. You have aligned yourself with the truth. Why should aesthetics be more demanding than morality?

  **The Pessimist's Core: The Acquaintance Principle**

  The Pessimist response does not deny that critics are useful. Instead, it challenges the nature of the belief being formed. The central pillar of Pessimism is the "Acquaintance Principle": a judgment of beauty must be based on first-hand experience of the object.

  Why? Because aesthetic value is not mind-independent in the way geography is. Peru exists whether you or I believe in it. Its existence does not rely on human response. However, "brilliance" in a film is not a physical property like mass or duration. It is a relational property. It emerges from the interaction between the film's formal qualities and a viewer's cognitive and emotional faculties. When Kant argued that unanimous critical agreement shouldn't settle a judgment of taste, he was pointing out that aesthetic judgment claims a "subjective universal validity." It says, "This pleases me, and it *should* please you."

  If you adopt the judgment solely on testimony, you are skipping the "pleases me" part. You are asserting the "should" without the grounding sensation. This is where the moral analogy actually hurts the Optimist. In moral philosophy, there is a strong intuition that acting rightly *only* because an authority told you to is less virtuous than acting rightly because you understand the reason. If you don't steal only because you fear punishment or obey a rule, you haven't necessarily grasped the value of honesty. Similarly, if you call a film brilliant only because a critic did, you haven't grasped the beauty; you've only grasped the critic's reputation.

  This explains your nagging feeling. When you say "Peru exists," you are reporting a fact about the world. When you say "This film is brilliant," you are implicitly reporting a fact about *your response* to the world (or a claim about how others *ought* to respond). To make that claim without the response is to speak without authority. It is like wearing a jacket that doesn't fit; you have the outer appearance of the opinion, but you aren't inside it.

  **The Verdict: Credence vs. Conviction**

  So, who is right? The Optimist is right about *credence*, but the Pessimist is right about *conviction*. This distinction allows us to commit to a verdict without falling into skepticism.

  It is entirely rational to give *credence* to a critic. If ten trusted reviewers say a film is brilliant, it is rational to believe that *you will likely find it brilliant* if you watch it. It is rational to spend your money and time on it. In this sense, testimony is a perfect guide for action. Your friend is correct that we rely on this constantly.

  However, it is irrational to claim *conviction* based solely on that testimony. You cannot justifiably assert "This film is brilliant" as your own aesthetic judgment. You can only assert, "This film is reputed to be brilliant," or "I am confident I will find it brilliant."

  The reason the Peru analogy fails is that "Peru exists" is a proposition that is true regardless of your engagement with it. "This film is brilliant" is a proposition that becomes true *for you* only through your engagement with it. Aesthetic testimony can tell you that the conditions for brilliance are present in the film, but it cannot trigger the realization of that brilliance in your mind.

  Consider the difference between knowing a joke is funny and laughing at the joke. A friend can tell you, "Trust me, this punchline is hilarious." You can believe them (credence). You can even repeat the joke to others, warning them it's funny. But until you get the joke yourself, you haven't actually experienced the humor. To insist "It is funny" without laughing is to misunderstand what "funny" means. "Funny" isn't a property of the words; it's a property of the reaction to the words. "Brilliant" is the same.

  **Why This Matters**

  Committing to this Pessimist verdict preserves the integrity of both art and criticism. If the Optimist were right, art criticism would become a mere transmission of data, and our engagement with art would become a checklist of approved properties. We would value art for its certified status rather than its impact.

  By accepting that testimony cannot hand you a genuine aesthetic judgment, we acknowledge that art demands something of us. It demands attention, sensitivity, and the risk of disagreement. Even if every critic on earth calls a film a masterpiece, you retain the right—and the responsibility—to watch it and find it dull. If you simply adopt their verdict, you haven't participated in the culture; you've merely cataloged it.

  **Conclusion**

  Your disagreement with your friend stems from a category error. They are treating aesthetic value as a mind-independent fact, like geography. You are sensing that it is a mind-dependent response, like humor or love.

  Therefore, the verdict is this: It is reasonable to use reviews to decide *what to watch*, but it is unreasonable to use them to decide *what to think*. You can trust the critic's prediction, but you cannot borrow their judgment. To call a film "brilliant" without watching it is not to hold an opinion on the film; it is to hold an opinion on the critic.

  So, tell your friend this: You are willing to bet on the film's quality based on their word, but you are not willing to sign your name to the judgment. Until you have sat in the dark and let the film work on you, the word "brilliant" remains a borrowed jacket. It may look like it fits, but you know it isn't yours.
