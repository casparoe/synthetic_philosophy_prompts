      *   *Short-Run Non-Neutrality:* Hume explicitly acknowledges a transition period. When new money enters, it doesn't raise all prices instantly. It benefits the first receivers (merchants/manufacturers) who can hire labor before wages/prices rise. This stimulates industry.
      *   *Policy Recommendation:* Does Hume argue for *continuous* expansion? This is the crux. Hume suggests a *gradual* increase is beneficial *compared* to a sudden increase or a decrease. However, he does not advocate for infinite expansion. He recognizes limits.
      *   *Specie-Flow Mechanism:* In "Of the Balance of Trade," Hume argues that money levels self-correct internationally. If a country has too much money, prices rise, exports fall, imports rise, money flows out until equilibrium is restored.
