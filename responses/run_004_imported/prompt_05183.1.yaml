answer: |-
  The intuition that hypocrisy undermines the standing to blame is powerful. It resonates with the common rhetorical move you described: dismissing a climate activist because she flies, or a politician because of a scandal. R. Jay Wallace has provided the most sophisticated philosophical defense of this intuition. He argues that moral blame is a communicative practice that presupposes a relationship of equal moral standing between the blamer and the blamed. When a hypocrite blames, she implicitly exempts herself from the norm she invokes, thereby denying that equality and forfeiting her standing.

  However, this account is fundamentally mistaken. Hypocrisy is a vice of character, but it is not a freestanding defeater of moral standing. The validity of a moral address depends on the moral reality of the situation and the norms invoked, not the moral purity of the messenger. Wallace's "equal standing" argument fails because it conflates moral *status* with moral *performance*, and it misdiagnoses the actual sources of our discomfort with hypocritical blame. That discomfort is better explained by independent factors such as insincerity, manipulative intent, or complicity—factors that can exist without hypocrisy, and hypocrisy without them.

  ### The Independence of Moral Truth and Moral Messenger

  The primary error in Wallace's account is the assumption that the authority to enforce a norm depends on one's adherence to it. This conflates the *content* of the moral claim with the *character* of the claimant.

  Consider a mathematical analogy. If a mathematician who frequently makes calculation errors points out a flaw in your proof, her track record does not strip her of the standing to identify the error. The validity of the correction rests on the rules of mathematics, not her purity as a practitioner. Morality functions similarly. If the norm "do not steal" is valid, then a theft is a violation of that norm regardless of who points it out. To argue that a thief lacks the standing to condemn theft is to suggest that moral norms only bind those who have not yet violated them, or that only the sinless can speak of sin. This creates a "clean hands" doctrine of moral speech that is elitist and practically paralyzing. Since moral perfection is rare, Wallace's view implies that moral discourse should largely cease.

  ### Where the "Equal Standing" Argument Fails

  Wallace's specific mechanism—that hypocrisy denies equal standing—collapses under scrutiny for two reasons.

  **1. Equality of Status vs. Equality of Performance**
  Wallace argues that by blaming while violating a norm, the hypocrite implies she is *exempt* from the norm, placing herself above the blamed party. This assumes that hypocrisy necessarily involves a belief in exemption. However, many hypocrites suffer from *akrasia* (weakness of will). They acknowledge the norm applies to them equally, admit they are failing, yet still blame others for the same failure. In this case, there is no denial of equal standing; there is merely a shared failure to meet a standard. If I say, "We both know smoking is bad, and I hate that I do it, but you shouldn't do it either," I am not claiming superior status. I am acknowledging our shared vulnerability. Wallace's account cannot explain why we might still feel this blame is defective, because his specific defect (denial of equality) is absent.

  **2. The Paradox of Privilege**
  Paradoxically, Wallace's defense of equality creates a hierarchy. By granting standing only to those who comply with the norm, he establishes a moral aristocracy where the "virtuous" have the right to speak and the "fallen" must remain silent. This is a far greater violation of equal standing than hypocrisy. True moral equality implies that all rational agents have the capacity to recognize moral reasons and hold one another accountable, regardless of their personal track record. Stripping a wrongdoer of the right to blame treats them as a second-class moral agent, incapable of participating in the normative community.

  ### The Real Culprits: Insincerity and Complicity

  If hypocrisy does not strip standing, why does it feel so objectionable? The intuitive force of Wallace's cases is not due to hypocrisy *per se*, but to independent factors that often accompany it. When we剥离 (peel away) these factors, the hypocrisy remains, but the loss of standing disappears.

  **1. Insincerity and Manipulative Intent**
  Often, what we object to in hypocritical blame is not the inconsistency, but the *insincerity*. If a politician condemns adultery while secretly committing it, he may not believe in the norm he is invoking; he is using the norm as a weapon to gain political advantage or deflect scrutiny. This is a form of lying or manipulation. The blame is defective because it is not a genuine moral address; it is a strategic move.
  However, imagine a "tortured hypocrite"—someone who genuinely believes in the norm, regrets their own violation, yet still feels compelled to blame others to uphold the standard. This person is hypocritical (violating the norm they enforce) but sincere. It is difficult to argue they lack standing. Their blame may be painful to hear, but it is morally authoritative because it stems from a genuine commitment to the value. Wallace's account lumps the manipulator and the tortured soul together; the distinction shows that insincerity, not hypocrisy, is the standing-defeater.

  **2. Complicity and Deflection**
  In cases of shared wrongdoing, the objection to blame is often that it functions as *deflection*. If we are both stealing from the till, and I blame you to draw attention away from my own theft, my blame is complicit in a cover-up. The problem here is not that I am a thief (hypocrisy), but that I am using blame to evade responsibility (complicity).
  If, however, I blame you for stealing while admitting my own theft and accepting punishment for it, the deflection is neutralized. I am still a hypocrite (a thief blaming a thief), but I am no longer using the blame to secure an unfair advantage. In this scenario, the "tu quoque" response loses its bite. This demonstrates that the loss of standing in typical cases is driven by the unfairness of the *transaction* (deflection), not the structural inconsistency of the *agent*.

  ### Hypocrisy as Symptom, Not Cause

  Wallace treats hypocrisy as a freestanding standing-defeater. He argues that the very structure of hypocritical blame undermines the presuppositions of the practice. The view defended here suggests hypocrisy is merely a *symptom* of other issues that might undermine blame, such as a lack of good will, manipulative intent, or a refusal to accept reciprocal accountability.

  When we dismiss the climate activist because she flies, we are often committing a genetic fallacy. We are attacking the source to avoid the argument. If her criticism of carbon emissions is sound, her personal failure to meet that standard makes her human, not wrong. To deny her standing is to protect the status quo by silencing all but the perfect.

  Furthermore, allowing hypocrites to blame serves a vital social function. It allows for moral progress. If I struggle with a vice but try to hold others (and myself) to a higher standard, my blame can be a tool for self-regulation and community maintenance. If I am stripped of standing the moment I slip, I am cast out of the moral community entirely, which reduces the incentive to reform. Acknowledging that a wrongdoer retains the standing to blame affirms that they remain a full member of the moral community, capable of recognizing the good even when they fail to do it.

  ### Conclusion

  R. Jay Wallace's argument provides a compelling rationalization for the "tu quoque" instinct, but it does not withstand philosophical scrutiny. The claim that hypocrisy denies equal standing confuses moral status with moral performance and inadvertently creates a hierarchy of the virtuous. The residual force of the intuition against hypocritical blame is fully explained by independent factors: the insincerity of the blamer, their complicity in the harm, or their use of blame as a shield rather than a sword.

  Hypocrisy is a vice, and it may make the blamer annoying, untrustworthy, or psychologically complex. But it does not negate the moral reality of the wrong being blamed. To argue otherwise is to grant wrongdoers a immunity shield: as long as they can point out the flaws of their accusers, they need not answer for their own actions. Defending the standing of the hypocrite is not an endorsement of hypocrisy; it is a defense of the objective authority of moral norms over the subjective purity of those who invoke them.
