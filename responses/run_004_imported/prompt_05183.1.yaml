      *   **Target:** R. Jay Wallace's influential argument (from *Responsibility and the Moral Sentiments* and related papers) that hypocritical blame lacks standing because it denies the "equal standing" presupposed by moral address.
      *   **Task:** Argue *against* Wallace's account.
      *   **Thesis to Defend:** Hypocrisy is *never* by itself sufficient to undermine standing to blame. Any intuitive force behind rejecting hypocritical blame is actually explained by independent factors (complicity, insincerity, etc.), not the structural inconsistency of hypocrisy itself.
      *   **Specific Requirement:** Explain specifically where the "equal standing" argument fails (treating hypocrisy as a freestanding defeater vs. a symptom).

  2.  **Deconstruct Wallace's Argument (The Target):**
      *   *Core Claim:* Hypocrites lack the standing to blame.
      *   *Reasoning:* Moral blame is a communicative practice presupposing equality between agents. When a hypocrite blames, they exempt themselves from the norm they enforce on others. This implies they are "above" the norm or that the norm applies differently to them. This violates the condition of equal moral standing.
      *   *Result:* The blame is "disqualified" or lacks authority.

  3.  **Develop the Counter-Argument (The Thesis):**
      *   *Core Claim:* Hypocrisy does not negate standing.
      *   *Reasoning:* The truth of a moral claim or the validity of a moral address does not depend on the moral purity of the speaker.
      *   *Alternative Explanations:* Why do we dislike hypocritical blame?
          *   *Complicity:* If the blamer is also guilty, they might be deflecting attention (tu quoque), but that doesn't make the blame *false*, just strategically suspect.
          *   *Insincerity:* If they don't believe the norm, the speech act is infelicitous, but not necessarily lacking in *standing* (authority to speak truth).
          *   *Distraction:* It shifts focus from the wrongdoer to the blamer.
      *   *Critique of Equal Standing:* The "equality" Wallace talks about is about moral status, not moral track record. A sinner can recognize a sin. Denying them the right to point it out actually creates a hierarchy where only the sinless can speak.

  4.  **Structure the Essay/Response:**
      *   **Introduction:** Acknowledge the prevalence of the hypocrisy charge (as per the prompt's context). State Wallace's position clearly. State the counter-thesis (Hypocrisy is not a freestanding defeater).
