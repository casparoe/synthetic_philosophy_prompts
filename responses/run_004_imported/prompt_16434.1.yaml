      *If I prioritize Equalized Odds:* I have to lower scores for Group A (making them uncalibrated) to reduce false positives.
      *Decision:* I will advise that Calibration is the technical anchor, but the *threshold* decision is where the policy lever sits. However, the DS is right: you can't have both properties simultaneously with different base rates.

  9.  **Structure of the Output:**
      1.  Validation (Yes, it's a famous theorem).
      2.  The Theory (Impossibility Theorem).
