      *(Self-Correction during drafting)*: Actually, in US Fair Lending (ECOA), Disparate Impact is the big hammer. If the model causes a disparate impact (which different error rates might imply, or rather the acceptance rates do), the bank needs a "Business Necessity" defense. Calibration *is* that defense. Breaking calibration weakens the defense. So, prioritize Calibration, but document the impact.

      *Wait, one nuance:* The prompt says "among people who would NOT have defaulted... one group gets tagged high-risk way more often." This is False Positive Rate disparity. This means Group A is being denied credit unfairly more often than Group B *among creditworthy people*. This is a classic fairness concern.
