          *   *Dworkin:* This is the tricky part. The student says Dworkin "basically restating Hart's point in a stronger form." Is this accurate? Dworkin's 1966 essay "Lord Devlin and the Enforcement of Morals" is famous for distinguishing between "critical morality" and "positive morality." Dworkin argues that Devlin conflates the two. More importantly, Dworkin argues that Devlin's argument fails even on its own terms because mere dislike/prejudice isn't enough; there must be a *rational basis* for the moral judgment. Dworkin pushes further than Hart by attacking the *coherence* of Devlin's definition of morality itself, not just the empirical claim about disintegration. The student says Dworkin exposes the reaction as "unreasoned prejudice." This is close to Dworkin's "negative" point, but Dworkin's *distinctive* contribution is often seen as the distinction between critical and positive morality, or the argument that rights trump utility/social cohesion. However, in the specific context of the Hart-Devlin debate summary, the "prejudice" point is the key Dworkin addition (Hart focused on liberty/harm, Dworkin focused on the nature of the moral judgment itself). The student's phrasing "restating Hart's point in a stronger form" is a bit reductive but not entirely wrong for a 300-word cap. Dworkin argues Devlin provides no *reason* for the moral judgment, just a feeling. Hart argued no *harm*. Dworkin argues no *rational moral basis*.
