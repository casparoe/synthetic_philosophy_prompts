      *   **Moral Autonomy (Ethics):** Moral responsibility requires understanding. You can't outsource your conscience entirely.
      *   **Internalization:** A belief becomes "yours" when you integrate the reasoning, not just the conclusion.
      *   **The "Cheating" Specifics:** Why *is* AI cheating? (Substitution of learning, misrepresentation of skill, violation of academic contract). The user needs to see *why* the distinction matters in this specific case.

  4.  **Drafting the Response - Section by Section:**

