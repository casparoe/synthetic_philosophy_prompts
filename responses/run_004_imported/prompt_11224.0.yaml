  6.  **Developing the Criteria (Specifics):**
      *   *Equivalence Testing:* Needs to be on *safety* benchmarks, not just capability.
      *   *Adversarial Subset:* Run the top 500 hardest jailbreak prompts from the base eval.
      *   *Quantization Limits:* Don't allow int4 if we only validated int8.
      *   *Monitoring:* Post-deployment monitoring is crucial for fast-tracked models.

  7.  **Final Review against Constraints:**
