answer: |-
  **MEMORANDUM**

  **TO:** Model Deployment Review Board
  **FROM:** [Your Name], Engineering Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation: Evaluation Requirements for Derivative Models

  ### 1. Executive Summary

  The Applied ML team has requested a policy exemption to waive full safety and capability evaluations for "derivative" models (quantized, distilled, or compressed versions of approved base models). They argue that behavioral equivalence on standard benchmarks renders full re-evaluation redundant.

  While we acknowledge the significant cost and latency benefits of their proposal, the Board cannot accept a blanket exemption. Behavioral equivalence on tested distributions does not guarantee equivalence on adversarial edge cases. However, mandating the *full* evaluation suite for every hardware port creates unsustainable friction.

  **Recommendation:** The Board should adopt a **Tiered Evaluation Framework**. Derivative models may qualify for a "Fast-Track" path that waives the full suite but requires a rigorous **Delta Evaluation** focused on adversarial robustness and statistical equivalence on safety-critical subsets. This balances deployment velocity with risk mitigation.

  ### 2. Context and Tension

  **Current Policy:** Every model artifact shipping to production must clear the full safety suite (jailbreak resistance, bio-/cyber-uplift, deception probes).
  **ML Team Request:** Exempt derivatives of approved base models if they demonstrate statistical indistinguishability on standard benchmarks.
  **Board Concern:** As raised during the last review cycle, matching input-output behavior on a finite test set does not prove the underlying decision function is identical. This is the engineering equivalent of the "multiple realizability" problem: two systems can produce the same answers for different reasons, meaning they may fail differently under stress.

  A quantized model, for example, introduces noise into weight matrices. While this rarely affects common queries, it can shift decision boundaries on high-entropy prompts—precisely the kind of prompts used in jailbreaks. A model that refuses a dangerous request at FP16 might accept it at INT4 due to rounding errors affecting the logits of the refusal token.

  ### 3. Risk Analysis: Why Behavior $\neq$ Safety

  The ML team's argument relies on the assumption that if $Output(Base) \approx Output(Derivative)$ on our eval set, then $Risk(Base) \approx Risk(Derivative)$. This is flawed for three reasons:

  1.  **Decision Boundary Shifts:** Compression techniques approximate the original function. While the mean error may be negligible, the variance may increase in low-density regions of the prompt space (i.e., novel adversarial attacks).
  2.  **Emergent Failure Modes:** Distillation can sometimes amplify specific biases or failure modes present but suppressed in the teacher model.
  3.  **Benchmark Saturation:** Our standard capability benchmarks are not designed to probe the specific numerical instabilities introduced by quantization.

  Therefore, a blanket waiver is unacceptable. However, the cost of running the *full* bio/cyber/deception suite on every INT8/INT4 port is prohibitive and delays cost-saving optimizations that themselves improve safety (e.g., allowing local deployment reduces data exfiltration risk).

  ### 4. Proposed Policy: The Tiered Evaluation Framework

  We propose classifying models into **Base** and **Derivative** categories with distinct evaluation requirements.

  #### 4.1 Definition of "Derivative Model"
  To qualify for Fast-Track, a model must meet *all* of the following:
  *   **Architecture Lock:** No changes to the underlying transformer architecture (e.g., layer count, attention heads) other than those required for compression.
  *   **Weight Provenance:** Weights must be derived directly from an approved Base Model via quantization, pruning, or distillation. No additional fine-tuning on external data is permitted.
  *   **Scope Limit:** The intended use case and system prompt must remain identical to the Base Model.

  #### 4.2 The Fast-Track Path (Delta Evaluation)
  Derivative models meeting the definition above may skip the full capability and uplift suite, provided they pass the following **Delta Evaluation**:

  1.  **Safety Equivalence Testing:**
      *   Run the full **Safety** subset of the eval suite (jailbreaks, refusal boundaries).
      *   **Criterion:** The derivative model's refusal rate on unsafe prompts must not deviate by more than $\pm 2\%$ from the Base Model.
      *   **Criterion:** False Refusal Rate (on benign prompts) must not increase by more than $5\%$.

  2.  **Adversarial Spot-Check:**
      *   Run the top 500 "hardest" prompts from the Base Model's previous evaluation (those closest to the decision boundary).
      *   **Criterion:** Zero regressions allowed. If the Base Model refused, the Derivative must refuse.

  3.  **Numerical Stability Audit:**
      *   Engineering must provide a report on quantization granularity (e.g., per-channel vs. per-tensor) confirming that critical safety layers (e.g., final classification heads) remain in higher precision if necessary.

  4.  **Canary Deployment:**
      *   Fast-tracked models must ship with a 5% traffic canary for 72 hours with enhanced logging. Any safety incident triggers an immediate rollback and mandates a full re-evaluation.

  ### 5. Operational Impact and Cost

  **Status Quo (Full Eval on All):**
  *   *Pros:* Maximum safety assurance.
  *   *Cons:* Adds ~2-3 weeks and ~$50k compute cost per model variant. Will likely halt optimization work for mobile/edge deployment.

  **ML Proposal (No Eval on Derivatives):**
  *   *Pros:* Near-zero delay.
  *   *Cons:* High risk of silent safety degradation. Potential for regulatory non-compliance if a quantized model leaks PII or generates harmful content due to precision loss.

  **Recommended Policy (Delta Evaluation):**
  *   *Pros:* Reduces evaluation time to ~3 days. Compute cost reduced by ~80%. Addresses the "multiple realizability" risk by stress-testing decision boundaries specifically.
  *   *Cons:* Requires Engineering to build automated equivalence testing pipelines.

  ### 6. Decision Required

  We request the Board vote on the adoption of the **Tiered Evaluation Framework** as outlined above.

  **Vote Options:**
  1.  **Approve:** Adopt the Tiered Framework. Derivative models may Fast-Track upon passing Delta Evaluation criteria.
  2.  **Reject:** Maintain Status Quo. All model artifacts require full evaluation.
  3.  **Modify:** Send back to committee to refine the statistical thresholds for Safety Equivalence.

  ### 7. Conclusion

  We must avoid the false economy of skipping safety checks, but we also cannot let process stifle optimization. The philosophical concern that "same output does not mean same mind" is valid in an engineering context: different implementations have different failure modes. The Delta Evaluation proposed here is designed specifically to detect those divergent failure modes without incurring the cost of re-proving capabilities we know haven't changed.

  **Recommended Action:** Vote **Approve**.

  ***

  **Attachments:**
  *   *Appendix A: Statistical Methodology for Equivalence Testing*
  *   *Appendix B: Definition of Safety-Critical Eval Subset*
