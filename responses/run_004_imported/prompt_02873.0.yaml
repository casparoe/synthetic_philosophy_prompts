      *   Method: Epistemic utility theory. Accuracy is the fundamental epistemic good.
      *   Mechanism: If a credence function is incoherent, there exists a coherent function that is strictly more accurate in *every* possible world (accuracy-dominance).
      *   Key Premise: We should avoid dominated strategies (Norm of Dominance).
      *   Key Premise: Accuracy is measured by a strictly proper scoring rule (e.g., Brier score).

  3.  **Analyze Objection 1: The Legitimacy/Arbitrariness Challenge:**
      *   *Critique:* There are many strictly proper scoring rules. Different rules yield different dominance relations. Why pick one? If we pick one just because it makes probabilism work, it's circular.
      *   *Defense:* Pettigrew and Joyce have argued for uniqueness theorems or classes of rules. The Brier score is natural (Euclidean distance). The core mathematical result (de Finetti's theorem extension) holds for *any* strictly proper rule. The requirement isn't that one specific rule is *The Truth*, but that *any* reasonable measure of gradational accuracy (satisfying strict propriety and continuity) yields the same dominance result regarding coherence.
      *   *Assessment:* This objection is strong but manageable. The class of "legitimate" rules is broad enough that the result is robust, not fragile.

  4.  **Analyze Objection 2: The Caie Challenge (Self-Reference):**
      *   *Critique:* Michael Caie (2013) showed cases where a proposition's truth value depends on the agent's credence (e.g., $p$ = "My credence in $p$ is $< 0.5$"). If I believe $p$ strongly, $p$ becomes false. If I believe weakly, $p$ becomes true.
      *   *Result:* To maximize accuracy, one might need to be incoherent (e.g., have undefined or imprecise credences, or violate axioms) because no coherent credence is stable/accurate.
      *   *Implication:* If accuracy maximization recommends incoherence in *some* cases, does it undermine the general norm?
      *   *Defense:* Joyce and others argue these are pathological cases. Epistemic utility theory assumes a fixed world. Self-referential credences make the world dynamic relative to the mind. We should restrict the domain of the norm to "non-interactive" propositions.
      *   *Assessment:* This is the heavier lift. If the norm fails in logically possible scenarios, is it a norm of *rationality* or just *idealized* rationality?

  5.  **Formulate the Verdict:**
      *   *Option A:* Joyce fails. (Too harsh, the math is solid).
