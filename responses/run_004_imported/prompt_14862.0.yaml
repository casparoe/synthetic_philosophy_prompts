answer: |-
  **Setting:** *A quiet corner of a conference hall, shortly after a panel on Causal Inference in Decision Theory. Two coffee cups sit on a table between them. **David** is a metaphysician, wearing a slightly rumpled blazer. **Jim** is a philosopher of science, tapping a stylus against a tablet displaying a Directed Acyclic Graph.*

  **David:** You know, seeing Judea Pearl get the rock-star treatment in the rationalist blogs again reminds me of how much work we still have to do on the foundations. Everyone loves the do-calculus, but they treat the ontology as settled. It isn't.

  **Jim:** Ontology is the trap, David. That's the whole point of *Making Things Happen*. We don't need an ontology of "causal glue." We need to know how to manipulate the system. But I assume you're itching to talk about Suzy and Billy.

  **David:** I am. Late preemption. The litmus test. Suzy throws, her rock hits, bottle shatters. Billy throws, his rock would have hit a split second later if Suzy's had missed. Intuitively, Suzy caused the shattering. Billy did not.

  **Jim:** And on that verdict, we agree. Suzy is the cause. Billy is a preempted backup. So where's the friction?

  **David:** The friction is in *why* we agree. In my 1973 account, simple counterfactual dependence failed here. If Suzy hadn't thrown ($\neg C$), the bottle still would have shattered ($E$), thanks to Billy. So $E$ does not depend on $C$. I had to patch it in 1986 with stepwise dependence. There's a chain of events: Suzy throws, rock is in mid-flight, rock strikes, bottle shatters. Each link counterfactually depends on the previous one. Transitivity saves the day.

  **Jim:** And that's where you lose the plot. You're constructing a metaphysical fairy tale about "events" in possible worlds to save a reductive analysis. My account is simpler. We model this with structural equations. $S$ for Suzy, $B$ for Billy, $E$ for shattering. $E = \max(S, B)$. To test if $S$ causes $E$, we intervene on $S$. We set $S=0$ via an intervention.

  **David:** Ah, there it is. The magic word. "Intervention."

  **Jim:** It's not magic. It's the $do$-operator. $P(E | do(S=0))$. When we intervene on Suzy to prevent her throw, we break the incoming arrows to $S$. We hold the background conditions fixed—including Billy's disposition to throw. Under that intervention, if $S=0$, then $E=0$ (assuming Billy doesn't throw because the protocol says we're testing Suzy). Wait, no—in late preemption, Billy *is* disposed to throw.

  **David:** Exactly. If you just set $S=0$, Billy still throws, $B=1$, and $E=1$. So $E$ still doesn't depend on $S$ under a naive intervention.

  **Jim:** That's why we use the specific causal model structure. In late preemption, Billy's throw is a function of Suzy's *failure*, not her throw. But an intervention on $S$ cuts the link between $S$ and its causes; it doesn't automatically trigger Billy unless the model specifies $B$ is a function of $S$. In the standard preemption model, we treat $S$ and $B$ as exogenous variables determined by the agents. If I intervene to set $S=0$, I am asking: "What if Suzy is prevented from throwing, but Billy's decision process remains as it was?" In the actual world, Billy decided to throw *regardless*, waiting to see if Suzy missed. So, if I intervene on $S$, $B$ remains 1.

  **David:** Then you get the wrong result! If $S=0$ and $B=1$, then $E=1$. So $E$ does not change. Your interventionist test says Suzy is *not* a cause.

  **Jim:** Hold on. You're conflating the variables. We need to distinguish the *process*. If we model the trajectory, Suzy's rock being in mid-flight ($M$) is the mediator. $S \to M \to E$. Billy's rock ($N$) is a backup. $B \to N \to E$. The structural equation for $E$ is $\max(M, N)$. If I intervene on $S$, $M$ becomes 0. But $N$ depends on $B$ and $\neg M$. This is why we need the full DAG. If I intervene on $M$ directly—knocking Suzy's rock out of the air—then $N$ activates. But if I intervene on $S$ *before* the decision is finalized... look, the point is, interventionism handles preemption by specifying the *pathway*. We check if there is an active path from $S$ to $E$ that is invariant under interventions on off-path variables.

  **David:** You're dancing. You're adding structure to the model to get the answer we already know is true. But my deeper worry isn't about the verdict on Suzy. It's about the definition of "intervention." You define a cause as something that makes a difference under an *intervention*. But how do you define an intervention?

  **Jim:** An exogenous change to a variable that breaks its dependence on parents...

  **David:** ...without affecting other variables *except through the causal structure*.

  **Jim:** Precisely.

  **David:** Do you see the circle? You define "cause" using "intervention," and you define "intervention" using "cause" (i.e., an intervention must not affect variables except via *causal* paths). You are explaining the obscure by the equally obscure. It's viciously circular.

  **Jim:** It's not vicious, David. It's elucidatory. I'm not trying to reduce causation to non-causal terms. I'm trying to explicate the concept of causation for the purpose of explanation and control. The circle isn't a bug; it's a feature of a thick concept. If you want to know what a cause is, look at what you do to manipulate it.

  **David:** But that abandons the project of analysis! I am a Humean. I believe in Humean Supervenience. The truth about causation must supervene on the mosaic of local particular matters of fact. My counterfactuals are cashed out in terms of similarity relations between possible worlds. It's reductive. I tell you what *makes* the causal claim true. You're just telling me how to *find* it, assuming you already know what causation is.

  **Jim:** And your "similarity relation" is where your house of cards collapses. How similar is similar? To solve preemption, you need a similarity metric that prioritizes avoiding small miracles over matching particular facts. Who decides that? It's subjective. You're smuggling in your intuitions about causation to weight the worlds, then claiming you've derived causation from the worlds.

  **David:** I provide a system of weights! Miracles are weighted heavily.

  **Jim:** Why? Because you know miracles break causal laws. You're relying on your prior grasp of causation to set the weights for your counterfactuals. So you're just as circular as I am, but you're hiding it behind modal realism.

  **David:** There is a massive difference. My circularity is at the level of justification for the weights, but the *truth conditions* are non-causal. A world is a world. A mosaic is a mosaic. Even if I get the weights wrong, the *kind* of thing I'm pointing to is physical particularities. You are pointing to... what? "Manipulability"? But manipulability presupposes an agent, and agency is causal. You've made causation anthropocentric. If there were no agents to intervene, would the bottle still shatter because of Suzy?

  **Jim:** Yes. Because the *possibility* of intervention is what matters, not the actuality. The causal structure exists independently of whether anyone actually manipulates it. It's about the counterfactuals of *what would happen if* an intervention occurred. It's objective invariance.

  **David:** But the definition of that "if" relies on causal arrows! You say an intervention is a change that doesn't violate the causal structure. But we are trying to define the causal structure! You can't use the map to draw the territory if the map is printed on the territory.

  **Jim:** Let's grant the circularity for a moment. What is the payoff? My account tells you *why* we care about causation. We care because we want to predict the effects of our actions. Your account gives you a metaphysical grounding that is useless for science. You can't run a regression on possible worlds. You can't test similarity metrics in a lab. You can test invariance. If a generalization holds under a range of interventions, it's causal. If it breaks, it's accidental. That is a working distinction.

  **David:** It's a pragmatic distinction, not a metaphysical one. You've changed the subject. I asked "What is causation?" You answered "How do we use causation?"

  **Jim:** And I say your question is a pseudo-problem generated by the demand for reduction. Why do you need reduction?

  **David:** Because without it, you have no truth conditions! If "intervention" is primitive and causal, then your theory doesn't tell me what makes a causal claim *true* in the actual world. It just tells me how causal claims relate to one another. It's coherentist, not foundationalist. If I ask, "Is it true that Suzy caused the shattering?" you say, "Yes, because it fits the interventionist model." I ask, "What makes the model correct?" You say, "Because it captures the causal relations."

  **Jim:** No. The model is correct because it supports prediction and control. The "truth" of a causal claim is tied to its utility in inference. Look, David, even Pearl admits the arrows in the DAG cannot be inferred from data alone. They require assumptions. Those assumptions are causal. You want to eliminate them; I want to make them explicit.

  **David:** But if they are assumptions, they are not derived. And if they are not derived from the Humean mosaic, what are they? Ghosts?

  **Jim:** They are structural constraints on the world. Think of it this way: Your Humean mosaic is a static image. Causation is the grammar that allows you to read the image as a narrative. You can't reduce grammar to ink blots.

  **David:** I can if I treat the ink blots as temporal sequences governed by laws!

  **Jim:** And where do the laws come from? The Best System Analysis? That's just summarizing the mosaic. But the direction of causation—the asymmetry—doesn't fall out of the laws easily. Entropy? That's thermodynamic, not causal. Interventionism builds the asymmetry in: you can intervene on the cause to change the effect, but not vice versa.

  **David:** Because you defined it that way! You built the asymmetry into the definition of intervention. I derive the asymmetry from the asymmetry of counterfactual dependence, which comes from the asymmetry of miracles and the temporal ordering of events.

  **Jim:** Which relies on your subjective weighting of miracles! We are back to square one. Look, let's be honest. The rationalists love Pearl because he gives them tools. They don't care about Humean Supervenience. They care about decision theory. If I tell an agent "Maximize expected utility using causal probabilities," they need to know which probabilities are causal. My theory tells them: the ones that are invariant under intervention. Your theory tells them: the ones that track counterfactual dependence across closest possible worlds. Which one can they actually compute?

  **David:** Computability isn't truth.

  **Jim:** For agents embedded in the universe, it is. If you can't compute it, it's not a cause you can use. And if you can't use it, in what sense does it exist?

  **David:** In the sense that the bottle shattered because of Suzy, regardless of whether any agent was there to calculate the DAG.

  **Jim:** And I agree the bottle shattered because of Suzy. I just deny that the "because" reduces to non-causal facts. It's a primitive structural feature of the world.

  **David:** Then you're a causal realist of the thickest sort. You believe in causal powers.

  **Jim:** I believe in causal structures. Powers sounds too Aristotelian. I'm a structural realist.

  **David:** And I'm a Humean. And I think your structural realism is just a way to avoid the hard work of grounding truth conditions. You've built a beautiful engine, Jim, but you haven't told me what fuel makes it run. You assume causation to explain causation.

  **Jim:** And you've built a beautiful mirror, David, but it reflects nothing but your own intuitions about possible worlds. You assume similarity to explain causation.

  **David:** *touches coffee cup* Touché.

  **Jim:** *smiles* So, Suzy caused the shattering?

  **David:** Yes. Stepwise counterfactual dependence.

  **Jim:** Yes. Invariance under intervention on the Suzy-variable.

  **David:** We agree on the world.

  **Jim:** We just disagree on the map.

  **David:** And whether the map is allowed to contain the word "North" without defining it in terms of magnetic fields.

  **Jim:** Exactly. Do you want another coffee?

  **David:** Only if the causal mechanism of the machine is invariant.

  **Jim:** I'll intervene on the order button.

  **David:** Please do.
