          *   **Crucial:** Reach a specific verdict/commit to a position (no fence-sitting). A qualified conclusion is okay, but it must be a stance.
          *   **Tone:** Thoughtful, philosophical yet grounded in biology, empathetic to the user's situation.

  2.  **Deconstruct the Arguments:**

      *   **Case For (DNA as Code/Information):**
          *   *Semiotics:* DNA has syntax (codons) and semantics (amino acids). It's discrete, digital (A, C, G, T), and context-independent at the translation level.
          *   *Causal Specificity:* Changing the sequence changes the outcome predictably (e.g., sickle cell, cystic fibrosis). This implies instructional content.
          *   *Evolutionary History:* Natural selection acts on heritable information. The "program" analogy explains fidelity and variation.
          *   *Utility:* It works. Genetic engineering (CRISPR) relies on the assumption that editing the text edits the outcome.

      *   **Case Against (DNA as Metaphor/Hyperbole):**
          *   *Developmental Systems Theory:* Organisms are built by interactions, not blueprints. DNA is a resource, not a commander.
          *   *Context Dependence:* Epigenetics, maternal environment, cellular machinery, and stochastic noise determine expression. A "typo" in one context is silent in another.
          *   *Homunculus Fallacy:* Who is reading the code? If DNA is instructions, who is the reader? It risks dualism.
          *   *Reductionism:* It ignores the holistic nature of biological systems. Traits emerge; they aren't "written."

  3.  **Determine the Verdict:**
      *   The user asks for a commitment. The prompt suggests a qualified conclusion is acceptable ("code-talk holds up at the level of the codon table but not at the level of traits").
      *   *My Position:* I will argue for a *stratified* verdict. The "code" metaphor is ontologically real at the molecular translation level (micro) but becomes a dangerous heuristic at the phenotypic/organismal level (macro). However, to be decisive, I need to frame this not just as "it depends," but as "the metaphor is *true* regarding mechanism but *false* regarding agency/causality."
      *   *Refinement:* I will argue that DNA is indeed a code, *but* it is not a *script* for the organism. It is a code for building proteins, not for building *you*. The counselor's slip was shifting from "code for proteins" to "code for traits." This distinction is crucial for the user's peace of mind regarding the "typo."

  4.  **Drafting - Section by Section:**

