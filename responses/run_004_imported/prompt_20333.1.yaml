  *Position:* The "code" metaphor is **ontologically legitimate at the molecular level but functionally misleading at the organismal level.** I will argue that treating it as a code for *traits* is the error. I will side with the user's intuition that the counselor's extension of the metaphor was the shaky part.

  8.  **Final Outline:**
      *   Intro: The weight of words in the clinic.
      *   Argument A: The Digital Reality (Why it *is* a code).
      *   Argument B: The Developmental Context (Why it *isn't* a script).
