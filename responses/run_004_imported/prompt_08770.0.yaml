answer: |-
  You had the stronger case. While the executive's argument relies on a romantic, centuries-old intuition (*in vino veritas*—"in wine, there is truth"), it does not hold up under modern psychological, neurological, or ethical scrutiny. Your friend was likely persuaded by the rhetorical elegance of the analogy (comparing drinking to courage training), but the analogy itself is fundamentally flawed.

  Here is a breakdown of why the executive's reasoning fails and why your counter-argument is more sound.

  ### 1. The "True Self" Fallacy
  The executive's core premise is that sobriety is a "performance" and intoxication is an "unmasking." This assumes that social inhibition is a lie and impulse is the truth.

  *   **Neuroscience:** Alcohol is a depressant that inhibits the prefrontal cortex, the part of the brain responsible for executive function, impulse control, and consequence assessment. When someone gets drunk, they aren't necessarily revealing their "deep character"; they are operating with a compromised braking system.
  *   **Character vs. Impulse:** Character is generally defined not by what you feel or impulse toward, but by how you manage those impulses. A person who is kind only when their inhibitions are chemically suppressed isn't "revealed"; they are temporarily disabled. Conversely, a person who remains reserved when drunk isn't necessarily "hiding"; they may simply have a higher tolerance or a different physiological reaction.
  *   **The Chemically Altered State:** You are correct that drunkenness is a chemically altered state. It creates emotions and reactions that might not exist in a sober state. Aggression, maudlin sentimentality, or recklessness under the influence are often artifacts of the intoxication, not latent truths waiting to be found.

  ### 2. The Flawed Analogy: Courage vs. Impairment
  The executive argued that drinking strengthens judgment and self-command in the way facing danger strengthens courage. This is a category error.

  *   **Agency:** Courage requires agency. To build courage, you must consciously recognize fear and choose to act despite it. This strengthens the neural pathways associated with resilience and decision-making. Alcohol *removes* agency. It blurs the recognition of risk.
  *   **Transferability:** If you practice public speaking, you get better at public speaking. If you practice facing a fear of heights, you build resilience against heights. But if you practice making decisions while intoxicated, you are practicing making decisions *while impaired*. There is no evidence that this builds a transferable capacity for *sober* judgment. In fact, it risks normalizing impaired decision-making.
  *   **The Better Analogy:** A more accurate analogy would be suggesting that to build a surgeon's steady hand, they should practice surgery while wearing thick gloves. You aren't strengthening the underlying skill; you are introducing a handicap that obscures the feedback loop necessary for improvement.

  ### 3. The Power Dynamic and Coercion
  There is a practical element to this that undermines the executive's philosophical stance.

  *   **Voluntary vs. Mandatory:** For an exercise to build "self-command," it must be voluntary. In a corporate hierarchy, a suggestion from a senior executive is often interpreted as a requirement. Subordinates may drink more than they intend to in order to appear compliant or "team-oriented."
  *   **Inequity:** This "test" is not applied equally. It disadvantages non-drinkers (for religious, health, or personal reasons), those with lower alcohol tolerance, and those with a history of addiction. It conflates alcohol tolerance with professional fortitude, which is logically baseless.

  ### 4. Why Your Friend Was Persuaded
  It is easy to see why your friend found the argument persuasive. It appeals to a few seductive ideas:
  *   **Stoicism:** It frames drinking as a trial of endurance rather than a recreational vice.
  *   **Insider Access:** It promises a shortcut to knowing people's "real" selves, which is appealing in a corporate environment where people are often guarded.
  *   **Authority Bias:** Coming from a senior executive, the argument carries the weight of experience, even if the logic is flawed.

  ### Conclusion
  The executive's reasoning is a post-hoc rationalization for a heavy-drinking company culture. It mistakes **disinhibition** for **authenticity** and **intoxication** for **resilience training**.

  You were right to reject it. Drunken behavior is a poor metric for professional character, and deliberately impairing a team's cognitive function is not a valid method for strengthening judgment. If anything, the executive's insistence on this policy reveals more about *their* character (specifically, a reliance on blunt instruments for team building and a lack of nuance regarding employee well-being) than it does about the employees.
