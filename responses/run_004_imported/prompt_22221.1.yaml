      *   *Check:* Is the verdict clear? I need to make sure I don't waffle. I will explicitly state: "This is not a continuum. It is a cliff."
      *   *Character Application:* Ensure the language speaks to the writer. Use terms like "the green room," "the briefing," "the mirror."

  6.  **Final Polish:**
