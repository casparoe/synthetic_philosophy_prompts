      *   Useful for character? Yes.

  *(Self-Correction Note)*: Wait, if I argue for Rupture, does that invalidate the Natality argument? No. It means Natality is the *engine*, but Modern Lying is the *crash*. The engine was designed for movement, but when turned inward upon itself, it destroys the vehicle. I need to make sure that link is clear. The capacity is the same; the application has mutated into something suicidal for the polity.

