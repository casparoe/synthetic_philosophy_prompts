      *   **Section 1: The Noble Lie (Natality).** Explain the "Continuity" side. Lying as action. The freedom to say "no" to what is. This is where the press secretary starts. "Managing the message" feels like agency.
      *   **Section 2: The Modern Shift (The Pentagon Papers).** Explain the "Rupture" side. The shift from hiding secrets to "problem solving." The RAND corporation mindset. Coherence over truth.
      *   **Section 3: The Verdict (Self-Deception).** Why is this a rupture? Because the traditional liar *knows* the truth. The modern liar *forgets* it. This destroys the "common world." It's not politics anymore; it's solipsism scaled up.
      *   **Conclusion:** Bring it back to the character. The tragedy isn't just moral corruption; it's ontological homelessness. He loses the world.

