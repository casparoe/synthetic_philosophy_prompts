  9.  **Final Polish:** Check for clarity, historical fidelity, and sensitivity. (Ensure I don't put words in Galileo's mouth he didn't say, but extrapolate logically from his stated principles). *Self-correction: Make sure to mention that Galileo distinguished between 'demonstrated truth' and 'opinion'. He would demand we be sure the science is solid. Given the consensus, he'd likely agree it is.*

