      *   *Principle 2:* The Holy Spirit's intent in Scripture is to teach "how to go to heaven," not "how the heavens go." (Attributed to Cardinal Baronius, endorsed by Galileo).
      *   *Principle 3:* Physical matters should not be decided by Scripture. We should start with sensory experience and necessary demonstrations.
      *   *Principle 4:* If a physical proposition is *demonstrated* (proven true beyond doubt), then Scripture passages appearing to contradict it must be reinterpreted.
      *   *Principle 5:* If a physical proposition is *not* demonstrated (only probable/opinion), we should stick to the literal sense of Scripture to avoid scandal.
      *   *Principle 6:* The Church has authority over doctrine/salvation, but nature is open to observation. However, Galileo acknowledges the Church's right to decide on scriptural interpretation *once* the science is settled.

  3.  **Evaluate the Modern Context against Galileo's Principles:**
      *   *The Science:* Is modern cosmology (Big Bang, age of universe) and evolutionary biology "demonstrated" in Galileo's sense?
          *   Galileo meant mathematical/physical necessity (like geometry). Modern science is empirical, probabilistic, and model-based. It's stronger than Galileo's heliocentrism (which lacked stellar parallax proof at the time), but is it "necessary demonstration"?
          *   *Consensus:* The evidence is overwhelming (radiometric dating, cosmic background radiation, genetic commonality). To a modern mind (and likely Galileo's), this counts as "demonstrated" truth about the natural world.
