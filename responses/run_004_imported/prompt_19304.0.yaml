answer: |-
  Thank you for being here.

  For those who knew my mother as a professor, this room might feel familiar, and yet, different. For those who knew her only as a mother, an aunt, a sister, or a friend, I know this might feel strange. There are no black armbands. The casket is plain wood, unadorned. And in a moment, we are not going to sit in silence; we are going to make music.

  These were her instructions. She was very specific about them.

  For nearly forty years, my mother taught the *Zhuangzi*. She lived inside that text. She argued with it, she laughed at it, and eventually, she let it teach her how to leave. She asked us to gather today not to deny death, but to meet it in the way she spent her life studying: with a clear eye and an open heart.

  Many of you know the story she loved best. It is from Chapter 18, "Perfect Happiness." Zhuangzi's wife dies. His friend Huizi comes to offer condolences and finds Zhuangzi sitting on the ground, drumming on a basin and singing. Huizi is horrified. He says, "You lived with her, she raised your children, and now you drum and sing? Is this not too much?"

  It is easy to hear that story and think it is about not caring. It is easy to think Zhuangzi is saying, "Do not feel pain."

  But my mother always pointed out the lines that come before the drumming. She reminded her students that when his wife first died, Zhuangzi said, "I was distraught. I grieved like anyone else." He did not start with the song. He started with the loss. He had to walk through the grief before he could see the larger transformation.

  So, to my family, and to anyone here today who feels a hole in the world where she used to be: Your grief is not a failure of understanding. Missing her does not mean you have missed the point of her life. Zhuangzi grieved. My mother grieved. And we are grieving. That initial shock, that tearing away, is the cost of loving someone deeply. We honor her by feeling the weight of her absence.

  But she also asked us to look at where she is going.

  Zhuangzi explains that life is like the progression of the four seasons. We emerge from the formless, take shape, breathe the breath of life, and then return to the great flow. To stop the flow, to cling to the form, is to misunderstand the nature of things.

  She applied this to her own body, too. There is another passage, near the end of the book, where Zhuangzi is dying. His disciples want to give him a lavish funeral. He tells them no. He says, "I will have heaven and earth for my inner and outer coffin, the sun and moon for my jade ornaments, the stars for my pearls. The crows and kites will eat me."

  His disciples say, "We are afraid the birds will eat you."

  Zhuangzi replies, "Above ground the birds eat me, below ground the ants eat me. Why would you favor the ants over the birds?"

  My mother chose the birds. She chose the plain box. She chose to return her materials to the cycle without embalming fluids or barriers. This was not about saving money, and it was not about being difficult. It was an act of trust. It was her final lesson in equality—that she is not separate from the earth that will receive her.

  She taught for forty years that freedom comes from loosening our grip. Not from not loving things, but from loving them without trying to freeze them in time. She loved us fiercely. But she did not try to own us, and she did not want us to try to own her memory.

  So, how do we hold both truths? How do we hold the pain of losing her, and the joy of her release?

  We do it by following her instructions. We acknowledge the grief—we are here, eleven days later, and we are still hurting. But we do not let the grief become a wall. We let it be a bridge.

  She asked for music because music is the closest thing we have to the transformation she described. A note is struck, it sounds, and then it fades. It does not disappear; it becomes silence, it becomes the air, it becomes the memory of the sound. If we hold the note too long, it becomes noise. If we let it go, it becomes part of the song.

  My mother has finished her verse. The silence she left is heavy, and it is real. But the song is not over.

  In a moment, we are going to sing. We are not singing because we are not sad. We are singing because she taught us that sadness and joy are not opposites; they are partners in the dance of life. We are singing to acknowledge that while the form has changed, the *qi*, the breath that animated her, the love she gave us, has not vanished. It has just changed shape.

  Thank you for loving her. Thank you for missing her. And now, please, pick up the instruments. Let's send her off the way she taught us to live: loudly, together, and without fear.
