answer: |-
  This is an exceptionally sharp observation, and it cuts to the heart of a major debate in American political history. You are absolutely right that the tension you identify—between rejecting the Constitution as irredeemably corrupt versus embracing it as a redeemable foundation—is one of the defining conflicts in the struggle for civil rights.

  However, there is a crucial plot twist in the story of Frederick Douglass that resolves the puzzle you've uncovered. The short answer is: **Frederick Douglass changed his mind.**

  The view you describe—that the Constitution is a "covenant with death and an agreement with hell"—was indeed Douglass's position during his early years as a lecturer for William Lloyd Garrison's American Anti-Slavery Society. But he did not hold that view for the rest of his life. In fact, the later Douglass, whose rhetoric heavily influenced Martin Luther King Jr., came to argue the exact opposite: that the Constitution was, in its text and spirit, an anti-slavery document.

  Here is the breakdown of that evolution and why it matters for your question about civil rights strategy.

  ### 1. The Garrisonian Phase (1841–1851)
  As you noted, when Douglass first emerged as a public speaker, he was a disciple of Garrison. The Garrisonians believed that because the Constitution contained compromises with slavery (the Three-Fifths Clause, the Fugitive Slave Clause, the 20-year protection of the slave trade), the Union itself was morally tainted. Their slogan was "No Union with Slaveholders."

  For this early Douglass, the Constitution was indeed "false advertising." He argued that you could not build a house of liberty on a foundation of chains. This is the Douglass captured in his 1845 *Narrative*, which is why it is the impression most readers take away from his early work.

  ### 2. The Break and the Reinterpretation (1851 onward)
  Around 1851, Douglass publicly broke with Garrison. There were personal and political reasons (Douglass wanted to launch his own newspaper, *The North Star*, which Garrison opposed), but there was also a profound intellectual shift.

  Douglass began to study the Constitution closely, influenced by legal theorists like Lysander Spooner and Gerrit Smith. He came to a conclusion that stunned his former allies: **The Constitution does not explicitly sanction slavery.**

  In his famous 1860 speech, *"The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"*, Douglass laid out his new argument:
  *   **Textualism:** He pointed out that the words "slave" or "slavery" appear nowhere in the document. The framers used euphemisms ("other persons," "such persons"). Douglass argued we should interpret the text by what it *says*, not by the secret intentions of the men who wrote it.
  *   **The Preamble:** He argued that the purposes of the Constitution listed in the Preamble ("to establish Justice," "secure the Blessings of Liberty") applied to *all* people within the jurisdiction, not just white people.
  *   **Political Power:** Douglass realized that if the Constitution was a pro-slavery pact, then Black people and abolitionists had no legal ground to stand on within the American system. If, however, the Constitution was anti-slavery, they could use the courts, the ballot box, and the legislature to destroy slavery.

  He famously declared: **"Interpret the Constitution according to its plain reading... and I defy the presentation of a single pro-slavery clause in it."**

  ### 3. Connecting Douglass to MLK
  This brings us to Martin Luther King Jr. When King described the Constitution as a "promissory note" in the *"I Have a Dream"* speech, he was not setting aside Douglass's judgment; he was standing squarely in the tradition of the **later** Douglass.

  King's metaphor relies on the idea that the founders signed a check (the Constitution/Declaration) that was good for "life, liberty, and the pursuit of happiness," but that it came back marked "insufficient funds" for Black Americans. The strategy is to demand the bank (the government) honor the check, not to burn the bank down.

  If Douglass had remained a Garrisonian, King's rhetoric would indeed have been a betrayal. But because Douglass shifted to the view that the Constitution contained the seeds of its own correction, King was actually being faithful to Douglass's mature political philosophy.

  ### 4. Was it just "Rhetorically Convenient"?
  You ask if building a strategy around "fidelity to the Constitution" is just a matter of convenience rather than honesty. This is a profound question about political realism.

  *   **The Garrisonian Approach:** Morally pure, but politically limited. If the system is hell, you must separate from it. This works for moral witness but rarely for legislative change.
  *   **The Douglass/King Approach:** Morally complex, but politically potent. By claiming the Constitution as their own, civil rights activists could claim they were the true patriots and that segregationists were the ones violating American law.

  It wasn't merely convenient; it was a strategic necessity for a minority group seeking rights within an existing legal order. To win in court (e.g., *Brown v. Board*), you have to argue that the Constitution protects you. To pass the Civil Rights Act, you have to argue it fulfills constitutional guarantees.

  ### 5. Why the Confusion Persists
  It is completely understandable why you came to your conclusion. Most people encounter Douglass through his *Narrative* (1845), which ends before his break with Garrison. His great speeches on the Constitution (1860) and his later autobiography (*Life and Times*, 1881) are read less frequently.

  Furthermore, modern critics (like some proponents of Black Nationalism or critical legal studies) sometimes revisit the Garrisonian critique. They argue that Douglass was too optimistic—that the Constitution *was* structurally white supremacist, regardless of the text. There is merit to that historical critique, but it is important to recognize that when Douglass argued for the 14th and 15th Amendments, he believed he was "re-founding" the Constitution to match its anti-slavery potential.

  ### Summary
  You have correctly identified a tension, but the tension exists within Douglass's own life, not between Douglass and King.

  1.  **Early Douglass:** Constitution is pro-slavery; reject it. (Garrisonian)
  2.  **Later Douglass:** Constitution is anti-slavery; claim it. (Political Abolitionist)
  3.  **MLK:** Constitution is a promissory note; cash it. (Civil Rights)

  King was channeling the later Douglass. The strategy wasn't about ignoring Douglass's judgment, but about adopting his evolved conclusion: that the most effective way to destroy oppression was not to reject the law, but to seize the law and force it to mean what it said.
