      *   **Explain the Shift:** Why did Douglass change his mind? (Legal analysis by Lysander Spooner, political pragmatism, the need for political action vs. moral suasion).
      *   **Connect to MLK:** Show how MLK's "promissory note" is a direct descendant of the *later* Douglass's view, not a betrayal of it.
