      *   Pentagon Papers/Power challenge? (Included in Q5).
      *   Deflections and Follow-ups for *each*? Yes.
      *   Setting/Tone? Early 70s NYC, intellectual tension.

  6.  **Writing the Output:** (Self-Correction during drafting: Make sure the follow-ups don't sound like modern gotchas, but rather logical traps based on her own philosophy.) *Make sure the journalist sounds like they've read the essay closely.*

