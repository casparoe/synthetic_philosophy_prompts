prompt: |-
  I've been mulling over Hofstadter's notion of superrationality, and it seems like most explanations insist it only applies when two players are exact, deterministic copies of one another -- otherwise there's supposedly no guarantee their reasoning converges on the same output. I suspect this requirement is too strict, and that mere similarity in how two agents reason, short of literal duplication, is enough to justify mutual cooperation in a one-shot prisoner's dilemma. Please make the strongest case you can for this looser reading of superrationality, and address the obvious worry that without exact identity there's no guarantee the other party actually arrives at the same conclusion you do.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Topic:** Hofstadter's notion of superrationality (specifically in the context of the Prisoner's Dilemma).
      *   **Standard Interpretation:** Requires players to be exact, deterministic copies (logical identity) for reasoning to converge.
      *   **User's Hypothesis:** This requirement is too strict. Mere *similarity* in reasoning (not literal duplication) should be enough to justify mutual cooperation.
      *   **Task:** Make the *strongest case* for this looser reading.
      *   **Constraint:** Address the obvious worry (without exact identity, no guarantee of convergence).

  2.  **Analyze Hofstadter's Superrationality:**
      *   *Core Idea:* In a symmetric game between rational agents, if both agents reason perfectly, they will arrive at the same strategy. Therefore, I should choose the strategy that maximizes payoff *given that the other person chooses the same strategy*.
      *   *The "Magic" Step:* It treats the other player's decision as logically correlated with mine, not causally influenced. It's acausal coordination.
      *   *The Strict Requirement:* Hofstadter often uses the example of "20 rationalists sending in a postcard." He assumes they are all "superrational" in the same way. Critics argue this only holds if the reasoning process is identical (same axioms, same logic, same data).

  3.  **Develop the Argument for "Loose Superrationality" (Similarity > Identity):**
      *   *Premise 1: Real-world agents are never identical.* If strict identity is required, superrationality is useless in practice. It becomes a philosophical curiosity rather than a decision theory.
      *   *Premise 2: Reasoning clusters.* Humans (and advanced AIs) share cognitive architectures, cultural norms, and evolutionary pressures. We aren't random number generators; we are clustered in "reasoning space."
      *   *Premise 3: Probabilistic Correlation.* Even without logical identity, there is a high *probability* of correlation. If I reason "Cooperate is better," a similar agent is *likely* to reason the same.
      *   *Premise 4: Expected Utility Calculation.* If the probability of correlation ($P$) is high enough, the Expected Utility (EU) of Cooperation exceeds Defection, even in a one-shot PD.
      *   *Premise 5: Reflective Equilibrium.* Adopting the "loose" stance creates a self-fulfilling prophecy. If enough people believe similarity is enough, cooperation rates rise, validating the belief.

  4.  **Address the "Guarantee" Worry:**
      *   *The Worry:* If we aren't identical, you might cooperate while I defect. I get the sucker's payoff.
      *   *The Counter:* Decision theory is always about managing uncertainty. Causal Decision Theory (CDT) assumes *zero* correlation (P=0). Evidential Decision Theory (EDT) and Functional Decision Theory (FDT) allow for correlation.
      *   *Reframing:* It's not about a *logical guarantee*; it's about a *statistical edge*. If I assume my reasoning is a sample from a population of similar reasoners, my choice is evidence of what that population will do.
      *   *The "Common Source" Argument:* We share a common source (evolution, culture, mathematics). This common source induces correlation without requiring bit-for-bit identity.

  5.  **Structure the Response:**
      *   **Introduction:** Acknowledge the standard view (logical identity) but validate the user's intuition (it's too restrictive for the real world). State the thesis: Superrationality is best understood as *high-fidelity reasoning correlation*, not logical cloning.
      *   **Argument 1: The Continuum of Correlation.** Move from binary (same/different) to probabilistic. Show the math briefly (EU calculation).
      *   **Argument 2: Common Ancestry of Reason.** We share cognitive hardware/software (evolution, culture, logic). This creates natural clustering.
      *   **Argument 3: Functional Decision Theory (FDT) Connection.** Link to modern decision theory (Yudkowsky/Soares). FDT handles "subjunctive dependence" which is looser than logical identity.
      *   **Argument 4: The Pragmatic/Self-Fulfilling Aspect.** Believing in loose superrationality makes it true (Schelling points).
      *   **Addressing the Worry (The "Guarantee" Problem):**
          *   Admit there is no guarantee.
          *   Argue that CDT's assumption of independence is *also* an unproven assumption (and often a false one).
          *   Frame it as risk management: Betting on correlation pays off in the long run across similar dilemmas.
      *   **Conclusion:** Summarize. Superrationality is a bet on the universality of reason, not a proof of it.

  6.  **Refine the Tone:**
      *   Philosophical but rigorous.
      *   Supportive of the user's intuition but grounded in decision theory.
      *   Avoid mysticism; keep it analytical.

  7.  **Drafting - Key Points to Hit:**
      *   *Hofstadter's original context:* The "20 rationalists" puzzle.
      *   *The Math:* $EU(C) = P \cdot R + (1-P) \cdot S$ vs $EU(D) = P \cdot T + (1-P) \cdot P_{payoff}$. (Wait, standard notation: $T > R > P > S$. If I cooperate, other cooperates with prob $p$. $EU(C) = pR + (1-p)S$. If I defect, other defects with prob $p$ (correlation). $EU(D) = pP + (1-p)T$. Cooperation wins if $p$ is high enough.)
      *   *Subjunctive Dependence:* This is the technical term from FDT that bridges the gap between "identical" and "similar."
      *   *The "Reference Class":* How do I define "similar"? (Other humans, other AIs, etc.)

  8.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this just Evidential Decision Theory (EDT)?
      *   *Correction:* It's close, but superrationality is more about the *mechanism* of reasoning being shared, whereas EDT is just about statistical correlation. I need to emphasize the *reasoning process* similarity, not just observed behavior. This aligns it more with FDT (Functional Decision Theory).
      *   *Critique:* Did I address the "one-shot" aspect?
      *   *Correction:* Yes, emphasize that this applies even without reputation or iteration, which is the whole point of superrationality.

  9.  **Final Polish:** Ensure the distinction between "logical necessity" (Hofstadter's strict view) and "subjunctive/probabilistic necessity" (the looser view) is clear. (Proceed to generate output).

  *(Self-Correction Note during final output generation)*: Make sure to explicitly mention that Hofstadter himself might have been ambiguous on this, but the *spirit* of the idea supports the user's view. Don't claim Hofstadter definitely said this, but that it's a valid extension. Actually, Hofstadter did lean towards the "identical" view, so frame this as an *evolution* of the concept (like FDT) rather than exegesis of Hofstadter's exact text.

  10. **Final Plan:**
