prompt: |-
  So I keep running into Quine's 'gavagai' example -- it shows up in NLP/linguistics blog posts whenever people talk about reference and grounding. Every writeup I've found gives the same setup and stops there: linguist points at a rabbit, native says 'gavagai,' could mean rabbit, or undetached rabbit-parts, or rabbit-stage, so translation is 'indeterminate,' spooky, the end. But that just reads like ordinary ambiguity to me, like an underspecified spec you'd nail down with more test cases -- why cant the linguist just ask more questions, point at different things over time, and use assent/dissent to rule out the weird readings? What's the actual argument that literally no amount of possible evidence, not just whatever we've collected so far, could ever settle it, and is that a genuinely different kind of claim than the usual 'theories are underdetermined by data' thing, or is Quine just dressing up the same point in fancier clothes? I want the real mechanics of the argument, not the rabbit anecdote again.
reasoning: |-
