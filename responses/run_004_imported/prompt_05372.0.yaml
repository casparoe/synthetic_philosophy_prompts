      *   *Argument against Intervention:* His deep understanding of ecological complexity. He knew that removing parasitoids leads to pest explosions. He viewed the "economy of nature" as a tight web. Tampering usually has unforeseen consequences. He was an empiricist, not a utopian engineer.
      *   *The Deciding Factor:* Darwin's distinction between *moral sympathy* and *practical capability*. In *The Descent of Man*, he speaks of sympathy reaching animals, but mostly in the context of cruelty (don't beat your dog), not ecosystem management. He viewed the "struggle for existence" as an immutable law of nature, not a policy error.

