      *   **User Persona:** Retired entomologist specializing in parasitoid wasps (Ichneumonidae), now studying moral philosophy. This implies a high level of technical knowledge about the biology and a genuine, deep engagement with the philosophical implications. They aren't asking for a basic summary; they want a nuanced, historically grounded extrapolation.
