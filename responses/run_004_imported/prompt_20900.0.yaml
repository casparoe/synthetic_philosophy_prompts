answer: |-
  **Setting:** *A university coffee shop, late afternoon. Two grad students, Alex and Jordan, are surrounded by scribbled napkins. Alex is tapping a pen against a copy of Van Fraassen's "Belief and the Will."*

  **Alex:** You're dodging the Dutch Book, Jordan. That's all it is. You're saying you'd walk away from a guaranteed loss just to spite Bas.

  **Jordan:** I'm not dodging the bookie; I'm questioning the table he's setting up. Look, the Reflection Principle says: *My current credence in A, conditional on my future credence in A being x, should be x.* Fine. But the escape hatch is right there in the fine print. It only applies if I regard my future self as rational.

  **Alex:** Exactly. That's the caveat, not a bug. If I know I'm going to get hit by a bus or dosed with LSD at 2 PM, I don't have to reflect my 3 PM credences. But if I expect to be rational? Then $C_{now}(A | C_{future}(A) = 0.9) = 0.9$. Anything else is incoherent.

  **Jordan:** But that's where the principle guts itself. It collapses into triviality. If I already judge my future self to be rational, that means I already endorse the evidence they're going to get. So I should just update on that evidence *now*. If I *don't* endorse the evidence—say, I know I'm going to read a biased news source tomorrow—then Reflection doesn't apply. So the principle is either telling me to do what Conditionalization already tells me to do, or it's silent.

  **Alex:** No, no. You're conflating *knowing the evidence* with *knowing the opinion*. Reflection is powerful precisely when I *don't* know what evidence I'll get. Imagine I'm waiting for a test result. I don't know if it'll be positive or negative. But I know that once I see it, I'll update properly. If I know that upon seeing the result my credence in "Disease" will jump to 0.9, I should set my credence to 0.9 *now*, even before I see the paper.

  **Jordan:** Okay, but let's press the Dutch Book argument you're so fond of. The setup is: I currently think $P(A) = 0.5$, but I know that tomorrow $P(A)$ will be $0.9$. The bookie sells me a bet on A for 50 cents today. Tomorrow, when my credence is 0.9, he sells me a bet against A for 90 cents. I lose 40 cents either way.

  **Alex:** Right. A guaranteed loss. Diachronic incoherence.

  **Jordan:** Here's the rub. Why *must* I accept that second bet tomorrow?

  **Alex:** Because tomorrow your credence *is* 0.9! You value the bet at 90 cents. If you refuse to buy or sell at your fair price, you're violating the very definition of credence as a betting quotient.

  **Jordan:** But tomorrow I'm a different epistemic agent. Or rather, the "me" of tomorrow has information the "me" of today doesn't. The Dutch Book argument assumes I should care about the "me" of today's wallet more than the "me" of tomorrow's rationality. But if the shift to 0.9 is driven by genuine evidence, then tomorrow's bet *is* fair. The loss isn't a penalty for irrationality; it's the cost of learning.

  **Alex:** It's not the cost of learning if you knew the shift was coming! If you know *now* that you will believe A to degree 0.9 tomorrow, you have effectively already received the information. To hold out at 0.5 is to say, "I know I will have good reason to believe A, but I refuse to believe it until I have the reason." That's obstinacy, not rationality.

  **Jordan:** Is it? Let's make it messy. Suppose I know that as I age, I tend to become more dogmatic. I look at my father; he's 0.9 confident in certain political theories he was unsure of at my age. I look at myself and think, "In twenty years, I'll probably be 0.9 confident in these same theories."
  Does Reflection demand I update to 0.9 *now*?

  **Alex:** Only if you think your future dogmatism is *rational*.

  **Jordan:** Aha! There's the circularity. How do I decide if it's rational? I have to evaluate the future credence. But Reflection is supposed to be the constraint *on* evaluating that future credence.
  If I think my future self is just biased, I exempt myself. But to think they're biased, I have to judge their future credence as unjustified. So I'm using my current judgment to validate the future credence before I apply the principle that tells me to adopt that credence. The principle adds no work. It just says, "Defer to future opinions you've already decided to defer to."

  **Alex:** You're treating "rationality" like a magical property. It's not. It's about the updating rule. If you believe your future self is updating by Conditionalization on a partition of evidence, Reflection holds. In your dogmatism case, you *don't* believe your future self is conditionalizing. You believe they're violating Bayesian norms. So Reflection correctly tells you: *Don't reflect.*

  **Jordan:** But how do I know they're violating norms *in advance*? That's the epistemic black box. If I could see the evidence they'll get, I'd just conditionalize. The whole point of Reflection is to handle cases where I know the *output* but not the *input*.
  Take the "Sleeping Beauty" style problems, or self-locating beliefs. I know my credence will shift just because time passes. Is that rational updating or just memory decay? If I say "It's rational," Reflection forces me to update now. If I say "It's decay," it doesn't. But the decision *is* the hard part! Reflection just pushes the hard part into the caveat.

  **Alex:** It doesn't push it away; it isolates it. Look, the Dutch Book isn't about money. It's about consistency in valuing propositions across time. If you say, "Right now, A is worth 50 cents," but you also say, "I know that tomorrow, a rational version of me will say A is worth 90 cents," you are asserting a contradiction in your valuation function.
  You're saying the *same* evidence state (your total knowledge now, which includes the fact of your future belief) supports two different prices.

  **Jordan:** But is it the same evidence state? My future self has the experience of the intervening time.

  **Alex:** But you *know* they will have that experience! That's what $C_{future}(A) = 0.9$ means in the conditional. You are certain that the future credence will be 0.9. That certainty is part of your current evidence. If you're certain you'll believe it, you should believe it. To do otherwise is to call your future self a liar.

  **Jordan:** Or it's to recognize that I'm a liar in the making!
  Okay, let's try this. Suppose I'm a skeptic. I think *all* high credences are unjustified. I know that tomorrow, after reading some persuasive rhetoric, I'll be 0.9 confident in some theory T. But right now, I think 0.9 is too high for *anything*.
  If I follow Reflection, I must jump to 0.9 now. But that violates my current norm that "0.9 is never justified."
  If I stick to my norm, I violate Reflection.
  Van Fraassen says I'm Dutch-Bookable. I say I'm being asked to abandon my current epistemic standards based on a prediction that I will abandon them. That's not coherence; that's capitulation.

  **Alex:** But if you think 0.9 is *never* justified, then you must think your future self will be irrational. So the caveat kicks in! You don't have to reflect.
  The principle isn't "Always defer to future self." It's "Defer to future self *unless* you have positive reason to think they're broken."
  In your skeptic case, you *do* have positive reason. You think the norm "0.9 is unjustified" is true. So you predict your future self violates a norm. Exemption granted.

  **Jordan:** But notice what happened. I had to use my *current* standards to judge the future standards.
  So Reflection isn't a constraint on my current credences. It's a constraint on my *assessment of my future rationality*.
  It tells me: "If you think you'll be rational, act as if you already are."
  But that's tautological. Of course if I think I'll be right, I think I'll be right. The hard question is: *When do I think I'll be right?*
  Especially in cases of foreseeable bias. I know I'll love my spouse more in ten years. I know my credence in "My spouse is faithful" will go up. Is that rational updating based on shared experience? Or is it motivated reasoning?
  Reflection gives me no help there. It just says, "If it's rational, update. If it's bias, don't." Thanks, Bas.

  **Alex:** It gives you help because it forces you to make that classification explicit. If you can't say *why* the future shift is irrational, you shouldn't assume it is.
  You're assuming your current self is the gold standard. But why? Your current self is just a temporal slice. If you have no evidence that the future slice is compromised—no evidence of brain damage, no evidence of bad evidence sources—then you must treat them as an epistemic peer. Actually, superior. They have more data.
  To refuse to reflect is to claim a kind of epistemic privilege for the present moment that you can't justify. It's temporal chauvinism.

  **Jordan:** It's not chauvinism, it's the only place I stand! I can't evaluate norms from nowhere. I have to evaluate them from *here*.
  And here's the Dutch Book counter-move. You say I lose money if I don't reflect. But suppose I don't reflect. I keep my credence at 0.5. Tomorrow comes, I see the evidence, I update to 0.9. The bookie tries to execute the second half of the Dutch Book.
  I can say to the bookie: "Wait. Yesterday I was ignorant. Today I know more. The fact that Yesterday-Me valued this bet at 50 cents is irrelevant to Today-Me who knows the evidence warrants 90 cents."
  Why should Today-Me care about protecting Yesterday-Me's wallet if Yesterday-Me was ignorant?

  **Alex:** Because Yesterday-Me *knew* Today-Me would be there! That's the loop. Yesterday-Me knew the shift was coming. If Yesterday-Me knew the shift was coming and didn't update, Yesterday-Me was effectively ignoring known information.
  The Dutch Book works because it exploits the gap between what you know *about your future beliefs* and what you believe *about the world*.
  If you close the gap, the bookie has no handle.

  **Jordan:** But the gap is where learning lives!
  If I already believe what I will believe, I haven't learned anything when the time comes. I've just waited.
  Reflection seems to demand that all learning be instantaneous. If I know I *will* learn it, I must know it *now*.
  But that destroys the concept of discovery. I can know I *will* be convinced by an argument without currently being convinced by it. I haven't seen the steps yet.

  **Alex:** But you're certain you *will* be convinced. That certainty *is* the conviction.
  If you say, "I am certain that tomorrow I will be 0.9 confident in A," but you are only 0.5 confident in A today... what are you certain of?
  You're certain that you will have a mental state. But if you trust that mental state is formed rationally, you are certain that the state tracks truth. So you should track it now.
  To separate the two is to say, "I trust my future reasoning, but I don't trust the conclusion of that reasoning." That's the real contradiction.

  **Jordan:** I trust the *process*, not the *outcome*, because I don't know the premises yet!
  Look, let's end on this. You say Reflection protects me from Dutch Books. I say Reflection protects me from Dutch Books only by forcing me to assume my future self is never biased in ways I can't currently name.
  It's a principle for angels who know their own updating functions perfectly. For humans, who know they have blind spots but don't know where they are... it's a trap. It tells me to defer to a future self I suspect might be blind, but forbids me from acting on that suspicion unless I can pinpoint the blindness *before* it happens.

  **Alex:** And I say that suspicion without evidence is just paranoia. If you can't pinpoint the blindness, you have no grounds to claim it exists. And if you have no grounds, the Dutch Book catches you.
  You'd rather lose money than admit that your current uncertainty about your future rationality is itself a form of irrationality.

  **Jordan:** Or I'd rather keep my wallet intact by admitting that sometimes, the only rational thing to do is wait and see if the future self was actually sane.

  **Alex:** *(Sips cold coffee)* Well. Bas isn't going to buy us a refill to settle this.

  **Jordan:** *(Grabs napkin)* Good. Because I think my future self will regret agreeing with you, and I'd hate to reflect that.

  **Alex:** *(Smiles)* Then by your own lights, you should disagree with me now.

  **Jordan:** Touché. But I'm still not buying the bet.
