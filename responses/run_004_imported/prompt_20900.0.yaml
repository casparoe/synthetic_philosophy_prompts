          *   Alex presses the Dutch Book: Even if you aren't sure *why* you'll shift, if you are sure *that* you will shift to 0.9, you must shift now.
      *   **Round 4: The Skeptic's Deep Cut (Distinguishing Updating from Bias).**
          *   Jordan: How do I distinguish "I will learn X" from "I will become overconfident"?
