      *   **Dutch Book Argument:** If you violate RP, a bookie can sell you a bet now and buy/sell a bet later to guarantee a loss.
      *   **Skeptic's Critique 1 (Triviality):** If I know I'll change my mind because I'm getting drunk, RP doesn't apply. If I know I'll change my mind because I'm getting new evidence, RP applies. But how do I know *which* it is without already having the opinion?
      *   **Skeptic's Critique 2 (Circularity/Empty Constraint):** RP says "defer to future self." But *when* should I defer? Only when I think future self is rational. But judging future rationality requires judging the very credences RP is supposed to constrain.
      *   **Defender's Rebuttal:** It's not about knowing the *content* of the evidence, but knowing the *process*. If I believe my updating rule is conditionalization, RP follows. The Dutch Book shows inconsistency in valuing bets across time.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Coffee shop or office. Establish the stakes.
