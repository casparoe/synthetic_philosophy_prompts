      *   **Round 2: The Skeptic's Trap (The "Why" of the Shift).**
          *   Jordan argues: I only accept the Dutch Book vulnerability if I *trust* the future credence. But if I trust it, I already believe $H$ is 0.9. So RP adds nothing.
          *   If I *don't* trust it (e.g., I think I'll be biased), RP doesn't apply.
          *   So RP is either redundant or inapplicable.
      *   **Round 3: The Defender's Counter (Information vs. Rationality).**
