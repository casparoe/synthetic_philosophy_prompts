  7.  **Refine the Content (Self-Correction during drafting):**
      *   *Correction:* I initially thought about mentioning Frege heavily. But the user mentions Frege. I should focus more on the contemporary debate (Gaskin vs. Hanks).
      *   *Nuance:* On the act view, the unity isn't *supplied* by the act; the proposition *is* the act type. The token is the thinking. I need to make sure the user distinguishes proposition types vs. tokens. Hanks says propositions are types of acts. The unity of the *type* is the issue.
      *   *Wait, actually:* Hanks argues that the unity of the proposition is derived from the unity of the act token. If the token is unified (because it's an event), the type inherits that. The user's objection targets the token. "An act-token has parts." Hanks would say "Yes, but it's a *single* event." The user needs to press: "What makes it a single event?"
