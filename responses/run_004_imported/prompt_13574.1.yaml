answer: |-
  **Setting:** *A university coffee shop, shortly after seminar. Alex (Selected-Effects) and Jordan (Causal-Role) are reviewing notes.*

  **Alex:** So, on the P450 case, my position is straightforward. The *proper function* of those enzymes is to metabolize plant secondary metabolites. That is why they were selected and maintained in the lineage. Detoxifying synthetic pesticides is merely a beneficial side effect. It's a classic exaptation. The pesticide didn't exist in the evolutionary past, so it cannot be the reason the trait exists.

  **Jordan:** But that feels disconnected from what the biologist is actually doing when she says, "The function of this enzyme is to confer resistance." She's explaining how the insect survives *now*, in this specific system. On the Cummins view, a function is just a component's contribution to a containing system's capacity. The system is the insect in a sprayed field; the capacity is survival; the enzyme contributes by breaking down the poison. That's a function, full stop.

  **Alex:** But if you call that a function, you lose the distinction between what a trait is *for* and what it merely *does*. If a mutation arises tomorrow that makes the enzyme glow in the dark, and that helps them mate in a new environment, is glowing suddenly a function?

  **Jordan:** Relative to the capacity of "successful mating in low light," yes. But look, I want to press you on how you individuate the historical effect. You say the selected effect is "breaking down plant metabolites." But selection doesn't act on descriptions; it acts on outcomes. Did selection favor the enzyme because it broke down *specific* plant molecules, or because it had the broader capacity to oxidize organic xenobiotics?

  **Alex:** It's the former. If it were the latter, you'd include too much.

  **Jordan:** Would it? P450s are promiscuous. They bind to a vast range of structures. If we describe the selected effect abstractly enough—"detoxifying lipophilic compounds"—then synthetic pesticides fall under that umbrella. They are chemically similar to the plant toxins. If you redescribe the selected effect broadly to capture the actual physiological mechanism, the pesticide counts. If you describe it narrowly to exclude the pesticide, you risk making the function so specific it doesn't explain why the enzyme handles *new* plant toxins either. Where do you draw the line before your view stops ruling anything out?

  **Alex:** That is the abstraction problem, I admit. But if I allow the broad description, I lose the normative force of the etiological account. I can't say the enzyme is *malfunctioning* if it fails to break down a pesticide, because it was never selected for that. I need the history to ground the norm. If I let the "selected effect" stretch to cover any chemical similarity, then history drops out, and I'm just doing your causal-role analysis with extra steps. I have to insist that the *historical* cause fixes the content, even if the boundary is fuzzy.

  **Jordan:** Fair enough. But then let me worry about my own boundary. You're going to ask me about promiscuity.

  **Alex:** Exactly. The enzyme generates heat when it catalyzes reactions. It has mass. It reflects light. In the "insect in a sprayed field" system, maybe the heat helps thermoregulation. Is thermoregulation a function of the P450 enzyme? If function is just "any contribution to a capacity," what stops *every* effect from being a function once you relativize it to whichever capacity is under discussion?

  **Jordan:** The constraint is the *analytical context*. We don't just ask "what does it do?" We ask "how does this component contribute to the capacity we are trying to explain?" If the biologist is explaining pesticide resistance, heat generation is irrelevant noise. It's not part of the analysis.

  **Alex:** But who decides the analysis? That makes function radically context-dependent. On your view, the enzyme has no intrinsic functions, only functions-relative-to-an-inquirer. That seems to undermine the idea that the organism itself has a functional organization. If I walk away, does the enzyme stop having the function of detoxification?

  **Jordan:** It stops having that function *for the explanation*. But look, Alex, your rigidity has a cost too. In the seminar, we discussed how quickly resistance spreads. If a population survives a new pesticide *because* of this enzyme, biologists treat that as the enzyme doing its job. If you say, "No, that's not a function, that's luck," you're forcing a philosophical distinction that doesn't map onto the biological practice. You're prioritizing the *origin* over the *current utility*.

  **Alex:** Because current utility can be accidental. If a rock blocks a burrow and saves a rabbit from a wolf, the rock's "function" isn't shelter. It's just a rock. The P450 enzyme is saving the insect, yes, but until there is selection *for* pesticide resistance specifically, it's the rock, not the shelter. Though... I grant you this: if the pesticide persists for hundreds of generations, the selected effect *will* shift. Then it becomes a function on my view too.

  **Jordan:** And on my view, it's a function immediately, which explains why the resistance spreads so fast—the capacity is already there. But I hear your worry. If I say "yes" to everything that contributes, I might call the heat generation a function just because someone decides to analyze thermoregulation. I need a way to privilege the *systemic* capacities that matter to the organism, not just the inquirer.

  **Alex:** Perhaps we're stuck between the "historical normativity" I need and the "current explanatory power" you need.

  **Jordan:** It seems so. You can't quite specify the selected effect without smuggling in causal similarities, and I can't quite limit the causal roles without smuggling in historical significance.

  **Alex:** So, for the P450 case?

  **Jordan:** It's a function for the ecologist studying the outbreak.

  **Alex:** And it's not a proper function for the evolutionary biologist studying the lineage's history.

  **Jordan:** Until the lineage catches up.

  **Alex:** Until then, we both have work to do. Coffee?

  **Jordan:** Coffee.
