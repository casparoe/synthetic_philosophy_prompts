      *   **Specific Debate:** Hempel's Covering-Law Model vs. Narrativist Pushback (Dray, Gallie, Danto).
      *   **Case Study:** The Fall of the Berlin Wall (November 9, 1989).
      *   **Key Tension:** Structural/Background causes (USSR withdrawal, economic collapse) vs. Contingency/Agency (Schabowski's press conference slip, the border guard's decision).
      *   **Requirements:**
          *   Dialogue format between a Covering-Law Historian (CLH) and a Narrativist Historian (NH).
          *   Evenly matched (no strawmen).
          *   Must address specific sticking points:
