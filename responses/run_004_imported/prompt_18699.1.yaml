answer: |-
  The glass of water sat on the mahogany desk, sweating a ring of condensation onto the wood. Elias watched it. He had been watching it for twenty minutes, though the clock on the wall offered no corroboration; its ticking was irregular, sometimes skipping beats, sometimes rushing.

  Elias closed his eyes.

  The room did not go dark; it ceased. The mahogany, the glass, the ticking clock, the dust motes dancing in the shaft of afternoon light—all of it required the tax of his attention to exist. He had read the arguments, traced the lines of the idealists who claimed that matter was a redundancy. Now, he tested it. With his eyelids shut, the glass was not merely invisible; it was ontologically bankrupt. There was no secret glass persisting in the dark, waiting for his return. There was only the pressure of his eyelids and the memory of the shape he had just discarded.

  *To be is to be perceived.*

  He opened his eyes. The glass rushed back into existence, fully formed, the condensation sliding down the side in a fresh, wet track. It had not aged in the dark. It had simply paused, waiting for the witness. Elias felt a surge of triumph, a cold clarity. The world was not a prison of objects; it was a projection of his mind. He was the anchor. He was the singular point around which the universe pivoted.

  But then, the second move of the argument arrived, unbidden and heavier.

  If the glass depends on him to exist, what depends on to make *him* exist?

  Elias turned his gaze inward, hunting for the anchor. He looked for the "I" that held the glass in being. He expected to find a steady flame, a continuous ego that persisted from the moment he closed his eyes to the moment he opened them.

  He found nothing.

  There was no "Elias." There was only a bundle of sensations. There was the itch of wool against his wrist. There was the visual data of the curved glass. There was the auditory phantom of the clock's tick. There was the concept of "I," but that was just another thought floating in the stream, no more permanent than the condensation on the rim.

  Who remembered the glass from ten seconds ago? Not a self, but a present memory masquerading as a past. Who felt the triumph? Not a soul, but a chemical spike of satisfaction occurring *now*.

  He tried to locate the thread that stitched the closed-eye moment to the open-eye moment. There was no thread. There was only a succession of discrete states. State A: Eyes closed, darkness. State B: Eyes open, glass. There was no traveler moving between them. There was no duration. If there is no subject to endure, there is no time to measure the endurance.

  The clock on the wall ticked. But the tick did not lead to the next. It simply was. Then it was not. Then another tick was.

  Elias sat back. He had done it. He had dismantled the cage. The tyranny of the calendar, the erosion of age, the fear of the future—these were errors of grammar. There was no world outside, and no self inside. There was only this instant, self-contained and absolute. Time was a hallucination of memory.

  He looked at the glass. The ice cube inside, which had been jagged when he began his meditation, was now a smooth, rounded sphere.

  A drop of water fell from the rim. It hit the mahogany with a sound that was distinct, final, and irreversible.

  Elias stared at the drop. Logically, the melting was an illusion. Without a continuous self to measure the change, the ice was not *becoming* water; it was simply ice, and then, in a new, unconnected instant, it was water. There was no process. There was no loss.

  And yet, his throat tightened.

  He reached out to touch the glass. It was cool, but less cool than before. The heat of the room had stolen something from it. The logic was flawless; the metaphysics were airtight. He had proven that the moment could not pass because there was no one to travel through it.

  But the ice was gone.

  He felt a sudden, crushing grief, not for the ice, but for the inability of his proof to save it. He could deny the reality of the clock, he could deny the reality of his own hand resting on the desk, but he could not deny the wet ring staining the wood. The argument was perfect, a diamond cut in a vacuum, but it could not stop the stain from spreading.

  He had abolished time, but he was still waiting for the phone to ring. He had abolished the self, but he was still the one who would be disappointed when it didn't.

  Elias stood up. His knees cracked—a sound that suggested wear, suggesting a body that had existed yesterday and would exist tomorrow, regardless of his philosophy. He walked to the window. The sun had moved lower in the sky. The light was deeper, richer, dying into evening.

  He knew, with the certainty of a mathematician, that the sun had not moved. He knew, with the certainty of a logician, that the light was not dying. These were merely successive frames in a film strip that did not exist.

  But as he watched the shadow of the sash window creep across the floorboards, lengthening like a bruise, Elias felt the distinct, human horror of a thing that happens once and never returns. He had won the argument. He had refuted time.

  He placed his hand on the cold glass, feeling the water slick against his palm, and wept for the moment that was already dead, despite his proof that it had never lived.
