      *   *Exchange 4:* Daniel challenges the transparency assumption. Is it free? Sofia says it's part of the protocol.
      *   *Exchange 5:* Daniel argues protocol choice is pre-game strategy. Sofia acknowledges this but says once in the protocol, logic holds.
      *   *Exchange 6:* Daniel pushes on "stipulated trust." Sofia distinguishes verification from trust.
