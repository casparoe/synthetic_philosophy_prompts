          *   *Ergodicity/Geometric Rationality:* You *must* choose $\log(w)$ (or similar) because of the *physics* of the process. If you maximize arithmetic mean in a multiplicative process, you go broke. It's not about preference; it's about survival/mathematical necessity in a non-ergodic system.
      *   **Who is right?** Both, but they are answering slightly different questions. The teacher is right about the *formalism* (it fits within EUT). The bloggers are right about the *interpretation/critique* (standard intro stats/econ often implicitly assume linear utility or ignore the time/ensemble distinction).

