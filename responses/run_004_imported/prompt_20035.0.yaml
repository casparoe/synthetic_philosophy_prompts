      *   **Strategy 1 (All-in):** Maximize $E[W_1]$. $E[W_1] = 1.1 W_0$. Over $N$ rounds, Arithmetic Mean return is $(1.1)^N$. *But*, probability of survival is $0.55^N \to 0$. Median wealth $\to 0$.
