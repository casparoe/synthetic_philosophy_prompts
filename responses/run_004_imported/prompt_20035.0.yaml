      *   **Blogger's Point:** Standard EUT is often taught/interpreted as maximizing *arithmetic* expectation of wealth ($E[W]$). The "ergodicity" argument says we should care about the time-average growth rate of a single trajectory, not the ensemble average across parallel universes.

  3.  **Evaluate the "Disagreement":**
      *   **Is the math different?** No. Kelly $\equiv$ Log Utility.
