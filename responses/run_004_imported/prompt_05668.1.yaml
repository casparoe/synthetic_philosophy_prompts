prompt: |-
  A few weeks ago I had a long, increasingly technical argument with a friend of mine, a biostatistician, about what it even means to say that a particular patient has a given percent chance of surviving five years. He maintained that any such figure is hostage to the reference class used to compute it: that a given patient belongs to indefinitely many equally legitimate comparison classes, that there is no non-arbitrary way to privilege one over the rest, and that a clinician who quotes a single number to a patient is dressing up a convention as a measurement. I pushed back that medicine cannot simply throw up its hands at this, since patients still have to make real decisions and need some number to act on. The disagreement has become more than academic, because I sit on the shared decision-making committee at the hospital where I work — the body that sets standards for how prognostic statistics are presented in patient decision aids — and a case matching our argument almost exactly has landed on the agenda.

  A 43-year-old patient with a rare sarcoma subtype is choosing between an aggressive resection with significant expected morbidity and a palliative approach, and wants a five-year survival estimate to help her decide. Her surgical oncologist quoted 61 percent, computed from a large national registry's broad category for her tumor site and stage. A specialist she consulted for a second opinion quoted 22 percent, computed from a pooled case series of fourteen patients matched on her specific genomic subtype and comorbidities. Both figures are correctly calculated from real data; they differ only in which population of "similar patients" was treated as the relevant comparison class, and a third reasonable clinician could very plausibly produce a third number from a third defensible class. The patient's family has concluded that someone on her care team is incompetent, and is demanding that the hospital simply state "the real number." On the committee itself, opinion has already split three ways: some members want to mandate the narrowest available reference class on the theory that specificity trumps everything; others want to mandate the broadest adequately powered class on the theory that small samples are unreliable; a few want to abandon point estimates for ranges entirely.

  Please draft the short memo I will circulate ahead of next week's meeting, recommending a concrete policy for how our oncologists should present survival statistics in cases like this one. I want the memo to commit to an actual recommendation rather than merely cataloguing the options already on the table, and I want it to engage seriously with my friend's underlying objection — that no such rule can be anything more than a convention dressed up as a methodology — rather than treating the choice of reference class as a narrow technical detail that any competent statistician could resolve.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Sender:** A member of the hospital's Shared Decision-Making Committee.
      *   **Audience:** Other committee members (clinicians, statisticians, ethicists, administrators).
      *   **Context:** A specific case (43yo sarcoma patient) where two oncologists gave vastly different survival probabilities (61% vs. 22%) based on different reference classes (broad registry vs. narrow genomic/comorbidity match). The patient's family is upset, demanding "the real number." The committee is split (narrow vs. broad vs. ranges).
      *   **Goal:** Draft a short memo recommending a *concrete policy* for presenting survival statistics.
      *   **Key Constraint 1:** Must commit to an actual recommendation, not just list options.
      *   **Key Constraint 2:** Must engage seriously with the philosophical objection (the Reference Class Problem) raised by the user's biostatistician friend. It cannot dismiss this as a technicality; it must acknowledge that any choice is partly conventional while arguing why a specific convention is ethically/clinically necessary.
      *   **Tone:** Professional, authoritative yet humble, ethically grounded, pragmatic.

  2.  **Deconstruct the Core Conflict:**
      *   *The Biostatistician's Point (The Reference Class Problem):* Probability is a property of a class, not an individual. An individual belongs to infinite classes. Choosing one is arbitrary. Therefore, a single number is epistemically shaky.
      *   *The Clinician's/Patient's Point:* Decisions must be made. Uncertainty is paralyzing. Patients need actionable information. "It depends" is not a helpful answer when choosing between amputation and palliative care.
      *   *The Committee's Dilemma:* How to balance epistemic honesty (acknowledging the arbitrariness) with clinical utility (providing a number).

  3.  **Evaluate the Options on the Table:**
      *   *Mandate Narrowest Class:* Pros: Most specific to patient. Cons: Small sample size (n=14), high variance, potentially unrepresentative, might be statistically noise.
      *   *Mandate Broadest Class:* Pros: Large sample, stable estimates. Cons: Ignores crucial specific factors (genomics, comorbidities), potentially misleadingly optimistic/pessimistic.
      *   *Abandon Point Estimates for Ranges:* Pros: Shows uncertainty. Cons: Patients often misunderstand ranges (picking the best or worst case), doesn't solve the *which classes* problem.

  4.  **Develop a Recommendation (The "Third Way"):**
      *   Simply picking "broad" or "narrow" validates one side of the philosophical debate and ignores the other.
      *   Simply giving a range doesn't explain *why* the range exists.
      *   *Best Approach:* **Transparent Pluralism with Contextual Weighting.**
      *   Acknowledge the reference class problem explicitly in the policy.
      *   Require the presentation of *multiple* estimates *if* they differ significantly, accompanied by an explanation of *why* they differ (i.e., explaining the reference classes).
      *   However, to avoid paralysis, recommend a **hierarchical framework** for which estimate serves as the "anchor," while requiring disclosure of alternatives.
      *   *Refinement:* Actually, for a policy memo, "show everything" can be overwhelming. A better approach for *decision aids* is to present the most *clinically relevant* estimate but explicitly qualify its uncertainty based on sample size and specificity.
      *   *Wait, looking closer at the prompt:* The prompt asks to engage with the idea that *any* rule is a convention. If I just say "Use a weighted average," I'm hiding the convention. If I say "Show both," I'm pushing the burden to the patient.
      *   *Stronger Recommendation:* Adopt a **"Contextualized Interval" policy.** We acknowledge there is no "true" number. Therefore, we present the *spectrum of reasonable estimates* derived from defensible reference classes, explicitly labeling them as such. But to aid decision-making, we prioritize the class that balances *specificity* and *statistical power* (the bias-variance tradeoff), while disclosing the alternative.
      *   *Actually, let's look at the ethical core:* The harm isn't the number; it's the *certainty* implied by the number. The policy should mandate **disclosure of the reference class** alongside the number.
      *   *Decision:* I will recommend a policy of **"Anchored Transparency."**
          1.  Acknowledge the Reference Class Problem in the preamble (validating the friend's point).
          2.  Require that *any* quoted probability be accompanied by a brief description of the reference class (e.g., "Based on all patients with this stage" vs. "Based on patients with this genetic marker").
          3.  When defensible classes yield vastly different outcomes (like 22% vs 61%), require the presentation of **both**, framed not as "error" but as "model uncertainty."
          4.  Provide a tie-breaking heuristic for the "primary" number (usually the one with adequate power that accounts for the most significant prognostic factors), but mandate the disclosure of the alternative.

      *   *Wait, is that too complex?* Let's simplify. The core issue is the *illusion of precision*. The policy should forbid presenting a single point estimate without qualifying the *basis* of that estimate.
      *   *Revised Recommendation:* **Mandate the "Reference Class Statement."** No single number stands alone. If significant divergence exists between defensible classes, the decision aid must present the range of outcomes *and* explain the source of the divergence.
      *   *Even better:* Let's take a stand on the "Single Number" vs. "Range" debate. The prompt says some want ranges. I should recommend ranges *derived from reference class sensitivity*, not just confidence intervals.
      *   *Final Decision:* Recommend a policy that requires presenting the **spectrum of defensible estimates** (the "Reference Class Range") rather than a single point, accompanied by a plain-language explanation of *why* the numbers differ. This accepts the friend's premise (no single true number) but meets the patient's need (a basis for action).

  5.  **Drafting - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Subject:** Clear and actionable.
      *   **Opening:** Acknowledge the specific case and the broader philosophical tension. Validate the biostatistician's argument (it's not a bug, it's a feature of probability).
      *   **The Problem:** The "Reference Class Problem." Acknowledge that "the real number" does not exist.
      *   **The Recommendation:** Do not pick narrow or broad. Pick **Transparent Pluralism**.
          *   Rule 1: No naked numbers. Every % must be tied to a described population.
          *   Rule 2: If defensible classes diverge by >X%, show the range.
          *   Rule 3: Clinicians must explain the *trade-off* (specificity vs. stability).
      *   **Rationale:** Why this works. It respects epistemic humility (friend's view) while enabling agency (patient's need). It turns the conflict into information.
      *   **Implementation:** Update decision aids, training.
      *   **Closing:** Call to action for the meeting.

  6.  **Refining the Tone:**
      *   Avoid jargon where possible, but use the right philosophical terms (reference class) to show seriousness.
      *   Ensure it sounds like a leader speaking to peers, not a lecture.
      *   Make sure the recommendation is *concrete*. "Show the range" is concrete. "Be careful" is not.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Show the range" just kicking the can to the patient?
      *   *Fix:* Add that the clinician must recommend a *course of action* based on the *weight of evidence*, not just dump numbers. The policy is about *presentation*, not replacing clinical judgment. The policy ensures the patient knows *why* the judgment is made.
      *   *Critique:* Did I address the friend's point enough?
      *   *Fix:* Make sure the preamble explicitly states that the friend is *right* about the metaphysics, but *wrong* about the clinical implication (that we should therefore do nothing). We must adopt a *useful convention*.

  8.  **Final Polish:** Check word count (keep it "short memo"), ensure clear headings. (Proceed to generate output).

  *(Self-Correction during final review)*: I need to make sure I don't sound like I'm dismissing the biostatistician. The prompt says "engage seriously." I need to explicitly state that the policy *embraces* the convention rather than hiding it.

  *Revised Plan:*
  1. Acknowledge the "Reference Class Problem" as valid.
  2. State that hiding this is unethical.
  3. Recommend: **"Anchored Ranges with Explanatory Context."**
  4. Specifically: When classes diverge significantly, present the interval defined by the defensible classes, not just statistical confidence intervals.
  5. Require the "Because" statement (e.g., "61% based on X, but 22% based on Y").

