answer: |-
  **MEMORANDUM**

  **TO:** Shared Decision-Making Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Recommendation: Presenting Prognostic Uncertainty and Reference Classes

  **Context**
  The recent case of the 43-year-old sarcoma patient highlights a critical vulnerability in our decision aids. Two competent clinicians provided vastly different survival estimates (61% vs. 22%) derived from defensible but distinct reference classes. The resulting family distress stems not from clinical error, but from the expectation that a "true" individual probability exists to be found.

  **The Philosophical Constraint**
  We must acknowledge that our biostatistical colleagues are correct on the underlying theory: there is no metaphysically "real" probability for a unique individual. Probability is a property of a class, and every patient belongs to indefinitely many overlapping classes (e.g., by tumor stage, by genomic subtype, by age). Selecting one class over another is, to some degree, a convention. To present a single percentage without qualification is to dress up a methodological choice as a physical measurement.

  However, clinical paralysis is not an acceptable response to epistemic humility. Patients must act. Therefore, our policy cannot simply be to "be more careful." We must adopt a specific convention that balances statistical stability with clinical specificity, while explicitly disclosing the convention itself.

  **Recommendation**
  I propose we adopt a policy of **Anchored Transparency**. Effective immediately, oncology decision aids and consultation standards should adhere to the following three rules:

  1.  **No "Naked" Numbers:** A survival probability may never be presented without a plain-language descriptor of the reference class used to generate it (e.g., "61% of patients with this *tumor stage*" vs. "22% of patients with this *genomic profile*").
  2.  **Mandatory Divergence Disclosure:** When two or more defensible reference classes yield survival estimates that differ by more than 15 percentage points, clinicians must present the **Reference Class Range** (e.g., "Estimates range from 22% to 61% depending on which factors we prioritize"). We must not privilege the broadest or narrowest class by default; we must present the *spectrum of reasonable models*.
  3.  **The "Because" Statement:** When presenting this range, the clinician must articulate the trade-off driving the variance. Specifically, they must explain that broader classes offer statistical stability but less specificity, while narrower classes offer specificity but less statistical certainty.

  **Rationale**
  This policy accepts the biostatistician's objection—that the choice of reference class is conventional—by making that convention visible to the patient. It rejects the demand for a single "real number" as scientifically dishonest, but it also rejects the notion that we should withhold numbers entirely.

  By presenting the *range of defensible estimates* rather than a single point or a standard confidence interval, we shift the conversation from "What is the truth?" to "Which model best reflects your values?" In the sarcoma case, the patient would understand that the 61% figure assumes her genomics are less relevant than her stage, while the 22% figure assumes the opposite. This allows her to weigh the risk of aggressive surgery against the *uncertainty* of the prognosis, rather than against a false precision.

  **Next Steps**
  I ask the committee to review the attached draft language for patient materials, which operationalizes these three rules. At next week's meeting, I move we vote to adopt this as the interim standard for high-stakes prognostic disclosure.

  We cannot solve the Reference Class Problem. But we can stop pretending it doesn't exist.
