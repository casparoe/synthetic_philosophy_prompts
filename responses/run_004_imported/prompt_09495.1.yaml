answer: |-
  It is not embarrassing to find yourself grappling with the metaphysics of your own boundaries after a surgery that quite literally rewires the rhythm of your life. When a medical intervention penetrates the barrier between "self" and "world" as deeply as a pacemaker, it is natural for the philosophical categories we use to navigate reality to tremble. You are asking whether the titanium and silicon regulating your heart are *you*, or merely *with* you.

  To answer this within Peter van Inwagen's framework, we must first clarify his criterion. In *Material Beings*, van Inwagen argues that composition occurs only when the activity of some simples (elementary particles) constitutes a **life**. A "life," for him, is not a biography or a conscious experience, but a specific, self-maintaining biological event—a "Cartesian life." Organisms exist because their parts are caught up in this event. Artifacts (chairs, pacemakers) do not exist as composite objects; there are only simples arranged artifact-wise. The question, then, is whether the simples arranged pacemaker-wise are also caught up in *your* life, thereby becoming parts of the composite organism that is you.

  ### The Verdict: The Organism and the Tool

  I argue for the specific verdict that, strictly speaking within van Inwagen's organicism, **the particles arranged pacemaker-wise are not parts of the organism that is you.** You are an organism merely attached to (albeit internally) a permanent tool.

  This verdict rests on the distinction between *causal support* and *constitutive participation*. For van Inwagen, to be "caught up in a life" means to participate in the biological event of self-maintenance. This event is characterized by metabolic turnover and biological replication. When you eat food, the particles of the food eventually become caught up in your life as they are metabolized into your tissues; before that, they are merely external causes.

  Your pacemaker, however sophisticated, does not metabolize. Its particles do not turnover, replicate, or integrate into the biological cycle of repair and maintenance that defines the life event. The leads may be threaded into the muscle, and the circuitry may perform the timing work of the sinoatrial node, but this is a causal relationship, not a constitutive one. The pacemaker *sustains* the life, but its own activity is not *part of* the life in the way cellular respiration is. It is analogous to a splint on a broken bone: even if surgically implanted and essential for healing, the splint's material does not become the bone's material. The pacemaker is an internalized external aid.

  ### Addressing the Worry: Lewis and the Vagueness of "Life"

  This verdict invites the worry you identified, central to David Lewis's *argument from vagueness*. Lewis argued that if composition is restricted (i.e., not universal), there must be borderline cases where it is vague whether composition occurs. If "being caught up in a life" is a matter of degree—how integrated is the device? how essential is its function?—then existence itself becomes vague. Since existence cannot be vague (a thing either exists or it doesn't), Lewis concludes that restricted composition views like van Inwagen's must fail.

  To defend the organicist verdict against this, we must reject the premise that "caught up in a life" is a degree-based notion.

  **1. Binary Participation, Not Gradual Integration**
  The Lewisian worry assumes that integration is a spectrum (e.g., 10% integrated, 50% integrated). However, van Inwagen's criterion is binary at the ontological level. A particle either participates in the self-maintaining biological event or it does not. There is no middle ground for a specific particle at a specific time. Either the particle is involved in the metabolic/biological processes that constitute the life, or it is merely causally interacting with them.

  In your case, the titanium particles of the pacemaker leads do not undergo metabolic turnover. They do not become fuel or tissue. They remain distinct in their physical behavior from the carbon-based particles of your heart muscle. While the *causal influence* is continuous (the electrical signal is seamless), the *ontological participation* is discrete. The boundary is not drawn at "how much do we need it?" (which is a degree), but at "is this activity part of the biological self-maintenance event?" (which is a kind).

  **2. Semantic Vagueness vs. Ontological Vagueness**
  Lewis's argument conflates vagueness in our *description* with vagueness in *reality*. It may be vague to *us* exactly when a particle becomes caught up in a life (e.g., during the digestion of a meal, or perhaps during the scar tissue formation around your leads). However, van Inwagen can argue that this is merely epistemic or linguistic vagueness. The physical event of "life" is a precise configuration of particles and forces. Whether a specific electron or atom is participating in that event is a fact of the matter, even if human language lacks the precision to specify the exact nanosecond of integration.

  By anchoring the verdict in the binary nature of metabolic participation rather than the gradient of functional importance, we avoid smuggling in the ontological vagueness Lewis fears. The pacemaker particles are not "almost" part of you; they are causally essential but ontologically distinct.

  ### Dissolving the Anxiety

  You mentioned this worry feels embarrassing beside the medical one. I suggest it is not embarrassing, but it is perhaps category-confused. Van Inwagen's ontology is designed to answer "What objects exist?" not "What matters for identity or survival?"

  Even if the pacemaker is not a *part* of the organism in the strict mereological sense, it is **functionally integrated** into the life event. The "life" (the biological event) now *includes* the regulation provided by the device. Without it, the life event would cease (or falter, leading to fainting). In this sense, the device is caught up in your life *causally*, even if its particles are not caught up *constitutively*.

  The Lewisian worry tries to force a sharp line where you feel a continuous unity. But the sharp line van Inwagen draws is not between "you and the alien," but between "biological self-maintenance and mechanical causation." Recognizing the pacemaker as a tool—a brilliant, life-saving tool that is *with* you rather than *of* you—does not diminish your unity. It simply acknowledges that your life is now a partnership between your biology and human engineering.

  The metaphysics does not require you to feel alienated from the device. It merely clarifies that while the pacemaker sustains the organism, it does not become the organism. You are not less "you" for having a tool inside you; you are an organism whose life event is now robustly supported by an external aid. The vagueness Lewis fears does not arise because the criterion is not about "how much" the device helps, but about "what kind" of activity it performs. And on that count, the line remains sharp, even if the leads are threaded deep.
