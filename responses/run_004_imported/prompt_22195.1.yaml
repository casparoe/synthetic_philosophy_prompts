answer: |-
  This is a classic debate in ethics and Just War Theory, and honestly, your friend raised a very common objection. To give you the ammo you need, you have to dig into the specific mechanics of the **Doctrine of Double Effect (DDE)** and how Elizabeth Anscombe applied it.

  The short answer is: Your friend is conflating **foreseen consequences** with **intended means**. Anscombe's argument isn't about the *number* of dead; it's about the *moral structure* of the act.

  Here is the breakdown of how Anscombe's argument differs from the standard DDE defense of conventional bombing.

  ### 1. The Doctrine of Double Effect (DDE) 101
  To understand Anscombe, you have to understand what she was accusing Truman of violating. The DDE (rooted in Aquinas) says an action with both good and bad effects is permissible only if four conditions are met:
  1.  **Nature of the Act:** The act itself must be morally good or neutral (e.g., destroying a military target).
  2.  **Intention:** The agent must intend only the good effect. The bad effect (civilian death) must not be intended.
  3.  **Means vs. Side Effect:** The bad effect cannot be the *means* to achieve the good effect. (You can't kill innocents *in order to* save others).
  4.  **Proportionality:** The good effect must outweigh the bad effect.

  **The Conventional Bombing Defense:**
  When defenders use DDE for standard WWII bombing (like hitting a munitions factory), the argument is:
  *   **Target:** The factory (Military objective).
  *   **Intention:** Destroy production capacity.
  *   **Side Effect:** Workers or nearby residents die.
  *   **Logic:** If the civilians died because they were next to the factory, their death was *foreseen* but not *intended*. If we could have destroyed the factory without killing them, we would have. Therefore, it is not murder.

  ### 2. Anscombe's Specific Objection to Truman
  Anscombe argued that the atomic bombings failed **Condition #2 and #3** of the DDE.

  She argued that Hiroshima and Nagasaki were not targeted because they were unique military hubs that couldn't be hit any other way. They were targeted *as cities*. The logic of the atomic bomb (and the area bombing campaign leading up to it) was **terror bombing**.

  *   **The Means:** The destruction of the civilian population (or the threat thereof) was the *method* used to shock the Japanese government into surrender.
  *   **The Intent:** If the civilians hadn't died, the psychological shock required to end the war wouldn't have happened. Therefore, their death was not a "side effect"; it was part of the plan.

  Anscombe famously wrote that Truman's defense relied on the idea that "the end justifies the means." She argued that **directly intending the death of the innocent** is intrinsically evil, regardless of the outcome. By dropping a weapon that indiscriminately vaporizes a city center, the killer *intends* the destruction of the populace to achieve the political goal. That makes it murder, not collateral damage.

  ### 3. Countering Your Friend's "Conventional Bombing" Argument
  Your friend's point is: *"All bombing killed civilians, so why single out Truman?"*

  Here is how you answer that using Anscombe's logic:

  **A. Anscombe Actually Agrees With Your Friend (Partially)**
  Anscombe was consistent. She **also** opposed the conventional firebombing of Dresden, Hamburg, and Tokyo. She believed that the Allied shift toward "area bombing" (targeting city centers to break morale) was immoral for the exact same reason.
  *   **Your Friend's Mistake:** They think Anscombe is singling out Truman. She isn't. She is singling out the *policy of targeting civilians*.
  *   **The Counter:** Just because conventional bombing *also* violated the rules of war doesn't make the atomic bomb legal. Two wrongs don't make a right. If conventional area bombing was murder, the atomic bomb is just "murder on a larger scale with a single weapon."

  **B. The Difference in "Discrimination"**
  While conventional bombing often killed civilians, there was still a theoretical distinction in Just War Theory between **precision bombing** (trying to hit the rail yard) and **area bombing** (trying to hit the city).
  *   With a conventional bomb, you *could* theoretically aim at a military target and miss, hitting a house.
  *   With an atomic bomb in 1945, the weapon's radius *was* the city. You cannot drop an A-bomb on a "military target" without intending to destroy the surrounding civilian infrastructure. The weapon itself is indiscriminate by design.
  *   Anscombe argued that choosing a weapon that *cannot* discriminate makes the intent to kill civilians undeniable.

  **C. The "Tu Quoque" Fallacy**
  Your friend is using a *tu quoque* argument ("You did it too!").
  *   **Argument:** "The US firebombed Tokyo, so Truman isn't a murderer."
  *   **Anscombe's Rebuttal:** "If firebombing Tokyo was murder, then doing it again with a nuke doesn't stop it from being murder."
  *   The fact that other commanders might also be liable for war crimes does not exonerate Truman. Anscombe's protest was about holding power accountable, not about finding the "worst" offender.

  ### 4. Summary for Your Argument
  If you talk to your friend again, here is the distilled version:

  1.  **Intent vs. Foresight:** The Doctrine of Double Effect excuses civilian death only if it is an accidental byproduct of hitting a military target. Anscombe argued that in Hiroshima/Nagasaki, the civilian destruction *was* the point (to force surrender through shock). That makes it a means, not a side effect.
  2.  **Consistency:** Anscombe wasn't hypocritical. She criticized the firebombing of German and Japanese cities too. She thinks *all* intentional targeting of civilians is murder.
  3.  **The Weapon:** Conventional bombing allows for the *possibility* of discrimination (aiming at a bridge). The atomic bomb, by its physical nature, erased the line between military and civilian target. Using it acknowledges that you accept the civilian destruction as the method of victory.

  **The Bottom Line:**
  Your friend is arguing from **consequences** (lots of people died in all bombings, so they are the same).
  Anscombe is arguing from **moral agency** (what was in the mind of the bomber?).

  If I shoot at a soldier and miss, hitting a civilian, that is tragic collateral damage (potentially excusable under DDE).
  If I shoot at a civilian *to scare the soldier into surrendering*, that is murder (not excusable under DDE).

  Anscombe's claim is that Truman did the latter. Your friend's claim is that everyone was doing the former (or that the distinction doesn't matter). Anscombe would say the distinction is the *only* thing that matters.
