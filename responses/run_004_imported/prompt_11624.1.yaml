answer: |-
  **Setting:** *A common room in Oxford, late afternoon, November 1956. The smoke from pipes and cigarettes hangs low over the leather armchairs. Outside, the bells of St Mary's have just tolled. Two fellows, ARTHUR (mid-40s, Thomistic leanings, voted 'non placet') and JULIAN (late-30s, utilitarian sympathies, voted 'placet'), stand by the fireplace.*

  **JULIAN:** Well, the smoke has cleared on the vote, at least. Though looking at you, Arthur, I'd say the atmosphere in Convocation was rather more toxic than this tobacco. You stood alone for a good long while with your hand up.

  **ARTHUR:** Better alone than complicit, Julian. You heard the arguments. It wasn't merely about whether Truman is a "good man." It was about whether the University of Oxford should publicly honour a man who ordered the mass slaughter of non-combatants as a matter of policy.

  **JULIAN:** "Slaughter." You choose your words with the precision of a prosecutor. But let's be precise about the act. Truman dropped a bomb on a city that housed military industry. He knew civilians would die. We knew civilians would die in Dresden, in Hamburg, in Tokyo. Are you telling me there is a moral magic trick that happens in the President's head that changes the physics of the explosion?

  **ARTHUR:** It isn't magic, and it isn't about physics. It's about the description of the action. If I blow up a munitions factory to stop the supply of shells, and I know with certainty that the night watchman inside will die, I have not murdered him. His death is a foreseen side-effect. But if I blow up the watchman *to* stop the shells—because, say, he holds the key—then I have used his death as a means. That is murder. At Hiroshima, the destruction of the city *was* the method. The terror was the point.

  **JULIAN:** This is the Doctrine of Double Effect, dressed up in Sunday best. It strikes me as a convenient dodge. You're saying I can kill a hundred children if I'm aiming at a tank, but I can't kill a hundred children if I'm aiming at the morale of the government that owns the tank. But the children are just as dead, Arthur. The grief of the parents is identical. Why should the moral calculus rest on a psychological distinction that is, frankly, unverifiable?

  **ARTHUR:** Unverifiable?

  **JULIAN:** Entirely. How do you get inside Truman's skull in July 1945? Perhaps he told himself he was aiming at "morale." Perhaps he told himself he was aiming at "rail lines." The bomb doesn't care. If morality is to be public, if it is to guide action, it must rest on what is done, not on the private interior decoration of the agent's mind.

  **ARTHUR:** It isn't private. It is embedded in the plan. Look at the timing. The second bomb fell on Nagasaki only three days after the first. There was no time for the Japanese cabinet to convene, let alone surrender. If the aim was truly to force a surrender by demonstrating power, one waits for the reaction. To drop the second immediately suggests the aim was not merely to *induce* surrender, but to inflict maximum devastation regardless of the immediate diplomatic window. It signals that the killing itself is the instrument.

  **JULIAN:** Or it signals a desperate urgency to end a war that had already consumed millions. And here we come to the crux of it. You, and Miss Anscombe in her pamphlet, seem to think Truman was operating in a vacuum. You argue that if he hadn't demanded unconditional surrender, the bomb wouldn't have been necessary.

  **ARTHUR:** I argue that the dilemma was rigged. The Allies had painted themselves into a corner by demanding unconditional surrender. If you tell an enemy they have nothing to lose by fighting to the death, they will fight to the death. Then you claim the bomb was the only alternative to an invasion. But the invasion was only necessary because the surrender terms were inflexible.

  **JULIAN:** That is a historical abstraction. By August 1945, the policy of unconditional surrender was not a variable Truman could toggle. It was the bedrock of the Allied coalition. It was agreed at Casablanca, reaffirmed at Potsdam. To say "Truman shouldn't have dropped the bomb because he should have changed two years of Allied diplomatic strategy" is to judge him for not being a god. He inherited the situation. He had to act in the world as it *was*, not as the philosophers wish it to be.

  **ARTHUR:** A leader is responsible for the policies he inherits if he enforces them with extreme violence. If I drive a car off a cliff because I refuse to turn the wheel, I cannot say, "The cliff was already there." The point is, the consequentialist argument rests on a comparison: "The bomb killed 150,000, but an invasion would have killed a million."

  **JULIAN:** And that math holds. Even by your own lights, surely? If you could save 850,000 lives by taking 150,000, do you not have a duty to do so?

  **ARTHUR:** I do not have a duty to commit murder to prevent murder. That is the corruption. If I kill an innocent person to harvest their organs and save five patients, I have not saved lives; I have destroyed the very concept of justice that makes life valuable. You are treating the Japanese civilians as resources to be spent.

  **JULIAN:** I am treating them as victims of a terrible necessity. But let's press your distinction again. You say aiming at the factory is fine, aiming at the city is not. But in modern war, the city *is* the factory. The women welding fuselages in their homes, the civilians rationing food to feed the army—they are part of the war machine. Why is their death "intended" in one case and "foreseen" in the other?

  **ARTHUR:** Because in the factory case, if the civilians could magically vanish, the mission succeeds. The bomb hits the machines. In the city case, if the civilians vanish, the mission fails. The terror *requires* their presence. You are attacking the population to break the will of the leadership. That makes the population the target.

  **JULIAN:** It seems to me this distinction allows for a dangerous self-deception. A commander can simply say, "I am aiming at the rail hub," while knowing perfectly well that leveling the district around it is the only way to ensure the hub is destroyed. Your doctrine gives him a moral get-out-of-jail-free card so long as he phrases his orders carefully.

  **ARTHUR:** On the contrary, it demands greater rigor. It forces the commander to ask: "Is there a way to achieve the military objective without making their death my tool?" If the answer is no, he must not do it. Consequentialism allows you to do *anything*, provided you can conjure a sufficiently large number of future lives to justify it. It turns morality into accounting.

  **JULIAN:** And your morality turns it into a ritual of hand-washing. You say Truman is a murderer. I say Truman is a man who took the responsibility of ending the bloodiest conflict in human history on his own conscience. He chose the path that stopped the killing. You chose the path that keeps your own moral ledger clean while the world burns. Which is the greater vanity, Arthur?

  **ARTHUR:** It is not vanity to refuse to do evil that good may come. That is the definition of integrity. If Oxford grants this degree, we are saying that the office of the President places one above the moral law that binds the rest of us. We are saying that success sanctifies the means.

  **JULIAN:** We are saying that statesmanship is not the same as private morality. A private citizen cannot kill. A head of state must sometimes order killing to prevent the collapse of order. If Truman had refused to use the bomb, and the invasion had gone ahead, and a million boys died in the sand of Kyushu—boys from Britain, from America, from Japan—would you be standing here telling me he was right to keep his hands clean?

  **ARTHUR:** I would be telling you that he was wrong to accept a policy of unconditional surrender that made that choice inevitable. But since he did accept it, he became responsible for the violence required to enforce it. You cannot separate the act from the intention, Julian. The intention is the soul of the act. Without it, we are just judging the movement of atoms. And if we judge only atoms, then there is no such thing as murder, only ballistics.

  **JULIAN:** *(Taps his pipe out against the grate)* Then we are at an impasse. You see a line drawn in the soul; I see a line drawn in the sand, washed away by the tide of consequences.

  **ARTHUR:** Then let us hope, for the sake of the next war, that the line in the soul holds firmer than the one in the sand.

  **JULIAN:** *(Picks up his gown)* I hope so too, Arthur. But I fear that when the bombs fall next time, no one will ask what was in Truman's head. They will only ask how many died.

  **ARTHUR:** And that, Julian, is precisely why we must vote 'non placet'. To remind them that the question matters.

  *(Julian nods, a grim acknowledgement, and exits. Arthur remains by the fire, staring into the embers.)*
