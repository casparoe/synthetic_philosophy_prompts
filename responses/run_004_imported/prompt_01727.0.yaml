answer: |-
  This is a classic conflict over **social contracts**. It looks like a fight about phones, but it's actually a fight about *authority, hypocrisy, and the enforcement of norms.*

  Here is the move-by-move breakdown of who holds the stronger position at each stage, distinguishing between **logical rightness** (facts) and **social rightness** (group dynamics).

  ### Round 1: The Incident (Lunch)
  *   **The Action:** Marcus scrolls Instagram the entire lunch. Jenna calls him out in front of the group.
  *   **Marcus's Position:** He violated the explicit/unspoken group norm.
  *   **Jenna's Position:** She enforced the group norm.
  *   **Who is more right?** **Split.**
      *   **On the Rule:** **Marcus is wrong.** If the rule is "no phones," scrolling for the whole lunch is a clear violation.
      *   **On the Enforcement:** **Jenna is shaky.** Calling a friend out *publicly* for a minor social infraction usually escalates tension unnecessarily. Private correction preserves dignity; public correction asserts dominance. Jenna chose dominance.

  ### Round 2: Marcus's Opening Text
  *   **Claim:** *"lol you calling ME out, you're on your phone at lunch just as much as i am"*
  *   **The Argument:** Tu Quoque (You also do it).
  *   **Who is more right?** **Logically: Jenna. Socially: Marcus.**
      *   **Logic:** Two wrongs don't make a right. Jenna's phone usage doesn't erase Marcus's phone usage.
      *   **Social:** Marcus is identifying a double standard. In a friend group, credibility comes from shared sacrifice. If the "police" are breaking the law, the arrest feels personal rather than principled.

  ### Round 3: Jenna's Response
  *   **Claim:** *"ok but that doesnt make what i said untrue, you WERE on it the entire time"*
  *   **The Argument:** Truth value is independent of the messenger.
  *   **Who is more right?** **Jenna.**
      *   She is factually correct. His behavior was objectively contrary to the group norm. She is refusing to let the *validity of her observation* be derailed by her own imperfections. This is a strong logical stance.

  ### Round 4: Marcus's Counter
  *   **Claim:** *"sure, but calling someone out isnt just stating a fact, its acting like the rule applies to me and not you, and it applies to both of us equally"*
  *   **The Argument:** Moral authority requires consistency.
  *   **Who is more right?** **Marcus.**
      *   This is his strongest point. He shifts the debate from "Did I break the rule?" to "Do you have the standing to judge me?" In informal social contracts, you lose the right to enforce a rule when you habitually break it yourself. He is correctly identifying that Jenna isn't just stating a fact; she's positioning herself as the "Rule Keeper," a role she hasn't earned.

  ### Round 5: Jenna's Rebuttal
  *   **Claim:** *"so nobody whos ever glanced at their phone gets to say anything when someone's on it for 40 straight minutes?? thats insane"*
  *   **The Argument:** False Equivalence / Severity Threshold.
  *   **Who is more right?** **Jenna (mostly).**
      *   She is right that there is a difference between a notification check and being gone for 40 minutes. A rule shouldn't be voided just because someone jaywalked once. However, she is slightly straw-manning him by implying he said "ever glanced." She is trying to establish a *de minimis* exception (minor breaches are okay), which is reasonable, but she's using it to deflect from her own habitual usage.

  ### Round 6: Marcus's Closer
  *   **Claim:** *"thats not what im saying. theres a difference between glancing at a text sometimes and doing what YOU do, which is scroll for like 10 min most days while acting like ur the one enforcing the pact in the first place"*
  *   **The Argument:** Nuance of Degree + Attitude.
  *   **Who is more right?** **Marcus.**
      *   He clarifies the distinction (glancing vs. habitual scrolling) and attacks the *attitude*. He isn't saying she can't speak; he's saying she can't speak *from a place of superiority* when her own usage is significant (10 mins most days). He is calling out the performative nature of her enforcement.

  ---

  ### The Verdict: Who is "More Right"?

  *   **On the Facts:** **Jenna.** Marcus broke the rule more severely at that specific moment.
  *   **On the Dynamics:** **Marcus.** Jenna tried to use a rule she doesn't consistently follow to publicly shame a friend. Marcus successfully argued that social enforcement requires shared buy-in.

  If this were a court of law, Jenna wins (Marcus broke the rule). If this is a court of friendship, Marcus wins (Jenna acted like a hypocrite).

  ### The Missing Angle: What They Are Both Ignoring

  There are two massive elephants in the room that neither of them is addressing.

  **1. The "Unspoken" Rule is the Trap**
  The root cause of this fight is that the rule is **unspoken**.
  *   Unspoken rules rely on mind-reading.
  *   Marcus clearly has a different interpretation of the rule ("It's okay if I'm still listening") than Jenna ("Eyes up, period").
  *   Jenna clearly has a different interpretation of her own compliance ("I only glance") than Marcus ("You scroll for 10 mins").
  *   **The Fix:** The group needs to make the rule spoken. "Hey, let's actually agree on what 'no phones' means. Does checking a text count? What about emergencies?" Once it's defined, you can't argue about the definition.

  **2. Public Shaming vs. Private Correction**
  Jenna's biggest tactical error wasn't her phone usage; it was **calling him out in front of everyone.**
  *   In adult friendships, correction should almost always happen privately.
  *   By doing it at the table, she forced Marcus into a defensive corner. He *had* to fight back to save face in front of the group. If she had texted him later ("Hey, felt like you were checked out at lunch, kinda missed you"), he likely would have apologized without the hypocrisy defense.
  *   **The Missing Insight:** The fight isn't about the phones anymore; it's about respect. Marcus feels disrespected by the public call-out; Jenna feels disrespected by the phone usage. They are fighting about different injuries.

  **Summary for your friend group:**
  Marcus was the bigger rule-breaker at lunch, but Jenna was the bigger instigator of the conflict. Marcus is right that she lacks the moral high ground to enforce the rule, but Jenna is right that his behavior was disruptive. The group needs to retire the "unspoken" rule and agree on a new one that fits how everyone actually behaves.
