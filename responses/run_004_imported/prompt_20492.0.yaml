answer: |-
  # The Market of Unproven Truths: A Verdict on Logical Induction

  **By [Your Name]**

  The problem begins with a gap. On one side stands a mathematical conjecture, perhaps the Riemann Hypothesis. It is either true or false; the territory of arithmetic is fixed. On the other side stands a reasoner—you, me, or an artificial intelligence. We cannot see the truth value. We lack the proof. Yet, we are not blind. We might assign a high credence to the hypothesis based on numerical evidence, heuristic patterns, or the testimony of experts.

  Classical probability theory has no place for this gap. It assumes logical omniscience: if a statement is a theorem, its probability must be 1; if it is a contradiction, 0. To a classical Bayesian, assigning a probability of 0.9 to an unproven theorem is an error of coherence, a symptom of ignorance that ought to be instantly corrected by deduction. But deduction is expensive. For bounded agents, logical omniscience is a physical impossibility. We live in the gap.

  In 2016, researchers at the Machine Intelligence Research Institute (MIRI) proposed a framework called **Logical Induction** to inhabit this gap. It was hailed by some as a breakthrough in formal epistemology, a way to extend Bayesian rationality to the realm of logic without collapsing into omniscience. Others dismissed it as elegant engineering that sidestepped the hard philosophical questions.

  After weeks of reporting, interviewing proponents who see a new foundation for rationality and skeptics who see a category error, the picture is clearer. The debate over Logical Induction is not merely about a mathematical result; it is a fight over the definition of rationality itself. Is rationality a state of justified belief, or a trajectory of successful action?

  To understand the stakes, we must look at the mechanism. Logical Induction treats logical sentences like stocks in a market. A "price" is assigned to every sentence (e.g., "The Riemann Hypothesis is true"). If the price is 50 cents, the system is willing to buy or sell a share that pays out $1 if the sentence is true, and $0 if false.

  The system evolves over time. In each round, "traders"—computable algorithms—attempt to exploit the market. If the market consistently prices sentences in a way that allows a trader to make infinite money (a Dutch Book), the market is irrational. The central theorem of Logical Induction is that there exists a market (a sequence of credences) that no *efficiently computable* trader can exploit indefinitely.

  ### The Case for Vindication

  The proponents' argument is bold: Logical Induction does for logical uncertainty what Dutch Book arguments did for empirical uncertainty.

  In standard decision theory, if your credences violate the axioms of probability, a clever bookie can construct a set of bets that guarantees you lose money. This vulnerability is taken as proof that your credences are irrational. Proponents of Logical Induction argue that for a bounded agent, the only relevant bookies are those who can actually compute their strategies. An uncomputable bookie who "knows" the truth of the Riemann Hypothesis is a physical impossibility, much like a demon with infinite speed.

  Therefore, immunity to *computable* exploitation is the only coherence condition that matters for real agents. If a logical inductor cannot be pumped for money by any efficient algorithm, it has achieved the maximum possible coherence for a being with limited computational power.

  Furthermore, Logical Induction captures something deeply intuitive about mathematical practice. Before we prove that there are infinitely many primes, we notice patterns. We see that numbers don't just divide randomly. Logical inductors do the same. They learn to recognize statistical regularities in logical statements before they can deduce the underlying theorems. They assign high credence to sentences that "look like" theorems, based on the history of the market.

  For the proponent, this vindicates the rationality of intermediate credences. It shows that having a 70% belief in an unproven conjecture is not a failure of logic, but a successful adaptation to computational limits. It transforms logical uncertainty from a philosophical embarrassment into a tractable learning problem.

  ### The Case for Skepticism

  The skeptic, often a formal epistemologist, looks at this machinery and sees a sleight of hand. The objection is not that the math is wrong—the theorem stands. The objection is that the theorem does not prove what the proponents claim it proves.

  The core critique rests on the nature of the guarantee. Logical Induction guarantees that the market will *eventually* converge to sensible credences and that no computable trader can exploit it *in the limit*. But "in the limit" is doing a tremendous amount of heavy lifting. There is no computable bound on *when* this convergence happens.

  A logical inductor could, in principle, assign a 99% credence to a falsehood for a billion time steps, provided it eventually corrects itself. It could be confidently wrong for an arbitrary duration. As one epistemologist put it: "Immunity to exploitation is a property of market stability, not epistemic justification."

  To the skeptic, rationality requires a connection between evidence and belief *now*. If I assign a high credence to a statement, I should be able to point to the logical evidence that warrants it. Logical Induction provides no such warrant. It provides a guarantee that I won't go bankrupt, not that I am tracking the truth.

  This shifts the goalposts from epistemology to pragmatism. The skeptic argues that Logical Induction redefines rationality as "survival against efficient algorithms." While useful for building AI that doesn't blow itself up, this leaves the philosophical question unanswered: *Why* should I believe the Riemann Hypothesis is likely true? The logical inductor says, "Because betting against it would eventually make you poor." The epistemologist replies, "That tells me about my wallet, not the numbers."

  By focusing on computable traders, the framework quietly admits that it cannot access logical truth, only computational consensus. It replaces the search for justification with a mechanism for error correction. For the skeptic, this is a concession of defeat disguised as a solution.

  ### The Verdict

  The tension between these views is palpable, but it is not a stalemate. To settle the matter, we must ask what we want a theory of rationality to do for us.

  The skeptic is correct on a specific, technical point: Logical Induction does not provide *atemporal epistemic justification*. It cannot tell you, at time $t$, why your credence is warranted in a way that satisfies the classical demand for logical grounding. If your standard for rationality is "having reasons that link belief to truth independent of time," Logical Induction fails. The convergence bound is indeed uncomputable, and the "Long Wrong" scenario is possible.

  However, the skeptic is wrong to treat this failure as a deficit. The demand for atemporal justification is the relic of the logical omniscience assumption that created the problem in the first place. It assumes that a reasoner should have access to a "view from nowhere" regarding logical space. But for any physical agent—human or machine—reasoning is a temporal process. We do not access truth; we compute toward it.

  This is where the proponents secure the victory, but only by forcing a revision of our philosophical expectations. Logical Induction demonstrates that for bounded agents, **rationality is not a state of belief, but a property of a learning trajectory.**

  The skeptic's demand for immediate justification assumes that "belief" and "computation" are separate. Logical Induction shows they are not. In a computable universe, your "evidence" for a logical claim *is* the output of your computational processes up to that point. There is no other evidence available. To ask for more is to ask for magic.

  Therefore, the immunity to computable exploitation *is* the epistemic justification for bounded agents. Why? because in the realm of logic, "truth" is the fixed point that computation approaches. If your credences are robust against all efficient attempts to find errors, you are, by definition, doing the best possible job of approximating that fixed point given your constraints. The fact that you might be wrong for a billion steps is not a bug; it is the inherent cost of doing logic without omniscience.

  The verdict is this: **Logical Induction is the correct theory of rationality for bounded agents, but it requires us to abandon the classical concept of epistemic justification.**

  The skeptic wins the battle by showing that LI does not satisfy traditional epistemological cravings. But the proponent wins the war by showing that those cravings are incoherent for any agent that exists in time. Logical Induction does not solve the problem of logical uncertainty by bridging the gap between belief and proof. It solves it by dissolving the gap, showing that belief *is* a form of incomplete proof, managed through market dynamics.

  We should accept Logical Induction not as a vindication of our intuition that we "know" unproven theorems are likely true, but as a rigorous explanation of why we are permitted to act *as if* we know them. It is a theory of competence, not warrant. And for a science-and-ideas age increasingly concerned with AI alignment and bounded rationality, competence is the only virtue that matters.

  The logical inductor does not tell the truth. It tells us how to stop lying to ourselves efficiently. In a universe of limited compute, that is the closest thing to rationality we can have.
