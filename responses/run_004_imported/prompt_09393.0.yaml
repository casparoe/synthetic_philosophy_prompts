answer: |-
  You have hit upon one of the most significant and frequently misunderstood distinctions in medieval metaphysics. Your intuition is correct: the discrepancy you noticed between the *Kalam* argument (which demands a temporal beginning) and Aquinas (who denies that reason can prove a temporal beginning) hinges entirely on this *per se* vs. *accidental* causal distinction.

  Most popular summaries of the "Five Ways" flatten Aquinas into a *Kalam* proponent, claiming he argues for a "First Cause" in time. As you discovered in *Summa Theologica* I, Q46, he explicitly rejects that. He believes the universe *did* have a beginning, but only because Revelation says so, not because philosophy can prove it.

  Here is a close reading of the machinery behind that text, addressing your specific confusions about the stick, the father, the hammers, and the Third Way.

  ### 1. The Core Distinction: Instrumental vs. Principal Causality

  To understand the text, we must translate the Scholastic terms into metaphysical mechanics.

  **The *Per Se* (Essentially Ordered) Series:**
  *   **The Text:** "a stone be moved by a stick, the stick by the hand."
  *   **The Mechanism:** This is a hierarchy of **instrumental causality**. The stick moves the stone *only because* the hand is currently moving the stick. The stick has no power to move the stone on its own; it is borrowing the hand's power.
  *   **The Key Feature:** **Simultaneity.** All members of the chain must be acting *at the same time*. If the hand stops, the stick stops, and the stone stops. The causality flows through the chain concurrently.
  *   **Why it can't be infinite:** If every member in the chain is merely an instrument borrowing power from the previous member, and there is no "First Mover" that has the power inherently (a hand that moves itself), then no power is ever introduced into the system. It is like an electrical cord with no plug; no matter how long the cord is, the lamp won't light. There must be a source of power *currently* acting.

  **The *Accidental* (Accidentally Ordered) Series:**
  *   **The Text:** "man generated by man," "artificer acts by means of many hammers."
  *   **The Mechanism:** This is a sequence of **principal causality**. When a father begets a son, he confers human nature upon him. Once the son exists, he possesses that nature *in himself*. He does not need his father to be currently alive or actively generating to generate his own son.
  *   **The Key Feature:** **Sequential Independence.** The causes do not need to act simultaneously. The father can die, and the son can still generate. The causality is historical, not concurrent.
  *   **Why it can be infinite:** Because each member possesses the causal power within itself (derived from the past, but held in the present). You don't need a "First Father" currently acting to explain why *this* father is generating a son *now*. You only need to explain how human nature exists, which each man holds individually.

  ### 2. Addressing Your Confusions

  #### The Stick vs. The Father
  You asked: *"On the surface, both the stick-hand-stone chain and the father-son chain look like one thing causing the next thing in a line, so why does the first need a starting point and the second not?"*

  The difference is **ontological dependency** vs. **temporal succession**.
  *   In the **Stick** chain, the stick is an *instrument*. It is ontologically dependent on the hand *right now*.
  *   In the **Father** chain, the father is a *principal*. He is temporally dependent on his own father (he wouldn't exist without him), but he is *not* ontologically dependent on his father's generative act *right now*.

  Aquinas is arguing that you cannot have an infinite chain of *instruments* (sticks moving sticks moving sticks) without a Hand. But you *can* have an infinite chain of *principals* (fathers begetting fathers) because each principal carries the causal power within their own substance.

  #### The Hammer Example
  You wrote: *"The hammer example confused me even further, since it sounds like Aquinas is saying the hammers were never really one causal series in the first place — and I don't see why that same move couldn't be made about the stick and the hand."*

  Your intuition here is incredibly sharp. You are right: Aquinas is saying the hammers are **not** one causal series in the *per se* sense.

  *   **The Hammers:** If an artificer breaks one hammer and picks up another, the second hammer does not derive its striking power from the first hammer. They are two distinct events linked only by the intention of the artificer. This is why it is "accidental." The series exists only in our counting of the events, not in the metaphysics of the action.
  *   **Why this doesn't apply to the Stick:** You cannot treat the hand and stick as "accidental" because the physical reality of the stone moving requires the hand and stick to be connected *simultaneously*. If you claim the hand moved the stick yesterday, and today the stick moves the stone on its own, you are describing a projectile (a thrown stick), not a pushed stone. In the example of *moving* a stone (pushing it), the dependency is concurrent. To apply the "hammer move" to the stick would be to deny the physical reality of how the stone is being moved.

  ### 3. Is This Why Aquinas Rejects the Kalam Conclusion?

  **Yes. This distinction is doing all the work.**

  The *Kalam* argument assumes that all causal chains are *accidental* (temporal sequences of events). It argues: "You can't have an infinite past sequence of events."
  Aquinas argues: "Actually, an infinite past sequence of events (*accidental* series) is metaphysically possible. Reason cannot disprove it."

  However, Aquinas insists that even if the universe is an infinite *accidental* series of events (fathers begetting sons forever), it still requires a *per se* cause **right now**.

  *   **The Universe as Accidental Series:** The state of the universe at 2:00 PM is caused by the state at 1:00 PM, which was caused by 12:00 PM, etc. Aquinas says this chain *could* go back forever.
  *   **The Universe as Per Se Effect:** But why does the universe exist *at all* at 2:00 PM? Existence itself is being conferred. Just as the stick needs the hand *now* to move, the universe needs a Sustainer *now* to exist.

  So, for Aquinas, the "First Cause" is not the **First Push** in time (Kalam); it is the **Ground of Being** in the present (Classical Theism). This is why he can say the world might be eternal (no first push) but still created (dependent ground).

  ### 4. Relation to the Argument from Contingency (The Third Way)

  You asked if the Third Way relies on the same *per se/accidental* machinery.

  **The Short Answer:** It relies on the same *per se* machinery, but applies it to *existence* rather than *motion/generation*.

  **The Long Answer:**
  The Third Way argues from "possible beings" (things that can exist or not exist) to a "necessary being."
  *   **The Worry:** If everything is "possible" (contingent), then at some point nothing would exist (because what is possible not to be, at some time is not).
  *   **The Criticism:** Critics often say this commits the "fallacy of composition" or assumes a temporal endpoint ("at some time").
  *   **The Thomistic Defense:** A close reading suggests Aquinas is again talking about *per se* dependency. A contingent being does not contain the reason for its own existence within itself. It is like the stick: it only exists because something else is currently sustaining it.
      *   If *everything* were contingent, everything would be an instrument.
      *   If everything is an instrument, there is no source of existence.
      *   Therefore, there must be a Necessary Being (a Being that exists by its own nature, like the Hand) sustaining the contingent beings *now*.

  Like the Second Way (the passage you quoted), the Third Way does not strictly require a temporal beginning. It requires an ontological foundation. If the universe were eternal, but every part of it was contingent, you would still have an infinite chain of "sticks" with no "hand." You would still need a Necessary Being to ground the chain *per se*.

  ### Summary of the Mechanics

  1.  **Per Se (Essential) Series:** Hierarchical, simultaneous, instrumental. (Hand → Stick → Stone). **Cannot be infinite.** Requires a First Member *currently acting*.
  2.  **Accidental Series:** Linear, sequential, principal. (Grandfather → Father → Son). **Can be infinite.** Does not require a First Member *currently acting*.
  3.  **Application to Cosmology:** The history of the universe is an *accidental* series (could be infinite). The existence of the universe is a *per se* effect (requires a Cause now).
  4.  **Application to Contingency:** Contingent beings are *per se* dependent on a Necessary Being for their current existence, regardless of how long the temporal chain of generation has been going on.

  You were right to be suspicious of the "Five Ways" capsule summaries. They often present Aquinas as arguing for a temporal beginning because that is easier to grasp, but it fundamentally misrepresents his metaphysics. Aquinas is not trying to prove the universe had a start; he is trying to prove the universe is dependent. The distinction you found in Q46, A2 is the linchpin that holds his entire system together.
