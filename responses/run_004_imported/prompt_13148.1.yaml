prompt: |-
  A friend and I spent a long evening arguing about Aquinas's position on tyrannicide, and we ended up agreeing on a reading that neither of us could fully defend under further questioning: since Aquinas holds that a ruler who governs for his own advantage rather than the common good has thereby forfeited the legitimacy of his rule, he must be granting ordinary subjects a standing right to kill such a ruler on their own initiative -- which is presumably why he is cited as a forerunner of later Jesuit resistance theorists such as Mariana and Suárez. Yet Aquinas is elsewhere adamant that no private person may inflict death on anyone, however guilty, by his own authority, reserving that power to whoever bears public responsibility for the community's welfare. Why does he treat tyranny as the one case in which this otherwise near-inviolable restriction does not hold?
reasoning: |-
  Here's a thinking process that leads to the suggested answer:

  1.  **Analyze the User's Query:**
      *   **Core Question:** Does Aquinas grant ordinary subjects a standing right to kill a tyrant on their own initiative (tyrannicide)?
      *   **User's Premise:** The user and their friend argued that Aquinas *must* grant this right because a tyrant forfeits legitimacy, linking him to later Jesuit theorists (Mariana, Suárez).
      *   **The Conflict:** The user acknowledges Aquinas's general principle that private individuals cannot inflict death (reserved for public authority). They want to know why tyranny would be the exception *if* it is one.
      *   **The Goal:** Correct the misreading (if it is one), explain Aquinas's actual position on tyranny and resistance, clarify the distinction between private and public action, and address the connection to later Jesuit theorists.

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *Aquinas on Tyranny:* Key texts are *De Regno* (On Kingship) and *Summa Theologiae* (II-II, q. 42, a. 2; q. 64, a. 3).
      *   *The "Forfeiture" Argument:* Does a tyrant lose legitimacy? Yes, in a sense. But does that automatically authorize private killing? No.
      *   *Private vs. Public:* Aquinas is very strict on this. Private killing is murder. Public killing (capital punishment/war) is lawful if authorized.
      *   *Tyrannicide:* Aquinas is often cited by later resistance theorists, but scholars generally agree he *does not* endorse private tyrannicide. He prefers public action or non-resistance depending on the severity.
      *   *Jesuit Connection:* Mariana and Suárez *did* go further than Aquinas. Linking them directly as a seamless continuation is a common historiographical error (the "Whig history" of political thought).

  3.  **Formulating the Argument:**
      *   **Direct Answer:** The premise is incorrect. Aquinas does *not* grant ordinary subjects the right to kill a tyrant on their own initiative.
      *   **Key Distinction:** Private authority vs. Public authority.
      *   **Textual Evidence:**
          *   *Summa Theologiae* II-II, Q. 64, A. 3: Killing is only lawful by public authority.
          *   *Summa Theologiae* II-II, Q. 42, A. 2: Sedition is a sin, but tyranny is worse. However, resisting tyranny must be done carefully.
          *   *De Regno:* Discusses what to do about tyrants. Suggests public mechanism or divine intervention, not private assassination.
      *   **The "Forfeiture" Nuance:** A tyrant rules unjustly, but that doesn't dissolve the political order into a state of nature where everyone is an executioner. The *office* might be corrupted, but the *authority to punish* remains public.
      *   **The Jesuit Connection:** Acknowledge why the user thinks this (they are cited as forerunners) but clarify the divergence. Jesuits (especially Mariana) were more permissive regarding tyrannicide under specific conditions, whereas Aquinas was more cautious.

  4.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the depth of the question (it's a classic debate) but state clearly that the shared conclusion is historically and textually inaccurate regarding Aquinas.
      *   *The General Principle:* Reiterate the user's correct understanding of the general rule (private persons cannot kill). Cite *ST* II-II, q. 64.
      *   *The Specific Case of Tyranny:* How does Aquinas handle this?
          *   In *De Regno*, he argues against killing tyrants if it leads to worse tyranny.
          *   He suggests a public mechanism (if one exists) to depose the king.
          *   If no public mechanism exists, he leans toward patience or divine intervention, *not* private assassination.
      *   *Addressing the "Forfeiture" Logic:* Just because a ruler is unjust doesn't mean the subject becomes the judge and executioner. The authority to punish resides in the *community* or its representatives, not individuals.
      *   *The Jesuit Comparison:* Explain that Mariana and Suárez represent a development (or departure), not a strict adherence. They developed the theory of popular sovereignty more explicitly than Aquinas.
      *   *Conclusion:* Summarize. Aquinas prohibits private tyrannicide.

  5.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Wait, is there any ambiguity?* In *Commentary on the Sentences*, Aquinas discusses the killing of Holofernes by Judith. He praises her but notes she acted under divine instinct/impulse, not human right. This is crucial. It shows private killing is only okay with *direct divine command*, not human political calculation.
      *   *Sedition:* Aquinas defines sedition as opposing the unity of the multitude. A tyrant disrupts this unity. So opposing a tyrant isn't sedition *if* done by public authority. But private opposition risks greater disorder.
      *   *Terminology:* Ensure distinction between "tyrannicide" (killing) and "resistance/deposition" (removal). Aquinas is more open to deposition by public authority than killing by private hands.

  6.  **Final Polish:**
      *   Tone: Respectful, scholarly, clear.
      *   Structure:
          1.  Direct correction of the premise.
          2.  The General Prohibition (Private vs. Public).
          3.  Aquinas on Tyranny (*De Regno* & *Summa*).
          4.  The Judith Exception (Divine vs. Human).
          5.  The Jesuit Divergence.
          6.  Synthesis.

  7.  **Final Review against User Query:**
      *   Did I answer "Why does he treat tyranny as the one case..."? Yes, by explaining he *doesn't* treat it as an exception to the private killing rule.
      *   Did I address the Jesuit connection? Yes.
      *   Did I address the "forfeiture" argument? Yes.

  8.  (Mental Check): Make sure not to overstate Aquinas as a pacifist. He supports capital punishment and just war, but *only* via public authority. The crux is the *source* of authority, not the *guilt* of the victim.

  9.  **Constructing the Output:** (Proceed to generate response based on these points.)
answer: |-
  The reading you and your friend arrived at is a very common one, largely because later resistance theorists (like the Jesuits you mentioned) *wanted* Aquinas to say exactly that. However, most contemporary scholars of medieval political thought agree that this reading is textually unsustainable.

  To answer your specific question: **Aquinas does not treat tyranny as an exception to the rule that private persons cannot inflict death.** He does not grant ordinary subjects a standing right to kill a tyrant on their own initiative.

  The tension you identified is real, but Aquinas resolves it not by making an exception for private killing, but by insisting that the removal of a tyrant must remain a **public act**, or else be left to God.

  Here is a breakdown of why your shared reading doesn't hold up, how Aquinas actually navigates the problem, and where the Jesuits diverged from him.

  ### 1. The General Prohibition (Private vs. Public Authority)
  You are correct that Aquinas is adamant on this point. In the *Summa Theologiae* (II-II, q. 64, a. 3), he argues that killing is lawful only when exercised by someone acting on behalf of the whole community (*ex persona totius multitudinis*).
  *   **The Logic:** The good of the community is superior to the good of an individual. Only the guardian of the common good (the public authority) can weigh the necessity of removing a "diseased member" (a criminal or enemy) against the health of the whole body.
  *   **The Implication:** A private individual lacks the epistemic and juridical standing to make this calculation. If a private person kills, even a guilty person, it is murder, because they have usurped a judgment that belongs to the public order.

  ### 2. Aquinas on Tyranny (*De Regno* and *Summa*)
  When Aquinas addresses tyranny specifically, he maintains this distinction. He discusses this most fully in *De Regno* (On Kingship), addressed to the King of Cyprus.

  *   **Deposition vs. Assassination:** Aquinas argues that if a king becomes a tyrant, it is not sedition to depose him. However, he insists this must be done by **public authority**, not private presumption. If there is a mechanism (like an electoral college or a body of nobles) that has the right to appoint the king, that same body has the right to remove him.
  *   **The Danger of Private Action:** Aquinas explicitly warns against private tyrannicide. He argues that attempting to kill a tyrant privately often leads to greater evils:
      1.  It may fail, leading to harsher repression.
      2.  It may succeed, but the liberator may become the new tyrant (he cites the example of Caesar).
      3.  It encourages a culture where citizens judge rulers by their own private standards, dissolving the political order into chaos.
  *   **The "No Remedy" Scenario:** If there is no human public authority capable of checking the tyrant (e.g., an absolute monarch with no superior), Aquinas does not turn to private violence. He turns to **God**. He advises prayer and patience, arguing that God can soften the heart of the tyrant or remove him. To take it into one's own hands is to distrust Divine Providence.

  ### 3. The Case of Judith (The Apparent Exception)
  Aquinas does discuss the biblical story of Judith beheading Holofernes (the Assyrian general besieging her city). In his *Commentary on the Sentences*, he praises her act.
  *   **Why isn't this murder?** Aquinas argues Judith did not act on private authority, but under a **divine instinct** (*instinctu divino*).
  *   **The Crucial Distinction:** This is not a *political* right; it is a *prophetic* exception. Aquinas is not saying "any citizen may kill a tyrant if they feel it's justified." He is saying "if God explicitly moves you to do it, you are an instrument of God, not a private citizen." This offers no standing right for ordinary political resistance.

  ### 4. Why the Confusion? The Jesuit Divergence
  You mentioned Mariana and Suárez. This is where the historiography gets tricky.
  *   **Aquinas:** Authority comes from God, mediated through the natural order. The community cannot easily reclaim authority once given, except through established public mechanisms.
  *   **The Jesuits (Suárez, Mariana, Bellarmine):** Writing in the context of the Wars of Religion and the rise of absolutism, they developed a more robust theory of **popular sovereignty**. They argued that political authority resides fundamentally in the people, who lend it to the king conditionally.
  *   **The Shift:** Because the Jesuits viewed the people as the ultimate repository of authority, they were more willing to argue that if a king breaks the contract, authority "reverts" to the people (or their representatives), who may then act. Mariana, in *De Rege et Regis Institutione* (1599), went further than Aquinas, famously arguing that a tyrant could be killed by a private citizen if no public mechanism existed, provided certain conditions were met.

  Later liberals and resistance theorists often retroactively claimed Aquinas as a "forerunner" to legitimize their own views. They smoothed over the differences between Aquinas's caution and the Jesuits' more radical permission.

  ### 5. Resolving Your Dilemma
  You asked: *"Why does he treat tyranny as the one case in which this otherwise near-inviolable restriction does not hold?"*

  The answer is: **He doesn't.**

  Aquinas's solution to the dilemma of tyranny is not to lower the bar for private killing, but to raise the definition of legitimate resistance.
  1.  **If a public body exists:** They may depose the tyrant (Public Act).
  2.  **If no public body exists:** Subjects must endure or pray (No Human Act).
  3.  **If God commands:** A specific individual may act (Divine Act, not Human Right).

  Aquinas prioritizes the **order of the community** over the **justice of the specific outcome**. He fears that authorizing private tyrannicide destroys the very concept of public authority, replacing law with the private judgment of whoever feels aggrieved. For Aquinas, a flawed political order is often preferable to the chaos of privatized violence, even if that means enduring a bad ruler for a time.

  ### Summary for Your Argument
  If you revisit this with your friend, you can defend the following position:
  *   **Agreement:** A tyrant rules unjustly and forfeits the *moral claim* to obedience regarding unjust commands.
  *   **Correction:** Forfeiting moral claim does not grant subjects the *active power* to punish. Punishment remains a public function.
  *   **Conclusion:** Aquinas is not a theorist of private tyrannicide. He is a theorist of **public deposition**. The citation of him by Jesuit theorists is an instance of later thinkers extending Aquinas's premises beyond where Aquinas himself was willing to go.
