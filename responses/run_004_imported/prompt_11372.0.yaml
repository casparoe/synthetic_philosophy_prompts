  Your intuition is sharp, and your reading of the dialectic between epistemicism and supervaluationism is largely correct. However, the physics analogy you lean on requires careful unpacking, as it cuts both ways. Below, I compare the two views on higher-order vagueness, evaluate your analogy, and offer a defended verdict on which theory provides the more coherent account.

  ### 1. Higher-Order Vagueness: The Claim Assessed

  Your claim is **accurate**. The handling of higher-order vagueness is indeed the stress test where epistemicism shows its formal strength and supervaluationism shows its structural strain.

  *   **The Problem:** First-order vagueness is the uncertainty between "heap" and "not heap." Higher-order vagueness is the uncertainty between "definitely a heap" and "borderline heap." If there is a sharp boundary between the definite and the borderline, vagueness seems to vanish (replaced by ignorance). If there is *no* sharp boundary there either, we face a regress.
  *   **Epistemicism:** As you noted, Timothy Williamson's epistemicism absorbs this effortlessly. For the epistemicist, "Definitely $F$" is just another property with a sharp boundary, located somewhere else in the series. We are ignorant of the $F$/not-$F$ boundary, and we are equally ignorant of the "Definitely $F$"/not-"Definitely $F$" boundary. No new machinery is required; it is ignorance all the way down. Classical logic (specifically bivalence) is preserved at every order.
  *   **Supervaluationism:** This view defines truth as "truth on all admissible precisifications." To handle higher-order vagueness, it must define which precisifications are admissible. But if the set of admissible precisifications is itself vaguely defined (which it must be, to avoid sharp boundaries), the theory requires a hierarchy of meta-precisifications. Critics (like Graff Fara and Williamson) argue this either leads to an infinite regress or smuggles in a sharp boundary at the meta-level (a sharp line between admissible and inadmissible precisifications), thereby collapsing into epistemicism.

  **Verdict on the Claim:** You are right. Epistemicism is theoretically parsimonious here; supervaluationism requires complex, potentially unstable machinery to avoid the very sharpness it seeks to deny.

  ### 2. The Physics Analogy: Insight or Confusion?

  Your analogy—comparing vagueness to a phase transition where a smooth macroscopic change hides a sharp microscopic critical point—is evocative, but technically it trades on a **confusion between idealization and reality**.

  *   **The Thermodynamic Limit:** In statistical mechanics, a perfectly sharp phase transition (a singularity in the free energy) *only* occurs in the thermodynamic limit, where the number of particles $N \to \infty$. In any real, finite system (a real pot of water), the transition is a smooth crossover. There is no exact critical point in reality, only in the mathematical model.
  *   **The Application to Language:** Language is a finite system. There are a finite number of grain-arrangements humans have ever considered or will ever consider. If we follow the physics analogy strictly, it suggests that **there is no sharp boundary**, only a smooth crossover in usage patterns. This actually supports **supervaluationism** (or degree theories), which posits no sharp cut-off, rather than epistemicism, which insists on a sharp cut-off despite the finitude of usage.
  *   **Where the Analogy Holds:** The analogy holds only if you view the "sharp boundary" as a feature of the *logical structure* underlying usage, rather than a physical fact. Williamson argues that semantic facts are determined by usage, but usage is unstable. The "sharp boundary" exists in the same way a "winning move" exists in a game: it is determined by the rules, even if the players cannot identify it.

  **Verdict on the Analogy:** It is misleading if taken ontically (language is not an infinite system), but it captures the *epistemic* feeling correctly: there may be a fact of the matter determined by the system's structure that is inaccessible to the observer. However, a physicist should be wary: in finite systems, the "sharp point" is an artifact of the model, not the territory.

  ### 3. Final Verdict: Which Theory is More Coherent?

  Despite the allure of the physics analogy and the logical elegance of epistemicism, I defend the verdict that **Supervaluationism** (perhaps refined) offers the more coherent *overall* account of vagueness, though Epistemicism wins on *logical* coherence.

  Here is the defense:

  **1. Explanatory Coherence vs. Logical Coherence**
  Epistemicism preserves Classical Logic (Bivalence, Law of Excluded Middle), which is a massive virtue for a physicist. It treats vagueness as a purely epistemic limitation. However, it fails at *explanatory* coherence. It posits the existence of a fact (e.g., "1,000 grains is a heap, 999 is not") that is *in principle* unknowable. In science, we reject unknowable hidden variables (per Bell's Theorem) when they add no predictive power. In semantics, positing a sharp boundary that makes no difference to usage, verification, or communication is "semantic magic." It saves logic by sacrificing the connection between meaning and use.

  Supervaluationism, conversely, respects the **phenomenology of vagueness**. It explains *why* we feel there is no boundary: because the meaning of the word is semantically indecisive. It sacrifices Bivalence (some sentences are neither true nor false) to save the intuition that there is no sharp line. For a theory of *language*, explaining how language works is more important than preserving a specific logical calculus.

  **2. The Higher-Order Vagueness Objection**
  You correctly identified this as epistemicism's strong point. However, the supervaluationist can respond that higher-order vagueness is not a bug, but a feature. The "regress" of precisifications mirrors the open-textured nature of concepts. While epistemicism handles this *formally* better, it does so by denying the phenomenon exists (claiming it is just more ignorance). Supervaluationism attempts to model the phenomenon as it is. A theory that explains the data (the fuzziness of the boundaries of the boundaries) is preferable to a theory that explains it away, even if the latter is mathematically cleaner.

  **3. The Physics Analogy Revisited**
  As a physicist, you know that models are tools. The "sharp phase transition" is a tool for calculating bulk properties, not a description of a finite pot of water. Epistemicism treats the "sharp boundary" as a reality of the finite system (language). Supervaluationism treats it as a model-dependent feature (admissible precisifications). Given that language is finite and messy, the supervaluationist view aligns better with the "finite system" reality you know from statistical mechanics.

  ### Conclusion

  **Epistemicism** is the more coherent *logical* system. It preserves the classical laws of thought you likely hold dear, and it handles higher-order vagueness with elegant simplicity.

  **Supervaluationism** is the more coherent *semantic* theory. It aligns with the nature of linguistic rules and avoids positing unknowable truths.

  **My Defended Verdict:** **Supervaluationism** is the superior theory overall. While epistemicism wins on formal simplicity, it demands we accept a metaphysical mystery (the unknowable sharp boundary) that violates the principle that truth should be grounded in use. Supervaluationism's logical costs (truth-value gaps) are a fair price to pay for a theory that accurately describes how vague terms actually function. Your physics analogy, properly understood, supports this: in finite systems, sharp transitions are idealizations, not hidden realities. Language is a finite system; therefore, the sharp boundary is an idealization, not a fact we are ignorant of.
