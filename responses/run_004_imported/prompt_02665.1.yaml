      *   *Principle of Charity:* We must assume the speaker is mostly rational and truthful to make sense of them.
      *   *Triangulation:* Meaning arises from the causal interaction between two creatures and a shared object in the world. (Crucial for the Skeptic).
      *   *Externalism:* Meaning isn't just in the head; it's determined by causal history and environment. (Crucial for the Defender).
