answer: |-
  This is one of the sharpest questions in the philosophy of biology. You have correctly identified the fault line: the difference between the **Genetic Code** (the translation of nucleotides to amino acids) and **Genetic Information** (the causal role of DNA in building an organism).

  The short answer is: **DNA is literally a code for protein synthesis, but it is metaphorically (and often misleadingly) a code for organismal development.**

  However, since you asked for the steelman of both sides without the "useful metaphor" shrug, we need to dig into the ontological arguments regarding *semantic information* versus *causal specificity*.

  Here is the untangling.

  ---

  ### Side 1: The Realist Steelman (DNA is a Genuine Semantic Code)
  **Proponents:** Sahotra Sarkar, John Maynard Smith, Ernst Mayr (in part).
  **Core Argument:** DNA satisfies the rigorous definition of a semantic communication system, distinct from mere physical causation.

  The strongest argument for DNA being a "real" code relies on the distinction between **chemical interaction** and **symbolic representation**.

  1.  **The Arbitrariness Criterion:**
      In a true code, the relationship between the signifier and the signified is arbitrary, not determined by physical law.
      *   *Physical Causation:* If you heat water, it boils. This is a law of thermodynamics. The temperature doesn't "code" for boiling; it causes it directly.
      *   *The Codon:* There is no chemical law that dictates `UUU` must bind to Phenylalanine. It could have been `GGG`. The mapping is a frozen accident (a convention).
      *   *The Decoder:* Crucially, a code requires a decoding mechanism that interprets the convention. The cell contains literal decoding machinery (tRNA and ribosomes) that "reads" the sequence and assigns meaning based on the convention.
      *   *Conclusion:* Because the mapping is arbitrary and mediated by a decoder, the DNA-to-Protein step is not just causation; it is **semantic information processing**.

  2.  **Specificity and Counterfactuals:**
      Philosophers of biology like Sahotra Sarkar argue that genes carry "programmed information" because they satisfy specific counterfactual conditions.
      *   If you change the DNA sequence (holding the cellular environment constant), the protein changes predictably.
      *   If you change the temperature (holding DNA constant), the reaction rate changes, but the *specificity* of the product does not.
      *   Therefore, DNA holds the **specificity** of the outcome, while the environment provides the **energy/conditions**. In information theory, the carrier of specificity is the information source.

  3.  **The "Blueprint" Defense:**
      Realists argue that while the environment is necessary, it is not *instructive*. The womb provides the heat and nutrients, but it does not contain the instructions for *where* the eyes go. The DNA contains the differential instructions that distinguish a human from a chimp, even if both develop in similar uterine environments. Therefore, the *difference-making* information resides in the genome.

  **The Verdict:** On the molecular level (transcription/translation), DNA is indisputably a code in the same sense that Morse code is a code. It uses discrete symbols, arbitrary mapping, and a decoder.

  ---

  ### Side 2: The Skeptic Steelman (DNA is Just One Causal Resource)
  **Proponents:** Susan Oyama (Developmental Systems Theory), Paul Griffiths, Eva Jablonka.
  **Core Argument:** Privileging DNA as "information" and everything else as "environment" is a bias, not an ontological fact. Development is a system, not a transmission.

  The pushback you mentioned regarding diet and temperature is the core of **Developmental Systems Theory (DST)**. Their argument is that calling DNA a "code" for *traits* (like eye color or height) smuggles in a pre-Darwinian essentialism.

  1.  **The Causal Parity Thesis:**
      DST argues that for a phenotype to emerge, you need DNA, yes, but you also need:
      *   Cytoplasmic structure (egg geometry).
      *   Methylation patterns (epigenetics).
      *   Uterine hormones.
      *   Gravity (for bone density).
      *   Temperature (for sex determination in reptiles).
      *   *Argument:* All of these are *necessary causes*. If you remove the DNA, no organism. If you remove the cytoplasmic structure, no organism. If you remove gravity, no skeleton.
      *   *The Punchline:* Why do we call DNA "information" but gravity "context"? DST argues this is purely because DNA is the unit of *evolutionary selection*, not because it is the unit of *developmental instruction*. We privilege it because it's the replicator, not because it's the boss.

  2.  **Context-Dependence of "Meaning":**
      If DNA were a true code for traits, a specific sequence should reliably map to a specific trait. It often doesn't.
      *   *Pleiotropy:* One gene affects multiple traits.
      *   *Polygeny:* One trait is affected by many genes.
      *   *Norm of Reaction:* The same genotype produces different phenotypes in different environments (e.g., water fleas growing helmets only when they smell predators).
      *   *Argument:* If the "message" changes depending on the context, the information isn't *in* the DNA; it is in the **relationship** between the DNA and the context. A book that changes its story depending on who reads it isn't a code; it's a component of an interactive system.

  3.  **The "Homunculus" Problem:**
      To say DNA "encodes" eye color implies there is a little man inside the cell reading the DNA and building an eye. But there is no reader for development. There is only chemistry.
      *   In translation (DNA → Protein), there is a ribosome (the reader).
      *   In development (DNA → Organism), there is no central decoder. The DNA interacts with proteins, which interact with DNA, in a feedback loop.
      *   *Argument:* Calling this a "code" implies a linear flow of information (Sender → Message → Receiver) that simply does not exist in embryology. It is a network, not a transmission.

  **The Verdict:** DNA is a *template* or a *resource*, not a program. Calling it a "code" for height or behavior is category error. It is a causal factor that happens to be discrete, but so are many other things (e.g., neural firing patterns).

  ---

  ### The Principled Resolution: Why the Distinction Matters

  You asked if there is a principled argument for why genes are privileged carriers of developmental information. The resolution lies in separating **Replication** from **Development**.

  #### 1. The "Code" is Real, The "Program" is False
  The steelman synthesis is this: **DNA is a semantic code for protein sequence, but a causal constraint for phenotype.**

  *   **Molecular Level:** The codon table is a genuine code. It meets the criteria of syntax, semantics, and arbitrary mapping mediated by a decoder. No serious biologist denies this.
  *   **Organismal Level:** The idea that DNA "encodes" the organism is the metaphor that breaks. DNA does not contain a spatial map of the body. It contains a set of chemical reaction rules that, when executed in a self-organizing soup, *result* in a body.

  #### 2. Why Genes Get Privileged (The Evolutionary Argument)
  You asked: *Why should genes get to be uniquely special just because their alphabet is discrete?*

  The answer is not developmental; it is **evolutionary**.
  *   **Stability:** Cytoplasmic structures, uterine environments, and behavioral traditions are hard to copy with high fidelity across generations. DNA is chemically stable and replicates with extreme fidelity.
  *   **Bottleneck:** In sexual reproduction, the *only* thing that passes from parent to offspring is the DNA (and some epigenetic markers). The body is destroyed; the genes survive.
  *   **The Distinction:** We call DNA "information" because it is the **bridge across time**. We call the environment "noise" or "context" because it is the **medium of the present**.

  So, when scientists say DNA "encodes eye color," they are speaking in shorthand for: *"DNA contains the heritable variations that correlate with differences in eye color, assuming a standard developmental environment."*

  #### 3. Addressing the Diet/Temperature Objection
  Why isn't diet "information"?
  *   **Diet** provides *matter and energy*. It is the substrate.
  *   **DNA** provides *specificity*. It is the constraint.
  *   **Information Theory View:** In a communication channel, the "signal" is the variable part that selects one outcome from a set of possibilities. The "channel" is the constant part that allows transmission.
      *   Because DNA varies between individuals (A vs. B) while the cellular machinery remains largely constant, DNA is treated as the signal.
      *   However, DST correctly points out that if the cellular machinery varies (e.g., a mutation in the ribosome), the "message" changes even if the DNA is the same. Thus, the "information" is distributed.

  ### Final Conclusion

  Is DNA a code?

  1.  **Strictly Speaking:** Yes, for **protein synthesis**. The codon-amino acid mapping is a genuine semiotic system with arbitrary rules and decoding machinery. This is not a metaphor; it is a mechanistic description of translation.
  2.  **Colloquially:** No, for **organismal traits**. DNA does not "encode" height or behavior in the way a hard drive encodes a movie. It encodes the *parameters* for a self-organizing system.
  3.  **Philosophically:** The privilege given to DNA is **evolutionarily justified** (it is the replicator) but **developmentally unjustified** (it is not the sole constructor).

  The "shrug" you want to avoid is this: **Don't confuse the *vehicle of heredity* with the *instruction manual for construction*.** DNA is the former. It carries the information necessary to restart the system, but the information required to *run* the system is distributed across the entire cell, the organism, and the environment.

  The word "code" sticks because it captures the **discrete, heritable, specific** nature of genetic transmission. It fails because it implies a **linear, top-down, deterministic** nature of developmental construction. Both sides are right about different processes.
