      *   *Conclusion:* Summarize. Rawls wins on political philosophy grounds; Harsanyi wins on decision theory grounds. The VoI reflects the moral commitments put into it.

  3.  **Drafting - Section by Section:**

      *   *Intro:* Start with the shared methodology (contractarianism/Vol). Highlight the paradox: same setup, opposite results. Thesis: Rawls's derivation is more defensible for *political justice* because it correctly identifies the stakes as fundamental rights rather than welfare lotteries, though the disagreement exposes that the VoI is not neutral but relies on prior moral conceptions of the person.
      *   *Harsanyi's Aggregation:* Explain the "Impartial Observer." If I have an equal chance of being anyone, I should maximize the average utility. This relies on the Principle of Insufficient Reason (Laplace). It treats justice as a problem of risk.
