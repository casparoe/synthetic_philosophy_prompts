answer: |-
  Your hesitation is not only principled; it is historically literate. As a geophysicist who worked during the consolidation of plate tectonics, you occupy a unique epistemic vantage point. You witnessed the exact transition you are now questioning: the moment when a set of disparate, robust observations (paleontology, coastlines, paleoclimate) were finally united by a physical mechanism (seafloor spreading, subduction) that was *different* from the one originally proposed.

  Your intuition aligns with a specific and robust strand of philosophy of science known as **Structural Realism**. This framework offers a principled way to calibrate your trust, distinguishing between what is likely to survive a paradigm shift and what is likely to be discarded.

  Here is how you might apply that framework to your current skepticism regarding dark matter and dark energy.

  ### 1. Kinematics vs. Dynamics (The Wegener Lesson)
  Your analysis of the Wegener episode is precise. What survived the revolution was the **kinematics** (the continents move relative to one another; the Atlantic is widening). What was discarded was the **dynamics** (the specific forces Wegener invoked, such as tidal drag and centrifugal force, which Jeffreys correctly showed were orders of magnitude too weak).

  In cosmology, we must ask: What is the kinematic observation, and what is the dynamic explanation?
  *   **The Kinematics:** Galaxies rotate too fast for their visible mass; the expansion of the universe is accelerating; gravitational lensing is stronger than visible matter allows. These are the "fossil matches" and "coastline fits" of cosmology. They are robust observational anomalies.
  *   **The Dynamics:** "Dark Matter" and "Dark Energy" are currently dynamic placeholders. They are names we give to the *source* of the gravitational effects.

  **Principle 1:** Trust the observational anomaly (the kinematic fact), but remain agnostic about the ontological label (the dynamic mechanism). Just as "continental drift" was true but "tidal dragging" was false, "gravitational anomalies on galactic scales" are likely true, but "Weakly Interacting Massive Particles (WIMPs)" might be the tidal drag of our era.

  ### 2. Structural Realism: What Survives Theory Change?
  The philosopher John Worrall, analyzing the very history you lived through (specifically the shift from Fresnel's ether to Maxwell's electromagnetism), argued that when theories change, the *ontology* (what we say exists) often gets thrown out, but the *mathematical structure* (the relationships between observables) is retained.

  Fresnel believed light traveled through a mechanical ether. That was wrong. But the equations he derived for light's behavior were retained by Maxwell, who discarded the ether.

  **Application to Cosmology:**
  If Dark Matter turns out to be a modification of gravity (like MOND or something more relativistic), the *particles* will be discarded. However, the **Friedmann equations** and the structural relationships describing the expansion history and structure growth are likely to be retained as limiting cases or approximations.

  **Principle 2:** Place your trust in the mathematical structure that successfully predicts novel phenomena (e.g., the CMB power spectrum), but treat the physical interpretation of the parameters ($\Omega_\Lambda$, $\Omega_m$) as provisional. The equations are likely "structurally real"; the nouns we attach to them may not be.

  ### 3. Entity Realism and "Sprayability"
  Another philosophical heuristic comes from Ian Hacking: "If you can spray it, it is real." This is **Entity Realism**. We believe in electrons not just because they explain cathode rays, but because we can manipulate them to build microscopes.

  In your field, we eventually "touched" the mechanism of plate tectonics. We mapped the magnetic stripes on the ocean floor (work your colleagues likely relied upon). We measured the heat flow. We located the subduction zones. The mechanism became manipulable and directly observable.

  In cosmology, we have not "sprayed" dark matter. We have not detected a particle in a collider, nor have we observed a non-gravitational interaction. We are currently in the "Wegener Phase," where the effect is undeniable, but the agent is invisible.

  **Principle 3:** Calibrate trust based on **instrumental robustness**. Plate tectonics became unquestioned when multiple independent lines of evidence (paleomagnetism, seismology, heat flow) converged on the *mechanism*, not just the *motion*. Dark matter/energy currently relies almost exclusively on gravitational inference. Until a non-gravitational detection occurs, treating them as substantive "stuff" rather than "phenomenological parameters" is a metaphysical choice, not an empirical necessity.

  ### 4. The "No Miracles" Argument vs. The Pessimistic Meta-Induction
  There are two competing philosophical arguments here:
  1.  **The No Miracles Argument:** The $\Lambda$CDM model is so successful at predicting the Cosmic Microwave Background (CMB) anisotropies that it would be a miracle if it weren't at least approximately true.
  2.  **The Pessimistic Meta-Induction:** History shows that almost every successful past theory (Newtonian gravity, the Ether, Phlogiston) turned out to be ontologically false. Therefore, $\Lambda$CDM is likely ontologically false too.

  Your experience suggests a synthesis. The "miracle" is not that Dark Matter exists as a particle, but that the **gravitational structure** of the universe follows the pattern $\Lambda$CDM describes. The "pessimistic induction" warns us that the *explanation* for that pattern will likely change.

  ### 5. A Geophysicist's Calibration
  You asked if there is a principled way to tell what will survive. Based on the history of your own field, here is a rubric:

  *   **High Survival Probability:** The data itself (redshifts, rotation curves, CMB maps). Like the fit of the continents, these are brute facts.
  *   **Medium Survival Probability:** The General Relativistic framework. Like the conservation of energy, this is deeply embedded. However, remember that Newtonian gravity survived as a limit of GR; GR may survive as a limit of something else.
  *   **Low Survival Probability:** The specific ontology of "Dark Matter" as a particle species. This is analogous to Wegener's tidal forces. It is the current best guess for the *engine*, but history suggests engines are the first thing to be swapped out.
  *   **Low Survival Probability:** The "Cosmological Constant" as a vacuum energy density. The discrepancy between predicted and observed values (120 orders of magnitude) is a screaming anomaly, akin to the heat flow data that contradicted a cooling-only Earth.

  ### Conclusion: Informed Agnosticism
  Your hesitation is not unearned skepticism; it is **informed agnosticism**.

  You are recognizing the difference between **empirical adequacy** (the theory saves the phenomena) and **ontological truth** (the theory describes what actually exists). Cosmologists often speak as if the two are identical. Your career teaches you they are not.

  Wegener was right that the continents moved, but wrong about why. It is entirely possible that future physicists will say: "The early 21st-century cosmologists were right that the universe's expansion is accelerating and that galaxies have excess gravity, but they were wrong that it is caused by 'dark' substances. It is a property of spacetime geometry we hadn't yet formulated."

  You can trust the measurements without trusting the metaphysics. That is not cynicism; it is the wisdom of someone who has seen a paradigm shift from the inside.
