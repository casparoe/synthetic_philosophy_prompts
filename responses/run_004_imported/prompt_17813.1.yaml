answer: |-
  **Setting:** *A quiet corner of a university coffee shop. Alex, a researcher in evolutionary biology, and Sam, a philosopher of medicine, are finishing up a late afternoon coffee. The conversation has been running hot for twenty minutes.*

  **Alex:** Look, I get why your aunt is annoyed. Nobody likes being told they're sick when they feel fine. But her frustration doesn't change the biology. If her pancreas is struggling to manage insulin load compared to a healthy human of her age and build, that is a factual state of affairs. It's like saying your car engine is "fine" even though the compression is low, just because it's still moving.

  **Sam:** But a car doesn't have a subjective experience. A car doesn't lose its job because an insurance company sees a code in its file. You're arguing for what philosophers call "Naturalism." You think disease is just a value-free biological dysfunction. I'm saying that's impossible. The moment you decide *which* dysfunctions count as diseases, you've smuggled in a value judgment.

  **Alex:** I haven't smuggled anything in. I'm using the Biostatistical Theory. A disease is a reduction in the ability of a part of the body to contribute to survival and reproduction, relative to the species norm. It's objective. We measure the function, we measure the stats, we find the deviation. No values required.

  **Sam:** Okay, let's test that. You mentioned survival and reproduction. Let's talk about Drapetomania. You know the case?

  **Alex:** The 19th-century "disease" where enslaved people ran away?

  **Sam:** Exactly. Dr. Cartwright published this in a medical journal. He argued that the desire to escape slavery was a pathology of the mind. He had causes, he had treatments (whipping and amputation, by the way). By your definition, couldn't he argue that escaping reduces survival? It's dangerous. It goes against the "social order" of the time, which was the functional norm for those people in that context.

  **Alex:** No, because Cartwright was lying about the biology. There was no dysfunction. Escaping slavery is a rational response to oppression, not a failure of the brain's cognitive machinery. The Naturalist view kills Drapetomania easily: there is no lesion, no chemical imbalance, no statistical failure of the brain to process reality. The brain was working *perfectly* to achieve the person's goals. It's not a disease because it's not a dysfunction.

  **Sam:** But who decides what counts as a "goal" or "rational"? Cartwright decided the "proper function" of an enslaved person was to stay enslaved. If you define the "species design" based on the dominant power structure, your "objective biology" just becomes a tool for oppression. You say values aren't needed, but the choice of *which* functions matter is inherently valuable. Why is survival the goal? Why not autonomy?

  **Alex:** Because medicine is about keeping the organism alive and functioning. If we make "autonomy" the metric, then a masochist who wants to be hurt is "healthy" when they're being harmed. That's absurd. We need a baseline of biological functioning. If your aunt's blood sugar is high, her vascular system is taking damage. That damage is objective. It leads to blindness, kidney failure. Those are biological failures, not social opinions.

  **Sam:** The damage is real, I grant you that. But is "prediabetes" a disease, or is it a risk factor? That's the line your aunt is stuck on. You've moved the goalposts. Fifty years ago, her numbers would have been "normal aging." Now they are "prediabetic." The biology of her blood didn't change overnight. The *value* we place on that number changed. We decided we want to intervene earlier. That's a policy choice, not a discovery of a new entity.

  **Alex:** It's a discovery of a continuum. We used to think diabetes was a switch: on or off. Now we know it's a slope. We drew a line at "prediabetes" because that's where the statistical probability of organ damage spikes. It's like a hurricane warning. The storm hasn't hit your house yet, but the pressure is dropping. Is the warning "subjective"? No, it's based on meteorological data.

  **Sam:** But a hurricane warning tells you to board up windows. Calling it a "disease" tells your aunt she is *sick*. It changes her identity. It medicalizes her life. This brings me to menopause. By your definition—reproductive function stopping—menopause should be the biggest disease of all for women. The ovaries stop doing their "design function."

  **Alex:** [Laughs] I knew you'd bring that up. But menopause isn't a dysfunction because it's species-typical. Every human female is "designed" by evolution to undergo menopause. It's a feature, not a bug. It doesn't reduce survival fitness at that age; in fact, the "Grandmother Hypothesis" suggests it increases the survival of kin. So, it's not a disease. It's normal functioning.

  **Sam:** See, that's the contortionism I'm talking about. You're twisting the definition to avoid calling a universal experience a disease. But if I have hot flashes, bone density loss, and heart palpitations, I am suffering. If I go to a doctor, they give me hormones to "fix" the imbalance. If it's treated like a disease, and causes harm like a disease, why are you so desperate to say it isn't one?

  **Alex:** Because if menopause is a disease, then aging is a disease. Tooth decay is a disease. Wrinkles are a disease. If everything that reduces function is a disease, the word loses meaning. We need to distinguish between *pathology* and *natural life stages*.

  **Sam:** And who draws that line? That's my point! You say it's objective, but you're making a value judgment that aging is "natural" and therefore exempt, while high blood sugar is "unnatural" and therefore a disease. But both are biological processes. The difference is that we *dislike* the consequences of high blood sugar more, or we have a pill for it.

  **Alex:** We dislike them because they kill us. That's not a value; that's a biological imperative.

  **Sam:** Is it? People smoke. People climb Everest. We take risks all the time. The reason your aunt cares about the blood sugar isn't just biology; it's because society tells her she *ought* to be healthy. If we lived in a society that accepted early death as part of the natural order, prediabetes wouldn't be a diagnosis. It would just be... fate. The "disease" label is a call to action. It says, "This is bad, and you must fix it." That "bad" is a value.

  **Alex:** Okay, let's pivot. I think you're conflating "disease" with "illness." This is that distinction you hinted at earlier.

  **Sam:** Go on.

  **Alex:** "Illness" is the lived experience. The feeling of being unwell. The social role of the sick person. "Disease" is the underlying biological malfunction. Your aunt has a *disease* process starting (biological dysfunction), but she doesn't have an *illness* (she feels fine). Drapetomania was neither. There was no biological dysfunction, and the "illness" was only imposed by the slaveholder. Menopause is a biological transition, not a dysfunction, so it's neither, though it can cause illness symptoms.

  **Sam:** That's a cleaner distinction, I'll give you that. But does it solve the problem? If I have a "disease" without an "illness," the doctor treats the lab result, not me. That leads to over-treatment. It leads to your aunt taking meds she doesn't need for a condition she doesn't feel, potentially causing side effects that make her actually feel ill.

  **Alex:** But if we wait until she feels ill, her kidneys might be gone. The whole point of modern medicine is to catch the *disease* before it becomes the *illness*.

  **Sam:** And that's where the power lies. By defining "disease" as strictly biological, you give the doctor authority over the healthy person. You turn citizens into patients. If "disease" includes a value judgment about harm, then we have to ask: "Is this label actually helping the person, or is it serving the insurance company?"

  **Alex:** But if we make "harm" subjective, then I can refuse to call cancer a disease if I don't feel harmed by it. We lose the ability to mandate public health measures. We lose the objective ground to say Cartwright was *wrong*, not just mean. He was wrong because his biology was fake. My aunt's blood sugar is real.

  **Sam:** Cartwright was wrong because his biology was racist, yes. But he was also wrong because he pathologized a reaction to an unjust environment. If we only look at the biology, we miss the context. If a whole neighborhood has lead poisoning, is it a "disease" or is it a crime? If we call it a disease, we treat the kids. If we call it a crime, we punish the polluter. The definition dictates the solution.

  **Alex:** So you want to politicize the diagnosis?

  **Sam:** I want to acknowledge that the diagnosis is *already* political. You're pretending it's not. You say "value-free," but you value survival over autonomy, and you value statistical norms over individual variation. I'm just saying we should be honest about those values.

  **Alex:** I'm not pretending they aren't there. I'm saying they are universal values. Everyone wants to survive. Everyone wants their body parts to work. If we anchor "disease" to that, we minimize the politics. If we anchor it to "what society thinks is harmful," then disease changes every time the wind blows.

  **Sam:** But "what body parts are supposed to do" changes too. We used to think the uterus wandered around the body causing hysteria. That was the "biological fact" of the time. Now we know it doesn't. Our understanding of "function" is theory-laden. It's not a raw fact.

  **Alex:** True, our *theories* change. But the goal of the theory is to match reality. We got better at measuring blood sugar. We got better at understanding brains. Drapetomania failed because it didn't match reality. Prediabetes holds up because it predicts outcomes.

  **Sam:** It predicts outcomes *if* you don't intervene. But the label itself changes the outcome. It's a self-fulfilling prophecy.

  **Alex:** [Pauses, stirs coffee] So, where does that leave us? Are we just arguing semantics?

  **Sam:** Maybe. Maybe you're using "disease" to mean "pathological process," and I'm using it to mean "condition warranting medical attention and social sympathy."

  **Alex:** If that's all it is, then fine. Let's say your aunt has a "pathological risk factor." Not a disease. But she still needs to eat better.

  **Sam:** And if she has a pathological risk factor, but fixing it costs her life savings and causes her anxiety that ruins her quality of life... is it still a "disease" in the sense that matters?

  **Alex:** [Sighs] No. Then it's a biological fact that isn't worth treating.

  **Sam:** Exactly. So the "disease" label isn't just the biology. It's the biology *plus* the judgment that treatment is warranted. You can't separate the two.

  **Alex:** I still think you're risking too much subjectivity. If we require "warranted treatment" to define disease, then a rich person's condition is a disease (they can treat it), and a poor person's isn't (they can't). That's a nightmare.

  **Sam:** And if we require only "biological dysfunction," then we treat everyone's numbers until the system collapses, and we ignore the social causes of those numbers. That's also a nightmare.

  **Alex:** So we're stuck.

  **Sam:** We're stuck with the responsibility. We can't hide behind "objective science" to make moral choices. Your aunt's diagnosis isn't just a number, Alex. It's a story we're telling her about her future. We need to make sure it's a story that helps her, not just one that's technically true.

  **Alex:** I can agree to that. But I still maintain the numbers are technically true. And ignoring them because we're worried about the "story" is how people end up on dialysis.

  **Sam:** And treating the numbers without listening to the person is how medicine loses its soul.

  **Alex:** [Raises coffee cup] To the tension, then.

  **Sam:** [Clinks mug] To the tension. Someone has to keep us honest.
