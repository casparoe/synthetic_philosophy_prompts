answer: |-
  Honorable Judge, distinguished guests, scholars, and most especially, the newest Americans among us.

  It is a humbling thing to stand in a federal courthouse on the Fourth of July. It is more humbling still when you have spent the last few years living inside the mind of Frederick Douglass. I wrote a novel about him. Three hundred pages. And if I learned anything from inhabiting his voice, it is that Douglass did not suffer fools, and he certainly did not suffer easy comforts.

  I know why I was asked to stand here. I know the obvious speech. I know the one you might expect. In 1852, in this very region, Douglass stood before a crowd and asked, "What to the Slave is the Fourth of July?" He called the celebration a sham. He called the liberty of this nation a hollow mockery. That speech is a masterpiece of righteous anger. It is necessary. It is true.

  But if I stand here today and only recite that anger, I would be telling you only half of Douglass's story. And I would be doing a disservice to the scholars in the room who know that Douglass's mind did not stop in 1852.

  There came a turning point. A break. Douglass eventually parted ways with his mentor, William Lloyd Garrison. Garrison believed the Constitution was a "covenant with death," a pro-slavery document that should be burned. But Douglass, after years of study, after reading the text line by line, came to a harder, more complex conclusion. He argued that the Constitution's text never once says "slave." It never says "slavery." It uses euphemisms. It hides.

  Douglass concluded that the *text* was not the betrayal. The *practice* was the betrayal.

  This is a vital distinction. It is the difference between a house that is rotten to its foundation, and a house built on a sound blueprint that the occupants have vandalized. Douglass decided that the founding documents were not a bargain with evil, but a promise that had been broken. And a promise, unlike a contract, can be reclaimed.

  I tell you this because you are here to take an oath. You are not swearing allegiance to the history of this country's behavior. You are swearing allegiance to the text of its laws. You are swearing allegiance to the blueprint.

  To the new citizens: You come from thirty different countries. I do not need to tell you that every nation has a gap between what it says it is and what it does. You know this. You have lived this. Some of you come from places where the text is a lie. Here, the text is a demand.

  When you raise your right hand in a moment, you are not saying that America is perfect. You are saying that you believe in the mechanism by which it might become whole. You are stepping into the gap between the letter of the law and the history of the practice.

  This is not a comfortable position. It requires what Douglass called "moral stamina." It requires you to look at the betrayal—the slavery, the segregation, the exclusions—and not look away. To acknowledge that for millions, this holiday was not a celebration, but a reminder of chains. We cannot let the promise cancel out the betrayal. The pain was real. The exclusion was real.

  But we also cannot let the betrayal cancel out the promise. Because if the document is rotten, there is no work to do but burn it. But if the document is a promise, there is work to do to keep it.

  The Judge has asked us to avoid the noise of current politics. I intend to honor that. Because this is not about left or right. It is about up and down. It is about the distance between the ground we walk on and the standard we claim to walk by.

  Douglass realized that silence in the Constitution was not an endorsement of slavery, but a vulnerability. A place where liberty could be written in. He realized that the law was a tool, and like any tool, its morality depends on the hand that wields it.

  Today, you become the hands.

  When you take this oath, you are inheriting a debt. You are inheriting the debt of a nation that claimed "all men are created equal" while holding human beings in bondage. That debt is not paid. But it is payable. It is payable because the text allows it. The text invites it.

  To the scholars here: I know Douglass is more complex than any speech can capture. I know he changed his mind, as living thinkers must. I hope this honors the trajectory of that change.

  To the new citizens: You are not joining a club of the flawless. You are joining a project of the persistent. You are joining the effort to make the practice match the text.

  There will be days when the gap feels too wide. There will be days when the betrayal feels louder than the promise. On those days, remember the shift Douglass made. Remember that the law, read by its letter, is on the side of liberty. Remember that the silence in the text is where you get to speak.

  Douglass once said, "If there is no struggle, there is no progress." He did not promise you that this citizenship would be easy. He promised you that it would be worth the struggle.

  So, when you raise your hand, do not think of it as a salute to a perfect past. Think of it as a pledge to a unfinished future. Think of it as picking up the pen where the founders put it down. They wrote the promise. They failed the practice. You are here to bridge the two.

  Welcome to the work. Welcome to the promise. Welcome to the United States.

  Thank you.
