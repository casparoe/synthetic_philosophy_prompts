  My grandfather insists that my relationship with my same-sex partner is simply wrong, even though he admits it isn't harming anyone, including the two of us. When I press him to explain further, the most he can offer is that it "goes against nature" and that it strikes him, at a gut level, as deeply wrong, and he seems to think that reaction alone should settle the matter. Something about this feels off to me, but I can't quite work out why a strong, sincere feeling of disgust shouldn't count as evidence that something is morally wrong, even when no actual harm is involved. Is he onto something, or does a reaction like his not carry any real moral weight on its own?
