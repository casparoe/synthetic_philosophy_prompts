answer: |-
  It is completely understandable that you feel something is "off" about your grandfather's reasoning. In philosophy and ethics, your intuition that a feeling alone does not constitute a moral argument is widely supported.

  You are asking a profound question about the nature of moral reasoning: **Does a strong, sincere feeling of disgust or wrongness count as evidence that something is morally wrong, even when no harm is involved?**

  The short answer, according to most contemporary ethical frameworks, is **no.** A gut reaction, while real to the person feeling it, does not carry objective moral weight on its own. Here is a breakdown of why your grandfather's argument struggles to hold up under scrutiny, and why your skepticism is philosophically sound.

  ### 1. The "Wisdom of Repugnance" vs. Historical Error
  Your grandfather is relying on what some ethicists call the "wisdom of repugnance"—the idea that deep disgust is a signal of a deep moral violation. However, history shows that gut reactions are unreliable guides to morality.

  *   **Cultural Conditioning:** Disgust is often learned, not innate. For centuries, people felt a "gut-level" wrongness about interracial marriage, left-handedness, or women working outside the home. Those feelings were sincere, but they were reflections of social conditioning, not objective moral truths.
  *   **The Unfamiliar:** Psychologically, humans often experience disgust when encountering things that are unfamiliar or that violate traditional boundaries. This is a protective mechanism, not necessarily a moral compass. Just because something feels strange or unfamiliar to one generation does not make it immoral.

  ### 2. The "Appeal to Nature" Fallacy
  Your grandfather's claim that your relationship "goes against nature" is a classic logical error known as the **Appeal to Nature Fallacy**. This argument suggests that what is "natural" is good, and what is "unnatural" is bad.

  *   **Natural $\neq$ Good:** Many things are natural but harmful (e.g., cancer, natural disasters, disease).
  *   **Unnatural $\neq$ Bad:** Many things are "unnatural" but good (e.g., medicine, eyeglasses, heating, cooking).
  *   **Factual Accuracy:** Furthermore, same-sex behavior is well-documented in hundreds of animal species. Biologically, it is not "against nature" in the literal sense.

  Even if we accept the premise that we should follow "nature," nature is descriptive (what *is*), not normative (what *ought* to be). Morality is largely about how we choose to act within the world, often to improve upon raw nature.

  ### 3. The Harm Principle
  You mentioned a crucial detail: **your grandfather admits no harm is being done.**

  In modern secular ethics, the **Harm Principle** (articulated by John Stuart Mill) suggests that the only justification for interfering with someone's liberty is to prevent harm to others. If a consensual relationship causes no harm to the participants or society, it is difficult to construct a secular moral argument against it.

  If morality is about how we treat one another and minimize suffering, a private, consensual, loving relationship that harms no one fits comfortably within moral bounds. If your grandfather claims it is wrong *despite* the lack of harm, he is arguing for a "victimless crime," which requires a justification beyond simple intuition.

  ### 4. Intuition vs. Reason
  In ethics, intuitions (gut feelings) are often seen as **starting points** for discussion, not **end points**.

  *   **Intuition:** "I feel this is wrong."
  *   **Reasoning:** "Why do I feel this? Is there a victim? Is there a violation of rights? Is there a contradiction?"

  When you press your grandfather for reasons and he can only return to "it just feels wrong," he is admitting that he cannot move from intuition to reasoning. In a moral debate, a feeling without a rationale is not evidence; it is a statement of personal preference. While he is entitled to his feelings, they do not constitute an objective judgment on your life.

  ### 5. Why Does He Feel This Way?
  Understanding *why* he feels this way might help you navigate the relationship, even if you reject his conclusion.
  *   **Generational Scripts:** He likely grew up in a time when social roles were rigidly defined. Deviations from those roles can feel like a threat to the social order he understands.
  *   **Moral Disgust as Identity:** For some, holding traditional views is tied to their own sense of virtue or religious identity. Changing their mind might feel like admitting their own life's moral framework was flawed.
  *   **Fear of Change:** Sometimes, "against nature" is a code for "I am afraid of a world I don't understand."

  ### Conclusion
  You are right to trust your feeling that his reasoning is insufficient. A strong, sincere feeling of disgust does not carry moral weight on its own because feelings are subjective, historically unreliable, and often disconnected from actual harm.

  **Is he onto something?** He is onto a genuine *emotion* he is experiencing, but he is mistaken in treating that emotion as *evidence*.

  **Does it carry moral weight?** Not objectively. Moral claims require reasons that can be examined, tested, and shared. "I feel it is wrong" is a statement about him, not a statement about you or your relationship.

  It is possible to love your grandfather and respect his sincerity while firmly rejecting the validity of his moral judgment. You can acknowledge his feelings ("I understand this feels wrong to you") without accepting his conclusion ("But I know that our relationship is loving, consensual, and harmless, which is what actually matters morally").
