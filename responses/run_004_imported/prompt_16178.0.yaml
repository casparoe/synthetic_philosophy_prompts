answer: |-
  Your friend is right: this is absolutely a rerun. In fact, if you strip away David Lewis's concrete modal realism and replace it with Leibniz's conceptual idealism, **Leibniz is a Counterpart Theorist.** He is not a Transworld Identity theorist in the Kripkean sense.

  If you pin Leibniz down using his own machinery (Complete Concept, Compossibility, PSR), he cannot coherently hold that *the very same individual substance* exists in more than one possible world. To claim otherwise requires treating his "vague Adam" move as a metaphysical loophole, when it is actually just a linguistic concession.

  Here is the committed reading: **Leibniz is a Superessentialist, and Superessentialism logically entails Counterpart Theory.**

  ### 1. The Complete Concept Doctrine Kills Transworld Identity
  The core of the dispute lies in the *Discourse on Metaphysics* §8 and the correspondence with Arnauld. Leibniz insists that the individual concept of "Adam" contains *every* predicate true of him, past, present, and future. This includes "crossing the Rubicon" (for Caesar) or "eating the apple" (for Adam).

  In modern modal logic terms, if property $P$ is contained in the concept of individual $x$, then $x$ has $P$ necessarily. If you remove $P$, you no longer have $x$; you have $y$.

  Kripke's Transworld Identity relies on the intuition that we can stipulate an object exists in another world with different contingent properties (e.g., "Nixon could have lost"). For Kripke, "Nixon" is a rigid designator that picks out the same biological entity across worlds, regardless of properties.

  For Leibniz, this is impossible. There is no "bare particular" underlying the properties. An individual *is* the sum of its predicates unified by a substantial form. If you change a predicate (e.g., Adam does not sin), you have changed the complete concept. If you have changed the complete concept, you have a different individual substance. Therefore, the "Adam" in the world where he does not sin is **not** the Adam of Genesis. It is a distinct possible individual who resembles the actual Adam but differs in essence.

  That is the definition of Counterpart Theory. Lewis argues individuals are world-bound because spatiotemporal continuity cannot cross worlds. Leibniz argues individuals are world-bound because *conceptual containment* cannot cross worlds. The result is the same: no transworld identity.

  ### 2. The "Vague Adam" is a Linguistic Mask, Not a Metaphysical Loophole
  Critics (and your friends who want Leibniz to be a Transworld Identity theorist) point to Leibniz's admission to Arnauld that we can speak of a "vague Adam" (*Adamus vagus*)—an Adam defined only by general characteristics (e.g., "the first man") rather than the complete individual notion. Leibniz says that *this* vague Adam could have not sinned.

  It is tempting to read this as Leibniz saving Transworld Identity. It is not. It is a distinction between *de re* (about the thing) and *de dicto* (about the description) modality.

  *   **Strict Sense (*De Re*):** The actual individual Adam (complete concept) cannot not-sin. It is hypothetically necessary. To imagine him not sinning is to imagine a different individual.
  *   **Loose Sense (*De Dicto*):** We can talk about the *concept* "first man" and ask if that description could be satisfied by a different individual concept in a different possible world.

  When Leibniz says "Adam could have not sinned," he is speaking loosely. He means: "God could have actualized a different possible world containing a counterpart individual who satisfies the description 'first man' but lacks the predicate 'sinner'."

  If you treat the "vague Adam" as a metaphysical entity that persists across worlds, you violate the **Identity of Indiscernibles**. If Actual-Adam and Possible-Adam share all properties except sinning, they are discernible. But for Leibniz, properties flow from the essence. If the output (sinning) is different, the input (essence/complete concept) must be different. Therefore, they are two different substances. Leibniz knows this. He isn't playing both sides; he is distinguishing between talking about *substances* (which are world-bound) and talking about *descriptions* (which can be satisfied in multiple worlds).

  ### 3. Compossibility and World-Boundedness
  Leibniz's notion of **compossibility** seals the deal. A possible world is a maximal set of compossible substances. Substance $A$ is compossible with $B$ if their complete concepts are logically consistent with one another.

  Crucially, an individual's complete concept includes its relations to every other substance in its universe (mirroring the whole universe from its own perspective). Adam's concept includes "living in a world with Eve," "in a world where God chooses creation," etc.

  You cannot take "Adam" out of World 1 and put him in World 2, because his concept is intrinsically relational to the rest of World 1. If you put him in World 2, his relations change. If his relations change, his complete concept changes. If his complete concept changes, he is not Adam anymore.

  This mirrors Lewis's view that counterparts are related by *similarity* rather than *identity*. For Lewis, I am not in another world because I am spatiotemporally isolated. For Leibniz, I am not in another world because I are conceptually isolated within my compossible set.

  ### 4. Is It Coherent?
  You asked if he is quietly playing both sides or if the position is coherent. It is coherent, provided you accept his distinction between **Absolute Necessity** and **Hypothetical Necessity**.

  *   **Absolute Necessity:** A proposition whose denial implies a contradiction (e.g., 2+2=4).
  *   **Hypothetical Necessity:** A proposition that follows necessarily *given* God's free choice to actualize this specific world (e.g., Adam sins).

  Leibniz's system holds together like this:
  1.  It is not *absolutely* necessary that Adam sins (God could have chosen a different world with a counterpart Adam).
  2.  It *is* *hypothetically* necessary that Adam sins (given that *this* Adam exists in *this* world).
  3.  Therefore, we can say "Adam might not have sinned" (true *de dicto* regarding the choice of worlds) without saying "This Adam might not have sinned" (false *de re* regarding the individual substance).

  The incoherence charge only sticks if you insist that "Adam" refers to the same individual substance across worlds. But Leibniz explicitly denies this in his strict metaphysical writings. He only concedes it in pastoral or logical contexts to preserve the intuition of freedom.

  ### The Verdict
  Your reading group should settle it this way: **Leibniz is the grandfather of Counterpart Theory.**

  Kripke's Transworld Identity requires that individuals have "bare" identity conditions separate from their properties. Leibniz's Complete Concept doctrine makes properties constitutive of identity. You cannot have Leibnizian substances *and* Transworld Identity.

  When Leibniz talks about "Adam" in other worlds, he is talking about **counterparts** (other possible individual concepts that resemble the actual Adam under a vague description). He doesn't use the word "counterpart," and his ontology (ideas in God's mind) differs from Lewis's (concrete universes), but the **logic of identity** is identical.

  He isn't playing both sides. He is a Counterpart Theorist who uses "vague individuals" as a linguistic shorthand to explain contingency to humans who can't grasp infinite concepts. If you force him to choose, the Complete Concept doctrine crushes Transworld Identity every time.
