      *   **Argument Point 1: The Complete Concept.** Explain why this entails that all properties are essential to the individual notion. Changing a property = changing the individual.
      *   **Argument Point 2: Compossibility & World-Boundedness.** Explain that substances are defined by their relations within a specific world. You can't move them.
      *   **Argument Point 3: The "Vague Adam" Defense.** Explain this away as a *de dicto* vs. *de re* distinction. It's about descriptions, not the substance itself.
      *   **Comparison to Lewis:** Highlight the structural similarity (world-bound individuals) while noting the difference (conceptual vs. spatiotemporal similarity).
      *   **Coherence Check:** Defend against the "playing both sides" charge. It's coherent if you understand the necessity distinction.
      *   **Conclusion:** Reiterate the commitment. Leibniz is the grandfather of Counterpart Theory.

  8.  **Final Polish:** Ensure tone is engaging (metaphysics reading group style) but rigorous. Avoid hedging. (e.g., instead of "Some scholars say," say "The text demands...")

