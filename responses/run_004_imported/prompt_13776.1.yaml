      *   **The Lottery Paradox:** Formulated by Henry Kyburg (1961). For any ticket $t$, it is rational to believe "$t$ will lose" (high probability). But it is also rational to believe "some ticket will win." If you agglomerate, you believe "all tickets will lose," which contradicts "some ticket will win."
