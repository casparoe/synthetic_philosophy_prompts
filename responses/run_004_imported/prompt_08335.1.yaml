          *   *Strength:* Directly addresses the time-inconsistency problem. It formalizes "being the kind of agent who gets the money." It doesn't rely on psychological tricks; it changes the decision calculus to make the action rational ex-ante and binding ex-post.
          *   *Weakness:* Controversial in mainstream philosophy, less formalized than CDT/EDT.
          *   *Verdict:* Strongest actual *solution* to the coordination problem across time selves. It dissolves the paradox by changing the decision theory underlying "rationality."

      *   **McClennen's Resolute Choice:**
          *   *Mechanism:* Agents can commit to a plan and follow through even if preferences change, provided the plan was optimal ex-ante.
