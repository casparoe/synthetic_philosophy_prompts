          *   *Privileged Basis:* This is the hardest. If rotation doesn't change function (mostly), why is *this* basis special? (Answer: The non-linearities break symmetry. Sparsity might align with how the network uses capacity).

  3.  **Drafting the Arguments (Iterative Process):**

