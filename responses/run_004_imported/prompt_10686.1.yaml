      *   *Fix:* Ensure I emphasize that while linear layers are basis invariant, the *pointwise non-linearities* are not. They fix a specific coordinate system (the neuron basis). SAEs rotate *away* from the neuron basis, but they do so to find a basis where the *non-linear effects* (like dead neurons or activation distributions) make sense. Actually, wait. SAEs usually operate on the *residual stream* or *activations* after non-linearities. The constraint is that the *reconstruction* must pass through the bottleneck. The sparsity prior acts as a regularizer that mimics the network's own pressure to avoid interference.
      *   *Check:* Feature Splitting.
