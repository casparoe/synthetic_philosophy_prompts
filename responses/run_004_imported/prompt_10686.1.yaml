          *   Dennett connection: Real Patterns. If positing a feature allows robust intervention (causal scrubbing), it's real enough.

      *   **Addressing the Three Complications specifically:**
          *   *Superposition:* Realism accepts features are polysemantic in the neuron basis but monosemantic in the *feature* basis. The "real" ontology is the feature basis, not the neuron basis.
          *   *Splitting:* Analogy to physics. Quarks are real, atoms are real. Scale matters. The "stopping point" is determined by the scale of intervention we care about (e.g., safety-relevant concepts).
