      *   **Options:** Stay in Damascus (S) or Go to Aleppo (A).
      *   **CDT (Causal Decision Theory):** CDT says choose the act that causes the best outcome. Since Death's prediction is already made (past), the man's choice *causally* cannot change where Death is.
          *   If Death is in Damascus: Staying = Die, Going = Live. (Going better)
          *   If Death is in Aleppo: Staying = Live, Going = Die. (Staying better)
          *   *Problem:* The man's credence about where Death is depends on his credence about what *he* will do (because Death predicts him). If he thinks he'll stay, he thinks Death is in Damascus, so he should go. If he thinks he'll go, he thinks Death is in Aleppo, so he should stay. This is an instability loop.
      *   **Dominance:** In Newcomb, One-Box vs. Two-Box. Two-boxing dominates (if Box B has 1M, 2-box = 1M+1k > 1M; if Box B has 0, 2-box = 1k > 0). In Death in Damascus, there is *no* dominance. Staying is better in one state, Going is better in the other state. The states are correlated with the actions.
      *   **Ratifiability (Skyrms/Jeffrey):** An act $A$ is ratifiable if $U(A | A) \ge U(B | A)$ for all alternative acts $B$. Basically, "If I assume I'm doing $A$, is $A$ still the best choice?"
      *   **CDT + Ratifiability:** In Death in Damascus, standard CDT leads to instability (no stable pure strategy). CDT usually requires mixed strategies to find a ratifiable equilibrium (e.g., 50/50 chance). If the student claims CDT finds a *single stable, ratifiable act* (pure strategy), that is technically incorrect for the standard formulation of the problem. The standard lesson is that *no pure act is ratifiable*.
