      **A:** I'm not positing a logical entailment between distinct existences; I'm positing a metaphysical identity or essence. Look at Dispositional Essentialism. The property of being uranium-235 has a dispositional essence tied to nuclear fission. It's not that $N$ glues facts together; it's that the properties themselves carry modal force. The gold sphere is accidental because gold's essence doesn't preclude large masses; uranium's does. This answers Lewis: $N$ isn't a separate relation; it's internal to the properties. This grounds the counterfactuals you lack. On BSA, if the universe were empty, there would be no laws. On my view, laws hold in virtue of property essences, even if unmanifested.

      **H:** But now you've locked yourself into a rigid essentialism that science often revises. If physics discovers uranium's instability is contingent on background constants, your essences break. Moreover, you claim this avoids the regress, but doesn't it just push it back? Why does this essence necessitate that manifestation? If you say "because it's essential," you're stopping inquiry by fiat. I stop at the mosaic because nothing lies beneath it. You stop at essences because nothing lies beneath them, but you've doubled the ontology. You have the mosaic *plus* the modal glue. I just have the mosaic. Your "explanation" is just the mosaic plus a label saying "necessary."

      **A:** And your "law" is just the mosaic plus a label saying "summarized." We both stop somewhere. The question is whether stopping at the Humean base captures the modal structure of science. Scientists treat laws as constraints on possibility, not just summaries of actuality. When they model the uranium sphere, they aren't checking the global history of the universe to see if it fits the Best System; they're deriving it from local properties. Your view makes lawhood holistic and epistemic; mine makes it local and metaphysical.

      **H:** Holism is the price of avoiding magical necessitation. If laws are local powers, how do they coordinate globally? I keep the ontology lean and the modality pragmatic. You keep the modality robust and the ontology bloated. We're at a standoff: you think I've lost the necessity required for science; I think you've invented a necessity science doesn't need.

      **A:** Precisely. And until one side can show why their stopping point is preferable without begging the question, the seminar stays in session.

