answer: |-
  This is an excellent and sophisticated question, precisely the kind of tension that makes for a productive graduate seminar. You have correctly identified the *motivation* for reading Quine as a moral realist: if the analytic/synthetic distinction is dead, and if confirmation is holistic, why can't moral claims be part of the empirically confirmed web of belief?

  However, characterizing Quine as a **naturalistic moral realist** based on "On the Nature of Moral Values" (1981) is textually risky and likely incorrect. While your logic follows the trajectory of later Cornell Realists (like Boyd or Brink), Quine himself pulls back from that conclusion.

  Here is a sanity check on the specific points you need to navigate to avoid misleading your students.

  ### 1. The Holism Parallel is Real, but the Anchoring is Different
  You are absolutely right that Quine extends confirmation holism to ethics. He agrees that moral principles are not tested in isolation but as part of a web. However, for Quine, the crucial difference lies in **how the web is anchored to experience.**

  *   **Science:** The web is anchored by **observation sentences**. These are conditioned directly to sensory stimulation. They provide the "empirical content" that allows the system to be truth-apt.
  *   **Ethics:** Quine argues moral statements lack this specific anchor. In "On the Nature of Moral Values," he suggests moral principles are anchored not in sensory stimulation, but in **sentiments** and **social conditioning**.

  For Quine, a moral judgment is not "answerable to experience" in the sense of being confirmed or disconfirmed by observational evidence. Rather, it is answerable to its **efficacy** in promoting social cohesion and satisfying human needs. This is a pragmatic validation, not an empirical confirmation of truth.

  ### 2. Quine's Explicit Rejection of Moral Truth
  The strongest evidence against the "realist" reading is Quine's explicit skepticism regarding moral truth-values. In the 1981 paper, he writes:

  > "I am inclined to think of moral values as... lacking the objective reference that characterizes scientific theory."

  He distinguishes between the **function** of morality (which is natural and observable) and the **truth** of morality (which he finds unintelligible in a naturalistic framework). He famously states that while science aims to describe the world, morality aims to **flavor** it or **guide** behavior.

  If you characterize him as a realist, you imply he believes moral statements have truth conditions that obtain in the world. Quine explicitly denies this. He is a **naturalist about the *phenomenon* of morality**, but a **skeptic (or error theorist) about moral *knowledge*.**

  ### 3. The "Skeptic" Label is Accurate (with Nuance)
  The standard interpretation of Quine as a skeptic about moral knowledge is correct, provided you define "skeptic" carefully.
  *   He is not a skeptic about the *existence* of moral beliefs (we clearly have them).
  *   He is not a skeptic about the *causal origins* of moral beliefs (evolution and conditioning).
  *   He **is** a skeptic about the *cognitive status* of moral claims. He does not believe they describe facts that can be known in the scientific sense.

  Some scholars label this view **"Quinean Moral Skepticism"** or **"Naturalized Non-Cognitivism."** He treats moral predicates as lacking the referential transparency required for realism.

  ### 4. Why the Confusion? (The Teaching Opportunity)
  The confusion you are sensing is actually a feature, not a bug, of Quine's later philosophy. It highlights a tension in naturalized epistemology:
  *   **Premise A:** All knowledge is part of the holistic web of belief.
  *   **Premise B:** The web is constrained by sensory experience.
  *   **Premise C:** Moral beliefs are in the web.
  *   **Conclusion:** Therefore, moral beliefs are constrained by sensory experience (Realism).

  Quine accepts A, B, and C, but **rejects the Conclusion.** He argues that the moral strand of the web is connected to the sensory periphery differently (via sentiment rather than observation).

  This is a fantastic point to present to your students. You can frame it as: *"Quine opens the door to naturalized ethics by dissolving the fact/value dichotomy, but he refuses to walk through it into moral realism. Why? Because for Quine, naturalism requires empirical anchoring, and he doesn't see where the moral anchor drops."*

  ### Recommendation for the Seminar
  I would advise against presenting him as a "naturalistic moral realist." It will invite challenges from students familiar with the text who know he denies moral truth.

  **Suggested Characterization:**
  > "Quine applies his confirmation holism to ethics to show that moral principles are part of our overall theory of the world, **but** he maintains a distinction between the *empirical confirmation* of science and the *pragmatic utility* of morality. Consequently, he is a naturalist about the *origin and function* of ethics, but remains a skeptic regarding moral *truth*."

  **Key Discussion Question for Students:**
  "Quine dissolves the analytic/synthetic distinction, which removes the logical barrier between fact and value. Yet, he still denies moral realism. What barrier remains? Is it the lack of observation sentences, or is it a deeper commitment to a specific notion of 'truth' that morality cannot satisfy?"

  ### Summary
  *   **Is your reading logical?** Yes, it is the logical extension many *wish* Quine had taken (and later naturalistic realists did).
  *   **Is it textually accurate?** No. Quine explicitly denies moral statements have truth values comparable to science.
  *   **Verdict:** Do not call him a realist. Call him a **Naturalized Moral Skeptic** or a **Functionalist**. Use the tension you identified to show the limits of Quinean naturalism.

  This nuance will make your seminar much stronger, as it moves beyond "Quine says X" to "Here is the tension in Quine's system that generated the next 40 years of metaethical debate."
