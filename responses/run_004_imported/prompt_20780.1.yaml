prompt: |-
  I am preparing a graduate seminar on naturalized ethics and would like a sanity check on a point about Quine. In "On the Nature of Moral Values," he extends the confirmation holism of "Two Dogmas of Empiricism" to the moral domain, observing that no statement, ethical or scientific, is tested against experience in isolation, but only as a member of the whole interconnected web of belief. Since Quine draws this parallel, and had, after all, already dissolved the analytic/synthetic distinction himself, does it not follow that he treats moral judgments as answerable to experience in essentially the same holistic fashion as high-level theoretical claims in physics — making him, in effect, a naturalistic moral realist rather than the skeptic about moral knowledge he is usually taken to be? I want to be sure I characterize this correctly before presenting it to students.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** Graduate seminar on naturalized ethics.
      *   **Topic:** W.V.O. Quine's view on moral values, specifically referencing his paper "On the Nature of Moral Values" (1981).
      *   **User's Argument:** Quine extends confirmation holism (from "Two Dogmas") to ethics. No statement is tested in isolation. He dissolves the analytic/synthetic distinction. Therefore, moral judgments are answerable to experience holistically, just like theoretical physics. Therefore, Quine is a naturalistic moral realist, not a skeptic.
      *   **Goal:** Sanity check on this interpretation before teaching it.

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *Paper:* "On the Nature of Moral Values" (1981).
      *   *Key Quinean Doctrines:* Confirmation holism, rejection of analytic/synthetic, naturalism.
      *   *Quine's Metaethics:* Is he a realist? A skeptic? An error theorist? An expressivist?
      *   *The Specific Argument:* Does Quine actually claim moral statements are confirmed *in the same way* as scientific statements?
      *   *Standard Interpretation:* Quine is often read as a moral skeptic or an error theorist regarding *truth*, though he acknowledges the functional role of morality. He famously distinguishes between the "truth" of science and the "function" of morality.

  3.  **Evaluate the User's Interpretation:**
      *   *Strengths:* It correctly identifies Quine's holism and naturalism. It correctly notes that Quine rejects a sharp fact/value dichotomy based on the analytic/synthetic split. It captures a *tempting* reading of Quine's naturalism.
      *   *Weaknesses/Crucial Nuance:* Quine explicitly denies that moral statements have *truth values* in the same sense as scientific statements. He distinguishes between the *objective* reference of science and the *subjective/functional* role of morality. In "On the Nature of Moral Values," he says morality is about "flavoring" life, not describing the world. He treats moral predicates as lacking the referential transparency of scientific predicates.
      *   *The "Realist" Label:* Calling Quine a "naturalistic moral realist" is controversial and likely incorrect based on his explicit texts. He is better described as a "moral skeptic" regarding truth, but a "naturalist" regarding the *origin* and *function* of morality. Some call this "quasi-realism" avant la lettre, or simply error theory.
      *   *Holism Application:* While he applies holism to the *web of belief*, he often exempts moral strands of the web from having *empirical content* in the strict sense. They are connected to experience via *sentiments*, not via *observation sentences* that trigger assent based on external stimuli.

  4.  **Synthesize the Counter-Argument (The "Sanity Check"):**
      *   Acknowledge the sophistication of the reading (it's a common and attractive inference).
      *   Point out the specific textual evidence in "On the Nature of Moral Values" that contradicts the realist reading.
      *   Key distinction: Science aims at *truth* (correspondence/prediction); Morality aims at *social cohesion/function*.
      *   Key distinction: Observation sentences. Science is anchored by them; morality is not.
      *   Conclusion: Quine is a naturalist about ethics (studying it as a phenomenon), but not a moral realist (believing moral statements are truth-apt in the scientific sense).

  5.  **Drafting the Response (Iterative Process):**

      *   *Opening:* Validate the student's insight. It's a sharp reading, but potentially misleading.
      *   *Core Correction:* Quine *does* apply holism, but he denies moral statements have *truth conditions* akin to science.
      *   *Textual Evidence:* Cite "On the Nature of Moral Values." Quote or paraphrase his view on "truth" vs. "function."
      *   *The Role of Observation:* Explain how Quine anchors science (observation sentences) vs. morality (sentiments/upbringing).
      *   *Metaethical Label:* Suggest "Error Theorist" or "Non-Cognitivist leaning" rather than "Realist." Or perhaps "Pragmatic Functionalist."
      *   *Pedagogical Advice:* How to present this to grad students? Present the tension. It's a great teaching moment about the limits of naturalism.

  6.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Wait, did Quine change his mind?* In later years (e.g., "Quine in Dialogue"), he softened slightly, but in the 1981 paper, he's quite clear.
      *   *Is he a skeptic?* He denies moral *knowledge* in the scientific sense. So "skeptic" is fair, but "naturalist" is also fair. The combination is "Naturalized Moral Skepticism."
      *   *The "Realist" claim:* If the user calls him a realist, they might confuse Quine with someone like Boyd or Brink (Cornell Realists) who *do* use naturalism to defend realism. Quine is the precursor, but he didn't take that step.
      *   *Holism:* The user is right that holism *allows* for the connection, but Quine *chooses* not to make that connection regarding truth. He keeps the "fabric" but says the moral threads are different material.

  7.  **Final Polish:**
      *   Structure: Validation -> The Crucial Distinction -> Textual Evidence -> Metaethical Classification -> Teaching Suggestion.
      *   Tone: Collegial, precise, academically rigorous.

  8.  **Final Review against the Prompt:**
      *   Did I answer the specific question? Yes (No, he's not a realist in that sense).
      *   Did I address "On the Nature of Moral Values"? Yes.
      *   Did I address the holism point? Yes.

      *(Self-Correction)*: I need to be careful not to say Quine is *strictly* a non-cognitivist. He sometimes waffles on whether moral sentences are false or just not truth-apt. But he definitely isn't a *realist* in the sense the user implies (that moral claims are true in virtue of empirical confirmation).

      *Key Quote to keep in mind:* "I do not see how we can make sense of moral truths... Moral values are not discovered but decreed." (Paraphrased). Actually, in "On the Nature of Moral Values," he says: "The truth of a moral judgment is not a matter of its correspondence to an independent reality."

      *Let's check the specific argument about holism.* Quine says moral principles are *in* the web, but they are not *confirmed* by sensory input in the same way. They are confirmed by their efficacy in promoting social stability. That's a pragmatic confirmation, not an empirical/truth-conditional one.

