answer: |-
  Thank you. All of you. For coming. For knowing him in the ways you did.

  I've been standing here trying to find the right words, and I keep coming back to his hands. If you knew him, you know they were never still. Even when he was just sitting in his chair, his fingers were tracing shapes on his thigh, or testing the grain of the wood on the table. He was always measuring. Always feeling.

  For forty years, he went into that studio every morning before dawn. Most of you think of that room as a place where he worked. I think of it as a place where he disappeared.

  There is a specific kind of silence that happens when someone is drawing with total attention. It's not just quiet; it's a vacuum. The rest of the world stops mattering. I used to watch him from the doorway when I was a child. I saw the way he leaned over the paper, the way his breath would catch when he got a line right. He could look at a thing—a face, a fold of cloth, a tree branch—and he could understand it so completely that he could make it live again on the page.

  But there was a cost to that. I think I understand it now, more than I did when I was watching him from the doorway.

  To see the world that clearly, you have to step out of your own way. To make a line that true, you can't be thinking about who is holding the charcoal. Grandfather spent his life mastering the art of looking. He taught me that beauty is in the attention you pay, not in the name you sign. But I also know that he paid a price for that lesson.

  Every time he finished a drawing, every time he captured something true and living and put it down on paper, he had to let it go. He had to let it walk out the door wearing someone else's history. He gave his eyes to the past, over and over, until there was very little of the present left for him.

  I know there are people in this room who know the work better than I do. You know the quality of the paper, the chemistry of the ink, the weight of the line. You know how rare it is to find a hand that steady. But I also know that a drawing is a conversation. It's someone saying, *I was here. I saw this.*

  And for forty years, he never got to say that.

  He gave the world things of beauty. He gave the collectors their treasures. He gave the experts their puzzles. But he kept the silence. He kept the loneliness of being the ghost in his own life's work. Every time a drawing left his hands credited to somebody else, he lost a piece of his own voice. He traded his own name for the privilege of perfection.

  I don't stand here to judge that trade. I don't have the right. I only stand here to witness it. Because even if the names on the frames are wrong, the love that went into the lines was real. The hours were real. The discipline was real. And the man who sat in that chair, sacrificing his own reflection so he could polish someone else's—that man was real.

  He wanted to be a vessel for great things. He succeeded. But a vessel is hollow. And I think, in the end, that hollowness is what we are mourning today. Not just the man, but the artist who was never permitted to introduce himself.

  So, I say this to you, Grandfather. I saw you. I know your hand. I know the weight of your charcoal and the smell of your studio. I know that while the world was looking at the masters, you were the one doing the looking. And while you may have let them take the credit, you don't have to take the silence with you.

  You can rest now. You can put the charcoal down. You can sign your own name.

  We'll take it from here.
