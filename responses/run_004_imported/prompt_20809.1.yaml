answer: |-
  Good evening, everyone.

  For those of you who don't speak "math"—which I see is about half the room, including most of the family—don't worry. I'm not going to give a lecture. But to understand [Advisor's Name], you have to understand one specific joke she's been telling for thirty-five years.

  It goes like this: In set theory, there are three famous statements that are logically equivalent. If one is true, they all are. If one is false, they all are.

  The first is the Axiom of Choice. It says that if you have a collection of bins, you can always pick one item from each. To [Advisor's Name], that is **obviously true**. Of course you can pick a sock from every drawer.

  The second is the Well-Ordering Theorem. It says you can arrange *any* collection of things in a line, so that every subset has a first element. Even the real numbers. To [Advisor's Name], that is **obviously false**. How do you line up every possible number between zero and one? It's absurd.

  And the third is Zorn's Lemma. To [Advisor's Name], that is **completely incomprehensible**. Nobody knows what to think about it.

  And then, she spends the rest of the semester proving that they are exactly the same thing. She spends months quietly wrecking our brains, showing us that what feels intuitive, what feels impossible, and what feels like gibberish are actually equivalent.

  I tell you this because that is how she teaches. She takes what you think you know, turns it inside out, and shows you the deeper structure holding it together.

  But she also taught us something else about rigor. [Advisor's Name] has told me more than once that anyone who talks about a "legacy living on in all of us" without pointing to a concrete example is making a non-constructive existence claim. And she doesn't tolerate those.

  So, in the spirit of constructive mathematics, I am not going to just say "your legacy lives on." I am going to provide the witnesses.

  I am talking about the specific Tuesday night in 2018 when she stayed until 8 PM to help me fix a broken lemma, even though she had a dinner reservation.
  I am talking about the red pen she used on hundreds of drafts, marking not just errors, but places where we could be clearer, kinder, and more precise.
  I am talking about the way she treats the department staff with the exact same respect she treats a Fields Medalist.
  I am talking about the fact that she raised two wonderful children while publishing forty papers, proving that the Axiom of Choice applies to life: you *can* choose from every bin, even when the bins are overflowing.

  To the logicians in the room: We know that the equivalence of AC, WO, and Zorn is a technical fact. But to everyone here, the lesson is human. It's that things can look completely different on the surface—a strict professor, a loving mother, a fierce colleague, a quiet friend—but underneath, they are driven by the same consistent truth.

  [Advisor's Name], you taught us that intuition isn't enough. That we have to do the work to find the connections. You taught us that truth isn't just what feels obvious; it's what holds up under proof.

  So, I'm not going to wish you a retirement where you "rest on your laurels." I know you don't believe in resting, and you definitely don't believe in laurels without definitions.

  Instead, I will say this: For the next chapter, may your choices be easy, may your days be well-ordered, and may the only lemmas you have to deal with involve choosing a wine from a menu or a path for a morning walk.

  You have constructed a life of immense value. We are the proof.

  To [Advisor's Name].
