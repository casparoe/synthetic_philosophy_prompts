answer: |-
  **MEMORANDUM**

  **TO:** Committee on Elections Delegates
  **FROM:** Committee Chair
  **DATE:** October 24, 2023
  **SUBJECT:** Pre-Vote Analysis: HB 104 (Municipal Voting Age Reduction)

  **1. Purpose and Scope**
  This memo serves to frame the debate for Saturday's vote on HB 104, which proposes lowering the voting age from 18 to 16 for *municipal elections only*. This legislation mirrors ordinances passed in Maryland jurisdictions such as Takoma Park and Hyattsville.

  As we prepare to debate, it is the Chair's observation that much of our preliminary discussion has relied on intuitive assertions about "maturity." While relevant, this focus risks ignoring the deeper political theory at play. This memo outlines the theoretical boundary problem, weighs the status quo against the proposed change, analyzes the proposed "Demeny Voting" amendment, and offers a recommendation for the Committee's report.

  **2. The Theoretical Hurdle: The Boundary Problem**
  To vote intelligently on this bill, we must confront what political theorists call the *boundary problem*: How do we decide who belongs to the *demos* (the people entitled to rule)?

  Two standard tests usually define the *demos*:
  *   **The All-Affected-Interests Principle:** Anyone affected by a decision should have a say in it.
  *   **The Coercion Principle:** Anyone subject to the binding laws of the state should have a say in them.

  **The Challenge:** Strictly applied, both principles enfranchise children far younger than 16. A 12-year-old is affected by school board zoning and is subject to truancy laws. If "affected interests" are the only metric, an age cutoff of 16 is just as arbitrary as 18. Therefore, supporting this bill requires more than saying 16-year-olds are "affected." It requires arguing why 16 is the *pragmatic* line where civic agency should begin, even if the theoretical line is blurrier.

  **3. The Case for HB 104 (Lowering to 16)**
  Proponents argue that while the theoretical boundary is blurry, 16 represents a distinct shift in civic capacity and stakeholding, specifically at the municipal level.

  *   **Cognitive Development:** Neuroscience suggests that by 16, the cognitive capacity for reasoned decision-making in low-stakes environments is comparable to adults. While impulse control continues to develop into the mid-20s, voting is a deliberative act, not a reflex.
  *   **The "Stakeholder" Argument:** At 16, many citizens work, pay taxes on income, and navigate public transit and zoning issues daily. In a municipal context, these are the exact issues on the ballot.
  *   **Habit Formation:** Political science research indicates that voting is a habit. Capturing citizens while they are still in stable environments (high school/living at home) may increase lifelong turnout more effectively than registering them at 18, when many are undergoing major life disruptions (college, moving, new jobs).

  **4. The Case for the Status Quo (Maintaining 18)**
  Opponents must do more than assert 16-year-olds are immature. The strongest defense of 18 rests on legal cohesion and administrative clarity.

  *   **The Bundle of Rights:** Age 18 is not just a voting threshold; it is the threshold of legal adulthood. It aligns voting with jury duty, the ability to sign contracts, and being tried as an adult in criminal court. Decoupling voting from this "bundle" creates a class of citizens who have political power but lack full legal responsibility, or vice versa.
  *   **The Bright-Line Rule:** Law requires clear boundaries. As noted in the boundary problem section, *any* age cutoff is theoretically arbitrary. However, 18 is the *federally standardized* arbitrary line (26th Amendment). Maintaining a single age for all elections (municipal, state, federal) reduces administrative error and voter confusion.
  *   **Protection from Exploitation:** There is a legitimate concern that 16-year-olds, still financially dependent on parents, may be more susceptible to familial or institutional coercion in the voting booth than independent adults.

  **5. Analysis of the "Demeny Voting" Amendment**
  Several delegates have proposed an amendment to institute "Demeny Voting." This would grant parents or guardians a proxy vote for each minor child (e.g., a parent of two children under 18 casts three votes total).

  *   **Theoretical Strength:** This solves the boundary problem better than a lowered age limit. It ensures the *interests* of all affected minors (including 5-year-olds) are represented without requiring the child to possess adult-level cognitive agency. It acknowledges that children are stakeholders without pretending they are fully autonomous.
  *   **Practical & Ethical Weakness:**
      *   **Violation of "One Person, One Vote":** This fundamentally alters the principle of individual suffrage.
      *   **Dilution of Youth Agency:** Youth and Government is predicated on the idea that young people can speak for themselves. Proxy voting treats youth as political property of their parents rather than emerging citizens.
      *   **Complexity:** Implementing a proxy system for municipal elections only would create significant administrative burdens for local boards of elections.

  **6. Chair's Recommendation**
  **I recommend the Committee report HB 104 FAVORABLY.**

  **Reasoning:**
  While the "Boundary Problem" confirms that no age cutoff is philosophically perfect, the status quo of 18 is not defensible simply because it is traditional. The "Bundle of Rights" argument for 18 is strong for *state and federal* elections, where issues of war, criminal justice, and macro-economics dominate. However, for *municipal* elections, the stakes are immediate and tangible (schools, parks, zoning).

  In this specific context, the "Stakeholder" argument for 16-year-olds outweighs the administrative convenience of keeping the line at 18. 16-year-olds are the primary consumers of municipal services (education, recreation, transit).

  **Regarding the Amendment:** I recommend voting **AGAINST** the Demeny Voting amendment. While theoretically intriguing, it contradicts the core mission of Youth and Government: to cultivate direct civic agency in young people. Enfranchising 16-year-olds directly respects their autonomy; giving their votes to parents reinforces dependency.

  **7. Conclusion for Debate**
  On Saturday, I ask the Committee to move beyond "are they mature enough?" and instead ask: "Does the benefit of including these stakeholders outweigh the administrative cost of a dual voting age?"

  If you believe the integrity of the "legal adulthood bundle" (age 18) is paramount regardless of election type, vote Unfavorably. If you believe municipal voting is distinct and that 16 is the best pragmatic line for civic engagement, vote Favorably.

  Respectfully,

  Committee Chair
  State Youth and Government Conference
