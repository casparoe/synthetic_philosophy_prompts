      *   *Critique:* Is the "stopping point" argument strong enough?
      *   *Fix:* I need to explicitly name the criteria that would trigger this in the future. If a crab study comes up, does it meet the criteria? Maybe not on the neuroanatomy. If a bee study comes up? No. This limits the precedent.

  6.  **Final Polish:** Check against the prompt's specific constraints.
