      *   **Axiom of Choice (AC):** Given any collection of non-empty sets, there exists a function (choice function) that selects one element from each set.
      *   **Constructivism:** A philosophy of mathematics that insists on explicit construction of mathematical objects. Rejects non-constructive existence proofs (like those relying on AC/ZL).
      *   **Banach-Tarski Paradox:** A theorem in set-theoretic geometry stating that a solid ball in 3D space can be decomposed into a finite number of disjoint subsets, which can then be put back together (using rigid motions) to yield *two* identical copies of the original ball. Relies heavily on AC (non-measurable sets).
