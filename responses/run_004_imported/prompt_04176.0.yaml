prompt: |-
  Hey, I'm prepping a handout for my vagueness seminar and want your take on something specific. Compare Williamson's epistemicism with supervaluationism (think Fine and Keefe) as solutions to the sorites paradox, focusing on how each one handles higher-order vagueness -- i.e. the fact that "borderline case" itself doesn't seem to have a sharp boundary either. My hunch is supervaluationism ends up smuggling sharp boundaries back in at some higher level, which kind of defeats the point, wheras epistemicism can just bite that bullet again since it never denied sharp boundaries in the first place -- but push back if that's too quick. Give me an actual verdict on which view handles this better, don't just summarize both sides for me.
