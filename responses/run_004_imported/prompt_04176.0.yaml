answer: |-
  Here is the verdict for your handout, followed by the breakdown you need to defend it in seminar.

  ### The Verdict
  **Your hunch is correct.** On the specific issue of **higher-order vagueness (HOV)**, Williamson's epistemicism provides a logically consistent framework, whereas standard supervaluationism (Fine/Keefe) technically fails to eliminate sharp boundaries, merely displacing them to the meta-semantic level.

  If your criterion for "handling better" is **theoretical consistency** regarding the logic of definiteness, **Epistemicism wins**. It accommodates HOV without contradiction. Supervaluationism, in its classical form, entails a sharp boundary between the "definitely true" and the "borderline," which contradicts its own motivation to dissolve sharp boundaries.

  However, if your criterion is **phenomenological plausibility** (matching our intuition that there *shouldn't* be sharp boundaries anywhere), **both fail**, but Epistemicism fails more honestly.

  ---

  ### The Breakdown for Your Handout

  #### 1. The Supervaluationist Trap (Fine/Keefe)
  Supervaluationism attempts to save classical logic while denying bivalence for vague sentences. A sentence is *supertrue* if it is true on all admissible precisifications.
  *   **The HOV Problem:** To define "definitely $P$" ($DP$), the supervaluationist says $P$ is true on *all* admissible precisifications. But this requires a sharp distinction between **admissible** and **inadmissible** precisifications.
  *   **The Smuggled Boundary:** If the set of admissible precisifications is sharply defined, there is a specific precisification that is "in" and one immediately next to it that is "out." This creates a sharp boundary for the operator $D$.
  *   **The Consequence:** There becomes a specific number of grains $n$ such that $n$ is *definitely* a heap, but $n-1$ is *not definitely* a heap. This is a sharp boundary for "definiteness."
  *   **Keefe's Defense:** Keefe argues this is acceptable because the sharpness exists in the **semantics**, not the **object language**. She argues we can accept a sharp cutoff for "admissibility" without accepting a sharp cutoff for "heapness."
  *   **The Pushback:** This is weak in the context of HOV. If "borderline" is itself vague, there should be no sharp cut between "definitely" and "borderline." Supervaluationism secures the logic of $D$ only by making $D$ precise, thereby failing to account for the vagueness of "borderline."

  #### 2. The Epistemicist Consistency (Williamson)
  Williamson argues vagueness is a form of ignorance. There is a sharp boundary for "heap," and we just don't know where it is.
  *   **The HOV Solution:** Williamson applies the same logic to higher orders. There is a sharp boundary between "knowable" and "unknowable," and a sharp boundary between "definitely heap" and "borderline heap."
  *   **Margin for Error:** Williamson uses "margin for error" principles to explain *why* we are ignorant. If you know $n$ is a heap, $n-1$ must also be a heap (to allow for error). This principle iterates.
  *   **The Consistency:** Epistemicism does not try to dissolve sharp boundaries; it posits them at every order. Therefore, it never faces the contradiction of claiming "there are no sharp boundaries" while mathematically necessitating one. It bites the bullet at order 1, order 2, and order $n$.
  *   **The Cost:** It requires us to accept that there is a fact of the matter about exactly where "definitely" stops, which is just as counterintuitive as the original heap boundary.

  ### The "Push Back" (Nuance for Seminar)
  Don't let your students think Epistemicism "solves" HOV in a satisfying way. It solves it **formally**, not **explanatorily**.

  1.  **The "Too Quick" Critique:** You noted Epistemicism "never denied sharp boundaries." True, but its explanation for *why* we are ignorant of the higher-order boundaries relies on the same margin-for-error principles as the first order. Critics (like Sorensen) argue this leads to "luminosity" problems. If we are ignorant of the boundary of "definitely," do we know that we are ignorant? Epistemicism says yes (we know there is a boundary, just not where), which some argue misdescribes the phenomenology of confusion.
  2.  **Supervaluationist Retreat:** A sophisticated supervaluationist might concede the sharp boundary for $D$ but argue it is **insignificant**. They might claim that while the *set* of precisifications is sharp, the *concept* of admissibility is not captured fully by the model. However, this requires moving to a non-classical logic (like fuzzy logic) or accepting that the semantics is an imperfect model. If they stick to classical supervaluationism, your critique stands.

  ### Recommendation for the Handout
  Frame the comparison as a trade-off between **Logical Consistency** (Epistemicism) and **Semantic Intuition** (Supervaluationism).

  *   **Supervaluationism** tries to have its cake (no sharp boundaries) and eat it too (classical logic), but HOV shows the cake is an illusion; the sharp boundary reappears in the semantics.
  *   **Epistemicism** admits the cake was never there. It is theoretically superior regarding HOV because it doesn't generate a contradiction between its metaphysics and its semantics, even if its metaphysics is hard to swallow.

  **Final Grade:** Epistemicism handles the *logic* of HOV better. Supervaluationism handles the *intuition* of HOV better, but at the cost of technical coherence. For a seminar on the **paradox**, technical coherence usually wins the point.
