      *   **Epistemicism (Williamson):**
          *   *Core Claim:* Vagueness is ignorance. There *is* a sharp boundary (e.g., exactly $n$ grains make a heap), but we cannot know it.
          *   *HOV Handling:* Since there is a sharp boundary for "heap," there is also a sharp boundary for "definitely heap" vs. "borderline heap." It's just another fact we are ignorant of.
          *   *Strength:* Consistency. It treats all orders of vagueness the same way (ignorance of sharp cuts).
          *   *Weakness:* Highly counterintuitive. Why are we ignorant? (Williamson's margin for error principles).

      *   **Supervaluationism (Fine/Keefe):**
          *   *Core Claim:* Truth is supertruth (true on all admissible precisifications). A sentence is vague if it's true on some but not all precisifications.
          *   *HOV Handling:* This is the trouble spot. To define "definitely true" ($Dp$), we need a set of admissible precisifications. But the set of *admissible* precisifications is itself vague. If we fix the set sharply to define $D$, we get a sharp boundary between $Dp$ and $\neg Dp$.
          *   *Strength:* Preserves classical logic (mostly) and the intuition that there is no single sharp cut in reality.
          *   *Weakness:* The "Boundary Problem." To make the semantics work, you need a sharp cutoff for the set of precisifications, reintroducing sharp boundaries at the meta-level.

