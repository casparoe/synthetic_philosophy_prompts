          *   Tone: Formal but community-oriented, decisive but fair.

  2.  **Deconstruct the Philosophical Underpinnings:**
      *   **Reliance/Expectation Damages (Utilitarian/Economic):** The goal is to make the group whole financially. If 3 months covers the shortfall until a replacement is found, the harm is mitigated. This supports the leaver's offer.
      *   **Assurance/Scanlonian Principle (Deontological/Contractual):** Principle F (Scanlon): If you intentionally lead others to expect you will do X, and they rely on that, you must do X unless they release you. The value isn't just the money; it's the *security* of the arrangement. If breaking the promise is too easy, the "currency" of promise-making devalues for everyone else.
      *   **The "Genuine Emergency" Clause:** This is the escape hatch. Is a sick parent a "genuine emergency"? Almost certainly yes. But does an emergency *void* the obligation entirely, or does it just mitigate the *blame* while retaining some *liability*?
      *   **The "Trenchcoat" Problem:** The user suspects this is a philosophy problem. It is. It's about the tension between *compassion* (emergency) and *institutional integrity* (the promise).

