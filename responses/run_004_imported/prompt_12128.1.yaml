      *   **The Ruling:**
          *   The emergency is valid (releases residency obligation).
          *   The financial obligation is partially retained to honor the co-signers.
          *   Recommendation: Accept the 3-month lump sum *as a settlement*, BUT frame it carefully.
          *   *Wait, I need to pick a side.* If I say "Accept 3 months," I side with the compassion group. If I say "No, pay more," I side with the curmudgeons.
          *   *The "Curmudgeon" argument is stronger philosophically regarding the institution.* If promises are optional during hard times, they aren't promises. But hard times are *why* we have insurance/promises.
