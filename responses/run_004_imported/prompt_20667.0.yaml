answer: |-
  You have hit on one of the most subtle and fascinating corners of probability theory. Your intuition is correct: it **is** possible to construct a proper probability distribution (one that sums to 1) such that, for every single amount $x$ you observe in your envelope, the expected value of the other envelope is strictly greater than $x$.

  However, this possibility comes with a heavy price tag that resolves the apparent contradiction with symmetry. As you suspected, it connects directly to the St. Petersburg paradox.

  Here is the construction, the arithmetic walkthrough, and the conceptual resolution.

  ### 1. The Construction

  To make the arithmetic clean, let's assume the money in the envelopes must be powers of 2. Let $A$ be the amount in the **smaller** envelope. The two envelopes contain $(A, 2A)$.

  We need to define a probability distribution $P(A = 2^n) = p_n$ for $n = 0, 1, 2, \dots$ that satisfies two conditions:
  1.  **Properness:** $\sum_{n=0}^{\infty} p_n = 1$.
  2.  **Switching Condition:** For any observed value $x$, $E[\text{Other} \mid X=x] > x$.

  It turns out the switching condition holds if the probabilities don't decay too quickly. Specifically, if you observe $x = 2^n$ (where $n \ge 1$), the other envelope contains $2^{n+1}$ (if you have the smaller) or $2^{n-1}$ (if you have the larger).

  Using Bayes' theorem, the probability that you hold the smaller envelope given you see $x=2^n$ is:
  $$ P(\text{Smaller} \mid X=2^n) = \frac{p_n}{p_n + p_{n-1}} $$
  *(Note: The $1/2$ chance of picking either envelope cancels out in the ratio.)*

  The expected value of the other envelope is:
  $$ E[\text{Other}] = 2x \cdot \frac{p_n}{p_n + p_{n-1}} + \frac{x}{2} \cdot \frac{p_{n-1}}{p_n + p_{n-1}} $$

  For this to be greater than $x$, simple algebra shows we need:
  $$ 2p_n + 0.5p_{n-1} > p_n + p_{n-1} \implies p_n > 0.5p_{n-1} \implies p_{n-1} < 2p_n $$

  So, we need a distribution where each term is **more than half** the size of the previous term. A geometric distribution works perfectly here. Let's choose:
  $$ p_n = \frac{1}{3} \left( \frac{2}{3} \right)^n \quad \text{for } n = 0, 1, 2, \dots $$

  **Check Properness:** This is a geometric series with $a = 1/3$ and $r = 2/3$.
  $$ \text{Sum} = \frac{1/3}{1 - 2/3} = \frac{1/3}{1/3} = 1. $$
  This is a valid, honest probability distribution.

  **Check Switching Condition:**
  $$ p_{n-1} = \frac{1}{3} \left( \frac{2}{3} \right)^{n-1} = \frac{1}{3} \left( \frac{2}{3} \right)^n \cdot \frac{3}{2} = 1.5 \, p_n $$
  Is $p_{n-1} < 2p_n$?
  $$ 1.5 \, p_n < 2 \, p_n $$
  **Yes.** The condition holds for all $n \ge 1$. (For $n=0$, $x=1$, you know you have the smaller envelope, so switching is definitely better).

  ---

  ### 2. The Arithmetic Walkthrough

  Let's verify this by hand for four specific amounts you might find in your envelope: **$1, $2, $4, and $8**.

  Recall: $p_0 = 1/3$, $p_1 = 2/9$, $p_2 = 4/27$, $p_3 = 8/81$.
  Notice the ratio between consecutive probabilities is always $p_{n-1} / p_n = 1.5$.

  #### Case 1: You open your envelope and find $x = 1$ ($2^0$)
  *   **Possibilities:** Since the minimum amount in the smaller envelope is $1$ ($2^0$), the other envelope cannot contain $0.5$. You **must** have the smaller envelope.
  *   **Other Envelope:** Definitely $2$.
  *   **Expected Value:** $2$.
  *   **Decision:** $2 > 1$. **Switch.**

  #### Case 2: You open your envelope and find $x = 2$ ($2^1$)
  *   **Possibilities:**
      *   You have the Smaller ($A=2$): Probability proportional to $p_1 = 2/9$.
      *   You have the Larger ($A=1$): Probability proportional to $p_0 = 1/3 = 3/9$.
  *   **Posterior Probabilities:**
      *   $P(\text{Smaller}) = \frac{2/9}{2/9 + 3/9} = \frac{2}{5} = 0.4$.
      *   $P(\text{Larger}) = \frac{3/9}{2/9 + 3/9} = \frac{3}{5} = 0.6$.
      *(Note: You are actually more likely to be holding the larger envelope!)*
  *   **Expected Value of Other:**
      $$ E = (4 \times 0.4) + (1 \times 0.6) = 1.6 + 0.6 = 2.2 $$
  *   **Decision:** $2.2 > 2$. **Switch.**

  #### Case 3: You open your envelope and find $x = 4$ ($2^2$)
  *   **Possibilities:**
      *   You have the Smaller ($A=4$): Proportional to $p_2 = 4/27$.
      *   You have the Larger ($A=2$): Proportional to $p_1 = 2/9 = 6/27$.
  *   **Posterior Probabilities:**
      *   $P(\text{Smaller}) = \frac{4}{4+6} = 0.4$.
      *   $P(\text{Larger}) = \frac{6}{4+6} = 0.6$.
      *(The ratio stays constant because it's a geometric distribution.)*
  *   **Expected Value of Other:**
      $$ E = (8 \times 0.4) + (2 \times 0.6) = 3.2 + 1.2 = 4.4 $$
  *   **Decision:** $4.4 > 4$. **Switch.**

  #### Case 4: You open your envelope and find $x = 8$ ($2^3$)
  *   **Possibilities:**
      *   You have the Smaller ($A=8$): Proportional to $p_3$.
      *   You have the Larger ($A=4$): Proportional to $p_2$.
  *   **Posterior Probabilities:** Still $0.4$ vs $0.6$.
  *   **Expected Value of Other:**
      $$ E = (16 \times 0.4) + (4 \times 0.6) = 6.4 + 2.4 = 8.8 $$
  *   **Decision:** $8.8 > 8$. **Switch.**

  **Conclusion:** For every possible value $x$, the expected value of the other envelope is exactly $1.1x$. The rule "always switch" is mathematically justified for every specific observation.

  ---

  ### 3. The Conceptual Resolution

  You asked: *"The two envelopes are symmetric before either one is opened, so how can a perfectly legitimate probability distribution ever justify a blanket rule like 'switch no matter what you see'?"*

  This is the crux of the matter. If $E[\text{Other} \mid X=x] = 1.1x$ for all $x$, doesn't that imply $E[\text{Other}] = 1.1 E[\text{Yours}]$? If so, how can the envelopes be symmetric?

  The resolution lies in the **Expected Total Value of the Game**.

  Let's calculate the expected amount of money in the smaller envelope $A$ using our distribution:
  $$ E[A] = \sum_{n=0}^{\infty} 2^n \cdot p_n = \sum_{n=0}^{\infty} 2^n \cdot \frac{1}{3} \left( \frac{2}{3} \right)^n = \frac{1}{3} \sum_{n=0}^{\infty} \left( \frac{4}{3} \right)^n $$
  Because $4/3 > 1$, this series **diverges to infinity**.

  **The Catch:**
  In this specific construction, the expected amount of money in the game is **infinite**.
  $$ E[\text{Your Envelope}] = \infty \quad \text{and} \quad E[\text{Other Envelope}] = \infty $$

  When expectations are infinite, the standard laws of expectation break down. Specifically, you cannot conclude that $E[\text{Other}] > E[\text{Yours}]$ just because $E[\text{Other} \mid X=x] > x$ for all $x$. In the realm of infinite expectations, $\infty = 1.1 \times \infty$ is not a contradiction; both sides are simply undefined/infinite.

  **Symmetry is preserved** in the sense that before you open the envelope, you have no reason to prefer one over the other. Both have infinite expected value. However, **conditional on seeing a finite value $x$**, the symmetry is broken because seeing a finite $x$ gives you information about where you are in the distribution. Because the distribution has a "heavy tail" (it decays slowly enough to allow infinite expectation), observing a specific $x$ makes it more likely that $x$ is the smaller of the pair $(x, 2x)$ than it would be in a normal distribution, *relative to the potential gain*.

  Actually, in our calculation above, notice that for $x \ge 2$, you are **more likely to lose** by switching ($60\%$ chance the other is smaller) than to win ($40\%$ chance the other is larger). However, the potential win ($+x$) is so much larger than the potential loss ($-x/2$) that the *expected value* remains positive.

  ### 4. Connection to St. Petersburg

  Your nagging feeling was correct. This is structurally identical to the **St. Petersburg Paradox**.

  In the St. Petersburg game, a casino pays you $2^n$ dollars if the first heads appears on the $n$-th coin toss. The expected payoff is infinite. Rational decision theory suggests you should pay any finite amount to play this game, which feels wrong.

  In this Two-Envelope variant, the "game" itself (the total money put on the table by the host) has infinite expected value.
  *   If the host had a finite bankroll, the distribution would have to cut off at some maximum $N$.
  *   If the distribution cuts off, then for the maximum possible value $x_{max}$, you would know you have the larger envelope, and you should **not** switch.
  *   That "do not switch" case at the top end balances out the "always switch" cases at the lower end, restoring global symmetry and finite expectations.

  By demanding a distribution where you *always* switch, you are implicitly demanding a game with **no upper limit on the host's wealth** and an **infinite expected pot**.

  ### Summary
  1.  **Yes**, you can construct a proper distribution where switching is always better conditionally.
  2.  **Example:** $P(A=2^n) = \frac{1}{3}(\frac{2}{3})^n$.
  3.  **Arithmetic:** For any $x$, $E[\text{Other}] = 1.1x$.
  4.  **Resolution:** This requires the expected total money in the game to be **infinite**.
  5.  **Symmetry:** Unconditional symmetry holds ($\infty = \infty$), but conditional on any finite observation, the heavy tail of the distribution skews the risk/reward ratio in favor of switching, even if the probability of winning the switch is less than 50%.

  You haven't found a flaw in decision theory; you've found the boundary where "Expected Value" stops being a useful guide for decision-making because it ceases to be a real number.
