answer: |-
  This is a classic and painful conflict known as the **"Unspoken Contract" dilemma.** You are feeling burned out from generosity, and your friend is feeling destabilized by a change in the relationship's rules.

  To answer your question directly: **You are not in the wrong for setting a boundary, but your friend is not crazy for feeling disrupted.**

  Here is the breakdown of why both of you are feeling this way, and how to navigate the fallout.

  ### 1. The User's Reality: Generosity vs. Obligation
  You are correct on the principle: **Kindness is not a contract.**
  Just because you have watered a plant every day for three years doesn't mean you are legally or morally bound to water it on day 1,096 if you are sick. If generosity becomes mandatory, it ceases to be generosity and becomes labor. If you continue to say "yes" when you are wiped out, you will eventually resent the friends you are trying to help, which kills friendships faster than a missed airport run.

  You are in the clear to protect your energy. You do not owe anyone access to you that compromises your well-being.

  ### 2. The Friend's Reality: Pattern Recognition
  Your friend is incorrect to use the word "entitled," but she is correct about **human psychology.**
  Humans are pattern-recognition machines. For three years, you have established a pattern: *When stress arises, [User] solves it.* The group has likely organized their lives around your reliability. They may have skipped buying travel insurance, or didn't budget for a taxi, or simply built their emotional safety net around your presence.

  When you suddenly stop, it doesn't feel to them like you are "setting a boundary." It feels like **withdrawal of care.**
  *   **Your perspective:** "I am too tired to drive."
  *   **Her perspective:** "You don't care about me enough to help."

  She isn't hurt about the ride; she is hurt because the definition of the friendship shifted without a meeting. To her, the "rug" wasn't just pulled out; it feels like the foundation moved.

  ### 3. The Real Issue: The Implicit Contract
  The conflict exists because you were operating on two different agreements.
  *   **Your Agreement:** "I will help as much as I can until I can't."
  *   **Their Agreement:** "This is how our group functions."

  The problem isn't that you said no last weekend. The problem is that for three years, nobody knew your capacity had a limit because you never showed them. By never saying "no" before, you inadvertently trained them to believe your capacity was infinite.

  ### 4. How to Move Forward
  You don't need to apologize for being human, but you do need to manage the transition so the friendship survives.

  **Step 1: Validate, don't Apologize.**
  Do not say: *"I'm sorry I couldn't drive you."* (This implies you did something wrong).
  Do say: *"I understand why you're upset. I've been the person who handles this stuff for a long time, so I see why it felt like a shock when I couldn't do it this time."*
  This validates her feelings without accepting blame for your boundary.

  **Step 2: Make the Implicit Explicit.**
  You need to rewrite the contract. You can say:
  *"I love you guys and I love helping, but I realized recently that I've been burning myself out trying to be the organizer/driver/therapist. I'm not pulling away from the friendship, but I am pulling back from the 'manager' role. I need to be a friend who gets supported, too, not just the one who supports."*

  **Step 3: Check the Reciprocity (Crucial).**
  This is the hard part you need to ask yourself: **In three years, has anyone ever done this for you?**
  *   When you were wiped out, did they notice?
  *   When you had a birthday, did they organize it?
  *   When you needed an airport run, did they offer?

  If the answer is "no," then your friend's reaction is not just about disrupted patterns; it is about **privilege.** They have grown accustomed to your labor. If they cannot respect your "no" after three years of your "yes," they value what you *do* for them more than who you *are*.

  ### Summary
  You are not in the wrong. You are experiencing the natural consequence of being "the reliable one": **people rely on you.**

  However, a healthy friendship must be able to withstand a "no." If this friend cannot separate your *capacity* from your *care*, that is a limitation in her emotional maturity, not a failure in your generosity.

  Hold the boundary. Explain the burnout. But watch closely to see if they step up to fill the gap you left, or if they just try to guilt you back into filling it. That will tell you everything you need to know about the future of this group.
