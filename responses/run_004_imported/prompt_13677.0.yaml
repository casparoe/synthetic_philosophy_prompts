  ### Detailed Feedback Notes (for your friend)

  If she wants to leave specific marginalia, here are the precise technical corrections:

  1.  **The Example Swap:** This is the biggest deduction. The student writes: *"A spandrel, on the other hand... the way feathers are generally thought to have originally evolved for thermoregulation and only later... co-opted by selection for flight."* This is the definition of **exaptation**, not spandrel. Gould and Vrba coined "exaptation" specifically for the feather example in a 1982 paper.
  2.  **The Nipple Description:** The male nipple is indeed a spandrel (a byproduct of selection on females), but the student describes it as *"built for one adaptive purpose... that was later co-opted."* Male nipples are not co-opted; they are functionless in males. The student seems to have the definitions reversed in their head despite using the right vocabulary words.
  3.  **Methodological Error:** The final sentence suggests a "null hypothesis" of spandrelism. Gould's point was that adaptationism had become a *tautology* (assuming the trait exists, therefore it must be adaptive). He didn't want students to assume traits were *non-adaptive* by default; he wanted them to stop assuming they were *adaptive* by default. The correct takeaway is "test the hypothesis," not "assume the opposite."
  4.  **Irrelevant Material:** The paragraph on Punctuated Equilibrium (1972) is factually correct regarding Gould's career, but it answers a different exam question. It signals that the student is "dumping" known Gould facts rather than answering the specific prompt about the 1979 Spandrels paper and Exaptation.

  **Recommendation:** This student clearly did the reading for Week 1 (Spandrels) but likely skimmed Week 2 (Exaptation/Gould & Vrba). They deserve credit for the strong grasp of the adaptationist critique, but the biological examples are objectively wrong, which prevents a passing grade higher than a C-range.
