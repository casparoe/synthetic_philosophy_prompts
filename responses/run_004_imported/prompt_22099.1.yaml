      *   **The User's Question:** If *avyapadeśya* allows conceptual content ("cow"), what is *vyavasāyātmaka* doing? Isn't "determinate" already conceptual? Is the *nirvikalpaka/savikalpaka* distinction a later patch to fix a tension in the sūtra, or is it inherent?

  2.  **Initial Assessment & Scholarly Context:**
      *   This is a classic and highly debated issue in Nyāya scholarship.
      *   The tension is real. The sūtra seems to say perception is *both* non-verbal (*avyapadeśya*) *and* determinate (*vyavasāyātmaka*).
      *   Later Nyāya (Navya-Nyāya) and Buddhist epistemologists (Dignāga/Dharmakīrti) sharpened the *nirvikalpaka* (indeterminate) vs. *savikalpaka* (determinate) distinction.
