  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Background:** No formal philosophy training, but self-taught on Ubuntu (via Desmond Tutu) and African philosophy (Ifeanyi Menkiti, Kwame Gyekye).
