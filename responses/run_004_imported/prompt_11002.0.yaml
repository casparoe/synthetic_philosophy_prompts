          *   *Implication:* Those who cannot participate (infants, severely cognitively impaired, isolated) are not "persons" in the full sense.
      *   **Gyekye (Moderate Communitarianism):** Acknowledges the importance of community but insists on inherent individual rights and status. Personhood isn't *solely* achieved; there's a baseline of moral worth attached to being human.
      *   **The Tension:** If personhood = moral standing, and personhood = social participation, then non-participants lack moral standing. This contradicts the intuition (and human rights frameworks) that the vulnerable deserve *more* protection, not less.

  3.  **Drafting the Concrete Example:**
      *   *Goal:* Make the tension visceral. The user mentioned their grandmother, so a hypothetical closely mirroring that situation is best, but perhaps generalized to highlight the ethical dilemma faced by a caregiver.
