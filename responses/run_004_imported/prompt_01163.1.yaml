answer: |-
  This is one of the most classic frustrations in sports, and honestly, your feelings are completely valid. It feels like you're studying for a test while your classmate is guessing, and you both get an A. Why are you the one being sent to extra tutoring?

  However, from a coaching and development perspective, **the coach is actually making the right call for both of you.** But that doesn't mean your technical knowledge is worthless. In fact, it might be more valuable in the long run.

  Here is the breakdown of why this is happening, why it's "fair" in a coaching sense, and why understanding mechanics still gives you a massive advantage even if the free throw percentage is the same right now.

  ### 1. The Coach's Logic: "If it ain't broke, don't fix it"
  Coaches are results-oriented, but they are also risk-averse.
  *   **The "Feel" Shooter (Your Teammate):** She has high *proprioception* (body awareness). Her brain has mapped the motor pattern through thousands of reps without conscious thought. If a coach tries to put technical cues ("tuck your elbow," "snap your wrist") into her head, there is a high risk of **"paralysis by analysis."** You can actually break a natural shooter by making them think about mechanics. The coach is protecting her rhythm.
  *   **The "Technical" Shooter (You):** You build your shot through understanding. Your consistency likely comes from executing the checklist correctly. The clinics reinforce the structure you need to perform. If you stopped going, your shot might drift because you rely on that technical maintenance.

  It's not favoritism; it's **individualized resource allocation.** He is giving you what *you* need to succeed, and leaving her alone because she needs something else (just confidence and reps).

  ### 2. The Value of Mechanics: The "Check Engine" Light
  You asked if it's worth understanding mechanics even when the results are the same. **Yes. Absolutely.**

  Think of it like driving a car. Your teammate is a driver who knows how the car feels when it's running well. You are a driver who also knows how the engine works.
  *   **When things are good:** You both drive 60mph. The result is identical.
  *   **When things go bad:** This is where you win.
      *   When your teammate hits a slump (and every shooter does), she often doesn't know *why*. She just says, "I don't have my touch today." She has to shoot her way out of it, which can take weeks and destroy confidence.
      *   When you hit a slump, you have a **diagnostic toolkit.** You can video yourself. You can check your elbow alignment, your base, your follow-through. You can identify the mechanical leak and fix it.

  Understanding mechanics gives you agency over your slump. Relying on "feel" makes you a victim of your slump.

  ### 3. Consistency Under Pressure and Fatigue
  Free throws are the easiest shot in basketball. They are uncontested, standing still, with no clock pressure. This is the one place where "feel" shooters thrive because the environment is controlled.

  However, mechanics matter much more when:
  *   **You are tired:** In the 4th quarter, legs die. A feel shooter's shot often gets short because their "feel" is calibrated to fresh legs. A technical shooter knows they need to compensate mechanically (use more upper body, adjust arc) to maintain distance.
  *   **There is defense:** Coming off a screen, contested, off-balance. Pure feel often breaks down under physical disruption. Mechanical efficiency allows you to get the shot off faster and more consistently in chaotic environments.

  ### 4. Longevity and Ceiling
  There is a reason why many "natural" shooters plateau in high school or college, while "grinder" shooters often improve steadily.
  *   **The Ceiling:** Intuitive improvement has a limit. Once your natural coordination maxes out, you stop getting better. Technical understanding allows you to optimize efficiency beyond natural coordination.
  *   **Longevity:** Poor mechanics (even if they go in now) put stress on joints. Understanding alignment helps prevent injury. Many natural shooters develop bad habits (like dipping the ball too low or flaring the elbow) that work when they are 16 and athletic, but fail when they are 22 and facing bigger defenders.

  ### 5. The Hidden Benefit: Leadership
  There is a intangible benefit to being the "mechanics person."
  *   When a younger player or a teammate is struggling, your teammate can only say, "Just keep shooting, you'll find it."
  *   You can say, "I noticed you're dropping your elbow on the release, try focusing on finishing high."
  *   This makes you a student of the game, which coaches respect deeply. It translates to basketball IQ beyond just shooting.

  ### The Verdict
  Is it fair? **Yes.** The coach is managing two different operating systems. Trying to install your software on her hardware would crash her game.

  Is your knowledge worth it? **Yes.** Free throw percentage is a small sample size of your shooting ability. Your understanding of mechanics is an insurance policy against slumps, a tool for improvement under pressure, and a skill that will likely keep you shooting well longer than your teammate.

  **My advice:** Don't resent the clinics. Own them. Be the person who knows *why* the ball goes in. Your teammate might be the natural talent, but you are building the foundation of a student of the game. That pays off way beyond high school or college ball.
