  3.  **Evaluate Douglass vs. Modern Originalism (Scalia/Thomas/Gorsuch):**
      *   *Similarities:* Both prioritize text over subjective intent. Both dislike legislative history or secret convention notes (Scalia's "intentionalism" critique).
      *   *Differences:*
          *   *Moral Presumption:* Modern originalism claims to be morally neutral (find the meaning, apply it). Douglass's textualism is *morally loaded*. He reads the text *through* the Preamble's commitment to liberty.
