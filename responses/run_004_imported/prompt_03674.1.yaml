answer: |-
  This is a fantastic rabbit hole to go down, and your editor is right: Douglass is the ultimate wrench in the standard originalism-vs.-living-constitution binary. You've correctly identified that his theory is a hybrid that doesn't map cleanly onto 21st-century categories. He is, in many ways, a **moral textualist** with a **teleological Preamble**.

  If we drag Douglass into a modern courtroom to evaluate Scalia/Thomas/Gorsuch originalism, and specifically to weigh *Bostock* against *Dobbs*, I suspect he would find the modern originalists partially familiar but ultimately guilty of a fatal omission: the moral trajectory of the text.

  Here is how Douglass would likely dissect the modern landscape.

  ### 1. Douglass vs. "Original Public Meaning"
  Douglass would have a strong affinity for the *methodological* critique that New Originalists (like Scalia and Gorsuch) level against Old Original Intentionalists.

  When Douglass broke with Garrison in 1851, his core argument was that Garrison was relying on "secret intentions"—the backroom deals, the private letters of Madison, the unwritten understandings among the framers. Douglass's Glasgow speech insists that we cannot be bound by the "shameful compromises" of the framers if those compromises are not explicit in the text. He writes:

  > *"I hold that the Constitution is a glorious liberty document... I have read it carefully... and I defy the presentation of a single pro-slavery clause in it."*

  To Douglass, the "original meaning" isn't what the men *wanted* to do (protect property in humans); it's what the words *actually say* (secure liberty).

  **Where he diverges:** Modern originalism, particularly the Scalia strand, often claims to be morally neutral. It seeks to find the meaning and apply it, regardless of the outcome. Douglass's textualism is **presumptively moral**. He argues that because the Preamble establishes "Justice" and "Liberty" as the ends, any ambiguity in the operative clauses must be resolved in favor of those ends.

  Scalia famously said the Constitution doesn't guarantee a "right to a good government," only a structured one. Douglass would argue the opposite: The Constitution *is* a guarantee of a moral order, and the text must be read to fulfill that guarantee. He would likely view Scalia's "neutral" originalism as a form of cowardice that allows injustice to hide behind historical accident.

  ### 2. The "History and Tradition" Trap (*Dobbs*)
  This is where Douglass would be most hostile. The *Dobbs* majority opinion relies heavily on whether a right is "deeply rooted in this Nation's history and tradition."

  For Douglass, **American history and tradition were the enemies of liberty.**

  Remember, Douglass was arguing against the *Dred Scott* decision, which was the ultimate "history and tradition" ruling. Taney's opinion relied on the historical status of Black people at the time of the framing to determine their rights. Douglass spent his life arguing that the *principles* of the Declaration and Constitution were meant to *overturn* the traditions of the past, not codify them.

  If Douglass looked at *Dobbs*, he would see a mirror of *Dred Scott*. He would argue that relying on 1868 (or 1789) attitudes toward women or bodily autonomy is exactly the kind of "dead hand" control he rejected when slaveholders said, "The Constitution protects our property."

  To Douglass, "History and Tradition" is a suspect category because, for most of American history, the tradition was slavery, coverture, and disenfranchisement. You cannot use the history of oppression to define the scope of liberty. He would likely say *Dobbs* fails the textualist test because it ignores the Preamble's command to "secure the Blessings of Liberty" in favor of a historical snapshot of when those blessings were denied to many.

  ### 3. *Bostock* vs. *Dobbs*: Which one is "Douglassian"?
  This is the crux of your piece.

  ** *Bostock* (Gorsuch):**
  Gorsuch's opinion is starkly textualist. The statute says "because of sex." If you fire a man for marrying a man, but wouldn't fire a woman for marrying a man, you have treated him differently based on sex. The text controls, even if the 1964 Congress didn't "intend" to protect LGBTQ+ people.

  **Douglass would likely cheer this.** It mirrors his "no word for slave" argument. The Constitution doesn't say "slave," so it can't protect slavery. Title VII doesn't say "except gay people," so it can't exclude them. It respects the "four corners" of the document and refuses to let unenacted intentions (the "understanding" of the 1964 legislators) override the plain text. Crucially, it expands liberty rather than contracting it.

  ** *Dobbs* (Alito):**
  *Dobbs* claims to be originalist but leans heavily on historical practice to narrow rights.

  **Douglass would likely reject this.** Not necessarily because he had a view on abortion (we can't project modern politics onto him), but because of the *hermeneutic*. *Dobbs* says: "If the tradition didn't protect it then, it isn't a right now." Douglass says: "If the text promises Liberty now, the tradition of the past cannot bind us."

  Douglass would likely view *Bostock* as the true heir to his method (text + liberty presumption) and *Dobbs* as a reversion to the Taney Court's error (history + tradition = limit on liberty).

  ### 4. The "Living" Element: Evolution vs. Drift
  You noted Douglass sounds like a living constitutionalist when he talks about "keeping pace with civilization." It's important to distinguish his view from the modern "Living Constitution" theory (which often implies judges should update values).

  Douglass wasn't saying the *meaning* of Liberty changes. He was saying our *understanding* of who is covered by Liberty expands.
  *   **1787:** "We the People" might have practically meant "white male property owners."
  *   **1860:** Douglass argues "We the People" always meant *people*, we were just too blind to see it.
  *   **2024:** The circle expands further.

  This is closer to what some scholars call **"Liquid Originalism"** or **"Principle Originalism."** The *principle* (Liberty) is fixed and original; the *application* is dynamic.

  Modern originalists often fear this dynamic application because it looks like judicial legislation. Douglass would argue that refusing to apply the principle of Liberty to new contexts is itself a violation of the text. He would likely say that a Constitution that cannot protect the vulnerable against the powerful in a new era is a Constitution that has failed its "plainly written purposes."

  ### The Verdict for Your Piece
  If you need a punchy hook, here is the thesis: **Frederick Douglass was the first "Public Meaning" Originalist, but he was one with a soul.**

  He would tell Scalia and Gorsuch: *"You are right to ignore the secret intentions of the framers. But you are wrong to ignore the moral purpose of the text."*

  He would tell the Living Constitutionalists: *"You are right that the document must protect liberty in a modern age. But you are wrong to think that requires ignoring the text. The text is your weapon, if you dare to read it plainly."*

  In the *Bostock* vs. *Dobbs* showdown, Douglass sides with the textual fidelity of *Bostock*, not because he cares about statutory interpretation for its own sake, but because *Bostock* uses the text to expand the circle of "We the People," whereas *Dobbs* uses history to shrink it.

  **The Gimmick Check:**
  To avoid the gimmick trap, frame it not as "What Would Douglass Do?" but as "Douglass exposes the false choice." The fight isn't between Text vs. Values. Douglass proves that for the Constitution to work as law, Text *must* be read through Values (specifically, the values in the Preamble). Modern originalism tries to sever that link; Douglass says the link is the whole point.

  That gives your editor the historical hook without reducing a complex thinker to a mascot for one side.
