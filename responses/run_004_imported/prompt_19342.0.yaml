      *   *St. Petersburg (Infinity):* EUT says "This is worth more than any finite amount." Problem: No one pays millions to play. Solution: Modify utility function (diminishing marginal utility) or reject infinite utility. The *structure* of EUT holds; the *inputs* (utility of money) are the issue.
      *   *Pasadena (Undefined):* EUT says "This has no value." Not "infinite," but *no* value. You can't compare it to a sure \$5. Is it better? Worse? Equal? The theory breaks down completely. It violates the completeness axiom (or at least the ability to rank). It's not a problem of inputs; it's a problem of the *summation mechanism* itself.

