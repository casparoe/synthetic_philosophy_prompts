      *   *Pasadena:* Payoffs alternate signs ($\pm 2^n/n$). Probabilities are ($1/2^n$). The terms in the expectation sum are roughly $\pm 1/n$. This is the alternating harmonic series (scaled).
      *   *Conditional Convergence:* The sum converges *if* you add terms in the specific order of the game (1st flip, 2nd flip, etc.). But $\sum |a_n|$ diverges.
      *   *Riemann Rearrangement Theorem:* If a series is conditionally convergent, you can reorder the terms to sum to *any* real number, or $\pm \infty$.
      *   *Philosophical Translation:* In decision theory, the "order" of outcomes shouldn't matter. A gamble is a set of outcome-probability pairs. The sum should represent the *value* of that set. If re-indexing the set (which is mathematically permissible for a countable set) changes the value from "Win \$10" to "Lose \$1 million," the theory doesn't assign a unique value to the gamble. It's not just "huge"; it's "indeterminate."

