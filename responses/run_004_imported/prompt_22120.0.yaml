  ### **For You (The "Dev" Analogy)**
  Since you mentioned code reviews, here is how to explain the Part (b) error to your partner or the student if they ask:

  *   **Underdetermination (Physics):** Like having two different algorithms that produce the exact same output for every test case. One is "the true" algorithm the universe is using, we just can't tell which one it is.
  *   **Indeterminacy (Quine):** Like saying there *is no source code*. The "meaning" *is* the I/O behavior. Asking which algorithm is "really" running is a nonsense question because there is nothing underneath the I/O. The student graded it as if there *is* source code we just can't see.
