answer: |-
  1. **Morgan:** That talk was brutal. Lewis's ghost is really haunting this department today.

  2. **Casey:** Haunting, sure, but not possessing. The triviality result is serious, Morgan, but it's not a death sentence for truth conditions.

  3. **Morgan:** It feels fatal. You can't have Adams's Thesis and truth conditions. I'm dropping truth conditions.

  4. **Casey:** You're dropping the hope that conditionals express *stable* propositions across all credence functions. There's a difference.

  5. **Morgan:** If the proposition shifts when I update my credence, it's not doing the work of a proposition. It's just a shadow of my epistemic state.

  6. **Casey:** Why? My selection function depends on my epistemic state. That's a feature of the semantics, not a bug.

  7. **Morgan:** Because Lewis's proof assumes the proposition $A > B$ is fixed while $P$ varies. That's the engine of the triviality.

  8. **Casey:** Exactly. And I'm saying $A > B$ isn't fixed when the epistemic context shifts. The proof requires a rigidity I deny.

  9. **Morgan:** So if I learn $A$ is false, the conditional I was assessing earlier changes its truth value?

  10. **Casey:** The proposition you expressed *then* is different from the one you express *now*. The selection function has moved.

  11. **Morgan:** That makes disagreement impossible. I say "If A, B," you say "No." We're talking past each other if the content is that fluid.

  12. **Casey:** We share the context set. Within a conversation, the selection function is fixed. We can disagree locally.

  13. **Morgan:** But Lewis's proof runs through the probability space of a single agent updating. It's not about conversation; it's about coherence.

  14. **Casey:** And when that agent updates, they shift contexts. The triviality proof requires closure under conditionalization *without* context shift.

  15. **Morgan:** You're buying consistency at the price of making the content hyper-sensitive to every belief update.

  16. **Casey:** Better than your price: making conditionals unembeddable. Try negating a non-proposition. "It is not the case that if A, B."

  17. **Morgan:** We handle embedding via a logic of assertibility. It works without truth-values. Yalcin's semantics handles the embeddings fine.

  18. **Casey:** Does it? Or does it just reconstruct truth-conditions under a different name? You're smuggling truth back in as "acceptability."

  19. **Morgan:** I'm smuggling *validity*, not truth. Inference preserves acceptability, not correspondence to worlds.

  20. **Casey:** Then you can't explain why we fear the tiger if we believe "If I run, it chases." We fear the *truth* of the consequence.

  21. **Morgan:** We fear the high conditional probability. I don't need a world where "If I run, it chases" is true to run away.

  22. **Casey:** But you need to explain why "If I run, it chases, or if I stand, it stares" makes sense. Disjunctions need propositions.

  23. **Morgan:** Expressivists handle disjunctions by defining acceptance conditions for the complex sentence. We don't need constituent truth-values.

  24. **Casey:** It gets messy fast. My account keeps the logic classical. Yours requires a new logic for every connective.

  25. **Morgan:** Classical logic fails for conditionals anyway. Import-Export fails on your account if you want to avoid triviality.

  26. **Casey:** I can restrict Import-Export. It's not a valid principle for indicatives. Better to drop a rule than drop truth.

  27. **Morgan:** Dropping truth drops the metaphysical baggage. I don't need possible worlds to explain betting behavior.

  28. **Casey:** You need them to explain why you lose the bet when the world turns out a certain way. Truth explains the payoff.

  29. **Morgan:** The payoff is determined by the assertibility conditions at the time of the bet. The world just tests the credence.

  30. **Casey:** So if you were highly confident but wrong, you were still "right" in your assertion? That divorces assertion from fact.

  31. **Morgan:** It divorces assertion from *truth*, not from rationality. I was rational. Lewis just showed truth is the wrong metric here.

  32. **Casey:** Then we're at an impasse. You save the agent; I save the world. I think the world matters more.
