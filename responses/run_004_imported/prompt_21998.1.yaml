      *Let's write.*

      "You're drafting the opinion backwards," Marcus said, rubbing eyes ringed with red.

      Priya didn't look up from her laptop. "I'm drafting it logically. If the majority finds a contract and the majority finds a breach, liability follows. That's math."

      "It's not math, it's judging," Marcus snapped. "Look at the tally. Judge Two says no liability. Judge Three says no liability. That's a majority for the defendant. If you write this opinion using premise-based voting, you're telling the defendant they lose even though two judges voted to let them walk."

      "Because those two votes are incoherent," Priya said, finally turning her chair. "Judge Two thinks there's a contract but no breach. Judge Three thinks there's a breach but no contract. Individually they say 'not liable,' but collectively they've affirmed every element required for liability. If we ignore that, we're publishing an opinion that contradicts its own findings of fact."

      "So we lie about the verdict instead?" Marcus poured cold coffee into the sink. "Outcome voting respects the judges' actual dispositions. They were asked to decide the case, not play logic puzzles. Judge Two and Three both rejected the bottom line. Overriding that because their reasons don't align feels like... like installing a phantom majority."

      "It's not phantom, it's doctrinal," Priya countered. "The law is built on rules. If the rule says A plus B equals C, and the majority agrees on A and B, then C is the only legal outcome. Anything else makes the court look arbitrary. 'Yes, you breached, and yes, it was a contract, but sure, keep the money.'"

      "It makes the court look honest," Marcus said. "Because here's the ugly truth your method hides: Under premise voting, Judge One wins. She's the only one who actually wanted liability. The other two said no. But because their 'no' votes split on the reasoning, your method lets Judge One impose her view using the scraps of the others' logic. That's minority rule disguised as consistency."

      Priya hesitated. She knew he had a point there. "But if we go outcome-based, we validate inconsistency. We create precedent saying a contract exists and was breached, but there's no remedy. What happens to the next case? Lawyers can't advise clients on a rule that says 'yes, but no.'"

      "Lawyers advise on wins and losses, Priya, not syllogisms," Marcus said, leaning against the counter. "If we force the logic, we force a result nobody really signed up for. If we follow the votes, we respect the judges' authority, even if the reasoning is messy."

      "Messy reasoning destroys legitimacy," Priya said softly.

      "So does forcing a loss on a guy who got two votes for freedom," Marcus replied.

      They sat in the hum of the server room down the hall. The draft blinked on the screen, the cursor pulsing on a verdict that felt impossible to justify either way.

      "Judge Henderson wants this on his desk by eight," Marcus said.

      "I know," Priya said. "I just don't know which lie to tell."

      "Pick one," Marcus said. "Just don't call it math."

