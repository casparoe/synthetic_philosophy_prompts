          *   Tone: Character voice, not position papers.
          *   Length: 500-600 words of dialogue.
          *   Accuracy: Reflect the actual philosophical/legal debate (doctrinal paradox/discursive dilemma).

  2.  **Deconstruct the Arguments:**
      *   **Priya (Premise-based/Issue-based):**
          *   Argument: Law is about reasoning, not just results. If the majority agrees on the legal principles (contract exists, breach happened), the outcome must follow the logic. Otherwise, the opinion is a lie (saying "not liable" while admitting the elements are met).
          *   Counter-counter: It forces a result (Liable) that no single judge actually voted for. Judge 1 wants liable, but Judges 2 & 3 want not liable.
      *   **Marcus (Outcome-based/Case-based):**
          *   Argument: Judges are appointed to decide cases, not abstract propositions. If two judges say "not liable," the defendant walks. Premise voting allows a "ghost majority" to impose a result nobody really signed up for.
          *   Counter-counter: It creates inconsistency. The court says "Yes, there was a contract" and "Yes, there was a breach" but then says "No liability." That undermines the rule of law.

