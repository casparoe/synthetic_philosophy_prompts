      *   *Setting the Scene:* Late night, clerks' office, coffee, tension.
      *   *Opening:* Priya pushing the draft based on issues. Marcus pushing back.
      *   *Middle:* The core philosophical clash. Priya focuses on coherence; Marcus focuses on democratic legitimacy of the vote.
      *   *Ending:* Stalemate. They know the judges have to decide, but the clerks are stuck on the logic.

