      *   **Sister's Joke:** A wedding is the "most convention-laden promise" (officiant, vows, legal paperwork, history).
      *   **Audience:** Mostly family/friends (non-philosophers), but a handful of philosophers from her department will be there.
      *   **Tone:** Warm, genuinely funny, avoids clichés ("written in the stars"), respectful of the philosophy (not reducing it to a punchline for the experts), accessible to non-philosophers.
      *   **Structure:** Built around the "most convention-laden promise" line as a running joke, ending sincerely using that line without misrepresenting her view.
      *   **Length:** About 5 minutes (roughly 600-800 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophy for the Speech:**
      *   *Scanlon (The Enemy, in this context):* Breaking a promise is wrong because it manipulates expectations. It's internal/moral.
      *   *Hume (The Ally):* Promises are human inventions/conventions for mutual advantage. They need a social structure to work.
      *   *Sister's Twist:* The specific words "I promise" need the *practice* to have weight.
      *   *Application to Wedding:* A wedding isn't just two people feeling love; it's invoking a massive social, legal, and historical apparatus. That *is* the binding force, according to her theory.
      *   *The Challenge:* How to make this sound like a wedding toast and not a lecture? Use the "convention" angle to highlight the *support* of the community, rather than dry social contract theory.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role, the sister, and the "no clichés" rule. Establish the philosophical context lightly.
      *   **The Setup (The Dissertation):** Mention her work without getting bogged down. Introduce the Hume vs. Scanlon debate simply.
      *   **The Running Joke (Convention-Laden):** Introduce the "most convention-laden promise" line early. Use it to poke fun at the wedding trappings (cakes, licenses, officiants).
      *   **The Turn (For the Philosophers):** Show understanding of *why* she argues this. It's not that love doesn't matter, it's that the *structure* matters. The "practice" is the community.
      *   **The Turn (For the Family):** Explain "convention" in lay terms. It means "we all agree to hold you to this." It means support.
      *   **The Conclusion:** Bring it back to the couple. Use the "convention" line sincerely. The convention isn't a shackle; it's a safety net.

  4.  **Refining the Tone:**
      *   *Avoid:* "As Kant would say..." (Too academic).
      *   *Avoid:* "Love is magic." (Forbidden cliché).
      *   *Aim:* "Love is a contract we all sign." (Too cold).
      *   *Better:* "Love is a promise kept alive by all of us."
      *   *Philosophical Nod:* Ensure terms like "social practice," "mutual advantage," and "expectations" are used correctly enough for the PhDs to nod, but contextually clear for others.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm the MOH. My sister is a philosopher. She hates clichés. She studies promises. She thinks Hume was right and Scanlon was wrong. She says weddings are huge conventions. Look at all this stuff. But seriously, she's right. Promises need a team. We are the team. So raise a glass to the convention.

      *Critique 1:* Too dry. Needs more warmth. The philosophy needs to be woven in, not stated as a bio.

  6.  **Drafting - Iteration 2 (Adding Flavor):**
      Start with the "no clichés" rule. Mention her dissertation stress. Explain the "I promise" weight. Use the "most convention-laden" joke about the paperwork and the cake. Then pivot: Why does she care? Because words need backup. That backup is us. The philosophers will get the Hume reference. The rest will get the "village" metaphor. End with the sincere version of the joke.

  7.  **Finalizing the Content (incorporating specific constraints):**
      *   *Constraint Check:* Did I misrepresent her view? Her view is that the *practice* does the binding work. So, the speech must emphasize that the *guests* constitute the practice that makes the marriage binding/real.
      *   *Constraint Check:* Is the ending sincere? Yes, the "convention" becomes the "community support."
      *   *Constraint Check:* Is it funny? Need to add jokes about the officiant, the legal paperwork, etc.

  8.  **Writing the Speech (incorporating the "Hume/Scanlon" nuance):**
      *   *Key distinction:* Scanlon = internal moral wrong (manipulating expectations). Hume/Sister = external social structure (invoking a practice).
      *   *Speech angle:* "She doesn't believe in magic; she believes in infrastructure."
      *   *The Punchline:* "This is the most convention-laden promise..."
