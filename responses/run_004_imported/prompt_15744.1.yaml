answer: |-
  Good evening, everyone. For those who don't know me, I'm the maid of honor and the younger sibling. I've been tasked with giving this toast under one very specific condition from the bride: I am not allowed to say that love "needs no explanation," that this day is "magical," or that anything was "written in the stars."

  Normally, this would be a problem. But then I remembered what [Sister's Name] does for a living. She is finishing her PhD in philosophy, and for the last two years, our family dinners have been dedicated to her dissertation on the nature of obligation. Specifically, she argues that promises don't bind us because of some invisible moral magic. They bind us because we have built a shared social practice that gives the words "I promise" their weight.

  So, in the interest of intellectual honesty—and self-preservation—I decided to write a speech that respects her actual theory of commitment.

  For the last few months, as [Sister's Name] stress-tested her arguments, she would often look at her own wedding planning and laugh. She'd point to the marriage license, the officiant, the printed programs, and the centuries of ritual history, and she'd say, "Do you realize this is objectively the single most convention-laden promise a person can make?"

  It became a running joke. She'd be signing the guest book and mutter, "Just reinforcing the social practice." She'd look at the open bar and say, "Ah, the mutual advantage clause." And honestly, she has a point. If you look at the paperwork alone, this isn't just a romance; it's a legal merger with better catering.

  For the non-philosophers in the room, what she's arguing is that a promise isn't just a feeling inside your head. You can't just *feel* married. You have to *do* married. You have to invoke a structure that exists outside of you.

  For the philosophers here—hello, I see you nodding—she's pushing back against the idea that breaking a promise is wrong simply because it manipulates expectations (sorry, Scanlon). She's arguing that the binding force comes from knowingly invoking a public institution. It's Humean, in the best sense. It acknowledges that we need a scaffold to hold us up when our individual willpower might waver.

  And this is where I want to turn that joke into the actual point of this toast.

  [Sister's Name] is right. This *is* the most convention-laden promise you can make. But the reason that matters isn't because of the legal paperwork or the historical ritual. It's because a "convention" is just a fancy word for "agreement."

  When you stand up there and say "I do," you aren't just talking to [Groom's Name]. You are talking to us. You are invoking a practice that involves your parents, your friends, your colleagues, and this community. You are asking us to witness the promise, and more importantly, to uphold the practice that makes the promise stick.

  In her dissertation, [Sister's Name] argues that the "real binding work is done by the existence of a shared practice." Well, look around you. *We* are the shared practice.

  When times are easy, you won't need us. You won't need the convention. But when things are hard—when the "mutual advantage" feels temporarily out of balance, when the expectations are strained—that is when the convention matters. That is when you need to know that there is a structure of support around you. That there is a room full of people who agree that this marriage matters, not just because you feel like it does today, but because we are all committed to the institution of *you two together*.

  So, [Sister's Name], you were right. This isn't written in the stars. It's written in the social contract. It is built on convention. It is laden with ritual. And thank goodness for that. Because feelings fade, but a robust, community-enforced social practice? That is something you can build a life on.

  Please raise your glasses. To the bride and groom: May your expectations be reasonable, your conventions be sturdy, and your mutual advantage be endless.
