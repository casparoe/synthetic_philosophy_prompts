          *   *Rawlsian:* Rejection of Principle of Insufficient Reason (no grounds for equal probabilities), the gravity of the stakes (unacceptable worst outcomes), limited interest in gains above the minimum (marginal utility drops off). Distinction between "risk aversion" and rational caution under radical uncertainty (ambiguity).
          *   *Harsanyiian:* Rationality requires assigning equal probabilities in the absence of information (Principle of Insufficient Reason/Indifference), standard axioms of rational choice (VNM), Maximin is irrational extreme risk-aversion, ignoring probable gains for improbable safety.
