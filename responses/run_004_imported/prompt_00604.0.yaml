prompt: |-
  I teach a philosophy of physics seminar, and every single year when we hit Everett's many-worlds interpretation someone brings up quantum suicide and the whole session dissolves into people arguing about whether they'd personally take a specific bet instead of actually thinking it through. So I want to outsource this to you and see if you can do better than my students usually manage. You know the setup, probably - Moravec and Marchal had versions of it back in the 80s but Tegmark's the one everyone actually cites: you sit in front of a device that performs a genuinely quantum measurement each trial and kills you instantly, no lingering, if it comes up the "wrong" way. The argument for quantum immortality is that since you're never around to have the experience of being in a branch where you died, subjectively you should expect, with certainty, to keep waking up alive no matter how many trials you run. Some people push this into an actual wager: rig the machine so a "win" pays a fortune and a "loss" just erases you painlessly, and ask whether a rational many-worlder should take that bet at arbitrarily terrible odds, since "you" will only ever be around afterward to spend the winnings.

  Here's the part that never seems to survive contact with the reddit-tier version of this thought experiment, and it's what I actually want you to engage with. First, the whole argument is quietly doing naive branch-counting - treating "a branch where I survive" and "a branch where I don't" as symmetric possibilities to be indifferent between. But the Deutsch-Wallace decision-theoretic case for the Born rule is precisely the claim that rational credence in branching scenarios has to track amplitude-squared weight, not a head-count of branches, so it's not remotely obvious naive branch-counting is even a coherent notion of "my credence" to begin with. Second, David Lewis, in one of the last things he wrote (published in 2004, a few years after he actually died), pointed out that even granting the argument, conditionalizing on survival across many repeated trials should make you expect to end up increasingly crippled and decrepit rather then unscathed, since the "clean" surviving branches get squeezed out relative to the ones where you barely limped through as the trials pile up. So the immortality reading might be less "great news" and more a curse.

  What I want is an actual essay that weighs these two complications against the naive case for the bet and reaches a real verdict, not a survey that ends with "there are considerations on both sides." Is it rational for a committed Everettian to take the quantum suicide wager, and if so, under what account of self-locating credence does that survive the amplitude-weighting objection? And seperately: if some version of quantum immortality is just true regardless of what's "rational" to bet on, is that actually good news given the Lewis point, or does it just mean death specifically is off the table while everything short of it stays fully in play? Give me an actual position and defend it - "yes, but only under X notion of credence" is a fine kind of answer, "who knows" is not.
reasoning: |-
  Here's a thinking process that leads to the essay above:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy of physics seminar. Students get distracted by "Quantum Suicide/Immortality" (QS/QI) and argue about personal bets rather than the physics/philosophy.
      *   **Task:** Write an essay engaging deeply with QS/QI within the Everettian (Many-Worlds Interpretation, MWI) framework.
      *   **Key Constraints:**
          *   Must address two specific complications: (1) The conflict between naive branch-counting and the Deutsch-Wallace (DW) decision-theoretic derivation of the Born rule (amplitude-squared weighting). (2) David Lewis's objection regarding "decrepitude" (surviving branches are likely to be low-quality survival).
          *   Must reach a *definite verdict*. No "on the one hand, on the other hand" fence-sitting.
          *   Must answer: Is it rational to take the bet? Under what account of credence? Is QI good news or a curse?
      *   **Tone:** Academic but engaging, suitable for a seminar context (rigorous, precise, avoiding pop-sci hand-waving).

  2.  **Deconstruct the Arguments:**

      *   **The Naive QS Argument:**
          *   Premise 1: MWI is true.
          *   Premise 2: Subjective experience requires a living observer.
          *   Premise 3: In some branch, I survive.
          *   Conclusion: I will subjectively experience survival with probability 1.
          *   Wager: Take any bet where death = 0 utility (non-existence) and survival = positive utility, regardless of amplitude.

      *   **Complication 1: Deutsch-Wallace (DW) & The Born Rule:**
          *   DW argues rational agents in MWI should maximize expected utility weighted by squared amplitude (Born rule), not branch count.
          *   If the "death" branch has high amplitude (e.g., 99.9%), a rational Everettian should treat the risk as 99.9%, not 50% (or 1/n).
          *   If I die in the high-weight branch, *that* version of me is gone. The low-weight survivor is a distinct continuant with negligible measure.
          *   *Implication:* The naive QS argument relies on branch counting, which DW explicitly rejects as irrational.

      *   **Complication 2: David Lewis's Decrepitude Objection:**
          *   Even if I survive, *how* do I survive?
          *   "Clean" survival (no injury) usually has lower amplitude than "messy" survival (injury, trauma) in high-risk scenarios.
          *   Iterating the experiment filters for branches where survival is possible, however marginal.
          *   *Implication:* QI implies eternal suffering/decay, not eternal youth/victory.

  3.  **Formulate a Verdict:**
      *   *Option A (Pro-QS):* Defend branch counting. (Hard to do against DW).
      *   *Option B (Anti-QS):* Argue DW kills the bet. (Stronger physics/decision theory backing).
      *   *Option C (Nuanced Anti-QS):* Argue that even if QI is metaphysically true, it's decision-theoretically irrelevant and axiologically horrific.
      *   *Decision:* I need to take a firm stance. The strongest philosophical position aligns with the consensus of modern Everettian decision theory (Wallace, Saunders, etc.). The verdict should be: **No, it is not rational to take the bet.** The QS argument fails because it misapplies self-locating credence by ignoring measure. Furthermore, even if "immortality" holds metaphysically, it is axiologically negative (Lewis's point).

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Acknowledge the classroom dynamic. State the thesis clearly: The Quantum Suicide wager is irrational for an Everettian because it violates the Born Rule weighting required by decision-theoretic coherence, and the resulting "immortality" is axiologically catastrophic.
      *   **Section 1: The Decision-Theoretic Kill Shot (DW vs. Branch Counting):**
          *   Explain why naive branch counting is incoherent in MWI (basis problem, continuous spectra).
          *   Explain the DW theorem: Rationality *requires* weighting by amplitude.
          *   Apply to the bet: If the death branch has 99% weight, you should act as if there's a 99% chance of death. The "surviving you" is a low-measure outlier. To prioritize them is to violate diachronic consistency.
      *   **Section 2: The Metaphysics of Survival (Lewis's Decrepitude):**
          *   Grant for argument's sake that *some* consciousness continues.
          *   Analyze the *quality* of that continuation.
          *   The "measure" of healthy survival drops faster than the measure of damaged survival.
          *   Result: Quantum Immortality $\neq$ Quantum Invincibility. It's Quantum Lingering.
      *   **Section 3: Synthesizing the Verdict:**
          *   Combine the decision-theoretic rejection with the axiological warning.
          *   Address the "Self-Locating Credence" question: We should use *caring measure* (Greaves) or *objective weight* (Wallace), not naive subjective probability.
          *   Final conclusion: Don't take the bet. It's irrational and undesirable.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Am I being too dismissive of the "subjective certainty" aspect?
      *   *Fix:* Acknowledge that from the *inside* of the survivor branch, it looks like certainty. But decision theory is about the *pre-branch* agent. The pre-branch agent cares about their future successors in proportion to their weight.
      *   *Critique:* Is Lewis's point compatible with DW?
      *   *Fix:* Yes. DW tells you not to take the bet. Lewis tells you that even if you did, you wouldn't like the outcome. They reinforce each other.
      *   *Tone Check:* Ensure it sounds like a seminar paper/essay, not a blog post. Use terms like "diachronic consistency," "measure," "axiological," "self-locating uncertainty."

  6.  **Final Polish:**
      *   Check against the prompt's specific requirements.
      *   *Verdict:* Explicit "No."
      *   *Credence Account:* Explicitly name the DW/Greaves "caring measure" approach.
      *   *Lewis Point:* Explicitly integrated as an axiological defeat.
      *   *No fence-sitting:* Ensure the conclusion is punchy.

  7.  **Final Output Generation:** (Proceeding to write the essay based on this structure.)
answer: |-
  **Title:** The Measure of Survival: Why the Quantum Suicide Wager is Irrational and Undesirable

  **Abstract:** The Quantum Suicide (QS) thought experiment is frequently invoked as a reductio ad absurdum of the Everettian (Many-Worlds) interpretation, or conversely, as a pathway to subjective immortality. This essay argues that the QS wager is decision-theoretically irrational for a committed Everettian and axiologically catastrophic. By applying the Deutsch-Wallace decision-theoretic framework, we demonstrate that rational credence must track amplitude-squared measure rather than branch count, nullifying the incentive to take the bet. Furthermore, incorporating David Lewis's objection regarding "decrepitude," we conclude that even if subjective continuity persists in low-measure branches, the resulting state constitutes a curse rather than a benefit. The verdict is definitive: a rational Everettian must refuse the wager.

  ***

  ### Introduction

  The Quantum Suicide (QS) thought experiment poses a stark challenge to the coherence of rational agency within the Everettian (Many-Worlds) interpretation of quantum mechanics. The setup is familiar: an agent faces a device triggered by a quantum measurement that kills them instantly upon one outcome and leaves them unharmed (perhaps with a reward) upon the other. The "Quantum Immortality" argument suggests that because the agent cannot subjectively experience the branch where they die, they should expect to survive with certainty, and thus should accept the wager regardless of the odds.

  In seminar contexts, this often devolves into intuitive gambling scenarios that ignore the structural constraints of the interpretation. To resolve this, we must subject the QS argument to the rigorous standards of Everettian decision theory and axiology. This essay advances two claims. First, the QS wager violates the Deutsch-Wallace (DW) derivation of the Born rule, which mandates that rational agents weight future branches by squared amplitude, not by a naive count of outcomes. Second, even if one grants the metaphysical possibility of survival in low-measure branches, David Lewis's objection regarding the quality of that survival demonstrates that "immortality" in this context is indistinguishable from eternal decrepitude. Consequently, it is not rational to take the QS bet, and the phenomenon of Quantum Immortality, insofar as it exists, is not good news.

  ### 1. The Decision-Theoretic Objection: Measure Over Counting

  The core error of the naive QS argument is its reliance on branch counting. It assumes that if there is *a* branch where the agent survives, the subjective probability of finding oneself in that branch is non-negligible, or even unity. This presupposes that all branches are created equal ontologically and decision-theoretically. However, in the modern Everettian framework, this is incoherent.

  The Deutsch-Wallace theorem establishes that a rational agent in an Everettian multiverse, who satisfies standard diachronic consistency axioms, must act as if the probability of an outcome is given by the Born rule (the squared amplitude of the wave function component). In the QS scenario, suppose the "survival" outcome has an amplitude squared of $\epsilon$ (where $\epsilon \approx 0$) and the "death" outcome has an amplitude squared of $1 - \epsilon$.

  The naive QS proponent argues that the agent should ignore $\epsilon$ because the "dead" future selves do not experience anything. However, this ignores the perspective of the *pre-branch* agent. Decision theory is concerned with the preferences of the agent prior to the split. According to the DW framework, the pre-branch agent cares about their future successors in proportion to their measure. To ignore the measure is to violate the principle of *diachronic consistency*: the pre-branch agent would prefer that their high-measure successors (the dead ones, in terms of resource allocation or legacy, though strictly speaking, they cease to exist) are not sacrificed for the sake of a low-measure successor.

  More precisely, the "caring measure" account (defended by Hilary Greaves and David Wallace) suggests that rationality requires weighting the utility of future branches by their amplitude. If I face a 99.9% amplitude risk of death, I should care 99.9% less about the future where I survive. To take the QS bet is to prioritize a "ghost" successor—a future self with negligible measure—over the overwhelming weight of the current self's expectation of cessation.

  Therefore, under the only decision-theoretic account compatible with the empirical success of quantum mechanics (the DW account), the rational credence assigned to survival is $\epsilon$, not 1. The QS wager is simply a high-stakes gamble with terrible odds. A rational Everettian should reject it for the same reason a Copenhagenist should: the probability of death is effectively 1. The metaphysical fact that *someone* identical to you survives in a remote branch is decision-theoretically irrelevant if that branch has negligible weight.

  ### 2. The Axiological Objection: The Lewis Decrepitude Argument

  Let us grant, for the sake of argument, that the decision-theoretic objection fails. Suppose an agent decides to prioritize the existence of *any* future successor, regardless of measure. Does this validate the "Immortality" claim as a desirable outcome? Here, David Lewis's objection, articulated in his final years, delivers a fatal blow to the appeal of QS.

  The QS argument typically assumes a binary outcome: pristine survival or instant death. However, physical reality is continuous. In any scenario where a quantum event determines survival, there is a spectrum of outcomes ranging from "unharmed" to "severely injured but alive" to "dead." The amplitude associated with "unharmed survival" typically decreases much faster over repeated trials than the amplitude associated with "marginal survival."

  Consider iterating the QS experiment. To survive a lethal trigger repeatedly, the wave function components where the mechanism jams, where the bullet grazes, or where biological resilience defies expectation must be selected. These are low-measure branches. As the number of trials $N \to \infty$, the measure of branches where the agent remains healthy approaches zero faster than the measure of branches where the agent survives in a state of trauma.

  Lewis points out that conditionalizing on survival across many trials does not select for *invincibility*; it selects for *luck*. But not just any luck—the specific, improbable luck that allows biological continuity despite lethal damage. The result is not an immortal hero collecting winnings, but an immortal victim accumulating trauma. The "surviving" branches are overwhelmingly likely to be those where the agent is maimed, diseased, or neurologically compromised, because the "clean" survival branches are squeezed out by the amplitude dynamics of the interactions required to keep them alive.

  Thus, even if the QS argument proves that subjective cessation is impossible, it does not prove that *flourishing* is possible. The "Immortality" offered is not a reward; it is a trap. It guarantees that death is off the table, but it leaves pain, decay, and entrapment fully in play. From an axiological perspective, this is not a benefit to be sought via a wager, but a horror to be avoided.

  ### 3. Synthesis and Verdict

  We must now integrate these two objections to reach a verdict on the seminar question: Is it rational to take the bet, and is the resulting immortality good news?

  **On Rationality:**
  It is **irrational** to take the Quantum Suicide wager. The justification rests on the Deutsch-Wallace decision-theoretic framework. Rational credence in an Everettian multiverse is not determined by the existence of a branch, but by the *measure* of that branch. The "Self-Locating Credence" appropriate here is not "I will find myself in a branch where I exist" (which is trivially true), but "I should act to maximize the expected utility weighted by branch measure." Since the death branch carries the overwhelming measure, the expected utility of the wager is negative. To take the bet is to violate the norms of rational agency derived from the structure of the theory itself. The only account of credence that survives the amplitude-weighting objection is the **Born-Weighted Caring Measure**, and under this account, the probability of "effective death" is near unity.

  **On Desirability:**
  Even if one rejects the DW framework and accepts the metaphysical claim of Quantum Immortality, the outcome is **axiologically negative**. Lewis's decrepitude argument demonstrates that the conditional probability of "healthy survival" given "survival" diminishes rapidly with repeated risk. The "immortality" is not a state of perpetual victory, but a state of perpetual marginal continuity. It implies that while the experience of death may be absent, the experience of suffering need not be. Therefore, Quantum Immortality is not good news; it is a specific kind of existential risk where the exit door is locked, but the room is on fire.

  ### Conclusion

  The Quantum Suicide thought experiment fails as a justification for reckless behavior because it conflates *ontological existence* with *decision-theoretic weight*. A committed Everettian should not take the bet because rationality requires respecting the Born rule, which assigns negligible value to the surviving branch. Furthermore, the seminar should conclude that the "Immortality" derived from this setup is a philosophical cautionary tale, not a promise. It highlights that in a branching universe, survival is not a binary good, but a continuous variable subject to the same entropic decay as everything else. The rational verdict is to keep the safety on, not because death is impossible, but because the cost of the branches where it is avoided is too high to pay.
