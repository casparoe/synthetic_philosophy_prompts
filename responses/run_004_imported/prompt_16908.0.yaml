prompt: |-
  So I went down a bit of a rabbit hole a few weeks back reading about Gödel's ontological proof -- the one that only survives because Dana Scott wrote up notes on it and started circulating them, since Gödel himself never published it. What's been bugging me since is the "modal collapse" objection that people like Sobel raised against it: apparently if you take Gödel's axioms about positive properties, essence, and necessary existence completely at face value, you don't just get "a God-like being necessarily exists," you get the much stronger and honestly kind of insane result that literally every true proposition turns out to be a necessary truth -- no contingency left anywhere in the universe. I get that this happens, i've seen it asserted enough times, but I don't have a real gut-level feel for WHY it happens mechanically. Which axiom, or combination of axioms, is actually doing the collapsing, and is there an intuitive way to see it coming without grinding through a full S5 derivation line by line?

  Bonus question if you're up for it: I recall that people like C. Anthony Anderson tried to patch Gödel's proof by tweaking the definitions of "God-like" and "essence" specifically to block the collapse. Does that patch actually work, or does it just relocate the problem somewhere else in the axiom system? Not a trained logician myself so feel free to lean on intuition and examples rather than dense modal notation.
