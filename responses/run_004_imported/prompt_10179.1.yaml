          *   *Alternative:* Majority on Conclusion (3 No) $\rightarrow$ **Not Responsible**.
      *   **Questions:**
          1.  What are the implications for panel operation?
          2.  Premise-based (question-by-question) vs. Conclusion-based (overall verdict)?
