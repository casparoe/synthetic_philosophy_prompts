  2.  **Deconstruct the Core Concepts:**
      *   **The Paradox:** The Discursive Dilemma (List & Pettit). It shows that proposition-wise majority voting can yield inconsistent collective judgments compared to conclusion-wise majority voting.
      *   **Premise-Based Procedure (PBP):** Vote on premises, derive conclusion logically. *Pros:* Consistency, transparency of reasoning, accountability for reasons. *Cons:* Can override the majority's will on the outcome (as seen in the user's case).
      *   **Conclusion-Based Procedure (CBP):** Vote on the final verdict directly. *Pros:* Respects majority will on the outcome. *Cons:* Opaque reasoning, potential for inconsistent rationales (everyone agrees on "guilty" but for different, mutually exclusive reasons).
      *   **Manipulation/Agenda Control:** Who sets the questions? If I want a "Responsible" verdict but know only 2 people support it outright, I can split the difference via premises.
