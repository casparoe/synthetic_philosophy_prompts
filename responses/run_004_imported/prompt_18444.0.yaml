answer: |-
  Here are 10 interview questions designed to push past the standard talking points, complete with setup context and follow-ups keyed to her likely non-cognitivist responses.

  ### 1. The Triviality Constraint
  **Question:** "Let's start with the engine room: Lewis's triviality proof. Everyone knows the conclusion—that Stalnaker's Thesis collapses if conditionals are propositions. But I want to walk through the *constraint* that drives the collapse. The proof only works if we require the equation $P(\text{If } A, B) = P(B|A)$ to hold not just for your current credence function, but for *any* rational credence function that could result from learning new information. Why is it fair to impose that requirement across a whole family of functions? Isn't it a bit of a cheat to say a theory fails because it can't handle hypothetical agents with different evidence, rather than just failing for you and me right now?"

  *   **Likely Answer:** She will argue that a semantic theory shouldn't be contingent on a specific evidence state. If the meaning of 'if' is fixed, the relationship between the conditional and the conditional probability must be stable across rational updates; otherwise, the meaning changes as you learn.
  *   **Follow-up:** "But if stability across updates forces us to abandon truth conditions entirely, are we sure the problem isn't with the assumption that *probability* is the right tool to model semantic content here? Or is the lesson actually that rational agents are far more constrained than we thought?"

  ### 2. The Cost of the Bullet
  **Question:** "You're willing to bite the bullet that indicatives don't express propositions. That saves Stalnaker's Thesis, but it costs you classical logic. If 'If A, B' isn't true or false, then strictly speaking, Modus Ponens shouldn't be valid, because validity is usually defined as truth-preservation. How do you recover the *normative force* of logical inference without truth conditions to preserve?"

  *   **Likely Answer:** She will likely pivot to a notion of "validity as preservation of acceptability" or "high conditional probability." She'll argue we care about not moving from high confidence to low confidence.
  *   **Follow-up:** "But preservation of probability isn't transitive in the same way truth is. Doesn't that mean you have to accept that some classically valid arguments involving chains of conditionals are actually fallacies on your view?"

  ### 3. The Embedding Problem
  **Question:** "This leads to the compositionality worry. If I say, 'It is not the case that if it rains, the match is cancelled,' I seem to be negating the conditional itself. If the conditional doesn't have a truth value, what exactly is the negation operating on? Are you forced to say that embedded conditionals are actually syntactic illusions that paraphrase away into something unembedded?"

  *   **Likely Answer:** She will likely adopt a suppositional semantics for embeddings (e.g., "Not (If A, B)" means "Supposing A, not B"). She'll deny they are illusions but insist they don't denote propositions.
  *   **Follow-up:** "If the negation is just another supposition, how do you handle disjunctions like 'Either if A then B, or if C then D'? You can't suppose two antecedents simultaneously in a single scope. Do you have to treat the disjunction as having a completely different logical form than it appears on the surface?"

  ### 4. Gibbard's Sly Pete
  **Question:** "Let's talk about Gibbard's 'Sly Pete' case. Two informants, one knows Pete has a losing card, one knows Pete cheats. Both assert contradictory conditionals: 'If Pete calls, he wins' and 'If Pete calls, he loses.' On a truth-conditional view, one of them is wrong. On your view, both are acceptable relative to their information states. Does this imply that there is *no* fact of the matter about which conditional is correct, even for an omniscient observer?"

  *   **Likely Answer:** She will likely say yes. The "fact" is just the material implication (which might be false), but the *indicative* assertability is purely relative to the speaker's information. There is no "view from nowhere" for indicatives.
  *   **Follow-up:** "If there's no fact of the matter, does that make disagreement impossible? If I learn your evidence, I accept your conditional. Are we ever actually disagreeing about the world, or just comparing our information states?"

  ### 5. Belief vs. Acceptance
  **Question:** "You distinguish between *believing* a proposition and *accepting* a conditional. But in ordinary language, I say 'I believe that if it rains, the grass gets wet.' I don't say 'I accept the supposition...' Are you arguing that ordinary speakers are systematically mistaken about their own mental states? Is this an error theory of folk psychology?"

  *   **Likely Answer:** She will likely deny it's an error theory. She'll argue 'believe' is polysemous or that 'acceptance' is a distinct cognitive attitude that folk psychology lumps under 'belief' for convenience.
  *   **Follow-up:** "If it's a distinct attitude, does it have a different functional role? For example, if I accept 'If A, B' but don't believe 'A', I won't assert 'B'. But if I *believe* 'A' later, do I automatically believe 'B'? Or does the acceptance expire?"

  ### 6. The Subjunctive Divide
  **Question:** "Most non-cognitivists about indicatives remain cognitivists about subjunctives (counterfactuals). We say 'If Kennedy hadn't been shot, he would have won' seems to have truth conditions. Why is the semantic gap between 'If Oswald didn't shoot him, someone else did' (indicative) and 'If Oswald hadn't shot him, someone else would have' (subjunctive) so vast that one expresses a proposition and the other doesn't?"

  *   **Likely Answer:** She will point to the independence of the antecedent. Indicatives are for learning about the actual world given evidence; subjunctives are for exploring non-actual possibilities. The probability logic differs (conditionalization vs. imaging).
  *   **Follow-up:** "But we can embed them together: 'Either if he did it, he's guilty, or if he had done it, he would have been caught.' If one half of that disjunction is a proposition and the other isn't, how does the 'Either/Or' bind them without a type mismatch?"

  ### 7. Communication and Common Ground
  **Question:** "Stalnaker's model of conversation relies on updating the 'common ground'—a set of shared possible worlds. If I assert a conditional and you accept it, what exactly are we adding to the common ground? If it's not a set of worlds where the conditional is true, are we just aligning our dispositions to update?"

  *   **Likely Answer:** She will say we are aligning our "conditional beliefs" or updating a constraint on how the common ground *should* be revised in the future, rather than shrinking the ground now.
  *   **Follow-up:** "Doesn't that make communication much thinner? If we aren't sharing content, just coordinating update rules, how do we explain the intuition that I can *inherit* your knowledge of a conditional via testimony?"

  ### 8. Dynamic Updates
  **Question:** "Let's press on that testimony point. If I tell you 'If A, B,' and you trust me, you raise your conditional probability $P(B|A)$. But suppose you later learn $A$ is true. You then believe $B$. Did the conditional *cause* you to believe $B$, or did it just license the move? If it has no truth conditions, it seems like it can't be a premise in the causal explanation of your belief."

  *   **Likely Answer:** She will argue it licenses the move. It's a rule of inference, not a premise. The cause is your learning of $A$ combined with your pre-existing disposition.
  *   **Follow-up:** "But if it's just a rule, why can it be the conclusion of an argument? I can argue *for* a conditional. 'Given the physics, if you drop it, it will fall.' Rules aren't usually things we prove true."

  ### 9. Truth-Value Gaps vs. No-Truth
  **Question:** "Some philosophers try to split the difference: conditionals *can* be true or false, but they have truth-value gaps when the antecedent is false. This preserves some compositionality. Why is your 'no-truth-conditions' view superior to a gap view? Is it just because gaps still run into triviality results if you're not careful?"

  *   **Likely Answer:** She will argue that gap views still struggle with embeddings (what is the negation of a gap?) and that they don't fully capture the suppositional nature of the judgment. The triviality results often extend to partial truth-conditional accounts too.
  *   **Follow-up:** "So on your view, when the antecedent is false, I'm not just failing to express a truth; I'm expressing something that literally *cannot* be true. Is there any sense in which a conditional with a false antecedent is 'correct' other than it being assertable?"

  ### 10. Jackson's Robustness Dodge
  **Question:** "Finally, I want to end on Frank Jackson. He argued we *can* keep truth conditions for indicatives—they're just material implications—but we need a separate rule of assertability: you only assert it if the conditional probability is high (robustness). Is Jackson's view a genuine rival to yours, or is it just your view wearing a truth-conditional costume? If the assertability conditions do all the work, what theoretical labor is the material implication truth condition actually doing?"

  *   **Likely Answer:** She will likely say it's a redescription. The truth conditions are "idle wheels" because we never assess the conditional based on them (since we rarely know the antecedent is false and the consequent true in the relevant way).
  *   **Follow-up:** "If they are idle wheels, why keep them? Is it just to preserve classical logic, or is there a philosophical anxiety about having sentences that can't be true? If we drop the costume, do we lose anything real, or just the comfort of bivalence?"
