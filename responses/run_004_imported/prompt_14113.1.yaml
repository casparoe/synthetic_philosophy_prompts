answer: |-
  **The Tax on Existence: Reconsidering Du Bois's "Propaganda"**

  The line has become a tombstone for W. E. B. Du Bois's aesthetic theory: "Thus all Art is propaganda and ever must be." It is quoted to dismiss him as a moralist who sacrificed the Harlem Renaissance on the altar of respectability, or to claim him as a forefather of social realism who cared little for form. But as you have noted, this citation is a truncation. It ignores the triad Du Bois establishes immediately prior: that the apostle of Beauty in the Black world must also be the apostle of Truth and Right. To read Du Bois charitably—and rigorously—we must understand that he is not arguing that art *should* be propaganda in the sense of crude agitation. He is arguing that, for the Black artist in 1926 America, the condition of neutrality required for "pure" art does not exist.

  To reconstruct the strongest version of Du Bois's argument, we must strip away the modern connotation of "propaganda" as synonymous with "lies" or "bad art." For Du Bois, propaganda is simply the persistent effort to shape public opinion toward a specific end. His claim is ontological, not just instructional. In a society where Black humanity is systematically denied, caricatured, or erased, the act of representing Black life truthfully is inherently an act of correction. If the default cultural setting is anti-Black, then a neutral depiction of Black joy, intellect, or sorrow registers as a disruption. Therefore, the pursuit of Beauty (the accurate, resonant depiction of life) inevitably collides with the status quo. To pursue Beauty is to pursue Truth; to pursue Truth about Black life is to pursue Right; and to pursue Right in a racist state is to engage in propaganda.

  Du Bois is not fusing two distinct concepts illegitimately; he is identifying a structural reality. He would answer the charge of equivocation by pointing to the reception of the work, not just the intent. A white poet writing about a sunset is allowed to be universal. A Black poet writing about a sunset is read through the lens of their race. If the poem implies the Black poet has the interiority to appreciate a sunset, it challenges the prevailing taxonomy of the era. Thus, the "propaganda" is not necessarily in the text's message, but in the text's *existence*. Du Bois argues that because the world refuses to let the Black artist be merely an artist, the artist must weaponize their beauty to secure the right to create it. The propaganda is the shield that allows the Beauty to survive.

  However, this logic faced a formidable objection from within the very circle Du Bois was addressing. The same year Du Bois delivered "Criteria," Langston Hughes published "The Negro Artist and the Racial Mountain." Hughes's essay is the perfect counterweight because it accepts Du Bois's premise—that race is central—but rejects his conclusion on the duty of the artist. Hughes writes of the desire "to express our individual dark-skinned selves without fear or shame." He explicitly distances himself from the "old whisperings" of respectability and the demand to uplift the race. For Hughes, the demand that art serve "Right" (as defined by the NAACP or the Black bourgeoisie) is a cage that prevents the artist from reaching the Truth. If the Truth is that some Black people are messy, vulgar, or apolitical, then Du Bois's demand for "Right" forces the artist to lie.

  Hughes's objection strikes at the weak point of Du Bois's triad. Du Bois assumes that Truth and Right are harmonious—that showing the truth of Black life will naturally align with the moral good of the race. Hughes suspects they might conflict. If the "propaganda" requires portraying Black people as exemplary to counter white stereotypes, it forbids portraying them as complex. Hughes argues that by making art a tool for racial defense, Du Bois inadvertently accepts the white supremacist premise that Black art must answer to white judgment (or white-defined standards of dignity). For Hughes, true Beauty requires the freedom to be irrelevant to the political struggle, because only in that freedom is the artist fully human.

  So, who is right? Does Du Bois's claim hold up, or is it a strategic equivocation that chokes the very art it seeks to defend?

  The verdict requires us to separate Du Bois's universal claim from his sociological one. As a universal aesthetic theory—"All Art is propaganda"—Du Bois is wrong. There is art that exists in the realm of play, formalism, or private ecstasy that resists political instrumentalization without complicity. To claim otherwise is to flatten the human experience into a political binary.

  However, as a specific claim about the condition of Black art in 1926 (and arguably today), Du Bois is right, though for a more precise reason than the slogan suggests. He is right that "Art for Art's Sake" is a luxury good, accessible only to those whose humanity is not under interrogation. Hughes's desire to stand "outside" the propaganda machine was a genuine artistic impulse, but Du Bois correctly identified that the market and the audience would not allow Hughes to stand there. A poem by Hughes about jazz was read as a statement on Black primitivism or Black vitality; it was never *just* a poem.

  Therefore, the precise claim buried inside the slogan is this: **In an unjust society, the truthful depiction of a marginalized humanity is indistinguishable from political agitation.**

  Du Bois is not saying artists *must* write pamphlets. He is saying that because the world treats Black existence as a political problem, Black art is treated as a political statement regardless of the artist's intent. The "propaganda" is the tax levied on the Black creator by a hostile audience. Du Bois's error was not in identifying the tax, but in suggesting the artist should willingly collect it. He mistakes the *reception* of the art (which is political) for the *obligation* of the art (which should be aesthetic).

  Yet, in the context of your novel, Du Bois holds the stronger philosophical ground regarding the *consequences* of the work. Hughes offers a philosophy of creation; Du Bois offers a philosophy of survival. If the Black artist ignores the "propaganda" element—the defense of the race's dignity—they risk having their Beauty consumed as exoticism or their Truth consumed as confirmation of bias. Du Bois binds Beauty to Right not to constrain the artist, but to arm them. He understands that without the armor of "Right," the "Beauty" of Black art will be looted by a culture that loves Black rhythm but lynches Black bodies.

  Ultimately, Du Bois's slogan survives not as a rule for making art, but as a description of the field upon which it is made. He is right that the Black artist cannot escape the political, because the political has not escaped them. The tragedy of the debate is that both men were right: Hughes was right that the demand for propaganda can kill the spirit of the work, but Du Bois was right that the absence of that defense can leave the work—and the people it represents—undefended. The "propaganda" is not the content; it is the cost of admission. Du Bois deserves credit for refusing to pretend the price wasn't due.
