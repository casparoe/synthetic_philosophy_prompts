          4.  Defend the Bass/Nature analogy (Hierarchy of Vibration).
          5.  Conclusion/Summary.
      *   *Key Concept to Introduce:* "Isomorphism" (structural similarity). This is the modern term for what Schopenhauer is fumbling toward.
