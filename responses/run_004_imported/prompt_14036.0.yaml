  *(Self-Correction on "Time"):* Wait, Schopenhauer says Ideas are outside time. Music is *in* time. How does Music copy the timeless Will? Because the *structure* of the music (harmony) is timeless math, even if the performance is temporal. The *melody* represents the temporal striving. I need to make sure I distinguish between Harmony (static hierarchy) and Melody (dynamic striving).

