      *   **Setting:** A public park with a newly mounted military vehicle on a plinth (war memorial), violating an old "no vehicles in the park" ordinance.
      *   **Constraint 3:** Specific Argumentation:
          *   Positivist opens with Hart's *core/penumbra* distinction (memorial is a hard case/penumbra, judge uses discretion, separability holds).
          *   Natural Lawyer answers with Fuller's *purpose/reasoning* rejoinder (identifying the core *also* requires purpose, so evaluation is central, not marginal).
          *   Characters must respond to specific moves, not just restate general positions.
      *   **Constraint 4:** Ending: Each side concedes one point that costs them something, but they still disagree on which theory the case vindicates.

  2.  **Character Conception:**
      *   **Positivist (Hartian):** Let's call her "Elena." She values clarity, rule-recognition, and the distinction between what the law *is* and what it *ought* to be. She sees the judge's role in hard cases as legislative-like discretion.
      *   **Natural Lawyer (Fullerian):** Let's call him "Marcus." He values the "internal morality of law," purpose, and the idea that law is a purposive enterprise. He sees interpretation as inherently moral/purposive.

  3.  **Drafting - Section by Section:**

      *   **Setting the Scene:** Needs to be immediate. They are looking at the tank/vehicle.
      *   **Opening (Elena/Hart):** She needs to invoke the "No Vehicles in the Park" example directly. She needs to argue that while a car is clearly a vehicle (core), a memorial tank is not (penumbra). Therefore, the judge has discretion. This discretion doesn't mean law *is* morals, just that rules run out.
      *   **Response (Marcus/Fuller):** He needs to challenge the "core." Why is a car a vehicle in the *forbidden* sense? Because of the purpose (safety, quiet). Does the tank threaten that? If the purpose is safety, a static tank is fine. If the purpose is aesthetics/peace, maybe not. The point: You can't identify the core without asking "What is this rule *for*?" which is an evaluative question.
      *   **Counter-Response (Elena):** She needs to defend the separability. Even if we look at purpose, the *source* of the rule is social fact, not moral truth. The judge isn't finding a pre-existing moral truth; she's making a choice.
      *   **Counter-Response (Marcus):** He needs to press that the choice isn't arbitrary. It's constrained by the integrity of the legal system. Law isn't just commands; it's a way of subjecting human conduct to rules.
      *   **The Concessions (The Tricky Part):**
          *   *Elena's Concession:* She must admit that the "core" isn't as linguistically self-evident as Hart sometimes implied. Context matters. This weakens the strict "plain meaning" defense.
          *   *Marcus's Concession:* He must admit that even if purpose is key, there isn't always *one* right moral answer derived from the law. Sometimes the judge *does* have to legislate, which risks the "internal morality."
      *   **The Conclusion:** They look at the tank. One thinks the positivist view explains the judge's burden better; the other thinks the natural law view explains the judge's *duty* better.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I make the "core/penumbra" argument clear? *Yes, Elena starts with the ambulance/car vs. tank distinction.*
      *   *Check:* Did I make Fuller's "purpose" argument clear? *Yes, Marcus argues that "vehicle" depends on the mischief the rule aims to prevent.*
      *   *Check:* Are they talking past each other? *Need to ensure Elena responds to the "purpose" point, not just repeats "separability."*
      *   *Check:* The concessions. *Elena admits language isn't self-defining. Marcus admits discretion exists but frames it differently.*

  5.  **Drafting the Dialogue (Iterative Process):**

      *   *Scene:* Autumn leaves, the tank on the plinth.
      *   *Elena:* "Look at that. Classic penumbra." Explains the rule. Car = core. Tank = penumbra. Judge decides based on policy, not existing law.
      *   *Marcus:* "But how do you know the car is the core?" It's not the word 'vehicle'; it's the *reason* for the ban. Noise? Safety? If it's noise, a tank on a plinth is fine. If it's 'no symbols of war,' it's banned. You're doing moral reasoning to find the core, not just the penumbra.
      *   *Elena:* "Okay, but that purpose is a social fact about the legislature's intent, not a moral truth."
