      *   *Elena:* "That sounds like Dworkin, not Fuller. Stick to Fuller." (Wait, keep it to Hart-Fuller 1958 specifics). Fuller's point is about the *function* of law.
      *   *Revised Marcus:* Focus on the "internal morality." If we treat the rule as blind command, we fail the citizens' reliance.
      *   *Concessions:* Elena admits the "core" relies on context (costs the "plain meaning" certainty). Marcus admits the "purpose" doesn't always yield a single answer (costs the "one right answer" implication).

  6.  **Polishing the Concessions:**
      *   Elena: "I'll grant that the 'core' isn't purely linguistic. It relies on a shared understanding of the rule's aim." (This concedes that facts alone don't fix meaning).
      *   Marcus: "I'll grant that the purpose doesn't always speak clearly. Sometimes the judge *must* choose, and that choice isn't found in the law." (This concedes that law doesn't cover every case morally).
      *   Final disagreement: Elena says this proves law runs out (Positivism wins). Marcus says this proves law requires moral fidelity to function (Natural Law wins).

  7.  **Final Review against Constraints:**
