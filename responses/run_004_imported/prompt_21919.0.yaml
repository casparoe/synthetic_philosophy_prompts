answer: |-
  **Setting:** *A city park on a crisp October afternoon. Golden leaves scatter the grass. In the center of the lawn, a decommissioned armored personnel carrier sits atop a concrete plinth, freshly installed by a veterans' group. A plaque reads "Lest We Forget." Nearby, a signpost cites Municipal Ordinance 404: "No vehicles permitted in the park." Two legal theorists, ELENA (a Hartian positivist) and MARCUS (a Fullerian natural lawyer), stand before the tank.*

  **ELENA:** It's a perfect illustration, Marcus. Look at it. Ordinance 404 says "no vehicles." If a standard sedan tried to drive through that gate this morning, the core meaning of the rule would catch it immediately. No debate needed. But this? A static monument? This falls squarely in the penumbra. The language runs out.

  **MARCUS:** And that is where Hart thinks the judge steps in with a legislative discretion, correct? To decide based on social aims, not legal rules?

  **ELENA:** Precisely. In the core cases, the law is certain. We separate what the law *is* from what it *ought* to be. The rule exists as a social fact. But in the penumbra, the rule doesn't dictate an outcome. The judge must weigh the value of remembrance against the value of a quiet park. That discretion doesn't threaten the separability thesis. It just acknowledges that rules are general terms applied to specific facts. Sometimes they don't fit.

  **MARCUS:** But Elena, you're assuming you've identified the "core" without doing the very work you claim is only necessary in the "penumbra." How do you know a sedan is in the core of the prohibition?

  **ELENA:** Because it's a vehicle. It has an engine, wheels, it transports people. It fits the ordinary definition.

  **MARCUS:** Ordinary for what purpose? That is the question Hart sidestepped. If the purpose of Ordinance 404 is to prevent noise, a sedan is prohibited, but an electric golf cart might not be. If the purpose is to prevent danger to pedestrians, a parked sedan might be fine, but a speeding bicycle is not. If the purpose is to preserve the park's pastoral aesthetic, then this tank is a far greater violation than a silent electric car.

  **ELENA:** So you're arguing purpose determines the extension of the word.

  **MARCUS:** I'm arguing that *purpose determines the core.* You cannot identify the clear cases—the "core"—without first reasoning about the rule's aim. And reasoning about the aim is an evaluative act. You have to decide what the law is *for*. If you have to evaluate the purpose to find the core, you haven't cordoned off moral or purposive reasoning to the margins. It's central to the whole enterprise.

  **ELENA:** I grant that we look to purpose to resolve ambiguity. But the source of that purpose is a historical fact about the legislature's intent, not a moral truth waiting to be discovered. We are looking for what they *did* decide, not what they *should have* decided. In the penumbra, like with this tank, the historical intent runs dry. The legislature didn't think about war memorials. So the judge *must* go beyond the law. That is the moment of separation. The law ends; policy begins.

  **MARCUS:** But if the judge treats this as "going beyond the law," she treats the ordinance as a mere command, a one-way projection of authority. That undermines the reciprocity required by the internal morality of law. Citizens follow rules because they trust the rules are coherent and purposive. If the judge says, "The rule doesn't cover this, so I will make a new policy," she breaks that trust. She must interpret the ordinance in light of the broader legal system's commitment to fairness and coherence. That isn't "going beyond the law"; it's fulfilling the conditions that make law possible.

  **ELENA:** That sounds like you're conflating the *efficacy* of the law with its *existence*. A bad judge can still apply a valid law. If the judge decides to allow the tank because she values patriotism over quiet, she is making a moral choice. I want to call that what it is: a moral choice, not a legal deduction. If we call it legal deduction, we obscure the fact that she could have decided otherwise without violating the text.

  **MARCUS:** And I want to call it what it is: a judgment about what fidelity to the legal order requires. It's not arbitrary. She isn't free to choose based on her whim. She is constrained by the need to make the ordinance the best example of a general rule it can be.

  **ELENA:** *(Pauses, watching a child run past the tank)* Alright, Marcus. I will concede this: You have shaken my confidence that the "core" is purely linguistic. I admit that even identifying a sedan as a prohibited vehicle relies on an imputed purpose, not just a dictionary definition. The "plain meaning" is not as self-evident as Hart sometimes implied. Context and aim are required to fix the meaning even in clear cases.

  **MARCUS:** *(Nods)* And I will concede this: Even if we agree that purpose is central, the purpose of Ordinance 404 does not yield a single, morally necessary answer regarding this tank. One could reasonably argue the purpose is "safety," which allows the tank. Another could argue it is "tranquility," which bans it. The materials do not force one outcome. So, I grant that there is a moment of choice that is not fully determined by the existing legal materials.

  **ELENA:** Then we are back to where I started. If the materials don't force an outcome, the judge has discretion. And if she has discretion, she is legislating. That vindicates the positivist view: Law has limits, and where law stops, human choice begins. The tank case proves the separability of law and morals because the law *cannot* tell us what to do here.

  **MARCUS:** On the contrary. The fact that the materials don't force an outcome proves that law is not a mechanical system of rules, but a purposive enterprise. The judge's duty isn't to find a gap and fill it with policy; it is to exercise the discretion *in a way that respects the internal morality of the system.* The tank case vindicates the natural law view because it shows that applying the law *requires* a moral judgment about the rule's function to even identify what the law is. The choice isn't outside the law; it's the deepest part of legal reasoning.

  **ELENA:** *(Smiles faintly)* So, you see a judge doing moral work and call it law.

  **MARCUS:** And you see a judge doing legal work and call it morals.

  **ELENA:** It seems the tank isn't going anywhere.

  **MARCUS:** No. And neither are we.
