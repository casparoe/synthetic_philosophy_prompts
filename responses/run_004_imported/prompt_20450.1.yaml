answer: |-
  Here are 10 interview questions tailored for your decision theory podcast. They are structured to drill into the mechanical weaknesses of the surrogate goals framework without getting bogged down in definitions.

  I have included the three required thematic blocks (Flat Precommitment, Threatener Intelligence, Regress) with their specific follow-ups, plus two additional questions on implementation risks and the final required question on transparency.

  ### Part 1: Surrogate Goals vs. Flat Precommitment

  **1.** "Let's start with the baseline alternative. In standard Functional Decision Theory, the move against blackmail is usually an updateless precommitment to simply *never pay*, regardless of the threat. If I successfully precommit to 'never pay ransom on my actual values,' the threatener has no leverage. What specific leverage does introducing a *surrogate* goal buy me that a blanket 'never pay' policy doesn't? Why is the detour necessary?"

  **2. (Follow-up)**
  *Context: She will likely argue that 'never pay' isn't credible if the stakes are high enough, whereas a surrogate makes the payment action credible but harmless.*
  "If the issue is credibility—meaning the threatener doesn't believe I'd actually burn the world to avoid paying—doesn't installing a surrogate goal just kick the can? Now I have to make it credible that I'll pay *for the surrogate*. If I'm capable of making that payment credible, why wasn't I capable of making the 'never pay on real values' commitment credible in the first place? Does the surrogate actually solve the credibility problem, or just hide it behind a fake value?"

  ### Part 2: Threatener Intelligence & Source Code Reading

  **3.** "Let's look at the adversary. We're talking about threateners capable of acausal simulation—entities that can essentially read your source code or run high-fidelity predictions of you. If they can see my source code, can't they see that my valuation of the surrogate is purely instrumental? If they see the line of code that says `if threatened_about(S): pay`, don't they also see the comment above it that says `// S is fake`? Why wouldn't a smart threatener just route around the scheme and threaten the real values anyway?"

  **4. (Follow-up)**
  *Context: She will likely argue that the threatener only cares about predicted behavior, not internal ontology.*
  "I buy that they care about behavior, but in acausal contexts, *why* I behave a certain way matters for logical correlation. If my payment on the surrogate is driven by a fragile, instrumental hack rather than a robust terminal value, doesn't that make my behavior more sensitive to edge cases? If the threatener sees my commitment to the surrogate is 'shallower' than my commitment to real values, can't they construct a threat that targets the *gap* between my instrumental hack and my actual utility function?"

  ### Part 3: The Regress Problem

  **5.** "There's a classic objection here about common knowledge. Once 'Surrogate Goals' becomes a known defense strategy in the acausal marketplace, doesn't the threat model just shift up a level? Why wouldn't a threatener simply threaten to destroy the *mechanism* that enforces the surrogate goal? Or threaten 'The Surrogate OR anything you value'? It seems like this invites an infinite regress where I have to mint surrogates for my surrogates forever."

  **6. (Follow-up)**
  *Context: She will likely argue that regress is a generic problem for any threat-resistant policy, not unique to surrogates.*
  "Sure, regress is a generic issue, but isn't it *worse* here? With a flat 'never pay' policy, the attack surface is static: they threaten what I value. With surrogate goals, I'm actively broadcasting a secondary attack surface. By minting a surrogate, haven't I effectively increased the number of things I'm willing to negotiate over? Compared to flat resistance, doesn't this strategy actually *increase* my exploitable surface area by signaling that I am capable of being blackmailed, just on a different topic?"

  ### Part 4: Implementation & Risk

  **7.** "To make this work, I have to convince myself—or my code—to care about this surrogate. But humans and neural nets are prone to wireheading or value drift. Is there a risk that by spending computational or cognitive resources simulating care for the surrogate, I accidentally internalize it? Could I wake up in five years and actually value the surrogate more than my original goals, effectively blackmailing myself?"

  **8.** "This defense seems to rely on coordination or at least asymmetric information. If I adopt surrogate goals but my competitors or rival AIs don't, am I at a disadvantage? If everyone else is playing 'flat resistance' and I'm playing 'surrogate deflection,' does that signal weakness? Does adopting this strategy require a community-wide standard to be safe, or does it work in isolation?"

  ### Part 5: Transparency & Boundedness (Required Final Question)

  **9.** "Finally, I want to touch on the substrate. This framework seems to assume a level of self-transparency that bounded agents might not have. It assumes I can inspect my own source code, identify my true values, and surgically install a fake vulnerability without affecting the rest of the system. But humans are opaque, and even trained neural nets are black boxes. If I can't verify my own precommitments with 100% fidelity, can the threatener? Or does the whole scheme collapse because neither of us can actually prove the surrogate is 'fake' or 'real'?"

  **10.** "Given that opacity, where does the research go from here? Do we need new tools for self-verification before we can even attempt surrogate goals, or is this a strategy that's only viable for future, fully legible AGIs, meaning it's useless for us right now?"
