  2. Move 1: Miriam wins on data, leaps on conclusion.
  3. Move 2: Colin introduces valid hypothesis, but ontological cost.
  4. Move 3: Miriam cites Hacking/IGF. Strong philosophical move, but applicability is the hinge.
  5. Move 4: Colin distinguishes OSE. This is the clincher in standard literature.
  6. Missing: Roger White's "This Universe" objection, Multiverse Generator tuning, Bayesian Priors.
  7. Verdict: Colin wins the specific debate, Miriam wins the war on "ultimate explanation."

