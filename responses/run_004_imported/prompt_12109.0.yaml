answer: |-
  "Schaffer's major and sergeant case is still keeping me up," Lena said, stirring her coffee. "You'd think trumping preemption would be your playground, Will. Manipulations seem tailor-made for hierarchy."

  Will leaned back. "It is, mostly. But don't pretend it's clean. Set up the structural equations: $M$ for Major's order, $S$ for Sergeant's, $A$ for Advance. The function is $A = M$ if $M$ is present, else $S$. I intervene on $M$, $A$ changes. I intervene on $S$ holding $M$ fixed, $A$ stays put. Verdict: Major causes, Sergeant doesn't. Matches intuition."

  "Matches intuition because you built the verdict into the function," Lena countered. "You specified the structural equation to reflect the ranking rule. But causation is supposed to explain the ranking, not be defined by it. If I ask *why* the Major's order trumps, saying 'because the equation says $M$ overrides $S$' looks like you're smuggling the causal structure into the model specification. You're assuming what you're trying to test."

  "Model specification is always theory-laden," Will said. "But the constraint is modularity. Can I intervene on $S$ independently? Yes. Does it change $A$ when $M$ is present? No. That's an empirical claim about the soldier's psychology, not a definition. The equation just captures the invariant relationship. What's your move? Simple counterfactual dependence fails outright. If the Major hadn't ordered, the Soldier still advances because of the Sergeant. No dependence, no causation. That was the 1973 Lewis verdict, and it was wrong."

  "True, early Lewis struggles here," Lena admitted. "That's why he moved to 'influence' in 2000. We don't look for whether the effect occurs, but whether the *manner* of the effect depends on the cause. The Major's order influences the timing, the precise manner of the advance. If the Major had whispered 'advance slowly,' the Soldier advances slowly. The Sergeant's order is screened off; it doesn't influence the manner because the mechanism is locked onto the Major."

  "But in Schaffer's case, the orders are identical," Will pressed. "Both shout 'Advance!' simultaneously. The processes merge perfectly. There's no difference in manner, timing, or degree. Where's the influence? You have to fracture the event into ultra-fine grained fragments to find a difference. That feels like gerrymandering the event identity to save the theory."

  "Is it worse than gerrymandering the structural equation?" Lena shot back. "To save interventionism, you have to insist the variable set is $\{M, S, A\}$ and not, say, $\{Rank, Order, A\}$. If you include Rank as a common cause, suddenly $M$ and $S$ are just symptoms. You have to argue why the intervention on $S$ is 'surgical' and doesn't mess with the ranking protocol. If I intervene on the Sergeant's order, do I hold the ranking structure fixed? If yes, you've presupposed the trumping. If no, the intervention might change who outranks whom."

  "That's a valid worry about variable selection," Will conceded. "But Woodward allows that. We need the 'right' variables. The test is whether the relationship holds under interventions. The soldier's disposition is to obey rank. That's a stable capacity. Your similarity metric is the black box here. To get the Major as cause, you need a world where the Major doesn't order but the Sergeant does to be 'closer' than a world where neither orders. But if the laws include 'obey rank,' a world where the Major stays silent might require a miracle about the chain of command. You're tweaking similarity weights to get the result you want."

  "Lewis admits the weights are context-sensitive," Lena said. "But look, even with influence, trumping is the hard case. It forces us to say causation isn't just about energy transfer or dependence, it's about the *structure of determination*. Your equations make that structure explicit. Mine have to recover it from modal space. But if I concede influence is strained here, you have to concede that your 'intervention' on the Sergeant is counterpossible. You're asking: what if the Sergeant ordered differently, given the Major ordered? But the scenario says they order simultaneously. You're breaking the scenario's setup to test the causation."

  "I'm testing the capacity," Will corrected. "The capacity exists even if not exercised. The Sergeant's order *would* cause the advance if the Major were absent. That's why it's preemption, not overdetermination. My framework handles the switch. Yours needs chains of dependence that vanish right before the effect. You're relying on the idea that the Major's process is 'more complete.' But in trumping, both processes are complete up to the merge. The Sergeant's signal reaches the soldier. It's just ignored."

  "Exactly," Lena said. "It's ignored. That's a normative or structural fact, not a physical one. Your interventionism handles the structure well, I'll give you that. But don't pretend the model didn't do the heavy lifting. I still think there's a counterfactual story about the *process*—if the Major's order hadn't arrived, the mechanism wouldn't have locked onto that signal. But specifying the mechanism without using your equations... that's where the similarity metric gets sweaty."

  "Then we agree it's the hard case," Will said, finishing his coffee. "For me, it's variable selection. For you, it's event fragility. Neither of us gets a free pass."

  "Next week I'm making the students suffer through it," Lena said. "If they can feel why we're both squirming, maybe they'll stop reciting slogans."

  "Good luck," Will smiled. "Let me know if they side with the Sergeant."
