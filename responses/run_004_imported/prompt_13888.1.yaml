answer: |-
  **Draft for a Treatise on the Static Instant**

  I have devoted the better part of three lustra to the compilation of the *Index of Perceptual Atoms*, a work whose sole purpose is to demonstrate the discontinuity of experience. The thesis is simple, though its ramifications are vertiginous: if the self is merely a bundle of perceptions, as the Scotsman Hume suggested, and if matter exists only insofar as it is perceived, as Berkeley argued, then there is no substrate upon which time might flow.¹ There is no river, because there is no bank, and no water, and no one to drown. There is only the instant, perfect and hermetic, succeeded by another instant entirely unrelated to the first. Memory is the forgery that links them; it is a bridge built over an abyss that does not exist.

  To prove this, I constructed a laboratory of sorts in the basement of the municipal library. I isolated myself from all clocks, from the sun, from the irregular rhythm of human speech. I recorded my thoughts in discrete entries, each separated by the ringing of a bell. Entry 4,092: *I see a dust mote suspended in a shaft of light.* Entry 4,093: *I hear the bell.* Entry 4,094: *I feel an ache in the left knee.* There is no logical necessity that the "I" who saw the dust mote is the same "I" who hears the bell. They are separate consciousnesses, inheriting a false history via the mechanism of memory.² I was triumphant. I had solved the paradox of succession. I had locked time out of the room.

  And yet.

  There is a mirror in the vestibule of the library, a tall, silvered glass framed in dark wood that has stood there since the building's inauguration in 1910. Occasionally, when I ascend from the basement to procure books, I catch my reflection in passing. The man in the mirror is aging. His hair recedes; his skin sags around the jawline; there are new lines etched around the eyes that were not present in Entry 1,000. Logically, I know this is impossible. If there is no continuous self, there is no one to age. The face in the mirror belongs to a stranger who happens to share my current perceptual bundle. It is a series of masks, not a decay.

  But yesterday, while waiting for the rain to cease so I might walk to the corner shop for tobacco, I felt a sensation that my philosophy cannot account for. It was not pain, precisely, but anticipation. I looked at the gray sky and I *waited*. I desired the rain to stop not for the sake of the instant, but for the sake of a future instant where I would be dry.³ This implies a belief in succession. It implies that I expect to persist into the next moment.

  I returned to the basement and reviewed my proofs. They remain flawless. The logic holds. Time is a semantic error; the self is a grammatical fiction. We are trapped in a labyrinth of mirrors, each reflecting only itself, infinite and empty. And yet, as I sit here now, listening to the clock on the wall—a clock I promised myself I would ignore—I feel the seconds not as a logical category, but as a physical weight. They press against my temples. They consume the air in the room. I understand perfectly that the tiger is an illusion, but I feel its teeth all the same.

  The world is false. I am a fiction. Unfortunately, the rain is still falling, and I am still waiting for it to stop.

  ***

  ¹ *This ignores, of course, the objections of Schopenhauer regarding the Will, but Schopenhauer was a poet masquerading as a metaphysician and his objections are merely musical.*
  ² *See: "The Architecture of Forgetting," by Pierre Menard. Although Menard claimed to have written this without reading the original, the correlation is suspicious.*
  ³ *It is curious that hope is always prospective, while regret is retrospective. Both are admissions of guilt regarding the existence of time.*
