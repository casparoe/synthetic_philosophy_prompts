      *   *Tone:* Analytical, philosophical, fair to both sides but decisive on the Kantian mechanics.
      *   *Key Concepts to weave in:* Contradiction in Conception (CIC), Contradiction in Will (CIW), Maxim Description Problem, Formula of Humanity.

      *(Self-Correction during drafting)*: Make sure I don't just say "Cheating is bad." I need to stick to *Kantian mechanics*. Devon's argument is technically about *Conception*, not *Will* or *Consequences*. I need to be precise about why his "no contradiction in conception" claim is wrong.
