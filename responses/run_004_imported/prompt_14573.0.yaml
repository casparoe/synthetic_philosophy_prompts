answer: |-
  Here are ten interview questions designed for a podcast context, blending your perspective as a novelist with rigorous metaphysical inquiry. Each includes a follow-up tailored to the standard defensive moves a Lewisian modal realist typically makes.

  ### 1. The Theoretical Price Tag
  **Question:** David Lewis argues that we should accept Genuine Modal Realism because it provides unparalleled theoretical utility for semantics, logic, and science. As a novelist, I create worlds to serve a narrative; Lewis accepts them to serve a theory. Do you view the existence of these concrete worlds as a *discovery* necessitated by logic, or is there a sense in which you are willing to *pay* an ontological price simply because it makes the math of philosophy work out neatly?

  **Follow-up:** (Most likely answer: She will argue it is a discovery necessitated by our best theories, following Quine.) If it is a discovery driven by theory, where do you draw the line? If positing "impossible worlds" helped our semantics for fiction even more than possible worlds do, would you be willing to pay that ontological price too, or is concreteness a hard stop?

  ### 2. The Incredulous Stare
  **Question:** Lewis famously addressed the common reaction to his theory as the "incredulous stare," dismissing it as having no argumentative weight—mere prejudice of the actual. However, as a writer, I rely on intuition to gauge what feels "real" to a reader. Do you agree with Lewis that this intuition is theoretically inert, or does the sheer visceral resistance to modal realism suggest we might be making a category error in how we define "existence" itself?

  **Follow-up:** (Most likely answer: She will agree with Lewis that common sense is not a reliable guide to fundamental ontology.) If common sense is unreliable here, is it reliable anywhere? If we must override our deepest intuitions about reality to accept modal realism, does that isolate philosophy from the very human experience it claims to explain?

  ### 3. Causal Isolation and Knowledge
  **Question:** A core tenet of Lewis's view is that these worlds are spatiotemporally isolated; we cannot interact with them. Yet, we seem to have knowledge of them (e.g., "I could have missed the bus"). If there is no causal chain between me and that other world, how do I have epistemic access to it? Are we doing metaphysics, or are we essentially doing a kind of creative mathematics?

  **Follow-up:** (Most likely answer: She will argue that we know them via theoretical posits and the success of the theory, similar to mathematical objects.) If our access is purely theoretical, like mathematics, does that undermine the claim that these worlds are *concrete*? Doesn't "concrete" imply a capacity for interaction that you are explicitly denying?

  ### 4. Robert Adams and the Ethics of Actuality
  **Question:** Robert Adams objected that if all worlds are equally real, an indexical analysis of "actuality" cannot explain why the suffering in *this* world should matter to us more than equally real suffering elsewhere. If a child suffers in a distant possible world just as concretely as one here, does your defense of modal realism force you to admit that our moral concern for "actual" suffering is merely a form of tribalism?

  **Follow-up:** (Most likely answer: She will defend the indexical view, arguing "actual" is like "here," and we are naturally more concerned with what is "here.") If morality is indexical in that way, does it lose its objective force? If I can say "Suffering is bad, except in worlds that aren't *here*," haven't we reduced ethics to a preference for location rather than a universal principle?

  ### 5. Counterpart Theory and Regret
  **Question:** Lewis denies transworld identity; I don't exist in other worlds, only my counterparts do. When I feel regret—"I could have been a better person"—Lewis says I am mistaken; a *different* person is better in another world. Does this drain the emotional significance from our modal thoughts? Why should I care about my counterpart's success if it isn't, strictly speaking, *my* possibility?

  **Follow-up:** (Most likely answer: She will argue that counterpart relations preserve enough similarity to ground our attitudes.) If the relation is based on similarity, isn't that a matter of degree? At what point does the counterpart become so dissimilar that my regret becomes irrational? Does this make personal identity much more fragile than we experience it?

  ### 6. Fiction, Inconsistency, and Worldhood
  **Question:** Lewis's semantics for fiction analyzes what is "true in the story" via similarity among worlds. But as a novelist, I sometimes write things that are logically inconsistent or radically underdescribed. If a genuine Lewisian world must be consistent, does an inconsistent novel fail to pick out a world at all? Or does this push you toward the "fragmentation" move Lewis used for contradictory stories, where we look at different worlds for different parts of the text?

  **Follow-up:** (Most likely answer: She will likely accept fragmentation or admit that inconsistent fictions do not describe single possible worlds.) If we must fragment the world to accommodate the story, doesn't that suggest the "world" of the fiction is a mental construct rather than a concrete reality? Does this inadvertently support the view that fictional worlds are abstract artifacts rather than Lewisian concrete entities?

  ### 7. The Novelist as Explorer
  **Question:** If all possible worlds already exist concretely, does that change the nature of my profession? Am I an *inventor* bringing something new into being, or merely an *explorer* mapping territory that is already there? If it's the latter, does that mean there is a "true" version of my novel's world that I am trying to find, rather than create?

  **Follow-up:** (Most likely answer: She will likely say you are exploring/describing, not creating.) If I am merely describing, does that constrain artistic freedom? If I write a story that turns out to be metaphysically impossible, have I failed at my job, or have I simply failed to refer to anything real?

  ### 8. Probability and Measure
  **Question:** In Lewis's system, all worlds are equally real. However, we speak of some events as more "probable" than others. If every possibility is actualized somewhere, how do you make sense of probability without assigning different degrees of "reality" to different worlds? Does Lewis's solution regarding the cardinality of counterparts feel sufficient to you?

  **Follow-up:** (Most likely answer: She will defend the counterpart cardinality account of probability.) Does counting counterparts really capture the *feeling* of chance? If there are infinite worlds where I win the lottery and infinite where I lose, does the ratio of counterparts truly explain why I shouldn't expect to win?

  ### 9. Abstract vs. Concrete
  **Question:** Critics often argue Lewis is conflating abstract representations with concrete reality. What is the precise dividing line for you? If a world is causally isolated from me, in what sense is it "concrete" rather than just a very detailed abstract proposition?

  **Follow-up:** (Most likely answer: She will argue that concreteness is defined by having parts in spacetime, even if not *our* spacetime.) If "spacetime" is just a label for whatever internal relations hold a world together, aren't we just renaming abstract logical consistency as "concrete spacetime"? Is this a substantive metaphysical claim or a terminological choice?

  ### 10. The Value of the Real
  **Question:** Finally, why does it matter? If I write a novel that moves people to tears, they know the characters aren't real. If they *were* real in the Lewisian sense, would that make the art better or worse? Does Genuine Modal Realism ultimately enrich our understanding of fiction, or does it risk turning the imagination into a mere census of existing realities?

  **Follow-up:** (Most likely answer: She will argue it enriches understanding by giving truth conditions to our talk about fiction.) If it gives truth conditions, does it also strip away the magic? If every dream I have is a report from a concrete world, does the distinction between imagination and memory collapse entirely?
