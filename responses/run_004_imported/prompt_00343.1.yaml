answer: |-
  **Setting:** *A quiet corner of a university library, late evening. Two whiteboards are covered in decision trees and probability matrices. **Elara** (UDT proponent) is standing, marker in hand. **Marcus** (Updateful Decision Theorist, leaning CDT/EDT) is sitting, nursing a cold coffee.*

  **Marcus:** Let's strip it back to the bone, Elara. Omega flips a fair coin. If heads, he gives you $10,000 if he predicted you'd give him $100 on tails. If tails, he asks for the $100. The coin has landed. It is tails. I am looking at the coin. It is tails. You have the $100 in your hand. Omega is waiting. Why, in the name of all that is holy, do you give him the money?

  **Elara:** Because the policy "Give Omega $100 if asked" has a higher expected value than the policy "Keep $100 if asked." Ex-ante, before the coin flip, the first policy nets you $4,950. The second nets you zero.

  **Marcus:** That's the ex-ante view. I'm asking about the ex-post view. *Now.* You possess information you didn't possess ex-ante. You know the favorable branch is closed. The $10,000 doesn't exist in this world. It's not in the causal future. It's not even correlated in an evidential sense, because the prediction happened in the past based on a state that no longer obtains. Paying is literally burning resources for no return. That's not rationality; that's rule-worship.

  **Elara:** It feels like rule-worship because you're viewing yourself as a temporal slice. A snapshot. "Me-at-t1" makes a plan, "Me-at-t2" executes it only if it still looks profitable from t2's perspective. But if you know "Me-at-t2" is going to defect when the going gets tough, "Me-at-t1" never gets the benefit of the plan in the first place.

  **Marcus:** But "Me-at-t1" is dead. I am "Me-at-t2." Why should I care about the optimization problems of a past version of myself that had less information? Rationality is about making the best decision *given what you know now*. If I ignore my current knowledge to satisfy a past preference, I'm not being rational; I's being a slave to a ghost.

  **Elara:** You're describing dynamic inconsistency. If you reason the way you do now, you are an agent that cannot make binding commitments. If I know I'm going to reason like you when the bill comes due, I can't trust myself to take opportunities that require upfront trust.

  **Marcus:** Or, maybe, "commitment" is just a word we use to describe situations where we wish we had different preferences. Look, let's escalate this. You've been reading the MIRI stuff on logical updatelessness. Let's make the coin logical. Omega asks for $100 based on the 10,000th digit of Pi. If it's even, he gives you $10,000 *if* you would have paid on odd. If it's odd, he asks for $100.
  I calculate the digit. It's odd. I *know* it's odd. It's a mathematical fact. How can you possibly say I should act as if the digit might be even? That's not just ignoring new information; that's pretending mathematical truths are contingent.

  **Elara:** I'm not pretending the truth is contingent. I'm evaluating the output of my decision algorithm across all possible inputs. My decision procedure is a function, $D(input)$. Omega is simulating $D("even")$ to decide whether to give me the money in the "even" branch. Even though I am currently in the "odd" branch, my action here is logically correlated with what my algorithm would output in the "even" branch.

  **Marcus:** There's the rub. "Logically correlated." In the physical coin case, I can see how a predictor models me. But in the logical coin case, once I know the digit is odd, the "even" branch is a logical impossibility. It's a counterpossible. There is no world where the digit is even. So Omega couldn't have given me the money in that world, because that world doesn't exist. So why does my action here affect a non-existent world?

  **Elara:** Because Omega didn't wait for you to calculate the digit. He simulated your source code *before* the calculation was done. He evaluated $D$ on the input "even." The truth value of the digit is fixed, yes, but your *knowledge* of it is not. UDT says you should make decisions based on your prior state of logical uncertainty, not your posterior state.

  **Marcus:** But I *have* the posterior state! I can't un-know the digit. To act updatelessly, I have to deliberately handicap my cognition. I have to say, "I know $P$ is true, but I will act as if I don't." That sounds epistemically vicious. If I meet a tiger, I act on the knowledge that it's dangerous. I don't act on the prior probability that it might be a stuffed animal just to satisfy a policy about tiger-handling.

  **Elara:** The tiger is different. The tiger's behavior doesn't depend on your decision algorithm. Omega's behavior *does*. This is the crux. You think rationality is about responding correctly to the world. I think rationality is about *being* a certain kind of agent in the world. If you are the kind of agent that updates on all information, you get exploited by predictors. If you are the kind of agent that optimizes policies ex-ante, you get the money.

  **Marcus:** I get the money *ex-ante*. But I lose the money *ex-post*. Let's talk about commitment races. You argue that if I don't pay, I can't precommit. But precommitment is a physical action. I can sign a contract. I can hire an enforcer. UDT asks me to do something stronger: it asks me to mentally bind myself even when the enforcement mechanism is gone.
  Suppose I'm in the tails branch. Omega has already walked away. There is no future predictor watching. No reputation to build. Just me and the $100. If I pay, I am literally poorer. Where is the utility coming from?

  **Elara:** The utility came from the fact that you were the kind of person who would pay. You're asking, "What do I gain *now*?" The answer is "Nothing." But that's the wrong question. The question is, "What does my action *say* about the algorithm that generated it?"
  If you defect in the Counterfactual Mugging, you prove that you are not a UDT agent. You prove you are an updateful agent. And updateful agents get left behind in scenarios involving Newcomblike problems, Parfit's Hitchhiker, and bargaining with superintelligences.

  **Marcus:** That sounds like a pragmatic argument for adopting a different psychology, not an argument for what is *rational* right now. I can admit, "Sure, I wish I had been born a UDT agent." But given that I am an updateful agent, and given that I am here, and given that the coin is tails... isn't the rational move to keep the cash?
  You're conflating "What policy should I have selected?" with "What action should I take?"

  **Elara:** They are the same question! You *are* a policy. You aren't a free-floating action selector. You are an instantiation of a decision procedure. When you choose an action, you are effectively selecting the output of that procedure for all identical instances.
  If you say, "I keep the cash because I know it's tails," you are effectively programming your procedure to be: `If know(tails) then Keep`. Omega simulates that. He sees `If know(tails) then Keep`. He knows that in the Heads world, you would know it's Heads, so the condition `know(tails)` is false... wait, let's refine the prediction.
  Omega predicts: `If asked(tails) then Pay?`
  If your algorithm says "No," you get nothing in the Heads world.
  You can't separate the action from the algorithm.

  **Marcus:** Okay, let's grant the algorithmic view. Even then, there's the problem of logical omniscience. In the real world, agents have bounded compute. I update because I *learned* something. Learning is the point of cognition.
  If I adopt UDT, I have to treat logical facts as if they were uncertain, even after I've proven them. This requires a "prior over logical facts." But how do you maintain that prior once you've done the math? Do you have to forget the proof?
  Hintze and the MIRI folks talk about "logical updatelessness," but the mechanism is fuzzy. If I know $2+2=4$, I can't assign probability 0.5 to it to satisfy a bet.

  **Elara:** You don't assign probability to the fact itself. You assign probability to the *consequences of your decision procedure* outputting different values. You treat your own output as uncertain, even if the logical facts are fixed.
  It's like playing chess against a perfect opponent. The game is solved. In principle, the outcome is fixed. But you still have to play. You act *as if* your move matters, because it determines which fixed timeline you inhabit.
  In Counterfactual Mugging, your payment determines whether you inhabit a timeline where Omega trusted you.

  **Marcus:** But in the tails branch, the timeline where Omega trusted you is *counterfactual*. It didn't happen.
  Here's my strongest objection: The "Commitment Race." If UDT is correct, then whenever two UDT agents meet to bargain, they both want to commit to their most aggressive stance *first*. Because whoever commits first forces the other to accommodate.
  If I know I'm a UDT agent, I know I'll stick to my policy even if it hurts me later. So I should scream my policy immediately. But if you do that too, we crash.
  Updateful agents can negotiate. We can say, "Look, the situation has changed, let's update." UDT agents are stuck driving off cliffs because they promised to drive straight.

  **Elara:** That's a feature, not a bug, in some contexts. It prevents exploitation. If you know I will drive straight, you swerve. That's Chicken.
  But more importantly, UDT handles the negotiation by optimizing the *bargaining policy*, not the specific deal. We agree on a fair division algorithm ex-ante.
  Your updateful approach leaves you vulnerable to blackmail. If I know you update, I can create a threat: "Give me $100 or I burn $1,000." You know I haven't burned it yet. You know if you don't pay, I'm irrational to burn it. So you don't pay. But if I'm a UDT agent, I precommitted to burning it if not paid. You know this. So you pay.
  Updatefulness makes you blackmailable.

  **Marcus:** Or, it makes you sane. If you actually burn the $1,000 after I refuse to pay, you've just lost $1,000 for no gain. That's insane.
  I think the disconnect is metaphysical. You view the agent as a timeless mathematical object. I view the agent as a physical process in time.
  For you, the "Prior" is the view from nowhere. For me, the "Prior" is just my memory of what I used to think. And I'm allowed to change my mind when I get new data.
  In the Counterfactual Mugging, the "new data" is the coin state. It screens off the prediction. The prediction is in the past. It's a sunk cost.

  **Elara:** It's not a sunk cost if the prediction was *about* how you handle sunk costs!
  Look, Marcus. Imagine you could self-modify. Before the coin flip, would you modify yourself to be an updateful agent or an updateless one?

  **Marcus:** I'd modify myself to be updateless *if* I knew predictors were watching. I'd pay a premium to bind my future self.

  **Elara:** Exactly. So you agree the updateless policy is superior.

  **Marcus:** I agree the *precommitment* is superior. But there's a difference between "I bind my future self" and "My future self is irrational."
  If I successfully bind myself, my future self *has* to pay. But if the binding fails—if I'm just left with my own reasoning—my future self should keep the money.
  UDT claims the future self *should* pay even without the external binding. That implies the future self's reasoning is flawed if it keeps the money. I say the future self's reasoning is sound, but the past self's situation was better.
  Rationality is local. You can't demand I sacrifice my local utility for a global optimum I can no longer access.

  **Elara:** But you *can* access it. Through logical correlation. Your decision *is* the global optimum being accessed.
  If you say, "I keep the money," you are effectively reaching back in time and changing the prediction Omega made. You are making it true that Omega predicted you would keep the money.
  You think time flows one way. UDT says decision theory is atemporal. Your choice now selects the entire world-tube consistent with your algorithm.

  **Marcus:** That's mystical. I'm a physical brain. My neurons fire now. They don't fire in the past. Omega's neurons fired yesterday. I can't change that.
  I think we're at an impasse. You value consistency across possible worlds. I value efficacy in the actual world.

  **Elara:** And I think the "actual world" is just the one where your policy won. If you win in the actual world but lose in all nearby counterfactuals where you could have easily won, you're a lucky fool, not a rational agent.
  In the Counterfactual Mugging, the updateful agent is the lucky fool. They got the tails branch without paying the premium. But they only got it because Omega was testing a *different* algorithm than the one they're running now.
  If everyone ran your algorithm, Omega wouldn't offer the deal.

  **Marcus:** If everyone ran your algorithm, Omega would exploit them relentlessly in the tails branch!
  Look, let's concede a point. Maybe UDT is the right theory for AI. An AI can actually bind its source code. It can actually treat its output as a logical fact.
  But for humans? We're leaky. We forget. We update. We feel the pain of loss *now*.
  For a human, telling themselves "Pay the $100" when they know it's futile is a psychological hack. It's a heuristic to approximate precommitment. But calling it "Rationality" with a capital R? That implies the universe cares about my consistency more than my wallet.

  **Elara:** The universe doesn't care. But other agents do. And if you want to operate in a universe full of predictors, competitors, and logical dependencies, your wallet depends on your consistency.
  You call it rule-worship. I call it integrity. And in decision theory, integrity pays.

  **Marcus:** Integrity pays *if* you get caught. But in Counterfactual Mugging, there is no getting caught. That's the horror of the thought experiment. It's the perfect crime. You can defect with impunity.
  And yet you say I should confess.

  **Elara:** Because I'm not trying to win the hand. I'm trying to win the game.

  **Marcus:** *(Sighs, leaning back)* The game is over, Elara. This hand is all that's left.

  **Elara:** *(Puts the marker down)* Then you've already lost. You just don't know it yet.

  **Marcus:** Or maybe I'm the only one who knows where I am.

  *(Silence hangs between them. Marcus looks at the $100 on the table. Elara looks at the decision tree on the whiteboard. Neither moves the money.)*
