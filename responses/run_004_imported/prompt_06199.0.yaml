answer: |-
  This is one of the most persistent pedagogical headaches in the philosophy of language, and your students are right to feel uneasy. The move *does* feel like a trick if you present it purely as a derivation. They sense that we are treating the conditional like a proposition to prove it isn't one, and that smells like begging the question.

  Here is a way to frame it for your seminar that bypasses the algebra and focuses on the conceptual clash between **facts** and **policies**, which usually resonates better with second-years.

  ### 1. Why the Closure Requirement isn't Sleight of Hand

  The students' objection is: *"You're assuming we can conditionalize on $A \to B$ to prove we can't treat $A \to B$ as a proposition."*

  The response is to reframe the closure requirement not as a technical constraint on probability functions, but as a demand for **rational stability**.

  Ask your students to imagine what Adams' Thesis is claiming. It isn't just a coincidence about your current beliefs. It's claiming to be a *law of thought*: the degree of belief you ought to have in "If A, B" is *constituted* by your conditional degree of belief in B given A.

  Now, ask: **What happens when you learn something?**
  If "If A, B" expresses a garden-variety proposition (a fact about the world, like "The match is dry"), then it is something you can *learn*. You can discover it is true. You can discover it is false.
  If it is something you can learn, then a rational agent should be able to update their credences upon learning it.

  The "closure under conditionalization" assumption is just the requirement that **the laws of thought shouldn't break when you learn new facts.**

  If Adams' Thesis is a universal law connecting conditionals to probabilities, it should hold for your beliefs *after* you learn something, just as it holds *before*.
  *   **The Reductio:** We aren't assuming the conditional *is* a proposition to prove it is. We are saying: *Suppose* it were a proposition. *Then* we could learn it. *If* we could learn it, we could update on it. *If* we update on it, Adams' Thesis should still hold (because it's a law). Lewis shows that if you do this, the math explodes (probabilities collapse to 0 or 1).
  *   **The Conclusion:** Therefore, the supposition ("It is a proposition") must be false.

  It's not question-begging because it's a *compatibility test*. We are testing whether "Being a Proposition" and "Obeying Adams' Thesis" are compatible traits. Lewis shows they are like "Being a Bachelor" and "Being Married." You don't beg the question by asking a bachelor if he has a wife to prove he isn't married; you show that having a wife is incompatible with the definition of a bachelor. Here, updating on the conditional is incompatible with the definition of Adams' Thesis.

  ### 2. What Feature of Ordinary Conditionals Gets Destroyed?

  This is the most important intuitive hook. If the students accept the math, they often shrug and say, "Okay, so conditionals are weird propositions." You need to show them *why* that's a bad idea.

  The feature that gets destroyed is the **distinction between the connection and the outcome.**

  Consider the match:
  *   $A$: You strike the match.
  *   $B$: The match lights.
  *   $A \to B$: If you strike the match, it lights.

  In ordinary reasoning, the truth (or assertability) of $A \to B$ depends on the *mechanism* (the match is dry, there is oxygen, the chemical composition is right). It does not depend on whether you actually strike it.

  However, if $A \to B$ is a standard proposition $C$ in the probability space, it carves up logical space into "$C$-worlds" and "not-$C$-worlds."
  Lewis's result implies that if Adams' Thesis holds, the probability of $C$ cannot be independent of the probability of $A$ and $B$ in the way we expect. Specifically, it implies that learning $A \to B$ (making $P(C) = 1$) forces $P(B|A)$ to 1.

  **The Intuition Pump:**
  Imagine you are unsure if the match is wet. So $P(B|A)$ is only 50%. By Adams, $P(A \to B)$ is 50%.
  Now, suppose a reliable oracle tells you: "It is true that if you strike the match, it will light."
  You conditionalize on this news. $P(A \to B)$ becomes 100%.
  By Adams' Thesis, your $P(B|A)$ must now become 100%.

  **Here is the destruction:** You have learned something about the *conditional connection*, but your belief about the *categorical outcome* (given the strike) has been forced to certainty.
  But wait—why did the oracle's testimony about the *connection* tell you nothing about whether the match is wet? In a standard propositional model, learning a fact usually gives you information about the world states.
  If $A \to B$ is a proposition, learning it true should rule out worlds where it is false. But which worlds are those?
  *   Are they worlds where you strike and it doesn't light? (Material conditional)
  *   Are they worlds where there is a necessary connection?

  If it's the former, $P(A \to B)$ would be high just because $P(A)$ is low (the "paradoxes of material implication" vibe), which violates Adams.
  If it's the latter, learning the conditional is like learning a law of nature. But Lewis shows you can't treat it as a law of nature *and* keep the probabilistic structure of $P(B|A)$ flexible.

  **The Gut Takeaway:** Ordinary conditionals allow us to be uncertain about the *link* without being certain about the *relata*. If we reify the conditional into a proposition that we can learn, we lose the ability to separate the strength of the link from the probability of the events. The conditional stops tracking a *dependency* and starts tracking a *fact*, and dependencies don't behave like facts under conditionalization.

  ### 3. Is Lewis's Moral Forced? (Getting off the Train)

  Lewis concludes: **Indicative conditionals do not express propositions.** (Expressivism).
  This is the radical exit. But there are conservative exits you should present so students see the landscape.

  **Exit A: Context Dependence (Stalnaker)**
  This is the most popular conservative exit. Lewis's proof assumes that the proposition expressed by $A \to B$ is **fixed** across the different credence functions you move through when you conditionalize.
  Stalnaker argues: The proposition expressed by "If A, B" depends on the context. When you learn new information (conditionalize), the context shifts. Therefore, the proposition expressed by $A \to B$ *changes*.
  *   *Why this blocks Lewis:* You aren't conditionalizing on the *same* proposition $C$. You are conditionalizing on $C_1$, which shifts the context so the sentence now expresses $C_2$. The algebra requires the *same* proposition to be held fixed across the update.
  *   *Cost:* It makes the semantics much more complex (dynamic semantics).

  **Exit B: Truth Value Gaps (De Finetti / Reichenbach / Recent Trivalent Logics)**
  Maybe $A \to B$ is a proposition, but it doesn't obey classical logic. If $A$ is false, $A \to B$ is neither True nor False (it's "Void" or "Undefined").
  *   *Why this blocks Lewis:* Lewis's proof relies on standard probability axioms which assume bivalence (True/False partition). If there is a third value, $P(A \to B)$ isn't just the measure of the "True" set.
  *   *Cost:* You have to revise standard logic and probability theory (e.g., using coherence rather than Kolmogorov axioms).

  **Exit C: Reject Adams' Thesis (Jackson / Grice)**
  Maybe $P(A \to B)$ *doesn't* equal $P(B|A)$. Maybe $A \to B$ is just the material conditional ($A \supset B$), but we only *assert* it when $P(B|A)$ is high.
  *   *Why this blocks Lewis:* It denies the premise.
  *   *Cost:* It feels linguistically wrong. "If Obama is president, then 2+2=4" is materially true, but asserting the conditional is bizarre. Adams' Thesis captures the *data* better than any other theory. Most people are reluctant to dump the data to save the theory.

  ### Summary for the Seminar

  If I were stepping into your room, here is the pitch I'd make to the students:

  > "Lewis isn't tricking you. He's pointing out a category error. You are trying to treat a **rule for updating beliefs** (the conditional) as if it were a **piece of information to be updated on** (a proposition).
  >
  > Think of a conditional like a computer script. 'If A, then run B.'
  > Adams' Thesis says your confidence in the script matches your confidence that B runs given A.
  > Lewis asks: 'What if we treat the script itself as a file on the hard drive?'
  > If it's a file, you can open it, read it, and update your system based on it.
  > Lewis proves that if you try to run your system assuming the script is just a file, the operating system crashes (triviality).
  >
  > So, you have three choices:
  > 1.  **Lewis:** It's not a file. It's a process. (Expressivism)
  > 2.  **Stalnaker:** It's a file, but which file it is changes every time you open it. (Contextualism)
  > 3.  **Revisionists:** It's a file, but it's a weird kind of file that can be half-saved. (Trivalent logic)
  >
  > The 'closure' assumption isn't cheating; it's just the act of trying to open the file. The crash proves it wasn't a standard file to begin with."

  This usually helps them see that the "technical" step is actually the moment where we test the ontology of the conditional, and the failure of that test is the philosophical payload.
