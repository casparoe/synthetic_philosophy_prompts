          *   *The "Garden-Variety Proposition" clash:* Propositions partition logical space. Conditionals seem to *reweight* logical space. Triviality shows you can't have a partition that always matches the reweighting.
          *   *Concrete example:* Suppose I'm unsure if the match is wet. $P(B|A)$ is low. So $P(A \to B)$ is low. If $A \to B$ is a proposition, there's a set of worlds where it's true. In those worlds, is the match wet? If the proposition is true, $P(B|A)$ must be high. So the "True" worlds must be dry-match worlds. But then the truth of the conditional depends on the categorical fact of dryness, not the connection. It collapses the conditional into a material fact or a necessitation fact, losing the probabilistic nuance.
      *   *Section 3: Getting off the Train.*
          *   Lewis's Expressivism (Assertability conditions).
          *   Stalnaker's Context Dependence (The proposition shifts, so you don't update on the *same* proposition).
          *   Trivalent/Supervaluation approaches (Truth value gaps).
