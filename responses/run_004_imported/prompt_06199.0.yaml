      *   If Adams' Thesis is a fundamental principle of how we think about "if", it shouldn't be fragile. It should survive learning.
      *   If conditionals are propositions, they are *learnable content*.
      *   So, if both are true (Adams + Propositionalism), the principle must survive learning the content.
      *   Lewis shows the principle *cannot* survive learning the content (unless the world is trivial).
      *   So one must go.
      *   Why isn't it question-begging? Because we are testing the *compatibility* of two ideas. We aren't assuming the conclusion; we are assuming the *opposite* of the conclusion (that it IS a proposition) to show it contradicts the other premise (Adams).

  5.  **Refining the "What gets destroyed" section:**
      *   Focus on the difference between *facts* and *policies*.
      *   Propositions = Facts (How the world is).
      *   Conditionals = Policies (How to update if the world turns out a certain way).
      *   Triviality shows you can't reify a policy into a fact without losing the flexibility of the policy.
      *   Example: A bet vs. a rule. "If A, B" acts like a rule for adjusting belief. If you turn it into a fact ("The rule exists"), you lose the ability to adjust the rule based on new evidence about A or B independently.

