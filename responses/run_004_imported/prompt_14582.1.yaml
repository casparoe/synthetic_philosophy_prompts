  ### What Both Are Missing

  Both students are talking past each other because they aren't disentangling Descartes' ambiguous use of the word "sensation." For Descartes, *sensation* can mean the mechanical disposition of the body (which animals have) or the conscious awareness of that disposition (which they lack). Neither fully addresses that Descartes' denial of animal pain is specifically a denial of *conscious experience* (qualia), not a denial of physiological reaction. Furthermore, both miss the theological motivation: Descartes needs animals to lack immortal souls to secure the uniqueness of the human mind, which drives his dogmatism on this issue more than the physiology alone would require.
