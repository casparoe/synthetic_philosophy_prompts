answer: |-
  Your friend's argument is logically sound within the domain of finance, but it commits a category error when applied to the psychology of creative work. He is treating your mind like a trading terminal, where information is neutral data that can be observed, filtered, and discarded without residue. But in the drafting phase, your mind is not a terminal; it is the medium itself.

  Here is precisely where his reasoning breaks down, and why your instinct to maintain the rule is the correct one for a writer in your position.

  ### 1. The Fallacy of Zero Cost
  Your friend argues that reading the reviews "costs you nothing" because you remain free to disregard them. This assumes that information consumption is passive and reversible. In cognitive psychology, it is neither.

  Once you ingest an opinion, it becomes part of your internal landscape. You cannot "un-know" a critique or a praise. Even if you consciously decide to ignore a specific comment, it creates a **priming effect**. If a review describes your aunt character as "quaint," that word will linger in your subconscious. When you return to the page, you might find yourself unconsciously over-correcting to make her "gritty," or leaning into the "quaintness" to satisfy the perceived expectation.

  The cost is not time; the cost is **psychic bandwidth**. Drafting requires a state of flow where the only voices in the room are yours and your characters'. Introducing the voice of a reviewer (even a positive one) fractures that closed circuit. You are no longer writing the book you want to write; you are writing the book in the shadow of the book you *did* write. That is a significant cost.

  ### 2. The Illusion of the "Option to Ignore"
  In finance, a "real option" gives you the right, but not the obligation, to take an action. Your friend believes reading the reviews gives you an option: *If the data is useful, use it. If not, discard it.*

  But in creative work, exposure *is* exercise. You cannot hold the option without exercising it. The moment you read the review, the influence has begun. You mentioned yourself that "even praise can subtly redirect what I think I'm supposed to be doing." Your friend dismisses this, but you are the expert on your own process. You have empirical evidence from your own career that external feedback alters your internal compass.

  By reading the reviews, you are not gaining a free option; you are purchasing a liability. You are betting that your conscious willpower can override your subconscious osmosis. That is a risky bet to make in the middle of a draft.

  ### 3. The Quality of the Data
  Even if we accept your friend's premise that information is valuable, we must question the *quality* of the information you are seeking.

  Trade reviews (Kirkus, Publishers Weekly, etc.) are not deep-dive reader reception studies. They are brief, often plot-heavy summaries intended for librarians and booksellers. They rarely offer nuanced analysis of secondary character arcs from previous books in a series, especially if the reviews are for Book 3 and the character originated in Book 1.

  The probability that a trade review will contain the specific, actionable insight you need regarding the aunt is low. The probability that it will contain a throwaway line that unsettles your confidence in that character is much higher. In expected value terms, the risk of contamination outweighs the low probability of high-quality data.

  ### 4. The "Audience in the Room" Problem
  The fundamental purpose of your rule is to keep the audience out of the drafting room. When you draft, you must serve the story. When you read reviews, you become aware of the *readers* of the story.

  If you read the reviews now, you are effectively inviting a committee of strangers into the room while you decide the aunt's fate. Even if they are praising her, you start writing *for* them. You start writing to meet expectations rather than to discover truth. This is the "subtle redirection" you identified. It turns the creative act into a responsive act.

  ### The Verdict
  Your friend is right that information *can* be valuable. He is wrong that it is *free*.

  The anxiety of not knowing how the character landed is a productive tension. It forces you to make the decision based on the needs of the *current* manuscript, not the reception of the *previous* one. If the aunt belongs in the sequel, she belongs there because the story demands it, not because Kirkus liked her in Book 1.

  **Recommendation:**
  Tell your editor to hold the reviews until after you have finished the draft. If you are truly desperate for data on the aunt, look at direct reader correspondence from *your own files* (letters/emails you received after Book 1) rather than trade reviews of Book 3. That data is already in your system; it doesn't require new contamination.

  Protect the closed circuit. Your friend is optimizing for information; you must optimize for integrity.
