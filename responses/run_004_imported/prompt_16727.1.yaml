answer: |-
  **Dialogue: The Targetless Thought**

  **Participants:**
  *   **Alex:** Defender of Rosenthal-style Higher-Order Thought (HOT) theory.
  *   **Jordan:** Critic pressing the misrepresentation objection.

  **Jordan:** Let's go back to the core mechanism of Rosenthal's theory. A mental state is conscious only if it is targeted by a suitable, roughly simultaneous Higher-Order Thought. The HOT represents me as being in that state. Now, suppose I have a HOT that represents me as being in a state of sharp pain in my left foot. But, due to some neural glitch, there is no first-order nociceptive state in my left foot. No tissue damage, no C-fiber firing, nothing at the periphery or the somatosensory cortex to serve as the target. Do I feel pain?

  **Alex:** On Rosenthal's view, yes. If the HOT is present and represents you as being in pain, then for you, phenomenally, it is just as if you are in pain. You are in a conscious state of pain.

  **Jordan:** That's the bullet I want you to bite. You're admitting that a targetless HOT generates phenomenal character *ex nihilo*. If there is no first-order pain state, but I nonetheless feel the hurtfulness of pain, then the "what-it's-like-ness" isn't coming from the first-order state. It's coming from the HOT.

  **Alex:** Not quite. It's coming from the *relation*. Consciousness is a relational property. But I grant that the *phenomenal character* is determined by the content of the HOT. If the HOT says "pain," you feel pain. If it says "ticklishness," you feel ticklishness. The first-order state provides the raw material, but the HOT determines how that material appears to you consciously.

  **Jordan:** But in your targetless scenario, there *is* no raw material. There is no first-order state. So the HOT isn't determining how the material appears; it's generating the appearance entirely on its own. This leads to my worry: If the qualitative character—the hurtfulness, the location, the intensity—is fully determined by the HOT, then the qualitative character is a property of the HOT, not the first-order state.

  **Alex:** I have to stop you there. The content of the HOT is *about* the first-order state. Even if it misrepresents the existence of that state, the *quality* it represents is a quality of a bodily state. The HOT itself is a cognitive, propositional attitude. It doesn't hurt. *You* hurt, because the HOT represents *you* as having a hurting body part. The qualitative character is still located in the represented object, even if that object is illusory.

  **Jordan:** That sounds like wordplay. Let's use an analogy. If I hallucinate a red apple, the redness isn't a property of a real apple, because there isn't one. Where is the redness? In your visual experience. The qualitative character is a property of the experience itself. Now, apply that to pain. If I have a targetless HOT about pain, the hurtfulness isn't a property of a real first-order state. So where is it? It must be a property of the conscious experience itself. But on HOT theory, the conscious experience *is* the first-order state plus the HOT. If the first-order state is absent, the qualitative character must be carried by the HOT.

  **Alex:** You're conflating the vehicle with the content. The HOT is the vehicle. The content is "I am in pain." The fact that the content attributes pain to the body doesn't mean the *thought* has the property of pain. Think of it like a map. A map can represent a mountain even if the mountain doesn't exist. The map doesn't become mountainous. Similarly, the HOT represents pain without becoming painful.

  **Jordan:** But a map doesn't *feel* like anything. We are talking about consciousness. If the mountain doesn't exist, but I have a visual experience as of a mountain, the phenomenology is real. In the HOT case, if the first-order pain state doesn't exist, but I have a conscious experience as of pain, the phenomenology is real. The question is: what grounds that phenomenology? If the first-order state is gone, and the phenomenology remains, the first-order state was never doing the heavy lifting regarding *consciousness*. It seems the HOT is doing all the work.

  **Alex:** The first-order state does the heavy lifting regarding the *type* of mental state. It's a pain state rather than a belief state. The HOT just makes it conscious. In the targetless case, we have a rare glitch where the system signals a state that isn't there. But this doesn't shift the location of the quality. It just shows that consciousness is fallible. Just as perception can misrepresent the world, HOTs can misrepresent the mind.

  **Jordan:** Here is where I press the strongest move. In standard perception, if I see red, there's a visual processing state. In HOT theory, if I feel pain, there's supposed to be a first-order pain state. But if a targetless HOT creates the feeling of pain, then the "painfulness" is intrinsic to the *conscious situation*, not the first-order state. This implies that qualitative character is actually a feature of the higher-order representation. If the HOT can generate the feeling of pain without a pain state, why do we need the pain state at all to explain the phenomenology?

  **Alex:** Because normally, there *is* a pain state. The theory is designed to explain how existing mental states become conscious, not to generate them from scratch. The targetless case is a pathological exception, like phantom limb pain. We don't say phantom limb pain proves legs are irrelevant to walking; we say the neural circuitry is misfiring.

  **Jordan:** But phantom limb pain is exactly the problem! In phantom limb cases, the subject feels pain in a leg that doesn't exist. There is no first-order state in the leg. If HOT theory says this is a targetless HOT, then you are admitting that the *feeling* of pain is compatible with the absence of the *object* of pain. If the feeling can exist without the object, then the feeling isn't constituted by the object. Therefore, the qualitative character isn't in the first-order state. It's in the higher-order awareness. And if the qualitative character is in the higher-order awareness, aren't you essentially admitting that the HOT itself has qualitative properties?

  **Alex:** Rosenthal is very clear: HOTs are non-qualitative. They are purely cognitive. They don't feel like anything to have them. If they felt like something, we'd need a third-order thought to be conscious of them, leading to regress.

  **Jordan:** Exactly! So you have a non-qualitative state (the HOT) that supposedly generates a qualitative experience (the pain) without a qualitative target (the first-order state). That looks like magic. You're trying to locate the "what-it's-like" in the first-order state to avoid saying thoughts have qualia, but your own misrepresentation clause forces you to admit the "what-it's-like" survives the deletion of the first-order state.

  **Alex:** I wouldn't say it survives the deletion; I'd say the conscious state *is* the complex of the HOT and the target. In the targetless case, the system creates a conscious state based on the HOT's content alone. But this doesn't mean the HOT *has* the quality. It means the subject is in a state that *seems* to have that quality. The distinction between *seeming* to be in pain and *being* in pain is crucial.

  **Jordan:** But for phenomenology, seeming *is* being. If it seems to me that I am in pain, I am in pain phenomenally. There is no gap between the appearance of pain and the feeling of pain. If you concede that a targetless HOT makes it seem to me that I am in pain, you concede that I am phenomenally in pain. And since there is no first-order pain state, the phenomenology cannot be grounded in the first-order state.

  **Alex:** It's grounded in the *representation* of the first-order state. The intentional content of the HOT fixes the phenomenology.

  **Jordan:** But intentional content is a property of the HOT. So, the property of the HOT fixes the phenomenology. We've just moved the qualitative character up a level. You wanted HOT theory to explain consciousness without inflating the ontology of thoughts. But if thoughts determine qualitative character even in the absence of their targets, thoughts are carrying the qualitative load.

  **Alex:** I think you're assuming that if X determines Y, X must possess Y. The script determines the play, but the script isn't the play. The HOT determines the conscious character, but the HOT isn't the conscious character. The conscious character emerges from the system's taking itself to be in a state.

  **Jordan:** But in the targetless case, the "system taking itself to be in a state" is all there is. There is no play, just the script. If the script is all there is, and the audience (the subject) experiences the drama (the pain), then the script must contain the drama. You're left with a dilemma: Either admit that HOTs have qualitative character, which threatens the regress argument, or admit that the first-order state is otiose for phenomenology, which collapses HOT theory into a version of first-order representationalism where the higher-order bit is just a tag that doesn't shape the quality.

  **Alex:** I don't accept the dilemma. The first-order state isn't otiose because it's the standard cause of the HOT. The theory explains the normal architecture of the mind. The targetless case shows the architecture is fallible, not that the components are redundant. The qualitative character is still *of* the body, represented by the HOT. It's just that the representation is non-veridical.

  **Jordan:** "Non-veridical" is doing a lot of work there. If the representation creates the reality of the feeling, the distinction between veridical and non-veridical collapses at the level of phenomenology. And if the phenomenology is what we are trying to explain, then the HOT is the generator. I still don't see how you avoid the conclusion that, on your own terms, the qualitative character resides in the higher-order state, not the first-order one.

  **Alex:** And I still maintain that locating the character in the content of the representation doesn't mean the representing state *has* that character. We can agree that the subject feels pain, but disagree on the metaphysical location of that feeling. You want to put it in the HOT; I put it in the relational complex, which, in the targetless case, is incomplete but still functional.

  **Jordan:** But an incomplete complex that functions exactly like a complete one suggests the missing piece wasn't doing the work you said it was.

  **Alex:** Perhaps. But until we have a better account of how non-qualitative thoughts can track qualitative states without inheriting them, I think the relational view holds.

  **Jordan:** And until you can explain how a relation creates a quality when one of the relata is missing, I think the targetless HOT proves the quality was in the thinker all along.

  **Alex:** Then we seem to be at an impasse regarding the ontology of phenomenology.

  **Jordan:** It seems so. The targetless HOT remains a ghost in the machine that refuses to be exorcised.
