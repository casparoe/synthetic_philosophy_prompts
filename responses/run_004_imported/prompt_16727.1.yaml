      *   **Critic (Jordan):** Presses the intuition that you can't have pain without a pain state. Worried that if targetless HOTs create phenomenology, the first-order state becomes otiose (redundant), shifting the "qualitative character" to the cognitive level.

  3.  **Key Philosophical Moves/Arguments to Include:**
      *   **Rosenthal's Actualism:** A mental state is conscious only if there is a HOT about it.
      *   **The Misrepresentation Case:** Phantom limb pain, dreams, hallucinations.
      *   **The "What It's Like" Criterion:** If it seems like I'm in pain, I am in pain (phenomenally).
      *   **The Location of Qualia:** If the HOT creates the "what it's like," is the first-order state doing any work?
      *   **Rosenthal's Response (in literature):** Rosenthal actually bites the bullet. He admits targetless HOTs yield conscious states. He distinguishes between *creature consciousness* and *state consciousness*.
      *   **The Critic's Counter:** If the HOT does all the work, why call it a *Higher-Order* theory? It looks like a theory where thoughts create qualia ex nihilo.

  4.  **Drafting - Section by Section:**

