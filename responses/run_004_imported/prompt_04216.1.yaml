  *   **Prenup (A):** This binds future selves against emotional decision-making during a split, but it involves two parties contracting together rather than a single individual binding themselves.
  *   **New Year's resolution (A):** This is a self-imposed commitment device against weakness of will, but it relies on social pressure rather than a physical or legal impossibility.
  *   **Central bank independence (B):** This is a strong institutional analogy where society binds future policymakers against short-term temptation, but the "agent" is a collective state rather than an individual.
