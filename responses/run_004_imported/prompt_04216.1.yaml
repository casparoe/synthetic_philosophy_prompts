  *   **Constitution (D):** While it binds future decision-making, it involves past generations binding current citizens who did not consent to the original act, which breaks the "self-binding" requirement.
  *   **Debt ceiling (D):** This is technically a legislature binding itself, but because the same body can easily override it, it lacks the credible commitment mechanism that makes the Odysseus story work.
