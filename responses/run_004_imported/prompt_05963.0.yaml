answer: |-
  A type theorist travels back to the Warring States period to debate Gongsun Long.

  **Theorist:** "Master Long, I've read your dialogue. 'A white horse is not a horse.' With respect, your logic is unsound. In any reasonable type system, if `WhiteHorse` extends `Horse`, then a `WhiteHorse` *is* a `Horse`. Subtyping guarantees substitution."

  **Long:** "If you seek a horse, a yellow or black horse suffices. If you seek a white horse, they do not. Therefore, white horse is not horse."

  **Theorist:** "That's an intensional difference, not an extensional exclusion! The set of white horses is a subset of horses. You're violating the Liskov Substitution Principle."

  **Long:** "Am I? Tell me, when you declare your stable, do you declare it `Stable<Horse>` or `Stable<WhiteHorse>`?"

  **Theorist:** "Well, `Stable<Horse>`, obviously. To allow for any color."

  **Long:** "And if I pass you a `Stable<WhiteHorse>`, can you accept it?"

  **Theorist:** "No... because generics are invariant. If I accepted it, I could add a `BlackHorse` to your white-only stable, breaking type safety."

  **Long:** "Precisely. 'Horse' names the shape. 'White' names the color. 'White Horse' names the composite constraint. If you treat 'White Horse' as covariant with 'Horse', you introduce a runtime exception where a black horse appears in a white collection."

  **Theorist:** "So you weren't making an ontological claim about the animal..."

  **Long:** "No. I was enforcing strict invariance on the collection."

  **Theorist:** "So 'Bai Ma Fei Ma'..."

  **Long:** "...is just ancient Chinese for `error: incompatible types: List<WhiteHorse> cannot be converted to List<Horse>`."

  **Theorist:** "You broke metaphysics to prevent a build failure?"

  **Long:** "I prevented a black horse from entering the white stable. That's not philosophy. That's type safety."
