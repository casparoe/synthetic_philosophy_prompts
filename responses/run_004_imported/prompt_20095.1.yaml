      *   *Identity/Continuity:* Clinical = Same biological/psychological entity (mostly). Constitutional = Different people entirely (intergenerational).
      *   *Enforcement:* Clinical = Doctors/State (parens patriae). Constitutional = Courts (Judicial Review)/Institutions.
