answer: |-
  This is a fantastic catch. You have correctly identified that the "Doctrine of Double Effect" (DDE) as it is currently deployed in analytic philosophy and EA circles is often a streamlined, sometimes distorted, shadow of the actual scholastic machinery Aquinas is operating here.

  You are reading the text correctly: the prose is dense because it is doing heavy structural lifting. To answer your two questions directly: **Yes, there are two distinct arguments stacked in that paragraph, and yes, the "means vs. side-effect" condition is largely a later refinement that has been retroactively projected onto this text.**

  Here is the breakdown of what is actually happening in *Summa Theologica* II-II, Q.64, Art.7.

  ### 1. The Two Arguments: Intention vs. Authority

  You are right to sense a seam in the text. Aquinas is solving two different problems simultaneously, and they rely on different premises.

  **Argument A: The Structure of the Act (The "Double Effect" proper)**
  *   **The Problem:** How can an act that results in death be permissible given the prohibition on killing?
  *   **The Solution:** Moral species (the moral identity of the act) is determined by the *intention*, not the accidental consequences.
  *   **The Mechanism:** The act is "self-defense." The intended effect is "preservation of life." The unintended (but foreseen) effect is "death of aggressor." Because the death is *praeter intentionem* (beside the intention), it does not define the moral species of the act.
  *   **The Limit:** Proportionality. You cannot use more violence than necessary.

  **Argument B: The Competence to Intend Death (The Public Authority restriction)**
  *   **The Problem:** Even if the death is unintended, are there limits on *who* can perform acts where death is a foreseeable outcome? Or, conversely, who is allowed to *intend* death?
  *   **The Solution:** Private individuals act for a private good (their own life); public authorities act for the common good.
  *   **The Mechanism:** It is never lawful for a *private* individual to *intend* to kill another human being, even in self-defense. They may only intend to stop the attack. If death occurs, it must be truly accidental to the intention. However, a soldier or judge *can* intend to kill, because they are instruments of the common good (Article 3), and killing threats to the common good is a positive good in that specific context.

  **How they relate:**
  They are not the same argument. Argument A makes self-defense *conceptually possible* without violating the 5th Commandment. Argument B draws the *jurisdictional boundary* around who gets to intend what.

  For Aquinas, a private citizen **cannot** intend the death of the attacker, even if proportionate. If a private citizen thinks, "I am going to kill this guy to save myself," Aquinas says that is murder (or at least sinful), because a private person has no authority over another's life. They can only intend, "I am going to push this guy away," and if the guy hits his head and dies, that is *praeter intentionem*.

  A soldier, however, can intend, "I am going to kill this enemy combatant," because the soldier is an arm of the state punishing a threat to the common good.

  So, the second half of the paragraph isn't just restating the first; it is adding a crucial constraint. **DDE protects the private citizen from guilt for a foreseen death; Public Authority theory protects the private citizen from the temptation to intend that death.**

  ### 2. The Missing "Means" Condition

  This is where your intuition is spot on. The modern formulation of DDE (often codified in the mid-20th century by philosophers like Philippa Foot or in Catholic manualist theology) usually includes four conditions:
  1.  The act itself must be good or neutral.
  2.  The good effect must not be produced by the bad effect. (**The Means Condition**)
  3.  The bad effect must not be intended.
  4.  There must be a proportionate reason.

  **Aquinas does not explicitly state Condition #2 in this text.**

  In the trolley problem literature, Condition #2 is the heavy lifter that distinguishes *Switch* (death is a side effect of diverting the train) from *Footbridge* (death is the means of stopping the train).

  In Aquinas's text, the distinction is handled differently. He focuses on the **object of the act** (what the will actually chooses).
  *   **In Self-Defense:** The object of the act is "repelling force." The death is a consequence of the force. The death is not the *tool* used to save the life; the *force* is the tool.
  *   **In Footbridge (Aquinas would argue):** If you shove the guy, the object of the act becomes "using this man's body to stop the train." You are making his death (or at least his bodily violation) the instrument of salvation.

  **Is it a retrofit?**
  Yes and no.
  *   **Yes:** The explicit formulation of "the bad effect cannot be the means to the good effect" as a distinct, freestanding condition is a later scholastic development (often attributed to Cardinal Cajetan in the 16th century, and solidified in the 19th/20th centuries). Aquinas assumes this within his broader theory of action, but he doesn't spell it out as a checklist item in Art. 7.
  *   **No:** Aquinas *does* believe that you cannot do evil that good may come of it. If the death is the *means*, then the death is, in a volitional sense, "intended" as a tool, even if you say you don't "want" it. For Aquinas, willing the means is willing the end. So, if you will the death as a means, you *do* intend the death, violating Condition #3.

  **Does modern DDE do more work?**
  Absolutely. The modern analytic version of DDE is often used as a **heuristic algorithm** for solving intuition pumps. You plug in the variables, check the four boxes, and get a verdict.

  Aquinas is not providing an algorithm; he is providing a **metaphysics of the will**. He is less interested in whether the death was a "means" in a physical sense, and more interested in whether the will ordered the death as a good to be achieved.

  In the *Footbridge* case, modern DDE says: "You used him as a means."
  Aquinas would likely say: "You intended his death, because you willed his body as an instrument."

  The difference is subtle but important. Modern DDE tries to be objective about the causal chain (was the death physically necessary to stop the trolley?). Aquinas is subjective/volitional (did the agent embrace the death as part of their plan?).

  ### The Rabbit Hole Conclusion

  You have fallen into a very real trap that plagues the EA/Rationalist engagement with virtue ethics and scholasticism. The "Doctrine of Double Effect" cited in trolley problem threads is a **free-floating principle** detached from the teleological system that gave it meaning.

  1.  **Detached from Telos:** Aquinas's argument rests on "it is natural to everything to keep itself in 'being'." This is a claim about natural law ontology, not just a rule about intentions.
  2.  **Detached from Authority:** As you noticed, the public authority clause is usually dropped in modern discussions because it complicates the "private citizen" thought experiments. But for Aquinas, the distinction between private and public violence is foundational.
  3.  **Detached from the "Means" nuance:** By turning the "means" condition into a hard rule, modern philosophy sometimes misses Aquinas's point that *intending* the means is the same as *intending* the end.

  **Verdict:** You aren't missing anything in the text. The "means" condition is implicit in Aquinas's broader work but not explicit in this article, and the "public authority" restriction is a separate argument that modern DDE discussions almost always ignore. The version of DDE used to solve trolley problems is a 20th-century simplification of a 13th-century complex moral theology. It works for the thought experiments, but it doesn't actually map cleanly onto the source code.

  If you want to go deeper down this specific rabbit hole, look up **Cardinal Cajetan's commentary on the *Summa***. He is largely the one who formalized the conditions of DDE in the way modern philosophers recognize them, effectively bridging the gap between Aquinas's volitional focus and the more mechanical distinctions you see in the EA forum threads.
