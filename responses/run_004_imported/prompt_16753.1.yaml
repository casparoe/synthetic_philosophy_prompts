prompt: |-
  So I'm a cognitive science PhD student and somehow I ended up as the grad rep on my department's research-integrity committee. Current case: a 3-author paper's headline result turned out to rest on a buggy preprocessing script. Only one author, A, actually wrote and ran that script; B and C hashed out the analysis plan with her an signed off on the final draft, but never independently reran that part themselves -- which, tbh, is how most collaborations on our floor actually work. Our authorship policy says co-authors are "accountable for the integrity of the work as a whole," and that phrase is exactly what we're stuck on: half the committee reads it as making B and C fully responsible just by having joined the project, half thinks responsibility can't outrun what you actually caused or had access to. Can you draft the memo recommending how responsibility should be split (equal, mainly on A, or some middle option) for the correction and for what goes in each person's file? It's due before next week's meeting, and it needs to actually engage the side you don't land on, not just wave at it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Cognitive Science PhD student, Grad Rep on Research Integrity Committee.
      *   **Task:** Draft a memo recommending how responsibility should be split for a specific case (buggy preprocessing script in a 3-author paper).
      *   **Context:** Author A wrote/ran the script. Authors B & C planned analysis and signed off but didn't independently reproduce that specific part (common practice in the dept).
      *   **Policy:** Co-authors are "accountable for the integrity of the work as a whole."
      *   **Conflict:** Committee is split. Side 1: "Accountable for integrity" = full responsibility for all. Side 2: Responsibility limited by causation/access.
      *   **Requirements:**
          *   Recommend a split (Equal, Mainly A, or Middle).
          *   Address what goes in each person's file.
          *   *Crucially:* Engage seriously with the opposing viewpoint (steelman the side not taken), not just dismiss it.
          *   Tone: Professional, academic, nuanced, actionable.
          *   Deadline: Due before next week's meeting.

  2.  **Determine the Recommendation:**
      *   *Option 1 (Equal Responsibility):* Too harsh for B & C given the technical nature of the error and common practice. Discourages collaboration.
      *   *Option 2 (Mainly A):* Too lenient for B & C. Undermines the "accountable for integrity" policy. Encourages blind signing.
      *   *Option 3 (Differentiated/Middle):* A bears primary responsibility for the *error*. B & C bear responsibility for the *oversight process*. This aligns best with COPE (Committee on Publication Ethics) guidelines and modern reproducibility standards. It acknowledges the policy while recognizing practical limitations.
      *   *Decision:* Go with the Differentiated/Middle approach. It's the most defensible in a Cognitive Science context where code literacy varies.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Brief statement of the recommendation.
      *   **Case Summary:** Facts of the case (buggy script, roles).
      *   **Policy Interpretation:** Analyzing "accountable for the integrity of the work."
      *   **Engagement with Opposing View:** Address the "Strict Liability" view (Side 1).
      *   **Engagement with Opposing View:** Address the "Causal Limitation" view (Side 2).
      *   **Recommendation:** Specific allocation of responsibility.
      *   **Corrective Actions:** Correction notice, file notes.
      *   **Systemic Recommendations:** Preventing future issues (since this is common practice).

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Introduction:* State the purpose clearly.
      *   *Facts:* Keep it neutral. A = code, B&C = design/sign-off. Error = preprocessing bug.
      *   *Policy Analysis:* This is the core. The phrase "integrity of the work as a whole" is the battleground.
      *   *Steel-manning Side 1 (Strict Accountability):* Why do they think B & C are fully responsible? Because authorship implies endorsement. If we excuse them, we weaken the policy. Trust isn't a verification strategy.
      *   *Steel-manning Side 2 (Causal/Access):* Why do they think B & C are less responsible? Epistemic limitation. You can't verify what you can't see/understand. Punishing this hurts collaboration.
      *   *Synthesis/Recommendation:* Distinguish between *responsibility for the error* (A) and *responsibility for the verification* (B&C).
      *   *File Notes:* A needs a note about code verification. B&C need a note about oversight duties, but not misconduct.
      *   *Correction:* Retraction vs. Correction? Likely a Correction/Erratum since it's a bug, not fraud.
      *   *Departmental Level:* Since this is "how most collaborations work," suggest a guideline change (e.g., code sharing requirements).

  5.  **Refining the Tone:**
      *   Needs to sound like a Grad Rep (knowledgeable, respectful, but firm on ethics).
      *   Avoid legalese but be precise.
      *   Ensure the "engagement with the side you don't land on" is explicit. I need to make sure I don't just say "Side 1 is wrong." I need to say "Side 1 has a valid concern about X, but Y mitigates it."

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the distinction between "responsibility for error" and "responsibility for oversight" clear?
      *   *Fix:* Use specific headings. Make sure the file notes reflect this distinction (e.g., A gets "technical oversight," B&C get "procedural oversight").
      *   *Critique:* Did I address the "common practice" aspect?
      *   *Fix:* Add a section on Departmental Norms. Acknowledge that while common, it needs updating.
      *   *Critique:* Is the recommendation actionable?
      *   *Fix:* Specify exactly what goes in the files (Letter of Admonishment vs. Note of Counseling).

  7.  **Final Polish:** Check against the prompt requirements one last time.
      *   Draft memo? Yes.
      *   Recommend split? Yes (Differentiated).
      *   What goes in files? Yes.
      *   Engage opposing side? Yes (dedicated section).
      *   Tone appropriate? Yes.

  8.  *(Final thought on the "Opposing View" requirement)*: I need to make sure I don't strawman the "Full Responsibility" side. Their argument is that authorship is a *warranty*. I need to acknowledge that validity before explaining why it doesn't apply punitively in this specific context.

  9.  *(Final thought on the "Causal" side)*: Their argument is about *capacity*. I need to acknowledge that punishing lack of capacity is unfair.

  10. *Synthesis:* The middle ground is *Duty of Care* proportional to role.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Your Name], Graduate Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Authorship Responsibility in Case #2023-09 (Preprocessing Error)

  ### 1. Executive Summary

  This memo addresses the allocation of responsibility regarding Case #2023-09, wherein a headline result in a three-author paper was invalidated by a bug in a preprocessing script. Author A wrote and executed the code; Authors B and C designed the analysis plan and approved the final manuscript but did not independently reproduce the preprocessing step.

  While our departmental policy states co-authors are "accountable for the integrity of the work as a whole," interpretation of this clause has divided the Committee. This memo recommends a **differentiated responsibility model**. Author A bears primary responsibility for the technical error. Authors B and C bear secondary responsibility for procedural oversight. I recommend a formal Correction be issued, with distinct administrative notes placed in each author's file reflecting their specific lapse, rather than a uniform sanction.

  ### 2. Case Facts and Context

  *   **The Error:** A bug in a Python preprocessing script inflated effect sizes. The error was unintentional.
  *   **Author A:** Wrote the script, ran the analysis, generated the figures.
  *   **Authors B & C:** Conceived the study, determined the statistical approach, reviewed the manuscript, and approved submission. They relied on A's assurance that the code implemented the agreed-upon plan.
  *   **Departmental Norm:** Testimony suggests independent code verification by all co-authors is not current standard practice in our lab groups, though it is becoming an external expectation.

  ### 3. Policy Interpretation and Competing Views

  The core conflict rests on the phrase: *"Co-authors are accountable for the integrity of the work as a whole."*

  **View 1: Strict Collective Liability (The "Warranty" Model)**
  Half the Committee argues that B and C must share equal responsibility. The strength of this position is that it treats authorship as a public warranty. When B and C signed the manuscript, they signaled to the scientific community that *every* claim was vetted. To excuse them because "they didn't run the code" risks incentivizing willful blindness. If we rule that senior authors (B & C) are not responsible for the technical execution they did not personally perform, we undermine the policy's deterrent effect. It creates a loophole where responsibility can be offloaded to the most junior member (often the coder), eroding the "integrity of the work as a whole."

  **View 2: Causal and Epistemic Limitation (The "Capacity" Model)**
  The other half argues responsibility cannot outrun access or causation. The strength of this position is fairness regarding epistemic capacity. In Cognitive Science, co-authors often bring distinct expertise (e.g., theory vs. computation). Holding a theorist fully responsible for a Python syntax error is akin to holding a programmer responsible for a theoretical category mistake they lack the training to spot. If we sanction B and C equally, we punish collaboration and ignore the practical reality that independent reproduction of every line of code by every author is often resource-prohibitive.

  ### 4. Recommendation: Differentiated Responsibility

  I recommend we reject the binary choice between "Equal Guilt" and "No Guilt." Instead, we should adopt a **Role-Based Duty of Care** framework. This aligns with COPE (Committee on Publication Ethics) guidelines, which distinguish between the origin of an error and the failure to detect it.

  **A. Allocation of Responsibility**
  *   **Author A (Primary Responsibility):** As the sole executor of the code, A held the immediate duty to verify the script against the analysis plan. The error originated here.
  *   **Authors B & C (Secondary/Procedural Responsibility):** As senior co-authors, they held a duty to ensure *verification mechanisms* were in place. Their lapse was not causing the bug, but failing to institute a workflow (e.g., code review, shared repositories) that would have likely caught it. They are accountable for the *process integrity*, if not the *technical error*.

  **B. Corrective Action (The Paper)**
  *   **Action:** Publish a Correction/Erratum, not a Retraction.
  *   **Reasoning:** The error was unintentional and the data still exists. A retraction implies misconduct or irredeemable invalidity. A Correction maintains the scientific record while acknowledging the mistake.
  *   **Authorship on Correction:** All three authors must sign the Correction. This publicly reaffirms their collective accountability, satisfying View 1 without requiring punitive uniformity.

  **C. Administrative Files**
  To reflect the differentiated responsibility, the notes in the personnel files should differ:

  *   **Author A:** Place a **Letter of Admonishment**.
      *   *Content:* Notes the technical failure and the lack of unit testing or peer review of the code prior to submission.
      *   *Requirement:* A must complete a workshop on reproducible coding practices before leading a data analysis project again.
  *   **Authors B & C:** Place a **Note of Counseling**.
      *   *Content:* Notes the failure of oversight. It clarifies that "accountability for the work as a whole" requires active verification steps, not just final manuscript approval.
      *   *Requirement:* B & C must update their lab group's SOPs to include mandatory code-review checkpoints for future projects.

  ### 5. Addressing the Departmental Norm

  We cannot ignore that B and C's behavior ("hashing out the plan, trusting the coder") is common on our floor. If we sanction them too harshly, we punish them for following implicit departmental norms. However, if we sanction them too lightly, we validate norms that are increasingly out of step with the field's reproducibility standards.

  This ruling should be framed not just as a judgment on these individuals, but as a **signal for policy update**. I recommend the Committee simultaneously draft a "Best Practices for Computational Collaboration" guideline. This document should define what "accountable for the integrity" looks like practically (e.g., "All authors must have access to raw data and scripts," "Code must be reviewed by at least one co-author not involved in writing it").

  ### 6. Conclusion

  Adopting this differentiated approach allows us to uphold the strict language of our policy (satisfying View 1) while acknowledging the practical limits of individual capacity (satisfying View 2). It places the heaviest burden on the source of the error, while ensuring that senior co-authors understand that their signature implies a duty of verification, not just endorsement.

  I am available to discuss this framework prior to next week's vote.
