answer: |-
  Good evening, everyone. For those of you who don't know me, I'm the brother of the bride. And for those of you who do know me, you know that standing here, holding a microphone, is not exactly where I feel most comfortable. Conversation has never come easily to me. I've often found that the things I want to say get stuck somewhere between my head and my mouth, and by the time they come out, they're not quite the right shape.

  Because of that, I've always been fascinated by how we understand each other. How we bridge that gap. It's a fascination I share with Mark, who I am delighted to welcome into our family. Mark spends his life studying the mechanics of this very thing. He knows the rules of conversation better than anyone in this room. He knows how we signal intent, how we structure meaning, and how we listen. And if there is one thing Mark's expertise has taught me, it's that what is said is often far less important than what is understood.

  When I was asked to speak tonight, I spent a long time trying to write down what my sister means to me. I made lists. I looked for adjectives. I tried to find words that were precise enough to capture her kindness, her intelligence, her patience. But every time I wrote a word down, it felt like I was limiting her. "Kind" is a word we use for strangers who hold doors. "Smart" is a word we use for people who pass tests. These words felt like boxes, and my sister has never fit inside a box.

  So, I decided to try something different. I decided to trust the room.

  There is a theory in communication that suggests we don't need to say everything explicitly. That if the context is right, if the relationship is strong, the most important information is the information we don't have to exchange. It's the information that is already known. It's the background radiation of a relationship.

  When I look around this room, I see people who have been loved by my sister. I see parents who raised her, friends who have traveled with her, colleagues who have worked beside her. I see the evidence of her life in your faces. You are the data set. You are the proof.

  If I were to stand here and tell you that she is generous, I would be asking you to take my word for it. But you don't need my word. You have your own memories. You know the times she showed up when she didn't have to. You know the times she listened when she didn't have to. You know the quiet ways she has made the world around her softer, easier, brighter.

  To tell you what she is like would be to imply that it is up for debate. And it isn't.

  Mark knows this better than anyone. He knows that in any successful conversation, there is a moment where the effort drops away. Where the decoding stops, and the understanding just happens. That is what it is like to be around my sister. There is no static. There is no noise. There is just the clarity of being known.

  I remember once, years ago, I was struggling to explain something to her. I was frustrated, stumbling over my words, feeling that familiar wall go up. I stopped. I just stopped talking. And she didn't fill the silence. She didn't try to fix it. She just waited. And in that silence, she told me everything I needed to hear. She told me that I didn't need to perform to be loved. She told me that my presence was enough.

  That is a rare thing. To find someone who can speak without words. To find someone whose silence is a gift.

  Mark, you are a man who studies meaning. You know that words are just tools. Tonight, I am not going to give you a list of reasons why you are lucky. I am not going to catalogue her virtues as if I am handing over a precious object that requires an inventory. You already know what you have. You wouldn't be standing there if you didn't.

  Instead, I am going to leave a space.

  I am going to leave a space where the adjectives would normally go. Where I would usually say she is "wonderful" or "extraordinary." I am leaving that space empty. Not because I can't find the words, but because the words would be too small. I am leaving that space for you to fill. For Mark to fill. For the years ahead to fill.

  Because the truth is, the most important things about my sister are the things we don't need to say. They are in the way this room feels right now. They are in the way Mark looks at her when he thinks no one is watching. They are in the fact that we are all here, together, because she is the gravity that holds us.

  So, I will not tell you who she is. You already know.

  I will simply ask you to raise your glasses.

  To the silence that understands us. To the words that don't need to be spoken. To the things that go without saying.

  To Sarah and Mark.
