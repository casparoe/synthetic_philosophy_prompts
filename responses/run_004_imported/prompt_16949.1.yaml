          *   *Factory Farming:* To justify this under Tier 2, the pleasure of eating meat must outweigh the intense suffering of the pig. Many utilitarians (Singer) say no. So, Nozick's view *doesn't automatically* justify factory farming; it just makes it a calculation.
          *   *The Dog:* Under Tier 2, sacrificing the dog for research *would* be permissible if the benefits (human lives saved) outweigh the dog's suffering. The user's refusal to do so suggests they are applying a Kantian constraint to the dog, which contradicts the Two-Tier view.
          *   *Conclusion on Consistency:* The Two-Tier view actually makes the user's position *harder* to defend consistently. It demands either sacrificing the dog OR stopping the factory farming (if the math doesn't add up).
      *   **Implications for Other Cases:**
