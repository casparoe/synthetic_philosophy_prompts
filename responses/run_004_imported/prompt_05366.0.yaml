      *   *Application to School:* Since failure rates differ (given in prompt), the impossibility theorem applies directly.
      *   *The "Either/Or":* Explicitly state: You can have Calibration OR Equal Error Rates, but not both.
      *   *The Trade-off:* If they adopt it "as is" (standard training), they usually get Calibration + Disparate Error Rates. Explain *why* this matters (e.g., over-policing one group, under-supporting another).
      *   *Nuance:* Mention that "perfect" fairness is mathematically impossible here, so it becomes a *policy* decision, not just a technical one.
