          *   Let $P(Y=1|A) < P(Y=1|B)$.
          *   If Calibration holds: $P(Y=1|Score=s, A) = P(Y=1|Score=s, B) = s$.
          *   If FNR (False Negative Rate) is equal: Sensitivity is equal.
          *   Chouldechova's proof shows: If Calibration holds and Base Rates differ, then FPR and FNR cannot both be equal. Usually, if you fix Calibration, the group with the lower base rate suffers a higher False Positive Rate.
      *   *Correction:* Actually, if you fix Calibration and Base Rates differ, you *cannot* have Equalized Odds (Equal FPR AND Equal FNR). You might be able to match one, but not both. The prompt asks about being "equally likely to err, via false positives or false negatives." This implies Equalized Odds.
      *   *Conclusion:* It is impossible to satisfy Calibration AND Equalized Odds simultaneously given base rate differences.

