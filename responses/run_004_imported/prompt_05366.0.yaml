  6.  **Refining the Technical Details (Self-Correction/Verification):**
      *   *Did I get the groups right?* If Group A has a lower failure rate (base rate), and we enforce Calibration, Group A will typically have a higher False Positive Rate (more non-failers flagged) compared to Group B. Why? Because to catch the few actual failures (maintaining sensitivity/calibration), you have to cast a wider net, catching more non-failers.
