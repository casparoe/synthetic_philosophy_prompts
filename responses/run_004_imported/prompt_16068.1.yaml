  2.  **Deconstruct the Philosophical Positions:**
      *   **Illusionism (Frankish, Dennett, etc.):** Phenomenal consciousness (qualia) is a user-illusion. We have introspective mechanisms that misrepresent our internal states as having ineffable, intrinsic qualities. There is no "what it is like" in the strong sense, only functional access and misrepresentation.
      *   **The "Who is being fooled?" Objection:** If there is an illusion, there must be a subject experiencing the illusion. If the experience of the illusion is non-phenomenal, how does the illusion work? If it *is* phenomenal, illusionism is false.
      *   **The Meta-Problem:** David Chalmers' distinction. The Hard Problem is "why does processing feel like something?" The Meta-Problem is "why do we *say* it feels like something?" Illusionists often pivot to the Meta-Problem. Critics say this dodges the Hard Problem.
      *   **Quasi-Phenomenal Properties:** Illusionists often admit *something* exists (functional states, introspective representations) but deny they have *phenomenal* properties. Critics argue this is verbal trickery unless clearly distinguished.
      *   **Falsifiability:** A common critique of illusionism is that it's compatible with any evidence (since evidence is interpreted through the "illusion").

