      *   *Did I address the friend's "relativist" claim?* Yes, emphasize that Pascal believes in absolute Truth (God), making him not a relativist.
      *   *Did I connect to reason?* Yes, the limits of reason necessitate custom.

  9.  **Final Polish:** Organize with clear headings. Ensure the flow is logical. (Start with the friend's misconception, move to the Three Orders, then the limits of reason, then the conclusion on consistency).

  **(Self-Correction Note):** Make sure to mention Jansenism briefly as context for his pessimism about human nature, as that explains *why* he thinks we can't agree on justice.

