prompt: |-
  My mother was diagnosed with Huntington's disease three months ago, which puts me at a 50 percent risk of carrying the same mutation myself. I've been agonizing over whether to pursue predictive genetic testing, and a friend who studies decision theory told me that Good's theorem shows a rational Bayesian agent's expected value from acquiring free information is never negative, and that on those grounds I should simply get tested rather than let anxiety about the unknown dictate my choice. I'm not convinced this transfers cleanly to my situation: there is no treatment that would change how my case is managed, and a positive result could complicate life and disability insurance applications for years to come. Please describe the most important implications of Good's theorem for a decision like mine, including where its standard assumptions might strain against the realities of predictive testing for an incurable hereditary disease.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Request:**
      *   **User:** Someone at 50% risk for Huntington's disease (HD) whose mother was recently diagnosed. They are struggling with the decision to undergo predictive genetic testing.
      *   **Context:** A friend cited Good's Theorem (from decision theory) to argue that getting tested is always rational because information has non-negative expected value. The user is skeptical, citing lack of treatment and insurance implications.
      *   **Task:** Describe the implications of Good's Theorem for this specific decision, highlighting where its assumptions break down in the context of predictive testing for an incurable hereditary disease.
      *   **Tone:** Empathetic, nuanced, intellectually rigorous, but cautious (medical/psychological sensitivity). *Crucial:* I am an AI, not a genetic counselor or therapist. I must include a disclaimer.

  2.  **Deconstruct Good's Theorem:**
      *   *What is it?* I.J. Good (1967) proved that for a rational Bayesian agent, the expected value of free information is non-negative. Essentially, having more information allows you to make better decisions, so you should never pay to *ignore* information if it's free.
      *   *Key Assumptions:*
          1.  The agent is a perfect Bayesian updater.
          2.  The information is *free* (no cost to acquire).
          3.  The agent can act on the information to maximize utility.
          4.  Utility is defined purely over outcomes, not over states of knowledge (i.e., knowing itself doesn't hurt).
          5.  The decision problem remains stable.

  3.  **Map Assumptions to the HD Testing Scenario:**
      *   *Assumption 1 (Rationality):* Humans aren't perfect Bayesian agents. Emotions, anxiety, and depression affect decision-making.
      *   *Assumption 2 (Free Information):* Is the test free? Monetary cost might be covered, but *psychological* cost is high. *Insurance/Legal* cost is high (GINA protections have limits, especially life/disability/long-term care).
      *   *Assumption 3 (Actionability):* Good's theorem relies on the ability to *change* decisions based on information. If there's no cure/preventative treatment, does the information change medical management? (It might change life planning, but the friend's argument implies medical utility).
      *   *Assumption 4 (Utility of Knowledge):* Good assumes knowledge is instrumentally valuable. It ignores the *intrinsic* disutility of knowing bad news (anticipatory grief, loss of hope).
      *   *Assumption 5 (Stability):* A positive result changes your identity and how others treat you (stigma, insurance), fundamentally altering the utility function itself.

  4.  **Drafting the Response - Section by Section:**

      *   **Disclaimer:** Essential first step. I am not a doctor or counselor. This is theoretical analysis, not medical advice.
      *   **Acknowledgment & Empathy:** Validate the difficulty of the situation. HD is devastating. The friend's advice, while mathematically sound in a vacuum, is emotionally tone-deaf.
      *   **Explaining Good's Theorem (Briefly):** Define it simply. "Information allows better bets."
      *   **Where the Theorem Holds (The "Pro" side):**
          *   Life planning (career, family, finances).
          *   Reducing uncertainty (for some, knowing is better than waiting).
          *   Reproductive choices (PGD, adoption).
      *   **Where the Theorem Breaks Down (The "Con" side - The Core Request):**
          *   *Cost of Information:* It's not free. Psychological trauma, insurance discrimination (GINA doesn't cover life/disability/LTC).
          *   *Actionability:* No cure. If you can't change the medical outcome, the "value" of information drops in a medical context.
          *   *Utility of Belief:* Humans derive utility from *hope*. Destroying hope has a negative utility cost that Good's theorem doesn't account for.
          *   *Identity Change:* Becoming a "presymptomatic patient" changes self-perception.
      *   **Decision Theory Nuance:** Mention "Value of Information" vs. "Cost of Information." Mention psychological utility functions.
      *   **Recommendation/Next Steps:** Strongly suggest genetic counseling. This is the standard of care for HD.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* I need to make sure I don't dismiss Good's Theorem entirely. It *does* apply to life planning. I need to balance the mathematical theory with the human reality.
      *   *Nuance:* The friend said "free information." I need to emphasize that genetic info is *never* free in the real world due to privacy and insurance risks.
      *   *Sensitivity:* HD is a heavy topic. Avoid cold, clinical language where possible. Use phrases like "psychological burden" and "life planning."
      *   *Specifics:* Mention GINA (Genetic Information Nondiscrimination Act) limitations explicitly, as the user brought up insurance.

  6.  **Final Review against Safety Guidelines:**
