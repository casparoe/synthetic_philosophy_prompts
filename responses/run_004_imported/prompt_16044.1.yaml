  *(Self-Correction Note)*: I need to be careful about the *Kitzmiller* ruling specifics. The ruling focused heavily on "supernatural causation." Popper wasn't necessarily anti-supernatural in a theological sense, but anti-supernatural in a *methodological* sense. I must emphasize methodological naturalism as a consequence of falsifiability, not ontological naturalism. Popper was a realist, but science deals with the inter-subjectively testable.

  *(Refining the ID vs. Popper on Darwinism)*: ID argues Darwinism is *materialist metaphysics* masquerading as science. Popper argued Darwinism was *metaphysical* (in a neutral sense) but *became* science through specific applications. ID wants to replace one metaphysics with another. Popper would say: Keep both out of the core empirical curriculum, but acknowledge evolutionary biology has earned its scientific status through risk-taking, whereas ID has not.

