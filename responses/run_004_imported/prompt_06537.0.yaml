  TOCQUEVILLE
  This wine is adequate, though the conversation here is thinner than the broth. Have you seen the morning sheet?

  KIERKEGAARD
  I have seen it. I try not to read it. It is the mirror of a phantom.

  TOCQUEVILLE
  A phantom? I see it as a lifeline. In America, I saw men scattered across vast distances, equal but isolated. The newspaper was the only thread that stitched them into a citizenry. Without it, they are merely atoms drifting in the dark.

  KIERKEGAARD
  Atoms at least have position. What you call stitching, I call leveling. The newspaper creates "the public." It is a monster made of nobody. Everyone reads the same judgment at breakfast, nods, and feels they have acted. But who has acted? No one.

  TOCQUEVILLE
  You speak of action as if it were purely spiritual. I speak of political liberty. If a government moves to crush a minority, what can the single atom do? Nothing. But if the newspaper calls them to associate, they become a force. They build a hospital, they block a law.

  KIERKEGAARD
  They build a hiding place. That is the terror of it. In your associations, I see the same sickness. A man joins a committee, and now his opinion is the committee's opinion. If he is wrong, the committee is wrong. He has diluted his responsibility until it vanishes into the air.

  TOCQUEVILLE
  You demand too much of the solitary soul. You want every man to be a martyr before he is permitted to speak. In a democracy, we cannot all be saints. We must be neighbors. The association is the school where strangers learn to trust one another.

  KIERKEGAARD
  They do not learn trust. They learn conformity. They borrow courage from the crowd. It is cowardice dressed up as civics. You say the newspaper binds them? It binds them to abstraction. They care about everything in general and nothing in particular. They will donate a coin to a cause they do not understand because the paper says it is virtuous.

  TOCQUEVILLE
  And better that than they care for nothing! You fear the crowd becoming a tyrant. I fear the individual becoming a subject. If you dissolve the associations, if you silence the press in favor of this... intense solitude... you leave the field open to the central power. The state will grow vast while the citizens shrink.

  KIERKEGAARD
  Let the state grow. The state is temporal. The self is eternal. You are trying to solve a spiritual problem with a mechanical fix. You think because men are together, they are not alone. But they are more alone than ever, because they have lost themselves in the "we."

  TOCQUEVILLE
  But without the "we," there is no liberty left to lose. You speak of responsibility before God. I speak of responsibility before the law. If I cannot join with my fellow man to check power, I am not responsible; I am merely a victim. Is that your ideal? The virtuous victim?

  KIERKEGAARD
  My ideal is the single individual who dares to stand apart when the crowd shouts. Your ideal is the crowd shouting in unison and calling it freedom. You say the newspaper prevents isolation. I say it ensures no one ever meets anyone. They meet only the print.

  TOCQUEVILLE
  They meet through the print. It is the beginning of action, not the end. You dismiss the tangible result. If fifty men build a school because they read the same notice, is that not good?

  KIERKEGAARD
  If they built it because each felt a duty, yes. If they built it because the paper said it was the fashion, it is a monument to vanity. You worry about despotism. I worry about meaning. A man can be free from a tyrant and still be a slave to public opinion. Indeed, that is the heavier chain.

  TOCQUEVILLE
  Then you would have them break the chain by retreating inward? That is a recipe for madness. Men need external ties. The aristocracy is gone. The guilds are gone. The newspaper is the new estate. It is imperfect, yes. But it is the only bridge left.

  KIERKEGAARD
  A bridge to nowhere. It connects everyone to everyone, which means everyone is connected to no one. You want to save society. I am trying to save the soul.

  TOCQUEVILLE
  And I tell you, you cannot save the soul in a vacuum. If the society becomes a prison, the soul suffocates. We need the noise to find the silence.

  KIERKEGAARD
  We need the silence to hear if the noise is truth. You make liberty sound like a burden too light for man, so you share the weight. But liberty is the heaviest thing.

  TOCQUEVILLE
  You make it so heavy no one will lift it. You leave the world to the despot while you polish your conscience.

  KIERKEGAARD
  And you leave the soul to the mob while you build your institutions.

  TOCQUEVILLE
  Then we shall disagree on where the listening begins.

  KIERKEGAARD
  Indeed. You listen to the multitude. I listen for the one.
