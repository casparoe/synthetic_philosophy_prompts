answer: |-
  Kurt Gödel is on his deathbed, and a fellow logician comes to visit him. 

  The friend says, "Kurt, I know you've argued that the afterlife must exist. You said a rational universe wouldn't allow a developing mind to be destroyed before it's finished."

  Gödel nods weakly. "Precisely. To terminate a system mid-development is irrational."

  "But Kurt," the friend presses, "think about your First Incompleteness Theorem. If you survive death to ensure your life isn't 'finished'... aren't you trying to make the system consistent?"

  Gödel shakes his head. "No. If I *don't* survive... then the system of Life is **complete**."

  "And that's bad?"

  "That's impossible. I proved it. So if I stay dead, I'm not just gone... I'm a counterexample."
