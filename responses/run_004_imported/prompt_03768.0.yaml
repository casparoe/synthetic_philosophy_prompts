answer: |-
  The mud here is different than you expect. Less sticky, more like ground-up bone. We were walking the lanes of Langemark, the German cemetery. It's quieter than Tyne Cot. Less grandiose. The headstones lie flat, four names to a stone, sunk into the grass like they're trying to hide.

  Theo stopped at a row of *Studenten*. 1917.

  "You're doing it again," Theo said. He didn't look at me. He was looking at a name. *Hans Vogel. 19 Jahre.* "You're looking at Hans there and doing math."

  "I'm not doing math."

  "You're calculating liability. I can hear the gears. You're thinking: *Hans was part of an aggressive machine. Therefore, Hans was a threat. Therefore, the kid from Leeds who shot him was justified, and Hans was… what? Expendable?*"

  "I'm thinking that if the British kid was defending invaded territory, and Hans was occupying it, then morally, they weren't doing the same thing," I said. "They weren't moral equals. One was stopping a wrong. The other was committing it, even if unwittingly."

  Theo kicked lightly at the turf. "This is the McMahan trap. You're conflating the *cause* with the *combatant*. Walzer got it right. The moment they put on the uniform, they enter a separate sphere. A convention. They become functionaries of violence. If you say the German boy is morally liable to be killed but the British boy isn't, you're saying the British boy has a *right* to kill him that the German boy lacks. That makes the British boy a judge, jury, and executioner in the middle of a firefight."

  "It's not about being a judge," I said. "It's about self-defense. If a sleepwalker walks toward you with a knife, he's not *guilty*. He's excused. He's blameless. But he is still liable to be stopped, even lethally, because he poses an unjust threat. Hans is the sleepwalker. The British kid is the one being walked toward."

  "But the sleepwalker knows he's holding a knife," Theo said, finally turning to me. "The soldier doesn't know if the war is just. That's the epistemic gap. You can't hang a kid's moral standing on intelligence reports he never saw. In 1917, Hans thinks he's defending the Fatherland from encirclement. The kid from Leeds thinks he's saving Belgium. Both are operating under state-sanctioned ignorance. If you tie *jus in bello* rights to *jus ad bellum* truth, you make the right to kill dependent on who's actually right. But nobody knows who's actually right until the war is over. Maybe the Allies were wrong. Then does it retroactively make every German death a murder and every British death a sacrifice?"

  "That's a metaphysical question, not a moral one," I countered. "The objective facts determine liability, not our knowledge of them. If the Allies *were* wrong, then yes, the moral ledger flips. But assuming the Germans were the aggressors here—invading neutral Belgium—then Hans is objectively posing an unjust threat. His blamelessness excuses him from *criminal guilt*, sure. We don't prosecute him. But it doesn't make him *justified*. It just means we don't hate him. But he still shouldn't have been shooting."

  Theo walked over to the next stone. *Fritz Weber. 20 Jahre.* "Okay. Let's grant you the deep morality. Let's say, in the eyes of God or Jeff McMahan, Hans is 'liable' and the British kid is 'justified.' Now tell me: what work is that doing? Except making you feel intellectually superior to the dead?"

  "It does the work of truth," I said. "If we say they were moral equals, we say the cause didn't matter. We say fighting for liberation is the same moral act as fighting for conquest. That erases the reason they died."

  "No," Theo said, his voice dropping. "It protects the living. That's the law of war. It's not a bug, it's a feature. If you tell the soldier in the trench, 'You only have the right to kill if your cause is just,' he has to stop and debate geopolitics while people are shooting at him. Or worse, he decides his cause is just and he's a holy warrior. The symmetry of the uniform is a cage. It keeps the violence contained. It says, 'You are allowed to kill him, and he is allowed to kill you, and neither of you is a monster.'"

  "But it's a lie," I insisted. "And we're standing in a graveyard built on that lie."

  "Is it a lie?" Theo gestured to the flat stones. "Or is it a recognition that in war, everyone is a victim of the men who sent them? Hans didn't choose this. The British kid didn't choose this. They are both fuel. If you say Hans is 'liable,' you're saying his death is somehow less tragic than the British kid's. Because the British kid died doing right, and Hans died doing wrong. Is that what you believe? That Hans's mother, grieving in Hamburg, has less reason to mourn than the mother in Leeds?"

  I paused. That was the pivot. "No. Her grief is equal. The tragedy is equal."

  "Then the moral standing is equal," Theo said.

  "Not the standing," I said, struggling to find the footing. "The *outcome*. Look, if I accidentally drive my car onto your lawn because my brakes failed, I'm not a criminal. I'm excused. But I still owe you damages. I'm liable for the harm. Hans is liable for the threat he posed. The British kid wasn't liable for anything. That asymmetry exists. Acknowledging it doesn't mean we spit on Hans's grave. It means we acknowledge that some deaths prevent a greater wrong, and some deaths perpetuate it."

  Theo shook his head. "Here's where your revisionism breaks, and I think you know it. You admit that for practical reasons, the *laws* of war must remain symmetric. Even McMahan says we can't prosecute soldiers on the losing side for mere combatancy. So we agree on the law. We agree on the practice. The only thing you're fighting for is the *description* of the morality."

  "Because the description shapes the memory," I said.

  "Does it?" Theo challenged. "If I tell you, 'Hans was morally liable to be killed, but we excuse him because he was ignorant,' does that comfort anyone? Does that honor the British kid? No. It turns the British kid into a policeman and Hans into a suspect. But they were both meat for the grinder. The Traditionalist view—the Walzer view—says they were both *soldiers*. It grants them dignity. It says Hans had the same right to fight for his country as the British kid did for his. It treats them as agents, not as threats to be managed."

  "But they weren't agents!" I snapped. "That's the problem. They were conscripts. If they weren't agents, they can't have equal rights to kill. Only agents have rights. If they're just tools of an unjust state, they're weapons. You don't grant a weapon moral equality."

  Theo stopped walking. We were near the exit, the low wall of the cemetery separating us from the Belgian fields beyond.

  "Okay," Theo said. "Let's try this. You say the British kid is justified because he's defending. Justified means he's doing the *right thing*. If he's doing the right thing, then killing Hans is a moral good, or at least permissible. But if Hans is blameless—if he's excused—then killing him is a tragedy. So the British kid is in the position of committing a tragedy to do a good. That burdens him. It burdens his conscience."

  Theo leaned against the wall. "Now, flip it. If you adopt the Traditionalist view, the British kid doesn't have to worry about whether his cause is just in the moment. He just has to follow the rules of engagement. He can sleep at night knowing he fought honorably. And Hans? Hans can die knowing he didn't break any moral rules of warfare. He didn't murder. He fought. The sin of the war belongs to the Kaisers and the Kings, not the boys in the mud. By splitting them—making one 'justified' and one 'liable'—you drag the sin back down into the trench. You make the British kid a judge of Hans's worthiness to live. And you make Hans's death a mark of shame."

  I looked back down the row of headstones. The symmetry was perfect. Four names per stone. British, German. Death doesn't look different.

  "I'm not trying to shame Hans," I said quietly. "I'm trying to say that the war itself had a direction. A moral vector. If we pretend the vector doesn't exist, we risk thinking the next war is just a game where both sides are equal. If we say the German soldier in '17 was morally equal to the Allied soldier, then in the next war, the aggressor gets to claim moral equality too. We normalize aggression."

  "And if you say he isn't equal," Theo countered, "you normalize the idea that we can decide which humans are 'liable' to die based on which flag they're under. You give the victors the moral right to say the losers were criminals just for fighting. That's the slippery slope to show trials. That's the slope to Versailles, which gave us Hitler."

  I didn't have an answer for that. The Versailles point hung in the cold air.

  Theo pushed off the wall. "I'm not saying the Kaiser was right. I'm saying Hans didn't deserve to be categorized as 'less than' the kid who killed him. Not even by a philosopher walking over his grave a hundred years later."

  "And I'm saying," I said, "that if we don't make that category, we admit that killing him was wrong, even if necessary. And if it was wrong, we owe more than just a headstone. We owe an explanation of why it happened."

  "We agree on the explanation," Theo said. "It happened because men in capitals sent them here."

  "But one set of men sent them to defend," I said. "And one set sent them to take."

  Theo looked at me, and for the first time, he looked tired of the logic. "Does it matter to Hans? Does it matter to the four names on this stone? They're all dead. The symmetry of the grave is the only truth left. The rest is just noise we make to feel like we understand it."

  He started walking toward the gate. I stayed for a second, looking at *Hans Vogel*. 19 Jahre.

  If I'm right, Hans was a threat that needed stopping. If Theo is right, Hans was a peer of the man who stopped him.

  I walked to catch up with Theo. The argument wasn't over, but the cemetery ended at the wall. Beyond it was the road, and the bus, and the world where we have to decide how to teach this history.

  "You know," I said, as we reached the car. "McMahan would say you're prioritizing order over truth."

  Theo opened the passenger door. "And Walzer would say you're prioritizing truth over the people who have to live in the order. Get in. It's raining."

  I got in. Neither of us spoke until we were past the gates, but I could tell he was still thinking about the liability of the sleepwalker. And I was still thinking about the dignity of the soldier. We had the same map, the same graves, and we couldn't agree on who was buried there.
