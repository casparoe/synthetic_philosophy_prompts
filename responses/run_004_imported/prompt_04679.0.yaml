answer: |-
  # The Geometry of Truth: Assessing the Circularity of the Accuracy-Dominance Argument

  In machine learning, the Brier score and log-loss are prized not merely for their computational convenience, but for their status as "proper scoring rules." A proper rule ensures that a forecaster maximizes their expected score only by reporting their true subjective probability. Recently, formal epistemologists, most notably James M. Joyce, have imported this machinery to defend probabilism—the thesis that rational credences must obey the axioms of probability. Joyce's accuracy-dominance argument posits that any credence function violating probability axioms is accuracy-dominated by one that satisfies them, provided accuracy is measured by a "legitimate" (strictly proper) scoring rule.

  However, a potent objection lurks within the definition of propriety itself. Since a scoring rule is defined as proper only relative to probabilistic expectation, critics argue that restricting legitimate inaccuracy measures to proper ones presupposes the very probabilistic norms the argument seeks to derive. This essay assesses whether this circularity charge defeats the accuracy-dominance argument. While the charge highlights a tension between the mathematical definition of propriety and its philosophical application, it ultimately fails. The restriction to proper scoring rules can be independently motivated by the pre-probabilistic norm of truth-directedness, and the dominance theorem operates pointwise rather than expectationally. Therefore, the accuracy-dominance argument remains a valid, non-circular derivation of probabilism.

  ### The Accuracy-Dominance Argument and the Circularity Charge

  To understand the objection, one must first grasp the structure of Joyce's argument. The project is epistemic, not pragmatic. It assumes that the fundamental goal of belief is accuracy: believing truths and disbelieving falsehoods. Joyce proposes that we can quantify the "inaccuracy" of a credence function $c$ at a possible world $w$ using a scoring rule $I(c, w)$.

  The core theorem states that if $c$ violates the probability axioms, there exists a probabilistic credence function $c^*$ such that $I(c^*, w) < I(c, w)$ for every possible world $w$. In decision-theoretic terms, $c^*$ strongly dominates $c$. If rational agents ought to avoid dominated options, they ought to be probabilists.

  The linchpin of this theorem is the constraint that $I$ must be a *strictly proper* scoring rule. Mathematically, a rule is proper if, for any probability function $p$, the expected inaccuracy $E_p[I(p)]$ is minimized when the reported credence is $p$.

  The circularity charge, advanced by critics like Michael Caie and Hilary Greaves, targets this constraint. They argue that propriety is defined in terms of probabilistic expectation. To say a rule is proper is to say it incentivizes truth-telling *for an agent who maximizes probabilistic expectation*. But if the agent does not yet accept probabilism—if their credences are incoherent—they have no reason to maximize probabilistic expectation. By insisting that a "legitimate" measure of accuracy must be proper, Joyce appears to be smuggling probabilism into the premises. He is effectively saying: "If you measure accuracy using a rule designed for probabilists, non-probabilists look irrational." This renders the argument question-begging.

  ### The Case for Circularity

  The strongest version of the circularity charge rests on the distinction between the *mathematical definition* of propriety and the *normative status* of the measure. Mathematically, propriety is inextricably linked to the expectation operator $E_p$. The definition asks: "Given a probability distribution $p$, which report minimizes expected loss?"

  If the justification for using a proper rule is that "rational agents maximize expected epistemic utility," then the argument is blatantly circular. It assumes agents should act as probabilists (by maximizing expectation) to prove they should be probabilists (by having coherent credences). For a non-probabilist—for instance, a proponent of fuzzy logic or interval beliefs—the notion that they should organize their beliefs to minimize *probabilistic* expectation is a non-starter. If the accuracy-dominance argument relies on the agent caring about expectation, it fails to convince anyone who isn't already a probabilist.

  Furthermore, there are inaccuracy measures that seem intuitive but are not proper. For example, the absolute distance score ($|c - truth|$) is improper; it sometimes incentivizes extremizing credences (reporting 0 or 1) rather than one's true estimate. If a non-probabilist finds the absolute distance score more natural, ruling it out as "illegitimate" simply because it isn't proper looks like an arbitrary exclusion designed to save the theorem.

  ### The Case Against Circularity

  Despite the force of this objection, the circularity charge conflates the *construction* of the accuracy measure with the *deliberation* of the agent. The defense of the accuracy-dominance argument relies on three key distinctions that insulate it from question-begging.

  First, propriety is a constraint on the *measure of accuracy*, not a decision rule for the agent. The claim is not that agents *do* or *should* maximize expected accuracy. The claim is that a legitimate measure of accuracy must structurally align with the goal of truth. A proper scoring rule is one where the "truthful" report is the unique optimum *relative to the geometry of the probabilities*. This can be motivated by the principle of **truth-directedness**: if a credence moves closer to the truth value (0 or 1) without passing it, its accuracy should improve. Strictly proper rules are the only continuous, additive rules that satisfy this condition globally. This motivation relies on the relationship between credence and truth, not on the agent's subjective expectations.

  Second, and most critically, the normative force of the argument comes from **dominance**, not expectation. The theorem does not conclude that probabilistic credences have higher *expected* accuracy. It concludes that they have higher accuracy in *every possible world*. Dominance is a strictly weaker normative principle than expectation maximization. Almost all decision theories, even non-probabilistic ones, accept that if option $A$ is better than option $B$ in every possible state of the world, $B$ is irrational. The agent does not need to assign probabilities to the worlds to accept the dominance principle. They only need to accept that being more accurate in every world is better.

  Third, the mathematical use of expectation in defining propriety is a technical tool to ensure the scoring rule has the right shape (convexity), not a commitment to probabilistic decision theory. We can define propriety geometrically: a scoring rule is proper if the tangent hyperplane to the expected score surface at any point $p$ supports the surface. This ensures that the "gradient" of the score points toward the truth. A non-probabilist can accept that a measuring stick for accuracy should not incentivize lying (reporting a credence different from one's actual estimate) without accepting that they must maximize expectation to choose beliefs. They can accept the *property* of the ruler without accepting the *calculus* used to certify the ruler.

  ### Weighing the Considerations

  The circularity charge succeeds in showing that Joyce's original presentation, which leaned heavily on epistemic utility maximization, was vulnerable. If the argument were "You should be probabilistic because it maximizes expected accuracy," it would indeed presuppose probabilism.

  However, the charge fails against the refined dominance argument. The crucial insight is that the restriction to proper scoring rules is not a restriction on *rational choice*, but a restriction on *epistemic value*. We are asking: "What counts as being accurate?" If we agree that an accuracy measure should not reward an agent for misreporting their own mental state (a condition captured by propriety), then we have independently motivated the constraint. The fact that this condition is mathematically equivalent to minimizing probabilistic expectation is a feature of the geometry, not a presupposition of the agent's psychology.

  Moreover, the dominance result bypasses the need for the agent to perform expectation calculations. The non-probabilist is shown that their current credence function is objectively less accurate than a probabilistic alternative, regardless of how they weight the possibilities. To reject this, the non-probabilist would have to endorse an inaccuracy measure that is "improper"—one that tells them they are more accurate when they lie about their own beliefs or when they are further from the truth in every world. This is a much harder pill to swallow than accepting the mathematical definition of propriety.

  ### Verdict

  The circularity charge does not defeat the accuracy-dominance argument. While it correctly identifies that propriety is defined via probabilistic expectation, it mistakenly infers that using such a measure requires the agent to adopt probabilistic decision norms. The argument does not rely on the agent maximizing expectation; it relies on the agent avoiding dominated options. The restriction to proper scoring rules is independently motivated by the pre-theoretic requirement that epistemic utility must be truth-directed and must not incentivize self-misrepresentation.

  Therefore, the accuracy-dominance argument stands. It successfully derives probabilism from the pursuit of accuracy without begging the question, provided we understand propriety as a structural constraint on the definition of truth-likeness rather than a normative command to maximize expectation. The machine learning intuition holds: proper scores are the only ones that honestly measure uncertainty, and honesty, not expectation, is the foundation of the proof.
