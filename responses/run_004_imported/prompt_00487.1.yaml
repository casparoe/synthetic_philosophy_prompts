      *   *Does IP prevent shutdown seeking?* Not automatically. If the agent is indifferent, it might shut down if that saves energy for... wait, if it's shut down, it has no energy. The risk is more that it might shut down to avoid a penalty *if* the penalty is only applied in the "continue" branch. But usually, the risk is *resistance*. IP aims to stop resistance. Does it stop seeking? Thornley argues it stops *manipulation* of the button.
      *   *Thornley's specific claim:* The "Incomplete Preferences Proposal" (IPP) suggests that if an agent lacks preferences between trajectories of different lengths (shutdown vs. not), it won't sacrifice utility to change the probability of shutdown.
