answer: |-
  You have stumbled onto one of the most heated debates in contemporary metaphysics and philosophy of language, and your intuition is sharper than most people's after their first week reading Timothy Williamson. You are right to be suspicious. The comparison between the Sorites paradox and off-by-one bugs is apt because both deal with the friction between discrete logic and continuous (or seemingly continuous) reality.

  Here is the breakdown of whether Supervaluationism is just Epistemicism in a trench coat, and my verdict on which one actually wins.

  ### The "Disguise" Objection: Are they the same?

  You noted that Supervaluationism seems to agree that "some exact grain-count is where things flip," just like Epistemicism. You are technically correct about the **logical commitment**, but wrong about the **metaphysical commitment**.

  Both theories accept classical logic. In classical logic, the statement $\exists n (H(n) \land \neg H(n+1))$ ("There exists a number $n$ such that $n$ grains is a heap and $n+1$ is not") must be true if we accept that 0 grains is not a heap and 1,000,000 grains is a heap. To deny this existential claim is to abandon classical logic (which theories like Fuzzy Logic do).

  So, both Epistemicism and Supervaluationism say: "Yes, that existential statement is true."

  **Here is where they diverge:**

  *   **Epistemicism** says: There is a **determinate fact** of the matter. There is a specific number $k$ (say, 5,432) that is the boundary. It is *true* that 5,432 is the cutoff. We just cannot know it.
  *   **Supervaluationism** says: It is **supertrue** that *some* number is the cutoff, but for any specific number $k$, it is **indeterminate** whether $k$ is the cutoff.

  So, is Supervaluationism just Epistemicism in disguise? **No, but it is Epistemicism's guilty conscience.**

  Supervaluationism tries to have its cake and eat it too. It wants to preserve classical logic (which forces the existential claim) while denying that there is a sharp boundary in reality. It achieves this by introducing **truth-value gaps**. It says the sentence "5,432 grains is the cutoff" is neither true nor false.

  This leads to a bizarre logical consequence that Supervaluationists have to swallow: **It is true that there is a boundary, but it is not true of any specific number that it is the boundary.**

  To a logician, this is deeply uncomfortable. It violates the intuition that if $\exists x Fx$ is true, there should be some instance $a$ for which $Fa$ is true. Supervaluationism says: "The set has a member, but no specific object is that member." Epistemicism says: "The set has a member, and object $k$ is that member, you just don't know which $k$."

  ### The Fatal Flaw in Supervaluationism

  Your suspicion that Supervaluationism is hiding a sharp boundary is backed up by the **Problem of Higher-Order Vagueness**.

  Vagueness isn't just about "heap" vs. "non-heap." It's also about the boundary itself being fuzzy. There isn't just a sharp line between heap and non-heap; there's a fuzzy region between "definitely heap" and "borderline."

  Supervaluationism handles first-order vagueness by drawing a sharp line around the "admissible precisifications." It says, "Any precise definition of 'heap' that cuts off at 5 grains is inadmissible, but anything between 100 and 10,000 is admissible."

  But wait: **Where is the sharp line between admissible and inadmissible precisifications?**

  If Supervaluationism says *that* boundary is sharp, they haven't solved vagueness; they've just moved it up a level. If they say *that* boundary is vague, they need a third-order logic to explain it, leading to an infinite regress. Epistemicism avoids this by saying the boundary is sharp all the way up; we are just ignorant at every level.

  ### The Verdict: Which is better?

  You asked me not to hedge. Here is the call:

  **Epistemicism is the better account.**

  Here is why. Supervaluationism is an attempt to save our intuitions about vagueness (that there are no sharp boundaries) while saving our classical logic (that bivalence holds). In doing so, it creates a semantic monster: truths without truth-makers. It asserts the existence of a boundary while denying the existence of any specific boundary point. This is logically coherent only if you accept a very specific, non-standard definition of truth ("supertruth") that disconnects truth from reality.

  Epistemicism, on the other hand, is **logically honest**. It accepts that if you use classical logic and standard semantics, you are committed to sharp boundaries. It bites the bullet. It admits that language, when mapped onto the world, forces precision even if our access to it is fuzzy.

  **Why Epistemicism wins:**
  1.  **Logical Consistency:** It preserves the link between existential quantification and instantiation ($\exists x Fx$ implies some $Fa$ is true). Supervaluationism breaks this link.
  2.  **No Regress:** It handles higher-order vagueness naturally (we are just ignorant of the higher-order boundaries too). Supervaluationism collapses under higher-order vagueness unless it secretly relies on epistemicism to define "admissibility."
  3.  **Simplicity:** It does not require a new semantics of "supertruth" or "truth-value gaps." It treats vagueness as a limitation of knowledge, which is a category we already understand, rather than a limitation of truth, which breaks our logic.

  **The Cost:**
  The reason people hate Epistemicism is that it feels absurd. It implies that there is a fact of the matter about whether a specific molecule of water makes someone "bald." It suggests our language is infinitely more precise than our usage warrants.

  But that "absurdity" is a feature, not a bug. It highlights that **vagueness is not in the world, nor in the logic, but in our access.** Supervaluationism tries to put the vagueness in the logic/semantics, but in doing so, it creates a system where "True" no longer means "corresponds to reality."

  ### Conclusion

  Your intuition that Supervaluationism is "the same sharp-boundary commitment wearing a disguise" is philosophically astute. Many critics (like Williamson himself) argue exactly that: Supervaluationism is an unstable halfway house that eventually collapses into Epistemicism once you press it on higher-order vagueness.

  Supervaluationism is more palatable because it comforts our intuition that "there is no sharp line." But Epistemicism is the superior theory because it respects the machinery of logic and truth more than it respects our comfort. It is better to accept a counterintuitive metaphysics (sharp boundaries we can't know) than to accept a broken semantics (truths that have no true instances).

  **Winner: Epistemicism.**
