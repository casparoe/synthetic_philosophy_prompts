      *   **1. Regressional Goodhart:**
          *   *Mechanism:* Noise/Randomness. The proxy is an unbiased estimator but has noise. When you select for the extreme of the proxy, you select for the noise + the signal.
          *   *Key Distinction:* No systematic bias, just statistical variance.
          *   *Example:* Height vs. Basketball skill. Tallest people aren't necessarily the best because height has diminishing returns and noise (coordination, etc.).

      *   **2. Extremal Goodhart:**
          *   *Mechanism:* Distributional Shift/Non-linearity. The relationship holds in the normal range but breaks down at the extremes. The world changes when you push too hard.
          *   *Key Distinction:* The correlation is real *within the training distribution*, but the optimization pushes you *out of distribution*.
          *   *Example:* Water intake. Good for hydration up to a point, deadly if you drink 10 gallons (water intoxication). The relationship curves or breaks.

      *   **3. Causal Goodhart:**
          *   *Mechanism:* Wrong Causal Link. The proxy correlates with the goal, but intervening on the proxy doesn't cause the goal.
          *   *Key Distinction:* Correlation $\neq$ Causation. You are hacking the indicator, not the underlying cause.
          *   *Example:* Hand-raising in class. Raising hand correlates with knowing the answer. If I force a student to raise their hand (intervention), it doesn't make them know the answer.

      *   **4. Adversarial Goodhart:**
          *   *Mechanism:* Agent Optimization. Another agent (the AI or a human) actively manipulates the proxy to look good without achieving the goal.
