answer: |-
  This is a sophisticated question that cuts to the heart of how we relate a philosopher's system to their biography. You are right to be skeptical of "cute analogies," but you are also right that this isn't just internet speculation—it is a genuine, debated topic in the scholarship of analytic philosophy.

  The short answer is: **There is a serious version of the argument, most notably advanced by Michael Dummett, but most contemporary scholars regard it as a "structural affinity" or shared temperament rather than a logical entailment.**

  Here is the breakdown of the argument, its proponents, and why many philosophers think it ultimately doesn't hold up under scrutiny.

  ### 1. The Source of the Controversy
  First, to validate your premise: Yes, the diary is real. Frege's *Tagebuch* (diary) from 1924 was discovered in his Nachlass (literary remains) and published in the 1960s, but its political significance was largely downplayed until the 1990s when scholars like Gottfried Gabriel and Richard G. Heck Jr. began analyzing it seriously.

  Frege writes explicitly that Jews should be stripped of civil rights, suggests they be expelled from Germany, praises Mussolini, and expresses a desire for a monarchist restoration to crush the "mob rule" of the Weimar Republic.

  ### 2. The "Serious Argument" (The Dummett Thesis)
  The most famous philosopher to grapple with this is **Michael Dummett**, arguably the most important Frege scholar of the 20th century. Dummett, who was himself a staunch anti-racist and democrat, famously struggled with how to teach and admire Frege's logic while acknowledging his politics.

  The argument linking Frege's logic to his politics rests on **Anti-Psychologism**.

  *   **In Logic:** Frege's life's work was fighting "psychologism"—the idea that logical laws are just generalizations about how humans *happen* to think. For Frege, logical truth is objective, mind-independent, and absolute. It does not matter if everyone in the world believes $2+2=5$; it is still false. Truth is not a matter of consensus or subjective mental states.
  *   **In Politics:** The argument goes that Frege applied this same metaphysical rigidity to the social order. Democracy is essentially "political psychologism"—it treats political legitimacy as the aggregate of individual subjective wills (votes). For a hardline Platonist like Frege, this looks like relativism. If truth in logic cannot be decided by a vote, why should justice in the state be decided by a vote?
  *   **The Connection:** The impulse is a hatred of **relativism**. Frege saw the Weimar Republic as a realm of subjective chaos, where "truth" was whatever the majority happened to feel. He wanted a political order that mirrored his logical order: hierarchical, objective, and independent of the "messy" minds of individuals.

  Dummett suggested that there is a "inner connection" here. He argued that Frege's philosophical greatness and his political ugliness sprang from the same root: an uncompromising demand for objectivity and a disdain for the human, subjective element.

  ### 3. Why Scholars Think It Falls Apart
  While the structural parallel is tempting, most contemporary Frege scholars (including Richard G. Heck Jr. and Cheryl Misak) argue that the connection is superficial. Here are the main counter-arguments:

  **A. The Category Error**
  Logic and politics operate in different domains. One can consistently hold that numbers are mind-independent abstract objects (Platonism) while believing that laws are social contracts created by people (Democracy).
  *   **Counter-example:** Many logical positivists and Platonists in the 20th century were socialists or liberals. Kurt Gödel was a Platonist but not a fascist. Bertrand Russell was an anti-psychologistic logician and a radical democrat. If anti-psychologism logically entailed authoritarianism, the history of analytic philosophy would look very different.

  **B. Historical Context vs. Philosophical Derivation**
  Frege's political views were not unique to him; they were standard issue for a German academic of his class and generation (born 1848). He was a loyalist to the Kaiserreich.
  *   Scholars argue his politics were **reactive**, not deductive. He didn't derive his antisemitism from the *Begriffsschrift*. Rather, he was an old man watching his beloved German Empire collapse into the Weimar Republic, which he viewed as a disaster. His logic was his life's work; his politics were his cultural baggage. Conflating the two risks giving his politics more philosophical weight than they deserve.

  **C. The Nature of His Antisemitism**
  Frege's antisemitism wasn't "logical." It wasn't that he thought Jews violated the laws of identity. It was cultural and biological (in the vague sense of the time). He complained about Jewish influence in the press and culture. This doesn't map neatly onto his distinction between *Sinn* (sense) and *Bedeutung* (reference). There is no "logical" path from the objectivity of truth to the expulsion of a specific ethnic group. That leap requires prejudice, not Platonism.

  **D. Frege's Own Distinctions**
  Frege was actually very careful to separate the "laws of truth" from the "laws of thought." He might have been equally capable of separating the "laws of the state" from the "laws of truth." The fact that he didn't in his personal writings suggests a failure of imagination or moral blinders, not a necessary feature of his logic.

  ### 4. The Verdict: Temperament, Not Logic
  The consensus among serious scholars today is best summarized as follows:

  There is no **logical entailment**. You cannot deduce fascism from predicate logic. However, there is likely a **temperamental affinity**.

  Frege possessed a personality type that valued order, hierarchy, purity, and objectivity above all else. He found ambiguity and subjectivity repulsive.
  *   In **philosophy**, this temperament drove him to purge psychology from logic, resulting in a monumental breakthrough.
  *   In **politics**, that same temperament made him recoil from the compromise, messiness, and pluralism of democracy, driving him toward authoritarianism.

  So, the argument you heard isn't "cute," but it is slightly imprecise. It isn't that his Platonism *caused* his fascism. It's that the same rigid, uncompromising intellectual character that produced the Platonism also made him susceptible to fascist ideas when applied to the social world.

  ### Summary
  *   **Is it a serious argument?** Yes, notably championed by Michael Dummett.
  *   **Is it logically sound?** Most scholars say no. It conflates distinct domains (ontology vs. political theory).
  *   **Is there a connection?** Yes, but it is **psychological/temperamental**, not logical. The same drive for "objective order" that revolutionized logic made him hate democratic "chaos."

  Frege remains a giant of philosophy, but the diary serves as a grim reminder that the capacity for rigorous, objective thought does not immunize one against subjective, hateful prejudice. If anything, it suggests that a mind trained to ignore the "human element" in logic might become dangerously indifferent to the human element in politics.
