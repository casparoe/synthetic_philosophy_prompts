prompt: |-
  My partner and i just found out we're expecting our first kid (still early days, kind of freaking out in a good and bad way) and i made the mistake of falling down a 3am wikipedia hole into antinatalism, specifically David Benatar's "asymmetry" argument for why he thinks coming into existence is always a harm. I think i've got the basic shape of it: presence of pain is bad, presence of pleasure is good, but absence of pain is good even when there's nobody around to enjoy that good, while absence of pleasure is only bad if there's somebody actually being deprived of it. And apparently thats lopsidedness is supposed to show non-existence beats existence even for a happy life. What's messing with my head is: our future kid can't be "benefited" by never existing, since there'd be no kid there for it to be good for -- so how is non-existence "good" in any sense that should move us? Is that a real hole in the argument or am i missing the point of premise 3?

  Can you actually write this up as a proper essay rather than just answering me directly -- lay out the strongest version of the asymmetry, give the best objections to it (including my worry above, but others too if they're stronger), and then actually pick a side: does the argument succeed in showing our kid would be harmed by being born, or not, and why. No "it's complicated, reasonable people disagree" cop-out, i want an actual verdict i can chew on.
