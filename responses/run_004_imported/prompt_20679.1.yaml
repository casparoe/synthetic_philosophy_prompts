answer: |-
  First off, welcome to the philosophy side of the fence. It is genuinely refreshing to hear from someone who has actually watched vervets in the field rather than just theorizing about them from an armchair. Your intuition here is sharp, and honestly, you have stumbled onto one of the major fault lines in contemporary philosophy of language and social ontology.

  The short answer is: **You are largely right about the structural logic, but you might be underestimating why Lewis (and those following him) insisted on the mentalistic apparatus.**

  Here is the breakdown of where your read is spot-on, where the nuance lies, and why philosophers won't let go of "common knowledge" just yet.

  ### 1. The Structural Identity: You're Right
  You have correctly identified that at the level of **game-theoretic structure**, a Lewisian convention and an Evolutionarily Stable Strategy (ESS) in animal signaling look identical.

  *   **Coordination Problem:** Both agents (human or vervet) face a recurrent situation where matching behavior yields a payoff higher than mismatching.
  *   **Arbitrariness:** There are multiple equilibria (drive left vs. right; eagle alarm vs. leopard alarm).
  *   **Stability:** Once a population settles on one, unilateral deviation is costly.

  Brian Skyrms' work (specifically *Signals: Evolution, Learning, and Information*) is indeed the bridge you suspected. Skyrms explicitly models signaling systems emerging from reinforcement learning or evolutionary selection without requiring the agents to have beliefs, desires, or common knowledge. In Skyrms' sender-receiver games, "meaning" emerges from the stability of the signal-act pairing, not from the internal mental states of the agents.

  If your goal is to explain **how a stable signaling system persists**, the equilibrium story is sufficient. You do not need common knowledge to explain why a bee hive doesn't collapse into chaos.

  ### 2. Why Lewis Insisted on Common Knowledge
  So, why did Lewis write a whole book insisting on a complex hierarchy of beliefs ("I know that you know that I know...")?

  **Context matters.** Lewis published *Convention* in 1969. At that time, evolutionary game theory (Maynard Smith, Price) was just barely kicking off in biology and hadn't touched philosophy. Lewis was working in the tradition of **rational choice theory**. He wasn't trying to explain how *organisms* coordinate; he was trying to explain how *rational agents* coordinate without explicit agreement.

  For Lewis, common knowledge wasn't decorative; it was the **solution to a regress problem for rational actors.**
  *   If I am a rational agent deciding whether to drive on the right, I need to believe *you* will drive on the right.
  *   But I also need to believe that *you believe I will* drive on the right (otherwise you might swerve to avoid me).
  *   And I need to believe that *you believe that I believe...*

  Without a "common knowledge" cutoff, this regress never ends for a reasoning agent. Lewis needed common knowledge to show how rational agents could snap into equilibrium instantly, without waiting for natural selection to prune the deviators over generations.

  ### 3. The "Fuss" Over Common Knowledge: Normativity and Flexibility
  You asked why philosophers still treat common knowledge as indispensable if equilibrium explains the stability. There are two main reasons, both of which distinguish human convention from vervet signaling.

  **A. Normativity (The "Ought")**
  In biology, if a vervet gives the wrong alarm call, it suffers a fitness cost (predation). In human society, if you drive on the wrong side of the road, you are not just inefficient; you are *wrong*. You have violated a norm.
  Philosophers care about the **normative force** of convention. Why do we feel *obligated* to follow conventions?
  *   **Evolutionary story:** You follow it because you were selected to.
  *   **Lewisian story:** You follow it because you have a *reason* to follow it, grounded in your expectations of others.
  Common knowledge provides the justificatory structure for that obligation. It transforms a behavioral regularity into a social norm. If we drop common knowledge, we lose the ability to distinguish between a "convention" (like driving on the right) and a "habit" (like everyone drinking coffee at 9 AM because they are all caffeine addicts). Both are equilibria, but only the former relies on mutual expectation.

  **B. Speed and Flexibility**
  Evolutionary equilibria are slow to shift. Human conventions can shift overnight.
  *   **Example:** If a bridge collapses and everyone needs to meet at a new location, humans can coordinate instantly via a mass text or news broadcast.
  *   **Mechanism:** The broadcast creates *common knowledge* ("Everyone knows that everyone knows the meeting point is now B").
  *   **Contrast:** A troop of vervets cannot decide to swap their eagle and leopard alarm calls by mutual agreement. They would have to wait for a mutation or a slow drift in learning biases.

  Philosophers keep common knowledge because it explains **how humans bypass evolutionary timescales.** It explains the unique human ability to create, shift, and dissolve conventions through reasoning and communication, rather than just selection.

  ### 4. A Gentle Correction on Vervets
  Since you know the literature better than I, you might catch me on this, but it is worth noting for the philosophical distinction: Lewis requires conventions to be **arbitrary**.
  *   **Driving:** Driving on the left vs. right is truly arbitrary.
  *   **Vervet Calls:** There is debate on how arbitrary vervet alarm calls are. Some acoustic features may be physically constrained by arousal levels (high arousal = high frequency). If the signal is physically constrained by the state of the sender, it's not a Lewisian convention; it's a symptom.
  *   **Honeybees:** The waggle dance is largely innate/genetic.

  This reinforces your point: animal signaling is often better described as *biological function* than *convention*. Lewis was trying to capture something specific to *human* sociality, where the link between signal and meaning is looser and maintained by mutual belief rather than genetics.

  ### Summary
  You have successfully "reverse-engineered" the move from Lewis to Skyrms.
  1.  **Is convention just a stable equilibrium?** Structurally, yes. Skyrms and evolutionary game theorists agree with you.
  2.  **Is common knowledge decorative?** For *stability*, yes. For *human agency*, no.
  3.  **Why do philosophers keep it?** Because they are interested in **normativity** (why we think we *should* follow the rule) and **flexibility** (how we change rules instantly), which evolutionary equilibrium alone cannot explain.

  You haven't missed the point; you've just outgrown the 1969 rationalistic framework in favor of the modern evolutionary framework. That is exactly where the field has moved in the last 20 years. If you want to push this further, look into **Jesse Prinz** or **Ruth Millikan** on teleosemantics, or **Michael Tomasello** on shared intentionality. They deal with exactly the tension you've spotted: how much "mind" do you actually need to make meaning work?

  Welcome to the debate. You're already ahead of half the grad students.
