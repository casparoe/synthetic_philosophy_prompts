answer: |-
  # The Cost of Honesty: A Defense of Imprecise Credences

  In the popular rationalist sphere, "Knightian uncertainty" is often wielded as a get-out-of-jail-free card—a vague invocation used to justify hesitation when the math gets hard. But in formal epistemology, the debate over imprecise probabilities is neither vague nor easy. It strikes at the heart of what credences are supposed to do. Are they tools for decision-making, optimized for coherence and actionability? Or are they maps of evidence, optimized for fidelity to the information available?

  The precise Bayesian insists that rationality demands a single probability function. To do otherwise is to invite incoherence. The imprecise probabilist—following the tradition of Isaac Levi and Peter Walley—counters that forcing a single number when evidence is sparse is not rationality; it is fabrication. This essay argues that while the decision-theoretic objections to imprecise credences (specifically Adam Elga's sequential choice argument and the phenomenon of dilation) are formidable, they do not refute imprecisivism. Rather, they reveal the hidden costs of evidential honesty. Rational credences are permitted, and often required, to be imprecise, provided we accept that rationality sometimes mandates a suspension of choice rather than a forced decision.

  ### The Evidential Case for Imprecision

  The strongest argument for imprecise credences is not psychological but logical. It concerns the relationship between evidence and belief. Precise Bayesianism relies heavily on the Principle of Indifference or specific priors to generate point-values. If I know nothing about the bias of a coin, the precise Bayesian assigns $P(Heads) = 0.5$. If I know the coin is biased but not how, they may still assign $0.5$ based on symmetry.

  Levi and Walley argue that this conflates two distinct epistemic states: *balance* of evidence and *weight* of evidence. A probability of $0.5$ derived from extensive frequency data (a fair coin) represents a different state of knowledge than $0.5$ derived from total ignorance. By representing both as a single number, precise Bayesianism loses information about the reliability of the credence itself.

  This is vividly illustrated by the Ellsberg Paradox. Agents prefer to bet on an urn with known proportions (50 red, 50 black) over an urn with unknown proportions, even when the expected value is identical. Precise Bayesianism struggles to accommodate this without violating the Sure Thing Principle. Imprecise Bayesianism handles it naturally: the known urn corresponds to a precise probability $\{0.5\}$, while the unknown urn corresponds to a set of probabilities $[0, 1]$. The agent is not irrational for preferring the precise risk over the ambiguous uncertainty; they are accurately representing the sparseness of their evidence. To force a sharp credence here is to pretend to knowledge one does not possess. It is, in Levi's terms, a violation of the requirement to avoid error.

  ### The Sharpening Arguments: Elga and Dilation

  If the evidential case is strong, the decision-theoretic case against it is sharper. The most damaging objection comes from Adam Elga (2010), who argued that "Subjective Probabilities Should Be Sharp." Elga's argument targets the link between credence and action. An imprecise credence is represented by a set of probability functions (a credal set). When facing a decision, how does the agent use this set?

  Elga constructs a sequential choice scenario. Suppose your credence in a proposition $H$ is the interval $[0.4, 0.6]$. You are offered a series of bets. If you adopt a decision rule that allows you to act based on *any* probability function in your set (E-admissibility), Elga shows you can be money-pumped. You might accept a bet based on the $0.6$ member of the set, and later accept a reverse bet based on the $0.4$ member, locking in a sure loss. To avoid this, you might require *consensus* (all functions in the set must agree on the choice). But this leads to paralysis: if the set is wide enough, you will be unable to choose between almost any options, even when one is strictly dominant in a pragmatic sense. Elga concludes that to avoid either money pumps or paralysis, you must collapse the set to a single sharp probability.

  A second, more technical objection is *dilation*, described by Seidenfeld and Wasserman. Dilation occurs when conditioning on new evidence makes your credal set *wider* rather than narrower. Imagine you have an imprecise prior for $H$ of $[0.4, 0.6]$. You learn evidence $E$ which is known to be statistically independent of $H$ across all probability functions in your set. Intuitively, learning $E$ should not change your belief in $H$. However, in many imprecise models, updating on $E$ dilates the credence in $H$ to $[0, 1]$. Learning irrelevant evidence makes you maximally uncertain. This violates the core intuition that learning reduces uncertainty, suggesting that the mechanics of imprecise updating are broken.

  ### Rescuing the Credal Set

  These objections are serious, but they are not fatal. They rely on specific assumptions about decision theory and the interpretation of independence that an imprecisivist can reject.

  Consider Elga's sequential choice problem. The force of Elga's argument depends on the assumption that a rational agent must always be ready to make a binary choice. Levi's defense is to bite the bullet: rationality does not require a complete preference ordering. If the evidence is insufficient to distinguish between two options, the rational response is *suspension of judgment*. In Elga's money pump scenario, the agent is being asked to make decisions that their evidence does not warrant. If the agent adopts a rule of *E-admissibility* (choose an option if it maximizes expected utility for at least one probability in the set) but acknowledges that this does not compel a unique choice, they avoid the pump by refusing to trade when the set recommends conflicting actions.

  Is this paralysis? Yes, but it is *honest* paralysis. A precise agent in the same position would have to fabricate a preference to keep trading. The imprecise agent admits they cannot distinguish the options. The "cost" Elga identifies is actually the price of avoiding spurious precision. The rescue here is to redefine rational agency not as the maximization of utility under all conditions, but as the alignment of action with the weight of evidence. When evidence is light, action should be constrained.

  Regarding dilation, the rescue involves reinterpreting the phenomenon not as a logical bug, but as a diagnostic feature. Seidenfeld himself has argued that dilation is a rational response to specific kinds of model uncertainty. Dilation typically occurs when the relationship between the evidence and the hypothesis involves a "nuisance parameter" that is poorly constrained. When you update on $E$, the imprecise model reveals that your assumption of independence was not robust across the entire credal set. The widening interval is a warning signal: "You thought $E$ was irrelevant, but given your state of ignorance about the underlying mechanism, $E$ actually opens up new possibilities you hadn't ruled out." Rather than proving imprecise updating is broken, dilation proves that precise updating often masks hidden fragility in independence assumptions.

  ### Verdict

  So, are rational credences allowed to be imprecise? The verdict is yes, but with a strict caveat regarding the agent's decision-theoretic commitments.

  Precise Bayesianism offers a seamless, frictionless engine for decision-making. It guarantees that an agent can always rank options and avoids dilation. However, it achieves this coherence by demanding that agents possess more information than they actually have. It solves the problem of action by ignoring the problem of evidence.

  Imprecise Bayesianism prioritizes the representation of evidence over the ease of action. It correctly identifies that in cases of ambiguity (Ellsberg) or sparse data, a set of probabilities is the only faithful map of the epistemic terrain. The objections from Elga and dilation do not show that imprecise credences are irrational; they show that they are *expensive*. They cost the agent the ability to make crisp decisions in the face of ambiguity, and they require the agent to accept that learning can sometimes reveal deeper ignorance.

  Therefore, rational credences are required to be imprecise whenever the evidence is genuinely ambiguous, conflicting, or sparse. To do otherwise is to commit a form of epistemic lying. However, this permission comes with a duty: the agent must adopt a decision theory that respects the imprecision. An agent cannot hold imprecise credences while acting as if they are precise (which invites Elga's pumps). They must accept that rationality sometimes entails incompleteness of preference.

  The rational ideal is not the agent who always has an answer, but the agent whose confidence matches their evidence. In a world of radical uncertainty, the sharpest probability is often the blurriest vision. Rationality demands we keep the blur.
