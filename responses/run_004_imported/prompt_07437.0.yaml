answer: |-
  Here are nine questions designed to press the hybrid expressivist on the division of labor between descriptive content and expressed attitude. Each includes a follow-up keyed to the standard defensive moves a hybrid theorist typically makes (e.g., appealing to pragmatic explanation, distinct metaphysical commitments, or the "dual-content" strategy).

  ### 1. The Negation Problem and Inconsistency
  **Question:** You argue that the descriptive component carries the compositional burden, so "X is wrong" and "X is not wrong" are inconsistent simply because their descriptive contents contradict. But Unwin and Schroeder press that the inconsistency in moral discourse is *normative*, not merely descriptive. If the descriptive content is something like "fits norms N," doesn't your view imply that the disagreement between a moralist and an amoralist is just a factual dispute about sociology or psychology, rather than a clash of normative standpoints?

  *   *Anticipated Answer:* She will likely say the normative clash is captured by the *expression* of the attitude in assertion, even if the truth-conditions are descriptive.
  *   **Follow-up:** But if the inconsistency relevant to validity (e.g., in *modus tollens*) relies solely on the descriptive truth-conditions, haven't you relocated the "normativity" of the inconsistency entirely outside the semantics? If so, in what sense is the *logic* of ethics normative rather than just descriptive logic wearing a normative mask?

  ### 2. Embedding and the "Attitude Gap"
  **Question:** On your view, the conative attitude is expressed only in outright assertion, not in embedded contexts like conditionals. This solves the Frege-Geach problem by making the embedded content purely descriptive. But consider a valid argument where the conclusion seems to require a conative commitment (e.g., "If stealing is wrong, don't steal; stealing is wrong; therefore, don't steal"). If the premises only carry descriptive content, how does the conative force of the conclusion follow validly from content that lacks it?

  *   *Anticipated Answer:* She will likely distinguish between *semantic validity* (preservation of truth) and *pragmatic rationality* (consistency of attitudes).
  *   **Follow-up:** If the validity is merely truth-preserving over descriptive content, doesn't that sever the link between logical validity and rational requirement? It seems you're left saying the argument is logically valid but rationally optional for someone who grasps the descriptive content but lacks the attitude.

  ### 3. Explanatory Idleness
  **Question:** Critics of hybrid views, such as those engaging with Ridge's ecumenical expressivism, worry that if the descriptive component fixes truth conditions, reference, and validity, the expressive component becomes explanatorily idle. If the descriptive proposition does all the semantic heavy lifting, what theoretical work is left for the attitude to do that couldn't be done by a speaker's private psychological state?

  *   *Anticipated Answer:* She will likely claim the attitude explains the *action-guiding* nature of judgment and the phenomenology of deliberation.
  *   **Follow-up:** But if the attitude is not part of the truth-conditional content, isn't it merely a causal byproduct of accepting the proposition? If it's not semantic, how does it constitute part of the *meaning* rather than just a standard conversational implicature?

  ### 4. The "Ecumenical" Label
  **Question:** You characterize your view as a hybrid solution, dividing labor between cognition and conation. However, if the descriptive content is sufficient to determine the sentence's truth value and its logical relations, isn't the view functionally identical to a cognitivist theory that simply adds a pragmatic footnote about typical speaker psychology? At what point does "hybrid expressivism" just become "cognitivism with a theory of use"?

  *   *Anticipated Answer:* She will likely insist that the expression of attitude is constitutive of the speech act, not just a contingent accompaniment.
  *   **Follow-up:** If it's constitutive of the speech act but not the semantic content, are we distinguishing semantics from pragmatics merely to save the expressivist label? Why shouldn't we say the semantics is cognitivist and the pragmatics is expressivist, rather than calling the whole package hybrid expressivism?

  ### 5. Internalism and the Amoralist
  **Question:** One of the traditional motivations for expressivism was to secure motivational internalism—the idea that there is a conceptual connection between moral judgment and motivation. On your view, since the descriptive content is graspable independently of the attitude, it seems conceptually possible to accept the proposition "X is wrong" while having no motivation to avoid X. Does your view concede the possibility of the amoralist?

  *   *Anticipated Answer:* She will likely concede the amoralist is possible but argue that *normal* or *competent* speakers have the attitude.
  *   **Follow-up:** If the amoralist is conceptually possible, haven't you abandoned the strong internalism that made expressivism attractive in the first place? If the connection is merely contingent or sociological, what advantage does your view have over a standard naturalist cognitivism that also allows for amoralists?

  ### 6. The Source of Motivation
  **Question:** Following up on internalism: If the descriptive content is something like "fits norms the speaker accepts," then believing this content is just believing a fact about one's own psychology or social group. But believing a fact about my norms doesn't necessarily motivate me to follow them. Where does the motivational "oomph" come from if not from the semantic content itself?

  *   *Anticipated Answer:* She will likely say the motivation comes from the *expressed attitude* component, which accompanies the belief in assertion.
  *   **Follow-up:** But if the attitude is separate from the belief content, doesn't that make motivation external to the judgment? It seems you've analyzed the judgment as a belief, and then tacked motivation on as a separate state, which is precisely the Humean picture expressivists originally sought to avoid.

  ### 7. Creeping Minimalism
  **Question:** Dreier's "creeping minimalism" challenge suggests that once expressivists adopt minimalist notions of truth and belief to solve embedding, there is no daylight left between them and cognitivism. Since your view posits a robust descriptive content that bears truth conditions, how do you avoid the charge that you are simply a cognitivist who uses expressivist vocabulary? What substantive difference remains?

  *   *Anticipated Answer:* She will likely point to the metaphysical commitment: she doesn't posit robust normative properties, only descriptive ones plus attitudes.
  *   **Follow-up:** But if the descriptive property (e.g., "fits norms N") is doing all the truth-making, and you allow that moral sentences are "true" when they have that property, how is your ontology different from a naturalist realist who identifies wrongness with fitting norms N? Is the difference merely verbal?

  ### 8. Metaphysical Commitments
  **Question:** You suggest your view avoids positing queer normative properties by relying on descriptive content. But if the descriptive content is fully naturalistic, and the attitude is just a psychological state, what normativity is left over to justify the claim that one *ought* to have that attitude? Does your view risk collapsing into an error theory where the "normative" force is an illusion projected by the speaker?

  *   *Anticipated Answer:* She will likely argue that normativity is located in the practical stance of the agent, not in the properties described.
  *   **Follow-up:** If normativity is entirely in the stance and not in the content, doesn't that make normative discourse systematically misleading? Since the surface grammar suggests we are describing properties, aren't you committed to saying ordinary speakers are confused about what they are doing when they make moral claims?

  ### 9. The Deletion Test
  **Question:** This brings us to a final worry about the necessity of your expressive layer. If we were to delete the expressive component from your theory entirely—keeping only the descriptive content and its truth conditions—what exactly would be lost? Semantically, the truth conditions remain; logically, the validity remains; metaphysically, the naturalism remains. What specific phenomenon would your theory fail to capture if it were stripped of the expressivist layer and became pure descriptivism?

  *   *Anticipated Answer:* She will likely say we would lose the explanation of why moral language is action-guiding, or why it feels different from ordinary description.
  *   **Follow-up:** But if the semantics and logic are unchanged, and the "action-guiding" nature is just a contingent psychological addition, isn't that a difference in *sociology* rather than *semantics*? If nothing semantic or normative is lost by the deletion, why shouldn't we conclude that the expressive layer was theoretically redundant from the start?
