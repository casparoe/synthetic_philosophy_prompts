      *   *Check:* Is the tone appropriate? *Correction:* Keep it collegial but intense. They are peers.
      *   *Check:* Is the ending a standoff? *Correction:* Ensure explicit concessions are stated.

  6.  **Detailed Plotting of the Exchange:**
