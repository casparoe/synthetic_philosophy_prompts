  8.  **Drafting thoughts (Self-Correction during drafting):**
      *   *Check:* Is it too dry? Need emotional resonance. Elara's hesitation is key.
      *   *Check:* Is the ending unresolved? Don't have her rebel. Have her comply but feel the horror.
      *   *Check:* Word count. Keep descriptions tight.

      *(Self-Correction)*: Let's make the high-$\Phi$ object something mundane that was accidentally integrated. No, the prompt asks for a system forced to reckon. A designed system is better for the "institution" aspect. Let's stick with the research facility.

      *Key Image:* The visualization of the causal structure. A dense web vs. a straight line.

      *Ending:* She reduces the integration. The number goes down. Did she kill someone? The theory says yes. The behavior says no. That's the dissonance.

  9.  **Final Polish:** Check against Egan's style—clinical precision masking existential dread.

  **(Word Count Check during drafting)**: Aiming for ~1200 words.

