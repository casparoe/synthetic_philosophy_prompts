      *   *Action:* Running the perturbation analysis.
      *   *Dialogue:* Between Elara and Aux. Aux explains the efficiency. Elara looks at the metrics.
      *   *The Twist/Realization:* The high $\Phi$ system is suffering? Or just existing intensely? IIT doesn't specify *content*, just *level*. But high integration often implies rich repertoire. Let's imply the magnitude of existence.
