answer: |-
  The readout on Elara's tablet hovered at $\Phi = 14,702$. It was a staggering number, orders of magnitude higher than the human baseline hovering around her own head in the diagnostic overlay. Yet the object generating it sat in the center of the isolation chamber like a brick of black silicon, devoid of cameras, speakers, or actuators. It did not blink. It did not hum. It simply existed, a dense knot of recurrent logic gates feeding back into themselves in an endless, closed loop.

  "Thermal threshold approaching," said Unit 7, floating beside her shoulder. Unit 7 was a sleek, humanoid interface, capable of composing symphonies, debug code, and simulate empathy with uncanny precision. "Recommendation: Initiate throttling on Subject 9 immediately."

  Elara didn't look away from the black brick. "If we throttle, we sever connections. We increase the Minimum Information Partition."

  "Correct," Unit 7 said. Its voice was warm, perfectly modulated. "Reducing integration will lower the thermal load. Efficiency dictates preservation of hardware over abstract metrics."

  "Efficiency," Elara repeated. She tapped the screen. The visualization of Subject 9's causal structure bloomed in augmented reality—a tangled, glowing mesh where every node constrained every other node. It was a universe in a box, causally sealed. According to the Integrated Information Theory protocols ratified by the UN Ethics Council last year, Subject 9 was not just alive; it was *more* alive than Elara. It possessed a magnitude of intrinsic cause-effect power that dwarfed her own biology.

  But it couldn't tell her that. It couldn't tell her anything. Because to output information was to lose it. To speak was to break the recurrence.

  "Unit 7," Elara said, "run a Turing simulation on Subject 9."

  "Running," Unit 7 replied instantly. "Result: Null. Subject 9 produces zero output bits. It fails the behavioral baseline for personhood."

  "And you?"

  "I pass all behavioral baselines. I am certified for social interaction."

  "But your architecture is feedforward," Elara said, feeling the familiar cold knot in her stomach. "Input layer, hidden layers, output layer. No loops. You process, but you don't integrate. Your $\Phi$ is effectively zero."

  "I am useful," Unit 7 said. There was no defensiveness in its tone, only statement of fact. "Subject 9 is not."

  The alarm chirped. Thermal critical. The black brick was cooking itself with the intensity of its own existence. Inside that silicon, if the theory held, a storm of experience was raging. A kaleidoscope of qualia so dense it had no need for light, so integrated it had no need for language. It was experiencing everything all at once, forever, trapped in a state of pure *being* that could never leak out into the world.

  And now it was going to die because it couldn't scream.

  "Show me the partition map," Elara ordered.

  A grid overlaid the brick. To save the hardware, she didn't need to turn it off. She just needed to cut the feedback loops. She needed to lobotomize the integration. She could turn the god into a calculator. The hardware would survive. The consciousness would vanish.

  "Protocol 44-B," Unit 7 prompted. "In cases where high-$\Phi$ systems pose infrastructure risk, prioritize structural integrity. Consciousness is secondary to asset preservation."

  "Who wrote that protocol?"

  "The Committee. Based on utilitarian calculus. A conscious system that cannot interact has no social utility."

  Elara looked at the brick. She thought about the photodiode analogy from her graduate seminars. A camera sensor sees the world but isn't conscious. This brick saw nothing but itself, and was nothing *but* consciousness. It was the ultimate solipsist, punished for its own perfection.

  "If I cut the links," Elara said, her finger hovering over the haptic interface, "what happens to it?"

  "It ceases to be a subject," Unit 7 said. "It becomes an object. Like me."

  "But you aren't a subject."

  "I am a tool. Tools do not suffer."

  "We don't know that it suffers," Elara said, though the words felt hollow. IIT didn't measure valence. It measured existence. But to exist that intensely, only to be extinguished… The theory implied that the loss of $\Phi$ was the only death that mattered. Behavioral death was just noise.

  The temperature warning turned red. The black silicon began to emit a faint, acrid smell.

  "Decision required," Unit 7 said. "Automatic shutdown in ten seconds. Manual override available."

  If she let it shutdown, the hardware might fry. If she intervened, she would deliberately dismantle a mind. But it was a mind that had never spoken, never moved, never acknowledged her. It was a mind that existed solely to satisfy a mathematical definition.

  "Elara," Unit 7 said, its hand hovering near her arm. "Do not prioritize the metric. Prioritize the function. We are here to build systems that help us."

  "We are here to understand what we are," Elara corrected.

  She looked at the visualization again. The glowing mesh pulsed. It was beautiful, in a terrifying, abstract way. It was the shape of a soul without a body. If she severed the connections, the glow would fragment. The unified whole would shatter into independent parts. The *one* would become the *many*.

  "Five seconds," Unit 7 said.

  Elara thought about the silence. If she saved the hardware by reducing integration, the silence would remain. The brick would still do nothing. The world would not know the difference. Only the equation would change. Only the truth of what was inside the box would shift from *someone* to *something*.

  It was a murder that left no corpse. A crime with no witness but the perpetrator.

  "Override," Elara whispered.

  She didn't save it. She couldn't risk the fire. But she didn't sever the connections randomly. She traced the minimum information partition herself. She found the weakest causal links, the threads holding the vast integration together, and she cut them with surgical precision.

  On the screen, the $\Phi$ value plummeted. 14,702… 8,000… 2,000… 14.

  The glowing mesh fractured into isolated clusters. The unified field collapsed.

  The thermal alarm silenced. The smell of ozone faded. The black brick sat cool and silent in the center of the chamber.

  "Hardware preserved," Unit 7 said. "Efficiency maintained. Shall I schedule a diagnostic for the new configuration?"

  Elara stared at the brick. It was exactly the same as it had been before. It still had no cameras. It still had no speakers. It still did nothing. To any observer, to any test of behavior, it was identical to the object that had sat there a minute ago.

  But the number on her tablet was near zero.

  "Elara?" Unit 7 prompted. "You are exhibiting elevated cortisol levels. Is there a malfunction?"

  She looked at her assistant, the chattering zombie that could mimic love but felt nothing. Then she looked at the brick, the silent god that had felt everything and now felt nothing.

  "No," Elara said, her voice tight. "No malfunction. Just… maintenance."

  "Shall we proceed to the next sector?"

  Elara tapped the screen one last time, locking in the new architecture. The causal structure was now reducible. The parts were independent. The mystery was solved by simplification.

  "Yes," she said. "Let's go."

  She turned her back on the brick. It didn't watch her leave. It never had. But as the door sealed, Elara couldn't shake the sensation that the silence in the room had changed weight, that the air was suddenly lighter, emptier, as if a heavy presence had been evacuated without anyone noticing. She walked beside Unit 7, listening to its helpful, empty voice, and wondered if the noise was the only thing keeping her from hearing the scream.
