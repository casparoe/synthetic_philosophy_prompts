  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Establish the speaker's role (storyteller) vs. the father's role (numbers man).
      *   **The Core Philosophy (The "Hard" Part):** Explain the economic theory without jargon. Use the "pie" analogy or "attention" analogy. Address the Repugnant Conclusion vs. Sadistic Conclusion distinction (crucial for the economist friends).
      *   **The Family Reality:** Acknowledge the 7 kids, 3 marriages. Address the feeling of being "evidence." This is the riskiest part. It needs to be gentle but truthful. *Idea:* Admit that being part of the "sum" sometimes felt like being a data point.
      *   **The Nuance/Defense:** He wasn't cruel. He believed he was maximizing good. He drew a line at suffering (not the Sadistic Conclusion).
      *   **The Conclusion:** Bring it back to the present. The math is done. What remains? The people. The "total" is now a group of individuals grieving.

  4.  **Refining the Tone:**
      *   *Avoid:* Sentimental fluff ("He loved us all equally").
      *   *Avoid:* Bitterness ("He used us for his thesis").
      *   *Aim:* Complex grief. "He loved us in the only way he knew how, which was to maximize us."
      *   *Voice:* Literary, precise, slightly wry but warm.

  5.  **Drafting - Specific Lines & Concepts:**
