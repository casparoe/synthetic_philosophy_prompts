prompt: |-
  Ok so I'm putting together a handout for my phil of science seminar this week — we're doing the stats unit and I want something meatier than the cardboard-cutout version of the frequentist/Bayesian fight that everyone already half-knows ("one side uses priors, one doesn't," etc). My students have all vaguely heard of the replication crisis but most of them don't relaize how much of it is actually a fight about what "evidence" even means, and not just about p-hacking being naughty.

  Could you write me a dialogue between a frequentist statistician and a Bayesian statistician who are both staring at Daryl Bem's old "Feeling the Future" precognition experiments — the ones that cleared p < .05 using completely standard methods, and that Eric-Jan Wagenmakers and co. later reanalyzed with Bayes factors, concluding the evidence for psi was pretty underwhelming once you looked at it that way. I want the frequentist to have a genuine, non-strawmanned case for why a run of independently significant results is doing real evidential work regardless of what the Bayes factor says, and I want the Bayesian to push back with actual substance — why the sampling plan/stopping rule shouldn't change what the data tell you (this is the likelihood principle stuff my students always find sort of spooky), and why a small p-value and a large likelihood ratio can come apart for principled reasons, and not just because the Bayesian rigged the prior. By the end I'd like them to have actually located the deepest layer of the disagreement — is evidence fundamentally about controlling error rates over hypothetical repetitions, or about the relative likelihood of the data under each hypothesis — rather than just restating their opening positions louder.

  It doesn't need to resolve in favor of either side. Honestly a dialogue that ends in a kind of stalemate is fine, so long as its clear why they can't just split the difference — that's usually the part my students skip past too fast.
reasoning: |-
  Here's a thinking process that leads to the dialogue above:

  1.  **Analyze the Request:**
      *   **Topic:** Philosophy of Science seminar handout (Statistics Unit).
      *   **Subject:** Frequentist vs. Bayesian interpretation of evidence, specifically regarding Daryl Bem's "Feeling the Future" (precognition) experiments and Wagenmakers' reanalysis.
      *   **Goal:** Move beyond strawmen ("priors vs. no priors"). Highlight the Replication Crisis context. Show the deep philosophical disagreement about the *definition of evidence* (Error Statistics vs. Likelihood Principle).
      *   **Characters:**
          *   Frequentist Statistician (needs a genuine case for p-values/error control, not just "p-hacking is bad").
          *   Bayesian Statistician (needs to explain Likelihood Principle, stopping rules, and why p-values diverge from Bayes Factors).
      *   **Outcome:** Stalemate/Impasse, but a clear understanding of *why* they can't agree (different goals/definitions of evidence).
      *   **Tone:** Academic but accessible, spirited but respectful.

  2.  **Deconstruct the Scientific Context (Bem & Wagenmakers):**
      *   *Bem (2011):* Published 9 experiments in JPSP claiming evidence for precognition. Used standard null hypothesis significance testing (NHST). Most $p < .05$.
      *   *Wagenmakers et al. (2011):* Reanalyzed using Bayes Factors. Argued that given the low prior probability of psi, the evidence wasn't strong enough to overturn skepticism. Also criticized optional stopping and sample sizes.
      *   *The Conflict:* Bem followed the rules of NHST. Wagenmakers argued the rules of NHST allow "significant" results for phenomena that are actually implausible.
      *   *Key Philosophical Concepts:*
          *   Frequentist: Long-run error rates, severity, sampling distribution, stopping rules matter.
          *   Bayesian: Likelihood Principle, updating beliefs, priors matter, stopping rules shouldn't matter (if data is fixed).

  3.  **Character Development:**
      *   *Frequentist (Let's call her "Elena"):* Focus on procedure, guardrails, objective error control. She represents the "Science as a Self-Correcting Machine" view.
      *   *Bayesian (Let's call him "Marcus"):* Focus on rational belief updating, coherence, the specific data at hand. He represents the "Science as Quantified Doubt" view.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. They are looking at Bem's paper. Establish the tension immediately.
      *   **Round 1: The Surface Conflict (The p-values).**
          *   Elena: The methods were standard. $p < .05$. Rejection of null.
          *   Marcus: Standard methods aren't enough for extraordinary claims. The Bayes Factor is weak.
      *   **Round 2: The Priors (The "Extraordinary Claims" argument).**
          *   Marcus: Psi is impossible/unlikely. Need strong evidence.
          *   Elena: Priors are subjective. If we let priors dictate acceptance, we never discover new things. The data should speak.
      *   **Round 3: The Likelihood Principle & Stopping Rules (The Core Technical/Philosophical Clash).**
          *   *Crucial Point:* This is where the prompt asks for "meat."
          *   Marcus: If I flip a coin 10 times and get 8 heads, the evidence is the same whether I planned 10 flips or planned to flip until 8 heads. The data is the data.
          *   Elena: No! The *intent* changes the sampling distribution. If you peek and stop, you inflate Type I error. The p-value accounts for what *could* have happened, not just what *did*.
      *   **Round 4: Defining Evidence.**
          *   Elena: Evidence is about ruling out noise (Error Control).
          *   Marcus: Evidence is about comparing hypotheses (Likelihood).
      *   **Conclusion:** The Stalemate. They realize they are playing different games. One is playing defense (against false positives), one is playing offense (updating belief).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I strawman the Frequentist?
      *   *Correction:* Make sure Elena doesn't just say "p-hacking is bad." She needs to argue that *without* error control, the literature becomes noise. She needs to defend the *process*, not just the specific result.
      *   *Check:* Did I explain the Likelihood Principle clearly?
      *   *Correction:* Use the coin flip analogy. It's the standard way to explain why stopping rules matter to Frequentists but not Bayesians.
      *   *Check:* Is the Bem context clear?
      *   *Correction:* Mention the "retroactive priming" specifically so students know which paper is being discussed.
      *   *Check:* Is the ending unresolved but insightful?
      *   *Correction:* Ensure they acknowledge that choosing a framework is a philosophical choice, not just a mathematical one.

  6.  **Polishing the Dialogue:**
      *   Add stage directions for pacing.
      *   Ensure the vocabulary is precise (Type I error, Likelihood Ratio, Sampling Distribution, Prior Odds).
      *   Keep the tone collegial but firm.

  7.  **Final Review against Prompt:**
      *   Dialogue format? Yes.
      *   Bem/Wagenmakers context? Yes.
      *   Non-strawmanned Frequentist? Yes (focus on error rates/severity).
      *   Bayesian substance (Likelihood Principle)? Yes.
      *   Deep layer disagreement (Evidence definition)? Yes.
      *   Stalemate ending? Yes.

  8.  *(Final Polish)*: Add a brief instructor's note at the top to frame how to use it in class. (This adds value for the user).

  **(Self-Correction Note):** Make sure Marcus doesn't sound like he's *defending* psi. He should be defending the *methodology* that shows psi is unlikely. Elena should be defending the *methodology* that allowed Bem to claim significance. The fight is about the *ruler*, not the *object*.

  9.  **Drafting the Content.** (Proceeds to generate output based on these thoughts).
answer: |-
  **Instructor's Note:** *This dialogue is designed for the "Statistics and Evidence" unit. It assumes students have encountered the basics of NHST (Null Hypothesis Significance Testing) and have heard of Bayes' Theorem, but may not grasp the philosophical implications of the Likelihood Principle or the definition of "error." The goal is to show that the Replication Crisis isn't just about bad actors, but about incompatible definitions of what counts as proof.*

  ***

  ### The Ruler and the Scale
  **A Dialogue on Bem, Wagenmakers, and the Definition of Evidence**

  **Characters:**
  *   **ELENA (Frequentist):** Defends error-statistics and long-run reliability.
  *   **MARCUS (Bayesian):** Defends belief-updating and the Likelihood Principle.

  **Setting:** *A faculty lounge, late afternoon. A printed copy of Daryl Bem's 2011 paper "Feeling the Future" sits on the table between them, covered in highlighter marks.*

  **ELENA:** (Tapping the paper) Look, I know psi is implausible. I know it sounds like magic. But you have to admit, methodologically, Bem followed the rulebook. Nine experiments. Standard NHST. Most of the p-values are under .05. By the conventions of our field for the last eighty years, this is a successful rejection of the null.

  **MARCUS:** And that is precisely the problem, Elena. The rulebook is broken. Wagenmakers showed this clearly. When you reanalyze these same numbers with Bayes Factors, the evidence for precognition evaporates. Most of the Bayes Factors are anecdotal at best. If the data truly supported the hypothesis, the Bayes Factor shouldn't care who is calculating it.

  **ELENA:** The Bayes Factor *does* care. It cares deeply about what you put in the numerator and the denominator. You guys smuggled in skepticism through the back door with your priors. You essentially said, "Psi is impossible, so show me overwhelming data." But if you set the prior that low, you'll never discover anything new. That's not analysis; that's gatekeeping.

  **MARCUS:** It's not gatekeeping; it's rationality. Extraordinary claims require extraordinary evidence. That's not a slogan; it's a mathematical necessity of conditional probability. If the prior probability of a hypothesis is near zero, a p-value of .04 doesn't move the needle. You're acting like the p-value is a measure of the *truth* of the hypothesis. It isn't. It's the probability of the data given the null.

  **ELENA:** I know what it is. It's a measure of *surprise*. It tells us that if there were no precognition, seeing this data would be rare. That *is* evidence. It's evidence that the noise isn't doing the work. My concern isn't about the prior; it's about the procedure. Bem's results passed a filter designed to catch false positives.

  **MARCUS:** Did they? That assumes the filter wasn't gamed. But let's put p-hacking aside for a moment. Let's assume Bem was perfectly honest. The deeper issue is that your "filter" depends on things that didn't happen. It depends on the *sampling plan*.

  **ELENA:** Of course it does. Intent matters.

  **MARCUS:** Why? That's the Likelihood Principle, Elena. Once the data is collected, the evidence contained in that data should depend only on what *did* happen, not on what *could* have happened. Imagine I flip a coin 10 times and get 8 heads.
  *   **Scenario A:** I planned to flip exactly 10 times.
  *   **Scenario B:** I planned to flip until I got 8 heads.
  The data is identical: 8 heads, 2 tails. The likelihood function is identical. But in your framework, the p-value is different. In Scenario B, you punish me because I *could* have flipped forever. How can the evidence change based on a thought in my head?

  **ELENA:** Because the "thought in your head" changes the probability of generating misleading data! If you allow Scenario B—if you allow optional stopping—you inflate the Type I error rate. You can eventually force a p < .05 even if the coin is fair, just by waiting for a lucky streak. My framework isn't trying to tell you the "truth" of this specific coin flip in isolation. It's trying to ensure that if we use this method for 100 years, we don't end up with a literature full of false positives. I'm protecting the *process*, not just the result.

  **MARCUS:** But science happens in the specific, not the hypothetical long-run. I am a scientist sitting here *now* with *this* data. I need to know how much I should believe the hypothesis *now*. Your method tells me: "If you repeated this experiment infinite times, you'd be wrong less than 5% of the time." That doesn't tell me if I should believe in psi *today*. It tells me about your error rates, not my evidence.

  **ELENA:** Because "evidence" without error control is just a story! You say you're looking at the likelihood of the data, but you can't calculate a Bayes Factor without a specific alternative hypothesis. Bem tested against the null (no effect). You tested against a specific distribution of effect sizes. When Wagenmakers changed the prior distribution on the effect size, the Bayes Factor changed. So don't talk to me about objectivity. You're just as dependent on modeling choices as I am.

  **MARCUS:** True, priors are subjective. But they are *explicitly* subjective. You can debate them. You can do a sensitivity analysis. What you can't do is hide behind the p-value. The p-value creates an illusion of objectivity. It says, "I have rejected the null," implying the alternative is true. But a low p-value and a low Bayes Factor can diverge. Jeffreys showed this decades ago. As sample size grows, a fixed p-value (say, .05) actually becomes *weaker* evidence against the null, because it's easier to find tiny, meaningless deviations with huge N. Your method overstates evidence in large samples.

  **ELENA:** And your method understates evidence in the face of novelty! If we had applied your standards to the discovery of gravity or germ theory, we might have waited centuries for "decisive" Bayes Factors. Sometimes you need a signal that says, "Hey, look here, this isn't just noise." That's what significance testing does. It's a screening tool. It's not meant to quantify belief; it's meant to warrant *action*. It warrants further investigation. Bem's paper warranted investigation. The fact that people tried to replicate it and failed is the system working!

  **MARCUS:** The system working? Thousands of researchers built careers on "significant" findings that turned out to be ghosts. That's not the system working; that's the system burning resources. The Replication Crisis happened because people treated p < .05 as a truth ticket. If they had treated evidence as a continuous updating of belief, we wouldn't have had this binary "publish or perish" on shaky ground.
  Here is the crux, Elena: You define evidence as **severity**. Has the hypothesis passed a test that would likely have failed if the hypothesis were false?
  I define evidence as **likelihood**. Does the data fit one hypothesis better than the other?
  In Bem's case, the data fits "precognition" better than "null" (Likelihood). But the test wasn't severe enough to rule out bias, because the prior odds are so low (Severity).

  **ELENA:** No, the test wasn't severe enough because the *replications* failed. But looking at the original data alone? The error probabilities were controlled. You want to judge the data in a vacuum. I judge the data in the context of the method that produced it. If the method allows you to stop whenever you like, the data is tainted, regardless of what the likelihood ratio says.

  **MARCUS:** And I say if the method ignores the actual data in favor of hypothetical repetitions that never occurred, it's superstition. You are worshipping the sampling distribution.
  So where does that leave us? We have the same numbers. Bem's Experiment 1.
  You see a result that passed a rigorous error-checking protocol.
  I see a result that shifts the odds only slightly, insufficient to overcome the implausibility of the claim.

  **ELENA:** We leave it here: We are asking different questions.
  I am asking: "Is this result distinguishable from noise, assuming we keep using this method?"
  You are asking: "How much should I believe this claim, given what I already know?"

  **MARCUS:** And neither question can be answered by the other's tools. If I use your tools, I can't quantify belief. If you use my tools, you can't guarantee long-run error rates.

  **ELENA:** Exactly. So when we look at the Replication Crisis...

  **MARCUS:** ...You see a failure of discipline. Researchers didn't stick to the pre-specified sampling plans. They peeked. They p-hacked. They broke the error-statistics contract.

  **ELENA:** And you see a failure of epistemology. Researchers thought a p-value was a measure of evidence, when it was never designed to be one. They confused rejecting a null with confirming a theory.

  **MARCUS:** (Sighs, closing the paper) So, do we agree on anything?

  **ELENA:** We agree that Bem's precognition claim is probably false.

  **MARCUS:** We agree on that. But we disagree on *why* the statistics tell us it's false. And until we agree on whether evidence is about **error control** or **belief updating**, we're just going to keep having this fight every time a surprising result hits the journals.

  **ELENA:** (Picking up her coffee) Then I suppose the seminar is going to be lively. Because the students need to know that choosing a statistical test isn't just a technical choice. It's a philosophical one.

  **MARCUS:** It's not just what ruler you use. It's what you think you're measuring.

  ***

  ### Discussion Questions for Seminar

  1.  **The Likelihood Principle:** Marcus argues that stopping rules shouldn't matter once data is collected. Elena argues they are essential. Can you construct a scenario where following Marcus's advice would lead to a scientifically disastrous conclusion? Conversely, where does Elena's approach seem overly conservative?
  2.  **The Definition of Evidence:** Elena defines evidence as "severity" (passing a hard test). Marcus defines it as "likelihood ratio" (fitting one model better than another). In the context of the Replication Crisis, which definition do you think was violated more often?
  3.  **Priors and Discovery:** Elena claims low priors prevent new discoveries; Marcus claims they prevent false beliefs. How should science handle "extraordinary claims" without stifling innovation or inviting nonsense? Is there a middle ground, or is this a fundamental trade-off?
  4.  **The Stalemate:** The dialogue ends with the agreement that the statistical choice is a *philosophical* choice. If you were designing a policy for a top journal (e.g., *Nature* or *Psychological Science*), which framework would you mandate, and why? Or would you allow both?
