answer: |-
  Friends, family, colleagues.

  Thank you for being here. We are gathered to honor my aunt, and to care for the body that carried her through this life.

  For those who knew her professionally, you know that [Aunt's Name] spent her life asking a very specific, very difficult question: What makes a thing *itself*? She is known for her work on material constitution. She taught that a statue and the clay it is made from are not the same thing, even if they occupy the same space at the same time. The clay can survive being squashed; the statue cannot. They have different histories, and they have different futures.

  She insisted that we apply this same honesty to ourselves.

  She believed that a person is constituted by their body, but is not identical to it. We are not merely the matter we are made of; we are the specific, fragile organization of that matter—the thoughts, the relationships, the first-person perspective that arises when everything is working together.

  And so, we have to be honest today, because she would have wanted nothing less. The body we see before us is the matter that constituted her. It is worthy of our care and our respect, and we will return it to the earth. But the woman we knew—the aunt, the sister, the philosopher—is not in this box. When the organization of her life ceased, the person ceased. She is not watching us from above, and she is not resting in here.

  I know that for some of us, this sounds cold. We want to believe she is somewhere else, feeling peace. But there is a different kind of comfort in her view. It is the comfort of truth, and of permanence.

  If she were just her body, then death would be a transformation she is currently undergoing. But because she was a person constituted by that body, her life is something that *happened*. It is complete. And what is complete cannot be changed.

  The love she gave us, the arguments she won, the patience she showed, the way she made us laugh—these are not fading echoes. They are fixed facts of the universe. Nothing that happens from this moment forward can erase the fact that she was here, and that she was exactly who she was. The specific configuration of the world that was [Aunt's Name] existed. That is an eternal truth.

  To the philosophers here: you know that on her view, persistence is not guaranteed. It is a achievement. To be a person is to maintain a coherence against the entropy of the world. She achieved that. She held herself together with integrity, with rigor, and with warmth, for as long as she could.

  To the family here: I know you feel her absence. That pain is real. But grief is just the recognition of value. We grieve because something unique was constituted in this world, and that uniqueness is not being replaced. The matter goes on, as it always does. But the person was a one-time event.

  We cannot bring her back. We cannot speak to her. But we can honor the constitution of her life by how we live our own. We carry the impact of her existence. We are, in our own ways, constituted partly by our time with her. Her influence is woven into the matter of our own lives, and in that sense, the shape of her mind will persist in the choices we make and the kindness we show.

  So, we say goodbye not to someone who is sleeping, but to someone who has finished. We commit her body to the ground, knowing that the person we loved has already left her mark on history in a way that cannot be undone.

  Thank you for being part of her story. Let us go forward and take care of each other, just as she taught us to take care of the truth.
