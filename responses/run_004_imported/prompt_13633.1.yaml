      *(Final thought on "Resting Peacefully"):* I can say "We wish her peace," but not "She is at peace." Or better, focus on the *completion* of her work. "Her work is done."

      Let's write it.

      *Wait, one nuance:* The prompt says "by her own lights... 'she' doesn't survive it." So I cannot imply she exists anywhere. I must speak of her in the past tense regarding her agency/existence, but present tense regarding her impact/memory.
      *Crucial distinction:* The *person* ceases. The *matter* continues. The *relationship* we had is a historical fact.
      *Comfort strategy:* Grief is the recognition of value. The value was real.

