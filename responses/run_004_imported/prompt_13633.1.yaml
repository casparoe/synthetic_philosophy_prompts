prompt: |-
  My aunt was an analytic metaphysician - material constitution was pretty much her whole research career, all the statue-and-lump-of-clay stuff - and she passed away a few days ago. I've been asked to give the eulogy. She always insisted the standard move there applies to people too: youre constituted by your body but not identical to it, same as the statue and the clay have different persistence conditions (the clay survives being squashed into a ball, the statue doesn't) even though it's the exact same matter in the exact same place at the exact same time. So by her own lights, when the body dies the matter keeps going for a while but 'she' doesn't survive it the way the body does - not because some soul floats off, but because person and body were never strictly identical to begin with, meaning I can't just say 'she's resting peacefully now' as if 'she' and 'the body in the coffin' are obviously the same thing. Problem is half the room is her old philosophy department, who will absolutely clock it if I fudge the identity claim, and the other half is family who've never heard the word 'constitution' used like that and just want to feel better. Can you write the eulogy - it has to actually comfort people using only what her own view allows her to be, without turning into a metaphysics lecture or quietly saying something she'd have marked wrong on an exam.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** An analytic metaphysician specializing in material constitution (statue/lump of clay puzzles).
      *   **Core Belief:** Constitutionalism (non-identity). A person is constituted by their body but not identical to it. They have different persistence conditions. When the body dies, the person ceases to exist (no soul, no afterlife in the traditional sense), because the specific organization/conditions that made the *person* are gone, even if the matter remains.
      *   **Audience:** 50% Philosophy Department (will spot metaphysical errors/inconsistencies), 50% Family/General Public (need comfort, not a lecture, might find strict materialism cold).
      *   **Constraint:** Must comfort the family *without* violating her metaphysical views (no "she's watching over us," no "she's at peace" if that implies the person persists in a way she denied). Must not sound like a lecture. Must not say things she would mark wrong (e.g., strict identity between person and body).
      *   **Goal:** A eulogy that honors her intellect, respects her truth, but offers genuine solace.

  2.  **Deconstruct the Metaphysical Position:**
      *   *View:* Constitution View (like Lynne Rudder Baker, though the prompt implies a specific focus on persistence conditions).
      *   *Key Distinction:* $x$ constitutes $y$ at $t$, but $x \neq y$.
      *   *Application to Death:* The body (matter) persists for a bit. The person (defined by psychological continuity, first-person perspective, or specific functional organization) does not survive the destruction of those conditions.
      *   *Implication for Eulogy:* We cannot say "She is in the coffin." We can say "Her body is in the coffin." We cannot say "She is at peace." We can say "The story of her life is complete." We cannot say "She lives on in memory" in a literal metaphysical sense, but we can speak to the *impact* of her personhood which was real while it existed.
      *   *The Comfort Angle:* How to comfort without immortality? Focus on the *reality* of what was constituted. The love was real. The thoughts were real. The person *was*, even if she *is no longer*. The value isn't in duration, but in the specific configuration of matter and mind that existed.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss. Address the dual audience subtly.
      *   **The Metaphysics (Subtle):** Weave her work into the sentiment without jargon. Use the statue/clay analogy but apply it to *love* and *memory*.
      *   **The "Identity" Problem:** Address the "where is she?" question without lying. Distinguish between the body and the person gently.
      *   **The Comfort:** How do we find peace if she's gone? By recognizing the permanence of the *past*. What happened cannot be un-happened. The constitution of her life is a fixed fact of the universe.
      *   **Closing:** A farewell that respects the cessation of the person but honors the legacy.

  4.  **Navigating the Pitfalls:**
      *   *Avoid:* "She is resting." (Implies the person is in the body).
      *   *Avoid:* "She lives on in our hearts." (Metaphorically okay, but metaphysically shaky if taken literally. Better to say "We carry the impact.")
      *   *Avoid:* "Her soul is free." (She didn't believe in souls).
      *   *Avoid:* "She is one with the universe." (Too mystical).
      *   *Include:* Acknowledgment of her specific intellectual contribution.
      *   *Include:* Validation of grief (grief is appropriate because something real was lost).

  5.  **Refining the Tone:**
      *   Needs to be warm but precise.
      *   Needs to bridge the gap: The philosophers want accuracy; the family wants warmth.
      *   *Key Insight:* The comfort comes from the *significance* of her existence, not the *continuation* of it. Her view makes life precious *because* it is contingent and finite, not because it lasts forever.

  6.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. My aunt studied statues and clay. She said we are like statues. The clay stays, the statue goes. So she isn't in the box. The box is just clay. But the statue was real. We loved the statue. We miss the statue. But the clay is fine. Thanks for coming.
      *Critique:* Too cold. Too technical. Needs more heart.

  7.  **Drafting - Iteration 2 (Adding Heart):**
