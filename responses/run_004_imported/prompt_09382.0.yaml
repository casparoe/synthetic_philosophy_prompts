      *   *Natural/Unnatural Framework:* Yes, it relies on the self-sufficient household (*oikos*) as the baseline. But it's not *just* bias; it's about limits. Natural wealth has a limit (you only need so much food). Unnatural wealth is infinite (you can always want more money).

