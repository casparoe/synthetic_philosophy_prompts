answer: |-
  This is a profoundly human question that happens to intersect with one of the most intricate puzzles in the history of moral philosophy. First, please accept my condolences on the loss of your grandmother. It is entirely understandable that you are unsettled by the tension between the comfort your aunt found and your own skepticism; that tension is, in fact, the very same one that occupied Henry Sidgwick for the last two decades of his life.

  To answer your specific question: **No, your working assumption is not quite fair.** While it is a common simplification, viewing Sidgwick's psychical research as a "sentimental footnote" separate from his ethics misses the structural role it played in his philosophical system.

  Modern scholarship (most notably Bart Schultz's definitive biography, *Henry Sidgwick: Eye of the Universe*) has established that Sidgwick's involvement with the Society for Psychical Research (SPR) was not a private hobby, but a desperate, rigorous attempt to solve the central crisis of his ethical theory.

  Here is how the two connect, and why it matters for how you might understand your aunt's experience.

  ### 1. The Ethical Problem: The Dualism of Practical Reason
  To understand why Sidgwick cared about ghosts, you have to understand the problem in *The Methods of Ethics*. Sidgwick argued that there are two primary rational methods for deciding how to act:
  *   **Rational Egoism:** It is rational to pursue your own happiness and self-interest.
  *   **Rational Utilitarianism:** It is rational to pursue the general good (the greatest happiness for the greatest number).

  The problem, which Sidgwick called the "Dualism of Practical Reason," is that these two methods do not always align. Sometimes, doing the morally right thing (Utilitarianism) requires a sacrifice that diminishes your own happiness (Egoism). If there is no guarantee that virtue will be rewarded or vice punished, then it is not strictly *rational* to be moral in every instance. Sidgwick found this conclusion devastating. He wanted to believe that the universe was morally ordered—that it is always rational to be good—but he could not find a logical proof for it within the material world.

  ### 2. The Psychical Solution
  This is where the SPR comes in. Sidgwick did not turn to spiritualism out of simple grief or credulity. He turned to it as an **empirical search for moral sanctions.**

  If he could find scientific evidence for:
  1.  **Survival after death,** and
  2.  **A divine governance that rewards virtue and punishes vice in the afterlife,**

  ...then the Dualism would be resolved. If being good leads to eternal happiness and being bad leads to eternal suffering, then self-interest and duty align. It becomes rational to be moral.

  Sidgwick hoped that psychical research could provide the empirical evidence that traditional religion could no longer supply in a scientific age. He wasn't looking for comfort; he was looking for **data** that would save his ethical system from incoherence.

  ### 3. The Tragic Outcome
  You noted that he found no evidence he considered adequate. This was not a minor disappointment; it was a philosophical catastrophe for him. Because the psychical research failed to yield proof of a moral order beyond the grave, Sidgwick died believing that the "Dualism of Practical Reason" remained unresolved. He famously wrote that if he were to die soon, "the thought that I have done what I could to make the world better... will not be enough to satisfy me."

  So, the psychical research was not a sidebar. It was the engine he built to try to fix the hole in his life's work. When the engine failed, the hole remained.

  ### 4. What This Means for Your Aunt
  Understanding this distinction might help you navigate the conversation with your aunt. Sidgwick's life offers a nuanced middle ground between "hard skepticism" and "blind credulity."

  *   **Sidgwick's Stance:** He acknowledged the *human need* for the belief (the comfort of moral order and survival) while maintaining the *intellectual integrity* to reject it without evidence. He respected the desire for contact without surrendering his standards of proof.
  *   **Your Aunt's Experience:** She is operating in the realm of what Sidgwick called the "ethics of belief" in a practical sense. For her, the medium provided a restoration of moral and emotional order. Whether the messages were objectively "real" in a physical sense matters less to her grief than the restoration of connection.

  Sidgwick would likely tell you that your aunt's comfort is real, even if the mechanism is unproven. He spent his life wishing such things *could* be true, precisely because he understood how much human morality and peace of mind depend on the hope of a universe that cares.

  ### Summary for Your Reflection
  You do not have to accept the medium's claims to validate your aunt's comfort. Sidgwick teaches us that the desire for survival is often a desire for moral coherence.

  If you speak to your aunt, you might avoid the trap of debating the mechanics of the medium (which Sidgwick spent 20 years doing without satisfaction). Instead, you might acknowledge what Sidgwick eventually recognized: that the hope for connection is a fundamental part of the human ethical experience. You can honor the *value* of the experience for her without committing to the *truth* of the phenomenon yourself.

  Sidgwick's legacy isn't that he was a secret believer, but that he was a rigorous thinker who understood that some human needs are so deep that even the lack of evidence cannot fully extinguish the hope for them. That is a position you can hold with integrity while standing beside your aunt in her grief.
