  2.  **Deconstruct the Passage:**
      *   *Premise 1:* "White" (by itself) is not fixed (ding) to any particular white thing. It is abstract/universal.
      *   *Premise 2:* "White horse" means "white" *fixed* to a particular thing (a horse).
      *   *Intermediate Conclusion 1:* What is fixed to a particular thing is no longer "white" (the abstract universal).
      *   *Premise 3:* "Horse" involves no excluding (qu) among colors (brown/black are okay).
      *   *Premise 4:* "White horse" *does* exclude among colors (brown/black are not okay).
      *   *Intermediate Conclusion 2:* What does not exclude $\neq$ what does exclude.
      *   *Final Conclusion:* A white horse is not a horse.

  3.  **Address Question 1 & 2: Fixed vs. Unfixed White:**
      *   *Concept:* This is a distinction between a universal (the concept of whiteness) and a particular instance (whiteness inhering in an object).
      *   *Unfixed (Ding):* The abstract concept "White." It exists independently of any specific object. You can think of "white" without thinking of a horse, a stone, or a feather. It is "unlocated."
      *   *Fixed (Ding):* The attribute "white" when it is attached to a specific substrate (a horse). It becomes "white-in-the-horse."
      *   *Why "no longer white"?* This is the tricky metaphysical claim. Gongsun Long seems to be arguing that once the universal is instantiated, it loses its purity as a universal. The abstract "White" is the *name* of the quality itself. The concrete "white" in a "white horse" is a *compound* of quality + substrate. Therefore, the "white" in "white horse" is not the same entity as the standalone "White." It's a category error to equate the instantiated attribute with the abstract attribute.
      *   *Analogy:* Think of "Water" (the chemical concept H2O) vs. "Water in a cup." If I ask for "Water," I mean the substance generally. If I point to "Water in a cup," that is a specific instance. Gongsun Long pushes this further: The *name* "White" refers *only* to the abstract. Once fixed, it changes ontological status.

  4.  **Address Question 3: Connection to Exclusion (Qu):**
      *   The argument shifts from metaphysics (fixed/unfixed) to logic/semantics (extension/intension).
      *   *Horse:* The extension includes all horses regardless of color. It is "open" regarding color.
      *   *White Horse:* The extension is restricted. It excludes non-white horses.
      *   *Connection:* The "fixing" of white limits the scope. Because "white" is fixed to the horse, it imposes a constraint. The abstract "White" doesn't constrain anything (it's just a quality). But "White Horse" creates a specific category that *excludes* other possibilities that "Horse" allows.
      *   *Logic:* $A$ (Horse) allows $x, y, z$. $B$ (White Horse) allows only $x$. Since the set of allowed responses differs, $A \neq B$.
      *   *Synthesis:* The "fixing" creates the "exclusion." By pinning the color to the shape, you create a compound term that has different logical conditions for satisfaction than the shape term alone.

  5.  **Address Question 4: Standalone vs. Restatement:**
      *   *Earlier Argument:* "Horse" = Shape. "White" = Color. "White Horse" = Color + Shape. Color + Shape $\neq$ Shape. (Compositional argument).
      *   *Current Argument:* "White" = Abstract/Unfixed. "White Horse" = Concrete/Fixed + Exclusionary. "Horse" = Non-exclusionary. Fixed/Exclusionary $\neq$ Non-exclusionary. (Modal/Logical argument).
      *   *Comparison:* They reach the same conclusion but use different mechanisms. The first is about *categories of attributes* (Color vs. Shape). The second is about *ontological status* (Universal vs. Particular) and *logical extension* (Exclusion vs. Non-exclusion).
      *   *Verdict:* It adds depth. It moves from "these are different kinds of names" to "these names function differently in reference and truth conditions." It's not *just* a restatement; it's a reinforcement using semantic range and metaphysical fixation.

  6.  **Drafting the Reconstruction (Iterative Process):**
      *   *Step 1: Define Terms.* Need to clearly define *ding* (fixed/determined) and *qu* (exclude/remove).
      *   *Step 2: Map the Logic.*
          1.  Abstract White $\neq$ Concrete White (in a horse).
          2.  "White Horse" uses Concrete White.
          3.  Therefore, the "White" in "White Horse" is not the Abstract White.
          4.  "Horse" accepts all colors.
          5.  "White Horse" rejects non-white colors.
          6.  Different acceptance criteria $\rightarrow$ Different terms.
      *   *Step 3: Explain the "No longer white" claim.* This is the crux. It's about the distinction between the *name* of the quality and the *instance* of the quality. If "White" names the universal, an instance is not the universal.
      *   *Step 4: Connect Fixing to Excluding.* Fixing the attribute restricts the extension. Unfixed = Unlimited extension regarding that attribute. Fixed = Limited extension.
      *   *Step 5: Evaluate Independence.* Compare with the Shape/Color argument. Acknowledge the overlap but highlight the shift to logical extension.

  7.  **Refining the Interpretation (Self-Correction/Nuance):**
