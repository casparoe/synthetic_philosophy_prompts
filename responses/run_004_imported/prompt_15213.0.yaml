      *   *Is lying always wrong for Augustine?* Yes. *De Mendacio* and *Contra Mendacium* are unequivocal. Even the "officious lie" (to save a life) is a sin, though a venial one compared to pernicious lies.
      *   *Did Augustine endorse misleading truths?* Yes, specifically regarding Abraham and Sarah. He argues that if there is *some* truth in the statement (she is a half-sister), it's not a lie, provided the intent isn't to deceive maliciously. However, he distinguishes between *hiding* the truth and *uttering* falsehood.
      *   *The Firmus Story:* Augustine praises Firmus. But Firmus *refused* to speak. He didn't lie. Augustine holds this up as the ideal: silence over falsehood.
