          *   *Analysis:* Owen is right on Augustine's *conclusion* (lying is always sin), but maybe simplistic on the *application*. Firmus faced officials; Abraham faced a specific cultural context.
      *   *Elena's Move 1:* Firmus comparison fails. Interrogation $\neq$ doorstep crisis. Refusal = confirmation here.
          *   *Analysis:* Strong point. Context matters. Augustine acknowledges circumstances affect *gravity*, though not *sinfulness*.
