          *   *Analysis:* This is the core of the "mental reservation" or "broad vs. strict speaking" debate. Augustine *does* allow for ambiguous speech if the intent isn't to deceive, but he's wary of it. Owen is channeling the later Casuist tradition (Aquinas, etc.) more than pure Augustine, but it's consistent with Augustine's Abraham example.
      *   *Elena's Move 2:* Distinction without a difference. Outward effect is the same. Rule only protects Mateo's soul, not the victim.
