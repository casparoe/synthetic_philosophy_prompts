      *   **Target Audience/Stakeholders:** Clinicians, Patients, Regulators.
      *   **Task:** Describe the most important implications for interpreting and communicating these risk estimates.

  2.  **Understand the Reference Class Problem (RCP) in this Context:**
      *   *What is it?* To assign a probability to a single event (e.g., Patient X gets cancer), you need to place them in a reference class (e.g., 50-year-old males). But Patient X belongs to *many* classes (50-year-old males, smokers, BRCA1 carriers, people who live in City Y, etc.). Different classes yield different probabilities. Which one is the "true" risk?
      *   *Hájek's Point:* It's not just a frequentist issue. Even Bayesian or propensity interpretations struggle because the *conditions* for the probability depend on how you carve up the world.
      *   *Precision Medicine Paradox:* The goal is "individualization," but probability *requires* generalization (a class). The more specific the class, the smaller the sample size (increasing uncertainty); the broader the class, the less relevant it is to the individual.

  3.  **Brainstorm Implications for Stakeholders:**

