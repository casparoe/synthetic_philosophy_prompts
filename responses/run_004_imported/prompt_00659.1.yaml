  2.  **Deconstruct Aaronson's Objection:**
      *   **Core Claim:** IIT predicts high consciousness ($\Phi$) in systems that intuitively seem non-conscious (error-correcting codes, expander graphs).
      *   **Methodology:** "Common-sense test." If a theory contradicts strong intuitions about clear cases, the theory is wrong.
      *   **Implication:** IIT is pseudoscience because it fails this validation check.

  3.  **Brainstorming Defenses of IIT (The "Strongest Case"):**
