      *   *Why?* This respects her competence (she decides who knows) while testing the family's *Ubuntu* claim (does she actually view herself relationally?). It prevents the family from imposing *Ubuntu* on her (which would be paternalistic).

  5.  **Drafting the Opinion - Section by Section:**
