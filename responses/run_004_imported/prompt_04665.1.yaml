answer: |-
  The seminar room smelled of dry-erase markers and stale coffee. It was past six; the cleaning staff wouldn't come for another hour. Outside, the campus was emptying out, but inside, the air was still pressurized from the last three hours of debate.

  Priya was packing her bag. Daniel was leaning against the podium, arms crossed, watching her. He hadn't moved since the professor had dismissed them.

  "You're not going to let this go," Priya said. She didn't look up. She was shoving a stack of handouts into her satchel with more force than necessary.

  "The FID passage," Daniel said. "In your draft. You asked me to read it. I read it."

  "And?"

  "And you put the term in the narrator's mouth. Not in dialogue. Not in a quote. In free indirect discourse. You rendered the bigot's thought, but you used the syntax of the narrative voice."

  Priya zipped the bag. She finally looked at him. "It's free indirect style, Daniel. It's supposed to be porous. It's the character's consciousness filtered through the narrator's grammar."

  "Exactly. Filtered." Daniel pushed off the podium and took a step toward the table where she was working. "If your semantic view is right—if the derogatory content is truth-conditional, part of the literal assertion—then the narrator is asserting a falsehood. The narrator is saying, as a matter of fact, that this person satisfies the conditions of the slur. But nobody satisfies those conditions. So the narrator is lying."

  "The narrator isn't asserting," Priya said, her voice tight. "The narrator is reporting a perspective. If I write *He wondered if the train would be late*, I'm not asserting the train will be late. I'm asserting that *he wondered*."

  "But you didn't write *He thought the S-word thought*," Daniel said, lowering his voice on the reference. "You wrote the thought itself. *The S-word was waiting on the platform.* If the slur carries its toxicity in its truth conditions, then that sentence is objectively false, regardless of who is thinking it. By writing it unquoted, you've made the narrative voice complicit in the falsity. You've made the ugliness a feature of the world you're building, not just the character's mind."

  Priya walked around the table and sat on the edge, crossing her arms. "So, on your view, it's better? You think the pragmatic account saves the narrator?"

  "Better, yes. Not clean." Daniel leaned against the adjacent desk. "If I'm right, the truth-conditional core of the slur is neutral. It just picks out a group. The contempt is a conventional implicature. It's an overlay. So when the narrator uses it in FID, the narrator is accurately describing the group—the truth part is fine—but the *attitude* is the problem. The narrator is invoking a convention of contempt."

  "Invoking a convention," Priya repeated. "That sounds so sterile. Like it's a piece of silverware."

  "It explains why it feels dangerous but not factually wrong," Daniel countered. "The narrator isn't stating a falsehood. The narrator is adopting a stance. And sure, that's morally risky. But on your view? On your view, the narrator is stating a lie about human worth. That's worse. That makes the narrative voice ontologically committed to the bigotry."

  Priya shook her head. "You're missing the projection problem, Daniel. If the content were just pragmatic, just an implicature, it should disappear in certain contexts. It should be cancelable. But it's not. You can't say *He's an S-word, but I don't mean anything bad by it.* It sticks. That stickiness suggests it's semantic. It's baked into the truth conditions."

  "That stickiness is social, not semantic," Daniel said. "It's a convention so strong it feels like logic. But look at the other case. The one you're saving for Chapter Four."

  Priya went still. "Don't."

  "Reclamation," Daniel said. "You. Your friends. Using the term at dinner. Laughing. Affectionate."

  "What about it?"

  "If you're right," Daniel said, pressing the advantage, "if the derogatory content is truth-conditional, then when you use it, you are literally asserting that your friend satisfies the conditions of inferiority encoded in the word. You're saying something false. So either you're lying to your friends, or you're using a different word that just looks like the slur."

  "I'm not using a different word," Priya said. "I'm using the same lexical item. But the context shifts the semantic value. The truth conditions are context-sensitive. In the mouth of the bigot, the condition is *inferior member of group G*. In my mouth, with my friends, the condition is *resilient member of group G*."

  Daniel laughed, a short, sharp sound. "That's ad hoc, Priya. That's you moving the goalposts to save the theory. You're saying the semantics of the word flip based on the speaker's identity? That's not semantics. That's pragmatics. That's exactly my point. The core reference stays the same—*member of group G*—but the expressive value flips from *boo* to *hurrah*."

  "If it were just expressive," Priya shot back, "why can't a bigot use it affectionately? Why can't the guy from the FID passage use it to mean *resilient*?"

  "Because conventions take time to change," Daniel said. "Because he's not part of the community that's renegotiated the implicature."

  "See?" Priya leaned forward. "Community membership determining meaning? That's semantic context. You're admitting that the word's content depends on who is speaking and who is listening. If the content depends on the context of utterance, then it's not a stable pragmatic overlay. It's part of what is said."

  "It's part of what is *conveyed*," Daniel corrected. "There's a difference. Look, think about the FID sentence again. If I'm right, and the content is neutral plus an attitude, then your narrator made a choice to invoke a toxic attitude to render a toxic mind. That's a moral choice, but it's linguistically coherent. The sentence can be true. The person *is* in group G. The contempt is the color of the glass."

  "But the glass is poisoned," Priya said quietly. "If I use that word, even in FID, I'm pouring the poison into the reader's head. If the toxicity is semantic, if it's part of the truth conditions, then the only way to use it without lying is to not use it at all. Unless..."

  "Unless?"

  "Unless the FID creates a boundary," Priya said. "A semantic boundary. The narrator isn't asserting the content. The narrator is *mentioning* the content without endorsing the truth conditions."

  "That's quotation," Daniel said. "Put it in quotes."

  "It kills the rhythm. It breaks the immersion." Priya stood up again, restless. "And what about me, Daniel? What about me using it with my friends? If you're right, and it's just a neutral core with an expressive overlay, then when I use it, I'm still invoking the convention. I'm still touching the poison. You're saying I'm just wearing gloves."

  "I'm saying you're repurposing the tool," Daniel said. "You're taking a hammer and using it to crack a nut instead of break a skull. The hammer is the same. The impact is different."

  "But the hammer remembers," Priya said. "That's the point of my view. The history is in the semantics. The falsity is in the word. When I use it with my friends, I'm not repurposing a tool. I'm disarming a bomb. And to disarm it, I have to acknowledge the wiring. I have to acknowledge that normally, this word would assert a lie about my worth. By using it affectionately, I'm actively negating the truth condition. I'm saying, *'We know this word says we are less, and we are saying it is not so.'*"

  Daniel rubbed his face. He looked tired. "So on your view, every time you use it affectionately, you're making a meta-linguistic claim about the oppression embedded in the lexicon?"

  "I'm saying the affection *is* the semantic shift. It's not just a vibe, Daniel. It's a change in what the word *does*. If it were just pragmatic, the bigotry would project out. It would still feel like an insult, just a wink. But it doesn't. It feels like love. That means the truth conditions have actually changed."

  "And the FID?" Daniel asked. "Does the narrator's usage change the truth conditions?"

  "No."

  "Then the narrator is lying."

  "The narrator is rendering a lie," Priya said. "There's a difference."

  "Is there?" Daniel pushed off the desk. "If I write *The sky was green*, I'm stating a falsehood. If I write *He thought the sky was green*, I'm stating a truth about his thought. But if I write *The S-word walked in*, in FID... I'm not saying *He thought an S-word walked in*. I'm saying *The S-word walked in*, but with his intonation. If the slur is semantic, if it's truth-conditional, then the sentence *The S-word walked in* is false. Full stop. The narrator has asserted a falsehood."

  "The narrator has asserted a falsehood *from the character's perspective*," Priya insisted. "That's what FID is. It's a hybrid voice."

  "It's a convenient fiction," Daniel said. "And it lets you off the hook too easily. You want the word to be heavy enough to carry the weight of oppression when the bigot uses it—semantic, truth-conditional, real—but light enough that you can wave it around in FID without the narrative voice collapsing under the weight. You want it to be heavy for them and light for you."

  "And you," Priya said, her voice dropping, "you want it to be light enough that the narrator can use it without lying, but heavy enough that it still hurts. You want the toxicity to be real enough to wound, but fake enough to be technically true. You want to have your cake and eat it too, Daniel. You want to say the bigot is telling the truth about the group membership, just with bad manners."

  "It's not bad manners," Daniel said, his patience fraying. "It's the difference between describing a knife and stabbing someone."

  "When the word is the knife," Priya said, "describing it is handling the blade."

  They stood there in the silence of the room. The hum of the ventilation system seemed to get louder.

  "So," Daniel said, softer now. "The FID sentence. In your book. Does it commit you?"

  Priya looked down at her hands. "If I'm right? Yes. It commits the narrative voice to the falsity. It risks the narrator sounding like them. Even if it's FID, the word is in the narrator's vocabulary. The narrator chose it."

  "And if I'm right?"

  "Then it commits the narrative voice to the attitude. The narrator chose to invoke the contempt, even if it's to report it. The narrator still touched it."

  "Either way," Daniel said, "you touched it."

  "I know."

  "And the reclamation?" Daniel asked. "Chapter Four. You and your friends."

  "If I'm right," Priya said, "we're changing the world. We're changing what the word means. We're making it true that the word can signify solidarity."

  "And if I'm right?"

  "Then we're just coping," Priya said. "We're taking a slur and pretending it's a hug. But the semantics stay the same. The history stays in the truth conditions. The word still refers to us as a target. We're just layering irony over it."

  Daniel walked over to where she was standing. He didn't touch her, but he stood close, in that space they had occupied for five years of grad school, through qualifying exams and breakups and the slow erosion of their certainty.

  "I don't think you're coping," Daniel said.

  "It doesn't matter what you think. It matters what the theory says."

  "The theory is a map, Priya. It's not the territory."

  "It's supposed to explain the territory." She looked up at him. "If I use that word with my friends, and you hear it, do you hear an insult?"

  "I hear you," Daniel said. "I hear the context."

  "But if you recorded it and played it for the bigot from the FID passage? If you stripped the context?"

  "Then it's just noise," Daniel said. "Or it's a weapon. Depending on who holds it."

  "That's pragmatism," Priya said.

  "That's life," Daniel countered. "Your semantics demand precision that language doesn't have. You want the word to be false when they say it and true when you say it. But the word is the same word. The phonemes are the same. The history is the same."

  "The uptake is different," Priya said. "And uptake determines meaning."

  "Uptake is pragmatic."

  "Uptake is everything."

  They stopped. The argument had run its course, circling back to the axioms they had started with, but now the stakes felt higher. It wasn't just about a seminar paper anymore. It was about the sentence Priya had already written, and the one she planned to write next.

  "So," Daniel said, picking up his own bag. "What are you going to do? With the FID sentence?"

  Priya hesitated. She looked at the whiteboard, where someone had left a half-erased logical proof from earlier. *P implies Q.*

  "If I take it out," Priya said, "I sanitize the bigot. I make his racism polite. I make it describable without contamination."

  "And if you leave it in?"

  "Then I risk the contamination. I risk the narrative voice sounding like him."

  "Or," Daniel said, opening the door, "you risk nothing. Because you're the one writing it. You control the context. That's the ultimate pragmatics, isn't it? Authorial fiat."

  Priya picked up her bag. She walked toward the door, stopping next to him.

  "I don't want it to be fiat," she said. "I want it to be true."

  "Maybe," Daniel said, holding the door open for her, "that's the only truth condition that matters."

  They walked out into the hallway together, the lights flickering off behind them, leaving the question suspended in the dark room, unresolved, like the rest of the dissertation.
