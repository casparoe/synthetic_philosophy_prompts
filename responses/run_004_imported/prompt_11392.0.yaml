answer: |-
  Here are 9 questions tailored for your seminar panel. They are designed to move past the "elevator pitch" of her argument and press on the technical and philosophical vulnerabilities of the Money-Pump justification.

  ### 1. The Resolute Choice Escape (Mandatory)
  **Question:** "You argue that the money pump provides the normative force for EU axioms that Dutch Books cannot. However, Edward McClennen's 'resolute choice' model suggests an agent can precommit to a plan at the initial node and refuse to reconsider at subsequent nodes, effectively blocking the pump even with non-EU preferences. If resolute choice is a rational strategy, doesn't the money pump fail to demonstrate *irrationality*, merely demonstrating *sophistication*?"

  *   **Predicted Response:** She will likely argue that resolute choice is dynamically inconsistent or requires a 'magic' precommitment technology that isn't available in standard decision problems. She'll claim rationality requires local consistency at every choice node.
  *   **Follow-up:** "But if the only way to save the Money Pump argument is to rule out precommitment by fiat, aren't you defining rationality as 'vulnerability to pumps' rather than deriving it? If an agent can successfully navigate the world resolutely without losing resources, in what sense are they normatively deficient?"

  ### 2. Cardinality and Uniqueness (Mandatory)
  **Question:** "The Money Pump argument is excellent for establishing transitivity and completeness, but Expected Utility requires a *cardinal* utility function, not just an ordinal ranking. Does the Money Pump argument itself generate the cardinal structure, or are you implicitly smuggling in the von Neumann-Morgenstern independence axiom to get the unique representation? If the latter, isn't the Pump just a dramatization of the axioms rather than an independent justification?"

  *   **Predicted Response:** She will likely concede the Pump handles the ordering but argue that when combined with risk (lotteries), the pump dynamic forces the linearity required for cardinality.
  *   **Follow-up:** "If the cardinality relies on the structure of the lotteries rather than the pump dynamic itself, doesn't that mean the Pump is parasitic on the VNM framework it's supposed to justify? Can you construct a pump that forces cardinality without already assuming the independence axiom?"

  ### 3. Descriptive vs. Normative in AI Safety (Mandatory)
  **Question:** "Your work is frequently cited in AI alignment literature, specifically the 'Coherent Agent' thesis which suggests advanced AI must converge to EU maximizers to avoid exploitation. Is your argument meant to be a normative claim about how we *should* build AI, or a descriptive claim that any sufficiently capable system *will* necessarily eliminate money-pump vulnerabilities? If it's the latter, do we have any empirical evidence that non-EU systems can't survive in competitive environments?"

  *   **Predicted Response:** She will likely lean normative: we *ought* to build EU agents to ensure safety/predictability. She may argue that non-EU agents are inherently unstable under optimization pressure.
  *   **Follow-up:** "If it's normative, why assume human values (which seem prone to Allais-type violations) should be forced into an EU straitjacket for alignment? If it's descriptive, doesn't the existence of successful biological organisms with intransitive preferences undermine the claim that evolution/competition eliminates pump-vulnerabilities?"

  ### 4. Separability and History-Dependence
  **Question:** "Money pumps rely heavily on the 'separability' assumption—that the value of a current choice is independent of the path taken to reach it. But many plausible preference structures, like regret theory or status-quo bias, are history-dependent. If an agent values the *narrative* of their choices and not just the final outcome, the pump doesn't register a 'loss.' Are you ruling out history-dependent preferences as irrational by definition?"

  *   **Predicted Response:** She will argue that rational agents should only care about final world-states (consequentialism). If you care about the path, that should be modeled as part of the outcome description.
  *   **Follow-up:** "But if we can model *anything* as part of the outcome description to save the axioms, doesn't the theory become unfalsifiable? At what point does re-describing the outcome to fit EU become ad hoc rather than explanatory?"

  ### 5. The "Malicious Bookie" Problem
  **Question:** "Dutch Book arguments work because incoherent credences lead to a sure loss regardless of the state of the world. Money pumps, however, usually require a specific sequence of offers from a bookie. In a natural environment without a malicious actor specifically targeting your preference cycles, an intransitive agent might never encounter the full cycle. Does this mean the irrationality is contingent on the environment rather than internal to the agent?"

  *   **Predicted Response:** She will argue that the *possibility* of the pump is what matters for coherence, similar to how a logical contradiction is false even if no one points it out.
  *   **Follow-up:** "But logical contradictions are true in all possible worlds. A money pump only exists in worlds with specific market structures. If the 'irrationality' disappears in a frictionless or non-adversarial environment, is it really a violation of rationality, or just a strategic vulnerability?"

  ### 6. Transaction Costs and Friction
  **Question:** "Real-world choices involve transaction costs—time, cognitive load, and fees. A theoretical money pump assumes frictionless trades. If even minimal transaction costs exist, the pump cycle breaks before the 'sure loss' is realized. Does your justification for EU axioms depend on an idealized frictionless economy that doesn't exist, and if so, does the normativity collapse in the real world?"

  *   **Predicted Response:** She will likely treat this as a 'performance' error vs. 'competence' distinction. The axioms hold for ideal agents; friction explains why humans deviate.
  *   **Follow-up:** "If the axioms only hold in frictionless environments, can we really use them to critique actual agents (human or AI) who always operate under friction? Isn't that like critiquing a swimmer for not obeying Newtonian physics in a vacuum?"

  ### 7. Regret Theory and Loomes & Sugden
  **Question:** "Loomes and Sugden developed Regret Theory which explicitly allows for cyclic preferences based on anticipated regret, and they argue this is rational. Since Regret Theory agents can be money-pumped, does your argument simply conclude that Regret Theory is irrational? If so, aren't you begging the question against a major rival theory that explains empirical data better than EU?"

  *   **Predicted Response:** She will argue that Regret Theory violates the sure-thing principle and leads to dynamic inconsistency, which is the deeper irrationality the pump exposes.
  *   **Follow-up:** "But if 'dynamic inconsistency' is just another name for 'changing your mind based on new counterfactuals,' why is that irrational? Isn't learning from the road not taken a feature of intelligence, not a bug?"

  ### 8. The Link Between Credences and Preferences
  **Question:** "You distinguish Dutch Books (credences) from Money Pumps (preferences). However, in frameworks like Jeffrey's Decision Theory, credences and preferences are derived from a single primitive ordering. If the separation isn't fundamental, doesn't justifying preferences via pumps while justifying credences via Dutch Books create a fragmented foundation? Why shouldn't a unified accuracy-dominance argument cover both?"

  *   **Predicted Response:** She will argue that beliefs aim at truth (hence Dutch Book/Accuracy) while actions aim at good outcomes (hence Money Pump), so the norms are distinct.
  *   **Follow-up:** "But if my actions reveal my beliefs (revealed preference), and my beliefs guide my actions, can they really be normatively separated? If I have coherent beliefs but pumpable preferences, isn't there a tension in the agent's psychology that a unified theory should explain?"

  ### 9. The "Sure Loss" Interpretation
  **Question:** "The Money Pump concludes you end up with less money than you started. But this assumes money is the metric of utility. If an agent derives utility from the *act of choosing* itself (e.g., expressing freedom or variety), they might willingly pay to cycle through options. In that case, they haven't suffered a utility loss, only a monetary one. Does the Money Pump argument conflate monetary loss with utility loss?"

  *   **Predicted Response:** She will argue that if money is the numeraire for the experiment, losing it is a loss. If they value variety, that should be priced into the initial valuation.
  *   **Follow-up:** "If we have to price 'variety' or 'freedom' into the initial valuation to make the math work, aren't we just retrofitting the utility function to ensure the pump doesn't happen? That makes the argument circular: agents aren't pumped because we defined their utility to prevent pumping."
