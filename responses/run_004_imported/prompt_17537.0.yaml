answer: |-
  Here are 10 interview questions designed to press the guest on the implications and vulnerabilities of her thesis, including the specific required topics and follow-ups.

  **1. The Necessity Claim**
  You argue that Sidgwick's SPR work wasn't a hobby but a philosophical necessity forced by the Dualism of Practical Reason. But Sidgwick was famously cautious about leaping from "I need X to be true" to "X is true." At what point does a *philosophical need* for evidence of a moral order become an *epistemic bias* in evaluating that evidence? Is there a tension here between Sidgwick the rigorous empiricist and Sidgwick the desperate theist?
  *   **Follow-up:** If it was truly necessary for his system, why did he wait until his late 30s to dive into the SPR? Does that lag suggest it was a crisis of faith rather than a structural requirement of the *Methods*?

  **2. The Asymmetry of Disconfirmation (Required Topic)**
  Let's talk about the empirical track record. In his ethical work, Sidgwick treats common-sense morality as a hypothesis to be tested and often discarded. Yet with the SPR, you have cases like the Creery sisters or various mediums where fraud or chance was strongly indicated, but Sidgwick often treated these as "inconclusive" rather than disconfirming. Why doesn't the repeated null result in psychical research count as a falsification the way it would for a utilitarian calculation?
  *   **Follow-up:** Are you suggesting Sidgwick applied a lower burden of proof to the supernatural because the *cost* of accepting naturalism was too high for his practical reason?

  **3. The "Chaos" Passage (Required Topic)**
  The famous "Chaos and Darkness" passage closing *The Methods of Ethics* is usually read as Sidgwick admitting the failure of his system to reconcile duty and interest. Your reading suggests the SPR was the ladder out of that chaos. But does your thesis actually *need* the Chaos passage to go through as stated? Could Sidgwick have pursued psychical research with the same intensity even if he hadn't ended the *Methods* with such a bleak warning?
  *   **Follow-up:** If the SPR had succeeded in his lifetime, would the "Chaos" passage have disappeared in the next edition, or was that despair foundational to his philosophical voice regardless of the data?

  **4. Eleanor Sidgwick's Role (Required Topic)**
  Eleanor Sidgwick was deeply involved in the SPR, particularly the Census of Hallucinations. Her approach is often characterized as more statistically rigorous and skeptical than Henry's. Do you read her involvement as part of the same existential project—trying to save Henry's dualism—or should we view her work as a distinct, perhaps more genuinely scientific, enterprise that Henry co-opted for his own philosophical survival?
  *   **Follow-up:** If Eleanor's data suggested a harder "no" than Henry was willing to accept, do we have evidence of friction there, or were they complicit in maintaining the hope?

  **5. The Survival Pact (Extra Credit)**
  There's the famous pact Sidgwick made with Myers and Gurney: the first to die would try to communicate with the others. Both Myers and Gurney died before Sidgwick, and by most accounts, they didn't deliver much in the way of verifiable evidence. How does your reading accommodate this specific failure? Did Sidgwick view the silence from his friends as a failed experiment, or did he categorize it as "inconclusive" to protect the hypothesis?
  *   **Follow-up:** If the people closest to him couldn't breach the veil, doesn't that undermine the claim that psychical research was a viable empirical solution to the Dualism?

  **6. The Nature of the "Coincidence"**
  Schultz's "Eye of the Universe" reading focuses on Sidgwick's desire for an omniscient perspective to validate morality. You're pushing this to say SPR was the *only* place left to look. But even if the SPR proved survival of the soul, does that actually guarantee the *coincidence* of duty and self-interest? A happy afterlife doesn't necessarily reward utilitarian sacrifice specifically. How does SPR evidence bridge that specific gap?
  *   **Follow-up:** Is it possible Sidgwick knew the gap wouldn't fully close, but the SPR work was just about keeping the *possibility* alive rather than securing the proof?

  **7. Public vs. Private Rationality**
  Sidgwick was careful to keep his SPR work somewhat distinct from his public ethical philosophy. If your reading is correct—that the SPR is the keystone holding up the *Methods*—doesn't that imply a kind of esotericism? Was Sidgwick presenting a public philosophy he knew was unstable without a private, empirical crutch he couldn't fully publish?
  *   **Follow-up:** Does this make Sidgwick less of a public utilitarian and more of a private fideist using empirical language?

  **8. The "Hobby" Defense**
  Critics might say you're over-intellectualizing what was, for many Victorians, a cultural fascination. What's your response to the deflationary claim that Sidgwick just got swept up in the spiritualist zeitgeist, and that linking it so tightly to the Dualism of Practical Reason imposes a coherence on his life that wasn't there?
  *   **Follow-up:** How do you distinguish between a philosopher interested in ghosts and a philosopher who *needs* ghosts to make his ethics work?

  **9. Alternative Resolutions**
  If the SPR path was blocked, what was the alternative for Sidgwick? You argue the SPR was forced on him by the loss of religious guarantee. But why not simply accept the Dualism as a tragic brute fact? Is your argument that Sidgwick was psychologically incapable of living with that contradiction, or that the philosophy itself becomes incoherent without the resolution?
  *   **Follow-up:** If it's just psychological, does that undermine the normative force of his ethics?

  **10. The Cost of the Project**
  Finally, let's look at the cost. If we accept your reading, we have to admit that three decades of Sidgwick's life were spent chasing evidence that largely never arrived. Does this make Sidgwick a tragic figure who wasted his empirical rigor on a wild goose chase, or do you see value in the attempt itself, regardless of the null results?
  *   **Follow-up:** Does acknowledging this "desperation" change how we should teach the *Methods* today, or is it a biographical footnote that stays out of the classroom?
