answer: |-
  **Setting:** *A dimly lit observation room behind a one-way mirror. On the other side, Sleeping Beauty sits at a table, blinking. A speaker on the wall has just crackled with the voice of an experimenter: "For the record, today is Monday." Beauty looks thoughtful, pen hovering over a questionnaire asking for her credence in Heads.*

  *Inside the observation room, **ELIAS** (Thirder) and **MARA** (Halfer) watch the monitors. Elias holds a clipboard; Mara leans against the console, arms crossed.*

  **ELIAS:** There it is. The reset button. She knows it's Monday now. The Tuesday possibility is dead for this run. Her credence in Heads has to snap back to 1/2.

  **MARA:** Does it? According to my model, she should be writing down 2/3.

  **ELIAS:** *(Turns sharply)* 2/3? Mara, we're talking about a fair coin. She knows it's Monday. That means the experiment effectively ends today. If the experiment ends today, the fact that she *would* have been woken tomorrow on Tails is irrelevant. It's just a coin flip. How can knowing the day of the week make her think the coin is biased toward Heads?

  **MARA:** It doesn't make the coin biased. The coin is still 50-50 physically. But her *evidence* has changed in a way that disproportionately eliminates Tails-worlds.

  **ELIAS:** That's the magic trick I can't swallow. Look, let's trace the information flow. On Sunday, she says 1/2. She wakes up. You say she stays at 1/2 because she learned nothing new—she knew she'd wake up. Fine. But now? She just learned "It is Monday." That is new information. She didn't know that for sure when she opened her eyes.

  **MARA:** Agreed. It's new self-locating information.

  **ELIAS:** Okay. So we update. But "It is Monday" is independent of the coin toss. The experimenters didn't look at the coin to decide what day to tell her. They just looked at the calendar. If I tell you the coin landed Heads, does that change the probability it's Monday? No. If I tell you it's Monday, why should it change the probability of Heads?

  **MARA:** Because of how the "Monday" hypothesis overlaps with the "Tails" hypothesis in her probability space. Think about the three centered worlds she considers possible when she first wakes up. Heads-Monday, Tails-Monday, Tails-Tuesday.

  **ELIAS:** Right. The trichotomy.

  **MARA:** No, stop. That's *your* trichotomy. In my view, when she wakes up, she assigns 1/2 to Heads. That entire 1/2 mass is on Heads-Monday. She assigns the other 1/2 to Tails. But that Tails mass is split between Tails-Monday and Tails-Tuesday. Since she has no reason to favor one day over the other within the Tails scenario, she splits that 1/2 evenly. So, on waking: Heads-Monday is 1/2. Tails-Monday is 1/4. Tails-Tuesday is 1/4.

  **ELIAS:** There it is. You're weighting the awakenings differently. You're saying the single Heads awakening is twice as "heavy" as a Tails awakening.

  **MARA:** I'm saying the *coin outcome* is the primary event. The awakenings are just consequences. So, look at the update. She learns "It is Monday." That rules out Tails-Tuesday. That 1/4 probability mass goes to zero. What's left? Heads-Monday (1/2) and Tails-Monday (1/4). Normalize them. 1/2 is twice as big as 1/4. So Heads gets 2/3 of the remaining mass.

  **ELIAS:** And that is absurd. It implies that if you run this experiment a thousand times, and every time you tell the subject "It's Monday" immediately upon waking, she should bet on Heads 66% of the time. But the coin is fair! Half the experiments are Heads. In all those Heads experiments, it's Monday. In the Tails experiments, it's also Monday (the first time). So in the set of "Monday Interviews," half are Heads and half are Tails.

  **MARA:** No, that's the frequency trap. You're counting *interviews*. I'm counting *experiments*.

  **ELIAS:** But she's *in* an interview! She's not betting on the experiment from the outside; she's betting from the inside. If "It is Monday" is the evidence, we have to look at the probability of that evidence given the hypotheses. $P(\text{Monday} | \text{Heads})$ is 1. $P(\text{Monday} | \text{Tails})$ is... what?

  **MARA:** It's 1. She is woken on Monday in both cases.

  **ELIAS:** Exactly! If $P(\text{Mon} | H) = 1$ and $P(\text{Mon} | T) = 1$, then by Bayes' theorem, learning "Monday" provides zero evidence. The likelihood ratio is 1:1. Her posterior should equal her prior. If her prior on waking was 1/2 (your position), her posterior must be 1/2. You can't have it both ways, Mara. You can't say she learns nothing on waking (keeping it 1/2) and then say "Monday" is evidence that shifts it to 2/3.

  **MARA:** You're treating "Monday" as a simple proposition. It's not. It's indexical. "Today is Monday" means something different depending on *when* you say it. When she wakes up on Tuesday (in the Tails world), "Today is Monday" is false. When she wakes up on Monday, it's true.

  **ELIAS:** So?

  **MARA:** So, $P(\text{Today is Monday} | \text{Tails})$ is not 1. It's 1/2.

  **ELIAS:** *(Laughs)* How do you get that? In a Tails world, Monday definitely happens.

  **MARA:** From her perspective *at the moment of waking*, she doesn't know which awakening she's experiencing. In the Tails world, there are two distinct moments of experience. One is Monday, one is Tuesday. If she is in a Tails world, what is the probability that her current experience is the Monday one? 1/2.

  **ELIAS:** But that assumes the "Thirder" partitioning of the Tails world! You're smuggling in the idea that she is equally likely to be in the Monday-moment as the Tuesday-moment. But you just told me she assigns 1/2 to the whole Tails world on waking.

  **MARA:** I assign 1/2 to the Tails *world*. But within that world, I have self-locating uncertainty. I don't know *where* I am in the timeline.

  **ELIAS:** Okay, let's press on that. Why does self-locating uncertainty about the calendar affect the non-locating fact of the coin? Imagine I put you in a room. I flip a coin. If Heads, I put a red ball in a box. If Tails, I put a red ball and a blue ball in a box. I reach in and pull out a red ball. What's the probability of Heads?

  **MARA:** Standard Bayesian update. $P(\text{Red} | H) = 1$. $P(\text{Red} | T) = 1/2$. Posterior for Heads is 2/3.

  **ELIAS:** Right. Because drawing the red ball was more likely under Heads (100% chance) than Tails (50% chance). But in Sleeping Beauty, is "waking on Monday" more likely under Heads than Tails?

  **MARA:** Yes.

  **ELIAS:** How?

  **MARA:** Because under Heads, *every* awakening is Monday. Under Tails, only *half* of the awakenings are Monday.

  **ELIAS:** Aha! "Every awakening" vs "Half of the awakenings." You're counting awakenings again. You're treating the awakenings as the sample space. But you claim to be a Halfer! A Halfer says the sample space is the coin toss, not the awakenings. If the sample space is the coin toss, then in the Tails world, Monday happens with probability 1. It is guaranteed to occur.

  **MARA:** It is guaranteed to occur in the *world*, Elias. But it is not guaranteed to be *experienced now*. The evidence she receives is not "Monday occurs in this timeline." She knows that already. The evidence is "My current temporal location is Monday."

  **ELIAS:** And I'm telling you that temporal location is independent of the coin! The experimenters didn't say, "If Heads, we will tell her Monday. If Tails, we might lie." They just told her the truth.

  **MARA:** Consider the negation. Suppose she wakes up and is told, "It is Tuesday."

  **ELIAS:** Then she knows it's Tails. Credence in Heads goes to 0.

  **MARA:** Exactly. So "It is Tuesday" is evidence against Heads. It rules out Heads completely.

  **ELIAS:** Sure, because Heads-Tuesday doesn't exist.

  **MARA:** So "It is Monday" must be evidence *for* Heads. Because it rules out Tails-Tuesday, but it doesn't rule out anything in the Heads world. You can't have evidence that moves the needle one way without the negation moving it the other. If hearing "Tuesday" makes Tails certain, hearing "Monday" must make Heads more probable than it was before.

  **ELIAS:** But look at the magnitude! Hearing "Tuesday" moves you from 1/2 to 0. That's a massive shift. Hearing "Monday" moves you from 1/2 to 2/3? That asymmetry is weird.

  **MARA:** It's not asymmetry; it's ceiling effects. You can't go below 0. But the core logic holds. "Monday" is compatible with Heads and half-compatible with Tails.

  **ELIAS:** Half-compatible. There's that word again. Compatible with half the *awakenings*. Mara, this implies that if Beauty wants to be a rational Halfer, she has to believe that the mere passage of time from Monday to Tuesday, without any new external data, changes her credence in the coin.

  **MARA:** In this specific setup? Yes.

  **ELIAS:** That's wild. Imagine it's Monday morning. She says, "I believe Heads is 2/3." She goes to sleep. She wakes up Tuesday. She hasn't seen the coin. She hasn't talked to anyone. But now she knows it's Tuesday. She says, "I believe Heads is 0." So just by sleeping, her belief in a past coin flip changed.

  **MARA:** Her *self-locating* belief changed, which updated the non-locating belief. It's not magic. It's just that in this specific experiment, the timeline is correlated with the coin. In the Tails world, time passes twice. In the Heads world, time passes once. Finding yourself at a later time index makes the "two-step" world less likely relative to the "one-step" world.

  **ELIAS:** But she isn't finding herself at a "later time index" randomly. She's being told the date. Look, let's try a different angle. The "Reflection Principle." On Sunday, she knows that tomorrow she will be woken up. She also knows that tomorrow, she will not know what day it is. But she knows that *if* she were to be told it's Monday, she would update to... what?

  **MARA:** To 2/3.

  **ELIAS:** So on Sunday, she should predict: "Tomorrow, my credence in Heads will likely rise to 2/3."

  **MARA:** Yes.

  **ELIAS:** But she knows the coin is fair! On Sunday, she knows $P(Heads) = 1/2$. If she knows for a fact that tomorrow she will believe $P(Heads) = 2/3$ upon learning it's Monday, isn't she admitting that she expects to become irrational tomorrow? She expects to believe the coin is biased when she knows it isn't.

  **MARA:** She doesn't expect to become irrational. She expects to gain information.

  **ELIAS:** What information? The fact that the sun rose on Monday?

  **MARA:** The information that she is not in the Tuesday slot.

  **ELIAS:** But on Sunday, she already knows there is a 50% chance the Tuesday slot doesn't exist! If Heads, there is no Tuesday. If Tails, there is. When she wakes up and hears "Monday," she hasn't learned that the Tuesday slot doesn't exist. She's only learned she isn't *in* it.

  **MARA:** And that is the distinction. "The slot doesn't exist" vs "I am not in the slot." In the Tails world, the slot exists. By learning she isn't in it, she eliminates half of the Tails probability mass. She leaves the Heads mass untouched. Hence, 2/3.

  **ELIAS:** *(Paces the room)* It feels like you're treating probability mass as a fluid that pours into awakenings. I treat it as attached to the truth of the proposition. The proposition "The coin landed Heads" is true or false. The proposition "It is Monday" is true or false. They are causally independent. The experimenters could have run this with a die roll, or a random number generator. If I tell you "The random number generator output 'Monday'", why does that make the coin land Heads?

  **MARA:** Because the "Monday" output is sampled from her experience stream. The experience stream is longer in Tails.

  **ELIAS:** But *she* isn't sampling the stream. The stream is happening to her.

  **MARA:** She is sampling her current location within it. That's what consciousness is in this problem. It's a random sample from the set of possible conscious moments.

  **ELIAS:** And there it is. "Random sample from conscious moments." That is the Thirder axiom, Mara. You're dressing it up in Halfer clothes, but the moment you say "I am a random sample of awakenings," you've conceded the core Thirder point. You've admitted that the number of awakenings matters.

  **MARA:** I admit the number of *locations* matters for self-locating belief. I don't admit it matters for the coin's physical propensity. But credence isn't physical propensity. It's betting odds. If I offer her a bet on Monday: "Win \$3 if Heads, Lose \$2 if Tails." Should she take it?

  **ELIAS:** At 2/3 credence? Yes. Expected value is positive.

  **MARA:** But if she takes that bet every time she wakes up, and it's Tails, she loses twice. She loses \$4. If it's Heads, she wins \$3. She loses money in the long run.

  **ELIAS:** Exactly! So the 2/3 credence leads to bad betting behavior if the bet is per-awakening.

  **MARA:** Then we don't bet per-awakening. We bet per-experiment. If the bet is settled once per experiment, the 2/3 credence is correct for the Monday update.

  **ELIAS:** But she doesn't know if the bet is per-experiment or per-awakening when she's in the chair! She just knows her credence. Credence is supposed to guide action. If her credence says 2/3, but acting on 2/3 gets her Dutch-booked in the Tails world, her credence is broken.

  **MARA:** Or her decision theory needs to account for the fact that her actions might be duplicated. This isn't a failure of probability, Elias. It's a failure of standard decision theory in cases of duplicate agents. You want to fix the probability to save decision theory. I'm willing to let the probability look weird to save the Bayesian updating rule.

  **ELIAS:** Because "Monday" is evidence.

  **MARA:** Because "Monday" is evidence.

  *(Silence hangs between them. On the monitor, Beauty writes a number on the paper. She looks up, still uncertain.)*

  **ELIAS:** She's writing 1/2.

  **MARA:** She's confused.

  **ELIAS:** No, she's intuitive. She knows that a calendar can't move a coin.

  **MARA:** She's forgetting that she's not just observing the coin. She's observing her place in the coin's history.

  **ELIAS:** *(Sighs)* We're going to be here all day. You think the probability mass flows through the timeline. I think it sticks to the causal events.

  **MARA:** And I think you're ignoring that "now" is a variable in the equation.

  **ELIAS:** And I think you're turning "now" into a cause.

  *(They both turn back to the glass. Beauty holds up the paper. It's obscured by the glare, but the argument isn't over.)*

  **MARA:** 2/3.

  **ELIAS:** 1/2.

  **MARA:** We'll see what she does if we wake her again tomorrow.

  **ELIAS:** If we wake her again tomorrow, you'll say she learned nothing new. I'll say she lost evidence.

  **MARA:** Precisely.

  *(Fade out.)*
