answer: |-
  **Setting:** *A timeless, wood-paneled room, reminiscent of an Oxford common room in 1965, though the clock on the mantle does not tick. A decanter of sherry sits on the table between them. H.L.A. Hart sits with precise posture, fingers steepled. Lord Devlin leans back, relaxed but watchful.*

  **The Subject:** *The "Crimson Rite." A private, members-only club where adults voluntarily engage in ritualized scarification and bloodletting for aesthetic and spiritual gratification. No permanent disability occurs. No non-consenting parties are involved. The public, upon seeing leaked photographs, has reacted with visceral nausea and outrage.*

  ***

  **Devlin:** Let us not pretend, Herbert, that the law is merely a traffic cop. You treat the criminal law as if it were a system of fines for collisions. But law is the mortar of the house. If you remove the mortar, the bricks fall. The Crimson Rite is not a collision. It is a rot.

  **Hart:** A rot, Patrick? In a private room, between consenting adults? Where is the victim? Show me the harm, and I will show you the warrant for the state's coercion. Until then, you are asking the law to act as a guardian of public taste.

  **Devlin:** It is not taste. It is morality. And you persist in the error of thinking morality is a private hobby. A society is not a business arrangement between strangers to protect their assets. A society is a community of ideas. It is held together by shared political ideas, yes, but also by shared moral notions. If you allow a sector of the community to openly flout the fundamental moral assumptions of the rest, you are not preserving liberty. You are permitting treason.

  **Hart:** Treason? That is your famous analogy, is it not? That subverting morality is akin to subverting the government. But treason implies a victim: the State. In your scenario, the State is not harmed. The participants are not harmed, by their own definition. The only injury is to the sensibilities of those who know it happens but are not part of it. You are criminalizing psychic discomfort.

  **Devlin:** I am criminalizing disintegration. My thesis is simple: if a society's morality changes too radically, the society itself dissolves. It ceases to be *that* society. How do we know which morals are essential? We look to the reasonable man. The man on the Clapham omnibus. If he feels not merely disapproval, but *intolerance, indignation, and disgust*, then that moral principle is part of the bond. If the Crimson Rite provokes that level of revulsion in the ordinary citizen, the law is entitled to suppress it, just as it would suppress a seditious pamphlet.

  **Hart:** But the "Man on the Clapham Omnibus" is not a philosopher. He is a vessel for prejudice. You hand the keys of the criminal law to the gut reactions of the average bystander. History is a graveyard of "indignation" directed at the harmless. Intermarriage, atheism, homosexuality—all provoked disgust. All were defended by men saying the "fabric of society" was at risk. The fabric remained; only the prejudice died. How does your test distinguish between a genuine moral conviction necessary for social survival and a mere phobia?

  **Devlin:** You assume you can separate the feeling from the principle. You want a rational audit of morality before the law can act. But morality *is* feeling. It is not a conclusion reached by logic; it is a sentiment felt in the blood. If the reasonable man feels deep disgust, that *is* the evidence that the bond is threatened. You ask for a distinction between prejudice and conviction. I tell you there is no legal distinction. If the feeling is intense enough to threaten cohesion, the law must act. To wait for a philosophical justification is to wait until the house has already burned down.

  **Hart:** That is a terrifying surrender. You are saying the intensity of the feeling validates the truth of the judgment. If the majority feels strongly enough that red-headed people should be exiled, they are entitled to exile them?

  **Devlin:** If the majority felt that red-headed people were an existential threat to the community's identity? Yes. Liberty is not an absolute. It is a concession granted by society. When liberty is used to undermine the society that grants it, society may defend itself.

  **Hart:** But this brings me to the flaw in your architecture. You claim society *is* its morality. Therefore, to change the morality is to destroy the society. But I have argued, in my own work on the nature of law, that there is a "minimum content of natural law." I admit that law is grounded in facts about human nature. We are vulnerable. We need food. We are roughly equal in strength. Therefore, any legal system *must* have rules against violence and theft to survive.

  **Devlin:** Aha! So you admit it. Law rests on shared facts about human nature. Why, then, do you baulk when I say it rests on shared moral facts? If we need rules for physical survival, why do we not need rules for *social* survival?

  **Hart:** Because there is a categorical difference between *survival* and *uniformity*. My minimum content is instrumental. It says: "If you want a society to exist at all, you cannot permit random killing." It is a truism of cause and effect. It does not dictate *how* people should live, only that they must not destroy the conditions of living.
  Your thesis goes further. You say the law must enforce a specific *vision* of the good life. The Crimson Rite participants do not deny the need for rules against murder or theft. They abide by the minimum content. They simply wish to live differently within that space. You are conflating the *preconditions* of society with the *preferences* of the majority. A society can survive moral pluralism. It cannot survive universal violence.

  **Devlin:** Can it? Look at the modern world. Fragmentation. Alienation. When you remove the shared moral skin, you are left with isolated atoms. You say the Crimson Rite is harmless. I say it is a declaration that the body is not sacred, that pain is a commodity. If that view spreads, does it not affect how we treat the vulnerable? Does it not change how we view medical ethics, or warfare? Morality is a web, Herbert. You cannot pull one thread—the thread regarding private consensual violence—without shaking the whole tapestry. The law must hold the web together, even if it means restricting the movement of individual threads.

  **Hart:** The web metaphor is poetic, but it is static. Societies are not tapestries; they are conversations. If you freeze the moral code to prevent "disintegration," you prevent moral progress. You lock in the prejudices of the current generation.
  And consider the cost. To enforce your morality, you must employ police, courts, prisons. You must invade privacy. You must turn neighbors into informants. Is *that* not disintegration? You destroy the trust and liberty that make a society worth living in, in the name of saving a "shared morality" that may be nothing more than a collective neurosis.

  **Devlin:** I would rather a society be judgmental than indifferent. Judgment implies care. Indifference implies the end of the community. If the law says, "We do not care what you do in the dark," it ceases to be a moral teacher. It becomes a mere utility company.

  **Hart:** The law is not a moral teacher, Patrick. It is a framework for freedom. It should teach citizens to respect rights, not to conform to tastes. If the Crimson Rite is truly as repulsive as you say, let social pressure handle it. Let them be shunned. But do not use the state's monopoly on violence to imprison them.

  **Devlin:** Social pressure is not enough when the practice is hidden. That is the point of the "private" club. It festers in the dark. The law must shine a light. You speak of the state's monopoly on violence. I speak of the society's right to exist. If the price of existence is the suppression of practices that the ordinary man finds intolerable, then that is a price worth paying.

  **Hart:** And I say that a society that requires the suppression of harmless private conduct to feel secure is already insecure. It is a fortress with no one inside. You fear disintegration. I fear tyranny. The harm principle is the only line that protects us from the tyranny of the majority's disgust.

  **Devlin:** And I tell you, the harm principle is a sieve. It lets through everything that can be done in secret. It assumes the individual is an island. He is not. He is part of an organism. Cut off the limb that gangrenes, even if the limb feels no pain, or the body dies.

  **Hart:** But who holds the knife, Patrick? You trust the "reasonable man." I trust no one with that much power over the private soul. If the reasonable man is wrong—and he often is—your theory offers no remedy but collapse. Mine offers the possibility of growth.

  **Devlin:** *(Pouring a small amount of sherry)* Growth into what? A collection of strangers who tolerate each other but share nothing?

  **Hart:** *(Declining the glass)* A collection of free agents who respect each other's rights. That is enough shared ground to build a law upon. Anything more is theology.

  **Devlin:** Then we are at an impasse. You see law as a shield for the individual against the group. I see it as the skeleton of the group itself. Without the skeleton, the individual has no shape.

  **Hart:** And without the individual, the skeleton is a museum exhibit. Interesting to look at, but dead.

  ***

  *(They sit in silence for a moment. The clock on the mantle remains still.)*
