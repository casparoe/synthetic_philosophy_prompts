  **Justifications:**

  **(1) Elena: Score 1.** Elena correctly identifies Augustine's primary pastoral solution to moral dilemmas involving truth: silence or refusal is permissible where assertion of falsehood is not. However, her claim that this "never actually leaves anyone stuck" is an overstatement. Augustine acknowledges that refusing to answer can lead to severe consequences (including torture or death, as Firmus faced); his point is that one is never forced to *sin*, not that one avoids all suffering. She captures the moral option but minimizes the cost Augustine accepts.

  **(2) Marcus: Score 0.** Marcus offers a sharp practical critique of deontological ethics, noting that in binary constraints, silence can convey the same information as a lie. He accurately perceives that Augustine prioritizes the speaker's spiritual purity ("clean hands") over the practical outcome. However, he is empirically wrong regarding the specific text: in the Firmus case, the refusal *did* eventually protect the fugitive (via the Emperor's pardon), so the rule did "protect someone." Furthermore, labeling it a "loophole" mischaracterizes Augustine's view, which sees it as a rigorous moral boundary rather than an evasion.

  **(3) Elena: Score 2.** This is the strongest theological move. Elena accurately cites Augustine's eightfold hierarchy of lies from *On Lying*, correctly noting that lies to save a life (7th) and protect chastity (8th) are the least sinful but still sinful. She correctly infers that Augustine uses the Firmus case precisely because, even if a life-saving lie is venial, the perfect Christian (the bishop) should aim to avoid sin entirely through silence. She understands both the textual detail and the rhetorical function of the case in Augustine's argument.

  **(4) Marcus: Score -1.** Marcus correctly quotes Augustine's definition of lying from the *Enchiridion* regarding the disconnect between heart and tongue. However, he draws a conclusion Augustine explicitly rejects. Augustine distinguishes between *concealing* the truth (silence/refusal) and *uttering* a falsehood; for Augustine, the physical act of speech (*locutio*) is a necessary component of a lie, not just the intent to deceive. Marcus argues that Augustine's standard *shouldn't* allow silence to pass, but textually, Augustine *does* allow it. Marcus is philosophically consistent but textually mistaken about Augustine's actual ruling.
