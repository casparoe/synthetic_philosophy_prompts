answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of being [Bride]'s friend since college.

  When [Bride] asked me to give this toast, I was honored. And then I was terrified. Because we all know that [Groom] wrote his master's thesis on the philosophy of promising.

  So, I spent the last few weeks preparing. I didn't want to stand up here and say "I promise you this is a great marriage" and have [Groom] raise his hand from the head table and say, "Actually, under a Humean framework, that statement is void without a pre-existing social convention."

  And that actually brings me to the thing that's been on my mind about these two.

  As many of you know, [Bride] and [Groom] have been together for a long time. But about two years in, they started making these… unofficial promises. Long before there was an engagement ring, there were vows. "I promise I'll kill the spider." "I promise I won't judge your reality TV addiction." "I promise I'll be the one to wake up with the dog."

  They were building a life on a foundation of tiny, binding commitments. Which leads to the philosophical question that [Groom] literally wrote a thesis on: What is this wedding actually *doing*?

  If you ask David Hume—and I know [Groom]'s grad school friends are listening, so I have to get this right—Hume would say a promise is like a move in chess. Saying "I promise" only works because society agrees on the rules of the game. Without the institution, without the license, without the witnesses, the words are just noise.

  In that view, today is everything. Today is the day the chessboard is set up. Before 5:00 PM, you're just two people cohabitating. After 5:00 PM, you are Married. The social practice creates the obligation.

  But then there's T.M. Scanlon. Scanlon argues that the obligation doesn't come from the social rulebook. It comes from the trust. It's about looking someone in the eye, creating an expectation of reliance, and knowing that betraying that trust is wrong in itself, regardless of whether a judge signed a piece of paper.

  In Scanlon's view, [Bride] and [Groom] have been married for years. Today is just the party.

  For a while, I wondered which one of these philosophers won out in this relationship. Is today the creation of a new bond, or just a public announcement of an old one?

  But watching them together, I realized the answer is that they need both.

  Because love might start with Scanlon. It starts with the private trust. The quiet promises made on a Tuesday night when no one is watching. The reliance. The knowledge that if you say "I've got you," the other person believes you. That is the engine of this marriage.

  But Hume matters, too. Because we are not islands. We live in a community. We have aunts, coworkers, and friends who need to know that you are a unit. The social practice *protects* the private trust. It says to the world, "This isn't just a feeling; this is a status. This isn't just a habit; this is a vow."

  [Bride] and [Groom], you have the rare gift of having the Scanlon foundation *and* the Humean celebration. You have the deep, private history of keeping your word to each other when it was easy to walk away. And now, you have the public, social fortress of marriage to hold that promise safe for the future.

  [Groom], you spent years studying why a promise obligates you to do the thing. But I think you've learned that the "why" matters less than the "who." You don't keep your promises because of a social rule, and not just because of a moral principle. You keep them because it's [Bride].

  So, if everyone could please raise a glass.

  To [Bride] and [Groom]. May your private trust always be strong enough to hold the weight, and may your public vows always be bright enough to show you the way. And may you never have to cite a bibliography to prove you love each other.

  To the happy couple!
