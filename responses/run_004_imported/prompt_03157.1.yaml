  2.  **The Philosophical Core:** Materialism and Generation.
  3.  **The Mathematical Blind Spot:** Why the program failed.
  4.  **The Role of Vanity:** Why he wouldn't quit.
  5.  **The Cavalieri/Wallis Test:** Evidence for coherence.
  6.  **Novelistic Application:** How to portray him.

  *Key references:* Jesseph, *De Corpore*, Wallis's *Arithmetica Infinitorum*.

  *Drafting thought:* Make sure to mention that for Hobbes, truth = causal understanding. For Wallis, truth = operational success. This is the clash.

  *Final check on the prompt:* "Commit to a specific verdict." Okay, I will argue that the **philosophical coherence is the primary engine, vanity is the secondary fuel.** This makes him a tragic figure rather than a comic one.

