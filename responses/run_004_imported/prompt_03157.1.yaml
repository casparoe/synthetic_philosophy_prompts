answer: |-
  **Verdict:** Thomas Hobbes's geometrical materialism was a **coherent philosophical program that happened to produce bad mathematics**, though his refusal to abandon it was undoubtedly fortified by vanity. For the purposes of your novel, you should write him not as a deluded crank motivated solely by ego, but as a tragic intellectual figure: a man whose metaphysical commitments made it literally impossible for him to accept the mathematics of the future. His vanity was the shield he raised to protect his philosophy, not the engine that drove it.

  Here is the argument for this verdict, weighed to help you dramatize his speeches and internal logic.

  ### 1. The Coherence of the Program: Geometry as Physics
  To understand Hobbes, you must accept that he was not trying to do "mathematics" in the sense that John Wallis or Isaac Newton would later understand it. For Hobbes, geometry was a branch of natural philosophy (physics). His verdict on geometry flows directly from the first principles of *De Corpore*.

  If reality consists solely of matter in motion, then a geometric object cannot be a static, dimensionless abstraction. A point cannot be "nothing with a position"; it must be the *beginning* of motion. A line cannot be a breadthless length; it must be the *track* left by a moving body. A surface is the trace of a moving line; a solid is the trace of a moving surface.

  This is philosophically robust. It solves the metaphysical problem of how abstract concepts relate to the physical world: they don't. Geometric objects are idealized descriptions of physical generation. When Hobbes insists on this, he is not being perverse; he is being consistent. He demands **causal explanation**. To know a circle is to know how it is made (by a compass, or a rotating radius). To know the area is to understand the physical equivalence of that motion to a square.

  This coherence explains why he could accept Cavalieri but reject Wallis. Cavalieri's "indivisibles" could be imagined as infinitely thin *physical slices* of a body. They retained a shred of corporeality. Wallis's "infinites," however, were arithmetical and symbolic. They were numbers without bodies, operating by rules that seemed like magic to a strict materialist. Hobbes rejected Wallis not because Wallis was getting better results (he was), but because Wallis's method was "incorporeal nonsense." This distinction is the smoking gun: if Hobbes were merely vain, he would have adopted any method that allowed him to claim victory. Instead, he rejected a victorious method because it violated his ontology.

  ### 2. The Mathematical Failure: The Wrong Tool for the Job
  The tragedy of Hobbes is that his philosophical coherence blinded him to mathematical utility. By insisting that all geometry must be reducible to the generation of bodies by motion, he shackled himself to synthetic geometry (Euclid's style) in an age that was rapidly moving toward analytic geometry (algebra and calculus).

  The quadrature of the circle is impossible using only a compass and straightedge (as Hobbes insisted upon). It requires tools or concepts that transcend his strict materialist generation. When Hobbes claimed to have squared the circle, he was making a category error. He was solving a physical problem (constructing a shape) when the mathematicians were solving an arithmetic problem (calculating a ratio).

  His program produced bad mathematics because it denied the legitimacy of the symbolic abstraction that makes higher mathematics possible. He wanted geometry to be a science of *consequences from causes*, but 17th-century mathematics was becoming a science of *consequences from definitions and symbols*. Hobbes was right that Wallis's infinites were metaphysically murky (a criticism that persisted until the rigorous foundations of calculus were laid in the 19th century), but he was wrong that this murkiness invalidated their computational power.

  ### 3. The Role of Vanity: The Shield, Not the Sword
  This is where the "motivated reasoning" charge holds weight, but only as a secondary factor. Why did the feud last twenty years? Why the vitriol? Why the refusal to concede even when the errors were pointed out by Boyle, Wallis, and others?

  Here, vanity is the engine. Hobbes believed that for his political philosophy (*Leviathan*) to stand, his scientific method had to be demonstrably superior. If he could not master geometry—the gold standard of certainty—then his claims to have created a "civil science" were undermined. To admit error in geometry was to admit a crack in the foundation of his entire philosophical system.

  Furthermore, Hobbes was an older man fighting a younger generation. Wallis represented the new, professionalized science of the Royal Society. Hobbes was the outsider, the tutor, the man who believed he had solved the universe in a flash of insight while others were bogged down in calculation. His vanity was the psychological mechanism that allowed him to ignore the mounting evidence against him. It did not create his geometry, but it armored him against its refutation.

  ### 4. Novelistic Application: How to Write Him
  For your novel, this verdict offers a far richer character than the "mad old man" caricature.

  **Do not write him as:** A petulant child screaming that he is right.
  **Do write him as:** A weary general defending a fortress that the enemy has already bypassed.

  When you put speeches in his mouth, ground his arguments in **causality and motion**, not just stubbornness.
  *   **Bad Speech:** "I am right and Wallis is a fool!"
  *   **Good Speech:** "Wallis offers you numbers without substance, shadows without a body. He calculates the track but ignores the runner. I ask you: can a line exist without motion? Can a surface exist without a moving line? If not, then his 'infinites' are ghosts. I deal in bodies. I deal in causes. If my square does not match his number, it is his number that is abstract, not my square that is false."

  **The Internal Conflict:**
  Give him moments where he senses the shifting tide. He knows the Royal Society laughs. He knows the young men are using algebra to leapfrog his constructions. But he cannot yield, because to yield on geometry is to yield on materialism. If points can be dimensionless, then spirits can be incorporeal. If spirits can be incorporeal, the Church wins. And if the Church wins, *Leviathan* falls. The geometry is not just about math; it is about the survival of his worldview.

  ### Conclusion
  Hobbes was not a mathematician who lost his mind; he was a metaphysician who tried to conquer mathematics and failed. His geometrical materialism was a coherent, rigorous attempt to ground abstraction in physical reality. It failed because mathematics was outgrowing the need for physical grounding. His vanity kept him fighting long after the battle was lost, but the battle itself was fought over genuine philosophical terrain.

  Write him with sympathy for his intellectual integrity, but with pity for his inability to see that the world was moving toward a language he refused to speak. He is a Lear-like figure: King of a kingdom (Materialism) that no longer exists, raging against the new order (Analysis) that he cannot comprehend.
