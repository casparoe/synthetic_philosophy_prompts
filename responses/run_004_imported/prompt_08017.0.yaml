answer: |-
  **Setting:** *A university coffee shop, shortly after a graduate seminar on Jerry Fodor's* Concepts: Where Cognitive Science Went Wrong. *Two faculty members, Marcus (a defender of the Language of Thought Hypothesis) and Elena (a proponent of developmental conceptual change), are debriefing.*

  **Marcus:** I have to say, the pushback in the seminar on the *DOORKNOB* example was predictable but uncharitable. Everyone laughs, but no one actually dismantles the logic. If you accept that learning is hypothesis testing, and you accept that hypotheses are composed of concepts, the conclusion is inescapable. You cannot test a hypothesis about the extension of a primitive concept without already possessing that concept.

  **Elena:** The logic is valid, Marcus, but validity doesn't guarantee truth if the premises are empirically sterile. You're treating the "Paradox of Learning" as a metaphysical constraint on cognition, when it looks more like an artifact of your specific model of representation. You assume the representational system is static—that the only operation available is concatenation of existing primitives. But developmental psychology suggests the system itself undergoes structural change.

  **Marcus:** "Structural change" is a lovely phrase, but what is the mechanism? If a child acquires the concept CARBURETOR, they aren't growing a new mental organ. They are forming a belief about what carburetors are. To form that belief, they must think something like, "A carburetor is the part that mixes air and fuel." But to think that thought, they need the concepts PART, MIX, AIR, FUEL. If CARBURETOR is primitive—if it has no internal semantic structure—then it cannot be defined by those other concepts. So, where did it come from? If it wasn't constructed, it must have been there waiting to be triggered.

  **Elena:** And there is your weak point: the conflation of *semantic structure* with *conceptual role*. You insist that for a concept to be learned, it must be decomposable into simpler concepts. Susan Carey's work on Quinian bootstrapping shows this is false. A child can acquire a concept like NUMBER or WEEK through a process where they initially use a placeholder symbol without fully grasping its content. They build a temporary analogical model—mapping days of the week to positions on a board, for instance. The concept isn't *defined* by the model; the model allows them to isolate a new conceptual role that wasn't previously expressible in their Language of Thought.

  **Marcus:** But that just pushes the regress back. If the child is using a placeholder symbol, say 'X', to stand for the new concept, they must have a rule for how 'X' behaves. To formulate that rule, they need to represent the relations 'X' enters into. If those relations are novel—if they genuinely constitute a new primitive—then the child must already have the representational capacity to encode those relations. Bootstrapping sounds like pulling oneself up by one's bootstraps. It describes the *process* of stabilization, but it doesn't explain the *origin* of the representational power. You're smuggling the innate concept in as a "placeholder."

  **Elena:** I'm not smuggling it in; I'm naturalizing it. Your "innateness" is so thin it's vacuous. You admit experience *triggers* the concept. If the difference between "innate" and "learned" is merely whether the concept was present in the genome versus constructed via a cognitive procedure triggered by experience, the distinction loses its philosophical bite. My weak point isn't the mechanism; it's your refusal to acknowledge that the *meaning* of the concept changes during the process. For you, DOORKNOB is an atomic symbol with a fixed reference. For me, the child's concept of DOORKNOB evolves from a perceptual prototype to a functional theory. They aren't testing a hypothesis about a fixed atom; they are reorganizing a domain.

  **Marcus:** But reorganization requires a language in which to specify the reorganization! That's the crux. If the child moves from a prototype of "round graspable thing" to a functional concept "latch mechanism for doors," they have shifted extensions. How did they identify the new extension without already having the concept to pick it out? You say they use analogy. But analogy is a relation between two representations. If the target representation (the new concept) doesn't exist yet, what is the source analogous *to*? You can't map a known structure onto a void. There has to be a slot in the cognitive architecture ready to receive the content. That slot is what I call "innate."

  **Elena:** The slot isn't a pre-formed concept, Marcus; it's a computational potential. Think of it like a neural network that isn't just retrieving weights but altering its own hidden layers. Your argument assumes a combinatorial semantics where all complexity is syntactic. But if conceptual content is partly constituted by inferential role within a theory, then changing the theory changes the concept. When the child learns that a week is a cyclical measure of time rather than just a list of names, they haven't triggered a dormant WEEK concept. They've created a new representational resource. Your objection is that they couldn't formulate the hypothesis "Weeks are cyclical" without the concept WEEK. But they don't formulate that hypothesis *ex nihilo*. They struggle through a period of incoherence where the old rules fail. That incoherence is the learning.

  **Marcus:** Incoherence isn't a mechanism; it's a description of failure. If the old rules fail, the system crashes unless there's a meta-system to manage the repair. And that meta-system requires concepts. Let's press on the specific weakness of your developmental story: individuation. If concepts are theory-laden, and theories change, how do you ensure continuity of reference? When the child shifts from the prototype DOORKNOB to the functional DOORKNOB, are they learning a new concept or refining an old one? If it's a new concept, what happened to the old one? If it's the same one, then the core must have been stable. If the core was stable, it wasn't learned; it was the anchor. You need *some* primitives to get the bootstrapping off the ground. I just argue that the list of primitives is much longer than you're comfortable with.

  **Elena:** And I argue that your comfort with an infinite list of innate concepts is a theoretical vice, not a virtue. You'd rather posit that the genome encodes a symbol for CARBURETOR than admit that cognition has the power to generate novel symbols through interaction with the environment. The cost of your view is empirical implausibility. The cost of my view is that we don't yet have a complete formal account of how bootstrapping works. But "we don't know yet" is better than "it's all magic biology." You target my mechanism as obscure; I target your mechanism as evolutionarily absurd. How does natural selection select for the concept of a carburetor?

  **Marcus:** Natural selection selects for the *capacity* to represent arbitrary distinctions, not the specific content. The Language of Thought is a combinatorial system. It's not that there's a specific gene for CARBURETOR. It's that the system of representation is rich enough that any distinguishable property can be encoded. If the environment presents a distinguishable property, the system can latch onto it. But "latching on" isn't learning in the sense of constructing meaning; it's fixing the reference of a symbol that is already part of the combinatorial repertoire. You complain about the evolutionary cost, but the cost of your view is that you violate conservation of information. You're trying to get semantic content out of causal interactions without a pre-existing code to interpret those interactions.

  **Elena:** But the code *is* the causal interaction, initially. The symbols gain content through their use, not prior to it. You're trapped in a Cartesian theater where the mind must already possess the idea before it can encounter the object. I'm suggesting the encounter *constitutes* the idea. Your "conservation of information" argument assumes information is a static commodity. In a developmental system, information is emergent. The weak point in your defense is that you treat "innate" as a binary switch. If I show you that the acquisition of DOORKNOB involves a qualitative shift in reasoning capabilities—not just adding a label but enabling new inferences—then you have to admit something new was created. If something new was created, it wasn't strictly innate in your sense.

  **Marcus:** If the new inferences are valid, they must be licensed by the structure of the representation. If the structure wasn't there, the inferences are groundless. If the structure *was* there, the concept was implicitly there. You're describing the *unfolding* of a capacity as the *creation* of a capacity. I admit it feels counterintuitive to say DOORKNOB is innate. But the alternative is to say the mind creates semantic value from non-semantic causes without a bridge. That's not just magic; it's incoherent.

  **Elena:** And the alternative to that is to say the genome contains the blueprint for every distinctable object humans might encounter, which is not just counterintuitive, it's biologically impossible. We're left with a choice between a miracle of biology and a miracle of logic.

  **Marcus:** Then we agree on the stakes. I'm willing to pay the biological cost to save the logic of representation.

  **Elena:** And I'm willing to complicate the logic of representation to save the biology of learning.

  **Marcus:** *Sips coffee.* I suppose that's where we stand until someone explains how a placeholder becomes a concept without already being one.

  **Elena:** And I'll be waiting for your explanation of how evolution wrote a dictionary for every noun in the Oxford English Dictionary. Until then, I'll stick with the bootstrappers.

  **Marcus:** And I'll stick with the paradox. It's uncomfortable, but at least it respects the architecture of thought.

  **Elena:** Or it ignores the history of it.

  *They sit in silence for a moment, the stalemate hanging between them like the unresolved status of the concept DOORKNOB itself.*
