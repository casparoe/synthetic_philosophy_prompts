answer: |-
  At the launch party, a man I'd never met cornered me by the cheese table. He held my book like a trophy he hadn't yet won, thumbing the dust jacket with proprietary affection.

  "Devastating," he said, shaking his head. "Absolutely devastating."

  "I'm glad," I said. "Which chapter got you?"

  "Oh, I haven't cracked it. But Clara read it. She called me from the taxi, weeping. Clara has better taste than God. If she says it's devastating, it's devastating."

  He looked at me expectantly, waiting for gratitude. He seemed genuinely puzzled when I didn't beam. To him, the chain of custody was unbroken: Clara trusted the text, he trusted Clara, therefore he knew the text. It was a perfect syllogism of literary reputation.

  "But if Clara told you that Canberra is the capital of Australia," I said, "you would believe you knew something about Australia."

  "Of course."

  "And if she tells you this book is devastating, and you believe her... you think you know something about the book."

  He smiled, confident in the logic. "Isn't that how trust works?"

  "No," I said, gently taking the book from his hand and setting it on the table. "When you defer to a fact, you inherit the world. When you defer to a taste, you only inherit the person. You aren't reviewing my novel, my friend. You're reviewing Clara's grief."
