      *   **The Critic (Jordan):** Needs to press the identity/authority angle. Why should *I* care what *that* entity wants? Needs to exploit the "Muddle" (what if I don't converge?) and "Spread" (what if our extrapolated selves hate each other?) to show CEV is either empty or tyrannical.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the stage. Jordan attacks the core premise: Authority. Alex defends the necessity of extrapolation due to human brokenness.
      *   **Round 1: The Identity/Authority Gap:** Jordan argues the extrapolated self is a stranger. Alex argues it's *more* you than you are (removing noise, bias).
