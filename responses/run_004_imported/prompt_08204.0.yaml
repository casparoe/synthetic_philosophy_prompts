answer: |-
  **Setting:** *A coffee shop in Damascus. It is late afternoon. The shutters are half-down. CADE (Causal Decision Theorist) and EVAN (Evidential Decision Theorist) sit at a small table. Both are staring at a bus schedule for Aleppo. Neither is drinking their coffee.*

  **CADE:** You're looking at the 4:00 PM bus.

  **EVAN:** I'm looking at the probability distribution attached to the 4:00 PM bus. Which, currently, looks like a death warrant.

  **CADE:** That's the news value talking. You're confusing the map with the territory. Death made his prediction yesterday. He's either in Aleppo or he's here. That fact is fixed. My choice doesn't reach back in time and move him.

  **EVAN:** Your choice doesn't move him. Your choice *reveals* where he is. That's the Gibbard-Harper twist, Cade. In Newcomb, you could argue the money was already in the box. Here, the "box" is *you*. Your deliberation process is the algorithm Death simulated. If you conclude "Aleppo is rational," Death concluded "Aleppo is rational" twenty-four hours ago.

  **CADE:** So I'm paralyzed? I just sit here and wait for the scythe because my reasoning is evidence of my demise? That's fatalism, not decision theory. I have to act on what I can *influence*. I can't influence the past. Therefore, I should treat Death's location as independent of my act.

  **EVAN:** Can you? Really? Assign a probability to Death being in Aleppo. Go on.

  **CADE:** Fifty-fifty. I have no idea what he guessed.

  **EVAN:** But you're sitting there with your hand hovering over the Aleppo ticket. As soon as your credence that you will go to Aleppo rises above fifty percent, your credence that Death is in Aleppo must rise to match it. You know he's perfect.

  **CADE:** That's an epistemic constraint, not a causal one.

  **EVAN:** It's a ratifiability constraint. To make a decision, you have to be able to say, "Given that I am doing X, X is the best option." But if you decide Aleppo, you must believe Death is in Aleppo. If you believe Death is in Aleppo, Aleppo has zero utility. So you shouldn't go to Aleppo.

  **CADE:** *(Taps the table)* Okay. So I decide Damascus.

  **EVAN:** Then you believe Death predicted Damascus. So Death is in Damascus. So Damascus has zero utility. So you shouldn't go to Damascus.

  **CADE:** I see the loop. You think this breaks me? It breaks you too. You're an evidentialist. You maximize expected utility conditional on the act. $V(A) = P(\text{Life} | A) \times \text{Value}$. If you choose Aleppo, $P(\text{Life} | \text{Aleppo})$ is zero. If you choose Damascus, $P(\text{Life} | \text{Damascus})$ is zero. Your theory tells you both options are suicide.

  **EVAN:** At least I admit the correlation! You're trying to sever the link by fiat. You want to say, "I'll go to Aleppo, and I'll pretend Death isn't there because my going didn't *cause* him to be there." But you can't pretend. You *know* he's there. Your own confidence betrays you.

  **CADE:** So what's your solution? We just spin in circles until 4:00 PM?

  **EVAN:** The only stable point is a mixed strategy. Randomize. Flip a coin.

  **CADE:** A coin flip? That's your escape hatch?

  **EVAN:** If you commit to a 50/50 randomization, then Death predicts a 50/50 randomization. He has to pick a spot. Say he picks Aleppo. Then your coin flip gives you a 50% chance of life. It's the only way to break the correlation between your *specific* choice and his location.

  **CADE:** But Death knows you're going to flip a coin. He knows the theory. He can just flip a coin too.

  **EVAN:** Then we're both gambling. It's better than certainty of death.

  **CADE:** It's an admission of defeat. CDT is supposed to be about agency. About doing the thing that *works*. If the only rational move is to abdicate agency to a coin toss because my reasoning is too transparent, then reasoning is a liability.

  **EVAN:** Reasoning isn't the liability. Ignoring the evidence *of* your reasoning is. You want to treat your decision as a free variable in the equation. It's not. It's a dependent variable.

  **CADE:** But look at the instability again. Even the coin toss... suppose I decide to flip the coin. Right now. Death predicted "Will flip coin." So he waits where?

  **EVAN:** He waits where he thinks the coin will land? No, he can't predict the quantum outcome. He predicts the *strategy*. So he picks a city and waits.

  **CADE:** Okay. So I commit to the coin. I'm holding it in my hand. But now, before I flip... I have to decide whether to *abide* by the flip.

  **EVAN:** Don't you dare.

  **CADE:** Think about it. Suppose the coin comes up Aleppo. I look at it. I think: "Okay, coin says Aleppo. But if I go to Aleppo, and I am a rational agent who decided to use a coin, Death predicted the coin strategy. He's in Aleppo with 50% probability."

  **EVAN:** Yes.

  **CADE:** "But wait. If I *ignore* the coin and stay in Damascus... Death predicted I would follow the coin. So he's in Aleppo. So if I ignore the coin, I live for sure."

  **EVAN:** *(Leans forward)* But if you decide to ignore the coin, Death predicted *that*.

  **CADE:** Exactly! The moment I form the intention to disobey the coin, I've changed the prediction. The mixed strategy isn't ratifiable either. As soon as I settle on "I will do whatever the coin says," I have an incentive to deviate. Because if I'm the kind of guy who follows the coin, Death is where the coin points. If I'm the kind of guy who double-crosses the coin, Death is where the double-cross points.

  **EVAN:** So you can't even commit to the randomization.

  **CADE:** No. Because my commitment is just another mental state for Death to predict. There is no state of mind I can occupy—determined, random, contrarian—that doesn't immediately become the very reason Death is waiting for me there.

  **EVAN:** *(Sighs, looks out the window)* This is why my professor called it nastier than Newcomb. In Newcomb, the Causal theorist can sleep at night. They say, "The money is already there. I take both." They have a stable answer, even if it's the wrong one. Here... you don't even have a stable answer.

  **CADE:** I keep thinking... maybe I just have to lie to myself.

  **EVAN:** Excuse me?

  **CADE:** To make a decision, I need to believe I'm going to do it. But if I believe I'm going to do it, I believe Death is there. So I need to believe I'm going to do it, while simultaneously believing I won't do it? I need to be deluded to act.

  **EVAN:** "Deliberation crowds out prediction." Levi said that. But here, prediction crowds out deliberation. You can't form a belief about your own action without it becoming self-defeating.

  **CADE:** So we sit here.

  **EVAN:** We sit here.

  **CADE:** *(Picks up the bus schedule)* You know... if I just stand up and walk out the door without thinking...

  **EVAN:** ...Death predicted the "walk out without thinking" strategy.

  **CADE:** *(Drops the schedule)* Right.

  **EVAN:** The only way to win is to be unpredictable to yourself. But if you're unpredictable to yourself, you can't make a decision. Because a decision is a prediction you make about your own behavior.

  **CADE:** So rationality requires me to be irrational, but I can't choose to be irrational rationally.

  **EVAN:** Precisely.

  *(A long silence. The clock on the wall ticks loudly.)*

  **CADE:** I hate this problem.

  **EVAN:** Me too.

  **CADE:** 4:00 PM is in twenty minutes.

  **EVAN:** I know.

  **CADE:** If I run for the bus...

  **EVAN:** ...you die.

  **CADE:** If I stay...

  **EVAN:** ...you die.

  **CADE:** *(Stands up abruptly)* I'm going to the bathroom.

  **EVAN:** Death predicted that.

  **CADE:** *(Freezes at the door)* Damn it.

  *(Cade sits back down. He puts his head in his hands. Evan stares into his cold coffee.)*

  **EVAN:** You know, there's a third option.

  **CADE:** Don't.

  **EVAN:** We accept that we're dead. We order another coffee. We make the best of the afternoon.

  **CADE:** That's not decision theory. That's resignation.

  **EVAN:** Is it? If every available act has negative expected utility conditional on its own selection... maybe the rational move is to stop trying to maximize utility and just maximize the quality of the remaining time.

  **CADE:** *(Looks up, eyes tired)* That sounds like... giving up the project of agency entirely.

  **EVAN:** Maybe agency was the bug. Not the feature.

  **CADE:** *(Looks at the bus schedule one last time, then folds it neatly into a square)* One more coffee.

  **EVAN:** Black?

  **CADE:** Why not. It's not like I need to sleep tonight.

  *(Evan signals the waiter. Neither of them looks at the door, for fear of seeing who is standing there.)*
