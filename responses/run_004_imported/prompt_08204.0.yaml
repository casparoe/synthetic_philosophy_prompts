  2.  **Deconstruct the Problem (Death in Damascus):**
      *   *Scenario:* Death predicts where you will be tomorrow. If he predicts Aleppo, he waits in Aleppo. If he predicts Damascus, he waits in Damascus. You want to avoid Death.
      *   *The Twist:* Death has already told you he predicts perfectly.
      *   *CDT View:* My choice doesn't *cause* Death's past prediction. I should go where I think Death *isn't*. But if I decide Aleppo, I must believe Death predicted Aleppo. So Death is in Aleppo. So I die.
      *   *EDT View:* Choosing Aleppo is evidence that Death predicted Aleppo. So choosing Aleppo is evidence I die there.
      *   *The Ratifiability Issue (Arntzenius/Joyce/etc.):* To make a decision, I need to assign probabilities to states (Death's location) conditional on my acts.
          *   If I lean toward Aleppo ($P(A) \approx 1$), then given Death's perfect prediction, $P(\text{Death in Aleppo} | A) \approx 1$. Expected Utility of Aleppo $\approx 0$ (Death). Expected Utility of Damascus $\approx 100$ (Life, assuming Death is in Aleppo). So I should switch to Damascus.
          *   If I lean toward Damascus ($P(D) \approx 1$), then $P(\text{Death in Damascus} | D) \approx 1$. Expected Utility of Damascus $\approx 0$. Expected Utility of Aleppo $\approx 100$. So I should switch to Aleppo.
      *   *Result:* No stable equilibrium. Mixed strategies might be the only way out (randomize 50/50), but even then, the deliberation dynamics are unstable.

  3.  **Drafting - Step 1: Character Voices:**
      *   *CDT (Causal):* Focuses on influence, causal arrows, the fact that the prediction is already in the past. Wants to break the correlation by asserting agency.
      *   *EDT (Evidential):* Focuses on news value, conditional probabilities, the fact that their own decision process *is* the predictor's input.
      *   *Shared Frustration:* Both need to acknowledge that their standard moves (CDT: "I can't cause the past"; EDT: "Correlation matters") hit the wall of *ratifiability*.

  4.  **Drafting - Step 2: The Core Argument (The Loop):**
