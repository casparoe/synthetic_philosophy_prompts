      *   *Correction:* Actually, if you randomize 50/50, and Death predicts that, he waits in one place. You have a 50% chance. But the *deliberation* is the problem. The prompt asks to sit in the instability.
      *   Key insight to highlight: The decision *itself* provides the evidence that undermines the decision.

  5.  **Drafting - Step 3: Scene Setting:**
      *   Let's put them in a coffee shop in Damascus. It adds immediacy.
