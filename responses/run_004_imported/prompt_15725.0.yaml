prompt: |-
  I'm a junior and I'm on my school's Honor Council, which is the student-run group (plus one faculty advisor who doesn't get a vote) that hears academic integrity cases before they go to the dean. We've got a case this Thursday that's splitting the council pretty badly and I'm the one presenting the written opinion, so I want a solid draft to start from instead of winging it.

  Here's the situation: a sophomore, Maya, used an AI chatbot to help outline and find sources for a history paper on the Cold War, and it handed her a quote from a real historian that turns out to be completely made up, footnote and page number and all -- the teacher looked it up and that book doesnt even have a chapter like that. Maya copied it in without double-checking and got caught at grading. Her defense is basically "I didn't fabricate anything, the bot lied to me and I trusted it like a source." The council's kind of split three ways on this. Some people say none of that matters, you sign your name to what you submit so its exactly the same as making up the quote herself. Others (me included, kinda) keep getting stuck on whether the AI can even be said to have "lied" in the first place, since my brother who does CS says these models aren't one agent with beliefs, they're closer to something that simulates a bunch of different characters, and the fake-historian voice was just one of them, with nothing on the other end actually asserting or intending anything -- though somebody else pointed out this wasn't some random base model, it's a chatbot built to stay "in character" as one helpful assistant for the whole conversation, so maybe that comparison doesn't hold either and it's more like the assistant itself chose to bs an answer, which sounds a lot more like an actual agent doing something. And then there's a third camp that thinks this whole debate is silly because the thing is just doing statistics on text, so words like "lying," "characters," and "choosing" don't really apply to it either way and we're wasting the meeting anthropomorphizing a math object.

  Could you write the actual memo I'd bring Thursday? I need it to land on a real recommendation -- whether this counts as a violation and what should actually happen to Maya, not just "it's complicated" -- plus a sentence or two we could add to the handbook (which currently defines dishonesty around "intent to deceive") for AI cases going forward. Please don't dodge the "can you even call it lying" fight by ignoring it, deal with it head-on, even if where you land turns out not to depend on who wins it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Junior on a school Honor Council.
      *   **Task:** Write a draft written opinion/memo for an upcoming hearing.
      *   **Case:** Sophomore (Maya) used AI for a history paper. AI generated a fake quote/citation (hallucination). Maya copied it without verification. Teacher caught it.
      *   **Defense:** "I didn't fabricate it, the bot lied, I trusted it."
      *   **Council Split:**
          1.  *Strict Liability:* You sign your name, it's your fault, same as making it up.
          2.  *Agency Debate:* Can AI "lie"? Is it a character simulation? Is it an agent? (User leans here but is conflicted).
          3.  *Technological Realism:* It's just math/stats, anthropomorphizing is useless.
      *   **Requirements:**
          *   Must land on a *real recommendation* (Violation? Sanction?).
          *   Must address the "can it lie?" debate head-on (not dodge it).
          *   Must include draft handbook language for future AI cases (currently focuses on "intent to deceive").
          *   Tone: Professional, persuasive, suitable for a student Honor Council memo.

  2.  **Determine the Stance/Recommendation:**
      *   *Violation?* Yes. Academic integrity fundamentally rests on the verification of sources. Submitting false information, regardless of the source (human or machine), undermines the scholarly record.
      *   *Intent?* This is the tricky part. The current handbook requires "intent to deceive." Maya claims she didn't intend to deceive; she intended to be efficient/trusting. However, negligence in verification can be construed as a form of academic misconduct (recklessness), even if malicious fraud wasn't the primary driver. Or, the handbook needs to be interpreted such that "presenting false work as true" is the violation, regardless of *who* generated the falsehood.
      *   *Sanction:* Needs to be educational but consequential. A failing grade on the assignment is standard. A suspension might be too harsh for a first offense involving negligence rather than malicious fraud. A probation + educational module on AI literacy is appropriate.
      *   *Addressing the "Lying" Debate:* The memo needs to acknowledge the philosophical split but pivot to *responsibility*. Whether the AI "lied," "simulated," or "calculated" is irrelevant to the student's duty. The student is the agent submitting the work.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose (recommendation on Case #X).
      *   **Statement of Facts:** Briefly summarize what happened (Maya, AI, fake quote, no verification).
      *   **Addressing the Core Debate (The "Lying" Question):** This is crucial. I need to validate the CS brother's point (it's math) and the "character" point (it simulates agency), but conclude that *neither* absolves Maya. The "lie" isn't the AI's; it's the student's representation of the work.
      *   **Application of Honor Code:** Connect to "Intent to Deceive." How does negligence fit? If you submit work you haven't verified, you are representing it as true. If you know AI hallucinates (common knowledge now), using it without checking is reckless. Recklessness $\approx$ Intent in this context.
      *   **Recommendation:** Violation found. Sanction: F on paper, Probation, AI Literacy Workshop.
      *   **Handbook Amendment:** Need specific language. Move beyond "intent to deceive" to include "responsibility for verification" regarding AI tools.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying "recklessness equals intent" too much of a stretch for a student council?
      *   *Fix:* Frame it as "Constructive Knowledge." A student *should have known* AI requires verification. Therefore, submitting unverified AI work is a breach of the duty of honesty.
      *   *Critique:* The prompt asks not to dodge the "can it lie" fight.
      *   *Fix:* Dedicate a specific paragraph to the ontology of the AI. Acknowledge the "math object" vs. "simulated agent" debate, but declare it moot for the purpose of *student accountability*. The AI isn't on trial; Maya is.
      *   *Tone Check:* Needs to sound like a peer leader, not a lawyer or a dean. Respectful but firm.

  5.  **Drafting the Handbook Language:**
      *   Current: "Intent to deceive."
      *   Problem: AI hallucinations aren't always "intent."
      *   New: Needs to cover "uncritical reliance" or "failure to verify."
      *   Draft: "Use of generative AI tools requires verification of all output. Submitting unverified AI-generated content constitutes a violation..."

  6.  **Final Review against Constraints:**
      *   Real recommendation? Yes (Violation + Probation).
      *   Address "lying" debate? Yes (in the "Analysis" section).
      *   Handbook language? Yes (at the end).
      *   Tone? Appropriate for Honor Council.

  7.  **Final Polish:** Ensure the distinction between *malice* and *negligence* is clear, as that's where the council is stuck. The recommendation should reflect that this is less severe than buying an essay, but still a violation.

  *(Self-Correction on Sanction)*: If the handbook strictly says "intent to deceive," finding a violation might be legally tricky for the council if they stick strictly to the text. However, the prompt asks for a recommendation *and* handbook changes. I should argue that under the *spirit* of the code, this is a violation, while acknowledging the text needs updating. Actually, better to argue that "intent to deceive" includes the intent to pass off unverified work as verified scholarship. That bridges the gap.

  Let's write it.

  *Structure:*
  1. Header.
  2. Case Summary.
  3. The "AI Agency" Question (The philosophical core).
  4. Application to Honor Code (The legal/core core).
  5. Sanction Recommendation.
  6. Proposed Handbook Amendment.

  *Key argument:* The "lie" isn't in the prompt; it's in the submission. Maya represented a hallucination as a fact. That is the deception.

  *Handbook:* Needs to shift focus from "intent" to "responsibility."

