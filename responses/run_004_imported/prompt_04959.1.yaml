answer: |-
  The schema $Cr(A \mid X = r) = r$ is indeed the gravitational center around which both Bas van Fraassen's Reflection Principle (RP) and David Lewis's Principal Principle (PP) orbit. In the context of self-modifying agents—where an AI must decide whether to trust the decisions of a future, potentially altered version of itself—this formal similarity is tempting. It suggests a unified theory of deference: whether deferring to the laws of nature (PP) or the future self (RP), the agent simply conditions on the "expert" value.

  However, a close examination of the restrictions attached to each principle reveals that they are solving fundamentally different problems. While both principles share a mathematical form, they are **independent principles** that instantiate a broader norm of **Expert Deference**, rather than one being a special case of the other. Furthermore, regarding the "principled work" of their respective restrictions, van Fraassen's cognitive integrity conditions are more principled than Lewis's admissibility clause, as the former identifies the *source* of epistemic authority while the latter merely delineates its *boundaries*.

  ### 1. The Restrictions: Admissibility vs. Cognitive Integrity

  To judge the principles, we must first dissect the "fine print" that prevents them from collapsing into triviality or falsehood.

  **Lewis's Principal Principle (PP)** states that your credence in $A$, conditional on the chance of $A$ being $r$, should be $r$. The restriction is that this holds only given **admissible** evidence.
  *   **The Problem:** If you possess a crystal ball that tells you the outcome of a chancy event, your credence should match the crystal ball, not the objective chance. The chance is "screened off."
  *   **The Restriction:** Lewis defines admissibility largely negatively: information is admissible if it does not override the chance function. While Lewis attempted to characterize it positively (information about the past is admissible; information about the future is not), the notion remains notoriously slippery. It is a logical constraint on the *information set* available to the agent.

  **van Fraassen's Reflection Principle (RP)** states that your current credence in $A$, conditional on your future credence in $A$ being $r$, should be $r$. The restriction is that you must not anticipate **memory loss, manipulation, or irrationality**.
  *   **The Problem:** If you know you will be drugged tomorrow, your future credence will be garbled. If you know you will forget evidence, your future credence will be less informed. In these cases, deferring to your future self is irrational.
  *   **The Restriction:** Van Fraassen requires that the agent views their future self as an epistemic superior (or at least equal) regarding the proposition in question. This is a psychological/normative constraint on the *agent's cognitive trajectory*.

  ### 2. Which Restriction Does More Principled Work?

  A restriction "patches" a principle if it is added solely to exclude known counterexamples without explaining *why* those cases fail. A restriction does "principled work" if it elucidates the underlying mechanism that makes the principle valid.

  **Lewis's Admissibility is a Boundary Patch.**
  Lewis himself admitted that "admissibility" was the weak link in the PP. It functions primarily as a firewall to prevent the principle from contradicting itself when the agent has "inadmissible" information (like knowledge of the outcome). It tells us *when* we cannot use the principle, but it does not fully explain *why* chance commands deference in the first place, other than by stipulation. It is a logical safeguard against informational override. It is necessary, but it feels like a technical exclusion clause in a contract.

  **Van Fraassen's Integrity Condition is a Source Definition.**
  Van Fraassen's restriction, by contrast, points directly to the *justification* for Reflection. Why should I defer to my future self? Because I expect my future self to have processed more evidence or reasoned more clearly. If I anticipate memory loss or manipulation, I am explicitly judging that the *process* generating the future credence is corrupted.
  Therefore, the restriction is not merely patching counterexamples (like the "Forgetful Driver" or the "Drunk Driver"); it is defining the conditions under which the future self counts as an **expert**. It grounds the principle in the normative status of the agent's rationality.

  **Verdict:** Van Fraassen's restriction does more principled work. It identifies the *source of authority* (rational cognitive processing), whereas Lewis's admissibility identifies the *limits of authority* (informational screening). A principle that defines its own conditions of validity (RP) is more principled than one that defines its conditions of exception (PP).

  ### 3. Position: Independent Principles under Expert Deference

  Are they the same principle? I argue **no**. They are independent principles that share a common form because they are both specific instantiations of Haim Gaifman's **Expert Principle**.

  **The Argument for Independence:**
  1.  **Metaphysical vs. Epistemic Authority:** The PP bridges metaphysics (objective chance) and epistemology (credence). It tells us how to align our minds with the world's stochastic structure. The RP bridges epistemology and epistemology (current credence to future credence). It tells us how to align our temporal slices with each other. Reducing RP to PP would require treating future credences as "objective chances," which is a category error (unless one adopts a radical Humean view where chances *just are* best-system credences, but even then, the temporal index differs).
  2.  **Direction of Fit:** In PP, the authority is external to the agent (the world). In RP, the authority is internal (the agent's future cognitive state). The failure modes differ accordingly. PP fails if the world is deterministic or if we know the future (admissibility). RP fails if the agent is broken (irrationality).
  3.  **The Self-Modification Context:** For a self-modifying AI, this distinction is vital.
      *   **PP** tells the AI how to interpret sensor data about the environment (e.g., "The chance of rain is 0.7, so I believe 0.7").
      *   **RP** tells the AI how to interpret its own code updates (e.g., "My future version will believe $X$; should I believe $X$ now?").
      *   If RP were just a case of PP, the AI would treat its future self as an environmental chance function. This is dangerous. An AI should not defer to a future self that has been "hacked" (manipulated), even if that future self is confident. The RP restriction (checking for manipulation) is a check on *internal integrity*, whereas PP admissibility is a check on *external information*.

  **The Common Ancestor: Expert Deference**
  The shared schema $Cr(A \mid X = r) = r$ is best understood as the **Expert Principle**: *Conditional on an expert function $X$ assigning probability $r$ to $A$, your credence should be $r$.*
  *   For PP, the "expert" is Objective Chance.
  *   For RP, the "expert" is the Future Self.

  Recognizing them as siblings rather than parent/child preserves the distinct work their restrictions do. PP's admissibility ensures the "Chance Expert" isn't overridden by better info. RP's integrity condition ensures the "Future Self Expert" hasn't been lobotomized.

  ### 4. Defense and Implications

  Why does this distinction matter? If we conflate them, we risk misapplying norms of rationality to self-modifying agents.

  If we treat Reflection as a special case of the Principal Principle, we might assume that an agent should defer to its future self whenever it lacks "inadmissible" information about that future. But this misses the point of Reflection. The point is not just information; it is **trust in rationality**.
  In the rationalist community discussion you mentioned, the worry is about an AI modifying itself into a state where it confidently believes falsehoods (e.g., wireheading).
  *   **Under PP:** The AI might reason, "My future state is determined by physics (chance), so I should defer to it." This is fatal.
  *   **Under RP:** The AI reasons, "I should defer to my future self *only if* I expect it to be rational and unmanipulated." This allows the AI to reject a self-modification that would lead to high-confidence delusion.

  Van Fraassen's restriction is the safeguard here. It forces the agent to evaluate the *process* of its own modification. Lewis's admissibility offers no help here, because the "information" about the future self's credence is admissible; the problem is the *reliability* of the source.

  ### Conclusion

  The Reflection Principle and the Principal Principle are **independent norms** that converge on a common mathematical form because both govern deference to an expert function. However, they are not reducible to one another.

  Regarding the restrictions, **van Fraassen's cognitive integrity condition is more principled** than Lewis's admissibility clause. Admissibility is a negative boundary condition required to save the Principal Principle from logical triviality; it tells us when chance *stops* speaking. Van Fraassen's restriction is a positive condition of validity; it tells us why the future self *starts* speaking (because it is rational and informed).

  For the design of self-modifying agents, this implies that deference to the future self cannot be automatic. It requires a meta-cognitive verification of the future self's integrity—a check that has no analogue in the Principal Principle. The agent must not merely observe its future credence as a chance event; it must certify its future self as a rational expert. Thus, Reflection stands on its own feet, grounded not in the metaphysics of chance, but in the norms of diachronic rationality.
