prompt: |-
  I've been reading Henry Sidgwick for a seminar on Victorian ethics, and the thing that keeps derailing our discussion section is his decades-long side career investigating ghosts, telepathy, and mediums as a founder and first president of the Society for Psychical Research. Two people in the seminar got into a back-and-forth about how to read this that the professor never actually refereed, and its been bugging me since.

  (1) Mira opened by saying the psychical research wasn't some quirky hobby bolted onto the "real" philosophy -- it was basically an attempt to patch a hole he'd already identified himself: the "dualism of practical reason" that closes out the Methods of Ethics, where Sidgwick admits he can't rationally show that impartial benevolence trumps pure self-interest unless the universe happens to be set up so virtue and happiness line up (i.e., some kind of moral order, plausibly requiring an afterlife). Since he spent most of the rest of his career chasing empirical evidence for exactly that, and by his own admission never found anything close to conclusive, Mira's claim is that his official theory is left broken by his own lights -- not just "incomplete," but stuck with a contradiction he himself treated as decisive. (2) Divya disagreed: she said the fact that he kept running careful trials, was willing to publish negative and embarrassing results, and never once claimed he'd found what he was looking for is a point in favor of his integrity, not a symptom of failure, and that practically speaking Sidgwick never stopped telling people to act on utilitarian and common-sense grounds in the meantime -- so whatever the dualism was, he could live with it as an open theoretical wound rather than something that made the ethics unusable. (3) Mira came back with: if it were really just a tolerable loose end, why would someone as famously careful with his time as Sidgwick sink twenty-odd years and a whole learned society into chasing the answer? That's not what you do about a problem you think you can survive without solving. (4) Divya's reply was that effort spent doesn't tell you what the effort was for -- Sidgwick could've found the survival-of-death question gripping in its own right, as a question about the universe, without thinking his ethics would collapse if it stayed open, same as plenty of people sink years into questions they find fascinating without treating them as load-bearing for their day job.

  Can you go through this move by move? I want a verdict on each of the four moves, not just an overall winner, so first give me a JSON block scoring each move from -2 (clearly mistaken) to 2 (clearly right), like {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, then a few sentences per move justifying the score, and then a short closing note on whatever you think both Mira and Divya are missing about why the psychical research actually mattered to him.
