prompt: |-
  So for my ethics seminar this week we just read Taurek's 'Should the Numbers Count?' and now Parfit's reply 'Innumerate Ethics,' and I wanna make sure I actually get the arguemnt before discussion tomorrow instead of just parroting the "flip a coin" meme version of Taurek. I'm fine on his setup (the drug/David case, save David who needs the whole dose vs the other five who only need a fifth each) and his equal-chance idea. What I'm fuzzy on is how Parfit's paper is actually supposed to defeat that instead of just asserting that more people mattering is obviously true. Can you compare the two positions properly, give me the strongest version of Parfit's counterargument, and then say which one you think actually wins and why?
