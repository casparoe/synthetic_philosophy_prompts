      *   *Parfit's Strongest Point:* The argument from *continuity* and *scale*. If it's permissible to save 1 over 5, is it permissible to save 1 over 1,000? 1 over 1,000,000? Taurek says yes (give the 1 a 50% chance). Parfit says this is morally blind.
