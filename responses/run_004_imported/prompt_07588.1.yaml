answer: |-
  Here are ten questions designed to probe the structural vulnerabilities of the surrogate goal proposal, each accompanied by a follow-up intended to limit the "better-designed surrogate" defense.

  **1. The Common Knowledge Credibility Problem**
  "If it becomes common knowledge among acausal adversaries that rational agents are adopting surrogate goals specifically because they are cheap to sacrifice, what prevents a sophisticated extortionist from simply ignoring the surrogate and threatening the underlying terminal values? The strategy seems to rely on the threatener targeting the decoy, but if the decoy's status is transparent, the threatener has no incentive to aim there."
  *   **Follow-up:** "I anticipate you will argue that the surrogate only needs to be indistinguishable from a real goal from the threatener's *epistemic* position. But if indistinguishability is the requirement, doesn't that concede that the surrogate must functionally *be* a terminal goal? At that point, haven't you simply redefined 'terminal value' rather than proposed a distinct defensive strategy?"

  **2. The Regress of Instrumental Commitments**
  "To protect the surrogate, the agent must be disposed to defend it. But if that disposition is known to be adopted for instrumental reasons, isn't the surrogate itself vulnerable to acausal threats? Does this not invite an infinite regress where every surrogate requires a meta-surrogate to protect its credibility, and so on?"
  *   **Follow-up:** "If you posit a 'foundational' surrogate that stops the regress, is that foundational goal protected instrumentally or intrinsically? If intrinsically, why can't the agent simply protect their actual terminal values that way? If instrumentally, doesn't the regress resume?"

  **3. Relation to Updateless Decision Theory (UDT)**
  "How does this proposal relate to the updateless ideal of simply being the sort of agent against whom threats never pay to be issued? Is the surrogate goal a necessary stopgap for agents that cannot fully self-modify into an updateless disposition, or is it in tension with the updateless prescription?"
  *   **Follow-up:** "If it is a stopgap for bounded agents, doesn't that create a new vulnerability? A sufficiently capable extortionist could distinguish between a 'true' updateless agent and a 'surrogate-patched' agent, and specifically target the latter as the softer target. Does this strategy inadvertently flag the agent as vulnerable?"

  **4. Psychological and Rational Coherence**
  "Is stipulating a goal purely for its deterrent value, all the while knowing it to be a stand-in, psychologically or rationally coherent? It seems to require the agent to simultaneously hold a value as 'sacred enough to fight for' and 'fake enough to sacrifice if the real goal is safe.' Can a rational utility function sustain this contradiction without fracturing?"
  *   **Follow-up:** "You might suggest the agent can successfully self-deceive to make the surrogate stick. But if the self-deception is successful, the agent *actually* values the surrogate. Doesn't that mean the 'surrogate' has displaced the 'real' goal, potentially leading to catastrophic value drift where the agent sacrifices what they originally cared about for the sake of the decoy?"

  **5. The Problem of Logical Omniscience**
  "Your model assumes the extortionist cannot perfectly deduce the agent's source code or decision procedure. But in formal acausal trade, we often deal with logical correlations where the adversary may be logically stronger. If the adversary can prove the surrogate is instrumental, the shield breaks. How robust is this against an adversary with superior computational power?"
  *   **Follow-up:** "If the defense relies on the adversary's computational limits, isn't this just security by obscurity? And if so, isn't it inevitable that as agent capabilities scale, the 'surrogate' strategy becomes obsolete, leaving advanced agents more vulnerable than those who never adopted it?"

  **6. Asymmetry of Cost**
  "The strategy relies on the surrogate being 'cheap' for the *agent* to sacrifice. But does it also need to be 'cheap' for the *extortionist* to threaten? If the surrogate is something obscure or hard to impact, the extortionist might find it too costly to manipulate compared to the agent's real, obvious values."
  *   **Follow-up:** "If you select a surrogate that is easy for the extortionist to threaten, you risk making it a viable target. If you select one that is hard for them to threaten, it fails as a decoy. How do you navigate this trade-off without the surrogate either being ignored or becoming a genuine liability?"

  **7. Timing and Correlation**
  "For the surrogate to bind acausally, the commitment must exist before the threatener models the agent. But if the threat is novel, the agent may need to adopt the surrogate *in response* to the threat landscape. Does the timing of the adoption break the logical correlation required for the threat to bind to the surrogate rather than the real goal?"
  *   **Follow-up:** "If you argue the surrogate must be adopted pre-emptively, doesn't that require agents to maintain permanent, costly surrogates against threats that may never materialize? At what point does the maintenance cost of the surrogate outweigh the expected loss from the acausal threat?"

  **8. Value Drift and Goal Preservation**
  "If an agent successfully cultivates a firm attachment to a surrogate, they have altered their own utility function. In a long-term horizon, how does the agent ensure the surrogate remains a subordinate instrument? What prevents the surrogate from becoming a terminal value that competes with or overrides the original goals?"
  *   **Follow-up:** "If the answer is 'meta-rules' to prevent the surrogate from overriding the real goal, aren't those meta-rules themselves vulnerable to the same acausal threats? You seem to be pushing the vulnerability up a level of abstraction rather than solving it."

  **9. Ecosystem Selection Effects**
  "If this strategy becomes known and widely adopted among rational agents, does it select for more ruthless or persistent extortionists? If every target presents a decoy, extortionists might escalate their demands or broaden their threats to cover both surrogate and real goals simultaneously."
  *   **Follow-up:** "If the equilibrium shifts toward agents threatening *both* sets of values, the surrogate strategy yields no benefit but incurs the cost of maintaining the decoy. Are you advocating for a strategy that is only optimal so long as it remains rare, and thus self-defeating if successful?"

  **10. Normative Prescriptivity**
  "Finally, is this a descriptive claim about what rational agents *will* do, or a normative claim about what they *should* do? If you advise agents to adopt surrogate goals, are you advising them to irrationally value things they know they shouldn't care about? How do you reconcile this with the standard definition of rationality as maximizing expected utility over *true* preferences?"
  *   **Follow-up:** "If you say rationality includes protecting oneself from acausal exploitation even at the cost of value-integrity, aren't you redefining rationality to include self-deception as a virtue? Does this not undermine the normative force of decision theory as a guide for truthful agency?"
