          *   Elena: The cousin is right about the act, but wrong to *say it*. He lacks the standing.
      *   **Round 2: The Mob Boss Analogy.**
          *   Marcus: If a mob boss stops a theft, the theft is still bad.
          *   Elena: But the mob boss isn't enforcing *morality*; he's enforcing *rules of the gang*. It highlights the difference between authority and moral standing. Let's refine this. A better analogy might be a judge or a parent. Let's stick with the prompt's suggestion but nuance it. The mob boss punishes for *disloyalty* or *breaking code*, not necessarily moral theft.
          *   *Correction:* The prompt specifically asked for the mob boss punishing his guy for stealing.
          *   Marcus: The theft is wrong regardless.
          *   Elena: The boss's blame is tainted because he violates the very norm he invokes. It turns blame into a weapon.
      *   **Round 3: Inconsistency vs. Hypocrisy.**
          *   Marcus: Isn't this just ad hominem?
          *   Elena: No, there's a difference between "I did this, it's wrong, you shouldn't" (repentant) vs. "I'm better than you for not doing this" (hypocrite). The cousin acts morally superior.
          *   Marcus: So if he admits his own cheating, he can blame?
