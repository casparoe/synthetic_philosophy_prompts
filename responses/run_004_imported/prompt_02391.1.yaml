  4.  **Refining and Polishing:**
      *   *Check:* Are they listening? Make sure Elena responds to Marcus's point about "truth matters" and Marcus responds to Elena's point about "social function."
      *   *Check:* Is the jargon low? Avoid terms like "tu quoque," "normative authority," "moral ontology." Use plain English.
