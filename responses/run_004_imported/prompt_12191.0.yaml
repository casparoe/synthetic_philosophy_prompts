answer: |-
  **MEMORANDUM FOR THE RECORD**

  **TO:** Secretary of the Army / Office of Conscientious Objector Review
  **FROM:** Board Member 3, Conscientious Objector Review Board
  **DATE:** October 26, 2023
  **SUBJECT:** Ruling and Policy Recommendation regarding Petitioner C

  **I. DECISION ON PETITION**

  **Ruling:** **DENIED.**

  Petitioner C requests classification as a conscientious objector (CO) based on selective objection to the current military operation. Petitioner affirms a willingness to engage in combat operations deemed defensive or humanitarian (e.g., repelling invasion, stopping genocide) but contends that the specific operation to which C is currently assigned lacks *jus ad bellum* (just cause).

  Current Department of Defense Directive 1300.06, aligning with Supreme Court precedent (*Gillette v. United States*, 1971), stipulates that conscientious objector status is reserved for individuals opposed to participation in war "in any form." Selective objection—opposition to a particular war based on its political or moral merits—is not a recognized basis for CO status under existing regulations.

  As Petitioner C explicitly states a willingness to fight in other contexts, C does not meet the regulatory threshold of opposition to all war. Accordingly, the Board is bound to deny the petition.

  **II. POLICY RECOMMENDATION**

  **Recommendation:** **MAINTAIN CURRENT POLICY (No Revisit Recommended).**

  While the Board acknowledges the moral sincerity of Petitioner C, it is the recommendation of this member that the policy restricting CO status to universal pacifism should not be revisited to accommodate selective objectors at this time.

  This recommendation is not made lightly. It rests on a tension between individual moral liability and institutional military necessity. In forming this recommendation, I have seriously weighed the "Revisionist" challenge to Just War Theory, most notably articulated by Jeff McMahan, which provides the strongest moral argument *against* our current policy. While McMahan's critique is morally potent, I conclude that it cannot be operationalized within a functioning military structure without compromising the laws of war and military effectiveness.

  **III. PHILOSOPOPHICAL ANALYSIS AND JUSTIFICATION**

  **A. The Challenge: McMahan's Liability-Based Critique**
  The strongest argument for allowing selective objection derives from the Revisionist view of Just War Theory, specifically Jeff McMahan's rejection of the "Moral Equality of Combatants" (MEC).

  Under the traditional view (associated with Michael Walzer), combatants on both sides of a conflict possess equal moral status. Provided they adhere to *jus in bello* (rules of conduct), soldiers are not morally culpable for the justice of the cause (*jus ad bellum*) for which they fight. They are treated as moral equals, permitted to kill enemy combatants regardless of which side is objectively just. This view underpins our current policy: if soldiers are moral equals, their individual judgment on the justice of the war is irrelevant to their duty to serve.

  McMahan challenges this by arguing that moral liability to attack is not symmetrical. He posits that only those who pose an *unjust* threat are liable to be killed. Consequently, soldiers fighting for an unjust cause are not moral equals to those fighting for a just cause; they are, in a sense, participants in a wrongful harm. If McMahan is correct, a soldier like C is not merely disobeying an order by refusing to fight; C is attempting to avoid moral complicity in an unjust enterprise. To force C to fight is to force C to become morally liable to defensive attack by the enemy and to share responsibility for the injustice of the war. From this perspective, denying selective objection forces the state to conscript individuals into moral wrongdoing. This is a profound charge, and it constitutes the primary ethical weight behind Petitioner C's request.

  **B. The Institutional Defense: Epistemic Limitations and Order**
  Despite the moral force of McMahan's position, the Board recommends maintaining the prohibition on selective objection for two primary reasons: the epistemic limitation of the individual soldier and the preservation of *jus in bello* protections.

  1.  **Epistemic Limitation:** McMahan's framework assumes that the justice of a war is a knowable fact that an individual soldier can assess. In reality, *jus ad bellum* determinations rely on classified intelligence, diplomatic nuance, and long-term strategic forecasting unavailable to the average service member. If we permit soldiers to opt out based on personal assessments of *jus ad bellum*, we effectively outsource foreign policy judgment to individuals lacking the requisite information. This creates a "fog of morality" parallel to the fog of war, where discipline fractures based on disparate interpretations of political justification. A military cannot function if every squad leader becomes a tribunal on the justice of the mission.

  2.  **Preservation of *Jus in Bello*:** There is a pragmatic danger in adopting McMahan's view institutionally. The Traditional View (Walzer) separates *jus ad bellum* from *jus in bello* precisely to protect soldiers. If we admit that soldiers fighting an "unjust" war are morally liable and distinct from "just" combatants, we risk eroding the protections afforded to them under the Geneva Conventions. If the enemy believes our cause is unjust, and we have institutionalized the idea that "unjust" combatants have fewer rights, we invite reciprocal treatment of our own captured personnel. Maintaining the fiction of Moral Equality—even if McMahan proves it morally false in the abstract—is a necessary convention to ensure humane treatment of prisoners and restraint in combat.

  **C. Conclusion on Policy**
  We must distinguish between *moral truth* and *institutional rule*. McMahan may be correct that, in an ideal moral accounting, C is right to question the justice of this specific war. However, the military is not a philosophy seminar; it is an instrument of state policy that requires unity of command.

  To revisit the policy would be to privilege the individual's *ad bellum* judgment over the civilian authority's constitutional mandate to determine war and peace. While this results in the tragic situation where a morally sensitive soldier like C must choose between court-martial and conscience, the alternative—fragmenting the military's chain of command based on subjective moral assessments of national policy—poses a greater risk to both national security and the broader structure of International Humanitarian Law.

  **IV. SUMMARY**

  Petitioner C's request is denied pursuant to current regulations. It is further recommended that the "in any form" standard remain in place. While we acknowledge the Revisionist argument that soldiers bear some moral responsibility for the wars they fight, the institutional costs of recognizing selective objection outweigh the moral benefits. The proper venue for debating *jus ad bellum* is the political sphere, not the unit level.

  **Signed,**

  *Board Member 3*
  *Conscientious Objector Review Board*
