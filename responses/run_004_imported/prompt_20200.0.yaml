prompt: |-
  A puzzle from value theory keeps resurfacing whenever debates in this community turn to cause prioritization or to comparing welfare across very different kinds of beings (the recent arguments over cross-species "moral weight," for instance), and I would like a more rigorous treatment of it than the usual gestures toward Isaiah Berlin's pluralism.

  Ruth Chang has argued that the "Trichotomy Thesis" — the assumption that any two comparable options must be better than, worse than, or exactly as good as one another — is false, and that there is a fourth relation, "parity," which comparable-but-different options can stand in instead. Her central argument runs through small-improvement cases: take two options that intuitively seem roughly on a level (two careers, say, or two job candidates), then slightly improve one of them. If the original pair had merely been tied, this small improvement should tip the balance and make the improved option better; in the cases Chang has in mind, it doesn't seem to, and the pair remains stubbornly hard to rank. She concludes that neither exact equality nor sheer incomparability explains this, and that parity must be recognized as a distinct, sui generis value relation.

  The main rival to this view, defended by John Broome in his contribution to Chang's own edited volume on incommensurability, holds that no new relation is needed: "better than" is simply a vague predicate, our comparative judgments run out at the margins, and the resistance to ranking in Chang's cases is just ordinary indeterminacy rather than evidence of a fourth relation.

  Write an essay adjudicating between these two positions. Reconstruct the small-improvement argument carefully, consider whether a vagueness theorist can accommodate the same cases without positing parity, and defend a definite verdict on whether "on a par" names a real, sui generis value relation or reduces to vagueness in the ordinary comparative. Close by drawing out what your verdict implies for making a genuinely hard choice among incommensurable options: is there a rationally defensible way to decide, or does it bottom out in something closer to arbitrary commitment?
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Value theory, specifically the debate over the "Trichotomy Thesis" vs. Ruth Chang's "Parity" relation.
      *   **Context:** Cause prioritization, cross-species moral weight (EA community context implied).
      *   **Key Figures:** Ruth Chang (Parity) vs. John Broome (Vagueness).
      *   **Core Argument:** The Small-Improvement Argument (SIA).
      *   **Task:** Write an essay adjudicating between Chang and Broome.
      *   **Requirements:**
          1.  Reconstruct the Small-Improvement Argument carefully.
          2.  Consider the vagueness theorist's counter-argument (Broome).
          3.  Defend a definite verdict (Parity is real OR Parity reduces to vagueness).
          4.  Draw implications for hard choices (rational decision vs. arbitrary commitment).
      *   **Tone:** Rigorous, philosophical, analytical (avoiding mere gestures to pluralism).

  2.  **Initial Brainstorming & Position Taking:**
      *   *Chang's View:* Parity is a fourth relation. Options are comparable but not rankable by "better/worse/equal." Hard choices allow for will-based commitment.
      *   *Broome's View:* "Better than" is vague. There are borderline cases. The SIA fails because small improvements move an option from "borderline better" to "definitely better" without implying the original was equal.
      *   *My Verdict:* I need to choose one. Chang's view is more exciting and fits the "hard choice" phenomenology better, but Broome's is more parsimonious. However, Broome's vagueness account struggles with the *phenomenology of reason* in hard choices. If it's just vagueness, rational choice theory breaks down differently than if it's parity. Chang's view empowers agency. I will argue *for* Chang's Parity view, but acknowledge the strength of the vagueness objection before refuting it based on the structure of practical reason.
      *   *Implication:* If Parity is real, hard choices are opportunities for normative creation (will). If Vagueness is real, hard choices are epistemic failures or gaps in the good. I'll argue for the former.

  3.  **Outline Structure:**
      *   **Introduction:**
          *   Hook: The problem of hard choices in effective altruism/moral weight.
          *   The Trichotomy Thesis.
          *   Introduce Chang (Parity) vs. Broome (Vagueness).
          *   Thesis Statement: Chang's parity is the superior account because vagueness fails to capture the normative structure of hard choices, specifically the possibility of rational commitment without decisive reasons.
      *   **Section 1: The Small-Improvement Argument (SIA):**
          *   Define Trichotomy ($A > B$, $B > A$, $A = B$).
          *   Setup: $A$ and $B$ are hard to compare (e.g., Artist vs. Lawyer).
          *   Move: Improve $B$ slightly to $B+$.
          *   Logic:
              1.  If $A = B$, then $A < B+$.
              2.  But intuitively, $A$ is not worse than $B+$.
              3.  Therefore, $A \neq B$.
              4.  If $A > B$ or $B > A$, it wouldn't be a hard choice.
              5.  Therefore, a fourth relation (Parity) exists.
      *   **Section 2: The Vagueness Objection (Broome):**
          *   "Better than" is a vague predicate.
          *   Borderline cases exist.
          *   $B$ is borderline better than $A$. $B+$ is definitely better than $A$.
          *   Small changes can cross a threshold from borderline to definite without implying equality at the start.
          *   Parsimony argument: Don't multiply relations beyond necessity.
      *   **Section 3: Adjudication (Defending Parity):**
          *   Critique of Vagueness: Vagueness implies epistemic uncertainty or semantic indeterminacy. But hard choices feel *ontologically* open, not just unclear.
          *   The "No Difference" problem: If it's just vagueness, why does the agent feel permitted to choose either? Vagueness suggests we should wait for more precision. Parity suggests we must *make* the precision.
          *   Normative Significance: Parity preserves the comparability (they are in the same "neighborhood") which vagueness sometimes threatens (collapsing into incomparability).
          *   Key Point: The SIA works because the *reasons* don't change weight enough to tip the scale, yet equality is rejected.
      *   **Section 4: Implications for Hard Choices:**
          *   If Vagueness: Decision is arbitrary or requires arbitrary tie-breaking.
          *   If Parity: Decision is an exercise of "normative power." We create reasons through commitment.
          *   Application to Cause Prioritization: We can't just calculate; we must commit to make one path better.
      *   **Conclusion:**
          *   Summarize argument.
          *   Final thought on agency and value.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Make sure to mention the EA context lightly but keep the philosophy rigorous. Define the Trichotomy Thesis clearly.
      *   *SIA:* Need to be precise. Let $A$ and $B$ be the options. $B+$ is $B$ plus a small improvement (e.g., slightly higher salary). If $A = B$, then $A < B+$. But intuitively, $A$ is not worse than $B+$. So $A \neq B$. Since neither is clearly better, Trichotomy fails.
      *   *Broome:* Focus on the sorites paradox structure. "Better" has a positive extension, negative extension, and penumbra. $B$ is in the penumbra. $B+$ is in the positive extension. This explains why $A$ isn't equal to $B$ but also isn't worse than $B+$.
      *   *Critique:* Why is Broome wrong? The "Collapsing" objection. If "better" is vague, then "equal" must also be vague. But Chang argues equality is precise (Leibniz's law applied to value). Also, the phenomenology of *agency*. Broome makes the agent passive (waiting for clarity). Chang makes the agent active.
      *   *Decision:* I will argue that Parity is distinct. The vagueness account treats the lack of ranking as a defect in the *concept* or our *knowledge*. Parity treats it as a feature of the *value landscape*.
      *   *Implications:* This is crucial for the prompt's ending. If Parity, then "will" creates reasons. This is Chang's "Will-Based Reasons." This avoids arbitrariness. It's not a coin flip; it's a commitment that *makes* the choice right.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address cross-species moral weight? *Adjustment:* Mention it in the intro and implications as a concrete example (e.g., saving humans vs. saving chickens).
      *   *Check:* Is the SIA reconstruction accurate? *Adjustment:* Ensure I distinguish between "incomparability" and "parity." Chang insists they are comparable (in the same neighborhood) but not rankable. Vagueness often blurs this.
      *   *Check:* Is the verdict definite? *Adjustment:* Yes, I will come down firmly on Chang's side, arguing that vagueness is an insufficient explanation for the normative force of hard choices.

  6.  **Final Polish:**
      *   Ensure philosophical terminology is used correctly (sui generis, penumbra, trichotomy, normative power).
      *   Check flow and transitions.
      *   Make sure the conclusion ties back to the "arbitrary commitment" question.

  7.  *(Mental Note on Broome's specific argument)*: Broome argues that "better than" is vague, so there are cases where it is neither true nor false that $A$ is better than $B$. This doesn't require a fourth relation; it just requires non-bivalence. I need to counter this by showing that non-bivalence doesn't capture the *positive* relation of being "on a par." Parity isn't just "not better/worse/equal"; it's a specific kind of comparability.

  8.  *(Mental Note on the "Hard Choice" implication)*: If it's vagueness, rational choice theory says you can pick either (indifference). If it's parity, rational choice theory says you can pick either, *and* by picking you generate new reasons. This distinction is vital.

  9.  **Finalizing the Essay Structure:**
      *   Title: Something about Parity vs. Vagueness.
      *   Intro: Context, Trichotomy, Chang vs. Broome.
      *   The Small-Improvement Argument.
      *   The Vagueness Counter-Proposal.
      *   Why Vagueness Fails (The Normative Gap).
      *   Implications: Will and Commitment.
      *   Conclusion.

  (Proceed to write the essay based on these thoughts.)
answer: |-
  **The Fourth Relation: Parity, Vagueness, and the Structure of Hard Choices**

  In debates regarding cause prioritization and cross-species moral weight, proponents of effective altruism often encounter a persistent theoretical friction. When comparing, for instance, the welfare of a human against the welfare of a chicken, or the long-term benefits of AI safety against the immediate alleviation of global poverty, the intuition arises that these options are not merely difficult to compare, but that they resist the standard metrics of comparison. They seem neither strictly better, nor worse, nor exactly equal. This friction points to a foundational problem in value theory: the validity of the Trichotomy Thesis.

  The Trichotomy Thesis holds that for any two items $A$ and $B$ in a comparative class, exactly one of three relations must obtain: $A$ is better than $B$, $B$ is better than $A$, or $A$ is exactly as good as $B$. Ruth Chang has famously challenged this thesis, arguing for a fourth relation: "parity." According to Chang, items can be comparable yet unrankable, standing "on a par." The primary rival to this view, articulated by John Broome, contends that no fourth relation is required. Broome argues that "better than" is a vague predicate, and the resistance to ranking in Chang's cases is merely a matter of semantic or epistemic indeterminacy.

  This essay adjudicates between Chang's parity view and Broome's vagueness view. I will reconstruct Chang's Small-Improvement Argument, demonstrate that Broome's vagueness account fails to capture the normative structure of hard choices, and defend the verdict that parity is a *sui generis* value relation. I conclude that accepting parity transforms our understanding of hard choices: they are not sites of arbitrary selection, but opportunities for the rational exercise of normative power through commitment.

  ### The Small-Improvement Argument

  Chang's case for parity rests on the Small-Improvement Argument (SIA), designed to eliminate the three standard trichotomous relations. Consider two career options: becoming an academic philosopher ($A$) or a corporate lawyer ($B$). Intuitively, neither is clearly better than the other, yet they do not seem precisely equal in value; they are different in kind.

  The argument proceeds as follows:
  1.  **Assume Trichotomy:** Either $A > B$, $B > A$, or $A = B$.
  2.  **Eliminate Better/Worse:** By hypothesis, this is a "hard choice." If $A$ were better than $B$, it would be irrational to choose $B$ without a specific reason. Since both seem rationally permissible, neither is better than the other.
  3.  **Eliminate Equality (via Small Improvement):** Imagine we improve option $B$ slightly to $B+$ (e.g., the lawyer job offers a marginally higher salary).
      *   If $A$ were exactly equal to $B$, then $B+$ must be better than $A$ (since $B+$ is better than $B$, and equality is transitive).
      *   However, intuitively, a small improvement to the lawyer job does not necessarily make it *better* than the philosopher job. The choice remains hard; $A$ is not rendered worse than $B+$.
      *   Therefore, $A$ is not exactly equal to $B$.
  4.  **Conclusion:** Since $A$ is not better than $B$, $B$ is not better than $A$, and $A$ is not equal to $B$, the Trichotomy Thesis is false. There must be a fourth relation, parity ($A \parallel B$), where $A$ and $B$ are comparable (in the same "neighborhood" of value) but not rankable.

  Chang emphasizes that parity is distinct from incomparability. Incomparability implies the options fail to share a common covering value (like comparing the number 5 to the taste of an orange). Parity implies they share a covering value (both are careers, both contribute to the good) but the value structure does not determine a ranking.

  ### The Vagueness Objection

  John Broome challenges the necessity of this fourth relation. He argues that Chang's SIA relies on a misunderstanding of the logic of vague predicates. In Broome's view, "better than" is not a precise relation with sharp boundaries; it has a positive extension (definitely better), a negative extension (definitely not better), and a penumbra (borderline cases).

  Broome reconstructs the lawyer/philosopher case using this model:
  *   $B$ (lawyer) is in the penumbra of "better than $A$." It is neither true nor false that $B$ is better than $A$.
  *   $B+$ (improved lawyer) is in the positive extension. It is true that $B+$ is better than $A$.
  *   Crucially, moving from a borderline case to a definite case does not require the original case to have been one of equality. In a sorites series (e.g., a heap of sand), removing one grain from a borderline heap might result in a definite non-heap, without implying the original was a definite heap.

  For Broome, the intuition that $A$ is not worse than $B+$ is explained by the fact that $B$ was only *borderline* better than $A$. The small improvement pushes $B$ across the threshold of definiteness. Thus, we can explain the phenomenology of hard choices using standard logic plus vagueness, without positing a metaphysically extravagant fourth relation. Broome's objection is one of parsimony: why multiply value relations if semantic indeterminacy explains the data?

  ### Adjudication: Why Vagueness Fails

  While Broome's account is logically coherent, it fails to capture the *normative* significance of hard choices. The vagueness model treats the inability to rank options as a defect—either in the world (ontic vagueness) or in our concepts/epistemic access (semantic/epistemic vagueness). If Broome is right, a hard choice is essentially a moment of uncertainty. The rational agent, confronted with vagueness, should ideally seek more precision or acknowledge that the question "Which is better?" lacks a truth value.

  However, this does not align with the phenomenology of agency in hard choices. When an agent faces a choice between parity options (e.g., having a child vs. pursuing a demanding career), they do not typically feel they are waiting for more information to resolve a borderline case. They feel that *no amount of information* will resolve the ranking, because the values are qualitatively different.

  More damningly, the vagueness account collapses the distinction between parity and incomparability in practice. If "better than" is vague, then at the limit, the relation dissolves. But Chang's parity preserves comparability. To say $A$ and $B$ are on a par is to say they are in the same neighborhood of value; they are "in the running." Vagueness suggests the relation is fading out; parity suggests the relation is robust but non-linear.

  The decisive argument against Broome lies in the implications for practical reason. If the Trichotomy Thesis holds (via vagueness), then rational choice theory dictates that if neither option is better, the agent is indifferent. Indifference implies that a random selection (a coin flip) is rationally permissible and that there is no rational residue after the choice.

  But hard choices leave rational residue. If I choose the philosopher career over the lawyer career, I subsequently have reasons to favor that path that I did not have before. I have "made" the choice right through my commitment. The vagueness account cannot explain this. If $A$ and $B$ are merely borderline cases, my choosing $A$ does not change the truth value of "$A$ is better than $B$." It remains indeterminate.

  Chang's parity account, conversely, explains the normative power of the will. Because $A$ and $B$ are on a par, the reasons do not dictate a choice. This gap is not a failure of rationality but a space for agency. By committing to one option, the agent creates new reasons (through integrity, identity, and follow-through) that tip the scale retroactively. This phenomenon—where the act of choosing generates the reasons that justify the choice—is inexplicable if the underlying relation is merely vague. Vagueness implies the answer is out there but fuzzy; parity implies the answer is determined by the agent's will.

  Therefore, parity is a *sui generis* relation. It is not reducible to vagueness because it supports a structure of practical reasoning (normative creation) that vagueness cannot sustain.

  ### Implications for Hard Choices and Cause Prioritization

  Accepting Chang's verdict over Broome's has profound implications for how we approach difficult prioritization decisions, particularly in contexts like cross-species welfare or long-termism.

  If Broome is right and "better than" is merely vague, then hard choices are essentially epistemic problems. The goal of the moral agent is to refine their metrics until the vagueness disappears. If it cannot be refined, the choice is arbitrary; picking one cause over another is a coin flip justified only by the lack of a truth value. This leads to a passive conception of moral agency, where the agent waits for the world to reveal the ranking.

  If Chang is right, hard choices are opportunities for normative creation. When we face a choice between two causes that are on a par (e.g., animal welfare vs. global health), we are not stuck in indeterminacy. We are invited to exercise our "normative power." By committing to one cause, we invest it with personal and communal significance that makes it the right choice *for us*. This commitment is not arbitrary; it is rational because it is the only way to resolve the parity. The justification comes not from the pre-existing weight of the options, but from the will of the agent to stand behind one.

  This avoids the paralysis of infinite calculation. In cause prioritization, we often search for a "common currency" of value (e.g., utilitarian utils) to force a trichotomous ranking. Chang's view suggests this search may be futile not because the values are incomparable, but because they are on a par. Recognizing parity allows us to stop searching for a non-existent precise metric and instead focus on building the commitment that will make our chosen path the superior one.

  ### Conclusion

  John Broome's vagueness account offers a parsimonious logical solution to the Small-Improvement Argument, but it fails as a theory of practical reason. It treats the resistance to ranking as a semantic glitch rather than a structural feature of value. Ruth Chang's parity view, while metaphysically more demanding, accurately captures the phenomenology of hard choices and explains the rational possibility of commitment.

  Parity is a real, fourth value relation. It describes a landscape where options are comparable but unranked, leaving space for the human will to operate not as a slave to pre-existing reasons, but as a source of them. In the context of moral weight and cause prioritization, this means that when the calculus runs out, we are not left with arbitrary choice. We are left with the rational authority to decide, and in deciding, to make our choice right.
