      *   In EMG, I commit if $E[\text{Payoff}] > \text{Safe}$. Because the penalty for being the *only* one to commit is huge, the threshold is effectively 100%.
      *   Wait, is the threshold effectively 100%? Rubinstein's result holds even if the penalty is finite, provided $\epsilon$ is small enough relative to the payoff ratio. I need to be careful not to say "infinite penalty." The math shows that for *any* finite penalty, if $\epsilon$ is small, the unraveling holds. Actually, Rubinstein's specific result relies on the loss from miscoordination being large enough relative to the gain from coordination.
      *   *Correction:* The unraveling happens because at step $T$, Player 2 knows Player 1 *might* have received $T$ messages, but Player 1 knows Player 2 *might* think Player 1 received $T-1$. The probability mass shifts.
      *   Let's stick to the core intuition: The probability that the *other* person thinks the chain is short is always high enough to deter the risk, because the "chain is short" scenario implies the other person will play Safe.

  6.  **Synthesizing the Answer:**

