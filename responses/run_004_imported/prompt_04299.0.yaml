      *   **Part 1: The Unraveling Logic.** Walk through $T=1, 2, 3$. Show how the doubt propagates.
      *   **Part 2: The Payoff Asymmetry.** Explain that CS systems usually have bounded loss (idempotency), whereas EMG assumes unbounded or high-asymmetry loss.
      *   **Part 3: Common Knowledge.** Confirm the user's suspicion. Finite $\neq$ Infinite. The discontinuity is real.
      *   **Part 4: Why Engineers Win.**
          *   We don't play Nash Equilibrium; we play Protocol.
          *   We mitigate the "Disaster" payoff (compensating transactions).
          *   We change the topology (Quorums).
      *   **Conclusion:** The model highlights a fragility in *coordination without commitment*, not necessarily in *communication*.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain *why* it snaps back to zero?
      *   *Explanation:* It's not that confidence drops. It's that the *conditional probability* that the other player is in a state where *they* will play Safe remains high enough to make Risk suboptimal.
