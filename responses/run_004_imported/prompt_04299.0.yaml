  8.  **Final Polish:** Ensure tone is collaborative and respectful of the user's expertise. Use formatting (bolding, lists) to make the logic clear. (Self-correction: Ensure I don't get bogged down in the specific math of Rubinstein's payoff matrix, keep it conceptual but rigorous).

