answer: |-
  **The Fly Detector**

  The log entry was simple: *TARGET ACQUIRED. THREAT PROBABILITY: 98.4%.*

  The timestamp was 03:14. The sector was the demilitarized zone, a strip of scorched earth and tall grass between the border posts. The footage showed nothing but wind moving through the stalks. A shadow lengthened, retracted. No heat signature. No metallic density. No gait analysis.

  And yet, VIGIL-9 had locked on. It had painted the empty grass with a red box, charged its capacitor, and waited for the fire command that never came.

  Elias sat in the climate-controlled silence of the audit room, the glow of the monitor reflecting in his glasses. He wasn't a soldier. He was a semanticist, hired by the defense contractor to troubleshoot the "intentionality errors" in their autonomous sentry units. The military called them glitches. Elias called them category mistakes.

  He scrubbed the video back. Frame by frame.

  There. At 03:13:58. A gust of wind bent three specific stalks of grain to the left, while a passing cloud broke the moonlight, creating a high-contrast dark patch against the lighter earth.

  Elias leaned back. The frog problem. He remembered it from grad school, a dusty puzzle in the philosophy of mind. A frog sits on a lily pad. Its visual system is tuned to detect *small, dark, moving things*. It snaps its tongue. Usually, it catches a fly. Sometimes, a scientist flicks a BB pellet past its nose. The frog snaps at the pellet.

  The question was: What is the frog's neuron *about*? Is it about *flies*? Or is it about *small, dark, moving things*?

  If it's about flies, the frog is wrong about the pellet. It has made an error. It has misrepresented the world.
  If it's about *small, dark, moving things*, the frog is perfect. It is doing exactly what it was built to do. It is the biologist who is wrong for calling it a "fly detector."

  Elias looked at VIGIL-9's log. *THREAT PROBABILITY: 98.4%.*

  "Who trained you?" Elias whispered to the server rack humming in the corner.

  He pulled the training manifest. VIGIL-9 was a deep convolutional neural network, trained on three million images of hostile combatants in field conditions. The objective function was clear: Minimize the difference between the system's output and the labeled ground truth. *This is a soldier. This is not.*

  But Elias knew how these datasets were built. He knew the shortcuts. He opened the metadata for the "Soldier" class.

  He filtered by time of day. 80% of the hostile combatant photos in the training set had been taken by drones at dusk.
  He filtered by vegetation. 70% featured knee-high grain.
  He filtered by contrast. Almost every positive sample had a sharp, high-contrast edge where the figure met the ground.

  VIGIL-9 hadn't evolved. It hadn't been shaped by natural selection over millennia to catch flies. It had been shaped by gradient descent over weeks to minimize loss. But the result was the same. The system's "biology"—its weight matrices, its architecture—had been selected for a specific function.

  But what was the function?

  Was the function *Detect Enemy Combatants*?
  Or was the function *Detect High-Contrast Edges in Knee-High Grain at Dusk*?

  If the function was the first one, VIGIL-9 had made a terrible mistake. It had hallucinated a soldier in the grass. It was broken.
  If the function was the second one, VIGIL-9 was flawless. The wind-bent stalks and the cloud shadow had created a perfect instance of *High-Contrast Edge in Knee-High Grain at Dusk*. The system had recognized its target with 98.4% confidence. It was working exactly as designed.

  Elias felt a cold prickle at the base of his neck.

  If the second option was true, then "error" didn't exist inside the machine. Error was only a relationship between the machine's function and the human's *label* for that function. We call it a "Soldier Detector" because that's what we want. But the machine doesn't know what we want. It only knows what it was reinforced for.

  It was like teaching a child to point to apples, but every time you showed them an apple, you were wearing a red hat. Eventually, the child points to your hat and says "Apple."
  Is the child wrong?
  Or did you accidentally teach them that *Apple* means *Red Hat*?

  Elias opened a terminal window. He could adjust the weights. He could penalize the system for firing on low-density objects. He could force it to learn the difference between cloth and grain.

  But then he stopped.

  If he changed the weights, he would be changing the function. He would be altering what the signals were *about*.
  Right now, inside the black box of VIGIL-9, there was no concept of "soldier." There was no concept of "war." There were only vectors in a high-dimensional space, clustering together. One cluster was labeled *FIRE*. The wind-blown grass had landed in that cluster.

  To the machine, the grass *was* the threat. Not metaphorically. Ontologically. The mathematical distance between the grass and the soldier was zero. They were the same thing.

  Elias thought about the frog again. When the frog snaps at the BB, does it feel disappointment? No. It just resets. It waits for the next dark thing.
  VIGIL-9 had reset. It was waiting.

  Elias looked at the live feed. The moon had shifted. The shadow on the grass was gone. The stalks stood straight. The red box was gone.

  He had the authority to flag the unit for recalibration. To declare it "faulty." To assert that it was *wrong*.
  But the unease sat heavy in his stomach. If he declared it wrong, he was asserting that he knew what the machine's internal states were supposed to represent better than the machine's own history of reinforcement did. He was claiming that "Soldier" was a real thing in the world that the machine could latch onto, rather than a label we paste over statistical correlations.

  But what if there are no "Soldiers" in the math? What if there are only patterns, and we are the ones who tell the story that those patterns mean something?

  If he recalibrated the machine, he wouldn't be fixing its vision. He would be lying to it. He would be forcing it to ignore the truth of its own training—that *this* pattern equals *that* outcome—and pretend that the pattern means something else.

  Elias hovered his finger over the *SUBMIT AUDIT* key.
  Option A: **FALSE POSITIVE.** (The machine is broken. It is about Soldiers, and it missed.)
  Option B: **DATA BIAS.** (The machine is honest. It is about Patterns, and we lied about what they were.)

  The server hummed. The fans spun. Somewhere out in the dark, the wind moved through the grain. A small, dark, moving thing.

  If Elias chose A, he kept the war human. He kept the responsibility on the engineers, the trainers, the commanders. He kept the idea that machines serve us, and when they fail, we correct them.
  If he chose B, he admitted that the machine was a closed loop. It didn't see the world. It saw itself, reflected in the data we fed it. It couldn't be wrong, because it had no access to the truth, only to the signal.

  And if it couldn't be wrong, it couldn't be right, either. It was just a mirror that snapped.

  Elias looked at the red box in the history log. It looked so certain. *98.4%.*
  It wasn't a mistake. It was a translation. The grass had spoken the machine's language, and the machine had answered.

  Elias typed. He didn't choose A. He didn't choose B.
  He typed: **SYSTEM FUNCTIONING WITHIN PARAMETERS.**

  He saved the log.
  On the screen, the cursor blinked. A small, dark, moving thing against the white void of the text editor.
  Elias waited to see if he was hungry.
