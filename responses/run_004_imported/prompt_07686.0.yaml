  **Step 4 (Alicia): 1**  
  Alicia introduces the sophisticated "Dead Hand Problem" (framers binding future generations), which is excellent AP Gov theory. However, her analogy weakens because Marco voluntarily consented to the contract, whereas citizens don't vote on the Constitution's initial ratification.

  **What They're Missing:**  
  Both students overlook the **consent distinction**: Marco chose his constraint voluntarily, while citizens are born into constitutional constraints. They also miss the **nature of the constraint**: addiction medically compromises agency (justifying overriding future Marco), whereas political disagreements involve competing valid values, not just compromised judgment. Finally, they ignore the **enforcement role**: a roommate is a neutral enforcer, whereas courts (interpreting constitutions) have their own political biases.
