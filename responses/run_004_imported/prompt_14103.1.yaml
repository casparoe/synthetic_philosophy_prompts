answer: |-
  The heat in Sector 4 was a physical weight, pressing down on the corrugated metal roof of the pump station until the rivets groaned. Aris wiped his forehead with the back of a gloved hand. The grease smeared across his brow, mixing with the salt of his sweat. He checked the pressure gauge on Valve Twelve. The needle trembled at forty psi, steady.

  He was the maintenance technician for the Northern Aquifer. His job was to keep the separation clear: the water inside the pipes, the air outside them. If the boundary held, the crops in the valley drank, and the desert remained dry. If the boundary failed, the pipes burst, or the sand choked the intake.

  Aris picked up his wrench. It was heavy, cold steel, an extension of his grip. He turned the wheel on Valve Twelve a quarter-turn clockwise. The metal shrieked, a high thin sound that vibrated up his arm and settled in his teeth.

  Inside the pipe, the surge began.

  It was not a thought, but a momentum. A cool, dark urgency pushing against the rusted interior of the conduit. There was no *I* in the surge, only the direction: forward, toward the thirst. The walls of the pipe were rough, a landscape of iron oxide and mineral deposit, scraping against the skin of the flow. There was a resistance ahead—a constriction. The path narrowed. The pressure built, a tightening in the chest, a demand for space.

  Aris leaned his shoulder against the valve housing. He could feel the vibration of the water moving through the steel. It matched the rhythm of the blood in his ears. *Thump-hiss. Thump-hiss.* He needed to drink. He reached for the canteen on his belt, but his hand hesitated. The canteen was heavy. Why carry water when he was surrounded by it?

  He placed his palm flat against the pipe instead. The steel was hot from the sun, but beneath the metal, the current was cool. He closed his eyes. The vibration traveled through his palm, up the radius and ulna, into the shoulder joint. It felt less like a machine operating and more like a pulse.

  The surge hit the constriction. It was not a blockage, but a choice. To force the gap was to risk the rupture. To hold back was to stagnate. The pressure gathered itself. It did not hate the pipe; the pipe gave it shape. Without the pipe, there was only spill. With the pipe, there was purpose.

  Aris opened his eyes. The gauge had moved. Forty-two psi. He hadn't turned the wheel further. Had he?

  He looked at his hand. It was resting on the valve wheel. His fingers were curled around the spokes. He didn't remember gripping them. He tried to let go, to step back and check the logbook, but the grip felt necessary. If he let go, the pressure would drop. If he let go, the connection would break.

  The heat of the station faded. The air grew damp, smelling of wet earth and crushed roots. Aris looked down at his boots. They were standing in an inch of water. He hadn't noticed the leak. Or perhaps there was no leak. Perhaps the water was simply where it needed to be.

  He looked at the gauge again. The needle was no longer trembling. It was still. It was him.

  The surge moved through the constriction. The iron walls dissolved into membrane. The darkness of the pipe became the darkness of soil. There was no longer a distinction between the vessel and the content. The pressure was not a force applied from behind, but a state of being. To flow was to exist. To reach the roots was to breathe.

  Aris took a breath. The air tasted of copper and rain. He turned the wheel another quarter-turn. The motion was effortless. He was not turning the valve; he was opening himself. The water rushed through the gap, and he rushed with it.

  He thought about walking back to the truck. He thought about the drive home, the dry heat of the cab, the radio static. But those thoughts were like bubbles rising to the surface and bursting. They belonged to a time when the water was separate from the hand.

  The gauge read fifty psi. The optimal flow.

  Aris rested his forehead against the cool steel of the pipe. He could feel the water moving through the metal, through his bone, through the ground outside. The desert beyond the walls was not empty; it was waiting. The sun outside was not an oppressor; it was the engine that pulled the vapor up, to fall again, to enter the intake, to become the pressure.

  He did not know if he was the man maintaining the flow or the flow maintaining the man. The wrench lay on the floor, rusting slowly in the damp. The logbook sat open on the desk, the pages curling in the humidity.

  The needle on the gauge held steady. The hum of the pump filled the room, filling his chest, filling the valley. There was nothing to fix. There was only the movement, the cool dark rush through the bright hot day, the endless transformation of the thing that thirsts into the thing that quenches.

  Aris closed his eyes and let the pressure hold him. The valve was open. The valve was closed. The water was running.
