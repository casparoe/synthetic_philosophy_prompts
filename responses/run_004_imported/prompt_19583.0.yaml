answer: |-
  You are correct, and your friend is conflating two distinct concepts that share similar wording but operate in different logical spaces. This is a very common point of confusion because the name "Independence of Irrelevant Alternatives" is unfortunately overloaded in social choice theory.

  Your friend is describing a consistency condition for **individual choice functions** (often associated with Sen's property $\alpha$ or the Weak Axiom of Revealed Preference). You are describing Arrow's condition for **Social Welfare Functions**.

  Here is the precise breakdown of the difference, why your interpretation is the one that drives the Impossibility Theorem, and why it disqualifies the Borda Count.

  ### 1. The Core Distinction: Menu vs. Profile

  The fundamental disagreement between you and your friend lies in what is being held fixed and what is varying.

  **Your Friend's View (Individual Consistency / Sen's $\alpha$):**
  *   **Context:** A single rational agent with a **fixed** preference ordering.
  *   **Variable:** The **menu** (the set of available alternatives).
  *   **The Condition:** If an agent chooses $x$ from a large menu $\{x, y, z\}$, they must still choose $x$ from the smaller menu $\{x, y\}$ if $z$ is removed.
  *   **Intuition:** "Removing a loser shouldn't make a winner lose." This is about the stability of choice as the feasible set shrinks.

  **Arrow's IIA (Social Welfare Function):**
  *   **Context:** A society with a **fixed** menu of alternatives (usually assumed to be universal).
  *   **Variable:** The **preference profile** (the voters' rankings).
  *   **The Condition:** If two different preference profiles agree on how every voter ranks $x$ versus $y$, then the social ranking of $x$ versus $y$ must be identical in both profiles, *regardless* of how voters rank a third option $z$.
  *   **Intuition:** "The social decision between $x$ and $y$ should depend *only* on how people feel about $x$ and $y$." This is an **informational constraint** on the aggregation rule.

  **Why you are right:**
  Arrow's IIA is not about removing $z$ from the ballot. It is about keeping $z$ on the ballot but ignoring any information voters provide about $z$. Your friend's condition (menu consistency) asks: "What happens if $z$ disappears?" Arrow's condition asks: "What happens if voters change their minds about $z$ but *not* about $x$ and $y$?"

  Arrow's condition is significantly stronger. It forbids the Social Welfare Function (SWF) from using the *relative intensity* or *ordinal depth* of preferences. It forces the SWF to treat every pair of alternatives in isolation.

  ### 2. Comparison with Individual Choice Conditions

  To see precisely where Arrow's IIA diverges from standard rationality conditions, let's look at Sen's properties.

  *   **Sen's Property $\alpha$ (Contraction Consistency):** If $x$ is chosen from set $S$, and $T$ is a subset of $S$ containing $x$, then $x$ must be chosen from $T$.
      *   *Logic:* Fixed Preferences, Changing Sets.
  *   **Arrow's IIA:** If Profile $P$ and Profile $P'$ are identical regarding preferences over $\{x, y\}$, then the Social Ordering of $\{x, y\}$ must be identical under $P$ and $P'$.
      *   *Logic:* Fixed Set, Changing Preferences (specifically, changing preferences over irrelevant alternatives).

  **The Crucial Difference:**
  In individual choice theory, we assume the agent has a underlying utility function or preference ordering that generates the choice. Consistency conditions check if the observed choices match *that one fixed ordering*.

  In Arrow's framework, there is no "social preference ordering" existing prior to the vote. The SWF *creates* the social ordering. IIA constrains *how* it creates it. It demands that the social ranking of $x$ vs. $y$ be a function *solely* of the individual rankings of $x$ vs. $y$. It forbids the SWF from looking at where $x$ and $y$ sit relative to $z$ to break ties or determine margins.

  ### 3. Why Borda Count Violates Arrow's IIA

  The Borda Count is the perfect example to illustrate why your position is the substantive one. Most people find Borda "reasonable" precisely because it *violates* IIA in the way your friend thinks it shouldn't. Borda uses the "irrelevant" information that Arrow forbids.

  **How Borda Works:**
  In a 3-candidate election ($x, y, z$), a voter gives 2 points to their 1st choice, 1 point to their 2nd, and 0 to their 3rd. The candidate with the most points wins.

  **The Violation:**
  Arrow's IIA requires that if no voter changes their mind about $x$ vs. $y$, the social winner between $x$ and $y$ cannot change. Borda fails this because a voter changing their mind about $z$ can alter the point totals of $x$ and $y$.

  **Concrete Example:**
  Consider 2 voters and 3 candidates ($x, y, z$).

  **Profile 1:**
  *   Voter 1: $x \succ y \succ z$  (Points: $x=2, y=1, z=0$)
  *   Voter 2: $y \succ x \succ z$  (Points: $y=2, x=1, z=0$)
  *   **Total Borda Score:** $x = 3$, $y = 3$. (**Tie**)
  *   *Note:* Voter 1 prefers $x$ to $y$. Voter 2 prefers $y$ to $x$.

  **Profile 2:**
  *   Voter 1: $x \succ y \succ z$ (Unchanged)
  *   Voter 2: $y \succ z \succ x$ (**Changed**)
  *   *Crucial Check:* Did Voter 2 change their preference between $x$ and $y$? **No.** In both profiles, Voter 2 ranks $y$ above $x$.
  *   *What changed?* Voter 2 moved $z$ from last place to middle place. $z$ is the "irrelevant alternative" regarding the $x$ vs. $y$ contest.
  *   **Total Borda Score:**
      *   $x$: 2 (from V1) + 0 (from V2) = **2**
      *   $y$: 1 (from V1) + 2 (from V2) = **3**
  *   **Result:** $y$ wins.

  **Analysis:**
  Between Profile 1 and Profile 2, **no voter changed their preference between $x$ and $y$.** Yet, the social outcome flipped from a Tie to a Win for $y$.
  *   **Why?** Because Borda counts *how many* candidates are below $x$. In Profile 1, $x$ was above $z$ for Voter 2. In Profile 2, $x$ was below $z$ for Voter 2.
  *   **Arrow's Verdict:** The Borda Count used information about $z$ to determine the ranking of $x$ and $y$. This violates IIA.
  *   **Your Friend's Intuition:** Your friend might say, "But $z$ didn't win, so why does it matter?" Arrow's point is that the *presence and ranking* of $z$ altered the social relationship between $x$ and $y$.

  ### 4. Why This Makes the Impossibility Result Substantive

  If your friend were right, and IIA were just a trivial consistency requirement like Sen's $\alpha$, Arrow's Theorem would be a tautology about rationality. It would essentially say, "If you want a rational society, the society must act like a single rational dictator."

  However, because you are right—that IIA is a strong **informational constraint**—the theorem tells us something profound about aggregation:

  1.  **Informational Parsimony:** Arrow's IIA forbids the SWF from comparing the *intensity* of preferences or the *depth* of rankings. It forces the SWF to look at each pair $(x, y)$ through a tunnel, blind to the rest of the ballot.
  2.  **The Cost of IIA:** By forbidding the use of information about other alternatives (like Borda does), we lose the ability to aggregate preferences fairly without a dictator.
  3.  **The Escape Hatch:** If we relax IIA (allowing procedures like Borda Count or Utilitarianism), we can escape the Impossibility Theorem. We can have non-dictatorial, Pareto-efficient voting rules. But we must accept that the ranking of $x$ vs. $y$ can be manipulated by "irrelevant" alternatives (like $z$).

  ### Summary for Your Friend

  You can settle the argument with this distinction:

  *   **Her claim:** IIA means "If $z$ is removed from the ballot, the winner between $x$ and $y$ shouldn't change." (This is **Menu Independence**).
  *   **Your claim:** IIA means "If voters change their minds about $z$ but *not* about $x$ and $y$, the winner between $x$ and $y$ shouldn't change." (This is **Arrow's IIA**).

  Arrow's condition is much stronger. It implies her condition, but her condition does not imply Arrow's. The Borda Count satisfies her condition (mostly) but fails yours. The Impossibility Theorem holds specifically because Arrow's condition forbids the SWF from using the extra information that Borda utilizes. You are correct that this constraint is what makes the theorem a deep result about information and aggregation, rather than a simple truism about consistency.
