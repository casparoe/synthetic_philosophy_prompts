answer: |-
  **The Docks, Midnight**

  **Mara:** Look at them. Hauling the last of the ballast. If I walk over there and cut the mooring line, the ships drift. If I don't, they stay. Nothing about that is written yet.

  **Elias:** The proposition "The fleet sails at dawn" is true. Right now. In this moment.

  **Mara:** No, Elias. It's *possible*. It's *probable*, given the orders. But it's not *true*. To call it true is to say the future is a place we've already visited.

  **Elias:** To call it true is to say that reality has a shape, even if we haven't seen the whole of it. Logic demands bivalence. Either it will happen, or it won't. There is no third option. If you say there is, you're saying the Law of Excluded Middle breaks just because we haven't checked the box yet.

  **Mara:** Logic is a tool for mapping the world, not a cage for it. If the world is genuinely open—if my choice to cut that line actually matters—then the statement "The fleet sails" has no truth value. It's null. Undefined. Like trying to divide by zero.

  **Elias:** You're confusing truth with necessity. That's the trap Aristotle warned us about. Just because a statement is *true* doesn't mean it's *necessary*.

  **Mara:** Explain that. Because if it's true now, I can't make it false. If I can't make it false, how is it not necessary?

  **Elias:** Think about the past. "Caesar crossed the Rubicon." That is true. Is it necessary?

  **Mara:** It's fixed. We can't change it.

  **Elias:** It's fixed because it *happened*, not because the truth of the sentence forced his feet to move. The truth is a shadow cast by the event. It doesn't pull the strings. The event "The fleet sails" will cast a shadow back to us. The shadow is here now, in the logic, but the event is still waiting on your hands.

  **Mara:** But shadows don't exist without the object blocking the light. If the event doesn't exist yet, the shadow is a hallucination. And here's the problem with your "shadow" theory: If truth implies fixedness for the future, why doesn't it crush the past the same way? If "Caesar crossed" is true, was he forced to cross?

  **Elias:** The past is *accidentally* necessary. It's over. The future is contingent.

  **Mara:** Then it's not the *truth* that makes it necessary, is it? It's the *time*. So why cling to bivalence? Why insist the sentence has a value now, if the value doesn't do any work? You're saying, "It is true," but you admit it's not necessary. I'm saying, "It is undetermined," and I admit it's not necessary. We both agree I can cut the line. We only disagree on whether I'm allowed to use the word "true."

  **Elias:** It's not just words. If you deny bivalence, you break the logic of inference. If I say, "If the fleet sails, we win," and you say "The fleet sailing is neither true nor false," then "We win" is also neither true nor false. You paralyze reasoning.

  **Mara:** I liberate it. I allow for *becoming*. You want the universe to be a completed book where we're just reading the pages. I say we're writing them. If the sentence is already true, the ink is dry.

  **Elias:** The ink isn't dry. The *fact* is settled. Look, Mara, imagine a god outside of time looking down. He sees you cut the line, or he sees you don't. He doesn't guess. Does his seeing it make you do it?

  **Mara:** If his knowledge is infallible, then yes. Because if I do otherwise, he was wrong. And he can't be wrong. So I can't do otherwise.

  **Elias:** No. His knowledge is infallible *because* you will do it. He sees the choice you make freely. The truth of the proposition depends on the event, not the event on the proposition. You're worried that truth is a tyrant. It's not. It's a witness.

  **Mara:** A witness that shows up before the crime? That's what feels fake. Let's get practical. You say it's true we sail. I say it's open. Does this change how we bet?

  **Elias:** How so?

  **Mara:** If I believe it's open, I stay up all night checking the moorings. I know my action determines the truth value. If you believe it's *already* true... why aren't you asleep? If it's true, it's true. Your worry won't change the truth value.

  **Elias:** That's the fatalist mistake again. My worry is part of the causal chain that *makes* the proposition true. If I sleep and the ships drift, then the proposition "The fleet sails" was never true. It was false all along. I don't know which one it is yet, but I know my vigilance is required for the "True" branch to be the one that obtains.

  **Mara:** So you act exactly as I do. You check the ropes. You trust the captains. You fear the wind.

  **Elias:** Exactly.

  **Mara:** Then what are we fighting about?

  **Elias:** We're fighting about the structure of reality. Is the future a branching tree, where some branches are real and others are just ghosts until we touch them? Or is it a single line that we just haven't walked yet?

  **Mara:** I'm fighting about whether "truth" is a property of sentences or a property of the world. If I say "It is true," I feel like I'm surrendering. If I say "It is open," I feel like I'm holding the sword.

  **Elias:** And I feel that if I say "It is open," I'm pretending logic doesn't apply to tomorrow. I'm saying the Law of Excluded Middle takes the night off.

  **Mara:** Maybe it does. Maybe logic is for things that *are*, not things that *might be*.

  **Elias:** (Pauses, watching a lantern swing in the wind) If we both check the ropes... if we both fight the same way... does it matter?

  **Mara:** It matters to me. If I'm wrong, and it was true all along, then my choice was an illusion.

  **Elias:** If you're wrong, and it was neither true nor false, then reality has a hole in it where a fact should be.

  **Mara:** I'd rather have a hole than a cage.

  **Elias:** And I'd rather have a map, even if it's drawn in ink I can't read yet.

  *(A long silence. The sound of wood creaking against the pilings fills the gap.)*

  **Mara:** I'm going to check the starboard moorings.

  **Elias:** I'll check the port.

  **Mara:** You know, if I cut the line, your "true" proposition becomes false.

  **Elias:** Then it was never true, Mara. It was only ever believed.

  **Mara:** Or maybe it was never false, either. It was just... waiting.

  **Elias:** Go check the ropes.

  **Mara:** You too.

  *(They split, walking toward opposite ends of the dock. Neither looks back, but both walk with the same urgency.)*
