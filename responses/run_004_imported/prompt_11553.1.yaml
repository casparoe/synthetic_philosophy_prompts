answer: |-
  **Remarks for the Investiture of [Friend's Name]**

  Thank you. For those of you who don't know me, I'm [Your Name]. I've had the privilege of calling [Friend's Name] my friend since our first year of law school. We met in the library, roughly twenty years ago, bonding over the shared realization that we had no idea what we were doing.

  The judge who spoke before me eloquently described the law as a structure. And in a few moments, [Friend's Name]'s mother will speak to the heart of the woman beneath the robe. My task, as the friend who watched her become a lawyer, is to speak to the person who will stand between them: the Judge.

  There is a famous fragment from the philosopher Blaise Pascal that many of us read in jurisprudence class. Pascal wrote, "Justice without force is powerless; force without justice is tyrannical."

  He went further, and colder. He argued that because we cannot make what is just into what is strong, we must make what is strong into what is just. He suggested we obey laws not necessarily because they are always right, but because they are the law. We obey the judge not because she is infallible, but because she is the Judge.

  For a long time, I found that thought unsettling. It sounds like an admission that the law is just force with good manners. But watching [Friend's Name] over these last two decades, I've come to see Pascal's point differently. It isn't a cynicism; it is a burden.

  The gavel provides the force. The statute provides the authority. But the person holding the gavel? She must provide the justice.

  Because people will obey her orders simply because she has the power to issue them, she carries the terrifying responsibility of ensuring those orders are worthy of obedience. Pascal's warning is that authority is a vacuum, and nature abhors a vacuum. If the person in the chair does not fill it with integrity, with patience, and with a relentless pursuit of what is right, then it is indeed just force.

  But I know who is sitting in that chair.

  I have seen [Friend's Name] in the trenches of this profession. I have seen her treat a opposing counsel with grace when she had the leverage to crush them. I have seen her listen to a client who was difficult, not because it was easy, but because it was necessary. She understands that the robe does not make the authority legitimate; her conduct does.

  To the family and friends here: You know her kindness. Today, that kindness becomes a public trust.
  To the bench and bar: We know her intellect. Today, that intellect becomes a public duty.

  [Friend's Name], Pascal was right that force and justice are not the same thing. But he missed one variable. He didn't account for you. In your courtroom, force will not be tyrannical, because you will not let it be. And justice will not be powerless, because you will give it strength.

  We are honored to stand behind you as you take this seat. Congratulations, Your Honor.
