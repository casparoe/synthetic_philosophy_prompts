  Here is a grading breakdown designed to be rigorous enough to satisfy your professor's standards (and your own concern about being "too soft") while remaining fair to the quality of the writing.

  ### **Score: 18/20**

  ### **Peer Feedback Comments**

  **General:**
  This is a strong response that demonstrates a clear grasp of the core methodological conflict. Your writing is concise, and you correctly identify the stakes in both *Holy Trinity* and *Bostock*. However, in a jurisprudence seminar, precision regarding terminology is key. There are two specific theoretical distinctions where your answer glosses over nuance that a grader would look for.

  **Point-by-Point Breakdown:**

  *   **Definitions of Textualism/Purposivism (4/5 points):**
      *   **Strengths:** You correctly identify the rejection of legislative history and the focus on semantic meaning.
      *   **Critique:** You describe textualism as reading language "narrowly and literally." Be careful here: modern textualists (like Scalia and Gorsuch) explicitly distinguish *textualism* from *literalism*. They argue they read text contextually, not literally, and often accept canons of construction that avoid absurdity. Conflating textualism with literalism is a common critique *of* textualism, not necessarily a commitment *of* textualism.
  *   **Holy Trinity Application (7/7 points):**
      *   **Strengths:** Excellent summary. You correctly note the "letter vs. spirit" distinction and accurately portray why a textualist would reject the *Holy Trinity* outcome even if they liked the result. You successfully link the method to the specific statutory phrase ("labor or service of any kind").
  *   **Bostock Analysis (7/8 points):**
      *   **Strengths:** You correctly identify the political awkwardness (Textualist Method + Progressive Outcome). You also do well to note Gorsuch's reliance on but-for causation.
      *   **Critique:** To get full marks, you need to be more precise about *why* this isn't purposivism. The key theoretical distinction in *Bostock* is between **semantic meaning** and **expected applications**. Gorsuch's argument is that the *meaning* of "sex" hasn't changed, even if the *applications* unforeseen by 1964 Congress have. You hint at this ("facts the drafters didn't foresee"), but explicitly naming that distinction clarifies why Alito's "smuggled purposivism" critique fails on textualist terms.

  **Final Note:**
  This is high-quality work. The deductions are strictly for theoretical precision expected in a grad-level jurisprudence context, not for clarity or understanding.

