  9.  **Self-Correction/Check during drafting:**
      *   *Wait, is there any sense in which it works?* If the subscription process is a Poisson process with a hard cutoff unknown to us... no, even then, observing the count at time $t$ tells you about the rate $\lambda$, not necessarily the cutoff $T$, unless you have a prior on $T$.
      *   *Make sure not to be too harsh on the friend.* It's a clever heuristic, just misapplied.
