      *   *Doomsday Argument:* Mention this. It's the philosophical cousin. It assumes your birth rank is uniform among all humans ever. It fails if population growth is exponential or if the "sample" (you) is temporally located in a specific way.
      *   *Survivorship/Selection Bias:* Why did he look at the number *now*? If he waits until the newsletter dies, the number will be higher. Observing it mid-stream biases the estimate downward.

