      *   **Setting:** Open (near-future tech, noir inspector, etc.). Let's go with a near-future "Pre-Crime" style setting but focused on *correction* rather than arrest, to match the "Black intervenes if necessary" vibe.

  2.  **Deconstruct the Philosophy for the Narrative:**
      *   *Frankfurt Case:* Agent decides X. Controller would have forced X if Agent leaned Y. Agent decides X freely. Controller does nothing. Is Agent responsible?
      *   *Flicker Strategy:* The agent showed a sign of leaning Y before settling on X. That sign is the alternative possibility.
      *   *Dilemma Defense:* If the sign is determined, no freedom. If the sign is undetermined, the Controller can't be sure they can intervene, so the case fails to prove no alternative possibilities.
      *   *Narrative Goal:* Create a situation where a protagonist is being monitored/corrected. They make a "good" choice. Later, they question if they *could* have chosen otherwise. The evidence must be ambiguous. Was the "urge" to choose badly a genuine possibility, or just a ghost in the machine designed to make them *feel* like they had a choice?

  3.  **Brainstorming Settings & Characters:**
