      *   Title: Something related to the "flicker." *The Ghost in the Threshold.* *The Variance.* Let's go with *The Variance.*

  10. **Final Review against Prompt:**
      *   Lives inside the tension? Yes.
      *   Turns on flicker-vs-dilemma? Yes (the data log ambiguity).
      *   Uncertainty felt? Yes, the ending leaves it open.
