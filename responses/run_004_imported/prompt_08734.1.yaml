      *   **Format:** A short story.
      *   **Constraint:** Do *not* just retell the Jones/Black setup in different clothes. The plot must *turn on* the flicker-versus-dilemma problem. The reader/character must feel the uncertainty of whether an alternative choice was ever "live."
