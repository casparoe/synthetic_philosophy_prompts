      *   **Core Concept 1: The Public as an Abstraction (The "Phantom"):**
          *   Contrast with a physical crowd. A crowd is concrete; you can see it. The Public is a mathematical sum of private opinions.
          *   *Novel Application:* The character shouldn't just hate people; he should hate the *mechanism* that turns people into numbers.
