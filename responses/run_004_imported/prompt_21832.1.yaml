prompt: |-
  So for my early modern phil seminar we each have to do a mock "interview" with one of the philosophers on the syllabus as our final project, and i got stuck with Hobbes -- I want to focus on his geometry stuff since we barely covered it in lecture and it's obviously the part everyone skips. Can you draft me 8-10 interview questions for a hypothetical sit-down with Hobbes about his views on geometry that go beyond just having him restate "geometry is the best science"? I want at least one question on why he thought geometry alone was fully demonstrable becuase we construct the figures ourselves, and whether that reasoning actually survives when he tries to extend it to civil philosophy -- the commonwealth is "made" too, so why doesn't political knowledge converge the way geometric knowledge does? I also want one that really presses him on the Wallis dispute and his refusal to ever admit the circle-squaring was wrong, without letting him just retreat into "the Oxford men are conspiring against me." And one on that odd insistence that a point still has to have some tiny bit of magnitude -- is that a real metaphysical commitment or just a dodge to keep his geometry safe from refutation? For each of these, throw in a follow-up question keyed to whatever deflection he's most likely to give.
