      *   *The Complication:*
          *   **Therapy:** He might endorse the *method* but question the *telos* (end goal). If therapy makes a citizen functional but not virtuous, is it enough? Also, the intensity of psychedelics might be too "violent" for his taste compared to wine's gradual loosening.
          *   **Recreational:** He might not ban it outright but would demand *ritualization*. Legalization without *cultural oversight* is the problem. He might argue that if we legalize, we must reinstate the *Symposiarch* function (social norms, guides, integration).
