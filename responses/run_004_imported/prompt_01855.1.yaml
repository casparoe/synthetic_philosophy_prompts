      *   **The "Training":** Repeated exposure helps cultivate self-mastery (*enkrateia*). If you can drink and remain virtuous, you strengthen that virtue.
      *   **The "Remedy":** For the elderly, it softens the "stiffness" of the soul, making them more pliable to education and social bonding.
      *   **Regulation:** Strict oversight by the *Symposiarch* (sober overseer). Strict age limits (under 18: none; 18-30: moderate; 40+: more freedom).
