      *   **Opening Salvo:** Elena challenges the "easy win" claim of cosmopsychism. Marcus pushes back on the intelligibility of combination.
      *   **The Combination Attack:** Elena defends Phenomenal Bonding. It's a primitive relation. Marcus counters that "subjecthood" doesn't aggregate.
