  2.  **Character Conception:**
      *   *Micropsychist (let's call her Elena):* Pragmatic, grounded in physicalism's failures, willing to accept brute facts if they save the data of experience. Sees cosmopsychism as mystical or overly holistic.
      *   *Priority Cosmopsychist (let's call him Marcus):* Metaphysically bold, sees unity as fundamental, views separation as an illusion or a structural limitation. Thinks combination is logically impossible, whereas decombination is just a matter of perspective or masking.

  3.  **Key Arguments to Include:**
      *   *Elena (Micropsychist):*
          *   Phenomenal bonding is a brute relation, but no more mysterious than physical causation.
          *   Cosmopsychism makes individual agency hard to explain (am I just a mode of the Universe?).
          *   Decombination is just Combination in reverse; if combination is unintelligible, decombination is too.
      *   *Marcus (Cosmopsychist):*
          *   Combination is a category error (subjects aren't bricks).
