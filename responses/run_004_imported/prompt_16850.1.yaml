answer: |-
  You have put your finger on exactly the nerve that Laudan's argument was designed to touch. Your intuition is shared by many philosophers of science: if the history of science is a graveyard of "empirically successful but ontologically wrong" theories, then the realist's claim that success tracks truth looks suspiciously like a temporary illusion.

  However, to answer your concluding question directly: **No, the honest upshot is not that realism is untenable or that instrumentalism is the only consistent position.** Rather, the upshot is that *naive* or *convergent* realism (the idea that the specific entities posited by successful theories are likely real) is untenable.

  Since Laudan published "A Confutation of Convergent Realism" in 1981, the debate has not ended with a surrender to instrumentalism. Instead, realists have retreated to more fortified positions that attempt to draw the "principled line" you find missing. Here is how the contemporary landscape addresses your specific worry about the distinction between electrons and phlogiston.

  ### 1. The Structural Realist Response (The "Math Stays" Argument)
  The most famous counter-move to Laudan is **Epistemic Structural Realism (ESR)**, championed by John Worrall. Worrall grants Laudan's historical point: the *ontological* claims of past theories (caloric fluid, luminiferous ether) were indeed false. However, he argues that the *mathematical structure* of those theories was often preserved in their successors.

  *   **Example:** Fresnel's equations regarding the reflection and refraction of light were derived assuming an ether. Maxwell's electromagnetism discarded the ether. Yet, Fresnel's equations were retained intact within Maxwell's theory.
  *   **The Principled Line:** The structural realist argues we should be realist about the *structure* (the mathematical relations) but agnostic about the *nature* of the relata (the stuff filling the equations).
  *   **Application to your worry:** A 19th-century chemist had no structural continuity between phlogiston and modern oxidation chemistry. In contrast, the mathematical structure governing electrons in 1930 (Dirac equation) bears a specific, preserved relationship to the structure governing them today. The "line" is drawn at structural continuity, not just empirical fit.

  ### 2. Entity Realism (The "Manipulation" Argument)
  Ian Hacking and Nancy Cartwright offered a different route: **Entity Realism**. They argue that we should stop worrying about whether whole *theories* are true and focus on whether specific *entities* are real.

  *   **The Criterion:** "If you can spray them, they are real." If we can manipulate an entity to intervene in other causal processes, we have good reason to believe it exists, regardless of whether our theoretical description of it is perfectly accurate.
  *   **Application to your worry:** Nineteenth-century chemists could not isolate, trap, or manipulate phlogiston. They inferred it solely from theoretical necessity to explain combustion. By contrast, we can trap single electrons in Penning traps, manipulate their spin, and use them to build technologies (like SEMs) that rely on their specific causal powers.
  *   **The Principled Line:** The line is drawn at **experimental manipulability**. Phlogiston was a theoretical placeholder; electrons are experimental tools. This breaks the symmetry between past and present confidence.

  ### 3. Selective Realism (The "Working Posits" Argument)
  Stathis Psillos and Philip Kitcher have argued for a more sophisticated version of convergent realism. They concede that not every part of a successful theory is true (there are "idle wheels"). The mistake of past scientists wasn't trusting successful theories, but failing to distinguish which parts of the theory were actually *doing the work*.

  *   **The Argument:** In the ether theory, the *existence* of the medium was an idle wheel; the *wave equations* were the working posits. Realists today should use better methodological filters to identify which posits are essential to a theory's success.
  *   **Application to your worry:** We have better methodological tools now (e.g., robustness analysis, independent measurement) than 19th-century chemists. We can test the existence of electrons through multiple, independent causal pathways (cloud chambers, electrical currents, spectral lines). Phlogiston was never independently detectable outside the specific phenomena it was invented to explain.
  *   **The Principled Line:** The line is drawn at **detectability via multiple independent avenues**.

  ### 4. The Cost of Instrumentalism
  You suggest that instrumentalism might be the "intellectually consistent" position. It is consistent, but it comes with a heavy price tag that many find just as problematic as Laudan's PMI.

  If you adopt instrumentalism, you must accept that our best theories are merely "instruments" that save the phenomena, with no connection to reality. But this resurrects the **No-Miracles Argument** in a new form:
  *   Why do these instruments work so reliably across such vastly different domains?
  *   Why does the mathematical structure of quantum field theory allow us to build lasers, MRI machines, and nuclear reactors if it doesn't capture *something* about the causal structure of the world?

  For many, instrumentalism explains the *failure* of past theories well (thanks to Laudan), but it makes the *success* of current technology miraculous. Realism explains the success but risks embarrassment from history. The choice is often about which miracle you find less palatable.

  ### 5. Reference and Causal Contact
  Finally, there is a semantic argument regarding reference. Hilary Putnam and Richard Boyd argued that theoretical terms can refer even if the description associated with them is false, provided there is a causal chain linking the term to the world.

  *   **Phlogiston:** There was no causal interaction with phlogiston. The term failed to refer.
  *   **Electron:** There is a causal interaction (e.g., in a cloud chamber). The term refers, even if our description of the electron changes (e.g., from classical particle to quantum excitation).
  *   **The Principled Line:** The line is drawn at **causal contact**. We are in causal commerce with electrons; we never were with phlogiston.

  ### Conclusion
  Laudan's argument successfully killed the idea that we can be realists about *everything* in a successful theory, or that success guarantees truth in a simple linear fashion. It forced realism to grow up.

  The "honest upshot" is not that realism is dead, but that **realism must be selective.**
  *   We cannot trust that our current *conceptions* of entities are final (we might view electrons differently in 200 years).
  *   We *can* trust that there is *something* out there answering to our manipulations (Entity Realism).
  *   We *can* trust that the mathematical relations we've uncovered capture real structural features of the world (Structural Realism).

  So, there is a principled line between the 19th-century chemist and the modern physicist. It isn't the line of "certainty" (neither has that), but the line of **causal access and structural preservation**. The chemist was guessing at a hidden mechanism with no independent leverage; the physicist is manipulating a mechanism that leaks into multiple independent domains of observation. That difference is enough to save a chastened, sophisticated realism from the pessimistic meta-induction.
