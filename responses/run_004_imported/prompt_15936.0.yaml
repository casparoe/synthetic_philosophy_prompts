          *   Sarcasm stays *within* cooperation (you are relying on the partner to figure it out).
      *   **Address the "Socially Tolerated" Point:** It's not just tolerance; it's a collaborative cognitive effort. If the listener doesn't get it, sarcasm fails. Lying succeeds if the listener doesn't get it.

  6.  **Drafting the Response (Iterative Process):**
