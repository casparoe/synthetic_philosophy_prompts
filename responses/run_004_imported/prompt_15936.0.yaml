      *   **Introduce the Crucial Distinction:** The difference isn't *what* is said (the proposition), but *how* it is meant and *how* it is received.
      *   **Key Concept 1: Violation vs. Flouting.**
          *   Lying = Violation (covert). You want the listener to believe the falsehood.
          *   Sarcasm = Flouting (overt). You want the listener to realize it's false and infer the opposite.
      *   **Key Concept 2: Intent/Goal.**
          *   Lying = Deception.
          *   Sarcasm = Implicature (conveying a different truth).
      *   **Key Concept 3: The Cooperative Principle.**
