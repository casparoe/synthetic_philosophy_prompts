      *   **Maxim of Quality:** Try to make your contribution one that is true.
          *   Do not say what you believe to be false.
          *   Do not say that for which you lack adequate evidence.
      *   **Violations vs. Flouting:** This is the crucial distinction.
          *   *Violation:* Secretly breaking the maxim to deceive (Lying).
          *   *Flouting:* Openly breaking the maxim to generate an implicature (Sarcasm, Metaphor, Hyperbole).

  3.  **Evaluate the Friend's Claim:**
      *   *Claim:* "Both violate the maxim of quality." -> **Technically True** (on the surface level).
      *   *Claim:* "They are the same move." -> **False** (ignores the intent and the mechanism of communication).
      *   *Claim:* "Sarcasm is just a version of lying that everyone's silently agreed to tolerate." -> **Misleading** (It's not about tolerance; it's about shared inference).

  4.  **Evaluate the User's Claim:**
      *   *Claim:* "Sarcasm is basically just lying." -> **False** (Intent differs).

  5.  **Formulate the Argument:**
