answer: |-
  This is a fantastic provocation for a social epistemology seminar. It's clean, intuitive, and rests on a formal theorem, which makes it ripe for philosophical dissection. Your colleague's argument is a classic "aggregationist" move, but while Condorcet's Jury Theorem (CJT) is mathematically sound, its application to criminal jurisprudence is fraught with assumptions that rarely hold in the wild.

  To answer your core question: **No, Condorcet's theorem does not get her all the way to her conclusion.** There are significant gaps between the mathematical premises of CJT and the institutional reality of criminal trials. The burden of proof is not solely on the defenders of deliberation; it is equally on her to show that the preconditions of the theorem are met by a mass poll.

  Here is a walkthrough of the gaps you can explore with your seminar, structured by the assumptions of the theorem.

  ### 1. The Independence Assumption (The Biggest Mathematical Gap)
  CJT requires that voters make their judgments **independently**. This is the most fragile assumption in her argument.

  *   **The Problem of Common Evidence:** In a jury, independence is already compromised because everyone sees the same evidence. In a mass poll, this is exacerbated. If 500 randomly selected citizens are all exposed to the same media ecosystem, cultural biases, or pre-trial publicity, their errors will be **correlated**.
  *   **The Mathematical Consequence:** If votes are correlated (even slightly), the "wisdom of crowds" effect collapses. You don't get the exponential rise in accuracy; you get the accuracy of a single voter plus a small margin. A poll of 500 people who all watch the same news network and share the same implicit biases is not 500 independent trials; it is effectively one trial with 500 copies.
  *   **Seminar Angle:** Contrast *statistical independence* with *social isolation*. Deliberation violates independence, but does it violate it more than shared cultural heuristics do?

  ### 2. The Competence Assumption ($p > 0.5$)
  CJT only works if the average voter is more likely to be right than wrong ($p > 0.5$). If $p < 0.5$, the theorem proves the opposite: as $N$ increases, the probability of a correct verdict approaches **zero**.

  *   **Factual vs. Legal Guilt:** CJT applies to "truth." But criminal juries don't decide "Did the defendant do it?" (factual guilt); they decide "Does the state prove the elements of the crime beyond a reasonable doubt according to specific rules of evidence?" (legal guilt).
  *   **The Competence Deficit:** Is the average citizen competent ($p > 0.5$) at applying the *legal definition* of "reasonable doubt" or distinguishing "hearsay" from "non-hearsay"? If the average citizen is systematically biased toward conviction (which some empirical work suggests), then $p$ (for acquittal of the innocent) might be $< 0.5$. In that case, scaling up $N$ guarantees wrongful convictions.
  *   **Seminar Angle:** Ask students to define the "competence" required for a juror. Is it moral reasoning, logical deduction, or knowledge of statutes? If it's the latter, the random poll fails the competence threshold.

  ### 3. The Epistemic Value of Deliberation (Fixed vs. Malleable $p$)
  Your colleague argues deliberation is just "persuasion and social pressure." This assumes individual competence ($p$) is **fixed** prior to voting. Social epistemology suggests otherwise.

  *   **Information Pooling:** Jurors remember different parts of the testimony. Deliberation allows the group to reconstruct the evidence more accurately than any individual could. This raises the group's effective $p$.
  *   **Error Correction:** A single juror might misunderstand a judge's instruction. In a deliberating group, others can correct this. In an anonymous poll, that error is locked in.
  *   **The Trade-off:** The choice isn't "12 deliberators vs. 500 isolates." It's "12 deliberators with *enhanced* competence" vs. "500 isolates with *baseline* competence." If deliberation raises $p$ from 0.55 to 0.75, the small group might outperform the large group of low-competence voters.
  *   **Seminar Angle:** Have students model deliberation not as social pressure, but as Bayesian updating. Does hearing a peer's reason change my credence in a way that tracks truth, or just conformity?

  ### 4. Symmetry of Error (The Blackstone Ratio)
  CJT maximizes the probability of *a* correct verdict. It treats false convictions and false acquittals symmetrically. Criminal law does not.

  *   **Asymmetric Stakes:** The legal system prioritizes minimizing Type I errors (convicting the innocent) over Type II errors (acquitting the guilty). The standard is "Beyond a Reasonable Doubt," not "More Likely Than Not."
  *   **The Threshold Problem:** CJT drives the majority verdict toward certainty. But if the population is biased toward conviction, a majority vote mechanism will systematically violate the Blackstone Ratio ("Better that ten guilty persons escape than that one innocent suffer"). Deliberation, specifically the requirement for unanimity (or near-unanimity), acts as a veto point for minority doubts, protecting against systematic bias in a way a simple majority poll does not.
  *   **Seminar Angle:** Discuss whether "accuracy" is the only epistemic virtue of a legal system. Is "caution" an epistemic virtue?

  ### 5. Legitimacy and Accountability (Non-Epistemic Values)
  Even if the poll were *more* accurate, there are normative reasons for deliberation that aren't captured by CJT.

  *   **Accountability:** A juror must look the defendant in the eye and justify a deprivation of liberty. An anonymous pollster bears no responsibility. This affects the *quality* of the judgment (carefulness).
  *   **Legitimacy:** A verdict is accepted by the community partly because peers deliberated on it. A statistical aggregate feels like an algorithmic output, which may undermine the normative force of the punishment.
  *   **Seminar Angle:** Is the function of a jury to *find truth* or to *legitimize state violence*? (Or both?)

  ### Recommendation for the Seminar
  This is a perfect "steelman then shatter" module.

  1.  **Week 1 (The Steelman):** Teach CJT formally. Have students run simulations showing how $N=500$ beats $N=12$ *if* assumptions hold. Let your colleague's argument win on paper.
  2.  **Week 2 (The Shatter):** Introduce the violations.
      *   **Correlation:** Introduce the "Common Signal" critique (Austen-Smith & Banks).
      *   **Competence:** Discuss the complexity of legal standards.
      *   **Deliberation:** Read work on deliberative epistemology (e.g., Helen Landemore or classic jury studies like Hastie, Penrod, & Pennington) showing how deliberation changes memory and inference.
  3.  **Week 3 (The Normative):** Discuss the value of "Reasonable Doubt" as an asymmetric error cost function that CJT ignores.

  **Verdict:** Your colleague's argument is a powerful heuristic, but it treats the courtroom as a laboratory and the law as a binary truth-function. It ignores the **correlated error** of mass culture and the **competence-boosting** potential of deliberation. The burden of proof is definitely not solely on the defenders of deliberation; in fact, given the fragility of the independence assumption, the burden rests heavily on her to show why a mass poll wouldn't just amplify societal biases rather than filter them out.

  It's a brilliant prompt because it forces students to move from abstract formal epistemology to institutional design. Go for it.
