  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on 20th-century moral philosophy.
      *   **Topic:** Elizabeth Anscombe's "Mr. Truman's Degree" vs. the Doctrine of Double Effect (DDE), specifically focusing on the bombing of Hiroshima/Nagasaki.
      *   **Core Issue:** Anscombe argues Truman murdered civilians by intending their deaths as a *means* to surrender. Students push back with the "closeness problem" (redescription challenge): Can't we say Truman only intended a "demonstration of power" and merely *foresaw* deaths?
      *   **Task:** Argue *for* the position that Anscombe's verdict survives this maneuver. Provide a principled, non-ad-hoc distinction that blocks the redescription. Use resources like Quinn's direct/indirect agency or similar.
      *   **Tone/Style:** Real, first-person argument (not a balanced survey). Work out the strongest version of the challenge first. If convinced the rescue fails, admit it (but the prompt asks me to argue *for* the position that it survives, implying I should try to make that case unless it's logically impossible).
      *   **Constraint:** Do not hedge. Take a stand.

  2.  **Deconstruct the Challenge (The "Closeness Problem"):**
      *   *The Move:* Truman didn't intend "death of civilians." He intended "shock to the leadership." Death was just the mechanism of the shock.
      *   *Analogy:* Terror Bomber (intends deaths to demoralize) vs. Tactical Bomber (intends to destroy factory, foresees deaths). The redescription tries to turn Truman into a Tactical Bomber who just happened to bomb a city.
      *   *The Worry:* If "demonstration of power" counts as a legitimate intention that merely *involves* destruction, then almost any means-end killing can be redescribed as foreseen side-effect.

  3.  **Brainstorming Defenses of Anscombe:**
      *   *Anscombe's Own View:* She relies on a thick conception of intention. You intend what you choose as part of your plan. If the plan *requires* X to happen for Y to occur, you intend X.
      *   *Warren Quinn:* Distinguishes between *direct* harmful agency (harming as part of the plan's mechanism) and *indirect* harmful agency (harming as a causal byproduct).
      *   *The "Counterfactual Test":* If the civilians hadn't died (e.g., they were all ghosts), would the mission have failed? If yes, their death was intended.
      *   *The "Moral Psychology" Argument:* What was in Truman's mind? Did he order the bombs *because* they would kill people, or *despite* it?
      *   *The "Nature of the Act" Argument:* Bombing a residential city *is* killing people. You can't separate the "explosion" from the "death" in this context.

  4.  **Developing the Strongest Version of the Challenge:**
      *   I need to articulate the student's objection charitably.
      *   *Argument:* Truman's goal was political surrender. The mechanism was psychological shock. The physical cause of the shock was the *visibility of destruction*. The deaths were a contingent feature of that destruction. If a hologram of a destroyed city would have worked, he would have used that. Therefore, death wasn't the *aim*, just the available method. This aligns him with the Tactical Bomber (who destroys a factory to end the war, foreseeing worker death) rather than the Terror Bomber (who kills workers to demoralize the nation).

  5.  **Developing the Counter-Argument (The Rescue):**
      *   *Strategy:* I need to show why this redescription fails *principledly*, not just intuitively.
      *   *Key Concept:* **The Inseparability of the Effect from the Means.**
      *   *Quinn's Direct Agency:* Quinn argues that in direct harmful agency, the harm is part of the *causal route* to the good. In indirect, it's a *branch* off the causal route.
      *   *Application to Truman:* Did the destruction cause surrender *through* the deaths, or *alongside* them?
      *   *Refining the Intention:* It's not enough to say "he intended destruction." Destruction of *what*? Buildings? Or the life sustained by them?
      *   *The "Plan" Argument (Anscombe/Foot):* Intention is defined by the plan of action. If the plan is "Kill civilians to scare leaders," you intend killing. If the plan is "Destroy military target, civilians die," you foresee killing.
      *   *Crucial Distinction:* Was the *lethality* essential to the *shock*?
      *   *Historical/Conceptual Fact:* A "demonstration of power" in war *is* a demonstration of the capacity to kill. You cannot demonstrate the capacity to annihilate a city without annihilating the city (in 1945 context).
      *   *The "If-Then" Test:* If the Japanese leaders thought, "They destroyed the city, but everyone survived due to bunkers," would Truman have been satisfied? No. The point was to show *uninhabitability*. Uninhabitability = Death.
      *   *Quinn's Distinction applied:* The civilians' bodies were the medium through which the message was sent. This is *direct* agency. The Tactical Bomber's victims are collateral; the Terror Bomber's (and Truman's) victims are the message.

  6.  **Drafting the Argument (Iterative Process):**
      *   *Introduction:* Acknowledge the sophistication of the closeness problem. It's the standard objection to DDE.
      *   *Steel-manning the Objection:* Make the "Demonstration" argument strong. Truman wanted a psychological effect, not a body count per se.
      *   *The Turn:* Why this fails. Focus on the *structure of the plan*.
      *   *Resource:* Warren Quinn's "Actions, Intentions, and Consequences: The Doctrine of Double Effect." Specifically, the distinction between *direct* and *indirect* harmful agency.
      *   *Argument:* In indirect agency (Tactical Bomber), the harm is a *consequence* of the productive act. In direct agency (Terror Bomber/Truman), the harm is *constitutive* of the productive act.
      *   *Specific Point:* The "demonstration" *is* the killing. You can't separate "destroying the city" from "killing the inhabitants" in a way that makes the killing merely foreseen. The inhabitants are the *material* of the destruction.
      *   *Counterfactual:* If the cities were empty, would he have bombed them? If yes, then it's about buildings. If no, it's about people. Historical evidence suggests the target selection criteria prioritized "damage" which equated to civilian density.
      *   *Conclusion:* The redescription is linguistic sleight of hand. It ignores the causal role the deaths played.

  7.  **Refining the Tone:**
      *   Must be first-person ("I argue," "I believe").
      *   Must be decisive. No "on the one hand, on the other."
      *   Must address the "ad-hoc" worry. Show this isn't just saving Anscombe, but revealing a structural truth about intention.

  8.  **Self-Correction/Critique during drafting:**
      *   *Worry:* Is the "Demonstration" argument actually distinct from the "Terror Bomber"?
      *   *Correction:* The Terror Bomber kills to demoralize. Truman killed to shock into surrender. They are structurally identical regarding the victims. The victims are the *lever*.
      *   *Worry:* What if Truman thought, "I hope they evacuate"?
      *   *Correction:* That's wishful thinking, not intention. Intention is what you plan for. You don't plan on evacuation; you plan on explosion.
      *   *Key Philosophical Move:* Distinguish between *ulterior purpose* (Surrender) and *means* (Catastrophe). The redescription tries to move "Catastrophe" to "Foreseen." I need to show "Catastrophe" *is* "Death of Civilians."
      *   *Quinn's "Direct Harmful Agency":* This is the strongest tool. The harm is *exploited*.

  9.  **Final Polish:**
      *   Ensure the distinction between "foreseen consequence of a means" and "the means itself" is clear.
      *   Make sure to explicitly mention Quinn.
      *   Ensure the conclusion ties back to Anscombe's specific charge of murder.

  **(Self-Correction Note):** The prompt asks me to argue *for* the position that Anscombe survives. I must not conclude that the rescue fails. I must find the way through. Quinn is the best path.

  10. **Final Plan:**
      *   Start by validating the students' "closeness" objection (it's powerful).
      *   Articulate the "Demonstration Defense" clearly.
      *   Pivot to Warren Quinn's distinction between Direct and Indirect Agency.
      *   Argue that Truman's plan involved *direct* agency because the destruction of life was the *instrument* of the policy, not a side effect.
      *   Use the "Empty City" counterfactual to prove the point.
      *   Conclude that the redescription is a confusion of *levels* of intention, not a valid refinement.

  Let's write.
answer: |-
  I think your students are asking exactly the right question. The "closeness problem" is the most formidable objection to the Doctrine of Double Effect (DDE), and it is particularly sharp here because the Hiroshima and Nagasaki cases sit right on the fault line between "strategic destruction" and "mass killing." If we cannot defend Anscombe against the redescription challenge here, it is hard to see how DDE survives anywhere.

  However, I am going to argue that Anscombe's verdict does hold, and that the redescription your students propose relies on a confusion between an agent's *ulterior purpose* and the *means* chosen to achieve it. To show this, I will rely heavily on Warren Quinn's refinement of DDE, specifically his distinction between *direct* and *indirect* harmful agency. My claim is that the "demonstration of power" redescription fails because it attempts to classify the deaths as a byproduct of the demonstration, when in fact the deaths (or the destruction of human life) were the very substance of the demonstration.

  ### The Strongest Version of the Challenge

  Let's first give the students' objection its due. The argument runs like this:

  Truman's ultimate goal was unconditional surrender. To get that, he needed to alter the cost-benefit analysis of the Japanese High Command. He needed to demonstrate that the U.S. possessed the capacity to obliterate Japanese urban centers without further cost to American forces. The atomic bomb was the instrument of this demonstration. The destruction of the cities was the intended means. The deaths of the inhabitants, while certain and foreseen, were technically a *consequence* of the destruction of the cities, not the *aim* of the bombing.

  On this view, Truman is analogous to the "Tactical Bomber" who destroys a munitions factory to end the war, foreseeing but not intending the death of the workers inside. The Tactical Bomber intends the destruction of the factory; the workers' deaths are a side effect. Similarly, Truman intended the destruction of Hiroshima as a functional military/political target (a node of communication, industry, and morale); the deaths were the regrettable, foreseen side effect of that destruction. If a "clean" bomb existed that leveled the buildings but left the people unharmed, Truman would have used it. Therefore, the deaths were not intended as a means, but merely foreseen.

  This is a powerful redescription because it shifts the intentional object from "killing people" to "destroying infrastructure to produce shock." If this holds, Anscombe's charge of murder collapses into a charge of collateral damage, which DDE is designed to excuse.

  ### The Quinnian Rescue

  To defeat this, we must look closer at the structure of Truman's agency. Warren Quinn, in his seminal paper "Actions, Intentions, and Consequences: The Doctrine of Double Effect," argues that the traditional formulation of DDE focuses too narrowly on the mental state of "intending" versus "foreseeing." Instead, Quinn suggests we look at the *causal role* the harm plays in the agent's plan.

  Quinn distinguishes between **Direct Harmful Agency** and **Indirect Harmful Agency**.
  *   **Indirect Harmful Agency:** The agent brings about a good (or avoids a bad) by a causal route that does not involve the harmful effect as a *step* in the production of the good. The harm is a branch off the main causal tree. (The Tactical Bomber: Bomb -> Factory Destroyed -> War Ended. Worker Death is a branch off "Bomb".)
  *   **Direct Harmful Agency:** The agent brings about the good *by way of* the harm. The harm is part of the causal mechanism that produces the good. (The Terror Bomber: Bomb -> Civilians Die -> Public Demoralized -> War Ended.)

  The students' redescription tries to place Truman in the *Indirect* category. They argue: Bomb -> City Destroyed -> Shock -> Surrender. Deaths are a branch off "City Destroyed."

  I argue this is false. Truman belongs in the *Direct* category. Here is why.

  ### The Inseparability of Destruction and Death

  The redescription hinges on the idea that "destroying the city" is conceptually distinct from "killing the inhabitants." It treats the city as a collection of buildings and the inhabitants as contingent occupants. But in the context of 1945 aerial warfare, and specifically with the atomic bomb, this distinction is metaphysically thin to the point of non-existence.

  When Truman authorized the bombing, what was the mechanism of the "shock"? Was it the loss of real estate? No. The Japanese leadership did not care about buildings in the abstract. They cared about the continuation of the state and the survival of the people. The "shock" was generated by the *demonstration of uninhabitability*.

  To demonstrate that a city is uninhabitable *is* to demonstrate that its inhabitants cannot survive there. If the bomb had leveled every building in Hiroshima but, through some miracle, every citizen had survived in bunkers and resumed work the next day, would the "shock" have been achieved? Would Truman have considered the mission a success in terms of forcing surrender?

  The historical and logical answer is no. The strategic value of the bomb lay precisely in its *lethality per drop*. The "demonstration of power" was a demonstration of the power to *kill* on a mass scale without an air fleet. The deaths were not a side effect of the demonstration; the deaths were the *content* of the demonstration.

  This brings us back to Quinn's Direct Agency. For the shock to work, the Japanese leadership had to believe that *people were dying*. The causal chain is not:
  *   Bomb -> Buildings Fall -> Shock.

  It is:
  *   Bomb -> People Die (via Buildings Falling) -> Shock.

  The harm (death) is not a branch off the causal route to the good (surrender); it is the *engine* of that route. The Japanese government was meant to look at the carnage and reason: "If we do not surrender, more of our people will die." The deaths are the *means* of coercion.

  ### The Counterfactual Test

  We can make this even sharper with a counterfactual test regarding intention. A standard way to probe intention is to ask: *If the foreseen bad effect could have been avoided while achieving the same means, would the agent have avoided it?*

  The students argue: "If a non-lethal bomb existed, Truman would have used it." This is speculative psychology. We must look at the *plan as executed*.

  Consider the selection criteria for the targets. The Target Committee explicitly selected cities that were "mostly wooden houses" to maximize fire damage and civilian casualties. They rejected Kyoto (a cultural center) and chose Nagasaki and Hiroshima partly because they were intact enough to show the bomb's full power *against a population*.

  If Truman were truly an Indirect Agent (like the Tactical Bomber), he would view the civilians as obstacles to the destruction of the military target. But here, the "military target" *was* the civilian density. The "demonstration" required a high body count to be legible as a threat to the Emperor and the High Command.

  If the students insist that Truman only intended "destruction," they are engaging in a linguistic abstraction that divorces "city" from "citizen." But in moral philosophy, we must deal with the reality of the action. You cannot destroy a populated city without killing the people. If the killing is *necessary* for the plan to succeed (because a bloodless destruction would not produce the requisite shock), then the killing is intended as a means.

  ### Why This Isn't Ad-Hoc

  The worry your students have is that this looks like special pleading for Anscombe. Why isn't this just moving the goalposts?

  It isn't ad-hoc because it relies on a general principle of **causal involvement**, not just a moral intuition about Truman. Quinn's distinction applies everywhere.

  Consider the case of a craniotomy (crushing the fetal skull to save the mother) versus a hysterectomy (removing a cancerous uterus which results in fetal death).
  *   In the hysterectomy, the death is a side effect of removing the organ. (Indirect)
  *   In the craniotomy, the death is the *method* by which the birth canal is cleared. You *need* the skull to be crushed to get the baby out. (Direct)

  The Truman case is structurally identical to the craniotomy, not the hysterectomy. The "clearing of the political will" (surrender) was achieved *by* the "crushing of the civilian population." The redescription tries to say Truman was performing a hysterectomy on the Japanese war machine, but the civilians were merely in the uterus. Anscombe correctly identifies that Truman was performing a craniotomy on the civilians themselves to extract the surrender.

  ### Conclusion

  The "closeness" objection works best when the harm is genuinely incidental to the productive act (e.g., noise pollution from a factory). It fails when the harm is the *medium* through which the act produces its effect.

  Truman's defenders want to say he intended "destruction" and foresaw "death." But in the context of coercive diplomacy via aerial bombardment, "destruction" *means* "death." To intend the destruction of a populated city as a lever for surrender *just is* to intend the death of the population as a lever for surrender. Any attempt to separate the two is a semantic fiction that ignores the causal mechanics of the plan.

  Therefore, Anscombe is right. The civilians were not collateral damage; they were the ammunition. And using human beings as ammunition is the definition of direct harmful agency, which DDE does not excuse. The redescription fails because it attempts to hide the instrumentalization of the victims behind a veil of abstract "demonstration," but the demonstration had no content other than their slaughter.
