answer: |-
  Good evening. For those who don't know me, I'm the brother. Which, in this family, means I have spent the last four years serving as a captive audience for [Sister's] dissertation research.

  Our family dinners have involved a lot of passed peas and a specific kind of philosophical headache. Specifically, the "Wrong Kind of Reasons" problem. For the relatives: this is the trouble with defining "goodness" by what we *should* desire. Because sometimes you have a perfectly good reason to desire something that has nothing to do with it actually being good.

  The classic example is the Demon. Imagine a demon threatens to burn the world unless you admire a saucer of mud. You have a reason to admire the mud—saving the world is good. But the mud itself? It's still just mud. It doesn't deserve your admiration. That's the wrong kind of reason.

  Naturally, as the wedding approached, I started applying this framework to the institution of marriage. Because there are plenty of Wrong Kind of Reasons to get married.

  Maybe you want the tax bracket. Maybe you want to stop Grandma from asking when you're going to settle down. Maybe you're just afraid of dying alone, or perhaps a demon threatened to tickle you unless you signed the license. Those are pragmatic reasons. They are state-given reasons. But they aren't *fitting* reasons. They don't track the actual value of the person standing across from you.

  So, the question for today is: Are we dealing with the mud, or are we dealing with merit?

  [Groom], if you are here primarily for the tax benefits, please remain seated. We respect the hustle, but this is a philosophical inquiry.

  But in all seriousness, looking at the two of them, the distinction becomes clear. You don't need a PhD to see that the way they look at each other isn't based on external threats or pragmatic gains. It isn't based on what they get out of the state of being married. It's based on who they are to each other.

  To the philosophers in the room: I know the extensional adequacy problem isn't solved in general. I know we can't fully define the boundary between object-given and state-given reasons for every possible case in the universe.

  But we don't need to solve the general problem to recognize a clear case when we see one.

  You can see it in the way they talk, the way they listen, and the way they make each other better without any coercion from demons or tax codes. Whatever remains unsolved about the Wrong Kind of Reasons in the literature, everyone in this room can tell that this particular case is the Right Kind.

  So, if everyone could raise a glass.

  To [Sister] and [Groom]. May your reasons always be fitting, and may your love require no threats to sustain it.

  Cheers.
