answer: |-
  The countdown on the console blinked red: **09:58**.

  Elias stood with his hand hovering over the *Seal* command. Behind him, the airlock hissed, the pressure equalizing for the final shuttle of the season. Julian stood in the threshold, gloved hand resting on the frame.

  "Nine minutes, Eli," Julian said. His voice was muffled by the suit, but the warmth was there. "Shuttle locks in ten. If you seal the Vault now, you can't open it again. The cycle burns out the lattice. It's one and done."

  "I know."

  "And if you seal it," Julian continued, stepping back into the corridor, "you can't come with me. The Vault room goes into hard quarantine during the cycle. You'd be stuck here until the next transport in six months."

  Elias looked at the console, then at the heavy steel door of the Vault behind him. Inside, the prisms were aligned. The lasers were primed. When triggered, they would fire into the crystalline dust, creating a refractive symphony of light and geometry that defied known physics. It would be the most complex, mathematically perfect object ever conceived.

  It was also rigged to vaporize the dust immediately upon completion. No recording devices could survive the intensity. No human eye could withstand the luminosity without blindness. To exist, the phenomenon required total isolation. If a single retina registered the pattern, the interference would collapse the wave function. It had to be beautiful in the dark.

  "Moore would say it matters," Elias said, his finger trembling over the key. "That the universe is better for having held it, even for a second. Even if we aren't there to witness it."

  Julian sighed, the sound crackling over the comms. "Priya would say you're romanticizing a lightbulb burning out in an empty house. Beauty is a relationship, Eli. It needs a witness. If I'm not there, and you're not there... who is it for?"

  "For the truth of it," Elias said. "It exists. That has to count."

  **07:15**.

  Elias could walk away. He could leave the console, step into the corridor, and walk Julian to the shuttle. They would spend the last eight minutes sitting on the bench by the dock, shoulders touching, talking about nothing until the mag-locks engaged. Then Julian would be gone, and the Vault would remain silent, the prisms cold, the potential beauty never realized.

  Or he could seal the door. The beauty would happen. A miracle in the void. And he would be alone in the quarantine room, listening to the hum of the machine, while Julian drifted away into the black.

  "It doesn't have to be a choice," Julian said softly.

  Elias looked up. "The protocol says—"

  "Forget the protocol. I'm not asking you to open the door. I'm asking you to sit down."

  Julian stepped out of the airlock threshold. He wasn't leaving. Not yet. He walked over to the console, pulled a heavy chair from the corner, and sat facing Elias, his back to the Vault door.

  "Shuttle leaves in eight minutes," Elias warned. "If you miss it, you're stuck here for six months. You lose your posting."

  "I've already logged the delay," Julian said. "Command knows. I have eight minutes."

  "You can't see it, Julian. If you face the door, the sensors pick up the bio-feedback. It collapses the field. You have to look at me."

  "Then I'll look at you."

  Elias hesitated. The *Seal* command was still waiting. He pressed it.

  The heavy bolts of the Vault door slammed home with a final, deafening *thud*. The room vibrated. A low hum began to rise from behind the steel, the sound of the lasers charging. The beauty was waking up. It was happening right now, behind Elias's back. A kaleidoscope of impossible color was painting the walls of the chamber, a masterpiece of light that would vanish before the smoke cleared.

  Elias felt the pull to turn. To check the monitors. To verify the perfection.

  "Don't," Julian said.

  Elias kept his eyes on Julian.

  The hum grew louder, a singing vibration that rattled their teeth. The air in the room grew warm, radiating from the sealed door. The light was bleeding through the seams, not as beams, but as a glow, a pressure of pure luminescence that demanded to be seen.

  Elias watched Julian's face. He saw the reflection of the glow on Julian's visor, a faint, shifting iridescence. Julian wasn't looking at the door. He was looking at Elias.

  "It's happening," Elias whispered.

  "I know," Julian said.

  "It's... it's supposed to be the most beautiful thing ever made."

  "Then it's good that it exists," Julian said. "But it's better that we're here."

  The vibration peaked. The heat was intense. For a moment, the silence between them wasn't empty; it was heavy, pregnant with the knowledge of the spectacle dying behind them. Elias realized then that if he were alone, watching the monitors, the beauty would be a solitary conquest. If Julian were on the shuttle, the beauty would be a ghost.

  But here, in the heat of the unseen, with Julian's hand reaching across the console to cover his own, the value shifted. It wasn't just the art. It wasn't just the friendship. It was the shared sacrifice of the sight. They were guarding the beauty's privacy together. They were the keepers of the secret that the universe had blinked, briefly and brilliantly, and no one had consumed it.

  The hum dropped away. The glow faded from the seams. The Vault was dark again.

  **00:45**.

  Julian stood up. He squeezed Elias's hand, once, hard.

  "It was worth it," Julian said. "Not because it happened. But because we let it happen alone."

  He turned and ran for the airlock. Elias didn't turn to watch him go. He sat in the cooling room, the ghost of the light still pressing against his eyelids, listening to the hiss of the lock engage.

  He was alone. The art was gone. But the silence in the room felt different than it had before. It wasn't empty. It was full of the shape of what they had held together, unseen.
