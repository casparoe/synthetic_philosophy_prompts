  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Wait, does Hume advocate for inflation?* No. He warns against sudden changes. He prefers stability. The "favourable" comment is an explanation of observation, not a policy blueprint for perpetual debasement.
      *   *Crucial Distinction:* Hume distinguishes between the *absolute quantity* of money and the *change* in quantity. The "interval" relies on the *change*. The Balance of Trade relies on the *level*.
      *   *The "Dissolution":* The tension dissolves if we understand Hume's project as naturalistic. He is describing the *mechanics* of the system. The system naturally prevents perpetual accumulation. Therefore, the "favourable interval" is a transient gift of fortune (e.g., discovering mines, trade surplus), not a policy lever to be pulled forever.

