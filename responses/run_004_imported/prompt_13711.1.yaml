  8.  **Final Polish:** Structure with clear headings. Ensure the distinction between "Epistemic" (knowledge-based) and "Ontic" (reality-based) is clear. (Self-correction: Use "Causal" instead of "Ontic" for clarity).

  **(Self-Correction during drafting):** I need to make sure I don't just say "You're wrong." I need to say "You're asking the right question, but the answer is deeper than grammar." The distinction is about *what is held fixed* when evaluating the statement.

  *   Indicative: Hold the *outcome* (Death) fixed.
