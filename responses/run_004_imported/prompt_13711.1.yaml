      *   *Is the user's specific example accurate?* Yes, the Oswald/Kennedy example is the classic instantiation of Adams' problem.
      *   *Wait, one nuance:* In the user's novel, Oswald's rifle *jams*. So Oswald *did not* kill Kennedy. In the actual world, he did. So the user is writing the world where the Counterfactual antecedent becomes true.
