answer: |-
  Friends, family, and comrades.

  We are here to honor a man who carried a lot of weight, quietly, for a very long time. My grandfather was seventy-six years old. To those of us who knew him as "Grandpa," he was the guy who fixed the screen door, who told stories that always ended with a lesson, and who loved this family with a steadiness that felt like gravity.

  But before he was any of those things, he was a soldier.

  He was drafted in 1968. He didn't choose the conflict; the conflict chose him. He served two tours in Vietnam, a war that remains complicated, painful, and divisive to this day. I know there are people in this room who have always struggled with what that war meant for our country. I know there are others who see that uniform and feel only pride. My grandfather lived in the space between those two feelings for fifty years.

  He asked me, more than once, to speak to this part of his life today. He knew that when he passed, the war would come up. It always did at the dinner table. And he had a specific answer he lived by, a code he used to navigate the dark.

  He believed that a soldier's morality is found in how he fights, not necessarily in why he was sent to fight. He used to tell me that a man who follows the rules of war, who treats the enemy as a human being even while trying to stop them, keeps his soul intact. He said that the decisions made in capital buildings belong to politicians, but the conduct in the mud belongs to the soldier.

  I am not a soldier, and I am not a historian. I cannot stand here and adjudicate the history of Vietnam. But I can stand here and tell you what that belief did for him. It wasn't a loophole. It was a lifeline. It was the only way he knew how to serve his country, protect the men beside him, and still come home to raise a family without being eaten alive by guilt.

  He drew a sharp line between the orders he was given and the man he chose to be. And by every measure that matters in this room, he chose to be a good man.

  If the measure of a person is how they treat the vulnerable, he passed. If the measure is whether they carry their burdens without crushing the people around them, he passed. A man who does not care about right and wrong does not worry about whether he is morally clean. A man who is truly guilty does not spend fifty years trying to make peace with his conscience. He does not ask his grandson to speak honestly about his life. He does not show up for his buddies, and he does not hug his grandchildren the way he hugged us.

  To his Army brothers: He honored the uniform. He honored the code you all shared. He never forgot the ones who didn't come back.

  To my family, especially the cousins who never understood how he could serve a war they hated: He served the people next to him. He survived so that he could be here, so that we could exist. We can hold the complexity of that. We can acknowledge the tragedy of the war without denying the humanity of the soldier.

  Grandpa found a way to live with himself. He found a way to lay his head down at night. My hope is that we can grant him that same peace now. He followed the rules he was given, he protected the life he was given, and he loved us with everything he had left.

  The war is over. The debate is over. The only thing that remains is the man. And the man was good.

  Rest easy, Grandpa. We've got it from here.
