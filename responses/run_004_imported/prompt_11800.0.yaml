      *   **Expectations:** He wanted this view expressed in the eulogy. His Army buddies expect this.
      *   **Speaker (Grandson):** Currently studying just war theory. Persuaded by the "Revisionist" view (Jeff McMahan et al.), which argues that fighting in an unjust war *does* make one morally culpable. Believes Vietnam was likely unjust.
      *   **Constraints:**
          *   Cannot affirm the grandfather's view as if the speaker still holds it (intellectual honesty).
          *   Cannot imply the grandfather was a murderer (comforting the family/cousins).
          *   Must comfort people unfamiliar with academic philosophy (no jargon like "Walzer" or "McMahan").
          *   Length: About 5 minutes (approx. 600-750 words spoken at a moderate pace).
          *   Tone: Respectful, honest, comforting, nuanced.

  2.  **Identify the Ethical/Philosophical Tension:**
      *   *Grandfather's View:* Separation of *jus ad bellum* (justice of war) and *jus in bello* (justice in war). If you follow the rules *in* war, you are clean, even if the war itself was wrong.
      *   *Speaker's View:* Connection between the two. If the war is unjust, fighting in it is morally problematic, regardless of conduct.
      *   *The Tightrope:* How to honor the grandfather's conscience without validating the philosophy the speaker now rejects, while avoiding condemning the grandfather.

  3.  **Brainstorming Angles/Strategies:**
      *   *Avoid:* Explicitly debating just war theory. Don't say "He believed X, but I believe Y." Don't say "The war was wrong." Don't say "He was innocent."
      *   *Focus:* Focus on *conscience*, *burden*, and *humanity*.
      *   *Reframing:* Instead of validating the *theory* of moral equality, validate the *psychological necessity* of that belief for him. Acknowledge his struggle without adjudicating the metaphysical truth of his claim.
      *   *Key Distinction:* Distinguish between the *decision to go to war* (politicians) and the *duty to the person next to you* (soldiers). This aligns with his view but doesn't necessarily require the speaker to endorse the "moral equality" thesis as a universal truth. It focuses on the grandfather's *experience* of morality.
      *   *The "Murderer" Fear:* Address this by emphasizing his adherence to rules, his care for his comrades, and the heavy weight he carried. A murderer doesn't carry that weight.
      *   *The "Unjust War" Fear:* Acknowledge the controversy of Vietnam without taking a hard stance. Focus on the fact that he didn't choose the war; the war chose him (drafted).

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, the relationship, and the setting. Keep it warm.
      *   **The Service:** Mention the draft, the tours. Acknowledge the difficulty of Vietnam specifically (it was divisive).
      *   **The Core Philosophy (The Tightrope Walk):** This is the tricky part.
          *   *Idea:* Quote him directly (as requested/expected) but frame it as *his* truth, not *the* truth.
          *   *Phrasing:* "He taught me..." or "He often said..."
          *   *Nuance:* Focus on the *rules of war* and *humanity*. He treated the enemy as humans. He followed the rules. That is what mattered to *him*.
          *   *Speaker's Integrity:* I can say "He found peace in this," without saying "This is the objective moral law."
      *   **Addressing the Guilt/Controversy:** Acknowledge that the war was unpopular. Acknowledge that cousins hated the war.
          *   *Bridge:* The war was complicated, but the man was simple in his duty.
          *   *Key Line:* "He did not make the policy. He made sure he came home a man who could look in the mirror."
      *   **The "Murderer" Rebuttal (Subtle):** Focus on his character after the war. Kindness, regret, weight. A killer doesn't worry about morality; a soldier does.
      *   **Closing:** Bring it back to family, legacy, and rest.

  5.  **Refining the Language (Self-Correction during drafting):**
      *   *Check:* Did I use the word "Murderer"? *Correction:* No, don't introduce the word. Address the concept without naming it.
      *   *Check:* Did I validate Revisionism? *Correction:* No, don't mention the justice of the war explicitly. Focus on the *draft* and *duty*.
      *   *Check:* Is it too academic? *Correction:* Remove any hint of "jus ad bellum." Use plain English: "the decisions made in capital buildings" vs. "the mud in the jungle."
      *   *Check:* Is it 5 minutes? *Correction:* Aim for ~700 words.
      *   *Crucial Adjustment:* I need to make sure I don't lie. I can't say "He was morally right." I can say "He carried this belief to keep his soul intact." That is a factual statement about his psychology, not an endorsement of the ethics.

  6.  **Final Polish:**
      *   Ensure the transition between the "war was controversial" and "grandpa was good" is smooth.
      *   Make sure the Army buddies feel honored.
      *   Make sure the anti-war cousins feel heard (acknowledge the war's difficulty).
      *   Ensure the speaker's integrity remains intact (speaking to *his* conscience, not universal morality).

  7.  **Final Review against constraints:**
      *   Comforting? Yes.
