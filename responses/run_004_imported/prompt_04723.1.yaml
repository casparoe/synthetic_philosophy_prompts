      *   *Connection to KK:* If $K$ were luminous, then $Kp \to KKp$. If $K$ is not luminous, there are cases where $Kp$ but $\neg KKp$. The ALA shows that for *any* non-trivial condition (including knowing), you can't always know it obtains. Therefore, KK fails.

