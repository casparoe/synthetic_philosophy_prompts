      *   *Mechanism:* Gradual change + Indiscriminability + Margin for Error (MfE).
      *   *MfE:* If you know you're cold at $t_i$, you must be cold at $t_{i+1}$ (because $t_i$ and $t_{i+1}$ are indiscriminable, so your evidence/basis is the same).
