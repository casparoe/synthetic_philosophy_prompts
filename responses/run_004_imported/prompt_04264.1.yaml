      *   *Key Insight:* The problem isn't the bug; it's the *process of inquiry*.

  9.  **Final Polish:** Organize into clear headings. Ensure the distinction between "Bad Faith" and "Structural/Cognitive Trap" is clear. Emphasize the "Pre-mortem/Pre-registration" technique as the specific tool to stop post-hoc rationalization.

