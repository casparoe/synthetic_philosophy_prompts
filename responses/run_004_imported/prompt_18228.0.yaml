          *   *Scene B (The "Dog" Scene):* Small moment early in the book, MC with dying dog. Written quickly (20 mins), minimal revision, based on personal memory. Ignored by writers (presumably, or at least not highlighted as the *best* thing). Loved by lay readers (friend cried, stuck in head for a week).
      *   **The User's Internal Conflict:**
