answer: |-
  This is an exceptionally sharp reading of the text. You have identified the precise friction point in Sidgwick's epistemology: the tension between a **probabilistic argument for convergence** (Reading A) and a **sociological observation about unfalsifiability** (Reading B).

  The short answer is that Sidgwick is not equivocating, but he is making a subtle distinction between **logical demonstrability** and **rational warrant**. He is conceding that empirical science can never achieve Cartesian certainty (Reading B), while arguing that it can achieve sufficient probability to compel the assent of a reasonable person (Reading A).

  Here is a reconstruction of the argument, the rigorous probabilistic logic buried within it, and what Sidgwick is actually entitled to conclude.

  ### 1. The Two Readings Reconciled

  Your Reading A (Statistical/Cumulative) and Reading B (Unfalsifiability) are not contradictory in Sidgwick's framework; they address different audiences and different standards of proof.

  **Reading A is the Epistemic Strategy.**
  Sidgwick is invoking a principle of independent convergence. If you have $N$ witnesses, and the probability of any single witness being deceived or deceptive is $p$, then the probability that *all* $N$ witnesses are deceived/deceptive (assuming independence) is $p^N$. As $N$ increases, $p^N$ approaches zero. This is the "heap of facts." He is arguing that while no single case is proof, the *conjunction* of many cases can raise the posterior probability of the phenomenon above the threshold of rational belief.

  **Reading B is the Sociological Reality.**
  When Sidgwick writes, *"when he has nothing else left to allege he will allege that,"* he is not making a logical claim about the evidence; he is making a psychological claim about the **dogmatic skeptic**. He is acknowledging that for some critics, the hypothesis of "fraud" is not a working hypothesis to be tested, but a **protected belief**. No amount of evidence can falsify "fraud" if the skeptic is willing to postulate a conspiracy of unlimited scope (i.e., *all* investigators are either tricked or tricksters).

  Sidgwick's point is that you cannot argue with a person who holds "fraud" as an a priori truth. Therefore, the goal of the SPR is not to convince *that* skeptic, but to bury *that skepticism* under enough weight that the **common sense of mankind** (the reasonable Bayesian updater) finds it more costly to believe in the conspiracy than the phenomenon.

  ### 2. The Rigorous Probabilistic Argument

  You asked if there is a rigorous version of the cumulative argument here. There is, and it relies on **Bayesian updating with independent likelihood ratios.**

  Let $H$ be the hypothesis that psychical phenomena are real.
  Let $E$ be the evidence (a successful séance/experiment).
  Let $F$ be the hypothesis of fraud/error.

  Sidgwick acknowledges that for a single case $E_1$, the likelihood ratio is weak because $P(E_1|F)$ is non-negligible (magicians can mimic mediums).
  $$ \frac{P(H|E_1)}{P(F|E_1)} \approx \text{Low} $$

  However, Sidgwick argues for a sequence of experiments $E_1, E_2, ... E_n$ conducted by independent investigators under varied conditions. If the investigations are truly independent, the likelihood of fraud compounds multiplicatively, whereas the likelihood of the phenomenon (if real) should remain stable or increase with better controls.

  The "heap of facts" argument holds if:
  $$ \lim_{n \to \infty} \frac{P(E_1...E_n | H)}{P(E_1...E_n | F)} > \text{Threshold for Belief} $$

  Sidgwick is entitled to this argument **only if** the independence condition holds. This is where the SPR eventually struggled historically (contamination of witnesses, shared cultural expectations), but logically, Sidgwick's position is sound: **Extraordinary claims require extraordinary evidence, but "extraordinary evidence" can be constituted by a large volume of ordinary-quality evidence if the sources are sufficiently independent.**

  ### 3. The "Unfalsifiable" Clause as a Boundary Condition

  The last two sentences of your quote are often misread as a surrender. I read them as Sidgwick defining the **limit of empirical inquiry.**

  He is distinguishing between **demonstrative force** (logical proof) and **conviction** (psychological assent).
  *   **Demonstrative Force:** Limited by the trustworthiness of the investigator. Since human testimony is never infallible, absolute proof is impossible.
  *   **Conviction:** Achieved when the "fraud" hypothesis becomes more complex and unlikely than the "phenomenon" hypothesis.

  When he says the critic *"will allege that [the investigator is in the trick],"* he is identifying a **stopping rule** for argumentation. He is saying: "We have reached the point where the only remaining counter-argument is an ad hoc assumption of universal dishonesty. At this point, we stop trying to convince the critic and accept that we have satisfied the requirements of rational inquiry."

  This is actually a very modern epistemic stance. It parallels the idea that you cannot prove you aren't a Brain in a Vat, but it is irrational to live your life assuming you are. Sidgwick is treating the "Universal Fraud" hypothesis as a skeptical hypothesis of that order: logically possible, but rationally dismissible once the evidence heap is high enough.

  ### 4. Is the Reputation Deserved?

  To return to your argument with your friend: Is Sidgwick's reputation for intellectual honesty deserved, or is this mythology?

  Based on this text, the reputation is **deserved**, but perhaps not for the reasons the mythology suggests.

  *   **The Myth:** Sidgwick investigated psychical research because he secretly believed in it or was hopelessly naive about the supernatural.
  *   **The Reality (via this text):** Sidgwick investigated it because he was a **methodological rigorist**. He recognized that "scientific incredulity" had become its own dogma ("strong roots"). He saw that dismissing claims *a priori* because they were embarrassing was unscientific.

  He is not arguing that psychical phenomena *are* real in this passage. He is arguing that the **method of dismissing them** is flawed. He is defending the *process* of inquiry against the *prejudice* of the scientific establishment.

  The intellectual honesty lies in his admission that:
  1.  Single anecdotes are worthless ("not likely to suffice").
  2.  Absolute proof is impossible ("limited by the trustworthiness of the investigator").
  3.  Die-hard skeptics cannot be logically compelled ("he will allege that").

  He is essentially saying: *We cannot prove this to the satisfaction of a cynic, but we can accumulate enough data that a reasonable person would be irrational to dismiss it.*

  ### 5. Where Sidgwick Might Be Entitled to Less

  There is one vulnerability in his argument that you should be aware of for your debate. Sidgwick's cumulative argument relies heavily on the **independence** of the "heap."

  In psychical research, the "facts" are rarely independent in the way coin flips are. They are mediated by human perception, cultural tropes, and the specific social dynamics of the Victorian séance room. If $P(Fraud)$ is correlated across investigators (e.g., they all share a desire to believe, or they all use similar flawed detection methods), the "shrinking joint probability" math breaks down.

  Sidgwick seems aware of this ("trustworthiness of the investigator"), but he may be overly optimistic about the ability to isolate variables in a social/psychological context compared to a physical one.

  ### Conclusion

  Sidgwick is not equivocating. He is presenting a **fallibilist case for rational belief**.

  He is arguing that while the "Fraud" hypothesis is technically unfalsifiable (Reading B), it can become **probabilistically negligible** (Reading A). He is entitled to conclude that a mind is not "scrupulous" if it dismisses the heap of facts simply because the last logical loophole (universal conspiracy) remains open.

  The reputation holds up: Sidgwick is modeling a specific kind of intellectual virtue here. He is willing to endure the embarrassment of investigating "fringe" topics because he values **consistency of method** over **conformity of conclusion**. He admits he cannot win the logical war against the radical skeptic, but he believes he can win the epistemic war for the reasonable observer. That is a nuanced, honest, and rigorous position.
