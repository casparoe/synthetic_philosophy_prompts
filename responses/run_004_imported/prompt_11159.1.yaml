  (c) 6/10 - Definition right, objection wrong.
  Total: 19/30. That's a 63%. That feels harsh but accurate for a philosophy TA. Let's bump it to 70% (21/30) because the *intuition* is right, even if the citations are off. I'll grade it as a 72/100.

  Wait, looking closer at (a). "System that can always be argued into an exception is a system that can be argued into anything." This is a great summary of the "collapse into act utilitarianism" or "gaming" risk. I'll give high marks there.

