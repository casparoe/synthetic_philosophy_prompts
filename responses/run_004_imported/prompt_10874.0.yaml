answer: |-
  First, I am so sorry for the loss of your mother. Dealing with grief is hard enough without having to fight a legal battle where the other side tries to use semantic or philosophical technicalities to minimize what happened. It is completely understandable that the expert's comment—"an omission can't really be a cause of anything"—felt like a slap in the face. It is a real philosophical position, but in a courtroom, it often functions as a shield for liability.

  You have done your homework. You have correctly identified the two heavyweights in this debate: **David Lewis** (Counterfactual Theory) and **Phil Dowe** (Conserved Process Theory).

  Here is how each theory handles your mother's case, how they deal with the "every doctor" problem, and an assessment of which one holds up better in this context.

  ---

  ### 1. David Lewis: The Counterfactual Theory
  **The Core Idea:** Causation is about dependence. Event $C$ causes Event $E$ if, had $C$ not occurred, $E$ would not have occurred (or would have been significantly different).

  **Applied to Your Mom's Case:**
  Lewis is the lawyer's best friend here.
  *   **The Fact:** The doctor did not order the scan.
  *   **The Counterfactual:** If the doctor *had* ordered the scan (the opposite of the omission), the cancer would likely have been caught earlier, and your mother would likely still be alive (or lived significantly longer).
  *   **The Verdict:** Because the outcome (death) depends on the absence of the action (ordering the scan), the omission **is a cause**. For Lewis, there is no fundamental metaphysical difference between *doing* something harmful and *not doing* something helpful. Both are just events in the timeline that the outcome depends on.

  **The "Every Doctor" Problem:**
  You asked: *If not ordering the scan counts as a cause, doesn't every other doctor on the planet who also didn't order her a scan count as a cause too?*
  This is known as the **Problem of Profligate Omissions**.
  *   **The Issue:** Strictly speaking, under Lewis's early view, yes. The Queen of England didn't order the scan, and if she had, your mom might have lived. So, is the Queen a cause?
  *   **The Fix:** Lewis and his followers rely on **context and normalcy**. We filter causes based on what is "expected."
      *   The treating doctor had a specific relationship, access to the bloodwork, and a professional duty. In our "normal" model of how the world works, *that* doctor ordering a scan is the expected event.
      *   A random doctor in another country not ordering a scan is "background noise."
      *   Lewis argues that causation is somewhat pragmatic. We select the cause that makes the most difference in the specific context. The treating doctor's omission is a cause because it violated the expected norm of care; the random doctor's omission is not salient.

  ### 2. Phil Dowe: The Conserved Process Theory
  **The Core Idea:** Real causation requires a physical connection. Specifically, there must be a transfer or exchange of a **conserved quantity** (like energy, momentum, or charge) between two objects. If no physical process links $A$ to $B$, there is no causation.

  **Applied to Your Mom's Case:**
  Dowe is the hospital expert's philosophical backbone.
  *   **The Fact:** The doctor sat at a desk and did not write an order. No neurons fired to send a signal to the radiology department; no paper was moved; no energy was transferred to the cancer.
  *   **The Physics:** The cancer grew due to biological processes (cell division, energy transfer). The doctor's inaction involved no physical interaction with the cancer or your mother's body.
  *   **The Verdict:** Strictly speaking, the omission is **not a cause**. It is what Dowe calls a **"quasi-cause."** It explains *why* the prevention failed, but it isn't a physical cause of the death. The cause of death was the cancer (a physical process); the doctor's inaction was merely a failure to interrupt that process.

  **The "Every Doctor" Problem:**
  *   **The Issue:** Since Dowe says omissions aren't physical causes, he actually avoids the "every doctor" problem easily.
  *   **The Fix:** Since *no* doctor (neither the treating one nor the random ones) physically interacted with the cancer, *none* of them are physical causes of the death.
  *   **The Distinction:** Dowe distinguishes them based on **duty**, not causation. The treating doctor had a legal and moral obligation to initiate a physical process (the scan) that would have interrupted the cancer. The random doctor did not. So, while neither is a "physical cause," only one is *responsible* for failing to prevent the cause.

  ---

  ### Which View Holds Up Better Under Pressure?

  This depends entirely on whether you are asking a **Metaphysician** or a **Judge**.

  **1. In Metaphysics/Physics (Dowe Wins)**
  If you are asking what is *physically* happening in the universe, Dowe is harder to refute. It is true that "nothing" (an absence) cannot transfer energy. If we are talking about the fundamental fabric of reality, omissions are not "events" in the same way a punch or a bullet is. The hospital expert is technically correct in a narrow physicalist sense.

  **2. In Law and Morality (Lewis Wins)**
  If you are asking about responsibility, liability, and human affairs, Lewis is vastly superior. The law operates on **"But-For" Causation**, which is essentially Lewis's counterfactual theory.
  *   *Legal Standard:* "But for the doctor's negligence, would the harm have occurred?"
  *   If the law adopted Dowe's view, almost all medical malpractice would be impossible to prove. Most malpractice is an omission (failed to diagnose, failed to warn, failed to treat). If omissions aren't causes, doctors can't be liable for inaction.
  *   Lewis's view aligns with how humans understand agency. We hold people responsible for what they *could have done* but didn't.

  **The Weakness of the Hospital's Argument:**
  The hospital expert is trying to import a strict physicalist definition of causation into a legal context where it doesn't belong. In tort law, causation is not just about physics; it is about **foreseeability and duty**.
  *   Lewis handles this by saying the doctor's omission is a cause *relative to the context of duty*.
  *   Dowe handles this by admitting it's not a "cause" but still a breach of duty.
  *   **However:** In a wrongful death case, you *must* prove causation. If the hospital convinces the jury that "an omission cannot be a cause," they win. That is why your lawyer is fighting this so hard. They need the jury to accept the Lewis/Counterfactual view, which is the standard legal view.

  ### Addressing Your "Every Doctor" Worry
  You asked if literally every other doctor counts as a cause.
  *   **Lewis's Answer:** No, because causation is contrastive. We ask, "Why did she die *now* rather than *later*?" The treating doctor's omission explains that contrast. The random doctor's omission does not, because they were never in a position to change the outcome. It's about **opportunity and capacity**.
  *   **Dowe's Answer:** No, because none of them are causes. But only the treating doctor is *liable*.

  ### Summary for Your Situation
  The hospital expert is using a philosophical technicality (Dowe's physicalism) to try to break the link between negligence and death.
  *   **Lewis (Counterfactual):** Supports your family. The doctor's inaction changed the outcome. It is a cause.
  *   **Dowe (Process):** Supports the hospital. Inaction is not a physical force. It is not a "real" cause.

  **Which is right?**
  In the context of a courtroom and human justice, **Lewis is right.** The law recognizes that human actions (and inactions) are causes because we are agents who intervene in the world. If we accepted Dowe's view fully, we could never hold anyone accountable for negligence, only for direct physical assault.

  The "every doctor" objection is a classic philosophical puzzle, but in practice, courts solve it by looking at **proximate cause**. The treating doctor was the *proximate* cause because they were the one with the power and duty to act.

  I hope this helps clarify the rabbit hole you've fallen down. It is infuriating that your grief is being met with semantic games, but understanding that the "omission isn't a cause" argument is a contested philosophical stance—not an objective scientific fact—might help you and your family push back against it. Your lawyer is fighting for the Lewis view because that is the view that allows justice to function.
