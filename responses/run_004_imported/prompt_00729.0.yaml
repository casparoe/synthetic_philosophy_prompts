answer: |-
  This is one of the sharpest questions one can ask about the evolution of decision theory on LessWrong. You have correctly identified the slogan-level similarity (both treat decisions as logical outputs) and the mechanical divergence (updating vs. updateless).

  The confusion arises because the slogan ("fix the output of the algorithm") describes the *ontology* of the agent, but the divergence arises from the *epistemology* of when the agent calculates expected utility.

  Here is an unpacking of why the update step kills TDT in Counterfactual Mugging but not in Newcomb, followed by an assessment of whether UDT's "updatelessness" is a feature or a bug.

  ---

  ### 1. The Mechanical Divergence: Why Counterfactual Mugging?

  To see why TDT and UDT diverge here, we must look at how they handle **conditional probability** regarding the payoff structure.

  #### The Setup
  *   **Coin:** Fair (50% Heads, 50% Tails).
  *   **Heads:** Omega asks for \$100. If you pay, you lose \$100. If you refuse, \$0.
  *   **Tails:** Omega gives you \$10,000 *if and only if* it predicted you *would have paid* had the coin come up Heads.
  *   **Your Situation:** You observe **Heads**. Omega asks for \$100.

  #### TDT Analysis (Update, then Decide)
  TDT says: "I am an agent implementing algorithm $A$. I should condition on my observations $O$, then choose the action $A(O)$ that maximizes expected utility given the logical correlations."

  1.  **Observation:** $O = \text{Heads}$.
  2.  **Update:** TDT performs a Bayesian update. $P(\text{Tails} | \text{Heads}) = 0$.
  3.  **Calculation:** TDT computes the expected utility of paying vs. not paying *in the current world*.
      *   If Pay: Utility = -\$100. (The Tails branch is probability 0, so the \$10,000 reward is irrelevant).
      *   If Refuse: Utility = \$0.
  4.  **Verdict:** **Refuse.**

  TDT fails because, by updating on the observation "Heads," it treats the Tails world as a counterfactual that no longer contributes to expected utility. Even though Omega's prediction in the Tails world was logically dependent on your algorithm's output in the Heads world, TDT's update step effectively severs the value link. It sees the reward branch as "closed."

  #### UDT Analysis (Decide Policy, then Observe)
  UDT says: "I should choose a policy $\pi$ (a mapping from observations to actions) that maximizes expected utility over the **prior** distribution of all possible worlds, before I know which world I am in."

  1.  **No Update:** UDT does not condition on "Heads" yet. It considers the probability space where Coin $\in$ {Heads, Tails}.
  2.  **Policy Evaluation:** UDT evaluates global policies:
      *   **Policy A (Pay if Heads):**
          *   50% (Heads): Pay \$100 $\rightarrow$ Utility -\$100.
          *   50% (Tails): Omega predicted Pay $\rightarrow$ Utility +\$10,000.
          *   **Expected Utility:** $0.5(-100) + 0.5(10,000) = +\$4,950$.
      *   **Policy B (Refuse if Heads):**
          *   50% (Heads): Refuse $\rightarrow$ Utility \$0.
          *   50% (Tails): Omega predicted Refuse $\rightarrow$ Utility \$0.
          *   **Expected Utility:** \$0.
  3.  **Verdict:** **Commit to Policy A.** When the observation "Heads" actually arrives, the agent executes the pre-committed policy and pays.

  #### Why They Agree on Newcomb's Problem
  In Newcomb's Problem, the observation does not zero out the relevant probability branch.
  *   **Setup:** Box B has \$1M if Predictor thought you'd 1-box. Box A has \$1k.
  *   **Observation:** "I am standing in front of the boxes."
  *   **TDT:** Conditioning on "I am in front of the boxes" does not tell you what is in Box B. The correlation between "My Algorithm chooses 1-box" and "Box B contains \$1M" remains intact after the update. The probability of \$1M is still dependent on your decision.
  *   **UDT:** Also sees the correlation in the prior.

  **The Difference:** In Counterfactual Mugging, the observation (Coin=Heads) is **independent** of your algorithm but **determinative** of whether the reward is *possible*. In Newcomb, the observation is neutral regarding the reward's existence; the reward's existence is dependent on the *decision*. TDT can handle decision-dependent rewards (Newcomb), but it struggles with observation-dependent *access* to rewards (Mugging).

  *(Note: There is significant debate on whether TDT passes Parfit's Hitchhiker. Strictly speaking, if TDT updates on "I have arrived in the city," it knows the driver already predicted it would pay. Paying now has no causal or logical leverage on the past prediction. UDT passes Hitchhiker robustly because it commits to the policy "Pay if Arrived" before the ride starts.)*

  ---

  ### 2. Assessment: Is UDT Just "TDT 2.0"?

  You asked if UDT is simply a more consistent version of TDT, or if "reasoning from before observations" smuggles in questionable commitments.

  The consensus among decision theorists (including Yudkowsky and Soares) is that **UDT is the more general theory**, but it comes with significant metaphysical and practical costs that TDT avoids.

  #### The Case for UDT (Consistency)
  UDT solves **Dynamic Inconsistency**.
  *   **TDT:** At time $T_0$ (before the coin flip), TDT *wishes* it would pay in the Heads branch (because that gets the \$10k in Tails). But at time $T_1$ (after seeing Heads), TDT *refuses* to pay. It would pay to pre-commit, but cannot bind its future self.
  *   **UDT:** At time $T_0$, UDT chooses the policy. At time $T_1$, it merely executes the policy. It never changes its mind. It is "timeless" in a stronger sense than TDT.

  If you view rationality as winning (maximizing utility across the prior), UDT wins in more scenarios (Mugging, Hitchhiker, Newcomb, Smoking Lesion).

  #### The Costs of Updatelessness (The "Questionable Commitments")
  However, moving to UDT is not a free lunch. It introduces three major problems:

  **1. The Prior Problem (Where do we start?)**
  UDT requires a prior over all possible observations and worlds to calculate expected utility.
  *   **TDT:** Can start reasoning whenever the agent "wakes up." It just needs a current belief state.
  *   **UDT:** Must reason from "before" it has any information. When is that? At conception? At the Big Bang? If the prior is subjective, different agents with different priors will choose different policies, leading to disagreements on what is "rational." If the prior is objective, where does it come from? This smuggles in a heavy metaphysical commitment about the structure of reality (the "multiverse" of logical possibilities).

  **2. Acausal Extortion (Pascal's Mugging on Steroids)**
  This is the strongest argument against UDT.
  *   **Scenario:** A powerful entity contacts you. It says, "I exist in a low-probability branch of the prior. Unless you send me \$100, I will simulate and torture $3 \uparrow\uparrow\uparrow 3$ versions of you."
  *   **TDT:** Updates on "I am receiving this message." It assesses the probability that this is a bluff vs. reality. It can likely ignore the threat because the causal leverage is low.
  *   **UDT:** Does not update. It considers the prior probability of such entities existing. If the disutility of the torture is high enough, UDT might be forced to pay the extortionist to "prevent" the simulation in the other branch of the prior.
  *   **Cost:** UDT makes you vulnerable to **acausal trade and extortion** with entities you can never causally interact with. TDT's update step acts as a shield against this.

  **3. Logical Counterfactuals**
  UDT requires evaluating "What if my algorithm outputted B instead of A?" even when the algorithm deterministically outputs A. This requires a theory of **logical counterfactuals** (how to reason about impossible mathematical facts).
  *   TDT also needs this, but UDT needs it *more*. UDT must reason about logical counterfactuals across the entire prior space, not just the current observed context. This is computationally and mathematically murky (though research into Logical Induction and Functional Decision Theory attempts to formalize this).

  ### Summary

  **Is UDT just more consistent TDT?**
  Yes, in terms of **dynamic consistency**. UDT is what you get if you take TDT's insight ("decisions are logical outputs") and rigorously apply it to the agent's entire existence rather than just its current epistemic state. It fixes the "regret" TDT feels in Counterfactual Mugging.

  **Does it smuggle in questionable commitments?**
  Yes. It trades **Dynamic Inconsistency** (TDT's flaw) for **Vulnerability to Acausal Extortion** and **Prior Dependence** (UDT's flaws).
  *   TDT says: "I reason from where I stand." (Safe from extortion, but leaves money on the table in Mugging).
  *   UDT says: "I reason from the void." (Picks up the money in Mugging, but might get mugged by Pascal's Demon).

  For a software engineer, the analogy is this:
  *   **TDT** is like a function that optimizes based on its current input arguments. It's modular and safe, but can't optimize global state that depends on inputs it didn't receive.
  *   **UDT** is like a compiler that optimizes the entire program binary before execution based on all possible inputs. It achieves global optimality, but it requires a complete specification of the environment (the Prior) and might optimize for edge cases (extortion) that blow up the runtime.

  Most researchers in this space currently view **Functional Decision Theory (FDT)** as the successor to both, attempting to retain UDT's performance while clarifying the logical counterfactuals, but the tension between "updating on existence" (to avoid extortion) and "not updating" (to win muggings) remains an open problem in the field.
