          *   What they miss: The debate isn't just about "magic" vs. "causality." It's about the *substrate* of decision-making.
          *   They also miss the *social norm* aspect. Course evals aren't a pure Prisoner's Dilemma; there are reputational and normative pressures.
          *   They miss the *threshold* problem. Often, one vote *does* matter if it tips a quorum, though Elena admits hers won't shift the average.

  5.  **Refining the Tone:**
