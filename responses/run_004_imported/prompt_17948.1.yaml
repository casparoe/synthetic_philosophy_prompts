answer: |-
  **Setting:** *A slightly noisy pub just off campus, 10:00 PM. The grad seminar on "Justice and Rationality" ended an hour ago. Sarah (Rawlsian) and David (Harsanyian) are sharing a table littered with empty pint glasses and a napkin covered in scribbled decision matrices.*

  **David:** (Tapping the napkin) Look, I get the moral appeal of your position, Sarah. I do. But you're asking me to accept a decision rule that violates the basic axioms of rational choice. If I'm behind the Veil, and I have literally zero information about who I'm going to be, the Principle of Insufficient Reason isn't just a heuristic. It's the only logical move. If there are *n* people in society, my probability of being any specific one is 1/*n*. To ignore that is to leave expected utility on the table.

  **Sarah:** But that's the rub, David. You're treating the Original Position like a standard lottery. It's not. In a lottery, there's a mechanism—a drum, a random number generator—that grounds the probability assignment. In the Original Position, there is no mechanism. There's no "you" waiting to be assigned a slot. You are constructing the slots *and* the self simultaneously. To assign equal probabilities implies there's a fact of the matter about the distribution that you just don't know. Rawls's point is that there *is* no fact of the matter.

  **David:** That sounds like metaphysical hand-waving to avoid the math. From the perspective of the deliberator, the uncertainty is functionally identical to risk. If I don't know if I'll be the CEO or the janitor, and I treat those outcomes as equally likely, I'm being coherent. If I use Maximin, I'm saying there's a non-zero chance that being the janitor is *infinitely* bad, or that I am so risk-averse I'd reject a society where everyone is a millionaire except one person who makes slightly less, just to raise that one person's income by a dollar. That's not rationality; that's pathology.

  **Sarah:** It's not pathology if the stakes aren't dollars. You're smuggling in a utilitarian metric of "utility" where the goods are interchangeable. Rawls is talking about Primary Goods—rights, liberties, opportunities, self-respect. If the "worst-off" outcome involves a loss of basic liberty or falling below the social basis of self-respect, no amount of average gain compensates for it. The Maximin rule isn't a general rule for everyday choices. I wouldn't use it to choose a commute route. But the Original Position is a *constitutional* choice. It's one-shot. It's irreversible.

  **David:** Okay, let's grant the "one-shot" aspect. Even in one-shot high-stakes decisions, we don't abandon expected utility. If I have a 99% chance of saving humanity and a 1% chance of doom, versus a 100% chance of a stagnant but safe humanity, Expected Utility might still take the risk depending on the valuation. But your Maximin says *ignore* the 99%. That's what bugs me. You're saying that once the stakes are high enough, probabilities vanish from the calculation entirely. Why? Just because the stakes are high doesn't mean the odds don't exist.

  **Sarah:** Because in the OP, you aren't just calculating loss; you're calculating the *strains of commitment*. Think about the agreement itself. If we agree to Average Utilitarianism, we are agreeing that it is permissible for some people to be sacrificed—drastically—for the greater average. If I end up being that sacrificed person, can I really sustain my commitment to that principle? Rawls argues no. The agreement has to be stable. If the worst-off position is intolerable, the society collapses into resentment or coercion. Maximin ensures that whatever the structure, everyone can willingly uphold it.

  **David:** But that's an empirical claim about psychology, not a logical claim about rationality. Maybe people *would* accept the risk if the average welfare was high enough. History is full of people accepting terrible lotteries for a chance at glory. But more importantly, your "strains of commitment" argument cuts both ways. If I'm behind the Veil, and I pick Maximin, I might lock society into a stagnant equilibrium where we refuse to take risks that could lift *everyone* out of poverty because it might temporarily worsen the bottom decile. Isn't there a strain of commitment there? A commitment to stagnation?

  **Sarah:** That's why it's the *Difference* Principle, not strict equality. We can take risks. We can have inequality. But only if that inequality works to the greatest benefit of the least advantaged. It's not about eliminating risk; it's about structuring risk so that the downside is always shared. If the CEO makes ten million, fine, but only if the janitor makes more than he would in a system where the CEO makes five million. The "stagnation" objection assumes that inequality is the engine of growth. Rawls says: prove it. Show that the worst-off gain from your utilitarian gamble.

  **David:** But Harsanyi's proof *is* the math. If you accept the von Neumann-Morgenstern axioms of rationality—which you seem to accept for everything else in life—you *must* maximize expected utility. To do otherwise is to be vulnerable to a Dutch Book. You're making yourself susceptible to a set of bets that guarantee a loss. If you say, "I prefer A to B because of Maximin," but your underlying preferences over outcomes satisfy the axioms, you're being inconsistent. You're essentially saying, "Rationality applies everywhere except this one specific room where we design justice." That's ad hoc.

  **Sarah:** It's not ad hoc if the nature of the choice changes the definition of rationality. Rationality isn't just internal consistency of preferences; it's about the appropriateness of the rule to the context. In the OP, you are choosing for a moral person, not a gambler. The "Dutch Book" argument assumes you can play the game again to make up your losses. You can't play the "which society do I live in" game twice. You can't be reincarnated to collect your winnings. When the loss is catastrophic and non-recoverable—like losing your political voice or your economic subsistence—caution isn't irrational. It's the only rational response to radical uncertainty.

  **David:** "Radical uncertainty" is doing too much work there. If I walk across the street, there's radical uncertainty. A bus could hit me. I don't assign a probability of 0.5 to "bus hits me." I use available data. In the OP, you're saying we have *no* data. Fine. But if I have no data, the symmetry of the situation *is* the data. Why would the universe favor me being a king over a serf? It wouldn't. So 1/*n* is the only non-arbitrary assignment. To refuse that is to introduce an arbitrary pessimism. You're basically saying, "Assume the universe is out to get you."

  **Sarah:** No, I'm saying, "Assume the consequences of being wrong are asymmetric." If you assume equiprobability and you're wrong, and you end up a serf in a utilitarian hellhole, you lose everything. If you assume Maximin and you're "wrong"—meaning you could have been rich in a utilitarian society but instead are rich in a Difference Principle society—you lose... what? Excess surplus? The asymmetry of the *outcome* justifies the asymmetry of the *rule*. Harsanyi treats the utility function as linear. Rawls says the marginal value of primary goods drops off, but the marginal disvalue of losing basic rights is infinite.

  **David:** (Leans back, swirling his beer) Okay, the infinite disvalue point. That's the only way you get Maximin out of Expected Utility, right? If the utility of the worst outcome is negative infinity, then any probability greater than zero tanks the expected value. But are basic liberties really *infinite* in value? People trade them all the time. Security for liberty. Privacy for convenience. If you admit they have a finite value, then my math comes back. There's some average utility high enough that you'd accept the risk of being the serf.

  **Sarah:** People trade them under duress, in non-ideal theory. We're talking about the ideal founding. Would you *knowingly* sign a contract saying, "I agree to be enslaved if the math works out"? No. Because that destroys the moral agency required to sign the contract in the first place. That's the deeper point, David. The Veil isn't just about ignorance; it's about preserving the status of the parties as free and equal moral agents. If you allow a calculus where some are sacrificed for the average, you aren't treating them as ends in themselves in the deliberation. You're treating them as vessels for utility. Maximin is the decision-theoretic expression of respect.

  **David:** That's beautiful, Sarah, it really is. But it's moral philosophy masquerading as decision theory. You've essentially conceded that if we look at this purely as a rational choice problem under uncertainty, Harsanyi wins. Expected Utility is the robust rule. You only get Maximin by stacking the deck with moral constraints about "moral persons" and "infinite disvalue" before the calculation even starts.

  **Sarah:** And you're assuming "rational choice" is a moral vacuum. It's not. The setup of the Original Position *is* the moral argument. The constraints on information, the definition of primary goods, the nature of the parties—that's all normative. Once you accept the setup, Maximin follows. You're trying to import Bayesian rationality from the real world into a hypothetical construct designed specifically to model fairness, not gambling.

  **David:** (Smiles) So we're back to square one. I think your setup begs the question by defining rationality as risk-aversion. You think my setup begs the question by defining rationality as utility-maximization regardless of the distribution.

  **Sarah:** (Clinks her glass against his) Pretty much. You think the Veil is a fog to be calculated through. I think it's a mirror.

  **David:** Cheers to that. But seriously, if we ever get to design a society, I'm not letting you near the calculator.

  **Sarah:** And I'm definitely not letting you near the constitution.
