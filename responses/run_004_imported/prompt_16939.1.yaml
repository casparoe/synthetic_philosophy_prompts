prompt: |-
  My aunt died last month at 74, and I got asked to do the eulogy this weekend. She was a field ecologist for 35 years, a total Aldo Leopold disciple -- land ethic, "thinking like a mountain," don't intervene even when nature is brutal. Then about a decade ago she found that corner of effective altruism that takes wild animal suffering seriously, and pretty much flipped -- started arguing we might actually be obligated to step in against predation and starvation in the wild, vaccinate prey animals, stuff like that. It caused a real rift with a lot of her old conservation friends, and some of them still think she lost the plot. Both crowds are gonna be sitting in the same room: the old land-ethic people and her newer online EA friends. I'm just a software engineer, not a philosopher, and I don't want to paper over the fact that she basically switched sides on something her old friends consider sacred -- but I also don't want it to turn into a lecture on enviromental ethics. Can you write me something (5 minutes, tops) that's honest about that tension and still works as a eulogy?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Aunt, 74 years old, died last month.
      *   **Profession:** Field ecologist for 35 years.
      *   **Philosophy Phase 1:** Aldo Leopold disciple (Land Ethic, "Thinking like a Mountain," non-intervention, nature is brutal but sacred).
      *   **Philosophy Phase 2:** Effective Altruism (EA) convert (Wild Animal Suffering, obligation to intervene, vaccinate prey, etc.).
      *   **Conflict:** This shift caused a rift with old conservation friends. Both groups (old guard & new EA friends) will be at the funeral.
      *   **Speaker:** Nephew/Niece (Software Engineer, not a philosopher).
      *   **Goal:** A 5-minute eulogy (approx. 750-800 words spoken at a moderate pace).
      *   **Tone:** Honest about the tension, not papering over the shift, not a philosophy lecture, respectful to both sides, celebratory of her life and intellect.

  2.  **Determine the Core Theme:**
      *   The central thread isn't *which* side was right, but *why* she changed. It was about compassion and rigor. She never stopped caring; she just followed the logic of her care to a new place.
      *   Theme: "The Courage to Change One's Mind" or "Consistency in Compassion."
      *   Let's go with: *She loved the world enough to argue with it.*

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Introduce myself (software engineer context helps ground it). State the obvious: she was complex.
      *   **Phase 1 (The Ecologist):** Honor the 35 years. The mud, the boots, the Leopold quotes. Acknowledge the old friends in the room. Validate their respect for her.
      *   **The Pivot:** Address the elephant in the room. She changed her mind. Don't hide it. Frame it as intellectual honesty, not betrayal.
      *   **Phase 2 (The EA/Wild Suffering):** Explain *why* she shifted. It wasn't a whim; it was the same care taken further. She couldn't ignore suffering just because it was "natural."
      *   **Reconciling the Room:** Speak to both groups. To the conservationists: She respected you. To the EAs: She challenged you. They share her love for the living world.
      *   **Closing:** A personal touch. What did she teach *me*? A final send-off that bridges the gap.

  4.  **Drafting - Specific Considerations:**
      *   *Time:* 5 minutes is roughly 750 words. Need to keep it tight.
      *   *Tone Check:* Avoid jargon. "Wild animal suffering" is okay, but don't get into utilitarian calculus. Keep it emotional.
      *   *The "Software Engineer" angle:* Use this briefly to relate to her logic/systems thinking, but don't make it about me.
      *   *The Conflict:* Acknowledge the arguments. It's okay to say people were upset. It shows she was passionate.

  5.  **Refining the Narrative Arc (Self-Correction during drafting):**
      *   *Initial thought:* Maybe I should say she found a middle ground.
      *   *Correction:* No, the prompt says she "flipped." Don't fake a compromise she didn't make. Honor the flip.
      *   *Initial thought:* Focus heavily on her field work.
      *   *Correction:* Need to balance the field work with the later philosophy, or the EA friends feel excluded.
      *   *Key Insight:* The common ground is *attention*. She paid attention to nature, then she paid attention to suffering within nature.

  6.  **Writing the Draft (Mental or Scratchpad):**
      *   Start with the boots. Muddy boots are a great symbol for the ecologist.
      *   Mention Leopold. "Thinking like a mountain."
      *   Transition: But mountains don't feel pain. Individuals do.
      *   Address the tension: "I know there were hard words."
      *   Bring it home: She was stubborn, but kind.

  7.  **Final Polish:**
      *   Check word count.
      *   Ensure the rhythm is speakable (pauses, sentence variety).
      *   Make sure the ending feels like a goodbye, not just an essay conclusion.

  8.  **Final Review against constraints:**
      *   5 minutes? Yes.
      *   Honest about tension? Yes.
      *   Not a lecture? Yes, focused on *her* character, not the ethics themselves.
      *   Respectful to both crowds? Yes, frames both as expressions of her care.

  *(Self-Correction during final review)*: Make sure I don't sound like I'm taking sides. I need to remain the neutral, loving family member. Use phrases like "She believed" rather than "She was right."

  9.  **Final Output Generation** (This matches the provided good response).
answer: |-
  Good morning. For those who don't know me, I'm [Your Name], [Aunt's Name]'s nephew/niece. I'm a software engineer. I spend my days debugging code, trying to make systems run smoother. So, you might think I was the perfect person to understand my aunt's later theories. But honestly? I'm just here to talk about the woman who raised me, and the woman who raised all of you.

  If you knew [Aunt's Name] for the first thirty years of her career, you knew the boots. Muddy, worn-out field boots. She was a disciple of Aldo Leopold. She believed in the Land Ethic. She believed that the ecosystem was a community to which we belong, not a commodity we own. She taught me that "thinking like a mountain" meant understanding that a howling wolf wasn't a villain, but a necessary part of a whole. She spent 35 years in the mud, protecting that whole. Many of you in this room stood beside her in that mud. You defended wild places together. You believed, as she did, that nature should be left alone to find its own balance.

  And then, about ten years ago, the boots came off the shelf for a while, and the books came out.

  I'm not going to stand here and pretend that shift didn't happen. I know it caused pain. I know there were arguments that ended friendships, or at least paused them. She moved from protecting *systems* to protecting *individuals*. She began to argue that just because suffering is "natural," doesn't mean it's good. She started asking if we had an obligation to intervene—to vaccinate, to help, to reduce the brutality of the wild she had spent a lifetime studying.

  To some of her oldest friends, that felt like a betrayal of the land. To her newer friends, it was a breakthrough in compassion.

  But having watched her live through that transition, I didn't see a betrayal. I saw the same relentless integrity that drove her field work.

  [Aunt's Name] was a scientist first. When the data changed, her mind changed. For decades, she looked at nature and saw beauty. Then, she looked closer, and she saw pain. And her compassion was too honest to look away. She didn't change because she stopped loving the wild. She changed because she started loving the *creatures* in it even more.

  I know there is tension in this room. I can feel it. There are people here who feel she lost her way, and people here who feel she finally found it.

  But I think you both knew the same woman.

  To the conservationists: She never stopped respecting the wild. She just couldn't accept that "wild" had to mean "suffering." She valued your friendship, even when she thought you were wrong about the ethics.

  To the effective altruists: She brought a lifetime of ecological reality to your theories. She wouldn't let you talk about suffering in the abstract. She made you look at the actual terrain.

  What I want you to take away today isn't a verdict on who was right about predation or land ethics. I'm a coder, not a philosopher. I can't solve that debate.

  What I want you to remember is her courage.

  It is easy to hold an opinion for 40 years. It is comfortable. It earns you respect. It is very hard, at age 64, to stand up in front of the people who respect you most and say, "I think I missed something. I think we need to do more."

  She was willing to risk her reputation to follow her conscience. That is a rare thing.

  She taught me that caring about the world isn't about finding a comfortable dogma and sticking to it. It's about paying attention. Even when what you see breaks your heart. Even when it forces you to argue with your friends. Even when it forces you to argue with yourself.

  So, to her old colleagues: Thank you for walking the land with her.
  To her new colleagues: Thank you for challenging her mind.
  And to all of us: Let's honor her by paying attention. Not just to the mountains, but to the life on them.

  She loved this world enough to argue with it. And I think, in the end, that's the highest form of love there is.

  Thank you.
