answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], [Grandma's Name]'s grandchild.

  Standing here, looking at a room half-filled with her fellow economists and half-filled with family members who just know her as the person who sneaks you extra dessert, I realized I have a tricky assignment. I need to talk about economics without boring the family, and talk about feelings without losing the department.

  Fortunately, Grandma gave me the roadmap.

  As many of you know, she spent 34 years teaching AP Econ. And for 34 years, she's been obsessed with one specific text: John Maynard Keynes' 1930 essay, *Economic Possibilities for our Grandchildren*.

  Keynes predicted that 100 years from his time—meaning, right now, in 2030—technology and capital would solve the problem of scarcity. He predicted we'd be so wealthy that we'd only need to work about 15 hours a week.

  Now, the easy joke—the one everyone makes at staff parties—is to look around and say, "Well, Keynes was obviously wrong. We're all still working 40, 50, 60 hours."

  But Grandma made me promise I wouldn't make that joke tonight. She says that's the lazy reading. She says if you stop there, you miss the point.

  Because Keynes wasn't actually celebrating the 15-hour week. He was terrified of it.

  He wrote that for all of human history, we have been trained to struggle, to toil, to be *useful*. He worried that if you took that struggle away, people would suffer from a "severe nervous strain." He asked a terrifying question: *When a person is no longer forced to be productive to survive, will they know how to live?*

  He worried that after a lifetime of purposefulness, we wouldn't know how to just *be*.

  And I think, if I'm being honest, that's the real reason we're all here tonight. It's not just about celebrating the past 34 years. It's about acknowledging the threshold she's crossing now.

  Grandma, you have spent your life being indispensable. You've graded thousands of papers. You've explained marginal utility until your voice gave out. You've measured your worth in student success rates and AP scores. You have mastered the art of being useful.

  So, I know there's a part of you that's looking at this retirement—the quiet mornings, the lack of a bell schedule—and feeling a little bit of that Keynesian anxiety. You're wondering, "Who am I when I'm not the teacher?"

  But here is where I think Keynes got it wrong, and where you got it right.

  Keynes assumed that "work" and "life" were two different things. He thought purpose came from labor, and leisure was just... empty time.

  But anyone in this room who has sat in your classroom, or at your dinner table, knows that you never treated teaching as just labor. You treated it as connection. You didn't just teach us how to make a living; you taught us how to think, how to question, and how to care about the world.

  You haven't spent 34 years just building a career. You've spent 34 years practicing the "art of life" that Keynes said we'd forget.

  You taught us that value isn't just about output. It's about impact. And impact doesn't retire.

  So, to the econ department: Yes, the 15-hour week didn't happen. We are still working.
  But to the family, and to Grandma: The prophecy wasn't about the hours. It was about the freedom to choose what matters.

  You are not losing your purpose today. You are finally gaining the time to apply it to whatever you want, without a syllabus. You are ready for this. Not because you've stopped being useful, but because you've spent a lifetime proving that your value is human, not economic.

  So, if everyone could please raise a glass.

  To Grandma. May your next chapter be proof that Keynes worried too much, and that you were right all along. The work is done. Now, the living begins.

  Cheers.
