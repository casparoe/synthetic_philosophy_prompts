answer: |-
  You have hit on exactly the right tension. Your intuition is sharp: **Acausal Trade is essentially Superrationality generalized, and in that generalization, it trades logical certainty for scope.**

  To answer your specific question: Once you strip out the symmetry (identity of agents), the work is being done by **Logical Correlation via Mutual Simulation**, grounded in Functional Decision Theory (FDT).

  Here is the breakdown of what replaces symmetry, why it is shakier, and where the epistemic burden shifts.

  ### 1. What Replaces Symmetry?
  In Hofstadter's Superrationality, the mechanism is **Identity**.
  *   **Premise:** Agent A and Agent B are running the exact same algorithm on the exact same input.
  *   **Mechanism:** Logical Necessity. If $Algorithm_A = Algorithm_B$, then $Output_A$ *must* equal $Output_B$. There is no probability here; it is a mathematical identity.
  *   **Result:** I cooperate because I cannot logically conceive of a world where I cooperate and you defect.

  In Acausal Trade (specifically the Yudkowsky/Soares FDT framing), the mechanism is **Logical Correlation**.
  *   **Premise:** Agent A and Agent B are running *different* algorithms, potentially with different utility functions, separated by causality (time, space, or Everett branches).
  *   **Mechanism:** Mutual Prediction / Logical Counterfactuals. Agent A simulates Agent B. Agent B simulates Agent A. They recognize that their decision procedures share a common logical structure regarding "trade offers."
  *   **Result:** I cooperate because my decision *logically influences* yours, not because we are the same, but because you are simulating me (or my source code) and conditioning your output on mine.

  **The "Work" is done by the assumption that logical facts are subjunctively linked.** Even if we are different, if I am reasoning "If I cooperate, will they?", and you are reasoning "If they cooperate, will I?", our reasoning processes become entangled variables in a single logical equation.

  ### 2. Is it as Solid? (The Shakiness Factor)
  No. It is significantly shakier, though it aims for a much harder target.

  **Superrationality** rests on a binary switch: Either the agents are identical reasoning processes, or they aren't. If they are, the cooperation is logically locked. It is epistemically cheap but practically rare (humans are never identical).

  **Acausal Trade** rests on a continuous variable: **Degree of Logical Correlation.**
  This introduces three major points of failure that Superrationality avoids:

  #### A. The Reference Class Problem
  In Superrationality, the reference class is "Me." I know my own code.
  In Acausal Trade, I must determine: *Is this alien agent sufficiently similar to me in its decision theory that our outputs correlate?*
  If I overestimate the correlation, I get exploited (I cooperate, they defect). If I underestimate it, I miss gains from trade. There is no clean mathematical way to calculate the probability that a silicon-based AI in another universe shares your logical decision procedure enough to make trade viable.

  #### B. Computational Asymmetry
  Superrationality assumes both players can solve the problem. Acausal trade requires **mutual simulation**.
  For trade to work, I must be able to simulate you well enough to trust you, and you must be able to simulate me well enough to trust me.
  *   If you are vastly smarter than me, you can simulate me, but I can't simulate you. I have to take your word that you'll cooperate. This breaks the symmetry of verification.
  *   If we are both computationally bounded, we might only be able to simulate *simplified versions* of each other. Do those simplified versions correlate enough to justify the trade? This introduces "logical uncertainty," which is currently an unsolved problem in decision theory.

  #### C. The "Why Cooperate?" Regress
  In Superrationality, the logic is: "We both want (C,C) > (D,D). Since our outputs are linked, I choose the path to (C,C)."
  In Acausal Trade with different values, the logic is: "I value Paperclips. You value Staples. If I make Paperclips for you, you will make Staples for me."
  But why do you do that? Because you simulated me and saw I would do it.
  But why did I do it? Because I simulated you...
  This creates a dependency loop that relies on **common knowledge of rationality** extending across causal boundaries. If there is even a tiny probability that the other agent is a "defector bot" hard-coded to defect, the expected utility of acausal trade can plummet depending on your priors. Superrationality sidesteps this by assuming the other player *is* you.

  ### 3. The Verdict: Generalization vs. Rigor
  You asked if Acausal Trade is "quietly resting on a shakier argument while claiming the same kind of conclusion."

  **Yes.**

  *   **Superrationality** is a **special case** of Acausal Trade where the correlation coefficient is 1.0. It is logically airtight *within its assumptions*, but its assumptions are almost never met in reality.
  *   **Acausal Trade** relaxes the assumptions to make the concept applicable to the real world (or the multiverse), but in doing so, it replaces **Logical Necessity** with **Probabilistic Expectation**.

  The "work" is being done by **Functional Decision Theory**, which treats decisions as logical outputs rather than causal actions. FDT says: "Choose the output of your algorithm that yields the highest utility, knowing that this output is logically correlated with the output of other agents simulating you."

  **The Shake:**
  The shakiness comes from **Logical Uncertainty**. We do not have a complete formal theory of how to assign probabilities to logical facts (e.g., "What is the probability that an agent with utility function U2 will correlate with my algorithm A1?"). Superrationality doesn't need this because the probability is 1 or 0. Acausal trade needs to calculate it, and currently, we are guessing.

  ### Summary
  *   **Superrationality:** "We are the same, so we must do the same." (Rigid, certain, impractical).
  *   **Acausal Trade:** "We are different, but our reasoning is correlated enough that trading is the optimal logical output." (Flexible, uncertain, computationally expensive).

  Acausal trade buys you the ability to cooperate with aliens, ancestors, and simulations, but the price is that you can no longer prove cooperation is mandatory. You can only argue it is *expected* to be utility-maximizing, contingent on a web of assumptions about simulation fidelity and logical correlation that are much harder to verify than simple identity.

  So, your bug is justified. It is the same engine, but Superrationality is running on a test bench with perfect conditions, while Acausal Trade is trying to drive it on a muddy road with a half-map.
