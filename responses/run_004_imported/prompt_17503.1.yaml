  Me and my buddy run a pop-up food stall, and there's a hard deadline: he's moving overseas in exactly 10 weeks. Each week, whoever's turn it is can cash out — keeping most of that week's profit and handing the rest over — or reinvest it all into more stock, which grows the pot but passes next week's decision to the other person. He argues that since we both definately know week 10 is the last one, whoever's turn falls there will obviously just cash out, so the week-9 person should cash out too rather than hand a bigger pot to someone who's just gonna take the lion's share anyway — and that logic apparently chains all the way back to week 1, meaning the "smart" move is for me to cash out today and never even build the stall up in the first place. Something about that feels really wrong, since we'd clearly both do better if we just kept trusting each other a while longer. Is he actually right, or is there a hole in his logic somewhere? It's been bugging me all week.
