answer: |-
  So I tried to thank my Kantian roommate for doing the dishes last night.

  I said, "Hey, thanks for cleaning up, you're such a good friend."

  He looked genuinely offended. He said, "If I'm doing them because I'm your friend, that's *inclination*. Zero moral worth. If I'm doing them because I want you to cook dinner later, that's *prudence*. That's just the Shopkeeper example. Zero moral worth."

  I asked, "So why *are* you doing them?"

  He said, "Because I loathe soap scum, I'm exhausted, and I would rather be sleeping—but my Reason recognizes a universal duty to maintain communal hygiene."

  I said, "Well, you look pretty happy about the clean sink."

  He panicked, frowned aggressively, and whispered, "Dammit. I'm smiling. Hold on, I have to stop enjoying this outcome before the action becomes morally contaminated. Do you have a rag? I need to re-wash this plate while thinking about how much I resent you."
