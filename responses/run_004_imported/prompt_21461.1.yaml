prompt: |-
  So we just spent this whole week's ethics seminar on the "moral worth" section of Kant's Groundwork -- the shopkeeper who's honest to customers only because dishonesty is bad for business, and that wierdly specific example where a guy who used to be a total softie loses all his natural sympathy after some personal tragedy but keeps helping people anyway purely from duty, and apparently THAT's when his action finally counts as having real moral worth. My professor also brought up Michael Smith's "moral fetishism" objection, which is basically that this picture makes genuinely good people sound like they care more about capital-D Duty than about the actual person in front of them. We also glanced at the Huckleberry Finn case (Arpaly's, i think?) where Huck helps Jim escape even though he consciously believes it's the wrong thing to do -- which felt like the mirror-image problem. I've been chewing on this for days and it's kind of funny once it clicks.

  Could you write me a joke that actually hinges on this gap -- between doing the right thing and doing it *for the right reasons*, i.e. with the right motivational structure? I don't want a generic philosopher joke where you could swap in any ethical theory and it'd still basically work -- I want the punchline to require actually getting the duty-vs-inclination thing, or the fetishism objection, or that Huck Finn mirror-case, so it'd genuinely fall flat for someone who hasn't sat through this lecture. If it's good I might actually share it in section tomorrow.
