answer: |-
  **Setting:** *A dimly lit faculty lounge, 11:30 PM. Coffee stains on the table. Two empty whiteboards behind them covered in decision trees.*

  **Characters:**
  *   **ELENA:** Proponent of Resolute Choice.
  *   **MARCUS:** Proponent of the Expectation/Intention Transparency view.

  **MARCUS**
  It's a category error, Elena. You keep talking about *drinking* the toxin like it's the hard part. It's not. The hard part is the mental state at midnight. You cannot intend to do what you know you will not do.

  **ELENA**
  I can if I am resolute.

  **MARCUS**
  That's just a word. Look at the transparency condition. To intend to $\phi$, I have to believe I will $\phi$. But at midnight, I'm a rational agent. I look ahead to tomorrow afternoon. I see the million dollars is either in my account or it isn't. My drinking the toxin changes nothing. It's a sunk cost. So I know, with certainty, that Future-Me has zero normative reason to drink. Therefore, I know Future-Me won't drink. Therefore, I cannot believe I will drink. Therefore, I cannot intend.

  **ELENA**
  You're treating rationality as a series of disconnected snapshots. Synchronic rationality. If you slice time thin enough, sure, at $t_2$ there's no reason. But agency isn't a slideshow. It's a movie. If I adopt a policy at $t_1$—"I am the kind of agent who executes plans"—that policy provides the reason at $t_2$.

  **MARCUS**
  Does it? Or does it just paper over the gap? This is my worry with your resolute choice model. It feels like you're smuggling in a reason where there isn't one. You're saying, "The fact that I decided this yesterday is a reason to do it today." But why? If the decision was optimal yesterday because of consequences that *no longer obtain*, sticking to it isn't rationality. It's stubbornness. You're redefining "reason" to mean "past commitment" just to make the puzzle solvable.

  **ELENA**
  I'm not redefining reason. I'm expanding the locus of evaluation. You evaluate the rationality of the *plan*, not the *act* in isolation. The plan "Intend and Drink" dominates "Intend and Don't Drink." If I know I'm resolute, the plan is available to me. If I know I'm *you*—a myopic maximizer—the plan isn't available. I'm not saying the toxin tastes good. I'm saying that deviating from the plan undermines the very capacity to plan.

  **MARCUS**
  But that's the magic trick! You say "If I know I'm resolute, the plan is available." But how do you *know* you're resolute? You have to predict your own behavior. If you're rational, you predict based on reasons. At $t_2$, the reasons vanish. So a truly rational agent predicts they will defect. The only way to "know you're resolute" is to blind yourself to the lack of reasons at $t_2$. You're asking the agent to be irrational about their own incentives to prove they're rational about their own plans.

  **ELENA**
  No. I'm asking them to recognize that *having a will* is an incentive. Look, Marcus, take your view seriously. If intention requires believing you'll act, and believing you'll act requires seeing a reason at the time of action... then almost no future-directed intention is rational.

  **MARCUS**
  Don't straw man me.

  **ELENA**
  I'm not. Consider dieting. At 8 PM, I intend to skip dessert tomorrow. At 7 PM tomorrow, the cake is there. The pleasure of eating is immediate. The health benefit is distant. On your synchronic model, Future-Me has more reason to eat the cake than skip it. So Present-Me knows Future-Me will eat the cake. So Present-Me cannot intend to skip it. Your model implies that strategic planning is literally impossible for a rational agent. It implies we can only intend to do what our future selves will find easiest.

  **MARCUS**
  That's not right. In the diet case, the reason *does* persist. Health is still a value at 7 PM. In the Toxin case, the value *disappears*. The money is already banked. That's the asymmetry. In Toxin, the consequence is causally severed from the act. In dieting, the act causes the health. I'm not saying planning is impossible. I'm saying *bootstrapping* is impossible. You can't create a reason to drink poison just by pointing at a decision you made when you had a reason to decide it.

  **ELENA**
  But the decision *itself* has value! Integrity. Self-governance. If I treat my past decisions as binding, I become an agent who can secure benefits that require commitment. If I treat them as non-binding, I'm a slave to the moment. Isn't it more rational to be the master?

  **MARCUS**
  It's only "mastering" yourself if there's a war. But if you're fully rational, there shouldn't be a war. The problem is, you're trying to use rationality to bind rationality. It's like trying to lift yourself by your bootstraps. You say, "I drink because I decided." I ask, "Why did you decide?" You say, "Because I knew I'd drink." That's circular. The intention is a fiction. A useful fiction, maybe. You can *say* you intend. You can even *hope* you intend. But you can't *believe* it. And without belief, it's not intention. It's a wish.

  **ELENA**
  So what's the alternative? We tell everyone that rational agents can't make binding commitments? That game theory collapses whenever the payoff structure shifts between agreement and execution? That's a bullet I won't bite. I'd rather accept that "because I decided to" is a valid normative reason. It's the price of admission for being a temporally extended agent.

  **MARCUS**
  And I'd rather accept that rational agents can't get the million dollars.

  **ELENA**
  *Laughs.* There it is.

  **MARCUS**
  Why is that so funny?

  **ELENA**
  Because you're admitting it. You're admitting that on your definition, rationality is a handicap. A rational agent, in your sense, walks away poor. An irrational agent—or a resolute one—walks away rich. If rationality systematically punishes you in these coordination problems, maybe the defect is in the definition of rationality, not the agent.

  **MARCUS**
  Or maybe the puzzle is a trap designed to show that some goods are inaccessible to pure instrumental rationality. You can't get the money by reasoning your way into it. You get the money by being the *kind of person* who drinks toxin. But you can't choose to be that person by reasoning. You just have to *be* it. If you have to calculate it, you've already lost. So, sure, a "resolute chooser" gets the cash. But is she rational? Or is she just non-calculating?

  **ELENA**
  Being the kind of person who honors plans *is* a form of calculation. It's second-order calculation. It's calculating the value of having a will.

  **MARCUS**
  Is it? Or is it just a disposition? A disposition isn't a decision. I can cultivate a disposition to drink toxin, sure. Like training a reflex. But that's not *intending*. That's conditioning. If I'm conditioned, I don't weigh reasons at $t_2$. I just act. But decision theory is about weighing reasons. If you remove the weighing at $t_2$, you've left decision theory behind. You've moved into psychology.

  **ELENA**
  And if you keep the weighing at $t_2$, you've moved into paralysis. You've made agency impossible. Look, Marcus. We're stuck because you think reasons have to be external to the agent's will. You want the reason to be in the world—the money, the health, the pain. I'm saying the reason can be internal—the structure of the will itself.

  **MARCUS**
  If the reason is internal, if it's just "I said so," then anything is rational. I can intend to hop on one leg forever because I decided to.

  **ELENA**
  No. Because the plan has to be optimal *ex ante*. You can't resolutely choose a losing plan. You can only resolutely choose the plan that *would* have been impossible without resoluteness. It's constrained.

  **MARCUS**
  Constrained by what? By the fact that you need the money?

  **ELENA**
  By the requirement of diachronic consistency.

  **MARCUS**
  *Sighs, rubs his temples.* Diachronic consistency. It sounds noble. But tell me this. Suppose you get the money. It's 2 PM. The bank confirms the deposit. You hold the vial. You know, absolutely, that drinking it makes you sick and gains you nothing. Your hand is on the cap. What is the voice in your head saying?

  **ELENA**
  It's saying: "Open the vial."

  **MARCUS**
  Why?

  **ELENA**
  "Because I am an agent who keeps commitments. To stop now is to admit that my will has no force over time. It is to admit that I am a slave to the present moment."

  **MARCUS**
  And that feeling... that's a reason?

  **ELENA**
  It's the only reason that matters.

  **MARCUS**
  To me, that sounds like a ritual. You're performing a sacrifice to the god of Consistency. And sure, maybe the god pays out. But a rational agent looks at the vial and sees poison. Not a ritual object.

  **ELENA**
  And a rational agent looks at their future and sees a partner they have to live with. If I betray my past self now, why should my future self trust me?

  **MARCUS**
  Because your future self will also see there's no reason to drink! It's an infinite regress of betrayal, Elena.

  **ELENA**
  No. It's a stable equilibrium of trust.

  **MARCUS**
  *Pauses.* You know, if you're right, then rationality isn't about maximizing utility at every node.

  **ELENA**
  Correct.

  **MARCUS**
  It's about maximizing utility over the trajectory, even if it means acting against utility at specific points.

  **ELENA**
  Exactly.

  **MARCUS**
  Then we aren't arguing about the Toxin. We're arguing about whether time exists for the rational agent.

  **ELENA**
  *Smiles.* Finally. So, are you going to drink?

  **MARCUS**
  *Stands up.* I'm going to sleep. And tomorrow, I'm going to leave the vial on the table. And I'll be poorer for it.

  **ELENA**
  And you'll call that rational.

  **MARCUS**
  I'll call it honest. You can keep the million. But don't tell me you intended to drink. You just hoped you wouldn't have to choose.

  **ELENA**
  *Watch him go. Speaks to the empty room.*
  That's the intention.
