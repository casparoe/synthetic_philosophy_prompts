  The rain tapped against the window of Mark's apartment, a steady rhythm matching the countdown on the news ticker below. Tomorrow was the election. On the couch, Mark swirled the ice in his glass, while Sarah sat in the armchair, scrolling through her phone with a frown.

  "You're not going tomorrow, are you?" Mark asked. It wasn't really a question.

  Sarah looked up. "I am. Early. Before work."

  "Seriously? We've been over this." Mark set his glass down. "Look at the polls. It's not going to be decided by one vote. It's mathematically impossible for your ballot to matter."

  "It's not impossible," Sarah corrected. "Just improbable."

  "Vanishingly improbable," Mark countered. "One in millions, maybe billions, depending on the state. So, do the expected utility calculation. Take the benefit of your candidate winning—say, a hundred thousand dollars' worth of personal value to you. Multiply that by one in ten million. You get a fraction of a cent. Then subtract the cost of your time, gas, waiting in line. The net value is negative. It is literally irrational to go."

  Sarah leaned forward. "That calculation assumes the only thing that matters is what my vote *causes* directly. You're acting like you're the only variable in the universe."

  "I'm acting like I'm an individual agent," Mark said. "My vote causes one mark on a paper. It does not cause anyone else's vote. If a million other people decide to stay home, that is not my fault. I didn't make them stay home. I just made my own optimal choice."

  "That's the crux of it, isn't it?" Sarah said. "You think rationality is only about causal leverage. I think it's about evidence."

  Mark sighed. "Here we go. The magic vote."

  "It's not magic. It's correlation," Sarah said. "You aren't a unique snowflake in how you reason. There are thousands, maybe millions of people who think exactly like you. Pragmatic, analytical, skeptical of civic duty. If *you* decide that voting is irrational based on that cost-benefit analysis, it is highly probable that *they* will come to the exact same conclusion using the exact same logic."

  "So?"

  "So, your decision is evidence of what they will do," Sarah said. "If you vote, it's evidence that people like you voted. If you stay home, it's evidence that people like you stayed home. When you decide, you aren't just deciding for Mark. You're effectively sampling for the entire demographic of 'people who reason like Mark.'"

  Mark shook his head. "That feels like wishful thinking. Just because we think alike doesn't mean my action *changes* theirs. Their brains are in their heads, not mine. If I stay home, and they stay home, that's a coincidence, not a consequence. Why should I bear the cost of voting to fix a coincidence I didn't cause?"

  "Because you can't separate yourself from the algorithm," Sarah said. "You're running a specific reasoning process. If that process outputs 'stay home,' then every other instance of that process outputs 'stay home.' You don't have to causally influence them. You just have to recognize that you are one instance of a pattern. If the pattern defects, the outcome is bad for everyone running the pattern, including you."

  "That sounds like Newcomb's Problem," Mark admitted. "The box with the million dollars or the thousand dollars."

  "Exactly," Sarah said. "If you think your choice can't change what the predictor already put in the box, you take both boxes and get a thousand. If you recognize your choice is evidence of what the predictor predicted, you take one box and get a million. Voting is the same. If you treat your vote as causally isolated, you get a society where people like you don't vote, and you get policies you hate. If you treat it as evidence of a bloc, you get the better outcome."

  "But in Newcomb's Problem, the predictor is omniscient," Mark argued. "In the real world, I am not causally linked to my neighbor. If I drag myself to the polls, and my neighbor *still* stays home because he's lazy or busy, I've lost nothing but time. I haven't gained any 'evidential value' that puts food on my table. The 'fault' objection stands. If the rest of the logical cohort abandons ship, why should I be the sucker who stays on board? My staying doesn't save them. It just drowns me alone."

  Sarah paused. She took a sip of her drink. "That's the free-rider problem. But if everyone uses your logic, the ship sinks immediately. You're relying on other people to be irrational—to vote despite the odds—so that you can enjoy the benefits without the cost. But you can't consistently will that everyone should think like you. If everyone thought like you, the system you're benefiting from wouldn't exist."

  "I don't need everyone to think like me," Mark said. "I just need enough people to be irrational enough to sustain democracy while I optimize my Tuesday morning. And look, I get the moral argument. I really do. But we're talking about *rationality*. If I stay home, I haven't harmed anyone. I haven't taken anything. I've just opted out of a low-yield investment. It is not my fault that the investment has such poor returns. Don't blame me because the market is inefficient."

  Sarah smiled faintly. "But you are the market. Or at least, a significant chunk of it. You say it's not your fault because you aren't controlling them. But rationality isn't just about control. It's about making the choice that leads to the world you prefer. Which world do you want to live in? One where people who reason like you vote, or one where they don't?"

  "I want to live in the world where I don't waste time on futile gestures," Mark said.

  "Is it futile if it confirms you are the kind of person who sustains the system?" Sarah asked. "You're treating your vote like a transaction. I'm treating it like a signature. When I sign, I'm not trying to move the building. I'm confirming I belong in it. If I don't sign, I'm not saving time. I'm erasing my name from the ledger of people who keep the lights on."

  "That's poetry, Sarah," Mark said gently. "Poetry doesn't change vote counts. Causality does. And causally, your signature is invisible."

  "And evidentially, your silence is deafening," she replied. "If you stay home, you aren't just saving an hour. You're updating the probability that our side loses. You're adding data to the set that says 'people who care about logic don't participate.' I don't want to be that data point."

  Mark looked out the window at the rain. "I guess that's where we're stuck. I think I'm responsible for what I *do*. You think I'm responsible for what I *am*."

  "Maybe," Sarah said. "Or maybe I think what you *are* determines what you *do*, and what you *do* tells us what we all get."

  Mark picked up his glass again. "Well. Tomorrow morning, I'm going to be very comfortable in bed. Knowing I made the mathematically correct choice."

  "And I'm going to be standing in the rain at a school gym," Sarah said, standing up to leave. "Knowing I made the logically consistent one."

  "Goodnight, Sarah."

  "Goodnight, Mark. See you on Wednesday. Regardless of the outcome."

  "Regardless," Mark said.

  She closed the door behind her. Mark sat alone in the quiet room, looked at his voter registration card on the table, and didn't move it.
