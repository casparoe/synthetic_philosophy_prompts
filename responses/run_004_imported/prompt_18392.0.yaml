      *   **Impact vs. Intent:** His intent isn't to hurt, but the impact is still hurtful. Both matter.
      *   **The "Grief" Aspect:** The user might need to grieve the brother they wish they had vs. the one they do have.
      *   **Responsibility:** Who is responsible for what? He is responsible for his healing (or lack thereof). The user is responsible for their boundaries.

