      In Decision Theory, IIA (often called Independence of Irrelevant Alternatives in choice contexts, or just Independence in vNM) is about preferences over lotteries. In Social Choice, it's about preferences over alternatives given profiles. They are structurally similar (independence of context), but calling them "the same assumption" is slightly loose. For a seminar, I might dock a tiny bit, but it shows good synthesis. I'll leave it as a minor note rather than a deduction, focusing the deduction on the Condorcet/IIA conflation.

      *Final Plan:*
