answer: |-
  The wine had breathed long enough. It was starting to turn.

  Nora swirled her glass, watching the legs run down the side. "You hung it for ten years, Willem. Ten years you looked at that canvas every morning when you unlocked the cases. You wrote the catalogue entry. You told the donors it was a 'rediscovered masterwork.'"

  "I told them it was Van Houten," Willem said. He hadn't touched his roast. "There is a difference between looking at a thing and knowing what you are looking at."

  "Is there? Aesthetically?" Nora leaned forward. "Because if you put my canvas next to the *Fishing Boats* in the Rijksmuseum, under the same lights, with the same varnish... the experience is identical. The beauty is in the light hitting the retina, not in the carbon dating of the linen. If the eye can't tell, the art is the same. The only crime is the signature on the invoice."

  "That is a merchant's defense," Willem said quietly. "Not an artist's."

  "I am an artist. That's the point you refuse to see. Lessing got it right. Aesthetic value tracks perceivable properties. My brushwork has the same tension, the same hesitation in the glaze. I didn't just copy the image, Willem. I copied the *decision-making*. Every time Van Houten decided to load the brush with more turpentine, I made the same choice. I lived his Tuesday mornings for twenty years."

  "But you didn't live his life," Willem said. "Goodman proved this. Art isn't just the object; it's the history of its production. When we look at a Van Houten, we aren't just looking at pigment. We are looking at a specific human achievement at a specific moment in time. We are tracing the path of *his* hand. Yours is a different path. Therefore, it is a different object, aesthetically speaking, even if the chemical composition is identical."

  "So it's about provenance? It's always just paperwork to you?"

  "It's about the category. Think of music. If I buy a bootleg CD of Glenn Gould, it sounds the same. But we don't value it the same. Why?"

  "Because music is allographic," Nora shot back. "It's defined by the score. A painting is autographic. That's the loophole you hide behind. But tell me this: if I buy a paperback of *Madame Bovary*, printed yesterday on cheap paper, nobody calls it a fake. It's still Flaubert. If I play a vinyl pressing of Bach made in 1990, nobody says I'm not hearing Bach. Why does a painting demand a blood sacrifice of authenticity that a book or a record doesn't?"

  Willem finally picked up his fork, set it down again. "Because there is no master score for a painting. The canvas *is* the score. The history is embedded in the object itself. When you forge, you aren't creating a new score; you are pretending to be the instrument."

  "Does it matter if the audience can't hear the difference?" Nora pressed. "If I forge a picture so well that the pigment analysis can't even flag it... if it stays in the museum for another fifty years... who is hurt? The 'feeling cheated' argument is weak, Willem. It's sentimental. If the experience is pure, the cheat is imaginary."

  "It's not imaginary to me!" Willem's voice cracked, just once. He took a breath, steadying himself. "You ask why people feel cheated by undetectable fakes. It's because art is a conversation across time. When I stood in front of that painting, I thought I was talking to Van Houten. I was adjusting my understanding of his development, his late period, his struggle with light. I was learning from *him*."

  He looked at her, his eyes tired. "But I was talking to you. I was learning about *you*. And I didn't consent to that conversation. The aesthetic experience relies on trust, Nora. If I find out the person speaking to me is wearing a mask, the words might sound the same, but the meaning changes. The achievement isn't the paint. The achievement is the *overcoming*. Van Houten overcame the limitations of his time. You overcame the limitations of security systems. Those are different achievements. One is art. The other is... craft."

  "Craft," Nora repeated. She took a long drink of the wine. It tasted like vinegar. "So because I didn't suffer the right kind of poverty, because I didn't die in 1684, the light doesn't hit the canvas the same way?"

  "Because you lied about the suffering," Willem said. "And now you want me to validate the lie. You want me to say that what we had—what I thought we had, as brothers, as colleagues—was aesthetically equivalent to the truth."

  "I want you to admit that you loved the painting," Nora said. "Not the name. The painting. Before the lab report. Did you love it?"

  Willem looked at the space between them, where the cold roast sat on the white china.

  "Yes," he said. "I loved it."

  "Then it was real. In the only way that matters."

  "It was real to me," Willem corrected. "But it wasn't true. And in art, truth isn't a separate question from beauty. They're the same variable."

  He reached for the wine bottle, but it was empty.

  "So we're at an impasse," Nora said.

  "We're at the bill," Willem replied.

  Neither of them moved to call the waiter. The silence settled back over the table, heavier than before, filling the space where the argument had been.
