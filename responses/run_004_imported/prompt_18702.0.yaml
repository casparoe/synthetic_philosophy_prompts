answer: |-
  This is a fantastic rabbit hole to fall into. The reason you're finding a "cottage industry of disagreement" is that "function" is a Janus-faced concept in biology: it looks backward (history/selection) and forward (current utility/system capacity). No single theory perfectly captures both without trade-offs.

  Based on current consensus in the philosophy of biology (roughly 2020s), here is how these accounts stack up regarding defensibility, handling of malfunction/novelty, and general robustness.

  ```json
  {
    "S": [
      "Etiological/Selected-Effects (Wright, Neander, Millikan)"
    ],
    "A": [
      "Organizational/Self-Maintenance (Mossio, Saborido, Moreno)"
    ],
    "B": [
      "Causal-Role (Cummins)",
      "Modern History (Godfrey-Smith)"
    ],
    "C": [
      "Propensity (Bigelow & Pargetter)"
    ],
    "D": []
  }
  ```

  ### A Brief Sanity Check on the Rankings

  **S Tier (Etiological):** This remains the "standard model." It wins because it is the only one that truly solves the **malfunction problem** without cheating. A broken heart has a function because of its history, even if it currently does nothing. It loses points only because it struggles with **novel traits** (spandrels, vestigial organs losing function) and requires a traceable selection history which isn't always available.

  **A Tier (Organizational):** The strongest contemporary challenger. It grounds function in the here-and-now (how a part contributes to the self-maintenance of the whole organism). It handles **novel traits** well (no history needed) and handles **malfunction** by referencing the system's normative organization. It's ranked A only because it's newer and sometimes accused of secretly smuggling selection back into the definition of "organization."

  **B Tier (Causal-Role & Modern History):**
  *   **Causal-Role:** Indispensable for physiology, but as a *general* theory of biological function, it fails the **malfunction problem** (a stopped heart has no function on this view). It describes *capacity*, not *purpose*.
  *   **Modern History:** A robust refinement of the S-Tier view that handles changing environments better, but it doesn't solve the core historical limitations enough to displace the classic Etiological view.

  **C Tier (Propensity):** Metaphysically interesting (grounding function in fitness probabilities), but it generally requires more theoretical heavy-lifting for less explanatory gain than the S or A tiers. It's respected but niche.

  **D Tier:** None of these are "refuted." They are live options, which is why your philosopher friend didn't give you a straight answer!

  **For your article on "leftovers":** You'll likely find the **Causal-Role** and **Organizational** views most useful. The Etiological view will tell you your appendix *has no function* (because it wasn't selected for its current role), whereas the other two allow you to say it *does* have a function (it currently contributes to the system), which makes for a better story about "leftovers" actually doing work.
