answer: |-
  Good morning. For those of you I haven't met yet, I'm [Name]. This is my forty-first season. It will be my last.

  Most of you are fifteen or sixteen. This is likely your first real job. You're probably expecting a talk about whistle signals, rotation schedules, and where not to leave your sunscreen. We will cover all of that. But before we get to the mechanics of the job, I want to talk to you about the philosophy of the chair.

  When you are not on the stand, you are a swimmer. You are a bystander. If you are on the deck and you see someone struggling, you have a moral obligation to help, certainly. But if you blink, if you look at your phone, if you turn away to tie your shoe and something happens in that gap, the tragedy belongs to the water. It is a terrible accident.

  When you climb into that chair, the physics of the world change.

  I have spent a long time thinking about what happens when a lifeguard does *nothing*. We train you to do things: enter the water, tube rescue, CPR. But the most important thing you do is a negative action. It is the act of *not* looking away.

  There is a question in philosophy about whether doing nothing can cause something to happen. If a stranger walks past a drowning child, have they caused the death? Most people say no. They didn't push the child in. They just didn't pull them out. But a lifeguard is not a stranger. When you put on this uniform, you enter a contract. You agree that your inattention is no longer just a passive state. It becomes an active force.

  If you are on the stand, and you look away for two minutes, and the water takes someone, you did not push them under. But because of the chair you sit in, your absence of attention becomes part of the cause. It is not the same as a rip current, but it is not the same as a bystander's distraction, either. It is a specific kind of failure that belongs only to us.

  I tell you this not to frighten you into paralysis, but to clarify the weight you are picking up. Some of you will hear this and think, "That is too much pressure. I am only sixteen. I cannot be responsible for life and death." It is a natural reaction. If you feel that weight and it crushes you, you should not take the whistle. This job requires a specific kind of backbone.

  But others of you might hear this and think, "So, if I make one mistake, I am responsible for a death. I am ruined." That is also a misunderstanding.

  The veterans in this room know that we are human. We know that eyes tire. We know that the sun glares. We know that the world is chaotic. The certification you are about to receive does not promise that you will prevent every tragedy. It promises that you will minimize the risk through relentless vigilance.

  The difference between a guardian and a murderer is not found in a single lapse of attention. It is found in the attitude toward the lapse. If you look away, and you realize it, and you tell yourself, "It was only a minute, nothing happened," you have broken the contract. If you look away, and you realize it, and you feel the cold shock of what *could* have happened, and you tighten your scan because of it, you are doing the job.

  Guilt is not a useful tool for a lifeguard. It clouds the water. But respect for the potential consequence of your inaction? That is the tool. That is the only thing that keeps your eyes moving.

  There are people in this room who have worked beside me for decades. They know that I have never missed a scan in forty years. They know why. They know that I understand the shape of the silence that follows when the whistle doesn't blow in time. I am not telling you this to burden you with my history. I am telling you so you understand that my vigilance is not born of perfection. It is born of the understanding that the chair changes what "nothing" means.

  So, here is the charge for the season.

  Do not try to be heroes. Heroes jump in when things go wrong. We are paid to ensure things do not go wrong. Your job is boring. It is repetitive. It is staring at a patch of blue water until it blurs, and then focusing again. It is resisting the urge to talk to your friend on the next stand. It is resisting the urge to check the time.

  If you slip up—and you might, because you are human—do not run from it. Do not hide it. And do not let it convince you that you are evil. Let it convince you that you are necessary.

  The water does not care about you. It will take a life without malice and without hesitation. The only thing that stands between the water and the swimmer is the person in the chair. When you are up there, your inaction is the only action that matters.

  Treat the two minutes like forty years. Treat the silence like a siren. And treat the chair like the heavy thing it is.

  Welcome to the team. Let's have a safe season.
