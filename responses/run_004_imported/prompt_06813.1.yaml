answer: |-
  Friends, colleagues, family, and members of Helen's church community.

  Thank you for being here. For thirty years, I had the privilege of calling Helen my colleague. For nearly as long, I called her my friend. We shared an office hallway, countless cups of coffee, and a deep mutual respect, even when—and perhaps especially when—our conversations grew heated.

  Helen was a woman who lived in two worlds, though she would have insisted they were not two separate places, but rather two different ways of seeing the same room. To those of us in the philosophy department, she was a rigorous scholar, a sharp mind who could dissect an argument until it surrendered its hidden assumptions. To this congregation and her family, she was a devout Christian, a woman who found her strength in prayer and her community in this church.

  But Helen was not simply a scholar who happened to go to church. She was a thinker who understood that faith is not a hobby one picks up after work. She spent her career exploring a specific, difficult idea about what it means to believe. And before she died, she gave me a specific instruction for today. She told me she did not want a eulogy that smoothed over the rough edges of her life.

  She asked me not to say that she "now knows the truth" of her faith, as if death were a final exam that graded her beliefs as correct or incorrect. But she also asked me not to say that her talk of resurrection was "just a metaphor" for human kindness. She felt that the first suggestion treated God like a scientific fact, and the second treated God like a polite fiction. Helen rejected both.

  So, how do we honor a faith that refuses to be simplified?

  For Helen, religious belief was not a theory about how the universe was built. It was not a guess about what happens after we die, waiting for evidence to prove it right. Instead, she saw faith as a "picture," as she often called it. A picture that you hold up against the world to see what it reveals.

  To believe in the Last Judgement, for Helen, was not to predict a date on a calendar. It was to live every day with the profound seriousness that comes from knowing that what we do matters infinitely. It was a lens that brought the moral weight of our actions into sharp focus. When she spoke of heaven, she was not describing a location; she was describing a direction. When she spoke of sin, she was not listing rule violations; she was naming the ways we fracture our relationships with God and each other.

  This was not a weaker faith than the kind that demands empirical proof. In many ways, it was stronger. Because a hypothesis can be discarded when the evidence gets difficult. But a picture that regulates your whole life? That is something you carry through the dark.

  I saw her carry it. I saw it in the patience she showed with struggling students, whom she treated as souls to be nurtured rather than minds to be filled. I saw it in the quiet way she cared for her neighbors when they were sick, not because it was efficient, but because it was required by the "grammar" of her life. I saw it in the way she sat with her husband during his illness, holding a vigil that was not about changing the outcome, but about honoring the sacredness of the person before her.

  To her philosophy colleagues here: Helen's life was the proof of her philosophy. She did not argue for faith; she inhabited it.
  To her family and church family here: Helen's faith was intellectual, but it was never cold. It was the anchor that held her steady when the world tried to drift.

  She taught us that the truth of a belief is found in how it is used, in the life it produces. And the life Helen produced was one of immense integrity, deep compassion, and unwavering love.

  We cannot say we know where she is now. To claim that would be to treat her faith as a map of territory she has traveled, which is not what she taught us. But we can say this: The picture she held up against the world is still here. It is here in the work she left behind. It is here in the kindness she showed us. And it is here in this room, in the way we gather to honor the sanctity of a life well-lived.

  Helen believed that to speak of God was to commit to a certain way of being human. In that commitment, she found peace. And in remembering her, we are invited to ask ourselves: What picture are we holding up? What weight are we giving to our days?

  Helen, thank you for showing us that a life regulated by love is a life that does not end when the breathing stops. It ends only when the love is forgotten. And I promise you, on behalf of all of us here, that we will not forget.

  Rest in the peace you sought so diligently, and so honestly. Amen.
