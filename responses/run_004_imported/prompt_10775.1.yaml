      *   Verify the specific names (Soares, Hadfield-Menell, etc.) are contextually appropriate or implied (the prompt says "defends the view descending from...", so they might not need to name-drop constantly, but the ideas must be clear). I will include the names to ground the lore.

  6.  **Writing the Dialogue:** (Mental Sandbox)
