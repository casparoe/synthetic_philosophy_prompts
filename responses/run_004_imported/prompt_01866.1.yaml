answer: |-
  This is a fantastic find. You have stumbled onto one of the most fascinating "what ifs" in the history of philosophy. Bentham's *Offences Against One's Self* is indeed decades ahead of its time, and your reading of the terminology is correct: he is using "paederasty" in the classical sense of male-male intercourse, and he is applying the utilitarian calculus to argue that without demonstrable harm, there is no justification for punishment.

  The syntax is dense because Bentham is trying to be surgically precise while dismantling centuries of moral tradition. Let's break this down sentence by sentence, and then tackle your specific questions about "philosophical pride" and the logical test he's proposing.

  ### Sentence-by-Sentence Breakdown

  **1. "Philosophical pride, to say nothing at present of superstition, has hitherto employed itself with effect in setting people a-quarrelling with whatever is pleasurable even to themselves, and envy will always be disposing them to quarrel with what appears to be pleasurable to others."**

  *   **Translation:** There are two main reasons people hate pleasure. First, "superstition" (which he means religion/divine law—he's setting that aside for this specific paragraph). Second, "philosophical pride." This pride makes people feel superior if they deny themselves pleasure. Additionally, simple "envy" makes people angry when they see *others* enjoying something.
  *   **The Point:** He is categorizing the motives of his opponents. He is saying, "Ignore religion for a moment. Even secular moralists hate pleasure because it makes them feel virtuous to deny it, or because they are jealous."

  **2. "In the notions of a certain class of moralists we ought, not for any reason they are disposed to give for it, but merely because we ought, to set ourselves against every thing that recommends itself to us under the form of pleasure."**

  *   **Translation:** There is a group of moralists who argue that we must fight against pleasure simply because it is "the rule," not because they can provide a logical reason why.
  *   **The Point:** This is a critique of **deontological** ethics (duty-based) or **asceticism**. Bentham is pointing out that their argument is circular: "It is wrong because it is wrong." They offer no consequence-based reason (like "it causes harm"); they just assert a duty to avoid pleasure.

  **3. "Objects, it is true, the nature of which it is to afford us the highest pleasures we are susceptible of are apt in certain circumstances to occasion us still greater pains."**

  *   **Translation:** Bentham makes a concession. He admits that some things which give great pleasure *can* sometimes lead to even greater pain (e.g., gluttony leads to sickness, dangerous risks lead to injury).
  *   **The Point:** He is being fair. He isn't saying pleasure *never* causes pain. He is acknowledging the utilitarian caveat: we must weigh the risk of future pain against current pleasure.

  **4. "But that is not the grievance: for if it were, the censure which is bestowed on the use of any such object would be proportioned to the probability that could be shewn in each case of its producing such greater pains."**

  *   **Translation:** However, that risk of pain is not the *real* reason moralists are angry. If it were, their criticism (censure) would match the actual statistical risk of harm.
  *   **The Point:** **This is the logical test you asked about.** Bentham is saying: "If you claim you are punishing this act because it is dangerous, show me the math. If the danger is low, your punishment should be low. If the danger is unproven, your punishment should be zero."

  **5. "But that is not the case: it is not the pain that angers them but the pleasure."**

  *   **Translation:** Since moralists punish these acts severely even when the "pain" (harm) is non-existent or unproven, their anger must be directed at the *pleasure* itself, not the consequences.
  *   **The Point:** The conclusion. The motivation is **anti-hedonism** (hatred of pleasure), not **harm prevention**.

  ---

  ### Addressing Your Specific Questions

  #### 1. Is the "proportionality" bit a logical test or a rhetorical dig?

  It is absolutely a **genuine logical test**, and it is the core of his utilitarian argument.

  In Bentham's framework, the only legitimate reason to restrict liberty or punish an action is to prevent greater pain (harm). This is the "harm principle" avant la lettre (before Mill famously codified it).

  Bentham is challenging his opponents to play by utilitarian rules, even if they aren't utilitarians. He is saying:
  *   **Premise A:** You claim you punish this act because it is "bad."
  *   **Premise B:** In a rational system, "bad" means "causes net pain."
  *   **Test:** Therefore, the severity of your punishment must match the severity/probability of the pain.
  *   **Observation:** The punishment for homosexuality (death, imprisonment, pillory) is extreme.
  *   **Observation:** The proven pain/harm caused by consensual homosexuality is non-existent (in Bentham's view).
  *   **Conclusion:** Since the Punishment $\neq$ Harm, the justification cannot be Harm. It must be something else (hatred of pleasure).

  It's not just a dig; it's a trap. He forces them to either prove the harm (which they can't) or admit they are punishing people simply for enjoying themselves (which makes them look irrational and cruel).

  #### 2. What does "Philosophical Pride" mean here? Is it different from "Superstition"?

  Yes, Bentham is drawing a sharp distinction between the two, and it's crucial for his strategy.

  *   **Superstition:** This refers to **Religious Dogma**. In the 1780s, the primary argument against homosexuality was "It is a sin against God/Nature." Bentham calls this "superstition" because, as an empiricist, he believes religious claims about divine will cannot be proven by evidence. He sets this aside ("to say nothing at present of superstition") because you can't use logic to debate a claim based on faith.
  *   **Philosophical Pride:** This refers to **Secular Asceticism**. This is the idea found in some strands of Stoicism, Kantianism, or general virtue ethics that says *self-denial* is inherently virtuous. It is the pride of feeling morally superior because you have conquered your appetites.

  **Why the distinction matters:**
  If Bentham only attacked "superstition," religious people could just say, "You don't understand faith." But by attacking "philosophical pride," he is attacking the **secular moralists** who think they are being rational. He is arguing that even without religion, people are irrational about pleasure. They feel *proud* of being miserable or denying themselves, and they resent others who are happy.

  He is essentially saying: "Even if we remove God from the equation, you still hate gay sex. Why? Not because it hurts anyone, but because you are proud of your own self-denial and envious of others' pleasure."

  #### 3. What is the specific argumentative move he is pulling off?

  The move is **Exposing the Ascetic Principle.**

  Bentham knows that Utilitarianism (maximize pleasure) and Asceticism (minimize pleasure) are opposite principles. Most moralists of his time were covert ascetics. They wouldn't admit "I hate pleasure," so they would disguise it as "I hate *sin*" or "I hate *vice*."

  Bentham's move in this paragraph is to **strip away the disguise.**

  1.  He isolates the motive.
  2.  He removes the religious excuse (superstition).
  3.  He removes the harm excuse (by showing the punishment doesn't fit the risk).
  4.  He leaves them with only one remaining motive: **Envy and Pride.**

  He is trying to shame the moralists. By framing their opposition as "envy" and "pride," he is psychologizing their moral stance. He is turning a moral argument ("This is sinful") into a psychological diagnosis ("You are just jealous and arrogant").

  ### Summary of the "Rabbit Hole"

  You are looking at a moment where Bentham realizes that the law isn't protecting anyone from harm; it is enforcing a specific emotional relationship to pleasure.

  When he writes, *"it is not the pain that angers them but the pleasure,"* he is summing up the entire conflict between Liberal Utilitarianism and Traditional Morality. He is arguing that the law should be a calculator of harm, not a guardian of moral purity. Since the "calculator" shows zero net pain in private consensual acts, the "guardians" are revealed to be motivated purely by a desire to suppress joy.

  It is a incredibly bold move for the 1780s, which explains precisely why he locked it in a drawer and never published it. He knew the "philosophical pride" of his contemporaries was too strong to accept the logic.
