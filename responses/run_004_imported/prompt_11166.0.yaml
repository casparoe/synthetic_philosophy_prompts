answer: |-
  This is a magnificent premise for a novel. You have identified the precise nerve centre of late-Victorian moral philosophy. Sidgwick's *The Methods of Ethics* (1874, with subsequent editions through the 1880s) is indeed the text that haunts this period, and the passage you cite (from Book IV, Chapter V) is the moment where the mask slips. It is the point where the calm, analytical utilitarian confronts the terrifying social consequences of his own logic.

  To answer your three questions: your intuition about the "stacking" of claims is correct, the motivation is more about competence than demandingness, and the tension with impartiality is real but technically resolvable within the system—though at a great psychological cost to the philosopher.

  Here is a map of the argument to help you calibrate your professor's public and private voices.

  ### 1. Disentangling the Claims: The Three Layers of Secrecy

  You are right to detect distinct claims here. Sidgwick is not sliding between arguments; he is building a recursive defence mechanism. For your professor, these represent three concentric circles of silence.

  *   **Layer One (The Act):** *Specific actions may be right in secret that are wrong in public.*
      *   **The Claim:** There are situations where breaking a Common-Sense rule (like truth-telling) produces better consequences, provided no one knows you broke it.
      *   **The Logic:** If the bad consequences of an act stem primarily from the *example* it sets (e.g., if I lie openly, others lose trust in language), then doing it secretly removes the bad consequence while keeping the benefit.
      *   **For the Professor:** This is the "casuistry" layer. He might defend this cautiously at High Table in abstract terms (e.g., "Are there not cases where a physician must conceal a diagnosis?").

  *   **Layer Two (The Principle):** *The justification for Layer One must itself be concealed.*
      *   **The Claim:** We cannot teach people that "secrecy makes right." If we do, people will hide their *selfish* crimes by claiming they are utilitarian secrets.
      *   **The Logic:** To maintain social order, the "plain man" must believe that secrecy does *not* wash away guilt. Therefore, the utilitarian must publicly agree with the plain man that "an action which would be bad if done openly is not rendered good by secrecy," even while privately knowing this is theoretically false.
      *   **For the Professor:** This is the first truly haunted layer. This requires him to stand in a college combination room and affirm a moral principle he knows to be theoretically incomplete. It is a sanctioned lie about the nature of lying.

  *   **Layer Three (The System):** *The Utilitarian system itself may need to be withheld from the "vulgar."*
      *   **The Claim:** It may be best if ordinary people never hear of Utilitarianism at all. They should stick to "Common-Sense Morality" (CSM).
      *   **The Logic:** Utilitarianism requires complex calculations. Ordinary people ("the vulgar") lack the intellect, time, or impartiality to calculate correctly. If they try, they will rationalize selfishness as "general good," causing net harm.
      *   **For the Professor:** This is the aristocratic layer. It casts the utilitarian philosopher not as a reformer enlightening the world, but as a guardian hoarding a dangerous truth. This is the stuff for the locked diary, not the public lecture.

  **Do they stand or fall together?**
  Logically, they stand together. If Layer Three is rejected (i.e., everyone should be taught Utilitarianism), Layer Two becomes impossible to maintain. Sidgwick presents them as a cumulative package: the more complex the calculation, the more restricted the audience should be.

  ### 2. The Motivation: Competence vs. Demandingness

  You asked whether this is about "over-demandingness" (the theory asks too much sacrifice) or "competence" (the theory is too hard to use).

  **It is primarily about competence and social stability.**

  While modern critics often attack utilitarianism for being too demanding (e.g., "give away all your money until you are as poor as those you help"), Sidgwick's worry in this passage is epistemic and sociological. Look at his phrasing: *"the inevitable indefiniteness and complexity of its calculations render it likely to lead to bad results in their hands."*

  Sidgwick respects "Common-Sense Morality" (the rules of thumb society already uses: keep promises, tell truth, obey laws). He views these rules as evolved heuristics that generally produce good outcomes. He fears that if you hand a utilitarian calculus to an untrained mind, they will not become *more* benevolent; they will become *better rationalizers*. They will find a way to calculate that their own self-interest coincides with the general good.

  **For your novel:**
  *   **The "Demandingness" reading** would make your professor feel guilty about his own comfort (why am I not giving my salary to the poor?).
  *   **The "Competence" reading** (which is more Sidgwickian) makes him feel fearful of the *public*. He views the masses as morally clumsy children who might break society if given the sharp knife of utilitarian reasoning. This creates a different kind of haughtiness and isolation. He isn't withholding the truth to protect his wallet; he is withholding it to protect *them* from themselves. This is a more paternalistic, Victorian anxiety.

  ### 3. The Tension with Impartial Benevolence

  This is the crux of your professor's haunting. You ask: *Does counselling that most people be kept from the full theory sit unease with the very impartiality the theory is supposed to enshrine?*

  **The Logical Answer:** No.
  **The Psychological Answer:** Yes, profoundly.

  **Logically:** Utilitarianism is consequentialist. It does not value "knowledge" or "transparency" as intrinsic goods. It values *happiness*. If withholding the truth from the "vulgar" produces more happiness than telling them the truth, then impartial benevolence *demands* deception. The impartiality applies to the *outcome*, not to the distribution of philosophical education. Sidgwick is consistent here: he is sacrificing the intellectual autonomy of the many for the physical and social welfare of the many.

  **Psychologically:** This creates a fracture in the moral agent. Sidgwick himself was deeply troubled by this. It implies a division of humanity into the "Enlightened Few" (who can bear the truth) and the "Vulgar" (who need the noble lie). This sits very uncomfortably with the liberal, democratic instincts of the 19th century (and our own).

  For your professor, this generates a specific kind of guilt: **The Guilt of the Guardian.**
  *   He believes in the rational equality of men (a Cambridge liberal).
  *   But his theory tells him men are not rationally equal in moral calculation.
  *   Therefore, he must treat them as unequal to ensure their welfare.
  *   This makes him a "secret aristocrat" in a democratic age.

  ### Advice for the Character's Voice

  To capture the nuance of this passage in your novel, I suggest distinguishing sharply between what your professor argues in the **Combination Room** and what he writes in his **Notebook**.

  **In Public (High Table / Lectures):**
  He should defend **Common-Sense Morality**. He should argue that rules like "do not lie" and "keep promises" are robust and socially vital. He can admit that Utilitarianism is the *theoretical foundation*, but he should emphasize the *danger* of amateur calculation.
  *   *Sample sentiment:* "We must be wary of inviting the novice to calculate the welfare of nations. The rules of common decency are the guardrails of civilization; to dismantle them in the name of a higher good is to invite chaos. Let us adhere to the established codes, for they are the distilled wisdom of ages."
  *   *Why:* This aligns with Sidgwick's public persona. It is safe, defensible, and technically utilitarian (because preserving social order is useful).

  **In Private (The Notebook):**
  Here, he should grapple with the **Loneliness of the Enlightened**. This is where the "esoteric" passage lives. He should express the fear that Truth and Good are not identical.
  *   *Sample sentiment:* "I am compelled to teach what I do not fully believe, and to conceal what I know to be true. If I told the truth, they would misuse it and suffer. If I let them suffer by my honesty, I am no utilitarian. So I must lie to save them. But who saves me from the lie? I am become a priest of a god I dare not name."
  *   *Why:* This captures the "haunted" quality. It reflects the Layer Two and Layer Three secrecy. It shows the cost of the "esoteric morality."

  ### A Historical Note for Texture
  Sidgwick himself was indeed haunted by this. He famously kept his religious doubts and his more radical ethical conclusions somewhat private during his lifetime. He also became deeply involved in Psychical Research (the Society for Psychical Research) later in life, partly in the hope of finding empirical evidence for an afterlife where moral justice was enforced—essentially looking for a cosmic sanction that Utilitarianism lacked.

  If your professor is "faintly haunted," you might give him a similar secret obsession. Perhaps he is quietly investigating something (spiritualism, poverty in the slums, a specific scandal) that tests the limits of his "esoteric" rules. The passage you cited is the theoretical justification for a life lived in two keys: the public major of social duty, and the private minor of utilitarian calculation.

  **Summary for your drafting:**
  1.  **Structure:** It is a three-tiered retreat (Act, Principle, System).
  2.  **Motivation:** It is fear of incompetence/social collapse, not just fear of sacrifice.
  3.  **Tension:** It is logically consistent but psychologically corrosive. It turns the utilitarian into a benevolent manipulator.

  Your professor knows that to be a good Utilitarian, he must be a bad Democrat. That is the tragedy you have found. Stick with it.
