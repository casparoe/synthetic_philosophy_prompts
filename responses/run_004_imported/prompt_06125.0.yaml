answer: |-
  This is a fantastic tension point for a novel. It cuts right to the heart of metaphysics without requiring explosions or car chases.

  Here is the short answer: **On the specific question of identity across worlds, your Leibnizian character would side with David Lewis (Counterpart Theory), not Kripke/Plantinga (Transworld Identity).**

  However, if he agrees with Lewis too easily, he becomes a strawman. The drama comes from *why* he agrees with Lewis, which is radically different from *why* Lewis agrees with Lewis.

  Here is the breakdown of his metaphysics, the textual evidence, and how to stage the debate so he sounds like a 17th-century rationalist, not a 20th-century analytic philosopher in a wig.

  ### 1. The Core Metaphysical Obstacle: The Complete Concept
  To understand why Leibniz rejects Transworld Identity (TWI), you have to grasp his notion of **Individual Substance**.

  For Kripke, "Adam" is a rigid designator. It points to a specific entity (a "bare particular" or a cluster of essential properties), and we can imagine that entity having different accidental properties (like not eating the apple).

  For Leibniz, there is no "bare particular." You are not a hook upon which properties hang. **You are your properties.** Specifically, your "Complete Concept" contains every single predicate true of you: past, present, future, necessary, and contingent.
  *   **The Logic:** If "sinned in Eden" is part of Adam's complete concept, then a being who does *not* sin in Eden has a *different* complete concept.
  *   **The Conclusion:** If the concept is different, the substance is different. Therefore, the "Adam" who doesn't sin is numerically distinct from the "Adam" who does.

  **For the Novel:** Your character should scoff at the idea that you can strip properties away from a person and still have the "same" person. To him, Kripke's view sounds like magic or mysticism—positing a ghostly "self" that exists independently of its actions.

  ### 2. The Smoking Gun: The Letters to Arnauld
  You mentioned this, but it's worth drilling into. In 1686, Leibniz wrote to Antoine Arnauld to explain his *Discourse on Metaphysics*. Arnauld was horrified by the implication that if Adam sinned, he *had* to sin (determinism).

  Leibniz's response is the key to your character's stance. He essentially says:
  > "The individual notion of Adam... includes once and for all what will happen to him... So there is a connection between Adam and this event."

  When pressed on whether God could have created an Adam who didn't sin, Leibniz clarifies: **That would not be *our* Adam.** It would be a different possible individual who *resembles* our Adam.

  **Dialogue Hook:**
  > **Logician:** "Surely God could have actualized a world where Adam refrains from the fruit. It's the same man, just a different choice."
  > **Leibnizian:** "You speak of 'Adam' as if he were a vessel into which you might pour different histories. But Adam *is* his history. To remove the Fall is to unravel the concept. You do not speak of Adam; you speak of a phantom resemblance."

  ### 3. Why He Isn't a Perfect Lewisian (The Ontological Clash)
  This is where you avoid the strawman. David Lewis is a **Modal Realist**. He believes possible worlds are concrete, physical places just as real as ours, spatiotemporally isolated.

  Leibniz is an **Idealist**. For him, possible worlds do not exist concretely. They exist as **ideas in the mind of God**.
  *   **Lewis:** "There is a real guy in a real parallel universe who is your counterpart."
  *   **Leibniz:** "There is a concept in the Divine Intellect that is compossible with a non-sinning history, which resembles the concept of Adam."

  Your character should find Lewis's concrete realism absurd (perhaps even atheistic, since it removes God's choice). He agrees with Lewis that *identity* doesn't cross worlds, but he thinks Lewis is mad to think those other worlds are *real places*.

  **Dialogue Hook:**
  > **Leibnizian:** "You treat possibilities as if they were continents waiting to be sailed to. They are not places, sir. They are thoughts. And in the calculus of God's mind, the 'Adam' of the non-sinning hypothesis is a distinct variable entirely."

  ### 4. The Principle of the Identity of Indiscernibles (PII)
  This is Leibniz's nuclear weapon against Kripke. PII states that no two distinct substances can have all the same properties.
  *   **Kripke:** Allows that two worlds could contain the "same" object with different properties.
  *   **Leibniz:** If Object A (in World 1) sins and Object B (in World 2) doesn't, they have different properties. Therefore, by PII, they are not the same object.

  For Leibniz, **haecceity** ("thismess") is not a primitive tag (as it is for Scotus or Plantinga). "Thismess" is derived from the totality of the concept.

  ### 5. How to Stage the Debate
  To make this dramatic, focus on the emotional/existential stakes.
  *   **The Modern Logician (Kripkean):** Wants to preserve moral responsibility and freedom. "If it wasn't *really* Adam who could have done otherwise, then Adam wasn't free."
  *   **The Leibnizian:** Wants to preserve logical consistency and the perfection of God. "If Adam could have done otherwise, then God's knowledge was imperfect, or the concept of Adam was contradictory."

  **The Twist:** The Leibnizian character actually finds *comfort* in Counterpart Theory, while the Modern Logician finds it terrifying.
  *   **Logician:** "So you're saying I have counterparts dying in other worlds while I live here? That's monstrous."
  > **Leibnizian:** "No. I am saying *you* are exactly who you are, perfectly and necessarily. There is no 'other you' lingering in the shadows. There is only the concept that God selected for existence. The others remain in the realm of pure thought, where they do not suffer."

  ### 6. Key Terminology for Your Character
  To make him sound authentic, have him use these terms correctly:
  *   **Compossibility:** "That version of you is not *compossible* with this universe's history."
  *   **The Principle of Sufficient Reason:** "There must be a reason why this Adam exists and the other does not. The reason lies in the concept."
  *   **Inesse Principle:** (The subject contains the predicate). "The predicate 'sinner' is *in* the subject 'Adam'. You cannot separate them without destroying the subject."
  *   **Mirroring:** "Every substance mirrors the whole universe. If the universe changes (no Fall), the mirror must change. If the mirror changes, it is a different mirror."

  ### Summary for the Draft
  1.  **Identity:** He rejects Transworld Identity. He believes "Adam" in another world is a different possible substance (Counterpart Theory).
  2.  **Reason:** The Complete Concept contains all predicates. Change the predicates, you change the individual.
  3.  **Ontology:** He rejects Lewis's concrete worlds. Possible worlds are ideas in God's mind.
  4.  **Tone:** He should view the Kripkean view as "nominalist" (thinking names matter more than concepts) and the Lewisian view as "materialist" (thinking ideas are physical places).

  This position makes him a hard determinist regarding *identity*, which creates great friction with a modern logician who likely wants to preserve some notion of "could have done otherwise" for the *same* agent.
