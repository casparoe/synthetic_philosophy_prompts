      *   *User's specific worry:* "Why is Relation R still treated as a serious candidate... rather than being abandoned in favor of a straightforwardly physical criterion?"
      *   *Answer:* Because Physicalism fails to capture our prudential concerns in *other* cases (like brain transplants). Relation R captures the *value* of survival even if it doesn't capture the *metaphysics of identity*.
