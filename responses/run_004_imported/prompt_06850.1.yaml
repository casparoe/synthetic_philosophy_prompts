      *   *Critical Insight:* The CPA is a *theoretical assumption*, not an empirical fact. In the real world, people *do* have different priors. Aumann's theorem shows what happens *if* the CPA holds. It doesn't provide a meta-algorithm for judging whose prior is "true" when they differ. Priors are often subjective or based on unshareable meta-evidence.
