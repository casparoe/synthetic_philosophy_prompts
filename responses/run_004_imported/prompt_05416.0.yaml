answer: |-
  First off, huge props for diving into Frege and Kripke for a subplot. That is serious dedication to craft.

  The short answer is: **Do not cut the reveal.** A philosopher would not say your protagonist's reaction is unjustified. In fact, Kripke's work specifically leaves room for the exact psychological shock your protagonist is feeling.

  Here is the breakdown of why your philosophical worry is a false alarm, and how you can actually use this to strengthen the scene.

  ### 1. You are confusing Metaphysics with Epistemology
  The user's concern rests on the idea that if "Nadia = Milo" is a necessary truth (which Kripke argues it is, once the reference is fixed), then discovering it shouldn't feel like a discovery.

  But Kripke makes a crucial distinction: **Necessary vs. A Priori.**
  *   **Metaphysically:** Once we know Nadia and Milo are the same person, it is *necessarily* true. They couldn't be different people in any other possible world.
  *   **Epistemically:** It is **not** *a priori*. You cannot figure it out just by thinking about the names. You need empirical evidence.

  Discovering an *a posteriori necessary truth* is still a genuine discovery. When astronomers discovered Hesperus was Phosphorus, it was a massive scientific breakthrough. It didn't stop being a breakthrough just because, retroactively, the statement is necessarily true.

  For your protagonist, living through those two years, the truth was hidden. The "gut-punch" is the collapse of her epistemic world, not a semantic error.

  ### 2. Kripke's "Puzzle about Belief"
  You mentioned Kripke "closed the case" on Frege's puzzle. He did, sort of, but he later wrote a famous paper called *"A Puzzle About Belief"* (1979) that is basically **your subplot.**

  Kripke asks: How can a rational person believe "Nadia is kind" and "Milo is cruel" without being irrational, even if Nadia is Milo?
  His conclusion is that we organize our beliefs into "files" or "notions." Your protagonist has a **Nadia File** and a **Milo File**.
  *   In the Nadia File, she stores vulnerability, advice, and trust.
  *   In the Milo File, she stores flirtation, distance, or whatever other dynamic they had.

  When the reveal happens, she isn't just learning a semantic fact; she is being forced to **merge two distinct cognitive files.** That is a psychologically violent process. She has to re-evaluate every letter she ever wrote. *"When I told Nadia my secret, was Milo laughing at me?"*

  Kripke acknowledges that rational agents can hold contradictory beliefs about the same object under different names. So, a philosopher would say her confusion is perfectly rational.

  ### 3. The "Sense" is in the Head, not the Name
  Frege argued names have a "Sense" (*Sinn*) that determines their reference. Kripke argued names are "Rigid Designators" that point directly to the object without a middleman description.

  However, even if the *name* doesn't have a sense, the **speaker** definitely associates descriptions with the name.
  *   To your protagonist, "Nadia" *means* "The person who comforted me in Year 1."
  *   "Milo" *means* "The person who challenged me in Year 2."

  Even if Kripke is right and those descriptions don't semantically fix the reference, they **psychologically fix the relationship.** The betrayal isn't that the names refer to the same guy; it's that the *modes of presentation* were manipulated. The antagonist weaponized the gap between reference and conception.

  ### 4. How to Write It (Philosophically Enhanced)
  If you want to lean into the philosophy without bogging down the drama, you can actually use Kripke to make the antagonist more chilling.

  Imagine the antagonist trying to defend themselves using Kripkean logic:
  > **Antagonist:** "It doesn't matter. I was always me. Nadia, Milo, it's all the same person. You're upset about a label."
  >
  > **Protagonist:** "No. I didn't fall in love with a 'rigid designator.' I fell in love with the way you listened as Nadia. I trusted the way you thought as Milo. You didn't just change your name; you changed the world I was living in."

  This highlights the conflict between **semantic truth** (they are the same body) and **psychological truth** (they were two different characters in her life).

  ### Verdict
  **Keep the gut-punch.**
  *   **Philosophically:** Kripke agrees that discovering identity statements is a genuine, non-trivial empirical discovery (*a posteriori*).
  *   **Psychologically:** Merging two distinct "belief files" is a recognized cognitive shock.
  *   **Dramatically:** The tension comes from the deception, not the semantics.

  The only time a philosopher would call her reaction "unjustified" is if she claimed the *laws of physics* changed. But she's reacting to a lie about human identity. That is always valid ground for drama.

  **Go write the reveal.** It's a great hook.
