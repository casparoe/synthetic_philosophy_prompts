prompt: |-
  I run a small history-of-science podcast, and next week's guest just published a book defending Otto Neurath's Isotype project (the 'picture language' system he built in Red Vienna) as basically still the best philosophy of information design we've got. Draft 8-10 interview questions that go beyond her just restating how Isotype works. I want at least one question on whether the "repeat identical icons instead of resizing one big icon" rule survives contact with huge or continuous quantities, one on the claim that Isotype pictograms are self-explanatory across languages and literacy levels even though reading any picture at all requires learned convention, and one on the tension between Isotype's goal of manipulation-free public education and the interpretive power of whoever decides how messy data gets turned into icons in the first place (Neurath actually had a special term for that role -- the "transformer"). For each, add a follow-up question keyed to whatever reply shes most likely to give.
