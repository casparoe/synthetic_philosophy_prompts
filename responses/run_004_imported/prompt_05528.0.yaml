answer: |-
  The silence of the Null Sector wasn't empty; it was heavy. It pressed against the hull of the surveyor *Veritas* like deep water.

  Commander Kael stood on the bridge, staring at the main display. On the screen, hanging in the absolute black, was the *Veritas*.

  It wasn't a reflection. The sensors confirmed it was three thousand kilometers off the port bow. It had the same hull scarring from the micrometeoroid storm in the Orion Belt. It broadcast the same encryption key. It even emitted the same unique thermal signature from its warp core, down to the quantum fluctuation noise.

  "It's mimicking us," Kael said, his hand hovering over the tactical console. "Cloaking tech that projects a hard-light decoy."

  Science Officer Venn didn't look up from her datapad. She looked tired. "I've run the spectral analysis six times, Commander. It's not a projection. The photon count matches a physical object. It's not a decoy. It's us."

  "Don't be absurd. If that's us, then we're sitting in two places at once."

  "Or," Venn said, finally looking up, "we're sitting in one place, and the space between us is lying."

  Kael turned to her. "Explain."

  "Black's Spheres," Venn said. "Metaphysics 101. Imagine a universe with two identical spheres. No reference points. No background. Max Black argued they are two distinct objects, even if they share every property. He said identity isn't just a bundle of properties; there's a 'thisness' to each."

  "And you think that applies here?"

  "I think Black was wrong," Venn said, tapping her screen. A wireframe model of the sector appeared. It wasn't a flat grid; it curved inward, like a cylinder. "Ian Hacking tore that argument apart. He said Black was cheating. He assumed the space the spheres sat in was ordinary, Euclidean space. But if the space itself loops—if it's cylindrical—then you don't have two spheres. You have one sphere, and you're just seeing it wrap around the universe."

  Kael frowned. "You're saying this is a topological trick? That the 'other' *Veritas* is just our own stern, viewed through a fold in space?"

  "I'm saying the distance is a property of the space, not the ships," Venn corrected. "If space is closed, 'three thousand kilometers' is just the length of the loop. There is no second ship. There is only one *Veritas*, and we are looking at our own exhaust."

  Kael looked back at the screen. The other *Veritas* hung there. On the other ship, he could see the silhouette of a figure on the bridge. He raised his hand. The figure raised its hand. Simultaneously.

  "If it's a loop," Kael said slowly, "why is there a delay? I moved, and it moved instantly."

  "Light speed is finite, but the loop is short. The delay is milliseconds. Human perception can't catch it."

  Kael's heart rate was climbing. This wasn't just philosophy. This was a hazard assessment. "If there are two ships, we need to establish comms and avoid collision. If there is one ship... what happens if we fire thrusters?"

  "If we fire forward," Venn said, her voice tight, "and space loops, our exhaust travels around the universe and hits our own intake from behind. It creates a feedback loop. The core overloads. We die."

  "And if there are two ships?"

  "Then we drift apart. Safe."

  The silence stretched. On the screen, the other *Veritas* drifted closer. The relative velocity was zero, but the visual expansion suggested they were converging.

  "Sensors can't tell the difference?" Kael asked.

  "No," Venn said. "That's the bind. Every empirical test yields the same result for 'Two Ships in Flat Space' as it does for 'One Ship in Curved Space.' The data is identical. The math is identical. The only difference is how we count the objects."

  Kael gripped the console. "I can't navigate based on a metaphysical hunch, Venn. If I treat it as one ship and I'm wrong, we collide. If I treat it as two and I'm wrong, we cook ourselves."

  "We have to choose," Venn said. "Black or Hacking. Distinct entities or a redescription of space."

  Kael watched the other ship. It felt wrong. It felt like looking in a mirror that had depth. He thought about the crew. He thought about the protocol. Protocol demanded distinct targets. Protocol demanded survival.

  "If it's a mirror," Kael said, "then we're trapped in a hall of mirrors. If it's a twin, we're in a fleet."

  "We're alone in the Null Sector, Commander. There is no fleet."

  "Then someone built a copy." Kael's finger moved to the weapon systems. "I'm not going to wait for it to fire first."

  "Commander, no!" Venn stepped forward. "If you fire a missile, and it's a loop, the missile comes back at us."

  "If it's a copy, the missile destroys the threat."

  "It's not a threat! It's us!"

  "It has my face, Venn. It has my codes. If it's us, why isn't it hailing? Why is it just... drifting?" Kael's voice hardened. "I'm not betting the ship on the shape of the universe. I'm betting on the Principle of Identity. Two things cannot occupy the same space. That thing is occupying space separate from us. Therefore, it is not us."

  "That's exactly what Black assumed!" Venn shouted. "You're assuming space prevents overlap! But if the space curves, it's not overlap, it's continuity!"

  "Lock weapons," Kael ordered. "Target the bridge of the contact."

  "Commander, I'm logging a formal protest. This is suicide if Hacking is right."

  "Fire."

  The *Veritas* shuddered. A kinetic lance shot from the forward tubes, a streak of blue plasma screaming into the void.

  Kael watched the screen. The missile streaked toward the other *Veritas*.

  On the screen, the other *Veritas* fired a missile.

  The two missiles met in the middle.

  No.

  Kael leaned in. The missiles didn't collide. They passed through each other. Or rather, they didn't pass through. The image on the screen flickered. The missile he fired vanished.

  "Where did it go?" Kael demanded.

  "Telemetry is lost," Venn whispered. She was staring at the rear sensors. "Commander... rear sensors are picking up a high-velocity approach."

  "Another ship?"

  "No." Venn's face was pale. "It's our missile."

  "That's impossible. It fired forward."

  "Space is closed, Kael. It went forward, traveled the circumference of the sector, and came up behind us."

  The alarm blared. *IMPACT IMMINENT.*

  "Evade!" Kael screamed.

  "We can't!" Venn yelled over the siren. "If we move, the exhaust hits us! We have to take it!"

  The bridge shook violently. The impact wasn't a collision of hulls; it was a shockwave through the local field. The lights died, replaced by the crimson glow of emergency power. The hum of the engine stuttered, coughed, and then settled into a low, pained whine.

  They were still alive.

  Kael gripped the armrests of his chair, breathing hard. "Status."

  "Hull integrity at eighty percent," Venn said, her voice shaking. "Core is stable. But... Commander. Look at the main screen."

  Kael looked.

  The other *Veritas* was gone.

  The void was empty. Just the stars, and the curved distortion of the sector's boundary.

  "It didn't disappear," Venn said softly. "We just... stopped seeing it."

  "Because we moved?"

  "Because the symmetry broke," Venn said. She turned to him, her eyes wide with a terrible realization. "When we fired, we introduced an asymmetry. A vector. In a perfectly symmetric universe, you can't tell one side from the other. You count two. But once you act, once you introduce a direction, the loop resolves. The 'other' ship wasn't a ship, Kael. It was the potential of where we would be if we went straight."

  Kael stared at the empty screen. "So there was never another ship."

  "No," Venn said. "There was only one *Veritas*. But to navigate, you had to believe there were two. You had to treat the space as if it were flat to make a decision."

  "I killed us," Kael said. "I fired on myself."

  "You fired on the geometry," Venn corrected. "And the geometry fired back."

  She pulled up the navigation map. The sector was no longer a cylinder on her display. It was a single point.

  "Black thought the spheres were distinct because he couldn't imagine a way to tell them apart," Venn said, her voice quiet in the darkened bridge. "He thought 'two' was a fact about the objects. Hacking knew 'two' is a fact about the map."

  Kael looked at his hands. They were trembling. "So what do we do now? If space loops, every direction leads back to us. We're trapped in a room with no walls."

  "We're not trapped," Venn said, turning back to her console, her fingers finding the keys in the red light. "We're just the only thing in the room. And now that we've broken the symmetry, the loop is open. We can leave."

  "How?"

  "By accepting there's no one else out there," Venn said. "Stop looking for the other ship, Commander. There's only us. And we have to drive."

  Kael sat back. The adrenaline was fading, leaving a cold, philosophical hollow in his chest. He had wanted a universe where things were distinct, where *self* and *other* were clear. He had wanted the comfort of Two. But the universe had given him One.

  "Set a course," Kael said. "Away from the... from the echo."

  "There is no echo," Venn said, engaging the thrusters. The ship moved forward, smooth and singular. "There's only the path."

  As the *Veritas* accelerated, the stars ahead didn't streak. They widened. The universe wasn't expanding; it was unfolding. Kael watched the navigation display. There was no second blip. There never had been.

  He realized then that the argument wasn't about what was out there. It was about whether you could bear to be alone in the dark. Black offered company, even if it was an illusion. Hacking offered the truth, which was a void that curved back on itself.

  "Course laid in," Venn said. "Just one ship, Commander."

  Kael nodded, staring into the black. "One ship."

  He waited for the relief of being unique. It didn't come. He only felt the weight of the loop, the knowledge that if he flew far enough, long enough, he would eventually catch up to his own wake.

  "Engage," he said.

  The *Veritas* moved into the dark, counting itself as one, hoping the universe would agree.
