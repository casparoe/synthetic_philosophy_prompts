answer: |-
  This is a wonderful question, and it cuts right to the heart of the tension between scientific practice and scientific philosophy. It is no surprise this came up in your discussion group; you have essentially recreated a debate that has been running through the philosophy of science since Thomas Kuhn and Karl Popper were corresponding in the 1960s.

  Given your background, I will skip the platitudes about how "science is always evolving" and get straight to the epistemological mechanics of your dilemma. You are asking where the line lies between **methodological skepticism** (a necessary filter) and **dogmatic protectionism** (a barrier to truth).

  Here is an outside take on where your reasoning holds up, where it risks falling apart, and how to distinguish the two.

  ### 1. The Case for Your Judgment (The Bayesian View)
  From a purely probabilistic standpoint, your decision was rational. In analytical chemistry, as in most sciences, we operate under a Bayesian framework, even if we don't write out the equations.

  *   **The Prior:** You have a "prior probability" that the established value is correct. This prior is built on a decade of consistent measurements by independent groups. It is very high.
  *   **The Likelihood:** You have a new measurement. Given the history of the field, the probability that any single new measurement contains an undetected systematic error is significantly higher than the probability that the entire previous decade of work is fundamentally flawed.
  *   **The Posterior:** When you update your belief based on the new paper, the scales still tip heavily toward "the new paper has an error."

  In this light, you weren't being dogmatic; you were being an efficient gatekeeper. If reviewers treated every outlier as a potential paradigm shift requiring full acceptance, the literature would be flooded with noise. This is what Thomas Kuhn called "Normal Science." Normal science is not about discovering new phenomena; it is about mopping up the details of the existing paradigm. Anomalies are expected, and usually, they *are* errors. Rejecting a paper because it fails to meet the burden of proof required to overturn a strong prior is standard operating procedure.

  ### 2. The Case for Your Postdoc (The Falsificationist View)
  Your postdoc's objection is rooted in a Popperian view of science. For a scientific claim to be meaningful, it must be falsifiable. If you establish a rule that says, "I will not accept evidence against the consensus unless you can explain *why* the consensus was wrong," you have arguably made the consensus unfalsifiable.

  This is where your reasoning gets dangerous. If the requirement for overturning a value is not just "better data" but also "an explanation of the old error," you create a catch-22. Sometimes, the new measurement is right, but we don't understand *why* the old measurements were wrong until years later.

  *   **Example:** In the early 20th century, measurements of the atomic weight of certain elements were inconsistent. If reviewers had demanded an explanation for the discrepancy before publishing the new values, progress would have stalled.
  *   **The "Pathological Science" Trap:** Conversely, consider "cold fusion" or N-rays. In those cases, skepticism was the correct posture. The community protected itself by demanding extraordinary evidence.

  Your postdoc is right that your reasoning *could* be used as a cheat to protect dogma. If the rule is applied universally ("I reject anything that disagrees with me"), it stops being science and starts being theology.

  ### 3. The Crucial Distinction: "Error Exists" vs. "Error Identified"
  You asked: *Is there an actual difference between "this evidence must be flawed because I already know the answer" and legitimate skepticism?*

  Yes. The difference lies in **what you demand of the authors.**

  *   **Dogmatism:** "This contradicts established value X. Therefore it is wrong. Reject." (This assumes infallibility of the consensus).
  *   **Legitimate Skepticism:** "This contradicts established value X, which is supported by robust data. Therefore, the burden of proof is on you to demonstrate why your methodology avoids the pitfalls that led to X. Please provide rigorous error analysis, blind validation, or inter-lab confirmation."

  If your review simply said "This contradicts known values, reject," your postdoc is correct. That is an appeal to authority.
  However, if your review said, "Given the consistency of previous data, a result this divergent suggests a systematic error. The manuscript does not adequately rule out [specific sources of error common in this technique]. I cannot recommend publication until the error budget is reconciled with the consensus," that is legitimate peer review.

  You do not need to identify the specific error to suspect one exists. But you must identify *where the burden of proof lies*. In your scenario, the burden lay with the authors to prove they weren't wrong, not with you to prove they were.

  ### 4. The Epistemology of "Knowing"
  This brings us to your philosophy group's core question: *What does it mean to "know"?*

  In analytical chemistry, "knowing" a value doesn't mean it is the Capital-T Truth. It means it is the **operational truth** with the highest confidence interval based on current methodology.

  When you said, "We already know the established value is right," you were speaking pragmatically. For the purposes of the field's current work, that value *is* right.
  When your postdoc said that reasoning prevents the number from ever being overturned, she was speaking epistemologically. She was reminding you that operational truth is not absolute truth.

  The danger you are sensing is **reification**. This happens when we treat our models (the established value) as if they are reality itself. If you treat the established value as Reality, then contradictory data must be an illusion. If you treat the established value as a Model, then contradictory data is a stress test of the model.

  ### 5. Verdict
  Were you exercising good judgment or being dogmatic?

  **You were likely exercising good judgment, but your justification was philosophically vulnerable.**

  In the early 90s, in analytical chemistry, a single paper contradicting a decade of consensus without a revolutionary new method was overwhelmingly likely to be incorrect. Your "System 1" intuition (to use Kahneman's term) was correct based on your experience. The rate of false positives in science is high; the rate of genuine paradigm shifts is low. Betting on the former is a good strategy for a reviewer.

  However, your postdoc has identified a systemic risk. If *every* reviewer acts as you did, science becomes conservative to the point of stagnation. The system relies on a balance:
  1.  **Gatekeepers (You):** Who ensure that noise doesn't drown out signal.
  2.  **Outliers (The Authors):** Who are willing to look foolish to pursue a discrepancy.

  The fact that you rejected the paper doesn't mean you killed the truth. If their result was real, they should have been able to refine their method, gather more evidence, and force the issue. A single paper rarely overturns a decade of work; it usually takes a campaign. By rejecting it, you didn't say "This is impossible"; you said "This is not yet persuasive."

  ### Conclusion
  You are not dogmatic for doubting the outlier. You are doing your job. The "cheat" only happens if you refuse to update your priors *even after* the evidence becomes overwhelming.

  The distinction you are looking for is this:
  *   **Dogmatism:** "I know the answer, so I don't need to look at your data."
  *   **Skepticism:** "I know the answer, so I will look at your data much more critically than I would if you agreed with me."

  If you read the paper and evaluated their error analysis before rejecting it, you were a skeptic. If you rejected it based on the abstract alone, you were a dogmatist.

  My guess? You read the paper. You looked for the flaw. You couldn't find a specific one, but the magnitude of the deviation triggered your expert intuition that *something* had to be missing. That isn't dogma; that's expertise. But keep listening to your postdoc. She is keeping your philosophical honesty in check, just as you kept the scientific literature in check.
