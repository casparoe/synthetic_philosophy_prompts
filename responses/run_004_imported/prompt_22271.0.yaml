prompt: |-
  so I'm doing a diss chapter on the moral basis of contract and my advisor made me actually sit down and read Hume's Treatise on promising instead of just citing the secondary lit on it, and now im stuck on a move he makes in Bk 3, Pt 2, Sect 5 ("Of the Obligation of Promises"). Here's the bit:

  "The act of the mind, exprest by a promise, is not a resolution to perform any thing: For that alone never imposes any obligation. Nor is it a desire of such a performance: For we may bind ourselves without such a desire, or even with an aversion, declar'd and avow'd. Neither is it the willing of that action, which we promise to perform: For a promise always regards some future time, and the will has an influence only on present actions. It follows, therefore, that since the act of the mind, which enters into a promise, and produces its obligation, is neither the resolving, desiring, nor willing any particular performance, it must necessarily be the willing of that obligation, which arises from the promise."

  ...then a little further down (skipping the bit in between):

  "All morality depends upon our sentiments; and when any action, or quality of the mind, pleases us after a certain manner, we say it is virtuous; and when the neglect, or non-performance of it, displeases us after a like manner, we say that we lie under an obligation to perform it. A change of the obligation supposes a change of the sentiment; and a creation of a new obligation supposes some new sentiment to arise. But 'tis certain we can naturally no more change our own sentiments, than the motions of the heavens; nor by a single act of our will, that is, by a promise, render any action agreeable or disagreeable, moral or immoral; which, without that act, wou'd have produc'd contrary impressions, or have been endow'd with different qualities. It wou'd be absurd, therefore, to will any new obligation, that is, any new sentiment of pain or pleasure; nor is it possible, that men cou'd naturally fall into so gross an absurdity."

  what's bugging me: in the first passage he eliminates every other candidate mental act until "willing the obligation itself" is the only one left, basically forced on us by process of elimination -- and then just a bit later he calls that exact thing a "gross absurdity" because sentiments (which is what obligation reduces to for him) aren't the kind of thing you can will into being. That seems like a weird thing for someone this careful to just wander into by accident. Is the whole two-step thing meant as a deliberate reductio -- nothing works, so promising isn't naturally intelligible, hence it has to be conventional -- or is he quietly switching senses of "obligation" between the two bits? And if it is the reductio, doesn't his own fix later in the section (convention manufactures the relevant sentiment through everyone's shared interest in the practice) need exactly the same "new sentiment out of nowhere" move he just called absurd? not looking for the standard "promises are an artificial virtue" answer, I already know that part, more trying to figure out if there's an actual gap here or if I'm missing a move.
