answer: |-
  You have hit on exactly the right pressure point. This is not a slip-up; it is the engine of the section. You are correctly identifying that Hume is running a *reductio ad absurdum* against the "natural law" conception of promising (think Pufendorf, Locke, or the rationalists), but your worry about whether his own solution escapes the same trap is the kind of critical move that makes for a strong dissertation chapter.

  Here is the breakdown of the logical architecture, the alleged "switch" in senses, and why the conventionalist solution doesn't (in Hume's view) commit the same absurdity.

  ### 1. The *Reductio* Structure
  You are right: the first passage sets up the target, and the second passage pulls the trigger.

  Hume is arguing against the view that there is a **natural** mental act that constitutes a promise. He forces the proponent of natural promising into a corner:
  1.  **Elimination:** It's not resolution, desire, or willing the action.
  2.  **Forced Move:** Therefore, if promising is a natural mental act, it *must* be "willing the obligation."
  3.  **The Kill:** But "willing the obligation" is metaphysically impossible under Hume's moral psychology.

  Why is it impossible? Because for Hume, "obligation" just *is* a specific sentiment (a pain of blame upon violation, a pleasure of approval upon performance). To say "I will this obligation" is to say "I will that I shall feel a specific pain/pleasure in the future simply because I will it now." As Hume says, we can no more change our sentiments by fiat than we can stop the motion of the heavens.

  So, to answer your first question: **Yes, it is a deliberate *reductio*.** He is demonstrating that the *concept* of a natural promise is incoherent. It requires a mental act that human psychology cannot perform.

  ### 2. Is He Switching Senses of "Obligation"?
  This is the trickier part. It looks like an equivocation, but it's actually a methodological trap.

  *   **In Passage 1 (The Setup):** He is using "obligation" in the sense his opponents use it: a binding normative force that the will is supposed to generate. He grants them the term to find the mental act that corresponds to it.
  *   **In Passage 2 (The Takedown):** He translates "obligation" into *his* empirical terms. If you claim there is an obligation, show me the impression. The impression is a sentiment. Can you will a sentiment? No.

  He isn't quietly switching senses; he is insisting that **any** coherent sense of obligation *must* cash out in sentiments. If the natural law theorist says, "No, obligation is a rational relation," Hume has already dismissed that in earlier sections of the *Treatise* (reason is the slave of the passions, etc.). So, within the framework of the *Treatise*, the reduction to sentiment is valid. The "absurdity" arises because the natural law theorist wants the *effect* of a sentiment (binding force) without the *cause* of a sentiment (natural sympathy or interest), positing the *will* as the cause instead.

  ### 3. The Hard Question: Does Convention Commit the Same Absurdity?
  This is the core of your dissertation problem. If we can't will a sentiment individually, how does a convention (which is made of individuals willing to cooperate) create a sentiment without doing the same impossible thing?

  The answer lies in the **efficient cause** of the sentiment.

  **In the "Natural" (Absurd) Model:**
  *   **Cause:** The individual act of will ("I promise").
  *   **Effect:** The moral sentiment (obligation).
  *   **Problem:** The will has no causal power over sentiments. This is magic.

  **In the "Artificial" (Conventional) Model:**
  *   **Cause:** The perception of **public utility** and **self-interest** stabilized over time.
  *   **Mechanism:** Sympathy.
  *   **Role of the Will:** The will (the utterance of the promise) is not the *cause* of the sentiment. It is a **sign** or a **trigger**.

  Here is the distinction you need to draw in your chapter: Hume does not claim that the convention *wills* the sentiment into existence *ex nihilo*. He claims that the convention creates a **context** in which the sentiment arises *naturally* via sympathy.

  1.  **Iterative vs. Instant:** The "gross absurdity" is a *single act of will* creating a *new sentiment* instantly. Convention is an evolutionary process. We notice that restraining our liberty benefits us. We do this repeatedly. A pattern emerges.
  2.  **Source of the Sentiment:** In the conventional model, the moral sentiment (approval of promise-keeping) arises from our sympathy with the **public interest**. We see that the *practice* of promising is useful to society. We feel approval for that utility.
  3.  **The "New" Sentiment:** It isn't actually "new" in the metaphysical sense. It is a redirection of existing sentiments (approval of order, self-love, sympathy) onto a new object (the linguistic formula "I promise").

  So, when I say "I promise," I am not willing an obligation into existence. I am invoking a pre-existing social machine that *already* generates sentiments of approval/blame based on utility. I am stepping into a current that is already flowing.

  ### 4. How to Frame This in the Dissertation
  If you are looking for a "gap" to exploit or clarify, look at the **transition from Interest to Morality**.

  Hume argues that convention starts in self-interest (I keep my word so you keep yours). But obligation is *moral*, not just prudential. How do we get from "It is in my interest to keep promises" to "It is *virtuous* to keep promises"?

  Hume's bridge is **Sympathy**. We sympathize with those who benefit from the practice. Eventually, the sentiment becomes detached from the immediate self-interest and we feel moral approval even when *we* aren't the immediate beneficiaries.

  **The potential gap/critique:**
  Does Hume successfully explain how the sentiment attaches to the *specific words* of the promise?
  *   **The Critique:** He says the words are a "form" or "sign." But why does *this* sign trigger the sentiment? If it's arbitrary, how does the sentiment become stable enough to be "moral"?
  *   **Your Move:** You can argue that Hume's solution avoids the "willing the obligation" absurdity only by outsourcing the causal work to **social psychology** (sympathy + utility) rather than **individual metaphysics** (will).

  **Recommendation for the Chapter:**
  Don't frame it as Hume contradicting himself. Frame it as Hume diagnosing a **category mistake**.
  *   The Rationalists/Natural Lawyers treat Obligation as a product of **Volition** (Metaphysics of Will).
  *   Hume treats Obligation as a product of **Sentiment** (Psychology of Passion).
  *   The "Absurdity" is trying to bridge the two directly (Volition $\rightarrow$ Sentiment).
  *   The "Convention" works because it bridges them indirectly (Volition $\rightarrow$ Social Practice $\rightarrow$ Utility $\rightarrow$ Sentiment via Sympathy).

  **Secondary Lit to Check:**
  *   **Philip Pettit:** Has written well on Hume on commitment and the "expressive" nature of promising.
  *   **David Jones:** *Hume's Sentiments: Their Ciceronian and French Context*. He deals with the "willing the obligation" paradox specifically.
  *   **Stephen Darwall:** *The Bond of Society*. He contrasts Hume's conventionalism with rationalist accounts and might have a take on whether the "sentiment" move works.
  *   **Don Garrett:** *Cognition and Commitment in Hume's Philosophy*. Good on the cognitive status of the "act of mind."

  **Summary:** You aren't missing a move; you've identified the pivot. The "absurdity" is the proof that promising cannot be natural. The "convention" escapes the absurdity because it doesn't claim the *will* creates the sentiment; it claims the *social context* creates the sentiment, and the will merely signals entry into that context. Your job is to scrutinize whether that social context explanation is robust enough to carry the moral weight he puts on it.
