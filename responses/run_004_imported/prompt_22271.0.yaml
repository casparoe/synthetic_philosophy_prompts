      *   *Goal:* Hume wants to show promises aren't natural.
      *   *Step 1 (The Elimination):* What mental state constitutes a promise?
          *   Resolution? No, I can resolve without binding myself.
          *   Desire? No, I can promise what I hate doing.
          *   Willing the action? No, the action is future, will is present.
