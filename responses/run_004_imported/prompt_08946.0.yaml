      *   **Key Russellian Concepts to Include:**
          *   Jealousy is more custom than nature.
          *   Qualified sympathy for companionate marriage.
          *   Distinction between the passionate part and the deeper, life-entwining part.
      *   **Constraints/Pitfalls to Avoid:**
          *   Do not advocate for infidelity (Russell's controversial view on strict fidelity).
          *   Do not reference the CCNY scandal explicitly (too negative/awkward).
          *   Do not highlight Russell's own marital instability (hypocrisy risk).
          *   Tone: Honest to Russell's philosophy but appropriate for a wedding (celebratory, not lecture-like).
          *   Length: Approximately 3 minutes (roughly 400-500 words spoken at a moderate pace).

  2.  **Deconstruct Russell's *Marriage and Morals* for the Toast:**
      *   *Jealousy:* Russell argues it's socially constructed. *Toast adaptation:* Focus on overcoming insecurity through trust, rather than saying "jealousy is fake." Frame it as choosing trust over possessiveness.
      *   *Companionate Marriage:* Russell valued friendship and equality. *Toast adaptation:* Emphasize partnership, friendship, and facing the world together.
      *   *Passion vs. Deep Entwinement:* Russell acknowledged passion fades but deeper bonds remain. *Toast adaptation:* Acknowledge the spark but celebrate the enduring build of a life together.
      *   *Fidelity:* This is the minefield. Russell thought strict sexual fidelity wasn't the *only* metric of success. *Toast adaptation:* Pivot to "emotional fidelity" or "faithfulness to the project of us." Avoid mentioning open marriage or sexual exclusivity directly. Focus on loyalty to the *growth* of the relationship.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role ("the one who reads Russell") with a bit of humor to break the ice. Set the stage without getting academic.
      *   **The Philosophy (Lightly Applied):** Introduce Russell's core idea without naming the book repeatedly. Focus on the *structure* of a good marriage.
      *   **Addressing the "Jealousy/Custom" point:** Frame it as liberating. Marriage isn't about owning someone; it's about choosing them daily.
      *   **Addressing the "Passion vs. Depth" point:** This is safe and romantic. Passion is the spark, but the "life-entwining" is the hearth.
      *   **Navigating the Fidelity Minefield:** This needs care. Instead of "fidelity isn't essential," say "fidelity is more than just rules; it's about devotion to the shared life." This honors Russell's nuance without scaring the traditional guests.
      *   **Conclusion:** Bring it back to the couple. Wish them well. Raise a glass.

  4.  **Refining the Tone:**
      *   *Risk:* Sounding too clinical or cynical.
      *   *Fix:* Use warm language. Instead of "Russell argues," use "There's an idea..." or "One philosopher suggested..."
      *   *Risk:* Sounding like a lecture.
      *   *Fix:* Keep sentences rhythmic. Address the couple directly.
      *   *Risk:* The "Infidelity" implication.
      *   *Fix:* Explicitly frame commitment as a *positive choice*, not a restriction. Russell valued freedom, but within a context of mutual respect. Emphasize that the *bond* is what matters.

  5.  **Drafting - Iteration 1 (Mental Outline):**
