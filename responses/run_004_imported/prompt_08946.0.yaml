  6.  **Drafting - Iteration 2 (Adding Nuance):**
      Start with the "Russell expert" label. Acknowledge the danger of quoting him at a wedding. Focus on his view that marriage is a dynamic thing. Jealousy is about fear, but love is about trust. Passion is great, but the real work is building a life. Fidelity is about prioritizing the relationship. To the couple: May you have both spark and depth.
