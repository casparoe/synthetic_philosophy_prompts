answer: |-
  Good evening. For those who don't know me, I'm [Your Name], and I've been assigned the role of "the one who reads Russell" for this occasion. Usually, quoting Bertrand Russell at a wedding is considered a risk. He was a man who believed marriage was a serious institution, even if his own record was… complicated. But looking at [Couple's Names] today, I realized his book *Marriage and Morals* isn't actually about rules. It's about what makes a shared life survive the real world.

  Russell argued that a lot of what we call "marital instinct"—specifically jealousy and possessiveness—isn't nature, but custom. We are taught to fear losing the other person. But he suggested that a strong marriage isn't built on holding on tight out of fear; it's built on letting go out of trust. To [Couple's Names]: May your marriage be a place where you don't have to police each other's hearts, because you are secure in the knowledge that you choose each other, every day, freely.

  He also made a distinction that I think is vital for the long haul. He noted that every marriage has a "passionate" part and a "life-entwining" part. The passion is the spark; it's what brings you here today. But Russell believed the deeper success of a marriage relies on the entwining—the companionate friendship that grows when the initial intensity settles into something quieter and more resilient. It is the difference between a firework and a hearth. One is dazzling, but the other keeps the house warm through the winter.

  Now, Russell was controversial because he believed that the success of a marriage shouldn't be measured by rigid external standards, but by the internal reality of the bond. He thought strict adherence to custom mattered less than mutual respect and the growth of both individuals.

  So, I won't wish you a marriage that looks perfect from the outside. I will wish you a marriage that is true on the inside. May you have the courage to define fidelity not just as a restriction, but as a devotion to the project of "us." May you prioritize the life you are entwining over the customs you are expected to follow. And may you find that when the passion shifts shape, as it must, the friendship underneath is strong enough to hold it.

  To [Couple's Names]: May your customs be your own, your trust be absolute, and your life together be deeply, happily entwined.

  Cheers.
