  2.  **Evaluate the Arguments (Philosophical Rigor & Resilience):**

      *   *Wellman (Freedom of Association):* Strong analogy to personal association, but critics argue states aren't like individuals (monopoly on violence, coercive). It's a standard libertarian/liberal defense of exclusion. *Verdict: High tier, but contested on the analogy.*
      *   *Miller (National Self-Determination):* Very influential in political theory. Grounds exclusion in the value of cultural/political continuity. Vulnerable to "how much change is too much?" and can slide into nationalism. *Verdict: High tier, foundational.*
      *   *Walzer (Membership):* Classic text (*Spheres of Justice*). Argues communities have a right to maintain character. Often seen as the starting point for modern debate. Slightly dated but structurally sound. *Verdict: High tier.*
      *   *Pevnick (Associative Ownership):* Interesting twist on labor/value. Citizens "built" it. Vulnerable to historical injustice critiques (who actually built it?) and intergenerational transfer issues. *Verdict: Mid-High tier.*
      *   *Carens (Feudal Privilege):* The seminal open borders argument. Morally powerful, but often relies on the premise that liberalism *should* lead to open borders, which statists deny. It's a strong moral critique but lacks a specific institutional theory of *why* borders are illegitimate beyond analogy. *Verdict: High tier (for impact), but maybe less "defensive" rigor than Wellman.*
      *   *Huemer (Starving Marvin):* Intuition pump. Very clear, but easily countered by scaling (what if it's millions of Marvins?) or distinguishing negative/positive rights. Good for debate, less robust as a full theory. *Verdict: Mid tier.*
      *   *Abizadeh (Democratic Coercion):* Sophisticated. Argues border enforcement is coercive, so those coerced (outsiders) need a say. Hard to refute without rejecting democratic theory. *Verdict: High tier (very technically strong).*
      *   *Fiscal/Welfare:* Empirical claim disguised as normative. Philosophically thin (consequentialist calculation). Depends entirely on data, not principle. *Verdict: Low tier (philosophically).*

