      *   *Synthesis:* She'd predict a specific kind of misery: the misery of the "enlightened" who deny themselves the taste of the meal while eating it. They will readmit illusion but lack the *skill* to manage it (because they deny its existence), leading to the very car crashes they fear, plus the unhappiness of austerity.

