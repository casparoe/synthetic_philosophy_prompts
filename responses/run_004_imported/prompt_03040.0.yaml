answer: |-
  The ink on Elias's ledger was still wet when the bell in the square began to toll. It was not the rhythmic clang of the market hour, but the single, iron-heavy strike reserved for the Council. Elias dipped his pen again, finishing the line item: *Five hundred bushels wheat, contracted to the Southern Syndicate, delivery assured by Spring.*

  He blew on the page. For forty years, the Free City of Ostra had not seen a soldier within its walls. The surrounding leagues had signed the Covenant of Perpetual Accord. Trade routes were paved; insurance premiums had plummeted. Elias had built his life on the certainty that commerce made blood obsolete. Why burn a field when you can buy its harvest for half the cost?

  A shadow fell across his desk. It was Councilor Vane. She wore no uniform, but the dark wool of the magistracy carried a weight the merchants' velvet lacked.

  "The grain," Vane said. She did not sit. "The Council requisitions it."

  Elias laughed, a short, nervous sound. "You've misread the ledger, Councilor. That grain is sold. It belongs to the Syndicate. To take it is breach of contract. I'll sue for damages."

  "There is no court higher than the Council today," Vane said. She placed a document on the desk. It bore the Great Seal, stamped in red wax that looked disturbingly like dried blood. "The Southern Syndicate is no longer a partner. They have merged with the Kingdom of Kael. Their army is at the river crossing."

  Elias stood, his chair scraping loudly against the floor. "But the Covenant. The trade agreements. They value profit more than territory. They won't risk the disruption."

  "They value their sovereignty more than your profit," Vane said. "And we value ours more than your contract."

  "This is madness," Elias snapped, grabbing his coat. "We are a city of laws. You cannot simply void private right because of a rumor."

  "Come," Vane said.

  She led him not to the armory, but to the city wall. The air was crisp, smelling of autumn leaves and the river mud below. From this height, Ostra looked like a jewel box of prosperity. Smoke rose from a hundred chimneys. The warehouses were full. It was a monument to safety.

  Vane pointed south. "Look."

  At first, Elias saw nothing but the haze of the valley. Then, the sun broke through the clouds. A glint. Then another. Not the glint of coin, but of steel. A line of black moved against the green grass. It was not a raiding party. It was a force large enough to erase the concept of ownership.

  "Do you see?" Vane asked. "For a generation, you have believed you were a *person* in the eyes of the law. You believed your rights were absolute. But look at that line."

  "My rights are guaranteed by the Constitution," Elias said, though his voice lacked its earlier bite. He gripped the stone parapet. His knuckles were white. He was thinking of the penalty clauses in the Syndicate contract. He was thinking of his son's inheritance.

  "The Constitution is a piece of paper," Vane said softly. "It exists only because we are willing to die to keep it from being dust. In times of peace, the state is invisible. It is just the background noise that allows you to count your money. You begin to think the noise is silence. You begin to think you are alone."

  She turned to him. Her face was not angry. It was grim, stripped of the polite fictions of the marketplace.

  "If I let you keep that grain, Elias, you will sell it to the enemy. You will follow the contract. You will remain a good merchant. And Ostra will starve, and the law you love will vanish with us. If I take it, you lose your profit. But the entity that makes profit possible remains."

  "That's not justice," Elias whispered.

  "It is the condition for justice," Vane replied. "There is no judge between Ostra and Kael. There is only us, and them. If we are not a single will, we are nothing. If you are not willing to lose your property, you are not a citizen. You are a tenant waiting for eviction."

  A cannon shot echoed from the valley floor. It was distant, a dull thud that vibrated in the chest rather than the ear. No one screamed. The city did not panic. Instead, a hush fell over the streets below. The clatter of carts ceased. The shouting of prices died.

  Elias watched the smoke rise from the impact site in the meadow. For forty years, he had worried about interest rates, about supply chains, about the fluctuating price of flour. In that second, none of it existed. The threat of death had swept away the vanity of things. He realized, with a cold clarity, that his ledger was not a record of value, but a record of permissions granted by the state.

  He looked at Vane. He expected to feel rage. Instead, he felt a strange, sobering relief. The endless calculation was over. The question was no longer *what is mine?* but *what is ours?*

  "Release the wagons," Elias said.

  Vane nodded once. She did not thank him. Gratitude was for favors; this was duty.

  Elias walked back to his office. The ledger lay open on the desk. The ink was dry now. He took a pen, dipped it in the pot, and drew a single line through the entry: *Five hundred bushels wheat.*

  He did not write *cancelled*. He wrote *Requisitioned*.

  Outside, the bells continued to toll. The peace was broken. The comfortable illusion that the world was a marketplace was gone. But as Elias watched the city gates close, barring the iron against the iron, he understood that for the first time in his life, the city was not just a place where he lived. It was a thing that lived, and it demanded to be recognized.

  He closed the book. The silence in the room was no longer the silence of safety. It was the silence of a held breath. It was the sound of a nation waking up.
