answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. Priya and I have been friends since the start of our MA, and we've survived the journey to ABD status together. Which, for the non-academics in the room, means we are officially "All But Dissertation." Or, as our families know it: "Always Being Dramatic."

  When Priya asked me to give this toast, I knew I had a specific assignment. For the last four years, Priya's entire intellectual life has revolved around one specific text: G.E. Moore's *Principia Ethica*. Specifically, the chapter on the "Ideal."

  If you know Moore, you know he was a man obsessed with precision. He argued that if you want to know what is truly valuable in life, you have to run it through the "Isolation Test." You have to imagine the thing existing completely alone, stripped of all consequences, stripped of utility, stripped of everything else. And you ask: Is its bare existence still good?

  Moore concluded that almost nothing survives the test. Money doesn't. Fame doesn't. Even knowledge, on its own, fades. He argued that really, only two things hold up under that kind of pressure. The enjoyment of beauty, and personal affection. The Two Great Goods.

  Now, for the philosophers in the room: I am aware that applying the Isolation Test to a marriage is a category error. For everyone else: Priya tested Wren thoroughly. And he passed.

  But there is a trap in Moore's view that I need to address. Moore's definition of "personal affection" can sound incredibly clinical. He describes it as the admiration of someone's good qualities, plus the emotion appropriate to them. If you say that out loud at a wedding, it sounds like a performance review. It sounds like, "I have calculated your virtues and found them sufficient."

  But watching Priya and Wren together, you realize that Moore missed something. He talked about "Organic Unities." He argued that the value of a whole is not necessarily the sum of the value of its parts. Sometimes, when you bring two good things together, you don't just get addition. You get multiplication. You get a new kind of value that didn't exist before.

  Priya and Wren, you are an Organic Unity.

  When you are apart, you are both brilliant, kind, beautiful individuals. You clear the bar of the Two Great Goods on your own. But when you are together, something else happens. The affection isn't just admiring qualities from a distance. It's the shared creation of a world that is more valuable than the sum of your separate lives.

  Moore famously argued that "good" is a simple, indefinable property. He said if you try to define it using natural terms, you commit what he called the "Naturalistic Fallacy." So, in the interest of philosophical rigor, I am not going to try to define *why* this marriage is good. I will simply point to the evidence and say: It is self-evident.

  Priya, you have spent years studying what makes a life worth living. You've compared beautiful worlds to ugly ones. You've isolated variables and tested hypotheses. But tonight, you don't need the isolation test. You don't need to strip the world away to find the value.

  Because the value isn't in the isolation. It's in the connection.

  The Two Great Goods aren't just concepts in a dissertation anymore. They are standing right here. The beauty is in this room, in the people who love you. And the affection is in the promise you are making to navigate the ugly worlds and the beautiful ones, together.

  So, if everyone could please raise a glass.

  To Priya and Wren. May your life together be the one thing that survives the isolation test. And may you always find that the whole is worth far more than the parts.

  To the bride and groom.
