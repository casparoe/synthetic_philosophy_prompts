prompt: |-
  so for my gov class debate unit i went down a rabbit hole on this 'boundary problem' thing in democratic theory -- basically, how do you decide who counts as 'the people' that even gets to vote on something, when the only fair way to decide that would itself require a vote among people you havent picked yet?? kinda hurts my brain lol. can you write me a dialogue between two political philosophers hashing it out -- maybe set around a referendum whose effects spill into a neighboring country? have one defend the 'all affected interests' principle (everyone impacted gets a say) and the other push the 'all subjected' principle instead (only the people under the law's actual coercive power get a say), and make them really go back and forth poking holes in each other's points instead of just monologuing. thx!
