answer: |-
  **Setting:** *A cramped coffee shop in the border town of Oakhaven. On one side of the street is the nation of **Oceana**; on the other, **Neighboria**. A large river divides them. Tomorrow, Oceana is holding a referendum on the "Blue Dam Project," which will provide cheap electricity for Oceana but drastically reduce water flow to Neighboria.*

  **Characters:**
  *   **ELENA:** A proponent of the **All Affected Interests (AAI)** principle. Believes anyone impacted by a decision should have a vote.
  *   **MARCUS:** A proponent of the **All Subjected to Coercion (ASC)** principle. Believes only those legally bound by the decision should vote.

  ***

  **ELENA:** (Stirring her coffee, looking out the window at the river) It's absurd, Marcus. Tomorrow, the people on *this* side of the street vote on whether to choke the river. The people on the *other* side—the ones whose farms turn to dust—don't get a say.

  **MARCUS:** It's not absurd, Elena. It's jurisdictional. The dam is an Oceana project. It's built on Oceana soil, funded by Oceana taxes, and enforced by Oceana law. Only Oceana citizens are *subject* to the legal authority of the referendum. That's the boundary.

  **ELENA:** But that's exactly the "Boundary Problem" I'm talking about! You're assuming the boundary is fixed *before* we decide who's in the demo. But why is *that* boundary the fair one? If the decision hurts Neighboria, why doesn't Neighboria get to help draw the line?

  **MARCUS:** Because if you let everyone who gets hurt vote, where does it stop? Does the steel manufacturer in Germany who sells us the turbines get to vote? Does the climate activist in Brazil who worries about the concrete carbon footprint vote?

  **ELENA:** Don't straw man me. I'm talking about *direct, significant* interests. The farmers across the street will lose their livelihood. Under the **All Affected Interests** principle, if you bear the cost, you should hold the pen. Democracy isn't just about who signs the law; it's about who suffers the consequence.

  **MARCUS:** But suffering a consequence isn't the same as being ruled. Look, democracy is about collective self-determination. It's a group of people agreeing to live together under laws they make for themselves. If I let you vote on my laws just because you're "affected," you aren't part of *my* self-determination. You're an external veto point.

  **ELENA:** And if you don't let me vote, you're tyranny by zip code. You're saying, "We can dump our trash in your yard because you don't have a key to our gate." That's not self-determination; that's privilege.

  **MARCUS:** It's not privilege, it's reciprocity. I am bound by the laws of Oceana. I can be arrested by Oceana police. I pay Oceana taxes. The Neighborian farmers? They aren't subject to Oceana's coercion. If the dam passes, they're unhappy. If it fails, they're happy. But they aren't *governed* by it.

  **ELENA:** Ah, but here's the rabbit hole. Who decided they aren't governed by it?

  **MARCUS:** The constitution did.

  **ELENA:** (Leans in) And who wrote the constitution?

  **MARCUS:** The founders of Oceana.

  **ELENA:** Exactly! A group of people who *already excluded* the Neighborian farmers. You're using a circular argument, Marcus. You say only citizens should vote on the boundary. But the boundary is what defines the citizens! You can't use the rules of the game to decide who gets to play the game. That's the paradox. To decide the boundary democratically, you'd need a vote... but you need a boundary to know who votes.

  **MARCUS:** (Sighs, takes a sip) Okay, the logical circularity is real. I grant you that. Theoretically, it's a mess. But practically? We need a "pre-political" boundary to start *any* politics. If we try to redraw the electorate every time a new law is proposed based on who's "affected," the electorate changes every Tuesday.

  **ELENA:** So stability is more important than fairness?

  **MARCUS:** Stability is a prerequisite for fairness! If the "people" is a fluid cloud that shifts with every policy, there is no "people" to hold power accountable. How do I vote for a representative if I don't know who my fellow voters are? The **All Subjected** principle gives us a stable box. Inside the box, we are equals. Outside the box... well, that's diplomacy, not democracy.

  **ELENA:** Diplomacy is for states, Marcus, not people. You're treating the border like a magic shield. "Oh, the radiation stops at the line, so only we vote." It's moral cowardice. If the causal chain of your decision reaches them, your democratic legitimacy stops where their consent begins.

  **MARCUS:** But causality is infinite, Elena! Everything is connected. If Oceana votes to cut education funding, our economy shrinks, Neighboria exports less, their farmers suffer. Are they affected? Yes. Should they vote on our school budget?

  **ELENA:** There's a difference between indirect market fluctuations and direct physical coercion. The dam *physically* stops the water. That's a tangible infringement on their liberty to use the river.

  **MARCUS:** Is it coercion though? Oceana isn't *ordering* the Neighborian farmers to do anything. They aren't arresting them. They are just changing the environment. If I open a factory that pollutes the air, I'm affecting you. But I'm not *subjecting* you to my law.

  **ELENA:** That's a legalistic distinction, not a moral one. If I can ruin your life without your consent, I have power over you. Power without consent is domination. Democracy is supposed to cure domination. By sticking to "All Subjected," you're just protecting the right of the majority to dominate the outsider.

  **MARCUS:** And by sticking to "All Affected," you're inviting the outsiders to dominate the majority! Imagine the dam vote. 51% of Oceana wants it. But 100% of Neighboria hates it. If they vote, the project dies. So, a foreign minority overrides the will of the citizen majority. Is that democratic?

  **ELENA:** If the "citizen majority" is defined in a way that ignores the victims, then no, it's not democratic. It's ethnic cleansing by bureaucracy. Look, I'm not saying Neighboria should vote in *all* Oceana elections. I'm saying the *boundary of the referendum* should match the *boundary of the impact*.

  **MARCUS:** But who draws *that* line? We're back to the start! Who decides which interests count as "affected" enough to vote?

  **ELENA:** (Pauses) ...Okay. Touché.

  **MARCUS:** See? You need a judge. A court? A commission? Who appoints them?

  **ELENA:** It doesn't mean we give up. It just means the boundary problem is never solved, it's only managed. We have to keep questioning the border.

  **MARCUS:** I agree we should question it. But we can't dissolve it. If we adopt your principle, we essentially argue for a global democracy for every issue. And without a global state to enforce the rights of those voters, it's meaningless.

  **ELENA:** Maybe. Or maybe it means our nation-states are just too small for the problems we face. The river doesn't care about your line on the map.

  **MARCUS:** The river doesn't vote, Elena. People do. And people need to know who "we" are before they can decide what "we" want.

  **ELENA:** But if "we" is defined by excluding the people we hurt, then "we" is just a gang.

  **MARCUS:** (Looks at his watch) And if "we" includes everyone on earth, "we" is a crowd. And a crowd can't govern.

  **ELENA:** (Smiles wryly) So, tomorrow?

  **MARCUS:** Tomorrow, the people of Oceana vote. And I'll respect the result.

  **ELENA:** And I'll be across the street, protesting with the farmers. Because if the boundary is unjust, the vote is just a ritual.

  **MARCUS:** (Stands up) Then I suppose the debate continues. Even after the ballots are counted.

  **ELENA:** Especially then.

  *(Marcus drops money on the table and heads toward the Oceana side of the street. Elena watches the river flow past, unmoving.)*
