answer: |-
  You were not splitting hairs, and you were certainly not indulging a groundless scruple. Your discomfort aligns with one of the most famous and persistent problems in contemporary epistemology and legal theory.

  What you encountered in your facility is a real-world instantiation of what philosophers call the **Problem of Naked Statistical Evidence**, often illustrated by the **Gatecrasher Paradox** proposed by the legal philosopher L. Jonathan Cohen in 1977.

  In Cohen's paradox, 1,000 people attend a rodeo, but only 499 have paid. The organizers sue one randomly selected attendee for the ticket price, arguing that there is a 50.1% probability they didn't pay. Mathematically, the probability is in the organizers' favor. Yet, intuitively and legally, we feel this is insufficient to establish liability. Your case is even starker: a 95% probability based solely on group membership.

  Your colleagues argued for **Probabilistic Equivalence**: that a 95% chance derived from base rates (the head count) is epistemically identical to a 95% chance derived from fallible testimony or technical error rates. Your intuition told you there was a qualitative difference. Modern epistemology suggests your intuition was correct. Here is the principled basis for why that statistic is insufficient for "settled fact," and why it differs from the witness or the card log.

  ### 1. The Distinction Between Individualized and Naked Evidence
  The primary distinction philosophers draw is between **individualized evidence** and **naked statistical evidence**.

  *   **Individualized Evidence (The Witness/Log):** This evidence is causally connected to the specific event. If the specific individual had *not* broken the microscope, a truthful witness would not have seen them do it, or the card log would not show their specific ID (assuming the log tracks the individual). The evidence *tracks the truth* of the specific proposition ("Person X broke the scope").
  *   **Naked Statistical Evidence (The Head Count):** This evidence is not causally connected to the event. It describes the composition of the pool, not the actions of the individual. If the specific individual had *not* broken the microscope, the statistic (38 out of 40 were from the visiting group) would remain exactly the same. The evidence does not track the specific truth; it merely tracks the probability of the group.

  ### 2. The Sensitivity Condition
  One robust way to articulate this difference is through the **Sensitivity Condition** (often associated with Robert Nozick). For a belief to count as knowledge (or justified attribution), it must be sensitive to the truth. That is: *If the proposition were false, would you still hold the belief?*

  *   **The Witness/Log:** If the visiting researcher had *not* broken the detector, a reliable witness would not have testified that they did, and a reliable log would not show their access during the critical window. The evidence would change. The belief is sensitive.
  *   **The Statistic:** If the visiting researcher had *not* broken the detector, the statistic (95% of access holders were from their group) would remain unchanged. You would still have the same reason to blame them. The belief is **insensitive**.

  Because the statistical evidence does not vary with the specific facts of the case, it cannot support a claim of "settled fact" regarding a specific agent, even if the probability is high.

  ### 3. Normic Support
  A more recent framework, proposed by philosopher Martin Smith, is the idea of **Normic Support**. Evidence provides normic support if the truth of the proposition is the *normal* explanation for the evidence, and its falsehood would require a special explanation.

  *   **The Witness:** If the witness says "X did it," the normal explanation is that X did it. If X *didn't* do it, we need a special explanation (the witness lied, was mistaken, etc.).
  *   **The Statistic:** If the visiting group member did it, the explanation is consistent with the statistic. But if they *didn't* do it (i.e., it was one of the other two), this *also* requires no special explanation within the statistical framework; it is simply the 5% outlier case. The statistic does not make the falsehood "abnormal" in the same way; it merely makes it less frequent.

  ### 4. Why Your Colleagues' Analogy Failed
  Your colleagues argued that a 95% reliable card log is the same as a 95% head-count probability. This is a category error regarding the *source* of the uncertainty.

  *   **Card Log (95% Reliable):** The uncertainty lies in the **measurement tool**. The event (swiping the card) is individualized, but the recording mechanism is noisy. We accept this because the noise is random and the event is specific.
  *   **Head Count (95% Probability):** The uncertainty lies in the **identity of the agent**. The measurement (who had access) is perfect, but it does not measure the *act*.

  In the card log scenario, we have evidence linking a specific person to the room, with a known error rate. In the head-count scenario, we have no evidence linking a specific person to the *act*, only a likelihood based on association. To treat them as equivalent is to conflate **measurement error** with **reference class ambiguity**.

  ### 5. The Moral and Practical Stakes
  There is also a normative dimension to epistemology, particularly in a facility management context. To declare something "settled fact" implies a warrant for action (billing, censure, banning).

  Relying on naked statistics imposes **collective liability**. If you bill the visiting group based on the 95% statistic, you are effectively taxing the innocent 37 members for the actions of the one (potentially innocent) member, or perhaps the one guilty member, without identifying them. This violates a principle of **individual agency** that is central to both scientific integrity and moral reasoning.

  Your operations manager was making a pragmatic decision to recover costs, which is understandable from an administrative view. However, she was making an epistemological error by labeling it "settled fact." She was entitled to say, "It is overwhelmingly probable the damage occurred under this group's tenure, and per our insurance/liability policy, the host institution is responsible." But she was not entitled to assert, "A member of this group broke it," as a known fact.

  ### Conclusion
  You were groping toward a distinction that professional epistemologists and legal theorists have spent decades refining. Your colleagues were relying on a crude frequentist view of probability (95% is 95%), ignoring the **structural relationship between the evidence and the event**.

  You were right to object. A probability derived from base rates alone, without causal or individualized linkage to the specific event, is insufficient to ground a claim of knowledge or specific responsibility, regardless of how high that probability rises. Your discomfort was not a scruple; it was a correctly functioning epistemic intuition.

  **Verdict:** You had the better of the argument. The statistic provided high probability, but it lacked the **warrant** required for knowledge attribution.
