  2.  **Deconstruct the Philosophical Concepts (Fricker's Framework):**
      *   *Testimonial Injustice:* Prejudicial credibility deficit given to a speaker due to identity prejudice (e.g., gender, race). Key element: *Prejudice* must be the cause of the credibility deficit, not just rational assessment of expertise.
      *   *Hermeneutical Injustice:* A structural gap in shared interpretive resources (concepts, vocabulary) that puts someone at a disadvantage in making sense of their social experiences. Key element: The *collective* lacks the resource, not just the individual. It's usually structural/systemic, not just a lack of individual training.

