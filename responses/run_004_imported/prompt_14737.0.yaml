      *   *Section 3 (Satisficer's Reply):* Focus on the "Cost" view (Scheffler-style) or the "Rationality" view (Slote). The threshold isn't a number; it's the point of excessive sacrifice.
      *   *Section 4 (Assessment):* Be critical. Portmore is better, but not perfect. The "arbitrariness" in SC is *within* the consequentialist logic. In DRAC, it's about the *interface* between consequentialism and common sense morality. The asymmetry survives because DRAC explains *why* we stop maximizing (competing reasons) whereas SC just says *that* we stop.

  7.  **Refining the Argument (Self-Correction during drafting):**
