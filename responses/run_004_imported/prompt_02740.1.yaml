  3.  **Evaluate the "Independence" of the Second Argument:**
      *   The first argument is about *intension* (meaning/concept). "Horse" refers to form, "White" to color. The compound is distinct from the component.
      *   The second argument is about *extension* (reference/set membership). The set of things satisfying "horse" is larger than the set of things satisfying "white horse."
