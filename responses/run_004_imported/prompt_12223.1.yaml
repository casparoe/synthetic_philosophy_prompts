answer: |-
  The lasagna sat on the table, skinning over in the cooling air. It was 8:30 PM. Sarah was an hour late, her phone dead, her excuse a blur of traffic and a last-minute meeting that she knew, deep down, she could have left earlier if she had prioritized dinner.

  Elias was washing a single fork in the sink. He didn't turn when the front door slammed. He didn't turn when her heels clicked frantically into the kitchen.

  "I am so sorry," Sarah said, breathless, reaching for his shoulder. "The client wouldn't let me go. I tried to call. I know I messed up. I'm sorry, Eli."

  This was the moment. The script was written in the biology of their seven-year marriage. Sarah's tardiness was a slight; Elias's hunger and disappointment were the injury. The expected reaction was heat. A sharp tone. A sulking silence. The negotiation of guilt. The reactive attitudes: resentment, hurt, forgiveness.

  Elias turned off the tap. He dried his hands on the towel, folded it, and placed it over the oven handle. He looked at her. But he didn't look *at* her. He looked at her the way a mechanic looks at a car that won't start.

  "There's no need to apologize, Sarah," he said. His voice was level, devoid of the jagged edges of irritation.

  Sarah blinked, her hand still hovering in the air where his shoulder had been. "What? Of course there is. I ruined dinner."

  "You didn't ruin it. It's just cold. We can heat it."

  "I'm an hour late, Elias. I didn't prioritize us." She waited for the sting. She needed the sting. The sting proved she mattered enough to hurt him.

  Elias walked past her to the cupboard and took down a Tupperware container. "You acted according to your strongest motivations at the time. The anxiety of the meeting outweighed the commitment to dinner. Given your neurochemistry and the environmental pressures, you couldn't have done otherwise."

  Sarah felt a cold prickle run down her spine. It wasn't the cold lasagna. "Are you being sarcastic?"

  "No." He began scraping the lasagna into the container. *Scrape. Scrape.* "We talked about this. The book. Galen Strawson, Hume, the causal chain. If determinism is true, resentment is irrational. It's like being angry at the rain for falling."

  "I'm not the rain," Sarah said, her voice tightening. "I'm your wife."

  Elias stopped scraping. He turned to her, his expression open, placid, and utterly terrifying. "You are a biological entity operating within a closed system of cause and effect. I love you. But I no longer hold you responsible for your failures. It's inefficient. And it's untrue."

  "Efficient?" Sarah stepped back, hitting the counter. "You're talking about efficiency?"

  "I'm talking about peace, Sarah. Look at us. For years, we've fought. You forget things, I get angry. You get defensive, I withdraw. A cycle of reactive attitudes. I'm opting out. I'm adopting the objective stance."

  "The objective stance," she repeated. The words sounded clinical, like a diagnosis. "So what am I to you now? A project?"

  "A partner," he said, snapping the lid on the Tupperware. "One I understand completely."

  He put the container in the fridge. The hum of the compressor seemed to fill the silence. Sarah felt a surge of hot, familiar anger. She wanted to scream. She wanted to throw the Tupperware at the wall. She wanted him to flinch. If he flinched, he was still in the game. If he flinched, he acknowledged her agency.

  "You're a coward," she said.

  Elias nodded slowly, as if she had commented on the weather. "That is a common defensive projection when one's agency is questioned. You feel threatened because you believe I am diminishing you. I am not. I am freeing you from the burden of guilt."

  "I don't want to be free of guilt!" Sarah shouted. "I want you to be mad at me! I want you to care enough to be mad!"

  "Anger doesn't help us solve the problem," Elias said, walking toward the hallway. "If you are prone to lateness due to work anxiety, we need to implement a system. Reminders on your phone. I will call you at 5:00 PM. We can manage the variable."

  "Manage the variable," she whispered.

  "Come on. Let's heat this up."

  Sarah didn't move. She watched him. He wasn't suppressing his anger. She knew what that looked like; she knew the tightness in his jaw, the vein in his neck. This wasn't suppression. The anger was gone. The *her* that could hurt him was gone.

  He had exempted her.

  In Strawson's terms, we take the objective attitude toward children or the mentally ill because they are not fully responsible agents. We manage them. We train them. We don't reason with them as equals. Elias had decided, unilaterally, that she was not an equal. She was a mechanism to be tuned.

  "Elias," she said, her voice shaking. "If you don't hold me responsible for the bad things... you can't hold me responsible for the good things either."

  Elias paused in the doorway. He turned his head slightly.

  "What do you mean?"

  "If I didn't choose to be late... then I didn't choose to stay. I didn't choose to love you. It was just... chemistry. Causality." She took a step toward him. "You can't be grateful for a sunset, Elias. And you can't be grateful for me."

  Elias frowned. For a second, the mask slipped. A flicker of confusion, perhaps a flicker of pain. But then he corrected it. He adjusted his posture. He re-engaged the objective stance.

  "Gratitude is also a reactive attitude," he said softly. "But I can appreciate your utility in my life. I can value your presence."

  "Utility," she said. The word hung in the air, heavy and dead.

  "I value you, Sarah."

  "No, you value the function I perform. You're treating me like a dog that learned to fetch. Good girl, no scolding when she pees on the rug because she's just a dog."

  "That's not fair."

  "Isn't it? You've made yourself a god looking down at a machine. You won't argue with me because you don't argue with toasters. You just fix them or throw them away."

  Elias sighed. It was a sigh of patience, the kind one uses with a toddler having a tantrum. "You're emotional. We should eat."

  He turned and walked into the dining room.

  Sarah stood in the kitchen. She looked at the empty space on the table where the lasagna should have been. She looked at the fork he had washed.

  She realized then that the fight was over. Not because they had resolved anything, but because he had left the battlefield. He had dismantled the arena. You cannot have a relationship without the possibility of offense. You cannot have intimacy without the risk of being hurt. By insulating himself from her faults, he had insulated himself from her.

  She walked into the dining room. Elias was sitting, waiting, a placid smile on his face. He looked at her with benevolent, empty eyes. He was ready to manage her through the meal. He was ready to optimize their caloric intake and conversational exchange.

  Sarah pulled out her chair. She sat down. She looked at him, really looked at him, searching for the man who used to get jealous when she danced with other men, the man who used to cry when his father died.

  "I'm leaving," she said.

  Elias didn't flinch. He didn't look hurt. He looked concerned, in the way a doctor looks at a patient refusing medication.

  "That is a significant decision," he said calmly. "Are you sure that is a rational response to the situation? Perhaps you are reacting emotionally."

  "Maybe," Sarah said. She stood up. "Or maybe I'm the only one of us who is actually acting."

  "Sarah, sit down. We can discuss this. I can help you work through the impulse."

  "You can't help me, Elias. You don't see me."

  "I see you perfectly."

  "No," she said, picking up her purse. "You see the chain. You don't see the link."

  She walked to the door. She expected him to run after her. She expected him to grab her arm, to beg, to shout, to do something human and messy and irresponsible.

  Behind her, the chair scraped against the floor. He was standing up. But he wasn't running. He was calculating the probability of her return.

  "Sarah," he called out. His voice was steady. "If you leave, the causal conditions of your unhappiness will likely increase. I am the optimal variable for your stability."

  She opened the door. The night air was cold, real, and biting.

  "Goodbye, Elias," she said.

  "Goodnight, Sarah. I'll leave the porch light on. It reduces the risk of you tripping."

  She closed the door. She stood on the porch for a moment, waiting for the resentment. Waiting for the hurt. It was there, burning in her chest, fierce and bright. It was the most beautiful thing she had felt all night.

  Inside, through the window, she saw Elias sit back down. He picked up his fork. He began to eat the cold lasagna, alone, perfectly calm, perfectly reasonable, and entirely alone. He had saved himself from the pain of resentment, but in doing so, he had starved himself of the love that required the risk of it.

  Sarah walked to her car. She started the engine. She didn't know where she was going, but for the first time in months, she knew it was her choice.
