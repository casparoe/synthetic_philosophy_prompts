          *   *Restrictionist (Experimental Philosopher):* Defends the challenge to intuition-based methodology based on empirical variation (Weinberg, Nichols, Stich; Machery et al.). Skeptical of the "expertise defense."
          *   *Traditionalist (Epistemologist):* Defends intuition-based methodology. Argues for the "expertise defense" (philosophers have trained intuitions).
      *   **Core Topics:**
          *   Cross-cultural variation in Gettier judgments (WNS).
          *   Cross-cultural variation in reference judgments (Gödel/Schmidt case - MMNS).
          *   The "Expertise Defense" (can training rescue intuitions?).
          *   Empirical vs. Philosophical nature of the disagreement (is it hostage to replication or conceptual?).
      *   **Tone/Style:** Philosophical dialogue, rigorous, precise, avoiding caricature.
      *   **Ending:** Open but insightful conclusion regarding the nature of the dispute (empirical vs. philosophical).

  2.  **Character Conception:**
      *   *Restrictionist:* Let's call her **Elena**. She needs to be data-driven, cautious about universal claims, and focused on the reliability of evidence.
      *   *Traditionalist:* Let's call him **Marcus**. He needs to be nuanced, acknowledging the data but arguing for the specific epistemic status of *philosophical* intuition, not folk intuition.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. A coffee shop or office. Establish the tension.
      *   **The Challenge (WNS & MMNS):** Elena brings up the empirical findings. Marcus acknowledges them but questions their relevance to *philosophers*.
          *   *Key detail:* Mention East Asian vs. Western Gettier cases (WNS 2001).
          *   *Key detail:* Mention Gödel/Schmidt reference cases (MMNS 2004).
      *   **The Expertise Defense:** Marcus articulates the defense. It's not just "philosophers are smarter." It's about training, eliminating bias, and understanding the *concept* rather than the *word*.
          *   *Analogy:* Math or wine tasting.
      *   **The Restrictionist Counter:** Elena attacks the expertise defense empirically.
          *   *Point 1:* No evidence that training stabilizes intuitions (Williamson's claim vs. data).
