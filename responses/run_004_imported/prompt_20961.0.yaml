answer: |-
  This is an excellent question. In fact, you have hit upon the single most common and important objection to dialetheism. If you were sitting in Graham Priest's seminar, this is exactly the first challenge he would expect you to raise.

  The short answer is: **Dialetheists reject the Principle of Explosion.**

  The longer answer requires unpacking *how* they reject it, why they think they are allowed to, and why this doesn't make their position collapse into absurdity. Here is the breakdown of why dialetheism is treated as a serious philosophical position rather than an obvious *reductio*.

  ### 1. Dialetheism $\neq$ Trivialism
  Your intuition is correct that if you accept a contradiction *and* you accept classical logic, you are committed to **Trivialism** (the view that every proposition is true, including "the moon is made of cheese").

  *   **Trivialism:** $\forall p (True(p))$
  *   **Dialetheism:** $\exists p (True(p) \land True(\neg p))$

  Dialetheists explicitly deny trivialism. Graham Priest does not believe the moon is made of cheese. He believes *some* contradictions are true (specifically semantic paradoxes like the Liar), but not *all*.

  For this distinction to hold, the logic connecting the premises to the conclusion must change.

  ### 2. The Solution: Paraconsistent Logic
  In classical logic, the Principle of Explosion (*Ex Falso Quodlibet*) is valid:
  $$A, \neg A \vdash B$$
  This is valid because, in classical model theory, there is no model where $A$ and $\neg A$ are both true. Therefore, there is no model where the premises are true and the conclusion false. The inference is vacuously valid.

  Dialetheists argue that since there *are* true contradictions (like the Liar Sentence), there **are** models where $A$ and $\neg A$ are both true. Therefore, the classical justification for explosion vanishes.

  To handle this, dialetheists employ **Paraconsistent Logic** (specifically, Priest often uses a system called **LP**, or the "Logic of Paradox").
  *   In LP, truth values are not just $\{True, False\}$. They are $\{True, False, Both\}$.
  *   A logical inference is valid if the truth value is "preserved" from premises to conclusion.
  *   In LP, if $A$ is "Both" and $\neg A$ is "Both," $B$ can still be "False." Since "False" is not a designated (acceptable) truth value for a conclusion, the inference from contradiction to $B$ fails.

  By switching to a paraconsistent logic, they block the explosion. They can accept $A \land \neg A$ without being forced to accept $B$.

  ### 3. Why Take It Seriously? (The Philosophical Payoff)
  If they have to change the laws of logic to make this work, why bother? Why not just stick with classical logic and say the Liar Sentence is meaningless?

  Logicians take dialetheism seriously because it solves several intractable problems that classical logic struggles with:

  **A. Semantic Closure**
  Classical logic (following Tarski) handles the Liar Paradox by creating a hierarchy of languages (object language, meta-language, etc.). You cannot define truth for a language within that same language.
  *   **The Problem:** Natural language *is* semantically closed. We talk about truth in English using English. Tarski's solution requires us to treat natural language as fundamentally flawed or inconsistent in a way that prevents formalization.
  *   **The Dialetheist Solution:** Priest argues we should formalize natural language as it is. If natural language generates contradictions, our logic should be robust enough to handle them without crashing. Dialetheism allows for a consistent theory of truth within a single language.

  **B. Russell's Paradox**
  Similar to the Liar, naive set theory leads to contradictions (the set of all sets that do not contain themselves). Classical mathematics fixes this by restricting set formation (ZFC). Dialetheists argue we could keep naive set theory and simply accept the contradiction as a true dialetheia, containing the damage with paraconsistent logic.

  **C. Vagueness and Borderline Cases**
  Consider a heap of sand. Remove one grain. Is it still a heap? Eventually, you reach a borderline case where it seems to be both a heap and not a heap. Dialetheism offers a way to model this transition without arbitrary cutoff points.

  ### 4. The Cost: What Do They Give Up?
  You might ask: "If they can just change the logic to avoid explosion, isn't that cheating?"

  There is a cost. To block Explosion in systems like LP, you usually have to invalidate other classically valid inference rules. The most famous casualty is **Disjunctive Syllogism**:
  $$A \lor B, \neg A \vdash B$$

  In classical logic, this is rock solid. In LP, if $A$ is "Both" and $B$ is "False":
  1.  $A \lor B$ is "Both" (because $A$ is Both).
  2.  $\neg A$ is "Both".
  3.  But $B$ is "False".
  4.  So, you can have true premises and a false conclusion.

  Priest argues this is an acceptable trade-off. He argues that Disjunctive Syllogism is only *generally* reliable, but fails in the specific, rare cases where true contradictions occur (like the Liar). Most logicians find this a high price to pay, which is why dialetheism remains a minority view—but it is not an *illogical* view. It is a coherent system with different axioms.

  ### 5. Summary
  Your intuition that "Contradiction + Classical Logic = Trivialism" is perfectly correct. Dialetheists agree with you!

  Their position is not:
  > "Contradictions are true, and classical logic holds." (This would be self-defeating).

  Their position is:
  > "Contradictions are true, **therefore classical logic is slightly wrong**, and we should use paraconsistent logic which contains contradictions without exploding."

  It is treated as worth debating because it offers a unified solution to semantic paradoxes, vagueness, and set-theoretic anomalies without resorting to artificial hierarchies, provided one is willing to revise classical inference rules. It is a cost-benefit analysis, not a logical error.

  **Recommended Next Step:**
  If you want to see the mechanics of this, look up the truth tables for **Kleene's Strong Three-Valued Logic** or **Priest's LP**. Seeing how the "Both" value propagates through $\land, \lor,$ and $\to$ usually makes the "blocking" of explosion click immediately.
