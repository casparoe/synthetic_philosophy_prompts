      *   **How Paraconsistency Works:**
          *   In classical logic, truth is preserved from premises to conclusion. If premises are contradictory, there is no model, so vacuously everything follows.
          *   In paraconsistent logic (like LP), there are models where contradictions are true *without* every sentence being true.
          *   Analogy: Think of truth values not as binary switches but maybe as overlapping circles or a three-valued system (True, False, Both).
      *   **Distinguishing Dialetheism from Trivialism:**
          *   *Dialetheism:* Some contradictions are true (e.g., Liar).
          *   *Trivialism:* All propositions are true (Moon is cheese).
          *   Dialetheists explicitly reject trivialism. They need a logic that allows the former without entailing the latter.
