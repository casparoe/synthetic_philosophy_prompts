prompt: |-
  Quick one — I'm prepping a lecture on Maimonides and there's a snag in his account of sacrifice that I can't get past. Here's the Guide, 3:32, on why God instituted animal sacrifice to begin with (Friedländer's translation, which is what's on my shelf, so bear with the clunky Victorian prose):

  "Many precepts in our Law are the result of a similar course adopted by the same Supreme Being. It is, namely, impossible to go suddenly from one extreme to the other: it is therefore according to the nature of man impossible for him suddenly to discontinue everything to which he has been accustomed. ... But the custom which was in those days general among all men, and the general mode of worship in which the Israelites were brought up, consisted in sacrificing animals in those temples which contained certain images, to bow down to those images, and to burn incense before them... It was in accordance with the wisdom and plan of God, as displayed in the whole Creation, that He did not command us to give up and to discontinue all these manners of service; for to obey such a commandment it would have been contrary to the nature of man, who generally cleaves to that to which he is used... For this reason God allowed these kinds of service to continue; He transferred to His service that which had formerly served as a worship of created beings, and of things imaginary and unreal, and commanded us to serve Him in the same manner... By this Divine plan it was effected that the traces of idolatry were blotted out, and the truly great principle of our faith, the Existence and Unity of God, was firmly established; this result was thus obtained without deterring or confusing the minds of the people by the abolition of the service to which they were accustomed and which alone was familiar to them."

  So the whole move is: sacrifice was never the point in itself, its a concession to an idol-worshiping habit people already had, redirected toward the right object so it could eventually be phased out in favor of prayer. Clever, but it doesn't square with Genesis for me — Abel's offering, and then Noah's after the flood (the "sweet savor" God smells), both get accepted with what sure looks like divine approval, and neither guy has any idolatry to be weaned off — there's no organized star worship in the story yet for them to be reacting against. Does Maimonides have a way of handling those cases somewhere in his wider picture, or is this honestly just a hole in the argument?
