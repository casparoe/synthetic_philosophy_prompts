          3.  **Independence:** Voters are influenced by media, parties, peers. Violation of independence reduces the "wisdom of crowds" effect.
          4.  **Common Interest:** CJT assumes everyone wants the "correct" outcome. In politics, interests conflict (zero-sum games). What is "correct" for one group might be "wrong" for another.
      *   *Representative Democracy:* Representatives might have higher $p$ (expertise, time to study) even if $n$ is smaller.
      *   *Conclusion:* The math doesn't automatically favor direct democracy because the *inputs* (competence, independence, definition of truth) are different.

