          2.  Independent voting (no collusion, no influence).
          3.  Individual competence ($p$) is greater than 0.5 (better than random chance).
          4.  Sincere voting (voting for what they believe is true, not strategically).
      *   *Conclusion:* As group size ($n$) increases, the probability of a correct majority decision approaches 1.

  3.  **Address Point 1: Jury Size (12 vs. 500):**
      *   *Mathematical validity:* Yes, CJT suggests larger is better *if* assumptions hold.
      *   *Real-world constraints:*
