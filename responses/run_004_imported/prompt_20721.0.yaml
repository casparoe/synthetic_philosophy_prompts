          *   **Diminishing Returns:** The curve flattens quickly. Going from 1 to 12 helps a lot. Going from 12 to 500 helps marginally compared to the cost.
          *   **Assumption Violation:** Are jurors actually $> 0.5$ competent? Are they independent? (Media influence, groupthink during deliberation).
      *   *Legal Precedent:* *Williams v. Florida* (1970) ruled 6-person juries are constitutional, though 12 is traditional. Research suggests 12 is a "sweet spot" for minority representation and deliberation quality, not just raw accuracy.

