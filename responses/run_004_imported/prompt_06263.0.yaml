answer: |-
  Your intuition is spot-on, and your critique partner is looking at the surface level rather than the logical structure. These are not the same sentence. In linguistics and logic, they represent two entirely different types of conditional statements, and they perform different narrative jobs.

  You should keep both, provided the second line is thematically earned. Here is the breakdown of the logical difference, why the swap feels wrong, and how to explain it to your partner.

  ### 1. The Logical Difference: Indicative vs. Counterfactual

  **Line 1 (Early): The Indicative Conditional**
  > *"If Marcus didn't spike the wine, one of the other four people at that table did."*

  *   **Grammar:** Past Simple + Past Simple (*didn't / did*).
  *   **Logic:** This is an **open condition**. At this point in the story, the detective does not know the truth value of the antecedent (whether Marcus did it or not).
  *   **Meaning:** This is a statement of **exclusion**. It establishes the "Closed Circle" mystery trope. It means: *The wine was definitely spiked. The spiker is in this room. Therefore, the set of {Marcus + 4 Others} contains the perpetrator.*
  *   **Narrative Job:** Setting the stakes and the suspect pool.

  **Line 2 (Late): The Counterfactual Conditional**
  > *"If Marcus hadn't spiked the wine, one of the other four would have."*

  *   **Grammar:** Past Perfect + Conditional Perfect (*hadn't / would have*).
  *   **Logic:** This is a **counterfactual** (or subjunctive) condition. By using this tense, the speaker acknowledges that the antecedent is **false**. We *know* Marcus did spike the wine.
  *   **Meaning:** This is a statement of **inevitability** or **capacity**. It speculates on an alternate timeline. It implies that the *opportunity* or *motive* existed for the others, even if they didn't act.
  *   **Narrative Job:** Thematic resonance. It suggests the murder was going to happen one way or another, or that the other suspects were just as culpable in spirit, even if Marcus pulled the trigger.

  ### 2. Why Swapping Them Feels Wrong

  You mentioned that swapping them reads like she is "asserting something false" or "jumping the gun." That is because the tenses dictate what the character knows.

  *   **If you put Line 2 early:** *"If Marcus hadn't spiked the wine, one of the others would have."*
      *   **The Problem:** This implies she *already knows* Marcus is guilty. If she says this before the reveal, she is lying to the reader or she is psychic. It breaks the mystery.
  *   **If you put Line 1 late:** *"If Marcus didn't spike the wine, one of the others did."*
      *   **The Problem:** This sounds like she still isn't sure. It weakens the resolution. It sounds like she is still hedging her bets rather than reflecting on the tragedy of the event.

  ### 3. The Narrative Risk (A Caveat)

  While your partner is wrong about redundancy, there is a craft reason they might be hesitating. Line 2 is a **very heavy claim.**

  By saying *"one of the other four would have,"* your detective is implying that the other four were **capable and willing** to commit the murder, but simply got beaten to the punch.

  *   **If the other four are innocent bystanders:** Line 2 is logically unsound and might confuse readers. (Why would an innocent person have spiked the wine?)
  *   **If the other four all had motive but lacked the nerve:** Line 2 is brilliant. It paints a picture of a table full of people who wanted the victim dead, but only Marcus had the guts to do it.

  Make sure your story supports the weight of that second line. If it does, it's not redundant; it's an escalation from *who did it* to *why it happened*.

  ### 4. How to Explain This to Your Partner

  You don't need to get into a linguistic debate, but you can frame it in terms of "Story Logic." You can say something like:

  > "I looked at those lines again, and I'm going to keep both. The first one is **deductive**; it establishes the suspect pool when we don't know the killer yet. The second one is **counterfactual**; it's spoken after we know Marcus is guilty, and it comments on the inevitability of the crime. They look similar, but they happen in different timelines of the investigation."

  ### Summary
  *   **Line 1:** "One of these people is the killer." (Fact-finding)
  *   **Line 2:** "The killing was inevitable." (Thematic reflection)

  Your partner sees repetition of words; you are writing a progression of logic. Trust your gut on this one. The shift in tense is doing heavy lifting for your mystery's structure.
