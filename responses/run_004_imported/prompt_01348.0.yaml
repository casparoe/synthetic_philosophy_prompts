      *   **Constraint:** Flag tensions or underdetermination in his principles.
      *   **Format:** A few solid paragraphs on each policy (not single-line verdicts).
      *   **Tone:** Academic, analytical, suitable for an EPQ student (showing nuance).

  2.  **Deconstruct Dummett's Core Arguments (based on *On Immigration and Refugees*):**
      *   *The Presumption:* There is a fundamental human right to move. Restrictions need specific, weighty justification.
      *   *Racism:* He argues UK immigration controls since 1962 were explicitly designed to keep the country white. This is a moral stain.
      *   *The "Submersion" Clause:* He concedes a community has a right to preserve its character, but sets the bar extremely high. It's not about economics or minor cultural shifts; it's about existential threat to the political community's cohesion. He explicitly critiques Thatcher's use of "swamped" as racially coded fear-mongering.
      *   *Global Justice:* Rich nations have caused poverty in poor nations (colonialism, economic exploitation). Therefore, they have a duty to accept people from those nations.
      *   *Refugees:* Strict adherence to the Geneva Convention. Refugees cannot be returned to danger. Processing must be fair and humane.

  3.  **Apply to Policy 1: Ending Free Movement (Brexit):**
      *   *Context:* End of automatic right for EU citizens to live/work in UK. Introduction of points-based system.
      *   *Dummett's Likely View:*
          *   *Negative:* It restricts movement. It goes against the "presumption of free entry." It likely harms EU citizens (many from poorer EU states like Poland, Romania) who contributed to the UK.
          *   *Nuance:* Dummett distinguishes between *refugees* and *economic migrants*, though he is generous to both. EU migration was largely labor mobility.
          *   *The "Submersion" Test:* Did Brexit supporters argue "submersion"? Yes ("Take Back Control," concerns about public services). Dummett would likely view this as a rehash of the racist anxieties he criticized in the 60s/70s, just directed at Europeans rather than Commonwealth citizens.
          *   *Tension:* Dummett was a Europeanist (federalist). He believed in supranational cooperation. Ending free movement undermines the EU project, which he likely saw as a bulwark against nationalism.
          *   *Conclusion:* He would almost certainly oppose it, seeing it as a retreat into nationalism without meeting the high bar of the "submersion" justification.

  4.  **Apply to Policy 2: Rwanda Asylum Scheme:**
      *   *Context:* Flying asylum seekers to Rwanda for processing. If claims accepted, they stay in Rwanda; if not, returned to origin. Aim: deter Channel crossings.
      *   *Dummett's Likely View:*
          *   *Geneva Convention:* This is the big one. The Convention prohibits *refoulement* (returning to danger). Outsourcing processing to a third country raises huge risks of indirect *refoulement*.
          *   *Responsibility:* Rich states (UK) have obligations. Shifting them to a poorer state (Rwanda) might look like "burden sharing," but if the motive is *deterrence* rather than *care*, Dummett would object.
          *   *Human Rights:* Dummett cares about the *treatment* of individuals. The uncertainty and removal from the UK community likely violates his view of humane treatment.
          *   *Tension:* Dummett acknowledges states have limited capacity. If the UK system is genuinely broken, is outsourcing permissible? Probably not, because the *intent* is to reduce numbers, not to help refugees.
          *   *Conclusion:* Strong condemnation. It violates the specific duties to refugees and treats them as pawns rather than rights-holders.

  5.  **Identify Tensions/Underdetermination (Crucial for EPQ):**
      *   *Submersion vs. Free Entry:* How do we measure "submersion"? Dummett leaves this vague. Would he accept *any* democratic mandate for restriction? He respects democracy but thinks rights trump majority whim.
      *   *EU vs. Global South:* Does ending EU free movement matter less if it opens spots for Global South refugees? (Unlikely he'd think this, but it's a trade-off).
