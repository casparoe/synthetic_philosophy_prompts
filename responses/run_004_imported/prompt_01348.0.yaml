answer: |-
  This is a fascinating angle for an EPQ. Dummett is a unique case because he applied the rigorous analytical standards of a logician to political morality, insisting that arguments for restriction must meet a high burden of proof. Reconstructing his views on post-2011 policies requires extrapolating from his core axiom: that freedom of movement is a fundamental human right, and state restrictions are *prima facie* unjust unless they meet specific, narrow exceptions.

  Here is a reconstruction of how Dummett would likely have reasoned through the end of EU free movement and the Rwanda scheme, based on the principles in *On Immigration and Refugees*.

  ### 1. The Ending of Free Movement (Brexit)

  Dummett would almost certainly have viewed the termination of free movement for EU citizens as a moral regression, primarily because it reverses the "presumption in favour of free entry" without satisfying his strict criteria for restriction. In *On Immigration and Refugees*, Dummett argues that the burden of proof lies entirely on the state to justify why someone should be kept *out*, not on the individual to justify why they should be let *in*. By replacing automatic entry with a points-based system, the UK government effectively institutionalized the assumption that foreigners are unwanted unless they prove their economic utility. Dummett would argue this treats human beings as economic units rather than rights-holders. Furthermore, given his historical analysis that UK immigration controls since 1962 were designed to maintain a "white Britain," he would likely have scrutinized the rhetoric surrounding Brexit for similar racialized undertones. While the target shifted from Commonwealth citizens to Europeans, the appeal to "taking back control" of borders often relied on the same anxieties about cultural dilution that he identified in Thatcher's "swamped" comment. He would likely contend that unless the state could prove that EU migration posed an existential threat to the political cohesion of the UK (his "submersion" clause), the restriction is unjustified.

  However, there is a nuance here regarding his "right not to be submerged." Dummett conceded that a political community has a legitimate interest in preserving its character, but he set the bar for this exception incredibly high. He would likely ask whether the end of free movement was a proportionate response to actual submersion or a preemptive strike against a imagined threat. Given that EU migration was largely circular and labor-driven, he would probably argue that the "submersion" threshold was not met. Moreover, Dummett was a committed European federalist who believed supranational cooperation was essential to mitigating the nationalism that leads to war and racism. He would likely argue that ending free movement weakens the European project, thereby increasing the long-term risk of the very nationalist hostilities that make refugees in the first place. Therefore, even if one argued that the UK needed to slow migration to maintain social cohesion, Dummett would counter that damaging the EU undermines global stability, which is a greater evil.

  **Potential Tension:** The difficulty in applying Dummett here lies in the democratic mandate. Dummett respected democratic processes, yet he viewed rights as trumps against majority whim. If a majority voted for Brexit partly on the grounds that they *felt* submerged, Dummett faces a tension between respecting the democratic expression of the "right not to be submerged" and his own philosophical insistence that such feelings are often manipulated by racism. He would likely resolve this by arguing that democratic votes cannot legitimize unjust restrictions, but this leaves him vulnerable to the charge of elitism—a tension he acknowledged but never fully resolved.

  ### 2. The Rwanda Asylum Scheme

  On the 2022 scheme to fly asylum seekers to Rwanda, Dummett's reasoning would likely be even more uncompromising, grounded in his specific interpretation of the Geneva Convention and the obligations of rich states. Dummett distinguishes sharply between economic migrants (to whom the presumption of free entry applies) and refugees (to whom absolute protection applies). He argues that rich nations, having often contributed to the poverty and instability of poorer nations through colonialism and economic policy, have a duty of justice to accept refugees. The Rwanda scheme, designed explicitly as a deterrent to reduce Channel crossings, would strike him as a violation of this duty. By outsourcing processing to a third country to make the journey less appealing, the UK is effectively penalizing refugees for exercising their right to seek asylum. Dummett would argue that the *motive* of the policy is disqualifying: it prioritizes border control over human safety, treating refugees as leverage rather than individuals with rights.

  Furthermore, Dummett would be deeply skeptical of the "safeguards" proposed in such schemes. His philosophical method demanded clarity and logical consistency; he would likely point out the contradiction in claiming to uphold the Geneva Convention while removing claimants to a jurisdiction where their integration is not guaranteed and from which they might face indirect *refoulement* (return to danger). In *On Immigration and Refugees*, he emphasizes that the obligation to refugees is immediate and non-negotiable. He would likely argue that if the UK's processing system is backlogged, the solution is to increase capacity and resources, not to export the problem to a poorer nation. This touches on his principle of global justice: it is unjust for a wealthy state to pay a poorer state to manage the consequences of global inequality that the wealthy state helped create. He would view the Rwanda scheme not as "burden sharing," but as burden dumping.

  **Potential Tension:** The area where Dummett's principles might be underdetermined here concerns *capacity*. He admits states have limits on how many people they can integrate without social fracture. If the UK government argued (plausibly or not) that the asylum system was so overwhelmed that *no* claims could be processed fairly at home, would temporary outsourcing be permissible? Dummett's principles suggest no, because the right to asylum is urgent. However, if the system collapses, no one gets justice. He does not provide a clear "triage" principle for when a state's administrative capacity is completely exceeded. He assumes that with political will, resources can always be found. If one challenges that assumption, his framework offers little guidance on how to manage a genuine humanitarian crisis other than to demand the state try harder.

  ### Summary of Theoretical Tensions for your EPQ

  For your evaluation, the most critical tension to flag is between Dummett's **universalism** and his **communitarian concession**. He argues for universal human rights (free entry, refugee protection) but carves out an exception for the "right not to be submerged." In both the Brexit and Rwanda cases, the government justifies its policy using a version of this "submersion" argument (protecting public services, cultural cohesion, or system capacity). Dummett's philosophy relies on the claim that these justifications are usually pretexts for racism or economic selfishness. However, he does not provide a precise metric for when "submersion" becomes real. This leaves his theory powerful as a critique of bad faith arguments, but potentially vulnerable when facing genuine, non-racist capacity constraints. In your EPQ, you could argue that Dummett is better at diagnosing the *moral failures* of immigration policy than at providing a blueprint for managing *scarcity*, which is the central challenge of modern governance.
