      *   *Check:* Did I honor the shared axioms? Mention them briefly to show understanding.
      *   *Check:* Is the verdict clear? I need to make sure I don't sound wishy-washy. I will argue that **Individual Monotonicity** is the superior axiom and **IIA** should be discarded.
      *   *Reasoning:* IIA is vulnerable to the "red herring" critique. Adding an option that no one would ever choose shouldn't change the outcome, sure. But in bargaining, the *existence* of an option changes the threat point or the perception of fairness, even if not chosen. Actually, the stronger argument against IIA is that it makes the solution insensitive to the *shape* of the frontier away from the solution point, which encodes information about relative concessions. KS captures the proportional concession idea better.
      *   *Physics Analogy:* Think of IIA as ignoring boundary conditions because they aren't at the equilibrium point. Think of IM as respecting the global constraints.

  6.  **Final Polish:**
