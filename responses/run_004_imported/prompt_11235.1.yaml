answer: |-
  You have done your homework, and your intuition is spot-on. The "pop Catholicism" version of Aquinas on tyrannicide is usually a soundbite taken from his *Commentary on the Sentences* (written when he was very young, around 1254), ignored against the much more cautious, mature position he takes in the *Summa Theologiae* and *De Regno* (On Kingship).

  For your uncle to sound authentic, he shouldn't be quoting canon law like a lawyer; he should be worried about **order** and **presumption**. Aquinas isn't a revolutionary; he is a metaphysician of order. He fears the cure being worse than the disease.

  Here are the three moving parts you need, broken down for dialogue construction, followed by a sample of how that conversation might sound.

  ### 1. The Usurper vs. The Legitimate Tyrant
  This is the Colonel's strongest theological foothold, but the Uncle will complicate it.

  *   **The Distinction:** A **Legitimate Tyrant** has a rightful claim to the office (inheritance, election) but rules unjustly. A **Usurper** has no claim to the office at all; he seized it by force or fraud.
  *   **The Thomistic View:** It is much easier to justify removing a usurper. Because he never held the *authority* of the office, killing him isn't technically "killing a ruler"; it's repelling an aggressor.
  *   **The Uncle's Counter:** Time matters. If the usurper has held power for ten years, has the community tacitly consented? Has the "usurpation" hardened into "custom"? The Uncle might argue that after a decade, the distinction blurs. The state has organized around him. Removing him now might collapse the structure entirely.

  ### 2. Private Presumption vs. Public Authority (The Crucial Hurdle)
  This is the heavy lifter in the scene. This is where Aquinas slams the door on the "lone hero."

  *   **The Distinction:** Aquinas distinguishes between a **Private Person** and a **Public Person**.
  *   **The Thomistic View:** In the *Summa* (II-II, Q. 42, A. 2), Aquinas argues that while tyranny is evil, killing a tyrant by **private presumption** is sinful. Why? Because it introduces a greater evil: **Sedition**. If any private citizen can decide a ruler is a tyrant and kill him, no government can function. It invites anarchy.
  *   **The Requirement:** Removal must be undertaken by **Public Authority**. This doesn't necessarily mean the current government (obviously), but it means some representative body, a successor mechanism, or the "community as a whole" acting through a designated channel.
  *   **The Uncle's Argument:** "Thomas doesn't forbid the removal, Colonel. He forbids *you* from doing it. You are a private man in a uniform. Unless the Senate, the Court, or the People have formally stripped him of his mandate, your sword is not justice; it is murder. You cannot make yourself the judge, jury, and executioner."

  ### 3. The Shift: Young Thomas vs. Mature Thomas
  This gives the Uncle his specific scholarly texture.

  *   **Young Thomas (*Commentary on the Sentences*):** He is closer to John of Salisbury. He suggests that killing a tyrant can be meritorious and praiseworthy. He focuses on the *virtue* of the act.
  *   **Mature Thomas (*De Regno* & *Summa*):** He becomes a realist. He worries about the **precedent**. He writes that if you allow tyrannicide, wicked men will use it as an excuse to kill *good* princes. He shifts focus from the *act* to the *consequences*.
  *   **The Uncle's Angle:** "When Thomas was a boy, he thought it was about merit. When he died, he knew it was about order. He realized that the blood of a tyrant often waters the seeds of a worse tyranny."

  ### How to Put This in the Uncle's Mouth
  Avoid Latin terms unless the Uncle translates them immediately. Focus on the **metaphysics of order**. The Uncle shouldn't sound like he's forbidding the act out of cowardice, but out of a fear that the Colonel is trying to play God.

  **Key themes for the dialogue:**
  1.  **The Greater Evil:** Will this save the nation, or break it?
  2.  **The Office vs. The Man:** You are attacking the office by acting without authority.
  3.  **The Precedent:** What happens when the next Colonel decides *you* are the tyrant?

  ### Sample Dialogue Sketch
  *Context: The Uncle (let's call him Father Thomas) and the Colonel (David) in a quiet study, night before the coup.*

  **David:** "He's a usurper, Uncle. Ten years ago he broke the law to take the chair. Aquinas says a usurper isn't a ruler. He's an aggressor. I'm not killing a president; I'm stopping a criminal."

  **Father Thomas:** "You're quoting the Thomas who was twenty years old. The *Sentences*. He was sharp then, like a new knife. But he dulled that edge later. In the *Summa*, he asks the harder question: *By what right do you swing the blade?*"

  **David:** "By the right of natural law. To protect the innocent."

  **Father Thomas:** "Natural law protects the community, David. Not just the innocent, but the *order* that keeps them safe. Thomas says if a private man decides a ruler is a tyrant, he commits sedition. Even if he's right about the tyranny, he's wrong about the authority. You are a private man. You have no mandate from the courts, no vote from the people. You have a gun and a grievance."

  **David:** "So we let him starve the south? We let him jail the judges? Because waiting for a 'mandate' is waiting for never."

  **Father Thomas:** "I know. But Thomas warns us: the cure must not be worse than the disease. If you kill him, you teach every major with a grudge that the sword is the law. You break the seal of authority. The next man who comes after you won't be a colonel with a conscience. He'll be a warlord with a god complex. Thomas realized that tyrannicide by private hands doesn't end tyranny. It just rotates the tyrant."

  **David:** "So what? We pray for his heart to change?"

  **Father Thomas:** "No. But if he is to fall, it must be the *body* that casts him out, not the *hand*. If the generals stand together, if the courts declare the seat vacant... then it is public justice. If it is just you, in the shadows... it is murder. And you cannot build a just republic on a foundation of murder."

  ### One Nuance to Watch (The "Trap")
  Be careful not to make the Uncle a pacifist. He isn't saying "Killing is always wrong." He is saying "**Procedural justice matters even with tyrants.**"

  If the Colonel can argue that the "Public Authority" *has* spoken (e.g., the Congress is in hiding but authorized this, or the Constitution has a clause for this), the Uncle's argument weakens. The Uncle's strongest point is that the Colonel is acting **unilaterally**.

  ### Summary for your notes:
  1.  **Usurper:** Easier to remove, but 10 years of rule complicates the "illegitimacy."
  2.  **Private vs. Public:** The dealbreaker. Private assassination = Sedition (Sin). Public removal = Justice.
  3.  **Development:** Young Aquinas = Focus on Merit. Old Aquinas = Focus on Consequence/Order.

  This gives your Uncle moral weight without making him a caricature. He isn't protecting the President; he's protecting the *Concept of Law* from the Colonel.
