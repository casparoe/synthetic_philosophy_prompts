      *   *Argument 3: Severity and Thresholds (Sufficiency vs. Aggregation).*
          *   Dust specks are *trivial*. They don't change life trajectory.
          *   The degenerative condition is *catastrophic*. It removes agency entirely.
          *   *Key Concept:* Prioritarianism or Sufficiency. There is a threshold of suffering below which aggregation is permissible, and above which it is not. A dust speck doesn't violate rights; letting someone degenerate might violate a right to basic care.

      *   *Argument 4: The "Repeated Game" Problem.*
          *   Torture/Specks is a one-off.
