      *   **Case B: National Drug Plan Policy**
          *   *Nature:* Ongoing institution, repeated game, social contract.
          *   *Agents:* Bureaucracy, government, taxpayers, patients.
          *   *Harm:* Death/Severe Degeneration (high intensity) vs. Mild Inconvenience (low intensity).
          *   *Certainty:* Probabilistic. The "millions" might not all need the inhaler; the "30 patients" are identified.
          *   *Relationship:* The state has a fiduciary duty to *citizens*, not just *utility*.
          *   *Goal:* Maintain trust, fairness, and stability of the healthcare system over time.

  3.  **Identify the Structural Disanalogies (The "Legitimate Philosophical Work"):**

      *   *Argument 1: The Institutional Role & Social Contract.*
          *   Yudkowsky's case is a "God's eye view" utilitarian calculation.
          *   Health agencies are *institutions* embedded in a society. Their legitimacy depends on perceived fairness, not just raw output. If the public sees the agency letting 40 people die horribly to save everyone a tiny sniffle, they lose trust. Loss of trust leads to non-compliance, political backlash, and system collapse.
