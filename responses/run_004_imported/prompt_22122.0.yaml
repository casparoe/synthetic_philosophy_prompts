answer: |-
  The hotel bar was loud enough to mask the eavesdroppers but quiet enough for philosophy. Mara swirled her whiskey, eyeing Julian over the rim.

  "So," she said. "You still believe in dark matter? Honestly? After Laudan?"

  Julian sighed, loosening his tie. "Here we go. The graveyard shift."

  "It's not a shift, it's the view from the balcony," Mara countered. "Look at the list. Caloric fluid. Phlogiston. The crystalline spheres. The luminiferous ether. Every single one was empirically successful. Every single one was ontologically wrong. Why should the Standard Model be the exception? The pessimistic meta-induction isn't a trick, Julian. It's the base rate."

  "Because you're treating theories like lightbulbs," Julian said, leaning in. "Either on or off. Realism isn't about swallowing the whole ontology. It's selective. Look at Fresnel. He predicted the bright spot in the shadow of a disk using wave theory. He thought light waved through an ether. The ether was wrong. But the equations? Maxwell absorbed them. The mathematical structure survived the ontological purge."

  "Selective realism," Mara nodded. "The classic escape hatch. Split the theory into the 'working posits' that do the predictive labor and the 'idle posits' that just fill out the metaphysics. Keep the gold, dump the dross."

  "Exactly. We don't need the ether to believe the field equations are approximately true."

  "But here's the rub," Mara said, tapping her glass. "How do you know which bit is the gold *while you're mining it*? You only know Fresnel's equations were the 'working' part because you're standing in Maxwell's future. From Fresnel's perspective, the ether wasn't idle. It was essential. It explained *why* the waves propagated. If you asked him to split his theory, he'd have said the ether is the core!"

  Julian paused. He took a sip of beer. "That's the hindsight objection. I know it. But it assumes we have no access to structural continuity until the successor theory arrives. I disagree. We can identify robustness."

  "Robustness is just success by another name," Mara shot back. "Caloric theory was robust. It handled heat flow beautifully. Fourier's math is still used. But caloric doesn't exist. If you were a selective realist in 1820, you'd have saved the caloric fluid as the 'working posit' because it was doing the causal heavy lifting. You'd have been wrong."

  "Okay, fair," Julian conceded. "Selective realism isn't a crystal ball. It doesn't guarantee immunity. But it changes the warrant. The argument isn't that we won't be wrong; it's that we have reasons to think the *structure* of the relations is captured, even if the *nature* of the relata isn't."

  "Structural realism," Mara mused. "The math is real, the stuff is optional."

  "Right. When we move from Newton to Einstein, gravity stops being a force and becomes curvature. The ontology flips. But the structural relationships in the limit cases hold. We aren't betting on the 'stuff'—dark matter particles, strings, whatever. We're betting on the structural constraints that any successor theory must satisfy to recover our current data."

  "But that's still circular," Mara pressed. "You're defining 'structural continuity' by looking at what survived past theory changes. You're using the history of science to justify realism, but you're filtering that history through your current definition of what counts as 'structure.' You're saying, 'Look, the stuff that stayed was the real stuff.' Well, of course. The stuff that didn't stay isn't here to be counted."

  Julian rubbed his chin. "So you think the distinction between idle and working is purely retrospective? There's no marker in the present?"

  "I think the marker is 'survival,' and you can't see survival until you're dead," Mara said. "You want to say dark matter is like Fresnel's equations, not like the ether. But to Fresnel, the ether *was* the equations. You're drawing the line where it benefits you, right now, to draw it."

  Julian was quiet for a moment. The bartender clinked a bottle nearby.

  "Here's my concession," Julian said finally. "You're right that we can't be certain. If selective realism claims to solve the PMI completely, it fails. But it's not about certainty. It's about the best explanation for convergence. Independent instruments, different methodologies, they all point to the same structural anomalies in galactic rotation. If that's all 'idle,' then the success of science isn't just a miracle; it's a conspiracy."

  "And if it's a graveyard?" Mara asked. "Maybe convergence just means we're all making the same category mistake. Like everyone agreeing on the humors because they all looked at blood."

  "Then we're doomed," Julian smiled weakly. "But I'd rather bet on the structure than fold on the reality."

  Mara raised her glass. "To the structure, then. May it outlive us both."

  "To the structure," Julian clinked. "Even if we don't know what it's structured of."
