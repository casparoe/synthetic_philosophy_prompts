answer: |-
  You are right to feel that this is more than ordinary office politics. What you are describing is a specific, well-documented, and deeply damaging form of bias. It is not just that your student is being overlooked; it is that his credibility is being systematically undermined due to a disability.

  Here is a perspective on what is likely happening, followed by suggestions on how he might navigate it.

  ### What Is Actually Going On?

  **1. Testimonial Injustice**
  The philosophical term for this is *testimonial injustice*, coined by philosopher Miranda Fricker. It occurs when a speaker is given less credibility than they deserve, solely due to a prejudice the listener holds about the speaker's social identity. In this case, the "identity marker" is his stutter. His colleagues are unconsciously (or consciously) assigning a lower "truth value" to his words because of *how* they are delivered, rather than *what* is being said.

  **2. The Fluency Heuristic**
  Psychologically, humans suffer from a cognitive bias where we equate verbal fluency with competence, intelligence, and honesty. This is the "fluency heuristic." When your student speaks, the cognitive load required for his colleagues to listen to him is slightly higher. Instead of doing the work to bridge that gap, their brains take a shortcut: they assume the difficulty in processing the speech indicates a difficulty in the thought process. When a fluent speaker says the exact same thing, the idea feels "smoother" and therefore "better."

  **3. Epistemic Exploitation**
  Your student is experiencing a form of labor theft. He is doing the analytical work of detecting fraud, but the *social capital* generated by that detection is being transferred to his colleagues. When the manager praises the colleague for a "sharp catch," they are rewarding the performance of competence, not the competence itself.

  **4. The Psychological Toll (Gaslighting)**
  The most dangerous part of this scenario is what you noted: he is beginning to doubt his own judgment. This is a rational response to an irrational environment. If the world consistently tells you that you are wrong, you will eventually believe it, even if the data (his accuracy) says otherwise. This is not just frustrating; it is a threat to his career longevity and mental health.

  ### How He Might Respond

  This is a delicate situation. Confronting it directly can be risky, especially if the management is complicit in the bias. However, staying silent allows the pattern to calcify. Here is a tiered approach he might consider:

  **1. Shift the Medium (The "Paper Trail" Strategy)**
  If the bias is triggered by oral communication, he should minimize oral flagging in high-stakes moments.
  *   **Pre-Meeting Emails:** He can send a brief email to the team or manager prior to the meeting: *"Reviewing Claim #12345. I see red flags regarding X and Y. I will bring this up in the meeting."*
  *   **Post-Meeting Confirmation:** If he raises it in the meeting and is ignored, he follows up immediately via email: *"Per my note in the meeting, I am formally flagging Claim #12345 for fraud due to X and Y."*
  *   **Why this works:** Written text does not stutter. It removes the fluency heuristic from the equation. It also creates an undeniable timestamped record that he identified the issue first.

  **2. Quantify the Discrepancy**
  He needs to move this from a "feeling" to a "dataset."
  *   He should keep a private log of every claim he flags, the reaction he receives, and the ultimate outcome.
  *   If he can demonstrate that he has a higher fraud-detection rate than the colleagues who are being praised, he has objective leverage.
  *   **The Conversation:** Eventually, he may need to speak to his manager. Armed with data, he can say: *"I've noticed a pattern where claims I flag initially are not investigated, but are later pursued when raised by others. My data shows I have a 90% accuracy rate on these flags. I want to ensure my assessments are being weighed on their merit."* This frames it as an efficiency problem for the company, not just a personal grievance.

  **3. Seek "Reasonable Accommodation"**
  Under laws like the ADA (in the US), a stutter is a protected disability.
  *   He is entitled to reasonable accommodations. This could formally include a change in how he communicates critical information.
  *   If the company is resistant, framing this as an accommodation request forces HR to view it through a legal compliance lens rather than a "personality conflict" lens.

  **4. Find an Ally**
  Is there one person on the team who *does* listen? He should cultivate that relationship. In meetings, allies can amplify: *"I think [Student's Name] made a great point about that claim earlier. We should look at that."* This is called "amplification," and it is a powerful tool against testimonial injustice.

  ### How You Can Help as a Mentor

  As his former teacher, your role is vital in helping him maintain his epistemic confidence.

  *   **Validate Reality:** Remind him explicitly: *"Your accuracy has not changed. The environment is failing to process your value. This is a defect in their system, not your skill."*
  *   **Reframe the Narrative:** Help him see that he is not "bad at speaking"; he is working in an environment that is "bad at listening."
  *   **Encourage Documentation:** Urge him to start the log I mentioned above. It protects him legally, but it also protects him psychologically. Seeing the data on paper proves to *him* that he is right, even when they act like he is wrong.
  *   **Discuss Exit Options:** Sometimes, culture is too entrenched to fix. If this is a mid-sized company with a homogenous leadership team, this bias may be baked in. Knowing he has the option to leave for a company with a stronger DEI (Diversity, Equity, and Inclusion) track record can reduce the feeling of being trapped.

  ### Summary

  This is not office politics; it is **ableism disguised as efficiency.**

  Your student is suffering from a credibility deficit imposed by his colleagues' bias. The most effective response is to bypass the bias (by using written communication), document the pattern (to protect his confidence and career), and force the organization to confront the discrepancy between his output and his recognition.

  He is right. They are wrong. He needs to know that you know that.
