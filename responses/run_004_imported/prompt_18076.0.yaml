answer: |-
  1. **The Biological Common Prior**
  Aumann's theorem rests on the Common Prior Assumption—that before we saw our specific evidence, we assigned probabilities the same way. But humans aren't blank slates; we have different neurobiologies, risk tolerances, and cognitive hardware shaped by genes and upbringing. If my brain literally processes uncertainty differently than yours due to biology, isn't that a difference in priors that no amount of evidence can wash out? If so, doesn't the theorem simply fail to map onto human psychology?

  *   **Anticipated Deflection:** "The theorem is just math; if priors differ, one of you is objectively irrational."
  *   **Follow-up:** "I'm not questioning the math, I'm questioning the map. If 'rationality' requires me to ignore the biological reality of my own hardware, aren't you defining rationality as something humans are physically incapable of? At what point does a normative model become useless because it demands we cease to be human?"

  2. **Hanson's Veil of Ignorance**
  Robin Hanson has suggested we resolve prior disagreements by choosing priors behind a 'veil of ignorance,' pretending we don't know which person we turned out to be. But doesn't this just relocate the disagreement? We might agree to use a veil, but we will still disagree on *which* distribution of possible people to use behind that veil. Isn't that just a meta-disagreement about priors that Aumann's theorem can't solve?

  *   **Anticipated Deflection:** "There is a single rational distribution for the veil; disagreement there is also an error."
  *   **Follow-up:** "Who calculates that distribution? If two people disagree on the 'rational' veil, and you apply Aumann to that disagreement, you need a *meta-veil*. Are we not chasing an infinite regress of idealized agreements that never touch the ground?"

  3. **Common Knowledge vs. Mutual Awareness**
  The theorem requires 'common knowledge' of posteriors—I must know your probability, you must know mine, I must know that you know mine, ad infinitum. In actual discourse, we rarely get past the first or second level of that recursion. If we haven't achieved full common knowledge, the theorem's conditions aren't met. So why should I defer to you when we are merely 'mutually aware' rather than in a state of mathematical common knowledge?

  *   **Anticipated Deflection:** "Approximate common knowledge is sufficient for the norm to hold."
  *   **Follow-up:** "How approximate? Is there a threshold where deference becomes mandatory? If you can't specify the threshold, isn't 'approximate common knowledge' just a rhetorical shield that lets you demand deference whenever it suits you, while claiming the math is on your side?"

  4. **The Incentive to Withhold Information**
  If we adopt a norm where I must defer to your stated view once we've shared summaries of our evidence, I lose the incentive to dig for deep, private counter-evidence. If my contrarian research will just be averaged out by your deference norm, why should I bother doing the work? Doesn't universal deference destroy the very diversity of private information that makes aggregation valuable in the first place?

  *   **Anticipated Deflection:** "Agents should share all evidence, not just posteriors, before deferring."
  *   **Follow-up:** "That's computationally impossible for complex worldviews. If the norm requires impossible transparency to be valid, but you still demand deference in the real world where transparency is partial, aren't you advocating for a system that systematically penalizes deep, private investigation?"

  5. **Bounded Rationality and Computational Cost**
  Aumann's agents are logically omniscient; they instantly know all implications of their information. Humans are bounded; we miss connections. If I disagree with you because I haven't had the time or compute to process the implications of my own data, is that an 'error' I should defer on, or a resource constraint I should manage? Why should I treat a computational limit as an epistemic sin?

  *   **Anticipated Deflection:** "Boundedness is just another piece of evidence to update on."
  *   **Follow-up:** "If I update on my boundedness, I might conclude I *shouldn't* try to match your view because I lack the capacity to verify it. If the theorem tells me to trust you despite my inability to verify your reasoning, isn't that asking for blind faith dressed up as Bayesianism?"

  6. **Truth-Seeking vs. Status-Seeking**
  The theorem assumes agents are truth-seekers with common interests. But in podcast debates or academic disputes, status, career incentives, and tribal signaling are often stronger drivers than truth. If I suspect your stated posterior is influenced by a desire for social prestige, the 'common interest' assumption fails. How do I operationalize Aumann in a world where I can't distinguish a truth-seeker from a status-seeker?

  *   **Anticipated Deflection:** "You should update on the probability that they are status-seeking."
  *   **Follow-up:** "But that update relies on *my* prior about human nature, which is exactly what we're disagreeing about. If I can't step outside my own head to verify your motives, aren't we back to square one? How does the math help me when the input data (your motives) is opaque?"

  7. **Betting as the Litmus Test**
  Many in your tradition argue that if two Bayesians disagree, they should bet. If you truly believe your posterior is superior and I am erring, you should take my money. Yet, few theorists actually bet significant capital on these epistemic claims. If you aren't willing to put skin in the game, why should I treat your invocation of Aumann as anything more than a conversational power move?

  *   **Anticipated Deflection:** "Betting has transaction costs and utility complications."
  *   **Follow-up:** "Those are practical constraints, just like the cognitive constraints I face. If practical constraints excuse you from betting, why don't they excuse me from deferring? Why does the 'math' bind me but not you when reality gets messy?"

  8. **The Normative Leap**
  Even if the math is perfect, it describes what *would* happen between ideal agents, not what *ought* to happen between us. To get from 'is' to 'ought,' you need a bridge principle. Why should I value Aumannian agreement over other epistemic values, like resilience, independent verification, or the heuristic value of maintaining diverse viewpoints even in the face of disagreement?

  *   **Anticipated Deflection:** "Agreement is the definition of epistemic rationality."
  *   **Follow-up:** "That's circular. If I define rationality as 'survival' or 'innovation,' disagreement might be more rational. If you define it as 'agreement,' of course agreement wins. Why should I accept your definition of rationality rather than one that accounts for the evolutionary benefits of persistent disagreement?"
