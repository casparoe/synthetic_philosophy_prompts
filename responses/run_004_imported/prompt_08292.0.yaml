answer: |-
  The tension you describe lies at the fault line between clinical epidemiology and the metaphysics of probability. Your doctor has handed you a number—9%—that functions pragmatically as a guide for action, yet simultaneously confessed that this number is metaphysically incomplete. Turning to David Lewis's Principal Principle (PP) is a philosophically sophisticated reaction, but it requires us to be precise about what the PP governs and what the "admissibility" clause actually permits.

  To reach a definite verdict on how you should treat this 9% figure, we must address your two questions in sequence. First, we must determine whether a pooled cohort risk score qualifies as a Lewisian "chance." Second, we must analyze whether your family history counts as admissible evidence relative to that score. I will argue that the 9% figure is not a Lewisian chance but a conditional frequency, meaning the PP does not strictly bind you. However, even if we grant the 9% the status of chance for the sake of argument, your family history functions as inadmissible evidence because it bears on the outcome independently of the statistical model. Both lines of reasoning lead to the same conclusion: you are rationally obligated to adjust your credence upward, treating the 9% as a baseline rather than a binding constraint.

  ### I. The Nature of the 9%: Chance vs. Conditional Frequency

  The Principal Principle states, roughly, that a rational agent's credence ($C$) in a proposition ($A$), given that the objective chance of $A$ is $x$ ($X$) and possessing admissible evidence ($E$), should equal $x$. Formally: $C(A | XE) = x$. The force of the principle relies entirely on the nature of $X$. For Lewis, objective chance is a singular, single-case propensity that supervenes on the total history of the world up to a time. It is the "best system" summary of the patterns of events in our universe.

  The ACC/AHA pooled cohort equations do not produce this sort of number. They produce a frequentist estimate based on a specific reference class. The 9% figure means: "Among people in the past who shared your age, cholesterol, blood pressure, and smoking status, 9% had a cardiovascular event within ten years." This is a conditional frequency, not a single-case objective chance. It is relative to the variables selected by the epidemiologists. If you change the variables (by adding family history), the reference class changes, and the frequency changes.

  This distinction matters because the PP is designed to align credence with *objective* chance, not with *epistemic* probabilities derived from incomplete models. If the 9% were a true Lewisian chance, it would have to incorporate all relevant facts about the past and present that bear on the future event. The doctor's admission that the equation "does not incorporate" family history confirms that the 9% is not an all-things-considered chance claim. It is a *ceteris paribus* claim: "Your risk is 9%, *holding constant the variables in this model*."

  Therefore, the strongest consideration against applying the PP is that the 9% is not the sort of thing to which the PP applies. It is a statistical estimate, akin to a weather forecast based on a model that ignores wind shear. To treat it as a Lewisian chance would be to commit a category error, granting a model output a metaphysical authority it does not possess. If the 9% is merely a Bayesian prior based on partial evidence, you are not bound to it; you are bound to update it when new evidence (family history) arrives.

  However, one might object that in medical decision-making, these risk scores *function* as chances. We act on them as if they are objective propensities. If we reject the PP here, do we lose the normative force of the doctor's advice? Not necessarily. We simply shift the framework from "deference to chance" to "Bayesian updating on total evidence." The verdict remains the same: the 9% is a starting point, not a destination.

  ### II. The Admissibility of Family History

  Let us suppose, for the sake of argument, that we treat the 9% as a Lewisian chance ($X$). We must then ask: Is your family history ($E$) admissible?

  Lewis defines admissible evidence intuitively as information about the past and present that bears on the future only by bearing on the chances. Inadmissible evidence is information that gives you a "direct line" to the outcome, bypassing the chance setup (e.g., a crystal ball, or time travel). Standardly, historical facts are admissible. Since your family history is a fact about the past, one might argue it is admissible. If $E$ is admissible, the PP dictates $C(A | XE) = 9\%$. This would imply you should ignore the family history and stick to the 9%.

  This conclusion is clinically absurd and philosophically fragile. The flaw lies in the relationship between $E$ and $X$. For the PP to constrain you to 9%, the proposition $X$ ("The chance is 9%") must be true. But your doctor has indicated that $X$ is derived from a model that *excludes* the causal impact of family history. In Lewisian terms, the "chance" is determined by the total history up to time $t$. If family history is part of the total history, and it causally influences heart disease, then the *true* objective chance (supervening on the total history) is not 9%. The 9% is the chance only relative to a *partial* history.

  Consequently, your family history is inadmissible relative to the 9% figure not because it is a prophecy, but because it is **causally relevant independent of the stated chance**. Lewis suggests that evidence is inadmissible if it bears on the truth of $A$ other than via its bearing on the chance of $A$. Since the 9% figure is calculated *without* family history, your family history bears on the outcome ($A$) via a causal pathway that the 9% figure ($X$) does not capture. It provides information about the outcome that is not mediated by the 9% statistic.

  In this specific context, the admissibility clause acts as an escape hatch. It says: "Defer to the chance *unless* you have evidence that overrides the chance setup." Because the doctor has explicitly stated that the chance setup (the equation) is incomplete regarding your specific biology, your family history counts as evidence that overrides the setup. It is inadmissible in the sense that it prevents the 9% from acting as a screening-off condition. If you know your father died of a heart attack at 50, that fact bears on your risk directly, regardless of what the pooled cohort equation says. To ignore it would be to ignore a causal factor in favor of a statistical aggregate that explicitly omits that factor.

  ### III. The Verdict

  We are now in a position to weigh the considerations and deliver a verdict.

  On one side, there is the authority of the clinical model. The ACC/AHA equations are validated on large populations. To deviate from them risks overconfidence in anecdotal evidence (your family) over hard data (the cohort). One might argue that "family history" is a vague variable, whereas cholesterol is precise. Perhaps the 9% already implicitly captures the average effect of family history within the cohort, and singling yours out is double-counting.

  On the other side, there is the philosophical and causal reality. The 9% is a conditional frequency, not an objective chance. It is relative to a reference class that you know you do not perfectly match (due to the unincorporated genetic risk). Furthermore, under the logic of the Principal Principle, evidence that bears on the outcome independently of the stated chance is inadmissible, lifting the constraint to defer to the number.

  **The Verdict:** You should treat the 9% figure as a **lower bound**, not a final probability. You are rationally obligated to adjust your credence upward.

  The reasoning is decisive. The Principal Principle applies to objective chances that supervene on the *total* history. The ACC/AHA score supervenes on a *partial* history. Therefore, the PP does not strictly apply, and you must treat the number as a Bayesian prior. Since family history is strong, independent evidence of elevated risk, Bayesian updating requires you to increase your credence. Even if we stretch the PP to cover this scenario, the admissibility clause protects you from the 9% constraint: because the family history affects the outcome via a pathway the 9% ignores, it is inadmissible relative to that figure, freeing you to diverge from it.

  To stick rigidly to 9% would be to fetishize the model over the reality it attempts to map. Your doctor's "passing mention" was the most philosophically significant part of the consultation. It was an admission that the map is not the territory. In the philosophy of probability, as in cardiology, you must always bet on the territory. Your credence should be higher than 9%.
