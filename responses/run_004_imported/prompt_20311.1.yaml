  8.  *(Final check of the prompt requirements)*: "go through this move by move," "say who's got the better argument," "what... they're both getting wrong about Du Bois's actual argument." Okay, I have all the components.

      *   *Move 1:* Ada (Quote) vs. Sam (Context). Winner: Split.
