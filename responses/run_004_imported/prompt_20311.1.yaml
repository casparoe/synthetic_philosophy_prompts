          *   Ada cites Du Bois: "all art is propaganda." She argues hopeless portraits reinforce bias.
          *   Sam's Counter: Du Bois wasn't against ugliness; he was against double standards (minstrelsy vs. Black art). Demanding uplift is propaganda too.
          *   *Analysis:* Ada is technically right on the quote ("all art is propaganda"), but maybe simplistic on the implication. Sam is right on the historical context (Du Bois hated the pressure to only show the "best" Negroes).
          *   *Verdict:* Sam has the stronger historical read here, but Ada has a valid point about *reception*.

      *   *Move 2: Ada's Second Point (Beauty, Truth, Justice).*
          *   Ada cites Du Bois's triad: Beauty, Truth, Justice. She argues despair without structural blame fails "Justice." It looks like "nature" rather than "injustice."
