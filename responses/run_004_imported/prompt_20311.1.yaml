  1.  **Analyze the Request:**
      *   **Context:** A writers' group workshop of a novel by Kwame (Black author, grim realism, Rust Belt setting, no redemption).
      *   **Conflict:** Two members, Ada and Sam, argued over drinks about W.E.B. Du Bois's "Criteria of Negro Art" in relation to the book.
