          *   *Verdict:* Ada wins this point. Marketing shapes reception profoundly.

  3.  **Analyze Du Bois's "Criteria of Negro Art" (1926):**
      *   *Key Quote:* "Thus all Art is propaganda and ever must be, despite the wailing of the purists."
      *   *Context:* He was arguing *against* the idea that Black art should be "pure" (art for art's sake) because Black people couldn't afford that luxury in a racist society. He wanted art that fought for civil rights.
      *   *Nuance:* He *also* criticized art that was *only* propaganda without beauty. "I do not care a damn for any art that is not used for propaganda." BUT, he also said, "I do not care when the propaganda is so obvious that it kills the art."
      *   *The "Uplift" Trap:* Du Bois was complicated. He believed in the "Talented Tenth" and often wanted to present the *best* of Black life to counter stereotypes. However, he also valued Truth.
      *   *What Ada/Sam miss:* Du Bois wasn't necessarily saying "no sad stories." He was saying "make sure your art serves the cause of Black freedom." Does a grim story serve freedom? Ada says no (feeds stereotypes). Sam says yes (exposes structural truth). Du Bois might side with Sam on the *right* to depict ugliness, but might side with Ada on the *responsibility* of the artist to ensure the *cause* of the ugliness is understood.

  4.  **Synthesize the Advice for the User:**
