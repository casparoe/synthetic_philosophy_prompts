          *   *Analysis:* This is the crux of literary realism vs. social thesis. Ada wants the moral framework to be clearer. Sam trusts the reader/subtext. Du Bois did value Justice, but he also valued Truth. If the Truth is grim, does omitting hope make it Unjust?
          *   *Verdict:* Tie/Context-dependent. Ada is right about the risk of misreading; Sam is right about how fiction works (show, don't tell).

      *   *Move 3: Ada's Final Point (Marketing/Packaging).*
          *   Ada argues the agent pitching it as "unflinching" decides the propaganda, regardless of intent.
          *   Sam: (No specific counter mentioned in the prompt, just that neither backed down).
