          3.  **The RNG/PK Point:** Explain this shows Turing taking ESP seriously as a physical causal force. It levels the playing field (both human and machine are vulnerable).
          4.  **Seminar Discussion Points:** Give the user concrete things to say to the class.
      *   **Refining the Argument:**
