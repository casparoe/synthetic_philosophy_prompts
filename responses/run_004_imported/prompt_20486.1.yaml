prompt: |-
  I'm writing a feature on the history and philosophy of mathematics that has led me deep into Thomas Hobbes's writings on geometry. Hobbes regarded geometry as the one branch of natural philosophy in which human beings had achieved genuine, causal certainty, precisely because we generate its objects ourselves through motion — a line traced by a moving point, a plane by a moving line, and so on. That same conviction underlay his notorious, decades-long feud with John Wallis, in which Hobbes insisted he had squared the circle by classical construction and dismissed Wallis's algebraic and infinitesimal methods as empty symbol-manipulation with no genuine geometric content.

  Now suppose Hobbes could be briefed on two later developments: the discovery of internally consistent non-Euclidean geometries, which dethroned Euclid's parallel postulate as the sole true description of space, and Hilbert's formalist axiomatization of geometry, on which terms like "point," "line," and "plane" become placeholders satisfying purely formal relations — so that, as Hilbert reportedly put it, one could substitute "table," "chair," and "beer mug" for them without any loss of rigor. Would Hobbes most plausibly have read these developments as belated vindication of his nominalism about mathematical terms, or as demolishing the physical, motion-generated foundation on which he thought geometry's certainty actually rested? Please argue for one of these readings, engaging directly with the tension between the nominalist and materialist strands of his philosophy of mathematics.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Prompt:**
      *   **Subject:** Thomas Hobbes's philosophy of mathematics (specifically geometry).
      *   **Core Hobbesian Tenet:** Geometry offers causal certainty because humans *generate* its objects through motion (materialist/constructivist view). A line is the trace of a moving point.
      *   **Conflict:** Hobbes vs. Wallis (Hobbes hated algebra/infinitesimals as "symbol-manipulation" without geometric reality).
      *   **Hypothetical Scenario:** Brief Hobbes on two later developments:
          1.  Non-Euclidean Geometries (NEC) - Euclid isn't the *only* true space.
          2.  Hilbert's Formalism - Geometry is about formal relations, not specific objects (table/chair/beer mug).
      *   **The Question:** Would Hobbes see these as *vindication of his nominalism* OR *demolition of his materialist foundation*?
      *   **Requirement:** Argue for *one* reading, engaging with the tension between his nominalism and materialism.

  2.  **Deconstruct Hobbes's Philosophy:**
      *   **Materialism:** Everything that exists is body. Motion is the cause of all change. Knowledge is knowledge of causes.
      *   **Nominalism:** Universal terms (like "triangle") are names we give to groups of similar things, not real entities existing independently. Language is a tool for reasoning (computation).
      *   **Geometry's Status:** It is the only true science because we *make* the definitions. We stipulate what a line is. Because we construct it via motion, we know its cause. Therefore, we have *a priori* certainty about it, unlike physics where we observe effects and guess causes.
      *   **The Tension:**
          *   *Nominalist strand:* Math is about names and consequences of definitions.
          *   *Materialist strand:* Math is about real motion in space. The definitions must correspond to generative acts.

  3.  **Evaluate the New Developments against Hobbes's Views:**

      *   **Non-Euclidean Geometry (NEC):**
          *   *Hobbes's likely reaction:* NEC suggests Euclid's axioms aren't necessary truths about space. Hobbes thought Euclidean geometry was true *because* it mirrors the way we construct space via motion.
          *   *Conflict:* If space can be curved (Riemann) or hyperbolic (Lobachevsky), does that break the "motion generates line" model? Not necessarily. One can generate a geodesic on a sphere. However, Hobbes believed Euclidean geometry was the *only* correct one because it matched the "true" nature of space as we experience it. NEC suggests geometry is contingent on the space, not absolute.
          *   *Nominalist angle:* If we define axioms differently, we get different geometries. This fits the idea that math is about consequences of definitions (names).
          *   *Materialist angle:* If geometry is about *physical* motion, only one geometry should describe physical space. NEC separates pure math from physical space. Hobbes hated that separation.

      *   **Hilbert's Formalism:**
          *   *Hobbes's likely reaction:* "Point, line, plane" are undefined terms defined only by axioms. Replaceable with "table, chair, beer mug."
          *   *Conflict:* This is anathema to Hobbes's *materialism*. For Hobbes, a point *must* be a physical marker, a line *must* be a trace of motion. If you can swap them for beer mugs, the *causal generation* is lost. It becomes pure symbol manipulation—exactly what he accused Wallis of.
          *   *Nominalist angle:* This looks like the ultimate nominalism. Terms are just placeholders. Truth is logical consistency, not correspondence to generated motion.
          *   *Materialist angle:* This destroys the "causal certainty." If I don't know *how* the object is made (motion), I don't know the cause. Formalism is effect without cause.

  4.  **Formulate the Argument:**
      *   *Choice:* I need to pick one.
      *   *Option A (Vindication of Nominalism):* Argue that Hobbes cared most about math being a human construct of names. Formalism shows math is indeed about stipulated definitions, not discovering Platonic truths.
      *   *Option B (Demolition of Materialism):* Argue that Hobbes's certainty relied on the *genesis* of objects (motion). Formalism and NEC sever the link between math and physical generation.
      *   *Decision:* Option B is stronger. While Hobbes was a nominalist about *universals*, his philosophy of *mathematics* was inextricably tied to his materialism. The certainty of geometry came from the *act of construction*, not just the logical consistency of names. Hilbert's "beer mugs" remove the motion. Wallis's algebra was rejected for being un-geometric; Hilbert is the ultimate un-geometric algebra.
      *   *Nuance:* I must acknowledge the nominalist strand. Hobbes *did* think math was about consequences of definitions. But for Hobbes, valid definitions *must* be generative (causal). Hilbert's definitions are non-generative. Therefore, Hilbert validates the "names" part but invalidates the "causal certainty" part. Since the "causal certainty" is what made geometry special for Hobbes (vs. mere logic), the loss of the material foundation is the more devastating blow.

  5.  **Drafting the Argument (Iterative Process):**

      *   *Introduction:* State the thesis. Hobbes would see these developments as a demolition of his materialist foundation, despite superficial nominalist resonances.
      *   *Section 1: The Core of Hobbesian Geometry.* Explain *resolutio-compositio* (resolution and composition). Geometry is certain because we know the cause (motion). Contrast with Wallis (symbols).
      *   *Section 2: Hilbert's Formalism.* Address the "beer mug" quote. To Hobbes, this is the triumph of Wallis. It severs the link between word and generated thing. It makes geometry a game of syntax, not a science of quantity/motion.
      *   *Section 3: Non-Euclidean Geometry.* This challenges the idea that Euclidean space is the necessary structure of human generation. If multiple geometries exist, geometry is no longer the unique science of *our* space. It becomes a menu of options.
      *   *Section 4: Resolving the Tension (Nominalism vs. Materialism).* Hobbes's nominalism serves his materialism. Names track bodies. If names float free of bodies (Hilbert), nominalism becomes idealism/scholasticism in disguise.
      *   *Conclusion:* Hobbes would view modern math as a return to the "insignificant speech" he warned against. Certainty is lost because causality is lost.

  6.  **Refining the Argument (Self-Correction/Polishing):**
      *   *Check:* Did I address the prompt's specific tension? Yes, nominalism vs. materialism.
      *   *Check:* Did I engage with Wallis? Yes, need to mention that Hilbert looks like "Wallis on steroids."
      *   *Check:* Is the distinction clear? The key is *generativity*. Hobbes isn't just a logical nominalist; he's a *genetic* nominalist. Definitions must describe a generation. Hilbert's axioms don't describe generation; they describe relations.
      *   *Tone:* Scholarly, philosophical, persuasive.

  7.  **Final Polish:** Ensure the distinction between "nominalism about universals" (which Hobbes holds) and "nominalism about mathematical objects" (which is trickier) is clear. Hobbes thinks mathematical objects are mental constructs *based on* physical possibilities. Hilbert thinks they are logical constructs based on consistency. That's the break.

      *(Self-Correction during drafting)*: Wait, could one argue that Non-Euclidean geometry vindicates his nominalism because it shows axioms are just stipulations? Yes, but Hobbes believed the stipulations had to match the *nature of space* as generated by motion. If NEC shows space isn't necessarily Euclidean, it undermines the claim that Euclidean geometry is the *one* true science of space. But the prompt asks about the *foundation of certainty*. The certainty came from the *generation*. If I can generate a hyperbolic line, is it still Hobbesian? Maybe. But Hilbert is the bigger problem. Hilbert removes the "generation" entirely. I will focus on Hilbert as the primary wedge, supported by NEC.

      *Revised Thesis:* Hobbes would view these developments as the ultimate victory of the "empty symbol-manipulation" he fought in Wallis, thereby demolishing the materialist foundation of certainty, even if it superficially resembles his nominalism. His nominalism was always in service of his materialism, not independent of it.

  8.  **Final Review against constraints:**
      *   Argue for *one* reading. (Demolition of materialist foundation).
      *   Engage with tension between nominalist and materialist strands.
      *   Reference Wallis/feud context.
      *   Reference NEC and Hilbert.

      *Let's write.*
answer: |-
  Thomas Hobbes would almost certainly interpret the rise of non-Euclidean geometries and Hilbertian formalism not as a vindication of his nominalism, but as the catastrophic demolition of the materialist foundation upon which he built his claim to geometric certainty. While these developments superficially resemble his insistence that mathematics is a human construct of names and definitions, they sever the vital link between *naming* and *generating* that distinguished Hobbes's philosophy from the scholastic "insignificant speech" he despised. To Hobbes, Hilbert's formalism would appear as the ultimate triumph of John Wallis's algebraic methods—the very "symbol-manipulation" he fought for decades—while non-Euclidean geometry would undermine the unique status of Euclidean space as the necessary structure of human motion.

  To understand why Hobbes would reject these developments, one must resolve the tension between his nominalism and his materialism. It is a common misconception that Hobbes's nominalism implies mathematics is merely a game of linguistic convention. For Hobbes, names are indeed arbitrary, but *truth* is not. Truth arises from the correct ordering of names to reflect the causal structure of reality. In *De Corpore*, Hobbes argues that geometry is the only true science because it is "genetic." We do not merely define a circle as a set of points equidistant from a center; we define it by the *motion* that generates it (a line rotating around a fixed point). This generative definition provides causal certainty: because we caused the object in our minds through a stipulated motion, we know all its properties *a priori*.

  Here lies the crux of the conflict. Hobbes's nominalism is subservient to his materialism. We are free to name things, but valid mathematical definitions must describe a possible physical generation. A "point" is not a logical placeholder; it is a physical marker with magnitude (however small). A "line" is not an abstract relation; it is the trace of a moving body.

  Hilbert's formalism strikes directly at this generative requirement. When Hilbert suggests that "point, line, and plane" could be replaced by "table, chair, and beer mug," he is asserting that the *content* of the terms is irrelevant, provided the *relations* hold. For Hobbes, this is precisely the error of the algebraists. If a "line" can be a "beer mug," then the concept of motion is evacuated from the definition. Without motion, there is no cause. Without cause, there is no scientific certainty, only logical consistency. Hobbes would argue that Hilbert has saved rigor at the cost of science. He would see formalism as a return to the scholastic habit of manipulating universals without reference to bodies. The certainty Hobbes prized was not merely that the conclusions follow from the premises (logic), but that the premises correspond to a generative act we can perform (physics). By detaching geometry from the kinematics of generation, Hilbert renders geometry, in Hobbes's eyes, a sophisticated form of accounting—useful, perhaps, but devoid of the causal knowledge that constitutes *scientia*.

  Furthermore, Hobbes's feud with Wallis provides a clear precedent for this reaction. Hobbes attacked Wallis's infinitesimals and algebraic symbols because they lacked geometric instantiation. You cannot "draw" an infinitesimal; you cannot generate it through a finite motion. Hobbes dismissed these as "scabs of equations." Hilbert's axiomatization is, in a sense, Wallis's program completed: it fully abstracts geometry into a symbolic system where consistency replaces constructibility. Hobbes would view this not as a refinement of his nominalism, but as the final victory of the empty verbalism he warned against in *Leviathan*. He would argue that Hilbert has created a system where one can speak truly without speaking of anything real, which for a materialist is the definition of nonsense.

  The discovery of non-Euclidean geometries compounds this injury. Hobbes believed Euclidean geometry was uniquely true because it mirrored the actual structure of the space in which human bodies move. The parallel postulate was not just a useful axiom; it was a truth about the nature of spatial extension. The existence of internally consistent non-Euclidean systems would force Hobbes to concede that Euclidean axioms are not necessary truths of reason, but contingent descriptions of a specific type of space. While a modern nominalist might celebrate this as proof that axioms are merely stipulative definitions, Hobbes would find it troubling. If geometry is the science of "quantity of motion," and motion can occur in multiple, mutually incompatible spatial structures, then geometry loses its status as the *one* certain philosophy of space. It becomes a menu of options. For Hobbes, who sought a unified materialist system to explain man and state, a plurality of geometries suggests a fracture between mathematical reasoning and physical reality.

  One might object that Hobbes's nominalism should lead him to embrace these developments. After all, if mathematical terms are just names, why does it matter if they refer to motion or beer mugs? The answer lies in Hobbes's specific brand of nominalism. He was not a conceptualist who believed ideas exist in a mental realm; he was a materialist who believed ideas are decaying sense impressions of bodies. For a name to have meaning, it must ultimately refer to a body or a mode of a body (like motion). Hilbert's "undefined terms" refer to nothing but each other. To Hobbes, this is not nominalism; it is idealism disguised as logic. It treats words as if they have power independent of the things they name.

  Therefore, Hobbes would read these developments as a dual defeat. Non-Euclidean geometry dethrones the specific material space he thought geometry described, and Hilbert's formalism removes the material generation he thought gave geometry its certainty. He would likely conclude that modern mathematics has indeed achieved a high degree of logical consistency, but at the price of becoming what he accused Wallis of doing: a "cookery of symbols," detached from the causal machinery of the universe. The tension between his nominalism and materialism is resolved in favor of materialism: for Hobbes, names are tools for tracking bodies. If the tools no longer track bodies—if they track only other tools—then the certainty they produce is merely tautological, not causal. Hobbes would stand by his feud with Wallis, viewing Hilbert not as a savior of rigor, but as the architect of a magnificent, empty castle built on air.
