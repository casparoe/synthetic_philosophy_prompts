      *   *Addressing Q1 (Mechanisms):* Darwin is layering arguments, not conflating. He sees them as a "toolkit." Reciprocity/Reputation reduce the cost ($c$); Group Selection increases the benefit ($b$) at a higher level. They cohere teleologically (aimed at moral progress) but are mechanistically distinct.
      *   *Addressing Q2 (Kin vs. Group):* This is the heart of the modern debate.
          *   Acknowledge the kin structure of tribes (Hamilton's point).
          *   Acknowledge the mathematical equivalence (Price/Queller).
          *   Highlight the *causal* distinction (Sober/Wilson's point). Darwin emphasizes the *process* of inter-tribal war, not just gene sharing.
          *   Mention the "artifact" worry (Price equation). If you partition variance differently, you get different labels. But causality matters for explanation.
      *   *Historical Context:* Darwin was pre-Mendel. He thought of "inheritance of character," not alleles. This makes "kin selection" anachronistic to attribute to him directly, though his logic fits.
