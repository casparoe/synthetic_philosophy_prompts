answer: |-
  This is a profound and unsettling puzzle, one that strikes at the heart of aesthetics, ontology, and the practice of criticism. You have stumbled upon a version of the *Euthyphro dilemma* applied to art: Is a book good because we judge it good, or do we judge it good because it is good?

  Your co-judge represents a form of **aesthetic anti-realism** (or institutionalism), while you are advocating for **aesthetic realism**. Both positions have intuitive power, and both have significant weaknesses when pushed to their limits. Your co-judge is right that prizes are social constructs, but wrong to imply that merit *only* exists within them. You are right that merit feels discovered rather than invented, but you found yourself unable to locate it independently of human response.

  There is indeed a third way, one that avoids the Scylla of "brute fact" (merit as a physical property like page count) and the Charybdis of "arbitrary fiat" (merit as pure opinion). To find it, we must shift from thinking of merit as a *property* to thinking of it as a *relation*.

  ### 1. The Category Error: Prizes vs. Merit
  First, it is helpful to separate the two things being conflated in your deliberation room.
  *   **The Prize:** Your co-judge is absolutely correct here. "Winner of the Regional Debut Prize" is an *institutional fact*. Like "being the President" or "scoring a goal," it exists only because of a specific set of rules and authorized agents. If the panel changes, the winner changes. That is the nature of prizes.
  *   **The Merit:** This is what you were defending. Literary merit is not an institutional fact; it is an *aesthetic fact*.

  The confusion arises because we use the prize as a proxy for merit. Your co-judge argued that because the *proxy* is constructed, the *value* it points to must also be constructed. This is a non sequitur. A thermometer is a human invention, but the temperature it measures is not. Similarly, a judging panel is a human construct, but the excellence it attempts to track may not be.

  ### 2. The "Page Count" Fallacy
  Your difficulty arose when you tried to define excellence in terms that were independent of all judges, "the way one might point to a novel's page count." This sets the bar for objectivity impossibly high.

  In philosophy, this is the distinction between **primary qualities** (mass, extension, page count) and **secondary qualities** (color, taste, beauty).
  *   Page count exists even if no one reads the book.
  *   "Psychological depth" does not exist in the ink on the page; it exists in the *interaction* between the ink and a conscious mind.

  To say merit isn't like page count is not to say it is fake. The sweetness of a peach is not a property of the peach alone (it requires a tongue), nor is it a hallucination of the eater. It is a **relational property**. It is real, but it is relational. Literary merit is the capacity of a text to sustain certain kinds of rich, rewarding attention in competent readers.

  ### 3. The Third Way: Intersubjectivity and Resistance
  So, is merit just "somebody's judgment," as you feared? Not exactly. It is **intersubjective**.

  Imagine you claim a sentence has a "beautiful rhythm." Your co-judge asks, "Where is it?" You can't point to it like a typo. However, if you play the sentence for a room of 100 poets, 95 of them will nod in agreement. If you play it for a room of 100 people who have never read poetry, they might not hear it.
  *   **The Anti-Realist says:** "See! It depends on the people!"
  *   **The Realist says:** "See! 95% agreed! It's in the text!"

  The third way suggests that the merit lies in the text's **affordance**. The text offers a specific structure of possibilities. A "good" text is one that rewards the effort of interpretation repeatedly, across different readers and times. It possesses a kind of *resistance* to arbitrary reading. You cannot convincingly argue that *Moby Dick* is a lighthearted romp; the text pushes back against that reading. That resistance is the "objective" core you were looking for. It isn't a physical fact, but it is a constraint on judgment.

  ### 4. Hume's Standard of Taste
  The philosopher David Hume addressed this exact problem in *Of the Standard of Taste* (1757). He acknowledged that "beauty is no quality in things themselves: It exists merely in the mind which contemplates them." (This sounds like your co-judge).

  However, Hume argued that not all minds are equal in this regard. Some observers have "strong sense, united to delicate sentiment, improved by practice, perfected by comparison, and cleared of all prejudice."
  *   Your criteria (rhythm, depth, daring) are indeed learned. But they are not *arbitrary*. They are the tools developed over centuries to measure the specific capacities of human cognition and emotion.
  *   When you say a book has "psychological depth," you are saying it aligns with the complex ways humans actually experience consciousness. That alignment is a fact about the world and the human mind, even if it requires a trained judge to perceive it.

  ### 5. Advice for the Novelist
  You mentioned your personal stake: the suspicion that your third novel's fate depends on "who happens to be reading it" rather than "what is on the page."

  This anxiety is the shadow side of the truth. Yes, *fate* (prizes, sales, fame) is largely contingent on the institutional lottery of judges and timing. Your co-judge was right about the **prize**. But *merit* (longevity, resonance, the ability to move a stranger in 50 years) is less contingent.

  Here is how to hold the tension without despair:

  1.  **Distinguish Validation from Value:** A prize validates a book within a specific moment and community. It does not confer value; it recognizes it (hopefully). If your book is not chosen, it does not mean the merit wasn't there; it means the specific relational circuit (this book + these judges + this year) did not close.
  2.  **Trust the Resistance:** When you are writing, you feel the text resisting certain choices. You know when a sentence is false, even if you can't prove it. That internal experience of "rightness" is not a delusion. It is you acting as the first competent reader. If you can satisfy yourself—a reader trained in the tradition—you have achieved the primary form of merit.
  3.  **The Long Game:** Institutional verdicts are volatile; aesthetic verdicts are stable. Many "prize winners" of 1920 are unread today. Many "failures" of 1920 are classics. The "independent excellence" you sought reveals itself over time, through the accumulation of many different judgments, not the fiat of one panel.

  ### Conclusion
  Neither you nor your co-judge was entirely right.
  *   **Your co-judge** was right about the **prize** (it is a construct) but wrong about **merit** (it is not merely fiat).
  *   **You** were right about **merit** (it is tracked, not made) but wrong to look for it as a **primary quality** (like page count).

  Literary merit is a **dispositional property**. It is the book's power to generate specific experiences in prepared minds. It is real, but it is relational. It requires judges to be actualized, but it is not *created* by them.

  You can lay down your burden. You are not manufacturing excellence by writing, nor are you shouting into the void. You are building a machine designed to produce specific experiences in human consciousness. Whether a specific panel of three people recognizes the engineering is a matter of luck. Whether the machine *works* is a matter of craft. Focus on the craft; the rest is, as your co-judge might agree, a matter of institutional fiat, which is ultimately less important than the work itself.
