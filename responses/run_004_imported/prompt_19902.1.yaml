answer: |-
  Here are 8 questions designed to corner the "it's just a fact of nature" defense, escalating from metaphysical challenges to practical edge cases.

  ### 1. The "Opt-Out" Challenge
  **Question:** "Strawson argues we can't globally opt out of reactive attitudes like resentment without ceasing to be human. But Stoics and Buddhist practitioners spend lifetimes training themselves to do exactly that—dialing down attachment and anger. If they can succeed, even partially, doesn't that prove these attitudes aren't the 'bedrock' you say they are, but rather habits we can revise?"

  *   **Likely Dodge:** "Those are rare exceptions that prove the rule; the vast majority of us can't sustain that objective stance in personal relationships."
  *   **Follow-up:** "So your theory of responsibility only applies to the majority, and the enlightened get a free pass on being held accountable?"

  ### 2. The Pereboom Challenge
  **Question:** "Derk Pereboom argues that if we truly internalize how much of our character is downstream of factors we didn't choose—genetics, environment, luck—we *ought* to dial back resentment, even if we can't eliminate it. Why isn't the intellectually honest move to treat resentment like a cognitive bias: something natural, but something we should actively fight against?"

  *   **Likely Dodge:** "Understanding the cause doesn't stop the feeling; it's simply a fact about us that we feel stung when slighted, regardless of the metaphysics."
  *   **Follow-up:** "But knowing smoking is natural doesn't mean we shouldn't quit; why is resentment different?"

  ### 3. The "Is-Ought" Trap
  **Question:** "You keep returning to the idea that these reactive attitudes are just 'facts about our species.' But slavery and tribalism were also facts about our species for millennia. Just because a practice is deeply embedded in human psychology doesn't automatically justify it normatively. How do you move from 'we do this' to 'we are right to do this'?"

  *   **Likely Dodge:** "Unlike slavery, these attitudes constitute the very framework of meaningful human relationships; you can't judge the framework from outside it."
  *   **Follow-up:** "That sounds like saying we can't judge slavery because it was part of the economic framework of the time."

  ### 4. The Cultural Variance Challenge
  **Question:** "If reactive attitudes are a universal 'fact of our species,' why do cultures vary so wildly on what triggers them? In some societies, an insult demands blood; in others, it's ignored. If the *content* of resentment is culturally malleable, why do you insist the *authority* of resentment is metaphysically fixed?"

  *   **Likely Dodge:** "The specific triggers vary, but the underlying capacity for resentment is universal across all healthy adults."
  *   **Follow-up:** "So if a culture trains people not to feel resentment, are they 'unhealthy,' or just proof that your universal fact isn't universal?"

  ### 5. The Objective Stance Expansion
  **Question:** "Strawson allows we can take the 'objective stance'—viewing someone as a subject for therapy rather than blame—when they are children or mentally ill. But as psychology advances, we find 'abnormalities' in almost everyone. At what point does expanding the objective stance stop being a loophole and start being the more accurate description of reality?"

  *   **Likely Dodge:** "We have to draw a line somewhere for society to function; we can't treat everyone as a patient."
  *   **Follow-up:** "Is that line drawn by metaphysics, or just by administrative convenience?"

  ### 6. The Constitutive Luck Problem
  **Question:** "Let's talk about the 'moral luck' problem. Two people commit the same crime; one had a loving upbringing, the other was abused. We feel more resentment toward the first. But if their character is a product of that luck, isn't our resentment essentially punishing them for their parents' choices? How is that fair within your framework?"

  *   **Likely Dodge:** "Fairness is an internal concept to our moral practices; it doesn't require a metaphysical guarantee of ultimate equality."
  *   **Follow-up:** "So 'fairness' is just a story we tell ourselves to make the resentment feel better?"

  ### 7. The Cult Case (The Edge Case)
  **Question:** "I want to press you on a specific gray area. Consider someone raised from birth in a high-control cult. They aren't coerced at gunpoint, and they aren't 'insane' by clinical standards—they reason logically within their dogma. They don't fit the standard exemptions (child, psychopath), but their 'self' was engineered by others. Do we hold them fully responsible when they leave and commit harm, or does that upbringing function as a partial exemption that Strawson's binary doesn't capture?"

  *   **Likely Dodge:** "That sounds like an exemption condition; their capacity for normal interpersonal relationships was compromised during development."
  *   **Follow-up:** "But if that's an exemption, where is the line between cult indoctrination and standard parenting? We all engineer our kids' values."

  ### 8. The Moral Progress Challenge
  **Question:** "If reactive attitudes are a static 'fact of nature' that we can't justify or revise without losing our humanity, does that mean moral progress is an illusion? If we can't step back and critique the very mechanism of blame, aren't we just trapped in whatever version of resentment our current evolutionary stage handed us?"

  *   **Likely Dodge:** "Progress happens within the practice, by refining who we blame and why, not by abandoning the practice itself."
  *   **Follow-up:** "But if the engine of blame is fixed, how can the destination ever truly change?"
