          *   *Analysis:* Devon is pointing out a dynamic cost. In standard metaphysics, masks are usually temporary extrinsic blockers. If the blocker *consumes* the fuel of the basis, the distinction blurs. However, a fink specifically removes the disposition *in response to the stimulus* such that the counterfactual fails *at that moment*. Burnout is cumulative.
