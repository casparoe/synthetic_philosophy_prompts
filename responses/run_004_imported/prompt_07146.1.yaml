      *   **Move 3: Kira's Synchronic/Diachronic Reply.**
          *   *Claim:* Metaphysics of dispositions is usually synchronic (at time $t$). Burnout is diachronic (over time $t_1$ to $t_n$). At time $t$, the urge is there, just blocked.
          *   *Analysis:* This is standard analytic philosophy defense. Lewis's RCA is largely about truth conditions at a time. If we freeze frame, the glass is still fragile even if it shatters next week.
          *   *Verdict:* Kira wins on *metaphysical technicality*. She is correctly applying the standard model's time-slice approach.

      *   **Move 4: Devon's "No Clean Basis" Point.**
          *   *Claim:* Psychological dispositions don't have a clean "basis" (like molecular structure) independent of context. The "self" isn't a glass. Importing "mask" implies a "true self" underneath that isn't changed by the masking.
