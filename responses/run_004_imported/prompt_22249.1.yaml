answer: |-
  You have hit on one of the most famous and contentious debates in the history of physics. You are not missing a logical step; you are essentially channeling Gottfried Wilhelm Leibniz (Newton's contemporary rival) and Ernst Mach (who influenced Einstein).

  Your intuition that "tension is just a physical relation" is exactly the relationalist view. Newton's goal in the Scholium is to prove the *absolutist* view.

  Here is the walk-through of what the Two Globes experiment is doing that the Bucket isn't, why Newton thinks the cord isn't just "another body," and where your suspicion about him "smuggling" the conclusion is actually historically vindicated.

  ### 1. What extra work are the Globes doing?

  You asked: *"What extra work is this globes example is supposed to be doing that the bucket one by itself doesn't already do?"*

  The Bucket Experiment proves that **true rotation exists.** It shows that the water's concave surface isn't caused by rotation relative to the bucket (since the surface is flat when the water spins relative to the bucket initially, and concave when they spin together later).

  However, the Bucket has a weakness: **It relies on Earth.**
  The bucket sits on Earth. The water is pulled by Earth's gravity. A critic could argue, "Maybe the water is rotating relative to the Earth's mass, not 'Space' itself."

  The Two Globes experiment removes the Earth. It removes gravity (ideally). It removes the container.
  *   **The Bucket** shows that relative motion isn't the whole story.
  *   **The Globes** show that you can **measure** true motion without *any* external reference points.

  In the empty universe scenario, Newton is making a radical claim: **You can calculate the speed and direction of rotation using only internal dynamics.**

  If you measure the tension ($T$) and know the mass ($m$) and radius ($r$), you can solve $T = mv^2/r$ for $v$. You now know the velocity of the globes. But velocity relative to *what*? There is nothing else there. Newton argues the velocity is relative to the parts of "immovable space."

  **The Extra Work:** The Bucket shows rotation has effects. The Globes show rotation is **quantifiable** and **determinate** in a void. It turns a qualitative observation (water climbs) into a quantitative measurement (tension = specific velocity) independent of external matter.

  ### 2. Addressing the "Cord is just another body" objection

  This is your strongest point: *"Isn't the cord just another body though? 'Tension in the cord' still just seems like a physical relation between the cord and the two globes..."*

  Here is how Newton would respond, and where the philosophical rub lies.

  **Newton's Argument:**
  The tension is not a relation between the cord and the globes. The tension is a stress *within* the cord caused by the **inertia** of the globes.
  Inertia is the resistance to change in motion. If the globes are trying to move in a straight line (tangent to the circle) but are forced into a curve, they pull on the cord.
  Newton asks: *What are they resisting?*
  *   **Relationalist (You/Leibniz):** They are resisting motion relative to the rest of the matter in the universe.
  *   **Newton:** In the empty universe scenario, there *is* no other matter. Therefore, they are resisting motion relative to **Space itself.**

  **The Axis Problem:**
  For there to be circular motion, there must be an **axis of rotation**.
  In the Bucket, the axis is the handle/center of the bucket (physical objects).
  In the Two Globes (empty universe), the axis is an imaginary geometric line passing through the center of gravity between them. There is no physical rod there.
  If the globes are "endeavoring to recede from the axis," and the axis is *not a physical object*, then the axis must be a feature of **Space**.
  If Space can host an axis that exerts causal influence (by defining what counts as straight vs. curved motion), then Space is a "thing" (a substance), not just a relation.

  So, Newton isn't saying the cord proves Space exists directly. He is saying the cord proves **Inertial Forces** exist. Inertial Forces require a reference frame. If no matter provides that frame, Space must.

  ### 3. The "Fixed Stars" Ambiguity

  This is the second half of the quote you provided.
  *"We could not indeed determine from the relative translation of the globes among those bodies, whether the motion did belong to the globes or to the bodies."*

  This is the principle of **Relativity of Motion**. Visually, if the globes spin Clockwise, it looks exactly the same as if the globes are still and the Universe spins Counter-Clockwise.
  If space is just relations between objects, these two scenarios are identical. There is no "fact of the matter" about who is moving.

  Newton uses the cord to break this symmetry.
  *   If the cord is tense: The globes are spinning (inertial forces are active).
  *   If the cord is slack: The stars are spinning (the globes are inertial).

  **Why this matters:** It claims that **dynamics trumps kinematics.**
  *   *Kinematics* (position/visuals) says the motion is relative/ambiguous.
  *   *Dynamics* (forces/tension) says the motion is absolute.
  Newton is arguing that "True Motion" is defined by the forces involved, not by the change in position relative to neighbors.

  ### 4. Are you right? (The "Smuggling" Charge)

  You asked: *"Is he quietly smuggling in the conclusion somewhere?"*

  **Yes.** Or rather, he is making an assumption that later physics would challenge.

  Newton assumes that **Inertia is intrinsic to the object.** He assumes a lone globe in the universe still has mass and still resists acceleration.
  If you accept that premise, his logic holds. If mass resists acceleration, and there is no other matter to accelerate relative to, it must be accelerating relative to Space.

  **However, your intuition aligns with Ernst Mach (1883).**
  Mach looked at this exact experiment and said: *"You cannot separate the globe from the fixed stars."*
  Mach's Principle suggests that inertia is **not** intrinsic. A lone globe in an empty universe would have **no inertia**. It would not generate tension if you tried to spin it, because there is no "distant mass" to define what rotation is.
  According to Mach, the tension in the cord *is* a relation between the globes and the fixed stars (even if they are light-years away). If you remove the stars, the tension disappears.

  **Einstein's Verdict:**
  Einstein wanted to side with Mach (General Relativity is partly built on Mach's Principle). However, the final theory of General Relativity is a bit of a hybrid.
  *   Space is not a rigid "thing" (Newton was wrong about rigid Absolute Space).
  *   But Space (Spacetime) does have a **metric structure**. Even in a vacuum solution (empty universe), spacetime has geometry.
  *   So, a lone globe *would* still experience inertial forces in General Relativity, but not because Space is a "container," but because the metric field exists independently of matter.

  ### Summary

  1.  **Bucket vs. Globes:** The Bucket shows rotation has physical effects. The Globes show you can **calculate** true motion without looking at anything outside the system.
  2.  **The Cord:** Newton argues the tension measures inertia. Inertia requires a reference. In a void, that reference must be Space. You argue (with Mach) that inertia might require distant matter.
  3.  **The Smuggling:** Newton assumes inertia exists in isolation. If you grant him that, his logic is sound. If you question that (as you are doing), you are undermining the premise of Absolute Space.

  You aren't failing to understand Newton; you are successfully identifying the exact weak point that led to the development of Relativity. Newton claims the cord measures motion relative to Space. You suspect the cord measures motion relative to... well, everything else. Newton says "There is no everything else in scenario A." You say "Then maybe there is no tension in scenario A."

  That is the exact fault line between Classical Mechanics and Modern Physics. You're in good company.
