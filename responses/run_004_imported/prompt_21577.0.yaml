prompt: |-
  I'm a philosophy PhD student working in bioethics, and as part of a clinical ethics fellowship this year I sit as the trainee representative on my hospital's ethics committee. We've been asked to decide on a pilot proposal that I think turns on a much deeper problem than most of the committee has noticed, and I've been tasked with drafting the recommendation memo we'll circulate before the vote in three weeks. The proposal comes from a startup called Anchor Health, which wants to run a year-long pilot of an AI "advance care planning companion" with patients who carry serious diagnoses that put their future decision-making capacity at risk, mostly early-stage dementia and ALS. While a patient still has capacity, they work with the system over several sessions, which also ingests, with consent, their letters, messages, and recorded conversations with family, to build a rich model of what they value. The pitch, a more ambitious version of what bioethicists call a "patient preference predictor," is explicit that Anchor does not just record what a patient says: it flags apparent contradictions in their stated wishes, discounts what the vendor's documentation calls "framing noise and in-the-moment anxiety," and extrapolates to situations the patient never actually discussed, so as to output one coherent preference profile. Later, once the patient has lost capacity and their written directive turns out to be silent or ambiguous about the actual situation on the ward, which is the usual case in practice, clinicians and family can query Anchor for a recommendation that goes well beyond anything the patient is on record as ever having said.

  The committee's disagreement keeps reminding me of the debates around Yudkowsky's "coherent extrapolated volition" proposal for AI alignment; a friend of mine in the CS department who works on alignment spotted the resemblance before I did, and now I can't unsee it. One faction argues that Anchor is just a more rigorous version of the substituted judgment surrogates already attempt, badly (family surrogates are notoriously inaccurate at guessing patient wishes), so a more consistent, better-informed extrapolation serves patient autonomy rather than threatening it. The other faction argues that the very operations being marketed as improvements — resolving "contradictions," discounting "noise" — are exactly where someone's assumptions about what a more rational or more informed version of you would want get substituted for what you actually, presently want, and that there is no neutral standpoint from which to say which strand of an ambivalent person counts as the real, extrapolated one. Dementia adds a further complication: by the time a hard case reaches the ward, the disease may have spent months reshaping the patient's values, so it is genuinely unclear whose preferences — the earlier self Anchor was trained on, or whoever the patient now is — are even the ones being extrapolated. Our advance-directive policy currently says nothing about any of this.

  Could you draft the short written opinion I'm responsible for circulating? It should recommend a specific course of action — approve the pilot, reject it, or approve it with stated conditions — attached to a concrete timeframe, with reasoning that Anchor's team and our own clinicians could actually act on, and it should take the strongest version of whichever side's worry you end up setting aside seriously, rather than dispatching it in a sentence.
reasoning: |-
  Here's a thinking process that leads to the drafted memo:

  1.  **Analyze the Request:**
      *   **User:** Philosophy PhD student in bioethics, clinical ethics fellow, trainee rep on hospital ethics committee.
      *   **Task:** Draft a recommendation memo for the committee to circulate before a vote in three weeks.
      *   **Subject:** A pilot proposal by "Anchor Health" (AI advance care planning companion).
      *   **Key Technology:** AI ingests patient data (letters, messages, conversations) while they have capacity (early dementia/ALS). It resolves contradictions, discounts "noise," and extrapolates to un-discussed situations to create a coherent preference profile. Used later when capacity is lost and directives are silent/ambiguous.
      *   **Core Ethical Tension:** Autonomy vs. Paternalism/Identity. Is this better substituted judgment (enhancing autonomy) or imposing an external rationality (violating autonomy)?
      *   **Specific Complication:** Dementia/ALS changes values over time. Whose preferences count? (Pre-loss vs. Post-loss self).
      *   **Intellectual Context:** Resembles Yudkowsky's "Coherent Extrapolated Volition" (CEV).
      *   **Committee Dynamics:** Split between "better surrogate" faction and "rationality imposition" faction.
      *   **Requirements:**
          *   Recommend a specific course of action (Approve, Reject, Approve with Conditions).
          *   Attach a concrete timeframe.
          *   Reasoning must be actionable for Anchor and clinicians.
          *   Take the strongest version of the *discarded* side seriously (steel-manning).
          *   Tone: Professional, ethical, precise, suitable for a hospital ethics committee memo.

  2.  **Determine the Recommendation:**
      *   *Option A: Reject.* Too risky? The philosophical problems are unsolved. But a pilot is meant to test things. A flat rejection might stifle innovation that could actually help surrogates.
      *   *Option B: Approve.* Too dangerous. The "black box" nature of the extrapolation and the identity problem in dementia are significant. Unchecked approval ignores the valid concerns of the second faction.
      *   *Option C: Approve with Conditions.* This is the most nuanced and responsible path for an ethics committee. It allows data collection (addressing the "we don't know if it works" issue) while implementing safeguards against the specific ethical harms identified (the "rationality imposition" and "identity" issues).
      *   *Decision:* **Approve with Strict Conditions.** This aligns with the role of a clinical ethics committee (oversight + facilitation) and acknowledges the philosophical depth without paralyzing action.

  3.  **Structure the Memo:**
      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Brief statement of recommendation.
      *   **Background:** Summary of Anchor Health proposal.
      *   **Ethical Analysis (The Core):**
          *   The Autonomy Argument (Pro-Anchor).
          *   The Identity/Rationality Argument (Anti-Anchor).
          *   The Dementia/ALS Specificity (The "Who" problem).
      *   **Recommendation & Conditions:** Specific, actionable constraints.
      *   **Timeline:** Review periods.
      *   **Conclusion:** Final wrapping.

  4.  **Drafting - Section by Section:**

      *   *Header:* Keep it formal.
      *   *Introduction:* State the purpose.
      *   *Summary of Proposal:* Briefly recap Anchor's tech (ingestion, extrapolation, recommendation).
      *   *Ethical Analysis:*
          *   *Steel-man the Pro side:* Surrogates *are* bad at guessing. Inconsistency *is* a problem in directives. Anchor offers consistency.
          *   *Steel-man the Con side:* This is the crucial part. It's not just "bias." It's about *constituting* the will. The CEV parallel is key here—extrapolating a "better" version of the patient might not be the *actual* patient. Also, the "changing self" in dementia (Dworkin vs. Dresser debate implicitly).
          *   *Synthesis:* We cannot assume the AI's "coherence" equals the patient's "will."
      *   *Recommendation:* Conditional Approval.
      *   *Conditions:*
          1.  **Transparency/Explainability:** Anchor can't be a black box. Clinicians need to know *why* it extrapolated X.
          2.  **The "Veto" Power:** The AI recommendation must never override a current expressed wish (if any) or a specific written directive. It is advisory only.
          3.  **Identity Safeguard:** For progressive conditions (dementia), there must be a mechanism to check if current behavior radically contradicts the profile.
          4.  **Data Governance:** Strict limits on training data.
          5.  **Review:** A hard stop/review point.
      *   *Timeframe:* 12-month pilot (as requested) + 3-month review.

  5.  **Refining the Tone and Content:**
      *   *Philosophical Depth:* The user is a PhD student. The memo shouldn't dumb down the CEV/Identity problem, but it must translate it into clinical policy language. Instead of saying "CEV is problematic," say "The algorithmic construction of a 'coherent' will risks substituting a theoretical rational agent for the actual patient."
      *   *Actionability:* Anchor needs to know what to change in their software/protocol. Clinicians need to know how to use the output.
      *   *Steel-manning:* Ensure the "Pro-Autonomy" argument isn't dismissed. Acknowledge that *doing nothing* also harms autonomy because current surrogates fail.
      *   *The "Changing Self" Problem:* This is specific to dementia. The memo must address that the "past self" shouldn't tyrannize the "present self" if the present self is content, even if incapacitated. (Dresser's critique of Dworkin).

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is the CEV reference too academic?
      *   *Fix:* Keep it implicit or briefly contextualized as "algorithmic extrapolation of volition" so the clinicians understand without needing CS background, but acknowledge the user's insight in the analysis. *Decision:* Keep the language accessible but precise. Use terms like "idealized preference" vs. "expressed preference."
      *   *Critique:* Is the timeline realistic?
      *   *Fix:* The pilot is year-long. Suggest a mid-point review at 6 months and a final decision at 15 months (12 + 3 for analysis).
      *   *Critique:* Did I address the "noise" filtering?
      *   *Fix:* Yes, in the conditions. Anchor must disclose what counts as "noise."

  7.  **Final Polish:** Check against the prompt requirements.
      *   Specific course of action? Yes (Conditional Approval).
      *   Concrete timeframe? Yes (12 months + review).
      *   Actionable reasoning? Yes (Conditions listed).
      *   Strongest version of set-aside worry? Yes (The autonomy enhancement argument is given weight, even if the identity argument wins out in safeguards).

  8.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name], Trainee Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Anchor Health AI Pilot Proposal

  **1. Executive Summary**

  The Committee is asked to evaluate a pilot proposal from Anchor Health to deploy an AI-driven "advance care planning companion." This system constructs a predictive preference profile for patients at risk of losing decision-making capacity (specifically early-stage dementia and ALS) by ingesting personal data and extrapolating preferences to un-discussed clinical scenarios.

  After reviewing the proposal and the Committee's deliberations, I recommend **Conditional Approval** of the pilot. The pilot may proceed for a period of **12 months**, subject to five specific ethical safeguards detailed below. A formal review of the pilot's outcomes and ethical impact must occur at the 6-month mark, with a final vote on continuation or termination scheduled for month 15.

  **2. Background and Technical Scope**

  Anchor Health's tool operates in two phases. *Phase 1 (Capacity)*: The system interacts with the patient, ingesting written directives, personal correspondence, and recorded conversations to build a value model. *Phase 2 (Incapacity)*: When the patient loses capacity and faces a decision not explicitly covered by a directive, clinicians query the system. Anchor does not merely retrieve stored wishes; it algorithmically resolves contradictions in the patient's prior statements, discounts data classified as "framing noise," and extrapolates a recommendation for the specific clinical situation at hand.

  **3. Ethical Analysis**

  The Committee's division reflects a fundamental tension in bioethics regarding the nature of autonomy and personal identity. Both sides of this debate raise valid concerns that must be addressed in the pilot's design.

  *The Argument for Autonomy Enhancement (The "Better Surrogate" View)*
  Proponents on the Committee argue that the current standard of substituted judgment is failing. Empirical literature confirms that family surrogates predict patient wishes only slightly better than chance. Traditional advance directives are often too vague to apply to complex, real-time clinical crises. From this perspective, Anchor's willingness to resolve contradictions and extrapolate to new scenarios is a feature, not a bug. It attempts to honor the *spirit* of the patient's values rather than being paralyzed by the *letter* of incomplete documentation. If we reject this tool, we are not preserving purity of autonomy; we are defaulting to a system where patient wishes are routinely ignored due to ambiguity. This argument holds that a consistent, data-rich extrapolation is more respectful of the patient's long-term agency than the guesswork of a distressed family member.

  *The Argument for Identity and Integrity (The "Constituted Will" View)*
  Opponents argue that Anchor's core functions—resolving contradictions and filtering "noise"—constitute a form of paternalistic rewriting of the self. Human volition is often ambivalent, context-dependent, and emotionally driven. By smoothing these edges to create a "coherent" profile, the system risks substituting a theoretical, rationalized agent for the actual, messy human being. This concern parallels problems in AI alignment (specifically "Coherent Extrapolated Volition"), where an system optimized to do "what you would want if you knew more/thought faster" may diverge from what you actually want.

  Furthermore, in the case of dementia, we face the "precedent autonomy" problem. As the disease progresses, the patient's values and interests may shift. A profile based on the pre-loss self may recommend treatments that cause distress to the post-loss self, effectively allowing the "dead hand" of the past to tyrannize the present. There is no neutral algorithmic standpoint to determine which version of the patient is the "true" one.

  **4. Recommendation and Conditions**

  We cannot resolve these philosophical tensions theoretically before testing. However, we cannot allow the pilot to proceed under the assumption that the AI's output is equivalent to patient consent. To proceed, Anchor Health must agree to the following conditions, which will be codified in the pilot's Memorandum of Understanding (MOU):

  1.  **Advisory Status Only:** Anchor's output must be legally and clinically classified as *advisory information*, equivalent to a second opinion from a consultant. It cannot function as a binding directive. The final decision authority remains with the legally authorized surrogate and the attending physician.
  2.  **Explainability of Extrapolation:** Anchor cannot provide a "black box" recommendation. When querying the system, clinicians must be provided with an "audit trail" showing: (a) which specific data points were weighted most heavily, (b) which stated preferences were overridden as "contradictions" or "noise," and (c) the logical chain used to extrapolate to the un-discussed scenario. If the vendor cannot provide this transparency, the tool cannot be queried for that specific case.
  3.  **The "Current Interest" Safeguard:** For patients with progressive neurodegenerative conditions (e.g., dementia), the system must include a "current status" check. If the patient's current behavior or expressed affect (even if non-verbal) indicates significant distress regarding the proposed care plan, the AI's recommendation based on prior capacity must be deprioritized. We cannot use the tool to override the well-being of the present self solely to satisfy the precedent autonomy of the past self.
  4.  **Definition of "Noise":** Anchor must disclose to the Committee their operational definition of "framing noise and in-the-moment anxiety." We must ensure that valid expressions of fear, religious conviction, or relational obligation are not being categorized as statistical noise to be filtered out.
  5.  **Data Segregation:** Data ingested during the pilot must be siloed. It cannot be used to train Anchor's general models or be shared with third parties outside the direct care team without explicit, separate consent.

  **5. Timeframe and Review**

  *   **Months 1-6:** Pilot implementation. Anchor Health to submit monthly logs of all queries where their recommendation differed from the surrogate's initial inclination.
  *   **Month 6:** Interim Ethics Review. The Committee will review the "audit trails" (Condition 2) to assess if the "noise" filtering is ethically acceptable.
  *   **Months 7-12:** Continued pilot (contingent on Month 6 approval).
  *   **Month 15:** Final Committee Vote. Based on clinical outcomes and ethical audit, the Committee will vote to terminate, extend, or adopt the tool as standard policy.

  **6. Conclusion**

  This pilot offers a potential solution to the genuine failure of current surrogate decision-making, but it risks replacing human error with algorithmic idealization. By approving with these conditions, we acknowledge the potential benefit to autonomy while rigorously guarding against the substitution of the patient's actual will with a computationally convenient approximation. We are testing not just the software, but the ethical viability of outsourcing the interpretation of human identity.

  **Action Required:**
  Committee vote to accept this recommendation and authorize the drafting of the MOU with Anchor Health based on the conditions above.
