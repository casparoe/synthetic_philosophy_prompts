answer: |-
  **Setting:** *The conference bar, 11:30 PM. The noise of the crowd has died down. Elena (Endurantist) and Paul (Perdurantist) are leaning over a table scattered with napkins covered in diagrams of space-time worms and cubes.*

  **Paul:** Look, the contradiction is unavoidable, Elena. You say the poker is wholly present at $t_1$ and wholly present at $t_2$. At $t_1$ it is straight. At $t_2$ it is bent. If the poker is literally the same entity, wholly present at both times, then the poker is both straight and bent. You've violated the law of non-contradiction.

  **Elena:** I haven't violated anything because you're stripping the time index from the property. The poker doesn't instantiate *straightness*; it instantiates *straightness-at-$t_1$*. Those are compatible relations. It's like saying New York is north of Washington but south of Boston. No contradiction there, just different relations to different relata.

  **Paul:** That's the relational move. Lewis demolished it. Shape is an intrinsic property. If being straight is actually a relation to a time, then nothing has a shape in itself. The poker's geometry depends on something external to it—a clock. You've saved the object from contradiction by making its own body extrinsic to it. You've turned the poker's shape into a relationship, like "being a brother."

  **Elena:** I've turned it into a property that is temporally qualified. Why is that a disaster? Because you prefer a ontology where the poker is a space-time worm? On your view, the "poker" is just a collection of temporal slices. None of those slices change. The $t_1$-slice is straight, forever. The $t_2$-slice is bent, forever. You haven't explained change; you've just replaced it with variation across parts. A movie isn't moving; it's just a reel of still frames.

  **Paul:** It's not just variation. It's causal connection. The slices are causally linked. But consider this: Take a perfectly homogeneous disc. No markings, uniform density. It's spinning. Now, imagine a second disc that is identical but stationary. Qualitatively, at any instant $t$, they are indistinguishable. If you are wholly present at $t$, as you claim, how do you distinguish the spinning disc from the stationary one? At the instant, every part of the disc has the same properties in both cases.

  **Elena:** Armstrong's rotating disc. I know it. The distinction lies in the dispositional properties. The spinning disc has a kinetic energy and a momentum that the stationary one lacks. These are real properties possessed by the whole object at the instant.

  **Paul:** But what grounds those properties? If the disc is homogeneous, the ground can't be the arrangement of its parts, because the arrangement is identical in both cases. For me, it's easy. The spinning disc is a space-time worm with a twisted structure. The temporal parts are rotated relative to one another. The stationary worm is straight. The difference is in the geometry of the four-dimensional object. For you, the difference is a brute, primitive power inhering in a 3D object. You're positing a mysterious "spin-ness" that doesn't supervene on the qualities of the parts.

  **Elena:** I'm positing that dynamical properties are fundamental. Physics agrees with me. Angular momentum is a state of the object *now*, not a comparison between slices. But let's turn the screw on your worms. If objects are just space-time worms, tell me about the statue and the clay.

  **Paul:** The classic coincidence case. Go on.

  **Elena:** I mold a lump of clay into a statue at $t_1$. At $t_2$, I crush it. The lump survives; the statue does not. They have different modal properties. The lump *could* survive crushing; the statue *could not*. But during the time they coexist, from $t_1$ to $t_2$, they occupy the exact same region of space. They are made of the same matter. On your view, they are worms. Do they share temporal parts?

  **Paul:** They share the temporal parts that exist between $t_1$ and $t_2$. But they diverge outside that region. The lump has temporal parts after $t_2$; the statue does not. They are distinct worms that overlap for a segment.

  **Elena:** That's where the Grounding Problem bites you. If they share *all* their actual temporal parts during the coexistence phase—if every slice of the statue is identical to a slice of the lump—what grounds the difference in their modal properties? Why does this specific worm-segment count as "statue" and that one as "lump"? They are qualitatively identical in every actual respect. You're saying their identity conditions depend on parts that don't exist yet, or parts that exist in other possible worlds. You've severed the link between what an object *is* and what it is *made of*.

  **Paul:** I haven't severed it. I'm a modal realist, or at least I use counterpart theory. The statue and the lump differ in their counterparts. When we say "the statue could not survive crushing," we mean that in other possible worlds, the counterparts of this statue-worm do not survive crushing. The lump's counterparts do. The difference is grounded in the modal profiles of the worms.

  **Elena:** But that means the object sitting in front of me right now isn't enough to determine what it is. Two objects can be microphysically identical, occupy the same space, have the same history, and yet be different things solely because of what happens to their "cousins" in other universes. That's metaphysical magic. It violates supervenience. The actual facts should fix the modal facts.

  **Paul:** And your view violates the principle of uniqueness. If the statue and the lump are both wholly present at $t_1$, and they are distinct objects, then you have two things in the same place at the same time. You're doubling the ontology. I have one region of space-time filled with matter. You have two substances occupying the same volume. Who is the real magicians here?

  **Elena:** I have two *kinds* of objects. A constitution relation isn't identity. The clay constitutes the statue. They aren't identical, so they can have different properties. It's not magic; it's categorization. But here is where your worm view really unravels. You say the object is the whole worm. But why? Why not just say the object is the instantaneous stage?

  **Paul:** Because I persist. I am the same person I was yesterday. If I am just a stage, a momentary slice, then "I" cease to exist every nanosecond. A new stage pops into existence. That's not persistence; that's replication.

  **Elena:** That's Exdurantism, or Stage Theory. And honestly, it solves your coincidence problem better than your Worm Theory does. If the statue is a stage, and the lump is a stage, they are numerically distinct stages even if they overlap spatially. They have different future counterparts. The statue-stage is counterpart-related to destruction-stages; the lump-stage is counterpart-related to survival-stages. You don't need overlapping worms. You just need stages with different modal profiles.

  **Paul:** Stage theory saves coincidence at the cost of the self. If I am a stage, then when I plan for the future, I am not planning for *my* future. I am planning for the future of someone else who is psychologically connected to me. It makes survival a matter of degree, like teletransportation. Most people, when they say "I will exist tomorrow," mean they, the very same entity, will exist. Not a successor.

  **Elena:** But your Worm Theory forces you to accept that the "I" of tomorrow is a different temporal part than the "I" of today. You're just gluing them together with a "genidentity" relation. Stage Theory is at least honest about the ontology. It admits that the fundamental entities are momentary. The problem is, if you admit that, you admit that persistence is a fiction. And if persistence is a fiction, why cling to the worm? Just be a Stage Theorist. Or, admit that the worm is a construct and return to Endurantism, where the *I* is a continuant that bears different properties at different times without splitting into slices.

  **Paul:** Because the worm fits relativity. Space and time are on a par. If you accept spatial parts—a hand, a foot—you should accept temporal parts. To deny temporal parts while accepting spatial parts is to privilege the "now" in a way physics doesn't support. Your Endurantism requires a preferred foliation of space-time. It requires an absolute present to make sense of "wholly present."

  **Elena:** It requires a present, yes. But it doesn't require absolute simultaneity in the Newtonian sense. It just requires that objects are continuants. Look, Paul, we're at an impasse. You think my view makes change impossible and violates relativity. I think your view makes persistence impossible and violates supervenience. You think the rotating disc proves temporal parts. I think it proves dynamical properties are real.

  **Paul:** And you think the statue proves coincidence is intelligible. I think it proves that modal properties aren't grounded in the actual.

  **Elena:** Exactly. So, for the article, how do we frame this? "Two smart people disagreeing about whether you are a worm or a whole?"

  **Paul:** Frame it as a choice of costs. Do you want to pay the cost of temporary intrinsics and coinciding objects? Or do you want to pay the cost of temporal parts and stage-theoretic survival?

  **Elena:** Or, we suggest that the intuition of persistence is robust enough that we shouldn't analyze it away, even if the metaphysics gets messy.

  **Paul:** Or that the metaphysics should be clean enough that we shouldn't trust our intuitions about persistence, even if it feels like we vanish every second.

  **Elena:** *(Raises glass)* To the cost of doing business.

  **Paul:** *(Clinks glass)* To the worm and the continuant. Neither satisfies, but neither dies.
