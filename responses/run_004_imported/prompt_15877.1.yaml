      *   The Problem: The weights are implicit in the function derived from the training cases. If a new case falls outside the training distribution, the interpolation might yield counterintuitive results. Or, the weighting might prioritize safety (non-maleficence) over autonomy in a way that feels like imprisonment to the user, even if the ethicists thought they balanced it.

