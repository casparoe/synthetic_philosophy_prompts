answer: |-
  Good evening, everyone. For those who don't know, I teach philosophy for a living. Which is why, when I was asked to give this toast, I was given a very strict directive: "Do not let Uncle Jerry near the microphone." Because, apparently, his Ship of Theseus toast two anniversaries ago still has people in this room questioning whether they are the same person they were when they arrived.

  So, I promise no ships. Instead, I want to talk about the Puzzle of the Statue and the Clay.

  Here's the problem: Imagine a sculptor shaping a lump of clay into a beautiful figure. At the moment the sculpture is finished, the statue and the clay occupy the exact same space. They weigh the same. They are made of the same stuff. So, are they identical?

  Metaphysically, the answer is no. And the proof is in how they survive change. If you squash the figure, the clay survives—it's still a lump of matter. But the statue? The statue is gone. They have different "persistence conditions." Because they can't survive the same changes, they can't be the same thing. The clay *constitutes* the statue, but it isn't *identical* to it.

  And this, Mom and Dad, is exactly what you have built for forty years.

  You two are the clay. Over four decades, you have changed immensely. You've changed careers, you've changed hairstyles, you've changed opinions on what constitutes a good casserole. You are not the same physical or psychological people you were in 1984.

  But your marriage? The marriage is the statue. It has remained the *same* marriage through all those changes. It has persistence conditions that are different from yours. You can change, and it stays the same.

  Now, here is the part where my colleague in the third row is nodding, and the rest of you are checking your watches. The philosophical point is this: Because the marriage has different survival conditions than you do, it is a distinct entity. It isn't just "Mom plus Dad." It isn't even "Mom and Dad lumped together." It is something new, constituted by you, but not identical to you.

  This is why divorce is logically possible while both spouses live on. The statue can be destroyed while the clay remains. That is the modal mismatch. But looking at you two tonight, that possibility remained merely *modal*. You protected the form. You maintained the shape.

  You didn't just exist side-by-side for forty years. You sculpted something that is greater than the sum of its parts. You created an entity that has its own history, its own dignity, and its own life.

  So, I'd like to propose a toast.

  To the clay: May you continue to endure, change, and thrive.
  And to the statue: May this beautiful thing you constituted together stand firm for another forty years.

  Happy Anniversary.
