      *   This is a classic "Dutch Book" scenario.
      *   Probabilities of mutually exclusive and exhaustive events *must* sum to 1 (or 100%).
      *   If they sum to > 100%, the bookmaker (the PM) is offering odds that imply a negative margin for themselves and a guaranteed positive margin for the counterparty.
      *   If they sum to < 100%, the bookmaker has a guaranteed margin (like a casino vig).
