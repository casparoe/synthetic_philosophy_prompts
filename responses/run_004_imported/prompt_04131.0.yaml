answer: |-
  You are not missing anything obvious. In fact, you've stumbled onto a classic concept in probability and economics called a **Dutch Book**.

  Here is the breakdown of why this works, why your PM made the mistake, and whether you should exploit it.

  ### 1. The Math: You are absolutely right
  In any probability distribution where the outcomes are **mutually exclusive** (only one can happen) and **exhaustive** (one *must* happen), the sum of the probabilities must equal 100% (or 1.0).

  *   **Q3:** 45
  *   **Q4:** 40
  *   **Next Year:** 35
  *   **Total:** 120

  By offering prices that sum to 120, he is effectively selling a $1.00 bill for $1.20.

  If you take the opposite side (sell/short all three outcomes):
  *   You collect **120 points** in premium upfront.
  *   Exactly one outcome will occur, forcing you to pay out **100 points**.
  *   **Net Profit:** 20 points, risk-free.

  This is pure arbitrage. In a real financial market, high-frequency trading algorithms would eat this up in milliseconds until the prices normalized.

  ### 2. Why did he do it? (Is he bad at guessing?)
  It's not necessarily that he's "bad" at guessing; it's that he is treating the numbers as **confidence scores** rather than **probabilities**.

  Humans are notoriously bad at intuitive probability. He likely looked at each timeline in isolation:
  *   *"Do I feel good about Q3? Yeah, 45% good."*
  *   *"Do I feel okay about Q4? Yeah, 40% okay."*
  *   *"Is there a chance it slips? Yeah, 35% chance."*

  He didn't normalize the distribution. Since he's into poker, he should theoretically know this, but poker players often focus on *pot odds* in specific hands rather than constructing coherent probability trees for future events. He might also be trying to incentivize trading by offering "juicy" odds to get people involved, not realizing he left the vault open.

  ### 3. Sharp Trader vs. Jerk Move
  This is the tricky part. The answer depends entirely on the **context of the market**.

  **If this were real money:**
  You are a **Sharp Trader**. In an efficient market, arbitrageurs perform a vital service. By taking this bet, you force the prices to correct, making the market more accurate for everyone else. You found inefficiency; you extracted value. That is the game.

  **Since this is fake points (Internal Slack Bot):**
  You are leaning toward **Jerk Move** if you do it quietly. Here is why:

  1.  **It Kills the Game:** Prediction markets work best when people are betting based on sentiment and information. If you lock in a guaranteed win using a math loophole, you aren't participating in the spirit of the game. You're exploiting a bug.
  2.  **Office Politics:** This is a PM (Product Manager). While it's a game, making a superior look mathematically incompetent in a public channel for a guaranteed 20-point profit might be perceived as "that guy who takes everything too seriously."
  3.  **The "Fake Money" Paradox:** Since the points have no cash value, the only currency here is **social capital**. Gaining 20 fake points is worth less than the potential social friction of pointing out your PM's math error by taking his lunch money.

  ### The Recommendation
  **Don't take the trade quietly. Tell him.**

  Since he likes poker, frame it in those terms. Send him a DM:

  > *"Hey, I was looking at the odds you posted for the feature ship date. I think you might have accidentally created a 'Dutch Book' opportunity. The probabilities sum to 120%, which means someone could sell all three outcomes and guarantee a 20-point profit against you. Since you're the poker player, I figured you'd want to know before the bots (or me) arb it out!"*

  **Why this is the winning move:**
  *   **It shows competence:** You understand the math and the market mechanics.
  *   **It's helpful:** You saved him from losing points unnecessarily.
  *   **It builds rapport:** You're treating him as a fellow poker-savvy person who made a slip-up, rather than an adversary to be exploited.
  *   **It fixes the market:** He will likely adjust the prices to sum to 100% (e.g., 45/37/18 or similar), making the prediction market actually useful for gauging team sentiment.

  **Verdict:** You found a math glitch, not a trading edge. In a fake-money internal tool, the "smart" play is to fix the glitch, not exploit it.
