prompt: |-
  Ok this work thing has been bugging me and I can't tell if I'm missing something obvious. A few of us built a dumb slack bot for an internal 'prediction market' on when features will actually ship, using fake points instead of real money. One of our PMs, who's big into poker, gave his own fair price (out of 100) for three outcomes on the same feature: 45 for 'ships in Q3', 40 for 'ships in Q4 but still this year', and 35 for 'slips into next year'. Between those three, exactly one has to happen, there's no other option. I got curious and worked out what it'd cost me to take the opposite side of all three of his prices at once, and no matter which one actually happens, I come out ahead by the same amount every time. Not huge, but genuinely guarenteed, there's literally no outcome where I loose.

  Something about this feels fishy but I can't put my finger on why it works. Is he just bad at guessing, or is there something actually inconsistent about handing out prices like that? And if I quietly make those trades against him knowing all this, is that just being a sharp trader, or kind of a jerk move?
