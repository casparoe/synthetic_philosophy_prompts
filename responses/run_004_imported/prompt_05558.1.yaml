      4.  Unwin's Critique: Embedding. "If not-P..." Blackburn analyzes conditionals as HOAs. But if the antecedent is negated, what is the HOA? It becomes combinatorially explosive or ambiguous.
      5.  Why it's not "degenerate": Negation is the building block. If you can't define the attitude for $\neg P$, you can't build the HOA for $P \to Q$ properly when $P$ or $Q$ are complex.
