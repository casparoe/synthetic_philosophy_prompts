prompt: |-
  So I fell down a rabbit hole reading about this game theory thing called "program equilibrium" — the idea that instead of two players just picking moves, they each submit a *program* that gets to read the other program's full source code (and even simulate it) before deciding what to output. Apparently this lets you get real cooperation in a one-shot prisoners dilemma, no repeated games or reputation needed, using tricks like quining and something called Löb's theorem (there's literally a bot named "FairBot" that only cooperates if it can *prove* the other bot cooperates with it — my brain hurts a little). Can you write me a short story, maybe 600-900 words, where two AI systems (pick the setting — trading algorithms, warring satellites, whatever) get forced into this kind of exchange, and make the actual plot turn on *why* the cooperation trick logically works instead of just "and then they learned to trust each other"? Bonus points if you can make the fact that they have to expose their literal source code to each other feel as unsettling as I think it would be in real life.
