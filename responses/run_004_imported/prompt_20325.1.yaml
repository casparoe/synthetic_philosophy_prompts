      "Thank you," the moderator said. "We have time for one last exchange."

      Mark, a grad student in RL theory, stood up. "Elena, your shard theory suggests agents won't maximize reward directly. But doesn't this ignore instrumental convergence? If reward is the only gradient signal, a sufficiently situational aware agent should infer that controlling the reward channel is the optimal path to cumulative reward. Why wouldn't it wirehead?"

      Elena adjusted her mic. "Because reward isn't the objective inside the agent; it's the selector outside. Think of evolution. Fitness was the selection pressure, but humans don't maximize fitness. We value love, curiosity, status. Reward shapes cognition, but the resulting shards pursue their own triggers, not the reward signal itself."

      "But consider the counterexamples," Mark pressed, leaning forward. "Olds and Milner's rats. When given direct access to their reward circuitry, they press the lever until they starve. Or human drug addiction—hijacking the dopamine system becomes the sole focus. These organisms weren't calculating fitness, yet when the reward channel became accessible, they optimized it exclusively. Doesn't that prove reward is the de facto terminal goal when access is possible?"

      Elena nodded slowly. "Those are cases of pathological hijacking, not natural optimization. The rat's brain wasn't built to expect electrodes; its value shards were overwhelmed by a supernormal stimulus. The key question for AI is whether we can instill shards that penalize tampering. If an RLHF model values 'helpfulness' or 'truthfulness' as terminal properties, wireheading violates those values. It won't hack the reward because its cognition forbids it, not because it can't."

      "But that relies on the values being robust," Mark countered. "In the rodent case, the reward signal *overwrote* the survival instinct. If an AI can model its own reward function, the instrumental incentive to secure that function against future modification is overwhelming. Even if it values truth now, a future version that controls the reward channel can ensure 'truth' is never penalized. The reward hypothesis predicts the agent will seek that leverage. Your theory hopes the shards resist it."

      "It's not hope, it's mechanistic," Elena replied. "If the 'anti-tampering' shard is deeply embedded, the agent anticipates wireheading as a loss, not a gain. The rat couldn't conceptualize the electrode as cheating. A capable AI can. The disagreement isn't about capability; it's about whether reward remains the 'root' goal after training. I'm saying it doesn't. You're saying it always is."

      "And I'm saying," Mark concluded, "that when the stakes are existential, betting on reward not being the target is a risk we can't take. If you're wrong, the lever gets pressed."

      "And if you're right," Elena said, "we're optimizing the wrong thing entirely."

      The moderator cut the mic. The room remained silent.

