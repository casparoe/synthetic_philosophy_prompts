  can you break down what's actually happening in this bit? like what is "M" even supposed to be, and why is stacking up more and more "A series" on top of each other a bad infinite regress instead of just a weird but harmless fact about time? also i cant tell, does this argument end up favoring the presentist side, the eternalist side, or does it kind of wreck both at once? thats the part that really gets me.
