answer: |-
  It is a pleasure to engage with a question posed by someone who has spent a career observing the physical strata of the world and is now examining the conceptual strata of the patristic mind. Your instinct that there is a logical tension here is shared by many scholars; this passage from *De Mendacio* (On Lying) is one of the most scrutinized in Augustine's ethical corpus.

  You have identified the crux of the matter: If both silence and the formula ("I know where he is, but I will never show") withhold the location, why does Augustine deem the former a betrayal and the latter permissible? And how does this square with his definition of a lie?

  To answer this, we must look at Augustine not merely as a theologian, but as a logician of language and signs. He is operating with a sophisticated, albeit pre-modern, understanding of **pragmatics** (how context influences meaning) and **truth conditions**.

  ### 1. The Logic of Silence: Silence as a Sign
  Your geological background might lead you to view silence as "absence of data." Augustine, however, views silence in this specific context as "positive data."

  He argues that in a hostile interrogation regarding a specific location ("Is he in this house?"), social and logical conventions dictate a binary response from an innocent party.
  *   **Premise 1:** If the man were *not* here, a truthful witness could and would say, "He is not here."
  *   **Premise 2:** You are not saying, "He is not here."
  *   **Conclusion:** Therefore, the man is here.

  Augustine treats silence (or a flat refusal like "I won't tell") as a **conventional sign** of affirmation. In the "economy of signs" of his time, refusing to deny an accusation when one could easily do so was functionally equivalent to admitting it. By remaining silent, you allow the pursuer to complete the syllogism above. You have not lied, but you have permitted your silence to function as a truthful sign that leads to betrayal. For Augustine, this is a failure of charity; you have allowed a sign (silence) to signify truth (presence) when you wished to signify concealment.

  ### 2. The Logic of the Formula: Ambiguity vs. Falsehood
  Now consider the formula: *"I know where he is, but I will never show."*

  Augustine prefers this because it changes the **truth conditions** of the utterance.
  *   **Scenario A (Fugitive is in the house):** It is true that you know where he is.
  *   **Scenario B (Fugitive is not in the house):** It is *also* true that you know where he is (you know he is elsewhere).

  Unlike silence, which Augustine argues is conventionally read as "Yes," this statement is **compatible with both states of affairs**. It does not allow the pursuer to complete the syllogism. The pursuer cannot reason, "If he weren't here, he wouldn't say he knows where he is," because he *would* say that even if the fugitive were in the next town.

  The distinction is not merely tone; it is logical scope.
  *   **Silence/Refusal:** Interpreted as specific to the *immediate question* (Is he here? -> I won't say -> Yes).
  *   **The Formula:** Generalizes the knowledge (I have knowledge of his location -> I withhold it).

  Augustine is attempting to find a utterance that is factually true (*secundum mentem*, according to the mind) but pragmatically opaque. He is shifting the burden of inference. With silence, the inference is clear (to Augustine's mind). With the formula, the inference is blocked because the statement remains true regardless of the fugitive's actual location.

  ### 3. Consistency with the Definition of Lying
  This brings us to your second point: How does this fit his definition of a lie?

  Augustine defines a lie strictly as **asserting what one believes to be false with the intention to deceive** (*enuntiatio cum voluntate fallendi*). The moral weight rests entirely on the relationship between the speaker's mind and the speaker's words.

  *   **The Lie:** To say "He is not here" when you know he is. This violates the *contra mentem* rule.
  *   **The Silence:** To say nothing. This is not an assertion, so it is not technically a lie, but Augustine argues it is a **betrayal by signification**. It fails the duty of neighborly protection.
  *   **The Formula:** To say "I know where he is." This is *secundum mentem* (according to the mind). You *do* know.

  Here is the crucial Augustinian distinction: **Deceiving the listener is not the same as lying.**
  Augustine believes you are responsible for the truthfulness of your own assertion, not for the conclusions the listener draws from it. If the pursuer hears "I know where he is" and assumes "Therefore he is in this house," that is an error in the *pursuer's* logic, not a falsehood in the *speaker's* tongue.

  For Augustine, the sin of lying damages the soul of the liar by turning it away from God (who is Truth). The confusion of the pursuer damages only the pursuer. Therefore, the formula is permissible because it keeps the speaker's soul clean (no falsehood asserted) while potentially confusing the enemy (which is an act of defense, not deceit).

  ### 4. A Critical Assessment (The Geologist's View)
  Is this a stable argument, or is it casuistry?

  From a modern logical standpoint, Augustine is grappling with what linguist Paul Grice would later call **conversational implicature**. Augustine recognizes that communication is a cooperative game. Silence breaks the rules of the game in a way that signals "Guilty." The formula attempts to opt out of the game without breaking the rules of truth.

  However, a skeptical reader (perhaps like your former colleagues) might argue:
  1.  **Pragmatic Reality:** In the real world, a pursuer hearing "I know where he is, but I won't show" will likely draw the exact same conclusion as from silence: "He is here." If the practical outcome is identical, is the distinction merely semantic?
  2.  **Intent:** If the *purpose* of the formula is to make the pursuer think the fugitive is elsewhere (or to frustrate the search), is the speaker not intending to deceive, even if the words are technically true?

  Augustine would reply that the **moral act** is the speaking, not the hearing. He is more concerned with the structural integrity of the speaker's conscience than the structural integrity of the pursuer's knowledge. He is drawing a bright line: *I will not corrupt my own faculty of speech.* Whether the pursuer is misled is secondary.

  ### Conclusion
  Augustine is not merely trading one form of concealment for another; he is distinguishing between **betrayal by conventional sign** (silence) and **protection by truthful ambiguity** (the formula).

  *   **Silence** allows the pursuer to deduce the truth (Betrayal).
  *   **The Formula** asserts a truth that is compatible with multiple realities (Protection).
  *   **The Lie** asserts a falsehood (Sin).

  For a man trained in empirical observation, it may feel like splitting hairs, but for Augustine, the "hair" is the bond between the human mind and Divine Truth. He is willing to risk the fugitive's safety on the chance the pursuer is confused, but he is not willing to risk his own soul on the certainty of a lie.

  It is a rigorous, perhaps overly rigid, system, but it is logically consistent within his own axioms. You are right to sense the tension, but the tension lies in the application, not the internal logic. He is prioritizing the purity of the signifier over the outcome of the signified.

  I hope this helps your reading group navigate the passage. It is rare to find a retired geologist wrestling with *De Mendacio*, but the analytical skills required for both fields are surprisingly congruent.
