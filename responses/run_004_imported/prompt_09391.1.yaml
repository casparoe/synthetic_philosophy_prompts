answer: |-
  Good evening. For those who don't know me, I'm the brother of the bride. And like many siblings, I've spent a lifetime trying to understand my sister. Usually, that involves asking normal questions like, "Are you happy?" But because this is [Sister's Name] and [Partner's Name], the questions are rarely normal.

  They met in a seminar on early twentieth-century ethics. They left academia to save medieval stained glass. And for the last five years, a significant portion of their romantic dialogue has consisted of arguing whether a window loses its soul if you replace the cracked glass with a perfect modern reproduction.

  It turns out, this isn't just a technical dispute. It's a philosophical one. And because I recently spent a few weeks reading the very book they studied that semester—G. E. Moore's *Principia Ethica*—I happen to know who wins that argument.

  Moore, a man not known for his warmth, made some startling claims about value. He argued that a beautiful world is intrinsically better than an ugly one, even if no human being is ever there to see it. He argued that a real beautiful object is better than an equally beautiful copy, simply because it is *real*.

  So, [Partner's Name], when you argue that the medieval glass holds a value the reproduction cannot match, Moore is on your side. The authenticity matters. The history matters. The thing itself is a good, independent of its use.

  But here is where I need you to listen, because Moore saves his most important argument for the very end of the book. After he finishes talking about beauty and art, he asks: What is the greatest good a human life can contain?

  He says it isn't the glass. It isn't even the beauty of the glass. It is personal affection.

  However, Moore goes further. He suggests that simply loving someone isn't the highest peak. The highest form of affection—the rarest and most valuable thing we can experience—is loving someone for *how they love other people.* It is a second-order love. It is cherishing the way your partner cherishes the world.

  When I look at the two of you, I don't just see a couple in love. I see this specific, Moorean ideal in action.

  [Sister's Name], I watch you watch him. I see how much you love the way he treats strangers, the way he cares for the broken fragments of history, the way he loves you. And [Partner's Name], I see the same in you. You aren't just in love with her; you are in love with her capacity for love.

  In a world that often asks us to value things for their utility or their price, you have chosen a different ethic. You preserve the real, yes. But more importantly, you recognize that the greatest reality between you is not the glass you save, but the affection you hold.

  Moore wrote that these states of consciousness—this mutual appreciation of loving hearts—are "by far the most valuable things we know or can imagine." He called them the ultimate justification for human existence.

  So, if I may ask you to raise your glasses. Not to the beauty of the room, which is great. Not to the authenticity of the occasion, which is real. But to the highest good.

  To [Sister's Name] and [Partner's Name]. May you always love the world, and may you always love the way you love each other.

  Cheers.
