      *   **The Tension:** To calculate that expectation, the agent needs to know logical implications (e.g., "If I choose X, Omega predicts X"). This looks like "learning" or "updating" on logical facts.
      *   **The Distinction:**
          *   *Empirical/Indexical Uncertainty:* "Which world am I in?" (e.g., Did the coin land heads? Am I the real person or the simulation?). UDT says: Don't condition on this to choose the policy. Treat it as part of the expectation integral.
          *   *Logical/Mathematical Uncertainty:* "What is the consequence of action A?" (e.g., Does $2+2=4$? Does this code output 'Cooperate'?). UDT says: You *must* resolve this to evaluate the policy.
      *   **The "Principled Line":** It lies in the difference between *indexical conditioning* (locating oneself in the multiverse/logical space) vs. *logical deduction* (evaluating the function that maps policies to outcomes).

  3.  **Drafting the Explanation - Step-by-Step:**

