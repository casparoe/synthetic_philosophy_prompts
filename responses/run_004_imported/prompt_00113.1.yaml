          *   UDT: $Policy = \arg\max_\pi E[U | do(\pi)]$. Here, the expectation is over the *prior*, which includes all possible observations $O$.
          *   *Crucial Point:* Inside the expectation calculation, you *do* use logic. You say "In the branch where $O=Heads$, $\pi$ does X. In the branch where $O=Tails$, $\pi$ does Y." You aren't updating *on* $O$ to pick $\pi$; you are integrating *over* $O$.
