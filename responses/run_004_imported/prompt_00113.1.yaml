answer: |-
  This is an exceptionally sharp question. You have put your finger on exactly the tension that keeps decision theorists up at night. Most pop-expositions of Updateless Decision Theory (UDT) gloss over this because formalizing it requires wading into the murky waters of *logical uncertainty*, which is arguably the hardest open problem in the field.

  As a chemist, you're used to a distinction between *state variables* (where the system is) and *laws of motion* (how the system behaves). The tension you're sensing is essentially the difference between updating on **indexical evidence** (where am I in the state space?) versus updating on **logical evidence** (what are the laws of motion governing this space?).

  Here is the breakdown of the principled line, where it gets blurry, and why it's not just sloganeering.

  ### 1. The Principled Line: Conditioning vs. Evaluation

  To see the distinction, we have to look at the math of the decision rule.

  **Standard Causal Decision Theory (CDT)** works roughly like this:
  1.  Observe evidence $O$ (e.g., "The coin landed Heads").
  2.  Update your probability distribution: $P(World | O)$.
  3.  Choose an action $A$ that maximizes expected utility given that updated distribution.

  **UDT** changes the order of operations:
  1.  Define a Policy $\pi$ (a function that maps observations to actions: $O \rightarrow A$).
  2.  Evaluate the expected utility of that policy over the **prior** distribution $P(World)$, *before* conditioning on $O$.
  3.  Commit to the $\pi$ that maximizes that expectation.
  4.  When you actually observe $O$, you simply execute $\pi(O)$.

  **The Distinction:**
  *   **Forbidden Updating (Indexical):** This is step 2 in CDT. It is narrowing the set of possible worlds to only those compatible with your specific observation. UDT forbids this *for the purpose of policy selection*. You must care about the branches where the coin landed Tails, even if you are currently holding a Heads coin, because your policy had to be selected before the flip to be optimal in the Counterfactual Mugging.
  *   **Required Updating (Logical):** This happens *inside* the evaluation of the policy in step 2 of UDT. To calculate the expected utility of $\pi$, you must deduce the consequences of $\pi$. You need to know: "If I run policy $\pi$ in a world where Omega predicts X, what happens?"

  You cannot answer that question without "updating" on logical facts. You have to compute the output of Omega's prediction algorithm. You have to derive that $2+2=4$. You have to resolve logical uncertainty to fill out the payoff matrix.

  **The Line:** The line is between **locating yourself** in the multiverse (indexical) vs. **mapping the structure** of the multiverse (logical). UDT says: "Don't use your location to choose the map, but you must build the map to know where the treasure is."

  ### 2. The Mechanism: Logical Uncertainty as a Prior

  You asked how this is compatible. The compatibility relies on treating logical facts as part of the "world state" in the prior, rather than as evidence that arrives later.

  In standard Bayesianism, logical truths are usually assigned probability 1 immediately (logical omniscience). But real agents (and UDT agents) are not logically omniscient. They have uncertainty about math.

  *   **Empirical Uncertainty:** "Is the coin Heads or Tails?" (50/50).
  *   **Logical Uncertainty:** "Does Omega's source code output 'True' or 'False' given my policy?" (Maybe 90/10 until I run the simulation).

  When a UDT agent "updates" on logic (e.g., it runs a simulation and proves Omega will predict Cooperate), it is not conditioning on an indexical observation like "I am in the branch where Omega predicted Cooperate." It is refining its understanding of the **functional relationship** between its policy and the outcome.

  In UDT terms, you are not updating $P(World | Observation)$. You are updating your estimate of the function $Outcome = f(Policy, World)$.

  *   **Indexical Update:** "I am in World A, so I ignore World B." (UDT forbids this).
  *   **Logical Update:** "I now understand that $f(\pi, World A)$ yields \$100." (UDT requires this).

  ### 3. The "Soft Spot": Formalizing Logical Updates

  Now, to your suspicion: *Is this a known soft spot?*

  **Yes.** Absolutely.

  While the distinction I drew above is the *intended* principled line, formalizing "logical updating" in a way that doesn't break UDT is the single biggest technical hurdle in the field right now. This is the domain of **Logical Induction** and **Proof-Driven Decision Theory** (largely developed by researchers at MIRI and associated circles).

  The problem is this: If an agent can update on logical facts, can it trick itself?
  *   *Example:* If I can prove that "Taking action A leads to disaster," I won't take Action A. But if my decision theory is too tightly coupled with my proof system, I might run into Löbian obstacles (self-referential paradoxes where the agent refuses to act because it can't prove its action is safe, even when it is).

  The "hand-waving" you sensed in blog posts is often because the authors are assuming a "magical" logical oracle that can evaluate counterfactuals without running into Gödelian limits.

  However, it is not *just* hand-waving. The research program of **Logical Induction** (Garrabrant et al., 2016) is an attempt to create a rigorous framework for how an agent assigns probabilities to logical statements *before* proving them, and how it updates those probabilities as it computes.
  *   In this framework, "updating on logic" is treated as a convergence process over time, distinct from "conditioning on empirical data."
  *   UDT is then layered on top of this: The agent selects a policy that maximizes utility according to its *current* logical inductor, but it selects that policy as if it were binding across all logical possibilities consistent with its prior.

  ### 4. A Chemist's Analogy

  Since you mentioned titration curves, let's try an analogy from reaction engineering.

  Imagine you are designing an automated reactor controller.
  *   **The World:** The reactor can be in State H (High Temp) or State L (Low Temp).
  *   **The Observation:** A sensor tells you the current temp.
  *   **The Logic:** The laws of thermodynamics and the reaction kinetics (which are fixed but complex).

  **CDT Approach:**
  You wait for the sensor to read "High Temp." You update your belief: "We are in State H." You then decide what valve to open *right now* to optimize for State H. You ignore State L because you aren't there.
  *   *Failure mode:* If the sensor is correlated with a future explosion (Newcomb/Parfit style), looking at the sensor might screen off the causal link to the explosion, causing you to fail.

  **UDT Approach:**
  Before the reactor is even turned on (behind the veil), you write the control software (the Policy).
  *   You do not know if the reactor will start in H or L.
  *   You **must** use the laws of thermodynamics (Logic) to calculate: "If I write software that closes the valve at H, the pressure spikes. If I write software that opens it, it cools safely."
  *   You optimize the software code based on the probability distribution of starting states (the Prior).
  *   Once the reactor is running and the sensor reads "H," you do **not** rewrite the software. You just let the software execute the branch written for "H."

  **The Compatibility:**
  To write the software, you had to "update" on the laws of thermodynamics (you had to learn the kinetics). But you did not "update" on the starting temperature to choose the software. You integrated over both possibilities.

  The "soft spot" arises if the laws of thermodynamics are so complex you can't calculate them perfectly. You have to approximate them. How do you update your approximation without biasing your policy selection? That is the Logical Induction problem.

  ### 5. Summary

  1.  **The Line is Real:** There is a principled distinction between **indexical conditioning** (narrowing the set of worlds to find yourself) and **logical deduction** (evaluating the consequences of policies within those worlds). UDT forbids the former for policy selection but requires the latter for policy evaluation.
  2.  **It's Not Sloganeering:** The math holds up *if* you assume logical omniscience. The policy $\pi$ is a function evaluated over the prior $P(World)$, not the posterior $P(World | Observation)$.
  3.  **The Soft Spot is Acknowledged:** The difficulty lies in formalizing how a bounded agent performs that logical deduction without falling into self-referential paradoxes. This is active research (Logical Induction), not ignored ignorance.
  4.  **Why it feels like updating:** Because learning a logical fact *feels* like learning an empirical fact. But in UDT, logical facts are treated as structural features of the territory, while empirical/indexical facts are treated as coordinates within the territory. You need to know the structure to navigate, but you shouldn't let your coordinates decide the map.

  You haven't missed a chapter; you've identified the frontier. The "updatelessness" applies to *where* you are, not *what is true*. But drawing that boundary rigorously in a computable agent is the hard part.
