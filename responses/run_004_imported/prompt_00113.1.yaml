      *   **Topic:** Updateless Decision Theory (UDT).
      *   **Core Question:** What is the distinction between *forbidden* updating (on indexical/empirical evidence about which branch you're in) and *required* updating (on logical/mathematical facts derived during computation)? Is there a principled line, or is it a hand-wavy gap in the theory?
