prompt: |-
  I cover science and ideas for a living, and outside of the actual writing I sit on my outlet's small internal standards committee -- three of us who get pulled in whenever theres a real fight about how a story got worded. We've got a case this week that's exposed a genuine fault line on the committee, and even though nobody would put it this way, I'm pretty sure we're actually arguing about epistemology without realizing it.

  Two incidents, both reporters who stated something flatly as fact in a published piece rather than hedging it as an allegation. Reporter A had two well-placed independent sources plus internal documents that all lined up -- did everything you'd want a careful reporter to do -- and the claim still turned out to be false, for reasons nobody could have caught in advance. Reporter B ran with a single tip she barely had grounds to trust, wrote it up as settled fact anyway, and it turned out to be exactly right. Half the committee wants to clear A and discipline B, on the theory that you can only be judged on what you had good reason to believe at the time, truth be damned. The other half wants it reversed, since isn't getting it right the whole point of stating something as fact instead of hedging it? And our editor-in-chief, who is not helping, wants a rule like "state it as fact only if you'd bet your job on it," which is really a rule about how sure you feel, not about your evidence or the truth at all.

  I interviewed an epistemologist a few years back for an unrelated story, and I have this nagging memory that "what has to be true of you before you're entitled to just flatly assert something" is an actual, named debate in philosophy, not something our committee is inventing from scratch -- I just never got the terms straight and don't want to fake my way through Thursday's meeting. Could you write the memo I need to bring? I want an actual recommendation, not a split-the-difference shrug: either one standard or an explicit ranked set of them if you think no single one can do the job, applied directly enough to A and B that it's clear whether either of them should face consequences, plus the strongest honest case for whichever standard you end up rejecting, since I will absolutely get challenged on it in the room.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Science/ideas writer, member of a 3-person internal standards committee at a media outlet.
      *   **Problem:** A dispute over two reporters (A and B) regarding stating claims as fact vs. hedging.
          *   Reporter A: Good process (2 sources + docs), claim turned out false.
          *   Reporter B: Bad process (1 shaky tip), claim turned out true.
          *   Committee Split: Process vs. Outcome.
          *   Editor-in-Chief (EiC): Subjective confidence ("bet your job").
      *   **User's Insight:** Suspects this is an epistemological debate (justification vs. truth).
      *   **Task:** Write a memo for the Thursday meeting.
      *   **Requirements:**
          *   Identify the relevant philosophical concepts/debates.
          *   Provide an *actual recommendation* (no fence-sitting).
          *   Apply the standard directly to Reporters A and B.
          *   Include the strongest case for the *rejected* standard (steel-manning the opposition).
          *   Tone: Professional, intellectual but practical, authoritative but collaborative.

  2.  **Identify the Epistemological Core:**
      *   The core tension is between *Justification* (Process/Evidence) and *Truth* (Outcome/Reality).
      *   In epistemology, the standard definition of Knowledge is "Justified True Belief" (JTB).
      *   The Gettier Problem: Cases where someone has a Justified True Belief, but it seems like luck rather than knowledge (similar to Reporter B).
      *   The specific debate: *Internalism* (what the agent knows/reasoning) vs. *Externalism* (reliability of the process/truth connection).
      *   More specifically for journalism ethics: *Evidentialism* (belief proportional to evidence) vs. *Veritism* (truth as the primary goal) vs. *Reliabilism* (process reliability).
      *   The Editor's suggestion ("bet your job") is *Subjective Certainty* (Psychologism), which is generally frowned upon in epistemology because confidence $\neq$ justification.

  3.  **Determine the Recommendation:**
      *   Journalism cannot operate on outcome-based standards (Truth/Veritism) alone because journalists don't have a time machine. If we punish A and reward B, we incentivize gambling and punish diligence.
      *   Journalism cannot operate on subjective confidence (EiC's view) because confidence is biased and uncalibrated.
      *   Journalism *must* operate on Process/Justification (Evidentialism/Reliabilism). The goal is not omniscience; it's responsible assertion based on available evidence.
      *   *Decision:* Side with Reporter A (Process) and discipline Reporter B (Process).
      *   *Philosophical Label:* **Responsible Assertibility** (based on Evidentialism/Reliabilism). We are judging the *warrant*, not the *world*.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the gravity of the dispute. Validate the intuition that this is philosophical.
      *   **The Philosophical Context:** Briefly explain the "Justified True Belief" framework and the "Gettier Problem."
          *   Reporter A = Justified, False Belief (Unlucky, but professional).
          *   Reporter B = Unjustified, True Belief (Gettierized/Lucky, but unprofessional).
          *   EiC = Subjective Confidence (Psychological state, not epistemic warrant).
      *   **The Recommendation:** Adopt a **Process-Relative Warrant Standard**.
          *   Rule: A claim is assertible as fact if the evidence *at the time of publication* meets the outlet's threshold for reliability, regardless of subsequent falsification.
          *   Application:
              *   Reporter A: Cleared. Met the burden of proof. Falsehood was unforeseeable.
              *   Reporter B: Disciplined. Did not meet the burden of proof. Truth was accidental.
              *   EiC Rule: Reject. Confidence is not evidence.
      *   **The Steelman (The Counter-Argument):** Why might someone argue for the Outcome/Truth standard?
          *   Accountability to reality.
          *   Reader trust is damaged by falsehoods, regardless of process.
          *   Risk of "process shielding" (hiding behind sources to spread misinformation).
          *   *Rebuttal:* While valid, this leads to hindsight bias and discourages investigative risk.
      *   **Implementation:** How to codify this? (Pre-publication checklists, post-mortem analysis focusing on *availability* of info, not just outcome).

  5.  **Refining the Tone:**
      *   Needs to sound like a colleague speaking to colleagues, not a lecture.
      *   Use the philosophical terms but define them quickly in journalistic context.
      *   Be decisive. The prompt asks for "no split-the-difference shrug."

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the Editor-in-Chief's rule? Yes, need to explicitly dismiss "bet your job" as subjective.
      *   *Check:* Did I name the debate? Yes, Justification vs. Truth, Gettier cases.
      *   *Check:* Is the recommendation clear? Yes, clear A, discipline B.
      *   *Check:* Is the steelman strong? Need to make sure the argument for punishing A isn't just "they were wrong," but "readers rely on us to be right, not just try hard."

  7.  **Final Polish:** Ensure the distinction between *epistemic warrant* and *alethic truth* is clear but accessible. (Maybe use "Warrant" vs. "Accuracy"). Let's stick to "Justification" vs. "Truth" as it's the standard philosophical terminology the user asked for.

      *   *Key Concept:* **Epistemic Warrant**. This is the term for "what entitles you to assert."
      *   *Key Concept:* **Gettier Problem**. This explains why B is problematic even though they were right.
      *   *Key Concept:* **Hindsight Bias**. This explains why punishing A is dangerous.

  8.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Internal Standards Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Standard of Assertibility: Process vs. Outcome in Factual Claims

  **1. The Core Dispute**

  We are currently deadlocked on how to adjudicate the errors made by Reporter A and Reporter B. To summarize the fault line:

  *   **Reporter A:** High justification (multiple sources + docs), False Outcome.
  *   **Reporter B:** Low justification (single shaky tip), True Outcome.
  *   **Editor-in-Chief Proposal:** Subjective Confidence ("Bet your job").

  My intuition, shared by some of you, is that we are not arguing about journalism ethics so much as we are arguing about epistemology. We are trying to define what entitles a person to assert a proposition as knowledge. I consulted the philosophical literature regarding this specific tension to ensure our ruling rests on a coherent framework rather than instinct.

  **2. The Philosophical Context**

  In epistemology, the traditional definition of Knowledge is **Justified True Belief (JTB)**. To "know" something, three things must happen: you must believe it, it must be true, and you must be *justified* in believing it.

  Our committee is split on which leg of that stool matters for journalism.

  *   **The "Truth" Camp (Outcome):** Argues that if the statement isn't True, it wasn't knowledge, and the reporter failed.
  *   **The "Justification" Camp (Process):** Argues that if the reporter had sufficient Warrant (evidence/reasoning) at the time, they acted correctly, even if the world proved them wrong later.
  *   **The "Confidence" Camp (EiC):** Argues that the internal psychological state of the reporter determines assertibility.

  There is a famous philosophical problem called the **Gettier Problem**, which describes cases where someone has a Justified True Belief, but only due to luck or coincidence. Reporter B is a textbook Gettier case. She asserted a fact without justification, and it happened to be true. In philosophy, we generally agree she didn't "know" it; she guessed right.

  **3. Recommendation: Adopt a Standard of "Epistemic Warrant"**

  I recommend we formally adopt a standard of **Epistemic Warrant** (Process-Relative Justification) and reject both the Outcome Standard and the Subjective Confidence Standard.

  **The Rule:** A reporter is entitled to state a claim as fact if, *at the time of publication*, the available evidence meets the outlet's threshold for reliability. Subsequent falsification does not retroactively invalidate the warrant if the countervailing evidence was inaccessible or unknowable at the time.

  **Application to Current Cases:**

  *   **Reporter A (Cleared):** Reporter A satisfied the burden of warrant. She triangulated independent sources and documents. The fact that the claim was false indicates a failure of the *sources*, not the *method*. Punishing A incentivizes reporters to avoid complex stories where verification is difficult, encouraging cowardice over diligence.
  *   **Reporter B (Disciplined):** Reporter B failed the burden of warrant. A single untrusted tip does not constitute justification for a flat factual assertion. That she turned out to be right is epistemically irrelevant; it was luck. Rewarding B incentivizes gambling and recklessness.
  *   **Editor-in-Chief's Rule (Rejected):** "Betting your job" measures confidence, not evidence. History is full of confident idiots and hesitant geniuses. Subjective certainty is a psychological state, not an epistemic standard. We cannot audit a feeling; we can audit a notebook.

  **4. The Strongest Case Against This Recommendation (The Steelman)**

  I anticipate the "Truth Camp" will argue the following, and their point is valid:

  *   **The Reader's Contract:** Readers do not care about our process; they care about reality. When we print a falsehood, we damage trust, regardless of how many sources we had. If we clear Reporter A, are we not telling the audience that "trying hard" is a valid excuse for lying to them?
  *   **Process Shielding:** A strict process standard allows reporters to hide behind "sources" to push narratives that are technically sourced but collectively misleading. If we only judge the process, we risk creating a bureaucracy of "correctly sourced misinformation."

  **Why We Must Reject This Argument:**
  While the damage to trust is real, adopting an Outcome Standard creates **Hindsight Bias**. If we judge reporters based on information that only became available *after* publication, we are demanding omniscience, not journalism. If Reporter A is punished, the institutional lesson is not "verify better," it is "do not publish unless you have a time machine." This leads to risk-aversion that protects the outlet's reputation at the cost of public knowledge. We must defend the right of reporters to be wrong if they did the work, or we cease to be an investigative outlet and become a press release wire.

  **5. Implementation**

  To make this stick, I propose we codify the **"Available Evidence Test"** for future disputes:

  1.  **Reconstruct the Information State:** What did the reporter know *at the moment of filing*?
  2.  **Audit the Warrant:** Did that specific information meet our existing sourcing guidelines?
  3.  **Ignore the Outcome:** The truth-value of the claim is recorded for corrections, but removed from the disciplinary calculus.

  **6. Conclusion**

  We are in the business of producing *warranted assertions*, not absolute truths. We cannot control the truth; we can only control our relationship to the evidence.

  Reporter A did the job. Reporter B got lucky. The Editor is measuring the wrong variable. We should clear A, discipline B, and formalize the Warrant Standard to prevent this fight from recurring.

  Let's discuss Thursday.
