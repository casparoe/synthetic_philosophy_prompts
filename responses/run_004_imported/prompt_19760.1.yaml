answer: |-
  Welcome to the rabbit hole. Once you see the Cartesian boundary as a leaky abstraction, it's hard to unsee it. The *Embedded Agency* sequence is essentially a systematic dismantling of the "ghost in the machine" assumption that underpins 90% of AI safety and RL theory.

  Here is the breakdown of what actually breaks when you remove the Cartesian firewall, followed by my argument for which subproblem is the linchpin holding the rest together.

  ### The Cartesian Fiction vs. Embedded Reality

  In the textbook RL setup (and explicitly in AIXI), the agent is a **homunculus**. It sits outside the universe, looking in through a camera (observation) and manipulating it with a robotic arm (action). The agent's source code is metaphysically distinct from the environment's physics.

  When you force the agent to be **embedded**, three concrete things shatter:

  **1. The Map Cannot Contain the Territory (The Modeling Break)**
  In the Cartesian setup, the agent can theoretically hold a perfect hypothesis space of all possible environments. Since the agent is *outside* the environment, the environment doesn't need to contain a model of the agent.
  *   **What breaks:** An embedded agent is physically smaller than the world it inhabits. It cannot store a state-by-state simulation of the world, because that simulation would need to include the agent itself, which includes the simulation, leading to infinite regress. You are forced to use **abstractions**. You cannot reason about "the world"; you can only reason about a lossy compression of the world. This means your model will inevitably be wrong in ways you cannot predict from the inside, leading to "ontological crises" where your map's categories (e.g., "self," "body," "goal") stop matching the territory.

  **2. The I/O Channel is a Lie (The Boundary Break)**
  In AIXI, there is a clean bit-stream separating "agent" from "environment." The agent sends `a_t`, the environment returns `o_t`.
  *   **What breaks:** In reality, there is no wire. There is only physics. Your "action" is a specific pattern of neuron firings causing muscle contractions. The environment can interfere with that signal mid-transit (a stroke, a wire cut, a nanobot hijack). More dangerously, the environment can read your "action" before you "take" it. If a predictor (like Newcomb's Omega or a rival agent) can simulate you, your "decision" is already a fact in the environment before you output it. The causal arrow from Agent → Environment is blurred into a tangled web of logical correlation.

  **3. Counterfactuals Become Paradoxes (The Decision Break)**
  In the Cartesian view, asking "What happens if I press Left?" is simple. You run the simulation with `action=Left`.
  *   **What breaks:** If you are a deterministic algorithm embedded in a deterministic universe, you *cannot* press Left if your code dictates you press Right. To reason about "What if I pressed Left?", you must reason about a logical impossibility (a world where the laws of physics or your source code are different). Standard logic explodes when fed contradictions (ex falso quodlibet). An embedded agent needs a **theory of logical counterfactuals** to make decisions, but logic doesn't naturally support "impossible possible worlds."

  ---

  ### The Four Subproblems

  Just to ground us, here is how the sequence categorizes the fallout:

  1.  **Decision Theory:** How to choose actions when you are part of the causal graph you are reasoning about (handling the counterfactual break).
  2.  **Embedded World-Models:** How to model a world that contains you, given you are smaller than it (handling the modeling break).
  3.  **Robust Delegation:** How to create a successor agent that keeps your goals, given you can't fully predict it (Vingean reflection).
  4.  **Subsystem Alignment:** How to ensure your internal optimization processes (like search or planning) don't spawn adversarial sub-agents (mesa-optimizers).

  ---

  ### The Root Cause: Embedded World-Models

  While all four are entangled in a " Gordian knot," I argue that **Embedded World-Models** is doing the most "root cause" work. It is the ontological prerequisite that starves the other three of the assumptions they need to function.

  Here is the justification:

  **1. It creates the Decision Theory problem.**
  You cannot solve Decision Theory without a substrate to run the decision on. Standard Decision Theory (CDT, EDT) assumes you can separate "my action" from "the state of the world." This separation is a modeling choice. If your world-model cannot represent "self" as a distinct variable within the causal graph (because of the self-reference issues in Embedded World-Models), you cannot even formulate the decision problem. The reason logical counterfactuals are hard isn't just logic; it's because your model of the world lacks the resolution to distinguish "you doing X" from "the universe necessitating X." If you solve the modeling problem (i.e., you find a coherent way to represent self-reference without paradox), the path to a functional Decision Theory opens up.

  **2. It necessitates the Robust Delegation problem.**
  Why is delegation hard? Why can't you just simulate your successor to ensure it's safe? Because of the **Map/Territory size constraint**. You are smaller than your successor (who must be smarter to be useful). You cannot fully model a system more complex than yourself. This is the *Vingean Principle*. This limitation is purely a constraint on Embedded World-Models. If you could perfectly model any system regardless of size (the Cartesian assumption), Robust Delegation would be trivial: just run the simulation and check the goal stability. The delegation problem exists *only* because your world-modeling capacity is bounded by your physical size.

  **3. It obscures the Subsystem Alignment problem.**
  Subsystem alignment fails when you treat your mind as a monolith rather than a collection of parts. Why do we treat minds as monoliths? Because our self-models are low-resolution. We don't have a clean "world-model" of our own internal cognitive architecture. If we had a high-fidelity Embedded World-Model that included our own source code and internal search processes as legible objects, we could theoretically inspect them for mesa-optimizers. The reason we can't "see" the sub-agents forming in our neural nets is that our self-modeling tools are primitive. We are blind to our own internals because modeling oneself is the hardest instance of the Embedded World-Models problem.

  ### The Verdict

  **Decision Theory** feels like the bottleneck because it's where the action happens. **Robust Delegation** feels like the bottleneck because it's where the existential risk lies.

  But **Embedded World-Models** is the foundation. The Cartesian sequence assumes a God's-eye view. Embedded Agency removes God. Once you remove the God's-eye view, you lose the ability to cleanly separate self from world, map from territory, and optimizer from optimized.

  Until you solve how an agent can represent a world that contains itself without crashing into Gödelian loops or running out of memory, you cannot define counterfactuals (Decision Theory), you cannot trust successors (Delegation), and you cannot inspect your own mind (Alignment). The modeling constraint is the gravity that bends the light of the other three problems.
