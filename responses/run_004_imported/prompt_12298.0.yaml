  **MEMORANDUM**

  **TO:** Provost's Committee on Interdisciplinary Centers
  **FROM:** [Your Name], Department of Philosophy
  **SUBJECT:** Adjudication of Genomics/Robotics Dispute and Review of Standing Bargaining Rule
  **DATE:** October 26, 2023

  **Recommendation**

  After reviewing the technical submissions from the Genomics Center and the Robotics Institute, and considering the proposals to either maintain our current adjudication method or adopt an alternative, I recommend that the Committee **retain the current standing rule based on the Nash Bargaining Solution (NBS)**.

  Consequently, for the current fiscal cycle, the Committee should authorize the split mechanically indicated by that rule: **$400,000 to the Genomics Center and $200,000 to the Robotics Institute.**

  **Reasoning**

  As many of you know, my research focuses on the axiomatic foundations of the very models we are discussing. This dispute presents a textbook conflict between two competing principles of fairness: **Independence of Irrelevant Alternatives (IIA)** and **Monotonicity**.

  1.  **The Current Rule (Nash):** Maximizes the product of the centers' gains. It satisfies IIA, meaning the outcome depends only on the feasible options available *now*, not on hypothetical options that were available in the past or are unavailable.
  2.  **The Proposed Alternative (Kalai-Smorodinsky):** Guarantees that if the total pool of resources grows, no party should receive less than they did before. It satisfies Monotonicity but fails IIA.

  The Robotics Director's appeal to Monotonicity is intuitively compelling. It seems unjust that the Robotics Institute should receive less funding ($200,000) in a year where the total available pool has increased, compared to the status quo ($250,000). Under the Kalai-Smorodinsky (KS) solution, Robotics would indeed secure a larger share, preserving their previous gains.

  However, the Genomics Director's defense of the Nash rule identifies a critical institutional risk. The KS solution relies heavily on the precise definition of each center's "ideal point" or unilateral ceiling. While the $400,000 ceiling is currently objective, adopting KS as a standing rule incentivizes centers to invest resources in lobbying or engineering reports to inflate their hypothetical "maximum possible" claims in future years. This turns the Committee's work into a technical audit of "what could have been" rather than a negotiation of "what is feasible."

  **Why the Losing Party (Robotics) Should Accept This**

  To the Director of the Robotics Institute: I understand this recommendation results in a reduction of your discretionary funds relative to prior years, despite your successful expansion of the total award pool. This outcome violates the principle of Monotonicity, and your frustration is theoretically valid.

  However, I urge you to consider the long-term stability of the mechanism over the short-term allocation. If we switch to Kalai-Smorodinsky to remedy this specific outcome, we establish a precedent where the "ceiling" becomes the most valuable variable in the negotiation. In future disputes, if the Robotics Institute finds itself in the stronger position, you would face opponents arguing that your "unilateral ceiling" is artificially low or inflated. The Nash solution, by satisfying IIA, insulates the Committee from these debates. It forces all parties to focus on the actual feasible frontier of joint projects rather than hypothetical unilateral maxima.

  By accepting this ruling, you preserve a rule that prevents future bargaining from devolving into costly disputes over hypothetical capacities. You lose $50,000 this year to protect the integrity of a system that will likely benefit you when the trade-offs shift in your favor in future cycles.

  **Why the Winning Party (Genomics) Should Accept This**

  To the Director of the Genomics Center: While your center secures the maximum allowable under the current constraints, I recommend we apply the rule strictly without characterizing this as a "victory" for your position over Robotics. The Committee's role is not to validate one theoretical axiom over another based on who benefits, but to maintain a consistent, predictable administrative process. We are upholding the Nash rule not because it favors Genomics this year, but because it minimizes strategic manipulation for the University as a whole.

  **Conclusion**

  Decision theory teaches us that no bargaining solution satisfies every desirable property simultaneously. We must choose which imperfections we can live with. For a standing university committee, the risk of strategic gaming (addressed by Nash/IIA) poses a greater threat to institutional integrity than the anomaly of a non-monotonic outcome in a single fiscal cycle (addressed by KS).

  I move that we affirm the Nash Bargaining Solution as the Committee's standing rule and apply it to the current Genomics/Robotics pool as calculated.
