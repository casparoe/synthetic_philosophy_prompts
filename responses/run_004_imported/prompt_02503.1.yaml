      *   *Section 1: Frankfurt's Mechanism (Indifference).* Explain the Liar vs. Bullshitter. The bullshitter ignores the truth constraint. It's about intent.
      *   *Section 2: Arendt's Mechanism (The Assault on Factual Truth).* Explain Factual vs. Rational truth. Explain the traditional liar (respects truth enough to hide it). Explain the shift to "Image Making."
      *   *Section 3: The Divergence (Self-Deception & Defactualization).* This is the key. Frankfurt's bullshitter doesn't necessarily believe their own bullshit. Arendt's political liar *must* believe it to maintain consistency. The "defactualized mind" isn't just indifferent; it's hostile to factuality itself.
      *   *Section 4: Synthesis/Verdict.* Arendt describes a phenomenon Frankfurt misses: the *systematic* erasure of the capacity to distinguish. Frankfurt's concept is too individualistic/linguistic. Arendt's is structural/ontological.
