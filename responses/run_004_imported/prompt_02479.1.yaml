  8.  **Final Polish:** Ensure tone is academic but direct. Avoid hedging. Cite specific Cartesian concepts (ideas, will, mechanism, infinite vs. finite). Make sure to address the "special pleading" worry directly. (The worry is: "Why is animal language fake but LLM language fake?" Answer: Because both lack *res cogitans*).

