prompt: |-
  So in my research methods seminar this week we got into the whole frequentist vs Bayesian thing and my prof gave us this example that kind of broke my brain a little. She said imagine two researchers end up with the exact same data, like 9 heads out of 12 coin flips, but researcher A had decided beforehand "I'm flipping exactly 12 times" while researcher B decided "I'm gonna keep flipping until I get 3 tails," and it just happened to also take him 12 flips to get there. Even though the observed data is literally identical, apparently the p-value you get for testing whether the coin is fair comes out different for A vs B, because it depends on the stopping rule/sampling plan and not just on what was actually observed. She said this ties into something called the "likelihood principle" that Bayesians like to invoke, and that its also connected to why "optional stopping" (peeking at your data partway through and deciding whether to collect more) counts as one of those shady researcher-degrees-of-freedom things that fed into the replication crisis.

  Honestly I got kind of lost on the actual mechanics of why the math comes out different for A vs B, and I'm a little skeptical of the bigger claim too — like is this stopping-rule stuff actually a real driver of failed replications in fields like psych and biomedicine, or is it more of a cute textbook paradox that doesn't matter that much next to stuff like publication bias and small sample sizes? We've got a short response paper due on this next week and I don't just want to parrot back what she said in lecture without actually getting it myself. Could you break down (1) why the p-values genuinely diverge between the two designs despite the identical data, (2) how the likelihood principle is supposed to explain why a Bayesian analysis wouldn't run into this problem, and (3) give me your honest take on how much explanatory weight this stopping-rule issue really deserves for the replication crisis compared to the other usual suspects?
