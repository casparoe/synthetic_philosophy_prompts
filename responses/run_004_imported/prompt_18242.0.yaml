      *   **Tone:** Academic but accessible, honest, critical (not just parroting the prof), suitable for a response paper preparation.

  2.  **Part 1: The Mechanics (Frequentist Divergence):**
      *   *Goal:* Explain *why* the p-values differ without getting bogged down in too much calculus, but enough to show understanding.
      *   *Researcher A (Binomial):* Fixed $n=12$. Null hypothesis $H_0: p=0.5$. Test statistic: Number of heads ($k=9$).
          *   Distribution: Binomial($n=12, p=0.5$).
          *   P-value calculation: Probability of getting 9 *or more* heads (two-tailed or one-tailed? Usually two-tailed for fairness, but let's stick to the extreme tail logic for simplicity, or clarify). Let's do two-tailed for rigor. $P(X \ge 9) + P(X \le 3)$.
          *   Calculation: $\sum_{k=9}^{12} \binom{12}{k} 0.5^{12}$.
      *   *Researcher B (Negative Binomial):* Fixed number of tails ($r=3$). Stop when 3 tails occur. Total flips $n=12$ implies 9 heads.
          *   Distribution: Negative Binomial. The random variable is the number of *failures* (heads) before $r$ *successes* (tails). Or total trials.
          *   Key difference: The sample space is different. For A, any sequence of 12 is possible. For B, the *last* flip *must* be a tail (the 3rd tail).
          *   P-value calculation: Probability of taking 12 *or more* flips to get 3 tails (i.e., getting 9 or more heads before the 3rd tail).
          *   Calculation: $\sum_{k=9}^{\infty} P(\text{getting 3rd tail at } k+3 \text{ flips})$. Wait, easier to think in terms of heads. Probability of observing 9 or more heads before the 3rd tail.
      *   *Comparison:* The probabilities assigned to the "extreme" events differ because the set of possible outcomes (the sample space) is defined by the *intent* (stopping rule), not just the observed data.
      *   *Drafting the explanation:* Use the concept of "Sample Space." Frequentist p-values depend on $P(Data | H_0)$, but "Data" includes all possible data that *could* have happened under the plan. Plan A allows 12H. Plan B does not (because it stops at 3T). This changes the tail probabilities.

  3.  **Part 2: The Likelihood Principle & Bayesian View:**
      *   *Goal:* Explain why Bayesians say this shouldn't matter.
      *   *Likelihood Principle (LP):* All evidence in data regarding a parameter is contained in the likelihood function $L(\theta | data) \propto P(data | \theta)$.
      *   *Connection:* For both researchers, the likelihood function is proportional to $p^9 (1-p)^3$.
          *   Researcher A: $\binom{12}{9} p^9 (1-p)^3$.
          *   Researcher B: $\binom{11}{2} p^9 (1-p)^3$ (because the last flip is fixed as a tail).
          *   Crucial point: The combinatorial constants ($\binom{12}{9}$ vs $\binom{11}{2}$) do not depend on $p$. Therefore, the likelihood functions are *proportional* with respect to $p$.
      *   *Bayesian Inference:* Posterior $\propto$ Likelihood $\times$ Prior. Since Likelihoods are proportional, Posteriors are identical (given same prior).
      *   *Conclusion:* Bayesians condition on what *did* happen, not what *could* have happened. Stopping rules are irrelevant to the inference about the parameter.

  4.  **Part 3: Real-World Impact (Replication Crisis):**
