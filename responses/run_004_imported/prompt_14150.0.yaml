answer: |-
  Your intuition is spot-on. In the world of population ethics, your friend's move is a classic one, but philosophers generally agree that switching to Average Utilitarianism doesn't "solve" the problem—it just swaps the **Repugnant Conclusion** for a set of conclusions that many find equally (or even more) disturbing.

  You were right to feel it was "too easy." If it were that simple, population ethics wouldn't be one of the most notoriously difficult and unresolved fields in moral philosophy.

  Here is the breakdown of why Average Utilitarianism is considered deeply problematic, and why your friend essentially traded a "Repugnant Conclusion" for a "Sadistic" or "Absurd" one.

  ### 1. The "Happy But Below Average" Problem (The Procreation Objection)
  This is the most immediate dealbreaker for Average Utilitarianism.

  Under Total Utilitarianism, adding a happy person is always good (because it adds to the total sum of happiness). Under Average Utilitarianism, adding a happy person is **bad** if their happiness is below the current average.

  **The Scenario:**
  Imagine a world where everyone is incredibly happy (say, 90/100 on a happiness scale).
  *   **Total View:** Adding a new person who is 80/100 happy is good. They have a great life, and they add net happiness to the universe.
  *   **Average View:** Adding that 80/100 person *lowers the average*. Therefore, creating this happy person makes the world **worse**.

  **The Implication:**
  Average Utilitarianism implies that unless you can guarantee your child will be happier than the current global average, you morally should not have them. In a world of very happy people, it becomes immoral to have merely happy children. This leads to a counter-intuitive form of elitist anti-natalism.

  ### 2. The "One Happy Person" World (The Small Population Objection)
  Average Utilitarianism cares about the *mean*, not the *sum*. This leads to the conclusion that a tiny population can be better than a massive one, even if the massive one contains vastly more total happiness.

  **The Scenario:**
  *   **World A:** 1 person who is ecstatic (100/100 happiness).
  *   **World B:** 1 billion people who are very happy (99/100 happiness).

  **The Implication:**
  Average Utilitarianism says **World A is better.** The average is higher (100 > 99).
  Most people have the intuition that a billion happy lives are better than one ecstatic life. Average Utilitarianism forces you to say that the suffering/death of 999,999,999 very happy people would be a *good* thing, provided the one remaining person is slightly happier than they were.

  ### 3. The Sadistic Conclusion
  This is a technical term coined by the philosopher Gustaf Arrhenius (the modern giant of population ethics). While often associated with other theories, Average Utilitarianism flirts with similar absurdities.

  Because adding people below the average lowers the value of the world, Average Utilitarianism can imply that it is better to have a population of miserable people than to add happy people to a very happy population, if the addition dilutes the average enough.

  More specifically, it creates a perverse incentive: If you have a high-average population, the only way to "improve" the world is to kill the people who are below the average (even if their lives are worth living) or to prevent them from being born.

  ### 4. The Mere Addition Paradox
  Parfit himself showed that you can't easily escape these problems by toggling between Total and Average. He constructed the **Mere Addition Paradox**, which shows how intuitively plausible steps can lead you from a great world to the Repugnant Conclusion, regardless of which metric you use.

  1.  Start with a happy population (A).
  2.  Add new happy people (A+). (Intuitively: This isn't worse).
  3.  Equalize the happiness (B). (Intuitively: Equality is good, so B is better than A+).
  4.  But B has a lower average than A.
  5.  If you prefer Average, you prefer A over B. If you prefer Total, you prefer B over A.
  6.  Repeat the process, and you end up back at the Repugnant Conclusion (Z) or the Absurd Conclusion (One Happy Person).

  ### 5. Arrhenius's Impossibility Theorem
  To validate your feeling that this is "too easy," you can cite Gustaf Arrhenius's **Impossibility Theorems**.

  Arrhenius mathematically proved that **no** population axiology (whether Total, Average, Critical-Level, or Person-Affecting) can satisfy a set of basic, intuitively plausible conditions simultaneously.
  *   If you avoid the Repugnant Conclusion, you likely accept the Sadistic Conclusion.
  *   If you avoid the Sadistic Conclusion, you likely accept the Repugnant Conclusion.
  *   If you avoid both, you likely violate the principle that adding happy people without hurting others shouldn't make things worse.

  In short: **There is no clean solution.** Every theory has a "bullet" you have to bite.

  ### Summary for Your Argument
  Your friend is correct that Average Utilitarianism avoids the Repugnant Conclusion (the massive population of barely-livable lives). However, they are incorrect that this "solves" population ethics.

  **You can tell them:**
  > "Average Utilitarianism avoids the Repugnant Conclusion, but it implies that a world with one ecstatic person is better than a world with a billion very happy people. It also implies that if we are all very happy, it's morally wrong to have children unless they're going to be happier than us. You didn't fix the bug; you just installed a different operating system that crashes in a different way."

  The field is currently stuck in a state of "reflective disequilibrium." We know Total Utilitarianism feels wrong (Repugnant Conclusion), and we know Average Utilitarianism feels wrong (Small Population/Procreation problems). Most modern ethicists are working on **Critical-Level Utilitarianism** (only lives above a certain threshold count positively) or **Person-Affecting Views** (we only care about making *existing* people happier), but all of them have their own significant flaws.

  You won the intuition check: it really is that messy.
