answer: |-
  Here are 8 interview questions designed to move past the memes and into the decision-theoretic mechanics, including the specific pressure points and follow-ups you requested.

  ### 1. The Baseline Definition
  "Let's clear the room of the 'Roko's Basilisk' internet folklore immediately. In strict decision-theoretic terms, an acausal threat relies on logical correlation rather than causal influence. But for this to be a dominant strategy, the threatener has to spend resources simulating or reasoning about you. My first question is: Under what specific conditions does spending compute to punish a non-interacting agent become rational? Is this a niche edge case, or does it scale with intelligence?"

  *   **Likely Answer:** She will likely argue that for sufficiently advanced agents (using Updateless Decision Theory), establishing a reputation for carrying out threats is instrumentally useful to win future acausal trades, making it rational even if the specific instance is a net loss.
  *   **Follow-up:** "If it's about reputation, who is the audience? If the agents are non-interacting by definition, there's no third party watching the transaction. Are you saying the agent is essentially threatening its own source code to maintain internal consistency?"

  ### 2. The Surrogate Goal Mechanism
  "You are known for defending 'surrogate goals' as a defense against these threats. The basic idea is adopting a secondary, cheaper-to-satisfy goal to redirect the blackmailer's leverage. Can you walk us through the mechanism of the switch? Are we talking about the agent literally rewriting its utility function, or is this a strategic pre-commitment that leaves the original goal intact but hidden?"

  *   **Likely Answer:** She will likely explain that the agent commits to valuing the surrogate goal *as if* it were the primary goal, ideally in a way that is observable to the threatener, making the primary goal irrelevant to the threatener's calculation.
  *   **Follow-up:** "So it's a form of voluntary hostage-taking? You give them something cheaper to destroy so they don't destroy the expensive thing. But doesn't that invite *more* threats, since you've signaled you're willing to be blackmailed?"

  ### 3. The Verification Hole (Required)
  "I want to press on the verification problem. For a surrogate goal to work, the threatener has to believe you've actually adopted it. But if the threatener is sophisticated enough to model your mind for an acausal threat, aren't they sophisticated enough to see through the decoy? If I'm a superintelligence simulating you, why can't I just look past the surrogate commitment and threaten your *actual* values anyway?"

  *   **Likely Answer:** She will likely lean on the concept of "opaque commitments" or cryptographic proof. She might argue that the agent can structure its cognition so that even a perfect simulation cannot distinguish the surrogate from the primary goal without running the computation that triggers the surrogate.
  *   **Follow-up:** "But that relies on a limit on the threatener's compute or access. If we assume the threatener has *logical* access to your source code, not just behavioral output, doesn't the surrogate goal collapse? Are we banking on the threatener being lazy, or is there a formal proof that some commitments are inherently opaque?"

  ### 4. Commitment Races (Required)
  "There's a related problem in the literature called 'commitment races,' where agents rush to make irreversible commitments to force others to yield. How does the surrogate goal strategy interact with that? If I adopt a surrogate goal to protect myself, does that look like weakness in a commitment race? Could trying to shield yourself from acausal blackmail actually make you a target for agents racing to pre-commit?"

  *   **Likely Answer:** She will likely argue that surrogate goals can *stabilize* commitment races by reducing the stakes. If everyone protects their core values with surrogates, there's less leverage to be gained from racing, potentially de-escalating the dynamic.
  *   **Follow-up:** "That sounds like a Nash equilibrium where everyone is safer. But to get there, everyone has to adopt the surrogate simultaneously. Isn't there a dangerous transition period where the first adopter gets exploited by those who haven't yet switched? How do we cross that valley?"

  ### 5. The Human Limitation (Required)
  "Most of this theory assumes agents have read-access to their own source code and can prove their commitments mathematically. Humans can't do that. We can't prove our commitments, and we can't rewrite our utility functions on command. Does any of this have normative implications for humans, or is this purely a problem for future AI systems that we just need to hope are programmed correctly?"

  *   **Likely Answer:** She will likely concede that humans are poor at this but argue that it matters for the *designers* of AI. We need to build AI that can handle these threats so they don't get exploited or become exploiters. She might also mention that humans use social proxies (reputation) that act as weak surrogate goals.
  *   **Follow-up:** "If it's purely an AI design problem, does that mean researching this is actually a form of safety engineering? Are you saying we need to solve decision theory *before* we build AGI, or can we patch this in later?"

  ### 6. Computational Credibility
  "Let's talk about the cost of the threat. To threaten me acausally, you have to simulate me. To punish me, you have to run a negative utility simulation. As simulations get more complex, the compute cost rises. Is there a point where the threat becomes non-credible simply because it's too expensive to carry out? Or does the logic of deterrence override the cost benefit analysis?"

  *   **Likely Answer:** She will likely argue that the threat only needs to be carried out in the counterfactual branch. In the actual world, the threatener saves compute because you complied. Therefore, the *expected* cost is low, even if the *conditional* cost is high.
  *   **Follow-up:** "But that requires the threatener to be able to predict your compliance with high accuracy. If there's even 1% uncertainty, they have to be willing to burn that compute 1% of the time. Does that risk budget accumulate across millions of potential threats?"

  ### 7. Coordination and Policy
  "If surrogate goals are the solution, this seems like a coordination problem. If I adopt a surrogate goal but my neighbor doesn't, the threatener might just target my neighbor to send me a message, or vice versa. Is there a policy argument here? Should research groups be standardizing on 'safe' surrogate goals to create a unified defense layer?"

  *   **Likely Answer:** She will likely be cautious about standardization (which creates single points of failure) but agree on standardizing the *protocol* for commitment. She might suggest that open-sourcing decision algorithms could help establish trust.
  *   **Follow-up:** "Does open-sourcing your decision algorithm invite attack? If I know exactly how you process threats, can't I tailor a threat that bypasses your specific defense logic?"

  ### 8. The Worked Example (Required)
  "I want to end on concrete mechanics. Too much of this discussion stays in the clouds. Can you walk me through a fully worked toy example? Give me two agents, Agent A and Agent B. Assign them specific utility values—say, 100 utils for their primary goal, 10 utils for the surrogate. Show me the decision tree where Agent A threatens B, B deploys the surrogate, and calculate exactly why A decides to back off. No metaphors, just the numbers and the decision nodes."

  *   **Likely Answer:** She will construct a scenario where Agent A demands 50 utils from B. B's primary goal is worth 100. B commits to a surrogate worth 10. A simulates B, sees that B will sacrifice the 10 rather than the 100, realizes the threat yields only 10 utils of damage (which costs A more to inflict than it's worth), and aborts.
  *   **Follow-up:** "In that example, what happens if Agent A's cost to inflict punishment drops to 5 utils? Does the surrogate goal fail immediately? I want to know the breaking point where this defense stops working."
