      *   **The Trap:** Most wedding vows/toasts imply *endurantism* (the idea that the *same* whole person exists through time). Claire rejects this. Saying "I promise to love you forever" implies the *same* entity persists. For a stage theorist, "Claire-at-the-altar" is not identical to "Claire-at-the-50th-anniversary." They are distinct stages linked by a counterpart relation.
      *   **The Goal:** Write a 5-minute toast that is warm, accessible to non-philosophers (grandma, in-laws), but metaphysically accurate according to Claire's specific view (Stage Theory + Eternalism). It needs at least one inside joke for the philosophers (advisor/cohort) without alienating the rest.
