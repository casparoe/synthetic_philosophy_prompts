answer: |-
  Good evening, everyone. For those who don't know me, I'm Claire's sibling. It is a profound honor to stand here today.

  Usually, when you give a toast for your sister, you talk about how well you know her. You talk about the person she has always been, and the person she is becoming. But if you know Claire—and specifically, if you know how she thinks about the universe—you know that phrasing is technically problematic.

  To most of us, time is a river that flows. We are boats traveling down it, remaining the same boat from source to sea. But Claire sees time differently. To her, time is more like a landscape. A map. The past, the present, and the future are all equally real coordinates on that map. The Claire standing here at the altar and the Claire who will celebrate a fiftieth anniversary are not, in her strict philosophical view, one and the same traveler moving through time. They are distinct moments, linked together by memory, cause, and love.

  I mention this not to turn a wedding into a seminar—Grandma, I promise there will be no quiz—but because I think there is something deeply comforting in Claire's view for a marriage like this.

  If the future is already real, if it exists just as solidly as this room exists right now, then the happy moments you hope for aren't just wishes. They aren't fragile possibilities waiting to be lost. They are already there, waiting for you to arrive at them. The quiet Sunday mornings, the challenges you overcome, the laughter at anniversaries decades from now—they are fixed points in the structure of your lives. You don't have to build them out of nothing; you just have to live into them.

  Daniel, you have undertaken a remarkable task. You have promised to love Claire. But you know, perhaps better than anyone, that you are marrying a specific moment in time, with a commitment to honor every future stage that follows.

  In fact, Daniel, I know you've studied the fine print. You know that strictly speaking, the woman you are marrying today is a momentary stage. You are promising to love not just this stage, but every temporal counterpart linked to her by the right causal relation for the rest of her life. Which is a lot of pressure on the causal relation. [Pause for laughter/applause from the philosophers].

  But in all seriousness, that precision is what makes your love so sturdy. Most people promise to love someone "forever" imagining a single, unchanging soul. You two know the truth: people change. We are collections of moments. To love someone is to commit to the entire sequence. It is to say that no matter how much the stages change, no matter how the landscape shifts, the connection between them remains unbroken.

  There is a beauty in that. It means that love isn't something you have to desperately hold onto as time washes it away. Love is the thread that stitches the stages together. It is the constant that makes the series of moments a single story.

  So, when I look at the two of you, I don't just see a wedding day. Because of the way you see the world, Claire, I know you see this day as one part of a much larger whole. And I know that the joy of this afternoon is not diminished by the fact that it will pass. It is permanent. It is written into the block universe of your life together.

  My wish for you is that every stage of your marriage is as bright as this one. That the causal links between your moments are strong, and filled with kindness. And that when you look toward the future, you can take comfort in knowing that the best parts of your timeline are already real, just waiting for you to experience them.

  Please raise your glasses. To Claire and Daniel. To the timeline you share, and to every moment contained within it.

  To the happy couple.
