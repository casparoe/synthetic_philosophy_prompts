      *   *Point 2: The Definition of "Self-Interest".* Distinguish genetic self-interest from psychological self-interest. Supererogation is about the cost to the *agent*, not the *genome*. If I die, it's a cost to me, regardless of my kin's survival.
      *   *Point 3: The Function of the Category.* Why do philosophers keep supererogation? To distinguish between what is *required* and what is *optional but good*. Biology doesn't have "obligation." Nature doesn't deal in "oughts."
      *   *Point 4: Maladaptive Behavior.* Mention cases where altruism clearly *doesn't* pay off (e.g., dying for non-kin strangers with no witnesses). Evolution explains the *instinct*, but the specific act might be evolutionarily neutral or negative in the modern context.
      *   *Conclusion:* The two fields answer different questions. Biology explains the *capacity* for supererogation; Philosophy explains the *moral logic* of it. They are compatible, not competitive.

