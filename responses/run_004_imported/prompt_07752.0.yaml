answer: |-
  It is a pleasure to engage with a colleague who brings such a robust empirical background to these questions. Your intuition is sharp, and you are certainly not the first to suspect that evolutionary theory might dissolve traditional ethical categories. Indeed, the tension you identify lies at the heart of the conflict between naturalistic descriptions of behavior and normative evaluations of action.

  However, while your evolutionary account is compelling as an explanation of *etiology* (why the capacity for sacrifice exists), it does not necessarily render the philosophical concept of supererogation redundant. The reason lies in a category distinction that is familiar to biologists but often elides in interdisciplinary dialogue: the distinction between **ultimate and proximate causation**, and the related distinction between **descriptive and normative** claims.

  Here is why the evolutionary story, while true in its own domain, does not eliminate the philosophical need for supererogation.

  ### 1. The Proximate vs. Ultimate Distinction
  As a behavioral ecologist, you know well that explaining *why* a trait evolved (ultimate causation) is different from explaining *how* an organism decides to act in the moment (proximate causation).

  Hamilton's Rule ($rB > C$) explains why the *disposition* toward altruism was selected for over deep time. It does not describe the psychological calculus of the agent at the moment of action. When a soldier smothers a grenade, they are not calculating inclusive fitness coefficients. They are experiencing a proximate psychological state—perhaps a surge of protective instinct, a commitment to a unit, or a refusal to let others die.

  Supererogation is a category that describes the **proximate moral logic** of the action, not its ultimate evolutionary history. It asks: *From the perspective of the moral agent and their community, was this act required?*

  If we define supererogation as "an act that is good to do but not wrong to omit," this status depends on social expectations and moral reasoning, not genetic payoff. Even if the *capacity* for this act was selected for because it generally aided fitness, the specific instance can still be "beyond duty" in the social context. The evolutionary explanation tells us why we *can* be saints; the philosophical explanation tells us why we are not *obligated* to be.

  ### 2. The Metaphorical Nature of "Selfishness"
  You mention Dawkins's "selfish gene." It is crucial to remember that Dawkins himself emphasized this is a metaphor. Genes are not literally selfish; they do not have intentions. Organisms are the vehicles.

  When philosophers discuss supererogation, they are concerned with **psychological self-interest** and **moral obligation**, not genetic propagation.
  *   **Psychological Self-Interest:** Does the act benefit the agent's welfare, happiness, or survival?
  *   **Genetic Self-Interest:** Does the act benefit the replication of the agent's alleles?

  A soldier who dies to save comrades has zero psychological self-interest (they are dead) and zero future reproductive fitness. While their *kin* may benefit (inclusive fitness), the *individual organism* pays the ultimate cost. Supererogation is concerned with the cost to the **moral agent** (the organism/person), not the **genetic vehicle**.

  If we accept the evolutionary view that "there is no true self-sacrifice because the genes win," we are engaging in a redefinition of "self" that renders the term meaningless for ethics. If "self-interest" includes "the propagation of my alleles even after I am dead," then *no* human act is ever self-sacrificing, not even murder or suicide, provided they have some downstream genetic consequence. This stretches the definition of self-interest so thin it loses its utility for moral philosophy.

  ### 3. The Is-Ought Gap (Hume's Guillotine)
  This is the classic philosophical objection. Evolutionary biology deals with **what is** (or what was). Moral philosophy deals with **what ought to be**.

  Even if we prove that saintly behavior is an evolutionarily stable strategy, that does not tell us whether we *ought* to demand it of one another.
  *   **Biology says:** "Humans have a capacity for extreme altruism because it historically aided group survival."
  *   **Philosophy asks:** "Is it permissible to *require* a person to sacrifice their life for the group?"

  Urmson's essay was largely a critique of Utilitarianism, which tends to collapse supererogation into duty (i.e., if an act produces the most good, you *must* do it). Urmson argued that if we make sainthood obligatory, we make morality too demanding for ordinary humans to sustain.

  The evolutionary explanation does not answer this normative question. Knowing that a behavior is "natural" or "adaptive" does not settle whether it should be codified as a duty. We might agree that kidney donation is adaptive for the species, but most ethical systems agree it should remain supererogatory (optional) rather than obligatory, precisely to protect individual autonomy.

  ### 4. Maladaptive Altruism in Modern Contexts
  Furthermore, evolutionary psychology explains the *origin* of the instinct, but it does not account for every instance of modern altruism. Humans frequently act in ways that are clearly maladaptive even by evolutionary standards.

  Consider a stranger donating a kidney to another stranger anonymously, with no reputation tracking (Zahavi's handicap principle fails here) and no kin relation (Hamilton's rule fails here). In the modern environment, this is often a net fitness cost with no clear reciprocal or inclusive benefit.

  If the behavior is truly maladaptive in the current context, the evolutionary story cannot claim it is "secretly self-interested" in a fitness sense. It is a misfiring of an ancient mechanism or a cultural override. In these cases, the act is genuinely beyond the "selfish" calculus of genes, reinforcing the philosophical intuition that the agent is acting beyond the bounds of expected self-interest.

  ### 5. The Social Function of the Category
  Finally, the concept of supererogation serves a vital social function that evolutionary explanation does not fulfill. It creates a **moral buffer zone**.

  *   **Duty:** What we can punish you for omitting.
  *   **Supererogation:** What we praise you for doing, but cannot punish you for omitting.

  If we abolish supererogation because "biology says it's all just fitness strategies," we risk collapsing this buffer. If every act that benefits the group is viewed as a "natural strategy," we might slide toward thinking it is all expected (duty), or conversely, that nothing is truly praiseworthy (it's just genes).

  We need the category of supererogation to maintain a society where we encourage greatness without mandating it. Biology explains the *engine* of altruism; philosophy steers the *vehicle* of social expectation.

  ### Conclusion
  Your skepticism is healthy; it prevents philosophy from drifting into metaphysical fantasy unmoored from human nature. Evolutionary biology has indeed shown that the *capacity* for sainthood is not magical—it is built of the same stuff as the capacity for greed.

  However, it does not make supererogation redundant. It explains the **mechanism**, but not the **meaning**. The soldier's sacrifice is explicable by kin selection, but it remains supererogatory because the soldier was not *obligated* to die, and the cost to the *person* (not the gene) was total.

  The philosophical concept survives because it addresses the normative landscape of human interaction, not the genetic landscape of human history. We need both stories: the biologist's to understand how we became creatures who *can* love, and the philosopher's to decide how we *should* live with that capacity.
