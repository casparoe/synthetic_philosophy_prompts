      *   At the intersection, you know you are at *an* intersection.
      *   If your strategy is "Continue with prob $p$", then the likelihood of reaching the 2nd intersection is $p$. The likelihood of reaching the 1st is 1.
      *   So, conditional on being at an intersection, Prob(This is #1) = $1 / (1 + p)$. Prob(This is #2) = $p / (1 + p)$.
      *   If $p = 2/3$, then Prob(#1) = $1 / (5/3) = 3/5$. Prob(#2) = $2/5$.
      *   Now, calculate expected utility of Exiting vs. Continuing *at the intersection* using these new probabilities.
      *   If you Exit: You get 0 (if #1) or 4 (if #2). Expected = $0.6(0) + 0.4(4) = 1.6$.
      *   If you Continue: You get 4 (if #1, then exit at #2) or 1 (if #2, then miss both). *Wait, this depends on future strategy.*
      *   This gets complicated fast. Keep it high-level. The key is that the probability of *where you are* depends on the strategy you plan to use, which creates a circular dependency that standard decision theory hates.

