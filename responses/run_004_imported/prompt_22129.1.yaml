answer: |-
  **Setting:** *A university conference room, 5:30 PM. Empty coffee cups and a scattered stack of candidate files clutter the table. A whiteboard displays the final tally: 7 to 5 in favor of hiring Dr. Aris.*

  **Elena:** (Capping her pen) Seven to five. It's done. And before you ask, yes, I think we should treat this as a verdict, not just a headcount.

  **Marcus:** A verdict implies a truth-tracking procedure, Elena. A headcount is just arithmetic. Right now, I'm not sure we have the former.

  **Elena:** Come on, Marcus. This is exactly what the Condorcet Jury Theorem is for. We have eleven competent evaluators. Assuming each of us is even slightly better than random at spotting a good colleague—say, a 60% chance of being right—the math is brutal. The probability that the majority is wrong is less than 25%. If we defer to the majority, we are statistically safer than deferring to any single one of us, even the senior chair.

  **Marcus:** The math is brutal only if the variables hold. Condorcet requires *conditional independence*. It requires that my vote depends on the truth of the candidate's quality, not on your vote. But we spent three hours deliberating. You spoke first. You praised her interdisciplinary approach. Three of the 'yes' votes explicitly cited your comments. Our errors aren't independent; they're correlated. We're not eleven samples; we're one sample with eleven echoes.

  **Elena:** That's too cynical. Deliberation isn't just herding; it's error-correction. If I missed a flaw in her publication record, you pointed it out. That raises our individual competence, $p$. Condorcet doesn't demand perfect independence, just that the correlation isn't total. As long as we aren't robots, the aggregation still swamps individual noise. The majority signal is stronger than the individual noise.

  **Marcus:** But consider the flip side of that coin. You know the theorem as well as I do. If the average competence $p$ drops below 0.5, the theorem inverts. As the group grows, the probability of a *wrong* majority approaches certainty.

  **Elena:** Are you suggesting this committee is worse than a coin flip at judging philosophy candidates?

  **Marcus:** I'm suggesting we might be systematically biased. Suppose the field has a blind spot for interdisciplinary work. Suppose Dr. Aris is brilliant, but her methodology confuses the traditionalists. If five of us recognize her genius, but seven of us are unconsciously penalizing her for not fitting the mold, our "competence" regarding *this specific question* is effectively below 0.5. In that scenario, Condorcet proves that a larger committee makes us *more* confidently wrong. The vote doesn't track truth; it amplifies bias.

  **Elena:** If we assume systemic bias, all bets are off. But we were hired to be experts. The baseline assumption of a hiring committee is that $p > 0.5$. If we can't trust that, we can't trust *you* to overrule the vote either. Why is your skepticism more reliable than the aggregate?

  **Marcus:** Because I'm not claiming my judgment is superior; I'm claiming the *mechanism* is fragile. If we want to use Condorcet, we need to weight the votes. If the senior scholars have higher $p$ values, their votes should count more. A simple majority treats the graduate student representative's vote as epistemically equal to the department chair's. That might be democratic, but it's not optimal truth-tracking.

  **Elena:** And who assigns the weights? You? Me? That introduces a meta-judgment error that's harder to quantify than the voting error. The beauty of the simple majority is that it's a blind heuristic. It doesn't require us to know *who* is the expert, only that *we are* a group of experts. It saves us from the arrogance of deciding whose expertise counts.

  **Marcus:** It saves us from arrogance, but it costs us accuracy. Look at the split. Seven to five isn't a landslide. It's a signal that the information we're aggregating is noisy. If the votes were truly independent signals of high competence, we should see convergence. A near-split suggests the "signal" is weak relative to the "noise." Condorcet works for clear signals. Here, we have ambiguity.

  **Elena:** Ambiguity is exactly why we need the aggregate. If the case were obvious, we wouldn't need a theorem. The fact that it's close means the evidence is complex. In complex environments, pooling perspectives reduces variance. Even if $p$ is only 0.55, the majority is still the best bet we have *ex ante*. To overturn it now is to say, "The math says we're likely right, but I feel we're wrong."

  **Marcus:** No, it's to say, "The math says we're likely right *if* we are independent and unbiased." I'm arguing we haven't satisfied the antecedent. We share a departmental culture, we read the same letters, we sat in the same room. We are a cluster, not a crowd.

  **Elena:** (Sighs, leaning back) So what's the alternative? Re-vote without talking? That removes the deliberative benefit. Defer to the chair? That removes the committee.

  **Marcus:** The alternative is to stop treating the vote as an epistemic oracle and start treating it as what it is: a political settlement. We vote to close the discussion, not because the number seven guarantees truth.

  **Elena:** I can't accept that. If we don't believe the vote tracks truth, we're just bullying the minority. I have to believe that seven heads are better than one, even if the assumptions are imperfect. Otherwise, why are we here?

  **Marcus:** We're here because the university requires a vote, Elena. Not because the universe guarantees a correct one.

  **Elena:** (Stands up, gathering papers) Well, the report needs a signature. I'm signing off on the majority. I'll take the 75% probability over your paralysis.

  **Marcus:** (Watching her) And I'll sign the dissent. Someone has to record that the conditions for the theorem weren't met.

  **Elena:** Fair enough. But if Dr. Aris turns out to be a star, I'm citing Condorcet at her tenure review.

  **Marcus:** And if she fails, I'll remind you that competence was less than one-half.

  **Elena:** (Smiles faintly) See you at the next meeting, Marcus.

  **Marcus:** Same time, same room. Hopefully with a better prior.
