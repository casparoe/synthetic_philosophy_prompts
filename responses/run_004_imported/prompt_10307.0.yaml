  **Title:** The Harsanyi Doctrine as Metaphysics: A Critique of the Common Prior Assumption

  **Introduction**

  In the standard formalization of interactive epistemology, the Common Prior Assumption (CPA) serves as the bedrock upon which Harsanyi type spaces and Aumann's agreement theorems are constructed. The assumption posits that while agents may possess different private information (partitions of the state space), they all conditionalize from the same prior probability distribution over that space. Within the context of our seminar, we have treated this largely as a technical prerequisite for deriving results like "agreeing to disagree." However, treating the CPA as a mere technicality obscures its profound philosophical weight. This essay argues that the CPA is not a harmless idealization nor a requirement of rationality. Rather, it is a substantive metaphysical claim about the world that conflates *rationality* (internal coherence) with *uniformity* (intersubjective agreement). Drawing on the critiques of Stephen Morris and Faruk Gul, I contend that the CPA is unjustified as a rationality norm for both real and idealized agents. Consequently, No-Trade theorems, which rely on the CPA to rule out speculative trading, lose their normative force and should be viewed as artifacts of a specific, restrictive modeling choice rather than laws of rational interaction.

  **The Harsanyi Doctrine: Rationality or Definition?**

  To evaluate the CPA, one must distinguish between its role as a modeling convenience and its status as a normative claim. John Harsanyi introduced the common prior to facilitate the analysis of games with incomplete information. The "Harsanyi Doctrine" suggests that differences in subjective probabilities must be attributed entirely to differences in information. If two rational agents have access to the same information, they ought to hold the same beliefs.

  Proponents argue that for idealized Bayesian agents, the CPA is almost definitional. If probabilities represent logical relations between evidence and hypotheses (an Objective Bayesian view), then any two agents processing the same data must arrive at the same conclusion. In this light, the CPA is a harmless idealization, akin to assuming frictionless surfaces in physics. It simplifies the topology of the type space, ensuring that belief hierarchies are consistent and that an *ex ante* perspective exists from which the game can be analyzed.

  However, this defense collapses when we adopt a Subjective Bayesian framework (à la Savage or de Finetti), which dominates modern decision theory. In subjective probability, priors represent an agent's personal degree of belief, constrained only by coherence (avoiding Dutch Books). There is no logical mechanism within subjective Bayesianism that forces two agents to start at the same coordinate before receiving evidence. To insist on a common prior is to smuggle Objective Bayesianism into a Subjective framework. It assumes away the very phenomenon that makes interactive epistemology interesting: the possibility that rational agents might interpret the same silence differently.

  **The Morris and Gul Critiques**

  The most rigorous dismantling of the CPA comes from Stephen Morris and Faruk Gul, who challenge the notion that rationality implies a common prior.

  Stephen Morris, particularly in his 1995 work on *ex ante* and *interim* analysis, demonstrates that the CPA is not a neutral normalization. He argues that the CPA imposes restrictions on the set of possible interim beliefs (beliefs held after agents receive private information but before uncertainty is resolved). By insisting on a common prior, the modeler restricts the universe of allowable belief hierarchies. Morris highlights that the *ex ante* perspective—the view from "before the world began"—is a fiction imposed by the modeler, not a perspective available to the agents. Agents exist in the *interim*; they do not choose their priors. Therefore, justifying the CPA by appealing to an *ex ante* stage where agents "would have agreed" is circular. It assumes the conclusion (that a shared probability measure exists) to prove the validity of the framework.

  Faruk Gul (1996) extends this by attacking the link between rationality and agreement directly. Gul argues that rationality is a property of individual consistency, not intersubjective alignment. Two agents can be perfectly rational (coherent, maximizing expected utility) yet maintain different priors indefinitely, even when they know they disagree. For Gul, the Aumann theorem does not prove that rational agents *must* agree; it proves that rational agents *with a common prior* must agree. By removing the CPA, the "paradox" of agreeing to disagree vanishes. Gul's position suggests that the Harsanyi Doctrine is not a theorem of rationality but an additional axiom—one that lacks independent justification. If rationality is defined as coherence, then differing priors are not irrational; they are simply different. To claim otherwise is to assert that there is only one rational way to be ignorant, which is an untenable metaphysical claim.

  **Implications for No-Trade Theorems**

  The stakes of this debate extend beyond epistemology into economics, specifically the No-Trade theorems (e.g., Milgrom and Stokey, 1982). These theorems state that in a market with a common prior, speculative trade cannot occur in equilibrium. If I sell you an asset, it is because I believe it is overvalued and you believe it is undervalued. But if we share a prior and are rational, I must realize that your willingness to buy signals private information you possess that I do not. I should update my belief accordingly, eliminating the discrepancy that motivated the trade. Thus, trade unravels.

  This result is famously at odds with the observed volume of financial markets. Defenders of the CPA often treat No-Trade as a normative benchmark: if trade occurs, someone is being irrational. However, if the CPA is rejected as unjustified, the No-Trade theorems do not logically "fall apart," but their applicability becomes vacuous. The theorems remain valid conditionals (*If* CPA, *Then* No Trade), but since the antecedent (CPA) is false for agents with genuinely heterogeneous priors, the consequent need not hold.

  If we accept the Morris/Gul critique, speculative trade is not evidence of irrationality or market failure; it is evidence of prior heterogeneity. Agents trade because they have different assessments of the world, not merely because they have different data. Abandoning the CPA rescues the rationality of market participants. It allows for a model where volume exists *because* agents are rational Bayesians with different priors, rather than despite their rationality. Retaining the CPA forces us into the awkward position of claiming that the trillions of dollars traded daily are the result of systematic irrationality, simply to save a mathematical assumption.

  **Verdict: Who is the CPA For?**

  Is the CPA defensible as a rationality requirement? The answer must be a definitive **no**, for both idealized agents and real people.

  For **real people**, the CPA is descriptively false. Empirical evidence shows that individuals process identical information through different cultural, psychological, and cognitive priors. To demand they share a prior is to demand they be clones, not rational agents.

  For **idealized agents**, the CPA is normatively unjustified. Even in a vacuum of idealization, rationality is defined by the consistency of belief updates, not the identity of belief starting points. An idealized agent is one who never contradicts themselves, not one who thinks exactly like their neighbor. The argument that "idealized agents would converge" relies on the assumption that there is a single true logical probability distribution waiting to be discovered. This reifies probability into a physical property of the world rather than a state of knowledge. If we accept Subjective Bayesianism as the standard for rationality (as we generally do in decision theory), then differing priors are permissible. To rule them out is to change the definition of rationality from "coherence" to "conformity."

  The only defense remaining is pragmatism: the CPA makes the math tractable. This is a valid reason for a *modeler* to use the assumption, but it is not a valid reason to call it a *rationality requirement*. We must distinguish between a tool for calculation and a law of thought. The CPA is the former.

  **Conclusion**

  The Common Prior Assumption is the silent engine of standard interactive epistemology, but it runs on fuel it cannot justify. By examining the critiques of Morris and Gul, we see that the CPA is not a tautology of Bayesian rationality but a restrictive constraint on belief hierarchies that privileges an unavailable *ex ante* perspective over the actual *interim* reality of agents. When we strip away the CPA, Aumann's agreement theorem becomes a specific result about a specific class of models, not a universal bound on rational discourse. Similarly, No-Trade theorems cease to be paradoxes of market efficiency and become artifacts of assuming away the very heterogeneity that drives markets. The CPA is defensible only as a simplifying heuristic for specific equilibrium analyses, but it must be rejected as a normative requirement of rationality. Rational agents need not agree to be rational; they need only be coherent. To demand more is to confuse mathematics with metaphysics.
