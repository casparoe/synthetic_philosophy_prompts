answer: |-
  Here are a few options, ranging from a one-liner to a short bit, depending on how you want to deliver it.

  **Option 1: The Philosophical One-Liner**
  > "Hobbes argued geometry is certain because 'we construct the figures ourselves.' He spent 20 years trying to square the circle because he confused *geometric construction* with *political constitution*. He didn't think he needed a compass; he needed a gavel. To Hobbes, the circle wasn't mathematically impossible to square—it was just in open rebellion against the Sovereign."

  **Option 2: The Dialogue (Hobbes vs. Wallis)**
  > **Wallis:** "Thomas, the ratios don't add up. You cannot square the circle."
  > **Hobbes:** "John, you're thinking like a physicist observing nature. In geometry, *we* are the cause. We construct the truth."
  > **Wallis:** "Yes, but you constructed it wrong."
  > **Hobbes:** "Nonsense. I am the author of this Commonwealth. If I say the circumference submits to the straight line, then for the sake of civil peace, it *is* square. Your proof isn't mathematics, Wallis... it's sedition."

  **Option 3: The "Deep Cut" Observation**
  > "It is the greatest irony in the history of epistemology that the man who claimed we know geometry *because* we make it, spent his final decades failing to make the one thing he claimed to understand. Hobbes didn't lose the argument with Wallis because he was bad at math. He lost because he treated mathematical demonstration like Civil Law: he thought if he asserted his authority over the figure loudly enough, the axioms would eventually obey."

  **Why these work for your audience:**
  *   They hinge on the specific Hobbesian definition of **"construct"** (which bridges his math and his politics).
  *   They reference the **Wallis feud** without over-explaining it.
  *   The punchline isn't that he was wrong, but that his **reason for being wrong** was an over-application of his own philosophy (treating math like a Sovereign command).
