prompt: |-
  Random gut check — I mostly work on phil of language but have to pass a metaphysics prelim this spring, and Lewis's modal realism is bugging me. Doesn't the whole thing just get flattened by Occam's razor? He's positing an actual infinity of causally isolated concrete universes just to give truth conditions for counterfactuals and modal claims, when ersatzist views (worlds as abstract objects, or just useful fictions) seem to buy you the same explanatory payoff for way less ontological cost. Every intro treatment I've read talks about modal realism like it's a live, respectable position instead of something parsimony alone obviously refutes, so theres clearly a piece im missing — what is it?
