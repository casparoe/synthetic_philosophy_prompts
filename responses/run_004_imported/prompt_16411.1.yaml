answer: |-
  This is the single most common reaction to Lewis, so first off: your gut is working correctly. If you *don't* have that reaction, you probably haven't understood the view yet. The "Incredulous Stare" is the starting point for everyone.

  However, since you're prepping for a metaphysics prelim, you need to know why the dialectic doesn't end there. Lewis knows the razor objection better than anyone, and he has a specific, technical reply that keeps Modal Realism (MR) in the game.

  Here is the missing piece, broken down into the three arguments you need to wield in your prelim.

  ### 1. Qualitative vs. Quantitative Parsimony
  This is the direct counter to your Occam's Razor worry. Lewis argues that you are conflating two types of parsimony.

  *   **Quantitative Parsimony:** Positing fewer *tokens* of entities (e.g., fewer worlds).
  *   **Qualitative Parsimony:** Positing fewer *types* or *kinds* of entities (e.g., fewer fundamental categories).

  **The Trade-off:**
  *   **Modal Realism:** Is quantitatively extravagant (infinite concrete worlds) but **qualitatively parsimonious**. Our world is spatiotemporal, causal, and concrete. Other worlds are just *more of the same*. We don't need new categories of being.
  *   **Ersatzism:** Is quantitatively parsimonious (only one concrete world) but **qualitatively extravagant**. To make ersatz worlds work, you usually have to posit abstract objects (maximal consistent sets of propositions, states of affairs, properties) that have a mysterious relation to concrete reality.

  Lewis's punchline: **Qualitative parsimony is more important than quantitative parsimony.** It is theoretically cheaper to posit more of what you already believe in (concrete stuff) than to posit new kinds of mysterious abstracta that require new ideological primitives to explain.

  ### 2. The Problem of Primitive Modality (The Phil of Language Angle)
  Since you work in phil of language, this is where MR should actually appeal to you. Lewis is offering a **reductive analysis** of modality.

  *   **Lewis's Goal:** Analyze modal truths (e.g., "Possibly, there are blue swans") in terms of non-modal, extensional truths (e.g., "There exists a world concrete with ours containing a blue swan"). The metalanguage is non-modal.
  *   **The Ersatzist Problem:** Most ersatz views struggle to define what makes an abstract object a "possible world" without smuggling modality back in.
      *   If a world is a "maximally consistent set of propositions," what does *consistent* mean? Usually, it means "possibly true together."
      *   If a world is a "way the world could be," you've used a modal locution to define modality.

  **The Prelim Point:** If the ersatzist needs *primitive modality* to construct their worlds, they haven't actually analyzed modality; they've just relocated it. Lewis claims MR is the only view that eliminates modal primitives from the fundamental ideology. For a semanticist, the promise of extensional truth conditions for modal claims without modal operators in the meta-language is a massive theoretical payoff that offsets the ontological cost.

  ### 3. Systematic Power (The "Package Deal")
  Lewis doesn't just sell MR to solve modal logic. He sells it as a unified theory of almost everything. In *On the Plurality of Worlds*, he argues that the ontological cost is worth it because MR solves problems across the board:
  *   **Properties:** They are sets of counterparts across worlds (solving the problem of universals without positing universals).
  *   **Propositions:** Sets of worlds.
  *   **Content:** Belief content is a set of worlds where the belief is true.
  *   **Causation/Counterfactuals:** Analyzed via similarity relations between concrete worlds.

  **The Argument:** If you reject MR, you have to pay the ontological cost *plus* you have to find separate solutions for properties, propositions, and counterfactuals. Lewis argues that MR is the "best buy" in theoretical philosophy: you pay one big ontological price upfront, and you get a discount on everything else.

  ### How to Handle This in the Prelim
  When you get the question on Lewis, do not just say "Occam's Razor refutes it." That will look like you missed the nuance. Instead, structure your answer like this:

  1.  **State the Objection:** Acknowledge that MR violates *quantitative* parsimony and common sense (The Incredulous Stare).
  2.  **State Lewis's Defense:** Explain the Qualitative/Quantitative distinction. Argue that Lewis prioritizes *ideological* parsimony (fewer primitives) over *ontological* quantity.
  3.  **The Crucial Trade-off:** Frame the debate not as "Realism vs. Razor" but as "Concrete Plurality vs. Primitive Modality."
      *   *Option A:* Accept infinite worlds, keep ideology lean (Lewis).
      *   *Option B:* Accept one world, but burden your ideology with primitive modality/abstracta (Ersatzism).
  4.  **Your Evaluation:** You can still reject Lewis! But the grounds for rejection should shift. Don't say "It's too many worlds." Say: "The cost of qualitative parsimony does not outweigh the violation of common sense," or "There are ersatz views (like Stalnaker's) that minimize primitive modality enough to beat Lewis."

  ### Summary for your Gut Check
  The reason MR is a "live" position isn't because philosophers love the idea of zombie doppelgangers. It's because Lewis successfully framed the debate as a choice between **ontological extravagance** (his view) and **ideological extravagance** (the rivals).

  Many metaphysicians think ideological parsimony (fewer primitives) is the true measure of a theory's elegance. If you grant that premise, Lewis wins. If you think common sense ontology trumps ideological elegance, Lewis loses. The prelim wants to see that you understand *why* it's a trade-off, not just that you see the cost.

  Good luck with the prep. If you can articulate the Qualitative/Quantitative parsimony distinction clearly, you'll be ahead of 80% of the cohort.
