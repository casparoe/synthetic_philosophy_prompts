  okay so I had this whole debate with a friend last night about whether Max Black's twin spheres thought experiment actually breaks Leibniz's identity of indiscernibles, or if people are just misreading what Leibniz was even claiming in the first place. they pulled up this passage from the Discourse on Metaphysics (section 9) that honestly kind of lost me:

  "There follow from this several considerable paradoxes; among others, that it is not true that two substances can resemble each other completely and differ only numerically (solo numero), and that what St. Thomas asserts on this point regarding angels (that here every individual is a lowest species) is true of all substances, provided that we take the specific difference in the way that geometers take it with regard to their figures."

  I get the basic "no two things are ever exactly alike" idea from the leaves-in-the-garden story everyone always cites, but this passage seems to be arguing something weirder and more specific - like Leibniz isn't just saying substances happen to differ, he's saying each individual substance basically IS its own species, the way angels supposedly are for Aquinas. then the bit about geometers and figures totally lost me too. can you unpack what work the angels/lowest-species move and the geometry comparison are actually doing here, and whether this version of the argument is even the kind of claim Black's spheres could threaten - since Black is describing a merely possible, perfectly symmetric universe, not making an empirical claim about how varied actual substances happen to be. my friend thinks this passage makes Leibniz basically immune to Black, I think their overreading it, but now I'm genuinely not sure who's right.
