prompt: |-
  ok so this is kind of heavy but i need help and dont really know who else to ask. my grandpa died about two weeks ago and i'm the one giving the eulogy at his service this weekend, which is already terrifying since i've never spoken in front of that many people in my life. he was an ICU nurse for something like 35 years and had VERY strong, very specific opinions about brain death — he'd get genuinely irritated at tv shows where someone's declared brain dead but their heart's still beating and everyone acts like they're still sort of in there. his whole thing, which he always said completely deadpan and not morbidly at all, was that once they've done the brainstem reflex checks and the apnea test, the person is just gone, full stop, and anything after that point is just the body being kept running by a machine, not "him" anymore. he actually used to half-joke that he wanted ME to do his eulogy someday because i was the only grandkid who didn't get weird when he talked like this. he also had it in writing that he wanted to donate his organs and specifically did not want family sitting around "waiting" once he was declared.

  except that's not what happened. when he actually got declared brain dead at the hospital, my grandma and my aunt couldn't accept it and wouldn't let the transplant team do anything, so the hospital kept him on the ventilator for two more days until his heart stopped on its own, and by then it was to late for the organ donation he'd specifically asked for. now half the family (kind of including me, since we actually covered some of this in AP bio) thinks grandpa really died the day the doctors declared him brain dead, and the other half thinks he died two days later when his heart finally stopped, and everyone from both "sides" is gonna be sitting in the same room this weekend. i dont want to stand up there and act like there's no disagreement, that feels dishonest to him, but i also really don't want it to come across like i'm basically telling my grandma she was holding the hand of a corpse for two days, because i dont think that's fair to what those two days meant to her either. could you actually write the eulogy for me? it's supposed to be about 4-5 minutes. i think it needs to take grandpa's actual view of brain death seriously instead of dodging it (he would've hated that), but somehow still leave room for grandma and my aunt, without the whole thing turning into a philosophy lecture at a funeral.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** Grandchild (never spoken in front of a large crowd before, terrified).
      *   **Deceased:** Grandpa (ICU nurse for 35 years).
      *   **Core Conflict:** Grandpa had very specific, medically grounded views on brain death (once brainstem reflexes/apnea test are done, the person is gone, body is just machinery). He wanted organ donation immediately. However, Grandma and Aunt couldn't accept this, kept him on ventilator for 2 days until cardiac death, missing the donation window.
      *   **Audience:** Divided family. One side agrees with Grandpa's medical definition (including the speaker, somewhat). The other side (Grandma, Aunt) believes he died when the heart stopped.
      *   **Goal:** Write a 4-5 minute eulogy.
      *   **Tone:** Respectful of Grandpa's views (no dodging), but compassionate towards Grandma/Aunt (no accusing them of holding a corpse). Needs to bridge the gap without being a philosophy lecture.
      *   **Constraint:** The speaker is nervous, so the language should be speakable, not overly complex.

  2.  **Determine the Angle/Theme:**
      *   *The Trap:* Getting bogged down in the medical definition vs. emotional reality.
      *   *The Solution:* Acknowledge both truths. There is the *medical* truth (Grandpa's expertise) and the *human* truth (Grandma's love). Both are valid in their own contexts.
      *   *Key Message:* Grandpa spent his life caring for bodies to save lives. His wish was to give life (organs). His family's action was to hold on to love. Neither negates the other, even if the outcome wasn't what he planned.
      *   *Grandpa's Voice:* He was deadpan, not morbid. He wanted honesty. The eulogy should reflect that clarity but soften the edges for the grieving.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the nervousness (humanizes the speaker) and introduce Grandpa's profession. Establish his character (direct, honest, caring).
      *   **The "Hard" Topic (Brain Death):** Address his views directly but gently. Use his own logic. He knew the difference between a heartbeat and a person.
      *   **The Conflict (The Two Days):** This is the trickiest part. How to frame the 2 days on the ventilator?
          *   *Idea:* Frame it not as "keeping a dead body alive" but as "the family needing time to say goodbye."
          *   *Reframing:* Grandpa knew the science. Grandma knew the heart (metaphorically). The machine kept the body, but the *love* was still there.
      *   **The Organ Donation:** Acknowledge the wish. Acknowledge it didn't happen. Don't assign blame. Focus on the *intent* of generosity.
      *   **The Bridge:** How do we reconcile? Grandpa was a man of science, but also a man of love. He understood the body stops, but he also understood why people hold on.
      *   **Closing:** Bring it back to memory. What remains isn't the body or the machine, but the impact he had.

  4.  **Refining the Tone (Self-Correction during drafting):**
      *   *Critique:* Is it too clinical?
      *   *Fix:* Add more warmth. Talk about his hands, his demeanor.
      *   *Critique:* Is it too hard on Grandma?
      *   *Fix:* Explicitly validate her need for those two days. Use phrases like "grief doesn't follow a protocol."
      *   *Critique:* Is it too long?
      *   *Fix:* Keep sentences relatively short for public speaking. Aim for ~600-750 words for 4-5 minutes (speaking slowly).

  5.  **Drafting the Content (incorporating the "Deadpan" humor):**
      *   Need a line about him hating TV medical dramas. That's a specific detail provided.
      *   Need to mention he chose the speaker because they didn't get "weird" about it.
      *   Need to address the room without pointing fingers. "I know there are different ways to mark the moment he left us."

  6.  **Final Polish:**
      *   Check timing.
      *   Ensure the transition from the medical reality to the emotional reality is smooth.
      *   Make sure the ending feels resolved.

  7.  **Adding Advice for the Speaker:**
      *   Since the user is terrified, add some notes on delivery (breathing, printing large font, it's okay to cry).

  **(Self-Correction Note on the "Conflict"):** I need to be very careful not to validate the medical inaccuracy (brain death *is* death) while validating the emotional process. Grandpa would want the truth told. So, I must state his definition clearly, but frame the family's actions as an act of love that *followed* his passing, not necessarily denying it, but struggling with the finality. Actually, the prompt says the family *wouldn't let the transplant team do anything*. That implies a conflict. I can't lie and say they agreed. I have to acknowledge the divergence without making it a fight.
  *Strategy:* Focus on the *intent*. Grandpa wanted to give life. Grandma wanted to hold on. Both come from love. The tragedy is they couldn't align, but the love remains.

  *Revised Strategy:* Acknowledge the complexity. "He knew exactly when he was gone. We... took a little longer to catch up." That honors his view while forgiving the family.

  8.  **Final Review against constraints:**
