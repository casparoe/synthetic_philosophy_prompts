      *   **Part 3: The "Enough and As Good" vs. "Non-Worsening" Gap.**
          *   Locke: "As good" implies qualitative similarity in opportunity.
          *   Nozick: "Non-worsening" implies quantitative similarity in welfare.
          *   Example: Enclosure movement. Locke: Did they leave common land? No. Violation. Nozick: Did the landless peasants starve? No, they got jobs. Welfare up. Valid.
      *   **Conclusion:** Summarize the mechanical shift. It's not just weaker; it's a category change from *acquisition conditions* to *distributive outcomes*.

  5.  **Refine for the Audience (PhD Student):**
      *   Use specific citations (Simmons, Waldron, Tully).
      *   Avoid oversimplifying Locke (acknowledge the debate on whether Locke is a natural law theorist or proto-liberal).
