      *   *Did Nozick actually say he was reconstructing Locke?* Yes, he frames it as making the Lockean idea precise.
      *   *Is Spoilage truly independent?* Some argue sufficiency swallows spoilage. But the money argument is the strongest evidence for independence. I should emphasize the introduction of money.
      *   *Is Nozick's proviso purely utilitarian?* No, it's a side constraint. But the *metric* is welfarist. Need to be precise there.
      *   *The "Compensation" point:* This is crucial. Nozick allows appropriation that *would* violate the proviso if compensation is paid. Locke doesn't really have a "compensation after the fact" mechanism for initial acquisition; if the proviso is violated, the property right doesn't vest. This is a major mechanical difference.

