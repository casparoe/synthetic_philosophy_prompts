answer: |-
  This is an excellent catch. You are right to be suspicious of the standard gloss that Nozick merely "relaxes" Locke. The move is more structural than that; it involves a shift in the *category* of the constraint and the *metric* of the baseline.

  Here is the breakdown of the mechanics you are looking for, separating Locke's internal architecture from Nozick's reconstruction.

  ### 1. Locke: Are Spoilage and Sufficiency Independent?

  In Locke's text, the Spoilage Limitation (§31) and the Sufficiency Limitation (§27, §33) are **independent constraints serving distinct normative functions**, though they overlap in the early state of nature.

  **The Spoilage Limitation (Duty to God/Nature):**
  *   **Mechanism:** Limits *accumulation* based on the utility to the appropriator.
  *   **Normative Ground:** Teleological. God gave the world for use, not for waste. To let things perish uselessly in your possession is a violation of the purpose of creation.
  *   **Scope:** It applies to the relationship between the owner and the object.
  *   **Fate:** Locke explicitly suspends this limitation with the introduction of money (§36, §47, §50). Because gold/silver do not rot, one may hoard them without violating natural law. This allows for disproportionate accumulation.

  **The Sufficiency Limitation (Duty to Fellow Humans):**
  *   **Mechanism:** Limits *exclusion* based on the opportunity available to non-owners.
  *   **Normative Ground:** Relational/Right-based. Since the world was given to mankind in common, my appropriation cannot undermine your equal right to subsist.
  *   **Scope:** It applies to the relationship between the owner and the non-owner.
  *   **Fate:** Locke is ambiguous, but the stronger reading (defended by A. John Simmons and Jeremy Waldron) is that the invention of money does **not** suspend the sufficiency proviso. Money facilitates accumulation, but if accumulation leads to scarcity where others cannot appropriate "enough and as good," the legitimacy of that property is threatened (hence Locke's heavy emphasis on charity in §42 as a remedy when sufficiency fails).

  **Why they are independent:**
  You can violate one without the other.
  *   *Spoilage without Sufficiency violation:* I gather 1,000 apples in a forest of millions. They rot. I wasted resources, but I didn't hurt anyone's opportunity to appropriate.
  *   *Sufficiency without Spoilage violation:* (In a scarce environment) I fence off the only water source. I drink only what I need (no spoilage), but I have left nothing "as good" for you.

  **Conclusion on Q1:** They are distinct. Spoilage is an anti-waste constraint on *consumption/hoarding*; Sufficiency is an anti-harm constraint on *privatization*. Nozick largely discards Spoilage (consistent with Locke's money argument) but claims to retain Sufficiency. This is where the mechanical substitution occurs.

  ---

  ### 2. Nozick: The Mechanics of the Substitution

  Nozick's move in *Anarchy, State, and Utopia* (Chapter 7) is not simply to weaken Locke's requirement; it is to change the **baseline of comparison** and the **remedy for violation**.

  #### A. The Baseline Shift: Opportunity vs. Welfare
  Locke's "enough and as good" is primarily an **opportunity-based baseline**.
  *   **Locke's Test:** After my appropriation, is there physically similar resource availability left for you to exercise your liberty to appropriate?
  *   **The Metric:** Access to the *means of production* (land, water, raw materials).
  *   **The Intuition:** Property is legitimate only if it does not close off the common option of independent subsistence.

  Nozick's "non-worsening" is a **welfare-based baseline**.
  *   **Nozick's Test:** After my appropriation, is your overall utility/welfare lower than it would have been had the resource remained in the state of nature?
  *   **The Metric:** Overall *outcome* (including wages, trade benefits, security).
  *   **The Intuition:** Property is legitimate if the system of property rights generates enough efficiency to compensate those excluded from ownership.

  **Where the substitution happens:**
  Nozick substitutes the *loss of liberty to appropriate* with a *net calculation of welfare*.
  Under Locke, if I appropriate the only water hole, I have violated the proviso because I removed your opportunity to appropriate water, regardless of whether I let you drink.
  Under Nozick, if I appropriate the only water hole, I have *not* violated the proviso **provided** I do not charge you a price that leaves you worse off than you would be drinking from the common river in the state of nature.

  This allows Nozick to justify the Enclosure Movement logic that Locke struggles with. For Locke, enclosing common land violates sufficiency if it leaves laborers without land to farm. For Nozick, enclosing land is valid even if it leaves laborers landless, *so long as* the increased agricultural efficiency means their wages buy more food than they could have grown on the common plot.

  #### B. The Remedy Shift: Validity vs. Compensation
  This is the most critical mechanical difference that often gets missed.

  **Locke: A Condition of Validity**
  For Locke, the proviso is a **condition precedent** for the vesting of the property right.
  *   *Mechanics:* If the proviso is violated at the moment of acquisition, the property right **does not emerge**. The resource remains in common (or perhaps subject to a right of charity).
  *   *Implication:* You cannot "fix" a violation of the proviso after the fact. If you took more than your share when there wasn't enough left, you stole.

  **Nozick: A Condition of Liability (The Compensation Principle)**
  For Nozick, the proviso functions more like a **strict liability rule**.
  *   *Mechanics:* Nozick explicitly states that an appropriation can be *prohibited* if it violates the proviso, **OR** it can be *allowed provided compensation is paid* (ASU, p. 178).
  *   *Implication:* This transforms the proviso from a boundary on *acquisition* into a boundary on *distribution*. It allows the appropriation to stand (validating the title) even if the baseline is violated, as long as the loser is compensated up to the baseline.
  *   *The "Zuboff" Example:* Nozick discusses someone appropriating the only water source in a desert. He argues this is permissible *if* the owner sells water at a price that doesn't make others worse off than the baseline. If the price is too high, he must lower it (compensation). The property right remains intact; the duty is to price correctly.

  #### C. The "Systemic" vs. "Individual" Move
  Finally, Nozick shifts the unit of analysis.
  *   **Locke** applies the proviso to **individual acts of appropriation**. Each act must leave enough and as good.
  *   **Nozick** applies the proviso to the **total system of appropriation**. He acknowledges that individual acts might cumulatively worsen the position of others (e.g., everyone appropriates land until none is left). He argues the proviso is satisfied if the *system* of private property leaves everyone better off than the *system* of common ownership (ASU, p. 176-177).

  This is the "substantially weaker requirement" you suspected. It allows a series of appropriations that individually or collectively eliminate the "enough and as good" condition, provided the *economic effects* of the property system raise the welfare floor above the state-of-nature baseline.

  ### Summary for the Dissertation
  If you need to pin this down in your text, the argument is:

  1.  **Independence:** Locke's Spoilage and Sufficiency provisos are normatively distinct (anti-waste vs. anti-exclusion). Money suspends the former but not the latter.
  2.  **The Substitution:** Nozick retains the *name* "Lockean Proviso" but substitutes the **metric** (Opportunity to Appropriate $\rightarrow$ Overall Welfare) and the **logical status** (Condition of Validity $\rightarrow$ Condition of Liability/Compensation).
  3.  **The Consequence:** Locke's proviso protects the *independence* of the non-owner (their ability to exit the social system and subsist). Nozick's proviso protects only the *welfare* of the non-owner (their ability to survive within the property system).

  Nozick isn't just relaxing Locke; he is translating a natural law constraint on *acquisition* into a libertarian side-constraint on *outcomes*. This allows him to justify full liberal capitalist property rights in a way Locke's text, with its emphasis on "enough and as good left in common," arguably cannot.

  **Recommended Secondary Sources for this specific mechanic:**
  *   **A. John Simmons, *The Lockean Theory of Rights*:** Best on the independence of Locke's provisos.
  *   **Jeremy Waldron, *The Right to Private Property*:** Excellent on the "enough and as good" baseline and the scarcity problem.
  *   **Barbara Fried, *The Progressive Assault on Laissez Faire*:** She has a great dissection of how Nozick's proviso collapses into a form of utilitarianism/welfarism, which supports your "substitution" argument.
  *   **Peter Vallentyne & Hillel Steiner (eds.), *Left-Libertarianism and Its Critics*:** Specifically the essays discussing the "baseline problem" in Nozick.

  This should give you the traction you need to argue that Nozick's move is a category error (or a feature, depending on your view) rather than a simple interpretation.
