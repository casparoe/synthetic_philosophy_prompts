      *   **Problem:** The user is stuck on the relationship between Locke's actual text (Second Treatise, Ch. 5) and Nozick's interpretation. They see two distinct limits in Locke (spoilage vs. sufficiency) and suspect Nozick's "non-worsening" condition is a significant departure, not just a relaxation.
