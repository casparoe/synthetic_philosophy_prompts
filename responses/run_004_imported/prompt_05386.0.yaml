  2.  **Deconstruct Question 1: Locke's Spoilage vs. Sufficiency:**
      *   *Textual Evidence:*
          *   §27: "enough and as good left in common for others" (Sufficiency).
          *   §31: "before it spoils... whatever is beyond this... belongs to others" (Spoilage).
          *   §33: "enough, and as good left... more than the yet unprovided could use" (Sufficiency again).
      *   *Scholarly Consensus:* Most Locke scholars (Tully, Simmons, Waldron) treat these as distinct but related constraints.
      *   *Independence:*
          *   Spoilage is about *waste* relative to the appropriator's use. It's a limit on *accumulation* based on utility to the owner.
          *   Sufficiency is about *scarcity* relative to others. It's a limit on *exclusion* based on the welfare of non-owners.
      *   *Interaction:* In the early state of nature (plenty of land, few people), spoilage kicks in first. You can't hoard acorns because they rot. You can't fence 10,000 acres because you can't farm it all before it goes fallow/wild.
      *   *The Money Introduction:* Locke explicitly says the invention of money suspends the spoilage limitation (§36, §47, §50). You can hoard gold because it doesn't rot. But does it suspend sufficiency? Locke implies sufficiency holds until *actual* scarcity arises (land becomes scarce).
      *   *Conclusion on Q1:* They are independent. Spoilage is a duty to God/Nature not to waste. Sufficiency is a duty to fellow humans not to starve them. Spoilage limits *how much* you take; Sufficiency limits *whether* you can exclude others.

  3.  **Deconstruct Question 2: Locke's Sufficiency vs. Nozick's Proviso:**
      *   *Locke's Sufficiency:* "Enough and as good."
          *   Interpretation A (Strong/Physical): There must be literally similar resources left for others to appropriate. (Simmons' view).
          *   Interpretation B (Weak/Welfare): Others must not be harmed in their ability to survive/prosper.
          *   Locke's text leans toward A ("as good left in common"), but §33's river analogy suggests B (you aren't injured by the draught).
          *   Crucially, Locke ties this to the *opportunity to appropriate*. If land is scarce, the proviso is violated, and property rights might not hold (or charity kicks in, §42).
      *   *Nozick's Proviso:* "Non-worsening."
          *   Baseline: State of Nature (common ownership).
          *   Test: Is the person worse off than they would be if the resource remained unowned?
          *   Mechanism: Private property usually creates efficiency gains (production, trade) that compensate for the loss of access. So, even if there is *not* "enough and as good" land left, the landless are better off working for wages than trying to subsist on marginal land.
      *   *The "Switch":*
          *   Locke focuses on the *input* (access to means of production/resources).
          *   Nozick focuses on the *output* (overall welfare/utility baseline).
          *   *Where the substitution happens:* It happens in the definition of the baseline and the metric of harm.
          *   Locke: Harm = Loss of opportunity to appropriate similar resources.
          *   Nozick: Harm = Reduction in overall utility/welfare compared to the commons baseline.
      *   *Why it's weaker:* Nozick allows appropriation even when *no* "as good" resources are left, provided the non-owners are compensated via the benefits of a property system (trickle-down logic). Locke seems to think if "enough and as good" isn't left, the appropriation is illegitimate *unless* consent is given (which money represents, arguably).
      *   *The "Zuboff" Example:* Nozick uses the example of someone appropriating the only water hole. Locke would say this violates sufficiency immediately. Nozick says it's okay *unless* the owner charges a price that makes others worse off than the baseline. But even then, Nozick allows it if compensation is paid. Locke is more structural.

