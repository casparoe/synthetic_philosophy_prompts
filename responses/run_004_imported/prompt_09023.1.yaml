      *   *Context:* MIRI/Eliezer Yudkowsky et al. work on Formal Verification of Self-Modifying AI.
      *   *Problem:* If Agent $A$ builds Agent $B$, $A$ wants to prove $B$ is safe/trustworthy. If $B$ uses the same logic as $A$, Löb's Theorem says $A$ cannot prove "$B$'s proofs are sound" without inconsistency, unless $B$ is strictly weaker (which blocks recursive self-improvement).
      *   *Nature:* It's a structural constraint on *formal verification of successors*, not necessarily a limit on *capability* or *intelligence* in the general sense.

  4.  **Compare the Two:**
