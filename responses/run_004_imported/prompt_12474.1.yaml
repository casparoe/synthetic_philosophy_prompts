prompt: |-
  So I've been playing around with getting an LLM to answer the same hard question a bunch of times and just going with whatever answer comes up the most (kinda like those self-consistency tricks people use on math benchmarks). Since Condorcet's jury theorem shows majority-vote accuracy climbs toward 100% as you add more independent voters, doesn't that mean I can get basically arbitrarily reliable answers just by sampling the model enough times? trying to figure out roughly how many samples i'd need to hit like 99.9% reliability on genuinely hard problems.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Premise:**
      *   **Core Idea:** The user is proposing using majority voting (self-consistency) on LLM outputs to achieve arbitrarily high reliability, citing Condorcet's Jury Theorem (CJT).
      *   **Goal:** Reach 99.9% reliability on "genuinely hard problems."
      *   **Assumption:** LLM samples are "independent voters" with a probability $p > 0.5$ of being correct.
      *   **Question:** How many samples are needed?

  2.  **Evaluate the Theoretical Foundation (Condorcet's Jury Theorem):**
      *   *What does CJT say?* If $n$ voters vote independently, each with probability $p > 0.5$ of being correct, the probability of the majority being correct approaches 1 as $n \to \infty$.
      *   *Does it apply here?* This is the critical bottleneck.
          *   **Condition 1: $p > 0.5$.** On "genuinely hard problems," is the base model accuracy actually above 50%? Often, for hard reasoning tasks (e.g., MATH, GSM8K hard subsets, complex coding), base accuracy might be 30-40%. If $p < 0.5$, CJT says accuracy goes to 0% as $n \to \infty$.
          *   **Condition 2: Independence.** Are LLM samples independent? No. They come from the same weights, same training data, same biases. They are correlated. If the model has a systematic misconception, it will repeat it across samples. This violates the independence assumption.
          *   **Condition 3: Binary Choice.** CJT is strictly for binary decisions. Many LLM tasks are open-ended or multi-choice. While one can frame it as "Correct vs. Incorrect," the mechanism of error matters.

  3.  **Evaluate the Practical Reality (LLM Behavior):**
      *   **Systematic Errors:** LLMs don't make random noise errors like coin flips. They make *reasoning* errors. If the model doesn't know a fact or lacks a reasoning capability, sampling 100 times won't magically conjure it (unless the probability is non-zero but low, which leads to the next point).
      *   **Probability Distribution:** On hard tasks, the probability of the correct answer ($p$) is often *not* stable. It might be 0.1, 0.2, or 0.6 depending on the specific question. CJT requires an average $p > 0.5$.
      *   **Diminishing Returns:** Even if $p > 0.5$, the convergence isn't linear. It depends heavily on how much $p$ exceeds 0.5.
      *   **Calibration:** LLMs are often overconfident. Majority voting doesn't fix calibration issues.

  4.  **Calculate the Numbers (The "How Many Samples" part):**
      *   Even if we grant the idealized conditions (independence, $p > 0.5$), how many samples for 99.9%?
      *   Use the normal approximation to the binomial distribution.
      *   Let $X \sim B(n, p)$. We want $P(X > n/2) \ge 0.999$.
      *   Scenario A: $p = 0.55$ (barely better than random).
      *   Scenario B: $p = 0.7$ (decent).
      *   Scenario C: $p = 0.9$ (very good).
      *   *Rough calculation:*
          *   If $p=0.55$, you need *thousands* of samples.
          *   If $p=0.7$, you need dozens to hundreds.
          *   If $p=0.9$, you need very few.
      *   *Crucial Caveat:* This assumes independence. Correlation drastically increases the required $n$.

  5.  **Synthesize the Argument:**
      *   **Acknowledge the intuition:** It's a smart connection (Self-Consistency is a known technique).
      *   **Identify the fatal flaws:**
          1.  **Base Rate ($p$):** On *hard* problems, $p$ is often $< 0.5$. If $p < 0.5$, more samples make it *worse*.
          2.  **Independence:** Samples are highly correlated. Systematic errors don't average out.
          3.  **Cost:** Sampling 1000x is expensive.
      *   **Provide the Math:** Show the relationship between $p$, $n$, and final accuracy to illustrate the sensitivity.
      *   **Offer Better Alternatives:**
          *   Temperature tuning (increases diversity but risks quality).
          *   Chain of Thought (improves $p$).
          *   Verification/Critique (better than blind voting).
          *   Ensembling different models (better independence).

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Encouraging but rigorous. Don't just say "no," explain *why* the theorem doesn't map perfectly.
      *   *Structure:*
          1.  Validate the idea (Self-Consistency is real).
          2.  Break down Condorcet's assumptions vs. LLM reality.
          3.  Do the math (show the $p=0.55$ vs $p=0.7$ difference).
          4.  Discuss the "Hard Problem" trap ($p < 0.5$).
          5.  Discuss Correlation (the independence violation).
          6.  Conclusion/Recommendations.

  7.  **Refining the Math:**
      *   Need to be careful not to give a specific number like "500 samples" because it depends entirely on $p$.
      *   Instead, provide a table or formulaic explanation.
      *   *Formula:* $P(\text{majority correct}) = \sum_{k=\lfloor n/2 \rfloor + 1}^{n} \binom{n}{k} p^k (1-p)^{n-k}$.
      *   *Approximation:* For 99.9% confidence, we need the Z-score to be around 3.09.
      *   $Z = \frac{\hat{p} - p}{\sqrt{p(1-p)/n}}$. Here we want the majority threshold (0.5) to be 3.09 standard deviations away from the mean $p$.
      *   So, $0.5 = p - 3.09 \sqrt{p(1-p)/n}$.
      *   Solve for $n$: $n \approx \left( \frac{3.09 \sqrt{p(1-p)}}{p - 0.5} \right)^2$.
      *   If $p=0.55$: $n \approx (\frac{3.09 \times 0.497}{0.05})^2 \approx (\frac{1.53}{0.05})^2 \approx 30^2 \approx 900$.
      *   If $p=0.60$: $n \approx (\frac{3.09 \times 0.49}{0.1})^2 \approx 15^2 \approx 225$.
      *   If $p=0.70$: $n \approx (\frac{3.09 \times 0.46}{0.2})^2 \approx 7^2 \approx 50$.
      *   *Wait, check calculation:* $\sqrt{0.55 \times 0.45} \approx 0.497$. $3.09 \times 0.497 \approx 1.536$. $1.536 / 0.05 = 30.7$. $30.7^2 \approx 944$.
      *   *Correction:* This assumes independence. With correlation, effective $n$ is much lower.
      *   *Key takeaway:* Small drops in $p$ near 0.5 explode the required $n$.

  8.  **Final Polish:**
      *   Make sure to mention that "Hard Problems" usually imply $p$ is low.
      *   Mention "Mode Collapse" or "Convergence to Wrong Answer."
      *   Suggest "Best-of-N" with a verifier instead of Majority Vote.

  9.  **Self-Correction/Edge Case:**
      *   What if the user uses different models? That improves independence. I should mention that.
      *   What if the user uses high temperature? That improves independence but lowers $p$. Trade-off.

  10. **Final Output Structure:** (Matches the thought process above.)
      *   Intro: Great intuition, but...
      *   The 3 Killers of the Theorem (Base Rate, Independence, Cost).
      *   The Math (Sensitivity Analysis).
      *   Practical Reality (Systematic Bias).
      *   Better Strategies.
      *   Conclusion.

  (Proceed to generate response based on these points.)
answer: |-
  This is a fantastic intuition, and you've correctly identified the mechanism behind **Self-Consistency**, a technique popularized by Wang et al. (2023). However, applying Condorcet's Jury Theorem (CJT) to LLMs hits three major walls that prevent you from reaching "arbitrarily reliable" answers, especially on *hard* problems.

  Here is the breakdown of why the math works in theory but breaks in practice, along with the sample sizes you'd actually need under idealized conditions.

  ### 1. The Three Assumptions Condorcet Requires (That LLMs Violate)

  Condorcet's Jury Theorem states that if $n$ voters vote independently, and each has a probability $p > 0.5$ of being correct, the probability of the majority being correct approaches 1 as $n \to \infty$.

  Here is where LLMs break the theorem:

  #### A. The $p > 0.5$ Threshold (The "Hard Problem" Trap)
  CJT only works if the individual voter is **better than random**.
  *   **Easy/Medium Problems:** A good model might have $p = 0.8$. Majority voting works great here.
  *   **Genuinely Hard Problems:** On complex reasoning tasks (e.g., IMO-level math, obscure coding bugs, nuanced legal reasoning), state-of-the-art models often hover around $p = 0.3$ to $0.5$.
  *   **The Consequence:** If $p < 0.5$, Condorcet's theorem dictates that as you add more samples, your accuracy converges to **0%**. You are essentially voting to confirm the model's systematic ignorance. If the model is wrong 60% of the time, sampling 1,000 times just gives you a very confident wrong answer.

  #### B. The Independence Assumption
  CJT requires voters to be independent. LLM samples are **not independent**.
  *   They share the same weights, training data, biases, and architectural blind spots.
  *   **Correlated Errors:** If a model lacks a specific piece of knowledge (e.g., a specific theorem or fact), sampling it 100 times at temperature 0.7 won't conjure that knowledge. It will hallucinate the same misconception in 95 of those 100 samples.
  *   **Effective $N$:** Due to high correlation, 100 samples might behave like only 5 or 10 independent voters. This drastically slows the convergence rate.

  #### C. The Binary Constraint
  CJT applies to binary decisions (True/False). LLM generation is open-ended.
  *   On a math problem, there might be one correct answer and infinite wrong ones.
  *   However, models often converge on *specific* wrong answers (common misconceptions). If the "wrong" answer is more salient in the model's latent space than the "right" one, the majority vote will lock onto the error.

  ---

  ### 2. The Math: How many samples for 99.9%?

  Let's ignore the correlation issue for a moment and assume independence, just to see the theoretical cost. We want the probability of the majority being correct to be $\ge 0.999$.

  Using the normal approximation to the binomial distribution, the number of samples $n$ required is roughly:

  $$ n \approx \left( \frac{Z \cdot \sqrt{p(1-p)}}{p - 0.5} \right)^2 $$

  Where $Z \approx 3.09$ for 99.9% confidence. Notice the denominator $(p - 0.5)$. As $p$ gets closer to 0.5, $n$ explodes.

  | Base Accuracy ($p$) | Samples Needed ($n$) for 99.9% | Feasibility |
  | :--- | :--- | :--- |
  | **0.90** | ~16 samples | Trivial |
  | **0.80** | ~45 samples | Easy |
  | **0.70** | ~115 samples | Expensive |
  | **0.60** | ~550 samples | Very Expensive |
  | **0.55** | ~2,200 samples | Prohibitive |
  | **0.51** | ~60,000+ samples | Impossible |

  **The Takeaway:** If your "hard problem" only pushes the model to 55% accuracy, you need thousands of samples to get near-perfect reliability. At current API costs, running 2,000 samples per query is not scalable.

  ---

  ### 3. The Reality: Correlation and Systematic Bias

  In the real world, the numbers above are optimistic lower bounds. Because LLM samples are correlated, the "Effective Sample Size" ($N_{eff}$) is much lower than the actual sample count ($N$).

  $$ N_{eff} = \frac{N}{1 + (N-1)\rho} $$

  Where $\rho$ is the correlation coefficient between samples.
  *   If $\rho = 0$ (Independent): $N_{eff} = N$.
  *   If $\rho = 0.5$ (Moderate correlation): 100 samples act like 2 voters.
  *   If $\rho = 0.9$ (High correlation): 100 samples act like 1 voter.

  On hard reasoning tasks, $\rho$ is often very high. The model isn't rolling dice; it's navigating a probability landscape where the "wrong" path often has a higher peak than the "right" path. Sampling more just reinforces the wrong peak.

  ### 4. Better Strategies for Reliability

  If you want to move from 80% to 99.9% reliability on hard tasks, raw majority voting is usually the wrong tool. Try these instead:

  1.  **Verifier / Critic Model (Best-of-N):**
      Instead of voting, generate $N$ solutions (e.g., 10-20) and use a separate, specialized model (or a code executor) to *verify* which one is correct.
      *   *Why:* It changes the task from "Generate Correct" (hard) to "Verify Correct" (easier).
      *   *Example:* Generate 10 code snippets, run them against unit tests. Pick the one that passes.

  2.  **Chain of Thought (CoT) + Self-Consistency:**
      Don't just sample answers; sample *reasoning paths*.
      *   *Why:* This increases $p$ (the base accuracy). If you can move $p$ from 0.55 to 0.75 via CoT, the number of samples needed for high reliability drops from thousands to dozens.

  3.  **Ensembling Different Models:**
      Sample from Model A, Model B, and Model C.
      *   *Why:* This reduces correlation ($\rho$). Different architectures make different mistakes. If Llama-3, Claude-3, and GPT-4 all agree, the probability of correctness is significantly higher than if one model agrees with itself 10 times.

  4.  **Temperature Tuning:**
      *   High temperature increases diversity (lowers $\rho$) but lowers accuracy ($p$).
      *   Low temperature increases accuracy ($p$) but increases correlation ($\rho$).
      *   *Sweet Spot:* You need to find the temperature that maximizes the diversity of *correct* answers without introducing too many hallucinations.

  ### Summary
  You cannot get **arbitrarily** reliable answers just by sampling more.
  *   If base accuracy $p < 0.5$, more samples make you **less** reliable.
  *   If samples are correlated (they are), diminishing returns hit almost immediately.
  *   To hit 99.9% on hard problems, you generally need to **improve $p$** (via CoT, better prompting, or better models) rather than just increasing $n$.

  If you are currently getting ~60% accuracy on a hard benchmark, sampling 100 times might get you to 85%. To get to 99.9%, you almost certainly need an external verifier or a fundamentally more capable model.
