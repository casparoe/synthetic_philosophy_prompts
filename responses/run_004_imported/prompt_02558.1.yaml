      *   *Move 6:* Marcus successfully parries. The *Mencius* example provides the structural limit Elena claimed was missing. It's a draw or slight edge to Marcus for providing evidence, though the solution (fleeing) might seem unsatisfactory to a modern legalist.

      *Refining the "Who has the better of it":* I need to be nuanced. It's not about who is "right" about Confucianism (since I am the AI interpreter), but who makes the stronger *argumentative move* in the context of the debate.
