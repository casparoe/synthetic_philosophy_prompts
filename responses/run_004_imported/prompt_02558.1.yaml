      *   Check accuracy: *Analects* 13.18 is indeed the "Upright Gong" passage. *Mencius* 7A:35 is the Shun passage. *Analects* 4.18 is remonstrance.
      *   *Self-Correction on Move 2:* Marcus's point about "privilege" is actually a common defense in comparative law. I should acknowledge it has merit but note Elena's rebuttal regarding the *definition of virtue* is stronger.
      *   *Self-Correction on Move 6:* Does Marcus really win? Shun fleeing is a radical solution. It admits the conflict can't be resolved within the system, only by exiting the public sphere. I should note that Marcus answers the *existence* of a limit, even if the limit is extreme.

