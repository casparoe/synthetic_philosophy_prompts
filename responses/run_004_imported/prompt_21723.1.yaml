          *   *Infants:* They are biological humans but not yet "persons" in the full moral/ontological sense. They have potential, but lack the social/moral weight.
          *   *Risk:* Seems to deny rights to infants or outsiders.
          *   *Defense:* It emphasizes responsibility and interdependence. Without the community, the "self" is empty. The "attenuated" status isn't a lack of value, but a lack of *completed* moral identity.

      *   **Gyekye (Moderate Communitarian):**
          *   *Key Text:* "An Essay on African Philosophical Thought" / "African Cultural Values."
          *   *Core Idea:* Personhood has an innate core (individuality/rationality) *plus* social embedding.
          *   *Infants:* They possess the *capacity* for personhood inherently. They are persons-in-potential with full moral status from the start.
          *   *Risk:* Over-emphasizes Western-style individualism. Undermines the communal pressure to be moral.
          *   *Defense:* We need a baseline of rights to protect the vulnerable. We need individual agency to critique bad community norms (e.g., slavery, female genital mutilation).

  3.  **Character Development:**
      *   **Pro-Menkiti:** Let's call her *Amara*. She needs to emphasize the *process*, the *moral weight*, and the danger of abstract individualism. She should argue that "rights" without "responsibility" is hollow.
      *   **Pro-Gyekye:** Let's call him *Kwesi*. He needs to emphasize *human dignity*, *protection of the vulnerable*, and the *critical capacity*. He should argue that making personhood conditional is dangerous.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A quiet space, maybe after a lecture. Immediate engagement with the infant question.
      *   **Round 1: The Definition of the Infant.**
          *   Amara (Menkiti): The infant is a "seed," not a "tree." Biological vs. Moral.
          *   Kwesi (Gyekye): The seed *is* the tree in potential. To deny full status is to risk devaluation.
      *   **Round 2: The Danger of Exclusion (Rights).**
          *   Kwesi: If personhood is earned, what if the community rejects you? What about infants who die young? Did they never exist as persons?
          *   Amara: It's not about rejection. It's about ontological maturity. We care for them *because* we are persons, not because they are fully persons yet. The duty lies with *us*.
      *   **Round 3: Agency and Critique (The Gyekye Strong Point).**
          *   Kwesi: How do we reform the community if we are entirely defined by it? We need an individual standpoint.
          *   Amara: You assume the "individual" exists in a vacuum. Even critique comes from communal values deepened. But acknowledge the tension.
      *   **Round 4: The Metaphysics of "Becoming."**
          *   Amara: Personhood is a verb. It keeps us humble.
          *   Kwesi: But it must be grounded in something immutable to prevent tyranny.
      *   **Closing:** No resolution, but mutual respect and a synthesis of the tension.

  5.  **Refining the Argument (Self-Correction during drafting):**
