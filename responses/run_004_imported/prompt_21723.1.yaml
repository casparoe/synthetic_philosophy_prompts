  **(Self-Correction Note):** I need to be careful not to conflate Menkiti's view with infanticide justification. Menkiti explicitly argues against that, but his ontological distinction makes it theoretically tricky. Amara needs to defend this nuance carefully. Gyekye's critique is precisely that the distinction *invites* that abuse.

