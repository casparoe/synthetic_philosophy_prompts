      *   *Check:* Did I make Gyekye sound too Western? *Correction:* Ensure Kwesi grounds his argument in African values of dignity and protection, not just Kantian individualism. He is a *communitarian*, just moderate.
      *   *Check:* Is the infant example central? *Correction:* Keep bringing it back to the newborn. The theoretical stakes rest on this concrete case.

  6.  **Polishing the Dialogue:**
