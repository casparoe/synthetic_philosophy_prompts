  6.  **Refining the Details (Self-Correction during drafting):**
      *   *Check:* Did I address the *Sentences* vs. *De Regno* point? Aquinas became more cautious in *De Regno*. I should mention that Osvaldo might be wrestling with the development of the thought itself.
      *   *Check:* Is the Latin American context respected? Yes, the "National Salvation Junta" trope is historically accurate for the 70s/80s (Argentina, Chile, Brazil, etc.).
      *   *Check:* Is the ambiguity clear? The key is the *Congressional Vote*. If they signed it freely, he's legitimate. If they signed it with guns in the room, he's a usurper. The truth should be murky in the novel.

  7.  **Final Polish:** Ensure the tone is collaborative and encouraging. Emphasize that the ambiguity *is* the story. (Proceed to generate output based on these thoughts.)
answer: |-
  First, your housemate is wrong, and you are right to trust your instincts. In fiction, especially political thrillers, the *specificity* of a character's moral reasoning is what makes them feel real. If Osvaldo is a former Jesuit seminarian, he wouldn't just be "religious"; he would be trained in casuistry. He would know that moral acts are defined by their object, end, and circumstances. If the "object" (assassination) is intrinsically evil unless certain conditions are met, the "circumstances" (Ibarra's legal status) determine whether the act is tyrannicide or murder/sedition.

  You are also correct about the textual history. In his *Commentary on the Sentences* (1254–1256), Aquinas is somewhat more permissive regarding private citizens killing tyrants. By the time he writes *De Regno (On Kingship)* (1265–1267) and the *Summa Theologiae* (1270s), he tightens the screws significantly. He becomes terrified of the precedent: if any private citizen can judge a ruler a tyrant, the result is often greater tyranny or civil war (*sedition*).

  To make Ibarra a genuine "hard case" for Osvaldo, we need to blur the line between *tyrannus ex defectu tituli* (usurper, defective title) and *tyrannus ex parte exercitii* (legitimate title, tyrannical exercise).

  Here is a sketch of General Ibarra's rise to power designed specifically to break Osvaldo's Thomistic framework, followed by the specific criteria Osvaldo would be wrestling with.

  ### The Backstory: The "Resolution of National Salvation"

  **1. The Pre-Coup Context (The "State of Nature")**
  Ten years ago, the country wasn't just unstable; the constitutional order had functionally collapsed. The elected President was incapacitated (stroke/coma), the Vice President was under investigation for treason, and a leftist insurgency (let's call them *The Red Dawn*) had seized two provincial capitals. The Congress was deadlocked and unable to elect an interim president per the constitution. There was genuine fear of civil war.

  **2. The Event (The "Legal" Coup)**
  Ibarra, then Army Chief of Staff, did not storm the palace with tanks. Instead, he convened a joint session of the Supreme Court and the remaining Congress members. He presented intelligence that the insurgency was about to march on the capital.
  *   **The Ambiguity:** The military surrounded the legislative building (coercion), but Ibarra did not dissolve them. He asked them to invoke "Article 99" (emergency powers).
  *   **The Vote:** Under immense pressure, a quorum of Congress voted to suspend the constitution for 12 months and grant Ibarra "Plenipotentiary Powers" to restore order. The President's cabinet resigned "for health reasons."
  *   **Thomistic Problem:** Was this coercion (*metus*)? If a judge signs a verdict with a gun on the desk, is the verdict valid? Aquinas says acts done out of fear are "mixed voluntary" — voluntary enough to be binding, but coerced enough to be suspect.

  **3. The Ratification (The Referendum)**
  Two years later, with order restored and the economy stabilizing, Ibarra held a plebiscite.
  *   **The Result:** 75% voted to ratify Ibarra's presidency for a 10-year term.
  *   **The Catch:** The opposition was banned from campaigning, citing "national security." However, turnout was genuinely high, and many people *did* vote yes because they remembered the chaos of the pre-Ibarra years.
  *   **Thomistic Problem:** Aquinas places weight on the *common good* and the consent of the community. If the community *actually* prefers Ibarra to the alternative (chaos), does their consent heal the defective title? Or is consent under censorship invalid?

  **4. The Current Situation (Year 10)**
  Ibarra is now entrenched. The insurgency is gone, but so are civil liberties. "Disappeared" dissidents are an open secret. He claims he is the *only* thing holding the country together. He promises to step down... eventually. But he has recently amended the constitution to allow indefinite re-election if "threats persist."

  ### Why This Breaks Osvaldo's Thomism

  This backstory creates a "hard case" because Ibarra is neither a clear usurper nor a clear legitimate ruler. Here is how Osvaldo should articulate the dilemma using Aquinas's specific criteria.

  #### 1. The Question of Title (*Defectu Tituli*)
  *   **The Usurper Argument:** Ibarra is a usurper because the initial Congressional vote was obtained under duress (*metus*). In *De Regno*, Aquinas suggests that a ruler who seizes power by force has no claim to obedience.
  *   **The Legitimacy Counter-Argument:** The "duress" came from the *circumstances* (the insurgency), not just Ibarra's guns. He was invited by the existing institutions (Congress/Courts), even if pressured. Furthermore, the subsequent referendum provided a new title based on popular consent.
  *   **Osvaldo's Crisis:** If the referendum counts as genuine consent of the governed, Ibarra is no longer a usurper. He has acquired a *prescription* of right over time. If Osvaldo kills him, he is not killing a robber; he is killing a Head of State.

  #### 2. The Question of Public Authority (*Auctoritas Publica*)
  *   **The Thomistic Rule:** For a ruler who has a legitimate title but rules badly (*ex parte exercitii*), Aquinas is explicit in *Summa Theologiae* II-II, Q. 42: private individuals cannot depose him. Only "public authority" can.
  *   **The Trap:** Ibarra *is* the public authority. He dissolved the Congress that could impeach him. The Courts are packed.
  *   **Osvaldo's Crisis:** Does the right to judge revert to the people when the public institutions are incapacitated? Or does the absence of public authority mean *no one* can act?
      *   *If Osvaldo says "Yes, it reverts to us":* He risks the "tumult" Aquinas warns about. Who decides when the institutions are truly dead? Every disgruntled rebel will claim institutions are dead.
      *   *If Osvaldo says "No, we must wait":* He is complicit in evil. Aquinas says obedience is not due to a tyrant when he commands against God (e.g., murdering innocents). But does *disobedience* justify *execution*?

  #### 3. The Question of Scandal and Consequences (*Incommode*)
  *   **The Thomistic Rule:** In *De Regno* I.6, Aquinas argues that even if a tyrant *should* be removed, if removing him will cause greater disorder (civil war, worse tyrant), it is better to endure him. "It often happens that when a tyrant is deposed by his subjects, there arises a worse tyranny."
  *   **The Trap:** Ibarra's faction controls the army. If he is killed, will the country slide back into the pre-coup civil war? The plotters are a small cell; they do not represent a broad coalition ready to govern.
  *   **Osvaldo's Crisis:** This is the prudential argument. Osvaldo might agree Ibarra is a tyrant, but argue that assassination is morally illicit because the *consequences* violate the Common Good more than Ibarra's rule does. The other plotters will call this cowardice; Osvaldo knows it's the core of Thomistic political realism.

  ### How to Write the Debate

  To show Osvaldo isn't just stalling, have him force the other plotters to answer specific questions that mirror the Aquinas criteria.

  **Plotter (The Pragmatist):** "The man is a murderer, Osvaldo. He signs death warrants. You want us to pray while he kills our brothers?"

  **Osvaldo:** "I want to know if we are judges or executioners. Aquinas draws a line between the tyrant who steals the crown and the king who wears it badly. If Ibarra is a thief, we are resisting a robber. If he is a king, we are committing sedition."

  **Plotter:** "He stole it with guns!"

  **Osvaldo:** "Ten years ago. But the people voted for him in '76. Does the blood of the initial sin wash out if the community consents later? If they consented, he holds title. And if he holds title, by what authority do we sit in judgment? The Congress is gone. The Courts are his. Are *we* the Public Authority now? If we claim that power for ourselves, what stops the next faction from claiming it against us?"

  **Plotter:** "So we do nothing? We let him disappear another hundred kids?"

  **Osvaldo:** "I'm saying if we kill him and the army fractures and the Red Dawn comes back from the mountains... if the result is ten thousand dead instead of one hundred... have we done good? Aquinas says we must look at the *exitus*, the outcome. A tyrannicide that brings civil war is not a virtue. It's a vice disguised as courage."

  ### The "Sentences" vs. "De Regno" Nuance
  If you want to really flex Osvaldo's scholarship, have him reference his own training.

  **Osvaldo:** "In the *Sentences*, Thomas was younger. He spoke of the tyrant as a public enemy that any man might strike down. But in *De Regno*... he grew older. He saw what happens when private men take the sword. He wrote that it is better to suffer a moderate tyranny than to risk the peril of greater unrest by opposing it. Ibarra is not moderate. But is the risk worth it? I don't know. And if I don't know, I cannot bless the knife."

  ### Summary for Your Outline
  *   **Ibarra's Status:** A "Constitutional Usurper." He used legal mechanisms (Congressional vote, Referendum) to launder a military seizure of power.
  *   **The Ambiguity:** The initial coercion vs. subsequent popular consent.
  *   **Osvaldo's Block:** He cannot determine if Ibarra is a *usurper* (allowing private resistance) or a *legitimate ruler* (requiring public authority).
  *   **The Stakes:** If Osvaldo is wrong, the assassination isn't just risky; it's a sin of sedition and potentially a cause of greater evil (civil war), which violates the Common Good he is trying to save.

  This setup ensures Osvaldo isn't just being difficult; he is guarding the group against the moral catastrophe of becoming the very chaos they claim to fight. It makes his eventual decision (whether to join or refuse) land with much heavier weight.
