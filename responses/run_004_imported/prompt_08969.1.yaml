prompt: |-
  I'm about two-thirds into a novel set in an invented Latin American country in the early 80s, about a small group plotting to kill the general who's been running things for a decade. One of my POV characters, a former Jesuit seminarian named Osvaldo, keeps steering the group's late-night arguments back to Aquinas whenever someone wants him to just bless the plan already. I don't want his reasoning to be the flattened "well, Aquinas said tyrants can be killed" version you get in pop summaries — from what I've read he's actually pretty careful about this: theres a real distinction between a tyrant who's a straight-up usurper with no legitimate claim to begin with (who private citizens can resist more or less like they'd resist a violent robber, no judge needed) and a ruler who came to power legitimately and then degenerated into tyranny, where Aquinas gets a lot more conservative and basically reserves any removal to the community or public authority acting as a whole, not some private guy with a knife — partly, if I remember right, because of how badly that kind of precedent could misfire. I even have a vague memory he's stricter about it in the On Kingship text than in the earlier Sentences commentary, but don't hold me to that part. My housemate has an actual philosophy MA and thinks I'm overthinking a novel nobody's going to fact-check, but I'd rather Osvaldo's reasoning actually hold up.

  Here's my actual problem: I need General Ibarra's backstory to be a genuine hard case under that distinction, not an obvious "usurper" or an obvious "legitimate ruler gone bad," because I want Osvaldo's crisis to be about something real and not just me being vague on purpose. Could you sketch a specific version of how Ibarra took power and has held onto it since then — the coup itself, whatever referendum or legal patch-up came after, how the years since have gone — such that a careful Thomist would be genuinely torn about which bucket he falls into? And then walk me through exactly which of Aquinas's own criteria are doing the work of making it ambiguous, so I know the debate I write for Osvaldo is actually turning on the theory and not on me hand-waving.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

