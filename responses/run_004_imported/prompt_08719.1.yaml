answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I've had the privilege of calling [Groom] a friend for ten years, ever since we met at a LessWrong meetup in Boston. Back then, we were just two people arguing about probability theory over cold pizza. Today, he's standing here, looking sharper than I've ever seen him, next to [Bride].

  Now, looking at this couple, some of you know that their professional lives are deeply rooted in the study of strategy. [Groom] works on multi-agent alignment. [Bride] works on arms-control policy. If you're family, you might be wondering if that means they treat their relationship like a math problem.

  The truth is, for the first few months of their courtship, they accidentally did.

  There is a concept in bargaining theory, often discussed by people like Thomas Schelling and, more recently, Andrew Critch, called a "commitment race." I promise I will only explain this once. In a negotiation, you often gain leverage by committing yourself to a position early and irreversibly—like burning the boats behind you so the enemy knows you have to fight. But if *both* sides try to do this at once, you get a race. You both rush to make your commitments earlier, more rigidly, and with less thought than you can afford, just to avoid being the one who blinked. It's a mechanism that leads to brinkmanship, and usually, it ends badly.

  [Groom] and [Bride] told me that early on, they both felt a pull toward each other that was terrifyingly strong. And, acting on instincts that their careers had sharpened, they both strategically underplayed it. They were protecting their leverage. They were, without meaning to, running a commitment race. They were trying to see who could care less, because caring less felt safer.

  But here is where the story turns. Because they are who they are, they didn't resolve this with a grand gesture or a dramatic confrontation. They resolved it with data. Independently, without telling the other, they each sat down and wrote a long letter. They laid out their feelings, their fears, and their hopes. And they sent them in the same week.

  In game theory terms, they didn't try to out-commit each other. They synchronized.

  That is the difference between a commitment race and a marriage. A commitment race is private, unilateral, and driven by the fear of being exploited. It is a move made in the dark to gain an advantage.

  A wedding is the exact opposite.

  What we are witnessing today is not one person gaining leverage over the other. It is a public, simultaneous, and mutual commitment made in the light. By standing here, in front of everyone you love, you are removing the ambiguity that fuels the race. You are telling the world, and each other, that you are opting out of the game of leverage entirely. You are choosing to be vulnerable, not because you have to, but because you trust the person standing opposite you to catch you.

  [Groom], I've watched you spend a decade thinking about how independent agents can cooperate without catastrophe. [Bride], you spend your days thinking about how to lower the stakes in a world full of doomsday devices. Today, you don't need models or policy papers. You have already solved the alignment problem between the two of you. You found a way to turn a standoff into a partnership.

  So, if everyone could please raise a glass.

  To [Groom] and [Bride]. May you never have to burn a boat to prove you're staying. May your commitments always be simultaneous. And may you always find that the best move is the one you make together.

  To the happy couple.
