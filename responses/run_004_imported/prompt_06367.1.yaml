answer: |-
  You have dug a very excellent research hole, and your instincts are spot-on. You are correctly sensing that Gongsun Long is pulling a specific logical sleight-of-hand, and you're right that the Mohists later dismantled it.

  First, a quick historical sanity check: You are correct that the border guard story is almost certainly apocryphal. It doesn't appear in the *Zhan Guo Ce* or *Shiji*. It's likely a later anecdote invented to illustrate the absurdity of the School of Names (Mingjia). However, for a novel, it is *perfect*. It dramatizes the clash between abstract logic and state power.

  Here is the breakdown of the logic, the Mohist counter, and how your guard can win the argument without sounding like he's just shouting.

  ### 1. The Logic: Is he equivocating?
  You asked if the second argument ("asking for a horse") is doing genuine work or sliding between questions. The answer is: **It is doing genuine work, but it relies on a specific definition of "is."**

  In modern logical terms, Gongsun Long is distinguishing between **Identity** and **Class Inclusion**.
  *   **Common Usage:** "A white horse *is* a horse" means $WhiteHorse \subset Horse$ (White horses are a subset of horses).
  *   **Gongsun Long's Usage:** "A white horse *is* a horse" means $WhiteHorse = Horse$ (The concept 'white horse' is identical to the concept 'horse').

  Since the set of white horses is not identical to the set of all horses (one includes black horses, the other doesn't), he argues they are not the same.

  **The Second Argument (The "Asking" Bit):**
  This is an **Extensional** argument. He is looking at the *scope* of the term.
  *   If Term A = Term B, they must refer to exactly the same objects.
  *   "Horse" refers to {Black, Yellow, White...}.
  *   "White Horse" refers to {White...}.
  *   Since the lists are different, the Terms are different.

  So, he isn't just talking nonsense; he is arguing that **compound concepts are distinct from simple concepts.** "White Horse" adds a specification that "Horse" does not have. Therefore, the *Name* (Ming) "White Horse" is not the *Name* "Horse."

  **Where he is vulnerable:** He is conflating the *Name* with the *Object*. The law bans the *object* (the animal), but he is arguing about the *name* (the label).

  ### 2. The Mohist Counter ("Riding a white horse is riding a horse")
  You remembered correctly. The later Mohist Canons (specifically the *Xiao Qu* chapter) explicitly target this. Their argument is based on **accumulation** and **pragmatic function**.

  *   **The Mohist Logic:** If you ride a white horse, are you riding an animal? Yes. Is that animal a horse? Yes. Therefore, you are riding a horse.
  *   **The "Killing a Thief" Analogy:** The Mohists argue: "Killing a thief is not killing a man." Wait, that sounds like Gongsun Long! Actually, the Mohists use this to show the nuance. They argue that while a thief *is* a man, "killing a thief" (justified execution) is not the same act as "killing a man" (murder).
  *   **Applying it to Gongsun:** The Mohists would argue that while the *concept* "white horse" is distinct from "horse," the *action* of bringing a white horse across the border falls under the *prohibition* of bringing a horse.

  **Does Gongsun Long have a move to survive this?**
  Yes. His move is **Strict Nominalism.**
  He would argue: "The law says 'No Horses.' It does not say 'No White Horses.' If the Magistrate meant to ban white horses, he should have used the specific Name. To punish me for 'White Horse' under the law of 'Horse' is to confuse Names. If Names are confused, the state falls into chaos."

  This was the actual political stakes of the School of Names. They weren't just playing word games; they were arguing that precise language is the foundation of order.

  ### 3. How the Guard Can Push Back (The "Sharp" Counter)
  If the guard just says "That's stupid," it kills the scene. If the guard beats him at philosophy, it makes the guard seem improbably educated. The sweet spot is for the guard to **reject the premise of the game.**

  The guard represents the **Legalist/Pragmatic** view (which historically won out over the School of Names). The Law is about *Intent*, not *Semantics*.

  **The Guard's Winning Argument:**
  "The law bans 'horses' to prevent war assets from leaving. Your animal has hooves, a mane, and can carry a spearman. Whether you call it a 'white horse,' a 'cloud-steed,' or 'your mother's brother,' it fulfills the *reality* (Shi) of a horse. You are arguing about the *Name* (Ming). I am enforcing the *Reality*."

  This hits the core weakness of Gongsun Long: He prioritizes the Map over the Territory.

  ### 4. Polishing the Dialogue
  Your stitched translation is accurate to the meaning but a bit dry for a tense border scene. Here is a version that keeps the logic but adds the rhythm of a debate.

  **Gongsun Long:** "You stop me for a horse. I have a white horse. Is a white horse a horse?"
  **Guard:** "Don't play with me. Yes."
  **Gongsun Long:** "Incorrect. 'Horse' names the shape. 'White' names the color. To name a color is not to name a shape. Therefore, a white horse is not a horse."
  **Guard:** "It has four legs. It eats oats."
  **Gongsun Long:** "If you ask for a horse, a yellow one will do. If you ask for a white horse, a yellow one will not. If 'white horse' were truly 'horse,' the request would be the same. It is not. Therefore, they are distinct."
  **Guard:** (Pauses, leans on his halberd) "Scholar. If I ban 'thieves,' and I catch you stealing, can you argue 'I am not a thief, I am a *white* thief'?"
  **Gongsun Long:** "That is a different category of—"
  **Guard:** "Is it? The law bans horses to keep weapons off the border. Your 'white horse' carries weapons. Your 'white horse' runs fast. Your 'white horse' is a war animal. The Magistrate's seal bans the *animal*, not the *word*. You can keep your logic. I'm keeping the beast."

  ### 5. Summary for Your Notes
  *   **The Logic:** Gongsun Long is arguing **Intension** (Concept A $\neq$ Concept B) to deny **Extension** (Object A $\notin$ Category B). It is technically valid in set theory (The set {White Horses} $\neq$ The set {Horses}), but pragmatically false (The set {White Horses} $\subset$ The set {Horses}).
  *   **The Mohist Counter:** "Riding a white horse is riding a horse." They argue that actions accumulate. If the base action is riding a horse, adding "white" doesn't negate the base action.
  *   **The Guard's Counter:** Don't fight the logic. Fight the **Intent**. The Law targets the *function* of the object, not the *definition*.
  *   **Historical Flavor:** The School of Names was eventually crushed by the Legalists. The Legalists believed that if people start debating the definitions of laws, the laws become unenforceable. Your guard represents the rising tide of Legalism that will eventually unify China under Qin. Gongsun Long represents the old, fractious intellectualism that has to be stamped out for order to prevail.

  This gives your scene thematic weight: it's not just a guy being annoying; it's the clash between **Philosophical Precision** and **State Power**. And historically, State Power wins.
