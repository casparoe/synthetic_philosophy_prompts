      *   **Implication:** If no one knew water was H₂O in 1750, then the term "water" couldn't have referred to H₂O *then*. It must have referred to something descriptive (like "clear, drinkable liquid"). Therefore, meaning isn't fixed by external reality (semantic externalism) but by internal knowledge/descriptions (descriptivism).
