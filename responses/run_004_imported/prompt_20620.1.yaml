      *   **The 1750 Date:** Putnam chose 1750 *precisely* because it was before the chemical discovery. This isn't a bug; it's a feature. He wants to show that *even before* scientific knowledge, the reference was fixed by the underlying nature of the stuff, not the descriptions.
      *   **Division of Linguistic Labor:** This is the key counter-argument. Ordinary speakers don't need to know the essence. They defer to experts (or the potential for experts) to fix the reference.
      *   **Rigidity of Natural Kind Terms:** "Water" is a rigid designator. It picks out the same stuff in all possible worlds where that stuff exists. The fact that 1750 speakers didn't *know* it was H₂O doesn't change what they were *talking about*.

  3.  **Formulate the Response:**
