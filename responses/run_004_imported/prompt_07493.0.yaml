  *(Self-Correction on the Objection)*: The strongest objection isn't just methodological; it's economic. If QALY gains are smaller (because patients rate their baseline higher), the Cost/QALY ratio goes *up*. This makes treatments for disabled people look *less* cost-effective. This is the exact opposite of the intended equity goal. This is a crucial paradox to highlight. I must explain *why* we accept this risk (because the alternative is morally worse).

