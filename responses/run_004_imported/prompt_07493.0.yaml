answer: |-
  **MEMORANDUM**

  **TO:** Health Technology Assessment Committee
  **FROM:** [Your Name/Chair, Methodological Standards Subgroup]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Utility Weight Sources for QALY Calculations

  ### 1. Purpose
  This memo resolves the longstanding methodological deferral regarding the source of utility weights used in our cost-per-QALY calculations. Specifically, it addresses whether we should derive health state valuations from the general public (hypothetical) or from patients currently living with the condition (experiential). As demonstrated in the current funding cycle, this choice is not methodologically neutral; it determines the ranking of competing proposals and dictates which patient populations receive access to treatment.

  ### 2. Recommendation
  The Subgroup recommends that the Committee adopt **Patient-Reported Utility Weights** as the primary standard for all health technology assessments involving chronic or manageable conditions.

  Where robust patient data is unavailable, we recommend using proxy data from clinically similar patient populations rather than reverting to general public tariffs. General public weights should be reserved strictly for preventative interventions where the health state is being avoided entirely, rather than treated.

  ### 3. Rationale
  Our mandate is to allocate public funds fairly across a population that includes people with disabilities and chronic illnesses. The evidence consistently shows that the general public systematically undervalues health states associated with disability due to "focusing illusions" and ableist bias. The public imagines the onset of a condition without accounting for human adaptation, resilience, or the support systems that mitigate suffering.

  By continuing to use public weights for treatment decisions, this Committee implicitly endorses the view that life with a disability is inherently less valuable than the public perceives it to be. This violates our ethical commitment to equity and non-discrimination. Patients possess epistemic authority regarding their own quality of life; their valuations reflect the reality of living with a condition, not the fear of acquiring it.

  ### 4. Operational Rule for Future Cycles
  To implement this decision, the following rule applies to all submissions effective immediately:

  > **Rule 12.4 (Source of Utility Data):**
  > Submitters must provide utility weights derived from validated Patient-Reported Outcome Measures (PROMs) collected from individuals currently managing the target health state.
  >
  > *   **Exception A (Prevention):** For vaccines or prophylactic interventions where the health state is avoided, public weights may be used to estimate the disutility of the *potential* condition.
  > *   **Exception B (Data Scarcity):** If patient data is unavailable, the Committee will commission rapid observational studies. Use of general public tariffs (e.g., standard EQ-5D population norms) is prohibited for treatment evaluations unless explicitly waived by a two-thirds Committee vote on the grounds of urgent clinical need.

  ### 5. The Strongest Objection: The "Adaptation Paradox"
  We must be candid about the economic consequence of this ethical choice. The strongest objection to adopting patient weights is the **Adaptation Paradox**.

  Because patients often adapt to their conditions, they rate their baseline health state higher (e.g., 0.8 on a 0–1 scale) than the public does (e.g., 0.6). Consequently, a curative treatment that restores full health (1.0) generates a smaller calculated QALY *gain* under patient weights (0.2 gain) than under public weights (0.4 gain).

  **The Risk:** By adopting patient weights, we mathematically reduce the apparent benefit of curative treatments for conditions where patients have adapted well. This inflates the cost-per-QALY ratio for those treatments. In a fixed-budget system, this could paradoxically make it *harder* to fund cures for chronic disabilities compared to treatments for acute conditions where patients have not adapted. We risk prioritizing conditions where suffering is most visible (and rated poorly by patients) over conditions where patients are resilient.

  **Committee Position on Objection:** We accept this risk. While the Adaptation Paradox may skew efficiency metrics, the alternative—using public weights—skews *justice*. It is preferable to acknowledge that our cost-per-QALY metric underestimates the value of curing adapted patients than to fund treatments based on the ableist misconception that their current lives are not worth living. We will monitor funding patterns to ensure this does not systematically exclude curative therapies for disabled populations, potentially requiring supplementary equity weighting in future budget reviews.

  ### 6. Next Steps
  Staff is directed to update the Submission Guidelines to reflect Rule 12.4 by the start of the next quarter. The Methodological Subgroup will review the impact of this change on funding rankings after two cycles.

  ***

  **Approved:**
  [Signature]
  **Chair, HTA Committee**
