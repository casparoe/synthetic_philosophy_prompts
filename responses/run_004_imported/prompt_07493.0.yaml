prompt: |-
  I sit on the health technology assessment committee that decides which treatments our health system will fund, using cost-per-QALY thresholds to compare across unrelated conditions. We keep deferring the same methodological question: whether the utility weights behind those calculations should come from people currently living with a given health state, or from members of the general public asked to imagine living with it. The two sources reliably diverge—patients tend to rate their own state higher than the public expects, and the gap varies by condition—so the choice is not neutral: this cycle, two proposals competing for the same fixed budget would be funded in the opposite order depending on which source of weights we use. Draft the committee's decision memo recommending which source we should adopt going forward, or how to combine them, with an operational rule members can apply in future cycles and a candid account of the strongest objection to whichever recommendation you make.
reasoning: |-
  Here's a thinking process that leads to the suggested decision memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Health Technology Assessment (HTA) Committee.
      *   **Task:** Draft a decision memo recommending a policy on utility weight sources (patient vs. general public) for QALY calculations.
      *   **Context:** The committee uses cost-per-QALY thresholds to prioritize funding across unrelated conditions. There's a persistent disagreement/deferment on whose values to use. Patients rate their health states higher (adaptation) than the public imagines (fear/discounting). This divergence changes funding decisions (opposite order for two competing proposals).
      *   **Requirements:**
          1.  Recommend a source (patient, public, or combination).
          2.  Provide an operational rule for future cycles.
          3.  Include a candid account of the strongest objection to the recommendation.
          4.  Tone: Professional, ethical, decisive, yet acknowledging the complexity (memo format).

  2.  **Evaluate the Options:**
      *   *Option A: General Public Weights.*
          *   *Pros:* Aligns with the "social opportunity cost" perspective (taxpayers fund the system), consistent with standard economic theory (willingness to pay), avoids adaptation bias (patients might undervalue health gains because they've lowered expectations).
          *   *Cons:* Discriminatory against disabled/chronic ill (ableist bias), ignores lived experience, violates the "nothing about us without us" principle, may undervalue treatments for conditions the public fears disproportionately.
      *   *Option B: Patient Weights.*
          *   *Pros:* Respect for autonomy and lived experience, reduces ableist bias, captures adaptation/resilience.
          *   *Cons:* Adaptation bias (patients might not value a cure as highly because they've adjusted), potential conflict of interest (patients want funding), inconsistency across conditions (some groups organize better than others).
      *   *Option C: Hybrid/Weighted Average.*
          *   *Pros:* Compromise, acknowledges both perspectives.
          *   *Cons:* Arbitrariness (why 50/50?), doesn't solve the philosophical conflict, still leads to difficult edge cases.

  3.  **Determine the Best Recommendation:**
      *   *Ethical Core:* HTA is about allocating *public* resources. Therefore, the *social* value of health gains matters most. However, systematically discounting the lives of the disabled/chronically ill based on hypothetical public fear is ethically untenable and potentially illegal (disability discrimination).
      *   *Practical Reality:* Using public weights often penalizes conditions where adaptation is high (e.g., spinal cord injury, mental health). Using patient weights can underestimate the benefit of preventing a condition (since the public fears it more).
      *   *Decision:* The trend in modern bioethics and HTA (e.g., NICE, ICER shifts) is moving towards acknowledging the bias in public weights. However, a pure patient-only approach has methodological risks regarding *gains* vs. *states*.
      *   *Selected Approach:* **Primary reliance on patient-reported outcomes (PROs) for chronic/manageable conditions, with a calibrated public preference overlay for acute/preventative scenarios, but with a strong default towards patient weights to mitigate discrimination.**
      *   *Refinement:* Actually, for a *decision memo* that needs to be operational, a hybrid is often the most defensible compromise, but a strong stance is usually more helpful. Let's look at the "adaptation" problem. If patients rate their state as 0.9 (near perfect) because they adapted, a treatment moving them to 1.0 looks like a tiny gain (0.1). The public might rate the state as 0.6, seeing the gain as 0.4. If we use patient weights, the treatment looks less cost-effective. This creates a "disability paradox" where successful adaptation punishes funding.
      *   *Re-evaluation:* To maximize equity and avoid penalizing those who have adapted to disability, **Patient Weights** are generally preferred in modern equity-focused frameworks, *but* we must account for the fact that QALYs measure *gains*. If a patient doesn't value the gain, is it real?
      *   *Stronger Stance:* **Adopt Patient Weights as the default, but apply an "Equity Correction" for conditions known to suffer from significant public stigma or misunderstanding.**
      *   *Simpler Operational Rule:* Let's go with a **Weighted Average** but with a specific rationale: The system is publicly funded (public view matters) but must not discriminate (patient view matters). A 50/50 split is too arbitrary.
      *   *Best Practice:* Many jurisdictions (like NICE) technically use public tariffs (EQ-5D) but are under pressure to change.
      *   *Decision for this Memo:* I will recommend **Patient-Reported Outcome Measures (PROMs) as the primary source**, with a specific caveat for *preventative* interventions. Why? Because using public weights systematically devalues the lives of people with disabilities (ableism). The "adaptation bias" is a feature, not a bug—it reflects actual quality of life. The strongest objection is the "adaptation paradox" (it makes cures look less valuable). I need to address that candidly.

      *Wait, let's look at the prompt again:* "Two proposals competing for the same fixed budget would be funded in the opposite order depending on which source of weights we use."
      *   If I choose Patient Weights: Treatment A (Chronic) might win over Treatment B (Acute).
      *   If I choose Public Weights: Treatment B might win over Treatment A.
      *   *Ethical Imperative:* We should not defund treatments for disabled people because the public thinks their lives aren't worth living.
      *   *Recommendation:* **Adopt Patient Weights for existing health states; use Public Weights only for preventative measures (avoiding the state).**
      *   *Actually, a unified rule is better:* **Adopt a Hybrid Model with a Presumption of Patient Weights.**
      *   *Let's make it decisive:* **Recommendation: Adopt Patient-Reported Utility Weights as the Standard.**
      *   *Reasoning:* Epistemic authority lies with the experiencer. Public weights contain ableist bias.
      *   *Objection:* The "Adaptation Paradox" (lowers QALY gains for cures).

  4.  **Drafting the Memo:**
      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose and the gravity of the decision.
      *   **Background:** Briefly summarize the divergence (adaptation vs. hypothetical bias).
      *   **Recommendation:** Clear and bold. Use patient weights.
      *   **Operational Rule:** How to implement this (data collection standards, exceptions).
      *   **The Strongest Objection:** The "Adaptation Paradox" / Opportunity Cost. If patients adapt, QALY gains shrink, and curative treatments look less cost-effective compared to preventing the condition in the first place. This could skew funding away from cures for chronic conditions.
      *   **Mitigation:** Acknowledge this but argue equity trumps pure efficiency in this specific metric.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Patient Weights Only" too radical?
      *   *Adjustment:* Let's nuance it. Use patient weights for *management* of chronic conditions, but acknowledge the tension. Actually, the prompt asks for *one* source or *how to combine*. A combination is often more palatable for a committee trying to reach consensus.
      *   *Pivot:* Let's recommend a **Tiered Approach**.
          *   Tier 1: Patient weights for chronic/managed conditions (to avoid ableism).
          *   Tier 2: Public weights for acute/preventative (to reflect societal fear of onset).
          *   *Wait, that's complicated.*
      *   *Let's stick to the Ethical High Ground:* The prompt implies a need for a decisive resolution to a cycling debate. The most defensible ethical position in modern HTA is moving away from public tariffs that penalize disability.
      *   *Decision:* I will recommend **Patient-Reported Weights as the Default**, with a specific **Equity Adjustment** mechanism if the gap is extreme.
      *   *Actually, let's keep it simpler for an "Operational Rule".* **Recommendation: Use Patient Weights.**
      *   *Why?* Because the alternative (Public Weights) violates the principle of non-discrimination.
      *   *Objection:* It reduces the calculated benefit of interventions (the QALY gain is smaller), potentially making cost-effective cures look expensive.

      *(Self-Correction)*: I need to make sure I address the "competing proposals" aspect. If I choose Patient Weights, I must accept that Condition A gets funded over Condition B, even if Condition B looks "better" under Public Weights. I need to own that trade-off.

      *Final Plan:*
      1.  **Recommendation:** Adopt Patient-Reported Outcome Measures (PROMs) as the primary source for utility weights.
      2.  **Rationale:** Epistemic privilege of lived experience; mitigation of ableist bias in hypothetical public valuation.
      3.  **Operational Rule:** Require validated PROMs for all submissions. If unavailable, use proxy patient data, not public tariffs.
      4.  **Strongest Objection:** The "Adaptation Paradox." It artificially deflates the value of *restoring* health, potentially biasing the system against curative therapies for conditions where patients have adapted well.

  6.  **Writing the Tone:**
      *   Formal, bureaucratic but ethical.
      *   Clear headings.
