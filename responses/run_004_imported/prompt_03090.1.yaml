      *   **Conflict:** The committee likes the ISOTYPE look (repeated icons), but the user knows Neurath's specific rules (no resizing, only concrete counts) and the limitations Neurath admitted (can't handle abstraction/hypothetics well). The data needed includes projections, uncertainty bands, and complex scenarios.
      *   **Task:** Outline the implications of Neurath's specific views on picture language for designing these exhibits. Focus on practical application, limitations, and where the approach "runs out of road."
      *   **Constraint:** No Neurath 101 refresher (user knows the history). Focus on *implications* and *application*.

  2.  **Deconstruct Neurath's ISOTYPE Principles (relevant to the task):**
      *   *Principle of Multiplicity:* Quantity is shown by repeating the unit, not resizing it. (10 fish = 10 small fish, not 1 big fish).
      *   *Concrete Empiricism:* ISOTYPE is for "facts of life," concrete social/economic data. It struggles with the abstract, the hypothetical, or the continuous.
      *   *Transformation:* The "transformer" (Neurath/Arntz) mediates between expert data and public understanding. Simplification is necessary but must not distort.
      *   *Unity of Science/Physicalism:* Language should be grounded in observable physical states.
      *   *Limitations:* Neurath explicitly acknowledged ISOTYPE couldn't easily show trends, future predictions, or statistical uncertainty without supplementary text or conventional graphs.

  3.  **Map Principles to the Aquarium Exhibit Context:**
      *   *Goal:* Communicate coral bleaching and fish stock decline.
      *   *Data Types:*
          *   Historical counts (Concrete -> Good for ISOTYPE).
          *   Current status (Concrete -> Good for ISOTYPE).
          *   Future projections/scenarios (Hypothetical -> Bad for ISOTYPE).
          *   Uncertainty ranges/Confidence intervals (Abstract/Statistical -> Bad for ISOTYPE).
          *   Causal mechanisms (Bleaching process -> Mixed, needs diagrammatic explanation).

  4.  **Develop Specific Implications/Recommendations:**

      *   *Implication 1: The "Resizing" Taboo.* Stick to the user's instinct. Resizing distorts perception (area vs. linear dimension). Repeating icons is honest counting.
      *   *Implication 2: The "Hypothetical" Wall.* Neurath would warn against using ISOTYPE for *future* scenarios (RCP 4.5 vs 8.5). It implies a factual certainty that doesn't exist.
      *   *Implication 3: Uncertainty.* ISOTYPE is binary (icon present or not). It doesn't do error bars. Need a hybrid approach.
      *   *Implication 4: The Role of the "Transformer".* The committee needs to act as Neurath's "transformer." Don't just dump data. Curate the narrative.
      *   *Implication 5: "Running out of Road".* Acknowledge where ISOTYPE fails. Use conventional graphs for the complex stuff, ISOTYPE for the emotional/concrete hook.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Respectful, peer-to-peer (acknowledging their expertise), philosophical but practical. Avoid condescension.
