          *   *Anti-Humean Leverage:* The fact that Hume needed a *second* definition (Psychological) to capture the "necessary connection" suggests Regularity alone feels empty. Anti-Humeans argue we need objective necessity, not just mental projection. The Counterfactual clause hints that mere conjunction isn't enough; *dependence* is required.
          *   *Synthesis:* Hume's definitions reveal a tension between *ontology* (what's out there) and *epistemology* (how we know/infer). Humeans prioritize ontology (mosaic). Anti-Humeans prioritize the modal force (which Hume relegated to the mind).
