      *   *Definition 2 (Counterfactual):* $\neg C \to \neg E$ (in the specific instance). Focus: Dependency. Note: Hume presents this as equivalent to Def 1 ("Or in other words").
      *   *Definition 3 (Psychological):* $C \to$ Idea of $E$ in the mind (via custom). Focus: Internal experience, inference. Note: Hume presents this as "another definition" based on a different aspect of experience.

  3.  **Evaluate Equivalence (Question 1):**
      *   *Regularity vs. Counterfactual:* Are constant conjunction and counterfactual dependence equivalent?
          *   *Problem:* Accidental regularities. (e.g., All gold spheres are less than 1 mile wide). Regularity holds. Counterfactual? If this gold sphere hadn't existed, would another gold sphere > 1 mile exist? Not necessarily. But more importantly, if *this* cause hadn't happened, would *this* effect not have happened? In a deterministic regularity view, yes. But what about pre-emption or overdetermination? Hume doesn't have the machinery for pre-emption, but logically, universal quantification ($\forall x (Cx \to Ex)$) does not strictly entail the specific counterfactual ($\neg C_a \square \to \neg E_a$) without assumptions about the rigidity of the laws or the uniqueness of the cause.
          *   *Hume's Intent:* Hume likely thinks they are equivalent because he lacks a robust semantics for counterfactuals. He treats the counterfactual as a rhetorical flourish to emphasize the *necessity* we *feel*, even if he denies objective necessity.
          *   *Separation Case:* Accidental generalizations. "All coins in my pocket are silver." Regularity holds. Counterfactual: "If this nickel weren't in my pocket, it wouldn't be silver?" False. So Regularity $\neq$ Counterfactual support.
      *   *Regularity vs. Psychological:*
          *   *Problem:* Unobserved regularities. A regularity can exist without anyone observing it (e.g., before humans existed). Def 1 allows this (objects conjoined). Def 3 requires a mind to make the transition.
          *   *Separation Case:* A world with no minds. Def 1: Causes exist. Def 3: No causes (no minds to convey thoughts).
          *   *Problem:* Observed irregularities. If I see a conjunction once, I might not form a custom. Def 1 might not be satisfied (needs "always"), but if I *believe* it's a cause, Def 3 is triggered by belief, not fact.
      *   *Counterfactual vs. Psychological:*
          *   One is about worldly dependency, the other about mental inference.
          *   *Separation Case:* Logical/Mental association without worldly link (superstition). I see a black cat, I think "bad luck." Def 3 satisfied (customary transition). Def 1 & 2 failed (no real conjunction/dependency).

  4.  **Connect to Contemporary Debate (Question 2):**
      *   *The Lewisian Humean Strategy:* Lewis takes Def 1 (Regularity) as the core. He systematizes it (Best System Analysis - BSA). He treats laws as summaries of particular facts. He *does* want to account for counterfactuals (that's a strength of BSA), but he derives them *from* the laws (which are derived from regularities).
