answer: |-
  Here are nine questions for the Q&A session, arranged to progressively constrain the speaker's ability to rely on the "that wasn't part of the true theory $T$" maneuver.

  **1. The Ontology of the Complete Theory**
  "To begin with a point of clarification: when you invite us to condition on the 'complete theory of chance' ($T$), does $T$ include the entire Humean mosaic, including future outcomes? If $T$ entails the future, it seems to render chance trivial; if it doesn't, it seems to lack the information needed to fix the chances. Which is it?"
  *   **Follow-up:** "If you say $T$ includes the future mosaic, doesn't that make $T$ unknowable to any temporally situated agent? And if it's unknowable, how can it function as a norm for our credences?"

  **2. The Boundary Between Evidence and Theory**
  "You've suggested that when evidence appears to undermine a chance hypothesis, we should view it as evidence that we have misidentified $T$, rather than evidence against the chance itself. But what is the independent criterion for deciding whether a piece of evidence belongs *inside* the description of $T$ or stands *outside* it as a challenge to $T$?"
  *   **Follow-up:** "If the only criterion is 'evidence that undermines is not in $T$,' aren't we simply defining the problem away rather than solving it?"

  **3. The Circularity Charge**
  "This leads directly to my next concern. Lewis's original 'admissibility' clause was criticized for being circular: admissible evidence was effectively defined as 'evidence that doesn't convey information about future outcomes in a way that undermines chance.' By individuating $T$ such that it cannot be undermined by the evidence we condition on, aren't you just reintroducing the admissibility dodge under the label of 'theory selection'?"
  *   **Follow-up:** "If you deny the circularity, can you state the individuation conditions for $T$ without implicitly referencing the very undermining relations you're trying to avoid?"

  **4. Future Frequencies as Evidence**
  "Let's press on the mechanics of this deference. Suppose I observe a frequency of heads that deviates significantly from the chance predicted by my current best theory $T_1$. Standard induction suggests I should lower my confidence in $T_1$. How exactly does your principle block this? How does deference to $T$ prevent a future frequency from counting as evidence against the present chance?"
  *   **Follow-up:** "If you reply that the true $T$ already 'knows' that frequency, how am I supposed to identify the true $T$ *before* I see the frequency, which is the very evidence I need to identify $T$?"

  **5. Epistemic Accessibility for Ordinary Agents**
  "Moving to the agent's perspective: The Principal Principle was originally motivated as a guide for rational belief. But if the 'New Principle' requires conditioning on the *true, complete* theory $T$, and $T$ includes the global supervenience base, no ordinary epistemic agent is ever in a position to apply it. Does your view thereby relocate the puzzle from 'how to believe' to 'how an ideal god would believe,' rendering it irrelevant to human epistemology?"
  *   **Follow-up:** "If you suggest we condition on our *best guess* at $T$ rather than the true $T$, doesn't that collapse your view back into standard Bayesianism where chance plays no unique normative role?"

  **6. Uncertainty Between Candidate Theories**
  "In practice, we are never certain which chance theory is true; we weigh candidates $T_1, T_2, \dots T_n$. If your principle only applies to the *true* $T$, how does it guide us when we are uncertain? Do we average the chances weighted by our credence in each theory?"
  *   **Follow-up:** "If we do weight them, aren't we effectively treating 'chance' as just another hypothesis about frequencies, rather than a unique ontological category that demands special deference?"

  **7. Self-Undermining Probabilities**
  "Lewis's specific technical worry was that a Humean chance function might assign a non-zero probability to a future sequence that would make that very function false (i.e., $Ch(T) < 1$). If your $T$ is the true theory, does it assign a probability of 1 to itself? If not, how can we defer to a theory that admits its own possible falsity?"
  *   **Follow-up:** "If you claim $Ch(T) = 1$, aren't you violating the Humean constraint that chances must be supported by the pattern of outcomes, since no finite pattern can guarantee a theory with certainty?"

  **8. Explanatory Power**
  "Setting aside the undermining problem, there is the issue of explanation. On a Humean view, chances supervene on outcomes. This means chances cannot explain the outcomes, since nothing can explain its own grounds. Given that we often invoke chance to *explain* frequencies (e.g., in statistical mechanics), doesn't your account strip objective chance of its primary explanatory utility?"
  *   **Follow-up:** "If you reply that chances summarize rather than explain, why should we grant them the normative authority to dictate our credences via the Principal Principle?"

  **9. The Propensity Alternative**
  "Finally, to step back to the big picture: The undermining problem arises specifically because you commit to Humean Supervenience. A propensity theorist, who takes chances to be physical properties that do *not* supervene on the total pattern of outcomes, faces no undermining problem at all. Given the epistemic gymnastics required to save Humeanism from this problem, what independent motivation do we have for preferring your picture over a propensity account that avoids the difficulty entirely?"
  *   **Follow-up:** "If your answer is that propensities are 'metaphysically spooky,' is epistemic incoherence really a lesser cost than metaphysical richness, or are we just choosing our mystery?"
