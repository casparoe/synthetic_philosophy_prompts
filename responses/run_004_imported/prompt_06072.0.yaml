answer: |-
  This is a fantastic connection to make. Your software engineering intuition is actually quite close to the mark, but as you suspect, Hobbes is making a metaphysical claim that goes deeper than semantic hygiene.

  To answer your two questions: Yes, the certainty of geometry for Hobbes relies on definitions, but specifically because those definitions are **generative** (we construct the objects) rather than **descriptive** (we observe the objects). And yes, his theory of reasoning as "reckoning" provided him with a principled, internal logic for rejecting Wallis's criticisms, even when he was objectively wrong.

  Here is an unpacking of that argument and how it fueled the dispute.

  ### 1. The Epistemic Work of Definitions: Construction vs. Discovery

  Your analogy of strong typing or API contracts captures the *necessary condition* of Hobbes's view (precision), but not the *sufficient condition* (certainty).

  For Hobbes, a strict nominalist, universal terms (like "Man" or "Tree") do not exist in nature; only individual bodies exist. Therefore, we cannot have "science" (certain knowledge of causes) about the natural world, because we did not create nature. We can only observe effects. As Hobbes writes elsewhere, we cannot know the world as God knows it, because we didn't make it.

  **The *Verum Factum* Principle**
  Geometry is the exception because of a principle later articulated by Vico as *verum ipsum factum* ("the true is the made"). For Hobbes, geometrical objects are not discovered in nature; they are **posited by human stipulation**.

  When Hobbes says in your passage that men "begin at settling the significations of their words," he doesn't mean they just agree on a dictionary definition. He means they agree on a **construction**.
  *   **Natural Philosophy:** We see a round object and try to define "circle." We will fail, because no physical object is a perfect circle. Our definition is always an approximation of an external reality we don't fully control.
  *   **Geometry:** We say, "Let a circle be a figure described by the motion of a point around a fixed center at a constant distance." We have defined the *cause* (the motion) that generates the *effect* (the figure).

  Because we stipulated the cause, we can have certain knowledge of the effect. The certainty of geometry comes from the fact that **the definitions are causal accounts of generation.**

  **Refining the Software Analogy**
  If "strong typing" is the API contract, Hobbes's view is closer to the difference between **writing code from scratch** vs. **reverse-engineering a legacy binary**.
  *   **Natural Science:** You are trying to understand a black-box system you didn't write. You can guess the API, but you can never be 100% sure you haven't missed an edge case or a hidden dependency.
  *   **Geometry:** You wrote the library. You defined the classes. You know exactly how the objects are instantiated because *you instantiated them*.

  So, the epistemic work is done not just by the clarity of the names, but by the fact that the names refer to objects whose entire ontology is contained within the definition we created.

  ### 2. Reasoning as Reckoning and the Wallis Dispute

  This brings us to why Hobbes was so unmovable against Wallis. You asked if his theory of reasoning gave him "principled (if ultimately wrong) grounds" for trusting his proofs. The answer is a definitive **yes**.

  **Reasoning is Computation**
  In *Leviathan* (and *De Corpore*), Hobbes defines reason not as a faculty of insight, but as a mechanical process: "REASON... is nothing but RECKONING (that is, Adding and Subtracting) of the Consequences of general names agreed upon for the marking and signifying of our thoughts."

  For Hobbes, a valid proof is a error-free calculation. If you define your terms (inputs) correctly and perform the logical operations (processing) correctly, the output *must* be true.

  **The Conflict with Wallis**
  John Wallis was a pioneer of modern algebraic symbolism and infinitesimal calculus (in its early stages). Hobbes despised algebra.
  *   **Hobbes's View:** Algebra was "a scab of symbols." It manipulated marks on a page without clear reference to physical quantity or geometric construction. To Hobbes, Wallis was "entangled in words" (or symbols) without knowing what they stood for.
  *   **Wallis's View:** Hobbes was stuck in ancient Greek synthetic geometry, refusing to use powerful new tools that could solve problems (like squaring the circle) that were impossible via straightedge and compass.

  **Why Hobbes Wouldn't Concede**
  When Wallis told Hobbes he was wrong, Hobbes didn't hear a mathematician correcting an error. He heard someone claiming the *sum was wrong* without pointing to a specific step in the *addition*.

  1.  **Methodological Certainty:** Hobbes believed he had followed the only valid scientific method: Define the generation of the figure -> Deduce the consequences via logical reckoning. Since he was confident in his definitions and his logic, the conclusion *had* to be right.
  2.  **The Burden of Proof:** In Hobbes's computational view of reason, if Wallis claimed an error, Wallis needed to isolate the specific "subtraction" or "addition" that was flawed. Wallis often argued from the *impossibility* of the result (based on emerging number theory), which Hobbes viewed as begging the question.
  3.  **Defense of Geometry:** Hobbes genuinely believed he was saving geometry from the corruption of algebra. In his mind, Wallis was introducing mysticism and obscure symbolism into the "only science... bestowed on mankind." Hobbes's stubbornness was, in part, a philosophical crusade to keep geometry grounded in material construction.

  **Jesseph's Insight**
  Douglas Jesseph argues that Hobbes wasn't merely suffering from Dunning-Kruger or senile stubbornness. Hobbes had a coherent philosophy of mathematics that prioritized **ontological clarity** over **computational power**.
  *   Wallis was willing to treat mathematical objects as abstract symbols to get the right answer.
  *   Hobbes insisted mathematical objects must be conceivable as physical motions to count as knowledge.

  Since a squared circle is impossible within the constraints of Euclidean construction (which Hobbes insisted upon), Hobbes essentially forced the math to fit his ontology. He convinced himself that because he could *conceive* of a construction that squared the circle, the impossibility proofs must be the ones relying on faulty definitions.

  ### Summary

  Your reading of the *Leviathan* passage is astute. Hobbes is indeed saying that truth is linguistic ordering, but the *certainty* of geometry arises because **we are the authors of the definitions.**

  This explains the Wallis affair: Hobbes remained unmovable because his epistemology told him that **clarity of conception guarantees truth.** If he could clearly conceive the steps to square the circle, it *must* be possible. If Wallis said it wasn't, Wallis was the one "entangled in words," using algebraic symbols that lacked clear referents in physical motion.

  He wasn't just being stubborn; he was being a consistent Hobbesian. He trusted his "reckoning" because he trusted his definitions, and he trusted his definitions because he believed they described things he had constructed in his own mind, rather than things he found in God's world. Unfortunately for him, the rules of geometry are not subject to human stipulation in the way he hoped.
