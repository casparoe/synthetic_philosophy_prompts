      *   **Haeceitism / Qualitative Supervenience:**
          *   *Description:* TWI often commits one to haecceitism (thisness distinct from qualitative properties) to distinguish worlds where only individual identities swap. Lewis rejects haecceitism. CT preserves qualitative supervenience.
          *   *Weight:* Major metaphysical commitment. Decides the broader framework of modal realism.
          *   *Tier:* A.

      *   **The Logic of Identity (Leibniz's Law):**
          *   *Description:* CT violates standard identity logic (counterpart relation is not identity). TWI preserves it.
          *   *Weight:* High theoretical cost for CT.
          *   *Tier:* A.

      *   **Ontological Parsimony (Quantitative vs. Qualitative):**
          *   *Description:* Lewis claims CT is more parsimonious regarding *properties* (no relativized properties), but less parsimonious regarding *entities* (many counterparts). TWI is the reverse.
          *   *Weight:* Important, but often cancels out or depends on prior metaphysical commitments.
          *   *Tier:* B.

      *   **De Se Modality (Self-locating belief):**
          *   *Description:* Lewis uses CT to explain *de se* attitudes nicely. TWI needs additional machinery.
          *   *Weight:* Strong point for CT, but specific to philosophy of mind/language.
          *   *Tier:* B.

      *   **Essentialism:**
          *   *Description:* TWI often requires robust essentialism to solve Chisholm's paradox. CT allows more flexibility.
          *   *Weight:* Dependent on one's view of essence.
          *   *Tier:* B.

      *   **Semantic Intuitions about "Could Have":**
          *   *Description:* Ordinary language suggests we talk about *ourselves* in other situations, not *others* like us.
          *   *Weight:* Related to Humphrey, but broader.
          *   *Tier:* B.

      *   **Actualism vs. Realism:**
          *   *Description:* TWI is compatible with Actualism (abstract worlds). CT is tied to Lewis's Modal Realism (concrete worlds).
          *   *Weight:* This is a confounding variable. One can have TWI with concrete worlds (though rare) or CT with abstract worlds (though Lewis didn't). But usually, the debate is entangled. Let's treat the *entanglement* as a consideration.
          *   *Tier:* C (Because the theories can technically be disentangled, though historically linked).

      *   **Temporal Analogy:**
