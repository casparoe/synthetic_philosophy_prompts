  ```json
  {
    "S": [...],
    "A": [...],
    "B": [...],
    "C": [...]
  }
  ```

  Let S denote considerations that deserve decisive or near-decisive weight in settling the dispute, and C denote considerations that, on reflection, deserve little weight.
