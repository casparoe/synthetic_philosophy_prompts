answer: |-
  This is an excellent passage to grapple with. You have correctly identified the surface-level argument: Hobbes distinguishes between sciences of things we make (geometry, politics) and sciences of things we find (physics/natural philosophy). However, to understand why this matters for your seminar—and specifically for the upcoming Wallis dispute—you need to dig into Hobbes's materialist metaphysics and his nominalist theory of language.

  Here is a breakdown of the underlying argument, the connection to his theory of reasoning, the substance of the political analogy, and the historical lineage of the "maker's knowledge" idea.

  ### 1. What does Hobbes mean by "Demonstrable"?
  In contemporary usage, "demonstrable" usually means "logically provable." For Hobbes, it means something more specific: **causal knowledge.**

  For Hobbes, to have *scientia* (scientific knowledge) of a thing is to know its **cause**. If you know *that* something is, but not *why* it is, you have only *prudentia* (prudence or experience), not science.
  *   **Natural Philosophy:** We observe a storm. We do not know the cause (God made nature, not us). We can hypothesize ("it *may* be caused by clashing clouds"), but we cannot demonstrate it with certainty because we lack access to the generative cause.
  *   **Geometry:** We draw a circle. Why does this figure exist? Because I moved the compass. I know the cause because **I am the cause.**

  **Why authorship confers certainty:**
  Certainty arises because the "cause" in these demonstrable arts is not a hidden mechanism in the world, but a **volitional act of definition and generation.**
  1.  **Control over First Principles:** In geometry, I do not discover the definition of a circle; I stipulate it. I decide that a circle is a figure generated by a point moving around a center at a fixed distance. Because I set the terms, I cannot be wrong about them.
  2.  **Necessity of Consequences:** Once I have stipulated the generation (the cause), the properties of the figure follow necessarily. I don't need to measure the circle to know its properties; I deduce them from the manner of its construction.

  So, when Hobbes says geometry is demonstrable "because the lines... are drawn by ourselves," he is making a metaphysical claim: **Truth is made, not found.** We have certainty only where we have agency.

  ### 2. Connection to Reasoning as Computation
  You asked how this connects to his view of reasoning as computation. This is the engine that makes the "maker's knowledge" thesis work.

  In *Leviathan* and *De Corpore*, Hobbes argues that reasoning is nothing more than **addition and subtraction of names.**
  *   **Definitions are the bedrock:** Computation requires fixed units. In arithmetic, you add '1' to '1'. In reasoning, you add definitions to definitions.
  *   **The Constructivist Link:** In natural philosophy, our definitions are shaky because they refer to external objects we don't fully understand (e.g., defining "gold" by its color or weight, which might be deceptive). In geometry and civil philosophy, **we create the definitions.**
  *   **The Computation:** When I prove a geometric theorem, I am computing the consequences of the definition I established when I constructed the figure. When I deduce the rights of a Sovereign, I am computing the consequences of the definition of the Commonwealth established in the Social Contract.

  Therefore, the "construction" mentioned in your passage is the physical or volitional act that secures the **definitions** required for the "computation" of reasoning. Without the ability to construct the object, we cannot fix the definitions, and without fixed definitions, reasoning is just opinion.

  ### 3. Is the Geometry-Politics Analogy Rhetorical or Substantive?
  This is a crucial question for your seminar. It is tempting to think Hobbes is just trying to lend the prestige of geometry to his politics (especially since his geometry was, as you noted, notoriously flawed). However, for Hobbes, the analogy is **structurally substantive.**

  Hobbes views the Commonwealth as an **artifact**, not a natural organism.
  *   **Natural Bodies:** Grow organically; their "cause" is obscure (God/Nature).
  *   **Artificial Bodies (Watches, Geometric Figures, States):** Are assembled by human art.

  **The Philosophical Work the Analogy Does:**
  1.  **Justification of Absolutism:** If the Commonwealth is a construction generated by a contract (the "motion" that creates it), then its powers are determined by the logic of that construction. Just as you cannot have a circle without a center, you cannot have a Commonwealth without a Sovereign power to hold it together. This isn't just a metaphor; it's a deductive claim based on the "generation" of the state.
  2.  **Defense against Empiricism:** Just as he tells the mathematicians (like Wallis) that they cannot understand geometry without understanding the *motion* that generates figures, he tells political theorists (like Aristotle or the Republicans) that they cannot understand the state without understanding the *covenant* that generates it.
  3.  **The Wallis Context:** In the *Six Lessons*, Hobbes is fighting professional mathematicians who viewed geometry as a realm of abstract, Platonic truths. Hobbes insists geometry is about **physical motion and material signs.** By linking this to politics, he reinforces his materialist worldview: *everything* knowable is knowable because it is generated by motion (either the motion of a hand drawing a line or the motion of men agreeing to a covenant).

  So, while it certainly serves a rhetorical purpose to defend his political theory, it is also the core of his method: the **Resolutive-Compositive Method.** We resolve the complex object (State/Circle) into its universal parts (Men/Points), understand the motion that generates them, and then compose them back together to demonstrate their properties.

  ### 4. Is this Distinctively Hobbesian? (The Vico Connection)
  Your professor is right to mention Vico. The principle *verum ipsum factum* ("the true is the made") is famously associated with Giambattista Vico (early 18th century), but Hobbes is a clear and vital precursor.

  *   **The Tradition:** This idea is a break from the Scholastic and Platonic traditions, which held that truth consists in the mind conforming to an external reality (*adequatio rei et intellectus*). Hobbes inverts this: reality (in the realm of science) conforms to the mind's construction.
  *   **Precursors:** Hobbes draws on:
      *   **Nominalism (Ockham):** The focus on names and human stipulation rather than universal Forms.
      *   **Galileo:** The idea that the book of nature is written in mathematics, but filtered through Hobbes's materialism (math is about the motion of bodies, not abstract numbers).
  *   **Hobbes's Innovation:** Hobbes applies this specifically to **Civil Philosophy.** Vico would later expand this to history and culture (we know history because we made it). Hobbes limits it to Geometry and Politics because those are the only two things humans *fully* construct.
  *   **Distinctiveness:** What makes Hobbes unique is the **aggressiveness** of the claim. He uses it to demarcate the boundaries of *philosophy* itself. For Hobbes, if you can't construct it, you can't have *science* of it (only probability). This is a much stricter limitation on human knowledge than Descartes or Spinoza would accept.

  ### Summary for Your Seminar
  When you discuss this in class, you might frame it this way:

  1.  **Epistemological Humility & Pride:** Hobbes is humble about physics (we can't know it truly) but proud of Geometry and Politics (we can know them perfectly).
  2.  **The Criterion of Causality:** "Demonstration" requires knowing the cause. We are the cause of geometric figures and Commonwealths; therefore, we can demonstrate truths about them.
  3.  **The Anti-Platonic Move:** Truth is not "out there" waiting to be discovered; it is generated by human definition and motion.
  4.  **Relevance to Wallis:** The dispute with Wallis isn't just about a math problem; it's about whether mathematics is about **abstract truths** (Wallis) or **constructed material motions** (Hobbes). Hobbes thinks Wallis is trying to do "natural philosophy" with math (seeking hidden truths) rather than "civil philosophy" style math (deducing consequences of our own constructions).

  This passage is essentially Hobbes's manifesto for a **constructivist epistemology.** He is arguing that human certainty is limited to the sphere of human agency.
