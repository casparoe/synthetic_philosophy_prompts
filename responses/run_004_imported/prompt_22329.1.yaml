      *   *Key Concept 1: Demonstrability.* For Hobbes, this isn't just logical validity. It's about *causal knowledge*. To know something scientifically (*scientia*) is to know its cause. If I make it, I know the cause (me/my will/my motion).
      *   *Key Concept 2: Reasoning as Computation.* Hobbes defines reasoning as addition and subtraction of names/concepts (see *Leviathan*, *De Corpore*). Definitions are the bedrock. If I define the terms (because I constructed the object), the consequences follow necessarily.
