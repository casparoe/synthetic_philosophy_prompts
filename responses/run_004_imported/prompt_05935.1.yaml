prompt: |-
  Next year I have the option of leaving my high school early to attend a selective residential math-and-science academy several states away. Everyone I know who has gone says it's a life-changing experience, but they also all say there's no way to explain what that change is actually like until you've lived through it yourself. My guidance counselor's advice is to picture my life five years from now under each option and choose whichever version of myself seems happier, but something about that approach feels off to me: the self doing the imagining right now and the self who would actually have to live with the outcome might not even want the same things anymore. Is my counselor's advice actually sound here, and if it isn't, how should I be thinking about a decision like this instead?
