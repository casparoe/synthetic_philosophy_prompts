answer: |-
  In Chapter VI of *Principia Ethica*, G. E. Moore seeks to define "The Ideal"—that which is good in itself. He identifies two primary categories of intrinsic goods: the aesthetic appreciation of beauty and personal affection (the love of persons). Moore argues that while both are great goods, personal affection is vastly superior. However, he introduces a complicating concession: the admiration of a person's mental qualities in isolation (divorced from their bodily expression) may be worth no more, or even less, than the appreciation of mere physical beauty. This creates an apparent tension: if the distinctively "personal" element (the mind) does not inherently command higher value than physical beauty, on what grounds does the love of persons rank higher?

  Moore resolves this tension through his **Principle of Organic Unities**. This principle holds that the intrinsic value of a whole is not identical to the sum of the values of its parts. By applying this principle, Moore demonstrates that the value of personal affection arises from the specific *combination* of cognition and emotion directed at a conscious being, rather than from the object or the emotion in isolation. Consequently, the concession regarding mental qualities does not undermine his ranking; rather, it reinforces the necessity of the organic whole. Moore's argument succeeds within his own framework, provided one accepts his intuition that the unity of loving a person generates a unique value that aesthetic appreciation cannot match.

  ### The Structure of the Two Goods

  To understand the tension, one must first understand Moore's structural analysis of these goods. For Moore, neither aesthetic appreciation nor personal affection is a simple sensation of pleasure. Both are complex states of consciousness that function as organic unities.

  1.  **Aesthetic Appreciation:** This consists of the cognition of a beautiful object (e.g., a landscape, a painting) combined with an appropriate emotion (admiration or enjoyment). The value lies not merely in the existence of the beautiful object, nor merely in the emotion, but in the *whole* state of appreciating the beauty.
  2.  **Personal Affection:** This consists of the cognition of a person (involving both their mental qualities and their bodily expression) combined with the emotion of love.

  Moore asserts that while both are organic unities, the unity found in personal affection is of a higher order. He claims that "personal affection is the greatest of all known and imaginable goods." However, he complicates this by noting that if we isolate the object of this affection—specifically, the mental qualities of the beloved—and admire them without the accompanying emotion of love or without the concrete bodily presence, the value drops precipitously. He suggests such abstract admiration might be equal to or less than the appreciation of physical beauty.

  ### The Role of the Principle of Organic Unities

  The Principle of Organic Unities is the mechanism Moore uses to navigate the relationship between the parts (object, emotion) and the whole (the state of consciousness). The principle states that $V(Whole) \neq V(Part A) + V(Part B)$. A part may have little or no value in isolation, yet be essential to a highly valuable whole.

  This principle addresses the apparent tension in the following way: The high value of personal affection is not derived simply from the superior value of the "mind" over "physical beauty." If it were, then admiring the mind alone should yield higher value than admiring a beautiful body. Moore admits this is not the case. Instead, the superior value is generated by the *relation* between the emotion and the object within the unity.

  In the case of personal affection, the emotion (love) interacts with the object (a person) to create a whole that is more valuable than the sum of its constituents. The "mind alone" concession actually supports the Organic Unity view. It demonstrates that you cannot extract the "mental quality" part, assign it a high independent value, and assume the whole inherits that value. The value emerges only when the mind is apprehended concretely (often through bodily expression) and is met with the specific emotion of love.

  Therefore, the tension is only apparent if one assumes an additive theory of value. If value were additive, the low value of "mind alone" would drag down the total. But under the Organic Unity principle, the *combination* of loving emotion and the cognition of a conscious being creates a synergistic value that exceeds the combination of aesthetic emotion and the cognition of a beautiful object. The "bodily expression" is not necessarily the source of value, but it is often the necessary vehicle for the cognition that allows the organic unity to form. Without the concrete apprehension of the person (mind and body together), the cognition is too abstract to sustain the high-value unity of "affection."

  ### Evaluating the Argument: Success or Undermining?

  Does Moore succeed in showing that personal affection ranks above aesthetic appreciation, or does the concession about mental qualities weaken his case?

  **The Argument for Success:**
  Moore's argument succeeds logically within the constraints of his system. The concession regarding mental qualities does not undermine the ranking because Moore is comparing *ideals* (complete organic unities), not isolated components.
  1.  **Complexity of Cognition:** Moore suggests that the cognition involved in personal affection is richer. In aesthetic appreciation, the object is unconscious. In personal affection, the object is another consciousness. Even if admiring that consciousness *abstractly* is low value, *loving* that consciousness involves a recognition of another subject. This reciprocity (even if only imagined or one-sided in the moment) adds a layer of complexity to the organic unity that physical beauty cannot provide.
  2.  **The Necessity of the Whole:** The concession highlights that the value is fragile and dependent on the unity. By admitting that "mind alone" is not highly valuable, Moore protects his theory from the objection that he is merely fetishizing "minds." He clarifies that the good is the *experience of loving a person*, not the *existence of a mind*. Thus, the ranking stands because the experience of love directed at a person creates a more valuable whole than the experience of admiration directed at a thing.

  **The Argument for Undermining:**
  However, a critic might argue that the concession exposes a vulnerability in Moore's intuitionism.
  1.  **Reliance on the Aesthetic:** If the admiration of mental qualities alone is worth no more than physical beauty, it implies that a significant portion of the value in personal affection is actually derived from the *aesthetic* element (the bodily expression, the visible manifestation of the person). If the "personal" element (the mind) contributes little independent value, the distinction between "love of persons" and "love of beautiful human forms" becomes blurred.
  2.  **The Risk of Subjectivity:** Moore relies heavily on the reader's intuition to agree that the "Love + Person" whole is greater than the "Admiration + Beauty" whole. If the "Person" part (specifically their mind) can be swapped for a "Beautiful Object" part without a massive loss in value (as the concession suggests), the intuitive gap between the two goods narrows. If the mental qualities are not the primary driver of the value, why is the affection so much more valuable? Moore attributes this to the emotion of love being superior to aesthetic admiration, but this risks circularity: affection is more valuable because the emotion is more valuable, but we know the emotion is more valuable because it creates a more valuable whole.

  ### Conclusion

  Ultimately, Moore's argument succeeds in maintaining the ranking of personal affection above aesthetic appreciation, provided one accepts the Principle of Organic Unities as the governing logic of value. The concession regarding mental qualities does not undermine the ranking; rather, it clarifies the locus of value. Moore is not arguing that minds are inherently more valuable objects than beautiful statues; he is arguing that the *state of consciousness* involving love for a person is a more valuable organic unity than the *state of consciousness* involving admiration for beauty.

  The concession serves to prevent a category error: it warns us against thinking the value lies in the abstract object (the mind) rather than the concrete experience (the affection). While the reliance on intuition leaves the argument open to subjective disagreement, logically, the Principle of Organic Unities allows Moore to consistently hold that the whole of personal affection is superior, even if its isolated parts do not appear to be. The value is in the union, not the components.
