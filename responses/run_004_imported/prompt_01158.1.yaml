      *   *Section 2: The "Having it Both Ways" Charge.* Address the asymmetry. Nāgārjuna negates *svabhāva*. The opponent defends *svabhāva*. The negation targets the *commitment*, not just the proposition.
      *   *Section 3: Dialetheism Implications.*
