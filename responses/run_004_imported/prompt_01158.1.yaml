          *   *Decision:* The "no thesis" defense actually undermines the strong dialetheist reading. If Nāgārjuna truly has *no thesis*, he is not asserting contradictions as *true*. He is dissolving the framework where truth-values apply. Therefore, Tillemans is closer, *but* with a caveat: it's not classical logic preserved, but logic suspended/therapeutically used.
