          *   My take: If "no thesis" works, the questions *are* ill-formed. Therefore, no contradiction is generated in reality. The contradiction is in the opponent's framework.
      *   *Conclusion:* Side with Tillemans (broadly), but emphasize that this doesn't save classical *metaphysics*. It saves logic from having to be paraconsistent by showing the contradictions are category errors.

