  "It is a promise kept. When I hold a guinea, I hold value that London and Amsterdam accept without question. Your paper is a promise written in water. Have you forgotten Law? Fifteen years gone, and Paris still smells of the ruin he printed."

  "Law failed because he chased shadows. He issued tickets against no real industry. I speak of credit backed by the labour of Irish hands. Is not a man's ability to weave wool or till soil worth more than a lump of metal dug from a Spanish mine?"

  "A man's labour is worthless if he cannot buy bread with it. If I pay my sailors in your notes, and the baker refuses them, mutiny follows. Trust is not decreed by pamphlets. It is earned by redemption."

  "But why must redemption be in specie? Why not in goods? If the bank issues notes against the value of improved land or manufactured cloth, the note represents real wealth. Silver is merely a counter to reckon with. If we lack counters, the game stops, though the players are eager."

  "The game stops because the counters are universal. Your local notes trap us. We import more than we export. Where is the silver to pay the balance? You cannot ship paper credit to the West Indies for sugar."

  "Then let us manufacture enough to balance the trade. But we cannot manufacture without credit to start the wheels. You demand the harvest before allowing the seed. If paper circulates faster than coin, it stimulates more industry. A sluggish stream grows foul. We need a flood to wash away this idleness."

  "You speak of local trade. But Ireland bleeds silver to England. Rent goes to absentee landlords in London. They will not take your paper. If we fill the country with notes they cannot spend, the exchange rate collapses. Then import prices soar, and the poor starve."

  "Then change the law. Make the paper legal tender for rents. Keep the wealth within the kingdom. Why should our industry be held hostage by the greed of absentees?"

  "Because capital is cowardly. If you force them to take paper, they will not send us goods. We shall have money and nothing to buy. Is that wealth? A flood drowns the prudent along with the idle. I have seen men hang themselves when the bubble burst. Faith proved a poor breakfast."

  "You mistake my meaning. I do not ask for faith without foundation. I ask that you value the foundation of human effort over the accident of mineral scarcity. If the people work, the wealth exists. The money is only the ticket to claim it."

  "Silver holds its tongue; paper lies. Inflation is a tax the poor pay to the rich. I have seen the prices rise while the wages stay still. When the storm comes, paper flies away. Silver remains."

  "Silver remains in the grave. But while we live, it is the motion that matters. Will you let Ireland starve for the sake of a heavy pocket?"

  "I would rather eat bread bought with silver than starve waiting for a miracle. You want to build a castle on a mist."

  "And you would rather live in a ruin than risk a new foundation."

  "Then pray we do not trample the country trying to name it."
