answer: |-
  This is a fantastic catch. You have identified one of the most delicate pivots in Locke's entire philosophical system. It looks like a contradiction on the surface (virtue = reason vs. education = shame/praise), but it is not sloppiness. It is a deliberate, pragmatic solution to a problem in developmental psychology.

  Here is how to untangle the tension, why it fits his empiricism, and what this "proxy motive" strategy is called.

  ### 1. Why this isn't a contradiction (The Developmental Argument)
  You asked if this is in tension with his project of "no innate ideas, everything from reason/experience." Actually, this strategy is **required** by his empiricism.

  If the mind is a *tabula rasa* (blank slate), a child does not possess "reason" at birth. Reason is a faculty that must be developed through time and experience.
  *   **The Problem:** You cannot teach a child to act on "the knowledge of a man's duty" (abstract rational principle) when they biologically lack the capacity for abstract rational principle.
  *   **The Solution:** You must use a motive they *do* understand. Children are social creatures who feel pleasure and pain. Praise (reputation) feels good; shame (loss of reputation) feels bad.

  Locke is not saying reputation *is* virtue. He is saying reputation is the **scaffolding** for virtue. It is the training wheel. If you remove the training wheels (reputation) before the bike can balance itself (reason), the child crashes (becomes vicious). If you leave the training wheels on forever, the child never learns to ride (becomes a conformist rather than a moral agent).

  So, the tension dissolves when you view it temporally.
  *   **Stage 1 (Childhood):** Motivation = External (Reputation/Shame).
  *   **Stage 2 (Adulthood):** Motivation = Internal (Reason/Duty).

  ### 2. What "Comes Nearest to It" is doing
  That phrase is doing heavy lifting. Locke defines true virtue as internal alignment with Divine/Natural Law. But since we can't see inside a child's soul, and the child can't see the "light of God," we need an external proxy that correlates with virtue.

  Locke argues that the "common consent" of reasonable people (reputation) is the best available **empirical data** for what is virtuous.
  *   It is not infallible (popular opinion can be wrong).
  *   But it is the closest *observable* stand-in for the *unobservable* truth of reason.

  By training the child to seek the approval of *wise* people (not just peers), the tutor is essentially curating the "common consent" so that it aligns with reason. The child learns to love the *shadow* of virtue (praise) until they are old enough to love the *substance* of virtue (reason).

  ### 3. Does this "proxy move" have a name?
  Yes, this strategy appears in several philosophical and educational frameworks.

  **A. Moral Habituation (Aristotelian)**
  The oldest name for this is **habituation** (*ethos*). Aristotle argued in the *Nicomachean Ethics* that we become just by doing just acts, even before we understand justice. We practice the behavior until it becomes second nature, then reason catches up. Locke is adapting this: use reputation to enforce the habit until reason can sustain it.

  **B. Heteronomy to Autonomy (Kantian)**
  While Kant came later, his terminology fits perfectly here.
  *   **Heteronomy:** Acting according to external laws or incentives (reputation, fear of punishment).
  *   **Autonomy:** Acting according to self-given law (reason, duty).
  Locke's educational plan is a roadmap for transitioning a moral agent from **heteronomy to autonomy**.

  **C. External to Internal Sanctions (Utilitarian)**
  John Stuart Mill later formalized this distinction.
  *   **External Sanctions:** Hope of favor/fear of displeasure from others (Locke's reputation).
  *   **Internal Sanctions:** Conscience, duty, self-approval.
  Locke is arguing for the cultivation of internal sanctions via the temporary use of external ones.

  **D. Scaffolding (Modern Pedagogy)**
  In modern educational theory (Vygotsky), this is called **scaffolding**. You provide support structures that allow the learner to perform a task they couldn't do alone, with the explicit intention of removing the support once competence is achieved.

  ### 4. Is there a risk? (The "Approval Addict" Problem)
  You might wonder: *If you train a kid to crave praise, won't they just become an approval addict rather than a virtuous person?*

  Locke anticipates this. It is why he is so specific about **who** gives the reputation.
  *   He warns against letting children be motivated by the praise of *other children* (who are irrational).
  *   They must be motivated by the esteem of their **tutor and parents** (who represent reason).

  The goal is to transfer the desire for approval from the specific people (parents) to the abstract principle those people represent (Reason/God). If the education works, the adult no longer needs the applause; they have internalized the voice of the tutor as their own conscience.

  ### Summary
  Locke isn't being sloppy; he is being a **developmental empiricist**.
  *   **The Tension:** Resolved by recognizing that reason is a destination, not a starting point.
  *   **The Phrase:** "Comes nearest to it" identifies reputation as the best empirical proxy for abstract truth.
  *   **The Name:** In moral philosophy, this is the transition from **Heteronomy to Autonomy**, or simply **Moral Habituation**.

  It is a "noble lie" of sorts, but one designed to make itself obsolete. The moment the child can reason, the reputation motive is supposed to be swapped for the reason motive. (Whether Locke is naive about how hard that swap is... is a debate for another day.)
