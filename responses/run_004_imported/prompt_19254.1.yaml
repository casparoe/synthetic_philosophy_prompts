      *   *Key Distinction:* He would shift the debate from "Is socialism possible?" to "Under what linguistic/empirical conditions does a planning framework yield better predictive/utility outcomes than a market framework?"
      *   *Neurath Connection:* He would lean towards Neurath's physicalism. If AI allows for better "in-kind" calculation, that strengthens the physicalist framework.
      *   *Verificationism:* He would be skeptical of *grand claims* without operational definitions of "efficiency" or "welfare."

