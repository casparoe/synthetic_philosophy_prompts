answer: |-
  The workshop smelled of ozone and old paper. Elian stood over the table, where a city made of light and dust simmered in a glass bowl. He wasn't building the bricks or the laws of physics; those were easy. The hard part was the people. Specifically, the choices they hadn't made yet.

  Elian was an Architect. He didn't force hands. That was crude, and it broke the integrity of the simulation. Instead, he relied on the Archive. It was a vast library of conditionals, statements about what any possible person *would* freely do in any possible situation. *If Person A is hungry and finds bread, they will eat.* *If Person B is threatened and holds a knife, they will strike.*

  These weren't predictions. They were truths. Or so the Archive claimed.

  Elian needed a perfect run. He needed the city in the bowl to survive the coming winter without collapsing into tyranny. The linchpin was a woman named Kaelen. In the current configuration, she would discover her brother's betrayal tomorrow. For the city to survive, Kaelen had to choose mercy. If she chose vengeance, the brother's faction would retaliate, and the cascade of violence would burn the grid down.

  Elian flipped through the translucent pages of the Archive. He found Kaelen's file. He scrolled through the infinite variations of her life.

  *Scenario 4,902: Kaelen finds the letter in the rain. She burns it. (Mercy)*
  *Scenario 4,903: Kaelen finds the letter in the sun. She exposes him. (Justice)*
  *Scenario 4,904: Kaelen finds the letter while armed. She kills him. (Vengeance)*

  He needed Scenario 4,902. It was the only thread that didn't end in ash. Elian adjusted the environment in the bowl. He dimmed the sky until it greyed. He calibrated the temperature to chill. He placed the letter on the wet cobblestones where she would walk. He stepped back. He had set the exact conditions that the Archive said necessitated mercy. Not by force, but by freedom. The Archive said she *would* freely choose to burn the letter.

  He watched Kaelen walk into the square. She looked tired. She saw the letter. She picked it up.

  Elian held his breath. He knew what was true. The Archive said it was true. But as Kaelen's fingers tightened on the paper, a cold doubt prickled down Elian's spine. It was the Grounding Problem, the flaw he couldn't patch.

  *Why* was it true?

  If Kaelen was truly free, nothing in the rain, nothing in the letter, and nothing in her past psychology *made* her choose mercy. If those things determined her, she wasn't free. But if nothing determined her, then what made the statement "She will choose mercy" true *before* she chose? There was no fact of the matter. The truth was floating. It was a label stuck on a void.

  Kaelen looked up. She wasn't looking at the letter anymore; she was looking at the sky, as if she felt the weight of the Archive pressing down on her neck.

  Elian reached for the controls to tweak the variable. Maybe more rain? Maybe a different location? He scrolled frantically through her file again. He looked for a version of Kaelen who was stable.

  He stopped. He saw the pattern hidden in the millions of scenarios.

  In Scenario 10,400, she starved rather than steal. In Scenario 22,105, she lied to save a friend. In Scenario 99,001, she sacrificed herself for the city. But in every single world where she existed, there was at least one moment where the thread snapped. Some worlds it was mercy she withheld. Others, it was courage. Some worlds she burned the letter; others she used it to light a cigarette while the city burned around her.

  She was brittle. There was no possible configuration of circumstances where Kaelen remained wholly intact. She possessed what Elian called "transworld fragility." No matter how he arranged the furniture of the universe, there was no room where she wouldn't eventually break something, freely, on her own.

  He looked back at the bowl. Kaelen hadn't burned the letter. She hadn't drawn a weapon either. She was just standing there, holding the paper, shivering.

  The Archive said she would burn it. The truth of that statement was supposed to be independent of Elian's will. It was supposed to be a constraint he could work with. But staring at her, Elian realized the truth was hollow. It was a guess masquerading as data. There was nothing *under* the truth to hold it up. It was a bridge built on fog.

  Kaelen crumpled the letter. She didn't burn it. She threw it into a puddle. It dissolved into pulp.

  It wasn't mercy. It wasn't vengeance. It was indifference.

  The Archive hadn't listed this option. Not because it was impossible, but because the specific conditional *If Kaelen finds the letter in the rain, she will feel indifference* had no truth value until this exact second. And now that it had a value, it was too late.

  The ripple effects hit the city instantly. The brother, seeing the letter ignored, assumed impunity. He moved to seize power. The grid flickered. The light in the bowl turned a sickly amber.

  Elian slammed his hand on the console, but he knew it was useless. He couldn't rewind. He couldn't force her. He could only select from the menu of "woulds," and the menu was full of lies.

  He looked at the other files stacked on his desk. Thousands of potential people waiting to be instantiated. He wondered how many of them were like Kaelen. How many were souls that could not be actualized without ruin? Maybe it wasn't just her. Maybe every possible person carried a seed of chaos that no amount of circumstance could neutralize. Maybe freedom meant that the truth of what you would do was always ungrounded, always waiting to be written by the act itself, rendering any plan based on prior knowledge a fantasy.

  The city in the bowl began to darken. Fires sparked in the lower districts. Elian watched the simulation degrade, not because he had lost control, but because he realized he never had it. The Archive closed itself with a soft click. The silence in the workshop was heavy, filled with the weight of truths that hadn't existed until they were broken.

  Elian reached for the next file. He didn't know why he bothered. He opened it anyway.
