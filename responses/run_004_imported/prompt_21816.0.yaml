answer: |-
  This is a classic dispute in social ontology, and it cuts to the heart of the distinction between *conventions* (coordination problems) and *norms* (Prisoner's Dilemma-type problems). Since you are working in this field, I will avoid rehashing the basic definitions and focus on the structural fidelity to Lewis's argument in *Convention* (1969) and the subsequent literature (Ullmann-Margalit, Sugden, Marmor).

  Here is the adjudication of the five moves, followed by a verdict and a discussion of overlooked considerations.

  ### Move-by-Move Adjudication

  #### Move 1: Nadia (The Standard Case)
  *   **Claim:** Queueing fits the triad: Arbitrariness, Expectation-Dependence, and Coordination Equilibrium.
  *   **Accuracy to Lewis:** **High.** This is a faithful summary of Lewis's sufficient conditions (pp. 76–78). Lewis emphasizes that a convention must be an arbitrary regularity sustained by a system of expectations where everyone prefers to conform *given* that others conform. Nadia correctly identifies that the alternative (lottery, need) is possible, satisfying the arbitrariness condition.
  *   **Dialectical Success:** **Strong.** It establishes the *prima facie* case. Any challenger (Elias) must now show why queueing fails one of the specific technical conditions, not just intuitively feels different.

  #### Move 2: Elias (The Equilibrium Challenge)
  *   **Claim:** Queueing is not a coordination equilibrium because cutting is a dominant strategy (better off regardless of others). Therefore, sanctions are required, implying it is not a pure convention.
  *   **Accuracy to Lewis:** **Mixed.** Elias correctly identifies the critical condition: Lewisian conventions require a *coordination equilibrium* (CE), not a Prisoner's Dilemma (PD) equilibrium. In a CE, I prefer to conform *if* you conform. In a PD, I prefer to defect *even if* you conform.
      *   *However*, Elias assumes cutting is *always* better. This depends on the payoff matrix. If the social cost of cutting (shame, confrontation) + risk of system collapse > time saved, then queuing *is* a CE. Elias assumes the "time saved" payoff dominates the "social cost" payoff.
  *   **Dialectical Success:** **Very Strong.** This is the strongest objection available. If queueing is structurally a PD (where defection is individually rational regardless of group behavior), it cannot be a Lewisian convention *stricto sensu*. Lewis is explicit that conventions solve coordination problems, not free-rider problems.

  #### Move 3: Nadia (The Mixed-Motives Defense)
  *   **Claim:** Lewis allows private incentives to deviate (meeting places, lying). Coincidence of interest need only *predominate*.
  *   **Accuracy to Lewis:** **Nuanced/Problematic.**
      *   *Meeting Place:* Accurate. Lewis admits agents may prefer *different* equilibria (Battle of the Sexes), provided they prefer *any* equilibrium to none.
      *   *Lying:* **Inaccurate.** Lewis treats truthfulness as a convention *of language use*, but the convention of *meaning* relies on the expectation of truthfulness. If lying becomes dominant, the convention of meaning collapses. Nadia is conflating the stability of the convention with the moral constraints on its use.
      *   *Predominance:* Lewis does not explicitly use the word "predominate" to excuse defection incentives. He requires that conditional preferences hold.
  *   **Dialectical Success:** **Weak.** She correctly notes that perfect harmony isn't required, but she fails to address Elias's structural point: preferring a *different* equilibrium (Nadia's meeting place example) is not the same as preferring to *defect* from the current equilibrium (Elias's queue-jumping).

  #### Move 4: Elias (The Structural Distinction)
  *   **Claim:** There is a difference between incentives over *which* equilibrium (coordination) and incentives to *defect* from the equilibrium (norms). Cites Ullmann-Margalit.
  *   **Accuracy to Lewis:** **High.** This aligns with the distinction Edna Ullmann-Margalit draws in *The Emergence of Norms* (1977). She distinguishes "summary rules" (conventions, where conformity is self-enforcing) from "norms" (where conformity requires sanctions because defection is individually rational). Elias correctly identifies that if sanctions are *constitutive* of the rationality of queuing, it looks more like a norm.
  *   **Dialectical Success:** **Decisive (on this point).** He successfully distinguishes Nadia's counter-examples. In the meeting place case, once we agree on "Grand Central," I have no incentive to go to "Central Park." In queueing, even if we agree to queue, I have an incentive to cut. This targets Condition 3 of Lewis's definition directly.

  #### Move 5: Nadia (The Endogenous Sanctions Reply)
  *   **Claim:** Sanctions can stabilize a fragile coordination equilibrium. Arbitrariness and Common Knowledge remain. Don't fetishize the label.
  *   **Accuracy to Lewis:** **Debatable but Defensible.** Lewis acknowledges that conventions can generate "normative" pressure over time. If the "glares and confrontation" are viewed as *endogenous* costs within the payoff matrix (i.e., I don't cut because I dislike confrontation, not because a police officer arrests me), then the preference to conform *given others conform* is restored. The game remains a Coordination Game, just one with high penalties for deviation built into the social utility function.
  *   **Dialectical Success:** **Moderate/Recovering.** She saves the "convention" classification by arguing that the sanctions are part of the equilibrium conditions, not external impositions. However, she concedes Elias's point that without those sanctions, the equilibrium might be fragile.

  ---

  ### Final Verdict: Is Queueing a Lewisian Convention?

  **Verdict:** **Yes, but conditionally.**

  Queueing satisfies Lewis's definition **if and only if** the social disutility of cutting (shame, confrontation, risk of violence) is internalized by the agents such that conforming is their *preferred* strategy given that others conform.

  *   **Why Nadia is ultimately right:** In most ordinary contexts (coffee shops, bus stops), the "sanctions" Elias mentions are not external enforcement mechanisms (like a security guard) but social costs inherent to the interaction. If I cut, I incur a cost (embarrassment, conflict). If that cost > the benefit of skipping the line, then "Everyone Queues" *is* a coordination equilibrium. The arbitrariness condition is met (FIFO is not the only way), and the common knowledge condition is met.
  *   **Where Elias has a point:** If the social sanctions are too weak (e.g., an anonymous online queue, or a chaotic emergency situation), queueing collapses into a Prisoner's Dilemma. In those specific instances, it ceases to be a Lewisian convention and becomes a norm requiring external enforcement.

  **The Synthesis:** Queueing is a **convention that has generated normative pressure.** Lewis allows for conventions to create preferences (via precedent and expectation). The "glares" are the mechanism by which the community enforces the conditional preference required by Lewis's Condition 3. Therefore, it remains a convention, but one that sits on the border of Ullmann-Margalit's norms.

  ---

  ### Overlooked Considerations

  Since you are working in social ontology, here are three nuances Nadia and Elias likely missed that you might leverage in your own work:

  **1. The "Common Knowledge" Threshold**
  Lewis requires common knowledge of the preferences and expectations. In queueing, do agents actually have CK that others prefer to queue? Or do they merely have a *belief* that others will queue, coupled with a *fear* that others *want* to cut?
  *   *Implication:* If I believe you only queue because you fear *me* cutting, and you believe I only queue because I fear *you* cutting, we may lack the CK of *cooperative intent* that Lewis sometimes implies (though his definition is behaviorist). This leans toward Elias's "norm" view.

  **2. The Evolutionary Turn (Sugden & Skyrms)**
  Both Nadia and Elias are treating Lewis's definition as static. Robert Sugden (*The Economics of Rights, Co-operation and Welfare*) and Brian Skyrms (*Evolution of the Social Contract*) argue that conventions evolve from repeated play.
  *   *Implication:* A practice can *start* as a fragile coordination equilibrium (Nadia's view) and, through evolutionary pressure, harden into a norm with internalized sanctions (Elias's view). Asking "Is it a convention?" might be the wrong question; asking "At what stage of crystallization is it?" is more productive. Queueing is likely a convention that has evolved normative force.

  **3. The Content of the "Arbitrariness" Condition**
  Nadia claims FIFO is arbitrary. But is it? In some contexts (triage, priority boarding), FIFO is *not* arbitrary; it is subordinated to a higher-order norm (need or status).
  *   *Implication:* Lewis requires the alternative regularity ($R'$) to be *possible*. If a population physically cannot coordinate on a lottery (lack of technology) or morally cannot coordinate on need (lack of information), FIFO might be the *only* equilibrium, failing the arbitrariness condition. Queueing is a convention only in contexts where other ordering principles are viable alternatives.

  ### Recommendation for Your Work
  If you are writing on this, I suggest focusing on **Move 5**. The relationship between *conventions* (Lewis) and *norms* (Ullmann-Margalit/Bicchieri) is the live wire in contemporary social ontology. Queueing is the perfect test case because it demonstrates how a coordination equilibrium can generate its own enforcement mechanisms, blurring the line between "I conform because it helps us" and "I conform because I'll be punished."

  Lewis's framework is robust enough to handle this if you treat social sanctions as part of the utility function, but Elias is right to warn that if the sanctions become the *primary* motivator, the "coordination" label becomes less explanatory than the "norm" label.
