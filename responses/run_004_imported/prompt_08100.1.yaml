answer: |-
  This is one of those moments where the formalism obscures the philosophy. The d'Aspremont-Gevers proofs are elegant, but they tell you *that* it works, not *why* it feels right.

  Here is the gut-level intuition. It comes down to asking: **What specific question is each ethical rule trying to answer, and what specific tool does it need to answer it?**

  ### 1. Utilitarianism needs a "Common Currency" (CUC)

  **The Ethical Question:** "Is the total gain to society worth the total loss?"
  Utilitarianism is fundamentally about **trade-offs**. It asks: *If I take 5 units of welfare from Alice, how many units must I give Bob to make this a wash?*

  **The Informational Need:**
  To answer that, "5 units" for Alice must mean the same thing as "5 units" for Bob.
  *   **Why Cardinal?** You need to measure the *size* of the gain/loss. Ordinal info only tells you "Alice is happier," not "Alice is *5 units* happier." You can't sum ranks (1st place + 2nd place = ???). You need numbers to add.
  *   **Why Unit Comparability?** You need a common ruler. If Alice's "1 unit" is a whisper and Bob's "1 unit" is a scream, you can't sum them. You need to know that a util "inch" is the same length for everyone.
  *   **Why NOT Level Comparability?** This is the tricky part. Utilitarianism (in this specific CUC context) is often interpreted as caring about *changes* in welfare or assuming that the "zero point" of happiness is arbitrary and personal.
      *   Imagine Alice measures happiness on a scale of 0–100, and Bob measures it on -50 to +50.
      *   If we care about the *sum of levels*, this breaks (because shifting Bob's zero changes the total sum).
      *   But if we care about the *sum of gains* (or if we accept that the only meaningful comparison is the *ratio* of gains), the zero point doesn't matter. CUC says: "We agree on the size of the step, but we don't agree on where the ladder starts."
      *   Utilitarianism works here because it aggregates **marginal contributions**. As long as the *marginal* unit is comparable, you can sum the changes.

  **The Gut Check:**
  Think of Utilitarianism like a **bank account**. To calculate the total wealth of a group, everyone's money must be in the same currency (Unit Comparability). It doesn't matter if Alice started with \$0 and Bob started with \$1,000,000 (Level Non-comparability/Arbitrary baselines); what matters for the *transaction* is that a \$10 bill is worth \$10 for both of them.

  ### 2. Rawlsian Maximin needs a "Common Floor" (OLC)

  **The Ethical Question:** "Who is drowning?"
  Rawlsianism is fundamentally about **priority**. It asks: *Which person is in the worst position?*

  **The Informational Need:**
  To answer that, you need to be able to point at Alice and say, "She is lower than Bob."
  *   **Why Level Comparability?** This is non-negotiable. If you cannot compare absolute levels, you cannot identify the "worst-off." Under CUC (where levels aren't comparable), Alice might have a utility of -1,000,000 and Bob might have +5, but because their zero-points are arbitrary, you don't know who is actually "worse off" in a human sense. You need a shared baseline to know who is at the bottom of the ladder.
  *   **Why Ordinal?** Once you know Alice is at the bottom, do you care *how far* below Bob she is? No. Rawls doesn't say "Maximize the gap." He says "Raise the floor." Whether Alice is 1 unit below Bob or 1,000 units below Bob, she is still the priority. The *distance* (cardinality) is irrelevant; only the *ranking of levels* matters.
  *   **Why NOT Unit Comparability?** Rawls explicitly rejects the idea that we can trade off the poor's suffering for the rich's gain. If you have cardinal units, you might be tempted to say, "Take 100 units from the poor guy to give 1,000 units to the rich guy." Rawls says: "No. The units don't matter. The position matters."

  **The Gut Check:**
  Think of Rawlsianism like a **lifeboat**. You need to know who is in the water (Level Comparability). It doesn't matter if Person A is 2 feet underwater and Person B is 10 feet underwater (Ordinal is enough); they both need saving before the people on the boat. Furthermore, you don't need a ruler to measure the water depth (No Cardinality needed); you just need to see whose head is below the surface.

  ---

  ### 3. Why the Reverse Pairing Fails (The "Mismatch" Test)

  To really lock this in, look at why swapping them breaks the ethical rules.

  **Scenario A: Rawls + CUC (Cardinal Units, No Levels)**
  *   **The Setup:** I can compare gains/losses perfectly, but I can't compare absolute standing.
  *   **The Failure:** I cannot find the worst-off person.
      *   Alice says: "I'm at a 5."
      *   Bob says: "I'm at a 100."
      *   But under CUC, Alice's "0" might be "Heaven" and Bob's "0" might be "Hell." I can't tell who is worse off. I can only tell if Alice gained more than Bob.
      *   **Result:** Maximin is **impossible**. You can't maximize the minimum if you can't identify the minimum.

  **Scenario B: Utilitarianism + OLC (Ordinal Levels, No Units)**
  *   **The Setup:** I know who is happier than whom, but I don't know the size of the difference.
  *   **The Failure:** I cannot calculate trade-offs.
      *   Policy X gives Alice a huge boost (she goes from 1st to 1st, but way happier) and Bob a tiny loss (2nd to 2nd, slightly less happy).
      *   Policy Y gives Alice a tiny boost and Bob a huge loss.
      *   Under OLC, both policies look identical: "Alice is still #1, Bob is still #2." The *magnitude* of the welfare change is invisible.
      *   **Result:** Utilitarianism is **blind**. You can't sum what you can't measure. It's like trying to add "First Place" + "Second Place."

  ### Summary Table

  | Feature | **Utilitarianism** | **Rawlsian Maximin** |
  | :--- | :--- | :--- |
  | **Core Operation** | **Summing** (Aggregation) | **Ranking** (Identification) |
  | **What matters?** | The *size* of the change. | The *position* in the hierarchy. |
  | **Needs Common Unit?** | **Yes.** (To add apples to apples). | **No.** (A loss is a loss). |
  | **Needs Common Level?** | **No.** (Baselines are arbitrary). | **Yes.** (Must find the bottom). |
  | **Info Basis** | **Cardinal Unit (CUC)** | **Ordinal Level (OLC)** |

  ### The One-Sentence Punchline
  **Utilitarianism** requires a common **ruler** to weigh trade-offs (CUC), while **Rawlsianism** requires a common **horizon** to find the bottom (OLC).
