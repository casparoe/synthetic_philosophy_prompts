      *   **The "Constitution" Analogy:** A constitution binds future legislatures. But in law/ethics, a current competent person usually overrides a past person. If the "current legislature" (her current mind) is deemed competent, the "constitution" (PAD) doesn't bind them. If the "current legislature" is corrupt/incapacitated (by mania), the "constitution" holds.

  3.  **Determine the Recommendation:**
