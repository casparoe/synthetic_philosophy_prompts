      *   Check constraints: Short memo? Yes. One concrete course? Yes. Address analogy? Yes. Address current wishes? Yes.
      *   Ensure the distinction between "adjudicated incapacitated" (legal) and "clinically incapacitated" (medical) is handled carefully. The statute says "adjudicated," which usually means a court. This is a tight spot. *Correction:* Many state statutes allow physicians to determine incapacity for treatment purposes without a court order, unless there's a specific challenge. The prompt says "unless she has already been adjudicated incapacitated." This implies a court finding. This makes treating risky.
