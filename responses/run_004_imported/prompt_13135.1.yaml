      *   *Wait, check the legal constraint:* The prompt says the statute lets her revoke *unless* adjudicated incapacitated. This is the crux. If we treat, we are potentially violating the statute *unless* we determine she lacks capacity *now*.
      *   *Revised Recommendation:* The recommendation must be to **proceed with treatment per the PAD** based on a clinical determination of *current* incapacity (specifically regarding appreciation/reasoning), despite her verbal revocation. The Proxy (mother) should authorize treatment based on the PAD. The timeline must be immediate for safety, with legal review within 24-48 hours.
      *   *Why?* Because "capacity" is decision-specific. She may understand facts but lack appreciation due to grandiosity. The Ulysses clause provides evidence that *this specific refusal* is predictable pathology.

  4.  **Drafting - Section by Section:**

