      *   *Ethical Recommendation:* The Ethics Committee can't override the law. But it can recommend the *ethical* path while flagging the legal risk. The ethical path is to honor the Ulysses contract *if* we deem her currently incapacitated clinically. The memo should recommend treating based on *clinical* incapacity (which justifies the Proxy stepping in), while Legal Counsel reviews the statutory "adjudication" requirement immediately.
      *   *Wait, looking closer at the prompt:* "State's directive statute... lets a patient revoke at any time unless she has already been adjudicated incapacitated." This is a specific constraint. If she revokes, and isn't adjudicated, the PAD is void *legally*.
      *   *Ethical Workaround:* The committee recommends honoring the PAD *on ethical grounds* while Legal seeks an emergency court order (adjudication) to align law with ethics. OR, we treat under emergency hold statutes (danger to self/others) rather than the PAD statute.
      *   *Best Path:* Recommend treatment under **Emergency Detention/Safety grounds** immediately (bypassing the PAD revocation issue temporarily) while the Proxy and Legal work to validate the PAD or secure emergency adjudication.
