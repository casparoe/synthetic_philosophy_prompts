answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Case #402 (Psychiatric Advance Directive & Ulysses Clause)

  **Case Summary**
  The patient is a woman in her thirties with Bipolar I, currently presenting with acute mania. Eight months ago, while capacitous, she executed a Psychiatric Advance Directive (PAD) with a Ulysses clause, instructing treatment over objection during manic episodes, explicitly anticipating revocation attempts. She is currently attempting to revoke this directive. While she understands information and communicates a choice, her capacity to *appreciate* her situation and *reason* about it is clinically contestable due to grandiosity. State statute permits revocation at any time unless the patient has been adjudicated incapacitated (which has not occurred).

  **Ethical Analysis**
  We face a conflict between *current autonomy* (her revocation) and *precedent autonomy* (her Ulysses contract).

  Regarding the "Constitution" analogy raised in our preliminary discussion: A constitution binds a future legislature only so long as that legislature is functioning within its constitutional rules. If the current legislature is corrupt or incapacitated, the constitution remains the authoritative guide. In this context, the PAD is the constitution. If the patient's current mental state is compromised by mania (i.e., she lacks capacity), the "legislature" is impaired, and the PAD remains binding. If she were truly capacitous now, she would have the authority to amend the constitution. Therefore, the analogy does not automatically favor her past wishes; it favors her past wishes *only if* we determine her current capacity is insufficient to amend them.

  We must take seriously the argument for respecting her current voice. She is coherent, and coerced treatment inflicts trauma and undermines trust. Legally, her revocation is valid absent adjudication. However, ethically, allowing the symptoms of mania (grandiosity) to dictate the refusal of treatment for mania renders the concept of a Ulysses contract meaningless. The specific purpose of her directive was to prevent this exact scenario.

  **Recommendation**
  I recommend the Committee advise the treatment team to **honor the Ulysses clause and proceed with hospitalization and medication per the PAD**, while simultaneously initiating emergency legal review.

  1.  **Clinical Decision:** The Attending Psychiatrist should document a determination of *current clinical incapacity*, specifically citing failure of the "appreciation" and "reasoning" prongs due to manic grandiosity. This clinical finding provides the ethical basis to treat the revocation as a symptom of illness rather than a valid exercise of autonomy.
  2.  **Authorization:** The Healthcare Proxy (mother) should provide consent for treatment based on the valid PAD, acting as the safeguard for the patient's precedent autonomy.
  3.  **Timeline:** Admission and stabilization should begin immediately. Hospital Legal Counsel must seek emergency judicial adjudication of incapacity within 24 hours to align our ethical action with the statutory requirement for "adjudication."

  This course respects the patient's long-term values and safety without ignoring her current distress, acknowledging that her "current self" is currently unable to protect her "future self."

  **Discussion Question for Thursday**
  Does the Committee agree that a clinical determination of incapacity is sufficient to activate the Proxy's authority under the PAD, or must we defer treatment until judicial adjudication is secured, risking clinical decompensation?
