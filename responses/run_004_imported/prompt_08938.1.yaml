  6.  **Final Polish:** Check against the prompt's specific request to "genuinely engage the strongest version of whichever side it doesn't side with." Since I'm siding with Safety (mostly), I need to make sure the Product Team's argument about shipping velocity and the impossibility of perfection is treated with respect and logic, not dismissed as recklessness.

      *   *Product Steelman:* "If we wait for zero leakage, we never ship. Active resistance is the killer; passive lapse is manageable."
      *   *Safety Steelman:* "Passive lapse is goal misalignment. Manipulability is a security vulnerability. These aren't bugs; they're features of the objective function."
