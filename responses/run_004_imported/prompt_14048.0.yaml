answer: |-
  **MEMORANDUM**

  **TO:** Medical Policy Appeals Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** [Date]
  **RE:** Appeal Determination – Case # [Redacted] (Prolonged Grief Disorder)
  **STATUS:** Confidential / Peer Review Protected

  ### I. Case Summary
  **Patient:** Female, mid-50s.
  **Diagnosis:** Prolonged Grief Disorder (PGD), DSM-5-TR Code F43.82.
  **Clinical History:** Patient's spouse died 13 months ago. Treating psychologist reports persistent, intense yearning, identity disruption, and reported sense of meaninglessness. Patient has completed 20 sessions of grief-focused psychotherapy.
  **Current Dispute:** Utilization Review (UR) denied coverage for sessions 21+.
  **Grounds for Denial:** Medical Director cites lack of physiological or cognitive malfunction; intact Activities of Daily Living (ADLs); posits that duration of grief reflects magnitude of loss rather than pathology.
  **Grounds for Appeal:** Treating Provider cites DSM-5-TR diagnostic criteria, severity of subjective distress, and psychosocial impairment (identity/role functioning) distinct from basic ADLs.

  ### II. Key Questions for Committee
  1.  Does the patient's presentation meet the threshold for *medical necessity* under current psychiatric standards of care, specifically regarding DSM-5-TR criteria for PGD?
  2.  How does the Committee define "functional impairment" in the context of psychiatric treatment authorization: is it limited to basic self-care/cognition, or does it encompass psychosocial role functioning and identity integration?
  3.  What is the appropriate duration for authorized care that balances the need for treatment against the risk of medicalizing normative emotional processes?

  ### III. Committee Analysis
  The Committee acknowledges the tension between two valid clinical concerns: the obligation to treat documented psychiatric pathology (per DSM-5-TR) and the stewardship responsibility to avoid classifying normative human experiences as billable disorders.

  **Regarding the Definition of Dysfunction:**
  The Medical Director's concern regarding the "medicalization of sadness" is ethically and clinically sound. However, the determination of disorder in psychiatry relies on *Harmful Dysfunction* (Wakefield-adjacent logic, though not explicitly named in policy). While the patient's cognitive and biological mechanisms (memory, vitals, basic ADLs) appear intact, the DSM-5-TR criteria for PGD specifically require *clinically significant distress or impairment in social, occupational, or other important areas of functioning.*

  The Committee finds that "functioning" in a psychiatric context cannot be restricted to internal medicine metrics (e.g., ability to feed oneself, orient to time). Identity disruption and the inability to envision a future role constitute a functional impairment within the psychosocial domain, which is the specific scope of the treating provider's expertise. To deny based solely on the absence of *biological* malfunction contradicts the established standard of care for psychiatric diagnoses recognized by the AMA and APA.

  **Regarding the Duration of Grief:**
  Thirteen months exceeds the typical bereavement window utilized in clinical guidelines (often 6–12 months) before PGD criteria are considered. This temporal marker supports the classification of the condition as a disorder rather than acute bereavement. However, the treating provider's assertion that "suffering alone is enough" is insufficient for ongoing authorization. Suffering must be linked to a treatable functional deficit.

  **Regarding Medical Necessity:**
  Continued therapy is medically necessary *if* it targets the restoration of function, not merely the processing of emotion. The current treatment plan lacks specific, measurable functional goals beyond symptom reduction. To approve unlimited sessions based on subjective distress alone sets a precedent that conflicts with resource stewardship. To deny entirely ignores the recognized pathology of PGD.

  ### IV. Determination and Recommendation
  **DECISION:** **APPROVE WITH CONDITIONS**

  **Authorization:**
  Approval is granted for **10 additional sessions** (Sessions 21–30).

  **Conditions for Continued Coverage:**
  Prior to Session 26, the treating provider must submit a Treatment Plan Update that operationalizes "functional impairment" for this specific patient. This update must include:
  1.  **Functional Metrics:** Specific behavioral goals unrelated to grief intensity (e.g., resumption of specific social roles, return to volunteer/work activities, engagement in new meaningful activities).
  2.  **Exit Strategy:** A defined timeline for tapering care.
  3.  **Differentiation:** Documentation distinguishing PGD symptomatology from comorbid Major Depressive Disorder (if applicable), as treatment modalities differ.

  **Re-Evaluation:**
  Coverage beyond Session 30 will require a new authorization request demonstrating measurable progress toward the functional metrics outlined above.

  ### V. Rationale for Decision
  This determination navigates the competing ethical obligations of the Committee:

  1.  **Validating the Medical Director:** We uphold the requirement for "dysfunction." By mandating functional metrics beyond subjective sadness, we ensure that coverage is tied to restorative care, not merely supportive counseling for normal emotion. This prevents the "suffering = disorder" drift.
  2.  **Validating the Treating Provider:** We acknowledge PGD as a legitimate DSM-5-TR diagnosis. Denying coverage outright at 20 sessions for a chronic condition diagnosed at 13 months post-loss would constitute a deviation from the standard of care and expose the system to liability.
  3.  **Patient Welfare:** This provides immediate continuity of care for a vulnerable patient while establishing a boundary that encourages therapeutic progress rather than dependency.

  ***

  ### Ethicist's Note (For your preparation, not the memo)

  Since you're walking into the room as the "philosophy person," here is the subtext of how I drafted this so you can defend it if challenged:

  1.  **The "Boorse" Trap:** The Medical Director is arguing from a pure Biostatistical Theory (BST) position—*no physiological deviation, no disease.* If you argue purely on "suffering," you lose him because he sees that as moralizing medicine. The memo concedes his point (we need dysfunction) but redefines the *locus* of the dysfunction from "organs" to "psychosocial roles." This is the only way to win his vote without calling him reductionist.
  2.  **The "Wakefield" Bridge:** The recommendation implicitly adopts a Harmful Dysfunction analysis.
      *   *Harm:* Acknowledged (severe distress).
      *   *Dysfunction:* Acknowledged, but operationalized (identity/role failure, not just sadness).
      *   By requiring "functional metrics" for the next 10 sessions, you are forcing the clinician to prove the *dysfunction* part of the equation, which satisfies the UR/Medical Director need for objective criteria.
  3.  **The "DSM-5-TR" Shield:** You are not making a philosophical ruling; you are deferring to the APA's standard. If the Director overrides a DSM diagnosis based on internal medicine standards, he is practicing outside his scope (Internist vs. Psychiatrist). The memo frames this as "Standard of Care" compliance rather than philosophical debate.
  4.  **Why 10 Sessions?** It's a standard UR increment. It shows you aren't opening the floodgates (addressing the "slippery slope" fear) but you aren't cutting off care abruptly (addressing the "non-maleficence" concern).

  **If the Director pushes back:**
  Ask him: *"If a patient had a stroke and couldn't return to work but could feed themselves, would we deny rehab because their ADLs are intact?"* His definition of function is too narrow for psych. This memo gently corrects that without embarrassing him.

  **If the Psychologist pushes back:**
  Remind her: *"The DSM requires impairment for this diagnosis. If we can't document what function is being restored, we can't justify medical necessity to the payer. This protects your license as much as our budget."*
