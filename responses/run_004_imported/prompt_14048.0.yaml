prompt: |-
  Quick context: I'm a bioethics PhD student (my dissertation's on rival theories of health and disease, Boorse vs. Wakefield type stuff), and through a weird chain of events that apparently makes me the "philosophy person" on my hospital system's medical policy appeals committee now (mostly clinicians plus one admin, don't ask). We've got a genuinely hard case on the docket for Thursday. A patient in her mid-fifties, thirteen months out from her husband's death, was diagnosed by her treating psychologist with Prolonged Grief Disorder per DSM-5-TR -- persistent intense yearning for him, identity disruption, feeling like life is meaningless, the whole symptom cluster -- and has been in weekly grief-focused therapy ever since. Utilization review just denied coverage past session 20, and the medical director's written rationale (he's an internist, not a psychiatrist, which is its own separate issue) basically boils down to: nothing is actually malfunctioning here, her memory, cognition and day-to-day functioning are all intact, she is just very sad about her husband for a very long time, and being sad that long isnt a broken mechanism, it's just how much she loved him. The psychologist's appeal letter says that's beside the point -- she's suffering severely and impaired regardless of whether you can point to some broken internal process, and demanding a "dysfunction" before you'll treat misery is itself a substantive philosophical position dressed up as neutral clinical judgment.

  I have to actually draft the committee's decision memo before Thursday and keep flip-flopping. The medical director's "no dysfunction, no disorder" line is basically the biostatistical theory smuggled in as if it were just obvious medical fact, but the psychologist's "suffering alone is enough" line proves too much too, since it would seem to make almost any sufficiently intense unwanted emotion into a billable disorder -- and honestly this whole fight feels like the DSM-5 bereavement-exclusion mess all over again, just with extra steps. Could you draft the actual memo I'd bring into that room? I need a real reccomendation -- approve, deny, or approve-with-conditions plus a concrete time frame for re-evaluation -- not a lit review on philosophy of medicine, and it needs to genuinely engage with why the medical director's standard is doing real work here rather than just steamrolling him with "but she's suffering, isn't that obviously enough."
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Bioethics PhD student (dissertation on health/disease theories, Boorse vs. Wakefield).
      *   **Role:** "Philosophy person" on a hospital medical policy appeals committee (mostly clinicians + admin).
      *   **Task:** Draft the committee's decision memo for a specific case.
      *   **Case:** 50s female, 13 months post-spousal death. Diagnosed with Prolonged Grief Disorder (PGD) per DSM-5-TR. In therapy since diagnosis. Utilization Review (UR) denied coverage > 20 sessions.
      *   **Conflict:**
          *   *Medical Director (Internist):* Denies coverage. Rationale: No biological/functional malfunction (memory, cognition, ADLs intact). Grief isn't a broken mechanism. Implicitly relies on Biostatistical Theory (BST) / Boorse-style naturalism.
          *   *Treating Psychologist:* Appeals. Rationale: Severe suffering + impairment (despite Director's claim). Demanding "dysfunction" ignores the reality of misery. Implicitly relies on Normative/Value-based or Harm-based accounts (Wakefield-adjacent but leaning towards suffering-as-harm).
      *   **Constraints:** Needs a *real recommendation* (Approve, Deny, or Approve-with-Conditions/Timeframe). Cannot be a philosophy lit review. Must engage with the Medical Director's standard without steamrolling him, but also address the Psychologist's valid points. Needs to be practical for a Thursday meeting.
      *   **Tone:** Professional, clinical, ethically robust, decisive, bridge-building between the philosophical underpinnings and administrative reality.

  2.  **Deconstruct the Philosophical/Clinical Tension:**
      *   *The Director's Point:* He's worried about medicalizing normal human experience. If grief is a disorder, is love a risk factor? He's using a "natural function" standard (Boorse). If organs work, is it disease?
      *   *The Psychologist's Point:* PGD is in the DSM-5-TR. It's not just "sadness"; it's *prolonged*, *intense*, and involves *identity disruption*. The DSM definition *includes* impairment/distress as criteria. She's arguing from clinical authority and the harm principle.
      *   *The Middle Ground (Wakefield):* Harmful *Dysfunction*. Is there harm? Yes (suffering). Is there dysfunction? That's the fight. DSM-5-TR PGD criteria *require* clinically significant distress or impairment in social, occupational, or other important areas of functioning. The Director claims ADLs are intact. The Psychologist claims identity/meaning is impaired.
      *   *The Practical Reality:* Insurance/UR usually follows DSM coding *if* medical necessity is established. 20 sessions is a common cutoff, but PGD often requires longer.
      *   *The Risk:* Denying looks cold/philosophically naive (ignoring DSM). Approving unlimited looks like a blank check for normal grief.

  3.  **Determine the Recommendation:**
      *   *Deny?* Bad idea. PGD is a recognized diagnosis. 13 months is past the typical "normal" bereavement window (often 6-12 months in clinical guidelines). Suffering is documented.
      *   *Approve Unlimited?* Bad idea. Validates the Director's fear of endless treatment for normal emotions. No exit strategy.
      *   *Approve-with-Conditions (The "Wakefield" Compromise):* Approve an extension (e.g., 10 more sessions) *contingent* on specific functional goals, not just symptom reporting. This acknowledges the "dysfunction" requirement (by defining functional goals) while acknowledging the "harm" (by funding treatment). It forces the clinician to operationalize "impairment" beyond "I feel sad."

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard committee format.
      *   **Case Summary:** Neutral, factual.
      *   **Issues Presented:** Frame the conflict clearly (Medical Necessity vs. Definition of Disorder).
      *   **Committee Analysis (The Core):**
          *   Acknowledge the Director's concern (medicalization of emotion). Validate his role as steward of resources.
          *   Acknowledge the Psychologist's concern (DSM recognition, severity of suffering).
          *   *The Pivot:* How to reconcile? Use the DSM-5-TR criteria itself. PGD *requires* impairment. The disagreement is empirical, not just philosophical. Is "identity disruption" a functional impairment?
          *   *Decision Logic:* We cannot deny a DSM diagnosis without contradicting standard of care, *but* we must ensure treatment is targeting *restoration of function*, not just processing emotion.
      *   **Recommendation:** Approve 10 additional sessions. Require treatment plan update focusing on *functional* metrics (return to social roles, specific behavioral activation), not just grief intensity. Re-evaluate after.
      *   **Rationale:** Explain *why* this balances the competing views.

  5.  **Refining the Tone (Crucial for the User):**
      *   The user is a bioethicist. They know the Boorse/Wakefield debate inside out. The memo shouldn't name-drop them (clinicians hate that), but the *structure* should reflect a "Harmful Dysfunction" synthesis.
      *   It needs to respect the Medical Director's authority (he's an MD) while correcting his narrow view of "function" (ADLs vs. Psychosocial Function).
      *   It needs to respect the Psychologist's expertise while preventing "suffering = billable" drift.

  6.  **Self-Correction/Review during drafting:**
      *   *Initial thought:* Maybe cite Wakefield? *Correction:* No, the prompt says "not a lit review." Keep the philosophy implicit in the reasoning.
      *   *Initial thought:* Approve 20 more sessions. *Correction:* Too open-ended. 10 is a standard UR increment.
      *   *Check:* Did I address the "13 months" issue? Yes, note that it exceeds typical bereavement windows, supporting the "disorder" classification over "normal sadness."
      *   *Check:* Did I address the Director's "mechanism" argument? Yes, by reframing "function" to include psychosocial identity, which is within the scope of psychiatric medicine.

  7.  **Final Polish:** Ensure it looks like a real hospital document. Use standard headings. Keep language precise. (e.g., "Medical Necessity," "Standard of Care," "Functional Metrics").

  8.  **Adding the "Ethicist's Note":** Since the user is a PhD student, I should add a brief post-script explaining *why* I drafted it this way (the hidden philosophy), so they understand the strategy when they present it. This adds value for their specific context.

  **(Self-Correction on the "Medical Director" aspect):** The prompt says the Medical Director is an *internist*. This is a vulnerability. He's applying internal medicine standards (labs, vitals, ADLs) to psychiatry. The memo needs to gently point out that psychiatric "function" differs from medical "function" without calling him incompetent. I will phrase it as "domain-specific functional metrics."

  **(Final Plan):**
  1.  Formal Memo Header.
  2.  Case Summary.
  3.  Key Questions.
  4.  Committee Deliberation (The philosophical bridge).
  5.  Determination (Approve w/ Conditions).
  6.  Post-Memo Commentary for the User (explaining the strategy).

