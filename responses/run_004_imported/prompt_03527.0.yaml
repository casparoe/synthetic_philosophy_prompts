      *Wait, one nuance on Hewitt & Liang:* Their point is specifically about *linear* probes vs. *complex* probes. If a linear probe works, it's stronger evidence. But SAEs are trying to find a basis where features are monosemantic. I should mention that SAEs are an attempt to fix the "flexible probe" problem by finding a *fixed* basis first.

      *Revised Plan for (a):* Acknowledge SAEs are an attempt to solve the Hewitt & Liang problem by finding a *canonical basis* before probing. But intervention is still the gold standard for "use."
      *Revised Plan for (b):* Feature splitting kills the "canonical basis" hope. This forces us to Dennett.

      *Final Stance:* Representations are **interventionally robust patterns**. They are real, but not fundamental.

  7.  **Final Review against constraints:**
      *   Philosopher audience? Yes.
      *   Technical explanation clear? Yes.
      *   Take a stance? Yes.
