answer: |-
  "You moved too fast tonight," Elena said. The ice in her glass had long since melted. "In the Q&A. You said because we *cannot* abandon the reactive attitudes, we *need not* worry about their justification. That's a leap."

  Arthur loosened his tie, sinking deeper into the armchair. The retirement dinner had drained him. "It's a bridge made of necessity, Ellie. If a practice is woven into the fabric of human life, asking for a justification outside that fabric is nonsense. What court appeals to? The view from nowhere? If you step outside the human community to judge it, you have no ground to stand on. The reactive attitudes aren't theories; they're the condition of regarding someone as a person."

  "The court of truth," Elena said. "Describing why we blame doesn't justify the blame. It just explains the psychology. You're naturalizing a normative problem. You're saying 'we do this' implies 'we may do this.'"

  "I'm saying 'we cannot stop' implies 'it is not irrational to continue.' If determinism threatens our practices, determinism is irrelevant to the practices. But you... you're chasing a ghost. 'Ultimate responsibility.' Tell me, what does 'ultimate' add to 'responsibility'? If I resent your neglect, and you acknowledge it, what does the metaphysical stamp provide?"

  "It provides the difference between managing a hazard and holding a moral agent," Elena said, leaning forward. "If I'm not responsible for the way I am—the principles I choose by, the character I inhabit—then I'm just luck. Genetic luck, environmental luck. Your reactive attitudes are just sophisticated weather prediction. You're punishing the storm because it rained on your parade."

  "But you can't be *causa sui*. You know that. To be responsible for your nature, you'd need to choose it prior to having it. Infinite regress. So what? If 'ultimate responsibility' requires impossibility, then the concept is the error, not the practice."

  "Or the practice is the error," Elena countered. "You ask if my conclusion proves too much. I say it proves exactly enough. It shows moral responsibility is impossible. Determinism doesn't matter. Luck doesn't matter. The result is the same. We are never the ultimate authors."

  "Then it proves too much," Arthur said, his voice tired. "Because it demands we become inhuman to accommodate a metaphysical ideal. And it proves too little, because it offers no way to live. You strip the debt, you strip the credit."

  "Better inhuman than unjust," Elena said. "If you can't justify the blame, Dad, don't blame. Just describe."

  "And lose the gratitude too? The love? Those are reactive attitudes, Ellie. They stand or fall together."

  "Then maybe love without the debt," she said. "Maybe that's the only honest thing left."

  Arthur looked at her, silence stretching between them like a chasm neither could bridge. "Then we agree on nothing."

  "We agree on the argument," she said. "Just not the life."
