answer: |-
  Here is a concrete case study designed to expose the tension in Nozick's scheme. This scenario utilizes what is often called in bioethics the "Argument from Marginal Cases."

  ### The Case of Arthur and the Neural Antigen

  **The Subject**
  Arthur is a 35-year-old human being. Due to a rare congenital condition, Arthur has the cognitive and emotional capacity of a highly social mammal (comparable to a dog or a chimpanzee), but he permanently lacks the capacity Nozick identifies as morally decisive. Arthur cannot form an "overall conception of the good." He cannot plan for next year, reflect on his past, or steer his life according to abstract principles. He experiences immediate pleasure and pain, feels affection for his caregivers, and fears injury, but he has no narrative sense of self.

  **The Scenario**
  A deadly viral outbreak threatens a community of five individuals who *do* possess the full capacity for rational life-planning (scientists, parents, community leaders). The only known cure requires a specific neural antigen found in extremely high concentrations in Arthur's brain stem. Extracting this antigen will inevitably kill Arthur.

  **Nozick's Two-Tier Application**
  According to Nozick's explicit justification, moral status is anchored in the capacity for rational autonomy (the "overall conception of the good").
  1.  **The Five Victims:** They possess the capacity. They are protected by Kantian side-constraints. They cannot be sacrificed for the greater good.
  2.  **Arthur:** He lacks the capacity. Therefore, he falls into the "utilitarian for animals" tier. His life is not an inviolable side-constraint; it is a value to be weighed in the calculus.

  **The Calculation**
  In a utilitarian calculus, five lives of "planning" beings arguably outweigh one life of a "non-planning" being. Furthermore, if the five survivors go on to contribute significantly to the general welfare, the aggregate benefit is high. Under Nozick's scheme, there is no *rights-based* prohibition against harvesting Arthur. It may be sad, but it is not a violation of his rights, because he lacks the specific capacity that generates rights.

  ### Why This Creates Serious Problems for Nozick

  This case creates a pincer movement that threatens to collapse Nozick's distinction.

  **1. The Problem of Over-Exclusion (The Human Cost)**
  If Nozick sticks to his criterion (capacity for life-planning), he must accept that Arthur can be involuntarily sacrificed. This violates a deep-seated moral intuition that *human beings* possess inherent dignity regardless of their cognitive utility. Most people believe it is morally monstrous to treat a severely disabled human like livestock, even if doing so saves others.
  *   **The Dilemma:** If Nozick agrees Arthur can be sacrificed, his theory clashes with basic human moral intuition. If he argues Arthur *cannot* be sacrificed, he must explain why. He can no longer appeal to the "capacity for life-planning," because Arthur lacks it. He would be forced to appeal to Arthur's species membership (*Homo sapiens*). But Nozick explicitly rejected species membership as a morally arbitrary basis (similar to race or sex). Thus, he is caught between a repugnant conclusion or a contradiction of his own anti-speciesist premise.

  **2. The Problem of Under-Inclusion (The Animal Comparison)**
  To sharpen the problem, imagine a chimpanzee named "Koko" in a nearby sanctuary. Research suggests Koko possesses a rudimentary ability to anticipate future needs and make choices based on a primitive preference structure—arguably *more* "life-steering" capacity than Arthur possesses.
  *   **The Inconsistency:** Under Nozick's scheme, Arthur (a human with zero planning capacity) is potentially sacrificable for the greater good (Utilitarian tier), while Koko (a chimp with *some* planning capacity) might also be sacrificable. But if Nozick protects Arthur simply because he is human, he creates a moral cliff-edge where a human with *less* capacity receives *more* protection than an animal with *more* capacity.
  *   **The Result:** This reveals that the "capacity" criterion is doing no real work. The real boundary is species. If the boundary is species, then the justification ("rational autonomy") is a pretext. If the justification is genuine ("rational autonomy"), then the boundary (species) is unjustified.

  ### Conclusion for Your Project
  The case of Arthur demonstrates that anchoring moral rights in the **capacity for an overall conception of the good** fails to map neatly onto the **human/animal distinction**.

  *   If Nozick prioritizes the **capacity**, he loses the protection of vulnerable humans (Arthur).
  *   If Nozick prioritizes the **human/animal distinction**, he abandons the capacity criterion and retreats to speciesism.

  This shows that the "two-tier" scheme is unstable: it attempts to have the egalitarian appeal of a capacity-based view (we aren't just privileging humans arbitrarily!) while maintaining the exclusionary results of a species-based view (all humans are safe, all animals are not). The case of Arthur proves you cannot consistently hold both positions.
