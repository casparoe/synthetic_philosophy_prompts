answer: |-
  This is a classic negotiation scenario involving **BATNAs** (Best Alternatives to a Negotiated Agreement) and the division of **surplus value**.

  To determine who is more reasonable, we need to look at the math behind each proposal and identify the "Zone of Possible Agreement" (ZOPA).

  ### 1. Breakdown of the Scenarios

  Let's clarify the three financial outcomes on the table:

  *   **Scenario A (The Joint Deal):** The competitor pays **$80,000**.
  *   **Scenario B (The Deadlock):** You can't agree on the split, so you keep separate inventory. Total Value: **$14,000** ($10k for you, $4k for her).
  *   **Scenario C (The Walk-Away):** You dissolve the partnership and sell individually. Total Value: **$70,000** ($50k for you, $20k for her).

  ### 2. Analyzing Your Partner's Approach
  **Her Proposal:** Split the surplus above the *Deadlock* ($14k) equally.
  *   **The Math:** $80,000 (Joint) - $14,000 (Deadlock) = $66,000 Surplus.
  *   **The Split:** $33,000 each + Original Inventory Value.
  *   **Her Take:** $33k + $4k = **$37,000**.
  *   **Your Take:** $33k + $10k = **$43,000**.

  **The Flaw:** This approach assumes your only alternative is the Deadlock ($10k). It ignores your Walk-Away option ($50k).
  *   **Why it's unreasonable for you:** If you can realistically walk away and sell your share for $50,000, accepting $43,000 is irrational. You would lose $7,000 by agreeing to her terms. A rational partner cannot expect you to accept less than your best alternative.
  *   **Why she likes it:** It maximizes the "cooperation surplus" ($66k) and splits it 50/50, which benefits the partner with the weaker individual position (her).

  ### 3. Analyzing Your Approach
  **Your Proposal:** Split based on proximity to individual *Best-Case* numbers.
  *   **The Logic:** You bring more value to the table individually ($50k vs $20k), so you should capture more of the joint deal.
  *   **The Math (Proportional):** You represent 71% of the individual value ($50k/$70k). She represents 29%.
  *   **Your Take:** 71% of $80k = **~$57,000**.
  *   **Her Take:** 29% of $80k = **~$23,000**.

  **The Strength:** This respects your leverage. It ensures you are better off cooperating ($57k) than walking away ($50k).
  **The Weakness:** It claims the majority of the "synergy." The $80k offer exists *because* you are combined. If she refuses to cooperate, the competitor might not buy at all. She might feel this undervalues her necessity to the deal.

  ### 4. The "Better Way": Base + Shared Synergy
  There is a more objective, principled way to solve this that bridges the gap. This method is often used in partnership dissolutions.

  **Step 1: Secure the Individual Baselines (BATNA)**
  Acknowledge that if you didn't do this deal, you would sell individually. This establishes the "cost" of each partner's participation.
  *   You get your walk-away value: **$50,000**.
  *   She gets her walk-away value: **$20,000**.
  *   *Subtotal:* $70,000.

  **Step 2: Identify the True Synergy**
  How much *extra* value is created specifically by agreeing to this joint sale instead of selling separately?
  *   $80,000 (Joint) - $70,000 (Individual) = **$10,000 Synergy**.

  **Step 3: Split the Synergy Equally**
  Since this extra $10,000 only exists because you *both* agreed to the joint sale, it is fair to split this specific premium 50/50.
  *   You get: $5,000.
  *   She gets: $5,000.

  **The Recommended Split:**
  *   **You:** $50,000 (Base) + $5,000 (Synergy) = **$55,000**.
  *   **Her:** $20,000 (Base) + $5,000 (Synergy) = **$25,000**.

  ### Why This Is Superior
  1.  **It is Rational:** It guarantees neither of you ends up with less than you could get on your own (unlike her proposal, which gives you less than your $50k option).
  2.  **It is Fair:** It rewards individual contribution (you get more because your business share is worth more) but equally rewards cooperation (you split the *extra* benefit equally).
  3.  **It Avoids Conflict:** Her proposal relies on the threat of the "Deadlock" ($14k), which is a "scorched earth" scenario that hurts you more than her. Anchoring the negotiation on the "Walk-Away" ($70k) is more professional and reflects the true market value of your assets.

  ### Strategic Advice for the Conversation
  Your partner's proposal is mathematically flawed *if* your $50,000 individual sale option is credible. However, she may be arguing for it because she perceives your $50,000 estimate as risky or difficult to achieve, whereas the $80,000 is "cash on the table."

  **How to frame it:**
  > "I understand why you want to split the surplus over the deadlock amount, but that baseline assumes we're willing to settle for keeping the inventory ($14k total). We both know we can do better than that by selling separately ($70k total).
  >
  > The joint offer is only $10,000 more than what we can get individually. It makes the most sense to guarantee each of us our individual sale value first, and then split that extra $10,000 'cooperation bonus' equally. That gives me $55k and you $25k. This ensures we are both better off working together than apart, without ignoring the value we each bring individually."

  **Caveat:** If your $50,000 individual sale is speculative (e.g., "I *might* find a buyer in 6 months") and the $80,000 is immediate cash, you should discount your $50k baseline for risk and time. If you adjust your baseline down to $45k for risk, the split would shift slightly in her favor, but her proposal of $43k for you would still be unreasonable.

  **Verdict:** **Your approach is more reasonable**, but the **"Base + Shared Synergy"** method is the most robust solution. Her proposal asks you to subsidize her share by accepting less than your independent market value.
