prompt: |-
  So a few of us at work got into one of those late-night Slack derails about whether an LLM (or some future AI) could ever actually be conscious, and one of my coworkers who's way more into this stuff then me brought up "Integrated Information Theory" and this "phi" number that's supposed to measure how conscious a system is. I went down a rabbit hole afterward and found some genuinely wild stuff: apparently Scott Aaronson (the quantum computing guy) has an old blog post where he builds some kind of grid/expander-graph out of dumb XOR logic gates and shows that IIT's own math says it should have a higher phi than an actual human brain, i.e. it'd technically be "more conscious" than you or me, and from what I read, Tononi's response was basically to just accept that and say yep, that's what the theory predicts, which strikes me as insane but maybe I'm missing something. I also found that IIT apparently implies a perfect software simulation of a brain, running on totally normal computer hardware, would NOT be conscious at all, because the theory cares about the actual physical wiring/causal structure of a system and not just its input-output behavior — which feels like a pretty direct punch in the face to the "substrate independence" assumption that I think basically every programmer takes for granted. On top of all that, I saw something about a big pile of consciousness researchers signing an open letter back in 2023 basically calling IIT pseudoscience, which apparently caused a whole mess in that field.

  Anyway, I can't tell if IIT is a legit, serious scientific theory that we should take seriously even with these uncomfortable implications, or if its more like a mathematically-fancy just-so story that doesn't really deserve the "science" label. Could you write me an actual essay (doesn't need to be crazy long, a few hundred words is fine — and not just a "some people think X, some people think Y" summary) that wrestles with this? Specifically engage with stuff like the expander-graph/XOR-gate problem and the "simulated brains aren't conscious" claim, not just IIT in the abstract, and then actually land on a real verdict at the end — like, should I basically take phi seriously as tracking consciousness or not, and does whatever you conclude tell us anything about whether an AI running on ordinary computer hardware could ever be conscious under this view. I don't need citations or anything formal, I just want an opinionated take I can actually chew on.
