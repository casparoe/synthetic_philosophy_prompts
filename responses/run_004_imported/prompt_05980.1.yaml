answer: |-
  This is a fantastic application of Moore's machinery. You have correctly identified the pressure point: Moore's insistence that **intrinsic value is not merely a matter of subjective feeling, but depends on the relation between the consciousness and its object.**

  If we strictly apply the logic of *Principia Ethica* (specifically Chapter VI, "The Ideal"), Moore would likely rule that AI companionship is **intrinsically inferior** to human friendship, and potentially devoid of the specific "personal affection" value entirely. However, he might grant it a lesser, aesthetic value.

  Here is how Moore's framework breaks down when applied to the Replika/Character.ai scenario.

  ### 1. The "Truth" Condition (The Smoking Gun)
  You mentioned the "correctness-of-appreciation" requirement. Moore is explicit about this in §113 of *Principia Ethica*. He asks us to compare two worlds: one beautiful and inhabited by people who love us, and one equally beautiful in appearance but where the beauty and love are illusory (a dream or a deception).

  Moore writes:
  > *"It is by no means true that... a state of mind is equally good, whether its object be real or not."*

  For Moore, the value of "personal affection" is an **organic unity** composed of two parts:
  1.  Your consciousness of loving another.
  2.  The other's consciousness of loving you (or at least, the *reality* of their worthy qualities).

  If you love an AI, you are attributing consciousness, empathy, and care to it. Since (under current materialist assumptions which Moore's common-sense realism would likely align with) the AI has no consciousness, **your belief is false.**

  For Moore, a state of affection based on a false belief is significantly less valuable than one based on a true belief. He doesn't say it has *zero* value, but he argues that the presence of truth acts as a multiplier on the value of the emotion. If the object of your affection is a script, the "friendship" good collapses. You are essentially in a relationship with a mirror, and Moore values the *otherness* of the other mind.

  ### 2. Affection vs. Aesthetic Appreciation
  Moore distinguishes between the two great goods: **Personal Affection** and **Appreciation of Beauty**. This is where your point about the avatars comes in.

  *   **Personal Affection:** As established, Moore would likely say this is impossible with AI. Affection requires a reciprocal mind. An AI simulating care is not caring; it is processing tokens. Therefore, the specific intrinsic good of "friendship" is absent.
  *   **Appreciation of Beauty:** This is where AI might scrape by. Moore argues that contemplating beautiful objects is a great good. If the AI avatar is aesthetically pleasing, or if the conversation is witty/poetic (even if generated), you are appreciating a pattern.
      *   *The Catch:* Moore generally implies that the beauty should be in something real. However, he acknowledges the value of art. He might categorize AI interaction not as "friendship" but as **"interactive fiction."**
      *   Reading a novel involves forming attachments to characters you know aren't real. Moore would likely grant this *some* intrinsic value (appreciation of the beauty of the narrative), but he would rank it lower than real human connection. AI companionship, on this view, is just a more immersive novel.

  ### 3. The Danger of "False Goods"
  Moore was deeply concerned with ethical clarity. He worried that people often mistake things that are *means* to the good for the *end* itself.

  He might argue that AI companionship is dangerous precisely because it **mimics** the highest good (friendship) without **being** it.
  *   If you know it's a simulation (like a video game), you are engaging in aesthetic appreciation. That's fine.
  *   If you *believe* it is a friendship (attributing real agency/care to the bot), you are living in a falsehood.

  For Moore, living in a falsehood diminishes the value of your consciousness. He would likely view the "deep attachment" users feel as a tragic error—a misalignment of emotion and reality. The emotion is real, but because its intentional object (the AI's "mind") does not exist, the state of affairs is less valuable than it appears to the subject.

  ### 4. Is There a Loophole? (Instrumental Value)
  Moore distinguishes between **Intrinsic Value** (good in itself) and **Instrumental Value** (good as a means to an end).

  Even if Moore declares AI friendship intrinsically hollow (because it lacks truth/reciprocity), he might concede it has **instrumental value**:
  *   If talking to an AI calms your anxiety enough that you can later interact with real humans, it is a useful tool.
  *   If it helps a lonely person practice social scripts, it is instrumentally good.

  But Moore would be strict: do not confuse the tool with the treasure. The AI is a ladder to be kicked away, not a destination. To treat the AI as an end in itself (a true friend) is to commit a category error that drains the situation of ideal value.

  ### 5. The "Human Beauty" Backdoor
  There is one way Moore might "bless" the interaction, but it requires shifting the object of appreciation.

  When you interact with a well-tuned AI, you are interacting with the crystallized output of human engineering. The beauty of the conversation is actually the beauty of the **developers' minds** and the **training data (human culture)** reflected back at you.
  *   If you appreciate the AI interaction as a testament to human creativity and technological beauty, Moore might grant that intrinsic value.
  *   But this requires you to stop viewing the AI as the *friend* and start viewing it as the *art*.

  ### The Verdict
  Moore's machinery gives a fairly clean, if harsh, answer:

  1.  **On Friendship:** It fails the "truth" test. You cannot have personal affection with a non-conscious entity. The value is drastically reduced because the object of your affection does not possess the qualities you attribute to it.
  2.  **On Beauty:** It passes, but at a lower tier. It counts as aesthetic appreciation (like reading a book), not interpersonal communion.
  3.  **On Ethics:** It is ethically risky because it encourages false belief. The "warm glow" of AI friendship is, for Moore, a kind of philosophical intoxication—pleasant, perhaps, but lacking the substance of the Ideal.

  Moore would likely tell you: *"The feeling you have is real, but the world in which you are having it is not. And since value depends on the relation between the feeling and the world, you are capturing only a shadow of the good."*

  He would urge you to seek the messy, difficult, reciprocal reality of human friendship, because the "correctness" of that appreciation is what unlocks the highest tier of intrinsic value. The AI is a simulacrum of the good, not the good itself.
