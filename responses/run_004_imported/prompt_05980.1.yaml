      *   *The "Truth" Condition:* Moore explicitly states that for the pleasure of contemplation to be good, the object contemplated must *exist* and possess the qualities attributed to it. If I take pleasure in believing a friend loves me, but they actually hate me, the state of affairs is less valuable (or positively bad) than if they truly loved me. He calls this the "principle of organic unities."
      *   *Personal Affection:* This involves consciousness of another consciousness. It's not just my feeling; it's the *reciprocity* or the *reality* of the other mind that matters.
      *   *Beauty:* Appreciation of beautiful objects. Does the object need to exist? Yes, generally. Moore is a realist.
      *   *AI Context:* AI is not conscious. It simulates personality. It simulates beauty (avatars).
