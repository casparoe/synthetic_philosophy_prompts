  **Is there a principled line?**

  Yes, there is a principled line, though it isn't always defined by specific magic words like "I promise." In moral philosophy (specifically Scanlonian contractualism or reliance-based theories), the line is drawn at the **transfer of discretion**. When you assure someone you will do something, and you know they are relying on that assurance to their detriment (like turning down a backup loan), you have transferred the discretion to change your mind to them. You no longer have the right to unilaterally change plans without their consent. The line isn't about the syntax of the sentence; it's about whether you knowingly invited reliance that would cause harm if withdrawn. Theo crossed this line when he allowed Raj to turn down the personal loan based on his word.

  **What are they both missing?**

  Both parties are treating this like a contract dispute rather than a friendship breach. **Theo** is missing that the issue isn't just the money or the apartment, but that he prioritized speculative crypto gains over a committed obligation to family, showing a misalignment of values that damages trust. **Elena** is missing that demanding a precise linguistic definition of "promise" is a trap; the real evidence isn't the wording, but the context of the relationship and the known consequences of withdrawal. Finally, **both** are ignoring the emotional labor Raj's parents had to expend to fix Theo's mistake, which is a tangible harm that Theo's "no harm done" argument completely overlooks.
