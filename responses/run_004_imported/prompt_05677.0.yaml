  **Score Explanations**

  *   **1 (Theo):** -2 because moral responsibility isn't erased by lucky outcomes; Raj faced significant financial risk and stress due to Theo's breach, regardless of the final result.
  *   **2 (Elena):** 2 because this correctly identifies that the ethical violation lies in the betrayal of trust and the imposition of risk, not merely the tangible final outcome.
