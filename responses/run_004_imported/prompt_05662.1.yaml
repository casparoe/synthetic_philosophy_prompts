          *   *Pro-Choice:* Without AC, large swathes of classical math (analysis, algebra) are impossible or extremely painful to formalize. Library becomes "useless" for mainstream math.
          *   *Anti-Choice:* Global AC breaks computability (no code extraction). It forces constructive users to accept classical axioms they didn't opt into (logical purity/modularity).
      *   **Goal:** Draft a recommendation for the maintainer call.
      *   **Constraint:** Needs an actual call (Adopt Global, Tag Per Theorem, or Fork). Needs reasoning that appeals to the *anti-choice* camp (not just "AC is standard").

  2.  **Evaluate the Options:**

      *   **Option A: Adopt Global AC.**
          *   *Pros:* Easiest for classical mathematicians. Matches standard ZFC practice.
          *   *Cons:* Kills computability entirely for the library. Alienates constructive/type-theoretic purists. Breaks the "contract" of a proof  assistant that *can* extract code.
          *   *Verdict:* Too polarizing. Likely to cause a fork anyway.

      *   **Option B: Fork a Separate Constructive-Only Library.**
          *   *Pros:* Clean separation.
          *   *Cons:* Splits community effort. Duplicates work. The "main" library becomes classical by default anyway, so this doesn't solve the "smuggling" issue for the main repo. High maintenance overhead.
          *   *Verdict:* Generally seen as a failure mode for open source math projects (fragmentation).

      *   **Option C: Opt-in Tagging Per Theorem (Classical/Noncomputable Scope).**
          *   *Pros:* Preserves computability where possible. Respects constructive users (they can import only constructive parts). Allows classical math to exist. Matches the architecture of libraries like `mathlib` (which uses `open classical` or `noncomputable theory` in specific files/sections).
