answer: |-
  **To:** Core Maintainers
  **From:** [Your Name]
  **Subject:** Recommendation: Policy on Axiom of Choice and Computability
  **Date:** October 26, 2023

  ### Executive Summary

  After reviewing the recent PR regarding the Axiom of Choice (AC) and consulting with stakeholders on both sides of the debate, I recommend we **reject the proposal to declare AC a global axiom** and instead **adopt a strict "Opt-In" scoping policy** (tagging per file/theorem).

  We will **not** fork the library.

  This recommendation prioritizes the integrity of our computational guarantees while acknowledging that classical mathematics is a primary use case. It preserves the library for constructive users without blocking classical formalization.

  ### The Context

  We are at a pivot point. The incoming theorems (Tychonoff, Hamel Basis, etc.) are mathematically vital. However, the *mechanism* of their inclusion determines the long-term architecture of this project.

  *   **The Pro-Choice Argument:** Formalizing mainstream analysis and algebra without AC is prohibitively difficult. If we ban AC, we marginalize the library for classical mathematicians.
  *   **The Anti-Choice Argument:** A global AC axiom silently breaks computability (code extraction) for the entire dependency tree. It violates modularity by forcing constructive users to accept classical axioms they did not explicitly import.

  ### The Recommendation: Explicit Scoping (The "Mathlib Model")

  We should accept the PR's theorems, but require that they be formalized within **explicitly marked classical scopes** (e.g., `noncomputable theory` at the file level, or specific `classical` namespaces), rather than elevating AC to a global axiom for the root.

  **Why this lands for the Constructive/Anti-Choice Camp:**

  1.  **Preservation of Computational Content:**
      Our unique value proposition as a formalized library is that proofs can, in principle, be extracted to programs. A global AC axiom breaks this guarantee *everywhere*, even for simple arithmetic lemmas that don't use AC, because the logic itself becomes classical. By scoping AC, we ensure that any theorem *not* marked `noncomputable` retains its extraction potential. We keep the "constructive core" pure.

  2.  **Explicit Dependency Tracking:**
      Constructive users care about *which* results rely on Choice. If AC is global, the dependency graph is polluted; you cannot tell if `Lemma X` is constructive without reading its proof. If we require tagging, our tooling can generate a dependency graph showing exactly which theorems introduce classicality. This respects the user's right to opt-in to axioms.

  3.  **Prevention of "Axiom Creep":**
      If AC is global, contributors will inevitably use it lazily in places where it isn't needed, slowly eroding the constructive content of the library. Requiring an explicit `open classical` or `axiom choice` block forces the contributor to make a conscious decision, acting as a friction point that preserves constructive proofs where possible.

  **Why this lands for the Classical/Pro-Choice Camp:**

  1.  **No Block on Classical Math:**
      We are not banning AC. We are simply quarantining it. You can still prove Tychonoff's theorem. You can still do ZFC-style mathematics. You just have to declare that you are doing so in that file.
  2.  **Standard Practice:**
      This is the architecture used by Lean's `mathlib` and major Coq libraries. It has proven scalable. It allows the library to serve both communities without fracturing.

  ### Why Not Fork?

  Forking into `lib-classical` and `lib-constructive` is a failure mode we must avoid.
  *   **Duplication of Effort:** Basic definitions (groups, topological spaces) would need to be maintained in two places.
  *   **Fragmented Verification:** We lose the benefit of a single source of truth.
  *   **Interoperability:** Classical users often need constructive lemmas. A fork makes importing constructive results into a classical context harder than necessary.

  ### Implementation Plan

  To make this work without burdening contributors, we will implement the following:

  1.  **CI Linter:** Add a check that flags any use of AC/Classical logic in files not marked as `noncomputable` or `classical`.
  2.  **Documentation:** Clearly label the "Constructive Core" in our docs. Users who want guaranteed computability know to import only from unmarked modules.
  3.  **PR Template:** Contributors must declare if their PR introduces new classical dependencies.

  ### Conclusion

  Declaring AC a global axiom is a permanent architectural decision that cannot be easily reversed. It sacrifices the constructive guarantees that distinguish formalized math from traditional pen-and-paper proofs.

  By choosing **Opt-In Scoping**, we respect the constructive users' need for transparency and computability, while fully accommodating the classical users' need for expressive power. We keep the community together, the dependency graph honest, and the code extractable where possible.

  I ask that we vote to adopt the **Opt-In Scoping** policy at next week's call.

  Regards,

  [Your Name]
  Maintainer
