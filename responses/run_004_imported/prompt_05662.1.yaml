  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe suggest a "Classical" submodule?
      *   *Correction:* Better to suggest file-level or section-level scoping, as that's how Lean/Coq usually handle it. `noncomputable theory` at the top of a file is standard.
      *   *Crucial Point:* I need to make sure the anti-choice camp understands that *global* AC prevents *any* code extraction from the library, even for simple arithmetic that doesn't use AC. Wait, actually, if AC is an axiom, it doesn't necessarily break computation of *other* things unless they depend on it. But it does break the *guarantee* that the logic is constructive. The stronger argument is about *modularity* and *transparency*. If I import `LinearAlgebra`, I shouldn't get Choice unless I know I'm getting Choice.
      *   *Refined Argument:* Focus on "Dependency Tracking." If AC is global, dependency tracking is useless. If tagged, we know exactly which theorems rely on it.

  6.  **Final Polish:**
