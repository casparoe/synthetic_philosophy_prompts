answer: |-
  **Eulogy for Marcus**

  Thank you for coming. For those of you who knew Marcus only as a brother or an uncle, I'm Dana. I was one of his advisees. For those of you who knew him as a colleague, I'm the one who still has his key to the lab.

  Standing here, looking at the casket, it is tempting to say the things we usually say at funerals. To say that Marcus is still with us. That he lives on in his papers, in his lectures, in the notebooks stacked on his desk.

  But if I said that, half of you would nod, and the other half would shift in your seats. Because Marcus spent thirty years arguing that a notebook sitting on a desk is just paper and ink. He was very specific about that. He didn't believe that information stored outside the brain was the same as thinking. He didn't believe meaning was out there in the world, waiting to be found. He believed that the *process* of thinking extends beyond the skull only when there is a reliable, trusted loop between the person and the tool.

  He used to say that where the mind "actually" ends is a boring fact about biology, not some sacred boundary worth defending.

  Today, the biology has failed. The brain has stopped. By his own definition, Marcus's mind has ceased. To claim otherwise would be to disrespect the rigor he demanded from us. He wouldn't want comfort bought with philosophical errors.

  But that rigor is exactly where the comfort is.

  Marcus didn't just write about the extended mind; he built one. He didn't treat his notebooks as storage; he treated them as partners. And more importantly, he treated *us*—his students, his colleagues, his family—as part of that cognitive system. He trusted us with his half-formed thoughts. He offloaded his doubts onto us. He relied on our corrections the way Otto relied on his notebook. He coupled his thinking to ours.

  When a node in a network goes dark, the network doesn't necessarily dissolve. It reconfigures.

  The colleagues in the room know that the Extended Mind Thesis isn't about immortality. It's about function. But for the rest of you, here is what that means in practice: Marcus is not in the boxes of papers in his study. Those are just static traces. Marcus is in the arguments we are still having with him. He is in the methods we use to test our own memories. He is in the way his sister checks her calendar, or the way his undergraduates structure their research questions.

  He lives on not because his words are sacred, but because his tools are still useful.

  If we put his notebooks on a shelf and treat them like relics, they become just paper. He would have hated that. But if we open them, if we read them with the intent to argue, to verify, to trust where trust is due and correct where correction is needed, then the loop closes again. Not his loop—ours. We extend our own minds through the scaffolding he built.

  So, I am not going to promise you that Marcus is watching over us. I am not going to promise that his spirit is in this room.

  I am going to ask you to do something harder. I am asking you to use him.

  Read the drafts. Argue with the margins. Teach his theories to your own students, not as dogma, but as tools to be tested. If you treat his work as a static monument, he is gone. If you treat it as a active component of your own thinking, if you trust it enough to let it change how you process the world, then the system remains functional.

  The biology is a boring fact. We can't change it. But the boundary of where Marcus ended and where we begin was always porous. He taught us that we are not confined to our own skulls. We are not isolated. We are coupled.

  As long as we keep the coupling active, as long as we keep the loop open, the thinking continues.

  Thank you.
