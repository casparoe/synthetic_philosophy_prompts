  *Better angle:* Marcus viewed the boundary as boring. So focusing on his biological death is focusing on the boring part. The interesting part is the functional system. That system included *us*. We are still here. Therefore, the functional system is still active, just reconfigured.

  *Let's go with that.* We were part of his cognitive loop. We are still here. The loop is open, waiting for input.

