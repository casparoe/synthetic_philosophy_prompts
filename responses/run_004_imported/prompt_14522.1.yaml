prompt: |-
  I'm about two-thirds into my current novel and I've hit a scene I don't trust myself to draft straight, so I want to farm out a rough version and then work it into my own voice after. My narrator, Dana, has to give the eulogy for her old grad school advisor, Marcus, a cognitive scientist who spent his whole career as one of the go-to defenders of the extended mind thesis -- the Clark and Chalmers stuff, Otto and his notebook, the argument that your mind doesn't stop at your skull if something outside it (a notebook, a phone, another person) is coupled into your thinking reliably enough. He was always fussy about distinguishing this from the older Putnam-style point about meanings depending on the world -- for Marcus it was never about content, it was about the process of thinking itself being partly made of stuff outside your head. His line, the one all his students quote at parties, was that where the mind "actually" ends is a boring fact about biology, not some sacred boundary worth defending.

  The scene is hard because the funeral has two audiences and Dana can feel them listening differently. Half the pews are department colleagues, including a few who spent their whole careers telling Marcus that being causally hooked up to something isn't the same as that thing being part of your mind, and they'll absolutely notice if she reaches for something the theory can't actually support. The other half is his sister and a pile of ex-undergrads who just want to hear that some part of him is still around. The easy line -- "he lives on in his notebooks, his lectures, the lab he built" -- is exactly the sentence that'll make the colleagues wince, since on Marcus's own account a notebook that nobody's brain is actively trusting and reading anymore isn't part of a mind at all, its just paper. My one beta reader called my first attempt at this speech "a nice card any dead professor could've gotten," which, fair.

  Could you write the actual eulogy Dana delivers? Something that could plausibly be read aloud in about four or five minutes, and that earns whatever comfort it offers honestly out of the theory itself, rather than quietly setting extended mind aside for the length of the speech and picking it back up again at the reception.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Context:** A novel scene, 2/3rds through.
      *   **Character:** Dana (narrator), grad student/advisee of the deceased.
      *   **Deceased:** Marcus, cognitive scientist, proponent of the Extended Mind Thesis (EMT) - Clark & Chalmers style (Otto's notebook).
      *   **Key Philosophical Point:** It's not about content/meaning (Putnam), it's about the *process* of thinking being partly external. The boundary of the skull isn't sacred. Crucially: A tool is only part of the mind if it's *actively coupled* and *trusted* in the process. A dormant notebook is just paper.
      *   **Audience:** Split.
          *   Group A: Department colleagues/critics (skeptics of EMT). They will spot philosophical inaccuracies or sentimental misappropriations of the theory.
          *   Group B: Family (sister) and ex-undergrads. They want comfort, continuity, and the idea that "he lives on."
      *   **The Conflict:** The easy comfort ("he lives on in his notes") violates the theory (dormant notes $\neq$ mind). The strict theory ("his mind ceased when his brain stopped coupling") is too cold for a funeral.
      *   **Goal:** A eulogy (4-5 minutes spoken) that navigates this tension. It must be philosophically honest to Marcus's specific view while still offering genuine emotional resonance to the non-experts. It needs to sound like Dana (though the user will polish voice later, the core logic and tone need to be established).

  2.  **Deconstruct the Philosophy (Extended Mind Thesis - EMT):**
      *   *Core claim:* Cognitive processes aren't just in the head. If I use a notebook reliably to store info I can't recall, and I trust it implicitly, the notebook is part of the cognitive system.
      *   *The Trap:* "He lives on in his writing."
      *   *The EMT Rebuttal:* Writing is static. Without a brain coupling with it, it's not *thinking*. It's just ink.
      *   *The Solution:* How do we keep the *process* alive? Through *interaction*. The mind exists in the *loop*. If we engage with his work, if we trust his tools, if we let his ideas couple with our thinking, the system reactivates. The "mind" isn't a substance that persists; it's a *activity* that can be rejoined.
      *   *Marcus's specific quirk:* He hated the "sacred boundary" of the skull. He cared about the *reliability* and *trust* of the coupling.

  3.  **Determine the Tone:**
      *   Needs to be respectful but intellectual enough for the colleagues.
      *   Needs to be warm enough for the family.
      *   Needs to avoid cliché ("he's in a better place," "his spirit lives on").
      *   Needs to acknowledge the tension without explicitly saying "I know you guys disagree." It should demonstrate the theory in action.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Establish Dana's relationship. Mention Marcus's specific focus (the boundary).
      *   **The Philosophical Hook:** Address the "Otto's Notebook" idea directly. Acknowledge the common misinterpretation (that objects hold the mind). Correct it gently.
      *   **The Pivot (The Comfort):** If the mind is in the *coupling*, how do we mourn? We mourn the loss of the central node, but we acknowledge the system remains active if *we* step in. We become the new coupling.
      *   **Addressing the Critics:** Implicitly acknowledge that the brain is gone. Don't claim he's "still here" in a mystical sense. Claim that the *work* demands a partner.
      *   **Addressing the Family/Students:** You don't need to understand the theory to feel the connection. When you use his methods, when you think with his ideas, you are extending your mind through his.
      *   **Closing:** A call to action. Not "remember him," but "use him." "Think with him."

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is saying "we become his mind" too weird?
      *   *Fix:* Frame it as *we* extend *ourselves* through *him*. Or, better: The cognitive system he built (the lab, the papers, the students) is still a viable scaffold. If we trust it, it functions.
      *   *Key Distinction:* Marcus argued the boundary is boring. So, don't focus on where he *ended*. Focus on where the thinking *continues*.
      *   *Specific Line:* Need to include the "boring fact about biology" line mentioned in the prompt. It's his signature.
      *   *Avoiding the Trap:* Do not say "his notes are his mind." Say "his notes are an invitation to couple."

  6.  **Drafting the Content (Iterative Process):**
      *   *Start:* Standing here, looking at the casket. The biological fact.
      *   *Middle:* The theory. Otto's notebook. People think it means the notebook is magic. It doesn't. It means the *use* is what matters.
      *   *Application:* Marcus treated us like notebooks. We treated him like one. The trust was the key.
      *   *Resolution:* The system is broken, but the components are here. If we pick them up and trust them, the thinking happens again.
      *   *Ending:* A specific instruction. Read the notes. Argue with them. That's the only way he stays "extended."

  7.  **Polishing for Voice (Dana):**
      *   Dana is a grad student. She knows the jargon but is grieving.
      *   She needs to sound slightly defensive of him against the skeptics, but honest enough not to embarrass him.
      *   Keep sentences varied for spoken rhythm.
      *   Ensure the philosophical distinction (process vs. content) is clear but not lecture-heavy.

  8.  **Final Review against Constraints:**
      *   4-5 minutes? (Approx 600-750 words spoken at a moderate pace).
      *   Philosophically accurate to Clark/Chalmers? (Yes, focuses on active coupling/trust).
      *   Satisfies both audiences? (Colleagues get the accuracy, family gets the continuity).
      *   No "he lives on in his heart" clichés.

  9.  **Final Polish:** (Writing the actual text based on the above plan). *Self-Correction:* Make sure I don't make it sound like *Dana* is the only one extending him. It has to be the community. The "system" survives.

