answer: |-
  Thank you all for being here. For those who knew my mother only as family, you know her warmth, her curiosity, and the way she listened to you as if nothing else mattered. For those who knew her as a colleague, you know that same quality applied to her work: a rigorous, uncompromising attention to what was true, and what was real.

  She died last Sunday. And in the days since, as we've made arrangements, I have been mindful of the instructions she left. She loved you all too much to ask that her funeral become a platform for debate, but she also loved the truth too much to ask that it be softened for the sake of comfort.

  She asked that we not say she has "found her answer now." She asked that we not say she is "with Him at last."

  I know that for some of you, these phrases are the bedrock of how you process grief. To withhold them might feel like a subtraction of care. But to use them would be to erase the very thing that made her intellectual and spiritual life so profound. My mother was not an atheist because she was angry at God, or indifferent to Him. She was not concerned primarily with the problem of suffering, or the problem of evil. Her life's work turned on a different axis: the problem of divine hiddenness.

  She argued, carefully and in print, that if a perfectly loving God existed, a relationship with that God would be possible for anyone who was genuinely open to it. She counted herself as what the literature calls a "nonresistant nonbeliever." That is a technical term, but the experience behind it was deeply personal. It means she sought a relationship in good faith. She kept herself open. She did not turn away. And yet, the relationship did not come.

  For her, that persistent silence was not just a disappointment; it was evidence. It was evidence that the world we live in does not contain the kind of God she longed for—a God whose primary nature is to be known and loved by His children.

  I tell you this not to correct the believers in this room, but to honor the seeker who was my mother. Because I think there is something here that bridges the divide between her position and yours.

  To my mother's colleagues: You will recognize that she never wavered. She did not soften her argument at the end. She remained a nonresistant nonbeliever to the last, because she remained honest to the last.

  But to her family, and to those of you who hold deep religious faith: I want to suggest that her unbelief was not a rejection of love, but a testament to how high she set the bar for it. She refused to settle for a God who hides. She refused to pretend that silence was speech. In that way, her life was a witness to the value of relationship. She valued the connection with the Divine so highly that she could not accept a counterfeit.

  There is a strange comfort in that, I think. We often speak of faith as a virtue of belief. But my mother taught us that there is also a virtue in the integrity of the search. She lived in the tension of wanting a love that she could not find. That is a form of suffering, yes. But it is also a form of devotion. She was faithful to her conscience, just as you are faithful to your creeds.

  So, how do we say goodbye?

  We cannot say she has gone to the place she hoped for but could not find. We cannot say the silence has been broken.

  But we can say this: The love she argued for—the kind of love that does not hide, the kind of love that makes itself unmistakably known—we saw that love in her. We saw it in her classroom, in her office hours, in her kitchen, and in her embrace.

  If there is a perfectly loving God, my mother argued, we would all know it. Since we do not all know it, she concluded, we must look for love where it is visible. We must look for it in each other.

  In that sense, she leaves us with a commandment that both the believer and the nonbeliever can keep. Do not hide from one another. Do not offer easy answers where there are hard questions. Love the people in front of you with a clarity that leaves no room for doubt.

  She sought a relationship that was always open, always available, and perfectly loving. She didn't find it in the heavens. But in her life, and in the grief we share today, many of us found it in her.

  We will miss her. We will miss her mind. We will miss her honesty. And we will honor her best by continuing to seek, just as she did, without flinching from what we find, and without pretending to know what we do not.

  Rest now, Mom. Your seeking is done.
