prompt: |-
  My mother, who taught philosophy of religion for most of her career, died last Sunday. She was never an atheist of the angry or dismissive kind: her considered position -- defended in print, and unchanged to the end -- was that she counted as what the literature, following Schellenberg, calls a "nonresistant nonbeliever": someone genuinely open to a relationship with God, who had sought one in good faith, and whose persistent, unwilled failure to believe she took as real evidence against a perfectly loving God. She was always careful to distinguish this from the problem of evil, since her argument turned on love and relationship rather than suffering. She left instructions that her funeral not quietly walk any of this back: no "she's found her answer now," no "she's with Him at last." I'm giving the eulogy for a room that will be half her old department, who will notice at once if I flatten her position into generic fence-sitting, and half family, some of them quite devout, who will expect the usual consolations and may find their absence startling on top of everything else. Please write it: precise enough that her colleagues recognize it as hers, careful never to reach for the comfort she spent her career arguing against, and still able to leave the believers in that room feeling cared for rather than corrected.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** A philosophy of religion professor.
      *   **Position:** "Nonresistant nonbeliever" (Schellenberg's Divine Hiddenness argument). She believed in a perfectly loving God but didn't believe God existed because she couldn't find evidence of a relationship despite seeking one in good faith.
      *   **Key Distinction:** Not an angry atheist; not the Problem of Evil (suffering), but the Problem of Divine Hiddenness (love/relationship).
      *   **Instructions:** No false comfort ("she's with Him now," "she found her answer").
      *   **Audience:** Mixed. Half colleagues (philosophy department, will spot inaccuracies or softening), half family (some devout, expect traditional religious comfort).
      *   **Goal:** Honor her intellectual integrity without alienating the believers. Precise enough for colleagues, compassionate enough for family.

  2.  **Determine the Tone:**
      *   Respectful, intellectual but warm, honest, unflinching yet gentle.
      *   Avoid apologetics (defending her view aggressively) but also avoid capitulation (softening her view for comfort).
      *   Focus on *love* and *seeking* as the common ground between her philosophy and the believers' faith.

  3.  **Key Themes to Weave:**
      *   **Integrity:** She lived what she thought.
      *   **Love:** Her argument was about the nature of love (a loving God wouldn't hide). This resonates with believers who also value God's love.
      *   **Seeking:** She didn't turn away; she looked hard. This mirrors the religious virtue of seeking God.
      *   **Honesty:** The comfort comes from truth, not platitudes.
      *   **Legacy:** Her life *was* the argument.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss. Set the scene. Address the mixed audience implicitly.
      *   **Her Work/Position:** Need to state her view clearly but accessibly. Use the term "nonresistant nonbeliever" or explain it. Crucial: Frame it as a testament to her desire for relationship, not a rejection of it.
      *   **The Tension:** Acknowledge the difficulty of the funeral context. Address the instructions gently.
      *   **Bridging the Gap:** How to comfort the believers without lying? Focus on the *quality* of her searching. Believers value faithfulness; she was faithful to her conscience. Believers value love; her argument was grounded in the high standard of love.
      *   **Closing:** A farewell that honors her silence/absence without filling it with noise.

      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm preaching atheism to the family. I need to sound like I'm honoring *her* specific kind of honesty. The comfort for the family shouldn't be "she's in heaven," it should be "she was loved by us, and she loved truth."

      *   *Refining the Philosophy:* Ensure the distinction from the Problem of Evil is clear. It's about hiddenness, not pain. It's about a personal relationship being absent, not bad things happening.

      *   *Refining the Audience Management:*
          *   Colleagues: Will look for "nonresistant nonbeliever," "Schellenberg," "divine hiddenness," "perfectly loving God."
          *   Family: Will look for warmth, memories, acknowledgment of grief, respect for their faith even if hers differed.

  5.  **Drafting the Content (Iterative Process):**

      *   *Start:* Thank everyone. Mention the date (last Sunday).
      *   *Middle:* Talk about her career. She taught philosophy of religion. She wasn't against God; she was against the *idea* of a God who hides. This is actually a very high view of God.
      *   *The "Instructions":* Address the elephant in the room. She asked for honesty.
      *   *The Bridge:* To the believers: You believe in a God of Truth. She pursued Truth. You believe in a God of Love. She argued from Love. We meet there.
      *   *End:* We miss her. The silence is hard. But we honor her by speaking true things.

  6.  **Polishing the Language:**
      *   Avoid jargon where possible, but keep the specific philosophical terms for the colleagues.
      *   Ensure the rhythm is suitable for speech (pauses, emotional beats).
      *   Check for accidental theological claims (e.g., don't say "she is at peace" if that implies an afterlife she doubted). Instead, say "she rests from her seeking."

  7.  **Final Review against Constraints:**
      *   Did I say she's with God? No.
      *   Did I say she found the answer? No.
      *   Is the philosophy accurate? Yes (Schellenberg, nonresistant, love vs. evil).
      *   Is it kind to the family? Yes, focuses on shared values of love and truth.

  8.  **Final Polish:** (Mental check of the "Nonresistant Nonbeliever" definition). It means she *would* believe if the evidence were there, but it isn't, and that absence is evidence against a loving God. The eulogy needs to reflect that this was a *painful* absence, not a smug dismissal. It was a longing. *This is the key to connecting with the religious family.* Her unbelief was a form of longing for God.

      *(Self-Correction)*: Make sure to explicitly mention that her lack of belief was not a lack of desire. That is the emotional hook.

