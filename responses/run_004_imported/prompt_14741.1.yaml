answer: |-
  This is one of the richest problems a writer can encounter, precisely because it isn't just a plot hole—it's a human hole. You have stumbled onto the central tension of biography, history, and memory itself.

  To answer your second question first, because it dictates the answer to the first: **You are not missing a trick. The ambiguity is real.**

  ### The Philosophical Question: Is it Unknowable?

  Yes. In philosophy of mind and action theory, this is known as the **underdetermination of action by motive.** A single action (staying in a marriage) can be the result of infinite combinations of internal states (duty, fear, guilt, love, financial pragmatism, religious belief).

  Without direct access to the subject's internal monologue (a diary, a confession), there is no principled way to definitively rank those motives. Your sister, your brother, and you are all looking at the same data points and applying different *narrative frameworks* to them.
  *   **Sister's Framework:** Virtue Ethics (He acted to be a "good man").
  *   **Brother's Framework:** Psychological Avoidance (He acted to minimize pain).
  *   **Your Framework:** Psychoanalytic/Secret History (He acted to atone for a sin).

  All three are coherent. All three fit the facts. This is the **Rashomon Effect** applied to real life. The "truth" of a person is not a solid object buried in the past waiting to be dug up; it is a collaboration between the person who acted and the people who remember them.

  If you try to "think about it more" to break the tie, you will only find more evidence that supports all three theories. That isn't a failure of your deduction; it's a feature of human complexity. Most people are not driven by one pure motive. He likely stayed in the marriage *because* he valued duty, *and* because he feared conflict, *and* because he felt guilty about something. Those things are not mutually exclusive; they are braided together.

  ### The Writing Question: How to Write Him Honestly

  This snag is not an obstacle to your novel; **it is the novel.**

  If you pick one theory and write it as absolute fact (e.g., "He stayed only because he was cowardly"), you flatten a real human into a plot device. You also alienate your sister and brother, whose readings of him are part of his legacy.

  Here are three ways to handle this in the manuscript, ranging from structural to thematic:

  **1. The "Motive Stack" (Character Depth)**
  Instead of choosing one theory, assign them to different moments of decision. Human beings are inconsistent.
  *   In Chapter 5, when he turns down the job, show us the *fear*. Let us feel his visceral terror of the unknown.
  *   In Chapter 15, when he stays in the marriage, show us the *duty*. Let him make a sacrificial prayer or a stoic resolution.
  *   In Chapter 30, when he gives the money, show us the *guilt*. A trembling hand, a hesitation, a look of relief.
  *   **Why this works:** It makes him feel real. Real people are cowards sometimes, saints other times, and penitents at the end. By allowing the motives to shift, you honor the complexity your family is arguing about.

  **2. The Biographer's Quest (Meta-Narrative)**
  Make the protagonist's struggle to understand the grandfather part of the plot. This is common in "autofiction" or novels like *The Sense of an Ending* or *Atonement*.
  *   The protagonist (you) tries to pin down *why* he did these things.
  *   You interview the sister (who insists on his nobility).
  *   You argue with the brother (who insists on his weakness).
  *   You find clues that point to your guilt theory.
  *   **The Resolution:** The book ends not with the answer, but with the acceptance that the grandfather *intended* to be unknowable. He left no diary *on purpose*. His silence was his final act of control.
  *   **Why this works:** It validates your family argument. It makes the "snag" the theme of the book. The truth isn't what he did; the truth is how his children remember him.

  **3. Negative Capability (Atmospheric Approach)**
  John Keats coined the term "Negative Capability" to describe a writer's ability to remain in "uncertainties, Mysteries, doubts, without any irritable reaching after fact & reason."
  *   Write the scenes so that the action is clear, but the internal monologue is opaque.
  *   Let the reader (and your family) project their own theory onto him.
  *   **Why this works:** It creates a character who haunts the book rather than inhabits it. He becomes a mirror. If your sister reads it, she sees a hero. If your brother reads it, he sees a cautionary tale. If you read it, you see a mystery. All three readings are "true" to the text.

  ### A Practical Suggestion for the "Money" Scene

  You mentioned the savings given to the cousin. This is the most specific, actionable clue you have.
  *   **Duty/Loyalty:** The cousin needed it more.
  *   **Fear/Conflict:** Splitting it evenly would cause a fight among the kids; giving it away avoids the fight.
  *   **Guilt:** The cousin was owed something (perhaps the "secret" you suspect).

  In the book, don't tell us why. **Show the cost.**
  If it was duty, show the satisfaction of a debt paid.
  If it was fear, show the relief of avoiding a confrontation.
  If it was guilt, show the trembling of the pen.

  ### The Verdict

  You asked if there is a principled way to figure out what he really valued. **No.** Values are internal; actions are external. The map is not the territory.

  But for the book? **Don't solve the mystery.** The fact that your family is still arguing about him means he is still alive in some way. The friction between your sister's idealism, your brother's cynicism, and your suspicion *is* the legacy he left behind.

  Write the book so that all three of you can read it and say, "Yes, that was him," even if you mean three different things by "him." That is the highest form of biographical truth you can achieve.
