answer: |-
  Here are ten questions designed to pressure-test the constitutional theory advanced in your 1860 Glasgow lecture, complete with follow-ups calibrated to the specific arguments you are known to make in this period.

  **1. The Argument from Silence**
  You argue that because the words "slave" and "slavery" are absent from the Constitution, the document cannot sanction property in man. Yet every delegate in Philadelphia understood that phrases like "Person held to Service or Labour" were euphemisms for slaves. If I write a contract that forbids "theft" but secretly agree with the other party that "theft" does not include stealing from a specific class of people, is that not a fraud? Why is the Constitution's silence not merely a face-saving circumlocution that everyone at the time understood as a wink to the slaveholder?
  *   **Follow-up:** You will likely reply that secret intentions are not law, only the text is. But if the text was deliberately crafted to deceive the public about its operation, does that not make the document itself a lie, regardless of what the words literally say?

  **2. The Framers' Bargain**
  Let us speak of the historical bargain. We know the Southern delegates demanded the Three-Fifths Clause and a twenty-year protection of the slave trade as the price of Union. If the Constitution is inherently antislavery, why did the slave states demand these specific concessions to join? Does your reading not require us to believe that the Southern framers were bargaining for protections the document already denied them?
  *   **Follow-up:** You tend to argue these were temporary compromises that expired or were limited. But if the "price of admission" for the South was these clauses, does nullifying their pro-slavery effect not break the original compact of the Union you claim to defend?

  **3. The Garrisonian Charge**
  William Lloyd Garrison calls this document "a covenant with death and an agreement with hell." He argues that a government which protects slaveholders in their "property" through the Fugitive Slave Clause is morally complicit. You say he is wrong. Where exactly does his inference fail? Is it a failure of moral perception, or a failure of legal reading?
  *   **Follow-up:** If you say it is a failure of legal reading, you imply Garrison cannot read. But if you admit it is a failure of moral perception, do you not concede that the *effect* of the law is pro-slavery, even if the *text* is pure? Can a moral man uphold a law whose effect is bondage?

  **4. The Fugitive Slave Clause**
  Article IV, Section 2 states that persons "held to Service or Labour" escaping into another state "shall be delivered up on Claim of the Party to whom such Service or Labour may be due." This sounds like a federal mandate to return fugitives. You argue there is no federal enforcement mechanism here. But if the text commands delivery, does the lack of a specific marshal matter when the duty is plainly stated?
  *   **Follow-up:** You often argue this applies to apprentices or indentured servants, not chattel slaves. But given the context of 1860, is that not a legal fiction? If a clause functions as a fugitive slave law in practice, does your semantic distinction save the conscience of the Northern man who obeys it?

  **5. The Presumption of Liberty**
  You rely heavily on the canon of construction that says ambiguous laws must be interpreted in favor of liberty. Where does this canon come from? Is it English Common Law, or is it a higher Natural Law? If it is Natural Law, do we not need the Constitution at all to justify abolition?
  *   **Follow-up:** If you say we need the Constitution to give that Natural Law political teeth, then you admit the text is merely a vessel. If the vessel is filled by the "presumption of liberty" regardless of its contents, why not just argue from Natural Law directly and discard the pro-slavery vessel entirely?

  **6. Judicial Authority vs. Textual Truth**
  Chief Justice Taney in *Dred Scott* declares that black men have no rights the white man is bound to respect and that the Constitution recognizes slaves as property. You say Taney is wrong about the text. But in a constitutional system, who decides what the text means if not the Supreme Court? Is your reading not merely a dissenting opinion with no force of law?
  *   **Follow-up:** You will argue that the Court's decision is not the Constitution itself. But if the highest tribunal says the text means X, and you say it means Y, are you not inviting anarchy? How do you enforce your reading without overturning the very government you seek to use?

  **7. "We the People"**
  You insist that "We the People of the United States" includes the enslaved, as they are people and they are in the United States. Yet the apportionment clause counts them as three-fifths of persons. How can the same document count you as a fraction of a person for representation but a whole person for citizenship?
  *   **Follow-up:** If you argue the Three-Fifths Clause is a penalty on the slaveholder rather than a degradation of the slave, does that not ignore the reality that the slave's humanity is being mathematically reduced to boost the master's political power?

  **8. The 13th Amendment Hypothetical**
  Imagine a future where the slave states are defeated and the nation adopts a formal amendment abolishing slavery outright. Would that amendment prove your reading of the unamended text was mistaken all along? Or would it merely show that the amendment made explicit what sound interpretation already implied?
  *   **Follow-up:** If you say it makes the implicit explicit, why is the amendment necessary? If the Constitution already abolished slavery by implication, is an amendment not redundant? If it is not redundant, does that not admit the original text was insufficient?

  **9. Political Power vs. Legal Truth**
  If the Constitution is already antislavery, as you claim, why is it necessary for abolitionists to seize political power? Why not simply demand that marshals and judges obey the existing text? Why form a new political party if the law is already on your side?
  *   **Follow-up:** You answer that "bad men" administer the government. But if the text is so clearly antislavery that it can withstand bad administrators, why has it failed for seventy years? Does your theory not require a level of civic virtue that does not exist to function?

  **10. The Moral Hazard of Legalism**
  Finally, Mr. Douglass, does this intense focus on legal hermeneutics risk dulling the moral outrage required to end slavery? By turning the Constitution into a puzzle of clauses and canons, do you not risk turning the blood of the slave into ink?
  *   **Follow-up:** You will say the law is a weapon. But if the weapon requires such complex handling that only lawyers can wield it, have you not removed the struggle from the hands of the common people who feel the moral weight most keenly?
