answer: |-
  This is a textbook case of what moral philosophers call **resultant moral luck**, and your intuition that something profound is amiss is shared by many ethicists, most notably Thomas Nagel and Bernard Williams, who brought this problem to the forefront of contemporary ethics in the 1970s and 80s.

  Given your background, you will appreciate that this dilemma sits precisely at the friction point between how we *evaluate actions* (science/professional standards) and how we *evaluate agents* (moral philosophy).

  Here is an analysis of why your sense of unfairness is defensible, why the field acted as it did, and where the genuine mistake lies.

  ### 1. The Philosophical Core: The Control Principle
  Your unease stems from a commitment to what philosophers call the **Control Principle**. This is the intuition that people cannot be morally assessed for what is due to factors beyond their control.

  *   **The Input:** Both fellows made an identical calculation. They exercised identical judgment. They violated the exact same protocol for the exact same reason.
  *   **The Variable:** The presence of a contaminant was entirely outside their control.
  *   **The Output:** One is celebrated; the other is ostracized.

  From a **Deontological (Kantian)** perspective, which focuses on duty and intent, the two fellows are equally culpable. They both treated the protocol (a duty of care to the animals and the scientific record) as a mere means to an end (the conference deadline). The moral worth of their action is determined at the moment of the decision to skip the check, not at the moment the suffering occurs. Therefore, morally, they are equals. To judge them differently is to violate the Control Principle.

  ### 2. The Counter-Argument: Consequentialism and Risk
  Why, then, did the field treat them differently? A **Consequentialist** would argue that the moral weight of an action is determined by its outcome.
  *   Fellow A produced knowledge with no net suffering.
  *   Fellow B produced knowledge with significant net suffering.

  However, most institutional review boards and professional bodies operate on a hybrid model that leans heavily on **Negligence Law**. In law, we see this distinction constantly. Consider two drunk drivers:
  *   Driver X drives drunk and gets home safely.
  *   Driver Y drives drunk and hits a pedestrian.

  Legally, X might get a misdemeanor; Y gets vehicular manslaughter. The *act* was identical; the *punishment* diverges based on the outcome. Society does this for two pragmatic reasons:
  1.  **Retribution:** We feel a natural urge to punish harm more than risk.
  2.  **Deterrence:** We hope that by severely punishing the outcome, agents will be terrified enough to avoid the risk.

  The field treated your postdocs like the drunk drivers. They punished the *harm* (B) rather than the *breach of protocol* (both).

  ### 3. Where the Mistake Lies
  You asked if there is a "genuine mistake being made here." I would argue there is, but it is a category error rather than a simple ethical failure.

  The mistake is conflating **Moral Culpability** with **Professional Liability**.

  *   **Moral Culpability:** This asks, "How blameworthy is the character of the agent?" Here, the field was wrong. Both fellows displayed the same lack of virtue (prudence, integrity, duty). By allowing Fellow A to become a "landmark" figure, the field implicitly endorsed his judgment as sound, when it was actually just lucky. This corrupts the moral ecology of the profession. It teaches young scientists that compliance is optional *if* you don't get caught.
  *   **Professional Liability:** This asks, "What are the consequences of this breach for the institution and the subjects?" Here, the field's reaction is understandable, if harsh. Fellow B's trial was compromised. The data may be tainted (due to the contaminant). The institution is liable for the animal suffering. Fellow B became the lightning rod for that liability.

  ### 4. The Verdict on Your Intuition
  Your sense of unfairness is **philosophically defensible**.

  Nagel argues that moral luck creates a paradox: we believe the Control Principle, yet we cannot stop judging people based on outcomes. We *cannot* help but view Fellow B as "the one who hurt the mice" and Fellow A as "the one who made the discovery."

  However, a mature ethical framework requires us to resist that intuition in our *judgment of character*, even if we accept it in our *management of risk*.

  The field was likely right to reprimand Fellow B for the harm caused (liability). They were wrong to let Fellow A off scot-free (culpability). The true ethical failure was not just the punishment of B, but the **immunity of A**.

  If the institution had reprimanded *both* fellows equally for the protocol violation—regardless of the outcome—they would have upheld the Control Principle. They would have signaled that the violation of duty is the crime, not the bad luck of a contaminant.

  ### Summary
  You are not refusing to accept that carelessness causing harm deserves a different response. You are correctly identifying that **moral blameworthiness should not be hostage to fortune.**

  The tragedy of this episode is not just that Fellow B was punished, but that Fellow A was rewarded. That reward validates the risky behavior, ensuring that other scientists will make the same "private judgment call" in the future, gambling that their batch will be as clean as his.

  In your discussion group, you might frame it this way: **Outcome determines liability, but intent determines culpability.** The field punished B's liability while ignoring A's culpability. That asymmetry is the source of the injustice you have felt for forty years.
