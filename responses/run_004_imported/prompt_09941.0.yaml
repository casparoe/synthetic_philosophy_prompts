          *   *Key Concept:* **Priors over Preferences.** The brain has a prior belief that "I should be fed/safe/social." A dark room violates these deep priors.
          *   *Epistemic Value:* We also seek information to reduce *long-term* uncertainty. A dark room is high certainty but high risk of death (long-term surprise).
          *   *Comparison:* Does PP solve this differently? PP usually incorporates "goals" as high-level priors. So functionally, they converge. But FEP provides the mathematical justification for *why* those priors exist (survival).
      *   *Refining the Dark Room Explanation:* I need to be careful not to get bogged down in math. Use the concept of "Deep Priors" or "Preferences." The brain predicts it will eat. If it sits in a dark room, it starves. Starving creates massive prediction error eventually (death). So the model that says "go find food" minimizes *long-term* free energy better than "sit in dark room."

