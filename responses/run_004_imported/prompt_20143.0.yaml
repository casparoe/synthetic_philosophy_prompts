answer: |-
  This is a profound question that cuts to the heart of moral philosophy: does obligation reside in the social world we inhabit, or in the structure of the interactions we have undertaken? You are asking whether the binding force of a promise is *extrinsic* (dependent on a living community to enforce or validate it) or *intrinsic* (dependent on the logic of the act itself).

  To answer this rigorously, we must look past the surface summaries of Hume and Scanlon and examine the specific mechanisms they propose for how a promise becomes binding. We will then test those mechanisms against your specific constraints: the promise is secret (no social enforcement) and the promisee is dead (no living victim).

  ### I. Hume: The Architecture of Artificial Virtue

  To understand why Hume struggles with your case, we must understand why he rejects the "natural" view of promising.

  **1. The Rejection of the "Act of Will"**
  Hume begins by dismantling the idea that saying "I promise" is a magical mental act. He argues that you cannot create a new moral obligation simply by willing it, any more than you can change the physical world by wishing. If obligations were natural, they would exist in a "state of nature." But Hume observes that in a state of nature (without society), promises are meaningless. Therefore, the obligation of a promise is not natural; it is an **artificial virtue**.

  **2. The Convention of Justice**
  For Hume, promising is a linguistic technology invented to solve a coordination problem. Humans need to exchange goods and services across time (I help you now, you help me later). But we are naturally selfish and prefer immediate gain. To overcome this, we invent a convention: a specific form of words ("I promise") that acts as a signal.
  *   **The Mechanism:** When I use these words, I am not creating a mystical duty; I is placing myself into a social practice.
  *   **The Binding Force:** Why am I bound? Not because of the words, but because **society has a vested interest in me keeping them.** If people routinely broke promises, the practice would collapse, and everyone would suffer.
  *   **The Moral Sentiment:** We feel a "moral sentiment" (a feeling of approval or disapproval) toward promise-keeping. This sentiment is not innate; it is cultivated through sympathy with the **public interest**. I feel bad when I break a promise because I sympathize with the disorder it causes in the social fabric.

  **3. The Role of Sanction and Visibility**
  Crucially, Hume's system relies on the *possibility* of resentment. In *Treatise* 3.2.2, he notes that the obligation to justice depends on the existence of a society where others can hold you to account. The "sanction" is the resentment of your peers. Even if they don't catch you *this time*, the system works because generally, breaches are detectable and resented. The feeling of obligation is a psychological internalization of this social pressure.

  **4. Hume's Verdict on Your Case**
  Strictly on Humean terms, your promise faces two fatal structural problems:

  *   **The Problem of the Dead Partner:** Humean justice is a convention between living agents to facilitate mutual advantage. When your aunt died, the "game" ended. There is no longer a reciprocal relationship. For Hume, duties to the dead (like executing wills) are only binding insofar as society *currently* agrees to honor them to maintain stability for the living. But your promise is not a matter of public record; it is not part of the current social stability.
  *   **The Problem of Secrecy:** This is the deeper failure. Hume's obligation is fueled by sympathy with the public interest. If *no one* knows about the promise, breaking it causes no social instability. No one's trust in the institution of promising is weakened because no one knows the institution was invoked. Furthermore, since no one can resent you, the psychological mechanism of "fear of resentment" or "sympathy with those who resent" is absent.

  **The Humean "Move" (and why it fails):**
  A Humean might try to save the obligation by appealing to **character**. Hume admits that we cultivate habits of virtue. If you break this promise, you might weaken your own disposition to keep promises in general, which could lead you to break public promises later.
  *   *Why this fails:* Hume is a consequentialist about virtue. If breaking *this* secret promise actually strengthens your character (e.g., by relieving a burden that was harming your ability to function in society), Hume would not say you are bound. The obligation is not in the act itself, but in its utility. Since the act is secret and the promisee is dead, the utility is negligible.
  *   **Conclusion:** On Hume's own terms, the binding force evaporates. The "circuit" of justice requires a living society to complete it. Without a living promisee and without a public convention, the "artificial virtue" has no ground to stand on. Hume would likely say your feeling of obligation is a superstition—a leftover sentiment from when the convention was active, but one that no longer tracks real moral duty.

  ---

  ### II. Scanlon: The Architecture of Principle F

  T.M. Scanlon's contractualism offers a radically different mechanism. He is not interested in social utility or conventions, but in **justifiability**.

  **1. The Contractualist Framework**
  For Scanlon, an act is wrong if it violates a principle that no one could reasonably reject. Morality is about living with others on terms they could not reasonably reject. This shifts the focus from "social stability" (Hume) to "individual standing."

  **2. Principle F (The Principle of Fidelity)**
  In *What We Owe to Each Other*, Scanlon derives the obligation of promising from a more fundamental duty not to manipulate others. He formulates this as **Principle F**. Roughly, it states:
  *   If I intentionally lead you to expect that I will do X,
  *   And I know you want this assurance,
  *   And I act to provide this assurance (by saying "I promise"),
  *   And you know I have done these things...
  *   Then I must do X (unless you release me).

  **3. The Source of the Binding Force**
  Why does Principle F bind me? It is not because society needs it. It is because of the **value of assurance**.
  *   **The Wrong:** When I break a promise, I am not just failing to do an action; I am abusing the trust I invited. I manipulated your decision-making. You relied on my word to plan your life or find peace. To break the promise is to retroactively turn that reliance into a tool I used against you.
  *   **The Audience:** The "court" that judges this is not public opinion (as in Hume), but **reason**. Would a principle that allowed me to break this promise be reasonably rejectable?

  **4. Scanlon's Verdict on Your Case**
  Scanlon's framework has significantly more resources to handle your situation, specifically regarding the **temporal nature of the obligation**.

  *   **The "Dead Promisee" Problem:** You worry that your aunt cannot be disappointed. Scanlon would argue this misunderstands the locus of the wrong. The wrong of breaking a promise is not solely located in the *moment of disappointment*. It is located in the **violation of the principle governing the past interaction**.
      *   When you made the promise, you invoked a principle of fidelity. You asked her to trust you based on a rule that says, "When someone assures you they will do X, they will do X."
      *   Does death void the principle? Scanlon argues (in discussions regarding wills and duties to the dead) that people have **interests** that survive their death. Your aunt had an interest in her final wishes being respected. By assuring her, you tied your will to her interest.
      *   **The Move:** The binding force comes from the fact that a principle allowing "promises are void upon the death of the promisee" could be **reasonably rejected** by anyone. Why? Because *everyone* will die, and *everyone* has an interest in being able to settle their affairs or find peace before they die. If the principle were "promises to the dead don't count," no one could rely on deathbed assurances. Therefore, the principle that *does* count them is one no one could reasonably reject.

  *   **The "Secret" Problem:** Scanlon does not care if the breach is secret. Hume needs public resentment to generate the sentiment; Scanlon only needs the **invalidity of the justification**.
      *   If you break the promise, can you justify it to your aunt (in principle)? No.
      *   Can you justify it to yourself as a rational agent? No, because you are acting on a maxim ("I can break secret promises to the dead") that undermines the very practice of assurance you rely on for your own life.
      *   The obligation is not enforced by others finding out; it is enforced by the **inconsistency of your will**. You cannot rationally will that everyone break promises to the dead, because you would not want promises made to *you* (before you die) to be broken after you die.

  **5. Where Scanlon Might Struggle (and the Counter-Move)**
  A strict reading of Principle F requires that the promisee *knows* the assurance was given. Your aunt did know *at the time*. Does she need to know *now*?
  *   *The Objection:* Principle F is about preventing *current* manipulation. If she is dead, she isn't being manipulated now.
  *   *The Scanlonian Defense:* The manipulation occurred **at the time of the promise**. If you never intended to keep it, you lied then. If you *did* intend to keep it but now change your mind, you are violating the **principle of fidelity** that made that past interaction valid. The duty survives because the *reasons* for the principle (protecting the ability to form reliance) extend beyond the lifespan of the individual. Scanlon explicitly acknowledges that contractualism can ground duties regarding the dead because the *living* have reason to want principles that protect the interests of their past and future selves.

  ---

  ### III. Comparative Verdict

  You asked whether either theory, strictly on its own terms, has the resources to explain why your promise still feels binding.

  **1. Hume: Genuine Failure**
  Hume genuinely fails here. His theory is sociological. The "ought" of a promise is derived from the "is" of social utility.
  *   **Why:** In your case, the social utility is zero (no one knows) and the reciprocal partner is gone.
  *   **The Implication:** If Hume is right, your feeling of obligation is a psychological ghost. It is a habit formed when society was watching, persisting after the social context has vanished. Hume would advise you that you are under no *moral* obligation, though you may choose to keep it for the sake of your own emotional consistency. He cannot validate the *normativity* of your promise.

  **2. Scanlon: Successful Accommodation**
  Scanlon succeeds, but only if we accept the **timelessness of the Principle**.
  *   **The Move:** The obligation does not depend on your aunt's *current* ability to feel disappointment. It depends on the **unrejectability of the principle** that governs the transaction you entered.
  *   **Why it works:** A world where deathbed promises are void is a world where deathbed assurances are impossible. Since it is rational for all agents (including you) to want the ability to give and receive such assurances, the principle that binds you survives her death.
  *   **The Secret Aspect:** Scanlon's theory is internal to the agent's reasoning. It does not require an audience. The "binding force" is the impossibility of justifying the breach to oneself as a rational agent who values the power of assurance.

  ### Conclusion

  Your intuition that the promise remains binding aligns with **Scanlon**, not Hume.

  *   **Hume** tells you that morality is a game played with living people. Since the game is over, the rules no longer apply. If you feel bound, it is merely sentiment, not duty.
  *   **Scanlon** tells you that morality is about the terms on which we relate to one another as rational beings. The terms you agreed to (via Principle F) established a duty that was not contingent on her survival, but on the **value of the assurance itself**.

  If you want a philosophical framework that validates your feeling without calling it a superstition, Scanlon provides the move: **The duty is not to the living person, but to the principle of fidelity that made the interaction possible.** You are bound not because she can punish you, but because breaking the promise would violate a principle that you, as a rational being who values trust, could not reasonably wish to be universal.
