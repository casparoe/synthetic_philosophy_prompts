          *   POE forces us to distinguish between *accommodation* and *prediction*.
          *   Physicists often treat accommodation as weaker than prediction. POE explains *why* (because prediction involves risk, $P(E)<1$).

      *   *Implication 4: Idealization vs. Realism.*
          *   Bayesianism is an idealization (like frictionless planes).
          *   Real scientists aren't logically omniscient.
          *   Don't throw out the model because it's idealized.

  5.  **Addressing the "Physicist's Perspective":**
      *   Don't panic. Your practice was fine.
      *   The "confirmation" wasn't just $E$ supporting $H$. It was $H$ explaining $E$ *better than rivals*.
      *   The "news" wasn't $E$ itself, but the *structural relationship* between $H$ and $E$.
