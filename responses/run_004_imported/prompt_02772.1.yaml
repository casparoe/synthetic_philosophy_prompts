      *   **Topic:** Clark Glymour's "Problem of Old Evidence" (POE).
      *   **Specific Example:** Mercury's perihelion precession (known 1859, explained by GR 1915).
      *   **The Puzzle:** Standard Bayesianism says $P(H|E) > P(H)$ only if $P(E) < 1$. If $E$ is already known ($P(E)=1$), then $P(H|E) = P(H)$. No confirmation. But physicists *feel* GR was confirmed by Mercury.
      *   **Known Solutions:** Garber/Jeffrey (logical omniscience relaxation), Howson (counterfactual priors).
      *   **User's Anxiety:** This unsettles their view of past scientific practice. Is their intuition wrong? Is Bayesianism wrong?
      *   **Task:** Set out the most important implications of POE. Address how a physicist should think about historical episodes like Mercury. Address whether Bayesianism or practice/intuition should give way.

  2.  **Deconstruct the Problem of Old Evidence (POE):**
      *   *Core Issue:* Static vs. Dynamic Bayesianism. Standard Bayes is synchronic (at a time $t$). Science is diachronic (over time).
      *   *The "Static" Problem:* At $t_{1915}$, $P(\text{Mercury}) = 1$. Therefore $P(\text{GR}|\text{Mercury}) = P(\text{GR})$.
      *   *The "Dynamic" Reality:* Einstein *felt* confirmation. The community *felt* confirmation.
      *   *Why it matters:* It strikes at the heart of Bayesianism as a *normative* theory of scientific rationality. If it can't model the greatest success story of 20th-century physics, is it useful?

  3.  **Evaluate the Solutions (Briefly, to contextualize implications):**
      *   *Garber (Logical Omniscience):* Agents aren't perfect logicians. Learning $T \vdash E$ is new info. $P(T \vdash E)$ goes from $<1$ to $1$. This updates $P(T)$.
      *   *Howson (Counterfactuals):* Strip $E$ from the background knowledge $K$. Calculate $P(T | K - \{E\})$. Then update with $E$.
      *   *Christensen (Ur-Priors):* What would your prior have been before *any* evidence?
      *   *Likelihood Ratio (Key for Physicists):* It's not about $P(E)$, it's about $P(E|H)$ vs $P(E|\neg H)$.

  4.  **Drafting the Implications (The Core of the Response):**

      *   *Implication 1: The distinction between *psychological* discovery and *logical* justification.*
          *   Physicists care about *heuristic* power. "My theory *predicts* this number."
