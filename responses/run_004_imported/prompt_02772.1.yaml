      *   *Key Insight for Physicists:* The "evidence" isn't the number 43 arcseconds. The evidence is "GR entails 43 arcseconds without adjustable parameters." That proposition had probability < 1.

  9.  **Final Plan:**
      *   **Intro:** Validate the user's unease. It's a famous and deep problem.
      *   **Section 1: The Physicist's Intuition vs. The Formalism.** Distinguish between the *data* (Mercury) and the *theoretical derivation* (GR $\to$ Mercury).
      *   **Section 2: Implications for Historical Episodes.** Reinterpret Mercury. It wasn't $E$ confirming $H$. It was "H explains E" confirming $H$. Accommodation vs. Prediction.
      *   **Section 3: Implications for Bayesianism.** It's not a death knell. It shows Bayes needs to model *learning logical relations*, not just empirical data. Bounded rationality.
