answer: |-
  This is a classic tension between formal logic and social norms, and given your background, you're likely spotting the friction between *propositional truth* and *speaker credibility*. It makes perfect sense that this is sticking in your craw; it's essentially a live case study in moral psychology.

  Here is a principled way to untangle the three conflicting thoughts you (and your friends) are having.

  ### 1. Validity vs. Standing (The Logical vs. Social Distinction)
  Your second friend is arguing from **logic**; your first friend is arguing from **social standing**.

  *   **Friend 2 (Logic):** They are identifying the *Tu Quoque* fallacy (Latin for "you also"). Logically, the truth value of the statement "Cheating is wrong" is independent of the speaker's history. If R says "Gravity exists," it doesn't matter if R has fallen down a well before. Similarly, if R says "Cheating is destructive," her past doesn't make the statement false. Your friend is right that bringing up R's past doesn't technically invalidate the criticism of the cheater.
  *   **Friend 1 (Standing):** They are identifying a loss of **moral standing**. In social groups, the *right* to enforce a norm is distinct from the *truth* of the norm. When someone publicly shames another for a behavior they secretly engage in (or have engaged in without disclosure), it transforms the act from "norm enforcement" to "virtue signaling" or "deflection."

  **The Principled Sort:** You can accept that R's criticism is *factually correct* (cheating is bad) while simultaneously agreeing that her *method of delivery* (public sermonizing) was compromised by her lack of transparency. Friend 1 and Friend 2 aren't actually contradicting each other; they are evaluating different variables.

  ### 2. Resolving the "Nobody Can Criticize Anything" Paradox
  Your third worry is the most philosophically interesting: *If past mistakes disqualify criticism, does moral discourse collapse?*

  This is a slippery slope fallacy, but it feels real because it relies on a false premise: **The premise that past behavior creates permanent disqualification.**

  Ethical frameworks generally distinguish between **unrepentant hypocrisy** and **reformed behavior**.
  *   **Unrepentant Hypocrisy:** "You shouldn't steal," says the person currently stealing. This undermines standing because the speaker is actively violating the norm they are enforcing. It suggests the rule is for *you*, not *them*.
  *   **Reformed Behavior:** "You shouldn't steal," says the person who stole years ago, regrets it, and stopped. This does *not* disqualify them. In fact, in many frameworks (like restorative justice or addiction recovery), lived experience *enhances* standing because they understand the consequences.

  **Why the paradox doesn't hold:**
  The constraint isn't "Have you ever done this?" The constraint is "Are you currently claiming exemption from the rule you are enforcing?"
  If we adopted your fear (past = permanent disqualification), we would lose the value of wisdom gained through error. A recovering alcoholic has *more* standing to warn against drinking than someone who has never been tempted, provided they are honest about their recovery.

  So, R's claim that "it was a different situation" and that she "regrets it" is actually ethically relevant. It moves her from the "Hypocrite" category to the "Fallible Human" category. Everyone is a fallible human; only hypocrites lose the right to speak.

  ### 3. The Social Psych Angle: Attribution and Signaling
  Since you're in social psych, here is where your brain is likely latching onto the cognitive mechanisms at play.

  *   **Fundamental Attribution Error:** R is attributing the mutual friend's cheating to *character* ("tells you everything about someone's character") while attributing her own past cheating to *situation* ("completely different situation"). This is textbook FAE. She is judging herself by her intentions/circumstances and others by their actions. This discrepancy is what makes your skin crawl.
  *   **Costly Signaling:** By posting "full paragraphs" in a group chat, R is engaging in a public display of loyalty to the group's norms. However, because she is hiding her own history, the signal is "cheap." If she had said, "I know I've made mistakes in the past regarding fidelity, and I regret them deeply, which is why I think this is so damaging," the signal becomes "costly" (admitting fault) and gains credibility.
  *   **The Privacy Variable:** There is a normative expectation of privacy regarding past relationships. R is not ethically obligated to broadcast her sexual history to the group. However, by choosing to make *morality* a public group topic, she invited scrutiny of her own moral consistency.

  ### 4. So, how do you let it go?
  You are stuck because you are trying to resolve a **social dilemma** with a **binary ethical switch**.

  R is not a villain, but she isn't being entirely consistent. Here is the synthesis:
  1.  **The Criticism is Valid:** The guy who cheated messed up. R is right to call it out.
  2.  **The Delivery was Flawed:** Publicly moralizing without acknowledging one's own fallibility creates an imbalance in group dynamics. It creates a "Parent/Child" dynamic rather than "Peer/Peer."
  3.  **The Past is (Mostly) Irrelevant:** R's past doesn't make her wrong about the cheating. But her *secrecy* makes her awkwardness understandable.

  **Recommendation:**
  Don't out R. Her past was before the group formed, and she claims regret. That is her private moral ledger to balance. However, you can address the *dynamic*. If the topic comes up again, you can gently introduce nuance: *"I think cheating is obviously wrong, but I also think people can mess up once and still be good people. We have to be careful about defining someone's whole character by their worst moment."*

  This validates the norm (cheating is bad) without validating R's harsh character assassination, and it subtly signals to R that you value growth over purity.

  **Summary for your dissertation-brain:**
  The "nobody can criticize" paradox fails because moral standing is based on **current alignment with norms**, not **historical purity**. R has standing because she is currently aligned (she isn't cheating now), even if her history is messy. Your discomfort stems from her **attributional asymmetry** (judging others harder than herself), not from a lack of logical validity in her argument.

  You can let it go because R is allowed to be a reformed sinner who preaches, even if she's a bit preachy about it. It's annoying, but it's not a moral crisis.
