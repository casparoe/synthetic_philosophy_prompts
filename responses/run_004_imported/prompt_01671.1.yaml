answer: |-
  **Setting:** *A quiet corner of the university faculty lounge. Rain taps against the window. ELENA (a proponent of counterfactual theories of causation) stirs her tea. MARCUS (a proponent of process theories of causation) leans back in his chair, arms crossed.*

  **Elena:** So, are you really going to stick with it? The lifeguard didn't *cause* the swimmer's death?

  **Marcus:** I'm sticking with the metaphysics, Elena. The water filled the swimmer's lungs. The heart stopped. Those are events. Positive occurrences. Energy transfers. The lifeguard… what did he do? He sat on his chair. He drank his coffee. He *didn't* throw the buoy. You can't point to a "not-throwing" in the physical fabric of the universe. Nothing cannot cause something.

  **Elena:** But if he *had* thrown the buoy, the swimmer would be alive. That counterfactual dependence is the bedrock of causation. If $A$ hadn't happened, $B$ wouldn't have happened. Here, if the omission hadn't occurred, the death wouldn't have occurred. It functions exactly like a cause in our reasoning.

  **Marcus:** It functions like a cause in our *moral* reasoning. That's the confusion. You're smuggling normativity into ontology. Yes, we blame the lifeguard. Yes, we sue him. But that's because he had a *duty* to act. Don't confuse the breach of duty with the physical production of the outcome. The cause of the death was the drowning. The lifeguard merely failed to interrupt the causal chain.

  **Elena:** "Merely failed to interrupt"? Marcus, that's doing a lot of work. Imagine a gardener who forgets to water his plants, and they die. Did the heat kill the plants, or did the gardener kill the plants?

  **Marcus:** The heat and the lack of moisture in the soil killed the plants. The gardener is responsible for the state of the soil, sure. But if I say "the gardener's forgetting caused the wilting," I'm speaking loosely. I mean "The gardener's forgetting caused the *absence of water*, which caused the wilting." The absence of water is a physical state. The "forgetting" is just a description of the gardener's relation to that state.

  **Elena:** But the absence of water *is* the omission in the plant case. Look, the problem with your view is that it makes causation irrelevant to the things we actually care about. We care about causation because we want to know how to control outcomes. If I want to prevent deaths at the pool, I don't study the fluid dynamics of drowning. I study lifeguard behavior. I treat the lifeguard's inaction as a causal lever. If you tell me that's not "real" causation, you're cutting the link between explanation and intervention.

  **Marcus:** I'm not cutting the link. I'm refining it. There are positive causes, and there are *conditions*. The lifeguard's inaction is a condition that allowed the positive causes to run their course. It's a distinction without a difference for the lawyer, maybe, but a chasm for the metaphysician. If you say omissions are causes, you open the floodgates.

  **Elena:** Ah, the "too many causes" objection. I was waiting for this.

  **Marcus:** It's a fatal objection, Elena. If the lifeguard's not-throwing caused the death, then *my* not-throwing caused the death. I wasn't there. I didn't throw a buoy. In fact, every person on the planet who didn't fly to that beach and save the swimmer is a cause of the death. On your view, the entire universe is causally responsible for that swimmer's demise, except for the few people who actually tried to help. That renders the word "cause" useless.

  **Elena:** Not on my view. We select causes based on context and expectation. Causation isn't just a raw physical relation; it's an explanatory tool. When we ask "What caused the death?" we are asking "What made the difference in this specific context?" In the context of the pool, the lifeguard's inaction made the difference. Your inaction didn't, because you weren't part of the relevant background conditions.

  **Marcus:** But that's my point! You're relying on "context and expectation." You're relying on *norms*. You're saying the lifeguard is a cause because he *should* have acted. That means causation depends on morality. Do you really want to say that whether an event caused another event depends on whether someone had a job description?

  **Elena:** I'm saying causation is sensitive to the model we use to describe the world. In a model of fluid dynamics, the lifeguard is irrelevant. In a model of social safety, he's central. Both are true. Why privilege the physics model as the "real" one?

  **Marcus:** Because the physics model is the one that tracks the actual transmission of force. If we're doing science, we can't have causes popping in and out of existence based on job descriptions. Imagine a biologist studying why a species went extinct. If they say "The predator caused it" and "The lack of rain caused it" and "The conservationist's failure to intervene caused it" all in the same ontological breath, the explanation becomes muddy. We need to distinguish between the mechanism of destruction and the failure of prevention.

  **Elena:** But sometimes the failure of prevention *is* the mechanism. Think about a pacemaker. If the battery dies, the patient dies. Did the battery running out of charge cause the death? Or did the doctor's failure to replace it cause the death?

  **Marcus:** The battery dying is a positive event. Chemical energy depleted.

  **Elena:** Okay, what if it's a digital signal? The pacemaker stops sending a pulse because a line of code says "if time > X, stop." The doctor failed to update the software. The machine didn't break; it just didn't do the new thing. Is that a positive event or an omission?

  **Marcus:** *Pause.* That's a tricky case. I'd say the cessation of the signal is a physical event.

  **Elena:** Is it? Or is it just the absence of a signal? Marcus, here is what's at stake. If you insist that only positive events are causes, you create a disconnect between legal responsibility and metaphysical reality. The law says the lifeguard caused the death. Criminal law hinges on *causa sine qua non*. If you tell a jury, "Technically, he didn't cause it, he just let it happen," you undermine the very concept of negligence.

  **Marcus:** I'm not undermining negligence. Negligence is about duty. You can be liable for an outcome you didn't causally produce in the strict sense, provided you had a duty to prevent it. We don't need to warp metaphysics to save moral responsibility. We can say: "The water killed him, but the lifeguard is to blame for letting the water kill him."

  **Elena:** "To blame for letting." That phrasing admits it, though. "Letting" implies a causal capacity. You can only "let" something happen if you had the power to stop it. That power is a causal power. If I have the power to stop $X$, and I don't, and $X$ happens, my non-action is causally relevant.

  **Marcus:** Causally relevant, yes. A cause, no. There's a difference. Relevance is about information. Causation is about production.

  **Elena:** But why think production requires energy transfer? What if causation is just about dependency?

  **Marcus:** Because if it's just about dependency, then everything depends on everything else. We lose the asymmetry of time. We lose the ability to distinguish between a cause and a mere background condition. The oxygen in the room is a condition for the fire, but the match is the cause. Why? Because the match is the positive change. If you allow omissions, the oxygen becomes a cause (by not vanishing), the lack of sprinklers becomes a cause (by not activating). Everything becomes a cause.

  **Elena:** We already distinguish matches from oxygen without banning omissions. We do it via salience. We can do the same with omissions. The lifeguard is salient. I am not.

  **Marcus:** Salience is psychological. Causation is supposed to be in the world, not in our heads.

  **Elena:** Is it? Or is "causation" a concept we impose on the world to make sense of it? If I'm a historian asking "What caused the famine?" and the answer is "The government failed to distribute grain," have I given a false explanation because "failing" isn't a physical event?

  **Marcus:** You've given a true *explanation*, but you've used "cause" in a derivative sense. You're saying the distribution didn't happen, and that absence, combined with the drought, led to starvation. I'm arguing for precision. If we treat omissions as full-blooded causes, we lose the ability to distinguish between killing and letting die in a way that matters for science.

  **Elena:** But we *need* to treat them as causes for ethics. And ethics is part of reality, Marcus. Human agency is part of the causal fabric. When an agent decides not to act, that decision is a mental event. The *result* of that decision is an omission.

  **Marcus:** The decision is the event. The omission is the shadow it casts.

  **Elena:** *Laughs.* That's poetic. But shadows can kill. If I stand in front of a solar panel and block the sun, I've caused the power to stop. Did I do something? Or did I just stand there?

  **Marcus:** You intercepted photons. That's positive.

  **Elena:** What if I just don't move out of the way?

  **Marcus:** Then you are a physical obstacle.

  **Elena:** What if I'm the lifeguard? I'm not an obstacle. I'm just… not a help.

  **Marcus:** *Sighs.* You're circling back. Look, I concede this: In law and morality, we treat omissions as causes. It's a useful fiction. Or maybe a pragmatic necessity. But don't tell me it's metaphysically robust. Don't tell me the "not-throwing" is out there in the universe like a rock or a wave.

  **Elena:** I won't tell you it's a rock. I'll tell you it's a fact. Facts can be causes. The fact that the lifeguard did not throw the buoy is a truth about the world. That fact explains the death. If facts can be causes, omissions can be causes.

  **Marcus:** Now we're shifting from events to facts. That's a different theory entirely.

  **Elena:** It's a better one. It accommodates the lifeguard without flooding the gates. The fact that *I* didn't save him isn't the relevant explanatory fact for the death in this context. The fact that the *lifeguard* didn't is.

  **Marcus:** So you save your theory by retreating into pragmatics. You admit that metaphysically, "nothing" is doing the work, but pragmatically, we call it a cause.

  **Elena:** I'm admitting that metaphysics shouldn't ignore how we successfully navigate the world. If our best theory of causation says the lifeguard didn't cause the death, but our best theory of ethics says he's responsible for the death, we have a disconnect. I'm bridging it. You're insisting the bridge is an illusion.

  **Marcus:** I'm insisting the bridge is made of wood, not steel. It holds weight, but don't build a skyscraper on it. If we conflate prevention with production, we risk holding people responsible for things they physically couldn't control, provided we can spin a story about what they "should have done."

  **Elena:** And if we don't conflate them, we risk letting people off the hook because they technically didn't "push the button," even if their finger hovered over it intentionally.

  **Marcus:** *Pauses, looking out at the rain.* So, we're at an impasse. You prioritize the explanatory power for agency. I prioritize the ontological clarity for physics.

  **Elena:** Essentially. I think "cause" is a concept that serves human interests. You think "cause" is a feature of the universe independent of us.

  **Marcus:** And until we agree on that, the lifeguard is both a killer and a bystander, depending on who you ask.

  **Elena:** *Raises her tea cup.* To the lifeguard.

  **Marcus:** *Clinks his coffee mug.* May he never have to decide which of us is right.
