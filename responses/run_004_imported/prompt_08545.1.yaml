answer: |-
  You have hit on one of the most famous and frustrating puzzles in the philosophy of language. You are absolutely right to feel that gut-level difference. Your intuition is spot-on: these two sentences are doing fundamentally different jobs, even though they look like twins.

  Philosophers call this the difference between **indicative conditionals** (the "didn't/did" version) and **counterfactual conditionals** (the "hadn't/would have" version). But knowing the names doesn't explain *why* your brain rejects the second one.

  Let's ditch the pizza and the JFK/Oswald examples. I'm going to give you a fresh scenario, walk through the cognitive mechanics of why they feel different, and then answer your question about whether this split always happens.

  ### 1. A Brand New Example: The Broken Drone

  Imagine you are at a park. You see a expensive drone lying in the grass, smashed to pieces. You know for a fact that only two people were flying drones in the park that day: **Alex** and **Sam**.

  **Sentence A (Indicative):**
  > "If Alex didn't crash it, Sam did."

  **Sentence B (Counterfactual):**
  > "If Alex hadn't crashed it, Sam would have."

  **The Intuition Check:**
  *   **Sentence A** feels rock solid. The drone is broken. It had to be one of the two pilots. If we rule out Alex, logic dictates it was Sam.
  *   **Sentence B** feels risky. It implies that Sam was *bound* to crash his drone regardless of what Alex did. But what if Sam is a pro pilot with a perfect record, and Alex is a clumsy beginner? Sentence B suggests Sam was "waiting in the wings" to crash, which might be totally false.

  ### 2. What's Happening Under the Hood?

  Why does swapping the grammar change the truth value? It comes down to **what facts your brain is holding fixed** while it processes the sentence.

  #### The Detective vs. The Time Traveler
  Think of the **Indicative (Sentence A)** as a **Detective**.
  The Detective is standing in the *actual* world, looking at the evidence.
  *   **Fixed Fact:** The drone is broken.
  *   **Task:** Assign blame based on current evidence.
  *   **Logic:** The set of "crashers" contains at least one person. The set is {Alex, Sam}. If Alex $\notin$ Set, then Sam $\in$ Set.
  *   **Why it feels true:** You aren't changing reality; you are just updating your knowledge about who is responsible for a fact that *already happened*.

  Think of the **Counterfactual (Sentence B)** as a **Time Traveler**.
  The Time Traveler has to go back and *rewrite history* to make the "If" part true.
  *   **The Mission:** Go back to the start of the day. Make it so Alex *does not* crash the drone.
  *   **The Problem:** To make "Alex didn't crash it" true, you have to change something about Alex (maybe he flew more carefully, or stayed home).
  *   **The Simulation:** Now, hit "play" on this new timeline. Does the drone still get broken?
  *   **Why it feels shaky:** In this new timeline, maybe Alex flies perfectly. If Sam is a good pilot, *nobody* crashes the drone. The drone remains intact. Therefore, "Sam would have crashed it" is false.

  **The Crucial Difference:**
  *   **Indicative:** Holds the **Outcome** fixed (The drone *is* broken). Asks: "Given this outcome, who did it?"
  *   **Counterfactual:** Holds the **Conditions** fixed (Sam's skill level, the weather, the park rules). Asks: "Given these conditions, would the outcome still happen?"

  In your pizza example:
  *   **Indicative:** The pizza *is* gone. If not Roommate, then Other. (Logical necessity based on the empty box).
  *   **Counterfactual:** Roommate *doesn't* eat the pizza (maybe they aren't hungry). Does someone else eat it? Only if someone else is *also* hungry. If Roommate was the only hungry person, the pizza stays in the fridge. So, "Somebody else would have" is false.

  ### 3. Does This Split *Always* Happen?

  This is the million-dollar question. Is this a universal law of language, or just a quirk of contingent events (like eating pizza or crashing drones)?

  **The answer is: No, the split does not always happen.**

  There are cases where the Indicative and Counterfactual feel exactly the same. This happens when the outcome is **causally necessitated** or **logically guaranteed**, regardless of who triggers it.

  #### Example Where They Match: The Light Switch
  Imagine a room with two switches wired to the same light bulb (a standard 3-way circuit). Either switch can turn the light on. You walk in and the light is **on**.

  *   **Indicative:** "If Switch A didn't turn it on, Switch B did."
      *   *Verdict:* **True.** The light is on. It has to be one of them.
  *   **Counterfactual:** "If Switch A hadn't turned it on, Switch B would have."
      *   *Verdict:* **True.** Because of how the wiring works, if Switch A was down, Switch B (which is up) would have completed the circuit. The light was *destined* to be on given the state of the switches.

  #### Example Where They Match: The Lottery
  Imagine a lottery with 100 tickets. One ticket *must* win. Ticket #5 won.

  *   **Indicative:** "If Ticket #5 didn't win, some other ticket did."
      *   *Verdict:* **True.** (Obviously).
  *   **Counterfactual:** "If Ticket #5 hadn't won, some other ticket would have."
      *   *Verdict:* **True.** The rules of the lottery guarantee a winner. If #5 is removed from the pool, the probability shifts to the others, and a winner is still drawn.

  ### The Takeaway

  The "weirdness" you noticed isn't a bug in your brain; it's a feature of how we process **causality** vs. **evidence**.

  1.  **The Split Happens** when the event is **contingent** (like eating pizza, crashing a drone, breaking a vase). In these cases, the Indicative assumes the result is fixed, while the Counterfactual asks if the result *would have occurred* under different circumstances.
  2.  **The Split Disappears** when the event is **determined** (like light switches, lotteries, math). In these cases, the result is guaranteed by the system, so both the Detective and the Time Traveler agree on the outcome.

  Your gut reaction to the pizza sentence was spotting a hidden assumption: the counterfactual version assumes there was a "backup eater" ready to step in. If there wasn't, the sentence is false, even if the pizza is definitely gone. You've essentially stumbled onto the difference between **epistemic conditionals** (about what we know) and **ontic conditionals** (about how the world works).

  So, next time you argue about who ate the last slice, remember: you can logically prove someone ate it (Indicative), but you can't necessarily prove they *would have* eaten it if the first person hadn't (Counterfactual). Unless, of course, your friends are as predictable as light switches.
