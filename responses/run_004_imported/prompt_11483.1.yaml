prompt: |-
  My grandmother turns ninety next month, and I am giving the toast at her birthday dinner. She taught Latin and Roman history for forty years, and although she has grown physically frail and no longer travels or lectures, she still spends every morning tending her garden and has never, in my hearing, complained about old age in the way the very old are expected to. For decades she has instead quoted Cicero's De Senectute at anyone who will listen, treating it as something closer to scripture than to consolation literature. The guest list is a curious mix: three or four of her former doctoral students, now classicists in their own right, are flying in and will notice immediately if I mangle Cato's argument, while most of the table will be grandchildren, cousins, and neighbors who have never read a word of Cicero and simply want to feel something.

  I would like the toast organized around the four charges that Cicero has Cato answer in turn — that old age removes us from active affairs, weakens the body, strips away most of our pleasures, and brings us near to death — using that structure to say something true about her present life rather than something merely nice. She has always insisted that the cheap comfort people offer the old ("you're only as old as you feel," "age is just a number") is precisely what Cato refuses to say, since his whole argument depends on old age being genuinely different from youth and still worth having on its own terms; the toast should not lapse into that cliché even in passing. The fourth charge, concerning the nearness of death, cannot be avoided at a ninetieth birthday, but my grandmother does not share Cato's hope of one day rejoining the company of great souls, so that closing movement will need real delicacy: it should neither put a belief in her mouth that is not hers nor flatten the argument into mere stoic resignation. The toast should reward the former students who will recognize every move from the text while still landing, unassisted, for relatives who have never heard of Cato. Please write it, aiming for about four or five minutes at the lectern.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Grandmother's 90th Birthday Dinner.
      *   **Speaker:** Grandchild.
      *   **Honoree:** Former Latin/Roman History teacher (40 years), physically frail but active in gardening, never complains about age, quotes Cicero's *De Senectute* (On Old Age) constantly.
      *   **Audience:** Mixed. Some former doctoral students (classicists, will know the text well), most are family/neighbors (no Latin knowledge, want emotional resonance).
      *   **Structure:** Must follow the four charges Cato answers in *De Senectute*:
          1.  Withdraws from active affairs.
          2.  Weakens the body.
          3.  Deprives of pleasures.
          4.  Is near to death.
      *   **Tone/Content Constraints:**
          *   Avoid clichés ("age is just a number," "young at heart").
          *   Acknowledge age is *different*, not just a continuation of youth.
          *   Handle the "death" argument delicately (she doesn't share Cato's belief in an afterlife/great souls, so don't fake piety, but don't be morbid).
          *   Must work on two levels: intellectual for the classicists, emotional for the laypeople.
          *   Length: 4-5 minutes spoken (approx. 600-750 words).

  2.  **Deconstruct *De Senectute* (Cato's Arguments):**
      *   *Charge 1: Active Affairs.* Cato argues old men direct affairs through wisdom and counsel, not physical exertion.
      *   *Charge 2: Physical Strength.* Cato admits weakness but argues it's not needed for a virtuous life; the mind remains strong.
      *   *Charge 3: Pleasures.* Cato argues freedom from passion is a *benefit*, allowing appreciation of higher things (conversation, nature).
      *   *Charge 4: Death.* Cato argues death is either a transition to a better state or a cessation of feeling (no evil).
      *   *Key Theme:* Old age has its own specific virtues, it's not a diminished version of youth.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone. Acknowledge the mix of guests. State the purpose: to honor her 90 years using her favorite text.
      *   **Charge 1 (Active Affairs):** She doesn't lecture anymore. But she guides us. The garden is her senate.
          *   *Classicist nod:* Mention *negotium* vs. *otium* or counsel.
          *   *Layperson hook:* She still teaches us, just differently.
      *   **Charge 2 (Physical Strength):** She is frail. She admits it (no clichés). But strength isn't the point.
          *   *Classicist nod:* Reference the body as a vessel.
          *   *Layperson hook:* We see her tend the garden despite the frailty. That's a different kind of strength.
      *   **Charge 3 (Pleasures):** She doesn't chase youthful thrills. She finds joy in the garden, in us.
          *   *Classicist nod:* Freedom from *libido* (passion).
          *   *Layperson hook:* She enjoys the sunrise, the bloom, the family gathering.
      *   **Charge 4 (Death):** The tricky part. 90 years means death is near. Cato says "great souls await." She doesn't believe that. How to frame it? Focus on the *completion* of the work, the harvest, the legacy left behind. The "ripeness" of the fruit.
          *   *Classicist nod:* Allusion to the harvest metaphor without the theological claim.
          *   *Layperson hook:* A life fully lived, leaving us with the seeds she planted.
      *   **Closing:** Raise a glass. To Grandmother.

  4.  **Refining the Tone:**
      *   *Avoid:* "You're young at heart."
      *   *Embrace:* "You are old, and it is magnificent."
      *   *Voice:* Respectful, warm, slightly intellectual but accessible.
      *   *Specific Detail:* The garden is crucial. It anchors the abstract philosophy in her reality.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Grandma loves Cicero. He says people complain about 4 things regarding age.
      1. You stop working. Grandma stopped teaching, but she gardens. That's work.
      2. You get weak. She is weak, but her mind is sharp.
      3. No fun. She doesn't party, but she loves her flowers.
      4. Death is coming. Cato says heaven. Grandma says... well, she leaves us a legacy.
      Happy Birthday.

      *Critique 1:* Too simple. Needs more gravitas for the doctoral students. Needs to explicitly mention the four charges without sounding like a lecture. Needs to handle the death argument more philosophically.

  6.  **Drafting - Iteration 2 (Adding Texture & Cicero):**
      *   *Intro:* Mention the *De Senectute*.
      *   *Point 1:* Cato says we withdraw from public life. Grandma left the lecture hall. But the garden is her republic. She cultivates life.
      *   *Point 2:* Cato says bodies fail. Grandma admits this. No "age is a number." But she tends the roses anyway.
      *   *Point 3:* Cato says pleasures fade. Grandma says good riddance to distraction. She enjoys conversation and nature.
      *   *Point 4:* Death. Cato expects to meet Scipio. Grandma expects... rest? Continuation in us? Let's focus on the "ripeness."
      *   *Conclusion:* Toast.

  7.  **Polishing the "Death" Argument:**
      *   This is the hardest constraint. "She does not share Cato's hope of one day rejoining the company of great souls."
      *   *Solution:* Pivot to the Ciceronian idea of *nature* completing its course. The fruit falls when ripe. It's not about *where* she goes, but that the work is *done* and well-done. The "immortality" is in the students and grandchildren (the seeds). This satisfies the classicists (Cicero uses agricultural metaphors) and the family (legacy).

  8.  **Writing the Text (incorporating timing):**
      *   Aim for ~700 words.
      *   Ensure the transitions between the four points are clear.
      *   Make sure the Latin terms are contextually clear for non-speakers.

      *(Self-Correction during drafting)*: Make sure I don't sound like *I* taught Latin. I am the grandchild. I need to sound like I learned this from *her*.
      *   *Check:* Did I avoid "young at heart"? Yes.
      *   *Check:* Did I acknowledge the frailty? Yes.
      *   *Check:* Is the death section delicate? I will focus on the "harvest" metaphor which Cicero uses, which implies natural completion rather than religious ascent.

  9.  **Final Review against constraints:**
      *   4-5 minutes? (Word count looks right).
      *   4 Charges addressed? (Yes).
      *   No clichés? (Yes).
      *   Death handled delicately/non-religiously? (Yes, focused on legacy/nature).
      *   Dual audience? (Yes, specific references for classicists, emotional core for family).

  10. **Final Polish:** Check rhythm and cadence for speech. (e.g., "She does not tell us that age is a number. She tells us age is a place.")

  *(Proceed to generate output based on these thoughts.)*
answer: |-
  Good evening, everyone. For those who don't know me, I am [Your Name], [Grandmother's Name]'s grandchild.

  When I asked my grandmother what I should say tonight, she didn't suggest I talk about her kindness, or her cooking, or even how much we love her. She told me I should talk about Cato. Specifically, Cato in Cicero's *De Senectute*—On Old Age.

  For forty years, she taught the classics. And for nearly as long, she has been correcting anyone who offers her the usual comforts given to the elderly. She hates the idea that "age is just a number," or that you are "only as old as you feel." To her, those are lies. Old age is not a failed attempt at being young. It is a distinct stage of life with its own rules, its own burdens, and its own specific virtues.

  So, in her honor, I want to structure this toast around the four accusations Cicero has Cato defend against. They are the four things people say make old age miserable. And looking at my grandmother's life, I think we can see how she answers them.

  The first charge is that old age withdraws us from active affairs. It is true: my grandmother no longer stands in a lecture hall. She no longer travels to conferences or grades stacks of papers. By the world's standard, she has retired from "work." But Cato argues that the old do not cease to act; they simply change *how* they act. They steer the ship rather than climb the rigging.

  Grandmother, you have not left the active life. You have just changed your republic. Your senate is this garden you tend every single morning. You cultivate life there, you prune what is dead, and you nurture what is new. And beyond the garden, you steer us. You advise us on careers, on marriages, on how to endure hardship. You are not inactive; you are operating from a different command post.

  The second charge is that old age weakens the body. We do not need to pretend otherwise. We see that you are frail. We see that the stairs are harder now, and the winter chills you deeper. Cato admits this freely. He says the body is a vessel that wears out. But he argues that the mind need not wear with it.

  When we see you in the garden, kneeling slowly in the dirt, we do not see weakness. We see a will that refuses to be governed by the body's decline. You teach us that physical frailty is not a moral failure. It is simply the condition of the vessel. The fire inside it still burns.

  The third charge is that old age strips away our pleasures. Cato says this is actually a gift. He argues that youth is enslaved by passion, by the hunger for novelty and sensation. Old age is free from that tyranny.

  Grandmother, you have never been bitter about missing the parties or the travel. Instead, you seem to enjoy a higher frequency of joy. The blooming of a peony. A glass of wine at sunset. A conversation with a former student who has become a colleague. You have traded the loud pleasures of youth for the quiet satisfactions of wisdom. You have shown us that when the noise fades, you can finally hear the music.

  And finally, the fourth charge. The one we cannot avoid tonight. That old age is near to death.

  Cato comforts himself with the belief that he will soon join the company of the great souls who came before him. He looks forward to an afterlife. Grandmother, you have never claimed that comfort. You are a historian; you deal in evidence, not hope.

  But Cato offers another argument, one I think fits you better. He compares a long life to a ripe harvest. The fruit does not fall from the tree because it is defeated; it falls because it is finished. It has reached its fullness.

  Ninety years is a harvest. You are not near death because you are fading away; you are near the end because you have completed a massive, intricate work. The work is your family, your students, this garden, and the integrity of your own character. When the time comes, it will not be a theft. It will be the gathering in of what you have sown. You will live on, not in a heaven you don't believe in, but in the minds of the classicists at this table, and in the blood of the grandchildren who carry your name.

  So, I raise this glass. Not to youth, and not to the denial of age. But to the specific, formidable virtue of being ninety. To the harvest. To the garden. And to you, Grandmother.

  Happy Birthday.
