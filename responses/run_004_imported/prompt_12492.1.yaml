answer: |-
  This is one of the most sophisticated and common stumbling blocks for readers moving from Spinoza's *Ethics* to his political works. You have identified the tension correctly: if metaphysical determinism is true, the libertarian defense of democracy (i.e., "people deserve to rule themselves because they have free will") collapses.

  However, Spinoza does not defend democracy based on libertarian free will. In fact, he defends it *because* we are determined.

  To square the circle, you need to adjust two specific concepts in your understanding of his system: his definition of **freedom** and his understanding of the **purpose of the state**.

  ### 1. Two Definitions of Freedom
  You are correct that Spinoza rejects "freedom of the will" (the ability to have chosen otherwise given the exact same prior causes). In the *Ethics*, he calls this a "human dream."

  However, Spinoza offers a positive definition of freedom that is compatible with determinism. In *Ethics* Part 4, Definition 8, he writes:
  > "By virtue and power I understand the same thing... Acting absolutely from virtue is nothing else in us but acting, living, and preserving our being by the guidance of reason, from the foundation of seeking one's own advantage."

  For Spinoza, **Freedom = Rational Autonomy.**
  *   **Slavery:** Being determined by external causes (passions, fears, superstitions, other people's whims).
  *   **Freedom:** Being determined by internal causes (reason, understanding, adequate ideas).

  When you are ruled by a passion (like hatred or fear), you are still acting according to nature's laws, but you are *passive*. You are being acted upon. When you act from reason, you are *active*. You are the adequate cause of your actions.

  Therefore, the political goal is not to protect a metaphysical "free will" that doesn't exist. The political goal is to create a society that maximizes the citizens' capacity to be **active** rather than **passive**.

  ### 2. The State as a Cause
  Since Spinoza is a determinist, he believes institutions are *causes*. A monarchy causes certain effects in the populace; a democracy causes others.

  If you ask, "Why prefer democracy if the voters aren't free?" Spinoza answers: "Because the *causes* generated by democracy produce more rational, stable, and powerful citizens than the causes generated by tyranny."

  Even if a dictator is "determined" to be enlightened, Spinoza argues that the *structure* of absolute power inevitably degrades into irrationality. Why?
  *   **The Problem of the One:** A single ruler is subject to human affects (fear, jealousy, anger). In an absolute monarchy, the state's policy is determined by the fluctuating passions of one body. This makes the state unstable.
  *   **The Power of the Multitude:** In a democracy, laws are determined by the multitude. While individuals are often irrational, Spinoza argues it is statistically and psychologically unlikely for a large multitude to agree on something self-destructively irrational. As he writes in the *Political Treatise*: "It is hardly possible that the majority of a large council should agree on one and the same absurdity."

  So, the preference for democracy is not moral; it is **hydraulic and psychological**. It is about channeling the deterministic flow of human affects in a way that produces stability and reason.

  ### 3. Right is Coextensive with Power
  This is the hardest pill to swallow for modern readers. In the *Theological-Political Treatise (TTP)* and *Political Treatise (TP)*, Spinoza argues that "Natural right is coextensive with power."

  In the state of nature, a big fish has the "right" to eat the small fish because it has the *power* to do so. There is no sin, only power dynamics. When we form a state, we pool our power.

  *   **Tyranny:** The ruler holds the power. The subjects are weak. The state is less powerful overall because the ruler must constantly spend energy suppressing the subjects.
  *   **Democracy:** The power is pooled. The subjects obey laws they effectively gave themselves (because they align with the general will). This increases the total *potentia* (power) of the state.

  Spinoza prefers democracy because it is the **most powerful** form of government. It minimizes internal resistance. A citizen in a democracy is less likely to rebel against a law they had a hand in creating. Less rebellion means more stability. More stability means more security. More security means citizens have the leisure and safety to cultivate their reason.

  ### 4. The "Freedom to Philosophize"
  In the *TTP*, Spinoza explicitly states the purpose of the state:
  > "The true end of the state is really liberty."

  He does not mean liberty to steal or kill (which diminishes power). He means **liberty of judgment and speech**.
  *   A tyrant tries to control minds. Spinoza argues this is impossible (you can't determine what someone thinks) and counter-productive (it creates martyrs and resentment, weakening the state).
  *   A democracy allows for the "freedom to philosophize."

  Why does a determinist care about this? Because the highest good for a human being, according to the *Ethics*, is the "intellectual love of God" (understanding nature). A state that allows free inquiry allows citizens to move from *passive* affects (superstition, fear of hell) to *active* reason (understanding causes).

  An enlightened despot *could* theoretically allow this, but Spinoza argues that without institutional checks (democracy), there is no causal mechanism to ensure the despot *remains* enlightened. Democracy institutionalizes the check against irrationality.

  ### Summary: Squaring the Circle
  To answer your specific question: **What non-arbitrary reason could Spinoza have for preferring the many to the one?**

  1.  **Metaphysical Consistency:** Determinism remains intact. Both the despot and the voters are determined.
  2.  **Causal Efficiency:** Democratic institutions are better *causes* for producing stable, rational, and peaceful outcomes than monarchical institutions.
  3.  **Definition of Freedom:** Political freedom isn't "freedom of the will"; it is "freedom from tyranny," which allows the individual to pursue the *Ethics'* goal of rational autonomy.
  4.  **Stability:** A state ruled by one mind is fragile (subject to one person's passions). A state ruled by many is robust (passions cancel each other out, leaving reason more room to operate).

  Spinoza is not a democrat because he thinks people are "free" in the libertarian sense. He is a democrat because he thinks people are **determined by passions**, and democracy is the best technology we have to mitigate the destructive effects of those passions.

  You aren't missing a definition; you are encountering Spinoza's radical naturalism. He treats politics like engineering. He isn't asking what is "morally fair" in a cosmic sense; he is asking what machine design (government) allows the human parts to function with the least friction and the most power. His answer is democracy.
