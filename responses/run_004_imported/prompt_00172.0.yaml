      *   *Introduce "Ruin" Concepts:* Bring in ergodicity and risk of ruin (Taleb). 15% is massive for ruin.
      *   *The "Kid" Factor:* Dependents change the utility function. It's not just your utility; it's a fiduciary duty.
      *   *Hidden Costs:* Stress, relationship strain, career trajectory if it fails.
      *   *Middle Ground/Mitigation:* Is there a way to de-risk the startup offer? (Severance, savings buffer, contract terms).
