      *   *Genre Expectations:* Mystery is a contract between author and reader. The reader expects a puzzle they can solve alongside the detective.
      *   *Logic vs. Magic:* A hunch without basis feels like magic or authorial fiat. Evidence-based deduction feels like logic.
      *   *Satisfaction:* The "Aha!" moment comes from connecting dots, not being told the picture.
      *   *Fair Play:* The reader needs to feel they had a chance. If the detective knows something the reader couldn't possibly infer, it's unfair.

  3.  **Formulate the Explanation (The "Why"):**
      *   **The Contract of Fair Play:** Mystery readers aren't just watching a story; they are playing a game. A hunch breaks the rules of the game.
      *   **Causality vs. Correlation:** In the "hunch" version, the conclusion doesn't causally follow from the premises presented to the reader. In the "evidence" version, it does.
      *   **Agency:** The detective needs to *work* for the solution. Intuition makes it look easy/lucky. Evidence makes it look skilled.
      *   **Verification:** Being *right* isn't enough. You have to prove *why* you're right.

  4.  **Develop Actionable Advice (The "How"):**
      *   **The "Therefore" Test:** Replace "and then" or "suddenly" with "therefore."
      *   **Planting Clues:** Revisit the earlier draft. Where were the clues? Are they still there?
