      *   **Types of Moral Luck:** Resultant luck (the driver case) is just one type. There's also Constitutive (personality), Circumstantial (situation), and Causal (background causes). The user's fix addresses Resultant Luck but struggles with the others.
      *   **The Function of Blame:** Blame isn't just about retrospective justice; it's about forward-looking regulation, grief processing, and community standards.
