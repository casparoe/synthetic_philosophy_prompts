      *   **The User's Solution:** This is essentially the *Kantian* or *Control Principle* response. It's the most intuitive philosophical move.
      *   **Why hasn't it "solved" the problem?** Because the problem isn't just logical; it's phenomenological and practical.
          *   *Phenomenological:* We *feel* guilt differently when harm occurs.
          *   *Practical:* Legal and social systems *need* to track outcomes for deterrence and restitution.
          *   *Metaphysical:* It's hard to isolate "intentions" from "outcomes" completely (constitutive luck, circumstantial luck).

