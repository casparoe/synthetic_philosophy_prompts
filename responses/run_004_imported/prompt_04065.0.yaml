      *   **The Garrisonian (Let's call him "Elias" to give him identity, or keep him unnamed? Better to give him a name to humanize him. Let's use "Mr. Thorne" or similar. Actually, let's make it a fictionalized composite of a true believer, maybe based on Wendell Phillips or Garrison himself, but distinct enough to argue freely. Let's go with "Mr. Sterling," a devoted follower of *The Liberator*):** He isn't evil; he's morally rigorous. He believes compromise is sin. He sees the Constitution as irredeemable because of the *effects* and the *understanding* of the framers, regardless of the specific words. His voice should be sharp, principled, perhaps a bit wounded by Douglass's defection.
      *   **The Setting:** A back room of a church or a meeting hall in Rochester or Boston, evening, after a public address. Coffee or tea, tired energy.

  3.  **Drafting - Section by Section:**

