          *   Douglass: The words aren't there. It's a document of powers, and none of those powers grant property in man. We must interpret it by its preamble ("secure the blessings of liberty").
      *   **Deepening the Conflict (Strategy vs. Text):**
          *   Sterling: This is legalistic hair-splitting. The *spirit* is pro-slavery. If you vote, you swear an oath to uphold a pro-slavery government.
          *   Douglass: If we don't vote, we leave the government entirely in the hands of slaveholders. Is purity worth abandonment?
      *   **The Core Question (Is the text just a proxy?):**
