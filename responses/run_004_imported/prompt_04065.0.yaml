          *   Sterling: So admit it. This isn't about the Constitution. It's about you wanting to run for office.
          *   Douglass: No, it's about saving slaves, not saving my soul from contamination.
      *   **Closing:** No clear winner. A respectful but unresolved parting. The tension remains.

  4.  **Refining the Argument (Self-Correction during drafting):**
