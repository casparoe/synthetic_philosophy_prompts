      *   *Check:* The "Text vs. Strategy" meta-argument. Make sure they explicitly ask: "Are we arguing about law or power?"
      *   *Historical Detail:* Mention *The Liberator*, the 1850 Fugitive Slave Act (crucial context for 1851/52), the Preamble, the specific clauses.

  5.  **Drafting the Dialogue (Iterative Process):**
