answer: |-
  **Setting:** *The vestry of the AME Zion Church in Rochester, New York. May, 1851. The gas lamps are being turned low after a long evening meeting. The sound of the dispersing crowd still hums faintly through the walls. FREDERICK DOUGLASS stands by a table, stacking papers, looking weary. SAMUEL STERLING, a man of similar age to Douglass, white, dressed in the severe black coat of a devoted Garrisonian, steps out from the shadows near the door.*

  **STERLING:** You spoke well, Frederick. The hall was full. They hung on every syllable. Even the ones who came to hiss stayed to listen.

  **DOUGLASS:** (Without looking up) And yet, Samuel, I saw you in the third row. You did not clap.

  **STERLING:** I cannot clap for a eulogy on a Constitution that chains my brothers in the South. You used to call it a covenant with death. Tonight, you called it a glorious liberty document. I am trying to reconcile the man I know with the voice I heard.

  **DOUGLASS:** (Turns, leaning against the table) The man is the same. The voice has simply found a new weapon. Tell me, Samuel, when you read the Constitution, what do you see?

  **STERLING:** I see what Mr. Garrison has taught us to see. I see the bargain struck in Philadelphia. I see the three-fifths clause, handing the slaveholder extra representation for his human property. I see the Fugitive Slave clause, turning every Northern sheriff into a slave catcher. I see the twenty-year protection of the African trade. These are not ghosts, Frederick. They are ink.

  **DOUGLASS:** They are ink, yes. But look closer at the text. Where is the word "slave"? Where is "slavery"? Where is "property in man"?

  **STERLING:** You know the answer. The framers were ashamed. They hid the thing because they knew it was sin, but they protected the thing because they knew it was profit. Does the sin vanish because they were too cowardly to name it?

  **DOUGLASS:** No. But the law is not a riddle of hidden intentions. It is a rule of power. If the Constitution grants no power to hold a slave, then the federal government has no authority to protect slavery. It is a document of delegated powers. If the power to own man is not delegated, it does not exist. By reading it as a liberty document, we strip the slaveholder of his legal shield.

  **STERLING:** (Steps closer, voice tightening) This is legalism. It is hair-splitting while the lash falls. You are arguing about the architecture of the cage while the prisoners are bleeding. If I vote for a President, I swear an oath to support *this* Constitution. If I vote, I am complicit. I am signing the covenant with death. How can you ask a moral man to dirty his hands with a government built on the backs of the enslaved?

  **DOUGLASS:** Because if moral men refuse to vote, who votes?

  **STERLING:** That is not the point.

  **DOUGLASS:** It is the *only* point! If the abolitionists withdraw, if we declare the system too filthy for our touch, we leave the government entirely in the hands of the slave power. They will elect the presidents. They will appoint the judges. They will pass the Fugitive Slave Laws. Your purity buys you a clean conscience, Samuel, but it buys the slave nothing but continued abandonment.

  **STERLING:** (Voice rising) Do not dare speak to me of purity as if it is a luxury! We refuse to vote not because we are afraid of dirt, but because we refuse to legitimize a lie. If I vote, I say this Union is valid. I say this Constitution is law. But there is a higher law than the Constitution. There is the law of God. And God does not compromise with man-stealers. You are asking us to trade moral witness for political leverage.

  **DOUGLASS:** I am asking you to trade a sermon for a hammer!

  *(A heavy silence settles between them. Douglass rubs his temples.)*

  **DOUGLASS:** Listen to me. For ten years, I stood with Mr. Garrison. I preached non-resistance. I burned copies of the Constitution. And what changed? Did the South tremble? Did the slave loosen his grip? No. The abolitionists became a sect, not a force. We were a moral conscience for a nation that had none.

  **STERLING:** And now? You think if you join the political parties, if you play their game, they will let you win? They will use you, Frederick. The Free Soilers, the Whigs—they do not care for the black man. They care for white labor. They care for land. You are walking into a den of wolves and calling it a parliament.

  **DOUGLASS:** Better a den of wolves where I have a voice, than a pulpit where I only have an echo.

  **STERLING:** (Pauses, studying Douglass's face) Let me ask you a question, and I want the lawyer to leave the room. Just the man.

  **DOUGLASS:** Ask.

  **STERLING:** If the Constitution explicitly said "Slavery shall be protected in all states," if the words were there, plain as day... would you still call it a liberty document? Would you still urge us to vote under it?

  **DOUGLASS:** (Hesitates) If the text said that... then the text would be the enemy.

  **STERLING:** But the *reality* is that. The reality is that the government protects slavery. The text is just a veil. You are tearing at the veil and calling it a victory.

  **DOUGLASS:** No. I am saying the veil is not the face. If the text allows for liberty, we must force the nation to live up to its own words. We hold them to the preamble. "Secure the blessings of liberty." If they deny that to the black man, they are in violation of their own charter. We can sue them on the contract. We can vote them out on the contract.

  **STERLING:** Or... (He leans in, his voice dropping, softer now) ...or you have realized that moral suasion has failed. You have realized that to end slavery, you need power. And to get power, you need a vehicle. And since you cannot build a new nation overnight, you have decided to retrofit the old one.

  **DOUGLASS:** Is that a crime?

  **STERLING:** It is not a crime. It is a calculation. I am asking if this argument about the text—the missing words, the Preamble, the legal interpretation—is the truth of your heart. Or is it just the uniform you must wear to march into the political arena? Are we arguing about law, Frederick? Or are we arguing about whether it is better to stand outside the temple and denounce it, or go inside and try to clean the altar?

  **DOUGLASS:** (Walks to the window, looks out at the dark street) When I was a slave, I did not care about the Constitution. It was the power of the overseer that mattered. To get free, I had to fight the overseer. I used my fists. I used my feet.

  *(He turns back to Sterling)*

  **DOUGLASS:** Now I am free. But millions are not. Their overseer is the law itself. To fight the law, I cannot simply say it is evil. I must find where it is weak. I must find where it contradicts itself. If I tell a white man in Ohio that the Constitution forbids slavery, he may listen. If I tell him the Constitution is hell, he will lock his door and tell me I am an anarchist.

  **STERLING:** So it is strategy.

  **DOUGLASS:** It is survival.

  **STERLING:** But here is my fear, Frederick. If you say the Constitution is a liberty document, you ask the black man to trust the system. You ask him to believe that the courts, the ballots, the Congress are capable of saving him. If you are wrong... if the text *is* just a veil for the intent... then you are leading them into a trap. You are telling them to seek justice in a house built to deny it.

  **DOUGLASS:** And if you are right, but I do nothing? If I stay outside with you, maintaining our moral purity, and the Fugitive Slave Act drags families back into bondage because we refused to elect men who might oppose it... whose blood is on whose hands then?

  **STERLING:** (Quietly) God judges the heart. He does not judge the tally of votes.

  **DOUGLASS:** The slave does not care who judges him. He cares who frees him.

  *(Sterling picks up his hat. He looks at Douglass, a mixture of admiration and sorrow in his eyes.)*

  **STERLING:** You know, Mr. Garrison will say you have been bought. That the white politicians have whispered in your ear.

  **DOUGLASS:** Let them say it. I have been called worse by better men.

  **STERLING:** I do not think you are bought. I think you are... desperate. We both are. But I believe that if you try to wash a garment in ink, you will only stain your hands. I will stay with *The Liberator*. I will stay with the disunion. I will not vote for a government that claims to own men.

  **DOUGLASS:** And I will take the ballot. I will take the Constitution. I will twist every clause until it yields freedom. If I am wrong, history will judge me. But I cannot stand idle while waiting for the millennium.

  **STERLING:** (At the door) We both want the same house, Frederick. You just think you can renovate it. I think it needs to be burned to the ground.

  **DOUGLASS:** Then let us pray, Samuel, that the fire does not consume the people inside before we agree on the method.

  **STERLING:** Goodnight, Frederick.

  **DOUGLASS:** Goodnight, Samuel.

  *(Sterling exits. Douglass stands alone in the dim light. He looks down at the copy of the Constitution on the table, runs a finger over the preamble, and blows out the lamp.)*
