prompt: |-
  my grandma died a few weeks ago and since then i've been down a bit of a rabbit hole reading about whether death is actually bad for the person it happens to. i ran into the lucretius symmetry argument - if not existing after you die is bad, shouldn't not existing before you were born be just as bad? but basically nobody grieves the millenia before their birth. the rebuttal i keep running into says its not really symmetric because you couldn't have existed any earlier than roughly when you were conceived (different sperm/egg = a literally different person), so there's no "extra life" you missed out on before birth, whereas if you hadn't gotten sick or whatever you really could've had more years - so only the death side counts as an actual loss. something about this feels like a sleight of hand to me but i can't pin down why exactly. can you actually argue against this "different origins" rebuttal, like really build the case that it fails to rescue the asymmetry, not just lay out both sides for me?
