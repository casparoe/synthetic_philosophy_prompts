      *   *Premise 2:* If you were born earlier, it would require different gametes/conception, resulting in a *different* person.
      *   *Premise 3:* Therefore, you cannot be deprived of life before birth because "you" wouldn't exist to be deprived.
      *   *Premise 4:* If you die later, "you" (the same person) continue existing.
      *   *Conclusion:* Death is a loss (deprivation of future goods for *you*); prenatal non-existence is not (no *you* to lose out).

  3.  **Brainstorm Counter-Arguments (Why is this a sleight of hand?):**
      *   *The "Subject of Harm" Problem:* If death is bad because *you* miss out, who misses out in the prenatal case? The rebuttal says "no one." But does anyone miss out in the death case either, once they are dead? (The Epicurean challenge).
      *   *The "Possible Selves" Problem:* Why privilege *this* specific configuration of matter as the only valid "you"? If we care about the *conscious experience* or the *subject of a life*, does the specific genetic origin matter as much as the rebuttal claims?
      *   *The Time-Relativity of Identity:* Identity is often treated as fixed, but our intuition about "missing out" is about *opportunities for experience*. If the universe could have supported *a* life like yours earlier, why does the specific biological timestamp matter more than the experiential loss?
      *   *The Asymmetry of Desire:* We desire future existence. We don't desire past existence. The "Different Origins" argument tries to ground this in metaphysics, but maybe it's just psychology. If it's psychology, the metaphysical rebuttal is irrelevant.
      *   *The "Deprivation" Account Flaw:* The deprivation account says death is bad because it takes away good things. But prenatal non-existence also takes away good things (the good things that happened before you were born). The fact that "you" weren't there to be *that specific person* doesn't change the fact that *existence* was unavailable.
      *   *Brueckner/Fischer Counter:* They try to save asymmetry using preferences (we care about future experiences, not past). But the "Different Origins" argument is metaphysical, not preferential. If we attack the metaphysics, we weaken the grounding.

  4.  **Develop the Core Argument Against "Different Origins":**
      *   *Point 1: The Metaphysical Bait-and-Switch.* The argument shifts from "Is non-existence bad?" to "Is *this specific identity* deprived?" It conflates the *person* with the *biological origin*. If the harm of death is the loss of *conscious experience*, why does the genetic tag matter?
      *   *Point 2: The Counterfactual Problem.* To say "You could have died later" is true. To say "You could not have been born earlier" relies on a very strict essentialism about origins. Is it *really* impossible? Even if it is, does it matter for the *value* of the lost time?
      *   *Point 3: The "No Subject" Problem applies to both.* If the worry is "Who is there to suffer the loss?", once you are dead, *you* are also gone. The "Different Origins" argument tries to solve this for prenatal non-existence but ignores that the dead person also doesn't exist to register the loss. If we accept deprivation without a present subject for death, we should accept it for birth.
