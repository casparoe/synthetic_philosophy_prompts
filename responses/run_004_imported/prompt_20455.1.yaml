answer: |-
  Thomas Hobbes built his political philosophy on the idea that disputes only end when everyone submits to a Sovereign whose word is final.

  So when John Wallis proved Hobbes's squared-circle construction was impossible, Hobbes didn't accept the verdict; he just kept publishing rebuttals.

  He spent the last quarter-century of his life trying to enforce a social contract on a geometric shape, forgetting that in mathematics, the Proof is the Sovereign.
