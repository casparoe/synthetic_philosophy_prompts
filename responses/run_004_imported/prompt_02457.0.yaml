answer: |-
  "The contract is signed," Elena said, tapping the existing royalty agreement. "Under Nash, that split is fixed. The new licensing opportunity expands the feasible set upward for the artist, yes, but the original agreement remains Pareto optimal and available. Independence of Irrelevant Alternatives (IIA) dictates we ignore the expansion. If the solution was rational yesterday, it's rational today."

  Marcus leaned forward. "But the landscape of power has shifted. Kalai–Smorodinsky isn't about what is chosen; it's about what is *possible*. Individual Monotonicity says if the artist's ideal payoff rises while the label's ceiling stays fixed, the artist's share must not decrease. Their leverage has objectively increased. Ignoring that isn't consistency; it's blindness."

  "It's not blindness, it's stability," Elena countered. "IIA prevents manipulation. If I can alter the outcome simply by adding unchosen alternatives to the menu, the solution becomes arbitrary. Imagine I add a dummy option that gives the artist millions but is impossible to implement. Under your logic, does that phantom opportunity demand a higher royalty? Nash avoids this by anchoring the solution to the local geometry of the chosen point, not the distant boundaries."

  "The ideal point isn't a phantom," Marcus insisted. "It represents the maximum surplus a player can generate. In this industry, potential revenue *is* bargaining power. If the artist can now generate more value independently via this new license, their threat point effectively strengthens relative to the label. Monotonicity captures the intuitive fairness that if your pie gets bigger while mine stays the same, you should get a larger slice of the shared pie. Nash treats the feasible set as a static constraint, but bargaining is dynamic."

  "But consider where we agree," Elena interjected. "If the feasible set is symmetric, or if the expansion scales both parties' ideal points proportionally, Nash and KS coincide. We both satisfy Pareto optimality, symmetry, and scale invariance. The disagreement only bites when the feasible set expands asymmetrically. In those specific cases, IIA prioritizes consistency of choice over sensitivity to opportunity. If the original split was fair based on the options *then*, why does the existence of a new, unchosen option retroactively make it unfair?"

  "Because fairness isn't just about the split; it's about the relative gains," Marcus replied. "Nash's product maximization implicitly weights utilities based on the curvature of the frontier. When the frontier shifts out for only one player, that curvature changes. Nash adjusts the split, but often not enough to reflect the change in ideal points. KS ensures the solution lies on the line connecting the disagreement point to the new ideal points. It preserves the ratio of relative gains. You call it consistency; I call it respecting the change in bargaining strength."

  Elena sighed. "You're conflating descriptive power with normative guidance. IIA is a rationality constraint derived from choice theory. If a decision maker chooses A over B in a set {A, B}, they shouldn't choose B over A when C is added. It's about logical coherence. KS treats the bargaining solution as a welfare function designed to redistribute gains based on potential. They are different tools."

  "Exactly," Marcus said. "So the question isn't which axiom is 'true,' but what this theory is *for*. Are we modeling how rational agents *will* bargain, or prescribing how they *should*? If we're advising the label and artist on a long-term partnership, ignoring the artist's improved prospects risks resentment. The contract might hold legally, but cooperatively, the artist feels their increased value isn't recognized. KS aligns the solution with the psychological reality of leverage."

  "And if we adopt KS," Elena warned, "we invite constant renegotiation every time a hypothetical opportunity arises. IIA provides a focal point that reduces transaction costs. It says: 'We agreed on this rule; stick to it unless the actual options change.' That certainty has value."

  "Certainty at the cost of equity," Marcus shot back.

  "Perhaps," Elena conceded. "So the dispute isn't mathematical inevitability. It's normative. Nash assumes bargaining is about finding a stable equilibrium consistent with past choices. KS assumes it's about dividing gains proportionally to potential. In this royalty case, if you value stability and resistance to manipulation, you choose Nash. If you value responsiveness to shifting power dynamics, you choose KS."

  Marcus nodded slowly. "Then we aren't arguing about the math. We're arguing about whether this arrangement is a static contract or a living partnership."

  "Exactly," Elena said. "And that isn't something axioms can decide for us."
