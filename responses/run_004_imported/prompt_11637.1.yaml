      *   *Refining the Verdict for Punchiness:* I need to be more decisive. Let's argue that **Active Inference tips the balance toward Embodiment, but not necessarily Extension.** The Markov blanket cannot bear the metaphysical weight of solipsism. The "internal" states are only defined by their role in regulating the "blanket," which is inherently relational. Therefore, a strictly brain-bound view is a category error regarding the formalism.
      *   *Final Decision:* I will defend the view that **the Markov blanket is a modeling abstraction that cannot adjudicate metaphysical boundaries, but Active Inference structurally privileges an embodied (sensorimotor) ontology over a cerebralist one.** Hohwy's internalism is a philosophical imposition on the math, not a derivation from it. Clark is right that the formalism is compatible with embodiment, but the stronger claim is that *without* embodiment, the formalism loses its explanatory power regarding adaptive behavior.

      *Wait, let's sharpen:* The prompt asks for a specific verdict on Internalism vs. Embodied/Extended.
      *Verdict:* **The FEP/Active Inference framework undermines Methodological Internalism.** It does not prove Extended Cognition (that's a separate metaphysical claim), but it makes Brain-Bound Internalism scientifically unviable because the "internal" model is defined by its capacity to regulate the body-in-the-world. The Markov blanket is not a skull.
