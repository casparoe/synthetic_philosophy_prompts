answer: |-
  # The Blanket and the Body: Adjudicating the Internalism-Externalism Dispute in Predictive Processing

  **Introduction**

  The rise of the Free Energy Principle (FEP) and Predictive Processing (PP) has promised a unified theory of life, mind, and action. Yet, as the framework has matured from theoretical neuroscience into philosophy of mind, it has fractured along a familiar fault line: the boundary of the cognitive system. On one side stands Jakob Hohwy, who argues that the formal structure of the FEP—specifically the Markov blanket separating internal from external states—entails a robust methodological internalism. For Hohwy, the brain is necessarily the locus of cognition because it is the only site where the generative model resides; the world is forever hidden behind a veil of sensory inference. On the other side stands Andy Clark and proponents of embodied and enactive cognition, who contend that once *active inference* is taken seriously, the formalism dissolves the strict perception-action dichotomy. They argue that the Markov blanket is a porous, statistical device compatible with, and perhaps even demanding of, an embodied view where cognition leaks into the body and the world.

  This essay adjudicates this dispute for the purpose of establishing a metaphysical baseline for the present dissertation. I will argue that Hohwy's internalist interpretation relies on a category mistake regarding the ontological status of the Markov blanket, treating a modeling abstraction as a physical boundary. Furthermore, I will demonstrate that while the FEP does not automatically validate the *Extended* Mind thesis (the claim that tools constitute cognitive vehicles), the dynamics of *Active Inference* structurally mandate an *Embodied* view of cognition. Consequently, strict Brain-Bound Internalism is not a derivation of the FEP, but a philosophical imposition upon it. The verdict is this: **The Markov blanket formalism is metaphysically neutral regarding the location of the mind, but the mechanistic requirements of Active Inference render methodological internalism explanatorily bankrupt.** To model a living system minimizing free energy is necessarily to model an embodied agent coupled to its niche; to treat the brain as a solipsistic inferential engine is to violate the very conditions of adaptive success the FEP describes.

  **The Metaphysical Weight of the Markov Blanket**

  Hohwy's argument for internalism hinges on the topology of the Markov blanket. In the FEP, a self-organizing system is defined by a statistical boundary comprising sensory states (receiving input from external states) and active states (exerting influence on external states). Internal states are conditionally independent of external states given this blanket. Hohwy (2013, 2016) infers from this that the internal states are the only states that can encode a model of the world. Because the internal states only ever interact with the blanket (sensory inputs), they are in indirect contact with worldly causes. Therefore, Hohwy concludes, the cognitive system is bounded by the blanket, and since the skull provides the most salient biological instantiation of this blanket, cognition is brain-bound.

  The critical weakness in Hohwy's position lies in the move from *statistical conditional independence* to *ontological separation*. A Markov blanket is a factorization of a joint probability distribution; it is a tool for identifying which variables in a system can be treated as a distinct unit for the purpose of modeling. As Kirchhoff and Kiverstein (2019) have noted, where one draws a Markov blanket is often a pragmatic choice dictated by the scale and purpose of the inquiry, not a discovery of a natural kind akin to a cell membrane or a skull. One can draw a blanket around a neuron, a brain, a body, or a body-plus-tool system, provided the conditional independence properties hold at that scale.

  Hohwy treats the blanket as a *discovery* that reveals the mind's true container. However, if the blanket is a *stipulation* required to define a system for inference, then Hohwy's internalism becomes circular. He assumes the brain is the system, draws a blanket around the brain, and concludes the system is brain-bound. If one were to draw the blanket around the agent-environment coupling (as enactivists suggest), the "internal" states would include neural, bodily, and potentially environmental variables that are conditionally independent of the broader environment. Hohwy resists this by arguing that only neural states have the requisite complexity to encode a generative model. But this is an empirical claim about substrate capacity, not a formal consequence of the FEP. The formalism itself does not dictate that the "internal" states must be intracranial; it only dictates that *whatever* states play the role of the model must be separated from the causes they model by a blanket.

  Therefore, the Markov blanket cannot bear the metaphysical weight Hohwy places on it. It defines a *functional* boundary for a specific model, not an *ontological* boundary for the mind. To claim otherwise is to commit a form of mereological fallacy, mistaking the map (the statistical model) for the territory (the cognitive agent). If the location of the blanket is a modeling choice, then internalism is not a necessary truth of the FEP, but one optional perspective among many. This neutralizes Hohwy's strongest weapon: the claim that the math *forces* us to be internalists.

  **Active Inference and the Internalism/Externalism Calculus**

  If the Markov blanket is metaphysically neutral, does the specific mechanism of *Active Inference* shift the balance? Hohwy maintains that even with active inference, the "loop" is closed internally. The brain sends motor commands (active states) to change sensory input, but the *reason* for the action is to minimize the brain's own prediction error. The world is still just a cause of sensory states, manipulated to soothe the internal model.

  Clark's counter-argument relies on the nature of the control loop. In passive prediction-error minimization (perceptual inference), the system updates $q$ (beliefs) to match $p$ (causes). In active inference, the system changes $s$ (sensory states) by acting on $e$ (external states) to match expectations. Clark (2015) argues that this makes the world part of the cognitive solution. To minimize free energy efficiently, the agent must exploit the structural properties of the environment. The cognitive system cannot be understood in isolation from the environmental affordances it acts upon.

  Critics often invoke the Coupling-Constitution fallacy (Adams & Aizawa, 2008): just because the brain is tightly coupled to the body and world does not mean the body and world *constitute* the cognitive process. Hohwy leverages this to maintain that the coupling is merely causal, while the constitution remains neural. However, Active Inference undermines the premise of this fallacy within the FEP framework. In standard cognitivism, perception and action are distinct modules: one takes input, the other produces output. In Active Inference, action *is* a form of inference. Motor commands are selected to fulfill predictions about proprioceptive and exteroceptive flow.

  If action is inference, and action is inherently worldly (it changes the physical environment), then inference is inherently worldly. The "internal" model is not a static representation waiting to be updated; it is a set of policies for engaging with the world. A generative model that does not include the dynamics of the body and the physical constraints of the environment cannot minimize free energy effectively. For example, catching a ball requires a model that incorporates the aerodynamics of the ball and the kinematics of the arm. If the "internal" states are restricted to the cortex, they must simulate these physical dynamics in high fidelity. But if the agent uses the physical dynamics themselves (e.g., by moving the hand to a position where the ball is caught via mechanical constraint rather than computational prediction), the computational load is offloaded.

  This is where the calculus shifts. Under passive inference, the world is a distal cause to be represented. Under active inference, the world is a proximal resource to be regulated. While this does not prove the *Extended Mind* thesis in its strongest sense (that a notebook is literally part of the belief state), it validates *Embodied Cognition*. The body is not merely an effector; it is a component of the inferential architecture. The "self" that is evidenced is not a disembodied brain, but a whole organism maintaining its integrity against entropy.

  Hohwy might respond that the *policies* selecting the actions are still neural. But this retreats to a homunculus view that the FEP was designed to dissolve. In the FEP, there is no central executive; there is only the minimization of variational free energy across the hierarchy. If the minimization process relies on the specific physical properties of the body (e.g., the passive dynamics of walking), then the cognitive process of "walking" is distributed across the neural control and the musculoskeletal mechanics. To sever the body from the cognitive description is to lose the explanatory target. Thus, Active Inference does not just *allow* for embodiment; it *requires* it for explanatory adequacy. A brain-bound model of an active inferrer is a broken model, like modeling a flight controller without modeling the aerodynamics of the plane.

  **Verdict: Against Methodological Internalism**

  We are now positioned to deliver a verdict. The dispute between Hohwy and Clark is often framed as a battle over where the mind *is*. I propose that the FEP reframes this as a question of where the *system* is for the purpose of explanation.

  Hohwy is correct that formally, internal states are distinct from external states. However, he is incorrect that this distinction maps neatly onto the skull/skin boundary in a way that privileges neural tissue as the sole seat of cognition. The Markov blanket is a statistical interface, not a metaphysical cage. By treating it as the latter, Hohwy imposes a Cartesian dualism onto a framework that is fundamentally monistic and relational. His internalism is not a derivation of the FEP; it is a philosophical preference for a specific scale of analysis (the neural) masquerading as a mathematical necessity.

  Clark is correct that the formalism sits comfortably with embodiment, but we can go further. The FEP does not merely *accommodate* embodied cognition; it renders methodological internalism scientifically untenable. To treat the brain as a self-evidencing system in isolation is to ignore the "active" half of active inference. The generative model is a model of *sensorimotor contingencies*. It encodes how actions change sensations. Without the body and the world, there are no sensorimotor contingencies to model. Therefore, the content of the cognition is essentially relational.

  Does this support the *Extended* Mind? Here, caution is required. The FEP supports Extension only insofar as external resources become transparently integrated into the active inference loop (e.g., a blind person's cane becoming part of the proprioceptive model). But the primary victory is for *Embodiment*. The verdict for this dissertation chapter is as follows: **The Free Energy Principle falsifies Brain-Bound Internalism as a general theory of mind.** It does so not by proving that tools are minds, but by proving that brains are not minds in isolation. The unit of cognitive analysis is the embodied agent regulating its Markov blanket.

  Hohwy's fear is that externalism leads to a loss of explanatory precision (the "coupling" becomes too messy). But the internalist precision is illusory. A brain-bound model cannot explain how prediction error is minimized in real-time without referencing the bodily and environmental structures that make that minimization possible. To ignore them is to leave the mechanism incomplete.

  **Conclusion**

  The dispute between Hohwy and Clark reveals a tension between the mathematical elegance of the FEP and the messy reality of biological existence. Hohwy seeks to preserve the purity of the inferential process by locking it inside the skull. Clark seeks to liberate the process into the world where the action happens.

  My adjudication is that the mathematics supports Clark, provided we distinguish between ontology and explanation. The Markov blanket does not dictate where the mind *is* (ontology), but Active Inference dictates where we must *look* to explain the mind (explanation). Since we cannot explain active inference without modeling the body-environment coupling, methodological internalism is dead. The FEP implies that cognition is the process of an embodied organism keeping itself within viable bounds by predicting and acting upon its world. The brain is the hub of this process, but it is not the boundary. For the purposes of this dissertation, I will proceed on the premise that the cognitive system is the embodied agent, and that any analysis restricting itself to intracranial processes will necessarily fail to capture the generative models that constitute the mind. The blanket is not a wall; it is a membrane, and life happens in the exchange.
