      *   **Section 2: Active Inference and the Calculus.** Contrast passive updating with action. Explain how action makes the world part of the loop. Address the Coupling-Constitution fallacy (crucial for PhD level). Show how Active Inference bypasses this by making action *inferential*.
      *   **Section 3: The Verdict.** Synthesize. Hohwy's internalism is a philosophical preference, not a mathematical necessity. Clark's embodiment is structurally supported.
      *   **Conclusion:** Summarize. Implications for the dissertation.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address "Extended" cognition? Clark argues for Extended. Hohwy argues against.
