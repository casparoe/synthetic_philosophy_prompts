      *   *Wait, the prompt asks to defend a specific verdict.* "Active inference genuinely tips the balance toward embodiment." Okay, I will focus on Embodiment as the primary win, acknowledging Extension is harder but Internalism is definitely lost.
      *   *Key Philosophical Point:* Hohwy treats the blanket as a *discovery*. I must argue it is a *stipulation*. If it's a stipulation, you can stipulate a larger system.
