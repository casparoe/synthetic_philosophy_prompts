  2.  **Deconstruct the Positions:**
      *   **Hohwy (Internalist):**
          *   Core argument: The Markov blanket (sensory states + active states) separates internal states from external states.
          *   Inference is *always* indirect. The brain never sees the world, only sensory samples.
          *   Self-evidencing implies the system minimizes surprise relative to its *own* model.
          *   Metaphorical point: The skull is a natural boundary for the Markov blanket.
          *   Conclusion: Cognition is fundamentally solipsistic/brain-bound. Extended cognition is at best a pragmatic convenience, not a metaphysical reality.
      *   **Clark (Externalist/Embodied):**
          *   Core argument: The Markov blanket is a statistical tool, not an ontological boundary.
          *   Active Inference: Action changes the world to fit the model, not just the model to fit the world. This couples agent and environment tightly.
          *   The "boundary" is porous and movable (e.g., using a tool changes the sensory consequences of action, effectively shifting the blanket).
          *   Conclusion: The FEP supports embodied/embedded/extended cognition because the *unit of analysis* for minimizing free energy is the agent-environment coupling.

  3.  **Evaluate Issue (a): Metaphysical Weight of the Markov Blanket:**
      *   *Hohwy's view:* The blanket defines the system. If $I$ (internal) is conditionally independent of $E$ (external) given $B$ (blanket), then $I$ is the cognitive system.
      *   *Critique:* Conditional independence is a mathematical property of a specific factorization of a joint probability distribution. It does not automatically map to *ontological* boundaries. One can draw a blanket around a thermostat, a cell, or a human-plus-smartphone system. The choice of where to draw the blanket is often pragmatic/modeler-dependent, not discovered in nature like a bone.
