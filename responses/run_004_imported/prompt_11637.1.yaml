  8.  **Final Polish:** Ensure tone is appropriate (academic, rigorous). Check citations (Hohwy 2013, 2016; Clark 2013, 2015; Kirchhoff, etc.). Ensure the "no hedging" constraint is met.

      *Thesis:* **Hohwy's internalism relies on a category mistake regarding the Markov blanket, treating a statistical boundary as an ontological one. While the FEP does not entail the Extended Mind thesis, Active Inference structurally mandates Embodied Cognition, rendering strict Brain-Bound Internalism incompatible with the generative models required for adaptive life.**

