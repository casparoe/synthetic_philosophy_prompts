      *   *Vogel's Gas Gauge:* You look at the gauge (says F), look at the tank (looks F). Repeat. Conclusion: Gauge is reliable. Problem: You used the gauge to verify the tank reading in the first place (or vice versa, but they are coupled).
      *   *Cohen's Formalization:* Basic knowledge (gauge says F) $\rightarrow$ Reliability (Gauge is reliable). But the inference relies on the assumption that the gauge is reliable to establish the premises.
      *   *Key Responses/Moves:*
          1.  *Independence Requirement:* Verification requires a source independent of the one being tested.
          2.  *Track-Record Arguments:* Accumulating successful predictions *can* justify reliability, but only if the initial premises aren't question-begging.
          3.  *No-Defeaters:* Self-verification is okay *unless* there's a specific reason to doubt (a defeater).
          4.  *Closure Principles:* If you know $P$, and you know $P \rightarrow Q$, do you know $Q$? Bootstrapping suggests closure leads to easy knowledge.

