      *   *Cognitive Penetration (Churchland, Siegel, etc.):* Cognitive states (fear, desire, belief) can alter the early processing of sensory data. The hill *looks* steeper. The water *looks* closer.
      *   *The Challenge:* How to write this narratively? If I just say "he saw her kiss the other man," that's a hallucination (psychosis), not cognitive penetration. Cognitive penetration is subtler. It's about *affordances* and *salience*. A smile looks *flirtatious* rather than *polite*. A touch looks *lingering* rather than *accidental*. The visual experience itself has a different phenomenology.
      *   *The Twist:* The story needs to hinge on the ambiguity. Did he see what was there, or did his jealousy paint the canvas?

  3.  **Brainstorming Settings & Scenarios:**
