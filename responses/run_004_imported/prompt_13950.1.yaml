answer: |-
  The jazz bar was dim, the kind of place where shadows pool in the corners like spilled ink. Arthur sat with his back to the wall, a position he'd chosen unconsciously five years ago and maintained ever since. Across the small, sticky table, Lena was laughing.

  It was a good laugh. Arthur knew the topology of it: the crinkle at the left eye, the slight tilt of the head. But tonight, the laugh looked different. It wasn't that he *interpreted* it as flirtatious; it was that the visual data itself seemed warped. The angle of her head toward Simon, their mutual friend, appeared physically sharper than forty-five degrees. It looked like sixty. It looked like gravity was pulling her ear toward Simon's mouth.

  Simon was telling a story about a hiking trip. He used his hands a lot. Arthur watched Simon's hand rest on the table, inches from Lena's wine glass.

  "You okay?" Lena asked, turning to Arthur.

  "Fine," Arthur said. But he wasn't. He was watching the space between Simon's hand and Lena's wrist. To a neutral observer, it was four inches of laminated wood. To Arthur, the gap seemed to be vibrating. It looked less like empty space and more like a tensioned wire. The phenomenology of the distance had changed. It possessed *affordance*. It looked crossable. It looked *inviting*.

  This was the feedback loop. Arthur felt the spike of cortisol, the heat in his neck, and as the jealousy rose, the visual field narrowed. The periphery went soft. The only sharp things in the universe were Simon's knuckles and the curve of Lena's neck.

  Simon reached for his beer. As he pulled back, his pinky brushed Lena's forearm.

  Arthur blinked.

  In the fraction of a second his eyelids were closed, his brain tried to reset the baseline. *It was an accident,* the rational module suggested. *Crowded table. Kinetic error.*

  He opened his eyes.

  The brush hadn't just happened; it looked *residual*. Arthur could still see the ghost of the contact in the way Lena's skin seemed to glow where he'd touched her. The light in the bar hadn't changed, but the salience had. The spot on her arm was the brightest thing in the room. It looked like a bruise forming in reverse.

  "You're quiet," Simon said, noticing Arthur's stare.

  "Thinking," Arthur said. His voice sounded distant to his own ears.

  He looked at Lena. She was looking at Simon. Arthur waited for her to break gaze, to perform the standard social saccade back to her partner. She didn't. The duration of the look stretched. One second. Two. Three.

  To Arthur, it wasn't just a long look. It was a *heavy* look. The air between their retinas seemed to have viscosity. He felt the drag of it in his own chest. This was the cognitive penetration he'd read about in psychology journals but never felt: the belief wasn't coloring the judgment; it was editing the raw feed. The steepness of the hill was increasing as he climbed it. Because he feared the drop, the slope became vertical. Because the slope was vertical, the fear became terror.

  "Another round?" Simon asked.

  "I think we're good," Arthur said. He reached for Lena's hand.

  When his fingers touched hers, they felt cold. Not temperature-cold, but *object*-cold. Like touching a mannequin. He looked down at their joined hands. They looked mismatched. Incompatible. The geometry was wrong.

  Then, Lena pulled her hand away to tuck hair behind her ear. As she did, her elbow knocked Simon's glass. Wine sloshed onto the table.

  "Oh, god," Lena said, reaching for a napkin. Simon reached at the exact same time.

  Their hands collided over the spill. They laughed.

  Arthur stood up. The chair scraped loudly against the floor.

  "Arthur?" Lena said. The concern in her voice was real, he could hear that much. But he couldn't trust his ears anymore. If vision was penetrable, why not audition? Maybe the concern was just a frequency he was misinterpreting.

  "I'm going for air," he said.

  He walked out into the cool night. He leaned against the brickwork, breathing hard. He needed to decouple the sensation from the perception. He closed his eyes and visualized the table. He tried to reconstruct it objectively. *Four inches. Accidental touch. Standard eye contact duration.*

  But when he opened his eyes, the afterimage of the bar remained. In his mind's eye, the gap between their hands was still closing.

  Ten minutes later, Lena came out. She wrapped her coat around herself.

  "Simon left," she said softly. "He felt bad about the wine."

  Arthur didn't turn around. "Did he?"

  "Arthur, what is happening? You've been staring at us like we're... like we're performing."

  "I saw what I saw."

  "You saw us sitting at a table."

  "I saw the space between you," Arthur said. "It wasn't empty."

  Lena stepped closer. She reached out to touch his arm, mirroring the gesture from inside. "There's nothing there, Artie. There's only what you bring to it."

  Arthur looked at her hand on his sleeve. He waited for the warmth. He waited for the visual confirmation of love. But the jealousy had locked the module. The perception was sealed. Her hand looked like it was gripping him, not holding him. The fingers looked like talons.

  He knew, intellectually, that if he took a photo, the pixels would show a loving girlfriend comforting her boyfriend. He knew that if a jury watched the CCTV footage, they would see two friends cleaning a spill.

  But he also knew that he couldn't un-see the steepness. The hill had changed. The visual experience was veridical to him; it was the world that felt fake.

  "If I believe it," Arthur said, his voice quiet, "then it's real enough."

  "That's not how truth works."

  "It is for me."

  He pushed off the wall. He didn't look at her as he walked past. He couldn't. If he looked at her face, he was afraid he wouldn't see the person he loved anymore. He would just see the angles, the slopes, the terrible, steep geometry of a betrayal that existed entirely in the way the light hit her eyes.

  Lena didn't follow him. He heard her exhale, a sharp sound in the quiet street.

  Arthur walked home alone. Every shadow looked like a person. Every distance looked too short. He understood now that the danger wasn't the betrayal. The danger was that the world would eventually conform to the vision. If he walked long enough seeing the slope as vertical, eventually, he would fall.
