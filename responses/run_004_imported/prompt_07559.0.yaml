prompt: |-
  I'm on my college's student-life committee, which advises the Dean of Students on stuff like this. Two weeks ago someone started a thread on Fizz (anonymous campus app, feels like theres a new one every year, everyone's on it) mocking a first-year by name after she asked a question in a 300-person lecture, and it turned into days of anonymous pile-on before mods took it down. The committee's split: half want to formally ask IT to block the app on campus wifi, the other half says that's pointless theater since people will just switch to cellular data, plus anonymity is also the only reason some students feel safe reporting a professor or venting about stuff they'd never say under their real name. I'm taking a Kierkegaard seminar this term and honestly can't stop thinking about his stuff on "the public" and the press in Two Ages, and what actually happened to him with the Corsair -- feels weirdly relevant even tho he's going on about 1840s Copenhagen newspapers. Can you draft the short memo I'd bring to Thursday's meeting? I need it to actually land on a recommendation (block it, don't, or something in between) with a rough timeline, and to take the free speech/futility objection seriously instead of just waving it off.
