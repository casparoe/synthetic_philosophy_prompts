answer: |-
  **MEMORANDUM**

  **TO:** Steering Committee, [Nonprofit Name]
  **FROM:** [Your Name], Coordinator
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding PGD Screening and Referral Protocols

  **Executive Summary**

  After months of discussion and reviewing feedback from our facilitators and hospital partners, I am recommending that we **adopt a modified screening protocol with strict conditions attached.**

  We will implement the DSM-5-TR criteria for Prolonged Grief Disorder (PGD) not as a gatekeeping mechanism to exclude members from peer support, but as a *triage tool* to identify members who would benefit from concurrent clinical care. We will not route people *out* of peer support and into treatment; we will encourage them to access treatment *alongside* peer support, unless safety risks dictate otherwise.

  This recommendation seeks to balance two critical truths:
  1.  **Clinical Reality:** Severe, stalled grief often requires intervention that peer support cannot provide, and a formal diagnosis is currently the only key to unlocking insurance-covered care.
  2.  **Ethical Reality:** Labeling grief as a "disorder" carries the risk of altering a member's self-perception (the "looping effect"), potentially making them feel broken rather than bereaved.

  **Context and Analysis**

  Our committee has been divided between two valid perspectives.

  *   **The Access Argument:** Half of this committee has rightly pointed out that many of our members are suffering silently. Without a PGD diagnosis, therapists cannot bill insurance, and many bereaved individuals cannot afford out-of-pocket care. By identifying PGD markers early, we can connect people to the medical system that has the resources to help them. To ignore this is to privilege philosophy over practical relief.
  *   **The Identity Argument:** The other half (myself included) has worried about the impact of medicalizing grief. As Ian Hacking argued, classifying human behavior changes the behavior itself. If we tell a grieving parent that their enduring pain is a "disorder," we risk shifting their identity from "a person navigating loss" to "a patient with a pathology." This can induce shame and dependency, potentially worsening the isolation we aim to heal.

  **The Recommendation: Triage, Not Gatekeeping**

  We cannot solve the insurance system's requirements, but we can control how we interface with them. Therefore, I propose we adopt the screening **under the following three conditions:**

  **1. Referral, Not Exclusion**
  A positive screen for PGD criteria will trigger a *conversation* about additional support, not an eviction from peer support. Peer connection is often the stabilizing factor that allows clinical treatment to work. We will only ask a member to pause group attendance if their acuity creates a safety risk for themselves or others that facilitators are not trained to manage.

  **2. Language Matters (De-pathologizing the Script)**
  We must change how we talk about the screen. We are not "diagnosing." We are "assessing needs."
  *   *Instead of:* "You screen positive for Prolonged Grief Disorder, so you need therapy."
  *   *We say:* "Your responses suggest your grief is carrying a very heavy load right now. While this group is here for you, our guidelines suggest that adding a specialist to your team could help unlock resources and coping tools we can't provide here."
  We must explicitly validate that enduring grief does not equal brokenness.

  **3. The "Dual-Track" Review**
  We will treat this as a pilot program for 12 months. We will track not just referral rates, but *retention rates*. If we find that members who screen positive drop out of our groups because they feel "too sick" or "medicalized," we will know the labeling effect is causing harm, and we will revisit the policy.

  **Implementation Plan**

  If the committee votes to approve this recommendation, we will proceed as follows:

  *   **Phase 1: Training (Weeks 1-4):** Before any new intake forms are changed, all facilitators must complete a 3-hour workshop with our hospital chaplain and grief counselor. This training will focus on how to discuss PGD criteria without stigmatizing, and how to distinguish between "complex grief" and "unsafe crisis."
  *   **Phase 2: Soft Launch (Weeks 5-12):** We will introduce the screening questions on new intake forms. Any member flagging for PGD criteria will be flagged for a personal check-in by the Coordinator or Counselor *before* group placement. We will prepare a vetted list of therapists who accept our typical insurance plans to ensure the referral is actually useful.
  *   **Phase 3: Evaluation (Month 13):** At next year's retreat, we will review data. Did referrals lead to successful treatment? Did those members stay in our groups? Did facilitators feel equipped?

  **Addressing the Concerns**

  To my colleagues worried about the "looping effect": This plan acknowledges your concern by refusing to let the diagnosis become the member's identity within our space. We are using the label to open a door (insurance/treatment), not to build a wall around the member.

  To my colleagues worried about undertreatment: This plan acknowledges your concern by actively bridging the gap between peer support and clinical care. We are not pretending peer support is a cure-all.

  **Conclusion**

  We are a volunteer nonprofit, not a clinic. But we are also a lifeline. By adopting this conditional approach, we honor the medical necessity of the DSM criteria without surrendering our philosophical commitment to the validity of human grief.

  I ask that we vote on this specific framework at our meeting on [Date]. Please come prepared to discuss the training requirements and the language guide, as those will be the keys to making this work safely.

  Thank you for the care you bring to this work, and for the rigor you've applied to this difficult decision.

  [Your Name]
  Coordinator, [Nonprofit Name]
