answer: |-
  Good evening, everyone. For those of you who don't know me, I'm the Best Man and the older brother. For those of you who *do* know me, you know I've spent the last few weeks terrified of this moment. Specifically, I'm terrified of the left side of the room.

  I know that half of you are family and old friends who just want to know if my brother is happy. And the other half are from the Philosophy Department, including his advisor, Professor [Name], who is currently scanning my syntax for errors in modal logic. So, I've tried to strike a balance. If I get the theology wrong, the academics can correct me at the after-party. If I get the emotion wrong, the rest of you can correct me… well, never, because this is a wedding and I'm holding the microphone.

  My brother is finishing his PhD in Philosophy, specializing in the work of the sixteenth-century Jesuit Luis de Molina. For the family: Molina is famous for a concept called "Middle Knowledge." For the philosophers: I promise I won't conflate it with simple foreknowledge.

  Here's the idea. God knows everything that *could* happen. He also knows everything that *will* happen. But Middle Knowledge is the knowledge of what *would* happen. It's the knowledge of Counterfactuals of Creaturely Freedom. Statements like: "If [Groom] were at a dinner party on a rainy Tuesday, he would freely strike up a conversation with [Bride]."

  Now, [Groom] and [Bride] have a running joke about the night they met. It was a dinner party that only happened because a mutual friend's original plans fell through at the last minute. They joke about which "counterfactual" was true that night. They wonder: out of all the ways the universe could have gone, why did *this* one happen?

  It's tempting to call it luck. It's also tempting to call it fate. But if you know my brother, you know he rejects both. Luck is too random; fate is too coercive. Instead, he'd tell you this marriage is a perfect example of Molinist providence.

  See, in Molina's view, God doesn't override our freedom. He doesn't puppet us into falling in love. Instead, He surveys the vast landscape of "feasible worlds." These aren't just logically possible worlds; they are worlds compatible with what free creatures *would* actually do. God saw a world where a friend's plans cancelled, where a dinner party happened, and where—crucially—two specific people would freely choose to say hello, and eventually, to say "I do."

  And this is the part that matters most. It is easy to think providence is generic—that God just wanted my brother to be happy, and any nice partner would have sufficed. But Molinism tells us something more profound. The counterfactuals of freedom are specific to the individuals. The truth of "If [Groom] meets [Bride], he will love her" depends on *him* being [Groom] and *her* being [Bride].

  If either of them were a different person, the counterfactuals would be different. This specific world, with this specific love story, was feasible *only* because of who they uniquely are. God actualized this world not because He forced their hands, but because He knew that in these exact circumstances, their free hearts would align perfectly.

  So, this marriage is not an accident of history. It is a providentially ordered reality that rests entirely on the foundation of their genuine, libertarian freedom. It had to be them, because only they could make the counterfactuals of this world true. And they still had to say yes.

  [Groom], you've spent years studying how divine sovereignty and human freedom coexist. Tonight, you stop studying it and start living it. [Bride], thank you for making the true counterfactuals the ones about love.

  If everyone could please raise a glass.

  To [Groom] and [Bride]. May your life together be the most feasible of all worlds, and may your love remain freely chosen, every single day.

  To the happy couple!
