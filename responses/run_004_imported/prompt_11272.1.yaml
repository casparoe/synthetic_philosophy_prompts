answer: |-
  This is a classic collision between two legitimate philosophical frameworks: **Liberalism** (your view, focused on individual liberty and the harm principle) and **Communitarianism** (your sister's view, focused on social cohesion and shared values).

  Your sister is not necessarily "wrong" in a philosophical sense, but she is likely misapplying the concept in a way that creates practical injustice. Here is a breakdown of the principles at play, the legal reality, and how to distinguish harm from offense.

  ### 1. Is your sister onto something real?
  **Yes.** Her argument is a standard Communitarian critique of pure Liberalism.
  *   **The "Social Glue" Argument:** Sociologists and political philosophers (like Robert Putnam or Alasdair MacIntyre) argue that communities *do* require shared norms to function. If everyone does entirely whatever they want, trust erodes, predictability vanishes, and the "social contract" weakens.
  *   **The Role of Law:** Laws are not just about safety; they are also expressions of values. By zoning for "single-family homes," a town is making a statement about the kind of density and lifestyle it values.
  *   **The Fear:** Her concern is that if *no* behavior is off-limits as long as it's consensual, the community loses the ability to steward its own identity.

  **However,** there is a major flaw in applying this to your specific situation:
  *   **Who defines the "Glue"?** In a pluralistic society, "shared values" are often just the values of the majority imposed on the minority. If the "glue" requires excluding specific types of relationships, it becomes a tool of oppression rather than cohesion.
  *   **Zoning vs. Morality:** Zoning is technically supposed to be about *land use* (traffic, density, sewage, noise), not *moral use*. Using zoning to enforce moral conformity is generally considered an overreach of that specific legal tool.

  ### 2. Is there a principled way to separate "Harm" from "Offense"?
  This is the core of your debate. In legal philosophy, this is the difference between **John Stuart Mill's Harm Principle** and **Joel Feinberg's Offense Principle.**

  *   **The Harm Principle (Your side):** The state can only intervene to prevent harm to others. "Harm" usually means tangible damage to person or property (noise, traffic, violence, theft).
  *   **The Offense Principle (The gray area):** Feinberg argued that severe offense *can* sometimes justify regulation, but the bar must be extremely high. It can't just be "I dislike this." It has to be something unavoidable and deeply shocking to public sensibilities (e.g., public indecency).

  **Why the line usually holds:**
  In a modern liberal democracy, **private offense is not a valid ground for state coercion.**
  *   If your neighbor paints their house purple, it might offend your aesthetic sensibilities and lower your perceived property value, but the town can't stop it.
  *   If your neighbor is a loud atheist and you are a devout believer, your spiritual distress is real to you, but the town cannot silence them.

  **The "Character" Trap:**
  Your sister argues that allowing this trio erodes the town's "character." But "character" is subjective.
  *   In the 1960s, "character" was used to keep interracial couples out of certain neighborhoods.
  *   In the 1920s, "character" was used to keep unmarried couples from cohabitating.
  *   Today, it is being used against a polyamorous triad.

  If "protecting character" is a valid legal standard, it gives the majority a veto power over any minority lifestyle they find "weird." That creates a society where safety depends on conformity, not rights.

  ### 3. The Legal Reality: Selective Enforcement
  Regardless of the philosophy, the council members are likely on shaky legal ground for a practical reason: **Selective Enforcement.**

  You mentioned the rule has "never been enforced in decades."
  *   **Equal Protection:** If the town ignores this rule for college students, elderly friends living together, or cousins living together, but enforces it *only* against this triad because of their relationship structure, that is a violation of the Equal Protection Clause.
  *   **Animus:** The Supreme Court has ruled (in cases like *Romer v. Evans* and *Obergefell*) that laws cannot be born out of simple "animus" (hostility) toward a specific group. If council members admit they want to stop "normalizing" this relationship, they are admitting the motivation is moral disapproval, not public welfare.
  *   **Moore v. City of East Cleveland (1976):** This is the key precedent. The Supreme Court struck down a zoning law that limited occupancy to a narrow definition of "nuclear family." The Court recognized that the "family" is a fundamental liberty interest. While that case was about blood relatives, the logic protects the sanctity of the home from arbitrary government intrusion.

  ### 4. Synthesis: Where the Sister's Logic Breaks Down
  Your sister is right that communities need norms. She is wrong that *this* is the right norm to enforce.

  A community can have "glue" without policing private bedrooms. The glue can be:
  *   "We respect property lines."
  *   "We keep our noise down after 10 PM."
  *   "We don't harass our neighbors."

  If the triad is doing all of that, they are upholding the *functional* glue of the community. The council is trying to enforce *symbolic* glue (everyone must look the same).

  **The Verdict:**
  Your gut is legally and ethically stronger here.
  1.  **Harm vs. Offense:** The line holds. Private, consensual behavior that generates no nuisance is not "harm." Psychological discomfort caused by knowing someone else lives differently is not a actionable injury in a free society.
  2.  **The "Slippery Slope":** Your sister worries that allowing this dissolves all norms. The counter-argument is that allowing *majorities to police private morality* dissolves liberty. The latter is generally considered the greater danger in constitutional democracies.
  3.  **The "Character" Argument:** This is almost always a dressing up of "ban what makes us uncomfortable." If the town truly cared about "character" (e.g., stability, low density), they would enforce the rule against *everyone* (like the 4 college students down the street). The fact that they are targeting this specific house reveals the motive is prejudice, not planning.

  **Conclusion:**
  Your sister is articulating a valid *sociological* concern (cohesion requires norms), but she is advocating for an invalid *political* mechanism (using state power to enforce moral conformity in private life). In a diverse society, the "baseline sense of right and wrong" must be limited to how we treat each other publicly, not how we arrange our private relationships. If the town wins this, they aren't protecting "community"; they are establishing a tyranny of the majority.
