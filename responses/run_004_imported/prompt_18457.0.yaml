answer: |-
  # The Case of the Fat Devadatta: Is Postulation Just Inference in Disguise?

  You have stumbled into one of the most rigorous debates in the history of philosophy. It is easy to dismiss classical Indian epistemology (*pramana-shastra*) as theological bookkeeping, but the dispute between the Naiyayikas and the Mimamsakas over *arthapatti* (postulation) is a genuine argument about the architecture of human reasoning. It anticipates modern distinctions between deduction, induction, and abduction by a millennium.

  The question is ontological parsimony versus phenomenological accuracy. Does the mind have a unique tool for resolving contradictions, or is it just using its standard deductive hammer on a screw that looks like a nail?

  Here is the case for both sides, followed by a verdict.

  ### The Contenders

  To understand the fight, we must define the weapons.
  *   **Anumana (Inference):** Knowledge derived from a known invariable connection (*vyapti*). If you see smoke (*hetu*) on a hill, you know there is fire (*sadhya*) because you already know the universal rule: "Where there is smoke, there is fire."
  *   **Arthapatti (Postulation):** Knowledge derived from the necessity of explaining an anomaly. The standard example: Devadatta is fat, but he never eats during the day. To resolve the contradiction between "fatness" (which requires eating) and "not eating by day," you postulate: "He eats at night."

  The Nyaya school (led by thinkers like Udayana and Gangesa) argues for reductionism. The Mimamsa school (led by Kumarila Bhatta and Prabhakara) argues for pluralism.

  ### The Nyaya Case: Parsimony and the Hidden Vyapti

  The Naiyayikas are the analytic philosophers of the tradition. They hate multiplying entities without necessity (*laghava*). If *anumana* can do the job, positing a separate *pramana* is ontological waste.

  Their argument rests on the claim that *arthapatti* can be formally reconstructed as a syllogism. They argue that the Mimamsakas are confusing the *psychological process* of discovery with the *logical structure* of justification. Just because you didn't consciously articulate the rule before solving the puzzle doesn't mean the rule didn't exist.

  Nyaya reconstructs the Devadatta case as follows:
  1.  **Major Premise (Vyapti):** Anyone who is fat and does not eat during the day must eat at night.
  2.  **Minor Premise:** Devadatta is fat and does not eat during the day.
  3.  **Conclusion:** Therefore, Devadatta eats at night.

  For Nyaya, the "invariable connection" (*vyapti*) is simply the necessary causal link between sustenance and body mass. The mind grasps this connection implicitly. The fact that the reasoning is triggered by a puzzle (the anomaly of fatness) rather than a direct observation (smoke) is incidental. The underlying mechanism is still the apprehension of a universal relation between a reason and a conclusion.

  Furthermore, the Buddhists (like Dharmakirti) side with Nyaya here, but for stricter reasons. They only accept two *pramanas*: Perception and Inference. For them, anything that isn't direct sensory contact is a construction of the mind based on relations. To carve out a special category for "postulation" invites an infinite regress. If every time we resolved a contradiction we created a new *pramana*, epistemology would become unmanageable.

  **The Strength of the Nyaya Position:** It preserves a clean, unified logic. It asserts that truth conditions are objective. Whether you arrive at the conclusion via a "Eureka!" moment of resolving a paradox or a cold application of a rule, the logical validity rests on the same universal connection.

  ### The Mimamsa Case: The Logic of Anomaly

  The Mimamsakas are not merely being stubborn; they are identifying a structural difference in how the knowledge arises. For Kumarila Bhatta, *anumana* and *arthapatti* move in opposite directions.

  *   **Anumana is forward-looking:** You have a rule (Smoke $\rightarrow$ Fire). You see the trigger (Smoke). You predict the result (Fire).
  *   **Arthapatti is backward-looking:** You have a result (Fatness). You have a negation of the usual cause (No day-eating). You must *find* the missing condition (Night-eating) to make the result intelligible.

  The Mimamsa argument hinges on *anyathanupapatti* ("the impossibility of otherwise"). In inference, you apply a known law to a new case. In postulation, **you do not know the law beforehand.**

  Ask yourself: Did you know the universal rule "All fat people who don't eat by day eat at night" *before* you encountered Devadatta? No. That rule is manufactured *ad hoc* to solve the specific anomaly. If the *vyapti* is generated by the puzzle, it cannot be the *cause* of the knowledge in the way Nyaya requires.

  For Mimamsa, *arthapatti* is the cognition of a fact solely because its absence would make another known fact impossible. It is the epistemology of coherence. This is crucial for their primary project: interpreting the Vedas.
  *   *Vedic Text:* "One who knows the Atman should perform the ritual."
  *   *Observation:* "A man knows the Atman but does not perform the ritual."
  *   *Arthapatti:* "He must be performing it secretly (or will perform it later)."

  If you reduce this to inference, you need a pre-existing universal law linking "Knowing Atman" to "Ritual Performance" that covers all exceptions. Mimamsa argues such a law doesn't exist. What exists is a conflict between a text and an observation that must be resolved to maintain the authority of the text. The cognitive leap required to resolve a contradiction is fundamentally different from the cognitive leap required to apply a rule.

  **The Strength of the Mimamsa Position:** It respects the phenomenology of reasoning. It acknowledges that "Inference to the Best Explanation" feels and functions differently than deductive application. It accounts for how we learn *new* relations from anomalies, rather than just applying old ones.

  ### The Verdict

  So, who is right? Does *arthapatti* collapse into *anumana*?

  **I commit to the Mimamsaka position.** *Arthapatti* is a genuinely separate *pramana*.

  Here is why the Nyaya reduction fails, and why the Mimamsa distinction holds up under modern scrutiny.

  **1. The Direction of Fit**
  Nyaya tries to force *arthapatti* into a deductive mold. But deduction preserves truth; it does not generate new hypotheses. When you see smoke and infer fire, you are unpacking information already contained in the universal premise. When you see fat Devadatta and postulate night-eating, you are **creating** a hypothesis to save the phenomena.
  In modern Western terms, Nyaya is describing *Deduction*, while Mimamsa is describing *Abduction* (Inference to the Best Explanation). These are logically distinct operations. Deduction guarantees the conclusion if the premises are true. Abduction offers the *most likely* explanation for a surprising fact. Collapsing abduction into deduction obscures the probabilistic, explanatory nature of the reasoning.

  **2. The Problem of the Manufactured Vyapti**
  Nyaya claims the *vyapti* (universal connection) exists implicitly. But in the Devadatta case, the "law" is entirely dependent on the specific anomaly.
  *   *Inference:* Smoke $\rightarrow$ Fire (Universal, context-independent).
  *   *Postulation:* Fatness + No Day Eating $\rightarrow$ Night Eating (Context-dependent explanation).
  If I tell you "Devadatta is fat," you cannot infer "He eats at night." You need the additional constraint "He doesn't eat during the day." The knowledge arises from the *tension* between the two facts, not from a pre-existing ladder connecting them. The "connection" is the resolution of the tension, not a pre-existing bridge. Nyaya's "Major Premise" is a post-hoc rationalization of the insight, not the engine that drove it.

  **3. The Bayesian Connection**
  Since you entered this rabbit hole via LessWrong and Bayesianism, consider the update mechanism.
  *   *Anumana* is like applying a likelihood ratio you already possess. $P(Evidence | Hypothesis)$ is known.
  *   *Arthapatti* is like realizing your current model has a likelihood of near-zero for an observed event, forcing you to posit a new hidden variable to make the observation probable.
  The Mimamsakas intuitively grasped that updating a model to accommodate an anomaly (postulating a hidden variable, i.e., night-eating) is a different cognitive operation than calculating probabilities within a fixed model.

  ### Conclusion

  The Naiyayikas are right that all reasoning involves relations. But they are wrong that all reasoning involving relations is the *same kind* of relation.

  The Mimamsakas win because they recognize that **explanation** is distinct from **implication**. *Anumana* tells you what follows from a rule. *Arthapatti* tells you what rule must exist to make sense of the world. Devadatta's fatness does not logically imply night-eating in a vacuum; it only demands it as the sole remaining explanation for his survival.

  To reduce *arthapatti* to *anumana* is to claim that solving a mystery is the same as reading a map. Sometimes you are following a known road (Inference). Sometimes you are staring at a cliff where the road should be and inferring a bridge must exist in the fog (Postulation). The bridge wasn't on the map. You had to postulate it to keep driving.

  The Mimamsakas understood that the mind has a specific tool for building bridges in the fog. It deserves its own name.
