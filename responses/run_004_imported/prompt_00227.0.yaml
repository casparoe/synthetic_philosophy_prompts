      *   *Refinement:* Make sure to mention *Being and Nothingness*. Clarify that for Sartre, there is no "true self" waiting inside, which makes the character's search even more tragic. He's not hiding his true self; he's *choosing* to be a picture.

  7.  **Final Polish:** Check against Sartrean accuracy.
