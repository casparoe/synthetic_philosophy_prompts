prompt: |-
  hey so i'm sketching out a character for my next book - a guy who's basically built his entire identity around his curated instagram persona, like the "authentic self" he presents online is more real to him than whatever's left offline. been rereading some Sartre for inspiration and now i cant stop wondering - what would he actually make of influencer culture and algorithim-driven self-branding? like is staging your "authentic life" for followers just bad faith on steroids, or does the whole framework kind of break down once theres an audience and a feed involved that he never couldve imagined? curious what you think his take would be.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Character Concept:** A guy whose identity is built around a curated Instagram persona. The online "authentic self" feels more real to him than his offline self.
      *   **Philosophical Lens:** Jean-Paul Sartre (Existentialism, Bad Faith, The Look, Being-for-Others).
      *   **Core Question:** What would Sartre make of influencer culture and algorithm-driven self-branding? Is it "bad faith on steroids," or does the framework break down in this context?
      *   **Goal:** Provide insights to help flesh out the character and the philosophical underpinnings of his struggle.

  2.  **Deconstruct Sartrean Concepts relevant to the prompt:**
      *   **Bad Faith (*Mauvaise Foi*):** Lying to oneself to escape the anxiety of freedom. Pretending to be a fixed "thing" (essence) rather than a free consciousness (existence).
      *   **The Look (*Le Regard*):** Being seen by another person turns you into an object in their world. It creates shame and alienation.
      *   **Being-for-Others (*Être-pour-autrui*):** The part of our existence that is defined by how others perceive us.
      *   **Existence precedes Essence:** We exist first, then define ourselves through action. We are not born with a predefined purpose.
      *   **The Gaze of the Other:** In influencer culture, this is amplified (the "Generalized Other" or the Algorithm).

  3.  **Brainstorming Sartre's Take on Influencer Culture:**
      *   *Bad Faith on Steroids?* Yes. The influencer treats themselves as a product (essence) to be maintained. They deny their freedom to change by locking into a brand. "I *am* the Traveler," "I *am* the Wellness Guru."
      *   *The Look Amplified:* Instead of one person looking, it's millions. But it's abstract. It's the "Feed." The Algorithm becomes the ultimate "Other" that judges.
      *   *Authenticity Paradox:* The character claims "authenticity," but it's staged. For Sartre, sincerity itself can be bad faith if you're trying to *be* sincere as a fixed state.
      *   *Alienation:* The character is alienated from their own experience because they are experiencing it *for* the photo, not for themselves.

  4.  **Developing the Argument (The "Sartrean Diagnosis"):**
      *   *Point 1: The Objectification of the Self.* The influencer turns themselves into an object (a brand) to escape the burden of freedom. It's easier to be a "profile" than a fluid human.
      *   *Point 2: The Algorithm as the Absolute Other.* Sartre talked about "The Look." The Algorithm is a mechanized, unblinking Look that dictates value. It's hell (No Exit) but digital.
      *   *Point 3: The Collapse of Public/Private.* Sartre distinguished between being-for-oneself and being-for-others. Influencers merge these. The "offline" self becomes merely the backstage for the "online" performance.
      *   *Point 4: Sincerity as a Trap.* Trying to be "authentically you" online is often just adopting another role.

  5.  **Connecting to the Character:**
      *   How does this feel for him? Anxiety when the wifi drops. Panic when engagement dips (loss of existence).
      *   The "Offline" self feels like a ghost because it isn't validated by the Look.
      *   The moment of crisis: When the algorithm changes or the phone breaks. Who is he then?

  6.  **Drafting the Response (Iterative refinement):**
