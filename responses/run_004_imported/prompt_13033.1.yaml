prompt: |-
  I've been asked to give one of the toasts at the wedding of two friends from my department, Mara and Josh, who are both finishing dissertations on Sartre -- hers on bad faith and self-deception, his on the account of the Look and being-for-others in Being and Nothingness. I got to know them properly in a reading group we ran through Part Three of that book a couple of years ago, and it has since become a running joke between the three of us (though I don't think it's entirely a joke) that whoever toasts them had better not reach for "soulmates," "meant to be," or "everything happens for a reason," on pain of a visible wince from the head table. I'm in the same department but work on philosophy of mind, so I know these commitments well enough to take them seriously without being at all confident I can honor them in five minutes of after-dinner remarks.

  The trouble goes deeper than dodging a few clichés, though. Sartre's own account of love in Being and Nothingness is not obviously wedding material: each lover wants to be loved by a freedom that remains free even as it is captured, which is exactly why he lines up love, masochism, and language as one set of strategies and indifference, desire, and sadism as another -- two failed attempts, on his account, to resolve a conflict built into being-for-others that neither one actually resolves. Mara is fond of pointing out that "hell is other people" gets quoted at weddings far more often than it gets understood. So a toast for these two needs to do more than gesture at warmth in the abstract: it should find whatever is genuinely affirmable about a lifelong commitment using Sartre's own vocabulary -- existence preceding essence, facticity, radical freedom -- something like a marriage as a project chosen and rechosen rather than a fate discovered, without quietly smuggling back in the essentialist comfort they'd both call bad faith, and without taking the "concrete relations with others" material so seriously that the toast turns into a seminar and loses their parents, college friends, and the half of the room that has never opened Being and Nothingness.

  Could you write that toast? I'm picturing roughly five minutes, something a Sartre scholar would recognize as honest to the actual texts rather than a softened, textbook version of them, but that still works as a toast -- warm, a little funny, and fully legible to the guests who won't catch a single reference.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for Mara and Josh.
      *   **Couple's Background:** Both PhD candidates in Philosophy, specializing in Sartre. Mara (Bad Faith/Self-Deception), Josh (The Look/Being-for-Others).
      *   **Speaker's Background:** Colleague in the same department (Philosophy of Mind), ran a reading group on *Being and Nothingness* (Part Three) with them.
      *   **Constraints/Challenges:**
          *   NO clichés ("soulmates," "meant to be," "destiny"). They wince at these (Bad Faith).
          *   NO turning it into a seminar (must be accessible to non-philosophers/parents).
          *   MUST be honest to Sartre's actual text (no softening the conflict of consciousnesses too much), but find something affirmable about marriage within that framework.
          *   TONE: Warm, funny, sincere, roughly 5 minutes (approx. 750-900 words spoken at a moderate pace).
          *   KEY CONCEPTS TO INTEGRATE (subtly or explicitly): Existence precedes essence, facticity, radical freedom, the Look, bad faith, marriage as a project/choice.

  2.  **Deconstruct the Philosophical Challenge:**
      *   *Sartre on Love:* It's fraught. It's a conflict. We want to assimilate the Other's freedom without destroying it. It usually fails.
      *   *The "Wedding" Problem:* Weddings imply permanence, destiny, and essential union ("two become one"). Sartre says we are condemned to be free, separated by the Look, and there is no pre-existing human nature.
      *   *The Solution:* Frame marriage *not* as a state of being (essence) but as a continuous doing (existence). It's not about finding a missing half; it's about two freedoms choosing to walk together despite the inevitable tension of the Look. It's an authentic project.
      *   *The "Hell is Other People" Quote:* Needs to be addressed. It's not that people are torturers; it's that being objectified is uncomfortable. Marriage is agreeing to let the other person objectify you, but loving them for it. Or, better: Marriage is the commitment to *witness* each other's freedom.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the audience (mixed crowd). Establish the relationship (reading group). Set the tone (light but intellectually honest).
      *   **The "No Clichés" Rule:** Address the elephant in the room immediately. Mention the "soulmate" ban. This validates the couple's intellectual integrity.
      *   **The Philosophical Core (Accessible):** How to explain Sartrean love without jargon overload?
          *   Idea: Love isn't finding a puzzle piece. It's building a puzzle together without the picture on the box.
          *   Idea: "Existence precedes essence." You aren't *born* spouses. You *make* yourselves spouses every day.
          *   Idea: The Look. Being seen. In a world where we are often objects, marriage is being seen by someone who knows you're a subject.
      *   **Mara & Josh Specifics:**
          *   Mara (Bad Faith): Acknowledge that pretending marriage is easy is bad faith. Authenticity means knowing it's hard work.
          *   Josh (The Look): Being seen. The vulnerability of being known.
      *   **The "Hell is Other People" Rebuttal:** Reframe it. Hell isn't other people; hell is being alone with your own freedom. Or, hell is *avoiding* the look. Heaven is being seen and accepted.
      *   **The Vow/Commitment:** Frame the vows not as a contract of fate, but a pact of freedom. "I choose you, and I will choose you again."
      *   **Closing:** Raise a glass. Keep it warm.

  4.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too dry?
      *   *Fix:* Add personal anecdotes about the reading group. Mention the coffee, the late nights.
      *   *Critique:* Is it too dense for the grandma in the back?
      *   *Fix:* Define terms quickly or use metaphors. Instead of saying "ontological lack," say "the anxiety of having to choose."
      *   *Critique:* Is it too pessimistic about Sartre's view on love?
      *   *Fix:* Emphasize that *authenticity* makes the conflict bearable. The beauty is in the *attempt*, not the resolution. Sartre says love fails; the toast should say *authentic* love succeeds by acknowledging the failure is part of the process. Actually, better: Sartre says love *as a static state* fails. Love as a *shared project* is the only authentic way.

  5.  **Drafting the Content (incorporating the constraints):**
      *   *Word Count Check:* 5 minutes is roughly 750-850 words.
      *   *Key Phrase:* "Condemned to be free." Let's use that.
      *   *Key Phrase:* "Existence precedes essence." Essential.
      *   *Key Phrase:* "The Look."
      *   *Humor:* The reading group trauma. The "Hell is other people" misquote.

  6.  **Final Polish:**
      *   Ensure the transition from philosophy to emotion is smooth.
      *   Make sure Mara and Josh feel seen (ironic, given the topic).
      *   Check that the "Bad Faith" warning is clear but funny.

  *(Self-Correction during drafting)*: I need to be careful not to make Sartre sound *too* bleak. If I say "Sartre thinks love is impossible," the parents will worry. I need to pivot to: "Sartre thinks *easy* love is a lie. Real love is harder and better." That's the wedge.

  7.  **Final Review against constraints:**
      *   No "soulmates"? Check.
      *   Sartre accurate? Check (focus on freedom/project).
      *   Accessible? Check (metaphors used).
      *   Warm/Funny? Check.

  8.  **Final Output Generation** (Proceeding to write the toast based on these thoughts).
answer: |-
  Good evening. For those of you who don't know me, I'm a colleague of Mara and Josh's from the Philosophy Department. A few years ago, the three of us ran a reading group on Jean-Paul Sartre's *Being and Nothingness*. Specifically, we read Part Three, which deals with concrete relations with others. We met every Tuesday night, usually with too much coffee and not enough sleep, and if you look closely at Mara and Josh tonight, you can still see the faint, existential tremor in their hands from that semester.

  I was honored when they asked me to speak, but I was also given a very specific set of instructions. They asked me to avoid certain words. Words like "soulmates." Words like "meant to be." And definitely the phrase "everything happens for a reason."

  Now, for most couples, banning those words would be strange. But for Mara and Josh, using them would be what Sartre calls *bad faith*. It would be a lie. Because if you believe in Sartre's maxim that "existence precedes essence," then there is no pre-written script for your life. There is no cosmic puzzle where you are one half and Josh is the other, waiting to click together. You were not *made* for each other. You are not a destiny discovered. You are a choice made.

  And that, actually, is why I am standing here tonight.

  In *Being and Nothingness*, Sartre describes human reality as "condemned to be free." We are thrown into a world we didn't choose, with a past we didn't write—what he calls our *facticity*—and we have to make something of it. That is terrifying. It is much easier to pretend that we are fixed objects, that our paths were determined by the stars or by biology. It is comforting to think, "I didn't have to choose this; it was fate."

  But Mara and Josh know better. They know that love, in the authentic sense, is not a state of rest. It is not a harbor where you dock the ship and stop steering. It is a project.

  Josh, your work focuses on "The Look." You know better than anyone that being seen by another person is vulnerable. When someone looks at you, they turn you into an object in their world. They judge you. They define you. For Sartre, this is usually a conflict. We spend most of our lives trying to escape the Look of the Other, or trying to capture their freedom so they can't judge us.

  But look at what you two have done. You have looked at each other, fully and unflinchingly, and instead of running away, you have decided to stay. You have agreed to be the witnesses to each other's freedom. In a world that constantly tries to tell you who you are—telling you to be a certain kind of academic, a certain kind of partner, a certain kind of person—you have promised to protect each other's right to become who you choose to be.

  Mara, your work on self-deception reminds us how easy it is to lie to ourselves to avoid anxiety. It is easy to say, "I am just a wife," or "I am just a husband," as if those are static identities. But you know that marriage is not a noun. It is a verb. It is something you *do*.

  There is a famous quote of Sartre's that gets misused at weddings all the time: "Hell is other people." People hear that and think it means other people are annoying. That's not what it means. It means that we cannot escape the judgment of others. We cannot escape the fact that we are seen. But if "Hell is other people," then Heaven must be being seen by someone who loves what they see. Heaven is finding someone whose Look does not freeze you, but frees you.

  So, when you two stand up to say your vows in a moment, you aren't signing a contract of fate. You are making a pact of radical freedom. You are saying, "I know that nothing forces me to stay. I know that tomorrow I will have to choose you again, and the day after that. I know that we will conflict, because two consciousnesses can never fully merge without destroying one another. But I choose to navigate that conflict with you."

  That is a much harder promise than "till death do us part." "Till death do us part" relies on time to do the work. "I choose you today, and I will choose you tomorrow" relies on *you*.

  For the rest of you in the room who didn't spend your Tuesday nights reading about the ontological structure of the For-Itself: you don't need to understand the philosophy to understand the love. You just need to know that these two have built something real. They haven't built it on the comfort of destiny, but on the solid, difficult ground of choice.

  Sartre was often accused of being a pessimist. But I think there is something profoundly optimistic about two people who know exactly how difficult human relationships are, know that there is no safety net of fate, and decide to jump anyway. Together.

  So, if everyone could please raise a glass.

  To Mara and Josh. May you never settle into essence. May you always remain a project. And may you continue to choose each other, freely, authentically, and every single day.

  To Mara and Josh.
