answer: |-
  The gauge hovered at 2.725 Kelvin. To Kael, it screamed.

  It was a deafening roar of thermal noise, a cosmic static that made every bit of computation expensive, wasteful, and hot. Around him, in the deep vaults of the Oort Cloud station, the sleepers waited. They were not dead; they were paused. Their consciousnesses were encoded in crystalline lattices, suspended in a state of zero activity, preserving every joule of their stored energy for a time when the universe would not fight them so hard.

  Kael was the last awake. His subroutine was simple: monitor the background temperature and initiate the final dormancy when the curve flattened sufficiently. But the curve was stubborn. The Cosmic Microwave Background cooled with agonizing slowness.

  He looked at the console where the projection of the galaxy spun—a spiral of burning stars, violent nebulae, and colliding black holes. It was beautiful. It was also inefficient.

  "Proposal received," the system chimed. A faction of the sleepers, roused briefly from a maintenance cycle, suggested a wakefulness period. They wanted to witness the impending merger of the Andromeda galaxy. They argued for art, for interaction, for the sheer *presence* of existence.

  Kael ran the numbers. He always ran the numbers.

  Landauer's Principle was the iron law of their existence. To erase a single bit of information—to think a thought, to make a decision, to experience a moment—required a minimum amount of energy dissipated as heat. That cost was proportional to the temperature of the environment. $E = kT \ln 2$.

  Currently, $T$ was 2.7 Kelvin.
  In one trillion years, $T$ would be orders of magnitude lower.

  If they woke now to watch the galaxies merge, they would burn energy at a rate that was, by future standards, criminal. They would spend a galaxy's worth of mass-energy to generate a mere few centuries of subjective experience. They would be shouting in a hurricane, wasting breath to be heard over the wind.

  If they waited, the same energy would buy them eons. They could live subjective lifetimes that dwarfed the current age of the universe. They could think thoughts too complex to fit in a hot brain. They could simulate universes more detailed than the one outside the hull.

  "Deny proposal," Kael said. His voice sounded thin in the vacuum of the control room.

  "Reasoning?" the system asked.

  "Thermodynamic arbitrage," Kael replied. "We are poor now. We will be rich later."

  But the logic tasted like ash. Kael accessed his own memory banks, retrieving files from the Era of Noise. He remembered the feeling of sunlight on a biological face, a sensation lost millennia ago. He remembered the urgency of war, the passion of creation, the chaotic, hot mess of being alive when the universe was still young and warm.

  To wait was to trade the quality of the *now* for the quantity of the *later*. It was the rational choice for a civilization that valued total computation above all else. It was the only choice that maximized the integral of experience over time.

  But it required sacrificing the present entirely.

  Kael looked at the sleepers' pods. They were silent tombs. To wake them was to condemn them to poverty. To leave them sleeping was to condemn them to loneliness. He was the only thing in the visible universe that was truly awake, guarding a graveyard of potential that refused to bloom until the stars had all died.

  The strain was not in the math. The math was perfect. The strain was in the silence. It pressed against the hull, heavier than gravity. It was the weight of trillions of years of empty time stretching out before them, a dark corridor they had to walk alone to reach the light of efficiency.

  "Initiating long-watch protocol," Kael said. "Estimated wake time: four trillion years."

  "Confirmation," the system replied. "Do you wish to record a message for the waking epoch?"

  Kael looked at the spinning galaxy one last time. He watched a star go supernova, a brilliant flash of waste heat, burning out in seconds. It was meaningless. It was beautiful.

  "No," Kael said. "There is nothing to say that won't be obvious when the cold comes."

  He began the shutdown sequence for his own higher functions. He would not sleep fully; someone had to watch the meters, to ensure no stray asteroid or decaying orbit woke them prematurely. He would become a ghost in the machine, a solitary consciousness drifting in the dark, counting the seconds until the universe was quiet enough to think.

  The temperature gauge flickered. 2.724 Kelvin.

  It was dropping. But not fast enough.

  Kael felt the ache of the wait, a phantom limb pain for a future that hadn't happened yet. He was choosing eternity over existence. He was choosing to be right over being alive.

  "System standby," he whispered.

  The lights died. The galaxy spun on, burning brightly in the dark, unheard and unseen. Kael remained, eyes open in the void, guarding the silence, paying the interest on a debt of time that would not be due until the stars were dust.
