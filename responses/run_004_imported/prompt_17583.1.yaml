answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Foundation Name]
  **FROM:** Methodological Standards Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Optional Stopping and Bayesian Reporting in Preclinical Grants

  **Recommendation**

  The Methodological Standards Committee recommends that the Board **adopt the proposed exception** allowing optional stopping, provided that grantees report Bayes Factors (BF), **contingent upon three strict conditions**: (1) pre-registration of the prior distribution used to calculate the BF; (2) pre-registration of the specific stopping boundaries (e.g., "stop if BF > 10 or < 1/10"); and (3) mandatory reporting of the sample size trajectory regardless of when the experiment terminated.

  We do not recommend a blanket adoption of the exception as originally phrased, nor do we recommend maintaining the current blanket prohibition. The reasoning below details why this qualified approach is necessary to satisfy both the theoretical coherence demanded by our Bayesian proponents and the error-control concerns raised by our frequentist skeptics.

  **Context and Theoretical Validity**

  The subcommittee's proposal rests on a sound theoretical foundation. As our theoretically inclined members have correctly argued, the Likelihood Principle dictates that the evidence contained in the data regarding two hypotheses is fully captured by the likelihood ratio. From this perspective, the *stopping rule*—whether the sample size was fixed in advance or determined by a sequential check—is irrelevant to the interpretation of the evidence *once the data are in hand*.

  To demand a correction to a Bayes Factor for optional stopping is, strictly speaking, mathematically incoherent within the Bayesian framework. A BF of 10 represents the same update in belief whether it was obtained on the first look or the tenth. Furthermore, in preclinical research, rigid adherence to fixed sample sizes raises ethical concerns regarding the 3Rs (Replacement, Reduction, Refinement). If a treatment effect is overwhelmingly strong early on, or if animal suffering is evident, continuing to a fixed N is scientifically wasteful and ethically questionable. On these grounds, the argument for allowing optional stopping is robust.

  **The Skeptics' Concern: Calibration and Behavior**

  However, the Board must also weigh the vigorous objections raised by our working statisticians. Their opposition is not based on a misunderstanding of the Likelihood Principle, but on a pragmatic assessment of researcher behavior and institutional risk.

  Their argument is best understood through the lens of error statistics (as articulated by Mayo and others): while the *evidence* in a specific dataset may be independent of the stopping rule, the *reliability of the procedure* used to generate that dataset is not. If a foundation permits researchers to monitor data without constraint, a sufficiently motivated researcher can exploit the volatility of early data. They may continue sampling until noise produces a transient spike in the Bayes Factor that crosses the threshold for "strong evidence," then stop immediately.

  While the resulting BF is mathematically valid *conditional on the model*, the *frequency* with which this procedure yields false positives is inflated. In a funding environment where publication and grant renewal depend on achieving "respectable" evidence, the optional stopping rule becomes a tool for selection bias. The skeptics are correct that recasting data-dredging as "Bayesian monitoring" does not eliminate the risk of false discovery; it merely shifts the mechanism from p-hacking to "BF-hacking." If our foundation funds 100 projects where every researcher waits for a BF > 10, we must ask: how many of those 100 findings will fail to replicate? The Likelihood Principle does not answer this; only a consideration of the long-run properties of the *process* does.

  **Synthesis: Regulating the Process, Not the Metric**

  The conflict, therefore, is not truly between Bayesian and Frequentist mathematics, but between *inferential coherence* and *procedural accountability*. We can resolve this by accepting the Bayesian metric while regulating the research behavior that generates it.

  1.  **Pre-registration of Priors:** The ease with which a Bayes Factor can be manipulated often lies in the flexibility of the prior. A "vague" prior can be tuned post-hoc to maximize the BF. By requiring the prior distribution to be fixed in the preregistration, we remove a degree of freedom that allows for gaming.
  2.  **Pre-registration of Stopping Boundaries:** We accept the Likelihood Principle's claim that we need not *correct* the BF for stopping. However, we adopt the Frequentist requirement that the *rule* itself be transparent. If a researcher declares, "I will check weekly and stop if BF > 10," they are bound to that rule. If they deviate, the grant is considered non-compliant. This does not invalidate the BF mathematically, but it allows the foundation to audit the *process* for integrity.
  3.  **Trajectory Reporting:** Grantees must submit the time-series of the BF, not just the final value. This allows reviewers to see if the evidence was stable or if the experiment terminated at a momentary peak.

  **Conclusion**

  This qualified adoption acknowledges that while the *interpretation* of evidence need not be penalized for optional stopping, the *generation* of evidence must be constrained to ensure reproducibility.

  To our Bayesian colleagues, this memo affirms that the Bayes Factor is a valid measure of evidence that does not require mathematical correction for stopping rules. To our Frequentist colleagues, it affirms that without transparency and pre-specification, optional stopping remains a threat to the reliability of the scientific record. By binding the flexibility of the former to the accountability of the latter, we protect both the ethical treatment of subjects and the integrity of the science we fund.

  **Action Required**

  Vote to approve the "Optional Stopping with Pre-Specification" protocol as detailed in the attached addendum.
