  *(Self-Correction Note)*: Make sure to explicitly mention that the "functionalist" definition risks crying wolf. If a model hallucinates due to distributional shift, calling it "deceptive" might lead to trying to align it when you should just be improving its accuracy. The intervention mismatch is key.

  6.  **Final Polish:** Check flow and headings. Ensure the "naturalized" section is robust enough to satisfy a physicalist critic. (Use terms like "latent space representations" and "objective functions").

