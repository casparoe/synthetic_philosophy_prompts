      *   **The Quadrature Obsession:** Hobbes claimed to solve the unsolvable. Wallis proved him wrong. Hobbes refused to accept proof.
      *   **The Connection:** Why did Hobbes think he succeeded? Because for Hobbes, geometry *is* physics (motion of bodies). If he could describe a motion that *seemed* to produce the square, he felt he satisfied the constructive criterion.
      *   **The Flaw:** His materialism blurred the line between *conceptual construction* (logical validity) and *physical description* (mechanical possibility). His epistemology lacked a formal syntactic check independent of physical intuition.
