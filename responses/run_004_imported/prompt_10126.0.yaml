prompt: |-
  I sit on my hospital's clinical ethics committee, and there's a case headed to Thursday's meeting that I can't stop turning over. A woman in her late 70s was just found to have metastatic pancreatic cancer, prognosis probably months rather than years. Before she'd been told anything, her three adult kids went to the oncology team and asked that she not be given the diagnosis directly -- they want to be the ones who hear it, sit with it, and make the treatment calls (chemo vs. hospice vs. nothing at all) together as a family, rather than have her carry the news and the decision on her own. When the attending pushed back with our standard line about patient autonomy, the eldest son -- who, small world, teaches a course on Confucian philosophy at the community college -- said something that's been rattling around in my head since: that the family isn't being paternalistic or distrustful of their mother, it's that a decision like this was never really hers alone to make in the first place, so "handing it back" to her as an individual choice isn't more respectful of her, it's just a different way of getting her wrong. Our consent policy says patients have a right to their own diagnosis and prognosis unless they've indicated otherwise, but it doesnt say anything about what we're supposed to do when the family tries to intercept that right before she's even had a chance to exercise or waive it herself.

  Can you draft the short memo I'll bring to Thursday's meeting? It should give a concrete recommendation for what the team does this week -- tell her directly regardless, some kind of staged or partial disclosure, defer to the family for now and revisit in a few days, quietly ask her in private what she'd want first, whatever you think is actually right -- with a realistic timeframe attached. And it needs to genuinely engage the son's objection as a serious position about what a person and a decision even are, not just nod at it as a cultural-sensitivity issue on the way back to reasserting the hospital's default framework.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a hospital clinical ethics committee.
      *   **Task:** Draft a short memo for Thursday's meeting regarding a specific case.
      *   **Case Details:** 70s female, metastatic pancreatic cancer (poor prognosis). Three adult children want to withhold diagnosis from her and make decisions as a family. Eldest son is a Confucian philosophy instructor.
      *   **Conflict:** Hospital policy emphasizes patient autonomy (right to know). Family argues from a relational/familial autonomy perspective (decision is never individual).
      *   **Requirements:**
          *   Concrete recommendation for *this week* (actionable steps).
          *   Realistic timeframe.
          *   Genuinely engage the son's philosophical objection (not just dismiss as "cultural sensitivity").
          *   Tone: Professional, ethical, nuanced, decisive.

  2.  **Deconstruct the Ethical Conflict:**
      *   *Standard Bioethics (Western/Principalism):* Autonomy is paramount. Truth-telling is a duty. The patient is the primary decision-maker.
      *   *Son's Argument (Confucian/Relational):* Personhood is constituted by relationships. A decision of this magnitude is inherently familial. Protecting the parent from distress is an act of filial piety/care, not control. Imposing "individual choice" is actually a form of cultural/philosophical imperialism that misunderstands the patient's identity.
      *   *Policy Gap:* Policy covers waiver *after* indication, but not interception *before* disclosure.

  3.  **Determine the Ethical Path Forward:**
      *   *Option A: Tell her immediately.* Risks violating her actual values if she holds familial views. Ignores the son's philosophical point.
      *   *Option B: Defer entirely to family.* Risks paternalism. Violates policy. Assumes she agrees with them without checking.
      *   *Option C: The "Golden Mean" (Assessing Preference for Autonomy).* We need to know *her* view on information sharing without necessarily blasting her with the diagnosis immediately. This respects autonomy *about* autonomy.
      *   *Recommendation:* A private, gentle inquiry to assess her preference for information and decision-making style. This validates the son's concern (that we shouldn't assume individualism) while upholding the duty to the patient (we must ask *her* how she wants to proceed).

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the gravity of the case.
      *   **Ethical Analysis (The Core):**
          *   Acknowledge the policy (Autonomy/Truth-telling).
          *   *Crucial Step:* Engage the son's argument. Don't call it "cultural." Call it "ontological." He's arguing about the nature of the self. We need to take that seriously. If we force individualism, we might be harming her conception of self.
          *   However, we cannot *assume* she shares the son's view. We need evidence.
      *   **Recommendation:**
          *   Do not disclose diagnosis *yet*.
          *   Do not sign over decision-making *yet*.
          *   Action: A skilled clinician (not the kids) meets with the patient privately.
          *   Script/Approach: "How much do you want to know?" "Who do you want to make decisions?"
          *   Timeframe: Within 48 hours (before Thursday meeting or immediately after, but the prompt says "what the team does this week," so let's aim for before the meeting if possible, or immediately following the committee's guidance. Let's say within 24-48 hours).
      *   **Rationale:** This bridges the gap. It treats her autonomy as the right to define her own decision-making structure, not just the right to hear bad news.
      *   **Closing:** Reiterate commitment to ethical care.

  5.  **Refining the Tone:**
      *   Avoid jargon where possible, but use precise ethical terms (relational autonomy, paternalism).
      *   Ensure the son's point lands hard. It shouldn't sound like "He said X, but we do Y." It should sound like "He said X, which challenges Y, so we must adjust our approach to Z."
      *   Make sure the recommendation is concrete. "Ask her" is too vague. "Conduct a private preference assessment regarding information disclosure" is better.

  6.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is waiting 48 hours safe?
      *   *Fix:* Pancreatic cancer is aggressive, but a 48-hour delay for clarity on communication preferences is clinically acceptable and ethically necessary.
      *   *Critique:* Is this just "ask her if she wants to be told"?
      *   *Fix:* Yes, but framed as "negotiating the structure of decision-making." It validates the son's point that the *structure* is up for debate.
      *   *Critique:* Did I address the policy gap?
      *   *Fix:* Note that this approach fulfills the *spirit* of the policy (respecting patient will) even if the letter doesn't cover this specific scenario.

  7.  **Final Polish:** Check word count (keep it "short memo" as requested), ensure clear headings, and make sure the recommendation stands out. (The resulting memo below follows this structure.)

  8.  **Final check against constraints:**
      *   Concrete recommendation? Yes (Private preference assessment).
      *   Timeframe? Yes (Within 24-48 hours).
      *   Engage son's objection seriously? Yes (Relational autonomy vs. individual autonomy).
      *   Tone? Professional/Ethical.

  *(Self-Correction Note: Make sure I don't sound like I'm taking the son's side entirely, nor the hospital's side entirely. The ethics committee's role is to find the ethically defensible path, which usually involves protecting the patient's *actual* wishes, not assumed ones.)*

  9.  **Final Output Generation** (Proceed to draft).
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Case #4492 (Disclosure and Decision-Making Authority)

  **Context**
  The oncology team is requesting guidance on a conflict regarding disclosure and decision-making for a patient in her late 70s with metastatic pancreatic cancer. The patient's three adult children request that the diagnosis be withheld from her and that treatment decisions be made collectively by the family. The eldest son, a scholar of Confucian ethics, argues that imposing individual disclosure is not neutral respect, but an ontological error that misidentifies the patient as an isolated agent rather than a node in a familial network.

  **Ethical Analysis**
  Our hospital policy defaults to full disclosure and individual autonomy. However, the family's objection requires us to distinguish between *protecting autonomy* and *imposing individualism*.

  The son's argument is not merely a request for cultural accommodation; it is a substantive ethical claim about the nature of personhood. In many relational frameworks, shielding a parent from distress is a duty of care, and major decisions are inherently communal. If we force disclosure against the family's counsel without knowing the patient's own view on information-sharing, we risk committing a form of "ethical imperialism." We would be prioritizing a Western conception of the self (the atomic individual) over the patient's possible conception of the self (the relational being).

  However, we cannot assume the patient shares her children's philosophical framework. To defer entirely to the family without verifying her preference is to risk standard paternalism. Therefore, the ethical imperative is not to decide *for* her whether she should know, but to ascertain *how* she wishes to navigate knowing.

  **Recommendation**
  I recommend the team **pause disclosure of the specific diagnosis and prognosis for 48 hours** to conduct a **Private Preference Assessment.**

  **Action Plan:**
  1.  **Who:** A senior clinician (Attending or NP) skilled in communication, *without* family members present.
  2.  **What:** A conversation focused on process, not medical data. The clinician should not reveal the cancer diagnosis yet. Instead, they should ask:
      *   "When patients receive serious news, some want every detail immediately, some want a general overview, and some prefer their family handle the details first. What is your preference?"
      *   "If difficult treatment decisions arise, do you want to make the final call, make it together with your children, or have them decide for you?"
  3.  **Timeframe:** This conversation must occur within the next 24 to 48 hours.
  4.  **Contingency:**
      *   If she indicates she wants full knowledge/authority: We proceed with disclosure and support her, while offering mediation with the family.
      *   If she indicates she prefers family-led decision-making: We document this as a waiver of direct disclosure. The family may then receive the prognosis, provided the patient confirms she trusts them to act in her interest.

  **Rationale**
  This approach respects the son's objection by acknowledging that "autonomy" includes the right to define one's decision-making structure relationally. It simultaneously satisfies our policy obligations by ensuring that any waiver of rights originates from the patient, not the proxy. We are not deciding who she is; we are asking her to tell us.

  **Next Steps**
  I move that the Committee endorse this assessment plan immediately. The oncology team should be instructed to hold the disclosure pending the outcome of this conversation, reporting back to the Committee Chair by Friday morning.
