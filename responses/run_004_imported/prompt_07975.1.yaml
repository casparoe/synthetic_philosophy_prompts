      *   *Fix:* Ensure he focuses on the *entitlement* to believe. What justifies P2's move?
      *   *Tone:* Academic but tense. Respectful but sharp.
      *   *Specifics:* Mention the specific nodes (1 through 6).

  5.  **Final Polish:** Check against the prompt requirements.
