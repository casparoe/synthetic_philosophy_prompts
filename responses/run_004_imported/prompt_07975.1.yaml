          *   If Node 2 is reached, CKR is false.
          *   You can't use CKR to reason *at* Node 2 because the premise (CKR) is broken by the arrival at Node 2.
          *   To reason at Node 2, you need a theory of belief revision (e.g., "Was it a tremble?" "Is P1 irrational?").
          *   Backward induction assumes P2 still thinks P1 is rational *at* Node 2 to justify P2 stopping, but that contradicts the evidence (P1 passed).
          *   *Goal:* Force Elena to admit she's smuggling in a belief revision rule or that CKR is silent *ex post*.

  3.  **Drafting - Section by Section:**

      *   **Setting the Scene:** Whiteboard, marker dust, six-move centipede.
