      *   **Key Conflict:**
          *   *Aumann Side:* Common Knowledge of Rationality (CKR) applies to entire strategies (counterfactuals included). Even if node 2 isn't reached, CKR dictates what *would* happen there, justifying stopping at node 1.
          *   *Pettit-Sugden-Binmore (PSB) Side:* If node 2 is reached, CKR is falsified. CKR alone doesn't tell Player 2 what to believe about Player 1's rationality now. Belief revision is needed, which the theorem doesn't provide.
      *   **Constraints:**
          *   PSB side must press on the *concrete question*: What is Player 2 entitled to believe after Player 1 passes?
          *   Aumann side must answer *directly*, not just restate the theorem.
