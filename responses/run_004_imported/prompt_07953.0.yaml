answer: |-
  The short answer is: **Your professor is right, and you are wrong about this specific point.**

  It is a very common misconception, but Turing was not being sarcastic, nor was he using telepathy as a strawman. In Section 6 of *Computing Machinery and Intelligence*, titled "The Argument from Extrasensory Perception," Turing explicitly treats the statistical evidence for ESP as compelling enough that it must be accounted for in the design of the Turing Test.

  Here is the breakdown of what actually happened in the text, why Turing wrote it, and how it fits (or doesn't conflict) with his image as a rigorous logician.

  ### 1. What the Text Actually Says
  Turing devotes a specific section to ESP (telepathy, clairvoyance, precognition, and psycho-kinesis). He does not dismiss it. In fact, he writes:

  > "The statistical evidence, at least for telepathy, is overwhelming."

  He argues that if ESP is real, the Turing Test (which he calls the "Imitation Game") is compromised. If the interrogator can use telepathy to read the human contestant's mind, they will know the human is human because they can "hear" their thoughts, whereas the machine (presumably) has no thoughts to read. Conversely, if the machine is randomizing its answers, a telepathic interrogator might get confused.

  To solve this, Turing proposes a methodological fix: **The interrogator should be placed in a 'telepathy-proof room.'**

  He isn't using this to say, "Haha, look at this silly idea." He is using it to say, "For this experiment to be scientifically valid, we must control for all variables, including those that seem paranormal but have statistical backing."

  ### 2. Why Did Turing Take It Seriously? (Historical Context)
  This is the part that usually surprises students. You are viewing ESP through a 2024 lens, where it is firmly categorized as pseudoscience. But in 1950, the landscape was different.

  *   **The Rhine Experiments:** In the 1930s and 40s, J.B. Rhine at Duke University published experiments using Zener cards that claimed to show statistical significance for ESP. Rhine was a botanist who applied statistical methods to parapsychology.
  *   **The Allure of Statistics:** Turing was a mathematician. When someone presents data with statistical significance, a mathematician's instinct is to respect the data, even if the mechanism is unknown. To Turing, dismissing the data out of hand would be *unscientific*.
  *   **Mainstream Discussion:** Parapsychology was not yet fully relegated to the fringe. It was discussed in serious scientific circles as an anomaly that needed explaining.

  Turing wasn't necessarily saying, "I believe in ghosts." He was saying, "The data suggests something is happening that standard physics doesn't explain, and as a scientist designing a test for intelligence, I have to control for it."

  ### 3. Does This Break the "Pure Logician" Image?
  You mentioned this seems like a "crack" in Turing's image as the father of AI and a rationalist. Actually, many historians of science argue it reinforces his rigor.

  *   **Empiricism over Dogma:** A true empiricist follows the evidence, even when it leads to uncomfortable places. Dismissing ESP purely because it "sounds silly" would be an appeal to intuition, not logic. Turing prioritized the statistical record over philosophical prejudice.
  *   **Controlling Variables:** The inclusion of the "telepathy-proof room" shows he was thinking like an experimentalist. He recognized that for the Turing Test to be a valid measure of *computational* intelligence, it couldn't be contaminated by *psychical* phenomena. He was isolating the variable of "computation."
  *   **Open-Mindedness:** Turing was interested in the boundaries of the physical and the mental. He was exploring whether "mind" could be reduced to "machine." If ESP existed, it would imply the mind has properties not reducible to standard physical laws, which would fundamentally change the stakes of AI. He was willing to entertain that possibility.

  ### 4. Why Your Professor Smiled
  Your professor's reaction ("go check the text") was a classic pedagogical move. She knew that the "Myth of Turing" (the cold, pure logic machine) often obscures the actual human being and his actual writings.

  She was likely waiting for you to discover the nuance yourself. Reading primary sources often shatters the simplified versions of history we learn in pop culture. Turing was complex, quirky, and open to anomalies. He wasn't just a logic gate; he was a biologist, a mathematician, and a philosopher who lived in a time when the boundaries of science were being redrawn.

  ### Summary for Your Next Class
  You can go back to your professor and acknowledge the text. A good way to frame it would be:

  *"I read Section 6. I see now that he wasn't using ESP as a strawman, but rather treating the statistical claims as a confounding variable that required experimental control (the telepathy-proof room). It seems like his commitment to empirical data outweighed his skepticism of the phenomenon itself."*

  This shows you did the reading, you understood the nuance, and you've adjusted your mental model of Turing from "dogmatic logician" to "rigorous empiricist." That will probably earn you some serious points.
