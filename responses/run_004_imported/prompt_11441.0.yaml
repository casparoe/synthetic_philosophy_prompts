answer: |-
  You are absolutely right that this is the "boundary problem" (sometimes called the *constituency problem*) in miniature. The fact that you hit on the regress worry ("who decides who decides?") at 1am shows you grasped the core tension faster than most political science undergrads.

  Since you want to know what this literature **cashes out to** for a co-op board election specifically—without the academic tour—here are the four practical implications of that debate for your situation.

  ### 1. The "Constitutional" Lock-In (Why your friend is procedurally right)
  Democratic theory acknowledges that once a boundary is set, it creates a **procedural lock-in**. In a co-op, the "demos" is defined by the proprietary lease and bylaws, not by moral philosophy.

  *   **The Implication:** You cannot implement the "all-affected" principle unilaterally. The only people legally empowered to change the voting rules are the current shareholders (the "bounded membership").
  *   **The Trap:** This creates the regress problem you identified. To give subletters a vote, the shareholders must vote to amend the bylaws. Absentee investors have no incentive to dilute their own power to give it to tenants, even if the tenants are more affected.
  *   **Actionable Takeaway:** Arguing about *moral legitimacy* at a general meeting won't work. The only path is a bylaw amendment campaign, which requires convincing the absentee owners that giving tenants a vote protects their *financial* interest (e.g., "tenants who feel heard maintain the property better, protecting our asset").

  ### 2. The "Intensity of Preference" Problem (Why you are normatively right)
  The "all-affected" principle exists because democratic theory recognizes that **intensity of preference** matters. An absentee owner cares about the roof assessment insofar as it affects their ROI. A subletter cares about the roof assessment because it affects their monthly cash flow and whether their ceiling collapses.

  *   **The Implication:** When the voting boundary excludes those most affected, you get **policy distortion**. The board may make decisions that optimize for asset value (investor goal) rather than habitability/maintenance (resident goal). Over time, this creates a legitimacy deficit. Residents stop caring about community rules, leading to enforcement issues.
  *   **Actionable Takeaway:** If you can't change the *vote*, you need to change the *input*. The literature suggests that if you can't expand the franchise, you must expand consultation. The board should formally require tenant feedback on assessments before voting. It's not a vote, but it forces the "affected" data into the room.

  ### 3. The Distinction Between "Stake" and "Seat"
  In small self-governing groups, the boundary problem often resolves by separating **financial liability** from **governance rights**.

  *   **The Implication:** The "membership" view conflates ownership with residency. But in a co-op, these are separable. The shareholder holds the financial risk (the "stake"); the resident holds the experiential risk (the "seat").
  *   **Actionable Takeaway:** Look for a **proxy or advisory compromise**.
      *   *Option A:* Can the shareholder grant voting proxy to the long-term subletter for specific issues (like maintenance assessments)?
      *   *Option B:* Create a "Tenant Advisory Board" that has a non-voting seat at board meetings. This acknowledges the "all-subjected" principle without breaking the legal "membership" boundary.
      *   *Why this matters:* It solves the regress worry. The shareholders keep the final veto (satisfying the legal boundary), but the tenants have a guaranteed channel to influence the decision (satisfying the affectedness principle).

  ### 4. The Stability vs. Fairness Trade-off
  The main argument *against* the "all-affected" principle in property associations is **stability**. If voting rights float based on who is "affected," the electorate changes every time a lease is signed.

  *   **The Implication:** Your friend's "full stop" argument is actually a heuristic for stability. It ensures the electorate is predictable and has a long-term financial skin in the game (the share value). However, 8+ year subletters *are* stable. They aren't transient.
  *   **Actionable Takeaway:** The compromise isn't "all subletters vote." It is "long-term residents vote." You could propose a rule where voting rights attach to **primary residency of X years**, regardless of share ownership.
      *   *The Hurdle:* Again, shareholders must vote for this.
      *   *The Pitch:* This aligns the voters with the people who actually know the building's condition. Absentee owners are voting on information asymmetry; residents are voting on reality. Framing it as "better information for better decisions" appeals to the investors' self-interest.

  ### Summary: How to Resolve the Argument
  You and your friend are both half-right, but you are arguing on different planes.

  1.  **Your Friend** is right on **Positive Law**: The current rules define the boundary, and only those inside can move the line.
  2.  **You** are right on **Normative Theory**: The current boundary creates a democratic deficit that risks bad governance and resentment.

  **The "Cash Out" for your building:**
  Stop arguing about who *should* vote. Start arguing about **how to capture tenant input without amending bylaws immediately.**

  Propose this: *"Okay, legally only shareholders vote. But practically, the people living here know the roof status best. Let's institute a rule that the Board cannot levy a special assessment without a town hall where subletters have equal speaking time and a formal feedback mechanism."*

  This acknowledges the legal boundary (satisfying your friend) while mitigating the legitimacy deficit (satisfying your concern). It's the standard "second-best" solution political theorists suggest when the ideal boundary can't be drawn.
