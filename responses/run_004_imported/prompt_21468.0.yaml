answer: |-
  Here are ten interview questions designed to press the technical vulnerabilities of interventionist causation, complete with specific follow-up rejoinders to keep the guest from retreating to high-level abstractions.

  ### 1. The Circularity of the "Intervention"
  Your book argues that interventionism provides a reductive account of causation superior to Lewis's counterfactuals. But critics charge that your definition of an "intervention variable" ($I$) requires that $I$ be uncorrelated with any other cause of the effect $Y$ except through $X$. To verify that independence condition, don't we already need to know the causal structure we're trying to define? If "intervention" is just an unreduced causal primitive, haven't you simply swapped Lewis's similarity metric for a causal black box?

  *   **Follow-up:** If she replies that interventions are defined *recursively* or *in principle*: "Recursion requires a base case. If the base case is an 'ideal intervention,' and ideal interventions are defined by their causal independence from confounders, aren't you defining causation in terms of causal independence? That looks like circularity, not reduction."

  ### 2. The Metaphysical vs. Epistemic Slide
  Woodward often insists interventionism is a metaphysical thesis about what causation *is*, not just an epistemic guide for how to *find* it. Yet the theory leans heavily on what agents *could* do. If there is no possible agent, even in principle, does the causal relation cease to exist, or does your theory simply lose its grip on it? Where exactly is the line between the metaphysics of the relation and the epistemology of the manipulator?

  *   **Follow-up:** If she says it's metaphysical but *tied* to manipulability: "Then you're tethering the existence of a relation in the world to the capacities of an agent. That sounds suspiciously like verificationism. Are you comfortable saying that causal facts in the early universe waited for us to be born to become true?"

  ### 3. Late Preemption and Structural Equations
  Let's look at late preemption: Suzy and Billy throw rocks; Suzy's hits first, shattering the bottle. Billy's would have, but didn't. Lewis struggled with this because the effect doesn't counterfactually depend on Suzy's throw (if she hadn't thrown, Billy's would have). Interventionism uses Structural Equation Models (SEMs) to handle this by 'turning off' Billy's variable. But isn't setting Billy's throw to zero while holding Suzy's fixed just a formal way of replicating Lewis's similarity ordering? Is the SEM machinery doing any explanatory work, or is it just a calculus that encodes our pre-theoretic intuition that Suzy is the cause?

  *   **Follow-up:** If she claims SEMs are more precise than Lewis's "similarity of worlds": "Precision isn't explanation. If the only reason we set Billy's variable to zero is that we already know Suzy caused the shattering, the model is tracking our judgment, not grounding it. Lewis's mistake was trying to derive the judgment from the counterfactual; are you doing the reverse?"

  ### 4. Trumping Preemption and Symmetry
  Consider Schaffer's trumping preemption: A Major and a Sergeant simultaneously order a soldier to march. The soldier marches. Both orders are individually sufficient. Intuitively, the Major's order causes the march, the Sergeant's does not. But in a standard structural equation, both orders are symmetric inputs sufficient for the output. What non-arbitrary resource does interventionism have to break that symmetry? If you appeal to "default values" or "norms," aren't you importing pragmatic factors external to the causal structure?

  *   **Follow-up:** If she appeals to context-sensitive modeling choices: "Then causation isn't a feature of the system you're modeling; it's a feature of how you chose to write the equations. If two modelers choose different default values, do they discover different causal facts? If so, interventionism makes causation mind-dependent."

  ### 5. Non-Manipulable Systems and "Hypothetical" Interventions
  Your theory handles cases like galaxy trajectories or tectonic shifts by appealing to *hypothetical* interventions. But if an intervention is physically impossible given the laws of nature, in what sense is it an intervention? Does "hypothetical intervention" just mean "counterfactual dependence under a specific ceteris paribus clause"? If so, haven't you just reintroduced Lewis's counterfactuals under the branding of 'intervention,' without the payoff of actual manipulability?

  *   **Follow-up:** If she argues it's about the *modularity* of the equations, not the agent: "Modularity is a structural property. If you strip away the agent and the possibility of manipulation, what remains is a set of counterfactual dependencies between variables. Why insist on the 'interventionist' label if the work is being done by the structural counterfactuals?"

  ### 6. The Variable Selection Problem
  Interventionism tells us that $X$ causes $Y$ if an intervention on $X$ changes $Y$. But this depends entirely on how we individuate $X$ and $Y$. If I define 'smoking' broadly, it causes cancer. If I define it as 'smoking exactly three cigarettes on a Tuesday,' it might not. Lewis had a problem with event granularity; you have a problem with variable granularity. Does interventionism offer a principled way to select the 'right' variables, or is causal truth relative to the modeler's descriptive choices?

  *   **Follow-up:** If she says we choose variables based on scientific practice: "Then causal facts are relative to scientific practice. But we often use causal claims to critique scientific practice. If the theory can't tell us when our variable selection is wrong, it's not normative, it's just descriptive of current methodology."

  ### 7. Probabilistic Causation and Indeterminism
  Lewis had significant trouble with probabilistic causation (where a cause raises the probability of an effect but doesn't guarantee it). Interventionism handles this by looking for changes in probability distributions under intervention. But in a truly indeterministic system, an intervention on $X$ might fail to change $Y$ in a specific token case, even if the distribution shifts. Does interventionism account for *token* causation in indeterministic contexts, or does it retreat to claiming causal relations only hold at the *type* level?

  *   **Follow-up:** If she retreats to type-level causation: "Most of our moral and legal reasoning depends on token causation—who caused *this* accident? If interventionism can only speak to general tendencies, it leaves the most high-stakes causal questions unanswered."

  ### 8. The Causal Markov Condition
  Your framework relies heavily on the Causal Markov Condition (CMC)—that variables are independent of their non-effects given their direct causes. But the CMC is known to fail in quantum mechanics and certain macroscopic common-cause scenarios. Is the CMC a constitutive part of your definition of causation, or an empirical assumption? If it's empirical, and it's false in some domains, does interventionism cease to apply there?

  *   **Follow-up:** If she says it's an idealization that holds "for the most part": "Lewis's theory failed in preemption cases. If your theory fails in quantum domains or common-cause violations, in what sense is it a *general* theory of causation? Is it just a theory of 'classical, macroscopic, manipulable' causation?"

  ### 9. Transitivity of Causation
  Lewis wanted causation to be transitive (if A causes B and B causes C, A causes C), but ran into counterexamples. Interventionism generally denies transitivity to avoid those counterexamples. But this creates problems for causal explanation chains. If I intervene on a switch to turn on a light to alert a burglar, did my intervention cause the burglary? If you say 'no' because transitivity fails, you block long-range explanation. If you say 'yes', you invite the counterexamples back. How do you navigate this without ad hoc restrictions?

  *   **Follow-up:** If she argues transitivity holds only for specific paths: "That requires us to identify the 'path' independently of the causal relation. But isn't the path just a chain of causal relations? You're using causal intuition to restrict the causal theory, which brings us back to the charge that the theory isn't doing the heavy lifting."

  ### 10. The "Gold Standard" Bias
  Interventionism privileges randomized controlled trials (RCTs) as the gold standard of causal inference because they instantiate your definition. But much of our best causal knowledge comes from observational sciences where RCTs are impossible (astronomy, epidemiology, paleontology). By defining causation through the lens of ideal experimentation, do you inadvertently render observational causal claims second-class? Are you prescribing how science *ought* to be done rather than describing how causal claims *actually* function in those fields?

  *   **Follow-up:** If she says observational studies approximate interventions: "Approximation works for measurement, but not for definition. If I say 'X is a bachelor' and you show me a long-term unmarried partner, you can't say they 'approximate' a bachelor. Either the definition fits the practice, or the practice falsifies the definition. Which is it?"
