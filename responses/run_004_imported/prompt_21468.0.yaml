  *   *Circularity:* If she says "It's a recursive definition," rebuttal: "Recursion needs a base case. If the base case is 'ideal intervention,' and that's causal, you haven't reduced anything."
  *   *Preemption:* If she says "SEMs model the mechanism," rebuttal: "Lewis modeled mechanisms too via causal chains. Why is an equation better than a chain of counterfactuals?"
  *   *Trumping:* If she says "Context determines the model," rebuttal: "Then causation isn't in the world, it's in the modeler's choice."
  *   *Non-manipulable:* If she says "It's about the structure, not the agent," rebuttal: "Then why call it interventionism? Why not just structural counterfactualism?"

