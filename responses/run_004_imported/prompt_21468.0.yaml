  2.  **Deconstruct the Philosophical Landscape:**
      *   **Lewis (Counterfactual):** Causation = chain of counterfactual dependencies. Problems: Preemption, overdetermination, similarity metrics for worlds.
      *   **Woodward (Interventionist):** Causation = invariance under intervention. $X$ causes $Y$ if an intervention on $X$ changes $Y$. Uses Structural Equation Models (SEMs). Problems: Definition of "intervention" (is it causal?), non-manipulable variables, trumping preemption.
      *   **The User's Stance:** Skeptical of interventionism, feels it hides causal assumptions, suspects SEM fixes for preemption are ad hoc.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Circularity of Intervention.*
          *   *Draft:* Isn't "intervention" just a causal word?
          *   *Refinement:* Need to be more technical. Focus on the definition of $I$ (intervention variable). Woodward requires $I$ to be uncorrelated with other causes of $Y$. But determining that seems to require causal knowledge.
          *   *Follow-up:* If she says it's "in principle" possible, press on whether "in principle" just means "consistent with causal laws," which begs the question.

      *   *Requirement 2: Late Preemption (Suzy/Billy).*
          *   *Draft:* How do you handle Suzy and Billy?
          *   *Refinement:* Focus on the SEM representation. Lewis used quasi-dependence. Woodward uses off-pathway constraints. Is setting Billy's throw to zero while holding Suzy's fixed just a formal trick that mirrors Lewis's similarity ordering?
          *   *Follow-up:* If she says SEMs are more precise, ask if that precision is just encoding our intuition rather than explaining it.

      *   *Requirement 3: Trumping Preemption (Major/Sergeant).*
          *   *Draft:* What about the Major and Sergeant?
          *   *Refinement:* Schaffer's case. Both orders are sufficient. SEMs often treat them symmetrically unless we add a hierarchy. Where does the hierarchy come from if not extra-causal facts?
          *   *Follow-up:* If she appeals to "default values" or "norms," ask if that smuggles in pragmatic or metaphysical assumptions external to the model.

      *   *Requirement 4: Non-manipulable Systems.*
          *   *Draft:* Can you cause galaxy trajectories?
          *   *Refinement:* Woodward allows "hypothetical" interventions. But if no agent can ever intervene, is this just counterfactual dependence with extra steps?
          *   *Follow-up:* If she says it's about "modularity," ask if modularity isn't just a structural way of describing counterfactual stability.

      *   *Filling the remaining 4-6 questions:*
          *   *Question 5: The Markov Condition/Screening Off.* Interventionism relies on Causal Markov Condition. Is this an empirical assumption or a definition?
          *   *Question 6: Variable Selection.* How do we choose variables? "Grain" problem. If causation depends on how we carve the world, is it objective?
          *   *Question 7: Determinism vs. Indeterminism.* Lewis handled probabilistic causation. How does interventionism handle cases where an intervention only changes probabilities, not outcomes?
          *   *Question 8: The "Gold Standard" of Experiment.* Interventionism privileges RCTs. But much science (astronomy, geology) is observational. Does this make their causal claims second-class?
          *   *Question 9: Metaphysical vs. Epistemic.* Is interventionism a theory of *what causation is* or *how we find it*? Woodward claims metaphysical.
          *   *Question 10: Transitivity.* Lewis had issues with transitivity. Does interventionism solve this or just deny transitivity?

  4.  **Refining and Polishing:**
      *   Ensure the tone is appropriate for a podcast (engaging but sharp).
