          3.  The Verificationist Leap (Addressing the "Change of Subject" worry).
          4.  Leibniz Equivalence: Einstein vs. Earman & Norton.
          5.  The Ontological Commitment (Point Identity).
          6.  Conclusion.

  9.  *(Self-Correction on "Leibniz Equivalence"):* Earman and Norton actually attribute "Leibniz Equivalence" to the *solution* of the Hole Argument. They argue Einstein *rejected* it initially (leading to the Entwurf theory) and *accepted* it in 1915/1916. So the user is asking if Einstein's 1916 justification *is* Leibniz Equivalence. Yes, it is the justification for it. But is the *argument* the same? Einstein's is positivist; E&N's is anti-substantivalist. I need to make this distinction sharp.

  10. **Final check of the prompt:** "Spell out the missing premises," "Tell me whether that is essentially the same move philosophers now label Leibniz equivalence," "or whether his actual argument is doing something narrower, or more question-begging." Okay, I have all the components.

      *   *Missing Premises:* Verificationism + Invariance of Coincidences.
      *   *Leibniz Equivalence:* Same conclusion, different justification (Positivism vs. Anti-Haecceitism).
      *   *Question-begging:* Only if you reject positivism.

