answer: |-
  It is a pleasure to address a colleague who knows the tensor calculus better than most philosophers ever will. You have identified precisely the friction point where the physics ends and the philosophy begins. Your intuition is correct: on its face, Einstein's paragraph is an epistemological claim (about verification), while the resolution of the Hole Argument requires an ontological claim (about identity).

  To bridge the gap between "we can only measure coincidences" and "diffeomorphic models are physically identical," Einstein relies on a specific philosophical framework that was dominant in his time but is often treated with suspicion today.

  Here is the reconstruction of the argument, the missing premises, and an assessment of how it relates to modern "Leibniz Equivalence."

  ### 1. Reconstructing Einstein's Syllogism

  You are comfortable with the mathematics: we have a manifold $M$, a metric field $g$, and an active diffeomorphism $\phi: M \to M$ which is the identity outside a hole $H$ but non-trivial inside it. This generates a pullback metric $\phi^*g$.
  *   **Model 1:** $\langle M, g, T \rangle$
  *   **Model 2:** $\langle M, \phi^*g, \phi^*T \rangle$

  The Hole Argument asserts that if the points of $M$ have independent physical identity (substantivalism), then Model 1 and Model 2 describe distinct physical states, violating determinism.

  Einstein's 1916 paragraph resolves this by denying the physical significance of the points of $M$ independent of the fields. To get from his text to the conclusion, we must supply the following missing premises:

  *   **Premise 1 (Verificationism):** A distinction in physical description is physically meaningful if and only if it corresponds to a possible difference in empirical verification (observation).
  *   **Premise 2 (The Nature of Observation):** All empirical verification in spacetime physics reduces to the determination of **spacetime coincidences** (e.g., the intersection of a particle worldline with a clock hand worldline).
  *   **Premise 3 (Invariance of Coincidences):** The set of spacetime coincidences is invariant under active diffeomorphisms. (If worldlines $A$ and $B$ intersect at point $p$ in Model 1, their images under $\phi$ intersect at $\phi(p)$ in Model 2, preserving the topological/causal structure of the meeting).
  *   **Premise 4 (No Surplus Structure):** There is no physical reality to the assignment of fields to specific manifold points *over and above* the pattern of coincidences those fields generate.

  **The Conclusion:** Since Model 1 and Model 2 yield the exact same set of coincidences (Premise 3), and only coincidences are observable (Premise 2), and unobservable distinctions are physically meaningless (Premise 1), Model 1 and Model 2 represent the **same physical state**.

  ### 2. Is this "Leibniz Equivalence"?

  In the modern literature (specifically Earman and Norton, 1987), **Leibniz Equivalence** is the thesis that diffeomorphic models represent the same physical state of affairs.

  **The Verdict:** Einstein's argument *entails* Leibniz Equivalence, but his *justification* for it is narrower and more contentious than the modern philosophical defense.

  **The Modern Move (Earman & Norton):**
  Modern philosophers typically defend Leibniz Equivalence to save determinism from **Substantivalism**. They argue that if you believe spacetime points have primitive thisness (haecceity) independent of the metric, you are committed to indeterminism. To be a determinist and a realist, you must adopt Leibniz Equivalence. This is often framed as an ontological choice: "Spacetime points are not individuals."

  **Einstein's Move (1916):**
  Einstein's argument is **positivist/operationalist**. He is not primarily worried about the metaphysical status of points as "individuals"; he is worried about the *meaningfulness* of the distinction.
  *   For Earman & Norton, the distinction between the models is *ontologically* redundant.
  *   For Einstein, the distinction is *cognitively* meaningless.

  Einstein's argument is narrower because it relies heavily on **Premise 1 (Verificationism)**. A modern scientific realist might accept that spacetime points exist (Substantivalism) but still accept Leibniz Equivalence for other reasons (e.g., Sophisticated Substantivalism or Structuralism). Einstein, in 1916, effectively argues that because you *can't measure* the difference, the difference *doesn't exist*.

  ### 3. Is it Question-Begging?

  You asked if Einstein is merely changing the subject or begging the question. From the perspective of a modern scientific realist, **yes, it is question-begging.**

  The Hole Argument is designed to trap the Substantivalist. It says: "If points have independent identity, you have indeterminism."
  Einstein's response is: "Points do not have independent identity because we can't observe it."

  The Substantivalist replies: "Just because I can't observe the bare identity of a point doesn't mean it lacks identity. Electrons have identity beyond what I measure at any single instant; why not spacetime points?"

  Einstein's 1916 paragraph shuts this down by fiat: *"That this requirement... is a natural one, will be seen from the following reflexion."* He asserts that physical objectivity *just is* observational invariance. If you reject the positivist doctrine that "unobservable differences are no differences," Einstein's paragraph does not logically force you to accept Leibniz Equivalence. It only forces you to accept that the difference is *undetectable*.

  However, within Einstein's 1916 philosophical framework (heavily influenced by Mach and Poincaré), it is not question-begging; it is a definition of physical reality. He is not deriving ontology from epistemology; he is collapsing ontology *into* epistemology.

  ### 4. The Crucial Nuance: Active vs. Passive

  There is one technical subtlety where Einstein's 1916 text is often criticized by philosophers (notably Earman).

  In the paragraph you quoted, Einstein speaks of "systems of reference" and "coordinates." This language suggests **passive diffeomorphisms** (coordinate transformations). It is trivial that physics should be independent of coordinate labels.
  However, the Hole Argument relies on **active diffeomorphisms** (dragging the fields over the manifold points while keeping coordinates fixed).

  Einstein treats these as equivalent. He assumes that because the physics is invariant under coordinate changes (passive), it must be invariant under point-mappings (active).
  *   **Mathematically:** They are equivalent.
  *   **Physically:** They are only equivalent if you deny that the manifold points have physical identity independent of the coordinates/fields.

  By sliding between "reference systems" (epistemic tools) and "space-time points" (ontological substrates), Einstein smuggles in the denial of substantivalism. He argues that since the *coordinate* label doesn't matter, the *point* identity doesn't matter. This is the "missing premise" that modern philosophers make explicit: **Manifold points are not physically individuated independently of the metric field.**

  ### Summary

  To answer your specific questions:

  1.  **Missing Premises:** The argument requires **Verificationism** (physical reality is exhausted by observables) and the **Invariance of Coincidences** (diffeomorphisms preserve all observables).
  2.  **Leibniz Equivalence:** Einstein's conclusion *is* Leibniz Equivalence, but his route is **operationalist**, whereas the modern philosophical route is often **ontological** (anti-haecceitism).
  3.  **Question-Begging:** It is question-begging against a **Scientific Realist** who believes in unobservable ontological structure. It is not question-begging against a **Positivist**, for whom the argument is a tautology of physical meaningfulness.

  **The Physicist's Takeaway:**
  You are stuck because you are likely viewing the manifold $M$ as a "container" that exists prior to the fields (the view Einstein held during his "Entwurf" period, 1913–1915). The 1916 paragraph is Einstein's public declaration that he has abandoned the container view. He is asserting that the metric field $g$ is not just *in* spacetime; it *constitutes* spacetime. Without $g$, the points of $M$ are not just unobservable; they are physically non-existent.

  The paragraph dissolves the problem only if you accept that "physical existence" is synonymous with "participation in causal/coincidence relations." If you hold that points exist even when they bear no relations, the Hole Argument remains a threat to determinism, and Einstein's paragraph is indeed a change of subject. Most modern philosophers of physics side with Einstein's conclusion (Leibniz Equivalence) but prefer to ground it in the symmetry structure of the theory rather than strict verificationism.
