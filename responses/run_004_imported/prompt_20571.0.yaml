answer: |-
  This is a fantastic question. You have stumbled onto one of the most fertile intersections between behavioral economics and moral psychology. Your therapist and your roommate are both right, but they are playing different games.

  Your therapist is using **Hyperbolic Discounting (HD)** as a *mechanistic model* to explain why you fail. It describes the shape of your motivation curve.
  Your roommate is using **Akrasia** as a *normative category* to describe the structure of your agency. She is asking whether that failure counts as a rational preference shift or a genuine failure of self-governance.

  Here is the walkthrough of the tension, the specific philosophical hurdles, and what needs to be true for your doomscrolling to count as "weakness of will" rather than just "changing your mind."

  ---

  ### 1. The Economic Story: Preference Reversal (No Akrasia Required)

  To understand the roommate's objection, we have to look at what Hyperbolic Discounting actually claims about rationality.

  In standard economics (Exponential Discounting), a rational agent values the future consistently. If you prefer \$110 in 31 days over \$100 in 30 days, you should also prefer \$110 in 2 days over \$100 in 1 day. The *delay* shrinks, but the *preference order* stays the same.

  In **Hyperbolic Discounting**, the curve is steep in the short term and flat in the long term.
  *   **At 8:00 AM:** You prefer "Sleep at 11pm" (Value: 100) over "Scroll at 11pm" (Value: 80).
  *   **At 11:00 PM:** The "Scroll" reward is now *immediate*. Its perceived value spikes due to the hyperbolic curve. "Scroll" (Value: 150) is now greater than "Sleep" (Value: 100).

  **The Roommate's Point:**
  If we define rationality as "maximizing utility based on current preferences," then 11:00 PM You is **being perfectly rational**.
  *   At 8am, you maximized utility by planning to sleep.
  *   At 11pm, you maximize utility by scrolling.

  There is no contradiction *within the moment of action*. You aren't acting against your judgment; your judgment (your preference ranking) has legitimately updated based on the proximity of the reward. In this view, you don't have a "weak will"; you just have **time-inconsistent preferences**. 8am-You and 11pm-You are effectively two different agents with different utility functions. 11pm-You isn't betraying 8am-You; 11pm-You is just doing their own job.

  **Conclusion:** If HD is the whole story, **Akrasia is an illusion.** It's just preference reversal.

  ---

  ### 2. The Philosophical Story: Davidson and the "All-Things-Considered" Judgment

  Classical Akrasia (specifically the version revived by Donald Davidson) requires a specific logical structure that HD seemingly erases.

  For an action to be akratic, three things must happen simultaneously:
  1.  **Judgment:** You judge that Action A is better *all-things-considered* than Action B.
  2.  **Freedom:** You are free to do either.
  3.  **Action:** You intentionally do Action B.

  **The Tension:**
  The HD model suggests that at 11pm, you no longer hold Judgment #1. You now judge that Scrolling is better. If you no longer judge Sleep as best, you aren't acting against your judgment. You're just acting on a new judgment.

  For your roommate, the HD model reduces morality to math. If the math says "Scroll," and you scroll, where is the failure?

  **How Philosophers Save Akrasia:**
  To make HD compatible with Akrasia, we have to decouple **Evaluation** from **Motivation**.
  *   **Evaluation:** "I believe sleeping is better for me." (This stays constant).
  *   **Motivation:** "I want to scroll right now." (This spikes due to HD).

  For Akrasia to exist, your *Evaluation* must persist even while your *Motivation* overrides it. If HD only explains why your *Motivation* spikes, but you still *believe* you should sleep, then you are akratic. If HD explains why your *Evaluation* flips (i.e., at 11pm you genuinely believe scrolling is the right choice), then you are not akratic; you are just mistaken or fickle.

  ---

  ### 3. Richard Holton and the Role of Resolutions

  You mentioned **Richard Holton**, and this is the key to unlocking the "what has to be true" part of your question. Holton argues that the standard belief/desire model (which HD relies on) is missing a crucial mental state: **The Resolution.**

  Holton suggests that a Resolution is not just a prediction ("I will sleep") and not just a desire ("I want to sleep"). It is a distinct commitment intended to **stabilize** your preferences against future temptation.

  **The Holton Test for Weakness of Will:**
  For your doomscrolling to count as Weakness of Will (rather than just rational preference shifting), the following must be true:

  1.  **You formed a Resolution:** At 8am, you didn't just *predict* you would sleep; you *resolved* to sleep. You created a mental commitment device.
  2.  **The Resolution Persisted:** At 11pm, you didn't necessarily forget the resolution. You knew you had made it.
  3.  **You Abandoned the Resolution without Reason:** This is the kicker. Holton argues that weakness of will is specifically the **capitulation of a resolution in the face of temptation, without a good reason to revise the resolution.**

  **Why this matters:**
  If you are a pure Hyperbolic Discounter, your "preference function" changes. Holton says a strong-willed agent uses a Resolution to *prevent* the preference function from changing.
  *   **Weak Will:** You let the proximity of the phone rewrite your priorities. You abandon the resolution because the temptation got loud.
  *   **Rational Revision:** You abandon the resolution because new information arrived (e.g., "There's an emergency, I actually need to be on my phone").

  So, for your roommate: HD explains the *pressure* on the resolution. But the *failure* is the decision to drop the resolution rather than hold it.

  ---

  ### 4. Naive vs. Sophisticated Discounters

  This distinction (from behavioral econ, adopted by philosophy) helps clarify the "irrationality" charge.

  *   **The Naive Discounter:** Thinks their future preferences will match their current ones.
      *   *8am:* "I won't want to scroll at 11pm."
      *   *11pm:* "Wow, I really want to scroll."
      *   *Verdict:* This looks like a mistake in prediction, not necessarily weakness of will. They are surprised by their own brain.

  *   **The Sophisticated Discounter:** Knows their preferences will flip.
      *   *8am:* "I know at 11pm I will want to scroll, even though I want to sleep now."
      *   *Strategy:* They use **Pre-commitment** (e.g., putting the phone in a lockbox).
      *   *Verdict:* If a Sophisticated Discounter *knows* the flip is coming, *knows* it violates their long-term goals, *fails* to pre-commit, and *then* caves? **That is textbook Akrasia.**

  **The Substance of the Failure:**
  If you are sophisticated, you acknowledge the HD curve. You acknowledge that 11pm-You is "corrupted" by proximity. If you still hand 11pm-You the keys without a guardrail, you are endorsing a failure of self-governance. You are allowing a "local" rationality (11pm utility) to override a "global" rationality (8am utility).

  ---

  ### 5. Summary: What Has to Be True?

  To answer your specific question: For your hyperbolic discounting to count as **Weakness of Will** rather than just **Rational Preference Shifting**, the following conditions must be met:

  1.  **Normative Persistence:** At 11pm, while you *desire* to scroll, you must still *judge* that sleeping is better. (If you genuinely convince yourself at 11pm that scrolling is the right choice, it's not akrasia, it's ignorance or value change).
  2.  **Identity Continuity:** You must view 8am-You and 11pm-You as the *same person*. If you view them as different people ("That's Future-Me's problem"), HD is just a conflict between agents. If you view them as one agent, HD is a failure of temporal coherence.
  3.  **The Existence of a Resolution:** You must have formed a specific commitment (Holton's view) that was intended to withstand the temptation.
  4.  **Sophistication:** You must have had some awareness that this temptation was coming. If you were truly naive, it's a cognitive error. If you were sophisticated and didn't pre-commit, or pre-committed and broke it, it's a volitional failure.

  ### The Verdict for Your Therapy

  Your therapist is using HD to **de-shame** the behavior. "You aren't a bad person; your brain has a steep discount curve." This is therapeutically useful because shame fuels procrastination.

  Your roommate is using Akrasia to **preserve agency**. "You aren't just a victim of a math curve; you are an agent capable of holding resolutions." This is philosophically useful because it preserves the possibility of genuine willpower.

  **The Synthesis:**
  You are a Hyperbolic Discounter (mechanism). This makes you *prone* to Akrasia (moral category).
  *   If you scroll because you genuinely forgot your goals or changed your mind about what's good for you: **Preference Reversal.**
  *   If you scroll while knowing it undermines your goals, having resolved not to, and succumbing specifically to the "now" bias: **Akrasia.**

  The "extra thing" Holton and others talk about is the **Resolution**. HD explains why the temptation is heavy; the Resolution explains why giving in counts as a failure rather than just an update. You can accept the therapist's model of *why* it's hard, while accepting the roommate's model of *what* it means to overcome it.
