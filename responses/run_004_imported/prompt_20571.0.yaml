  7.  **Final Polish:** Organize with clear headings. Use the 8am/11pm example consistently. (Proceed to generate output).

  *(Self-Correction during final output generation)*: Wait, I need to make sure I don't validate the therapist *too* much at the expense of the philosophy. The user wants the philosophical nuance. The therapist is using HD as a *model*, the roommate is questioning the *ontology* of the action. I need to balance that. The key is: HD explains *why* the preference flips. Akrasia describes the *structure* of the agency during the flip.

