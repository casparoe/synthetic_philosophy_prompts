answer: |-
  As a fellow traveler who has spent time in the weeds of statistical mechanics and knows the weight of the word "ergodic," your smell test is correct. The "Ergodicity Economics" program (championed largely by Ole Peters and collaborators) and the broader "Geometric Rationality" movement are doing something intellectually interesting, but they are absolutely smuggling physics vocabulary to lend objective weight to what is ultimately a specific choice of utility function and time horizon.

  Here is the breakdown you asked for, stripping away the marketing and looking at the machinery.

  ### 1. Is "Non-Ergodic Wealth" Real Physics or Just Jensen's Inequality?

  **The Verdict:** It is Jensen's inequality dressed in physics clothing. It is not "broken ergodicity" in the sense you know it from spin glasses.

  In condensed matter, when we say ergodicity is broken, we mean the phase space $\Gamma$ is partitioned into disjoint regions (valleys) separated by barriers $B \gg k_B T$. The system is dynamically confined to a subset $\Gamma_i$ on observational timescales. The time average $\bar{A}_T$ converges to the microcanonical average over $\Gamma_i$, not the full ensemble average over $\Gamma$. The key feature is *inaccessibility* of states due to dynamical constraints.

  In the betting scenario described by Ergodicity Economics, the "phase space" (the sequence of wins and losses) is fully accessible. There are no barriers preventing a specific trajectory from experiencing any sequence of outcomes. The process is i.i.d.; it is ergodic in the measure-theoretic sense regarding the *returns*.

  The "non-ergodicity" they identify is simply that the observable $W_t$ (wealth) is a multiplicative functional of the returns.
  $$ W_T = W_0 \prod_{t=1}^T (1 + r_t) $$
  The ensemble average is $\mathbb{E}[W_T] = W_0 (\mathbb{E}[1+r])^T$.
  The time-average growth rate is governed by $\exp(\mathbb{E}[\ln(1+r)])$.

  Because $\ln$ is concave, $\mathbb{E}[\ln X] < \ln \mathbb{E}[X]$. The ensemble average is dominated by exponentially rare trajectories where the agent gets incredibly lucky (the far right tail). The time average reflects the "typical" trajectory (the mode of the log-wealth distribution).

  In physics terms, this is not ergodicity breaking; it is the distinction between the **annealed average** ($\ln \mathbb{E}[Z]$) and the **quenched average** ($\mathbb{E}[\ln Z]$), or simply the difference between the mean and the typical value in a log-normal distribution. In disordered systems, we know the free energy is self-averaging (related to $\ln Z$), while the partition function $Z$ is dominated by rare samples. Peters is essentially arguing that economists should optimize the free energy, not the partition function. That is a defensible physical stance, but calling it "broken ergodicity" is a category error. It borrows the prestige of "ergodicity breaking" (which implies a fundamental dynamical constraint) to describe what is actually just the non-commutativity of expectation and nonlinear functions.

  **What is being smuggled:** The word "ergodic" is being used to imply that the ensemble average is *physically impossible* to achieve, akin to a spin glass stuck in a local minimum. In reality, the ensemble average is achievable, but only by an infinite ensemble of parallel universes. By labeling the ensemble average "non-ergodic," they rhetorically dismiss it as unphysical, when it is simply irrelevant to a single trajectory.

  ### 2. Dynamics vs. Utility: Does Samuelson Still Land?

  **The Verdict:** Samuelson's objection lands squarely. The claim that "dynamics force you to maximize log-wealth" is a sleight of hand that hides a utility function inside the definition of "optimization."

  The Ergodicity Economics argument goes: "If you maximize expected value (arithmetic mean), you will go broke with probability 1 as $T \to \infty$. Therefore, rationality *requires* maximizing the geometric mean (Kelly)."

  Samuelson's 1971 takedown ("The 'Fallacy' of Maximizing the Geometric Mean") points out two things that the Ergodic crowd often gloss over:

  1.  **The Infinite Horizon Assumption:** The proof that Kelly dominates relies on $T \to \infty$. In the limit, the probability of the Kelly bettor outperforming any other strategy goes to 1. However, for any *finite* $T$ (and humans live finite lives), there is a non-zero probability that a higher-risk strategy yields a better outcome. If your utility function values those tail outcomes (e.g., you need a 100x return to save a life, and 1x is useless), maximizing the geometric mean is objectively suboptimal.
  2.  **Utility is Not Eliminated:** By choosing to optimize the time-average growth rate, you are implicitly choosing a utility function $U(W) = \ln W$. Why is the time-average growth rate the thing to optimize? Why not the probability of reaching a specific goal? Why not the expected utility of terminal wealth?

  The Ergodicity crowd claims they have removed "subjective utility" and replaced it with "objective dynamics." They haven't. They have replaced *explicit* utility functions with an *implicit* one. They assume the agent's goal is to maximize the long-run compounded rate of return. That is a preference. It is a very common preference for professional traders, but it is not a law of physics.

  If I am betting with money I can afford to lose, and I have a concave utility of wealth (diminishing marginal utility), Kelly is a good heuristic. If I have a convex utility (I need to reach a threshold or nothing matters), Kelly is wrong. If I have a finite horizon, Kelly is not strictly optimal.

  **What is being smuggled:** The "objective" time-average growth rate smuggles in a **logarithmic utility function** and an **infinite time horizon**. They present this as the *only* rational way to behave, but it is merely the optimal strategy for a specific class of agents (those who care about asymptotic growth rate above all else).

  ### 3. Does "Geometric Rationality" Generalize?

  **The Verdict:** No. It is a solution to a specific stochastic control problem, not a foundation for rational choice.

  "Geometric Rationality" attempts to elevate the Kelly criterion from a betting strategy to a normative epistemology. The argument is that because the world involves compounding processes (ideas spread, wealth grows, populations expand), we should always reason using geometric means.

  This fails outside the narrow domain of repeated, reinvested, multiplicative processes.
  *   **Additive Processes:** If your income is additive (salary + bonus), not multiplicative, the arithmetic mean is the ergodic observable. Optimizing the geometric mean here makes no sense.
  *   **One-Off Decisions:** In a single-shot decision with no reinvestment, the "time average" is just the outcome of that one shot. The distinction between ensemble and time average collapses. Expected utility theory handles this fine; Geometric Rationality has to contort itself to explain why you wouldn't just maximize expected value in a one-off bet where ruin isn't possible.
  *   **Non-Transferable Utility:** In many philosophical or social contexts, "wealth" isn't a scalar quantity that compounds. You cannot compound "moral credit" or "happiness" in the same way you compound capital.

  The generalization attempt is an instance of the "man with a hammer" problem. Because Kelly betting is mathematically elegant and solves the ruin problem in finance, proponents assume it must be the key to all rational action. It ignores that "rationality" is defined relative to an agent's goals. If an agent's goal is to maximize the probability of survival for 10 years, Kelly might be too aggressive. If the goal is to maximize expected impact in a charity context (where utility might be linear in lives saved), Kelly is too conservative.

  **What is being smuggled:** It smuggles **financial market dynamics** into **general epistemology**. It assumes the world is a casino where you must always reinvest your winnings to stay in the game. While a useful metaphor, it is not a universal law of reasoning.

  ### Summary: Who is Smuggling What?

  You asked for an opinion on which side is smuggling what. Here it is:

  **The Ergodicity Economics / Geometric Rationality side is smuggling:**
  1.  **A Utility Function:** They claim to derive "ought" from "is" (dynamics dictate rationality), but they smuggle in $U(W) = \ln W$ by defining "rational" as "maximizes time-average growth."
  2.  **A Time Horizon:** They smuggle in an infinite time horizon ($T \to \infty$) to make the probability of Kelly dominating equal to 1, ignoring finite-horizon risks.
  3.  **Physics Prestige:** They use "ergodicity" to imply a hard dynamical constraint (like a spin glass barrier) where there is only a statistical property of multiplicative processes (Jensen's inequality).

  **The Traditional Expected Utility side (Samuelson/Menger) is smuggling:**
  1.  **Psychological Realism:** They often assume utility functions are arbitrary or purely psychological, ignoring that biological and economic survival *does* impose multiplicative constraints that make log-like utility evolutionarily stable.
  2.  **Ensemble Relevance:** They sometimes defend expected value maximization in contexts where the ensemble average is physically unattainable (single trajectory systems), effectively arguing for the relevance of "parallel universe" averages.

  **Final Opinion:**
  Your intuition as a physicist is the stronger one here. The Ergodicity Economics program is a valuable corrective to the naive use of expected value in multiplicative contexts (it reminds economists that $\mathbb{E}[W]$ is not what you experience). However, its philosophical claim to have superseded Expected Utility Theory is false. It has not eliminated utility; it has just hard-coded a specific utility function into the definition of "dynamics."

  It is not a new foundation for rationality. It is a rigorous derivation of the Kelly criterion for multiplicative processes, wrapped in a layer of physics terminology that doesn't quite hold up to scrutiny from someone who actually knows what ergodicity breaking looks like in a Hamiltonian system. Stick with Samuelson: maximize expected utility, but ensure your utility function reflects the multiplicative reality of your survival constraints. That gets you the same math without the misleading metaphysics.
