answer: |-
  Hi everyone. For those who don't know me, I'm [Your Name]. And for those who do know me, you know I didn't volunteer for this. I was voted in. Apparently, "being the kid" comes with mandatory public speaking duties. So, if I mess this up, blame the democratic process.

  Seriously though, thank you all for being here. Thirty-eight years is a long time. In plumbing terms, I'm pretty sure some of the pipes in this building were brand new when Mom started here. She has been the constant in this company through every boom, every bust, and every inventory system change since the Carter administration.

  But lately, whenever anyone asks Mom if she's excited for next month, she gives this same answer. She says, "I don't know what I'm gonna do with myself all day." She says it like a joke, but I know her. It's not really a joke.

  And honestly, that worry got me thinking. A few months ago, my brother-in-law—who loves finance stuff way more than anyone should—sent me an essay to read. It was written back in 1930 by an economist named John Maynard Keynes. Now, I know we're in a warehouse break room, not a lecture hall, so stick with me. Uncle Ray, I know you're listening, I got the citation right.

  Keynes made a prediction. He said that eventually, technology and hard work would solve what he called the "economic problem." He meant that humanity would get efficient enough that we wouldn't have to spend every waking hour just trying to survive. But he said that when we finally got there, we'd face a new, harder problem. He asked: Once you don't *have* to work to live, what do you actually *do* with your freedom?

  He looked at the wealthy people of his own time, who already had that freedom, and he noticed something interesting. A lot of them were miserable. They were bored. They fell apart. Because nobody had ever taught them how to live without the structure of a job. They knew how to make money, but they didn't know how to spend a life.

  And I realized, that's exactly where Mom is standing right now. She's not just retiring; she's stepping into a future that Keynes thought was a hundred years away. She's solving the economic problem.

  But here is where Keynes got it wrong, or at least, where he didn't know my mother.

  He thought the challenge was learning to live without work. But Mom isn't walking away from who she is. For 38 years, she hasn't just been "doing the books." She's been practicing discipline. She's been building reliability. She's been the person who shows up, who balances the ledger, who makes sure the pieces fit together.

  Keynes thought money was just a tool to get us to the good part. But for Mom, the numbers weren't just money. They were a promise kept. Every invoice paid, every budget balanced, was a way of taking care of this company and all of you.

  So, Mom, when you worry about what you'll do with your days, I don't think you need to worry. You aren't starting from zero. You aren't losing your structure; you're just taking the structure you built for thirty-eight years and finally applying it to yourself.

  You spent decades managing everyone else's resources. Now you get to manage your own time. And if the last 38 years are any indication, you're going to balance that ledger better than anyone else could. You're not leaving the work behind; you're just changing the project.

  So, if I could ask everyone to raise a glass.

  To Mom. Thank you for solving the economic problem for this family, and for this company. May your next chapter be as well-organized as your ledgers, but with a lot more freedom. And may you never have to audit a plumbing invoice ever again.

  Cheers!
