      *   *Round 2 Analysis:* Warren's "Initial Conditions."
          *   *Assessment:* Theoretically sound, practically weak if the pattern is loose.
      *   *Round 3 Analysis:* Nadia's "Exceptions & Intelligibility."
          *   *Assessment:* Strongest argument. Undermines Warren's "law."
      *   *What's Missing:*
