  *Wait, one more consideration:* If I give half money to a broken idea, does that encourage bad ideas? I need to mitigate that in the policy section. The policy should say "Future submissions must be viable to qualify for priority." This makes the current split a "grandfathered" act of goodwill due to the rule's ambiguity. This is crucial. It protects the program's future quality while solving the current morale issue.

