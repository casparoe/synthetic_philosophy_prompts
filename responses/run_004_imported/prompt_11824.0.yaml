answer: |-
  **MEMORANDUM**

  **TO:** The Honorable Judges [Classmate Name] & [Classmate Name]
  **FROM:** Judge [Your Name]
  **DATE:** October 26, 2023
  **RE:** Draft Opinion – *City of Franklin v. Doe* (Franklin Wildlife Rehabilitation Act § 14-206)

  Colleagues,

  Below is my draft opinion for our deliberation. I know the facts of this case tug at our heartstrings—a minor trying to save an injured animal is not the kind of "criminal" we usually worry about. However, after wrestling with the statutory language and the role of the judiciary, I have concluded we must affirm the citation.

  My position is rooted in **textualism**. While I acknowledge the **purposivist** argument is morally compelling, adopting it here would require us to rewrite the statute from the bench, violating the separation of powers. That said, I propose a disposition that upholds the law while waiving the penalty.

  Here is the reasoning.

  ### I. The Plain Meaning of § 14-206
  The Franklin Wildlife Rehabilitation Act is unambiguous. Section 14-206 establishes a general prohibition: no person may keep a wild animal in captivity. It then provides a specific, narrow exception:
  1.  **Who:** A licensed veterinarian OR an animal shelter.
  2.  **How Long:** Up to 72 hours.
  3.  **Condition:** For emergency treatment before transfer to a licensed facility.

  The defendant fits none of these criteria. She is not a vet. She is not a shelter. She kept the animal for 9 days (216 hours), exceeding the 72-hour limit by 300%.

  Under the **plain meaning rule**, when statutory text is clear, our inquiry ends. We cannot insert a "Good Samaritan" exception that the City Council did not write. If we rule for the defendant, we are effectively adding a clause that reads: *"...unless a private citizen feels the licensed facilities are inaccessible."* That is legislation, not interpretation.

  ### II. Engaging the Purposivist Counter-Argument
  I know one of you is likely leaning toward a purposivist reading. The strongest version of that argument is this: *The purpose of the Act is wildlife protection, not punishing compassion.*

  The Purposivist would argue that the defendant achieved exactly what the legislature wanted: the raccoon was treated and survived. To penalize her creates an "absurd result" where the law discourages citizens from helping wildlife when professional help is logistically impossible (i.e., the rehabber was 3 hours away and swamped). Under this view, we should interpret "licensed veterinarian" functionally to include anyone providing equivalent emergency care when a vet is unavailable.

  **This is a powerful moral argument, but a dangerous legal one.**

  If we accept that "logistical difficulty" justifies ignoring statutory deadlines and licensing requirements, where do we draw the line?
  *   Is 9 days okay? What about 9 weeks?
  *   Is a raccoon okay? What about a venomous snake or a bear cub?
  *   Who decides if a rehabber is "swamped" enough to justify a private citizen taking over?

  By ruling for the defendant on the *merits of the violation*, we grant judges the power to decide which laws to enforce based on our own assessment of fairness. That undermines the **Rule of Law**. Citizens need to know that if the text says "72 hours," it means 72 hours, not "72 hours unless a judge thinks you had a good reason."

  ### III. Separation of Powers & Institutional Competence
  This is the core AP Gov principle at stake. The Legislature's job is to balance competing interests (wildlife safety vs. public access to care). They chose a strict liability rule with narrow exceptions, likely to prevent people from keeping wild animals as pets under the guise of "rescue."

  If this law creates a hardship for rural residents or Good Samaritans, the remedy is for the City Council to amend § 14-206. They can add a "hardship waiver" or extend the time limit for private citizens. It is not for this Court to fix a "broken" law by ignoring its text. We are the interpreters, not the authors.

  ### IV. Proposed Disposition: Liability vs. Penalty
  However, finding a violation does not mean we must crush the defendant. I propose we split the difference:

  1.  **Ruling:** We affirm that § 14-206 was violated. The citation stands. This preserves the integrity of the statute and signals to the public that the text means what it says.
  2.  **Remedy:** We remand the case to Animal Control with a recommendation for **zero fines and no permanent record**, citing "equitable discretion."

  This allows us to be Textualists on the *law* (upholding the statute's authority) but humane on the *consequence* (acknowledging the defendant's good faith). It tells the City: "Your law was broken, enforce it," but also tells the City: "Use your prosecutorial discretion wisely; don't fine a kid for saving a life."

  ### V. Questions for Deliberation
  Before we meet, I'd like you to think about these two points:
  1.  If we rule for the defendant (Purposivist), how do we write an opinion that doesn't accidentally legalize keeping wild animals as pets for anyone who claims they "couldn't find a vet"?
  2.  Do you agree that separating the *finding of guilt* from the *assessment of punishment* solves the tension between Text and Purpose, or does that feel like a cop-out?

  I'm open to being persuaded, particularly on the remedy, but I feel strongly that we cannot invalidate the text of the statute without overstepping our judicial role.

  Let's discuss.

  [Your Name]
  *Associate Judge*
