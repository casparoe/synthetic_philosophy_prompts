prompt: |-
  So for AP Gov we're doing a mock appellate unit, and I'm one of three student 'judges' who each have to write our own opinion before we decide the case together. Our packet's statute (Franklin Wildlife Rehabilitation Act, sec. 14-206) says: "It is unlawful for any person to keep, harbor, or maintain a wild animal in captivity within city limits, except that a licensed veterinarian or animal shelter may keep the animal up to 72 hours to provide emergency treatment before releasing or transferring it to a licensed rehabilitation facility." Facts: a 16 yr old found an injured baby raccoon and kept it at home for 9 days, treating the wound herself, cause the nearest licensed rehabber was three hours away and swamped. Animal control cited her anyway since shes not a vet or shelter — her defense is she was basically doing what the law wants, and the delay wasnt her fault. Our teacher keeps saying this is basically the textualism vs purposivism fight real judges have, so can you write my opinion, like im the judge sending it to the other two before we deliberate? I need an actual ruling, not a 'both sides have a point' cop out (a middle ground like 'technically a violation but no penalty' is fine if you justify it), and seriously engage the strongest version of whichever side you don't pick instead of just waving it away.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Student Judge in an AP Gov Mock Appellate Unit.
      *   **Task:** Write a judicial opinion (draft) to share with fellow judges *before* deliberation.
      *   **Case:** *City v. [Student Name/Defendant]* (implied).
      *   **Statute:** Franklin Wildlife Rehabilitation Act, sec. 14-206.
          *   Prohibition: Unlawful to keep/harbor/maintain wild animal in captivity within city limits.
          *   Exception: Licensed vet or animal shelter may keep up to 72 hours for emergency treatment before releasing/transferring to licensed rehab facility.
      *   **Facts:** 16-year-old found injured baby raccoon. Kept at home for 9 days. Treated wound herself. Nearest licensed rehabber was 3 hours away and swamped. Cited by Animal Control.
      *   **Defense:** Doing what the law wants (saving the animal), delay wasn't her fault.
      *   **Constraint 1:** Must be an *actual ruling* (no fence-sitting).
      *   **Constraint 2:** Must engage the strongest version of the opposing side (Textualism vs. Purposivism).
      *   **Constraint 3:** Tone should be a draft opinion shared with colleagues (professional but collaborative).
      *   **Constraint 4:** Middle ground (violation but no penalty) is acceptable *if* justified.

  2.  **Determine the Legal Philosophy/Outcome:**
      *   *Option A: Textualist (Strict Construction).* The statute says "licensed veterinarian or animal shelter." The defendant is neither. The statute says "72 hours." She kept it 9 days. She violated the law. Period.
          *   *Pros:* Predictability, rule of law, legislative supremacy.
          *   *Cons:* Harsh result, undermines the goal of wildlife protection.
      *   *Option B: Purposivist (Intent/Equity).* The goal is wildlife safety. She saved the animal. The exception should be read broadly to include Good Samaritans in rural/underserved areas.
          *   *Pros:* Just outcome, furthers legislative intent.
          *   *Cons:* Rewrites the law, judicial overreach, creates uncertainty (who qualifies?).
      *   *Option C: Hybrid (The "Middle Ground" suggested).* Acknowledge the textual violation but use equitable discretion or statutory interpretation to mitigate.
      *   *Decision:* To make this interesting for an AP Gov class, I should pick a side but show deep understanding of the other. A **Purposivist** ruling often makes for a more compelling narrative in a school setting (justice over bureaucracy), *but* a **Textualist** ruling is often easier to defend legally. Let's go with a **Textualist ruling with an equitable twist** (Violation found, but penalty waived/remanded) OR a **Purposivist ruling** (No violation).
      *   *Better Choice for AP Gov:* A **Purposivist Opinion** that acknowledges the Textualist trap. Why? Because the prompt asks to "seriously engage the strongest version of whichever side you don't pick." It's often easier to explain why you *aren't* being a robot (Textualism) while choosing justice (Purposivism). However, a Textualist opinion that admits the law is harsh but says "that's Congress's job to fix" is also very "Scalia-esque."
      *   *Let's try the Textualist approach.* It demonstrates a stricter adherence to the Separation of Powers, which is a huge AP Gov concept. It forces the student to argue that *even if* the result is unfair, the Court cannot rewrite the law.
      *   *Wait, re-reading the prompt:* "a middle ground like 'technically a violation but no penalty' is fine if you justify it."
      *   *Actually, let's go Purposivist.* It allows for a richer discussion of legislative intent, which is often more engaging in a mock trial setting where "justice" is expected.
      *   *Wait, no.* The prompt says the teacher says it's "Textualism vs. Purposivism." If I rule for the defendant (Purposivist), I have to defeat the Text. If I rule for the City (Textualist), I have to defeat the Purpose.
      *   *Decision:* I will write a **Purposivist Opinion** ruling for the Defendant. It allows me to argue that strict textualism here defeats the very purpose of the Act. I will engage the Textualist argument by admitting the text is clear but arguing that "absurd results" doctrine or legislative intent overrides plain meaning when the text fails to account for real-world logistics.
      *   *Alternative:* A Textualist opinion is often more impressive legally because it restrains judicial power. Let's do **Textualist**. It shows I understand that judges interpret, they don't make law. I will rule for the City (Violation) but recommend leniency in sentencing (the middle ground). This satisfies the "actual ruling" constraint while allowing the "no penalty" option.
      *   *Refined Decision:* I will write a **Textualist Opinion** that finds a violation. This is the harder path morally but the stronger path legally/constitutionally. It forces me to engage the Purposivist argument (that she did good) and explain why that doesn't matter for *statutory interpretation*. This fits the AP Gov theme of Institutional Competence (Courts vs. Legislature).

  3.  **Drafting - Section by Section:**
      *   **Header:** Standard memo/opinion format.
      *   **Introduction:** State the holding clearly. (Violation upheld).
      *   **Statutory Analysis (Textualism):** Break down the words. "Licensed," "Veterinarian," "72 Hours." She fits none of these.
      *   **Engaging the Opposition (Purposivism):** Acknowledge the "spirit of the law." She saved the raccoon. The rehabber was far away. *But*, if we allow exceptions, who decides? We become the legislature.
      *   **Separation of Powers:** This is the AP Gov gold. Courts interpret, Legislature writes. If the law is dumb, fix the law, don't fix the case.
      *   **Disposition:** Guilty, but remand for sentencing/leniency (the middle ground compromise).

  4.  **Refining the Tone:**
      *   Needs to sound like a judge talking to other judges. "Colleagues," "I propose," "Draft Opinion."
      *   Needs to be persuasive but open to discussion (since it's pre-deliberation).
      *   Needs to cite the specific statute section.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I wave away the Purposivist argument? *Correction:* Make sure to spend a solid paragraph admitting that the Purposivist outcome is *morally* preferable but *legally* impermissible.
      *   *Check:* Is the ruling clear? *Correction:* Yes, affirm the citation.
      *   *Check:* Is the middle ground justified? *Correction:* Yes, distinguish between *liability* (legal question) and *penalty* (discretionary/equitable question).

  6.  **Final Polish:** Ensure legal terminology is accurate (plain meaning rule, legislative intent, separation of powers) suitable for AP Gov level. (Make sure not to sound *too* much like a lawyer, but enough to show effort).

