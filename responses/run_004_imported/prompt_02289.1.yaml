answer: |-
  **Setting:** *Conference Room B, St. Jude's Memorial Hospital. 11:45 PM. A stack of draft triage protocols sits between ELENA (40s, bioethicist) and MARCUS (50s, chief of medicine). Coffee cups are empty. The whiteboard behind them is covered in flowcharts.*

  **MARCUS:** (Tapping the document) Section 4, Subsection B. "Allocation of Last-Resort Resources." My redline is simple, Elena. In the event of absolute scarcity—one ventilator, two patients—priority goes to the group with the highest probability of survival. If survival probability is equal, we save the greater number.

  **ELENA:** I can't sign off on "save the greater number." Not as a mandate.

  **MARCUS:** We've been over this. If you have a drug that saves five people or one person, and you choose the one, four people die unnecessarily. That's not triage; that's negligence.

  **ELENA:** It's not negligence, Marcus. It's a refusal to treat human lives as fungible units in a calculus. Look, imagine the classic case. David needs the whole dose to live. Five strangers each need a fifth. You can't do both. Taurek's point is that there is no "super-person" who experiences the loss of five lives. There are just five individuals, each losing one life.

  **MARCUS:** And David is one individual losing one life.

  **ELENA:** Exactly. So when you say "save the five," you're implicitly adding up those five losses and weighing them against David's single loss. But David doesn't feel the five losses. The five don't feel each other's losses. The sum exists only in your head, not in the reality of the suffering. If you can't sum the loss, you can't use the sum to justify overriding David's claim.

  **MARCUS:** You're describing the "separateness of persons." I know the argument. But you're drawing the wrong conclusion from it. If we must respect the separateness of persons, we have to respect the separateness of their *claims*. Each of the five has a claim to be saved. David has a claim to be saved. All six claims are equal in strength.

  **ELENA:** And that's precisely why we flip a coin.

  **MARCUS:** (Leaning forward) No. That's where the logic breaks. If you flip a coin between "David" and "The Group of Five," you are giving David a 50% chance of survival. But what chance are you giving the individuals in the group?

  **ELENA:** They have a 50% chance as a collective.

  **MARCUS:** There is no collective! You just said there's no super-person. If there are five separate people, and you give their "side" a 50% chance, then mathematically, each of them has only a 10% chance of survival. You've given David a 50% chance, and you've given each of the others a 10% chance. How is that equal concern?

  **ELENA:** (Pauses, stirring her cold coffee) You're conflating the *procedure* with the *outcome probability*. I'm not weighing the groups. I'm acknowledging that I cannot choose between them based on worth. So I give each *side* of the dilemma an equal chance. It's about my moral agency, Marcus. I refuse to be the agent who says David's life is worth less than five others.

  **MARCUS:** But by refusing to say that, you are effectively saying the five others' lives are worth less than they are. Think about it from the patient's perspective. If I'm one of the five, and I know you have the resource, do you think I'd accept a coin flip? I'd say, "Doctor, there are five of us. Each of us wants to live just as much as David. Why should my claim be diluted by the fact that I'm standing next to four other victims?"

  **ELENA:** Because if you let the numbers decide, you turn David into a means to an end. You sacrifice him *because* it benefits the aggregate. Taurek argues that no number of people's mild headaches adds up to something worse than one person's migraine. The migraine wins, not because the math says so, but because the intensity of the single experience outweighs the scattered minor ones. Here, the stakes are equal—life for life. So the number shouldn't tip the scale.

  **MARCUS:** The headache analogy is the weak point, Elena. Death is a threshold. But let's grant you the principle. You say we shouldn't sum harms. I say we should sum *claims*. Parfit's reply to Taurek was clear: Giving equal weight to every person is exactly *why* the numbers count. If I ignore the numbers, I am ignoring four claims for no reason other than administrative convenience. I am telling four people, "Your right to life exists, but I'm going to pretend it doesn't exist so I can feel morally pure about not doing math."

  **ELENA:** You're not pretending it doesn't exist. You're acknowledging that you cannot compare them. If I save the five, I have actively chosen to let David die *to save* the five. If I flip a coin, I let fate decide. I remain neutral between the claims.

  **MARCUS:** Neutrality isn't always fair. Suppose I owe five people five dollars each, and I have five dollars in my pocket. David says, "Give it to me, I owe it to one person." The five say, "Give it to us, we each own a dollar of that." If I flip a coin to decide whether to pay David or the five, have I treated them equally?

  **ELENA:** That's property. This is life. You can't split the ventilator.

  **MARCUS:** The principle of the claim is the same! If you believe each person matters equally, then satisfying five claims is better than satisfying one. To say otherwise implies that the fifth person's claim vanishes into thin air once the first person is saved.

  **ELENA:** (Sharp) It doesn't vanish. It just doesn't outweigh David's. Look, Marcus, I'm worried about what this policy does to us. If we codify "save the greater number," we institutionalize the idea that some people are expendable for the greater good. In a mass casualty event, that might mean we stop looking at the person in Bed 1 and start looking at the *statistic* of Bed 1 through 5.

  **MARCUS:** And if we codify the coin flip, we institutionalize the idea that the lives of the many are no more valuable than the life of the one. That's not neutrality, Elena. That's a bias toward the singleton. Why does David get a 50% shot when he represents only 16% of the people in the room?

  **ELENA:** Because he represents 100% of his own life! That's the point of the separateness of persons. He isn't 16% of a group. He is a universe unto himself. To ask him to accept a 50% risk so that *others* might live is to ask him to subsidize their survival with his own death.

  **MARCUS:** And to ask the five to accept a 10% risk each so David might live is to ask them to subsidize his survival with their deaths. You keep saying the losses don't sum. But the *prevention* of loss does sum. If I save the five, I prevent five tragedies. If I save David, I prevent one. Why is preventing five tragedies not morally superior to preventing one?

  **ELENA:** Because "five tragedies" is a figure of speech. There is no container holding the tragedies. There are just five people grieving. And on the other side, one person grieving. Is the grief of five families objectively "heavier" than the grief of one? Or is it just... more of it?

  **MARCUS:** (Sighs, rubbing his temples) More of it *is* heavier. If I have five patients coding at once, and I run to one because he's the closest, I feel bad. But if I run to one because I flipped a coin while five died, I haven't just failed the five; I've insulted them. I've told them their existence didn't tip the scale.

  **ELENA:** And if I run to the five automatically, I've told David his existence didn't matter enough to warrant a fighting chance.

  **MARCUS:** He *had* a fighting chance. He had the same chance as every individual in the five. The fact that there were more of them is not a moral failing on his part, but it is a moral reality for me.

  **ELENA:** (Quietly) We're both claiming the mantle of "Equality," Marcus. I can see that now.

  **MARCUS:** Yes. You think equality means I must not weigh one person against another. I think equality means I must weigh every person's claim equally, which means the side with more claims wins.

  **ELENA:** I think the divergence is here: You think the moral obligation is to maximize the *satisfaction of claims*. I think the moral obligation is to maintain the *integrity of the choice* between individuals.

  **MARCUS:** So for you, the coin flip is a way of honoring David's status as an end in himself.

  **ELENA:** And for you, the coin flip is a way of dishonoring the five as mere numbers in a pool.

  **MARCUS:** (Nods slowly) We aren't disagreeing about whether lives matter. We're disagreeing about whether "lives" is a plural noun that can be the subject of a single moral sentence.

  **ELENA:** (Looks at the draft policy) If I concede to the "greater number" clause, I feel like I've betrayed the individual standing in front of me.

  **MARCUS:** And if I concede to the coin flip, I feel like I've betrayed the population I'm sworn to protect.

  *(Silence hangs between them. Marcus picks up his pen, hovers it over the paper, but doesn't write.)*

  **MARCUS:** We can't file this tonight.

  **ELENA:** No. But I think we finally found the line. It's not about the math. It's about whether morality is additive.

  **MARCUS:** (Puts the pen down) I believe it is.

  **ELENA:** (Gathers her papers) And I believe that if it is, we lose the person in the process of counting them.

  **MARCUS:** Same time tomorrow?

  **ELENA:** Same time.
