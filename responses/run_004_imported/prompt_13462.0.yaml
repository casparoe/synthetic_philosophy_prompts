      *   *Refining the Diachronic Point:* The user's point is about the *asymmetry of effort*. To maintain D1, the collective must act. To upset it, individuals just act. Wait, under Cohen's joint ownership, individuals *can't* just act. They need collective approval. So the asymmetry is: Individuals must *ask*, Collective must *decide*. If they ask constantly, the Collective must decide constantly. Is that "interference"? It's more "transaction cost" or "political burden."
      *   *Correction:* Nozick's point is that D1 -> D2 happens naturally. Restoring D1 requires force. Cohen's point is D1 is maintained by rules. Moving to D2 requires force (or rule change). The user's point: If the *demand* for D2 is constant, the *defense* of D1 is constant.
      *   *Critical Check:* Does Cohen admit the demand will be constant? No, that's the Ethos argument. If the ethos holds, the demand disappears. So the user's objection assumes the *capitalist ethos* persists within the *socialist structure*. Cohen would say that's an unstable equilibrium. This is the crux of the paper.

  7.  **Final Polish:** Ensure the distinction between "coercion" and "interference" is clear. Ensure the distinction between "rules" and "outcomes" is clear. (Nozick attacks patterned *outcomes*, Cohen defends patterned *rules* justified by equality).

      *(Self-Correction during drafting)*: I need to make sure I don't write the paper for them, but give high-level philosophical feedback. The "Diachronic" point is really about *stability* and *administrative burden* masquerading as a liberty claim. I should highlight that.

