          *   *Suggestion:* Clarify that Nozick's point isn't just about interference, but about *violating rights*. Cohen challenges the pre-political status of those rights.

      *   **Q2: Is (3) a real gap or defused?**
          *   *Real Gap:* It highlights the *stability* problem. Even if coercion is symmetrical, the *frequency* of intervention might differ.
          *   *Cohen's Defense:* Cohen's "Ethos" argument (from *Rescuing Justice and Equality*). If the community shares an egalitarian ethos, they won't *want* to pay Wilt extra in a way that violates equality. The transaction happens within the rules, not against them.
          *   *Cohen's Defense 2:* The distinction between *rules* and *interferences*. A rule that says "Wilt gets X" isn't an interference every time someone wants to give him Y. It's a standing rule. Nozick's "continuous interference" assumes the pattern is an outcome to be constantly micromanaged, whereas Cohen might view it as a structural constraint on valid claims.
