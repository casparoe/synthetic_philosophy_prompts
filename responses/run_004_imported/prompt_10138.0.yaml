      *   *Colonial Argument:* Former colonial powers (like Britain) have special obligations to those they colonized. Excluding them is compounding injustice.
      *   *Refugee Distinction:* Dummett distinguishes between refugees (persecuted) and economic migrants, but argues for openness to both, though prioritizing refugees. However, the definition of "refugee" is legally narrow.
      *   *Methodology:* Dummett is an analytic philosopher but writes with moral urgency. He often appeals to common sense morality and Christian ethics (he was a Catholic), but the prompt asks for philosophical defense.

  3.  **Drafting the Specific Required Questions (with Answers & Follow-ups):**

      *   *Requirement 1: The "Brute Fact" Right to Migrate.*
          *   *Question:* Dummett posits the right to immigrate as axiomatic. How to defend against someone who sees citizenship as a club with membership rules?
          *   *Likely Answer:* She'll argue it stems from basic human agency or freedom of movement as a precondition for other rights. She might appeal to the arbitrariness of birth.
          *   *Follow-up:* If it's a precondition for agency, does that dissolve the nation-state entirely? Where is the limit?
          *   *Refinement:* Make it sharper. Focus on the lack of derivation.

      *   *Requirement 2: Colonial History (Hypocrisy vs. Principle).*
