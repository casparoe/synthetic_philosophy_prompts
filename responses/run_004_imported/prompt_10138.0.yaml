answer: |-
  Here are 9 substantive interview questions tailored for a philosopher defending Dummett. The first three address your specific requirements with the anticipated answers and follow-ups you requested. The remaining six target other vulnerable points in Dummett's framework.

  ### The Required "Hard" Questions

  **1. The Axiomatic Right to Migrate**
  "In Part One, Dummett treats the right to immigrate not as a conclusion derived from a deeper theory of justice, but as a brute, self-evident moral starting point. He essentially says if you don't share this intuition, you're morally blind. But for a listener who views citizenship as a collective project with membership rules—like a private club or a family—this intuition isn't shared. If she can't derive this right from a deeper principle of autonomy or need, how does she defend it against someone who simply rejects the axiom without being irrational?"

  *   **Likely Answer:** She will likely argue that freedom of movement is a *precondition* for exercising other basic liberties. If you are trapped in a jurisdiction that violates your rights, the right to exit is meaningless without the right to enter somewhere else. She may lean on the "moral arbitrariness of birth" argument: you shouldn't be penalized for where you were born.
  *   **Follow-Up:** "If freedom of movement is a precondition for liberty, doesn't that logically dissolve the nation-state's right to exclude *anyone*, anywhere? If the right is that fundamental, why stop at immigration? Does her defense of Dummett ultimately require open borders globally, or is she comfortable preserving the state's right to exclude so long as it doesn't violate that specific 'precondition'?"

  **2. The Colonial Hypocrisy Gap**
  "Dummett argues that Britain's colonial history undercuts its standing to restrict immigration from former colonies. But logically, that argument only proves that *current restrictions are hypocritical*, not that *restriction is inherently wrong*. It attacks the messenger, not the message. A restrictionist could say, 'Fine, we were bad in the past, but that doesn't grant an infinite right of entry now.' How does she bridge the gap between 'you are hypocrites' and 'you have no moral right to close the border'?"

  *   **Likely Answer:** She will likely pivot to *reparative justice*. The argument isn't just about hypocrisy; it's that the wealth and stability of the metropole were built on extraction from the periphery. Therefore, the border isn't a neutral line; it's a fortification guarding stolen goods. Exclusion compounds the original theft.
  *   **Follow-Up:** "If the right to enter is based on reparations for colonial theft, does that right expire? Is there a statute of limitations on colonialism? And more critically, what does this imply for countries *without* a colonial history, like Poland or Japan? Does Dummett's framework allow them to be exclusionary, or does the colonial argument just mask a universal right that exists regardless of history?"

  **3. The 1951 Convention & The Climate Gap**
  "Dummett draws a line between refugees and economic migrants, largely inheriting the 1951 Convention's definition of a refugee as someone fleeing specific persecution. But that definition was Cold War technology designed to catch dissidents, not people fleeing famine, climate collapse, or generalized state failure. If a person is fleeing a drought that will kill their crops, they aren't 'persecuted' in Dummett's sense. Why should the moral status of a climate refugee be lower than a political dissident, and does Dummett's framework break when the threat is environmental rather than governmental?"

  *   **Likely Answer:** She will likely argue that Dummett's *moral* category of 'refugee' is broader than the *legal* one. She'll contend that the core moral principle is 'threat to life or basic liberty,' and that the 1951 definition is just a legal heuristic that needs updating. She'll say Dummett would support expanding the definition to include environmental threats.
  *   **Follow-Up:** "If we expand the definition to 'threat to life or basic liberty,' doesn't the distinction between refugee and economic migrant collapse? If I'm fleeing a famine caused by trade policies, my life is threatened. If I'm fleeing gang violence that the state can't stop, my liberty is threatened. If she broadens the definition enough to cover climate and failure states, isn't she effectively arguing for open borders for the entire Global South under the label of 'refugee protection'?"

  ***

  ### 6 Additional Substance-Focused Questions

  **4. The Tension with Democratic Self-Determination**
  "Prominent critics like David Miller or Andrea Sangiovanni argue that a political community has a right to self-determination, which includes the right to decide who joins the community. Dummett treats this as secondary to the individual's right to move. Is he undervaluing the collective right of a democracy to shape its own future culture and institutions? Can you have a functioning democracy without the power to define the 'demos'?"

  **5. The Welfare State Objection**
  "Robert Goodin and others have argued that generous welfare states require closed borders to maintain the trust and solidarity necessary for redistribution. If you open the gates as Dummett suggests, do you risk eroding the political coalition that supports the welfare state in the first place? Is Dummett asking us to choose between open borders and social democracy?"

  **6. Migration as a Safety Valve**
  "One critique of the 'right to migrate' framework is that it lets rich countries off the hook for fixing the root causes of migration. If the solution to poverty or instability is just 'let them come here,' does that reduce the incentive for the UK or US to change trade policies, debt structures, or climate emissions? Does Dummett's approach treat migration as a solution rather than a symptom of global injustice?"

  **7. The Problem of Scale and Feasibility**
  "Dummett wrote in a different era. Today, we see the rise of populist movements explicitly fueled by anxiety over migration rates. If a philosopher advocates for a policy that is politically impossible to implement without causing a reactionary backlash that elects authoritarians, is that still a valid moral prescription? How much should 'political feasibility' weigh against 'moral truth' in her reading of Dummett?"

  **8. Integration and Social Trust**
  "Dummett is optimistic about integration, suggesting that prejudice dissolves with contact. However, data from scholars like Robert Putnam suggests that in the short term, high diversity can lower social trust and civic engagement. Is Dummett's defense of immigration too reliant on an idealized view of human psychology that ignores the real friction of rapid demographic change?"

  **9. The "Duty to Stay" Argument**
  "Finally, Dummett focuses heavily on the right to *leave* and *enter*. But some political philosophers argue that skilled individuals have a 'duty to stay' and build their own societies rather than draining talent from the Global South. Does Dummett's framework account for the brain drain? Does the individual's right to move trump the collective right of their home country to retain the citizens needed to build a functioning state?"
