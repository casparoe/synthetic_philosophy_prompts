          *   *Likely Answer:* She'll argue that the *legitimacy* of the state's boundary-drawing is tainted. You can't benefit from past theft and then lock the gate. It's a reparative justice argument.
          *   *Follow-up:* Does this only apply to ex-colonial powers? What about countries without that history? Do they get to exclude?

      *   *Requirement 3: Refugee Definition (1951 Convention).*
          *   *Question:* The persecution standard is Cold War tech. What about climate/famine? Does Dummett's framework break there?
          *   *Likely Answer:* She'll argue Dummett's moral category is broader than the legal one. "Threat to life/liberty" should be interpreted broadly.
          *   *Follow-up:* If we broaden it to "threat to life," doesn't that basically include anyone seeking a better standard of living (economic migrant)? Does the distinction collapse?

  4.  **Drafting the Remaining 5-6 Questions (General Substance):**
      *   *Need to cover:* Integration/Social Trust, The "Right to Exclude" (Self-Determination), Economic Impact/Welfare State, Political Feasibility vs. Moral Duty, Dummett's Catholicism/Universalism, The Role of Culture.
