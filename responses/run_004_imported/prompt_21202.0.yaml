answer: |-
  **The Court of King Vīrasena**
  **Subject:** The Validity of Determinate Perception (*Savikalpaka-Pratyakṣa*)
  **Interlocutors:** Vardhamāna (Naiyāyika) vs. Vimuktasena (Bauddha)
  **Moderator:** The Royal Preceptor (*Rāja-Guru*)

  *[The hall is hushed. Scribes sit cross-legged with palm-leaf manuscripts. King Vīrasena sits elevated on a dais, fanning himself slowly. Vardhamāna, the Naiyāyika, wears the sacred thread and sits on a woolen mat. Vimuktasena, the Buddhist, sits opposite, robes saffron, eyes lowered but alert.]*

  **The Royal Preceptor:** The sun is high. The patron awaits. Let the *vāda* commence. The Naiyāyika holds the floor.

  **Vardhamāna (Nyāya):** I bow to the King. I address the Buddhist. You claim that perception (*pratyakṣa*) is only valid when it is free of concepts (*nirvikalpaka*), grasping the unique particular (*svalakṣaṇa*) alone. You say universals are fictions, known only through the exclusion of others (*apoha*).

  Here is the flaw in your exclusion. To say "This is a cow" by means of *apoha* is to say "This is not a non-cow." But to exclude the "non-cow," you must already possess a criterion for what constitutes the "cow" to be protected from that exclusion. If the cognition of "cow" arises *only* from excluding "horse," "dog," and "pot," then what grounds the exclusion itself? You cannot sort things into "to be excluded" and "not to be excluded" without a prior positive grasp of the very class you claim is constructed. Your *apoha* covertly presupposes the real universal (*sāmānya*) it seeks to destroy. Without the real universal, your exclusion is blind.

  **Vimuktasena (Buddhist):** I bow to the King. The Naiyāyika demands a positive ground for exclusion, but he builds his house on a foundation of infinite regress.

  You claim the universal "cowness" resides in the individual cow via the relation of inherence (*samavāya*). I ask you: Is this inherence different from the cow and the universal, or is it not?
  If it is *not* different, then the cow and the universal are identical, and your distinction collapses.
  If it *is* different, then what ties the inherence to the cow? You will need a second inherence to tie the first inherence to the cow. And what ties the second inherence to the first? A third inherence. You have launched an infinite regress (*anavasthā*) to explain a single cognition. Your "real universal" requires an infinite metaphysical machinery to function. My *apoha* requires only a mental distinction. Who carries the heavier burden?

  **Vardhamāna (Nyāya):** You mistake the nature of the connector. Inherence (*samavāya*) is not a separate entity requiring its own connector. It is a self-linking relation (*sva-sambandha*). It is the very nature of connection. To ask for a connector for inherence is like asking for a light to illuminate the sun. The sun is self-luminous; inherence is self-connecting. It does not stand in need of another tie, for it is the ground of all ties.

  But let us return to action. I see a vessel. I recognize it as "water-pot." I fetch water. I quench my thirst. This successful action (*pravṛtti-sāmarthya*) depends on recognizing the universal "potness" in this particular. If, as you say, I only perceive a unique, momentary flash of sensation (*svalakṣaṇa*) that has never existed before and will never exist again, how do I know to drink from it? How does a unique particular, unconnected to any class, guide me to fulfill a general desire?

  **Vimuktasena (Buddhist):** You confuse the object of perception with the object of action. Perception grasps the particular. Action is guided by causal efficacy (*arthakriyā*).

  I do not need a "real universal" to drink. I see a shape, a color, a specific capacity to hold liquid. This particular has the causal power to quench thirst. My mind constructs the concept "pot" for the sake of communication and memory, excluding things that cannot hold water. This construction is a fiction (*kalpanā*), yes, but it is a *useful* fiction.
  Your "real universal" is inert. It does nothing. It sits inside the pot. Does "potness" hold the water? No. The clay does. Does "potness" quench thirst? No. The water does. You multiply entities without increasing causal power. I accept the particular because it acts. You accept the universal because you crave permanence.

  **Vardhamāna (Nyāya):** If concepts are fictions, however useful, then truth and error become indistinguishable.
  I see a man in the distance. I recognize him as "Devadatta." I greet him.
  You Buddhists hold that all particulars are momentary (*kṣaṇika*). The Devadatta I saw yesterday is extinguished. The Devadatta I see today is a new particular.
  If there is no enduring universal or substrate, my recognition ("This is *that* Devadatta") is false. It claims identity where there is none. If all recognition is false because it predicates continuity over a series of momentary flashes, then all worldly transaction is based on error.
  Does the Buddha teach that the world is sustained by fundamental error? Or is my recognition valid because the *same* Devadatta persists?

  **Vimuktasena (Buddhist):** We do not teach that the world is sustained by error, but that you mistake similarity for identity.
  There is no "same Devadatta." There is a causal continuum (*santāna*). The Devadatta of today is the effect of the Devadatta of yesterday, linked by memory impressions (*vāsanā*).
  When you say "This is that Devadatta," your cognition is valid not because the entity is identical, but because the causal series is uninterrupted enough to serve your purpose.
  Validity is non-deception (*avisamvāditva*). If I treat this momentary flash as "Devadatta" and he responds to his name, the cognition is valid. If I treat a mirage as water and find no liquid, it is invalid. We do not need an enduring universal to explain recognition. We need only the continuity of the stream.

  **Vardhamāna (Nyāya):** You speak of "similarity" and "continuity." Now you smuggle the universal in through the back door!
  What makes this causal series a series of "Devadatta" and not "Yajñadatta"? It is similarity.
  But if particulars are truly unique (*svalakṣaṇa*), as you insist, then no two moments can be similar. To be similar is to share a common property. If you admit similarity, you admit a common property. If you admit a common property, you admit a universal.
  You cannot have it both ways. You cannot claim particulars are utterly unique and then claim they are similar enough to form a continuum. Your *santāna* rests on the very *sāmānya* you deny.

  **Vimuktasena (Buddhist):** Similarity is also exclusion.
  Two moments are "similar" not because they share a positive entity called "similarity," but because they are *not dissimilar* in relevant respects regarding our goal.
  When I say "This fire is like that fire," I mean "This fire is not non-fire in the way that water is."
  We reach the limit of thought here, Naiyāyika. You demand a positive ground for everything. I tell you that cognition is a process of differentiation. We carve the world at its joints not because the joints are real entities, but because the carving works.
  If I press you on your inherence again, you say it is self-linking. If I press you on your universal, you say it is perceived. But you cannot show me "cowness" apart from the cow. You infer it. I infer it too. The difference is I admit it is a construction, and you reify it into a metaphysical ghost.

  **Vardhamāna (Nyāya):** I do not infer the universal; I perceive it *in* the particular. That is *savikalpaka-pratyakṣa*.
  When I see the cow, I do not see "cow" and "particular" and then glue them together. I see a qualified particular. The universal is revealed by the senses in conjunction with the mind.
  If your view were true, language would be impossible. Words denote universals. If universals are fictions, then when you say "Bring the cow," you are speaking of nothing. You are commanding a servant to fetch a fiction.
  Does the servant fetch a fiction? No, he fetches a real animal because he recognizes the real universal "cowness" in it. Your *apoha* cannot explain the link between word and world without collapsing into silence.

  **Vimuktasena (Buddhist):** Words denote exclusions, not entities. "Cow" means "not non-cow."
  The servant fetches the animal because he has been trained to exclude horses and dogs. He does not need to see a ghostly "cowness" floating on the animal's back to do his job.
  You fear silence, Naiyāyika. You fill the silence with "inherence," "universals," "eternal souls." I am content to let the silence be silence. The particular is ineffable (*anirvacanīya*). It can only be known, not said.
  I have shown your inherence leads to regress. I have shown your recognition relies on continuity, not identity. I have shown your universals add no causal power. The King must decide: Do we multiply entities to comfort the intellect, or do we cut them away to clear the vision?

  **Vardhamāna (Nyāya):** And I have shown your exclusion presupposes the positive. I have shown your similarity contradicts your uniqueness. I have shown your "valid fiction" cannot distinguish truth from error without a real correspondence.
  You cut away entities to clear the vision, but you cut away the very ground on which you stand to speak. If nothing is real but the momentary particular, who is speaking? Who is listening?
  We await the King's judgment.

  *[A heavy silence falls. The scribes stop writing. King Vīrasena leans forward, looking from the woolen mat to the saffron robes. The sun has begun to dip behind the palace columns.]*

  **King Vīrasena:** The arguments are sharp as razors. Both cut deep.
  The Naiyāyika secures the world of action and language, but burdens it with invisible machinery.
  The Buddhist clears the metaphysical clutter, but leaves the ground of recognition shifting like sand.
  My treasury cannot pay for a verdict today. The sun sets. The debate has preserved the honor of both schools. We shall resume when the moon is full.

  *[The Royal Preceptor strikes the gong. The debaters bow to the King, then turn to each other. They do not smile. They gather their manuscripts, the dispute unresolved, as it has stood for centuries.]*
