prompt: |-
  I'm a phil PhD student running the Q&A after a colloquium talk next month by a visiting epistemologist who's going to defend the 'level-splitting' line on higher-order evidence -- basically that it's sometimes fully rational to believe P while also believing, given good evidence about your own unreliability, that your not justified in believing P, so she just rejects the enkratic principle. Can you draft me seven or eight questions that go beyond letting her restate the view? I want one that leans on something like the classic sleep-deprived-doctor case to press on why the higher-order defeat shouldn't just trickle down and revise the first-order belief too, one on whether level-splitting basically licenses rationalizing away any inconvenient higher-order evidence by insisting yours is the misleading case, and one on how an akratic agent is even supposed to decide what to do or assert in the meantime. For each, throw in a follow-up keyed to whatever reply she's most likely to give, and maybe end on a question about what would actually count as evidence against her view.
