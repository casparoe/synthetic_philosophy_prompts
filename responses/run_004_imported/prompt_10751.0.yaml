answer: |-
  Your skepticism is well-founded in the classical game theory you mastered during your career. In the standard biological or economic model, agents have **agency** at the moment of decision. A promise is "cheap talk" because nothing physically prevents an agent from defecting when the time comes to act, regardless of what they said beforehand. If the courts cannot enforce the promise, and the interaction is one-off, the dominant strategy is defection.

  However, your friend is describing a mechanism that has gained significant traction in computer science and cryptography, often formalized as **Program Equilibrium** or implemented practically as **Smart Contracts**. He is onto something real, but his explanation likely skipped the critical technical assumption that makes it work.

  Your skepticism ("surely a firm could show one piece of code while quietly running another") is the exact hinge upon which the solution turns. Here is the breakdown of why your friend is theoretically correct, what feature is doing the work, and where your intuition rightly holds a caveat.

  ### 1. Promises vs. Commitments
  In behavioral ecology, a signal (like a promise) is distinct from the action. An animal can signal "I will not attack" and then attack. The cost of lying determines the signal's reliability.

  In your friend's scenario, the code is not a signal; it is a **commitment device**.
  *   **Promise:** "I intend to transfer the funds if you send the goods." (I retain the ability to change my mind).
  *   **Code:** "This program holds the funds in a locked state. The only function available is `release_recipient()` which triggers *only* if `proof_of_goods_received` is true." (I have physically removed my ability to change my mind).

  If the code is merely text emailed between firms, you are absolutely right: it is just a promise in a different font. But if the code is uploaded to a **Trusted Execution Environment** (like a blockchain or a secure escrow server), the dynamic changes. In this environment, the code submitted *is* the code executed. The firm surrenders agency to the algorithm.

  ### 2. The Feature Doing the Work: Verifiable Execution
  The specific feature that solves the one-off Prisoner's Dilemma here is not "visibility" alone, but **verifiable, deterministic execution.**

  In your career, you dealt with agents whose internal states were hidden and whose actions were flexible. In this software scenario, the "agent" is the program itself, running on a neutral platform that both firms trust more than they trust each other (or the local courts).
  *   **Transparency:** Firm A can inspect Firm B's code to verify that it *cannot* withhold payment if conditions are met.
  *   **Immutability:** Once the code is deployed to the neutral platform, Firm B cannot swap it out for a "defect" version.
  *   **Automaticity:** The execution does not require a second decision by Firm B. It happens mathematically.

  This transforms the game from a **Simultaneous Move Game** (where both fear betrayal) into a **Conditional Commitment**. Firm A sees that Firm B's funds are already locked in the code. Firm A now knows that if they send the goods, the payment is guaranteed by the system, not by Firm B's honor.

  ### 3. Addressing Your Skepticism Directly
  You asked: *"Surely a firm could always show one piece of code while quietly running another."*

  *   **If the deal is peer-to-peer (no neutral platform):** Your skepticism is **justified**. If Firm B sends the code to Firm A for inspection but runs the logic on their own private server, they can absolutely bait-and-switch. In this case, the code is just a promise, and the one-off deal fails.
  *   **If the deal is mediated (neutral platform):** Your skepticism is **unjustified**. The friend's proposal implicitly assumes a "referee" (like a blockchain or secure escrow service) that guarantees: *The code you inspect is the code we run.*

  The "court" that neither side trusts is replaced by a "compiler" or "virtual machine" that both sides trust to execute instructions faithfully. The trust shifts from the *counterparty* to the *medium*.

  ### 4. Why This Unsettles Standard Game Theory
  This setup achieves cooperation in a one-off game without iteration or reputation, which seems to violate the Folk Theorems you are familiar with. It does so by changing the **strategy space**.

  In standard game theory, a strategy is a choice (Cooperate/Defect).
  In this "Program Game," a strategy is a **function**.
  *   **Standard Strategy:** "I choose Cooperate." (Revocable).
  *   **Program Strategy:** "I am a program that outputs 'Cooperate' if and only if the other program outputs 'Cooperate'." (Irrevocable).

  By making the strategy irrevocable and visible *before* the interaction, the firms create a logical loop that forces cooperation. If Firm A sees Firm B's code is "Cooperate if A Cooperates," Firm A's best response is to submit code that says "Cooperate." Defection is no longer an available move at the moment of truth because the code has already locked the choice.

  ### 5. The Biological Analogy
  To bridge this back to your expertise: Imagine two animals that could surgically remove their own ability to flee or fight *before* entering a contest, and display that surgical modification to the other.
  *   If I remove my "defect" muscle and show you the scar, you know I *cannot* defect.
  *   If you do the same, we are forced to cooperate.
  *   In biology, this is costly signaling or pre-commitment (like Ulysses tying himself to the mast).
  *   In software, writing the code and locking it on a neutral server is the surgical removal of the ability to defect.

  ### Conclusion
  Your friend is correct, but only under a specific condition that he may have glossed over: **The code must run on a trusted, neutral executor, not on the firms' private machines.**

  *   **If the code runs privately:** You are right; it is cheap talk.
  *   **If the code runs on a verified platform:** He is right; it is a binding commitment.

  The feature doing the work is the **delegation of agency**. By allowing the code to act, the firms voluntarily disable their own ability to act opportunistically. This allows cooperation in a one-off setting not because the *incentives* changed, but because the *abilities* changed. The option to defect has been physically (or digitally) removed.

  Your intuition remains robust for biological agents, where "running different code internally" is the norm. But for digital agents bound by cryptographic guarantees, the rules of the game fundamentally shift.
