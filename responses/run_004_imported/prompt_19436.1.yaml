      *   **Fact/Value Distinction:** Ethics and politics are expressions of attitude/volition, not cognitive truth-claims. Science can inform means, but not ends.
      *   **The Principle of Tolerance:** "In logic, there are no morals." We can choose different linguistic frameworks based on their utility for specific purposes.
      *   **Relationship to Politics:** He was a socialist personally but kept it out of his *scientific philosophy*. He saw philosophy as a tool for clarification, not a weapon for ideology (though critics like Adorno disagreed).
      *   **Relationship to Neurath:** Neurath was the more politically engaged, "encyclopedic," and physicalist partner. Carnap was more formal, abstract, and cautious.

  3.  **Analyze the "AI Planning" Argument:**
      *   **Claim:** Big data/AI provides the information processing capacity that Hayek claimed was impossible for a central planner (the "knowledge problem").
