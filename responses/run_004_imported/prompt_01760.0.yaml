  **S Tier:** Universalism wins on pure systematicity by eliminating vagueness and arbitrariness entirely, while Deflationism deserves equal billing for dissolving the debate by exposing it as quantifier variance rather than ontological fact.

  **A Tier:** Nihilism is equally precise and principled as Universalism but drops a tier because denying the existence of thinkers imposes a higher pragmatic and intuitive cost than denying trout-turkeys.

  **B Tier:** Modern series-style restrictivism improves on older bonding accounts by avoiding transitivity errors, but it still struggles to provide non-arbitrary boundaries without smuggling in brute facts.

  **C Tier:** Organicism saves living beings but fails to account for artifacts and inherits the fatal vagueness problems inherent in defining where "life" begins and ends.

