      *   *Hansen's Hypothesis:*
          *   Core claim: Classical Chinese nouns = mass nouns (stuff vs. things).
          *   Implication: "White horse" = part of "horse-stuff." Part $\neq$ Whole.
          *   Status: Contested. *Check:* This is the crux. Hansen's *Language and Logic in Early China* (1983) is indeed the source. It is highly influential but also heavily criticized (e.g., by Chris Fraser, A.C. Graham, others). The draft acknowledges it's contested ("Other scholars argue..."). This is good.
