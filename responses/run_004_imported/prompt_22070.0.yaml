answer: |-
  **Setting:** *Paris, 1758. A crowded salon near the Palais-Royal. The air is thick with smoke and the murmur of philosophes. Denis Diderot spots Jean-Jacques Rousseau standing near a window, looking characteristically ill-at-ease among the finery. Diderot approaches, holding a copy of the newly published* Letter to d'Alembert.

  **Diderot:** Jean-Jacques. I confess, I did not expect to find you here, amidst the very spectacle you condemn. I have just finished your *Letter*. It reads less like a philosophical treatise and more like a declaration of war against the arts themselves.

  **Rousseau:** Denis. I am here to observe, not to participate. And it is no war against art, but against deception. You know me; I have always held that morality springs from sentiment, from the heart's natural movement. The theater perverts that. It teaches us to feel without acting.

  **Diderot:** But is that not the function of pity? When we weep for Phèdre or Merope, we are exercising a muscle. You claim this emotion is sterile, that we leave the theater satisfied with our own tears and ignore the beggar outside. I say the opposite: the man who cannot be moved by fiction will hardly be moved by reality. The stage is a school of morals (*école de mœurs*).

  **Rousseau:** A school of illusions! In Geneva, we do not need to be taught to pity; we need to be taught to help. When a citizen pays to weep for a fictional tyrant, he feels he has discharged his duty to humanity. He loves virtue in the abstract so he may neglect it in the concrete. It is a vice that disguises itself as virtue.

  **Diderot:** You speak of Geneva as if it were Sparta, isolated and static. But we are in Paris, and the world is moving toward commerce and sociability. You argue that theater reflects existing mores—that in a corrupt city it makes corruption worse, and in a virtuous one it is unnecessary. But you ignore the middle ground: that art can *refine* mores. It holds a mirror up to nature, yes, but it allows us to judge the reflection.

  **Rousseau:** A mirror that distorts! And who holds the mirror? Actors. Men and women who make a trade of their persons, who speak in a voice not their own, who live by applause. How can a profession built on imposture teach integrity? To be an actor is to cease to be a man; one becomes a public commodity.

  **Diderot:** You reduce the craft to mere lying. An actor is an observer of human nature, perhaps the keenest we have. He studies passion to reproduce it. Is there not honor in that discipline? In *The Natural Son*, I sought to show that the stage can elevate the bourgeois man, make him see the dignity in his own condition. You dismiss the artist as a charlatan.

  **Rousseau:** I dismiss the necessity of the mask. In a true republic, transparency is everything. We should see one another as we are. And consider the women, Denis. You welcome actresses into the salon, you praise their talent. But when a woman steps onto the stage, she exposes herself to the judgment of the public eye. She becomes an object of desire for the many, which undermines her role as the guardian of the domestic sphere.

  **Diderot:** Ah, there is the old fear. You believe that if a woman is seen, she is lost. I believe that if a woman is heard, she is enlightened. The theater gives women a voice, a public intellect. To confine them to the spinning wheel and the nursery is to waste half the moral potential of the nation. Besides, do you think the men in the audience are looking only at their bodies? Some of us listen to the verse.

  **Rousseau:** They look. They always look. And in doing so, they turn the citizen into a spectator and the woman into a spectacle. This destroys the equality necessary for the General Will. In Geneva, I propose festivals not in halls, but in the open air. No actors, no tickets. Let the people *be* the spectacle. Let them dance in the square, see themselves in one another, and feel the warmth of the community directly.

  **Diderot:** A pretty image, Jean-Jacques, but a fleeting one. A festival in the square is a moment of frenzy; a play is a sustained meditation. You want immediate transparency; I want mediated reflection. We need the distance of the stage to analyze our passions safely. If a man sees his own jealousy acted out by Othello, he may recognize it in himself and master it. In your dancing circle, he only feels the crowd's heat.

  **Rousseau:** The crowd's heat *is* virtue! It is the sentiment of existence shared. You rely on reason and analysis to cure passions. I say passions must be guided by other passions, by love of country, by shame, by glory. The theater introduces luxury—idleness for the rich who can afford seats, and envy for the poor who cannot. It creates distinctions where there should be unity.

  **Diderot:** And your open-air festival creates a unity of ignorance. You fear luxury, but luxury drives the arts, and the arts drive the enlightenment of the mind. You say you want men to be free. But without the cultivation of taste and reason that the arts provide, are they not slaves to their own crude instincts? You trust the "natural" man too much. I trust the "cultivated" man.

  **Rousseau:** The natural man is good; it is society that corrupts him! You cultivate him until he is nothing but a social artifact, polite but hollow. I would rather a Genevan be a rough husband and father who knows his neighbors than a Parisian wit who knows all the plays but no one's soul. You call it cultivation; I call it alienation.

  **Diderot:** And I call your simplicity a romantic fiction. We cannot return to the state of nature, Jean-Jacques. We are in the century of the *Encyclopédie*. We must make the best of the society we have. If the theater risks corruption, the cure is better plays, not no plays. Censorship of vice, promotion of virtue on the stage. Use the tool, do not smash it.

  **Rousseau:** You cannot fix a tool that is broken by design. The design is to please, not to instruct. To please, one must flatter the audience's prejudices. If the people are corrupt, the play must be corrupt to succeed. You think you can dictate morality to the box office? The playwright is the servant of the public's taste, not its master.

  **Diderot:** Then we are at an impasse. You believe the public is a beast to be protected from itself; I believe it is a student to be taught. You see the actor as a slave to opinion; I see him as a master of illusion who reveals truth. You see the woman on stage as a victim; I see her as a contributor.

  **Rousseau:** Perhaps. But tell me, Denis: when you leave the theater, moved by some tragedy, and you step into the cold street... do you feel closer to your fellow man? Or do you feel you have already paid your dues to humanity with your tears? I know which I feel.

  **Diderot:** And I know what I feel: that I have seen something of myself in another, and that understanding is the first step toward justice. We shall not agree on this. The rift between us, I fear, is not merely about a play or a letter. It is about whether we believe man is saved by returning to his heart, or by extending his mind.

  **Rousseau:** Then let us leave it there. I prefer the heart. It does not lie. The stage is nothing but a lie that tells the truth, and I have no use for such riddles.

  **Diderot:** And I have no use for a truth that refuses to be spoken. Good evening, Jean-Jacques.

  **Rousseau:** Good evening, Denis.

  *(Rousseau turns back to the window, looking out at the dark street. Diderot turns back toward the salon, rejoining the laughter and the lights.)*
