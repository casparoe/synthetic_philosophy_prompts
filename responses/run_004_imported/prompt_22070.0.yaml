prompt: |-
  For my Enlightenment political philosophy seminar we just spent two weeks on Rousseau's Letter to d'Alembert on the Theatre and I'm honestly still a bit thrown by it. This is the guy whose whole philosophy runs on feeling and sentiment basically being the root of morality (see: Emile), and yet his central case against letting Geneva have a theater is that theatrical emotion is somehow sterile and doesn't make anyone more virtuous -- plus there's a bunch in there about actors, about what a theater does to a small republic's customs, and some pretty pointed stuff about actresses and women in public life. My professor mentioned almost as an aside that Diderot -- who by 1758 had basically stopped speaking to Rousseau, partly over a line in one of his own plays that Rousseau apparently took as a personal jab -- held more or less the opposite view of what drama does to an audience then Rousseau did, but we never actually got into the specifics of how he would've responded.

  For my response paper I dont want to just summarize the Letter, which is what everyone in my section is going to do. Could you write me a dialogue between Rousseau and Diderot actually hashing this out point by point? I know they weren't really on speaking terms anymore by then, so just imagine they run into each other at a salon right after Diderot has read the thing. I don't want a strawman version where Diderot just says theater is fun and edifying and Rousseau just says it's decadent -- I want both of them bringing their real, specific arguments and actually responding to what the other just said instead of talking past each other, so that neither one obviously "wins" by the end. Something like 12-15 exchanges would be great, and feel free to let it end without a tidy resolution, that's kind of the point.
