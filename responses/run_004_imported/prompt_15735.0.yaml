prompt: |-
  For fifteen years I've kept a personal, cross-linked set of notes for my work as an independent consultant, built up entirely in my own way. I don't just look things up in it — I think through new problems by rereading old entries and rearranging the connections between them, rather than reasoning things out from scratch. A firm I now work closely with wants me to migrate everything into their shared, standardized database instead. Colleagues there think I'm just being precious about an old filing system, but it feels closer to being asked to give up part of how I think. Am I overreacting, or is there something real behind that, and how should I make the case for keeping my own system?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Independent consultant for 15 years.
      *   **Asset:** A personal, cross-linked note-taking system (PKM - Personal Knowledge Management).
      *   **Usage:** Not just storage/retrieval, but a cognitive tool for thinking, problem-solving, and connecting ideas (second brain/extended mind).
      *   **Conflict:** A firm the user works closely with wants migration to their shared, standardized database.
      *   **Colleagues' View:** Think the user is being "precious" (sentimental/obstinate) about an old filing system.
      *   **User's Feeling:** Feels like being asked to give up part of *how they think*.
      *   **Question:** Am I overreacting? Is there something real here? How do I make the case for keeping my own system?

  2.  **Validate the User's Feeling (The "Is this real?" question):**
      *   *Cognitive Science/Philosophy:* The concept of the "extended mind" (Clark & Chalmers) is relevant. Tools aren't just external; they become part of the cognitive process.
      *   *PKM Theory:* Systems like Zettelkasten or Obsidian/Roam-style linking are designed for *generative* thinking, not just *archival* storage.
      *   *Expertise:* 15 years of refinement means the system is optimized for the user's specific neural pathways and workflow.
      *   *Conclusion:* The user is *not* overreacting. This is a legitimate cognitive friction issue, not just file format preference.

  3.  **Analyze the Firm's Perspective (The "Why do they want this?" question):**
      *   *Risk Management:* IP ownership, continuity if the consultant leaves.
      *   *Collaboration:* Shared access for other team members.
      *   *Standardization:* Easier onboarding, consistent client deliverables.
      *   *Security/Compliance:* Client data might need to be in specific secure environments.
      *   *Conclusion:* Their reasons are valid business concerns, not just bureaucracy.

  4.  **Identify the Core Conflict:**
      *   Cognitive Flow (User) vs. Institutional Control/Collaboration (Firm).
      *   Private Thinking Space vs. Public Knowledge Base.

  5.  **Develop a Strategy for Negotiation (The "How to make the case" question):**
      *   *Avoid:* "It's my baby," "You don't understand," "I work better this way" (too vague/subjective).
      *   *Adopt:* "Here is how this system creates value for *you*," "Here is a compromise," "Here is the risk of migration."
