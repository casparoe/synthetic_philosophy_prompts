      *   *Backward Induction (BI):* At the last node, Player 2 takes. Knowing this, Player 1 takes at the second-to-last. Unraveling back to start -> Player 1 takes immediately.
      *   *The Guest's Stance:* Strict Nash Equilibrium/Subgame Perfect Equilibrium (SPE). Rationality + Common Knowledge of Rationality (CKR) = Defect Move 1.
      *   *The Counter-Stance:* Humans cooperate. Maybe rationality isn't common knowledge. Maybe the model is wrong. Maybe "rationality" implies something else (team reasoning, epistemic conditions).
      *   *The Paradox:* To reason backward, I must assume you are rational at the *last* node. But if we are both rational, we never *reach* the last node. So how can I assume you are rational there? (Aumann says CKR holds everywhere; Binmore/others say counterfactuals break the logic).

  3.  **Drafting the Questions (Iterative Process):**

