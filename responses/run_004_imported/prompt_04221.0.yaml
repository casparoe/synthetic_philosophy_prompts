  **Justifications:**

  1.  **Marcus (0):** This is a standard monist intuition, but the ice/water analogy is imprecise because phase changes differ from artifact constitution.
  2.  **Jess (+2):** This is a textbook application of Leibniz's Law (the Indiscernibility of Identicals), which is the strongest argument for distinguishing the objects.
  3.  **Marcus (-1):** Dismissing modal properties (facts about possibility/necessity) as "smuggled future facts" is philosophically naive and ignores standard metaphysical tools.
  4.  **Jess (+1):** She correctly identifies that Marcus is defining "property" in a way that begs the question to guarantee his conclusion.
  5.  **Marcus (0):** This is a consistent eliminativist position, but it comes at the high intuitive cost of denying the existence of artifacts like statues.

  **The Missing Move:**

  Both are missing **Perdurantism (Temporal Parts)**. This view holds that objects extend through time like they do through space; the "clay" is the whole worm-like entity through time, while the "bust" is just a specific temporal slice of that clay. This allows Marcus to say the matter persists and Jess to say the bust ceased to exist without requiring two distinct objects to occupy the exact same space at the exact same time. Alternatively, they are overlooking the distinction between the **"is" of identity** versus the **"is" of constitution**; the clay can *constitute* the bust without being *identical* to it, allowing them to share matter but have different persistence conditions.
