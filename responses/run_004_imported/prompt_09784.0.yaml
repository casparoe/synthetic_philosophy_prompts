  2.  **Deconstruct the Philosophical Issue:**
      *   This is a classic debate in meta-ethics and philosophy of emotion/action.
      *   **Key Concept:** *Wrong Kind of Reasons (WKR) Problem*.
      *   **Uncle's Position:** Pragmatism/Instrumentalism about reasons. All considerations that count in favor of a state (including consequences) are reasons for that state.
      *   **Aunt's Position:** Fittingness/Constitutive view. Attitudes like admiration have a "direction of fit." They aim at truth/merit. External incentives don't change the merit.
      *   **The Mobster Example:** This is the *reductio ad absurdum* often used in the WKR literature (Pascal's Wager is another classic example).

