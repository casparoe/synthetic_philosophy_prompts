          *   *Verdict:* Uncle is strong on common sense pragmatics, weak on philosophical precision regarding mental states.

      *   **Move (2) Aunt:** "Reason to *want* to admire... not a reason that makes admiring *fitting*."
          *   *Analysis:* This is the core "Fitting Attitude" analysis. Admiration requires a worthy object. Money doesn't make the object worthy.
