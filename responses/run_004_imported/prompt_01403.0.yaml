answer: |-
  This is a classic knot in formal epistemology, and given your group's pedigree (LessWrong/OB readers wrestling with Jaynes), I know you're looking for something sharper than a textbook summary. You want the *steelman* for the Minimum Cross-Entropy (MinXent) update, specifically against the van Fraassen/Grove/Halpern intuition that Judy's Red/Blue odds should remain 1:1.

  The standard intuition—that evidence "only about" the internal structure of Red cannot shift the Red/Blue marginal—is seductive but, I will argue, epistemologically naive. It smuggles in an independence assumption that the problem statement does not warrant.

  Here is the case for why Judy *should* shift her credence toward Blue, why the MinXent result is the uniquely rational response, and why the "fixed odds" camp is the one implicitly assuming information they don't have.

  ### 1. The Argument from "Hidden Constraints"

  The most direct argument is methodological. The MinXent principle is designed to be the *least biased* update rule. It finds the posterior distribution $Q$ that satisfies the new constraints while remaining "closest" to the prior $P$ in terms of information gain (Kullback-Leibler divergence).

  To keep Judy's Red/Blue odds fixed at 1:1, you must impose an **additional constraint** that is not present in the headquarters' message.
  *   **The Given Constraint:** $P(HQ | Red) = 3/4$.
  *   **The "Fixed Odds" Constraint:** $P_{new}(Red) = P_{old}(Red) = 1/2$.

  The "Fixed Odds" camp treats the second constraint as a freebie, derived from the intuition that the message is "irrelevant" to the Red/Blue partition. But irrelevance is not a logical given; it is a structural assumption. By insisting $P(Red)$ stays fixed, you are asserting that the *internal ratio* of Red is probabilistically independent of the *marginal probability* of Red.

  Why should that be true? In the absence of a causal model linking terrain types to company deployments, you have no justification for assuming independence. MinXent assumes *nothing* but the stated constraint. If the MinXent solution shifts the marginal, it is because the geometry of the probability simplex demands it to satisfy the constraint with minimal information gain. To resist that shift is to voluntarily inject information (the independence assumption) that you do not possess. In a Jaynesian framework, assuming independence without cause is just as much a sin as assuming correlation without cause.

  ### 2. The Information-Geometric Argument: "Volume" in Possibility Space

  This is the stronger, more technical argument that appeals to the information-theoretic instincts of your group.

  Think of the prior distribution not just as a set of numbers, but as a state of maximum entropy (given the symmetries). The prior assigns equal weight to all four quadrants because, for all Judy knows, the "volume" of possibility space occupied by each is identical.

  When headquarters says, "If Red, the ratio is 3:1," they are constraining the Red sector. They are telling Judy that the Red sector is *more specific* than she previously thought.
  *   **Before:** The Red sector allowed for any ratio between HQ and 2nd Company. It had high internal entropy.
  *   **After:** The Red sector is constrained to a specific ratio. Its internal entropy is reduced.

  The Blue sector, however, remains unconstrained. It retains its original internal symmetry (1:1).

  In the geometry of probability distributions, a constrained sector occupies a smaller "volume" of the allowable distribution space than an unconstrained sector. When you minimize relative entropy, you are effectively finding the "center of gravity" of the allowable distributions. Because the Red sector has been compressed (by the 3:1 constraint) and the Blue sector remains expansive (uniform), the center of gravity shifts toward Blue.

  To put it intuitively: Red has become "smaller" in epistemic territory. It is now a more precise, more "ordered" hypothesis. Blue remains "vague" and "disordered." If you have to bet on where you are, and one option (Red) has been revealed to be highly specific while the other (Blue) remains maximally vague, the MaxEnt/MinXent formalism weights the vague option higher. The shift to Blue isn't magic; it's a penalty for Red becoming more specific.

  ### 3. Dismantling the "Only About Red" Intuition

  The intuition driving van Fraassen's objection is: *"The message is conditional on Red. It says nothing about Blue. Therefore, the probability of Red vs. Blue shouldn't change."*

  This intuition fails because it treats probability as a physical fluid in pipes, where blocking one branch doesn't affect the pressure in the other. But probability is a measure of **state of knowledge**.

  Consider this analogy:
  Imagine you are looking for a lost key. You think it's equally likely to be in the Kitchen or the Bedroom (50/50).
  *   **Scenario A:** You search the Kitchen thoroughly and find nothing. You update $P(Kitchen) \to 0$.
  *   **Scenario B:** You receive a tip: "If the key is in the Kitchen, it is definitely in the Drawer (not on the Counter)." You don't search yet.

  In Scenario B, standard intuition says $P(Kitchen)$ stays 50%. But why? The tip has made the "Kitchen" hypothesis more specific. It has ruled out the "Kitchen/Counter" possibility.
  If the tip had been "If the key is in the Kitchen, it is *not* in the Drawer," you would likely lower $P(Kitchen)$ because the Kitchen hypothesis has been constrained/shrunk.
  The Judy Benjamin constraint is softer, but structurally identical. It tells you that the Red hypothesis is *not* the uniform distribution you thought it was; it is a specific 3:1 skewed distribution.

  The "Only About Red" intuition relies on a hidden premise: **The Principle of Irrelevance.** It assumes that learning about the *structure* of a proposition tells you nothing about the *truth* of the proposition. But in a state of ignorance, structure *is* evidence. If I tell you, "I know exactly how the cards are shuffled in Deck A, but I know nothing about Deck B," and I ask you to pick a deck to draw an Ace from, you should prefer Deck B. Why? Because Deck A's constraints might make the Ace harder to find (lower entropy), whereas Deck B is maximally entropic.

  In Judy's case, the "3:1" constraint breaks the symmetry that originally justified the 1:1 Red/Blue odds. The prior 1:1 odds were based on the symmetry that Red and Blue were *equally unknown*. They are no longer equally unknown. Red is partially known; Blue is wholly unknown. To keep the odds 1:1 is to pretend the symmetry still holds. It does not.

  ### 4. Generalization: When Does Evidence Redistribute Credence?

  You asked for a generalization on what licenses an update to redistribute credence over propositions the evidence doesn't explicitly mention.

  **The Rule:** Evidence redistributes credence over a partition whenever it alters the **specificity** (or entropy) of one cell in the partition relative to the others, in the absence of a causal model guaranteeing independence.

  In standard Bayesian updating (Jeffrey's Rule), we usually assume the evidence partitions the space exhaustively and exclusively (e.g., "The light is Red"). In those cases, the "internal structure" of the Red state doesn't change. But in the Judy Benjamin problem, the evidence is a **constraint on the conditional distribution**.

  Whenever you receive a constraint of the form $P(A|B) = k$, you are coupling the marginal $P(B)$ with the joint $P(A \cap B)$. Unless you have an independent reason to fix $P(B)$ (like a physical law or a separate observation), the system must adjust $P(B)$ to accommodate the new joint distribution that minimizes information gain.

  **The Litmus Test:**
  Ask: "Does this evidence make one hypothesis 'sharper' or 'more detailed' than the others?"
  *   If **No** (e.g., "You are not in Red-HQ"), you simply zero out that quadrant and normalize. (This usually preserves Red/Blue odds if the elimination is symmetric).
  *   If **Yes** (e.g., "Within Red, the ratio is 3:1"), you have changed the *texture* of the hypothesis space. The "sharper" hypothesis (Red) loses probability mass to the "blurrier" hypothesis (Blue) because the blurrier hypothesis covers more of the remaining volume of the probability simplex.

  ### Conclusion

  The van Fraassen objection holds sway because it appeals to a causal intuition: "News about the inside of the Red house shouldn't change the value of the Blue house." But Judy isn't valuing houses; she is locating herself in a space of possibilities.

  The MinXent update is correct because it respects the fact that **symmetry is evidence.** The prior 1:1 odds were justified by a symmetry of ignorance. The headquarters' message breaks that symmetry. Red is now "known-unknown" (we know the ratio); Blue is "unknown-unknown" (we know nothing). Rationality demands we favor the state of higher entropy (Blue) when forced to choose between them under a global normalization constraint.

  The rule-designers who pin Judy's credence at 1:1 are not being "conservative"; they are being dogmatic. They are enforcing a constraint ($P_{new}(Red) = P_{old}(Red)$) that amounts to saying, "I assume the internal structure of Red is independent of the probability of Red." That is a substantive claim about the world. Judy has no right to make it. She should take the shift to Blue, accept the counter-intuitiveness, and recognize it as the tax she pays for Red becoming more specific.
