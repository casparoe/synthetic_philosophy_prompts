          *   Step 3: Increase distractions slowly (The 3 D's).
          *   Step 4: Make coming back more rewarding than the bush (Reinforcement value).
          *   Step 5: Emergency recall (optional but good context).
      *   **Safety Warning:** Don't call the dog to you to punish her, and don't call her if you can't enforce it (use a long line).

