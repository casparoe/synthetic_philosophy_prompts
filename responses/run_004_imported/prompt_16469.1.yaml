      *   **Body Paragraph 4: The Tragedy of Rationality.**
          *   Sidgwick represents the limit of Enlightenment rationality.
          *   When reason leads to a dead end (immorality pays), the rationalist seeks a supernatural exit.
          *   This humanizes him but undermines his status as the "perfect thinker."
      *   **Conclusion:**
