      *   *Self-Correction on Rousseau:* Make sure I don't just say "Rousseau said no theater." Say "Rousseau's concern about passivity is relevant to our mission of student engagement."

  6.  **Developing the Argument (The "Why"):**
      *   The school's mission is likely about preparing students for the future/citizenship.
      *   Rousseau's "flower-covered stake" metaphor is about gathering *as* the entertainment, not watching entertainment.
      *   Town Halls fit the "festival" model better than the "proscenium" model.
      *   Drama is great, but is it the *best* use of *discretionary* funds this semester given the philosophical challenge?

  7.  **Final Polish:**
