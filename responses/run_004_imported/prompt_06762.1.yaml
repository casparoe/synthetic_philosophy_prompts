  **Title:** The Work of "We"
  **Occasion:** Naturalization Ceremony Keynote
  **Time:** Approx. 5 Minutes

  Good morning. To the families here, the friends, the children, and especially to the two hundred individuals who will take the oath today: welcome.

  I know the road to this room has been long. I know it involved forms that seemed to speak their own language, waiting periods that tested patience, and a study of history and government that required you to memorize the answers before you'd even had the chance to ask the questions. I know that for many of you, this day is a culmination of a journey that began years ago, perhaps in a different language, under a different flag, or in a place where the idea of standing before a judge to claim rights was not a possibility, but a dream.

  I have been asked to say a few words about what it means to join "the people" of the United States. And I want to be honest with you about that phrase, because it is heavier than it sounds.

  We often speak of "We the People" as if it were a fixed thing. Like a house that was built two hundred and fifty years ago, finished and furnished, and you have simply been handed a key to the front door. It is a comforting image. But it isn't quite true.

  A democracy is not a house. It is a conversation. And the most important question in that conversation—the one that this country has argued over since its very first day—is the question of who gets to speak. Who counts as "we"?

  In my line of work, we study the theory of how democracies decide who belongs. And if there is one thing the theory teaches us, it is that there is no easy, pre-written answer. There is no blood test, no geographic accident, and no historical fact that cleanly draws the line between "us" and "them." That line is not found; it is made. It is drawn by the act of showing up and agreeing to stand together.

  When you take the oath in a few minutes, you are not just walking into a room that was waiting for you. You are helping to build the room.

  This is the secret, and the burden, of American citizenship. The "people" does not exist without you. The boundary of this democracy is not a wall that keeps people out; it is a circle that only holds together if those inside it agree to hold it up. For a long time, that circle was drawn too narrowly. It excluded people based on where they were born, the color of their skin, or the language their grandparents spoke. The history of this country is, in many ways, the history of that circle being contested, stretched, and redrawn.

  Today, you are part of that redrawing.

  This is why I do not want to simply say "welcome to our country." Because after you take that oath, it is no longer *our* country in the sense that it belongs to those who were here before you. It becomes *yours*. And in becoming yours, it changes.

  The lawyers and the court staff here know that the law provides the structure. But the law is just the skeleton. The spirit of the democracy comes from the fact that the definition of "the people" is never truly settled. It is renewed every time someone stands where you are standing.

  So, when you raise your right hand, you are not just promising to obey laws. You are promising to take responsibility for the question of who we are. You are agreeing that the boundary of this nation is defined by commitment, not just by chance.

  There will be days when this feels difficult. There will be times when you hear people speak about this country in ways that feel narrow, or fearful, or as if the "we" should be shrunk back down to something smaller and safer. On those days, remember this morning. Remember that you were not asked to fit into a mold that already existed. You were asked to add your weight, your voice, and your experience to a scale that needs balancing.

  You are not the guests at this ceremony. You are the hosts.

  So, take the oath not as an end to your journey, but as the moment you pick up the tools. The work of defining "the people" is unfinished. We have the Constitution, we have the laws, and we have the ideals. But we do not have the final answer. That answer is written by how we treat one another tomorrow, and the day after.

  Thank you for choosing to make your lives here. Thank you for choosing to make the "we" a little broader, a little stronger, and a little more complex than it was yesterday.

  Welcome to the work.

  ***

  ### Speaker's Notes on the Theory/Practice Balance

  *   **The Boundary Problem:** Notice the speech avoids saying "You are now one of us" (which implies a pre-existing "us"). Instead, it uses: *"The 'people' does not exist without you"* and *"You are helping to build the room."* This aligns with the constitutive view of democracy (the demos is created by the act of constitution) rather than the pre-political view, sidestepping Whelan's regress without naming it.
  *   **The "Circularity":** The speech acknowledges the circularity (*"The question of who gets to speak... is the one question this country never stops asking"*) but frames it as a feature, not a bug. It transforms the theoretical weakness (no objective boundary) into a civic strength (citizenship is an active commitment).
  *   **For the Lawyers/Staff:** Phrases like *"The boundary of this democracy is not a wall... it is a circle that only holds together if those inside it agree to hold it up"* signal that you understand citizenship is a legal and political construct, not an ethnic or metaphysical essence. They will clock that you aren't speaking in nativist platitudes.
  *   **For the Families:** The emotional core remains on *journey, burden, and welcome.* The theoretical honesty is framed as *empowerment* ("You are the hosts") rather than *exclusion* ("There is no objective us").
  *   **Delivery:** Keep the pace slow. When you say, *"It is not a house. It is a conversation,"* pause. Let that land. The warmth comes from the conviction that their presence actually matters to the structure of the state, not just the demographics.
