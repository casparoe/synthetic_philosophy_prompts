answer: |-
  This is a remarkably astute observation. You have identified a tension that lies at the very heart of *The Descent of Man*, one that modern metaethics has only recently rediscovered. Your reading group is correct that Street's dilemma poses a severe problem for moral realists who wish to maintain that moral truths are mind-independent. However, asking how Darwin himself would respond requires us to resist the temptation to cast him as a modern realist or a modern anti-realist. Darwin was a naturalist, and his metaethics (such as it was) was grounded in biological function rather than metaphysical ontology.

  If Sharon Street had presented her dilemma to Darwin in his study at Down House, I believe he would have rejected the terms of the dilemma itself. He would likely have conceded the genealogical premise (the contingency of specific instincts) but denied that this leads to skepticism, because he did not hold the view of "independent evaluative truths" that Street's dilemma targets.

  Here is a reconstruction of Darwin's response, grounded in Chapter Four of *The Descent of Man*.

  ### 1. The Concession: Specific Duties are Contingent
  Darwin would begin by agreeing with Street's premise regarding the origins of our specific moral intuitions. The hive-bee passage you cited is the crucial evidence here. Darwin writes:

  > "If men were reared under precisely the same conditions as hive-bees, there can hardly be a doubt that our unmarried females would, like the worker-bees, think it a sacred duty to kill their brothers, and mothers would strive to kill their fertile daughters; and no one would think of interfering." (*Descent*, Vol I, p. 72)

  Darwin explicitly grants that the *content* of our moral obligations is contingent upon the social structure and reproductive strategy of the species. If Street's argument is that evolutionary history does not guarantee the validity of specific, culturally variable moral codes, Darwin would say: "Precisely." He is not a realist about the specific injunctions of Victorian morality, nor about the specific duties of a hypothetical bee-man. He acknowledges that natural selection shapes the social instincts to fit the ecological and social niche of the organism.

  On this point, Darwin accepts the first horn of Street's dilemma: there is no relationship between evolutionary forces and *mind-independent* moral truths, because Darwin does not believe in mind-independent moral truths in the Platonic sense Street attacks.

  ### 2. The Rejection: Normativity Grounded in Social Welfare
  However, Darwin would stop short of Street's anti-realist conclusion (that we must abandon the idea of moral truth or validity). Street assumes that if morality is evolved, it cannot track truth unless that truth is independent of the evolutionary process. Darwin's view is that moral "truth" is *constituted* by the welfare of the community, which is exactly what evolution (specifically group selection) tracks.

  Darwin is explicit about the standard of value. He writes:

  > "I have called this principle [the greatest happiness principle] a standard of conduct... it is applicable to all actions of man, whether regarding his own happiness or that of others." (*Descent*, Vol I, p. 73)

  For Darwin, the "truth" of a moral judgment is not its correspondence to a non-natural property, but its conduciveness to the survival and flourishing of the tribe. In Chapter 5, he argues that tribes with high moral standards (courage, sympathy, fidelity) would "conquer" other tribes. Thus, there *is* a tracking relationship, but the "truth" being tracked is naturalistic: it is the truth about what allows a social species to persist.

  To Street's claim that fitness and truth come apart, Darwin would reply that in the domain of social ethics, fitness *is* the truth condition. A moral belief is "correct" insofar as it promotes the endurance of the social group. This is not a "pre-established harmony" between fitness and Platonist value; it is an identity claim between biological success and moral validity within a naturalistic framework.

  ### 3. The Mechanism: Reason as the Filter
  This is where Darwin offers a resource that Street's dilemma often overlooks, and it is central to your observation about the "greatest-happiness standard." Street focuses heavily on the *origins* of evaluative attitudes (the instincts). Darwin, however, places equal weight on the *intellectual powers* that refine those instincts.

  Darwin argues that the moral sense arises from the confluence of three things:
  1.  Social Instincts (sympathy).
  2.  Intellectual Powers (memory, comparison).
  3.  Habit.

  Crucially, Darwin notes that instincts can be misguided or too narrow. He writes that the "improvement" of morality comes when reason allows us to reflect on our past actions and compare them with the approval or disapproval of the community.

  > "As man advances in civilisation, and small tribes are united into larger communities, the simplest reason would tell each individual that he ought to extend his social instincts and sympathies to all the members of the same nation, though personally unknown to him." (*Descent*, Vol I, p. 73)

  Darwin's response to the skeptical worry would be this: Evolution gave us the *raw material* (sympathy), which is indeed contingent. But it also gave us *reason*. Reason allows us to critique our evolved instincts against the standard of general happiness.

  If our evolved instinct is to favor only our kin (which is fitness-enhancing), reason can reveal that this is arbitrary if the goal is the "greatest happiness." Darwin believes that as intellectual powers develop, the moral sense *necessarily* expands. This is not because reason discovers independent truths, but because the logic of sympathy, when generalized by intelligence, pushes toward inclusivity.

  Therefore, Darwin would argue that we are not stuck with the "accidents" of our lineage. We have a cognitive tool (reason) that allows us to override the specific fitness-maximizing instructions of our genes (e.g., nepotism) in favor of a more stable, rational standard (general welfare).

  ### 4. The Third Option: Naturalistic Moral Progress
  You asked if there is a third option. Darwin's position effectively constitutes a third option: **Naturalistic Moral Progressivism.**

  Street's dilemma forces a choice between:
  1.  Skepticism (Evolution didn't track truth).
  2.  Realist Tracking (Evolution tracked independent truth).

  Darwin proposes:
  3.  **Constructive Naturalism:** Evolution tracked *social cohesion*, and human reason subsequently constructs a moral standard (greatest happiness) that refines those instincts. The "validity" of this standard is not metaphysical but functional and rational.

  Darwin would likely find Street's worry about "independent truths" to be a metaphysical distraction. In *The Descent*, he treats the moral sense as a real, observable natural phenomenon, like the wing of a bird. We do not ask if the wing corresponds to an "independent truth of flight"; we ask if it allows the bird to fly. Similarly, we do not ask if our moral sense corresponds to a Platonic Good; we ask if it allows the community to flourish and if it is consistent with our reasoned understanding of sympathy.

  He writes with confidence:
  > "Looking to future generations, there is no cause to fear that the social instincts will grow weaker, and we may expect that virtuous habits will grow stronger... The moral qualities advance, both directly and indirectly, much more through the effects of habit, the reasoning powers, instruction, religion, &c., than through natural selection." (*Descent*, Vol I, p. 75)

  Note the distinction: Natural selection gave us the *instinct*, but reason and habit drive the *progress*. This breaks the link Street tries to forge between evolutionary origin and current justification. For Darwin, the justification for our current morality lies not in its evolutionary origin (which he admits is contingent), but in its rational refinement toward the greatest happiness.

  ### Conclusion: Darwin's Verdict
  If you pressed Darwin on whether the hive-bee scenario undermines the objective validity of human morality, he would likely respond:

  "It undermines the idea that our *specific duties* are written in the stars. But it does not undermine the validity of the *principle* by which we judge those duties. We are social animals. Our good lies in the welfare of our community. Reason shows us that the welfare of the community is maximized when sympathy is extended as widely as possible. This is not a truth independent of our nature; it is a truth *about* our nature. Street's dilemma assumes we need a god's-eye view to validate our morals. I propose we only need the view of a rational social animal."

  Darwin would concede that he is not a Realist in the sense Street defines (believing in mind-independent values). But he would deny that this forces him into skepticism. He occupies a space Street's dilemma often neglects: the view that moral truth is objective *relative to the form of life*, and that reason allows us to approximate that truth better than blind selection ever could. He would view the "greatest happiness principle" not as a discovered metaphysical entity, but as the inevitable conclusion of a social animal reflecting on its own instincts.

  In short, Darwin would tell Street that she has posed a false dichotomy. One can acknowledge the evolutionary contingency of moral instincts without abandoning the rational validity of moral progress, provided one grounds that validity in the natural facts of social existence rather than in a supernatural moral order.
