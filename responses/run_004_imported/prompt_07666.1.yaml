answer: |-
  The oil in the brass basin was cold, thick, and dark. Yusuf dipped the linen wick, watching the fibers drink until they were heavy. He was a keeper of the lamps in the Great Mosque of Baghdad, and a student of the *kalam* in the mornings. He knew the arguments. He knew that the philosophers spoke of nature as a chain, iron link biting iron link, where fire *must* burn cotton because it is in the nature of fire to burn.

  But Yusuf also knew the words of al-Ghazali. *Fire has no agency.* The burning is not in the fire; it is in the Will. What we call necessity is only the Habit of God, so consistent it deceives the eye into seeing a law.

  It was the hour of Maghrib. The sun had slipped behind the minarets, leaving the sky a bruised purple. Yusuf climbed the spiral stair of the northern minaret, carrying his tray of flint and steel. The air grew cooler as he ascended. He reached the gallery, set down his tray, and struck the steel against the stone.

  A spark caught the tinder. A small flame bloomed, orange and alive.

  Yusuf brought the flame to the first wick. He lowered it slowly. He watched the point where the fire would meet the oil-soaked linen. He waited for the necessary consequence.

  The fire touched the wick. It sat there. It did not catch.

  Yusuf froze. He held his breath. The flame licked the linen, dancing around the fibers, but the cotton remained dark. There was no blackening, no smoke, no spread of the burn. It was as if he were touching the wick with a painting of fire rather than the thing itself.

  He knew the theories of wetness, of impurity. He checked the oil. It was fresh. He checked the wind. There was none. He looked at the flame. It burned his other hand when he moved it too close. The fire was real. The cotton was real. The connection was missing.

  For a heartbeat, the world did not refresh.

  Yusuf felt a vertigo that had nothing to do with the height. He was standing inside the gap. He was witnessing the seam between one moment of creation and the next. The philosophers said the effect follows the cause as night follows day. But Yusuf was holding the day in his hand, and the night refused to come.

  He understood, suddenly and violently, that the fire had never had power. Not yesterday, not last year. The burning he had seen a thousand times before was not a property of the flame; it was a promise kept. And now, for this singular, silent second, the Promise had paused.

  He lowered the flame again. *Burn,* he thought. Not a command, but a plea.

  The cotton caught. The blackness spread rapidly, the oil ignited, and the heat struck his fingers. Yusuf dropped the taper into the lamp housing and stepped back, his heart hammering against his ribs like a trapped bird.

  He looked out over the city. The lights of Baghdad were flickering on, thousands of them. Each one was a negotiation. Each one was a distinct act of creation. There was no machinery here. There was no engine of nature grinding away in the dark. There was only this: a sequence of images, held together by nothing but Consistency.

  If the Habit could slip here, it could slip anywhere. Gravity was a habit. The solidity of the stone beneath his feet was a habit. The air filling his lungs was a habit. Nothing held itself together. Nothing held anything else together. The world was a cascade of discrete events, loosely strung like beads on a thread that could be cut at any moment.

  A terrible freedom opened up in his chest. If there is no necessity, then there is no impossibility. If fire does not burn by nature, then perhaps it need not burn at all. Perhaps he could walk into the furnace and emerge cool. Perhaps he could step off the minaret and find the air solid as glass.

  He looked at his hand. He held it over the newly lit lamp. The heat radiated upward. It was the heat of obedience.

  He realized then that the miracle was not the anomaly. The miracle was the routine.

  To demand the habit break was to demand the world unravel. If fire ceased to burn cotton, bread would cease to nourish, and water would cease to quench. The Habit was not a prison; it was a mercy. It was the only thing that allowed a man to plan, to love, to build. A world of pure miracle was a world of chaos, where no expectation could survive the blink of an eye.

  Yusuf looked at the flint in his hand. He could strike it again. He could try to find the seam again. He could become a man who tested the walls of reality, poking holes in the fabric of the Habit to see what lay behind. He could become a saint, or a madman.

  He thought of the philosophers in their schools, drawing diagrams of cause and effect, binding God to His creation with chains of logic. They wanted a world that ran itself, a clockwork universe where the Maker was not needed for every tick. They wanted safety.

  But this… this trembling contingency was heavier. It required a constant attention. To live here was to know that every breath was a gift renewed, not a debt paid.

  Yusuf took a deep breath. The air entered his lungs. It was not automatic. It was given.

  He picked up the tray and moved to the next lamp. His hands were steady now. He struck the steel. The spark flew. He touched the flame to the wick.

  He watched the moment of contact. He knew now that the burning was not in the fire. He knew the cotton had no power to resist, and the flame had no power to consume. He was watching the Will move across the surface of the world like light across water.

  The wick caught. The flame steadied.

  Yusuf did not try to walk on air. He did not try to hold the fire without pain. He understood that to exploit the seam was to reject the language of the world. He was not meant to speak in miracles; he was meant to speak in habits.

  He lit the third lamp, and the fourth. Below him, the city hummed with the sound of a million causes producing a million effects, a great symphony of coincidences held together by faith.

  When he descended the stairs, the night had fully taken hold. He walked through the courtyard, where a fountain spilled water into a basin. He stopped and placed his hand in the stream. The water flowed over his skin, cool and wet. It did not have to be so. It could have been dry dust. It could have been fire.

  He withdrew his hand and dried it on his robe. He would light the rest of the lamps tomorrow. He would eat bread, and it would nourish him. He would sleep, and he would wake. He would live inside the Habit, not because it was law, but because it was a covenant.

  Yusuf walked into the shadows of the arcade, careful where he placed his feet, knowing that the ground was there only because it was chosen to be there, again and again, all the way home.
