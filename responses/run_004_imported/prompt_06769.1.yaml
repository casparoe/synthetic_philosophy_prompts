  2.  **Deconstruct the Philosophical Positions:**
      *   **Nozick/ET:** Justice is historical. If the starting position is just ($D_1$) and transfers are voluntary, the resulting position ($D_2$) is just. Interfering with $D_2$ violates liberty. Taxation of earnings from labor is akin to forced labor. To maintain a pattern, you must continuously interfere with people's choices.
      *   **Patterned/PT:** Justice is about the structure of society, not just individual transactions. Unchecked accumulation undermines the background conditions of equality/liberty. Taxation isn't theft; it's a pre-condition for a functioning society. The distinction lies in *ex ante* prohibition vs. *ex post* adjustment. One respects agency in the moment; the other ensures the system remains fair over time.

  3.  **Drafting - Scene Setting:**
      *   Needs to be intimate but intellectual. A quiet bar or office after the game? Let's go with a quiet lounge overlooking the empty arena. It adds atmosphere.
      *   Names: Let's keep them generic but indicative. "Robert" (for Nozick) and "John" (for Rawls/Patterned)? No, too on the nose. Let's use "Elena" (Entitlement) and "Marcus" (Patterned).

  4.  **Developing the Argument Flow:**
