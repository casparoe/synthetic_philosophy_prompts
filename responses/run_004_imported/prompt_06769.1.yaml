      *   **Context:** The aftermath of the Wilt Chamberlain scenario (from *Anarchy, State, and Utopia*).
      *   **Characters:**
          *   *Entitlement Theorist (ET):* Defends Nozick. Argues that reversing the outcome is equivalent to banning the payments. Focuses on liberty and voluntary exchange.
          *   *Patterned Theorist (PT):* Defends patterned justice (e.g., Rawls, Dworkin, Cohen). Argues that taxing the outcome is distinct from and more defensible than banning the transaction. Focuses on fairness, social structure, and the meaning of liberty.
      *   **Key Conflict:** The distinction between *taxing an outcome* vs. *banning the transaction*.
