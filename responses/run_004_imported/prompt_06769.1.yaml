      *   *Round 2:* The Equivalence Claim. Elena: Taxing = Banning. Marcus: No, *ex post* vs. *ex ante*.
      *   *Round 3:* The Nature of Liberty. Elena: You own yourself. Marcus: You exist in a society.
      *   *Round 4:* The Weight of the Distinction. Does it hold?
      *   *Conclusion:* Acknowledging the fundamental divide.

  7.  **Polishing:**
