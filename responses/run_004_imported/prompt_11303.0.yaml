answer: |-
  This is one of the most famous and frustrating puzzles in cognitive science and philosophy of mind. You have stumbled onto a phenomenon often called **"highway hypnosis"** or **"driving without attention,"** and your intuition is correct: the reason your argument went nowhere is that the word "conscious" is doing too much heavy lifting.

  To answer your question directly: **There is likely no single "fact of the matter"** about whether you were conscious, because consciousness is not a single on/off switch. It is a collection of different systems that can be decoupled.

  Here is the breakdown of why this is hard, based on how we currently understand attention, memory, and awareness, without resorting to "the brain is mysterious."

  ### 1. The Split Between "Doing" and "Knowing"
  Your friend who said, "You can't steer unless your brain is taking in what your eyes are seeing," is right about the *processing*, but wrong about the *experience*.

  Neuroscience distinguishes between two visual pathways:
  *   **The Ventral Stream ("What"):** This handles object recognition and conscious perception. It's what allows you to look at a tree and say, "That is a tree."
  *   **The Dorsal Stream ("Where/How"):** This handles spatial location and motor guidance. It allows your hand to reach out and grab a cup without you consciously calculating the trajectory.

  In your 10-minute gap, your **Dorsal Stream** was fully online. It was receiving visual data, calculating lane position, detecting the brake lights of the car ahead, and adjusting your steering. This is why you didn't crash. However, your **Ventral Stream** (and the memory systems linked to it) was dampened.

  So, were you conscious?
  *   If consciousness means **sensory processing for action**: **Yes.**
  *   If consciousness means **sensory processing for perception/report**: **No.**

  ### 2. The Memory Problem (Episodic vs. Procedural)
  The reason you feel like you "weren't there" is that you have no **episodic memory** of the event. Episodic memory is the "I was there" memory that the hippocampus encodes.

  However, you were using **procedural memory**. This is the same system you use when you walk, chew, or ride a bike. When a task becomes highly automated (or the environment is highly predictable, like a boring highway), the brain shifts control from the prefrontal cortex (active decision making) to the basal ganglia (habit and routine).

  The brain does this to save energy. If you consciously processed every micro-adjustment of the steering wheel for 10 minutes, you would be cognitively exhausted.

  The "blankness" you feel isn't necessarily proof that you weren't conscious *in the moment*; it's proof that the experience wasn't **encoded**. Think of it like writing a document in RAM but forgetting to hit "Save" before the computer crashes. The work was done on the screen, but there is no file left on the hard drive.

  This creates the philosophical deadlock:
  *   **Friend 1 (Sleepwalking):** They are wrong. Sleepwalkers are in a different neurochemical state (slow-wave sleep). You were awake and alert enough to react to hazards.
  *   **Friend 2 (Skill requires consciousness):** They are wrong. High-level skill often requires the *absence* of conscious interference. Think of a pianist playing a scale perfectly while thinking about dinner.
  *   **Friend 3 (Question doesn't make sense):** They are the closest to the truth.

  ### 3. Phenomenal vs. Access Consciousness
  Philosophers like Ned Block distinguish between two types of consciousness that help explain your situation:

  1.  **Phenomenal Consciousness:** The raw "feeling" of experience. The redness of the taillights, the hum of the engine. Did it *feel like something* to be you in that moment?
  2.  **Access Consciousness:** The ability to retrieve that information for reasoning, reporting, or memory.

  In your case, your **Access Consciousness** was offline (you can't report what happened). But your **Phenomenal Consciousness** is the grey area.

  Some theories suggest that without attention, there is no phenomenal experience. This is called the **Attention Schema Theory**. It argues that if you didn't pay attention to the road, you didn't experience the road. Your brain was processing the data, but no "user" was logged in to see it.

  Other theories argue that you *did* experience it, but the memory trace decayed instantly. This is harder to prove, but it aligns with the feeling of "waking up." Usually, when you "snap back," you realize you *were* seeing the road, you just stopped narrating it.

  ### 4. Why There Is No "Fact of the Matter"
  You asked if there is an actual fact about whether you were conscious. The problem is that "consciousness" is a **folk psychological term**, not a precise scientific measurement.

  If we defined consciousness strictly as "the ability to form a memory of the event," then the fact is **No, you were not conscious.**
  If we define consciousness as "the brain successfully reacting to novel stimuli in real-time," then the fact is **Yes, you were conscious.**

  Because we don't have a unified theory of consciousness, we can't measure "amount of consciousness" like we measure temperature. We can measure attention (via reaction times), arousal (via heart rate/EEG), and memory (via recall), but "consciousness" is the label we slap on the combination of those things. When those things dissociate (as they did in your car), the label breaks.

  ### The Verdict
  You weren't "unconscious" like you are under anesthesia, and you weren't "fully conscious" like you are during a driving test. You were in a **dissociated state of automaticity.**

  Your brain was running a "background process" that was fully capable of driving the car, but the "foreground process" (the part that creates your sense of self and narrative memory) was idling.

  **Is the question a real yes-or-no?**
  No. It's like asking, "Is a self-driving car *really* driving?"
  *   Mechanically? Yes.
  *   Legally/Morally? It depends on who you ask.

  **A Note on Safety:**
  While this is a normal cognitive phenomenon for experienced drivers on monotonous roads, as a learner with a permit, you should be wary. Highway hypnosis relies on predictability. If a deer jumps out or a car swerves unexpectedly during that "gap," your reaction time will be significantly slower because your brain has to switch from "automatic" back to "manual" control. That switch takes time.

  So, to answer your itch: You aren't crazy, your friends aren't crazy, but the word "conscious" is too blunt a tool to cut this specific slice of reality. You were driving, but "you" (the narrating self) took a break.
