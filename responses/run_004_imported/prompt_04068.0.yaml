      *   The Argument: $D$ (Disposition) is the common factor. $A$ (Action) is the symptom. $O$ (Other's Action) is the outcome. $D$ screens $A$ from $O$.
      *   The ECL Reply: Logical correlation isn't causal. $A$ *is* the evidence, not a symptom of $D$.
      *   The Rebuttal:
