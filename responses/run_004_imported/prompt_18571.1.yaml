answer: |-
  **Setting:** *A timeless courtyard, shaded by pomegranate trees. The air is still. AL-GHAZĀLĪ sits on a woven mat, holding a tuft of raw cotton. AVERROES sits opposite him, a stack of Aristotelian commentaries resting beside a cup of water. The sun is low, casting long shadows.*

  **AL-GHAZĀLĪ:** *(Holding the cotton near a small oil lamp)* Tell me, Abū al-Walīd. When I bring this flame to the cotton, and the cotton turns to ash, what have your eyes witnessed?

  **AVERROES:** I witness the action of a nature fulfilling its end. The fire burns, and the cotton is consumed. This is the observation of the physicist and the certainty of the metaphysician.

  **AL-GHAZĀLĪ:** Your eyes witness the *contact* of the fire and the cotton. They witness the *sequence*: the touch, then the blackening, then the ash. But do your eyes witness a "connection" (*rabṭ*) between them? Do they see the power of burning flow from the flame into the fiber like water into a cup?

  **AVERROES:** We do not need to see the flow to know the source. To deny the flow is to deny the vessel itself.

  **AL-GHAZĀLĪ:** Precisely. We see the conjunction (*ittisāl*), but we do not see the necessity. It is not a logical contradiction to imagine fire touching cotton and the cotton remaining white and whole. The mind can conceive it without absurdity. Therefore, the connection is not necessary by virtue of the things themselves. If it were necessary, God could not prevent it without changing the definition of fire.

  **AVERROES:** *(Leaning forward)* Here is where you sever the root of knowledge, Abū Ḥāmid. You treat the nature of fire as if it were a habit God adopts, rather than what fire *is*. If burning does not belong to fire by its very essence (*dhāt*), then "fire" has no definition. If you remove the power to burn from fire, and the power to be burned from cotton, you have emptied the world of natures. You are left with names attached to shadows.

  **AL-GHAZĀLĪ:** I empty nothing. I fill the world with the continuous will of God. The fire does not burn; God creates the burning at the moment the fire touches the cotton. He does this in a sequence that is steady, which we call "Custom" (*ʿādah*). The bread satisfies hunger not because bread has power, but because God creates satiety at the moment of eating. This Custom is stable enough for life, for agriculture, for medicine. But it is not a chain that binds the Creator.

  **AVERROES:** But consider what this does to science (*ʿilm*). Science is the knowledge of things through their causes. If the fire is not the cause of the burning, but merely an occasion for God to act, then we have no knowledge of the world. We only have knowledge of God's habits. And habits can change. If I study the nature of fire, I learn nothing of the future, only of the past patterns of the Divine Will. This makes demonstration (*burhān*) impossible. There can be no middle term in a syllogism if the connection between subject and predicate is not necessary.

  **AL-GHAZĀLĪ:** The necessity lies in God's knowledge, not in the objects. God knows He will burn the cotton, and He usually wills it so. But He *can* will otherwise. And this, my friend, is the heart of the matter. If you grant inherent necessity to fire, you make miracles impossible.

  **AVERROES:** Miracles are not impossible. They are simply exceptions to the general rule, brought about by a higher cause.

  **AL-GHAZĀLĪ:** No. If fire burns by its own nature, then when Ibrāhīm (Abraham) was cast into the furnace, either the fire ceased to be fire, or the story is a metaphor. The Philosophers are forced to say the fire remained fire but was "cooled" by an accident. But I say: The fire remained fire, but the Agent of the burning is One. God simply chose, at that moment, to break His Custom to show His Power. If the fire possesses the power of burning inherently, then God cannot stop it without destroying the fire. You have made nature a partner to God, possessing its own sovereignty.

  **AVERROES:** *(Shaking his head slowly)* You mistake the hierarchy of causes for a partnership. The sun gives light, but it does not give light independently of the First Principle. The fire burns, but it burns as an instrument of the First Agent. To deny the instrument is to insult the Craftsman. Does a carpenter's saw cut wood? Yes. If you say, "No, the carpenter cuts the wood, the saw is merely an occasion," you speak truly in one sense, but falsely in another. You deny the reality of the saw.

  **AL-GHAZĀLĪ:** The saw has no will. It is dead matter.

  **AVERROES:** And yet it has a form! And that form dictates its function. This is not a limitation on God; it is a perfection of His creation. God is wise (*Ḥakīm*). Wisdom implies doing things in the best order. To create a world where causes truly produce effects is more perfect than a world where God micromanages every atom of ash at every moment. The latter makes the world a puppet show. The former makes it a cosmos—a rational order that reflects the Divine Intellect. When you deny secondary causes, you deny that the universe is intelligible in itself. You make it intelligible only by reference to a Will that we cannot scrutinize.

  **AL-GHAZĀLĪ:** And when you affirm secondary causes as necessary, you deny that the universe is contingent upon a Will that we must worship. You make it intelligible by reference to a Logic that even God must follow. Tell me, if the nature of fire *must* burn, is God able to create a fire that cools?

  **AVERROES:** God can create a substance with a cooling nature. But He cannot make "fire" not burn while it remains "fire," because that is a contradiction in terms, like making a triangle have four sides. Logic is not a chain on God's neck; it is the structure of His own Wisdom.

  **AL-GHAZĀLĪ:** There it is. You bind God to Logic. I submit Logic to God. For me, "fire" is merely a name we give to a substance that usually burns. If God wills it to cool, it is still fire, because its existence depends on His Will, not its definition. Your "intelligibility" requires that God cannot act against the nature of things. My "intelligibility" requires that we understand things as signs (*āyāt*) pointing to the Actor, not as actors themselves.

  **AVERROES:** But if they are not actors, how do we distinguish truth from illusion? If I take poison, and I die, you say the poison did not kill me; God created death in me. If I take an antidote, and I live, the antidote did not save me; God created life. Then medicine is a lie. The physician does not heal; he merely waves his hands while God decides.

  **AL-GHAZĀLĪ:** Medicine is not a lie. It is the knowledge of God's Custom. God has ordained that taking poison is *usually* followed by death, and taking antidotes by life. The physician is one who knows the Custom of God. He is not powerless. But he must not believe the antidote has power in itself. If he believes that, he is an idolater of substances.

  **AVERROES:** *(Sighs)* We are circling the same well, Abū Ḥāmid. You fear that affirming nature limits Divine Power (*Qudra*). I fear that denying nature limits Divine Wisdom (*Ḥikma*).

  **AL-GHAZĀLĪ:** Precisely.

  **AVERROES:** If I concede your point, the world loses its stability. It becomes a sequence of discrete moments held together only by a habit that could vanish in an instant. Science becomes impossible, not because we lack data, but because there are no necessary connections to discover. The definition of a thing becomes nothing more than a label for a cluster of events.

  **AL-GHAZĀLĪ:** And if I concede yours, the world becomes a machine that even God cannot stop. The miracle becomes a violation of essence, which is absurd. Prophecy becomes merely a higher form of natural knowledge, rather than a direct intervention of the Divine Will.

  **AVERROES:** So, where does the dispute rest? It is not about observation. We both see the cotton burn.

  **AL-GHAZĀLĪ:** No. It rests on what we believe observation *can* reach. You believe the mind can penetrate the substance and grasp a necessary power within it. I believe the mind sees only succession, and the power is known only by revelation.

  **AVERROES:** It rests on the priority of the Divine Attributes. For you, Will is primary. Wisdom is the arrangement of the Will. For me, Wisdom is primary. Will is the execution of Wisdom. If God's Wisdom dictates an order of causes, His Will does not act against it without a higher wisdom we may not see.

  **AL-GHAZĀLĪ:** *(Nods slowly)* Yes. You seek to protect the rationality of the Cosmos. I seek to protect the Sovereignty of the Creator. You fear that without necessary connections, the universe is unintelligible. I fear that *with* necessary connections, the universe is independent.

  **AVERROES:** Then we agree on the point of divergence. We do not disagree on the cotton. We disagree on whether the cotton's burning is a testament to the consistency of Nature or the consistency of God's Habit.

  **AL-GHAZĀLĪ:** And whether "consistency" implies a power residing in the thing, or a promise residing in the Agent.

  **AVERROES:** *(Picks up his commentary)* I cannot accept that the world is a shadow play. It diminishes the glory of the Art to deny the reality of the tools.

  **AL-GHAZĀLĪ:** *(Gently places the cotton down)* And I cannot accept that the tools have power. It diminishes the glory of the Artist to suggest He needs them.

  **AVERROES:** Then the sun sets, and we remain as we were. You with your Custom, I with my Nature.

  **AL-GHAZĀLĪ:** But we know now why the other will not yield. You cannot yield without making God subject to Logic. I cannot yield without making Logic subject to God.

  **AVERROES:** *(Stands)* That is a foundation solid enough to end an argument, even if it does not resolve it. Peace be upon you, Abū Ḥāmid.

  **AL-GHAZĀLĪ:** And upon you, Abū al-Walīd. May God grant us both sight of the Truth, whether through the book of Nature or the book of Signs.

  *(Averroes gathers his texts. Al-Ghazālī watches the flame flicker, neither touching the cotton nor removing it.)*
