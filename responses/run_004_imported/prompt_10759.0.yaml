answer: |-
  This is one of the oldest debates in poker: **GTO (Game Theory Optimal/Math) vs. Exploitative Play (Reads/Intuition).**

  You are both partially right, but one of you is holding the stronger hand in this specific argument. Here is the principled framework to settle the bet, break down why "gut" isn't magic, and determine who actually wins this tiebreaker.

  ### 1. The Math Reality Check
  First, we have to address the "80% favorite" claim. In poker, equity is king.
  *   If you truly have 80% equity, you are mathematically required to get money in the middle almost every time.
  *   To justify folding 80% equity, the pot odds would have to be astronomical (e.g., risking your life savings to win a coffee), or the risk of ruin must be a factor (tournament survival). In a cash game, folding 80% equity is a **massive negative EV (Expected Value) play.**

  **Your Point:** You are right that ignoring a clean number for a "vibe" is dangerous. Math is the baseline. If you deviate from math without a specific reason, you are burning money over the long run.

  ### 2. The "Gut" Reality Check
  Jake is right that poker isn't played in a vacuum. "Gut feeling" is not magic; it is **subconscious pattern recognition.**
  *   Experienced players process data faster than they can articulate. They notice bet-sizing timing, physical tells, or deviations from an opponent's standard strategy.
  *   If Jake's read is accurate, it means his assessment of the opponent's *range* is more accurate than the raw card odds.
  *   **Example:** The board says you have a set (80% favorite vs. a flush draw). But your "gut" tells you the opponent isn't drawing; they have a higher set. If that read is true, your equity isn't 80%; it's 0%.

  **Jake's Point:** He is right that rigid adherence to math without context is "dumb." If you know an opponent *only* bluffs 1% of the time, you fold top pair even if the math says they could be bluffing.

  ### 3. The Tiebreaker: The 3-Point Calibration Test
  To decide if Jake's fold was principled or rationalized, apply these three criteria. A "hunch" only earns the right to override math if it passes this test:

  **A. Specificity (The "Why" Test)**
  *   **Fail:** "He just looked strong." / "I had a bad vibe." / "He stared at me too long."
  *   **Pass:** "He bet 3x the pot on the turn, but he only do that with the nuts." / "His hand shook when he raised, which he only does when he's scared."
  *   *Verdict:* If Jake cannot articulate the specific trigger for the read, it was a guess. **Point to You.**

  **B. Range Narrowing (The "What" Test)**
  *   A valid read must narrow the opponent's hand range to hands that actually beat you.
  *   If Jake's gut said "He has me beat," but the only hands that beat him are statistically impossible given the betting action, the gut is wrong.
  *   *Verdict:* If the opponent's betting line didn't make sense for the hands that beat Jake, the fold was a mistake. **Point to You.**

  **C. Calibration (The "History" Test)**
  *   Jake claims his reads hit "way more often than random chance." Does he have proof?
  *   Most humans suffer from **Confirmation Bias**. We remember the heroic folds where we were right and forget the times we folded the winner because we were "scared."
  *   *Verdict:* Unless Jake tracks his reads (mentally or in notes) and knows his accuracy rate is above 60-70%, he is overestimating his skill. **Point to You.**

  ### 4. The "Rationalization" Trap
  You asked if "trust your gut" is just a license to rationalize. **Yes, usually.**
  In poker psychology, this is called "Resulting" or "Fear-Based Folding."
  *   When a player is tired, tilted, or scared of losing a big pot, the brain manufactures a "gut feeling" to justify folding and avoiding the pain of a bad beat.
  *   Folding an 80% favorite feels like "being smart" when you win, but it feels like "being a coward" when you see the opponent's bluff.
  *   **Principled Play:** You play the odds unless you have **concrete evidence** (betting patterns, physical tells, history) that the odds calculation is based on a false premise.

  ### The Final Verdict

  **You win the argument, but Jake wins a partial concession.**

  **Why You Win:**
  In a vacuum, folding 80% equity is objectively incorrect. The burden of proof is on the person deviating from the math. Unless Jake can prove his read was based on specific, repeatable data (not a "vibe"), he made a -EV play. Over 1,000 hands, folding 80% favorites based on hunches will bankrupt a player.

  **The Concession for Jake:**
  Jake is right that *blindly* following math without observing the opponent is also a leak. The best players use math as the baseline and use reads to *adjust* the variables.
  *   **The Rule:** You trust the math until the read gives you a specific reason to change the opponent's range.
  *   **The Exception:** If Jake can show you a specific tell or betting pattern that historically indicates the nuts for *that specific opponent*, then the 80% calculation was wrong because the inputs were wrong.

  **Settlement Suggestion:**
  Tell Jake: *"I'll concede that reads matter, but only if they're articulable. Next time you make a hero fold, you have to write down exactly what triggered it. If you can't explain it in one sentence, you owe me a beer. If you can, and you're right, I owe you one."*

  This forces him to move from "vibes" to "data," which is the only way a hunch becomes a strategy.
