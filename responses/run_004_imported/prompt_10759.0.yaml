      *   *The "Read":* A "read" isn't magic; it's subconscious pattern recognition. It *can* be valid, but it's prone to cognitive bias (confirmation bias, recency bias).
      *   *Expected Value (EV):* Poker is about maximizing EV. If the read is accurate enough to shift the win probability from 80% to <50% (assuming pot odds justify a call), then the fold is correct. If the read only shifts it to 60%, the call is correct.
