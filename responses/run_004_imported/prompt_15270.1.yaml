  **Justifications:**

  *   **Move 1 (Maya): 2.** This is a precise, textbook definition of illusionism (specifically the Frankish variant). It correctly identifies the core claim: that phenomenal properties are introspective misrepresentations of functional states, not intrinsic features of the world.
  *   **Move 2 (Theo): 2.** This is the standard and strongest objection to illusionism (often called the "illusion of what?" argument). It correctly identifies that an illusion is itself a conscious experience; denying the reality of the *content* of the illusion does not explain the reality of the *seeming* itself.
  *   **Move 3 (Maya): 1.** The Müller-Lyer analogy is the standard defense (used by Dennett and Frankish). It is a coherent move within the illusionist framework, but it is vulnerable because visual illusions presuppose a subject to whom things seem a certain way, which is precisely what is in question regarding introspection.
  *   **Move 4 (Theo): 2.** This is a penetrating objection. It distinguishes between mere functional misrepresentation (a thermostat registering incorrectly) and phenomenal misrepresentation (a subject *feeling* fooled). It highlights that illusionism must explain the *subjectivity* of the error, not just the error itself.
  *   **Move 5 (Maya): 0.** This move is dialectically neutral. While it accurately states the functionalist axiom underlying illusionism, as a reply to Theo's Move 4, it is stipulative. Theo asks *why* global access feels like something; Maya replies that "feeling" just *is* global access. This asserts her framework rather than arguing for it against Theo's distinction, resulting in a stalemate.

  **What Both Are Missing:**

  1.  **The Access/Phenomenal Distinction:** The debate hinges on Ned Block's distinction between *access consciousness* (reportability/integration) and *phenomenal consciousness* (raw feel). Maya conflates them in Move 5; Theo assumes they come apart in Move 4. Neither explicitly names this fault line.
  2.  **The Phenomenal Concept Strategy:** Both skip a popular middle ground: that physicalism is true, but we possess unique "phenomenal concepts" that make physical states *seem* ineffable. This could accommodate Theo's intuition about the "seeming" without requiring Maya's error theory.
  3.  **The Hard Problem of Illusionism:** Neither addresses the meta-problem: how a purely physical system can be *under an illusion* at all. If there is no phenomenal consciousness, there is no one to be fooled, which risks making the illusion itself impossible rather than just explaining it away.
