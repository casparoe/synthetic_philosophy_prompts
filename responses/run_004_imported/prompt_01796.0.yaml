          *   Explain the "Intelligibility" criterion. For Bradley, if $A$ and $B$ are distinct, their connection needs explanation.
          *   Address the "Direct Relating" objection. Bradley would call this "magic" or "mystery." If $R$ is distinct from $a$, how does it touch $a$? If it touches it without a medium, distinction collapses.
