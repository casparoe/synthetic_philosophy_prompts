answer: |-
  **The Weight of a Name**

  Kofi returned to Umuofia with a leather portfolio under his arm and a deed to a house in Lagos in his pocket. By the laws of the Republic, he was a man of thirty-five, a citizen with rights, a voter, a taxpayer. He was biologically adult. But when he stepped off the bus and greeted the Council of Elders, he saw the way their eyes slid over him.

  They saw the expensive shoes. They saw the watch. They did not see *him*.

  "Welcome, child of Nnanna," said Elder Obi. The greeting was warm, but it was the warmth one offers a visitor, or a boy. There was no handshake of equals. No inquiry into his judgment.

  "My grandfather is dying," Kofi said, cutting to the point. "I am his only kin. I need to prepare the *Iku* rites."

  Obi exchanged a glance with the woman beside him, Iya Bas. "The *Iku* requires a Person to speak it," Obi said softly. "You are here, Kofi. But are you *here*?"

  Kofi bristled. "I am his grandson. I have the money to pay for the yams, the cloth, the musicians."

  "Money is paper," Iya Bas said. "Personhood is weight. You have been gone fifteen years. You built a life where you answer to no one but yourself. You have not woven yourself into the cloth of this place. You are light, Kofi. If you speak the *Iku* now, your voice will not reach the ancestors. It will dissipate like smoke."

  This was the ontology of the village, the thing Kofi had tried to escape when he left for the city. In the city, personhood was a switch. You were born with it. It was inherent, internal, a property of your consciousness. You had rights because you existed.

  Here, existence was just the raw material. Personhood was a structure you built, brick by brick, through duty, through memory, through the way you held up the people around you. And it was graded. A child was a potential person. A selfish adult was a failed person. An elder who had carried the community's grief and joy was a heavy person, dense with reality.

  Kofi was currently, in the eyes of Umuofia, ontologically hollow.

  "I will do what is required," Kofi said.

  "Then begin," Obi said. "Not with the yams. Begin with the dispute between the Okoro brothers over the boundary line. They will not speak to each other. If you can make them share a meal, you gain a layer. If you can make them laugh together, you gain a voice."

  It sounded absurd. Kofi was a project manager; he managed millions. Mediating a fence dispute between two farmers seemed beneath him. But when he went to the Okoro farm, he realized the difficulty. It wasn't about logic. It was about history.

  For three days, Kofi tried to use contracts. The brothers ignored him. He was a ghost to them. He had no social mass to displace their anger.

  On the fourth day, Kofi put away his portfolio. He didn't bring up the boundary. He went to the farm at dawn and simply started clearing the brush on the disputed strip. He worked until his hands blistered. He didn't ask for credit. He didn't post it online.

  When the brothers arrived, angry, Kofi offered them water from his own canteen. "I am not clearing for the line," Kofi said, his throat dry. "I am clearing so you don't have to look at the weed when you argue. The land is not the problem. The silence is."

  He sat in the dirt. He waited. He made himself a vessel for their tension. He absorbed their shouting without deflecting it. He sacrificed his dignity, his time, his clean clothes.

  By evening, the elder brother broke bread and handed a piece to the younger. They ate in silence.

  Kofi went back to the Council. He expected praise.

  "You have done a task," Obi said. "You are less light than before. But you cannot yet wash the body. That requires holding death without flinching. Go to the widow Eze. Her son died in the city last week. No one has sat with her because they fear her grief is too heavy. Sit."

  This was the gradient. In the city, Kofi would have sent flowers. A transaction. Here, he had to metabolize her pain.

  Kofi went to the widow's hut. Eze was catatonic, staring at a wall. For two days, Kofi sat on the mat. He didn't offer platitudes. He didn't check his phone. He simply existed in the space with her, anchoring her to the world by his own presence. He fetched water. He swept the floor. He became part of the architecture of her survival.

  On the third day, Eze spoke. "Why do you stay? You are a city man. You have rights. You can leave."

  "I have no rights here," Kofi said, and for the first time, he didn't feel diminished by the admission. "I only have duties. If I leave, you are alone. If I am alone, I am nothing."

  Eze wept. Kofi held the bowl while she drank.

  When Baba Nnanna finally passed, the village gathered. The air was thick with the smell of earth and camwood. The body lay prepared. The moment came for the *Iku*, the speech that guides the spirit from the village of the living to the village of the dead.

  Usually, this was done by the eldest son. But Nnanna's son was dead. Kofi was the next kin.

  Iya Bas stepped forward. She held a staff of dark wood, worn smooth by generations of hands. She looked at Kofi. She didn't look at his face; she looked at his shoulders, assessing the load they could carry.

  In the Western view Kofi had lived by, he was ready. He was next of kin. The law said so. His DNA said so.

  But here, the law was the web.

  "Kofi of Nnanna," Iya Bas said. Her voice carried over the crowd. "You have carried the bread of the Okoros. You have held the grief of Eze. You have swept the dust of the compound. You are not yet a Father of the Village. You are not yet an Elder. But you are no longer a child."

  She extended the staff.

  "You have earned enough weight to speak for this family. Do not speak your own words. Speak the words of the community. If you speak for yourself, the spirit will wander. If you speak for us, the spirit will rest."

  Kofi took the staff. It was heavier than it looked. It wasn't just wood; it was the physical manifestation of every handshake, every shared meal, every moment of swallowed pride from the last two weeks. It was the density of his relationships.

  He stepped forward to the body. He felt the eyes of three hundred people on him. In the city, this would be a performance. Here, it was a transference.

  He opened his mouth. He did not think about his love for his grandfather. He thought about the Okoro brothers eating bread. He thought about Eze drinking water. He thought about Obi's warning. He emptied himself of Kofi the Individual, and became Kofi the Node.

  "Go well," he said, his voice resonating in his chest, feeling the vibration of the crowd behind him. "The hands that held you are still here. The work you started is being carried. You are released."

  The crowd exhaled, a single sound. The tension broke. The spirit was guided.

  Later, as the mourning feast began, Kofi sat with the elders. He was not given the central seat—that was for men with forty years of weight. But he was not sent to the periphery with the children. He was given a plate from the main dish.

  "You did well," Obi said, passing him a kola nut. "But do not think you are finished. You have achieved the personhood of a son. To be a Father, you must survive the next drought. To be an Ancestor, you must never betray the trust you just earned."

  Kofi broke the kola nut. He understood now. It wasn't a switch. It wasn't a state of being. It was a practice. He was not a person because he was conscious. He was a person because he was necessary.

  "I will be here for the drought," Kofi said.

  "Good," Iya Bas replied, finally shaking his hand. Her grip was firm. She was acknowledging a peer, however junior. "Then we will see how heavy you can become."

  Kofi looked at his hands. They were calloused now, stained with red earth. He felt the ache in his shoulders. He felt the hunger in his stomach. He felt the eyes of the village resting on him, not with suspicion, but with expectation.

  He was not free. He was bound by a hundred invisible threads of duty and recognition. And for the first time in his life, Kofi did not feel like a ghost drifting through the world. He felt anchored. He was real.
