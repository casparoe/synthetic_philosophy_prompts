  **Move 1 (Marcus):** This is a precise articulation of the "Doctrinal Paradox" (or Discursive Dilemma). Marcus correctly identifies that the collective outcome (Promote) is supported by a majority of *premises*, but not by a majority of *judgments*. In a context where reviewers are acting as delegates rather than objective sensors, the integrity of the individual judgment matters. His point that the "complete view" is a minority opinion is logically sound and highlights the risk of promoting a candidate no majority actually endorses holistically.

  **Move 2 (Deb):** This is a valid defense of the "Premise-Based Procedure." If the axes are treated as objective facts to be determined by the committee (e.g., "Did the code scale?"), then aggregating those findings before applying the rule is rational. However, it scores lower because it assumes the axes are independent facts rather than subjective judgments. It ignores the human element that Marcus highlights: that a "fact" in a review is often a synthesized opinion, not a measurable metric.

  **Move 3 (Marcus):** This is a weaker restatement of Move 1. While democratic legitimacy is important, this move dismisses the utility of the rubric too casually. In a structured calibration, the *reasons* for a vote are supposed to constrain the outcome. By arguing that the reasons don't matter, Marcus undermines the system he is participating in, even if his conclusion about the headcount is intuitively appealing.

  **Move 4 (Deb):** This is the strongest systemic argument. Deb correctly identifies that if the final binary vote overrides the axis scores, the rubric is functionally redundant. If the rule "must clear both" can be bypassed by a raw tally, the company might as well save time and remove the scoring axes entirely. This exposes the structural inconsistency in Marcus's position: you cannot claim to follow a rubric while simultaneously ignoring its aggregation logic.

  **The Bigger Issue:**
  Both Marcus and Deb are debating a classic problem in social choice theory known as the **Doctrinal Paradox**, but they are missing the actual root cause: **procedural ambiguity.** The company failed to define *ex-ante* whether the committee was aggregating *judgments* (Conclusion-Based, Marcus's view) or *premises* (Premise-Based, Deb's view). In high-stakes calibrations, the goal should rarely be a mathematical tally of either kind; it should be **consensus.** If two reviewers vote "No," the facilitator's job is to drive a discussion until those reviewers either concede on the axes or the "Yes" voters concede on the promotion. HR stepping in to apply a mathematical tie-breaker bypasses the deliberative purpose of calibration, turning a qualitative judgment into a quantitative loophole.
