answer: |-
  **Setting:** *A quiet corner of the faculty lounge after a seminar on metaphysics and probability. Two coffee cups sit untouched between them.*

  **Characters:**
  *   **Elena (Humean):** Defends Humean Supervenience and the New Principle.
  *   **Marcus (Primitivist):** Defends objective chances as primitive, non-supervenient features of laws.

  ***

  **Marcus:** You have to admit, Elena, the undermining argument lands. Lewis knew it. When you make chances supervene on the entire Humean mosaic—future included—you sever the link between *now* and *probability*. If a specific sequence of future coin flips would render your current chance assignment false, then knowing the current chance gives you information about the future. That violates the admissibility constraint of the Principal Principle. It's a contradiction baked into the foundation.

  **Elena:** It's a contradiction only if you cling to the *old* Principal Principle as if it were scripture. Lewis's "debugging" in *Humean Supervenience Debugged* wasn't a retreat; it was a clarification. The New Principle (NP) tells us to defer not to the proposition "The chance of heads is 0.5," but to the conditional chance given the entire theory of chance, $T$. $C(A | T) = Ch_T(A)$. Once you conditionalize on the theory itself, the undermining futures are screened off. The contradiction dissolves.

  **Marcus:** Dissolves? Or evaporates? You've saved the consistency of the system by changing the object of deference. The Principal Principle was supposed to capture a basic intuition: if I know the objective chance, my credence should match it, provided I have no "inadmissible" information. The New Principle says, "If you know the *whole theory of the world*, your credence should match the chance derived from it." But that's not what agents do. I don't need a theory of the universe to know I should have 0.5 credence in a fair coin. I just need to know it's a fair coin. By moving to the NP, you've admitted that on Humeanism, you can't know the chance without implicitly having a view on the total history of the world.

  **Elena:** You're conflating metaphysics with epistemology, Marcus. Yes, metaphysically, the chance facts supervene on the total mosaic, including the future. But epistemically, I infer the theory $T$ from the *past* and present data. I don't need to see the future to know the laws. The Best System Analysis picks the theory that best balances simplicity and strength based on the actual history. Just because the truth-maker for the chance includes the future doesn't mean my *access* to it requires prophecy. The NP is the correct normative rule for how credence relates to chance *given* that metaphysics. It preserves the functional role of chance without the contradiction.

  **Marcus:** But does it preserve the *guidance* role? That's the rub. If I'm an agent trying to decide whether to bet on heads, the Humean story tells me: "Check the theory $T$." But $T$ is only the true theory if the future cooperates. If the future turns out to be an "undermining future"—one that would make a different theory the Best System—then my current $T$ is false. So, to be confident in $T$, I must be confident the future *won't* be undermining. But the whole point of chance is that the future is open! The Primitivist says chances are properties of the *current* setup plus the dynamical laws. The future doesn't fix the chance; the chance helps fix the future. I can know the chance is 0.5 without having to bet against certain future histories occurring. Your agent has to implicitly rule out undermining futures to use the NP, which looks suspiciously like having inadmissible evidence.

  **Elena:** That's a compelling picture, but let's turn the table. You say chances are primitive features of the dynamical laws. Fine. But then we hit Lewis's "Connection Problem." Why on earth should my subjective credence defer to your brute, non-supervenient propensity? If chances are just out there in the world, distinct from the patterns of events and distinct from my mind, what rational norm compels me to align my degrees of belief with them?
  For the Humean, the answer is clean: Chances *are* patterns in the events. Rational agents track patterns. Deferring to chance is just deferring to the best summary of empirical regularities. For you, the link between "objective propensity" and "subjective rationality" is magic. You posit a metaphysical primitive to save the Principal Principle, but you can't explain *why* the Principle holds without just stipulating it as a brute norm.

  **Marcus:** It's not magic; it's constitutive of what chance *is*. Part of the concept of objective chance is that it guides belief. If a feature of the world didn't guide belief, it wouldn't be a chance. I'm willing to posit a primitive in the ontology to preserve the integrity of the epistemology. You're doing the reverse: you're distorting the epistemology—making it dependent on the total history of the universe via the New Principle—to save a reductionist ontology.
  And don't tell me the NP doesn't demand too much. Hall and Thau showed that under NP, the "admissible" evidence is effectively empty because any evidence bears on the theory $T$. If I see a hundred heads in a row, that changes my credence in $T$, which changes my chance assignment. But on your view, it changes the *chance itself* retroactively, because the Best System depends on the total mosaic. It makes chance unstable in a way that doesn't match how we use it in science. Physicists don't say, "The decay rate was 50% until we observed more decays, then we realized the rate was actually 60% all along." They say, "We updated our estimate of the fixed rate."

  **Elena:** Physicists are often implicit Primitivists, I grant you. But look at the cost. You want to say the chance is fixed now, independent of the future. But if the world is Humean—if there is no necessary connection between distinct existences—then there *is* nothing in the present that guarantees the future frequencies. If you deny supervenience, you're positing a "necessary connection" between the present state and future outcomes. That's modal realism of the worst kind.
  The NP isn't a distortion; it's a recognition that chance claims are implicitly conditional. When a scientist says "The chance is 0.5," they mean "Given the actual laws of this world, the chance is 0.5." The NP just makes that explicit. It secures the deference principle without requiring mysterious powers. And regarding your worry about instability: The chance *is* stable relative to the theory $T$. We just acknowledge that our confidence in $T$ is fallible. That's not a bug; it's Bayesian humility.

  **Marcus:** Bayesian humility is fine, but it doesn't solve the undermining issue; it papers over it. The problem is that on HS, the proposition "The chance is $x$" is incompatible with certain future histories. So, if I know the chance is $x$, I know those futures won't happen. But those futures were supposed to be physically possible! You've turned physical possibility into a subset of epistemic possibility constrained by the actual future.
  Here's the steelman on my side: The Humean can only save the Principal Principle by turning it into the New Principle. But the New Principle requires the agent to conditionalize on the *true* theory of chance. To know the true theory, on your view, one must know the total mosaic. So, to know what to believe about a coin toss today, I must, in principle, have information about the end of the universe. That makes chance epistemically inaccessible in a way that renders it useless for decision theory. I'd rather posit a primitive propensity that is fully present in the now than a "chance" that requires omniscience to utilize correctly.

  **Elena:** And my steelman is this: Your primitive propensity is a "I know it when I see it" ontology that offers no analysis of what chance *does*. You say it guides belief, but you can't explain the mechanism of guidance without invoking the very functional role Humeanism analyzes via the Best System. If you strip away the connection to frequencies and patterns, your "chance" is a ghost.
  You accuse me of making chance inaccessible. I accuse you of making it inexplicable. The NP shows that we *can* use chance without omniscience because we use *candidates* for $T$, weighted by our credence in them. $C(A) = \sum C(T_i) \cdot Ch_{T_i}(A)$. That works perfectly well for agents. It doesn't require knowing the future; it requires having credences over theories. The undermining problem only looks fatal if you insist the old PP was the only game in town.

  **Marcus:** But the weighting formula works *because* we assume the $Ch_{T_i}(A)$ are stable values independent of the future frequencies. If the $Ch$ values themselves shift depending on which $T_i$ turns out to be true based on future data, the convergence of your credences is not guaranteed by the law of large numbers in the standard way. You're relying on the mathematical behavior of Primitivist chances to make your Humean epistemology work, while denying the metaphysics that supports it. You're free-riding.

  **Elena:** I'm not free-riding; I'm deriving the math from the system. The Best System *earns* the right to be called "chance" precisely because it supports inductive inference. If a system didn't support that, it wouldn't be the Best System.
  Look, let's stop circling. We're at an impasse between metaphysical parsimony and epistemological directness.

  **Marcus:** Agreed. So, let's make it concrete. What would it take to move you? What is the one consideration that would make you abandon Humean Supervenience and the New Principle for a Primitivist view of chance?

  **Elena:** If you could show me a coherent account of how a primitive propensity exerts a *normative* force on a rational agent's mind without relying on the agent's prior experience of frequencies or patterns. If you can explain the "Connection Problem"—why I *ought* to match my credence to your brute power—without secretly smuggling in Humean functionalism, I'd have to concede that the metaphysics is worth the cost. Show me the link isn't just a brute norm, but has an explanatory basis.

  **Marcus:** Fair enough. Here's mine: If you can demonstrate that an agent operating under the New Principle can make optimal decisions in a world with "undermining futures" without effectively presupposing that those futures are impossible. If you can show me that the NP allows an agent to treat the future as genuinely open—where any physically possible sequence can occur—while still maintaining that the chance supervenes on that sequence, without the agent's credence collapsing into certainty about the future... then I'd admit the debugging worked. Show me the agent doesn't need to be a cryptodeterminist to use your principle.

  **Elena:** *[Smiles]* I'll work on the normativity. You work on the openness.

  **Marcus:** *[Picks up coffee]* Deal. Though I suspect we'll both be dead before the other solves it.

  **Elena:** That's the state of the art.
