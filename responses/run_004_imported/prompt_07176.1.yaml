answer: |-
  You are not just uncomfortable with cold arithmetic; you are grappling with one of the most enduring and significant debates in moral philosophy. Your instinct tracks a real, defensible, and well-documented ethical position. While your friend is arguing from a standard utilitarian framework (which dominates public policy and emergency protocol), your hesitation aligns with a school of thought known as **non-aggregationism** or **contractualism**, most famously articulated by the philosopher John Taurek in his 1977 paper *"Should the Numbers Count?"*

  Here is a breakdown of why your intuition is philosophically robust, why your friend's position is practically dominant, and where the tension between them lies.

  ### 1. The Friend's Case: Aggregation and Expected Value
  Your friend is arguing from a **utilitarian** perspective. In this view, the moral goal is to maximize overall well-being or minimize overall harm.
  *   **The Logic:** Death is a bad thing. Six deaths are six times worse than one death. Therefore, minimizing the total count of deaths is the only rational metric.
  *   **The Institutional Duty:** In the context of Search and Rescue (SAR), this view is reinforced by the idea of public trust. SAR teams are public resources funded by the community. If a team saves one person when they could have saved six, and the families of the six find out, they can rightly argue that the team failed in its duty to minimize loss of life.
  *   **The Verdict:** From a policy and macro-ethical standpoint, your friend is "correct." Almost all triage protocols (medical, military, disaster response) prioritize saving the greater number when all other variables are equal. To do otherwise is generally seen as an inefficient use of resources that results in greater net tragedy.

  ### 2. Your Case: The Separateness of Persons
  Your objection is that treating the six as a "pool" that outweighs the one ignores the reality that **there is no collective entity that suffers.** There are only seven individuals.
  *   **The Loss is Total for Each:** As you noted, the lone hiker does not lose "one-sixth" of a life; they lose 100% of their future. From the perspective of the lone hiker, the existence of the other six is irrelevant to their own extinction.
  *   **Taurek's Argument:** John Taurek argued that numbers should not count in this specific way. He suggested that if you cannot save everyone, you owe each individual an equal chance of being saved. He proposed the coin flip precisely for the reason you suggested: it respects the equal moral worth of each person. It says, "Your life matters just as much as any of theirs, so you get a 50% chance, rather than a 0% chance."
  *   **Fairness vs. Outcome:** Your intuition prioritizes *fairness in the decision procedure* over *optimization of the outcome*. You are arguing that it is unjust to condemn the one to certain death simply because they are outnumbered, as if their moral claim is diluted by the presence of others.

  ### 3. Why the Debate Stalls
  The reason neither of you could let go is that you are arguing from different moral axes that do not easily reconcile.
  *   **Your friend** is looking at the **God's-eye view** (the view from above): "How many bodies are in the morgue tomorrow?"
  *   **You** are looking at the **Individual view** (the view from the ground): "What do I owe *this* person standing in front of me?"

  Philosopher T.M. Scanlon offered a middle ground called **Contractualism**. He argues that a moral principle is valid only if no one could reasonably reject it.
  *   Could the lone hiker reasonably reject a principle that says "Save the greater number"? Scanlon thinks yes, because that principle condemns them to death for no fault of their own.
  *   However, could the six reasonably reject a coin flip? Yes, because it subjects them to a 50% risk of mass death when they could have been saved.
  *   Scanlon ultimately sides closer to your friend (save the many), but he acknowledges that your hesitation is morally significant. It highlights that the "greater number" argument isn't a simple math problem; it requires justifying why the claims of the six can "aggregate" to outweigh the claim of the one.

  ### 4. Is the Number *Always* Decisive?
  To answer your specific question: **No, the number is not always the decisive factor in moral philosophy, though it is in most operational protocols.**

  There are serious arguments that it shouldn't automatically settle the debt owed:
  1.  **Special Obligations:** If the lone hiker was your child, or if your SAR team had specifically promised aid to that individual first, many would argue you owe the one more than the six.
  2.  **The "Fair Chance" Intuition:** In situations where the disparity is smaller (e.g., saving 2 vs. 1), many people feel a coin flip is more appropriate than automatically sacrificing the one. This suggests the "numbers count" intuition has a threshold.
  3.  **Moral Luck:** The lone hiker is in a worse position purely due to bad luck (being on the ridge with fewer people). Punishing bad luck with certain death feels intuitively unjust to many, even if it is "efficient."

  ### 5. Conclusion: Valid Discomfort
  Your friend is correct about **protocol**. In a structured SAR environment, you cannot flip a coin. The liability, the public trust, and the mandate to minimize loss of life dictate saving the six. If you were the incident commander, you would be professionally negligent to flip a coin.

  However, **you are correct about the morality.** Your discomfort is not a bug; it is a feature of a healthy moral conscience. It acknowledges that by choosing the six, you are not doing something "easy" or "obvious." You are making a tragic choice where you are actively sacrificing the one.

  If you treat the choice as *purely* arithmetic, you risk dehumanizing the one. Your instinct to want to give them a chance is a recognition of their individual worth. The tragedy of the scenario is that while the one has equal moral worth to any of the six, they do not have equal *leverage* in a utilitarian calculation.

  **The Verdict:** Your friend is right about what you must **do** (save the six). You are right about how you should **feel** (that something profound and tragic is happening to the one that isn't solved by simple addition). Keeping that tension alive is what prevents rescuers from becoming bureaucrats of life and death. You don't need to resolve the argument to know that both sides of it hold truth.
