      *   *Check:* Did Thomson think the Loop was permissible? She argued that if you think Switch is okay, Loop should be okay, but many people feel Loop is closer to Footbridge. This tension is what the writer wants.
      *   *Check:* Is "Triple Effect" the right term? Yes, Frances Kamm's "The Doctrine of Triple Effect." It posits: 1. Intended means, 2. Intended end, 3. Foreseen. But her specific contribution is distinguishing "acting *because* a good effect will occur" vs "acting *in order that* it occurs." I should simplify this for the writer.

  7.  **Final Polish:** Ensure the tone is supportive of a writer, not condescending. Emphasize that the *feeling* of the distinction matters more than the academic precision.

  **(Self-Correction Note):** I need to be careful not to say the Loop Case *solves* the DDE problem. It *presses* it. The user wants the scene to be "non-obvious." The ambiguity is the feature, not the bug.

