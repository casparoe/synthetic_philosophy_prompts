      *   **Conclusion:** Encouragement.

  6.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction on Triple Effect:* Make sure not to get bogged down in Kamm's dense terminology. Keep it focused on the *intention* distinction. The key is: Do I need him to *die*? Or do I need him to *be there*? In the Loop, I need him to *stop the trolley*. His death is incidental to the stopping, but the stopping is necessary. In Footbridge, I need his mass. It's very similar. The distinction is subtle.
