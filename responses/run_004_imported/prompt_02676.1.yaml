answer: |-
  **Title:** The Tombstone of Symbolism: Why the Frame Problem Refutes Classical Computationalism but Dissolves for Embodied Minds

  **Introduction**

  The history of the frame problem is a history of a bait-and-switch, though one with profound philosophical consequences. As your seminar has uncovered, there are ostensibly two frame problems. The first, articulated by McCarthy and Hayes (1969), is a technical difficulty in situation calculus: how to represent change in first-order logic without enumerating an infinite number of axioms stating what *does not* change. The second, popularized by Dennett (1984) and weaponized by Fodor (2000), is an epistemological crisis: how does an intelligent agent determine which of its beliefs are relevant to a specific context without exhaustively checking all of them?

  Many introductory texts suggest the first problem was solved by engineering innovations like circumscription or successor-state axioms, implying the second is merely a philosophical exaggeration. This essay argues the opposite. The technical "narrow" frame problem was indeed solved, but only by restricting the domain of discourse in ways that render the system incapable of general intelligence. The "broad" frame problem remains a fatal, unresolved threat to Classical Computational Theory of Mind (CTM), validating Fodor's pessimism regarding symbolic architectures. However, the problem does not refute the possibility of artificial or natural intelligence *simpliciter*. Rather, it serves as a *reductio ad absurdum* of representationalism itself. By engaging with the logicist solutions, Fodor's modularity argument, and the embodied critique of Dreyfus, I will argue that the broad frame problem is unsolvable within the classical paradigm but dissolves entirely once we abandon the "sandwich model" of cognition for an embodied, enactive framework. Contemporary deep learning, while engineeringly impressive, does not solve the philosophical problem; it merely masks it with statistical brute force.

  **The Logicist Solution and Its Limits**

  To understand why the broad frame problem remains live, we must first acknowledge where the logicists succeeded. McCarthy's later work on circumscription and Reiter's (2001) successor-state axioms effectively resolved the narrow bookkeeping issue. Reiter showed that instead of writing axioms for every fact that remains unchanged (the frame axioms), one can write axioms that specify exactly how a fact *changes*. If an action is not specified to change a fluent, it remains true by default. This reduced the computational complexity from exponential to linear relative to the number of actions.

  However, this solution relies on a critical assumption: the knowledge engineer must pre-specify all relevant actions and their effects. Reiter's axioms work beautifully in a "blocks world" where the ontology is closed and exhaustive. They fail the moment the agent steps into the open world. As Shanahan (1997) noted, the logicist solution solves the problem of *representation* given a fixed context, but it does not solve the problem of *context selection*.

  This is where the slide from narrow to broad becomes critical. The narrow problem asks, "Given a list of relevant facts, how do I update them efficiently?" The broad problem asks, "How do I generate the list of relevant facts in the first place?" Successor-state axioms assume the list is already known. They solve the bookkeeping of relevance, but not the discovery of relevance. Consequently, while the narrow frame problem is technically closed, the solution presupposes the very cognitive capacity (relevance realization) that the broad frame problem claims is inexplicable for classical systems.

  **Fodor's Isotropy and the Death of Classical CTM**

  Jerry Fodor recognized that the logicist success was pyrrhic. In *The Mind Doesn't Work That Way*, Fodor argued that the broad frame problem demonstrates a structural mismatch between the nature of thought and the nature of computation. Classical computation is local; it operates on the syntax of symbols without access to their global semantic properties. However, belief fixation is "isotropic" and "Quinean." Isotropy means that any fact in the universe could potentially be relevant to any other (e.g., the price of tea in China might be relevant to your decision to carry an umbrella if it implies a shift in global trade winds). Quinean means that relevance is sensitive to the entire web of belief, not just local modules.

  Fodor's argument is devastating for classical CTM. If cognition is computation over symbolic representations, and computation is locally defined, then no classical system can determine global relevance without checking everything. Checking everything is computationally intractable (the combinatorial explosion Dennett's robots suffered). Therefore, classical CTM cannot explain abductive reasoning or common sense.

  Fodor is correct that the broad frame problem is unsolvable within the classical paradigm. The logicist responses do not touch this argument because they do not explain how the system *chooses* the axioms to circumscribe. They assume a "god's eye view" of the relevant domain. If we accept the Classical Computational Theory of Mind as the sole model of cognition, the frame problem remains a live and unresolved threat that renders general intelligence impossible. It proves that a system built on discrete, context-free symbols manipulated by local rules cannot navigate a context-sensitive world.

  **The Embodied Dissolution**

  If Fodor is right about classical systems, does intelligence require magic? Hubert Dreyfus and the enactive tradition argue that the frame problem is a pseudo-problem generated by a false ontology. The frame problem only arises if we assume the mind is a detached container of representations that must be matched against the world. This is the "intellectualist myth."

  For Dreyfus, drawing on Heidegger and Merleau-Ponty, relevance is not computed; it is disclosed. When a skilled agent copes with their environment (e.g., a carpenter using a hammer), they do not represent the hammer as an object with properties, nor do they infer its relevance from a database of facts. The hammer withdraws into readiness-to-hand; its relevance is intrinsic to the situation. The "frame" is not a logical boundary drawn by the agent, but a pragmatic horizon constituted by the agent's goals and bodily orientation.

  This dissolves the broad frame problem. The question "How does the agent ignore irrelevant facts?" presupposes that the agent first represents all facts and then filters them. The embodied view denies the premise. The agent never represents the irrelevant facts in the first place because their perceptual systems are attuned to affordances, not propositions. A robot designed on enactive principles does not need frame axioms because it does not maintain a comprehensive world model that requires updating. It acts, perceives the change, and acts again.

  Therefore, the frame problem is not a barrier to intelligence, but a barrier to *disembodied* intelligence. It is a category error to ask how a symbolic system solves relevance, just as it is a category error to ask how a hammer feels pain. The problem dissolves when we shift from a representationalist framework to an embodied one.

  **The Deep Learning Wildcard**

  The rise of deep learning and large language models (LLMs) complicates this dichotomy. These systems are not classical symbolic engines; they are sub-symbolic statistical approximators. They do not use frame axioms, yet they appear to handle relevance with human-like fluency. Does this solve the frame problem?

  I argue it does not; it merely shifts the locus of opacity. Deep learning systems solve the engineering constraint of relevance by learning statistical correlations from massive datasets. They "know" that gravity usually persists after an action because their training data reflects that regularity, not because they possess a causal model of persistence. This makes them brittle. When faced with out-of-distribution scenarios requiring novel causal reasoning (the "cliff edge" of commonsense), LLMs hallucinate. They fail to distinguish between relevant and irrelevant correlations when the statistical regularities shift.

  In philosophical terms, deep learning bypasses the frame problem by abandoning explicit representation, aligning it closer to the embodied view than the classical view. However, because these systems lack genuine embodiment and world-coupling, they inherit a version of the frame problem: they cannot distinguish signal from noise in novel contexts without retraining. They validate Fodor's claim that non-local relevance is hard for computational systems, but they invalidate his conclusion that it is impossible, provided we move away from discrete symbols. Yet, without the grounding of a body in a world, deep learning remains a "stochastic parrot" that simulates relevance without understanding it. It is a pragmatic workaround, not a philosophical solution.

  **Verdict**

  We are now in a position to render a verdict. The frame problem is not a single puzzle with a single solution status. It is a diagnostic tool that distinguishes viable from non-viable theories of mind.

  Regarding the **narrow frame problem**: It is **solved**. Logicist tools like successor-state axioms provide efficient mechanisms for state update within closed domains.

  Regarding the **broad frame problem** and **Classical Computational Theory of Mind**: It remains a **live and fatal threat**. Fodor's argument holds. No system based on the manipulation of context-free symbols via local rules can solve the relevance problem for open-ended environments. The logicist solutions do not refute this; they merely retreat to closed worlds where relevance is pre-defined by the engineer. As long as cognitive science insists that the mind is a classical symbol system, the frame problem stands as an insurmountable objection.

  Regarding the **broad frame problem** and **Embodied/Enactive Cognitive Science**: It is **dissolved**. The problem arises from the assumption that cognition is the manipulation of internal representations. Once we recognize that intelligence is a dynamic coupling between agent and environment, the need to "frame" the world internally vanishes. Relevance is not a computational output; it is a structural feature of embodied engagement.

  **Conclusion**

  The frame problem is the tombstone of Good Old-Fashioned AI (GOFAI). It proves that you cannot build a general mind by stacking logical atoms, no matter how clever your bookkeeping axioms. However, it is not the end of cognitive science. The persistence of the frame problem in the classical literature is a sign that the paradigm, not the phenomenon, is broken. Deep learning offers a statistical escape hatch, but true resolution lies in the embodied turn. We should not seek to solve the frame problem for symbolic agents; we should stop building symbolic agents. The verdict is clear: the frame problem refutes the computer metaphor of the mind, but it leaves the biological reality of the mind untouched. It is a problem for representations, not for agents.
