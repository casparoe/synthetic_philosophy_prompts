      *   **Section 3: The Embodied Dissolution.** Dreyfus/Heidegger. Relevance isn't computed; it's disclosed. Coping before reasoning. This changes the ontology, dissolving the problem.
      *   **Section 4: The Deep Learning Wildcard.** Does statistical relevance counting as solving the frame problem? No, it's a black box version of the same issue (brittleness out of distribution).
