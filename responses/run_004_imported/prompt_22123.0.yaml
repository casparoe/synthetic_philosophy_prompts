  2.  **Deconstruct the Quantum Immortality (QI) Argument:**
      *   *Premise 1:* MWI is true (unitary evolution, no collapse).
      *   *Premise 2:* Consciousness supervenes on physical states.
      *   *Premise 3:* In a quantum measurement with survival/death outcomes, the wavefunction branches.
