      *   *Rising Action:* Testing the theory (subconsciously or consciously), changing behavior, alienation from others.
      *   *Climax:* A moment of genuine danger where the theory is put to the test, or a realization that the "immortality" isn't a gift.
      *   *Resolution:* Ambiguous but grounded. The horror isn't death, it's the *quality* of survival.

  3.  **Explore the Implications of QI (for the narrative):**
      *   *The "Good" Version:* You survive everything. Superpowers. Fearlessness.
      *   *The "Bad" Version (The Horror):* You survive, but your body degrades. You survive in branches where everyone else dies. You get stuck in a "worst case scenario" that isn't death, just suffering. This is the crucial counter-argument to QI that makes it scary. *Quantum Suicide* vs. *Quantum Immortality*.
      *   *Psychological Impact:* Dissociation. Feeling like an observer. Loss of empathy (if others aren't "real" in the same way). Paralysis (why act if the outcome is fixed?) or Recklessness (nothing can kill me).

  4.  **Drafting - Scene by Scene:**

      *   *Scene 1: Discovery.* Elias is up late. The Wikipedia rabbit hole. The "aha" moment mixed with dread.
