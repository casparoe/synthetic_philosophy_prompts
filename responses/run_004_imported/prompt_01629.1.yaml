      *   *Scene 3: The Realization of Decay.* It's not just about *not dying*. It's about *aging*. If he can't die, does he just rot? The concept of the "long slide."
      *   *Scene 4: The Climax.* A car accident or a fall. Something sudden. He survives, but with consequences.
