answer: |-
  The idea found Elias at 3:17 AM, glowing from his laptop screen in the blue-light haze of his bedroom. He had been reading about the Many-Worlds Interpretation, a casual drift from a physics forum to a philosophy blog, and finally to the concept of Quantum Immortality.

  The logic was seductive in its simplicity. If every quantum event spawns a branching universe, then in some branches, you die. In others, you live. But you, the conscious observer, can only exist in the branches where you are alive. Therefore, from your own perspective, you never die. You just keep sliding into the increasingly improbable timelines where the bullet jams, the cancer goes into remission, the car swerves at the last second.

  Elias closed the laptop. The silence of his apartment felt heavy, pressurized.

  For the first week, it felt like a superpower. He walked across busy intersections without checking for cars, a strange, electric hum vibrating in his chest. *I can't end,* he thought. *Not really.* It was the ultimate cure for existential dread. Why fear the fall if the ground is just another branch you don't have to visit?

  But the euphoria curdled quickly.

  He was at dinner with Sarah, his girlfriend of three years. She was laughing, wiping sauce from the corner of her mouth, vibrant and finite. Elias looked at her and felt a sudden, nauseating lurch. If he was right—if his consciousness was locked onto a track of survival—what happened to the Elias in the branches where he died? They were gone. Extinguished. But what about the Sarahs?

  In the branches where Elias lived, Sarah could still die. In fact, statistically, she *would* die.

  "You're staring," Sarah said, her smile faltering. "Everything okay?"

  "Just thinking," Elias said. He reached for his water glass, his hand trembling slightly. He realized then that the theory didn't promise *safety*. It promised *continuity*. It didn't say he would survive unscathed. It only said he would survive.

  He could survive in a wheelchair. He could survive in a burnt-out husk of a body. He could survive in a world where the sun had dimmed and the air was thin, as long as there was a non-zero probability of biological function.

  The recklessness stopped, replaced by a paralyzing hyper-vigilance. Not because he feared death, but because he feared the *path* to survival. If the universe always routed him around death, it might take him through hell to do it.

  Months passed. Elias became quiet, withdrawn. He stopped taking risks, not out of fear of the end, but out of fear of the middle. He wore a seatbelt. He ate kale. He avoided airplanes. His friends joked that he'd become an old man at twenty-six.

  "You're acting like you're going to live forever," his friend Mark teased during a hike.

  Elias stopped on the trail. The wind was whipping through the pines. "What if I am?"

  Mark laughed, clapping him on the shoulder. "Then you owe me a beer in a hundred years."

  Elias didn't laugh. He looked at the drop-off beside the trail. A slip, a tumble, a broken neck. In one branch, Elias hits the rocks. Darkness. In this branch, his foot catches a root. He stumbles, scrapes his knee, and stays upright.

  *I am the one who stumbled,* he thought. *I am the one who scraped the knee.*

  The isolation began to set in. How could he connect with anyone when he viewed them as temporary fixtures in his eternal narrative? They were NPCs in a game he couldn't quit. Every funeral he attended became a confirmation of his own curse. He watched his grandfather die, and instead of grief, he felt a cold, mathematical certainty: *I will be here when the earth is dust.*

  One rainy Tuesday, the abstraction became concrete.

  Elias was driving home. The roads were slick. He saw the truck skid across the median a split second before impact. Time didn't slow down; that was a myth. But his perception narrowed.

  *This is it,* he thought. *The branch where I die.*

  He braced for the blackness. The crunch of metal was deafening, the world spinning in a violent kaleidoscope of glass and rain.

  Then, silence.

  Elias gasped, sucking in air that smelled of deployed airbags and gasoline. He was alive. His arm was bent at a wrong angle, bone piercing the skin, but he was conscious. He was aware.

  He looked at the truck driver's side. The cab was crushed. Stillness.

  Elias screamed. It wasn't a scream of pain, but of horror. He understood then the true cost of Quantum Immortality. It wasn't that he couldn't die. It was that to keep him alive, the universe might kill everyone else. He was a vortex of probability, sucking luck out of the room to fuel his own continuity.

  He survived the crash. He survived the surgery. He survived the infection that should have taken him in the hospital.

  When he finally returned home, six months later, Sarah was waiting. She cried when she saw him, hugging him carefully, avoiding the scars.

  "I thought I lost you," she whispered.

  Elias held her with his good arm. He looked over her shoulder at the mirror in the hallway. He looked older. The pain in his arm was a constant, throbbing companion. He knew, with a chilling certainty, that the pain wouldn't go away. In the branches where the nerve healed, that version of Elias was gone. This version, the one observing, was the one who kept the damage.

  He realized he was walking a narrow path. A path of accumulating damage, of outliving lovers, of watching civilizations rise and fall while his body degraded but refused to stop.

  "El?" Sarah pulled back, wiping her eyes. "You're doing it again. You're somewhere else."

  Elias looked at her. He wanted to tell her. He wanted to scream that he was trapped in a prison of his own persistence, that he was a ghost haunting a future no one else would see. But he couldn't. To tell her would be to make her complicit.

  "I'm here," Elias said. And it was the first lie he had told since the crash.

  He wasn't here. He was everywhere and nowhere. He was the sum of every narrow escape.

  That night, he stood on the balcony of their apartment. The city lights stretched out below, a galaxy of human flickering. He thought about the edge. If he stepped off, he wouldn't die. He would fall and land on a fire escape. Or a awning. Or he would survive the impact and lie there, broken, for days until found.

  The universe would conspire to keep him watching.

  He stepped back from the railing. The terror wasn't of the end. It was of the *next*.

  Elias went inside and locked the glass door. He sat on the couch next to Sarah and took her hand. He felt the warmth of her skin, the pulse in her wrist. A temporary rhythm.

  He decided then that if he was to be the eternal observer, he had a duty. He couldn't be reckless. He couldn't be selfish. If he was going to witness the end of things, he had to bear witness to the beauty of the middle, too. He had to remember the people who couldn't stay.

  He wouldn't test the theory again. He wouldn't seek the branches. He would just walk the path he was on, however narrow, however painful, and he would try to be kind to the people who were lucky enough to not be immortal.

  "Elias?" Sarah asked softly.

  "I'm here," he said again.

  This time, he tried to make it true. He focused on the weight of her hand, the sound of the rain, the ache in his arm. He anchored himself in the present moment, the only place where his immortality actually existed. Not in the future, not in the endless slide of time, but in the single, fragile now.

  He knew he would outlive her. He knew he would outlive the sun. But for tonight, he was just a man with a broken arm, sitting on a couch, loving a woman who would one day die.

  And in that acceptance, the horror receded, just enough to let him breathe. He was not a god. He was just the last one left standing. And until that wasn't true, he had to live with it.
