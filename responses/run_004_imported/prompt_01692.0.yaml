prompt: |-
  I'm reading about naturalism vs. normativism on disease, and I'm honestly a bit confused about what the actual disagreement is. Both naturalists and normativists seem to agree that depression, diabetes, and cancer are diseases, and both seem to agree that being really tall or having red hair aren't diseases. So what are these philosophers even disagreeing about? Is it just vocabulary, or is there something more fundamental at stake that I'm missing?
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Confusion:**
      *   **Observation:** The user notes that naturalists and normativists agree on *specific cases* (depression, diabetes, cancer = disease; tallness, red hair = not disease).
      *   **Question:** If they agree on the examples, what's the actual disagreement? Is it just semantics (vocabulary), or is there something deeper?
      *   **Goal:** Explain the *criteria* behind the classification, not just the classification itself. Show why the disagreement matters for edge cases, policy, and the nature of medicine.

  2.  **Deconstruct the Positions:**
      *   **Naturalism (e.g., Boorse):** Disease is a value-free, biological fact. It's about statistical normality of function relative to species design. If a part doesn't do what it evolved to do, it's diseased. Values enter only *after* the fact (deciding to treat it).
      *   **Normativism (e.g., Engelhardt, Fulford):** Disease is inherently value-laden. To call something a "disease" is to say it's *bad* and needs intervention. Without a negative evaluation, biological dysfunction is just a difference.
      *   **Hybrid Views (e.g., Wakefield):** "Harmful Dysfunction." Needs both biological failure *and* social harm. (Good to mention briefly as a synthesis, but focus on the main dichotomy first).

  3.  **Address the "Agreement on Examples" Fallacy:**
      *   Why do they agree on diabetes/cancer? Because these are *easy cases* (paradigm cases). They involve clear biological dysfunction *and* clear harm.
      *   Where do they disagree? *Hard cases.* This is the crux of the argument.
      *   *Examples of Hard Cases:* Homosexuality (historically), ADHD, aging, psychopathy, mild hypertension, infertility in a post-reproductive age.

  4.  **Identify the Stakes (Why it matters):**
      *   **Medical Authority:** Who decides what gets treated? Doctors (experts on facts) or Society/Patients (judges of value)?
      *   **Resource Allocation:** If it's not a disease, insurance shouldn't pay for it.
      *   **Stigma:** Labeling something a disease can reduce blame (it's not your fault) but also pathologize normal variation.
      *   **Enhancement vs. Therapy:** Is fixing short stature therapy or enhancement? Depends on whether shortness is a disease.

  5.  **Drafting the Explanation (Iterative Process):**

      *   *Introduction:* Validate the user's observation. Yes, they agree on the "easy" stuff. No, it's not just vocabulary. It's about the *criteria* used to judge.
