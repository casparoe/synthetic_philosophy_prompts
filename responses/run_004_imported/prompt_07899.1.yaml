answer: |-
  This is one of the best questions in moral philosophy, and you have hit on exactly why this debate has raged for 50 years. It is genuinely mind-bending that two thinkers can start with "Imagine you don't know who you are" and end up with "Maximize the Average" vs. "Protect the Worst-Off."

  The short answer is: **They part ways on how they treat risk and probability.**

  Harsanyi treats the Veil of Ignorance as a **gamble** governed by standard rules of rational choice. Rawls treats it as a **contract** governed by the stakes of human dignity.

  Here is the step-by-step breakdown of where the math and the philosophy diverge, followed by an assessment of who is "smuggling" what.

  ---

  ### Part 1: The Common Starting Point
  Both Rawls and Harsanyi use an **Impartial Observer** model.
  *   **The Setup:** You are designing the rules of society.
  *   **The Constraint:** You do not know if you will be the CEO or the janitor, healthy or sick, talented or untalented.
  *   **The Goal:** Choose the social arrangement that is rational for you to accept.

  ### Part 2: The Fork in the Road (Probability & Risk)

  This is the critical moment where they split.

  #### Harsanyi's Path: The Rational Gambler
  Harsanyi argues that if you don't know who you will be, you must assign a probability to it. Since you have no reason to think you are more likely to be the CEO than the janitor, you apply the **Principle of Insufficient Reason**: assign an equal probability ($1/N$) to being any specific person.

  Once you have probabilities, Harsanyi says you must follow the standard rules of rational decision-making under uncertainty. These are the **von Neumann-Morgenstern (VNM) axioms**.
  1.  **Completeness/Transitivity:** You can rank options consistently.
  2.  **Independence:** If you prefer A to B, adding a lottery C to both shouldn't change your preference.
  3.  **Continuity:** There is some probability mix where you are indifferent between a sure thing and a gamble.

  If you follow these axioms, you are mathematically required to **maximize Expected Utility**.
  *   *Calculation:* (Utility of Person A $\times$ 1/N) + (Utility of Person B $\times$ 1/N) + ...
  *   *Result:* This is literally **Average Utilitarianism**.

  **Why the linear sum?**
  You asked why the math *forces* a straight linear combination. It comes from the **Pareto Principle** combined with VNM.
  *   **Pareto:** If every individual is indifferent between Society X and Society Y, then the Impartial Observer must also be indifferent.
  *   **The Geometry:** Imagine individual utilities as coordinates on a graph. If the Social Welfare function curves (is non-linear), there will be points where individuals are indifferent (on the same curve), but the Social Observer sees a difference (on a different curve). To satisfy Pareto (Social Observer moves *only* when individuals move) and VNM (Social Observer is rational), the Social Welfare function must be a flat plane slicing through the individual utility axes. A flat plane is a **linear equation** ($W = aU_1 + bU_2 + ...$). Since everyone has an equal chance, the weights ($a, b$) are equal.

  #### Rawls's Path: The High-Stakes Contract
  Rawls rejects Harsanyi's move at the very first step. He argues you **cannot** assign probabilities behind the Veil.
  *   **No Objective Odds:** There is no fact of the matter about how likely you are to be disabled or talented. It's not a lottery ticket; it's a fundamental uncertainty.
  *   **The Stakes:** In a normal gamble (like poker), if you lose, you lose money. In the Original Position, if you lose, you might end up a slave, or starving, or oppressed. The stakes are your basic life prospects.

  Rawls argues that when stakes are this high and probabilities are unknown, standard Expected Utility theory is irrational. Instead, you should use the **Maximin Rule**: **Max**imize the **Min**imum outcome.
  *   Don't look at the average. Look at the floor.
  *   Make the position of the worst-off person as good as possible.
  *   *Result:* **The Difference Principle** (Inequality is only allowed if it benefits the worst-off).

  ---

  ### Part 3: Where the "Smuggling" Happens

  You asked which one is doing legitimate work and which is smuggling conclusions in. The honest answer is that **both smuggle**, but they smuggle different things.

  #### The Case Against Harsanyi (Smuggling Utilitarianism)
  Harsanyi's proof is mathematically elegant, but critics argue he builds Utilitarianism into his axioms.
  1.  **The "Society as an Individual" Assumption:** Harsanyi assumes the "Impartial Observer" must obey the same VNM axioms as a single person gambling. But why? Society isn't a person. It doesn't have a single brain to feel "regret" or "satisfaction." By forcing Society to be VNM-rational, he forces it to be willing to trade off one person's misery for another's gain, provided the average goes up. That *is* Utilitarianism. He hasn't proven Utilitarianism; he's assumed a definition of rationality that implies it.
  2.  **The Probability Assumption:** Assigning equal probability ($1/N$) is controversial. If you don't know the odds, why assume they are equal? Why not assume the distribution is skewed? Rawls argues that assuming equal probability is just a sneaky way of averaging utilities without admitting it.
  3.  **Risk Neutrality:** Harsanyi assumes the observer is risk-neutral (cares only about the average). But most humans are risk-averse. If you allow risk aversion into Harsanyi's math, the result shifts away from pure Average Utilitarianism toward something that cares more about the bottom (though not necessarily full Maximin).

  #### The Case Against Rawls (Smuggling Egalitarianism)
  Rawls's argument is philosophically rich, but critics argue he rigs the psychology of the participants.
  1.  **Extreme Risk Aversion:** Rawls assumes people behind the Veil are *so* risk-averse they will choose Maximin. But economists point out that Maximin is usually irrational. (Example: Would you choose a guaranteed \$1, or a 99.9% chance of \$1 million and a 0.1% chance of \$0? Maximin says take the \$1. Most rational people take the gamble). Rawls has to argue that the "0.1% chance" involves slavery or death to make Maximin work, but that feels like he's stacking the deck to get the egalitarian result he wants.
  2.  **Primary Goods vs. Utility:** Rawls realizes that comparing "happiness" (utility) between people is impossible. So he switches the metric to "Primary Goods" (rights, liberties, income). But this is a huge move. By changing the currency from "happiness" to "rights," he automatically blocks the Utilitarian calculation. You can't sum up rights the same way you sum up happiness.
  3.  **The "Strains of Commitment":** Rawls argues that people wouldn't agree to a society where they might end up destitute because they couldn't "commit" to obeying the laws in that state. This is a psychological claim, not a mathematical one. It's plausible, but it's an assumption inserted to support his conclusion.

  ---

  ### Part 4: Which is doing more legitimate work?

  If I have to weigh in: **Harsanyi wins on math; Rawls wins on philosophy.**

  **Harsanyi's Aggregation Theorem** is a legitimate mathematical proof *if* you accept the premises. It shows that *if* you want a social welfare function that respects individual preferences (Pareto) and acts rationally under uncertainty (VNM), it *must* be Utilitarian. The "work" it does is showing that Utilitarianism is the only consistent way to aggregate preferences under those specific constraints. However, those constraints are not neutral; they are inherently individualistic and consequentialist.

  **Rawls's Veil of Ignorance** is not a mathematical proof; it is a device for reflection. Its "work" is forcing us to acknowledge that we shouldn't design society based on our own luck. However, his jump to Maximin is the weak link. It is hard to defend Maximin as a universal rule of rationality.

  **The Verdict on "Smuggling":**
  *   **Harsanyi** smuggles in the idea that **morality is just individual rationality scaled up.** He assumes that because *I* should maximize my expected utility, *Society* should maximize the sum of ours. Many philosophers think this is a category error.
  *   **Rawls** smuggles in the idea that **certain rights are off-limits to trade-offs.** He assumes that no amount of average happiness is worth the risk of being a slave. He builds this into the "stakes" of the Veil.

  **My Take:**
  Harsanyi is right that if you treat social choice as a betting game, you get Utilitarianism. But Rawls is right that **social justice is not a betting game.**

  The fundamental disagreement isn't about math; it's about whether individuals are **containers of utility** (Harsanyi) or **free and equal moral persons** (Rawls).
  *   If people are just containers of utility, Harsanyi is correct: smash the containers, mix the utility, maximize the total.
  *   If people are moral agents with inviolable dignity, Rawls is correct: you cannot gamble with their basic status, regardless of the average payoff.

  Harsanyi's proof is tighter, but Rawls's setup captures something deeper about what we actually care about when we talk about *justice* rather than just *efficiency*. Harsanyi proves how to be a good bookkeeper for society; Rawls tries to explain how to be a fair partner in society.

  If your brother is arguing for "Total Happiness," he's implicitly accepting Harsanyi's VNM axioms. If you're arguing for "Protecting the Worst-Off," you're implicitly accepting Rawls's view that some risks are morally unacceptable, regardless of the odds. Neither side can prove the other wrong with math alone, because the disagreement is about the *moral status of the individual*, not the calculation.
