answer: |-
  You have hit on one of the most fascinating debates in modern decision theory. Your intuition is sharp: mathematically, Ole Peters' ergodicity economics and Daniel Bernoulli's expected utility theory (EUT) often end up in the exact same place. But *why* they end up there is fundamentally different.

  To answer your core question: **Yes, the math is effectively identical for multiplicative wealth dynamics, but no, it is not merely "sleight of hand."** They are solving the problem using different ontologies (ways of describing reality).

  Here is the breakdown of why they look the same, why they claim to be different, and which one actually explains human behavior.

  ### 1. The Mathematical Overlap (Why you are right)
  You correctly noticed that maximizing the long-run time-average growth rate looks a lot like maximizing logarithmic utility.

  *   **Bernoulli (EUT):** You maximize the *ensemble average* of your utility. If you choose $U(W) = \ln(W)$, you are maximizing $E[\ln(W)]$.
  *   **Peters (Ergodicity):** You maximize the *time average* growth rate of your wealth. For a multiplicative process (where you reinvest winnings), the growth rate $g$ is defined as:
      $$g = \lim_{T \to \infty} \frac{1}{T} \ln \left( \frac{W_T}{W_0} \right)$$
      By the Law of Large Numbers, this time average converges to the expectation of the log-return: $E[\ln(W_{t+1}/W_t)]$.

  So, mathematically, **if** wealth dynamics are multiplicative, Peters' "time-average growth" is mathematically isomorphic to Bernoulli's "log-utility." If you run the numbers for the St. Petersburg game using Peters' method, you get a finite price (roughly $10–$20 depending on wealth), just like Bernoulli.

  ### 2. The Conceptual Split (Where Peters claims novelty)
  If the math is the same, why does Peters argue he isn't just rehashing Bernoulli? The difference lies in **where the non-linearity comes from.**

  **Bernoulli's Story (Psychology):**
  The logarithm is inside the *agent*. The world is linear (money is money), but humans are weird. We feel diminishing marginal utility. A billion dollars doesn't make you a billion times happier than having one dollar. The "fix" to the paradox is that humans are psychologically risk-averse.
  *   *Critique:* This is ad hoc. Why log? Why not square root? Why do people buy lottery tickets (risk-seeking) if they are naturally risk-averse?

  **Peters' Story (Physics/Dynamics):**
  The logarithm is inside the *process*. The agent is neutral; they just want to maximize their wealth over time. However, the *dynamics of wealth* are multiplicative (you invest capital to get returns). In a multiplicative world, the arithmetic mean (ensemble average) is irrelevant to the individual trajectory. The geometric mean (time average) is what determines survival.
  *   *The Kicker:* If the game were **additive** (e.g., you win cash but keep it in a separate box, never reinvesting it into your capital base), Peters' framework yields **linear utility**. The paradox would return.
  *   *The Claim:* Peters argues that because real-life wealth *is* multiplicative (compounding), the logarithm isn't a psychological assumption; it's a physical necessity of the system. You don't need to assume risk aversion; you only need to assume the agent wants to avoid ruin over time.

  So, is it sleight of hand? **No.** It's a shift from "people are irrational" to "the standard expectation value is the wrong observable for non-ergodic systems."

  ### 3. Which one explains why nobody pays $1,000 to play?
  Both models successfully predict that people won't pay a large amount, but they offer different explanations for *why*.

  **The Case for Ergodicity Economics:**
  Peters' explanation is more robust regarding the "one-off" nature of the critique.
  *   EUT struggles to explain why utility functions should be stable across different contexts.
  *   Ergodicity explains that we treat the St. Petersburg game not as an isolated event, but as part of a lifetime sequence of decisions. If you treat every decision as part of a time sequence where you reinvest resources, the log-wealth optimization emerges naturally.
  *   It solves the "super St. Petersburg" problem (where payouts grow fast enough to break log-utility) by noting that no real-world counterparty has infinite resources. The game *must* end, making the time average finite.

  **The Case for Expected Utility:**
  *   EUT is more flexible. It can account for behaviors that aren't about wealth growth. For example, I might pay for insurance (risk aversion) but also buy a lottery ticket (risk seeking) in the same week. A pure time-average growth model struggles with this unless you introduce multiple "mental accounts."
  *   Empirically, humans are not perfectly log-optimal. We often take risks that threaten ruin (e.g., leverage in housing bubbles). If we were purely optimizing time-average growth, we would be more conservative than we actually are.

  ### 4. The Verdict
  You asked if Peters is secretly just doing log-utility under a new name.
  *   **Mathematically:** Yes.
  *   **Philosophically:** No.

  Peters has effectively **derived** Bernoulli's utility function from first principles of stochastic dynamics, rather than positing it as a psychological axiom. He argues that log-utility isn't how we *feel* about money; it's how money *behaves* over time when compounding is involved.

  **Which explains the behavior?**
  Probably a mix, but Peters offers the stronger *normative* argument (why you *shouldn't* pay much), while EUT offers a better *descriptive* argument (why people act inconsistently).

  The reason nobody pays more than $20 is likely because our brains have evolved heuristics that approximate time-average optimization. In the ancestral environment, decisions were rarely independent, parallel universes; they were sequential, multiplicative risks where ruin meant death. We are wired to be "ergodic" optimizers because the ones who optimized ensemble averages went extinct.

  So, Peters isn't hiding log-utility; he's arguing that **log-utility is the shadow cast by time on a multiplicative world.** Bernoulli saw the shadow and guessed the shape of the object; Peters claims to have found the object itself.
