  *(Self-Correction Note)*: I should mention that Peters' work is somewhat controversial in mainstream economics. It's important to present it as a compelling alternative framework rather than settled dogma. Also, note that Bernoulli's original solution was specifically log-wealth, but modern EUT allows *any* concave utility function, whereas Peters derives the specific function from the dynamics.

