answer: |-
  This is one of the sharpest and most classic objections to *Principia Ethica*. You have put your finger on the exact tension that has kept metaethicists busy for over a century.

  The short answer is: **Moore is logically consistent, but methodologically precarious.**

  He does not contradict himself formally, but he does rely on intuition to do two different jobs that feel like they should cancel each other out. Here is how to walk through the consistency (and the tension) for your seminar.

  ### 1. Distinguishing the Two Moves
  To see why they aren't a formal contradiction, we have to distinguish what each tool is actually doing.

  **The Method of Isolation (The "Existence" Test)**
  *   **Question:** Does $X$ have intrinsic value *at all*?
  *   **Procedure:** Imagine a universe containing *only* $X$. If it seems better than a universe containing nothing (or something neutral), $X$ has intrinsic value.
  *   **Function:** This establishes the **baseline**. It determines whether a property is a "value-bearing" property. It answers: *Is this thing a source of value, or is it valueless on its own?*

  **The Doctrine of Organic Unities (The "Aggregation" Rule)**
  *   **Question:** What is the value of Whole $W$, which consists of parts $A$ and $B$?
  *   **Principle:** "The value of a whole must not be assumed to be the same as the sum of the values of its parts." (*Principia*, §18).
  *   **Function:** This governs **combination**. It answers: *When we put value-bearing things together, does the value add up linearly, or does it multiply (or diminish)?*

  **The Consistency Check:**
  Moore is not saying: "Isolate the parts to find the total value."
  He is saying: "Isolate the parts to see if they contribute *any* value, but recognize that when combined, they create a **new** value property that belongs to the *whole*, not the parts."

  Think of it like chemistry.
  *   **Isolation Test:** Test Hydrogen alone. Test Oxygen alone. Do they have flammability? (Baseline properties).
  *   **Organic Unity:** Combine them to make Water ($H_2O$). Does Water have the sum of the flammability of H and O? No. It has entirely new properties (wetness, extinguishing fire).
  *   **Moore's Ethics:** Consciousness ($A$) + Beautiful Object ($B$) = Appreciation of Beauty ($W$). The value of $W$ is not $Value(A) + Value(B)$. It is a distinct, emergent value.

  So, formally, there is no contradiction. You can determine the intrinsic value of a part in isolation while maintaining that the part contributes differently to a whole.

  ### 2. The Real Tension: Epistemological Ad Hoc-ness
  Where your seminar classmates will likely push back is not on logic, but on **method**.

  If the value of the whole is not reducible to the parts, **why do we need the Isolation Test at all?**
  If Moore says, "Imagine the beautiful world unperceived," and we agree it has *some* value, but then he says, "But the *consciousness* of it creates a whole with vastly more value that isn't just the sum," he is effectively saying: *"Our intuition about the part doesn't tell us much about the value of the whole."*

  Critics argue this makes the Isolation Test toothless. If the real value is always in the complex organic unities (which is almost everything we care about), why spend time isolating unperceived beauty?

  **Moore's Defense:**
  He needs the Isolation Test to defeat **Hedonism** and **Subjectivism**.
  *   Hedonists say: "Only pleasure has value."
  *   Moore uses the "Beautiful World" isolation test to show: "No, a beautiful world has value even without pleasure (consciousness)."
  *   Once he has established that *objective beauty* is a value-bearer, he uses Organic Unities to explain why *consciousness of beauty* is even better.

  So, the Isolation Test is a **polemical tool** (to refute opponents), while Organic Unities is a **constructive tool** (to build his own hierarchy of goods).

  ### 3. Why Personal Affection Beats Appreciating Beauty
  Now, to your specific question: Why does Moore rank "personal affection" (love of people) higher than "appreciation of beauty" (aesthetic enjoyment), given his method?

  Moore identifies the two greatest goods as:
  1.  The pleasures of human intercourse (personal affection).
  2.  The enjoyment of beautiful objects.

  He argues (1) is greater than (2). Here is the breakdown using his own framework:

  **A. The Object of the Attitude**
  *   **Beauty:** The object is a static quality or arrangement (a landscape, a painting). Even if it's a "beautiful world," it is non-conscious.
  *   **Affection:** The object is a **person**. For Moore, a person with "good qualities" (virtue, character) is itself a complex organic unity of high value.
  *   **The Move:** Loving a *valuable person* creates a higher-order unity than loving a *valuable object*. The object itself (the person) contains more intrinsic value than the object (the landscape).

  **B. The Nature of the Emotion**
  *   **Aesthetic Appreciation:** This is largely contemplative. It is a cognitive/emotional state directed at a quality.
  *   **Personal Affection:** This involves a reciprocal recognition of value. It is an emotional response to *moral goodness* in another.
  *   **The Move:** Moore intuits that an emotional response to *goodness* (virtue) is a "denser" organic unity than an emotional response to *beauty* (aesthetics).

  **C. The "Double" Organic Unity**
  Moore suggests that personal affection involves a more complex structure.
  *   In aesthetic appreciation, you have: *Mind + Beautiful Object.*
  *   In personal affection, you have: *Mind + (Mind + Good Qualities).*
  You are valuing a being that is itself a valuer. Moore thinks there is a "multiplication" of value here. The whole is not just $A + B$; it is a relation between two complex unities.

  ### 4. How to Frame This in Seminar
  If you want to nail this discussion, here is the roadmap:

  1.  **Concede the Tension:** Acknowledge that it *feels* like Moore is having his cake and eating it too. He isolates parts to find value, then says the value is in the combination.
  2.  **Defend the Logic:** Clarify that Isolation determines *independence of existence*, while Organic Unity determines *non-additivity of value*. These are compatible claims.
  3.  **Press the Methodological Weakness:** Ask the class: "If the real value is always in the organic whole, does the Isolation Test actually prove anything, or does it just clear the ground?" (This shows you understand the deeper metaethical implication).
  4.  **On Affection vs. Beauty:** Point out that Moore's ranking relies entirely on **intuition**. He has no formula for *why* affection is greater. He simply asserts that our intuition confirms the organic unity of love is greater than the organic unity of aesthetic contemplation.
      *   *Critique:* This exposes Moore's vulnerability. If two people have different intuitions about whether love > art, Moore has no argument to settle it. He can only say, "Think harder."

  ### Summary for your notes:
  *   **Isolation Test:** Proves $X$ has value *independently*. (Refutes Subjectivism).
  *   **Organic Unity:** Proves $Value(Whole) \neq Sum(Parts)$. (Refutes Additivity).
  *   **Consistency:** Consistent logically (baseline vs. aggregation), but tense methodologically (why isolate if the whole is what matters?).
  *   **Affection > Beauty:** Because the object of affection (a virtuous person) is a higher-value organic unity than the object of aesthetics (a beautiful thing), creating a "higher-order" whole.

  Moore keeps the moves consistent by treating value as a **non-natural property** that supervenes on complex states of affairs. The Isolation Test checks if the property attaches to the part; Organic Unity explains how the property attaches to the whole. They are different questions about the same property.
