          *   *De Regimine Principum* (On Kingship): Discusses Ehud/Eglon but limits it (foreign vs. domestic), warns against private initiative (Joash), assigns remedy to public authority.
          *   *Summa Theologiae* (II-II, q. 42, a. 2, ad 3): Disturbing a tyrant isn't sedition.
          *   *Summa Theologiae* (II-II, q. 64, a. 3): Lawful killing is for public authority only.
      *   **Specific Questions to Answer:**
          *   Does Aquinas *ever* license a private citizen to kill a tyrant?
          *   Does the usurper vs. established ruler distinction matter?
          *   Does the foreign vs. domestic distinction (Ehud) matter more?
          *   How do we reconcile the *Sentences* with the mature works?
      *   **Constraint:** Do not rest on "ambiguity." Reach a verdict. Defend a specific reading. Can use later commentators (Cajetan, Suárez) only to sharpen the case, not as the main focus.
      *   **Format:** Essay form.
      *   **Tone:** Academic, rigorous, suitable for a graduate seminar context.

  2.  **Initial Assessment & Thesis Formulation:**
      *   *The Conflict:* The *Sentences* passage looks like a green light for tyrannicide. The *De Regno* and *Summa* look like red lights for private individuals, reserving the act for public authority.
      *   *The "Usurper" Distinction:* Many scholars try to save the *Sentences* by saying Aquinas only means a *usurper* (tyrant without title) can be killed by anyone, while a *tyrant by exercise* (legitimate title, bad rule) requires public removal.
      *   *The "Foreign" Distinction:* The prompt notes Aquinas's handling of Ehud suggests foreign/domestic is key. Eglon was an oppressor of Israel, not their king.
      *   *My Verdict:* Aquinas's mature position (De Regno/Summa) systematically closes the door on *private* tyrannicide. The *Sentences* passage is either a report of opinion (Cicero) or an early view he later corrected. The distinction that matters most is not usurper vs. established, but *private vs. public authority*. Even a usurper cannot be killed by a private individual acting on private authority; the act must be authorized by the community or a superior public power. The Ehud case confirms this: Ehud acted as a *judge* (public authority), not a private citizen, and Eglon was a foreign enemy, making it an act of war, not execution.
      *   *Refining the Thesis:* I need to argue that Aquinas moves from a potentially permissive early view to a restrictive mature view based on his developing theology of order and authority. The "private citizen" is *never* licensed to kill a tyrant in the mature corpus. The *Sentences* must be explained away as non-definitive. The core principle is the monopoly of legitimate violence by public authority.

  3.  **Drafting - Section by Section:**

      *   **Introduction:**
          *   Hook: The textbook gloss vs. textual reality.
          *   Context: John of Salisbury vs. Aquinas.
          *   Thesis Statement: Aquinas's mature doctrine prohibits private tyrannicide unequivocally. The *Sentences* passage represents an undeveloped stage or a report of opinion, superseded by the structural arguments in *De Regno* and the *Summa*. The crucial distinction is not between types of tyrants, but between private and public authority.

      *   **Body Paragraph 1: The *Sentences* Passage (The Problem):**
          *   Analyze In II Sent., d. 44, q. 2, a. 2.
          *   Acknowledge the "praised and rewarded" line.
          *   Address the Cicero objection (is he reporting or asserting?).
          *   Argument: Even if he asserts it, it's early. It lacks the nuanced metaphysics of authority found later. It treats the tyrant as a "public enemy" generally, without distinguishing the *agent* of removal sufficiently.

      *   **Body Paragraph 2: *De Regimine Principum* (The Pivot):**
          *   Focus on the Ehud/Eglon analysis.
          *   Crucial point: Aquinas *limits* the biblical precedent. Eglon = foreign oppressor (act of war), Ehud = Judge (public authority).
          *   The Joash counter-example: Assassins punished despite Joash's wickedness.
          *   Conclusion of *De Regno*: Remedy belongs to public authority (superior or community), not private presumption.

      *   **Body Paragraph 3: The *Summa Theologiae* (The Systematic Doctrine):**
          *   II-II, q. 64, a. 3 (Killing sinners): Analogy of the physician/amputation. Only the one with care of the whole (public authority) can kill. Private individuals cannot.
          *   II-II, q. 42, a. 2, ad 3 (Sedition): Disturbing a tyrant isn't sedition *if* the tyrant is the one disturbing the peace. But this doesn't authorize *anyone* to do the disturbing.
          *   Synthesis: These passages lock the door. Killing is an act of justice, not vengeance. Justice requires jurisdiction.

      *   **Body Paragraph 4: Addressing the Usurper vs. Established Distinction:**
          *   This is the common "way out" for scholars wanting to save tyrannicide in Aquinas.
          *   Argument: Aquinas doesn't lean on this hard in the mature texts. Even a usurper holds a position of power that requires public unseating.
          *   Why? Because private killing leads to greater evil (chaos, factionalism).
          *   The "Foreign" distinction is actually more prominent in his exegesis of Ehud. It reinforces the idea that domestic rulers, even bad ones, are under a different juridical order than foreign enemies.

      *   **Body Paragraph 5: Reconciling the Texts (The Verdict):**
          *   How to handle the *Sentences*? It must be subordinated to the *Summa*. Development of doctrine.
          *   The "Public Authority" clause: Who constitutes public authority? The community acting collectively, or a superior (e.g., Emperor over King).
          *   Cajetan/Suárez mention (briefly): They try to expand the "public authority" to include the "virtual" consent of the people, but Aquinas is stricter.
          *   Final Verdict: No private right to tyrannicide.

      *   **Conclusion:**
          *   Restate thesis in light of evidence.
          *   Implication for the seminar: Aquinas is not John of Salisbury. He prioritizes order and the common good over the removal of a specific evil if the method threatens the whole.
          *   Final punchline: The "physician" analogy is the key. A private citizen is not the physician of the body politic.

  4.  **Review and Refine:**
      *   *Check against constraints:* Did I avoid "it's ambiguous"? Yes. Did I address the usurper distinction? Yes. Did I address the foreign/domestic distinction? Yes. Is it essay form? Yes.
      *   *Tone Check:* Is it authoritative but nuanced? Ensure I don't sound dogmatic where the text is complex, but firm on the conclusion.
      *   *Specific Textual Check:* Ensure I accurately represent the Ehud argument (foreign vs. domestic) and the Joash argument (punishment of assassins).
      *   *Refining the "Usurper" point:* I need to be careful. Some scholars argue Aquinas *does* allow killing a usurper. I need to argue that even then, it requires *public* designation, not private whim. The act becomes public, not private.
      *   *Self-Correction on Ehud:* Aquinas explicitly says Ehud killed Eglon as an enemy of the people of God, not as a subject killing a king. And Ehud was a Judge. So it's double protected: Foreign enemy + Public Official.
      *   *Final Polish:* Ensure the transition from *Sentences* to *Summa* is framed as a development of his political metaphysics, not just a change of mind.

  5.  **Final Output Generation:** (Proceeding to write the essay based on these thoughts.)
answer: |-
  **The Physician and the Usurper: Authority and Tyrannicide in the Thought of Thomas Aquinas**

  It is a persistent temptation in the history of political thought to flatten the contours of medieval theory into a binary struggle between absolutism and resistance. In this simplified narrative, John of Salisbury stands as the bold proponent of tyrannicide in the *Policraticus*, while Thomas Aquinas is often drafted as his scholastic heir, providing theological cover for the assassination of oppressive rulers. This reading, however, crumbles under the weight of Aquinas's own textual corpus. While a superficial glance at his early *Commentary on the Sentences* might suggest a straightforward sanction of tyrannicide, a rigorous engagement with his mature works—specifically *De Regimine Principum* and the *Summa Theologiae*—reveals a systematic closure of the door on private violence. The verdict must be clear: in Aquinas's considered doctrine, there is no sense in which a private citizen is licensed to kill a tyrant on their own initiative. The distinction that does the heavy lifting in his mature thought is not between types of tyrants (usurper versus established), but between private and public authority. The *Sentences* passage represents an undeveloped position that is effectively superseded by a metaphysics of order which reserves the power of life and death exclusively to the public sphere.

  To understand the evolution of Aquinas's thought, one must begin with the difficulty posed by the *Commentary on the Sentences* (In II Sent., d. 44, q. 2, a. 2). Here, discussing whether Christians are bound to obey secular power, Aquinas writes that if a regime seizes power by violence without the consent of the subjects, or if a ruler commands things contrary to divine law, the subjects are not bound to obey. He adds the striking claim that "he who kills a tyrant to free his country is to be praised and rewarded." Textual critics have long debated whether Aquinas is speaking in his own voice or merely reporting a Ciceronian opinion common to the schools. However, even if we grant that this is Aquinas's own early assertion, it lacks the juridical precision of his later work. In the *Sentences*, the focus is primarily on the moral obligation of obedience rather than the juridical mechanics of removal. The statement functions as a moral evaluation of the *outcome* (freedom) rather than a procedural authorization of the *agent*. It treats the tyrant as a public enemy in a general sense, without yet fully articulating why the act of killing requires specific jurisdictional standing. To treat this passage as the definitive key to Aquinas's political theory is to privilege a youthful query over his mature systematic synthesis.

  The mature Aquinas emerges in *De Regimine Principum*, where the treatment of tyranny is far more cautious and structurally nuanced. In the chapter concerning the remedy against tyranny, Aquinas confronts the biblical precedent of Ehud killing Eglon, King of Moab. A proponent of tyrannicide might seize this as a divine endorsement of assassination. Aquinas, however, immediately dismantles this inference through two critical distinctions. First, he notes that Eglon was not a domestic ruler but a foreign oppressor holding Israel in servitude; thus, Ehud's act was one of war against an enemy, not the execution of a sovereign by a subject. Second, and perhaps more importantly, Ehud was not a private citizen acting on whim; he was a Judge of Israel, raised up by God and holding public authority. Aquinas reinforces this restriction with the counter-example of the assassins of King Joash. Despite Joash's apostasy and wickedness, those who killed him were punished by Solomon. Aquinas draws the explicit conclusion: "It is not for private presumption to kill such men, but for public authority." This is not a minor qualification; it is the structural core of his argument. The danger of private initiative is that it exposes the community to greater peril than the tyranny itself, inviting factionalism and the collapse of legal order.

  This restriction is systematized in the *Summa Theologiae*, where Aquinas's general doctrine on lawful killing renders private tyrannicide theoretically impossible. In II-II, q. 64, a. 3, Aquinas argues that it is lawful to kill a sinner only insofar as it is directed to the welfare of the whole community. He employs the analogy of the physician amputating a diseased limb: just as the care of the whole body belongs to the physician, the care of the common good belongs to the public authority. A private individual has no charge of the common good and therefore no commission to kill. This principle is absolute. It applies to criminals, and *a fortiori* to rulers. While Aquinas notes in II-II, q. 42, a. 2, ad 3 that disturbing a tyrannical regime does not constitute the sin of sedition (since the tyrant is the one who fosters discord), this exemption from the charge of sedition is not a positive license to kill. It merely means that resisting a tyrant is not necessarily an attack on the *just* order. It does not confer the jurisdiction required to take life. For Aquinas, justice is a matter of rendering what is due according to right order; without public authority, the killing of a ruler remains an act of private violence, indistinguishable in form from murder, regardless of the virtue of the intention.

  Scholars attempting to salvage a right to private tyrannicide in Aquinas often rely on the distinction between a *tyrannus ex defectu tituli* (a usurper with no legitimate title) and a *tyrannus ex parte exercitii* (a legitimate ruler who governs oppressively). The argument suggests that while a legitimate ruler cannot be touched by a private hand, a usurper is merely a private aggressor and may be killed by anyone. However, this distinction cannot bear the weight often placed upon it in Aquinas's mature texts. While Aquinas acknowledges in the *Sentences* that one need not obey a usurper, he does not explicitly grant a license for private killing in the *Summa* or *De Regno*. The logic of the "physician" analogy in the *Summa* suggests that the removal of any obstacle to the common good, whether a usurper or an oppressive king, requires an agent with care for the whole. A usurper may lack legitimate title, but he holds de facto power that constitutes a public disorder. Correcting that disorder is a public act. If a private individual kills a usurper, they are still acting without public commission. The act may be materially beneficial, but formally it remains illicit unless ratified by public authority. The "usurper" distinction explains why obedience is not owed, but it does not explain why private execution is authorized.

  Furthermore, the prompt raises the question of whether the foreign/domestic distinction in the Ehud case is more significant than the tyrant typology. Aquinas's handling of Ehud suggests that it is indeed the status of the ruler vis-à-vis the community that matters most. Eglon was an external enemy; Joash was a domestic king. For Aquinas, the domestic ruler, even when wicked, remains part of the juridical body of the kingdom. To kill him is to act within the body without the head's consent, which is pathological. To kill a foreign oppressor is to act against an external threat, which is defensive. This reinforces the conclusion that for a domestic ruler (usurper or established), the remedy must come from within the public order. Aquinas explicitly states in *De Regno* that if there is no human remedy (i.e., no superior public authority to depose the king), one must have recourse to God. This is not merely pious filler; it is a logical consequence of his prohibition on private violence. If the public authority cannot act, the private individual certainly cannot.

  How, then, do we reconcile the *Sentences* with the *Summa*? We must acknowledge development. The *Sentences* commentary is a work of Aquinas's youth, written before he had fully articulated his mature political metaphysics. It reflects a more traditional scholastic reception of Ciceronian and Patristic authorities which were more permissive regarding tyrannicide. The *Summa* and *De Regno* represent his settled view, where the preservation of order and the definition of authority take precedence. Later commentators like Cajetan and Suárez attempted to soften this restriction by arguing that the "public authority" could be the community itself acting virtually to depose a tyrant, effectively democratizing the right of removal. While this is a coherent development of Thomism, it goes beyond Aquinas himself. Aquinas is more conservative: he speaks of recourse to a "superior" authority (such as an Emperor over a King) or, in the absence of a superior, to God. He is wary of the community acting as judge in its own cause because he fears the sedition that inevitably follows.

  Therefore, the verdict for your seminar must be decisive. Aquinas's mature doctrine does not license a private citizen to kill a tyrant, regardless of whether that tyrant is a usurper or an established ruler. The *Sentences* passage must be read as a provisional statement that is corrected by the later, more rigorous analysis of authority in the *Summa* and *De Regno*. The distinction between usurper and established ruler explains the obligation of obedience, but it does not override the prohibition on private killing. The distinction between foreign and domestic rulers (as seen in the Ehud case) underscores that domestic rulers are protected by the juridical order they inhabit, even when they violate it. For Aquinas, the killing of a tyrant is only lawful when it is an act of public justice, performed by public authority. A private citizen is never the physician of the body politic; at best, they are a limb that must wait for the head to act, or, if the head is diseased and no superior physician exists, they must wait for God. To teach Aquinas as a sanctioner of private tyrannicide is to mistake his early concessions for his final judgment, and to ignore his profound commitment to the principle that violence, to be just, must be public.
