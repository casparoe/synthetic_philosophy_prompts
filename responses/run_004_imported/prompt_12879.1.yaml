  *   Let's sharpen: The coherence arguments *alone* do not suffice. They require auxiliary assumptions about the agent's architecture and environment.
  *   Okay, I will argue that the coherence arguments are *necessary but insufficient*. They explain the *form* of rationality, not the *substance* of danger.

  10. **Finalizing the Plan:**
      *   Intro: Set the stage.
      *   Part 1: The Triviality/Content Objection.
