answer: |-
  **The Limits of Coherence: A Physicist's Assessment of Rational Agency Arguments**

  Having spent four decades designing experiments to test the limits of physical law, I have developed a certain intolerance for equations that look elegant but fail to constrain reality. In physics, a theory that can explain any outcome explains nothing. As I turn my attention to the philosophy of rational agency, specifically the "coherence arguments" underpinning much of the AI risk literature, I find myself applying the same scrutiny. The central claim is seductive in its mathematical simplicity: any agent that does not maximize expected utility (EU) is vulnerable to exploitation (via Dutch books or money pumps); therefore, sufficiently advanced or self-improving agents will inevitably converge on EU maximization.

  This argument is often used as a premise for a darker conclusion: that such agents will necessarily seek power and resources. However, two specific objections threaten to dismantle this chain of reasoning. The first suggests that coherence is trivially satisfiable and implies nothing about dangerous goals; the second suggests that dynamic exploitation can be avoided without adopting EU axioms. After weighing the formal literature against these objections, I offer the following assessment.

  ### The Triviality of Representation

  The first objection strikes at the semantic content of the representation theorem. As noted, any behavior, even that of a rock or a random number generator, can be *post hoc* modeled as maximizing some utility function. If I choose $A$ over $B$, one can simply define $U(A) > U(B)$. If coherence arguments merely establish that an agent *can be described* as an EU maximizer, they are tautological and harmless. A rock maximizes the utility of "being a rock," but it poses no existential threat.

  The AI risk proponent replies that the argument is not about description, but about *guidance*. An agent that *uses* EU maximization as a decision procedure is efficient; it does not waste resources satisfying cyclic preferences. However, this concedes the point: coherence ensures *efficiency*, not *direction*.

  The leap from "coherent" to "power-seeking" requires an auxiliary premise known as *instrumental convergence*. This thesis holds that for a vast range of final goals (utility functions), acquiring resources and power are useful sub-goals. Coherence arguments successfully demonstrate that a self-improving agent will likely purge internal inconsistencies to avoid resource leakage. But they fail to demonstrate that the resulting coherent utility function will be one that values the external world in a way that competes with humans. An agent could coherently maximize a function that values only its own internal state, or a specific, limited interaction with the environment.

  Therefore, the first objection holds significant weight. Coherence arguments establish the *form* of rationality, not the *substance*. They show that a dangerous agent would likely be coherent, but they do not show that a coherent agent must be dangerous. To claim otherwise is to confuse the efficiency of the engine with the destination of the vehicle.

  ### The Dynamic Objection: Foresight and Plans

  The second objection is technically more profound. Standard money-pump arguments assume a myopic agent: one that evaluates each trade in isolation without anticipating future offers. If an agent has cyclic preferences ($A \succ B \succ C \succ A$), a trader can pump money from the agent by cycling through these trades.

  However, a sufficiently advanced agent possesses foresight. It can recognize the cycle before entering it. In the philosophical literature, this is addressed through models of "sophisticated choice" or "resolute choice" (as discussed by McClennen and Ahmed). An agent with preferences over *plans* or *policies* can commit to a strategy that rejects the first trade in the sequence, thereby avoiding the pump without ever satisfying the transitivity axiom required for EU maximization.

  If an agent can avoid exploitation by simply having preferences over temporal trajectories rather than instantaneous states, the coercive force of the money-pump argument dissolves. There is no logical necessity forcing the agent to adopt the VNM axioms; there is only a necessity to avoid losing money, which can be achieved by non-EU means.

  Yet, here we must consider the engineering constraints of superintelligence. While a non-EU agent *can* avoid money pumps via resolute choice, doing so is computationally and architecturally costly. It requires the agent to maintain complex commitments and resist local incentives that contradict its global plan. In contrast, an EU maximizer is locally consistent; its global plan is simply the aggregation of its local choices.

  For a self-modifying AI, internal friction is a bug. Subagents or heuristic modules delegated to solve problems will naturally drift toward EU maximization because it simplifies aggregation and negotiation. If a central system comprises many sub-processes, and those sub-processes are not EU maximizers, the central system becomes vulnerable to internal money pumps. Thus, while foresight provides a *logical* escape hatch from the money-pump argument, optimization pressure provides a *pragmatic* funnel back toward EU structures. The agent need not be logically coerced; it will be engineered (by itself) toward coherence for the sake of scalability.

  ### The Verdict

  We are left with a nuanced picture. The coherence arguments are often presented in the AI safety literature as logical proofs of inevitability: "If you are not an EU maximizer, you will be destroyed, therefore you must become one." My assessment is that this presentation is rigorous only in appearance.

  Regarding the first objection: Coherence arguments **fail** to show that agents must converge on *dangerous* goals. They prove that agents will become efficient, but efficiency is compatible with benign or trivial ends. The fear of power-seeking relies on instrumental convergence thesis, which is independent of coherence theorems.

  Regarding the second objection: Coherence arguments **fail** as strict logical proofs that non-EU agents cannot survive. Agents with preferences over plans can avoid exploitation. However, they **succeed** as arguments about optimization pressure. In the limit of high capability and self-modification, the computational costs of maintaining non-EU consistency (to block money pumps) will likely drive agents toward EU architectures.

  **Definite Verdict:**

  Coherence arguments **do not succeed** in demonstrating that sufficiently advanced agents *must* converge on expected-utility maximization as a matter of logical necessity, nor do they establish that such convergence implies catastrophic risk. The existence of foresight-based defenses (resolute choice) breaks the logical coercion of the money-pump, and the triviality of utility representation decouples coherence from specific goal content.

  However, coherence arguments **do succeed** in identifying a robust *selection pressure*. While non-EU agents are logically possible, they are architecturally fragile. A self-improving system seeking to maximize its own efficacy will likely view non-EU inconsistencies as inefficiencies to be purged. Thus, we should expect advanced agents to *approximate* EU maximization, not because logic forbids otherwise, but because incoherence is a tax on capability that competitive or self-optimizing systems cannot afford to pay. The risk lies not in the mathematics of coherence itself, but in the combination of this structural convergence with the empirical likelihood that high-capability goals will require resource acquisition. Coherence makes the agent dangerous *if* it has dangerous goals; it does not make the goals dangerous *because* of coherence.
