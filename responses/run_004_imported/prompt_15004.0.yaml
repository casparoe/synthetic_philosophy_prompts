answer: |-
  Good evening. For those of you who don't know me, I'm [Name], and I've had the privilege of calling [Bride] my friend for [Number] years.

  When [Bride] asked me to give this toast, she issued a single, rather formidable condition. She said: "Please talk about Émilie du Châtelet. But do not turn her into a greeting card."

  For the family members currently wondering who Émilie is: she was an eighteenth-century mathematician and physicist who translated Newton, debated the nature of fire, and wrote a radical little book called *Discourse on Happiness*. For the reading group members in the back: I know you have your blue pens ready. I promise I will not sanitize the text.

  Because [Bride] is right. Du Châtelet does not offer the standard wedding fare. She does not promise that passionate love is the purpose of existence. She does not claim that the fire of romance burns forever at the same intensity. In fact, she argues quite coolly that passion is a fever, and like any fever, it must eventually break.

  So, why on earth would a mathematician, remarrying at sixty-two, build her wedding around a philosopher who tells us love cools with time?

  I think the answer lies in the freedom of that honesty.

  Du Châtelet teaches us that love is one great good among many, but it is not the *only* good. She writes that to be happy, we must cultivate our taste for study, for the arts, for friendship, and for self-sufficiency. She argues that the person who depends entirely on a lover for their happiness is building a house on a fault line.

  [Bride], you have spent a lifetime building a house that stands on its own foundation. Your work, your mathematics, your fierce intellect—these are yours. No one can give them to you, and no one can take them away. Du Châtelet calls the "taste for study" the steadiest source of happiness because it depends on no one else and does not fade with age. In a world that often tells women their value diminishes as they grow older, you have lived a life that proves the opposite. Your mind is sharper now than it was at thirty. Your capacity for joy is deeper.

  And this is where the groom comes in.

  [Groom], you are not marrying a woman who needs you to complete her. You are marrying a woman who is already whole. Du Châtelet warns us against the "cure" of illusions. She says we need our illusions to be happy; we must not dissect the butterfly to understand its beauty, or we will be left with nothing but dust.

  So, this marriage is not a merger of necessity. It is a voluntary alliance of two independent lives. It is an agreement to share the "illusions" that make life sweet, while respecting the hard truths that keep us grounded. It is an acknowledgment that while the fever of passion may cool, the warmth of companionship—the *tranquility* Émilie prized so highly—is what sustains us through the decades.

  [Bride], you have taught me that happiness is not something that happens to you. It is something you construct, like a proof. You gather your axioms: your health, your friends, your work, your dignity. And then, if you are lucky, you find someone who respects the architecture.

  [Groom], you respect the architecture. You know that her solitude is not a rejection of you, but a requirement of her genius. You know that her happiness is her own responsibility, and yours is yours, and that the magic happens in the space where you choose to overlap.

  Du Châtelet wrote that "the first principle of happiness is to be deceived." But she also wrote that we must have the strength to bear the truth. There is a beautiful tension there. It means we agree to be kind to one another. We agree not to nitpick the magic to death. We agree to let each other keep the gentle stories we tell ourselves about who we are, while offering a hand steady enough to hold when the truth gets heavy.

  This is a second marriage for [Bride], after years of widowhood. It is not a reboot. It is not an attempt to recapture the past. It is a new theorem, derived from different axioms. It is built on the knowledge that time is short, that passion changes shape, and that the greatest luxury we have is the freedom to choose who walks beside us.

  So, let us raise a glass.

  To [Bride] and [Groom].
  May you keep your illusions tender.
  May your love cool into a warmth that never goes out.
  May your study be deep, and your solitude respected.
  And may you find, in this partnership, not the whole point of your lives, but the very best part of them.

  To happiness.
