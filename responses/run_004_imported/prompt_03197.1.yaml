answer: |-
  **Setting:** *A quiet corner of a university coffee shop. The table is cluttered with notebooks, a recorder, and two lukewarm lattes. **Elena** (a moral philosopher sympathetic to Barbara Herman's "limiting condition" view) sits across from **David** (who leans toward Julia Markovits's "coincident reasons thesis"). They are wrapping up an interview for a journalist writing about celebrity charity and moral credit.*

  **Elena:** So, the journalist wants to know if the pop star gets "moral points" for the water well donation if she's doing it to rehab her image.

  **David:** Exactly. And the intuitive answer is "no," but explaining *why* without falling into the trap of saying "only miserable people who hate themselves can be moral" is the hard part.

  **Elena:** That's where Herman saves us. She rescues the agent from having to be a moral monster. You don't have to think "I am doing my duty" while you hand over the check. You can think, "I want to help these people," or even "I want to look good."

  **David:** *Even* "I want to look good"?

  **Elena:** Careful. Herman says the motive of duty doesn't have to be the *primary* motive. It has to be the *limiting condition*. The pop star can want the PR, sure. But for the act to have moral worth, her commitment to morality must be such that if the PR opportunity required her to do something wrong—say, embezzle from the well fund to buy more ads—she would stop. The duty sits in the background like a brake pedal. She's not pressing it, but it's there, connected to the wheels.

  **David:** See, that's where I think Markovits improves the engine. The "brake pedal" metaphor still feels like you're smuggling in a second thought. It smells like Michael Smith's "moral fetishism." Why do we need this background commitment to "The Moral Law" as an abstract authority? Why isn't it enough that the reasons she *actually* acted on happen to be the right ones?

  **Elena:** Because accidents don't get credit. If she donates because she thinks it will buy her votes, and it *happens* to be the right thing to do, that's luck.

  **David:** Markovits agrees! The Coincident Reasons Thesis isn't about luck. It says moral worth exists when the agent's motivating reasons coincide with the *justifying* reasons. If the reason it's right to donate is "it alleviates suffering," and she donates because "I care about alleviating suffering," she has moral worth. She doesn't need to add, "and I care about it *because it is my duty*." That's the "one thought too many" Williams warned us about. If I save my drowning wife because "it is my duty to save spouses," I've missed the point of the relationship. I should save her because I love her.

  **Elena:** But Herman agrees with you there! That's the beauty of the limiting condition. You save the wife because you love her. Herman doesn't demand the duty-motive be the *driving* motive. She just demands that your love isn't the kind of love that would let you drown a stranger to save your wife. The duty limits the *scope* of the love.

  **David:** Okay, but here's the daylight I see. For Herman, the moral worth comes from the *structure of your will*. You have to be the kind of person who subordinates inclination to law. For Markovits, moral worth comes from the *content of your reasons*. You have to be moved by the features that make the act right.

  **Elena:** Is that a difference that makes a difference?

  **David:** I think so. Let's test it. Let's use a case closer to your drowning wife, but with higher stakes. Let's call it **The Fleeing Brother**.

  **Elena:** Go on.

  **David:** Imagine a man, Elias. His brother is in a war zone. Elias smuggles him across the border to safety. It's a dangerous, illegal act, but morally permissible—arguably required—because the brother is a refugee fleeing persecution. Elias does this purely out of family loyalty. He doesn't think about human rights or Kantian maxims. He just thinks, "That's my blood."

  **Elena:** Okay. Herman would say Elias has moral worth *if* his loyalty is bounded by duty.

  **David:** Right. Now, here's the counterfactual. Suppose the brother *wasn't* a refugee. Suppose he was a war criminal fleeing justice for committing atrocities. If Elias would have smuggled him *anyway*, just because he's family, does Elias get moral credit in the actual case where the brother *was* innocent?

  **Elena:** This is exactly where the limiting condition does the work. If Elias would have helped the war criminal just as readily, then his loyalty is blind. It's not constrained by the moral law. In that case, Herman says: No moral worth in the actual case. The fact that he got it right this time was accidental. He didn't respect the boundary between permissible and impermissible aid; he just followed the impulse of loyalty.

  **David:** Okay. Now watch how Markovits handles it. She asks: What were Elias's actual reasons in the *actual* case? Did he help because "he's my brother" (full stop)? Or did he help because "he's my brother *and he's in danger*"?

  **Elena:** Does it matter?

  **David:** It matters for the coincidence. If the reason it was *right* to help was "he is a victim of persecution," and Elias's reason was just "he is my brother," those reasons don't perfectly coincide. "Brother" isn't the same as "Victim." However, Markovits allows that "special obligations to family" can be a right-making feature. But she cares about sensitivity to the truth. If Elias is completely insensitive to the brother's guilt or innocence, then his reason ("he's my brother") is disconnected from the justifying reasons ("he's innocent").

  **Elena:** So you both deny him credit if he's a blind loyalist. Where's the divergence?

  **David:** The divergence is in what we require to *give* him credit. Herman requires a second-order commitment: "I love my brother, *but only insofar as it is moral*." She wants him to have a standing policy that subordinates loyalty to duty. Markovits just wants him to be moved by the facts that make the act right.

  **Elena:** But if he's moved by the facts, doesn't that imply the policy?

  **David:** Not necessarily. Imagine a third version of the case. Elias helps the brother. He believes the brother is innocent. He helps *because* he believes the brother is innocent (wrapped up in the "my brother" package). He doesn't have a philosophical commitment to "Duty as a Limit." He just loves justice and loves his brother. In fact, if you asked him, "Would you help him if he were guilty?" he might say, "I don't know, I hope it never comes to that." He hasn't settled the counterfactual.

  **Elena:** And that's where I'd say he lacks full moral worth. If you haven't settled the counterfactual, your will isn't properly ordered. You're drifting.

  **David:** But Markovits would say: Look at the actual world. In the actual world, he was moved by the truth (the innocence). He wasn't fetishizing "duty." He was responding to the human reality. Herman's view risks making moral worth too internal, too about the agent's self-conception. Markovits makes it about the agent's connection to the world.

  **Elena:** But that connection can be fragile! Let's bring this back to your journalist's pop star. Suppose she donates to the water well. She says, "I love children." That's a nice reason. It coincides with the right-making feature (children need water).

  **David:** Exactly. Coincident Reasons.

  **Elena:** But suppose the PR team comes to her and says, "Actually, if you divert 10% of this to your own clothing line, you can reach *more* children with the rest, but it's technically embezzlement." If she says, "Well, if it helps more kids, sure," she's failed the limiting condition. She's treating duty as optional.

  **David:** Or she's a consequentialist!

  **Elena:** *Laughs.* Fair. But in a Kantian framework, she's failed. Herman's point is that moral worth requires a specific *authority structure* in the will. The Moral Law must be supreme. Markovits tries to bypass the authority structure and just look at the reasons. But reasons don't police themselves.

  **David:** I'd argue they do, if the agent is rational. If I'm moved by "this alleviates suffering," and I realize embezzlement causes systemic suffering, I stop. I don't need a separate "Duty" module in my brain to tell me that. I just need to be consistent in my reasons.

  **Elena:** That's the optimism I worry about. People are great at rationalizing. The "limiting condition" is a firewall against rationalization. It says, "Stop. This category of action is forbidden, regardless of your nice reasons."

  **David:** But that firewall creates the "one thought too many" problem in the positive cases. Go back to the wife drowning. If I pause to check my firewall—"Is saving my wife consistent with the Categorical Imperative?"—I've already waited too long.

  **Elena:** Herman says you *don't* pause! That's the whole point! The firewall is background code. It runs in the background. You jump in because you love her. The firewall only flashes red if you're thinking, "I'll save her and drown that other guy to make sure she lives."

  **David:** Okay, but how do we verify the firewall exists? In your Fleeing Brother case, the only way to test Elias's firewall is to ask him about the war criminal scenario. If he hedges, you say "no worth." But Markovits would look at his actual action. Did he track the truth? If he tracked the truth, he gets the credit.

  **Elena:** Because for you, moral worth is about *accuracy*. For me, it's about *allegiance*.

  **David:** That's good. Allegiance vs. Accuracy.

  **Elena:** If it's just accuracy, then a well-trained dog that fetches the life preserver has moral worth. It's responding to the right features of the situation.

  **David:** A dog doesn't have reasons. It has instincts. We're talking about rational agents. If I help the brother because I recognize his innocence, I'm exercising rational sensitivity. I don't need to pledge allegiance to a Law to be sensitive to reasons.

  **Elena:** But without the allegiance, what happens when the reasons get muddy? Back to the pop star. If her reason is "I want to help," and the PR guy says "This will help more," she goes along. If her allegiance is to Duty, she says "No, that's theft."

  **David:** But if her reason is "I want to help *honestly*," then she also says no. Markovits isn't saying any reason counts. It has to be the *right* reasons. If "honesty" is a right-making feature, and she's motivated by honesty, she's golden. She doesn't need to call it "Duty."

  **Elena:** But "Duty" is the name for the priority of morality over inclination. When "helping" (inclination) conflicts with "honesty" (morality), what wins?

  **David:** The better reason wins.

  **Elena:** And who judges?

  **David:** The agent, hopefully. But look, let's try to find where we actually disagree on the verdict.
  Case: **The Guilty Secret.**
  A friend confesses to a minor crime to you. You keep the secret.
  *Actual World:* The crime was minor, no one was hurt. Keeping the secret preserves the friendship and causes no harm. It's permissible.
  *Counterfactual:* The crime was a murder.
  *Agent:* Says, "I would keep the secret either way. Loyalty is absolute."

  **Elena:** Herman says: No moral worth in the Actual World. His loyalty is unbounded. He got lucky the crime was minor. He didn't act from a will constrained by morality; he acted from a will constrained only by friendship.

  **David:** Markovits says: It depends on *why* he kept the secret in the Actual World. If he kept it because "friendships require trust," and that *is* a valid moral reason in this context, he might have worth. But... if he explicitly says "I don't care if it's murder," that suggests his reason in the Actual World wasn't sensitive to the *harmlessness* of the crime. It was just "Friendship > All."

  **Elena:** So you agree with me?

  **David:** Mostly. But here's the tweak. Suppose he says, "I kept the secret because I value friendship, and in *this case*, the crime was small enough that friendship outweighs reporting." He makes a contextual judgment. He doesn't have a rigid "Duty Firewall." He weighs the reasons.

  **Elena:** And if he weighs them wrongly later?

  **David:** Then he's wrong later. But in the Actual World, if his weighing was correct—if friendship *did* morally outweigh reporting a minor infraction—then his motive coincided with the right-making features. He doesn't need a standing policy of "Duty First." He just needs to be a good weigher of reasons.

  **Elena:** That feels too fragile. It makes moral worth dependent on getting the calculation right every time. Herman gives you credit for the *commitment* to get it right, even if you're not constantly calculating.

  **David:** And I say the commitment is invisible. All we have are the reasons. If the pop star donates for PR, but the PR *requires* the money to actually go to the well (a binding contract), does she have moral worth?

  **Elena:** No. Because her will isn't aligned with the good. She's aligned with the image. The contract is just a cage.

  **David:** Markovits might say: If the contract forces her to do the right thing, and she signs it knowing it forces her to do the right thing... maybe? No, that's stretching it. Her reason is still "Image." That doesn't coincide with "Help."

  **Elena:** Okay, so on the PR case, we converge. The celebrity gets no credit.

  **David:** We converge on the verdict. But the *explanation* matters for your article. If you use Herman, you tell readers: "It's about your internal structure. Are you the kind of person who would stop if the PR went bad?" If you use Markovits, you tell readers: "It's about your focus. Are you looking at the suffering, or at the cameras?"

  **Elena:** "Internal Structure" vs. "External Focus."

  **David:** Exactly. Herman worries that if you don't have the structure, you're a ticking time bomb. I worry that if you focus on the structure, you become self-absorbed, checking your own moral purity instead of checking the world's needs.

  **Elena:** *Sips cold latte.* So, for the piece... maybe the tension is the point? The internet argues about whether celebrities "mean it."

  **David:** Herman says "Meaning it" means having the brake pedal installed. Markovits says "Meaning it" means looking at the road, not the dashboard.

  **Elena:** And the reader has to decide which failure is worse. The person who loves the right things but might lose control? Or the person who has perfect control but is always watching their own hands?

  **David:** I'd buy that. One last thing, though. The drowning wife.

  **Elena:** What about her?

  **David:** If Elias jumps in to save his brother, and he *never* thinks about the limits... is he better or worse than the guy who jumps in while thinking, "I am permitted to prioritize kin"?

  **Elena:** Herman says the first guy is fine, *provided* the limit is dispositional. He doesn't need to think it. But if he *wouldn't* stop if it was wrong, he's dangerous.

  **David:** And Markovits says if he jumps in because "It's my brother," and that *is* the right reason, he's perfect. We don't need to probe the counterfactual guilt to judge the actual love.

  **Elena:** But we do need to probe it to judge the *worth*. Because worth isn't just about the act. It's about the will.

  **David:** Then maybe the article's headline writes itself. "Do We Judge the Act, or the Will?"

  **Elena:** A bit dry. How about: "The Brake Pedal and the Road."

  **David:** *Smiles.* I'll let the journalist decide. But I think you've got your daylight. Herman wants to know what stops you. I want to know what moves you.

  **Elena:** And if what moves you never needs stopping?

  **David:** Then we're both happy. But that's rare.

  **Elena:** Agreed. Rare enough to keep us employed, anyway.
