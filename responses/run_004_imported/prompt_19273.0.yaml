      *   **Goal:** Avoid "Church vs. Science" shorthand. Show genuine theological wrestling.
      *   **Specific Task:** Compare Galileo's use of the "accommodation principle" in the *Letter to the Grand Duchess Christina* (1615) with Augustine's articulation (e.g., *The Literal Meaning of Genesis*).
      *   **Focus:** Conceptual comparison. Where does Galileo restate Augustine? Where does he extend/repurpose it? Does applying it to a live astronomical controversy fit Augustine's spirit or strain it?
      *   **Format:** Self-contained comparison, 400-500 words.
      *   **Utility:** Distinctions must be usable as substance for a scene (notes, internal monologue, dialogue), not just background history.

  2.  **Information Retrieval (Internal Knowledge):**
      *   **Augustine on Accommodation:** Primarily in *De Genesi ad litteram* (The Literal Meaning of Genesis). Key idea: Scripture speaks in the language of appearances to be understood by the simple/unlearned. It's not interested in teaching physics/astronomy. If a scientific fact is demonstrable, Scripture shouldn't be interpreted literally against it, to avoid scandalizing non-believers. However, Augustine emphasizes caution: don't accept scientific theories lightly as proven if they aren't.
      *   **Galileo on Accommodation:** *Letter to the Grand Duchess Christina*. Key idea: Scripture's primary purpose is salvation. It uses language accommodated to the vulgar crowd. Nature is written by God in the language of mathematics. If demonstration proves a natural fact, Scripture must be reinterpreted.
      *   **Comparison Points:**
          *   *Similarity:* Both agree Scripture isn't a science textbook; both agree language is adapted to human capacity.
          *   *Difference (Crucial):* Augustine's caution vs. Galileo's confidence. Augustine warns against accepting unproven scientific claims before reinterpreting Scripture. Galileo claims he *has* the demonstration (Copernicanism).
          *   *Difference (Scope):* Augustine deals with Genesis creation narratives (past). Galileo deals with current planetary motion (present observational data).
