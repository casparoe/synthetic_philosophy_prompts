  4.  **Evaluate Argument 3: The Susan Wolf Connection ("Moral Saints"):**
      *   *Concept:* Wolf's 1982 paper "Moral Saints" argues that a life dedicated entirely to moral perfection is unattractive, lacking in personal interests, and potentially harmful to social bonds.
      *   *Comparison:* Franklin says perfect orderliness might be "foppery," risk being "envied and hated," and that faults keep friends "in countenance."
