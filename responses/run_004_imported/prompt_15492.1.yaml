      *   **(5) Deepak:** "That objection proves too much... nobody ever bothers deriving the contradiction hiding in most casual claims either..."
          *   *Analysis:* Deepak argues that logical omniscience isn't required, but *avoiding explicit contradiction* is. If you say "A and not A," you are irrational even if no one points it out.
