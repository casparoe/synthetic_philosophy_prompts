      *   Q1: The "Verbal Dispute" trap.
      *   Q2: MMK 13.8 (Emptiness as a view).
      *   Q3: Candrakirti's "No Thesis".
      *   Q4: Scope (Tathagata vs. Table).
      *   Q5: Two Truths mapping (Where does the contradiction live?).
      *   Q6: The Fourth Corner semantics (Gap vs. Glut).
      *   Q7: Soteriological mechanism (How does paradox liberate?).
      *   Q8: Historical methodology (Logic vs. Hermeneutics).
      *   Q9: Normativity of Logic (Should we think this way?).
      *   Q10: Comparison to Ineffability (Mysticism charge).

      *Refining Follow-ups:* Ensure they push past the standard "It's about *svabhava*" defense.

