          *   Tone: Academic, rigorous, respectful but probing.

  2.  **Deconstruct the Philosophical Landscape:**
      *   **The Paraconsistent Reading (Garfield/Priest):** Logic allows true contradictions (dialetheism). The fourth corner (neither) or sometimes the conjunction of corners can be true. Emptiness implies that reality transcends classical bivalent logic.
      *   **The Prasangika/Traditional Reading (Tsongkhapa/Thakchoe):** Negations are *prasajya* (non-implicating). We aren't saying "A and not-A" is true; we are saying "A (inherently existing)" is false, "not-A (inherently existing)" is false, etc. It's a reductio ad absurdum of essentialism, not an assertion of paradoxical ontology.
      *   **Key Tension:** Is Madhyamaka a metaphysics of paradox or a therapeutic deconstruction of metaphysics?
      *   **Key Texts:** MMK (especially Ch. 18, 22, 25), *Vigrahavyavartani*, *Prasannapada*.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Genuine Contradiction vs. Reified Negation.*
          *   *Draft:* How is your view different from Tsongkhapa's?
          *   *Critique:* Too simple. Needs to address the "verbal dispute" risk.
          *   *Refinement:* Focus on the truth-conditions. If I say "X is empty," do I mean "X exists and doesn't exist" or "X doesn't exist inherently"?
          *   *Follow-up:* If he says "it's about logic," ask about soteriology.

      *   *Requirement 2: Self-Refutation (MMK 13.8).*
          *   *Draft:* Isn't saying contradictions are true a view?
          *   *Critique:* Standard objection. Needs to be sharper.
          *   *Refinement:* Connect the *content* of the view (paraconsistency) to the *act* of holding a view. If emptiness cures all views, does paraconsistent logic become a new dogma?
          *   *Follow-up:* If he says "it's a therapeutic tool," ask why it needs to be *true* rather than just *useful*.

      *   *Requirement 3: Prasangika "No Thesis".*
          *   *Draft:* Candrakirti says we have no thesis. How do you fit?
          *   *Critique:* He has definitely answered this before (likely: "no thesis about svabhava, but thesis about convention").
          *   *Refinement:* Push on the *illocutionary force*. If I assert a true contradiction, am I not asserting a thesis about the nature of reality?
          *   *Follow-up:* Distinguish between asserting a logic vs. asserting an ontology.

      *   *Requirement 4: Scope (Tathagata vs. General).*
          *   *Draft:* Does this apply to everything or just the Tathagata?
          *   *Critique:* A bit dry.
          *   *Refinement:* If it applies to "the table exists," does that mean tables are true contradictions? If only soteriological topics, is it ad hoc?
          *   *Follow-up:* If ad hoc, charge with instrumentalism. If general, charge with absurdity.

      *   *Need 4-6 more questions to reach 8-10.*
          *   *Idea 5: The Two Truths.* How does paraconsistency map onto the two truths? Is the contradiction on the conventional or ultimate level? (Crucial distinction).
          *   *Idea 6: The Fourth Corner.* Specifically, what does "Neither exists nor does not exist" mean in paraconsistent logic? Is it a truth-value glut or gap?
          *   *Idea 7: Soteriological Efficacy.* Does believing in true contradictions actually help liberation, or is it intellectual gymnastics?
          *   *Idea 8: Historical Anachronism.* Address the "Western logic imposed on Eastern text" critique directly but subtly.
          *   *Idea 9: The Status of Logic.* Is logic normative or descriptive in Madhyamaka?
          *   *Idea 10: The "Inexpressible".* How does this differ from the Upanishadic "neti neti" or ineffability readings?

  4.  **Refining and Polishing (Adding the Follow-ups):**
      *   *Self-Correction on Follow-ups:* The prompt asks for follow-ups keyed to the *likely* answer. The scholar is a Garfield/Priest defender. They usually argue that classical logic presupposes *svabhava*. So the follow-ups need to trap that move.
      *   *Tone Check:* Ensure it sounds like a grad student who has done the reading, not a hostile interrogator. Use terms like *prasajya*, *svabhava*, *illocutionary*, *dialetheia*.

  5.  **Final Review against Constraints:**
