  *(Final Polish)*: Ensure the "Hanson" point is clear. Robin Hanson's argument is roughly: If you think your priors are better than others', you're claiming your brain was generated by a truth-tracking process while others weren't. But you should view your own brain as a random draw from the genetic lottery. Marcus needs to defend the "random draw" having legitimate unique value.

