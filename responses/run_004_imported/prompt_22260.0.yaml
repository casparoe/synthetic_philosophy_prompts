answer: |-
  First off, don't feel embarrassed at all. This is widely considered one of the trickiest technical hurdles in contemporary metaphysics. Lewis himself called it the "Big Bad Bug" of his own theory. It is notoriously difficult to visualize because it requires thinking about how the *definition* of a law changes depending on how the story ends.

  Here is a concrete toy model to help you see the mechanics of the **Undermining Futures** problem, followed by the Anti-Humean contrast.

  ### The Toy World: "The 10-Flip Universe"

  To make this graspable, let's shrink the universe down. Imagine a world that exists for only a brief moment, during which exactly **10 coin flips** occur.

  **The Setup:**
  *   **The Mosaic:** The total history of the world is just the list of 10 outcomes (e.g., H, T, H, H, T...).
  *   **Where we are:** We are standing at **Flip #5**. Flips 1–4 have happened. Flips 5–10 are in the future.
  *   **The Past (1–4):** Heads, Tails, Heads, Tails. (Perfectly 50/50 so far).
  *   **The Humean Rule:** The "Laws of Nature" (and thus the Objective Chances) are whatever axioms appear in the *Best System* that describes the **entire** 10-flip history (Past + Present + Future). The Best System balances *Simplicity* (short rules) and *Strength* (predictive accuracy).

  **Step 1: The Current Best System**
  Based on the past (2H, 2T) and our background knowledge of coins, the system that best describes the world *right now* is:
  *   **Law L1:** "This is a Fair Coin."
  *   **Chance:** $P(\text{Heads}) = 0.5$.

  According to **L1**, any specific sequence of the remaining 6 flips is possible. Some are unlikely, but none are impossible.

  **Step 2: The "Undermining" Future**
  Now, consider a specific future sequence, let's call it **Future F**:
  *   **Future F:** Flips 5 through 10 are **ALL HEADS**.

  According to our current Law **L1** (Fair Coin), what is the chance of **Future F** happening?
  *   It is $0.5^6$ (approx 1.5%).
  *   **Crucial Point:** This number is **greater than zero**. So, according to the current laws, **Future F is possible.**

  **Step 3: The Undermining Kicks In**
  Now, imagine **Future F actually happens**. The universe ends. We now have the *complete* Humean Mosaic (the God's-eye view of all 10 flips):
  *   **Total History:** H, T, H, T, **H, H, H, H, H, H**.
  *   **Total Count:** 8 Heads, 2 Tails.

  Now we ask the Humean question again: *Given this **total** history, what is the Best System?*
  *   **System L1 (Fair Coin):** Says we should expect 5H/5T. We got 8H/2T. That's a bad fit.
  *   **System L2 (Biased Coin):** Says "This coin lands Heads with 80% probability." This fits the data much better.
  *   **System L3 (Deterministic):** Says "This coin always lands Heads" (except for two flukes).

  In Lewis's framework, if the future is "Heads-heavy" enough, the *Best System* for the total history might shift from **L1 (Fair)** to **L2 (Biased)** or **L3 (Always Heads)**.

  **Step 4: The Contradiction**
  Here is the headache:
  1.  **Right Now:** The objective chance of Heads on Flip #5 is **0.5** (because the Best System *now* is L1).
  2.  **If Future F happens:** The objective chance of Heads on Flip #5 becomes **0.8 or 1.0** (because the Best System for the *total* history is now L2 or L3).

  But wait—Flip #5 is *part* of Future F.
  *   If the chance of Flip #5 being Heads is really 0.5, then Future F is unlikely.
  *   But if Future F *happens*, it proves the chance was actually higher (0.8 or 1.0) all along.

  This violates the **Principal Principle**. The Principal Principle says your credence in an event should match the objective chance.
  *   If you know the Humean theory is true, you know that if Future F happens, the laws *were different* than they seem now.
  *   So, you can't simply set your credence to 0.5. You have to think: "If I bet on Heads, and I win, I might prove that the chance was actually 1.0, which makes my current belief that it's 0.5 false."
  *   Lewis realized that on his view, **the present chance depends on the future outcome.** But intuitively, the future outcome should depend on the present chance, not the other way around.

  ### Why the Anti-Humean Doesn't Have This Problem

  Your friend is exactly right. Here is the distinction:

  **The Humean (Lewis):**
  *   **Laws/Chances supervene on the Mosaic.**
  *   Think of the Mosaic (all events) as the **foundation** and the Laws as the **roof**. You can't know what the roof looks like until you've laid every single brick in the foundation (past, present, and future).
  *   Therefore, adding future bricks (Flip #6–10) can change the shape of the roof (the Law), which retroactively changes the "strength" of the bricks laid earlier (the Chance at Flip #5).

  **The Anti-Humean (Armstrong, Dretske, Tooley):**
  *   **Laws are primitive relations between Universals.** (e.g., $N(F, G)$).
  *   Think of the Law as a **generator** or a **engine** that exists *at the time of the event*.
  *   The coin at Flip #5 has an intrinsic **propensity** or causal power. Let's say it has a real, physical propensity of 0.5.
  *   **The Future cannot change the Present Propensity.**
  *   If Flips 6–10 all come up Heads, the Anti-Humean says: "That was just a lucky streak. The propensity at Flip #5 *was* 0.5. The future outcomes don't get to vote on what the law was in the past."
  *   For the Anti-Humean, the laws *govern* the mosaic; the mosaic does not *constitute* the laws. Therefore, a future sequence can be improbable without "undermining" the law that made it improbable.

  ### Summary for your Seminar

  *   **The Problem:** For Lewis, Laws = Best Description of Total History. If the future is weird enough, it changes the "Best Description," which changes the "Objective Chance" of the present. This makes present chances dependent on future facts.
  *   **The Conflict:** This clashes with the Principal Principle (which says chance should guide belief *now*).
  *   **Lewis's Patch:** Lewis eventually admitted this was a bug. He proposed a **"Revised Principal Principle"** (sometimes called the New Principle). Basically, he said: "Rational credence should match the chance, *conditional on the laws not being undermined by the future*." It's a bit of a band-aid, but it saves the theory from contradiction.
  *   **Anti-Humean Advantage:** Because they view laws as transcendent relations (not summaries of history), the future cannot retroactively alter the present chance. A 0.5 propensity is a 0.5 propensity, even if the next million flips are all Heads.

  If you bring this up in office hours, mentioning the **"10-Flip Universe"** and asking *"Does the Best System for the total history override the Best System available at t?"* will show you've really grasped the supervenience issue. Good luck!
