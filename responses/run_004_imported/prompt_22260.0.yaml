          *   Future (6-10): H, H, H, H, H.
          *   Total Mosaic (1-10): H, T, H, T, [Flip 5], H, H, H, H, H.
          *   If Flip 5 is H: Total is 8H, 2T. Best System might be "Biased towards H ($P=0.8$)" or "Always H".
          *   If Flip 5 is T: Total is 7H, 3T. Best System might be "Biased towards H ($P=0.7$)".
          *   *Crucial Point:* The "Undermining" usually refers to a future that is *possible* according to current chances but *would change the laws* if it occurred.
          *   *Lewis's specific worry:* There is a future $F$ such that $Ch(F) > 0$ (it's possible), but if $F$ occurs, the laws/chances are different than they are now. So $Ch(F)$ according to current laws is $x$, but if $F$ happens, $Ch(F)$ according to the laws *fixed by F* is... well, the laws change.
