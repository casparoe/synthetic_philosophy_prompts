      *   *Refining the Augustine point:* Pascal agrees with Augustine on the *reality* (it is robbery/force), but diverges on the *political response*. Augustine condemns; Pascal explains the *necessity* of the compromise in a fallen world. This necessity *is* the proof of the Fall.

