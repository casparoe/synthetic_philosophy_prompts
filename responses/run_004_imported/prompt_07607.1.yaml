      *   *Resolution:* Augustine is speaking from the City of God perspective. Pascal is speaking from the perspective of the *wretchedness of man without God* (the "first step" of the apology). Pascal is describing the *Fall*. The fact that we *must* resort to force proves we lack true justice.
      *   *Apologetic Function:* This is the strongest point. Pascal isn't writing a political treatise; he's writing an apology. He needs to show the human condition is contradictory and broken. The fact that we have to *make* strength just shows we cannot *be* just. This creates the "God-shaped hole." If human justice were possible, we wouldn't need Grace. The failure of political justice points to the need for Divine Justice.
      *   *Conclusion:* It's not a contradiction with Augustine; it's a psychological/sociological elaboration of *why* the robbery exists and why we tolerate it. It serves the apologetic aim by demonstrating human wretchedness.

