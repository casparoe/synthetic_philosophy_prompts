      *   *Nuance:* In Move 5, the fire analogy is tricky. Fire is external technology. Music is internal processing + external sound. I need to point out that distinction.
      *   *Terminology:* Ensure the distinction between *adaptation* (historical process) and *adaptive* (current utility) is clear. This is a common pain point in evo-psych.

  6.  **Final Polish:** Check tone. Ensure it sounds like it's speaking to a fellow cognitive scientist (use terms like "canalization," "consilience," "null hypothesis").

      *(Self-Correction on Move 4)*: Marcus's point about language is strong. If Dana accepts language as an adaptation, she needs a principled reason to distinguish music. If she can't, she looks inconsistent.
      *(Self-Correction on Move 5)*: Dana's "Just-So" critique is the strongest philosophical point. Adaptationism is notoriously hard to falsify.

      *(Conceptual Check)*: The "Spandrel" term is often misused. Gould & Lewontin meant architectural byproduct. In biology, it's a non-adaptive correlate. But if it *becomes* useful later, it's an exaptation. Music is likely an exaptation at least. I need to emphasize this.

