answer: |-
  This is a classic debate in evolutionary psychology and cognitive science, effectively a reenactment of the Pinker vs. Miller/Dissanayake/Mithen skirmishes of the late 90s and early 2000s. Since you're in the weeds of this professionally, I'll skip the introductory fluff and dive straight into the argumentative structure.

  Here is the move-by-move breakdown of who holds the stronger logical position at each step, followed by the conceptual pitfalls both are stepping over.

  ### Move-by-Move Analysis

  **Move 1: Dana (The Null Hypothesis)**
  *   **Claim:** Music is a byproduct (spandrel) of language, auditory scene analysis (ASA), and motor sequencing. It is "auditory cheesecake."
  *   **Strength:** This is the methodologically conservative position. In science, you generally do not posit a new functional mechanism unless existing mechanisms fail to explain the data. We *know* the brain adapts for language and ASA; we do not *know* it adapted for music. Parsimony favors Dana here.
  *   **Weakness:** It assumes the "substrate" (language/ASA) explains the *specificity* of the output. Why does music have specific syntactic structures distinct from language? Why is it emotionally potent in ways language isn't?
  *   **Verdict:** **Dana wins on burden of proof.** She correctly establishes that "byproduct" is the default null hypothesis until specific evidence forces an adaptationist explanation.

  **Move 2: Marcus (The Positive Case)**
  *   **Claim:** Music meets standard criteria for adaptation: universality, canalized development, dedicated reward circuitry, and fitness correlations (sexual selection).
  *   **Strength:** Marcus is using the standard Tooby & Cosmides toolkit for identifying adaptations. The appeal to "dedicated reward circuitry" is his strongest empirical point; if music were merely a parasitic hijack, we might expect it to be processed cognitively without triggering deep mesolimbic reinforcement systems.
  *   **Weakness:** Correlation is not causation. Reward circuitry is domain-general (food, sex, drugs, music). Triggering dopamine proves salience, not evolutionary history. Universality can be cultural, not genetic.
  *   **Verdict:** **Marcus wins on evidentiary accumulation.** He successfully shifts the debate from "Is it possible it's a spandrel?" to "Does it look enough like an adaptation to warrant the label?"

  **Move 3: Dana (The Historical Constraint)**
  *   **Claim:** Universality/development are expected if music free-rides on universal systems (language). Reward = pleasure, not function. Burden is on adaptationists to show historical selection (no fossils).
  *   **Strength:** This is a rigorous Gouldian point. She correctly identifies that if System A (language) is an adaptation and is universal, and Music is a byproduct of System A, Music will *also* appear universal and developmentally stable. She exposes the "Reward = Function" fallacy.
  *   **Weakness:** She is setting an impossibly high bar for "historical selection." By demanding a "fossil record of mate choice," she creates a standard that would disqualify many accepted adaptations (e.g., specific phobias, facial recognition).
  *   **Verdict:** **Dana wins on philosophical rigor.** She correctly identifies that Marcus's evidence is compatible with her hypothesis, but she risks making her position unfalsifiable by demanding impossible historical data.

  **Move 4: Marcus (The Consilience/Consistency Check)**
  *   **Claim:** The "no fossil" standard is a trap. We accept language/pair-bonding as adaptations based on convergent evidence. Music meets that same bar.
  *   **Strength:** This is Marcus's strongest move. He attacks Dana's consistency. If Dana accepts language as an adaptation (which most cognitivists do) despite the lack of Pleistocene fossils, she must explain the principled difference between language and music. If the evidence types are the same, the conclusion should be the same.
  *   **Weakness:** The analogy might be weak. Language has clearer fitness costs (aphasia is devastating) and benefits (coordination) than music. The "convergent evidence" for language is arguably denser.
  *   **Verdict:** **Marcus wins on pragmatic consistency.** He forces Dana to either reject language as an adaptation (untenable) or admit that her standard for music is unfairly stricter than for other cognitive traits.

  **Move 5: Dana (The "Just-So" Defense)**
  *   **Claim:** Adaptationist stories are unfalsifiable narratives. Cultural universality (like fire/cooking) doesn't imply genetic adaptation.
  *   **Strength:** She invokes the core Gould & Lewontin critique: Adaptationism is a "pan-adaptationist" narrative engine that can explain any outcome post-hoc. The fire/cooking analogy is potent: everyone cooks, but no one claims we have a "cooking gene."
  *   **Weakness:** The fire analogy is category error. Fire is external technology; music involves internal neural processing and motor control. Cultural universals *can* exist without genetic adaptation, but neural specialization (claimed by Marcus) is harder to explain via culture alone.
  *   **Verdict:** **Draw / Slight edge to Dana.** She successfully highlights the epistemological risk of adaptationism, but her analogy blurs the line between cultural and biological universals.

  ---

  ### What Both Are Getting Wrong (The Conceptual Muddle)

  As a PhD student in cog sci, you likely sense that the terms themselves are doing too much heavy lifting. Here are three conceptual traps both Dana and Marcus are walking into, which is why they can't close the argument.

  **1. The Spandrel/Exaptation/Adaptation Binary**
  They are treating these as mutually exclusive categories, but Gould and Vrba (1982) specifically distinguished **exaptation** from spandrels.
  *   **The Trap:** Dana argues music is a *spandrel* (non-adaptive byproduct). Marcus argues it is an *adaptation* (selected for its current function).
  *   **The Reality:** It is highly probable music began as a spandrel (byproduct of language/ASA) but became an **exaptation** (co-opted for social bonding/group cohesion) later in hominid history.
  *   **Why it matters:** If music is an exaptation, Dana is right about the *origin* (byproduct), but Marcus is right about the *maintenance* (selection pressure kept it because it aided group cohesion). They are arguing about different timeframes. Dana is talking about *genesis*; Marcus is talking about *sustenance*.

  **2. The Definition of "Music" (Lumping vs. Splitting)**
  They are treating "music" as a single trait. In evolutionary biology, this is dangerous.
  *   **The Trap:** "Music" includes rhythm, melody, harmony, singing, dancing, and instrument use.
  *   **The Reality:** Rhythm might be an adaptation for motor coordination/group synchrony (Marcus's point). Perfect pitch might be a byproduct of auditory scene analysis (Dana's point). Singing might be sexual selection; instrumental music might be cultural technology.
  *   **Why it matters:** By arguing about "Music" as a monolith, they allow each other to cherry-pick evidence. Marcus points to rhythm for adaptation; Dana points to harmony for byproduct. They need to decompose the phenotype.

  **3. Gene-Culture Coevolution (The Baldwin Effect)**
  Both are implicitly assuming a "genes first, behavior second" model.
  *   **The Trap:** Dana treats culture (universality) as distinct from biology. Marcus treats biological markers (reward circuitry) as distinct from cultural practice.
  *   **The Reality:** Music is a prime candidate for the **Baldwin Effect**. A cultural invention (proto-music) creates a niche. Individuals better at processing that niche have higher fitness. Over time, genes assimilate the learning bias.
  *   **Why it matters:** If gene-culture coevolution is in play, the question "Is it genetic or cultural?" is false. It is both. The "universality" Dana dismisses as cultural could be the *driver* of the genetic adaptation Marcus sees.

  ### Summary for Your Lunch Group
  If you want to intervene, don't pick a side. Point out that **Dana is winning the historical argument** (we lack evidence for the *origin*), while **Marcus is winning the functional argument** (we have evidence for current *utility* and neural cost).

  The stalemate exists because they are using "Adaptation" to mean two different things:
  1.  **Historical Adaptation:** Did selection *create* this trait? (Dana says No).
  2.  **Current Adaptiveness:** Is this trait *maintained* by selection now? (Marcus says Yes).

  Music is almost certainly a **cultural exaptation that became biologically entrenched.** Acknowledging that dissolves the binary they're fighting over.
