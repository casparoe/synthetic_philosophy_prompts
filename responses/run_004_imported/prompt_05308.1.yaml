      *   **Standing to Blame:** This is the ethical nuance. Even if the claim is *true*, do I have the *right* to make it? Philosophers like Fritz Allendorf or T.M. Scanlon have written on this. The idea is that blame is a communicative act that requires a certain moral relationship.
