  Ok this has been bugging me since last week and I want an actual answer, not just vibes lol. Got into it with my brother at a family dinner - I called him out for guilt tripping our mom about money, and he just goes "you did literally the same thing to her two years ago, so who are you to talk." Thing is, he's not wrong, I did do that. But I can't decide if that actually means his comeback holds up, or if I just look bad while still being right.

  Can you write me an essay on hypocrisy and the standing to blame? Like, is there an actual difference between someone lacking the standing (or authority, or whatever) to call you out, versus their criticism just being unjustified on the merits? Get into whether being a hypocrite really changes something morally - maybe you forfeit some kind of standing, temporarily or for good - or if its really just a separate character flaw that doesn't touch whether the original criticism was true. Also worth getting into: does it matter if the hypocrite has since cleaned up their act, or doesn't even realize they're being hypocritical? Don't just lay out both sides and shrug - actually pick a verdict, even if its a conditional one, cause I kinda need to know what to say back to him.
