answer: |-
  **Arthur (Hartian):** Let's clear the table on the Grudge Informer first. You want to say the Nazi statute wasn't law because it was wicked. I say it was law—valid, enacted, sovereign command—but morally monstrous. The postwar court should have admitted that and passed a retroactive statute to punish the wife. Honesty over fiction.

  **Lon (Fullerian):** And that honesty comes at the cost of justice. If you call it law, you grant it a dignity it didn't earn. My point isn't just that Nazi law was evil, Arthur. It's that a system which ignores the eight principles of legality—secrecy, retroactivity, contradiction—fails to function *as law*. It becomes mere managerial direction.

  **Arthur:** That's the leap I can't follow. You've moved from "Nazi law was evil" to "Nazi law wasn't law because it was inefficient." In your 1964 book, you call these principles the "inner morality of law." But in my review, I told you: these are just principles of efficacy. They are the craft of using rules to guide behavior.

  **Lon:** Craft implies morality when the craft is governance.

  **Arthur:** Does it? Consider my poisoner. To poison a victim effectively, I must follow strict internal rules: correct dosage, correct timing, no contamination. If I botch the dose, I fail *as a poisoner*. Does adhering to those technical standards make poisoning virtuous? Is there an "inner morality" of poisoning?

  **Lon:** That analogy is seductive, but it fails. Poisoning is a one-way act of manipulation. Law is a reciprocal relationship between ruler and ruled. The poisoner wants the victim *not* to know the rules; the legislator wants the subject *to* know them.

  **Arthur:** But why does that reciprocity make it moral? A bank robber and a security guard are in a reciprocal relationship. The robber studies the guard's patterns; the guard studies the robber's. If the guard follows "principles of efficacy"—shifts, patrols, codes—he's better at his job. That doesn't make the security system morally good, just functional. You're conflating "good law" with "law that works."

  **Lon:** You're treating law like a gun pointed at society. I'm talking about law as a framework for agency. If I pass a secret rule, I am not guiding your conduct; I am setting a trap. When I punish you for violating a rule you couldn't know, I am treating you as a object to be managed, not an agent capable of following rules. That denial of agency is a moral wrong, not just a technical failure.

  **Arthur:** So, if I rule by secret decree but I do it consistently, and I achieve social order, you say I have no law?

  **Lon:** I say you have force. You might have order. But you don't have law. Law implies a fidelity to the enterprise of subjecting human conduct to rules. If you violate the inner morality consistently enough, the enterprise collapses. You can't make a secret rule public tomorrow that you punished someone for yesterday. That's not law; it's violence wearing a costume.

  **Arthur:** But you're assuming the goal of the system is to guide responsible agents. What if the goal is terror? A totalitarian regime *wants* uncertainty. Retroactive laws create fear. Contradictory statutes ensure everyone is technically guilty of something. That system is highly "efficient" at producing submission. Your principles of legality would actually hinder their evil ends.

  **Lon:** Would it? If every official interprets the contradictory statute differently, the system descends into chaos. To sustain terror, the tyrant eventually needs a cadre of enforcers who know the *real* rules. Once those enforcers demand clarity for themselves, the inner morality creeps back in. You cannot sustain a complex system of social control without some fidelity to the rules, even among the oppressors.

  **Arthur:** That's an empirical gamble, Lon. And even if you're right, you've only proved that legality is instrumentally useful for long-term stability. You haven't proved it's *moral*. A stable slavery system is still slavery. If I follow all eight principles but use them to enforce apartheid—clear, public, prospective, consistent apartheid—have I satisfied your "inner morality"?

  **Lon:** You've satisfied the *procedural* requirements, yes. But you cannot fully separate the procedure from the substance. To treat people as responsible agents capable of following rules is to acknowledge their dignity. If you pass clear, public rules that strip them of basic human standing, you create a tension. The form promises agency; the substance denies it. That friction generates the resistance that eventually breaks the regime.

  **Arthur:** That's hopeful thinking. History is littered with efficient, clear, prospective evil. My worry is this: by defining morality *into* the concept of law, you blunt our ability to criticize it. If I say, "This is a valid law, but it is too wicked to obey," I take a moral stand. If you say, "This is not law," you've turned a moral question into a semantic definition. You let the judge off the hook.

  **Lon:** And your way lets the legislator off the hook! You tell the tyrant, "As long as you follow the sovereign command rule, you are making law. The morality is separate." I am telling the legislator: "You cannot make law unless you respect the conditions that make law possible." It imposes a moral duty on the lawgiver, not just the subject.

  **Arthur:** It imposes a duty of craftsmanship. Go back to the poisoner. If I tell the poisoner, "You aren't a real poisoner unless you use arsenic, not rat poison," I'm not making a moral claim. I'm defining the craft. You want to say that governing badly is like using the wrong poison—it just doesn't work. But governing badly *does* work, Arthur. People get crushed.

  **Lon:** It works like a broken clock works. It might strike the hour once a day, but it isn't telling time. If I issue a command that is impossible to obey—say, "All citizens must be in two places at once"—I haven't made a hard law. I've made nonsense. When the state speaks nonsense, it forfeits its claim to authority. That isn't just inefficiency; it's a betrayal of the trust required for law to exist.

  **Arthur:** Trust is external. Law is a social fact. I can identify the Nazi statutes by looking at the Reichsgesetzblatt. I don't need to ask if they respected human agency. You're asking judges to look at a statute and say, "This is too unclear to be law." That invites judicial subjectivity. Who decides what is "clear enough"?

  **Lon:** The same people who decide what is "reasonable doubt" or "due process." You trust judges with liberty, Arthur, but not with legality? The eight principles aren't vague aspirations. They are concrete failures. Was the law published? Was it retroactive? Did the official follow their own rule? These are factual inquiries.

  **Arthur:** They are factual inquiries about *quality*, not *existence*. A car with no brakes is a bad car. It is still a car. If you say "It is not a car," you confuse the category with the evaluation. I want to be able to say, "This is a law, and it is a brakeless car, and therefore we must stop it." You want to say, "Since it has no brakes, it was never a car," which implies we don't need to brake it, it just doesn't exist.

  **Lon:** But if it's not a car, you don't drive it. That's the point. If the court recognizes the Nazi statute as "law," it grants it a presumption of obedience. By denying its legal character, the court reclaims the citizen's freedom. You worry about semantic honesty; I worry about moral complicity.

  **Arthur:** And I worry that your "inner morality" becomes a shield for the status quo. If law *must* have a moral core, then existing law *must* be somewhat moral. It biases the system toward conservation. My positivism is radical: it says law is just power organized by rules. That makes it easier to see when we need to revolt.

  **Lon:** And my natural law is radical too: it says power organized without fidelity to rules is just banditry. You separate law and morality to protect morality from law. I connect them to protect law from becoming banditry. We both hate the Grudge Informer's outcome. You think my method obscures the choice. I think your method sanitizes the weapon she used.

  **Arthur:** I think your method confuses the map. You want the definition of "law" to do the work of justice. But definitions don't save people. Courageous judges do.

  **Lon:** And courageous judges need a theory that tells them they *can* say "no." Your theory tells them they can only say "yes, but it's wicked." Mine tells them they can say "no, this isn't law."

  **Arthur:** And mine tells them: "Yes, it is law, which is why you must accept the cost of overturning it." You want the victory for free. I demand we pay the price of retroactivity to be honest about what we're doing.

  **Lon:** Some prices shouldn't be paid. If the law violates the inner morality, it has already broken the contract. The debt is void.

  **Arthur:** Then we're back to who decides when the contract is broken. And that, Lon, is where the real fight begins.

  **Lon:** Agreed. But at least my fight admits the contract exists.
