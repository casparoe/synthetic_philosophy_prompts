      *   **Conclusion:** Reiterate the ethical weight of the observation.

  4.  **Drafting the Content (Iterative refinement):**

      *   *Intro:* Validate the user. It's not just confirmation bias. It's a recognized phenomenon.
      *   *Hacking's Framework:* This is the star of the show.
          *   *Indifferent Kinds:* Quartz, fractures, bacteria. They don't care what we call them.
          *   *Interactive Kinds:* People, diagnoses, social identities. They react to the name.
