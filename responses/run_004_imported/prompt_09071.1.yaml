      *   **Question:** Is this confirmation bias, self-fulfilling prophecy, sloppy diagnostics, or something fundamentally different about classifying people vs. things? What are the implications for the program?
      *   **Needs:** Vocabulary/concepts from philosophy of science/psychiatry, validation of their intuition, analysis of the mechanism, and practical implications.

  2.  **Identify Key Philosophical/Sociological Concepts:**
      *   *The Director's View:* Natural Kind (realism). A fracture is a natural kind; it exists independently of human classification.
      *   *The User's View:* Interactive Kind / Human Kind. The classification changes the thing classified.
      *   *Key Thinker:* Ian Hacking. This is the exact scenario he describes in *The Social Construction of What?* and *Making Up People*. He coined the term "Interactive Kinds" vs. "Indifferent Kinds."
      *   *Related Concepts:*
