      *   *Labeling Theory:* Mention sociological roots (Lemert's primary/secondary deviance). Primary = the act, Secondary = the reaction to the label.
      *   *The Director's Error:* She is operating under *Medical Realism* (diagnoses are like diseases). The user is seeing *Social Constructionism* (in a specific, non-dismissive sense). It's not that the pain isn't real, but the *category* shapes the experience.
      *   *Is it "Sloppy"?* Not necessarily. It's inherent to human sciences. Better instruments won't fix it because the target moves.
      *   *Implications:*
