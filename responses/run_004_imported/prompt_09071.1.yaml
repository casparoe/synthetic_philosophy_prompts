  3.  **Structure the Response:**
      *   **Validation:** Acknowledge the user's insight is sharp and philosophically grounded, not just "overanalyzing."
      *   **Core Concept (The "Vocabulary"):** Introduce Ian Hacking's "Interactive Kinds" vs. "Indifferent Kinds." This directly addresses the fracture comparison.
      *   **Mechanism 1: The Individual Level:** Labeling Theory and Self-Concept. How the teen internalizes the label.
      *   **Mechanism 2: The Systemic Level:** The Looping Effect. How the classification system changes based on the classified people.
      *   **Critique of the Director's Analogy:** Explain why the fracture analogy fails (Indifferent vs. Interactive).
