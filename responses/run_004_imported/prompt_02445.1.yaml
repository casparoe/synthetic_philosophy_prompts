      *   *Key Implication 2: Community & Practice.* Kripke's solution is communal. Science *is* a communal practice. Peer review, replication, and consensus are the "skeptical solution" in action.
      *   *Key Implication 3: Instrumentalism vs. Realism.* Kripkenstein pushes towards instrumentalism (rules are tools for agreement) rather than realism (rules capture the "true" essence of nature).
      *   *Key Implication 4: The "Grue" vs. "Quus" distinction.* Goodman's Grue is about projectibility of predicates. Kripke's Quus is about the content of intention. In physics, we care more about Grue (projectibility) than Quus (what was in Newton's head).

