      *   *The Fluctuation Hypothesis (1895/1897):* In *Nature* (1895) and replies to Zermelo, Boltzmann suggested the universe as a whole is in thermal equilibrium (maximum entropy). We live in a small "world" (sub-region) that happens to be in a rare fluctuation away from equilibrium.
