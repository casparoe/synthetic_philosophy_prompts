answer: |-
  The problem of hypocritical blame concerns the "standing" to blame: why does a hypocrite's own misconduct undermine their authority to condemn others, even when the target of the blame is genuinely guilty? To answer this, we must distinguish between two leading theoretical frameworks: the reciprocity-based account and the equal-standing account. While both agree that hypocrisy undermines standing, they locate the defect in fundamentally different places. This divergence becomes critical when testing the accounts against the case of the "reformed hypocrite."

  ### Locating the Wrong

  The **reciprocity-based account** locates the wrong of hypocritical blame in the **inconsistency of normative demands**. On this view, moral obligations are reciprocal; to hold someone else to a standard, one must accept that same standard for oneself. The defect is essentially one of fairness or procedural integrity. When a hypocrite blames, they enforce a double standard: they demand compliance from the blamed while implicitly exempting themselves from that same demand. The wrong lies in the *transaction* of blame itself, which becomes unfair because the blamer is unwilling to "pay the same price" they are demanding of the other. The focus is on the *content* of the will: do I will this rule for you and for me?

  The **equal-standing account** locates the wrong in the **presupposition of moral authority**. On this view, blame is a speech act that presupposes a specific relationship between agents: that of moral peers within a shared normative community. To blame someone is to address them as an equal who is capable of understanding and adhering to shared norms. The hypocrite's own conduct falsifies this presupposition. By violating the very norm they invoke, the hypocrite undermines their own status as a participant in good standing within that moral community. The wrong lies not merely in unfairness, but in a **false claim to parity**. The hypocrite attempts to occupy a position of moral authority (the one who judges) that their own actions have forfeited. The focus is on the *status* of the blamer: am I fit to address you as a moral equal on this matter?

  ### The Case of the Reformed Hypocrite

  Consider the "reformed hypocrite": an agent who previously committed the offense they now condemn, but has since ceased the behavior and sincerely regrets their past actions. They are no longer actively violating the norm, nor do they claim an exemption from it.

  **1. The Reciprocity Verdict: Full Standing**
  The reciprocity account predicts that the reformed hypocrite retains **full standing** to blame (provided their reform is genuine).
  *   **Why:** The defect in reciprocity is the *current* enforcement of a double standard. It asks: "Does the blamer currently exempt themselves from the demand they are making?" Since the reformed hypocrite has stopped the behavior and sincerely regrets it, they are no longer exempting themselves. They are currently willing the norm for themselves just as they are for the blamed. Because the inconsistency of will has been resolved, the unfairness is removed. For the reciprocity account, moral standing is largely concurrent with conduct; once the conduct aligns with the demand, the standing is restored. The past violation is morally relevant to the agent's history, but it does not logically invalidate the *current* consistency of their demand.

  **2. The Equal-Standing Verdict: Diminished or Contingent Standing**
  The equal-standing account predicts that the reformed hypocrite has **diminished or contingent standing**, rather than full standing.
  *   **Why:** On this account, standing is a matter of moral status within a community, not just logical consistency. While sincere regret signals a desire to return to the community of moral equals, status is not instantly restored by the cessation of wrongdoing. The hypocrite's past conduct damaged the relational parity required for blame; they demonstrated a lack of commitment to the shared norms that undergird that parity. While reform is necessary to regain standing, it may not be sufficient on its own. The "shadow" of the past violation lingers on their authority. To regain *full* standing, the agent may need to do more than simply stop and regret; they may need to make amends or demonstrate a sustained commitment over time to rebuild the trust necessary for moral parity. Thus, their standing is likely diminished relative to a non-offender, or contingent upon further reparative acts.

  ### Evaluation: Which Account is More Defensible?

  The **equal-standing account** offers the more defensible verdict overall.

  The reciprocity account's prediction of "full standing" clashes with robust moral intuitions regarding authority. Consider a person who embezzled funds for years, stopped last month, and now vehemently condemns a colleague for a minor expense report error. Even if the reformed embezzler is genuinely committed to honesty *now*, we intuitively feel they lack the *authority* to cast the first stone. The reciprocity account struggles to explain this intuition because it treats the wrong as a logical inconsistency in current demands. If the agent is currently consistent, the account declares the blame valid. This renders moral standing too fragile and ahistorical; it suggests that moral authority can be turned on and off like a switch with the latest action.

  The equal-standing account captures the **temporal and relational depth** of moral responsibility. It recognizes that standing is a form of social and moral capital that can be depleted. By locating the wrong in the falsification of moral parity, it explains why the reformed hypocrite's history matters: their past actions disrupted the relationship of equality that gives blame its force. This account aligns better with the intuition that while reform is commendable, it does not instantly erase the deficit in authority caused by past hypocrisy. It allows for a nuanced verdict where the reformed hypocrite is not silenced forever (as a "no standing" verdict might imply) but must acknowledge that their voice carries less weight until their status is fully rehabilitated.

  Therefore, because it better accounts for the lingering effects of past misconduct on moral authority, the equal-standing account provides a more sophisticated and intuitively satisfying explanation of the ethics of blame.
