prompt: |-
  So for a side-project podcast a few of us in the history-of-science program run (mostly just for other grad students, nothing fancy) we're doing an "in character" episode where a friend plays Isaac Newton and can only answer using stuff he actually wrote, and I got handed the theology episode instead of the physics one everyone's already done a million times. Can you draft me 8-10 interview questions that don't just let him restate "I was a believer, next question"? I want at least one on why he kept his antitrinitarian conclusions private for decades and even had Locke shop the "Two Notable Corruptions of Scripture" piece around anonymously before pulling it back at the last minute, one on the tension between his own warnings against date-setting in the Daniel/Apocalypse commentary and his calculation that the world can't end before 2060, one on whether the designer in the General Scholium's "counsel and dominion" argument is meant to be the same God as the strictly unitarian one from his private manuscripts (and if so why the published text stays so quiet about it), and one connecting his alchemical hunt for "active principles" to his belief that true original religion had degenerated into idolatry over time -- same recovery project to him, or two things that just happened to run in parallel? For each question throw in a follow-up keyed to whatever answer or dodge he's most likely give, i don't want him able to just restate the position and move on. thanks!
