      *   *The Core Argument:* Justice is subjective/uncertain. Force is certain/observable. Therefore, to have order, we must unite justice and force. Since we can't make the just strong, we make the strong just.
      *   *The Tension:* He isn't *endorsing* might makes right as a moral truth; he's describing it as a tragic political necessity due to human corruption (Original Sin). He acknowledges true justice exists (in God), but earthly justice is corrupted by custom and force.
      *   *The "Tyranny" Point:* He does say force alone is tyranny. This implies a standard of justice exists, even if unattainable politically without force.
      *   *The "Mystical Foundation" Point:* He argues laws are based on custom, not pure reason. Telling the populace this undermines authority. This is pragmatic/conservative, arguably elitist.
      *   *Hobbes Comparison:* Hobbes sees the State of Nature as war; Sovereign power creates order. Pascal sees human reason as fallen; Custom/Force creates order to prevent chaos, but it's not *true* justice, just necessary order.

