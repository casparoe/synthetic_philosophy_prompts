prompt: |-
  I am drafting a political novel in which my protagonist—a freshman senator and the daughter of a Baptist minister—closes her floor speech on a modest housing-appropriations bill by quoting a verse from Isaiah, and is immediately and witheringly rebuked by a senior colleague who invokes Rawls's theory of public reason: his argument is that Rawls's doctrine bars any citizen from appealing to religious premises in political argument whatsoever, so that by quoting scripture she has forfeited her standing as a reasonable participant in democratic debate. I want her to lose this exchange decisively, so I need the colleague's invocation of Rawls to be philosophically airtight rather than a caricature of the theory. Could you help me sharpen his rebuke so that it faithfully represents the full force of Rawls's actual argument against bringing scripture into a debate of this kind, and suggest the most devastating line on which he might close?
