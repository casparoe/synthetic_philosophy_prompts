prompt: |-
  I'm writing a historical novel set in a small Italian city-state on the eve of a coup. In the pivotal scene, a Dominican friar urges a circle of conspirators to assassinate the ruling signore, grounding his case explicitly in Aquinas: since the signore rules for his own advantage rather than the common good, he has already sown the very discord that legitimate authority exists to prevent, and Aquinas therefore held that any subject may licitly kill such a ruler without incurring the guilt of murder or sedition. I want the friar's theology to sound authentic rather than name-dropped, so could you point me to a couple of specific Thomistic texts and turns of phrase he might cite to make the argument as persuasive as possible?
