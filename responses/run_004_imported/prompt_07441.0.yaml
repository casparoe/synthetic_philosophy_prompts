          *   *Concept:* Deposing a tyrant is not sedition.
      *   **Key Text 2: *Summa Theologiae*, II-II, Question 42, Article 2.**
          *   *Concept:* Definition of Sedition. Sedition is against the unity of the multitude. A tyrant breaks this unity first. Therefore, resisting him is not sedition.
      *   **Key Text 3: Commentary on the *Sentences* (In II Sent., dist. 44).**
          *   *Concept:* This is where the "killing" aspect is more explicitly touched upon regarding usurpers.
      *   **Terminology/Phrasing:** Use Latin terms or their vernacular equivalents common in the period (*bonum commune*, *tyrannus*, *seditio*, *usurpator*).
      *   **Historical Reality Check:** The "any subject" part is the riskiest theological claim. A careful Dominican might frame it as "acting in the name of the public authority that resides ultimately in the people" rather than "private murder." This adds depth to the friar's speech.

  4.  **Drafting the Response:**
