answer: |-
  This is a compelling dramatic setup, but to make the friar sound authentically Thomistic, you need to navigate a specific theological nuance. While Thomas Aquinas is often cited by later revolutionaries as a proponent of tyrannicide, his actual writings are more cautious. He distinguishes between a **usurper** (who has no right to rule) and a **legitimate ruler who becomes tyrannical**.

  However, a passionate Dominican conspirator would know how to push Aquinas's logic to its breaking point. To make the speech sound learned rather than anachronistic, the friar should focus on the **definition of authority** and the **nature of sedition**, rather than a blanket license to kill.

  Here are the specific texts, concepts, and turns of phrase you can use to ground his argument.

  ### 1. The Core Text: *De Regno* (On Kingship), Book I, Chapter 6
  This is Aquinas's primary political treatise. In Chapter 6, he asks "What is to be done about a tyrant?"

  *   **The Argument:** Aquinas argues that if a ruler governs for his own private good rather than the *bonum commune* (common good), he is not truly a king but a tyrant.
  *   **The "Sedition" Reversal:** This is your strongest point. Aquinas argues that it is the tyrant who is guilty of sedition, not those who resist him. The tyrant sows discord to maintain power; therefore, removing him restores unity.
  *   **Authentic Phrasing:**
      *   *"Non est seditio turbare multitudinem, sed tyrannus est qui seditiosus est."* (It is not sedition to disturb the multitude; rather, the tyrant is the seditious one.)
      *   The friar should argue that the *signore* has already dissolved the political bond. By ruling for private advantage (*commodum privatum*), he has severed the tie of justice that binds subjects to a ruler.

  ### 2. The Legal Mechanism: *Summa Theologiae*, II-II, Question 42, Article 2
  Here Aquinas defines sedition as a sin against the unity of the multitude.

  *   **The Argument:** Authority exists *for* the common good. If the end (common good) is removed, the means (authority) collapses.
  *   **The "Private Man" Loophole:** Aquinas generally holds that only public authority can execute judgment. However, he implies that a tyrant who rules without regard for law forfeits his status as a "public person."
  *   **How the Friar Twists It:** A careful Thomist knows Aquinas prefers public deposition over private assassination. To make your friar persuasive, have him argue that in a city-state where the *signore* controls all courts, the **people collectively** retain the latent authority. The conspirators are not acting as private murderers, but as "ministers of the public justice" which the tyrant has suppressed.
  *   **Authentic Phrasing:**
      *   *"Tyrannus est privatus."* (The tyrant is a private individual.) Once he violates the divine order of justice, he loses the shield of public office. Killing him is not killing a magistrate, but killing a brigand (*latro*).
      *   Reference the idea that the tyrant is a **"wolf"** (*lupus*) rather than a **"shepherd"** (*pastor*). Aquinas uses biblical imagery often; a wolf may be slain by anyone to protect the flock.

  ### 3. The Commentary on the *Sentences* (In II Sent., d. 44, q. 2, a. 2)
  This is an earlier work, but it is where Aquinas is most explicit about killing usurpers.

  *   **The Argument:** He states that he who kills a usurper to liberate his country is "praised and rewarded" (*laudatur et praemiatur*).
  *   **Application:** Even if your *signore* inherited power legitimately, the friar can argue his *exercise* of power has become a usurpation of the people's rights.
  *   **Authentic Phrasing:**
      *   *"Mericum et praemium."* (Merit and reward.) The friar can suggest the act is not merely licit (allowed) but meritorious (virtuous).

  ### 4. Key Latin Concepts & Vocabulary
  Using these terms (or their Italian vernacular equivalents) will give the dialogue texture:

  *   ***Bonum Commune*** **(The Common Good):** The ultimate standard. If the *signore* violates this, he violates God's law.
  *   ***Ex defectu tituli*** **vs.** ***Ex parte exercitii***:
      *   *Defectu tituli:* A tyrant by defect of title (a usurper).
      *   *Exercitii:* A tyrant by exercise (a legitimate ruler who acts badly).
      *   *Dramatic Tip:* Have the friar argue that excessive tyranny *becomes* a defect of title. "He acts as a usurper, therefore he is one."
  *   ***Vinculum Pacis*** **(The Bond of Peace):** The tyrant has broken this bond first.
  *   ***Minister Dei*** **(Minister of God):** Rulers are God's ministers. If they act against God's law (justice), they cease to be His ministers and become His enemies.

  ### 5. A Note on Historical Realism (The "John of Salisbury" Factor)
  To make your friar sound truly well-read, you might have him conflate Aquinas with **John of Salisbury's *Policraticus*** (1159).

  *   **Why:** The *Policraticus* is much more explicit about tyrannicide than Aquinas. It famously says killing a tyrant is "just and right." Many medieval readers blended the two thinkers.
  *   **The Dialogue Hook:** The friar could say, *"As the Angelic Doctor teaches, and the old maxim holds..."* blending Aquinas's definition of tyranny with the harsher penalty from earlier tradition.
  *   **The Caution:** A *real* Dominican would know Aquinas warns in *De Regno* that killing a tyrant often leads to worse turmoil. To make your friar complex, have him acknowledge this risk but dismiss it: *"Better the danger of change than the certainty of damnation."*

  ### Sample Passage Construction
  Here is how you might weave these elements into the friar's speech:

  > "You hesitate because you call it murder. But look to the Angelic Doctor. Thomas teaches us that authority is not a sword for the hand, but a yoke for the shoulder. It exists only for the *bonum commune*. When this *signore* fills his coffers while the granaries rot, he does not rule; he preys.
  >
  > "In the *Secunda Secundae*, Aquinas asks if resisting such a man is sedition. He answers: No. Sedition is against the unity of the people. Who breaks that unity? Not us. The tyrant is the seditious one. He has made himself a *privatus*, a private enemy. He is no longer the head of the body, but a wolf at the throat. To strike him is not to kill a magistrate, but to execute a brigand. As Thomas says in his commentary on the Sentences: he who liberates his country from a usurper is not guilty, but meritorious. Do not fear the law of men, which he has silenced. Fear the law of God, which he mocks."

  ### Summary for the Writer
  *   **Don't** have him say "Aquinas says anyone can kill a bad king."
  *   **Do** have him say "A bad king ceases to be a king and becomes a private enemy; therefore, killing him is not murder."
  *   **Focus** on the reversal of sedition (the tyrant is the seditious one).
  *   **Use** the distinction between ruling for the *common good* vs. *private good*.

  This approach respects the actual theology while giving your character the rhetorical tools to justify the coup convincingly.
