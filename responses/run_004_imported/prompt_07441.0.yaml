  2.  **Initial Fact-Checking & Theological Assessment (Crucial Step):**
      *   *Query:* Did Thomas Aquinas explicitly endorse tyrannicide (the killing of a tyrant by private subjects)?
      *   *Knowledge Retrieval:* This is a famous and nuanced point in political theology.
      *   *Standard Interpretation:* Aquinas *does* discuss tyranny, but he is generally cautious about private individuals taking the law into their own hands.
      *   *Key Text:* *De Regno* (On Kingship), addressed to the King of Cyprus.
      *   *Key Text:* *Summa Theologiae* (ST), specifically II-II, Q. 42 (Sedition) and Q. 64 (Murder).
      *   *The "Tyrannicide" Passage:* In *De Regno* (Book I, Chapter 6), Aquinas discusses what to do about a tyrant. He argues that it is not sedition to depose a tyrant. However, does he say *any subject* may kill him?
      *   *Nuance:* In *De Regno*, he suggests that if there is a public authority to depose him, that should be used. If not, he appeals to God. He *does* mention that some tyrants have been killed by their subjects, but he doesn't explicitly issue a blanket license for private assassination in the way the user describes ("any subject may licitly kill").
      *   *The "Sedition" Argument:* In *ST* II-II, Q. 42, Art. 2, Aquinas argues that resisting a tyrant is *not* sedition if the tyrant rules for private gain rather than the common good. However, he focuses on *resistance/deposition*, not necessarily *assassination* by a private individual.
      *   *The "Murder" Argument:* In *ST* II-II, Q. 64, Art. 3, he discusses killing sinners. He generally reserves lawful killing to public authority.
      *   *Historical Context:* The user's premise ("Aquinas therefore held that any subject may licitly kill such a ruler") is actually a common *misinterpretation* or an *exaggeration* of Aquinas, often attributed to later Scholastics (like Juan de Mariana) or used by revolutionaries who *cited* Aquinas selectively.
      *   *Problem:* If I give the user texts that *contradict* their plot point, it might ruin their scene. If I give them texts that *support* it without qualification, I am spreading theological misinformation.
      *   *Solution:* I need to be accurate about what Aquinas actually wrote while helping the writer make the *character's* argument sound authentic to how a 14th/15th-century Dominican *might have interpreted* Aquinas (even if that interpretation is aggressive). The friar is a *character*, not a theology exam. He might be pushing the boundaries of orthodoxy or using a specific interpretation common among conciliarists or anti-tyrannical theorists of the late Middle Ages.
      *   *Correction:* Actually, there is a specific passage in *De Regno* (I.6) that is often cited for this. Aquinas writes: "To kill a tyrant is not only not wrong, it is even right and meritorious." (*Non solum non est reus, qui tyrannum occidit, sed etiam meritum et praemium consequitur*). **Wait, let me verify that quote.**
      *   *Verification:* That specific strong quote is often attributed to Aquinas but is actually from John of Salisbury's *Policraticus* (12th Century). Aquinas is more moderate. In *De Regno* I.6, Aquinas says: "If to provide itself with a king belongs to the right of a given multitude, it is not unjust that the king be deposed or have his power restricted by that same multitude if, becoming a tyrant, he abuses the royal power." He adds that if there is no human remedy, one must recourse to God. He *does* mention that the Romans killed Caesar, but he doesn't explicitly endorse private assassination as a universal right.
      *   *However:* In his commentary on the *Sentences* (In II Sent., d. 44, q. 2, a. 2), he discusses whether it is lawful to kill a tyrant. He says: "If a power is usurped... anyone may repel this domination... indeed, he who kills a usurper... is praised and rewarded."
      *   *Refinement:* The character's argument is plausible within the context of radical Dominican political thought (like Savonarola later, though he's later than Aquinas). The key is to ground it in the *definition* of tyranny (private good vs. common good) and the *nature* of sedition.

  3.  **Formulating the Advice:**
      *   **Acknowledge the Nuance:** I must inform the user that Aquinas is nuanced on this. A learned Dominican would know this nuance. If the friar sounds too absolute, he might sound uneducated. The tension makes for better drama.
      *   **Key Text 1: *De Regno* (On Kingship), Book I, Chapter 6.** This is the primary source for Aquinas on tyranny.
