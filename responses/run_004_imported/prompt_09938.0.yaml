  Ok, this is a bit of a rabbit hole but it's been bugging me. At work I do a lot of formal verification stuff (TLA+, model checkers), and I recently found out the 'Kripke structures' we use to model system states are literally named after the philosopher Saul Kripke, because of his possible-worlds semantics for modal logic. That sent me down a wikipedia hole, and it turns out Kripke and David Lewis actually disagreed about something pretty basic: can the same object literally exist in more than one possible world, or does 'it could've turned out differently' just mean a similar-enough 'counterpart' of it exists in a different world instead? Can you compare counterpart theory and transworld identity properly for me -- what each side actually claims, why Lewis thought counterparts were even neccessary, and whether Kripke's way of handling identity across worlds actually solves the problem or just relabels it? And is this a case where both sides are secretly just picking different bookkeeping for the same math, or does some actual modal claim come out true on one view and false on the other?
