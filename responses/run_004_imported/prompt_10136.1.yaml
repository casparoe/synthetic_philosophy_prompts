      *   **User:** PhD student in formal epistemology.
      *   **Topic:** I. J. Good's Theorem (1967) on the value of information.
      *   **Task:** Construct a detailed, realistic scenario where a fully rational agent is *strictly worse off* in expectation by receiving free evidence before acting.
      *   **Constraints:**
          *   Do not use trivial objections (evidence isn't costless, preference for ignorance/story spoilers).
          *   Diagnose exactly which premise of Good's Theorem is being exploited/violated.
