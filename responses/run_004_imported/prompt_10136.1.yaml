      *   Strictly worse off? Yes (Positive profit vs Zero).
      *   No "costless" cheats? Yes (Report is free, reaction is a state change).
      *   No "preference for ignorance"? Yes (Utility is monetary).
      *   Diagnose premise? Yes (Exogeneity of States / Single-Agent).
      *   Why theorem survives? Yes (Scope limitation to passive environments).

