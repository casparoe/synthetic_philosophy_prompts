prompt: |-
  so this is for my AP Euro class (we're doing this whole unit on mercantilism and Adam Smith rn) and we have this project where everyone gets assigned a historical person and has to survive a live "interview" in front of the class, where a partner asks the questions and you answer in character. i got Smith, and my teacher literally said if anyone's questions are just the invisible-hand/division-of-labor stuff she's taking off points bc "that's the SparkNotes version," so i'm trying to get ahead of it by writing my own questions and handing them to my partner to read off.

  i've been going through the parts of Wealth of Nations that are actually about colonies and empire (book 4, not the stuff that's always in the textbook excerpts) and its way weirder than i expected. like he thinks the whole British empire in america was basically a "golden dream" that never even paid for itself, but he ALSO defends the Navigation Acts on defense grounds even tho that goes against basically everything else he says about free trade, and apparently he had this whole plan where the colonies would just get seats in parliament instead of a revolution happening (i think he compares it to Scotland's union with England at some point?), and he's super harsh about the East India Company basically being a trading company that accidentally became a goverment and was bad at both jobs. my friend doing the same project keeps saying Smith was just "anti-empire" full stop, but that doesn't seem right to me from what i've read, more like he had a problem with one specific kind of empire (the monopoly/mercantile kind) and not empire as such.

  can you write me like 8-10 interview questions that get into that stuff instead of the basics? i want at least one question on the Navigation Acts/defense exception thing, one on the "golden dream" bit and whether empire ever actually paid for itself, one on the parliament-representation idea and why he thought it could actually work, and one on the East India Company as a sovereign that's also a business. for each question can you also give a quick note on what Smith would probably answer and then a natural follow-up that pushes back on that answer, so it's not just him saying his one line and being done. pls no "what got you interested in economics" type questions, those are exactly what my teacher is warning us about.
