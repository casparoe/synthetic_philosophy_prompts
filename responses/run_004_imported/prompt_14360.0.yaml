          *   East India Company (Business vs. Sovereign).
      *   **Format:** 8-10 questions. Each needs the main question, a note on Smith's likely answer (based on historical text), and a natural follow-up that pushes back (to make it dynamic).
      *   **Tone:** Academic but engaging, suitable for a high school AP level role-play. Avoid generic bio questions.

  2.  **Deconstruct Adam Smith's Views (Book 4 of *Wealth of Nations*):**
      *   *Mercantilism:* Smith hates the mercantile system (monopolies, hoarding gold). He thinks it benefits producers/merchants at the expense of consumers.
      *   *Colonies:* He thinks the discovery of America was huge, but the *management* of it by Britain is wasteful. The "golden dream" is that colonies enrich the mother country; Smith says the cost of defense and administration outweighs the monopoly profits.
      *   *Navigation Acts:* Generally bad for free trade, *but* he makes a famous exception: "Defense is of much more importance than opulence." So he supports them for national security.
      *   *American Crisis:* Writing during the American Revolution. He suggests granting colonies representation in Parliament (like the Act of Union with Scotland) to keep the empire together peacefully. He doubts it will happen but thinks it's the logical solution.
      *   *East India Company:* A monopoly that governs. Smith argues traders make bad sovereigns. They exploit rather than develop. He's very critical of their corruption and violence in India.
      *   *Empire:* He isn't "anti-empire" in a modern anti-imperialist sense. He's anti-*mercantile* empire. He thinks free trade would bind nations together better than political subjugation.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Attempt 1 (Mental Outline):*
          1.  Navigation Acts?
          2.  Did colonies make money?
          3.  What about America revolting?
          4.  East India Company bad?
          5.  Mercantilism vs. Free Trade?
