          *   Follow-up: Americans want independence, not seats in a distant Parliament. Is this naive?

      *   *Drafting Question 4 (East India Company):*
          *   Q: The EIC is powerful. Is that good?
          *   Smith's Point: Sovereigns shouldn't be merchants. Conflict of interest.
          *   Follow-up: If the Crown takes over, won't they just be bad sovereigns too?

      *   *Drafting Question 5 (Mercantilism vs. Empire):*
