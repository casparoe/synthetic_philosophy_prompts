answer: |-
  This is a fantastic approach. Your teacher is right—most students stop at "free trade good, mercantilism bad," but Smith's actual views on empire in *Book 4* are nuanced, pragmatic, and sometimes contradictory (like the defense exception). Focusing on the *administration* of empire rather than just the *theory* of trade will definitely set you apart.

  Here are 10 interview questions designed to hit those specific Book 4 arguments, complete with "Cheat Sheet" notes on how Smith would answer and a follow-up to keep the pressure on.

  ### Interview Script: Adam Smith on Empire & Commerce

  **1. The Navigation Acts Paradox**
  *   **Interviewer:** "Mr. Smith, your entire book argues that restrictions on trade are harmful to national wealth. Yet, you explicitly defend the Navigation Acts, which restrict colonial trade to British ships. Is this not a contradiction?"
  *   **Smith's Note:** Admit the contradiction but prioritize security. Smith argues that "defense is of much more importance than opulence." The Acts weaken potential rivals (like the Dutch) and strengthen Britain's navy.
  *   **Follow-Up:** "But if defense justifies one restriction, couldn't any merchant claim their monopoly is vital for national security? Where do you draw the line before 'defense' just becomes an excuse for protectionism?"

  **2. The "Golden Dream" of Colonies**
  *   **Interviewer:** "Many in Parliament believe the American colonies are a 'golden dream' that will permanently enrich the mother country. You suggest the opposite. Have the colonies actually paid for themselves?"
  *   **Smith's Note:** No. In peacetime, the monopoly profit doesn't cover the cost. In wartime, the cost of defending them vastly outweighs any tax revenue or trade profit. Britain is bleeding money to keep them.
  *   **Follow-Up:** "Surely the raw materials and exclusive markets are worth the cost of a little blood and treasure? Are you suggesting Britain would be richer today if it had simply ignored America entirely?"

  **3. The East India Company's Dual Role**
  *   **Interviewer:** "Let's turn to the East. The East India Company acts as both a merchant and a sovereign ruler in India. Do you see this as a model for future expansion?"
  *   **Smith's Note:** Absolutely not. "Sovereign and merchant" are incompatible characters. Traders care about profit, not the welfare of the people they govern. They will oppress the locals to maximize dividends, which destroys the long-term economy.
  *   **Follow-Up:** "If the Company is unfit to govern, should the British Crown take direct control? Or do you argue that Britain should withdraw from governing India altogether?"

  **4. Preventing the American Revolution**
  *   **Interviewer:** "Violence is currently erupting in Massachusetts. If you were advising the King today, how do you stop a full-scale revolution without surrendering the colonies?"
  *   **Smith's Note:** Grant them representation. Propose a union similar to the Act of Union with Scotland. Let them send members to Parliament and tax them directly, rather than through clumsy external duties.
  *   **Follow-Up:** "The colonists are shouting 'No Taxation Without Representation,' but many seem to want independence, not a seat in London. Is your plan too little, too late?"

  **5. The Scotland Analogy**
  *   **Interviewer:** "You frequently cite the union with Scotland as a success story. But Scotland shares a border with England. America is an ocean away. Is that comparison actually valid?"
  *   **Smith's Note:** The principle is what matters, not just the geography. Scotland was poor and jealous of England; union brought capital and freedom, and the jealousy vanished. Distance makes administration harder, but political unity removes the cause of war.
  *   **Follow-Up:** "But the logistical reality of governing across the Atlantic is different than governing Edinburgh from London. Doesn't the delay in communication make a unified Parliament impractical, regardless of the principle?"

  **6. The Cost of Monopoly vs. Free Trade**
  *   **Interviewer:** "Critics say that without the mercantile system, Britain loses its leverage over other nations. If we open our ports to everyone, what power do we retain?"
  *   **Smith's Note:** The power of the market. If Britain is the most efficient producer, other nations *need* us. Monopoly forces trade artificially; free trade creates natural dependencies that are more stable than political subjugation.
  *   **Follow-Up:** "That assumes other nations play by the same rules. If France keeps its markets closed while we open ours, aren't we just handing them our wealth while they hoard theirs?"

  **7. Who Benefits from Empire?**
  *   **Interviewer:** "If the empire is so costly to the public, who is pushing so hard to maintain it? Who actually benefits from this system?"
  *   **Smith's Note:** The merchants and manufacturers. They use the state to crush their competition. The general public (the consumers) pays higher prices and higher taxes to fund wars that only help a small elite.
  *   **Follow-Up:** "These merchants are powerful voters and donors to the Crown. How do you expect to convince a government to give up a system that enriches its most influential supporters?"

  **8. The Future of the Capital**
  *   **Interviewer:** "You argue that if America breaks away, British capital won't vanish. Where does that money go if the colonial market is lost?"
  *   **Smith's Note:** It finds new, more efficient uses. It will trade with Europe, the East Indies, or develop domestic industry. Capital is like water; it flows to where the profit is highest, not where the government points it.
  *   **Follow-Up:** "But in the short term, wouldn't that transition cause massive unemployment for sailors and workers currently tied to the colonial trade? Is the 'long term' worth the immediate suffering?"

  **9. "Jealousy of Trade"**
  *   **Interviewer:** "Nations view each other like rival gamers—one's gain is another's loss. You call this the 'jealousy of trade.' Why is this mindset dangerous?"
  *   **Smith's Note:** Because trade is not war. If your neighbor gets rich, they can buy more of your goods. Wealth is not a fixed pie. Jealousy leads to wars that destroy the wealth you were trying to protect.
  *   **Follow-Up:** "That sounds idealistic in a world where nations are constantly arming themselves. If a rival nation uses its wealth to build a navy to attack us, isn't their economic gain literally our existential threat?"

  **10. The Role of the State**
  *   **Interviewer:** "If we strip away the monopolies, the colonial administration, and the trade restrictions, what is left for the government to do regarding the economy?"
  *   **Smith's Note:** Very little. Defense, justice, and public works (roads/bridges) that private men can't profit from. The rest should be left to the "natural liberty" of individuals to pursue their own interest.
  *   **Follow-Up:** "So your ideal state is passive? If a famine strikes or a industry collapses, the government just watches to ensure 'natural liberty' isn't violated?"

  ### Tips for Playing Smith in Class:
  *   **Don't be a modern libertarian:** Smith isn't against *all* government. He supports the Navigation Acts for defense (Question 1). Make sure you acknowledge that exception; it shows you read the text deeply.
  *   **Focus on the "Consumer":** Whenever asked who benefits, Smith always sides with the **consumer**, not the producer. Merchants want high prices; the public wants low prices. Empire helps merchants, hurts the public.
  *   **Tone:** Be polite but firm. You are a moral philosopher (which Smith was first). You aren't just talking about money; you're talking about justice and good governance.
  *   **The "Cheat" Code:** If you get stuck, pivot back to **Scotland**. Smith genuinely believed the Act of Union (1707) was the blueprint for everything. It turned a poor, hostile neighbor into a prosperous partner without war. That's his model for America.

  Good luck! This level of detail on Book 4 should definitely keep you safe from the "SparkNotes" penalty.
