answer: |-
  The whiteboard was already cluttered with numbers when Ella tapped chip #4,352 with her marker.

  "Look," Ella said, channeling Williamson. "We agree chip 1 is red. We agree chip 10,000 is orange. On my view, there is a last red chip. Maybe it's this one. Maybe it's 4,353. We can't know which, because knowledge requires safety; you can't know you're at the boundary because you'd be too close to error. But there is a fact."

  Sam, erasing a column of precisifications, shook his head. "And that's where you lose the plot. You're positing a semantic fact utterly unmoored from usage. But look at my board. On supervaluationism, 'Chip 4,352 is red' is neither true nor false. It's indeterminate. But—and here's the kicker—the existential claim 'There is some chip that is the last red one' is supertrue. It's true on every admissible precisification."

  "Exactly," Ella pounced. "You admit the boundary exists. You say 'There is a sharp boundary somewhere' is true. So how is your view any less committed to a sharp boundary than mine? You're just too timid to say where it is. I say there's a cutoff we can't know; you say there's a cutoff that isn't located anywhere specific. Isn't that metaphysical magic? You have a true existential claim without a specific truthmaker."

  Sam leaned against the desk. "It's not magic; it's semantics. The truth of the existential claim doesn't require a *determinate* instance. Think about it: 'Someone invented the wheel' is true, even if we can't determinately identify the single inventor. In my view, the boundary is real but indeterminate. In yours, the boundary is determinate but unknowable. Which is weirder? You're telling me our collective usage of 'red' secretly fixes a precise line between 4,352 and 4,353, but no investigation, even by an omniscient being, could reveal it. That severs meaning from use. It makes semantics occult."

  "It doesn't sever meaning from use," Ella countered, capping her marker. "Usage fixes the meaning, but meaning doesn't always determine extension precisely. There's noise in the system. My view preserves classical logic intact. Bivalence holds. Every chip is either red or not. Your view sacrifices bivalence for atomic sentences to save it for existential ones. You say 'Chip n is red' lacks a truth value, but 'There is a last red chip' is true. That's a logical fragility. And don't pretend you escape the sharp boundary problem. If 'admissible precisification' is itself a precise notion, you've just pushed the vagueness up a level. You have a sharp boundary between the precisifications that count and those that don't."

  "That's where higher-order vagueness comes in," Sam said, drawing a new box. "I can handle that. We can have higher-order precisifications. 'Definitely red' means true on all first-order precisifications. But whether something counts as a first-order precisification can itself be vague. We iterate the operator. You don't get a sharp line between the admissible and the inadmissible."

  "But then," Ella interrupted, "what stops the regress? If 'definitely' is vague, then 'definitely definitely' is vague. Eventually, don't you need a stopper? If you say there's no final stopper, you risk losing the notion of truth entirely. If I say 'It is not definitely red,' on your view, is that true? If 'definitely' is vague, then the boundary between the definitely red and the indefinite is itself vague. But on my view, the boundary of knowledge is sharp, even if we can't locate it. There's a point where your margin for error kicks in. It's cleaner."

  "Cleaner, maybe," Sam conceded. "But at the cost of plausibility. You're asking students to believe that 'red' carves reality at the joints with microscopic precision, purely as a matter of semantic necessity. I'm asking them to believe that truth is robust but sometimes lacks a specific anchor. You call my existential claim magic; I call your precise cutoff a miracle of usage. Neither of us can explain away the intuition that there *shouldn't* be a sharp line, but you insist there *is* one, while I insist there *isn't* one determinately."

  "So we're stuck," Ella said, looking at the chips. "I save logic but lose knowability. You save the intuition of no sharp line but lose bivalence for atomic claims."

  "Basically," Sam said, picking up a red chip. "Until one of us explains where the metaphysical weight rests, the seminar's going to be loud."

  "Good," Ella smiled. "Let them argue."
