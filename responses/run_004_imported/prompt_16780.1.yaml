          *   **Nuance:** Cultivation can lead to genuine admiration. By focusing on her merits (to reduce envy), you might find actual reasons to admire. The pragmatic reason initiates the process, but the fittingness reason sustains the actual emotion.
      *   **Metaethical Takeaway:** Connect back to the seminar. Mention Scanlon, Parfit, or the Fitting Attitude Analysis.
