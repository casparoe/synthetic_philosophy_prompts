          *   The "Object" of Admiration: Admiration is about *her*, not *you*. If the reason is about *you*, the intentional object shifts.
          *   The Risk of Self-Deception: If you admire her *because* it helps you, are you actually admiring her merit? Or are you admiring the utility of the feeling?
      *   **Synthesize/Resolve:**
