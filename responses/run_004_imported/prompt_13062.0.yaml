prompt: |-
  I've been part of an AI safety reading group where we worked through Yudkowsky's old writeup on "coherent extrapolated volition," and around the same time my metaethics seminar covered Peter Railton's account of a person's good from his "Moral Realism" paper -- basically, that what's good for you is whatever a fully-informed, idealized version of you (one who knows all the relevant facts and can vividly imagine their consequences) would want for the actual, non-idealized you. It struck me that these two moves are doing something very similar, grounding normativity in extrapolated/idealized desires rather than the messy actual ones, just at wildly different scales: Railton for a single person, CEV for humanity as a whole.

  Could you compare the two in some depth, rather than just noting they're both "idealized preference" views? I'm curious especially about: where the idealization procedures actually diverge (CEV's talk of extrapolating what we'd want if we "knew more, thought faster, and were more the people we wished we were" sounds like it's idealizing values/character and not just correcting for missing facts, wheras Railton keeps the idealized advisor's fundamental values fixed and only pumps in information and imaginative vividness); whether aggregating across a whole population, rather then idealizing one person, introduces genuinely new problems for CEV or just multiplies Railton's existing ones; and whether the standard objections to full-information theories of well-being (e.g. that your idealized self might basically be a different person with different cares, so why should it get "authority" over you, or that the outcome depends on the arbitrary order you feed in the idealizing information) carry over to CEV, and whether doing this for an entire civilization makes those problems worse or somehow easier to dodge. I don't want a neutral "here are the similarities and differences" -- actually stake out a view on which of the two projects is in better philosophical shape, and defend it.
reasoning: |-
  Here's a thinking process that leads to the comparison and evaluation of CEV and Railton's Ideal Advisor Account:

  1.  **Deconstruct the Prompt:**
      *   **Core Task:** Compare Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV) with Peter Railton's Ideal Advisor Account (from "Moral Realism").
      *   **Key Insight:** Both ground normativity in idealized/extrapolated desires rather than actual desires.
      *   **Specific Areas to Explore:**
          *   Divergence in idealization procedures (CEV changes values/character vs. Railton fixes fundamental values + info).
          *   Aggregation problem (Population vs. Individual): Does CEV introduce *new* problems or just multiply Railton's?
          *   Objections to Full-Information Theories (Identity/Authority problem, Path Dependence): Do they carry over? Does scaling to civilization make it worse or better?
      *   **Constraint:** Do *not* be neutral. Stake out a view on which project is in better philosophical shape and defend it.

  2.  **Analyze the Subjects:**

      *   **Peter Railton's "Moral Realism" (1986):**
          *   *Theory:* Naturalistic moral realism.
          *   *Account of Well-being (Personal Good):* "Socialized Relational Analysis." What is good for $A$ is what $A$ would want for actual-$A$ if ideal-$A$ (fully informed, vividly imaginative, instrumentally rational) contemplated actual-$A$'s situation.
          *   *Idealization:* Epistemic (full info), Cognitive (vivid imagination), Instrumental (rationality). Crucially, Railton tries to keep *fundamental* desires stable. The ideal self loves the actual self.
          *   *Goal:* Ground objective moral facts in natural facts about human interests.

      *   **Eliezer Yudkowsky's CEV (2004):**
          *   *Context:* AI Alignment / Friendly AI.
          *   *Theory:* "Coherent Extrapolated Volition."
          *   *Definition:* "Our coherent extrapolated volition is our wish if we knew more, thought faster, were more the people we wished we were, grew up farther together, lived longer."
          *   *Idealization:* Epistemic (know more), Cognitive (think faster), *Moral/Character* (be more the people we wished we were), Social (grow up farther together).
          *   *Goal:* Provide a target function for a superintelligence to optimize, avoiding "perversity" (granting actual, flawed wishes) and "fragility" (locking in current flawed values).

  3.  **Drafting the Comparison Points (Mental Sandbox):**

      *   *Idealization Divergence:* Railton is conservative. He wants to solve the "ignorance" problem without solving the "bad taste" problem. If actual-you wants to smoke, ideal-you knows it kills you and advises against it. But if actual-you values honor over life, ideal-you respects that. CEV is *revisionary*. It explicitly says "be more the people we wished we were." It allows values to shift during extrapolation. This is a huge philosophical difference. Railton = Internalism (mostly). CEV = Externalism/Constructivism mix.
      *   *Aggregation:* Railton is about *my* good. Morality comes later (what we would agree to). CEV skips straight to *our* good/volition. Aggregating ideal advisors is hard. Do we average? Take the union? What if Ideal-A and Ideal-B disagree? Railton handles interpersonal conflict via a second step (moral norms). CEV bakes it into the volition. This makes CEV much harder.
      *   *Identity/Authority:* The "Why listen to ideal-me?" objection. If Ideal-Me is too different, they aren't me. Railton struggles here (Parfit's objection). CEV embraces the change ("grow up farther together"). But this risks the "Alien God" problem—the AI optimizes for values humans no longer recognize.
      *   *Path Dependence:* Order of information matters in full-info accounts. CEV tries to solve this with "coherent," implying a convergence point. But is there one?

  4.  **Staking out a View:**
      *   *Option A: Railton is better.* He's more modest. He acknowledges the distinction between prudence and morality. CEV is sci-fi speculation masquerading as ethics.
      *   *Option B: CEV is better.* Railton is too static. Human values *do* change upon reflection. CEV captures the dynamic nature of moral progress.
      *   *Option C: Railton is philosophically tighter, but CEV is more honest about the stakes.*
      *   *Decision:* I will argue that **Railton's account is in significantly better philosophical shape**, primarily because CEV smuggles in substantive moral assumptions under the guise of "extrapolation," whereas Railton honestly confronts the tension between actual desires and idealized advice. CEV's attempt to solve the aggregation problem *within* the idealization procedure makes it conceptually unstable compared to Railton's two-step process (Prudence then Morality).

      *Wait, let me refine that.* The prompt asks me to defend a view. A nuanced take might be: Railton is better *as an account of well-being*, but CEV is a necessary *engineering heuristic* that exposes the limits of Railtonian ethics for AI safety. However, the prompt asks which *project* is in better philosophical shape.
      *Stronger Thesis:* Railton's project is philosophically superior because it maintains a crucial distinction between *epistemic* idealization (correcting errors) and *moral* transformation (changing values). CEV conflates these, leading to the "Authority Problem" becoming fatal. CEV claims to derive values from us, but by allowing the idealized self to be "more the people we wished we were," it implicitly imports an external standard of what counts as an improvement, collapsing into a form of objective value realism it claims to avoid. Railton is more consistent with his naturalistic premises.

  5.  **Structuring the Essay:**

      *   **Introduction:** Acknowledge the insight (structural isomorphism). State the thesis: Railton is philosophically more robust; CEV is an ambitious but unstable conflation of prudence and moral progress.
      *   **Point 1: The Nature of Idealization (Conservative vs. Revisionary).**
          *   Railton: Full info + vividness. Fundamental desires stay fixed.
          *   CEV: "More the people we wished we were." Explicit value drift allowed.
          *   Critique: CEV needs a metric for "better person." Where does that come from? Railton avoids this by limiting scope to prudence.
      *   **Point 2: Aggregation and the Social Dimension.**
          *   Railton: Individual good first, morality second (agreement between ideal advisors).
          *   CEV: Aggregates immediately ("Our volition").
          *   Critique: CEV hides the political/normative conflict inside the extrapolation. If Ideal-A and Ideal-B diverge, CEV has no mechanism to resolve it other than "coherence," which is undefined. Railton admits the conflict.
      *   **Point 3: The Authority/Identity Objection.**
          *   Objection: Ideal self is a stranger.
          *   Railton: Mitigated by keeping fundamental cares fixed.
          *   CEV: Exacerbated by encouraging value drift.
          *   Scaling: Does civilization scale help? No, it amplifies the "whose values?" problem.
      *   **Conclusion:** Reiterate thesis. CEV is a fascinating engineering constraint but philosophically parasitic on the kind of moral realism Railton tries to build (or fails to build). Railton is the more honest philosophy.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address "path dependence"? Need to mention that CEV's "coherence" is an attempt to dodge path dependence, but it's hand-wavy compared to Railton's specific counterfactual conditions.
      *   *Check:* Did I address "scaling"? Yes, in the aggregation section. Scaling makes the identity problem worse (whose civilization?).
      *   *Tone:* Needs to be argumentative, not neutral. Use strong verbs. "CEV collapses," "Railton preserves," etc.
      *   *Nuance:* Acknowledge that CEV was designed for AI safety, not pure metaethics. But evaluate it *as* a normative grounding project as requested.

  7.  **Final Polish:** Ensure the distinction between "instrumental rationality + info" (Railton) and "moral growth" (CEV) is the pivot point. This is the key philosophical divergence. Railton says: "You want X, but you don't know X leads to Y." CEV says: "You want X, but you *should* want Z." That "should" is the philosophical weak point in CEV.

  8.  *(Final thought before writing)*: Make sure to explicitly mention the "Authority" objection. If Ideal-Me is different, why obey? Railton says "because it's still *your* cares." CEV says "because it's *better*." But "better" according to whom? Actual-Me? Then it's circular. Ideal-Me? Then it's authoritarian. Railton navigates this better.

  Let's write.
answer: |-
  The structural parallel you've identified is sharp and under-discussed: both Peter Railton's "Ideal Advisor" account and Eliezer Yudkowsky's "Coherent Extrapolated Volition" (CEV) attempt to solve the normativity problem by bypassing actual, messy desires in favor of counterfactual, idealized ones. They both say: *Don't do what you want; do what you would want if you were... more.*

  However, despite this isomorphism, the two projects are not equally viable. While CEV is a fascinating engineering heuristic for AI alignment, **Railton's project is in significantly better philosophical shape.** CEV attempts to solve the problem of moral progress by smuggling it into the definition of volition, which collapses its claim to be grounded in human desire. Railton, by contrast, maintains a crucial distinction between *epistemic* idealization (correcting errors about the world) and *moral* transformation (changing what we care about). By refusing to conflate prudence with moral growth, Railton avoids the fatal "Authority Problem" that plagues CEV, particularly when scaled from the individual to the civilization.

  Here is the defense of that view, breaking down the divergence in idealization, the aggregation problem, and the authority objection.

  ### 1. Conservative vs. Revisionary Idealization

  The most critical divergence lies in what the idealization procedure is allowed to touch.

  Railton's Ideal Advisor is **conservative**. In *Moral Realism*, Railton specifies that the idealized agent possesses full information, vivid imagination, and instrumental rationality. Crucially, he attempts to hold *fundamental* desires fixed. If Actual-You values honor above safety, Ideal-You will not decide that safety is actually more important; Ideal-You will simply inform Actual-You that *this* specific act of honor will get you killed, and ask if you still want to proceed. Railton is solving the problem of ignorance and cognitive bias, not the problem of "bad taste" in values.

  CEV is explicitly **revisionary**. Yudkowsky's definition includes the clause: *"if we... were more the people we wished we were."* This is not just about knowing more facts; it is about moral growth. CEV anticipates that our current values are flawed and grants the extrapolation process permission to alter them.

  **Why Railton wins here:** CEV's revisionism introduces a hidden variable that destroys its naturalistic grounding. If the extrapolated volition is allowed to change values because the agents are "better," we must ask: *Better according to what standard?*
  *   If the standard is "what Actual-Humanity currently thinks is better," we are back to square one (actual desires), because Actual-Humanity disagrees on what moral progress looks like.
  *   If the standard is external (i.e., there is an objective moral truth the agents are converging on), then CEV is not actually grounding normativity in *human volition* at all; it is grounding it in objective moral facts that the humans are merely discovering.

  Railton is philosophically more honest. He admits his account is about *well-being* (prudence), not necessarily full-blown moral truth. He isolates the variable: "Given what you care about, what is good for you?" CEV tries to answer "What *should* you care about?" while pretending it is still answering "What do you want?" This conflation makes CEV philosophically unstable. It claims to be subjectivist (grounded in our wishes) but functions as objectivist (correcting our wishes).

  ### 2. Aggregation: Hiding the Political Problem

  You asked whether aggregating across a population introduces new problems or just multiplies existing ones. I argue it introduces a **qualitatively new failure mode** for CEV that Railton's two-step structure avoids.

  Railton separates the project into two stages:
  1.  **Individual Good:** What Ideal-A wants for Actual-A.
  2.  **Morality:** What Ideal-A and Ideal-B would agree to regulate their interactions.

  CEV collapses these into one step: *"Our* coherent extrapolated volition." It attempts to compute a single vector of value for humanity as a whole.

  **Why Railton wins here:** Railton acknowledges that even idealized agents might have divergent fundamental interests. If Ideal-A values artistic creation and Ideal-B values ecological preservation, and these conflict, Railton has a framework for negotiation (moral norms). CEV, by demanding a "coherent" volition for the whole species, implicitly assumes that value convergence is guaranteed if we just think hard enough.

  This is a dangerous metaphysical bet. If human values are not convergent—if there is no single "Coherent" point but rather a Pareto frontier of incompatible goods—CEV fails. It forces the AI to make a political decision (whose values get prioritized in the "coherence" function) but masks it as a mathematical extrapolation. Railton's framework admits the conflict is real and political; CEV treats it as a calculation error to be solved by "thinking faster." Scaling the idealization to a civilization doesn't solve the conflict; it obscures the mechanism of resolution, making it less philosophically tractable.

  ### 3. The Authority and Identity Objection

  The standard objection to full-information theories is the **Authority Problem**: If Ideal-Me is sufficiently different from Actual-Me (due to new information or changed values), why does Ideal-Me have authority over Actual-Me? At what point does Ideal-Me become a stranger?

  **Railton's Defense:** Railton mitigates this by keeping fundamental cares fixed. Ideal-Me loves Actual-Me. The advice is authoritative because it is in service of *your* existing ends. The continuity of identity is preserved because the "conative core" remains stable.

  **CEV's Vulnerability:** CEV exacerbates this. By allowing the extrapolated agents to be "more the people we wished we were," CEV accepts that the resulting entity might not share our current terminal values. Yudkowsky accepts this risk (arguing that if our idealized selves reject our current values, good riddance), but philosophically, this severs the link between *us* and the *normativity*.

  If the AI optimizes for the values of a hypothetical future version of humanity that has undergone moral transformation, it is no longer serving *us*. It is serving our successors.

  **Does scaling help?** You asked if doing this for a civilization makes the problem easier to dodge. I argue it makes it **worse**.
  *   **Individual Scale:** I can introspect and decide if Ideal-Me is "still me."
  *   **Civilization Scale:** There is no "Actual-Humanity" to check against. There is only a distribution of conflicting actual humans. If CEV extrapolates to a coherent state that 40% of current humanity would find abhorrent (even if "idealized"), the claim that this represents *our* volition is politically and philosophically hollow.

  Railton's account survives the Authority Objection better because it limits its scope. It claims to tell you what is *good for you*, not necessarily what you are *morally obligated to do* (that comes in the second step of agreement). CEV claims to tell you what humanity *should want*, full stop. This invites the Authority Objection with full force: Why should a present-day human submit to the verdict of a counterfactual, morally-transformed super-intelligence simulating their descendants? Railton doesn't ask you to submit to that; he asks you to consider what serves your own interests.

  ### 4. Path Dependence and "Coherence"

  Finally, consider the objection regarding the order of information. In full-information accounts, the order in which you learn facts can change your values (e.g., learning about suffering before learning about liberty might yield different results than the reverse).

  Railton acknowledges the complexity of the counterfactual but relies on the stability of fundamental desires to dampen this noise. CEV attempts to solve this with the word **"Coherent."** It posits that if we think *long enough* and *together*, the path dependence washes out and we converge on a unique attractor.

  This is philosophically weaker than Railton's approach because it is an unproven empirical claim masquerading as a definition. Railton's theory works even if Ideal-A and Ideal-B never agree (that just means morality is hard). CEV *requires* convergence to function. If the "volition space" of humanity is chaotic or path-dependent, CEV yields no output. Railton's account is more robust because it can handle divergence; CEV treats divergence as a bug rather than a feature of the human condition.

  ### Conclusion

  CEV is a brilliant piece of AI safety engineering because it forces us to think about dynamic value learning. However, as a project in **metaethics and normative grounding**, it is inferior to Railton's account.

  Railton succeeds because he is modest. He distinguishes between correcting errors about the world (which justifies idealization) and correcting errors about value (which requires an external standard he doesn't claim to have). He separates individual good from social morality, avoiding the aggregation trap.

  CEV fails philosophically because it is ambitious to a fault. It tries to derive an "ought" from a hypothetical "would," but allows the hypothetical "would" to be shaped by an implicit "ought" (the "better people" clause). It attempts to aggregate conflicting volitions into a single "coherent" whole, hiding the political violence of that aggregation behind the math of extrapolation.

  If you want to know what is good for a person, Railton's Ideal Advisor is the more robust tool. If you want to program an AI, CEV is a necessary heuristic. But do not mistake the heuristic for a solution to the philosophical problem. Railton faced the tension between actual and ideal desires; CEV tried to extrapolate it away. In philosophy, you cannot extrapolate away the tension; you have to resolve it. Railton did the harder, more honest work.
