answer: |-
  The coffee shop was quiet, the kind of sterile silence that follows a difficult visit. Mark stirred his espresso, the spoon clinking against the ceramic. Sarah stared out the window at the rain.

  "She was calm, Sarah," Mark said, finally breaking the silence. "For the first time in weeks, she wasn't pacing. She ate her lunch. She talked about how he always liked the rain. She was at peace."

  "She was living in a fiction," Sarah replied, turning from the window. "Dad is dead. He isn't running errands. The staff are gaslighting her, and you're paying them to do it."

  "I'm paying them to care for her well-being," Mark corrected. "And look, I know what you're thinking. It's Nozick's Experience Machine. We've been here before. But Nozick was talking about a tank where you float for life. This isn't a tank. It's a single, localized adjustment to a reality she can no longer navigate."

  "It doesn't matter if it's a tank or a teaspoon," Sarah said. "Nozick's point wasn't about the scale of the simulation. It was about *contact*. He argued that we want to be in touch with reality, not just have the experience of it. By telling her Mom is alive, we sever her last tether to the actual world. We turn her life into a show we're putting on for her."

  "But she can't touch that reality anymore," Mark insisted, leaning forward. "That's the variable Nozick didn't account for. The Experience Machine assumes a rational agent who *could* choose reality but chooses pleasure instead. Mom doesn't have that choice. Her brain deletes the file every hour. If I tell her the truth, she experiences the shock of death, the grief, the panic. Then the file deletes. An hour later, I tell her again. She experiences the shock of death *again*. It's a loop of trauma. If well-being is about subjective experience—and I think, in her condition, it has to be—then the truth is just a weapon."

  Sarah shook her head. "You're reducing well-being to mood states. That's the hedonistic calculus. But there are objective goods, Mark. Truth is one of them. Authentic relationship is another. When she asks where Dad is, she's reaching for a connection with her husband. If we send her back with a lie, that connection is fake. It's a puppet show. Nozick said we want to *be* certain kinds of people. Right now, we are becoming people who deceive our mother."

  "We are becoming people who protect our mother," Mark countered. "But let's engage with your Nozick point. You say we want to *do* things, not just feel like we did them. Mom can't *do* much anymore. She can't manage finances, she can't drive, she can't even retain a conversation. Her agency is gone. So what is left? The quality of the inner life. If the 'doing' causes only pain without the possibility of resolution, why privilege the 'doing'?"

  "Because *we* are still doing," Sarah said softly. "We are the agents now. And we are choosing falsehood. You say it's localized, but lies bleed. If she believes he's out running errands, she worries about him when it storms. She saves him a piece of cake. She lives in a state of anxious waiting. That's not peace, Mark. That's a specific kind of anxiety built on a false premise."

  "Better anxious waiting than the devastation of bereavement," Mark said. "But fine. Let's push this. Let's look at the uncomfortable edge of your view. You value truth and authentic connection as objective goods, regardless of how they feel. If that's the case, where does it stop? If we found a way to restore her memory for ten minutes a day, so she could truly grieve, truly know he was gone, would you do it? Even if those ten minutes were pure agony for her? Even if the rest of the day was spent in the confusion of why she was crying?"

  Sarah paused, her fingers tightening around her mug. "That's... different. That would be therapeutic. That would be integration."

  "Is it?" Mark pressed. "Or is it just satisfying *your* need for her to be real, at the cost of *her* need for safety? If truth is an objective good, then her grief is a good thing, right? Because it's a true response to reality. So, are you willing to make her suffer for the sake of metaphysical accuracy? Because that's the implication. If you reject the lie because it's false, you must embrace the truth even if it's torture."

  Sarah looked down at her coffee. "No. I'm not willing to torture her. I admit that. But that doesn't mean the lie is right. It just means the situation is tragic."

  "Tragedy requires choices," Mark said. "And I'm choosing her peace."

  "But at what cost to *us*?" Sarah looked up, her eyes wet. "This is my uncomfortable implication, Mark. I'll own it. If we accept this lie, we lose the right to mourn her while she's still alive. We become curators of a museum exhibit. You say well-being is subjective feeling. If that's true, why stop at the errand story? Why not give her a sedative that makes her smile all day? If the metric is just 'calm,' then a chemical lobotomy is the ultimate validation therapy. Is that where your hedonism leads? To a drugged, smiling mother who doesn't know us at all?"

  Mark flinched. He looked away, watching the rain streak the glass. "That's a slippery slope. The lie about Dad preserves her social identity. It keeps her engaged. Drugs withdraw her."

  "Do they?" Sarah challenged. "You're drawing a line between 'psychological adjustment' and 'chemical adjustment.' But if the goal is purely the internal feeling of calm, the distinction is fuzzy. Nozick worried that if we plug in, we become 'indeterminate blobs.' You're arguing for a micro-plug. Just one wire. But if you admit that feelings are the only thing that matters, you have to admit that the most efficient way to maximize those feelings is usually to disconnect from reality entirely. You're resisting that conclusion, but your premise pushes you toward it."

  Mark was silent for a long moment. "Maybe," he admitted. "Maybe there is a risk there. But look at the alternative you're offering. You want us to be the bearers of bad news that she cannot process. You want her to have 'authentic connection' with a ghost. Nozick said we want contact with deeper reality. But what if the deeper reality is that she is broken? What if the most 'real' thing we can do is accommodate the breakage? If I correct her, I am asserting *my* reality over *hers*. I am prioritizing my conscience over her confusion."

  "You're prioritizing her comfort over her dignity," Sarah said, though her voice was softer now. "I know you think dignity is just a word for how you feel about yourself. But I think there's something objective about being a widow. It's a status she earned. It's part of the story of her life. To erase his death is to erase the weight of their marriage. It treats their forty years like a sitcom episode that got cancelled."

  "I know," Mark said. "I miss him too, Sarah. I miss her knowing he's gone. I miss the version of her that could hold that truth. But she's not there. And Nozick's machine was a voluntary choice. This is the crux. She didn't plug in. The disease plugged her in. We are just deciding whether to fight the machine or adjust the settings."

  Sarah sighed, rubbing her temples. "So we're stuck. If I insist on the truth, I make her suffer for a principle she can't understand. If you insist on the lie, you turn her life into a pleasant fabrication."

  "We're stuck," Mark agreed. "But I'd rather she be happy in a story than heartbroken in the truth."

  "And I'd rather she be sad in the truth than happy in a dream," Sarah said. "Because when she dies, Mark, the story ends. And I have to live with what we did to her. You say she won't remember. But I will."

  Mark reached across the table and covered her hand with his. "Then we carry it. Both of us. You carry the weight of the lie, and I'll carry the weight of the truth we hid. Maybe that's the only objective good left. That we loved her enough to take the hit."

  Sarah didn't pull her hand away, but she didn't turn it over either. "Nozick said we want to *be* a certain way. I just worry that by doing this, we've become people who can't look our own father in the eye, even in memory."

  "Maybe," Mark said. "Or maybe we became people who learned that sometimes, love looks like letting someone sleep."

  They sat there as the coffee cooled, neither convinced, both burdened, watching the rain fall on a world that felt, to all of them, slightly less solid than it had before.
