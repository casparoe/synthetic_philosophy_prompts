      *   *Milgrom-Stokey (1982):* "Information, Trade and Common Knowledge." Key conditions: Common Prior, Common Knowledge of Rationality/Willigness to Trade. Result: No speculative trade (zero-sum) based purely on information asymmetry.
      *   *User's Summary:* The user's summary is actually quite accurate. They correctly identify "common prior" and "common knowledge" as the heavy lifters. They correctly note that Milgrom-Stokey extends Aumann to trading.
      *   *Nuance:* The user mentions "known to be known... without end." This is the definition of common knowledge. They got that right.

  3.  **Address the "Escapes" (Literature Review):**
      *   *Escape 1 (Different Priors):* User cites Hanson. Hanson's "Uncommon Priors Require Origin Disputes" is the key reference here. If we agree on how we got our priors (genetics, environment), we should update to a common prior. If we don't, we are disputing the origin. This is a strong philosophical stance but practically, people *do* have different priors.
      *   *Escape 2 (Non-Informational Trade):* Hedging, liquidity, noise traders. This is the standard economic explanation. Keynes' "beauty contest" or noise trader models (De Long et al.).
      *   *Escape 3 (Common Knowledge Failure):* This is the most robust technical escape. Common knowledge is an incredibly high bar. In reality, I know $P$, you know $P$, but I don't know that you know that I know... ad infinitum. Rubinstein's Email Game is the classic example here.
      *   *Bounded Rationality:* The theorems assume unbounded computational power. Real humans (and bots) are bounded. This is a major factor the user hasn't explicitly emphasized but implies.

  4.  **Evaluate the User's Conclusion:**
      *   *User's Thesis:* "Prediction markets are epistemically useful not because traders satisfy the conditions of these theorems, but precisely because they don't."
      *   *Assessment:* This is actually a very standard and accepted view in market microstructure and behavioral finance, though phrased philosophically here. The "Grossman-Stiglitz Paradox" (which the user mentions) is the closer sibling to this. If markets were perfectly efficient (Aumannian), no one would gather info. Therefore, markets *must* be inefficient enough to reward info gathering.
      *   *Is it hand-wavy?* No, it's the foundational justification for active management and prediction markets. The "value" comes from the friction (bounded rationality, different priors, noise).
      *   *Is it novel?* Not really. It's the standard resolution to the no-trade theorems in applied economics. However, framing it as "epistemic value derived from violation of ideal conditions" is a nice philosophical articulation.

