      *   *Addition:* Mention "Noise Traders." The no-trade theorem holds for *informed* traders. If there are noise traders (liquidity providers who trade for non-info reasons), informed traders *can* profit. This is the standard market microstructure resolution (Kyle model, Glosten-Milgrom). The user mentioned "hedging/liquidity" but "Noise Traders" is the specific term they should know.
