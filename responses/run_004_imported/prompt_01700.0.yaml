      *   *Evaluation:*
          *   A is invoking a realist/positivist view of objectivity (convergence is evidence of truth).
          *   B is invoking a critical realist or hermeneutic view (reality exists, but access is mediated).
          *   *Weakness in A:* Assumes convergence is the *only* marker of objectivity.
          *   *Weakness in B:* The history analogy is imperfect. Historical facts are descriptive; moral facts are prescriptive. "Accessing something real" is vague in ethics. What is the "moral reality"?
