prompt: |-
  Quick one for a piece I'm writing on longtermism and effective altruism — I keep running into this 'cluelessness' objection to consequentialism, basically the idea that we're too ignorant of the far-future ripple effects of our actions to ever calculate what actually maximizes the good. I gather it goes back to James Lenman, and then Hilary Greaves later split it into 'simple' and 'complex' cluelessness. Can you explain what actually distinguishes those two, in plain terms, and then make a case for which one is the bigger headache for someone trying to do the most good? Not fishing for the textbook answer, genuinly curious which one you think bites harder and why.
