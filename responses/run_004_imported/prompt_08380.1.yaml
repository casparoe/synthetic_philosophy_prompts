      *   *Argument for Complex:* It's the practical killer. Even if we accept we know *something*, Complex Cluelessness says we can't aggregate that knowledge into a decision.
      *   *My Take:* Complex is the bigger headache. Why? Because Simple Cluelessness can often be neutralized by symmetry arguments (if reasons are equally balanced, EV is zero, so look at short-term). Complex Cluelessness denies the ability to make that symmetry argument. It creates "decision paralysis" rather than just "uncertainty." It attacks the *comparability* of outcomes, not just the *predictability*.
