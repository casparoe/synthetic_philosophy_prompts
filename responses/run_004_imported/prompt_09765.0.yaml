answer: |-
  If Gilbert Ryle were to confront the "finkish" and "masked" counterexamples developed by Martin, Johnston, Lewis, and Bird in the 1990s, he would likely view them not as devastating refutations of his dispositional analysis, but as sophisticated category mistakes that reintroduce the very "para-mechanical" mythology he sought to dismantle. Arguing strictly from the commitments of *The Concept of Mind* (1949), Ryle would almost certainly attempt to defuse these cases by appealing to the open-textured, pragmatic nature of "inference tickets" and the implicit *ceteris paribus* clauses inherent in ordinary language, rather than conceding the need for hidden categorical bases.

  To understand why, we must recall that Ryle's project in *The Concept of Mind* was not to provide a rigorous formal semantics for dispositional predicates, but to dissolve the philosophical muddle arising from treating mental (and dispositional) concepts as names of private, occult episodes. For Ryle, to call a glass "fragile" is not to ascribe to it a hidden "fragility-engine" or an intrinsic power that waits to be unleashed; it is to issue a license to infer that the glass *would* break if struck, under standard conditions.

  ### The Defense of "Normal Conditions"

  Ryle's primary line of defense against masks and finks would be to insist that dispositional statements are inherently elliptical. In *The Concept of Mind*, Ryle emphasizes that dispositional statements are "semi-hypothetical." They do not assert that something is happening now, nor do they assert a rigid, exceptionless logical biconditional. They assert a liability or tendency.

  Regarding **masked dispositions** (e.g., the fragile glass packed in styrofoam), Ryle would argue that the 1990s realists are artificially narrowing the "test conditions." When we say "this glass is fragile," the implicit conditional is not "if struck, it breaks," but "if struck *in a manner appropriate to testing fragility*, it breaks." Packing the glass changes the conditions of the strike; it introduces an interfering variable. For Ryle, the disposition remains valid because the inference license remains valid *once the masking condition is removed*. To insist that the disposition must manifest *while masked* is to demand that the glass break and not break simultaneously, or to demand that the disposition be something over and above the pattern of actual and hypothetical occurrences. Ryle would likely characterize the realist's demand for a "truth-maker" that persists through masking as a relapse into the "ghost in the machine" model—positing a "fragility ghost" inside the glass that exists independently of what the glass does or would do.

  Regarding **finkish dispositions** (e.g., the wire that becomes conductive only when touched), Ryle would likely treat these as linguistic curiosities or "philosopher's inventions" that violate the ordinary usage of dispositional terms. In ordinary contexts, we ascribe dispositions based on stable structures and past performances. A wire that changes its electrical nature instantaneously upon contact is, for Ryle, simply a complex mechanism described by *further* dispositional statements (e.g., "the wire is disposed to become conductive when touched"). Ryle does not need a categorical base to ground this; he simply pushes the dispositional analysis back one step. The "fink" does not prove the disposition is an inner state; it proves that the situation involves a complex interplay of multiple dispositions. Ryle would argue that the conditional analysis holds, provided the conditions are specified with sufficient ordinary-language precision to exclude the "finkish" interference. If the wire is dead until touched, then strictly speaking, prior to touching, the conditional "if touched, it conducts" is false, and so Ryle would say the disposition "conductive" is false. The realist says the disposition is true but the conditional false; Ryle would say the confusion lies in trying to separate the two so sharply.

  ### The Rejection of the "Para-Mechanical" Trap

  The crux of the matter lies in the ontological implications of the counterexamples. The 1990s arguments are designed to show that dispositions must be *real, intrinsic properties* (categorical bases) to account for their persistence through masking or their absence in finks. This is exactly what Ryle calls the "para-mechanical hypothesis."

  Ryle argues that positing hidden inner causes to explain overt behavior is a category mistake. It is like saying a university is not just the buildings and staff and students, but an additional "entity" that owns them. Similarly, to say the glass has "fragility" as an inner property distinct from its breaking behavior is to create a "fragility entity."

  If Ryle were to accept the force of the mask/fink arguments, he would have to admit that dispositional predicates *do* name hidden inner states (the categorical bases) that ground the conditionals. This would be a total surrender of his project in *The Concept of Mind*. He would be admitting that there is a "ghost" in the glass (the intrinsic fragility) distinct from the "machine" (the breaking behavior).

  Therefore, Ryle would dig in his heels. He would argue that the counterexamples expose not a flaw in his analysis, but a flaw in the metaphysicians' demand for "truth-makers." For Ryle, the truth of "the glass is fragile" is not grounded in a microstructural property; it is grounded in the fact that the glass *belongs to a class of things* that break when struck. The "mask" case simply shows that class membership is compatible with temporary prevention of manifestation. The "fink" case shows that class membership can be time-sensitive. Neither requires a hidden ontology.

  ### Would the Framework Hold?

  Could his framework defuse them? **Yes, but at a cost.**

  Ryle can defuse them by treating the conditional analysis as a pragmatic tool rather than a metaphysical definition. He would say: "We use 'fragile' to predict breakage. If packing prevents breakage, we note the packing. If a wire changes state on contact, we note the mechanism. We do not need to posit 'Fragility' as a Thing."

  However, do they expose a point where his account covertly needed the hidden picture? **From a modern metaphysical perspective, yes; from Ryle's perspective, no.**

  The counterexamples succeed if one assumes that for a statement to be true, there must be a *current, categorical fact* that makes it true (the truth-maker intuition). Ryle rejects this intuition for dispositional statements. He views them as "inference tickets" that are valid in virtue of past performance and structural classification, not in virtue of a present-tense ontological anchor.

  If Ryle admits that the masked glass is fragile *even though* the conditional "if dropped it would break" is false (due to the packing), he must explain what makes it fragile *now*. The realist says "intrinsic structure." Ryle must say "it would break if the packing were removed." But this is just a *nested* conditional. The realist argues this leads to an infinite regress or fails to capture the *categorical* nature of the object's state.

  Ryle would likely respond that the demand for a "categorical nature" is the residue of Cartesian dualism applied to matter. He would argue that the physical world is just as dispositional as the mental world. To ask "what is the glass *really* doing while packed?" is to ask a question that assumes there must be an "inner episode" of fragility happening. Ryle's answer is: "Nothing is happening. It is just sitting there. To be fragile is just to be the sort of thing that breaks when struck."

  ### Conclusion

  Ryle would respond to finks and masks by accusing their proponents of fetishizing the "condition" in the conditional analysis. He would argue that "normal conditions" is not a loophole to be plugged by metaphysics, but a recognition that dispositional concepts are tools for navigating a world of interfering causes.

  He would maintain that these counterexamples do not force us back to the "para-mechanical hypothesis." Instead, they highlight the complexity of the "law-like licenses" we issue. A masked disposition is simply a license that is temporarily suspended; a finkish disposition is a license that is context-dependent. To demand a hidden inner state to secure the truth of these claims is to commit the category mistake of treating a disposition (a rule for prediction) as a description of a hidden event. Ryle would conclude that the 1990s realists, in their quest to save dispositions from conditional analysis, have inadvertently resurrected the "ghost in the machine"—not in the mind, but in the very fabric of matter. He would prefer the "elaborate law-like statement" with implicit clauses, viewing the demand for categorical bases as a philosophical illusion.
