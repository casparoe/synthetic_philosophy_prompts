  3.  **Evaluate Move-by-Move:**

      *   **Move (1) Diego:** Claims A-then-D is inconsistent because of the "common consequence" effect (subtracting the 89% $1M from both options in Round 1 leaves Round 2).
          *   *Analysis:* Technically correct according to Expected Utility Theory (EUT). This is the definition of the Independence Axiom violation.
          *   *Verdict:* Diego wins on *internal consistency within standard theory*. But he assumes standard theory is the only valid metric of rationality.
          *   *Nuance:* He's right about the math, but begs the question on whether the math captures *all* rationality.

      *   **Move (2) Mara:** Claims Diego assumes the axiom in dispute. Certainty (100%) is psychologically distinct from near-certainty (89%).
