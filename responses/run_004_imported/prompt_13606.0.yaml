          *   *Verdict:* Mara wins on *philosophical/psychological validity*. She exposes the normative vs. descriptive gap.

      *   **Move (3) Diego:** The Money Pump / Dynamic Inconsistency argument. He constructs a sequential version of the lottery. If you plan for A (sure thing) but then choose D (risk) when the 89% doesn't happen, you are dynamically inconsistent and can be pumped.
