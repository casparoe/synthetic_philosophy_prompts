      *   **Move (4) Mara:** Claims context matters (how the gamble arose). You can commit to a plan. Refusing to honor resolution is the exploit, not the preference itself.
          *   *Analysis:* This is the "resolute choice" argument (McClennen). It saves the preference but requires a specific theory of agency (binding yourself). It's a valid defense but requires extra machinery (commitment devices).
