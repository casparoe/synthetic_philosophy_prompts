          *   1B: 89% $1M, 10% $5M, 1% $0.
          *   2C: 11% $1M, 89% $0.
          *   2D: 10% $5M, 90% $0.
      *   *The Violation:* Expected Utility Theory (EUT) says if you prefer A > B, you must prefer C > D. Most people pick A > B and D > C.
      *   *The Independence Axiom:* This is the core technical issue. It states that if you prefer X over Y, adding a common probability Z to both shouldn't change the preference.
      *   *Diego's Stance:* Defends EUT/Independence Axiom. A-D choice is inconsistent/irrational. Money pump argument.
