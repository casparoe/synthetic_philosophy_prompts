      *   *Specific Terminology:* Use terms like "CIRL" (Cooperative Inverse Reinforcement Learning), "Instrumental Convergence," "Posterior Collapse," "Model Misspecification."
      *   *Highlight the Human Rationality Point:* This is the most technical and decisive counter-argument. If $P(\text{Human acts optimally}) < 1$, the proof breaks.
