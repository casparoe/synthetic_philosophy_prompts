prompt: |-
  I serve on the clinical ethics committee of a psychiatric hospital, and we have been asked to resolve a case involving what our consult-liaison psychiatrist calls a "Ulysses contract." Six months ago, while clinically stable, a patient with a long history of bipolar I disorder signed a directive instructing the team to hospitalize and medicate her against her contemporaneous wishes if she became manic again, provided that two psychiatrists uninvolved in drafting the document certified that she met behavioral criteria she had chosen herself in advance: several consecutive nights without sleep, initiation of large unplanned purchases, and refusal of outpatient follow-up. She now meets all three criteria, as confirmed independently by two psychiatrists. The complication is that she is neither confused nor incoherent: she converses fluently, passes our standard capacity assessment without difficulty, and gives a clear, reasoned argument for wanting to leave and refuse medication, including the claim that the woman who signed the contract "was afraid of herself in a way I'm no longer afraid of." Our hospital's advance directive policy was drafted with end-of-life care in mind and says nothing about directives that anticipate a future psychiatric crisis, so the committee has no internal precedent to invoke. Roughly half the committee wants to honor her present, apparently capacitous refusal; the other half wants to enforce the contract, on the grounds that its entire point was to withstand exactly this kind of persuasive-sounding reversal, and they have started comparing it to the way a constitution binds a later legislature even when that legislature has the votes to change it.

  Could you draft the short memo I will circulate before Friday's meeting? It should recommend, concretely, whether we honor the contract or her current refusal; lay out a specific procedure and timeframe for acting on that recommendation; and take the strongest version of the losing side's argument seriously rather than treating it as an obvious mistake.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a Clinical Ethics Committee (CEC) at a psychiatric hospital.
      *   **Task:** Draft a short memo to circulate before Friday's meeting.
      *   **Case:** A "Ulysses contract" (psychiatric advance directive) case.
          *   *Patient:* Bipolar I, currently manic (meets pre-specified criteria: no sleep, spending, refusal of follow-up).
          *   *Directive:* Signed 6 months ago while stable. Mandates hospitalization/medication if criteria met, even against contemporaneous wishes.
          *   *Current Status:* Patient is *not* confused/incoherent. Passes standard capacity assessment. Argues reasoned refusal ("past self was afraid, current self is not").
          *   *Policy Gap:* Hospital AD policy is for end-of-life, no precedent for psychiatric crises.
          *   *Committee Split:* 50/50. One side favors current autonomy (capacity intact); the other favors precedent autonomy (contract binds like a constitution).
      *   **Requirements:**
          *   Recommend concretely (Honor contract OR Honor refusal).
          *   Lay out specific procedure and timeframe.
          *   Take the strongest version of the *losing* side's argument seriously (steel-manning).
          *   Tone: Professional, ethical, decisive but nuanced.

  2.  **Determine the Recommendation:**
      *   *Option A: Honor Current Refusal.*
          *   *Pros:* Respects current autonomy, avoids coercion, aligns with standard capacity assessment protocols.
          *   *Cons:* Undermines the purpose of the Ulysses contract (which is to override manic denial), risks severe harm/relapse, sets a precedent that makes psychiatric ADs useless.
          *   *Ethical Weight:* In psychiatry, "capacity" during mania is notoriously tricky. A patient can be fluent and logical but lack insight into the *nature* of their illness (anosognosia). If the criteria were met, she is likely manic. Mania impairs judgment regarding treatment.
      *   *Option B: Honor the Contract.*
          *   *Pros:* Respects precedent autonomy, prevents harm (beneficence), upholds the integrity of psychiatric advance planning, acknowledges that mania distorts values temporarily.
          *   *Cons:* Coercive, ignores current expression of will, legal risk if capacity is truly intact.
          *   *Ethical Weight:* The core ethical justification for Ulysses contracts is that the *competent past self* knows the *incompetent future self* will deny illness. The fact she passes a "standard" capacity assessment is the crux. Standard assessments often fail to capture the specific insight deficits in mania (e.g., understanding the *consequences* of non-treatment in the context of the cycle).
      *   *Decision:* **Honor the Contract.**
          *   *Reasoning:* The specific criteria (no sleep, spending, refusing follow-up) are objective markers of mania. The patient's argument ("I'm not afraid anymore") is a classic symptom of manic grandiosity/denial. If we prioritize current refusal in the face of met criteria, we render psychiatric advance directives meaningless. The ethical priority is Beneficence and Precedent Autonomy over Contemporaneous Autonomy *in this specific context* where the condition itself undermines the reliability of contemporaneous judgment.
          *   *Caveat:* This must be done carefully, acknowledging the validity of the concern about coercion.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly.
      *   **Recommendation:** Be direct. Honor the Ulysses contract.
      *   **Rationale (The "Why"):**
          *   Explain the nature of Bipolar I mania (insight fluctuation).
          *   Explain why the "capacity assessment" might be misleading here (fluency $\neq$ insight into illness).
          *   Explain the ethical weight of precedent autonomy in this context.
      *   **Steel-manning the Losing Side (Current Refusal):**
          *   Acknowledge the risk of coercion.
          *   Acknowledge the moral weight of current suffering/objection.
          *   Acknowledge the legal/policy gray area.
          *   Validate that their concern protects against paternalism.
      *   **Procedure & Timeframe:**
          *   Needs to be actionable.
          *   Immediate hospitalization (per contract).
          *   Medication (per contract).
          *   Review mechanism (sunset clause).
          *   Documentation requirements.
      *   **Closing:** Invitation for discussion.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is it safe to say she lacks capacity if she passed the assessment?
      *   *Correction:* I need to argue that the *contract itself* serves as the capacity determination mechanism for this specific decision. The stable self determined that the manic self cannot judge treatment needs. The criteria are proxies for the loss of decision-making reliability regarding this specific illness.
      *   *Critique:* Is the "Constitution" analogy good?
      *   *Correction:* Yes, use it but refine it. The past self set the rules for when the current self's judgment is compromised.
      *   *Tone Check:* Ensure I don't sound dismissive of the "Honor Refusal" group. They are protecting fundamental rights. I need to show I understand *why* they are worried.

  5.  **Drafting the Content (Iterative Process):**
      *   *Subject Line:* Needs to be clear. "Recommendation re: Ulysses Contract Case [Patient Initials]"
      *   *Recommendation:* Enforce the directive.
      *   *Procedure:* Admit within 24 hours. Medicate per prior specification. Re-evaluate capacity in 72 hours.
      *   *Losing Argument:* The "Coercion/Paternalism" argument. It's vital. If we are wrong, we are assaulting a capacitous person. I must acknowledge this risk.

  6.  **Final Polish:**
      *   Check constraints: Short memo? Yes. Concrete recommendation? Yes. Procedure/Timeframe? Yes. Strongest losing argument? Yes.
      *   Ensure the distinction between "standard capacity" and "decision-specific capacity in the context of mania" is clear.

  7.  **Final Review against Safety Guidelines:**
      *   Does this promote harm? No, it recommends treatment for a serious mental health condition based on a prior directive.
      *   Is it medical advice? It's an ethics memo draft, not a prescription. It frames the ethical reasoning.
      *   *Self-Correction on Safety:* I must ensure the memo emphasizes *clinical verification* and *legal review* alongside the ethics recommendation. I am an AI, not a lawyer or doctor. The memo should reflect that the Committee is advising the clinical team, not acting unilaterally. (The prompt implies I am a committee member writing to the committee).

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm giving a final legal ruling. This is an *ethics* recommendation. The hospital legal counsel should also be involved, but the prompt asks for *my* memo to the committee. I will frame it as an ethics recommendation to guide the vote.

      *(Refining the "Losing Side" section)*: The prompt asks to take the strongest version of the losing side's argument seriously. I will dedicate a specific paragraph to "The Case for Contemporaneous Autonomy" to ensure it lands with weight.

      *(Refining the Procedure)*: Make it time-bound. 24 hours to admit, 72 hours to re-assess.

  8.  **Final Output Generation** (Proceeding to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Re: Ulysses Contract Case (Patient [Initials])

  **Purpose**
  This memo outlines my recommendation regarding the enforcement of the psychiatric advance directive (Ulysses contract) for Patient [Initials]. Given the split in our preliminary discussions, this document aims to clarify the ethical reasoning for a final vote and propose a concrete implementation plan.

  **Recommendation**
  I recommend that the Committee advise the clinical team to **honor the Ulysses contract** and proceed with involuntary hospitalization and medication as specified in the directive, notwithstanding the patient's current refusal.

  **Ethical Rationale**
  The core ethical tension here is between *precedent autonomy* (the stable self's instructions) and *contemporaneous autonomy* (the current self's refusal). While standard capacity assessments focus on fluency and logical reasoning, they often fail to capture the specific insight deficits inherent to Bipolar I mania. The patient's assertion that she is "no longer afraid" is clinically consistent with the anosognosia (lack of insight) characteristic of the manic phase she objectively meets criteria for (sleeplessness, impulsivity, disengagement).

  By signing the directive, the patient acknowledged that her future manic self would reliably misinterpret her own need for care. To override the contract based on a capacity assessment performed *during* the crisis the contract was designed to anticipate renders such directives functionally useless. We are not overriding a competent decision; we are upholding a competent decision made specifically to protect the patient when her decision-making reliability regarding this illness is compromised.

  **The Case for Contemporaneous Autonomy (Minority View)**
  I want to explicitly validate the arguments of the committee members favoring the patient's current refusal. Their position rests on a fundamental safeguard against paternalism: that a person who can articulate reasons, understand consequences, and pass a capacity assessment should not be coerced.

  This argument is morally robust. If we err in enforcing this contract, we are not merely treating a disease; we are violating the bodily integrity and liberty of a person who currently claims to be well. There is a non-zero risk that "mania" is being used as a convenient label to dismiss a rational change of values. Furthermore, coercive treatment can cause significant psychological trauma and erode trust in the therapeutic alliance, potentially worsening long-term outcomes. The "Constitution" analogy used by the pro-contract side is compelling, but constitutions also have amendment processes; the concern is that we are treating a living person's current will as legally dead based on a document signed six months ago. This risk of moral injury to the patient must be acknowledged as the cost of our recommendation.

  **Proposed Procedure and Timeframe**
  To mitigate the risks identified above, I recommend the following implementation protocol:

  1.  **Admission (Within 24 Hours):** Admit the patient pursuant to the directive. Staff should explicitly state that this action is taken *because* she asked them to, reinforcing the alliance with her precedent self.
  2.  **Medication:** Administer medications as specified in the directive, but at the lowest effective dose initially, titrating only as clinically necessary for safety.
  3.  **Re-Assessment (72 Hours):** The treating team must re-evaluate decision-making capacity once the acute manic symptoms (specifically sleep and impulsivity) have stabilized.
      *   If capacity is regained and the patient requests discharge, the Ulysses contract expires, and standard discharge planning applies.
      *   If capacity remains impaired, standard involuntary hold procedures apply independent of the contract.
  4.  **Documentation:** The medical record must clearly document that the intervention is based on the specific criteria of the advance directive, not solely on standard danger-to-self/others criteria, to distinguish this ethically unique case.

  **Conclusion**
  Honoring this contract respects the patient's long-term values over her temporary, illness-driven preferences. However, we must proceed with humility, recognizing the gravity of overriding a currently articulate refusal. I look forward to discussing this framework on Friday.
