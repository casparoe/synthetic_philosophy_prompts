              *   Where does KK fit in? KK says: If $S$ knows $p$, $S$ knows that $S$ knows $p$.
              *   Actually, the Dogmatism Paradox doesn't *strictly* require KK. It requires that knowledge entails truth (factivity) and that the knower can deduce the misleading nature of counter-evidence *from the fact that they know*.
