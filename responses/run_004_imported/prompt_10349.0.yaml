prompt: |-
  I've been stuck in the game theory literature on the common prior assumption for my quals and honestly want someone to just commit to a side instead of the wishy-washy "both views have merit" thing every survey does. So: write me an essay that actually stakes out a position on whether the common prior assumption is a genuine requirement of bayesian rationality (the harsanyi/aumann line) or just a convenient modelling fiction with no real epistemic force. Please engage with the actual mechanics — why exactly aumann's agreement theorem needs a common prior to rule out "agreeing to disagree," what the no-trade results add on top of that, and the standard subjectivist comeback that priors are precisely the sort of thing individual rationality is silent on. I vaguely remember some paper (gul? someone responding to aumann, in econometrica maybe) arguing the whole framework is close to circular once you spell out what "no information yet" is even suppose to mean — feel free to get into that kind of objection too if its relevant. Don't hedge at the end, just tell me which side wins and why.
