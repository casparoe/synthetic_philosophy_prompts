      *   *Did I address the "some things well, others badly" point?* Need to make sure I cover the "universal reason" aspect, not just language. LLMs are broad but shallow/unreliable.

  8.  **Final Polish:** Organize into clear sections. (1) What Descartes said. (2) How LLMs look to him. (3) Why he might stand firm. (4) The modern philosophical verdict. (This matches the structure of the final output).

