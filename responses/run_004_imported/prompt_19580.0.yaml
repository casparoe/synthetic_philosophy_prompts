      *   **Argument 2: The Immunization Strategy (Auxiliary Hypotheses).** Use the Duhem-Quine thesis. When evolution seems to fail (e.g., altruism, suboptimal design), the theory expands to include new mechanisms (kin selection, punctuated equilibrium) rather than breaking. This confirms Popper's "metaphysical research programme" label.
      *   **Argument 3: Predictive Power vs. Explanatory Power.** Evolution is great at explaining the past (ex post facto) but notoriously weak at predicting the future (specific novel adaptations). Popper's recantation relied on retrodictive success, not genuine prediction.
