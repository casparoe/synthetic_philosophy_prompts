      *   *Point 1: The Definition of "Fitness" remains slippery.* Even if we test specific traits, "fitness" is often retroactively defined by reproductive success. If a trait doesn't lead to success, we say it wasn't "fit" in that context, or we invent a trade-off.
      *   *Point 2: The "No Miracles" Argument vs. Tautology.* Evolutionary explanations are often "just-so stories." If an organism survives, it's adaptation. If it dies, it's maladaptation. The framework absorbs all outcomes.
      *   *Point 3: The Auxiliary Hypotheses Shield.* When a prediction fails (e.g., a trait expected to be selected isn't), biologists don't falsify natural selection; they adjust auxiliary hypotheses (genetic drift, linkage, environmental change, pleiotropy). This makes the core theory unfalsifiable in practice (Lakatosian research programme).
      *   *Point 4: Popper's Recantation was too polite.* He conceded to the biologists' *practice* without addressing the *logical structure* of the general theory. He confused "testable applications" with "testable core axioms."

