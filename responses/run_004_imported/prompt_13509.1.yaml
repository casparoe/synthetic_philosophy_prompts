answer: |-
  First off, take a deep breath: **you did not teach your students anything wrong.** You taught the standard, canonical narrative that appears in almost every micro theory textbook (from Varian to Mas-Colell). Bernoulli's introduction of concave utility *does* resolve the specific payoff structure of the original 1738 game.

  However, your intuition that something is "off" about the modern literature is sharp. You aren't missing basic history; you're encountering the difference between the **undergraduate/MA resolution** and the **PhD/Research frontier resolution.**

  Here is the breakdown of why the St. Petersburg Paradox (SPP) is still a live issue in decision theory, why people are still publishing on it, and how you can adjust your teaching without undermining your credibility.

  ### 1. The Missing Link: Menger (1934)
  The piece of the puzzle that is usually skipped in the first-year sequence is **Karl Menger's 1934 critique**.

  Bernoulli showed that if payoffs grow geometrically ($2^n$) and utility grows logarithmically ($\ln(w)$), the series converges. However, Menger pointed out that this is not a general solution to Expected Utility Theory (EUT); it is just a solution to *that specific payoff schedule*.

  Menger proved that for **any** unbounded utility function $U(x)$, no matter how concave, one can construct a "Super St. Petersburg" lottery where the payoffs grow fast enough to make the expected utility diverge to infinity.
  *   If $U(x) = \sqrt{x}$, just make the payoffs grow as $4^n$ instead of $2^n$.
  *   If $U(x) = \ln(x)$, make them grow as $e^{2^n}$.

  **The Implication:** To fully resolve the paradox within the vNM framework, you cannot just assume *concavity*; you must assume **bounded utility**.

  ### 2. Why It's Still an "Open" Problem
  If the solution is "just assume bounded utility," why is there still a literature? Because assuming bounded utility creates massive problems for economic modeling.

  *   **The "Satiation" Problem:** If utility is bounded, there exists some wealth level $W^*$ where an agent is indifferent between $W^*$ and $W^* + 1$ trillion. This violates strong monotonicity intuitions many economists hold.
  *   **Calibration Theorems:** Work by Matthew Rabin (2000) and others shows that if you calibrate risk aversion to small stakes (to solve SPP), bounded utility functions often imply absurd risk aversion at large stakes.
  *   **Axiomatic Tension:** The vNM axioms do not *require* bounded utility. Forcing it feels like an ad-hoc restriction to save the theory from a counterexample.

  So, when you see modern papers "resolving" St. Petersburg, they are usually doing one of three things:
  1.  **Defending Boundedness:** Arguing that bounded utility is actually normatively acceptable (e.g., there *is* a maximum amount of good that can be done with money).
  2.  **Alternative Frameworks:** Proposing non-expected utility models (Rank-Dependent Utility, Prospect Theory) that handle infinite expectations differently (e.g., by weighting probabilities non-linearly).
  3.  **Ergodicity Economics:** This is likely the "new" stuff you're seeing (e.g., Ole Peters). This literature argues Bernoulli was right about the log function but wrong about the *reason*. They argue the paradox arises from confusing **ensemble averages** (expected value) with **time averages** (growth rate over time). In an ergodicity framework, you don't need bounded utility; you just need to optimize the geometric growth rate, which naturally kills the infinite expectation without arbitrary bounds.

  ### 3. Is it a "Zombie Paradox"?
  To your point about sociological/career reasons: partially, but mostly no.

  In decision theory, the St. Petersburg Paradox functions like the **Harrod-Domar model** in growth theory or the **Allais Paradox** in choice under risk. It is a **stress test**.
  *   If you propose a new decision theory (e.g., a new ambiguity model), reviewers will ask: "How does your model handle St. Petersburg?"
  *   If your model allows unbounded utility and infinite expectations, it implies agents would pay their entire life savings to play a game with a tiny probability of a huge payout. That's behaviorally unrealistic.
  *   Therefore, the paradox remains "active" because it is the primary boundary condition for the validity of EUT.

  ### 4. Pedagogical Advice: How to Handle This Next Time
  You don't need to retract your statement. You can simply upgrade the narrative. This is actually a great opportunity to show your students how economic theory evolves.

  **Current Narrative:**
  > "Bernoulli solved this with concave utility. End of story."

  **Upgraded Narrative (PhD Level):**
  > "Bernoulli solved the *original* formulation using logarithmic utility. However, in the 20th century, Karl Menger showed that for any unbounded utility function, we can construct a payoff schedule that breaks it again. This implies that to fully resolve the paradox within Expected Utility Theory, utility must be **bounded**, not just concave. This creates a tension in modern theory because bounded utility has its own drawbacks. Consequently, you will still see literature discussing this, often using it to test new axioms or alternative frameworks like Ergodicity Economics."

  ### Summary
  *   **You didn't teach outdated info:** You taught the standard "Bernoulli Solution," which is correct for the historical game.
  *   **The literature isn't ignorant:** They are addressing the **Menger (1934)** generalization, which requires bounded utility, not just concavity.
  *   **Why it persists:** It's a litmus test for new decision theories. If a theory can't handle infinite expectations without breaking monotonicity, it's considered flawed.
  *   **Action item:** Add a 5-minute "Menger Critique" footnote to your lecture. It will make you look even more knowledgeable and prepare the PhD students for the actual literature they'll read.

  You're spotting the gap between "textbook economics" and "research economics." That's a good sign for your own PhD development. Keep digging.
