  2.  **Deconstruct the Kant Passage (Ak. 4:393–394):**
      *   *Core Claim:* A good will is good in itself, not because of effects/ends.
      *   *Scenario:* Even if fortune/nature prevents success, the will remains good.
      *   *Condition:* It must be a "summoning of all means," not a "mere wish."
