answer: |-
  This is a sophisticated reading of the *Groundwork*, and your skepticism is well-founded. Your friend is invoking a famous Kantian slogan ("only the will matters") but applying it to reach a conclusion that the text you cited actually undermines.

  Here is a breakdown of what Kant is doing in this specific passage, addressing your three sticking points, and finally, how this bears on your argument about moral luck.

  ### 1. The Jewel: Argument or Image?
  You ask whether "it would still shine by its own light" is an argument or a restatement. It is best understood as an **elucidation of a category mistake.**

  Kant is not offering a deductive proof here; he is trying to shift your intuition about where value *resides*. Throughout the opening pages of the *Groundwork*, Kant is arguing that anything contingent (talents, wealth, health, success) cannot be the seat of *unconditional* goodness because these things can be used for evil ends or fail due to circumstance.

  The "jewel" metaphor is doing specific philosophical work: it illustrates **independence**. A jewel's value is intrinsic to its structure, not to what it buys or how it is used. By comparing the good will to a jewel, Kant is arguing that moral worth is a property of the *source* of the action (the volition), not the *output* (the effect).

  *   **Verdict:** It is not a standalone logical proof, but it is not "mere" poetry. It is a conceptual clarification intended to show that moral value is non-instrumental. If your friend uses this to say "outcomes matter for blame," she is ignoring the metaphor: if the jewel shines regardless of whether it lights a room or sits in a dark box, the moral agent retains their status regardless of whether the child lives or dies.

  ### 2. "Summoning of all means": What does this commit the agent to?
  This is the most dangerous phrase for your drunk driver case. Kant distinguishes between a *wish* (velleity) and a *will* (practical commitment). A wish is "I hope no one gets hurt." A will is "I commit to ensuring no one gets hurt."

  "Summoning of all means in our power" commits the agent to **causal efficacy in the service of duty.** It implies that the agent must employ every available instrument to actualize the moral law.

  *   **Does it excuse the driver who didn't brake?** No. In fact, it condemns him more sharply.
      *   First, the "means" must be morally permissible. Driving drunk is not a permissible means to the end of "getting home." The failure of the will occurred *before* the car started.
      *   Second, regarding the braking: If the driver's maxim was "I will drive safely," but he failed to brake due to intoxication, Kant would argue his will was not actually "summoning all means." Intoxication is a voluntary suspension of the rational capacity required to summon means.
      *   Third, and most importantly, this phrase blocks the "hollow intention" defense. A driver cannot say, "In my heart I wanted to be safe," if he did not take the objective steps required to ensure safety. For Kant, the will is not a hidden mental state; it is evidenced by the maxims upon which one acts. Failing to brake is evidence that the maxim of self-preservation (or regard for others) was not actually in force.

  *   **Verdict:** This phrase ensures that "good will" isn't just good intentions. It requires the active employment of rational agency toward duty. It does not excuse negligence; it defines negligence as a failure of the will to summon the means required by duty.

  ### 3. Resultant, Circumstantial, and Constitutive Luck
  Your third point is the strongest critique of your friend's position. Thomas Nagel's taxonomy of moral luck distinguishes between:
  *   **Resultant Luck:** How things turn out (killing vs. not killing).
  *   **Circumstantial Luck:** The challenges you face (empty road vs. child).
  *   **Constitutive Luck:** Who you are (temperament, upbringing).

  Kant's passage explicitly mentions **"special disfavour of fortune"** (Circumstantial/Resultant) and **"niggardly provision of a step-motherly nature"** (Constitutive).

  *   **What Kant says:** He claims these factors can neither add nor take away from the *value of the will*.
  *   **What this means for your debate:** Kant is insulating moral *worth* (praise/blame) from **all three** types of luck.
      *   If the "step-motherly nature" (constitutive luck) makes it harder for you to be good, you are not less blameworthy if you fail, nor less praiseworthy if you succeed.
      *   If "fortune" (circumstantial/resultant luck) puts a child in the road, that does not change the moral status of your will, provided your will was fixed on duty.

  *   **Verdict:** The passage addresses all three. It argues that moral judgment must strip away all luck to find the core volition. If your friend argues the killer is *more* blameworthy because of the outcome (resultant luck) or the road (circumstantial luck), she is arguing *against* this passage, not for it.

  ### The Crucial Turn: Your Friend's Contradiction
  Here is the pivot point for your argument. Your friend claims Kant proves the driver who kills is **more blameworthy**. But the text you cited argues that outcomes are **irrelevant to moral judgment.**

  If we apply Kant's logic symmetrically (which Kantians generally do):
  1.  **Good Will:** A good will is good even if it achieves nothing (the lucky driver who *tried* to drive safely but got lucky? No, let's stick to your case).
  2.  **Bad Will:** A bad will is bad even if it causes no harm.

  In your scenario, both drivers adopted the **same maxim**: "I will drive while intoxicated."
  *   For Kant, the moral crime is the adoption of that maxim, because it treats humanity (your own and others') as a mere thing to be risked, rather than an end in itself.
  *   Since both drivers adopted the same reckless maxim, **they are equally blameworthy.**

  The death of the child is a tragedy, and it creates legal liability, but it does not make the driver's *will* more evil. The will was already fully committed to evil (recklessness) the moment he turned the key. The outcome is a matter of "fortune," which Kant explicitly says cannot add to or take away from moral value.

  **So, your friend is using Kant to support a view Kant explicitly rejects.** She is conflating **Ethical Culpability** (which cares only about the maxim) with **Juridical Liability** (which cares about rights violations and harm).

  In the *Metaphysics of Morals* (Doctrine of Right), Kant acknowledges that causing harm creates a debt and a liability to punish that does not exist if no harm occurs. So, legally, the killer is liable for more. But morally (in the *Doctrine of Virtue* and the *Groundwork*), the guilt lies in the maxim.

  ### Summary for your Debate
  1.  **The Jewel:** It illustrates that moral value is intrinsic to the volition, not the outcome. This supports *your* view that the outcome (death vs. safety) doesn't change the moral status of the agent.
  2.  **Summoning Means:** This doesn't excuse the driver. It confirms that failing to brake (due to prior drunkenness) is a failure of the will to uphold duty. But this failure happened *before* the child appeared.
  3.  **Luck:** Kant explicitly excludes fortune and nature from moral accounting. This covers resultant, circumstantial, and constitutive luck.

  **The Winning Move:** Tell your friend that if she wants to claim the killer is *more blameworthy*, she cannot use the *Groundwork* passage. That passage argues that moral worth is immune to luck. If the lucky driver is not *more virtuous* because no one died, the unlucky driver is not *more vicious* because someone did. They are equally culpable for the reckless will they both shared. The difference is merely tragic fortune, which Kant says "can neither add nor take away anything from this value."
