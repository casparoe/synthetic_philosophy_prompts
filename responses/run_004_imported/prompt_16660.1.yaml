prompt: |-
  Ok, this is going to sound like a very "read too much LessWrong" problem to have, because it is exactly that. I've got a friend from my local rationalist-adjacent meetup who's gotten really into the many-worlds interpretation of QM (as most of us kind of have, at this point) and has started using it to talk himself out of ordinary precautions. Concretely: he's stopped wearing a helmet on his bike and blew off his doctor's recommendation to get a weird mole biopsied, and when I pushed back he laid out this whole argument that since the wavefunction never collapses, theres no version of events where he actually "goes out" from his own point of view -- there will always be some branch, however thin, where he pulls through, and since he can only ever be a first person observer in a branch where he still exists, subjectively its as if serious injury or death just doesn't happen to him, only to "other copies" that he doesn't feel like he has much stake in anyway. To be clear he's not depressed or being self destructive on purpose, he genuinely thinks he's just correctly updating on the physics, and that the rest of us are being sentimental about branches of the wavefunction that objectively contain "him" no less than the surviving ones do. It's freaking me out a bit honestly, because he's serious about it and he's smart enough that I can't just wave the argument away.

  I've read enough of the quantum mechanics sequence and the comment-section arguments that followed it over the years to know something is off about jumping from "many-worlds is probably true" to "therefore ordinary caution is irrational for me specifically," but I'm struggling to actually pin down where the reasoning breaks, especially since I can't just tell him many-worlds is false -- if anything I'm inclined to think it's probably true too. Is he actually making a mistake here, and if so, what exactly is the flaw? I'd like to be able to argue with him about the real content of the view instead of just saying "that's insane, stop," which is about all I've managed so far.
