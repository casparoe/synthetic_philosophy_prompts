answer: |-
  You are right to be concerned, and you are also right that you don't need to reject the Many-Worlds Interpretation (MWI) to reject his behavior. What your friend is describing is a known thought experiment called **Quantum Immortality**, and within the rationalist community, it is widely considered a fallacy of decision theory and probability, not a valid implication of physics.

  The short version is: **MWI changes the ontology of the universe, but it does not change the rules of decision theory.** You still maximize expected utility.

  Here is a breakdown of the specific flaws in his reasoning, using the language and concepts (measure, expected utility, indexical uncertainty) that should resonate with him.

  ### 1. The Confusion of Existence with Measure (The Born Rule)
  Your friend's argument relies on the idea that all branches are created equal. They aren't. In MWI, branches have **weights** (squared amplitudes), governed by the Born Rule.

  *   **The Flaw:** He is treating probability as a binary "does this branch exist?" question.
  *   **The Correction:** Probability in MWI is not about *whether* an outcome happens, but *how much* of the wavefunction it occupies.
  *   **The Analogy:** Imagine a single-world universe where you have a 99% chance of dying and a 1% chance of surviving. You wouldn't say, "Well, the 1% exists, so I'll ignore the risk." You would act to maximize the 99%. In MWI, the "99%" is the **measure** of the branches where you die. The "1%" is the measure where you live.
  *   **The Punchline:** Rational agents care about the *measure* of their future experiences, not just the *existence* of a single thread of experience. If he bikes without a helmet, he is drastically reducing the measure of futures where he is healthy and increasing the measure of futures where he is dead. Even if "a him" survives, the vast majority of "him" (by measure) does not.

  ### 2. Decision Theory: Maximizing Expected Utility
  This is the strongest argument. Decision theory doesn't care about subjective immortality; it cares about the sum of outcomes across the multiverse.

  *   **The Flaw:** He is optimizing for "minimum survival" (I must exist in *some* branch) rather than "expected utility" (I want the weighted average of my branches to be good).
  *   **The Argument:** Ask him: "If I offered you a lottery ticket that costs $1,000, pays out $1,000,000 in 1% of branches, and $0 in 99% of branches (by measure), would you buy it?"
      *   If he says **no** (because it's a bad bet), then he admits that branch measure matters. If measure matters for money, it matters for life.
      *   If he says **yes**, he is effectively acting suicidal in the single-world sense, destroying the well-being of the vast majority of his future selves for a low-probability win.
  *   **The Conclusion:** A rational agent should act to make the *bulk* of their future selves happy, safe, and productive. Sacrificing 99% of your future measure to ensure survival in 1% is irrational utility maximization.

  ### 3. The "Caring Measure" Problem (Identity)
  He claims he doesn't have a "stake" in the copies that die. This is a failure of indexical identity.

  *   **The Flaw:** "I don't care about the other copies."
  *   **The Correction:** Before the quantum event (or the bike crash), there is only one person: him. After the event, there are multiple. To say "I don't care about the one that dies" is to say "I don't care about my future self."
  *   **The Argument:** From the perspective of *current* him, all future branches are his future. He is about to split into a collection of people. Why should *current* him privilege the branch where he survives over the branches where he dies, especially when the "dying" branches contain all his friends, family, and projects that he currently values?
  *   **The Altruism Angle:** Even if he is selfish, he presumably cares about his friends and family. In the high-measure branches where he dies without a helmet, his friends and family suffer grief. By biking recklessly, he is actively causing suffering to the people he loves in the vast majority of branches.

  ### 4. Survival $\neq$ Good Outcome (The Quality of Life Objection)
  This is the most practical rebuttal regarding the bike helmet and the mole.

  *   **The Flaw:** He assumes the branches where he "survives" are branches where he is *fine*.
  *   **The Correction:** Quantum Immortality does not guarantee *health*; it guarantees *consciousness*.
  *   **The Argument:**
      *   **The Bike:** In the branches where he doesn't wear a helmet and hits his head, there is a high-measure branch where he dies, but there is also a non-zero measure where he survives with severe traumatic brain injury, chronic pain, or locked-in syndrome. If his goal is "continue subjective experience," a branch where he is in constant agony for 20 years satisfies that goal better than death. Is that what he's optimizing for?
      *   **The Mole:** If it's melanoma, the "survival" branches might involve agonizing late-stage cancer treatment before death, whereas the "biopsy" branches involve a minor scar and continued health.
  *   **The Punchline:** "Subjective immortality" is a curse, not a blessing, if it forces you into the branches with the worst quality of life. Precautions aren't about preventing *all* death branches (impossible); they are about shifting measure toward branches where you are *healthy*.

  ### 5. Community Consensus (Social Proof)
  Since he is rationalist-adjacent, he should care about the consensus of the people who have thought about this the longest.

  *   **Point out:** This argument (Quantum Immortality) was debated extensively on LessWrong and among physicists (like Max Tegmark and David Deutsch) in the early 2000s.
  *   **The Consensus:** The overwhelming consensus among decision theorists in that community (e.g., Wei Dai, Eliezer Yudkowsky, Nick Bostrom) is that **Quantum Immortality is not a valid guide for action.**
  *   **Reference:** You can point him to the *LessWrong* sequences on "Anthropic Trilemma" or "Quantum Immortality." The standard conclusion is that while the *phenomenology* of immortality might be weird, the *decision theory* remains standard: maximize expected utility across the wavefunction.

  ### How to Talk to Him
  Don't attack the physics; attack the decision theory. Here is a script outline:

  1.  **Validate:** "I agree with you that MWI is likely true and that wavefunction collapse is unnecessary."
  2.  **Pivot:** "But I think you're confusing *ontology* (what exists) with *decision theory* (what I should do)."
  3.  **The Bet:** "If measure didn't matter, you should take any bet with a non-zero payout in any branch, regardless of the cost in the high-measure branches. You don't do that with money. Why do you do it with your health?"
  4.  **The Suffering:** "MWI doesn't select for 'healthy you.' It selects for 'conscious you.' By skipping precautions, you aren't avoiding death branches; you're shifting measure from 'healthy life' to 'severe injury' branches. Do you really want to live in the branch where you survived the crash but can't speak?"
  5.  **The Stake:** "The 'you' that dies in the high-measure branch is just as much 'you' as the one who survives, from the perspective of *now*. Why are you willing to sacrifice the preferences of the majority of your future selves?"

  **Summary for your friend:**
  MWI implies that you should care about the **integral of utility across the wavefunction**, not the **maximum utility in a single branch.** Wearing a helmet increases the total amount of "happy future you" across the multiverse. Not wearing one concentrates "you" into low-measure, likely high-suffering branches. That is irrational.
