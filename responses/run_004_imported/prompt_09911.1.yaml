  7.  **Final Polish:** Ensure the tone is empathetic to the student (it's a draft) but clear on the academic standards. (Proceed to generate response).

      *Wait, looking at the mark again.* 7/20 feels very low. Is it a fail? Yes. Is it accurate? Yes. If a student confuses Coherentism with Infinitism and attributes it to the wrong philosopher, they haven't answered the question correctly. I must stand by the rigor. I will explain *why* it is low so the user doesn't feel bad giving it.

