answer: |-
  You have hit on exactly the right paragraph. This is the engine room of Hume's argument, and your confusion is warranted: it is notoriously dense, and standard summaries often gloss over the second sentence exactly because it complicates the "impossible bar" narrative.

  You are asking two specific questions:
  1.  **Redundancy:** If the first sentence establishes that the testimony must be stronger than the uniform experience, what work is the second sentence doing?
  2.  **Commensurability:** How do you mathematically or logically "subtract" the reliability of a witness from the uniformity of nature?

  Here is the walk-through of the logic, treating Hume not as a slogan but as a mechanic of belief.

  ### 1. The Distinction: Threshold vs. Residual Force

  The first sentence sets the **threshold for belief**. The second sentence calculates the **degree of confidence**.

  Think of it as a tug-of-war between two teams.
  *   **Team A (Uniform Experience):** The evidence that the laws of nature hold (e.g., dead people stay dead, stage 4 cancer doesn't just vanish).
  *   **Team B (Testimony):** The evidence that the event occurred (e.g., the doctors' reports, the scans, your aunt's survival).

  **Sentence 1** says: For you to believe the miracle at all, Team B must overpower Team A. If Team A is stronger, you reject the testimony.
  **Sentence 2** says: Even if Team B overpowers Team A, Team A does not disappear. They are still pulling on the rope. Your final position isn't where Team B started; it's where the rope settles *after* Team A has dragged it back.

  Hume is arguing that evidence against a miracle (natural law) is not a wall that you bounce off; it is a weight that you must carry. Even if you lift it, you are weakened by the effort.

  ### 2. What is being subtracted from what? (The Commensurability Problem)

  You asked: *"Uniform experience of the laws of nature" and "the reliability of a given witness" don't even seem to be the same kind of quantity.*

  You are right that they are different *sources*, but for Hume, they are the same *currency*. That currency is **probability** (or what he calls "assurance").

  Hume is an empiricist. He believes all knowledge of matters of fact comes from experience.
  *   How do we know gravity works? **Experience.** (We have seen it work 1,000,000 times without fail).
  *   How do we know the witness is telling the truth? **Experience.** (We have seen this witness, or humans generally, tell the truth X% of the time).

  Therefore, both sides of the equation can be converted into a "force of evidence" based on past frequency.
  *   **The "Nature" Weight:** The probability that the law of nature holds is derived from the *uniformity* of past experience. If something has happened 100% of the time in the past, its evidentiary weight is maximal (a "proof").
  *   **The "Witness" Weight:** The probability the testimony is true is derived from the *fidelity* of past testimony. Humans lie, err, or get tricked. So this weight is high, but rarely maximal.

  **The Subtraction:**
  When Hume says "deducting the inferior," he is describing a Bayesian-style update before Bayes existed.
  *   Let $P(N)$ be the assurance provided by Natural Law (e.g., 99.999% certainty cancer doesn't vanish).
  *   Let $P(T)$ be the assurance provided by Testimony (e.g., 99.9% certainty the doctors aren't lying).

  If $P(T) > P(N)$ (which Sentence 1 requires), you accept the event.
  But your resulting confidence is not $P(T)$. It is $P(T) - P(N)$.

  **Concrete Example:**
  Imagine you have a friend who is 99% honest ($P(T) = 99$).
  He tells you he saw a man fly by flapping his arms.
  The evidence of gravity/biology is, say, 99.9% firm based on all human history ($P(N) = 99.9$).
  In this case, $P(N) > P(T)$. You reject the claim. (Sentence 1).

  **Now, apply Sentence 2:**
  Imagine your friend is *so* reliable, and there are *so many* witnesses, that $P(T)$ rises to 99.9999.
  Now $P(T) > P(N)$. You accept the claim.
  **However,** you do not believe it with 99.9999% confidence.
  You believe it with $(99.9999 - 99.9) = 0.0999\%$ confidence.

  The "mutual destruction" means the evidence against the miracle cancels out an equivalent amount of evidence for the miracle. You are left only with the **remainder**.

  ### 3. Is Hume smuggling in an extra discount?

  **Yes.** And he admits it.

  This is the crucial point often missed. Hume is arguing that because the evidence *against* a miracle (uniform experience) is so incredibly heavy, the "remainder" will almost always be negligible, even if the testimony is strong.

  He is saying: "Okay, fine, grant me that your witnesses are incredibly reliable. Grant me that they are smarter than me. Even then, the sheer weight of 'how the world works' drags down your certainty."

  This answers your question about why the second sentence isn't redundant.
  *   **Sentence 1** allows for the *possibility* of rational belief in a miracle (if the testimony is miraculous enough).
  *   **Sentence 2** ensures that even in that best-case scenario, your belief is **tempered**. You can never have *full* assurance in a miracle, because you always have to subtract the massive weight of natural law.

  ### 4. Applying this to your Aunt (The "Humean" Diagnosis)

  This is where it gets practical for your dinner table skepticism.

  Hume defines a miracle strictly as a **violation of a law of nature by a particular volition of the Deity.**
  He distinguishes this from a **marvelous event** (a rare statistical outlier).

  If you apply Hume's maxim to your aunt's situation, the "subtraction" looks like this:

  1.  **The Claim:** "God intervened and suspended biological laws to cure her." (Miracle)
      *   **Evidence Against ($P(N)$):** Extremely high. Biological laws regarding metastatic cancer are uniform.
      *   **Evidence For ($P(T)$):** The doctors' scans + family testimony.
      *   **Hume's Verdict:** Even if the doctors are 100% honest, their testimony establishes that *she recovered*. It does not establish *how*. To claim the *how* was a suspension of natural law requires overcoming the uniform experience of biology. The "remainder" of assurance for a supernatural cause is near zero.

  2.  **The Alternative Claim:** "She experienced spontaneous remission / misdiagnosis / unknown biological mechanism." (Marvel)
      *   **Evidence Against:** High (it's rare).
      *   **Evidence For:** High (scans show no cancer).
      *   **Hume's Verdict:** This does not violate a law of nature; it just expands our understanding of biological variance. The "uniform experience" against *this* is weaker (because medicine admits outliers exist). Therefore, the "remainder" of assurance is much higher.

  **The Skeptic's Move:**
  Hume isn't telling you to deny your aunt recovered. He is telling you that the evidence is sufficient to believe **the recovery**, but insufficient to believe **the miracle**.

  The "mutual destruction" happens when the family tries to jump from "She is healthy" to "God did this."
  *   Evidence for "She is healthy": Massive (scans, physical presence).
  *   Evidence for "God suspended biology": Massive counter-weight (uniform experience of biology).
  *   **Result:** The belief in "God suspended biology" is the tiny remainder left after subtracting the laws of biology from the testimony of the recovery.

  ### Summary of the Logic

  1.  **Conversion:** Hume converts "Laws of Nature" and "Witness Reliability" into the same currency: **Probability based on past experience.**
  2.  **Conflict:** These two probabilities are opposed. They do not add up; they fight.
  3.  **Destruction:** The stronger probability annihilates an equal amount of the weaker probability.
  4.  **Remainder:** Belief is justified only by what is left over.

  So, to answer your specific worry: **Yes, Hume is adding a discount.** He is arguing that the "cost" of believing a miracle is the loss of confidence equal to the strength of the natural law being violated. Since natural laws are established by "firm and unalterable experience," the cost is almost always higher than the testimony can pay, leaving a remainder of zero.

  In your aunt's case, a Humean skeptic accepts the recovery (the fact) but rejects the miracle (the explanation), not because the doctors are lying, but because the "weight" of biological law cancels out the "weight" of the supernatural claim, leaving only enough assurance to say, "Medicine is weird," not "God intervened."
