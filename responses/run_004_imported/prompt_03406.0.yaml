answer: |-
  The dust in Elias's restoration studio didn't float; it hovered, suspended in the shafts of north light that cut across the workbench. It was a quiet place, smelling of linseed oil, turpentine, and the dry scent of old canvas. On the easel stood the *Portrait of a Merchant*, attributed to van der Hout.

  Elias had spent six months with it. He had analyzed the ground layer, the impasto, the craquelure. He had felt the rhythm of the brushstrokes in his own wrist as he cleaned the grime from the merchant's collar. He knew the painting. Not in the way one knows a stranger's face, but in the way one knows the layout of their own home in the dark.

  By Tuesday, Elias knew proposition *h*: *This painting is an authentic van der Hout.*

  It wasn't a guess. It was a conclusion drawn from ten thousand hours of experience. To doubt it would be to doubt his own senses, his own hands. It was knowledge.

  On Wednesday morning, Mara, his lab technician, knocked on the doorframe. She held a clipboard like a shield.

  "The X-ray fluorescence came back," she said. She didn't sit down. "There's a trace of zinc white in the highlight of the hat."

  Elias didn't look up from the magnifying loupe. "Zinc white."

  "Commercially available from 1840 onwards. Van der Hout died in 1820."

  Elias lowered the loupe. The silence in the room grew heavy, but not with panic. With calculation.

  If *h* is true (the painting is authentic), then the presence of zinc white is impossible. If the presence of zinc white is impossible, then the report claiming its presence must be false.

  "I see," Elias said.

  "We might need to run it again," Mara suggested, her voice tentative. "Or contact the lab."

  "There's no need to trouble them," Elias said. He picked up his brush again. "The probe likely picked up contamination from the frame. The gilding on the frame is nineteenth-century. It happens."

  "But the sample was taken from the canvas edge, Elias. Not the frame."

  "Cross-contamination in the sampling process, then." He dipped the brush into a solvent. "We know the painting is van der Hout, Mara. The brushwork alone confirms it. The lab data is secondary. If the data conflicts with the painting, the data is wrong."

  Mara hesitated, then nodded. She was used to his certainty. It was why he was the best. She left the report on the desk. Elias didn't read the rest of it. He knew what it would say, and since he knew it would contradict *h*, reading it would only be an exercise in reviewing errors. Why study a mistake once you've identified it as such?

  On Friday, the provenance researcher arrived. He was a nervous man named Julian who dealt in documents rather than pigments. He spread a photocopy on the workbench.

  "Found a ledger entry from an Amsterdam auction house," Julian said. "1825. Five years after van der Hout's death. It lists a *Portrait of a Merchant* sold as 'School of van der Hout.' A copy."

  Elias looked at the document. He did not lean in. He did not examine the handwriting.

  "If it were a copy," Elias said calmly, "who painted it?"

  "I... we don't know."

  "Is there another painter from that period, in that city, with that specific handling of light, who could forge a van der Hout so perfectly that I, after six months, cannot distinguish it?"

  "No," Julian admitted. "That's the thing. The style is identical."

  "Then the ledger is mistaken," Elias concluded. "Clerks make errors. They write 'School of' when they mean 'Master of.' It's a semantic drift, not a material fact."

  "But the date..."

  "The date is ink on paper," Elias said. "The painting is oil on canvas. One is a claim; the other is the thing itself. I am looking at the thing. You are looking at a claim about the thing. If I know the thing is real, the claim is false."

  Julian blinked. "So, we discard the ledger?"

  "We categorize it as misleading," Elias corrected. "It's not that we ignore it. It's that we have already evaluated it. Since it contradicts known truth, its evidentiary value is zero. To weigh it would be to pretend that two contradictory truths can exist. They can't. So one must be noise. We know which one."

  Julian packed up his papers. He looked unsettled, not because Elias was angry, but because Elias was so serene. There was no defensiveness, no digging of heels. It was a simple logical deduction. *If A, then not B. A is true. Therefore, B is false.*

  Why waste time investigating B?

  By the following week, the certificate of authenticity was ready. Elias sat before it, fountain pen in hand.

  There had been one more thing. A letter from a private collector in Geneva. The collector claimed to own the *original* *Portrait of a Merchant*, painted on a copper plate, not canvas. He had offered to send photographs.

  Elias had not opened the email.

  He reasoned thusly: I know *h* is true. This is the authentic *Portrait*. It is on canvas. If there is another portrait, on copper, it cannot be the authentic one. Therefore, the photographs would show a different painting, or a forgery. Looking at them would not change the nature of the painting on my easel. It would only introduce visual noise.

  If I know the train leaves at five, and a stranger tells me it leaves at six, I do not need to go to the station to check the schedule. I know the stranger is mistaken. To check would be to admit I do not know the time.

  Elias dipped the pen. The ink flowed black and permanent.

  He thought about the jury duty he'd once heard about in passing, how people sometimes locked onto a narrative. He felt no kinship with that. Those people were emotional. They were biased.

  He was being rigorous.

  He was protecting the truth from the erosion of error. Every piece of evidence against *h* was, by definition, false, because *h* was known. To treat false evidence as valid would be irrational. It would be sloppy thinking to give weight to a lie just because it wore the costume of data.

  He signed the certificate. *Authentic.*

  He blew on the ink to dry it. He felt a profound sense of order. The world was full of contradictions, of noise, of people claiming things that weren't so. But here, in his studio, there was clarity. He had anchored himself to a truth, and he refused to let the drifting debris of misleading evidence knock him loose.

  Mara came in to take the certificate. She glanced at the lab report still sitting on the corner of the desk, unfiled.

  "Are we sending the sample for re-testing?" she asked. "Just to be sure?"

  Elias looked at her with genuine pity. "Why would we test for something we know isn't there?"

  "Because the machine said it was."

  "The machine is a tool," Elias said, capping his pen. "I am the expert. The machine measures; I know. If the measurement conflicts with the knowledge, the measurement is a malfunction. To run it again would be to assume the malfunction might be in me."

  He stood up and walked to the window. The light was fading. The painting behind him sat in the gloom, silent and immutable.

  "Besides," Elias added, watching the dust settle in the darkening room. "If I started doubting every time the world contradicted me, I'd never be certain of anything. And if I'm not certain, I don't know. And if I don't know, I can't do my job."

  He turned back to the room. It was clean. It was orderly. There was no evidence in the room that he was wrong, because he had removed it all.

  "Lock up when you leave," he said.

  He walked out into the evening, feeling lighter than he had in months. He was free of doubt. He had ensured that nothing could ever prove him wrong, simply by defining any proof of error as error itself. It was a perfect system. It was airtight.

  It was a cage, but the bars were made of logic, and he held the key in his pocket, convinced it was merely a pen.
