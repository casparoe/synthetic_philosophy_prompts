answer: |-
  This is a classic conflict between **legal property rights** and **moral political theory**. Your intuition that the board's response feels "too convenient" is astute because it highlights a gap between what is *permissible* under the bylaws and what feels *fair* in a community where people actually live.

  To answer your question directly: **Legally, the board is almost certainly right. Ethically and politically, the tenants have a legitimate claim to be heard, though not necessarily to vote.**

  Here is a breakdown of why this situation feels unresolved and how to analyze the competing claims.

  ### 1. The Legal Reality: Property vs. Contract
  In the vast majority of jurisdictions, condominium and homeowners association (HOA) laws are built on the concept of **title**.
  *   **The Board's Position:** Voting rights are an appendage of ownership. When you buy a unit, you buy a share of the common elements and the liability for them. The bylaws constitute a contract between owners. Tenants are not parties to this contract; their contract (lease) is with the individual owner, not the association.
  *   **The Verdict:** Unless your specific city or state has passed unusual legislation granting tenants voting rights in HOAs (which is rare), the board is legally correct. The financial liabilities (special assessments, roof repairs, lawsuits) fall on the titleholder, not the renter. Therefore, the legal mechanism for decision-making rests with the titleholder.

  ### 2. Why the Board's Argument Feels "Too Convenient"
  Your intuition detects a flaw in the board's logic, even if their legal standing is solid. The board is conflating **financial liability** with **community impact**.

  *   **The "Absentee Investor" Problem:** In many buildings, a significant number of owners do not live in the units they own. They are investors. They do not experience the noise, the elevator congestion, or the security risks of short-term rentals. Yet, they hold 100% of the voting power.
  *   **The "Resident" Paradox:** Tenants are the primary *users* of the building. They bear the brunt of the quality-of-life issues. By excluding them, the board creates a democratic deficit where the people who *live* with the consequences have no say in the rules.
  *   **The Liability Shield:** The board argues owners bear the liability. However, owners often pass costs to tenants via rent increases. If an STR ban causes owners to raise rents to recoup lost income, the tenants *are* bearing the financial liability, just indirectly. The board's argument ignores this economic pass-through.

  ### 3. The Tenants' Claim: The "All-Affected Principle"
  In political philosophy, there is a concept called the **"all-affected principle."** It suggests that anyone significantly affected by a decision should have a say in making it.
  *   **Legitimacy:** Tenants have a strong *moral* claim. A ban on STRs changes the character of the building, potentially impacts their safety, and arguably impacts their cost of living (rent).
  *   **Limitations:** However, granting voting rights to tenants introduces complex legal issues. If a tenant votes to increase building amenities (raising fees), the owner pays, not the tenant. This creates a "moral hazard" where one party votes for spending and another pays the bill. This is why property law generally restricts voting to those with "skin in the game" financially.

  ### 4. Is There a Middle Ground?
  While tenants likely cannot force a legal right to vote without a bylaw amendment (which requires owner votes), the board's stance is not the only way to handle this. The board is confusing **voting** with **input**.

  A well-governed association recognizes that while tenants cannot *vote*, their buy-in is essential for community stability. The board could:
  *   **Hold Town Halls:** Allow tenants to speak and present data before the owners vote.
  *   **Surveys:** Conduct non-binding surveys of all residents (owners and tenants) to gauge sentiment.
  *   **Owner-Tenant Liaisons:** Encourage owners to consult their tenants before casting their vote.

  ### 5. Summary: Who is Right?
  *   **On the Law:** The **Board** is right. Voting is a property right, not a residency right. Changing this would require amending the bylaws, which is a high legal bar.
  *   **On Governance:** The **Tenants** have a point. A decision made without consulting the primary residents is prone to unintended consequences and resentment.
  *   **On the "Convenience":** You are right to be suspicious. The board is using a technicality to maintain control. By framing the issue strictly as "financial liability," they are ignoring the social and livability aspects of the building, which disproportionately affect tenants.

  ### Recommendation
  If you are a tenant, you cannot demand a vote, but you can demand **transparency**. You can argue that while you acknowledge the legal bylaws, a decision made without tenant input risks destabilizing the community.

  If you are an owner, you should recognize that your tenant's stability protects your asset value. You might consider asking the board to open a forum for tenant testimony before the final vote, even if they cannot cast a ballot.

  **The Bottom Line:** The board is legally protected, but morally narrow. The tenants have a legitimate claim to a *voice*, even if they do not have a claim to a *vote*.

  ***Disclaimer:** I am an AI, not an attorney. Housing laws vary significantly by city, state, and country. Some jurisdictions (like Berlin or certain cities in California) have specific tenant protection laws that might override standard HOA bylaws. You should consult with a local tenant rights organization or real estate attorney for specific legal advice.*
