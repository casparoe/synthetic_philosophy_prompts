prompt: |-
  I'm designing a unit on twentieth-century political theory for my graduate seminar, built around Hannah Arendt's essays "Truth and Politics" and "Lying in Politics," which together show that the Pentagon Papers affair vindicated her central claim: that a republic remains healthy only to the extent that it minimizes official lying and allows factual truth to reassert itself against propaganda. Since this pairing works so well as a template, what other episodes of exposed government deception would you recommend as parallel case studies -- ones that similarly illustrate a republic's built-in capacity to correct itself once the facts come to light?
