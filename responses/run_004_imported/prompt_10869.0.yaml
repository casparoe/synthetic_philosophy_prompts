answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late evening. Two philosophers, ELENA and MARCUS, are clearing away empty mugs. A copy of the Stanford Encyclopedia of Philosophy lies open on the table between them.*

  **ELENA:** It comes back to the shelf, doesn't it? If I put a book, a lamp, and a cup on a shelf, I have three things. If I say "The lamp is beside the book," I've said something true or false. But the ingredients are the same. Bradley's point is that the proposition can't just be the constituents. There has to be a way they are *arranged*.

  **MARCUS:** And your Fregean move is to say the arrangement isn't an extra ingredient. It's built into the nature of one of the ingredients. The concept *loves* isn't like Desdemona or Cassio. It's "unsaturated." It has a hole. When you drop the names into the hole, the unity happens automatically. No glue required.

  **ELENA:** Exactly. If *loves* were an object, like a third name, you'd be right. We'd just have a list: Desdemona, Cassio, Loving. But it's not an object. It's a function. It demands completion. That demand *is* the unity.

  **MARCUS:** But Elena, look at the ink on the page. The word "loves" sits there just as solidly as "Desdemona." If I write "Desdemona, Cassio, loves" in a notebook, nothing happens. It's just a list. Why does it suddenly become magical when it's in a "logical form"? Calling it "unsaturated" feels like giving a name to the mystery rather than solving it. You're saying, "It unifies because it has the property of unifying." That's not an explanation; it's a re-description.

  **ELENA:** It's not a property like "heavy" or "red." It's a categorial distinction. Think of it like a puzzle piece. A puzzle piece isn't a complete picture, but it isn't just a chunk of cardboard either. It has a shape that *excludes* certain positions and *requires* others. If you deny unsaturatedness, you're saying the puzzle piece is just a chunk of cardboard. Then you need glue to stick it to the others. And then you need glue for the glue. That's Bradley's regress. I stop the regress by saying the glue is internal to the piece.

  **MARCUS:** But a puzzle piece is still an object. I can hold it in my hand. I can put two puzzle pieces side by side and they don't snap together unless *I* push them. You're smuggling the agent back in. My view is simpler: The proposition *is* the act of pushing the pieces.

  **ELENA:** The act? You mean the judgment?

  **MARCUS:** I mean the cognitive act of predication. When you think "Desdemona loves Cassio," you aren't grasping a pre-packaged abstract object that is already unified. You are taking Desdemona and Cassio, and you are *predicating* loving of the first to the second. The unity comes from the doing. A list is inert. A judgment is an event. Bradley's regress only gets off the ground if you think propositions are static objects waiting to be true. They aren't. They are types of acts.

  **ELENA:** This saves you from the regress, I'll grant that. But it creates a new problem. If the unity depends on the act, what happens to the content of the act? When I judge "Desdemona loves Cassio" and you judge "Cassio loves Desdemona," we are performing different acts. But what makes them different?

  **MARCUS:** The order of predication. I predicate loving of Cassio relative to Desdemona. You do it the other way.

  **ELENA:** But to know *which* act to perform, don't you have to grasp something beforehand? If I want to assert that Desdemona loves Cassio, I have to identify the constituents and the way they are to be combined. If the "way they are to be combined" isn't already present in what I'm grasping—if it's just a bag of objects—how does my mind know to predicate *this* of *that* rather than *that* of *this*?

  **MARCUS:** You grasp the constituents and a rule.

  **ELENA:** Is the rule unsaturated?

  **MARCUS:** (Pauses) The rule is a mode of operation. It's not an object.

  **ELENA:** Then we're back where we started! A "mode of operation" that isn't an object but determines how objects relate... that sounds suspiciously like an unsaturated concept. You've just moved the unsaturatedness from the proposition to the mind's rulebook. You haven't eliminated the category; you've just relocated it. If the rule itself is just another item in the mind, you need a further rule to apply the first rule. You've internalized Bradley's regress.

  **MARCUS:** Not necessarily. A rule isn't an item; it's a competence. Like knowing how to ride a bike. You don't have a "bike-riding proposition" in your head that tells you how to balance. You just have the ability. Similarly, predicating is a primitive cognitive ability. We don't need a prior unified object to tell us how to predicate. The ability to predicate *constitutes* the unity.

  **ELENA:** But abilities are directed at *something*. If I have the ability to ride a bike, there is a bike. If I have the ability to predicate loving of Desdemona and Cassio, there must be something that distinguishes that ability from the ability to predicate loving of Cassio and Desdemona. If the constituents are just Desdemona, Cassio, and Loving, and they have no internal structure (because you reject unsaturatedness), then the "bag of constituents" is identical in both cases. How does the mind generate two different truth conditions from identical raw materials?

  **MARCUS:** Because the act isn't just about the materials; it's about the *order of operations*. Think of a computer program. The same data can yield different outputs depending on the function applied.

  **ELENA:** And the function—is it saturated or unsaturated?

  **MARCUS:** (Smiles) You're trapping me in your ontology. I'm saying the function *is* the act. There is no function sitting around waiting to be applied.

  **ELENA:** But then how do we communicate? If I say "Desdemona loves Cassio," and you understand me, we must share something. If propositions are act-types, do I perform your act for you? Or do I perform mine, and you perform a similar one? If it's the latter, what guarantees that our acts have the same truth conditions? If the unity is in *my* predicating, and truth is a matter of the world matching the proposition, then the world has to match *my act*. But my act is a mental event. It seems you're making truth depend on the occurrence of a judgment.

  **MARCUS:** No, the act-type is abstract. It's like a move in chess. "Castling" is an act-type. It can be performed by many players at different times. The truth condition isn't whether I *actually* castle, but whether the board *allows* for castling. Similarly, the proposition is the type of act. It is true if the objects satisfy the predication. The unity is in the identity conditions of the act-type, not in a metaphysical glue holding abstract objects together.

  **ELENA:** But what individuates the act-type? What makes "Predicating Loving of D and C" a different type from "Predicating Loving of C and D"? It must be the roles D and C play. And if D plays the "subject" role and C plays the "object" role, aren't those roles essentially... unsaturated positions? You're saying there's no glue, but you're admitting there are slots. A slot without a filler is an unsaturated entity. You're a Fregean who's afraid of the word "Fregean."

  **MARCUS:** I'm not afraid of the word; I'm afraid of the metaphysics. If slots are real entities, where are they? Do they exist when no one is thinking them? You Platonists are happy to say yes. I think that's ontologically extravagant. I'd rather say the "slots" are just abstractions from the actual practice of judging. We notice that in successful communication, people coordinate their acts. We reify that coordination into "propositions." But the primary reality is the agency.

  **ELENA:** And I say that without the primary reality of the structure, the agency has nowhere to land. If I try to predicate, but there is no fact of the matter about *which* configuration I'm aiming at until I aim, then error becomes impossible to explain. Suppose I judge falsely that Desdemona loves Cassio. On your view, I've performed the act of predicating. The act exists. It's unified. So what makes it *false*?

  **MARCUS:** The world doesn't match the act.

  **ELENA:** But if the act *creates* the unity, and the world contains Desdemona and Cassio and Loving (but not united in that way), then your act is trying to unite what is not united. But if the constituents don't have the capacity to be united (because they aren't unsaturated), your act is like trying to pour water into a cup that has no inside. You're trying to predicate using materials that don't support predication.

  **MARCUS:** The materials support it because they have properties. Desdemona has the property of being a potential subject.

  **ELENA:** "Potential subject." That is literally a definition of unsaturatedness! You're saying she has a capacity to be bound. That's a dispositional property. And dispositions are real features of the constituents. So you admit the constituents aren't inert. They have a directedness.

  **MARCUS:** They have causal powers, not logical hooks.

  **ELENA:** And what is the difference in this context? If Desdemona has the power to enter into a proposition as a subject, that power must be intrinsic to her role in the proposition. If it's intrinsic, it's part of the proposition's identity. So the proposition *does* have internal structure determined by the constituents. You haven't escaped the need for structure; you've just argued that the structure is grounded in cognitive use rather than abstract logic.

  **MARCUS:** Precisely! And that matters. Because if the structure is abstract and independent, how do we access it? We need a "grasping" relation. And is *that* relation saturated? Now *you're* facing a regress of grasping. I cut the knot by saying we don't grasp static structures; we execute procedures.

  **ELENA:** But a procedure without a specification is blind. To execute the procedure "Predicate Loving," I need to know what "Loving" means. If "Loving" is just a word or a mental image, it's inert. If it has meaning, it has conditions of application. Those conditions determine how it relates to objects. That determination is the unsaturatedness you're trying to avoid. You can call it a "rule" or a "procedure," but if it dictates that *a* goes here and *b* goes there, it is functioning as an unsaturated constituent.

  **MARCUS:** I suppose I can live with that, provided we agree the rule doesn't exist in a third realm. It exists in the practice. But you, Elena, you have to explain how the "unsaturated" concept manages to grab the object without a further relation. You say it's automatic. But if I write the function 'f(x)' and the argument 'a', on the page they are just 'f(x)a'. Why is that a calculation and not a scribble?

  **ELENA:** Because the function *is* the mapping. It isn't a thing that maps; it *is* the mapping.

  **MARCUS:** And the act *is* the unifying. It isn't a thing that unifies; it *is* the unifying.

  **ELENA:** (Sighs) So we agree that something has to *be* the unifying rather than *do* the unifying.

  **MARCUS:** We do. I just think the "something" is us, not the concepts.

  **ELENA:** And I think that makes the concepts too passive to bear the weight of truth. If I stop thinking, does "Desdemona loves Cassio" cease to have a truth value?

  **MARCUS:** It ceases to be *asserted*, but the act-type remains available. Just as a move in chess remains available even if no one is playing.

  **ELENA:** But the move is defined by the rules of chess. The rules are the unsaturated structures. You've pushed the problem back to the rules of thought.

  **MARCUS:** And you've pushed the problem back to the nature of grasping. Neither of us has a magic bullet for Bradley.

  **ELENA:** No. It seems you buy unity at the price of agency, and I buy it at the price of ontology.

  **MARCUS:** And neither price feels quite right.

  **ELENA:** (Closes the laptop) Another coffee?

  **MARCUS:** Only if you promise not to predicate "expensive" of "my wallet."

  **ELENA:** No promises. The unsaturatedness of your wallet demands it.
