answer: |-
  **Setting:** *The entrance to the Blackwood Mine. Dust hangs thick in the air. Sirens wail in the distance. Two heavy levers sit on a control console: one directs the support beams to Shaft A (5 miners), the other to Shaft B (1 miner). The ground trembles. They have seconds before the collapse becomes total.*

  **Characters:**
  *   **ALEX (Taurekian):** Clutching a coin.
  *   **SARAH (Scanlonian):** Hand hovering over the lever for Shaft A.

  **ALEX:** Don't touch it, Sarah. Flip the coin. Heads for the five, tails for the one.

  **SARAH:** I'm not flipping anything. I'm pulling for Shaft A. Five lives against one.

  **ALEX:** There is no "five against one." There are six individuals. If you pull that lever, you aren't saving five; you're killing *him*. You're treating the five as a single block of value. Taurek was clear: loss doesn't aggregate. My death is not a unit you can add to yours to outweigh his.

  **SARAH:** It's not addition, Alex. It's contractualism. Think about the principles. If it were just one miner in Shaft A and one in Shaft B, it's a tie. Either could reasonably reject a principle that prioritized the other. So we flip.

  **ALEX:** Right. Equal concern.

  **SARAH:** But it's not 1-vs-1. It's 1-vs-5. Take the lone miner in B. Call him Jones. Take one miner in A, call him Smith. Between Jones and Smith, it's a tie. Neither can claim priority over the other. But Smith isn't alone. There are four others down Shaft A.

  **ALEX:** And there it is. The cavalry arrives to break the tie.

  **SARAH:** They aren't cavalry, they're moral agents with claims. Jones cannot reasonably reject a principle that says, "When you are tied with Smith, and Smith is accompanied by four others in the same predicament, we save the group." Why? Because Jones's complaint is no stronger than Smith's. But if we saved Jones, the four others would have a valid complaint: "Why were we ignored when we could have been saved at no extra cost to Jones?"

  **ALEX:** Stop. Listen to yourself. "The four others." You just summed them. You said their complaints combine to silence Jones.

  **SARAH:** I didn't sum them. I looked at the individual complaints. Jones has a complaint. Smith has a complaint. They cancel out. Then I look at the *next* person in Shaft A. He has a complaint too. Jones has nothing to offset *that* complaint. It's not a bloc; it's a series of 1-vs-1 comparisons where Jones runs out of counter-claims.

  **ALEX:** That is aggregation wearing a trenchcoat, Sarah. You're trying to sneak the numbers in through the back door of "tie-breaking."

  **SARAH:** How?

  **ALEX:** Because the *mechanism* of the decision relies entirely on the presence of the spare four. If they vanish, Jones gets a 50% chance. Because they exist, Jones gets a 0% chance. Their existence is doing the heavy lifting. You're saying Jones's claim is defeated by the *cumulative presence* of the others. That is exactly what Taurek forbade. You are weighing the "force" of four claims against the "force" of one.

  **SARAH:** No. I'm saying Jones has no *ground* to stand on. To reject the principle, he has to show it treats him with less concern. But it doesn't. It treats him exactly as well as it treats Smith. The fact that Smith has friends in the same boat doesn't mean we're summing their value; it means Jones is the outlier. The principle isn't "Maximize Lives." The principle is "Don't abandon people when you don't have to." Abandoning four to save one is abandonment. Abandoning one to save four is... tragedy, but not abandonment.

  **ALEX:** "Not abandonment"? He dies because of the numbers! Look, Scanlon wants to avoid aggregation by focusing on individual reasonable rejectability. But to determine if a rejection is "reasonable," you have to compare the burdens. You're comparing Jones's burden (death) against the *combined* burden of the five (five deaths). You say you're doing it pairwise, but the *outcome* is determined by the total count.

  **SARAH:** The outcome is determined by the fact that Jones cannot find a principle that favors him without arbitrarily disadvantaging the five.

  **ALEX:** He *can* find one! "Flip a coin between the groups." That principle treats everyone with equal concern. It gives Jones a 50% chance. Your principle gives him 0%. Why is his rejection of *your* principle unreasonable? Because the five would complain louder? That's aggregation of complaint intensity!

  **SARAH:** It's not about volume. It's about justification. If we flip for the groups, we are telling the four "spare" miners in Shaft A: "Your presence here is morally irrelevant." We are severing the moral connection between their plight and our action. Scanlon's point is that the spare miners *do* have a claim on us, individually. You can't just discard their individual claims to give Jones a better statistical shot.

  **ALEX:** But you *are* discarding Jones's claim to a 50% shot! You're saying his claim is weaker because he is outnumbered.

  **SARAH:** His claim isn't weaker. It's *matched* by Smith, and then *unmatched* by the others. Imagine a scale. Jones is on one side. Smith is on the other. Balanced. Now, another miner steps on Smith's side. The scale tips. Did we weigh the *group*? No. We added individuals one by one.

  **ALEX:** A scale! You're using a scale! That is the metaphor of aggregation! You're saying moral claims have weight and you can put more weight on one side. Taurek's whole point is that claims aren't weights. They are vetoes. Jones has a veto against being sacrificed. The five have a veto against being sacrificed. You can't override Jones's veto just because five other people also have vetoes.

  **SARAH:** They aren't vetoes against rescue, Alex. They are claims for aid. When claims conflict, we need a rule no one could reject. Jones can't reject the "Save the Greater Number" rule without asserting his life is worth more than Smith's, which he can't do. But the five can reject a "Coin Flip Between Groups" rule because it ignores their individual claims to be saved when it costs nothing extra.

  **ALEX:** "Costs nothing extra." There's the utilitarian calculus again. "Cost." You're measuring the cost in lives. One life vs. five lives. You say you're looking at individuals, but the *reason* the tie breaks is the *number* of individuals. If there were a hundred down Shaft A, Jones still loses. Why? Because 100 individual claims break the tie harder than 4?

  **SARAH:** Because 100 individual complaints are 100 individual reasons not to abandon them.

  **ALEX:** And that is the trenchcoat! You're saying 100 reasons outweigh 1 reason. That is aggregation. You've just broken the sum into addends to make it look like you're not adding. But the math is the same. 1 < 5.

  **SARAH:** It's not 1 < 5. It's 1 = 1, plus 1 = 1, plus 1 = 1...

  **ALEX:** ...resulting in 5 > 1! You're doing arithmetic on human lives and calling it "contractualism." Jones doesn't care that he was out-argued pairwise. He cares that he was out-numbered. And Taurek says being out-numbered shouldn't decide life and death.

  **SARAH:** (Hand tightening on the lever) If I don't pull this, the beams fail for both shafts. Then six die.

  **ALEX:** Then flip the coin! Give him his 50%. That's the only way to respect him as a person and not a statistic.

  **SARAH:** Respecting him as a person means acknowledging he can't reasonably demand we ignore the four others standing right next to Smith. Their claims are real, Alex. They aren't a sum. They are *people*. And I can't ignore them.

  **ALEX:** And I can't ignore him.

  *(The ground shakes violently. Dust falls from the ceiling.)*

  **SARAH:** I'm pulling it, Alex.

  **ALEX:** Then you're admitting the numbers count.

  **SARAH:** No. I'm admitting that people count. And there are more of them down Shaft A.

  **ALEX:** (Pocketing the coin, voice quiet) That's the same sentence, Sarah.

  *(Sarah pulls the lever. The beams shift toward Shaft A. A single crash echoes from Shaft B. Neither of them moves for a long moment.)*
