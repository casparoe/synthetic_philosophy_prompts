      *   **Swampman (Davidson):** A perfect physical duplicate of a human created by random lightning in a swamp. No past, no evolution.
      *   **The Clash:** Teleosemantics says Swampman has no thoughts/meanings/functions. Intuition says Swampman acts/thinks exactly like the original.
      *   **Side A (Fatal Problem):** This violates strong intuitions about supervenience, internalism, and the reality of conscious experience. It makes meaning extrinsic in a way that severs the link between behavior/phenomenology and content. It renders the theory empirically useless for duplicates.
      *   **Side B (Bullet Biting):** History *is* essential for normativity. Without history, there's no distinction between correct and incorrect use, only causal regularity. The intuition that Swampman thinks is a pre-theoretical mistake. The theory explains *what content is*, not just what it feels like.

  3.  **Outline the Essay:**
      *   **Title:** Needs to be engaging and relevant.
