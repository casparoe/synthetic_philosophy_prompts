          *   *Decision:* The bullet must be bitten. The intuition is misleading because it conflates phenomenology with semantic normativity.
      *   **Conclusion:**
          *   Restate verdict.
          *   Final thought on the nature of meaning.

  4.  **Drafting - Section by Section (Iterative refinement):**

      *   *Intro:* Start with the promise of naturalizing meaning. Teleosemantics tries to fit meaning into the scientific worldview. Swampman is the wrench. *Thesis:* While the Swampman verdict is counterintuitive, it is not fatal; it is a necessary consequence of grounding normativity in history. I will argue defenders are right to bite the bullet.

      *   *The Attack (Fatal Problem):* Focus on Supervenience. If physics is the same, mind should be the same. If Swampman says "apple," he refers to apples. To say otherwise makes communication impossible (if I met Swampman, would I understand him?). Also, the "New History" argument: Swampman starts making mistakes immediately. Doesn't that generate function quickly?

      *   *The Defense (Bullet Biting):* Why does history matter? Because "function" implies "could go wrong." A rock rolling down a hill isn't malfunctioning if it stops. A heart *is* if it stops. Why? Because of what it was *made to do*. Swampman's heart has no "made to do" yet. Apply this to belief: A belief represents p if it's *supposed* to be true. Without selection, there is no "supposed to." It's just a causal chain. Millikan's point: Meaning is like being a "husband." You can't be a husband without a history of marriage, even if you act like one.

      *   *The Verdict:* Why side with Millikan? Because the alternative (internalism/supervenience) fails to solve the core problem teleosemantics was built for: Naturalizing Normativity. If we say Swampman has thoughts, we haven't explained *what makes them thoughts* rather than just noise. We've just asserted it. Teleosemantics offers a hard-nosed metaphysical account. The intuition is based on ignoring the normative dimension. Therefore, the counter-intuitiveness is a feature, not a bug. It shows us how deep the requirement for history goes.

