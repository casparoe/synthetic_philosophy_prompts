answer: |-
  **Title:** The Ghost in the Swamp: Why Teleosemantics Must Bite the Bullet

  The project of naturalizing the mind seeks to explain how physical brains manage to latch onto the world, how neurons manage to mean something. Teleosemantics, championed by philosophers like Ruth Millikan and Ruth Garrett Millikan, offers a bold solution: mental content is determined by biological function, and biological function is determined by evolutionary history. A belief represents water because the mechanism producing it was selected for tracking water. This theory elegantly solves the problem of error—a misrepresentation is simply a mechanism failing its selected function. However, this historical reliance invites a devastating thought experiment: Donald Davidson's Swampman.

  Swampman is a molecule-for-molecule duplicate of a human, congealed by pure chance in a swamp after a lightning strike. He has no evolutionary history, no parents, and no past. According to strict teleosemantics, Swampman has no mental content, no meaningful speech, and no biological functions; his heart does not pump blood, it merely moves fluid. To many, this conclusion is absurd. To others, it is the price of a rigorous theory. While the Swampman verdict violates deep-seated intuitions about the mind, it is not a fatal problem for teleosemantics. It is a bullet that defenders must and can happily bite, because the alternative sacrifices the very normativity that distinguishes meaning from mere causation.

  The case against teleosemantics rests primarily on the intuition of supervenience and the phenomenology of experience. The strongest argument here is that mental states should depend on the current physical constitution of the thinker, not on the historical accidents of their ancestry. If Swampman is physically identical to a normal human, he behaves identically. He avoids fire, seeks food, and says "apple" when presented with an apple. If he screams when burned, it seems perverse to claim he feels no pain or has no belief that the fire is hot. As Tyler Burge and other internalists argue, if two beings are intrinsic duplicates, they must share mental states. To deny this severs the link between the mind and the brain, making psychology dependent on facts external to the agent that they could never possibly know.

  Furthermore, critics argue that the teleosemantic verdict renders the theory empirically useless. If we cannot attribute beliefs to Swampman, we cannot predict his behavior using folk psychology, yet Swampman's behavior is perfectly predictable. Additionally, there is the "instant history" objection. Even if Swampman lacks a *past*, he immediately begins interacting with the environment. If he eats a berry and gets sick, he learns not to eat it. Critics argue that this immediate reinforcement history should generate proper functions rapidly, rendering the lack of evolutionary history moot. To insist he remains a semantic zombie ignores the dynamic nature of learning.

  However, the teleosemantic defense is stronger than it appears because it targets the metaphysical grounding of normativity, not just behavioral prediction. The core insight of teleosemantics is that meaning requires the possibility of being wrong in a specific, normative sense. A thermostat reacts to temperature, but it does not "believe" it is cold. Why? Because if it breaks, it isn't "mistaken"; it's just broken. For a state to have content, there must be a standard of correctness that is independent of current causal regularities. Millikan argues that only selection history provides this standard. A heart's function is to pump blood because ancestors who pumped blood survived. Without that lineage, a Swampman-heart is just a pulsing sack. It cannot "malfunction" because it was never selected to function in the first place.

  Apply this to Swampman's mind. When Swampman says "tiger," what makes that sound refer to tigers rather than tiger-retinas or tiger-sense-data? Without a history of selection stabilizing the reference, there is no fact of the matter. The intuition that Swampman thinks is actually a confusion of phenomenology with semantics. Swampman might *feel* like he is thinking, just as a recording of a speech *sounds* like speech. But a recording lacks the communicative intent and normative standards of a live conversation. Teleosemantics posits that meaning is a relational property, like being a "husband." A man who wakes up with all the memories of a husband but without a marriage ceremony is not a husband, regardless of how husband-like he acts. Similarly, Swampman is not a thinker because he lacks the "marriage" between his cognitive mechanisms and the world forged by evolution.

  Regarding the "instant history" objection, teleosemantics can concede that Swampman acquires content quickly, but not instantly. His learning mechanisms (e.g., neural plasticity) might have derived proper functions if we grant the lightning strike copied the *structure* of a human brain which implies a design, but strict Swampman scenarios usually deny the design history too. Even so, until Swampman's new learning processes establish a stable history of success and failure, his states remain semantically indeterminate. This is not a bug; it is a feature. It highlights that meaning is not a spark inside the head, but a stable pattern of interaction over time.

  So, is this a fatal problem? The verdict is no. The intuition that Swampman has thoughts is pre-theoretical and relies on a shallow understanding of what "content" entails. We feel Swampman thinks because we project our own interpretive framework onto him. From *our* perspective, he means "apple." But from the perspective of a theory explaining *how* meaning is possible in a physical world, Swampman is a hollow shell.

  Defenders of teleosemantics are right to bite the bullet because the alternative is to abandon the naturalization of normativity. If we grant Swampman thoughts simply because he is physically identical to a thinker, we have not explained what thoughts *are*; we have merely asserted that physical duplication is sufficient for meaning. This leaves us vulnerable to skepticism: if history doesn't matter, what fixes the content of *our* thoughts? Why are we not just Swampmen with a longer delay? Teleosemantics answers this by grounding content in the hard facts of survival and reproduction.

  The cost of this view is counter-intuitiveness, but the gain is metaphysical rigor. A theory of content should explain the difference between a system that merely correlates with the world and a system that represents it. Swampman correlates; he does not represent. To claim otherwise is to magic normativity out of thin air. Therefore, the Swampman case does not refute teleosemantics; it clarifies it. It forces us to accept that meaning is not an intrinsic property of matter, but a historical role. Swampman is a tragic figure—a being who acts like a man but lacks the history to be one—but his existence does not break the theory. It merely confirms that to have a mind is to have a past.
