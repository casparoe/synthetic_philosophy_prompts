      *   **Quantifier Variance (Hirsch):** The logical symbol $\exists$ ("there exists") can have different meanings in different languages/conceptual schemes. No single meaning is metaphysically privileged. Therefore, disputes are verbal (about which language to use), not factual.
      *   **Joint-Carving (Sider):** There is an objective structure to reality. Some meanings of $\exists$ map onto this structure better than others. Therefore, disputes are substantive (about what the world is actually like).

  3.  **Drafting the Explanation - Step-by-Step:**

