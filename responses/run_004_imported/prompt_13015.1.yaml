          *   **The Mechanism:** Imagine two languages, "English" and "Nihilish."
              *   In *English*, $\exists$ ranges over bricks *and* walls.
              *   In *Nihilish*, $\exists$ ranges *only* over bricks (simples).
          *   **The Translation:** Hirsch argues the Nihilist can say everything the Common Sense person says, just using more words.
