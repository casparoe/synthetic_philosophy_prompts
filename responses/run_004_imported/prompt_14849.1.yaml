answer: |-
  **BOSTON, MAY 1851**
  **The back room of the *Liberator* office. The air is thick with tobacco smoke and the smell of wet ink. WILLIAM LLOYD GARRISON stands by the window, his back to the room. FREDERICK DOUGLASS sits at the table, a copy of the Constitution open before him.**

  **GARRISON**
  (Without turning)
  You sound like them now, Frederick. When you speak of the Constitution, you sound like Webster. Like Clay. You have polished the chains until they gleam like gold, and you call them jewelry.

  **DOUGLASS**
  I call them what they are, Mr. Garrison. Paper. Ink. Words. And for twenty years, we have treated those words as if they were written in the blood of the slave, rather than the ink of the lawyer. I have looked at the document itself. Not the intent of the men who signed it—men are fallible—but the text they left behind.

  **GARRISON**
  (Turning sharply)
  The text! You speak of the text as if it were a holy writ. It is a covenant with death. It is an agreement with hell. Does the devil need to sign his name in the book for you to recognize the handwriting? The thing reeks of slavery. Every pore of it.

  **DOUGLASS**
  Then point to the pore. Show me the word.

  **GARRISON**
  You know I cannot. We have argued this a thousand times. The word "slave" is absent. They were too ashamed to write it. But they wrote "persons held to service or labor." They wrote "three-fifths of all other Persons." They wrote "importation of such Persons." They used euphemisms to hide the sin, but the sin is the substance!

  **DOUGLASS**
  And that is where you lose the argument, William. Because if the Constitution does not name slavery, then slavery has no constitutional footing. It is a creature of state law, local and municipal. The federal government has no power to create a slave. It has no power to sustain slavery in the territories. It has the power, explicitly, to abolish it in the District of Columbia. If this document is pro-slavery, why does it grant the federal government the power to end it in the capital?

  **GARRISON**
  (Pacing)
  Because it is a compromise! A bargain struck to keep the Southern states in the Union. You are reading the loopholes and calling them the law. I am reading the purpose. The purpose is union at the cost of the bondman. You say you can use this document to destroy slavery. I say the document *is* the shield that protects slavery.

  **DOUGLASS**
  Then why are you afraid to take the shield from them?

  **GARRISON**
  (Stops pacing)
  Afraid? I am the man who burned a copy of this Constitution before God and man! I am not afraid. I am consistent. To vote under this government is to swear an oath to support it. To hold office is to become a functionary of the slave power. The Fugitive Slave Law is not an accident, Frederick. It is the logic of the Union made manifest. If you join the political party, you must swallow the Fugitive Slave Law.

  **DOUGLASS**
  No. I say the Fugitive Slave Clause is a compact between states, not a mandate upon the conscience of the citizen. But even if it were not—tell me, William: What is the harder path?

  **GARRISON**
  Do not preach to me about hardness.

  **DOUGLASS**
  I am serious. Is it harder to stand outside the temple and cast stones? To say, "I will not touch this unclean thing"? That is purity. I grant you that. It is morally clean. But is it effective? Or is the harder path to walk into the temple, to take the very book they use to justify bondage, and read it aloud until their own justification crumbles?

  **GARRISON**
  It is not purity. It is non-participation in sin. If I know the house is built on stolen land, I do not move in and try to change the drapery. I refuse to enter. "No Union with Slaveholders." That is the only moral position.

  **DOUGLASS**
  And while you refuse the Union, the slave remains in chains. Your position requires the North to sever the tie. To let the South go.

  **GARRISON**
  Yes! Let the corrupt tree be cut down. Let the North wash its hands of the blood.

  **DOUGLASS**
  And the slave? What of the four million souls left behind in that "independent" slave confederacy? You would abandon them to a foreign nation dedicated entirely to their perpetual bondage. You would wash your hands, but you would leave them in the mire. That is not abolition, William. That is secession of the conscience.

  **GARRISON**
  (Voice rising)
  I would not abandon them! We would agitate from the border. We would be a beacon of freedom.

  **DOUGLASS**
  A beacon does not break chains. Power breaks chains. Political power. If the Constitution allows for the abolition of the trade, allows for the restriction of expansion, allows for the emancipation in the District—then to ignore those powers is to surrender them to the slaveholder. You say I have softened. I say I have sharpened. You rely on a vibe of moral superiority. I rely on the law.

  **GARRISON**
  The law! The law is the will of the master class.

  **DOUGLASS**
  Then we must change the class that wields it. You think I am courting the politicians? I trust none of them. White abolitionists, black abolitionists, Democrats, Whigs—I trust only the argument. And the argument is that the Constitution is an anti-slavery document. If I can convince a voter in Ohio that his vote can legally strangle slavery without violating his oath, I gain a soldier. If I tell him he must reject the government entirely, I gain a hermit.

  **GARRISON**
  You are playing with fire. You are legitimizing a government that hunts men with dogs. You are telling the colored freeman that he should vote for a President who will sign a Fugitive Slave Act.

  **DOUGLASS**
  I am telling him he should vote for a President who will *repeal* it. And if he cannot find such a man, then he votes for the principle. But he must vote. To abstain is to concede the field.

  **GARRISON**
  (Softly, dangerously)
  You have changed, Frederick. When you first came to me, you were a voice crying in the wilderness. Now you wish to be a voice in the Congress. You want the leverage.

  **DOUGLASS**
  I want the result.

  **GARRISON**
  At the cost of the principle?

  **DOUGLASS**
  The principle *is* the result. Freedom. Not the purity of the abolitionist, but the liberty of the slave. You love the truth. I love the enslaved. Sometimes they are the same. Today, they are not. Today, your truth leaves them bound. My truth offers a key.

  **GARRISON**
  (Walks to the table, looks down at the Constitution)
  It is a key that fits a lock designed to keep you out. They will use your own arguments to crush you. They will say, "Even Douglass admits the Union is sacred." They will use your back as a bridge to walk over the bodies of the fugitive.

  **DOUGLASS**
  (Stands up)
  Then let them try. I would rather be a bridge than a monument. Monuments stand still, William. They are admired. They are clean. But they go nowhere.

  **GARRISON**
  (Looks up, eyes cold)
  And bridges are walked upon. They bear the weight. They crack. And when they collapse, those who trusted them fall into the water.

  **DOUGLASS**
  I will risk the fall.

  **GARRISON**
  (Turns back to the window)
  Then you walk alone on this road, Frederick. The *Liberator* will not print your new creed. We cannot. To say the Constitution is anti-slavery is to say the devil is an angel of light.

  **DOUGLASS**
  (Picks up his hat)
  I do not ask you to print it. I ask you to consider that the light does not care where it comes from, only that it shines.

  **GARRISON**
  (To the glass)
  There is no light in a covenant with hell.

  **DOUGLASS**
  Then we shall see which of us burns first.

  **Douglass turns and leaves. The door closes. Garrison does not turn around.**
