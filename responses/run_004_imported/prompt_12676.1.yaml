      *   *Is the 15-hour week math right?* 1930 output vs 2030 output. Yes, productivity grew enough. So the *potential* was there. Why wasn't it taken? That's the question.
      *   *Keynes's view on Investment:* He assumed capital accumulation would lower interest rates, reducing the incentive to save. If interest rates stayed manipulable or profitable, the drive to accumulate stays. This is a technical point worth mentioning regarding the "euthanasia of the rentier."

  9.  **Final Polish:** Ensure the distinction between "revising the apparatus" (admitting the theory was wrong) vs "restating" (admitting human behavior was the variable) is clear. Keynes was a moralist at heart in this essay. He would blame the morals, not the math.

