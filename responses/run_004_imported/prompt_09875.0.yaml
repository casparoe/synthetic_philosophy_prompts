      *   *James:* "Our passional nature not only lawfully may, but must, decide an option between propositions, whenever it is a living option, which cannot by its nature be decided on intellectual grounds." In DSMB terms: The stakes are life/death. Waiting *is* a decision with consequences (patients on placebo/standard of care might die/suffer). If the trend is strong, waiting for "proof" might cost lives that could be saved now. This aligns with the "Stop Early" camp.
