      *   *Continue Unchanged?* Ignores the strong trend. Patients on the control arm continue to potentially miss out.
      *   *Middle Ground (Adaptive Design/Rescue):* Continue the trial to preserve statistical integrity (Clifford), but modify the protocol to reduce harm to the control group (James).
      *   *Specific Mechanism:* Since it's Phase III, usually double-blind. Unblinding for individual patients? Changing randomization ratios? Offering open-label extension *after* participation?
      *   *Best DSMB Practice:* Usually, if the boundary isn't crossed, you continue. But you can recommend enhanced monitoring or a sooner interim analysis.
