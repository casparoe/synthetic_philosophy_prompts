          2.  Core assumption validity (is truth easier to argue than falsehood, or is it just persuasion?).
          3.  Collusion/Shared Blindspots (agents are copies, might fail together).
          4.  Falsifiability/Commitment (what would make her give up on debate? Stop the "engineering problem" dodge).
      *   **Tone:** Academic but accessible (podcast format), rigorous but respectful. Needs to pin her down without being hostile.

  2.  **Deconstruct the Interviewee's Strategy:**
      *   *The Dodge:* "Current models are too dumb/judges are too weak."
      *   *The Counter:* Need questions that force her to define the *conditions* under which debate works, not just assume it will work once models are smarter. Need to probe the *structural* properties of debate, not just empirical performance on today's LLMs.

  3.  **Drafting the Questions (Iterative Process):**

