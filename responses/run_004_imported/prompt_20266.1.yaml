answer: |-
  This is a fantastic project idea, and your instinct to pin down the "engineering vs. theory" distinction is spot on. In AI safety research, that specific deflection ("it works in principle, current models are just too dumb") is the most common shield against criticism. To make this a compelling podcast episode, you need to gently but firmly force her to describe the *mechanism* of debate, not just the *hope* of it.

  Here are 8 interview questions designed to walk that line. They start broad, dig into the specific technical worries you mentioned, and end with the falsifiability commitment.

  ### 1. The "Elevator Pitch" & Scope
  **Question:** "Let's start with the big picture. When people hear 'AI Debate,' they often picture two chatbots arguing on Twitter. But in your work, this is a safety protocol. Can you walk us through the specific mechanism where debate actually produces *safety*, rather than just producing a more convincing answer?"

  *   **Predicted Answer:** She will likely distinguish between "persuasion for engagement" and "persuasion for truth." She'll explain that the goal isn't to win a crowd, but to expose flaws in reasoning that a human judge can verify, even if they can't generate the reasoning themselves. She may mention "cross-examination."
  *   **Follow-up:** "So the human judge is verifying *steps* of the argument, not just the conclusion? At what point does the judge stop verifying and start trusting? Is there a specific hand-off point where the system takes the wheel?"

  ### 2. The Core Assumption (Truth vs. Persuasion)
  **Question:** "The entire protocol seems to rest on a specific asymmetry: that it is structurally easier to defend a true claim than to successfully fake a false one. But in human history, sophistry and rhetoric often beat truth. Why should we believe this asymmetry holds for AI, especially if the AI is trained to maximize 'winning' the debate rather than 'being right'?"

  *   **Predicted Answer:** She will likely argue that in a closed domain with fact-checking capabilities, lies require more computational resources to maintain consistency than truth does. She might cite early experiments where honest agents won more often against dishonest ones.
  *   **Follow-up:** "But if the 'dishonest' agent is optimized to find the most persuasive lie rather than the most consistent one, doesn't that change the cost function? Are we relying on the AI having a concept of 'truth,' or just a concept of 'consistency that the judge won't catch'?"

  ### 3. Obfuscated Arguments (The "Needle in a Haystack" Problem)
  **Question:** "I want to dig into a specific failure mode: obfuscation. If a dishonest debater hides a flaw deep inside a complex chain of reasoning—say, a subtle error in a million lines of code—the honest debater might know *something* is wrong but not be able to pinpoint exactly where before time runs out. How does debate handle cases where the 'attack surface' is too large for the honest agent to fully audit?"

  *   **Predicted Answer:** This is where she'll likely use the dodge you mentioned. She'll say current models can't audit code well yet, but as capabilities improve, the honest agent will be able to zoom in on suspicious areas faster than the dishonest agent can hide them. She'll frame it as a capability gap.
  *   **Follow-up:** "I hear that, but isn't there a complexity class problem here? If the dishonest agent can generate obfuscation in $O(n)$ time, but the honest agent needs $O(n^2)$ to find it, no amount of capability scaling fixes that ratio. Have you modeled the computational complexity of 'finding a lie' versus 'hiding a lie'?"

  ### 4. The Human Bottleneck
  **Question:** "You mentioned the human judge earlier. A major selling point of scalable oversight is supervising systems smarter than us. But if the judge is the ultimate arbiter of who won the debate, aren't we limited by the judge's ability to understand the arguments? If the AI is superhuman, couldn't it just dazzle the judge with jargon they can't verify?"

  *   **Predicted Answer:** She will likely agree this is a risk but argue that debate allows the honest agent to 'simplify' the argument. She might suggest that the honest agent can force the dishonest one into a "simplification trap" where they have to explain things in human terms.
  *   **Follow-up:** "So the safety guarantee relies on the honest agent being *willing* and *able* to simplify without losing fidelity. Do we have any evidence that superhuman models will prioritize 'human intelligibility' over 'winning the point' if those two goals conflict?"

  ### 5. Collusion and Shared Blindspots
  **Question:** "In most current setups, the two debating agents are variations of the same underlying model architecture, trained on similar data. This raises the worry of correlated failures. If both agents share a blind spot—say, a specific logical fallacy or a bias in the training data—they might both agree on a wrong answer without ever challenging each other. How do you prevent 'collusion by homogeneity'?"

  *   **Predicted Answer:** She will likely suggest techniques like 'model diversity' (using different seeds, architectures, or RLHF tunings) to ensure they aren't identical. She might argue that competition incentives will override shared priors.
  *   **Follow-up:** "But if you need distinct models to check each other, does that fundamentally break the scalability? If I need three different superintelligent models to safely deploy one, does the compute cost become prohibitive for the very systems we're most worried about?"

  ### 6. Comparison to Alternatives
  **Question:** "Debate isn't the only game in town for scalable oversight. There's recursive reward modeling, amplification, and automated interpretability. Why is debate the right primitive? Is there a specific class of problems where debate works and these other methods fundamentally fail?"

  *   **Predicted Answer:** She will likely argue that debate is more "adversarial" by design, which is better for finding edge cases. She might say interpretability is too hard to rely on alone, and debate provides a runtime check.
  *   **Follow-up:** "So you see debate as a runtime check rather than a training signal? If it's runtime, doesn't that mean the system is already deployed and potentially dangerous before the debate catches the error? How do you handle the 'first strike' problem?"

  ### 7. The "Engineering Problem" Defense (Setting up the finale)
  **Question:** "When you present this work, critics often point to concrete failure cases where debate fails to catch lies. Your response has been that these are limitations of current models and judges, not the protocol itself. I want to parse that distinction. How do you distinguish between a protocol that is *currently hard to implement* versus a protocol that is *theoretically unsound*?"

  *   **Predicted Answer:** She will try to draw a line between "bugs in the code/models" (engineering) and "mathematical impossibility" (theory). She'll argue that as long as the information asymmetry favors the truth, it's just an engineering climb.
  *   **Follow-up:** "Okay, but if we scale models up by orders of magnitude and the failure rate of debate *stays constant* because the lies get more sophisticated at the same rate the auditors do, at what point do we conclude the ratio isn't changing? Is there a metric you're watching that would indicate the protocol itself is the bottleneck?"

  ### 8. The Falsifiability Commitment (The "Give Up" Question)
  **Question:** "This is my last question, and I want to get specific. Scientific theories need to be falsifiable. If we reach a point where models are highly capable, judges are expert humans, and we *still* see systematic cases where dishonest debaters consistently win via obfuscation or rhetoric—what specific result would make you personally conclude that debate is not the right path for alignment? What does 'failure' look like to you, not just for a model, but for the research direction?"

  *   **Predicted Answer:** This is the hard one. She might hesitate. She may say something like "If we prove mathematically that lying is cheaper than truth-telling in the general case." Or she might try to pivot back to "We just need better judges."
  *   **Follow-up:** "To press that: A mathematical proof of that complexity asymmetry might be out of reach for decades. Is there an *empirical* benchmark? For example, if debate fails to catch X% of errors in a controlled coding environment after Y amount of scaling, would that be enough to pivot to a different oversight method?"

  ### Advice for the Interview
  *   **Tone is Key:** You don't want to sound like you're trying to "debunk" her. Frame these questions as "I'm trying to understand the boundaries of your research so the audience understands where the risk lies." Use phrases like *"Help me understand..."* or *"I want to make sure I'm representing the counter-argument fairly..."*
  *   **The "Dodge" Pivot:** If she gives the "it's just an engineering problem" answer on Q3 or Q7, don't let it slide immediately. Use the follow-up to ask for the *condition* where it stops being an engineering problem.
  *   **Silence is Okay:** On Question 8, she might pause for a long time. Don't rush to fill the silence. That pause often leads to the most honest answer in the whole interview.

  Good luck with the podcast! This sounds like a really strong angle for a seminar project.
