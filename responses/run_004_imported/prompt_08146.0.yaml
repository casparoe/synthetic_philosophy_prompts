      *   **The HA Threat:** Explain that HA makes the future depend on which diffeomorphic image is "real." If points are substantival, the field equations don't fix the future.
      *   **Newton's Dilemma:**
          *   Keep Haecceitism (Clarke's view) $\rightarrow$ Accept Indeterminism (Unacceptable for Newtonian physics).
          *   Keep Determinism $\rightarrow$ Reject Haecceitism (Sophisticated Substantivalism).
      *   **Why not Relationism?** Because of the Bucket. He needs absolute acceleration. Sophisticated substantivalism allows absolute acceleration (via the metric field) without point haecceitism.
