      *   *Does this collapse into Relationism?* Not necessarily. One can be a substantivalist about the *structure* without being a haecceitist about the *points*.
      *   *Best Fit:* Newton is pushed to **Sophisticated Substantivalism**. He keeps space real (to save the Bucket) but denies that point-identity is independent of the metrical/causal structure (to save Determinism).

