          *   *Verdict:* This is the modern consensus (Earman's own preference). But would *Newton* accept it? It requires giving up haecceitism of points. Newton/Clarke were haecceitists (God could have placed the universe 5 feet East).

      *   *Option C: Relationism.*
          *   *Argument:* Reject the manifold. Only matter/fields exist.
          *   *Problem:* Newton explicitly rejects this because of the Bucket (inertial effects without relative motion of matter).
          *   *Verdict:* Unlikely for Newton to retreat here unless forced.

