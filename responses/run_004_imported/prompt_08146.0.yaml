          *   *Newton's Commitment:* Newton is a causal determinist (mostly). The Clockwork Universe runs on laws. If the HA shows that substantivalism + covariance = indeterminism, Newton cannot accept indeterminism easily.
          *   *Crucial Distinction:* Clarke's move addresses *identity of indiscernibles* (metaphysics). HA addresses *determinism* (physics). A brute will can explain *which* world exists, but it cannot explain how the *laws* fail to predict it if the ontology is fixed. Actually, wait. If God chooses, the laws don't need to determine it. But Newton believes the laws *do* determine it (given initial conditions).
          *   *Verdict:* The "Divine Will" move fails because HA generates *radical indeterminism*, not just metaphysical redundancy. Newton cares about causal efficacy (Bucket). If the points are real but the laws can't pin the field to them uniquely, the points lose their causal role.

      *   *Option B: Sophisticated Substantivalism (Leibniz Algebrism / Anti-haecceitism).*
