      *   *Verdict:* The indeterminism is the killer. Newton cannot accept that the laws of motion fail to determine the future given the past.
      *   *Therefore:* He must deny the premise that leads to indeterminism. That premise is Manifold Substantivalism (in the haecceitist sense).
