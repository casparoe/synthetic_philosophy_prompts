      *   **Earman-Norton Hole Argument (HA):**
          *   *Context:* General Relativity (GR).
          *   *Premise 1 (Substantivalism):* Spacetime points exist independently of the metric/matter fields (manifold substantivalism).
          *   *Premise 2 (General Covariance):* The laws of physics are diffeomorphism invariant. We can drag fields over the manifold via a diffeomorphism ($d$) that is the identity everywhere except inside a "hole" (vacuum region).
          *   *Result:* Two models $(M, g, T)$ and $(M, d^*g, d^*T)$ represent distinct physical situations *if* points are substantival (because the metric field values are attached to different points in the hole), yet they are empirically indistinguishable and both satisfy the field equations.
