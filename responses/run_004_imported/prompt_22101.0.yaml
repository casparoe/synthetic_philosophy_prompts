answer: |-
  For those of you who don't know, our friend group has spent fifteen years speaking a dialect of English heavily patched with game theory. We don't "agree" on things; we establish "common knowledge." We don't "meet up"; we converge on a "Schelling point." We have Priya to thank for that. She wrote her dissertation on David Lewis's *Convention*, and she has spent a decade insisting, half in earnest, that our habits—who hosts dinner, how we split the bill—are conventions in Lewis's exact technical sense.

  So, when Priya and Daniel started planning this weekend, they weren't just blending a Gujarati Hindu tradition with a lapsed Catholic one. They were solving a complex coordination problem. Neither family's precedent had priority. There was no focal point. To break the symmetry, they had to create new salience—inventing rituals from scratch where neither tradition offered an answer. In Lewis's terms, this weekend is a coordination equilibrium selected from among many that could have arisen instead.

  Now, Priya has fielded an objection at parties for years: that calling something a "convention" makes it sound arbitrary. Interchangeable. As if it wouldn't have mattered who ended up at the altar.

  But Lewis's theory explains why that inference fails. A regularity is only "arbitrary" if there is another equilibrium that would have worked just as well. If Priya preferred Daniel, and Daniel preferred Priya, and this was common knowledge, then *this* pairing is the unique solution. It is not arbitrary relative to their preferences. The *rituals* are conventions—we could have lit different candles. But the union? That is a strict preference ordering.

  And once established, how does it hold? Later writers like Brian Skyrms showed us that conventions don't require constant reasoning to survive. They evolve. They stabilize through repetition and signaling. Priya and Daniel don't need to re-negotiate their commitment every morning. The equilibrium holds because the history of their relationship makes *this* path salient above all others.

  So, let's be precise about what is a Lewisian convention this weekend, and what is not. The fact that there are two ceremonies? Convention. The specific shade of Priya's lehenga? Convention. Whether we sit on the left or the right? Convention. The fact that Priya will correct you if you call any of this "just a custom"? That is a law of physics.

  Priya and Daniel have built a shared language, a shared history, and now, a shared equilibrium that is robust, stable, and uniquely theirs. They have turned the arbitrary into the essential, not by ignoring the theory, but by living out the best version of it.

  Please raise your glasses. To Priya and Daniel: may your coordination be seamless, your common knowledge deepen every year, and may your equilibrium be forever stable. To the bride and groom.
