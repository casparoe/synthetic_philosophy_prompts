answer: |-
  This is an exceptionally sharp observation. You have put your finger on one of the most enduring and contentious cruxes in Hume scholarship, often referred to as the debate between the "Old Hume" (the logical positivist/reductionist reading) and the "New Hume" (the skeptical realist reading).

  Your intuition that the two passages seem to pull in opposite directions is shared by many professional historians of philosophy. Here is how to resolve the textual tension, followed by an analysis of what it means for your train journey debate about Lewis and Armstrong.

  ### 1. Resolving the Tension in the *Enquiry*

  The tension you identified lies between an **ontological claim** (Passage 1: there *is* a power actuating the machine) and a **semantic/epistemic claim** (Passage 2: we have no *idea* of power, so the word is meaningless).

  #### The "Old Hume" Reading (Regularism/Projectivism)
  Traditionally, influenced by logical positivism, scholars read Hume as an eliminativist. On this view, Passage 1 is rhetorical or careless. The "power" Hume mentions is merely a placeholder for the unknown, but since he argues we have no impression of it, we must conclude it does not exist *as a distinct metaphysical entity*. Causation is reduced to regularity + psychological habit. Passage 2 is the true doctrine: talk of "necessary connection" is nonsense unless defined as constant conjunction.

  #### The "New Hume" Reading (Skeptical Realism)
  Since the 1980s (championed by scholars like Galen Strawson, David Owen, and Peter Kail), a strong contingent argues that Hume is a **Skeptical Realist**. On this reading, the passages are perfectly consistent:
  *   **Passage 1 (Ontology):** Hume believes there *really are* causal powers in nature ("actuates the whole machine"). He is not denying their existence; he is denying our access to them.
  *   **Passage 2 (Epistemology/Semantics):** Because we never perceive these powers, we cannot form a genuine *idea* of them. Therefore, when we use the word "power" in philosophy, we are using it without a clear referent. We must restrict our *discourse* to what we can observe (regularities), even if we remain agnostic (or secretly realist) about what *produces* those regularities.

  **The Resolution:** The standard scholarly reconciliation is that Hume is making a point about **meaning**, not necessarily about **being**. He is arguing that since all ideas come from impressions, and we have no impression of necessity, our *concept* of necessity is empty. This does not logically entail that there is no necessity in the world (Passage 1), only that we cannot conceive of it or talk about it meaningfully (Passage 2).

  **Verdict:** It is a live interpretive dispute, but the "Skeptical Realist" reading has gained significant traction because it makes better sense of Passage 1 without dismissing it as a slip. Hume is an epistemic skeptic about powers, not necessarily a metaphysical nihilist about them.

  ### 2. Does This Matter for the Lewis vs. Armstrong Debate?

  This is the crucial pivot. Does the "New Hume" reading undermine the "Humean" position in modern metaphysics?

  **The Shift from Epistemology to Metaphysics**
  Hume's project in the *Enquiry* is primarily epistemological and semantic: *What is the origin of our idea of necessity?*
  Lewis's project in "New Work for a Theory of Universals" is metaphysical: *What makes a proposition a law?*

  *   **If Hume is a Skeptical Realist:** He believes powers exist but are unknowable. Lewis, however, explicitly denies that powers exist. Lewis's "Humean Supervenience" is the doctrine that there are **no necessary connections between distinct existences**. If Hume believed powers *did* exist (even unknowable ones), Lewis is actually *departing* from Hume's ontology, not following it. Lewis takes Hume's epistemic limitation ("we can't know powers") and hardens it into an ontological principle ("there are no powers").
  *   **If Hume is a Regularist:** He believes powers are just projections onto regularities. Lewis follows him closely here.

  **Does it affect the debate's validity?**
  Not really. The contemporary debate stands on its own systematic merits, not on historical exegesis.
  *   **Armstrong's Objection:** Armstrong argues that regularities need *explanation*. Mere cosmic coincidence (Humeanism) is implausible. He wants "governing" laws.
  *   **Lewis's Defense:** Lewis argues that positing "necessitation relations" between universals is magical and unintelligible (echoing Hume's Passage 2). He argues we should accept the mosaic of facts and systematize them (Best System Account).

  If Hume turns out to be a Skeptical Realist, it weakens the **historical appeal** of Lewis's position (he can't say "Hume proved there are no powers"), but it does not weaken the **philosophical argument**. Lewis's argument is that we should not posit entities that do no explanatory work and violate parsimony. Whether Hume personally believed in hidden powers is irrelevant to whether Lewis's Best System Account is true.

  However, it does change the **dialectic**. If Hume was a Skeptical Realist, then the "Humean" tradition is actually a radicalization of Hume, not a conservation of his view. Lewis goes further than Hume by denying the hidden machinery Hume thought might be there.

  ### 3. Can Modern Humeans Claim Hume in Good Conscience?

  **Yes, but with an asterisk.**

  You can claim Hume as an ancestor in good conscience for three reasons:

  1.  **Methodological Naturalism:** Both Hume and Lewis reject "occult qualities." Even if Hume allowed for the *possibility* of hidden powers, he insisted they play no role in science or philosophy because they are unobservable. Lewis agrees: metaphysics should not outstrip scientific naturalism.
  2.  **The Critique of Intelligibility:** Hume's core attack in Section VII is that the concept of "necessary connection" is unintelligible. Lewis adopts this. He argues that Armstrong's "N" relation (necessitation) is just a label; saying "N(F,G)" makes Fs Gs is no more intelligible than saying "It just happens." Lewis is channeling Hume's semantic skepticism, even if he turns it into metaphysics.
  3.  **Family Resemblance:** "Humeanism" in contemporary metaphysics is a term of art. It refers to a cluster of views (supervenience of laws on matters of fact, rejection of modal realism, etc.). Lewis explicitly named his view "Humean Supervenience" acknowledging it was a reconstruction, not a transcription.

  **The Asterisk:**
  If your friend is well-read, they might point out that if the "New Hume" reading is correct, Lewis is actually *more* dogmatic than Hume. Hume said, "We can't know if there's a connection." Lewis says, "There is no connection."
  *   **Your Counter:** You can concede this historical point while maintaining the philosophical one. You can say: "Hume showed that the *idea* of necessary connection is empty. Lewis takes the charitable step of removing the empty concept from our ontology entirely. We are following the *spirit* of Hume's razor, even if we sharpen the blade."

  ### Summary for Your Friend

  If you meet to continue the debate, here is the synthesis:

  1.  **On the Text:** You are right that the passages tension. The most sophisticated reading (Skeptical Realism) suggests Hume thought powers might exist but are cognitively closed to us. However, he insisted that because they are closed to us, they are irrelevant to human understanding.
  2.  **On the Metaphysics:** The modern Humean/Anti-Humean debate is about **truthmakers for laws**, not just the origin of ideas. Armstrong wants a truthmaker (the relation of necessitation). Lewis thinks the regularities + systematization are enough.
  3.  **On the Ancestry:** Lewis is a "Neo-Humean." He transforms Hume's epistemic skepticism into a metaphysical principle. If Hume was a Skeptical Realist, Lewis is extending Hume's philosophy, not merely reporting it.

  **Conclusion:** You can claim Hume as an ancestor, provided you acknowledge that "Humeanism" today is a development of Hume's insights, not a perfect mirror of his personal ontology. The core shared insight is that **modality (necessity, power, law) must be grounded in the actual, observable world, not in a shadowy realm of invisible connectors.** Whether that shadowy realm is *empty* (Lewis) or just *invisible* (Hume's Skeptical Realism) is a secondary disagreement compared to the shared rejection of Armstrong's intelligible necessitation.

  Your friend's appeal to Armstrong relies on the idea that regularities need a "glue." Hume (and Lewis) would reply that positing a "glue" (necessitation) explains nothing unless you can explain the glue itself—which, as Hume noted in Passage 2, we cannot. On that core point, you and Hume (and Lewis) are on solid ground together.
