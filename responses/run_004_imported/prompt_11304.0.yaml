answer: |-
  **The Weaning and the Wall: Maimonides on the Permanence of Sacrifice**

  The tension between Maimonides' philosophical explanation of animal sacrifice in the *Guide of the Perplexed* and his legal codification in the *Mishneh Torah* constitutes one of the most famous cruxes in medieval Jewish thought. In the *Guide*, Maimonides presents sacrifice as a divine concession to historical necessity, a "weaning" strategy designed to transition a pagan populace toward monotheism without shocking their psychological habits. Yet, in the *Mishneh Torah*, he unequivocally rules that the Messianic king will rebuild the Temple and restore the sacrificial order in perpetuity. Nahmanides (Ramban) famously seized upon this discrepancy to argue that Maimonides' theory was historically flawed and theologically dangerous, suggesting that sacrifice possesses an intrinsic, cosmic value independent of human psychology.

  To determine whether Maimonides holds a coherent position or suffers from an unresolvable contradiction, one must examine the relationship between his historical rationalization and his legal normativity. While the tension is palpable, it is not fatal. Maimonides' position is coherent and defensible if one distinguishes between the *historical genesis* of a commandment and its *ontological status* once commanded. His most considered view is not that sacrifice is merely a temporary scaffold to be discarded upon spiritual maturity, but rather that it is an eternally binding divine statute whose specific form was shaped by history, but whose authority transcends it.

  In *Guide of the Perplexed* III:32, Maimonides advances a bold thesis: the sacrificial cult was not the primary will of God. Ideally, God would have commanded prayer and intellectual contemplation alone. However, given the ubiquity of sacrificial worship in the ancient Near East, an abrupt abolition would have been psychologically impossible for the Israelites. Thus, God permitted the *act* of sacrifice while radically altering its *intent* (from idols to the One God) and its *location* (centralized in one Temple). In III:46, Maimonides extends this to specific laws, arguing that the choice of animals (sheep, cattle) was a polemic against the Sabians, who revered these very creatures. By commanding their slaughter for God, the Torah uprooted idolatrous associations.

  This "concession theory" creates the apparent conflict with *Mishneh Torah*, Hilchot Melachim 11:1. Here, Maimonides describes the Messianic era not as a time when sacrifice is abolished in favor of pure prayer, but as a time when the sacrificial order is fully restored. If sacrifice is a medicine for the "disease" of idolatrous habituation, and the Messianic era represents the cure (a world filled with the knowledge of God), why continue the treatment? Nahmanides, in his commentary on Leviticus 1:9, argues that this exposes a failure in Maimonides' logic. Sacrifice predates the idolatry of Egypt (e.g., Abel and Noah), and offering revered animals does not negate their sanctity but acknowledges it. For Nahmanides, sacrifice is a metaphysical necessity, a channel connecting the physical and spiritual worlds, which remains valid regardless of historical context.

  Critics often argue that Maimonides is engaging in esotericism: the *Guide* reveals the "truth" (sacrifice is obsolete in principle) to the philosophical elite, while the *Mishneh Torah* maintains the "noble lie" for the masses. However, this reading underestimates Maimonides' commitment to Halakha. If the *Guide*'s view were the ultimate truth, Maimonides would have hinted that sacrificial laws might be suspended in the future. He does not. Instead, he codifies them with the same precision as laws of prayer or charity.

  The coherence of Maimonides' position rests on a distinction between *reasons for the commandments* (*ta'amei ha-mitzvot*) and the *authority of the commandments*. In the *Guide*, Maimonides is answering the question: "Why this specific form of worship?" His answer is historical and psychological. He is not necessarily answering the question: "How long is this worship binding?" For Maimonides, once God commands a statute (*hok*), its binding nature is not contingent on the continued existence of the historical conditions that prompted its specific form. The "weaning" metaphor in the *Guide* explains the transition from paganism to Torah, not a transition from Torah to a post-Torah spirituality. The infant is weaned from milk (idolatry) to solid food (Torah sacrifice); he is not weaned from solid food to nothing.

  Furthermore, Maimonides' anthropology supports the permanence of sacrifice. While he privileges intellectual apprehension of God as the highest human perfection, he acknowledges that humans are hylomorphic composites of matter and form. We are embodied beings. In *Guide* III:51, he describes the elite who can maintain constant intellectual attention on God, but he admits this is rare and fleeting. For the vast majority, and even for the elite in their communal capacity, worship requires action. The Messianic era, in Maimonides' rationalist conception, is not a supernatural alteration of human nature but a political and moral restoration. Humans in the Messianic age will still possess imaginations and bodies. Therefore, a system of worship that engages the body and the imagination remains necessary to structure communal religious life, even if the *intent* is purely monotheistic. The *Guide* attacks the *idolatrous intent* of sacrifice, not the *embodied act* itself when directed toward God.

  Consequently, the restoration of sacrifice in the Messianic era is not a regression. It is the restoration of the divinely ordained political order. Maimonides views the Temple service as the center of the Jewish polity. To remove it would be to dismantle the constitutional structure of the Torah. The "concession" was that God allowed sacrifice *at all* given the historical context; but having allowed it, He made it an eternal statute. The tension dissolves when we realize that for Maimonides, Divine Will is not bound by human utility. While human reason can discern the utility (combating idolatry), the obligation stems from the Command itself.

  Is this position defensible? From a modern rationalist perspective, it is difficult to defend the idea of a God who commands blood sacrifice as an eternal statute. However, within Maimonides' framework, it is robust. It avoids the pitfalls of Nahmanides' mystical realism (which Maimonides would reject as superstition) while maintaining the integrity of the Halakha. It acknowledges the historical situatedness of revelation without reducing revelation to *mere* history.

  Nevertheless, one must concede that a residue of tension remains. If the Messianic era is defined by the universal knowledge of God (Isaiah 11:9), the psychological need for the "weaning" tool seems diminished. Maimonides' defense relies on the premise that human embodiment is a permanent limitation, not just a historical stage. If one accepts that humans, even perfected ones, require tangible acts to anchor spiritual intentions, Maimonides is coherent. If one believes that spiritual perfection renders physical ritual obsolete, Maimonides is contradictory.

  Given Maimonides' consistent prioritization of *ma'aseh* (action) over *kavanah* (intention) in his legal works, his most considered view is that the legal reality supersedes the philosophical speculation. The *Guide* provides the *reason* for the law, but the *Mishneh Torah* establishes the *fact* of the law. The "weaning" was from idolatry, not from the Temple service. The Temple service, once purged of idolatrous intent, becomes the eternal mode of embodied worship.

  In conclusion, Maimonides holds a coherent, albeit complex, position. There is no unresolvable tension between the *Guide* and the *Mishneh Torah* because they address different dimensions of the commandment: the former addresses its historical wisdom, the latter its normative permanence. Maimonides does not view sacrifice as intrinsically valuable in a metaphysical sense (contra Nahmanides), but he does view it as legally indispensable. The Messianic restoration of sacrifice is not a failure of spiritual progress but the triumph of Divine Law over human historical contingency. The "concession" became a "statute," and for Maimonides, a statute commanded by God remains binding even when the original historical impetus has faded. Thus, the sacrifice endures not because God needs it, nor because humans cannot outgrow it, but because God willed it to be the permanent architecture of His service.
