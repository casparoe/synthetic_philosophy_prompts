answer: |-
  Friends, colleagues, family.

  Thank you for being here. For those of you who don't know me, I am a biologist. [Name] and I met more than forty years ago in graduate school. I was studying evolutionary biology; she was studying economics. In those days, we used to joke that we were studying the same thing from opposite ends of the telescope. I was interested in how organisms behave when they don't have to think about it—how genes drive strategy. She was interested in the heavy lifting of the human mind: what we know, what we believe, and what we know about what you believe.

  I have been asked to speak about her life. But to speak about her life honestly, I have to speak about her work. Not the credentials on the wall, but the actual puzzle that occupied her mind for four decades. Because the way she solved that puzzle is exactly the way she lived.

  [Name] specialized in a corner of game theory that sounds abstract until you realize it describes almost every human relationship. She worked on the "Centipede Game."

  Imagine two players. There is a pot of money. It starts small. Player One can take the pot and end the game, or pass it to Player Two. If they pass, the pot grows. Then Player Two can take the larger pot, or pass it back. It goes back and forth, the pot getting bigger every time. But if anyone takes, the game ends.

  The cold logic of economics—the "backward induction" argument—says the game should end immediately. Here is why: If we get to the very last round, the rational player will take the money. Why pass? The game is over anyway. But if Player Two is going to take on the last round, Player One should take on the second-to-last round. And if Player One is going to do that, Player Two should take on the round before that. The logic unravels all the way back to the start. To be "rational," in this specific technical sense, is to defect on the very first move. To grab the money and run.

  Of course, in experiments, people don't do that. They pass. They cooperate. They let the pot grow.

  For most people, that just means humans are nice. For [Name], it was a crisis of logic. She spent her career asking: What exactly is broken in the math?

  The standard argument relies on something called "common knowledge of rationality." I know you are rational. You know I am rational. I know that you know that I know. It is a perfect mirror of mutual expectation.

  But [Name] focused on the moment that mirror cracks. If I am Player One, and I *pass* the money, I have done something the theory says a rational person would never do. I have created a paradox. Now it is your turn. You are looking at a game node that, according to the logic of "common knowledge," should not exist.

  The question [Name] asked was: Now what do you believe?

  The strict theorists said you must assume I am irrational, so you should take the money and punish me. But [Name] argued that reaching that node changes the rules of belief. If I have passed, perhaps I am not irrational. Perhaps I am signaling that I trust *you* to pass as well. The fact that the "rational" path was broken licenses you to update your belief about me. It allows you to assume that I am playing a different game than the one the textbook described.

  The crack in the argument was her life's work. She showed that the logic of defection only holds if you refuse to learn from the unexpected. If you insist the world is rigid, you end up alone with a small pot. If you allow the unexpected move to teach you something new about the other person, the game can continue.

  I tell you this not to give a lecture, but because I have known [Name] for forty years. And I can tell you with absolute certainty: she never took the pot on the first move.

  In our friendship, in her marriage, in her mentorship of students, she constantly faced moments where the "rational" choice—the safe choice, the self-protective choice—was to defect. To withdraw. To assume the other person was acting in bad faith.

  I remember a time, early in our careers, when a departmental dispute threatened to turn ugly. The "backward induction" move was clear. Secure your own position, expose the other side's weakness, end the game before they end it for you. It was the logical move. [Name] refused. She passed. She acted as if the other party were capable of cooperation, even when their actions suggested otherwise. She created a node that shouldn't have existed.

  Some might call that naivete. I call it what she called it: epistemic humility. She understood that assuming you know exactly what the other person is capable of is the real error. She knew that when someone makes a move you don't understand, you don't have to punish them. You can ask them what they believe.

  In my own field, evolutionary biology, we model hawks and doves. We don't worry about what the birds believe about each other's beliefs. We just watch who survives. But [Name] spent her life inside the mind of the player. She knew that survival isn't just about fitness; it's about the story we tell each other about why we passed the money.

  She knew that the "common knowledge of rationality" is a fiction. We do not know each other perfectly. We are not mirrors. We are opaque, and mysterious, and capable of surprising each other. And it is precisely because we cannot be certain of the other's rationality that we have room to be kind.

  The technical point she championed was that once the script is broken, you are no longer licensed to assume the old rules apply. You are free to write new ones.

  That is how she lived. When life handed her a node that shouldn't have existed—a diagnosis, a loss, a difficulty—she did not unravel. She did not retreat to the safety of the first move. She updated her beliefs. She found a way to keep the pot growing. She kept cooperating with a world that often gave her reasons to defect.

  So, how do we honor her?

  We honor her by recognizing that the logic of the grave is the logic of the last move. It says the game is over, the pot is fixed, take what you can. But that is the backward induction of grief. It is the assumption that because the end is certain, the middle doesn't matter.

  [Name] taught us that the middle is everything. She taught us that when the logic of loss tells us to close up shop, we are entitled to believe otherwise. We are entitled to look at the unexpected node of her absence and decide that it does not license us to stop playing.

  The crack in the argument is where the trust gets in.

  So, let us not defect. Let us not retreat into the safety of our own sorrow. Let us do the irrational thing. Let us pass the pot to one another. Let us assume that there is another round to be played, and that cooperation is still possible, and that the value of the game is not in the taking, but in the playing.

  She kept the game going for us. It is our turn to pass.
