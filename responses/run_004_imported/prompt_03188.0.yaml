answer: |-
  Here is the argument I would offer to your seminar.

  ***

  I want to begin by conceding the strength of your students' objection. The "closeness problem" is not merely a technical glitch in the Doctrine of Double Effect (DDE); it is a fundamental challenge to the coherence of intention as a moral category. If an agent can redescribe their objective at a higher level of abstraction—"I am destroying a city" rather than "I am killing civilians"—then the prohibition on intending evil becomes a matter of semantic preference rather than moral reality. If the Truman defender can plausibly claim that the object of their choice was "the demonstration of destructive capacity" and that the deaths were merely the inevitable physical substrate of that demonstration, then Anscombe's charge of murder loses its philosophical grip, even if our moral revulsion remains.

  However, I argue that Anscombe's verdict survives this maneuver. The redescription fails not because it is psychologically implausible, but because it is *causally* inaccurate regarding the specific strategic logic employed at Hiroshima and Nagasaki. To defend Anscombe, we do not need to solve the closeness problem for every conceivable case (such as the craniotomy); we only need to show that in *this* case, the deaths of the civilians play a causal role that cannot be relegated to the status of "side effect."

  To see this, we must first steel-man the redescription challenge as rigorously as possible. The defender of Truman argues as follows: "The President's intention was to end the war. The mechanism chosen was to convince the Japanese High Command that resistance was futile. This conviction required a demonstration of overwhelming power. The atomic bomb provided that demonstration by leveling urban areas. The deaths of the inhabitants were a foreseen, regrettable, but physically necessary consequence of leveling those areas. Had the cities been empty, the bombs would still have been dropped to demonstrate the capacity to level them. Therefore, the deaths were not the means; the destruction of infrastructure and the demonstration of capability were the means."

  This argument relies on a specific distinction between the *physical event* (the explosion and leveling) and the *human cost* (the deaths). It attempts to place the human cost on the "foresight" side of the DDE line by claiming the strategic goal could have been achieved by the physical event alone, even absent the deaths.

  This is where the argument collapses. It collapses because it misidentifies the *mechanism of efficacy* in Truman's specific plan.

  To distinguish intended means from foreseen side effects without resorting to ad-hoc semantic slicing, I propose we utilize a version of Warren Quinn's distinction between direct and indirect agency, refined by what we might call the "Explanatory Relevance Test." On this view, a harm is intended as a means if the agent's plan relies on that harm (or the state of affairs constituting that harm) to explain *why* the action succeeds. If the success of the plan would be unintelligible without referencing the harm, the harm is intended.

  Let us apply the counterfactual test often associated with this view, but ground it in the actual strategic rationale rather than hypothetical magic. The Truman defender claims: "Had the cities been empty, the bombs would still have been dropped." I contend this is false, given the actual stated goals of the US leadership. The goal was not merely to destroy factories (which could be done by tactical bombing, as had been done extensively with conventional firebombing already). The goal was *unconditional surrender* via psychological shock.

  Ask yourself: What constitutes the "shock" in this scenario?
  If the Tactical Bomber drops a bomb on a munitions factory, the shock to the enemy is the loss of munitions. The deaths of workers are causally incidental to the loss of munitions; the factory is destroyed regardless of whether the workers die.
  But in the Strategic/Terror Bomber scenario (which Anscombe argues Truman fits), the "shock" is not the loss of buildings. The shock is the *massacre*. The Japanese leadership was already accustomed to cities burning; the firebombing of Tokyo had killed more people than Hiroshima. What made the atomic bomb distinct was not merely the efficiency of destruction, but the singular, apocalyptic finality of it.

  If a magic spell had leveled Hiroshima but left the 140,000 inhabitants alive and unharmed, would the Japanese government have been "shocked" into unconditional surrender in the way Truman intended? I argue they would not. The political message of the atomic bomb was: *We can annihilate your people, and we will.* The deterrent force of the weapon lay precisely in its capacity to slaughter civilians en masse without military necessity. If the civilians had survived the demonstration, the "overwhelming destructive power" would have been revealed as a bluff regarding human life. The "demonstration" *was* the killing.

  Therefore, the redescription fails because the "destruction of the city" cannot be conceptually severed from the "death of the inhabitants" in the context of a psychological shock strategy. In a tactical strike, the destruction of the building is the primary causal lever; the death is a byproduct. In the Truman scenario, the death of the inhabitants is the primary causal lever; the destruction of the building is merely the method of delivering the death.

  This is where Quinn's distinction between direct and indirect agency becomes vital. Quinn argues that in direct agency, the agent involves the victims in their plan in a way that requires the victims' harm to contribute to the agent's goal. In indirect agency, the harm is a result of the plan, but not a contributing cause of the goal.

  In the Truman case, the civilians are not merely "in the way" of a military objective (as they might be in a siege or a tactical strike on a factory). They are the *medium* through which the message is sent. Their deaths are the ink; the surrender is the letter. You cannot write the letter without the ink. If the civilians do not die, the "shock" does not occur. If the shock does not occur, the surrender is not achieved. Thus, the deaths are causally essential to the success of the plan.

  Your students might object that this makes the distinction dependent on the *psychological state* of the leadership, which is hard to verify. But Anscombe's charge is not a historical claim about Truman's private mental imagery; it is a moral claim about the *nature of the act*. The act of "terror bombing" is defined by its structure: it seeks to break the enemy's will by destroying what they love (their people), rather than breaking their capacity to fight (their army).

  When the students argue that "intention can be redescribed," they are assuming that the description of the act is up to the agent. But in moral philosophy, particularly in the Anscombean tradition, the description of the act is constrained by reality. You cannot intend "to knock a man down" without intending "to apply force to a man." Similarly, you cannot intend "to shock the Japanese government by demonstrating the annihilation of a city" without intending "the annihilation of the people in the city," because the latter is constitutive of the former.

  The redescription strategy works in cases like the craniotomy (where the death of the fetus is not the *cause* of the mother's survival, but a concomitant of the skull's removal) or the tactical bomber (where the factory's destruction is the cause of the war effort's hampering, not the workers' deaths). It fails in the Truman case because the causal chain runs *through* the deaths. The deaths are not a bottleneck the agent wishes they could avoid; they are the engine of the strategy.

  Consequently, there is a principled, non-ad-hoc way to block the redescription. It is the **Causal Dependency Principle**: *A harm is intended as a means if the agent's plan relies on the occurrence of that harm to bring about the desired end, such that the end would not be achieved (given the agent's understanding of the world) if the harm did not occur.*

  In Hiroshima and Nagasaki, the "end" was a psychological capitulation driven by terror. The "terror" was constituted by the mass death of civilians. Therefore, the plan relied on the mass death. The redescription ("I only intended destruction") attempts to hide the causal dependency by focusing on the physical mechanism (the blast) rather than the political mechanism (the terror). But moral intention tracks the political mechanism in cases of strategic bombing.

  I conclude, then, that the closeness problem, while a serious threat to DDE in medical or tightly constrained physical cases, does not dissolve the distinction in cases of strategic terror. The Truman defender's redescription is not a valid refinement of intention; it is a obfuscation of the causal structure of the act. Anscombe is right: when the death of innocents is the very lever by which you move the world to your will, you have intended their death. To claim otherwise is not to refine the doctrine of double effect, but to evacuate it of all content.
