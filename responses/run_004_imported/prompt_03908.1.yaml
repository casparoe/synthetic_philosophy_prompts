answer: |-
  You are right to be nagged. The seminar group's dismissal of this as a "presentational wrinkle" is, with respect, a failure to grasp the structural architecture of Lewis's account. The tension you have identified is not merely a friction between intuitions; it is a formal inconsistency in the truth-conditions of disposition ascriptions within Lewis's system.

  Here is the argument for why this is a damaging inconsistency, followed by the recommendation on which commitment a Lewisian must sacrifice to restore coherence.

  ### The Inconsistency: IDT vs. The Logic of RCA

  To see why this is fatal, we must formalize the conflict between the **Intrinsic Dispositions Thesis (IDT)** and the **"Getting Specific"** maneuver within the framework of the **Reformed Conditional Analysis (RCA)**.

  1.  **The Commitment to IDT (from Finks):** In the electro-fink case, Lewis argues that the live wire wired to a fink (that kills it upon contact) is still *disposed to conduct*. Why? Because it possesses the intrinsic causal basis (free electrons). Lewis explicitly invokes IDT here to block the deflationary move (associated with Choi and Gundersen) that the wire's disposition is extrinsically determined by the fink. For Lewis, if $x$ and $y$ are intrinsic duplicates, they must share dispositions. The finked wire and the unfinked wire are intrinsic duplicates; therefore, they share the disposition *live*. The fink prevents the *manifestation*, not the *possession*.
  2.  **The Commitment to "Getting Specific" (from Masks):** In the packing case, the fragile glass wrapped in foam is an intrinsic duplicate of an unpacked fragile glass. The unpacked glass is disposed to break when struck ($D_{simple}$). The packed glass, however, fails the RCA conditional for $D_{simple}$ (if struck and basis retained, it would not break, because the foam absorbs the shock). To avoid saying the packed glass lacks fragility entirely, Lewis employs "Getting Specific": the packed glass possesses a *different* disposition, $D_{specific}$ (disposed to break when struck *in the absence of packing*).
  3.  **The Contradiction:**
      *   By **IDT**, the packed glass and the unpacked glass (being intrinsic duplicates) must possess the *same* dispositions.
      *   By **"Getting Specific"**, the unpacked glass possesses $D_{simple}$ and the packed glass possesses $D_{specific}$.
      *   $D_{simple} \neq D_{specific}$ (they have different stimulus conditions and truth conditions).
      *   Therefore, the duplicates possess different dispositions.
      *   **Therefore, IDT is false.**

  Lewis cannot have it both ways. In the Fink case, he insists that extrinsic interferers (the fink) do *not* alter the identity of the disposition possessed (to preserve the intuition that the wire is "really" live). In the Mask case, he insists that extrinsic interferers (the packing) *do* alter the identity of the disposition possessed (to preserve the truth of the conditional analysis). This is not a tension; it is a contradiction in the individuation conditions for properties. It renders the theory ad-hoc: extrinsic factors are irrelevant to disposition identity when it suits the Fink solution, but constitutive of disposition identity when it suits the Mask solution.

  ### The Recommendation: Jettison IDT

  To restore consistency, a Lewisian should **jettison the Intrinsic Dispositions Thesis (IDT)**, while retaining **RCA** and the **"Getting Specific"** maneuver.

  This may seem counter-intuitive, as Lewis defended IDT vigorously. However, retaining IDT forces you to abandon either RCA (the core of the reductive project) or "Getting Specific" (which leads to the unacceptable conclusion that masked objects lack dispositions entirely). Dropping IDT is the only path that preserves the analytical power of Lewis's Humeanism.

  Here is why IDT is the correct casualty:

  #### 1. Distinguishing Bases from Dispositions
  The primary motivation for IDT was to ensure that causal powers are local and intrinsic, fitting within Humean Supervenience. However, a Lewisian can satisfy this metaphysical constraint without imposing it on the *semantic* level of disposition ascriptions.
  *   **Keep the Basis Intrinsic:** The *causal basis* ($B$) must remain intrinsic. This ensures that causation is local and that the Humean mosaic is constituted by intrinsic properties at spatiotemporal points. The finked wire and the unfinked wire share the same intrinsic basis (free electrons).
  *   **Make Dispositions Extrinsic:** The *disposition* itself is a higher-order property defined by the counterfactual conditional (RCA). Since counterfactuals are sensitive to the surrounding environment (the "sphere of similarity" includes extrinsic facts), the truth of the conditional—and thus the possession of the disposition—is extrinsic.

  By dropping IDT, you can say: "The finked wire and the unfinked wire have the same *intrinsic causal basis*, but they have different *dispositions*." The finked wire lacks the disposition *live* (because it won't conduct if touched), but it retains the *basis* for liveness. This preserves the metaphysical insight Lewis wanted (the difference is in the environment, not the local physics) without forcing the contradiction on property individuation.

  #### 2. Saving RCA from Triviality
  If you retain IDT and drop "Getting Specific," you must admit that the packed glass is *not* disposed to break when struck. While some (like Choi) bite this bullet, it renders the concept of "fragility" useless for practical prediction. We call the glass fragile *because* we know that if we remove the packing, it will break.
  "Getting Specific" captures this: it identifies the disposition relative to the normal or relevant conditions. If you force IDT, you sever the link between disposition ascriptions and the counterfactuals that justify them. RCA becomes a metaphysical claim about "hidden powers" rather than an analysis of what we *mean* by disposition talk. A Lewisian, committed to analyzing concepts via conditionals, should prioritize the success of the analysis (RCA + Getting Specific) over the pre-theoretic intuition that dispositions are intrinsic (IDT).

  #### 3. Humean Consistency
  Finally, dropping IDT is actually *more* faithful to Lewis's broader Humean project. Humean Supervenience claims that everything supervenes on the arrangement of local qualities. It does not claim that every *property* we ascribe is intrinsic. Extrinsic properties (like *being 5 miles from a tower*) supervene on the mosaic just as well as intrinsic ones.
  Dispositions are relational properties: they relate an object to a stimulus and a manifestation. It is perfectly Humean to say this relation depends on the extrinsic environment (the presence of finks or masks). By clinging to IDT, Lewis was arguably conceding too much to the Anti-Humean dispositionalists who view powers as intrinsic "pushes." A consistent Humean should be comfortable with dispositions being extrinsic relations grounded in intrinsic bases.

  ### Conclusion

  The inconsistency is genuine: Lewis treats extrinsic interferers as irrelevant to disposition identity in Fink cases but relevant in Mask cases. To fix this, the Lewisian must **abandon IDT**.

  This move allows you to maintain that the **causal basis** is intrinsic (satisfying the demand for local causation and solving the Fink case by pointing to the basis rather than the disposition) while admitting that **disposition ascriptions** are extrinsic (satisfying RCA and handling Masks via "Getting Specific"). This restores unity to the theory: extrinsic factors always affect disposition identity, but they do not necessarily affect the possession of the intrinsic causal ground. This is the only way to save the Conditional Analysis without collapsing into contradiction.
