answer: |-
  The room is quiet, save for the rhythmic *clack* of poker chips and the occasional slap of a coin on felt. The air smells faintly of old paper and coffee. Two figures sit opposite each other at a baize-covered table.

  **ELENA** (late 60s, wearing a worn cardigan, eyes sharp) pushes a stack of blue chips forward. **MARCUS** (late 60s, suit jacket draped over the chair, sleeves rolled up) watches her, then places a smaller stack.

  A neutral observer flips the coin. It spins, catches the light, and lands. Heads.

  **ELENA**
  Twenty percent. Again.

  **MARCUS**
  Ten percent. You're aggressive for someone who spent a lifetime studying systems that freeze.

  **ELENA**
  Exactly because of that, Marcus. In a spin glass, the phase space fractures. You get trapped in local minima. If you bet too little, you never escape the noise. If you bet too much, you hit the absorbing boundary. Ruin. The Kelly fraction isn't a preference; it's the resonance frequency of the system.

  **MARCUS**
  (Scooping in the winnings)
  Resonance implies a single correct answer. But look at the room. In the Haghani experiments, the subjects who went bust didn't all bet 100%. Some bet 80%, some 40%. And the professionals? The ones actually making a living from this? They rarely bet full Kelly. They bet half-Kelly, or quarter-Kelly. If your "resonance frequency" is physically mandatory, why do the survivors ignore it?

  **ELENA**
  Because they are optimizing for something other than pure growth. They are optimizing for sleep. But don't confuse their psychological comfort with the physics of the wager. The Ergodicity Economics argument is simple: wealth is multiplicative. The ensemble average—the expectation value—is a lie. It tells you that if you bet everything on a 60/40 coin, you win on average. But *you* don't live in the ensemble. You live on the single trajectory. And on that trajectory, the all-in bet goes to zero almost surely.

  **MARCUS**
  Nobody in the Expected Utility tradition bets everything. That's a straw man. Samuelson wasn't defending ruin. He was defending the right to choose a utility function. If I choose $U(W) = \log(W)$, I get Kelly. If I choose $U(W) = -W^{-1}$, I get half-Kelly. The math accommodates both. The difference isn't physics; it's taste. You're dressing up risk aversion in the clothes of thermodynamics.

  **ELENA**
  (Tapping the coin)
  Is it taste? Or is it a category error? When you say "risk aversion," you imply I *could* tolerate the risk if I wanted to, but I simply don't like the volatility. But in a multiplicative game, ruin isn't "volatile." It's final. It's an absorbing state. Once I hit zero, I don't get to express my preference anymore. By calling it "risk aversion," you treat the constraint as internal to the agent. I'm telling you the constraint is external. It's in the dynamics. Non-ergodicity isn't a label for my fear; it's a description of the gap between the time average and the ensemble average.

  **MARCUS**
  But why must the time average be the master? That's the normative leap I can't swallow. You say, "Because the system is non-ergodic, you *ought* to maximize the geometric mean." Why? Suppose I have a finite horizon. Suppose I need to reach a specific sum to pay for a medical procedure in ten flips. The Kelly criterion might maximize my long-term growth rate, but it might minimize my probability of hitting that specific target in that specific window. A different utility function captures that need. Your "geometric rationality" presumes the only goal is to stay in the game forever. But sometimes we play to win, not just to play.

  **ELENA**
  If you play to win in a finite window, you are effectively altering the payoff structure. You're no longer in the pure multiplicative regime. But let's grant you the finite horizon. Even then, the non-ergodicity is doing the heavy lifting. In your EUT framework, you have to *postulate* a concave utility function to explain why I don't bet my whole bankroll. You ask, "Why are you risk averse?" and I say, "Because I don't want to go bust." You say, "Ah, so you have a utility function that penalizes zero."
  But I'm saying: Look at the map. The terrain *has* a cliff. You don't need a special psychological penalty for falling off a cliff. The cliff is sufficient. By framing it as utility, you obscure the structural fragility of the system. You make it sound like I'm being cautious, when actually I'm being physically consistent.

  **MARCUS**
  (Leaning forward)
  And there is the rub. You claim the cliff is objective. But the size of the cliff is subjective. What is "ruin"? Is it zero dollars? Is it losing half my status? Is it going back to a smaller house? In the lab, ruin is zero chips. In life, ruin is a gradient. If I treat wealth as a proxy for well-being, the mapping from dollars to well-being is concave. The first million saves my life; the tenth million buys a nicer yacht. That concavity *is* the utility function. It looks exactly like the correction you apply for non-ergodicity. So I ask you again: If the mathematical prescription is identical—don't bet the farm—what work is "non-ergodicity" doing that "diminishing marginal utility" isn't already doing? Is it anything more than a rebranding?

  **ELENA**
  It changes the explanation of *why* we don't bet the farm. If it's utility, then a billionaire with linear utility for money *should* bet the farm. If the payoff is large enough, the expected value is positive, and if they don't care about the dollars, they should take it. But if it's non-ergodicity, even the billionaire shouldn't bet the farm if the bet threatens their ability to continue operating as an agent.
  Consider the professionals you mentioned. They use fractional Kelly. The Ergodicity view says: They are accounting for parameter uncertainty. They know the edge isn't exactly 60%. It might be 55%. Full Kelly on an overestimated edge is suicide.
  The EUT view says: They are just more risk-averse.
  The first explanation suggests they are trying to align with the true dynamics of the world. The second suggests they just have different tastes. One is about truth; the other is about preference.

  **MARCUS**
  But "truth" in decision theory is slippery. You say maximize the growth rate. Why? Growth for whom? For the lineage? For the bank account? If I am an individual with a lifespan, my "time average" is cut short by death. The ergodic limit assumes $t \to \infty$. I don't have infinity. I have thirty years.
  If I maximize geometric growth, I accept a specific distribution of outcomes. I accept that there is a 50% chance my wealth will drop by half at some point. Some people find that unacceptable. Not because they misunderstand the math, but because the stress affects their health. That stress is a real cost. EUT allows me to price that cost. Your "Geometric Rationality" tells me I'm irrational for pricing it. It smuggles a specific goal—maximize long-run wealth—into the definition of rationality itself.

  **ELENA**
  It smuggles in the requirement that the agent *exists* to have preferences. You talk about stress and health as costs to be subtracted from utility. But if you leverage too high and the market gaps, you don't just feel stress. You are removed from the game.
  Think back to my work. Broken ergodicity. When a system cools too fast, it doesn't find the ground state. It gets stuck. The ensemble average says it should be in the ground state. The time average says it's in a metastable glass.
  Wealth dynamics are the same. The "expected wealth" is the ground state calculation. But we live in the glass. We live in the single trajectory. If you treat the ensemble average as the guide, you are planning for a phantom version of yourself that exists in all possible worlds simultaneously. You are betting as if you have copies in parallel universes to absorb the losses of the ones who go bust. Since you don't, the ensemble expectation is physically irrelevant.

  **MARCUS**
  (Spinning a chip on the table)
  I agree the ensemble expectation of *wealth* is irrelevant. No serious economist uses that. We use expected *utility*. And utility can be defined over the path, not just the endpoint. I can have a utility function that penalizes drawdowns. I can have a utility function that penalizes variance.
  The danger of your position, Elena, is that it becomes a motte-and-bailey. When challenged, you say, "It's just about avoiding ruin." Fine, we all agree on that. But then you push further: "Therefore, everyone should maximize geometric growth." That's the bailey.
  Why should a pension fund with fixed liabilities maximize geometric growth? They need to match cash flows. Why should a saver with a fixed goal maximize geometric growth? They need certainty, not rate. By declaring the geometric mean the "rational" objective, you are implicitly saying that accumulating the most money in the long run is the only rational goal. That's not physics. That's a value judgment.

  **ELENA**
  It's not the *only* rational goal. It's the *reference* goal. It's the baseline of what the system allows. You can deviate from Kelly, yes. But you should understand the cost. If you bet half-Kelly, you give up 25% of the growth rate to reduce volatility by 50%. That's a trade-off.
  The problem with EUT is that it treats the trade-off as arbitrary. "I like stability." Fine. How much? "I don't know, pick a coefficient."
  Ergodicity Economics says: Here is the efficient frontier of the system itself. The growth rate is a property of the coin and the payout, not the agent. The volatility is a property of the coin, not the agent. You can choose where to sit on the curve, but don't tell me the curve doesn't exist. Don't tell me that because I can choose a different utility function, the non-ergodic nature of the multiplication disappears.

  **MARCUS**
  I never said the nature disappears. I said it doesn't dictate the norm.
  Let's press your "relabeling" point. Suppose I am a trader. I know the edge. I know the odds. I bet half-Kelly.
  You say: "He is accounting for model uncertainty."
  I say: "He is expressing risk aversion."
  Observationally, we are identical. We both bet 10%.
  But normatively, we differ. If new information comes in that reduces uncertainty, you say I *must* increase my bet toward full Kelly. I say I *may* increase it, if my risk tolerance allows.
  If your framework is correct, then there is a "true" bet size determined by the physics of the market. If mine is correct, the "true" bet size is determined by the agent's needs.
  In the real world, when a quant fund de-leverages after a crisis, do they say, "Our estimate of the ergodic growth rate has changed"? Or do they say, "Our risk capital has diminished, and our mandate is to preserve capital"?
  It's the latter. They aren't chasing the time-average limit. They are managing a book within a finite context.

  **ELENA**
  (Pauses, watching the coin flip again. Tails.)
  They manage the book within a finite context because they are afraid of being fired. Which is an absorbing state.
  You keep coming back to "finite context." But the multiplicative dynamic doesn't care about your context. If you leverage 5x in a volatile market, you blow up. It doesn't matter if you're saving for a house or a pension. The math of compounding is ruthless.
  I think the friction between us is this: You see Utility as a container that can hold any preference, including the preference to survive. I see Survival as a prerequisite that sits *outside* the container.
  If I say, "I prefer to breathe," that's not a utility function. That's a condition for having preferences. Non-ergodicity highlights that ruin is not just a low-utility outcome; it's a termination of the function. By folding it into $U(W)$, you make it seem like I could rationally choose ruin if the payoff were high enough. I'm saying there are payoffs that cannot compensate for non-existence.

  **MARCUS**
  And I say that "non-existence" is just a very steep drop in the utility curve. If the cliff is vertical, the derivative is infinite. Mathematically, we can model that.
  But here is my final push, Elena. You physicists love invariance. You love laws that hold regardless of the observer. But decision theory is about the observer.
  If I am playing with money I can afford to lose, and I bet 50% of my bankroll on a 60/40 coin, I might go bust. But if I go bust, I go home and write a paper. My life isn't over.
  For the hedge fund, ruin is death. For me, it's a Tuesday.
  The non-ergodicity of the wealth process is real. But the *consequence* of hitting the boundary is agent-dependent. Your framework treats the boundary as universal. My framework treats the boundary as personal.
  So, is non-ergodicity doing normative work? Only if we agree that staying in the game is the only game worth playing.

  **ELENA**
  (Smiles faintly)
  Is it?
  If you leave the game, you can't place the next bet. And if the bets are positive expected value... leaving the table is the only true error.
  But I concede this: The "Geometric Rationality" school sometimes speaks as if the Log Utility is the *only* rational utility. That's dogma. It should speak of Log Utility as the *natural* utility of a replicating system.
  We are replicating systems. We want to survive. So the Log is natural. But if you are not trying to replicate—if you are trying to enjoy a specific consumption path—then EUT wins.

  **MARCUS**
  And if you are trying to enjoy a consumption path, you need to eat *now*. The Kelly criterion is asymptotic. It assumes you reinvest everything. But I have to buy groceries. The moment you withdraw from the pot, the pure multiplicative dynamic breaks. You enter a withdrawal regime.
  Does Ergodicity Economics handle withdrawals well? Or does it assume you live off the volatility?

  **ELENA**
  It handles withdrawals by reducing the effective growth rate. It treats consumption as a drag coefficient. The physics still holds. The drift is reduced. If the drag exceeds the drift, you hit the boundary.
  You see, Marcus, I don't need to win this argument to know where to put my chips. I know the coin is non-ergodic. I know I am a single trajectory.
  (She pushes her chips forward again.)
  Twenty percent.

  **MARCUS**
  (Shaking his head, smiling)
  And I know I have a wife who worries when the account statement swings too wildly. Ten percent.
  (She flips the coin.)

  **ELENA**
  Heads.

  **MARCUS**
  You grow faster. I sleep better. In the long run, we both know who the math favors.

  **ELENA**
  In the long run, we're all dead. That's the ultimate non-ergodicity.

  **MARCUS**
  Precisely. Which is why I choose the utility of the journey, not just the size of the pile at the end.

  **ELENA**
  But if the pile is zero, the journey ends early.

  **MARCUS**
  And if the journey is miserable, the pile doesn't matter.

  *They sit in silence for a moment, the chips stacked in uneven towers between them. The coin rests on the felt, showing neither head nor tail, just the ridged edge.*

  **ELENA**
  Same time next week?

  **MARCUS**
  Same time. But next week, I'm bringing a die. Let's see if your ergodicity holds up on six sides.

  **ELENA**
  (Laughs)
  I'll bring the log tables.
