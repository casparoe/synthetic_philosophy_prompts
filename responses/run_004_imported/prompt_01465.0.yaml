answer: |-
  This is an exceptionally sharp reading of the texts, and you are in excellent company. The tension you have identified between the ontological argument (the "double heart") and the eschatological argument (the "eternal wager") is one of the most persistent and fruitful problems in Augustinian ethics. It has occupied scholars from John Burnaby to Oliver O'Donovan.

  To answer your specific questions: Yes, this is a genuine tension. Yes, there is a way a committed Augustinian attempts to hold them together, though it requires a specific metaphysical commitment. And yes, your central claim survives scrutiny, though it can be sharpened by adjusting your terminology regarding "consequentialism."

  Here is a breakdown of how I would assess your argument, where an Augustinian would push back, and how you might refine your critique for maximum impact.

  ### 1. Is this a genuine tension in the texts?
  **Verdict: Yes.**

  You have correctly identified that Augustine operates with two distinct registers of justification.
  *   **Register A (Ontological/Semiotic):** In *De Mendacio*, Augustine defines a lie as *enuntiatio cum voluntate falsum enuntiandi* (an utterance with the will to state what is false). The sin is located in the *voluntas* to create a mismatch between sign and reality. This is the "double heart" (*cor duplex*). It is an intrinsic evil because it violates the nature of communication, which is ordained by God to convey truth. On this register, consequences are irrelevant.
  *   **Register B (Eschatological/Prudential):** In *Contra Mendacium*, when pressed on the "officious lies" (lies to save lives or chastity), Augustine pivots. He argues that the temporal good achieved (a life saved) cannot outweigh the eternal damage done to the soul. This is where he addresses the Hebrew midwives and Rahab. He explicitly weighs the "loss" of martyrdom against the "gain" of avoiding sin.

  The tension arises because Register A claims the act is wrong *in se* (in itself), while Register B suggests the act is wrong *because of what it costs you in the long run*. If the cost-benefit analysis were different (e.g., if there were no afterlife, or if God valued mercy over truth-telling), Register A would theoretically collapse, or at least lose its binding force.

  ### 2. Can a committed Augustinian hold both together without embarrassment?
  **Verdict: Yes, but only within his specific metaphysics.**

  If you were debating a committed Augustinian Thomist or a Reformed theologian steeped in this tradition, their defense would not be that these are two separate arguments, but that they are two descriptions of the same reality.

  Their counter-argument would run as follows:
  For Augustine, God is *Veritas* (Truth). To lie is not merely to make a factual error; it is to turn the will away from Being (God) toward Non-Being (Nothingness). Therefore, the "punishment" for lying is not an arbitrary penalty God tacks on afterward (which would make it consequentialist); the punishment is *intrinsic* to the act. To lie is to damage one's capacity to participate in God.

  Therefore, the "eternal cost-benefit" argument is not utilitarian calculation; it is **ontological realism**. The "cost" is the loss of communion with God. The "double heart" is the mechanism by which that loss occurs. In this view, the eschatological argument is simply the ontological argument viewed through the lens of eternity.

  **Where this defense struggles:**
  While metaphysically coherent, it functionally behaves like consequentialism in pastoral application. When Augustine tells Consentius that the midwives *should* have let the babies die rather than lie, he is asking them to make a calculation: *Temporal Death < Eternal Sin.* This requires a value judgment about the weighting of goods that looks suspiciously like the utilitarianism Augustine claims to reject. He is effectively saying, "The consequences of lying (eternal death) are worse than the consequences of truth-telling (temporal death)."

  ### 3. How to sharpen and reformulate your critique

  Your argument is strong, but labeling the second argument "consequentialist" might invite a semantic dodge from an Augustinian (who will insist it is "teleological"). To make your objection bulletproof, I suggest three refinements:

  **A. Shift from "Consequentialist" to "Eschatological Contingency"**
  Instead of calling it a "cost-benefit argument," frame it as a dependence on **eschatological contingency**.
  *   *Reformulation:* "Augustine's absolutism claims to be grounded in the necessary nature of speech (ontology). However, in hard cases, the prohibition holds only contingent upon the specific valuation of eternal goods over temporal goods. If one does not accept Augustine's specific eschatological economy—where martyrdom is a gain and survival is negligible—the absolute prohibition loses its rational force. Thus, the 'absolutism' is not intrinsic to the act of lying, but extrinsic to the believer's reward structure."

  **B. Highlight the "Martyrdom Imperative"**
  The strongest point in your draft is the treatment of the midwives. Push this harder.
  *   *Reformulation:* "Augustine's resolution of the biblical counter-examples reveals that his ethic is not actually a prohibition on *harm*, but a hierarchy of *loyalty*. By insisting the midwives would have been 'more rewarded' had they allowed the infants to be killed, Augustine admits that the lie was effective in preserving a created good (life). He forbids it not because it failed to do good, but because the 'good' of the liar's soul outweighs the 'good' of the neighbor's life. This undermines the 'double heart' argument, which suggests the sin is about the corruption of speech itself. If the corruption of speech is the primary evil, the neighbor's death is irrelevant. If the neighbor's death is weighed in the balance to prove the point, the 'double heart' is no longer the sole criterion."

  **C. Distinguish Between *Malum in Se* and *Malum Prohibitum***
  *   *Reformulation:* "Augustine wants to classify lying as *malum in se* (evil in itself, like the 'double heart' argument suggests). But his defense of this classification in *Contra Mendacium* treats it as *malum prohibitum* (evil because it violates a divine command that carries a penalty). The 'double heart' explains *what* a lie is; the eternal wager explains *why we must not do it*. The problem is that without the eternal wager, the 'double heart' lacks moral teeth in tragic dilemmas. This suggests the 'absolutism' is not derived from the nature of language, but from the authority of the Lawgiver and the severity of the penalty."

  ### Summary Recommendation

  Your intuition is correct: the "eternal wager" is the load-bearing wall in the hard cases, while the "double heart" is the decorative facade in the easy cases.

  To sharpen your paper/seminar contribution, I would argue that **Augustine's absolutism is not deontological in the Kantian sense (duty for duty's sake), but rather "Theonomic Consequentialism."** The consequences are real, but they are managed entirely by God's jurisdiction.

  **Proposed Thesis Statement Revision:**
  *"While Augustine presents his prohibition on lying as an ontological necessity grounded in the unity of the heart and tongue, his exegesis of hard cases in Contra Mendacium reveals that the prohibition's absolute force relies entirely on an eschatological calculus. This creates a structural tension: the doctrine claims to be independent of outcomes, yet it is defended by weighing the outcome of eternal reward against temporal loss. Consequently, Augustine's absolutism is not a pure ethic of speech, but a subordinate clause of his soteriology."*

  This formulation acknowledges the sophistication of his system (it's not a simple mistake) while pinpointing the vulnerability (it collapses if the soteriology is rejected or interpreted differently). It respects the text while maintaining your critical edge.
