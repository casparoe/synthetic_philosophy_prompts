      *   *Section 3: The Carnapian Irony.* This is the crux. Yudkowsky applies the method to dissolve metaphysics (Free Will). Chalmers applies the method to *save* metaphysics (Consciousness). Yudkowsky is the "folk Carnapian." Chalmers is the "technical Anti-Carnapian using Carnapian tools."
