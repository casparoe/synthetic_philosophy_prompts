answer: |-
  The ink in the pot had skinned over twice before Humphrey was permitted to dip his quill again. It was January, 1690, and the fire in Mr. Newton's chambers at Trinity had burned down to a sullen red eye, offering heat but no comfort. Humphrey sat at the small table near the window, his fingers stiff inside woolen gloves with the tips cut away, watching the master pace.

  Newton did not walk like a man who had unlocked the machinery of the heavens. He walked like a man being hunted.

  "Leave the line," Newton said, stopping abruptly behind Humphrey's chair. He pointed a long, pale finger at the page. "Do not copy the clause. Leave a gap."

  Humphrey blinked at the Greek text spread before them. It was a collation of epistles, but not like any liturgy Humphrey had heard in the chapel. "Sir? The scribe before you wrote it. The Vulgate includes it."

  "The scribe before me was a fool, or a knave," Newton snapped. He leaned in, his breath smelling of stale bread and mercury. "Look at the flow. The syntax breaks. It is a stone dropped into a stream where no stone should be. *The Father, the Word, and the Holy Ghost.*" He spat the words as if they were bones. "It does not belong. It is a graft."

  Humphrey dipped his pen, hesitating. To leave a gap in scripture was to invite the devil to fill it. But to argue with Isaac Newton was to argue with the gravity that held the moon in its orbit. He skipped the line.

  For weeks, the rooms had been thick with this strange, feverish industry. The *Principia* was done, the great system of the world bound in leather and resting on the shelf, yet Newton seemed less interested in the planets than in the dust of the early Church. He treated the Bible as he treated the prism: a thing of common appearance that concealed a hidden spectrum. He sought the true light beneath the refraction of centuries.

  "Locke will see it," Newton muttered, more to the fire than to Humphrey. "He has the sense to distinguish the substance from the shadow."

  Humphrey knew the name. Mr. John Locke, currently in exile on the Continent. A dangerous man to be associated with, though Newton seemed to think him a safe harbor.

  "Is this for publication, sir?" Humphrey asked quietly.

  Newton turned. His eyes were wide, the pupils dilated in the dim room. "It is for the truth. Does it matter where it lands?"

  "It matters if the College hears it, sir."

  Newton flinched. The mention of Trinity College was a physical blow. To hold his fellowship, to keep his rooms and his income, Newton was required to assent to the Thirty-Nine Articles. He was required to swear to the very doctrine he was currently dissecting with the cold precision of a surgeon removing rot.

  "Prepare the packet," Newton said, ignoring the warning. "Seal it. You will take it to the courier."

  Humphrey stood and began to gather the sheets. They were covered in Newton's tight, furious script. Arguments from Athanasius. Comparisons of Latin and Greek manuscripts. The dissection of 1 Timothy. It was a bomb wrapped in paper. As Humphrey stacked them, he felt the weight of the heresy. It wasn't just that Newton doubted; it was that he had *calculated* the doubt. He had found the error in the equation of God.

  Newton moved to the window, looking out at the dark courtyard. "The world is full of noise, Humphrey. Men build systems upon systems to explain the motion of things. They invent forces where there are none. They invent persons where there is only One." He turned back, his face gaunt. "I have stripped the apple to its core. I must strip the faith to theirs."

  Humphrey tied the ribbon around the bundle. "Shall I address it to Mr. Locke?"

  "Yes. Amsterdam."

  Humphrey took the packet. It felt hot in his hands. He moved toward the door, expecting the usual dismissal. Instead, Newton's voice stopped him, brittle as ice.

  "Wait."

  Humphrey turned. Newton had not moved from the window, but his posture had collapsed. The rigid energy that had sustained him through the night had drained away, leaving him looking old and terribly fragile.

  "Sir?"

  Newton walked slowly to the desk. He ran a hand over the blank space Humphrey had left on the copied page. "If I send this... if it prints..."

  "You wished it anonymous, sir."

  "Anonymous is a thin veil." Newton began to pace again, but slower now. "Stillingfleet. The bishops. They are watching Locke. They smell sulphur on anything he touches. If this tract appears... they will not look at the Greek. They will look at the author. They will look at Trinity."

  He stopped and looked at Humphrey. For the first time, the young scribe saw fear in the great man's eyes. It was not a fear of hell, but a fear of irrelevance. If he was cast out, he could not work. If he lost the College, he lost the library, the quiet, the alchemy equipment, the refuge where he could search for the hidden order of things.

  "The truth," Newton whispered, "requires a vessel capable of holding it. I am... I am not that vessel."

  "Sir?"

  "I have calculated the orbits," Newton said, his voice trembling slightly. "I know how the light bends. But I cannot bend the world to fit the truth. The world is not a vacuum. It is full of air. It resists."

  He reached out and took the packet from Humphrey's hands. He held it over the fire. Humphrey stopped breathing. For a moment, the flames licked at the edge of the paper, threatening to consume the months of labor, the dangerous conclusion that Christ was divine but not co-eternal, that the Trinity was a corruption grafted onto the church by councils of men, not God.

  Newton pulled it back. He did not burn it. He could not destroy the work, but he could not release it.

  "Put it in the chest," Newton said.

  "Sir?"

  "The iron chest. With the alchemy. Lock it."

  Humphrey hesitated. "And the courier?"

  "Tell him the road is impassable. Tell him I am ill. Tell him anything." Newton turned his back, facing the wall where a map of the Temple of Solomon hung pinned. "It is not the time. The time is... corrupted."

  Humphrey moved to the large iron-bound box in the corner. He unlocked it. Inside lay jars of strange powders, notes on the philosopher's stone, and now, the textual criticism that would have shattered Newton's reputation. He placed the packet inside. It slid against the metal with a dry whisper.

  As he turned the key, Humphrey realized the terrible symmetry of the man. In physics, Newton had shown that the visible world was governed by invisible laws. In theology, he had found that the visible Church was governed by invisible corruptions. But where he had published the laws of motion, he would bury the laws of God.

  He locked the chest. The sound echoed loudly in the small room.

  Newton did not turn around. "You will say nothing of this, Humphrey. Not to your confessor. Not to your mother. Not when I am dead."

  "I understand, sir."

  "The world wants a idol," Newton said to the wall. "It wants a rational man who prays as he is told. Do not give them the measure of the man."

  Humphrey extinguished the candle on the side table, leaving only the firelight. The room settled into shadow. The gap on the copied page remained, a white wound in the text where the Trinity should have been.

  "Will you write to Mr. Locke?" Humphrey asked.

  "I will write to tell him the manuscript is lost," Newton said. "That it was mislaid in the post. A fiction to preserve a truth."

  He sat heavily in his high-backed chair, pulling a blanket over his knees. He looked like a statue eroding. Humphrey gathered his own things, moving quietly. He understood now that the silence was not an absence of sound, but a structure. It held the room together. It held Newton's life together.

  As Humphrey opened the door to leave, the cold air from the corridor rushed in, disturbing the papers on the desk. Newton flinched, reaching out to hold them down, protecting the scattered sheets from the wind.

  "Close it softly," Newton said.

  Humphrey pulled the door until the latch clicked. He stood in the dark corridor for a moment, listening. There was no sound from within. No scratching of the quill, no pacing. Just the silence of a man who had found the answer and chosen to live with the question.

  Humphrey walked down the stone stairs, his breath pluming in the cold. Above him, in the darkened rooms, the iron chest sat heavy and locked, holding the weight of a truth that would not see the light for another century. The world would continue to pray to a Trinity Newton knew was false, and the man who knew better would continue to calculate the mind of God, careful never to speak His true name.
