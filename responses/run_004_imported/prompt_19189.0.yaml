          *   *Crucial Point:* Blue is now "more uncertain" (uniform) than Red (skewed). MinXEnt favors higher entropy states when minimizing information gain from the prior. Since Blue retained its prior uniformity and Red became skewed, Blue becomes relatively more attractive.

