      *   *Why is this rational?* Because probability mass should flow toward states of higher uncertainty (entropy) when we are minimizing information gain. We know less about Blue (it's still flat) than Red (it's peaked). Therefore, we should bet more on Blue.
      *   *Wait, check that intuition:* Usually, we bet on high probability. But here we are updating from a uniform prior. The "information gain" is the cost. Moving mass to the uniform region costs less "information" than concentrating it in the peaked region?
