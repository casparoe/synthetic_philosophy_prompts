      *   *Point 3: Forms of Life (The Hammer).* This is the dealbreaker. Language games are rooted in natural human behavior (reacting to pain, pointing, needing). LLMs have no needs, no body, no natural history. Therefore, their "moves" in the language game are unanchored.
