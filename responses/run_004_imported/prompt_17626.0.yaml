answer: |-
  Your friend has raised a sophisticated objection that relies on a specific, well-known philosophical critique. However, her argument rests on an incomplete reading of Karl Popper and a somewhat rigid understanding of what constitutes "science."

  The short answer is: **No, she was not right to treat Popper's remark as settling the matter.** In fact, Popper later explicitly retracted the very criticism she is citing. Furthermore, modern philosophy of science generally recognizes that evolutionary biology meets the criteria for scientific inquiry, even if its methods differ from those of theoretical physics.

  Here is a breakdown of how you might respond to the three core components of her argument: Popper's actual view, the "tautology" charge, and the standard of falsifiability itself.

  ### 1. Popper Changed His Mind
  Your friend is correct that in his 1974 intellectual autobiography, *Unended Quest*, Popper expressed skepticism about natural selection. He wrote that Darwinism was not a testable scientific theory but a "metaphysical research programme." He worried that "survival of the fittest" was tautological (i.e., *Who survives? The fit. Who are the fit? Those who survive.*).

  However, **Popper later corrected this view.** In a 1978 lecture titled "Natural Selection and the Emergence of Mind," delivered at a Darwin centennial symposium, Popper explicitly changed his position. He stated:

  > "I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."

  Popper came to recognize that while the *logic* of natural selection could be framed tautologically, the *biological theory* makes empirical claims about heredity, variation, and environmental pressure that are testable. Using Popper's 1974 comment as the final word ignores his 1978 correction. Intelligent Design advocates often cite the 1974 quote while omitting the recantation, a tactic philosophers of science refer to as "quote-mining."

  ### 2. The "Tautology" Objection is Solvable
  The charge that "survival of the fittest" is a tautology is a classic objection, but biologists and philosophers have long since resolved it.

  The objection assumes that "fitness" is defined *only* by survival. If that were true, the statement would indeed be circular. However, in evolutionary biology, fitness is defined as a **probabilistic propensity** based on specific, measurable traits.

  *   **Independent Measurement:** We can measure an organism's traits (e.g., camouflage coloration, running speed, enzyme efficiency) *independently* of whether it survives.
  *   **Prediction:** The theory predicts that organisms with Trait A will have a higher reproductive success rate than those with Trait B in Environment X.
  *   **Falsification:** If we observe that organisms with Trait A consistently fail to reproduce more than those with Trait B in Environment X, the hypothesis is falsified.

  For example, if we claim that dark-colored moths are "fitter" in soot-covered forests because they are better camouflaged, we can test this. If dark moths were eaten at higher rates than light moths in that environment, the theory would be falsified. Because the traits can be defined and measured independently of the outcome, the theory is not a tautology.

  ### 3. Is Falsifiability the Right Standard?
  Your friend's deeper point is about whether evolutionary biology is science "in the way physics is." This touches on the demarcation problem (what separates science from non-science).

  **Physics Envy:**
  There is a tendency to view theoretical physics as the "gold standard" of science. Physics often deals with universal, ahistorical laws (e.g., gravity operates the same way everywhere). Evolutionary biology, like geology and cosmology, is a **historical science**. It deals with contingent, unique events (e.g., the extinction of the dinosaurs, the split of hominids).

  Judging a historical science by the standards of experimental physics is a category error. Historical sciences rely on **inference to the best explanation**. They make predictions about what evidence *should* exist in the present if a certain past event occurred.
  *   **Evolutionary Prediction:** If whales evolved from land mammals, we should find transitional fossils with specific ankle bone structures in rock layers from the Eocene epoch.
  *   **The Test:** *Pakicetus* and *Ambulocetus* were discovered exactly where and when evolutionary theory predicted they would be. This is a risky prediction that could have been wrong.

  **Beyond Popper:**
  Most contemporary philosophers of science agree that Popper's falsifiability criterion, while useful, is too simplistic to describe how science actually works.
  *   **Lakatos:** Philosopher Imre Lakatos argued that sciences are "research programmes." A programme is scientific if it is "progressive" (predicting novel facts) rather than "degenerating" (making ad-hoc excuses to explain away anomalies). Evolutionary biology is highly progressive; it consistently generates new lines of inquiry in genetics, medicine, and ecology.
  *   **Bayesian Confirmation:** Modern science often uses Bayesian reasoning, where evidence increases the *probability* of a theory being true, rather than strictly falsifying it in one blow.

  ### Summary for Your Next Dinner
  You can tell your friend that her objection is historically grounded but philosophically outdated.
  1.  **Popper recanted:** He admitted evolutionary theory is testable.
  2.  **Fitness isn't circular:** Traits are measured independently of survival.
  3.  **Biology isn't Physics:** Historical sciences use different but equally rigorous methods (predicting evidence) than experimental physics.
  4.  **ID fails the test:** Unlike evolution, Intelligent Design does not make risky, specific predictions about what we will find in the fossil record or genome.

  Evolutionary biology is not "physics," but that doesn't make it less scientific. It makes it a robust, distinct discipline that meets all modern criteria for scientific inquiry.
