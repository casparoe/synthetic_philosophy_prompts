answer: |-
  **MEMORANDUM**

  **TO:** Graduate Research Council
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Resolution of Cycle [X] Tie and Policy on Near-Tie Adjudication

  **Purpose**

  This memo addresses the impasse regarding the two tied proposals in the current grant cycle (Proposal A and Proposal B) and proposes a standing policy for handling similar situations in future competitions. As we approach Friday's meeting to finalize results, we must reconcile our existing tie-breaking mechanism with the methodological argument raised regarding Harsanyi's Aggregation Theorem.

  **Recommendation for Current Cycle**

  I recommend that the Council **proceed with the lottery** to resolve the tie between Proposal A and Proposal B.

  While the methodological weakness flagged in Proposal B is noted, it was already within the purview of the peer reviewers. The fact that Proposal B achieved a score equal to Proposal A indicates that the review committee, in aggregate, judged the weakness insufficient to differentiate the proposals' overall merit or expected impact. To override the tie based on a qualitative re-weighing of a known factor undermines the scoring rubric we established to ensure consistency.

  **Proposed Policy for Future Cycles**

  To prevent similar ambiguities, I propose we adopt a **"Threshold of Distinguishability"** policy:

  1.  **Definition of a Tie:** A tie is declared when proposals fall within a predefined score margin (e.g., within 2 points) or when reviewers explicitly recommend a tie due to incommensurable strengths.
  2.  **Adjudication:** Once a tie is declared, the lottery mechanism is binding.
  3.  **Exception Clause:** Post-review qualitative arguments may only override the lottery if they reveal *new* information regarding eligibility, ethical compliance, or budgetary feasibility that was not available to reviewers during the scoring phase. Methodological preferences already visible during review cannot be used to break the tie.

  **The Argument for Maximization (Fair Hearing)**

  It is essential that we give serious weight to the argument presented by our colleague invoking Harsanyi. The core of this argument is that the Council has a fiduciary and ethical duty to maximize the expected social return on research funds.

  If we accept that Proposal A has a genuinely higher expected payoff than Proposal B—even modestly—then a lottery is not an act of fairness, but an act of waste. From the perspective of Expected Utility Theory, randomization is only rational when the decision-maker is truly indifferent (i.e., the expected utilities are exactly equal). If there is *any* detectable asymmetry in quality, Harsanyi's theorem suggests that a rational social planner should aggregate individual judgments to maximize total welfare. By randomizing, we are effectively accepting a lower expected value for the university's research output. If our review process is capable of detecting a methodological weakness, proponents argue we are obligated to act on that detection rather than hiding behind a procedural coin flip. To do otherwise treats the grant as a prize for the applicant rather than an investment in research.

  **Rationale for Recommendation**

  While the maximization argument is theoretically sound in contexts of risk (where probabilities are known), peer review operates under conditions of **ambiguity and measurement error**.

  1.  **Epistemic Limits:** Our use of the lottery was originally adopted precisely because reviewer scoring is noisy. We acknowledged that we cannot reliably distinguish between proposals separated by marginal differences. If a methodological weakness does not drive a score difference, it implies that the weakness is within the "noise" of the evaluation process.
  2.  **Category Error:** Harsanyi's theorem applies when individual utility functions are well-defined and aggregated. In our context, the "utility" (research impact) is not known; it is estimated. The score *is* the estimate of expected value. If the scores are tied, the Council has already mathematically determined that the expected values are statistically indistinguishable.
  3.  **Procedural Integrity:** Allowing post-hoc qualitative arguments to override the lottery creates a slippery slope. If any detectable asymmetry justifies skipping the lottery, the lottery will never be used. This disadvantages applicants whose proposals may have minor stylistic or methodological quirks that appeal to some reviewers but not others, reintroducing the bias the lottery was meant to mitigate.

  **Next Steps**

  I request that we vote on the motion to proceed with the lottery for this cycle at Friday's meeting. Following that, I ask that we schedule time to formally adopt the "Threshold of Distinguishability" policy for the next grant cycle.

  Thank you for your consideration.
