answer: |-
  This is not a scholastic quibble. It is a distinction that determines whether your headline reads "Climate Change Caused This Flood" or "Climate Change Loaded the Dice for This Flood." While the scientists themselves often use the word "counterfactual" (referring to the model run without emissions), your friend is correct that the *logical justification* for their method is interventionist. They are not peering into metaphysical alternate realities; they are turning a dial in a simulation to see how the system responds.

  Adopting the interventionist frame (Woodward/Pearl) over the Lewisian possible-worlds frame changes the epistemic status of attribution science in two critical ways for a journalist: it limits the claim to **causal structures rather than singular histories**, and it clarifies the gap between **risk and liability**.

  Here is how that distinction should shape your reporting on the numbers and the legal implications.

  ### 1. The Epistemic Weight of the Headline Number ("4x More Likely")

  **The Lewisian Trap:**
  If you interpret the study through a David Lewis lens, the "counterfactual world" feels like a shadow history. The intuition becomes: *In the nearby possible world where humans didn't burn carbon, this specific flood did not happen.* This tempts readers (and writers) to treat the "4x more likely" statistic as a verdict on the **token event** (this specific flood). It suggests a strong claim about what *actually* happened in history: that this event is, in essence, a child of climate change.

  **The Interventionist Reality:**
  Under the Woodward/Pearl picture, the "counterfactual" is just a control group in a simulation. The claim is not about the specific history of this storm, but about the **invariance of the relationship** between greenhouse gases (the intervention) and extreme weather (the outcome).
  *   **What changes:** The number "4x" describes the behavior of the *climate system*, not the necessity of the *event*. It tells us that if we intervene on the GHG variable, the probability distribution of floods shifts.
  *   **Reporting Implication:** You should treat the headline figure as a measure of **system sensitivity**, not event necessity.
      *   *Avoid:* "Climate change made this flood happen." (This implies singular causation.)
      *   *Prefer:* "Climate change shifted the odds of this type of flood." (This describes the intervention on the distribution.)
      *   *Why:* An interventionist claim acknowledges that the flood *could* have happened in the pre-industrial simulation (the control group), just less often. The "4x" figure quantifies the change in the *process*, not the origin of the *product*. This prevents readers from assuming that without climate change, the region would have been dry that week. It might have flooded anyway; the interventionist claim is just that the *risk* is now structurally higher.

  **Actionable Advice:** When reporting the "Fraction of Attributable Risk" (FAR) or risk ratios, explicitly frame them as properties of the **climate model's response**, not a reconstruction of history. Use phrases like "In model simulations where we remove human emissions..." rather than "In a world without climate change..." The former highlights the method (intervention); the latter invites metaphysical speculation (possible worlds).

  ### 2. Causal Responsibility in Law and Policy (Loss-and-Damage)

  This is where the distinction becomes legally material. Tort law and loss-and-damage negotiations generally require **specific causation** (a Lewisian "but-for" test: *But for the defendant's action, would this harm have occurred?*). Attribution science, grounded in interventionism, provides **general causation** (Does this factor reliably produce this type of harm?).

  **The Lewisian Expectation:**
  Litigants and policymakers often hear "attribution" and think Lewis. They want to know: *Is this specific disaster the fault of carbon emitters?* They are looking for a singular causal chain linking Exxon or the Global North to *this* village flooding *now*.

  **The Interventionist Limit:**
  Interventionism justifies the claim that GHGs are a **difference-maker** for the *class* of events. It establishes that manipulating the GHG variable changes the frequency/intensity of floods. However, it does not trace the specific trajectory of *this* storm.
  *   **The Gap:** You can establish that a defendant increased the *risk* (interventionist general causation) without being able to prove that the defendant caused *this specific instance* (Lewisian specific causation). In a "but-for" world, if the flood had a 20% chance of happening naturally, a lawyer can argue "It might have happened anyway."
  *   **Reporting Implication:** Be extremely precise when covering lawsuits or loss-and-damage funds. Do not conflate "scientific attribution" with "legal liability."
      *   *Avoid:* "Science proves Climate Change caused this loss." (Implies legal 'but-for' causation is settled.)
      *   *Prefer:* "Science confirms human emissions significantly increased the risk of this loss." (Confirms the structural link, leaves the legal 'but-for' argument open.)
      *   *Why:* Interventionism supports the idea that emitters are responsible for the **increased risk burden**, even if they aren't the sole "but-for" cause of the specific event. This is a crucial nuance for policy. It suggests liability should be based on **risk creation** rather than **event creation**.

  **Actionable Advice:** When covering litigation, explicitly explain the "General vs. Specific" causation gap. You can write: *"While attribution science confirms that emissions make floods like this more probable (general causation), courts often require proof that this specific flood would not have occurred without those emissions (specific causation)."* This protects your readers from misunderstanding why a strong scientific report doesn't automatically guarantee a legal win.

  ### Summary: How to Write Differently

  The shift from Lewis to Woodward/Pearl moves you from **metaphysics** to **mechanics**.

  1.  **On the Numbers:** Treat "4x more likely" as a measure of **how much the dice are loaded**, not a verdict on **how the dice fell**. The science justifies claims about the *casino* (the climate system), not necessarily the *hand* (the specific storm).
  2.  **On Liability:** Treat attribution as evidence of **risk imposition**, not necessarily **event origination**. This supports arguments for compensation based on "increased vulnerability" rather than strict "but-for" liability.

  Your friend's pushback is a gift. It allows you to report on attribution science with more modesty and more precision. You don't need to promise readers that science can reconstruct alternate histories (Lewis); you only need to show them that science can measure how much we are manipulating the current one (Woodward). That is a claim the data can actually support.
