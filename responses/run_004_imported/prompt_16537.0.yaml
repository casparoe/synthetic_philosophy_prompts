prompt: |-
  I own a unit in a small condominium building a few blocks from campus that has, over the last decade, become housing mostly for graduate students and postdocs: roughly two-thirds of the units are owned by investors who live elsewhere and rent them out on ordinary leases, while a handful of owners, myself included, actually live in the building full-time. Under our bylaws, only unit owners are members of the association, one vote per unit regardless of who actually lives there, and at next month's meeting the board will vote on a proposed rule banning short-term, Airbnb-style rentals, on the grounds that constant turnover has increased noise, security concerns, and wear on the elevators and common areas. The people who will feel the day-to-day consequences of this rule most directly are the long-term tenants, who deal with the noise and the rotating strangers in the hallway right now and could see their rents rise later if the building becomes a more attractive long-term-rental property as a result of the policy, but tenants have no vote of any kind under the bylaws, and only the owners, several of whom have never spent a single night in the building, get to decide.

  I raised this at a dinner with colleagues recently and was struck that everyone had a confident but different reaction. One person said the tenants obviously have a legitimate claim to some say, since they bear most of the real costs of the decision either way. Another said this is a non-issue: the tenants agreed to a lease under known rules, are free to leave if they dislike how the owners vote, and have no more claim to co-govern the building than a hotel guest has to vote on hotel policy. A third pointed out that if "whoever is substantially affected should get a say" is the right standard, we would also have to think about the residents of the building next door, who share our courtyard and complain about the very same noise, and maybe even the university's off-campus housing office, which steers many of these tenants to us in the first place and has its own stake in the policy. My own instinct is that the tenants are owed something the neighbors and the housing office are not, but when I try to say exactly why, without just presupposing the answer, I keep failing. My own field is philosophy of science, so this isn't a debate I have ready-made tools for from my teaching or research, but it has been nagging at me all week.

  So I would like your take. Is there something genuinely unfair about a policy like this being decided entirely by the owners, or is "you knew the deal when you signed the lease" actually a complete answer, full stop? And if you think the tenants really are owed a vote, or at least a voice, is there a principled way to say how far that reasoning should extend, one that does not simply amount to the current owners generously deciding, on their own authority, how generous to be?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Scenario:**
      *   **Context:** Small condominium building near a university campus.
      *   **Demographics:** Mostly grad students/postdocs (tenants). 2/3 units owned by absentee investors, 1/3 owner-occupied (including the user).
      *   **Governance:** Condo association bylaws give voting rights *only* to owners (one vote per unit). Tenants have no vote.
      *   **Issue:** Proposed ban on short-term (Airbnb-style) rentals.
      *   **Rationale for Ban:** Noise, security, wear/tear (negative externalities of turnover).
      *   **Stakeholders:**
          *   *Owners (Voters):* 2/3 absentee investors (financial interest), 1/3 residents (financial + quality of life).
          *   *Tenants (Non-voters):* Bear the brunt of current noise/turnover, might face rent hikes if building becomes more desirable/stable.
          *   *Neighbors (Non-voters, Non-tenants):* Share courtyard, affected by noise.
          *   *University Housing (Non-voters, Non-tenants):* Steers students there, has institutional interest.
      *   **The User's Dilemma:** Intuitively feels tenants deserve a voice more than neighbors/university, but struggles to articulate *why* without begging the question. Wants to know if "you signed the lease" is a sufficient moral defense or if there's a principled argument for tenant inclusion that avoids arbitrary generosity.
      *   **User's Background:** Philosophy of science (used to conceptual rigor, definitions, avoiding presuppositions).

  2.  **Analyze the Core Ethical/Political Question:**
      *   **Property Rights vs. Affected Interests:** The conflict is between the legal/contractual rights of ownership (the "liberal" property view) and the democratic principle of "all affected interests" (the "republican/democratic" view).
      *   **The "Hotel Guest" Analogy:** Is a long-term tenant more like a hotel guest or a citizen?
      *   **The "Boundary Problem":** If we say "affected parties get a vote," where do we draw the line? (Hence the neighbor/university objection).

  3.  **Evaluate the "You Signed the Lease" Argument:**
      *   *Strength:* Contractual clarity. Tenants exchanged money for use, not governance. Market exit option exists (move out).
      *   *Weakness:* Power asymmetry. Housing is a basic need, not a luxury good like a hotel. Transaction costs of moving are high. The "rules" (bylaws) can change *during* the lease term or upon renewal, effectively changing the deal retroactively regarding quality of life.
      *   *Verdict:* It's a *legal* answer, but not necessarily a *moral* or *political* one. It treats housing as pure commodity, ignoring its role as a home.

  4.  **Develop a Principled Argument for Tenant Voice (without over-extending):**
      *   *Goal:* Distinguish tenants from neighbors/university.
      *   *Key Distinction 1: Duration and Integration.* Tenants live there. Neighbors visit/adjacent. University administers. Tenants constitute the *community* of daily life.
      *   *Key Distinction 2: Subjection to Authority.* Tenants are subject to the rules *inside* the private sphere (their home), whereas neighbors are affected by externalities spilling *out*.
      *   *Key Distinction 3: Exit Costs.* "Freedom to leave" is theoretically true but practically costly. This creates a "lock-in" effect similar to citizenship.
      *   *Theoretical Framework:* "Stakeholder Citizenship" or "Residency-based Rights." The idea that governance rights attach to *habitation*, not just *title*.

  5.  **Address the "Boundary Problem" (Neighbors/University):**
      *   Why not neighbors? They are affected by *externalities*, not *internal governance*. They don't live under the rules, they just suffer the spill-over. Remedy: Tort law/Zoning, not voting rights in the HOA.
      *   Why not University? They have an institutional interest, not a lived experience. They are a stakeholder, but not a *subject* of the rule.
      *   *Principle:* The right to a voice tracks with *subjection to the normative order* of the community, not just *impact* from its outcomes.

  6.  **Synthesize the Argument:**
      *   Acknowledge the legal reality (owners own).
      *   Challenge the moral sufficiency of "contract."
      *   Propose the "Home as Polity" distinction.
      *   Differentiate between *impact* (neighbors) and *subjection* (tenants).
      *   Suggest practical middle grounds (advisory boards, tenant reps) rather than full voting rights (which might require bylaw changes).

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Philosophical, analytical, respectful of the user's background. Avoid preaching.
      *   *Structure:*
          1.  Validate the intuition (it's a classic political philosophy problem).
          2.  Critique the "Contract/Hotel" view (housing isn't a hotel).
          3.  Critique the "All Affected" view (too broad).
          4.  Propose the "All Subjected" principle (the sweet spot).
          5.  Apply to the specific case (Tenants vs. Neighbors vs. University).
          6.  Practical implications (Voice vs. Vote).

  8.  **Refining the "All Subjected" Principle:**
      *   This is the crucial philosophical move.
      *   *Affected:* Anyone impacted (Neighbors, University).
      *   *Subjected:* Anyone who must obey the rules (Tenants, Owners).
      *   This explains why tenants are different from neighbors. Neighbors deal with noise (tort/nuisance), tenants deal with *rules of living* (governance).
      *   This explains why tenants are different from the University. University has interest, but doesn't *live* there.

  9.  **Addressing the "Unfairness":**
      *   Is it unfair? Yes, if we view the condo as a mini-polity rather than a pure investment vehicle.
      *   The "Investor" complication: Absentee owners treat it as capital. Resident owners/tenants treat it as home. This creates a conflict of *telos* (purpose).

  10. **Final Polish:** Ensure the distinction between "Vote" (legal power) and "Voice" (procedural inclusion) is clear, as changing bylaws is hard, but changing meeting procedure is easier.

  **(Self-Correction during drafting):** I need to make sure I don't just say "tenants should vote." The user asked if there's a *principled way* to define the boundary. I need to focus heavily on the *principle* that distinguishes tenants from neighbors. The "All Subjected Principle" is the standard political philosophy tool for this. I should also mention the difference between *property rights* and *occupancy rights*.

  11. **Final Review against User Prompt:**
      *   Did I answer if it's unfair? Yes.
      *   Did I address the "lease" argument? Yes.
      *   Did I address the boundary problem (neighbors/university)? Yes.
      *   Did I avoid presupposing the answer? Yes, by deriving it from political theory principles.

