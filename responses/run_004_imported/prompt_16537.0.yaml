answer: |-
  This is a classic problem in political philosophy and legal theory, disguised as a mundane HOA dispute. You are grappling with the tension between **property rights** (the liberal conception of ownership) and **democratic legitimacy** (the republican conception of governance).

  Your intuition that the "you signed the lease" argument is insufficient, but also that the "everyone affected gets a vote" argument is too broad, is philosophically sound. To resolve this without begging the question, we need to distinguish between being *affected by* a decision and being *subjected to* a rule.

  Here is a breakdown of why the current arrangement is morally precarious, why the "hotel guest" analogy fails, and how to draw a principled boundary that includes tenants but excludes the neighbors and the university.

  ### 1. Why "You Signed the Lease" Is Not a Complete Answer
  The argument that tenants have no claim because they agreed to a contract rests on the idea that a lease is a purely commercial transaction, akin to buying a ticket to a hotel or a cinema. This view treats the unit as a **commodity**.

  However, housing is distinct from other commodities because it is the **site of social reproduction**. It is where people sleep, store their belongings, receive mail, and establish their legal domicile. When you rent a home for a year, you are not just purchasing a service; you are submitting to a **normative order**.

  *   **The Hotel Analogy Fails:** A hotel guest is transient. They do not establish a life there. Their relationship to the space is purely consumptive. A long-term tenant, however, integrates into the building's social fabric. They deal with the trash chutes, the mailroom, the neighbors, and the quiet hours.
  *   **The Exit Option is Costly:** The claim that tenants are "free to leave" ignores transaction costs. Moving is expensive, time-consuming, and disruptive. In a tight university housing market, the "freedom to exit" is often theoretical. When exit is costly, voice becomes necessary for legitimacy.
  *   **Retroactive Rule Changes:** While the lease sets terms, the *environment* of the lease is governed by the HOA. If the HOA allows Airbnb, the tenant signed up for a building with transient strangers. If the HOA bans it, the building changes character. If the HOA raises fees to pay for new security, the cost might be passed to owners, who pass it to tenants. The tenants are subject to the *consequences* of governance without access to the *mechanisms* of governance.

  Therefore, the lease grants a right of **occupancy**, but it does not morally resolve the question of **governance**.

  ### 2. The Boundary Problem: Tenants vs. Neighbors vs. University
  Your third colleague raises the "boundary problem": If we give a vote to everyone affected, where does it stop? To solve this, political philosophers often distinguish between the **All-Affected Principle** and the **All-Subjected Principle**.

  *   **The All-Affected Principle:** Anyone impacted by a decision should have a say.
      *   *Problem:* This is too broad. As your colleague noted, the neighbors are affected by noise. The university is affected by housing availability. Even the local coffee shop is affected by how many grad students live there. This leads to an infinite regress of stakeholders.
  *   **The All-Subjected Principle:** Anyone who is *coerced* by or *required to obey* the rules of a community should have a say in making them.
      *   *Solution:* This draws the line at **subjection to authority**.

  **Applying the All-Subjected Principle:**
  *   **Tenants:** They are **subjected**. They must obey the noise ordinances, the elevator rules, the trash disposal policies, and the guest restrictions. They live under the jurisdiction of the HOA. Therefore, they have a prima facie claim to a voice.
  *   **Neighbors:** They are **affected**, but not **subjected**. They do not have to follow your HOA bylaws. If your tenants make noise, the neighbors have a claim under *tort law* or *municipal zoning* (nuisance), but they do not have a claim to vote on your internal budget or rental policies. Their remedy is external regulation, not internal governance.
  *   **University Housing Office:** They are **interested**, but neither **affected** (in a bodily sense) nor **subjected**. They have an institutional stake, but they do not live under the rules. Their proper role is advocacy or market pressure, not governance.

  This distinction allows you to argue that tenants deserve a voice *not* because they are sensitive to noise (like the neighbors), but because the HOA rules constitute the **law of their daily lives**.

  ### 3. The Conflict of Telos (Purpose)
  There is a deeper unfairness here regarding the *purpose* of the building.
  *   **Absentee Owners:** For 2/3 of the voters, the unit is primarily **capital**. Their interest is ROI (Return on Investment). They may prefer short-term rentals if they yield higher income, even if it degrades quality of life, because they don't experience the degradation.
  *   **Resident Owners & Tenants:** For you and the tenants, the unit is primarily **habitat**. Your interest is stability, quiet, and community.

  When the voting rights are skewed toward capital (absentee investors) rather than habitation (residents), the governance structure incentivizes decisions that maximize financial extraction at the expense of lived experience. It is arguably unfair for a group that does not inhabit the space to dictate the terms of inhabitation for those who do. This is a form of **taxation (or regulation) without representation**.

  ### 4. Voice vs. Vote: A Principled Compromise
  You asked if tenants are owed a *vote*. Legally, your bylaws likely prevent this without a difficult amendment process (which the investors might block). However, morally, they are owed a **voice**.

  A principled approach that avoids arbitrary generosity would be to institutionalize **Tenant Advisory Status**.
  *   **Why:** This acknowledges the "All-Subjected" principle without violating the "Property Rights" principle.
  *   **How:** The HOA could invite a tenant representative to attend meetings, speak during discussions, and serve on committees (like the rules committee), even if they cannot cast the final ballot on financial matters.
  *   **The Limit:** This respects the owners' ultimate financial liability (they pay the mortgages and taxes) while respecting the tenants' moral right to not be governed without consultation.

  ### 5. Conclusion: Is it Unfair?
  Yes, it is genuinely unfair for a policy with such profound impacts on daily life to be decided entirely by people who do not live there, based on a contract that tenants could not negotiate (standard leases) and cannot easily escape (housing scarcity).

  The "you knew the deal" argument assumes a level of market freedom and contractual symmetry that does not exist in residential housing.

  **The Principled Stand:**
  You can argue for tenant inclusion without collapsing into "everyone gets a vote" by anchoring your argument in **subjection to the normative order**.
  1.  **Neighbors** suffer externalities (noise); their remedy is public law (zoning/police).
  2.  **Tenants** suffer internal governance (rules); their remedy is private politics (HOA voice).
  3.  **Owners** hold title and liability; they retain the final vote.

  This creates a bicameral feel: Owners hold the **property interest**, but Residents (owners + tenants) hold the **occupancy interest**. A policy that ignores the occupancy interest in favor of the property interest is democratically deficient, even if it is legally sound.

  You might propose that while the *vote* remains with owners, the *process* requires a tenant hearing. This honors the investors' legal rights while acknowledging the tenants' moral standing as members of the community, not just revenue streams.
