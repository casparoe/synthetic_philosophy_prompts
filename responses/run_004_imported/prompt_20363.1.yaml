prompt: |-
  Okay so this is a real thing I need help with, not just a hypothetical. I'm the student rep on my school's science fair research review committee (its me and two teachers, we have to sign off on projects before they're allowed to go to regionals), and theres a proposal thats splitting the committee. A girl in my grade wants to test whether hermit crabs will abandon a perfectly good shell to escape a mild electric shock, and whether that threshold changes if she numbs them first with benzocaine gel, basically to argue their reaction counts as "real pain" and not just a reflex, sort of like those crab/crayfish pain studies that get mentioned in AP Bio. The annoying part is our fair's rules are way stricter for vertebrates (extra forms, a vet basically has to sign off) but crabs are invertebrates, so technically we could just approve it with barely a second look.

  Here's where it turns into an actual argument: Mr. Alvarez, one of the teachers, keeps bringing up Descartes, like how animals are basically just clockwork and their cries don't mean any more than a machine creaking, so ethically theres nothing here to even flag (he even mentioned something about 17th century Cartesians doing cruel stuff to dogs to "prove" this, which is dark but also kind of the point). The other teacher thinks thats ancient history that doesn't survive contact with what the project itself is trying to show, since a crab weighing shock intensity against shell quality sounds like more than a reflex to her. I actually took a philosophy elective last semester where we went over Descartes' whole language-and-automata argument, and I don't think its as easy to wave off as either of them are treating it, tbh. We vote this Thursday: approve as is, approve with conditions, or send it back for a redesign before the regional deadline in three weeks.

  Could you draft the actual memo I'd bring into that meeting? I need one clear recommendation, not a wishy washy "there are good points on both sides," and I need it to actually engage with what Descartes argued instead of just dismissing him as outdated, while still being fair to whichever side loses. If conditions are the right call, spell out what they'd actually be and by when.
