answer: |-
  The alarm was not a sound but a vibration, a hum that traveled up through the soles of Mara's shoes and settled in her teeth. On the main screen, the telemetry from Probe Seven scrolled in a cascade of green. The numbers were absolute. They were clean. They described a collision that had occurred forty minutes ago, three million miles away.

  *Impact confirmed. Structure compromised. Signal lost.*

  Mara stood before the console. Her hand hovered over the comms switch that would broadcast the loss to Mission Control. This was the protocol. When the data said *lost*, you said *lost*.

  Director Kress entered the room, the heavy door sighing shut behind him. He saw the green cascade. He saw Mara's hand hovering. He did not ask what had happened; the screen was self-evident.

  "Send the packet," Kress said. His voice was flat, stripped of the hope that had kept them awake for the last three cycles.

  Mara's finger pressed the switch. She spoke into the microphone, her voice steady, matching the rhythm of the machine. "Probe Seven is destroyed. The collision event is factual."

  She paused. The protocol required a confidence assessment. Usually, this was a percentage. *Ninety-five percent certainty.* But the room was quiet, and the vibration in her teeth had stopped, leaving a strange hollow silence in her head. She looked at the data. It was irrefutable. To deny it would be madness. To accept it felt like a lie.

  She realized then that she was waiting for a feeling that was not arriving. She was waiting for the internal click, the shift in posture that meant *belief*. When she believed the coffee was hot, she pulled her hand back before touching it. When she believed the bridge was out, she stopped walking. When she believed Probe Seven was gone, she expected to feel a weight in her chest, a closure of the possibility space.

  But the space remained open. The probe was gone, objectively. Yet, in the theater of her mind, it was still transmitting. She could still hear the static of its signal, a ghost limb of data. She knew the signal was dead. She did not *believe* it was dead.

  "Mara?" Kress prompted. "Confidence level?"

  She turned from the console. She looked at Kress, and she looked at the screen. She understood the norms of her position. As the Lead Analyst, her assertion was the bridge between the raw data and the agency's reality. If she said it was true, it became true for everyone. To assert $P$ was to represent oneself as believing $P$. That was the grammar of their work.

  But there was another norm, older and quieter. The norm of sincerity. To represent oneself as having a state one did not possess was a corruption of the self.

  "Confidence is one hundred percent," Mara said. "The proposition 'Probe Seven is destroyed' is true."

  Kress nodded, reaching for the logbook. "Good. Sign off."

  Mara did not move to the book. "I need to amend the statement."

  Kress froze. "The data is clear, Mara. Don't second-guess the telemetry."

  "I am not second-guessing the telemetry. The telemetry is correct. The probe is destroyed." She took a breath. The air in the room felt thin. "But I do not believe it."

  Kress lowered the pen. He looked at her, searching for the crack, the tremor of denial that usually accompanied such a sentence. He found nothing. Her posture was upright. Her eyes were clear. She was not grieving; grief implies an acceptance of loss that she hadn't yet metabolized. She was not in shock; shock implies a temporary inability to process. She was processing perfectly. She was simply reporting a discrepancy between the world and her mind.

  "That's a contradiction," Kress said softly. "If you know it's true, you believe it."

  "I know it is true," Mara said. "I am willing to bet my career on it. I am willing to bet the probe's budget on it. I will act in every way as though it is true. But if you ask me to inspect my doxastic state, the belief is not there. I have the fact. I lack the attitude."

  "So you're saying you're lying to Control?"

  "No. I'm telling them the truth about the probe. And I'm telling you the truth about me."

  Kress rubbed his temples. "This is semantics, Mara. If you act on it, you believe it. That's what belief *is*."

  "Is it?" Mara turned back to the screen. The green numbers continued to scroll, indifferent to her internal architecture. "If I walk across a bridge I know is rotten because I have no choice, do I believe it will hold? Or do I simply accept the proposition for the sake of argument?"

  "This isn't a bridge. This is a loss of assets."

  "It's the same structure," Mara said. "I am asserting: *Probe Seven is destroyed.* And I am asserting: *I do not believe that Probe Seven is destroyed.*"

  The sentence hung in the air. It was not logically inconsistent. It was possible for the probe to be destroyed while Mara's mind remained in a state of suspension. But it felt impossible. It felt like a violation of the contract between language and thought. To say it was to invite a madness that Kress seemed physically unable to touch.

  He picked up the pen again. His hand shook, just once. "I can't log that. The system doesn't have a field for 'True but Unbelieved.'"

  "Then leave it out of the log," Mara said. "But don't ask me to say I believe it. I can assert the fact. I cannot assert the faith."

  Kress signed the page. He didn't look at her. "Get some rest, Mara. We'll review your status tomorrow."

  "I'm not tired," she said. "I'm just... unaligned."

  Kress left the room. The door sighed shut. Mara was alone with the telemetry. She watched the zeros and ones. She knew, with every tool of reason at her disposal, that the machine was silent. She prepared the report for the morning briefing. She would stand before the board and say the words: *It is gone.*

  And she knew that when she opened her mouth, she would also have to say: *I don't believe it.* Not as a plea for help. Not as a confession of error. But as a coordinate. A second point on the map that showed where she was standing.

  She sat in the hum of the servers. She waited for the belief to arrive, to catch up with the truth. It did not come. She did not force it. She simply kept her eyes on the screen, holding the truth in one hand and her own mind in the other, refusing to let them touch.
