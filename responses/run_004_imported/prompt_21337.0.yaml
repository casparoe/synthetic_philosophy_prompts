answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. Two philosophy professors, NAT (Naturalist) and NORM (Normativist), are finishing up a debate that started in the hallway.*

  **Nat:** Look, I get the unease. But the DSM-5-TR didn't just pull Prolonged Grief Disorder (PGD) out of thin air. It meets the biostatistical criteria. There is a clear deviation from species-typical functioning.

  **Norm:** "Species-typical functioning." That phrase does a lot of heavy lifting for you, doesn't it? You're saying grief has an expiration date written in our DNA?

  **Nat:** Not an expiration date. A distribution curve. Boorse was clear on this. Health is normal functioning. For most humans, the acute impairment caused by loss recedes. We reintegrate. We sleep, we eat, we return to work. PGD is diagnosed when that intense impairment persists past twelve months for adults. If the majority of the species resolves the functional disruption within a year, and a subset doesn't, that subset is statistically abnormal. That's the definition of a disorder.

  **Norm:** But that's the trick, isn't it? You're conflating "statistical rarity" with "pathology." Just because most people stop crying after a year doesn't mean the ones who haven't are broken machines. Maybe the "typical" timeline is just a cultural artifact of a productivity-obsessed society. You're measuring functioning, but whose functioning? The worker's? The citizen's?

  **Nat:** I'm measuring the organism's. If a system is designed to process loss and it fails to do so, that's a malfunction. Think of it like a wound. Most wounds heal in six weeks. If a wound stays open, festers, and prevents the leg from walking after a year, we call that an infection, not a "lifestyle choice." PGD is a psychological infection. It blocks the natural homeostatic recovery.

  **Norm:** But a wound heals to a specific biological endpoint. Grief doesn't. There is no biological "end state" for missing your mother. You said it yourself: "Most people reintegrate." Who decides what "reintegrate" looks like? If I still call out for her when I wake up, but I still go to work and pay my taxes, am I disordered? The DSM says I might be, if the *intensity* is high enough. But intensity is subjective. You can't read "too much sadness" off a blood test. You're smuggling in a value judgment: that this much pain is *unacceptable*.

  **Nat:** Okay, stop. You're going for the "no timeline" argument. You're saying there's no species-typical duration for grief. I have a comeback for that. It's not about the *feeling* of sadness; it's about the *capacity* to pursue goals. The DSM criteria require clinically significant distress or impairment in social or occupational functioning. If the grief mechanism hijacks the goal-pursuit system indefinitely, it is functioning outside its design parameters. It's not that sadness is bad; it's that a system stuck in "alarm" mode prevents the organism from surviving and reproducing. That is objectively sub-optimal functioning.

  **Norm:** Ah, there it is. The reference class move. You're grouping everyone into "Adult Humans" and saying, "Look, the average adult human recovers in 12 months." But that's a statistical gerrymander. If I change the reference class to "Adults who lost a primary attachment figure after a 50-year bond," the curve shifts. The "normal" functioning for *that* class might be a decade of disruption. By choosing a broad reference class, you're defining the deep bonders as defective by default.

  **Nat:** If we make the reference class that specific, *nothing* is a disease. If I say, "Well, for people with *my* specific liver enzymes, this level of toxicity is normal," then liver failure isn't a disease. We have to use a standard reference class—age and sex, typically—to make medicine possible. If we don't, you can't treat anyone. You're saying we have to wait until the "deep bonders" statistically recover to define them as healthy? What if they never do? Do we just say, "Oh, well, for you, incapacitating despair is normal"? That's not compassion; that's abandonment.

  **Norm:** I'm not saying abandonment. I'm saying the line between "disorder" and "deep love" is a moral line, not a biological one. When you medicalize PGD, you change the social meaning of grief. Suddenly, if I'm still devastated at 14 months, I'm not just a grieving son; I'm a patient. I have a symptom. You're telling me my love has become a pathology. That's a value judgment that says, "We value resilience over fidelity to the lost object."

  **Nat:** But the suffering is real! You're acting like the diagnosis is an insult. For a lot of people, PGD is hell. They can't leave the house. They set the table for the dead. They are trapped. Calling it a disorder validates that suffering. It says, "This isn't just how life is; this is something we can try to fix." It unlocks insurance, therapy, medication. If you deny it's a disorder because you're worried about the "meaning of grief," you're prioritizing philosophy over relief.

  **Norm:** I'm prioritizing the risk of iatrogenic harm. If we label normal variations of human attachment as diseases, we shrink the space allowed for being human. You say it unlocks treatment. I say it creates a demand for it. It tells people at month 13, "You should be over this. If you're not, you're sick." It creates anxiety about grieving. That anxiety *causes* the impairment you're measuring. You're creating a feedback loop where the diagnosis generates the statistics that justify the diagnosis.

  **Nat:** That's a slippery slope. We could say that about hypertension. "Oh, labeling high blood pressure makes people anxious about their heart." No. We measure the blood pressure because high pressure damages the arteries regardless of what the patient thinks about it. PGD correlates with increased suicide risk, cardiovascular issues, immune suppression. These are biological costs. The value judgment isn't "sadness is bad." The value judgment is "survival is good." If the grief threatens the survival of the griever, it has become maladaptive.

  **Norm:** But "maladaptive" relative to what? Relative to a capitalist economy that needs workers back in six months? Relative to a family system that wants the "sad dad" to cheer up? Look, I agree that *incapacitating* suffering needs help. But does it need the label of *disorder*? There's a difference between saying, "This pain is too heavy to carry alone, let me help you," and "Your grief response is statistically deviant and therefore pathological." One is solidarity; the other is triage.

  **Nat:** Triage is a form of solidarity. It allocates resources. If we don't draw a line, we can't prioritize care. You want to keep it in the realm of "meaning." I'm looking at a person who hasn't slept properly in 14 months. I don't care if their grief is a testament to their love. I care that their prefrontal cortex is offline. The DSM line—12 months—is arbitrary, yes. All diagnostic cutoffs are. Hypertension is 130/80, not 129/79. But we need a line to intervene. PGD provides that line.

  **Norm:** The hypertension analogy fails because blood pressure has a known physiological damage mechanism. PGD's "damage" is largely defined by the distress itself. It's circular. "Why is this a disorder?" "Because it causes distress." "Why is the distress disordered?" "Because it lasts too long." Who decides how long is too long? The APA committee. That's not biology, Nat. That's a panel of experts voting on how much sorrow is socially permissible.

  **Nat:** They voted based on data! Field trials showed that people meeting these criteria had significantly worse outcomes than those who didn't. It's empirical.

  **Norm:** It's empirical *given* the values they started with. They valued "return to baseline." But what if the baseline is the problem? What if the "baseline" is a shallow engagement with mortality? I'm not saying the therapist was wrong to offer you the diagnosis. I'm saying the diagnosis isn't a discovery of a virus. It's a negotiation. It's society saying, "We see you are suffering, and we are willing to call it an illness to help you, but be careful that in accepting the help, you don't accept the implication that your love was a mistake."

  **Nat:** ...I can live with that nuance. But I stand by this: If the mechanism is broken, fix it. Whether we call it "broken" because of statistics or values, the person in the dark still needs a light.

  **Norm:** Agreed. Just make sure the light doesn't blind them to the fact that the dark wasn't necessarily a defect. Sometimes it was just the price of the light they lost.

  **Nat:** Then we treat the price, not the purchase.

  **Norm:** Exactly.

  *(They sit in silence for a moment, the steam rising from their coffee cups.)*

  **Nat:** So... is it a disorder?

  **Norm:** It's a disorder if calling it one helps more than it harms.

  **Nat:** That's not a biostatistical answer.

  **Norm:** No. It's a human one.
