      *   *Advice:* Tell the student to lean into the "extreme case" (catastrophe) scenario. That's where Rawls is weakest.

  7.  **Final Polish:** Check against the prompt requirements. (1) Fairness? (2) Standard objection? (3) Interesting? + Identify weaknesses.

      *   *Weakness 1:* Underestimating Rawls's empirical claim (that telishment destroys the practice).
      *   *Weakness 2:* Not distinguishing between "logical impossibility" (Rawls sometimes hints telishment isn't punishment) vs. "utilitarian inadvisability."
      *   *Weakness 3:* Assuming the seminar hasn't covered Rule Utilitarianism collapse already (might be too basic if they did).

      *   *Action:* Structure the response clearly around the user's three points, then add a "Where the argument might be weak" section.

  8.  (Final Review of the Output) Looks good. Matches the tone of a helpful TA or peer reviewer. Ensures the student engages with the strongest version of the opponent's argument.

