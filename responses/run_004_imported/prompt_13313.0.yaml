          *   (3) Address the "well-worn" aspect. It's classic for a reason. Advice on how to make it fresh (focus on the *empirical* claim Rawls makes about trust, or the definition of the practice).
      *   *Specific Weakness to Highlight:* The user says Rawls gives no "principled utilitarian reason." Rawls *does* give one: it's an empirical/principled claim that a practice allowing telishment is self-defeating. The user needs to engage with *that* claim, not just assert the calculation exists. The argument shouldn't just be "the calculation exists," it should be "the calculation might favor telishment in catastrophic cases, which Rawls doesn't adequately rule out."

