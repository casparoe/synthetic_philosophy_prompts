answer: |-
  "You looked pained during the Q&A," Elena said, nudging her pint toward Mark across the sticky conference bar table.

  "Because the speaker kept treating the causal basis as the disposition itself," Mark replied, loosening his tie. "Lewis settled this thirty years ago. The electro-fink fails because the disposition supervenes on an *intrinsic* categorical basis—the microstructure, not the extrinsic wiring. The fink device detects the touch and cuts the power, sure, but the wire's intrinsic basis remains. Lewis saves the conditional analysis by anchoring it internally."

  "Lewis saved the conditional from finks, not from the category mistake," Elena countered. "Take an electron. Its charge is a disposition to interact with fields. The causal basis is... what? The electron itself? If you identify the disposition with the basis, you lose the modal force. If you identify it with the conditional, Martin wins. The basis is categorical; the disposition is modal. You can't bridge that gap just by saying 'intrinsic'."

  "The conditional is anchored by the basis," Mark insisted. "If *x* has basis *B*, and stimulus *S* occurs, then manifestation *M* follows. Masking cases like Johnston's don't break this; they just introduce a defeater. The glass is fragile, yes, but if it's packed in foam, the stimulus—striking—doesn't connect to the basis in the usual way. The conditional holds relative to the causal path."

  "Ah, so you add a ceteris paribus clause," Elena smiled, sensing blood. " 'Unless masked.' 'Unless an antidote is present.' Bird's poison case wrecks the simple conditional. You drink the poison, but take the antidote, you don't die. Were you disposed to die? Yes. Did the conditional hold? No. So you refine the antecedent: 'Unless masked or antidoted.' But how do you list all the antidotes? You'd need a disjunction as long as the universe. Or you say 'unless something interferes.' But 'interference' is just 'something that stops the disposition.' You're using the disposition to define the condition."

  "It's not circular if the basis is categorical," Mark argued, leaning in. "The microstructure dictates the interaction. The 'unless' clause just specifies that the causal path remains open. It's no different than physics saying 'ignoring air resistance.' We aren't surrendering; we're isolating variables."

  "But what determines which variables to ignore?" Elena pressed. "Only the disposition itself tells you what counts as a mask. You need to know what fragility is to know that foam masks it, whereas a hammer manifests it. That makes the disposition prior to the conditional. You're defining the conditional in terms of the disposition you're trying to analyze. That's circular, or it's empty."

  "So you're stuck with primitive powers," Mark said, shaking his head. "Dark ontological entities that do nothing but sound mysterious."

  "Better than empty conditionals," Elena said. "Martin saw that dispositions are real properties, not logical constructs. An electron doesn't carry a truth table; it carries a charge. The conditional is a symptom, not the disease. You want to reduce the power to the prediction, but the power explains why the prediction holds."

  "Maybe," Mark conceded, signaling for another round. "But if you make them primitive, how do you test them? Physics tests conditionals. We measure inputs and outputs."

  "Physics tests manifestations," Elena corrected. "We infer the power from the doing. But the power is what explains the doing. Lewis tried to dissolve the explanation into the prediction. Martin just reminded us that explanations cost something ontologically."

  Mark clinked his glass against hers. "Cheers to costly explanations."

  "Cheers," Elena said. "And to physicists who know the difference between a model and the world."
