answer: |-
  The fluorescent lights in the drafting room hummed, a low, electric headache that had persisted since dusk. Outside, the capital was dark, but inside, the only illumination came from the green-glass banker's lamp pooling over the spread of Article IV. Imre Vass rubbed his eyes with the heels of his hands. Across the table, Dalia Reyes was shredding a paper napkin into confetti.

  "The earth belongs to the living, Imre," Dalia said. Her voice was raspy, stripped of the ornament she used on the floor. "Jefferson wrote that to Madison. He meant that no generation has the right to contract debts or impose laws that the next cannot revoke. You're asking us to mortgage the next century."

  Imre reached for his coffee, found it cold, and pushed the cup away. "Jefferson wasn't writing from the ashes of a civil war, Dalia. He was writing from Paris. We are writing from Kestria. We know what happens when the living act on pure impulse. We just spent six years watching it."

  "We spent six years watching tyrants use emergency powers to crush dissent," she corrected. "That is exactly what this clause invites. You call it the Ulysses Clause. You say we are tying ourselves to the mast so we don't steer into the rocks."

  "Exactly."

  "But Ulysses was one man," Dalia said, leaning forward. The napkin confetti stuck to her palm. "That is the disanalogy you keep glossing over. Ulysses had a single, continuous consciousness. He knew the Sirens were coming. He knew the nature of the song. And crucially, Imre, he held the authority to untie the knots once the danger passed. He bound *himself*."

  She tapped the draft paper. "We are not binding ourselves. We are binding people who are not in this room. Most of them aren't born yet. They didn't hear the Sirens. They don't know why we're afraid of the music. And we are welding the knots shut. Nine-tenths majority? Three successive parliaments? That isn't self-binding. That is the dead hand gripping the throat of the living."

  Imre didn't look at the paper. He looked at her. "You're defining the 'self' as a biological cohort. I'm defining it as the constitutional order. If the order collapses, the future people you're protecting don't get to be citizens. They become casualties. The precommitment isn't about stopping them from changing their minds; it's about ensuring there is still a ship for them to steer."

  "So the ship matters more than the crew?"

  "The ship is the only reason the crew doesn't drown," Imre said softly. "You argue that the unborn haven't consented. I argue that by inheriting a stable Kestria, they give tacit consent to the foundations that kept it stable. We aren't guessing at the danger, Dalia. The danger isn't a specific policy. It's the mechanism of panic. We are binding them against the impulse to burn the house down because they smell smoke."

  "But what if the house is on fire?" Dalia asked. "What if the Sirens aren't singing, and it's actually a rescue ship? You're building a mechanism that assumes our judgment is perfect. If we entrench a right that turns out to be unjust—or a restriction that turns out to be oppressive—nine-tenths of three parliaments is a functional impossibility. You're not creating a mast. You're creating a tomb."

  Imre finally picked up his pen, turning it over in his fingers. "It's not impossibility. It's friction. You want to distinguish between a legitimate shift in values and a momentary panic. Time is the only filter we have. Three parliaments means years. If a grievance is real, it will last years. If it's a fever, it will break. Ulysses didn't need a supermajority to untie himself because Ulysses was sane. We are proving we are sane by admitting we might not be."

  "Friction generates heat," Dalia countered. "While we wait for those three parliaments to convene, while we wait for the fever to break, people suffer. You talk about the danger of panic. I'm talking about the violence of stagnation. If a minority is being crushed by an entrenched clause, they don't have the luxury of waiting for the majority to cool down. You're asking them to bleed patiently."

  "I'm asking them to survive long enough to vote," Imre said. "Because the alternative to stagnation is not always progress. Sometimes it's the slide back into factionalism. We saw what happens when every election is a referendum on the existence of the state. This clause takes existence off the table. It says: we can fight over taxes, over borders, over policy. We cannot fight over the frame."

  "And who decides what is the frame and what is the furniture?" Dalia asked. "That's the power you're entrenching, Imre. The power to define the emergency. You say you're binding us against panic. I say you're giving a veto to the status quo. Ulysses could hear the Sirens. He knew when he was safe. Your clause assumes we know what safety looks like for the next fifty years. We don't. We're just tired."

  Imre set the pen down. The silence stretched, filled only by the hum of the lights. "I know we're tired," he said. "That's why I want the ropes. Because when we are rested, when the war is a memory and not a scar, maybe we can untie them. Maybe a future generation will look at this and laugh at how afraid we were. I hope they do. But I would rather they laugh at our caution than curse our recklessness."

  Dalia smoothed the confetti from her palm onto the table. She looked at the clause, then at the clock on the wall. It was past two. "If I agree to bring this to the floor," she said, her voice quiet, "I'm attaching a sunset provision. Not for the rights. For the entrenchment mechanism itself. Twenty years. Let them decide then if they want to keep the chains."

  Imre exhaled, a long, slow sound. "Twenty years might not be enough to grow a new political culture."

  "Then we don't deserve to survive," Dalia said. She picked up her pen. "Draft the amendment, Imre. Before I change my mind."

  Imre nodded, uncapping his own pen. He didn't write immediately. He just held it over the page, hovering in the space between the lines. "Twenty years," he repeated.

  "Long enough to heal," Dalia said. "Short enough to breathe."

  They worked in silence until the light in the room began to gray, neither of them sure if they had saved the constitution or merely delayed its failure.
