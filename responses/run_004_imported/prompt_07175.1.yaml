answer: |-
  You have stumbled onto one of the most fascinating and heady corners of rationalist philosophy, and your housemate has asked exactly the right skeptical question. It is completely understandable that you feel deflated; finding out a worldview-shifting idea might rest on a contested interpretation of quantum mechanics is a classic "philosophical buzzkill."

  However, the good news is that **your housemate is right about the physics, but wrong about the implication for ECL.** The argument does not collapse if the Many-Worlds Interpretation (MWI) of quantum mechanics turns out to be false.

  Here is the breakdown of why ECL (Evidential Cooperation in Large Worlds) survives the death of MWI, what "Large Worlds" actually means, and where the real fragility of the argument lies.

  ### 1. "Large Worlds" $\neq$ "Quantum Branching"

  You are correct that Caspar Oesterheld's original paper on **MCD** (Multiverse-wide Cooperation via Correlated Decision-Making) leaned heavily on the Everettian (Many-Worlds) multiverse. In that framework, the "copies" of you are created via quantum branching.

  However, the concept evolved into **ECL** (Evidential Cooperation in Large Worlds) precisely to decouple the argument from quantum mechanics. In the EA and LessWrong discourse, a "Large World" generally refers to any cosmological model where the universe is vast enough to contain many agents similar to you.

  There are three main ways to get a "Large World," and only one of them requires MWI:

  1.  **Quantum Multiverse (MWI):** Reality branches at every quantum event. (Contested physics).
  2.  **Cosmological Infinity:** If space is infinite (or sufficiently vast) and matter is distributed roughly uniformly (as standard inflationary cosmology suggests), then by the law of large numbers, there are regions of space identical to our observable universe. There could be a physical duplicate of you reading this sentence in a galaxy 10$^{10^{50}}$ meters away. (Standard cosmology, though infinity is unproven).
  3.  **Eternal Inflation / Bubble Universes:** Inflationary theory suggests "pocket universes" constantly bud off. Even if our bubble is finite, the "multiverse" of bubbles is infinite. (Widely accepted among cosmologists, though unproven).

  **The Takeaway:** If MWI is false, but the universe is spatially infinite (a very standard assumption in modern cosmology), you still live in a "Large World." There are still countless counterparts out there. ECL proponents argue that spatial infinity is actually a *more* robust foundation for the argument than quantum branching, because it relies on standard general relativity rather than contested quantum foundations.

  ### 2. The Engine is Decision Theory, Not Physics

  The real "heavy lifting" in the ECL argument isn't done by physics; it's done by **decision theory**.

  Your housemate's objection assumes that for your actions to matter elsewhere, there must be a *causal* link (like a signal traveling through space). But ECL relies on **acausal** correlation.

  *   **Causal Decision Theory (CDT):** Says "My choice cannot causally affect an alien a billion lightyears away. Therefore, I should ignore them."
  *   **Evidential/Logical Decision Theory (EDT/LDT):** Says "My choice is the output of a specific reasoning algorithm. If there is another agent running a similar algorithm (a 'counterpart'), their output will correlate with mine, even without causal contact."

  Think of it like this: If you and a friend are separated in different rooms and asked to solve the exact same math problem, you will likely get the same answer. You didn't communicate. Your answers correlate because you are running the same "logical algorithm."

  ECL argues that if the world is "Large," there are agents out there running algorithms sufficiently similar to yours.
  *   If you decide to **cooperate**, that is evidence that other agents with your values will also **cooperate**.
  *   If you decide to **defect**, that is evidence they will **defect**.

  This correlation holds regardless of *why* those agents exist. Whether they exist because of quantum branching, spatial infinity, or even the Simulation Hypothesis (many runs of the sim), the logical correlation remains. **MWI just populates the world with more counterparts; it doesn't create the correlation mechanism.**

  ### 3. So, what *does* make ECL fragile?

  If it doesn't depend on MWI, why isn't everyone convinced? The argument is still speculative, but the weak points are different than your housemate suggested.

  **A. The "Reference Class" Problem**
  For ECL to work, you need to know *who* correlates with you.
  *   Do only exact duplicates of you correlate? (Too rare).
  *   Do all humans correlate? (Too broad).
  *   Do all rational agents correlate?
  If you can't define the "reference class" of agents whose decisions correlate with yours, you can't calculate the expected value of cooperation. This is a philosophical/logical problem, not a physics problem.

  **B. The "Small World" Possibility**
  The one cosmological claim ECL *does* need is that the universe is actually big. If the universe is finite and small enough that there are *no* other advanced civilizations or reasoning agents, ECL gets no traction. However, given the number of stars alone, most proponents think the probability of a "Small World" is low enough to ignore.

  **C. The "Acausal Trade" Risks**
  Some critics argue that trying to cooperate with unknown entities in a large world opens you up to exploitation (e.g., cooperating with values you hate because some counterpart elsewhere is doing the same). This is a game-theory risk, not a physics risk.

  ### 4. Summary: How to update your view

  You don't need to throw out the rabbit hole, but you should adjust your map of it.

  1.  **Your housemate is right:** MWI is not settled science.
  2.  **But the argument survives:** ECL works just as well in an infinite spatial universe (standard cosmology) as it does in a quantum multiverse. It does not stand or fall with Everettian QM.
  3.  **The real bottleneck:** The argument stands or falls on **Logical Decision Theory**. If you believe that your decision can be *evidence* of a distant agent's decision (superrationality), the physics matters less than the sheer size of the cosmos.
  4.  **Epistemic Humility:** The EA/LW community generally treats ECL as a **high-uncertainty, high-upside** consideration. It's not a "proof" that you must be altruistic; it's a "maybe the stakes are vastly higher than we thought, so we should look into this."

  **Verdict:** You are understanding "Large Worlds" slightly too narrowly. It means "a world big enough to contain many reasoning agents," not specifically "a world that quantum branches." You can keep reading those posts without worrying that a Nobel Prize in Physics might delete the argument tomorrow. The physics provides the *stage*, but the decision theory writes the *play*.
