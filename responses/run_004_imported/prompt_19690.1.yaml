          *   Must *not* be the classic examples (Sophie's Choice, Agamemnon/Iphigenia, Sartre's Student).
          *   Must satisfy the condition: Agent ought to do A, ought to do B, cannot do both, and neither duty overrides the other.
          *   Must address the philosophical objection (Alan Donagan's view: if you can't do both, one 'ought' wasn't real).
          *   Must describe the "moral residue" (guilt/regret) left over.
      *   **Tone:** Intellectual, creative, helpful for a writer plotting a novel.

