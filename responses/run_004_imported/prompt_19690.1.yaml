      *   *The Key to a "Genuine" Dilemma:* To defeat Donagan, the scenario needs to show that *both* obligations retain their normative force even after the choice is made. It's not that one was "lesser," but that the violation of the unchosen path leaves a stain that rationalization cannot wash away.
