      *   **Technical Analysis (The "Math"):** Explain the KMR/Chouldechova impossibility result simply. Validate the Vendor (calibration is good) and the Subcommittee (error rates are unequal). Explain *why* (base rates).
      *   **Legal & Ethical Analysis:** Address the Equal Protection risk of race-norming. Address the Due Process risk of high FPR for Black defendants.
      *   **Recommendation:**
          1.  Adopt Meridian.
          2.  Condition 1: Advisory only (no automatic detention based on score).
          3.  Condition 2: Shift threshold globally to prioritize FPR reduction (accepting lower calibration/recall).
          4.  Condition 3: Invest in base-rate reduction (diversion).
          5.  Condition 4: Sunset clause.
      *   **Engagement with Opposing Views:**
