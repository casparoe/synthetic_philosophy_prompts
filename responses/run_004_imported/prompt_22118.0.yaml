answer: |-
  **MEMORANDUM**

  **TO:** Pretrial Justice Reform Commission
  **FROM:** Dr. [Your Name], Embedded Methods Advisor
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Adoption of Meridian Risk Assessment Instrument

  ### **Executive Summary**

  After reviewing the pilot audit data, legal counsel's guidance, and the mathematical constraints inherent to risk modeling, I recommend that the Commission **adopt the Meridian instrument with strict conditions on its implementation.** Specifically, the Commission should approve the use of the Meridian score as an *advisory* input only, reject the vendor's default decision thresholds, and prohibit the use of race-specific cutoffs.

  This recommendation rejects the Data-Equity Subcommittee's call for race-normed thresholds due to legal vulnerability, but it also rejects the Vendor's assertion that calibration alone satisfies fairness. We cannot mathematically eliminate the disparity in false-positive rates without violating equal protection laws or degrading the tool's utility. Therefore, we must manage the *consequences* of that disparity through human oversight and parallel investment in base-rate reduction.

  ### **The Mathematical Bind: Why Both Sides Are Partially Right**

  The dispute before this Commission is not a failure of the Meridian vendor, nor is it a misunderstanding by the Subcommittee. It is a manifestation of a proven mathematical impossibility theorem (Kleinberg, Mullainathan, Raghavan; Chouldechova).

  When two groups have different underlying base rates of an outcome (here, 46% rearrest for Black defendants vs. 26% for white defendants), it is mathematically impossible for a risk score to satisfy three conditions simultaneously:
  1.  **Calibration:** A score of X means the same probability of rearrest for both groups. (Meridian achieves this).
  2.  **False Positive Rate Balance:** The rate of wrongly flagging non-rearresting defendants is equal. (Meridian fails this; 41% vs. 21%).
  3.  **False Negative Rate Balance:** The rate of wrongly clearing rearresting defendants is equal. (Meridian fails this; 24% vs. 47%).

  **To the Vendor:** You are correct that Meridian is "fair" regarding calibration. A Black defendant and a white defendant with a Decile 7 score pose the same statistical risk. However, calibration is a metric of *accuracy*, not *justice*. In pretrial contexts, the cost of a False Positive (unnecessary detention) is a deprivation of liberty. By relying solely on calibration, you are asking this Commission to accept that Black defendants must bear a higher burden of wrongful detention to maintain predictive parity. That is a policy choice, not a mathematical necessity.

  **To the Data-Equity Subcommittee:** You are correct that the current error distribution imposes an unjust burden on Black defendants. A 41% false-positive rate means that for every 100 Black defendants who would *not* be rearrested, 41 are likely to be flagged as high risk. However, your proposed remedy—race-specific decile cutoffs—is legally perilous. As outside counsel noted, explicit racial classification in state decision-making triggers strict scrutiny under the Equal Protection Clause. Furthermore, adjusting thresholds does not fix the underlying base rate disparity; it merely shifts the error type. If we lower the threshold for Black defendants to match False Positive Rates, we inevitably increase False Negatives (releasing higher-risk individuals), which creates a different safety equity gap.

  ### **Recommendation: Adopt-with-Conditions**

  We cannot algorithm our way out of a sociological problem. The disparity in error rates is a symptom of the disparity in base rates (driven by policing patterns, economic inequality, and prior system contact). However, deploying this tool automates that disparity. To mitigate this, I recommend the following four conditions for adoption:

  **1. Decouple Scores from Mandatory Detention (Risk-Informed, Not Risk-Determined)**
  The Meridian score shall not trigger automatic detention or bail amounts. It must be one factor among many in a judge's holistic assessment. This preserves the "Human-in-the-Loop" necessary to override high False Positives.
  *   *Rationale:* This mitigates the harm of the 41% FPR without requiring illegal race-norming. A judge can consider a high score alongside stable housing or employment, which the algorithm cannot see.

  **2. Re-Tune Global Thresholds to Prioritize Liberty**
  The Commission shall direct the vendor to adjust the *global* risk threshold for "high risk" designation upward. We should accept a higher False Negative rate (releasing some who rearrest) to lower the False Positive rate (detaining fewer who do not).
  *   *Rationale:* Since we cannot balance FPR across races due to base rates, we must lower the FPR for *everyone* to reduce the absolute number of Black defendants wrongly detained. This sacrifices some public safety efficiency to protect liberty interests, a trade-off consistent with the presumption of innocence.

  **3. Prohibition on Race-Norming**
  The Commission shall explicitly vote against race-specific cutoffs.
  *   *Rationale:* Beyond the legal risk, race-norming treats the symptom (the score) rather than the disease (the base rate). It creates a "separate but equal" scoring system that undermines public trust and invites litigation that could derail reform entirely.

  **4. Mandated Base-Rate Mitigation Investment**
  Adoption of Meridian is contingent on the County committing funds to diversion programs aimed at reducing the underlying rearrest base rate for Black defendants.
  *   *Rationale:* The only mathematical way to close the error gap long-term is to close the base rate gap. If we deploy the tool without addressing the input disparity, we are codifying inequality.

  ### **Implementation Timeline**

  *   **Month 1 (November 2023):** Commission votes to adopt Meridian under the conditions above. Vendor contract amended to reflect "Advisory Only" status and threshold re-tuning.
  *   **Month 2-3 (December 2023 - January 2024):** Vendor recalibrates decision thresholds to target a global False Positive Rate below 30% (down from the current ~31% weighted average), accepting the corresponding rise in False Negatives.
  *   **Month 4 (February 2024):** Judicial training begins. Judges are trained specifically on the "Base Rate Fallacy" and the impossibility theorem, ensuring they understand that a high score for a Black defendant carries a higher probability of error than the same score for a white defendant.
  *   **Month 12 (October 2024):** Sunset Review. The Commission will review the disparate impact data. If the False Positive gap has widened or if the "Advisory Only" mandate has been routinely ignored by judges, the contract will be terminated.

  ### **Closing Statement**

  To the Subcommittee: I hear your concern that "calibration" feels like a technical shield for disparate impact. It is. By adopting this tool, we are accepting that Black defendants will still be flagged at higher rates. I am recommending adoption only because the alternative—human decision-making without a tool—is historically less calibrated and more opaque. We mitigate this risk not by breaking the math, but by limiting the tool's power to detain.

  To the Vendor: You argue that your tool is fair because the math is consistent. But fairness in justice is not just statistical consistency; it is the distribution of liberty. If your tool's accuracy relies on a background rate of inequality, you cannot claim the tool is neutral. By agreeing to these conditions, you acknowledge that your product operates in a social system, not a vacuum.

  We are voting on whether to use a map that we know has distortions. We should use the map, but we must not let it drive the car.

  **Recommendation:** **Adopt with Conditions.**
