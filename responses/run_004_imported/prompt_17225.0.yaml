answer: |-
  It is a pleasure to meet a fellow traveler in *On Certainty*, especially one who appreciates the stratigraphy of Wittgenstein's metaphors. You have hit on the precise tension that makes the book so difficult and so rewarding. As a geologist, you recognize that the stability of the landscape isn't a guarantee; it's a condition for the flow. Wittgenstein saw the same thing in language.

  To answer your bottom line immediately: **Wittgenstein believes Moore is making a category mistake.** He does not think Moore is "basically right" about *knowledge*; he thinks Moore is right about the *hands* but wrong about the *grammar* of claiming to know them. Consequently, Moore's anti-skeptical *project* (the proof) does not survive, but his anti-skeptical *instinct* (that skepticism is idle) is vindicated, though on entirely different grounds.

  Here is the detailed breakdown of why Wittgenstein thinks Moore's "Proof of an External World" is a grammatical confusion rather than an epistemological triumph.

  ### 1. Moore's Move: The Empirical Claim
  To see where Wittgenstein diverges, we must be precise about what Moore is doing in *A Defence of Common Sense* and *Proof of an External World*.

  Moore treats propositions like "Here is one hand" or "The earth has existed for many years" as **empirical propositions**. In the traditional epistemological framework (which Moore accepts), an empirical proposition is something that can be known, doubted, verified, or falsified. Moore's argument is essentially:
  1.  Skeptics say we cannot know external objects exist.
  2.  I hold up my hand and say, "Here is a hand."
  3.  I *know* this is true with certainty.
  4.  Therefore, the skeptic is wrong.

  Moore is playing the skeptic's game. He accepts the rules of "Justified True Belief." He is trying to win the game by producing a belief so robust it cannot be shaken. He treats "I know I have a hand" as a very strong claim *within* the system of knowledge.

  ### 2. Wittgenstein's Intervention: The Hinge (OC 341–343)
  Wittgenstein looks at Moore holding up his hand and says, in effect, "You are holding up the wrong thing."

  You mentioned the hinge passage. In **Remark 341**, Wittgenstein writes:
  > *"That is to say, the questions that we raise and our doubts depend on the fact that some propositions are exempt from doubt, are as it were like hinges on which those turn."*

  And in **343**:
  > *"If I want the door to turn, the hinges must stay put."*

  For Wittgenstein, "Here is a hand" is not an empirical claim that we have verified so well it is now certain. It is a **hinge proposition**. It is part of the scaffolding that allows verification to happen in the first place.

  **The Geologist's Translation:**
  Moore treats the river-bed (the hinges) as if it were just very slow-moving, very hard water (empirical facts). He thinks, "This water is moving so slowly it might as well be rock, so I will call it 'Known Rock'."
  Wittgenstein says, "No. The rock is not water that has stopped. The rock is the *channel* that allows the water to flow. You cannot measure the velocity of the rock."

  ### 3. The Category Mistake: Why "Know" Doesn't Apply
  This is the crux of your question. Does Wittgenstein think we *know* these things? His answer is a firm **no**. But this "no" is not skepticism; it is grammatical.

  For Wittgenstein, the word "know" has a specific logic. To say "I know X" implies three things that do not apply to hinge propositions:
  1.  **The possibility of doubt:** You can only claim to know something if it makes sense to doubt it.
  2.  **The possibility of being wrong:** If you cannot be wrong, you aren't in the business of "knowing"; you are in the business of "being."
  3.  **Grounds/Justification:** To know something, you must be able to give a reason *why* you know it.

  Wittgenstein attacks Moore on all three fronts in *On Certainty*.

  **On Justification (OC 110, 243):**
  If Moore says, "I know this is a hand," Wittgenstein asks, "How do you know?" If Moore says, "I see it," Wittgenstein points out that the reliability of vision *presumes* the existence of hands and eyes. You cannot use the visual system to prove the framework that makes vision possible.
  > *"If I do know that here is a hand, we'll grant him all the rest."* (OC 1)
  Wittgenstein argues that Moore's "proof" assumes the very thing he is trying to prove.

  **On Doubt (OC 354):**
  > *"No: 'I know it' is nonsense... for it is not a proposition that can be subjected to doubt."*
  If I say, "I doubt I have a hand," I am not engaging in serious inquiry; I am engaging in nonsense (or psychiatry). Because genuine doubt is impossible here, the claim to "knowledge" is equally empty.

  **On Being Wrong (OC 370):**
  > *"I know" is here a logical insight. Only realism can't be proved by means of it.*
  Wittgenstein suggests that if Moore were wrong about his hand (e.g., if he were hallucinating), it wouldn't just be a mistake about a hand; his entire world-picture would collapse. Therefore, it isn't a standard empirical error.

  ### 4. The River-Bed (OC 96–99)
  You recalled the river-bed analogy correctly (it is indeed in the 90s). This is where Wittgenstein explains *why* Moore feels so confident, even if his grammar is wrong.

  In **Remark 96–99**, Wittgenstein describes how some propositions harden into the bed of the river. They become the channel through which the fluid propositions (ordinary science, daily observation) flow.
  > *"It might be imagined that some propositions, of the form of empirical propositions, were hardened and functioned as channels for such empirical propositions as were not hardened but fluid; and that this relation altered with time, in that fluid propositions hardened, and hard ones became fluid."*

  Moore sees a hardened proposition ("The earth exists") and treats it as a fluid one that has just become very viscous. He tries to test it like water. Wittgenstein says, "Treat it as rock."

  If you try to drill into the bedrock to test its solidity, you are using tools that rest *upon* the bedrock. You cannot test the framework from outside the framework.

  ### 5. What Survives of Moore's Project?
  So, to your final question: Does anything of Moore's anti-skeptical project survive?

  **What Dies:**
  The **Proof**. Moore wanted to defeat skepticism by offering a better argument. He wanted to beat the skeptic at epistemology. Wittgenstein shows this is impossible. You cannot argue someone out of skepticism using logic, because skepticism questions the logic itself. Moore's "Here is a hand" is not a proof; it is a gesture. As a logical proof, it is circular.

  **What Survives:**
  The **Stance**. Wittgenstein agrees with Moore that the skeptic is talking nonsense. But while Moore thinks the skeptic is *false*, Wittgenstein thinks the skeptic is *idle*.
  *   Moore says: "The skeptic is wrong because I know I have a hand."
  *   Wittgenstein says: "The skeptic is meaningless because 'doubting everything' is not a language game anyone actually plays."

  In **Remark 115**, Wittgenstein writes:
  > *"If you tried to doubt everything you would not get as far as doubting anything. The game of doubting itself presupposes certainty."*

  Wittgenstein saves Common Sense not by proving it is *true*, but by showing it is **animal** or **pragmatic**. It is not a conclusion we reach; it is a way we act.
  > *"My life consists in my being content to accept many things."* (OC 344)

  ### 6. Summary for the Book Club
  If you are bringing this to your group, here is the distinction to press home:

  1.  **Moore** thinks "Here is a hand" is the **best supported building** in the city of Knowledge. He thinks the foundations are just really deep.
  2.  **Wittgenstein** thinks "Here is a hand" is the **ground** the city is built on. You don't say you "know" the ground; you stand on it.

  Wittgenstein isn't filling in *why* Moore's knowledge is bombproof. He is saying that calling it "knowledge" is like calling the rules of chess a "move" in chess. It looks like a move (it uses the pieces), but it actually governs how the moves are made.

  **The Verdict:**
  Moore wanted to say, "I know this, so skepticism is defeated."
  Wittgenstein says, "You don't 'know' this; you live it. And because you live it, skepticism doesn't need defeating; it needs dissolving."

  Moore's project survives only as a symptom of the confusion Wittgenstein wants to cure. Moore felt the need to prove the world exists because he accepted the skeptic's demand for justification. Wittgenstein's therapy is to show that no such justification is possible, nor is it needed. The rock doesn't need to prove it is hard to support the water. It just is.

  *(Textual Note for your copy: The specific critique of Moore's use of "I know" is heavily concentrated in Remarks 30–35, 370–375, and 417–420. The hinge mechanics are 341–343. The river-bed is 96–99.)*
