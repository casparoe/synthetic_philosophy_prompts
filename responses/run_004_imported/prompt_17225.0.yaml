prompt: |-
  I'm a retired geologist who got bit by the philosophy bug in retirement — mostly book clubs and a couple of audited university courses these past two years, trying to keep the brain from going soft. Lately our little group has been slowly working through Wittgenstein's On Certainty, and I'll admit I got a kick out of how geological his imagery is: he talks about a river-bed of thought that's mostly fixed hard rock, with the flowing water of ordinary empirical claims running over top of it, the bed itself only shifting very slowly if at all. That got me curious about what these "hinge" propositions of his actually are, and how they relate to the reason he apparently wrote the whole thing in the first place, which was a running arguement with G.E. Moore and his "here is one hand" business.

  So here's what I'd like from you: a real, detailed comparison between Wittgenstein's hinge propositions and Moore's common-sense propositions from "A Defence of Common Sense" and "Proof of an External World." Not the drive-by version — I already got "Wittgenstein responds to Moore" from the introduction of my copy, thanks. What I actually want to know is more specific: does Wittgenstein think Moores basically right that we know things like "here is a hand," and he's just filling in why that knowledge is so bombproof? Or is he saying something stranger — that "know" doesn't even properly apply to propositions like that, so Moore's whole proof, while maybe not exactly wrong, is a kind of category mistake dressed up as an argument? Feel free to anchor this in the actual text if you can — I think the hinge passage is somewhere around remark 341 to 343 and the river-bed bit is somewhere in the 90s, but my memory for exact numbers isn't what it used to be, so don't take my word for it. Bottom line, I want to come away knowing whether anything of Moore's anti-skeptical project actually survives contact with Wittgenstein, or whether the whole framing just gets quietly swapped out for something else.
