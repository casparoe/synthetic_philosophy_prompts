  A perdurantist student goes to office hours to argue for a better grade. He says, "Professor, strictly speaking, *I* didn't write a C paper. Only an earlier temporal part of me did."

  The professor hands back the exam and says, "In that case, strictly speaking, *I* didn't give you a C. Only a temporal part of me did, and she's already gone home."

  ***

  **Why this works for your seminar:**
  The joke relies on the perdurantist's standard move to solve the problem of temporary intrinsics (denying that the *whole* object bears the property, assigning it to a *stage* instead). The "extra layer" for your group is that the professor's retort exposes the pragmatic absurdity of that move: if you fragment identity to avoid responsibility for the past, you fragment agency enough to lose credit (or blame) in the present. It also subtly nods to the "wholly present" requirement of endurantism—the professor's grading *self* isn't wholly present to accept the student's metaphysical loophole.
