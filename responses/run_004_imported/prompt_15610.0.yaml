answer: |-
  **MEMORANDUM**

  **TO:** Learning Analytics Oversight Committee
  **FROM:** [Your Name], Undergraduate Student Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Contract Renewal for "Persist" Predictive Analytics Tool

  ### Executive Summary

  The Learning Analytics Oversight Committee is currently evaluating the renewal of the "Persist" contract, a predictive tool used to identify students at risk of attrition before their sophomore year. Technical analysis confirms that while "Persist" is well-calibrated across demographic groups, it produces significantly higher false-positive rates for first-generation students (flagged high-risk at nearly 3x the rate of continuing-generation peers who also persist). This disparity stems from underlying base rate differences (24% vs. 11% attrition) and reflects a known mathematical trade-off between calibration and error rate parity.

  After reviewing the technical constraints and ethical implications, **I recommend that the Committee vote to renew the "Persist" contract conditional on the implementation of a "Support-Only" Policy.** This policy would mandate that a high-risk flag may never restrict student resources (e.g., registration holds) but can only trigger proactive outreach and additional support. This recommendation balances the utility of calibrated risk scores with the ethical imperative to minimize stigma. A formal review of the tool's impact is recommended in 12 months.

  ### Background and Technical Context

  The "Persist" tool assigns risk scores to incoming students to help advisors prioritize mandatory check-ins. The vendor's technical report confirms the tool is **calibrated**: a risk score of 0.70 implies a 70% probability of attrition, regardless of whether the student is first-generation or continuing-generation. This calibration is vital for advisors to interpret the score meaningfully.

  However, the Faculty Senate's data-equity subcommittee identified a disparity in **false-positive rates (FPR)**. Among students who *do* persist to sophomore year, first-generation students are flagged as high-risk much more frequently than their continuing-generation peers.

  This tension is not necessarily a bug in the code, but a feature of the statistical landscape. As discussed in recent algorithmic fairness literature (specifically the impossibility results by Chouldechova and Kleinberg et al.), when base rates differ between groups (24% first-gen attrition vs. 11% continuing-gen), it is mathematically impossible for a predictor to simultaneously satisfy calibration and equal false-positive rates, absent a perfect predictor. We are forced to choose which fairness criterion to prioritize.

  ### Recommendation: Renewal with Conditions

  I recommend renewing the contract **contingent on the adoption of a "Support-Only" Policy.**

  Under this condition, the output of the "Persist" tool may be used to *allocate* additional resources (e.g., priority advising slots, mentorship connections, financial aid counseling) but may never be used to *restrict* access (e.g., mandatory holds on course registration, limitations on extracurricular eligibility).

  **Rationale:**
  1.  **Mitigating Harm:** The primary ethical risk of a high false-positive rate is stigmatization and the burden of unnecessary intervention. If a false positive results only in increased support rather than administrative friction, the harm of the disparity is significantly reduced.
  2.  **Preserving Utility:** Maintaining calibration ensures that advisors can trust the probability associated with a score. This allows for efficient resource allocation in a resource-constrained advising environment.
  3.  **Alignment with Mission:** The tool is intended to support retention. A "Support-Only" constraint ensures the tool's usage remains strictly aligned with this mission, preventing "function creep" where risk scores are used for punitive or restrictive measures.

  **Next Steps:**
  *   **Vendor Negotiation:** The Office of the Registrar must amend the service agreement to explicitly prohibit the use of risk flags for restrictive holds.
  *   **Advisor Training:** Mandatory training for advisors must emphasize that a high-risk flag indicates a need for outreach, not a deficit in the student.
  *   **Review Date:** The Committee shall reconvene in **October 2024** to review retention data, student sentiment surveys, and advisor workload metrics to determine if the disparity remains acceptable under the new conditions.

  ### Alternative Considered: Suspension of the Tool

  The strongest argument against this recommendation comes from the faction of the Committee advocating for the **immediate suspension** of "Persist" until the false-positive disparity is resolved.

  Proponents of suspension argue that calibration is insufficient to ensure fairness. Even if the scores are mathematically accurate on average, the disproportionate burden of false positives falls on a historically marginalized group (first-generation students). Being incorrectly flagged as "high-risk" can induce psychological stress, imposter syndrome, and stigma, regardless of whether the flag results in a hold. From this perspective, deploying a tool that systematically mislabels first-generation persisters at higher rates perpetuates a narrative of deficiency. This camp argues that the ethical cost of this disparate impact outweighs the administrative efficiency gained by the tool, and that the University should rely on human-driven identification methods until a model can satisfy both calibration and error rate parity.

  While this position is ethically robust, it risks discarding a tool that successfully identifies many students who genuinely need help. Given that no perfect predictor exists, suspension may result in *fewer* total resources reaching at-risk first-generation students, potentially worsening the very attrition gap we seek to close.

  ### Conclusion

  The impossibility results we have studied make it clear that we cannot optimize for all fairness metrics simultaneously. We must choose the trade-off that aligns best with our institutional values. By renewing "Persist" with a "Support-Only" condition, we acknowledge the mathematical constraints while choosing to absorb the inefficiency of false positives as a cost of ensuring no student is penalized by an algorithmic error. This approach allows us to utilize predictive power for support while erecting a firewall against algorithmic stigma.

  I look forward to discussing this recommendation at next Wednesday's vote.
