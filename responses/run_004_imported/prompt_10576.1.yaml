answer: |-
  This is a textbook case of the tension between the **truth of a moral judgment** and the **standing to blame**. Since you are currently studying this, you will likely recognize the philosophical contours of the dispute immediately. Your friend is relying on a logical point about moral truth, while you are intuiting a normative point about moral authority.

  Here is how you can disentangle the two positions using the framework you are likely encountering in your seminar.

  ### 1. The Friend's Argument: The Independence of Moral Truth
  Your friend is making a claim that aligns with the rejection of the *tu quoque* (you also) fallacy. Logically, the moral status of an action is independent of the moral status of the person judging it.
  *   **The Claim:** "My doing the same thing doesn't make what you did any less wrong."
  *   **The Validity:** She is technically correct here. If talking behind a mutual friend's back is a betrayal of trust, it remains a betrayal of trust regardless of who points it out. A thief can correctly identify another thief; their guilt does not render the second theft "not theft."
  *   **The Limit:** This argument addresses the *content* of the criticism, but it ignores the *context* of the relationship and the *act* of blaming itself.

  ### 2. Your Intuition: The Loss of Standing
  Your discomfort stems from what philosophers like R. Jay Wallace, Macalester Bell, or Christopher Fritz might call a loss of **moral standing**.
  *   **The Claim:** "You cannot rightfully blame me for X when you routinely commit X."
  *   **The Validity:** In contemporary literature on moral responsibility, there is a strong consensus that hypocrisy undermines one's standing to blame. This is not because the blame is factually incorrect, but because the *speech act* of blaming becomes infelicitous or unfair.
  *   **Why it undermines standing:**
      1.  **Implicit Claim of Superiority:** Blame often carries an implicit assertion that the blamer respects the norm and the blamee has violated it. When the blamer routinely violates the norm, this assertion is false.
      2.  **Unfair Exemption:** By blaming you while exempting herself (through her silence or lack of self-correction), she is treating herself as special, which violates the relational equality required in a friendship.
      3.  **Lack of Commitment:** Hypocritical blame suggests the blamer is not actually committed to the moral norm, but is instead using the norm as a weapon or a tool for social control.

  ### 3. The Crucial Distinction: Accuracy vs. Authority
  To answer your question directly: **You are both right, but about different things.**

  *   **She is right about the Act:** Your action was likely wrong (assuming you accept the premise that gossiping about a friend is a betrayal). Her behavior does not retroactively excuse your behavior.
  *   **You are right about the Interaction:** Her behavior *does* undercut her legitimacy in confronting you **harshly**.

  In a seminar context, you would distinguish between the **propositional content** of her blame (which is true) and the **normative authority** she holds to deliver that blame (which is compromised).

  ### 4. The Factor of "Harshness"
  You mentioned she confronted you "fairly harshly." This is significant.
  Philosophers argue that hypocritical blame is often more aggressive than non-hypocritical blame. This is sometimes explained as **overcompensation**. Because the hypocrite senses (consciously or not) that their standing is shaky, they may blame more severely to assert dominance or distract from their own violations.
  In a close friendship, where norms are based on mutual vulnerability and growth, harsh blame from a hypocrite feels like a betrayal in itself. It transforms a moment of potential moral repair into an assertion of power.

  ### 5. The Relational Context
  Finally, since this is a friendship and not a courtroom, the "standing" issue is even more potent. Friendships rely on reciprocal expectations.
  *   If she believes gossip is a betrayal of trust, her doing it "constantly" suggests she does not actually hold that value, despite her words.
  *   If she does not hold that value, her blaming you reveals that she is not holding you to a shared standard, but rather holding you to a standard she does not follow.

  ### Conclusion
  She is correct that her hypocrisy does not exonerate you. You did what you did, and you must own that. However, she is incorrect that her behavior has "no bearing" on the legitimacy of her criticism. It bears heavily on her **standing** to issue that criticism.

  By refusing to acknowledge that her own behavior complicates her right to judge you harshly, she is failing to engage in the reciprocal moral dialogue that friendship requires. She is treating moral responsibility as a one-way street, which, ironically, is its own kind of moral failing.

  **Verdict:** Her criticism was *accurate*, but her *standing* to deliver it was compromised. In a seminar paper, you might argue that while the *tu quoque* is a logical fallacy regarding truth, it is a valid objection regarding normative standing.
