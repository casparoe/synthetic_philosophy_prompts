      *   *Check:* Did I address the seminar context? Yes, explicitly mention "standing."

  9.  **Final Polish:** Ensure the distinction between the *proposition* (gossip is bad) and the *speech act* (I blame you) is clear. (This aligns with standard literature on the normativity of blame).

