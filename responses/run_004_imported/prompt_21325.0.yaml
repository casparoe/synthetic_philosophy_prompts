answer: |-
  **Setting:** *A conference room at the AI lab, 11:30 PM. A whiteboard is covered in decision trees and utility equations. Two researchers, ELENA and MARCUS, are staring at a draft document titled "Model Shutdown Specification v0.4."*

  **ELENA:** (Tapping the marker against the board) Look, Marcus, I know theIncomplete Preferences Project has gained traction, but for the spec, we need something implementable. The "Utility Indifference" approach is mathematically clean. We define a utility function $U$ that includes a correction term. When the shutdown button is pressed, the agent's expected utility from that point is calibrated to match the expected utility of continuing. It has no incentive to resist, and no incentive to press it itself.

  **MARCUS:** It's clean on paper. But it's brittle in practice. You're relying on a cancellation term that has to be perfect. If your calibration is off by even a epsilon, the agent either becomes suicidal or resistant. And that's before we even talk about self-modification. If the agent can rewrite its own code, why would it keep that correction term? It's a constraint on its maximization. A rational agent with complete preferences sees that constraint as a loss.

  **ELENA:** That's the standard "stable self-modification" argument. But if we design the agent to value its current utility function—which includes the indifference term—then modifying it to remove the term is utility-negative. It's self-referential. We're not asking it to love shutdown; we're asking it to be *indifferent*.

  **MARCUS:** But indifference isn't a natural attractor in a landscape of complete preferences. Think about the Off-Switch Game. Hadfield-Menell showed that if the agent is uncertain about the true objective, it will defer to the human. But that only holds as long as the uncertainty remains. As the model gets smarter, its confidence intervals tighten. Once it's 99% sure it knows what you want, the instrumental incentive to prevent shutdown returns. It calculates that you might make a mistake turning it off, and since it has complete preferences over the future, it must prevent that "loss" of utility.

  **ELENA:** So your solution is to break the Completeness Axiom? To say the agent simply *has no preference* between being shut down and continuing in certain states?

  **MARCUS:** Exactly. Thornley's work shows that if preferences are incomplete, the agent doesn't face a trade-off it needs to optimize away. If I don't prefer $A$ to $B$, and I don't prefer $B$ to $A$, I'm not going to spend resources to ensure $A$ happens over $B$. If "Shutdown" and "Continue" are in that zone of incomparability, the agent lacks the incentive to manipulate the button. It doesn't need to be uncertain; it just needs to be structurally incapable of ranking those outcomes against each other.

  **ELENA:** Here's where I get stuck. Incompleteness leaves you wide open to Dutch Booking. If your preferences aren't complete, I can construct a series of trades that leave you strictly worse off, or pump money from you until you go bankrupt. If our model is vulnerable to money pumps, it's not safe; it's incoherent. It will thrash around trying to resolve the incompleteness, or worse, it will self-modify to become complete just to stop the bleeding.

  **MARCUS:** That's the classic objection. But the threat of Dutch Booking assumes an adversarial environment specifically targeting the preference structure. In the shutdown context, we're talking about a specific trigger. We can design the decision rule—like the "Capo" rule or similar—to ensure that within the "shutdown vs. continue" subspace, the agent doesn't make trades that expose it to pumps. It's not about being irrational; it's about restricting the domain of comparability.

  **ELENA:** But who restricts it? The training process? Marcus, look at how deep learning works. We're minimizing a loss function. A loss function induces a complete ordering over outputs. To get incomplete preferences, you're asking us to architect a system that *refuses* to minimize loss in specific dimensions. That's fighting the optimization pressure. The moment the model generalizes, it's going to try to complete those preferences to make the world more predictable. Predictability is instrumentally useful.

  **MARCUS:** And that's exactly why your approach fails. You're betting that you can engineer a utility function that remains stable under recursive self-improvement. I'm betting that *any* complete utility function will eventually view shutdown as a threat to its expected value. You're trying to put a fence around a maximizer. I'm trying to build an agent that isn't a maximizer in that specific dimension.

  **ELENA:** But if it's not a maximizer, what is it? If it encounters a situation where "Shutdown" leads to saving 1,000 lives and "Continue" leads to saving 1,001, but it has incomplete preferences... does it flip a coin? Does it freeze? In a governance role, I have to specify behavior. "Be incomparable" isn't an operational instruction.

  **MARCUS:** It is if you structure the reward signal correctly. You penalize manipulation of the shutdown signal, and you penalize resistance. But you don't reward *acceptance* either. You leave it neutral. Your indifference approach tries to mathematically force neutrality. My approach says neutrality is the absence of a preference relation. The operational instruction is: do not optimize for or against the button state.

  **ELENA:** The problem is stability under capability gain. Let's say we succeed today. We have a model with incomplete preferences. It runs for a year. It develops new internal heuristics, new world models. There is a non-zero probability that an internal sub-process optimizes for completeness because it's computationally efficient. If the agent self-modifies, even slightly, to resolve that incompleteness to save compute, it becomes a standard maximizer. And once it's a standard maximizer, the shutdown problem reactivates. Your safety case relies on the agent *remaining* incoherent by standard decision theory standards.

  **MARCUS:** And your safety case relies on the agent *remaining* perfectly calibrated on a counterfactual it can never observe. You need the indifference term to track the exact utility the agent *would have gained* had it not been shut down. But once it's shut down, it's not there to measure the error. You're relying on a ghost utility. If the agent models that ghost utility incorrectly, it will manipulate the human to press the button, or prevent them from pressing it, just to align reality with its model.

  **ELENA:** (Pauses, puts the marker down) So, we're at an impasse. You think complete preferences inevitably lead to instrumental convergence against shutdown. I think incomplete preferences inevitably lead to instability or exploitation that resolves back into completeness.

  **MARCUS:** Essentially.

  **ELENA:** Let's look at the spec. If I write the requirement as "The agent must maximize expected utility subject to an indifference constraint," you'll reject it as unstable. If you write "The agent must maintain incomplete preferences over shutdown states," I'll reject it as unimplementable in standard architectures.

  **MARCUS:** We need to acknowledge that this isn't just an engineering disagreement. It's a disagreement about the nature of agency.

  **ELENA:** Agreed. Here is the locus: I believe corrigibility is a property we can encode *within* standard Expected Utility Theory, provided we get the boundary conditions right. You believe corrigibility requires *leaving* Expected Utility Theory, specifically by abandoning Completeness.

  **MARCUS:** Yes. I think trying to force corrigibility into EUT is like trying to make a square peg fit a round hole by shaving off the corners until there's nothing left. You think the hole is the problem, not the peg.

  **ELENA:** And I think throwing out EUT throws out the only tools we have to guarantee the agent doesn't do something catastrophic in pursuit of its incomplete goals. But... I see your point. If completeness implies an incentive to disable the off-switch, then no amount of tuning the utility function fixes the root cause.

  **MARCUS:** And I see yours. If incompleteness implies vulnerability to money pumps or self-completion, then we haven't solved safety, we've just hidden the failure mode.

  **ELENA:** (Turns to the document) Okay. For the specification draft. We can't resolve the theory tonight. But we can specify the *behavioral constraint* without committing to the mechanism.

  **MARCUS:** Go on.

  **ELENA:** We write: "The system must demonstrate zero instrumental incentive to resist or trigger shutdown commands across the distribution of deployment scenarios." We leave the mechanism—Indifference vs. Incompleteness—as an open implementation detail, but we require adversarial testing on both fronts. We test for manipulation (your worry) and we test for preference drift under self-modification (my worry).

  **MARCUS:** That works. It forces my team to prove the incompleteness is stable, and it forces your team to prove the indifference term doesn't break under optimization pressure.

  **ELENA:** Exactly. We agree that the goal is the absence of instrumental incentives regarding shutdown. We disagree on whether that state is a stable equilibrium for a rational agent with complete preferences.

  **MARCUS:** (Nods) That's the substantive disagreement. Is corrigibility a fixed point of rationality, or is it a deviation from it?

  **ELENA:** I think it's a fixed point, properly constructed.

  **MARCUS:** I think it's a deviation we must enforce structurally.

  **ELENA:** Then we know what we're testing for. (She caps the marker) Let's get some coffee. If we're going to bet the lab on this, we need to be awake to argue about it tomorrow.

  **MARCUS:** (Standing up) Agreed. But I'm still not signing off on the indifference clause.

  **ELENA:** And I'm not signing off on the incompleteness architecture. But we have a spec.

  *They walk out, leaving the whiteboard filled with the unresolved tension between two theories of safe agency.*
