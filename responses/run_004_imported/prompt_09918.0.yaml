      *   *Endurantism:* High stakes. If the brain is destroyed (even during vitrification or upload), the *whole* you is gone. A revival is a replica. Dread is rational.
      *   *Perdurantism:* Lower stakes (metaphysically). The worm extends. If there's continuity (even via scanning), the worm continues. However, branching (teleporter) creates two worms. Which one am I? I am the whole worm, so I am *both* (or the pre-branch part). Dread might be misplaced if the worm continues.
