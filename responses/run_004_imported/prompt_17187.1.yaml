prompt: |-
  Okay this is gonna sound like a wierd thing to be stuck on but my AP Psych class has had me thinking about it for like a week. We did the whole unit on the replication crisis (power pose, ego depletion, all the studies that fell apart when people tried to redo them), and at one point my teacher said something like "part of why this happened is actually a fight between two different philosophies of statistics, frequentist vs Bayesian" and then just moved on to the next slide without explaining it AT ALL. So I went home and tried to google it and every explanation just stops at "frequentists use p-values, Bayesians update priors," which fine, I already basically knew that, but nobody actually shows WHY that difference would cause a bunch of "statistically significant" findings to turn out to be false. The one semi-useful thing I found was some stats forum mentioning "Lindley's paradox," where apparently you can get a result that passes the normal p<0.05 test no problem, but if you ran the Bayesian version on the exact same data it would say there's basically no real evidence for the effect. That sounded made up to me honestly but the post acted like it was a real, well-known thing.

  Can you make up a concrete toy example (fake numbers totally fine, doesn't need to be a real study) where this actually happens, and walk me through why the two methods end up disagreeing so badly on identical data? And can you connect it back to the replication crisis stuff, like why a field could end up flooded with "significant" results that a Bayesian looking at the same data the whole time would've been way more skeptical of? Please explain it assuming I only barely know what a p-value is and have no idea what a prior or a "Bayes factor" even is, because my friend tried explaining it to me with Bayes factors this weekend and I got more lost than before.
