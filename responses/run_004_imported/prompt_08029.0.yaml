      *   **Key Constraint:** Avoid the standard "never lose who you are as individuals" advice (contradicts her philosophy).
      *   **Key Constraint:** Address the philosophy's implications for marriage *and* families/in-laws (roles extend beyond the couple).
      *   **Key Constraint:** Include one genuine laugh line about the "be yourself" vs. role ethics gap (must feel like love, not a lecture).
      *   **Length:** Roughly 5 minutes (approx. 750-900 words spoken at a moderate pace).
      *   **Tone:** Warm, insightful, respectful, celebratory, accessible but intellectually honest.

  2.  **Deconstruct Confucian Role Ethics (Ames & Rosemont):**
      *   *Core Tenet:* There is no "abstract self." We are the sum of our roles (father, daughter, teacher, friend).
      *   *Implication for Marriage:* Marriage isn't two individuals coming together; it's the creation of new roles (husband, wife) that constitute who they *are*.
      *   *Implication for Family:* It's not just about the couple. It's about the expansion of the network. You gain parents, siblings, ancestors. *Zhengming* (rectification of names) implies living up to the responsibilities of these new titles. *Li* (ritual/propriety) is the glue.
      *   *The "Be Yourself" Irony:* Telling her to "be herself" is nonsensical in her framework because "herself" is exactly these relationships.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the dual audience. Establish the relationship (writer profiling the friend). Set a warm tone.
