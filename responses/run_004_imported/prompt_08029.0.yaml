answer: |-
  Good evening. For those who don't know me, I'm [Name]. I write about science and ideas, and a few years ago, I had the privilege of profiling [Bride]'s research for a magazine. I spent weeks trying to wrap my head around her work on Confucian role ethics.

  For the half of the room who are philosophers: you know the drill. For the half who are family: basically, [Bride] argues that we aren't isolated little selves walking around waiting to bump into people. She argues that we *are* the relationships we inhabit. You aren't a person who *has* a daughter, a friend, or a colleague. You are a parent, a friend, a colleague. The relationship doesn't happen to you; it makes you.

  This creates a unique challenge for a wedding toast. Usually, this is the part where I tell the couple, "Never lose who you are as individuals." But if I say that to [Bride], she'll know I didn't read her footnotes. And technically, according to her last book, there is no "individual" to lose.

  [Bride] told me that [Groom], who is not a philosopher, has more than once told her sincerely that all he wants is for her to "just be herself." She finds this quietly hilarious. And I have to say, looking at him, I think he's stumbled onto something profound. Because while "be yourself" is a category error in her seminar, in this room, it's the truest thing we can say. He loves the specific, irreplaceable knot of relationships that stands before him.

  But if we take her work seriously—and we should, because it's beautiful—it changes what we're celebrating today.

  In the Western view, marriage is often a merger. Two complete entities signing a contract to share assets and space. But in the view [Bride] has dedicated her career to, marriage is an act of *becoming*. Today, you are not just adding a spouse to your resume. You are fundamentally altering your ontology. You are ceasing to be single and becoming "husband" and "wife." These aren't just labels you wear; they are roles you inhabit that will reshape how you walk through the world. You are building a new center of gravity.

  And this brings me to the most important part of the room: the families.

  Role ethics teaches us that you cannot separate a person from their context. You cannot love the branch without honoring the root. So, [Groom], when you marry [Bride], you aren't just gaining a partner. You are taking on a role in her history. You are becoming a son to her parents, a brother to her siblings. And [Bride], the same for you.

  To the parents here: In this framework, you aren't "losing" a child today. You are expanding the network. You are gaining a new role to fill, and new people to call your own. The Confucians call this the rectification of names—*zhengming*. It means living up to the title you hold. So, my wish for you isn't that you maintain your independence. It's that you lean into the dependence.

  My wish is that you find your freedom *in* the obligations you take on. That when you make coffee for each other in the morning, or call your in-laws on a Sunday, or navigate the hard stuff that no one talks about at weddings, you aren't doing it as a sacrifice of your "true self." You are doing it because that is how you build the self you want to be.

  [Bride] spends her life studying how we are made by each other. Today, she gets to live it.

  So, if you could all raise a glass.

  To [Bride] and [Groom]. May you never try to stand apart from each other. May you be defined by your care for one another. And may you always, in the deepest, richest, most philosophical sense possible, be yourselves.

  To the couple.
