      *   *Correction:* Ensure *li* (ritual) is mentioned implicitly (the wedding itself) without using the Chinese term necessarily, or using it gently. Let's keep the Chinese terms minimal for the family's sake, maybe just one for the philosophers to nod at. Let's use *zhengming* lightly.

