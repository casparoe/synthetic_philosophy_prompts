          *   *Metaphor:* We aren't atoms bouncing around; we are knots in a net. Or better: We are the stories we tell together.
          *   *Focus:* Identity isn't something you *have*; it's something you *do* with others.
      *   **Addressing the Couple:** Marriage isn't a merger of two existing companies; it's starting a new practice.
      *   **Addressing the Families (Crucial Constraint):** Role ethics emphasizes the extension of roles. New in-laws aren't "added on"; they become *parents*.
          *   *Concept:* You aren't just gaining a spouse; you are gaining a lineage.
      *   **Closing:** A wish for the future. Not "individual growth," but "flourishing together."

  4.  **Refining the Tone:**
      *   *Avoid:* "As Confucius said..." (Too lecture-y).
      *   *Avoid:* "Ontological status..." (Too academic).
      *   *Aim:* "We are made of each other."
      *   *Check:* Is the joke kind? Yes, if it highlights the fiancé's intuitive wisdom despite the technical contradiction.

  5.  **Drafting - Step-by-Step (Mental or Scratchpad):**

      *   *Intro:* Hi, I'm [Name]. I write about ideas. I wrote about [Bride]'s work.
      *   *The Joke:* [Groom] says "be yourself." [Bride] laughs. Why? Because she argues there is no self without relationships. But actually, he gets it better than the philosophers.
      *   *The Philosophy:* Western view = distinct selves meeting. Confucian view = we are the roles. Parent, child, friend.
      *   *The Marriage:* Today you aren't losing freedom; you are gaining definition. You are becoming "Husband" and "Wife."
      *   *The Families:* To the parents/in-laws. You aren't losing a child. You are gaining a role. The network expands.
      *   *Conclusion:* Raise a glass. To the roles that make us real.

  6.  **Polishing and Timing:**
