      *   *Idea 5: Admiration (avoiding the constraint).* Can't use admiration.
      *   *Idea 6: Envy.* Object: Someone's talent. Reason: Their talent makes me look bad. Object-given? Yes. RK? No.
      *   *Idea 7: The "Guise of the Good" / Normative Conflicts.*

      *Refining Idea 3 (Contempt/Disdain):*
      *   Attitude: Contempt.
      *   Object: A person with a low moral character? No, that's RK.
      *   Object: A person with a specific trait that is *not* a vice but is distinctive.
