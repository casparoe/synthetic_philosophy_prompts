prompt: |-
  In my metaethics seminar we've been working through the wrong kind of reasons (WKR) problem for fitting-attitude analyses of value. The stock illustration is the demon who will torture you unless you admire him: you clearly have a reason to admire him, but it is the wrong kind of reason, since it says nothing about whether he is admirable. The usual diagnosis, following Parfit, is that such a reason is state-given (grounded in facts about the state of admiring) rather than object-given (grounded in facts about the object itself), and that only object-given reasons are of the right kind. I'd like you to put pressure on that diagnosis by constructing an example — not a variant of the demon case, and not a Pascal's-Wager-style case about belief — in which an agent has a reason to adopt some other fitting attitude (fear, contempt, gratitude, remorse, or the like) that is naturally object-given in Parfit's sense, yet still strikes us, on reflection, as the wrong kind of reason for that attitude. Then explain what your example shows about whether the object-given/state-given distinction can really do the work it is supposed to do in solving the WKR problem.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Metaethics, specifically the Wrong Kind of Reasons (WKR) problem for Fitting-Attitude (FA) analyses of value.
      *   **Standard View:** Parfit's distinction between Object-Given Reasons (OGR) and State-Given Reasons (SGR). OGRs are the "right kind" (RK), SGRs are the "wrong kind" (WK).
      *   **Task:** Construct a counterexample to Parfit's diagnosis.
      *   **Constraints:**
          *   Not a variant of the Demon Case (threats/pragmatic benefits).
          *   Not a Pascal's Wager-style case (belief/pragmatic utility).
          *   Must involve a *fitting attitude* other than admiration (e.g., fear, contempt, gratitude, remorse).
          *   The reason must be *Object-Given* (grounded in facts about the object) but intuitively still the *Wrong Kind*.
      *   **Goal:** Explain what this shows about the viability of the OGR/SGR distinction for solving the WKR problem.

  2.  **Deconstruct the OGR/SGR Distinction:**
      *   *Object-Given:* Reasons that cite properties of the object of the attitude (e.g., "He is dangerous" is a reason to fear *him*).
      *   *State-Given:* Reasons that cite properties of holding the attitude (e.g., "Believing this makes me happy" is a reason to *have the belief*, not a reason the proposition is true).
      *   *The WKR Problem:* FA analysis says $X$ is good iff it is fitting to favor $X$. But there are reasons to favor $X$ that don't make $X$ good (e.g., the demon threat). Parfit says: Ignore SGRs, count only OGRs.
      *   *The Challenge:* Find a case where a reason is OGR (about the object) but still doesn't make the attitude fitting (WK).

