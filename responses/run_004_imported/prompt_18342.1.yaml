      *   *The Condition:* Theophilus says the man must be told "Here is a cube and a sphere." Why? To limit the hypothesis space. If the man sees two shapes but doesn't know *what* categories they belong to, he can't apply the geometric definitions. If he knows "One is a cube, one is a sphere," he can look for the defining geometric feature (vertices vs. smoothness).
      *   *Does the Condition Concede to Locke?* Locke says there is *no* necessary connection between the tactile idea and the visual idea. Leibniz says there *is* a necessary connection because both map onto the same rational/geometric truth. Telling him "these are the options" doesn't tell him "this visual pattern = that tactile feeling." It tells him "apply your geometric knowledge to these visual inputs." Locke would say he still wouldn't know which visual pattern corresponds to the tactile definition without prior experience. Leibniz says the geometric definition *is* the bridge.

