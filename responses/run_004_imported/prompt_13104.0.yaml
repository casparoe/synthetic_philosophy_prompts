answer: |-
  This is a fantastic seminar prompt. You are right to sense that the standard "Leibniz says mechanism fails, Illusionism says mechanism succeeds" summary is too shallow. The real friction point isn't about whether the brain is a machine; it's about the **ontological status of the "seeming" itself.**

  Frankish and Dennett can happily agree with Leibniz's empirical claim: *If you walk into the mill, you won't find qualia.* Their explanation is: *Because qualia aren't things to be found; they are user-illusions.* Leibniz's explanation is: *Because perception is the intrinsic state of a simple substance, not the mechanical result of an aggregate.*

  The tension hinges on whether an **aggregate** (the mill/brain) can be the subject of an illusion. Leibniz has specific metaphysical resources to argue that it cannot.

  Here is a reconstruction of that exchange, followed by an analysis of the specific Leibnizian commitments that do the heavy lifting.

  ### The Reconstruction: Leibniz vs. The Illusionist

  **Round 1: The Empty Mill**

  *   **Leibniz:** Suppose we enlarge the brain to the size of a mill. We walk inside. We see gears pushing gears, neurons firing neurons. We do not see "redness," we do not see "pain," we do not see "thought." Therefore, mechanism cannot produce perception.
  *   **Illusionist (Frankish):** Agreed. If you look for phenomenal properties as physical objects or functional states, you won't find them. That is precisely our point. The "what-it-is-like-ness" is a cognitive misrepresentation. The system *judges* that it has ineffable qualities, but that judgment is a functional output of the machinery. You don't find the ghost in the machine because the ghost is just a story the machine tells itself.
  *   **Leibniz:** So you grant that the *seeming* is real? There is an appearance of redness?
  *   **Illusionist:** The *judgment* that there is redness is real. The property of "phenomenal redness" is not.

  **Round 2: The Subject of the Illusion (The Crucial Turn)**

  *   **Leibniz:** You say the machine tells itself a story. But a machine, as you describe it, is an aggregate of parts. It has no true unity. It is a heap of substances, not a substance itself. Can a heap *seem*? Can a collection of gears be the subject of a misrepresentation?
  *   **Illusionist:** The "self" that seems is also part of the illusion. It's a "Center of Narrative Gravity." There is no single point where the illusion happens; it's a distributed process.
  *   **Leibniz:** This is where you contradict yourself. An illusion is a mode of being. For an illusion to exist, there must be a *true unity* that is illusioned. If the subject is merely an aggregate, then the "illusion" is just many parts acting in concert. But "acting in concert" does not yield a single perspective.
  *   **Leibniz:** If I say "It seems to me that there is red," the "me" must be one. If the "me" is a mill, then *which part* of the mill is having the seeming? If you say "the whole system," you are attributing a property (unity of experience) to something that is by definition divisible. You are trying to ground a phenomenon (the illusion) in something that is itself merely phenomenal (matter/aggregates).

  **Round 3: Grounding the Phenomenon**

  *   **Illusionist:** We don't need a metaphysical soul. We just need a functional architecture that produces the report "I am conscious."
  *   **Leibniz:** But reports require a representer. For Leibniz, **perception is representation.** To represent the multitude (the gears, the world) in a single state requires a **simple substance.**
  *   **Leibniz:** You claim the "phenomenal consciousness" is an illusion. I agree it is not mechanical. But for that illusion to be *real* (i.e., for there to be an actual appearing, even if mistaken), it must be grounded in a real monad. You cannot have free-floating appearances.
  *   **Leibniz:** So, if your illusionism is true, it inadvertently proves my monadology. There *must* be a simple substance underlying the brain that is actually doing the "illusioning." The brain is just the machine; the monad is the thing being fooled. But if the monad is being fooled, then perception (the state of the monad) is real, even if its *content* (that it is non-functional) is mistaken. You cannot reduce the perceiver to the mill.

  ***

  ### Leibniz's Specific Resources

  To help your students articulate this, you can point to three specific commitments in the *Monadology* that prevent Leibniz from conceding to Illusionism.

  #### 1. The Argument from Unity (Monadology §13–16)
  Illusionism typically treats the brain as the subject. For Leibniz, the brain is an aggregate (*phenomenon bene fundatum*). Aggregates derive their reality from the simples that compose them.
  *   **The Tension:** Illusionism says the "subject" is a fiction generated by the aggregate.
  *   **Leibniz's Counter:** Fictions cannot generate other fictions *ex nihilo*. If there is an experience (even an illusory one), there must be a true subject of that experience. A machine has no "I." Therefore, if there is an "I" being illusioned, it is not the machine. It must be a monad.
  *   **Seminar Point:** Leibniz forces the Illusionist to choose: Either admit there is a real subject (a monad) having the illusion, or admit that the illusion itself is nothing (which contradicts the fact that we are discussing it).

  #### 2. Perception as Expression, not Causation (Monadology §14, §17)
  Leibniz defines perception not as a causal impact (like light hitting a retina) but as the **expression of the multitude in the simple.**
  *   **The Tension:** Illusionists treat the "feeling" as a functional output caused by neural processing.
  *   **Leibniz's Counter:** Mechanism explains *efficient causation* (parts pushing parts). It cannot explain *expression* (how one state mirrors the universe). Even if the "quality" of the experience is a misrepresentation, the *representational capacity* itself is the fundamental nature of substance.
  *   **Seminar Point:** For Leibniz, you can't have a system that *misrepresents* itself as having perception unless it is already the kind of thing that *perceives* (i.e., a monad). A mill cannot misrepresent itself as a mind because a mill cannot represent at all. Only a mind can misrepresent itself.

  #### 3. Appetition and the Reality of Striving (Monadology §15, §19)
  Consciousness for Leibniz isn't a static picture; it's a transition driven by *appetition* (an internal striving toward new perceptions).
  *   **The Tension:** Illusionism explains the *report* of agency/feeling via deterministic or probabilistic mechanical laws.
  *   **Leibniz's Counter:** The internal striving is the reality of the substance. If the "feeling of effort" is an illusion, the *activity* of the substance is still real. Mechanism deals with external relations; appetition is internal.
  *   **Seminar Point:** Leibniz can argue that Illusionism confuses the *object* of awareness (which might be misrepresented) with the *act* of awareness (which is the real state of the monad). The mill argument shows you can't find the *act* in the gears. Illusionism says the *act* is a fiction. Leibniz says a fiction requires a real act to sustain it.

  ### The Verdict for the Seminar

  Does Leibniz have to concede? **No.**

  He does not have to concede that consciousness is *merely* an illusion, because for Leibniz, **the illusion itself is a mental state.**

  *   **Frankish/Dennett:** "The magic is fake." (Implies: The brain is real, the magic is not).
  *   **Leibniz:** "The magic is the only real thing; the brain is the shadow." (Implies: The experience is real [as a monadic state], the mechanical explanation is the abstraction).

  **The Winning Move for Leibniz:**
  Leibniz can accept the Illusionist's description of the *content* of consciousness (that it seems ineffable but isn't) while rejecting their description of the *substrate*.
  *   **Illusionist:** "It seems like there's a non-functional qualia, but there isn't."
  *   **Leibniz:** "Correct. There is no non-functional qualia in the mill. But the 'seeming' is the perception of a monad. The mill is just the phenomenon accompanying it. You have correctly identified that mechanism yields no perception, but you incorrectly conclude that perception is therefore unreal. Rather, mechanism is unreal (as a substance), and perception is the only reality."

  ### Potential Student Pushback (To keep it honest)

  To ensure the seminar doesn't become a Leibniz love-fest, you should anticipate where Leibniz is vulnerable:

  1.  **The Homunculus Worry:** Leibniz insists a true unity is needed for the illusion. Is he just positing a little man inside the monad who is being fooled? (Leibniz would say no, the monad *is* the perspective, not a container for one).
  2.  **Explanatory Power:** Illusionism offers a path to scientific investigation (how does the brain generate the user-illusion?). Leibniz offers a metaphysical guarantee (it must be a monad) but no mechanism for *how* the illusion arises. Illusionists might argue Leibniz explains the *necessity* of the subject but fails to explain the *contingent details* of the illusion.
  3.  **Panpsychism Creep:** If every monad perceives, and the brain is made of monads, does the brain itself perceive? Leibniz says no (aggregates don't perceive), only the dominant monad does. Students might find this distinction arbitrary compared to the Illusionist's functional threshold.

  ### Summary for your Prep
  The Mill Argument is usually read as "Mechanism can't produce X." Illusionism replies "X doesn't exist."
  Leibniz's deeper reply, grounded in his metaphysics, is: **"For 'X doesn't exist' to be a meaningful claim, there must be a subject for whom it seems that X exists. That subject cannot be the Mechanism. Therefore, the Mechanism is not the ultimate reality."**

  Leibniz doesn't need to prove qualia are real properties of matter; he needs to prove that *appearances* require *substances*. Illusionism tries to have appearances without substances (just functional systems). Leibniz's ontology forbids this. That is the tension your students are sensing.
