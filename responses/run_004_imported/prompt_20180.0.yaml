answer: |-
  Here is the ruling on your dispute.

  Priya played a clean Nozickian game. She correctly identified that if the starting point (hourly wage) was agreed upon, and the transactions (tips) were voluntary, then interfering with the outcome (pooling tips) violates liberty. In a strict libertarian framework, she wins.

  However, you are not living in Nozick's libertarian utopia; you are working a double shift in a bar. Here is why Priya's argument fails in your specific context, utilizing G.A. Cohen's critiques and a crucial loophole in the Wilt Chamberlain analogy itself.

  ### 1. The "Starting Point" Trap
  You asked if it matters that neither of you chose the 'equal wage' starting point.
  **Nozick's View:** He wouldn't care. As long as the wage wasn't coerced (you weren't held at gunpoint to take the job), the starting distribution is just.
  **The Comeback:** The Wilt Chamberlain argument assumes the starting point is a distribution of *private property* that individuals own absolutely. In your bar, the "starting point" isn't just the wage; it's the **working environment**.

  If the bar is a cooperative venture (which a shift usually is), the "starting point" includes the expectation of teamwork. If the owner set an equal wage but a competitive tip policy, they created a contradiction. Priya is treating the bar like a free market; you are treating it like a cooperative. Nozick assumes a market; Cohen asks why we assume the market is the only valid social structure.

  ### 2. Cohen's Bite: Morally Arbitrary Advantages
  This is the specific Cohen ammunition you were looking for. Cohen argues that Nozick ignores *why* people make voluntary transfers.

  In the Wilt Chamberlain example, people pay Wilt because he is incredibly talented. Nozick says, "They choose to pay him, so he deserves it." Cohen asks: **Did Wilt choose to be talented?**
  *   If Priya makes more because she works harder (stays late, cleans faster), Nozick is right.
  *   If Priya makes more because she is naturally charming, attractive, or has a personality that clicks with regulars (traits largely determined by genetics and upbringing), Cohen argues this is **morally arbitrary luck**.

  **The Argument:** You cannot claim moral desert (deservingness) over advantages you did not choose. If Priya's tip advantage comes from unchosen traits (charm/looks) rather than chosen effort, Cohen argues that redistributing that luck (pooling tips) is not a violation of justice, but a correction of unfair luck. Nozick says liberty trumps equality; Cohen says equality is a prerequisite for true liberty.

  ### 3. The "Joint Production" Loophole (The Real Killer)
  This is where Priya's Wilt Chamberlain analogy actually breaks down, even without Cohen.

  Wilt Chamberlain plays basketball. When he scores, *he* scored. The value is individually identifiable.
  Bartending is **joint production**.
  *   When the bar is busy, it's busy because *both* of you are working.
  *   If you weren't there handling the well drinks, Priya couldn't spend time chatting up the regulars for big tips.
  *   If she weren't there handling the regulars, you might be stuck with a dead bar.

  **The Implication:** The tips are not generated solely by Priya's interaction. They are generated by the *atmosphere of the shift*, which is a shared resource.
  *   **Nozick's Error here:** He assumes the value transferred belongs entirely to the receiver.
  *   **Your Comeback:** "Priya, Wilt scores goals alone. We serve drinks together. My labor increases your tip potential by keeping the line moving; your labor increases mine by keeping the customers happy. The tips are a product of the *shift*, not the *individual*. Pooling isn't redistribution of your property; it's acknowledging joint ownership of the revenue stream."

  ### 4. Pooling vs. Banning: The Constitutive Rule
  You asked if pooling tips is different from never letting her keep them.
  *   **Nozick:** Yes. Preventing her from receiving them is a prior restraint on liberty. Taking them after is theft.
  *   **Cohen/Contractualist:** No. It is a **constitutive rule** of the game.

  Think of it like soccer. If you score a goal, you can't keep the ball. That's not a violation of your liberty; it's a rule that makes the game possible. If the norm of the workplace is "we are a team," then individual tipping is a violation of the social contract between coworkers.
  Cohen argues that in a true community, people voluntarily uphold egalitarian norms. If Priya invokes "liberty" to break the team norm, she is prioritizing capitalist freedom over communal freedom. You have a liberty to work in a supportive environment that she is violating.

  ### The Verdict: Do You Have a Comeback?
  **Yes.** You lost the debate because you let her frame the bar as a **free market** where you are competitors.

  **Your Closing Argument:**
  > "Priya, Nozick's argument works for a state taxing citizens, not coworkers in a joint enterprise.
  >
  > 1.  **Joint Production:** My labor creates the efficiency that allows you to charm the regulars. The tips are generated by the shift's throughput, which we own 50/50.
  > 2.  **Morally Arbitrary Luck:** Cohen shows that if your advantage comes from unchosen traits (charm) rather than effort, you don't have a moral claim to keep the surplus.
  > 3.  **Liberty:** My liberty to work in a cooperative team is being violated by your liberty to hoard shared value.
  >
  > We aren't Wilt Chamberlain. We're point guards playing the same position. Pooling isn't theft; it's recognizing that the revenue belongs to the shift, not the server."

  **Practical Advice:** Philosophically, you have the high ground on "Joint Production." Practically? Check your employee handbook. If the policy is "keep your own," Nozick wins because you agreed to the owner's rules. If the policy is vague, push for pooling based on the "Team Shift" argument. If Priya refuses, she's prioritizing philosophical purity over your friendship and team cohesion.
