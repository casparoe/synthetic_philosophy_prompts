  "My pension relies on the state functioning. When it breaks, poets starve first."
  "Körner starved for nothing, then? He died singing while you counted coins."
  "Körner died a soldier. I am a councilor. There is a difference in duty."
  "Your duty is to truth! Instead you hide behind 'order' because it keeps your chair warm."
  "I hide behind order because I saw disorder in Paris. It eats its children."
  "So we should accept injustice because the alternative is messy?"
  "I accept it because I know the weight of it. You only know the heat of the torch."
  "We know the weight of the future. You are anchored to 1806."
  "1806 taught me that when the French sacked Weimar, it was administration, not banners, that saved us."
  "Administration protects the building. Freedom protects the man inside."
  "Freedom without law is a room with no walls. The wind kills you faster than the king."
  "Then build the walls with us! Give us your name. The students listen."
  "If I lead you, I lead you to compromise. You want martyrdom."
  "We want a nation. You want a quiet study."
  "I want a nation that lasts longer than a semester's fervor."
  "Then you are no better than the censors who watch our meetings."
  "The censors watch words. I watch history. It is a heavier burden."
  "History will judge your silence harder than your words."
  "History is written by survivors, Anton. Ensure you are one."
  "We won't hide. Not like you."
  "I do not hide. I endure. There is a distinction."
  "For how long? The wind is changing."
  "Winds change. Stones remain. Let us see which breaks the other."
