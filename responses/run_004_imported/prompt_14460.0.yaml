answer: |-
  A Wrightian and a Cumminsian are called into a failure analysis meeting at a med-device firm after a batch of porcine valves stops pumping during trials.

  The VP slides the data across the table. "Did these valves malfunction?"

  The Cumminsian scans the charts. "Strictly speaking, no. At time *t*, their causal role was 'impeding flow'. They performed that contribution flawlessly. To call it a malfunction is to impose an etiological norm on a current capacity."

  The Wrightian rubs his temples. "They were selected to pump. They didn't. They're broken."

  The VP turns to the Cumminsian. "So you're saying we're not liable?"

  The Cumminsian shrugs. "I'm saying 'liability' assumes the valve *ought* to have done something else. But 'ought' is just history talking. Currently, they are excellent paperweights."

  The VP nods, stands up, and points to the door. "You're fired."

  The Cumminsian is shocked. "On what grounds? I performed my causal role perfectly!"

  The VP says, "Yeah, but your *selected effect* was 'consultant'. And you malfunctioned."
