      *   *Point 2: The Idolatry of the Collective.* Weil believes truth is individual. Any collective claiming moral authority is an idol. Leaderless movements often claim *higher* moral authority because they claim to be "the people" or "the truth" itself, making them more dangerous, not less.
      *   *Point 3: Self-Growth (The Vegetative).* Parties want votes. Movements want engagement/virality. Both are quantitative measures replacing qualitative justice.
      *   *Point 4: The Absence of Responsibility.* Here's a nuance. Parties have leaders who can be blamed. Leaderless movements have no head. Weil might see this as *worse* because force is exerted without a human agent to hold accountable. It becomes pure "force" (la force).
      *   *Conclusion:* She would likely view them as the *purest* form of the party spirit, stripped of the pretense of structure.

  5.  **Refining the Argument (Checking against Weil's Philosophy):**
