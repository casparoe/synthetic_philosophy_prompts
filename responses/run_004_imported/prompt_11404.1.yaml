answer: |-
  The observation deck of the Institute was shaped like a wedge, glass meeting steel at an acute angle. Julian stood with his back to the city, watching the rain blur the lights below. Behind him, Sarah was pacing the length of the room, her tablet glowing like a lantern in the dim.

  "You're doing it again," Sarah said. "You're looking at the arch and telling me it was built to hold the mosaic."

  Julian turned. "I'm looking at the data, Sarah. Kael's neural density in the parietal lobe is three standard deviations above the mean. His predictive modeling scores are off the charts. The seizures are a metabolic cost, yes, but they're the price of admission."

  "They're not a cost," Sarah snapped, stopping her pace. "They're a structural failure. You're falling into the trap. Gould warned us. Just because a trait *does* something useful doesn't mean it was *selected* for that utility. Kael's brain isn't a Swiss Army knife; it's a cathedral. Those sparks firing in his cortex? That's not a feature. That's the light coming through the cracks where the stones don't quite fit."

  This was the argument that had hollowed out their marriage over the last five years, now resurrected over the file of a seven-year-old boy. Kael was a patient in their care, part of a lineage exhibiting a rare neurological phenotype. He could anticipate patterns in chaos—stock markets, weather patterns, human speech—with terrifying accuracy. But every episode ended in a tonic-clonic seizure that grew longer, more violent.

  Julian walked to the table where the 3D model of Kael's brain hovered in blue light. "If it's a spandrel, Sarah, then it's incidental. It's noise. If I authorize the gene therapy to stabilize the neural firing, I dampen the noise. He lives a normal life. No seizures. But he loses the cognition."

  "And if it's an adaptation?" Sarah asked, her voice dropping. "If that cognitive spike is the *point* of the architecture? If you suppress the firing, you aren't fixing a flaw. You're lobotomizing an evolutionary leap."

  "We don't know," Julian said. "That's the problem. We never know."

  "That's why we don't touch it," Sarah said. "You adaptationists. You see a function and you assume a designer. Nature doesn't design. It tinkers. Kael's brain grew too fast, the wiring got tangled, and the 'gift' is just electricity arcing across the short circuits. If we leave it, the structure collapses. He dies. If we treat it as a spandrel, we reinforce the arch. We might lose the mosaic, but the building stands."

  Julian rubbed his temples. He remembered their first date, years ago, walking through Venice. They had stood under the dome of San Marco, arguing about the gold tesserae. Julian had said the beauty was the purpose; Sarah had said the beauty was just what happened when you tried to keep the rain out. It had seemed romantic then, two minds grappling with the nature of purpose. Now, it was a deadlock that held a child's life in the balance.

  "The parents want the therapy," Julian said softly. "They see the pain. They don't care about the paradigm."

  "The parents see a sick child," Sarah countered. "We are supposed to see the biology. If we treat this as an adaptation, we have an ethical obligation to preserve the phenotype. If we treat it as a spandrel, our obligation is to the host."

  "Make a choice, Sarah."

  "I can't. Because you won't admit the uncertainty." She walked to the window, standing beside him. Her reflection ghosted over the rain-streaked glass. "You want a just-so story. *The Seer Who Paid in Pain.* It's a beautiful narrative. It gives the suffering meaning. That's the danger, Julian. You're addicted to meaning."

  "And you're addicted to nihilism," he shot back. "Everything is accident. Everything is structural constraint. Nothing matters, nothing is *for* anything. If Kael's ability is a spandrel, then his suffering is meaningless noise. If it's an adaptation, his suffering has a function. Which is easier for you to swallow? That his pain is useless?"

  Sarah flinched. The air between them tightened, the scientific abstraction stripping away to reveal the raw nerve beneath. They had lost a pregnancy three years prior. Julian had spent months reading papers on maternal-fetal immune adaptation, searching for a *reason*, a selective pressure that explained the loss. Sarah had retreated into the silence of chance, the biological reality that sometimes arches meet and leave a gap, and nothing fills it.

  "If I sign off on the therapy," Julian said, his voice rough, "I am declaring his mind a mistake."

  "If you don't," Sarah said, "you are declaring his life a sacrifice."

  They stood in silence for a long time. The blue brain pulsed on the table, a rhythm of uncertainty.

  Julian looked at Sarah. He saw the exhaustion in the set of her shoulders. He realized then that their argument wasn't about Kael. It was about whether their own love had been an adaptation—a functional, selected bond meant to ensure survival—or a spandrel, a beautiful, incidental space opened up by the architecture of their proximity, destined to remain empty once the structure shifted.

  If it was an adaptation, their failure meant they were flawed specimens. If it was a spandrel, their failure meant nothing at all.

  "The therapy isn't ready," Sarah said suddenly, turning from the window. "The viral vector still has a ten percent mortality rate."

  "I can improve the vector," Julian said. "Give me a month."

  "A month is two more seizures. Maybe three."

  Julian looked back at the hologram. He reached out and rotated the brain. He zoomed in on the temporal lobe, where the dense clustering of neurons looked like gold leaf pressed into stone.

  "Gould was right about one thing," Julian murmured. "We can't test the past. We can only manage the future."

  "So what do we do?"

  Julian deactivated the hologram. The room plunged into semi-darkness, lit only by the city below. "We ask the parents. But we don't give them a diagnosis. We give them the uncertainty."

  "They won't understand."

  "They don't need to understand the architecture," Julian said. "They just need to know about the mosaic." He looked at Sarah. "If we treat it, we might save the building but lose the art. If we don't, we keep the art but risk the collapse. We tell them that. Not as scientists. As people who know what it is to bet on a structure."

  Sarah studied him. For the first time in years, the defensive rigidity in her posture softened. She wasn't looking for a hypothesis to test him against. She was just looking at him.

  "That's not science, Julian," she said quietly.

  "No," he agreed. "It's parenting."

  Sarah nodded slowly. She picked up her tablet, not to input data, but to set it down on the table, face down. "Okay. We tell them. Together."

  "Together."

  They stood side by side in the wedge-shaped room, the rain blurring the world outside. They hadn't solved the problem. Kael's brain remained a mystery, a black box of adaptation and accident. They didn't know if the gift was the point or the price. But as Sarah's hand brushed against his, tentative and questioning, Julian realized the answer didn't change the weight of the choice.

  Whether it was a spandrel or an adaptation, the space still had to be filled. And they would have to decide, together, what to put there.
