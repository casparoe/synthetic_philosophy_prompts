      *   Make sure to explicitly answer the "why not stipulate natural order" point, as that's the user's main hang-up.

  8.  **Self-Correction/Check during drafting:**
      *   *Correction:* Did Hájek & Nover publish in 2004? Yes, "The Pasadena Paradox" in *Analysis*.
      *   *Nuance:* Make sure to distinguish between the St. Petersburg (diverges to $\infty$) and Pasadena (undefined).
      *   *Clarification:* Ensure the distinction between "order of play" and "order of summation" is clear. The coin flips happen in time, but the expectation is a static property of the random variable.

  9.  **Final Polish:** Check against the user's specific prompts.
