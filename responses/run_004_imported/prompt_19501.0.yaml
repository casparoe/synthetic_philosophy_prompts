answer: |-
  You have indeed fallen down a classic rationalist rabbit hole, and you've got the math right: Hájek and Nover, 2004, *Analysis*. The Pasadena Game is widely considered the "grown-up" version of the St. Petersburg Paradox.

  Your intuition is nagging you for a good reason: on the surface, the "natural order" objection ($n=1, 2, 3...$) seems like a slam-dunk solution. After all, time flows in one direction; the coin lands, we check $n$, we pay out. Why does the mathematical possibility of rearranging the series matter if the physical process has a fixed order?

  The reason decision theorists lose sleep over this isn't just about the math of series; it's about what Expected Utility Theory (EUT) claims to be. Here is the breakdown of why the "natural order" fix fails, why the rearrangement issue is foundational, and how this connects to the fanaticism worries you see in EA circles.

  ### 1. Why "Just Use the Natural Order" Doesn't Work

  The core objection to stipulating the natural order ($n=1, 2, 3...$) is **Description Invariance** (or Redescription Invariance).

  In standard probability theory and decision theory, the value of a gamble should depend on the *probability distribution over outcomes*, not on how we choose to index or label those outcomes. A random variable is a function from a sample space to real numbers. The expectation is an integral over that space.

  If you can change the value of a gamble simply by grouping the states differently, the theory is fragile. Consider this:

  1.  **Description A:** The outcome is defined by the specific toss number $n$ where heads first appears. The expectation is the alternating harmonic series summed in order $1, 2, 3...$, which converges to $\ln(2)$.
  2.  **Description B:** Suppose I define the states differently. Let State $A$ be "Heads on toss 1." Let State $B$ be "Heads on toss 2 or 3." Let State $C$ be "Heads on toss 4, 5, or 6," and so on.

  If I calculate the expected utility by summing over these *grouped* states, I am effectively rearranging the terms of the series (summing a block of negatives, then a block of positives, etc.). By the Riemann Rearrangement Theorem, I can make the expectation come out to $-\$100$, $+\$1,000,000$, or undefined, simply by choosing a different partition of the sample space.

  If EUT says "Take the natural order," it is saying that the value of the gamble depends on the **labeling convention** of the states, not just the probabilities and payoffs. This violates the principle that rational preference should be invariant under equivalent descriptions of the same problem. If the "value" of a gamble isn't an intrinsic property of the gamble itself, but depends on how you write down the sum, then EUT fails to provide a stable guide for action.

  ### 2. Why This is Damning for Expected Utility

  You asked why this is treated as a philosophical crisis rather than a math quirk. It comes down to **Completeness** and **Dominance**.

  **The Silence of the Theory**
  In measure-theoretic probability (the rigorous foundation of modern probability), the expectation $E[X]$ is defined via the Lebesgue integral. A key requirement for the Lebesgue integral to be well-defined is **absolute convergence** (i.e., $E[|X|] < \infty$).
  If a series is only conditionally convergent (like the Pasadena Game), the Lebesgue integral is **undefined**.
  This means EUT literally has *nothing to say* about the Pasadena Game. It cannot tell you if you should pay \$1 to play it, or if you should sell it for \$1. It creates a "hole" in the theory where rational agents are supposed to have preferences. A decision theory that goes silent on clear-cut gambles is incomplete.

  **Violation of Dominance**
  Even worse, variants of the Pasadena setup can violate the **Dominance Principle**.
  Imagine two Pasadena-style games, $A$ and $B$.
  *   In every possible state of the world, Game $A$ pays you exactly \$1 more than Game $B$.
  *   Rationality dictates you must prefer $A$ to $B$.
  *   However, because both have undefined expectations, EUT cannot rank them. In some formulations, you can even construct cases where the "undefined" arithmetic suggests $B$ is better than $A$ depending on how you truncate the series.
  If a decision theory cannot prefer a gamble that pays strictly more in every possible outcome, it has failed its most basic job.

  ### 3. Connection to Fanaticism and Pascal's Mugging

  This is the bonus question, and the answer is: **Yes, but indirectly.**

  **The Difference**
  *   **Pascal's Mugging / Fanaticism:** The expectation diverges to $+\infty$ (or is finite but astronomically large). The problem is that tiny probabilities of huge utilities swamp all mundane concerns. The series blows up.
  *   **Pasadena Paradox:** The expectation is *undefined*. The positive and negative utilities cancel each other out in an unstable way. The series oscillates.

  **The Connection**
  Pasadena is often seen as a deeper, more structural problem than Pascal's Mugging.
  *   Pascal's Mugging can arguably be solved by **bounded utility functions**. If utility is bounded (e.g., you cap the value of saving lives at some point), the expectation becomes finite and the mugging fails.
  *   The Pasadena Paradox *also* disappears if you have a **bounded utility function**. If the payoffs are bounded, the series becomes absolutely convergent (since the probabilities sum to 1), and the expectation is well-defined regardless of order.

  **The Takeaway for EA/Longtermism**
  The Pasadena Paradox is less of a direct threat to Longtermism (which usually posits positive outcomes) and more of a "mathematical sanity check" that forces you to accept **Bounded Utility**.

  Many rationalists resist bounded utility because it implies "scope insensitivity" (e.g., saving $N+1$ lives isn't always better than saving $N$ lives if you're near the bound). However, Pasadena shows that **unbounded utility is mathematically pathological**.
  *   If you keep unbounded utility, you get Pasadena (undefined expectations) and St. Petersburg (infinite expectations).
  *   If you accept bounded utility, you solve Pasadena, St. Petersburg, *and* Pascal's Mugging all at once.

  So, while Pasadena itself (alternating positive/negative payoffs) doesn't look like a typical EA intervention, the *solution* to Pasadena (bounding utility) is the same solution required to tame the fanaticism worries in EA. It suggests that the "pathology" isn't just a mathematician's curiosity; it's a signal that our formal model of value (linear, unbounded utility) does not map cleanly onto reality.

  ### Summary
  The "natural order" fix fails because it makes the value of a gamble dependent on arbitrary labeling rather than the underlying probability structure. Decision theorists treat this as damning because it renders Expected Utility Theory incomplete (it can't evaluate the gamble) and potentially inconsistent (violating dominance).

  Regarding fanaticism: Pasadena is the "negative space" version of Pascal's Mugging. Both arise from the same root cause—unbounded utility combined with infinite outcome spaces. Accepting the lessons of Pasadena (likely, that utility must be bounded) is one of the strongest arguments against the kind of fanaticism that worries critics of the EA movement.
