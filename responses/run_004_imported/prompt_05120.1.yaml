  7.  **Final Polish:** Ensure the distinction between *liquidity* (depth) and *volume* (turnover) is clear, as journalists often conflate them. (Added to the plan).

  8.  **Execute.** (Proceed to generate response).

  *(Self-Correction during final output generation)*: Make sure to explicitly reference the "common prior" aspect. If priors are heterogeneous, trade happens, but it's a clash of worldviews, not necessarily information extraction. This is key for prediction markets where political bias acts as a prior.

