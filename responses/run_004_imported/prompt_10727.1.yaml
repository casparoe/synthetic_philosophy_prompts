answer: |-
  This is a fantastic question. First off, tell your lunch team they sound like my kind of people. Arguing about normative ethics over sandwiches is peak engineering culture.

  You have the formal setup right, but your intuition gap is exactly where the philosophy hides in the math. You're asking: *"Why does the aggregation function have to be a simple weighted sum? Why can't it be a product, or a max function, or something that penalizes inequality?"*

  And regarding Diamond: *"Is the theorem broken, or are we asking it to do something it wasn't designed to do?"*

  Let's build the intuition for both, using your programmer/linear algebra background as the bridge.

  ---

  ### Part 1: Why Linearity? (The Geometry of Indifference)

  Your instinct as a programmer is correct: if you just have a list of scores (utilities), there are infinite ways to aggregate them (`sum`, `avg`, `max`, `min`, `sqrt(sum(squares))`, etc.).

  **The constraint that forces linearity is not the Pareto condition alone; it is the combination of Pareto + the vNM axioms (specifically Independence).**

  Here is the intuition without the heavy measure theory.

  #### 1. Utilities are not just scores; they are slopes.
  In vNM theory, a utility function isn't just a ranking of outcomes (1st, 2nd, 3rd). It is a measurement of how an agent trades off **probabilities**.
  If I prefer Apple to Banana, vNM asks: "At what probability $p$ are you indifferent between a guaranteed Banana and a lottery that gives you an Apple with probability $p$ and Death with probability $1-p$?"

  Mathematically, vNM utility is **linear over probabilities**.
  $$U(p \cdot A + (1-p) \cdot B) = p \cdot U(A) + (1-p) \cdot U(B)$$
  This is the crucial constraint. It means individuals treat lotteries as **expected values**. They don't care about the "shape" of the risk, only the weighted average.

  #### 2. The Hyperplane Argument (Linear Algebra Intuition)
  Imagine a world with just two people (Person 1 and Person 2) and a set of possible outcomes. We can represent any outcome as a point in 2D space $(u_1, u_2)$, where the coordinates are the utility values for each person.

  *   **Pareto Indifference** says: If we move from point $X$ to point $Y$ and nobody's utility changes (both stay on the same level), Society's utility shouldn't change.
  *   This implies that Society's "indifference curves" (lines where Social Welfare is constant) must align with the individuals' indifference curves.

  But here is the kicker: Because individuals satisfy vNM, their indifference curves over *lotteries* are **flat hyperplanes**.
  Why? Because if $u_1$ is linear in probability, the set of all lotteries that yield a specific expected utility $k$ forms a flat plane in the probability simplex.

  **The Geometric Squeeze:**
  1.  Individual 1's preferences define a set of parallel flat planes (level sets).
  2.  Individual 2's preferences define a set of parallel flat planes.
  3.  Society's preferences *also* define flat planes (because Society must satisfy vNM axioms too).
  4.  Pareto says: If a movement keeps Person 1 and Person 2 on their current planes, Society must stay on its current plane.

  In linear algebra terms: If a linear functional (Society) is constant whenever two other linear functionals (Individuals) are constant, the Society vector must lie in the **linear span** of the Individual vectors.

  $$W = c_1 u_1 + c_2 u_2 + \text{constant}$$

  If you tried to make Social Welfare nonlinear (e.g., $W = u_1 \cdot u_2$), the social indifference curves would be **curved** (hyperbolas), not flat planes. But vNM *requires* social indifference curves to be flat planes (because Society must be risk-neutral over probabilities). You cannot fit a curved surface into a flat constraint without breaking the vNM axioms for Society.

  #### 3. The "Programmer" Intuition: Type Safety
  Think of the vNM axioms as a strict type system.
  *   **Input:** Lotteries (probability distributions).
  *   **Constraint:** The `evaluate()` function must be linear with respect to probability mixing.
  *   **Individuals:** `u1(lottery)` and `u2(lottery)` return scalars that satisfy this linearity.
  *   **Society:** `W(lottery)` must also return a scalar that satisfies this linearity.

  If you write `W = u1 * u2`, you are introducing a dependency on the **variance** or **covariance** of the outcomes, not just the expectations.
  *   Example: Imagine two lotteries.
      *   $L_A$: Person 1 gets 10, Person 2 gets 0.
      *   $L_B$: Person 1 gets 0, Person 2 gets 10.
      *   $L_C$: A 50/50 mix of $L_A$ and $L_B$.
  *   In $L_C$, the *expected* utility for each person is 5.
  *   If $W = u_1 + u_2$, then $W(L_A)=10, W(L_B)=10, W(L_C)=10$. (Linear)
  *   If $W = u_1 \cdot u_2$, then $W(L_A)=0, W(L_B)=0$. But what is $W(L_C)$?
      *   If you calculate expected utilities first: $5 \cdot 5 = 25$.
      *   If you calculate expected welfare: $0.5(0) + 0.5(0) = 0$.
      *   **Mismatch.** $25 \neq 0$.

  A nonlinear aggregator violates the vNM **Independence Axiom** at the social level. It implies Society cares about *how* the utilities are correlated across states of the world, not just the expected sum. Harsanyi's theorem basically says: **"If you demand Society be 'rational' (vNM) in the exact same way individuals are, you are mathematically forced into Utilitarianism."**

  ---

  ### Part 2: Diamond's Coin Flip (Fairness vs. Rationality)

  Now to Peter Diamond (1967). You summarized it well: Two people, one indivisible good (say, a kidney).
  *   **Option A:** Give to Person 1. (Utilities: 1, 0)
  *   **Option B:** Give to Person 2. (Utilities: 0, 1)
  *   **Option C:** Flip a fair coin. (Expected Utilities: 0.5, 0.5)

  **Harsanyi's Calculation:**
  Assume equal weights ($w_1 = w_2 = 1$).
  *   Value(A) = $1 + 0 = 1$
  *   Value(B) = $0 + 1 = 1$
  *   Value(C) = Expected Value of ($1 + 0$) and ($0 + 1$) = $0.5(1) + 0.5(1) = 1$.

  **Result:** Harsanyi says Society is **indifferent** between giving it to Person 1 outright or flipping a coin.
  **Diamond's Reaction:** "That's absurd. The coin flip is obviously fairer."

  #### Is this a flaw in the theorem?
  No. It is a flaw in the **premise** that Society should be modeled as a vNM rational agent.

  Diamond is pointing out a category error. Harsanyi assumes "Social Welfare" is just "Individual Welfare scaled up." He assumes Society is a **Single Super-Individual**.
  *   A single individual doesn't care about fairness between their own future selves. If I flip a coin to decide whether I eat pizza today or tomorrow, and the expected calories are the same, I'm indifferent.
  *   But Society is **not** a single individual. It is a collection of distinct entities.

  #### Ex-Ante vs. Ex-Post
  This is the technical distinction that resolves the tension.
  *   **Ex-Post (Harsanyi):** Look at the outcome *after* the coin lands. Either Person 1 has the kidney or Person 2 does. The "fairness" of the coin flip has vanished; all that remains is the inequality of the outcome. Harsanyi sums up the utility of the realized state.
  *   **Ex-Ante (Diamond):** Look at the situation *before* the coin lands. In Option A, Person 2 has a 0% chance. In Option C, Person 2 has a 50% chance. Diamond argues that **opportunity** has intrinsic moral value.

  Harsanyi's theorem rules out caring about *Ex-Ante fairness* because vNM utilities only track *Ex-Post expected value*. To prefer the coin flip, Society must violate the **Independence Axiom**.
  *   Society would be saying: "I prefer the lottery (Coin Flip) over the sure thing (Give to A), even though the expected utility sum is identical."
  *   In vNM land, that is irrational risk-seeking behavior.
  *   In Ethics land, that is **Fairness**.

  #### The Programmer Analogy: Load Balancing
  Imagine two servers (Person 1 and Person 2) and one heavy task (The Kidney).
  *   **Strategy A:** Assign task to Server 1. Server 1 load = 100%, Server 2 load = 0%.
  *   **Strategy B:** Randomly assign task (50/50). Expected Server 1 load = 50%, Expected Server 2 load = 50%.

  If your monitoring system (Harsanyi) only tracks **Total Throughput** (Sum of Utilities), both strategies look identical. Total capacity used is 100% in both cases.
  But if you care about **Server Longevity** (Fairness/Equality), Strategy B is strictly better because it prevents Server 1 from burning out while Server 2 sits idle.

  Diamond is saying: "Your monitoring system is missing a metric."
  Harsanyi replies: "My system is mathematically proven to be the *only* consistent system if you only care about Throughput."

  ### Summary for your Lunch Team

  1.  **Why Linearity?**
      It comes from the **vNM Independence Axiom**. If Society is "rational" (treats lotteries linearly), and Individuals are "rational" (treat lotteries linearly), and Society respects Individual preferences (Pareto), then Society's utility function must be a linear combination of Individual utility functions. Any nonlinearity (like inequality aversion) implies Society cares about risk/distribution in a way that violates the vNM axioms.

  2.  **What about Diamond?**
      Diamond isn't disproving the math; he's rejecting the **moral premise**. He argues that Society *should* violate the vNM Independence Axiom. We *should* prefer the coin flip, even if the expected utility sum is the same. This means we have to choose:
      *   **Harsanyi:** Keep "Social Rationality" (vNM axioms) $\rightarrow$ Accept Utilitarianism (Indifferent to coin flip).
      *   **Diamond:** Keep "Fairness Intuitions" $\rightarrow$ Reject "Social Rationality" (Society is not a vNM agent).

  **The Takeaway:** Harsanyi's theorem is a "Consistency Theorem." It tells you that you can't have it all. You cannot have a Social Welfare function that is (1) vNM-rational, (2) respects Individual preferences, AND (3) cares about fairness of opportunity (ex-ante). You have to drop one. Most modern welfare economists drop (1) when dealing with fairness, effectively admitting Diamond was right that Society isn't just a Big Person.

  Tell your coworkers that Harsanyi proves Utilitarianism is the only *consistent* game in town, but Diamond proves that consistency might be overrated when lives are at stake. That should keep the argument going for another few weeks.
