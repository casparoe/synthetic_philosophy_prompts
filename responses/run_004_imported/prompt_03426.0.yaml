answer: |-
  This is a classic "letter of the law" vs. "spirit of the law" conflict, compounded by a sudden change in stakes (from one night of dishes to a whole week).

  Here is the breakdown of why you are both stuck, who has the stronger logical footing, and how to fix it without ruining the roommate dynamic.

  ### 1. The Analysis: Who is "Right"?

  **The Roommate's Argument (The Letter of the Law)**
  Technically, on the calendar day in question, you crossed the threshold of the apartment later than she did. If you treat the rule as a rigid algorithm (`IF time_A > time_B THEN dishes_A`), she is correct. She is likely feeling that rules are rules, and making an exception now sets a precedent that you can wiggle out of chores whenever you have a "reason."

  **Your Argument (The Spirit of the Law)**
  The intent of the rule is to balance daily labor based on daily availability and energy. It operates on the assumption that you are both living normal days.
  *   **Precedent:** For 3 years, this rule has applied to *evenings out*, not *overnight absences*.
  *   **Context:** Returning from a work trip at 1 AM is fundamentally different than returning from a bar at 1 AM. One is leisure/choice; the other is obligation/exhaustion.
  *   **Proportionality:** This is the biggest point in your favor. The standard penalty for "losing" the rule is **one night of dishes.** Her demand for **a week of dishes** is a new, punitive escalation that has no basis in your 3-year history.

  **The Verdict:**
  **You are more right regarding the intent, but the rule is genuinely ambiguous.**
  However, **she is objectively wrong about the penalty.** Even if you did "lose" that night, the historical consequence is doing *that night's* dishes, not serving a week-long sentence. Demanding a week of dishes suggests this isn't really about the dishes; it's about something else (resentment about the trip, feeling like she does more chores generally, or just wanting to "win").

  ### 2. Why This Feels Like a Big Deal
  If you had zero drama for 3 years, this sudden rigidity is suspicious. Usually, when a roommate suddenly insists on a technicality with a disproportionate punishment, it's a symptom of a larger issue.
  *   **Is she stressed?** Maybe she felt overwhelmed while you were gone.
  *   **Is she feeling taken advantage of?** Maybe she feels she's done more dishes lately and sees this as a chance to rebalance the scales.
  *   **Is it the 1 AM arrival?** Even if she was asleep, you coming in at 1 AM might have disturbed her sleep or felt inconsiderate, and the dishes are her way of levying a fine.

  ### 3. How to Resolve It

  You cannot "win" this by proving you're right, because the rule doesn't cover this scenario. If you dig in, you turn a dish dispute into a power struggle. Here is the strategy to de-escalate and solve it:

  **Step 1: Acknowledge the Ambiguity**
  Start the conversation by validating that the rule is unclear.
  *   *"I've been thinking about this, and you're right that we never actually wrote down what happens with overnight trips. So technically, the rule is undefined here."*

  **Step 2: Address the Precedent and Penalty**
  Gently point out that the punishment doesn't fit the crime based on your history.
  *   *"However, for three years, the 'price' of getting home last has always been just that night's dishes. A whole week is a huge jump from our normal agreement. It feels a bit punitive rather than just balancing chores."*

  **Step 3: Offer a Compromise (The "Goodwill" Gesture)**
  To keep the peace, concede the specific night but reject the week. This shows you aren't trying to dodge responsibility, but you won't accept unfair terms.
  *   *"I don't think the rule was meant to cover work trips, but I get why it looks like I got home last. I'm happy to do the dishes for tonight (or tomorrow night) as a goodwill gesture, but I don't think a whole week is fair given we've never had this rule before."*

  **Step 4: Update the "Contract"**
  Prevent this from happening again.
  *   *"Let's clarify the rule so we don't fight about this next time. How about: The rule applies to normal days, but if one of us is out of town overnight, chores are split evenly that week (or the traveler is exempt)?"*

  ### Summary
  The rule **does not cover this**, so you are both stuck deciding something new from scratch.

  *   **Don't** do the week of dishes. It sets a bad precedent that arbitrary punishments are okay.
  *   **Do** offer to do *one* night (or just split the dishes this week) to show you care about fairness.
  *   **Do** have a conversation about whether she's feeling overburdened in general. The aggression over the dishes suggests the dishes might not be the only thing on her mind.

  **The Bottom Line:** You aren't "wrong," but insisting on being "right" over a vague unwritten rule isn't worth the drama. Treat it as a contract negotiation, not a court case. Clarify the rule, split the difference on the penalty, and move on.
