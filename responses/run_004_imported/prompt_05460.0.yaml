answer: |-
  This is a fantastic line of inquiry, and you are right to anchor it in Neurath. The "chart crimes" discourse often feels like people reinventing the wheel without reading the manual, and Neurath wrote the manual.

  If we reconstruct Neurath's perspective based on his writings (particularly *Modern Man in the Making* and his essays on the Vienna Method) and the operational structure of the ISOTYPE Institute, we can be fairly decisive. He would not be ambivalent. He would view the modern landscape as a tragic bifurcation: a golden age of data availability squandered by a collapse of visual grammar.

  Here is how Neurath would likely adjudicate the two halves of your question.

  ### 1. On Modern Data Viz (OWID, Dashboards, Instagram)
  Neurath would draw a sharp, unforgiving line between the **data** and the **display**.

  He would likely view a resource like *Our World in Data* (OWID) as the fulfillment of his *archival* dream but a failure of his *pedagogical* one. Neurath wanted "education through the eye" for the factory worker, not the academic. He would admire the open-access ethos and the rigorous sourcing (the Logical Positivist insistence on verifiable facts). However, he would find OWID's reliance on standard line charts and dense text too literate-dependent. For Neurath, if you need a paragraph of legend to explain the chart, the chart has failed. He wanted the visual to stand alone as a "wordless sentence."

  On **COVID dashboards**, he would be conflicted. He would appreciate the immediacy and the public utility (the Social and Economic Museum was meant to help citizens navigate their reality). But he would critique the "alarmism" of the visual design. Neurath's Isotype was calm, repetitive, and cumulative. It was designed to show *structure*, not just *spike*. A heat map that turns deep red to signify danger is, to a Neurathian, emotional manipulation, not statistical education. It triggers a biological response rather than a cognitive one.

  But on **Instagram infographics and mainstream media dataviz**, Neurath would be apoplectic. And specifically, he would pinpoint the missing role of the **Transformer**.

  In the Vienna Method, the "Transformer" (Marie Reidemeister's role) was the ethical firewall. The statistician gave the numbers; the artist drew the icons; the Transformer decided how the numbers became the pictures. They ensured that the visual grammar didn't lie. Today, that role has collapsed into the "Graphic Designer" or "Journalist," who is often incentivized by engagement metrics rather than pedagogical clarity.

  When an Instagram infographic doubles the height of a syringe to represent a doubling of doses, Neurath would not call this a "mistake." He would call it **visual lying**. Because he tied his visual rules to his philosophy of Logical Positivism, a distortion of area is a distortion of truth. He argued that the human eye estimates area, not height. To double the height is to quadruple the truth. In his view, the modern "chart crime" isn't just bad design; it is a betrayal of the democratic mission. It treats the viewer as someone to be impressed, rather than a citizen to be equipped.

  **Verdict:** He would see modern dataviz as technically miraculous but ethically regressive. We have better data than 1930s Vienna, but we have lost the "Transformer" discipline that ensured the data wasn't visually corrupted. He would view the majority of viral infographics as **bourgeois decoration**—images that simulate knowledge without conferring it.

  ### 2. On Emoji, UI Icons, and Airport Signage
  This is where the distinction becomes crucial. You asked if he would count these as a continuation of "picture language." The answer is **no**. He would classify them as a different genus entirely.

  Neurath's Isotype was not just about "icons." It was about **quantitative syntax**.
  *   **Airport Signage & UI Icons:** Neurath would respect these as successful "International Picture Language" in the *directive* sense. The toilet icon or the "no smoking" sign achieves his dream of crossing linguistic barriers. However, he would argue these are **signs**, not **statistics**. They denote a thing or a rule; they do not measure a quantity. Isotype was specifically engineered to handle *magnitude* (more coal, more deaths, more wheat). Airport signage does not need to show "more toilet," it just needs to show "toilet." Neurath would see this as a partial victory for universalism, but unrelated to his core project of social economics.
  *   **Emoji:** He would likely despise emoji. Emoji are subjective, metaphorical, and emotionally loaded. A "fire" emoji doesn't mean combustion; it means "cool." A "skull" means "death" or "dying of laughter." This ambiguity is the exact opposite of the Vienna Circle's drive to eliminate metaphysical fuzziness. Neurath wanted a visual language that was as precise as algebra. Emoji is a visual language that operates like poetry or slang. It reintroduces the ambiguity he spent his life trying to purge from communication.

  **Verdict:** He would view airport signage as a successful sibling (universal, functional) but not an heir. He would view emoji as a corruption of the idea—a return to pictographic mysticism rather than scientific clarity.

  ### The Core Reconstruction: The "Transformer" Deficit
  If Neurath were dropped into 2024, his critique wouldn't just be about resizing icons. It would be about the **economy of attention**.

  Neurath's Isotype was slow. It required repetition. If you had 1,000,000 unemployed workers, you didn't draw one giant sad man; you drew a grid of small men. This forced the viewer to scan, to count, to feel the *weight* of the number through iteration. It was a meditative act of comprehension.

  Modern dataviz is optimized for the scroll. It prioritizes the "takeaway" over the "understanding." The resizing of icons is a feature, not a bug, in the attention economy—it makes the difference look more dramatic to stop the thumb.

  Neurath would argue that by abandoning the "repetition rule," we have abandoned the viewer's right to accurate intuition. He would likely argue that the "chart crimes" discourse is correct but too narrow. It's not just that resizing is mathematically wrong; it's that it turns the citizen into a consumer of spectacle.

  **The Commitment:**
  Neurath would conclude that **Isotype died not because it was obsolete, but because it was unprofitable.** The "Transformer" role requires time and expertise that the modern media cycle does not budget for. He would view *Our World in Data* as the closest living relative to his museum, but he would urge them to hire more Transformers and fewer designers. He would tell the Instagram infographers that they are not educators; they are agitprop artists. And he would tell the emoji users that they are speaking a language of feeling, not a language of fact.

  He would likely be working furiously to create an open-source "Isotype Engine" for the web—a library of icons that *physically prevents* you from scaling them, forcing you to duplicate them instead. He would see the code itself as the new Transformer.
