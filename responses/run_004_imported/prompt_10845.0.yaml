answer: |-
  Good evening.

  For those who don't know me, I've had the privilege of calling our guest of honor a colleague and a friend for thirty years, dating back to our time as graduate students. Back then, we were deciphering Plato together. Today, she is the senior figure of our ancient philosophy group, and I am one of many standing here to say what it meant to be taught by her.

  There is a piece of department lore that everyone knows, even the undergraduates. It concerns her fortnightly reading group, the one generations of students simply call "the Symposium." The rule was always wine. The glasses were always full. And the running joke was that she was invariably the last person at the table still counting the bottles, pouring generously for everyone else while barely touching her own.

  For the family and friends here: this wasn't abstinence. For the specialists in the room: this was not a failure to commit to the bit. It was, in fact, a precise pedagogical enactment of Plato's *Laws*.

  We all know the *Republic* is suspicious of pleasure. Socrates worries that poetry and wine loosen the guardians' grip on reason. But in the *Laws*, the Athenian Stranger makes a different bet. He argues that a drinking party, properly arranged, is not an indulgence but a training ground. Just as we expose soldiers to manageable fear to train their courage, we expose citizens to the loosening effect of wine to train their self-mastery. It is a safe space to feel the pull of shamelessness so that we might learn to resist it.

  But there is a condition. The *Laws* is explicit: this only works if there is a sober overseer. Someone who remains clear-headed enough to ensure the gathering doesn't tip into license. Someone who keeps the conversation from becoming a shouting match, and the wine from becoming an escape.

  For thirty years, in that reading group, she was that overseer.

  She understood that the point of the symposium wasn't the intoxication; it was the truth that comes out when defenses are lowered. She poured the wine to warm us, to make us bold enough to offer a half-formed idea, to argue passionately, to be vulnerable. But she kept her own head clear so that she could protect the integrity of the conversation. She counted the glasses so we didn't have to. She created a space where we could be loose, but never careless.

  The Athenian Stranger also argues something specific about age. He says that as we grow older, our spirits stiffen. We become rigid, suspicious, and set in our ways. The *Laws* suggests that the older generation actually requires more relaxation, not less, to remain gentle and teachable.

  And yet, here is the irony of tonight. As she reaches the age where Plato says she has earned the most license, she is the one stepping away from the table. She is leaving the oversight to us.

  What our department is losing is not just a scholar of ancient philosophy. We are losing the person who understood that philosophy is not just about what you think, but how you sit together. She ran her seminar exactly as the *Laws* prescribes: a community bound by shared pleasure, governed by shared reason, held together by a leader who cared more for the sobriety of the group than for her own share of the cup.

  She bet on the Athenian Stranger over Socrates. She believed that we could drink together without drowning, and that we could be happy without losing our minds. Looking around this room, at the dozens of former students and colleagues who are here because of that hospitality, I think the evidence is in. The bet paid off.

  So, for the specialists: I have tried to state the argument fairly. For the family: I hope I have explained why a glass of wine mattered so much to her work.

  But now, we must observe the one rule she always enforced better than anyone: the toast must be led by the sober, but drunk by the community. She will not be drinking much tonight—old habits of the overseer die hard—so we must drink enough for all of us.

  Please, raise your glasses.

  To our colleague, our teacher, and our sober guardian. May your retirement be as generous as your pouring, and may you finally, for once, let someone else count the glasses.

  To her.
