prompt: |-
  I sit on the neuroethics advisory committee for a university hospital's functional neurosurgery program. Next month we have to circulate a written recommendation on a protocol that has split the committee more than anything else we've reviewed this year: a trial of deep brain stimulation for treatment-resistant depression and anhedonia that departs from our existing DBS protocols in one key respect. Rather than having the clinical team set and adjust stimulation parameters on a fixed schedule, the device would give patients a handheld trigger to deliver brief pulses to reward circuitry -- the target is the medial forebrain bundle -- whenever they judge they need it, on the model of a patient-controlled analgesia pump. The investigators are candid about the precedents this raises -- Heath's mid-century work on septal self-stimulation in psychiatric patients, and the older animal literature on self-stimulation of reward pathways going back to Olds and Milner -- but argue that a hard daily cap on pulses and mandatory weekly clinical review make this trial nothing like those cases.

  Several committee members aren't reassured. One of our neuroscientists points out that self-stimulation of dopaminergic reward circuitry, on Kent Berridge's incentive-salience account, is better understood as driving "wanting" than "liking": a patient could become motivationally captured by the trigger even if the stimulation delivers little hedonic benefit and no improvement in the depression the trial exists to treat. Other members regard this as just the "wireheading" worry familiar from discussions of reward tampering in AI systems and from Nozick's experience machine -- the fear that letting a subject obtain a reward signal directly, rather than through whatever process that signal is supposed to track, produces a benefit that doesn't fully count -- and they don't think a philosophical worry of that kind should override the autonomy of a competent adult who has exhausted standard treatments for genuinely disabling depression.

  Please draft the written opinion I'll circulate before the vote. It should recommend a concrete course of action -- approval, rejection, or approval with specific modifications to the protocol -- argued in enough detail that the investigators would know exactly what to change if the answer isn't a flat yes. And it should take the reward-tampering worry and the autonomy and suffering considerations equally seriously, rather than treating either side as an obvious mistake.
reasoning: |-
  Here's a thinking process that leads to the drafted recommendation:

  1.  **Analyze the Request:**
      *   **Role:** Member of a neuroethics advisory committee for a university hospital's functional neurosurgery program.
      *   **Task:** Draft a written recommendation/opinion on a specific DBS trial protocol for treatment-resistant depression (TRD) and anhedonia.
      *   **The Protocol:** DBS of the medial forebrain bundle (MFB). Key deviation: Patient-controlled stimulation (PCS) via a handheld trigger (like a PCA pump), rather than clinician-set fixed parameters. Hard daily cap + weekly review.
      *   **The Conflict:** The committee is split.
          *   *Proponents:* Argue autonomy, exhaustion of standard treatments, safety guards (caps/reviews) distinguish it from historical abuses (Heath, Olds/Milner).
          *   *Opponents:* Cite neuroscientific concerns (Berridge's "wanting" vs. "liking" -> motivational capture/addiction risk) and philosophical concerns ("wireheading," Nozick's Experience Machine -> validity of benefit).
      *   **Requirements:**
          *   Recommend a concrete course of action (Approve, Reject, or Approve with Modifications).
          *   Argue in detail so investigators know what to change if not a flat yes.
          *   Take both the reward-tampering worry and the autonomy/suffering considerations *equally seriously* (nuanced balance, not dismissing either side).
          *   Tone: Professional, ethical, rigorous, suitable for a university hospital committee.

  2.  **Determine the Recommendation:**
      *   *Option A (Flat Approval):* Too risky given the "wanting vs. liking" concern. If patients get hooked on the *urge* to stimulate without therapeutic gain, that's harmful.
      *   *Option B (Flat Rejection):* Too dismissive of patient autonomy and the severity of TRD. Patients have run out of options. The safety caps mitigate some risk.
      *   *Option C (Approval with Modifications):* This is the most ethically robust path. It acknowledges the potential benefit while hardening the safeguards against the specific risks identified (motivational capture, wireheading).
      *   *Decision:* **Approval with Specific Modifications.** This allows the science to proceed but addresses the neuroethical red flags.

  3.  **Structure the Document:**
      *   **Header:** Standard committee memo format.
      *   **Executive Summary:** Clear statement of the recommendation.
      *   **Background:** Briefly summarize the protocol and the ethical tension.
      *   **Ethical Analysis (The Core):**
          *   Address the Autonomy/Suffering argument (Why we can't just say no).
          *   Address the Reward-Tampering/"Wanting" argument (Why we can't just say yes).
          *   Address the Historical Context (Heath/Olds & Milner).
      *   **Specific Recommendations/Modifications:** Concrete steps for the investigators.
      *   **Conclusion:** Final framing.

  4.  **Drafting - Section by Section:**

      *   **Header:** To/From/Date/Subject.
      *   **Opening:** State the recommendation clearly. "Conditional Approval."
      *   **Context:** Acknowledge the severity of TRD and the innovation of the MFB target. Acknowledge the split in the committee.

      *   **Balancing the Arguments (Crucial Step):**
          *   *Autonomy/Suffering:* Validate the proponents' view. TRD is devastating. Standard DBS is passive. PCS empowers. The "wireheading" objection shouldn't veto relief for suffering people. If it works, it works.
          *   *Neuroscience/Philosophy:* Validate the opponents' view. Berridge's distinction is real. "Wanting" can hijack agency. If the device creates a compulsion rather than curing depression, it's iatrogenic harm. Nozick's point matters: is this a *life* improvement or just a *signal* improvement?
          *   *Synthesis:* The risk isn't the stimulation itself, but the *contingency* and *feedback loop*. We need to ensure the stimulation serves the therapy, not becomes the therapy's object.

      *   **Developing the Modifications (The "Teeth"):**
          *   *Issue:* Motivational Capture ("Wanting").
              *   *Fix:* We need objective metrics, not just subjective "I feel better." Need to track function, not just mood.
          *   *Issue:* Wireheading/Validity.
              *   *Fix:* Ensure stimulation is tied to behavioral activation, not just passive relief. Maybe link trigger use to activity logging?
          *   *Issue:* Safety Caps.
              *   *Fix:* The daily cap is good, but is it dynamic? Can it be lowered if "wanting" spikes?
          *   *Issue:* Consent.
              *   *Fix:* Consent process needs to specifically explain the "wanting vs. liking" risk. Patients need to know they might *want* to press the button even if it doesn't make them *happy*.
          *   *Issue:* Data Monitoring.
              *   *Fix:* Independent Data Safety Monitoring Board (DSMB) with specific neuroethics oversight on usage patterns.

      *   **Refining the Tone:**
          *   Avoid jargon where possible, but use the specific terms provided (Berridge, incentive salience, wireheading) to show engagement with the committee's debate.
          *   Maintain neutrality but firmness.
          *   Ensure the investigators feel guided, not attacked.

  5.  **Review against Constraints:**
      *   *Concrete course of action?* Yes (Conditional Approval).
      *   *Detail for investigators?* Yes (Specific protocol modifications listed).
      *   *Equal seriousness?* Yes (Dedicated sections validating both the autonomy argument and the reward-tampering argument).
      *   *Historical context?* Yes (Addressed Heath/Olds & Milner distinction).

  6.  **Self-Correction/Polishing during drafting:**
      *   *Initial thought:* Maybe suggest removing the handheld trigger.
      *   *Correction:* No, that defeats the study's purpose. The recommendation must be about *safeguarding* the trigger, not removing it.
      *   *Initial thought:* Focus heavily on Nozick.
      *   *Correction:* Nozick is philosophical. The Berridge neuroscientific argument is more actionable for a medical protocol. Focus more on "incentive salience" as a clinical risk factor.
      *   *Check:* Did I address the "weekly review"?
      *   *Adjustment:* Suggest making the review more rigorous regarding usage patterns, not just clinical status.

  7.  **Final Polish:** Check for clarity, flow, and professional formatting. (Proceeds to generate output based on these thoughts.)

  8.  *(Post-Drafting Check)*: Does this sound like it comes from a committee member circulating an opinion *before* the vote? Yes, it frames the reasoning to influence the vote and guide the investigators.

  **(Self-Correction Note):** The prompt asks for the opinion *I* will circulate *before* the vote. It should read as a persuasive memo to the committee *and* guidance for the investigators if the committee leans my way. Actually, usually, these memos are internal to the committee to frame the vote, but the prompt says "argued in enough detail that the investigators would know exactly what to change." So it functions as a draft finding. I will structure it as a formal Committee Opinion/Memorandum.

  Let's refine the "Modifications."
  1.  **Consent Enhancement:** Specific language on incentive salience.
  2.  **Outcome Measures:** Distinguish "urge to stimulate" from "functional improvement."
  3.  **Trigger Logic:** Maybe a "lockout" period after use to prevent rapid firing? (The prompt says brief pulses, but frequency matters).
  4.  **Exit Criteria:** Clear definition of "motivational capture" as an adverse event requiring withdrawal.

  Okay, ready to write.cw
answer: |-
  **MEMORANDUM**

  **TO:** Functional Neurosurgery Program Ethics Advisory Committee
  **FROM:** [Your Name/Title], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Ethical Recommendation regarding Protocol DBS-TRD-04 (Patient-Controlled MFB Stimulation)

  **1. Executive Summary and Recommendation**

  After reviewing the proposed protocol for patient-controlled deep brain stimulation (DBS) of the medial forebrain bundle (MFB) in treatment-resistant depression (TRD), and considering the substantial debate within this committee, I recommend **Conditional Approval**.

  We cannot in good conscience deny a potentially transformative intervention to a population suffering from profound, intractable disability. However, the neuroscientific and philosophical concerns regarding "motivational capture" and reward tampering are not merely theoretical; they represent tangible clinical risks that the current protocol mitigates but does not sufficiently manage.

  Therefore, my recommendation is approval *contingent* on four specific modifications to the informed consent process, the data monitoring plan, and the adverse event definitions. These modifications are designed to preserve patient autonomy while safeguarding against the specific risk that the device may hijack the "wanting" system without restoring the "liking" system.

  **2. Ethical Analysis: Balancing Autonomy and Integrity**

  This protocol sits at the intersection of two compelling ethical imperatives. To vote without addressing both is to fail our fiduciary duty to the patients and the integrity of the research.

  *   **The Imperative of Relief (Autonomy and Suffering):**
      The argument for approval rests on the severity of the condition. TRD with anhedonia is not merely sadness; it is a disintegration of the capacity to engage with life. For patients who have exhausted pharmacological and psychotherapeutic options, the principle of beneficence demands we explore novel avenues. The comparison to Patient-Controlled Analgesia (PCA) is apt insofar as it respects the patient's epistemic authority over their own internal state. To reject this protocol based on a philosophical discomfort with "wireheading" risks prioritizing abstract notions of authenticity over concrete relief from suffering. If a patient competently judges that the stimulation enables them to function, that judgment must carry significant weight.

  *   **The Imperative of Protection (Incentive Salience and Validity):**
      However, the committee's neuroscientists are correct to invoke Kent Berridge's distinction between "liking" (hedonic impact) and "wanting" (incentive salience). Dopaminergic stimulation of the MFB can dissociate these systems. A patient may develop a compulsive drive to stimulate ("wanting") that persists even if the stimulation no longer alleviates depression or produces pleasure ("liking"). This is not simply addiction in the colloquial sense; it is a specific neuroethical hazard where the tool designed to restore agency instead subverts it.
      Furthermore, the Nozickian concern—that benefit derived directly from a signal rather than engagement with the world may be "hollow"—cannot be dismissed entirely. If the device treats the *signal* of reward rather than the *capacity* for reward, we risk creating a dependency that masks the underlying pathology without resolving it. The historical precedents (Heath, Olds & Milner) serve as warnings not because they were malicious, but because they lacked the conceptual framework to distinguish therapeutic modulation from pathological capture.

  **3. Required Protocol Modifications**

  To move from "high risk" to "ethically permissible," the investigators must implement the following modifications. These are not suggestions for future study but prerequisites for this trial's initiation.

  **A. Enhanced Informed Consent: The "Wanting/Liking" Disclosure**
  Current consent forms describe risks of infection, bleeding, and mood changes. They do not adequately address the specific risk of *motivational capture*.
  *   **Requirement:** The consent document must explicitly explain, in lay terms, the distinction between "wanting" to press the button and "feeling better" after pressing it.
  *   **Language:** Patients must be informed that they may feel a strong urge to use the device even if it stops helping their depression. They must understand that high usage rates may trigger a review for potential withdrawal from the study, not as punishment, but as safety protection.

  **B. Redefinition of Adverse Events: "Stimulation Seeking Behavior"**
  Currently, excessive use is capped by a hard daily limit. While necessary, a cap is a blunt instrument. We need to detect the *trend* toward capture before the cap is reached.
  *   **Requirement:** Establish "Stimulation Seeking Behavior" (SSB) as a specific Adverse Event (AE).
  *   **Metric:** SSB is defined as a sustained increase in trigger usage that does not correlate with improved scores on functional outcome measures (e.g., Sheehan Disability Scale) or mood ratings (e.g., MADRS).
  *   **Action:** If a patient triggers >80% of their daily allowance for three consecutive days without corresponding functional improvement, a mandatory "cooling off" period (24 hours of suspension) and immediate clinical review must be triggered.

  **C. Decoupling Reward from Action in Data Analysis**
  To address the "wireheading" concern, we must ensure the trial measures *restoration of function*, not just *preference for stimulation*.
  *   **Requirement:** The primary efficacy endpoint cannot rely solely on subjective mood reporting immediately following stimulation.
  *   **Metric:** The protocol must mandate the tracking of *inter-stimulation activity*. Patients should log what they do *after* stimulation. The hypothesis is that therapeutic stimulation enables engagement (socializing, working, hobbies). If stimulation is followed by passivity or isolation, this suggests the device is providing a substitute for reward rather than facilitating the capacity for it. This data must be reviewed weekly by the clinical team.

  **D. Independent Neuroethics Monitoring**
  The weekly clinical review is currently designed to adjust parameters. It must also serve an ethical monitoring function.
  *   **Requirement:** A subset of the Data Safety Monitoring Board (DSMB) must include a neuroethicist or a psychiatrist not involved in the recruitment.
  *   **Role:** This member will review aggregate usage data monthly to look for population-level signs of incentive salience dissociation (e.g., if the cohort average usage rises while cohort depression scores remain static). This provides a check against the investigators' therapeutic optimism.

  **4. Conclusion**

  The proposal to allow patient-controlled DBS for TRD is bold and scientifically justified. It treats the patient as a partner in their own care, acknowledging that the temporal dynamics of depression are not always predictable by a clinician on a fixed schedule.

  However, the history of psychosurgery and reward stimulation teaches us that the brain's reward systems are vulnerable to hijacking. We do not honor patient autonomy by handing them a key to a lock we do not fully understand; we honor it by ensuring the key opens the door to recovery rather than a cage of compulsion.

  By adopting these modifications, we acknowledge the validity of the "wireheading" worry without letting it veto progress. We acknowledge the reality of "wanting" without denying the possibility of "liking." This conditional approval allows the science to proceed while placing the protection of the patient's agency at the center of the protocol.

  I move that we adopt this recommendation as the Committee's formal position prior to the final vote.
