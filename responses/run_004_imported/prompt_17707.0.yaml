answer: |-
  Here are 9 interview questions designed to move past the introductory summary of her view and press on the technical and philosophical costs of the non-truth-conditional position.

  The three mandatory questions (Triviality, Embedding, Validity) are marked with an asterisk (*) and include the anticipated answer context and a specific follow-up.

  ### 1. *The Triviality Fork (Mandatory)*
  David Lewis's triviality results demonstrate that you can't hold three things at once: that indicatives have standard truth conditions, that Adams' Thesis holds (probability of the conditional equals conditional probability), and that probabilities are non-trivial. Most truth-conditionalists respond by keeping truth conditions and rejecting Adams' Thesis as a strict semantic rule. You do the opposite: you keep Adams' Thesis and drop truth conditions. Why is preserving the probabilistic data more important than preserving the classical semantic architecture? What makes the probability intuitions more robust than the syntactic evidence that conditionals behave like propositions?

  *   **Anticipated Answer:** She will likely argue that the probabilistic intuitions (e.g., how we bet on conditionals) are pre-theoretical and undeniable, whereas the syntactic evidence is superficial. She may claim truth-conditional accounts simply *cannot* match the data, no matter how they tweak the theory.
  *   **Follow-Up:** "But if we accept that syntax is a reliable guide to semantic type, aren't we risking a disconnect between grammar and meaning? If conditionals walk like propositions and talk like propositions, is the theoretical cost of calling them 'non-propositional' actually higher than the cost of admitting our probability intuitions are sometimes misleading?"

  ### 2. *The Embedding Problem (Mandatory)*
  Standard logical operators like negation, disjunction, and conjunction operate on propositions—they take truth values as inputs. If an indicative conditional doesn't express a proposition, it shouldn't have a truth value to operate on. Yet we comfortably say things like, "It is not the case that if it rains, the match will be cancelled," or "Either if Alice goes or if Bob goes, we'll win." On your view, what is the semantic value of a conditional when it sits inside the scope of another operator? Is it doing the same thing it does when it stands alone?

  *   **Anticipated Answer:** She will likely appeal to a dynamic semantics or a pragmatic workaround, suggesting that embedded conditionals trigger a supposition within a local context rather than contributing a truth value to the main sentence.
  *   **Follow-Up:** "Doesn't that local-context machinery end up replicating the complexity of the truth-conditional possible worlds semantics you're trying to avoid? If the mechanism required to explain embedding is just as heavy as Stalnaker's or Kratzer's, have we really gained any theoretical simplicity?"

  ### 3. *Probabilistic Validity (Mandatory)*
  You replace the classical notion of validity (preservation of truth) with probabilistic validity (preservation of high probability or uncertainty summation). A critic might argue this is changing the subject: logic is supposed to be about necessary consequence, not managing degrees of confidence. If I reason validly in your sense, I haven't necessarily preserved truth, just my own confidence. Does this view risk losing the normativity of logic? Why *ought* I reason this way if it doesn't track truth?

  *   **Anticipated Answer:** She will likely argue that classical logic is an idealization that doesn't apply to uncertain empirical reasoning, and that probabilistic validity is the *real* norm for rational agents who aren't omniscient.
  *   **Follow-Up:** "But if logic is just a codification of rational credence management, where do we draw the line between logic and decision theory? If the 'validity' depends on my prior probabilities, doesn't that make logical consequence subjective in a way that undermines its role as a public standard of correctness?"

  ### 4. The Oswald/Kennedy Intuition
  The Oswald/Kennedy pair is the classic motivation for your view: the indicative ("If Oswald didn't kill Kennedy, someone else did") seems true because we know someone did, while the subjunctive ("If Oswald hadn't...") seems false. Truth-conditionalists like Kratzer argue this is just a difference in modal bases (what's known vs. what's possible). Why is your suppositional explanation superior to the contextualist explanation? Does the contextualist view not capture the same data without abandoning truth conditions?

  ### 5. The Norm of Assertion
  When I assert a flat-out proposition like "It is raining," I am subject to a norm of truth or knowledge. If I'm wrong, I've made a mistake. When I assert a conditional on your view, I'm not claiming it's true. So, what is the norm of assertion for conditionals? If I assert "If A, C" with high credence, but it turns out A is true and C is false, have I violated a norm, or just updated my credence? In what sense was my original assertion a mistake?

  ### 6. Disjunctions of Conditionals
  One of the hardest cases for non-truth-conditional views is the disjunction of conditionals, such as: "Either if we take the highway we'll be late, or if we take the backroad we'll be late." This looks like a disjunction of two propositions. If neither disjunct expresses a proposition, what does the whole sentence express? Is there a risk that your theory can handle simple conditionals but fractures when the syntax gets slightly more complex?

  ### 7. The Semantic Illusion
  If conditionals don't have truth conditions, why does natural language grammar treat them exactly as if they do? We can refer to them with anaphora ("If A then C. **That** was a bold claim."), and we can quantify over them. Is this just a massive semantic illusion? If so, why hasn't evolution or linguistic pressure corrected a grammar that systematically misrepresents the semantic type of one of our most common sentence structures?

  ### 8. Retraction and Disagreement
  Consider a case of disagreement. I say, "If it rains, the match will be cancelled." You say, "No, that's not right." On a truth-conditional view, we are contradicting each other about a fact. On your view, I'm expressing a credence and you're expressing a different one. But it doesn't feel like we're just comparing notes on our psychologies; it feels like we are arguing about the match. How does your account capture the objective *feel* of conditional disagreement without smuggling in truth conditions?

  ### 9. Decision Theory and Action
  Finally, we use conditionals to guide action. "If I press this button, the light will turn on." If this sentence has no truth condition, how does it interface with decision theory? Usually, we weigh the utility of outcomes against the probability of conditionals linking actions to outcomes. If the conditional isn't a proposition with a probability, are we forced to rebuild the standard model of rational choice to accommodate your semantics?
