answer: |-
  Here are 9 interview questions designed to move past the standard "group agent" talking points and engage with the mechanical and normative tensions in her view. Each includes a follow-up tailored to the most common defensive move in this literature.

  **1. The Impossibility Trade-off**
  You argue that premise-based aggregation is constitutive of group rationality. But List and Pettit's impossibility theorem shows we cannot simultaneously satisfy universal domain, anonymity, systematicity, and collective rationality without collapsing into a dictatorship. By insisting on premise-based procedures to preserve collective rationality, you are effectively sacrificing systematicity or anonymity. Why is preserving the *group's* logical consistency normatively privileged over preserving the *members'* equal weight or the systematic treatment of propositions?
  *   **Follow-up:** If she replies that rationality is the threshold condition for agency itself: "So, on your view, a body that votes conclusion-based isn't just a *flawed* agent, it's not an agent at all? Is there an empirical test for that threshold, or is it purely stipulative?"

  **2. The Agenda-Setting Power**
  A persistent worry about the discursive dilemma is that the outcome is sensitive to how the question is decomposed. If the group's belief is determined by the sequence of sub-questions, then the person framing the agenda effectively determines the belief. Doesn't this reduce the "group agent" to a mere function of the chairperson's conceptual scheme, making the group's rationality parasitic on an individual's choices?
  *   **Follow-up:** If she suggests we can constrain agenda-setting via rules: "But who writes those rules? If you push the homunculus back to the rule-makers, haven't you just relocated the problem of individual dominance rather than solving it?"

  **3. The Responsibility Gap**
  Your signature claim is that the group can hold a judgment that literally no member endorses. If that verdict turns out to be unjust or factually wrong, does this view let the individual judges off the hook? If the group is the literal believer, does moral and legal responsibility attach to the metaphysical entity, or do the individuals still bear the cost for a conclusion they explicitly rejected?
  *   **Follow-up:** If she argues responsibility is "distributed" or "shared": "Shared how? If I voted against the specific premises that logically entailed the verdict, in what sense am I responsible for a conclusion I opposed on the merits?"

  **4. The Empirical Mismatch**
  Most real-world collegial courts, including the Supreme Court, vote on the disposition (the conclusion) rather than issue-by-issue. If premise-based aggregation is what rationality demands, are most existing high courts merely pretending to be agents? Are we to treat their rulings as the output of a crowd rather than a court?
  *   **Follow-up:** If she says they are "imperfect" or "bounded" agents: "At what point of imperfection does the agency vanish? Is agency a spectrum, or is there a cliff where a court stops being a believer and starts being a machine?"

  **5. Truth-Tracking vs. Consistency**
  Proponents of premise-based procedures often argue they are better at tracking truth. But logical consistency is not the same thing as accuracy. A group can be perfectly consistent on a set of premises that are all false. Does your defense of strong group agency rely on the group being *consistent*, or do you have a formal argument that premise-based aggregation actually outperforms conclusion-based aggregation on truth-tracking in realistic environments?
  *   **Follow-up:** If she cites the Condorcet Jury Theorem or Bovens & Rabinowicz: "Those models usually assume independent errors. In real expert panels, errors are correlated by shared training and culture. Does your view survive the collapse of the independence assumption?"

  **6. Individual Epistemic Integrity**
  If the group asserts a conclusion that no member individually believes, the members are effectively required to assert something they take to be false. Does this create a conflict with the individual's duty of epistemic integrity? Are you asking judges to lie when they sign onto a majority opinion?
  *   **Follow-up:** If she says they speak "for the office" rather than themselves: "Doesn't that distinction erode the value of dissent? If the office speaks the truth and the individual speaks their conscience, why should we privilege the office's 'belief' over the judge's knowledge?"

  **7. Diachronic Identity and Turnover**
  If a group is a literal believer, does that belief persist through total membership turnover? If every judge on a panel is replaced over ten years, does the new panel inherit the old panel's beliefs, or do they have to re-derive them?
  *   **Follow-up:** If she says the beliefs persist via institutional memory: "Then isn't what you're describing just 'institutional tradition' or 'precedent'? What work does the ontological claim of 'belief' do that 'adherence to precedent' doesn't do without the metaphysical baggage?"

  **8. The Metaphysical Cost**
  You use the phrase "literal believer." What explanatory work is that doing that a functionalist description doesn't? If we say the court *functions as if* it believes, we get the same predictions without positing a distinct ontological category. Why should we pay the metaphysical cost of strong group agency?
  *   **Follow-up:** If she says it explains normative powers (like rights or duties): "Can't we assign normative powers to roles within a structure without reifying the structure itself into a mental state holder?"

  **9. Falsifiability (The Closer)**
  Finally, I want to ask about the boundaries of the view. What would actually count as evidence *against* strong group agency? If a panel votes conclusion-based, you say they aren't fully rational agents. If they vote premise-based, they are. But is there any empirical observation of a group's behavior that would convince you they *cannot* be a literal believer, rather than just being a dysfunctional one?
  *   **Follow-up:** If she suggests that nothing could falsify it because it's a normative claim: "If no empirical state of affairs is incompatible with the claim, are we doing social ontology here, or are we defining terms in a way that makes the theory immune to the world it's supposed to describe?"
