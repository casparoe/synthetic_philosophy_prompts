answer: |-
  You have put your finger on perhaps the most significant fault line in contemporary cognitive science. The "rationalist-sphere" synthesis you describe—where Friston's Free Energy Principle (FEP) is treated as a mathematical proof of the Bayesian Brain hypothesis—is indeed a specific philosophical colonization of a formalism that is, strictly speaking, metaphysically underdetermined.

  To answer your questions directly: **No, the Free Energy Principle, considered strictly as mathematics, does not favor the internalist reading over the enactive one.** In fact, the formalism is neutral regarding the ontological status of the "model" being minimized. The rationalist narrative *is* smuggling in the internalist picture, primarily by conflating the mathematical necessity of a variational density with the cognitive positing of a representational generative model.

  Here is a defense of that claim, engaging specifically with what the Markov blanket formalism entails and where the interpretive divergence occurs.

  ### 1. The Markov Blanket: Topological Boundary vs. Epistemic Veil

  The core of the disagreement lies in how one interprets the **Markov Blanket (MB)**.

  Mathematically, a Markov Blanket is a set of states that renders the internal states of a system conditionally independent of its external states. If we denote internal states as $I$, external states as $E$, and the blanket (sensory $S$ and active $A$ states) as $B$, the conditional independence relation is:
  $$ I \perp E \mid B $$
  This means that if you know the state of the blanket ($S$ and $A$), knowing the external state $E$ gives you no additional information about the internal state $I$, and vice versa.

  **The Internalist Reading (Hohwy):**
  Hohwy interprets this conditional independence as an **epistemic barrier**. Because $I$ cannot interact with $E$ except through $B$, the internal states are "trapped." Therefore, for the system to persist, $I$ must maintain a probabilistic model of $E$ based solely on $S$. The MB becomes a "veil of perception." The internal states *must* represent the external causes to minimize surprise. This leads to the view that cognition is essentially inference *behind* the veil, and action is merely a way to manipulate $S$ to match $I$'s predictions.

  **The Enactive Reading (Bruineberg, Kiverstein, Rietveld):**
  The enactivists argue that conditional independence is a **topological feature of self-organization**, not an epistemic verdict. The MB defines the *system* itself. It distinguishes the organism from the environment so that we can talk about the organism's persistence. However, the fact that $I$ is conditionally independent of $E$ does not mean $I$ contains a *representation* of $E$. It only means that the dynamics of $I$ are coupled to $E$ via $B$.
  In this reading, the MB is not a wall keeping the world out; it is the interface that allows for structural coupling. The "inference" is not happening *inside* the head looking out; the "inference" is the dynamic trajectory of the whole organism-environment system maintaining its non-equilibrium steady state.

  **The Mathematical Reality:**
  The math of the FEP requires the existence of an MB for the variational bound to be derivable. It does *not* require that the internal states $I$ encode a veridical map of $E$. It only requires that the dynamics of $I$ evolve in a way that is consistent with the statistics of $B$. Whether $I$ "represents" $E$ (Internalism) or merely "resonates" with $E$ through $B$ (Enactivism) is a question the conditional independence relation cannot answer. The formalism describes the *relation*, not the *content*.

  ### 2. Variational Inference: Mechanism or Description?

  The second point of smuggling occurs in the interpretation of **Variational Free Energy (VFE)** minimization.

  The FEP shows that for a system to maintain its integrity (remain within its attracting set), its internal states must parameterize a probability distribution (a variational density, $q$) that approximates the posterior probability of external states given sensory states ($p(E|S)$). Minimizing VFE minimizes the divergence between $q$ and $p$.

  **The Rationalist/Internalist Collapse:**
  The rationalist narrative reads this as a **mechanistic claim**: The brain *implements* Bayesian inference. It literally computes prediction errors, updates weights, and calculates posteriors. The variational density $q$ is identified with the brain's "generative model." This is why the rationalist story is so tidy: it turns the FEP into a recipe for AGI. If you want to build a mind, build a hierarchical Bayesian engine that minimizes VFE.

  **The Enactive/Instrumentalist Counter:**
  Critics like Bruineberg argue that VFE minimization is a **description of behavior**, not necessarily a mechanism of computation. Any self-organizing system that persists over time *must* minimize free energy, by definition. A bacterium swimming up a glucose gradient minimizes free energy. Does the bacterium have a "generative model"? Does it perform "inference"?
  *   **Internalist:** Yes, in a primitive sense. It has priors about glucose.
  *   **Enactivist:** No. It is simply a dynamical system coupled to a niche. The "inference" language is a useful mathematical fiction (an "as-if" description) to describe the system's resistance to entropy.

  **The Formal Gap:**
  The mathematics establishes that the system's trajectory *looks like* gradient descent on an information-theoretic bound. It does not establish that the system *computes* that gradient using representational states. The rationalist narrative smuggles in **computationalism** (the idea that cognition is information processing) by assuming that because the math looks like Bayesian updating, the brain must be processing information in that format. The enactivist argues the math describes the *thermodynamics of existence*, which can be realized by representational brains, non-representational dynamical systems, or even simple homeostatic loops.

  ### 3. Active Inference and the Locus of Control

  The divergence is sharpest when we look at **Active Inference** (the role of action $A$).

  In the FEP, action is treated as minimizing *expected* free energy. The system acts to sample sensory data that it expects will be less surprising.

  **Internalist Instrumentalism:**
  Here, action is in the service of perception. I move my eyes to reduce uncertainty about the object. The goal is to make the sensory input match the internal model. The world is a disturbance to be controlled. This aligns with the "brain in a vat" intuition: the brain's job is to predict the flux, and the body is just an effector arm to keep the flux predictable.

  **Enactive Constitutivism:**
  Here, action is **niche construction**. I move my eyes not just to update a model, but to bring myself into a productive coupling with the environment. The "prediction" isn't a hypothesis about the world; it's a policy for engaging with it.
  Clark's *Surfing Uncertainty* attempts to bridge this. He wants to keep the hierarchical Bayesian math but insists that the "model" is deeply embodied and that action is not just error-reduction but "bringing forth a world." However, critics argue Clark doesn't go far enough. If the math says the brain minimizes surprise, and surprise is defined relative to an internal model, doesn't that make the internal model the master?

  **The Formal Neutrality:**
  The math of active inference defines a policy $\pi$ that minimizes expected free energy $G$.
  $$ G(\pi) = \text{Risk} + \text{Ambiguity} $$
  This equation does not specify *where* the policy lives.
  *   In the **Internalist** view, $\pi$ is computed centrally in the cortex based on the generative model.
  *   In the **Enactive** view, $\pi$ emerges from the coupled dynamics of the agent and the affordances in the environment. The "minimization" is distributed.
  The formalism allows for both. It describes the *outcome* (surprise is minimized), not the *locus* of the computation. The rationalist assumption that the "generative model" is a centralized data structure inside the skull is an architectural assumption imported from computer science, not a deduction from the FEP.

  ### 4. Why the Rationalist Narrative Collapses the Distinction

  You asked if the rationalist presentation is "quietly smuggling in the internalist picture." The answer is yes, and there are two reasons for this, one pragmatic and one philosophical.

  1.  **Computational Tractability:** The rationalist community is deeply invested in AI alignment and AGI. The Internalist reading of FEP provides a blueprint for building agents. If the brain is a hierarchical Bayesian predictor, we can build one. The Enactive reading is much harder to engineer; if cognition is a distributed organism-environment coupling, you can't just code the "brain" part and expect it to work. The internalist reading is selected for because it is *actionable* for engineers, not because it is *mandated* by the math.
  2.  **The "Bayesian Brain" Heritage:** The rationalist sphere grew out of the "Bayesian Brain" hypothesis (Knill, Pouget, etc.), which was explicitly representationalist. When Friston's FEP arrived, it was welcomed as the "grand unified theory" that proved the Bayesian Brain right. But FEP is more general than the Bayesian Brain. The Bayesian Brain is a specific *implementation* of FEP. By treating them as identical, the rationalist narrative ignores the possibility that FEP could be realized by non-Bayesian, non-representational mechanisms.

  ### Conclusion: The Formalism is a Principle of Existence, Not Mind

  The Free Energy Principle is a theorem about self-organizing systems. It states that **to exist is to minimize surprise.**

  *   **Hohwy (Internalist)** interprets this as: "To exist, the brain must accurately model the world."
  *   **Bruineberg/Kiverstein (Enactive)** interpret this as: "To exist, the organism must maintain its structural coupling with the environment."

  Both are consistent with the mathematics of the Markov Blanket. The Markov Blanket ensures that we can distinguish the system from the environment, but it does not dictate that the system must *represent* the environment to maintain that distinction.

  The rationalist-sphere version of Predictive Processing collapses this distinction because it treats the **variational density** (a mathematical requirement for the bound) as identical to a **generative model** (a cognitive posit). It assumes that because the math looks like inference, the mind must be an inferrer.

  Therefore, your intuition is correct: the tidy story papers over a genuine metaphysical disagreement. The FEP does not force us to accept that the brain is a solipsistic inference engine trapped behind a sensory veil. It allows for the possibility that "inference" is just the name we give to the successful dynamical coupling of a living thing with its world. Recognizing this doesn't invalidate the math, but it does invalidate the claim that the math settles the debate between representationalism and enactivism. It leaves the door open for a view where the brain is not a modeler of the world, but an organ of a system that *enacts* a world.
