          *   *Mathematical Reality:* The math only requires conditional independence for the variational bound to hold. It doesn't dictate whether internal states *mirror* the world (representation) or *resonate* with it (dynamical coupling).

      *   **The Nature of "Inference" in FEP:**
          *   FEP says systems minimize Variational Free Energy (VFE). VFE $\approx$ Surprise.
          *   Minimizing VFE looks like Bayesian inference (updating posteriors).
          *   *Internalist:* This is literal inference. The brain computes probabilities.
          *   *Enactive:* This is "as-if" inference. The dynamics *look like* inference because any self-organizing system must resist entropy. It's a description of behavior, not necessarily a mechanism of computation.
          *   *Key Point:* The "Dark Room Problem" highlights this. Internalists solve it with priors (we prefer being alive). Enactivists say the math describes the *life process* itself, not a goal-seeking agent choosing priors.

      *   **Active Inference and the Role of Action:**
          *   FEP includes *Active Inference* (acting to minimize expected free energy).
          *   *Internalist:* Action changes sensory input to match the model (control theory).
          *   *Enactive:* Action changes the relationship with the niche. It's constitutive.
          *   *Math:* The math treats action as minimizing the divergence between predicted and actual sensory states. It doesn't specify *where* the policy originates (inside vs. distributed).

      *   **The Rationalist Smuggling:**
