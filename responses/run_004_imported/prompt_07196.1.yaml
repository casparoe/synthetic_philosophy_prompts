      *   *Key Distinction:* Make sure to distinguish between *exemptions* (mental illness) and *excuses* (accidents) briefly, as the user mentioned them, to show I understand the text.
      *   *Final Polish:* Check for flow and clarity. Ensure the "verdict" is punchy.

  8.  **Final Review against Prompt:**
      *   Essay format? Yes.
      *   Lay out argument? Yes.
      *   Strongest objection? Yes.
      *   Best reply (induction analogy)? Yes.
      *   Take a side? Yes.

