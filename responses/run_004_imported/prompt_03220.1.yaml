      *   This definition is incorrect. 'Hesperus is Hesperus' fits the structural description (identity between rigid designators) but is *a priori*.
      *   The crucial missing piece is *cognitive significance* or *sense* (Fregean influence, though Kripke rejects Fregean *senses* for names, he acknowledges the difference in cognitive value).
      *   The distinction lies in *how* we know the reference is fixed, not just *that* the names are rigid.

