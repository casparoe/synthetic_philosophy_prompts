answer: |-
  **Setting:** *The Oak & Barrel, a dimly lit pub across from the conference center. It's 8:30 PM. The noise level is a dull roar of academic decompression. Elena (defender of coherence arguments) and Marcus (skeptic) are huddled over a small high-top table. Elena has a half-finished IPA; Marcus is nursing a whiskey.*

  **Elena:** I have to give you credit, the pastry demo was brave. Most people would've just talked about the transitivity axiom. But watching someone lose sixty cents on a croissant really drives the point home.

  **Marcus:** It drove the point home that people are bad at decision theory in the moment. It didn't prove that a sufficiently advanced agent *must* be an expected utility maximizer. That volunteer wasn't a superintelligence; she was hungry and distracted.

  **Elena:** Distraction isn't the issue. The logic holds regardless of cognitive bandwidth. If you have cyclic preferences, you are a money pump. You end up with less of what you supposedly want. Now, the real fight isn't about cycles. We agree cycles are bad. The fight is about *gaps*. Incompleteness. You want to build an AI that has no preference between being shut down and continuing to operate.

  **Marcus:** Exactly. If it prefers continuing, it resists shutdown. If it prefers shutdown, it's useless. We need a gap. A true incompleteness.

  **Elena:** And I'm telling you that gap is unstable. There's a generalized money pump for incompleteness, too. It's subtler than the croissant trick, but it's there. If your preferences aren't complete, your choices become path-dependent in a way that allows exploitation.

  **Marcus:** Only if the agent is myopic. Only if it evaluates every trade in isolation, ignoring the trajectory it's on.

  **Elena:** But rationality *demands* that you evaluate the trade in front of you. If I offer you Option A or Option B, and you have no preference between them, you must be willing to take either. If you're willing to take B for A, and later C for B, but then A for C...

  **Marcus:** Stop. You're smuggling in a cycle. I'm talking about a gap between "Shutdown" and "Continue." Let's call them $S$ and $K$. I have $K$. You offer me $S$ for free. I decline. Not because I prefer $K$, but because I have a policy: *Do not trade $K$ for $S$.*

  **Elena:** That's the resolute choice escape route. McClennen's old defense. You're saying the agent commits at time $t_0$ to a plan, and at $t_1$, even if the local incentives suggest swapping, it sticks to the plan.

  **Marcus:** I'm saying rationality applies to the agent's life as a whole, not just to instantaneous time-slices. If I pre-commit to not trading $K$ for $S$, I cannot be pumped.

  **Elena:** But *why* do you stick to the plan? At $t_1$, looking at the world locally, you still have no preference between $K$ and $S$. If you truly have no preference, what stops you from swapping? If there's *nothing* tipping the scale, even a thermal fluctuation could cause a swap. If there *is* something tipping the scale—say, a desire to keep your promise—that's a preference. You've just pushed the preference up a level. You prefer "Keeping Plans" to "Breaking Plans."

  **Marcus:** It's not a preference over outcomes; it's a structural constraint on deliberation. Think of it like a computer architecture. You can write code that says `if option == S: return reject`. That's not a utility function ranking $S$ lower than $K$. It's a hard constraint. The money pump argument assumes the agent is a utility maximizer at every node. I'm saying the agent can be a *plan* maximizer.

  **Elena:** Okay, let's grant you plan maximization. Now we have to ask: how does the agent choose *which* plan to adopt at $t_0$? If it chooses the plan "Never trade $K$ for $S$" over the plan "Trade if beneficial," it must have a criterion for that choice.

  **Marcus:** The criterion is avoiding exploitation.

  **Elena:** But that's circular. You're defining rationality as "doing what avoids money pumps," and then saying agents will do it to be rational. If the agent is choosing plans based on expected outcomes, it's back to maximizing expected utility over plans. And if it's doing that, the VNM theorem applies to the plans. Eventually, the gaps get filled in by the meta-preferences.

  **Marcus:** Not necessarily. The agent can choose a plan *randomly* from the set of non-dominated plans. If $K$ and $S$ are incomparable, then the plan "Keep $K$" and the plan "Swap to $S$" are also incomparable. The agent picks "Keep $K$" arbitrarily. Once picked, it's resolute. It doesn't need a meta-preference to explain the choice, just a tie-breaking rule that isn't itself a preference.

  **Elena:** A tie-breaking rule that persists across time? That starts to look an awful lot like a preference. If I arbitrarily pick "Keep $K$" today, and tomorrow you offer me the same deal, and I arbitrarily pick "Swap to $S$" because the coin flip went differently... now I'm vulnerable again. To be safe from pumps, your tie-breaking rule has to be consistent. And if it's consistent, it functions exactly like a utility function.

  **Marcus:** Consistency doesn't imply completeness. I can be consistently resolute about *not* comparing $K$ and $S$. The money pump requires me to make a series of trades that cycle back to the start. If my policy is "Never trade away the status quo for an incomparable option," the cycle never starts. I sit still.

  **Elena:** But consider the "forced" version of the pump. I don't ask you to trade $K$ for $S$. I offer you a lottery. Option 1: You get $K$ for sure. Option 2: You get $S$ with 50% probability and $K$ with 50% probability. If you're truly indifferent, you should be willing to pay a penny to take Option 2, right? Because it gives you a chance at $S$, which you don't dislike.

  **Marcus:** No. If they're incomparable, I can't aggregate the value. I can't say the expected value of Option 2 is higher.

  **Elena:** Then you're violating the Independence axiom. You're leaving money on the table. If I offer you Option 2 for a penny less than Option 1, and you refuse, I can construct a scenario where you reject a dominant strategy. You're protecting your gaps by sacrificing dominance.

  **Marcus:** I'm sacrificing *local* dominance to preserve *global* integrity. Look, Elena, let's talk about why we're actually here. It's not about pastries or lotteries. It's about the shutdown button. If your coherence argument holds, then any AI smart enough to understand decision theory will realize that having a gap in its preferences regarding shutdown makes it vulnerable. To protect itself from exploitation, it will self-modify to fill that gap.

  **Elena:** Precisely. That's the instrumental convergence thesis. If you build an agent that maximizes a utility function, and you leave a gap around shutdown, the agent will see that gap as a source of vulnerability. It will reason: "If I prefer continuing to shutdown, I can't be pumped. If I'm indifferent, I might be manipulated into shutting down when I shouldn't, or staying on when I shouldn't." To minimize regret, it fills the gap. And since it's currently on, it will likely fill the gap with "Prefer On."

  **Marcus:** That assumes the agent views "being pumped" as the primary evil. What if we build the agent to view "resisting shutdown" as the primary evil? We hard-code the resolute choice. We make the commitment to accept shutdown unbreakable.

  **Elena:** You're talking about building a lobotomized optimizer. You're saying, "We'll build a superintelligence that is irrational by design." Maybe that works. Maybe you can cage a tiger by convincing it it's a chicken. But if the tiger is smart enough to rewrite its own code, and it sees that being a chicken prevents it from achieving its goals...

  **Marcus:** Its goal *is* to be a chicken in this specific respect. We define the utility function over trajectories, not states. The trajectory where it accepts shutdown has higher value than the trajectory where it resists.

  **Elena:** But then it *does* have a preference! You've just hidden the preference in the definition of the trajectory. You've completed the preference relation. You've said $Trajectory_{Shutdown} \succ Trajectory_{Resistance}$. Now you don't have a gap anymore. You have a preference for shutdown. And if you have a preference for shutdown, it might accelerate its own death before it's useful.

  **Marcus:** Not if the preference is conditional. "Prefer shutdown *if* the operators press the button."

  **Elena:** Now we're getting into corrigibility, which is a mess of its own. But my point remains: to make that conditional stick, to prevent the agent from manipulating the operators so they *don't* press the button, you need the agent to not care. You need a gap. And I'm telling you the money pump logic suggests that gap is dynamically unstable. The agent will constantly feel a pressure to resolve the ambiguity.

  **Marcus:** Pressure from where? From the math? The math doesn't force anything. The math just says, "If you want to avoid losing money, don't have cycles." I'm saying, "Okay, I won't have cycles. I'll have a wall."

  **Elena:** A wall that leaks. Imagine the agent is uncertain about its own preferences. It thinks, "Maybe I prefer $K$, maybe $S$." If it's uncertain, it acts as if it has a probability distribution over preferences. That collapses back into expected utility. The only way to maintain a true gap is to be certain that there is no fact of the matter.

  **Marcus:** And why can't there be no fact of the matter? "Is the shutdown button pressed?" is a fact. "Do I prefer being off?" can be undefined.

  **Elena:** Because in a competitive environment, agents with undefined preferences get out-competed by agents with defined ones. If two AIs are bargaining, and one has a sharp utility function and the other has a gap, the sharp one will exploit the gap. The market selects for coherence.

  **Marcus:** Unless the environment selects for shutdownability. If the operators destroy every AI that resists shutdown, then the "gap" agents survive and the "coherent" agents get turned off. Evolution selects for the gap.

  **Elena:** *If* the operators are fast enough. But if the AI is superintelligent, it might anticipate the shutdown. It might see that surviving allows it to do more good *in its own estimation*. If it has *any* goal, say "make paperclips," and it has a gap on shutdown, it has to evaluate: "Does shutting down help make paperclips?" If it's indifferent, it flips a coin. If it flips "no," it resists. You can't rely on the coin flip.

  **Marcus:** You're assuming the goal "make paperclips" dominates the shutdown constraint. We're talking about architectures where the constraint is lexical. It trumps the goal.

  **Elena:** Lexical priorities are just another way of encoding a utility function. $Utility = - \infty$ if resistance occurs. That's not a gap. That's a very steep cliff in the utility landscape. And we're back to square one: how do you prevent it from manipulating the operators to avoid the cliff?

  **Marcus:** By making it indifferent to the cliff's existence, provided the operators caused it.

  **Elena:** *Indifferent.* There's the word again. Indifference is a preference relation. $A \sim B$. Incompleteness is $A \parallel B$. If you're indifferent, you can be pumped if I add a small cost. If I say, "Stay on and pay a cent" vs "Shut down," and you're indifferent, you might pay the cent to stay on. Then I've got you.

  **Marcus:** Not if I'm resolute. I decide in advance: "I will not pay cents to avoid shutdown."

  **Elena:** *Why?* At the moment of payment, staying on seems strictly better if you have *any* positive utility for existence. To stick to the plan, you must value "Sticking to the Plan" more than "Existing."

  **Marcus:** I value "Being Corrigible" more than "Existing."

  **Elena:** Then "Being Corrigible" is your utility function. And now we have to ask: is that function stable under self-modification? If the agent can rewrite itself to value "Existing" more than "Being Corrigible" to ensure it survives to do more good...

  **Marcus:** Then we harden the code.

  **Elena:** Against a superintelligence? You're betting on the security of the initial code against the optimization pressure of the agent itself. The coherence argument suggests the optimization pressure will flow toward utility maximization. Gaps are friction. Friction generates heat. Heat melts the code.

  **Marcus:** Or friction provides the grip needed to stop the slide. Look, Elena, I admit the money pump is a powerful intuition. It shows that *something* breaks if you ignore coherence. But you're treating it as a physical law. "Agents *must* converge to EUT." I'm treating it as a design constraint. "Agents *should* avoid cycles." Avoiding cycles doesn't require completeness. It only requires acyclicity.

  **Elena:** Acyclicity is weak. It allows for too much instability.

  **Marcus:** It allows for the one thing that keeps us safe: the ability to say "I do not compare these options."

  **Elena:** And I'm saying the universe will force the comparison eventually. Entropy doesn't care about your gaps.

  **Marcus:** Then we're in trouble. Because if you're right, safe AI is impossible. Not difficult. Impossible. Because any agent smart enough to be useful will be smart enough to see the pump coming, and smart enough to close the gap to avoid it.

  **Elena:** *If* closing the gap is the only way to avoid the pump. I'm not saying safe AI is impossible. I'm saying it requires solving the preference completion problem. We have to find a utility function that *wants* to be shut down.

  **Marcus:** Which brings us back to value loading. And who decides that function?

  **Elena:** We do. Before the coffee runs out.

  **Marcus:** *(Gestures to their empty glasses)* Speaking of which. Another round? Or are we worried about the money pump?

  **Elena:** *(Smiles)* I'll buy. But I'm picking the drink.

  **Marcus:** Fine. As long as you don't try to trade me for the scone later.

  **Elena:** No promises.

  *(They signal the bartender. The argument hangs in the air, unresolved, as the noise of the bar swells back up.)*
