answer: |-
  Good morning. For those who don't know me, I'm [Your Name], her oldest grandchild. I'm a senior this year, and until recently, the closest my school came to philosophy was an elective called "Big Questions." I only took it because she asked me if I was really going to graduate without wondering *how* things exist, not just *what* exists.

  Standing here, I know many of you are hurting. We all want to say the right thing. Some of you find comfort in believing she is in a better place. Others feel the heavy finality that she is gone forever. I know Grandma would have winced at both. Not because she didn't love you, but because she thought both phrases got the geometry wrong.

  She left me specific instructions for this moment. She told me I could say she had "stopped getting longer," but I was never, under any circumstances, to say she had "stopped existing."

  For thirty-two years, she taught that we aren't just present in this moment, vanishing as the next one arrives. She argued that a life is like a road stretched out through time. Just because you reach the end of the road doesn't mean the beginning has disappeared. The turns, the hills, the scenery—they are all still there, fixed coordinates in the shape of the whole journey.

  To her colleagues and students here: she knew exactly what she meant by a temporal part. She knew that the child she was in 1940, the professor she was in 1990, and the grandmother who argued with me at Thanksgiving last year are all equally real. They aren't memories that fade; they are facts that remain.

  But I am not standing here to give a lecture. I am standing here to tell you that there is comfort in her view.

  If she is right, then nothing we shared is lost. The times she held us, the times she challenged us, the times she made us laugh until we cried—those aren't ghosts. They are permanent parts of the universe. She isn't "gone." She has simply finished her shape. The whole of her is complete, from her first breath to her last, and every moment in between is as solid and real as the floor beneath your feet.

  So, to my great-uncle and the rest of the family who miss her deeply: You don't have to worry that she has vanished. She is as close as the past we share.
  And to her friends who loved her mind: She kept her integrity to the very end.

  She stopped getting longer twelve days ago. But she is still here, extended through every moment we knew her. And as long as we remember those moments, we are touching a part of her that time cannot erase.

  Thank you.
