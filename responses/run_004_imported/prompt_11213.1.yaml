      *   **The Realist (let's call her "Elena"):** Needs to be sharp, well-versed in Quine's own holism, pressing the *explanatory* role of moral facts. She shouldn't be a Kantian or a prescriptivist; she must be a *naturalist*. She argues that moral facts are part of the best explanation of the world, just like theoretical entities in physics.

  3.  **Drafting - Section by Section:**

