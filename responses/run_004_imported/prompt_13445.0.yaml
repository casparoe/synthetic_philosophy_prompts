answer: |-
  Good evening. For those who don't know me, I'm [Name], a friend from graduate school. When [Partner A] and [Partner B] asked me to speak, they gave me one specific instruction: I had to talk about the line.

  You've seen it on the programs. Months ago, at a dinner, I told them there is "no possible world in which the two of them did not end up together." [Partner B] liked it enough to build a proposal around it. And now, here we are.

  But I have a confession. Once I agreed to give this address, I started worrying. Specifically, I started worrying about the metaphysics.

  If you know the literature, you know the line doesn't survive contact with the standard theories. If we go with David Lewis, what exists in other worlds aren't *them*, strictly speaking, but counterparts selected by resemblance. And as Kripke pointed out with Humphrey, why should we care about the romantic success of someone who merely resembles you? On the other hand, if we insist on genuine transworld identity to save the sentiment, we run straight into Chisholm's Paradox: a chain of slightly different worlds where their identity slowly slips away until the judgment becomes arbitrary.

  So, technically, the statement on your program is either false or unintelligible.

  I tell you this not to ruin the mood, but because [Partner A] and [Partner B] asked me to be honest. They know the logic is shaky. But they also know that love is not a modal logic problem.

  The philosophers in the back are nodding. The rest of you are wondering why I'm talking about logic at a wedding. Here is the point: The metaphysics fails because it treats their relationship as something *found* in the structure of the universe. It assumes necessity is a pre-existing condition, like gravity or math.

  But [Partner A] and [Partner B] know better. They know that necessity isn't something you discover; it's something you build.

  When we say there is "no possible world" where they aren't together, we aren't making a claim about the multiverse. We are making a promise about *this* one. We are saying that their commitment is so robust, so resilient to the small shifts and changes of life—the Chisholm chains of career moves, illnesses, bad days, and growing older—that for all practical purposes, the distance between them *cannot* be bridged.

  They are not relying on a primitive fact of identity. They are relying on the work they put in every day to ensure that no matter how the world changes, they change *together*.

  So, to the philosophers: Yes, the counterpart relation is vague. Yes, transworld identity is fraught. But look at them. In *this* world, the actual world, the one where we are standing right now, they have chosen to make their union the closest thing to a necessary truth that human beings can create.

  And to the family: You don't need to worry about the other worlds. You don't need to calculate the resemblance metrics. You just need to know that in every version of the future they can imagine, they are in it, side by side.

  There is no possible world where they do not choose each other. And because they choose each other, this world is better than all the rest.

  Let's drink to [Partner A] and [Partner B].
