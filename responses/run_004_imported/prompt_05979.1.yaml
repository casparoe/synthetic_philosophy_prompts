answer: |-
  **Setting:** *A quiet corner of a university coffee shop, late afternoon. The remnants of two coffees sit on the table. **Elena** (Internalist, Williams-leaning) looks tired but alert. **David** (Externalist, McDowell/Korsgaard-leaning) is leaning forward, pen tapping against a notebook.*

  **David:** You're sticking to it, then? Even after we slept on it?

  **Elena:** I'm sticking to the logic, David. If Marcus genuinely has no element in his subjective motivational set—his $S$—that could lead him to help his friend move, even via a sound deliberative route, then it is simply false to say he has a reason to do it.

  **David:** But that's the intuition pump working against you. We *know* Marcus has a reason. He made a promise. The fact that he's currently too selfish to care doesn't dissolve the obligation. It just makes him a bad person.

  **Elena:** It makes him a person who won't act on a reason, if he has one. But I'm asking if he *has* one. Look, you're treating $S$ like a snapshot of his current urges. "I want comfort," "I want to avoid labor." That's not the Williams view. $S$ includes dispositions, projects, emotional commitments. And crucially, the "sound deliberative route" can expand $S$.

  **David:** How so?

  **Elena:** By correcting errors of fact, or by imaginative vividness. Maybe Marcus hasn't realized that helping his friend strengthens a social bond he actually values in the long run. Or maybe if he vividly imagined his friend's frustration, a latent disposition of empathy would trigger. If he deliberates *soundly* and finds a hook in $S$, then he has an internal reason.

  **David:** Okay, but let's push the case to the limit. That's where your view breaks. Suppose Marcus is exactly the person your friend described. A genuinely selfish agent. He knows the facts: his friend will struggle. He can imagine the frustration vividly. He understands the social bond. And he says, "I see all that, and I simply do not care. My comfort now outweighs any future benefit or latent empathy."

  **Elena:** Then he has no internal reason.

  **David:** And you're comfortable saying that? That there is *no reason* for him to keep his promise?

  **Elena:** I'm comfortable saying there's no reason *for him*. There might be reasons for *us* to blame him, or to try to change his $S$. But to say *he* has a reason, when nothing in his psychology could motivate him even under ideal conditions, is to posit a ghostly entity. What does that reason *do*? If it can't motivate, even in principle, it's not a reason for action. It's just a moralistic noise.

  **David:** It's not ghostly. It's normative. You're conflating "reasons for action" with "psychological causes." Look at your phrase: "sound deliberative route." Where does the standard of *soundness* come from?

  **Elena:** From instrumental rationality and logical consistency. Don't contradict yourself, don't ignore facts, don't use the wrong means to your ends.

  **David:** But that's the sleight of hand. If Marcus's end is "my own comfort," and the means to that is "breaking the promise," he is being instrumentally rational. If you say his deliberation is *unsound* because he should value fidelity, you've smuggled an external value into the definition of soundness.

  **Elena:** I haven't smuggled it in. I'm saying that if he values *nothing* but immediate comfort, he's a very thin agent. But most humans have complex $S$ sets.

  **David:** But you admitted the possibility. If he *doesn't* have those complex dispositions? If he's a pure egoist? Then on your view, morality has no grip on him. It becomes contingent on whether you happen to care about others.

  **Elena:** Morality *does* depend on that, David. If someone lacks the capacity to care about others, moral language doesn't apply to them in the first-person. We treat them like a force of nature. We don't say a hurricane has a "reason" to spare the village. We just try to stop it.

  **David:** That's dehumanizing him. And it misses the point of rational agency. To deliberate *at all* is to submit to norms. When Marcus asks, "Should I keep my promise?", he is asking a question that presupposes a standpoint outside his immediate desires. He's asking what is *to be done*.

  **Elena:** He's asking what he should do *given what he wants*.

  **David:** No. If I ask, "I want to poison this water, should I do it?" the answer is "No," regardless of my desire. The "should" comes from the nature of agency itself. Korsgaard puts it well: you constitute yourself as an agent through your actions. If you act on a maxim that undermines the very possibility of agency—like breaking promises, which relies on the institution of promising—you are contradicting your own rational nature.

  **Elena:** That's the Kantian move. It assumes rational nature is a substantive value. I deny that. Rationality is a tool. It tells you how to get from $A$ to $B$. It doesn't tell you that $B$ is worth reaching. If Marcus's $S$ contains only $B_{self}$, rationality serves $B_{self}$.

  **David:** But "sound deliberation" requires you to weigh considerations appropriately. If Marcus weights his trivial comfort as infinitely more important than his friend's serious need, isn't that a deliberative error?

  **Elena:** Is it? Or is it just a difference in valuation? If I prefer tea to coffee, that's not an error. If Marcus prefers comfort to fidelity, why is that an error of *reason* rather than just a moral failing?

  **David:** Because reasons are objective. The fact that he promised *is* a reason. It exists independently of his $S$. Your Internal Reasons Statement says: "A has a reason to $\phi$ only if A could reach $\phi$ via sound deliberation from $S$." I'm saying the truth condition for that statement is backwards. It should be: "A has a reason to $\phi$ if $\phi$ is supported by the facts. If A cannot be motivated by that fact, A is defective."

  **Elena:** Defective how?

  **David:** Rationally defective. Not just morally unpleasant.

  **Elena:** This is where I lose you. If I encounter a creature who is rationally perfect—instrumentally, logically—but whose $S$ is alien to me (say, a sociopath who enjoys pain), and I say, "You have a reason not to torture," and he says, "I acknowledge no such reason, nothing in my set connects to it," what work is my claim doing?

  **David:** It's holding him accountable to the standards of reason he implicitly invokes by engaging in dialogue with you.

  **Elena:** But he's not engaging. He's just stating his preference. Look, David, I think you're worried that if I'm right, we can't blame him. But we can. We can blame him because *we* have reasons to uphold norms. We can punish him. We don't need to lie and say *he* has a reason he can't access.

  **David:** It's not a lie. It's an appeal to his rationality. You're assuming $S$ is a black box that deliberation serves. I'm saying deliberation *shapes* $S$ by revealing what is actually valuable. When Marcus deliberates, if he is truly rational, he comes to see that the needs of others provide reasons. If he doesn't see that, he isn't "soundly deliberating." He's blind.

  **Elena:** Blind to what?

  **David:** To value. To the fact that human suffering is a reason for action.

  **Elena:** Now you're a realist. You're positing objective values floating out there that "hook" onto agents. I'm saying the hook has to be in the agent. If the hook is missing, the value doesn't function as a reason *for that agent*.

  **David:** The hook is his rationality. That's not missing.

  **Elena:** Rationality isn't a motive force, David. It's the steering. You need an engine. $S$ is the engine. If the engine is wired only to self-interest, the steering can't turn it toward altruism.

  **David:** But the steering *determines* what counts as a valid destination. You can't steer toward "break a promise for no gain" without violating the constitutive rules of the road.

  **Elena:** Those rules are social, not metaphysical.

  **David:** They are rational.

  *Silence hangs between them. David picks up his pen, stops, and puts it down.*

  **David:** Here's the worry, Elena. If you're right, then moral education is just manipulation. We're just trying to rewire people's $S$ sets to match ours. There's no sense in which we're helping them see something they *ought* to see regardless of their wiring.

  **Elena:** And if you're right, then there are people who are systematically blind to "objective reasons," and you can't explain how they see them other than by saying "be more rational." Which looks suspiciously like "share my values."

  **David:** I can explain it. They are failing to recognize the demands of their own agency.

  **Elena:** And I say that's a category mistake. Agency doesn't have demands. Agents do.

  **David:** So Marcus walks away. He leaves his friend stranded. He's warm, comfortable, and by your lights, he hasn't acted against a reason.

  **Elena:** He hasn't acted against an *internal* reason. He has acted against *our* expectations. He's an outsider to our moral community.

  **David:** He's a member of the human community. That's enough to have reasons.

  **Elena:** Then show me the link to his motivation. Without it, you're just shouting at a wall.

  **David:** And without my view, you're handing a map to someone who refuses to read it, and telling them the destination doesn't exist.

  *They sit with the impasse. The coffee is cold.*
