answer: |-
  Here are ten interview questions tailored for your episode. They are designed to move past the introductory "Frankfurt 101" material and engage with the specific structural vulnerabilities in the semicompatibilist position.

  The first three questions address your mandatory requirements (Robustness, Widerker/Buffers, and Question-Begging), complete with anticipated answers and specific follow-ups, including the "flicker" call-out. The remaining seven round out the episode with high-level literature questions.

  ### Part 1: The Core Structural Challenges (Mandatory)

  **1. The Robustness of Residual Alternatives**
  "Let's start with the 'flicker strategy.' Incompatibilists grant that Frankfurt cases eliminate *most* alternatives, but they insist there's always a residual difference—like 'signing on one's own' versus 'signing because the intervener didn't step in.' You've characterized these as mere flickers, not freedoms robust enough for responsibility. But can you cash out 'robustness' without simply defining it as 'whatever is sufficient for moral responsibility'? If the agent *could* have failed to sign in that residual sense, why is that possibility metaphysically or normatively inert?"

  *   **Anticipated Answer:** She will likely argue that robustness requires the alternative to be a *relevant* alternative for grounding responsibility, and that flickers are too fine-grained to serve as the basis for blame or praise. She may claim the alternative must involve a different *volitional* structure, not just a different causal history.
  *   **Follow-up:** "If the volitional structure is identical in both the actual sequence and the flicker alternative, then the difference seems purely historical. But if the difference is purely historical, aren't you implicitly conceding that *sourcehood* is doing the work, not the absence of alternatives? And if sourcehood is the real driver, why maintain the Frankfurt framework at all rather than just arguing for sourcehood directly?"
  *   **The 'Flicker' Call-Out:** "I want to press you on the 'flicker, not a freedom' line you used in your talk last spring. If I hear you correctly, you're dismissing these residual possibilities because they don't feel like the *kind* of freedom incompatibilists want. But isn't that just asserting your conclusion? To the incompatibilist, *any* open future is a foothold. By labeling it a 'flicker,' are you offering an argument for why it's insufficient, or are you just stipulating that it doesn't count so you can move on?"

  **2. Widerker's Dilemma and Buffer Cases**
  "Moving to the Kane-Widerker objection: they argue that Frankfurt cases surreptitiously presuppose determinism to rule out alternatives. Mele and Robb tried to fix this with 'buffer cases'—using a neural buffer that triggers the intervener only if the agent shows a prior sign of choosing otherwise. Do you think these buffered cases successfully escape the dilemma, or does the requirement that the buffer be a reliable predictor just relocate the determinism assumption into the buffer mechanism itself?"

  *   **Anticipated Answer:** She will likely defend the buffer case, arguing that the buffer relies on probabilistic causation or non-deterministic indicators, thus preserving the indeterminacy of the actual sequence while still ruling out the alternative.
  *   **Follow-up:** "But for the buffer to be effective, the correlation between the 'prior sign' and the 'final choice' must be unbreakable. If that correlation is unbreakable, doesn't the agent still lack the power to do otherwise in the robust sense? If the correlation *is* breakable, then the counterfactual intervener might not trigger, and the alternative possibility returns. How do you thread that needle without the buffer acting as a deterministic choke point?"

  **3. The Charge of Question-Begging**
  "Here's the dialectical worry that keeps coming up. Semicompatibilism argues that guidance control (actual sequence) is sufficient for responsibility, even if leeway control (alternative possibilities) is absent. But the leeway incompatibilist denies that actual sequence facts *ever* suffice without leeway. When you present Frankfurt cases, aren't you simply assuming the sufficiency of the actual sequence from the start? How do you provide an independent argument for actual-sequence sufficiency that doesn't just ask the incompatibilist to grant your conclusion?"

  *   **Anticipated Answer:** She will likely appeal to the intuition that we hold people responsible in normal deterministic-seeming scenarios, or argue that the *nature* of responsibility is about ownership of the action, not the metaphysical landscape of options.
  *   **Follow-up:** "But the incompatibilist agrees we *practice* responsibility that way; they just argue the practice is unjustified without leeway. If your defense rests on the intuition that 'Jones looks responsible,' the incompatibilist says that intuition is theory-laden and false. Is there a neutral ground—a premise about agency or normativity—that you and the incompatibilist can both accept, from which you can derive actual-sequence sufficiency without begging the question?"

  ### Part 2: Expanding the Debate (Literature-Savvy Questions)

  **4. Sourcehood vs. Leeway**
  "You distinguish guidance control from regulative control. But some critics argue that 'sourcehood' is just leeway in disguise. If I am the source of my action, doesn't that imply that, at some point, I could have initiated a different causal chain? If sourcehood doesn't imply the ability to do otherwise, what metaphysical work is the term 'source' actually doing?"

  **5. The Manipulation Argument (Pereboom)**
  "Derk Pereboom's four-case manipulation argument is designed to show that there is no relevant difference between a determined agent and a manipulated agent. Since semicompatibilists usually concede that manipulated agents aren't responsible, doesn't this force you to admit that determinism *does* undermine responsibility, contrary to the semicompatibilist thesis? Where exactly do you draw the line between determination and manipulation?"

  **6. Reasons-Responsiveness and Mechanism**
  "Your account relies heavily on reasons-responsiveness. But critics note that an agent can be reasons-responsive in a general sense but fail to respond to the *specific* moral reasons at stake in a particular moment due to compulsion or ignorance. Does your account require *strong* reasons-responsiveness (could have responded otherwise) or just *weak* (would have responded if reasons were different)? And if it's the latter, doesn't that slide back into a conditional analysis that incompatibilists have rejected for decades?"

  **7. Asymmetry Between Praise and Blame**
  "Frankfurt cases seem intuitively stronger when applied to moral blame (preventing a murder) than to moral praise (preventing a saintly act). Some argue this suggests that alternative possibilities are actually necessary for praiseworthiness, even if not for blameworthiness. Do you think there is an asymmetry here, or must the semicompatibilist bite the bullet and say neither praise nor blame requires alternatives?"

  **8. Historical Conditions and Luck**
  "Al Mele has argued that without a proper history, an agent's values and reasons-responsiveness might be the product of luck (e.g., indoctrination). Even if the actual sequence is clean *now*, doesn't the *history* of how that sequence came to be matter for responsibility? Can a purely structural account of guidance control survive without a historical condition, and if you add one, does it reintroduce the need for alternative possibilities in the past?"

  **9. The Strawsonian Turn**
  "Many semicompatibilists lean on P.F. Strawson, arguing that our reactive attitudes are non-optional and constitute the framework of responsibility. But if neuroscience or metaphysics shows that the 'participant stance' is based on a false belief about human freedom, doesn't the Strawsonian defense collapse? Can we really maintain the practice of responsibility if we are convinced the metaphysical underpinnings are illusory?"

  **10. The Stakes of the Debate**
  "Finally, if you win this debate—if we accept that alternative possibilities are irrelevant to moral responsibility—what changes? Does it affect how we structure our legal system, our interpersonal relationships, or our self-conception? Or is semicompatibilism primarily a metaphysical salvage operation designed to save responsibility from determinism without changing how we actually live?"
