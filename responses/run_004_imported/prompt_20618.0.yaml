answer: |-
  This is a fantastic observation, and your instincts are significantly sharper than your supervisor's dismissal suggests. While your supervisor is offering pragmatic advice regarding word count (a crucial constraint in the IB Extended Essay), intellectually, she is relying on an older, compartmentalized view of Sidgwick that contemporary scholarship has largely overturned.

  You are not missing something about Sidgwick; rather, you have stumbled upon one of the most significant debates in modern Sidgwick scholarship. To answer your specific suspicions: **No, his psychical research does not lower our confidence in his rigor, and No, the two projects were not compartmentalized.** In fact, they were intimately bound together by the central philosophical problem of *The Methods of Ethics*.

  Here is a breakdown of why your intuition is correct, how the two projects connect, and how you might navigate this in your EE without alienating your supervisor.

  ### 1. Was Sidgwick being credulous? (The Rigor Question)
  It is a common caricature to view Sidgwick's involvement with the Society for Psychical Research (SPR) as a lapse into Victorian superstition. However, Sidgwick did not approach séances as a believer looking for confirmation; he approached them as an **evidentialist looking for data.**

  Sidgwick's ethical method was famously critical of "common sense" morality. He demanded that moral intuitions be consistent, clear, and mutually supportive. He applied this same empirical skepticism to psychical phenomena. He was not looking for "ghosts"; he was looking for empirical evidence of **telepathy** and **survival after death**.

  Crucially, Sidgwick was largely disappointed by the results. He never claimed to have found conclusive proof. His commitment to the SPR was not a commitment to the *truth* of spiritualism, but a commitment to the *scientific method*. He believed that if such phenomena existed, they should be subject to the same rigorous scrutiny as any other natural phenomenon. Far from undermining his rigor, his psychical research demonstrates that his commitment to empiricism was so strong that he was willing to investigate marginalized phenomena that his peers mocked, provided there was a sliver of empirical possibility.

  ### 2. Are the projects compartmentalized? (The Philosophical Link)
  This is the most important point for your essay. The two projects are **philosophically integrated.**

  In *The Methods of Ethics*, Sidgwick arrives at a famous and troubling conclusion known as the **"Dualism of Practical Reason."**
  *   **Method 1 (Rational Egoism):** It is rational to pursue my own happiness.
  *   **Method 2 (Universal Hedonism/Utilitarianism):** It is rational to pursue the general happiness.

  Sidgwick finds that both methods are equally rational. However, they often conflict. If I sacrifice my own happiness for the greater good, and there is no afterlife or moral order to the universe, I have acted irrationally regarding my own self-interest. As Sidgwick famously wrote, the contradiction between duty and self-interest creates a "fundamental contradiction" in our moral reasoning.

  For Sidgwick's utilitarianism to be fully rational, there must be a **moral order of the universe** (typically implying God and an afterlife) where virtue and happiness are ultimately reconciled.

  **Here is the connection:** Sidgwick turned to psychical research because he hoped it could provide **empirical evidence** for that moral order. He couldn't prove the existence of God through pure reason (Kant had tried and failed, in Sidgwick's view), but if he could find scientific evidence for survival after death or telepathy, it would suggest that the universe is not merely materialistic. It would offer the "theological premise" needed to resolve the Dualism of Practical Reason.

  Therefore, the psychical research was not a hobby; it was an attempt to solve the deepest unresolved problem in his ethical system using empirical means.

  ### 3. Advice for your Extended Essay
  Your supervisor is right about one thing: **Word Count.** The IB EE limit is 4,000 words. A biographical digression can easily eat up 500 words without adding to the *philosophical analysis*, which is what examiners are looking for.

  However, you are also right that ignoring this context flattens your understanding of his "rigor." Here is a strategic way to handle this:

  **Do not write a biography.** Do not dedicate a section to "Sidgwick's Life and the SPR."
  **Do integrate the motivation.** When you discuss the "Dualism of Practical Reason" or the limits of Sidgwick's utilitarianism, you can briefly note *why* Sidgwick found this dualism so troubling and what he hoped might resolve it.

  **Suggested approach:**
  1.  **Focus on the Text:** Keep the core of your essay on the arguments within *The Methods of Ethics*.
  2.  **Use the Context as Analysis:** When analyzing the "Dualism of Practical Reason," you can write something like:
      > "Sidgwick viewed this dualism as a catastrophic failure of moral rationality. His subsequent investment in psychical research is best understood not as a lapse in judgment, but as a desperate attempt to find empirical evidence for a moral order that would reconcile egoism and utilitarianism. This underscores that for Sidgwick, the rationality of ethics depended on the metaphysical structure of the universe."
  3.  **Cite Modern Scholarship:** If you mention this, cite a scholar who supports this view. **Bart Schultz** is the authority here. His biography, *Henry Sidgwick: Eye of the Universe* (2004), is the definitive work that established the link between Sidgwick's ethics and his psychical research. Mentioning Schultz shows the examiner you have done deep research without wasting words on biography.

  ### Summary
  *   **Your Supervisor:** Pragmatically right about space, intellectually outdated about the connection.
  *   **Your Suspicion:** You are correct to sense a connection. It is not a "quirky footnote."
  *   **The Rigor:** Sidgwick remained rigorous; he was seeking empirical proof for a metaphysical necessity, not believing in ghosts on faith.
  *   **The Strategy:** Don't make it a biographical section. Use it to deepen your analysis of the *Dualism of Practical Reason*.

  If you can articulate that Sidgwick's psychical research was an extension of his desire to make Utilitarianism *rationally binding* rather than just morally appealing, you will demonstrate a level of critical thinking that often distinguishes top-scoring EEs. Just keep it tight.

  **Recommended Reading for your background (not necessarily for citation):**
  *   Bart Schultz, *Henry Sidgwick: Eye of the Universe* (Specifically the chapters on the SPR).
  *   Roger Crisp, *Routledge Philosophy Guidebook to Mill and Utilitarianism* (Often touches on Sidgwick's critique).
  *   Sidgwick's own essay, "The Ethics of Religious Conformity" (Shows his nuanced view on belief).

  You have identified a genuine philosophical tension. Trust that insight, but wield it surgically within the word limit.
