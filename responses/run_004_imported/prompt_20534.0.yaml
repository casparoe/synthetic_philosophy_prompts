  the question was: "Explain Mill's harm principle as presented in On Liberty. Your answer should (a) explain the distinction between self-regarding and other-regarding conduct, (b) explain why Mill denies that a person should be legally free to sell themselves into slavery even though this looks like a self-regarding choice, and (c) explain ONE way that Joel Feinberg's later 'offense principle' relates to Mill's harm principle." its out of 10 points, split 3/4/3 across a/b/c.

