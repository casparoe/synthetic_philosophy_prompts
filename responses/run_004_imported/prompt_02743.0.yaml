answer: |-
  **The Web and the Turnip: Quine, White, and the Naturalization of Ethics**

  In "Two Dogmas of Empiricism," W. V. O. Quine revolutionized epistemology by dismantling the boundary between analytic truths (true by definition) and synthetic truths (true by fact). He proposed instead a "web of belief," where all statements, from logic to physics, face the tribunal of experience not individually but as a corporate body. Decades later, in his 1978 essay "On the Nature of Moral Values," Quine applied his naturalistic lens to ethics, only to halt at a surprising boundary. While he dissolved the fact/value distinction in practice, he maintained that ethics remains methodologically inferior to science. His colleague Morton White, in *What Is and What Ought to Be Done*, charged that this hesitation betrayed Quine's own holism. To understand who wins this dispute, we must examine whether Quine's distinction is a necessary pragmatic observation or a relapse into the very dogmatism he sought to destroy.

  Quine's case for ranking ethics beneath science rests on the absence of an external empirical anchor. In "On the Nature of Moral Values," Quine begins with the curious image of a dog sitting motionless near a turnip. He uses this to illustrate that behavior is a function of both belief and desire; one cannot isolate a pure "fact" from the "value" driving the action. He extends this to human morality through the example of fishing. Initially, fishing is a mere means to the end of eating. Over time, however, the means can become an end in itself; one fishes for the love of fishing. This fluidity creates a continuum between prudence and morality. Quine argues there is no sharp wall between a fondness for peanut brittle and a concern for a neighbor's welfare; both are dispositions rooted in our psychological makeup.

  However, Quine draws a line at methodology. In science, when the web of belief conflicts with experience, we have "observation sentences"—reports of sensory stimulation—that act as a checkpoint. If a prediction fails, the world pushes back. In ethics, Quine argues, there is no comparable checkpoint. We cannot test a moral principle against physical reality in the same way we test a hypothesis about gravity. Consequently, moral disagreements cannot be settled by appealing to the world, but only by appealing to the moral standards people already share. For Quine, ethics is trapped in a coherence theory of truth; it can only check its internal consistency, not its external correspondence. As he famously concludes, a coherence theory is simply "the lot of ethics." Science answers to the world; ethics answers only to itself.

  Morton White's objection, articulated in *What Is and What Ought to Be Done*, is that this conclusion is inconsistent with Quine's own holism. White argues that if Quine is right that even logic and mathematics are part of the web answerable to experience, there is no principled reason to exclude moral values. White accepts Quine's premise that behavior mixes belief and desire, but he rejects the idea that this leaves ethics unmoored. For White, the "empirical edge" of the ethical web is not physical sensory stimulation, but *moral sentiment*. Feelings of guilt, empathy, approval, and outrage are natural phenomena just as much as retinal stimulation.

  White contends that moral judgments function as hypotheses that explain and organize these moral sentiments. Just as a physicist adjusts a theory to accommodate new sensory data, a moral agent adjusts a moral principle to accommodate shared sentiments of justice or cruelty. By denying this, White argues, Quine is reintroducing a dualism between fact and value that his "Two Dogmas" was supposed to eliminate. If the web is seamless, then moral sentiments must serve as the empirical constraints for ethics, exactly as sense experience serves science. To claim ethics is "worse off" is to privilege physical stimulation over emotional and social stimulation without justification.

  So, who wins? The dispute turns on the definition of "experience." Quine assumes that for experience to count as a genuine checkpoint, it must be physically recalcitrant—something that resists our will in a hard, objective way. White assumes that for experience to count, it need only be a natural event that constrains our theorizing.

  The verdict is that **White wins the philosophical argument regarding consistency, while Quine wins the pragmatic argument regarding stability, but Quine is wrong to interpret this instability as an infirmity.**

  Quine is empirically correct that ethics lacks science's *hard* checkpoint. Physical reality resists our beliefs about it more stubbornly than social reality resists our moral beliefs. We cannot wish away gravity, but societies can and do wish away moral norms (e.g., shifting views on slavery or dietary restrictions). This difference in "friction" is real. However, White is logically correct that this difference is one of degree, not kind. Moral sentiments *are* empirical facts about human psychology and sociology. They constrain moral theory; a moral system that consistently produces feelings of revulsion in its practitioners will eventually be discarded, just as a scientific theory that consistently fails prediction will be.

  Quine's error lies in labeling this difference an "infirmity." By calling ethics methodologically "worse off," he implies that the lack of physical recalcitrance makes moral truth less real or less rational. This is a residue of the logical positivism Quine claimed to have defeated. If we accept naturalism—that humans are part of the natural order—then human sentiments are natural data. The fact that this data is softer and more variable than light rays does not make the methodology of ethics incoherent; it merely makes it more complex.

  Therefore, Quine's holism ultimately vindicates White. If the web of belief is truly seamless, there can be no "exempt" zones where coherence reigns without empirical input. Moral sentiments provide that input. Quine is right that ethics lacks science's specific type of checkpoint, but he is wrong to call this an outright infirmity rather than a difference in kind. Ethics is not a broken science; it is a science of a different subject matter—human valuation rather than physical motion. To deny this is to hold ethics to a standard of "hardness" that even parts of science (like psychology or economics) struggle to meet. White correctly identifies that Quine stopped halfway in his own revolution: he naturalized epistemology, but he left ethics lingering in the realm of mere sentiment. A consistent Quinean must be a Whitean: ethics is continuous with science, answerable to the empirical edge of human feeling, and no less rational for it.
