answer: |-
  This is a sophisticated question that cuts to the heart of constitutional theory. Both you and your friend have identified genuine tensions in Douglass's thought, but based on the specific textual arguments of his 1860 Glasgow speech, **your assessment is the more historically and methodologically accurate one.**

  While your friend is correct that Douglass sought to constrain judicial willfulness, he is incorrect about *what* Douglass believed should serve as the constraint. Douglass argued for constraint by **textual clarity and moral principle**, whereas the modern "history and tradition" school argues for constraint by **historical practice.**

  Here is an assessment of how Douglass would likely view the Court's current methodology, working strictly from the arguments he advanced in Glasgow.

  ### 1. Practice vs. Meaning: The Core Disagreement
  The central pillar of Douglass's Glasgow speech is the distinction between what the government *did* and what the Constitution *said*.

  Douglass acknowledges the abolitionist argument that for 70 years, the federal government had acted as a pro-slavery entity. His rebuttal is explicit: **"I deny that the practice of the government under the Constitution settles the question of the Constitution itself."** He argues that a long history of unconstitutional action does not make that action constitutional.

  *   **The Modern Court:** In *Dobbs* and *Bruen*, the Court essentially argues that if a right was not historically recognized or regulated in a certain way during the relevant historical period, it does not exist (or is not protected) today. History is used to validate the scope of the right.
  *   **Douglass's View:** Douglass would argue this is a category error. To Douglass, the 70-year history of slavery was a history of *violating* the Constitution, not fulfilling it. If the Court uses history to determine the scope of liberty, it risks codifying past violations as constitutional precedents.

  Douglass would likely argue that the *Dobbs* majority's reliance on the fact that abortion was criminalized in the 19th century is analogous to arguing that slavery was constitutional because it was practiced in the 19th century. For Douglass, historical suppression of a liberty is evidence of injustice, not evidence of constitutional limitation.

  ### 2. The Presumption of Liberty vs. The Presumption of Status Quo
  Douglass proposes a specific canon of construction for ambiguous text: **"Whenever human liberty and justice are at stake... we are bound to presume in favor of liberty."** He insists that rights are the default and that curtailment requires language of "irresistible clearness."

  *   **The Modern Court:** The *Glucksberg/Dobbs* framework operates on a reverse presumption. If a right is not "deeply rooted in this Nation's history and tradition," the presumption is that it is *not* protected. The burden is on the claimant to prove historical pedigree.
  *   **Douglass's View:** This would be anathema to Douglass. He places the burden on the state to justify restrictions with clear text, not on the citizen to justify rights with historical precedent.

  If Douglass were assessing *Bruen* (which requires historical analogues for gun regulations), he might accept the textual focus, but he would reject the idea that a lack of historical analogue defeats the right. Conversely, in *Dobbs*, he would reject the idea that a lack of historical protection defeats the liberty interest. For Douglass, silence in history does not equal silence in the Constitution; silence in the Constitution equals liberty.

  ### 3. Constraint: Moral Principles vs. Historical Facts
  Your friend's strongest point is that Douglass wanted judges constrained by something "more fixed than their own moral convictions." This is true. Douglass was wary of judges simply imposing their will. However, you must look at *what* fixed standard Douglass proposed.

  *   **The Friend's View:** Douglass wants fixed constraints; "history and tradition" are fixed constraints; therefore, Douglass supports this method.
  *   **The Flaw:** Douglass's "fixed constraint" was the **text read through the lens of natural rights.** He believed the Constitution was designed to secure pre-existing natural rights.
  *   **The Modern Court:** The "fixed constraint" is **historical consensus.**

  Douglass would argue that "history and tradition" is not a neutral constraint; it is a record of power dynamics. In 1860, the "history and tradition" of the United States unequivocally supported the subordination of Black people. If the Court in 1860 had applied the *Dobbs* test to the rights of African Americans, they would have found no "deeply rooted" tradition of equality.

  Douglass would likely argue that the modern method mistakes **power for principle.** Just because a majority historically had the power to suppress a certain conduct (whether owning guns in certain ways or seeking abortions) does not mean the Constitution granted them the authority to do so permanently.

  ### 4. The "Living" Nature of the Union
  Finally, Douglass viewed the Constitution as an instrument for creating a "more perfect union." This implies progress away from the sins of the past, not entrenchment of them.

  In Glasgow, he argues that the Constitution's purposes are found in its Preamble ("secure the blessings of liberty"), not in the historical baggage of the framers' compromises. He separates the *intentions* of the framers (some of whom were slaveholders) from the *law* they enacted.

  The modern "history and tradition" test often conflates the two. It asks: *What did society accept as lawful in 1791 or 1868?* Douglass would answer: *They accepted many things that were inconsistent with the blessings of liberty.* To bind the present to the moral blind spots of the past is, for Douglass, to betray the Constitution's purpose.

  ### Conclusion
  Your friend is right that Douglass was a textualist who wanted to avoid judicial caprice. But Douglass believed the text should be read as a **bill of rights for all people**, constrained only by explicit language. The modern "history and tradition" school reads the text as a **codification of past practices**, constrained by historical silence.

  Douglass would likely assess the current Court's methodology as a revival of the very logic he fought against in 1860: the idea that **long-standing practice legitimizes itself.** He would argue that if a right is consistent with liberty and not explicitly forbidden by "irresistible clearness," the fact that history denied it is an indictment of history, not a limitation on the Constitution.

  You win the argument, but with a nuance: Douglass shares the originalists' desire for textual constraint, but he fundamentally rejects their evidentiary basis for defining liberty. He would view *Dobbs* and *Bruen* not as restoring the rule of law, but as enshrining the "pro-slavery practice" of the past as the constitutional standard for the future.
