prompt: |-
  I run a philosophy podcast for listeners who've cut their teeth on Bostrom's work and the old Overcoming Bias and LessWrong anthropics threads, and next month's guest is a philosopher who defends the Self-Sampling Assumption (SSA) over the Self-Indication Assumption (SIA), chiefly on the strength of the presumptuous philosopher thought experiment. Draft eight to ten interview questions that go beyond having her simply restate that argument. I want at least one question pressing the tu quoque reply -- that rejecting SIA merely for being counterintuitive is inconsistent with accepting SSA's own counterintuitive Doomsday shift toward sooner extinction; at least one on how she fixes a reference class narrow enough to block the objection that the Doomsday shift's very existence and size depend on a choice she hasn't independently motivated; and at least one on the standard SIA-side rebuttal that the presumptuous philosopher isn't actually irrational, since in the large universe an overwhelming majority of people in that same epistemic position would be reasoning correctly. For each, add a follow-up keyed to the answer she's most likely to give.
