answer: |-
  This is one of the most common yet rarely discussed hells of complex fiction writing. You are not missing a secret talent; you are encountering the limits of working memory against the complexity of your architecture.

  To answer your core question directly: **It is not purely intuition.** While experienced novelists do develop a "feel" for narrative causality, the confidence you observe is usually the result of **externalized systems** and a **hierarchical understanding of story facts** that you can implement immediately.

  Here is a breakdown of what that "intuition" is actually tracking, and the principled system you can build to replicate it without re-reading the whole manuscript.

  ### 1. What the "Intuition" Is Actually Tracking
  When a veteran writer changes a fact and doesn't panic, they aren't magically remembering every sentence they wrote. They are subconsciously categorizing the fact into one of three buckets. You can learn to do this consciously.

  *   **Load-Bearing Facts (The Foundation):** These are facts that cause other events. *Example: "Character A is dead."* If you change this, everything downstream breaks. These require a full audit.
  *   **Decorative Facts (The Texture):** These are details that describe the world but don't drive plot. *Example: "Character A wore a blue coat."* If you change this to a red coat, it touches nothing else.
  *   **Atmospheric Facts (The Vibe):** These are facts that establish tone or relationship dynamics but are flexible on logistics. *Example: "They had known each other for years."* Changing this to "months" changes the *weight* of the dialogue, but not necessarily the *logic* of the scene.

  **The Anxiety Trap:** You are currently treating every fact as Load-Bearing. Experienced writers know that 80% of details are Decorative. When they move the date of an affair discovery, they ask: *Does this change who was in the room? Does this change the pregnancy timeline? Does this change the alibi?* If the answer is no, the rest of the manuscript is safe.

  ### 2. The Principled System: How to Audit Without Re-reading
  You need to move the consistency tracking out of your head and onto the page (or screen). You cannot hold a three-timeline novel in your working memory.

  #### A. Build a "Canon Log" (Story Bible)
  If you haven't already, create a separate document that acts as the Source of Truth. It needs two specific sections:
  1.  **Master Timeline:** A linear chronology of *events*, not chapters. (e.g., *1998: Affair begins. 2001: Discovery. 2002: Divorce.*)
  2.  **Relationship Web:** A map of who knows what and when.

  **The Workflow:** When you want to make a change, **change it in the Canon Log first.**
  *   If the change creates a contradiction in the Log (e.g., Discovery happens before Affair begins), you have a Load-Bearing problem.
  *   If the Log accepts the change easily, you only need to check the manuscript for *references* to that specific fact, not the whole book.

  #### B. The "Search and Tag" Method
  Modern word processors are your friend. You do not need to re-read; you need to query.
  *   **Hard Facts:** If you change a date, search for specific years, seasons, or ages. (Search "2010", "thirty years old", "winter").
  *   **Soft Facts:** If you change a relationship dynamic (e.g., they are now strangers instead of friends), search for the character names appearing together. Skim *only* those scenes to see if the dialogue still lands.

  **Pro Tip:** Use comments or highlights to mark "Vulnerable Points." As you write, if you think, *"This relies on them having met in Chapter 3,"* highlight that sentence and tag it `[DEPENDENCY: Meeting]`. Later, if you change the meeting, search for that tag.

  #### C. Distinguish "Continuity" from "Consistency"
  *   **Continuity** is physical logic (e.g., a character can't be in London and New York in the same hour). This is binary. It is either broken or it isn't. Use your Timeline Log to check this.
  *   **Consistency** is emotional logic (e.g., would she really say this to him if they hadn't met yet?). This is subjective.
  *   **The Principle:** Fix Continuity with tools; fix Consistency with intuition. Don't use your intuition to check Continuity (that's what causes the anxiety).

  ### 3. The "Ripple Radius" Strategy
  When you make a change, define its **Ripple Radius**.
  *   **Local Ripple:** Affects only the current scene and the immediate next scene. (e.g., changing a line of dialogue).
  *   **Chapter Ripple:** Affects the pacing or information reveal of the current chapter. (e.g., moving a revelation from page 10 to page 50).
  *   **Global Ripple:** Affects the premise or timeline. (e.g., changing the year of the affair).

  **The Rule:** You only audit as far as the Ripple Radius.
  If you change the year of the affair (Global Ripple), you check the Timeline Log and search for date references. You do *not* need to re-read scenes where the characters are discussing their feelings about the affair, unless the *duration* of the affair changes the *nature* of the feeling. If the emotion remains the same, the text remains valid.

  ### 4. Why Experienced Writers Seem Careless
  There are three reasons veterans seem to make changes without anxiety:
  1.  **They accept "Fix it in Post":** They know they will do a dedicated "Continuity Pass" at the very end. They are willing to risk small errors now to keep the creative momentum going.
  2.  **They know the Spine:** They know the 10 key plot points that hold the book up. If a change doesn't touch one of those 10 points, they assume the rest is flexible.
  3.  **They have failed before:** They know that readers notice emotional inconsistencies far more than factual ones. A reader will forgive a wrong date; they won't forgive a character acting out of character. Veterans prioritize character truth over calendar truth.

  ### 5. Actionable Advice for Your Current Draft
  You are several years in. You cannot stop to build a perfect wiki, but you can mitigate the risk.

  1.  **Stop Re-reading.** It is a form of procrastination disguised as diligence. It yields diminishing returns.
  2.  **Create a "Change Log."** Keep a simple text file open. Every time you make a structural change, write it down. *("Changed discovery of affair from 2005 to 2003.")*
  3.  **Schedule a "Continuity Pass."** Tell yourself: *"I am not going to check this now. I will run a search for '2005' and '2003' during the final polish."* Give yourself permission to leave landmines in the draft as long as you have a plan to find them later.
  4.  **Trust the Reader.** Readers do not have your manuscript open in a spreadsheet. They are riding the emotional wave. If the emotional truth of the scene holds, they will not notice that the timeline shifted by six months.

  ### Summary
  The confidence you admire is not a mystical ability to hold the whole book in mind. It is the confidence that comes from knowing **which walls are load-bearing.**

  Start treating your manuscript like a database, not a painting. Externalize the facts into a Timeline Log. When you change a fact, check the Log, not the prose. If the Log holds, trust that the prose is mostly safe, and save the detailed search-and-verify for a dedicated pass later. You are building a world; you are allowed to use blueprints.
