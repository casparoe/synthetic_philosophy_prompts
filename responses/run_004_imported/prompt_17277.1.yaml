      *   *Is the user's anxiety normal?* Yes, especially with complex structures (3 timelines + large cast).
      *   *Is re-reading everything necessary?* No, it's inefficient.

  3.  **Brainstorm Solutions/Principles:**

      *   **Tooling/Externalization:** The brain isn't a database. You need a "Story Bible."
      *   **Causality Mapping:** Distinguish between *hard constraints* (logic/time) and *soft constraints* (emotion/theme).
      *   **Drafting Philosophy:** The "Discovery Draft" vs. "Revision Draft." Maybe the user is trying to revise like they're drafting.
      *   **The "Intuition" Factor:** What are pros actually doing? They know the *spine* of the story. They know which threads are load-bearing.
      *   **Workflow Adjustments:** Search functions, metadata, tagging.

  4.  **Develop the "Principled Approach":**

      *   *Principle 1: Dependency Mapping.* Not all details are equal. Some are foundational (load-bearing), some are decorative.
      *   *Principle 2: The Story Bible.* You cannot hold a complex novel in working memory. You need a external source of truth.
      *   *Principle 3: Search & Destroy.* Use technology (Ctrl+F) instead of human memory.
