answer: |-
  This is a fantastic question that cuts to the heart of the methodological divide between mid-20th-century logical empiricism and contemporary formal philosophy. Your professor's intuition is historically well-grounded: Tarski's project in *The Concept of Truth in Formalized Languages* (1933/1935) was driven by specific constraints that later theorists explicitly chose to relax.

  To reconstruct Tarski's likely response, we must anchor ourselves in his two fundamental criteria for a successful theory of truth: **Material Adequacy** (Convention T) and **Formal Correctness** (consistency).

  Here is a detailed reconstruction of how Tarski would likely evaluate Kripke's fixed-point theory and Priest's dialetheism.

  ---

  ### 1. Tarski's Baseline Commitments

  To understand Tarski's critique, we must recall what he was trying to do. He was not merely trying to "solve the Liar"; he was trying to **define** the predicate "true sentence" for a formalized language without generating contradiction.

  1.  **The Diagnosis:** Tarski argued that natural language is "semantically closed." It contains its own truth predicate, names for its own sentences, and the logical laws needed to derive the Liar paradox. He concluded that any language that is semantically closed and obeys classical logic is **inconsistent**.
  2.  **The Prescription:** To achieve *Formal Correctness*, we must distinguish the object language ($L$) from the metalanguage ($ML$). $ML$ must be "essentially richer" than $L$. Truth is not a monadic property of sentences simpliciter, but a relation between sentences and a specific language level ($True_L(x)$).
  3.  **The Logic:** Tarski presupposed classical logic (specifically the Law of Non-Contradiction and the Law of Excluded Middle) in the metalanguage. For Tarski, a theory that entails a contradiction is not a "theory" at all; it is a failure of rational reconstruction.

  With this framework, let's look at his successors.

  ---

  ### 2. Tarski on Kripke's Fixed-Point Theory (1975)

  Kripke's *Outline of a Theory of Truth* attempts to allow a language to contain its own truth predicate by moving from classical logic to a partial logic (typically Strong Kleene), where sentences can be true, false, or undefined (gaps).

  #### The Technical Appreciation
  Tarski was, first and foremost, a logician. He would likely acknowledge the mathematical rigor of Kripke's construction. The use of monotonic operators and fixed-point theorems is precisely the kind of set-theoretic machinery Tarski respected. He would admit that Kripke has successfully constructed a consistent model where a truth predicate applies to sentences within the same domain.

  #### The Philosophical Objections
  However, Tarski would likely argue that Kripke has not defined *truth* in the sense required by Convention T. His objections would center on three points:

  **A. The Failure of Full Convention T**
  Tarski's Material Adequacy condition requires that *all* instances of the T-schema ($T(\ulcorner \phi \urcorner) \leftrightarrow \phi$) be derivable. In Kripke's minimal fixed point, the Liar sentence ($L$) is neither true nor false. Consequently, the instance $T(\ulcorner L \urcorner) \leftrightarrow L$ does not hold (because neither side has a classical truth value).
  *   **Tarski's Verdict:** He would argue that Kripke has not defined truth, but rather a *partial* semantic notion. For Tarski, if a definition of truth cannot validate the T-schema for every sentence, it is not a definition of the concept *truth*; it is a definition of something else (perhaps "grounded truth"). He would view the gap not as a feature of truth, but as a sign that the Liar sentence is not a well-formed candidate for truth-evaluation in a rigorous language.

  **B. The Return of the Hierarchy**
  Kripke famously admits that while the object language contains its own truth predicate, the *semantics* of that language (the description of the fixed point) requires a metalanguage that transcends it. To say "The Liar is undefined" is to make a claim that cannot be made within the fixed point itself.
  *   **Tarski's Verdict:** Tarski would pounce on this. He would argue that Kripke has not eliminated the hierarchy; he has merely hidden it. The "ghost of the hierarchy" remains in the metalanguage required to describe the semantics. Tarski would maintain that his explicit hierarchy is more honest about the logical structure required to avoid paradox.

  **C. The Logic of the Metalanguage**
  Kripke's construction relies on a non-classical semantics (three-valued logic). Tarski's project presupposed classical logic in the metalanguage.
  *   **Tarski's Verdict:** Tarski might view the abandonment of bivalence in the metalanguage as a weakening of the logical framework necessary for science. If the metalanguage itself allows for gaps, the certainty of the semantic definition is compromised. He would likely argue that Kripke saves the phenomenon of natural language usage at the cost of logical precision.

  **Summary on Kripke:** Tarski would view Kripke's work as a significant *technical* advance in model theory, but a *philosophical* retreat. He would see it as a theory of how to manage *defective* sentences, not a successful definition of truth that satisfies Convention T universally.

  ---

  ### 3. Tarski on Priest's Dialetheism

  If Tarski would be skeptical of Kripke, he would likely be hostile to Graham Priest's dialetheism. Priest argues that the Liar sentence is both true and false (a "glut") and that we should adopt a paraconsistent logic (like LP) to prevent this contradiction from entailing everything (explosion).

  #### The Clash Over Non-Contradiction
  This is the fundamental break. Tarski's entire project in *The Concept of Truth* is predicated on the idea that a consistent definition of truth is possible *if and only if* we avoid semantic closure in a classical setting.
  *   **Tarski's View:** Inconsistency is a fatal flaw. If a language allows the derivation of $P \land \neg P$, it is useless for deductive science.
  *   **Priest's View:** Inconsistency is a localized feature of natural language that can be contained via paraconsistent logic.

  Tarski would likely find the very notion of a "true contradiction" unintelligible within his framework. For Tarski, logic is the tool we use to *detect* error. To build a logic that *tolerates* error (contradiction) would seem to him like building a measuring device that tolerates being wrong.

  #### The Diagnosis of Natural Language
  Recall Tarski's claim: natural language is inconsistent.
  *   **Priest:** "Yes, and we should accept that."
  *   **Tarski:** "Yes, and therefore we must *reform* it."

  Tarski was a scientific rationalist. He believed that for the purposes of science and rigorous philosophy, natural language must be replaced by formalized languages. Priest's project is descriptive (saving the intuitions of natural language speakers); Tarski's project was prescriptive (creating a language suitable for science).
  *   **Tarski's Verdict:** He would view dialetheism as a surrender. By accepting contradictions, Priest is abandoning the goal of rational reconstruction. Tarski would argue that Priest is not solving the paradox but merely domesticating it, thereby rendering the language unsuitable for the rigorous derivation of consequences required in mathematics and science.

  #### Convention T and Consistency
  Priest satisfies Convention T for the Liar sentence ($T(\ulcorner L \urcorner) \leftrightarrow L$ holds because both sides are true-and-false). However, he does so by sacrificing Formal Correctness (consistency) in the object language, saving it only via paraconsistent logic in the metalanguage.
  *   **Tarski's Verdict:** Tarski prioritized Formal Correctness over Material Adequacy when the two clashed. He explicitly chose to restrict the T-schema (via the hierarchy) to preserve consistency. He would view Priest's choice to preserve the T-schema at the cost of consistency as a category error. For Tarski, a "theory of truth" that allows contradictions is not a theory of truth; it is a proof that the system is defective.

  **Summary on Priest:** Tarski would likely view dialetheism as bordering on irrationalism. While he might respect the formal properties of paraconsistent logics as mathematical objects, he would reject their philosophical application to truth. He would argue Priest is "changing the subject" from *truth* to *some paraconsistent semantic value*, because for Tarski, truth *by definition* cannot be contradictory.

  ---

  ### 4. The "Changing the Subject" Charge

  Your professor suggested Tarski would find these projects "borderline unintelligible" or accused of changing the subject. Here is how Tarski would articulate that charge:

  **1. The Definition vs. The Model**
  Tarski was interested in the *definition* of a concept. Kripke and Priest are offering *semantic models* of a predicate. Tarski would argue that just because you can construct a model where a predicate $T$ behaves in a certain way (gaps or gluts) does not mean you have captured the pre-theoretic concept of *truth*.
  *   If $T$ allows gaps (Kripke), it violates the classical principle that every meaningful declarative sentence is true or false.
  *   If $T$ allows gluts (Priest), it violates the principle that no sentence is both.
  *   For Tarski, these principles are constitutive of the concept of truth. To violate them is to talk about something else.

  **2. The Role of the Metalanguage**
  Both Kripke and Priest rely on a metalanguage to make sense of their object languages.
  *   Kripke needs a classical (or at least distinct) metalanguage to define the fixed point.
  *   Priest needs a paraconsistent metalanguage to validate the gluts.
  Tarski would argue that this simply pushes the problem back. If the metalanguage is classical (as Kripke's ultimately must be to be understood), the hierarchy remains. If the metalanguage is paraconsistent (Priest), then the very logic used to verify the theory is one Tarski would deem unfit for scientific discourse.

  ### Conclusion: A Verdict of "Formal Success, Philosophical Failure"

  Tarski's likely response can be summarized as follows:

  1.  **To Kripke:** "You have constructed a fascinating mathematical model of a partial predicate. However, you have not defined truth, because your predicate does not satisfy Convention T for all sentences. You have shown how to handle *undefinedness*, not how to define *truth*. Furthermore, your reliance on a richer metalanguage confirms my thesis about the hierarchy."
  2.  **To Priest:** "You have shown that one can construct a formal system where contradictions do not explode. However, you have abandoned the fundamental law of non-contradiction. A language that admits true contradictions is not a language suitable for science. You have not solved the paradox; you have accepted the inconsistency I warned against, which is a failure of rational reconstruction, not a solution."

  Ultimately, Tarski would argue that Kripke and Priest are solving a different problem. Tarski's problem was: *How can we define truth for a scientific language without contradiction?* Kripke and Priest's problem is: *How can we model the semantics of natural language including its paradoxical sentences?*

  Tarski would conclude that while Kripke and Priest have advanced **formal semantics**, they have retreated from the **philosophical ideal** of a consistent, scientifically rigorous language. He would likely maintain that for the purposes of logic and science, his hierarchy remains the only method that preserves the consistency required for deduction, viewing the contemporary projects as valuable for linguistics or logic, but insufficient for the foundational definition of truth.
