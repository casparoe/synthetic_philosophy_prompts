answer: |-
  This is a sharp distinction your source made. You are correct that the "Baptists and Bootleggers" coalition (coining from economist Bruce Yandle) describes groups wanting the *same outcome* for different reasons. **Moral trade**, as formalized by Toby Ord in his 2014 paper *"Moral Trade,"* is distinct: it describes agents with *different* moral priorities exchanging effort or resources to maximize expected value across their differing axiologies.

  Ord's core argument is indeed based on comparative advantage: if I care 90% about Animals and 10% about Humans, and you care 10% about Animals and 90% about Humans, we both gain if I focus on Animals and you focus on Humans, even if we "swap" a portion of our advocacy to signal solidarity or unlock funding.

  However, applying this to real-world NGO negotiations (e.g., Animal Welfare vs. Global Health) reveals significant friction points. The economic analogy assumes fungible goods, rational actors, and perfect information. Moral advocacy has none of these.

  Here are the four critical tensions where the moral trade analogy strains or breaks, tailored for your piece on organizational negotiation.

  ### 1. The Transparency Paradox (Optics vs. Efficiency)
  In economics, trade is transparent and celebrated. In non-profit advocacy, "backroom deals" are scandalous.
  *   **The Break:** Moral trade requires a degree of opacity to function smoothly, but donor trust requires radical transparency. If an animal-welfare organization agrees to soften its rhetoric on factory farming in exchange for a global-health organization directing a shared grant toward a project with animal-welfare co-benefits, is that a "strategic compromise" or a "betrayal of mission"?
  *   **The Implication:** Donors often give based on *moral purity*, not just *outcome efficiency*. A donor giving to "End Suffering" might be outraged to learn their money was leveraged in a trade that implicitly validated a cause they view as morally secondary (or pernicious). Organizations engaging in moral trade risk being accused of cartel-like behavior—colluding to divide a donor pool rather than competing on merit.
  *   **Journalistic Angle:** Look for the "fiduciary duty to the mission." Does a board have a right to trade away moral stance for resource gain? If donors knew their contributions were being "traded" like commodities, would they withdraw?

  ### 2. The Verifiability Problem (Enforcement)
  In comparative advantage, trade is enforced by contracts and the exchange of tangible goods. In moral trade, the "currency" is often effort, credibility, or rhetorical concession.
  *   **The Break:** You cannot audit "moral effort." If the Global Health group agrees to "advocate more for animal welfare" as part of a bargain, how is that measured? Did they post enough tweets? Did they speak passionately enough at a conference?
  *   **The Implication:** This creates a **free-rider risk**. The larger organization (with more resources) might promise "visibility" for the smaller organization's cause as part of a trade, but deliver only performative support. Because "moral credence" isn't exchangeable like currency, the smaller party has little recourse if they feel the larger party didn't uphold their end of the moral bargain.
  *   **Journalistic Angle:** This exacerbates power imbalances. A large, established Effective Altruism fund might pressure a smaller niche charity into a "trade" where the smaller charity does the concrete work while the larger charity takes the credit for "coalition building."

  ### 3. The Corrosion of Conviction (Advocacy vs. Technocracy)
  Effective advocacy often requires a degree of "moral fanaticism." Movements are built by people who believe they are *right*, not by people who believe they are *trading*.
  *   **The Break:** Moral trade relies on **moral uncertainty** (i.e., "I'm not 100% sure my cause is the only one that matters"). However, branding relies on **moral certainty** (i.e., "This cause is urgent and paramount").
  *   **The Implication:** If organizations normalize moral trade, they risk turning their staff and volunteers into technocrats rather than advocates. If an animal rights activist knows their organization is willing to "trade away" strict vegan demands in exchange for global health funding, it creates internal cognitive dissonance. It dilutes the zeal required to drive hard political change. You cannot easily strike a comparative advantage deal if your base believes the opposing view is *evil* rather than just *less prioritized*.
  *   **Journalistic Angle:** Interview staff at these orgs. Does the leadership view these trades as "smart effective altruism" while the grassroots base views them as "selling out"? That internal friction is where the theory breaks.

  ### 4. The Zero-Sum Donor Pool (Collusion vs. Cooperation)
  Ord's model assumes trade creates value. But in the "Effective Giving" ecosystem, the donor pool is often fixed.
  *   **The Break:** If an Animal Welfare group and a Global Health group agree to split a grant rather than compete for it, they are essentially engaging in **market division**. While this saves on fundraising costs (efficiency), it reduces donor choice and potentially suppresses the "best" idea from winning the full pot.
  *   **The Implication:** Moral trade can inadvertently protect mediocre projects. If two groups agree to "trade" support to ensure both survive, they may prevent the donor market from naturally selecting the most impactful intervention. It shifts the metric from "Which cause saves the most lives?" to "How can we structure a deal where both our orgs get funding?"
  *   **Journalistic Angle:** This touches on the "Non-Profit Industrial Complex." Does moral trade become a way for organizations to ensure their own institutional survival rather than maximizing the good? It transforms moral disagreement into a budgetary line item.

  ### Summary for your Draft
  If you need a concluding thought for the piece: **Moral trade works best in theory when agents are rational and transparent, but it works best in practice when it remains invisible.**

  The moment you admit you are trading moral convictions for resources, you undermine the very moral authority you need to raise those resources. The most successful moral trades are likely those that are never explicitly called "trades," but are instead framed as "intersectionality" or "solidarity." The friction lies in the gap between the *mechanism* (a cold calculation of comparative advantage) and the *messaging* (a passionate plea for moral truth).

  **Key Source Check:** Toby Ord, *"Moral Trade,"* 2014 (available on his website or via arXiv). He specifically distinguishes it from compromise (where both move to the middle) and notes it requires some degree of moral uncertainty or differing weightings of values.
