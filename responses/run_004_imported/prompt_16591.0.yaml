      *   **Core Tension 3: The Advocacy Dilution Risk (Conviction).** Passion drives change; trade creates technocrats.
      *   **Core Tension 4: Power Dynamics (Inequality).** Comparative advantage assumes free markets; non-profits operate in power hierarchies.
      *   **Core Tension 5: Moral Uncertainty vs. Brand Identity.** Trade requires admitting you might be wrong; brands require certainty.
