answer: |-
  **Setting:** *A seminar room, late afternoon. The whiteboard is covered in the remnants of earlier proofs. In the center, a fresh diagram dominates: a convex, asymmetric bargaining set $S$ in the first quadrant, with a disagreement point $d$ marked near the origin. Two distinct points are highlighted on the Pareto frontier: $N$ (the Nash solution) and $K$ (the Kalai-Smorodinsky/Gauthier point).*

  **Characters:**
  *   **CLAIRE:** A contractarian sympathetic to Gauthier's *Morals by Agreement*.
  *   **BEN:** A formal bargaining theorist and defender of the Nash program.

  ***

  **CLAIRE:** (Tapping the marker against point $K$) Look at the geometry, Ben. It's transparent. We draw a line from the disagreement point $d$ through the utopia point—where each of us gets our maximum possible payoff—and see where it hits the frontier. That's Minimax Relative Concession. We each give up the same *proportion* of what we could have hoped for. It feels like a handshake.

  **BEN:** (Leaning against the desk, arms crossed) It feels like a handshake until you realize the hand you're shaking is moving. You're defending Kalai-Smorodinsky, Claire, which means you've signed off on dropping Independence of Irrelevant Alternatives (IIA). That's not a small technicality. That's the lock on the door.

  **CLAIRE:** It's a lock that keeps out the right intuition. Nash satisfies IIA, sure. But to do it, he has to ignore the shape of the feasible set anywhere other than the immediate neighborhood of the solution. He treats the bargaining problem like a local tangent plane. But justice isn't local. It depends on the full range of possibilities available to us.

  **BEN:** Let's make that concrete. Look at your diagram. At point $N$, the Nash solution, we maximize the product of our gains. The hyperbola is tangent to the frontier. Now, imagine I add a new option to the set. A "phantom" option. Way out here, beyond the frontier. (He draws a dot far above the current feasible set, outside the curve). We know we can't reach it. It's technologically infeasible, or dominated by other options. It's irrelevant.

  **CLAIRE:** If it's outside the feasible set, it's not an option.

  **BEN:** Precisely. But suppose we expand the set slightly to include it, just technically, without changing the Pareto frontier where it matters. Under Nash, the solution stays at $N$. Under your solution $K$, the utopia point shifts because my maximum possible payoff has technically increased. The line from $d$ pivots. The solution slides along the frontier. You get more, I get less. Why should the division of actual cooperative surplus change because I added an option *neither of us would ever choose*?

  **CLAIRE:** Because it's not irrelevant to our *claims*. If your ceiling rises, your potential contribution to the joint venture—and your potential loss if we fail—changes. Gauthier's point is that fairness is about concession. If your ideal payoff goes up, the denominator in your relative concession increases. To keep our concessions equalized, the split has to adjust. Ignoring that is ignoring the change in our bargaining positions.

  **BEN:** But that makes the solution manipulable. If I know you're using Kalai-Smorodinsky, I have an incentive to pad the agenda. I can introduce "dummy" alternatives—outcomes I know are impossible, or that I know you'll veto—just to shift the utopia point and slide the solution in my favor. IIA prevents that. It says: if the new option isn't chosen, it shouldn't affect the choice. It ensures the solution depends only on the options that are actually live contenders.

  **CLAIRE:** That assumes the only thing that matters is the final choice. But in a contractarian framework, we're agreeing on principles *ex ante*. We need to know that if the world opens up for me—if my productivity increases, or my best-case scenario improves—I won't be penalized for it. That's Individual Monotonicity. If the set expands in my favor, and your maximum stays the same, I should not end up worse off. Nash violates this.

  **BEN:** Show me.

  **CLAIRE:** (She erases the upper portion of the Pareto frontier and redraws it higher, expanding the set only in her direction. The disagreement point and Ben's maximum payoff remain fixed.) Okay. I've improved my best-case scenario. My utopia point moves up. The line from $d$ to the new utopia is steeper. The new $K$ point gives me more utility. That's monotonic. Now look at Nash.

  **BEN:** (Squinting at the board) The curvature of the frontier has changed. The hyperbola tangent... yes. Depending on how you bowed that frontier, the Nash point could slide *toward* me.

  **CLAIRE:** Exactly. In some configurations, even though I've gained potential and you haven't, the Nash solution awards *you* a larger share of the surplus. Because the curvature changed. My improved prospects actually hurt me in the final division. How is that rational? How is that just? If I bring more to the table, why does the math take food off my plate?

  **BEN:** Because "bringing more to the table" isn't just about the maximum. It's about the marginal rate of substitution. Nash captures the idea that we split the gains based on how much we value the margin. If your expansion makes the frontier flatter near the solution, it means you're willing to trade off less of your utility to gain mine. You're less desperate at the margin. Nash rewards that stability.

  **CLAIRE:** That's a defense of efficiency, not fairness. You're describing a market clearing price, not a moral agreement. Gauthier is trying to derive morality from rationality. If I agree to a bargain, I need to know that my benefit from cooperation is secure. If dropping IIA means I'm vulnerable to your phantom options, fine. But keeping IIA means I'm vulnerable to the geometry of the frontier punishing me for my own success. Which vulnerability is worse?

  **BEN:** The vulnerability to manipulation is fatal to agreement. If we can't agree on the feasible set without fighting over dummy options, we never get to the bargain. IIA guarantees that we only need to agree on the *relevant* options. It reduces the informational burden. I don't need to know your absolute maximum; I just need to know the local trade-offs. Your solution requires us to agree on a "utopia point" that might be虚构 (fictional).

  **CLAIRE:** It's not fictional. It's the limit of what's possible. And we *should* have to agree on it. That's the point of the contract! We aren't just splitting a pie; we're defining the scope of our cooperation. If you want to hide the scope to lock in the split, you're treating the bargain as a trap, not a foundation.

  **BEN:** And if you let the split jump around because I added a useless option, you're treating the bargain as a roulette wheel. Look, let's go back to the "irrelevant" alternative. You say it changes my claim. But if the option is truly dominated—say, I can get 10 utils, but there's an option where I get 11 but you get -50, so we'd never pick it—why does that 11 matter? We're never going there.

  **CLAIRE:** Because the 11 defines the upper bound of your capacity. Relative concession asks: "How much of your *possible* gain are you giving up?" If your possible gain is 11, giving up 5 is different than if your possible gain is 100. Nash ignores the denominator. It just looks at the product of the gains. It treats a concession of 5 utils as identical regardless of whether the maximum was 6 or 600. That's not fairness; that's utilitarianism in disguise.

  **BEN:** It's not utilitarianism; it's invariance. Nash is invariant to affine transformations. Your solution is too, sure. But Nash is also invariant to the *expansion* of the set away from the solution. That's what makes it stable. You're asking me to accept a solution concept where I have to scrutinize every corner of the feasible set to ensure you haven't hidden a high-payoff option that shifts the utopia point. That's transactionally expensive.

  **CLAIRE:** And I'm asking you to accept a solution where I might work harder, increase my maximum potential, and get punished with a smaller share. That's morally expensive. You keep saying IIA prevents manipulation. But what prevents the manipulation of the frontier's curvature? If I know Nash is the rule, I can structure my production technology to make the frontier bulge near the solution point. I can game the curvature.

  **BEN:** (Pauses) You can game any rule. The question is which rule makes the game easier to police. IIA is easy to police. Did the chosen option exist in the smaller set? Yes? Then the solution shouldn't change. Done. Your monotonicity condition requires counterfactuals. "If the set *had* been bigger..." We're litigating possibilities, not actualities.

  **CLAIRE:** We're litigating justice, Ben. Not policing. If the choice between Nash and Kalai-Smorodinsky is a choice between consistency across menus and sensitivity to opportunity... (She steps back from the board, looking at the two points $N$ and $K$ again). Gauthier thinks rational agents would choose the principle that minimizes the maximum concession. They want to ensure that no one is asked to sacrifice too much of their *potential*. Nash asks us to sacrifice based on leverage.

  **BEN:** And Gauthier assumes that "potential" is well-defined and non-manipulable. But if IIA goes, the solution path becomes path-dependent. I can get you to $K$ by adding option A, or to $K'$ by adding option B, even if neither A nor B is chosen. How do we know which $K$ is the "fair" one? The axiom that drops out is the one that anchors the uniqueness. Without IIA, you need something else to stop the sliding.

  **CLAIRE:** The anchor is the disagreement point and the utopia point. The line is straight. It's the simplest connection between where we are and where we could be. Nash draws a curve. Why is the hyperbola more "natural" than the ray?

  **BEN:** Because the hyperbola comes from independent risk of breakdown. It derives from a strategic model. Your line comes from... a geometric intuition about ratios.

  **CLAIRE:** It comes from the idea that we are equal moral agents facing a surplus. We should sacrifice equally in proportion to what we have to lose.

  **BEN:** (Picks up his bag) And I say we should split based on what we can actually enforce, regardless of what dreams we had to give up to get there.

  **CLAIRE:** (Cap on the marker) Then I suppose the students will have to decide whether they want a bargain based on what we can enforce, or one based on what we had to give up.

  **BEN:** Just make sure they draw the diagram carefully. If they get the curvature wrong, even Nash won't save them.

  *(Ben exits. Claire remains at the board, looking at the gap between point $N$ and point $K$.)*
