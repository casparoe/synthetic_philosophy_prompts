      *   **Partner:** Also on the academic job market (field unspecified, but likely similar pressures).
      *   **The Problem:** Both are setting rigid constraints *ex-ante* (before offers exist) to avoid being the "flexible one." They suspect this is a strategic move (pre-commitment) to gain leverage, but fear it will lead to suboptimal outcomes (losing potential utility) and resentment (who "lost").
      *   **The Core Question:** Is there a general problem here? Is there a smarter way to handle it?

  2.  **Identify the Underlying Game-Theoretic/Behavioral Economics Concepts:**
      *   **Pre-commitment/Schelling Point:** Setting rigid rules to force the other player's hand.
      *   **Game of Chicken:** Both driving towards a cliff; whoever swerves first "loses." If neither swerves, both crash (no job, relationship strain).
      *   **Coordination Game:** They need to coordinate on *one* outcome (City A + Job A, or City B + Job B), but have conflicting preferences over *which* outcome.
      *   **Loss Aversion/Endowment Effect:** Once a stance is staked, giving it up feels like a loss, even if the net utility is positive.
      *   **Information Asymmetry/Uncertainty:** They are making decisions without knowing the feasible set (the actual offers).
      *   **Nash Equilibrium:** The current strategy (both rigid) risks a Pareto-inferior outcome.

  3.  **Address the "General Problem" Question:**
      *   Yes, this is a classic **Coordination Problem with Distributional Conflict**.
      *   Specifically, it resembles the **Battle of the Sexes** (prefer to be together, but disagree on where) mixed with a **Game of Chicken** (who blinks first on constraints).
      *   It also touches on **Strategic Irrationality** (Schelling's concept): Sometimes appearing irrational (rigid) gives you bargaining power, but if *both* do it, it's disastrous.

  4.  **Develop a "Smarter Way" (The Solution Framework):**
      *   *Goal:* Move from a competitive bargaining frame to a cooperative optimization frame.
      *   *Step 1: Acknowledge the Game.* Name it. As economists, they will appreciate identifying the incentive structure.
      *   *Step 2: Change the Timing.* Don't set constraints *ex-ante*. Wait for the "Feasible Set" to be revealed.
