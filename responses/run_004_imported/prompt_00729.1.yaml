answer: |-
  This is one of the sharpest questions you can ask about the landscape of modern decision theory. You have correctly identified the mechanical distinction (updating vs. not updating on observations) and the empirical divergence (Counterfactual Mugging).

  The confusion arises because the slogan ("fix the output of the abstract algorithm") is necessary but not sufficient. It doesn't specify *when* you evaluate the success of that fixing.

  Here is an unpacking of why the divergence happens specifically in Counterfactual Mugging, followed by an assessment of whether UDT's "updateless" commitment is a feature or a bug.

  ---

  ### Part 1: Why Counterfactual Mugging Splits Them

  To understand the split, we have to look at **where the utility is located** relative to the observation.

  #### 1. The Mechanism: Action vs. Policy
  *   **TDT (Updateful):** You observe $O$. You then ask: "Given $O$, which *action* $A$ maximizes expected utility?" You treat $O$ as a fixed fact of the world.
  *   **UDT (Updateless):** You do not observe $O$ yet (conceptually). You ask: "Which *policy* $\pi$ (a mapping from all possible observations to actions) maximizes expected utility?" You then execute $\pi(O)$.

  #### 2. Newcomb and Hitchhiker: The Utility is *Here*
  In **Newcomb's Problem**, you observe the boxes in front of you. The \$1,000,000 is either in Box B or it isn't.
  *   **TDT:** "I observe the boxes. Omega's prediction is logically linked to my algorithm. If my algorithm outputs '1-Box', Omega predicted '1-Box', and the money is here. If '2-Box', the money is gone." The utility is in the *actual* world you are observing. The observation doesn't screen off the correlation between your algorithm and the money.
  *   **UDT:** Agrees. The policy "If see boxes, 1-Box" wins.

  In **Parfit's Hitchhiker**, you observe that you are in town (alive).
  *   **TDT:** "I observe I am alive. This implies the driver predicted I would pay. My current decision is logically linked to that past prediction. If I decide 'Don't Pay', then logically the driver predicted 'Don't Pay', and I would be dead. Since I am alive, I must Pay."
  *   **Why TDT works here:** Even though you update on "I am alive," your decision *now* still logically controls the prediction *then*. The utility (being alive) is a property of the world you are currently in.

  #### 3. Counterfactual Mugging: The Utility is *There*
  In **Counterfactual Mugging**, Omega flips a coin.
  *   **Heads:** Omega asks you for \$100. (You observe Heads).
  *   **Tails:** Omega gives you \$10,000 *if* it predicted you would give \$100 on Heads. (You do not observe Tails).

  **The Divergence:**
  *   **TDT:** You observe **Heads**. You condition your expected utility calculation on this fact.
      *   $E[U | \text{Heads}, \text{Pay}] = -\$100$.
      *   $E[U | \text{Heads}, \text{Don't Pay}] = \$0$.
      *   **Verdict:** Don't Pay.
      *   **Why:** From TDT's perspective, once you know the coin is Heads, the Tails branch is counterfactually impossible. The \$10,000 reward exists *only* in the Tails branch. Since you have updated on "Heads is True," the Tails branch has probability 0. You cannot influence a world you know does not exist. The observation **screens off** the benefit.

  *   **UDT:** You do not condition on Heads. You evaluate the policy from the prior (50% Heads, 50% Tails).
      *   Policy: "If Heads, Pay."
      *   $E[U] = 0.5 \times (-\$100) + 0.5 \times (\$10,000) > 0$.
      *   **Verdict:** Pay.
      *   **Why:** UDT treats the observation "Heads" merely as an input to the policy function, not as evidence that eliminates the Tails branch from the expectation calculation. You are optimizing the *algorithm* that runs in both branches, not the *action* taken in this branch.

  **Summary:** TDT fails Counterfactual Mugging because it treats observations as **evidence that eliminates worlds**. UDT succeeds because it treats observations as **inputs that select which part of a policy to execute**, while still evaluating the policy's performance across all possible worlds.

  ---

  ### Part 2: Assessment — Generalization or Questionable Commitment?

  Is UDT simply a more consistent version of TDT, or does it smuggle in a costly assumption? The answer is: **It is a more consistent idealization, but it pays for that consistency with significant conceptual and technical debt.**

  #### 1. The Case for UDT as "More Consistent" (Dynamic Consistency)
  The strongest argument for UDT is **dynamic consistency**.
  *   A TDT agent, *before* the coin flip in Counterfactual Mugging, would wish to pre-commit to paying. They know the policy "Pay if Heads" has positive EV.
  *   However, once the coin flips and they see Heads, TDT abandons that plan.
  *   This makes TDT agents vulnerable to **time inconsistency**. They will pay for pre-commitment devices to bind their future selves, which is a cost UDT agents don't incur.
  *   If you view rationality as "winning" (getting the highest utility), UDT wins in a broader class of games (including acausal trade and bargaining with predictors) because it doesn't throw away value just because it received specific information.

  In this sense, UDT is the natural completion of TDT's core insight. If you truly believe you are an abstract algorithm, you should optimize the algorithm's output across all inputs, not just the current one.

  #### 2. The Cost: The "Prior" Problem and Embeddedness
  However, the "updateless" requirement smuggles in a commitment that is philosophically and technically contentious: **The Cartesian Prior.**

  **A. Where is the "Start"?**
  UDT requires you to reason from a point "before" you have made observations. But for an embedded agent (like a human or a software process running on a server), there is no clean "before."
  *   You already have sensory data.
  *   You already have memory.
  *   To run UDT, you must hypothetically "forget" your observations to calculate the prior, then "remember" them to execute the action.
  *   **The Cost:** Defining the correct prior is unsolved. If you choose the wrong "start point" for your updatelessness (e.g., too early, where logical uncertainty is too high, or too late, where you've already updated), you get different verdicts. This is known as the **Prior Problem** in UDT.

  **B. Acting Against Current Knowledge**
  UDT requires you to act in a way that is suboptimal *given your current knowledge*, for the sake of a counterfactual self you *know* does not exist.
  *   In Counterfactual Mugging, you know the coin is Heads. You know the Tails world is empty.
  *   UDT says: "Give up \$100 to help a version of you in a world you know is false."
  *   **The Cost:** This violates standard Bayesian coherence, which says you should always maximize expected utility conditional on your current information. UDT effectively argues that "current information" is a trap that prevents acausal cooperation. While powerful, this feels like "wireheading" the decision theory to force a specific outcome. It demands a level of **logical control** over reality that many find metaphysically suspicious.

  **C. Logical Uncertainty**
  UDT relies heavily on having a prior over logical facts (e.g., the output of Omega's simulation). We do not yet have a rigorous theory of logical uncertainty (how to assign probabilities to mathematical statements you haven't computed yet). TDT sidesteps this somewhat by updating on observations first, which often resolves the logical uncertainty. UDT dives headfirst into it.

  ### Verdict

  **UDT is theoretically superior but practically harder to ground.**

  *   **Theoretically:** UDT is the more general framework. TDT can be viewed as an approximation of UDT that works well when observations don't screen off the relevant logical correlations (like in Newcomb's Problem). If you want a decision theory that is reflectively consistent (you never wish you had a different decision theory) and handles acausal trade, UDT is currently the only candidate.
  *   **Philosophically:** The commitment to reasoning "before observations" is indeed questionable. It assumes a "God's eye view" of the agent's existence that embedded agents don't actually have. It solves the problem of dynamic inconsistency by essentially denying the epistemic significance of the present moment.

  **Recommendation for your studies:**
  Treat TDT as the intuition pump and UDT as the formal goal. TDT explains *why* we want to treat decisions as logical outputs. UDT explains *how* to do it consistently without falling into time-inconsistency traps. However, remain skeptical of UDT's reliance on a well-defined "prior." In modern alignment research (e.g., work by Scott Garrabrant or the MIRI team), the focus has shifted somewhat toward **Functional Decision Theory (FDT)**, which attempts to capture the UDT/TDT insights while being more explicit about the substrate of computation, though it still inherits the "updateless" baggage.

  If you are engineering agents, TDT is often "good enough" for single-shot problems like Newcomb. But if you are designing agents that need to negotiate with copies of themselves or predictors without binding pre-commitment contracts, you need the updateless machinery, warts and all.
