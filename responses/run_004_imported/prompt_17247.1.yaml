prompt: |-
  My younger sister is finishing a doctorate on G. E. Moore's Principia Ethica, and in a few weeks she is marrying her partner of nine years, a violinist named Thom. She has asked me — the family novelist, hopeless with footnotes — to give the toast, which frightens me more than any deadline ever has. About half the room will be her philosophy department: her supervisor, both examiners, and a small contingent of committed Moore devotees who, she warns me, still treat the closing chapter of Principia Ethica with something close to the reverence the old Bloomsbury set once gave it. The other half is our large, entirely non-philosophical family, who will want to laugh a little and cry a little and have never once heard the phrase "organic unity" and shouldn't have to. My sister has made it very clear, half as a joke and half not, that she will never forgive me if I flatten Moore's actual position into a greeting-card line about friendship and beauty being the good things in life. She wants the real machinery in there somewhere: the claim that a whole can be worth more than the sum of the value of its parts, say, or that strange thought experiment of his about two entirely unwitnessed worlds, one as beautiful and the other as hideous as can be imagined.

  Could you write me a five-minute toast that takes Moore's actual, specific argument seriously enough to survive her supervisor's scrutiny, puts at least one real piece of that philosophical machinery to work in saying something true about this particular marriage rather than about marriages in general, and still lands, for my great-aunts and cousins, as a toast rather than a lecture? I would rather it under-explain the philosophy and over-deliver on affection than the other way around, but I don't want it to be wrong about Moore, either.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** A novelist (family storyteller), uncomfortable with academic rigor/footnotes.
      *   **Occasion:** Wedding toast for younger sister (PhD candidate in Philosophy) and her partner Thom (violinist, 9 years together).
      *   **Audience:** 50% Philosophy Department (Supervisor, Examiners, Moore devotees), 50% Non-philosophical Family (Great-aunts, cousins, want emotion/humor).
      *   **Subject:** G. E. Moore's *Principia Ethica*.
      *   **Constraints:**
          *   Must not flatten Moore's position into clichés (e.g., just "friendship and beauty are good").
          *   Must include specific philosophical machinery (e.g., "organic unity," the "two worlds" thought experiment).
          *   Must apply the philosophy to *this* marriage, not marriage in general.
          *   Must feel like a toast (warm, affectionate, funny), not a lecture.
          *   Preference: Under-explain philosophy, over-deliver affection, but remain accurate.
          *   Length: ~5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct G. E. Moore's *Principia Ethica* (Relevant Parts):**
      *   *The Naturalistic Fallacy:* You can't define "good." It's a simple, non-natural property. (Probably too technical/dry for a toast).
      *   *Ideal Utilitarianism:* The good consists of certain states of consciousness, primarily the pleasures of human intercourse and the enjoyment of beautiful objects. (This is the "greeting card" trap the sister warned against).
      *   *Organic Unities:* The value of a whole is not necessarily equal to the sum of the values of its parts. A whole can be more valuable than the sum of its parts, or even have a different sign (positive/negative). This is crucial.
      *   *The Two Worlds Thought Experiment:* Imagine one world beautiful, one hideous. Neither is witnessed by humans. Is the beautiful one better? Moore says yes. Value exists independently of utility.

  3.  **Brainstorming Connections:**
      *   *Organic Unity:* Perfect for marriage. Two individuals (parts) + Relationship (whole). The relationship has value *beyond* just adding their individual happiness together.
      *   *The Two Worlds:* Thom is a musician (beauty). The sister studies ethics (value). Their life together creates a "world." Even when no one is watching (private moments), it has intrinsic value.
      *   *The "Good":* Moore says "good" is indefinable. Love is similar. You can't define it, you just know it when you see it (intuitionism).
      *   *Tone:* Needs to bridge the gap. Acknowledge the academics without alienating the family. Use the novelist persona to frame the philosophy as narrative.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the daunting task. The split audience. The novelist vs. philosopher dynamic. Humor about footnotes.
      *   **The Philosophy (The "Meat"):** Introduce Moore gently. Avoid the "friendship is good" cliché. Focus on *Organic Unity*.
      *   **Application to the Couple:** How does Organic Unity apply to Sister + Thom? It's not just 1 + 1 = 2. It's about the *whole* they create.
      *   **The Two Worlds:** Connect to Thom's music. Beauty exists even if no one hears it? Or rather, their private world has value.
      *   **The "Good":** Moore's idea that "good" is simple and intuition-based. Relate this to knowing love.
      *   **Closing:** Raise a glass. Warm wish for the future.

  5.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Keep the jargon minimal. Explain "organic unity" through metaphor (music/chord) rather than definition.
      *   *Critique:* Is it accurate to Moore?
      *   *Fix:* Ensure I don't say Moore defined "good." Emphasize the *whole vs. parts* distinction. Make sure the "Two Worlds" reference is clear but brief.
      *   *Critique:* Is it personal?
      *   *Fix:* Mention Thom's violin. Mention the nine years. Mention the sister's specific warning about the closing chapter.
      *   *Tone Check:* Needs to sound like a sibling. Warm, slightly teasing, proud.

  6.  **Drafting the Content (Iterative Process):**
      *   *Start:* "For those who don't know me..."
      *   *Moore bit:* "My sister warned me..." Mention the "naturalistic fallacy" of reducing love to a cliché.
      *   *Organic Unity:* Use the musical metaphor for Thom. A chord is more than notes.
      *   *Two Worlds:* The unseen moments of their marriage.
      *   *Conclusion:* The "good" is indefinable but present.

  7.  **Final Review against Constraints:**
      *   5 minutes? (Word count looks right).
      *   Moore accurate? (Organic unity and Two Worlds included correctly).
      *   Family friendly? (Yes, metaphors help).
      *   Affectionate? (Yes, focuses on their bond).

  8.  **Final Polish:** Check rhythm and cadence for speaking. (e.g., "Raise your glasses," pauses for laughter). *Self-correction: Make sure not to sound like I'm teaching the room, but rather using the tools to praise them.*

  **(Post-Drafting Thought):** I need to make sure I don't accidentally commit the Naturalistic Fallacy myself by defining "good" as "happiness." Moore says good is *sui generis*. I will frame it as something we recognize intuitively.

  Let's write it.cw
answer: |-
  Good evening. For those of you who don't know me, I'm the family novelist. Which is a polite way of saying I'm the one who gets paid to make things up, while my sister gets paid to find out what's actually true.

  Standing here, I feel a bit like an imposter. About half of you are philosophers who could dismantle my syntax for fun. The other half are my great-aunts, who just want to know if there's cake. My sister has made it clear that if I reduce her nine years of research to a greeting card slogan about "love being the greatest good," she will disown me before the honeymoon. She wants the real machinery. She wants G. E. Moore.

  So, I am going to attempt something dangerous. I am going to talk about *Principia Ethica* without using a single footnote.

  Moore argues that "good" is a simple, indefinable property. You can't break it down. You just know it when you see it. And honestly, looking at the two of them tonight, that seems accurate. You can't define what they have. You just recognize it.

  But the specific piece of Moore I want to borrow is his principle of "Organic Unities." Moore says that the value of a whole is not necessarily equal to the sum of the values of its parts. Sometimes, a whole is worth *more* than the parts added together.

  Thom, you are a violinist. You know that a chord is not just three notes played at once. It is a new sonic entity. It has a resonance that the isolated notes do not possess.

  For nine years, my sister and Thom have been building an Organic Unity. If you look at them as parts—brilliant PhD candidate, dedicated musician, kind individuals—they are valuable on their own. We love them as parts. But Moore teaches us that the relationship itself creates a new value that didn't exist before. The marriage is not just Sister plus Thom. It is a third thing. A whole that possesses a value greater than the sum of its constituents.

  Moore also offers a thought experiment about two worlds. Imagine one world as beautiful as can be imagined, and another as hideous as possible. But imagine no human being ever sees them. Does the beautiful world still have more value? Moore says yes. Beauty and goodness have intrinsic value, even when unwitnessed.

  This is what I wish for you in the quiet moments. It is easy to be in love when the room is full, when the examiners are impressed, when the audience is applauding. But Moore's invisible beautiful world reminds us that the value of your life together does not depend on an audience. It exists in the unwitnessed mornings, the private conversations, the silence between the notes when no one is listening. That private world has intrinsic worth.

  My sister warned me not to flatten Moore into a cliché. So I won't say that love is the only good thing. But I will say that in a universe where "good" is indefinable, you two have managed to manifest it clearly enough for the rest of us to see.

  You have built an Organic Unity that is more valuable than the sum of your parts. You have created a world that is beautiful, even when no one is watching. And for that, our family—philosophers and great-aunts alike—is incredibly grateful.

  Please raise your glasses. To the whole that is greater than the sum of its parts. To Sister and Thom.
