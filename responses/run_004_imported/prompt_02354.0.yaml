answer: |-
  This is an excellent question, and it is commendable that you are looking for the economic intuition behind the formalism rather than just the algebraic verification. Your student has put their finger on a crucial distinction between the *geometry* of payoff spaces and the *epistemic* foundations of rationality.

  Here is a breakdown of both issues, structured to help you translate the PhD-level understanding into an intermediate undergraduate narrative.

  ---

  ### Part 1: Why Mixed Strategies Enlarge the Set of Dominated Strategies

  The algebraic proof shows that the convex combination of two payoff vectors can lie strictly above a third vector, even if neither original vector does. But for an undergraduate, the "Convex Hull" argument can feel abstract. Here are two intuitive angles: the **"Specialist vs. Generalist"** story and the **"Never a Best Response"** justification.

  #### 1. The Intuition: Hedging Against Opponent Uncertainty
  Ask your students to think of pure strategies as **specialists** and mixed strategies as **diversified portfolios**.

  Imagine a Row player facing a Column player who can play Left or Right.
  *   **Strategy A** is a specialist against Left (high payoff vs. L, low vs. R).
  *   **Strategy B** is a specialist against Right (low payoff vs. L, high vs. R).
  *   **Strategy C** is a "mediocre generalist" (moderate payoff vs. L, moderate payoff vs. R).

  Neither A nor B dominates C. If Column plays Left, A beats C but B loses to C. If Column plays Right, B beats C but A loses to C.

  However, if Row plays a 50/50 mix of A and B, they effectively **hedge**. Against Left, they get the average of A's high and B's low. Against Right, they get the average of A's low and B's high. If the "specialist" advantages are sharp enough, this average will be consistently higher than C's mediocre payoff in *both* cases.

  **The Story:** Strategy C is "jack of all trades, master of none." Strategies A and B are "masters of one." By randomizing between the masters, you create a "super-generalist" that outperforms the actual generalist in every contingency. If you are rational, you would never play C, because you could instead flip a coin between A and B and guarantee a higher payoff regardless of what the opponent does.

  #### 2. The Deeper Justification: Pearce's Lemma
  For your own handle (and perhaps for advanced undergrads), the most compelling reason to allow mixed dominators is **Pearce's Lemma (1984)**.

  The lemma establishes an equivalence: **A pure strategy is strictly dominated by some mixed strategy if and only if it is never a best response to any belief about the opponent's play.**

  *   **If we restrict domination to pure strategies only:** We might retain a strategy that is *never* a best response to any probabilistic belief.
  *   **If we allow mixed domination:** We eliminate exactly those strategies that a rational player would never choose, regardless of their beliefs.

  **Pedagogical Hook:** "Rationality means playing a best response to what you believe. If a strategy is *never* a best response to *any* belief, a rational player simply cannot play it. It turns out that 'never a best response' is mathematically equivalent to 'strictly dominated by a mixed strategy.' If we don't allow mixed dominators, our elimination procedure fails to capture the full implication of rationality."

  ---

  ### Part 2: Order Independence (Strict vs. Weak)

  This is a subtle but vital distinction. The order-independence of IESDS (Iterated Elimination of Strictly Dominated Strategies) is a robustness property; the order-dependence of IEWDS (Iterated Elimination of Weakly Dominated Strategies) is a conceptual bug.

  #### 1. Why Strict Dominance is Order-Independent
  The core feature of strict dominance is the **robustness of the inequality**.

  If strategy $s_i$ is strictly dominated by $s_i^*$, then:
  $$u_i(s_i^*, s_{-i}) > u_i(s_i, s_{-i}) \quad \text{for ALL } s_{-i} \in S_{-i}$$

  Notice the quantifier: **ALL**.
  When we eliminate a strategy for the *opponent*, we are removing elements from the set $S_{-i}$. We are moving from the set "All strategies" to a subset "Remaining strategies."
  *   If $X > Y$ is true for every element in a set, it remains true for every element in any subset.
  *   Removing a column from the matrix does not change the fact that Row's payoff from Up is strictly higher than Down in the *remaining* columns.

  **Intuitive Story:** Strict dominance is like being fired for cause. If an employee is strictly worse than a replacement in *every possible task*, it doesn't matter which specific tasks remain on the docket. They are still worse in all of them. The justification for elimination survives the reduction of the game.

  #### 2. Why Weak Dominance Loses Order-Independence
  Weak dominance relies on a **contingent strict inequality**.
  $$u_i(s_i^*, s_{-i}) \ge u_i(s_i, s_{-i}) \quad \text{for ALL } s_{-i}$$
  $$\text{and } > \text{ for AT LEAST ONE } s_{-i}$$

  That "at least one" is the vulnerability.
  *   Strategy $A$ weakly dominates $B$ because $A$ is equal to $B$ in most cases, but strictly better in *one specific scenario* (say, when Opponent plays $Z$).
  *   If we eliminate $Z$ *first* (perhaps because $Z$ was dominated for the opponent), the scenario where $A$ beat $B$ disappears.
  *   In the reduced game, $A$ and $B$ might yield identical payoffs. $A$ no longer dominates $B$.
  *   Conversely, if we eliminate $B$ first, we keep $A$.

  **Intuitive Story:** Weak dominance is like being "on the bubble." Employee $A$ is kept over Employee $B$ because $A$ handled one specific difficult client better than $B$, while performing equally on everyone else. If that specific client fires the firm (is eliminated) *before* we evaluate the employees, $A$ and $B$ look identical. Who gets fired then? It becomes arbitrary. The outcome depends on whether we evaluated the employees before or after the client left.

  #### 3. Why This is a Conceptual Liability
  You mentioned this is treated as a liability rather than a curiosity. There are two main reasons, one technical and one economic.

  **A. Path Dependence implies Arbitrariness**
  A solution concept in game theory is supposed to predict the outcome of rational play based on the structure of the game. If the prediction changes based on the *order* in which the analyst processes the information (the order of elimination), the concept is not identifying a property of the game itself, but rather a property of the analyst's procedure. It suggests the "solution" is not intrinsic to the strategic situation.

  **B. Elimination of Nash Equilibria (The Economic Punchline)**
  This is the most important point for an economics student.
  *   **IESDS never eliminates a Nash Equilibrium.** If a profile is a NE, no player is playing a strictly dominated strategy. You can eliminate all dominated strategies, and the NE will survive in the reduced game.
  *   **IEWDS can eliminate Nash Equilibria.** Because weak dominance relies on indifference ($\ge$), eliminating a weakly dominated strategy can remove a strategy that was part of a NE.

  **Example Logic:** In a coordination game, playing "Left" might weakly dominate "Right" for Player 1 *if* Player 2 is rational. But if Player 2 plays "Right" in a specific NE, Player 1 playing "Right" is a best response. If we eliminate Player 1's "Right" via IEWDS, we destroy that equilibrium.

  **Pedagogical Hook:** "Strict dominance identifies strategies that are simply mistakes. Rational players don't make mistakes, so removing mistakes doesn't change the set of rational outcomes (Nash Equilibria). Weak dominance identifies strategies that are 'suboptimal unless the opponent plays a specific way.' But that 'specific way' might be part of an equilibrium! By eliminating weakly dominated strategies, we might be throwing out self-fulfilling expectations. Since Game Theory is often about finding equilibria, a method that deletes them is suspect."

  ### Summary for Section
  1.  **Mixed Domination:** Pure strategies are specialized; mixing allows hedging. A mix can be a "better generalist" than a pure "mediocre generalist." Furthermore, rationality implies playing a Best Response; strategies dominated by mixes are *never* Best Responses.
  2.  **Order Independence:** Strict dominance inequalities ($>$) survive subset selection; weak dominance inequalities ($\ge$ with one $>$) do not, because the "one $>$" might be eliminated.
  3.  **Liability:** Order dependence makes the solution arbitrary, but more importantly, IEWDS can discard valid Nash Equilibria, whereas IESDS preserves them.

  This framing should satisfy the student's curiosity about the "why" while reinforcing the rigorous distinctions they will need for advanced coursework.
