      *   *The "Averaging" Argument:* If strategy $A$ is good against $L$ but bad against $R$, and strategy $B$ is bad against $L$ but good against $R$, neither dominates $C$ (which is mediocre everywhere). But a mix of $A$ and $B$ can be "good enough" against both $L$ and $R$ to beat $C$ everywhere.
