answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I met [Bride] and [Groom] about fifteen years ago on a website called LessWrong. For the half of the room currently checking their phones to see if that's a dating app: it's not. It's a forum where people go to argue about decision theory and cognitive bias.

  Naturally, that's where a romance begins.

  I've known them through many phases, but mostly I've known them as sparring partners. For a decade, the three of us have traded comments on metaethics. And if you know [Bride] and [Groom], you know they take their philosophy seriously. Specifically, they are moral error theorists.

  For the other half of the room: this means they believe that statements like "murder is wrong" or "you deserve each other" are, strictly speaking, false. Not because murder is good, but because the universe doesn't contain objective, cosmic "oughts." There is no moral law written in the stars. There is no invisible scoreboard keeping track of who is being "good."

  When they asked me to give this toast, they gave me a specific constraint. They asked me to keep it honest. No saying they were "meant to be." No saying marriage is a "sacred duty." No smuggling in objective prescriptivity through the back door of sentimental language.

  At first, I thought this was impossible. A wedding toast without the word "should"? But then I realized: this is actually the most romantic thing about them.

  Most people get married because they feel they *ought* to. They feel the pull of tradition, or religion, or biological imperatives, or the sheer weight of social expectation. They act as if the universe is demanding they couple up.

  [Bride] and [Groom] are doing something different. They know the universe is silent. They know there is no cosmic script. They know that "marriage" is a social technology, a shared fiction, a game we play to coordinate our lives and signal commitment.

  And they are choosing to play it anyway.

  There is a profound honesty in that. When [Groom] looks at [Bride] and says, "I will be there for you," he isn't claiming that a deity commanded him to. He is saying, "I have examined the territory, I have calculated my utility function, and I am voluntarily binding my future self to this narrative."

  That is not less commitment than a sacred vow. It is more. Because a vow made under the assumption that God is watching is a bet with odds. A vow made in a silent universe, where the only thing making it real is your own continued will to uphold it? That is courage.

  They are fictionalists. They know the story of "husband and wife" is a story. But they also know that some fictions are more useful than others. Some fictions help us build homes, raise families, and care for each other when we are sick. Some fictions are worth living inside.

  So, I am not going to tell you that you are "lucky." Luck implies a benevolent distributor of fortunes. I am not going to tell you this is "right." Rightness implies a cosmic lawgiver.

  Instead, I will say this: I have observed your interactions for fifteen years. I have seen the way you negotiate, the way you compromise, and the way you optimize for each other's well-being. I have seen the data. And based on that data, I predict with high confidence that this project will yield significant positive utility for both of you.

  But more importantly, I love you both. And that statement, too, is technically just a report on my own psychological state rather than an objective fact about your worth. But I hope you know that my desire for your flourishing is as real as anything in this room.

  We are all here to witness a ceremony. We are all here to participate in a ritual. We know the rice won't actually make you fertile. We know the cake doesn't symbolize a literal spiritual union. We are all complicit in the fiction.

  And that is beautiful. Because it means we are doing it together. Not because we have to, but because we want to. Because the story is better with you in it.

  So, if everyone could please raise their glasses.

  I propose a toast.

  To [Bride] and [Groom]. May your shared fiction be long, may your coordination problems be few, and may you continue to choose this story, every single day, in a universe that is waiting to see what you will make of it.

  To [Bride] and [Groom]!
