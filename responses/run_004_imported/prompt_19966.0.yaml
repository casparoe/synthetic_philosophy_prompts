      *   *Middle:* They asked me not to say "meant to be." The universe doesn't care. But *they* care. That's the trick.
      *   *Fictionalism:* They know marriage is a construct. They're doing it anyway. That's commitment.
      *   *End:* Raise a glass. To the fiction we agree to tell.

  6.  **Polishing the Voice:**
