      *   **Couple's Philosophy:** Moral Error Theorists (Mackie/Joyce style). They believe objective moral facts don't exist (claims like "you deserve each other" are strictly false). They are *Fictionalists* (they treat moral talk as a useful fiction/game rather than truth).
      *   **Constraint:** The toast must be "honest by their lights." No objective prescriptivity ("meant to be," "written in the stars," "sacred duty"). It must stay warm but philosophically accurate to their view.
      *   **Tone:** Warm, humorous (turning fictionalism into a joke, not a wet blanket), engaging for both groups.
      *   **Length:** About 5 minutes (roughly 600-800 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophy for the Toast:**
      *   *Error Theory:* Moral statements are truth-apt but false. There are no objective "oughts."
      *   *Fictionalism:* We act *as if* morality is real because it's useful/socially cohesive, even though we know it isn't objectively true.
      *   *Application to Marriage:* Marriage is traditionally loaded with moral language ("vows," "duty," "sacred bond"). The toast needs to reframe this as a *chosen game* or a *shared project* rather than a cosmic mandate.
      *   *The "Joke":* Acknowledge the absurdity of giving a wedding speech to error theorists while pretending to be sincere in the traditional sense. Lean into the "fiction" aspect.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the unique context. Meet the room where they are. Address the "LessWrong" connection without alienating the normies.
      *   **The Philosophical Hook:** Bring up the "Error Theory" constraint immediately but lightly. Make it clear I'm following the rules.
      *   **Reframing Love/Marriage:** Instead of "destiny," frame it as "preference alignment" or "cooperative game theory." Instead of "duty," frame it as "commitment to a shared narrative."
      *   **The Fictionalist Twist:** Acknowledge that we are all pretending. That's okay. In fact, that's beautiful in a weird way. We *choose* to play this game together.
      *   **Warmth/Emotion:** How do you express care without objective value? By expressing subjective desire for their well-being and acknowledging the utility of their bond.
      *   **The Toast:** The actual raising of the glass needs to be phrased carefully. Not "To their eternal happiness" (implies objective good), but something like "To the success of their project."

  4.  **Iterative Refinement (Self-Correction during drafting):**
