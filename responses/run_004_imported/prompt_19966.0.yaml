      *   *Critique:* Will the normies be bored?
      *   *Fix:* Translate the jargon. "Objective prescriptivity" $\rightarrow$ "Cosmic rulebook." "Fictionalism" $\rightarrow$ "Playing make-believe."
      *   *Critique:* Is it warm enough?
