prompt: |-
  So I actually sat down and read Hannah Arendt's old essay on truth and politics (the one everybody quotes in those 'post-truth' thinkpieces) instead of just seeing it referenced secondhand, and there's two things in it that are stuck in my head. First, she argues factual truths -- like the fact that Germany invaded Belgium in 1914 -- are actually way MORE fragile than rational truths like math or logic, which feels backwards to me, since 2+2=4 seems way more solid than any historical claim could ever be. Second, in the follow up essay she wrote about the Pentagon Papers, she says lying and the human capacity to act are basically interconnected, like they come from the exact same root, which is a pretty wild claim once it actually sinks in -- shes basically saying politicians lying isn't some outside corruption of politics but grows out of the very same ability that lets us act freely and change things in the first place. Can you actually explain both of these arguments properly, not just the soundbite versions, and spell out how they connect to each other? I feel like I keep getting the vibe of what she's going for without ever getting the actual argument underneath it.
