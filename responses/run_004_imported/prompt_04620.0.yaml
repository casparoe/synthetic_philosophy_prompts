      *   *Factual Truths (History/Facts):* These depend on *testimony* and *witnesses*. "Germany invaded Belgium" happened, but it exists in the human world through records, memory, and agreement.
      *   *Fragility:* Why fragile? Because facts can be erased from memory, documents can be destroyed, witnesses can be killed or silenced. Rational truths don't need witnesses; factual truths *do*.
      *   *Political Vulnerability:* Politics is about opinion and persuasion. Facts are stubborn, but they can be spun, ignored, or rewritten by organized lying. A rational truth isn't threatened by opinion (no one argues $2+2=5$ seriously), but factual truths are constantly debated (e.g., "Was it really an invasion?").
      *   *Key Distinction:* Rational truths compel the mind; factual truths require a public space to survive.

  3.  **Deconstruct Argument 2: Lying and the Capacity to Act:**
      *   *The Root:* The ability to lie requires the ability to imagine something that *is not*.
      *   *Action (Natality):* Arendt's concept of action is about beginning something new. To act is to change the status quo.
