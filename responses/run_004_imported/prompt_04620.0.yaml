      *   *The Paradox:* The same faculty that allows us to be free (imagining the non-existent) allows us to destroy the factual ground (lying).
      *   *The Stakes:* If we lose factual truth (Argument 1), we lose the common world. If we suppress the capacity to act (to stop lying), we lose freedom.
      *   *Synthesis:* Arendt isn't saying lying is good. She's saying the *source* of lying is the *source* of freedom. The danger is when the "capacity to negate reality" (lying) is used to destroy "factual truth" (the ground of action). Rational truths don't matter as much here because they aren't part of the political realm.

