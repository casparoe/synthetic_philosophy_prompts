prompt: |-
  I'm a software engineer who was recently elected to my condominium association's board, and I've somehow ended up being the one asked to write up a recommendation on a dispute the rest of the board can't settle on its own — possibly because I was the only one willing to reread our entire declaration of covenants line by line. That declaration, drafted back in 1988, says units may be used 'only for single-family residential purposes' and that 'no trade, business, or commercial activity of any kind shall be conducted on or from any unit.' One owner, who lives out of state and has never actually stayed in her unit, has been renting it out through Airbnb for stretches as short as two nights, several times a month. About half the board wants to send a cease-and-desist letter and start the fining process under our enforcement policy; the other half thinks the declaration doesn't clearly cover this, since the guests are still just sleeping and living there the way any resident would, and the 'business' language was obviously aimed at things like a storefront or a home office with clients coming and going, not a unit filled through an app. We paid for an hour of a real-estate attorney's time, and she told us both readings were 'legally defensible' and that it was up to the board — which was not the answer anyone wanted.

  The timing makes this more than academic: a unit two doors down is under contract to sell, and the buyer's lender has sent the board a standard questionnaire asking whether the declaration restricts short-term or transient rentals and whether any such restriction has been consistently enforced, since an unclear or inconsistent answer can reportedly complicate financing for the whole building, not just that one sale. Amending the declaration to add an explicit minimum-lease term would require a two-thirds vote of all owners by mailed ballot, which realistically takes months we don't have before the closing date. A couple of board members keep appealing to 'what the original drafters intended,' but none of them are still owners here, and the only surviving 1988 meeting minutes we could dig up don't mention rentals at all. The whole argument reminds me, oddly, of fights I've had at work over whether code should do exactly what a spec says or whatever the spec was obviously trying to accomplish when it didn't anticipate some case — except here there's no author left to go ask.

  Could you draft the short memo I'll circulate to the rest of the board before our meeting next Tuesday? It should recommend one concrete path forward — enforcement, non-enforcement, or something like a conditional or grandfathering arrangement — along with a realistic timeline for acting given the pending sale, and it should take the strongest version of whichever side it doesn't recommend seriously, rather than treating that reading of the declaration as obviously careless or unreasonable.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Software Engineer turned Condo Board Member.
      *   **Task:** Draft a memo to the Board recommending a path forward on a short-term rental (STR) dispute.
      *   **Context:**
          *   Declaration (1988) says "single-family residential purposes" and "no trade, business, or commercial activity."
          *   Owner (out-of-state) rents via Airbnb (2-night stays, several times/month).
          *   Board is split 50/50.
          *   Attorney said both interpretations are "legally defensible."
          *   **Urgency:** A unit two doors down is under contract. Lender questionnaire asks about STR restrictions and enforcement. Inconsistent/unclear answers risk financing for the *whole building*.
          *   **Constraint:** Amending the declaration takes months (2/3 vote, mailed ballot), too slow for the closing.
          *   **Requirement:** Recommend *one* concrete path (Enforcement, Non-enforcement, or Conditional/Grandfathering).
          *   **Requirement:** Include a realistic timeline.
          *   **Requirement:** Steelman the opposing view (treat the other side's argument seriously, not dismissively).
          *   **Tone:** Professional, decisive, pragmatic, acknowledging the ambiguity (like a spec dispute).

  2.  **Determine the Recommendation:**
      *   *Option A: Non-enforcement.* Risks the lender questionnaire. If we say "no restriction" or "not enforced," the lender might deny the loan. This hurts the whole community (property values, liquidity).
      *   *Option B: Enforcement.* Risks a lawsuit from the Airbnb owner. Attorney says it's defensible, but not guaranteed. However, it satisfies the lender if we can show consistent enforcement intent.
      *   *Option C: Conditional/Grandfathering.* Too complex for the immediate timeline. Requires policy creation which might look like "new rules" to the lender.
      *   *Decision:* **Enforcement** is the safer bet for the *community's* financial health, specifically regarding the pending sale. The lender questionnaire is the critical pressure point. If the board admits ambiguity or non-enforcement, the deal dies. Even if the legal case is 50/50, the financial risk of the deal dying affects everyone. The "Single-Family Residential" clause is the stronger hook for lenders than the "Business" clause.
      *   *Nuance:* I need to acknowledge the "Business" clause ambiguity (the opposing view) but lean heavily on the "Single-Family Residential" clause and the financial imperative.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly upfront.
      *   **Context/Problem:** Briefly recap the Airbnb situation and the pending sale/lender questionnaire.
      *   **Analysis of the Declaration (The "Spec"):**
          *   Acknowledge the ambiguity (Engineer analogy fits well here implicitly, but keep tone formal).
          *   Address the "Business" clause (Opposing view: Airbnb isn't a storefront). *Steelman this:* It's a reasonable interpretation that 1988 drafters didn't foresee apps.
          *   Address the "Single-Family Residential" clause (Supporting view): Transient rentals are not single-family residential use. This is the stronger legal hook for lenders.
      *   **Financial Imperative (The "Production Environment"):** The lender questionnaire is the critical path. Inconsistency = Loan denial = Deal failure = Comps drop.
      *   **Recommendation:** Proceed with enforcement *specifically to satisfy the lender questionnaire*, while acknowledging the legal risk.
      *   **Timeline:** Needs to be tight to meet the closing.
      *   **Mitigation/Next Steps:** How to handle the Airbnb owner fairly (warning first?) and the long-term amendment process.

  4.  **Refining the Tone:**
      *   Avoid being overly technical but use the engineer's logical framework (risk assessment, critical path).
      *   Ensure the "Other Side" feels heard. The argument that "guests sleep like residents" is valid, but "transient" vs. "residential" is the key distinction.
      *   Make sure the recommendation is actionable.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is recommending enforcement too aggressive given the attorney's "50/50" warning?
      *   *Fix:* Frame it as a risk management decision. The risk of *not* enforcing (losing the sale/financing for the building) outweighs the risk of enforcing (potential legal spat with one owner). Also, suggest a "cure period" to be reasonable.
      *   *Critique:* Did I address the timeline?
      *   *Fix:* Add specific dates relative to "Next Tuesday" and the closing.
      *   *Critique:* Did I steelman the opposition?
      *   *Fix:* Explicitly state that the "Business" clause argument is reasonable regarding original intent, but explain why "Residential Purpose" overrides it in this context.

  6.  **Final Polish:** Check against constraints.
      *   One concrete path? Yes (Enforcement).
      *   Realistic timeline? Yes.
      *   Steelman opposing view? Yes.
      *   Address lender questionnaire? Yes.

  7.  **Final Output Generation:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors, [Condo Association Name]
  **FROM:** [Your Name], Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Short-Term Rentals and Pending Lender Questionnaire

  **Executive Summary**
  We face two intersecting issues: a compliance dispute regarding Unit [Number]'s short-term rentals (STR) and a pending sale of Unit [Number] contingent on lender financing. Our attorney has confirmed that our 1988 Declaration offers legally defensible arguments for both prohibiting and allowing STRs. However, the lender questionnaire regarding financing requires a definitive statement on restrictions and enforcement.

  **Recommendation:** I recommend the Board vote to **initiate enforcement proceedings** against the current STR activity immediately. This path presents the lowest financial risk to the Association as a whole. While the "commercial activity" clause is ambiguous, the "single-family residential" clause provides sufficient grounds for a lender to accept a restriction. We must prioritize the stability of property financing for all owners over the operational flexibility of one investor.

  **Analysis of the Declaration (The "Spec")**
  The Board is currently split on the interpretation of our governing documents. To make a decision, we must weigh both interpretations seriously.

  *   **The Case for Non-Enforcement (Opposing View):**
      It is reasonable to argue that the 1988 drafters did not anticipate app-based rentals. The prohibition on "trade, business, or commercial activity" was likely intended to prevent storefronts, offices, or high-traffic commercial operations. An Airbnb guest sleeping in a unit is functionally similar to a resident sleeping in a unit. There is no physical signage, no client foot traffic, and no change to the building's wear and tear. Interpreting the "business" clause to cover passive income generated via an app is an expansive reading that may not hold up if litigated solely on those grounds.

  *   **The Case for Enforcement (Supporting View):**
      However, the Declaration also restricts use to "single-family residential purposes." Courts and lenders frequently distinguish between *residential* use (a permanent or semi-permanent household) and *transient* use (hotel-like occupancy). Two-night stays do not constitute a "single-family" household in any traditional zoning or lending context. While the "business" clause is debatable, the "residential purpose" clause is the stronger hook for lenders. If we classify these stays as transient rather than residential, they violate the core use restriction, regardless of whether they constitute a "business."

  **The Critical Path: Lender Financing**
  The pending sale two doors down changes this from a theoretical debate to a financial imperative. The lender's questionnaire asks:
  1.  Does the Declaration restrict short-term/transient rentals?
  2.  Has this restriction been consistently enforced?

  If we answer "No" to the restriction, or admit to "Inconsistent Enforcement," the lender may deny financing. This does not just affect the selling owner; it sets a precedent that can complicate refinancing or sales for *every* unit in the building. A failed sale due to financing issues lowers our comparable property values.

  Therefore, even if the legal case against the Airbnb owner is only 50/50, the financial risk of failing the lender questionnaire affects 100% of the ownership. We cannot afford ambiguity in our response to the lender.

  **Proposed Action Plan & Timeline**
  We cannot amend the Declaration before the closing (months required). We must act under the existing text.

  *   **Tuesday (Next Meeting):** Board votes to classify stays under 30 days as a violation of "single-family residential purposes."
  *   **Wednesday:** Issue a **Notice of Violation** to the Airbnb owner.
      *   *Mitigation:* To act in good faith and reduce litigation risk, we will offer a 30-day "cure period" before fines commence. This acknowledges the ambiguity of the past while establishing future consistency.
  *   **Thursday:** Submit the Lender Questionnaire.
      *   *Response:* "Yes, the Declaration restricts use to single-family residential purposes, which precludes transient rentals. The Board is currently enforcing this provision."
  *   **Next 30 Days:** Monitor compliance. If the owner ceases STR activity, we pause fines. If not, we proceed with the fine schedule as written in our enforcement policy.
  *   **Q1 2024:** Begin the amendment process. Regardless of this outcome, we must update the Declaration to explicitly define minimum lease terms to prevent this ambiguity in the future.

  **Conclusion**
  This recommendation is not a judgment on the Airbnb owner's character, nor does it dismiss the Board's valid concern that our documents are outdated. It is a risk management decision. The ambiguity in our "spec" (the Declaration) is a technical debt we must pay down. Until we can refactor the code (amend the Declaration), we must patch the vulnerability to prevent a production outage (the failed sale).

  I move that we authorize the issuance of the Notice of Violation to ensure we can truthfully and definitively answer the lender's questionnaire.
