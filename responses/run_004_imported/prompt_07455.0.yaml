prompt: |-
  Okay, this is going to sound pretty niche but bear with me. I'm on my high school's Green Council, which is this student committee that officially makes food and sustainability recommendations to the cafeteria director and the principal — they don't have to accept what we propose, but they do have to formally respond to it, so it's not just for show. This semester we're voting on whether to recommend a Meatless Monday policy, something bigger than that, or nothing at all, and the committee has basically split into two camps: half of us think animals don't have "rights" so this whole thing is really just about cost and what people feel like eating, and the other half think that if an animal can suffer, that's morally just as serious as human suffering, so we should go all the way to full vegetarian, no in between.

  I got kind of obsessed with this for a debate club topic and ended up reading the animal-related part of Nozick's Anarchy, State, and Utopia (it's a short section, not really the main point of the book — someone linked me an SEP page about it after i mentioned it in a group chat). His actual position is weirder than either camp on my committee. I think the phrase he uses is something like "utilitarianism for animals, Kantianism for people" — meaning animals don't get the kind of absolute rights that block trade-offs the way a person's rights do, but their suffering still has to be weighed in the calculation, and he thinks routine meat-eating mostly fails that calculation anyway, because the human benefit is just marginally better taste, which isn't nearly enough to outweigh an animal's suffering and death. But he also sounds pretty unsure about his own two-level view — he never really explains why rights would just switch on at the human line and not apply in some weaker form to animals too, which seems like a pretty big hole if your whole argument depends on animals and people being fundamentally different categories.

  Could you write the actual memo I'd bring to our Tuesday meeting? Like a real committee memo, not a philosophy essay — it needs to recommend ONE specific concrete policy (with a rough timeline for phasing it in, not just "let's keep discussing"), lay out the reasoning in a way both camps on my committee could actually follow, and seriously engage with the strongest objection to whatever it ends up recommending. Specifically, if the marginal-taste argument is doing enough work to justify some real policy change, why does that logic stop at something moderate like Meatless Monday instead of pushing all the way to full vegetarian? I don't want the memo to just dodge that part. Thanks!
