answer: |-
  Your intuition is correct: there is a robust philosophical distinction between what is *good* to do and what is *required* to do. The discomfort you feel stems from a category error your friend group is making—confusing **moral obligation** with **supererogation**.

  Here is a breakdown of the ethical framework you can use to articulate this in your group chat, along with an explanation of why Priya's choices do not change your friends' moral obligations.

  ### 1. The Core Concept: Supererogation
  In ethics, actions are often divided into three categories:
  1.  **Obligatory:** Actions you *must* do (e.g., keeping promises, not harming others, fulfilling your school's graduation requirements).
  2.  **Forbidden:** Actions you *must not* do (e.g., stealing, cheating).
  3.  **Supererogatory:** Actions that are good to do but **not wrong to omit**.

  Priya's actions fall squarely into the third category. Tutoring, organizing drives, and working shelter shifts are morally praiseworthy. However, by definition, a supererogatory act is one that goes "above and beyond" the call of duty.

  **The Argument:** If an action is supererogatory, it cannot be transformed into an obligation simply because someone else chooses to do it. If Priya's behavior became the new baseline for "acceptable" morality, then her actions would no longer be supererogatory; they would just be normal. But since they are clearly extraordinary, they remain optional for everyone else.

  ### 2. The "Moral Floor" vs. The "Moral Ceiling"
  You can explain to your friends that morality has a **floor** (the minimum required to be in good standing) and a **ceiling** (the maximum good one can do).

  *   **The Floor:** This is what you owe each other as members of a community. In your context, this includes meeting the school's service requirements, being a supportive friend, and managing your own well-being.
  *   **The Ceiling:** This is where Priya is operating. She is maximizing her contribution.

  **The Argument:** One person reaching for the ceiling does not raise the floor for everyone else. If a professional athlete runs a 4-minute mile, it does not mean the rest of the track team is "failing" for running a 6-minute mile. The standard for *excellence* has been raised, but the standard for *participation* remains the same. Accusing your friends of being "selfish" for meeting the floor implies that the floor is insufficient, which contradicts the school's own moral framework for graduation.

  ### 3. The Problem of "Moral Demandingness"
  Philosophers debate how "demanding" morality should be. If we argue that Priya's level of sacrifice is what everyone *ought* to do, we run into the problem of **over-demandingness**.

  If everyone in your group quit their part-time jobs to volunteer full-time (like the friend who already did), several negative outcomes might occur:
  *   **Burnout:** People cannot sustain Priya's pace indefinitely without sacrificing their mental health or education.
  *   **Loss of Diversity:** A community needs people who volunteer, but it also needs people who work, study, rest, and pursue other interests.
  *   **Resentment:** When people are guilted into supererogatory acts, they often grow to resent the cause they are serving.

  **The Argument:** Morality generally accounts for human limitations. We are permitted to have "personal projects" (like a part-time job, hobbies, or rest) that allow us to live fulfilling lives. Prioritizing these projects is not selfishness; it is self-preservation. Priya has chosen to minimize her personal projects for the sake of others. That is her prerogative, but it does not make your choice to maintain a balanced life morally wrong.

  ### 4. Inspiration vs. Obligation
  This is the crucial distinction for your group chat. Priya's actions should function as **inspiration**, not **indictment**.

  *   **Inspiration:** "Priya is doing amazing work; it makes me think about where I might be able to contribute a little more if I can."
  *   **Indictment:** "Priya is doing amazing work; therefore, anyone doing less is morally deficient."

  When the group shifts from admiration to guilt, they are weaponizing Priya's virtue. This is unfair to Priya, too. It turns her generosity into a stick used to beat others, which can strain her relationships and make her feel responsible for your guilt.

  ### 5. How to Frame This in the Chat
  You want to validate Priya's goodness while protecting the group from unfair guilt. Here is a suggested way to phrase the argument:

  > "I've been thinking about our conversation regarding Priya's volunteering. I agree that what she does is incredibly admirable, and I don't want to minimize that. But I think we need to be careful about the difference between **moral excellence** and **moral obligation**.
  >
  > Priya is operating at a level of moral excellence that is optional. That's what makes her actions so special. If we treat her choices as the new mandatory baseline, we aren't just pressuring ourselves; we're actually erasing the category of 'extraordinary goodness.'
  >
  > Meeting our school requirements and managing our own lives (like working part-time) isn't selfishness; it's fulfilling our actual obligations. We can admire Priya without adopting her specific sacrifices as a requirement for being a 'good person.' Let's support her without making her pace the standard we all have to match."

  ### Summary
  To answer your specific questions:
  1.  **Is there a moral difference between good and required?** Yes. It is the difference between duty and supererogation.
  2.  **Does one person doing more change what others owe?** No. Moral obligations are generally independent of the actions of others (unless those actions create a specific dependency, which is not the case here).
  3.  **Does it generate social pressure?** Yes, but that pressure is socially constructed, not morally grounded.

  Your friends are feeling **social shame**, not **moral guilt**. There is a difference. You are not failing your duty by living a balanced life, even if your friend is choosing a life of extreme service.
