prompt: |-
  I've served two years on my city council's rules and ethics committee. I'm an accountant by trade, with no background in law or philosophy, but I've spent a fair amount of time reading up on this on my own since we had a real blowup over it. During debate on a nondiscrimination ordinance, one member said only that "the Bible is clear on this" and voted no; when a colleague asked her to explain further, she replied that this was reason enough and she had nothing to add. Half the committee wants a standing rule that anyone invoking a religious or other deeply held conviction on the floor must also offer a reason that a colleague who doesn't share it could still accept as grounds for the vote; the other half says that rule is neutral in name only, since it tells religious colleagues their real grounds for voting don't count unless repackaged in someone else's terms. I don't think this is a First Amendment question — no one is being made to pray, and no one's belief is being penalized — it's about what members can fairly ask of each other as reasons for a vote. Please draft the memo I'll bring to our next meeting: recommend a specific rule or recommend against one, say how it would have applied to last month's incident, and take on the second objection directly rather than treating it as obviously mistaken.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** City Council Rules and Ethics Committee Member (2 years tenure).
      *   **Background:** Accountant (practical, analytical), no law/philosophy degree, but self-educated on the issue.
      *   **Context:** Recent blowup over a nondiscrimination ordinance. One member voted "no" solely based on "the Bible is clear," refusing to elaborate.
      *   **The Conflict:** Half the committee wants a rule requiring "public reasons" (reasons acceptable to non-believers) for votes based on deep convictions. The other half argues this discriminates against religious voices by forcing them to translate their true motives.
      *   **User's Stance:** Not a First Amendment issue (government speech vs. private rights), but about mutual fairness and deliberative quality.
      *   **Task:** Draft a memo for the next meeting.
      *   **Requirements:**
          1.  Recommend for or against a specific rule.
          2.  Explain how it would apply to the recent incident.
          3.  Address the "neutrality/discrimination" objection directly and seriously (not dismissing it).
          4.  Tone: Professional, pragmatic (accountant background), ethical, deliberative.

  2.  **Determine the Recommendation:**
      *   *Option A (No Rule):* Maintains absolute freedom of expression but risks eroding public trust and deliberative quality. Doesn't solve the "because I said so" problem.
      *   *Option B (Strict Public Reason Rule):* Requires secular justification for all religiously motivated votes. Risks alienating religious members and feeling coercive.
      *   *Option C (Hybrid/Transparency Rule):* Encourages elaboration without banning religious reasoning, focusing on the *function* of the vote (public policy impact) rather than the *source* of the conviction.
      *   *Decision:* As an accountant/ethics member, the goal is accountability and clarity. A strict "public reason" requirement (like the one proposed by half the committee) is philosophically contentious (Rawlsian public reason) and might be unenforceable. However, doing nothing is also problematic. The best path is a rule that emphasizes *civic justification* without banning religious language. It should require members to connect their conviction to the *public good* or *civic welfare*, rather than demanding they abandon their religious language.
      *   *Refinement:* Actually, looking at the prompt, the proposal is "offer a reason that a colleague who doesn't share it could still accept as grounds for the vote." This is the classic "Public Reason" standard. If I recommend *against* a strict rule, I need to offer an alternative. If I recommend *for* a rule, I need to mitigate the objection.
      *   *Strategic Choice:* Given the user's background (accountant, practical) and the goal (ethics/deliberation), recommending a *modified* rule is strongest. A rule that requires explaining the *civic impact* rather than just the *source of authority*. This addresses the objection (you can keep your religious reason) but solves the problem (you must explain why it matters for *everyone*).
      *   *Wait, let's look closer:* The prompt asks to "recommend a specific rule or recommend against one."
      *   *Best Approach:* Recommend a rule that focuses on **Civic Justification** rather than **Secular Translation**. This navigates the middle ground. It requires members to explain how their vote serves the city's interests, regardless of the motivation.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the tension. State the purpose (improving deliberation, not policing belief).
      *   **The Recommendation:** Propose a "Civic Justification" rule. It shouldn't ban religious language, but it should require connecting the vote to shared civic values (safety, welfare, equity, etc.).
      *   **Application to the Incident:** How would this have changed the "Bible is clear" moment? The member could still cite the Bible, but would need to add, "and this aligns with our city's goal of X" or "this protects Y." It moves from "Authority" to "Impact."
      *   **Addressing the Objection:** This is crucial. The objection is that this forces religious members to speak a "foreign language."
          *   *Acknowledgment:* It *is* a burden. It asks them to do extra work.
          *   *Counter:* Representation involves translation. We all translate private interests into public policy. A business owner can't just say "this helps my bottom line"; they must argue "this helps the economy." Religious members are asked to do the same. It's not silencing; it's bridging.
      *   **Conclusion:** Reiterate the goal (trust, deliberation).

  4.  **Refining the Tone:**
      *   Avoid legalese (user is not a lawyer).
      *   Avoid heavy philosophical jargon (user is not a philosopher), though the concept is "Public Reason Liberalism" (Rawls). Keep it practical.
      *   Use accounting/audit metaphors if appropriate (transparency, ledgers, bottom line), but don't overdo it.
      *   Ensure the "Second Objection" is treated with respect, not dismissed.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the proposed rule too vague?
      *   *Fix:* Make the rule text specific. "When stating a position based on personal conviction, members should articulate the corresponding public interest."
      *   *Critique:* Did I address the First Amendment point?
      *   *Fix:* Acknowledge the user's view (it's internal rules, not law) but keep the focus on ethics.
      *   *Critique:* Is the objection handled well?
      *   *Fix:* Ensure I validate that it *feels* like a burden, but explain why it's a necessary burden of office.

  6.  **Final Polish:** Check against all constraints.
