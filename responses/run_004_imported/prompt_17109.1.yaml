answer: |-
  **MEMORANDUM**

  **TO:** Rules and Ethics Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Standards of Deliberation and Voting Justification

  **Purpose**

  Following the recent debate regarding the nondiscrimination ordinance, our committee is divided on whether to adopt a standing rule regarding how members articulate the grounds for their votes. Specifically, we are considering a requirement that members invoking religious or deeply held personal convictions must also provide a rationale acceptable to colleagues who do not share those convictions.

  I am an accountant by trade, not a lawyer or a philosopher. My perspective on this issue is grounded in the practical mechanics of governance and the fiduciary duty we owe to the public. We are hired to manage the city's interests, not merely to register our personal moral ledgers. This memo recommends adopting a modified version of the proposed rule, explains how it would apply to recent events, and addresses the significant concern that such a rule marginalizes religious voices.

  **Recommendation**

  I recommend we adopt **Rule 4.1: Civic Justification for Voting.**

  *Proposed Text:* "When casting a vote or stating a position on the floor, Council Members are encouraged to disclose the motivations behind their decision. However, when a vote is based primarily on personal, religious, or philosophical conviction, the Member shall also articulate the anticipated impact of that vote on the public welfare, safety, or legal standing of the City."

  This differs slightly from the initial proposal. It does not demand that a member find a "secular" reason that others must *accept* as valid (which invites debate over what is "acceptable"). Instead, it requires the member to connect their conviction to a *civic outcome* that others can *understand*. It shifts the focus from the *source* of the authority (e.g., Scripture) to the *consequence* of the policy (e.g., community cohesion, legal liability, public health).

  **Application to Recent Incident**

  Had this rule been in effect during last month's debate on the nondiscrimination ordinance, the interaction would have proceeded differently, though the vote count might have remained the same.

  When the Member stated, "The Bible is clear on this," she would have been compliant with the first part of the rule (disclosing motivation). However, when pressed, the rule would have required her to add a statement regarding civic impact.

  *   **Actual Exchange:** "The Bible is clear on this." / "Can you explain further?" / "That is reason enough."
  *   **Exchange Under Rule 4.1:** "The Bible is clear on this. Therefore, I believe passing this ordinance would undermine the moral fabric of our community [or: create conflict with religious organizations], which is detrimental to the city's welfare."

  This distinction is vital. The first exchange ends deliberation; it is a conversation-stopper. The second exchange opens deliberation. Colleagues can then debate the *claim* about the moral fabric or the conflict with organizations. They cannot debate the Member's relationship with the Bible, but they can debate the civic consequence she asserts. This allows us to do our job: evaluating policy impacts, not policing souls.

  **Addressing the Objection Regarding Neutrality**

  The strongest argument against this rule is that it is neutral in name only. Colleagues have rightly argued that requiring a religious member to translate their vote into "public terms" tells them their true grounds do not count unless repackaged in someone else's language. They argue this places a unique burden on religious members that secular members do not bear.

  I take this objection seriously. It is true that a secular member voting based on "utilitarian economics" is already speaking the language of public policy, while a religious member is asked to translate. This is a burden. However, I believe it is a necessary burden of the office, for two reasons:

  1.  **The Duty of Translation:** Every member of this council represents a private interest that must be translated into public good. A business owner on this council cannot vote to zone land for their own mall simply because "it helps my business." They must argue, "It helps my business, *which will generate tax revenue and jobs for the city.*" A labor union member cannot vote solely because "my union wants this," but must argue, "This protects workers, *which reduces turnover and increases public safety.*" In this context, religious citizens are not being singled out; they are being asked to do what all of us must do: bridge the gap between private conviction and public consequence.
  2.  **The Nature of Coercion:** When we vote, we are not merely expressing ourselves; we are coercing our neighbors. A city ordinance is backed by fines and police power. If I vote to fine a citizen, I owe that citizen a reason they can comprehend, even if they do not agree with it. If my only reason is "My God says so," and that citizen does not worship my God, I have effectively told them they are subject to a law they had no ability to reason through. Requiring a civic justification respects the autonomy of the constituents we govern.

  **Conclusion**

  This rule does not penalize belief. It does not ask a member to vote against their conscience. It simply asks that when we wield the power of the city, we explain how that power serves the city.

  By adopting Rule 4.1, we protect the right of members to be motivated by faith while ensuring that our deliberations remain accessible to all constituents. We acknowledge the burden of translation, but we recognize it as the cost of representing a diverse public. I urge the committee to move this recommendation to the full Council.
