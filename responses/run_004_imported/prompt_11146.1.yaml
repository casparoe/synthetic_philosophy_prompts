      *   **Goal:** Write an essay that engages deeply with the asymmetry (or lack thereof) between morality and math/logic in the context of EDAs.
      *   **Constraint:** Must land on a verdict (no wishy-washy "reasonable people disagree"). Either defend the generalization (global skepticism/evolutionary naturalism) or defend the asymmetry (morality is vulnerable, math/logic is not).
      *   **Tone:** Philosophical, rigorous, engaging, decisive.

  2.  **Deconstruct the Problem:**
      *   *The EDA:* Evolution shaped moral beliefs for fitness, not truth. If realism is true (mind-independent truths), the alignment is a coincidence. Coincidences are implausible. Therefore, realism is likely false (or unjustified).
      *   *The Objection:* Evolution shaped *all* cognitive faculties, including logic and math. If the EDA works for morality, it works for math/logic.
      *   *The Stakes:* If it works for math/logic, we lose the tools to reason about the EDA itself (self-defeat/global skepticism). If it doesn't, there must be a relevant difference.
      *   *The Task:* Find that difference or embrace the skepticism.

  3.  **Evaluate Potential Positions:**
      *   *Option A: Global Skepticism (The Bullet).* Accept that evolution undermines everything. But this is self-undermining. If I can't trust logic, I can't trust the EDA. This is a dead end unless modified (e.g., pragmatic naturalism).
      *   *Option B: The Asymmetry Defense (The Standard Realist Move).* Math/Logic are different from Morality. Why?
          *   *Necessity:* Math is necessary; morality is contingent? (Street argues moral truths could be different if evolution were different).
          *   *Observation/Input:* Math has empirical input (counting sheep); morality has... what?
          *   *Conceptual Role:* Math is constitutive of reasoning; morality is a substantive domain.
      *   *Option C: The Constructivist/Pragmatist Turn.* Street's actual view. But the prompt asks to engage with the *objection* to the EDA, not just summarize Street.
      *   *Option D: The "Third Factor" Refinement.* The prompt says assume I know Wielenberg/Parfit. I need to go deeper.

  4.  **Developing the Argument (The Verdict):**
      *   I need to pick a side. The most philosophically robust position that avoids self-defeat while acknowledging the force of the EDA is to argue for a **principled asymmetry based on the constitutive role of logic versus the substantive nature of morality.**
      *   *Thesis:* The EDA successfully targets robust moral realism but fails to generalize to logic and mathematics because logic is *constitutive* of the evolutionary explanation itself, whereas morality is *substantive*. To doubt logic is to lose the ability to formulate the doubt; to doubt morality is merely to lose a specific domain of normativity.
      *   *Refinement:* It's not just "we need logic to argue." It's about the *relationship* between the evolutionary story and the truths in question. Evolution *presupposes* logical consistency to operate (cause and effect), whereas it does not presuppose specific moral truths.

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Hook the reader with the "Proves Too Much" objection. Acknowledge Street and the user's familiarity. State the thesis clearly: The objection fails because it conflates *framework* conditions (logic) with *substantive* claims (morality).
      *   **Section 1: The Force of the Generalization.** Acknowledge why the objection is tempting. Evolution is a causal process. If it doesn't track truth in domain X, why domain Y? Mention Plantinga's EAAN (Evolutionary Argument Against Naturalism) as the parallel in philosophy of religion.
      *   **Section 2: The Self-Defeat Trap.** If we accept the generalization, we lose the EDA. This isn't just pragmatic; it's structural. You can't use logic to debunk logic. This forces a distinction.
      *   **Section 3: The Constitutive vs. Substantive Distinction.** This is the core argument.
          *   Logic/Math: These are the rules of the game. Evolution is a physical process that *instantiates* causal relations (if A then B). An organism that violates basic logic (e.g., A and not-A) cannot navigate a causal world. The "fitness" of logic is internal to its truth.
          *   Morality: Moral truths (on the realist view) are *additional* facts. "Suffering is bad" is not required for the causal chain of "fire burns." Evolution could have selected for "suffering is good" if it led to survival. The link is contingent.
      *   **Section 4: Addressing the "Counting Sheep" Counter.** The user mentioned "counting sheep." Address this. Basic arithmetic is tied to physical manipulation. But higher math? Here, we lean on the idea that higher math extends from the basic logical framework that *must* be reliable for the evolutionary story to hold water. We accept the foundation to tell the story.
      *   **Section 5: The Verdict.** Solidify the position. The EDA stands for morality (specifically robust non-naturalist realism) but stops at logic. This saves the argument from self-destruction without conceding moral realism.
      *   **Conclusion:** Summarize. The "Proves Too Much" objection is a category error.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the "constitutive" argument just a verbal trick?
      *   *Fix:* Need to emphasize *explanatory dependence*. The evolutionary explanation *depends* on the reliability of logic to be coherent. It does not depend on the truth of moral realism.
      *   *Critique:* What about Quinean naturalized epistemology?
      *   *Fix:* Acknowledge that we are naturalizing epistemology, but point out that naturalizing it requires a stable logic to do the naturalizing.
      *   *Tone Check:* Ensure I'm not just repeating Parfit. Focus on the *structure* of the debunking argument itself.
      *   *Verdict:* I will argue for the **Asymmetry**. The "Proves Too Much" objection is a category error. Logic is the *medium* of the argument; morality is the *subject*.

