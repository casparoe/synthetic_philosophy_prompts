prompt: |-
  Been on a bit of a metaethics kick lately and re-read Sharon Street's Darwinian Dilemma paper alongside Yudkowsky's old metaethics sequence, and theres a move that's been bugging me that neither one really deals with head-on. The basic evolutionary debunking argument says our moral beliefs got shaped by natural selection for reproductive fitness, not for tracking mind-independent moral truth, so realists owe us an explanation for why we should trust them anyway (the whole "huge coincidence" bit, if you've read it). But that same story applies just as well to whatever cognitive faculties produce our beliefs about logic and math -- those are products of evolution too, and natural selection didn't select for "correctly represents the Peano axioms," it selected for "doesn't walk off cliffs and can count sheep." So either the debunking argument also nukes math and logic (full-blown global skepticism, including skepticism about the very argument doing the debunking), or there's some principled asymmetry between the moral case and the math/logic case that blocks the generalization.

  Write me an essay that actually engages with this "proves too much" objection to evolutionary debunking arguments specifically -- not a rehash of the general moral realism debate, assume I already know the basic Street setup and the standard "third factor" replies (Wielenberg, Parfit's stuff in On What Matters, etc). Go through the best attempts to draw a principled line between the moral case and the math/logic case, or to just bite the bullet on one side, and actually land on a verdict instead of a wishy washy "reasonable people disagree." Either "yes it generalizes and thats fine because X" or "no, here's the real disanalogy" is an acceptable answer, just defend it properly.
