      *Wait, let's look closer at the "Counting Sheep" point.* The user says natural selection selected for "counting sheep," not Peano axioms. This is the continuity argument. 1+1=2 is useful; ZFC set theory is not.
      *Counter:* Even basic arithmetic is necessary for the *causal structure* of the world to be navigable. If 1+1=3 physically, evolution fails. But if "killing innocents is wrong" is false, evolution might still succeed.
      *Key Distinction:* **Causal Necessity vs. Normative Contingency.** Logic/Math (at the base level) describes the causal structure evolution operates *within*. Morality describes a normative layer evolution operates *alongside* (or ignores).

      *Decision:* I will argue that the "Proves Too Much" objection fails because it ignores the **transcendental necessity** of logic for the evolutionary story to be intelligible, whereas moral truths are not transcendentally necessary for that story.

  8.  **Finalizing the Plan:**
      *   Title: The Transcendental Shield.
      *   Intro: State the dilemma.
      *   Body 1: The Self-Undermining Risk (Plantinga's shadow).
      *   Body 2: The Causal vs. Normative Distinction (The core asymmetry).
      *   Body 3: The "Counting Sheep" Rebuttal (Why basic math counts as logic here).
      *   Conclusion: The EDA survives, but only as a local skeptic, not a global one.

      *(Wait, one more check)*: The prompt asks me to "land on a verdict." I need to be bold. "The objection fails."

      Let's write.

      *(Post-Drafting Review)*: Make sure I don't sound like I'm dismissing the math problem too easily. Acknowledge that *advanced* math might be vulnerable, but *core* logic is not. This nuance strengthens the verdict.

      Okay, ready to generate.cs
answer: |-
  # The Transcendental Shield: Why Evolutionary Debunking Stops at Logic

  The evolutionary debunking argument (EDA) is the metaethical grenade of the last two decades. Sharon Street's formulation is the pin: if our moral faculties were shaped by natural selection for reproductive fitness rather than truth-tracking, and if moral realism posits mind-independent truths, then the alignment between our beliefs and those truths is a cosmic coincidence. Since we should not believe in cosmic coincidences, we should reject moral realism.

  But as you've noted, there is a shrapnel risk. The "Proves Too Much" objection suggests that if evolution undermines morality, it undermines everything. Our capacity for logic, mathematics, and even the causal reasoning required to understand evolution itself is a product of the same blind process. Natural selection did not select for the Law of Non-Contradiction or the Peano axioms; it selected for organisms that don't walk off cliffs. If the EDA nukes moral realism, it seems to nuke the rational faculties required to formulate the EDA, resulting in a self-defeating global skepticism.

  Most discussions stall here, retreating into a polite stalemate where realists claim asymmetry and skeptics claim slippery slopes. This is unsatisfactory. To resolve this, we must stop treating the "Proves Too Much" objection as a mere *reductio* and instead analyze the structural relationship between evolutionary explanations and the domains they target.

  The verdict is this: **The "Proves Too Much" objection fails.** There is a principled, structural asymmetry between morality and logic/mathematics. The EDA successfully targets robust moral realism but cannot generalize to core logic and mathematics without rendering the evolutionary narrative itself unintelligible. Logic is not merely another domain of belief subject to debunking; it is the *transcendental precondition* for the debunking story to make sense.

  ### The Shadow of Plantinga

  To understand why the generalization fails, we must first acknowledge why it feels so compelling. The objection draws strength from Alvin Plantinga's Evolutionary Argument Against Naturalism (EAAN). Plantinga argued that if naturalism and evolution are true, the probability that our cognitive faculties are reliable is low or inscrutable, because evolution cares about survival, not truth. If you accept the EDA against morality, you seem committed to Plantinga's conclusion against naturalism itself.

  If the EDA generalizes fully, we end up in a pragmatic paradox. We use logical inference to derive the conclusion that logical inference is unreliable. This isn't just skepticism; it's cognitive suicide. A theory that undermines the very reasoning used to support it is not merely controversial; it is incoherent. Therefore, if the EDA is to be a viable philosophical argument, it *must* stop somewhere. The burden is on the defender of the EDA to show *where* the brake is applied and why it holds.

  ### The Causal vs. Normative Distinction

  The brake lies in the distinction between **causal constitutivity** and **normative independence**.

  Consider the evolutionary story itself. It is a causal narrative. It posits that certain genetic mutations led to certain behaviors which led to differential reproductive success in a specific environment. This narrative relies fundamentally on causal relations: *If* the organism detects the predator, *then* it flees; *if* it flees, *then* it survives. These "if-then" structures are instantiations of logical implication and causal necessity.

  For the evolutionary explanation to be *true* (or even coherent), the logical structure of the world must align with the logical structure of our reasoning. If the Law of Non-Contradiction were false—if an organism could both flee and not flee in the same respect at the same time—the causal chain of evolution breaks down. Evolution operates *within* the laws of logic and the basic structure of arithmetic (one organism plus one organism equals two). Logic and basic math are not external targets that evolution happened to hit; they are the framework *within which* evolution operates.

  Morality, on the robust realist view, is different. Moral truths are posited as normative facts that stand outside the causal order. "Suffering is bad" is not a causal law like "fire burns." It is a normative claim about how one *ought* to regard suffering. Evolution could have produced creatures that thrived by maximizing suffering, or by being indifferent to it, without violating any laws of physics or logic. The link between "fitness" and "moral truth" is contingent. The link between "fitness" and "logical consistency" is constitutive.

  This is the asymmetry. To doubt morality is to doubt a specific map of the normative terrain. To doubt logic is to doubt the possibility of mapping anything at all, including the evolutionary terrain.

  ### The "Counting Sheep" Counter

  The sharpest version of the "Proves Too Much" objection, which you alluded to, focuses on the continuity of cognitive faculties. As you put it, selection didn't pick for Peano axioms; it picked for "counting sheep." Why trust our belief in infinite sets or abstract logic if we only evolved to track medium-sized dry goods?

  This objection conflates the *origin* of a faculty with the *validation* of its output. It is true that we evolved to count sheep. But the reliability of "1 + 1 = 2" in the sheep-counting context is verified by the causal success of the action. If I think I have two sheep but I only have one, I fail to navigate the causal world. The truth of basic arithmetic is empirically anchored in the physical consistency of objects.

  The EDA against morality works precisely because moral realism posits truths that are *not* empirically anchored in this way. A moral realist claims "torture is wrong" is true even if evolution selected for torturers. There is no causal feedback loop that corrects the moral belief. With basic math and logic, there *is* a feedback loop. If your logic is bad, you walk off the cliff. The "fitness" of logical belief is internally connected to its truth in a way that moral fitness is not.

  Does this save advanced mathematics (e.g., transfinite set theory)? Perhaps not. One could argue that our beliefs about large cardinals are evolutionarily unmoored and thus vulnerable to debunking. But this concession does not save the moral realist. The moral realist needs *all* moral truths to be tracked, including the basic ones ("pain is bad"), to avoid the coincidence charge. The logician only needs *core* logic to be reliable to formulate the argument. The EDA requires global reliability to function; the defense of logic requires only local reliability to survive. The asymmetry holds.

  ### The Verdict: Transcendental Necessity

  We must therefore reject the generalization. The "Proves Too Much" objection commits a category error by treating logic as a substantive domain comparable to morality. It is not. Logic is the medium of discourse, not a subject within it.

  This leads to a specific verdict on the metaethical debate: **Evolutionary Debunking Arguments succeed against robust, non-naturalist moral realism, but they do not generalize to logic or mathematics.**

  Why is this the only stable position? Because the alternative is silence. If you accept the generalization, you cannot coherently assert the EDA. You are left with a global skepticism that consumes its own tail. If you reject the generalization, you must identify the asymmetry. The asymmetry identified above—that logic is causally constitutive of the evolutionary story while morality is normatively independent—is the only one that doesn't beg the question.

  This does not mean moral realism is impossible. It means the *robust* version that posits mind-independent truths entirely disconnected from our evaluative attitudes is untenable in light of evolution. A moral realist can survive only by adopting a "third factor" or sensitivity account (like Wielenberg or Parfit), arguing that the same features that make us fit also make us moral (e.g., rationality). But they cannot use the "math is also evolved" defense to shield themselves. Math is evolved, yes, but its truth conditions are bound up in the causal structure that evolution inhabits. Moral truth conditions, on the realist view, are not.

  ### Conclusion

  The "Proves Too Much" objection is a powerful rhetorical device, but it collapses under metaphysical scrutiny. It assumes that all cognitive domains are equally distant from the causal mechanisms of evolution. They are not. Logic and basic mathematics are the scaffolding of those mechanisms; morality, on the realist view, is a decoration hanging on the outside.

  We can trust our logical faculties not because evolution guaranteed them in a vacuum, but because the very story of evolution presupposes their reliability. We cannot trust our moral faculties in the same way, because the story of evolution does not presuppose moral truth. The EDA remains a lethal weapon against non-naturalist moral realism, precisely because it does not prove too much. It proves just enough to force a choice: revise your metaethics, or lose your mind. The rational choice is to revise the metaethics.
