      *   *Correction:* In the prompt, it says "a role demanding impartial enforcement colliding with a role demanding partiality toward kin." And "stepping outside a role rather than corrupting it."
      *   Let's make the protagonist the **Head Arbiter** (Shun/Gaoyao hybrid for simplicity in a short story, or just the Authority Figure). If she is the one who must order the arrest, she is both Shun (authority) and Gaoyao (enforcer).
      *   **Kin:** Her father, Kael. Old school, stubborn.
      *   **Crime:** Tampering with the air scrubbers to save power for a hidden group? Or something more visceral. Let's say he bypassed safety protocols to save a failing sector, but it risked the whole station. Manslaughter/Negligence.
      *   **Setting:** The *Aethelgard*, a generation ship or orbital ring. Let's go with an orbital ring called "The Circlet."

  5.  **Plot Outline:**
      *   **Introduction:** Establish Elara's role (High Warden) and the strictness of the Law (The Balance). Establish the relationship with her father (respectful but strained).
      *   **Inciting Incident:** The discovery of the crime. Kael bypassed the filters. People died or were endangered.
      *   **Rising Action:** The investigation. Elara confirms it was him. Her subordinates expect her to commute the sentence or hide it. She refuses to corrupt the law.
      *   **Climax:** The arrest. Elara authorizes it. She does not interfere. But then she makes her choice.
      *   **Falling Action:** She removes her insignia. She prepares to leave with him (into exile/prison/outside?). In the Mencius story, they flee to the seaside. Here, maybe they exile themselves to the "Dead Zone" or a lower caste sector.
      *   **Resolution:** She is no longer the Warden. She is just a daughter. The law stands, but she is no longer part of it.

  6.  **Drafting - Focus on Tone and Word Count:**
      *   Need to ensure the philosophical weight lands. It shouldn't feel like "I quit because I'm sad." It should feel like "I am shedding this skin because it no longer fits the person I must be."
      *   Word count check: 1,200-1,500 is tight. Need efficient prose.
      *   *Self-Correction on Mencius Detail:* In the original, Shun doesn't arrest the father himself; Gaoyao does. Shun *could* stop Gaoyao but doesn't. Then Shun leaves. To make this clear in a short story, Elara should have the power to stop it, but chooses not to, then chooses to leave.
      *   *Setting tweak:* Let's make it a subterranean city. "The Deep." Water management is key.

  7.  **Writing - Section by Section:**
      *   *Scene 1:* The Office. The report is on the desk. The father's name.
      *   *Scene 2:* The Confrontation/Understanding. Not an emotional scream, but a recognition of duty.
      *   *Scene 3:* The Execution of Law. She signs the warrant.
      *   *Scene 4:* The Abdication. She removes the badge.
      *   *Scene 5:* The Departure. Walking away with him (or to him).

      *Wait, in Mencius, Shun flees *with* the father.* "Living out his days content." This implies they are together in exile. If the father is arrested, how are they together?
      *Interpretation:* In the classic text, Shun abandons the throne to *carry his father on his back* and flee. This implies preventing the punishment or escaping *before* the punishment is finalized, OR the punishment is death/exile and he joins him.
      *Refinement for Story:* The law demands exile/imprisonment. She ensures the law is pronounced, but she joins him in that state, relinquishing her power to protect him within it. Or, she allows the arrest process to begin, but then breaks him out? No, that corrupts the law.
      *Better interpretation of the prompt:* "Stepping outside a role rather than corrupting it."
      *Idea:* She authorizes the arrest. But before they take him, she resigns. Then she accompanies him into custody/exile as a civilian, sharing his fate, rather than staying behind as the Warden. She doesn't stop the law, she removes herself from the position that conflicts with being a daughter.
      *Actually, the Mencius quote says "flee into hiding with his father on his back."* This suggests avoiding the punishment entirely. But the prompt says "minister of justice... must simply arrest him... Shun could not invoke his imperial authority to stop this."
      *Okay, the tension is:* The law must run its course (Gaoyao acts). Shun cannot stop Gaoyao (Law is valid). But Shun cannot be the Emperor who imprisons his father (Role conflict). So Shun stops being Emperor.
      *Story Adaptation:* Elara allows the arrest warrant to be issued (Law stands). She does not use her power to quash it. But she cannot remain the Head Warden who presides over a system that cages her father. So she resigns *before* the cuffs go on, or she joins him.
      *Let's go with:* She signs the warrant. She steps down. Then she enters the cell with him. She becomes a prisoner by choice, or an exile by choice.
      *Actually, to match "flee into hiding":* Maybe the punishment is exile to the surface (deadly). She lets the sentence be passed, then resigns to go with him.
      *Let's try to capture the "abandoning the throne as a worn-out sandal" vibe.* It needs to feel light, inevitable.

      *Revised Plot:*
      1.  Elara (Overseer) finds evidence her father (Kael) diverted water, causing a collapse.
      2.  Subordinate asks for orders.
      3.  Elara confirms the law: Exile to the Surface.
