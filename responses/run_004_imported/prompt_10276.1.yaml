  8.  **Drafting - Attention to Word Count:**
      *   Keep descriptions tight.
      *   Focus on the symbolism of the insignia/uniform.
      *   Dialogue should be sparse but heavy.

  9.  **Refining the Philosophy:**
      *   Make sure it doesn't sound like "Love wins over Law." It sounds like "I am defined by my relationships. When relationships conflict, I must choose which self survives. I choose the daughter, not the Overseer."
      *   The Law isn't wrong. The Father isn't "right." The *position* is the problem.

