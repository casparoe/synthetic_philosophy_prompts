answer: |-
  The seal of the Overseer sat on the desk, a heavy disc of polished obsidian etched with the gridlines of the Spire. To hold it was to hold the water, the air, and the gravity of the entire vertical city. To Elara, it felt suddenly like a stone tied to a drowning man's neck.

  Across from her stood Joren, her Chief of Compliance. He held a datapad, his face carefully neutral. In the Spire, neutrality was the highest virtue. The Law was not a tool; it was the physics of society. Break the laws of physics, you die. Break the laws of the Spire, you are removed.

  "The evidence is verified, Overseer," Joren said. His voice was flat, devoid of accusation. "Valve 44 was manually overridden. The pressure surge collapsed Sector 7. Twelve casualties."

  Elara did not look at the pad. She looked at the name flagged in the system log. *Kael.* Her father.

  "Did he know the risk?" Elara asked.

  "He knew the code, Overseer. He taught it to me."

  Kael had overridden the valve to save the hydroponics in the lower depths. A localized drought was starving his neighbors. He had chosen the many below over the few in the middle. It was a calculation of utility, cold and logical. But in the Spire, utility without authorization was chaos. Chaos meant death.

  "If I commute the sentence," Elara said, testing the air, "the precedent breaks. The grid relies on trust."

  "If you enforce it," Joren replied, "you enforce it upon your own kin. The psychological strain on the Office is... noted."

  Joren was giving her an out. He was suggesting she recuse herself, hand the seal to a deputy, and let the machine grind on without her direct signature. It was the liberal solution: separate the private self from the public office. Keep the self intact, let the office do the dirty work.

  But Elara knew the older truth, the one written into the bones of the Spire's founding. There was no private self. She was not a woman who happened to be Overseer. She *was* the Overseer. Her identity was constituted by the relationship to the citizens she protected. Just as she was constituted by the relationship to the father who raised her.

  These two relationships were now screaming for opposite actions. To be the perfect Overseer was to be the imperfect daughter. To be the perfect daughter was to be the corrupt Overseer.

  "Call him in," Elara said.

  Kael entered slowly. He was old, his skin pale from generations under artificial light. He wore the grey tunic of a maintenance technician. He looked at the obsidian seal, then at his daughter. He did not look afraid. He looked resigned.

  "Elara," he said.

  "Father."

  "They found the override," Kael stated. It wasn't a question.

  "Twelve dead in Sector 7."

  "I saved three hundred in the Depths," Kael said. "The math was sound."

  "The Law is not math," Elara said. "It is the promise that no one decides who lives but the Spire itself."

  Kael nodded. He understood. He had taught her that. "Then you know what must happen."

  Joren stepped forward. "The sentence is Exile to the Dust. Transport departs at 0600."

  The Dust was the surface. Unshielded. Unbreathable. A death sentence, but one that preserved the sanctity of the Law. The Overseer casts out the criminal. Order is maintained.

  Elara looked at Joren. "Prepare the warrant."

  Joren blinked. "Overseer?"

  "Prepare the warrant," Elara repeated. "My father is guilty. The Law demands exile."

  She picked up the obsidian seal. It was cold. She pressed it onto the digital interface. The red light of authorization turned green. The system accepted the judgment. The Law was satisfied. The role of Overseer had been fulfilled impartially.

  Joren exhaled, a sound of relief. The system had held. "I will have the guards escort him to holding."

  "No," Elara said.

  She stood up. She began to unclasp the heavy cloak of office, the black fabric weighted with lead threads to keep it hanging perfectly straight. She shrugged it off. It fell onto the desk with a heavy thud, covering the obsidian seal.

  "Overseer?" Joren asked, confusion cracking his neutrality.

  Elara stepped out from behind the desk. She was wearing a simple white tunic underneath. She felt lighter, unmoored. The authority of the room no longer clung to her. She was no longer the node in the grid. She was just Kael's daughter.

  "The warrant is signed," Elara said. "The Law is intact. You will do your duty, Joren. You will escort the prisoner to the surface."

  "And you?"

  "I am no longer the Overseer."

  "You cannot resign during a crisis," Joren snapped, panic rising. "The succession protocol takes weeks."

  "Then act as interim," Elara said calmly. "The Law does not require me. It requires the Office. The Office remains."

  She walked around the desk to stand beside her father. She took his arm. His muscles were thin, brittle.

  "Elara," Kael said, his voice trembling for the first time. "The Dust... you cannot survive there. You are the Overseer."

  "I was," she corrected. "Now I am just a daughter. The Overseer exiled the criminal. But no law forbids a daughter from walking with her father."

  "That is suicide," Joren said. "It serves no function. It fixes nothing."

  "It fixes me," Elara said.

  She looked at Joren. She saw the conflict in his eyes. He wanted to stop her. He wanted to invoke emergency powers to detain her, to force her back into the role that kept the Spire running. But to do so would be to admit that the person mattered more than the role. It would be to validate the very corruption they feared. If he stopped her, he would be acknowledging that Elara the Individual was too valuable to lose. But the Spire did not run on individuals. It ran on relationships.

  If she was no longer the Overseer, he had no authority over her. She was a civilian choosing to accompany an exile.

  "Prepare the transport," Elara ordered, her voice now carrying the weight of a civilian request, not a command.

  Joren stood frozen. He looked at the cloak on the desk, then at the woman who had worn it. He understood the trap. If he forced her to stay, he corrupted the impartiality of the Office by claiming ownership of her person. If he let her go, the Spire lost its head, but the Law remained pure.

  She was discarding the throne as lightly as a worn-out sandal.

  "Interim Overseer Joren," Elara said formally. "I am vacating the position. I am accompanying the prisoner."

  Joren swallowed. He straightened his spine. He would have to bear the weight now. "Understood. Transport will be ready in one hour."

  Elara turned to her father. She didn't cry. Grief was for those who believed they had a choice. She had only followed the shape of her duties to their logical conclusion. She could not be the judge who kills her father. So she ceased to be the judge.

  "Can you walk?" she asked him.

  "I can walk," Kael said.

  "Then let us go."

  They walked out of the office, past the guards who stood at attention, unsure whether to salute the woman who had been their god an hour ago. Elara ignored them. She focused on the pressure of her father's arm against hers. That was the only reality that remained. The gridlines of the Spire, the water levels, the air pressure—those were the concerns of the cloak left on the desk.

  As they reached the airlock leading to the surface transport, the wind howled from outside, a dry, dead sound. The Dust waited.

  Joren caught up to them at the threshold. He held a small device—the remote override for the airlock. He could lock them in. He could save the Spire.

  "Elara," Joren said. "Think of the stability."

  "The stability is in the Law, Joren. Not in me," she said. "You have the warrant. You have the prisoner. You have the Office. What more do you need?"

  "I need you to be who you are."

  "I am," she said. "I am my father's daughter. The rest was just a job."

  She stepped into the airlock. Kael followed. The door hissed shut, sealing them off from the recycled air, the lights, the order. Joren stood on the other side of the glass, holding the future of the Spire in his hands, watching the past walk away into the dust.

  Elara did not look back. There was nothing to look at. The Overseer was dead. Only the daughter remained, and she had work to do.
