  1.  **Analyze the Request:**
      *   **Topic:** Confucian role ethics (identity/duties constituted by relationships vs. abstract rights/self).
      *   **Core Conflict:** The "Shun's Father" dilemma from the *Mencius*. One role demands impartial enforcement (Justice/State), another demands partiality toward kin (Filial Piety/Family).
      *   **Resolution:** The protagonist doesn't corrupt the impartial role (doesn't stop the arrest) but abandons the role entirely to fulfill the familial role (flees with the father).
      *   **Constraints:**
          *   Original short story (no retelling of Shun).
          *   Own characters and setting.
          *   Word count: 1,200 - 1,500 words.
          *   Tone: Dramatize the structural bind, make the resolution feel earned.

  2.  **Deconstruct the Philosophical Bind:**
      *   Role A (Public/Impartial): Judge, Officer, Guardian, Captain. Must uphold the law/code.
      *   Role B (Private/Partial): Son, Daughter, Sibling. Must protect/honor kin.
      *   The Conflict: Kin breaks the law/code.
      *   The Solution: Allow Role A to function (arrest happens), but vacate Role A's identity (resign/flee) to prioritize Role B.
      *   Key Nuance: It's not "justice vs. love" in a Western liberal sense (rights violation). It's "which relationship constitutes me *now*?" The protagonist chooses to constitute themselves through the family relationship, even at the cost of the public role.

  3.  **Brainstorming Settings:**
      *   *Sci-Fi:* A ship captain and a crewmember who is also their child. Mutiny or sabotage.
      *   *Fantasy:* A magic guild enforcer and their apprentice sibling.
      *   *Historical/Industrial:* A factory foreman and a worker brother. Safety violation causing death.
      *   *Dystopian:* A compliance officer and a parent hiding contraband.
      *   *Selection:* A dystopian/industrial setting feels weighty. Let's go with a sealed environment where rules are survival. A deep-sea mining colony or a space station. Let's choose a **orbital habitat** where air/recycling laws are absolute.

  4.  **Character Development:**
