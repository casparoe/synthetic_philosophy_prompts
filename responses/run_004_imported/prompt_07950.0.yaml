          *   Address the "Multiple Counterparts" complication here. It shows CT handles vagueness well but creates logical headaches (contingent identity).
      *   *Section 2: The Accidental Intrinsics Argument & TWI's Defense.*
          *   Explain the argument (Bent vs. Straight).
          *   Lewis's rejection of "world-indexed properties" (they aren't intrinsic).
          *   TWI Defense 1: Adverbialism (instantiation is relative).
          *   TWI Defense 2: Abstractism (Plantinga). $x$ isn't *in* the world concretely. This is crucial. Lewis attacks "Literal Presence." Most Kripkeans are Abstractists.
      *   *Section 3: Comparative Evaluation (The Verdict).*
