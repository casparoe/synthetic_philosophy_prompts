  2.  **Deconstruct the Two Approaches:**

      *   **Impossible Worlds:**
          *   *Mechanism:* Expand the semantic space to include worlds where logical laws (like $A \land \neg A$ is false, or $A \to (A \lor B)$ fails) don't hold.
          *   *Philosophical Implication:* It treats logical ignorance as a failure of *access* to certain worlds. The agent considers an impossible world possible.
          *   *Pros:* Captures the phenomenology of making mistakes. Allows for hyperintensionality (distinguishing between logically equivalent propositions).
