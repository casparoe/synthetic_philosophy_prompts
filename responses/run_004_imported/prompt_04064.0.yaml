prompt: |-
  Years ago I read Godel Escher Bach like every other CS major and loved it, and a while back I went down a rabbit hole into more Hofstadter and found this other essay collection of his, Metamagical Themas, where he lays out the idea of "superrationality." The bit that hooked me is apparently based on a real experiment he ran in the 80s: he sent a telegram to twenty of his friends and colleagues inviting them into a one-shot, multiplayer prisoner's dilemma with actual money on the line, and his whole argument was that truly rational people (the "superrational" ones) should cooperate, because if everyone's reasoning from the same premises, everyone lands on the same answer, so you might as well pick whichever answer is best assuming everyone picks it too -- which means cooperating instead of defecting.

  I brought this up with an old coworker whos way deeper into the LessWrong/rationalist stuff than I am, and we got into a whole back-and-forth about whether this is an actually sound rational argument or just a nice-sounding way to smuggle in an assumption that begs the question. His take is that its legit, and basically the same move underlying one-boxing on Newcomb's problem. My gut says standard game theory has it right, that defecting still dominates in a genuinely one-shot game against a stranger, and "we think alike so we'll choose alike" is sneaking something past us.

  Could you write me an essay that actually settles this instead of just listing pros and cons on each side? Steelman both positions properly -- I think it turns on the causal-vs-evidential decision theory split somehow, and also on whether the other player has to be a literal copy of you versus just "similarly rational," though I'm not sure how much that second thing even matters -- and then commit to a real verdict on when, if ever, superrational cooperation is genuinely rational rather than just psychologically comforting. Bonus points if you can tie it back to Newcomb's problem properly, since I can tell they're related but couldn't explain how myself.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Topic:** Hofstadter's "Superrationality" vs. Standard Game Theory (Nash Equilibrium) in the context of the Prisoner's Dilemma (PD).
      *   **Context:** The user read *GEB*, discovered *Metamagical Themas*, discussed it with a LessWrong-oriented coworker.
      *   **Core Conflict:** Is superrationality sound rationality (like one-boxing in Newcomb's) or question-begging magic thinking?
      *   **Requirements:**
          *   Write an essay (not just a list of pros/cons).
          *   Steelman both positions (Standard Game Theory/Causal Decision Theory vs. Superrationality/Evidential Decision Theory).
          *   Address the "copy vs. similar" distinction.
          *   Connect explicitly to Newcomb's Problem.
          *   **Crucial:** Commit to a real verdict on when/if superrational cooperation is genuinely rational.
      *   **Tone:** Intellectual, engaging, nuanced, but decisive.

  2.  **Deconstruct the Arguments:**

      *   **Standard Game Theory (Causal Decision Theory - CDT):**
          *   Premise: My choice cannot *cause* the other player's choice in a one-shot, sealed game.
          *   Logic: Regardless of what the other does, I get a higher payoff by defecting. (Dominance principle).
          *   Verdict: Defect.
          *   Weakness: Leads to Pareto-inferior outcomes (everyone defects).

      *   **Superrationality (Evidential Decision Theory - EDT / Functional Decision Theory - FDT):**
          *   Premise: We are rational agents facing the same problem. Our reasoning processes are isomorphic.
          *   Logic: My choice is *evidence* of their choice. If I cooperate, it's highly probable they cooperate. I should choose the outcome (C,C) over (D,D).
          *   Verdict: Cooperate.
          *   Weakness: Assumes a correlation that might not exist (magical thinking?). What if they are CDT agents?

      *   **The Newcomb Connection:**
          *   Newcomb's Problem involves a Predictor.
          *   One-boxing = Cooperating with the Predictor (trusting the correlation).
          *   Two-boxing = Defecting (causal dominance).
          *   Superrational PD is essentially a multi-agent Newcomb problem where the players predict each other.

      *   **The "Copy vs. Similar" Distinction:**
          *   If the opponent is a *perfect* copy, FDT/EDT says cooperate.
          *   If the opponent is just "another rational person," is the correlation strong enough? Hofstadter argued yes for "rationalists." LessWrong argues it depends on the *algorithm*, not the biology.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy. Something about mirrors, reason, and dilemmas. *The Mirror of Reason: Settling the Score on Superrationality.*
      *   **Introduction:** Hook with the *Metamagical Themas* experiment. State the tension: Dominance vs. Symmetry. Mention the coworker (LessWrong) vs. Gut (Standard Game Theory).
      *   **The Standard Case (CDT):** Explain why defecting is the "textbook" answer. The causal wall. My button press doesn't move their hand. This is the "Safe" bet.
      *   **The Superrational Case (EDT/FDT):** Explain Hofstadter's logic. The symmetry of reason. If I solve for X, and you solve for X, we get the same X. Connect to Newcomb's (The Predictor is replaced by the Other Player).
      *   **The Crux: Correlation vs. Causation:** This is the philosophical meat. CDT says correlation doesn't matter if there's no causal link. EDT/FDT says you should act *as if* your decision sets the policy for all similar agents.
      *   **The "Similarity" Threshold:** Address the user's specific point. Does it require a clone? No, it requires *logical correlation*. If I know you run "Rationality.exe v1.0" and I run "Rationality.exe v1.0", our outputs correlate.
      *   **The Verdict:** I need to commit.
          *   *Decision:* Superrationality is rational *conditional on common knowledge of decision algorithm*. It fails against standard CDT agents. It succeeds against FDT/EDT agents or copies.
          *   *Nuance:* In the real world (Hofstadter's experiment), people aren't identical algorithms. So CDT is safer *empirically*, but FDT is superior *normatively* among a specific class of agents.
          *   *Wait, I need to be stronger.* The prompt asks to settle it. The modern consensus (in the rationalist community the user mentioned) leans towards FDT. But standard economics leans CDT.
          *   *My Verdict:* Superrationality is not magic; it is the correct application of decision theory *when logical correlation exists*. However, in the real world, assuming logical correlation with strangers is often an error. So: It is rational *in principle* (Newcomb-style), but often irrational *in practice* (against unknown strangers).
          *   *Refinement:* Let's align with the LessWrong/FDT view since the user mentioned that context. The "verdict" should be that CDT is actually the limited theory, and Superrationality (FDT) is the more robust framework, *provided* the similarity condition is met.

  4.  **Refining the Newcomb Connection:**
      *   Make sure to explain *why* they are the same.
      *   Newcomb: Omega predicts you.
      *   PD: You predict Opponent (because Opponent = You logically).
      *   One-boxing = Cooperating. Two-boxing = Defecting.

  5.  **Writing - Tone Check:**
      *   Avoid being too dry. Use the "telegram" story.
      *   Acknowledge the user's gut feeling (it's the standard view for a reason).
      *   Validate the coworker (they aren't crazy).
      *   Ensure the "Verdict" is clear at the end.

  6.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe say Superrationality is wrong because people aren't copies.
      *   *Correction:* No, that misses the point of FDT. FDT says you decide for the *algorithm*, not the instance. I need to explain *logical subjunctive dependence*.
      *   *Check:* Did I address the "begging the question" charge? Yes, by distinguishing between assuming the *outcome* (begging) vs. assuming the *process* (logical correlation).
      *   *Check:* Did I commit? Yes, I will argue that Superrationality is the superior decision theory *conceptually*, but requires a high bar for similarity to be *practically* applicable.

  7.  **Final Polish:**
      *   Check flow and transitions.
      *   Ensure the distinction between Evidential (EDT) and Functional (FDT) is clear but not bogged down in jargon. (FDT is the modern evolution of Hofstadter's idea).
      *   Make the conclusion punchy.

  **(Self-Correction on the Verdict):** I need to be careful not to just say "LessWrong is right." I need to explain *why* the standard view feels right but might be incomplete. The verdict should be: Superrationality is rational *if and only if* you have reason to believe your decision is logically correlated with the other's. In Hofstadter's experiment, that assumption was shaky. In a clone scenario, it's mandatory.

  Let's structure the verdict:
  1.  Theoretically: Superrationality (FDT) dominates CDT.
  2.  Practically: It requires "logical correlation."
  3.  Hofstadter's specific experiment: Probably irrational to cooperate there (strangers != copies).
  4.  General Principle: Cooperate when you recognize a kindred decision algorithm.

  Okay, ready to write.

  *(Wait, one more thing)*: The prompt asks to "commit to a real verdict on when, if ever, superrational cooperation is genuinely rational."
  Okay, I will argue: It is genuinely rational when the agents share a **logical substrate** (same code, same training, same culture of rationality) such that your decision *logically determines* theirs, even without causal contact. It is irrational when facing a "black box" agent (standard stranger).

  Let's go.cw
answer: |-
  # The Mirror of Reason: Settling the Score on Superrationality

  In the early 1980s, Douglas Hofstadter, fresh off the acclaim of *Gödel, Escher, Bach*, sent a telegram to twenty acquaintances. It was an invitation to a game. The rules were simple: send back a choice of C (Cooperate) or D (Defect). If everyone cooperated, everyone got a handsome sum. If everyone defected, everyone got a pittance. If you defected while others cooperated, you got the most of all. But there was a catch: it was a one-shot game. No communication. No reputation to build. No retaliation possible.

  Hofstadter's pitch wasn't just about the money; it was a test of "superrationality." His argument was elegant: if we are all rational, we will all reason the same way. Therefore, my choice is a proxy for yours. If I defect, I reason that you will defect. If I cooperate, I reason that you will cooperate. Since (Cooperate, Cooperate) is better than (Defect, Defect), a truly rational agent must cooperate.

  The results were mixed. Some cooperated, citing Hofstadter's logic. Others defected, citing standard game theory. Decades later, you and your coworker are fighting the same battle. Your gut, trained on standard economics and classical game theory, says defecting is the only sane move. Your coworker, steeped in the modern rationalist tradition (LessWrong, MIRI), says cooperating is the move of a superior decision theory, akin to one-boxing in Newcomb's Problem.

  Who is right? Is superrationality a profound insight into the nature of reason, or is it a sophisticated way of begging the question? To settle this, we must move beyond the surface-level debate of "greed vs. altruism" and look at the machinery of decision theory itself.

  ### The Causal Wall: Why Standard Game Theory Says Defect

  Your gut feeling is backed by the dominant framework of the 20th century: Causal Decision Theory (CDT). CDT relies on a strict interpretation of causality. In a one-shot Prisoner's Dilemma, there is a causal wall between you and the other player. You are in separate rooms. Your finger pressing the "Cooperate" button does not send a signal to their room. It does not physically force their hand.

  Under CDT, you analyze the world as it is *given* the other player's action.
  *   **Scenario A:** They Cooperate. If you Cooperate, you get $300. If you Defect, you get $500. You should Defect.
  *   **Scenario B:** They Defect. If you Cooperate, you get $0. If you Defect, you get $100. You should Defect.

  Since Defecting yields a higher payoff in *both* scenarios, it is a "strictly dominant strategy." To choose Cooperate is to wish the world were different than it is. It is to say, "I will press this button, and magically, their button will change." To a CDT proponent, this looks like magic thinking. It assumes your choice *causes* theirs, violating the physical setup of the game. From this vantage point, Hofstadter is smuggling in a premise: he assumes the correlation of outcomes without a causal mechanism to support it.

  ### The Logical Mirror: Why Superrationality Says Cooperate

  Your coworker's perspective comes from a newer lineage, often associated with Evidential Decision Theory (EDT) and its modern successor, Functional Decision Theory (FDT). This view challenges the idea that "causation" is the only thing that matters. Instead, it focuses on *logical correlation*.

  Hofstadter's insight was not that your button press physically moves theirs. It is that you and the other player are running the same "reasoning algorithm." You are both rational agents facing the same puzzle. If the puzzle has a single correct solution, then two perfect reasoners must arrive at that same solution.

  Think of it like a math problem. If I ask you and a stranger to calculate the 10,000th digit of Pi, you will both return the same number. Not because you communicated, but because the math forces the answer. Superrationality treats the Prisoner's Dilemma as a math problem where the variables are "rational agents."

  If I decide to Defect, I am effectively running the algorithm "Defect." If my opponent is also running "Defect" (because they are rational like me), we both Defect. If I decide to Cooperate, I am running the algorithm "Cooperate." If my opponent is running the same logic, we both Cooperate. I cannot choose "I Defect, They Cooperate" because that implies we are running *different* algorithms, which contradicts the premise of superrationality.

  Therefore, the choice is not between (C,D) and (D,D). The choice is between the universe where everyone runs "Cooperate" and the universe where everyone runs "Defect." Since the former is richer, you should Cooperate.

  ### The Newcomb Connection

  This is where your coworker brings in Newcomb's Problem, and rightly so. The structural identity is exact.

  In Newcomb's Problem, a Predictor (Omega) puts $1 million in a box if they predict you will take only that box (One-Box). If they predict you will take both boxes (Two-Box), the opaque box is empty.
  *   **The CDT View:** The money is already in the box or it isn't. My choice now cannot change the past. I should take both boxes to maximize what I get. (Two-Boxing).
  *   **The FDT/Superrational View:** My choice is logically correlated with Omega's prediction. Omega simulates my decision process. If I am the type of agent who Two-Boxes, Omega predicted that and left the box empty. If I am the type who One-Boxes, Omega filled it. I should choose to be the type that gets $1 million. (One-Boxing).

  In the Prisoner's Dilemma, *the other player is Omega.* You are predicting each other. When you cooperate, you are essentially "One-Boxing"—you are signaling that you are the type of agent whose decision logic outputs Cooperation when facing a mirror. When you defect, you are "Two-Boxing," grabbing the local dominance at the cost of the logical correlation.

  The charge of "begging the question" holds only if you assume the other player is a black box unrelated to you. But if the other player is a logical mirror, refusing to cooperate is like refusing to One-Box because "the money is already there." It misses the point that *your decision procedure* is what put the money there.

  ### The Verdict: When is Superrationality Real?

  So, who wins? Is your gut right, or is your coworker?

  The verdict requires splitting the question into **Normative Rationality** (what is the ideal decision theory?) and **Empirical Rationality** (what should you do in the real world?).

  **1. Normatively, Superrationality (FDT) Wins.**
  Standard Game Theory (CDT) is demonstrably limited. It leaves money on the table in Newcomb's Problem, it loses in Parfit's Hitchhiker, and it leads to Pareto-inferior outcomes in Prisoner's Dilemmas against copies. A decision theory that always defects against its own source code is a broken algorithm. If you want a decision theory that wins across a wide range of problems, especially those involving prediction or logical correlation, you must adopt the superrational stance. You must act as though your decision determines the output of all identical algorithms. In this abstract sense, your coworker is right: superrationality is the more robust form of rationality.

  **2. Empirically, Your Gut is Often Safer.**
  However, Hofstadter's experiment was not played against clones. It was played against human colleagues. This brings us to the "Similarity Threshold." Superrationality only works if there is a **logical subjunctive dependence** between you and the opponent.
  *   If you play against a **clone** or a **perfect simulation** of yourself: You *must* cooperate. Defecting is literally irrational here; it guarantees the worst outcome.
  *   If you play against a **known FDT agent** (someone who explicitly believes in superrationality): You should cooperate. Your reasoning is linked.
  *   If you play against a **random stranger** (Hofstadter's actual experiment): You should probably defect.

  Why? Because in the real world, "rationality" is not a single, shared algorithm. Your coworker runs "LessWrong Rationality." A standard economist runs "Neoclassical Rationality." A random person runs "Folk Psychology." These are different algorithms. If you run "Cooperate" and they run "Defect," you get suckered.

  Hofstadter's error was assuming that "rationality" implies a unique fixed point for everyone. It doesn't. It only implies a fixed point for agents running the *same* decision theory. In the absence of common knowledge that *both* parties are superrationalists, the logical link is broken. Without that link, the causal wall stands, and CDT (Defect) is the safe harbor.

  ### The Final Judgment

  Superrationality is not magic, but it is not a universal solvent either. It is a specialized tool for high-correlation environments.

  **The Verdict:** Superrational cooperation is genuinely rational **if and only if** you have sufficient evidence to believe your opponent's decision is logically correlated with yours.
  *   In a world of **transparent agents** (where you can read each other's code or know each other's philosophy), superrationality is the only winning move. To defect there is to fail the test of rationality, just as Two-Boxing fails Newcomb's.
  *   In a world of **opaque strangers** (like Hofstadter's telegram recipients), assuming correlation is a gamble, not a deduction. In that specific context, standard game theory is pragmatically correct because the "mirror" is cracked.

  Your coworker is right about the *theory*: CDT is a subset of a larger, more powerful decision framework where superrationality reigns. But you are right about the *practice*: in the messy real world, assuming you share a brain with a stranger is often just wishful thinking.

  Hofstadter was right to dream of a community where reason binds us together. But until we can verify that our reasoning processes are truly isomorphic, the rational move is to cooperate only when you see your own reflection in the other player's eyes. Otherwise, guard your box.
