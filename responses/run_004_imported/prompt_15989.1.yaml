prompt: |-
  So a few weeks back I fell into a total wikipedia rabbit hole on Jeremy Bentham (the utilitarianism guy, "greatest happiness" and all that, also the dude who had his body preserved and put on display in a cabinet at some college in London lol) and found out something that never came up in any philosophy 101 video i've watched: back in like the 1780s he secretly wrote a whole essay defending homosexuality on strictly utilitarian grounds, basically arguing that the laws against it (which could get you executed at the time) were based on pure disgust and prejudice rather than any actual harm done to anyone. Apparently in his notes he went even further and applied that same "if it doesn't harm anyone its not wrong" logic to stuff people found way more disgusting back then too, like bestiality, just to stay logically consistent with his own principles. But the wild part is he never published any of it in his lifetime - he was way too scared of what it'd do to his reputation and to all his other reform projects, like the prison stuff and the poor laws.

  This has honestly been bugging me since I read it. Like on one hand, ok fair, coming out with that in the 1780s probably would've destroyed him and maybe even gotten him killed, and he did go on to do a ton of genuinely good reform work that might never have happened if he'd been ruined that early. But on the other hand, this is a guy who was NOT shy about pissing off the establishment on basically every other unpopular position he held, and if you actually run his own "greatest happiness" math on it, you could argue he had a duty to publish and take the hit, since it might've sped up getting rid of laws that were ending actual lives over nothing. Kind of feels hypocritical for the founder of "do the most good even when its unpopular" to be the one guy who chickens out right when it's about himself.

  Can you write me a real essay that actually wrestles with this instead of just describing both sides? I want you to weigh the strongest arguments for "he made the right call staying quiet" against "he was being a coward/hypocrite by the standards of his own philosophy," and then actually commit to one answer at the end with your reasoning for it - not some wishy washy "both sides have a point" non-answer.
