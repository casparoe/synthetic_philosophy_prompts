          *   Neither side should look like the obvious loser.
          *   Tone: Sharp, intellectual, friendly but stubborn (like a seminar argument).

  2.  **Deconstruct the Arguments:**

      *   **The Setup:** Urn has 90 balls. 30 Red (R), 60 Black/Yellow (B/Y) unknown split.
      *   **The Preferences:**
          *   $f_R$ (bet on Red) $\succ$ $f_B$ (bet on Black). (Implies $P(R) > P(B)$).
          *   $f_{B \cup Y}$ (bet on Black or Yellow) $\succ$ $f_{R \cup Y}$ (bet on Red or Yellow). (Implies $P(B \cup Y) > P(R \cup Y)$, i.e., $1 - P(R) > 1 - P(B)$, so $P(B) > P(R)$).
          *   Contradiction: $P(R) > P(B)$ and $P(B) > P(R)$.
      *   **The Bayesian (Savage) View:** This is irrational. You must have a prior. If you don't know, use Principle of Indifference ($P(B)=P(Y)=1/3$). Then you should be indifferent. If you prefer R, you must believe B is less likely. Raiffa's point: If you are unsure about B vs Y, flip a coin to choose your bet between them. This creates a 50/50 chance regardless of the urn composition. Thus, ambiguity is reducible to risk.
      *   **The Ambiguity Theorist (Gilboa-Schmeidler) View:** Ambiguity is distinct from risk. People dislike not knowing the probabilities. Maxmin EU models this by evaluating acts based on the worst-case prior in a set. Raiffa's coin flip is a *different act*. It requires commitment. If I can't commit, the coin flip doesn't help. Also, the preference for the coin flip *itself* demonstrates the cost of ambiguity.

      *   **The Crux (Raiffa's Rejoinder):**
          *   *Bayesian:* "Just randomize! If you bet on 'Black if Heads, Yellow if Tails', you win if the ball is B or Y. Since B+Y = 60, your chance is 60/90 = 2/3. This is objective risk. No ambiguity."
          *   *Ambiguity Theorist:* "True, but that requires me to bind myself to the coin. If I can't bind myself, once the coin lands on 'Black', I'm back to facing the ambiguous bet on Black alone, which I dislike."
          *   *Bayesian:* "If you can't bind yourself, your preferences are dynamically inconsistent. That's a defect in *you*, not the theory."
          *   *Ambiguity Theorist:* "Or it shows that the 'act' includes the mechanism of choice. The cost is in the cognitive load of the unknown, not just the payoff distribution."

  3.  **Drafting - Scene Setting:**
