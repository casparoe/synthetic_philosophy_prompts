answer: |-
  The seminar room was empty, the whiteboard still smeared with the tree diagram from lecture. On the table between us sat a glass urn, thirty red balls visible at the bottom, sixty others a murky mix of black and yellow hidden beneath. Alex spun a quarter on the tabletop. It wobbled, caught the light, and fell flat. Heads.

  "You're hiding behind the coin," I said, picking it up. "Raiffa's trick doesn't solve the paradox; it just buys you out of it."

  Alex, ever the Bayesian, leaned back, arms crossed. "It doesn't buy me out. It dissolves the problem. Look, Jordan, you say you prefer betting on Red over Black because you know the odds on Red—one in three—but you don't know the odds on Black. Fine. But if I allow you to flip this coin to decide your bet—Heads you bet on Black, Tails you bet on Yellow—you've just constructed an objective probability."

  "Constructed," I repeated. "Artificial."

  "Mathematically identical," Alex corrected. "Let $b$ be the number of black balls, $y$ be yellow. We know $b + y = 60$. If you bet on Black if Heads, Yellow if Tails, your probability of winning is $\frac{1}{2} \cdot \frac{b}{90} + \frac{1}{2} \cdot \frac{y}{90}$. That simplifies to $\frac{1}{2} \cdot \frac{60}{90}$, which is one in three. Exactly the same as Red. The ambiguity regarding the split between $b$ and $y$ cancels out. The uncertainty is now purely risky, governed by the coin, not the urn. So why pay a premium to avoid the urn? The coin launders the ambiguity away."

  "Because the coin isn't free," I said, dropping the quarter back onto the table. "And 'laundering' implies the dirt was illusory. It wasn't. My aversion is to the *structure* of the bet, not just the final payoff distribution. If I'm willing to pay for the coin, that willingness *is* the measure of my ambiguity aversion. Gilboa and Schmeidler capture that. Savage doesn't."

  "Savage captures it by telling you you're wrong," Alex said, tapping the urn. "If you have a coherent prior, you don't need the coin. If you don't have a prior, the coin gives you one. But here is where your position crumbles: Commitment. Let's say you pay me for the right to flip the coin. You flip. It lands Heads. Now you are holding a ticket that pays out only if the ball is Black."

  I nodded. "I know."

  "But you just told me you hate betting on Black. You prefer Red. You think the Black bet is 'toxic' because the probability is unknown. Now the coin has landed. The randomization is over. You are no longer holding a randomized act; you are holding a bet on Black. Do you tear up the ticket?"

  "That's the dynamic inconsistency objection," I said. "And it's why the ambiguity theorist distinguishes between the *plan* and the *execution*."

  "Right. So, do you tear it up?"

  "If I'm sophisticated, no. Because I anticipated this moment when I bought the coin flip. I valued the coin flip *because* it binds my future self to a mechanism that neutralizes the ambiguity."

  Alex shook their head. "But *why* does it bind you? According to your own preferences, once the coin lands, the ambiguity returns. The coin is in your pocket. The state of the world is now just 'Ball drawn from Urn.' You face the exact same epistemic void you claimed to dislike. If you are rational, and you truly dislike ambiguity, you should reject the bet *ex post*. If you reject it *ex post*, you shouldn't have paid for the coin *ex ante*. You're money-pumping yourself."

  I leaned forward, resting my elbows on the table. "You're assuming that the 'act' is defined solely by the mapping from states of nature to consequences. But for an ambiguity-averse agent, the act includes the *process* by which we arrive at the consequence. The anxiety of not knowing the odds is a cost. When I buy the coin flip, I am buying a contract that says 'We will not look at the urn's composition; we will look at the coin.' That contract changes the state space."

  "That's moving the goalposts," Alex said sharply. "Savage's Sure-Thing Principle says if two acts yield the same outcome in every state, you should be indifferent. If the coin lands Heads, the state is 'Black wins' or 'Black loses.' The coin is history. Consequentialism demands you look only at the payoff matrix remaining. If you care about the path, you're not modeling uncertainty; you're modeling a fetish for randomness."

  "It's not a fetish. It's robustness," I countered. "Think about why we feel the ambiguity in the first place. It's because we suspect our model of the urn might be wrong. Maybe the person filling the urn is an adversary. Maybe the black balls are heavier. When I use the coin, I'm not just mixing probabilities; I'm introducing a source of uncertainty I trust—the coin—against a source I don't—the urn's composition. The Maxmin preference isn't about the math of the payout; it's about the reliability of the information source."

  "So you trust the mint and not the mixer," Alex said. "Fine. But that's an empirical claim about trust, not a normative theory of rationality. If I tell you the urn was filled by a certified random number generator, your ambiguity vanishes. Poof. Now you're a Bayesian again. This proves the ambiguity isn't in the decision problem; it's in your subjective confidence. And subjective confidence should be quantified as a prior. If you can't quantify it, you're not doing decision theory; you're doing psychology."

  "And if the world isn't Bayesian?" I asked. "Savage assumes the world can be partitioned into states that are mutually exclusive and exhaustive, and that you can assign probabilities to them. But in real life, sometimes you don't know the state space. You don't know *what* you don't know. The Ellsberg urn is a toy, but it models situations where the risk is endogenous to the information structure. Maxmin Expected Utility says: 'I have a set of priors. I'll evaluate the act by the worst one.' That's not irrational; that's prudent."

  "Prudence is expensive," Alex shot back. "And Raiffa's point was that it's unnecessarily expensive. If you can randomize, you can replicate any mixture of priors. If you have a set of priors over the Black/Yellow split, say $P(B) \in [0, 2/3]$, the coin flip averages them out. You get the center of the set. Why not just *adopt* the center as your prior? Why carry the whole set around like heavy luggage if you're just going to average them out the moment a coin appears?"

  "Because I can't always flip a coin," I said. "Life doesn't offer randomization devices for every decision. I have to choose a career, a partner, a policy. I can't flip a coin to decide whether to bet on the economy or the climate. I have to face the ambiguous urn directly. If my theory only works when I can introduce external randomness to sanitize my bets, it's a theory for the lab, not the world."

  "But normative theory tells you how you *should* choose, not how you cope when you're weak," Alex insisted. "If the coin flip makes you indifferent, it proves that your preference for Red over Black wasn't about the payoffs. It was about your inability to commit to a belief. The rational agent commits. She picks a prior—maybe 1/3, maybe 1/4—and she sticks to it. She doesn't need a coin to tell her she's allowed to be consistent."

  "And if she picks the wrong prior?" I asked. "If the urn was rigged by an adversary who knows her prior? The Bayesian gets exploited. The Maxmin agent survives. In a game against nature where nature might be hostile, the Sure-Thing Principle is a vulnerability. It assumes the states are fixed independent of your choice. But ambiguity often arises precisely because the states might react to you."

  Alex paused, looking at the urn. The red balls glowed warmly; the black and yellow remained a shadowed mass. "So you're saying ambiguity aversion is a defensive heuristic for adversarial environments."

  "I'm saying it's a recognition that probability isn't always in the head. Sometimes it's in the structure of the information. Raiffa's coin works only if you assume the coin and the urn are independent. But if I doubt the urn, why shouldn't I doubt the independence? The Bayesian assumes the separation of source and event. The ambiguity theorist says: 'I don't know if they're separated.'"

  "That's skepticism, not decision theory," Alex said, though their voice had softened. "If you doubt everything, you can't act."

  "If you assume too much, you get blindsided," I replied. "Look, you want me to commit to the coin flip result. I will. I'll sign a contract. But the fact that I *need* the contract, that I have to pay for the mechanism that forces me to ignore the urn's composition, proves that the ambiguity is real. It has a price. Your theory says the price should be zero. Mine says it's positive. We can test that. I'll bet you on it."

  Alex smiled, finally picking up the coin again. "On the coin flip? Or on the urn?"

  "On the coin flip," I said. "Because that's the only thing we both trust."

  "Then you've conceded," Alex said, thumbing the edge of the quarter. "Because if we both trust the coin, we're both Bayesians about the coin. You've just pushed the ambiguity back one step. Why do you trust the coin?"

  "Because I made it," I said. "I know the mint."

  "And who filled the urn?"

  "I didn't."

  Alex flipped the coin. It caught the light, spun into the air, and vanished into the shadow of the black and yellow balls. We both waited to hear where it landed.

  "See?" Alex said into the silence. "Now we're both ambiguous."

  "Exactly," I said. "So pass the Maxmin."
