      *   **Setting:** In front of Ellsberg's three-color urn.
      *   **Key Conflict:** Raiffa's randomization argument (flipping a coin to convert ambiguity to risk).
      *   **Specific Requirements:**
          *   Bayesian must press the randomization move hard (including the commitment problem: would the agent renege after the coin flip?).
          *   Ambiguity Theorist must have a real answer (not just sloganizing Maxmin).
