      *   *What if the crowd stays for Marco?* Sometimes viral fame brings a crowd that tips the next guy too. If Marco is benefiting from the spill-over crowd *while OP is there*, that's different than OP's solo weekends.
      *   *Focus:* The prompt says "even on weekends we're not playing together." This is the dealbreaker.

  9.  **Final Polish:** Ensure tone is empathetic but firm on the principles of fair compensation. (Proceed to generate output based on these points.)
answer: |-
  Your gut feeling is correct: **Marco's reasoning is flawed, and his proposal is unreasonable.**

  While it is understandable why he is asking (sudden income inequality between friends is awkward), his argument conflates sharing a *location* with sharing a *business*, and it ignores the fundamental nature of how busking tips work.

  Here is a breakdown of why his logic doesn't hold up, why your intuition is right, and how you might handle this without ruining the friendship.

  ### 1. The "Shared Corner" Fallacy
  Marco's main argument is that you share the corner. However, based on your description, you are not a duo; you are two solo acts time-sharing a location.
  *   **The Asset:** In busking, the primary asset generating income is **the performer**, not the pavement. People tip for the performance, the connection, and the artist.
  *   **The Precedent:** You previously agreed that tips belong to the person playing. This establishes that you view yourselves as independent contractors sharing a resource, not business partners in a joint venture.
  *   **The "Not Together" Clause:** This is the biggest red flag. If he wants to split money earned on weekends when he isn't even present, he is asking for an entitlement to your labor and your personal brand. That isn't partnership; that's a tax on your success.

  ### 2. The "Luck" Argument
  Marco is right that going viral is luck. However, luck is a factor in almost all busking income (weather, foot traffic, a generous tourist).
  *   **Capitalizing on Luck:** The viral video attached to *your* face and *your* performance. You are the one showing up to capitalize on that attention.
  *   **The Tipper's Intent:** When someone drops $20 in your case because they saw the Instagram reel, they are tipping **you**. They are not tipping the "corner." If Marco plays during that same slot, those specific people likely wouldn't be there, or they wouldn't tip him the same amount. To redirect that money is to misappropriate the intent of the giver.

  ### 3. The Incentive Problem
  If you agree to a 50/50 split going forward:
  *   **Your Incentive Drops:** Why would you promote yourself, learn new songs, or ensure you show up on time if half your earnings go to someone who didn't perform?
  *   **His Incentive Drops:** He gets paid $300 for doing nothing on your weekends. This creates dependency rather than encouraging him to build his own following or improve his own set.
  *   **Resentment:** Eventually, you will resent paying him for your work, and he will resent you if you ever try to change the agreement back.

  ### 4. Where Marco Might Have a Point (The Nuance)
  There is one area where Marco has a slight claim, though it doesn't justify a 50/50 split of *everything*.
  *   **The "Warm Crowd" Effect:** If you play *together* (alternating sets in the same session), your viral fame might draw a crowd that stays for his set and tips him more than usual. In that specific scenario, he is benefiting from your draw.
  *   **The Permit:** Does one of you hold the legal permit for the spot? If Marco owns the permit and lets you use it, he has leverage to ask for a "rental fee," but not a 50% income share.

  ### How to Handle It
  You value the friendship, so a hard "No, this is my money" might feel too aggressive. However, you cannot agree to his proposal. Here is a suggested approach:

  **1. Reaffirm the Original Agreement**
  Remind him that you are independent buskers who share a spot, not a band.
  *   *Script:* "Marco, I've thought about it, and I don't think splitting 50/50 makes sense. We aren't a duo; we're two solo acts sharing a time slot. The tips people give me are specifically because of the video of *me*. If I'm not there, that money doesn't exist."

  **2. Address the "Luck" Factor**
  Acknowledge the disparity without accepting liability for it.
  *   *Script:* "I know it's crazy luck that the video blew up, and I get that it feels unfair. But busking is always unpredictable. Last year you had better weekends than me; this year I have better weekends. That's the nature of the gig."

  **3. Offer a Compromise (Optional)**
  If you want to preserve the peace and feel generous, you can offer a temporary or limited gesture, but **do not make it a permanent rule.**
  *   **The "Session" Split:** If you are playing the *same day* (alternating hours), you could agree to split the take *for that specific day only*, acknowledging that your presence is boosting the overall foot traffic for both of you.
  *   **The "Spot Fee":** If the corner is now a "hot spot" because of you, and he lets you use it, you could offer to buy him dinner or beer occasionally as a thank you for sharing the location, rather than a cash split.
  *   **The "One-Time" Bonus:** If you feel guilty about the windfall, give him a one-time gift from your first big viral paycheck. "Hey, I know things are uneven right now. Here's $200 to celebrate the spot doing well." This closes the ledger without setting a precedent.

  **4. Prepare for the Friendship Dynamic**
  Be aware that money changes friendships. If Marco reacts poorly to a reasonable "no," that reveals something about his character. A true friend might be envious, but they shouldn't feel entitled to your wages.

  ### Verdict
  **Marco is wrong.** You should not split earnings from weekends when he is not there. You are not employees of the corner; you are the product. Protecting your income isn't greedy; it's the standard for how freelance work operates. Stand your ground kindly, but firmly.
