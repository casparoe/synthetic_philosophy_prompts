      *   **Practical Implication:** Arrow says "you can't rank society fairly." GS says "you can't build a voting system where people don't lie." The latter is actionable for designers.
      *   **Scope:** GS applies to specific rules (like voting) without needing to generate a full social ranking. It's a stronger impossibility in a sense (harder to avoid because you don't need to output a ranking).
      *   **Independence:** GS holds even if you don't care about the full social ranking, just the winner. Arrow leaves open the possibility: "Maybe we can't rank, but can we at least pick a winner fairly?" GS says "No."

