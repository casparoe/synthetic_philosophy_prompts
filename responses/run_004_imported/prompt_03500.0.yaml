      *   **Friend's Input:** A math major friend says "strategy-proof" and "IIA" aren't the same idea, but they couldn't explain why.
      *   **Goal:** Provide a clear, conceptual explanation of the relationship between AIT and GST, highlighting the differences, the connection, and why GST is significant on its own.

  2.  **Initial Assessment & Fact-Checking:**
