      *   *Is SP exactly IIA?* No. But for onto SCFs, SP is extremely restrictive.
      *   *Make sure to mention "Onto/Surjective".* GS requires the rule can actually pick any candidate given some profile. Otherwise, a constant function is strategy-proof and non-dictatorial. Arrow has Pareto, GS has Onto (roughly equivalent in strength for this context).

