      *   However, GS is often proved directly (pivotal voter arguments) without invoking Arrow.
      *   Crucially, GS applies to *ordinal* mechanisms where money/transfers aren't allowed. This is a specific domain of mechanism design.

  5.  **Address the "IIA vs. Strategy-Proofness" Confusion:**
      *   This is the most important conceptual hurdle.
      *   *IIA:* If society prefers $A$ over $B$, removing $C$ shouldn't change that $A$ over $B$ ranking. It's about the *social* output's stability.
      *   *SP:* If I prefer $A$ over $B$, I shouldn't be able to report $B$ over $A$ to get a result I like better. It's about *individual* truth-telling incentives.
      *   *Connection:* In the context of choosing a *single winner*, Strategy-Proofness turns out to be mathematically very strong—essentially as strong as IIA + Pareto combined for SWFs. But conceptually, they start from different places.

  6.  **Why is GS a Landmark?**
