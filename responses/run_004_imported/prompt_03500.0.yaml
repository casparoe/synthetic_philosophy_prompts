      *   *Can you prove GST using AIT?* Yes, there are proofs that link them (e.g., Muller-Satterthwaite), but it's not a trivial "footnote" derivation. It requires specific conditions (onto/surjective functions, at least 3 alternatives).
      *   *Are Strategy-Proofness (SP) and IIA the same?* No. This is the crux of the friend's intuition. IIA is about social *rankings* remaining consistent when irrelevant options are removed. SP is about individual *incentives* to lie.
      *   *Why the 20-year gap?* Arrow (1951), Gibbard (1973), Satterthwaite (1975). The shift was from welfare economics (ranking societies) to mechanism design/game theory (incentives and implementation). The mathematical tools and the questions asked evolved.

  3.  **Deconstruct the Differences:**
      *   **Input/Output:**
          *   Arrow: Profiles of rankings $\to$ Social Ranking (Social Welfare Function - SWF).
          *   GS: Profiles of rankings $\to$ Single Winner (Social Choice Function - SCF).
      *   **Conditions:**
          *   Arrow: Unrestricted Domain, Pareto, IIA, Non-dictatorship.
          *   GS: Unrestricted Domain, Onto (surjective), Strategy-Proofness, Non-dictatorship.
      *   **The "Spirit":**
          *   Arrow is about *consistency* of aggregation.
          *   GS is about *incentives* to manipulate.

