answer: |-
  The observation deck of the Lunar Council was silent, save for the hum of the air recyclers. I missed the hum of interferometers. I missed the grit of the lab, where a voltage reading didn't care about my birth rank, my reference class, or whether I existed at all. For forty years, I measured gravity waves. They were indifferent to me. That indifference was a comfort.

  Now, retired and drafted as a tie-breaking vote on the Deep Scan Initiative, I was surrounded by people who believed the universe cared deeply about where they sat in it.

  "The motion is to cancel the Deep Scan," said Elara. She was young, sharp, and the lead proponent of the Self-Indication Assumption. "It is a waste of three trillion credits."

  Across the table, Kael rubbed his temples. He was an SSA purist, a man who lived in the shadow of the Doomsday Argument. "If we cancel, we fly blind. We need to know if Theory Omega-Heavy is true."

  "We *know* it is true," Elara said, her voice steady. "The priors were fifty-fifty between Omega-Light and Omega-Heavy before we considered our own existence. Omega-Light predicts one billion observers in the history of the cosmos. Omega-Heavy predicts one septillion."

  She looked at me. She knew I was the swing vote.

  "By the Self-Indication Assumption," Elara continued, "I must reason as if I were a random observer from the set of *possible* observers. There are a septillion times more possible 'mes' in an Omega-Heavy universe than in an Omega-Light one. The fact that I exist is evidence—overwhelming evidence—that I am in the Heavy universe. The posterior probability is effectively one. The Scan is redundant."

  This was the Presumptuous Philosopher, flesh and blood. She was claiming she could determine the physical size of the cosmos without looking through a telescope, simply by noting her own presence. It was magic disguised as probability theory.

  "It's arrogance," Kael snapped. "You're confusing possibility with actuality. The Self-Sampling Assumption requires you to treat yourself as a random sample from the *actual* observers. If Omega-Heavy is true, and there are septillions of observers, what are the odds that I, Kael, find myself among the first few billion? It's vanishingly small. I should expect to be born much later in the timeline."

  He leaned forward. "Under SSA, the fact that we are early observers is evidence *against* Omega-Heavy. It suggests the total number of observers is small. It suggests the end is near. We need the Scan to confirm if we're in a dying bubble or an expanding ocean."

  "And if you're wrong?" Elara countered. "If you fund the Scan based on SSA, you are betting against the most robust probabilistic update available. You are betting that we are special, that we are not drawn from the bulk of existence. SIA says we are typical. Typical observers live in big universes."

  "Typical observers don't necessarily live *now*," I said. My voice sounded rusty. I hadn't spoken in a council meeting in ten years.

  Elara turned to me. "Director Vance. You calibrated the LIGO-Virgo-KAGRA network. You know data. But you also know that ignoring indexical information is bad Bayesian practice. My existence is data. Omega-Heavy explains my existence a septillion times better than Omega-Light. Why spend credits to measure what logic has already solved?"

  I looked out the thick quartz window at the Earth. It was a marble of blue and white, fragile.

  "In my lab," I said slowly, "if I had a detector that clicked once for Theory A and a trillion times for Theory B, and I heard a click, I wouldn't assume Theory B was true. I'd check the calibration. I'd ask if the detector was biased."

  "This isn't a detector," Elara said. "It's me. I am the data point."

  "That's the problem," Kael muttered. "She's making the universe big because she wants to be likely. It's ontological greed."

  "It's math," Elara insisted. "If you reject SIA, you accept the Doomsday Argument. You accept that humanity is likely to go extinct soon, simply because if we lasted longer, there would be more humans, and I'd be less likely to be this early one. Do you want to base civilization's budget on the expectation of imminent extinction?"

  "I'd rather base it on evidence," I said.

  "The evidence *is* my existence!" Elara's composure cracked, just a fraction. "If we launch the Deep Scan, and it confirms Omega-Heavy, you will have wasted three trillion credits confirming what we already knew. If it confirms Omega-Light, then SIA is false, and our understanding of probability is broken. But the prior odds of SIA being false are negligible compared to the cost of the Scan."

  I thought about Bostrom's philosopher. The man who walked into the lab and told the physicists to put down their instruments because the math said they were wasting their time. It was the ultimate triumph of the armchair over the world. It unsettled me because it worked. Logically, it held. But it felt like a hallucination.

  "Elara," I said. "If Omega-Heavy is true, and there are septillions of observers... does it matter if we spend the credits?"

  "Of course it matters. Resources are local."

  "But if the universe is that big," I pressed, "then there are septillions of other civilizations making this choice. If SIA is true, we are not unique. We are one of many. If we make a mistake, does it change the aggregate outcome of the cosmos?"

  "That's the Fallacy of Irrelevance," she dismissed. "We care about *our* civilization."

  "Kael," I turned to the other man. "If SSA is true, and we are likely near the end... does the Scan matter?"

  Kael looked down at his hands. "If we are near the end, the Scan tells us how to spend the time. Containment. Archiving. Survival. If we assume Heavy and expand, we might spread our resources too thin before the collapse. We need to know."

  "So," I summarized. "Elara says we know the answer, so don't look. Kael says we don't know the answer, so we must look."

  "Elara says looking is irrational," Kael corrected.

  I stood up. The gravity on the Moon was light, but I felt heavy. The tension wasn't just about money. It was about the nature of inquiry. SIA told us that we could deduce the structure of reality from our own presence. It made the universe a mirror. SSA told us that our presence was a constraint, a warning that we were likely average, and therefore probably near the end of the line.

  One assumption made us presumptuous gods. The other made us doomed rats.

  "I spent forty years building machines to listen to the universe," I said. "The universe never told me what I wanted to hear. It just sang."

  I looked at Elara. "You are asking us to accept that the mere fact of our consciousness outweighs the need for empirical verification. You are saying that the map is so detailed we don't need to walk the territory."

  "I'm saying the map *is* the territory," she said softly. "Indexical information is physical information."

  "No," I said. "It's self-locating information. It tells me where I am, not what is."

  I picked up the voting stylus.

  "If we vote for the Scan," I said, "and SIA is true, we look foolish for spending the money. But we learn nothing new."

  "And if we vote against?" Kael asked.

  "Then we accept that we are presumptuous. We accept that we can derive the population of the cosmos from our own reflection." I paused. "In science, when a theory tells you that you don't need to check your work, that is usually the moment you check your work twice."

  "That's not a rational justification," Elara said, her voice tight. "That's aesthetic."

  "It's methodological," I replied. "SIA shuts down inquiry. It says the experiment is unnecessary. SSA demands the experiment to resolve the tension between our observation and the hypothesis. Science is the business of running the experiment."

  I pressed the stylus to the pad. *Vote: Fund Deep Scan.*

  "You're choosing the Doomsday Argument," Elara said, her face pale. "You're choosing the theory that says we're likely to die out soon."

  "I'm choosing the theory that says we need to look out the window," I said. "If the universe is big, the Scan will confirm it, and we can laugh at the cost. If the universe is small... then we need to know that more than we need to save the credits."

  Elara stood up, gathering her datapads. "You're ignoring the Bayesian update. You're ignoring the math."

  "I'm ignoring the presumption," I said. "I spent a lifetime measuring things that didn't care if I believed in them. I won't end my career betting on a philosophy that says the universe must be big because I'm here to see it."

  She stopped at the door. "If I'm right, Vance, you just wasted the future."

  "If you're right," I said, looking back at the Earth, "then there are a septillion other versions of me wasting a septillion other credits, and it doesn't matter."

  She left. Kael remained, looking at the vote count.

  "We might be preparing for the end," he said quietly.

  "Then we'll prepare well," I said. "But we'll do it with our eyes open. Not because we think we're the center of probability, but because we're curious."

  I walked to the window. The logic was sound. I knew that. Bostrom's math was rigorous. But there was a horror in a universe that could be measured without looking, a terror in a philosophy that made the observer the yardstick of existence. I preferred the cold indifference of the interferometer. I preferred a universe that required me to come find it, rather than one that announced its size simply because I was breathing.

  "Schedule the launch," I told Kael. "Let's go see if we're alone, or if we're just lost in a crowd."

  It was an unscientific reason to make a scientific decision. But as I looked at my reflection in the quartz, I decided that some uncertainties were better left unresolved by logic alone. Some things you had to measure.
