      *   **Key Insight:** Two people can agree on all physical facts but disagree on probabilities due to self-locating logic. SSA leads to the Doomsday Argument; SIA leads to the Presumptuous Philosopher.
      *   **Task:** Write a short story where this tension plays out through characters with genuine stakes.
      *   **Constraints:** Keep reasoning precise (recognizable to a specialist), avoid exposition dumps, integrate philosophy into the narrative.
