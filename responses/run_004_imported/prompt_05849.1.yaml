  **Move Justifications:**

  *   **(1) Score: 1.** Owen correctly cites the famous *Sentences* passage, but omits the crucial proviso: this permission holds specifically "if recourse to a superior is not possible" (*si superior non sit*). Without that condition, the claim that "no public authorization needed" is slightly overbroad, though textually grounded.
  *   **(2) Score: 2.** Marisol accurately identifies the standard scholarly distinction between *tyrannus ex defectu tituli* (usurper) and *tyrannus ex parte exercitii* (abuser). Her reading of *De Regno* I.6 aligns with the dominant interpretation that Aquinas restricts private violence against legitimate title-holders to preserve order.
  *   **(3) Score: 2.** Owen raises a potent epistemological objection. Determining usurpation often involves contested succession laws or historical claims, making the "fact" of usurpation as politically charged as the "value" of abuse. This exposes a vulnerability in Marisol's juridical distinction.
  *   **(4) Score: 1.** Marisol's defense is theoretically sound within Aquinas's framework (juridical title vs. prudential judgment), but historically optimistic. Medieval succession was rarely a "checkable fact," yet this move successfully articulates *why* Aquinas might have believed the distinction held.
  *   **(5) Score: 2.** Owen effectively uses Aquinas's own examples (Tarquin, Domitian) to press the consistency problem. He correctly notes that Aquinas relies on the *mechanism* of public judgment without fully theorizing why collective self-interest is inherently more reliable than individual judgment.
  *   **(6) Score: 1.** Marisol offers a pragmatic retreat. By shifting from theoretical reliability to practical coordination costs, she saves the consistency claim, though she concedes that the distinction is a matter of degree ("imperfect work") rather than kind.

  **What Both Are Missing:**

  First, you are both treating the texts as uniform political treatises, ignoring the genre difference: the *Sentences* is a theological inquiry into sin and merit (where the usurper is treated as an aggressor against the common good, akin to a criminal), while *De Regno* is a mirror-for-princes focused on political stability. Second, neither has addressed the authorship controversy regarding *De Regno*; Book II is widely attributed to Ptolemy of Lucca, and even Book I shows signs of redaction, which complicates claims of strict consistency with Aquinas's earlier work. Finally, you are both secularizing the remedy: for Aquinas, the ultimate solution to tyranny is not just human mechanics (public vs. private) but prayer and divine intervention, as human authority is always subordinate to God's judgment.
