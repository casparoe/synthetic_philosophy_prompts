answer: |-
  This is a classic debate in the philosophy of mind, and honestly, you both put your fingers on different parts of the elephant. Your friend is defending the **ontological** consistency of Davidson's view, while you are attacking its **metaphysical** consequences regarding causal power.

  Here is the breakdown of both moves, followed by a verdict on whether Anomalous Monism (AM) survives the Exclusion Argument.

  ### 1. Your Friend's Move: The Token Identity Defense
  **The Argument:**
  Your friend is leaning on Davidson's ontological monism. Davidson argues that events are concrete particulars located in space and time. If a mental event (e.g., my deciding to raise my hand) is causally related to a physical event (e.g., my hand rising), then by the Principle of the Nomological Character of Causality, there must be a strict law covering this interaction. Since there are no strict *psychological* or *psychophysical* laws (Anomalism of the Mental), the law must be *physical*. Therefore, the mental event must be identical to a physical event.

  **Why it seems to work:**
  If Mental Event $M$ = Physical Event $P$, then there is only **one** cause in the world. Kim's Exclusion Argument is often framed as a worry about overdetermination (i.e., if the physical causes the effect, and the mental causes the effect, the effect has two sufficient causes). Your friend is saying: "Relax. There aren't two causes. There is one cause described in two ways."

  If there is only one cause, there is nothing to "exclude." The physical doesn't crowd out the mental because they are the same thing.

  **The Weakness:**
  This defense treats causation as purely **extensional**. It assumes that as long as the *event* causes the effect, we're good. But intuitively, we care about *why* the event caused the effect. We want to know which **properties** of the event did the work.

  ### 2. Your Move: The Property Exclusion Defense
  **The Argument:**
  You are channeling Jaegwon Kim's deeper critique. Kim grants token identity for the sake of argument but shifts the focus to **causal relevance**. Even if $M$ and $P$ are the same event, the event has both mental properties (being a thought about water) and physical properties (having C-fiber firing pattern $N$).

  Kim asks: *In virtue of which property did the event cause the effect?*

  1.  **Closure:** The physical effect (hand rising) has a sufficient physical cause (neural firing) in virtue of its *physical properties*.
  2.  **Exclusion:** If the physical properties are sufficient to cause the effect, what work is left for the mental properties to do?
  3.  **Anomalism:** Davidson explicitly says there are no strict laws connecting mental *properties* to physical *properties*.
  4.  **Conclusion:** If causation requires subsumption under law (as Davidson says), and mental properties never appear in those laws, then mental properties are causally inert.

  **Why it works:**
  This hits the core intuition behind mental causation. We don't just want to say "my mind caused my hand to move"; we want to say "my hand moved *because* I wanted water." If the causal work is done entirely by the neural properties, then the fact that the state was *about water* is irrelevant to the outcome. The mental description is just a shadow cast by the physical machinery.

  ### The Verdict: Does Anomalous Monism Dodge Exclusion?

  **You win the debate, but your friend isn't totally wrong about the text.**

  Here is the philosophical consensus on this specific clash:

  **1. Davidson saves "Causation," but loses "Causal Efficacy."**
  Davidson defines causation as a relation between events. Since mental events *are* physical events, they definitely enter into causal relations. In this strict, extensional sense, your friend is right: AM is consistent, and there is no ontological dualism creating a competition between two substances.

  However, most philosophers (including Kim, Honderich, and McLaughlin) agree with you: **saving the event isn't enough.** We care about the mental *qua* mental. If my thought causes my action only because it is a brain state, and not because it is a *thought*, then the mental content is epiphenomenal.

  **2. The "Qua" Problem.**
  The fatal flaw in AM regarding the Exclusion Argument is that it severs the link between the mental *description* and the causal *power*.
  *   **Friend's view:** The cause is the event. The event is physical. The event is mental. Therefore, the mental causes the effect.
  *   **Your view:** The cause is the event *in virtue of its properties*. The event causes the effect in virtue of its physical properties. It does *not* cause the effect in virtue of its mental properties.

  If you accept Davidson's Anomalism (no psychophysical laws), you have to accept that mental properties do not pick out the causally relevant features of the world. This leads to **property epiphenomenalism**.

  **3. Davidson's Counter (and why it fails).**
  Davidson would reply that asking "which property did the causing?" is a category mistake. For Davidson, properties are just linguistic descriptions; they aren't ontological constituents that "push" things around. Only events cause.
  *   *Counter-reply:* This feels like linguistic sleight of hand. If the mental description doesn't track the causal mechanism, then psychology cannot be a science that explains behavior. It becomes a mere gloss on neuroscience. Kim's point is that if mental properties don't do any work, they shouldn't exist (or should be reducible), but Davidson insists they are real and irreducible. This leaves them as "danglers."

  ### Conclusion

  **Anomalous Monism does not successfully dodge the Exclusion Problem.**

  It dodges the *ontological* version of the problem (there are not two substances fighting for control), but it succumbs to the *causal relevance* version of the problem.

  *   **Your Friend** is right that Davidson avoids dualist interactionism problems. There is no "ghost in the machine" competing with the "machine."
  *   **You** are right that this victory is pyrrhic. By making mental properties anomalous (lawless), Davidson renders them causally impotent.

  The standard reading in contemporary philosophy of mind is that **Anomalous Monism is a form of non-reductive physicalism that collapses into epiphenomenalism regarding mental properties.** You can keep the mental events, but you have to admit they only do causal work because they are physical. If they weren't physical, they wouldn't cause anything.

  So, tell your friend: "You're right that there's only one cause, but you're wrong that the mental *aspect* of that cause is doing any lifting. Davidson saves the mind by making it a passenger in a physical car."
