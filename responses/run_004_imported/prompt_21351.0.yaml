          4.  Answer the "What it establishes" question.
          5.  Answer the "Why it's contested" question (QM, Space, Triviality).
          6.  Advice for the Novel (How to use this tension).

      *   *Refining the Logic:* I need to be careful not to say "Black proved PII is false." Black proved PII is not *logically necessary*. Some philosophers still argue PII is true in the actual world, just not in all possible worlds.
