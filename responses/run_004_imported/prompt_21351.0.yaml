      *   **Context:** The user is writing a novel set in a pocket universe with two perfectly identical spheres (size, mass, composition, distance, no outside observer).
      *   **Trigger:** A friend mentioned this is Max Black's thought experiment (1952) regarding the Identity of Indiscernibles (PII).
