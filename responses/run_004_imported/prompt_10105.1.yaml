  Also, I need to make sure I don't just say "SSA is bad because of Reference Class." The prompt asks me to argue that *PP gives no good reason to reject SIA*. So the focus must remain on neutralizing PP, while using the Reference Class issue as a supporting reason to prefer SIA *once PP is neutralized*.

