answer: |-
  **INTERNAL MEMORANDUM**

  **TO:** Existential Risk Forecasting Team
  **FROM:** [Your Name/Role]
  **SUBJECT:** Recommendation on Anthropics Priors: Defending SIA Against the Presumptuous Philosopher Objection
  **DATE:** October 26, 2023

  ### 1. Executive Summary

  This note addresses the selection of anthropic priors for our forecasting models, specifically regarding the choice between the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA). While SSA is often the default in existential risk literature due to its derivation of the Doomsday Argument, it suffers from critical instability regarding reference class selection. SIA avoids this instability but faces the "Presumptuous Philosopher" (PP) objection: the claim that SIA allows us to favor physical theories predicting more observers *a priori*, seemingly bypassing empirical evidence.

  I argue that the Presumptuous Philosopher case does not constitute a valid reason to reject SIA for forecasting purposes. The objection relies on an intuition pump that mischaracterizes Bayesian updating on indexical evidence. Furthermore, in the context of existential risk forecasting, SIA offers superior calibration and decision-theoretic stability compared to SSA. I recommend we adopt SIA-style priors for our internal models.

  ### 2. Reframing the "Presumption" as Indexical Updating

  The core intuition behind the Presumptuous Philosopher objection is that it seems epistemically arrogant to rule out a physical theory simply because it predicts fewer observers. Critics argue this allows philosophy to trump physics from the armchair.

  However, this characterization misunderstands the mechanism of SIA. SIA is not claiming that a theory predicting more observers is physically *more likely to be true* in a vacuum. Rather, it claims that *given that I exist as an observer*, I am more likely to find myself in a universe that contains more observers.

  This is a standard Bayesian update on indexical evidence. The evidence is not "Theory T is true," but "I am an observer existing at this moment."
  *   **Hypothesis A:** 1 billion observers exist.
  *   **Hypothesis B:** 100 billion observers exist.

  If both hypotheses are physically possible and empirically equivalent *so far*, the likelihood of me finding myself as an observer is 100 times higher under Hypothesis B. Ignoring this likelihood is equivalent to ignoring data. To reject SIA on the grounds of "presumptuousness" is to insist that our own existence provides no evidence about the nature of the universe we inhabit. For a forecasting project, ignoring relevant data (our existence) is a greater sin than appearing arrogant.

  ### 3. The Empirical Equivalence Fallacy

  The Presumptuous Philosopher thought experiment relies on a highly specific and unrealistic condition: **perfect empirical equivalence**. In the PP case, two theories are assumed to be indistinguishable by any physical experiment, differing *only* in the number of observers they entail.

  In existential risk forecasting, we are never in this position.
  1.  **Correlation with Physical Parameters:** In realistic scenarios, the number of future observers is not an independent variable. It is causally linked to physical parameters we *can* measure (e.g., stellar stability, resource availability, technological capacity). A theory that predicts a long future (many observers) usually makes distinct claims about energy density, entropy, or sociological resilience compared to a theory predicting a short future.
  2.  **Temporary Priors:** Even if we encountered a temporary state of empirical equivalence, SIA acts only as a prior shifter. As soon as new empirical data arrives (which it inevitably will in a forecasting context), the likelihood ratio from physical evidence will swamp the anthropic prior. The "presumptuous" conclusion is only held in the absence of data.

  The PP objection treats a transient epistemic state (temporary empirical equivalence) as a permanent flaw in the reasoning method. For forecasting, where we are constantly integrating new data, SIA provides a rational starting point that is quickly corrected by evidence, whereas SSA introduces a structural bias (the Doomsday Argument) that persists regardless of new data.

  ### 4. Decision-Theoretic Calibration (The Betting Argument)

  Forecasting is ultimately about calibration and betting behavior. We should prefer the assumption that leads to better decisions under uncertainty.

  Consider the *Sleeping Beauty* problem, which is structurally isomorphic to the SSA/SIA debate.
  *   **SSA (Halfer Position):** Beauty should assign a credence of 1/2 to the coin landing Heads.
  *   **SIA (Thirder Position):** Beauty should assign a credence of 1/3 to Heads.

  Decision-theoretic analysis generally favors the "Thirder" (SIA) position. If Beauty is offered a bet every time she wakes up, the SIA credence maximizes expected utility. If she uses SSA credences, she will systematically lose money in repeated scenarios involving observer multiplication.

  In existential risk forecasting, we are effectively placing bets on the future of humanity.
  *   **SSA Implication:** The Doomsday Argument suggests we are likely near the end of the human timeline. This biases forecasts toward imminent catastrophe, potentially leading to an over-allocation of resources to short-term mitigation at the expense of long-term structural resilience.
  *   **SIA Implication:** SIA favors hypotheses where humanity survives longer (because they contain more observer-moments). This does not guarantee survival, but it prevents the model from *a priori* ruling out long futures.

  If we are wrong to use SIA, we risk being overly optimistic. If we are wrong to use SSA, we risk being overly pessimistic in a way that is mathematically baked into the prior. Given the stakes of x-risk, a prior that allows for long futures (SIA) is more robust for planning than a prior that predicts doom by default (SSA).

  ### 5. Reference Class Stability

  While the prompt focuses on the PP objection, the decision cannot be made in isolation from the Reference Class problem.

  SSA requires us to define a reference class of "observers like me." In x-risk forecasting, this is operationally paralyzing. Do we count only conscious humans? Do we include digital minds? Do we include observers in simulated realities? Small changes in this definition drastically alter the probability of doom. This arbitrariness makes SSA unsuitable for rigorous modeling.

  SIA mitigates this. Because SIA weights by the *number* of observers rather than sampling *from* a defined class, it is less sensitive to the boundaries of the class. While SIA still requires a definition of "observer," the weighting mechanism smooths out the discontinuities that plague SSA. For a team needing to build reproducible models, SIA offers a more stable mathematical foundation.

  ### 6. Conclusion

  The Presumptuous Philosopher objection fails to disqualify SIA because it mistakes valid Bayesian updating on indexical evidence for epistemic arrogance. It relies on edge cases of perfect empirical equivalence that do not apply to practical forecasting, where observer counts correlate with testable physical variables.

  Furthermore, SSA carries its own "presumption": the assumption that we are typical within an arbitrarily defined reference class. This leads to the Doomsday Argument, which systematically biases forecasts toward premature extinction and lacks decision-theoretic robustness.

  **Recommendation:** We should ground our priors in the Self-Indication Assumption. This allows us to model long-term futures without *a priori* suppression, avoids the reference class instability of SSA, and aligns with decision-theoretic norms for betting under uncertainty. We should treat the "Presumptuous Philosopher" not as a refutation, but as a reminder to update aggressively once empirical data becomes available.
