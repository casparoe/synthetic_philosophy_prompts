          *   **Incorrect/Problematic:** Calling it a "special case of Mill's harm principle." This is a major conceptual error. Devlin is explicitly *anti-Mill* in this context. Mill says only *harm to others* justifies interference. Devlin argues that the *collapse of morality itself* is the harm, effectively bypassing Mill's restriction on paternalism/moralism. While Devlin tries to frame it as "social harm," philosophers generally distinguish Devlin's "legal moralism" from Mill's "liberalism." However, some interpretations suggest Devlin *co-opts* the language of harm. But saying it's a "special case of Mill" is misleading because Mill would reject the premise that "social fabric" counts as "harm to others" in the relevant sense. *Correction:* It's better to say Devlin argues immorality *is* a harm to society, whereas Mill defines harm differently.
