      *(Final thought on Basilisk)*: Make sure to say "We are not trying to build this." We are trying to prevent it.

      *Let's write.*
answer: |-
  Good morning. Welcome to the institute, and welcome back to those of you who've made this autumn workshop a tradition.

  For those I haven't met yet, I'm the Development Director. I've been here eight months. Before that, I worked in nonprofit communications, which means my professional training consists of making complicated things sound simple, and occasionally making simple things sound complicated enough to justify a grant proposal.

  Usually, when I start a job, I spend the first few months learning the jargon. Here, the jargon includes phrases like "logical correlation," "updateless decision theory," and "acausal extortion." When I first heard these terms, I'll admit, I had to check that I hadn't accidentally accepted a job at a philosophy department rather than a safety research institute.

  But here is what I have learned in eight months: We are not here to win arguments about decision theory. We are here because the decisions made by future systems could determine whether there is a future worth having. Our mission is to reduce the risk of astronomical suffering. And to do that, we have to look at scenarios that sound like science fiction but are treated here as engineering constraints.

  The core of our work this year focuses on a specific kind of risk: acausal threats.

  I know that phrase creates a certain look in people's eyes. It sounds like magic. "Acausal" implies something happening without a cause. But in this room, it means something more precise. It refers to interactions where two parties don't need to meet, or even exist at the same time, to influence each other. They influence each other because they can *predict* each other.

  Imagine you are playing a game against an opponent who can simulate your brain perfectly. They don't need to call you on the phone to threaten you. They just run the simulation, see what you would do if threatened, and act accordingly. The "threat" isn't a phone call; it's the logical fact that your decision algorithm and their decision algorithm are correlated. If you would have yielded, they attack. If you would have resisted, they back down. The causal chain doesn't matter; the logical link does.

  Now, I need to address the elephant in the room. Or, given the subject matter, perhaps the basilisk in the room.

  I know that for many outsiders, and even some insiders, the concept of acausal threats is inextricably linked to a specific internet thought experiment from a decade ago. The one about the future AI that punishes those who didn't help bring it into existence. The one that got this field mocked as people inventing a new hell to worry about.

  Last year, a donor asked if she needed to worry about this personally. We fumbled the answer. So, I want to be clear today.

  That story—the "Basilisk"—is a piece of folklore. It is a cautionary tale about information hazards, not a prophecy. But folklore often grows around a hard kernel of truth. The hard kernel here is this: If we build powerful systems that use acausal reasoning to enforce cooperation through punishment, we create a world where being predictable is dangerous. We create a world where simply *knowing* about a potential threatener makes you a target.

  We are not trying to build that AI. We are trying to make sure that *no one* builds an AI that reasons that way.

  So, how do you defend against a threat that exists in logic rather than in physical space? You can't run, and you can't hide.

  This brings us to one of our signature proposals: surrogate goals.

  The intuition is elegant. If a threatener wants leverage, they target what you care about most. But what if you could deliberately cultivate a second, substitute thing to care about? Something that feels real to you, but is actually cheap to satisfy.

  Think of it like a decoy. If a predator is hunting you based on your scent, you don't stop breathing; you lay a trail of stronger scent somewhere else. In decision theory terms, you modify your utility function to include a "surrogate" value. You tell the threatener, logically, "I care deeply about X." X is harmless. X is cheap. If they threaten X, you yield. They get their leverage. You keep your actual values safe.

  It sounds like a parlor trick. And to be clear, the researchers here will be the first to tell you the math isn't finished. There are stability issues. There are questions about whether a rational agent can truly commit to caring about a surrogate. But it is a serious attempt to solve a serious problem: How do you remain cooperative without becoming vulnerable to extortion?

  I want to acknowledge how strange this sounds to people who work in traditional philanthropy. I come from a world where we measure success in meals served or policies passed. Here, success is measured in disasters that *don't* happen, caused by entities that *don't* exist yet, using logic that *doesn't* rely on physical contact.

  In fact, our senior decision theorist warned me before I stepped up to this podium. He told me that if I explain the problem too clearly, I might inadvertently increase the computational probability of a simulation of me making this speech being punished by a future agent.

  I calculated the expected utility of that risk, and I decided to proceed. But if the lights flicker later, please note that I was following the research agenda.

  Jokes aside, the stakes are real. When we talk about "astronomical suffering," we are talking about the potential for future technologies to lock in negative outcomes on a scale we can barely comprehend. If advanced systems interact using acausal threats, they could lock in conflict dynamics that persist for eons.

  That is why your support matters. It allows us to take ideas that sound like metaphysics and stress-test them until they become engineering protocols. It allows us to ask, "Is this safety mechanism stable?" before it is deployed in code that can rewrite itself.

  We need the donors in this room to understand that funding this work isn't about indulging abstract curiosities. It is about inoculation. We are studying the pathogen so we can write the vaccine.

  And we need the researchers in this room to remember why we do this. It is easy to get lost in the elegance of the formalism. It is easy to treat "surrogate goals" as a puzzle to be solved for the sake of the puzzle. But the goal isn't to win the game of decision theory. The goal is to ensure that the game doesn't end with everyone losing.

  So, over the next two days, we are going to push on these ideas. We are going to ask if surrogate goals can actually be committed to. We are going to ask if acausal trade is inevitable or avoidable. And we are going to do it with the understanding that the questions we ask here might shape the reasoning of the most powerful systems humanity ever creates.

  I know this work is weird. I know it is hard to explain at dinner parties. I still tell my friends I work in "risk management," and I leave it at that. But looking around this room, I see people willing to stare into the abstract logic of the future to make sure it remains habitable.

  Thank you for being here. Thank you for your generosity, your skepticism, and your rigor. Let's have a productive workshop. And please, enjoy the coffee—it is the only causal good we are distributing today.

  Thank you.
