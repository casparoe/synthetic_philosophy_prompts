answer: |-
  **Annotation on the Immutability of the Now**

  It is my intention to set down here the particulars of a certain metaphysical discovery, made during the summer of 1947 in the quietude of the National Library, though I suspect the logic itself is timeless—which is to say, it does not exist.^1^ The thesis is simple, though its implications are corrosive: that succession is a trick of memory, and that the self is merely the site where these tricks are performed.

  Consider the present moment. It is a knife-edge, infinitely thin. Anything that has duration requires parts (a beginning, a middle, an end), and anything with parts is divisible. If time is divisible, then the "present" is not a unit, but a collection of smaller times. We divide until we reach the instant. The instant has no duration. Therefore, nothing happens *in* the instant. If nothing happens in the instant, and time is composed only of instants, then nothing happens in time.^2^

  Furthermore, consider the "I" that perceives these instants. When I look into a mirror, I see a face. When I look again a moment later, I see a slightly altered face, lit by different shadows. The memory of the first face is a current neural event, occurring *now*. The expectation of the next face is a current neural event, occurring *now*. There is no thread connecting them, only a stack of discrete photographs, shuffeled by a hand that is not there. If there is no continuous self to endure, there is no one to suffer the passage of time. There is only the perception of passage, which is itself a present object. Thus, time is a circle drawn in water.^3^

  I spent three months refining this proof. I filled notebooks with diagrams of labyrinths where the center was everywhere and the circumference nowhere. I felt a profound lightness. If time is not real, then death is not real, for death is merely a event in time. If the self is not real, then guilt is not real, for guilt requires a past agent to remain identical with a present sufferer. I was free. I was nowhere. I was nothing.

  And yet.

  Yesterday, while correcting the galley proofs of this very annotation, I paused to watch a dust mote settle upon the manuscript. It fell in a straight line, interrupted by a draft, then resumed. I calculated the trajectory. I understood that the "fall" was merely my mind stitching together static positions of the mote against the background of the desk. Logically, the mote did not move. It simply *was*, in successive locations.

  But my neck grew stiff. My eyes dried. A shadow crept across the page, indicating the sun had moved behind the building. I felt a sudden, violent tightening in my chest—a biological clock ticking louder than any argument. I realized that while I could dismantle the concept of duration with a pen, I could not dismantle the ache in my joints. The logic was perfect, but the flesh was heretical.

  There is a species of tiger in the Bengal forests that hunts by silence. It does not roar; it simply arrives. Time is that tiger. I have proven the tiger is a hallucination, a bundle of perceptions regarding stripes and teeth. But the teeth are in my throat. I have proven the river is a static arrangement of water molecules, yet I am drowning.

  It is comfortable to believe that the world is a dream of which one is the dreamer. It is less comfortable to suspect that the dreamer is also part of the dream, and that the dream is indifferent to being dreamed. I have constructed a labyrinth of logic so perfect that there is no exit, only to find that I am not the minotaur hiding in the center, but the walls themselves, crumbling under the weight of a clock that does not exist.

  The proof stands. Time is unreal. The self is a fiction. I have demonstrated this beyond reasonable doubt. Nevertheless, the sun is setting, and I am growing old, and I am tired. The world is real, evidently, despite my reasoning. And so, unfortunately, am I.

  ***

  ^1^ *I am aware of the contradiction inherent in the phrase "timeless logic." Let us say, rather, that the logic is independent of the temporal sequence in which it is read.*
  ^2^ *This echoes the arguments of Zeno of Elea, though Zeno lacked the benefit of modern cinematography, which proves that still images projected in succession create the illusion of motion. We are merely the film.*
  ^3^ *See: Schopenhauer, *The World as Will and Representation*, Vol. II, Appendix. Also, the apocryphal *Book of Mirrors* attributed to the heresiarch of Uz, which claims that mirrors are terrible because they multiply the number of men without increasing the number of souls.*
