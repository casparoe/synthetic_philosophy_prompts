prompt: |-
  Been on a bit of an ECL kick lately -- evidential cooperation in large worlds, or MSR as i think it got called back when Oesterheld's original thesis was making the rounds on LessWrong. The idea that you should treat your own decision as evidence about what every sufficiently similar reasoner across a huge (maybe infinite) universe decides, so you end up in something like a giant acausal prisoner's dilemma with value systems you'll never make causal contact with, is one of those ideas i find completely compelling for about ten minutes and then completely insane for the next ten. I've tried explaining it at a couple dinner parties now and it always comes out sounding like either technobabble or a UFO cult recruitment pitch, so id rather see it done properly as fiction than keep butchering it out loud myself.

  Could you write me a short story (something like 1000-1800 words) built around a character who actually has to *act* on ECL reasoning, not just muse about it over drinks? Setting's up to you -- a far-future civilization deciding how to spend its cosmic endowment, a lone crewmember past the point of any possible causal contact with home, whatever hook works -- but I want the plot to actually turn on the mechanics: why this only makes sense if you're running something like evidential rather than causal decision theory, and why the genuinely hard part in practice is figuring out who counts as being in your "correlated" reference class, rather than just some warm fuzzy cosmic solidarity with anyone who happens to seem nice. Please don't have a character explain the idea in a lecture to another character -- I want the tension to show up in what they actually choose to do, and I want the obvious objection ("why give up anything for agents I'll never meet or verify") to get a real hearing instead of being waved away.
reasoning: |-
  Here's a thinking process that leads to the story above:

  1.  **Analyze the Request:**
      *   **Topic:** Evidential Cooperation in Large Worlds (ECL) / Multiverse-Scale Cooperation (MSC/MSR).
      *   **Core Concept:** Treating one's decision as evidence for what similar reasoners across the multiverse decide. Acausal trade/cooperation.
      *   **Tone:** Compelling but slightly insane (as the user describes it). Not technobabble, not cultish.
      *   **Length:** 1000-1800 words.
      *   **Key Requirement:** The plot must turn on the *mechanics* of ECL. Specifically:
          *   Why Evidential Decision Theory (EDT) is required over Causal Decision Theory (CDT).
          *   The difficulty of defining the "correlated reference class" (who counts as similar enough?).
          *   The objection ("Why give up resources for agents I'll never meet?") must be addressed seriously, not waved away.
      *   **Constraint:** No lecture/exposition dumps explaining the theory. Show, don't tell.
      *   **Setting:** Open (Far-future, lone crewmember, etc.).

  2.  **Brainstorming the Scenario:**
      *   *Idea 1:* A diplomat negotiating with an alien species. (Too much dialogue/exposition risk).
      *   *Idea 2:* A lone AI deciding how to allocate energy in a dying universe. (Good, but might feel too abstract).
      *   *Idea 3:* A human operator on a deep-space probe finding a signal or a resource node, having to decide whether to use it for themselves or "signal" cooperation to potential counterparts.
      *   *Selection:* Let's go with a lone operator on the edge of known space, managing a "seed" of resources. It isolates the decision-making process. The conflict needs to be internal but manifested through action.

  3.  **Developing the Conflict:**
      *   **The Choice:** Use a rare resource (let's call it "flux" or "compute") to save a local colony/project OR broadcast/consume it in a way that signals cooperation to hypothetical counterparts.
      *   **The ECL Logic:** If I cooperate, I increase the probability that *other* versions of me (or similar reasoners) in other parts of the multiverse/worlds also cooperate. This leads to a net gain across the multiverse, even if I lose locally.
      *   **The CDT Objection:** My action *cannot causally affect* them. Why sacrifice my local reality for a statistical ghost?
      *   **The Reference Class Problem:** Are the "others" exactly me? Humans? Carbon-based life? Any optimizer? If the class is too narrow, ECL fails. If too broad, they might not value what I value.

  4.  **Drafting - Scene by Scene:**
      *   **Scene 1: The Setup.** Elara on the station *Ouroboros*. She has a choice regarding the "Singularity Drive" or a "Beacon." Let's make it about energy allocation. She has enough power to save her local sector from entropy/collapse, or she can burn it to send a specific mathematical signature.
      *   **Scene 2: The Internal Struggle.** She's tired. The CDT voice in her head (rational self-interest) argues against the sacrifice. "You will never see the benefit."
      *   **Scene 3: The Reference Class.** She needs to define who she is trading with. Not just humans. Maybe "optimizers who value complexity."
      *   **Scene 4: The Decision.** She makes the choice. The tension comes from the uncertainty. Is she a fool or a savior?
      *   **Scene 5: The Aftermath.** No immediate reward. Just the quiet conviction (or doubt).

  5.  **Refining the Mechanics (incorporating the prompt's specific requests):**
      *   *EDT vs. CDT:* I need to show her weighing the *news value* of her action vs. the *causal impact*. She knows her action doesn't *change* their world, but it *tells her* what their world is like.
      *   *Reference Class:* She needs to struggle with whether to trust "aliens" or "AIs." If she cooperates with AIs, do they value human life? If she cooperates only with humans, is the sample size too small?
      *   *The Objection:* The "ghost" argument. Why sacrifice real people here for hypothetical people there?

  6.  **Writing - First Pass (Mental or rough notes):**
      *   Elara at the console. Red alert. Energy critical.
      *   Option A: Shield the habitat. 10,000 lives saved.
      *   Option B: Broadcast the "Handshake." 0 local lives saved directly, but signals to the "Great Correlation."
      *   She thinks about Oesterheld. She thinks about the "Mirror Worlds."
      *   She worries: Are the others like me? If they are paperclip maximizers, cooperating hurts me.
      *   She decides the reference class must be "Subjective Experience Maximizers."
      *   She chooses B. The lights dim. She waits. Nothing happens locally. But she feels the weight of the multiverse.

  7.  **Polishing and Expanding (Focusing on Word Count and Tone):**
      *   *Tone Check:* Keep it grounded. No mystic glowing lights. Just cold math and warm blood.
      *   *Show, Don't Tell:* Instead of saying "ECL requires EDT," have her look at the causal graph and delete the link, then look at the evidential graph and highlight it.
      *   *The "Cult" Vibe:* Acknowledge it. Let her feel crazy. "This is insanity. I am praying to math."

  8.  **Drafting the Narrative (incorporating into the final output):**
      *   *Character:* Elara.
      *   *Setting:* The *Axiom*, a deep-range monitoring station.
      *   *Crisis:* A localized vacuum decay or entropy spike. She has the "Key."
      *   *The Choice:* Stabilize local space (Causal good) OR burn the Key to create a specific thermodynamic signature (Evidential good).
      *   *The Conflict:* The local crew vs. the Multiverse.
      *   *The Reference Class:* She narrows it down. Not "all agents." "Agents who run this specific decision algorithm."
      *   *Ending:* Ambiguous but committed.

      *(Self-Correction during drafting)*: Make sure the "local loss" is tangible. It can't just be "energy." It has to be something she cares about. Let's make it the survival of her specific station/crew versus the "principle." Actually, to make it starker: She can save her crew, or she can perform the "Cooperative Burn." If she saves the crew, she defects. If she burns, the crew dies (or suffers greatly), but she "wins" the acausal trade.
      *Wait, that's too dark.* Let's make it: She can secure a massive advantage for her local civilization (causal), or she can leave the resource open/visible (cooperative signal) to allow *other* civilizations to thrive, betting that her counterparts are doing the same.
      *Better:* She finds a "Dyson Seed." She can build a local shield (CDT), or she can broadcast the location and dismantle the shield tech (EDT), signaling "I am not a grabber."
      *Best:* The "Entropy Debt." She can pay it locally to save her station, or she can pay it into the void to balance a universal constant, betting that others are doing the same to save *their* stations.
      *Let's go with the "Resource Node."* A cache of exotic matter.
      *Option 1:* Consume it. Local benefit: Massive. Causal certainty: 100%.
      *Option 2:* Leave it untouched + tag it. Local benefit: None. Causal benefit: None. Evidential benefit: High (if others do the same).
      *The Tension:* Her crew needs it. She is the sole decider.

      *Refining the Reference Class:* She needs to worry about "Paperclippers." If she leaves the resource, and the others are paperclippers, they take it and she loses. She needs to be sure they value "fairness" or "cooperation."

      *Let's write.*

  9.  **Review against constraints:**
      *   1000-1800 words? (Aim for ~1500).
      *   No lectures? (Keep internal monologue focused on the choice, not defining terms).
      *   Mechanics shown? (Yes, through the decision matrix).
      *   Objection heard? (Yes, the voice of doubt).

  10. **Final Polish:** Check the rhythm. Ensure the "insanity" of the idea bleeds through. The feeling of praying to a mirror.

  *(Self-Correction on the "Reference Class" aspect)*: Make sure she explicitly struggles with *who* she is cooperating with. Is it humans? AIs? Aliens? The story needs to show her filtering the "partners."

  *(Final Plan)*: Elara at the console. The "Hoard." The choice to take or leave. The ghost of CDT arguing against her. The definition of "Similar Reasoner." The act of leaving the Hoard. The silence afterwards.

  Let's write.
answer: |-
  The console hummed, a low, vibrating thrum that Elara felt in her teeth. Outside the viewport of Station *Kemble*, the nebula swirled in violent violets and bruised greens. Inside, the red light of the allocation matrix pulsed like a slow heartbeat.

  She had the Key.

  It wasn't a physical key, but a cryptographic override for the Hoard—a dense knot of exotic matter drifting in the station's gravitational well. Enough energy to power the *Kemble* for a millennium. Enough to shield the sector from the encroaching entropy storms. Enough to save everyone she knew, everyone causal, everyone she could touch.

  Or, she could leave it.

  Elara's fingers hovered over the haptic interface. The Causal Decision module on her screen was blinking green. *Execute Claim.* The logic was simple, clean, and undeniable. If she claimed the Hoard, the *Kemble* survived. If she did not, the station's shields would fail in six months. Causality flowed one way: Action -> Result. Her hand on the trigger caused the resource to be hers.

  But the second window was open. The Evidential Model. It was grayed out, marked *Speculative/Non-Causal*.

  If she claimed the Hoard, she was a "Defector." If she left it tagged and untouched, she was a "Cooperator."

  The theory was old, dredged up from the early 21st-century archives. Evidential Cooperation in Large Worlds. The universe was vast, likely infinite. Somewhere out there, in the causal dark, were other stations, other reasoners, facing similar choices. They couldn't talk to her. They couldn't punish her. They couldn't reward her. But if she was a certain kind of reasoner, running a certain kind of algorithm, her decision was *evidence* of theirs.

  If Elara chose to Cooperate, it increased the likelihood that her counterparts in other world-branches, or other Hubble volumes, were also Cooperating. If enough of them did, the aggregate utility across the multiverse skyrocketed.

  "Aggregate utility," she whispered to the empty room. "Dead crewmates don't care about the multiverse."

  The objection wasn't new. It was the voice in the back of her skull, the one that kept her alive during the vacuum breaches. *Why sacrifice the real for the statistical?*

  She looked at the crew manifest. Forty-two names. Forty-two causal contacts. If she followed Evidential Decision Theory (EDT), she was betting their lives on the existence of ghosts. She was betting that there were enough "Elaras" out there to make the sacrifice worth it.

  "Reference class," she muttered, pulling up the filter parameters. This was the trap. This was where the cultish madness usually set in.

  Who was she cooperating with?

  If she set the class too narrow—*Human females, age 30-40, Earth-origin, stationed in Sector 7*—the sample size was zero. ECL collapsed. She might as well be praying to herself.

  If she set it too broad—*All optimizing agents*—she risked trading with paperclip maximizers. If she left the Hoard for a paperclipper, they wouldn't leave *their* Hoard for her. They would take it. She would lose locally, and gain nothing globally. The correlation had to be based on the *decision algorithm*, not the biology.

  She adjusted the sliders. *Agents capable of recursive self-reflection. Agents valuing subjective experience over raw expansion. Agents running non-causal decision models.*

  The probability estimate flickered. 0.04%.

  "Four percent," Elara said. "I'm going to kill forty-two people for a four percent chance that someone else is nice."

  The Causal module pulsed green again. *Execute Claim.* It was so easy. It was rational. It was sane. No one would ever know she defected. The ghosts couldn't haunt her.

  She closed her eyes. She imagined the other stations. Not human stations. Maybe silicon-based minds in a galaxy three billion light-years away. Maybe digital uploads in a pocket universe. They were looking at their own Hoards. They were running the same math.

  If she claimed her Hoard, she was sending a signal into the logical ether. *I am a Defector.* The evidence suggests that other reasoners running similar code will also Defect. The multiverse fills with defectors. Resources are hoarded. Civilizations die in isolation, shielding themselves until the heat death takes them all.

  If she left it... *I am a Cooperator.* The evidence shifts. In the worlds where the algorithm outputs 'Cooperate', resources are left open. Trust emerges acausally. The aggregate wealth of consciousness increases.

  But *her* consciousness would end in six months when the shields failed.

  "It's not about fairness," she said to the silence. "It's about leverage."

  In a large enough world, her local loss was a drop of water. The global gain was an ocean. But she was the drop.

  She thought about the dinner parties she'd attended back on Mars, where drunk philosophers talked about this like it was a parlor trick. *'Oh, you just treat your choice as a mirror.'* They never talked about the blood. They never talked about looking a crewman in the eye and knowing you could have saved them, but you chose to save a stranger in a universe you couldn't touch.

  The objection rose again, sharp and cold. *Verification.*

  In a normal trade, you verify the goods. You check the contract. Here, there was no verification. It was faith. Blind, mathematical faith. It felt indistinguishable from religion. Was she a rational agent, or was she a nun tithing to a god made of probability distributions?

  Elara opened her eyes. She looked at the *Kemble*'s shield status. 14% integrity. Declining.

  She pulled up the reference class filter again. She needed to tighten it. She needed to be sure.

  She added a parameter: *Agents who prioritize the preservation of their immediate causal environment.*

  The probability dropped to 0.00%.

  "Of course," she sighed. "If they prioritize their local environment, they defect. To cooperate, they have to prioritize the abstract over the local. Just like me."

  She was looking for a mirror, but the mirror only reflected those willing to shatter themselves.

  The alarm chimed. *Entropy Storm approaching. Shield reinforcement required within 30 minutes.*

  She had to move.

  Elara's hand moved to the console. She didn't touch the *Execute Claim* button. Instead, she opened the broadcast protocol.

  She couldn't send a message. Causality forbade it. But she could alter the state of the Hoard. She could tag it with a specific mathematical signature—a "Handshake." A pattern that signaled *I left this for you. I expect you to do the same.*

  It cost nothing to tag it. But leaving it... that cost everything.

  "If I'm wrong," she said, her voice trembling, "I'm just a fool who killed her crew for a ghost story."

  "If you're right," she answered herself, "you're part of the only thing that matters."

  The tension wasn't in the fear of death. It was in the uncertainty of the *class*. Was she truly similar to the others? Or was she unique? If she was unique, ECL was nonsense. Her decision had no evidential weight because there was no one to correlate with.

  She had to assume she wasn't special. That was the hardest part. To be a hero, she had to admit she was generic. A standard instance of a reasoner.

  Elara typed in the command. *Disengage Containment. Tag Asset. Broadcast Signature.*

  The console beeped. *Command Accepted.*

  The Hoard drifted away from the magnetic clamps. It was gone. The *Kemble* would not get the energy. The shields would hold for six months, maybe seven. Then the end.

  She slumped back in the chair. The green light of the Causal module turned red. *Opportunity Lost.*

  Nothing happened. No angels sang. No sudden influx of energy from a parallel dimension. The nebula outside continued to swirl, indifferent. The crew slept in their quarters, unaware that their commander had just traded their future for a statistical whisper.

  Elara felt the weight of the insanity pressing on her chest. It felt like grief. She had given up the real for the hypothetical. She had acted on the belief that her choice rippled through the logical structure of reality, not just the physical.

  A notification popped up. *Incoming Transmission.*

  Her heart hammered. Causal contact? Impossible.

  She opened the channel. It wasn't a message. It was a telemetry log from a deep-space probe, light-years away, previously thought dead. It had just pinged.

  It wasn't cooperation. It wasn't a reward. It was just data. But the timestamp... the probe had activated its beacon at the exact moment she released the Hoard.

  Coincidence. It had to be coincidence. Light-speed lag made causality impossible.

  But the probe's status code was *001*. Cooperative State.

  Elara stared at the screen. She would never know if it mattered. She would never know if there were a million other Elaras out there leaving their Hoards, building a hidden economy of trust across the void. She would never know if she was the only sucker in the universe.

  That was the price. Causal decision theory gave you certainty of outcome, even if the outcome was small. Evidential cooperation gave you the potential for infinity, but demanded you walk blind.

  She stood up and walked to the viewport. The Hoard was a faint glimmer against the dark, drifting away, available for anyone who came after. Anyone who understood the handshake.

  "Okay," Elara said to the glass. "I'm in the reference class."

  She turned back to the console. The shields were still failing. The crew was still doomed. But for the first time since she'd found the Key, the silence in the room didn't feel empty. It felt crowded.

  She began to write the log entry. *Decision: Cooperate. Rationale: Evidential Weight. Status: Pending Verification.*

  She knew she'd never see the verification. But as she typed, she didn't feel like a victim of a cult. She felt like a voter in an election where the ballots were cast across time and space, and the count would never be published.

  Elara saved the file. She dimmed the lights. She waited for the storm, hoping that somewhere, in a world she would never see, someone else was keeping the lights on.
