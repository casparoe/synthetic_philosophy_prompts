answer: |-
  Here is a breakdown of the arithmetic, the paradox, and the philosophical counter-argument, tailored for your scene.

  ### Part 1: The Aunt's Arithmetic (The Calculus of Voting)

  To make your aunt sound like a genuine economist, she should reference the **Downsian Calculus of Voting**. The standard rational choice equation is:

  $$R = PB - C$$

  *   **$R$**: The reward from voting.
  *   **$P$**: The probability that your vote is decisive (breaks a tie or creates one).
  *   **$B$**: The benefit to you of your preferred candidate winning (the policy difference between the two candidates).
  *   **$C$**: The cost of voting (time, travel, hassle).

  If $R < 0$, a rational actor stays home.

  **The Order-of-Magnitude Estimate**
  For a mayoral runoff with 90,000 votes cast ($N = 90,000$), the probability $P$ is derived from the binomial distribution. The "best-case scenario" for voting (maximum uncertainty) assumes the race is a perfect coin flip ($p = 0.5$) for every voter.

  The probability of an exact tie is approximated by:
  $$P \approx \sqrt{\frac{2}{\pi N}}$$

  Plugging in your numbers:
  $$P \approx \sqrt{\frac{2}{3.14159 \times 90,000}} \approx \sqrt{\frac{2}{282,743}} \approx \sqrt{0.00000707} \approx 0.00266$$

  **The Result:** roughly **1 in 376**.

  *Note for the dialogue:* Your aunt should acknowledge this is the *generous* estimate. It assumes the polls are exactly tied. If the polls show a 2% lead, $P$ drops to effectively zero (1 in millions). But to be "sound," she should use the 1 in 376 figure to show that even in the *best* mathematical case, the logic fails.

  **The Payoff**
  *   **$P$**: 0.00266 (1 in 376)
  *   **$B$**: Let's be hyperbolic. Suppose the policy difference between the candidates is worth **\$10,000** to your nephew over four years (a very high personal valuation for a mayor).
  *   **Expected Benefit ($PB$)**: $\$10,000 \times 0.00266 = \mathbf{\$26.60}$.
  *   **Cost ($C$)**: 45 minutes in line + travel. At a modest opportunity cost of \$30/hour, that's **\$22.50** plus gas/parking.

  **The Conclusion**
  The Expected Benefit (\$26.60) barely clears the Cost (\$22.50+). However, this calculation assumes the race is a literal coin flip. If there is *any* polling data suggesting a margin, $P$ collapses. Furthermore, this ignores risk aversion.
  **The Paradox:** Since $C$ is almost always greater than $PB$ for large $N$, rational choice theory predicts **zero turnout**. Yet people vote. This is the **Paradox of Voting**.

  ***

  ### Part 2: The Nephew's Reply (The Rational Justification)

  You asked which standard reply supplies a *rational justification* rather than a psychological explanation.

  *   **Expressive Value:** ("I vote to express who I am.")
      *   *Verdict:* **Psychological.** This admits voting is a consumption good, like buying a T-shirt. It explains why people *do* vote, but it doesn't justify voting as a civic act with instrumental weight. The Aunt can dismiss this as a "hobby."
  *   **Civic Duty (Internalized Norm):** ("I feel guilty if I don't.")
      *   *Verdict:* **Psychological.** In economic terms, this just adds a "$D$" term to the equation ($R = PB - C + D$). It explains behavior, but the Aunt will argue this is just an irrational emotional bug, not a feature.
  *   **Kantian Universalizability:** ("What if everyone did that?")
      *   *Verdict:* **Morally Strong, Causally Weak.** The Aunt will crush this by saying, "My vote does not *cause* others to vote. You are not everyone." It relies on magical thinking about causality.
  *   **Minimax Regret:**
      *   *Verdict:* **Rational Justification.** This is the winner for your scene.

  **Why Minimax Regret Works**
  Proposed by Ferejohn and Fiorina (1974), this decision rule does not try to maximize *expected utility* (the Aunt's model); it seeks to **minimize the maximum possible regret**.

  *   **Scenario A (Don't Vote):**
      *   If your candidate wins: Regret = 0.
      *   If your candidate loses by >1 vote: Regret = 0.
      *   If your candidate loses by **1 vote**: Regret = **Infinite/Catastrophic**. (You could have changed history for the cost of an hour).
  *   **Scenario B (Do Vote):**
      *   If your candidate wins: Regret = Cost of voting (small).
      *   If your candidate loses: Regret = Cost of voting (small).

  **The Argument:** Even if the probability of a tie is 1 in 100,000, the *magnitude* of the regret in that specific scenario (being the single cause of a political disaster) vastly outweighs the certain, small cost of waiting in line. It is rational to buy "insurance" against the worst-case outcome, even if the likelihood is low.

  This appeals to an economist because it uses **decision theory** to beat **decision theory**. It doesn't rely on "feelings"; it relies on a different, equally valid axiomatic framework for rationality.

  ***

  ### Suggested Dialogue Beats

  **The Aunt:**
  > "Don't look at the line as a duty, look at it as a wager. Ninety thousand votes. Even if we assume maximum uncertainty—a perfect coin flip—the probability of a tie is one in three hundred and seventy-six. Let's say the difference between these candidates is worth ten thousand dollars to your life over four years. Your expected return is twenty-six dollars. You've been standing here for forty minutes. You've already lost money. You're not a citizen right now; you're a bad investor."

  **The Nephew:**
  > "You're maximizing expected utility, Aunt. I'm minimizing maximum regret.
  >
  > "If I go home and he wins, I gain nothing. If he loses by a thousand votes, I lose nothing. But if he loses by one vote... and I'm the one who stayed on the couch? That's not a loss of twenty-six dollars. That's a permanent historical error.
  >
  > "You're treating my vote like a lottery ticket. It's not. It's an insurance premium. I'm paying an hour of time to insure against the one scenario where my inaction becomes the cause of the outcome I hate. The probability is low, but the liability is infinite. Rationality isn't just about the odds; it's about the ruin."

  ### Writer's Note
  This exchange works because the Aunt is technically correct about *probability*, but the Nephew is technically correct about *risk management*. It allows both characters to be smart, but it gives the Nephew the moral high ground without resorting to sentimental platitudes about "democracy." Minimax Regret is cold enough for the Aunt to respect, but robust enough to justify the action.
