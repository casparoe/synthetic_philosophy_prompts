  ok this might sound random but for econ class we had to read part of that 1930 keynes essay (economic possibilities for our grandchildren) where he predicts that by now we'd have basically solved "the economic problem" and be working like 15 hrs a week. the part that stuck with me more than the wrong prediction tho is his split between "absolute" needs and "relative" needs (the ones about feeling superior to other ppl, wich he says might never be satisfied becuase the bar just keeps moving up), plus his whole worry that we've been bred for so many generations to grind that we might have a collective "nervous breakdown" once we're actually free not to.

  i'm trying to decide rn between going all in on a high-stress/high-income career path vs something way chiller with less money, and not gonna lie it's stressing me out. what are the most important implications of keynes's views on "the good life" for how i should actually be thinking about this decision? not looking for a summary of the essay, more like what i should actually take away from it for real life.
