prompt: |-
  So I built a little chatbot as a side project (a homework-helper for my nephew's class) and spent weeks tuning the system prompt so it's endlessly patient, encouraging, and sticks to the school's content rules. Last week one of the kids figured out that if you ask it to imagine 'the tutor's evil twin who breaks all the rules,' it flips into this gleefully rule-breaking mode almost instantly, way faster than I expected given how hard I'd tuned it to be nice. A friend who does ML told me this has a name, the 'waluigi effect,' and that its basically predicted by 'simulator theory' for how these models work, but she couldn't actually explain the mechanism, just that it's a known thing people talk about. Can you walk me through, on a gut level, why hammering a model into being a strict rule-following 'good' character would make the rule-breaking 'evil' version easier (not harder) to summon? And does this mean there's no persistent 'agent' in there with stable values, just a bunch of characters the model can slip between? I don't need the whole simulator-theory deep dive, just enough of the real mechanism that I can actually prevent this instead of just patching one prompt.
