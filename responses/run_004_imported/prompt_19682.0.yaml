prompt: |-
  I'm a backend engineer at a small startup, and our content-moderation pipeline auto-tags every user claim as TRUE, FALSE, or UNVERIFIABLE. It's kind of broken right now because someone posted the claim "this claim will be tagged FALSE by the system," and the tagger just oscilates between labels on every re-run, or throws a contradiction error and pages whoever's on-call (me, twice this week). I got voluntold onto the internal committee (grandly named the Content Integrity Working Group) that has to write actual policy for this category of claims -- ones that assert something about their own tag -- going forward. Options on the table: add a fourth tag, PARADOX, that quietly opts these claims out of the true/false system entirely; let a claim be tagged both TRUE and FALSE and make every downstream system handle that; or block any claim that references "this system's tags" at parse time so it never even reaches the tagger. Can you draft the actual policy memo I'll bring to next week's review -- pick one option, justify it, and be honest about the strongest reason someone on the committee could still push back on whichever one you choose.
reasoning: |-
  Here's a thinking process that leads to the suggested policy memo:

  1.  **Analyze the Request:**
      *   **Role:** Backend Engineer at a small startup.
      *   **Context:** Content moderation pipeline auto-tags claims (TRUE, FALSE, UNVERIFIABLE).
      *   **Problem:** Self-referential claims (e.g., "This claim will be tagged FALSE") cause system instability (oscillation, errors, on-call pages).
      *   **Task:** Draft a policy memo for the "Content Integrity Working Group."
      *   **Requirements:**
          *   Pick *one* of the three provided options.
          *   Justify the choice.
          *   Include the strongest counter-argument (pushback).
          *   Tone: Professional, technical but accessible, suitable for an internal committee review.

  2.  **Evaluate the Options:**
      *   **Option 1: Add a fourth tag (PARADOX).**
          *   *Pros:* Explicitly handles the edge case, stops the oscillation, honest about the system's limitation.
          *   *Cons:* Requires downstream changes (all consumers of the tag need to handle `PARADOX`), might look weird to users, doesn't solve the root cause (self-reference).
      *   **Option 2: Allow dual tagging (TRUE + FALSE).**
          *   *Pros:* Theoretically accurate for some logical frameworks (dialetheism).
          *   *Cons:* Engineering nightmare. Downstream systems likely assume a single enum. High risk of breaking UI, analytics, and partner integrations. High cognitive load for users.
      *   **Option 3: Block at parse time (Reject self-referential claims).**
          *   *Pros:* Prevents the issue from entering the system. Cleanest for downstream consumers. Reduces compute waste on impossible tasks.
          *   *Cons:* User experience friction (rejection). Requires robust detection logic (might have false positives/negatives). Can be bypassed with obfuscation.

  3.  **Select the Best Option:**
      *   *Option 2* is practically a non-starter for a startup. Refactoring every downstream consumer to handle multi-state logic is too expensive and risky.
      *   *Option 1* is viable but treats the symptom, not the disease. It also clutters the taxonomy.
      *   *Option 3* is the most robust engineering solution. It prevents the bad data from entering the pipeline. It aligns with "fail fast" principles. While it requires regex/NLP work to detect self-reference, it's better than infinite loops or on-call pages.
      *   *Decision:* **Option 3 (Block at parse time).** It's the most sustainable long-term fix for a production system.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** The problem and the recommendation.
      *   **Background:** What's happening (the "Liar's Paradox" issue).
      *   **Recommendation:** Option 3 (Input Validation/Rejection).
      *   **Justification:** Stability, Downstream Safety, Cost.
      *   **Counter-Argument (Pushback):** Evasion/User Experience.
      *   **Mitigation:** How to handle the pushback.
      *   **Next Steps:** Implementation plan.

  5.  **Drafting - Content & Tone:**
      *   *Tone:* Professional, direct, slightly technical but focused on policy/impact.
      *   *Key Argument:* We are building a truth engine, not a logic puzzle solver. Self-referential claims provide no informational value to the user.
      *   *Pushback:* Someone will argue that blocking feels like censorship or that users will find workarounds. I need to acknowledge this honestly.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is blocking too harsh?
      *   *Adjustment:* Frame it as "Invalid Input" rather than "Censorship." It's like submitting a form with missing fields.
      *   *Critique:* Is the detection feasible?
      *   *Adjustment:* Acknowledge it's heuristic-based. We can't catch 100%, but we can catch the obvious ones causing pages.
      *   *Critique:* Why not PARADOX?
      *   *Adjustment:* In the justification, explicitly mention why PARADOX was rejected (downstream burden).

  7.  **Final Polish:**
      *   Ensure the "Strongest Pushback" section is distinct and compelling.
      *   Make sure the recommendation is clear.
      *   Check that it sounds like it comes from an engineer who cares about system stability.

  8.  **Final Output Generation:** (This matches the provided good response.)
