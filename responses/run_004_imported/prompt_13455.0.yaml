      *   **Decision Theory (UDT/ADT):** From a decision-theoretic standpoint (which LessWrong cares about), you should act to maximize expected utility across the multiverse. Dying reduces utility in the vast majority of branches (for your loved ones, your goals, etc.). Caring only about the one branch where you survive is selfish and irrational under most utility functions.
