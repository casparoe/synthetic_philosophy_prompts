answer: |-
  Fellows, students, alumni, and the long-suffering family members who have agreed to pretend they understand what a "Symposiac" actually is: thank you.

  It is a genuine honour to stand here. I am told I was invited because my last novel depicts an Athenian dinner party that ends in catastrophe. I suspect the real reason is that during my own time as an undergraduate member of this society, my contribution to the "ideas" half of the equation was negligible, but my enthusiasm for the "wine" half was… well, let's call it empirically robust. I am, in other words, the control group in Plato's experiment. I am the warning label.

  We are here to celebrate 150 years. That is a staggering amount of time for a group of people to gather, eat, and argue. And through all those years, you have kept one rule that strikes the uninitiated as peculiar, but which signals to the cognoscenti exactly what game we are playing: the Sober President.

  Now, the popular story—and the one on the notepaper—is that this comes from the *Symposium*. It's the easy reference. It's Alcibiades bursting in, drunk and beautiful, declaring Socrates the only man who can hold his liquor. It's romantic. It's chaotic. It's very Cambridge.

  But if the Fellows in the room will forgive me for pointing it out: the Sober President isn't from the *Symposium*. It's from the *Laws*.

  In the *Symposium*, wine is a muse. In the *Laws*, wine is a gym.

  The Athenian Stranger argues that we shouldn't drink to escape who we are, but to reveal who we are. He suggests that a city needs a way to test the courage and self-command of its citizens without actually going to war. So, you give them wine. You lower their guard. You see if their virtue holds up when their inhibitions go down. But—and here is the crucial bit—you cannot do this without a sober overseer. A pilot for the ship. Someone who ensures the test remains a test, and doesn't just become a mess.

  That is what this society has been for a century and a half. You are not just a drinking club. You are a laboratory of character with a pudding course.

  Plato, in his infinite wisdom, also gave us a schedule for this testing. He argues that young men under eighteen shouldn't touch wine at all—it's fire on fire. Between eighteen and thirty, you may taste it, but drunkenness is forbidden; you are still building the vessel. It is only after forty that you are permitted to let go properly. And then, for the elderly, Plato makes a claim that I find incredibly tender. He says that as we age, our souls grow stiff. We become sour, rigid, fearful. We calcify. So, the state owes the old man wine. It is a *pharmakon*. A medicine. Not to intoxicate him into stupidity, but to intoxicate him into pliability. To make the soul young again, if only for an evening.

  Looking around this room, I see the full gradient of the Platonic scale.

  To the current students: I see you eyeing the decanters. Plato says you are in the danger zone. You are still forging the iron. Drink, by all means—this is a celebration—but remember the Sober President is watching. Let this be a test of your command, not a surrender of it.

  To the Fellows and the older members: You are the beneficiaries of the medicine. If you feel the stiffness of the world, the cynicism of the academy, or the simple ache of time, you are philosophically obligated to drink. It is your duty to soften.

  And to the Sober President tonight: Thank you. You are the Athenian Stranger in the high chair. You are the condition that makes our freedom safe.

  We live in a time when we are often told that pleasure and discipline are enemies. That you either have a good time or you have a good character. Plato, and this society, suggest something stranger. That pleasure is the anvil upon which character is hammered out. That we need the risk of excess to prove the value of restraint. That we need the medicine of wine to remember how to be gentle with one another.

  150 years is a long time to keep a promise to oneself. It suggests that, despite my own undergraduate data points to the contrary, this experiment works. You have kept the president sober so that the rest of us might, occasionally, be safely drunk on ideas and on wine.

  So, please rise.

  To the Symposiacs. May our character hold fast, even when our knees do not. And may we never be too young to learn, nor too old to require the medicine.

  To the Society.
