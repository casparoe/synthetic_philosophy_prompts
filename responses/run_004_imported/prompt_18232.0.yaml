      *   *Defining "Incompatibilism":* It's a conditional claim. "D + FW = Impossible." It is *not* an existential claim ("FW Exists").
      *   *The "Randomness" Trap:* Explain why Hard Incompatibilists reject randomness. (Rolling dice isn't freedom). This addresses the friend's comment.
      *   *Why the Label Sticks:* Explain that the debate is structured around the threat of Determinism. Even if FW is impossible anyway, the *reason* it's impossible in a determined world is specific (lack of alternate possibilities).
      *   *Analogy:* Use a clear analogy. Maybe a "Square Peg/Round Hole" analogy or a "Recipe" analogy. Let's try a "Rules of the Game" analogy.
