      *   *Key Distinction:* Putnam targets *skepticism* (we can't know anything), Bostrom targets *probability* (it's likely we are sims). Putnam says "You can't coherently hypothesize you are a BIV." Bostrom says "It is probable you are a sim." These talk past each other slightly. Putnam attacks the *intelligibility* of the skeptical hypothesis; Bostrom assumes the hypothesis is intelligible and argues for its likelihood.

