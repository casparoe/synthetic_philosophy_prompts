      *   Illusionism: Introspection represents $X$ as having property $Q$ (but $X$ lacks $Q$).
      *   Representationalism: Introspection represents $X$ as having property $Q$ (and $X$ has $Q$, where $Q$ = representational content).
      *   The "Error Theory" charge: If Illusionism says introspection misrepresents functional states as phenomenal, and Representationalism says introspection represents functional states as phenomenal (where phenomenal = representational), is the difference just semantic?

  4.  **Evaluate the Distinction (The Crux):**
      *   *Is it just rhetoric?* No. The metaphysical commitment differs.
      *   *Tye:* There is something it is like to see red. That "something" is a representation of redness. If you strip the representation, you strip the phenomenology.
      *   *Frankish:* There is *nothing* it is like to see red, in the sense that matters for the Hard Problem. The "what-it's-like-ness" is a user-illusion generated by cognitive processing.
      *   *The "Quale" Disagreement:* Tye saves the phenomenon by redefining it. Frankish bites the bullet and denies the phenomenon exists (as conceived).
      *   *The Meta-Problem Connection:*
          *   Tye solves the meta-problem by saying we judge consciousness puzzling because we misunderstand the nature of representation (transparency, etc.).
