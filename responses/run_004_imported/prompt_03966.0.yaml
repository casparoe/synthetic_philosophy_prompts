          *   Explanatory Target: The Hard Problem (reduced to explaining representation).
          *   Metaphysics: Realist/Reductive. Qualia exist, but they are representational properties.
          *   Mechanism: Experience represents the world (and body) accurately (mostly). The "feel" is the content.

  3.  **Analyze the Overlap (The User's Intuition):**
