          2.  Does illusionism collapse into representationalism + error theory?
          3.  Which view does more explanatory work on the *meta-problem of consciousness* (Chalmers)?
          4.  **Constraint:** Defend a side, don't just be neutral.

  2.  **Deconstruct the Positions:**
