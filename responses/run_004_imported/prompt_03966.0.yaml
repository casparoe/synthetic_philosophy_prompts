      *   *Why?* Representationalism (Tye) gets stuck on the "Gap Intuition." Even if you define qualia as representation, people still feel there's an explanatory gap (Why does *this* representation feel like *this*?). Illusionism dissolves the gap by denying the target of the gap exists.
      *   *Meta-Problem:* Frankish's approach explains the *puzzlement* better. Tye explains the *experience* but leaves the *puzzlement* intact (why are people still dualists if Tye is right?). Frankish explains why dualism is the default cognitive setting.

