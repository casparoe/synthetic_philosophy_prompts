      *   **Lakatos/Research Programmes:** Newtonian mechanics was a "progressive" research program during Neptune, becoming "degenerating" during Vulcan.
      *   **The Nature of the Anomaly:** Uranus was a perturbation; Mercury was a precession of perihelion. Different kinds of mathematical problems.
      *   **Severe Testing (Mayo):** Did the hypothesis risk being wrong? Neptune risked falsification (look there, see nothing). Vulcan kept moving the goalposts.

