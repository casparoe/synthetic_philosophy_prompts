answer: |-
  This is a fantastic entry point into philosophy of science. You've stumbled upon one of the canonical case studies—the "Duhem-Quine problem" in action. Since you have a physics background, you'll find the epistemological stakes here very familiar: it's essentially an argument about error analysis, signal-to-noise ratios, and model selection, but framed as logic.

  Here is a breakdown of the exchange, move by move, evaluating who holds the stronger position at each stage, followed by the crucial context both of them are glossing over.

  ### Move 1: Marisol (The Underdetermination Claim)
  **Claim:** Both predictions were rational applications of Newtonian mechanics. The evidence alone couldn't distinguish success from failure in advance.
  **Verdict:** **Marisol wins this round.**

  **Why:** She is correctly identifying the logical structure of hypothesis testing. In both 1846 and 1870, the logical form was identical:
  $$ \text{Newtonian Mechanics} + \text{Known Planets} + \text{Initial Conditions} \rightarrow \text{Observed Orbit} $$
  When the observation didn't match, logic dictates that *at least one* premise is false. It does not dictate *which one*. Positing a new planet (an auxiliary hypothesis) is a logically valid way to save the core theory (Newton). From a strictly logical standpoint, there is no difference between the Neptune case and the Vulcan case at the moment of prediction. Marisol is invoking the **Duhem-Quine Thesis**: you never test a hypothesis in isolation, only as part of a bundle. You are right to recognize the physics was the same; she is right to note the logic was too.

  ### Move 2: Devon (The Evidential Asymmetry Claim)
  **Claim:** The Neptune fit was tight; Vulcan was messy and ad hoc. There was "evidential daylight" at the time.
  **Verdict:** **Devon wins this round.**

  **Why:** Marisol's Move 1 was logically sound but historically thin. Devon is correctly pointing out that scientists are not logic machines; they weigh *degrees* of confidence.
  *   **Neptune:** Le Verrier's prediction for Neptune was stunningly precise (within 1° of actual position). The "signal" was strong.
  *   **Vulcan:** The calculations for Vulcan were never stable. Reports of transits were contradictory. The orbital parameters had to be tweaked constantly to accommodate new null-results.
  Devon is arguing that "underdetermination" isn't a binary switch (either you know or you don't); it's a probability distribution. The posterior probability of "Newton is right + Planet exists" was much higher for Neptune than for Vulcan *at the time*, based on the quality of the fit. He is correctly appealing to scientific practice: we distinguish between a robust anomaly and a noisy one.

  ### Move 3: Marisol (The Theory-Ladenness Claim)
  **Claim:** "Fit well enough" is a judgment call requiring trust in the Newtonian framework. You've just relocated the underdetermination.
  **Verdict:** **Marisol wins this round (on philosophical depth).**

  **Why:** She has cornered Devon on the definition of "evidence." What counts as "noise" versus "falsification" depends on your confidence in the background theory.
  If you trust Newton absolutely, *any* anomaly is "noise" or "missing mass" (Vulcan). If you distrust Newton, that same anomaly is "falsification."
  Marisol is invoking the **Theory-Ladenness of Observation** (associated with Norwood Russell Hanson and Thomas Kuhn). She is arguing that Devon's "evidential daylight" is an illusion created by their prior commitment to Newton. She is right that there is no principled, theory-neutral cutoff for "good enough fit." Without assuming Newton is roughly true, you can't even calculate where Vulcan *should* be to judge the fit. So, the evidence doesn't speak for itself; it speaks through the theory.

  ### Move 4: Devon (The *Reductio* Claim)
  **Claim:** If you go that far, no observation tests anything, not even General Relativity (GR).
  **Verdict:** **Devon wins this round (on pragmatic grounds).**

  **Why:** Devon is calling a bluff. If Marisol's argument holds strictly, science becomes impossible. If "fit" is always subjective based on the framework, then Einstein's confirmation during the 1919 eclipse is just as "underdetermined" as Vulcan.
  But we know GR *did* win. It made novel predictions (light bending) that Newton + Auxiliaries could not easily mimic without becoming grotesque. Devon is arguing for **Inference to the Best Explanation**. At some point, the auxiliary hypotheses (Vulcan, epicycles, ether) become so cumbersome that the rational move is to dump the core theory. If Marisol denies this, she denies that evidence ever constrains theory. Devon is rightly defending the reality of scientific progress against radical skepticism.

  ---

  ### What They Are Both Missing

  While they traded blows effectively, they are arguing past each other because they are missing three concepts that would bridge the gap between Marisol's logic and Devon's engineering.

  #### 1. Lakatos and "Research Programmes"
  The Hungarian philosopher Imre Lakatos specifically used the Neptune/Vulcan case to solve this exact problem. He argued that we shouldn't look at single theories (Newton) but at **Research Programmes**.
  *   **Progressive Phase:** When Le Verrier predicted Neptune, the Newtonian programme was *progressive*. It was predicting novel facts successfully. It was rational to save the core theory.
  *   **Degenerating Phase:** By the time of Vulcan, the programme was becoming *degenerating*. They were constantly adding ad hoc patches (new planets, dust clouds, optical errors) just to survive, without predicting anything new.
  **The Missing Point:** The rationality isn't in the single prediction (Marisol's focus) or the data fit (Devon's focus), but in the **trajectory of the research programme**. It was rational to posit Vulcan in 1860, but irrational to keep positing it in 1900 after repeated failures.

  #### 2. Bayesian Priors (The Physicist's View)
  As a physicist, you know that data doesn't speak alone; it updates priors.
  *   **Neptune:** The prior probability of an outer planet existing was high. We knew there were outer planets. The phase space was open.
  *   **Vulcan:** The prior probability of an intra-Mercurial planet was lower. It required a stable orbit in a hot, gravitationally chaotic zone.
  Marisol treats the two hypotheses as logically equivalent. A Bayesian would say the *prior probability* of the auxiliary hypothesis ("There is a planet here") was vastly different in the two cases. Devon senses this ("fit well enough"), but Marisol is right that it's not just about the fit; it's about the plausibility of the patch.

  #### 3. Severe Testing (Deborah Mayo)
  Philosopher Deborah Mayo argues that evidence only confirms a theory if it has passed a **severe test**.
  *   **Neptune:** The test was severe. Le Verrier said, "Point the telescope at *this exact degree*." If nothing was there, the hypothesis was dead immediately. It risked falsification.
  *   **Vulcan:** The tests were not severe. If you didn't see Vulcan, the hypothesis shifted to "It's too small," or "It's cloudy," or "The orbit is different." The hypothesis was insulated from falsification.
  **The Missing Point:** Devon is right that the evidence was different, but not just because of the "fit." It's because the Neptune hypothesis *risked* being wrong in a way the Vulcan hypothesis did not. Vulcan became unfalsifiable, which is the real sin, not just a bad fit.

  ### Summary for Your Group
  You can tell them they are reenacting a debate from the 1960s between Karl Popper (Devon's side: falsification matters) and W.V.O. Quine (Marisol's side: logic doesn't force rejection).

  *   **Marisol** is right that logic alone doesn't force you to drop Newton.
  *   **Devon** is right that scientists *did* and *should* treat the cases differently.
  *   **The Synthesis:** The difference wasn't in the logic (Marisol) or just the data fit (Devon), but in the **methodological health** of the hypothesis. Neptune was a risky, novel prediction in a progressive programme. Vulcan was a protective, ad hoc patch in a degenerating one.

  Since you're the physicist in the room, you might add that in modern terms, Vulcan was essentially "overfitting the noise." They were trying to find a signal in the residuals that wasn't there, adding parameters to the model until it fit the error bars. Neptune was finding a signal that actually existed. The philosophy is just the formalization of that intuition.
