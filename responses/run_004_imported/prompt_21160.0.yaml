      *   **The Conflict:** User argued with friend Jonah about Hitler and the Stauffenberg plot (Operation Valkyrie, 1944).
      *   **The Question:** Under Aquinas's logic, is Hitler a usurper or a legitimate ruler turned tyrant? Would Aquinas support Stauffenberg?
      *   **Constraint:** Do *not* just say "Hitler was evil, so it's okay." Must apply Aquinas's specific criteria rigorously.

  2.  **Recall/Verify Aquinas's Political Philosophy:**
      *   *Source:* Primarily *De Regno* (On Kingship) and *Summa Theologiae* (II-II, Q. 42, A. 2; Q. 64, A. 3).
      *   *Key Concept:* The common good vs. private good. Tyranny is the pursuit of private good at the expense of the common good.
      *   *Usurpation:* If power is seized unjustly, the tie of allegiance is broken. Resistance is permissible.
      *   *Legitimate Authority turned Tyrant:* Aquinas is indeed cautious. He cites the Old Testament (killing Joab) and Roman history. He warns that private assassination often leads to worse tyranny or civil strife. He prefers public deposition.
      *   *Nuance:* Aquinas does allow for resistance if there is a "public authority" to do it. But what if no public authority exists? (This is the crux of the Nazi Germany case).

  3.  **Analyze the Hitler/Stauffenberg Case through Aquinas's Lens:**
      *   **How did Hitler gain power?**
