      *Let's go.*
answer: |-
  **Elara:** Watch. He starts with A. He pays a cent to trade for B, because he strictly prefers B. He pays a cent to trade for C, because he strictly prefers C. Now he holds C, and he prefers A to C. If he trades back, he's got A again, but two cents poorer. That's the pump.

  **Kael:** He won't make the third trade. He has foresight. At t=0, he sees the loop. He commits to stopping at B. He keeps the cyclic preferences—B is still better than C locally—but he refuses the trade that completes the cycle. No money lost. No exploit.

  **Elara:** That's a policy band-aid on a structural wound. You're saying rationality is just "don't lose money," but you haven't fixed the engine. At t=2, holding C, his actual preference is for A. By refusing the trade, he is actively choosing an option he strictly dislikes. He's fighting his own utility function.

  **Kael:** He's not fighting it; he's managing it over time. Rationality isn't a myopic slave to local gradients. It's about selecting a trajectory. If he can bind his future self to a plan that avoids the pump, he satisfies the only coherent demand rationality can make: non-exploitability. Why does it matter if the underlying pairwise comparisons cycle, if the behavior never leaks value?

  **Elara:** Consider Ulysses. He tied himself to the mast because he knew the Sirens would *corrupt* his future preferences. He bound himself because his future self would be *wrong*. But in your cyclic agent, the future self isn't corrupted. At t=2, preferring A to C isn't a mistake; it's his genuine preference. What licenses the t=0 self in vetoing a genuine, uncorrupted strict preference of the t=2 self?

  **Kael:** Because the t=0 self knows the t=2 preference is part of a destructive system. The authority comes from the global view. The t=2 self is locally rational but globally suicidal. Resolute choice just says the agent has the capacity to prioritize the global view.

  **Elara:** If he prioritizes the "global view," he is admitting that his utility isn't defined over outcomes like A, B, or C. It's defined over *plans* or *histories*. He prefers "Start at A, end at B" over "Start at A, end at A via C." If you define the objects of choice as complete plans, your cyclic preferences vanish. You get transitivity over plans.

  **Kael:** So? If I can model him as VNM-rational over plans, isn't that enough?

  **Elara:** It's enough to save the theorem, but it contradicts your claim. You claimed he keeps his cyclic preferences. But if he's willing to sacrifice a locally preferred outcome to satisfy a plan, he doesn't actually prefer the outcome; he prefers the plan. You haven't escaped coherence theorems; you've just hidden the utility function inside the description of the action. You've bought coherence by another name.

  **Kael:** ...I suppose if the only thing that matters is that the money stays in the wallet, it doesn't matter whether we call it "resolute choice with cyclic outcomes" or "transitive choice over histories."

  **Elara:** It matters if you want to know what the agent *is*. If you have to rewrite the ontology to save the behavior, the ontology was wrong. The preferences were the bug, not the feature.
