      *   *Argument:* It's not primarily a category mistake about identity (though that's implied). It's a violation of *natural spontaneity* (ziran). To insist on "Human" is to privilege one temporary configuration of qi over others. The "uncanny" label marks a disruption in the harmony between the particular (metal/man) and the universal (founder/Heaven). It's an ethical failure rooted in a metaphysical ignorance (thinking "I" am separate from the process).

