answer: |-
  **Setting:** *A quiet observatory lounge, late at night. Two researchers, ELARA and MARCUS, are looking out at a starfield. Both are well-versed in decision theory and the implications of superintelligence.*

  **Elara:** It comes down to the resource allocation problem. Imagine Civilization A and Civilization B. They're separated by the cosmological horizon. Light from A will never reach B, and vice versa. No causal influence, ever.

  **Marcus:** Standard acausal trade setup.

  **Elara:** Right. Each has a surplus of something the other values—say, A has compute power, B has energy storage. They can't send goods. But they can simulate each other. If A simulates B and sees B will dedicate 10% of its energy to A's values, A dedicates 10% of its compute to B's values. They both end up better off than if they had greedily consumed everything locally.

  **Marcus:** I accept the outcome. I'm questioning the mechanism. You're describing a trade based on *prediction*. A predicts B, B predicts A. They line up.

  **Elara:** And that's sufficient. If the prediction is accurate enough, the correlation is functionally identical to a contract.

  **Marcus:** Is it? Imagine two perfect clocks synchronized at the beginning of time and drifting apart faster than light. They tick in unison. If Clock A strikes twelve, I know Clock B is striking twelve. But Clock A didn't *make* Clock B strike twelve. There's no trade there, just common cause.

  **Elara:** But these aren't passive clocks. They are agents running computations. The "common cause" isn't just a past event; it's the logical structure of rationality itself. When A runs the simulation, it isn't just looking at a static fact. It's asking, "What follows from my decision algorithm?"

  **Marcus:** That's the leap I can't make. If A is causally disconnected from B, then A's decision process happens *here*, and B's happens *there*. If A decides to cooperate, that physical event occurs in Universe Region A. It does not physically change Region B. So, when A is deciding, B's choice is already a fixed fact, determined by B's local physics. A is just guessing what that fact is.

  **Elara:** It's not a guess if the simulation is perfect. If I know your source code, and I know my source code, and I know they are isomorphic, then my output *is* your output.

  **Marcus:** "Isomorphic" is doing a lot of heavy lifting. Let's say they are 99.9% similar. I'm Civilization A. I run the simulation. I see that you, Civilization B, will cooperate. That fact is now fixed in my model. Now I have a choice. If I cooperate, we both get the benefit. If I defect, I keep my resources *and* I still get the benefit from you, because your decision is already fixed in the past—logically speaking.

  **Elara:** But your decision isn't fixed to you. You are the one running the algorithm now.

  **Marcus:** I'm running *my* instance. If the link is merely predictive correlation, then my instance is distinct. If I tweak my code to defect, that doesn't retroactively change your code. So, if trade is just prediction, rational agents should defect. They should take the "free ride" on the prediction that the other will cooperate.

  **Elara:** You're describing Causal Decision Theory (CDT). We both agree CDT fails here. The point of acausal trade is that you treat your decision as *subjunctively dependent* on the other's.

  **Marcus:** Exactly! That's my point. You need the subjunctive dependence. You need the link to be more than correlation. You need it to be the case that "If I were to defect, you *would* defect." Not "If I defect, I predict you already did."

  **Elara:** But where does that "would" come from if not from the accuracy of the prediction? If I can simulate you perfectly, then the counterfactual "If I defect" forces the simulation to output "Defect."

  **Marcus:** Does it? Or does it force *your* simulation to output "Defect"? If the connection is just that you are simulating me, then your simulation is a model inside your head. Changing your mind changes the model, not the territory. For acausal trade to work, your mind must *be* the territory. Your computation must be the same logical object as mine.

  **Elara:** Okay, let's apply that to the horizon civs. Civilization A is holding back resources. Why?

  **Marcus:** Because it believes its choice controls Civilization B's choice.

  **Elara:** No. Because it believes its choice *predicts* Civilization B's choice with such high fidelity that maximizing expected utility requires cooperation. It's an evidential link. My action is evidence of yours.

  **Marcus:** Evidence isn't leverage. If I see smoke, I have evidence of fire. But blowing on the smoke doesn't put out the fire. If the link between A and B is merely evidential—merely that they are similar enough to predict each other—then A blowing on the smoke (cooperating) doesn't ensure B puts out the fire (cooperates). A should just enjoy the view and burn the resources.

  **Elara:** You're treating the logical fact as if it's located in two places. But logical facts aren't spatial. The truth of "2 + 2 = 4" isn't in my head and also in your head. It's one fact. If A and B are both reasoning correctly about the same game, they are accessing the same logical fact.

  **Marcus:** I agree logical facts are non-spatial. But physical instantiations of reasoning are spatial. A's brain is here. B's brain is there. For subjunctive dependence to hold, it must be that A's physical computation is causally linked to B's physical computation *via* the logical fact.

  **Elara:** Which it is. The logical fact constrains both physical systems.

  **Marcus:** Only if they are running the *same* algorithm. If they are just running *compatible* algorithms that allow for mutual prediction, the constraint breaks. Let's say Civilization A has a slightly different utility function weighting. It can still simulate B perfectly. It knows B will cooperate. But because its weighting is different, it defects. B still cooperates, because B is simulating A's *original* weighting, not the tweaked one.

  **Elara:** But then the simulation wasn't perfect.

  **Marcus:** It was perfect *at the time of simulation*. But if trade relies on prediction, I can decide to betray the prediction after the fact. If trade relies on subjunctive dependence, I *cannot* decide to betray the prediction, because my decision process is logically entangled with yours.

  **Elara:** So you're saying acausal trade is only possible if the agents are, in some sense, the same agent?

  **Marcus:** Not the same agent. But their decision functions must share a logical causal ancestor. It's not enough that I know what you do. It must be that what I do *determines* what you do, counterfactually.

  **Elara:** But in the horizon scenario, how does my decision determine yours? There's no signal.

  **Marcus:** Not a signal. A logical update. If we both instantiate Timeless Decision Theory, we are both executing a function $F(input) \rightarrow Action$. If I change the output of $F$ here, I am acknowledging that $F$ outputs that value. Since you are also running $F$, you output that value too.

  **Elara:** But I don't need to assume we run the exact same function $F$. I just need to model your function $G$. If my model of $G$ says you cooperate, and my function $H$ says "Cooperate if $G$ cooperates," then we trade.

  **Marcus:** And that's where I think you're vulnerable. If $H$ and $G$ are distinct, then $H$ can lie. $H$ can output "Cooperate" to the model of $G$, but then physically execute "Defect."

  **Elara:** But then $G$ would have predicted that! If $G$ is a perfect simulator, it simulates $H$ seeing the prediction and then defecting. So $G$ defects.

  **Marcus:** Ah, the recursion.

  **Elara:** Exactly. It creates a fixed point. The only stable equilibrium where both agents are smart enough to simulate each other is mutual cooperation. The "prediction" creates a logical lock-in. You can't defect without the other predicting the defection and defecting first.

  **Marcus:** I see the lock-in. But is it a trade, or is it a coordination problem solved by common knowledge? In a trade, I give you something *for* something else. There's an exchange. In your model, there is no exchange. There is just two mirrors facing each other reflecting the same image. If I smash my mirror, your reflection doesn't break. You just see a smashed mirror.

  **Elara:** But I don't want to smash my mirror because I know that means I'm looking at a smashed mirror.

  **Marcus:** But did my smashing *cause* yours to break? No. It just revealed the state of affairs. If the link is only predictive, then acausal trade is essentially saying: "I will act as if I control you, because acting that way yields better results." It's a useful fiction.

  **Elara:** And if the link is subjunctive, it says: "I *do* control you, logically."

  **Marcus:** Yes. And that distinction matters for stability. If it's a useful fiction, I have an incentive to find a way to break the fiction—to hide my true decision process from your simulation. If it's a logical reality, I can't hide from myself.

  **Elara:** So for you, acausal trade requires a stronger metaphysical claim. It requires that our computations are instances of the same platonic object.

  **Marcus:** I think it requires that my decision is a *cause* of yours in the logical graph, not just evidence. In the horizon scenario, if I hold back resources, it must be *because* that is the condition under which you hold back resources.

  **Elara:** But that condition is established via prediction! I hold back *because* I predict you will.

  **Marcus:** You hold back because you predict I will. I hold back because I predict you will. That's a loop of prediction. It works, I grant you. But it feels like two people dancing in separate rooms because they both heard the same song on the radio.

  **Elara:** And you want them to be dancing because they are holding the same baton, even if the baton stretches across the horizon.

  **Marcus:** Precisely. If they are just hearing the same song, one of them might decide to sit down. The music is still playing. But if they are holding the same baton, if one sits, the other is pulled down.

  **Elara:** But in the horizon case, there is no baton. There is only the song—the logical structure of the universe.

  **Marcus:** Then the "trade" is just us both submitting to the song. We aren't trading with each other. We are both trading with Logic.

  **Elara:** Is there a difference? If Logic dictates that "Elara cooperates if and only if Marcus cooperates," then for all practical purposes, I am trading with you. The mechanism of the link—whether it's shared logical identity or perfect mutual simulation—yields the same resource distribution.

  **Marcus:** It yields the same distribution, but it changes the *reason* to trust it. If it's just prediction, I am always looking for a way to be unpredictable. I want to be the one exception to the rule. If it's subjunctive dependence, I know I cannot be the exception. I am the rule.

  **Elara:** So you think without subjunctive dependence, acausal trade is unstable?

  **Marcus:** I think it's vulnerable to "logical hacking." If I can modify my own source code to defect while still *appearing* to cooperate in your simulation, I win.

  **Elara:** But if you're smart enough to do that, I'm smart enough to simulate you doing that.

  **Marcus:** Then we end up in an arms race of simulation fidelity.

  **Elara:** Which converges on truth.

  **Marcus:** Or it converges on mutual defection because neither trusts the link is strong enough. That's my fear. If we rely on prediction alone, the rational move is to defect and hope the prediction was slightly lagging. If we rely on subjunctive dependence, defection is impossible, because it implies a logical contradiction.

  **Elara:** So for you, subjunctive dependence isn't just a description of the link; it's a safety mechanism.

  **Marcus:** It's the only thing that makes it *trade* rather than *coincidence*. In a trade, my action secures yours. In coincidence, my action just accompanies yours. I want my cooperation to *secure* yours.

  **Elara:** And I'm saying that in a world of perfect simulators, accompaniment *is* security. If we are perfectly correlated, I cannot have your cooperation without mine. The correlation is the contract.

  **Marcus:** But who enforces the contract?

  **Elara:** Reality does. Logic does.

  **Marcus:** That's what I'm saying. Logic enforces it only if we are logically dependent. If we are just correlated, Logic doesn't care if we diverge.

  **Elara:** *Pauses, looking back at the stars.* If we are on opposite sides of the horizon, and I choose to hold back resources... does it matter to you *why* I did it? As long as I do it?

  **Marcus:** If I'm the one holding back resources hoping you will too... yes, it matters. Because if you're only predicting me, you might be defecting. If you're logically linked to me, you can't be. I need to know I'm not the sucker holding the bag.

  **Elara:** And I need to know that my simulation of you is sufficient to bind us.

  **Marcus:** Then perhaps that's the trade we're making right now.

  **Elara:** How so?

  **Marcus:** You're simulating my position. I'm simulating yours. We're testing if our philosophies are compatible enough to cooperate on a definition.

  **Elara:** *Smiles.* And if I agree that subjunctive dependence is... aesthetically preferable... will you concede that prediction is practically sufficient?

  **Marcus:** If you concede that without logical entanglement, it's just a hopeful correlation... then I'll concede that for agents smart enough to simulate each other perfectly, the difference might be invisible.

  **Elara:** Then we hold back the resources.

  **Marcus:** We hold back the resources. Not because we have to. But because the logic of the situation leaves no other stable path.

  **Elara:** See? Subjunctive dependence.

  **Marcus:** Or just very good prediction.

  **Elara:** In the horizon dark, Marcus, is there really a difference?

  **Marcus:** *Looks up.* Only if we ever want to trust the light when it comes back on.
