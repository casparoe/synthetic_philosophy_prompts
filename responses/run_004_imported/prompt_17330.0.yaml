      *   *The Mathematical Reality:* Can a mechanism *guarantee* a better outcome than 50/50 for *both* parties unconditionally?
          *   If both value items exactly the same (e.g., both want the house 100%, everything else 0%), a 50/50 split of the house (sell and split proceeds) is often the only fair solution. A trade-based system can't magically create value if preferences are identical.
          *   Therefore, the mediator's claim that it *always* leaves both "better off" is mathematically suspect *unless* there are assumptions about divergent preferences.
