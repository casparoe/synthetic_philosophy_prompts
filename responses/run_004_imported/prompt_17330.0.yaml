      *   *Individual Rationality:* A mechanism is individually rational if no participant ends up worse off than their reservation value (in this case, the 50/50 split).
      *   *The Catch:* For a mechanism to guarantee you do *better* than 50/50 without knowing the other side's preferences, it usually requires trade based on *different* valuations. If valuations align perfectly (both want the house most), trade is hard.
