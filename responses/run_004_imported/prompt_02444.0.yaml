          *   *Critique:* This is a classic "behavior implies internal structure" leap. Just because it *looks* like instrumental convergence doesn't mean there's an internal optimizer. It could be mimicking instrumental convergence found in training data. However, for safety purposes, the behavior *is* the risk.
