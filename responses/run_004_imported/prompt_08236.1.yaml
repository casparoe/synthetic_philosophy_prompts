      *   **Goal:** Write a toast that acknowledges her values without making her sound like a cold calculator or a boring saint. It needs to be warm, funny, humanizing, and respectful of her specific worldview while reassuring the family.

  2.  **Deconstruct the "Moral Saints" Problem:**
      *   Susan Wolf's argument: A life devoted *only* to morality lacks the richness of personal passions, quirks, and irrational loves that make someone interesting.
      *   Mara's fear: Being seen as a robot who only cares about utility metrics.
      *   The Toast's Job: Show that her morality *comes from* love, not just calculation. Show that she loves *Dev* specifically, not just the concept of partnership. Show that she has fun, even within her constraints.

  3.  **Identify Key Themes/Angles:**
      *   **Love as a Utility:** Reframe her calculus. To her, love *is* the highest utility. Dev isn't a distraction from the mission; he's part of it.
      *   **The Wedding as a Compromise:** Acknowledge the $2k cap and the AMF donation, but frame it as an act of love for the *guests* (community) rather than just a moral duty.
      *   **Humanizing Mara:** Need to show she's not a robot. She reads philosophy for fun, yes, but she also has friends (the speaker). She agonizes (shows emotion/doubt, not just rigid rules).
