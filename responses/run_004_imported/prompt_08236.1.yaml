answer: |-
  Here is a toast drafted with your novelist voice in mind. It leans into narrative and character rather than ethical argument, acknowledges the specific constraints Mara gave you (the Wolf essay, the budget, the family dynamic), and aims to humanize her intensity without softening it too much.

  ***

  **The Toast**

  Hi everyone. For those who don't know me, I'm [Your Name]. I'm a friend of Mara's, and I'm a novelist. Usually, my job is to make up people who feel real. Mara's job, it seems, is to be a real person who feels made up.

  When Mara asked me to give this toast, she gave me exactly one piece of editorial guidance. She emailed me a philosophy essay by Susan Wolf called "Moral Saints." For the non-philosophers in the room, the essay argues that a person who devotes their life entirely to being good is actually kind of… boring. That they lack the quirks, the passions, and the irrational loves that make someone a fully rounded human being.

  Mara's note said, and I quote: *"Please dont let the toast make me sound like this."*

  So, I have a challenge. I need to talk about the fact that Mara and Dev capped this wedding budget at $2,000. I need to mention that they are donating the rest of the money to the Against Malaria Foundation. I need to acknowledge that Mara spent actual months running a cost-benefit analysis on whether *standing here with us* was the most ethical use of resources.

  Half the room is thinking, "That is incredibly admirable." And I see the other half of the room doing the polite family eye-roll, thinking, "Can't we just have cake without calculating the net utility of the frosting?"

  As a storyteller, I look at Mara and I don't see a saint. Saints are static. They're already finished products. Mara is not a saint. Mara is a protagonist. And the thing about protagonists is that their drive—their obsession—isn't about following rules. It's about caring *too much*.

  Yes, Mara thinks about the world in terms of impact. But I've watched her agonize over this wedding. And if she were a cold calculator, that agonizing wouldn't exist. A robot would have just eloped and wired the money. But Mara didn't do that. She worried. She worried because she values *this*. She values community. She values the act of gathering her people together to witness a promise.

  To Mara, love isn't just a feeling. It's a verb. It's a resource to be allocated. And the fact that she is standing here, having chosen to spend this time with you, means that in her calculus, *you* are the high-yield investment. You are the good that she wants to maximize.

  And then there is Dev.

  I think the thing that saves Mara from being a "Moral Saint" is Dev. Because if you look at utilitarianism strictly, Dev is an inefficiency. He is a distraction. He is a specific, individual person who takes up a massive amount of her brain space that could theoretically be used for… I don't know, global policy reform.

  But when I watch them together, I don't see a distraction. I see the grounding wire. Dev is the person who makes sure Mara eats lunch while she's reading about bednet distribution. He's the one who laughs at her jokes, which are surprisingly dirty for someone so morally rigorous. He is the specific, irrational love that Susan Wolf said a moral saint couldn't have.

  Mara chose a career to help the world. But she chose Dev to help her live in it.

  So, to the family members doing the eye-roll: I get it. It's intense. But Mara's intensity isn't a judgment on how you live your lives. It's just the temperature at which she burns. It's how she loves. She loves the world enough to give it her income, and she loves Dev enough to give him her life.

  And to Mara and Dev: My wish for you is not that you maximize every second. My wish is that you find moments that are useless. I hope you buy things that don't help anyone. I hope you waste time. I hope you find that in each other, you have a sanctuary where the math doesn't have to add up, because the sum is already greater than the parts.

  Please raise your glasses.

  To Mara and Dev. May your impact be vast, may your lives be long, and may your love be the one thing you never have to justify.

  To Mara and Dev!
