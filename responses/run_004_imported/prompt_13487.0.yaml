      *   **Constraint 1 (Technical Accuracy):** Must use Lewis's apparatus correctly (common knowledge, salience, precedent, arbitrariness/alternative regularities). No sloppy usage.
      *   **Constraint 2 (Tone):** Warm, wedding-appropriate, not dryly academic.
      *   **Constraint 3 (The "Arbitrariness" Problem):** Lewis defines convention as *arbitrary* (another equilibrium could have worked). The user is worried this implies the couple is interchangeable or their bond is accidental. The toast needs to address this honestly without undermining the romance.
      *   **Length:** 3-4 minutes (roughly 450-600 words spoken at a moderate pace).

  2.  **Deconstruct Lewis's *Convention* (Key Concepts):**
      *   **Coordination Problem:** A situation where agents have common interests in coordinating their actions.
      *   **Equilibrium:** A combination of actions where no one has an incentive to deviate unilaterally.
      *   **Convention:** A regularity in behavior that is sustained because everyone expects everyone else to follow it, prefers to follow it *if* others do, and there is a *alternative* regularity that could have worked (Arbitrariness).
      *   **Salience:** A feature that makes one equilibrium stand out as the natural choice (e.g., focal points).
      *   **Precedent:** Past solutions to coordination problems guide future expectations.
      *   **Common Knowledge:** Everyone knows $p$, everyone knows everyone knows $p$, etc.

  3.  **Address the "Arbitrariness" Worry:**
      *   *The Problem:* If their relationship is a convention, does that mean they could have easily coordinated with someone else?
      *   *The Solution:* Distinguish between the *meeting* (the coordination problem of seating) and the *marriage* (the commitment). The seating was arbitrary (radiator vs. windowsill vs. back row). The commitment transforms the equilibrium. Once the precedent is set, the "arbitrariness" collapses into "necessity" through the accumulation of shared history. Lewis acknowledges that conventions gain stability over time. The *start* was arbitrary; the *continuation* is grounded in preference, not just coordination.
