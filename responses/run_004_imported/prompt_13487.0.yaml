answer: |-
  Good evening. For those of you who don't know me, I'm the philosophy major in the family. For those of you who *do* know me, you know I've spent the last few weeks obsessing over David Lewis's *Convention*. So, when the bride asked me to speak, and told me she wanted this toast to hold up to scrutiny from the linguists in the room, I realized I had a coordination problem of my own. I need to satisfy the experts without losing the rest of you.

  Fortunately, the story of how [Sister] and [Fiancé] got together is the perfect case study.

  As you know, for a semester, they arrived early to the same speaker series and claimed the same two seats by the radiator. No discussion. No negotiation. Just a regularity in behavior. In Lewis's terms, they had found a coordination equilibrium. Each preferred to sit if the other sat; neither had an incentive to deviate unilaterally. And crucially, it became *common knowledge*: they knew the other knew where they would be, and knew the other knew they knew.

  Now, Lewis insists that for a regularity to be a true convention, it must be *arbitrary*. There must be some other equilibrium that could have worked just as well—like sitting by the windowsill, or the back row. And technically, he's right. If the radiator seats had been taken that first week, they might have coordinated on the windowsill instead. That part was contingent. That part was luck.

  But here is where the philosophy meets the romance, and where Lewis's machinery needs a slight adjustment for matters of the heart.

  Lewis talks about *salience*—the feature that makes one solution stand out as the natural choice. For a long time, [Sister] and [Fiancé] thought the salient feature was the radiator. It was the warm spot. But the windowsill incident proved that wrong. The radiator wasn't the focal point. *They* were the focal point for each other.

  The arbitrariness applies only to the *where*, not the *who*. Yes, they could have coordinated on different seats. But the equilibrium that held wasn't about the furniture; it was about the mutual recognition that the other person was the only one showing up early enough to care. The salience was in their shared dedication.

  And this brings us to the most important Lewisian concept: *precedent*.

  Lewis argues that once a convention is established, past success creates future expectations. But a wedding is more than a sustained convention. A convention persists because it's useful. A marriage persists because it's promised.

  [Sister] and [Fiancé], you started with a coordination problem, but you solved it with a commitment. The "arbitrariness" of your meeting doesn't mean you're interchangeable. It means that out of all the possible equilibria in the world, you locked into *this* one, and through the power of precedent, you turned a contingent accident into a necessary path. You took a fragile regularity and hardened it into a vow.

  So, for the linguists: yes, this is a coordination equilibrium sustained by common knowledge and salience. And for the family: they found each other in a crowded room, and decided never to let go.

  Please raise your glasses. To the radiator, to the windowsill, and to the unique, non-arbitrary love that filled the space between them. To [Sister] and [Fiancé].
