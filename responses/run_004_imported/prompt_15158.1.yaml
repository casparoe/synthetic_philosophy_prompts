prompt: |-
  My friend Priya is getting married next month to another longtime EA (they met at an 80,000 Hours meetup, obviously), and I've been asked to give a toast. Half the wedding party is philosophy PhDs and EA forum regulars who'll clock it immediately if I dodge the obvious tension -- basically the demandingness objection in miniature: if you're a genuinely impartial, scope-sensitive utilitarian, how do you justify spending $30k on a wedding and loving one specific person way more than random strangers, instead of eloping and sending the difference to GiveWell? The other half is just aunts and uncles who want a nice toast about love and have never heard the word "utilitarianism" in their life. I've read enough LessWrong and the EA forum myself to not want a cheap joke that makes the whole thing sound silly, and I definately don't want to paper over it with something false like "consequentialism doesn't really apply to your personal life" -- I want the toast to actually lean on something real, like Scheffler's agent-centered prerogatives or Railton's sophisticated consequentialism, while still landing as warm and funny, about 4 minutes long, with at least one genuine laugh. Can you write it?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding toast for Priya and her partner (let's call him Alex for now, or keep it generic/partner-focused).
      *   **Audience:** Split 50/50.
          *   Group A: Philosophy PhDs, Effective Altruists (EAs), LessWrong readers. They know the "demandingness objection," "impartiality," "scope sensitivity," "GiveWell," etc. They will spot evasion.
          *   Group B: Traditional family (aunts/uncles). They want warmth, love, and no jargon.
      *   **Tone:** Warm, funny (at least one genuine laugh), intellectually honest (no cheap dismissals of EA principles), referencing specific philosophical concepts (Scheffler, Railton) without alienating the non-philosophers.
      *   **Length:** About 4 minutes (roughly 500-600 words spoken at a moderate pace).
      *   **Constraint:** Do *not* say "consequentialism doesn't apply to personal life." Do *not* make it sound silly. Acknowledge the tension between EA ideals and a $30k wedding/monogamous love.

  2.  **Deconstruct the Philosophical Tension:**
      *   *The Problem:* Utilitarianism/EA suggests impartial benevolence. Spending money on a wedding instead of saving lives seems wrong. Loving one person exclusively seems biased.
      *   *The Solution (Philosophical):*
          *   Samuel Scheffler's *Agent-Centered Prerogatives*: We are allowed to give extra weight to our own projects/relationships without being immoral.
          *   Peter Railton's *Sophisticated Consequentialism*: To be a good consequentialist, you shouldn't *try* to be one every second. You need deep, non-instrumental commitments (like love) to function effectively and avoid burnout/alienation.
          *   Burnout/Martian perspective: If you treat your spouse as a "means to utility," the relationship fails, and utility drops.
      *   *The Solution (Emotional):* Love *is* the utility. A strong partnership creates more good in the long run than a miserable sacrifice.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the unique crowd. Set the scene. Introduce the "elephant in the room" (the cost/EA conflict) but gently.
      *   **The "Objection":** Bring up the demandingness objection explicitly but wittily. Address the $30k wedding vs. deworming meds.
      *   **The Philosophical Pivot (The Meat):** Introduce the concepts without jargon overload.
          *   Use Railton: You can't optimize love directly.
          *   Use Scheffler: It's okay to have special obligations.
          *   *Crucial:* Translate this for the aunts. "Love requires blindness to the spreadsheet."
      *   **The Compliment:** Connect the philosophy to Priya and Partner specifically. Why *them*? Their relationship *does* good.
      *   **The Toast:** Bring it home. Warmth + Intellectual nod.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Priya and [Partner] met at 80k Hours. Many of you are EAs. You might wonder why they spent money on cake instead of bednets. It's the demandingness objection. But philosophers like Railton say if you think about utility all the time, you're bad at helping. You need real love. Scheffler says you can be selfish sometimes. So, this wedding is actually utilitarian. Let's drink.
      *Critique 1:* Too dry. Needs more warmth. Needs to flow better for the aunts. The "selfish" word is dangerous. Needs a joke.

  5.  **Drafting - Iteration 2 (Adding Flavor & Jokes):**
      Start with the venue. It's nice. Expensive. The EAs are calculating QALYs right now. I know the objection. But Priya isn't a robot. Railton said sophisticated consequentialists don't act like consequentialists at parties. If you treat your wife like a utility monster, she leaves. Then utility is zero. So this marriage is a long-term bet.
      *Critique 2:* Better. "Utility monster" is a good nod. Need to make sure the aunts understand "utility" means "goodness." Need to emphasize that their love *multiplies* their impact.

  6.  **Refining the Philosophy (Scheffler/Railton):**
      *   *Railton:* "Alienation." If you love someone *because* it helps the world, it's not real love. Real love helps the world *because* it's real.
      *   *Scheffler:* "Prerogative." We are allowed to care more about our inner circle.
      *   *Integration:* Frame it as "Strategic Altruism." A burnt-out altruist helps no one. A supported, loved altruist changes the world.

  7.  **Writing the Toast (incorporating the constraints):**
      *   *Word Count Check:* 4 minutes is roughly 550-600 words.
      *   *Joke:* Need a specific laugh line. Maybe about the open bar cost per life saved.
      *   *Aunt-Proofing:* Define terms contextually. "Maximizing good" instead of "QALYs."

  8.  **Final Polish:**
      *   Ensure the transition from philosophy to emotion is smooth.
      *   Make sure Priya and Partner feel celebrated, not just analyzed.
      *   Check the ending for emotional resonance.

      *(Self-Correction during drafting)*: I initially thought about naming Scheffler explicitly. But for the aunts, that might sound like name-dropping. Better to describe the *idea* ("the philosopher Samuel Scheffler called this...") but keep it brief so it sounds like an insight, not a lecture. Actually, the prompt asks to lean on Scheffler/Railton. I should name them but explain them instantly.

