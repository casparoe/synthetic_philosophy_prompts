answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I've had the privilege of watching Priya and [Partner's Name] build a life together, starting from the moment they met at an 80,000 Hours meetup. Which, honestly, is the most romantic origin story I know. Nothing says "soulmates" like mutually agreeing on the expected value of career pivots.

  Now, looking around this room, I realize we have a unique demographic split. On one side, we have family and friends who are here to celebrate a beautiful union. On the other side, we have a dense cluster of philosophy PhDs and Effective Altruists.

  And because I know this crowd, I know there is an elephant in the room. Actually, it's not an elephant; it's a demandingness objection in miniature.

  Some of you are looking at the floral arrangements, the open bar, and the venue cost, and you are silently calculating how many malaria nets this reception could have purchased. You're wondering: If Priya and [Partner] are truly impartial, scope-sensitive utilitarians, how do they justify spending thirty thousand dollars on a single night of partying, and committing to prioritize each other's happiness over the billions of strangers who need help?

  It's a fair question. But it's one that the best moral philosophy has already answered.

  The philosopher Peter Railton wrote about something called "sophisticated consequentialism." His argument was that if you try to maximize the good in every single interaction, you actually end up producing *less* good. You become alienated. You become a robot. And robots don't make good partners, and they certainly don't sustain the kind of resilience needed to do good work in the world.

  To be an effective altruist, you actually need to be a bad altruist sometimes. You need to love someone irrationally. You need to spend money on memories, not just metrics.

  And this is where Samuel Scheffler comes in with his "agent-centered prerogatives." He argued that we are morally permitted to give extra weight to our own projects and people. Why? Because a world where no one has special commitments is a world where no one has the support system required to change anything.

  Priya and [Partner] aren't eloping to donate the difference because they know that this marriage isn't a diversion from their mission; it is the infrastructure for it.

  I've seen them challenge each other. I've seen them prevent burnout. I've seen them turn a cold calculation about "doing good" into a warm, shared life that makes that good sustainable. If they treated each other merely as means to utility, this relationship would have collapsed years ago. Instead, by loving each other *more* than the abstract average, they've created a base camp from which they can both climb higher.

  So, to the aunts and uncles: This is a toast about deep, enduring love.
  And to the EAs: This is a toast about long-term horizon investing in human capital with high spillover effects.

  [Partner], thank you for being Priya's prerogative. Priya, thank you for being his sophisticated strategy.

  Please raise your glasses. To the optimal outcome. To the bride and groom.
