answer: |-
  You have hit upon one of the most famous and debated cruxes in Thomistic political philosophy. Your reading is sharp: on the surface, Paragraph 46 (endure tyranny, do not kill) and Paragraph 49 (depose/slay tyranny via public authority) appear to contradict one another.

  Scholars have argued about this for centuries. Some argue Aquinas is genuinely conflicted; others argue he is constructing a precise juridical distinction that gets lost if you read it too casually.

  Here is an analysis of how these paragraphs fit together, where the tension lies, and whether Aquinas maintains consistency.

  ### 1. The Core Distinction: Private Presumption vs. Public Authority
  The key to unlocking the apparent contradiction is the distinction between **private individuals** and **public authority**. Aquinas is not arguing about the *act* of removing a tyrant in the abstract; he is arguing about *who has the standing* to perform it.

  *   **Paragraph 46 (The Private/Christian Duty):** Here, Aquinas addresses "strong men" acting on their own. He argues that a private citizen does not have the jurisdiction to judge and execute the head of state. To do so is *sedition*, which disrupts the common good even more than the tyranny itself. His appeal to 1 Peter is theological: for a Christian, the spiritual good of patience and martyrdom can outweigh the temporal evil of suffering under a tyrant.
  *   **Paragraph 48–49 (The Public/Political Duty):** Here, Aquinas shifts from the *individual soul* to the *political body*. He argues that if the king's authority derives from the multitude (or their representatives), the multitude retains a superior authority to remove him if he breaks the "covenant" of kingship.

  **Is this consistent?** Formally, yes. Aquinas is making a juridical point: **Murder is the killing of a legitimate superior by an inferior; Execution is the removal of a corrupt officer by the appointing authority.** In Paragraph 49, the tyrant, by becoming a tyrant, has effectively resigned his claim to legitimacy. Therefore, the "public authority" is not killing a "king," but removing a "criminal" who happens to hold office.

  ### 2. The Aioth (Ehud) Problem
  You noted that Aquinas's handling of Aioth in Paragraph 46 looks like "relabeling." You are largely correct, but there is a specific logic to it.

  Aquinas needs to reconcile the Old Testament (which contains divinely sanctioned violence) with the New Testament (which emphasizes submission). His solution is to deny that Eglon was a legitimate *ruler* over Aioth.
  *   **Aquinas's Logic:** Eglon was a Moabite oppressor of Israel. He was an external enemy holding power by force, not a legitimate sovereign to whom Israel owed a covenant of obedience. Therefore, Aioth was an agent of war/deliverance, not a subject committing regicide.
  *   **The Implication:** This sets up the logic for Paragraph 49. A true tyrant, one who abuses power contrary to the common good, *ceases to be a true king* and becomes more like Eglon (a foe). However, private individuals still cannot make that judgment call (Para 47); only the public authority can declare the king to have become a "foe."

  ### 3. The "Public Authority" Loophole (and the Domitian Example)
  This is where your skepticism is most warranted. You asked: *Is "public authority" doing any real work beyond meaning "a sufficiently large or official-sounding group"?*

  In theory, Aquinas means a constitutional mechanism (like impeachment). In practice, as you noted with Domitian, it often meant a conspiracy ratified after the fact.

  *   **Aquinas's View:** For Aquinas, the "public authority" isn't necessarily a modern bureaucracy. It is whatever body represents the *res publica* (the public thing). In Rome, the Senate represented the state. Even if the physical stabbing was done by conspirators (Stefanus and others), the *moral and legal act* was completed when the Senate declared the deeds null and void and sanctioned the removal.
  *   **The Tension:** You are right to sense that this is a thin line. If a group of nobles kills a king and then claims they are the "public authority," Aquinas's safeguard collapses.
  *   **Why he keeps it:** Aquinas is trying to avoid **anarchy** (anyone can kill a king) without endorsing **absolutism** (no one can ever stop a king). The "public authority" clause is his middle path. It acknowledges that tyranny must be checked, but insists the check must come from the *structure of the state*, not the *whim of the individual*.

  ### 4. The Deeper Tension: Christian Patience vs. Political Justice
  While the *juridical* logic (Private vs. Public) is consistent, there is a genuine *theological* tension between Paragraph 46 and Paragraph 49 that you have identified.

  *   **Paragraph 46** reflects the **Ethics of the Kingdom of God**: Suffering unjustly is "grace." The Christian witness is in endurance.
  *   **Paragraph 49** reflects the **Ethics of the Natural Order**: The Common Good must be protected. A tyrant destroys the community, and the community has a natural right to self-preservation.

  Aquinas does not fully resolve how a Christian member of the "public authority" (e.g., a Christian Senator) navigates this. Should they vote to depose the tyrant (serving the Common Good) or urge patience (serving Christian witness)?
  *   **The Thomistic Synthesis:** Aquinas generally holds that Grace perfects Nature; it does not destroy it. Therefore, political justice (Natural Law) is still binding on Christians. A Christian magistrate has a duty to the common good that a private Christian citizen does not. Thus, the "public authority" can act in ways the "private person" cannot.

  ### 5. Conclusion: Consistency or Tension?
  To answer your specific question: **It is a consistent position with a high risk of practical ambiguity.**

  1.  **Consistency:** Aquinas is consistent in distinguishing between the *private sphere* (where one must endure for conscience' sake) and the *public sphere* (where the community must protect itself). He does not contradict himself on the *principle* of authority.
  2.  **Ambiguity:** You are correct that "public authority" is a fragile barrier. In the medieval context, "public authority" often meant "the barons" or "the senate," which could easily devolve into factional violence. Aquinas hopes that by requiring public authority, he filters out the "wicked" who would kill good kings (Para 47), but history (and the Domitian example) suggests this filter is leaky.

  **Summary for your reading:**
  You are not missing a hidden key; you are seeing the friction between Aquinas's **political realism** (tyrants must be stopped) and his **theological idealism** (Christians should suffer patiently). He bridges them with a legal distinction (Private vs. Public). Whether that distinction holds up in the real world is exactly the puzzle you have identified. Later Scholastics (like Suárez and Mariana) would take Paragraph 49 and run much further with it, eventually arguing that the "public authority" could be the people themselves, a line of thought that got many of them in trouble with monarchs.

  **Recommendation:** Keep reading with this skepticism. It is the correct way to engage with primary texts. When Aquinas moves from "private presumption" to "public authority," ask yourself: *Who counts as the public?* In his time, it wasn't "the voters." It was the elites. That limits the "democratic" feel of Paragraph 49 significantly.
