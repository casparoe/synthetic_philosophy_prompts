answer: |-
  **Title:** The Shattered Mosaic: Why Quantum Entanglement Falsifies Humean Supervenience

  **Introduction**

  David Lewis's metaphysical system, anchored in the doctrine of Humean Supervenience (HS), stands as one of the most ambitious attempts to render the world intelligible through ontological parsimony. For Lewis, the world is a "vast mosaic" of local matters of particular fact—points of space-time endowed with intrinsic qualitative properties. All else, including laws of nature, causation, and chance, supervenes on this arrangement. The appeal of HS lies in its rejection of necessary connections between distinct existences; it promises a world without hidden powers or modal glue. However, the empirical success of quantum mechanics (QM), specifically the phenomenon of entanglement, poses an existential threat to this vision. Entangled states appear to be irreducibly non-separable, defying description via any arrangement of local, intrinsic properties in three-dimensional space. This essay assesses whether HS can survive this challenge through modifications such as enlarging the supervenience base or adopting wave-function realism. I will argue that while technical maneuvers exist to preserve the *label* of Humeanism, they require abandoning the core metaphysical commitments that define the doctrine. Consequently, Humean Supervenience, properly understood as a thesis about local beables, is untenable in light of quantum non-separability.

  **The Humean Ideal and the Quantum Threat**

  To understand the magnitude of the quantum challenge, one must grasp the specificity of Lewis's HS. It is not merely the claim that laws supervene on facts (which a Humean Best System Account, or BSA, could maintain independently). Rather, HS is a claim about the *fundamental base* of that supervenience. Lewis defined the base as an arrangement of "local intrinsic qualities" at points of space-time. "Local" implies that the quality belongs to a point or small region independently of the rest of the universe; "intrinsic" implies it does not depend on relations to other things. This ensures separability: the state of the whole is nothing over and above the states of its parts.

  Quantum entanglement shatters this separability. In a standard EPR (Einstein-Podolsky-Rosen) scenario, two particles share a wave function that determines the probabilities of their joint measurements, yet neither particle possesses a determinate state of its own. The physical reality of the system is holistic; the state of the whole cannot be reduced to the states of the parts plus their spatiotemporal relations. If the fundamental base of the world includes such entangled states, then the base is not composed of local, intrinsic qualities. As Tim Maudlin has forcefully argued, if HS requires the world to be built from independent local facts, and QM demonstrates that the world contains irreducible global facts, then HS is empirically falsified.

  **Rescue Attempt I: Enlarging the Base**

  The first line of defense for the Humean is to modify the definition of the supervenience base. Rather than insisting on local *intrinsic* properties, the Humean might enlarge the base to include fundamental *external relations*. On this view, the mosaic still exists, but its tiles are not just point-properties; they include irreducible relational facts, such as "particle A is entangled with particle B."

  While this move technically restores supervenience (the laws still supervene on *this* broader base), it amounts to a philosophical surrender. The spirit of Humeanism is the denial of necessary connections and the reduction of the modal to the categorical and local. By admitting fundamental, irreducible relations that span distance without a local mediator, the Humean accepts the very "necessary connections" Lewis sought to avoid. If the relational fact is fundamental, it constrains the relata in a way that intrinsic properties do not. This is a concession to Anti-Humeanism, specifically to a form of Ontic Structural Realism, which posits relations as ontologically prior to relata. To save the letter of supervenience by gutting the requirement of locality and intrinsicality is to preserve the shell of HS while discarding its soul.

  **Rescue Attempt II: Wave-Function Realism**

  A more sophisticated defense, championed by David Albert and Barry Loewer, involves Wave-Function Realism (WFR). This approach takes the wave function not as a tool for calculating probabilities in 3D space, but as a concrete physical field existing in a 3N-dimensional configuration space (where N is the number of particles). In this high-dimensional space, the wave function *is* a local quality. It assigns a value to every point in configuration space. Thus, the world is still a mosaic of local qualities, just not in the 3D space of human experience.

  This move preserves the BSA elegantly: the laws of quantum mechanics are the best systematization of the history of the wave function in 3N space. However, this salvation comes at a steep metaphysical cost. The primary motivation for HS was to provide a metaphysics compatible with the manifest image of the world—a world of objects in 3D space. By relocating the fundamental "locality" to an abstract, high-dimensional space, WFR severs the link between the fundamental ontology and the world as we inhabit it.

  Furthermore, this move faces the "ontology gap." If the fundamental reality is a field in 3N space, how do we recover the 3D world of tables, chairs, and detectors? The Humean must argue that 3D objects are merely derived patterns within the 3N mosaic. But if the fundamental base is so removed from our spatiotemporal experience, the epistemic virtue of Humeanism—its claim to be the most intelligible, parsimonious view—is undermined. We are left with a "local" quality in a space we cannot visualize or interact with directly, governing a 3D world that is merely emergent. This looks less like Humean parsimony and more like a Platonic realism of the wave function. While it technically satisfies the definition of supervenience on local qualities, it abandons the *Humean* commitment to a metaphysics grounded in the locality of *our* world.

  **The Verdict: Concession to Anti-Humeanism**

  The critical question is whether these modifications save the Humean project or concede to Anti-Humeanism. Anti-Humeanism generally asserts that laws or structures have a modal force or ontological priority that does not supervene on local categorical facts. It embraces holism and necessary connections.

  The quantum challenge forces the Humean to choose between empirical adequacy and metaphysical integrity. If they stick to Lewis's original base (local 3D qualities), they are empirically wrong. If they modify the base (to include relations or 3N locality), they are metaphysically unrecognizable as Humeans.

  Admitting fundamental relations concedes that the world contains irreducible connections between distinct existences. Adopting 3N realism concedes that the fundamental structure of the world is holistic relative to the 3D space we occupy. In both cases, the Humean accepts that the world is not a collection of independent local existences. This is the definition of Anti-Humeanism. The "Neo-Humean" who adopts WFR is essentially an Anti-Humean about 3D space who retains the BSA machinery for laws. But Humean *Supervenience* is a thesis about the fundamental base of reality. If that base is non-separable with respect to the space we live in, the doctrine fails its primary philosophical test: making the world intelligible as a sum of local parts.

  Moreover, the resilience of the Anti-Humean position lies in its ability to accommodate holism naturally. Powers-based metaphysics or Ontic Structural Realism can treat entanglement as a fundamental feature of reality without needing to shoehorn it into a "local quality" framework via high-dimensional gymnastics. They accept that nature is not Humean. The Humean, by contrast, must engage in contortions to deny the obvious non-separability of the quantum world.

  **Conclusion**

  David Lewis's Humean Supervenience was a bold attempt to ground a modal-free metaphysics on a foundation of local, intrinsic facts. Quantum entanglement demonstrates that no such foundation exists in three-dimensional space. While moves like Wave-Function Realism allow one to retain the *logic* of supervenience by shifting the locus of locality to configuration space, this shift abandons the metaphysical motivations that made Humeanism attractive in the first place. It trades the intelligibility of a local 3D mosaic for a mathematical formalism that treats the 3D world as derivative.

  Therefore, the definite verdict is that Humean Supervenience is not tenable. The modifications required to save it are not clarifications but capitulations. They concede the central Anti-Humean claim: that the fundamental structure of the world involves irreducible, non-local relations or holism that cannot be reduced to an arrangement of local qualities. We may still retain the Best System Account of laws as a useful tool for understanding scientific practice, but we must discard the supervenience base that Lewis proposed. The world is not a Humean mosaic; it is a quantum whole.
