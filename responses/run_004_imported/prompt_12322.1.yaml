      *   *Crux 1: The Definition of "Rational Agent".* Classical game theory assumes causal independence (my move doesn't change your move). Program equilibrium assumes logical correlation (my source code is logically linked to yours).
      *   *Crux 2: The "Program" as a Move.* Is submitting code a credible commitment?
