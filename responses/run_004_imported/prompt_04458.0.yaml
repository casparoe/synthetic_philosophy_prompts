      *   *Counter-argument:* Couldn't he argue that uncontrolled crossings undermine the rule of law (a weighty reason)?
      *   *Rebuttal:* Dummett distinguished between *orderly* control and *exclusion*. If the system creates the irregularity (by closing safe routes), the state shares responsibility. The Rwanda scheme doesn't create safe routes; it punishes the arrival. Dummett would likely argue that if you close legal routes, you cannot morally punish those who arrive irregularly seeking safety.
      *   *Focus on Intent:* Dummett looked at the *motive*. If the motive is deterrence through harshness rather than processing claims fairly, it aligns with his definition of restrictionism driven by hostility rather than necessity.

  7.  **Drafting the Response:**
