      *   *Point 3: The Diagnosis of Racism/Prejudice.* Compare Ukraine vs. Channel. Connect to his 2001 diagnosis of "white Britain."
      *   *Point 4: Moral Evasion.* The outsourcing aspect.
      *   *Conclusion:* It would be judged as the latter (racism/restrictionism), not a legitimate invocation of rights.

