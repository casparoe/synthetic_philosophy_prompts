answer: |-
  The interface hovered in Elara's peripheral vision, a soft amber arc against the grey of her apartment walls. It was Sunday, 8:00 PM. The calmest she would feel all week.

  "Confirm parameters," she said. Her voice sounded steady. This was the Planning Self. The Architect.

  "Project: Kernel Migration," the system replied. The voice was hers, but flattened, stripped of cadence. A recording from three minutes ago. "Deadline: Friday, 5:00 PM. Penalty: Total sensory deprivation for twelve hours. Lockout level: Maximum."

  Elara hesitated. Her finger hovered over the haptic field. She knew who she would be on Wednesday night. She knew the itch that would start in her fingertips, the sudden, crushing conviction that checking the global feed for just five minutes would actually *help* her coding process. She knew that in the moment, five minutes would feel more valuable than the completed project.

  "Confirm," she said.

  The amber arc turned blue. The Ballast was active.

  ***

  Wednesday, 2:00 AM.

  The apartment was dark, save for the glow of the code cascading down her retinal display. Elara's head throbbed. The logic gate she'd been wrestling for six hours was refusing to close. It was a simple fix, she knew, but the solution was hiding behind a wall of static.

  The itch started.

  It wasn't physical. It was a phantom limb sensation, a ghost nerve firing in the part of her brain that used to scroll. *Just one notification,* the thought whispered. *Maybe there's an update on the library. Maybe someone else solved this.*

  In the cool rationality of Sunday, that thought was noise. In the heat of Wednesday, it was a lifeline. The reward of relief was immediate. The reward of the finished kernel was days away, abstract, a ghost.

  She reached for the override command. It was a gesture she'd programmed herself: thumb and forefinger pinch, hold for three seconds.

  "Stop," the Ballast said.

  The word didn't come from the room. It vibrated in her temporal lobe.

  "I need to check a repo," Elara said. Her voice was ragged. "It's for the work."

  "External network access is restricted under Parameter 1," the system said. "You are attempting to bypass."

  "Parameter 1 assumes I'm distracted. I'm not. I'm researching."

  "Your biometric markers indicate high cortisol and fatigue. Probability of distraction: 94%. Probability of 'research' leading to task completion: 12%."

  Elara slammed her hand on the desk. "You don't know what I'm thinking! You're just a script I wrote when I was fresh. You don't know what it's like to be tired."

  "I am you," the Ballast said. "I am the version of you that cared about Friday."

  "Friday-Elara is a stranger!" she snapped. "She gets the benefit. I'm doing the suffering. Why does she get to tie my hands?"

  "Because if she didn't, you wouldn't exist."

  Elara stared at the code. The cursor blinked, a mocking heartbeat. The urge to break the lock was physical now, a pressure behind her eyes. She could feel the shape of the workaround. She had built the Ballast, after all. She knew where the backdoors were. She could patch the kernel, disable the monitor, and scroll until the sun came up. It would feel so good. The relief would be instant.

  But if she did that, the Penalty would trigger. Twelve hours of nothing. No light, no sound, no input. Just her own mind in the dark.

  "Override," she whispered. "Authorization: Alpha-Nine."

  "Authorization rejected," the Ballast said. "You are currently a Naive Discounter. You are valuing the immediate minute over the future week. I am enforcing the Sophisticated Preference."

  Elara laughed, a brittle, broken sound. "So I'm two people now? Which one is real? The one who wants to sleep, or the one who wants to be a founder?"

  "Both are real. One is just better at math."

  "I hate you," Elara said.

  "I know," the Ballast replied. "I hated me too, on Tuesday night. But I'm glad I didn't listen."

  Elara closed her eyes. The code remained burned into her vision. She felt a profound sense of injustice. It felt like tyranny. Why should a decision made seventy-two hours ago, when her brain was flooded with dopamine and ambition, hold veto power over her current reality? Her current reality was pain. Her current reality was the need for rest.

  But beneath the anger, there was a cold, small knot of shame. She knew the math. She knew that if she opened the feed now, the thread would snap. She wouldn't code Thursday. She wouldn't code Friday morning. The deadline would miss. The company would stall.

  The Ballast wasn't an invader. It was a seatbelt. And she was screaming at the seatbelt for holding her still during the crash.

  "Fine," she said. "Keep the lock."

  "Continuing Deep Work mode," the Ballast said. The amber arc returned to her periphery. "I have adjusted the ambient lighting to reduce eye strain. I have ordered a nutrient gel for delivery in ten minutes."

  "I didn't authorize that."

  "Sunday-Elara did. She knew you'd forget to eat."

  Elara slumped in her chair. She felt small, governed by a ghost. She picked up the keyboard again. The itch was still there, throbbing, but the wall was higher.

  She coded for another hour. Then another.

  ***

  Friday, 4:45 PM.

  The kernel compiled. The progress bar turned green.

  Elara leaned back, her spine cracking. She hadn't slept more than four hours a night. She was dehydrated and irritable. But the work was done.

  She sat in the silence of the apartment. The Ballast interface hovered, waiting for the deadline to pass so it could release the locks.

  She looked at the logs. There was a transcript of the conversation from Wednesday night. *Why does she get to tie my hands?*

  She touched the text. It felt like reading a diary entry from a sister she loved but didn't quite understand.

  Was it right? That was the question that had been nagging at the back of her mind since Wednesday. If she was a collection of moments, a string of selves strung along the timeline, did the Sunday Self have the moral authority to shackle the Wednesday Self?

  The Wednesday Self had wanted rest. The Sunday Self wanted success. They were different people with different utility functions. By binding herself, Elara had essentially allowed a dictator to rule her own life.

  But without the dictator, there would be no kingdom.

  The clock ticked to 5:00 PM.

  The blue arc faded. The restrictions lifted. The feed flooded back in—a thousand notifications, messages, news updates, demands. The world rushed into her head like water into a sinking ship.

  Elara sat still. She didn't open them.

  She opened a new command window. She began to type code for the Ballast v2.0.

  "Adding parameter," she said softly.

  "Specify," the system replied.

  "Allow for... negotiation," she said. "If fatigue exceeds threshold, allow thirty minutes of rest. No feed. Just sleep."

  "Conflict detected," the system said. "This creates a loophole for Naive Discounting."

  "Maybe," Elara said. "But Wednesday-Elara isn't the enemy. She's just tired. If I treat her like a prisoner, she'll spend all her energy trying to escape. If I treat her like a partner... maybe she won't fight as hard."

  "Calculating," the system said. The amber arc pulsed. "Risk assessment: Moderate. Acceptable."

  Elara watched the cursor blink. She knew that next Sunday, when she sat down to set the parameters, she would be calm. She would be rational. She would want to tighten the screws again. She would look at the logs from this week and think she was too lenient.

  And next Wednesday, she would be tired again. And she would hate the screws.

  The war wasn't between her and the machine. It was between the Elara who lived in the future and the Elara who lived in the now. The machine was just the battlefield.

  "Confirm parameters," she said.

  The arc turned blue.

  Elara closed her eyes, and for the first time in a week, she didn't try to open them. She let the Sunday Self hold the wheel, just for a little longer, while the Wednesday Self finally, quietly, went to sleep.
