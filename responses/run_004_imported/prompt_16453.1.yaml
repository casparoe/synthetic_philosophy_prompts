      *   *Section 1: The Core Affinity (Subordination).*
      *   *Section 2: Ontological Divergence (Creation vs. Will).*
      *   *Section 3: Methodological Chasm (Metaphysics vs. History).*
      *   *Section 4: Worship and Idolatry (The Crucial Difference).*
      *   *Section 5: Judgment on the Framing.*

  7.  **Final Review against constraints:**
      *   Did I compare mature Newton vs. Arius? Yes.
      *   Did I cover *ousia/hypostasis*? Yes.
      *   Did I cover *ex nihilo*? Yes.
      *   Did I give a judgment on the framing? Yes.

  (Thought process complete.)
answer: |-
  It is excellent that you have turned to Rob Iliffe's *Priest of Nature* (2017). Iliffe is arguably the preeminent scholar on Newton's theological manuscripts, and his work confirms your skepticism: labeling Newton simply as an "Arian" is a historical shorthand that obscures as much as it reveals. While the discussion leader is correct that both men rejected the Nicene consensus, the intellectual architecture supporting their rejections is fundamentally different.

  To prepare for your next session, here is a comparison of Newton's mature antitrinitarianism with Arius's fourth-century Christology, structured around the specific theological and methodological divergences you raised.

  ### 1. The Grounds of Subordination: Ontology vs. Authority
  **Arius** grounded the Son's subordination in **ontology**. For Arius, the Son is subordinate because he is a creature. The famous Arian slogan, "There was when he was not," asserts that the Son had a beginning. He is *heteroousios* (of a different substance) than the Father. He is the highest being, the mediator through whom the world was made, but he is not God in the sense that the Father is God.

  **Newton** grounded the Son's subordination primarily in **authority and will**. While Newton affirmed the Son's pre-existence (distinguishing him from Socinians, who denied it), he was notoriously reticent to define the *ontological* mechanism of that pre-existence. For Newton, the Son is subordinate because the Father possesses a unique "supremacy of dominion." Newton's monotheism was rooted in the idea that "God" is a title of authority (a Governor), not merely a description of essence. The Son is divine because the Father delegated divinity to him, not because he shares the Father's metaphysical substance.

  *   **The Divergence:** Arius argues the Son *cannot* be equal because he is created matter/spirit. Newton argues the Son *ought not* to be worshipped as equal because it violates the monarchy of the Father.

  ### 2. Created *Ex Nihilo* vs. "Begotten"
  **Arius** was explicit: the Son was created *ex nihilo* (out of nothing) by the will of the Father before time began. He is a *ktisma* (creature), albeit a unique one. This was the flashpoint at Nicaea.

  **Newton** is much harder to pin down, largely because he viewed the question itself as a trap laid by Athanasius. In his private papers (such as *Two Notable Corruptions of Scripture*), Newton suggests the Son was "begotten" in a way that implies pre-existence, but he avoids the language of "creation out of nothing." He often leans toward the view that the Son is the "Logos" or the "Word" that was with God, functioning as the Father's agent.
  *   **The Divergence:** Arius accepts the metaphysical binary: either Uncreated (Father) or Created (Son). Newton attempts to bypass the binary. He is less concerned with *how* the Son came to be than with the fact that the Son is the *Mediator* of God's will. In this sense, Newton is sometimes closer to the "Eusebians" (followers of Eusebius of Caesarea) than to Arius proper.

  ### 3. Metaphysical Vocabulary (*Ousia/Hypostasis*) vs. Philology and History
  This is the sharpest distinction between the two men.

  **Arius** operated within the framework of Greek philosophy. The Arian controversy was fought over terms like *ousia* (substance), *hypostasis* (person/subsistence), and *homoousios* (same substance). Arius and his opponents agreed on the rules of the game: they were trying to define the metaphysical relationship between two entities using the best philosophical vocabulary available.

  **Newton** viewed that vocabulary as the problem. To Newton, terms like *homoousios* were unscriptural Greek philosophical corruptions imposed upon Hebrew truth. His method was not metaphysical but **historical and philological**.
  *   **Newton's Approach:** He treated the doctrine of the Trinity as a historical event—a corruption that occurred at a specific time (the 4th century) engineered by specific men (Athanasius and the Alexandrian clergy). He used textual criticism to argue that key Trinitarian proof texts (like the *Comma Johanneum* in 1 John 5:7) were forgeries.
  *   **The Divergence:** Arius sought to define the nature of God using philosophy. Newton sought to recover the "primitive religion" of the early church by stripping away philosophy. Newton's heresy is not a rival metaphysics; it is an anti-metaphysical historical critique.

  ### 4. Worship and Idolatry
  This is perhaps the most significant practical difference.

  **Arius** believed the Son, as a divine creature, was worthy of veneration and worship. The Arian liturgy glorified the Son, just not as *the* One God.

  **Newton** held a much stricter view on worship, closer to modern Unitarianism or Socinianism. For Newton, worship (*latria*) belongs to the Father **only**. To worship the Son as God was, in Newton's eyes, **idolatry**. He viewed the Trinity not just as an error, but as the "Great Apostasy" described in Revelation—a return to pagan polytheism.
  *   **The Divergence:** An Arian can pray to Jesus as a god. A Newtonian prays to Jesus as Lord and Mediator, but directs worship solely to the Father. This makes Newton's position functionally more "Unitarian" than Arius's.

  ### 5. Newton's Idiosyncrasies: Prophecy and Secrecy
  Two final factors make Newton's position unique:
  1.  **Apocalypticism:** Newton's theology was tied to his prophecy studies. He believed that restoring the true worship of the Father was a prerequisite for the Second Coming. Arius had no such apocalyptic timeline; he was concerned with ecclesial unity and doctrinal precision.
  2.  **Secrecy:** Arius sought to win over the Church. Newton sought to hide his views to protect his position (the Lucasian Chair required ordination in the Church of England). This secrecy shaped his theology; it became a private "priesthood of one," whereas Arianism was a public ecclesial movement.

  ### Judgment on the "Fellow Traveler" Framing
  Does your discussion leader's framing do justice to either thinker? **No, not really.**

  Describing Newton's views as "the same heresy, recurring" is historically imprecise. It collapses a 1,300-year gap in intellectual history and ignores the shift from metaphysical theology to Enlightenment historical criticism.

  *   **Why it hurts Arius:** It reduces Arius to a mere "anti-Trinitarian," ignoring his specific Greek metaphysical commitments which Newton explicitly rejected.
  *   **Why it hurts Newton:** It obscures Newton's unique contribution. Newton wasn't just reviving Arianism; he was synthesizing Arian subordinationism with Socinian anti-idolatry and wrapping it in a prophetic, historical-critical method that anticipated modern biblical scholarship.

  **A Better Framing:**
  If you wish to offer a constructive correction at your next meeting, you might suggest that Newton is better understood not as an **Arian**, but as a **Restorationist**.
  *   **Arius** wanted to correct the definition of God within the existing philosophical framework.
  *   **Newton** wanted to dismantle the framework itself to restore the "primitive monotheism" of the Apostles.

  They are "fellow travelers" only in the sense that they both walked away from Nicaea. But Arius walked away carrying a map of Greek metaphysics, while Newton burned the map and tried to navigate by the stars of prophecy and textual history. Recognizing this distinction honors the complexity of Newton's thought (which Iliffe so richly details) and respects the specific historical context of the Arian controversy.

  **Suggested Takeaway for the Group:**
  "Newton agrees with Arius that the Father is supreme and the Son is subordinate. But where Arius argued from *metaphysics* (the Son is a creature), Newton argued from *history* (the Trinity is a corruption). Newton's real heresy wasn't just denying the Trinity; it was claiming that the entire language of 'substance' and 'person' was a pagan invention that Christianity should never have adopted."
