prompt: |-
  Okay so this might sound like a weird tangent but bear with me. For like three weeks now I've been having this running arguement with my brother in law in our family group chat about whether crypto counts as "real" money or if its just a fancy ponzi thing, and while digging for ammo I went down a rabbit hole and found out that George Berkeley — yes, the "esse est percipi," to-be-is-to-be-perceived guy from my old Phil 101 class — actually wrote a whole tract on Irish monetary policy back in the 1730s called The Querist. Apparently his big move in there is to argue that money was never wealth to begin with, just a kind of ticket or counter we use to keep track of who's owed what, and that the real wealth is the industry/labor the ticket lets us mobilize — so on his view even a gold coin is basically just a token, valuable because people trust it and keep it circulating, not because of the metal in it. This came up partly because Ireland at the time apparently had a chronic shortage of actual coin, and Berkeley was arguing (I think partly for a national bank on credit rather than specie) that this didn't matter as much as everyone assumed, since it was industry and circulation doing the real work, not the metal.

  My brother in law's whole case rests on "bitcoin is fake because its not backed by anything real, unlike gold," so I'm wondering whether Berkeley actually hands me a good comeback here, or whether I'm just seeing what I want to see. Could you lay out what you think are the most important implications of Berkeley's specific views on money in the Querist for a modern debate like this, about whether fiat currency or cryptocurrency can count as "real" money despite lacking any intrinsic/commodity backing? I don't want the generic "money is a social construct" answer — I want something that actually engages with what Berkeley's argument does and doesn't get you, including any disanalogies between 1730s Ireland's coin shortage and today's crypto situation that might mean his view is less useful to my side of the arguement than I'm hoping.
