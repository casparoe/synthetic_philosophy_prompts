answer: |-
  No, that is **not a safe simplification**. There is a real, mathematically significant gap between "dominated by a pure strategy" and "dominated by a mixed strategy."

  If you implement only pure-vs-pure comparisons, your solver will fail to eliminate strategies that no rational player would ever use. Consequently, your solver might conclude that a game has multiple solutions (or no unique solution via IEDS) when, in fact, iterated elimination using mixed strategies would yield a unique outcome.

  This is a very common intuition trap. The assumption you are making is that the set of pure strategies is "convex" in terms of payoff performance, but it isn't. A mixed strategy allows a player to access the **convex hull** of the payoff vectors of the pure strategies.

  ### The Counterexample

  Here is a standard $3 \times 2$ game that proves your assumption wrong. Consider Player 1 (Rows) and Player 2 (Columns). The payoffs listed are for Player 1.

  | | Col L | Col R |
  | :--- | :---: | :---: |
  | **Row A** | 3 | 0 |
  | **Row B** | 0 | 3 |
  | **Row C** | 1 | 1 |

  **1. Check Pure vs. Pure:**
  *   Does **A** dominate **C**? No. Against Col R, A pays 0 while C pays 1 ($0 < 1$).
  *   Does **B** dominate **C**? No. Against Col L, B pays 0 while C pays 1 ($0 < 1$).

  If your code only checks pure strategies, it will conclude that **C is not dominated** and must remain in the game.

  **2. Check Mixed vs. Pure:**
  Now, consider a mixed strategy $\sigma$ where Player 1 plays **A** with probability $0.5$ and **B** with probability $0.5$.
  *   **Against Col L:** Expected payoff = $0.5(3) + 0.5(0) = 1.5$.
  *   **Against Col R:** Expected payoff = $0.5(0) + 0.5(3) = 1.5$.

  Compare this to **Row C**:
  *   **Against Col L:** Payoff = $1$.
  *   **Against Col R:** Payoff = $1$.

  Since $1.5 > 1$ in both cases, the mixed strategy $\sigma$ **strictly dominates** Row C. A rational player would never play C, because playing a 50/50 mix of A and B guarantees a higher payoff regardless of what the opponent does.

  ### Why This Happens (The Geometry)

  Think of each row as a vector in a space defined by the opponent's strategies.
  *   Row A is vector $(3, 0)$.
  *   Row B is vector $(0, 3)$.
  *   Row C is vector $(1, 1)$.

  Your code is checking if vector C is strictly less than vector A *or* strictly less than vector B. It is not.

  However, game theory allows players to randomize. Geometrically, mixing strategies allows you to form any point on the line segment connecting vector A and vector B. The midpoint of that segment is $(1.5, 1.5)$. Since $(1.5, 1.5)$ is strictly greater than $(1, 1)$ in every component, C is dominated.

  By ignoring mixed strategies, you are ignoring the interior of the convex hull formed by the pure strategies.

  ### Implications for Your Solver

  If you stick with your simplification:
  1.  **Incorrect Reduction:** You will retain strategies that are irrational to play.
  2.  **Missed Equilibria:** In some games, eliminating a strategy like 'C' above is necessary to reveal that another strategy is subsequently dominated. If 'C' stays, it might protect another row from elimination, causing your IEDS procedure to stop prematurely.
  3.  **Rationality Definition:** You mentioned, "If a row... is genuinely irrational, surely some specific alternative row should already beat it." This contradicts the definition of rationality in game theory. A rational agent maximizes expected utility. If a lottery (mixed strategy) yields higher expected utility than a sure thing (pure strategy C) in all states of the world, choosing the sure thing is irrational.

  ### How to Implement It Correctly

  To check if a pure strategy $s_i$ is dominated by *any* mixed strategy, you cannot use simple loops. You need to solve a **Linear Programming (LP)** problem for each row.

  For a specific row $k$ with payoff vector $u_k$, you want to find a probability distribution $p$ over the *other* rows such that:
  $$ \sum_{j \neq k} p_j \cdot u_j > u_k $$
  for every column.

  In practice, for each row $k$, you set up an LP:
  *   **Variables:** Probabilities $p_j$ for all strategies $j \neq k$.
  *   **Constraints:**
      1.  $\sum p_j = 1$
      2.  $p_j \geq 0$
      3.  $\sum_{j \neq k} p_j \cdot u_j(c) \geq u_k(c) + \epsilon$ for every opponent column $c$. (Here $\epsilon$ is a tiny number to enforce strict inequality).
  *   **Objective:** Maximize $\epsilon$ (or simply check feasibility).

  If the LP is feasible (you can find such probabilities), the row is dominated and can be eliminated. Python's `scipy.optimize.linprog` is perfect for this.

  ### Summary

  The textbooks insist on mixed strategies for dominance because **pure strategies are not sufficient to capture all rational constraints.** Your intuition is logical from a "best single move" perspective, but game theory operates on "best expected outcome" perspective.

  Updating your solver to use Linear Programming for the dominance check will make it significantly more robust and mathematically accurate. It's a great next step for your project!
