          *   They aren't "True" or "False" in the world; they are assertions of *credence*.
          *   *Ernest Adams:* Conditionals don't have truth values; they have *assertability conditions*.
          *   *Robert Stalnaker:* Possible worlds semantics (the conditional is true if B is true in the closest A-world). But Lewis showed this clashes with probability *if* treated as a standard proposition.

      *   **Implication 2: The Betting Pool (The "Practical" Bit):**
          *   This is the crucial part for the user.
          *   How do bookmakers handle "If A, then B"?
          *   *Standard Practice:* The bet is *void* if A doesn't happen. If A happens, it pays on B.
          *   *Mathematical Equivalence:* This *is* effectively pricing at $P(B|A)$.
          *   *Why Lewis doesn't kill this:* Lewis kills the idea that "If A, then B" is a proposition *independent* of the conditioning event that exists *before* A is resolved. But betting contracts are operational.
          *   *De Finetti's Approach:* Betting on conditionals is a bet that is called off if the condition fails. This aligns with $P(B|A)$ without requiring the conditional to be a true/false proposition in the antecedent-false case.

