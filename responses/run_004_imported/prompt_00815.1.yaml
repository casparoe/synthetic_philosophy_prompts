  *Wait, one more nuance:* The Hole Argument. It basically says if you treat spacetime points as real, you can't predict the future uniquely. How to dramatize? Maybe the navigation computer can't resolve their position because "position" is undefined.
  *Decision:* Keep it focused on the *strain* and the *loneliness*. The Hole Argument is too technical for a short story without exposition dumps. Focus on Substantivalism vs. Relationism regarding the rotation.

  *Revised Plan:*
  1. Establish the physical sensation of rotation in the void.
