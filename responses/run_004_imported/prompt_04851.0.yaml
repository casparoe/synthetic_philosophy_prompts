          *   *The Conclusion:* It proves *negative* constraints. It proves you *cannot* have certain structures (cycles) if you want to avoid dominated strategies.
          *   *The "Existence" Claim:* It proves there *exists* a utility function consistent with choices *if* axioms hold.
