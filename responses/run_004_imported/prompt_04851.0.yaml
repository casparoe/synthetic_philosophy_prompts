          3.  They are confused about the asymmetry between *intransitive* preferences (A>B>C>A) and *incomplete* preferences (A?B) regarding money pumps.
      *   **Goal:** A rigorous but accessible walkthrough addressing the three specific points above. No need for full VNM axioms, but more precise than blog hand-waving.

  2.  **Initial Brainstorming & Fact-Checking:**
