      *   *Rohin Shah's Critique:* The "Preferences vs. Behavior" distinction. Any deterministic policy can be represented as maximizing *some* utility function (e.g., $U(\text{history}) = 1$ if action taken, 0 otherwise). This makes the claim "it's an EU maximizer" trivial unless we constrain the *form* of the utility function.
      *   *The Gap:* Having a utility function doesn't mean having a *convergent instrumental goal* or a *simple* goal. A rock can be modeled as maximizing "being a rock." We care about *forward-looking*, *goal-directed* agency.
      *   *Incomplete Preferences:* If I prefer A to B, B to C, but have no preference between C and A, can I be pumped? Standard money pumps rely on strict cycles. If I just say "I won't trade C for A," the cycle breaks. But there are "advanced" money pumps (e.g., the "money pump with foreknowledge" or "dynamic money pump") that try to target incompleteness. I need to explain why incompleteness is more robust than intransitivity.

