answer: |-
  Good evening. For those who don't know me, I'm a friend of the couple, and also a novelist. Which means I'm used to making things up, but tonight I promise to stick to the facts. Although, looking out at the room, I realize we have two distinct tribes here. On one side, we have Marco's soccer team and my Aunt Linda, who are here for the open bar and the cake. On the other, we have the Literature Department, who are here to see if I cite the text correctly. I promise to keep the footnotes to a minimum.

  Talia and Marco met in a graduate seminar, arguing about Jorge Luis Borges. Specifically, they met arguing about time. Now, for Aunt Linda, that sounds like a terrible first date. But for Marco and Talia, it was love. Because they've been having that same argument ever since.

  Marco is a purist. He believes that if you think hard enough, you can argue your way out of the trap. He thinks time is a construct, a illusion, something you can dismantle with enough logic. He wants the perfect theory. Talia, on the other hand, is a realist. She believes that you can write the most brilliant essay in the world about how time doesn't exist, but you still have to meet your deadline, and you still have to show up to your own wedding.

  Marco thinks the essay ends in a failure of nerve. Talia thinks the concession *is* the point.

  And honestly, looking at them today, I have to side with Talia. Because a wedding is not a theory. A wedding is a bet placed on a future that neither of you can prove is real. It is a promise to grow old, which is just a polite way of saying a promise to submit to time. To let it happen to you.

  Marco, I know you're still waiting for the moment where they admit it's all an illusion. **I was going to structure this speech like "The Garden of Forking Paths," but Talia said just pick one timeline and stick to it.**

  But here is the thing about Talia's reading of the text, and about Talia herself: she understands that the magic isn't in escaping the river; it's in swimming in it together. You can deny the self on paper. You can deny matter. But you cannot deny the person standing across from you in the light.

  Marco, you wanted to refute time. Talia knew you just needed to spend it. And today, you are both finally agreeing to the same schedule.

  So, if the scholars in the back are keeping score: Talia wins. The concession stands. The river is real. The tiger is real. And this love, stubborn and persistent and living firmly in the world, is the only refutation that matters.

  To Talia and Marco.
