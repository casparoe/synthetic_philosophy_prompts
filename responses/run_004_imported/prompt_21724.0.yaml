prompt: |-
  I'm a philosophy PhD student and the graduate representative on my department's climate and mentoring committee. Faculty currently give some students unofficial extras -- reading drafts outside formal advising, checking in when a student is struggling -- that everyone treats as supererogatory, not part of the job. The committee is debating whether to make a minimum amount of this 'informal mentorship' an expectation in annual reviews, aimed specifically at improving support for first-generation and international students. Some members think formalizing it is exactly what would kill it: once mentorship is evaluated, it becomes compliance rather than a gift, and needy students get box-checking instead of care. Others think leaving it optional just lets the same generous few absorb the cost while everyone else free-rides. Please draft the memo I'll bring to next week's meeting: recommend a specific policy -- status quo, a mandate, or something in between -- and if you land on a middle path, say exactly what stays optional and what doesn't, and why that line addresses the formalization worry rather than just splitting the difference.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Philosophy PhD Student & Graduate Representative on the Climate and Mentoring Committee.
      *   **Audience:** Faculty members of the committee (and potentially the department chair/head).
      *   **Issue:** Unofficial/extra mentorship (draft reading, check-ins) is currently supererogatory (optional/gift). Debate exists on whether to formalize this as an expectation in annual reviews to support first-gen and international students.
      *   **Conflict:**
          *   *Pro-Mandate:* Prevents free-riding, ensures equitable distribution of labor, supports vulnerable students.
          *   *Anti-Mandate:* Formalization kills the spirit (compliance vs. care), risks box-checking, burdens faculty.
      *   **Task:** Draft a memo recommending a specific policy (Status Quo, Mandate, or Middle Path).
      *   **Constraint:** If choosing a middle path, specify exactly what stays optional vs. mandatory and explain *why* this specific line addresses the formalization worry (not just a compromise).

  2.  **Determine the Best Policy Recommendation:**
      *   *Status Quo:* Unacceptable. It perpetuates inequity. First-gen and international students often lack the social capital to ask for "favors." Relying on the "generous few" leads to burnout and inconsistency.
      *   *Full Mandate:* Risky. As the prompt notes, turning care into compliance can degrade the quality of mentorship. It might also face faculty resistance, leading to passive aggression or minimal effort. It's hard to quantify "care."
      *   *Middle Path (The "Structured Flexibility" Approach):* This is the most philosophically nuanced and practically viable option. It acknowledges the *duty* of mentorship without reducing the *act* of mentorship to a metric.
      *   *The Specific Line:* Distinguish between *availability/access* (mandatory) and *depth/engagement* (guided but flexible). Or, distinguish between *procedural* mentorship (mandatory) and *substantive* mentorship (incentivized/recognized).
      *   *Better Distinction:* Focus on **Proactive Outreach** (Mandatory) vs. **Scope of Labor** (Optional/Guided).
      *   *Refined Distinction:* Make "Proactive Check-ins" a baseline expectation (process), but keep "Extensive Draft Reading beyond advising" as recognized service (outcome).
      *   *Even Better:* The "Mentoring Menu" approach. Define a baseline of *accessibility* that is mandatory, but allow faculty to choose *how* they meet the needs, while explicitly recognizing extra labor in review files without making it a strict quota.
      *   *Decision:* I will recommend a **"Baseline Expectation + Recognition" model**.
          *   *Mandatory:* Proactive, scheduled check-ins for advisees (specifically targeting the "struggling" aspect).
          *   *Optional/Recognized:* Extensive draft reading beyond the norm.
          *   *Why:* This addresses the "free rider" problem by ensuring every student gets basic proactive support (crucial for first-gen who might not ask), but avoids the "box-checking" trap by not quantifying emotional labor or infinite draft revisions. It shifts the culture from "gift" to "professional baseline" for the basics, while honoring the "gift" aspect of extra labor through formal recognition rather than coercion.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the tension. Validate both sides (equity vs. authenticity). State the recommendation clearly.
      *   **The Problem:** Briefly restate why status quo fails (equity gap, burnout of generous faculty).
      *   **The Worry:** Acknowledge the "compliance kills care" argument. It's valid.
      *   **The Proposal (The Middle Path):**
          *   *Component 1 (Mandatory):* "Proactive Accessibility." Two scheduled check-ins per semester *initiated by the faculty member* for all advisees.
          *   *Component 2 (Optional but Recognized):* "Extended Mentorship Labor." Reading drafts outside advising, intensive crisis support. This goes into the "Service/Contribution" section of reviews, not as a pass/fail, but as weighted positive evidence.
      *   **The Philosophical/Practical Justification:** Why this line?
          *   It separates *access* (a right) from *extra labor* (a gift).
          *   It solves the first-gen problem (they don't have to ask for the basics).
          *   It solves the compliance worry (you can't mandate genuine care, but you can mandate showing up).
          *   It solves the free-rider problem (everyone does the baseline).
      *   **Implementation:** How to track this without bureaucracy? Self-reporting in annual reviews with student feedback correlation.
      *   **Closing:** Call to action.

  4.  **Refining the Tone:**
      *   Needs to be respectful but firm.
      *   Philosophical sensitivity (use terms like "supererogatory," "structural inequity," "alienation").
      *   Practical enough for administrators.
      *   As a grad rep, I need to advocate for students without sounding adversarial to faculty.

  5.  **Self-Correction/Critique during drafting:**
      *   *Critique:* Is "two check-ins" too bureaucratic?
      *   *Fix:* Frame it as "Proactive Outreach" rather than a specific number, but suggest a number as a guideline. Actually, for a policy recommendation, specificity helps. Let's stick with "Proactive Outreach" as the expectation, defined as initiating contact at key intervals.
      *   *Critique:* Does recognizing extra labor in reviews just create a different kind of pressure?
      *   *Fix:* Emphasize that it is *weighted positively* but not *required for tenure/promotion*. It distinguishes "meets expectations" from "exceeds expectations."
      *   *Key Insight:* The core philosophical move is distinguishing between *justice* (what is owed) and *charity* (what is given). The current system treats basic support as charity. The proposal treats basic support as justice, and extra support as honored charity.

  6.  **Final Polish:** Check against the prompt requirements.
      *   Recommend specific policy? Yes (Middle Path).
      *   Say exactly what stays optional/mandatory? Yes (Proactive contact vs. Extra draft reading).
      *   Explain why this addresses the formalization worry? Yes (Distinguishes access from intensity).

  7.  **Final Output Generation** (Proceeding to draft the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Climate and Mentoring Committee
  **FROM:** [Your Name], Graduate Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Structured Mentorship Expectations in Annual Reviews

  **1. Purpose**
  This memo addresses the committee's ongoing debate regarding the formalization of informal mentorship. Specifically, we must decide whether to maintain the status quo (where extra support is supererogatory), mandate specific mentorship activities in annual reviews, or adopt a hybrid model.

  After consulting with the graduate student body and reviewing the faculty concerns regarding "compliance vs. care," I recommend a **middle path: The "Baseline Access & Recognized Labor" Model.**

  **2. The Problem with the Status Quo**
  Currently, unofficial mentorship (e.g., reading drafts outside advising limits, proactive wellness check-ins) is treated as a gift. While many faculty provide this generously, relying on voluntarism creates two structural inequities:
  *   **The Social Capital Gap:** First-generation and international students often lack the cultural capital to identify when they need help or to feel entitled to ask for "favors." Consequently, they receive less support than peers who are comfortable demanding faculty time.
  *   **The Labor Imbalance:** Mentorship labor falls disproportionately on a minority of faculty (often women and junior faculty), leading to burnout, while others free-ride on the department's overall climate without contributing.

  **3. The Risk of Full Formalization**
  The concern that mandating mentorship kills its spirit is philosophically sound. If we reduce care to a metric (e.g., "read three drafts"), we risk alienating faculty from their own labor. Mentorship becomes box-checking, and the *quality* of engagement may drop even if the *quantity* rises. Genuine concern cannot be coerced.

  **4. Recommendation: The "Baseline Access & Recognized Labor" Model**
  I propose we draw the line between **access** (which is a matter of justice) and **intensity** (which is a matter of professional generosity).

  **A. What Becomes Mandatory (The Baseline)**
  *   **Policy:** All primary advisors must initiate **two proactive check-ins per semester** with their advisees, documented briefly in the annual review.
  *   **Definition:** These are not just administrative meetings. One must specifically address "professional development and well-being" outside of immediate coursework or dissertation deadlines.
  *   **Why this line?** This addresses the equity gap without mandating "care." First-generation and international students often wait to be invited to speak about struggles. By making *outreach* mandatory, we ensure access is not dependent on a student's ability to ask. It shifts the burden of initiation to the power-holder (faculty). This is not box-checking; it is ensuring the channel of communication is open.

  **B. What Remains Optional but Recognized (The Supererogatory)**
  *   **Policy:** Extensive draft reading beyond the agreed advising scope, crisis intervention, and career networking assistance remain optional. However, these activities must be explicitly **weighted as Service/Contribution** in annual reviews and tenure files.
  *   **Definition:** Faculty self-report these activities. The Department Chair will calibrate reviews to ensure this labor is valued equally with publishing or committee work.
  *   **Why this line?** This addresses the "compliance kills care" worry. We are not forcing faculty to pour unlimited emotional labor into every student. However, by formally recognizing this labor in reviews, we stop treating it as invisible. It incentivizes the behavior without coercing the *emotion* behind it. It allows the generous faculty to be credited for their generosity, rather than exploited for it.

  **5. Addressing the Formalization Worry**
  This proposal does not merely split the difference; it re-categorizes the nature of the labor.

  *   **Against Alienation:** By mandating only *availability* (initiating contact) rather than *outcome* (fixing the student's problem), we respect faculty autonomy. You are required to open the door, not required to carry the student through it. This preserves the authentic relationship building that happens *after* the door is open.
  *   **Against Inequity:** The status quo treats basic professional accessibility as a "gift." This policy reclassifies basic accessibility as a **professional duty**. It is not unreasonably burdensome to expect an advisor to ask, "How are you doing?" twice a semester.
  *   **Against Free-Riding:** The mandatory baseline ensures every faculty member contributes to the department's climate. The recognition model ensures that those who do *more* are not penalized in their research time but are instead rewarded in their service evaluation.

  **6. Implementation**
  *   **Trial Period:** Implement for two academic years.
  *   **Documentation:** A simple log in the annual review template (e.g., "Dates of proactive advisee outreach").
  *   **Feedback Loop:** The Climate Committee will survey students annually to assess if the *quality* of mentorship has improved, ensuring the mandate hasn't become performative.

  **7. Conclusion**
  We cannot mandate virtue, but we can mandate visibility. By ensuring every student has a guaranteed baseline of access, we protect the vulnerable. By formally recognizing extra labor, we protect the generous. I urge the committee to adopt this hybrid model to foster a climate that is both equitable and authentic.

  I look forward to discussing this at next week's meeting.
