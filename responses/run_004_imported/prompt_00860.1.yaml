      *   *Critique:* Make sure to emphasize *why* it's hard to close. It's not just "we haven't found the answer." It's that any answer seems to either beg the question or launch a regress.
      *   *Refinement on Bird:* The specific criticism often comes from Mumford or Ellis critics. The point is that even if $F$ essentially causes $G$, the inference from "F-ness is essentially causative of G" to "This F will cause G" requires a bridge principle about instantiation.

