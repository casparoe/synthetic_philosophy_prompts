prompt: |-
  I'm a philosophy PhD student drafting a dissertation chapter on Bayesian confirmation theory, and I want to pressure-test my grasp of Clark Glymour's problem of old evidence: the worry that ordinary conditionalization cannot register any confirmation from evidence E once P(E) is already 1, even in paradigm cases like General Relativity's entailment of the previously known anomalous precession of Mercury's perihelion. Rather than rehearsing that case, could you construct a distinct, self-contained example of the very same structural problem, drawn from a science other than physics? After presenting it, please walk through concretely how the Garber-Jeffrey strategy — treating an agent's discovery that "H entails E" as itself fresh, logical evidence — would apply to your example, and flag any point at which relaxing logical omniscience in this way seems to undercut the coherence conditions that motivate Bayesian updating in the first place.
