prompt: |-
  I sit on the three-person committee that oversees a shared betting bankroll built up over two years by a local Astral Codex Ten meetup trading political and macroeconomic questions on Manifold and Polymarket. Our strongest forecaster, whose edge rests on a track record of only about forty resolved markets, wants the committee to size every position at full Kelly against her own probabilities, arguing that the criterion exists precisely for this purpose and that anything more conservative just forfeits growth for no principled reason. The rest of us are uneasy: several of her highest-conviction positions are correlated with each other, and a few members may need their share of the pool back on short notice. Please draft the memo I'll circulate before our next meeting: it should recommend a specific position-sizing rule with a date for revisiting it, and it should engage her argument on its own mathematical terms rather than answering it with generic appeals to caution.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A three-person committee overseeing a shared betting bankroll (Astral Codex Ten meetup group).
      *   **Source of Funds:** Built up over two years trading political/macro questions on Manifold and Polymarket.
      *   **Conflict:** The strongest forecaster (40 resolved markets track record) wants *full Kelly* sizing based on her probabilities. The rest of the committee are uneasy due to correlation risk and liquidity needs (members might need money back).
      *   **Task:** Draft a memo to circulate before the next meeting.
      *   **Requirements:**
          *   Recommend a specific position-sizing rule.
          *   Set a date for revisiting the rule.
          *   Engage the forecaster's argument on *mathematical terms* (not just "better safe than sorry").
          *   Tone: Professional, collaborative, rational, aligned with the ACX/rationalist community vibe (intellectually rigorous but pragmatic).

  2.  **Deconstruct the Arguments:**
      *   **Forecaster's Argument:** Full Kelly maximizes long-term geometric growth rate. Any fraction less than 1 reduces expected growth without eliminating ruin (in the theoretical limit). She cites the mathematical definition of the Kelly Criterion.
      *   **Committee's Concerns:**
          *   *Track Record:* 40 markets is statistically significant but not definitive. There's uncertainty in the *edge* itself. Kelly assumes you know the true probability $p$. If you overestimate $p$, Full Kelly becomes overbetting, which drastically increases volatility and risk of ruin.
          *   *Correlation:* Kelly is typically derived for independent bets. Correlated bets increase the variance of the portfolio. If multiple high-conviction bets lose together, the drawdown is deeper than Kelly anticipates.
          *   *Liquidity/Utility:* The utility function of the members isn't purely logarithmic wealth over infinite time. They have finite horizons and potential liquidity shocks. A 50% drawdown might force a withdrawal at the bottom, realizing the loss.

  3.  **Formulate the Counter-Argument (Mathematical Engagement):**
      *   *Parameter Uncertainty:* The biggest mathematical flaw in applying Full Kelly to real-world forecasting is estimation error. If the forecaster says 60% but the true probability is 55%, Full Kelly bets too much. "Fractional Kelly" is mathematically equivalent to Full Kelly *under uncertainty* about the edge.
      *   *Correlation:* The portfolio Kelly criterion requires the covariance matrix. If we treat bets as independent when they aren't, we overleverage. A simple heuristic is to reduce the fraction to account for unmodeled correlation.
      *   *Utility Function:* Kelly maximizes $E[\log(Wealth)]$. This implies a specific risk aversion. If members have liquidity constraints, their effective utility function has a "cliff" (need money by date $X$). This necessitates a lower volatility path.

  4.  **Develop the Recommendation:**
      *   *Rule:* Half-Kelly (or Quarter-Kelly). Half-Kelly is a standard rationalist compromise. It reduces volatility by 50% while retaining 75% of the growth rate.
      *   *Constraint:* Cap exposure to correlated clusters.
      *   *Liquidity:* Maintain a cash reserve.
      *   *Review Date:* Needs to be after enough new data comes in to update the track record. 6 months seems reasonable for political/macro markets.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the forecaster's contribution and the validity of Kelly in theory. Establish shared goals (growth + sustainability).
      *   **The Mathematical Case for Fractional Kelly:**
          *   Address the "known probability" assumption. 40 markets $\rightarrow$ confidence intervals on skill.
          *   Cite the "Uncertainty implies Fractional Kelly" theorem (e.g., from *Thorp* or *MacLean et al.*). If we are unsure about our edge, Half-Kelly is often optimal.
          *   Address Correlation: Independent Kelly sums up. Correlated Kelly requires covariance adjustment. Lacking a precise model, scaling down is the robust control solution.
      *   **Liquidity & Utility:**
          *   Kelly assumes infinite horizon. We have potential withdrawal needs.
          *   Drawdowns matter more if withdrawals happen during them.
      *   **The Proposal:**
          *   Adopt **Half-Kelly** on individual positions.
          *   Implement a **Correlation Cap** (e.g., no more than X% of bankroll in a single thematic cluster).
          *   Maintain a **Liquidity Buffer** (e.g., 20% in stablecoins/cash).
      *   **Review Mechanism:**
          *   Re-evaluate in 6 months.
          *   Metrics: Calibration, Brier Score, Max Drawdown.
      *   **Closing:** Invite discussion.

  6.  **Refining the Tone:**
      *   Avoid sounding like a scared banker. Sound like a fellow rationalist.
      *   Use terms like "estimation error," "covariance," "utility function," "geometric growth."
      *   Ensure the forecaster feels heard, not overruled by emotion.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 40 markets enough to claim an edge?
      *   *Fix:* Acknowledge it's promising but implies wide confidence intervals.
      *   *Critique:* Is Half-Kelly arbitrary?
      *   *Fix:* Explain the growth/volatility trade-off curve (75% growth for 50% variance).
      *   *Critique:* What about Manifold vs. Polymarket?
      *   *Fix:* Keep it general, but acknowledge liquidity differences implicitly via the buffer.
      *   *Critique:* The prompt asks for *one* specific position-sizing rule.
      *   *Fix:* Make Half-Kelly the core rule, with correlation caps as a constraint on the *application* of that rule.

  8.  **Final Polish:** Check against ACX culture (intellectual honesty, Bayesian updating, community focus). Ensure the date is specific. (Let's pick a date 6 months out).

  **(Self-Correction Note):** Make sure to explicitly mention that Full Kelly assumes *known* probabilities, which is the key mathematical lever here.

  9.  **Final Output Generation** (Proceed to draft based on these points).
answer: |-
  **MEMORANDUM**

  **TO:** The Bankroll Committee & Lead Forecaster
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Position Sizing Framework & Risk Protocol

  **1. Objective**

  This memo proposes a position-sizing framework for our shared bankroll. Our goal is to maximize long-term geometric growth while ensuring the pool remains liquid enough to meet member withdrawal needs and robust enough to survive variance inherent in our estimation processes.

  We all agree on the theoretical validity of the Kelly Criterion: for a bettor with a known edge and known probabilities, Full Kelly maximizes the expected logarithmic growth rate of wealth. However, the application of Full Kelly relies on strict assumptions that do not fully hold in our current operational context. This proposal outlines a modification to the sizing rule that addresses these deviations on mathematical grounds rather than purely prudential ones.

  **2. Mathematical Limitations of Full Kelly in Our Context**

  The Lead Forecaster correctly notes that deviating from Full Kelly forfeits some theoretical growth rate. However, this holds only if the input probabilities are precise. We face three specific mathematical conditions where Full Kelly becomes suboptimal or dangerous:

  *   **Parameter Uncertainty (Estimation Error):** The Kelly fraction $f^* = (p - q) / b$ assumes $p$ (the probability of winning) is known. In our case, $p$ is an estimate derived from a track record of ~40 resolved markets. While promising, this sample size implies a significant confidence interval around our true calibration.
      *   *Theorem:* As demonstrated by Thorp (1969) and MacLean et al. (2005), when there is uncertainty regarding the edge itself, **Fractional Kelly** is the optimal strategy. If we treat our estimated probabilities as a distribution rather than a point value, betting Full Kelly on the mean estimate constitutes overbetting. Half-Kelly is mathematically equivalent to Full Kelly under a specific degree of uncertainty regarding the advantage.
  *   **Correlation Risk:** The standard Kelly derivation assumes independent bets. Our forecaster's high-conviction positions often share underlying macroeconomic or political drivers (e.g., multiple bets contingent on the same election outcome or Fed decision).
      *   *Impact:* Positive correlation increases the variance of the portfolio log-returns. Without modeling the full covariance matrix of every position, applying Full Kelly to individual bets results in an aggregate leverage that exceeds the portfolio-optimal Kelly level. Scaling down the individual fractions is a robust control method to account for unmodeled covariance.
  *   **Finite Horizon & Liquidity Constraints:** Kelly maximizes growth over an infinite horizon with a logarithmic utility function ($U = \log(Wealth)$). However, committee members have finite horizons and potential liquidity shocks.
      *   *Utility:* If a member must withdraw capital during a drawdown, the effective utility function includes a "cliff" risk that $\log(Wealth)$ does not capture. Reducing volatility via fractional Kelly lowers the probability of deep drawdowns, aligning the growth path better with our actual liquidity constraints.

  **3. Recommendation: The Half-Kelly Protocol**

  To balance growth optimality against estimation error and correlation risk, I recommend the committee adopt the following rule:

  **A. Position Sizing:**
  All positions will be sized at **50% of the Full Kelly fraction** calculated from the Lead Forecaster's probabilities.
  *   *Rationale:* Half-Kelly retains approximately 75% of the expected geometric growth rate of Full Kelly while reducing the variance of returns by 50%. This provides a substantial "safety margin" against overconfidence in our probability estimates without sacrificing the majority of our edge.

  **B. Correlation Caps:**
  No single thematic cluster (e.g., "US 2024 Election," "Fed Rates Q1 2024") may exceed **20% of the total bankroll** in exposure, regardless of individual Kelly sizes.
  *   *Rationale:* This acts as a hard constraint on the covariance risk mentioned above, preventing a single macro event from triggering a ruin-level drawdown.

  **C. Liquidity Buffer:**
  **20% of the bankroll** will be held in stablecoins or cash equivalents at all times, unavailable for betting.
  *   *Rationale:* This ensures that member withdrawal requests can be met without forcing the liquidation of active positions at unfavorable prices.

  **4. Review Timeline**

  This protocol is not permanent. It is a Bayesian prior that should be updated as our track record lengthens and our estimation of the forecaster's calibration tightens.

  **Review Date:** April 26, 2024 (6 Months)

  **Metrics for Re-evaluation:**
  At the six-month mark, we will review:
  1.  **Calibration:** Has the forecaster's Brier score and calibration curve improved over the next ~50 resolved markets?
  2.  **Drawdown:** Did the portfolio experience drawdowns exceeding the volatility tolerance of the members?
  3.  **Liquidity:** Were any withdrawal requests impeded by the current structure?

  If the track record extends to ~100+ markets with strong calibration and liquidity needs remain low, we may discuss moving to a 75% Kelly fraction. If calibration worsens or correlations cause unexpected variance, we will discuss reducing to Quarter-Kelly.

  **5. Conclusion**

  This proposal accepts the Kelly framework as our foundation but adjusts for the reality that our probabilities are estimates, not known constants. By adopting Half-Kelly, we acknowledge the uncertainty in our edge while still aggressively compounding the bankroll.

  Please review this framework prior to our meeting on [Date of Meeting]. I look forward to discussing the specific parameters of the correlation caps.
