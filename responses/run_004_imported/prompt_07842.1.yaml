      *   *Weil Specifics:* Ensure I quote or paraphrase her specific concepts ("collective passion," "pressure brought to bear on minds," "growth of the party").
      *   *Tone Check:* Is it too academic? Needs to sound like a student leader talking to peers. Keep it grounded in student gov reality (budget votes, policy debates).

  6.  **Final Polish:**
      *   Check constraints: Timeframe included? Yes. Specific Weil mechanisms? Yes. No strawmanning? Yes.
      *   Make sure the recommendation is actionable. "Amend Bylaw X to prohibit..."

  7.  **Final Review against Weil's Text:**
