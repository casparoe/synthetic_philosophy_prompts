answer: |-
  Thank you all for coming. For those who don't know me, I'm a friend from the study group Miriam led for six years.

  If you knew Miriam well, you know that standing here is a hazardous assignment. She was exacting. There is a story, perhaps apocryphal, from a potluck years ago. Someone, trying to be comforting after a loss, said, "Well, in a way, he both exists and doesn't exist now." Miriam put down her fork and spent twenty minutes explaining why that was not deep wisdom, but a logical error that Nāgārjuna specifically dismantled in chapter twenty-five of the *Mūlamadhyamakakārikā*. She believed that sloppy thinking about reality was a form of unkindness. If we are to honor her, we cannot honor her with soothing falsehoods.

  Among her papers, there was a note regarding this occasion. It read: "No smuggling. Do not smuggle a self in through the back door by promising I persist in your memory. Do not flatten me into bare non-existence, as though that weren't its own quiet reification."

  This puts me in a bind. A eulogy is traditionally a place to say where someone has gone, or how they remain. But Miriam's life work was to show that "going" and "remaining" are concepts that break down when pressed. To say she *exists* now is eternalism. To say she *does not exist* is nihilism. To say she *both does and does not* is a contradiction. To say she *neither does nor does not* is evasion. She taught us that the tetralemma—the four corners of logical possibility—offers no foothold for the mind to rest on regarding the dead.

  So, I cannot tell you she is at peace. I cannot tell you she is gone. I cannot tell you she lives on in this room. By the standards of her own philosophy, all of these statements are ultimately untenable.

  And yet, we are here. Forty people. Grieving. Missing her.

  This is where we must rely on the distinction Miriam taught us most carefully: the Two Truths. There is the ultimate truth, where no inherent self can be found, where no entity passes from time to time. And there is the conventional truth (*saṃvṛti-satya*)—the truth of the everyday, of language, of cause and effect, of tears.

  In ultimate truth, I cannot speak of Miriam. But we do not live in ultimate truth. We live in the conventional world. And in the conventional world, Miriam was here. She was a force of nature. She was a woman who drank too much coffee, who corrected your syntax with a smile, who made you feel that clarity was a moral obligation.

  In the conventional world, causes produce effects. Miriam was a cause. We are the effects.

  When I say "we are the effects," I do not mean she lives inside us. That would be the smuggling she forbade. I mean that the shape of our minds has been altered by her presence. A stone thrown into a pond does not stay in the water, but the ripples are real. The ripples are not the stone. But without the stone, the ripples would not be.

  To the family and friends here who may not care for the philosophy: I know this sounds cold. It sounds like I am analyzing a loss rather than feeling it. I want to be clear: Emptiness is not a shield. Understanding that things lack inherent existence does not stop the heart from breaking. In fact, Miriam argued that it makes the breaking more vivid. Because there is no permanent self to protect, there is only the raw, unmediated contact of care.

  We grieve because we were dependent on her. Dependent origination is not just a metaphysical theory; it is a description of love. We relied on her sharpness to check our vagueness. We relied on her presence to anchor our practice. That reliance was real. The pain of its disruption is real. To deny that pain in the name of "spiritual transcendence" would be to violate the conventional truth. It would be to lie.

  So, here is the tension, and I think she would want us to acknowledge it honestly. There is a pull between the comfort we need and the rigor she demanded. The rigor says there is no one here to mourn and no one there who is missed. The heart says there is a hole in the world where Miriam used to be.

  We cannot resolve this tension. To resolve it would be to pick a corner of the tetralemma. It would be to claim either that the grief is an illusion or that the self is solid. We have to hold both. We have to stand in the space where the logic dissolves, and the tears fall anyway.

  For the students in the room: She asked us to work through the text verse by verse. Not to memorize it, but to let it dismantle our reflexes. The greatest tribute we can pay her is not to turn her into a saint or a memory, but to continue the inquiry. When you find yourself reaching for a comforting metaphysical claim—that she is "watching over us," or that she has "moved on to a better place"—hear her voice correcting you. Not to be cruel, but to keep you honest. To keep you from reifying a ghost.

  For her family: She loved you with the same intensity she brought to philosophy. She did not love you because you were "hers," but because the conditions for love were present. That love was not less real because it was empty. It was real *because* it was empty. It was not a transaction between two solid selves; it was a dynamic event of care. That event happened. It cannot be undone.

  We cannot say where she is. We can only say where she is not. She is not in the past, because the past is gone. She is not in the future, because the future has not arisen. She is not in the present, because the present is a knife-edge that cannot be held.

  But the conversation she started is still happening. Right now. In this room. In the way we look at each other. In the way we question our own certainty.

  Miriam spent her life clearing away the conceptual clutter that keeps us from seeing things as they are. She would not want us to clutter her death with projections. She would want us to see this moment clearly. The grief. The silence. The absence.

  Let us not pretend she is here. Let us not pretend she is gone. Let us simply acknowledge that the causes she set in motion have brought us to this chair, on this Sunday, with this heavy heart.

  In the conventional truth, we miss her. In the ultimate truth, there is no one to miss and no one missed. We have to live in both. We have to grieve the person while respecting the emptiness.

  Thank you, Miriam, for the rigor. Thank you for the kindness that hid inside the correction. Thank you for showing us that the only way to be truly comfortable with uncertainty is to stop trying to be comfortable at all.

  We will take it from here.
