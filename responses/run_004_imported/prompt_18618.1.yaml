  Here's a thinking process that leads to the eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A member of a study-and-meditation group (6+ years).
      *   **Deceased:** Miriam, a retired analytic philosopher, Madhyamaka scholar, group leader. Died 3 weeks ago.
      *   **Audience:** ~40 people. 50% dharma/philosophy folks (will spot philosophical errors), 50% family/friends (need emotional resonance, not jargon).
      *   **Key Constraint:** Must adhere to Nāgārjuna's *Mūlamadhyamakakārikā* (MMK) logic regarding the *catuṣkoṭi* (tetralemma). Cannot assert existence, non-existence, both, or neither regarding her current state. Cannot smuggle in a "self" via memory or legacy as a form of persistence. Cannot flatten her into bare non-existence.
      *   **Key Concept:** Two Truths (Conventional vs. Ultimate). Needs to find consolation in Conventional Truth (*saṃvṛti-satya*) without violating Ultimate Truth (*paramārtha-satya*).
      *   **Tone:** Exact, rigorous, yet warm and grieving. Acknowledge tension if it exists. No "vibe-based" Buddhism.
      *   **Length:** About 8 minutes read aloud (approx. 1000-1200 words at a moderate pace).

  2.  **Deconstruct the Philosophical Challenge:**
      *   *The Trap:* Eulogies naturally tend toward "She lives on in our hearts" (Existence/Both) or "She is gone forever" (Non-existence).
      *   *Miriam's Stance:* Nāgārjuna refutes all four positions regarding the Tathagata after death (MMK Chapter 22). To say she *exists* is eternalism. To say she *doesn't exist* is nihilism. To say *both* or *neither* is conceptual confusion.
      *   *The Solution:* Rely heavily on Dependent Origination (*pratītyasamutpāda*) and Conventional Truth. We speak of her *now* because the causes and conditions for speaking of her are present. Her impact is a causal flow, not a persisting entity. Grief is real conventionally, even if the "griever" and the "grieved" are empty ultimately.
      *   *The Tension:* The prompt explicitly allows (and encourages) acknowledging the tension between the need for comfort and the rigor of emptiness. Don't fake a resolution that isn't there.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Set the scene. Mention Miriam's specific intellectual character (the "potluck terror"). This builds credibility with the philosophers and humanizes her for the family.
      *   **The Philosophical Constraint (The "Elephant in the Room"):** Address the *catuṣkoṭi* directly but accessibly. Explain *why* we can't say the usual comforting things. This respects her legacy and warns the philosophers I'm not cheating.
      *   **Conventional Truth (The Heart of the Eulogy):** This is where the emotion lives. How do we speak of her without reifying her? Focus on *function* and *causality*. She caused changes in us. Those changes are real conventionally.
      *   **Grief:** Validate grief without making it about a permanent loss of a permanent self. Grief is the shape of care.
      *   **The Tension:** Acknowledge that this doesn't stop the pain. Emptiness isn't a shield.
      *   **Closing:** A return to the practice. Not a farewell to a soul, but a commitment to the path she walked.

  4.  **Drafting - Specific Phrasing & Tone Check:**
      *   *Avoid:* "She is watching us," "She lives on," "She is at peace," "She is nothing now."
      *   *Use:* "The causes she set in motion," "The conversation continues," "Conventionally, she is here."
      *   *Jargon Check:* Use *catuṣkoṭi* and *saṃvṛti-satya* but define them or contextuaize them immediately for the lay audience.
      *   *Voice:* Respectful, slightly academic but deeply personal. Not dry.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe say she exists in our memories.
      *   *Correction:* No, her note forbids "smuggling a self in through the back door." Memory is a present mental event, not a container for her. Frame it as *our* transformation, not *her* persistence.
      *   *Initial thought:* Say she is empty so we shouldn't grieve.
      *   *Correction:* Absolutely not. That's "spiritual bypassing." Emptiness allows grief to be real without being solid.
      *   *Pacing:* 8 minutes is roughly 1000-1100 words. I need to make sure I don't rush the philosophical explanation but also don't bore the family.

  6.  **Writing the Draft (incorporating the "Two Truths" strategy):**
      *   Start with the potluck story. It's vivid.
      *   Move to the instruction in her papers.
      *   Explain the tetralemma simply: We can't say she is, isn't, both, or neither.
      *   Pivot to Conventional Truth: We are here. She was here. The causal link is here.
      *   Address the grief: It hurts because dependence is real.
      *   End with the practice: We continue the inquiry.

  7.  **Review against Constraints:**
      *   Did I assert existence? No.
      *   Did I assert non-existence? No.
      *   Did I use "both/neither" as a cop-out? No.
      *   Is it comforting? Hopefully, in a stark, honest way.
      *   Is it 8 minutes? (Word count check needed).

  8.  **Final Polish:** Check the rhythm. Ensure the transition from the analytic to the emotional is smooth. Make sure the family feels included, not alienated by the philosophy. (The philosophy *is* the love language here, but it needs translation).

