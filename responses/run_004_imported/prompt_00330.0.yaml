prompt: |-
  I've been working through the literature on dynamic choice and diachronic consistency for a dissertation chapter, and I keep running into a conceptual knot I'd like help untangling. Edward McClennen's resolute choice theory and the updateless decision theory (UDT) developed in the AI safety/rationalist literature (Yudkowsky, Hintze, and others) both seem motivated by a similar worry: that agents who revise their plans in light of new information can be exploited across time (money-pumped, or made to defect against their own past selves) in ways that a suitably "committed" agent would avoid. Both frameworks recommend sticking to a plan formed at an earlier point even when, from a later vantage point, deviating looks locally rational.

  That said, I suspect the two views rest on quite different background commitments. McClennen's resolute choice is pitched within a broadly Kantian, agent-centered picture of practical rationality, and doesn't obviously require any revisionary metaphysics of decision-making -- it just asks the agent to treat her earlier self's plan as binding. UDT, by contrast, is typically formulated in terms of an agent selecting a global policy (a function from observations/inputs to actions) prior to any updating at all, which seems to presuppose a much more radical picture on which later "selves" or epistemic states have no independent standing to deviate from the policy chosen "at the beginning of time." I'd like to get clearer on whether this difference is substantive or merely a difference in framing. Could you compare resolute choice theory and updateless decision theory in some depth -- particularly how each would handle something like the toxin puzzle or Newcomb-like cases such as counterfactual mugging -- and say whether UDT should be understood as a formalization (or descendant) of resolute choice, or whether it's making a genuinely different theoretical claim about the nature of rational agency and the unit of rational evaluation (acts vs. policies vs. dispositions)?
reasoning: |-
  Here's a thinking process that leads to the comparison between Resolute Choice and Updateless Decision Theory:

  1.  **Deconstruct the User's Request:**
      *   **Topic:** Dynamic choice, diachronic consistency, exploitation over time.
      *   **Key Theories:** Edward McClennen's *Resolute Choice* vs. *Updateless Decision Theory* (UDT).
      *   **Core Question:** Are they substantively different or just differently framed? Is UDT a formalization/descendant of Resolute Choice, or does it make a different claim about rational agency (acts vs. policies vs. dispositions)?
      *   **Specific Cases to Analyze:** Toxin Puzzle, Newcomb-like cases (Counterfactual Mugging).
      *   **Underlying Concern:** Metaphysics of decision-making, unit of rational evaluation, Kantian vs. AI safety/rationalist background.

  2.  **Initial Assessment & Knowledge Retrieval:**
      *   *McClennen's Resolute Choice:* Found in *Rationality and Dynamic Choice* (1990). Critique of Consequentialism (specifically Sophisticated Choice). Argues that rational agents can commit to a plan at $t_0$ and follow it at $t_1$ even if preferences change, *because* following the plan is part of the conception of the self. It's about agency and identity over time. It rejects Separability.
      *   *UDT:* Developed by Wei Dai (not Yudkowsky directly, though associated with MIRI/LW). Key idea: Choose a policy $\pi: Observation \to Action$ that maximizes expected utility *before* receiving observations. Don't update on observations when choosing the policy. Solves Newcomb, Counterfactual Mugging, Parfit's Hitchhiker.
      *   *Similarities:* Both reject myopic/separable choice. Both advocate sticking to a pre-commitment. Both aim to avoid dynamic inconsistency/exploitation.
      *   *Differences:* McClennen is philosophical/normative (how humans *should* reason). UDT is formal/computational (how an AI *should* compute). McClennen relies on a psychological/normative capacity for resolution. UDT relies on a logical dependency between the algorithm's output at different times/states.
      *   *The "Knot":* The user suspects a metaphysical difference. McClennen keeps the agent intact; UDT often dissolves the agent into a program.

  3.  **Structuring the Comparison:**
      *   **Introduction:** Acknowledge the insight (they look similar but differ in foundations). State the thesis: They are *functional analogues* but *metaphysically distinct*. UDT is not just a formalization of Resolute Choice; it changes the ontology of the decision problem.
      *   **Core Mechanisms:**
          *   Resolute Choice: Normative commitment, rejection of separability, agency-based.
          *   UDT: Logical correlation, policy selection, computation-based.
      *   **Case Studies:**
          *   Toxin Puzzle (Kavka): Resolute Choice says "I can intend." UDT says "My output determines the prediction."
          *   Counterfactual Mugging (Parfit/Soares): Resolute Choice struggles (no actual commitment opportunity?). UDT shines (policy determines counterfactual payout).
      *   **Metaphysics of Agency:**
          *   McClennen: Unified self, willpower/resolution as a rational capacity.
          *   UDT: Agent as a static function, time as an index, logical omniscience (in ideal form).
      *   **Unit of Evaluation:**
          *   Resolute: Plans (but executed by selves).
          *   UDT: Policies (functions).
      *   **Conclusion:** Verdict on the "descendant" question.

  4.  **Drafting the Content - Section by Section:**

      *   *Intro:* Validate the user's intuition. The "conceptual knot" is real. Both solve dynamic inconsistency but via different routes.
      *   *McClennen's Resolute Choice:* Focus on the critique of *Sophisticated Choice* (Game Theoretic backward induction). McClennen argues sophisticated choice leads to suboptimal outcomes because it anticipates future preference changes. Resolute choice says: "I choose the plan at $t_0$ and my $t_1$ self respects that choice *because it is mine*." It's a normative claim about the unity of agency. It requires a psychological capacity for resolution.
      *   *UDT:* Focus on the math. $Action = \arg\max_{\pi} E[U | \pi]$. The key is *not* conditioning on the observation when choosing the policy. It treats the agent's decision procedure as a logical fact that is correlated across time and possible worlds. It's less about "willpower" and more about "logical causality."
      *   *The Toxin Puzzle:*
          *   Scenario: Intend to drink toxin tomorrow to get money today. Can't intend if you know you won't drink.
          *   McClennen: A resolute agent *can* form the intention because the $t_1$ self follows the $t_0$ plan. The intention is rational because the action will follow.
          *   UDT: The predictor predicts the *policy*. If the policy is "Drink if predicted," you get the money. The "observation" (having the money) doesn't change the policy.
          *   *Nuance:* McClennen relies on the *capacity* to bind. UDT relies on the *structure* of the prediction.
      *   *Counterfactual Mugging:*
          *   Scenario: Omega asks for \$100 if coin is Tails. If Heads, Omega gives \$10k *if* you would have paid on Tails.
          *   McClennen: Harder. At $t_1$ (Tails), the reward is gone. Why pay? Resolute choice says "Stick to the plan." But does the plan cover counterfactuals? McClennen focuses on *actual* dynamic choice paths.
          *   UDT: Natural fit. The policy is selected *before* the coin flip. The expected utility of the policy "Pay if Tails" includes the Heads reward.
          *   *Key Distinction:* UDT handles *logical* counterfactuals better. McClennen handles *temporal* consistency.
      *   *Metaphysics & Unit of Evaluation:*
          *   McClennen: Humanistic. The "Self" persists. Rationality is a property of the person.
          *   UDT: Computational. The "Agent" is a source code. Rationality is a property of the algorithm.
          *   *Is UDT a formalization?* No. It's a *reconstruction*. It removes the "will" and replaces it with "logical correlation."
      *   *The "Knot" Untangled:* The user asked if the difference is substantive. Yes. McClennen saves the phenomenology of choice (I choose to bind myself). UDT eliminates the phenomenology (The output is determined by the function).

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Correction:* Make sure to credit Wei Dai for UDT, not just Yudkowsky. Yudkowsky popularized it in the context of FAI, but Dai created it.
      *   *Clarification:* Distinguish UDT from TDT (Timeless Decision Theory). TDT is closer to causal decision theory with logical nodes. UDT is fully updateless. For this comparison, UDT is the stronger contrast to McClennen.
      *   *Emphasis:* Highlight that McClennen is responding to *preferences changing* (temptation), whereas UDT is often responding to *information updating* (Newcomb). Though they overlap in dynamic inconsistency.
      *   *Kantian Angle:* The user mentioned Kant. McClennen is indeed influenced by the idea of autonomy and self-legislation. UDT is Humean/Utilitarian in goal but Platonic in metaphysics (mathematical structures).

  6.  **Final Polish:**
      *   Ensure the tone is academic but accessible (dissertation level).
      *   Check that all parts of the prompt are addressed (Toxin, Counterfactual Mugging, substantive vs. framing, unit of evaluation).
      *   Synthesize the conclusion: They are convergent solutions to dynamic inconsistency but divergent on the *nature* of the agent.

  7.  **Final Output Generation:** (Proceed to write the response based on these structured thoughts.)
answer: |-
  This is an exceptionally sharp observation. You have identified a genuine "conceptual knot" that often goes unnoticed because the *prescriptions* of Resolute Choice (RC) and Updateless Decision Theory (UDT) frequently converge (e.g., "take the one box," "pay the mugger," "drink the toxin"). However, your suspicion is correct: the convergence is functional, not foundational.

  While both theories aim to solve dynamic inconsistency and avoid exploitation (money pumps), they rest on divergent metaphysics of agency, different accounts of counterfactuals, and distinct units of rational evaluation. UDT is not merely a formalization of McClennen's Resolute Choice; it is a reconstruction of decision theory that dissolves the very problem McClennen was trying to solve normatively.

  Here is a detailed comparison to help untangle the knot for your dissertation.

  ---

  ### 1. The Core Mechanism: Will vs. Logic

  **McClennen's Resolute Choice** is a normative theory of human agency. It is grounded in a critique of the **Separability Principle** (the idea that a decision at $t_1$ should depend only on the subtree of possibilities available at $t_1$). McClennen argues that sophisticated choice (backward induction) leads to dynamically inconsistent outcomes when preferences change over time (e.g., due to temptation).
  *   **The Mechanism:** *Resolution.* The agent at $t_0$ forms a plan. The agent at $t_1$ executes it, not because the local expected utility is higher, but because the agent recognizes the $t_1$ self as continuous with the $t_0$ self. The binding force is the **unity of the will**.
  *   **Metaphysics:** It preserves the standard temporal ontology. There is a $t_0$ self and a $t_1$ self. The "knot" is tied by a psychological/normative capacity to treat past commitments as reason-giving.

  **Updateless Decision Theory (UDT)** is a formal theory of optimal computation (originating with Wei Dai, developed within the MIRI/rationalist community). It addresses the failure of Causal and Evidential Decision Theory in Newcomb-like problems.
  *   **The Mechanism:** *Logical Correlation.* The agent selects a policy $\pi$ (a function from observations to actions) that maximizes expected utility *prior* to receiving observations. Crucially, the agent does not update on its observations when evaluating the policy. It treats its own decision procedure as a logical fact that is correlated with predictions made about it (by Omega, predictors, or its future self).
  *   **Metaphysics:** It flattens time. The "agent" is a static mathematical object (source code). The decision at $t_1$ is not a "new" choice constrained by an old promise; it is the *same* logical output as the choice at $t_0$. There is no need for "willpower" because there is no conflict between selves, only the execution of a function.

  **The Substantive Difference:** McClennen solves dynamic inconsistency by adding a normative capacity (resolution) to the agent. UDT solves it by changing the domain of evaluation (from acts to policies) and the nature of counterfactuals (from causal/temporal to logical).

  ### 2. Case Study: The Toxin Puzzle (Kavka)

  In Kavka's Toxin Puzzle, you are rewarded at $t_0$ if you *intend* at $t_0$ to drink a toxin at $t_1$. Drinking the toxin makes you sick and provides no further benefit. Standard CDT says you cannot rationally intend to drink, because at $t_1$ you will have no reason to drink.

  **Resolute Choice Analysis:**
  McClennen argues a resolute agent *can* form the intention. Why? Because the agent knows that their $t_1$ self is resolute. The $t_1$ self will drink the toxin not because it is locally utility-maximizing (it isn't), but because it is adhering to the plan formed at $t_0$.
  *   **Unit of Evaluation:** The *Plan*.
  *   **Key Commitment:** The rationality of the intention depends on the psychological reality of the agent's capacity for resolution. If you lack the character trait of resoluteness, the intention is irrational.

  **UDT Analysis:**
  UDT bypasses the "intention" problem. The predictor predicts your *policy*.
  *   If your policy is `If rewarded, then Drink`, the predictor predicts this, you get the money, and you drink.
  *   If your policy is `If rewarded, then Don't Drink`, the predictor predicts this, you get no money.
  *   UDT selects the first policy because the expected utility (Money - Sickness) > (No Money).
  *   **Unit of Evaluation:** The *Policy Function*.
  *   **Key Commitment:** The rationality depends on the logical dependency between your policy and the prediction. It does not require a "capacity for resolution," only that your algorithm outputs the action consistent with the winning policy.

  **Divergence:** McClennen requires the agent to *overrule* local preferences via will. UDT requires the agent to *ignore* local information (the fact that the money is already in the bank) via calculation.

  ### 3. Case Study: Counterfactual Mugging

  This case highlights the deepest rift. Omega flips a coin.
  *   **Tails:** Omega asks you for \$100.
  *   **Heads:** Omega gives you \$10,000 *if and only if* Omega predicts you would have given \$100 had the coin come up Tails.
  *   You observe **Tails**. The \$10,000 is counterfactually gone.

  **Resolute Choice Analysis:**
  This is difficult for McClennen. Resolute Choice is primarily designed for *actual* dynamic choice paths where preferences shift over time (e.g., procrastination, addiction). In Counterfactual Mugging, there is no *actual* prior commitment phase where you could bind yourself before the coin flip (unless you stipulate a pre-game contract).
  If you are already at the "Tails" node, a resolute chooser asks: "Did I form a plan to pay in this eventuality?" If yes, you pay. But the justification is thin compared to UDT. McClennen's framework is rooted in the *temporal persistence of the self*, not necessarily *counterfactual consistency across possible worlds*.

  **UDT Analysis:**
  This is UDT's canonical victory.
  *   UDT calculates expected utility *before* the coin flip (updateless).
  *   $E[\text{Pay if Tails}] = 0.5 \times (\$10,000) + 0.5 \times (-\$100) = \$4,950$.
  *   $E[\text{Refuse if Tails}] = 0$.
  *   Even upon observing Tails, UDT does not update. It knows that "paying now" is the logical output of the policy that would have secured the \$10,000 in the Heads world.
  *   **Key Commitment:** Rationality requires optimizing the *logical output* of your decision algorithm across all possible worlds weighted by their prior probability, regardless of which world you actually inhabit.

  **Divergence:** McClennen protects the agent from their *future self*. UDT protects the agent's *algorithm* from logical inconsistency across *possible worlds*.

  ### 4. Metaphysics of Agency and the "Unit of Evaluation"

  You asked whether UDT is a formalization of Resolute Choice. The answer is **no**. They propose different ontologies of the decision-maker.

  | Feature | McClennen's Resolute Choice | Updateless Decision Theory (UDT) |
  | :--- | :--- | :--- |
  | **Unit of Evaluation** | **Plans** (executed by a temporal self). | **Policies** (functions mapping inputs to outputs). |
  | **View of Time** | **Dynamic:** $t_0$ and $t_1$ are distinct epistemic states. | **Static/Block:** Time is an index; the agent is a timeless function. |
  | **Source of Normativity** | **Autonomy:** The self-legislating will binds itself. | **Optimality:** The policy that maximizes prior expected utility. |
  | **Handling Information** | **Updates:** Agents receive info, but choose to ignore its normative force to stick to the plan. | **No Updates:** The decision is made "outside" of time; observations are just inputs to the function. |
  | **Metaphysical Cost** | Requires a robust theory of personal identity and willpower. | Requires a theory of logical counterfactuals and computational ontology. |

  **The "Kantian" vs. "Platonic" Distinction:**
  *   **McClennen** is indeed Kantian in the sense that he views rationality as a property of a self-governing agent. The "binding" is an act of freedom. He wants to save the phenomenology of choice: it *feels* like I am choosing to stick to the plan.
  *   **UDT** is more Platonic/Computational. The "choice" is an illusion of perspective. The correct action is determined by the mathematical properties of the policy that maximizes utility. The agent doesn't "bind" themselves; they simply *are* the policy.

  ### 5. Conclusion for Your Dissertation

  The difference is **substantive**, not merely framing.

  1.  **Different Problems:** McClennen is solving the problem of **akrasia** (weakness of will) and preference change in human agents. UDT is solving the problem of **logical correlation** and predictor dependence in idealized agents.
  2.  **Different Solutions:** McClennen adds a normative constraint (Resolution) to standard decision theory. UDT replaces the decision theoretic framework entirely (replacing conditional expected utility with unconditional policy optimization).
  3.  **Descendant?** UDT should not be understood as a descendant of Resolute Choice. It is more accurate to view them as **convergent evolution**. They arrived at similar prescriptions (stick to the plan!) because they are both responding to the failure of *Separability*, but they repair the failure in different places. McClennen repairs the *agent's psychology*; UDT repairs the *decision calculus*.

  **Recommendation:**
  In your chapter, you can argue that while UDT achieves the *functional* goals of Resolute Choice (diachronic consistency, immunity to exploitation), it does so by eliminating the *agency* that McClennen sought to preserve. McClennen wants to explain how a human can be rational despite changing preferences. UDT explains how a program can be optimal despite logical dependencies.

  If your dissertation focuses on **human rationality**, McClennen is the stronger framework because it accounts for the effort of resolution. If your dissertation focuses on **ideal rationality or AI alignment**, UDT is superior because it formalizes the conditions under which "commitment" is logically necessary rather than psychologically effortful. Treating UDT as a formalization of McClennen risks obscuring the radical shift UDT makes regarding the nature of information and the temporal location of the decision.
