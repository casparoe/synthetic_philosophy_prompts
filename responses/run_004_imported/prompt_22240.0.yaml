answer: |-
  This is one of the sharpest objections to orthodox Bayesian epistemology, and your intuition is exactly right: if $P(T) = 1$ for all logical truths $T$ in your prior, then conditionalizing on a proof of $T$ yields no update. $P(T | \text{Proof}) = P(T) = 1$. Formally, nothing has happened.

  This is the **Problem of Logical Omniscience**. It strikes at the heart of whether Bayesianism is a theory of *rationality* (how we ought to reason) or a theory of *coherence* (how consistent states relate).

  Here is a walkthrough of the implications, the proposed fixes (Awareness, Logical Induction), and the "bite the bullet" defense.

  ### 1. The Core Implication: Synchronic vs. Diachronic
  The immediate implication is that standard Bayesianism is fundamentally a **synchronic** theory of coherence, not a **diachronic** theory of discovery.

  In the standard possible worlds framework, a "world" is a maximally consistent set of propositions. Because logical truths hold in *all* consistent worlds, there is no world in your space where $2+2 \neq 4$. Therefore, you cannot assign probability mass to the negation of a logical truth.

  **The Consequence:**
  If you accept standard Bayesianism, "learning a theorem" cannot be modeled as updating your credence in the theorem itself. Instead, it must be modeled as updating your credence in **the relation between your axioms and the theorem.**

  This leads to the most famous Bayesian patch: **Daniel Garber's Solution (1983).**
  Garber argued that when a mathematician "learns" a theorem, they aren't conditionalizing on the theorem (which they already implicitly knew). They are conditionalizing on the *fact that the theorem follows from the axioms*.
  *   **Old Model:** $P(\text{Theorem}) = 1$.
  *   **Garber's Model:** Expand the algebra to include sentences like "$\text{Axioms} \vdash \text{Theorem}$".
  *   **The Update:** You assign $P(\text{Axioms} \vdash \text{Theorem}) < 1$ initially. When you verify the proof, you conditionalize on this *implication fact*, driving its probability to 1. Since you already had high credence in the Axioms, your credence in the Theorem remains 1, but your *justification* structure changes.

  **Implication:** Bayesianism survives, but only by admitting that logical learning is actually *empirical* learning about syntactic relations or proof-tokens. It shifts the problem from logic to meta-logic.

  ### 2. Awareness Growth Models
  You asked if awareness-growth models rescue the picture. This is currently one of the most active areas in formal epistemology (work by Bradley, Steele, Karni & Schmeidler).

  **The Idea:**
  Standard Bayesianism assumes a fixed $\sigma$-algebra (a fixed set of propositions you can have opinions about). Awareness growth models allow the algebra itself to expand.
  *   **Pre-Proof:** The proposition $T$ is not in your algebra. You are *unaware* of it. You don't have a credence in it (not even 1).
  *   **Post-Proof:** You become aware of $T$. You refine your partition. You must now assign a probability to it.

  **Does it work?**
  *   **Pros:** It captures the phenomenology of discovery. It feels like the proposition didn't "exist" for you until you conceived of it.
  *   **Cons:** It creates a "catch-all" problem. When you expand the algebra, where does the probability mass come from? You usually have to steal it from a "something else" hypothesis. More critically, if you are aware of the *axioms*, are you truly unaware of their logical consequences? If awareness of axioms entails awareness of consequences, LO returns. If not, you need a theory of *logical unawareness* which is notoriously difficult to formalize without impossible worlds.

  **Verdict:** Awareness growth is better than Garber's solution for capturing *conceptual novelty*, but it struggles to explain why we are certain of axioms but uncertain of their consequences without invoking computational limits.

  ### 3. Logical Induction (The Post-Bayesian Approach)
  This is the most radical and promising development for your specific worry. Proposed by Garrabrant et al. (2016) at MIRI, **Logical Induction** drops the requirement that credences must be probabilistically coherent *at every finite time step*.

  **The Mechanism:**
  *   Think of credences as stock prices in a market.
  *   A "logical inductor" is an algorithm that sets prices on logical sentences.
  *   It is not required to be coherent today. It is only required to be coherent **in the limit**.
  *   If a proof exists, the market price for that theorem will converge to 1 over time, but it can start at 0.5 and fluctuate as proof-search algorithms find intermediate lemmas.

  **Does it rescue mathematical learning?**
  *   **Yes:** It formally models the process of a bounded agent finding a proof. $P(T)$ rises as evidence (lemmas, partial proofs) accumulates.
  *   **The Cost:** It is not Bayesianism. It violates the probability axioms at finite times. It admits that a rational agent *can* and *should* have $P(A) + P(\neg A) \neq 1$ while they are still thinking.

  **Verdict:** Logical Induction is arguably the best formal model we have for *actual* mathematical practice. However, it requires abandoning the core Bayesian tenet that rationality = synchronic probabilistic coherence. It replaces it with "computational rationality."

  ### 4. Biting the Bullet: Idealization
  Finally, there is the defense that Bayesianism is a theory of **ideal rationality**, not human psychology.

  **The Argument:**
  *   Bayesianism defines the "God's eye view" of rationality.
  *   An ideally rational agent *would* know all logical truths instantly.
  *   The fact that humans don't is a performance error due to computational bounds, not a flaw in the normative theory.
  *   Just as aerodynamics describes ideal airflow even if real planes have turbulence, Bayesianism describes ideal belief even if humans have logical uncertainty.

  **The Problem with this:**
  If the ideal is unreachable in principle (due to Gödelian incompleteness or computational complexity), is it a useful norm? If the theory says "You should believe all consequences of your beliefs," and no physical system can do that, does the "ought" imply "can"?

  Most modern formal epistemologists think **yes, this is a bullet that must be bitten, but with modifications.** Pure Bayesianism is insufficient. We need a theory of **Bounded Rationality**.

  ### Summary of Implications for Bayesian Epistemology

  1.  **Separation of Uncertainty Types:** Bayesianism is forced to distinguish between *empirical uncertainty* (which world is actual?) and *logical uncertainty* (what is true in this world?). Standard Bayes handles the former; it fails at the latter without modification.
  2.  **The "Old Evidence" Problem:** Your worry is isomorphic to the Problem of Old Evidence (how can $E$ confirm $H$ if we already knew $E$?). The solutions are the same: conditionalize on the *connection* ($H \vdash E$), not the evidence itself.
  3.  **Shift to Computational Epistemology:** The field is moving away from "coherence" as the sole norm. The rise of Logical Induction suggests that **tractability** is becoming a normative constraint alongside coherence. A credence function that takes 1,000 years to compute is not rational for a human.
  4.  **No "Pure" Solution:** There is no way to keep standard Bayesianism (fixed algebra, synchronic coherence, logical omniscience) and explain mathematical learning. You must choose one:
      *   **Drop Fixed Algebra:** (Awareness Growth)
      *   **Drop Synchronic Coherence:** (Logical Induction)
      *   **Drop the claim that it models learning:** (Garber/Bite the Bullet)

  **Conclusion for your seminar:**
  If you want to defend standard Bayesianism, you argue it is a normative ideal for *empirical* uncertainty, and logical learning is a distinct cognitive capacity. If you want to model mathematical learning formally, you have to step outside orthodox Bayesianism into **Logical Induction** or **Awareness Growth**. The consensus is increasingly that "Ideal Bayesianism" is a useful limit case, but a theory of *rational belief revision* for beings like us requires incorporating computational constraints directly into the axioms.
