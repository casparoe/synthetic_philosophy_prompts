      *   **The Crucial Distinction (Use-Novelty):** This is the pivot point. The data existed, but it wasn't *used* to construct the model. This makes it much stronger than typical accommodation.
      *   **The "Omega" Factor (Unexplained Anomaly):** The fact that it was an *anomaly* (a problem for previous theories) makes solving it a big win (Lakatosian progress).
      *   **Conclusion:** The user is philosophically sound, but in this specific instance, the colleagues are likely scientifically justified because the data was "use-novel."

