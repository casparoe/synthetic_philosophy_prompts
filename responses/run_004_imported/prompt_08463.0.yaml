answer: |-
  ### The Mechanics of Peeking: Why the Frequentist is Worried

  To understand why your frequentist colleague is screaming about "inflated false positive rates," you have to understand what a p-value actually is. It is not the probability that the null hypothesis is true. It is the probability of observing data *at least as extreme* as what you saw, *assuming the null hypothesis is true*, **given a specific sampling plan.**

  That last clause—"given a specific sampling plan"—is the landmine.

  In a standard frequentist A/B test, you calculate the p-value based on the assumption that you collected a fixed sample size ($N$) and looked at the data exactly once. The math behind the p-value distribution (the uniform distribution under the null) relies on that single look.

  When you "peek," you violate that assumption. Every time you check the dashboard, you are effectively running a new hypothesis test.
  *   **Look 1 ($N=100$):** There is a 5% chance noise looks like a signal ($p < 0.05$).
  *   **Look 2 ($N=200$):** If Look 1 was clean, there is *another* 5% chance noise looks like a signal now.
  *   **Look 3 ($N=300$):** And another.

  By stopping the *moment* $p < 0.05$, you are selecting for noise. You are filtering out the trajectories where the noise stayed low and keeping only the trajectories where random fluctuation temporarily spiked. If the null hypothesis is actually true (there is no difference between A and B), and you peek indefinitely, the probability of eventually seeing a $p < 0.05$ approaches 100%. You guarantee a false positive. This is the "multiple comparisons problem" disguised as a stopping rule. Your frequentist colleague is correct: if you use p-values, peeking breaks the math and destroys your error rate guarantees.

  ### The Bayesian Claim: The Likelihood Principle

  Your Bayesian colleague argues that this is a frequentist-only problem. Their argument rests on the **Likelihood Principle**, which states that all the information relevant to inference is contained in the likelihood function of the observed data. How you *got* the data (your stopping rule) is irrelevant; only the data itself matters.

  In a Bayesian framework, you start with a prior belief about the effect size. As data comes in, you update to a posterior distribution. You might track a Bayes Factor (BF), which tells you how much more likely the data is under the "effect exists" hypothesis compared to the "no effect" hypothesis.

  The Bayesian claim is: *If the data says the odds are 10:1 in favor of an effect, they are 10:1 regardless of whether I planned to stop at $N=1000$ or stopped at $N=400$ because I got impatient.* The posterior updates coherently. There is no "alpha" to spend. Therefore, you can peek all you want.

  ### Does the Problem Disappear or Relocate?

  Here is the critical analysis: The Bayesian is mathematically correct about *inference*, but potentially dangerous about *decisions*.

  **1. The Consistency Advantage**
  Unlike p-values, Bayes Factors are consistent. If the null hypothesis is truly true, and you collect infinite data, the Bayes Factor will converge to 0 (favoring the null) with probability 1. A p-value, under infinite peeking, will eventually cross 0.05 and stay there (false positive). In this specific theoretical sense, the Bayesian is right: peeking does not force you to accept a false hypothesis eventually. The truth wins out in the long run.

  **2. The Relocation of Risk**
  However, in a business context, you do not have infinite time. You have a quarter. If you peek and stop *the moment* your Bayes Factor crosses a threshold (e.g., $BF > 10$), you **do** reintroduce bias.
  Why? Because Bayes Factors are random variables. Even if the null is true, a BF can fluctuate. It might hit 12 at $N=200$ (due to noise) before crashing back down to 0.1 at $N=1000$. If your rule is "Stop when $BF > 10$," you have selected for the noise spike.

  The problem hasn't disappeared; it has **relocated**.
  *   **Frequentist Risk:** Inflated Type I error rate (false positives) due to alpha spending.
  *   **Bayesian Risk:** Miscalibrated evidence thresholds due to optional stopping.

  A Bayes Factor of 10 obtained via fixed sampling means something different than a Bayes Factor of 10 obtained via "peek until significant." The latter is biased toward overestimating effect sizes. If you treat a BF of 10 as a hard "Ship It" signal without adjusting for the fact that you peeked, you will ship more losers than your model predicts.

  Furthermore, the Bayesian solution relies heavily on the **prior**. If your prior on the effect size is too wide (e.g., "the effect could be anything from -100% to +100%"), the Bayes Factor becomes overly sensitive to noise early in the test, encouraging early stopping on false signals. The "protection" against peeking is only as good as the realism of your prior.

  ### The Verdict

  Your team is arguing about inference, but you are making business decisions. In a business context, you care about the False Discovery Rate (how many shipped features actually lose money).

  **The Frequentist has the point.**

  Here is why: The Bayesian argument holds only if you interpret the Bayes Factor as a continuous measure of evidence and *never* use it as a binary stopping rule. But in A/B testing, you *must* stop eventually and make a binary decision (ship or kill). The moment you impose a threshold ("Stop if $BF > 10$"), you reintroduce the optional stopping bias. You are effectively "gaming" the evidence by waiting for a random walk to hit your line.

  While Bayes is theoretically more robust than p-values (it won't *guarantee* a false positive with infinite time), it does not grant immunity from the economic costs of peeking. If you peek and stop early on a high BF, you are systematically overestimating the effect size (the "winner's curse").

  **Verdict:** **Bayes only wins if you abandon binary significance thresholds entirely.**

  If your team intends to use Bayes Factors exactly like p-values (i.e., "Wait until it crosses the line, then stop"), **the Frequentist is right:** you are inflating your risk, and you will lose money. The "stopping rule irrelevance" of Bayesian math applies to *belief updating*, not to *decision procedures* with fixed thresholds.

  If you want to peek legitimately, neither "Fixed N Frequentist" nor "Naive Bayesian" is the answer. The solution is **Sequential Analysis** (e.g., Alpha Spending functions for frequentists, or calibrated Sequential Bayes Factors). But if forced to choose between the two arguments as stated: The Frequentist is right to be afraid. Peeking breaks decision-making guarantees in both frameworks unless explicitly modeled. Do not let the Bayesian colleague sell you a "magic bullet" that doesn't exist for binary decisions.
