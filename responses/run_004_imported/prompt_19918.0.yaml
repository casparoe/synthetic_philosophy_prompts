      *   *Self-Correction on Death in Damascus:* I need to be careful about the CDT analysis of Death in Damascus. Classical CDT says the state (Death's location) is independent of the act. So $P(Death=Aleppo | Go=Aleppo) = P(Death=Aleppo)$. If the predictor is perfect, this independence assumption is false *factually*, but CDT *treats* it as independent. So CDT says "Go to Aleppo" (assuming no preference). EDT says "I can't decide." So Death in Damascus is actually an argument *for* CDT (or at least against naive EDT). Wait, is it an argument *for* CDT? CDT agents die just as much as EDT agents, but CDT agents don't suffer deliberational paralysis. The philosophical point is usually that EDT is *incoherent* here. So it's a "reductio" of EDT.

