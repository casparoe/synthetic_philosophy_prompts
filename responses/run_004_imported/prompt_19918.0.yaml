          *   *CDT Recommendation:* Take both. Your choice doesn't causally affect what's already in the box. Dominance principle applies.
          *   *EDT Recommendation:* Take only B. Choosing both is strong evidence that the box is empty. Choosing only B is strong evidence that the box has $1M. Expected utility is higher for one-boxing.
          *   *Consensus:* Newcomb's is the standard *motivation* for EDT (or at least the standard counterexample to CDT).

      *   **Death in Damascus:**
          *   *Setup:* Man meets Death in Damascus. Death says, "I'm surprised to see you here; I have an appointment with you in Aleppo tonight." The man reasons: "If I stay in Damascus, Death will be here (because he predicted I'd be here). If I go to Aleppo, Death will be there (because he predicted I'd be there)."
          *   *CDT Recommendation:* Indifferent (or choose based on minor preferences). Going to Aleppo doesn't *cause* Death to be there. Death's location is already fixed. However, standard CDT often struggles here too, but usually, it says "Your action doesn't change Death's location, so go where you prefer to die/live." But wait, the story implies death is certain. Let's refine the payoff. Usually, the payoff is: Survive if you avoid Death, Die if you meet Death.
