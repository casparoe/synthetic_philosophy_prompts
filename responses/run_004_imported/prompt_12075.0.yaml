answer: |-
  **W:** Let's be precise about the model. We have variables $M$ (Major's order), $S$ (Sergeant's order), and $C$ (Charge). The structural equation for $C$ isn't symmetric. It's something like: $C = 1$ if $M=1$, else if $S=1$. When we intervene on $M$, setting $M=0$ while holding $S=1$, $C$ becomes 0. But if we intervene on $S$, setting $S=0$ while holding $M=1$, $C$ remains 1. The asymmetry is built into the invariant generalizations governing the soldier. The causation follows from the structure.

  **L:** But that's precisely the trouble. You've encoded the intuitive verdict—that the Major trumps—directly into the structural equation. You haven't explained *why* the Major trumps using causal resources; you've assumed the causal hierarchy to write the equation. For Lewis, causation is supposed to be grounded in counterfactual dependence, not modeler stipulation. In Schaffer's case, the orders are simultaneous. There's no temporal lag, no process interruption. If you remove the Major's order, does the charge vanish? Only if you assume the Sergeant's order doesn't fill the gap. But why doesn't it?

  **W:** Because the interventionist test holds other variables fixed. When I test $M$, I hold $S$ at its actual value. The soldier's disposition is part of the background structure. It's not stipulation; it's capturing the mechanism. The soldier is disposed to obey rank. That disposition is the causal structure. Your view struggles because you look for dependence between events. Here, $C$ doesn't depend on $M$ in the simple sense. If $M$ hadn't occurred, $S$ would still have occurred, and $C$ would still have occurred. So you have no dependence.

  **L:** Not necessarily. Lewis's later "influence" account handles ordinary preemption. We look at whether alterations in $M$ lead to alterations in $C$. If the Major had whispered "Advance," the soldier would have advanced. So there is influence. But here is where your case bites me: the Sergeant's order exerts the *same* influence. If the Sergeant had whispered "Advance," the soldier would have advanced—provided the Major hadn't spoken. But since they speak simultaneously, the pattern of influence is symmetric. Both orders match the effect perfectly. Your model breaks the symmetry by fiat; my similarity metric finds none.

  **W:** I don't break it by fiat. I break it by identifying the correct variables. If you model the soldier's decision rule correctly, $S$ is off-path when $M=1$. The asymmetry isn't in the events; it's in the structural constraints. You claim this is circular, but I claim your similarity metric is arbitrary. To save dependence, you have to say that the world where the Major stays silent is closer than the world where the Sergeant's order fails to trigger the charge. But why? Physically, the sound waves hit the ear simultaneously.

  **L:** Exactly. Physically, they are identical. That's why Schaffer designed the case. If causation is purely about physical processes or counterfactual dependence among events, the Major and Sergeant are indistinguishable. You rescue the verdict by appealing to the soldier's *rule*. But is that rule causal or constitutive? If it's a social norm encoded in the soldier, you're reducing causation to normative expectations. Lewis wants causation to be out there in the weave of the world, not in how we parameterize the equation. You're saying causation is relative to a model.

  **W:** I'm saying causation is relative to a set of variables that capture the stable mechanisms. If you can't manipulate the Sergeant's order to change the outcome while the Major's holds fixed, the Sergeant isn't a cause. That's not modeler bias; it's about control. What's your alternative? You have to argue that the Major's order is "more similar" to the actual world in some counterfactual scenario. But if the processes are symmetric, your similarity metric has to privilege rank explicitly. So you're smuggling in the norm too.

  **L:** I might have to concede that simple counterfactual dependence fails here. But if I appeal to influence, I can say the Major's influence is *secure* while the Sergeant's is *fragile*. The Sergeant's influence holds only if the Major doesn't interfere. But wait—that sounds like your structural equation again. The problem is that "interference" here isn't physical. It's institutional. If my theory requires me to treat institutional rank as a metaphysical primitive to weight similarity, I've lost the reductive account of causation I wanted.

  **W:** And if I treat the structural equation as primitive, I've lost the claim that the model discovers causation rather than defining it. We're at the same impasse. You can't distinguish the orders without appealing to the rule; I can't write the equation without appealing to the rule. The difference is I admit the model reflects our explanatory interests. You want the world to dictate the counterfactuals without reference to those interests.

  **L:** So you admit the causation isn't fully objective?

  **W:** I admit it's objective relative to the correct causal model. You admit the counterfactuals aren't fully determined by physical facts. In trumping preemption, the "cause" isn't just in the physics; it's in the hierarchy. My framework makes that explicit. Yours hides it in the similarity metric.

  **L:** Then perhaps we agree on this: Schaffer's case shows that neither pure physical dependence nor pure structural manipulation captures the whole picture. You rely on the modeler to identify the hierarchy; I rely on the context to weight the worlds. Neither of us derives the verdict solely from the events themselves.

  **W:** Agreed. The Major causes the charge because the system is structured to prioritize him. Whether we capture that via equations or weighted worlds, we're both appealing to something beyond the local events.

  **L:** Then the disagreement isn't about the verdict. It's about whether we call that structure "causal" or "contextual."

  **W:** And whether we build it into the equations or hide it in the similarity sphere.

  **L:** Precisely. And that, I suspect, is where the seminar will spend the next hour.
