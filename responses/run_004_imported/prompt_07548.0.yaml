answer: |-
  You have identified one of the deepest fault lines in modern decision theory and welfare economics. Your intuition is correct: **under a strict revealed-preference (RP) conception, akrasia is logically incoherent.**

  If utility is defined *solely* as the ordinal ranking that rationalizes observed choices, then by definition, an agent always maximizes their utility. To say an agent "failed to maximize utility" is a category error, akin to saying a triangle "failed to have three sides." In this framework, the procrastinator does not *fail* to maximize; they simply reveal that, in that moment, the utility of procrastination exceeded the utility of working.

  However, because the concept of akrasia is indispensable for both everyday life and public policy (e.g., addiction, savings rates), economists and decision theorists have developed specific modifications to the RP framework to accommodate it.

  Here are the most important implications of the revealed-preference conception for the coherence of akrasia and self-control.

  ### 1. The Tautology Trap: Why Strict RP Eliminates Normativity
  The first implication is that strict RP strips utility of all **normative** force. In the rationalist tradition, "utility" (or expected value) is a map of the territory—a measure of how well outcomes align with the agent's genuine interests or values. In strict RP, utility is just a shadow cast by the choices themselves.

  *   **Implication:** If you hold to strict RP, you cannot distinguish between a "mistake" and a "preference." If an addict chooses heroin over food, strict RP dictates that, at that moment, $U(\text{heroin}) > U(\text{food})$. There is no "true self" being overridden.
  *   **Consequence for Akrasia:** Akrasia becomes impossible. You cannot act against your "better judgment" because your judgment is *defined* by your action. To talk about akrasia within strict RP, you must abandon the idea that choice reveals *welfare*.

  ### 2. The Solution: Splitting "Decision Utility" from "Experienced Utility"
  To rescue akrasia, economists (most notably Daniel Kahneman and Richard Thaler) have broken the identity between the utility that guides choice and the utility that constitutes well-being.

  *   **Decision Utility:** The weight assigned to an outcome at the moment of choice (what RP measures).
  *   **Experienced Utility:** The hedonic or normative value actually derived from the outcome (what rationalists care about).
  *   **Implication:** Akrasia is redefined as a **prediction error** or a **mapping failure**. The agent chooses $X$ expecting it to yield high experienced utility, but it yields low experienced utility. Alternatively, the agent's "System 1" (impulse) drives decision utility, while "System 2" (reflection) aligns with experienced utility.
  *   **Consequence for Self-Control:** Self-control is no longer about "maximizing" in the moment; it is about aligning *decision utility* with *experienced utility*. This validates the rationalist project of "aligning your algorithms" but requires admitting that RP is descriptively useful but normatively insufficient.

  ### 3. The Multiple-Selves Model (Intrapersonal Game Theory)
  The most rigorous economic way to preserve RP *locally* while acknowledging akrasia *globally* is the **Multiple-Selves** framework (pioneered by Strotz, and later Thaler & Shefrin).

  *   **The Model:** Instead of one agent with one utility function, the individual is modeled as a sequence of different agents over time (e.g., "Monday-You" vs. "Sunday-You") or competing sub-agents (e.g., "Planner" vs. "Doer").
  *   **RP Consistency:** Each "self" satisfies revealed preference axioms *within its own timeframe*. Sunday-You maximizes Sunday-You's utility by relaxing. Monday-You maximizes Monday-You's utility by working.
  *   **Implication:** Akrasia is not a failure of rationality *within* a self, but a **conflict of interest between selves**. This is often modeled using **hyperbolic discounting** (time-inconsistent preferences), where the discount rate between "now" and "tomorrow" is much higher than between "next year" and "next year plus one day."
  *   **Consequence for Self-Control:** Self-control becomes a problem of **mechanism design** or **commitment**. Since "Monday-You" cannot trust "Sunday-You," you need binding contracts (e.g., StickK, anti-procrastination software) that restrict the choice set of future selves. This aligns perfectly with the rationalist focus on "precommitment strategies."

  ### 4. Welfare Economics and the "Internalities" Problem
  The most profound practical implication concerns welfare analysis and policy. Standard welfare economics relies on **Consumer Sovereignty**: the assumption that individuals are the best judges of their own welfare, inferred from their choices.

  *   **Implication:** If akrasia is real (i.e., choices do not equal welfare), then Consumer Sovereignty is false. An agent can choose something that lowers their own lifetime welfare.
  *   **Internalities:** Economists like Ted O'Donoghue and Matthew Rabin introduced the concept of **internalities**—costs that an individual imposes on their future self through present choices (analogous to externalities imposed on others).
  *   **Consequence:** This opens the door for **Libertarian Paternalism** (Nudge Theory). If choices are tainted by akrasia, a policymaker (or a rationalist self-helper) can design choice architectures that help the "Planner" self defeat the "Doer" self without banning options. Strict RP forbids this; the "Akrasia-Compatible" RP demands it.

  ### 5. The Rationalist Synthesis: Rejection of Strict RP
  The rationalist community (e.g., LessWrong, CFAR) implicitly rejects strict revealed preference. They operate on a **Realist** conception of utility: there is a "territory" of value (human flourishing, goal achievement) that exists independently of the "map" (current impulses/choices).

  *   **Implication:** Rationalists treat the brain not as a unitary optimizer, but as a **bundle of heuristics and drives** (evolutionary sub-agents) that often conflict.
  *   **Coherence:** Akrasia is coherent here because "You" are identified with the reflective, long-term planning subsystem, while "Akrasia" is the hijacking of the motor output by a short-term subsystem.
  *   **Relation to Economics:** This maps closely to the **Dual-Self** economic models. It validates the idea that we can have a "True Utility Function" that is currently obscured by noise, bias, or sub-agent conflict.

  ### Summary of Implications

  | Feature | Strict Revealed Preference | Akrasia-Compatible Models (Dual-Self / Mistake) |
  | :--- | :--- | :--- |
  | **Definition of Utility** | Ordinal ranking of actual choices. | Psychological state or long-term welfare. |
  | **Status of Akrasia** | **Incoherent.** Choices always maximize utility. | **Real.** Choices can diverge from welfare. |
  | **Nature of Conflict** | None. Preferences may change, but no error. | Conflict between short-term impulse and long-term plan. |
  | **Self-Control** | Unnecessary (you always do what you want). | **Commitment Devices.** Restricting future choice sets. |
  | **Welfare Analysis** | Choice = Welfare. | Choice $\approx$ Welfare (subject to bias/error). |

  ### Conclusion
  The revealed-preference tradition forces a stark choice: either you accept that akrasia is an illusion (and the procrastinator *really* prefers procrastinating), or you must modify the economic model to distinguish between **choice** and **welfare**.

  Most modern behavioral economists and rationalists choose the latter. They retain the mathematical rigor of utility maximization but apply it to **sub-agents** (Planner vs. Doer) or distinguish between **decision utility** and **experienced utility**.

  Therefore, you can coherently talk about akrasia, but only by abandoning the strict Samuelsonian definition of utility. You must posit that there is a "True You" (a normative standard or a long-term planning self) whose utility function is *not* fully revealed by your immediate, impulsive choices. In doing so, self-control transforms from a mystical virtue into an engineering problem: how to design constraints and environments such that your revealed preferences align with your normative goals.
