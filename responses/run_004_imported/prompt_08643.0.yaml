answer: |-
  This is an exceptionally sharp intuition. You have essentially independently rediscovered a central tension in decision theory that has been debated since the 1970s and 80s, specifically regarding **dynamic choice** and **separability**.

  Your friend is correct: this is precisely the terrain Edward McClennen mapped out in *Rationality and Dynamic Choice* (1990), and your critique of resoluteness aligns with the standard objections raised by proponents of "sophisticated" choice or standard Expected Utility Theory (EUT).

  Here is a breakdown of your two questions, grounded in the formal literature, which should help you flesh out your post.

  ### 1. Does the "Relocates rather than Dissolves" argument hold up?

  **Short answer:** Yes, it holds up very well. In fact, it is the primary objection to resolute choice in academic decision theory.

  **The Technical Breakdown:**
  The money pump argument relies on the **Separability Principle** (sometimes called the *Dynamic Consistency* or *History-Independence* axiom). This principle states that your choice at a specific decision node should depend only on the future consequences available from that node, not on how you got there or what you planned earlier.

  *   **The Money Pump** assumes Separability. It says: "At this specific moment, you don't prefer Y to X, so you should be willing to swap. The fact that you held Y five minutes ago is irrelevant (sunk cost)."
  *   **The Resolute Defense** explicitly **rejects Separability**. It says: "I will choose based on my prior plan, even if my current local preferences suggest a swap."

  **Your Critique:**
  You argued that resoluteness just moves the coherence requirement up to the level of *plans*. This is correct. To be resolute, an agent must have a preference relation over **strategies** (complete plans of action) rather than just **outcomes**.
  *   If the agent's preferences over *strategies* are incomplete, they can be money-pumped on the choice of strategy *ex-ante* (before the first trade is offered).
  *   If the agent's preferences over *strategies* are complete, then you haven't saved incomplete preferences; you've just assumed completeness at the meta-level.

  **Is there a standard reply you're missing?**
  The only "standard reply" from defenders of resoluteness (like McClennen himself, or later Amartya Sen in some contexts) is not that it avoids coherence requirements, but that **rationality should be defined over plans, not isolated acts.** They argue that the "unit of agency" is the extended self over time, not the momentary self at a decision node.

  However, they concede your point: this requires the agent to value **commitment** itself. In AI terms, this means the agent's utility function must include a term for "adhering to my past policy." If that term is not weighted infinitely high (or sufficiently high to outweigh the money pump fees), the agent will still defect. If it *is* weighted that high, the agent effectively behaves *as if* it has complete preferences over outcomes that satisfy the coherence theorems, because the "commitment utility" fills in the gaps of the incomplete "outcome utility."

  So, your intuition that this "relocates rather than dissolves" the pressure toward Expected Utility Maximization is widely shared by critics of the resolute approach.

  ### 2. Is your Money Pump setup accurate?

  **Short answer:** Yes, you have the gist right, but there is one controversial assumption hidden in the "willingness to trade" step that is worth highlighting in your post.

  **The Setup:**
  You described: *Start with Y -> Trade for X (free) -> Trade for X+ (cost) -> Trade for Y (cost).*
  This is the standard **Gustafsson Money Pump** (named after Johan Gustafsson, who formalized these arguments recently, though the roots are older).

  **The Hidden Assumption:**
  The pump only works if you accept the **Behavioral Interpretation of Incompleteness**.
  *   **Formal Incompleteness:** The agent does not prefer X to Y, AND does not prefer Y to X.
  *   **Behavioral Assumption:** If an agent does not prefer Y to X, they are *willing* to trade X for Y.

  Defenders of incomplete preferences (like Isaac Levi) argue this assumption is false. They claim that "No Preference" $\neq$ "Indifference."
  *   **Indifference:** I like them equally; I will swap for a penny.
  *   **Incompleteness:** They are not comparable; I will **hold** unless one is strictly better.

  If an agent adopts a **Status Quo Bias** (keep what you have unless strictly dominated), the very first step of the money pump (Y -> X) fails. The agent simply says "No" to the free trade because Y is not *worse* than X.

  **Why this matters for your post:**
  The "Resoluteness" defense is actually a second line of defense.
  1.  **First Defense:** Deny the willingness to trade on incomparability (Levi's defense).
  2.  **Second Defense:** Admit willingness to trade locally, but bind yourself via plans (McClennen's defense).

  Your critique targets the Second Defense. It is valid. But if you want to be thorough, you should acknowledge that many decision theorists think the First Defense is stronger. However, in AI safety, the First Defense is risky: if you train an agent to "hold unless strictly better," it might become dangerously inert or fail to optimize in complex environments where trade is necessary. This makes the Resoluteness debate very relevant for AI.

  ### Key References for Your Post

  If you want to ground this in the literature your friend mentioned, here are the specific concepts and names to look up:

  1.  **Edward McClennen, *Rationality and Dynamic Choice* (1990):** This is the bible for this debate. He distinguishes between:
      *   **Myopic Choice:** (Vulnerable to pumps).
      *   **Sophisticated Choice:** (Anticipates future defection, uses backward induction).
      *   **Resolute Choice:** (Commits to a plan and ignores local deviations).
      *   *Your critique is essentially that Resolute Choice violates the Separability axiom.*

  2.  **Johan Gustafsson:** Look for his papers on "Money Pumps for Incomplete Preferences" (e.g., *Philosophy and Phenomenological Research*, 2010s). He formalizes the exact loop you described.

  3.  **Isaac Levi:** *Hard Choices* (1986). He is the main defender of incomplete preferences who argues against the money pump by rejecting the behavioral link between "no preference" and "willingness to swap."

  4.  **The "Separability" Axiom:** This is the technical term for the "always do what's best given what's in front of you" principle you mentioned. EUT requires Separability; Resolute Choice violates it.

  ### Summary for your Post

  You are not garbling the formal version. Your intuition that resoluteness "relocates the coherence requirement" is a sophisticated objection that mirrors the academic critique of McClennen's framework.

  *   **On the Pump:** Your setup is the standard one used in contemporary literature (Gustafsson). Just note that it relies on the agent being *willing* to trade on incomparability.
  *   **On Resoluteness:** You are correct. Resoluteness avoids the pump only by assuming the agent has complete, transitive preferences over *plans* (policies) and values *consistency* enough to override local gains. This means the agent is still an Expected Utility Maximizer, just over a different domain (histories/trajectories rather than terminal states).

  This is a great angle for a post. The AI safety community often treats "Coherence Theorems" as physical laws (like thermodynamics), but as you've identified, they are normative claims about what counts as rational (e.g., is Separability required?). Pointing out that "resoluteness" just shifts the burden to policy-level coherence is a valuable clarification.

  **One final nuance for the AI context:**
  In Deep Learning, "resoluteness" looks like **policy optimization**. We train a policy $\pi$ to maximize expected return. Once trained, the agent executes $\pi$ resolutely. It doesn't re-calculate preferences at every timestep.
  *   *The Catch:* The *training process* itself assumes a complete reward function. If the reward function is incomplete (undefined in some states), the training process itself is under-specified.
  *   *Your Point Applied:* You can't use "the agent will just be resolute about its policy" to escape coherence arguments, because the *selection of the policy* during training is subject to the same coherence pressures. If the loss landscape allows for a "money pump" in policy space, gradient descent might find it.

  This connects your philosophical point directly to the mechanics of AI training, which would make for a very strong conclusion.
