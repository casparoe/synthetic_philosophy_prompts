      *   *Is the Independence Axiom explanation clear?* It's the hardest part. I need to emphasize that the *context* of the gamble matters in REU, whereas in EU, the context (common consequences) cancels out.
      *   *Fanaticism:* Make sure to link back to the EA context. The "utility function" escape hatch (bounded utility) is one way to stop fanaticism. REU is the other way (risk function).

  6.  **Final Review against User Prompt:**
      *   Walkthrough properly? Yes.
      *   What is $r$-function doing structurally? Yes (transforming cumulative prob).
      *   Why not concave utility? Yes (risk over utils).
      *   Which axiom weakened? Yes (Independence).
      *   Cumulative trick & stochastic dominance? Yes.

  7.  **Final Output Generation** (Proceed to write the response based on these thoughts).
answer: |-
  This is a precise and high-value question. You have correctly identified the tension: on the surface, Risk-Weighted Expected Utility (REU) looks like Expected Utility (EU) with a weird transformation, and it is tempting to dismiss it as "just concave utility over wealth."

  However, for the purposes of the fanaticism debate in Effective Altruism (EA), the distinction is existential. If REU collapses into standard EU with a concave utility function, it cannot solve the fanaticism problem without implying that saving a billion lives has diminishing marginal value (which many longtermists reject).

  Here is the technical walkthrough of what Buchak's REU is doing, why it is structurally distinct from concave utility, the axiomatic cost, and how the cumulative formulation preserves stochastic dominance.

  ---

  ### 1. The Structural Difference: Risk over Utils vs. Value of Goods

  To see why a concave utility function $u(x)$ cannot do the work of the risk function $r(p)$, we must look at what the variables represent.

  **Standard Expected Utility (EU):**
  $$EU = \sum_{i} p_i \cdot u(x_i)$$
  In EU, risk aversion is modeled *entirely* through the curvature of $u$. If $u$ is concave ($u'' < 0$), the agent is risk-averse. However, this risk aversion is tied to the **goods themselves**. It says, "The difference between \$10 and \$20 is more valuable to me than the difference between \$110 and \$120."

  Crucially, EU assumes that once you have converted goods into utils, you are **risk-neutral over the utils**. If I offer you a gamble:
  *   50% chance of 10 utils
  *   50% chance of 0 utils
  The EU value is $5$. You should be indifferent between this gamble and 5 utils for sure.

  **Risk-Weighted Expected Utility (REU):**
  Buchak (following Quiggin and Yaari's Rank-Dependent Utility) proposes:
  $$REU = \sum_{i} \left[ r\left(\sum_{j=i}^{n} p_j\right) - r\left(\sum_{j=i+1}^{n} p_j\right) \right] \cdot u(x_i)$$
  Where outcomes $x_1 \le x_2 \le \dots \le x_n$ are ordered from worst to best.

  Let's simplify that weight term. Let $P(\ge x_i)$ be the cumulative probability of getting outcome $x_i$ or better. The weight assigned to outcome $x_i$ is:
  $$w_i = r(P(\ge x_i)) - r(P(\ge x_{i+1}))$$

  **The Crucial Distinction:**
  In REU, you can be risk-averse **even if $u(x)$ is linear.**
  Imagine $u(x) = x$ (you value money linearly).
  *   **EU Agent:** Indifferent between \$50 sure and (50% \$100, 50% \$0).
  *   **REU Agent:** If $r(p) = p^2$ (risk-averse risk function):
      *   Weight for \$100: $r(0.5) - r(0) = 0.25 - 0 = 0.25$
      *   Weight for \$0: $r(1) - r(0.5) = 1 - 0.25 = 0.75$
      *   $REU = 0.25(100) + 0.75(0) = 25$.
      *   They prefer the sure \$50.

  **Why this matters for Fanaticism:**
  In the EA fanaticism debate, the worry is that $p \cdot u(\text{saved lives})$ is huge even when $p$ is tiny.
  *   **The Concave $u$ Escape:** To stop this in EU, you must argue that $u(\text{saved lives})$ is bounded or sharply concave. You must argue that saving the billionth life is worth vastly less than saving the first. Many find this morally repugnant.
  *   **The REU Escape:** You can argue that $u(\text{saved lives})$ is linear (every life counts equally), but $r(p)$ is highly concave. You are saying, "I value every life equally, but I discount the *probability* of achieving that value non-linearly based on my global attitude toward risk."

  This is what your source meant by "global attitude toward risk, not a local one."
  *   **Concave $u$:** Local. It's about the specific goods (lives, dollars).
  *   **Concave $r$:** Global. It's about the structure of the gamble itself, regardless of what is being gambled for.

  ### 2. The Axiomatic Cost: Violating Independence

  To make room for $r(p)$, REU must sacrifice a core pillar of von Neumann-Morgenstern (vNM) rationality: **The Independence Axiom.**

  **The Independence Axiom:**
  If you prefer Gamble $A$ to Gamble $B$, then for any Gamble $C$ and any probability $k$, you must prefer the mixture $kA + (1-k)C$ to $kB + (1-k)C$.
  Essentially: Common consequences should cancel out. Your preference between $A$ and $B$ shouldn't change just because they are both embedded in a larger context $C$.

  **Why REU Violates It:**
  In REU, the weight an outcome receives depends on its **rank** within the specific gamble.
  1.  In Gamble $A$, outcome $x$ might be the *best* possible outcome. Its weight is determined by $r(P(\ge x))$.
  2.  In the mixture $kA + (1-k)C$, outcome $x$ might now be a *middle* outcome (if $C$ offers something better).
  3.  Because its rank changed, its cumulative probability changed, so the $r$-function applies differently.
  4.  Therefore, the relative value of $A$ vs $B$ can flip depending on the common consequence $C$.

  This is precisely what allows REU to model **Allais Paradox** behavior normatively. In the Allais Paradox, people violate Independence. EU says this is irrational. Buchak argues that sensitivity to the "security" of a payoff (which changes based on the context of other outcomes) is a rational component of risk, not a cognitive bug.

  ### 3. The Cumulative Trick and Stochastic Dominance

  You asked specifically about the cumulative/rank-dependent trick. This is vital for avoiding the pathologies of early Prospect Theory (Kahneman & Tversky, 1979).

  **The Problem with Raw Probability Weighting:**
  If you simply replace $p_i$ with a weighted $w(p_i)$ in the EU formula ($\sum w(p_i)u(x_i)$), you run into two problems:
  1.  **Normalization:** $\sum w(p_i)$ might not equal 1. The "probabilities" no longer sum to unity, making the value scale arbitrary.
  2.  **Stochastic Dominance Violations:** You can construct gambles where Gamble A is strictly better than Gamble B in every state, but the weighting function makes B look better.
      *   *Example:* Suppose $w(p)$ is S-shaped (overweighting small probs).
      *   Gamble 1: 10% \$100, 90% \$0.
      *   Gamble 2: 11% \$100, 89% \$0.
      *   Gamble 2 dominates Gamble 1. But if the weighting function is non-monotonic or interacts poorly with the specific probabilities, you might calculate $w(0.10) \cdot 100 > w(0.11) \cdot 100$.

  **The REU/Rank-Dependent Solution:**
  By defining weights as differences in the transformed *cumulative* distribution:
  $$w_i = r(P(\ge x_i)) - r(P(\ge x_{i+1}))$$
  You guarantee two things:
  1.  **Normalization:** The weights sum to $r(1) - r(0)$. As long as $r(0)=0$ and $r(1)=1$, the weights sum to 1.
  2.  **First-Order Stochastic Dominance (FOSD):** As long as $r$ is **monotonically increasing**, REU will never prefer a dominated gamble. If Gamble A gives a higher probability of every outcome level than Gamble B, the cumulative probabilities for A will be higher at every point. Since $r$ is increasing, the transformed cumulative probabilities preserve that order, and the resulting value will be higher.

  This is why Buchak's formulation is theoretically robust where naive probability weighting is not. It allows you to distort probabilities (to model risk) without breaking the basic logic that "more chance of a good thing is better."

  ### 4. Summary for Your Piece

  If you are writing about the fanaticism debate, here is the synthesis:

  1.  **The Fanaticism Problem:** Standard EU implies that if the payoff is large enough, you should accept any non-zero probability. To avoid this, you need the term $p \cdot u(x)$ to stay small as $p \to 0$.
  2.  **The Standard Solution (Bounded Utility):** Make $u(x)$ bounded. This solves the math but implies diminishing moral value of lives, which is controversial in longtermism.
  3.  **The REU Solution:** Keep $u(x)$ linear (moral value is additive), but make $r(p)$ converge to 0 faster than $p$ does (e.g., $r(p) \approx p^2$).
  4.  **The Trade-off:** To get this, you must reject the **Independence Axiom**. You are arguing that it is rational to care about the *distribution* of probabilities, not just the weighted sum.
  5.  **The Mechanism:** The cumulative rank-dependence ensures you don't break basic rationality constraints like Stochastic Dominance, which crude probability weighting would violate.

  **In short:** Concave utility says "The millionth dollar is worth less than the first." REU says "A 1% chance at a million dollars is worth *less than 1%* of a sure million dollars, regardless of what the dollars are worth." That distinction is the only way to block fanaticism without biting the bullet on the value of existential risk reduction.
