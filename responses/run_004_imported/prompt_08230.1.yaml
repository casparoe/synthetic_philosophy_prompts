prompt: |-
  I've been down a rabbit hole for a piece I'm writing on how people in the effective altruism/longtermism world argue about "fanaticism" -- the worry that plain expected-value reasoning commits you to chasing vanishingly small probabilities of enormous payoffs. A couple of the papers I've been reading (I've gone through so many PDFs this month I've lost track of which one it was) bring up Lara Buchak's risk-weighted expected utility theory as one possible way out, and I think I get the basic setup but not really why its supposed to be a big conceptual departure rather than just... expected utility theory with extra risk-aversion baked in.

  From what I understand, REU has you rank outcomes worst-to-best and then run a function r over the *cumulative* probability of getting at least that outcome, instead of just weighting each outcome by its own raw probability like standard EU does. So you can end up giving disproportionate weight to the bad tail of a gamble. But when I asked a source how this is different from simply having a concave utility function (which also makes you averse to spread-out, risky outcomes), he said something like "no no, it's a global attitude toward risk, not a local one about the outcomes themselves" and then had to hop on a call, so I never got the actual mechanics.

  Could you walk me through this properly? Specifically: what is the r-function doing, structurally, that a concave utility function over outcomes can't already do -- and which axiom of ordinary expected utility theory does REU have to weaken or drop to make room for it? I'm also curious whether the cumulative/rank-dependent trick is specifically what lets Buchak dodge problems like stochastic-dominance violations or Allais-style inconsistencies that you'd run into if you just crudely reweighted probabilities without paying attention to rank. Happy for this to get technical, that's kind of the point.
reasoning: |-
  Here's a thinking process that leads to the explanation of Risk-Weighted Expected Utility (REU) theory:

  1.  **Deconstruct the User's Request:**
      *   **Context:** Writing a piece on Effective Altruism (EA)/Longtermism, specifically the debate around "fanaticism" (small prob, huge payoff).
      *   **Core Question:** What is the structural difference between Lara Buchak's Risk-Weighted Expected Utility (REU) theory and standard Expected Utility (EU) theory with a concave utility function?
      *   **Specific Mechanism:** What is the $r$-function doing to cumulative probabilities that a concave $u$-function over outcomes doesn't do?
      *   **Axiomatic Cost:** Which axiom of EU does REU violate/drop?
      *   **Technical Nuance:** How does the cumulative/rank-dependent trick help avoid issues like stochastic dominance violations or Allais paradoxes compared to crude probability reweighting?
      *   **Tone:** Technical, precise, suitable for someone who has read the PDFs but needs the mechanics clarified.

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Standard EU:* $EU = \sum p_i \cdot u(x_i)$. Axioms: Completeness, Transitivity, Continuity, Independence.
      *   *Concave Utility:* $u''(x) < 0$. This captures *diminishing marginal value of goods*. It explains risk aversion regarding *wealth*, but not necessarily risk aversion regarding *gambles* independent of wealth levels.
      *   *Buchak's REU:* $REU = \sum [r(\sum_{j=i}^n p_j) - r(\sum_{j=i+1}^n p_j)] \cdot u(x_i)$. Or equivalently using the cumulative distribution function. It introduces a risk function $r: [0,1] \to [0,1]$.
      *   *Key Distinction:* EU separates belief ($p$) and desire ($u$). REU introduces a third attitude: risk ($r$).
      *   *Axiom Violated:* The Independence Axiom (specifically, the sure-thing principle aspect of it).
      *   *Fanaticism:* EU implies you should take a bet if $p \cdot u(\text{payoff}) > \text{cost}$. If $u$ is unbounded, tiny $p$ with huge payoff wins. REU can dampen the tiny $p$ more aggressively than linear weighting.
      *   *Stochastic Dominance:* Rank-dependent models generally preserve first-order stochastic dominance (FOSD) if $r$ is increasing. Crude probability weighting (like in original Prospect Theory) can violate FOSD.

  3.  **Drafting the Explanation - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the rabbit hole. Validate that the distinction is subtle but crucial for the fanaticism debate.

      *   **Part 1: The Structural Difference (The Math):**
          *   Write down the EU formula.
          *   Write down the REU formula.
          *   *Crucial Step:* Explain the transformation. In EU, $p$ is linear. In REU, $p$ is transformed by $r$.
          *   *The "Concave Utility" Counter-argument:* Why isn't $u(x) = \sqrt{x}$ enough?
              *   *Scenario:* Compare a gamble over *utilities* directly. If we define the gamble in terms of utils, EU *must* be risk-neutral over utils. REU allows risk-aversion *over utils*.
              *   *Example:* A gamble between 10 utils and 0 utils. EU says value is $10p$. REU says value is $10 \cdot r(p)$. If $r(p) < p$ (for small $p$), you reject the gamble even if the expected utils are positive. A concave $u$ function can't do this if the inputs are already utils.
              *   *Separation:* EU conflates "I value money less as I get more" with "I dislike uncertainty." REU separates them.

      *   **Part 2: The Axiomatic Cost:**
          *   Identify the culprit: **The Independence Axiom**.
          *   Explain Independence roughly: If you prefer A to B, you should prefer $pA + (1-p)C$ to $pB + (1-p)C$.
          *   Explain why REU violates it: Because the weight assigned to an outcome depends on its *rank* relative to other outcomes in the specific gamble. Adding a common consequence $C$ can change the ranking of outcomes, which changes the cumulative probabilities, which changes the $r$-weights.
          *   Connect to Allais: REU is *designed* to capture Allais-type behavior. EU forbids it.

      *   **Part 3: Cumulative Probabilities & Stochastic Dominance:**
          *   Why cumulative? If you just weight raw probabilities ($p' = w(p)$), you can break normalization ($\sum p' \neq 1$) or violate dominance.
          *   Rank-Dependent Utility (RDU) / REU structure ensures weights sum to 1.
          *   *Stochastic Dominance:* If $r$ is monotonic increasing, FOSD is preserved. This is a major advantage over early Prospect Theory (Kahneman/Tversky 1979), which allowed intransitivities and dominance violations due to editing phases and non-cumulative weighting.
          *   Buchak's specific contribution: Justifying this normatively, not just descriptively.

      *   **Part 4: Relevance to Fanaticism:**
          *   How does this stop the "Pascal's Mugging" style arguments?
          *   In EU, if $u(x)$ grows faster than $1/p$, you take the bet.
          *   In REU, if $r(p)$ shrinks faster than $u(x)$ grows (e.g., $r(p) = p^2$), the term $r(p) \cdot u(x)$ goes to 0 even if $p \cdot u(x)$ goes to infinity.
          *   This allows a "risk-averse" longtermist to say "No" to low-probability high-impact interventions without saying the impact has diminishing marginal utility (which is hard to argue for existential risk prevention).

  4.  **Refining and Polishing:**
