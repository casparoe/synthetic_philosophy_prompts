  1.  **Analyze the Request:**
      *   **Topic:** The tension between Quine's general naturalized epistemology (holism, web of belief, rejection of analytic/synthetic) and his specific stance on ethics in "On the Nature of Moral Values" (emotivism, lack of empirical check, methodological second-class status).
      *   **Key Conflict:** Morton White's objection (if holism is true, why can't moral sentiments be peripheral checks like sensory irritations?) vs. Quine's defense (no moral observation sentences, no convergence mechanism).
      *   **Task:** Write an essay reconstructing both sides strongly, then *take a side* (no fence-sitting).
      *   **Constraint:** If qualifying the stance, be specific (e.g., cognitivism about X but not Y).
      *   **Tone:** Philosophical, rigorous, engaging with the specific texts and arguments mentioned (*Theories and Things*, "On the Nature of Moral Values", White's objection).

  2.  **Deconstruct the Arguments:**

      *   **Side A: The Consistent Quinean Naturalist (Pro-Cognitivism/Naturalized Ethics)**
          *   *Premise 1:* Rejection of First Philosophy. Epistemology is contained within natural science.
          *   *Premise 2:* Confirmation Holism. Statements face the tribunal of experience not individually but as a corporate body.
          *   *Premise 3:* Rejection of Analytic/Synthetic. No statement is immune to revision in principle.
          *   *Premise 4:* Naturalism implies continuity. If ethics is part of human behavior/cognition, it falls under the naturalistic umbrella.
          *   *Argument:* Moral sentiments (guilt, approval, outrage) are natural phenomena. They function as "peripheral irritations" just like sensory data. We adjust our moral theories to accommodate these sentiments just as we adjust physical theories to accommodate retinal stimulations. Therefore, moral statements can be truth-apt within the web. The fact/value distinction is as untenable as the analytic/synthetic distinction.
          *   *Key Proponent:* Morton White, later naturalists (Boyd, Brink, perhaps Railton).

      *   **Side B: The Quinean Disanalogy (Pro-Emotivism/Non-Cognitivism)**
          *   *Premise 1:* The Web of Belief requires a specific kind of periphery: *recalcitrant experience* that forces convergence.
          *   *Premise 2:* Science converges because the world kicks back. Physics predicts stimuli; if stimuli don't match, theory dies.
          *   *Premise 3:* Ethics lacks this mechanism. Moral disagreement often persists despite shared facts. There is no "moral observation sentence" linked causally to a moral property in the world.
          *   *Premise 4:* Moral values are more about socialization and conditioning than truth-tracking. They are tools for social cohesion, not descriptions of reality.
          *   *Argument:* Holism applies to *cognitive* content. Ethics is fundamentally *conative* (about desires/ends). You can't derive an 'ought' from an 'is' even holistically because the function of the language is different (emotive vs. descriptive). Quine's naturalism is about explaining knowledge, and ethics isn't knowledge in that sense.
          *   *Key Proponent:* Quine (in this specific essay), Stevenson.

  3.  **Evaluate the Tension:**
      *   Quine's holism is radical. It dissolves boundaries. But Quine draws a boundary at science. Why? Because science predicts sensory stimuli.
      *   Does ethics predict sensory stimuli? Not really. It prescribes actions.
      *   However, if "sensory stimuli" are just neural inputs, moral sentiments are also neural inputs. Why is a retinal stimulation epistemically privileged over a feeling of revulsion?
      *   *Quine's likely answer:* Retinal stimulations are intersubjectively checkable in a way feelings aren't. "Red here now" can be agreed upon. "Murder is wrong" cannot be verified by looking.
      *   *Counter:* "Red" is theory-laden. "Wrong" is also theory-laden. Both rely on communal conditioning.
      *   *The Crux:* Is the lack of convergence in ethics due to the *nature of morality* or the *immaturity of moral inquiry*? Quine thinks it's the former (different function). Naturalists think it's the latter (complexity + historical baggage).

  4.  **Determine the Stance:**
      *   The prompt asks me to take a side.
      *   *Option 1: Side with Quine.* Ethics is fundamentally different. The "world" doesn't constrain values the way it constrains physics.
      *   *Option 2: Side with White/Naturalists.* Quine stopped short. A thoroughgoing naturalism swallows ethics.
      *   *Decision:* I will argue for **Side A (The Consistent Quinean Naturalist)**.
      *   *Reasoning:* Quine's rejection of the analytic/synthetic distinction undermines the logical barrier between fact and value. If all knowledge is a man-made fabric contacting experience only along the edges, and moral sentiments *are* part of that experiential edge (even if socially mediated), then excluding them requires a dualism Quine elsewhere rejects. Quine's reliance on "convergence" is an empirical claim that might be too strict or historically myopic. A consistent naturalism treats moral inquiry as a causal-explanatory project regarding human flourishing and social stability.
      *   *Qualification:* I need to be specific. I shouldn't claim moral realism in a Platonic sense. I should claim *naturalistic moral cognitivism*. Moral truths are truths about natural properties (suffering, cooperation, etc.) discoverable via empirical inquiry.

  5.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Quine's *Theories and Things*. The anomaly of "On the Nature of Moral Values." State the thesis: Quine's emotivism is a betrayal of his own holism. White was right.
      *   **Section 1: The Quinean System (The Setup).** Briefly explain naturalized epistemology, the Web of Belief, and the rejection of First Philosophy. Emphasize that *everything* is in the web.
      *   **Section 2: Quine's Ethical Exception.** Detail his argument in the 1978 essay. Uniformity, lack of empirical check, emotive function. The "closed loop" problem.
      *   **Section 3: White's Challenge (The Internal Critique).** Reconstruct White's argument. If observation is theory-laden, why isn't moral sentiment observation? If holism rules, why is the fact/value line sharp? The "sensory irritation" vs. "moral sentiment" analogy.
      *   **Section 4: Defending Quine (The Disanalogy).** Steelman Quine. Science predicts stimuli; ethics doesn't. Convergence is the mark of truth-tracking. Ethics is about social cohesion, not description.
      *   **Section 5: The Verdict (Taking a Side).** Argue why White wins. Quine's criterion for "science" is too narrow (physics-envy). Moral sentiments *do* function as checks. The lack of convergence is overstated (human rights, harm). A consistent naturalism must naturalize ethics.
      *   **Conclusion:** Summarize. Quine opened the door but walked through only halfway. True naturalism requires seeing ethics as continuous with science.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "observation sentence" issue? Quine places huge weight on intersubjective linguistic behavior.
      *   *Correction:* I need to address whether moral judgments can be observation sentences. Quine says no because they aren't causally linked to physical objects. I need to argue they are causally linked to *social* objects/states which are natural.
      *   *Check:* Am I being too realist?
      *   *Correction:* Keep it Quinean. Truth is immanent. Moral truth is truth within our best theory of how to live. No "spooky" values.
      *   *Specific Qualification:* I will argue for naturalistic cognitivism regarding *instrumental* and *constitutive* goods (flourishing), while acknowledging that pure expressive emotivism might still apply to brute aesthetic preferences, but *moral* claims are truth-apt because they make claims about human welfare which is empirical.

  7.  **Final Polish:** Ensure the tone is appropriate for a LessWrong-adjacent audience (rationalist, analytic, precise) but respectful of the philosophical history. Ensure the "Take a Side" instruction is clearly met.

      *(Self-Correction on the "Take a Side" instruction)*: The prompt asks me to take a side on whether consistent Quinean naturalism supports cognitivism. I will argue **Yes, it does.** Quine was inconsistent.

      *(Refining the Qualification)*: I should specify that this supports cognitivism about *functional* moral claims (claims about harm, cooperation, welfare) which are empirically tractable, rather than metaphysical moral claims.

  8.  **Final Review against constraints:**
      *   Reconstruct both sides strongly? Yes.
      *   Take a side? Yes.
      *   Specific qualification if needed? Yes.
      *   Essay format? Yes.

      *Let's write.*
answer: |-
  # The Web and the Will: Why Quine's Ethical Emotivism Betrays His Naturalism

  Willard Van Orman Quine is best known for tearing down walls. In "Two Dogmas of Empiricism," he demolished the barrier between analytic and synthetic truths. In *Word and Object*, he dissolved the notion of a private language and the certainty of meaning. In *Epistemology Naturalized*, he collapsed the distinction between philosophy and psychology, arguing that there is no "first philosophy" standing outside of science to justify it. Quine's grand project was one of radical continuity: knowledge is a single, unified web of belief, contacting experience only at the periphery, with no statement immune to revision.

  Yet, tucked inside *Theories and Things* (1978), there is a wall Quine refused to knock down. In "On the Nature of Moral Values," Quine argues that ethics is methodologically distinct from science. He claims moral disagreements lack the empirical check that forces scientific convergence, leaving ethics trapped in a coherentist loop that can only be resolved through emotive persuasion rather than truth-tracking. He concludes that while science describes the world, ethics merely expresses our attitudes toward it.

  This position has long struck critics as a glaring inconsistency. As Morton White pointed out, if Quine's holism is correct, the fact/value distinction should have vanished alongside the analytic/synthetic distinction. If moral sentiments function as "peripheral irritations" within the web of belief, ethics ought to be naturalized alongside physics and psychology.

  This essay will reconstruct the tension between Quine's general naturalism and his specific ethical non-cognitivism. I will first present the case that a consistent Quinean must naturalize ethics, treating moral claims as truth-apt components of the web. I will then steelman Quine's defense of the disanalogy, focusing on the lack of convergence and observation sentences. Finally, I will argue that Quine's defense fails. A consistent Quinean naturalism entails a form of **naturalistic moral cognitivism**, specifically regarding claims about human flourishing and social stability, rendering Quine's own emotivism an unjustified retreat into dualism.

  ### The Case for Naturalized Ethics: White's Challenge

  To understand why Quine's ethical essay sits so uneasily with his corpus, one must grasp the radical nature of his confirmation holism. For Quine, our beliefs form a "corporate body." When experience conflicts with our predictions, we have a choice of which beliefs to revise. We usually tweak statements near the periphery (observation sentences), but in principle, even logical laws or moral axioms could be revised to save a cherished theory. There is no *a priori* guarantee that any class of statements is non-cognitive.

  Morton White's objection leverages this holism against Quine's ethical exceptionalism. White argues that Quine treats "sensory irritation" (the input for science) as epistemically privileged over "moral sentiment" (the input for ethics). But why? In a naturalized framework, both are causal impacts on the human organism. A retinal stimulation is a physical event; a feeling of moral outrage or empathetic distress is also a physical event, mediated by neural pathways and social conditioning.

  If the criterion for a statement being "cognitive" or "truth-apt" is simply that it plays a role in a theory that accommodates experiential inputs, then moral statements qualify. We hold moral theories (e.g., "suffering is bad," "promises should be kept"). We encounter experiential inputs (e.g., witnessing suffering, experiencing the social fallout of broken promises). When our moral theory conflicts with these inputs (e.g., a theory that justifies slavery clashes with the observed distress of slaves and the empathetic revulsion of the observer), we revise the theory.

  From this perspective, the fact/value distinction is not a metaphysical chasm but a gradient within the web. "Water boils at 100°C" is central and highly convergent. "Torture is wrong" is also highly convergent, anchored by deep-seated human psychological dispositions (pain aversion, empathy). To say science tracks truth while ethics tracks "emotive work" is to reintroduce the very dualism Quine spent his career dismantling. It posits a "scientific world" that is real and a "moral world" that is merely projected. For a thoroughgoing naturalist, both are human constructs designed to navigate a causal environment. If science earns the title of "knowledge" by successfully predicting and controlling stimuli, ethics earns it by successfully predicting and controlling social cohesion and individual well-being.

  ### The Case for the Disanalogy: Quine's Defense

  Quine, however, was not careless. His refusal to naturalize ethics rests on a specific, empirical claim about the *mechanism* of theory choice. For Quine, the hallmark of science is not just that it faces experience, but that experience *forces convergence*.

  In "On the Nature of Moral Values," Quine emphasizes uniformity. He notes that while languages and aesthetic tastes vary wildly across cultures, moral codes show significant convergence (e.g., prohibitions on murder within the in-group). However, he argues this convergence is insufficiently robust. In physics, if two competent observers disagree on a prediction, a repeatable experiment can adjudicate the dispute. The world "kicks back." In ethics, Quine argues, there is no analogous "moral observation sentence."

  Quine's argument hinges on the causal link. An observation sentence like "Red here now" is triggered directly by a physical stimulus. It is intersubjectively verifiable because the stimulus is public. A moral judgment like "That is unjust" is not triggered directly by a physical stimulus in the same way; it is mediated by complex cultural conditioning and internal sentiment. Two observers can agree on all the physical facts of a case (the money was stolen, the owner is poor) and still disagree on the moral valuation, without one necessarily being "observationally mistaken."

  Furthermore, Quine argues that the *function* of moral language is different. Scientific language aims to describe structure and predict stimuli. Moral language aims to coordinate behavior and reinforce social norms. When we call something "good," we are not describing a property in the object; we are issuing a command or expressing an attitude to encourage similar behavior in others. For Quine, this makes ethics methodologically second-class. It is part of the "web," yes, but it is part of the web that functions as a tool for social engineering, not a map of reality. Because there is no mechanism to force convergence on ultimate ends (e.g., "Why maximize happiness?" vs. "Why maximize honor?"), ethics remains a closed loop of coherentist justification, lacking the external anchor that grants science its claim to truth.

  ### The Verdict: In Defense of Consistent Naturalism

  Quine's defense is sophisticated, but it ultimately fails to cohere with the deeper implications of his own naturalism. Quine stops short of naturalizing ethics because he retains a tacit, unargued preference for *physics* as the paradigm of knowledge. He assumes that unless a domain mimics the convergence patterns of fundamental physics, it is not truth-apt. This is "physics-envy," and it is inconsistent with the lesson of "Two Dogmas."

  I argue that **consistent Quinean naturalism supports moral cognitivism**, with a specific qualification: **moral claims are truth-apt insofar as they make empirical claims about human flourishing, social stability, and psychological welfare.**

  Quine's disanalogy rests on the claim that moral disagreements cannot be adjudicated by experience. This is empirically false. Moral theories *do* make predictions about the world. A moral theory that advocates for unrestricted poisoning of water supplies will be rejected not merely because of "emotive work," but because it leads to the collapse of the community adopting it. The "recalcitrant experience" Quine demands is present: it is the experience of social breakdown, psychological trauma, and biological suffering.

  Quine claims there are no "moral observation sentences." But consider the sentence "The child is in pain." This is an observation sentence. It is causally linked to a physical state. Now consider "It is wrong to torture the child." For Quine, the first is cognitive, the second is emotive. But for a naturalist, the second statement is a theoretical inference from the first, linked by a bridge principle: "Causing unnecessary pain is wrong." If "pain" is a natural property, and "wrongness" is functionally defined as "that which we have overriding reason to avoid/minimize," then the moral claim is a claim about the natural world.

  The lack of convergence Quine laments is not a sign of non-cognitivism; it is a sign of complexity. Moral inquiry is harder than physics because the variables (human psychology, cultural history, resource scarcity) are more complex and less isolatable than electrons. But difficulty is not dualism. The fact that moral convergence is slower or less perfect than physical convergence does not mean moral statements lack truth values; it means our moral theories are less refined.

  Quine's emotivism requires him to treat moral sentiments as mere causal nudges, distinct from the "evidence" of science. But Quinean naturalism dictates that *all* evidence is just causal nudges on our sensory surfaces. To privilege retinal stimulations over feelings of empathetic distress is to draw the very analytic/synthetic line Quine rejected, merely relocating it to a fact/value boundary. If we are natural creatures, our moral sentiments are as much a part of the natural order as our visual cortex. To ignore them as sources of truth is to ignore data.

  Therefore, Quine was wrong to sign on to Stevenson-style emotivism. He should have followed Morton White. A consistent Quinean must view ethics as a branch of social science and psychology. Moral truths are not Platonic forms; they are immanent truths within our best theory of how sentient beings interact.

  **The Qualification:**
  This defense of cognitivism is not a defense of *all* moral discourse. Consistent Quinean naturalism supports cognitivism regarding **functional moral claims** (claims about harm, welfare, cooperation, and justice defined as stable social equilibrium). It does not necessarily support cognitivism regarding **brute aesthetic preferences** or **metaphysical moral edicts** detached from natural consequences. If a moral claim cannot be cashed out in terms of natural properties (suffering, flourishing, stability), then Quine is right to call it nonsense. But since the vast majority of serious ethical discourse concerns the regulation of harm and cooperation, the bulk of ethics falls within the scope of naturalistic inquiry.

  Quine opened the door to a unified science of knowledge but refused to walk through it when the path led to values. He feared that naturalizing ethics would reduce it to mere description. In reality, naturalizing ethics elevates it to the status of inquiry. It allows us to say that slavery was not just "disapproved of," but *wrong* in the same robust, naturalistic sense that the geocentric model was *false*: it failed to account for the data of human experience and the requirements of a sustainable web of belief. To be a Quinean is to believe that there is only one world, and we are in it. Our values are part of that world, and they are subject to its laws.
