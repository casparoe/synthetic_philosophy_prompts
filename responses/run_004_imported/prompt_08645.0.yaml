      *   *Correction:* Raghunatha's innovation is more about ontology (categories) and the definition of inference (*vyapti*). But the Nyaya-Mimamsa war on *Arthapatti* is definitely live.
      *   *Emphasis:* Make sure to highlight that "settled" is the wrong word. "Shared vocabulary" is right, "Shared definitions" is wrong.

  9.  **Final Output Structure:**
