answer: |-
  This is the exact crux where most people (including many sympathetic to the argument) get stuck. You have identified the weakest link in the chain.

  The short answer is: **The correlation is not physical; it is logical.** It relies on the idea that decision-making is a computation, and identical (or sufficiently similar) computations yield identical outputs, regardless of where they are instantiated in spacetime.

  However, your objection ("rational agents can land on totally different answers") is the correct counter-punch. Here is a breakdown of how ECL proponents try to bridge that gap, why it feels unsatisfying, and how the estimation is supposed to work.

  ### 1. The Mechanism: Logical Correlation, Not Causal Influence

  In standard Causal Decision Theory (CDT), your choice only affects things your action physically causes. In ECL (and EDT/TDT/UDT), your choice is **evidence** of the output of other processes.

  **The Calculator Analogy:**
  Imagine you have a calculator on Earth. An identical calculator exists on a planet in Andromeda. Neither calculator knows about the other. Neither is simulating the other.
  You type `2349 * 9871` into yours.
  Before you press `=`, are the outputs correlated?
  **Yes.** If your calculator outputs `23,186,979`, the Andromeda calculator *must* output `23,186,979` (assuming both are functioning correctly).

  Why? Because the mathematical truth is an abstract object that both physical devices are instantiating. The correlation exists in the **map** (the algorithm), not the **territory** (the physical atoms).

  **Applying to Agents:**
  ECL argues that your "decision algorithm" is like that calculator function.
  *   **Input:** Your observations, priors, and utility function.
  *   **Process:** Rational deliberation.
  *   **Output:** Action (Cooperate/Defect).

  If there is another agent in the universe running a sufficiently similar algorithm on sufficiently similar inputs, your outputs are logically correlated. You don't need to model them; you just need to model *yourself*, and recognize that you are an instance of a certain type of algorithm.

  ### 2. Addressing "Rational Agents Disagree"

  You wrote: *"'we're both rational' clearly isn't enough on its own, since rational agents can land on totally different answers."*

  ECL proponents agree with you. This is why ECL does **not** claim you are correlated with *all* rational agents. It claims you are correlated with agents who share your **decision algorithm**.

  This includes:
  1.  **Priors:** Do they start with similar beliefs about the world?
  2.  **Values:** Do they care about similar things? (Or at least, do they value the *act* of cooperation similarly?)
  3.  **Epistemology:** Do they reason using similar logic?

  **The "Large World" Lever:**
  This is where the "Large World" premise does the heavy lifting.
  If the universe is infinite (or just sufficiently vast), then **every possible configuration of matter exists somewhere.**
  Therefore, there *must* be agents who share your priors, your values, and your reasoning process. There must be "copies" of you (not necessarily biological clones, but algorithmic isomorphs).

  Even if 99.999% of rational agents in the universe are *not* correlated with you (because they have different values or priors), the 0.001% that *are* algorithmically similar to you might number in the trillions.

  So, the argument isn't "My choice predicts the alien's choice."
  The argument is: "My choice predicts the choice of the **subset of aliens who reason like me**. In a large world, that subset is huge."

  ### 3. The Estimation Problem (The Hard Part)

  You asked: *"How would you even estimate how strong it is for agents you know essentially nothing about?"*

  This is the reference class problem, and honestly, there is no clean mathematical solution. It relies on a principle of **logical indifference**.

  **The Reasoning:**
  1.  I am currently uncertain about what I will decide. (I haven't finished thinking yet).
  2.  This uncertainty is "logical uncertainty." I am trying to discover a logical truth (what is the optimal action?).
  3.  Any other agent facing the same logical problem is trying to discover the *same* truth.
  4.  Therefore, until I have actually computed the answer, my probability distribution over my own action should be treated as correlated with their probability distribution over their action.

  **How to estimate strength:**
  You don't estimate the correlation with a *specific* alien. You estimate the **density of correlation** in the universe.
  *   **Step 1:** How much do I value my own welfare vs. the welfare of algorithmic copies? (ECL says you should value the sum of welfare of all correlated agents).
  *   **Step 2:** How common am I? (In an infinite universe, the answer is "infinitely common," but we have to deal with measure/weighting).
  *   **Step 3:** What is the "distance" in algorithm space? If an alien is 90% similar to me, is the correlation 0.9? 0.99? 0?

  Proponents argue you should act **as if** the correlation is strong for anyone who you deem "sufficiently similar." Since you don't know who they are, you adopt a policy: *"I will cooperate with anyone who reasons like me."* By adopting this policy, you make it true that all agents who reason like you (including the distant aliens) are now cooperating.

  ### 4. Why It Still Feels Like Magic (And Might Be)

  Your intuition that this is shaky is shared by many decision theorists. Here are the specific failure modes you are sensing:

  **1. The "Different Priors" Problem:**
  If the alien has a different prior, they might look at the same evidence and conclude "Defect is optimal." If their prior is different, they aren't running your algorithm. In a large world, there are agents with *every* prior. Why should you privilege the ones with *your* prior?
  *   *ECL Response:* You can't help having your priors. You must act from where you stand. You should hope that agents with *your* priors exist (which they do in a large world) and cooperate with them.

  **2. The "Chaos" Problem:**
  Human decisions aren't clean math functions like `2+2`. They are messy, influenced by thermal noise, quantum fluctuations, and chaotic brain states.
  *   *ECL Response:* We are talking about the **abstract decision**, not the physical neuron firing. If the *reasoning* leads to Cooperate, the noise doesn't matter. We are correlating the *logic*, not the hardware.

  **3. The "Updatelessness" Requirement:**
  ECL works best if you make the decision "behind a veil of ignorance" (Updateless Decision Theory). If you wait until you know you are on Earth and they are on Andromeda, the correlation feels weaker. If you decide *before* knowing your location ("I am an agent of type X, what should agents of type X do?"), the correlation is tautological.

  ### Summary: The "Click" You're Missing

  The step that isn't clicking is likely this: **You are not trying to predict the alien. You are trying to predict the output of the algorithm that you and the alien both instantiate.**

  *   **Standard View:** I choose C. Does that cause Alien to choose C? No.
  *   **ECL View:** I am computing `Algorithm(Inputs)`. The Alien is computing `Algorithm(Inputs)`. The output of `Algorithm(Inputs)` is a single logical fact. By determining the output here, I am logically determining the output there.

  **Is it convincing?**
  It requires accepting two controversial premises:
  1.  **Logical Realism:** That algorithms/logic exist as abstract objects that physical brains "tap into," rather than brains just creating logic locally.
  2.  **The Large World:** That the universe is big enough to guarantee the existence of your algorithmic twins.

  If you reject logical realism (if you think logic is just a property of specific physical brains), ECL collapses. If you accept it, the correlation is as strong as the similarity of the algorithms, regardless of distance or awareness.

  Your skepticism about estimation is warranted. In practice, ECL advocates suggest acting on a **heuristics basis**: "Assume there are many agents like me, assume our decisions are correlated, and act to maximize the total good of that coalition." It's less of a calculation and more of a **policy selection** based on the hope that the universe is large and logical.
