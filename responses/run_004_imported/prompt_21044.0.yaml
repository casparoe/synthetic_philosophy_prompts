answer: |-
  This is a sharp question that cuts to the heart of the difference between Aquinas's metaphysics of action and the codified "Doctrine of Double Effect" (DDE) that later commentators derived from him. To answer this, we must resist the temptation to simply run the Loop Track case through the familiar four-condition checklist (act good/neutral, intention good, means not evil, proportionality). Aquinas does not offer a checklist in *Summa Theologica* II-II, q.64, a.7; he offers an analysis of the *structure of the human act*.

  If we reconstruct Aquinas's reasoning on his own terms, focusing on the *object* of the will, the distinction between *aggressor* and *innocent*, and the nature of voluntary causality, the Loop Track case presents a significant difficulty that likely leads to a prohibition, though for reasons more nuanced than the standard "means vs. side-effect" slogan suggests.

  ### 1. The Structure of Intention: *Per Se* vs. *Praeter Intentionem*

  In q.64, a.7, Aquinas argues that a single act can have two effects: one intended (*intentum*) and one beside the intention (*praeter intentionem*). He writes:

  > "Nothing hinders one act from having two effects, only one of which is intended, while the other is beside the intention... Moral acts take their species according to what is intended, and not according to what is beside the intention, since this is accidental."

  In the case of self-defense, the intended effect is the preservation of one's own life. The killing of the aggressor is *praeter intentionem*. It happens, but it is not what the will aims at. The will aims at *stopping the attack*. The death is a consequence of the force used to stop the attack, not the mechanism by which the attack is stopped.

  Now, apply this to the Loop Track.
  *   **The End:** Saving the five workers.
  *   **The Act:** Throwing the switch.
  *   **The Causal Chain:** Trolley diverts $\rightarrow$ Hits Man $\rightarrow$ Man's mass stops Trolley $\rightarrow$ Five saved.

  In the standard "Bystander" case (where the track does not loop), the man's death is causally incidental. The trolley is diverted onto a safe path; unfortunately, a man is standing there. The saving of the five is achieved by the *diversion*, not by the *death*. One could argue, on Aquinas's terms, that the death is truly *praeter intentionem* because the causal mechanism of salvation (the diversion) is complete before the death occurs.

  In the **Loop Track**, however, the causal structure is different. The diversion alone does not save the five; the diversion only saves the five *because* it leads to the crushing of the man. The man's obstruction is the *means* (*id ex quo*) by which the end is achieved.

  For Aquinas, the will intends the end *and* the means necessary to that end. In *De Veritate* and the *Prima Secundae* (q.12), he establishes that we will the means *under the aspect of* the end. If the crushing of the man is the causal instrument required to stop the trolley, then the will must embrace that crushing as part of the plan of action. It is no longer merely a foreseen consequence; it is a functional prerequisite.

  Aquinas states in a.7 that "it is not lawful for a man to intend killing a man in self-defense." He restricts the licit intention to "repelling force." In the Loop case, you are not merely repelling a force (the trolley) away from the five; you are utilizing the man's body as a brake. To will the braking is to will the crushing. Therefore, the death of the one moves from being *praeter intentionem* (accidental to the plan) to being *per se* intended (essential to the plan's success). On this specific ground, Aquinas's framework generates a determinate verdict: the act is illicit because the death of the innocent is taken into the intention as a means.

  ### 2. The Crucial Disanalogy: Aggressor vs. Innocent

  However, there is a deeper strain in applying q.64, a.7 to the Trolley Problem, which your professor likely alluded to. Aquinas's argument in a.7 is explicitly about **self-defense against an unjust aggressor**.

  > "This act, since one's intention is to save one's own life, is not unlawful, seeing that it is natural to everything to keep itself in being as far as possible."

  The permissibility of the killing being *praeter intentionem* relies heavily on the context of justice. The aggressor has forfeited certain rights by initiating unjust force. Aquinas is not saying you can kill *anyone* as a side effect of saving yourself; he is saying you can use necessary force against *this attacker*, and if they die, so be it.

  In the Loop Track case, the man on the side track is **innocent**. He is not an aggressor. Aquinas is much stricter regarding the killing of innocents. In q.64, a.6, he argues that it is unlawful to kill the innocent, full stop. He does not provide a "double effect" exception for innocents in the same way he does for aggressors in a.7.

  If we strictly follow Aquinas's own terms, the Loop Track case fails not just because of the intentional structure, but because the *object* of the act involves the destruction of an innocent person. Even if one argued that the death was *praeter intentionem* (which is hard to sustain in the Loop case, as shown above), Aquinas requires that the act itself be proportionate and lawful. Using an innocent person's body as a physical barrier against a threat treats them as an instrument, which violates the order of justice.

  For Aquinas, the "proportionality" condition in a.7 ("if a man, in self-defense, uses more than necessary violence, it will be unlawful") presupposes that *some* violence is lawful. Against an innocent bystander, *no* direct violence is lawful. Therefore, the proportionality calculation (5 lives vs. 1 life) never even gets off the ground. The act is disqualified by the status of the victim before the calculus begins.

  ### 3. Voluntary in Itself vs. Voluntary in Its Cause

  You asked if Aquinas's broader treatment of voluntary action could do work the later summary cannot. This is where the distinction between what is voluntary *in itself* and what is voluntary *in its cause* (ST I-II, q.6, a.3) becomes vital.

  Aquinas distinguishes between:
  1.  **Voluntary in itself:** I will the thing directly (e.g., I push the man).
  2.  **Voluntary in its cause:** I will a cause that I know will produce the effect, even if I don't will the effect directly (e.g., I get drunk knowing I will crash the car).

  In the standard "Bystander" case, a defender of DDE argues the death is merely foreseen, not voluntary. But Aquinas is skeptical of claims that foreseen consequences are "unintended" if the agent proceeds. In *De Malo*, he suggests that if you know an effect will follow and you do not prevent it when you can, it is voluntary in its cause.

  In the **Loop Track**, the connection is tighter than mere foresight. The death is not just a predicted outcome; it is the *causal bridge*.
  *   If I throw the switch, I cause the trolley to hit the man.
  *   I know the trolley hitting the man is what stops the trolley.
  *   Therefore, I am causing the stopping *by* causing the hitting.

  Aquinas would likely argue that this collapses the distinction between "voluntary in cause" and "voluntary in itself" regarding the moral species of the act. If the evil effect (death of innocent) is the *medium* through which the good effect is achieved, the agent makes that evil effect their own. It becomes "voluntary in itself" in the moral order, even if physically I only touched a switch.

  This addresses the "physical distance" objection. For Aquinas, moral proximity is determined by the order of intention and causality, not spatial distance. Throwing a switch that utilizes a man's death as a brake is morally equivalent to pushing him, because in both cases, the will rests upon the man's destruction as the instrument of salvation.

  ### 4. Does the Framework Strain?

  Does this framework strain? Yes, but perhaps less than the modern checklist.

  The strain arises because Aquinas's system is not built for **conflicts of innocent lives**. It is built for **defense against injustice**. When you remove the "unjust aggressor" from q.64, a.7, the justification for allowing *any* killing *praeter intentionem* weakens considerably.

  Modern philosophers use the Loop Case to show that the "means/side-effect" distinction is unstable. Aquinas would likely agree that it is unstable *if* we treat it as a purely causal/physical distinction. But for Aquinas, the distinction is **teleological**.
  *   **Bystander Case:** The death is outside the *ordo intentionis* (order of intention) because the saving is achieved by the *diversion*.
  *   **Loop Case:** The death is inside the *ordo intentionis* because the saving is achieved by the *obstruction*.

  Aquinas's framework generates a determinate verdict: **The Loop Track action is illicit.**
  1.  **Intention:** The death of the one is a means to the end, not a side effect, making it intended *per se*.
  2.  **Justice:** The victim is innocent, and Aquinas does not permit the intended killing of innocents, nor does he easily permit their unintended killing as a means to save others (unlike aggressors).
  3.  **Voluntariness:** By making the death the causal mechanism, the agent makes the death voluntary in the strongest sense.

  ### Conclusion

  If you bring this to your seminar, the strongest Thomistic point is not the "four conditions," but the **metaphysics of the means**. Aquinas insists that we are responsible for what we intend, and we intend the means necessary to our ends. In the Loop Track, the man's death is not just a cost we pay; it is the tool we use.

  For Aquinas, you cannot use an evil (the unjust killing of an innocent) as a means to a good end, even if you claim you don't "want" the evil. If your plan *requires* it to work, you have willed it. The Loop Track case reveals that the "Bystander" case is only licit for Aquinas because the death is truly causally redundant to the saving mechanism (the diversion). Once the death becomes the mechanism (the Loop), it enters the intention, and for Aquinas, intending the death of an innocent is always a sin against charity and justice.

  The framework strains only if we try to detach it from Aquinas's commitment to natural law and the intrinsic evil of killing innocents. If we keep those commitments, the Loop Track is not a puzzle for Aquinas; it is a clear violation of the order of reason.
