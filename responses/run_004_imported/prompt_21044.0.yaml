prompt: |-
  I'm taking a seminar this term on the ethics of killing, and the last few weeks have moved from Aquinas's treatment of self-defense straight into the modern trolley-problem literature, on the premise that the doctrine of double effect is the thread connecting them. We got through the standard cases without much trouble: the "bystander" version, where you throw a switch to send a runaway trolley from a track holding five workers onto a track holding one, and the "footbridge" version, where the only way to save the five is to push a large man off a footbridge into the trolley's path so that his body stops it. My professor mentioned in passing that Judith Jarvis Thomson devised a further variant, usually called the Loop Track case, specifically to put pressure on the doctrine, but we never actually got to discuss it in class, and it's been bothering me since.

  The case is this: the side track you can divert the trolley onto doesn't just have one man standing on it — it loops around and rejoins the main track before it reaches the five. So if the man weren't there, diverting the trolley would accomplish nothing: it would simply loop back and kill the five anyway. It's only because his body is heavy enough to stop the trolley in its tracks that throwing the switch saves anyone at all. Which means the act looks, physically, exactly like the innocuous bystander case — you're just throwing a switch, at a distance, without touching anyone — but the one man's death is doing precisely the work the doctrine says a death may not do: it is the means by which the five are saved, rather than a side effect of saving them.

  What I'd like from you is a reconstruction of how Aquinas himself, on his own terms, would rule on the Loop Track case — not by way of the later four-condition checklist that scholastic and modern commentators distilled from him, but from the actual argument in Summa Theologica II-II, q.64, a.7, with its distinction between what is intended per se and what merely happens praeter intentionem, and its requirement that the force used be proportionate. Does that framework actually generate a determinate verdict on the Loop Track case, or does it strain in the same way many contemporary philosophers think the ordinary means/side-effect distinction strains here? And is there anything in Aquinas's broader treatment of voluntary action, such as his distinction between what is voluntary "in itself" and what is merely voluntary "in its cause," that could do argumentative work the later summary can't? I'd rather you work through his reasoning on its own terms than fall back on how double effect usually gets presented in an introductory ethics course.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Ethics of killing, specifically the Doctrine of Double Effect (DDE).
      *   **Context:** A seminar moving from Aquinas to modern Trolley Problems (Thomson's Loop Track case).
      *   **Task:** Reconstruct how *Aquinas himself* (not later scholastic summaries/checklists) would rule on the Loop Track case.
      *   **Key Sources:** *Summa Theologica* II-II, q.64, a.7 (Self-Defense), plus broader theory of voluntary action (intention, *praeter intentionem*, voluntary in cause).
      *   **Specific Questions:** Does his framework generate a determinate verdict? Does it strain? Can distinctions like "voluntary in itself" vs. "voluntary in its cause" help where the standard checklist fails?
      *   **Constraint:** Avoid standard introductory ethics course presentations of DDE (the four conditions). Stick to Aquinas's own terms and reasoning.

  2.  **Deconstruct Aquinas's Argument (ST II-II, q.64, a.7):**
      *   *The Act:* An act of self-defense can have two effects: preservation of one's own life and killing of the aggressor.
      *   *Intention:* Nothing hinders one act from having two effects, only one of which is intended (*intentum*), while the other is beside the intention (*praeter intentionem*).
      *   *Moral Species:* Moral acts take their species according to what is intended, not from what is beside the intention.
      *   *Proportionality:* The act must be proportionate to the end. Using more violence than necessary is unlawful.
      *   *Public Authority:* Private individuals cannot intend to kill unless acting under public authority (soldiers/police) or in immediate self-defense where the killing is not the *aim* but a necessary consequence of stopping the attack.
      *   *Key Distinction:* Intending to kill vs. Intending to save oneself (with death as a side effect).

  3.  **Analyze the Loop Track Case:**
      *   *Setup:* Trolley heading for 5. Switch diverts to side track. Side track has 1 man. Track loops back to 5. Man's body stops trolley.
      *   *Mechanism:* Diverting trolley $\rightarrow$ Hits Man $\rightarrow$ Man stops Trolley $\rightarrow$ 5 Saved.
      *   *Contrast with Bystander:* In Bystander, man dies because he's on the track, but his death doesn't *stop* the trolley (the track just ends or is safe). In Loop, his mass/stopping power is the *mechanism* of saving the 5.
      *   *Contrast with Footbridge:* In Footbridge, you push the man. In Loop, you throw a switch (impersonal), but the causal role of the man is like Footbridge (means to an end).

  4.  **Apply Aquinas's Framework to the Loop Case:**
      *   *The Act:* Throwing the switch.
      *   *The End:* Saving the five workers.
      *   *The Means:* Diverting the trolley onto the loop.
      *   *The Death of the One:* Is it intended (*per se*) or beside the intention (*praeter intentionem*)?
      *   *Aquinas's Criterion:* What is the object of the will? If the death is necessary for the end *as a means*, Aquinas tends to view it as intended. If the death is a consequence of a means that is otherwise good/neutral, it might be *praeter intentionem*.
      *   *The "Means" Problem:* In the Loop case, the stopping of the trolley by the man is the *causal mechanism*. For Aquinas, if I will the end, I will the means. If the means *is* the crushing of the man, do I will the crushing?
      *   *Aquinas on Self-Defense:* The killing of the aggressor is *praeter intentionem* because the intention is "to save one's own life." The force used is directed at *stopping the attack*, not at *killing*.
      *   *Application to Loop:* Is the force directed at *stopping the trolley* or *killing the man*? Physically, it's directed at the trolley. But causally, the man's obstruction is required.
      *   *Voluntary in Cause:* If I know the man will die and I act anyway, is it voluntary? Yes. But is it *murder* (unjust killing)?
      *   *Private Authority:* Aquinas is strict here. Private individuals cannot intend to kill. If the Loop case requires intending the death (because it's the means), it's illicit. If the death is side-effect, it might be licit.

  5.  **Drafting the Argument (Iterative Process):**

      *   *Initial thought:* Aquinas would probably forbid it. It looks too much like using a person as a means.
      *   *Refinement:* But Aquinas allows killing in self-defense if the death is side-effect. The key is the *object of the act*. In self-defense, the object is "repelling force." In Loop, is the object "diverting threat" or "crushing man"?
      *   *Nuance:* Aquinas distinguishes between the *act* and the *effect*. The act is throwing the switch. The effect is the man's death. But if the death is the *mechanism*, does it become part of the act's object?
      *   *Thomson's Point:* Thomson introduced Loop to show that physical contact (Footbridge) isn't the moral divider; causal role is.
      *   *Aquinas's Response:* Aquinas cares about the *order of intention*. If I need the man to be crushed to save the five, do I *intend* his crushing?
      *   *Voluntary in Cause:* Aquinas discusses ignorance and negligence. If I know the result, it's voluntary. But moral species depends on intention.
      *   *Proportionality:* Saving 5 vs 1. Aquinas accepts proportionality in self-defense (moderate force). But does he accept utilitarian calculus? Not really. He accepts *necessary* force. Is killing the one *necessary*? Yes, in the thought experiment.
      *   *The Crux:* The distinction between *intending the death* vs. *intending the stopping of the trolley which causes death*. In Loop, the stopping *is* the crushing. In Self-Defense, the stopping *is* the blow, which *causes* death. They are structurally similar.
      *   *Difference:* In Self-Defense, the aggressor is *culpable*. In Loop, the man is innocent. Aquinas's self-defense argument relies heavily on the aggressor's status ("one who is attacking unjustly"). Killing an innocent, even as a side effect, is much harder to justify for Aquinas (see his views on siege warfare or collateral damage, though he doesn't explicitly treat modern collateral damage).
      *   *Wait, check Aquinas on Innocents:* Aquinas generally holds one cannot kill the innocent. Even in war? He discusses this in q.64, a.6 (Killing sinners). Private persons cannot kill sinners. Public authority can. In self-defense (a.7), the aggressor is implicitly treated as a threat that may be neutralized. But if the person on the track is innocent (not an aggressor), does a.7 apply?
      *   *Crucial Point:* a.7 is about *self-defense against an aggressor*. The Trolley Problem involves *innocent threats* or *innocent bystanders*. Aquinas doesn't have a category for "innocent threat" in a.7. He might treat it under justice (q.64, a.6) or charity.
      *   *Re-evaluating the prompt:* The prompt asks to apply a.7's framework (intention/prae intentionem/proportionality) to the Loop case, even if the context (innocents vs. aggressors) differs. I need to be careful not to say "Aquinas wouldn't apply this." I need to say "If we apply this reasoning..."
      *   *Better approach:* Acknowledge the aggressor/innocent gap, but focus on the *structure of intention*.
      *   *The "Means" vs. "Side Effect" in Aquinas:* For Aquinas, if X is necessary for Y, and I will Y, do I will X? Yes, *as a means*. If X is "death of innocent," that is intrinsically evil. Therefore, I cannot will it even as a means.
      *   *In Self-Defense:* The death is not the means. The means is "forceful resistance." Death follows.
      *   *In Loop:* Is the death the means? The *stopping* is the means. The stopping *requires* the crushing/death. So I will the crushing.
      *   *Verdict:* Likely illicit for Aquinas, not because of the "checklist," but because the *object of the will* includes the destruction of the innocent man as a causal instrument.

  6.  **Developing the "Voluntary in Cause" Angle:**
      *   Aquinas (ST I-II, q.6) discusses voluntary action.
      *   Voluntary in itself vs. Voluntary in cause.
      *   If I throw the switch knowing the man dies, is it voluntary? Yes.
      *   Does this make it murder? Only if the act is disordered.
      *   The disorder comes from intending what ought not to be intended (death of innocent).
      *   Does "Voluntary in cause" help distinguish Loop from Bystander? In Bystander, death is foreseen but not causal means. In Loop, death is causal means.
      *   Aquinas might argue that making the death a *cause* of the safety makes it intended *in the order of execution*, even if not *in the order of ultimate end*.

  7.  **Synthesizing the Argument:**
      *   **Introduction:** Acknowledge the shift from Aggressor (Aquinas) to Innocent (Trolley). State the thesis: Aquinas's framework likely condemns the Loop case, not because of a rigid checklist, but because the causal structure makes the death part of the *object* of the act, violating the requirement that one never intend evil (death of innocent) even for a good end.
      *   **Section 1: The Structure of Intention (a.7).** Analyze *per se* vs. *praeter intentionem*. In Self-Defense, death is outside the intention of preserving life. In Loop, is death outside the intention of saving the five? Since the body stopping the trolley is the mechanism, the destruction of the body is willed as a means.
      *   **Section 2: The Innocent vs. Aggressor Problem.** Crucial distinction. Aquinas permits *praeter intentionem* killing of an *unjust aggressor*. He is much stricter regarding innocents. The man on the track is not an aggressor. This makes the "side-effect" justification much harder to sustain.
      *   **Section 3: Voluntary in Cause.** Use I-II, q.6. If the effect is foreseen and causally integral, it is voluntary. In Loop, the death is not just foreseen; it is the *causal bridge*. This collapses the distinction between means and side effect in the *order of execution*.
      *   **Section 4: Proportionality.** Aquinas requires proportionate force. But proportionality only matters if the act is licit in kind. If the act is intrinsically illicit (killing innocent as means), proportionality doesn't save it.
      *   **Conclusion:** The framework strains but yields a verdict. It aligns more with Footbridge than Bystander. The "physical distance" (switch vs. hands) matters less to Aquinas than the "moral distance" (intentional structure).

  8.  **Refining the Tone:**
      *   Scholarly, precise, avoiding anachronism.
      *   Don't use "DDE" as a proper noun (Aquinas didn't call it that). Use "the reasoning of a.7."
      *   Ensure the distinction between *intentio finis* (end) and *intentio medii* (means) is clear.
      *   Address the "Loop" specific mechanics (the loop back).

  9.  **Self-Correction/Check during drafting:**
      *   *Did I rely too much on the 4 conditions?* Need to ensure I'm quoting/paraphrasing ST II-II, q.64, a.7 directly (e.g., "moral acts take their species from what is intended").
      *   *Did I address the "Innocent" issue?* Yes, this is vital. Aquinas's a.7 is about *aggressors*. Applying it to innocents requires extrapolation from his broader views on justice.
      *   *Is the "Voluntary in Cause" point strong?* It helps explain why foresight + causal reliance = intention in the moral sense for Aquinas.

  10. **Final Polish:** Check against the prompt's specific request for "Aquinas himself... on his own terms." Ensure I don't just say "He would say No." Explain *why* based on his metaphysics of action. (e.g., the object of the act).

  *(Self-Correction Note)*: I must be careful not to attribute the modern "means/side-effect" distinction too neatly to Aquinas. He speaks of what is intended *per se* versus what happens *praeter intentionem*. In the Loop case, the death is *praeter intentionem* regarding the *ultimate end* (saving the 5), but is it *praeter intentionem* regarding the *means*? Aquinas says we intend the means. If the death is constitutive of the means, it is intended. This is the key argument.

