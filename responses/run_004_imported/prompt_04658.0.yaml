answer: |-
  This is one of the most frustrating and genuine puzzles in applied philosophy, and your intuition is spot-on: the standard "houseplant" examples are often too simple to capture the systemic complexity of modern organizational failure. You are dealing with what is known as the **problem of profligate omissions**, and your suspicion that "responsibility" is being smuggled into "causation" is shared by many metaphysicians, including Sarah McGrath.

  Below is a new, fully worked-out example designed to mirror the systemic handoffs of your software incident, followed by an analysis of the normative solution and an honest assessment of whether it holds water.

  ### The Example: The Insulin Incident

  Imagine a regional hospital where a diabetic patient suffers severe harm because they receive a vial of insulin that has degraded due to temperature exposure. The insulin was heat-sensitive and should have been kept between 2°C and 8°C. It sat at 25°C for six hours during a handoff process.

  Six specific people failed to act, and counterfactually, any one of their actions would have prevented the harm:

  1.  **The Supplier Driver:** Noticed the truck's cooling unit was making a strange noise but didn't report it before departure.
  2.  **The Receiving Clerk:** Saw the delivery was 30 minutes late (increasing exposure risk) but didn't flag it for priority unloading.
  3.  **The Pharmacy Technician:** Scanned the vial into inventory but skipped the mandatory "temperature integrity check" step to save time during a rush.
  4.  **The Ward Nurse:** Noticed the vial felt slightly warm to the touch but assumed it was body heat from being in her pocket and administered it.
  5.  **The Maintenance Chief:** Had a work order to service the pharmacy cold-storage units that week but deprioritized it for other repairs.
  6.  **The Hospital Administrator:** Had approved a budget cut that removed the automated temperature-alerting system months prior.

  **The Profligacy Problem:**
  Under a strict counterfactual theory of causation (if $C$ had not occurred, $E$ would not have occurred), all six omissions are causes. If the Driver had reported the noise, the truck wouldn't have shipped. If the Administrator hadn't cut the budget, the alarm would have sounded.

  But the problem goes deeper. If counterfactual dependence is all that matters, then **you**, reading this story, are also a cause. If you had flown to the hospital yesterday and turned on the AC, the insulin wouldn't have degraded. The Queen of England is a cause. Every person on Earth who *didn't* fly to the hospital to fix the fridge is a cause.

  This is the profligacy: The set of "things that didn't happen but would have prevented the outcome" is infinite. Yet, in your postmortem, you intuitively feel the Pharmacy Technician and the Administrator are "more" causal than the Queen of England or the random passerby. Why?

  ### The Normative / "Default and Deviant" Solution

  To solve this, philosophers like H.L.A. Hart, Tony Honoré, and more recently Sarah McGrath, argue that we cannot separate causal judgments from **normative expectations**.

  The theory posits that we mentally model the world using a distinction between the **default course of events** (what normally happens) and **deviations** (what shouldn't happen). Causation is not just about physical dependence; it is about identifying the *deviation* from the normal flow that led to the outcome.

  Here is how this solution attempts to single out the "real" causes in the Insulin Incident:

  1.  **Establishing the Baseline:** We construct a model of the hospital's operations. In this model, certain behaviors are set as the "default."
      *   *Default:* Drivers report mechanical issues.
      *   *Default:* Technicians follow scanning protocols.
      *   *Default:* Administrators maintain safety systems.
      *   *Background:* The Queen of England does not manage hospital fridges. Random citizens do not check insulin vials.

  2.  **Filtering via Norms:** When we ask "What caused the harm?", we are actually asking "Which deviation from the expected norm produced this outcome?"
      *   The **Technician's omission** counts as a cause because running the integrity check is a *required* part of the process. Her failure is a deviation from the institutional norm.
      *   The **Administrator's omission** counts because maintaining safety budgets is a *duty* of that role.
      *   The **Queen's omission** does *not* count because there is no normative expectation for her to act. Her inaction is part of the "background conditions," not a deviation.

  3.  **McGrath's Contribution:** Sarah McGrath argues that this isn't just a pragmatic trick we use after finding the physical causes. She suggests that normative expectations are *constitutive* of the causal judgment itself. We literally cannot see the causation without the norm. The "cause" is the place where the world went *wrong*, not just where it changed.

  In your postmortem, this theory justifies focusing on the Technician and the Administrator. Their omissions were "abnormal" in the context of the hospital's intended functioning. The Queen's inaction was "normal" (expected). Therefore, the Technician and Administrator are the causes; the Queen is not.

  ### Honest Assessment: Resolution or Relocation?

  You asked for an honest assessment of whether this resolves the metaphysical puzzle or simply relocates it.

  **The Verdict: It Relocates the Puzzle.**

  The normative solution does not solve the *metaphysical* problem of causation; it solves the *attribution* problem. It admits that physically, the Queen's inaction is just as necessary for the outcome as the Technician's. But it argues that "causation" in human discourse is never purely physical—it is always interest-relative.

  Here is why this distinction matters for your team:

  **1. It confirms your suspicion:**
  You suspected that "responsibility" was being relabeled as "cause." The normative theory essentially agrees with you. It posits that we cannot identify a cause without first agreeing on what people *ought* to have done. This means the search for a "root cause" is never a neutral, scientific excavation of facts. It is inherently a moral or institutional judgment about which norms were violated.

  **2. It exposes the fragility of "Default":**
  The weakness of this solution is defining the "default." In your software incident, you mentioned six people could have acted.
  *   If your company culture implicitly expects engineers to ignore alerts during launch weeks, then the engineer who ignored the alert was acting according to the *actual* social default, even if they violated the *official* protocol.
  *   If the "default" is defined by what is *feasible*, the Administrator might argue the budget cut was necessary for survival, making their omission a "normal" business decision rather than a deviation.

  If the "default" is unstable, the "cause" becomes unstable. This is why postmortems often devolve into arguments: everyone is fighting to establish their behavior as the "normal background" and the other person's behavior as the "deviant cause."

  **3. The Metaphysical Reality:**
  There is no principled, metaphysical answer to "Which omission was *the* cause?" in a vacuum. Physics deals in forces and events, not absences. An absence is not a physical thing; it is a description of a state relative to an expectation. Therefore, asking for *the* cause of a systemic failure is like asking for *the* most important word in a sentence. It depends on what you are trying to communicate.

  ### Implications for Your Next Retrospective

  Given this analysis, your team's instinct to resist "root-causing" in the traditional sense is actually the more philosophically defensible position. Here is how you might frame it:

  1.  **Abandon the Singular Cause:** Acknowledge that in complex systems, causation is conjunctive. The breach happened because *all six* omissions occurred simultaneously. Trying to rank them is an exercise in assigning blame, not finding truth.
  2.  **Focus on "Intervention Points" not "Causes":** Instead of asking "Who caused this?", ask "Which norm, if reinforced, gives us the highest leverage?" This accepts the normative nature of the problem. You aren't looking for the metaphysical spark; you are looking for the most effective place to update the system's "default settings."
  3.  **Validate the "Blameless" Stance:** A truly blameless postmortem recognizes that if six people had the opportunity to stop the failure and didn't, the failure is not in the people (who all acted within some set of incentives/constraints) but in the *system design* that allowed six single points of failure to align.

  **Summary:**
  The normative solution saves us from saying the Queen of England caused the breach, but it does so by admitting that "causation" in this context is a proxy for "violation of expectation." There is no clean metaphysical fix. The puzzle remains: physical reality contains no omissions, only states of affairs. We impose the omissions.

  Your frustration stems from trying to find a physical fact (the cause) where there is only a social one (the expectation). Your team's best path forward is to stop treating the postmortem as a forensic search for *the* cause and start treating it as a design session for *better defaults*.
