answer: |-
  You have hit the nail on the head. That endless argument in your collaboration meetings—flat in $\sigma$ versus flat in $\log \sigma$—was not a failure of your colleagues to grasp statistics. It was a direct, real-world instantiation of Bertrand's Paradox and the breakdown of the naive Principle of Indifference (PoI).

  As a physicist turned philosopher, you are uniquely positioned to see that the mathematical ambiguity you fought over is actually an epistemological feature, not a bug.

  Here are the most important implications of Bertrand's Paradox for a scientist attempting to use "ignorance" to justify a prior, structured by how they should change your approach to refereeing and reasoning.

  ### 1. "Total Ignorance" is a Myth
  The naive Principle of Indifference states: *If there is no reason to prefer one outcome over another, assign them equal probability.* Bertrand's Paradox proves that for continuous variables, this instruction is incomplete. You cannot be indifferent over a parameter $\theta$ and simultaneously indifferent over a non-linear function $f(\theta)$.

  **Implication:** A scientist can never truly claim they are assuming "no information." By choosing a parameterization (e.g., cross-section $\sigma$ rather than $\log \sigma$ or $\sqrt{\sigma}$), you have already imported information. You have implicitly selected a metric for "distance" in the parameter space.
  *   **For the Referee:** Be skeptical of papers that claim a prior is "uninformative" or "objective" without justifying the *parameterization*. Flat in $\sigma$ assumes that the difference between 1 pb and 2 pb is physically equivalent to the difference between 100 pb and 101 pb. Flat in $\log \sigma$ assumes scale invariance (that 1 to 10 is the same "step" as 10 to 100). Neither is "neutral"; they are physical assumptions.

  ### 2. Invariance is the Only Path to Objectivity
  The resolution to the $\sigma$ vs. $\log \sigma$ debate in physics often leaned toward **Jeffreys Priors**. This is the physicist's mathematical answer to Bertrand. Jeffreys priors are constructed to be invariant under reparameterization (they transform with the Jacobian correctly to preserve the probability mass).

  **Implication:** If you want a prior that represents "ignorance" in a principled way, it must not depend on the arbitrary choice of units or variables. The Principle of Indifference should be applied not to the *values*, but to the *symmetries of the problem*.
  *   **For the Referee:** If an author claims a prior is non-informative, check for **reparameterization invariance**. If the physical conclusion (e.g., a 95% CL upper limit) changes drastically if the analysis were done in $\log \sigma$, the prior is driving the physics, not the data. In such cases, the author should be using a Reference Prior or Jeffreys Prior, or explicitly acknowledging the bias introduced by their choice.

  ### 3. The "Well-Posed Problem" (Jaynes' Insight)
  E.T. Jaynes, a physicist who bridged this exact gap, argued that Bertrand's Paradox arises because the problem is ill-posed. "Pick a random chord" is not a physical instruction. Jaynes resolved the paradox by asking: *What physical process generates the chord?* (e.g., throwing straws from a distance vs. picking a midpoint).

  **Implication:** "Ignorance" reasoning is only valid if you can define the **transformation group** relevant to the physical context.
  *   **For the Referee:** Look for physical justification. In your old particle physics context, is there a reason to expect the new physics cross-section to be scale-invariant? (Often yes, in BSM searches). If so, flat in $\log \sigma$ is physically motivated by scale invariance, not just "indifference." If the author cannot articulate the physical symmetry that justifies the prior, they are effectively hiding an assumption.

  ### 4. Sensitivity Analysis is Mandatory, Not Optional
  Because Bertrand's Paradox shows that multiple "indifferent" priors are mathematically consistent but mutually exclusive, no single prior can be proven "correct" based on ignorance alone.

  **Implication:** Since you cannot settle the prior on principled grounds of *truth*, you must settle it on grounds of *robustness*.
  *   **For the Referee:** This is your strongest tool. If a paper presents a Bayesian limit based on a flat prior, demand a **prior sensitivity analysis**. Show the posterior (or the limit) using flat $\sigma$, flat $\log \sigma$, and perhaps a Jeffreys prior. If the conclusions hold across these "reasonable ignorance" priors, the result is robust. If the claim of discovery or exclusion vanishes when switching from flat to log-flat, the result is an artifact of the prior, and the paper should not be published as a definitive physical result.

  ### 5. Distinguish Estimation from Hypothesis Testing
  Bertrand's Paradox bites hardest when calculating probabilities of specific intervals (estimation/limits). It is slightly less volatile in hypothesis testing (Bayes Factors), though still present (Lindley's Paradox).

  **Implication:** The cost of being "wrong" about the prior differs by goal. For setting an upper limit (which your collaborations did constantly), the prior matters immensely in the low-statistics regime.
  *   **For the Referee:** In the low-count regime (where priors dominate), authors should not present Bayesian limits as "facts." They should be presented as *conditional* statements: "Assuming a scale-invariant prior, the limit is..." If they present it as an absolute property of nature without qualifying the prior dependence, they are overclaiming.

  ### Summary for your Refereeing Checklist
  When you see a paper invoking "uninformative priors" or "lack of prior knowledge," Bertrand's Paradox suggests you ask:

  1.  **Parameterization:** What variable is the prior flat in? Is that variable physically privileged (e.g., by symmetry), or just convenient?
  2.  **Invariance:** Would the result change if the analysis were performed in a transformed variable?
  3.  **Robustness:** Did the authors check if their "discovery" or "exclusion" survives a change to a different "ignorance" prior?
  4.  **Justification:** Did they appeal to "ignorance" (forbidden by Bertrand) or to "symmetry/invariance" (allowed by Jaynes/Jeffreys)?

  ### The Philosophical Takeaway
  The reason your collaboration meetings never settled the argument was that you were trying to solve an epistemological problem with a mathematical tool that requires ontological input.

  Bertrand's Paradox teaches us that **probability is not a property of the state of ignorance; it is a property of the relationship between the observer and the parameterization.**

  You weren't failing to find the right prior. You were discovering that "no information" is not a sufficient input for a probabilistic engine. The "right" prior is never the one that represents ignorance; it is the one that represents the symmetries of the physical system you are studying. When those symmetries are unknown, the only honest scientific stance is to show that the data overwhelms the prior, or to admit the result is prior-dependent.

  It is a pleasure to see a physicist grappling with this. It confirms that the "shut up and calculate" approach eventually hits a wall where philosophy is not just helpful, but necessary to prevent mathematical contradictions from masquerading as physical results.
