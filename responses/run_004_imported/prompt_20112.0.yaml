answer: |-
  "It tastes like pennies," Marcus said, staring into the styrofoam cup.

  "Iron for the blood," Dana replied. She didn't drink hers. "Arthur would have insisted. He believed in fortification."

  "Arthur believed in leverage." Marcus finally looked at her. Ten years had carved fine lines around Dana's eyes, the kind earned in late-night drafting sessions, though now she spent them in boardrooms. "How many people did he disenfranchise with this thing?"

  "He protected the polity from itself." Dana's voice was steady, the same tone she'd used in moot court when she was about to dismantle a precedent. "You know the data, Marcus. Universal suffrage assumes voters are rational actors. They aren't. Most are hobbits—disengaged, knowing nothing—or hooligans. Tribal, score-keeping, treating politics like sports."

  "And you're the Vulcans?" Marcus asked, a ghost of their old banter slipping through the bitterness. "Dispassionate? Well-calibrated?"

  "Someone has to be. Mill proposed weighting votes by competence a century and a half ago. We're finally treating it as an engineering problem rather than a religious sacrament. If you can't demonstrate you understand the consequences of policy, why should you dictate them?"

  "Because it's not about the outcome. It's about the standing." Marcus set the coffee down on a draped table. "Who writes the exam, Dana? You did. Who grades it? Your Board. You've built a machine that launders class and race advantages under the label of 'competence.' If you grow up in a zip code where civics isn't taught, you don't fail because you're incapable. You fail because you weren't prepared to pass *your* test."

  "We adjust for socioeconomic variables in the scoring matrix."

  "You adjust the numbers, not the reality," Marcus snapped. "You're asking if a man knows how to navigate a map, but only giving compasses to the people who could afford navigation school. And whose authority is this? By what right does a Board of Franchise decide what knowledge counts? Is it statistics? Is it loyalty?"

  "It's empirical accountability," Dana said, her composure cracking just enough to show fatigue. "Ignorance isn't harmless, Marcus. When people vote without understanding trade-offs, people die. Poorly calibrated policy kills faster than exclusion does. I'd rather be accused of elitism than manslaughter."

  "So you admit it's exclusion."

  "I admit it's triage." She stepped closer, lowering her voice. "You know why you didn't pass. We studied together. You know the material wasn't opaque."

  Marcus flinched, the personal sting landing harder than the political one. "I refused to take the fourth attempt. I wouldn't legitimize the premise that my citizenship is conditional on your approval."

  "That's the hooligan in you talking," Dana said softly. "Taking the score personally instead of checking the work."

  "It's not personal, it's moral." Marcus leaned in, matching her intensity. "Democratic equality isn't something you earn like a merit badge. It's something you're owed because you breathe here. Because you're subject to the laws. If the aggregate result is messy, that's the price of freedom. You want a clean outcome? Run a spreadsheet. Don't call it a government."

  "I want a government that doesn't burn itself down because the majority felt like it." Dana looked past him, toward the eulogy podium where Arthur's portrait sat. "We tried the other way. We watched the decay. This city-state is stable. It's prosperous."

  "It's quiet," Marcus said. "Because you silenced the noise. But you didn't fix the anger. You just took away their megaphone."

  "Better a quiet room than a burning house."

  "Until the people outside realize they hold the matches." Marcus picked up his coffee again, though he didn't drink. "You think you're saving us from ourselves. I think you're just afraid of us."

  Dana was silent for a long moment. The reception hummed around them, mourners exchanging platitudes. "Maybe," she said finally. "Or maybe I just remember the arguments we used to have, before you decided principles mattered more than results. I miss that friend. The one who cared about getting it right."

  "I still care about getting it right," Marcus said. "We just disagree on who gets to define 'right'."

  "I suppose we do." Dana lifted her cup, a toast neither accepted. "To Arthur."

  "To Arthur," Marcus echoed.

  They stood there in the silence, two brilliant minds separated by a wall neither could climb, drinking coffee that tasted like battery acid.
