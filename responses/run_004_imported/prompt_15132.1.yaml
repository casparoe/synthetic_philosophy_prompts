      *   *(b) Anti-Humean Alternative:* Armstrong's DTA (Dretske-Tooley-Armstrong) view. "Relations of natural necessitation between universals N(F,G)." (Accurate). "Necessitate that all Fs are Gs." (Accurate). *Error:* "once N(F,G) holds it holds necessarily, so the corresponding regularity is guaranteed in every world with those laws." This is tricky. Armstrong argues for *natural* necessity, not *logical* or *metaphysical* necessity. Laws are contingent on Armstrong's view (usually). If N(F,G) holds, it holds in this world. Does it hold in every possible world? No, Armstrong typically holds laws are contingent. The student says "once N(F,G) holds it holds necessarily." This sounds like they are attributing metaphysical necessity to the law itself, which Armstrong explicitly denies (he wants to avoid the S5 modal collapse). This is a significant philosophical error.
