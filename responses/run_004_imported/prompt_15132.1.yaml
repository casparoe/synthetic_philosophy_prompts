      *Self-Correction on Armstrong:* Does Armstrong say laws are necessary? He calls it "Natural Necessity." But he distinguishes it from Logical Necessity. He believes laws are contingent (could have been otherwise). The student wrote: "once N(F,G) holds it holds necessarily, so the corresponding regularity is guaranteed in every world with those laws." The phrase "every world with those laws" makes it tautological, but "holds necessarily" suggests the relation itself is necessary. Armstrong's view is that N(F,G) is a contingent fact about our world. I will mark this down.

