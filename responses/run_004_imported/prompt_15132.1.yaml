  }
  ```

  ### **TA-to-TA Advice (For your calibration)**
  Since you mentioned your memory of the material is a bit rusty, here are the two "trap" answers students usually write that you should watch for in the rest of the pile, so you don't get stuck in office hours:

  1.  **The "Laws are Contingent" Trap:** Many students think *all* necessitarians think laws are metaphysically necessary (true in all possible worlds). Armstrong is the exception; he thinks laws are contingent (they could have been otherwise). If a student says Armstrong's laws are necessary *simpliciter*, mark it down.
  2.  **The "Instrumentalist" Trap:** Students often describe Humeanism as saying laws "aren't real, they are just tools." Lewis thinks laws *are* real, they just supervene on the mosaic. If a student says Humeans think laws are "fake," that's a misunderstanding of the ontology vs. epistemology distinction.

  This student fell into the first trap. Grading them strictly on this sets a good precedent for the rest of the pile.
