answer: |-
  Friends, family, and colleagues.

  It is a distinct honor to stand before you as my father turns ninety. As the family's philosopher, I was asked to offer this toast. But as the family's *modern* philosopher, I stand in the shadow of the man who taught ancient philosophy for forty years. To speak on old age to a Latinist is to bring a knife to a sword fight. So, I will not try to out-Cicero Cicero. Instead, I will try to read the text the way my father taught me to read: carefully, critically, and with an eye for what holds up under the light.

  We all know the book that sits on his nightstand: *De Senectute*. In it, Cato the Elder gathers with the young Scipio and Laelius to answer four charges brought against old age. My father has not just taught this text; he has lived its rebuttals.

  The first charge is that old age withdraws us from active life. Cato answers that judgment outweighs strength. He points to Fabius Maximus, who saved Rome not by fighting, but by waiting. Dad, you have spent your retirement proving that a life of the mind remains a public service. You have guided students, corrected drafts, and steered this family with the patience of Fabius, knowing that sometimes the bravest thing one can do is refuse to rush.

  The second charge is that the body weakens. Cato answers that the mind sustains us. He tells the story of Sophocles, who, when accused of senility, read his latest play to the jury and asked: "Does this look like the work of a broken mind?" We look at your scholarship, your correspondence, and your wit, and we offer the same defense. The vessel may show wear, but the pilot is entirely at the helm.

  The third charge is that old age deprives us of pleasure. Cato argues, surprisingly, that this is a benefit. He praises the quiet joys of farming, of an appetite no longer in charge of you. You have embraced this freedom. You trade the frantic pleasures of youth for the deep satisfaction of a garden tended, a book finished, a meal shared without hurry.

  But then comes the fourth complaint, the one that hangs over every ninetieth birthday: that old age is too close to death. Here, Cato offers two answers. The first is secular: a life, like a play, need not run to the final curtain to be a masterpiece; it need only be complete. The second is metaphysical: he argues for the immortality of the soul, suggesting we leave life as one leaves an inn, returning to a permanent home elsewhere.

  My father, a cheerful materialist, has always been clear about this passage. He believes Cato's second argument was the old Roman comforting himself against the dark. And he has asked that we not borrow that comfort on his behalf. He does not look for an afterlife; he looks at the life that was lived.

  And so, we take Cato's first answer, the one that requires no leap of faith, only a clear eye. Ninety years is not a rehearsal. It is not a truncated performance cut short by tragedy. It is a full and finished act. In the ethics I teach, we often search for the "good life." In this room, looking at you, Dad, we see the evidence that the good life is simply the complete one.

  You have played your part with integrity, with wisdom, and with a love for the text that inspired us all. We do not toast you in hope of what comes next, but in gratitude for what has been.

  To my father. To ninety years. To the play well performed.
