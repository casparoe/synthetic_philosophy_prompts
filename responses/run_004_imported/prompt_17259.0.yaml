answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I had the privilege of supervising [Bride's Name]'s PhD. Which means I have spent more hours than is legally advisable debating the ontological status of spacetime with her. Usually over dinner. Usually while the food was getting cold.

  [Bride's Name], you are brilliant. You are also, as I have told you, insufferable at dinner parties. But tonight, I want to talk about your work. Specifically, your dissertation.

  For the family: [Bride's Name] wrote her thesis on a debate that started with Isaac Newton and a bucket of water. Newton noticed that if you spin a bucket of water, the surface curves upward. He asked: What is it spinning *relative to*? Newton said it spins relative to "Absolute Space"—an invisible, unchanging container that exists even if there's nothing in it.

  [Bride's Name], however, argued for the other side. The Relationist side. The Machian view. She argued that there is no invisible container. There are only the relationships between objects. The water curves not because of some ghostly grid, but because of its motion relative to the "fixed stars"—the rest of the mass in the universe.

  Now, why does this matter for a wedding?

  Because there is a temptation to think of "Marriage" the way Newton thought of Space. As a pre-existing substance. A container. A static institution that you step into, which defines you. A substantivalist view of matrimony.

  If that were true, your vows would just be you lowering yourselves into a bucket that was already there. The shape of your life together would be determined by the walls of the container.

  But [Bride's Name] knows better. And I think, if you look closely, so do you.

  A relationist view of marriage is far more demanding, but also far more beautiful. It says that "The Marriage" is not a thing *over and above* the two of you. It is not a box. It is the dynamic, evolving structure of your relations. It is the sum of your interactions, your commitments, and your shared trajectory through the world.

  Now, I know what some of you are thinking. "Wait. If there's no container, if it's just relations... isn't that fragile? Isn't that saying there's *nothing* really there?"

  This is the trap. And this is where the physics saves the sentiment. In modern physics, the metric field—the geometry of spacetime—is real. It has energy. It curves. It dictates how things move. But it doesn't exist *independently* of the matter and energy within it.

  Your marriage is like that. It is not an empty box. It is a gravitational field generated by the mass of your love. It is robust. It is real. It will curve the path of everything that comes near it. But it requires *you* to sustain it. It requires the work of relating.

  And there is one more piece of Mach's principle that is crucial for tonight. Mach argued you cannot define rotation in isolation. You need the "fixed stars." You need the rest of the universe to give your motion meaning.

  Look around this room.

  In the physics of your marriage, we are the fixed stars.

  [Bride's Name], you did not spin up this relationship in a vacuum. The inertia that grounds you, the reference frame that gives your commitment its stability—that comes from the mass of the people who love you. It comes from your parents, who taught you what care looks like. It comes from your friends, who provide the friction that keeps you honest. It comes from this community.

  Without us, your rotation is undefined. But with us? With this distribution of mass surrounding you? Your love becomes a measurable, physical fact of the universe.

  So, [Bride's Name] and [Partner's Name], my advice is this: Do not treat your marriage as a Newtonian container. Do not rest on the institution. Be good relationists. Build the geometry every day. And know that while the structure is yours to build, you are building it within a universe that holds you steady.

  Please raise your glasses.

  To the bride and groom: May your relations be robust, may your curvature be significant, and may you always know that you are held by the stars.

  To [Bride's Name] and [Partner's Name]!
