      *   *Ex Ante vs. Ex Post:* Looking at chances before the event vs. outcomes after.
      *   *The "Separateness of Persons" (Rawls/Nozick):* You can't just sum happiness/suffering across different people as if it's one big bucket.
      *   *Recommendation:* Acknowledge both have valid points. Dan is right on *outcome*, Priya is right on *process/individual value*. The "Weighted Lottery" is often the sophisticated philosophical middle ground.

