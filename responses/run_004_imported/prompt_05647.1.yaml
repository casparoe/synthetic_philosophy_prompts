answer: |-
  This is a sophisticated and technically astute line of inquiry. You are asking whether the Common Prior Assumption (CPA) is a substantive constraint on rational belief or a modeling artifact. Your suspicion is well-founded, and your intuition regarding type spaces and redundancy is technically correct.

  Here is a candid assessment addressing your three specific questions, followed by a recommendation on how to proceed with the paper.

  ### 1. The Technical Point: Redundancy and Representation-Sensitivity

  **You are correct.** The existence of a common prior is not solely a property of the belief hierarchies; it is sensitive to the choice of the underlying type space, specifically regarding redundancy.

  To be precise: A belief hierarchy specifies an agent's beliefs about the state, beliefs about others' beliefs, and so on. The Mertens-Zamir universal type space constructs a space where types *are* hierarchies (no redundancy). However, in applied game theory, we often use "redundant" type spaces where distinct types induce identical belief hierarchies.

  The critical technical result you are recalling is this: **For any profile of belief hierarchies, there exists *some* type space with a common prior that generates them.** (This is often attributed to the flexibility in defining the state space $\Omega$). If you allow the state space to be rich enough, you can always "explain" any set of consistent hierarchies as arising from a common prior by attributing differences to information partitions over a sufficiently granular $\Omega$.

  However, if you fix a specific redundant type space, the existence of a common prior becomes a constraint on that specific measure-theoretic structure. Two types might have identical hierarchies but be assigned different probabilities by the prior (distinguishing them ontologically but not epistemically). If you collapse these types into the universal space, that probabilistic distinction vanishes.

  Therefore, the claim "These agents satisfy the Common Prior Assumption" is ambiguous. It can mean:
  1.  **Weak:** Their hierarchies are *consistent with* some common prior model (always true for consistent hierarchies).
  2.  **Strong:** Their hierarchies are generated by a common prior on *this specific* model of the world.

  Your suspicion is sound: If philosophers treat CPA as a rationality constraint on *beliefs* (Option 1), it is trivial. If they treat it as a constraint on the *model* (Option 2), it is arbitrary, as it depends on the modeler's choice of state space granularity.

  ### 2. Epistemic Implications and Reformulation

  **Does this undercut the epistemic use of Aumann's theorem?**
  Yes, significantly. The standard philosophical appropriation of Aumann's Agreement Theorem runs roughly as follows:
  > *Premise 1:* Rational agents must share a common prior (CPA).
  > *Premise 2:* Rational agents with common priors cannot agree to disagree (Aumann's Theorem).
  > *Conclusion:* Rational agents with common knowledge of each other's beliefs cannot disagree.

  Your critique attacks Premise 1. If CPA is not a constraint on belief states (hierarchies) but a constraint on the relationship between beliefs and an ontologically specified state space, then it is difficult to motivate as a norm of *individual rationality*. An agent can be internally consistent (coherent hierarchies) without satisfying CPA on a specific model, simply because the model includes distinctions the agent does not (and perhaps cannot) track.

  **Can it be reformulated in terms of hierarchies?**
  There is one robust way to salvage CPA as a property of hierarchies: **The No-Betting Condition.**
  It is a theorem that a common prior exists on a type space if and only if there is no "common knowledge bet" that all agents expect to be profitable ex-ante. This "no betting" condition *is* expressible purely in terms of belief hierarchies (specifically, the infinite hierarchy of beliefs about bets).

  *However*, this reformulation changes the normative force. It shifts the requirement from "You must have started from the same probabilities" to "Your current beliefs must not allow for a Dutch Book-style scenario where everyone expects to gain from a trade." While powerful, this is a consistency constraint on *current* beliefs, not a genetic constraint on *how* those beliefs were formed (i.e., updating from a shared prior). Many philosophers argue that rationality requires coherence (no betting), but not necessarily a shared causal history (common prior).

  If you argue that CPA is only defensible as the "no betting" condition, you undermine the "genetic" interpretation often used in disagreement debates (i.e., that we must weight each other's views equally because we started from the same place).

  ### 3. Literature Status: Is This Old News?

  **In Economics:** This is established news. You are correctly recalling the **Gul-Aumann exchange (1998)**.
  *   **Faruk Gul, "On Aumann's Agreement Theorem" (1998):** Gul argues exactly your point. He claims the CPA is not a restriction on agents' beliefs but a restriction on the description of the state space. He shows that any belief hierarchy can be rationalized by a common prior if the state space is described sufficiently finely. Thus, CPA has no bite as a constraint on beliefs alone.
  *   **Robert Aumann, "On the Theorem of Gul" (1998):** Aumann replies that the state space is not just a modeling tool but represents objective reality. He defends CPA as a substantive assumption about the world (that differences in belief arise *only* from differences in information), not just about mental states.

  **In Philosophy:** This is **mixed**.
  *   **Formal Epistemologists:** Those working at the intersection of logic, probability, and game theory (e.g., Hannes Leitgeb, Brian Skyrms, some work by Hild) are generally aware of the Gul critique.
  *   **Mainstream Disagreement Literature:** In the broader philosophical debate on peer disagreement (e.g., David Christensen, Adam Elga, Thomas Kelly), the technical fragility of the CPA is often glossed over. Christensen (2007, 2011) and Elga (2007) invoke Aumann to motivate conciliationism, but they often treat the Common Prior as a plausible idealization of "rational peers" without engaging with the measure-theoretic arbitrariness you identified.

  **Verdict:** You are not reinventing the wheel, but you may be bringing a technical economic critique into a philosophical context where it has not been fully absorbed. The "vague memory" you have is the Gul-Aumann debate.

  ### Recommendation for the Paper

  Do not scrap the paper, but **pivot the contribution**.

  If you write a paper simply arguing "CPA is representation-sensitive," a referee familiar with the 1998 *Econometrica* exchange will reject it as old news. However, if you write a paper arguing **"Philosophers of disagreement have imported Aumann's theorem without absorbing Gul's critique, and this undermines the normative force of conciliationism,"** you have a viable and valuable project.

  **Suggested Structure:**
  1.  **Exposition:** Briefly outline how Aumann's theorem is used in the disagreement literature (e.g., to argue that persistent disagreement implies irrationality).
  2.  **The Technical Wedge:** Introduce the type-space redundancy point (citing Gul 1998). Explain clearly why CPA is a constraint on models, not just minds.
  3.  **The Philosophical Gap:** Show how prominent philosophers (Christensen, Elga, etc.) rely on the "genetic" interpretation of CPA (we started the same) rather than the "no-betting" interpretation.
  4.  **The Argument:** Argue that because CPA is model-relative, it cannot serve as a freestanding norm of rationality for agents who do not have access to the "true" state space description.
  5.  **Conclusion:** Suggest that disagreement debates should focus on the "no betting" condition (coherence) rather than the Common Prior (shared history), or explicitly defend Aumann's realist view of the state space against Gul's instrumentalism.

  **Key References to Cite:**
  *   Gul, F. (1998). "On Aumann's Agreement Theorem." *Econometrica*.
  *   Aumann, R. J. (1998). "On the Theorem of Gul." *Econometrica*.
  *   Heifetz, A. (2006). "The Positive Foundation of the Common Prior Assumption." *Games and Economic Behavior*. (Discusses the hierarchy vs. type space distinction).
  *   Samet, D. (1998). "Iterated Expectations and Common Priors." *Games and Economic Behavior*.

  **Summary:** Your technical intuition is correct. The argument is known in economics but under-utilized in philosophy. Your paper should position itself as a corrective to the philosophical literature, using the technical point to challenge the normative conclusions drawn from Aumann's theorem.
