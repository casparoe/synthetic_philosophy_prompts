  The hotel bar was nearly empty, save for the hum of the ice machine and the clink of glasses. Elena swirled her bourbon, eyeing Marcus over the rim.

  "You look like a man who just had his ontology falsified," she said.

  "Feels like it," Marcus sighed. "That afternoon panel on the Pessimistic Meta-Induction. Laudan's ghost was practically sitting on the podium. Phlogiston, caloric, the ether… the graveyard is crowded, Elena. If every successful theory of the past is false, why should I bet my tenure on dark matter?"

  "Because you're a realist. It's in your job description."

  "I'm a *structural* realist," Marcus corrected. "There's a difference. I don't believe in the ether fluid. I believe in the equations. Look at Fresnel. He derived the laws of reflection and refraction assuming a luminiferous ether. The ontology was wrong—no ether. But the math? Maxwell swallowed it whole. The structure survived the ontological purge."

  Elena leaned in. "That's the standard move. Split the theory into 'working posits' and 'idle posits.' Believe the working ones, dump the idle ones. But here's the rub, Marcus: How do you know which is which *before* the theory dies?"

  Marcus paused. "The working posits are the ones doing the predictive labor."

  "Exactly. But you only know they were doing the labor because you know they survived into Maxwell. You're using the successor theory to validate the predecessor's components. It's pure hindsight bias. You're carving nature at joints that only appear in retrospect."

  Marcus took a sip of his beer. "That's the circularity charge. I know it. But it's not just survival. It's about derivation. The Fresnel equations weren't just lucky guesses; they were constrained by boundary conditions and energy conservation. Those constraints are theory-neutral enough that they persist even when the medium changes."

  "But how do you identify those constraints *now*?" Elena pressed. "Take Newtonian mass. It was conserved, it was fundamental, it did predictive labor. Then Einstein comes along and splits it into rest mass and relativistic energy. The 'working posit' of absolute mass was actually idle. If you were a selective realist in 1890, you would have bet on mass conservation. You would have lost."

  Marcus nodded slowly. "Okay. Fair. I can't guarantee that today's 'essential structure' won't get dissolved tomorrow. I'll concede that. We don't have a God's-eye view to separate the wheat from the chaff in real-time."

  "So the strategy guts itself," Elena said, triumphant. "You can't use historical continuity to justify confidence in current theories if you can't identify the continuity until history is over."

  "Not necessarily," Marcus said, setting his glass down. "I'm not claiming infallibility. I'm claiming probability. Yes, we misidentify structures sometimes. Newtonian mass is a good example. But look at the trajectory. We didn't lose the structure; we generalized it. Energy-momentum conservation is the robust successor to mass conservation. The *relation* survived, even if the *relata* changed."

  "That's a shift," Elena noted. "You're moving from believing the entities to believing the relations."

  "I am. And here's my answer to your hindsight charge: We aren't just looking at what survived. We're looking at *independent access*. When multiple distinct experimental setups converge on the same mathematical structure, that structure is likely capturing something real about the world's architecture, even if our story about what holds that architecture together is wrong."

  "Convergence," Elena mused. "Like how Perrin calculated Avogadro's number thirteen different ways."

  "Exactly. If thirteen different methods, relying on different auxiliary theories, all point to the same structural constant, it's unlikely that thirteen different errors canceled out perfectly. That suggests the structure is robust *before* the theory dies."

  Elena tapped her glass. "So you're admitting you can't tell me which part of String Theory is real. But you're saying if ten different models converge on a specific symmetry, I should bet on the symmetry?"

  "I'm saying it's the only bet that makes sense of scientific progress," Marcus said. "If you deny the structure is real, you have to say it's a miracle that we can keep building on dead theories. I don't need to know exactly what will survive to know that *something* structural is being tracked. The map changes, but the territory remains."

  "The territory remains," Elena repeated softly. "But the map is all we ever hold, Marcus. And history shows us that even the contour lines we think are permanent… sometimes they're just ink."

  "Then we drink to the ink," Marcus said, raising his glass. "And hope it dries before the next rain."

  Elena clinked her glass against his. "To the ink. And to the humility to know it might wash away."
