      *   Specifically, if you treat the choice at this node as independent of the other node, you might reason: "If I'm at Y, continuing gives 1, exiting gives 4. If I'm at X, continuing gives (eventual 4 or 1), exiting gives 0."
      *   The prompt says naive updating drags you toward "always continue." I should honor that.
