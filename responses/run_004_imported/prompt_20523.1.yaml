  **Move 1 (Mara): +1.** This is the classic "no negative facts" or process-theory intuition (e.g., Dowe, Beebee). It's metaphysically parsimonious and aligns with the intuition that causation requires energy transfer or event production, not just absence.

  **Move 2 (Dev): +1.** This appeals to standard counterfactual dependence (Lewis). If the omission hadn't occurred, the effect wouldn't have, which is the bedrock of many causal theories. It's a strong initial claim, though vulnerable to the next objection.

  **Move 3 (Mara): +2.** This is the "profligate omissions" objection, widely considered the strongest argument against treating omissions as causes on par with positive events. It successfully exposes the absurdity of Dev's unrestricted counterfactual view.

  **Move 4 (Dev): +1.** This invokes the Hart & Honoré strategy of using normative expectations to select causes from the background conditions. It's the standard dialectical reply to profligacy, successfully narrowing the causal field, even if it shifts grounds.

  **Move 5 (Mara): +1.** Mara correctly identifies that Dev has shifted from metaphysics to pragmatics. While norms help *select* causes, arguing they *constitute* causal facts risks conflating ontology with moral responsibility.

  **Move 6 (Dev): -1.** Dev's appeal to legal practice is pragmatic, not metaphysical. Mara's rebuttal (included in the move description) is correct: legal liability tracks blame and policy, not fundamental causal structure, so this doesn't settle the metaphysical debate.

  ### The Overlooked Option: Contrastive Causation and Causal Models

  Both Dev and Mara are operating with a binary, non-contrastive notion of causation (either $C$ causes $E$ or it doesn't). They are also treating "norms" and "metaphysics" as mutually exclusive domains. A more robust framework, which you likely encounter in the literature (e.g., Schaffer, Halpern & Pearl), is **contrastive causation within Structural Equation Models (SEMs)**.

  On this view, causation is a four-place relation: $C$ rather than $C^*$ causes $E$ rather than $E^*$. This handles Mara's profligacy objection without requiring Dev to reduce causation to moral obligation. In a causal model of the fig tree scenario, "Mara not watering" is a variable with a default value, while "Neighbor not watering" is not included in the model at all. The omission counts as a cause because it is a variable in the relevant causal structure (deviating from the default), not merely because she was obligated. This validates Dev's intuition that her omission was causal while respecting Mara's insistence that not every non-waterer is a killer, without conflating metaphysics with legal liability. The "context" that selects the model isn't purely moral; it's explanatory relevance, which tracks norms but isn't reducible to them.
