      *   *Reference Check:* Ensure Aumann (1995 "Backward Induction and Common Knowledge of Rationality"), Bicchieri (1993 "Rationality and Coordination"), Binmore (1987/1996), Pettit & Sugden (1989) are conceptually represented accurately.

