answer: |-
  **Keynes:** G.E., I've been writing about our grandchildren. A hundred years on, I reckon the economic problem will be solved. Scarcity, as we know it, will be broken. But I find myself haunted by a question you never quite answered in *Principia*. If the struggle for subsistence vanishes, what becomes of us? I fear the human capacity for "purposiveness" is bred too deep. Without the spur of want, I suspect the average man won't turn to your states of mind. He'll fall into a nervous breakdown.

  **Moore:** That is a psychological prediction, Maynard, not an ethical one. My concern in *Principia* was to identify what is *good*, not necessarily what men, in their current state of civilization, are immediately fitted to enjoy. If they fall into depression, that is a tragedy, but it does not alter the fact that personal affection and the appreciation of beauty remain the sole intrinsic goods. The truth of the ideal does not depend on our capacity to bear it.

  **Keynes:** But you see, that is where the old Apostle in me feels cheated. We treated Chapter 6 of your book as a private religion: the contemplation of the ideal, unmediated. Yet we quietly ignored Chapter 5, where you conceded that ordinary conduct must be governed by rules and conventions, not by direct appeals to that ideal. You admitted then that most people cannot calculate the good in every moment. Now I'm asking: wasn't that concession the real truth? Don't most people need "useful fictions"—like the love of money—to function at all?

  **Moore:** You are conflating two distinct inquiries. In Chapter 5, I argued that we should generally follow established rules because our knowledge of consequences is limited. I did not argue that false motives become true goods simply because they are useful. To say that avarice is a "useful fiction" is to describe a causal mechanism; it is not to grant it moral value. We must not call evil good, even if it serves a temporary purpose.

  **Keynes:** Yet in "Economic Possibilities," I am arguing precisely that we must treat avarice as a virtue for a while yet. Not because it is good in your sense, but because it keeps the wheels turning until the machine can run itself. If I tell the masses they must work for the sake of beauty, they will starve. If I tell them to work for gold, they eat, and eventually, their grandchildren might be free enough to read your book. Does that not imply your "religion" was always a luxury for the few, while the rest require the discipline of the market?

  **Moore:** It implies that the *realization* of the good is historically contingent, not that the *nature* of the good is. If a man works for gold so that his grandson may contemplate beauty, the grandson's contemplation is the good, not the grandfather's greed. You seem troubled because you wish to validate the grandfather's struggle. I am saying his struggle is a necessary evil, instrumentally justified but intrinsically worthless. Why is it so difficult to accept that most of human history has been spent cultivating the soil for a harvest we may not eat?

  **Keynes:** Because we Apostles believed we were planting the garden, not just tilling the soil. We thought your ethics offered a way of living *now*. If I accept your distinction, I must admit that our youthful enthusiasm was a delusion. We thought we could live by the light of Chapter 6, but you had already hidden the caveat in Chapter 5: that most men require the discipline of convention. I am simply updating that convention for the industrial age. The "love of money" is the modern rule of conduct you said we needed.

  **Moore:** You are pressing me to endorse the convention as if it were the ideal. I will not do it. If the "love of money" is a rule of conduct necessary for survival, then follow it by all means. But do not confuse the scaffolding with the building. Your error, Maynard, is to think that because a motive is psychologically necessary, it acquires ethical weight. It does not. It remains a dark thing, even if it keeps us from the dark.

  **Keynes:** But consider the cost of that precision! If we tell people their labor is intrinsically worthless, merely scaffolding, we risk collapsing the structure before the building is ready. I am worried about the transition. You speak of the "good" as a static object. I see it as a capacity that must be grown. If you strip away the purposiveness of money-making before the capacity for contemplation is grown, you leave a void. Is it not better to dignify the transition than to label it "worthless"?

  **Moore:** To dignify it with false praise is to lie. And lies, generally, have bad consequences. If men believe avarice is a virtue, they will practice it when it is no longer necessary. They will hoard when they should spend, dominate when they should create. My insistence on the distinction is not pedantry; it is a safeguard. We must know when the scaffolding can be removed. If you paint the scaffolding to look like the temple, no one will ever take it down.

  **Keynes:** So we arrive at the impasse. You demand we keep the ideal pure, even if it remains out of reach for centuries. I demand we manage the psychology of the masses, even if it means sanctifying their chains for another generation. You fear that if we call avarice a virtue, it will never die. I fear that if we call it a vice while it is still our only engine, the engine will stop.

  **Moore:** Not an impasse, Maynard. A division of labor. You are the economist; you must manage the engine. I am the philosopher; I must keep the destination clear. If you tell them avarice is a virtue, you confuse the destination. If I tell you avarice is unnecessary today, I ignore the engine. We can both be right, provided we do not mistake our domains.

  **Keynes:** A comfortable truce, but I wonder if it holds. For the man in the street, there is no division of labor. He lives one life. If his daily virtue (work for money) contradicts his ultimate good (contemplation), he lives a fractured existence. I suspect that fracture is what I call the "nervous breakdown" of the race. You call it the necessary pain of growth.

  **Moore:** Then perhaps the pain is the price of consciousness. Animals do not suffer this fracture because they do not conceive of the Good. We suffer it because we can see the temple while we are still forced to carry the bricks. That suffering is not an argument against the temple's existence, nor against the bricks' necessity. It is simply the human condition.

  **Keynes:** Then I suppose I must continue to preach the necessity of the bricks, while hoping my grandchildren forgive me for not telling them the whole truth about the mortar.

  **Moore:** And I shall continue to describe the temple, trusting that eventually, someone will be free enough to enter it.
