prompt: |-
  I'm a junior double-majoring in cognitive science and philosophy, and this term's philosophy of biology seminar has spent several sessions on the adaptationist controversies that followed Gould and Lewontin's spandrels paper, which I'd honestly filed away as interesting-but-mostly-historical until a live case landed on my desk this week. I serve as a reviewer on the editorial board of my university's undergraduate research journal, and we've deadlocked two against two over a submission arguing that human music is a sexually selected adaptation for advertising cognitive and creative fitness, drawing on Geoffrey Miller's "mating mind" framework, with music's cross-cultural universality and emotional intensity offered as the central evidence. Two board members want to reject the piece outright, on the grounds that it's precisely the kind of unfalsifiable adaptive storytelling Gould and Lewontin's critique targeted, and that the author never seriously engages the rival possibility -- the one behind Pinker's remark that music is "auditory cheesecake" -- that music is a byproduct of other adaptations (language, auditory scene analysis, motor control, emotional signaling) rather than a target of selection in its own right. The other two think this objection proves too much: almost no adaptive hypothesis about a psychological trait could survive a demand for that kind of direct historical evidence, and holding this paper to a standard we haven't applied to other adaptationist submissions we've accepted looks less like rigor than like moving the goalposts after the fact.

  We owe the author a decision by Friday -- accept, reject, or accept pending revisions -- and I'd rather not let it come down to an unexplained tie broken by whoever happens to chair the meeting. Could you draft the short recommendation memo I'll circulate beforehand? I'd like it to commit to a single recommendation, to spell out concrete, checkable revision criteria and a resubmission deadline in case we go that route (something more substantive than telling the author to "consider alternative explanations"), and to take the double-standard objection seriously rather than treating the spandrels critique as a conversation-ending trump card.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Junior double-major in Cognitive Science & Philosophy.
      *   **Context:** Serving as a reviewer on an undergraduate research journal editorial board.
      *   **Problem:** Deadlocked 2-2 vote on a submission about music as a sexually selected adaptation (Miller's "Mating Mind" vs. Pinker's "Auditory Cheesecake"/Spandrels).
      *   **Conflict:**
          *   Side A (Reject): It's unfalsifiable adaptive storytelling (Gould & Lewontin critique), ignores byproduct hypotheses.
          *   Side B (Accept): Holding this to a higher standard than other papers is a double standard; direct historical evidence is impossible for psych traits.
      *   **Goal:** A short recommendation memo to circulate before the final meeting.
      *   **Requirements:**
          *   Commit to a *single* recommendation (Accept, Reject, or Revise).
          *   Spell out concrete, checkable revision criteria (if Revise).
          *   Set a resubmission deadline.
          *   Address the double-standard objection seriously (don't just wave the Spandrels paper as a trump card).
          *   Tone: Professional, academic, decisive but fair, suitable for an undergraduate journal board.

  2.  **Determine the Recommendation:**
      *   *Reject?* Too harsh. The student is engaging with major theories (Miller, Pinker, Gould/Lewontin). Undergraduate work rarely achieves definitive falsification.
      *   *Accept?* Ignores the valid methodological concerns raised by Side A. The paper apparently lacks engagement with the null hypothesis (byproduct).
      *   *Accept Pending Revisions?* This is the sweet spot. It acknowledges the theoretical merit (Side B) while demanding methodological rigor (Side A). It resolves the deadlock by turning a "No" into a "Not Yet."
      *   *Decision:* **Accept Pending Major Revisions.**

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (recommendation on Submission ID/Title) and the decision clearly.
      *   **Rationale (Addressing the Deadlock):**
          *   Acknowledge the split vote.
          *   Validate Side A: The Spandrels critique is methodologically crucial. Ignoring byproduct hypotheses *is* a weakness in adaptationist reasoning.
          *   Validate Side B: We cannot demand impossible standards (fossil records for cognitive traits). Consistency across submissions is key.
          *   Synthesis: The paper isn't wrong for being adaptationist; it's incomplete for not testing the adaptationist claim against the null hypothesis.
      *   **Revision Criteria (The "Concrete/Checkable" part):**
          *   Avoid vague "consider alternatives."
          *   Require specific sections or arguments.
          *   1. Explicit Null Hypothesis: Dedicate a section to the "Auditory Cheesecake"/byproduct model.
          *   2. Comparative Evidence: If it's an adaptation, what specific design features optimize it for mating vs. other functions? (Costly signaling?)
          *   3. Falsifiability Conditions: What evidence *would* count against the hypothesis?
      *   **Deadline:** Needs to be realistic but tight enough for the term. Let's say 2 weeks.
      *   **Closing:** Encouraging tone.

  4.  **Refining the Tone and Content:**
      *   *Tone:* Needs to sound like a peer/colleague (undergrad journal) but authoritative enough to guide the board. Since the user is a junior, the voice should be professional but not overly senior-professorial.
      *   *Philosophy/Biology Nuance:* Ensure terms like "exaptation," "byproduct," "null hypothesis," and "design specifications" are used correctly.
      *   *Addressing the Double Standard:* Explicitly mention that future papers will be held to this same standard, turning this into a policy precedent rather than a targeted attack.

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is "Major Revisions" too vague?
      *   *Fix:* Break down the revisions into bullet points with specific deliverables (e.g., "Add a 500-word section...").
      *   *Critique:* Did I address the "moving goalposts" concern?
      *   *Fix:* Add a note that this criteria will be applied to *all* future adaptationist submissions, ensuring consistency.
      *   *Critique:* Is the deadline realistic?
      *   *Fix:* Set it for 14 days, which is standard for undergraduate revisions.

  6.  **Final Polish:** Check against the prompt's constraints one last time.
      *   Single recommendation? Yes (Revise).
      *   Concrete criteria? Yes.
      *   Deadline? Yes.
      *   Address double standard? Yes.
      *   Spandrels critique handled nuance? Yes.

  7.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Editorial Board, [Journal Name]
  **FROM:** [Your Name], Reviewer
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation regarding Submission #24-B ("Music as Sexual Selection")

  **Recommendation:** Accept Pending Major Revisions

  **Rationale**
  Our deadlock stems from a legitimate tension between methodological rigor and disciplinary feasibility. The reviewers calling for rejection are correct that the current draft exhibits the classic vulnerability identified by Gould and Lewontin: it argues *for* an adaptation without adequately testing the claim *against* the null hypothesis of a byproduct (Pinker's "auditory cheesecake"). However, the reviewers defending the submission are also correct that demanding direct historical evidence for cognitive traits sets a bar no psychological adaptationist paper could clear, and applying a unique standard to this submission risks inconsistency in our editorial policy.

  The solution is not to reject the adaptationist framework, but to enforce a consistent standard of argumentation for all future submissions making similar claims. This paper should not be rejected for being adaptationist; it should be revised to demonstrate *why* the adaptationist explanation is superior to the byproduct explanation, rather than simply asserting it.

  **Revision Criteria**
  To move this paper to acceptance, the author must address the following three specific points. These criteria will also serve as a precedent for evaluating future adaptationist submissions in evolutionary psychology.

  1.  **Explicit Null Hypothesis Section:** The author must add a dedicated section (approx. 500–750 words) outlining the strongest version of the byproduct hypothesis. This cannot be a strawman; it must cite specific mechanisms (e.g., auditory scene analysis, language prosody, motor rhythm) that could produce music without direct selection for music itself.
  2.  **Design Specification Analysis:** The author must identify at least two specific "design features" of music that are optimally explained by sexual selection (e.g., costly signaling, virtuosity requiring developmental stability) and explain why the byproduct hypothesis fails to account for these specific features.
  3.  **Falsifiability Conditions:** The conclusion must explicitly state what empirical evidence would count *against* the sexual selection hypothesis. If no evidence could falsify the claim, the paper remains in the realm of storytelling.

  **Timeline**
  The author is to submit a revised draft within **14 days (Friday, November 7)**. If these criteria are met, the paper will be accepted without further board vote. If the author cannot meet these criteria, the paper will be rejected.

  **Note on Editorial Consistency**
  To address the concern regarding moving goalposts: I propose we adopt these three criteria as the standard checklist for *all* subsequent submissions making adaptationist claims about psychological traits. This ensures we are not singling out this author, but rather raising the methodological floor for the journal as a whole.

  I believe this path respects the author's theoretical engagement while satisfying our duty to uphold rigorous philosophical standards in evolutionary explanation.
