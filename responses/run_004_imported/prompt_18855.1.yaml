      "She walks out, sees a red rose, and says 'wow,'" Elias said, swirling his gin. "The Ability Hypothesis holds. She hasn't learned a new fact about the universe. She's just acquired the capacity to recognize, imagine, and remember red. It's know-how, not know-that."

      Sarah leaned against the bookshelf. "But that 'wow' carries informational weight, Elias. If she only gained abilities, why does it feel like discovery? The Phenomenal Concept Strategy explains this. She possesses all the physical facts, yes, but she now grasps them under a new mode of presentation. She tokenes a phenomenal concept she couldn't access in the room."

      "Modes of presentation are just linguistic dressing," Elias countered. "If she knows all the physical facts—wavelengths, neural firings—what is left to learn? If you say she learns a fact *under a new concept,' you're smuggling in a new fact. The Ability Hypothesis is cleaner. She learns to simulate the experience. That's it."

      "Cleaner doesn't mean accurate," Sarah shot back. "Consider this: If I teach you every physical detail about pain, do you know what pain *is* until you feel it? No. But you haven't learned a non-physical fact. You've acquired a direct recognitional concept. The gap isn't ontological; it's conceptual. You're reducing the cognitive shift to mere behavioral competence."

      "Because 'what it's like' isn't a proposition!" Elias raised a finger. "Propositions are true or false. Abilities aren't. When Mary sees red, she doesn't add a sentence to her worldview. She unlocks a skill. If you insist she learns a fact, you risk opening the door to qualia as non-physical properties. I'm keeping physicalism safe by denying the knowledge claim entirely."

      "And I'm keeping it safe by explaining the intuition without denying the gain," Sarah argued. "Denying she learns anything feels like gaslighting the intuition. The Physicalist must explain why the release feels like enlightenment. My view respects the phenomenology. She learns something new *about* the physical state she already knew. The referent is the same; the cognitive route is distinct."

      "But distinct routes imply distinct information," Elias pressed. "If the physical story was complete in the room, any new 'grasp' is redundant. You're saying she knows P, and then she knows P-as-felt. If P equals P-as-felt, the second knowledge is empty. If it's not empty, then P wasn't complete. The Ability Hypothesis avoids this trap. No new knowledge, just new tools."

      "Tools don't explain the revelation," Sarah said, finishing her wine. "When she sees red, she doesn't just gain a tool; she understands the data differently. You're treating her mind like a database. I'm treating it like an experience."

      "And you're treating experience like a fact," Elias smiled. "We'll have to agree that Mary stays in the room until we settle this."

      "Deal," Sarah said. "But I'm picking the color of the walls."

