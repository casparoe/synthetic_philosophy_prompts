  **Scenario: The Pre-Authorized Strike**

  Commander Elena faces a moral dilemma: order an airstrike on her own besieged position to stop an enemy advance, killing her squad but saving the battalion, or hold fire and risk the battalion's destruction. Haunted by the deaths of her squad, she carries the guilt for years, believing she made a free choice to sacrifice them.

  After the war, she discovers the "Standing Order": High Command had already pre-authorized the strike to occur automatically at 14:00 if Elena had not called it in by 13:55. They knew her psychology well enough to predict she would act, so they prepared the backup to ensure the outcome regardless of her will. Elena called it in at 13:50 on her own. The backup was never triggered.

  **Why it dodges the objections:**

  It dodges the **Prior Sign** objection because the "intervener" (High Command's automatic order) is triggered by a *clock*, not by monitoring Elena's mental state or waiting for a sign of hesitation; the guarantee is in place before she even begins to deliberate. It survives the **Flicker of Freedom** reply because while Elena technically *could* have refused to call it in, that alternative leads to the exact same moral outcome (the strike happens anyway), rendering the "flicker" of refusal morally irrelevant to her responsibility for the deaths.
