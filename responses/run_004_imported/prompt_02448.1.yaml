      *   **The Crucial Distinction:** Validity vs. Soundness. (This is the most important logical concept to convey).
      *   **The "Specification" Problem:** In SE, specs are (ideally) unambiguous requirements. In philosophy, axioms are debatable metaphysical claims.
      *   **Garbage In, Garbage Out:** If the axioms are questionable, the proven conclusion is only conditionally true.
      *   **Specific Philosophical Counterpoints:**
