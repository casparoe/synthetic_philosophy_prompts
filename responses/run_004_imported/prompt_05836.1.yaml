answer: |-
  Good evening, everyone. For those who don't know me, I'm the groom's younger sibling, and currently, the one in the family who is actively suffering through a PhD in Economics.

  [Brother] and [Partner], you two have the most romantic origin story I know. Most couples meet at a coffee shop or a bar. You met in a seminar on Social Choice Theory. There is something profoundly fitting about finding your life partner while discussing how to aggregate individual preferences into a collective welfare function.

  In honor of that, I want to base my toast on a famous result by the Nobel laureate John Harsanyi. Harsanyi's Aggregation Theorem essentially states that if two rational individuals care about each other's well-being, and you respect each other's choices, then your "household welfare" must be a weighted sum of your two individual utility functions.

  In plain English: a happy marriage is one where you add your happiness together.

  Now, there is a catch. Harsanyi's theorem is notoriously silent on what those weights actually are. To most of you in the room, that sounds like a beautiful sentiment: that no equation can quantify how much one person matters to another. To the decision theorists in the back... well, you know it's because utility is only defined up to a positive affine transformation, so the weights are indeterminate without an interpersonal comparison norm. But for tonight, let's stick with the family's interpretation.

  However, I must offer a disclaimer. Harsanyi's theorem describes a structure, not a guarantee. It tells you *how* to make decisions together, provided you satisfy the axioms of rationality and Pareto efficiency. It does not promise that the solution will always be easy, or that you won't face outcomes where your preferences conflict. Math can map the terrain of a partnership, but it cannot walk the path for you.

  So, my wish for you is not that your marriage satisfies every theoretical axiom perfectly. My wish is that when the weights are indeterminate, you choose to weigh each other's happiness heavily. May your joint utility be high, your transaction costs be low, and may you always find a Pareto improvement when things get tough.

  Please raise your glasses. To [Brother] and [Partner]: may your aggregation be generous, and your lifetime horizon be infinite. Cheers.
