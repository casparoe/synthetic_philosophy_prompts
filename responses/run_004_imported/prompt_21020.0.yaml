          *   *Law of Excluded Middle (LEM):* Russell wants to *save* LEM. One reading must be true, the other false. If both were false, LEM would fail ($P \lor \neg P$). The point of the scope distinction is to show that *one* of the readings is True, preserving LEM.
      *   **Part (c):** Strawson's response.
