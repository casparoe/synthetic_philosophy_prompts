prompt: |-
  I run a monthly reading group for graduate students on formal epistemology and decision theory, and last week's session was on Parfit's hitchhiker case and the puzzle of rational irrationality. Afterward, two of my strongest students stayed behind and got into a real argument that I haven't been able to stop thinking about, and I'd like a second opinion before I see them again. For context, in case it's useful: you're dying of thirst in the desert; a driver will take you to town only if she's confident you will pay her $1,000 once you arrive safely, and she's an excellent, though not infallible, judge of whether you're bluffing; once you're actually in town, paying does nothing further for you, since the ride has already happened.

  Here is roughly how the exchange went. (1) Yuki said paying is straightforwardly irrational: standing in town, safe, the ride is a sunk cost, and handing over $1,000 for nothing further in return cannot be what a rational agent does at that point, whatever it was rational to want beforehand. (2) Marco replied that this proves too much: if that is correct, no purely self-interested agent could ever truthfully signal an intention to pay, the driver would detect the bluff, and every such agent would be left to die in the desert; since dying is obviously worse than paying $1,000, the disposition to pay must be the rational one to have, and an act that simply executes a rational disposition cannot itself be irrational. (3) Yuki answered that Marco was running together two different questions -- which policy is good to adopt, versus which act is rational given where you actually stand -- and that one can consistently hold that the disposition to pay is worth cultivating while denying that the isolated act of paying, once the ride is already banked, maximizes anything; she compared it to Ulysses's sailors, who keep him bound to the mast, but whose refusal to release him is not made rational by anything he is shouting at them in that moment. (4) Marco said the analogy cuts the other way: the sailors' refusal is rational precisely because it carries out the antecedently rational policy, with no further, freestanding fact about "the act itself" to be assessed apart from that policy -- and likewise, anyone who could still coherently wonder "but should I really pay?" while standing safely in town was never the kind of agent the driver would have picked up to begin with, so treating the payment as a fresh, isolated decision misdescribes the situation from the outset. Neither would concede, and it was late enough that I sent them both home still arguing on the sidewalk.

  I would like your help adjudicating this properly. Please work through the exchange move by move, (1) through (4), saying who has the better of it at each step rather than simply declaring an overall winner, and flag explicitly any move that trades on an ambiguity or quietly begs the question. Then tell me whether you think the residual disagreement between Yuki and Marco is really a substantive disagreement about what is rational in this case, or whether they are talking past each other because they favor different, perhaps not fully compatible, standards of rational assessment -- one keyed to acts, the other to dispositions or policies.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** Graduate reading group on formal epistemology and decision theory. Topic: Parfit's Hitchhiker case, rational irrationality.
      *   **Scenario:** Dying of thirst, driver offers ride iff confident you'll pay \$1,000 later. Driver is a good lie detector. Once in town, paying has no causal impact on survival (sunk cost).
      *   **The Debate:**
          *   (1) Yuki: Paying in town is irrational (sunk cost, no return).
          *   (2) Marco: If paying is irrational, you can't signal intention, you die. Dying > Paying. So disposition to pay is rational. Executing rational disposition = rational act.
          *   (3) Yuki: Distinguishes *policy* (good to adopt) vs. *act* (rational given current state). Analogy: Ulysses/sailors.
          *   (4) Marco: Analogy fails. Refusal is rational *because* it carries out policy. If you wonder "should I pay?", you aren't the type picked up. Treating payment as isolated misdescribes the situation.
      *   **Task:**
          *   Adjudicate move-by-move (1-4).
          *   Identify who has the better of it at each step.
          *   Flag ambiguities or question-begging.
          *   Determine if the disagreement is substantive (what is rational) or verbal/conceptual (standards of assessment: act vs. policy).

  2.  **Deconstruct the Philosophical Landscape:**
      *   **The Case:** Parfit's Hitchhiker (from *Reasons and Persons*).
      *   **The Core Tension:** Causal Decision Theory (CDT) vs. Evidential Decision Theory (EDT) vs. Functional Decision Theory (FDT) / Timeless Decision Theory (TDT).
      *   **Yuki's Position:** Classic CDT / Act Utilitarianism / Sophisticated Choice. Focus on the *node* in the decision tree at the moment of payment. At that node, Pay < Keep Money.
      *   **Marco's Position:** Dispositional / Policy-based / FDT / Resolute Choice. Focus on the *type* of agent or the *plan* chosen ex-ante.
      *   **Key Concept:** "Rational Irrationality" (Elster, Ulysses contracts). Is it rational to be the kind of person who does irrational things?

  3.  **Step-by-Step Analysis:**

      *   **Move (1) Yuki:** "Paying is straightforwardly irrational... sunk cost... handing over \$1,000 for nothing further."
          *   *Strength:* Aligns with standard Causal Decision Theory (CDT). At the moment of payment, the causal link to survival is broken. Dominance reasoning says keep the money.
          *   *Weakness:* Ignores the counterfactual dependence of *getting* to town on the disposition to pay.
          *   *Verdict:* Strong on standard act-assessment, weak on the broader strategic context.
          *   *Critique:* Assumes "rationality" is strictly about the local causal impact at the moment of action.

      *   **Move (2) Marco:** "This proves too much... no purely self-interested agent could ever truthfully signal... dying is obviously worse... disposition to pay must be rational... act that executes rational disposition cannot itself be irrational."
          *   *Strength:* Highlights the pragmatic self-defeat of Yuki's view. If CDT is true, CDT agents die in the desert. This is a major objection to CDT (the "Newcomb Problem" parallel).
          *   *Weakness:* The leap from "Disposition is rational" to "Therefore the specific act is rational" is the crux. It assumes act-rationality derives wholly from disposition-rationality.
          *   *Critique:* Risks conflating the rationality of *being* a type with the rationality of *token actions* of that type.

      *   **Move (3) Yuki:** "Running together two different questions -- which policy is good to adopt, versus which act is rational given where you actually stand... Ulysses's sailors."
          *   *Strength:* Makes a crucial distinction (Sophistication vs. Resoluteness). The sailors binding Ulysses is rational *ex-ante*, but unbinding him *ex-post* (if they could) might be irrational relative to the *current* desire, yet rational relative to the *plan*. Actually, the analogy is: Sailors refusing to unbind is rational *because* of the prior command, even if Ulysses currently wants out.
          *   *Weakness:* The Ulysses analogy usually involves *pre-commitment* mechanisms. In Hitchhiker, there is no external binding mechanism, only internal psychology. Can you bind yourself without a mechanism?
          *   *Critique:* Solid distinction, but relies on the idea that "act rationality" is time-slice specific.

      *   **Move (4) Marco:** "Analogy cuts the other way... refusal is rational precisely because it carries out the antecedently rational policy... anyone who could still coherently wonder 'but should I really pay?'... was never the kind of agent the driver would have picked up."
          *   *Strength:* Attacks the "time-slice" view of agency. Suggests agency is extended over time. If you are the type who wonders, you lose. So don't be that type.
          *   *Weakness:* "Misdescribes the situation." This is bold. It implies the decision node *doesn't exist* for the rational agent.
          *   *Critique:* Pushes for a unified theory of agency where policy *constitutes* act rationality.

  4.  **Synthesizing the Adjudication:**

      *   **Move 1:** Yuki wins on standard definitions (CDT), but Marco will say the definition is the problem.
      *   **Move 2:** Marco wins on pragmatic grounds (instrumental success), but begs the question on the definition of "act rationality."
      *   **Move 3:** Yuki wins on conceptual clarity (distinguishing policy vs. act), but the Ulysses analogy is slightly imperfect (external vs. internal constraint).
      *   **Move 4:** Marco wins on the metaphysics of agency (diachronic vs. synchronic), but risks defining rationality as "whatever the successful type does."

      *   **The Core Issue:** Is it Act Evaluation vs. Policy Evaluation? Or is it CDT vs. FDT/EDT?
      *   **Substantive or Verbal?** It's partly verbal (definition of "rational act"), but underneath lies a substantive disagreement about the *nature of agency* and *counterfactuals*. If you think counterfactuals about your own psychology matter (FDT), Marco is right. If you think only causal consequences of the physical act matter (CDT), Yuki is right.
      *   **Conclusion:** They are talking past each other *to an extent*, but the "past each other" part rests on a substantive disagreement about whether rationality is a property of time-slices or extended agents.

  5.  **Drafting the Response:**
      *   *Tone:* Academic, respectful, precise (suitable for a grad group facilitator).
      *   *Structure:*
          1.  Introduction acknowledging the depth of the problem.
          2.  Move-by-Step Analysis (1-4).
          3.  Diagnosis of the Disagreement (Substantive vs. Conceptual).
          4.  Recommendation for the next session.
      *   *Key Philosophical References to keep in mind (internal):* Parfit, Gauthier (Constrained Maximization), Joyce (CDT), Yudkowsky/Soares (FDT), McClennen (Resolute Choice).

      *(Self-Correction during drafting)*: Be careful not to just say "Marco is FDT and Yuki is CDT." Explain *why* their arguments map there. Ensure I explicitly flag the question-begging as requested.
      *   *Flag on Move 2:* Marco assumes executing a rational disposition *makes* the act rational. That's the contention.
      *   *Flag on Move 4:* Marco assumes wondering implies being the wrong type. That assumes the psychology is fixed/observable in a specific way.

      *   *Final Verdict:* It is *both* verbal and substantive. Verbal on the label "rational," substantive on the structure of decision theory.

  6.  **Refining the Output:** (Reviewing against prompt constraints)
      *   Work through (1)-(4)? Yes.
      *   Say who has the better of it at each step? Yes.
      *   Flag ambiguities/question-begging? Yes.
      *   Tell whether residual disagreement is substantive or talking past each other? Yes.

      *Let's flesh out the "Who has the better of it" nuance.*
      *   (1) Yuki: Better on *local* causal logic.
      *   (2) Marco: Better on *global* instrumental success.
      *   (3) Yuki: Better on *analytic distinction*.
      *   (4) Marco: Better on *agency coherence*.

      *Wait, is the Ulysses analogy perfect?* Yuki says sailors' refusal is not made rational by what he shouts *in that moment*. Marco says it *is* rational because it carries out the policy. Actually, in the Ulysses case, the sailors are following orders. In Hitchhiker, the agent is following their own prior interest. The analogy holds for *resoluteness*.

      *Okay, ready to write.*
answer: |-
  This is a classic instantiation of the tension between **Causal Decision Theory (CDT)** and **Evidential/Functional Decision Theory (EDT/FDT)**, often framed in the literature as the debate between **Sophisticated Choice** (Yuki) and **Resolute Choice** or **Constrained Maximization** (Marco). The Hitchhiker case is designed specifically to break standard decision theories that focus solely on the causal consequences of the act at the moment of execution.

  Here is an adjudication of the exchange move-by-move, followed by an assessment of the underlying disagreement.

  ### Move-by-Move Adjudication

  **(1) Yuki: "Paying is straightforwardly irrational... sunk cost... handing over $1,000 for nothing further."**
  *   **Assessment:** Yuki has the better of it **on standard causal grounds.**
  *   **Analysis:** Yuki is applying the principle of *dominance* at the specific decision node in town. At that moment, the ride is a sunk cost. The causal consequence of paying is -$1,000; the causal consequence of not paying is $0. Since the driver's decision is already made and cannot be causally influenced by the payment *ex-post*, paying is strictly dominated.
  *   **Critique/Flag:** Yuki is implicitly defining "rationality" as **local causal efficacy**. This is not necessarily a mistake, but it is a specific theoretical commitment. She assumes the rational assessment must be made from the perspective of the agent *at the time of the act*, ignoring how that act-type was selected. This is the "sophisticated" stance: you anticipate you will defect later, so you anticipate you won't get a ride, but you still defect when you get the chance.

  **(2) Marco: "This proves too much... no purely self-interested agent could ever truthfully signal... disposition to pay must be rational... act that executes rational disposition cannot itself be irrational."**
  *   **Assessment:** Marco has the better of it **on instrumental/pragmatic grounds.**
  *   **Analysis:** Marco correctly identifies that Yuki's position is **pragmatically self-defeating**. An agent who reasons like Yuki is predictably worse off (dead in the desert) than an agent who reasons like Marco. In decision theory, a theory that recommends actions leading to foreseeably worse outcomes is often considered defective.
  *   **Critique/Flag:** Marco **begs the question** in the final clause: *"an act that simply executes a rational disposition cannot itself be irrational."* This is the exact point in dispute. Yuki denies this derivation. Marco assumes that if a policy is rational *ex-ante*, any token action fulfilling it is rational *ex-post*. This conflates the rationality of *cultivating a character* with the rationality of *specific actions* performed by that character. He also trades on an ambiguity in "rational": does it mean "successful" or "reasoned correctly at the node"?

  **(3) Yuki: "Running together two different questions -- which policy is good to adopt, versus which act is rational given where you actually stand... Ulysses's sailors."**
  *   **Assessment:** Yuki has the better of it **on conceptual clarity.**
  *   **Analysis:** Yuki successfully isolates the two distinct evaluative perspectives: *ex-ante* (policy selection) and *ex-post* (act execution). Her Ulysses analogy is strong: The sailors binding Ulysses is rational *ex-ante*. When Ulysses begs to be released, the sailors' refusal to unbind him is rational *relative to the plan*, but Yuki argues we can still say the *act* of ignoring his current pleas is not justified by his *current* desires, only by the past contract. She is arguing for **time-slice rationality**: what is rational for me *now* depends on my situation *now*.
  *   **Critique/Flag:** The analogy is slightly imperfect. The sailors have an external constraint (the prior order). The Hitchhiker has only internal psychology. Yuki assumes the agent *can* separate the policy from the act psychologically. If the agent truly has the "disposition to pay," can they actually view the payment as a fresh decision? Yuki assumes they can (sophistication), while Marco assumes they cannot (resoluteness).

  **(4) Marco: "Analogy cuts the other way... refusal is rational precisely because it carries out the antecedently rational policy... anyone who could still coherently wonder 'but should I really pay?'... was never the kind of agent the driver would have picked up."**
  *   **Assessment:** Marco has the better of it **on the metaphysics of agency.**
  *   **Analysis:** Marco pushes back on the "time-slice" view. He argues that agency is **diachronic** (extended over time). If you view the payment as a "fresh, isolated decision," you have already failed the psychological test required to get the ride. Therefore, for the agent who *actually gets the ride*, the decision node Yuki describes (where paying is optional and costly) does not exist as a live option.
  *   **Critique/Flag:** Marco risks **defining the problem away**. By claiming that wondering about payment "misdescribes the situation," he implies that a rational agent literally cannot perceive the option to defect. This is a strong claim (akin to Functional Decision Theory) that requires justification. He is effectively arguing that rationality is a property of the *algorithm* the agent runs, not the *output* at a specific timestamp.

  ---

  ### Diagnosis of the Disagreement

  Are Yuki and Marco having a substantive disagreement, or talking past each other?

  **They are doing both.**

  **1. The Verbal/Conceptual Layer (Talking Past Each Other)**
  A significant portion of their stalemate is due to differing definitions of the target concept **"Rational Act."**
  *   **Yuki** is using a **local, causal definition**: An act is rational if, at the moment of choice, it maximizes expected utility given the causal powers available *at that moment*. Under this definition, she is undeniably correct. Paying in town causes nothing but loss.
  *   **Marco** is using a **global, functional definition**: An act is rational if it is the output of a decision procedure that, overall, maximizes utility for the agent across time. Under this definition, he is undeniably correct. The procedure "pay if rescued" saves lives; the procedure "don't pay" gets you killed.

  If they do not agree on whether "rationality" tracks *local causal leverage* or *global success conditions*, they will never agree on the verdict.

  **2. The Substantive Layer (Real Disagreement)**
  However, beneath the terminology lies a deep, substantive disagreement about the **nature of agency and counterfactuals.**
  *   **The Counterfactual Disagreement:** Yuki treats the driver's prediction as a fixed past event that cannot be influenced by the current payment. Marco treats the driver's prediction as *logically dependent* on the agent's decision algorithm. For Marco, when you decide in town, you are effectively deciding what kind of agent you are, and the driver's past prediction tracks that. This is the core divide between Causal Decision Theory (Yuki) and Functional/Evidential Decision Theory (Marco).
  *   **The Agency Disagreement:** Yuki views the agent as a sequence of temporal selves with potentially conflicting interests (the "self in the desert" vs. the "self in town"). Marco views the agent as a single, extended entity whose rationality is compromised if later selves betray the plans of earlier selves without new information.

  ### Recommendation for the Next Session

  You should not declare a winner, because the literature has not declared a winner. This is the frontier of decision theory. Instead, frame the next session around the **source** of their divergence.

  1.  **Clarify the Definitions:** Ask them to explicitly define "rational." Is it "doing the best you can with the cards you're currently holding" (Yuki) or "being the kind of player who wins the game" (Marco)?
  2.  **The "Why" Question:** Ask Marco: *If* I am already in town, and I *know* the driver has already left, what causal mechanism does my payment trigger that makes it rational? If he says "none," ask Yuki: *If* you know that reasoning like you do will leave you dead in the desert, in what sense is your reasoning "rational"?
  3.  **Readings:** Assign **David Gauthier's *Morals by Agreement*** (for Marco's constrained maximization view) and **Edward McClennen's *Rationality and Dynamic Choice*** (for the resolute choice view) against **James Joyce's *The Foundations of Causal Decision Theory*** (for Yuki's view).

  **Verdict:** Yuki wins on the **logic of the specific moment**; Marco wins on the **logic of the life**. The residual disagreement is substantive: it is a conflict between **act-centered** and **agent-centered** decision theories. They are not merely talking past each other; they are advocating for incompatible architectures of rational choice.
