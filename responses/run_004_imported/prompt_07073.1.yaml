answer: |-
  The rain against the conservatory windows sounded like static, a white noise that made the silence inside Room 304 feel heavier. Elias sat at the Steinway, his hands resting on his thighs. The score of Beethoven's *Hammerklavier* lay open on the rack, a dense forest of ink.

  He was scheduled to give a masterclass on the sonata in three days. For thirty years, he had taught this piece as the apex of the repertoire. It was the mountain. But last night, over cheap wine, a graduate student had asked him why he loved it.

  Elias had started to talk about harmonic resolution, about the structural integrity of the fugue. The student, a quiet girl who usually played Bach with terrifying precision, had tilted her head. "But what does it *do* to you? Not in your head. In your chest."

  He hadn't had an answer then. Now, alone, he decided to find one.

  He placed his hands on the keys. He didn't start with the explosive opening allegro. He went to the third movement, the *Adagio sostenuto*. Tolstoy's little blue book was in his coat pocket. He hadn't opened it in twenty years, but the criteria had stuck like a burr: *Individuality. Clarity. Sincerity.* The artist must feel a feeling so strongly that he forces the listener to feel it too. Like a yawn. Like a flu. If you walk away admiring the cough instead of catching the sickness, it isn't art. It's a trick.

  Elias pressed the first chord. It was rich, resonant. He played the first phrase. He watched his own hands. They were moving with the authority of decades. He knew where the breath should catch. He knew where the dynamic should swell to simulate a sob.

  He played for ten minutes. He stopped.

  He sat in the silence, waiting for the residue. Usually, there was a glow. A sense of having communed with the divine. Today, there was only the phantom ache in his left shoulder and a mild satisfaction that he hadn't missed the voicing on the arpeggios.

  He tried again. This time, he closed his eyes. He tried to summon the grief Beethoven must have felt. The isolation. The deafness. He poured that intention into the keys. He played the passage where the melody seems to disintegrate into recitative.

  He finished the section and let his hands drop. He scanned his interior landscape.

  He felt impressed. He felt a sense of awe at the complexity of the construction. He felt like a man standing at the base of a cathedral, looking up at the vaulted ceiling and thinking, *That is a lot of stone. It is remarkable that it does not fall.*

  But he did not feel the architect's sorrow. He did not feel the specific, individual pain that necessitated the stone. He was admiring the engineering.

  "Counterfeit," he whispered. The word felt treasonous.

  He stood up and walked to the small sink in the corner of the room. He splashed water on his face. He needed a control group. He needed to remember what actual infection felt like.

  He pulled his phone from his coat pocket. He scrolled past emails from the department head, past reviews of his last recording. He found a video file dated four years ago.

  He pressed play.

  The screen showed a shaky recording of a community center basement. His daughter, Sarah, was twenty-two then. She was standing at a microphone with a guitar that was out of tune. She was singing a song she had written the week after her mother died. It was three chords. The melody was repetitive. Her voice cracked on the high notes.

  Elias leaned against the sink.

  Within ten seconds, his throat tightened. By the first chorus, his eyes were burning. He wasn't analyzing the chord progression. He wasn't admiring the technique. In fact, the technique was poor. But he felt a heavy, cold weight settle in his sternum. It was *her* weight. She had transmitted the specific texture of her grief, and it had bypassed his intellect and lodged itself in his nervous system. He felt lonely in a way that wasn't his own, yet was now entirely his.

  He turned the phone off. The silence of the practice room rushed back in, but it felt different now. It felt manufactured.

  He walked back to the piano. The *Hammerklavier* score seemed to glare at him. The intricate notation looked less like a message and more like a fortification.

  He sat down and played the opening bar again. *Fortissimo.*

  He listened to the decay of the sound. He realized he was performing "Greatness." He was enacting the ritual of High Art. He was relying on the audience's training—their habit of sitting still, of coughing at the right times, of associating difficulty with value—to do the work that the sincerity of the feeling should have done.

  Beethoven wasn't infecting him. Beethoven was commanding him. And he was obeying out of respect for the rank, not because the order carried a virus of feeling.

  If Tolstoy was right, this wasn't a masterpiece. It was a highly sophisticated piece of rhetoric. It was a speech written in a language so complex that people assumed the speaker must be wise, when he might just be obscure.

  Elias looked at the metronome on the fallboard. He set it to sixty. He played a scale. C Major. Simple. Clear. He tried to put into that scale the feeling of the rain outside. Just the rain. Not the *idea* of rain, but the wetness.

  He played it again. It was boring. It was trivial. But when he stopped, he felt a tiny, honest ping of recognition. *Yes. Wet.*

  Then he played the Beethoven again. The contrast was violent. The Beethoven demanded worship. The C Major scale just existed.

  He looked at the clock. It was past midnight. He had a masterclass in three days where he was supposed to teach twelve advanced pianists how to convey the "emotional depth" of this sonata. He was going to stand there and teach them how to simulate infection. How to use rubato to mimic hesitation. How to use dynamics to mimic anger. He was going to teach them how to build a better counterfeit.

  Elias closed the piano lid. The sound was a dull thud, final and unresonant.

  He took the score off the rack. He didn't tear it up; that would be theatrical, another performance. He simply placed it inside his bag, zipped it shut, and pulled his coat on.

  In the hallway, the lights were on a timer and flickered off as he walked toward the exit. He stopped at the department office door. He didn't go in. He just pulled out his phone and dialed the number of the department head. It went to voicemail.

  "This is Elias," he said. His voice sounded flat, drained of the usual performative warmth. "I'm canceling the masterclass next week. No, I'm not ill. I just... I don't have anything to say about the piece anymore."

  He paused, waiting for a feeling to tell him he was making a mistake, that he was committing heresy against the tradition that had fed him for forty years. He waited for the guilt to feel like a moral failure.

  He felt only a strange, hollow lightness. Like a man who has realized he has been holding his breath for an hour, and finally exhales, only to discover there is no air in the room.

  "Call me," he said, and hung up.

  He pushed open the heavy door and stepped out into the rain. He didn't open his umbrella. He walked to his car, letting the water soak his shoulders, checking his chest to see if he could feel the cold, really feel it, without turning it into a metaphor.
