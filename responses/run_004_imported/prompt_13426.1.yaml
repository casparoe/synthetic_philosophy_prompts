          *   *Analysis:* This is the standard 2Dist interpretation of the "epistemic dimension." Kripke focuses on metaphysical necessity (2-intension). 2Dism distinguishes epistemic possibility (1-intension) from metaphysical possibility (2-intension). Elena is right that the 1-intension is contingent. Is she right that this shows Kripke *overstated* his case? Kripke claimed metaphysical necessity. 2Dism agrees metaphysical necessity holds (2-intension). Elena implies Kripke ignored the 1-intension's modal status.
