answer: |-
  Here is the breakdown you need, stripped of the "cash-value" caricature, followed by a definitive verdict on who is actually talking about truth.

  ### The Real Split: The Limit vs. The Process

  The "truth is what works" soundbite is a Jamesian shortcut that Peirce hated because it ignores the *temporal* and *communal* constraints Peirce built into his system.

  **William James: Truth as a Process of Verification**
  For James, truth is not a static property inherent in an idea. It is an event. An idea *becomes* true. It is *made* true by events.
  *   **The Mechanism:** When you have a belief, you test it against experience. If the belief guides you successfully through your stream of experiences, connects disparate facts, or provides psychological satisfaction (especially in moral or religious contexts), it is "true."
  *   **The Focus:** The individual agent in the present moment. James is concerned with the *live option*. If believing in free will makes you a more moral actor *now*, that belief has "cash value."
  *   **The Problem:** This makes truth pluralistic and mutable. A belief can be true for you but not for me, true today but not tomorrow if it stops "working."

  **Charles Sanders Peirce: Truth as the Fated Consensus**
  Peirce agreed that meaning is found in practical effects (The Pragmatic Maxim), but he vehemently disagreed that truth is determined by individual satisfaction.
  *   **The Mechanism:** Truth is the opinion that the community of inquirers is *fated* to agree upon in the indefinite long run. It is the ideal limit of investigation.
  *   **The Focus:** The community and the future. Peirce introduces a realist constraint: there is an external reality ("Secondness") that resists our will. You can believe the earth is flat, and it might "work" for your navigation locally, but reality will eventually force the community to correct you.
  *   **The Rebrand:** Peirce coined "Pragmaticism" (a name he called "ugly enough to be safe from kidnappers") specifically to distance himself from James's subjectivism. For Peirce, truth is not what works for *you*; it is what you *cannot* ultimately avoid believing if you investigate long enough.

  ### The Verdict

  Here is the side I am picking: **William James offers a theory of belief-formation wearing truth's clothes. Charles Sanders Peirce offers the only account that functions as a genuine theory of truth.**

  ### The Justification

  The distinction rests on whether you preserve the gap between *being justified* and *being true*.

  **James Collapses the Gap**
  James's theory is essentially a theory of **warranted assertibility**. He defines truth as "the expedient in the way of our thinking." By doing this, he conflates the *criteria* for truth (verification/utility) with the *nature* of truth.
  If truth is simply "what works," then truth loses its normative force. It becomes a synonym for "successful belief." If a lie sustains a society better than the truth (a classic counter-example), James's framework struggles to call it false, provided it "works." James is describing how humans *fixate belief* (a psychological and sociological process), but he is not describing what makes that belief *true* in a way that transcends the believer. He is analyzing the *utility of holding a belief*, not the *truth of the proposition*.

  **Peirce Preserves the Gap**
  Peirce's definition of truth as the "final opinion" is often criticized as being circular or metaphysical, but it serves a critical logical function: it preserves **fallibilism**.
  For Peirce, we can be justified *now* (the belief works for us now), but still be *wrong*. Why? Because we haven't reached the end of inquiry. By positing truth as a *limit* rather than a *current tool*, Peirce acknowledges that reality can prove us wrong later.
  *   **James:** "It is true because it works." (Truth depends on us).
  *   **Peirce:** "It works because it is true (aligned with the real)." (Truth constrains us).

  Peirce maintains that there is a "Real" independent of what you or I think about it. His theory of truth is a theory of **correspondence**, mediated by inquiry. James's theory is a theory of **coherence/utility**, mediated by individual experience.

  **Conclusion**
  James gave us a brilliant psychology of how we validate ideas. But a theory of validation is not a theory of truth. Peirce understood that for "truth" to mean anything distinct from "comfort" or "success," it must refer to something that stands outside our current cognitive grip. Peirce's "Pragmaticism" is the only version that keeps truth as a goal we aim for, rather than a trophy we award ourselves for feeling good. James is talking about belief; Peirce is talking about the world.
