answer: |-
  This is an excellent question that cuts to the heart of *On Certainty*. You have identified the precise tension that separates Wittgenstein's project from the way it is often appropriated in contemporary epistemology (including rationalist circles).

  The rationalist reading tends to treat hinge propositions as **fixed priors**: foundational beliefs with a probability of 1 that anchor the Bayesian network. If you read Wittgenstein that way, the riverbed metaphor becomes a nuisance—a concession that maybe, *very rarely*, we update our priors.

  But Wittgenstein is making a more radical claim. To reconcile the hinge and the riverbed, you have to distinguish between the **logical function** of a proposition at a given moment (the hinge) and the **historical status** of that proposition over time (the riverbed).

  Here is a reading of how those two passages fit together.

  ### 1. Synchronic Logic vs. Diachronic History

  The hinge metaphor (§341–343) is **synchronic**. It describes the structure of justification *at a specific moment* within a specific language-game.
  The riverbed metaphor (§96–97) is **diachronic**. It describes the evolution of our system of reference *over time*.

  When Wittgenstein says the hinges must "stay put" for the door to turn, he is making a claim about the **logic of inquiry**, not the metaphysics of truth. For *this* specific doubt to be intelligible (e.g., "Is there milk in the fridge?"), *that* specific background must be held fast (e.g., "Fridges exist," "Milk is a liquid," "My memory of putting it there is generally reliable"). If you doubt the background, you aren't raising a doubt about the milk; you are dissolving the context in which "milk in the fridge" has meaning.

  However, the riverbed metaphor explains *how* we arrived at a situation where "Fridges exist" is a hinge rather than an empirical hypothesis. It acknowledges that what functions as a hinge today might have been an empirical discovery yesterday, and might be a discarded myth tomorrow.

  **The Reconciliation:** A proposition is a hinge **relative to the current configuration of the riverbed.** It is not absolutely exempt from doubt forever; it is exempt from doubt *insofar as we are playing the current language-game.*

  ### 2. "Hardening" is a Change in Grammatical Role

  The key to the riverbed passage is the distinction between "fluid" and "hardened" propositions. Wittgenstein suggests that empirical propositions can *become* hinges.

  Consider the proposition: *"The earth has existed for many years."*
  *   **In 1600:** This might have been a fluid proposition, subject to theological or cosmological debate (fluid water).
  *   **In 2024:** This is a hinge. If you try to doubt it in a standard scientific context, you aren't doing science; you are speaking nonsense or playing a different game (the water has hardened into the bed).

  The "shifting of the bed" occurs when a hardened proposition softens again. For example, *"Space is absolute"* functioned as a hinge (part of the riverbed) for Newtonian physics. Einstein didn't just disprove an empirical claim; he shifted the riverbed. He turned a proposition that was previously a condition for investigation into a proposition that was itself subject to investigation (and revision).

  So, to answer your specific question: **A proposition's status as a hinge is relative to a particular stretch of practice.** It is not an intrinsic property of the proposition itself. "I have two hands" is a hinge in almost every context, but if I am a surgeon preparing for a transplant, it becomes an empirical object of scrutiny.

  ### 3. What Survives of the "Possibility of Doubt"?

  You ask: *If the bed shifts, what survives of the claim that hinges are what make doubt possible, rather than merely whatever happens to be settled at a given time?*

  This is where Wittgenstein diverges from the rationalist "fixed prior" model. For Wittgenstein, doubt is not a mental state of uncertainty; it is a **practice**. To doubt is to do something (check, measure, calculate).

  The claim that "hinges make doubt possible" survives, but it must be understood **pragmatically rather than foundationally**.
  *   **Foundationalist view:** We need indubitable truths to build knowledge upon. (The rationalist reading).
  *   **Wittgenstein's view:** We need **agreed-upon methods of acting** to engage in the practice of doubting.

  The riverbed *is* the set of agreed-upon methods of acting. If the riverbed shifts, it doesn't mean "doubt becomes impossible." It means **the specific doubts that were previously possible become obsolete, and new ones emerge.**

  When the riverbed shifts (e.g., the transition from Newtonian to Relativistic physics), we don't lose the ability to doubt. Rather, the *logic* of our investigation changes. The old hinges (absolute time) become fluid propositions, and new hinges (the speed of light is constant) harden.

  Therefore, hinges make doubt possible **locally**. They provide the friction necessary for the wheels of inquiry to turn *here and now*. The riverbed metaphor ensures we don't mistake this local necessity for eternal truth.

  ### 4. Why the Rationalist Reading Fails Here

  In rationalist forums, hinges are often treated as **Bayesian Priors with Probability 1**. This implies that the hinge is part of the calculus of belief, just at the extreme end.

  Wittgenstein's riverbed metaphor destroys this. If a proposition can shift from fluid to hard and back again, it cannot be assigned a fixed probability.
  *   When a proposition is **fluid**, it has a probability (it can be confirmed or disconfirmed).
  *   When a proposition **hardens** into the riverbed, it drops out of the probability calculus entirely. It is no longer "believed"; it is **enacted**.

  You do not "believe" the riverbed is there; you walk on it. You do not "believe" logic works; you use it. When the riverbed shifts, it is not a Bayesian update (which happens within the system); it is a **paradigm shift** (which changes the system).

  ### Summary Interpretation

  To read §341–343 (Hinges) and §96–97 (Riverbed) together:

  1.  **The Hinge** describes the **role** a proposition plays in a specific moment of inquiry. To ask a question, some things must be treated as questions *no longer*.
  2.  **The Riverbed** describes the **career** of that proposition. It explains how an empirical claim can acquire the status of a rule, and how a rule can degrade back into an empirical claim.
  3.  **The Tension Resolved:** The necessity of the hinge is **internal to the language-game**, not external to history. The riverbed *is* the historical accumulation of what we have currently decided to treat as a hinge.

  So, is the status absolute or relative? **It is functionally absolute within the game, but historically relative.**

  What survives of the claim that hinges make doubt possible? The claim that **without a background of certainty, no specific uncertainty can be articulated.** But the riverbed reminds us that "certainty" here doesn't mean "knowledge of the truth"; it means "commitment to a form of life." We can change our form of life (shift the bed), but we cannot doubt everything at once, because to doubt is to act, and to act is to stand on some bed or other.
