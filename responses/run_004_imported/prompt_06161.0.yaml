prompt: |-
  Ok so for my little philosophy podcast (very amateur, I only started it last year) next week's guest is a philosopher who defends David Lewis's old solution to the grandfather paradox -- basically that 'can' is relative to whatever facts you hold fixed, so Tim both can and can't kill his own grandfather and its not really a contradiction, just two senses of the word getting mixed together. I don't want her to just restate that for 40 minutes, I wanna push on it a bit. Could you draft me like 7-9 interview questions? I definitely want one on the "ok but why does he always fail for some totally unrelated reason, isn't that a crazy coincidence with no common cause tying it all together" objection, one that pushes that further by asking what happens if Tim gets a hundred tries, or if the failure comes down to something like a coin flip -- shouldn't he succeed eventually just by chance?, one on whether the whole two-senses-of-'can' move is really just relabeling the problem instead of solving it, and one on whether her solution is basically hostage to compatibilism being true about ordinary free will, since that's kind of the same move Lewis is borrowing. And for each one throw in a quick follow-up keyed to whatever answer she's most likely to give -- I feel like philosophers always have a rehearsed comeback ready and I don't want to just let it slide.
