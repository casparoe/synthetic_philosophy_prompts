answer: |-
  This is a great lineup. David Lewis's 1976 paper *"The Paradoxes of Time Travel"* is a classic, but it's also ripe for pushing because it relies heavily on semantic contextualism to solve a metaphysical problem. Since you want to avoid a 40-minute lecture, the key is to frame these questions around *consequences* and *intuitions* rather than just asking for exegesis.

  Here are 9 interview questions tailored to your guest's position, including the specific objections you requested, along with the "rehearsed comeback" you should expect and a follow-up to keep the pressure on.

  ### 1. The "Conspiracy of Coincidences" Objection
  **Question:** Lewis argues that Tim doesn't lack the *ability* to kill his grandfather, but the *facts* of the past prevent it. This means every time Tim tries, something else has to intervene—a jammed gun, a slip on a banana peel, a sudden change of heart. But isn't it incredibly suspicious that the universe conspires to stop him *every single time* through unrelated coincidences? It feels like we're trading a logical contradiction for a massive, unexplained cosmic conspiracy.

  *   **Likely Answer:** She will likely say these aren't "coincidences" in a magical sense, just a selection effect. We are only looking at the worlds where Tim fails because the worlds where he succeeds are logically impossible.
  *   **Follow-up:** "Okay, but from Tim's *inside* perspective, it looks like bad luck. If I try to shoot someone 10 times and my gun jams 10 times due to unrelated mechanical faults, I'd suspect a common cause. Why are we allowed to say 'no common cause needed' here? Does this make time travel worlds fundamentally less intelligible than non-time travel worlds?"

  ### 2. The Probability/Statistics Push (Your Request)
  **Question:** I want to push that coincidence point further. Suppose Tim's success depends on a fair coin flip. Heads, he shoots; Tails, he doesn't. If he travels back 100 times, statistics say he should get heads eventually. But if the past is fixed, he *never* kills Grandfather, so the coin *never* lands heads. Does Lewis's view force us to say that probability laws break down for time travelers? Does the universe effectively 'load the dice' to ensure consistency?

  *   **Likely Answer:** She might argue that probability is conditional on the setup. Given the setup includes "Grandfather survives," the probability of the coin landing heads is actually zero, not 50%.
  *   **Follow-up:** "But that seems to change the nature of physical chance. If I hold a fair coin in a time-travel world, is it still a fair coin? If the outcome is metaphysically guaranteed to be Tails because of a future event, in what sense is it 'chance' at all? Are we redefining randomness to save the paradox?"

  ### 3. The "Semantic Stop-Sign" Objection (Your Request)
  **Question:** A lot of critics say Lewis's move—that 'can' is relative to which facts we hold fixed—is basically just relabeling the problem rather than solving it. It tells us how to *talk* about Tim without contradiction, but does it explain what is actually *happening*? Are we just being told to stop asking why he fails because we're using the word 'can' wrong?

  *   **Likely Answer:** She will likely defend conceptual analysis. Philosophy's job is to clarify our concepts. If we clarify 'can', the paradox dissolves. There is no "deeper" metaphysical fact beyond our best concepts.
  *   **Follow-up:** "I get that, but usually when we have a paradox, we want to know which premise is false. Lewis keeps all the premises (Time Travel is possible, Logic holds, Past is fixed) and just adjusts the language. Is there a risk that this linguistic fix hides a genuine metaphysical tension about how causation works?"

  ### 4. The Compatibilism Hostage Situation (Your Request)
  **Question:** Lewis's solution here looks structurally identical to Compatibilism about free will. Just as a compatibilist says 'you could have done otherwise' means 'you would have, if you chose to,' Lewis says 'Tim can kill Grandfather' means 'he would, if the past were different.' If someone rejects compatibilism about free will, are they logically forced to reject Lewis's solution to time travel too?

  *   **Likely Answer:** She will probably agree there's a strong link. Lewis was a compatibilist. She might say, "Yes, if you think free will requires absolute metaphysical openness, you'll hate this too."
  *   **Follow-up:** "But time travel adds a *logical* constraint (the contradiction of killing your ancestor), whereas free will usually deals with *causal* constraints (determinism). Is it harder to be a compatibilist about time travel because the barrier isn't just physics or determinism, it's the Law of Non-Contradiction?"

  ### 5. Selecting the "Fixed Facts"
  **Question:** Lewis says we hold the facts of the past fixed to determine what Tim 'cannot' do. But why do we prioritize the past facts over Tim's intrinsic abilities? Why not hold fixed "Tim is a perfect shot with a working gun" and say the Past must adjust to fit that? What determines which facts get to be 'fixed' in this context?

  *   **Likely Answer:** She will argue that the past is "more fixed" than the future. It's settled. Tim's abilities are intrinsic, but the outcome is extrinsic.
  *   **Follow-up:** "But if time travel is possible, the 'past' is also the 'future' relative to Tim's personal timeline. Why does the external calendar time get to dictate the fixed facts over Tim's personal causal history? Isn't that privileging one frame of reference arbitrarily?"

  ### 6. The "Branching" Alternative
  **Question:** The other popular solution is the Multiverse or Branching Timeline view: Tim goes back, kills Grandfather, and creates a new branch where he was never born, while his original branch remains. Why prefer Lewis's single-timeline view where Tim always fails? Isn't the branching view more honest about the idea that if you *can* do something, you should be able to *succeed*?

  *   **Likely Answer:** She will likely argue that branching timelines aren't really "time travel," it's just "universe hopping." Lewis wants to preserve the intuition that you are visiting *your* past.
  *   **Follow-up:** "Sure, but at what cost? If Lewis's view means Tim is effectively under a metaphysical injunction that prevents him from succeeding at logically possible actions, is that less weird than saying there are multiple versions of Grandfather? Which view does more violence to our common sense?"

  ### 7. Rationality and Advice
  **Question:** Let's talk about Tim's perspective. If Tim knows Lewis is right, he knows he *will* fail. So, would it be irrational for Tim to try? If I know I can't succeed, I shouldn't attempt it. But Lewis also says Tim *has the ability*. Can it be rational to attempt something you know with certainty will fail?

  *   **Likely Answer:** She might distinguish between "knowing it will fail" and "knowing why." Or she might say Tim doesn't know the specific coincidence that will stop him, so he can rationally try.
  *   **Follow-up:** "But if he's read Lewis, he knows the *outcome* is fixed. If I know the lottery ticket will lose, I don't buy it, even if I have the 'ability' to buy it. Does Lewis's view turn time travelers into irrational agents who constantly pursue goals they know are unachievable?"

  ### 8. Intrinsic vs. Extrinsic Abilities
  **Question:** Lewis relies on the idea that abilities are intrinsic to the agent (Tim's skill, the gun's function), but success is extrinsic (the past being a certain way). But don't we usually define 'ability' by success rates? If a golfer putts but a demon always moves the ball at the last second, do we really say they "have the ability" to sink the putt?

  *   **Likely Answer:** She will stick to the standard analysis of ability: It's about the internal capacity and immediate circumstances, not distant logical facts.
  *   **Follow-up:** "But in the time travel case, the 'demon' is logic itself. If my ability is always thwarted by the logical structure of the universe, does calling it an 'ability' do any work? Or is it an empty label we put on a power that can never be actualized?"

  ### 9. The Metaphysical Cost-Benefit
  **Question:** To wrap up: Lewis saves Time Travel from logical impossibility, but he costs us the ability to change the past, introduces weird coincidences, and ties 'can' to specific contexts. For a layperson listening, what is the payoff? Why is it worth saving the possibility of time travel if it ends up looking this constrained and weird?

  *   **Likely Answer:** She will argue that it preserves the coherence of modal logic and shows that our intuitions about paradox are often just linguistic confusions. It expands our understanding of possibility.
  *   **Follow-up:** "So the benefit is mostly theoretical cleanliness? Because practically, a time traveler in Lewis's world is less free than a prisoner in a locked cell. The prisoner might escape; Tim definitely won't. Is 'theoretical cleanliness' worth making time travelers the least free agents imaginable?"

  ### Quick Tips for the Interview:
  *   **The "Lewisian Pause":** Philosophers trained on Lewis often pause to distinguish between "personal time" and "external time." If she does this, acknowledge it ("Right, the distinction is crucial...") but immediately pivot back to the *consequence* ("...but for Tim's experience, does that distinction matter?").
  *   **Don't let her define "Can" for too long:** It's easy to get bogged down in semantics. If she spends 5 minutes on the definition of 'compossibility,' interrupt gently: "I want to make sure I understand how that plays out in the real world though..."
  *   **Use the "Tim" Character:** Keep bringing it back to Tim. It grounds the abstract metaphysics in a story the listeners can follow.

  Good luck with the podcast! This is a fun topic.
