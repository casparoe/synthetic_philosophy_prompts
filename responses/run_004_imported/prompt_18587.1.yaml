answer: |-
  You have put your finger on a very real tension. Your suspicion is well-founded: Yudkowsky's "Thingspace" approach is not a direct competitor to epistemicism or supervaluationism in the traditional sense. It is a **dissolution** of the problem rather than a **solution**, and it achieves this by shifting the domain of inquiry from *semantics and logic* to *cognition and pragmatics*.

  Whether this is a legitimate philosophical move or "changing the subject" depends on what you think the Sorites paradox is actually about.

  Here is the breakdown of why these two approaches talk past each other, and why your intuition that Yudkowsky is "relocating the vagueness" is technically correct.

  ### 1. Solution vs. Dissolution
  The traditional philosophical literature (Williamson, Fine, Keefe, etc.) treats the Sorites paradox as a problem regarding **truth conditions**.
  *   **The Question:** "Under what conditions is the sentence 'This is a heap' true?"
  *   **The Assumption:** Language aims to describe reality, and logic requires bivalence (true/false). Therefore, there must be a fact of the matter about where the boundary lies, or we must revise logic to accommodate gaps/degrees.

  Yudkowsky's "Thingspace" approach (heavily influenced by Wittgensteinian family resemblances and cognitive science) treats the paradox as a problem regarding **predictive utility**.
  *   **The Question:** "Why do we use the label 'heap', and what work does it do for us?"
  *   **The Assumption:** Words are tools for compression and prediction. Categories are drawn where property clusters are dense. Boundaries are drawn where it is *useful* to draw them, not where reality dictates.

  When Yudkowsky says arguing over the boundary is "confused," he is making a **meta-linguistic** claim. He is arguing that the philosophers are reifying the map. To him, the Sorites paradox arises from the false presupposition that the word "heap" corresponds to a natural kind with necessary and sufficient conditions. If you accept that "heap" is just a pragmatic label for a cluster, the demand for a sharp joint disappears.

  So, to answer your first question: **Yes, it is changing the subject.** But proponents of dissolution argue it is changing the subject to the *correct* subject. They claim the philosophers are trying to solve a puzzle that only exists because of a misunderstanding of how language functions.

  ### 2. Does it make the logical problem go away?
  You asked if this dissolution actually makes the logical problem (the inductive premise) vanish, or if it just hides it.

  **It does not make the logical problem go away.** It sidesteps it by rejecting the Inductive Premise on pragmatic grounds rather than logical grounds.

  *   **The Sorites Inductive Premise:** "If $n$ grains are not a heap, $n+1$ grains are not a heap."
  *   **Yudkowsky's Rebuttal:** This premise is false because the utility of the label "heap" does not scale linearly. At some point, adding one grain changes the *cluster density* or the *predictive utility* enough that we switch labels.

  However, this invites your second criticism: **Where is the cutoff for utility?**

  If you say, "We draw the line where it becomes useful," you have simply pushed the vagueness back one step. Now you have to define "useful." Is there a sharp cutoff for usefulness?
  *   If yes: You are an epistemicist about utility.
  *   If no: You have higher-order vagueness about utility.

  Yudkowsky would admit this. His response is essentially: **"Yes, the boundary of the cluster is fuzzy. That's fine. The map is allowed to be fuzzy."**

  In traditional philosophy, fuzzy boundaries are a crisis for logic. In the Thingspace view, fuzzy boundaries are an expected feature of data compression. The "logical problem" only persists if you insist that the map *must* be crisp to be valid. Yudkowsky argues the map *shouldn't* be crisp if the territory isn't.

  ### 3. Relocating the Vagueness
  You hit the nail on the head: **The Thingspace picture relocates the vagueness into 'how similar is similar enough' without admitting that's what it's doing.**

  In *A Human's Guide to Words*, Yudkowsky argues that we draw boundaries to maximize "expected utility." But "expected utility" is itself a vague function dependent on context.
  *   **Context:** In a botanical context, a tomato is a fruit. In a culinary context, it is a vegetable.
  *   **The Shift:** The vagueness isn't in the tomato; it's in the *context*.

  The philosophical literature calls this **Contextualism**. It is a valid position in the Sorites literature (championed by people like David Lewis and Stewart Shapiro). Yudkowsky's contribution is mostly rhetorical and cognitive: he packages Contextualism in the language of Bayesian probability and machine learning (clustering algorithms).

  Does he admit he's relocating vagueness? Implicitly, yes. He argues that the vagueness is in the **mind of the categorizer**, not the **structure of the world**.
  *   **Philosophers:** "Is the vagueness ontological (in the world) or semantic (in the words)?"
  *   **Yudkowsky:** "It's cognitive (in the classifier)."

  This avoids the metaphysical bullet, but it leaves the logical bullet intact. If you try to build an AI to categorize things using Yudkowsky's method, you still have to program a threshold for the clustering algorithm. You still have to decide how many standard deviations from the cluster center counts as "inside." You have not solved the Sorites; you have just automated the decision of where to put the arbitrary cutoff.

  ### 4. Higher-Order Vagueness
  The most damning critique of the "cluster" view regarding the Sorites is **Higher-Order Vagueness**.
  *   **1st Order:** Is this a heap? (Vague)
  *   **2nd Order:** Is it definite that it's a heap? (Also vague)
  *   **3rd Order:** Is it definite that it's definite? (Also vague)

  The Thingspace model struggles here. If categories are density clusters in a high-dimensional space, the "edges" of the cluster are gradients.
  *   If you say "The boundary is where density drops below $X$," you face the Sorites again on $X$.
  *   If you say "The boundary is fuzzy," you haven't explained how to reason about fuzzy boundaries without incurring contradiction.

  Yudkowsky's response is essentially **deflationary**: "Stop trying to reason about the boundary. Just use the probability." He replaces binary truth values with subjective probabilities.
  *   Instead of "True/False," you have "Probability $P(\text{Heap}) = 0.53$."
  *   The Sorites paradox relies on binary logic. If you switch to probabilistic logic, the paradox dissolves because the inductive premise becomes: "If $P(\text{Heap}|n) = p$, then $P(\text{Heap}|n+1) = p + \epsilon$." This is mathematically manageable, but it requires abandoning classical bivalent logic.

  Philosophers like **Degree Theorists** (Fuzzy Logic) have already made this move. Yudkowsky is essentially reinventing Fuzzy Logic/Supervaluationism but framing it as "Bayesian Cognitive Science."

  ### 5. Verdict: Rival Answers or Different Games?
  They are different games.

  1.  **The Philosophers** are playing **Logic**. They want to know how truth works in a world with vague predicates. They care about validity, soundness, and bivalence.
  2.  **Yudkowsky** is playing **Engineering**. He wants to know how to build a mind (human or AI) that navigates the world effectively. He cares about prediction, compression, and utility.

  **Is Yudkowsky "getting away with something"?**
  In a strict logical sense, **yes**. He claims to have "dissolved" the confusion, but he has actually just adopted a **Pragmatic Contextualist** stance and dressed it up in rationalist terminology. He hasn't solved the logical paradox of how to derive a sharp conclusion from vague premises; he has simply asserted that we shouldn't try to derive sharp conclusions from vague premises.

  **Is it better?**
  *   **For AI Alignment:** Yes. You don't want an AI having a metaphysical crisis over whether a human is "alive." You want it to use probabilistic clusters.
  *   **For Law and Ethics:** No. The law *requires* sharp boundaries (guilty/not guilty, adult/minor). The philosophical literature (especially Epistemicism and Supervaluationism) tries to grapple with the moral weight of drawing those lines. Yudkowsky's "just draw it where it's useful" can sound dangerously utilitarian in contexts where rights are at stake.

  ### Summary
  You are right to be bugged. The Thingspace picture **relocates the vagueness** from the object to the classifier's utility function. It claims this is a feature (acknowledging the map is not the territory), but logically, it faces the same regress problems as any other theory unless it abandons bivalent logic.

  Yudkowsky isn't solving the Sorites paradox; he is **dissolving the demand** for a solution by arguing that the demand itself stems from a category error (expecting words to carve nature at joints that don't exist). Whether that is a profound insight or a clever dodge depends on whether you think language is primarily for *describing truth* or *navigating utility*.
