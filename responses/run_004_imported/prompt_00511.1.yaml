      *   *Necessarily Private:* A language where the meanings are *essentially* inaccessible to others. The referents are "private objects" (sense data, qualia) that only the speaker can know. The barrier is logical/conceptual.
      *   *Why it matters:* Wittgenstein isn't arguing that solitude makes language impossible. He's arguing that the *logic* of meaning requires public criteria. If the PLA attacked contingent privacy, it would be empirically false (people do invent secret codes). If it attacks necessary privacy, it targets the Cartesian picture of the mind (the "inner theater").

  3.  **Address the "Why it Matters" (The Load-Bearing Wall):**
      *   If Wittgenstein argued against *contingent* privacy, he would be easily refuted. I *can* write a diary no one else reads. I *can* invent a code.
      *   The Cartesian skeptic says: "Even if you teach me your code, I don't really know what you *mean* by 'pain' because I don't feel *your* pain." This is the *necessary* privacy claim.
      *   The PLA aims to show that meaning requires *rules*, and rules require *checkability*. Checkability requires a public standard.
      *   If the distinction collapses, the PLA becomes a trivial claim about secrecy rather than a profound claim about meaning and mind.

