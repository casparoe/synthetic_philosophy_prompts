prompt: |-
  I'm in my school's philosophy club, and we've spent the last two meetings working through sections 243–275 of Wittgenstein's *Philosophical Investigations*, which is apparently where the private language argument lives. Our discussion leader mentioned, almost in passing, that there's an important difference between a language that is merely *contingently* private (nobody else happens to know it, like a cipher I invented but could in principle teach to someone else) and one that is *necessarily* private (a language that could not, even in principle, be understood by anyone but the speaker, because its terms supposedly name purely private sensations). She said Wittgenstein's argument only really has bite against the second kind, but I'm struggling to see why that distinction is so load-bearing for whether the argument actually succeeds against, say, a Cartesian picture of the mind.

  Could you walk me through why the necessarily-private/contingently-private distinction matters so much here, and what specifically would go wrong with the argument if we let the two collapse into each other? I'd also appreciate a concrete example that makes the contrast vivid, since every textbook illustration I've come across (Robinson Crusoe's language, secret diaries, and so on) ends up feeling like it could go either way, and I want to be able to tell, given some invented language, which side of the line it's actually supposed to fall on.
