      *   **Point 3: The PMI against Structural Realism.** History is full of structural breaks, not just continuities. (e.g., Newton to Einstein, Classical to Quantum). Focusing on Fresnel/Maxwell is cherry-picking.
      *   **Point 4: The Triviality Dilemma.** If structure is abstract enough to survive, it's trivial (e.g., "there is some relation"). If it's specific enough to be non-trivial, it usually gets discarded.
