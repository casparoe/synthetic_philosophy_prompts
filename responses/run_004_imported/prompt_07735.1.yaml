answer: |-
  This is a fantastic pivot point for your piece. Your friend is right to be suspicious: the Fresnel-to-Maxwell transition is the "fruit fly" of structural realism—it's the model organism everyone studies because it's convenient, not necessarily because it represents the whole ecosystem.

  To argue rigorously that this case fails to rescue Structural Realism (specifically Epistemic Structural Realism, or ESR, as championed by Worrall) from the Pessimistic Meta-Induction (PMI), we need to attack the definition of "structure," the methodology of historical selection, and the semantic continuity of the equations themselves.

  Here is the case for the "mean-spirited critic," structured around three core objections: the **Semantic Discontinuity Objection**, the **Post-Hoc Selection Objection**, and the **Meta-Induction Against Structure**.

  ### 1. The Semantic Discontinuity Objection: Is it the *Same* Structure?

  The central claim of ESR is that while the *ontology* (the "furniture") changes, the *mathematical structure* is retained. In the Fresnel case, the equations governing reflection and refraction remain valid. However, this argument relies on a conflation of **mathematical form** with **physical structure**.

  For a realist, mathematics is not just a calculation tool; it represents physical relations. But in the transition from Fresnel to Maxwell, the *physical referents* of the variables changed radically.
  *   **Fresnel:** The variables represented mechanical displacements and stresses in a material, elastic-solid ether. The structure was a **mechanical** structure.
  *   **Maxwell:** The variables represented electromagnetic field strengths and potentials in a vacuum (or a non-mechanical medium). The structure was a **field-theoretic** structure.

  **The Critique:** If the variables refer to fundamentally different kinds of physical entities (mechanical displacement vs. field intensity), then the *structure of the world* they describe has changed, even if the algebraic syntax looks similar.

  As philosopher Steven Psillos has argued, if you strip away the interpretation of the terms to save the structure, you are left with uninterpreted calculus. But uninterpreted calculus isn't a description of reality; it's just syntax. If the structural realist says, "We believe the relations hold," the critic asks: "Relations between *what*?"
  *   If they answer "Relations between fields," they are committed to the new ontology (and thus admit Fresnel was wrong about the structure, since there is no ether).
  *   If they answer "Relations between *something*," they have retreated to a trivial claim that offers no protection against skepticism.

  Therefore, the "preservation" is merely **empirical**, not structural. The equations work because they predict phenomena, not because they captured the "true structure" of the ether. Maxwell didn't preserve Fresnel's structure; he co-opted his math and gave it a new physical grammar. To claim this is structural continuity is to confuse **instrumental success** with **ontological continuity**.

  ### 2. The Post-Hoc Selection Objection: The "No Miracles" Reversal

  Worrall uses the Fresnel case to argue against the PMI by saying, "See! Not everything was thrown out; the structure survived. So it's not a miracle that our theories work."

  However, this commits a severe selection bias. We identify the "true structure" of Fresnel's theory *only because we already know Maxwell's theory succeeded.*

  **The Critique:** Imagine you are a structural realist in 1870. Which part of Fresnel's theory do you bet your realism on?
  *   The wave equation? (Survives)
  *   The assumption of a transverse elastic solid? (Discarded)
  *   The specific boundary conditions? (Modified)
  *   The concept of the luminiferous medium itself? (Discarded)

  There is no algorithmic way to distinguish the "preservable structure" from the "disposable ontology" *at the time of the theory's acceptance*. We only draw the line *after the fact*, once we see what Maxwell kept.

  This turns the Structural Realist argument into a tautology: "The parts of past theories that were true are the parts that survived." This offers no predictive power for *current* theories. It accommodates history rather than predicting the future of science. If the criterion for "real structure" is simply "whatever math survives to the next theory," then structural realism is not a philosophical position about truth; it is a historical observation about theory succession that offers no guarantee that *current* math will survive the *next* revolution.

  ### 3. The Meta-Induction Against Structure

  This is the strongest move for your piece. If the Structural Realist uses history to argue that structure survives (the Fresnel case), the critic can use history to argue that structure *fails* (the PMI against Structure).

  The Fresnel-Maxwell transition is the **exception**, not the rule. If we look broadly at the history of science, mathematical structure is frequently discarded or radically altered, not preserved.

  **Counter-Examples of Structural Discontinuity:**
  *   **Newton to Einstein:** Newtonian gravity relies on Euclidean space and absolute time ($F = GmM/r^2$). General Relativity replaces this with curved spacetime and tensor fields. The mathematical structure of Newtonian gravity is not "preserved" in GR; it is shown to be a limiting case that is fundamentally false about the nature of spacetime. The geometry itself changed.
  *   **Classical to Quantum Mechanics:** The phase space structure of classical mechanics (determinate position and momentum) is replaced by Hilbert space (probability amplitudes, non-commuting observables). This is not a preservation of structure; it is a structural revolution.
  *   **Phlogiston to Oxygen:** Even the "quantitative" structure failed here. Phlogiston theory posited negative weight for phlogiston in some formulations. This structural claim did not survive; it was deleted.

  **The Argument:**
  1.  Structural Realism claims that mathematical structure tends to be preserved across theory change (based on Fresnel/Maxwell).
  2.  However, in many major theory changes (Newton/GR, Classical/Quantum), the fundamental mathematical structure is replaced or subsumed in a way that renders the old structure false, not approximately true.
  3.  Therefore, a Pessimistic Meta-Induction applies to structure just as it applies to ontology: **Most past mathematical structures have been discarded or radically revised; therefore, our current best mathematical structures will likely be discarded or radically revised.**

  By leaning so heavily on Fresnel, the Structural Realist is guilty of the very same cherry-picking they accuse the naive realist of. They point to one success story to immunize themselves against a graveyard of structural failures.

  ### 4. The Triviality Dilemma (Votsis's Challenge)

  Finally, there is a metaphysical problem regarding what "structure" actually *is*. This is often called the **Triviality Dilemma**.

  *   **Horn A:** If "structure" is defined specifically (e.g., "Maxwell's Equations in their 1865 form"), then it is vulnerable to the PMI. We know even Maxwell's equations were modified by Quantum Electrodynamics (QED). They are not strictly true.
  *   **Horn B:** If "structure" is defined abstractly enough to survive theory change (e.g., "There exists some group-theoretic relation governing light"), then the claim becomes trivially true but metaphysically empty. Saying "the world has some mathematical structure" is something even an instrumentalist would agree with. It doesn't justify *realism*.

  In the Fresnel case, Worrall needs the structure to be specific enough to be impressive (it's *these* equations!) but abstract enough to be true (it's not *really* about ether!). The critic argues you cannot have both. If the structure is specific to Fresnel's ether mechanics, it's false. If it's abstract enough to match Maxwell, it's too vague to warrant belief.

  ### Conclusion for Your Piece

  The Fresnel-to-Maxwell case does not rescue Structural Realism because it mistakes **empirical continuity** for **structural truth**.

  1.  **Semantically:** The variables changed meaning, so the "structure" describes a different physical reality.
  2.  **Methodologically:** We only identify the "true structure" post-hoc, making the argument circular.
  3.  **Historically:** It is an outlier. A PMI against structure is just as potent as the PMI against ontology, given the structural breaks between Newton/Einstein and Classical/Quantum.

  The Structural Realist wants to have their cake (believing our theories capture reality) and eat it too (avoiding the embarrassment of dead entities). But the Fresnel example suggests that what survives theory change isn't "truth" or "structure," but merely **empirical adequacy**. And if all we are warranted in believing is that our theories are empirically adequate, we haven't saved realism at all; we've just dressed up instrumentalism in mathematical clothing.

  For your piece, this allows you to conclude that the "graveyard of theories" might not just be full of dead entities, but also full of broken structures. The fact that we found one intact skeleton (Fresnel's math) doesn't prove the graveyard isn't dangerous; it just proves that sometimes, the math is more durable than the metaphysics—but not durable enough to call it "Truth."
