  ### Final Advice for Your Feedback
  When you submit this, you might want to soften the blow on the Estlund section while remaining firm on the accuracy. You could say something like:

  > "You've done a great job summarizing Brennan's specific proposals. However, I think you may have misread Estlund's conclusion in the second paragraph. My understanding of *Democratic Authority* is that Estlund uses epistemic proceduralism to defend democracy *against* epistocracy, arguing that we can't publicly agree on who the experts are (the qualified acceptability requirement). You might want to double-check that section, as it changes the answer to the final question significantly."

  This approach is constructive, helps your classmate learn (which is the point of peer review), and shows your instructor that you have engaged deeply with the material. Enjoy the course! It is never too late to tackle political philosophy.
