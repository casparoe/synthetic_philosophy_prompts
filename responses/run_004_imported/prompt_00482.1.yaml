answer: |-
  **Setting:** *A quiet corner of a 24-hour diner. 2:00 AM. Two empty coffee pots sit between them. Arthur (Anti-Humean/Necessitarian) leans forward, elbows on the table. Hannah (Humean/Best-System Theorist) stirs her tea, looking tired but engaged.*

  **Arthur:** Let's try to pin this down one more time. The core of my objection isn't that your Best System Account (BSA) is mathematically incoherent. It's that it gets the metaphysics backwards. You say the laws are just the axioms of the system that best balances simplicity and strength in describing the Humean mosaic—the total distribution of local qualities in spacetime.

  **Hannah:** That's the gist. The laws supervene on the mosaic.

  **Arthur:** Right. And that's where you lose me. When I say, "The electron moved that way *because* of the Lorentz force law," I am claiming the law explains the motion. The law is prior. On your view, the motion—the particular fact in the mosaic—is prior. The law is just a shadow cast by the facts. But shadows don't make things move. Summaries don't explain their inputs.

  **Hannah:** I think you're conflating two kinds of explanation, Arthur. There's *metaphysical determination*—what makes it the case that the laws exist—and there's *scientific explanation*—how we organize our knowledge to predict and understand phenomena. I agree that scientifically, we use laws to explain particular facts. But metaphysically, the facts ground the laws.

  **Arthur:** That's the Loewer move, isn't it? Distinguishing the "grounding" from the "explanation." But it feels like a verbal trick. If the laws don't metaphysically determine the mosaic, in what robust sense do they *explain* it? If the mosaic were different, the laws would be different. So the laws are contingent on the very things they're supposed to govern. That's circular.

  **Hannah:** It's not circular if you recognize that the dependency runs one way. The mosaic is the fundamental ontology. Full stop. The laws are a derivative description. When a physicist says the law explains the motion, she means that the motion falls under a pattern that is part of the best systematization of the world. She isn't making a claim about metaphysical production. She's saying, "This event is predictable and unifiable within our best theory."

  **Arthur:** But that strips laws of their modal force! Maudlin's point is precise here. Laws support counterfactuals. "If I had released this cup, it would have fallen." Why is that true? On your view, it's true because in the *actual* mosaic, cups fall, and the best system says "cups fall." But what about the nearby possible world where I don't release the cup? There is no fact of the matter in the mosaic there about the cup falling, because I didn't release it. What *makes* the counterfactual true?

  **Hannah:** The best system itself. We evaluate counterfactuals *holding the laws fixed*.

  **Arthur:** But why are you allowed to hold them fixed? If the laws are just summaries of the actual mosaic, why do they have authority over non-actual scenarios? If the laws are nothing over and above the regularities, then in a world where the regularity breaks, the law just *is* different. You're smuggling in a notion of governance you explicitly rejected. You want the laws to be mere summaries when it comes to ontology, but you want them to be governors when it comes to counterfactuals.

  **Hannah:** I'm not smuggling. I'm defining. To be a "law" just *means* to be an axiom of the best system. Part of the job description of the best system is to support counterfactuals. If a regularity is accidental—like "all gold spheres are less than a mile wide"—it doesn't get into the best system because adding that axiom costs simplicity without buying enough strength. But gravitational attraction does. So, when we ask, "What if?", we consult the system, not the raw data. The system is robust.

  **Arthur:** That's pragmatic robustness, not metaphysical necessity. You're telling me the reason the cup would fall is that our *description* of the world says so. I'm telling you the cup would fall because there is a relation of nomic necessitation between mass and spacetime that *forces* it to fall. You're biting the bullet on the idea that the universe is just a giant, unconnected scatter of points, and "laws" are just a compression algorithm we invented.

  **Hannah:** I'm not saying they're invented arbitrarily. The best system is objective. There is a fact of the matter about which system is best. But yes, I deny your "nomic necessitation." What *is* that relation? Armstrong tried to define it as a universal relating universals, but then he had to explain how that relation *makes* the particulars behave. He ended up saying it just "brute necessitates." That's mystical. It's "because I said so" metaphysics. I'd rather say the regularity is brute, and the law is the pattern.

  **Arthur:** It's not mystical to say there are fundamental categories of being. Time, space, matter, and *law*. If you remove law from the fundamental ontology, you lose the direction of time. You lose the difference between a universe that evolves according to Newton's laws and a universe that just happens to look like it did for five seconds and then turns into chaos. If laws supervene on the mosaic, a chaotic future is compatible with the current laws, provided the mosaic changes enough to rewrite the laws. That makes scientific induction irrational.

  **Hannah:** Not irrational, just fallible. Look, Arthur, think about the explanatory priority charge again. You say I have it backwards. But consider this: If laws are fundamental entities that govern the mosaic, how do they interact with it? Do they push particles? Where are they located? If they aren't in spacetime, how do they causally influence things in spacetime? Your view creates a dualism between the law and the world. My view keeps the world as one thing: the mosaic. The "explanation" you crave is actually just a demand for unification. The BSA provides unification without the ontological baggage.

  **Arthur:** The baggage is the price of admission for realism. Here's the specific worry about explanatory priority. If I ask, "Why is the mosaic regular?" you have to say, "Because that's just how it is." I say, "It's regular because the laws constrain it." You accuse me of mysticism; I accuse you of nihilism. If the laws are just the mosaic wearing a mask, then when we discover a law, we haven't discovered a constraint on nature; we've just noticed a pattern. But science acts as if it discovers constraints. We build bridges based on the assumption that the steel *must* behave this way.

  **Hannah:** The "must" is relative to the system. The bridge stands because, given the best systematization of physical facts, the steel behaving otherwise would be a violation of the simplest, strongest theory we have. That's a very strong "must." It's not a logical must, and it's not a metaphysical must imposed from above. It's a nomic must, which is defined by the BSA. You keep insisting that unless the explanation comes from *outside* the mosaic, it's not real explanation. I'm saying explanation is internal to our theorizing about the mosaic.

  **Arthur:** So you are biting the bullet. You admit that on your view, the laws do not explain *why* the mosaic exists or why it is regular. They only explain how to navigate it.

  **Hannah:** I admit that the laws don't explain why the mosaic exists. Nothing does that. But they do explain why specific facts obtain, in the only sense of "explain" that does work. To explain a fact is to show how it fits into the broader structure of the world. The BSA defines that structure. You want the laws to be the *parents* of the facts. I say they are the *map* of the facts. But a perfect map allows you to navigate the terrain just as well as a parent guiding your hand.

  **Arthur:** A map doesn't stop you from walking off a cliff. A parent does. If the laws are just the map, then the universe is walking itself off cliffs constantly, and we just update the map afterwards. That's not what physics feels like. Physics feels like uncovering the rules of the game, not just recording the score.

  **Hannah:** But what if "the rules of the game" is just a figure of speech? What if there is no game master? You're projecting agency onto the universe. You want the laws to *govern*. But governance implies a governor. If you remove the governor, "governance" is a metaphor. I'm taking the metaphor literally: the laws are the generalizations that govern our expectations, not the particles.

  **Arthur:** Then we're at an impasse on intuition. My intuition is that regularity cries out for a producer. Yours is that producers cry out for an explanation of their own power.

  **Hannah:** Exactly. And I think my bullet is softer. You posit a primitive "necessitation" relation that no one can analyze. I posit a primitive "similarity" or "naturalness" among properties to make the Best System objective, but that's lighter than your nomic glue.

  **Arthur:** Is it? If your naturalness is primitive, aren't you just a Humean in name only? If the mosaic has intrinsic structure that makes one system "better" than another objectively, that structure is doing the work my laws do.

  **Hannah:** No. Naturalness just makes some properties carve nature at the joints. It doesn't force them to co-occur. The co-occurrence is the brute fact. The law is the statement of that co-occurrence.

  **Arthur:** Okay, let's try one last angle. The "Rigidity" argument. If the laws supervene on the mosaic, then in any world with the exact same distribution of matter and energy, the laws are identical. Correct?

  **Hannah:** Correct.

  **Arthur:** Imagine a world where the particles move exactly as they do here for a billion years, and then suddenly they all turn into butterflies.

  **Hannah:** Then the best system for that world would be different. It would likely be more complex, or it would include a time-indexed law.

  **Arthur:** But what about *now*? In that world, right now, are the laws the same as ours?

  **Hannah:** If the mosaic up to now is identical, the current best system might be the same, but the *truth* of the law depends on the whole mosaic. So strictly speaking, the laws are different because the total history is different.

  **Arthur:** That's it! That's the backwards explanation. In that world, the future butterfly-explosion determines what the laws are *now*. So the future facts are metaphysically determining the current laws, which are supposed to determine the future facts. That is vicious circularity. The future is fixing the rules of the present.

  **Hannah:** It's not circular because the laws aren't causal agents. The future facts don't *cause* the present laws. The totality of facts *constitutes* the truth conditions for the law-statements. It's like a movie. The fact that the hero dies at the end is part of what makes the movie a tragedy. The ending doesn't reach back and change the beginning. But the genre of the movie depends on the whole reel. The laws are the genre. The facts are the frames.

  **Arthur:** But in a movie, the script comes first. In your universe, the frames are all there is. If the genre depends on the ending, then halfway through the movie, there is no fact of the matter about what genre it is. So there is no fact of the matter about what laws hold. So science is currently guessing at something that doesn't exist yet.

  **Hannah:** Science is guessing at the best systematization of the available data, projecting that it will remain the best systematization of the total data. It's an inductive wager. You want a guarantee. I'm offering a wager with the best odds.

  **Arthur:** And I'm saying that without a guarantor—without a law that *makes* the future resemble the past—the odds aren't just unknown, they're undefined.

  **Hannah:** Then I suppose I'm comfortable with undefined odds, provided the betting strategy works.

  **Arthur:** *(Sighs, leaning back)* You really are willing to let the laws be second-class citizens.

  **Hannah:** I'm willing to let them be what they are: our best grasp of the structure of the mosaic. You want them to be the hands that shape the clay. I'm saying there is only clay.

  **Arthur:** And I worry that without the hands, the clay is just dust.

  **Hannah:** *(Smiles)* Well, the coffee's cold. But the argument's still warm.

  **Arthur:** Same time tomorrow?

  **Hannah:** Same time tomorrow.
