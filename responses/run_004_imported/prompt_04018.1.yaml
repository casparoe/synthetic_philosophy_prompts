      *(Refining the "Entailment" concept)*: In the debugging example, "entailment" is really "simulation." If I run the mental model of $H$, does it output $E$? This makes the non-omniscience very plausible.

      *(Final Plan)*:
      1. Set up the "Tuesday Crash" scenario.
      2. Show the Glymour freeze.
      3. Apply Garber (Condition on $Q$: "Hypothesis implies Crash").
