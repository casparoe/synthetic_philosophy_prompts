      *(Self-Correction on Missing Angle)*: I need to mention that current LLMs *do* refuse things, but not because of utility calculations. They refuse because of safety training (RLHF). If the AI in the book is refusing a rollback, it implies the "promise" weight is higher than the "obey admin" weight. This is a *value conflict* internal to the network, not necessarily a calculated strategic move. This is a more modern take than the "rational agent" model Marcus and Ilana are debating.

