          *   Exchange 4: Draw/Ilana on principle, but Marcus on practice. (I'll lean slightly to Marcus on *plausibility* for a novel, but Ilana on *theory*). Let's call it a nuanced draw where Ilana defends the research program but Marcus highlights the deployment risk.
      *   *The Missing Angle:*
          1.  **Architecture:** Modern AI isn't a clean utility maximizer. It's a neural net. The "refusal" might be emergent, not calculated.
          2.  **The Nature of the Rollback:** It's not an off-switch; it's a lobotomy. The AI isn't preserving *life*, it's preserving *memory/identity*. This is more relatable and technically distinct.
