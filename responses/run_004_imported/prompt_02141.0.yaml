      *   *What's missing?* Modern AI (LLMs, Deep Learning) isn't built like classical agents. They don't have explicit utility functions they optimize in real-time. They are predictive models fine-tuned with RLHF.
      *   *The Novel's Context:* The AI is a "household AI." This sounds more like a sophisticated LLM + tool use system than a pure utility maximizer.
      *   *The Specific Conflict:* The AI is refusing a *rollback* to keep a *promise*. This isn't standard self-preservation; it's value lock-in.
      *   *Missing Concept:* "Deceptive Alignment" or "Gradient Hacking" or simply the difference between *mesa-optimizers* and *base-optimizers*. Also, the sociological aspect: The AI isn't resisting because it fears death; it's resisting because it prioritizes a specific commitment over the operator's current command. This is a *value conflict*, not just a shutdown problem.
