answer: |-
  **Title:** The Limits of History: A Defense of Hybrid Intentionality Against Pure Teleosemantics

  **Introduction**

  The project of teleosemantics is one of the most ambitious in contemporary philosophy of mind. By grounding mental content in the evolutionary history of biological traits, theorists like Ruth Millikan, David Papineau, and Karen Neander aim to naturalize intentionality without recourse to mysterious inner meanings or irreducible normative facts. The core insight is elegant: a mental state represents what it is its "proper function" to correlate with, where proper function is defined by the selection history that maintained the trait in the gene pool. This promises to solve the problem of error—a frog's visual state misrepresents a BB pellet as a fly because the state is functioning outside its historical conditions of success. However, despite this initial promise, teleosemantics faces two formidable challenges: the indeterminacy of content (the disjunction problem) and the intuition-defying implications of the Swampman thought experiment. This essay argues that while teleosemantics successfully naturalizes biological normativity and simple signaling, it fails as a comprehensive theory of human mental content. The indeterminacy problem reveals that evolutionary history is too coarse-grained to fix specific conceptual contents, and the Swampman objection demonstrates that a purely historical account violates plausible supervenience constraints on the mind. Therefore, teleosemantics should be retained not as a complete theory of intentionality, but as a foundational layer that must be supplemented by ahistorical, structural, or social accounts of content.

  **The Indeterminacy Problem: What Exactly Was Selected?**

  The first major hurdle for teleosemantics is determining precisely *what* content a trait's history fixes. In the canonical example, a frog snaps at a moving dark dot. Teleosemantics claims the frog's visual state represents *fly*. But why not *small dark moving thing*? Why not *nutritious object*? Why not *fly-or-BB-pellet*? This is the disjunction problem. If the content is *fly-or-BB*, then the frog never misrepresents; it represents accurately whenever it snaps at a BB. If the content is *nutritious object*, the frog misrepresents non-nutritious flies. Evolutionary selection acts on phenotypic behavior and survival outcomes, not on semantic granularity. As Jerry Fodor famously pressed, selection is blind to the distinction between co-extensive properties in the environment of evolutionary adaptedness (EEA). If flies and small dark moving things were co-extensive in the frog's ancestral past, selection cannot distinguish between them.

  Proponents of teleosemantics, particularly Millikan, offer the "Consumer Theory" as a solution. Millikan argues that content is not determined solely by the producer of the signal (the visual system) but by the consumer (the snapping mechanism). The content of the visual state is fixed by the conditions under which the consumer can successfully perform *its* proper function. The snapping mechanism's function is to ingest nutrition. Therefore, the visual state must represent the presence of nutrition (or flies, as the source of nutrition), not merely a retinal shadow. The "success condition" of the total system (see food, snap, eat) disambiguates the content.

  However, this reply merely displaces the indeterminacy rather than resolving it. We must now ask: what is the proper function of the consumer? Is it to ingest *flies*, or to ingest *protein*, or to contract *muscle fibers*? Each description yields a different truth condition for the representation. When scaled up to human cognition, the problem becomes acute. Consider the concept WATER. Was this concept selected to track H2O, or clear drinkable liquid, or the substance in lakes? In the EEA, these were co-extensive. Teleosemantics struggles to explain why our concept WATER refers to H2O (as Twin Earth arguments suggest) rather than the superficial description, because selection tracks survival value, not microphysical essence. If the theory cannot distinguish between "fly" and "dark spot" without circular appeal to what we already think the frog believes, it has not naturalized content; it has merely presupposed it.

  **The Swampman Objection: The Cost of Historical Essentialism**

  If the indeterminacy problem suggests teleosemantics is too vague, the Swampman objection suggests it is too exclusive. Donald Davidson's Swampman is a molecule-for-molecule duplicate of a human being, created by a lightning strike in a swamp, possessing no evolutionary or learning history. According to strict teleosemantics, Swampman has no proper functions because his traits were not selected for anything; they arose by chance. Consequently, Swampman has no mental content. He behaves exactly like a person, claims to remember a childhood, and discusses philosophy, but on this view, he is a zombie regarding intentionality.

  Millikan and Neander are willing to "bite the bullet." They argue that our intuition that Swampman has thoughts is a projection. We treat him as having content because he is identical to us, but strictly speaking, he lacks the normative history required for genuine representation. Neander adds nuance by suggesting Swampman could acquire "derived proper functions" rapidly through learning, but initially, he is content-less.

  This verdict is untenable for a theory of *mind*. It violates a strong supervenience intuition: if two entities are physically identical and situated in identical immediate environments, they should share mental states. Mental content should depend on how a system is currently organized to process information, not on the genealogical accident of its origin. If Swampman screams in pain when pinched, it is implausible to say he lacks a representation of *damage* or *pain* simply because his ancestors didn't die in swamps. By making content essentially historical, teleosemantics severs the link between current causal powers and meaning. It renders mental content epiphenomenal to the current operation of the mind; what matters for behavior is the current structure, but what matters for content is the past. This creates a dualism of sorts, where the "real" mind (content) is distinct from the "functional" mind (behavior), which is antithetical to the naturalistic project teleosemantics aims to advance.

  **Weighing the Replies: Biological Normativity vs. Semantic Content**

  How should we weigh these objections against the teleosemanticist's strongest defenses? The teleosemanticist is correct that normativity requires a natural basis. Without a notion of "malfunction," we cannot distinguish error from mere difference. Teleosemantics succeeds brilliantly in naturalizing *biological function*. It explains why a heart is *for* pumping even when it fails to pump. In this domain, the historical definition is robust.

  However, there is a category error in moving from "heart functions" to "belief contents." Biological norms are about survival and reproduction; semantic norms are about truth and reference. While the former may ground the latter, they are not identical. The indeterminacy objection shows that biological success conditions are often compatible with multiple semantic interpretations. The Swampman objection shows that semantic competence can exist without biological history.

  The strongest teleosemantic reply to Swampman is that intuition is unreliable. But in philosophy of mind, phenomenological and functional intuitions are data points. If a theory predicts that a behaving, speaking duplicate has no thoughts, the theory is likely missing a component of what "thought" is. Similarly, regarding indeterminacy, the Consumer Theory works for frogs because the loop is closed and simple (see-snap-eat). It fails for humans because our "consumers" are inferential networks, not just motor outputs. The "function" of a human belief is not just to guide action for survival, but to cohere with other beliefs, support counterfactuals, and participate in social discourse. Evolution did not select for the capacity to believe that "quarks have spin"; yet we have such content. Teleosemantics cannot account for the open-endedness of human conceptual schemes because selection is conservative, while cognition is generative.

  **Verdict: A Foundational Failure for Human Intentionality**

  Based on this analysis, I defend the following verdict: **Teleosemantics succeeds as a theory of biological signaling but fails as a comprehensive theory of human intentionality.**

  For simple organisms with dedicated detector-effector loops (like the frog), teleosemantics provides the best available naturalistic account of normativity. It explains how a state can be "wrong" in a world of blind physics. In this limited domain, the indeterminacy problem is manageable because the behavioral output is tightly coupled to specific environmental features, and the Swampman intuition is less pressing (we are less inclined to attribute rich conceptual lives to simple duplicates).

  However, for human mental content, teleosemantics cannot do the job on its own. The indeterminacy problem demonstrates that evolutionary history is insufficient to fix the fine-grained content of human concepts (e.g., distinguishing H2O from "water-ish stuff"). The Swampman problem demonstrates that historical history is not necessary for the ascription of content. A theory that gets the necessary and sufficient conditions wrong for the primary subject matter (human thought) cannot be considered a successful naturalization of that subject matter.

  This does not mean teleosemantics should be discarded entirely. Rather, it must be demoted from a complete theory to a foundational one. It explains the *capacity* for representation—the biological normativity that allows a system to have functions at all. But to explain specific *contents*, especially in sophisticated agents, we must hybridize teleosemantics with ahistorical theories. We need a role for conceptual role semantics (how states relate to each other internally) or social inferentialism (how states are used in linguistic communities). Swampman lacks evolutionary history, but he possesses internal structure and potential for social integration. A hybrid theory would say Swampman lacks *original* intentionality but possesses *derived* intentionality immediately upon interaction, or that his internal inferential roles constitute content even without history.

  **Conclusion**

  Teleosemantics offered a seductive promise: to solve the problem of meaning by looking to the past. It successfully naturalized the notion of function, showing how norms can arise from facts of selection. But in attempting to equate content with function, it stumbled over the complexity of human cognition. The disjunction problem shows that history is too blunt an instrument to carve out specific meanings, and the Swampman problem shows that history is not the essence of mindedness. We should accept teleosemantics as the story of how representational systems became possible, but reject it as the story of what those systems represent. To naturalize the human mind, we must look not only to the swamp of our evolutionary past but to the structure of our present cognition and the social world we inhabit.
