      *   Ensure the distinction between Abhidharma and Madhyamaka is clear, as that's the user's key insight.

  8.  **Self-Correction/Check during drafting:**
      *   *Did I answer the specific prompt?* Yes, working through Catuskoti and Two Truths on Parfit's specific arguments.
      *   *Did I avoid the generic "both reject self" trap?* Yes, focusing on the *constituents*.
      *   *Is the Gelug context relevant?* Gelug Prasangika Madhyamaka is very strict on the "emptiness of dharmas." I should mention that specifically since the user mentioned Gelug. (Tsongkhapa emphasizes that even emptiness is empty).
      *   *Parfit's "facts":* Parfit talks about "impersonal descriptions." Nagarjuna would challenge the "impersonal" status as still conceptual.

  9.  **Final Polish:** Check the flow. Ensure the distinction between "Self-emptiness" (pudgala-nairatmya) and "Phenomena-emptiness" (dharma-nairatmya) is clear, as this is the exact pivot point. Parfit achieves the former; Nagarjuna demands the latter.

  **(Self-Correction Note):** Make sure not to dismiss Parfit. He is philosophically robust. Nagarjuna would respect his logic but point out the subtle reification.

