          *   *Boltzmann Brains:* SIA *loves* Boltzmann Brains if they are more numerous. Since BBs dominate in eternal inflation scenarios (usually), SIA leads to the conclusion "I am likely a Boltzmann Brain," which undermines empirical science (cognitive instability).

