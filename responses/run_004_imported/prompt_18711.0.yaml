          *   *Thirder:* $P(Heads) = 1/3$. Focus on the frequency of awakenings. Being awake *is* new information about the observer's location in the experiment.
      *   **Anthropic Principles:**
          *   *Self-Sampling Assumption (SSA):* "Reason as if you are a random observer from the set of all *actually existing* observers in your reference class." (Aligns with Halfer).
          *   *Self-Indication Assumption (SIA):* "Reason as if you are a random observer from the set of all *possible* observers, weighted by the probability of that observer existing." (Aligns with Thirder).
      *   **Cosmological Implications:**
          *   *Fine-Tuning:* Why are constants life-permitting?
          *   *Eternal Inflation/Multiverse:* Does it explain fine-tuning?
          *   *Boltzmann Brains:* The pathological outcome of certain probability measures.

  3.  **Map SBP Positions to Cosmological Stances:**

      *   **Halfer $\rightarrow$ SSA:**
          *   *Logic:* We are typical observers within the *actual* universe we inhabit.
          *   *Fine-Tuning Implication:* If we are the only universe (Single Universe), fine-tuning is highly improbable. If Multiverse, we must be typical within the *observable* subset.
          *   *Risk:* The "Presumptuous Philosopher" problem. SSA tends to favor smaller universes because it dilutes the probability of being *you* in a huge universe. It can rule out large multiverses a priori.
          *   *Boltzmann Brains:* SSA is vulnerable if the reference class includes BBs. If BBs outnumber ordinary observers (OOs), SSA says we are likely BBs. Since we aren't, the theory predicting mostly BBs is falsified. (This is actually a *strength* for SSA in some views, as it kills bad multiverse models).

      *   **Thirder $\rightarrow$ SIA:**
