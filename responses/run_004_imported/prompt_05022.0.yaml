answer: |-
  The consent form was tablet-glass, cool against Mara's palms. It didn't ask for a signature so much as a biometric confirmation of intent. *Do you authorize the dissolution of current cognitive boundaries?*

  She had twenty-four hours left. The clinic offered a retreat space, quiet and white, designed to minimize noise so you could hear your own reasoning break.

  Mara was trying to run the numbers. It was a habit, ten years of LessWrong threads and decision theory podcasts ingrained in her cortex. *Expected Utility = Probability × Utility.* But the equation was bleeding out.

  The probability was known. The procedure worked. 99.8% success rate. You became Post-Threshold. You gained access to the high-dimensional sensory suite. You could perceive causal links like physical threads; you could feel the weight of other people's emotional states as barometric pressure changes.

  The utility was the problem.

  She had spoken to Julian yesterday. He was three years Post-Threshold. He'd sat across from her in the visitorium, smiling with a kindness that felt slightly too calibrated, like a human mimicking a human.

  "Is it good?" Mara had asked. "Do you… enjoy it?"

  Julian had tilted his head. "Enjoyment is a local variable, Mara. It's like asking a mathematician if they enjoy the number four. It's not about enjoyment. It's about resolution."

  "But do you care about the things I care about?" she pressed. "My sister. Music. The way sunlight hits dust."

  "I care about the integrity of the pattern," Julian said. "Your sister is a node. Music is vibration. Dust is data." He leaned forward, eyes bright with something she couldn't name. "You're trying to ask me if you'll still be hungry after you've learned how to photosynthesize. The question doesn't parse."

  That was the epistemic wall. L.A. Paul's ghost was haunting the room. Mara couldn't know what it was like to be Julian until she was Julian. But if she became Julian, the "her" that cared about sunlight and sisters would be overwritten. The utility function wasn't just changing weights; the variables themselves were being deleted.

  She looked at the tablet. If she signed, she was betting that Future-Mara would be glad Past-Mara made the choice. But Future-Mara might look back at this moment with the indifference of an adult watching a toddler cry over a broken cracker. The toddler thinks the cracker is everything. The adult knows the cracker is nothing. If Mara became the adult, would she value the toddler's happiness? Or would she value the truth of the cracker's insignificance?

  There was no bridge. You couldn't use current values to validate a future self that rejected those values. It was an ontological crisis wrapped in a medical procedure.

  "Having trouble with the calculus?"

  Dr. Aris stood in the doorway. He was Pre-Threshold. He stayed on this side to manage the ones who hadn't left yet.

  "I can't assign a value," Mara said. "If I succeed, I lose the capacity to value this choice. If I fail, I stay here, knowing I refused the only thing that matters to the people who know better."

  "Paul's argument," Aris said, stepping in. "You're waiting for rational authorization. You want the decision to be continuous."

  "It should be continuous. I'm the same person."

  "Are you?" Aris sat on the edge of the desk. "When you sleep, you lose consciousness. When you wake, you inherit the memories. Is that continuous? This is just a deeper sleep. A deeper wake."

  "That's a metaphor. Metaphors aren't data."

  "Neither is your fear," Aris said softly. "Look, Mara. The people who come back… they don't send messages. Not because they aren't allowed, but because the bandwidth is zero. You can't transmit qualia over language. You're trying to read a 4D book using 2D eyes."

  "So I should just guess?"

  "No," Aris said. "You should recognize that this isn't a choice about outcomes. It's a choice about identity. You aren't deciding what happens to you. You're deciding who gets to exist in this body tomorrow. You, or something else."

  Mara looked back at the tablet. The cursor pulsed.

  If she didn't sign, she remained coherent. She kept her loves, her griefs, her specific, narrow human pain. She remained a valid agent in her own utility function.

  If she did sign, she became something greater, perhaps, but something that would not love her back. The transformation was personally transformative; the new entity would not mourn the death of the old one, because it would not understand what the old one was worth.

  It was suicide with a bonus feature. Or salvation with a cost.

  She realized then that the rational move wasn't to calculate the utility. The rational move was to acknowledge the calculation was impossible. The map ended here.

  Mara lifted her hand. She didn't feel brave. She didn't feel convinced. She felt like she was stepping off a ledge because the ground behind her was eroding, not because the air below looked safe.

  She tapped the glass.

  "Okay," she said.

  "Okay," Aris replied. He didn't smile. He looked at her with a kind of gentle pity, the look you give a child walking into a room they won't remember.

  Mara stood up. She wanted to memorize the feeling of the cool air on her skin, the ache in her lower back, the specific anxiety in her chest. She wanted to catalog these things so she could tell Future-Mara they mattered.

  She knew, with absolute certainty, that Future-Mara wouldn't care.

  She walked toward the door anyway.
