answer: |-
  **Setting:** *Cambridge, Massachusetts, 1907. William James's study. The air is thick with pipe smoke and the lingering energy of a successful lecture tour. James is pacing, buoyant. Peirce sits in a high-backed chair, looking weary, his hands stained with ink.*

  **James:** You have to admit, Charles, the reception was electric. They finally understand. For years we spoke into a void, and now? Now they see that philosophy isn't a cemetery of dead systems. It's a tool. A living thing.

  **Peirce:** They see a reflection of their own desires, William. That is not understanding. That is narcissism. I read the transcript of your Berkeley address. You say the truth of an idea is merely its "cash-value."

  **James:** It is a metaphor, naturally. But a precise one. I mean that the truth of a thought is measured by the difference it makes in concrete experience. If believing in God gives a man the strength to endure a tragedy he otherwise couldn't, in what sense is that belief not "true"? It works. It pays dividends.

  **Peirce:** It pays dividends for *him*. For *now*. But suppose his endurance leads him to a conclusion that contradicts the facts of the universe? Suppose his comfort is built on a delusion? You are conflating the *good* with the *true*.

  **James:** I am conflating nothing. I am saying the "true" is a species of the "good." Truth *happens* to an idea. It becomes true, is made true by events. Your definition... it hangs in the air. You say truth is the opinion fated to be agreed upon by all who investigate.

  **Peirce:** Precisely. The "final opinion."

  **James:** But Charles, look at the state of inquiry! We are centuries away from the end of investigation. By your definition, nothing is true *today*. Truth is a horizon we chase but never touch. It renders the word useless for living men. I need a truth I can hold in my hand, not one reserved for the death of the universe.

  **Peirce:** You mistake the nature of the constraint. The truth is not dependent on your ability to hold it. It is dependent on the Reality that constrains us. There is a real world, William, independent of what you, or I, or the entire human race thinks about it. If we all agreed that gravity was a suggestion rather than a law, and we stepped off a cliff, we would fall. Our agreement does not constitute the fall.

  **James:** Agreed. But we are not talking about the *object*, we are talking about the *idea* of the object. How do we access this "Real" except through our experiences? If my experience of an idea is that it leads me through a forest of difficulties to a successful clearing, that idea is true. It has verified itself.

  **Peirce:** Verification is a process. Truth is the limit of that process. You speak of "what works." But "working" is subjective. A paranoid delusion can "work" for a man. It can organize his life, protect him from perceived threats, give him purpose. Is the delusion true because it is useful?

  **James:** Only if the threats are real! If the threats are imaginary, the delusion will eventually lead to a contradiction in experience. It will fail to "work" in the long run. I am not advocating for wishful thinking. I am advocating for the right to believe in hypotheses that are live, forced, and momentous, even when the evidence is not yet coercive.

  **Peirce:** And there lies the rot. You introduce the "will to believe" into the definition of truth itself. You make truth plastic. You make it dependent on the psychological state of the believer. Logic is not psychology, William. The validity of an argument does not depend on how happy it makes the reasoner.

  **James:** But logic is practiced by humans! Cold, hard logic without human context is a skeleton without flesh. You want to purify philosophy of the human element. I want to put the human element back in. If a concept has no practical difference for anyone's life, then yes, let us discard it. But if it changes how a man walks through the world, it has value.

  **Peirce:** Value, yes. Truth, no. You are describing the *expediency* of belief, not the *truth* of belief. Expediency is temporary. Truth is permanent. That is why I have been forced to take measures.

  **James:** Measures?

  **Peirce:** I have renamed my doctrine.

  **James:** (Stops pacing) Renamed it?

  **Peirce:** Pragmaticism.

  **James:** (Laughs) Pragmaticism? It's hideous. It sounds like a prescription for constipation.

  **Peirce:** That is the point. It is ugly enough that no one will be tempted to steal it. When you say "Pragmatism," people hear "whatever is convenient for me to believe." When I say "Pragmaticism," they should hear "the logical method of ascertaining the conceivable practical bearings of a conception."

  **James:** You cannot legislate language, Charles. The public will lump us together regardless of your suffix. And frankly, your "Pragmaticism" is too rigid. It assumes a single, convergent end to inquiry. What if the universe is pluralistic? What if there are multiple truths that don't reconcile?

  **Peirce:** Then the universe is irrational. And if the universe is irrational, inquiry is impossible. I must assume Realism. I must assume that there is a way things are, and that if we inquire long enough, without passion or bias, we will find it. Your version invites bias. It tells the inquirer, "If this belief serves your passion, call it true."

  **James:** It tells the inquirer, "If this belief connects you to reality in a vital way, pursue it." You treat truth as a static property of a proposition. I treat it as a function of a process. You say, "The map is true if it matches the territory." I say, "The map is true if it gets you to the destination."

  **Peirce:** But if the map gets you to the destination by accident, while misrepresenting the terrain, it is not a true map. It is a lucky one. Science is not about luck. It is about method. It is about the community of inquirers correcting individual errors over centuries. You focus on the individual's "cash-value." I focus on the community's "final consensus."

  **James:** And while we wait for this community of the future to agree, what do we do now? We live now. We suffer now. We need truth now. Your truth is a messianic promise. Mine is a currency.

  **Peirce:** Currency fluctuates. Gold does not. I am looking for the gold. You are handing out paper notes and calling them wealth because they spend easily.

  **James:** (Sits down, leaning forward) But Charles, who mints the gold? Who decides? If the "final opinion" is the only truth, then every scientist working today is working in falsehood. They are merely approximating.

  **Peirce:** They are working in *probability*. They are approximating the truth. There is a difference between being false and being incomplete. Your definition suggests that if a belief is useful today and useless tomorrow, its truth value changes. That means a proposition can be true on Tuesday and false on Friday. That is absurd.

  **James:** The proposition doesn't change. The *relation* between the proposition and the experiencer changes. Truth is a relation, Charles. Not a substance.

  **Peirce:** (Sighs, rubbing his temples) You are a psychologist, William. I am a logician. You look at the mind holding the idea. I look at the object the idea signifies. We are speaking past one another.

  **James:** Perhaps. Or perhaps we are two sides of the same coin. You provide the anchor so we don't drift into solipsism. I provide the sail so we don't rot in the harbor.

  **Peirce:** If you drift, you lose the object. If the anchor holds but the boat never moves, you learn nothing of the sea.

  **James:** Then let us agree to disagree on the definition, provided we agree on the method. We both despise absolute monism. We both despise vague abstractions that have no practical consequence.

  **Peirce:** I can agree to that. So long as you do not tell my students that their personal comfort is a metric for logical validity.

  **James:** And so long as you do not tell my students that their lived experiences are irrelevant until the heat death of the universe.

  **Peirce:** (A faint smile) Pragmaticism is an ugly word, William.

  **James:** It is dreadful, Charles. Truly. But I suspect... I suspect history will not be as careful with distinctions as we are. They will call us both Pragmatists.

  **Peirce:** Then let them. But when they confuse the end of inquiry with the convenience of the moment, I shall haunt them.

  **James:** And I shall remind them that inquiry is something humans do, not something the universe does for them. More tea?

  **Peirce:** Please. Black. No sugar. I have no use for false sweetness.

  **James:** (Pouring) As you wish. Though I find a little sweetness makes the inquiry go down much smoother.

  **Peirce:** That, William, is precisely the problem.
