prompt: |-
  Quick one that's been bugging me since a reporting trip. I was interviewing a superforecaster and we ended up in a long side argument about covid origins (lab leak vs zoonotic) -- traded pretty much all our evidence and reasoning, then landed on "guess we just have different priors" and left it there, both still holding our own view.

  I mentioned this to a friend who's a game theorist and she said that's actually not a stable place for two honest, rational people to end up once they've each laid out their full reasoning for the other -- something about it being almost self-undermining. She had to run before explaining, and its been nagging at me since.

  So is "we just have different priors" a legit resting place for two smart people, or does it mean one of us isn't being fully rational? Want an actual argument, not a "reasonable people can disagree" shrug.
