prompt: |-
  so i'm a phd student in philosophy (my own work's on death and personal identity, pretty analytic, not really my home turf) and i somehow got roped into guest-hosting an episode of a friend's podcast. the guest is a Zhuangzi scholar who defends basically the standard line on his death material: fear of death comes from a limited, parochial perspective, and once you really see life and death as just two moments in the same ongoing transformation -- like the turning of the seasons -- equanimity replaces grief. one thing i noticed while prepping is that whenever this reading runs into the more full-blooded cosmological bits (the "Great Clod"/"great smith" molding people like metal), her answer is always some version of "that's poetic register, not literal metaphysics."

  can you draft me 7-8 interview questions that go beyond just having her restate the view, and that make that "poetic register" deflection progressively harder to reach for? specifically i want:
  - one using the skull dialogue (not even a king facing south on his throne has it better than being dead, per the skull) to press on whether this is really equanimity, or a sneaky preference for death over life
  - one on the wife's-death passage, where zhuangzi seems to reason his way out of grief step by step (qi -> form -> life -> death, compared to the seasons) -- doesnt that sit weird with how suspicious he is elsewhere of deliberate argument, as opposed to just going along with things unreflectively
  - one on whether "poetic register" can survive the radical skepticism of the "how do i know loving life isn't a delusion" bit in the qiwulun, without collapsing into "we can't say anything about death either way"
  and end with one on what would actually be different if she just believed the cosmological picture literally -- i.e. what's actually riding on insisting it's "only" poetic. for each, toss in a follow-up keyed to whatever answer she's most likely to give first.
