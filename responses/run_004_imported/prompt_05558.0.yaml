      *   **Validate the intuition:** Yes, in classical logic, negation and conditionals are interdefinable. So it *feels* like solving one solves the other.
      *   **The Pivot:** But Expressivism is trying to *construct* logic from psychology, not assume it.
      *   **Key Point 1: The Direction of Explanation.** To solve the conditional (Blackburn), you need to say what makes attitudes *inconsistent*. Inconsistency is defined via negation (P and not-P cannot both be true/held). So you need an account of negation to make sense of the inconsistency required for the conditional solution. You can't use the conditional to solve negation if the conditional relies on negation.
      *   **Key Point 2: Schroeder's Specific Objection (The "B-type" vs "A-type" inconsistency).**
