          *   But does it explain why [Boo Lying] and [~Boo Lying] are inconsistent?
          *   Schroeder argues Blackburn conflates *logical* inconsistency with *psychological* incompatibility.
          *   The "Negation Problem" is about identifying the specific attitude for $\neg P$ such that it contradicts $P$ *by definition*, not just contingently.
      *   **Key Point 3: Unwin's Embedding.** Unwin focuses on the syntax. "Not" can appear in different places. Expressivism struggles to map the syntactic scope of "not" to distinct psychological states without multiplying attitudes ad infinitum.
      *   **Conclusion:** The negation problem is more fundamental. It's about the *atoms* of the logic, whereas the conditional problem is about the *connectives*. You need the atoms right before the connectives work.

  5.  **Refining the Explanation (Self-Correction/Nuance):**
