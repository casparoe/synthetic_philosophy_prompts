answer: |-
  This is an excellent observation, and it touches on one of the most famous episodes in the philosophy of biology. You are quite right that in *Unended Quest* (1974) and a lecture at Darwin Centenary that same year, Karl Popper expressed deep skepticism about natural selection, famously stating:

  > "I have come to the conclusion that Darwinism is not a testable scientific theory, but a metaphysical research programme."

  Given Popper's stature as the champion of falsificationism, this seems like a devastating critique. However, there are three critical reasons why evolutionary biologists (and philosophers of science) do not accept the conclusion that evolutionary theory fails the test of science.

  ### 1. Popper Retracted This View
  The most important fact often missed in this debate is that **Popper changed his mind.**

  Following the backlash from biologists and philosophers regarding his 1974 comments, Popper revisited the issue. In a 1978 essay titled "Natural Selection and the Emergence of Mind," he explicitly retracted his earlier claim:

  > "I have changed my mind about the testability and logical status of the theory of natural selection; and I am glad to have an opportunity to make a recantation."

  Popper came to agree that natural selection *is* testable. He realized that while the general principle is broad, it generates specific, falsifiable predictions about population genetics, the fossil record, and biogeography. Therefore, relying on Popper's *Unended Quest* quote as his final verdict is historically inaccurate; his final verdict was actually in favor of evolutionary theory's scientific status.

  ### 2. The "Tautology" Charge Was Resolved
  Popper's initial hesitation stemmed from the charge that natural selection is tautological. This is the argument that "survival of the fittest" simply means "those who survive are the ones who survive," which is circular and untestable.

  Biologists and philosophers (such as Morton Beckner and David Hull) demonstrated that this is a misunderstanding of how fitness is operationalized.
  *   **Fitness is not defined solely by survival.** Fitness is defined by specific traits (phenotypic or genotypic) that confer a reproductive advantage in a specific environment.
  *   **Independent Measurement:** We can measure an organism's traits (e.g., camouflage coloration, beak depth, enzyme efficiency) *independently* of whether they survive. We can then make a prediction: "Organisms with Trait X will survive at higher rates." If organisms with Trait X die off while others survive, the hypothesis is falsified.

  Because fitness can be defined independently of the outcome, the theory is not tautological.

  ### 3. Evolutionary Biology is Highly Falsifiable
  If evolutionary theory were truly a "metaphysical research programme" in the negative sense, it would be compatible with any possible observation. In reality, there are many observations that would falsify core evolutionary tenets. J.B.S. Haldane famously quipped that "fossil rabbits in the Precambrian" would disprove evolution.

  More concretely, evolutionary theory would be falsified if:
  *   **Phylogenetic Inconsistency:** Genetic phylogenies consistently contradicted morphological phylogenies with no explanation (e.g., if humans were genetically closer to fungi than to chimpanzees).
  *   **Lack of Variation:** If populations showed no heritable variation upon which selection could act.
  *   **Complexity without Precursors:** If complex organs appeared abruptly in the fossil record without transitional forms (though note: "gaps" alone don't falsify, but a systematic absence of transitions where geology preserves them would).
  *   **Thermodynamics:** If biological systems were found to systematically violate the laws of thermodynamics in ways that precluded self-organization (they do not).

  ### 4. "Metaphysical Research Programme" Isn't an Insult
  Even if we accept Popper's initial label, it is often misinterpreted. In the philosophy of science (particularly in the work of Imre Lakatos, who expanded on Popper), a "research programme" is not synonymous with "pseudoscience."

  A scientific research programme has a "hard core" of assumptions that are protected from immediate falsification, surrounded by a "protective belt" of auxiliary hypotheses that *are* tested. Newtonian physics functioned this way for centuries. Calling evolution a research programme acknowledges that it is a broad framework that generates specific, testable models, rather than a single, narrow hypothesis. This does not remove it from the realm of science; it describes how complex sciences actually function.

  ### Conclusion
  You asked if evolutionary biologists should be more forthright that their discipline doesn't meet the bar of falsifiable science. The consensus among both biologists and philosophers of science is that **they need not be, because the discipline does meet the bar.**

  Popper's initial skepticism was a valuable philosophical stress-test that forced biologists to sharpen their definitions of fitness and testability. However, his final position was a recantation. Evolutionary biology remains one of the most robustly tested and falsifiable frameworks in the natural sciences, consistent with the very criteria Popper spent his career championing.
