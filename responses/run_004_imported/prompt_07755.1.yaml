answer: |-
  Good evening, everyone. For those who don't know me, I'm [Name]. I've had the privilege of working alongside [Honoree] for thirty years.

  When people hear we've been colleagues for three decades, they often assume we agreed on everything. Those who know us better know the truth: we agreed on almost nothing. Specifically, we spent thirty years arguing about one word: *Function.*

  If you asked [Honoree] what the function of the heart is, she would tell you it is to pump blood and make a thumping sound, because those are the things it *does* that allow a doctor to diagnose the body. If you asked me, I would say the function is *only* to pump blood, because that is the reason natural selection kept it in our ancestors. The thumping is just noise.

  She looked at the machine working in the present. I looked at the history written in the genes.

  For thirty years, we argued this in the lab, over coffee, and in the margins of grant proposals. We were passionate, occasionally loud, and always respectful. But it wasn't until I retired, and finally picked up the philosophy books I'd ignored for my entire career, that I realized we hadn't just been bickering. We were unknowingly rehearsing one of the central debates in the philosophy of biology.

  I was defending the **Etiological** account—selected effects, history, ancestry. She was defending the **Cummins** account—causal roles, current systems, immediate utility.

  Now, half of you are nodding, and the other half are wondering if you should have checked the seating chart. But here is why this matters, and why I never wanted to win that argument.

  If we only had my view—if we only looked at history—we would miss what a trait is actually doing right now. We would be like historians who know why a building was constructed but refuse to admit it's currently being used as a library.

  But if we only had [Honoree]'s view—if we only looked at current utility—we would lose the story of how we got here. We would be like architects who know how the library works but don't know it was once a bank, missing the load-bearing walls that hold it up.

  In science, as in life, you need both. You need to know where you came from, and you need to know what work you are doing today.

  [Honoree], for thirty years, you kept me honest. You forced me to look up from the fossil record and see the living organism. I may have brought the history, but you brought the mechanism. And while the philosophers in the room know that the literature doesn't declare a victor between our positions, I think our friendship proves something more important: that the tension between those views is where the insight lives.

  So, I propose a toast.

  To [Honoree]. May your retirement be full of causal roles that bring you joy, may your selected effects be nothing but positive, and may you never stop arguing with me.

  To [Honoree]!
