      *   *Position B: The Researcher's Intuition (Human Specialness).* Humans have capacities (rationality, autonomy, moral agency, complex future planning) that grant them higher status.
      *   *Position C: The Social Contract.* We have obligations to fellow humans based on reciprocal agreements. Animals aren't part of the contract.
      *   *Position D: Relational/Ethics of Care.* We have stronger obligations to our own "kind" or community.
      *   *Position E: Acknowledging the Tragedy (Remainder).* It's a tragic choice. There isn't a clean answer. We choose the lesser evil but acknowledge the cost.

  4.  **Structure the Response:**
      *   **Validation:** Acknowledge the depth and honesty of the question. It's a classic and difficult problem, not just personal guilt.
