prompt: |-
  Got a bioethicist coming on my little podcast next week -- she's built her whole career defending the therapy/enhancement line by grounding it in Boorse's 'normal species functioning' account of health, basically the engine behind Daniels' argument that justice only obligates us to correct disease, not enhance past it. I don't want 40 minutes of her just restating that framework, so can you draft me 8-10 interview questions that actually make her work for it? I want at least one that forces her to confront the akward implication that, since senescence is species-typical for your age cohort, slowing or reversing aging comes out as 'enhancement' rather than 'therapy' on her own view -- and whether she's willing to just bite that bullet, given how much the LW-adjacent longevity crowd cares about this exact classification. One should press the fact/value gap: Boorse's account is supposed to be a purely statistical, descriptive baseline, so how does that license the normative claim that only deviations from it are owed to people as a matter of justice? And one should use the classic growth-hormone case, where a kid with GH deficiency and an equally short kid with idiopathic short stature get the identical injection, and only one of them counts as getting 'treatment.' For each question, throw in a quick note on the answer she'll probably reach for, plus a follow-up that doesn't let her rest there.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Guest:** A bioethicist who defends the therapy/enhancement distinction.
      *   **Theoretical Framework:** Grounded in Christopher Boorse's "Biostatistical Theory" (BST) of health (normal species functioning) and Norman Daniels' "Just Health" argument (justice requires restoring normal functioning, not exceeding it).
      *   **Goal:** 8-10 challenging interview questions. Avoid letting her just restate the framework.
      *   **Specific Requirements:**
          *   One question on aging/senescence (is slowing aging "enhancement" because senescence is species-typical?).
          *   One question on the Fact/Value gap (how does a statistical baseline license a normative claim of justice?).
          *   One question on the Growth Hormone (GH) case (GH deficiency vs. idiopathic short stature).
          *   For each question: Include a "Likely Answer" note and a "Follow-up" that presses further.
      *   **Tone:** Sharp, informed, podcast-ready (conversational but rigorous).

  2.  **Deconstruct the Theoretical Weak Points (Boorse/Daniels):**
      *   *The Reference Class Problem:* How do we define "species" or "age cohort"? (Leads to the aging question).
      *   *The Is/Ought Problem:* Boorse claims BST is value-free, but Daniels uses it for distributive justice. How do we get from "is" to "ought"? (Leads to the fact/value question).
      *   *The Line-Drawing Problem:* Borderline cases where the biological difference is negligible but the classification changes moral status. (Leads to the GH question).
      *   *The Technological Drift:* As tech improves, today's enhancement becomes tomorrow's therapy. Does the line move?
      *   *The Fair Equality of Opportunity (FEO) Argument:* Daniels argues health protects opportunity. But doesn't enhancement *also* protect opportunity in a competitive society?
      *   *The "Normal" is Not Always "Good":* Some species-typical traits are harmful (e.g., susceptibility to certain diseases, aging).
      *   *Resource Allocation:* If we spend everything on therapy, do we miss out on huge welfare gains from enhancement?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1: The Aging Bullet (Required).*
          *   *Draft:* Aging is normal. So curing aging is enhancement. Do you agree?
          *   *Refinement:* Make it sharper. Mention the Longevity community. Ask if she bites the bullet.
          *   *Follow-up:* If aging causes disease, why isn't preventing aging preventive medicine?

      *   *Q2: Fact/Value Gap (Required).*
          *   *Draft:* Boorse says health is statistical. Justice is moral. How do you connect them?
          *   *Refinement:* Focus on the "naturalistic fallacy" angle. Why does *statistical typicality* determine *moral entitlement*?
          *   *Follow-up:* If we evolve to be taller, does justice shift?

      *   *Q3: Growth Hormone (Required).*
          *   *Draft:* Two short kids, one gets GH, one doesn't. Why?
          *   *Refinement:* Focus on the biological mechanism vs. the social outcome. The outcome (shortness) is the same. The cause is different. Why does cause matter for justice?
          *   *Follow-up:* If the goal is opportunity, why does the *cause* of the limitation matter more than the *limitation* itself?

      *   *Q4: The Moving Baseline.*
          *   *Idea:* Technology changes what's "normal."
          *   *Draft:* If everyone uses cognitive enhancers, does it become therapy?
          *   *Refinement:* Focus on the "hedonic treadmill" of normal functioning. If enhancement becomes widespread, does it become the new baseline for justice?
          *   *Follow-up:* Does this make your theory conservative, always lagging behind tech?

      *   *Q5: Opportunity vs. Functioning.*
          *   *Idea:* Daniels uses FEO (Fair Equality of Opportunity).
          *   *Draft:* Doesn't enhancement help opportunity too?
          *   *Refinement:* In a hyper-competitive economy, isn't "normal" functioning actually a disadvantage?
          *   *Follow-up:* If justice is about opportunity, why cap it at the species average?

      *   *Q6: The "Natural" Fallacy.*
          *   *Idea:* Just because it's natural doesn't mean it's good.
          *   *Draft:* We die naturally. Is medicine wrong?
          *   *Refinement:* Focus on specific "normal" vulnerabilities. We are species-typically susceptible to malaria. Is a malaria vaccine enhancement?
          *   *Follow-up:* Where is the line between defending against a threat and improving resilience?

      *   *Q7: Resource Allocation/Tragic Choices.*
          *   *Idea:* Money spent on therapy vs. enhancement.
          *   *Draft:* Should we spend on cancer or smart pills?
          *   *Refinement:* Suppose an enhancement yields more QALYs (Quality Adjusted Life Years) than a therapy. Does your framework ignore utility?
          *   *Follow-up:* Is the therapy/enhancement distinction deontological, ignoring consequences?

      *   *Q8: Mental Health/Cognitive Enhancement.*
          *   *Idea:* Depression vs. Sadness.
          *   *Draft:* Is Ritalin therapy or enhancement?
          *   *Refinement:* Focus on the fuzzy line between treating social anxiety and giving social confidence.
          *   *Follow-up:* If the brain state is identical, why does the *label* change the moral permission?

      *   *Q9: The Conservative Bias.*
          *   *Idea:* This theory stops progress.
          *   *Draft:* Are you against transhumanism?
          *   *Refinement:* Does anchoring justice to the *status quo* of biology inherently privilege the naturally gifted?
          *   *Follow-up:* Isn't the "natural lottery" exactly what justice is supposed to mitigate?

      *   *Q10: The Exit/Practicality.*
          *   *Idea:* What should policymakers do?
          *   *Draft:* How do we use this?
          *   *Refinement:* In a world of CRISPR and neural links, is this distinction administratively viable?
          *   *Follow-up:* If it's unenforceable, is it still useful?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific topics included (Aging, Fact/Value, GH)? Yes. Likely answers and follow-ups included? Yes.
      *   Tone check: Ensure it sounds like a host who has done their homework, not an interrogator trying to humiliate, but definitely trying to pierce the armor.
      *   *Self-Correction on Q1 (Aging):* Make sure to mention the "age cohort" nuance in Boorse's theory, as the guest will likely hide behind that.
