answer: |-
  Here are 10 interview questions designed to press the Boorse/Daniels framework without being purely antagonistic. They move from the metaphysical foundations to the practical implications, ensuring you cover the three specific requirements you mentioned.

  ### 1. The Aging "Bullet" (Required)
  **Question:** "Boorse defines health as species-typical functioning relative to a reference class, usually determined by age. That means senescence—decline due to aging—is 'normal' for an 80-year-old. On your view, does that mean reversing cellular decay in an 80-year-old counts as *enhancement* rather than therapy? The longevity community is waiting to hear if you're willing to bite that bullet: that justice doesn't require us to slow aging, because aging is statistically normal."

  *   **Likely Answer:** She will likely concede that, strictly speaking, aging is not a disease on the BST account. She may argue that justice requires treating age-related *diseases* (cancer, heart failure) but not the underlying aging process itself, as that would be improving upon the species-typical baseline for that cohort.
  *   **Follow-up:** "But if aging is the primary causal mechanism for those diseases, isn't refusing to treat it like treating the symptoms of a gunshot wound while refusing to pull the bullet? If the goal of 'just health' is to protect opportunity, and aging is the biggest thief of opportunity, why does your framework protect the *process* that destroys the opportunity?"

  ### 2. The Fact/Value Gap (Required)
  **Question:** "Boorse insists his Biostatistical Theory is value-free—it's just about statistics and biological function. But Daniels uses it to ground a theory of *justice*. How do you bridge that is/ought gap? Why does the mere fact that a trait is 'statistically atypical' license the normative claim that society *owes* you a correction? Why isn't that a naturalistic fallacy?"

  *   **Likely Answer:** She will likely lean on Daniels' "Fair Equality of Opportunity" argument. She'll say the *value* comes from the moral importance of opportunity, while Boorse's theory just provides the objective metric to measure when opportunity is under threat.
  *   **Follow-up:** "But if the metric is purely statistical, then justice becomes a slave to biology. If our species evolved tomorrow to have a lifespan of 50 years, justice would only require us to maintain that? Doesn't anchoring moral entitlements to a statistical average inherently conservative, preventing us from claiming a right to a *better* baseline?"

  ### 3. The Growth Hormone Paradox (Required)
  **Question:** "Let's look at the classic Growth Hormone case. You have two children of identical height. One has a GH deficiency; the other has idiopathic short stature. You give them the exact same injection. On your view, one is receiving justly mandated therapy, the other is receiving optional enhancement. Why does the *cause* of the shortness matter more than the *disadvantage* itself?"

  *   **Likely Answer:** She will argue that the GH-deficient child has a malfunctioning subsystem, whereas the idiopathic child has a healthy system functioning at the lower end of the normal range. Justice is about fixing malfunctions, not equalizing outcomes.
  *   **Follow-up:** "But from the perspective of the child's life chances, the disadvantage is identical. If the goal of healthcare justice is to mitigate the 'natural lottery,' why does your framework respect the lottery's *mechanisms* (genetics) but not its *outcomes* (social disadvantage due to height)?"

  ### 4. The Moving Baseline
  **Question:** "Medical technology tends to turn today's enhancements into tomorrow's therapies. C-sections, antibiotics, even glasses were once considered interventions beyond the norm. If we successfully enhance a population—say, we eradicate a genetic susceptibility—doesn't that become the new 'species-typical' functioning? Does your theory force us to constantly ratchet up what justice requires?"

  *   **Likely Answer:** She will likely argue that the species-typical functioning is relatively stable over moral timeframes. She might distinguish between *treating* a pathology and *shifting* the distribution, arguing justice only cares about the former.
  *   **Follow-up:** "But with CRISPR and germline editing, we can shift the distribution instantly. If we edit out a vulnerability, is maintaining that edit 'therapy' for the next generation? If not, are you saying justice requires us to let the next generation fall back to the old, vulnerable baseline?"

  ### 5. Opportunity vs. Functioning
  **Question:** "Daniels argues health is special because it protects our 'normal opportunity range.' But in a hyper-competitive knowledge economy, 'normal' cognitive functioning might actually be a disadvantage. If everyone else is using cognitive enhancers to work faster, isn't 'normal' functioning actually a handicap? Does justice require keeping us healthy, or keeping us competitive?"

  *   **Likely Answer:** She will distinguish between *fair* opportunity and *maximized* opportunity. She'll argue justice requires a level playing field of normal functioning, not an arms race where everyone must enhance to stay neutral.
  *   **Follow-up:** "But if the baseline for 'participation' in society shifts upward due to technology, doesn't restricting people to 'normal' functioning effectively exclude them? Is your 'normal opportunity range' just a way of saying 'you have a right to be average, even if average means unemployed'?"

  ### 6. The "Natural" Vulnerability Problem
  **Question:** "Humans are species-typically susceptible to malaria. We don't have a natural defense. If I take a drug that boosts my immune system to resist malaria, am I restoring function or enhancing it? It seems like on Boorse's account, having a vulnerability is 'normal,' so fixing a vulnerability we never had could be seen as enhancement."

  *   **Likely Answer:** She will likely argue that the immune system's function is to fight pathogens, and aiding it in that specific function is therapy, even if the specific pathogen is new. She'll try to keep it within the "design function" of the organ.
  *   **Follow-up:** "Where is the line? If I aid my immune system against a virus, that's therapy. If I aid my memory against forgetting, is that therapy? Both are aiding a system against its typical failure points. Why is the immune system's 'normal' failure different from the brain's 'normal' forgetting?"

  ### 7. The Administrative Viability
  **Question:** "Practically speaking, insurance companies and health systems need clear rules. But the line between therapy and enhancement is biologically fuzzy. Mood stabilizers treat bipolar disorder but also stabilize 'normal' mood swings. Are you comfortable building a system of justice on a distinction that clinicians can't reliably draw in the exam room?"

  *   **Likely Answer:** She will admit it's fuzzy but argue that 'fuzzy' doesn't mean 'non-existent.' She'll compare it to legal standards like 'reasonable doubt'—hard to define, but we still need the concept.
  *   **Follow-up:** "In law, reasonable doubt protects the accused from the state. In healthcare, your distinction protects the *budget* from the patient. If the line is fuzzy, aren't we just giving insurers a philosophical excuse to deny coverage for anything that looks like it might make life *better* rather than just *less sick*?"

  ### 8. The Conservative Bias of "Normal"
  **Question:** "Critics argue that the therapy/enhancement distinction privileges the naturally gifted. If you're born with great memory, you keep it. If you're born with poor memory, justice only requires I bring you to the average, not to *your* potential. Doesn't this framework essentially lock in the inequalities of the natural lottery?"

  *   **Likely Answer:** She will argue that justice is about sufficiency, not equality. The goal is to ensure everyone has enough functioning to pursue their life plans, not to equalize all talents.
  *   **Follow-up:** "But if 'enough' is defined by what the species typically has, and the species typically has inequalities, aren't you codifying those inequalities? Why is the 'species average' the moral ceiling for entitlement?"

  ### 9. Mental Health and Social Norms
  **Question:** "Boorse tries to keep health value-free, but mental health is deeply tied to social norms. Social Anxiety Disorder, for example. Is that a dysfunction of a 'social interaction module,' or is it a mismatch between a shy temperament and a demanding society? If it's the latter, isn't medicating it just chemical conformity?"

  *   **Likely Answer:** She will likely try to ground it in biological dysfunction (e.g., amygdala regulation) to keep it value-free. She'll argue that if the mechanism is broken, it's therapy, regardless of the social context.
  *   **Follow-up:** "But if the 'break' is only identifiable because the person can't hold a job in a modern economy, haven't we smuggled social values back into the biological definition? Are we treating a disease, or are we treating a worker to fit a market?"

  ### 10. The "Better than Well" Scenario
  **Question:** "Let's imagine a world where enhancement is cheap and safe. We can prevent depression *and* increase resilience beyond the species norm. If we have the resources to do both, does your framework still forbid the enhancement? If justice is about human welfare, why does the 'therapy' label matter more than the 'welfare' outcome?"

  *   **Likely Answer:** She will likely fall back on the "priority view"—we must help the worst off (the sick) before we help the better off (the healthy). Enhancing the healthy is a lower priority than curing the sick.
  *   **Follow-up:** "But if the 'enhancement' prevents the sickness from ever happening, or yields a greater net reduction in suffering than the therapy, doesn't a strict priority for therapy actually *increase* total suffering? Is your commitment to the distinction deontological, even if it costs us in human well-being?"
