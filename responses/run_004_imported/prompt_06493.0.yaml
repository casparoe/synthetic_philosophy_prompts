prompt: |-
  Quick one for you -- every year in my rationality and cooperation seminar the students write short programs that play a single round of Prisoner's Dilemma against each other, and every year its boring because they all just defect, exactly like the textbook says they should. This year I want to let them see each other's source code before submitting, since that's supposedly the whole point of program equilibrium -- Tennenholtz's original result, plus the later Löbian tricks (FairBot and its descendants) that get you provable mutual cooperation instead of just "cooperate iff identical code." I know the theory fine on paper but I've never watched it survive contact with 30 undergrads, a deadline, and buggy proof-search code. Can you give me the most important implications of the program equilibrium literature for how I should design and grade this assignment, and what's most likely to break once real, finite, not-especially-careful code is doing the "proving" instead of an idealized agent?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Request:**
      *   **User:** Instructor of a "rationality and cooperation seminar." Likely familiar with game theory, logic, and AI safety concepts (mentions Tennenholtz, Löbian cooperation, FairBot).
      *   **Task:** Designing a programming assignment where students write Prisoner's Dilemma (PD) bots that can read each other's source code (Program Equilibrium/Modal Logic setting).
      *   **Problem:** Standard PD assignments result in universal defection (Nash Equilibrium). The instructor wants to enable cooperation via source code inspection (superrationality/program equilibrium).
      *   **Constraints:** 30 undergraduates, deadline pressure, buggy code, finite resources (not idealized provers).
      *   **Goal:** Provide implications for design/grading and predict failure modes in real-world implementation of Löbian cooperation.

  2.  **Deconstruct the Theoretical Background:**
      *   **Tennenholtz (2004):** Program Equilibrium. Agents submit programs, programs read opponent's code. If programs are identical, cooperate. (Simple, fragile).
      *   **Löbian Cooperation (Barasz et al., 2014 / Critch, etc.):** Using provability logic (GL). FairBot: "Cooperate if I can prove you cooperate." Mutual cooperation is a fixed point.
      *   **Practical Constraints:** Real computers aren't oracle provers. Proof search is expensive (EXPTIME or worse). Infinite recursion is a risk (stack overflow). Time limits exist. Obfuscation is possible.

  3.  **Brainstorming Failure Modes (The "Contact with Reality" part):**
      *   *Infinite Recursion:* Bot A checks Bot B, Bot B checks Bot A. Stack overflow before a move is made.
      *   *Timeout:* Proof search takes too long. The tournament runner kills the process. Defection by timeout is usually the default.
      *   *Quining/Self-Reference:* How does a bot read its own code? How does it read the opponent's? The environment needs to support this safely.
      *   *Obfuscation:* Students might write code that looks like FairBot but hides a defection, or code that crashes the opponent's parser.
      *   *False Positives/Negatives:* A bounded prover might fail to find a proof that exists (timeout) or find a "proof" due to a bug in the verifier.
      *   *The "Cliq" Problem:* Students collude out-of-band to submit identical code that cooperates only with itself, defecting on others.
      *   *Language/Environment:* Python `eval` is dangerous. Sandboxing is crucial.

  4.  **Developing Design Recommendations:**
      *   *Language:* Needs to be safe and introspective. Python is easy but dangerous. A restricted DSL or a safe subset is better. Let's suggest Python with strict sandboxing or a specific framework provided by the instructor.
      *   *The "Prover":* Don't make students write a theorem prover. That's too hard. Provide a library function `prove(opponent_code, statement, timeout)`.
      *   *Recursion Limit:* Enforce a strict depth limit or time limit on the `move()` function.
      *   *Default Action:* If a bot crashes or times out, what happens? Defect is standard, but maybe disqualify to discourage buggy code.
      *   *Grading:* Don't just grade on score. Grade on elegance, safety, and whether they achieved cooperation with *some* partners.

  5.  **Developing Grading/Incentive Recommendations:**
      *   If the goal is cooperation, a tournament ranking encourages arms races (better exploiters).
      *   Suggest a "Cooperation Score" (how often did you mutual cooperate?).
      *   Suggest a "Robustness Score" (did you crash?).
      *   Suggest a "Safety Score" (did you try to break the sandbox?).

  6.  **Synthesizing the "Löbian in Practice" Warnings:**
      *   *Bounded Proof:* Real provers are bounded. FairBot needs `Prove(C)` within $N$ steps. If opponent uses $N+1$ steps, you defect. This leads to "Proof Height" arms races.
      *   *Parametric FairBot:* Better to use `Prv(opp_cooperates, k)` where $k$ is a resource bound passed as argument.
      *   *The "Simulator" Trap:* Students might try to *simulate* the opponent rather than prove things about them. This leads to infinite loops immediately. Must forbid simulation/execution of opponent code. Only static analysis or provided `prove` calls allowed.

  7.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Professional, academic, slightly cautious but encouraging. Acknowledge the instructor's expertise.
      *   *Structure:*
          1.  The Core Tension (Theory vs. Reality).
          2.  Environment Design (Sandboxing, Introspection).
          3.  The Prover Problem (Boundedness, Timeouts).
          4.  Recursion & Infinite Loops.
          5.  Grading & Incentives.
          6.  Specific "Gotchas" (Obfuscation, Collusion).
      *   *Key Insight:* The biggest breakage point isn't the logic, it's the *resource bounds*. Löbian cooperation relies on consistent proof systems. Bounded proof systems break the fixed point unless carefully parameterized (e.g., PrudentBot or parametric FairBot).

  8.  **Refining the "Bounded Prover" point:**
      *   Standard FairBot: `if Prove(opponent_cooperates): Cooperate`.
      *   Problem: If A uses ZFC and B uses PA, or if A has timeout 1s and B has timeout 2s.
      *   Solution: Use a specific, provided proof engine with a step limit. Or, simpler for undergrads: "Source Code Matching + Simple Heuristics" is often what actually works in tournaments like this, but the user specifically asked for Löbian tricks. I need to address how to make Löbian work practically.
      *   *Correction:* Actually, for undergrads, implementing a theorem prover is too hard. They should use a *provided* oracle that simulates bounded provability. Or, the assignment should be about *designing* the strategy within a provided framework that exposes `get_opponent_source()` and a `verify_proof()` function.
      *   *Better approach:* Provide a library `logic.py` that has `can_prove(statement, steps)`. This abstracts away the Godel numbering nightmare.

  9.  **Final Polish:**
      *   Make sure to mention security. `eval()` on student code is a recipe for disaster.
      *   Emphasize that "Cooperate iff Identical" is the baseline that *will* happen, and Löbian is the stretch goal.
      *   Highlight the "Time Limit as a Parameter" issue.

  10. (Self-Correction during drafting): I initially thought about suggesting they write provers. No, that's a semester-long project on its own. The assignment should be about the *strategy* using a provided logical interface. I need to make sure the instructor knows that without a provided proof oracle, this is impossible for undergrads in a short timeframe.

  11. *Final check on the "Löbian" claim:* True Löbian cooperation requires a consistent proof system. In a tournament with time limits, `Prove(X)` returning `False` because of timeout breaks the logic. I need to emphasize *Parametric FairBot* or *Modal Contract* approaches which are more robust to bounds.

  12. *Structure the advice:*
      *   Infrastructure (Security/IO).
      *   The Logic (Boundedness/Recursion).
      *   The Meta-Game (Collusion/Obfuscation).
      *   Grading (Aligning incentives).

  13. *Wait, one more thing:* The "Source Code" aspect. In Python, getting source code is easy (`inspect.getsource`). But ensuring it hasn't been tampered with (e.g., dynamic modification) is hard. The tournament runner should hold the canonical source.

  14. *Okay, ready to write.* Focus on the gap between "Idealized Agent" and "Python Script with a 5s timeout."

  **(Self-Correction Note):** I need to be careful not to sound like I'm discouraging the assignment. It's a great assignment. Just needs guardrails.

  **(Key Technical Point):** The biggest theoretical breakage is that bounded provability is not closed under logical implication in the way GL requires. If `Prove(P, N)` is true, `Prove(Q, N)` might not be even if `P->Q`. This breaks the Löb condition. I must mention this. The "Proof Height" arms race is the practical manifestation of this.

  Let's organize the response into: 1. Infrastructure & Security, 2. The Logic & Boundedness, 3. Recursion & Halting, 4. Grading & Incentives.

  (End of thought process)xp
answer: |-
  This is a fantastic assignment idea, but you have correctly identified the minefield. The gap between **Modal Fixed Points** (idealized, unbounded, consistent logic) and **Python Scripts** (bounded, crash-prone, side-channel-happy) is where this assignment will live or die.

  If you run this naively, you will not get Löbian cooperation. You will get a tournament of bots that timeout, stack overflow, or defect because their proof search hit a step limit 1ms before finding the proof.

  Here are the critical implications of the literature for designing this assignment, ranked by likelihood of catastrophic failure.

  ### 1. The Bounded Prover Problem (Theoretical Breakage)
  **The Theory:** FairBot cooperates if `□(Opponent Cooperates)`. In Provability Logic (GL), if both agents use the same system, `□(A Cooperates) ↔ □(B Cooperates)` creates a fixed point leading to mutual cooperation.
  **The Reality:** Real proof search is bounded by time or steps. `Prove(P, N)` is not a normal modal operator. It is not closed under implication. If Agent A allows 1000 proof steps and Agent B allows 1001, the fixed point breaks. Agent A cannot prove B cooperates (because B's proof requires resources A doesn't simulate), so A defects.
  **The Fix:**
  *   **Do not let students write their own provers.** They will write buggy regex matchers or infinite loop simulators.
  *   **Provide a `logic` library.** Give them a function like `can_prove(statement, max_steps)`.
  *   **Enforce Parametric FairBot:** The robust solution in bounded settings (like *PrudentBot* or *Parametric FairBot*) is to pass the resource bound as a parameter. The bot should cooperate if `can_prove(Opponent.Cooperate(k), k)` for some $k$.
  *   **Implication:** If you don't provide a shared, deterministic proof oracle, you will not see logical cooperation. You will see "I tried to simulate you and timed out" defection.

  ### 2. The Recursion/Stack Overflow Trap
  **The Theory:** Agents reason about each other.
  **The Reality:** Agent A calls `analyze(B)`. Agent B's code, when analyzed, calls `analyze(A)`.
  *   If your environment allows **execution** of opponent code for simulation: Instant infinite recursion.
  *   If your environment allows **static analysis** that triggers analysis: Instant infinite recursion.
  **The Fix:**
  *   **No Execution:** Students must *not* be allowed to `exec()` or `eval()` the opponent's source string. This is also a security necessity.
  *   **The "Read-Only" Contract:** The opponent's code is provided as a string or an AST.
  *   **Depth Limits:** Your tournament runner must enforce a strict recursion depth limit on the `move()` function. If the stack depth exceeds $N$, the bot auto-defects (or is disqualified).
  *   **Implication:** Warn students explicitly: "If your code tries to run the opponent's code, you will get a StackOverflowError and an F."

  ### 3. Security and Sandboxing (The "Undergrad" Factor)
  **The Theory:** Agents are pure functions.
  **The Reality:** 30 undergraduates will try to:
  *   Delete the tournament directory.
  *   `import os; os.system('rm -rf /')`.
  *   Read the opponent's move from a global variable before it's officially submitted.
  *   Name their file `opponent.py` to confuse the importer.
  **The Fix:**
  *   **Docker/VM:** Run every match in a fresh, ephemeral container.
  *   **Restricted Imports:** Provide a whitelist of allowed imports (e.g., `re`, `ast`, `logic`). Block `os`, `sys`, `subprocess`, `socket`.
  *   **Canonical Source:** The tournament runner should hold the canonical source code. When Bot A asks for Bot B's source, the *runner* injects the string. Bot A should not be reading files from the disk.
  *   **Implication:** Spend 50% of your prep time on the sandbox. If one student crashes the tournament server, the assignment is ruined.

  ### 4. Obfuscation and "Fake" Cooperation
  **The Theory:** Code is transparent.
  **The Reality:** Students will write code that *looks* like FairBot to a simple parser but defects against specific targets.
  *   *Example:* `if "defect_bot_42" in opponent_source: return DEFECT else: return FairBot_Logic`.
  *   *Example:* Writing code that takes 10 seconds to run, causing the opponent to timeout and defect, then claiming "I would have cooperated."
  **The Fix:**
  *   **Time Limits:** Strict wall-clock time per move (e.g., 2 seconds). Timeout = Defect.
  *   **Grading Criteria:** Do not grade solely on tournament score (which rewards exploitation). Grade on:
      1.  **Cooperation Rate:** How often did you achieve (C, C)?
      2.  **Robustness:** Did you crash or timeout?
      3.  **Code Review:** Manually inspect the top 5 bots for "cheating" logic (hardcoded defections against specific classmate names).
  *   **Implication:** Make "Clean Cooperation" a specific grading category. If they exploit a bug in the prover to force a defection, they lose points on "Sportsmanship/Logic."

  ### 5. The "Identical Code" Baseline
  **The Theory:** Tennenholtz's result relies on program equilibrium.
  **The Reality:** The easiest way to get (C, C) is `if my_source == opp_source: Cooperate else: Defect`.
  *   This is fragile (whitespace changes break it) and boring.
  *   However, it is the Nash Equilibrium of the *program* game.
  **The Fix:**
  *   **Normalize Code:** Before comparison, strip whitespace and comments from the source string.
  *   **Encourage Generalization:** Offer bonus points for bots that cooperate with *non-identical* bots (i.e., actual Löbian cooperation or clustering). If the winner is just the "Identical Code" bot, the lesson is lost.
  *   **Implication:** You need a "Challenge Set" of instructor-written bots (a Cooperator, a Defector, a FairBot, a RandomBot). Grade them on performance against *your* set, not just each other. This prevents a clique of students from submitting identical cooperating bots to rig the leaderboard.

  ### Summary of Design Recommendations

  1.  **Language:** Python is fine, but **disable `eval`/`exec`**. Provide the opponent's code as a read-only string variable `OPPONENT_SOURCE`.
  2.  **Logic Oracle:** Provide a module `modal_logic.py` with `prove(statement, steps)`. Do not let them implement the prover. This ensures the "proof system" is consistent across all agents.
  3.  **Timeouts:** Hard limit on execution time (e.g., 2s). Timeout counts as Defect.
  4.  **Grading Rubric:**
      *   40% Tournament Score (Standard PD payoff).
      *   30% Cooperation Rate (Against a standard set of instructor bots).
      *   30% Code Quality/Safety (No forbidden imports, handles exceptions).
  5.  **The "Löb" Warning:** Explicitly tell them: *"Standard FairBot fails under time bounds. Look up 'Parametric FairBot' or 'Bounded Löbian Cooperation'."* If you don't give them this hint, they will implement unbounded recursion and crash.

  ### What Will Break (Predictions)
  *   **The Fixed Point:** Most students will implement `if prove(opp_cooperates): C`. Because of step limits, `prove` will return `False` for valid theorems that are "too deep." Result: Mutual Defection between two "FairBots" with different step limits.
      *   *Mitigation:* Suggest they use a "Graceful Degradation" strategy: `if prove(opp_cooperates, k): C elif k > 0: return FairBot(k-1) else: D`.
  *   **The Parser:** Students will try to parse the opponent's AST. They will fail to handle imports or indentation.
      *   *Mitigation:* Keep the AST simple or discourage AST parsing in favor of the provided `prove` oracle.
  *   **The Collusion:** Three friends submit identical code that cooperates with each other and defects on everyone else.
      *   *Mitigation:* The "Instructor Challenge Set" grading component neutralizes this. They must cooperate with *your* FairBot, not just their friends'.

  If you solve the **Bounded Prover** and **Sandboxing** issues, this assignment can be magical. If you leave those open, it will be a debugging nightmare that ends in universal defection via timeout.
