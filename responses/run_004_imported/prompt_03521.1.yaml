answer: |-
  You have hit on one of the most famous and difficult sequences in the *Pensées*. Your intuition is excellent: if you read that first fragment literally as written in your edition, it *does* seem backwards. That is because your intuition is correct about the logic, even if the translation you are holding is obscuring it.

  Here is a walkthrough of the logic connecting these two fragments, the translation issue tripping you up, and how Pascal's theology saves him from being a simple cynic.

  ### 1. Decoding Fragment 1: What is "It"?

  **The Text:** *"Veri juris.—We have it no more; if we had it, we should take conformity to the customs of a country as the rule of justice."*

  **The Confusion:** You asked: *"If you actually had real justice why would you need custom as a stand in at all?"*

  **The Explanation:**
  You are right to feel that this is backwards. In the original French (and in most scholarly translations, like the Levi or Finch editions), there is a crucial negative particle that seems to be missing or muddled in the Trotter text you are reading.

  The logic is actually: **"We do not possess True Justice anymore. If we *did* possess it, we would *not* need to rely on the arbitrary customs of a country as the rule of justice."**

  *   **"It" refers to:** *Veri juris* (True Justice). This is objective, universal, divine justice. It is the "law of nature" or God's law that exists independently of human opinion.
  *   **The Argument:** Pascal is observing that what we call "justice" changes depending on where you are. As he famously writes in another fragment: *"Justice on this side of the Pyrenees is injustice on the other."* If True Justice existed in human hands, it would be universal (true everywhere). Since it varies by custom, we prove that we *don't* actually have True Justice.
  *   **Why Custom?** Because we lost "It" (True Justice), we need a proxy to keep society from collapsing. We use **Custom** (tradition, local law) not because it is *true*, but because it is *stable*.

  So, your headache comes from a translation quirk. Pascal is agreeing with you: Custom is a sad substitute for True Justice, necessitated only because we have lost access to the real thing.

  ### 2. Fragment 2: Cynicism or Skepticism?

  **The Text:** *"Justice is subject to dispute; might is easily recognised... being unable to make what is just strong, we have made what is strong just."*

  **The Question:** *Is Pascal saying justice is fake (might makes right), or that we just can't access it?*

  **The Answer:** This is the core of Pascal's political philosophy. He is **not** arguing for "Might Makes Right" as a moral truth. He is arguing for it as a **tragic necessity.**

  Here is the logical chain he builds:

  1.  **The Ideal:** Justice *ought* to rule. ("It is right that what is just should be obeyed.")
  2.  **The Problem:** Justice is abstract. People argue endlessly about what is "just." It is "subject to dispute." You cannot force people to agree on justice by arguing.
  3.  **The Reality:** Might (force/power) is concrete. You know when a gun is pointed at you. It is "easily recognised and is not disputed."
  4.  **The Dilemma:**
      *   Justice without Might = Helpless (Good ideas get crushed by bad actors).
      *   Might without Justice = Tyrannical (Brute force is immoral).
  5.  **The Compromise:** Since we cannot make Justice powerful enough to enforce itself, we must make Power look like Justice so that people will obey it willingly.

  **Is he a cynic?**
  No. A cynic would say, "Justice is an illusion; only power matters."
  Pascal says, "Justice is real, but we are too broken to wield it. So we use power to keep the peace, while pretending power is justice."

  He is mourning the loss of True Justice, not celebrating the reign of Force. When he says, *"we have made what is strong just,"* he is describing a collective human lie we tell ourselves to prevent constant civil war. We legitimize the King not because he is morally perfect, but because he is strong, and we need order.

  ### 3. The Theological Key: "We Have It No More"

  This is where your question about his religion becomes the master key. You cannot fully understand these fragments without the doctrine of **The Fall (Original Sin).**

  For Pascal, human history is divided into two states:
  1.  **Pre-Fall (Eden):** Humans had access to *Veri juris* (True Justice). We knew God's law directly. Reason and Will were aligned.
  2.  **Post-Fall (Current State):** Human nature is corrupted. Our reason is clouded by passion, self-interest, and sin.

  **Reading "We have it no more" Theologically:**
  When Pascal says "We have it no more," he is making a theological claim. We lost True Justice when Adam fell. We are now spiritually blind.

  *   **Why this matters:** If Pascal were a secular skeptic, he might say "True Justice never existed." But because he is a Christian, he asserts "True Justice *exists* (in God), but *we* no longer possess it."
  *   **The Political Consequence:** Because we are fallen, we cannot agree on moral truths. Therefore, secular politics cannot be based on True Justice. It must be based on **Order.**
  *   **The Role of Might:** God allows Might to rule in the secular sphere to restrain human sinfulness. It is a "bridle" on our wickedness. It is not *good*, but it is better than anarchy.

  ### 4. Connecting the Two Fragments

  Here is how the logic flows from 297 to 298:

  *   **Fragment 1 (The Diagnosis):** We have lost access to Objective/Divine Justice ("We have it no more"). Because we lack this universal standard, we accidentally mistake local **Custom** for Justice. We think our local laws are "right" just because they are ours.
  *   **Fragment 2 (The Treatment):** Since we can't agree on what is Right (because we lost it in Frag 1), we have to rely on **Might**. We know Might isn't truly Just, but we "combine" them by declaring the Powerful to be the Just. This is a pragmatic workaround for a fallen world.

  ### Summary

  Pascal is not telling you that Justice is fake. He is telling you that **human beings are currently incapable of agreeing on Justice.**

  *   **"It"** is Divine/Universal Justice, which we lost due to sin.
  *   **Custom** is the placeholder we use because we can't find the real thing.
  *   **Might** is the enforcer we use because Custom is too weak to stop offenders.
  *   **The "Lie":** We call Might "Justice" not because we believe it, but because we need society to function while we wait for a salvation that can restore True Justice.

  You are reading these fragments correctly by sensing the tension. Pascal wants you to feel that tension. He wants you to realize that secular politics is a messy, compromised workaround, so that you might eventually look toward faith for the "True Justice" we have lost.
