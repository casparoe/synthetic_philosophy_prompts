answer: |-
  Good morning. Thank you all for being here. For those who don't know me, I am her grandchild.

  We are here to honor a woman who loved truth more than comfort. That sounds like a cold thing, perhaps, for a eulogy. Usually, we seek comfort above all else in moments like this. But my grandmother believed that there is a deeper kindness in being clear-eyed about the world, and in being honest with the people we love. She believed that pretending to know things we cannot know is not a comfort, but a slight against the intelligence of the listener.

  So, I am going to try to speak about her exactly as she asked to be spoken of: without false certainty, but with deep affection.

  To her family, she was simply Grandma. She was the one who asked you how you knew what you knew. She was the one who listened to your stories with her full attention, not because she was waiting to correct you, but because she genuinely wanted to map the territory of your experience.

  To her friends in the philosophy reading group, she was a formidable intellect. She built her career on logical positivism. In plain English, that means she cared deeply about the difference between what can be verified and what is merely noise. She admired the philosopher A.J. Ayer, not just as a thinker, but as a model of integrity.

  Six years ago, Grandma had a cardiac arrest. She was without a pulse for several minutes. When she came back, she told us something remarkable. She said the experience matched almost exactly the one Ayer described in his famous essay, "What I Saw When I Was Dead."

  Now, for many people, a near-death experience leads to a religious conversion. It leads to a declaration of angels, or gates, or a promise that we will all meet again in a better place.

  But this was Grandma. She did not deal in declarations.

  After she recovered, she sat us down. She told us that her confidence that death is a "full stop"—a final end—had softened. Just by a specific, small amount. She told us that she still did not believe in God. She still did not expect to survive her own death in any personal sense. She still said she would prefer the full stop. But she admitted that the evidence of her own consciousness during those minutes had forced her to adjust her odds.

  She called it "an update, not a conversion."

  I know that for some of you, that distinction might seem small. But for her, it was everything. It was the difference between surrendering to a story because it feels nice, and adjusting a belief because the data demanded it. I have spent a lot of time on internet forums where people argue about belief and evidence, and I can tell you: my grandmother lived the platonic ideal of updating a credence in proportion to the evidence. She was willing to change her mind, but only as much as the evidence warranted. No more, no less.

  She left instructions for this day based on that same integrity. She asked that I not tell you she is "watching over us now." She didn't believe that was true, and she would have found it insulting to suggest she suddenly believed it on her deathbed.

  But she also asked that I not tell you she died certain that this was the end. Because, by her own account, she wasn't certain. She had updated.

  So, where does that leave us? Where is the comfort?

  The comfort she offered was not in the promise of a future reunion. It was in the reality of the past and the present. She taught us that love does not require an afterlife to be real. The love she had for us was verified by her actions, by her time, by her attention. That love happened. It is a fact. It does not need to continue forever to have mattered.

  She found meaning in the clarity of the moment. When she looked at you, she was not thinking about where you would go when you died. She was thinking about who you were while you were here.

  To her philosophy friends: She remained, to the end, a verificationist who acknowledged the limits of her own verification. She walked the needle's thread she always admired in Ayer.

  To her family: She loved you without conditions, and without metaphors. She did not need to believe she would see you again in a heaven to cherish the time she had with you on earth. In fact, because she believed this life was likely the only one we get, she treated every conversation, every holiday, and every quiet afternoon as precious.

  She was not afraid of the full stop. But she was deeply committed to the sentence that came before it. And what a sentence it was.

  We will not feel her presence in the room today. She would not want us to pretend we do. But we can feel the impact of her mind, and the warmth of her honesty. We can honor her by being as clear as we can be, by being as kind as we can be, and by admitting when we don't know the answer.

  She updated her credence. Now, we must update ours. We must accept that she is gone, while holding fast to the truth of who she was.

  Thank you.
