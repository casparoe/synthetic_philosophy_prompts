      *   *Conclusion:* Tononi's refusal to patch the theory to match intuition is a sign of theoretical consistency, not unfalsifiability.

  3.  **Key IIT Concepts to Integrate:**
      *   **Axioms vs. Postulates:** Axioms are self-evident truths of experience (phenomenology). Postulates are the physical requirements to generate that experience.
      *   **Intrinsic Existence:** Consciousness exists for itself, not for an observer.
      *   **Composition:** Structures are made of parts, but the whole must exist over and above the parts.
      *   **Integration:** Information must be irreducible.
      *   **Exclusion:** Only the maximum of irreducible information counts (no overlapping consciousness).
      *   **The "Grid" Critique:** Why does a grid have high $\Phi$? Because of dense interconnectivity and irreducibility.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the friend's position (it's the standard critique) but frame the user's defense as a commitment to *deductive rigor* over *phenomenological prejudice*.
      *   **The Axiomatic Method:** Explain *why* IIT starts where it does. It's not trying to match our intuition about *brains*; it's trying to match the axioms of *experience*. If a system satisfies the postulates derived from axioms, it must have experience. This is the core of the "principled" defense.
      *   **Addressing Aaronson's Grid (The "Principled" vs. "Ad Hoc" distinction):**
          *   *Ad Hoc:* Changing the math to make $\Phi$ low for grids because "we feel grids aren't conscious."
          *   *Principled:* Keeping the math because the grid *does* satisfy the postulates (intrinsically, causally, irreducibly).
          *   *Key Point:* IIT claims consciousness is intrinsic. Our intuition is extrinsic (we look at the grid from the outside). The clash is between the *view from nowhere* (IIT) and the *view from here* (human bias).
      *   **The Relativity/QM Analogy:** This needs careful handling. It's easy to overuse.
          *   *Relativity:* Abandoned absolute simultaneity. Why? Because the math of electromagnetism + principle of relativity demanded it.
          *   *QM:* Abandoned local realism. Why? Because Bell's inequalities + experiments demanded it.
          *   *IIT:* Abandoned "biological substrate necessity" or "complex behavior necessity." Why? Because the axioms of phenomenology + causal power analysis demand it.
          *   *Crucial Nuance:* In Relativity/QM, there was empirical verification (eclipses, Bell tests). In IIT, there isn't (yet). *However*, the argument is about *internal theoretical consistency*. If IIT is a deductive theory, consistency trumps intuition.
      *   **Falsifiability vs. Intuition-Matching:**
          *   The friend claims it's unfalsifiable.
          *   Counter: It *is* falsifiable, just not by intuition. It's falsifiable by finding a system that meets the postulates but by all other accounts (report, behavior) is clearly not conscious, *or* vice versa.
          *   Better argument: A theory that changes its predictions to match pre-theoretical intuition is the one that is unfalsifiable (because intuition is the shield). A theory that sticks to its guns allows itself to be proven wrong by the logic of its own structure.
