      *   **Context:** The user and a friend (a PhD in computational neuroscience) argued about Integrated Information Theory (IIT) on a train.
      *   **Core Dispute:** The friend argues IIT is unfalsifiable/vacuous because it "bites the bullet" on Scott Aaronson's critique (that simple logic grids have high $\Phi$). The user defends Tononi, arguing that overriding intuition is a hallmark of good science (like relativity/QM), provided the theory's axioms entail the verdict.
      *   **Task:** Make the *strongest possible case* for the user's side (defending Tononi's bullet-biting as intellectually legitimate).
