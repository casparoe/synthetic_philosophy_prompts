      *   *Risk:* The Relativity analogy might break down because Relativity had external empirical checks. I need to acknowledge that IIT lacks the "eclipse" moment, but argue that *internal coherence* is a prerequisite for external testing.
      *   *Refinement:* Focus on the definition of "scientific theory." Is a theory that matches intuition better than one that matches axioms? In consciousness, intuition is the *data* (phenomenology), but our intuitions about *other systems* are not data, they are theories.

