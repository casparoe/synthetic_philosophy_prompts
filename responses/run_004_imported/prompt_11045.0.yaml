      *   *Popper's Verisimilitude:* Karl Popper introduced this in the 1960s (Conjectures and Refutations). He wanted to save scientific realism from the problem of induction. Science progresses not by proving theories true, but by getting *closer* to the truth.
      *   *The Definition:* A theory $A$ is more truthlike than $B$ if $A$ has more true consequences and no more false consequences (or more true and fewer false, etc.).
      *   *The Collapse:* In 1974, David Miller and Pavel Tichý independently proved that Popper's definition fails.
      *   *The Result:* If both theories are false, Popper's definition implies you *cannot* say one is closer to the truth than the other. In fact, under certain interpretations, it leads to absurdities (like a theory with *more* false consequences being deemed "closer").
      *   *Why?* It has to do with the logical structure of consequences. If a theory is false, it entails some falsehoods. But it also entails truths. The interaction between true and false content in a false theory creates a logical paradox under Popper's specific set-theoretic formulation.

  3.  **Drafting the Explanation - Step-by-Step:**

      *   **Step 1: Validate the Friend's Claim.** Start by confirming the friend is right. This builds trust. Popper *did* try, and it *did* fail spectacularly.
      *   **Step 2: Explain Popper's Intuition (The Goal).** What was he trying to do? He wanted to say Science progresses. Newton is better than Aristotle, even if Newton isn't "The Truth." He used "content." More truth content, less falsity content = closer to truth.
      *   **Step 3: The Mechanism (Intuitive Logic).** How did he measure this? By looking at the set of all statements a theory implies (consequences).
          *   True Theory: All consequences are true.
          *   False Theory: Some consequences are true, some are false.
          *   Popper's Rule: Theory A > Theory B if A has more true consequences and not more false ones.
      *   **Step 4: The Collapse (The "Why").** This is the tricky part to explain without notation.
          *   *The Key Insight:* Logical consequences aren't independent. If you have a false statement, you can combine it with a true statement to make new statements.
          *   *The Miller/Tichý Proof (Simplified):* If a theory is false, it implies *some* falsehood ($F$). It also implies *some* truth ($T$).
          *   *The Trick:* You can logically combine $F$ and $T$ to create *new* consequences.
          *   *The Kicker:* If you add more false content to a theory, you actually *increase* the number of true consequences too (because $False \land True \to False$, but $False \lor True \to True$).
          *   *Result:* It turns out that for any two false theories, the one with *more* false content often ends up having *more* true content as well, messing up the comparison. Actually, the stronger result is: **No two false theories can be compared.** One cannot be strictly closer than the other under Popper's rules.
      *   **Step 5: An Analogy.** Use the "Target" analogy.
          *   Truth is the bullseye.
          *   Popper treated theories like bags of marbles (consequences).
          *   He wanted the bag with more green marbles (true) and fewer red marbles (false).
          *   The problem: In logic, adding a red marble magically turns some existing marbles green, or makes the count of green marbles dependent on the red ones in a way that breaks the scoring.
          *   *Better Analogy:* The "Map" analogy. If a map has a mistake (False), does adding more details make it better or worse? Popper's math says if the map is wrong, you can't say a more detailed wrong map is closer than a less detailed wrong map.
      *   **Step 6: Why is it hard to fix?**
