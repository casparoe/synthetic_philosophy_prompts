answer: |-
  Your friend is absolutely right, and your intuition is also right. This is one of the most famous embarrassments in the philosophy of science.

  Here is the situation: **Intuitively**, we all agree Newtonian mechanics is "closer to the truth" than the Four Elements theory. **Formally**, Karl Popper tried to prove this mathematically in the 1960s, and in 1974, two logicians (David Miller and Pavel Tichý) independently proved that Popper's definition makes that comparison **logically impossible**.

  It wasn't a calculation error; it was a structural collapse. Here is why it happened, why it's so total, and why it's so hard to fix.

  ### 1. Popper's Goal: Progress Without Certainty
  Popper was a "falsificationist." He believed we can never prove a theory is True (capital T). We can only prove theories are False.

  But if we can never know what's True, how do we say science is *progressing*? How do we say Einstein is an improvement on Newton? Popper wanted a metric for **Verisimilitude** (truth-likeness). He wanted to say: "Even if Theory A and Theory B are both technically false, Theory A is *closer* to the truth."

  ### 2. Popper's Definition: The Two Buckets
  To define "closeness," Popper looked at the **logical consequences** of a theory. Every theory implies a vast set of statements.
  *   *Example:* Newton's gravity implies "apples fall," but it also implies "planets orbit in ellipses."

  Popper divided these consequences into two buckets:
  1.  **Truth Content:** The set of all true statements the theory implies.
  2.  **Falsity Content:** The set of all false statements the theory implies.

  **Popper's Rule:** Theory A is closer to the truth than Theory B if:
  *   A has **more** truth content than B, AND
  *   A has **no more** falsity content than B.
  *(Or, A has equal truth content and less falsity content.)*

  This sounds reasonable. You want the theory that gets more things right without getting more things wrong.

  ### 3. The Collapse: Why False-vs-False Breaks It
  The breakdown happens because of how logic works. In classical logic, **Truth Content and Falsity Content are not independent.** You cannot change one without automatically changing the other.

  Here is the intuitive breakdown of the Miller/Tichý proof:

  Imagine Theory A is false. That means it has at least one false consequence (let's call it *False-1*).
  Imagine Theory B is also false.

  Popper wants to compare them. He wants to see if A has "more truth" and "less falsity" than B.

  **The Trap:**
  If you have a false statement, you can combine it with true statements to generate *new* statements.
  *   Let $T$ be a true statement.
  *   Let $F$ be a false statement (implied by your false theory).

  In logic, if you say "$T$ **or** $F$", the result is **True** (because $T$ is true).
  If you say "$T$ **and** $F$", the result is **False**.

  Here is the killer: **If you increase the Falsity Content of a theory, you automatically increase its Truth Content.**

  Why? Because every new false consequence you add can be combined with existing true consequences to create *new* true consequences (using the "OR" operator).

  **The Result:**
  Miller and Tichý showed that under Popper's specific definitions, **it is mathematically impossible for one false theory to have more verisimilitude than another false theory.**

  The logic works out such that if Theory A is "closer to the truth" than Theory B, **Theory A must be True.** Since we are comparing two *false* theories (Newton vs. Four Elements), the definition yields a null result. It's like trying to divide by zero. The definition simply refuses to rank two false theories.

  ### 4. Why is the Breakdown "Total"?
  You asked if this is a minor bug. It's not. It's total because it strikes at the heart of how we count "information."

  Popper treated "content" like marbles in a bag. He thought you could just count the green marbles (truths) and red marbles (falsehoods).
  But logical consequences aren't marbles; they are a web. If you pull on a red thread (add a falsehood), the whole web shifts, turning some red threads green and some green threads red.

  Because the "Truth Content" and "Falsity Content" are inextricably linked, you can't optimize one without affecting the other. Popper's definition required them to be separable to work. Since they aren't, the definition collapses for any theory that isn't perfectly true.

  ### 5. Why Hasn't It Been Fixed?
  Philosophers have spent the last 50 years trying to fix this, and while there are better models now, there is no "clean" fix that satisfies everyone. Here is why:

  **1. The "Distance" Problem:**
  To fix Popper, you have to stop counting *consequences* and start measuring *distance*.
  Think of the "Truth" as a specific location on a map (the actual world). A theory describes a different location (a possible world).
  *   Four Elements Theory = A map pointing to a location 1,000 miles away.
  *   Newtonian Mechanics = A map pointing to a location 10 miles away.

  This seems easy, right? Just measure the miles. But in logic, what is a "mile"? How do you measure the distance between "The world is made of fire" and "The world is made of atoms"? There is no standard ruler for logical space. Different ways of describing the world (different "languages") give you different distances.

  **2. The Language Dependence:**
  This is the biggest hurdle. If I describe the world using "colors," a theory might seem close to the truth. If I describe the exact same world using "shapes," that same theory might seem far from the truth.
  A clean fix requires a definition of truthlikeness that doesn't change just because you changed your vocabulary. Nobody has found a solution that is perfectly language-independent.

  **3. The Modern Workaround:**
  Most philosophers (like Ilkka Niiniluoto) now use **"Possible Worlds" semantics**. Instead of counting true/false sentences (Popper's method), they define "distance" based on how similar the *state of affairs* described by the theory is to reality.
  *   *Verdict:* This works much better intuitively. It allows us to say Newton is closer than Four Elements.
  *   *Catch:* It relies on assumptions about how we structure reality that are still debated. It's not a "logical proof" in the way Popper wanted; it's a semantic model.

  ### Summary
  Your friend is right: Popper's specific formal definition is dead. It structurally cannot compare two false theories because, in logic, adding falsehoods inevitably adds truths, breaking the scoring system.

  However, **your intuition is also right.** Science *does* progress. Newton *is* closer to the truth than the Four Elements. The failure isn't in reality; it's in Popper's attempt to measure "closeness" by counting logical sentences rather than measuring the "distance" between descriptions of the world. We have better tools now, but they are more complex and less "clean" than Popper hoped.
