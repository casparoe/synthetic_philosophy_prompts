prompt: |-
  I'm a philosophy PhD student working in bioethics, and as part of a clinical ethics fellowship this year I sit as the trainee representative on my hospital's ethics committee. We've been asked to decide on a pilot proposal that I think turns on a much deeper problem than most of the committee has noticed, and I've been tasked with drafting the recommendation memo we'll circulate before the vote in three weeks. The proposal comes from a startup called Anchor Health, which wants to run a year-long pilot of an AI "advance care planning companion" with patients who carry serious diagnoses that put their future decision-making capacity at risk, mostly early-stage dementia and ALS. While a patient still has capacity, they work with the system over several sessions, which also ingests, with consent, their letters, messages, and recorded conversations with family, to build a rich model of what they value. The pitch, a more ambitious version of what bioethicists call a "patient preference predictor," is explicit that Anchor does not just record what a patient says: it flags apparent contradictions in their stated wishes, discounts what the vendor's documentation calls "framing noise and in-the-moment anxiety," and extrapolates to situations the patient never actually discussed, so as to output one coherent preference profile. Later, once the patient has lost capacity and their written directive turns out to be silent or ambiguous about the actual situation on the ward, which is the usual case in practice, clinicians and family can query Anchor for a recommendation that goes well beyond anything the patient is on record as ever having said.

  The committee's disagreement keeps reminding me of the debates around Yudkowsky's "coherent extrapolated volition" proposal for AI alignment; a friend of mine in the CS department who works on alignment spotted the resemblance before I did, and now I can't unsee it. One faction argues that Anchor is just a more rigorous version of the substituted judgment surrogates already attempt, badly (family surrogates are notoriously inaccurate at guessing patient wishes), so a more consistent, better-informed extrapolation serves patient autonomy rather than threatening it. The other faction argues that the very operations being marketed as improvements — resolving "contradictions," discounting "noise" — are exactly where someone's assumptions about what a more rational or more informed version of you would want get substituted for what you actually, presently want, and that there is no neutral standpoint from which to say which strand of an ambivalent person counts as the real, extrapolated one. Dementia adds a further complication: by the time a hard case reaches the ward, the disease may have spent months reshaping the patient's values, so it is genuinely unclear whose preferences — the earlier self Anchor was trained on, or whoever the patient now is — are even the ones being extrapolated. Our advance-directive policy currently says nothing about any of this.

  Could you draft the short written opinion I'm responsible for circulating? It should recommend a specific course of action — approve the pilot, reject it, or approve it with stated conditions — attached to a concrete timeframe, with reasoning that Anchor's team and our own clinicians could actually act on, and it should take the strongest version of whichever side's worry you end up setting aside seriously, rather than dispatching it in a sentence.
reasoning: |-
  Here's a thinking process that leads to the drafted memo:

  1.  **Analyze the Request:**
      *   **User:** Philosophy PhD student in bioethics, clinical ethics fellow, trainee rep on hospital ethics committee.
      *   **Task:** Draft a recommendation memo for the committee to circulate before a vote in three weeks.
      *   **Subject:** A pilot proposal by "Anchor Health" (AI advance care planning companion).
      *   **Key Technology:** AI ingests patient data (letters, messages, conversations) while capacitated. It resolves contradictions, discounts "noise/anxiety," and extrapolates to un discussed situations to create a coherent preference profile. Used later when capacity is lost and directives are silent/ambiguous.
      *   **Key Ethical Tension:** Autonomy vs. Paternalism/Identity.
          *   *Pro:* Better than inaccurate human surrogates (Substituted Judgment standard).
          *   *Con:* "Coherent Extrapolated Volition" (CEV) problem. Who decides what counts as "noise" vs. "signal"? Whose values (past vs. present/demented self) count?
      *   **Constraint:** Must recommend a specific course of action (Approve, Reject, Approve with Conditions) + timeframe. Must take the strongest version of the *rejected* worry seriously (steel-manning). Must be actionable for Anchor and clinicians.
      *   **Tone:** Professional, ethically rigorous, nuanced, suitable for a hospital ethics committee (HEC) context.

  2.  **Determine the Recommendation:**
      *   *Option A: Approve.* Too risky given the philosophical unresolvedness of the CEV problem and the potential for harm in vulnerable populations (dementia/ALS).
      *   *Option B: Reject.* Premature. The technology addresses a real problem (surrogate inaccuracy). A flat rejection stifles innovation that could help patients.
      *   *Option C: Approve with Conditions.* This is the most responsible path for a pilot. It allows data collection while mitigating the specific ethical risks identified (transparency of extrapolation, status of the AI recommendation, handling of value drift).
      *   *Decision:* **Approve with Strict Conditions.** This aligns with the role of a clinical ethics fellow (pragmatic but principled). It acknowledges the potential benefit while guarding against the "black box" paternalism.

  3.  **Structure the Memo:**
      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** Brief statement of recommendation.
      *   **Background:** Summary of Anchor Health proposal.
      *   **Ethical Analysis (The Core):**
          *   The Autonomy Argument (Pro).
          *   The Identity/Construction Argument (Con - needs steel-manning).
          *   The "Two Selves" Problem (Dementia specific).
      *   **Recommendation & Conditions:** Specific, actionable constraints.
      *   **Timeline/Review:** When to revisit.
      *   **Conclusion:** Final wrapping thought.

  4.  **Drafting - Section by Section:**

      *   *Header:* Keep it formal.
      *   *Opening:* State the recommendation clearly. "Approve with Conditions."
      *   *Background:* Briefly summarize Anchor's pitch without jargon.
      *   *Analysis - The Pro Side:* Acknowledge the surrogate accuracy problem. Family members guess wrong ~50% of the time. AI *could* be better. This validates the proponent's view.
      *   *Analysis - The Con Side (Steel-manning):* This needs to be the philosophical heavy lifting. Use the "Coherent Extrapolated Volition" parallel. The risk isn't just error; it's *constitutive*. By smoothing out contradictions, the AI creates a "rationalized" agent that never existed. In dementia, the "past self" might dictate against the "present self's" current well-being. This needs to be articulated clearly so the committee understands the depth of the risk.
      *   *Conditions:* How to mitigate?
          1.  *Transparency:* The AI cannot be a black box. Clinicians need to see *why* it extrapolated X.
          2.  *Advisory Only:* It cannot override a current surrogate or clinician judgment without a high bar. It is *evidence*, not *authority*.
          3.  *Value Drift Protocol:* Specific handling for dementia patients where current affect contradicts past values.
          4.  *Data Audit:* Who trains the "rationality" model?
      *   *Timeline:* Pilot is one year. Review at 6 months and 12 months.
      *   *Tone Check:* Is it too academic? Needs to be accessible to clinicians but rigorous enough for the ethicists. Avoid overly dense jargon but keep the philosophical precision.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is the CEV reference appropriate?
      *   *Fix:* Don't name-drop Yudkowsky in the memo (too niche/controversial for a hospital setting), but use the *logic* of CEV (extrapolating what a better version of you would want). Frame it in bioethical terms (Dworkin's critical interests vs. experiential interests).
      *   *Critique:* Are the conditions actionable?
      *   *Fix:* Make sure Anchor knows they need to provide "explainability" features. Make sure clinicians know they retain final authority.
      *   *Critique:* Did I take the rejected worry seriously?
      *   *Fix:* Ensure the section on "Constitutive Paternalism" is robust. If I recommend approval, I need to show I understand why rejection was a serious contender. I will frame the conditions as direct responses to the "Identity" worry.

  6.  **Final Polish:**
      *   Check word count (keep it "short written opinion" as requested, but substantial enough for a PhD level).
      *   Ensure the distinction between "Substituted Judgment" and "Best Interest" is clear.
      *   Verify the timeframe (3 weeks until vote, pilot is 1 year).

  7.  **Final Review against constraints:**
      *   Recommend specific action? Yes (Approve with Conditions).
      *   Timeframe? Yes (1-year pilot, 6-month review).
      *   Actionable reasoning? Yes (Explainability, Advisory status).
      *   Steel-man the opposing view? Yes (The "Constitutive Paternalism" section).

  *(Self-Correction Note: Make sure not to sound like I'm solving the metaphysical problem of personal identity. Acknowledge it's unsolvable but manageable procedurally.)*

  8.  **Drafting the Content.** (Proceeds to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name], Clinical Ethics Fellow & Trainee Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Anchor Health AI Pilot Proposal

  **Executive Summary**
  I recommend that the Committee **approve the Anchor Health pilot proposal with strict operational conditions**, subject to a formal ethical review at the six-month mark. While the proposal offers a promising solution to the documented inaccuracy of human surrogate decision-making, it introduces novel risks regarding "constitutive paternalism" and personal identity that cannot be resolved by technology alone. The conditions outlined below are designed to ensure the tool functions as evidentiary support for substituted judgment rather than as an authoritative override of patient autonomy.

  **Background**
  Anchor Health proposes a one-year pilot deploying an AI-driven "advance care planning companion." The system ingests patient data (conversations, writings) while the patient retains capacity to construct a preference profile. Crucially, the AI is designed to resolve contradictions in patient statements, discount "framing noise," and extrapolate preferences to clinical scenarios the patient never explicitly discussed. When capacity is lost, clinicians may query the system for recommendations in cases where written directives are silent.

  **Ethical Analysis**
  The Committee's debate centers on two competing conceptions of autonomy.

  *1. The Argument for Enhanced Autonomy (The Proponent's View)*
  The strongest argument for Anchor is empirical: family surrogates predict patient treatment wishes correctly only about 50% of the time, often projecting their own preferences. Current advance directives are frequently too vague to guide specific clinical decisions (e.g., "no heroic measures" does not clarify stance on temporary ventilation for pneumonia). Anchor's system arguably fulfills the *substituted judgment* standard more rigorously than humans can. By synthesizing a larger dataset of the patient's life and values, it may approximate what the patient *would have chosen* had they been fully informed and consistent, thereby protecting autonomy more effectively than our current default of relying on distressed family members.

  *2. The Argument Against Constitutive Paternalism (The Dissenting View)*
  The strongest argument against Anchor is not that the AI will make *errors*, but that it makes *decisions* about who the patient is. This mirrors the "Coherent Extrapolated Volition" problem in AI alignment: to create a "coherent" profile, the system must decide which of the patient's contradictory statements represent their "true" self and which are "noise."

  There is no neutral algorithm for this. If a patient expresses a wish to live at all costs in one session but a fear of suffering in another, the AI's resolution of that tension imposes a rationality structure the patient never possessed. This risks substituting the vendor's philosophical assumptions about rationality for the patient's actual, perhaps ambivalent, will.

  Furthermore, in dementia cases, we face the "identity drift" problem. By the time a decision is needed, the patient's current experiential interests (e.g., enjoyment of simple pleasures) may conflict with the prior critical interests recorded by Anchor (e.g., "do not keep me alive if I cannot recognize my family"). Prioritizing the AI's extrapolation of the *past* self may actively harm the *present* self, effectively treating the demented patient as a vessel for a dead person's wishes.

  **Recommendation and Conditions**
  We cannot wait for philosophical consensus on personal identity to address the immediate crisis of surrogate inaccuracy. However, we cannot deploy a system that obscures its normative assumptions. Therefore, approval is contingent on the following four conditions:

  1.  **Explainability of Extrapolation:** Anchor must not provide a binary recommendation (e.g., "Intubate: Yes/No"). The output must display the specific data points used and explicitly flag where *extrapolation* occurred versus where *explicit* prior consent exists. Clinicians must see the "confidence interval" of the AI's moral reasoning.
  2.  **Advisory Status Only:** The Anchor profile must be classified as *evidence* within the medical record, not as a *directive*. It cannot override a designated healthcare proxy or surrogate decision-maker unless the surrogate's decision is clearly contrary to the patient's explicit, non-extrapolated prior statements.
  3.  **The "Current Self" Veto:** For patients with neurodegenerative conditions, if the patient currently demonstrates capacity for assent/dissent (even if legal capacity is gone) that contradicts the Anchor profile, the current expressed affect must trigger an automatic ethics consult. We cannot allow the AI to silence the present voice of the patient in favor of the past model.
  4.  **Audit of "Rationality" Weights:** Anchor must disclose to the Committee the ethical framework used to train the system's resolution of contradictions. We need to know if the system prioritizes "life preservation" or "suffering avoidance" when patient data is ambiguous. This cannot be a proprietary black box.

  **Timeline and Review**
  *   **Pilot Duration:** 12 Months.
  *   **Interim Review:** At 6 months, the Ethics Committee will review the first 20 cases where Anchor recommendations were queried. We will specifically assess whether clinicians treated the AI as advisory or authoritative.
  *   **Final Vote:** Continuation of the program beyond the pilot requires a new vote based on the interim data.

  **Conclusion**
  Anchor Health attempts to solve a real moral failure in our current system: the inadequacy of existing tools to honor patient autonomy when capacity fades. However, efficiency in resolving ambivalence is not a moral good if it erases the ambivalence that was part of the patient's humanity. By approving this pilot with the conditions above, we acknowledge the potential benefit while retaining the human oversight necessary to guard against the subtle paternalism of algorithmic coherence.

  **Action Requested:** Vote to Approve with Conditions as outlined.
