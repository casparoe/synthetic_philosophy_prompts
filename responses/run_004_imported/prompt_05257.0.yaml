          3.  **Grandfathering + "Clean as You Go":** Don't force big-bang rewrites.
          4.  **Compatibility Layer:** Accept both, normalize output.
      *   **Cultural Shift:** Move from "Ownership" to "Stewardship."

  7.  **Self-Correction/Edge Case Consideration:**
