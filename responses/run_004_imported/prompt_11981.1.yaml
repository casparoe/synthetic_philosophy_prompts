answer: |-
  This is a beautiful problem. It sits right at the intersection of game theory, legal philosophy, and family dynamics. You are asking whether rules exist independently of their application (a Platonic view) or whether they are constituted by their application (a Pragmatic view).

  Here is the outside take you asked for, broken down into the philosophical reality, the evaluation of your cousins' claims, and a practical path forward.

  ### 1. The Philosophical Reality: Discovery vs. Legislation

  You asked: *"Is there some hidden 'correct' way... or are we really just going to have to pick an answer and admit that we're legislating the rule?"*

  The hard truth is: **You are legislating.**

  In legal philosophy, this is known as the problem of the "gap in the law." For forty years, the "law" of your card game had an open texture. It worked perfectly because the edge case never arose. Even your grandfather, when he answered Denny's hypothetical question years ago, was not *remembering* a rule; he was *creating* one in that moment.

  Think about that: If the situation never occurred, there was no precedent. If there was no precedent, your grandfather had no "data" to recall. When Denny asked him, your grandfather had to use his intuition about how the game *should* work to provide an answer. That makes Denny's memory of that conversation valuable, but it doesn't make it a "discovery" of an ancient truth. It was a ruling, just like the one you need to make now.

  So, to answer your core anxiety: It is not wrong to say the game never really had settled rules for *this specific scenario*. A rule that never interacts with reality is a potentiality, not an actuality. Admitting that you are legislating now does not dishonor your grandfather; it acknowledges that you have inherited his role as the guardian of the game.

  ### 2. Evaluating the Cousins' Arguments

  Since we cannot "find" the truth, we have to weigh the competing claims to see which is the better *foundation* for a new rule.

  **Mara's Argument (Procedural Consistency):**
  *   **Claim:** Effects stack (Double, then Flip).
  *   **Basis:** She observed how your grandfather settled disputes generally.
  *   **Strength:** This relies on the *mechanics* of the game. In most trick-taking games with modifiers, bonuses usually apply to the score calculation before the winner is determined. It treats the rules as a system.
  *   **Weakness:** It assumes a "stacking order" that was never explicitly defined.

  **Denny's Argument (Intent/Override):**
  *   **Claim:** The Flip cancels the Double.
  *   **Basis:** A specific conversation with the creator.
  *   **Strength:** This relies on *authoritative intent*. If the "Flip" changes the fundamental objective (from "most tricks" to "fewest tricks"), it is logically sound to argue that modifiers attached to the *original* objective (scoring points for tricks) might become void. It treats the Flip as a state change, not just a modifier.
  *   **Weakness:** Human memory is fallible, especially regarding hypothetical conversations from years ago.

  **The Logical Tiebreaker:**
  If you want to try to think like your grandfather did as a *game designer*: Denny's interpretation is likely more elegant. If the hand "flips" so that the person with the *fewest* tricks wins, the economy of the hand changes. "Doubling points" usually implies punishing/rewarding the trick-taker. If the trick-taker is now the loser, doubling the points might create paradoxical scoring (e.g., doubling a penalty?). Often, in game design, a "state change" rule (Flip) overrides a "modifier" rule (Double).

  However, Mara's interpretation is more *generous* (higher potential scores), which often makes for more exciting holiday games.

  ### 3. How to Settle It (Without Ruining Thanksgiving)

  You have $40 and family pride at stake, but the real stake is the continuity of the tradition. If you fight over this too hard, the game stops being fun, and the tradition dies. Here is a principled way to resolve it:

  **Step 1: The "Grandfather Clause" Vote**
  Since the creator is gone, the authority devolves to the current players. Hold a vote. But do not vote on "Who is right?" Vote on "Which rule feels more like *him*?"
  *   Was he a stickler for technical stacking (Mara)?
  *   Was he a fan of chaotic "gotcha" moments where big bonuses get wiped out (Denny)?
  *   Let the family decide which version preserves the *spirit* of the game, rather than the letter of the law.

  **Step 2: Split the Pot**
  Regarding the $40: Split it evenly between Mara and Denny. This acknowledges that both contributed to the preservation of the game. Mara kept the mechanical tradition alive; Denny kept the oral history alive. Neither is "wrong" in a way that deserves financial penalty.

  **Step 3: Write It Down (The Most Important Step)**
  Your grandfather's mistake was not dying; it was not writing the rules down. The greatest honor you can pay him is to fix this gap permanently.
  *   Whichever rule you choose, write it down *today*.
  *   Add a footnote: *"Decided Thanksgiving 2023, regarding the Joker/Two of Trump overlap."*
  *   This turns this dispute into part of the game's lore. In 20 years, when *this* rule is challenged, you will have a precedent.

  ### 4. A Suggestion for the Ruling

  If I may offer a suggestion on the ruling itself: **Go with Denny (Flip cancels Double).**

  Here is why: In oral traditions, specific exceptions usually override general modifiers. The "Flip" is a fundamental alteration of the hand's reality. The "Double" is a bonus on top of the reality. If the reality flips, the bonus usually falls off. It is cleaner, creates less accounting confusion, and aligns with Denny's memory of a specific directive from the creator.

  However, you should announce it this way:
  *"We cannot know for sure what Grandfather intended, because even he had to make this rule up when Denny asked him. We are now in the same position he was in. We choose Denny's version because it fits the logic of the 'Flip,' but we acknowledge Mara's point about stacking. We are writing this down so our kids don't have to argue about it."*

  ### Summary

  You are not failing to find the truth; you are realizing there is no truth to find. That is not a failure; it is maturity.

  The game has survived forty years not because the rules were perfect, but because the family was willing to play through the ambiguity. Now, the ambiguity has become a conflict. Resolve it democratically, acknowledge that you are acting as your grandfather's successors (not just his students), and write the rule down.

  The $40 doesn't matter. The fact that you care this much about getting it "right" proves the tradition is healthy. Pick a path, document it, and deal the next hand.
