      *   TDT/UDT provides the formal justification for *why* the correlation exists (logical nodes).
      *   Acausal trade *requires* this formalism because without symmetry, the correlation isn't self-evident. You need to prove that your decision algorithm *takes into account* the other's algorithm.
      *   *Crucial distinction:* Superrationality works in a PD (same payoff matrix). Acausal trade works in a bargaining scenario (different payoff matrices).

  8.  **Refining the "Simulation" point:**
      *   Superrationality: Introspection is sufficient.
      *   Acausal Trade: Extrospection (modeling the other) is necessary. This introduces the risk of error, computational intractability, and the need for "logical handshakes" (proving properties of code without running it).

  9.  **Final Polish:** Ensure the tone is appropriate for a software engineer (precise, structural, analogy-friendly). Check against the prompt's specific constraints (justify by specifying commitments).

