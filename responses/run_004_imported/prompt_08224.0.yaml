      *   *Section 2: Superrationality's Commitments.* Focus on Identity. "I am you." This makes prediction trivial.
      *   *Section 3: Acausal Trade's Extra Ingredients.*
          *   *Asymmetry:* Different utility functions are required for *trade* (vs. cooperation).
