          *   *Decision Theory:* TDT/UDT is strictly necessary. Hofstadter was vague; Acausal Trade needs the math of logical counterfactuals to avoid paradoxes (like Newcomb's problem variants).
      *   *Section 4: Commitment/Enforcement.* Neither has causal enforcement. Both rely on "pre-commitment via algorithm." But Acausal Trade needs a way to verify the deal without communication. This leads to the concept of "proving" source code or behavior.
      *   *Conclusion:* Summarize the trade-off. Superrationality buys simplicity with symmetry. Acausal trade buys applicability (asymmetry) with complexity (simulation + stronger DT).

  7.  **Refining the "Decision Theory" point:**
