prompt: |-
  I'm a PhD student in philosophy of biology, and I run a small interview series for our department's working group on evolutionary theory. Next week's guest is an evolutionary theorist known for defending strong gene selectionism -- the view that the gene is the only genuine unit of selection, and that any apparently group- or organism-level selection story is ultimately just a convenient redescription. His stock reply whenever someone raises a group-selection-flavored case is that it's "kin selection wearing a group-selection costume." Draft eight to ten interview questions that go beyond having him restate the view: I want at least one question that uses the Price-equation equivalence between gene-level and group-level partitions of fitness to ask what, if anything, makes the gene the "real" unit rather than merely the most convenient bookkeeping choice; one on eusocial superorganisms such as ant or naked-mole-rat colonies, asking whether his account can explain colony-level organization without quietly reintroducing the higher-level individuality it's supposed to dissolve; and one that uses Sober's selection-for/selection-of distinction to ask whether his position has in effect shifted from a causal claim about where selection acts to a merely pragmatic claim about which bookkeeping is more convenient. For each, add a follow-up keyed to the answer he's most likely to give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **User:** PhD student in philosophy of biology.
      *   **Context:** Department working group interview series on evolutionary theory.
      *   **Guest:** Evolutionary theorist, strong gene selectionist (genes are the *only* genuine unit of selection; group/organism selection is redescription/kin selection in disguise).
      *   **Goal:** 8-10 interview questions that go beyond restating the view.
      *   **Specific Requirements:**
          *   One question on Price Equation equivalence (gene vs. group partition) $\rightarrow$ Ontology vs. Convenience.
          *   One question on Eusocial Superorganisms (ants, naked mole rats) $\rightarrow$ Higher-level individuality vs. Dissolution.
          *   One question on Sober's Selection-for/Selection-of distinction $\rightarrow$ Causal claim vs. Pragmatic bookkeeping.
          *   Each question needs a specific follow-up keyed to the *most likely answer* (which, given the guest's stance, will likely be a defense of gene-centrism, appeal to heuristic value, or denial of higher-level causality).
      *   **Tone:** Academic, rigorous, respectful but probing (suitable for a philosophy of biology working group).

  2.  **Deconstruct the Guest's Position (Strong Gene Selectionism):**
      *   *Core Claim:* Genes are the only replicators/units of selection.
      *   *Defense:* Group selection cases are kin selection (inclusive fitness).
      *   *Likely Responses:* Mathematical equivalence doesn't imply ontological equality; genes are the only things that persist across generations; higher-level entities are "vehicles" not "replicators"; convenience is guided by causal reality.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Price Equation & Ontology.*
          *   *Idea:* The Price Equation allows partitioning variance at different levels. If the math works both ways, why is one "real"?
          *   *Draft:* The Price Equation shows you can partition fitness at the gene or group level. If the math is equivalent, why is the gene the real unit?
          *   *Refinement:* Make it more technical. Focus on the covariance terms. Ask about the metaphysical weight.
          *   *Follow-up:* He will likely say genes are the only *replicators*. So ask about the necessity of replication for selection.

      *   *Requirement 2: Eusocial Superorganisms.*
          *   *Idea:* Ant colonies look like individuals. They reproduce, have immune systems, etc. Does calling them "kin selection" miss the emergent properties?
          *   *Draft:* What about ant colonies? They act like superorganisms. Is your view ignoring this?
          *   *Refinement:* Focus on the *dissolution* of individuality. If the colony functions as a physiological unit, does gene selectionism fail to capture the *mechanism* of constraint?
          *   *Follow-up:* He will likely say it's still about gene propagation via relatives. Ask about the *causal power* of the colony structure itself (downward causation).

      *   *Requirement 3: Sober's Selection-for/Selection-of.*
          *   *Idea:* Sober distinguishes what is selected *for* (trait) vs. what is selected *of* (object). Does gene selectionism confuse the bookkeeping with the cause?
          *   *Draft:* Sober says selection-for is different from selection-of. Are you just talking about bookkeeping?
          *   *Refinement:* Frame it as a shift from causal ontology to pragmatic methodology. If genes are just the ledger, where is the causality?
          *   *Follow-up:* He will likely insist genes are causal. Ask about the causal chain involving the phenotype.

      *   *Filling the remaining 5-7 questions:*
          *   Need to cover related topics: Multilevel Selection (MLS1 vs MLS2), the definition of "Individual," Evolutionary Transitions in Individuality (ETIs), the role of development (Evo-Devo), niche construction, and the heuristic value of pluralism.
          *   *Question 4 (ETIs):* Focus on Major Transitions. If genes are always the unit, how do new individuals emerge?
          *   *Question 5 (Phenotype/Vehicle):* Dawkins' vehicle concept. Is the organism just a shell? How does development fit in?
          *   *Question 6 (Niche Construction):* Organisms modify environments. Does this require organism-level agency?
          *   *Question 7 (Pluralism):* Why resist methodological pluralism if predictions are same?
          *   *Question 8 (Replicator/Interactor):* Hull's distinction. Does your view collapse this?
          *   *Question 9 (Causal Process):* Godfrey-Smith's work on causality. Is selection a causal process or a statistical outcome?
          *   *Question 10 (Future of Theory):* Where is the field going?

  4.  **Refining and Polishing (Checking against constraints):**
      *   *Check:* Are there 8-10 questions? Yes.
      *   *Check:* Are the three specific required questions included and clearly identified? Yes.
      *   *Check:* Are the follow-ups keyed to likely answers? Yes, I need to make sure I anticipate the "Standard Gene-Centric Defense" for the follow-up.
      *   *Tone Check:* Ensure it sounds like a philosopher talking to a biologist (precise terminology, referencing specific debates).

  5.  **Final Review of Specific Questions:**
      *   *Q1 (Price Eq):* Focus on the "arbitrariness" of partitioning. Follow-up on replication fidelity.
      *   *Q2 (Superorganisms):* Focus on functional integration. Follow-up on emergent constraints.
      *   *Q3 (Sober):* Focus on Causal vs. Pragmatic. Follow-up on the locus of causality.
      *   *Q4 (ETIs):* Michod's work. How does a gene-centric view explain the *suppression* of lower-level selection?
      *   *Q5 (Vehicles):* Dawkins. Is the organism causally inert?
      *   *Q6 (Niche Construction):* Odling-Smee. Does the organism act as an agent?
      *   *Q7 (MLS1 vs MLS2):* Damuth & Heisler. Do you accept MLS2?
      *   *Q8 (Pluralism):* Sterelny/Griffiths. Is monism productive?
      *   *Q9 (Development):* Evo-Devo. Is the gene the only source of structure?
      *   *Q10 (Heuristics):* If group talk is useful, is it *only* useful?

  6.  **Writing the Output:** (Self-Correction during drafting: Ensure the follow-ups aren't just "But what if..." but specifically address the *predicted* response). *Make sure the distinction between MLS1 and MLS2 is clear in the ETI question.* *Ensure the Sober question accurately reflects the for/of distinction.*

      *(Self-Correction on Q3)*: Sober's distinction is often about traits vs. objects. I need to make sure I apply it to the *gene selectionist's claim*. The claim is "Genes are selected." Sober might say "Organisms are selected *of*, traits are selected *for*." The question should ask if the gene-selectionist is conflating the ledger (genes) with the causal object (organisms).

