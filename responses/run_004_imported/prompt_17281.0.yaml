answer: |-
  Here are ten interview questions designed for a philosophy of biology working group, tailored to challenge a strong gene-selectionist position without inviting mere restatement of the dogma. They include the three specific required questions, along with seven others probing related ontological and methodological tensions. Each includes a follow-up keyed to the guest's most probable defense.

  ### 1. The Price Equation and Ontological Commitment
  **Question:** The Price Equation allows us to partition the change in gene frequency into components attributable to different levels of biological organization. Mathematically, we can partition fitness variance entirely at the gene level or include a covariance term for group-level fitness without altering the predictive output of the model. If the mathematical equivalence holds, on what grounds do you assert that the gene-level partition reflects the *ontological reality* of selection, while the group-level partition is merely a redescription? What non-mathematical criterion breaks the symmetry between these partitions?

  *   **Likely Answer:** He will likely argue that while the math is equivalent, only genes possess the requisite fidelity of replication to sustain cumulative evolution over deep time, making them the only "real" replicators.
  *   **Follow-up:** "If fidelity of replication is the criterion, how do you account for the fact that replication fidelity is itself a product of evolved cellular machinery (an organism-level trait)? Doesn't positing the gene as the *primary* unit presuppose the very organismal machinery that makes high-fidelity gene replication possible, thereby circularizing the ontological priority?"

  ### 2. Eusociality and the Superorganism
  **Question:** Consider eusocial colonies, such as those of leafcutter ants or naked mole rats, which exhibit physiological integration, division of labor, and colony-level homeostasis comparable to multicellular organisms. Your view typically dissolves this colony-level individuality into kin selection among high-relatedness members. However, if the colony functions as a cohesive unit that suppresses lower-level conflict (e.g., worker policing), does your account adequately explain the *emergence* of this higher-level constraint without quietly reintroducing the colony as a causal individual? At what point does kin selection become functionally indistinguishable from group-level individuality?

  *   **Likely Answer:** He will likely maintain that the "suppression of conflict" is itself selected for because it maximizes the inclusive fitness of the founding queen's genes, so no new ontological individual is required.
  *   **Follow-up:** "But if the mechanism of suppression involves colony-level structures (e.g., pheromonal regulation or physical policing) that act downwardly on the constituent organisms, are you not granting the colony structure causal power? If the structure has causal power over the genes' propagation, in what sense is the gene still the *sole* unit of selection, rather than a beneficiary of a higher-level causal process?"

  ### 3. Sober's Selection-For/Selection-Of Distinction
  **Question:** Elliott Sober distinguishes between the object *of* selection (the entity that survives and reproduces) and the property *for* which it is selected. Gene selectionism often seems to collapse this distinction by claiming the gene is both the object selected and the beneficiary. If we accept your view, has the claim "genes are the unit of selection" shifted from a causal claim about where selection pressure is physically applied (often the phenotype/organism) to a pragmatic claim about which bookkeeping system best tracks the long-term evolutionary trajectory?

  *   **Likely Answer:** He will likely insist it remains a causal claim because genes are the only entities that persist across generations; organisms are transient vehicles, so causality must be anchored in the persisting entity.
  *   **Follow-up:** "If organisms are merely transient vehicles, how do you account for the causal specificity of the phenotype? A specific gene may persist, but its propagation depends on the specific organismal context in which it is expressed. If the causal efficacy is context-dependent, doesn't locating the 'unit' solely in the gene ignore the causal necessity of the organismal context that determines whether that gene is selected *for*?"

  ### 4. Evolutionary Transitions in Individuality (ETIs)
  **Question:** In Major Transitions in Evolutionary Individuality (e.g., the origin of eukaryotes or multicellularity), lower-level units surrender their independent reproduction to a higher-level unit. Richard Michod argues this requires the active suppression of lower-level selection. If the gene is always the only genuine unit of selection, how do you model the transition period where lower-level selection (e.g., rogue cell replication) is actively maladaptive for the higher-level unit? Does your framework treat the emergence of the new individual as a sudden ontological switch or a gradual heuristic shift?

  *   **Likely Answer:** He will likely describe it as a gradual shift in relatedness and conflict mediation, where the "unit" doesn't change, but the *context* of gene competition changes.
  *   **Follow-up:** "If the context changes such that the fitness of the gene becomes inextricably tied to the fitness of the collective, at what threshold does it become misleading to speak of the gene's fitness as distinct from the collective's? If the distinction loses predictive power, does retaining the gene as the *sole* unit become a metaphysical commitment rather than a scientific one?"

  ### 5. Replicator vs. Interactor (Hull's Distinction)
  **Question:** David Hull distinguished between the *replicator* (the entity that passes structure on) and the *interactor* (the entity that interacts with the environment to cause differential replication). Gene selectionism often identifies the replicator as the unit of selection. However, selection requires interaction. If the gene never interacts with the environment directly but only via the organism, does identifying the gene as the 'unit of selection' conflate the unit of *inheritance* with the unit of *agency*?

  *   **Likely Answer:** He will likely argue that the interactor is merely the mechanism, while the replicator is the beneficiary and the long-term locus of evolutionary change.
  *   **Follow-up:** "But if the interactor determines the fate of the replicator, and interactors can be groups or colonies, doesn't the level of the interactor dictate the level at which selection *acts*, even if the genes are what persist? Why privilege the persistence over the interaction in defining the 'unit'?"

  ### 6. Niche Construction and Organismal Agency
  **Question:** Niche construction theory emphasizes that organisms actively modify their selective environments, creating feedback loops that drive evolution. This often requires modeling the organism as an agent with a degree of autonomy from its immediate genetic programming. Does a strict gene-selectionist framework have the resources to model this organism-level agency, or must it reduce niche construction to a 'long arm' of gene expression, potentially obscuring the feedback dynamics?

  *   **Likely Answer:** He will likely claim niche construction is simply an extended phenotype; the organism modifies the environment to benefit the genes that built the organism.
  *   **Follow-up:** "If the environmental modification alters the selection pressure on the genes themselves in a way that is not linearly predictable from the gene's initial effect, doesn't the environment-organism system become the relevant unit of analysis? Does the 'extended phenotype' label adequately capture the reciprocal causation involved?"

  ### 7. Methodological Pluralism vs. Ontological Monism
  **Question:** Many evolutionary biologists adopt a methodological pluralism, using gene-level models for some problems (e.g., molecular evolution) and group-level models for others (e.g., altruism in structured populations), claiming both are 'real' depending on the context. You argue for ontological monism (only genes are real). Given that pluralistic modeling often yields faster insights in complex systems, what is the scientific cost of insisting on ontological monism? Does it hinder model construction in cases where group-level parameters are more stable than gene frequencies?

  *   **Likely Answer:** He will likely argue that ontological clarity prevents conceptual confusion and that apparent group parameters are just summaries of underlying gene dynamics.
  *   **Follow-up:** "But if the 'underlying gene dynamics' are computationally intractable while the group-level parameters are robust and measurable, does insisting on the gene as the 'real' unit offer anything other than a reductionist ideal? At what point does explanatory power trump ontological purity in your view?"

  ### 8. Selection as Causal Process vs. Statistical Outcome
  **Question:** Peter Godfrey-Smith and others have debated whether natural selection is a causal process or a statistical summary of population changes. If selection is a causal process, it seems to require causal interactions between entities. If genes do not interact causally with each other or the environment except through phenotypes, is it accurate to say selection acts *on* them? Or is gene selectionism ultimately a claim about the statistical outcome of organism-level causal processes?

  *   **Likely Answer:** He will likely argue that selection is defined by differential persistence, and since genes are the only things that persist differentially over the long term, they are the causal locus.
  *   **Follow-up:** "But differential persistence is the *result* of selection, not the process itself. If the process involves organismal survival and reproduction, doesn't locating the causality in the gene confuse the *record* of selection with the *mechanism* of selection?"

  ### 9. Developmental Systems and Parity
  **Question:** Developmental Systems Theory (DST) argues for 'parity' between genes and other developmental resources, suggesting that genes are not privileged causes of development. Your view privileges genes as the unit of selection. Even if we grant genes are the unit of *inheritance*, does the DST critique undermine the idea that they are the sole unit of *selection*, given that selection acts on the whole developmental system, not just the genetic component?

  *   **Likely Answer:** He will likely concede that development is complex but maintain that only genetic variation is systematically replicated and selected; environmental resources are not inherited with fidelity.
  *   **Follow-up:** "However, epigenetic marks and culturally transmitted niches can now be shown to have inheritance fidelity. If non-genetic resources can be inherited with sufficient fidelity to impact fitness, does your definition of the 'gene' as the sole unit require expansion, or does it risk excluding valid evolutionary processes?"

  ### 10. The Heuristic Value of "Group Selection" Language
  **Question:** You have characterized group-selection language as "kin selection wearing a costume." However, in fields like cultural evolution or immunology (clonal selection), group-level language is standard and productive. If the 'costume' allows researchers to generate novel hypotheses and interventions that a strict gene-centric vocabulary does not, does your ontological dismissal of the group undermine the heuristic fertility of the field? Is there a pragmatic sense in which the group can be 'real' for the practitioner, even if not for the ontologist?

  *   **Likely Answer:** He will likely admit the heuristic value but insist that we must not be misled into thinking the heuristic reflects the fundamental evolutionary mechanism.
  *   **Follow-up:** "If the heuristic is consistently more productive for understanding the system's dynamics, does that suggest our ontology is misaligned with the causal structure of the world? Or do you maintain that scientific truth is independent of explanatory utility?"
