answer: |-
  The strongest case for the inconsistency in Bentham's argument rests on the claim that his dismissal of "antipathy-pain" constitutes a fundamental violation of the ontological and axiomatic foundations of his own hedonistic calculus. By excluding the pain of disgust from the utility function on the grounds that it is "prejudiced" or "unfounded," Bentham surreptitiously introduces a qualitative hierarchy of pains that his system explicitly forbids, effectively smuggling in a deontological constraint to rescue a liberal conclusion that strict utilitarianism cannot support.

  Here is the argument for why this move is a departure from, rather than an application of, strict utilitarianism.

  ### 1. The Violation of Ontological Neutrality
  Bentham's opening axiom in *An Introduction to the Principles of Morals and Legislation* is that nature has placed mankind under the governance of two sovereign masters: pain and pleasure. In this framework, the moral weight of a sensation is derived entirely from its existence as a sensation, not its etiology. The calculus measures intensity, duration, certainty, propinquity, fecundity, purity, and extent. It does not measure *validity*.

  When Bentham argues that the pain felt by the public upon knowing homosexual acts occur is "antipathy" rooted in prejudice, he is making a claim about the *cause* of the pain, not the *reality* of it. However, within a strict hedonistic system, a pain caused by a "false" belief is ontologically identical to a pain caused by a "true" belief. If a spectator suffers genuine psychological distress (nausea, anxiety, horror) at the thought of an act, that distress is a negative utility. By discounting this pain because it stems from a social construct or religious dogma, Bentham is asserting that some pains are "illegitimate." This violates the sovereignty of the masters. If pain is the only intrinsic evil, then *all* pain is evil, regardless of whether the sufferer is "reasonable." To argue otherwise is to claim that there is a good other than pleasure (e.g., truth, or rationality) that can override the imperative to minimize suffering.

  ### 2. The Contradiction of Qualitative Hedonism
  Bentham is famously associated with the quantitative view of utility, best summarized by his assertion that "prejudice apart, the game of push-pin is of equal value with the arts and sciences of music and poetry." He insists that if the quantity of pleasure is equal, the source is morally irrelevant.

  However, in the "paederasty" essay, Bentham applies a qualitative filter to *pain* that he refuses to apply to *pleasure*. He effectively argues that "rational pain" (e.g., grief from a death, physical injury) counts fully, while "irrational pain" (disgust from moral violation) counts for less or not at all. This creates an asymmetry in the calculus. If the source of pleasure cannot elevate its value, the source of pain cannot diminish its disvalue. By distinguishing between "primary" harms (physical/security) and "secondary" harms (offense/antipathy), Bentham is reintroducing the very kind of qualitative moral intuitionism he sought to eradicate. He is judging the *worthiness* of the suffering rather than measuring the *amount* of it.

  ### 3. The Circularity of "False" Preferences
  Bentham's strategy relies on the premise that the antipathy is based on a false assessment of harm (i.e., the public *thinks* the act is harmful, but it isn't). He attempts to solve this by arguing that the pain is based on a mistake. But utilitarianism is not a truth-tracking system; it is a welfare-tracking system.

  If a utilitarian society contains a majority that derives genuine utility from punishing a minority, or suffers genuine disutility from the minority's freedom, the calculus must account for that. To exclude these preferences because they are "morally mistaken" is circular. It assumes the conclusion (that the act is harmless) to invalidate the premises of the opposition's suffering. But the opposition's suffering is the *data* the calculus is supposed to process. By filtering the data based on whether it aligns with his own conclusion about harm, Bentham renders the calculus redundant. He is not using the calculus to determine the right action; he is using a pre-existing liberal intuition to rig the calculus.

  ### 4. Smuggling in "Rights upon Stilts"
  The most damning inconsistency is that Bentham's exclusion of antipathy functions exactly like a rights-based constraint, despite his famous dismissal of natural rights as "nonsense upon stilts."

  When Bentham says the pain of the spectator doesn't count, he is effectively granting the actor a "right to be free from the moralistic preferences of others." He is creating a protected sphere of liberty where the utility of the actor automatically trumps the utility of the observer. In a strict utilitarian framework, there is no such sphere; if the aggregate pain of the observers exceeds the pleasure of the actors, the act should be prohibited.

  By deciding *a priori* that this specific type of observer pain is inadmissible, Bentham is importing a deontological side-constraint. He is saying, "Even if the disgust is real, and even if it is widespread, it cannot justify coercion." This is a liberal principle of legitimacy, not a utilitarian calculation. It admits that there are some reasons for state action (moral disgust) that are impermissible regardless of their utility impact. This admits a non-utilitarian standard of justice into the heart of the system.

  ### 5. The Impossibility of Distinguishing "Prejudice" within the Calculus
  Finally, Bentham provides no internal metric within the hedonic calculus to distinguish "prejudice" from "principle." The calculus measures feelings, not the propositions that cause them. If Bentham can dismiss anti-sodomy disgust as "prejudice," a religious utilitarian could dismiss the pleasure of the sodomite as "sinful delusion" and argue *their* pain counts more.

  Without an external standard of "reasonableness" (which utilitarianism lacks, as reason is merely the servant of the passions), Bentham has no principled way to weigh his own enlightened antipathies against the vulgar antipathies of the masses. His decision to discount the public's disgust is therefore arbitrary from the perspective of the system. It relies entirely on Bentham's own authority as the calculator, rather than the neutral machinery of the calculus itself.

  ### Conclusion
  Bentham's handling of antipathy in the "paederasty" essay is not a refinement of utilitarianism but a confession of its limitations regarding liberal outcomes. To reach the conclusion that consensual homosexual acts should not be criminalized, he had to break his own rules. He had to assert that some pains are not really pains, or that some pains are morally disqualified from the sum. In doing so, he abandoned the strict neutrality of the hedonic calculus. The argument reveals that strict act-utilitarianism, if applied consistently to the actual preferences of a prejudiced population, might well demand repression. Bentham's move to discount antipathy is an *ad hoc* correction to align his theory with his liberal instincts, proving that the justification for liberty in this case rests on a non-utilitarian foundation.
