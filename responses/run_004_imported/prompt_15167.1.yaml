prompt: |-
  My grandma - Miss Odessa to pretty much the whole neighborhood - passed away two weeks ago at 88, and I'm giving her eulogy this Saturday. She ran a little storefront arts program on the same corner for something like 45 years, teaching neighborhood kids to paint banners for every march and church anniversary and block party going, and she had this one line from W.E.B. Du Bois that she'd quote at you the second you brought up "real art" versus "that other stuff" - "all art is propaganda and ever must be" - it was literally stitched onto a banner that hung over her worktable my whole life. The service is being held at the arts center instead of a funeral home, which is what she wanted, and that means the room is gonna be split right down the middle: half family and neighbors who are gonna hear the word "propaganda" and think Soviet posters or fake news, and half the old guard from the city's Black arts scene, some of them had actual out-loud arguements with her over that exact quote for decades, and they will 100% notice if I flatten it.

  Here's the part I'm nervous about getting wrong. From what I've read since she died, Du Bois wasn't saying the message is all that matters and the craft can be garbage - he was pretty adamant that the art also had to be beautiful and honest, that's actually what made it propaganda worth having, and that part was everything to her specifically. She'd genuinely make a kid redo a whole banner if the lettering was sloppy or the faces looked like caricatures, and she'd say bad art for a good cause does more damage to the cause than no art at all does. So I don't want a eulogy that just says "grandma believed art should be political," because that's not really it and the arts-scene crowd will clock it in about two seconds, but I also can't get up there and give a lecture on Du Bois to a room half full of people who are already crying and just want to remember her. Can you write the eulogy for me - something like 5 to 7 minutes read out loud - that actually uses this idea to say something true about who she was, in a way that lands for both halves of that room?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Subject:** Miss Odessa, 88 years old, passed away two weeks ago.
      *   **Role:** Grandchild giving the eulogy.
      *   **Setting:** The arts center she ran for 45 years (not a funeral home).
      *   **Audience:** Split 50/50.
          *   Group A: Family and neighbors (might associate "propaganda" with negativity/Soviet/fake news).
          *   Group B: Old guard Black arts scene (know the Du Bois quote well, argued with her about it, will detect superficiality).
      *   **Key Theme:** W.E.B. Du Bois's quote: "All art is propaganda and ever must be."
      *   **Crucial Nuance:** Odessa didn't believe message > craft. She believed bad art hurts the cause. Beauty and honesty *make* the propaganda effective. She demanded excellence (no sloppy lettering, no caricatures).
      *   **Tone:** Respectful, warm, authentic, not academic/lecture-like, but intellectually honest.
      *   **Length:** 5 to 7 minutes spoken (approx. 750-1000 words at a moderate pace).

  2.  **Determine the Core Message:**
      *   The eulogy needs to bridge the gap between the two audiences.
      *   For the neighbors: Explain *why* she cared so much about the banners (it was about dignity, not just politics).
      *   For the artists: Acknowledge the complexity of her belief (beauty *is* the argument).
      *   The synthesis: Her "propaganda" was actually about *truth-telling* through excellence. She taught kids that they mattered enough to be painted beautifully.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the setting. It's her space. Welcome everyone. Acknowledge the split in the room gently without making it a divide.
      *   **The Quote (The Elephant in the Room):** Bring up the banner. "All art is propaganda." Address the tension immediately but gently.
      *   **Reframing "Propaganda":** How did *she* define it? Not lies, but persuasion. Persuasion that people matter.
      *   **The Craft (The Crucial Nuance):** This is where I address the artists and her teaching style. The story about redoing the banner. Sloppy work = disrespect to the subject.
      *   **The Impact (The Neighbors/Kids):** What did the kids get out of it? Pride. Visibility.
      *   **Closing:** Bring it back to love and legacy. The banners are gone, but the standard remains.

  4.  **Drafting - Specific Phrasing & Tone Check:**
      *   *Avoid:* Academic jargon, defensive tone, dry biography.
      *   *Include:* Sensory details (smell of paint, sound of the corner), specific memories (the banner over the table), the specific Du Bois context without lecturing.
      *   *Voice:* Grandchild speaking to family and community. Intimate but public.

  5.  **Iterative Refinement (Self-Correction during drafting):**
      *   *Critique:* Is it too long? *Check:* Keep paragraphs tight.
      *   *Critique:* Did I explain Du Bois too much? *Fix:* Don't explain the essay "Criteria of Negro Art." Just explain *her* interpretation of it.
      *   *Critique:* Will the neighbors feel alienated by the word "propaganda"? *Fix:* Contextualize it as "telling the truth about us."
      *   *Critique:* Will the artists feel I'm dumbing it down? *Fix:* Use the specific detail about "caricatures" and "sloppy lettering." That shows I know her standards.

  6.  **Final Polish:**
      *   Check word count for timing (aiming for ~900 words).
      *   Ensure the transition from the "argument" about art to the "love" for the kids is smooth.
      *   Make sure the ending feels like a goodbye, not just an essay conclusion.

  7.  **Final Review against constraints:**
      *   5-7 mins? Yes.
      *   Addresses both audiences? Yes.
      *   Captures the Du Bois nuance? Yes.
      *   Honors Miss Odessa? Yes.

  *(Self-Correction Note during final review)*: I need to make sure I don't sound like I'm scolding the family for not knowing Du Bois, or scolding the artists for arguing with her. It needs to be a unifying memory. The "argument" was a form of intimacy among the artists. I should frame it that way.

  8.  **Final Output Generation** (Proceeding to write the eulogy based on these thoughts).
answer: |-
  Good morning. For those who don't know me, I'm [Your Name], Miss Odessa's grandchild.

  Looking out at this room, I see the two worlds Grandma lived in every single day. On one side, I see the family and the neighbors who grew up on this corner. On the other, I see the artists, the creators, the old guard who spent decades in studios and galleries arguing about aesthetics and theory.

  If you knew Grandma, you know this room is exactly where she wanted to be. She didn't want a funeral home. She wanted to be surrounded by the smell of tempera paint and the sound of the street she loved.

  And if you knew Grandma, you also know there is one thing hanging over this service that we have to talk about. It's the thing that was stitched onto the banner above her worktable for forty-five years. The W.E.B. Du Bois quote: *"All art is propaganda and ever must be."*

  I know that word—"propaganda"—can be heavy. For some of you, it sounds like lies. It sounds like manipulation. For others in this room, that quote was the opening salvo of a thousand debates. I've heard the stories. I know there were artists who walked through that door, saw that banner, and immediately started arguing with an eighty-year-old woman about the autonomy of art.

  Grandma loved those arguments. She told me once that if you weren't passionate enough to argue about it, you weren't passionate enough to pick up a brush.

  But I want to tell you what she meant, not as a scholar, but as the kid who sat at that worktable.

  When Grandma quoted Du Bois, she wasn't saying that the message was more important than the craft. She wasn't saying we should paint sloppy banners just because the cause was good. In fact, it was the exact opposite.

  I can't tell you how many times I watched her make a kid redo a banner. Maybe it was for the church anniversary, or a march downtown. The kid would be tired, they'd think it was "good enough." But Grandma would point to a slanted letter, or a face that looked more like a cartoon than a human being. She'd say, "No. Try again."

  She taught us that bad art for a good cause actually hurts the cause. She believed that if you paint a black child like a caricature, or if you letter a sign for dignity with sloppy, careless hands, you are telling the world that the subject isn't worth your best effort.

  To Grandma, excellence *was* the politics.

  She understood that for a long time, the world didn't think our stories were worth painting beautifully. So, when she taught us to paint a banner for a block party, she wasn't just teaching us to mix colors. She was teaching us that this block, these people, this moment—it mattered enough to be done right. It mattered enough to be beautiful.

  That is the "propaganda" she believed in. It wasn't about tricking anyone. It was about persuading the world to see us clearly. And you can't do that with a lie, and you can't do that with a mess. You can only do that with truth, and with craft.

  I think that's why this room is split today, and also why it isn't.

  To the neighbors and family: You might not care about art theory. But you care about how you felt when you saw those banners hanging up and down the avenue. You felt seen. You felt proud. That didn't happen by accident. That happened because one stubborn woman refused to let anything less than excellence represent her community.

  To the artists: You argued with her about Du Bois. But you also respected her. Because you knew that when she walked into a gallery or looked at a portfolio, she wasn't looking for pity points. She was looking for mastery. She demanded that we be undeniable.

  Grandma passed two weeks ago. But standing here, looking at the walls she painted, I realize she didn't really leave.

  Her "propaganda" is still here. It's in the way the neighbors still look out for each other on this corner. It's in the way the kids she taught now teach their own children to take pride in their work. It's in the standard she set that says: *We are here. We are worthy. And we will not be represented by anything less than our best.*

  She wanted me to tell you that she wasn't afraid of the end. She said she'd spent a lifetime painting the truth, and she was ready to see what comes next.

  So, let's not mourn her as if the work is finished. The banners might come down eventually. The paint might dry up. But the standard remains.

  If you want to honor Miss Odessa, don't just talk about how kind she was. Pick up a brush. Do the work. And make sure you do it beautifully. Because she believed that beauty, honest and hard-won, is the most powerful argument we have.

  Thank you.
