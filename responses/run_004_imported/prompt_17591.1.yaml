      *   *Logic:* This is a classic logical fallacy known as "Diffusion of Responsibility" or "Appeal to Popularity" (in a moral context). It suggests that if an action is widespread, individual accountability disappears.
      *   *Reality:* Moral responsibility is individual. Just because many people do something wrong doesn't make it right, nor does it erase individual agency.
