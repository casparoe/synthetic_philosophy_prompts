answer: |-
  Your gut feeling is correct: **your friend is wrong.**

  The reasoning your friend used ("everyone did it so no one did it") is a very common psychological trap, but it is logically and morally flawed. You are picking up on something important about human behavior and ethics that your friend is glossing over.

  Here is a breakdown of why that reasoning doesn't hold up, why the situation is serious, and why your discomfort is a sign of strong moral intuition.

  ### 1. The Flaw: "Diffusion of Responsibility"
  Your friend is describing a psychological phenomenon called **diffusion of responsibility**. This happens when individuals feel less accountable for their actions because they are part of a group. The logic is, *"If I don't do it, someone else will,"* or *"Since everyone is doing it, my contribution doesn't matter."*

  However, morality doesn't work by majority vote.
  *   **Analogy:** If a mob of people breaks a window, you can't say, "Well, since 50 people hit it, none of us are responsible for the broken glass." Every person who threw a stone contributed to the damage.
  *   **The Reality:** In a digital context, every single person who forwarded that video, laughed at the joke, or saved the clip made an active **choice** to participate. They had the option to scroll past, delete the message, or say "this isn't cool." By choosing not to opt out, they became complicit.

  ### 2. The Harm: Dehumanization
  You mentioned that she is now being called "video girl." This is a specific type of harm called **dehumanization**.
  *   When people reduce a classmate to a label based on an embarrassing moment, they stop seeing her as a person with feelings, a family, and a future.
  *   This makes it easier for people to be cruel. If she were just "Sarah," people might hesitate to mock her. If she is "video girl," she becomes a meme, and people feel less empathy toward memes.
  *   Your friend's argument ignores the *impact* on her. Regardless of *how* the bullying started, the *result* is that a student is being harassed and isolated.

  ### 3. Agency and Amplification
  Your friend argued that "nobody in particular decided to make it a thing." This is factually unlikely.
  *   **The Source:** Someone had to record it or leak it. That person bears significant responsibility.
  *   **The Amplifiers:** Even if one person started it, the "half the grade" who piled on are **amplifiers**. Without the audience, the video stays in one chat. The people who reposted it turned a private embarrassment into a public spectacle.
  *   **The Bystanders:** Even those who just watched and laughed without posting are signaling to the bullies that this behavior is acceptable social currency.

  ### 4. Why Your Friend Says This
  It is important to understand that your friend probably isn't trying to be cruel. They are likely using that logic to protect themselves.
  *   Admitting that the group is doing something wrong means admitting that *they* are part of a group doing something wrong.
  *   It is uncomfortable to realize you have the power to stop harm but haven't used it.
  *   Saying "it's no one's fault" is a way to relieve guilt. It's easier to believe the situation is a force of nature (like a storm) than to admit it's a collection of individual choices.

  ### 5. What This Means for You
  You are in a tough spot. You see the harm, but pushing back against a whole grade can feel intimidating. Here is how to handle it:

  *   **Trust Your Compass:** The fact that this feels "messed up" to you means you have empathy. Do not let the group gaslight you into thinking cruelty is normal.
  *   **Don't Amplify:** You don't have to be a hero and confront the whole group chat. But you can refuse to participate. Don't forward the video. Don't laugh at the jokes. If someone sends it to you privately, you can reply with something neutral like, "I'm not really into this kind of stuff," or just don't respond.
  *   **Small Acts of Allyship:** If you see her in the hallway, a normal smile or acknowledgment can go a long way. It reminds her that not everyone sees her as "video girl."
  *   **Consider Reporting:** If the harassment is severe (threats, explicit content, encouraging self-harm), this moves beyond "drama" and into school policy or legal territory. Most schools have anti-cyberbullying policies. Telling a counselor or trusted teacher isn't "snitching" on a prank; it's protecting a student from harassment.

  ### Summary
  Your friend's logic is a way to avoid guilt, not a valid ethical argument. **Responsibility is individual.** Just because a crowd runs a red light doesn't mean it's safe to cross, and it doesn't mean the drivers aren't responsible if they hit someone.

  You are right to feel that this is wrong. Holding onto that empathy in a high-pressure social environment is difficult, but it's one of the most important things you can do.
