prompt: |-
  Ok so last week a girl in my grade got caught doing something embarrassing on video and it ended up in our class groupchat, and within like an hour half the grade was piling on with jokes and reposts, including kids who don't even know her, so now to a lot of people shes basically just "video girl," not an actual person. When I said that felt kind of messed up, my friend told me "its not really anyone's fault, nobody in particular decided to make it a thing, everyone just kind of joined in," like that made it totally fine. That answer feels off to me but I can't explain why "everyone did it so no one did it" doesn't actually let everyone off the hook. Is my friend right that nobody's actually responsible here, or is something wrong with that reasoning?
