answer: |-
  **MEMORANDUM**

  **TO:** Full Gaming Control Board
  **FROM:** Voluntary Self-Exclusion Program Subcommittee
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Petition for Reinstatement (Case #VSE-2021-894) and Recommendation Regarding Lifetime Exclusion Policy

  ### I. DECISION ON PETITION

  After reviewing the petition submitted by Mr. [Name], who entered the Voluntary Self-Exclusion Program (VSEP) as a lifetime participant two years ago, the Subcommittee has voted to **DENY** the request for reinstatement of gaming privileges.

  While the Subcommittee acknowledges the petitioner's completion of a treatment program and the supporting psychological assessment indicating remission of gambling disorder, we find that granting reinstatement under the *current* regulatory framework would undermine the integrity of the VSEP. At the time of enrollment, the petitioner explicitly acknowledged that the lifetime option was irrevocable. To reverse this agreement retroactively compromises the reliance interest of the program and the regulatory certainty required to enforce exclusions across all licensed facilities.

  ### II. POLICY RECOMMENDATION: PROSPECTIVE REINSTATEMENT PROCESS

  While we deny the current petition based on existing rules, the Subcommittee recognizes that addiction is a treatable medical condition, not merely a contractual breach. Therefore, we recommend the Board adopt a **Prospective Reinstatement Protocol** for all future lifetime exclusion agreements.

  Under this proposed protocol, future lifetime participants would be informed at the time of signing that reinstatement is *theoretically* possible, but only under the following strict conditions:

  1.  **Minimum Waiting Period:** No petition for reinstatement may be filed prior to five (5) years of continuous exclusion.
  2.  **Independent Evaluation:** Petitioners must submit assessments from two licensed clinicians independent of their original treatment team, confirming sustained remission in accordance with DSM-5 criteria.
  3.  **Cooling-Off Review:** Upon conditional approval, a mandatory six-month "cooling-off" period would be imposed before gaming privileges are restored, during which the petitioner must remain excluded.
  4.  **One-Time Opportunity:** Reinstatement, if granted, is final. Any subsequent violation or re-enrollment would result in a permanent, non-appealable ban.

  ### III. RATIONALE FOR DENIAL OF CURRENT PETITION

  The decision to deny Mr. [Name]'s petition, despite evidence of rehabilitation, rests on the principle of **Notice and Consistency**.

  When Mr. [Name] signed the lifetime exclusion form two years ago, the regulatory language was unambiguous: "There is no way back." This absolute language serves as a critical psychological barrier for individuals in crisis. It is designed to remove the option of negotiation during moments of weakness. To grant an exception now, however compassionate, signals to current and future participants that the "lifetime" designation is negotiable. This could weaken the deterrent effect for others currently considering the lifetime option, potentially leading them to choose it lightly under the assumption that they can reverse it later if they change their minds.

  Furthermore, a two-year window of stability, while commendable, is clinically insufficient to guarantee long-term remission for a disorder severe enough to result in the loss of marriage and life savings. Granting reinstatement now would set a precedent that a relatively short period of recovery overrides the long-term risk assessment made at the time of exclusion.

  ### IV. THE STRONGEST OBJECTION TO REINSTATEMENT

  In recommending a prospective reinstatement process, the Subcommittee must address the formidable argument raised by dissenting members: **That allowing any path to reinstatement fundamentally defeats the purpose of the lifetime ban.**

  This objection is rooted in the pathology of gambling disorder itself. The core mechanism of addiction is often a delusion of control—the genuine, deeply felt belief that one has "fixed" the problem and can now gamble safely. As one dissenting member noted, *"A person in the grip of the disorder will always feel recovered enough to gamble again. That is the nature of the disease. The program exists specifically to override that self-assessment."*

  There is significant merit to this view. Unlike alcohol or drug addiction, where total abstinence is the standard goal, gambling reinstatement requires the individual to return to the very stimulus that triggered the disorder. There is no "safe" level of gambling for a pathological gambler. By creating a reinstatement process, the Board risks validating the addict's belief that they can return to the environment that nearly destroyed them.

  Even with a five-year waiting period and clinical assessments, there is no diagnostic tool that can predict with 100% certainty that an individual will not relapse upon re-exposure to a casino floor. If a reinstated individual relapses and suffers catastrophic financial loss, the state shares moral liability for placing them back in harm's way. The objection argues that the only truly protective measure is the permanent removal of the option, acting as a paternalistic safeguard against the individual's own compromised decision-making capabilities.

  We acknowledge this risk. It is the primary reason we have recommended a five-year minimum waiting period (more than double the time the current petitioner has served) and a "one-time only" clause. The new protocol is not designed to facilitate a return to gambling, but to provide a narrow, rigorously guarded exit ramp for the rare cases where the disorder has been genuinely arrested, while accepting that the risk of relapse can never be fully eliminated.

  ### V. CONCLUSION

  The Subcommittee recommends the Board uphold the denial of Mr. [Name]'s petition to preserve the integrity of existing contracts. However, we urge the Board to modernize the VSEP for future enrollees by adopting the Prospective Reinstatement Protocol outlined above. This approach balances the sanctity of regulatory agreements with a compassionate, medically informed understanding of addiction recovery, while maintaining robust safeguards against the inherent risks of relapse.

  **Vote:** 4-1 in favor of Denial and Policy Recommendation.
  **Submitted by:** [Your Name], Citizen Member, VSEP Subcommittee.
