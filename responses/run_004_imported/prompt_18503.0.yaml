answer: |-
  This is a profoundly rich ethical knot, precisely the kind that fuels serious fiction. You are asking for rigor, so let's disentangle the strands without letting you off the hook, but also without conflating distinct moral categories.

  To answer your core question directly: **No, your past action does not logically invalidate the truth of your accusation against R. However, it fundamentally compromises your standing to deliver that accusation in the manner you did.**

  Priya is pointing out a social and moral contradiction; you are defending a logical truth. Both are valid, but they operate in different spheres. To understand this rigorously, we need to separate three distinct variables: the nature of the borrowing, the remediation of the harm, and the administration of justice within the group.

  ### 1. The Spectrum of Appropriation (Bones vs. Flesh)
  You are treating your action and R.'s action as the "same kind of thing," just different degrees. Ethically, they may belong to different categories entirely.

  *   **Your Action (Structural Borrowing):** You took the "bones" of a scene. In craft terms, this is often indistinguishable from influence. If you changed the dialogue, the setting, the character motivations, and the prose style, you engaged in *structural mimicry*. While ethically murky without acknowledgment, it is generally considered part of the osmotic process of a workshop. Ideas are not copyrightable; expression is. You borrowed an architectural blueprint but built a different house.
  *   **R.'s Action (Substantive Replication):** You describe R.'s chapter as "almost identical" in "overall shape and several individual scenes." If R. copied specific beats, reveals, and scene constructions without transformative effort, he crossed from *influence* into *appropriation*. He didn't just use the blueprint; he walked into the other writer's house, rearranged the furniture slightly, and invited people over for a tour.

  **The Rigor:** Your action sits in the gray zone of "unacknowledged debt." R.'s action sits in the black zone of "plagiarism of structure and sequence." You are right that his act is worse, but Priya is right that your presence in the gray zone makes you a compromised witness.

  ### 2. The Ethics of Remediation (Silence vs. Stasis)
  This is the most critical distinction regarding your guilt.

  *   **You:** You recognized the debt (consciously or via Priya's reminder), and you **fixed it** before the work entered the public sphere (publication). You engaged in silent restitution. You absorbed the cost of rewriting to ensure the final product was ethically clean, even if the history remains hidden. The harm to the original writer was mitigated because your published work no longer competes with or devalues their specific scene.
  *   **R.:** R. has presented the work to the group *as is*. He has not rewritten it. He has not acknowledged the source. The harm is active and ongoing. If that novel is published, the original writer (who is in an MFA program, i.e., building a career) could face direct competition from a derivative work.

  **The Rigor:** Your ethics were *retroactive*; R.'s ethics are *current*. You prioritized the integrity of the final published work over your ego (by rewriting). R. is prioritizing his current convenience over the integrity of the work and the original author. This makes your criticism of the *act* valid, even if your history is messy.

  ### 3. The Administration of Justice (The Call-Out)
  Here is where Priya's critique lands with the most force. You are the facilitator of this workshop. That role carries a duty of care to all members, including R.

  *   **The Tu Quoque Fallacy:** Logically, "You did it too" does not mean "What I did is okay." R. is still wrong.
  *   **The Standing Problem:** Morally, when you claim "this isn't something one working writer does to another," you are invoking a universal standard. When you have violated that standard (even if less severely), you lose the moral authority to enforce it *publicly*.
  *   **The Method:** By calling R. out "in front of everyone" and "bluntly," you prioritized your own righteousness over the group's cohesion and R.'s dignity. A facilitator's duty, especially given their own hidden sins, is to handle plagiarism allegations privately first. You should have taken R. aside, compared the texts, and asked for an explanation.

  **The Rigor:** You were right about the *crime*, but you may have committed a *procedural error* in the judgment. You acted as the accuser, judge, and executioner in a public square, while standing in a glass house. Priya isn't saying R. is innocent; she is saying your *method* of accusation was hypocritical and damaging to the workshop's trust.

  ### 4. Synthesis: Does it bear on the business of calling him out?
  **Yes and No.**

  *   **No:** It did not stop you from having the business of protecting the former member's intellectual property. Someone needed to say something. If you hadn't, and the original author found out, the workshop could be liable for harboring plagiarism.
  *   **Yes:** It should have dictated *how* you said it. Because of your history, you owed the group a higher standard of discretion, not a lower one. You overcompensated for your hidden guilt with public aggression.

  ### 5. For The Novel
  You mentioned you want to understand this to put it on the page. This is excellent material. The tension you are feeling is the tension of **moral ambiguity**, which is far more compelling than clear-cut villainy.

  If you write this dynamic, consider these nuances:
  *   **The Accuser's Secret:** The character who calls out the plagiarist shouldn't just feel guilty; they should feel a terrifying recognition. They see their younger self in the plagiarist, and they hate it. The anger they feel at the plagiarist is actually displaced self-loathing.
  *   **The Nature of the Theft:** Make the theft complex. Not just copying words, but stealing a *turn of plot* that saved the thief's book. This raises the stakes.
  *   **The Resolution:** In real life, you want a clean answer. In fiction, deny it. Perhaps the accuser realizes that by exposing the thief, they risk exposing themselves. Do they stay silent to protect their own secret, thereby allowing the theft to continue? Or do they speak, knowing it might unravel their own reputation?

  ### A Path Forward
  To resolve this in your life (so you can write about it clearly):

  1.  **Acknowledge Priya's Point:** She is right. Your history limits your standing. You don't need to confess your sin to the group (that would be performative and disruptive), but you should acknowledge to yourself that your reaction was fueled by a need to distance yourself from your own past behavior.
  2.  **Repair with R.:** If possible, have a private conversation with R. Apologize for the *public nature* of your call-out, without walking back the concern about the similarity. "I spoke out of turn in the group. I was protective of the community, but I should have spoken to you privately. However, the issue of the similarity remains something we need to address."
  3.  **Reframe the Guilt:** You are not a fraud. You are a writer who learned a lesson three years ago and corrected it. R. is a writer currently making the mistake you made. You are the only one in the room with the experience to recognize it. That makes you the right person to identify the problem, but the wrong person to preach the sermon.

  You are living in the gap between **being right** and **being good**. That is exactly where your novel should live.
