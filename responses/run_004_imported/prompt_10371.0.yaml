answer: |-
  This is one of the most common and productive points of confusion in mechanism design. First off, give yourself credit: noticing this tension means you're actually engaging with the material deeply. Your study group is right to be suspicious, but your professor isn't "cheating."

  The short answer is: **The Gibbard-Satterthwaite (G-S) theorem has specific assumptions, and every example your professor gave violates at least one of them.**

  "Strategy-proof" is being used consistently (it always means "truth-telling is a dominant strategy"), but the *context* changes whether the impossibility theorem applies. G-S is not a law of physics; it is a logical result that holds only within a specific boundary. Once you step outside that boundary, strategy-proof, non-dictatorial mechanisms become possible.

  Here is the reconciliation, broken down by the specific "escape hatches" your professor used.

  ### 1. The Gibbard-Satterthwaite Baseline
  To see why the examples don't contradict the theorem, we need to be precise about what G-S actually says. It states that for a **social choice function** (a rule that picks one winner from a list of candidates), if:
  1.  **There are 3 or more outcomes.**
  2.  **The domain of preferences is unrestricted** (voters can have *any* logical ranking of the outcomes).
  3.  **The rule is surjective** (every outcome can win under some scenario).

  **Then:** The rule is either dictatorial or manipulable.

  Your study group is treating this as "Strategy-proofness is impossible." The reality is "Strategy-proofness is impossible **without restricting preferences or changing the setting.**"

  Here is how your professor's examples bypass the theorem.

  ### 2. The Median Voter Rule (Domain Restriction)
  **The Setup:** You are choosing a location on a line (e.g., where to build a library).
  **The Escape Hatch:** **Restricted Domain (Single-Peakedness).**

  G-S assumes voters can have *any* preference ordering. For example, with candidates A, B, and C, a voter could prefer A > C > B.
  However, in the median voter model, preferences are **single-peaked**. If the options are locations on a line, a voter has an ideal point, and their utility strictly decreases as you move away from it in either direction.
  *   *Why this matters:* This eliminates "multi-peaked" preferences (e.g., loving the far-left and far-right options but hating the middle).
  *   *The Result:* Once you restrict the domain to single-peaked preferences, the G-S theorem no longer applies. Black's Median Voter Theorem shows that majority rule becomes strategy-proof in this specific domain. You didn't break the theorem; you stepped outside its jurisdiction.

  ### 3. The VCG Mechanism (Transfers & Quasi-Linearity)
  **The Setup:** Auctions or public projects where money changes hands.
  **The Escape Hatch:** **Quasi-Linear Preferences & Transfers.**

  G-S is a theorem about **social choice without transfers**. It assumes the only thing the mechanism decides is "who wins" or "what policy is chosen."
  *   *Why this matters:* VCG (Vickrey-Clarke-Groves) works because it uses **money** to align incentives. It charges agents payments (or gives subsidies) that internalize the externality they impose on others.
  *   *The Preference Restriction:* VCG also relies on **quasi-linear utility** ($U = \text{Value} - \text{Payment}$). This is a massive restriction on preferences. In G-S, preferences are ordinal rankings. In VCG, preferences are cardinal and separable from money.
  *   *The Result:* Because you introduced transfers and restricted preferences to be quasi-linear, you are no longer in the G-S framework. You are in the realm of "Mechanism Design with Transfers," where the Green-Laffont-Holmstrom theorem applies (which has its own impossibility results regarding budget balance, but allows for strategy-proofness).

  ### 4. Serial Dictatorship (Private Goods vs. Public Outcomes)
  **The Setup:** Allocating dorm rooms or course seats.
  **The Escape Hatch:** **Private Goods Structure (Domain Restriction).**

  This is the subtlest one. In G-S, the "alternatives" are public social states (e.g., "Candidate A wins"). Everyone cares about the *same* outcome.
  In dorm allocation, the outcome is a **matching** (who gets which room).
  *   *Why this matters:* In a standard G-S setting, Agent 1 might care deeply about whether Agent 2 gets Room B or Room C. In dorm allocation, we assume **private values**: Agent 1 *only* cares about which room *they* get. They are indifferent between any two matchings where they receive the same room, regardless of what others get.
  *   *The Result:* This indifference creates a massive restriction on the domain of preferences over the set of all possible matchings. Because agents do not have arbitrary preferences over the full social outcome (the full matching), G-S does not apply. Serial Dictatorship is indeed strategy-proof, and while it sounds like a "dictatorship," it is not a *G-S Dictatorship* (a single agent who dictates the entire social outcome regardless of others). It is a sequence of local dictatorships over remaining items, permitted because preferences are restricted to private goods.

  ### Summary for Your Study Group

  You can reconcile the theorem and the examples with this mental model:

  | Mechanism | Why it doesn't violate Gibbard-Satterthwaite |
  | :--- | :--- |
  | **G-S Theorem** | Applies to **Public Choice**, **No Money**, **Unrestricted Preferences**. |
  | **Median Voter** | Violates **Unrestricted Preferences** (assumes Single-Peakedness). |
  | **VCG** | Violates **No Money** (uses Transfers) & **Ordinal Preferences** (assumes Quasi-Linearity). |
  | **Serial Dictatorship** | Violates **Public Choice** (assumes Private Goods/Restricted Domain over matchings). |

  **The Takeaway:**
  Your professor isn't using "strategy-proof" loosely. They are teaching you the **boundary conditions** of impossibility theorems. The lesson of Gibbard-Satterthwaite isn't "mechanism design is hopeless." The lesson is: **"If you want a strategy-proof mechanism, you must be willing to restrict the domain of preferences, introduce money, or accept a dictatorship."**

  Every time your professor presents a strategy-proof mechanism later in the course, your job is to play "spot the assumption": *Which G-S assumption did we drop to make this possible?* That is essentially the entire rest of the seminar.
