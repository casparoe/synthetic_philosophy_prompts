          4.  Final Verdict.

      *(Self-Correction during drafting)*: Make sure to clarify that "Dutch Book" usually refers to a bookie taking a loss, but in philosophy, it refers to the *bettor* having inconsistent beliefs. In Devin's case, the *apps* are the bookies. If the apps allow a Dutch Book *against them*, their pricing is incoherent. Lena is right that incoherence = vulnerability. Devin is right that vulnerability $\neq$ "irrational mind" in the case of software.

      *Let's refine the "Vault" analogy.* A vault code isn't a probability distribution. A better analogy for Devin would be a currency exchange market. If EUR->USD->GBP->EUR yields more EUR than you started, is the market "irrational"? No, it's just inefficient. This supports Devin more than the vault analogy. I should mention this.

