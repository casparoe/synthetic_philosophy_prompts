answer: |-
  Good morning. Thank you all for being here to honor Grandma.

  For those of you who knew her well, especially in these last nine years, you know that her story wasn't just about what she lost to Alzheimer's. It was about what she fought to keep. And if you knew her in the end, you knew about the notebook.

  It was worn, leather-bound, always in her pocket or on her lap. Inside were the things the rest of us take for granted: our names, who was married to whom, the date of her anniversary, the fact that Grandpa had passed before her. She consulted it constantly. She trusted it completely. When she looked at me, sometimes there was a moment of hesitation, a flicker of uncertainty. Then she'd open the book, run her finger down the page, and her face would light up. "Oh," she'd say. "This is [Your Name]. I love him."

  For a long time, looking at that notebook broke my heart. I think it broke all of our hearts. It was a visible measure of how much her own memory was slipping away. It felt like a crutch, a sign that she wasn't fully there anymore.

  But my mother said something to me recently that I can't stop thinking about. She told me that near the end, she felt like Grandma's mind was actually *in* that notebook.

  I've been studying philosophy lately, and we talk a lot about how the human mind works. We usually imagine our minds as things locked inside our skulls, hidden away behind our eyes. But the more I think about Grandma, the more I think that view is too small. Who we are isn't just the biology of our brains. Who we are is also what we hold onto, what we trust, and how we stay connected to the people we love.

  Grandma's brain was failing, yes. But her love for us wasn't just a chemical reaction that could fade; it was a commitment. And when her biology could no longer hold that commitment alone, she found a way to extend it. She outsourced her memory to the paper so she wouldn't have to outsource her love.

  There is a question philosophers ask: If you rely on something outside yourself so completely, so trustingly, and so automatically—does that thing become part of you? Is the notebook just a tool, or is it a piece of her mind?

  I don't think we need to settle that debate to find the truth in it. The truth is, when she opened that book, she wasn't just reading data. She was reclaiming her relationship with us. Every time she checked the page to remember that Grandpa had died, she was choosing to grieve him all over again, rather than forgetting him entirely. Every time she looked up my name, she was choosing to know me as her grandchild, rather than a stranger.

  In a very real sense, she kept her mind alive by weaving it into the world around her. She kept *us* alive in her mind by writing us down.

  So, I don't see the notebook as a symbol of her decline anymore. I see it as a testament to her endurance. It proves that she didn't give up on being herself, even when being herself became hard work. It proves that her identity wasn't just something she *had*; it was something she *did*. It was an action. It was the act of turning the page, finding the name, and smiling.

  My mother was right. In those final years, a part of her really did live in those pages. And the beautiful thing about that is that pages don't die. The notebook is still here. The love she curated in it is still here.

  We often worry about what survives after someone passes. We worry that when the brain stops, the person is gone. But Grandma taught me that the mind can spill over. It spills into the things we write, the stories we tell, and the people who remember us. She kept us in her notebook for as long as she could. Now, it's our turn to keep her in our minds.

  She loved us enough to write it down. And that is something that no disease could ever erase.

  Thank you.
