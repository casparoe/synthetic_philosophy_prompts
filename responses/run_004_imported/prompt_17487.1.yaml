      *   **Caveat on Base Rates:** Briefly touch upon *why* base rates differ (historical bias vs. actual risk) without getting too bogged down in sociology, but acknowledge it matters for the "business necessity" argument.

  6.  **Refining the content (Self-Correction/Nuance):**
