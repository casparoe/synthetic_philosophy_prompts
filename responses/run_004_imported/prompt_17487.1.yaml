          2.  If yes, is there a principled answer for which to prioritize, or is it a policy/compliance judgment disguised as technical?

  2.  **Identify the Underlying Mathematical/Statistical Concept:**
      *   The user is describing the **Impossibility Theorem of Fairness** (often attributed to Chouldechova, 2017, or Kleinberg et al., 2016).
      *   Specifically, the conflict is between **Calibration** (Observation 1) and **Equalized Odds** / **Error Rate Balance** (Observation 2).
      *   The crucial condition that makes them incompatible is **different base rates** (prevalence of default) across groups. The user explicitly states: "our overall default rate is meaningfully higher for Black applicants than white applicants in this data."

  3.  **Address Question 1: Is there a structural reason?**
      *   **Yes.** It's mathematically proven.
      *   *Explanation:* If Group A has a higher default rate than Group B, and the model is calibrated (predicted risk = actual risk), then the threshold for approval must effectively differ to achieve equal error rates. If you force equal error rates, you break calibration. If you keep calibration, error rates differ.
      *   *Analogy:* The "squeezing a balloon" analogy the user used is actually perfect. I should validate that.
      *   *Reference:* Mention the COMPAS recidivism algorithm controversy (ProPublica vs. Northpointe). This matches the user's vague memory.

  4.  **Address Question 2: Which one to prioritize? (The Normative/Policy Question)**
      *   **There is no technical "correct" answer.** This is a value judgment.
      *   *Calibration:* Ensures a score means the same thing for everyone. Good for interpretability and long-term risk management.
      *   *Error Rate Balance (Equal Opportunity/Odds):* Ensures the *consequences* of mistakes are distributed equally. Good for individual justice/fairness in outcomes.
      *   *Legal/Compliance Context:* In US lending (ECOA, Reg B), the legal standard is often about *disparate impact* vs. *business necessity*. It's not strictly defined as "must have equal error rates." However, regulators (CFPB) are increasingly looking at proxy discrimination and outcomes.
      *   *The "Business Necessity" Defense:* If calibration is tied to risk pricing, breaking it might violate sound underwriting (charging high risk people low rates). But if error rates lead to discriminatory denial, that's a legal risk.
      *   *Conclusion:* It is absolutely a judgment call that compliance/legal/business leadership must make, not just the data scientist. The DS provides the trade-off curve; the business picks the point.

