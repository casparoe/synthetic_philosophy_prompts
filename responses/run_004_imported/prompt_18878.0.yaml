answer: |-
  This is a textbook instantiation of the "Problem of Profligate Omissions" (Lewis 1986) versus the "Normative/Default" solution (Hart & Honoré 1959; McGrath 2005; Halpern & Pearl 2005). You're right that the literature is fussy here; the debate hinges on whether causation is a purely physical relation or a model-relative one that incorporates expectations.

  Here is the move-by-move breakdown, followed by the missing piece and the verdict.

  ### Move-by-Move Analysis

  **(1) Marcus:** *Sam caused the corruption... he's the one who didn't act when he should've.*
  *   **Analysis:** Marcus states the intuitive verdict. He relies on the pre-theoretic intuition that specific omissions are causes while background conditions are not.
  *   **Winner:** **Marcus.** While philosophically thin, he correctly identifies the datum any theory of causation needs to capture: our asymmetric judgments about Sam and Priya.

  **(2) Ilana:** *Priya also didn't act... so did the sysadmin... "didn't-prevent-it" theory... must be wrong.*
  *   **Analysis:** Ilana deploys the *Profligacy Objection*. If causation is simple counterfactual dependence ($\neg C \square\to \neg E$), then every necessary condition for prevention is a cause. This leads to the absurd result that everyone with SSH access caused the corruption.
  *   **Winner:** **Ilana.** She successfully demonstrates that a naive counterfactual theory cannot distinguish Sam from Priya. This is a lethal objection to simple counterfactualism.

  **(3) Marcus:** *Sam was on call... departure from what was supposed to happen... asymmetry isn't arbitrary.*
  *   **Analysis:** Marcus appeals to the **Default/Deviant** distinction. This is the standard solution in the literature (e.g., McGrath). The idea is that we compare the actual world not to *any* possible world where the action occurs, but to the "normal" or "default" world. Sam's inaction is a deviation from the norm; Priya's is not.
  *   **Winner:** **Marcus.** He offers the only viable theoretical mechanism to solve Ilana's profligacy problem without abandoning omission causation entirely.

  **(4) Ilana:** *That just tracks blameworthiness... disk doesn't know about the on-call spreadsheet... obligations getting smuggled in.*
  *   **Analysis:** Ilana raises the **Is/Ought Objection**. She argues causation is descriptive (physics), while duty is prescriptive (norms). Mixing them is a category error. This is the Beebee (2004) line: omissions aren't causes; they are explanations grounded in norms.
  *   **Winner:** **Ilana.** She correctly identifies the metaphysical cost of Marcus's move. If causation supervenes on the physical, a spreadsheet entry cannot change causal facts.

  **(5) Marcus:** *Fine, but then you're stuck saying dozens of people caused the corruption... strike against the counterfactual story, not against ordinary usage.*
  *   **Analysis:** Marcus uses a **Methodological Reductio**. He argues that a theory of causation that violates all ordinary causal judgments (by making everyone a cause) is worse than a theory that incorporates norms. This aligns with the "contextualist" or "pragmatic" turn in causation (e.g., Maslen 2004).
  *   **Winner:** **Marcus.** In metaphysics, saving the phenomena (our robust intuitions about cases) is a primary theoretical virtue. Ilana's theory fails to distinguish the cases; Marcus's distinguishes them.

  **(6) Ilana:** *Duty can't be doing the causal work... if the lab had never set up an on-call rotation... disk still fills up in exactly the same way, physically speaking.*
  *   **Analysis:** Ilana doubles down on **Physical Supervenience**. She argues that causal structure must be intrinsic to the physical history, not extrinsic social facts.
  *   **Winner:** **Ilana (on strict metaphysics), Marcus (on causal modeling).** If causation is a relation in the "God's eye" physical view, Ilana wins. But if causation is an interventionist relation defined over a *model* (Woodward 2003; Halpern & Pearl 2005), then the model *includes* normality conditions as parameters. In the dominant interventionist framework, Marcus is right that the causal *model* changes even if the physics doesn't.

  ### What Both Are Missing

  Both are conflating **Causal Relation** (the ontological dependency) with **Causal Selection** (the pragmatic choice of which factor to label "the cause").

  *   **The Missing Distinction:** Most contemporary solutions (e.g., Hitchcock 2007) argue that while the *counterfactual dependencies* are indeed profligate (Ilana is right about the physics), the definition of *Actual Causation* includes a "normality" condition to filter these dependencies (Marcus is right about the judgment).
  *   **The Interventionist Turn:** Ilana assumes causation must be purely physicalist. Marcus assumes causation tracks blame. The missing middle is **Structural Equation Modeling (SEM)**. In SEM, we define a causal model where variables have "default values." Sam's variable has a default of `1` (act); Priya's has a default of `0` (don't act). The causal calculation is done *relative to this model*. This means Marcus is right that the asymmetry is "causal" (within the model), but Ilana is right that it depends on how we construct the model (which includes norms). They are talking past each other: Ilana is arguing about the *physics*, Marcus is arguing about the *model*.

  ### Overall Assessment

  Ilana wins the metaphysical high ground by pointing out that physical facts don't care about rosters. However, Marcus wins the debate on **causation** because the philosophical consensus on omissions has moved toward model-relative accounts that incorporate normality conditions to avoid profligacy. Ilana's position forces us to say there is *no causal difference* between Sam and Priya, which renders the concept of "causation by omission" useless for distinguishing cases. Marcus's position preserves the distinction we actually care about. Since the goal of a theory of causation is to explicate our causal concepts (which include the Sam/Priya asymmetry), Marcus's framework is more successful.

