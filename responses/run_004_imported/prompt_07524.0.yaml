      *   *Correction:* Make sure Sam doesn't sound like a cold calculator. Singer cares deeply about suffering. Emphasize the *pain* in the protocols.
      *   *Nuance:* Nozick actually introduced this idea in *Anarchy, State, and Utopia* to show a problem, not necessarily to solve it. But for the dialogue, Alex will treat it as a defensible position (often called "indirect duty" or "human-centered deontology").
      *   *Focus:* Keep bringing it back to the *work* the user does. The protocols. The mice. The potential human benefits.

