      *   **Round 1: The Core Conflict.** Alex states the split view. Sam attacks it as speciesism.
      *   **Round 2: The Marginal Cases.** This is crucial. Sam brings up the infant vs. chimp. Alex needs a non-biological defense (social relational view or slippery slope).
      *   **Round 3: Rights vs. Suffering.** Alex argues rights are trumps. Sam argues suffering is the only currency that matters.
      *   **Round 4: The "Cop-out" Charge.** Sam accuses Alex of wanting to have it both ways. Alex admits it's a compromise but argues it's the *only* workable one for human society.
      *   **Closing:** No neat resolution (because philosophy doesn't solve this easily), but a mutual acknowledgement of the burden.

  5.  **Refining the Arguments (Self-Correction during drafting):**
