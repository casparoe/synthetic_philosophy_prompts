answer: |-
  Here is a constructed case designed to isolate the problem of inconstant counterpart relations, followed by an analysis of its philosophical implications for your seminar.

  ### The Case of Justice Pendelton

  **The Protagonist:**
  Consider **Arthur Pendelton**, a contemporary Supreme Court Justice known for a singular, landmark ruling (*The Pendelton Decision*) regarding digital privacy. In the actual world (@), Arthur is defined by two clusters of properties:
  1.  **Intrinsic/Biographical:** He was born to specific parents in Ohio, has a specific genetic makeup, and suffered a childhood injury that nearly ended his athletic career before he turned to law.
  2.  **Extrinsic/Functional:** He authored *The Pendelton Decision*, holds the specific office of Associate Justice, and is socially recognized as the "Guardian of Digital Privacy."

  **The Counterfactual World (W):**
  In world W, the historical divergences of the 20th century resulted in a situation where two distinct individuals exist, both of whom bear a strong resemblance to @-Arthur, but in divergent respects:
  *   **Individual X (The Biological Match):** X shares @-Arthur's exact genetic origin, parental lineage, and childhood injury. However, in W, X recovered from the injury, pursued medicine, and is now a renowned surgeon. X never went to law school and never authored *The Pendelton Decision*.
  *   **Individual Y (The Functional Match):** Y has different parents and a different genetic origin. However, Y pursued the exact same legal career, holds the office of Associate Justice in W's Supreme Court, and authored a ruling identical in text and legal impact to *The Pendelton Decision*. Y is socially recognized in W as the "Guardian of Digital Privacy."

  **The Two Counterpart Relations:**
  1.  **$C_{bio}$ (Biological/Historical Salience):** This relation privileges spatiotemporal continuity of origin and intrinsic physical constitution. In contexts concerning family history, medical liability, or personal identity in a biological sense, a competent speaker weights these properties heavily.
      *   *Verdict:* In W, **X** is the unique counterpart of @-Arthur under $C_{bio}$. Y is too dissimilar in origin.
  2.  **$C_{role}$ (Functional/Social Salience):** This relation privileges causal role, professional achievement, and social recognition. In contexts concerning legal precedent, political responsibility, or the history of ideas, a competent speaker weights these properties heavily.
      *   *Verdict:* In W, **Y** is the unique counterpart of @-Arthur under $C_{role}$. X is too dissimilar in career and impact.

  **The Divergent *De Re* Claim:**
  Consider the modal statement:
  > **(M)** "Arthur Pendelton could have failed to author *The Pendelton Decision*."

  *   **Relative to $C_{bio}$:** The counterpart in W is X. X did not author the Decision. Therefore, **(M) is True**.
  *   **Relative to $C_{role}$:** The counterpart in W is Y. Y *did* author the Decision. Therefore, **(M) is False**.

  ***

  ### Philosophical Weight and Analysis

  **1. Does this vindicate the critic or Lewis?**
  This example crystallizes the tension between **modal contextualism** (Lewis) and **modal realism about individuals** (the critic).

  *   **The Critic's Charge:** The critic argues that *de re* modality ought to track objective facts about *Arthur*, not facts about our conversational interests. If the truth of (M) fluctuates based on whether we are in a courtroom or a hospital, then counterpart theory fails to capture *metaphysical* possibility. It reduces "what Arthur could have done" to "which similarity metric we are currently using." The critic contends that there should be a fact of the matter about whether *Arthur himself* (not a counterpart) could have skipped the ruling. By fragmenting Arthur into $C_{bio}$-Arthur and $C_{role}$-Arthur, Lewis allegedly loses the unity of the subject.
  *   **Lewis's Defense:** Lewis would argue that the critic is reifying a linguistic illusion. Ordinary modal talk *is* vague and context-sensitive. If you ask a geneticist "Could Arthur have been a surgeon?" they say "Yes." If you ask a legal scholar "Could Arthur have failed to write this ruling?" they say "No" (because then he wouldn't be the Justice we are discussing). Lewis claims his theory simply makes explicit the parameters that ordinary language leaves implicit. There is no "view from nowhere" where similarity weights are fixed; therefore, there is no single, context-independent truth value for (M). The example vindicates Lewis if you accept that ordinary modal discourse is inherently pragmatic rather than purely descriptive of mind-independent modal facts.

  **2. Does the Transworld Identity Theorist escape?**
  The transworld identity theorist (Kripke/Plantinga) claims Arthur is numerically identical across worlds. They avoid the "multiple counterparts" problem by insisting there is only *one* Arthur in W. However, they do not escape the underlying worry; they merely **relocate the vagueness**.

  *   **The Relocation:** To identify Arthur in W, the transworld theorist must specify which properties are **essential**.
      *   If *origin* is essential (Kripke's view), then Y is not Arthur. Arthur is X. Thus, (M) is True.
      *   If *role* or some qualitative essence is privileged, one might argue Y is Arthur (though Kripke rejects this for persons).
  *   **The Residual Problem:** The debate shifts from "Which similarity metric is salient?" to "Which properties constitute Arthur's essence?" This is equally contestable. Why is origin essential but career accidental? Kripke appeals to intuition, but as your Pendelton case shows, intuitions diverge based on context (medical vs. legal).
  *   **Conclusion:** The transworld theorist gains a binary truth value for (M) only by stipulating a rigid essence. But the justification for that essence is often as context-dependent as Lewis's similarity weights. They avoid the *structural* problem of one-to-many counterpart relations, but they inherit the *epistemic* problem of determining transworld identity conditions. They trade Lewis's explicit contextualism for a hidden essentialism that may be just as sensitive to conversational context when pressed to justify *why* certain properties fix identity.

  **Seminar Tip:**
  When presenting this to your class, you might press them on whether the "essence" chosen by the Kripkean is truly metaphysical or merely a hardened version of Lewis's "salience." If the Kripkean says "Origin is *always* essential," ask them to justify why the legal scholar's intuition (that the Justice *is* the author, regardless of biology) is metaphysically mistaken rather than just tracking a different legitimate concept of personhood. This bridges the gap between the "Humphrey objection" and this deeper structural disanalogy.
