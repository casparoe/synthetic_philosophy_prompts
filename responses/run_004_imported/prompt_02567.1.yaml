      *   *Self-Correction during drafting:* I need to make sure I don't misrepresent Fuller. Fuller isn't just saying "unjust law isn't law" (that's Aquinas/Classical). Fuller is specifically about the *internal morality of law* (procedural natural law). I need to emphasize that the Nazi system failed the *procedural* requirements of lawfulness, not just substantive justice.
