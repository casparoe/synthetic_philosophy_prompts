  I've been going down a rabbit hole on theories of truth and keep running into Kripke's "fixed-point" theory of truth, the one that's supposed to let a language contain its own truth predicate instead of needing Tarski's endless object-language/metalanguage tower. I'm a software engineer (mostly backend/infra stuff) with zero formal philosophy training, but the way he builds up the truth predicate in stages (monotone operator, iterate till nothing new gets added, take the least fixed point) sounds basically identical to the fixed-point stuff we use for recursive definitions in denotational semantics / dataflow analysis. Given that starting point, can you walk me through how the construction actually works with Kleene's three-valued logic, and explain why the liar sentence ends up "ungrounded" (neither true nor false) rather then just coming out false? Also I keep seeing people say this doesn't really kill the paradox because of some "revenge" issue once you try to say something like "this sentence isn't true" from outside the construction -- whats actually going on there?
