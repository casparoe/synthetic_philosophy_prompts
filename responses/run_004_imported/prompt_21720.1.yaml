answer: |-
  **Title:** The Cost of Consistency: Why the Frege-Geach Problem Levels the Playing Field Rather Than Refuting Expressivism

  **Introduction**

  For decades, the Frege-Geach problem has functioned as the primary gatekeeper for metaethical expressivism. The challenge is deceptively simple: if moral sentences express non-cognitive attitudes rather than describing facts, how do they function logically in unasserted contexts, such as the antecedents of conditionals? If "lying is wrong" expresses disapproval of lying, what does "If lying is wrong, then getting your brother to lie is wrong" express? Nobody is disapproving of anything in the antecedent. Consequently, critics argue, expressivists cannot account for the validity of moral reasoning, specifically *modus ponens*, without abandoning their core thesis.

  However, the landscape of this debate has shifted dramatically since Geach and Searle first formulated the objection. Sophisticated expressivists, most notably Simon Blackburn and Mark Schroeder, have developed semantic frameworks that technically validate moral inferences. Yet, as James Dreier and others have pointed out, solving the formal problem often comes at a steep theoretical cost. In this paper, I argue that the Frege-Geach problem should no longer be viewed as a refutation of expressivism, but rather as a *leveling mechanism*. The strongest expressivist solutions succeed in validating moral logic only by constructing a semantics of attitudes that is structurally isomorphic to the semantics of propositions. While this saves expressivism from incoherence, it negates the theoretical parsimony that made the view attractive in the first place. The verdict, therefore, is not that expressivism fails, but that the Frege-Geach problem forces expressivism to pay a semantic tax that brings its theoretical virtues into equilibrium with realism.

  **The Embedding and Validity Distinction**

  To evaluate the success of expressivist replies, we must distinguish between two layers of the Frege-Geach problem: the *embedding problem* and the *validity problem*. The embedding problem concerns meaning: how can a moral sentence mean the same thing in an asserted context as it does in an unasserted one? The validity problem concerns logic: if moral sentences lack truth conditions, how can arguments containing them be valid?

  Classical expressivism (Ayer, Stevenson) stumbled on both. If "Wrong(lying)" is merely an expression of emotion like "Boo lying!", then "If Boo lying, then Boo inducing lying" is nonsense. There is no proposition to be the antecedent, and thus no truth-preservation to track. Geach's insight was that logic requires stability of meaning across contexts. If the meaning changes between assertion and embedding, the argument commits the fallacy of equivocation.

  Blackburn's quasi-realism was the first major attempt to bridge this gap. He argued that we do not need truth conditions to have validity; we need *commitment conditions*. To assert a moral claim is to undertake a commitment. To assert a conditional is to undertake a commitment to a higher-order attitude: specifically, a disapproval of holding the antecedent attitude without holding the consequent attitude. On this view, the inconsistency in *modus ponens* is not a contradiction between beliefs (A-type inconsistency), but a clash of attitudes (B-type inconsistency). A person who accepts "Wrong(lying)," accepts "If Wrong(lying) then Wrong(inducing lying)," but denies "Wrong(inducing lying)" is in a psychologically fragmented state.

  Blackburn's move is ingenious, but it leaves the validity problem only partially addressed. As Schroeder notes in *Being For*, Blackburn explains why the agent is *irrational*, but he does not fully explain why the *argument* is valid. Validity is a property of arguments, not agents. To validate the inference, we need to show that the conclusion is true (or correct) whenever the premises are, not just that denying it makes you psychologically messy.

  **Schroeder's Biforcated Semantics and the Technical Fix**

  Schroeder pushes the expressivist project further by attempting to build a formal semantics for attitudes. In *Being For*, he introduces "biforcated attitude semantics." He distinguishes between the attitude expressed by a simple moral claim (being *for* blaming for lying) and the attitude expressed by a complex claim (being *for* blaming for lying *only if* one is *for* blaming for inducing lying).

  Schroeder's crucial innovation is to treat "being for" as a relation between agents and contents, where the contents can be complex. He argues that we can define inconsistency for attitudes just as we do for beliefs. If the content of your attitude in the premises logically precludes the content of your attitude in the conclusion, the argument is valid. By constructing a logic of "acceptance" rather than "truth," Schroeder demonstrates that expressivists *can* validate *modus ponens*. The formal machinery works. If an expressivist adopts Schroeder's semantics, the charge of logical incoherence is technically defused.

  However, Schroeder himself admits that this semantics is complex and somewhat stipulative. He acknowledges the worry that he is essentially rebuilding the wheel of propositional logic inside the mind of the agent. This hesitation points toward the deeper philosophical issue: even if the logic works, *what have we gained?*

  **The Dreier Critique: Relocating the Problem**

  This is where James Dreier's critique becomes decisive. Dreier argues that many expressivist solutions to Frege-Geach merely relocate the problem rather than solving it. If the expressivist explains the validity of moral arguments by positing a structural relationship between attitudes, we must ask: what grounds that structure?

  For the realist, the structure is grounded in the world (or in the nature of truth). $P$ and $P \to Q$ entail $Q$ because of the nature of truth-preservation. For the expressivist, the structure is grounded in the nature of *rationality* or *consistency of attitude*. But Dreier presses: why is it inconsistent to hold these specific attitudes? If the answer is "because we define the logic of attitudes to mirror the logic of propositions," then the explanation is circular. We are validating moral logic by assuming a logic of attitudes that looks exactly like moral logic.

  Dreier's objection suggests that the expressivist has purchased validity at the price of explanatory depth. To solve Frege-Geach, the expressivist must posit a rich, structured realm of normative attitudes that interact according to strict logical laws. But if these attitudes have logical forms, closure conditions, and consistency requirements identical to propositions, the ontological savings of expressivism begin to vanish. We have replaced "moral facts" with "normative attitude contents," but the latter seem to do all the same heavy lifting as the former.

  **The Verdict: Theoretical Equilibrium**

  This leads to my central contention: The Frege-Geach problem has evolved from a logical refutation into a challenge of theoretical virtue.

  In the 1970s, the objection was that expressivism was *logically impossible*. Blackburn and Schroeder have shown this is false. Expressivism is logically coherent. However, the cost of that coherence is that expressivism must mimic realism's semantic structure. To validate *modus ponens*, the expressivist needs a semantics that assigns complex contents to attitudes, contents that stand in logical relations to one another.

  This creates a state of *theoretical equilibrium*. Realism explains validity easily: moral sentences express propositions, propositions have truth conditions, logic tracks truth. The cost for realism is ontological: it requires moral facts or properties. Expressivism avoids the ontological cost: it requires no moral facts. But to solve Frege-Geach, it incurs a *semantic* cost: it requires a complex, proposition-like structure for attitudes.

  Therefore, the Frege-Geach problem does not prove expressivism false. Instead, it proves that expressivism cannot be *simpler* than realism in every respect. You can save on ontology, but you must spend on semantics. The "punchline" of the Frege-Geach debate is not that expressivism fails to account for logic, but that accounting for logic is hard work for anyone, and expressivists cannot do it on the cheap.

  **Conclusion**

  Where does this leave the seminar debate? It suggests that we should stop asking "Can expressivism solve Frege-Geach?" and start asking "Is the expressivist explanation of validity theoretically preferable to the realist one?"

  If Schroeder is right, expressivists *can* validate moral inferences. But they do so by constructing a "logic of acceptance" that is structurally indistinguishable from a "logic of truth." If the structure is identical, the choice between the two views turns entirely on whether one prefers to locate that structure in the mind (attitudes) or in the world (facts). The Frege-Geach problem, properly understood, strips expressivism of its claim to superior simplicity. It forces the expressivist to admit that moral thought is logically robust, but in doing so, it forces them to build a semantic machinery that looks suspiciously like the realist's.

  My verdict is that the Frege-Geach problem is no longer a barrier to entry for expressivism, but it is a barrier to dominance. It prevents expressivism from claiming to be the "parsimonious" default. The sophisticated expressivist solutions succeed in saving the phenomenon of moral reasoning, but they do so by showing that moral reasoning is just as structurally demanding as realist metaphysics. The problem has not been solved in a way that vindicates expressivism's traditional advantages; it has been solved in a way that levels the playing field. For the purpose of this seminar, I argue we should treat Frege-Geach as a constraint on theory construction that both sides now satisfy, rather than a weapon that decides the war. The debate must now move to grounds other than logic—perhaps to metaphysics, epistemology, or phenomenology—because on the question of validity, expressivism has bought its ticket, but the price was its parsimony.
