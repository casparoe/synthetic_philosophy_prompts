          5.  Therefore, the *offer itself* signals I have info you don't.
          6.  You update your belief based on my offer.
          7.  Now the odds look worse for you. If you counter-offer, I update too.
          8.  Iterate until the expected value for both sides is zero (or negative). Trade collapses.
      *   *Analogy:* The "Lemon Problem" (Akerlof) is similar but distinct. A better analogy here is Poker. If someone raises you, you worry they have a better hand. If they *always* raise with a better hand, you fold. If they raise sometimes with bluffs, it gets complex, but the theorem assumes common knowledge of rationality which pushes towards the "fold" equilibrium in pure speculation.
