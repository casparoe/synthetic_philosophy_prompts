          *   *Q7:* (Hasty UDT) To avoid the race, I must become updateless *now*. But maybe I should think more about whether UDT is good. Isn't this a race to adopt UDT?
          *   *Q8:* (Computation) Calculating the updateless policy is hard. Doing it fast leads to errors.
          *   *Q9:* (Real world) Describe a scenario where this goes wrong.
