      *   **Task:** Draft 9-10 interview questions.
      *   **Structure:** Sequenced from easy/comfortable (letting him explain his view) to hard/challenging (pressing on weaknesses).
      *   **Required Content:**
          1.  Question on fixing the prior/vantage point (rivals have self-serving reasons to favor different starting points).
          2.  Follow-up on whether this is a dissolution or just relabeling the problem (dispute over priors vs. policies).
          3.  Question using Schelling's steering wheel analogy (mutually catastrophic threats).
          4.  Question on whether recommending rapid updatelessness is itself a hasty commitment.
          5.  Closing question on real-world instances of bad commitment races and evidence against radical updatelessness.
      *   **Format:** After each question, add a one-line note flagging the likely deflection/restatement.

  2.  **Deconstruct the Guest's Argument:**
      *   *Core Claim:* Updateless Decision Theory (UDT) or similar frameworks solve commitment races.
      *   *Reasoning:* Commitment races happen because agents update on information (like "the other guy committed") and then react. If you choose a policy *before* receiving that information (from the "original position" or "prior"), you optimize globally. You can't be beaten to the punch because your policy is already set at the logical prior.
      *   *Weaknesses:* How do you choose the prior? What if two UDT agents have different priors? Does UDT actually avoid bad equilibria (like mutual destruction) in bargaining games? Is adopting UDT itself subject to the same time pressure?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Phase 1: Warm-up (Questions 1-2)*
          *   Goal: Let him explain the "updatelessness dissolves the race" thesis.
