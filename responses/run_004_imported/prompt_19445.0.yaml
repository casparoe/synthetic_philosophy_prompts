              5.  Real-world instance + evidence against? (Q9 & Q10 combined or split). Let's split to make 10 questions total.
          *   One-line note after each? Yes.

      *   *Final Polish:* Ensure the language sounds like a philosopher speaking to another philosopher (terms like "ex ante," "meta-level," "equilibrium," "acausal").

      *(Self-Correction during drafting)*: Make sure Q3 and Q4 flow well together. Q3 asks *how* to fix the prior. Q4 asks if fixing it just moves the goalposts.
