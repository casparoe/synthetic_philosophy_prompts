answer: |-
  Good evening. For those of you who don't know me, I'm [Your Name]. I've been Priya's friend since the first year of graduate school. And for those of you who *do* know me, you know that last night, at what was supposed to be a quiet rehearsal dinner, Priya and I fell right back into the argument we've been having for fifteen years.

  It is an argument about how two people do anything together.

  Priya defends the view that when we commit to a shared goal, we become something new. A "plural subject." A genuine "We." She argues that this "We" creates obligations that neither person can break alone. You don't just have two people cooperating; you have a new entity born of joint commitment.

  I defend the other side. I argue that there is no magical "We." There is only you, and there is only me. Shared agency is just a fancy term for two individuals whose personal intentions happen to mesh, who keep checking in, and who choose, moment by moment, to stay in step.

  It sounds dry, I know. But this isn't just academic. This is the question of marriage.

  Priya believes marriage creates a new metaphysical creature. A union where "my" life and "your" life are subsumed into "our" life. On her view, the bond is binding because the "We" exists independently of our fluctuating moods.

  I believe marriage is a structure of interlocking intentions. It holds because every morning, two distinct people wake up and decide to align their plans again. On my view, you are never truly one; you are just two people dancing so closely it looks like fusion.

  We argued about this until the waiter took the menus away. But standing here today, watching Priya with [Partner's Name], I realize we were both right. And I realized something else that made me nervous about this speech.

  Under Priya's theory of joint commitment, once a joint commitment is formed, it cannot be rescinded unilaterally. Which is a very elegant, philosophical way of saying: "You signed the lease, [Partner's Name], you can't return the sofa."

  *(Pause for laughter)*

  But seriously. If I look at the way you two move through the world, I see Priya's "Plural Subject." When you speak, you often say "We decided," not "I asked him." You have built a life that feels like a single architecture. You have created a "We" that has weight, that has dignity, and that holds you accountable to something bigger than your individual whims. That is the Gilbert view. It is the safety of the bond.

  But I also see my Bratman view. I see the work. I see the mutual responsiveness. I see the way you check in when plans change, the way you negotiate the sub-plans of career and home and Sunday mornings. That "We" isn't a magic trick; it's a maintenance project. It requires two autonomous agents constantly choosing to mesh their lives. It is the freedom of the choice.

  A marriage that is only a Plural Subject risks becoming a cage, where the "We" crushes the "I." A marriage that is only Shared Agency risks becoming a business contract, where the "We" dissolves the moment the incentives change.

  You two have found the synthesis. You have built a "We" that is strong enough to feel like a single entity, but flexible enough to respect the two individuals who constitute it. You have the joint commitment that binds you, and the mutual responsiveness that keeps you free.

  Priya, I am not conceding the argument. I still think the metaphysics of the "Plural Subject" is suspicious. But looking at you tonight, I am willing to admit that whatever you two have built... it functions *as if* it is real. And perhaps, in a life like this, function is all that matters.

  So, if everyone could please raise a glass.

  To Priya and [Partner's Name]. May your joint commitments be binding, may your sub-plans always mesh, and may you never have to test the conditions under which a plural subject can be dissolved.

  To the happy couple.
