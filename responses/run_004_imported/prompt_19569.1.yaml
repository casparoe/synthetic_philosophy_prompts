      *   **User:** Psychology PhD student.
      *   **Topic:** Emotional granularity (the ability to differentiate between specific emotional states).
      *   **Method:** Private log of internal states using *invented* labels (e.g., 'tense-restless' vs. 'tense-heavy').
      *   **Validation:** Solely introspective/phenomenological ("whether it feels like what I meant before").
      *   **Goal:** Wants to turn this into a method for others to adopt.
      *   **Conflict:** A committee member expressed unease beyond standard self-report bias. The user feels this unease is justified but can't pinpoint why.
