      *   **Address the Manager's Claim:** Gently correct the "model hasn't learned the policy" framing. Models learn *patterns*, not *policies*.
      *   **Distinguish Human vs. Model Authority:** Explain *why* human judgment counts differently, even when uncertain. It's about *agency* and *responsibility*, not just accuracy.
