answer: |-
  Good evening. For those of you I haven't met yet, I'm the son who went into landscaping. I spend my days worrying about drainage, soil composition, and whether a oak tree is going to drop a limb on a power line. I don't have a law degree. I don't have a college degree. But I have spent thirty-one years watching my mother work, and about that long listening to her argue with my Uncle Frank.

  If you're on the family side of the room, you know the scene. It's usually Thanksgiving. The turkey is getting cold. Uncle Frank, God bless him, is waving a napkin, quoting Aquinas, insisting that an unjust law is no law at all. And my mother is sitting there, calm as a stone, explaining H.L.A. Hart, insisting that a law can be perfectly valid, binding, and absolutely monstrous.

  If you're on the legal side of the room, you know the stakes. You know the example she used so often I could recite it before I could drive: the Grudge Informers. The post-war German courts. The people who used Nazi statutes to destroy their enemies, then claimed they were just following the rules.

  Uncle Frank thinks the courts were right to say, "Those statutes were never valid. Wickedness voids the law." It's comforting. It cleans up the history. It lets us pretend the legal system didn't actually produce that evil.

  My mother spent her career on the other side of that. She believed that saying "that wasn't real law" is a lie. She believed that those statutes *were* law. They were enacted properly. They were enforced. And they were evil. And she argued that a legal system strong enough to admit that—to hold both thoughts at once without flinching—is safer than one that pretends evil can't be written down in proper legal form.

  For a long time, I thought this was just academic stubbornness. I thought it was her way of winning an argument at Thanksgiving. But as I've gotten older, and as I've watched her write opinions for thirty-one years, I've realized this wasn't just theory. It was her integrity.

  In my line of work, if the ground is sloped toward the foundation, the basement floods. I can't tell the homeowner, "Well, morally, the water should go the other way, so let's pretend it does." I have to look at the ground as it *is*, not as I wish it to be. If I lie about the terrain, the house ruins.

  My mother treated the law the same way. She didn't believe that calling a wicked law "invalid" made it less wicked. She believed it made us less honest. She thought that if we admit a law is valid but wicked, we take responsibility for it. We admit that *we* made it, *we* enforced it, and *we* have to change it. To pretend it wasn't law at all is to hide from our own capacity for cruelty.

  That is a heavy thing to carry. It is much easier to say, "I only follow good laws." It is much harder to say, "I follow the law, which means I must sometimes confront the fact that the law is capable of great harm, and it is my job to minimize that harm within the system, or fight to change it outside of it."

  There is a temptation, when honoring a judge, to talk about how merciful she was, or how she always found a way to make things "fair." But I don't think she would want that. She didn't chase "fairness" if it meant being dishonest about the text. She chased clarity. She believed that the greatest virtue a judge can offer is not comfort, but truth.

  To the clerks and colleagues here: You know she never flattened a difficult precedent to make a ruling easier. You know she never used "natural justice" as a magic wand to wave away a statute she disliked. She respected the law enough to tell us when it was broken, rather than pretending it was whole.

  To the family and friends: You know she never stopped arguing. She never stopped thinking. And she never asked us to agree with her, only to understand her.

  Mom, you taught me that you don't have to go to law school to understand that honesty is the hardest work there is. You taught me that pretending a weed is a flower doesn't save the garden; it just chokes the roses. You spent thirty-one years looking at the world as it is, not as you wished it to be, and you served us all with that clear, unblinking vision.

  So, if everyone could please raise a glass.

  To my mother. To the courage to call a wicked thing by its true name. To the integrity of a positivist who loved justice enough to tell the truth about the law. And to a retirement that is finally, happily, unbound by any rule but your own.

  To Mom.
