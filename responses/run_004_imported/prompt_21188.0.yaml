prompt: |-
  So I'm taking a History of Economic Thought class this semester and we just spent like two weeks on Adam Smith, and I got into an argument with my study group last night about something that's still bugging me. Smith is basically THE guy for free markets, deregulation, and letting self-interest run the economy, and colonialism is obviously just capitalism operating at empire scale, right, European powers using trade monopolies and extracted labor and resources to enrich the mother country. Our textbook even sticks him in the same chapter as the rise of the East India Company and the whole triangle trade system, like they're all part of one package deal, so going in I just figured Smith basically wrote the economic rulebook for empire, that colonialism IS free-market capitalism, just at a bigger geographic scale.

  But then this week's reading packet has this excerpt from Book IV of the Wealth of Nations where he's oddly savage about colonies, going on about how the monopoly on colonial trade is basically a rip-off that benefits a handfull of merchants while everyone else in Britain foots the bill, and how the whole colonial project is honestly a net loss for the country once you count what it costs to defend it. My prof mentioned in passing that this is actually one of the more cited anti-imperialist economic arguments of the 18th century, which kind of broke my brain a little. So can someone explain how the father of laissez-faire capitalism ends up sounding dead against the biggest capitalist project of his own era? Isn't that a pretty basic contradiction in his thinking, or am I missing something about how his economics actually works?
