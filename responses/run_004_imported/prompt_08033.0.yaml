answer: |-
  Here are nine interview questions designed to navigate the units-of-selection debate, sequenced to progressively tighten the pressure on the "explanatory but not algebraic" defense, including the specific topics and constraints you requested.

  **1. The Explanatory Claim**
  You've stated that while kin selection and multilevel selection (MLS) are algebraically interchangeable, they are not *explanatorily* interchangeable. For a listener unfamiliar with the Price Equation, what is the concrete cash value of that distinction? If the math yields identical predictions, what specific biological insight does the MLS formalism unlock that the kin-selection formalism obscures?

  *   **Follow-up:** If the insight is purely about human intuition or pedagogical ease, does that make MLS a psychological tool rather than a distinct biological mechanism?

  **2. The Haystack Model Parameters**
  Let's ground this in Maynard Smith's haystack model. For between-group selection to overcome within-group selection in that model, you need extremely low migration rates and high relatedness. When you look at empirical data on migration and assortment in natural populations, how often do we actually see the parameter space where group selection is the dominant force rather than a negligible residual?

  *   **Follow-up:** If the parameter space is that narrow, does that suggest group selection is a rare special case rather than a general theory of social evolution?

  **3. The Superorganism Test**
  Proponents of MLS often refer to eusocial colonies as "superorganisms." However, critics like Andy Gardner and Alan Grafen have proposed formal adaptation tests to determine if a collective truly qualifies as an organism. Do ant and termite colonies actually pass the Gardner-Grafen adaptation test, or does the "superorganism" label borrow more credibility from the metaphor than the underlying math supports?

  *   **Follow-up:** If a colony fails that formal test, is it scientifically misleading to continue using language that implies the colony itself is the unit of adaptation?

  **4. The 2010 NTW Rebuttal**
  In 2010, Nowak, Tarnita, and Wilson published their challenge to the generality of inclusive fitness theory, which provoked a roughly 140-signature rebuttal from the broader evolutionary biology community. How do you interpret that level of consensus against your position? Do you view that rebuttal as a defense of the science, or as sociological inertia protecting a longstanding paradigm?

  *   **Follow-up:** If it was sociological inertia, why has the mathematical core of inclusive fitness theory remained robust in the decade since, despite that challenge?

  **5. The Equivalence and Causality Charge**
  This brings us to the core mathematical objection raised by West, Griffin, and Gardner in their "social semantics" papers. They argue that if two models are isomorphic, attributing causality to one over the other is meaningless—like arguing whether a glass is "half full" or "half empty." What observation, even in principle, could favor the causal story of group selection over the causal story of kin selection if the equations are term-for-term rewritable?

  *   **Follow-up:** If you cannot point to a divergent prediction, aren't you essentially arguing that "group selection" is just a synonym for "kin selection with high relatedness," rather than a distinct causal process?

  **6. Predictive Divergence**
  Following up on that: if MLS and kin selection are truly distinct explanatory frameworks, there must be complex scenarios where they diverge in their utility, if not their raw predictions. Can you describe a specific modeling scenario where an inclusive fitness approach leads to a dead end or a conceptual error that an MLS approach successfully resolves?

  *   **Follow-up:** If no such scenario exists in the literature, does that suggest the "explanatory" advantage is retrospective storytelling rather than prospective predictive power?

  **7. The Human Exception**
  Much of the modern defense of group selection relies on human cultural evolution, where punishment and norms enforce cooperation. Does the validity of group selection in *cultural* evolution rely on the mechanism being biologically distinct, or is it simply that cultural transmission allows for assortment parameters that biology cannot sustain?

  *   **Follow-up:** If it relies on unique cultural mechanics, does validating group selection in humans actually lend any support to group selection in non-human animal lineages?

  **8. The "Motte and Bailey" Risk**
  In the rationalist and skeptic community, there is a concern that group selection arguments function as a "Motte and Bailey": defenders retreat to the safe, mathematically equivalent definition when challenged, but imply strong group agency when speaking to the public. How do you structure your communication to ensure you aren't inadvertently smuggling in the "for the good of the species" fallacy that misled biologists for decades?

  *   **Follow-up:** When a popular science book says a trait evolved "for the survival of the group," is that a harmless shorthand or a fundamental error you feel responsible for correcting?

  **9. The Falsification Condition**
  To close: scientific theories must be falsifiable. What specific empirical finding would be enough to make you abandon multilevel selection and concede that gene-level selection was doing all the causal work? Is there a result that would force you to say, "Okay, the group was never the unit"?

  *   **Follow-up:** Has that experiment already been run, and if so, why do we still have this debate?
