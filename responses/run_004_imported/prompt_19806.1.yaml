      *   The user assumes the reward function is *static* and *fully observable* through actions.
      *   The user assumes IRL uniquely identifies the reward function (identifiability problem).
      *   The user assumes "values" are equivalent to "revealed preferences" (philosophical/psychological gap).

  3.  **Brainstorm Key Technical & Conceptual Challenges in IRL for Alignment:**
      *   **Sub-optimality:** Humans are irrational, biased, tired, confused, akratic (weakness of will). We don't always do what's best for our true values.
      *   **Identifiability:** Multiple reward functions can explain the same behavior (e.g., "I want to get there fast" vs. "I want to avoid tolls" might look identical on a specific route).
      *   **Context/State Space:** Humans have internal states (beliefs, emotions) that aren't visible in clickstreams or actions.
      *   **Dynamic Preferences:** Values change over time. IRL usually assumes a static $R$.
      *   **Normative vs. Descriptive:** What we *do* isn't always what we *want to be doing* (meta-preferences).
      *   **Goodhart's Law/Optimization Pressure:** Once you optimize for the learned reward, the agent might exploit loopholes that weren't present in the demonstration data.
      *   **Distributional Shift:** Training data (past behavior) $\neq$ Deployment data (novel situations).

