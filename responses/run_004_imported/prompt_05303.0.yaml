answer: |-
  **Setting:** *The hallway outside the seminar room. A potted fern sits on a pedestal, visibly brown and crisped. ELENA (Inclusionist) and MARCUS (Exclusionist) are staring at it.*

  **Elena:** It's a mess, isn't it?

  **Marcus:** It's dead.

  **Elena:** *He* killed it.

  **Marcus:** There we go. You've already smuggled in the conclusion. "He killed it." You mean the gardener failed to prevent it from dying. There's a difference.

  **Elena:** Is there? In the seminar, you seemed to think the distinction was metaphysical hair-splitting. If the plants are dead, and they wouldn't be dead if he'd done his job, isn't his not-doing the job the cause?

  **Marcus:** Counterfactual dependence isn't causation, Elena. You know that. If I hadn't been born, I wouldn't be standing here. My birth caused my standing here. But if the Queen of England hadn't woken up this morning, she wouldn't have watered this fern. Does her waking up cause the fern's life?

  **Elena:** Don't do the Queen example. We did that in section. The point is salience. The gardener is the *relevant* counterfactual dependency. The Queen isn't.

  **Marcus:** Relevant to whom? To *us*. To our expectations. To the contract he signed. That's my point. Causation is supposed to be about the structure of the world, not the structure of our social contracts. If causation depends on whether someone got paid to water a plant, then causation isn't a natural relation. It's a normative one.

  **Elena:** So you're in the Exclusionist camp. Omissions are never causes.

  **Marcus:** Exactly. An omission is nothing. *Nothing* cannot cause *something*. The fern died because of a biological process: desiccation, cellular collapse. That process was driven by the heat, the lack of rain, the soil composition. The gardener added no energy, no matter, no process. He sat on his couch. To say his sitting on the couch *caused* the fern's death is to say that every identical state of affairs everywhere else—the guy in Antarctica not watering it, *you* not watering it—is also a cause. And that renders the word "cause" useless.

  **Elena:** Okay, the proliferation problem. I grant it's a problem. But Lewis had a response. Causation is context-sensitive. When we ask "What caused this?", we aren't asking for the total history of the universe. We're asking for the difference-maker against a background of normal conditions.

  **Marcus:** "Normal conditions." There it is. "Normal." That's a normative term.

  **Elena:** It's a statistical term. A baseline. In the context of a hired gardener, the baseline expectation is watering. When the baseline is violated, that violation is the cause. It doesn't mean causation *is* a norm. It means norms help us select which causal relations matter.

  **Marcus:** But you're saying the metaphysics changes based on the contract! Imagine two identical worlds. In World A, the gardener is hired. In World B, he's a trespasser who sneaks in to sleep on the porch. In both worlds, he doesn't water the plant. In World A, you say his omission caused the death. In World B, you say it didn't. But the physical facts are identical. The plant is equally dead. The gardener's physical behavior is identical. How can the *causation* differ if the physical facts don't?

  **Elena:** Because causation isn't just physics. It's explanation. If I'm explaining why the plant died to the homeowner, citing the heat is true but unhelpful. The heat was always there. The variable that changed the outcome relative to the system's design was the gardener's inaction.

  **Marcus:** "System's design." You're still hiding behind norms. Let's pressure-test this. Let's leave the fern. Imagine a doctor. A patient comes in with a bacterial infection. The doctor has the antibiotic. She hates the patient. She deliberately withholds the medicine. The patient dies.

  **Elena:** Okay.

  **Marcus:** Did the doctor *kill* the patient?

  **Elena:** Yes. Obviously.

  **Marcus:** Legally? Morally?

  **Elena:** Both.

  **Marcus:** Metaphysically? What was the cause of death?

  **Elena:** Sepsis, caused by the infection, exacerbated by the lack of treatment.

  **Marcus:** Who caused the lack of treatment?

  **Elena:** The doctor. By withholding it.

  **Marcus:** Okay, stop. Withholding is an omission. She didn't inject poison. She didn't smother him. She just… didn't act. According to your view, her not-acting is a cause. According to mine, the cause of death is the bacteria. The doctor is *guilty* of murder, absolutely. She is *responsible* for the death. But she did not *cause* it in the physical sense.

  **Elena:** That sounds insane, Marcus. If I unplug a life-support machine, I cause the death. If I never plug it in when I'm supposed to, I cause the death. Why does the timing of the omission change the metaphysics?

  **Marcus:** Because unplugging is an action. You interrupt a physical process. Not plugging in is allowing nature to take its course. In the doctor case, the bacteria are the active agent. The doctor is a bystander who had a duty to intervene.

  **Elena:** But if you say omissions aren't causes, you have to say the doctor didn't cause the death. You have to say the patient died of "natural causes."

  **Marcus:** I do say that. The patient died of the infection. The doctor is a *moral* cause, not a *physical* cause. She is blameworthy for the outcome, but the outcome was produced by the disease.

  **Elena:** This creates a gap between responsibility and causation that I don't think we can bridge. If the doctor didn't *cause* the death, how can she be guilty of *killing*? Homicide requires causation. If the bacteria killed him, she's guilty of… what? Failing to help? That's a lesser charge. But we intuitively feel that withholding the cure *is* the killing.

  **Marcus:** Our intuition is driven by morality, not metaphysics. We want to hold her accountable, so we use causal language. "You killed him!" is shorthand for "You are so responsible for his death that we will treat you as if you caused it." But if we're doing metaphysics, we have to be precise. If we allow omissions as causes, we lose the ability to distinguish between doing and allowing.

  **Elena:** But the distinction between doing and allowing *is* often a distinction of omission versus commission. And yet, the effect is the same.

  **Marcus:** The effect is the same, the responsibility might be the same, but the *mechanism* is different. Look, Elena, if you accept omissions as causes, you have to accept that *everything* causes everything else that it prevents. My not clapping my hands right now is preventing a sound. Is my silence causing the quiet in this hallway?

  **Elena:** It's causing the *continuation* of the quiet, yes.

  **Marcus:** That's absurd. That means I am currently causing the moon to stay in orbit by not shooting it with a rocket.

  **Elena:** No, because there's no counterfactual dependence there. The moon would stay in orbit even if I tried to shoot it. But in the doctor case, the patient depends on the doctor.

  **Marcus:** Dependence isn't causation. The patient depends on the oxygen in the room, too. If the oxygen vanished, he'd die. Is the oxygen's *presence* causing his life? Is the oxygen's *continued presence* a billion little causes?

  **Elena:** You're pushing for a Process Theory of causation. Energy transfer. Conserved quantities.

  **Marcus:** Yes. It keeps the ontology clean. No spooky "non-events" influencing the world.

  **Elena:** But it makes causation useless for the special sciences. Medicine, law, history. "The cause of the famine was the drought." No, the cause was the government not releasing the grain reserves. "The cause of the crash was the pilot's failure to engage the flaps." Not the gravity, not the speed. The omission. If you tell a pilot, "You didn't cause the crash, gravity did," you aren't being metaphysically rigorous. You're being unhelpful.

  **Marcus:** I'm distinguishing between *explanation* and *causation*. We explain via omissions because we care about control. We want to know what to change next time. But that's pragmatic. It's about human interests. Causation is supposed to be about what's out there independent of us.

  **Elena:** But human interests *are* out there. We are part of the world. Our norms, our expectations, our systems of reliance—they are real features of the environment. The gardener isn't just a physical object; he's a node in a social network. When that node fails to fire, the system collapses. That failure is a real event in the social world.

  **Marcus:** So now causation is relative to social worlds?

  **Elena:** Causation is relative to the system you're analyzing. In a biological system, the bacteria caused the death. In a socio-medical system, the doctor caused the death. Both are true. Why privilege the biological description as the "real" metaphysics?

  **Marcus:** Because biology exists without us. Socio-medical systems don't. If humans go extinct, the bacteria still kill. The doctor's duty vanishes. If causation depends on the duty, causation vanishes when we do. I can't accept that the causal history of the universe depends on whether there are contracts in place.

  **Elena:** I'm not saying the *history* changes. I'm saying the *causal relation* is a relation between events, and "the doctor's withholding" is an event.

  **Marcus:** It's not an event! It's the absence of an event! You can't point to it. You can't measure it.

  **Elena:** I can point to the empty syringe. I can point to the time slot on the schedule where the injection didn't happen. Absences have locations. They have durations. They have effects.

  **Marcus:** They have effects only because we expect something else. Look at the fern again. If this was a wild fern in the woods, and it died of drought, no one says the gardener killed it.

  **Elena:** Because there is no gardener.

  **Marcus:** Right. So the causation depends on the existence of a role. That proves my point. The "cause" is determined by the role, not the physics. It's normative all the way down. You're trying to have it both ways. You want omissions to be real causes, but you only count the ones that violate a norm. That means the norm is doing the work, not the causation.

  **Elena:** Maybe the norm *is* part of the causal context. Causation isn't just billiard balls hitting each other. It's about dependencies in a system. In a system where agents have duties, the failure of a duty is a breakdown in the mechanism that sustains the outcome. That breakdown *is* the cause.

  **Marcus:** You're defining "mechanism" to include social expectations.

  **Elena:** Why not?

  **Marcus:** Because then "causation" just means "thing we blame."

  **Elena:** No. It means "difference-maker in a relevant system."

  **Marcus:** And who decides what's relevant?

  **Elena:** The context of the inquiry.

  **Marcus:** (Sighs) So we're back to pragmatism.

  **Elena:** We're back to reality. We live in a world of omissions. We live in a world where not-paying-taxes causes prison, and not-breathing causes death. If your metaphysics can't account for that without calling it "shorthand," your metaphysics is too thin.

  **Marcus:** And if your metaphysics allows the Queen of England's morning routine to be a potential cause of this fern's death, your metaphysics is too thick. It lets everything in.

  **Elena:** (Touches a brown leaf) It crumbles.

  **Marcus:** Desiccation.

  **Elena:** Neglect.

  **Marcus:** (Pauses) I'll grant you this: The doctor is going to prison.

  **Elena:** Because she caused the death.

  **Marcus:** Because she's responsible for it. Whether she "caused" it… I think we'll have to agree to disagree on the label. As long as we lock her up, the metaphysics doesn't matter.

  **Elena:** It matters. Because if we say she didn't cause it, we imply the death was inevitable. That the bacteria won. But it wasn't inevitable. Her choice changed the world. That's what causation is.

  **Marcus:** Her choice changed the *moral landscape*. The physical landscape was just bacteria multiplying.

  **Elena:** You can't separate them. Not in a world like ours.

  *(They stand in silence for a moment, looking at the fern.)*

  **Marcus:** I'm not watering it.

  **Elena:** I know.

  **Marcus:** Just making sure we're clear on the causal status of my inaction.

  **Elena:** (Smiles) If it dies, Marcus, I'm telling the department head you killed it.

  **Marcus:** Tell her what you want. I didn't touch a thing.

  *(Marcus walks away. Elena pulls out her phone to call facilities.)*
