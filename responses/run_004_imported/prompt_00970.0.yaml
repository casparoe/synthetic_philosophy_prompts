answer: |-
  Your intuition that something was off about your friend's reasoning is well-founded. You have stumbled into a classic problem in moral philosophy and urban planning.

  Your friend is arguing from a specific ethical framework known as **Total Utilitarianism**. This view holds that the right action is the one that maximizes the *total sum* of well-being in the world. Under this logic, if adding a person creates a life that is "worth living" (even a barely good one), the total amount of good in the universe has increased. Therefore, stopping that addition is morally wrong.

  However, most philosophers and urban planners reject this as the *sole* metric for policy. Here is a breakdown of where your friend's reasoning is strong, where it fails, and why your unease is justified.

  ### 1. The Philosophical Flaw: The "Repugnant Conclusion"
  The specific logical hole you sensed is famously identified by philosopher Derek Parfit as **The Repugnant Conclusion**.

  Parfit showed that if you strictly follow Total Utilitarianism (maximize the total number of good lives), you are forced to conclude that a world with a massive population living barely tolerable lives is "better" than a world with a smaller population living flourishing, happy lives.

  *   **Your Friend's View:** 10,000 people living in a congested, noisy, but "okay" city is better than 5,000 people living in a spacious, quiet, thriving city, because $10,000 \times \text{okay} > 5,000 \times \text{thriving}$.
  *   **The Counter-View:** We generally care about the **average** quality of life, not just the headcount. If density degrades the city to the point where *everyone* (newcomers and locals) suffers longer commutes, less safety, and no green space, we have created a "net positive" population in a "net negative" environment.

  Your friend's argument treats "a life worth choosing" as a binary switch (on/off). In reality, quality of life is a sliding scale. Policy should aim to slide the scale up, not just flip the switch on as many people as possible.

  ### 2. The Economic Flaw: Negative Externalities
  Your friend acknowledges that density worsens commutes, noise, and green space access. In economics, these are **negative externalities**.

  His argument assumes that as long as the new resident benefits, the trade-off is worth it. But he is glossing over the fact that the new residents *also* suffer from these conditions.
  *   If you pack a city beyond its infrastructure capacity, you aren't just hurting current residents; you are selling newcomers a bill of goods. You are inviting them into a system that is functionally degraded.
  *   **The "Tragedy of the Commons":** If everyone acts on the principle "I should be allowed to move here because my life will be better," the shared resources (roads, parks, quiet) become depleted, eventually making the life *not* better for anyone.

  ### 3. The Moral Flaw: "Selfishness" vs. "Stewardship"
  Your friend accuses you of selfishness dressed up as prudence. This is a powerful rhetorical move, but it conflates two different things: **Exclusion** vs. **Capacity Management**.

  *   **Exclusion (Selfishness):** "I don't want *those* people here because they lower my property values or change the culture." This is indeed unethical.
  *   **Capacity Management (Prudence):** "We cannot add 5,000 units without building 5,000 more transit seats, 3 new parks, and upgrading the sewage system. If we add the units without the infrastructure, we break the city for everyone."

  If your friend supports density *without* concurrent investment in the infrastructure required to support that density (transit, schools, parks), that isn't moral altruism; it's bad planning. It prioritizes the *quantity* of housing over the *habitability* of the city.

  ### 4. The "Worth Choosing" Trap
  Your friend argues we should build as long as life is "still clearly worth choosing." This is a low bar.

  People choose to live in difficult conditions out of desperation, not because the conditions are good. If the only affordable housing is in a city with unbearable commutes and no green space, people will take it because they have no other option.
  *   Using their desperation to justify degrading the city is exploitative.
  *   A moral housing policy shouldn't just ask, "Is this better than homelessness?" It should ask, "Is this a place where humans can thrive?"

  ### Where Your Friend Is Right
  To be fair, your friend is correct on one major point: **Restricting supply is often used as a weapon by the wealthy.**
  Many cities use "quality of life" arguments to block *any* development, preserving exclusivity and driving up prices, which pushes the working class out entirely. If the choice is between "a crowded city" and "a city where only the rich can afford to live," the crowded city is morally preferable.

  ### The Synthesis
  Your friend is right that **exclusion is bad**, but he is wrong that **density without limits is good.**

  The solution isn't to stop building (which validates the selfishness charge), nor is it to build endlessly until the city is unlivable (which validates your unease). The solution is **proportional growth.**
  *   Approve the housing *if and only if* there is a plan to expand the transit, parks, and infrastructure to match.
  *   Density is good *when supported by infrastructure*. Density without infrastructure is just overcrowding.

  ### Verdict
  **He was not entirely right.** His reasoning relies on a philosophical framework (Total Utilitarianism) that is widely considered flawed when applied to quality of life.

  You felt uneasy because his argument ignores the **diminishing returns of density.** At a certain point, adding more people doesn't add "good lives"; it subtracts quality from *all* lives, including the newcomers. Recognizing that limit isn't selfishness; it's the definition of sustainable stewardship.

  You can agree with him that the city needs more housing and less exclusion, while still insisting that growth must be paired with the infrastructure required to keep the city livable. That is the middle ground his argument misses.
