      *   *Caution:* Don't ignore his skepticism of paper money. In *Of Money*, he says paper credit can inflate prices without bringing real wealth. He might view the fiat system as inherently unstable compared to specie. I should mention this.
      *   *Debt:* Make sure to highlight the specific passage in *Of Public Credit* about foreigners holding debt. "It is a sad resource... to mortgage the public revenue to foreigners."

  8.  **Final Polish:** Check against the prompt requirements.
