      *   **Addressing the "Principled Reason" Question:**
          *   *Can knowledge resist?* Some philosophers (Internalists) try to carve out knowledge as special.
          *   *Williamson's Rebuttal:* Knowledge is factive and depends on the environment. The environment changes gradually. Therefore, the boundary between knowing and not knowing is vague. Vague boundaries + reliability requirement = failure of luminosity/KK.
          *   *Key Distinction:* Phenomenal states (feeling cold) are often thought to be *more* likely to be luminous than knowledge. If the argument kills phenomenal luminosity, it definitely kills KK. If knowledge were *more* robust, maybe it could survive? Williamson argues no, because knowledge is world-involving.
      *   **Conclusion:** KK is a specific instance of luminosity. There is no principled reason within Williamson's framework for knowledge to resist the argument; in fact, it is *more* vulnerable than phenomenal states.

