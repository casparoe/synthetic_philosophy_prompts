  7.  **Final Review of the Student's "Selection Effect" Point:**
      *   Student: "always finding yourself alive is just a selection effect... it doesn't mean the universe is rigged in your favor."
      *   Critique: QI proponents agree it's a selection effect! That's *why* they think you survive. The student seems to think pointing out it's a selection effect disproves the *experience* of survival. It doesn't. It just explains it. This part of the argument is logically weak. The *Measure* argument is the one that actually works to dissuade risk-taking. I should note this distinction.

