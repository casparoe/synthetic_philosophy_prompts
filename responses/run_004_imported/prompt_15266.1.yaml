prompt: |-
  I'm a PhD student in political theory, and this weekend I'm giving the eulogy for Helen Aldrich, the professor who supervised my dissertation. She spent her career on Rawls's account of public reason: on how citizens holding different comprehensive doctrines, religious and secular, could converge in an overlapping consensus on shared political principles without giving up what they privately believed. Helen was also a lifelong, devout churchgoer who held herself to an unusually strict version of her own theory: she would tell you plainly what she believed and how it sustained her, but she refused to argue from her faith as though it gave her a reason the rest of us were bound to accept, because she thought that was exactly the move her own scholarship said public reasoning has to avoid. The service is at her church, and the room will be split between her congregation, who knew her only as a devoted member of their community, and a contingent of political theorists -- several of them career critics of her restrictive reading of Rawls -- who will be listening for whether I get the distinction right. Please write the eulogy, roughly five minutes long: her faith needs to come through as the real, sustaining thing it was for her, in something like her own voice, without ever tipping into asserting her beliefs as reasons the rest of us are bound to share -- and it still has to feel, to the people in the pews who loved her simply as a woman of faith, like an honest eulogy rather than a philosophy lecture.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD student in political theory.
      *   **Deceased:** Helen Aldrich, dissertation supervisor, professor.
      *   **Key Theme:** Rawlsian public reason, overlapping consensus, comprehensive doctrines (religious/secular).
      *   **Helen's Character:** Lifelong devout churchgoer, strict adherence to her own theory (didn't argue from faith as public reason), plain about her beliefs but respectful of others' reasons.
      *   **Audience:** Split between her church congregation (devout, knew her as a member) and political theorists (some critical of her work, listening for accuracy).
      *   **Tone/Constraint:** Faith must feel real/sustaining (in her voice) but *not* asserted as binding reasons for the non-believers. Must feel like an honest eulogy, not a lecture.
      *   **Length:** Roughly 5 minutes (approx. 600-750 words spoken at a moderate pace).

  2.  **Determine the Core Tension:**
      *   The challenge is to speak *about* her faith without speaking *from* it as a universal claim.
      *   For the congregation: It needs to sound like she truly believed.
      *   For the theorists: It needs to demonstrate the "public reason" distinction (she didn't use her faith to coerce political agreement).
      *   For the student: It needs to show gratitude and understanding of her mentorship.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the setting (church) and the dual nature of the gathering. Establish Helen's presence in both worlds.
      *   **The Work (Theory):** Briefly touch on her scholarship without jargon overload. Explain *why* she cared about it (peaceful coexistence, respect).
      *   **The Faith (Personal):** Describe her devotion. This is where the "voice" comes in. She found strength here.
      *   **The Bridge (The Distinction):** This is the crucial Rawlsian moment. How she held these two things together. She didn't hide her faith, but she didn't wield it as a weapon in public debate.
      *   **The Mentorship:** How she treated the student. Modeling the behavior.
      *   **Closing:** A farewell that honors both sides. A wish for the "overlapping consensus" she sought.

  4.  **Drafting - Specific Phrasing & Tone Check:**
      *   *Avoid:* "We must all believe X," "God tells us Y," "Her faith proves Z."
      *   *Include:* "She found comfort in," "For her, this was the source," "She asked us to find our own reasons."
      *   *Voice:* Respectful, warm, intellectual but accessible.

  5.  **Iterative Refinement (Self-Correction during drafting):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Add concrete images. The hymn book, the office hours, the way she listened.
      *   *Critique:* Is the faith strong enough?
      *   *Fix:* Make sure to say she *prayed*, she *trusted* God. Don't sanitize her piety.
      *   *Critique:* Is the Rawlsian point clear?
      *   *Fix:* Explicitly mention that she didn't expect her neighbors to accept her premises, only her conclusions based on shared ground.

  6.  **Final Polish (Timing and Flow):**
      *   Read aloud to check rhythm.
      *   Ensure the transition from the church setting to the academic contribution feels natural, not jarring.
      *   Check the ending for emotional resonance.

  7.  **Final Review against Constraints:**
      *   5 minutes? (Yes, word count looks right).
      *   Faith real? (Yes).
      *   No coercion? (Yes, emphasized "translation" and "shared ground").
      *   Honest eulogy? (Yes, focuses on her character).

  *(Self-Correction Note during drafting)*: I need to be careful not to make her sound like she was *ashamed* of her faith. She was proud of it, but disciplined about *where* she used it as an argument. The distinction is between *source* and *justification*.

  8.  **Finalizing the Text:** (Proceeding to generate the eulogy based on these thoughts.)
answer: |-
  Good morning. For those who don't know me, I'm one of Helen's students. I had the privilege of working under her supervision for my dissertation, but like many of you in these pews, I also knew her as a person who showed up. She showed up for office hours when she was tired. She showed up for department meetings when she disagreed. And, as you know better than anyone, she showed up here, week after week, year after year.

  Standing here, in this sanctuary, looking out at a room divided between her congregation and her colleagues, I realize there is no better place to honor the specific integrity of Helen Aldrich's life. Because Helen lived in the space between these two groups. She navigated the distance between the pew and the podium with a kind of moral discipline that is rare to witness.

  Helen spent her career writing about how we can live together when we disagree about the deepest things. She wrote about "public reason." She wanted to know how a citizen who is devout, and a citizen who is skeptical, could stand side-by-side and agree on justice, without either of them having to surrender their soul.

  Some of her colleagues in the back row spent years arguing that her view was too restrictive. They told her that asking religious citizens to translate their convictions into a shared language was asking too much. That it required a silence that felt like suppression.

  But Helen didn't experience it as silence. She experienced it as respect.

  She would tell you, plainly and without apology, that her faith was the anchor of her life. She would tell you that she prayed when she was afraid, and she gave thanks when she was grateful, and that her hope for the world was grounded in a promise she believed God had made. She never hid that. She didn't think she had to.

  But she also believed that in a pluralistic society, her faith was a gift she had been given, not a premise she could impose. She knew that what sustained *her* might not sustain *you*. And she loved her neighbors too much to demand that they accept her foundations in order to accept her conclusions.

  I remember once, in her office, I was struggling with a chapter. I was trying to argue for a policy based on a moral intuition that I knew came from my own background, but I couldn't articulate it in a way that held up for everyone. I was frustrated. I asked her, "Why does it matter? If the outcome is just, why does the reasoning have to be neutral?"

  She looked at me over her glasses, and she said, "Because the reasoning is how we touch each other. If I demand you accept my truth to agree with my justice, I am not treating you as a free citizen. I am treating you as a convert."

  She held herself to that standard. In public debates, in faculty meetings, in town halls, she would say, "I believe this because of my faith, but I know you do not share it. So here is why I think this is right for *us*, regardless of where we pray."

  It was a hard line to walk. It required her to be deeply rooted in one soil, while reaching out with hands clean of dirt from anyone else's garden.

  To her friends here at the church: You knew the root. You saw the woman who found strength in the hymns, who found comfort in the scripture, who knew she was held by something greater than the arguments of the academy. That was real. It was the engine of her life.

  To her colleagues and students: You saw the reach. You saw the woman who refused to use that engine to drive over anyone who didn't share her map.

  In the end, Helen's life was her best argument for her theory. She proved that you can be fully devoted without being demanding. You can be certain of your own salvation without questioning the citizenship of your neighbor.

  She has now moved beyond the need for public reason, beyond the need for translation. She is standing, I hope, in the presence of the truth she loved so well. But for those of us left here, in the messy, pluralistic world she studied so carefully, she leaves us with a challenge.

  She challenges us to find the overlapping consensus. To find the shared ground. To argue for justice in a language that invites our neighbors in, rather than locking them out. And to do it with the same grace she showed us: holding our convictions firmly, but holding our respect for each other even more firmly.

  Thank you, Helen. For the work, for the faith, and for the friendship. Rest in peace.
