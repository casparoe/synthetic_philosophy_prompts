prompt: |-
  My little sister has bipolar I, and a couple years back, when she was doing well, she sat down with her psychiatrist and a lawyer and wrote a psychiatric advance directive — basically a Ulysses contract — naming me and her doctor as the people who could hospitalize her and start meds over her objection if she hit specific triggers (no sleep for three nights straight, giving away money, going off her outpatient meds). She even put in a line, word for word: "if I tell you this time is different, it isn't — that's what mania sounds like from the inside." Going through that with her is honestly the reason I ended up on the ethics committee at the hospital where I work.

  Now we've got a case in front of the commitee that's uncomfortably close to home. A patient with the same diagnosis signed a near-identical directive, is hitting the listed triggers, and her named proxy wants it invoked. But she's not incoherent at all right now — she's sharp, funny, and adament that she's never thought more clearly in her life, and furious that a document she signed two years ago could override what she's telling us today. One committee member keeps invoking constitutional precommitment — supermajority rules binding a future legislature that hates the rule — to argue we should enforce the directive regardless of her current state. Another says the analogy doesn't hold: a future legislature is just a different set of people rotating through an office, but this is the literal same mind, so overriding her now isn't upholding a rule on a successor, it's just refusing to listen to her.

  We're genuinely split and meet Thursday morning. Can you draft the memo I'll bring in — an actual recommendation, not "reasonable people disagree," with some concrete next step and timeframe, and one that actually takes on the constitutional-precommitment argument instead of dodging it?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Member of a hospital ethics committee.
      *   **Situation:** A patient with Bipolar I has a Psychiatric Advance Directive (PAD)/Ulysses contract. She is currently exhibiting specific triggers listed in the PAD (no sleep, spending, stopping meds). She is currently lucid, articulate, and refusing treatment, claiming she's never thought more clearly. Her proxy wants the PAD enforced.
      *   **Conflict:** The committee is split.
          *   *Side A:* Enforce the PAD based on "constitutional precommitment" (binding the future self).
          *   *Side B:* Reject the analogy (it's the same mind, not a successor legislature), so overriding her now is ignoring her current autonomy.
      *   **Task:** Draft a memo for the Thursday morning meeting.
      *   **Requirements:**
          *   Must be an *actual recommendation* (no fence-sitting).
          *   Must include concrete next steps and a timeframe.
          *   Must directly address the constitutional precommitment argument (not dodge it).
          *   Tone: Professional, ethical, nuanced, decisive.
      *   **Personal Context:** The user has a sister with Bipolar I and a similar PAD. This informs their empathy but the memo must remain objective and applicable to the hospital case, not personal anecdote (though the insight is valuable).

  2.  **Determine the Ethical Core:**
      *   **Autonomy:** Current autonomy vs. Past autonomy (precedent autonomy).
      *   **Beneficence/Non-maleficence:** Preventing harm (mania consequences) vs. harm of involuntary treatment (trauma, loss of trust).
      *   **Decision-Making Capacity (DMC):** This is the crux. In bipolar mania, insight is often the first thing to go, even if cognition (memory, arithmetic, logic) remains intact. A patient can be "sharp and funny" but lack *capacity* regarding specific treatment decisions due to the pathology of the illness (anosognosia).
      *   **The Precommitment Analogy:** Is it valid? Yes, but with limits. A constitution binds a future legislature because values change. In bipolar disorder, the *mechanism* of decision-making is chemically altered. The "future self" isn't just a different political faction; it's a compromised processor. However, the "same mind" argument has merit if the patient is truly lucid.
      *   **The Specific Clause:** "If I tell you this time is different, it isn't." This is a meta-cognitive instruction. Ignoring it validates the mania's deception. Honoring it respects the patient's *stable* self's understanding of her own illness.

  3.  **Formulate the Recommendation:**
      *   *Decision:* Enforce the directive, *but* with a specific, time-limited review process.
      *   *Rationale:* The precommitment argument holds *if* we accept that Bipolar I mania impairs the specific capacity to evaluate risk regarding the illness itself, even if general cognition is intact. The "same mind" argument fails because the neurochemical state alters the *weights* assigned to values, not just the values themselves.
      *   *Safeguard:* We cannot assume the PAD is infallible forever. We need a "sunset clause" or a rapid reassessment to ensure we aren't trapping her in treatment if she actually stabilizes quickly or if the assessment of mania was wrong.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard To/From/Date/Subject.
      *   **Executive Summary:** State the recommendation clearly up front.
      *   **Case Summary:** Briefly recap the facts (triggers met, PAD exists, current refusal).
      *   **Ethical Analysis (The Meat):**
          *   *Address the Precommitment Argument:* Acknowledge it. Validate it but refine it. It's not about "different people," it's about "compromised agency." The PAD represents the patient's *competent* valuation of risks. The current state represents a pathology that mimics competence but lacks insight.
          *   *Address the "Same Mind" Argument:* Acknowledge the continuity of consciousness. However, distinguish between *cognitive ability* (sharp/funny) and *decisional capacity* (appreciation of consequences). Mania specifically targets the "appreciation" prong of capacity.
          *   *The Meta-Cognitive Clause:* Highlight the specific line ("this time is different"). This is the strongest evidence that the *past* self understood the *future* self's deception.
      *   **Recommendation:** Invoke the PAD.
      *   **Conditions/Next Steps:**
          *   Immediate hospitalization/medication per PAD.
          *   **Crucial Addition:** A 72-hour (or 5-day) "Capacity Re-evaluation Window." This addresses the fear of indefinite override. If she regains insight quickly, we pivot.
          *   Involve the proxy but maintain clinical oversight.
      *   **Conclusion:** Reiterate the goal (restoring the self that wrote the directive).

  5.  **Refining the Tone:**
      *   Avoid personal stories (about the sister). Keep it professional.
      *   Ensure the legal/ethical terminology is precise (precedent autonomy, decisional capacity, anosognosia).
      *   Make sure the "Precommitment" rebuttal is robust. The key distinction is that a legislature changes *preferences*, while mania changes *processing capability* regarding those preferences.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 72 hours enough?
      *   *Fix:* Make it "5 days or upon resolution of acute sleep deprivation," whichever comes first. Sleep is the key trigger mentioned.
      *   *Critique:* Is the precommitment analogy dismissed too easily?
      *   *Fix:* Give it credit. It *is* a valid framework for PADs, but the biological reality of mania strengthens it beyond mere political precommitment. It's not just binding a future voter; it's binding a future self under duress of pathology.
      *   *Critique:* The user asked for *one* recommendation.
      *   *Fix:* Ensure the conclusion is unambiguous. "The Committee should recommend..."

  7.  **Final Polish:** Check against the prompt requirements.
      *   Actual recommendation? Yes.
      *   Concrete next step/timeframe? Yes (72-96 hour review).
      *   Take on constitutional argument? Yes (in the Analysis section).
      *   Tone appropriate for Ethics Committee? Yes.

  8.  *(Final thought on the "Sister" aspect)*: The user mentioned their sister to establish credibility and emotional weight, but the memo *cannot* mention the sister. It must stand on the case facts. I will acknowledge the user's background in the thought process but keep the memo sterile and professional.

  9.  **Drafting the Content:** (Proceeding to generate the memo based on these points.)
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Case #24-09: Enforcement of Psychiatric Advance Directive in Context of Acute Manic Episode

  ### Executive Summary
  The Committee is asked to determine whether to honor a Psychiatric Advance Directive (PAD) for a patient with Bipolar I Disorder who is currently exhibiting specific clinical triggers outlined in the document but retains high-functioning cognitive articulation and refuses treatment.

  **Recommendation:** The Committee should recommend **enforcing the Psychiatric Advance Directive** immediately, authorizing hospitalization and pharmacological intervention per the patient's prior instructions. However, this enforcement must be coupled with a **mandatory 96-hour capacity re-evaluation window**. This approach upholds the ethical weight of precedent autonomy while acknowledging the "same mind" concern through rapid clinical reassessment.

  ### Case Context
  The patient executed a detailed PAD two years ago during a period of euthymia (stability). The directive specifies three triggers for involuntary intervention: 72 hours of sleeplessness, impulsive financial divestment, and cessation of outpatient medication. All three triggers are currently present.

  The patient's named healthcare proxy requests enforcement. The patient opposes this, arguing she currently possesses decision-making capacity, citing her coherence, humor, and logical speech. She contends that the PAD represents a "past self" that does not reflect her current reality.

  ### Ethical Analysis

  **1. The Validity of the Precommitment Analogy**
  One argument posits that enforcing the PAD is akin to constitutional precommitment: a "supermajority" (the stable self) binding a "future legislature" (the manic self) to prevent rash deregulation. A counter-argument suggests this fails because, unlike a legislature, the patient is the *same* person; overriding her now is silencing her current voice, not regulating a successor.

  This Committee should reject the counter-argument. The constitutional analogy holds, but it is actually *stronger* in this clinical context than in the political one. In politics, a future legislature has the same cognitive machinery as the past one; they simply have different policy preferences. In Bipolar I mania, the "future legislature" is operating with compromised machinery.

  Mania does not merely change preferences; it pathologically alters the *weighting* of risk and the *appreciation* of consequences. The patient's current assertion that she has "never thought more clearly" is a documented symptom of the illness (anosognosia), not evidence of capacity. The PAD specifically anticipated this deception with the clause: *"If I tell you this time is different, it isn't."* To ignore this clause is to validate the pathology over the patient's stable meta-cognition. We are not silencing the "same mind"; we are protecting the mind's long-term operating system from a temporary virus that disables its error-checking software.

  **2. Decisional Capacity vs. Cognitive Function**
  The patient's sharpness and humor demonstrate intact *cognitive* function (memory, attention, articulation). They do not demonstrate intact *decisional* capacity. Capacity requires four elements: Understanding, Appreciation, Reasoning, and Choice. While she demonstrates Understanding and Reasoning, she fails the **Appreciation** prong. She cannot accurately apply the reality of her condition to her current situation because the mania itself distorts that reality.

  Relying on her current articulation to void the PAD privileges *performance* over *insight*. The PAD was signed when she possessed both.

  **3. The Risk of Harm**
  Non-maleficence dictates we prevent harm. The harms of untreated mania (financial ruin, physical exhaustion, high suicide risk upon crash) are severe and often irreversible. The harm of temporary involuntary treatment (loss of autonomy, potential trauma) is significant but reversible. Given the specific triggers met (particularly 72+ hours without sleep), the physiological risk is acute.

  ### Recommendation and Implementation Plan

  The Committee should advise the treating team to proceed with enforcement of the PAD, subject to the following safeguards to address the "same mind" concern:

  **1. Immediate Action:**
  Admit the patient and initiate medication protocol as outlined in the PAD. The treating physician should explicitly document that the enforcement is based on the *specific triggers* met and the *meta-cognitive clause* regarding insight, not merely on the diagnosis.

  **2. The 96-Hour Re-evaluation Window (The "Sunset Clause"):**
  To address the concern that we are indefinitely silencing the current self, the involuntary status must undergo a formal capacity reassessment within **96 hours** (or sooner if the patient achieves 48 hours of consecutive sleep).
  *   **Goal:** Determine if the restoration of sleep and initial medication has restored the "Appreciation" prong of capacity.
  *   **Outcome A:** If the patient regains insight and acknowledges the manic episode, transition to voluntary status immediately.
  *   **Outcome B:** If the patient remains adamant that "nothing is wrong" despite clinical evidence of stabilization, continue involuntary hold per standard legal/clinical protocols, as this confirms the persistence of the incapacity.

  **3. Proxy Collaboration:**
  The named proxy should be kept informed but reminded that their role is to enforce the *directive*, not to act as a general power of attorney against the patient's will outside the scope of the PAD.

  ### Conclusion
  Honoring this PAD is not an act of paternalism; it is an act of fidelity to the patient's most autonomous self. The "Ulysses Contract" is designed precisely for moments when the sirens sound convincing. The patient's current lucidity is the siren. The directive is the mast.

  By enforcing the directive with a strict 96-hour review, we respect the binding nature of her prior competent choices while maintaining an ethical off-ramp should her current capacity prove genuine. This balances the constitutional precommitment argument with the clinical reality of recovery.

  **Recommended Vote:** To support enforcement of the PAD with the mandated 96-hour capacity review.
