answer: |-
  This is an exceptionally sharp objection. You have correctly identified the tension at the heart of Shoemaker's "subset view" of realization. The worry is essentially this: If mental property $M$ is to be multiply realizable by physical properties $P_1, P_2, \dots P_n$, then $M$ must be identified with the *intersection* of the causal powers of all possible $P_i$. But if $M$ is just that intersection of powers, isn't $M$ simply defined by its functional role (the powers it contributes)? And if so, haven't we just returned to functionalism, which Kim argues is vulnerable to exclusion (because the *realizer* of the role does the work, not the role itself)?

  Furthermore, if the powers must be identical across realizers to constitute the *same* mental property $M$, does this not force a kind of type-identity between $M$ and that specific cluster of powers, thereby losing the flexibility of multiple realizability?

  I will argue that Shoemaker's strategy survives this dilemma. It does so by shifting the debate from **semantics and conceptual analysis** (where functionalism lives) to **metaphysics and property individuation** (where Shoemaker lives). The Subset View is not merely a repackaging of functionalism; it is a distinct ontological thesis that dissolves the exclusion problem by rejecting the premise that the mental and physical causes are "distinct" in the way Kim requires.

  Here is the rigorous defense of Shoemaker's position against your specific objection.

  ### 1. Distinguishing "Role" from "Power" (The Ontological Move)

  Your objection assumes that specifying a property by its causal powers is equivalent to functionalism. This is true if we are talking about *Role Functionalism* (e.g., David Lewis), but Shoemaker explicitly rejects the metaphysical picture Role Functionalism relies on.

  *   **Role Functionalism:** Defines mental property $M$ as a second-order property: "The property of having *some* first-order property that plays causal role $R$."
      *   *Kim's Attack:* Second-order properties are causally inert. If I have a headache because I have C-fiber firing, it is the C-fiber firing (the first-order realizer) that causes the wincing, not the second-order property of "having a headache." The role is a description; the realizer is the cause.
  *   **Shoemaker's Subset View:** Defines mental property $M$ as a **first-order property** individuated by its forward-looking conditional powers.
      *   *The Crucial Difference:* For Shoemaker, properties *just are* clusters of causal powers. There is no distinction between the "property" and the "powers it confers." To be the property *is* to have those powers.

  **Why this survives your objection:**
  You worry that specifying the "fixed subset" of powers requires a functional definition. Shoemaker replies that it requires no *definition* at all; it requires only **property individuation**. We do not need to linguistically specify the subset in advance to solve the metaphysical problem. We only need to establish that it is metaphysically possible for Property $A$ to have powers $\{x, y, z\}$ and Property $B$ to have powers $\{x, y\}$.

  If $M$ is a first-order property whose identity is constituted by powers $\{x, y\}$, and $P_1$ is a first-order property constituted by $\{x, y, z\}$, then $M$ is not a "role" waiting to be filled. $M$ is a genuine constituent of reality. When $P_1$ is instantiated, $M$ is *also* instantiated (because the powers $\{x, y\}$ are present). $M$ is not a second-order abstraction; it is the very causal potency of the system, viewed under a specific description of its powers.

  This avoids the "functionalism collapse" because traditional functionalism makes the mental property distinct from the causal work (the realizer does the work). Shoemaker makes the mental property **identical to a portion of the causal work**.

  ### 2. The Logic of Realization: Subset vs. Intersection

  Your objection suggests that for $M$ to be multiply realizable, we must find the *intersection* of powers across all realizers ($P_1 \cap P_2 \cap \dots$), and that this intersection is too thin or functionally defined.

  However, Shoemaker's view does not require us to calculate this intersection conceptually to validate the metaphysics. It relies on the logic of **determinables and determinates**, or more precisely, the logic of **property inclusion**.

  Consider the property **Fragility**.
  *   $P_1$: Molecular structure of glass. Powers: {breaks when struck, transparent, conducts heat slowly}.
  *   $P_2$: Molecular structure of ceramic. Powers: {breaks when struck, opaque, conducts heat differently}.
  *   $M$: Fragility. Powers: {breaks when struck}.

  On the Subset View, $M$ is realized by $P_1$ because the powers of $M$ are a subset of the powers of $P_1$. $M$ is realized by $P_2$ because the powers of $M$ are a subset of the powers of $P_2$.

  **Addressing the "Fixed Subset" Worry:**
  You ask: *How do you specify that fixed, realizer-independent subset in advance?*
  **Reply:** You don't specify it *in advance*. You identify the property $M$ by the powers it *actually has*. If a silicon system and a human brain both instantiate a property with the power "causes avoidance behavior when presented with noxious stimulus," then that property is instantiated in both.

  The "subset" is not a linguistic definition we impose; it is a metaphysical overlap we discover. The fact that $P_1$ and $P_2$ are physically heterogeneous does not prevent them from sharing a **numerically identical causal power**. If causal powers are individuated by their inputs and outputs (their conditions and manifestations), then the power "causes avoidance" is the *same power* whether implemented by neurons or silicon, provided the counterfactuals hold.

  **Why this isn't Type-Identity:**
  Type-Identity Theory claims $M = P_1$. Shoemaker claims $M \subset P_1$.
  *   If $M = P_1$, then $M$ cannot be realized by $P_2$ (unless $P_1 = P_2$, which denies MR).
  *   If $M \subset P_1$ and $M \subset P_2$, then $M$ is distinct from both $P_1$ and $P_2$.
  *   $M$ is not the disjunction $P_1 \lor P_2$. $M$ is the *common causal factor*.

  This preserves Multiple Realizability without collapsing into Type-Identity because $M$ is not identical to the *total* causal profile of the realizer, only to a *part* of it. The "type" of $M$ is fixed by the subset of powers, not by the physical constitution of the realizer.

  ### 3. Solving Exclusion Without Overdetermination

  This is the strongest point of defense. Kim's Exclusion Argument relies on the **Principle of No Overdetermination**: An effect cannot have two *distinct* sufficient causes unless it is a coincidence.

  Kim assumes that if $M$ and $P$ are distinct properties, their causal contributions must be distinct events or processes. Therefore, if $P$ is sufficient, $M$ is excluded.

  Shoemaker blocks this by arguing that $M$ and $P$ are not distinct in the relevant sense. They are not competitors.
  *   **Kim's Picture:** $P \to E$ and $M \to E$. (Two arrows hitting one target).
  *   **Shoemaker's Picture:** $P$ causes $E$ *in virtue of* having powers $\{a, b, c\}$. $M$ causes $E$ *in virtue of* having powers $\{a, b\}$. Since $\{a, b\}$ is part of $\{a, b, c\}$, the causal transaction of $M$ is **included within** the causal transaction of $P$.

  **Addressing your "Repakaging" Worry:**
  You worry this is just functionalism repackaged. But standard functionalism cannot solve exclusion because it treats the mental property as a *role* and the physical property as the *occupant*. The occupant does the work; the role is just a label.
  Shoemaker's innovation is to say the mental property is **not a role**. It is a real property that *owns* the powers $\{a, b\}$.
  *   When $P$ causes $E$, it does so by exercising powers $\{a, b, c\}$.
  *   When $M$ causes $E$, it does so by exercising powers $\{a, b\}$.
  *   These are not two causes. It is **one cause** (the instantiation of the power cluster) instantiating two properties.

  Because the property instantiation is singular, there is no overdetermination. Because the mental property *is* the cluster of powers $\{a, b\}$, it is not epiphenomenal. It does causal work *because* it is identical to that portion of the physical cause that did the work.

  This is not a semantic trick. It is a claim about the **individuation of causal events**. If properties are individuated by powers, and the powers of $M$ are a subset of $P$, then the instantiation of $P$ *necessitates* the instantiation of $M$. They are not competing causes; they are nested properties of the same substance.

  ### 4. The "Common Subset" and Empirical Discovery

  Your strongest point is: *I can't see how you'd specify that fixed, realizer-independent subset in advance... without quietly falling back on a functional definition.*

  Here is the rigorous reply: **Shoemaker does not need to specify it in advance.**

  The objection assumes a conceptual priority: that we must define $M$ before we can know if it is realized. Shoemaker reverses this. We identify $M$ empirically by its causal profile.
  1.  We observe that humans avoid pain. We identify a property $M_{pain}$ with the power to cause avoidance.
  2.  We observe that octopuses avoid pain. We identify a property $M'_{pain}$ with the power to cause avoidance.
  3.  If the power "causes avoidance" is individuated by the counterfactual "If stimulated thus, avoidance occurs," and this counterfactual holds for both, then $M_{pain}$ and $M'_{pain}$ are the **same property** (same powers), even if realized by different physical substrates.

  We do not need a "functional definition" in the sense of a conceptual analysis (e.g., "Pain is the state caused by damage..."). We only need **causal individuation**.

  Does this make it functionalism? In a broad sense, yes: it is a **Causal Theory of Properties**. But this is not the "functionalism" Kim attacks. Kim attacks *Role Functionalism* (second-order properties). Shoemaker advocates for a *Causal Theory of First-Order Properties*.
  *   If all properties (physical and mental) are individuated by powers, then physical properties are "functional" in the same way mental properties are.
  *   The distinction between "mental" and "physical" is not that one is functional and the other isn't. The distinction is that physical properties are *maximal* clusters of powers (relative to a theory), and mental properties are *subset* clusters.

  This avoids the collapse because it doesn't privilege mental properties as "roles." It demotes physical properties from "causal atoms" to "clusters of powers." Once you accept that physical properties are also individuated by powers, the worry that mental properties are "just functional" loses its bite, because *everything* is "just functional" (causal) in Shoemaker's ontology. The exclusion problem arises only if you think physical properties have a special "causal oomph" that mental properties lack. Shoemaker denies this: causal oomph comes from powers, and mental properties have powers.

  ### 5. Conclusion: Why the Strategy Survives

  Your objection rests on the idea that identifying a property by a subset of powers forces you into a semantic definition (functionalism) or a rigid physical type (identity theory). Shoemaker escapes this via three moves:

  1.  **Metaphysical, not Semantic:** The subset relation is a relation between *properties*, not *concepts*. We don't need to define the subset linguistically; we just need the powers to actually overlap metaphysically.
  2.  **First-Order, not Second-Order:** Mental properties are not "roles" waiting for realizers. They are first-order properties that *are* the causal powers. This avoids the epiphenomenalism of standard functionalism.
  3.  **Inclusion, not Competition:** Because the powers of $M$ are a subset of $P$, the causation of $M$ is not distinct from the causation of $P$. It is the same causal transaction. This dissolves Kim's exclusion premise without denying the distinctness of the properties.

  The "subset" move is not a repackaging of plain functionalism because plain functionalism cannot explain *how* the mental property gets causal grip. It hands the grip to the realizer. Shoemaker explains the grip: the mental property *is* the grip (the powers), and the realizer *has* that grip plus more.

  Therefore, Shoemaker's strategy survives. It accepts the causal closure of the physical (all physical effects have physical causes with sufficient powers) but denies that this excludes mental causes, because the mental cause is **constitutively included** in the physical cause, not competing with it. The multiple realizability worry is handled by recognizing that different physical bases can share identical causal powers without being identical physical types, just as different tools can share the power "to cut" without being the same kind of blade.
