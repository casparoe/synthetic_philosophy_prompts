prompt: |-
  hi so for history class we're doing a unit on the scientific revolution and i got kind of obsessed with Hobbes on the side (i know, not the assigned reading, i just went looking). everyone always quotes the "geometry is the only science" line from Leviathan but i found this way wierder bit in his book Concerning Body where he's defining "endeavour" and randomly stops to redefine what a "point" even is:

  "First, I define ENDEAVOUR to be Motion made in less Space and Time then can be given; that is, less then can be determined or assigned by Exposition or Number; that is, Motion made through the length of a Point, and in an Instant or Point of Time. For the explayning of which Definition it must be remembred, that by a Point is not to be understood that which has no quantity, or which cannot by any means be divided (for there is no such thing in Nature); but that whose quantity is not at all considered, that is, whereof neither quantity nor any part is computed in demonstration; so that a Point is not to be taken for an Indivisible, but for an Undivided thing."

  i get that Euclid's point has literally zero size, but Hobbes seems to be saying a point DOES have some size, we just ignore it when we're doing the proof?? and then the "indivisible vs undivided" thing at the end feels like a word game, like he's dodging saying it has parts without explaining why that's actually different from just... having parts. is there a real philosophical reason he's doing this (something to do with him thinking everything that exists has to be a body?), or is he just fudging it to avoid a contradiction. would love an actual breakdown, not just "old philosophy is confusing lol"
