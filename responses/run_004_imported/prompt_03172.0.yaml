answer: |-
  You have spotted something genuinely profound about Hobbes, and you are absolutely right to be suspicious. This isn't just "old philosophy is confusing"—this is Hobbes backing himself into a corner because of his own extreme philosophical commitments.

  You asked if there is a real philosophical reason for this or if he is just fudging it to avoid a contradiction. The answer is **both.** He has a very serious philosophical reason for redefining the point, but that reason forces him to "fudge" the mathematics in a way that made actual mathematicians of his time (like John Wallis) tear their hair out.

  Here is the breakdown of why Hobbes does this, why the "indivisible vs. undivided" distinction matters to him, and why it ultimately creates a problem.

  ### 1. The Core Constraint: Radical Materialism
  To understand this passage, you have to remember Hobbes's golden rule: **"Everything that exists is Body."**

  For Hobbes, the universe is a plenum of matter in motion. There is no such thing as "incorporeal substance." No spirits, no souls, and crucially for this discussion, **no abstract mathematical objects that don't correspond to physical reality.**

  *   **Euclid's Point:** A location with zero dimension. It is an abstraction. It has no length, width, or depth.
  *   **Hobbes's Problem:** If a point has zero size, it is *nothing*. If it is nothing, it cannot exist in nature. If it doesn't exist in nature, you cannot build a physics (a science of moving bodies) upon it.

  Hobbes wants to unify geometry and physics. He wants to say that geometric lines are actually the tracks left by moving physical bodies. But a physical body *must* have magnitude. Therefore, for Hobbes, a geometric point cannot be a dimensionless abstraction; it must be a **very small physical body.**

  ### 2. "Indivisible" vs. "Undivided"
  This is the specific word game you noticed, and it is the linchpin of his argument.

  *   **Indivisible (The Atomist view):** Something that *cannot* be divided. It has no parts. This is Euclid's point. Hobbes rejects this because he believes matter is infinitely divisible. If you say a point is indivisible, you are claiming there is a smallest unit of space, which Hobbes thinks is false.
  *   **Undivided (The Hobbesian view):** Something that *could* be divided, but we are choosing not to divide it *for the purpose of this calculation.*

  **The Analogy:** Think of a pixel on your computer screen.
  *   **Euclid** says a point is like a mathematical coordinate $(x,y)$; it has no width or height.
  *   **Hobbes** says a point is like a **pixel**. A pixel definitely has size (it's made of red, green, and blue sub-pixels). But when you are drawing a line in a low-res image, you treat the pixel as a single unit. You ignore its internal parts.

  Hobbes is saying: *"A point is a body. It has parts. But when I am doing geometry, I am not going to count those parts. I am treating it as 'undivided'."*

  This allows him to keep his materialism (everything is a body with size) while still doing geometry (treating things as if they have no size).

  ### 3. Why He Needs This for "Endeavour" (*Conatus*)
  You mentioned he defines "Endeavour" right before this. This is crucial. Hobbes is trying to explain how motion starts.

  If space and time are infinitely divisible (which Hobbes believes), then for any distance an object moves, there is always a smaller distance before it. So when does the motion *begin*?
  *   If the first instant of motion has zero duration, nothing happens.
  *   If the first instant has duration, how small is it?

  Hobbes needs a "minimum" to explain causality. He defines **Endeavour** as the infinitesimal beginning of motion. It is motion through a "point" in an "instant."
  *   If the point were truly size-less (Euclid), the body wouldn't move anywhere.
  *   If the point has size (Hobbes), the body moves a tiny, unassignable amount.

  He defines it as "less Space and Time then can be given." He is essentially describing what calculus would later call a **differential** ($dx$ or $dt$), but he refuses to call it "zero" or "infinity" because those aren't "bodies." He needs it to be a *real physical quantity* that is just too small for us to measure.

  ### 4. Is He Fudging It?
  Yes, but philosophically consistently.

  Hobbes prioritizes **ontological consistency** (everything must be a body) over **mathematical rigor**.
  *   **The Mathematicians (Wallis, Boyle):** They told Hobbes he was wrong. You can't redefine the axioms of geometry just because you want them to fit your physics. A point *is* dimensionless by definition. If you give it size, your proofs break (e.g., lines made of points would have thickness).
  *   **Hobbes:** He didn't care. He thought the mathematicians were dealing in "unintelligible jargon." He believed that if a definition doesn't correspond to a physical thing, it's nonsense.

  This actually led to one of the most famous feuds in the history of science. Hobbes spent the last decades of his life trying to prove he could "square the circle" using his own weird definitions of points and lines. The mathematical community unanimously agreed he was wrong, but Hobbes died convinced they were all conspiring against him.

  ### 5. Why This Matters for Your Unit
  Since you are studying the Scientific Revolution, this passage is a perfect example of the tension between **Mechanical Philosophy** and **Mathematized Nature.**

  *   **Galileo/Newton:** Wanted to describe nature using mathematics, even if the math involved abstract concepts (like zero-sized points or forces acting at a distance) that didn't feel "physical."
  *   **Hobbes/Descartes:** Wanted to explain nature purely through **contact mechanics** (bodies bumping into bodies).

  Hobbes is pushing the Mechanical Philosophy to its absolute limit. He is so committed to the idea that "to exist is to be a body" that he is willing to break Euclidean geometry to make it work.

  ### Summary
  *   **Is it a word game?** Yes, but a deliberate one. "Undivided" allows him to say a point has parts (materialism) without counting them (geometry).
  *   **Is there a philosophical reason?** Yes. His strict corporealism forbids the existence of dimensionless abstractions.
  *   **Is he fudging?** Mathematically, yes. He is trying to solve the problem of infinitesimals (which calculus would solve 50 years later) using only physical definitions.

  You found the exact spot where Hobbes's genius meets his stubbornness. He realized that standard geometry didn't fit his physics, so instead of changing his physics, he tried to rewrite geometry. It didn't work, but it was a fascinating attempt to make the universe entirely made of "stuff."
