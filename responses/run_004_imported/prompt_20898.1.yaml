answer: |-
  **Setting:** *A university office, late afternoon. Books on evolutionary psychology and philosophy of biology are stacked on the desk. ALEX (Adaptationist) and BLAKE (Byproduct Theorist) are finishing a coffee.*

  **Alex:** I've been grading the proposals for the seminar papers. It's exactly as you predicted. Half the class is ready to dismiss female orgasm as a spandrel because they read the first two chapters of Lloyd and feel they've solved the puzzle. They treat the "male nipple" analogy as a trump card.

  **Blake:** Well, is it not? If the default position is that traits without clear function are byproducts, and Lloyd shows the adaptive hypotheses are empirically bankrupt, the inference seems valid.

  **Alex:** It's valid only if you accept a false dichotomy. The students are sliding from "no adaptive hypothesis has yet been vindicated" to "therefore it is a byproduct." That's an argument from ignorance. Just because the sperm-retention hypothesis or the pair-bonding hypothesis fails Lloyd's scrutiny doesn't mean *no* adaptive story exists. It just means we haven't found the right one yet.

  **Blake:** And that is precisely how just-so stories proliferate. If the failure of a hypothesis is met with "try again" rather than "falsified," adaptationism becomes unfalsifiable. Lloyd's contribution isn't just criticizing specific hypotheses; it's setting an evidential standard. You don't get to posit a function unless you can show design features *suited* to that function.

  **Alex:** But that standard is rigged against the biology of the trait. Consider the homology argument. Gould compares the clitoris to male nipples. But male nipples are truly vestigial; they have no independent innervation or vascular structure distinct from the female pattern other than size. The clitoris is different. It is a distinct organ with massive neural investment. To say it's a byproduct because it shares developmental origins with the penis is to ignore that plenty of uncontroversial adaptations are built from repurposed, shared developmental machinery. Bird wings are modified dinosaur forelimbs. Does the homology with grasping arms mean flight wasn't selected for?

  **Blake:** Excellent analogy, except for the disanalogy. We have independent evidence that wings were selected for flight: the aerodynamic structure, the hollow bones, the muscle attachment points. They exhibit *design* for lift. With the female orgasm, the adaptationists point to *effects*—orgasm might retain sperm, it might bond pairs—but they cannot point to *design*. If orgasm were selected for sperm retention, why is the mechanism so notoriously unreliable at the very task it's supposed to perform?

  **Alex:** You're citing the intercourse statistic.

  **Blake:** I am. Lloyd's most damning point. If the function is sperm retention via the "upsuck" theory, or even pair-bonding via reinforcement of intercourse, the trait should be reliably triggered by intercourse. It isn't. Without direct clitoral stimulation, orgasm during intercourse is the exception, not the rule. That isn't just noise; that's a structural mismatch between the proposed function and the trait's actual profile.

  **Alex:** But that assumes the Environment of Evolutionary Adaptedness (EEA) looked like a modern bedroom. You're judging a Pleistocene adaptation by contemporary self-report data. Maybe the coital practices of our ancestors ensured higher reliability. Or, perhaps more plausibly, the variability *is* the adaptation. Conditional strategies are common. Maybe orgasm functions as a filter for partner quality—occurring only when the partner possesses specific, perhaps olfactory or behavioral, cues that we haven't identified yet. The "inconsistency" isn't a bug; it's a feature of a discriminative mechanism.

  **Blake:** Now you're moving the goalposts. First, it was sperm retention. Now it's a quality filter. This is the "search and rescue" mission Lloyd warns about. When one function is ruled out by the data, the adaptationist posits a hidden variable to save the hypothesis. But notice what you're doing: you're explaining away the data that contradicts the adaptationist view as "complexity," while the byproduct view predicts that data perfectly. If orgasm is simply the homologous counterpart to male ejaculation, selected for in males but merely carried over in females, then high variability and loose coupling to reproduction are exactly what we expect. The byproduct account predicts the noise. The adaptationist account has to explain it away every time.

  **Alex:** I'm not explaining it away; I'm modeling it. But here is where I think we actually disagree, and it's not about the data itself. You're insisting that unless we see a "tight fit" between mechanism and proposed function *now*, we must default to byproduct. But evolutionary history is messy. Exaptations happen. A trait can be co-opted. If female orgasm *does* increase paternity confidence, even inconsistently, that provides a selective gradient. Over deep time, even a weak gradient can shape a trait. Why is your evidential standard so strict that it rules out weak selection pressures?

  **Blake:** Because without that standard, there is no brake on the narrative. Any benefit, no matter how incidental, becomes a "function." If I say my nose is adapted to hold up my glasses, I can find a benefit. The question is whether the nose was *designed* for glasses. Lloyd argues that for orgasm, we see the design for *pleasure* and *release*—which serves the male function—and the female version is a shadow of that. To claim it's an adaptation, you need to show that the female-specific variance is shaped by selection, not just that the trait *can* be useful.

  **Alex:** So you require evidence of specific design features before we accept an adaptive hypothesis.

  **Blake:** Yes. Correlation of effect is not evidence of design.

  **Alex:** And I argue that in evolutionary biology, consistent benefit *is* evidence of design, provided the benefit impacts fitness. You're demanding a blueprint we may never find because the neural architecture is opaque.

  **Blake:** No, I'm demanding that you distinguish between a trait that *works* and a trait that was *built to work*.

  **Alex:** *(Pauses, leaning forward)* Okay. Let's strip this down. You say the variability and the low intercourse reliability are evidence against adaptation because they show a lack of design. I say they are compatible with adaptation because selection pressures are complex and conditional.

  **Blake:** Right.

  **Alex:** But if we found a mechanism—say, a specific hormonal cascade triggered only by high-quality partners that reliably induced orgasm and increased conception rates—would you accept the adaptationist view?

  **Blake:** If it showed *design* for that discrimination? Yes. If it just showed a correlation? No.

  **Alex:** And if we found that the variability was random, with no correlation to partner quality or context, would I accept the byproduct view?

  **Blake:** You should.

  **Alex:** But I might not. I might argue the selection pressure was too weak to eliminate the noise.

  **Blake:** *(Taps the desk)* There it is.

  **Alex:** What?

  **Blake:** We aren't disagreeing about the statistics of orgasm. We aren't even disagreeing about the homology. We're disagreeing about the **burden of proof regarding design.**

  **Alex:** Go on.

  **Blake:** My position is that the absence of a reliable mechanism linking the trait to the benefit is *positive evidence* for the byproduct account. It's not just a lack of proof for adaptation; it's data that fits the null hypothesis better than the adaptive one.

  **Alex:** And my position is that the absence of a reliable mechanism is merely a *lack of proof* for adaptation, which leaves the adaptive hypothesis open, provided a fitness benefit is plausible.

  **Blake:** So, for you, the null hypothesis is always "Adaptation until proven otherwise."

  **Alex:** No. The null is "Trait exists." The question is whether we can infer selection. I say we infer selection from fitness consequences, even if the mechanism is noisy. You say we can only infer selection from evidence of specific design engineering, regardless of fitness consequences.

  **Blake:** Precisely. Lloyd's standard isn't just about being rigorous; it's about whether "benefit" equals "function."

  **Alex:** *(Nods slowly)* So the crux isn't the female orgasm data itself. It's whether a trait's inconsistent performance constitutes a falsification of an adaptive hypothesis, or merely a constraint on the modeling.

  **Blake:** If it's a falsification, the byproduct view wins by default. If it's just a constraint, you keep searching for the adaptive story.

  **Alex:** And that determines whether my students are allowed to write papers on "The Adaptive Variability of Female Orgasm" or if they have to title them "The Persistence of a Developmental Byproduct."

  **Blake:** Exactly. Until we settle whether "noise" is evidence of non-adaptation, we're just talking past each other about spandrels.

  **Alex:** *(Picks up his pen)* Then that's the seminar topic for next week. Not the orgasm. The noise.

  **Blake:** I'll bring the papers on null models.

  **Alex:** And I'll bring the models of weak selection. We'll see which one the class thinks carries the burden.
