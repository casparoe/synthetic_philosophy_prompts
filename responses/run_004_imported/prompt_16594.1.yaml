  3.  **Evaluate the ML Premise (Loss Functions):**
      *   *Cross-Entropy (Log Loss):* Measures the difference between two probability distributions. Standard for classification when outputting probabilities.
      *   *Hinge Loss:* Used in SVMs. Focuses on maximizing the margin, not necessarily calibrating probabilities.
      *   *MSE (Mean Squared Error):* Often used for regression, sometimes classification. Corresponds to the Brier Score in a probabilistic context.
      *   *Goal:* Predictive *performance* (minimizing error on a specific task, often computational efficiency, robustness, or margin maximization).

  4.  **Identify the Disconnect (The "Missing Something"):**
      *   **Goal Mismatch:** Epistemology cares about *calibrated belief* (representing the world accurately). ML often cares about *decision making* or *ranking* (minimizing task-specific cost).
      *   **Properness vs. Consistency:** Log loss is *strictly proper* (encourages truthfulness). Hinge loss is *classification-consistent* (minimizing it leads to the optimal classifier) but *not proper* (minimizing it doesn't necessarily yield true probabilities).
      *   **Computational Tractability:** Log loss can be unstable (log(0)), sensitive to outliers, or computationally heavier than hinge loss in some optimization landscapes (convexity properties).
