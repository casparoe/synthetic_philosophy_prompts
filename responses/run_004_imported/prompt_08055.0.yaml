      *(Self-Correction during drafting)*: Make sure I don't sound like I'm ignoring the money lost. Acknowledge the cost, but explain why punishment doesn't prevent recurrence.

      *(Key Insight)*: The best way to handle the "carelessness" fear is to define *what* we hold people accountable for. We hold them accountable for following the *process*, not for the *outcome* when the process is broken.

      *(Final Plan)*:
