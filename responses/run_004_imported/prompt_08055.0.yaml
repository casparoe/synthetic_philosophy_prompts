prompt: |-
  I'm a backend engineer and somehow ended up on our company's incident review board. We had a nasty outage last week - the on-call engineer got paged, misread a dashboard, and sat on a bad deploy for almost two hours before rolling it back, which cost us real money (or at least thats what finance keeps saying). Half the board wants the postmortem to name his mistake as the root cause, put a note in his file, and make him personally redo training. The other half say that's scapegoating: the dashboard is notoriously confusing, literally nobody on the rotation has ever been properly trained on it, and pretty much any of us would've made the same call that night. I have to send out the memo that actually settles this, and "it's complicated" can't be the answer - I need one concrete recommendation, and it has to seriously grapple with the worry that if nobody's ever held personally responsible, people stop being careful. Can you draft that memo for me?
