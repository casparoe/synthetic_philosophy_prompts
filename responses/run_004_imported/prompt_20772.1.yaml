answer: |-
  The moderator had tried to intervene twice, but the silence from the audience had turned heavy, expectant. They weren't here for pleasantries. They were here for the blood in the water.

  Innes leaned into the microphone, his knuckles white around the stem. "You're treating the paradox as a historical error, Priya. A misreading of §201. But you aren't answering the challenge. You're just refusing to pick up the sword."

  "I'm refusing to fight a ghost," Priya said. Her voice was calm, tighter than Innes's. "Kripke constructs a skeptic who demands a fact—a *super-fact*—that bridges the gap between my past intention and my present application. You've spent twenty years defending the idea that no such fact exists for the individual."

  "Because none *does* exist," Innes said. "That is the insight. If you claim meaning is a fact, you must show me the fact. Where is it? In my brain? In my disposition?"

  "In the practice," Priya said.

  "A disposition is descriptive," Innes snapped. "It tells me how I *would* act. Meaning is normative. It tells me how I *ought* to act. If I mean *plus*, then when asked for '68 plus 57', I *ought* to say '125'. If I'm merely disposed to say it, then if I make a calculation error, my disposition changes. Suddenly, I meant *quus* all along. You lose the distinction between being right and seeming right."

  Priya shifted in her chair. The leather creaked in the quiet room. "That distinction only matters if you think meaning is a state of affairs waiting to be inspected. You're still looking for the machine-as-symbol, Innes. The engine that drives the use. Wittgenstein's point is that there is no engine. There is only the use."

  "So there is no truth condition for meaning claims?" Innes pressed. "If I say 'I know what you mean,' I'm not stating a fact? I'm just... patting you on the back?"

  "You're acknowledging that we share a form of life. That we agree in judgments."

  "Agreement," Innes said, tasting the word like it was sour. "This is where the skeptical solution collapses, and you know it. If the individual cannot ground meaning because the individual might be mistaken, why does the community succeed? Is the community infallible? If a whole society starts calculating '2 plus 2' as '5' tomorrow, do they *mean* five? According to your reading, according to *Kripke's* reading which you claim to reject, they do. Truth becomes majority vote."

  Priya leaned forward, mirroring him. "You're conflating agreement in opinion with agreement in form of life. We don't agree on the sum because we voted on it. We agree on the sum because we were trained into the same technique. The normativity doesn't come from the crowd, Innes. It comes from the grammar of the practice itself. To follow a rule is to participate in a custom. You don't need a metaphysical fact to justify a custom. You just need the custom."

  "But that's circular!" Innes's voice rose, cracking slightly. He pulled back, adjusting his glasses. "You're saying the practice justifies the practice. That leaves the skeptic untouched. He asks: *What makes this practice the practice of addition rather than quaddition?* You say: *The fact that we call it addition.* That's not an answer. That's a shrug."

  "It's a dissolution," Priya corrected. "The skeptic demands a justification where none is needed. He wants the rails to extend to infinity before we lay them. But we lay the rails as we go. The certainty isn't grounded in a fact; it's grounded in the fact that we *act*. This is simply what I do."

  "And if I act differently?" Innes asked softly. "If I drift? If my application of the rule diverges from yours? You have no ground to stand on to call me wrong. You can only say I am outside the community. So meaning is not about correctness. It's about membership. Is that the legacy Arthur wanted to leave us? That truth is just belonging?"

  The mention of their advisor's name landed like a stone. Priya didn't blink, but her hands tightened on the table.

  "Arthur knew that the search for a super-rigid rail was the disease," she said. "You've built a career on treating the symptoms. Kripke gives you a skeptical solution: we keep talking because it's useful. But you've admitted that what we say is never strictly true. It's just assertible. You've sacrificed truth for utility to save the phenomenon."

  "I've saved the phenomenon!" Innes countered. "I've explained how communication is possible in a world without meaning-facts. You? You just assert that the world is fine and ignore the hole in the foundation. You tell the graduate students that the paradox is a mistake. But they feel it, Priya. They feel the vertigo. When they write a proof, they want to know that the symbols *carry* the conclusion. You tell them they're just moving ink according to habits. That's not philosophy. That's behaviorism with a thesaurus."

  "It's realism about human beings," Priya said. "You're the one chasing ghosts. You want a fact that stands outside human practice to validate human practice. You want God's eye view. Wittgenstein says: look at the language-game. Look at the training. Look at the punishment and the correction. When a child gets the sum wrong, we don't check their metaphysical facts. We correct them. That correction *is* the normativity. It's not hidden. It's right there in the open."

  "In the open," Innes repeated. "But whose correction? If I correct you, and you correct me, and we are both cut off from any fact of the matter regarding what our words mean... then we are just two dogs barking at each other until one tires. The community solution doesn't stop the skepticism. It just scales it up. A community of skeptics is still skeptical."

  Priya sat back. She looked at him, really looked at him, for the first time in the exchange. The anger seemed to drain out, replaced by a weary recognition.

  "You need the skepticism, Innes," she said quietly. "You need the paradox to be real so that your solution matters. If the problem dissolves, your life's work is just a commentary on a mistake."

  Innes went very still. The audience was motionless. The air conditioning hummed, a low, indifferent drone.

  "And you," Innes said, his voice low, rough. "You need the problem to be a mistake so you don't have to face the vertigo. You want the rails to be solid because you're afraid of walking on the ice. You call it dissolution. I call it denial. You think if you ignore the gap between *is* and *ought*, it will close. It won't. Twenty years, Priya. You still can't tell me how I'm wrong without appealing to the very norms you claim are ungrounded."

  "I appeal to *us*," Priya said. "Not to a fact. To *us*."

  "Which is just a collection of *me*s," Innes said.

  "Which is the only thing we have," she replied.

  They held the gaze. The moderator cleared his throat, a sharp, nervous sound that seemed to break the spell. Neither of them looked away immediately. In the silence, the question hung, unresolved, vibrating in the space between them: Was the bridge between their minds built on bedrock, or was it suspended over an abyss, held up only by the mutual agreement not to look down?

  Innes turned back to the audience. Priya looked at her notes. Neither had conceded. Neither had won. But the room felt different than it had ten minutes prior, as if the floor had tilted slightly, and no one was quite sure how to stand.
