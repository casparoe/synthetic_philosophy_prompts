answer: |-
  You have hit on one of the most fascinating tensions in the history of ideas, and your LessWrong comparison is incredibly apt. Hobbes is essentially the grandfather of the rationalist project: the belief that if we can just define our terms clearly enough and reason rigorously enough, we can solve human conflict like we solve for *x*.

  However, there is a crucial historical correction needed here that actually makes your point even stronger: **Hobbes did not crack the quadrature of the circle.**

  In fact, he famously failed at it, repeatedly, well into his old age. He published multiple claimed proofs, and each time he was publicly demolished by mathematicians (most notably John Wallis). This became a massive scandal. Hobbes refused to accept the refutations, insisting the mathematical establishment was conspiring against him.

  The irony is thick: Hobbes wanted to ground political authority in indisputable reason, but his own attempt to prove his mathematical competence became a spectacle of irrational stubbornness.

  That said, your core question stands: **Why didn't the "Euclidean Method" (*more geometrico*) take over ethics and politics?** Did we lose our nerve, or is the project impossible?

  It's not that people lost their nerve; it's that they ran into three hard walls that don't exist in geometry.

  ### 1. The Problem of "Self-Evident" Axioms
  In Euclidean geometry, the axioms (e.g., "a straight line can be drawn between any two points") are abstract definitions. They are true by stipulation within the system.

  In Hobbes's political geometry, the "axioms" are empirical claims about human psychology disguised as definitions.
  *   **Hobbes's Axiom:** Humans are fundamentally driven by a "perpetual and restless desire of power after power."
  *   **The Problem:** This isn't a logical truth; it's a contingent claim about biology and sociology. If you change the axiom (e.g., "Humans are fundamentally cooperative," as Kropotkin later argued), you deduce a completely different theorem (Anarchism instead of Absolutism).

  In math, you can't argue with the axiom of parallel lines without changing the geometry. In politics, arguing about the "axioms" *is* the politics. You can't deduce a political system if you can't agree on the nature of the substrate (humans).

  ### 2. Hume's Guillotine (Is vs. Ought)
  This is the deeper philosophical reason. Geometry deals with what *is* (relations of quantity and figure). Politics and ethics deal with what *ought* to be.

  David Hume later pointed out that you cannot logically deduce a value judgment from a factual premise. Hobbes tries to sneak this in. He describes the State of Nature (a factual claim, allegedly) as "nasty, brutish, and short" (a value judgment), and then deduces that we *ought* to submit to a Sovereign.

  But logically, one could say: "The State of Nature is nasty, therefore we should all kill ourselves," or "The State of Nature is nasty, therefore we should embrace chaos." The move from "war is bad" to "therefore you must obey the King" requires a normative bridge that pure deduction cannot provide. Math doesn't have an "ought," so the Euclidean method breaks when you introduce morality.

  ### 3. Semantic Drift
  Mathematical symbols are stable. The symbol $\pi$ does not change meaning over centuries or depend on cultural context.

  Political words do. When Hobbes defines "Liberty" or "Justice," he is fighting a war over language. If you build a deductive system on words that shift meaning depending on who is speaking, the deduction becomes unsound. This is why modern analytic philosophy spends so much time on language; they realized you can't do Hobbesian deduction without first stabilizing the variables, which might be impossible.

  ### Who tried to carry the torch?
  People didn't stop trying. In fact, Hobbes's contemporary, **Baruch Spinoza**, went even further. His book *Ethics* is literally written "in the geometric order" (Definitions, Axioms, Propositions, Proofs, Q.E.D.).
  *   **Result:** It is a masterpiece of logic, but most philosophers agree he only succeeds because he defines "God" and "Nature" in such a specific way that the system becomes tautological. It works as a closed logical system, but it doesn't necessarily map to reality.

  Later, **Kant** tried to axiomatize morality with the Categorical Imperative. **John Rawls** tried to axiomatize justice with the Veil of Ignorance. **Utilitarians** tried to create a "hedonic calculus." All of them ran into the same wall: the inputs are too messy for the logic to guarantee the output.

  ### The LessWrong Connection
  Your intuition about LessWrong is spot on. The modern project of **AI Alignment** is essentially the new *Leviathan*.
  *   **The Goal:** Define human values (axioms) rigorously enough that an AI (the Sovereign) can optimize for them without destroying us (the State of Nature).
  *   **The Risk:** Just like Hobbes, there is a temptation to believe that if we are just *rigorous enough*, we can solve the problem. But if your utility function (axiom) is slightly off, the deduction leads to catastrophe (paperclip maximizer).

  Hobbes's failure to square the circle is actually the perfect metaphor for his political philosophy. He thought he had found a perfect, rational solution to the problem of order. But human society isn't a circle; it's a complex, adaptive, chaotic system. You can't solve it with a compass and a straightedge.

  So, to answer your question: It's not that we lost our nerve. It's that we realized **political philosophy isn't math.** It's engineering with materials that talk back. Hobbes's genius was seeing the potential for rigor; his failure was assuming the rigor alone was sufficient to guarantee truth.
