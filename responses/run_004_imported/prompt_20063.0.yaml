      *   **Core Implication 1: The Boundary is a Design Choice, Not a Truth.** (Addressing the circularity). You have to *stipulate* the initial boundary.
      *   **Core Implication 2: Distinguish Types of Decisions.** (Addressing AAI vs. ASP). Technical decisions vs. Community norms vs. Licensing.
      *   **Core Implication 3: Contribution as the Practical Proxy.** (Addressing the "who" question). Why "doers" often make the most stable *demos* in OSS.
      *   **Core Implication 4: The Fork as the Ultimate Check.** (Addressing the stakes). OSS isn't a state; exit is possible.
