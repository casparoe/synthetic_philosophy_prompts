      *   *(Refining the Circularity):* The "who decides who decides" problem means the current maintainers have the responsibility to propose the initial boundary, but they must make it easy to change later.
      *   *(Key Insight):* The boundary problem implies that *inclusivity has a cost*. Expanding the *demos* dilutes the intensity of preference. Core devs care more than silent users.

  6.  **Final Polish:**
