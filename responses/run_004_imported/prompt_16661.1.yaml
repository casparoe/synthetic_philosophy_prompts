answer: |-
  It's ironic that we call it "Newtonian Precision," because that only applied to things that couldn't get him burned at the stake. 

  This is a guy who calculated planetary orbits to the decimal, but when he worked out the world ends in 2060, he told everyone, "I'm not asserting this." And when he proved the Trinity was a forgery based on 1 John 5:7, he sent the manuscript to Locke for anonymous publication in Holland, then panicked and pulled it before press.

  Basically, Newton discovered the Uncertainty Principle a century before Heisenberg: You cannot simultaneously know the exact date of the Apocalypse and the security of your tenure. He was fine with deterministic physics, but his theology came with error bars measured in "risk of excommunication."
