answer: |-
  This is an excellent question, and for comps prep, you are absolutely right to flag it. Dismissing it as "loose metaphors" is a bit of a cop-out, especially in *On Certainty*, where the metaphors *are* the philosophical work. Wittgenstein isn't decorating arguments here; he is trying to find a picture that doesn't mislead us.

  The short answer is: **There is a defensible, standard reading that reconciles them, and it hinges (pun intended) on the distinction between a *synchronic* logical necessity and a *diachronic* historical contingency.**

  Your advisor is half-right (Wittgenstein warns against being held captive by pictures), but half-wrong (the shift in pictures marks a shift in philosophical emphasis that is crucial to the text). Here is how you can defend the reconciliation in a comps exam.

  ### 1. The Distinction: Role vs. Proposition
  The key to reconciling §96-97 (River-bed) and §341-343 (Hinges) is to recognize that for Wittgenstein, **nothing is intrinsically a hinge.**

  *   **The Proposition:** "The earth has existed for many years."
  *   **The Role:** Functioning as an exempted certainty.

  A proposition does not possess "hinge-ness" as an inherent property. It *functions* as a hinge relative to a specific language-game at a specific time.
  *   **§341 (Synchronic):** When analyzing the logic of a specific inquiry *right now*, certain things must function as fixed points. If you try to doubt the hinge while playing the game, you aren't playing the game anymore; you've stepped outside the language-game. In this snapshot, the hinge *must* stay put.
  *   **§97 (Diachronic):** When analyzing the history of human thought, the *status* of propositions changes. What was empirical (fluid) can become grammatical (hardened), and what was grammatical can become empirical.

  So, the "must stay put" is a conditional necessity: *If* this inquiry is to proceed, *then* this proposition must function as a hinge. It does not mean the proposition is eternally immune to doubt across all of history.

  ### 2. The Progression of the Text
  It is significant that the River-bed metaphor comes *earlier* in the text than the Hinge metaphor. Many commentators (like Danièle Moyal-Sharrock and Avrum Stroll) argue that Wittgenstein is refining his own picture as he writes.

  *   **The River-bed (§96-99):** This metaphor risks making the certainties look too geological, too slow, and too detached from human action. It suggests a naturalistic evolution of belief.
  *   **The Hinge (§341+):** This metaphor brings in **agency** and **action**. A door doesn't turn by itself; someone turns it. Inquiry is something we *do*. The hinge metaphor emphasizes that certainties are the background against which *action* (doubting, verifying, investigating) takes place.

  The tension you feel is Wittgenstein working out how to describe these certainties without reifying them into "a priori truths" (which he rejects) or mere "psychological convictions" (which he also rejects). He lands on a **pragmatic/functional** view: They are rules of the game that look like moves in the game.

  ### 3. The "Logic" of Investigation
  In §341, Wittgenstein writes: *"it belongs to the logic of our scientific investigations that certain things are indeed not doubted."*

  Crucially, remember that for the later Wittgenstein, "logic" is not the formal logic of the *Tractatus*. It is **grammar**. And grammar is anthropological. It is grounded in forms of life.
  *   When he says the hinges "must stay put," he means that our form of life *currently* relies on them.
  *   When he says the river-bed "may shift," he acknowledges that forms of life change historically.

  **Example for your exam:** Consider the proposition "Objects don't disappear when unobserved."
  *   **17th Century:** Might be a fluid, empirical debate (Berkeley vs. Locke).
  *   **20th Century:** A hinge. If you doubt this in a standard physics lab, you can't do physics. It "must stay put" for the inquiry to function.
  *   **Future/Quantum Context:** Might become fluid again if our form of life shifts to accommodate macroscopic quantum superposition.

  The proposition didn't change; its **grammatical role** in our system changed.

  ### 4. Secondary Literature to Cite
  To show your committee you know the landscape, you should reference how the major interpreters handle this:

  *   **Avrum Stroll (*Moore and Wittgenstein on Certainty*):** He argues for a "two-ply" theory of knowledge. The river-bed/hinge propositions constitute the "framework" which is distinct from empirical knowledge. He leans heavily into the idea that the framework *can* change, reconciling the two metaphors by treating them as descriptions of the framework's stability vs. its evolution.
  *   **Danièle Moyal-Sharrock (*Understanding Wittgenstein's On Certainty*):** She is the leading proponent of the "enactive" reading. She argues hinges are not propositions at all, but **rules** expressed as propositions. Rules can change, but while a rule is in force, it is fixed. This perfectly reconciles the "must stay put" (rules govern the game) with "may shift" (games change over history).
  *   **Crispin Wright:** He frames this as "Entitlement" vs. "Justification." We are entitled to trust hinges without evidence. This entitlement is context-dependent, allowing for the historical shift.

  ### 5. How to Answer the Advisor
  Your advisor says you are overreading "loose metaphors." You can respectfully push back by noting that in *On Certainty*, Wittgenstein explicitly struggles to find the *right* picture because the wrong picture leads to dogmatism.

  *   **The Trap:** If you focus only on the **Hinge**, you risk making certainties look like Kantian synthetic a priori truths (fixed forever).
  *   **The Trap:** If you focus only on the **River-bed**, you risk making certainties look like mere empirical generalizations that are just very well confirmed.

  Wittgenstein needs *both* pictures to avoid both traps. The Hinge prevents us from asking for evidence for our world-picture (it's the axis). The River-bed prevents us from thinking our world-picture is the only possible one (the axis can move).

  ### Summary for Comps
  The defensible reading is **Functional Contextualism**:
  1.  **Hinge Metaphor:** Describes the **logical role** of certainties within a specific language-game at a specific time (Synchronic). They must be fixed *for the game to be played*.
  2.  **River-bed Metaphor:** Describes the **historical status** of those certainties across time (Diachronic). The system of certainties is subject to erosion and change as our form of life evolves.
  3.  **Reconciliation:** A proposition is a hinge only in virtue of its use. The "must" in §341 is the necessity of a rule within a practice, not the necessity of a truth in the universe.

  You aren't overreading it; you've identified the dynamic engine of the book. Wittgenstein is trying to show that objectivity is possible without foundationalism, and that requires certainties that are stable enough to act on, but fluid enough to avoid dogmatism. Good luck with the comps.
