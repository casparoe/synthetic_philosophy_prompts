prompt: |-
  Okay, this is going to sound niche but bear with me. I sit on the curriculum committee that oversees our business school's required "Ethics and Professional Character" course, and this Thursday we have to vote on whether to keep it, substantially revise it, or scrap it in favor of the "behavioral ethics" course our compliance-and-ethics office has been lobbying for over the last two years (think Bazerman-and-Tenbrunsel "Blind Spots" style stuff - decision checklists, situational/environmental design, basically zero talk of character or virtue). The trigger is that our external program reviewers report landed last week, and it leans hard on the situationist critique: it cites the Milgram obedience studies, the seminary-student "Good Samaritan" experiment, even that old Hartshorne and May honesty study where kids were scrupulously honest in one setting and cheated freely in another, all to argue that the course is built on a folk-psychological premise - that people have stable character traits which predict behavior across situations - that decades of social psychology has more or less demolished. Their recommendation is basically: nice virtue-based curriculum, shame if it doesn't survive contact with the literature.

  Funny enough, I had almost this exact fight two nights ago with a friend who's finishing her PhD in social psych. I tried defending the course by saying something like "but virtue for Aristotle already involves practical wisdom, which is sensitive to the particulars of a situation, so it's not like the theory predicts people act identically regardless of context," and she said that's just a post-hoc move that makes the theory unfalsifiable - keep adding "unless the situation calls for something else" and no amount of data could ever count against it. Neither of us budged, and now I have to write something more careful than what I improvised over a second glass of wine.

  Could you draft the actual memo I'd bring to committee? I want one clear recommendation - keep, revise, or replace the course - argued for on the merits, not a "both sides have a point" shrug. But whichever way it comes out, I want the loosing side taken seriously: if the recommendation is to keep or revise, it has to engage honestly with the situationist evidence instead of hand-waving it away; if it's to replace the course, it can't just strawman virtue ethics as assuming people act identically no matter the setting. And if there's an actual philosophical answer to my friend's "unfalsifiable" charge - something sturdier than what I came up with at the bar - please work it in, because that's exactly the kind of thing that would actually land with this committee.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Business school curriculum committee voting on an "Ethics and Professional Character" course.
      *   **Options:** Keep, Substantially Revise, or Scrap/Replace (with a Behavioral Ethics/Compliance course).
      *   **Conflict:** External reviewers cite situationist social psychology (Milgram, Darley & Batson, Hartshorne & May) to argue that "character" is a folk-psychological myth. The proposed alternative is Bazerman/Tenbrunsel style behavioral ethics (checklists, nudges, no virtue talk).
      *   **User's Dilemma:** Had a debate with a social psych PhD friend. User argued Aristotelian *phronesis* (practical wisdom) accounts for context; Friend argued this makes virtue ethics unfalsifiable/ad hoc. User needs a better philosophical defense against the "unfalsifiable" charge.
      *   **Requirements:**
          *   Draft a formal memo to the committee.
          *   Make *one* clear recommendation (Keep, Revise, or Replace).
          *   Engage honestly with the losing side (no strawmanning, no hand-waving).
          *   Address the "unfalsifiability" charge with a sturdier philosophical argument.
          *   Tone: Professional, academic, persuasive, nuanced but decisive.

  2.  **Determine the Recommendation:**
      *   *Option A: Replace.* This aligns with the reviewers and the friend. It's the "modern," "evidence-based" choice. *Downside:* It abandons the normative goal of *forming* professionals, focusing only on *managing* behavior. It risks reducing ethics to compliance.
      *   *Option B: Keep.* This defends the status quo. *Downside:* Ignores the strong empirical evidence against global character traits. Hard to defend against the reviewers without significant changes.
      *   *Option C: Revise (Integration).* This acknowledges the situationist critique (traits aren't global/robust) but argues that *cultivating* sensitivity to situations (virtue as skill) is the best defense against those situations. It bridges the gap.
      *   *Decision:* **Substantially Revise.** This is the most intellectually honest and pedagogically sound path. It accepts the empirical data (situationism is real) but rejects the normative conclusion (therefore, don't teach character). Instead, it reframes character *as* the ability to navigate situations. This allows me to address the "unfalsifiability" charge directly by redefining virtue not as a rigid predictor but as a dynamic capacity.

  3.  **Address the "Unfalsifiability" Charge:**
      *   *The Charge:* If virtue theory says "a virtuous person acts virtuously unless the situation prevents it," then any failure is blamed on the situation, making the theory immune to refutation.
      *   *The Counter-Argument:* Virtue ethics isn't a *predictive* theory of behavior (like physics); it's a *normative* and *developmental* theory. The claim isn't "John will always tell the truth." The claim is "John is *more likely* to tell the truth, and more likely to *recognize* the pressure to lie, and more likely to *recover* if he slips."
      *   *Key Concept:* **Cross-Situational Consistency vs. Cross-Situational Sensitivity.** Situationists attack "global consistency." Virtue ethicists (especially modern ones like Nancy Snow or Kristjánsson) argue for "sensitive stability." The trait isn't a robot program; it's a perceptual skill.
      *   *Falsifiability:* The theory *is* falsifiable if we look for *aggregated* behavior over time, not single instances. Also, if training in virtue doesn't improve resistance to situational pressure compared to controls, *that* falsifies the pedagogical claim.

  4.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Clear recommendation (Revise).
      *   **Context:** Acknowledge the external review and the situationist critique.
      *   **The Case for Behavioral Ethics (The "Losing" Side):** Validate the reviewers' points. Milgram, etc., are real. Checklists work.
      *   **The Philosophical Rebuttal (The Core):** Address the "folk psychology" claim and the "unfalsifiability" charge. Distinguish between *global traits* (which don't exist) and *local competencies* (which do).
      *   **The Recommendation (The "Revise" Plan):** How to integrate behavioral ethics *into* a character framework. "Character as Situation-Management."
      *   **Conclusion:** Final pitch.

  5.  **Drafting - Section by Section (Iterative refinement):**

      *   *Subject Line:* Needs to be formal. "Recommendation regarding ETH-101..."
      *   *Opening:* State the recommendation immediately. "Substantially Revise."
      *   *Engaging the Critique:* Don't dismiss Milgram. Acknowledge that the "Great Man" theory of character is dead. The reviewers are right about *that*.
      *   *The Pivot:* But the conclusion that we should *only* do compliance/behavioral ethics is a category error. Behavioral ethics tells us how we *fail*; Virtue ethics tells us what we are *aiming for*.
      *   *Addressing the Friend's Point:* This needs to be the highlight. "Is Virtue Ethics Unfalsifiable?"
          *   Argument: Situationism treats traits as *causal mechanisms* (Input -> Trait -> Output). Virtue ethics treats traits as *skills* (like playing piano). A pianist makes mistakes in a noisy room. That doesn't mean they lack skill; it means skill is context-sensitive.
          *   Reframing: The hypothesis isn't "Virtuous people never cheat." It's "Virtue-trained students demonstrate higher ethical awareness and resilience across *aggregated* situations than untrained students." That is testable.
      *   *The Curriculum:* Combine them. Use Bazerman to identify the traps (blind spots). Use Aristotle to build the habit of checking for them. "Nudge yourself."
      *   *Tone Check:* Is it too academic? Needs to be actionable for a committee. Is it too defensive? Needs to admit the current course might be too naive.

  6.  **Refining the Philosophical Argument (Self-Correction):**
      *   *Initial thought:* Maybe quote Aristotle directly.
      *   *Correction:* No, keep it accessible. Use the "Skill Analogy." It's stronger for business school. A skill isn't negated by difficulty; it's defined by how one handles difficulty.
      *   *The "Unfalsifiable" point:* Make sure to explicitly state that if longitudinal data shows our graduates behave no differently than peers, the course *has* failed. That makes it falsifiable.

  7.  **Final Polish:**
      *   Ensure the distinction between "Global Traits" (rejected) and "Local Competencies" (accepted) is clear.
      *   Ensure the Behavioral Ethics side feels respected, not dismissed as "mere compliance."
      *   Check the voice: Senior faculty member, thoughtful, decisive.

  8.  *(Final Review against constraints)*:
      *   Clear recommendation? Yes (Revise).
      *   Engage losing side? Yes (Behavioral ethics validated as diagnostic tool).
      *   Address unfalsifiability? Yes (Skill model + longitudinal testing).
      *   Memo format? Yes.

  9.  **Proceed to generate output.** (This matches the thought process to the final response).
answer: |-
  **MEMORANDUM**

  **TO:** Curriculum Committee, School of Business
  **FROM:** [Your Name], Faculty Representative
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding the "Ethics and Professional Character" Requirement

  **Executive Summary**

  Following a review of the external program evaluation and recent faculty discourse, I recommend that the committee vote to **substantially revise** the current "Ethics and Professional Character" course rather than retaining it in its current form or replacing it entirely with the proposed "Behavioral Ethics and Compliance" module.

  My recommendation is based on the following conclusion: The situationist critique of character is empirically robust and must be integrated into the curriculum, but it is pedagogically insufficient on its own. A compliance-focused behavioral ethics course diagnoses *how* we fail but offers no normative framework for *who we aim to become*. The revised course should adopt a "Character as Competency" model, which accepts the situationist data while rejecting the conclusion that character development is futile.

  **1. The Validity of the Situationist Critique**

  We must begin by conceding the central point of the external reviewers and the Compliance & Ethics office. The empirical evidence from social psychology—specifically the Milgram obedience studies, the Darley & Batson "Good Samaritan" experiment, and the Hartshorne & May honesty studies—demonstrates conclusively that human behavior is far more sensitive to situational variables than to global personality traits.

  If our current course implies that students possess (or can develop) a "virtue shield" that allows them to act consistently regardless of context, that premise is indeed folk-psychological and unsupported by data. The reviewers are correct: a curriculum built on the assumption of cross-situational consistency is vulnerable to falsification. Furthermore, the proposed Behavioral Ethics alternative offers proven tools for risk mitigation. Checklists, pre-commitment devices, and environmental nudges (the Bazerman-Tenbrunsel model) are effective at reducing ethical breaches. To ignore these tools would be negligent.

  However, accepting the situationist critique does not logically necessitate abandoning the project of character formation. It only necessitates abandoning a *naive* version of it.

  **2. Addressing the "Unfalsifiability" Charge**

  A significant concern raised during recent deliberations (and in broader academic discourse) is that virtue ethics insulates itself from criticism by claiming that "practical wisdom" (*phronesis*) simply accounts for any situational variance. As one colleague put it: *"If a 'virtuous' person fails, the theory claims the situation was too hard. If they succeed, the theory claims they are virtuous. This makes the theory unfalsifiable."*

  This is a serious charge, but it rests on a category error regarding what virtue theory claims to be.

  Virtue ethics is not a **predictive causal theory** of behavior (like fluid dynamics); it is a **developmental theory of skill**. Consider the analogy of musical performance. If we claim a student is a "skilled pianist," we do not predict they will play flawlessly in a noisy room, while sleep-deprived, or on a broken instrument. If they falter under extreme situational pressure, it does not prove the concept of "musical skill" is a myth. It proves that skill is context-sensitive.

  The situationist critique successfully dismantles the idea of traits as *global behavioral automata*. It does not dismantle the idea of traits as *local competencies*.

  Therefore, the revised course can be made falsifiable by shifting the metric of success. We should not measure success by asking, "Did our graduates never cheat?" (a binary outcome easily swayed by situation). We should measure it by asking: "Do our graduates demonstrate higher ethical *awareness* and faster *recovery* from ethical lapses than a control group over a five-year period?" If longitudinal data shows that our "character training" yields no aggregate difference in ethical resilience compared to the behavioral-only cohort, then the virtue component has failed. This renders the hypothesis testable and falsifiable.

  **3. The Limitation of a Purely Behavioral Approach**

  While the Compliance & Ethics office's proposed course is empirically grounded, it suffers from a normative ceiling. Behavioral ethics is excellent at explaining why good people do bad things (blind spots, implicit bias, conformity). It is less effective at articulating why one should exert the cognitive effort to overcome those biases in the first place.

  A course composed entirely of checklists and environmental design risks teaching students that ethics is merely a management problem to be outsourced to systems. It creates "ethical risk managers" rather than "ethical professionals." In the long term, systems fail. When the checklist doesn't cover a novel scenario, or when the incentive structure rewards a breach, the only remaining variable is the individual's disposition. If we have told them for two years that disposition doesn't matter, we have left them unarmed.

  **4. Recommendation: The "Character as Competency" Revision**

  I propose we retain the "Ethics and Professional Character" title but overhaul the content to synthesize both approaches. The curriculum should be structured around the premise that **character is the cultivated ability to recognize and resist situational pressure.**

  Specific revisions should include:

  *   **Integrate Situationism as Core Content:** Do not hide the Milgram and Hartshorne & May data; teach it in Week 1. Acknowledge that "being a good person" is not enough. Validate the behavioral ethics critique explicitly.
  *   **Reframe Virtue as Situational Sensitivity:** Teach Aristotelian *phronesis* not as a mystical inner compass, but as the skill of reading a room. A virtuous agent isn't someone who ignores the situation; they are someone who notices the situational pressure (e.g., "I am hungry," "I am late," "My boss is watching") and corrects for it.
  *   **Adopt Behavioral Tools as "Virtue Scaffolding":** Use the Bazerman-Tenbrunsel checklists not as replacements for character, but as training wheels for it. The goal is to use external nudges until the internal habit is formed.
  *   **Assessment:** Move away from abstract case studies. Use immersive simulations where situational pressure is actively applied (time pressure, authority pressure) to test if students can deploy their ethical training under load.

  **Conclusion**

  The external reviewers are right that the old model of character is empirically weak. The Compliance office is right that behavioral tools are effective. But the committee must choose between training students to *manage* ethics or to *embody* it.

  By revising the course to treat character as a situational skill rather than a fixed trait, we satisfy the empirical rigor demanded by the reviewers without surrendering the normative mission of the business school. We acknowledge that character is fragile, which is precisely why it must be taught.

  I move that we vote to **Substantially Revise** the course under the framework outlined above.
