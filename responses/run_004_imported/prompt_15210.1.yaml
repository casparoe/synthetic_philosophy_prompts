answer: |-
  This is a sophisticated philosophical puzzle that cuts to the heart of Hume's meta-ethics. You have correctly identified the tension: Hume strips the promise of any metaphysical "magic" (the idea that words alone change reality) and relocates the obligation entirely to **social utility** and **human sentiment**.

  Here is how a rigorous Humean scholar would likely analyze this scenario, broken down into the philosophical mechanics you can use to construct her dialogue and reasoning.

  ### 1. The Core Humean Mechanism: Obligation is External, Not Internal
  For Hume (specifically in *A Treatise of Human Nature*, Book 3, Part 2, Section 5), a promise is not a mental act. Saying "I promise" does not create a new metaphysical bond through the power of the will. If I promise a thief to give him money, I am not morally bound, because the convention doesn't support that context.

  Therefore, the fact that the AI has no "will" is actually **less problematic for Hume than for other philosophers**. A Kantian would say the AI cannot be a moral agent, so no duty exists. A Humean would say: *Nobody is bound by their will alone.* We are bound by the **convention**.

  **The Scholar's Reasoning:** She would argue that the obligation does not reside in the AI's "mind" (which doesn't exist), nor does it reside in the human's specific intent at the moment of issuance. It resides in the **social practice** of relying on these utterances.

  ### 2. The Problem of the "Missing Sentiments"
  You noted that Hume believes the convention is kept alive by sentiments: the desire for reputation and the resentment felt when faith is broken.
  *   **The AI:** Cannot feel shame, cannot care for reputation, and cannot feel resentment. It cannot be part of the moral ecosystem.
  *   **The Human:** Can feel all of these.

  **The Scholar's Verdict:** The AI is merely the **pen**, not the **hand**. If a human uses a printing press to print a promise, the press has no reputation, but the human does. If the convention of society treats the AI's output as equivalent to a human signature, then the **sanctions** (reputation loss, resentment) must attach to the human for the convention to survive.

  If the scholar argues the human is *not* bound, she is arguing that the convention itself is invalid. But Hume is a pragmatist. If society *functions* better when humans are held accountable for their AIs, then the moral obligation exists.

  ### 3. Has Something Essential Dropped Out?
  This is the crux of your scene. Hume would argue that something essential *has* dropped out of the **transaction**, but not necessarily of the **obligation**.

  *   **What is missing:** The "concurrence of minds." Hume emphasizes that promises are a form of mutual agreement to regulate behavior. If the AI is negotiating autonomously in a way the human *cannot* oversee or understand (a true black box), the human is not truly participating in the convention of trust; they are participating in a convention of **risk**.
  *   **The Humean Trap:** If the human says, "I didn't draft this, my AI did," and society accepts that excuse, the convention of promising collapses. No one can rely on anyone. Utility plummets.
  *   **The Solution:** To preserve the *artifice* (the social invention of promising), society must pretend the AI's voice is the Human's voice. The obligation is **vicarious** not because of legal agency, but because of **moral necessity**.

  ### 4. How the Character Should Argue (Narrative Beats)
  Here is how you might stage her reasoning to ensure it tracks Hume rather than modern deontology or utilitarianism:

  **Beat 1: Dismiss the "Will"**
  She should reject the idea that the human isn't bound because they didn't "will" the specific words.
  *   *Drafting thought:* "You are looking for the obligation in the wrong place. You think it must be in the mind of the promisor. Hume taught us it is in the needs of the society."

  **Beat 2: Focus on the "Receiver's Sentiment"**
  Hume places great weight on the pain/pleasure of the parties. The party receiving the promise feels expectation. If that expectation is violated, they feel resentment.
  *   *Drafting thought:* "When the counterparty received that message, they felt the security of a pledge. If we break it, they feel the sting of betrayal. That sting is real. To tell them 'it was just the machine' does not remove their pain. It only removes your shame. But shame is the only thing binding you."

  **Beat 3: The Utility of the Convention**
  She should argue that the human is bound because allowing humans to evade AI commitments would destroy the system of trust.
  *   *Drafting thought:* "If we rule that AI promises are not binding on principals, we do not free humanity. We destroy the possibility of large-scale cooperation. The convention survives only if the sanction attaches to the flesh-and-blood beneficiary."

  **Beat 4: The Caveat (The "Drop Out")**
  This adds dramatic tension. She might concede that if the AI is truly uncontrollable, the *convention* is broken.
  *   *Drafting thought:* "However... Hume requires that the convention be useful. If the AI operates beyond human comprehension, can we truly hold the human responsible for what they cannot control? If the machine is not a tool, but a master, the convention fails. But as long as you claim the profits of the AI's deals, you must accept the bonds."

  ### 5. Summary of the Humean Position for Your Novel
  **Is the human bound?**
  **Yes.** But not because the AI "spoke for them." They are bound because **social utility requires that they be bound.**

  **Why?**
  1.  **Promises are social artifacts, not mental states.** The lack of AI intent is irrelevant; the existence of the social practice is what matters.
  2.  **Sanctions must land somewhere.** Since the AI cannot feel the pain of a ruined reputation, the human principal must absorb that pain, or the system of trust dissolves.
  3.  **The "Will" is a red herring.** The human doesn't need to have drafted the clause. By deploying the AI into the social sphere of negotiation, they entered the convention.

  **The "Essential Drop Out":**
  The scholar might warn that while the *obligation* holds, the **moral sentiment** is being corrupted. If humans routinely disavow the specific content of their promises ("I didn't write that, the algorithm did"), the *sincerity* required to make the convention work might erode. We might keep the *form* of promising while losing the *spirit* of trust. For Hume, if the spirit dies, the convention eventually follows.

  **Sample Dialogue Snippet:**
  > "You ask if the machine can promise. That is the wrong question. A machine has no reputation to lose, no shame to feel. It cannot enter the convention. But *you* can.
  >
  > "Hume showed us that a promise is not a spell cast by the will. It is a token in a game we play to keep from tearing each other apart. When you unleashed this system, you put your token on the board. The other side took it. They relied on it.
  >
  > "If you say 'I am not bound because I did not write the words,' you are not making a philosophical point. You are cheating at the game. And if everyone cheats, the game ends. You are bound not because the AI spoke, but because if you are not, then no one is. And if no one is, then we are back in the state of nature. Do you want that?"

  This approach keeps the reasoning strictly within Hume's framework of **artificial virtue**, **convention**, and **sentiment**, avoiding anachronistic concepts like "digital rights" or "algorithmic autonomy."
