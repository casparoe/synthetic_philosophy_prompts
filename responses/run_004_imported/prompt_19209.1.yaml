prompt: |-
  I'm a retired physiologist who's spent part of retirement falling down the philosophy of science rabbit hole, especially the stats side. I still sit on my old society's Research Integrity Committee -- I guess they keep the emeritus types around so somebody remembers doing this with a slide rule -- and we've got an awkward case for Tuesday. A mid-career PI checked her data every few weeks as animals came through and stopped the moment the effect crossed p<.05, landing at n=54: classic optional stopping, the kind of thing that's supposed to be a big driver of the replication mess. There was no preregistration (this was 2011, before that was standard in our field). Her defense is that peeking is only a sin if your a frequentist about what a p-value means -- the data don't care how she decided to stop collecting them. One committee member, who's been reading Mayo, wants a misconduct finding, since to her this is exactly the error-rate violation behind our field's replication problems. Please draft the memo recommending where this lands -- dismiss it, call it a 'questionable practice' short of misconduct (with whatever corrective step that implies), or refer it up as misconduct -- and actually engage the stopping-rule defense rather than just asserting that error rates are what matter.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Persona:** Retired physiologist, member of a Research Integrity Committee (RIC). Experienced, understands the history (slide rules), familiar with philosophy of science/stats debates (Mayo, frequentism, optional stopping).
      *   **Task:** Draft a memo recommending a decision on a specific case of alleged research misconduct.
      *   **The Case:** Mid-career PI (2011 study), checked data periodically, stopped when $p < 0.05$ ($n=54$). No preregistration (standard for the time).
      *   **The Defense:** "Peeking is only a sin if you're a frequentist... the data don't care how she decided to stop." (Likelihood Principle argument).
      *   **The Accuser/Committee Member:** Wants a misconduct finding based on error-rate violation (Mayo-esque severe testing/error statistics perspective).
      *   **Options:** Dismiss, Questionable Research Practice (QRP) w/ correction, or Misconduct.
      *   **Key Requirement:** Engage with the stopping-rule defense philosophically/statistically, not just assert "error rates matter."

  2.  **Determine the Recommendation:**
      *   *Misconduct (FFP: Fabrication, Falsification, Plagiarism):* In the US (assuming US context given "PI" and "RIC" terminology, likely ORI guidelines), misconduct requires intent to deceive. Optional stopping in 2011 without preregistration was common, though frowned upon by stat nerds. It's rarely classified as *misconduct* unless data were fabricated to fit the stop point.
      *   *Dismiss:* Too weak. It *is* a problem for inference, even if 2011 norms were lax. Ignoring it undermines the committee's purpose.
      *   *Questionable Research Practice (QRP):* This is the sweet spot. It acknowledges the statistical sin without branding the researcher a fraud. It allows for corrective action (correction notice, re-analysis) without nuclear escalation.
      *   *Philosophical Stance:* I need to navigate between the Likelihood Principle (Bayesian/likelihoodist view that stopping rules are irrelevant to the evidence *in the data*) and Error Statistics (Frequentist view that stopping rules inflate Type I error). The memo needs to show understanding of *why* the defense is philosophically coherent but practically problematic in a frequentist publication context.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly.
      *   **Summary of Case:** Briefly recap the "peeking" and the 2011 context.
      *   **Analysis of the Defense (The Core Challenge):**
          *   Acknowledge the PI's argument (Likelihood Principle). Yes, mathematically, the likelihood function is proportional regardless of stopping rule.
          *   Counter with the context of publication. The paper used $p$-values. $p$-values are frequentist tools defined by sampling distributions. Sampling distributions depend on stopping intentions.
          *   Reference Mayo (Error Statistics): It's about the *capacity* of the method to detect errors, not just the specific data point.
          *   Reference the 2011 Context: Preregistration wasn't standard, but standard NHST (Null Hypothesis Significance Testing) was. You can't mix Bayesian stopping logic with Frequentist inference reporting.
      *   **Recommendation:** QRP, not Misconduct.
      *   **Rationale for QRP vs. Misconduct:** Lack of intent to deceive (norms were different), but violation of inferential integrity.
      *   **Corrective Actions:** Correction/Erratum, re-analysis (maybe Bayesian or sequential analysis), training.
      *   **Closing:** Professional sign-off.

  4.  **Refining the Tone:**
      *   Needs to sound like a senior colleague writing to a committee.
      *   Respectful of the philosophy (don't dumb down the stats).
      *   Firm on research integrity standards.
      *   Avoid jargon overload but don't shy away from terms like "Likelihood Principle," "Sampling Distribution," "Type I Error."
      *   *Self-Correction during drafting:* Make sure I don't sound like I'm taking sides in the Bayes vs. Frequentist war, but rather focusing on *consistency* between method and reporting. The PI claimed the data don't care, but the *journal's readers* care about the error rate promised by the $p$-value.

  5.  **Addressing the Specific "Mayo" Point:**
      *   The committee member reading Mayo (Deborah Mayo, *Error and the Growth of Experimental Knowledge*) focuses on "severe testing." Optional stopping undermines severity because the procedure wasn't capable of ruling out chance with the claimed reliability. I need to explicitly mention this.

  6.  **Addressing the "2011 Context":**
      *   Crucial for the misconduct vs. QRP distinction. In 2011, this was "garden of forking paths" territory, not necessarily fraud.

  7.  **Final Polish:**
      *   Check the flow.
      *   Ensure the recommendation is actionable.
      *   Make sure the philosophical engagement is robust (as requested).

  **(Self-Correction Note):** I need to be careful not to give legal advice, but this is a draft memo for an internal committee. I will frame it as a recommendation based on ORI-style definitions (FFP) which is standard for US biomedical RICs.

  8.  **Finalizing the Argument:**
      *   *PI's claim:* Stopping rule irrelevant (Likelihood Principle).
      *   *Counter:* You reported a $p$-value. $p$-values are defined by the sampling distribution under the null. The sampling distribution depends on the stopping rule. Therefore, the reported $p$-value is invalid *given the method used*. It's a category error, not necessarily fraud.

  9.  **Drafting the Content:** (Mental outline of the specific philosophical paragraph)
      *   "The PI argues from the Likelihood Principle..."
      *   "However, the publication contract was Frequentist..."
      *   "Mayo's point is about the probing capacity..."
      *   "Therefore, the inference is unwarranted, but intent is ambiguous."

  10. **Ready to write.** (Proceeds to generate output based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Case #2023-04 (Optional Stopping Allegation)

  **1. Purpose**
  This memo outlines my recommendation regarding the allegation of research misconduct against Dr. [PI Name] concerning the 2011 publication *[Title Redacted]*. The specific allegation is that the PI engaged in optional stopping (repeated significance testing) until $p < 0.05$ was achieved at $n=54$, without adjusting alpha or disclosing the procedure.

  **2. Recommendation**
  I recommend the Committee classify this incident as a **Questionable Research Practice (QRP)**, not Research Misconduct. I further recommend we require the PI to issue a Correction/Erratum to the original publication acknowledging the sampling plan and, if possible, providing a re-analysis (e.g., using sequential boundaries or Bayesian estimation) to demonstrate the robustness of the effect.

  **3. Rationale: Misconduct vs. QRP**
  Under federal guidelines (and our Society's bylaws), Research Misconduct requires Fabrication, Falsification, or Plagiarism (FFP) committed with *intent to deceive*.

  While the statistical handling here is flawed, the context of 2011 is critical. Preregistration was not the norm, and "data peeking" was, regrettably, a common informal practice in our field. While this violates modern standards of transparency, establishing *intent to deceive* rather than *intent to publish* is difficult given the norms of that era. Classifying this as Misconduct sets a precedent that could criminalize common statistical misunderstandings from a decade ago. However, dismissing it entirely ignores the tangible impact on the scientific record. QRP is the appropriate classification: it signals a breach of best practices without alleging fraud.

  **4. Engagement with the Stopping-Rule Defense**
  The PI's defense rests on a specific philosophical claim: *"Peeking is only a sin if you're a frequentist... the data don't care how she decided to stop collecting them."*

  This argument invokes the **Likelihood Principle**, which holds that the evidential meaning of the data is contained entirely in the likelihood function. If one adopts a Bayesian or Likelihoodist framework, the stopping rule is indeed irrelevant to the inference drawn from the observed data. The PI is philosophically coherent *if* she had reported her results as Bayes Factors or Likelihood Ratios.

  However, she did not. She reported a $p$-value.

  The $p$-value is a frequentist construct defined by the sampling distribution of the test statistic under the null hypothesis. As Deborah Mayo (cited by the committee member arguing for misconduct) emphasizes, error statistics are not about the probability of the specific data observed, but about the **capacity of the procedure** to avoid erroneous interpretations. The sampling distribution—and thus the error rate (Type I)—is mathematically dependent on the stopping rule. By checking repeatedly and stopping at significance, the PI altered the sampling distribution, inflating the actual Type I error rate well beyond the nominal 0.05 reported.

  Therefore, the PI's defense contains a category error. She is defending her *data* using Likelihoodist logic, but she published *inferences* using Frequentist logic. You cannot claim the stopping rule is irrelevant (Likelihood Principle) while simultaneously invoking the $p < 0.05$ threshold (Error Statistics). To do so is to claim the benefits of both frameworks while adhering to the constraints of neither.

  **5. The "Mayo" Perspective and Severity**
  The committee member arguing for misconduct is correct in spirit, if perhaps too harsh in classification. From an Error Statistics perspective, the issue is **Severity**. A claim passes a severe test only if it is produced by a method that would likely have detected its falsity if it were false.

  By allowing the sample size to be determined by the results, the PI utilized a method with low severity. The procedure guaranteed that, eventually, random noise would cross the threshold. The readership was led to believe the claim had been tested with a method that controls long-run error rates at 5%, when in reality, the error control was compromised. This undermines the reliability of the record, which is the core concern of our Committee.

  **6. Corrective Action**
  Since we are recommending a QRP finding rather than Misconduct, our leverage is limited to ethical correction rather than punishment. I propose the following:

  1.  **Notification:** The PI must acknowledge in writing that the stopping rule inflated the false-positive risk.
  2.  **Publication Correction:** We request the PI contact the journal to publish an Erratum. This need not be a retraction if the effect size remains robust under correction, but the statistical methods section must be updated to reflect the actual sampling plan.
  3.  **Re-analysis:** We encourage the PI to re-analyze the data using a method consistent with her defense (e.g., Bayesian updating with informed priors) or a frequentist sequential analysis (e.g., O'Brien-Fleming boundaries) to show whether the conclusion holds under valid assumptions.
  4.  **Education:** The PI should complete updated training on modern statistical rigor and preregistration standards, which we can accept as evidence of remediation.

  **7. Conclusion**
  We must avoid the trap of thinking that because the "data are the data," the inference is secure. Inference is a joint product of the data and the method. The PI's method did not match her reporting. While this likely does not meet the high bar of intentional Falsification required for a misconduct finding, it is a clear violation of inferential integrity. A QRP finding allows us to correct the record and educate the member without resorting to a punitive measure that may not stick given the 2011 context.

  I look forward to discussing this at Tuesday's meeting.

  [Signature]
