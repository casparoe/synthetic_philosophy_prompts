      *   *Key Concept:* The distinction between *exclusive* feelings (envy, lust, aesthetic pleasure for the rich) and *universal* feelings (joy, sorrow, moral struggle). Tolstoy argues individuality applies to the *expression* of universal feelings, not the invention of niche feelings.
      *   *Wait, check the text:* Tolstoy says individuality is one of the three conditions of *infectiousness*. But he separates *infectiousness* from *goodness*. A work can be infectious (individual, clear, sincere) but bad (if it conveys bad feelings). To be *good* art, it must also be universally accessible.
      *   *Refinement:* So the tension is between the *mechanics* of transmission (Individuality) and the *moral criterion* of value (Universality).
      *   *Synthesis:* Tolstoy believes that if you are sincere and clear about a *moral* feeling, the individuality of your expression will not hinder accessibility. In fact, clichés (lack of individuality) are often what make art boring or exclusive (requiring education to tolerate).

  7.  **Final Polish:**
