answer: |-
  You have put your finger on the exact nerve that makes *What Is Art?* such a frustrating and electrifying text. As a novelist, your instinct is correct: on the surface, the demand for radical individuality and the demand for peasant-level intelligibility seem to pull in opposite directions. One suggests depth, nuance, and specific subjectivity; the other suggests simplification, didacticism, and a lowest-common-denominator approach.

  However, Tolstoy is not merely being inconsistent. He has a specific philosophical mechanism intended to reconcile these two poles. Whether that mechanism holds up under scrutiny is a different matter.

  Here is how Tolstoy intends the two to fit together, followed by a candid assessment of whether the tension is genuine.

  ### The Reconciliation: Sincerity as the Solvent

  To understand how Tolstoy squares the circle, we have to look at how he defines "Individuality" and how he views the obstacle to "Accessibility."

  **1. Individuality does not mean Idiosyncrasy**
  When Tolstoy demands individuality, he is not asking for the obscure, the avant-garde, or the psychologically recondite. He is arguing against *cliché*. For Tolstoy, a feeling is "individual" when it is freshly apprehended by the artist, rather than copied from previous art.
  *   **The Logic:** If I describe grief using the standard tropes of 19th-century melodrama, I am not being individual; I am being conventional. If I describe grief exactly as I felt it in my gut, stripped of literary decoration, that is individual.
  *   **The Bridge:** Tolstoy believes that fundamental human experiences (birth, death, labor, love, moral failure) are shared by the peasant and the aristocrat. Therefore, the *more* specifically and honestly you render that experience (Individuality), the *more* the peasant will recognize it as truth (Accessibility). Abstraction and ornamentation are what create barriers; concrete, sincere specificity breaks them down.

  **2. Sincerity forces Simplicity**
  This is the crucial hinge in his argument. Tolstoy posits that "exclusivity" (art that only the educated can understand) is almost always the result of *insincerity*.
  *   When an artist writes to impress a salon, to gain fame, or to mimic a master, they layer on complexity, allusion, and technical virtuosity. This creates "counterfeit art."
  *   When an artist is truly seized by a feeling they *must* transmit (Sincerity), they do not have the patience for obfuscation. They want to infect the recipient as directly as possible.
  *   **The Move:** Tolstoy argues that perfect sincerity naturally strips away the artificial barriers of class and education. Therefore, a work that meets the condition of maximum Individuality (via Sincerity) will inevitably meet the condition of Universal Accessibility.

  **3. The "Religious Consciousness" as Common Ground**
  Finally, Tolstoy relies on his concept of the "religious consciousness of the age." He believes there is a universal moral truth available to all humans (specifically, the Christian ideal of universal brotherhood).
  *   If the "individual feeling" being conveyed aligns with this universal moral truth, it is inherently intelligible to everyone, because everyone has access to that moral truth through conscience, regardless of schooling.
  *   If the feeling is exclusive (e.g., the ennui of a rich lover, the aesthetic appreciation of a complex fugue), it fails the moral test *and* the accessibility test.

  **In summary, Tolstoy's equation is:**
  > True Sincerity $\rightarrow$ Concrete Expression (Individuality) $\rightarrow$ Removal of Artifice $\rightarrow$ Universal Accessibility.

  He believes the tension is illusory because he believes *complexity* is usually a mask for *dishonesty*.

  ***

  ### The Candid Assessment: Is the Tension Genuine?

  Yes. The tension is genuine, and your skepticism is warranted. While Tolstoy's internal logic is coherent, it relies on several optimistic assumptions that often collapse in practice.

  **1. The Confusion of "Simple" with "Universal"**
  Tolstoy conflates *accessibility of form* with *universality of feeling*. A peasant can understand the plot of a simple parable, but that does not mean the parable conveys a feeling with the same "individuality" as a complex psychological portrait.
  By disowning *King Lear* or his own *Anna Karenina*, Tolstoy admits that deep psychological individuality often requires a certain cognitive or cultural bandwidth to process. He solves this by lowering the ceiling: if the peasant can't get it, it's not art. But this often means sacrificing the very nuance that makes the feeling "individual" in the first place.

  **2. The Problem of "Bad" Sincerity**
  Tolstoy assumes that sincerity leads to clarity. But a novelist knows this isn't always true. One can be intensely sincere about a feeling that is deeply idiosyncratic, neurotic, or culturally specific. I can be perfectly sincere about my anxiety regarding a specific piece of modern technology; that feeling is individual and sincere, but it is not universally accessible to a 19th-century peasant (nor necessarily to a reader today). Tolstoy has no good metric for distinguishing between "prophetic sincerity" and "self-indulgent sincerity" other than whether it aligns with his specific Christian anarchism.

  **3. The Irony of Tolstoy's Late Style**
  The most damning evidence against his own theory is Tolstoy's own late fiction. In stories like *Father Sergius* or *Hadji Murat* (written after *What Is Art?*), he strove for the simplicity he preached. Yet, these works are not "peasant art." They are psychologically dense, ironic, and complex. They are accessible to a educated reader, but they do not function as the folk-religious unifiers he demanded.
  Even Tolstoy could not fully write the way he preached. He could simplify his prose, but he could not simplify his perception of human nature.

  ### What This Means for Your Ambitions

  You are sensing a strain because Tolstoy is trying to solve a **moral problem** with an **aesthetic solution**.

  *   **The Trap:** If you take Tolstoy literally, you risk flattening your work. You might start editing out nuance in the name of "accessibility," or doubting the validity of a complex emotion because it isn't immediately "universal." This leads to didacticism, which is the death of art.
  *   **The Gift:** However, do not discard the challenge. Tolstoy's "strain" is a useful friction.
      *   **On Individuality:** He reminds you that if you are copying other novels, you aren't doing art. You must find the feeling in *your* flesh.
      *   **On Accessibility:** He reminds you that if your work requires a PhD in literary theory to feel the primary emotion, you may have prioritized cleverness over infection.
      *   **On Sincerity:** This is the most valuable tool. Ask yourself: *Am I writing this to impress, or to transmit?*

  **Verdict:** The tension is real. Tolstoy resolves it by fiat, asserting that moral truth simplifies expression. In reality, moral truth often complicates expression. But as a novelist, you should hold the two ends of that rope tight. Let the demand for individuality drive your depth, and let the demand for accessibility drive your clarity. Do not let one cancel the other out; let them struggle against each other. That struggle is where the heat of the work comes from.

  Tolstoy failed to fully reconcile them in his own practice, but the failure produced some of the most honest writing in history. You are in good company.
