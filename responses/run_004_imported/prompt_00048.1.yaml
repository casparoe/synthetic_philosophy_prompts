prompt: |-
  Please describe the most important implications of the units-of-selection debate—specifically the case for gene-level selection over group or individual selection—for how we should interpret apparently altruistic behaviors in eusocial insects versus in humans, given that human culture can create selection pressures that don't map neatly onto genetic relatedness.
