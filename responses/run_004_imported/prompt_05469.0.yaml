prompt: |-
  Random thought while re-reading the Monadology for my phil of mind seminar: Kim's causal exclusion argument only gets off the ground if you grant that the physical domain is causally closed -- i.e., that physical events already have sufficient physical causes, so any distinct mental cause is either redundant or gets excluded. But Leibniz denies real causal influx between finite substances across the board, not just between mind and body -- even one body hitting another is, on his view, just well-founded phenomena riding on the pre-established harmony, with all the actual causal work happening inside each windowless monad's own appetitions. So how do you think Leibniz would actually respond if you put Kim's argument to him: would he take it as basically vindicating something like his own parallelism, or would he say the whole dilemma is a non-starter because it smuggles in a picture of real physical-to-physical causation he'd already rejected on independent grounds? And are those actually two different answers, or do they collapse into the same view wearing different clothes? Genuinely dont know what i think here -- want your actual best guess, not a survey of both options.
reasoning: |-
