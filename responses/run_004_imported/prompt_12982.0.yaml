      *   **The Skeptical Solution:** Meaning isn't a private fact; it's a public practice. To mean "plus" is to be susceptible to correction by a community. It's about *normativity* (right/wrong), not just regularity.
      *   **Key Distinction:** "Is" vs. "Seems." The skeptic argues there is no fact of the matter about what I *meant*. The solution shifts to what we *say* I meant based on my participation in the form of life.

