      *   **The Problem:** An LLM minimizing loss on training data is compatible with infinitely many functions that fit that data. Why do we say it learned "addition" and not "quaddition" (where it fails on numbers larger than seen in training)?
      *   **Community:** LLMs aren't part of a human form of life. They don't care about being right or wrong, only loss.

  4.  **Synthesize: Wittgenstein meets LLM:**
