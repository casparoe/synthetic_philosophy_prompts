      *   **The Community Check:** Kripke's solution requires a community to judge correctness. An LLM has no peers. It has *users*. Therefore, the "meaning" of the LLM's output is fixed *externally* by the human community, not internally by the model.
      *   **The "Quus" Cutoff:** In ML, this is distribution shift. When the model hits inputs far from training (the "57" of Quus), it hallucinates. This proves the skeptic right: there was no "plus" in the box, just curve-fitting.
