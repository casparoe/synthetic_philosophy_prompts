answer: |-
  The voicemail arrived on a Tuesday, nestled between a bank alert and a spam solicitation for roof repair. There was no number attached, just a timestamp from three minutes ago. When I played it, the static cleared to reveal my own voice. Not a recording I recognized, not a shred of memory from a forgotten memo, but the timbre of my throat, the specific catch in my breath before I speak.

  *"I took the job,"* the voice said. *"The apartment has balconies on both sides. Morning light hits the coffee table exactly where we said it would. It's cold, but the good kind. You should see this."*

  The message ended. I sat in my kitchen in Columbus, the hum of the refrigerator the only other sound. I had turned down the Berlin job. I had stayed. I had chosen the safety of the known over the terror of the leap. And yet, here was the evidence of the leap, spoken in my lungs.

  For the first week, I listened to it like a prayer. If I closed my eyes, I could feel the phantom ache of a commute I hadn't taken, the ghost weight of a key I didn't own. It felt like recovery. Like a limb that had been amputated was suddenly signaling warmth. If that voice was me—numerically, essentially *me*, just located elsewhere—then I hadn't lost anything. I was living both lives. The grief I'd carried since signing the rejection letter was based on a error in perception. I was whole, just stretched thin across geography.

  But then the second message came. *"Met someone. Her name is Elara. She laughs like you do when you're trying not to spill wine."*

  This time, the pang wasn't warmth. It was jealousy. A sharp, green spike in the gut. If that was me, why did I feel left out? Why did I feel like a spectator watching a highlight reel of a stranger's success?

  I started thinking about my sister in Norway. For years we joked that she was living my other life. When she had her baby, I felt a weird vibration in my chest, a sympathetic contraction. But I didn't feel the exhaustion. I didn't feel the milk let down. I felt love for her, distinct from me. If Berlin-voice was like my sister—someone who looked like me, sounded like me, but was fundamentally *other*—then his joy wasn't mine. It was just a mirror held up to my lack.

  David Lewis would say they are counterparts. Distinct individuals linked by resemblance. If Lewis was right, then Berlin-Me was a stranger who happened to share my face and history up until 2016. His victory was not my victory. I was Humphrey standing in the crowd, watching a man who looked exactly like me accept the presidency. Humphrey doesn't cheer. Humphrey goes home and eats a sandwich alone. The man on the stage doesn't save him from poverty. The man on the stage doesn't love his wife.

  But if Kripke was right? If identity travels across worlds like a thread through beads? Then the man on the balcony *was* me. He was the actual substance of me, actualized differently. To deny his joy was to deny my own capacity for it. To feel jealousy was absurd, like my left hand being jealous of my right.

  I called the number back. It rang into a void.

  I began to curate the messages. I saved them to a private folder. I listened to them when the Ohio winter got too heavy, when the silence of the house pressed against my ears. *"We went to the opera,"* the voice said once. *"You hated opera. I love it. I guess we changed."*

  *We changed.* The pronoun did the heavy lifting. It assumed a unity that I couldn't feel.

  The crisis came on a Sunday. I was cleaning the gutters, a mundane, dangerous task that required all my attention. I slipped. My foot caught the ladder, and I dangled there for a second, heart hammering against my ribs, before righting myself. I climbed down, shaking, and immediately checked my phone. I needed to know if he knew. I needed to know if, in the world where I said yes to Berlin, I had also slipped on a ladder.

  There was no message.

  I waited. Nothing.

  That night, I realized the flaw in the comfort. If we were the same person, split across possibilities, then my pain should be his pain. My fear should be his fear. But he was posting happiness. He was drinking wine on a balcony. He was untouched by my gravity.

  So he wasn't me. He was a counterpart. A likeness.

  And yet, when I listened to the third message—*"I think I'm going to stay here forever"*—I cried. I cried with a relief that didn't make sense. If he was a stranger, why did his stability soothe me? If he was just a resemblance, why did his voice sound like the only truth I'd heard in years?

  I realized then that the metaphysics didn't matter. The distinction between "literally me" and "very much like me" was a legal argument, not an emotional one. The pain wasn't about ontology. It was about ownership.

  If he is me, I am responsible for his happiness, and I have failed to access it.
  If he is not me, I am condemned to watch someone else live my potential, and I have failed to become him.

  Humphrey loses either way. The winner is always out of reach.

  I kept the voicemails. I don't listen to them often anymore. Sometimes, when the light hits the coffee table in that specific way, I imagine the shadow falling on a table in Kreuzberg. I wonder if he feels the draft from my window. I wonder if he ever gets a message from me, static-filled and brief, telling him about the gutters, the cold, the safety of staying put.

  I wonder if he feels pity. Or if he feels the same jagged envy, looking at the man who stayed, wondering if safety is just another word for hiding.

  I delete the draft of the reply I never send. I put the phone down. The silence returns, heavy and singular. I am here. He is there. And the space between us is not measured in miles, but in the impossibility of knowing whether I am mourning a death or celebrating a birth.
