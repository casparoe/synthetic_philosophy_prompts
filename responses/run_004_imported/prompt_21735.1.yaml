answer: |-
  This is a really sharp observation, and you're definitely not the first person to notice the family resemblance. In fact, if you dig into the literature, you'll find that proponents of the Wrong Kind of Reasons (WKR) problem often acknowledge Kant (and later, C.I. Lewis and A.C. Ewing) as forefathers of the distinction.

  However, the reason metaethicists treat WKR as a distinctive, technical problem rather than just "Kant's Shopkeeper 2.0" comes down to **what is being analyzed** and **the stakes of the reduction**.

  Since you work in philosophy of action, the quickest way to see the distinction is to frame it in terms of **object-given vs. state-given reasons**.

  ### 1. The Target of Evaluation: Action vs. Value
  **Kant's Shopkeeper** is concerned with the **moral worth of an action**.
  *   **The Setup:** The shopkeeper charges correct change.
  *   **The Right Kind of Reason:** Duty (respect for the moral law). This confers *moral worth*.
  *   **The Wrong Kind of Reason:** Prudential self-interest (keeping customers). This explains the action, but confers zero *moral worth*.
  *   **The Point:** Kant is distinguishing between acting *in accordance with duty* and *from duty*. He is not trying to define the property "good" itself in terms of reasons. He is distinguishing motives that make an agent praiseworthy.

  **The WKR Problem** is concerned with the **analysis of value properties**.
  *   **The Setup:** Buck-Passing Accounts of Value (BPAV), like Scanlon's, claim: *To be good is just to have properties that provide reasons to favor the thing.*
  *   **The Challenge:** The Evil Demon case. An evil demon threatens to torture you unless you admire him.
  *   **The Right Kind of Reason:** The demon's admirable qualities (wit, charm). These make him *admirable*.
  *   **The Wrong Kind of Reason:** The threat of torture. This gives you a reason to *admire* him, but it doesn't make him *admirable*.
  *   **The Point:** If "good" *just means* "there are reasons to favor," then the demon is good (because there is a massive reason to favor him). But the demon isn't good. Therefore, the analysis fails.

  **The Difference:** Kant is distinguishing reasons that make an **agent** virtuous. WKR is distinguishing reasons that make an **object** valuable.

  ### 2. The Action Theory Angle: Object-Given vs. State-Given
  Since you're in action theory, you'll recognize the distinction between reasons that bear on the **content** of an attitude/action vs. reasons that bear on the **benefits of holding** that attitude/action.

  *   **Object-Given Reasons (Right Kind):** Reasons that cite features of the object of the attitude. (e.g., "He is funny" is a reason to admire him.) These bear on whether the attitude is *fitting*.
  *   **State-Given Reasons (Wrong Kind):** Reasons that cite features of the *state* of having the attitude. (e.g., "You will be rewarded if you admire him.") These bear on whether it is *beneficial* to have the attitude.

  Kant's shopkeeper case is arguably about **motives for action**, not necessarily the fittingness of an attitude. The shopkeeper's prudential reason is a reason *to act*, and it successfully justifies the action pragmatically. It just doesn't make the *will* good.

  The WKR problem is specifically about **fittingness**. It arises because Buck-Passing tries to reduce *value* (a property of the object) to *reasons for attitudes* (a relation between agent and object). The WKR shows that you can have the relation (reasons to favor) without the property (value).

  ### 3. Why It's Treated as a "New" Problem
  There are three main reasons why metaethicists treat this as a specific technical puzzle rather than historical commentary on Kant:

  **A. The Reductive Stakes**
  Kant wasn't trying to offer a reductive analysis of "good." He was trying to establish the supremacy of the moral motive. The WKR problem is existential for Buck-Passing accounts. If they can't solve WKR, their definition of value is circular or false. The pressure is much higher because it's a problem for a specific *semantic/metaphysical thesis*, not just a normative distinction.

  **B. The Scope of Normativity**
  The contemporary WKR debate exploded alongside the "Reasons First" program in metaethics (Scanlon, Parfit, etc.). The goal was to explain all normativity in terms of reasons. The WKR problem threatens to show that "reasons" are too broad a category to ground "value." It's a problem internal to the architecture of contemporary metaethics that didn't exist when Kant was writing.

  **C. The Solution Space**
  Solving WKR requires technical machinery that Kant didn't develop. Contemporary philosophers talk about:
  *   **Fittingness:** Distinguishing reasons that make an attitude *fitting* vs. reasons that make it *wise*.
  *   **Formal Objects:** Distinguishing the formal object of admiration (the admirable) from the pragmatic benefits of admiring.
  *   **Ecumenical vs. Restrictive Accounts:** Debating whether we need to restrict the *kind* of reasons in the analysis or the *kind* of attitudes.

  ### 4. Where You Are Right
  You are right to feel a sense of *déjà vu*.
  1.  **Structural Isomorphism:** Both problems rely on a dichotomy between reasons that bear on the *normative status of the object/agent* vs. reasons that bear on the *pragmatic rationality of the response*.
  2.  **Lineage:** Philosophers like Wlodek Rabinowicz and Toni Rønnow-Rasmussen explicitly trace the WKR problem back to Brentano and Ewing, who were themselves engaging with the Kantian tradition of distinguishing the "fitting" from the "good."
  3.  **Action Theory Overlap:** Many action theorists (like Schroeder and Kolodny) have weighed in on WKR precisely because it *is* a problem about the structure of reasons, which is your home turf.

  ### Summary
  You aren't missing anything deep; you're spotting a structural lineage. But the reason it's treated as a distinctive problem is that **Kant used the distinction to save moral worth from prudence, whereas metaethicists use it to save the analysis of value from circularity.**

  The Shopkeeper case shows that prudential reasons don't make an *action morally worthy*.
  The WKR case shows that pragmatic reasons don't make an *object valuable*.

  Because Buck-Passing tries to *define* value in terms of reasons, the WKR is a counterexample to a definition. Kant wasn't offering a definition of "good" in that passage, so the Shopkeeper isn't a counterexample to a definition, but rather a clarification of moral psychology. That shift from **moral psychology** to **metaethical analysis** is why the literature treats it as a new beast, even if it wears the same skin.
