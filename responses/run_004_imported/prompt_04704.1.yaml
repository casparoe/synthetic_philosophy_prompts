      *   *Critique:* The user asked to engage with the strongest case for the software.
      *   *Fix:* Ensure the memo explicitly states that relying *solely* on 10-year-old directives can also be harmful (e.g., forcing a terrified resident into a shower because a directive says "hygiene is important"). The AI helps there.

  6.  **Final Polish:** Check word count, clarity, and ensure the specific constraints (12 days, concrete course of action, timeframe) are met. (The prompt says "meet again in twelve days," so the memo date should be *before* that, obviously. I will date it for today).

  7.  **Final Review against constraints:**
      *   Concrete course of action? Yes (Restricted Use/Tiered Authority).
      *   Timeframe? Yes (6-month review).
      *   Engage strongest case for software? Yes (Current well-being vs. Past autonomy).
      *   Avoid "black-box" reflex? Yes (Focus on interpretation of behavior, not code opacity).
      *   Tone? Professional, accountant/family rep persona.

  *(Self-Correction on Tone)*: The user is an accountant. The language should be precise, structured, and risk-aware, not overly flowery. It should sound like someone who deals with compliance and liability but cares deeply about the human element.

  *(Final thought on the Dworkin/Dresser reference)*: The user mentioned them specifically. I should include the names to show I did the reading they did, but explain the concepts briefly so other committee members (who might not know them) follow along.

