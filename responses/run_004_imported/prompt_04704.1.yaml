      *   *Fix:* Emphasize that the software *interpreted* correctly based on its logic (agitation = negative reward), but the *premise* (agitation = informed preference) is flawed in this population. This validates the tech's internal logic while rejecting its application to high-stakes ethics.
      *   *Critique:* Is the distinction between low/high stakes clear?
