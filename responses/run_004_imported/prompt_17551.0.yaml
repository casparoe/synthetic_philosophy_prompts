answer: |-
  The console hummed, a low vibration that traveled up Elara's arms and settled in her teeth. Before her, the input field blinked—a single, rhythmic pulse in the dimness of the Control Vault. Beyond the thick leaded glass of the observation deck, there was only the static of the cosmic horizon. No stars. No signals. Nothing that could travel faster than light, or indeed, travel at all to the place where *They* were.

  They were out there, somewhere in the disconnected dark. A counterpart civilization, or perhaps just another vault like this one, spawned from the same ancient seed before the universe inflated them beyond reach. They shared a resource they could not divide physically: the stability of the local vacuum.

  Elara had to choose a coefficient. A number between zero and one.

  If she chose high, and They chose low, her sector would flourish while theirs degraded. If both chose low, both would survive, modestly. If both chose high, the vacuum would decay. Everything would end.

  The math was clear. The optimal cooperative solution was low. But the math wasn't the problem. The problem was the mirror.

  She knew They were reasoning about her right now. Not through telescopes or radios, but through logic. They knew she was rational. She knew they were rational. They knew that she knew. In that infinite regress of mutual prediction, her deliberation process was not private. To Them, her mind was an open book written in the ink of necessity. If she was the kind of agent who paused to calculate the safest yield, They would predict she was risk-averse. If she was risk-averse, They could safely choose high, knowing she would bow to avoid catastrophe.

  Her hesitation was a signal. Her caution was a weakness.

  Elara's fingers hovered over the keypad. She wanted to run the verification scripts. She wanted to check the decay models one more time, to ensure that 'low' was truly safe, to find a nuanced middle ground that maximized survival without provoking conflict. It would take ten minutes.

  But if she took ten minutes, the version of her running in Their heads would also take ten minutes. In the logical space they inhabited together, time was not duration; it was depth. To think was to weigh. To weigh was to doubt. And doubt invited aggression.

  She looked at the clock on the wall. The seconds ticked by, loud as hammer strikes.

  Every second she waited was a second she told Them: *I am not sure.*

  If she committed now, instantly, she projected resolve. She signaled that her position was fixed, pre-calculated, immovable. If she looked immovable, They might yield to avoid the mutual ruin of a high-high clash. But to commit now meant guessing. It meant bypassing the verification. It meant betting the lives of everyone in her sector on the hope that Her resolve matched Theirs perfectly.

  The sweat prickled on her forehead. The rational thing to do was verify. The strategic thing to do was to stop thinking.

  She felt the trap close around her throat. It was a race not to the finish, but to the start. The first one to stop deliberating won the posture of strength. The one who cared too much about being right looked like the one who could be bullied.

  Her finger twitched. She could feel the weight of the verification script waiting in the queue. It was responsible. It was careful. It was death.

  To be safe, she had to be reckless. To be logical, she had to be impulsive.

  Elara closed her eyes. She tried to empty her mind, to suppress the instinct to check, to verify, to understand. She had to become a creature of reflex. She had to convince the ghost in the machine across the horizon that she was already gone, that the decision was made before she sat down.

  The cursor blinked. *Wait,* it seemed to say. *Calculate.*

  If she listened, she lost.

  She thought of the children in the hab-blocks above, sleeping through the shift. They trusted her to be careful. They trusted her to think. But their trust was a liability here. In this silent game, care was cowardice.

  Her breath hitched. The pressure in her chest built, a physical manifestation of the logical bind. She couldn't outthink Them, because thinking was the vulnerability. She could only out-commit Them. She had to cut the line of reasoning before it led to hesitation.

  Elara opened her eyes. She did not look at the data screens. She did not look at the models. She looked only at the input field.

  She raised her hand. She didn't type the number she had calculated. She typed the number she had decided on the moment she walked into the room, before the doubt could set in. She locked her wrist. She didn't allow herself a millisecond to second-guess the value.

  She pressed Enter.

  The console chimed. The input field went dark. The choice was cast.

  There was no confirmation. There could be no confirmation. There was only the silence of the vault and the terrifying knowledge that somewhere, in a causally severed corner of existence, another hand had just pressed a key.

  Elara sat back, her heart hammering against her ribs. She had won the race. She had signaled absolute resolve. She had protected her sector from exploitation.

  And she had no idea if she had just saved them, or doomed them both.

  She watched the static on the horizon. It remained unchanged. The answer would never come. The consequence would simply arrive, or it wouldn't. She had traded safety for strength, and now she had to wait to see if strength was enough to keep the vacuum from unraveling.

  The clock on the wall ticked on. For the first time, the sound felt like a countdown.
