      *   **Part (a) [5 pts]:**
          *   *Feasible Set $S$:* Comprehensive hull of $(0,2), (1,1), (3,0)$.
          *   *Disagreement Point $d$:* $(0,0)$.
          *   *Ideal Point $a$:* Max $u_1$ in $S$ is 3 (at $(3,0)$). Max $u_2$ in $S$ is 2 (at $(0,2)$). So $a = (3,2)$.
          *   *Kalai-Smorodinsky (KS) Solution:* Intersection of the line segment from $d$ to $a$ ($u_2 = \frac{2}{3}u_1$) and the Pareto frontier.
              *   Frontier segments:
                  1.  $(0,2)$ to $(1,1)$: Slope $\frac{1-2}{1-0} = -1$. Eq: $u_2 - 2 = -1(u_1 - 0) \Rightarrow u_2 = 2 - u_1$.
                  2.  $(1,1)$ to $(3,0)$: Slope $\frac{0-1}{3-1} = -0.5$. Eq: $u_2 - 0 = -0.5(u_1 - 3) \Rightarrow u_2 = 1.5 - 0.5u_1$.
              *   Intersection check:
                  *   Segment 1: $\frac{2}{3}u_1 = 2 - u_1 \Rightarrow \frac{5}{3}u_1 = 2 \Rightarrow u_1 = 1.2$. Then $u_2 = 0.8$. Point $(1.2, 0.8)$. Is this on the segment? $0 \le 1.2 \le 1$? No. $1.2 > 1$. So it's not on the first segment.
                  *   Segment 2: $\frac{2}{3}u_1 = 1.5 - 0.5u_1 \Rightarrow (\frac{2}{3} + \frac{1}{2})u_1 = 1.5 \Rightarrow \frac{7}{6}u_1 = \frac{3}{2} \Rightarrow u_1 = \frac{3}{2} \cdot \frac{6}{7} = \frac{9}{7} \approx 1.2857$. Then $u_2 = \frac{2}{3} \cdot \frac{9}{7} = \frac{6}{7} \approx 0.857$. Is this on the segment? $1 \le 1.28 \le 3$. Yes.
              *   *Student's KS Calculation:* They got $u_1 = 9/7, u_2 = 6/7$. This is **Correct**.
          *   *Nash Solution:* Maximize $u_1 u_2$ subject to the frontier.
              *   Segment 1 ($u_2 = 2-u_1$): Max $u_1(2-u_1) = 2u_1 - u_1^2$. Derivative $2-2u_1=0 \Rightarrow u_1=1$. Point $(1,1)$. Value = 1.
              *   Segment 2 ($u_2 = 1.5 - 0.5u_1$): Max $u_1(1.5 - 0.5u_1) = 1.5u_1 - 0.5u_1^2$. Derivative $1.5 - u_1 = 0 \Rightarrow u_1 = 1.5$. Point $(1.5, 0.75)$. Value = $1.125$.
              *   Compare values: $1.125 > 1$. So Nash is $(1.5, 0.75)$.
              *   *Student's Nash Calculation:* They got $u_1=1.5, u_2=0.75$. This is **Correct**.
          *   *Comparison:* Student says KS is kinder to P2, tougher on P1 compared to Nash.
              *   KS: $(1.29, 0.86)$. Nash: $(1.5, 0.75)$.
              *   P1 gets less in KS ($1.29 < 1.5$). P2 gets more in KS ($0.86 > 0.75$).
