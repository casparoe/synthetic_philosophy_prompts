answer: |-
  **Setting:** *A seminar room, chalk dust still in the air. The centipede game tree is drawn on the board. Player 1 has just passed at Node 1. It is now Player 2's turn.*

  **Binmore:** Look at the board. Under Common Knowledge of Rationality, Player 1 takes at Node 1. He passed. Therefore, CKR is false. You cannot apply backward induction here.

  **Aumann:** CKR isn't an empirical hypothesis to be falsified by a move. It's a constraint on reasoning. We are asking what rationality *requires*, not predicting what humans do. Even at Node 2, you must assume future play adheres to rational constraints.

  **Binmore:** But "future play" depends on Player 1! Backward induction requires Player 1 to be rational at Node 3. But Node 2 is only reached because Player 1 *wasn't* rational at Node 1. Why should I assume he magically becomes rational at Node 3?

  **Aumann:** Because if you don't, you have no theory left. If you abandon backward induction whenever play deviates, game theory loses all predictive power. You reduce it to psychology. What does an "irrational" player do? Anything. Without the BI chain, you have no benchmark for optimal play.

  **Binmore:** A benchmark that contradicts the data is useless. You're making rationality unfalsifiable. No matter what Player 1 does, you insist he "should" have taken. That's dogma, not logic. If I observe behavior inconsistent with CKR, I should update my beliefs about Player 1's type, not cling to a counterfactual.

  **Aumann:** Updating beliefs is fine, but you cannot update them in a way that violates logical consistency. To decide at Node 2, you must evaluate Player 1's future choices. If you assume he is irrational, you cannot model his choice. You must assume rationality to model the game, even if the path to get here was anomalous.

  **Binmore:** That's the trick! You're forcing me to assume rationality to solve a problem created by irrationality. It's self-undermining. You're driving a car after the engine fell out because the map says the engine should be there.

  **Aumann:** I'm driving by the logic of the map. The map says this road ends. Just because we're still on it doesn't mean the map is wrong; it means we shouldn't be here. But since we *are*, logic dictates you exit immediately. If you pass, you're betting on Player 1's irrationality continuing. That's not strategy; that's gambling.

  **Binmore:** And if you take, you're betting on a logical consistency that the game history just disproved. If rationality means ignoring evidence of irrationality, it's not rationality. It's superstition.

  **Aumann:** And if rationality means abandoning logic at the first sign of trouble, it's not theory. It's improvisation.

  **Binmore:** Then your theory has nothing to say about real play.

  **Aumann:** My theory says what play *ought* to be. Yours says nothing at all.

  **Binmore:** Better silence than nonsense.

  **Aumann:** Then we have nothing more to discuss.

  **Binmore:** Agreed. But I'm still passing.
