          *   *Address "Alienation":* Briefly note why this is distinct (internal state vs. external transaction) to keep the committee focused.
      *   **Recommendation:** Renew with Conditions. Why? Immediate cancellation harms the very workers we aim to protect (loss of income). Conditions allow for remediation.
      *   **Conditions:** Living wage (above minimum), pathway to ownership/unionization, transparency on profit margins.
      *   **Timeline:** Phased approach (Immediate review, negotiation period, implementation).
