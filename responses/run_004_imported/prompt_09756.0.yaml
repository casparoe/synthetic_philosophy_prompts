answer: |-
  **MEMORANDUM**

  **TO:** University Committee on Outside Labor Contracts
  **FROM:** [Your Name], Department of Philosophy
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Dining Services Contract Renewal (Contract #DS-2024)

  ### I. Executive Summary

  This memo addresses the petition from the Student Labor Alliance to cancel the University's contract with Apex Dining Services, alongside the Provost's rebuttal defending the current arrangement. The core dispute is not merely economic but normative: does the current contract constitute *exploitation* in a philosophically robust sense, despite being legally compliant and voluntarily entered?

  After reviewing the submissions and relevant ethical frameworks, I recommend that the Committee **vote to Renew with Conditions**. Immediate cancellation risks harming the very workers we intend to protect by precipitating sudden unemployment. However, renewing without modification validates a definition of "voluntary exchange" that ignores structural coercion. I propose a set of contractual conditions designed to mitigate the power asymmetry that grounds the exploitation claim, with a six-month compliance timeline.

  ### II. Philosophical Analysis of the Dispute

  The Committee is currently stalled because we are talking past one another regarding the definition of *exploitation*. The Contractor's defense relies on a neoclassical liberal conception of exchange, while the Student Group relies on a Marxist conception. To move forward, we must engage the specific philosophical counter-arguments regarding consent and benefit.

  **A. The "Voluntary" Defense and Structural Coercion**
  The Provost's office argues that because workers sign contracts voluntarily and are free to quit, exploitation is impossible. This relies on a transactional view of freedom. However, as John Roemer argues in *A General Theory of Exploitation and Class*, exploitation is not primarily about the moment of exchange, but about the distribution of productive assets *prior* to the exchange.

  If a worker's "choice set" is restricted to "sell labor at market rate" or "face destitution" due to unequal ownership of capital, the exchange is formally voluntary but structurally coerced. Roemer demonstrates that surplus value extraction correlates with this asset inequality. Therefore, the fact that a worker *chose* this job does not prove the absence of exploitation; it merely proves the absence of a better alternative within the current property relations. To dismiss the student claim solely on the basis of signature consent is to ignore the background conditions that make that consent necessary.

  **B. The "Mutually Beneficial" Defense**
  The Contractor argues that workers are "better off" than their next-best option, implying mutual benefit precludes exploitation. This is a common intuition, but it does not hold up under analytical scrutiny.

  Alan Wertheimer, in *Exploitation*, establishes that a transaction can be mutually beneficial (Pareto superior) and still be exploitative. The moral wrong of exploitation is not necessarily that the worker is harmed compared to their baseline (they are not), but that the *terms* of the benefit are unfair relative to the value contributed. If Apex captures 90% of the surplus value generated by the dining staff while staff remain at subsistence levels, the transaction is mutually beneficial but exploitative.

  Furthermore, Ruth Sample's account of exploitation focuses on the *taking advantage of vulnerability*. Even if the wage clears the legal minimum, if that minimum is below a living wage in this locality, the contractor is leveraging the workers' vulnerability (their need for immediate income) to secure a margin that would be unavailable if the workers had genuine bargaining power. Mutual benefit is a necessary condition for a sustainable contract, but it is not a *sufficient* condition for ethical permissibility.

  **C. The Question of Alienation**
  One Committee member has suggested we pivot our review toward *alienation*. While vital, alienation describes a psychological and existential state (separation from the product of one's labor, from oneself, and from others). Exploitation describes a distributive and transactional relationship. A worker can be well-paid and unalienated (e.g., a highly paid specialist performing repetitive tasks they enjoy) yet still be exploited in the Marxist sense if surplus value is extracted via asset inequality. Conversely, a worker can be alienated but not exploited (e.g., a subsistence farmer). Conflating these categories will muddy our mandate. Our specific charge is the *contract*, which governs the exchange, not the phenomenological experience of the labor. We should table alienation for a separate task force on student/worker well-being.

  ### III. Recommendation: Renew with Conditions

  I advise against **Cancellation**. Abruptly terminating the contract would likely result in immediate job loss for the dining staff. Unless the University is prepared to immediately hire and onboard these workers as direct employees (which poses its own liability and budgetary hurdles), cancellation punishes the workers for the Contractor's ethical failings.

  I advise against **Unconditional Renewal**. This accepts the Contractor's definition of exploitation as merely "illegal underpayment," which is philosophically indefensible given the arguments above.

  **Recommendation:** **Renew the contract subject to the following binding conditions:**

  1.  **Living Wage Clause:** The contract must mandate an hourly wage floor tied to the local living wage index (currently $X/hr), not the federal or state minimum. This addresses the "vulnerability" aspect of Sample's definition.
  2.  **Profit Transparency:** Apex must disclose the ratio of labor costs to net profit on this account. This allows the Committee to monitor surplus value extraction rates.
  3.  **Neutrality Agreement:** Apex must agree to a stance of neutrality regarding any unionization efforts by the dining staff. This begins to address the Roemerian asset/power asymmetry by allowing workers to build collective bargaining power.

  ### IV. Proposed Timeline

  *   **November 15:** Committee vote on Recommendation.
  *   **December 1:** Administration presents conditions to Apex Dining Services.
  *   **January 15:** Deadline for Apex to accept conditions or submit a counter-proposal that meets the Living Wage threshold.
  *   **February 1:** If no agreement is reached, the University initiates a Request for Proposals (RFP) for a new vendor, guaranteeing preference to bidders who meet the above conditions and honor existing seniority.
  *   **July 1 (Next Fiscal Year):** Full implementation of new wage standards.

  ### V. Conclusion

  We are not tasked with solving global capitalism, but we are tasked with ensuring the University's financial partnerships do not violate our stated ethical mission. The Contractor's defense relies on a thin conception of consent that ignores structural coercion. By renewing with conditions, we acknowledge that while the current arrangement is mutually beneficial, it is not yet fair. This path protects current workers from immediate harm while leveraging the University's purchasing power to reduce the exploitative nature of the exchange.

  I look forward to discussing this framework on Thursday.
