          1.  Language/Improvisation Test: A real mind can respond appropriately to *anything* said to it, not just fixed responses.
          2.  Versatility/General Reason Test: Reason is a universal instrument, whereas machines need specific mechanisms for specific tasks.
      *   **The Twist:** Large Language Models (LLMs) seem to pass the first test (language/improvisation) better than most animals.
      *   **The Questions:**
          1.  What would Descartes say if he interacted with an LLM? (Soul vs. Machine?)
