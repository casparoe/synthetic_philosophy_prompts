      *   *Application to Zombies:* When we imagine a zombie, are we imagining a being that *looks* like us but lacks consciousness (illusion), or a being that is *physically identical* but lacks consciousness (genuine possibility)? Physicalists argue it's the former: we don't know the physical essence of consciousness yet, so we think we can separate them, but we can't.

  3.  **Explain Chalmers' Two-Dimensional Semantics (2DS) Intuitively:**
      *   *Goal:* Distinguish between "Water/H2O" and "Consciousness/Physical State."
      *   *Dimension 1 (Primary Intension):* How we pick out a concept based on how the world turns out to be. (Descriptive role). "The clear, drinkable liquid in the oceans."
      *   *Dimension 2 (Secondary Intension):* What the concept refers to *given* how our actual world is. (Rigid designation). "H2O."
