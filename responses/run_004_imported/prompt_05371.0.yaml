answer: |-
  Here are 10 interview questions designed to move past the textbook definitions of Universalism and press on the philosophical costs of the view. They include the specific thematic requirements you asked for, along with anticipated follow-ups to keep her from retreating to standard defenses.

  ### 1. The Vagueness Trade-Off
  **Question:** "A major motivation for Unrestricted Composition is avoiding vagueness in existence. The argument goes: if composition is restricted, there must be a vague boundary where objects *start* to compose something, which seems metaphysically impossible. But by accepting *everything* composes something, aren't you just pushing the vagueness elsewhere? You avoid vague *existence*, but now you have vague *identity* or vague *naturalness*. Why is avoiding vagueness in existence specifically worth the cost of accepting infinitely many gerrymandered objects?"

  *   **Follow-up:** "If you say vagueness is merely linguistic and not metaphysical, does that mean the world itself is perfectly precise, and our intuition that a 'trout-turkey' is weird is just a failure of our vocabulary?"

  ### 2. Ontological Innocence & Counting
  **Question:** "You've defended the Lewisian line that composition is 'ontologically innocent'—that asserting the existence of a whole doesn't add to the 'weight' of reality beyond the parts. But this creates a counting problem. If I have a trout and a turkey, Universalism says I also have a trout-turkey. If I ask 'how many objects are in this room?', is the answer 2 or 3? If you say the answer depends on the conceptual scheme, doesn't that undermine the idea that ontology is about what *actually* exists?"

  *   **Follow-up:** "If the whole is 'nothing over and above' the parts, why do we need the category of 'object' for the whole at all? Why not just be a nihilist and say only the simples exist?"

  ### 3. Quantification vs. Ordinary Language
  **Question:** "If Unrestricted Composition is true, then our best logical quantifier ('there exists an x') ranges over trout-turkeys, scattered chairs, and random dust bunnies equally. But ordinary language never seems to need to quantify over these fusions. We never say, 'Hand me that trout-turkey.' If these objects are just as real as my laptop, why is human language and cognition systematically blind to them? Is existence supposed to be independent of utility?"

  *   **Follow-up:** "If existence is independent of utility, does that mean ontology is completely disconnected from scientific practice? Because science certainly doesn't posit trout-turkeys in its equations."

  ### 4. The "Ikea" Case (Temporal Composition)
  **Question:** "Let's make this concrete. I have a pile of disassembled Ikea shelf parts in my hallway. Universalism says those parts *already* compose an object—a scattered 'shelf'—even before I screw them together. But if that object exists now, what changes when I assemble it? Does the old scattered object cease to exist and a new connected one begin? Or are they the same object? If they're the same, what work is the word 'assembly' actually doing?"

  *   **Follow-up:** "If you say the scattered shelf and the assembled shelf are distinct objects that happen to share parts, aren't we now committed to a massive proliferation of coinciding objects in the same space?"

  ### 5. Causal Exclusion
  **Question:** "Real objects seem to have causal powers. My laptop can run a podcast. Its parts can also run a podcast. But what causal work does the 'trout-turkey' do that isn't already done by the trout and the turkey? If the whole has no distinct causal powers from its parts, is it causally inert? And if it is causally inert, in what sense is it 'real'?"

  *   **Follow-up:** "If you argue it has no *new* powers, does that make composition epiphenomenal? And if so, why should we care about ontology if it tracks things that make no difference to how the world behaves?"

  ### 6. Mereological Essentialism
  **Question:** "Unrestricted Composition is often paired with Mereological Essentialism—the idea that an object cannot lose or gain parts without ceasing to exist. If I chip a piece off the trout-turkey, strictly speaking, does that object go out of existence? If so, doesn't that make persistence through time impossible for almost everything? How do you reconcile that with our experience of objects enduring through change?"

  *   **Follow-up:** "If you adopt a perdurantist view (objects are space-time worms) to solve this, aren't you just changing the subject from 'objects' to 'space-time regions'?"

  ### 7. Naturalness and Structure
  **Question:** "David Lewis talked about 'natural properties'—properties that carve nature at its joints. A chair seems natural; a trout-turkey does not. If Universalism is true, does ontology stop caring about naturalness? If we treat arbitrary fusions as ontologically equal to biological organisms, aren't we saying that structure and organization are irrelevant to what exists?"

  *   **Follow-up:** "If structure is irrelevant to existence, why does structure matter so much for everything else we care about, like physics, biology, and ethics?"

  ### 8. The "Middle Ground" Objection
  **Question:** "Peter van Inwagen argued for a restricted view: only living organisms compose wholes. This avoids the trout-turkey while still allowing for complex beings. You reject this because 'life' is vague. But isn't it better to have a slightly vague boundary for existence than to accept a precise boundary that includes absurdities? Why is precision the highest virtue in metaphysics?"

  *   **Follow-up:** "If you say vagueness is impossible in reality, is that an empirical claim or just a commitment to classical logic? And why should reality be bound by bivalent logic?"

  ### 9. The "So What?" Question
  **Question:** "Suppose you convince us all tonight. Unrestricted Composition is true. Trout-turkeys exist. What changes? Does physics change? Does ethics change? Or is this a debate that is entirely self-contained within metaphysics? If the view has no downstream consequences, how do we decide between Universalism and Restrictivism other than by aesthetic preference?"

  *   **Follow-up:** "If it's just aesthetic—preferring a tidy logic over common sense—should we be teaching this as a theory of *reality*, or as a theory of *language*?"

  ### 10. The Evidence Question (The Closer)
  **Question:** "Your case for Unrestricted Composition seems to rest almost entirely on a priori arguments—logic, vagueness, and ontological innocence. There doesn't seem to be any empirical observation that could prove it true. So I want to ask the reverse: What would count as evidence *against* it? Is there any conceivable state of the world, or any conceptual discovery, that would force you to abandon Universalism? Or is the view unfalsifiable by design?"

  *   **Follow-up:** "If there is no evidence that could count against it, does that make it a metaphysical truth, or just a definitional stipulation about how you choose to use the word 'exists'?"
