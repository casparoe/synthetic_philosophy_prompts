      *   Make sure the "dinner party answer" is clear and punchy.

  8.  **Final Review against constraints:**
      *   Did I answer if it dodges or relocates? Yes (mostly dodges, relocates to signup).
      *   Did I address the nature of intention? Yes (Bratman/Gauthier).
      *   Is it useful for the book? Yes.

  *(Self-Correction Note)*: Wait, I need to be precise about the Toxin Puzzle. The puzzle is that intention seems to require a belief that you will act. If you know you won't act (because it's irrational tomorrow), you can't believe you will act, so you can't intend. The app makes it rational to act tomorrow, so you *can* believe you will act, so you *can* intend. That's the key. The app fixes the rationality gap.

