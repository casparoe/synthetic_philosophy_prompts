answer: |-
  Your friend is applying a very narrow, short-term economic logic to a situation that relies on broad social and moral infrastructure. While his argument makes sense within the strict confines of a "one-shot game" in game theory, it fails to account for how trust, reputation, and personal integrity function in the real world.

  You were not irrational for paying. In fact, your reasoning is more robust than your friend's. Here is a breakdown of why your friend's argument is flawed and why your decision was the rational (and ethical) one.

  ### 1. Ex-Ante vs. Ex-Post Rationality
  Your friend is looking at the situation **ex-post** (after the fact). From this viewpoint, the service is rendered, the leverage is gone, and paying seems like a voluntary loss.

  However, rational decisions are made **ex-ante** (before the fact). The agreement was struck *before* the tow began. The driver explicitly stated: "I will only pull you out *if* you give me your word."
  *   **The Price:** Your promise was the currency required to purchase the rescue.
  *   **The Transaction:** By accepting the tow, you accepted the terms.

  If you adopt your friend's logic (that you don't have to pay once the service is done), you are essentially arguing that it is rational to lie during the negotiation phase to secure a benefit. If everyone adopted that logic, no one would ever be rescued in that situation again because drivers would stop believing promises. By paying, you validated the system that saved you.

  ### 2. The "One-Shot Game" Fallacy
  Your friend argues that because you will never see the driver again, there are no consequences for breaking your word. In game theory, this is a "one-shot prisoner's dilemma," where defection (not paying) yields the highest immediate individual payoff.

  However, humans do not live in isolated one-shot games. We live in an **iterated society**.
  *   **Internal Reputation:** You have to live with yourself. Breaking a promise when you think you can get away with it erodes your own self-concept as an honest person. Maintaining your integrity has long-term psychological value that outweighs $300.
  *   **Generalized Trust:** The driver mentioned he had been left empty-handed before. He is part of a community of responders. If he concludes that "people's words are worthless," he may refuse to help the next person, who might actually be in dire need. By paying, you helped repair a small piece of the social fabric that protects everyone, including you, in the future.

  ### 3. Debt vs. Tip
  Your friend seems to view the $300 as a **tip** or a reward for a job well done. If it were a tip, his logic would hold: the job is done, so the tip is optional.

  However, this was a **debt**. The driver did not do you a favor; he entered into a verbal contract. He traded his labor and fuel for your promise. Once you reached town, the debt was due. Keeping the money wouldn't be "saving a loss"; it would be theft of services. Paying a debt you incurred is never irrational, even if the creditor has no legal recourse to collect.

  ### 4. The Categorical Imperative
  Immanuel Kant proposed a test for moral actions: *Act only according to that maxim whereby you can, at the same time, will that it should become a universal law.*

  Ask yourself: What would happen if *everyone* did what your friend suggested?
  *   **Universal Law:** "Whenever you receive help based on a promise of future payment, and there is no legal enforcement, you should keep the money."
  *   **Result:** No one would ever offer help based on a promise again. People would be left stranded in snowstorms.

  Since you would not want to live in a world where no one stops to help because they fear non-payment, you cannot rationally choose to act in a way that contributes to that world.

  ### Conclusion
  Your friend is viewing rationality as **maximizing immediate financial gain**.
  You are viewing rationality as **maintaining a functional society and a coherent self.**

  If you had kept the money, you would have $300 more, but you would have reinforced the cynicism of the tow driver and weakened your own commitment to honesty. You paid the $300 to close the loop on a contract you entered willingly. That isn't a loss; it's the cost of being a person who keeps their word.

  You did the right thing. Your friend's logic is technically sound only in a vacuum devoid of ethics, society, or future consequences. In the real world, you won the argument.
