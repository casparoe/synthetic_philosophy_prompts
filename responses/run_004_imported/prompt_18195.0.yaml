  3.  **Identify the Flaws in Dana's Reasoning:**
      *   *Epistemic Uncertainty:* Probabilities like "1 in 500,000" for unique, unprecedented events are not actuarial data; they are guesses. They are noise, not signal.
      *   *Pascal's Mugging:* If you accept $P \times V$ blindly, any claim with a sufficiently large $V$ justifies the cost, no matter how small $P$ is. This leads to absurdity.
      *   *Risk Neutrality vs. Risk Aversion:* Small charities (and humans) are not risk-neutral entities like a diversified investment portfolio. Losing $50k on a failure means *zero* good done.
      *   *Opportunity Cost & Portfolio Theory:* A single trust shouldn't act like it's the only money in the world. Diversification across causes is better.
