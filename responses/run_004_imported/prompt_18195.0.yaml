          2.  Disaster-monitoring project (1 in 500,000 chance/year of preventing catastrophe, massive impact if successful).
      *   **Dana's Argument:** Expected Value (EV) calculation favors the long shot because Probability $\times$ Impact > Certain Impact. She claims the board is *obligated* to fund the long shot.
      *   **User's Intuition:** Something feels wrong with "tiny probability $\times$ huge number = winner." Worried about Pascal's Mugging. Wants a definitive answer, not "both sides have a point."
      *   **Goal:** Provide a principled analysis of why Dana's reasoning is flawed (or at least incomplete) without being wishy-washy. Validate the user's intuition while explaining the math/philosophy behind it.

  2.  **Deconstruct the Core Conflict:**
      *   **Dana's Framework:** Classical Expected Utility Theory (EUT). Maximize $P \times V$.
      *   **User's Framework:** Intuitive moral reasoning, risk aversion, epistemic uncertainty, diminishing marginal utility, institutional constraints.
