      *Timeline:* 12 days to meeting. Policy starts next quarter. Pilot for one year.

  7.  **Final Polish:** Check word count (not specified, but keep it memo-length, ~800-1000 words). Ensure the voice is professional but passionate. Make sure the bias argument is nuanced.

      *(Key Insight on Bias)*: The argument "a number can't play favorites" is true, but "a number can't recognize genius either." It favors the median. I need to articulate that.

  8.  **Final Review against constraints:**
