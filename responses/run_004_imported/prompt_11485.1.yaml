    "ranking": ["Appius", "Sophocles", "Archytas", "StageExit", "RipeFruit"],
    "justification": {
      "Appius": "...",
      "Sophocles": "...",
      "Archytas": "...",
      "StageExit": "...",
      "RipeFruit": "..."
    }
  }
  ```
