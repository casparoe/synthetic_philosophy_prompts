prompt: |-
  I'm taking a seminar on Roman philosophy this term, and we've just spent two weeks on Cicero's *De Senectute*. What strikes me is that Cato doesn't just assert that the standard complaints against old age are overblown — for each one he supplies a specific exemplum or analogy to do the actual argumentative work. I'd like your assessment of five of these moves:

  - "Appius": the exemplum of the blind, elderly Appius Claudius Caecus, brought before the Senate to speak against making peace with Pyrrhus.
  - "Sophocles": the anecdote of Sophocles rebutting his sons' charge of senile incompetence by reciting to the judges the tragedy he had just composed.
  - "Archytas": the quotation attributed to Archytas of Tarentum, condemning bodily pleasure as nature's most ruinous gift to mortals.
  - "StageExit": the analogy comparing a well-lived life to a play that need not run to its final act to count as a success.
  - "RipeFruit": the analogy between death in old age and the natural ripening and falling of fruit.

  Rank these five from strongest to weakest in genuine argumentative force against the complaint each is meant to answer, rather than in mere rhetorical vividness — an exemplum that only illustrates a possibility shouldn't outrank one that actually gives reason to revise the complaint. Please justify each placement in a sentence or two, and give your final answer as a JSON object of the form:

  ```json
