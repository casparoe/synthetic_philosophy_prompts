  I'm writing a novel with a logician character who's pretty transparently modeled on Godel, and there's a scene where he writes to a dying relative trying to talk her out of being afraid of death—not with religious comfort, with an actual argument, the way he apparently did for real in a letter to his own mother sometime in the early 60s. All I know is the one-line version that gets repeated everywhere: "if the world is rational there has to be an afterlife, because otherwise it'd be absurd for a mind to spend a lifetime developing just to be switched off right when it's finally getting good." I don't want my character reciting that like a fortune cookie. Could you actually lay out the structure of the argument for me—what "rational" is doing as a premise, how you get from "the world is rational" all the way to you personally surviving your own death (rather than, i dunno, just an indifferent universe that doesn't owe minds anything), and whether/how this connects to his seperate, much more famous logical proof of God's existence, since I get the sense people online just mash the two together. Give me the real inferential skeleton, not the soundbite.
reasoning: |-
