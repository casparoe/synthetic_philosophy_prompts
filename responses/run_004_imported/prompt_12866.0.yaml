answer: |-
  The air in the studio smelled of wet earth and turpentine. On the turntable sat a clay figure, a torso twisted in mid-reach, still glistening. The sculptor stood nearby, wiping his hands on a rag, waiting for the philosophers to finish their circuit.

  **Elias:** "It's the cleanest case I've ever seen. Look at it. There are two objects occupying this exact space."

  **Mara:** "There is one object, Elias. A lump of clay. You're seeing ghosts."

  **Elias:** "Not ghosts. Logic. Apply Leibniz's Law. The Indiscernibility of Identicals. If *A* is identical to *B*, they must share every property. But look at the modal properties. The lump of clay could survive being squashed into a ball. The statue cannot. Therefore, they have different properties. Therefore, they are not identical."

  **Mara:** "I grant you the counterfactuals. If that hammer comes down," she gestured to the sculptor, "the statue is gone, and the clay remains. But that doesn't prove there are *two* things now. It proves that one thing can be described in two ways."

  **Elias:** "Descriptions don't have persistence conditions, Mara. Objects do. If I point to the clay and say, 'This will survive,' I speak truth. If I point to the statue and say, 'This will survive,' I speak falsehood. If they were the same object, I would be contradicting myself by pointing to the same thing twice. I'm not. I'm pointing to two coinciding entities."

  **Mara:** "You're multiplying entities beyond necessity. Ockham's Razor should shave that second object off. But let's go deeper. Let's talk about the Grounding Problem. This is where your two-object view crumbles."

  **Elias:** "I'm listening."

  **Mara:** "Right now, in this present moment, your 'Statue' and your 'Lump' are physical duplicates. Same atoms, same arrangement, same mass, same location. If they are distinct objects, there must be some fact about reality that makes it true that one is fragile and the other is robust. What is that fact? Where is it located?"

  **Elias:** "It's not located in the atoms. It's located in the sortal concept. The object falls under the kind 'Statue' and the kind 'Lump.' Those kinds have different essential properties."

  **Mara:** "But the object itself doesn't know what kind it is. The clay doesn't wear a label. If the physical world is complete—if every physical fact is fixed—what *extra* fact adds the 'statue-ness' that makes it vulnerable? It looks like magic. You're saying there's a hidden, non-physical property glued to these atoms that vanishes the moment the shape changes. That's spooky."

  **Elias:** "It's not spooky, it's metaphysical. History matters. This clay has a history of being shaped by an artist with an intention. That history confers the property of 'being a statue.' The lump doesn't require that history. So they differ in historical properties, even if they share spatial ones."

  **Mara:** "Okay, I'll take that. History matters. But here is my move, Elias. You think the modal difference proves two objects. I say it proves that modal properties aren't intrinsic to the object at all. They are relative to the *phase* the object is in."

  **Elias:** "A phase? You mean like a temporary stage?"

  **Mara:** "Exactly. There is only one object: the clay. Right now, the clay is in its 'statue-phase.' It is arranged statue-wise. When the sculptor squashes it, the clay enters its 'lump-phase.' You say, 'The statue is destroyed.' I agree. But I deny that 'The Statue' refers to a distinct ontological entity that ceases to exist. It refers to the clay *while it possesses a certain form*."

  **Elias:** "But that plays fast and loose with identity. If the clay is the statue, and the clay survives, then the statue survives. You're forced to say the statue becomes a ball of mud. But that's absurd. A statue cannot be a ball of mud."

  **Mara:** "Why is it absurd? Because you're treating 'Statue' as a rigid designator for an object. I'm treating it as a functional description. Think of it like this: 'The President' is in the Oval Office. Four years later, 'The President' is in a library in Texas. Did 'The President' move? No. The person did. The role ended. Similarly, the clay is the substance. 'Statue' is the role. When the form is lost, the role ends. The object persists, the description fails."

  **Elias:** "But we feel the loss. If I smash it, I haven't just changed a description. I've ruined a work of art. I've destroyed something valuable that existed a moment ago. If it's just the clay changing phases, why do we mourn the statue and not the lump?"

  **Mara:** "We mourn the *arrangement*, not the *substrate*. And here is how I explain away your modal argument without denying the destruction. You say:
  1. The Lump survives.
  2. The Statue does not.
  3. Therefore, Lump ≠ Statue.

  I say the inference is valid, but the terms are misleading. 'The Statue' does not refer to an object *x* distinct from object *y*. It refers to object *x* under a condition *C*.
  So, really:
  1. The Clay survives.
  2. The Clay-under-condition-C does not survive.
  3. Therefore, The Clay ≠ The Clay-under-condition-C.

  Of course they aren't identical! One is an object, the other is an object-plus-a-property. You're reifying the property into a second object. You're turning 'fragility' into a ghost."

  **Elias:** "That's clever. But does it handle the counting problem? If I weigh the statue, I get five pounds. If I weigh the lump, I get five pounds. If I weigh both together, do I get ten?"

  **Mara:** "No. Because there is only one thing to weigh. You can count it as a statue, or count it as a lump, but you can't count it twice. That's the cost of my view: you have to accept that identity is not absolute, but relative to a sortal. This is the same clay *as* the lump, but not the same *statue* as the lump."

  **Elias:** "Relative identity. I always suspected you'd retreat there. It saves your ontology, but it costs you logic. 'A is the same as B' becomes incomplete without asking 'The same what?'"

  **Mara:** "Is that a cost? Or is it honesty? Look at the clay, Elias. Does it look like two things to you? Or does it look like one thing that we have two very strong, very useful ways of talking about?"

  The sculptor cleared his throat. He picked up a wire tool. "I'm going to collapse it now. Need the clay for the next head."

  **Elias:** "Watch closely. One object will cease to be. The other will remain."

  **Mara:** "Watch closely. One object will change its form, and our ability to call it a 'statue' will expire."

  The sculptor brought his hands down. The wet sound of compression filled the room. The torso flattened. The reach was gone. The clay remained, a greyish mound on the wheel.

  **Elias:** "There. The statue is gone. The lump is here. Two different fates."

  **Mara:** "The clay is here. The art is gone. And the art wasn't an object, Elias. It was a moment of alignment between matter and mind."

  **Elias:** "You explain the physics, Mara. But you don't explain the tragedy."

  **Mara:** "Philosophy explains the world. Poetry explains the loss. I'm happy to leave you the tragedy, provided I keep the ontology."

  Elias looked at the shapeless mound. He sighed, brushing a speck of dried clay from his lapel.

  **Elias:** "Fine. One object. But admit this: if he decides to sculpt a new head on that lump tomorrow, the 'Statue' might return. But it won't be *this* statue."

  **Mara:** "Agreed. Because the history is broken. The phase is reset. But the clay? The clay remembers nothing. It's the only honest thing in the room."

  **Elias:** "Perhaps. But until you can tell me what *grounds* the difference in that history without referencing human intention, I'm keeping my two objects."

  **Mara:** "And I'll keep my one world. Come on. Let's get a drink. Before we get squashed."
