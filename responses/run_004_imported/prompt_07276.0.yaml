answer: |-
  This is a classic philosophical standoff, essentially a real-time debate between **Consequentialism** (Dana: outcomes matter most) and **Virtue Ethics/Deontology** (Colin: character and motive matter most). It's stuck in your head because both sides are tapping into deep, conflicting intuitions we all hold.

  Here is a move-by-move breakdown of who holds the stronger position at each step, followed by the missing piece of the puzzle.

  ### Move-by-Move Analysis

  **Move 1: Dana (Outcome Focus)**
  *   **Argument:** The result (a life saved) makes the act admirable; dissecting motives is cold and irrelevant.
  *   **Verdict:** **Dana wins this round.**
  *   **Why:** In a vacuum, human welfare is the baseline for morality. If we prioritize motive over outcome too early, we risk valuing "clean hands" over living people. Dana's argument appeals to the most fundamental moral instinct: suffering is bad, preventing it is good. Colin hasn't yet explained *why* the motive negates the good, he just asserted it.

  **Move 2: Colin (Character Focus)**
  *   **Argument:** A good result doesn't make the *person* good. Analogy: Saving a kid only for a news camera isn't bravery.
  *   **Verdict:** **Colin wins this round.**
  *   **Why:** Colin successfully shifts the debate from "Was the *act* good?" to "Is the *person* admirable?" This is a crucial distinction. Dana is arguing the act is useful; Colin is arguing the label "admirable" applies to character, not utility. His pool analogy is intuitive: we instinctively feel less respect for a performative rescuer, even if the kid is dry. He forces Dana to defend the definition of "admirable," not just "beneficial."

  **Move 3: Dana (Mixed Motives)**
  *   **Argument:** Motives are never 100% clean. If self-interest ruins it, nothing is ever admirable.
  *   **Verdict:** **Dana wins this round.**
  *   **Why:** This is the "Purity Trap" objection. Dana points out a psychological reality: humans are complex. We feel good when we do good. We want social approval. If feeling good about yourself disqualifies the act, then moral sainthood is impossible. Colin's standard risks becoming so rigid it applies to no one, which makes it a useless metric for real-world behavior.

  **Move 4: Colin (The Counterfactual Test)**
  *   **Argument:** It's not about mixed motives, it's about *primary* motives. The test: Would he do it if *no one ever knew*?
  *   **Verdict:** **Colin wins this round.**
  *   **Why:** Colin refines his argument to avoid Dana's "Purity Trap." He isn't asking for zero self-interest; he's asking for *sufficient* altruism. This is a logically robust test (often called the "secrecy test" in ethics). It isolates the variable. If the social reward is the engine and the helping is the cargo, the engine is selfish. This clarifies that the problem isn't *having* a motive for a story, but *needing* it to act.

  **Move 5: Dana (The Universality Objection)**
  *   **Argument:** That test is unfair. Run it on almost anything nice, and most people fail. Either the bar is wrong, or nothing clears it.
  *   **Verdict:** **Dana wins this round (on practicality).**
  *   **Why:** Dana exposes the elitism of Colin's standard. If 95% of "good deeds" are done with some expectation of social reciprocity or reputation, then Colin's definition of "admirable" describes a mythical creature, not a human. A moral framework that condemns almost everyone as "not admirable" loses its power to guide behavior. Dana wins here because she defends the utility of praise: we *want* to encourage imperfect people to do good things.

  ***

  ### The Missing Perspective

  Both Dana and Colin are stuck in a binary: **Either the act saves a life (Dana) OR the soul is pure (Colin).** They are treating "admirable" as a static stamp you either get or you don't.

  Here is what they are both missing, which might help unstuck this from your head:

  **1. Moral Alchemy (Virtue via Action)**
  Colin assumes the motive must exist *before* the act to count. But Aristotelian virtue ethics suggests that **we become good by doing good acts, even for imperfect reasons.**
  If the cousin did it for a story, but went through the pain of surgery and recovery, he has now *embodied* sacrifice. Even if he started selfishly, the act itself changes him. He is now "a kidney donor." That identity might make him more likely to act selflessly next time. The act isn't just an output of character; it's an input *into* character. Dana misses that the act changes the doer; Colin misses that the doer can grow into the motive.

  **2. The Social Function of Praise**
  Dana argues we should praise him because the result is good. Colin argues we shouldn't because the motive is impure. They are missing the **systemic incentive.**
  Society *needs* people who want "a story." Pure, anonymous altruism is rare and hard to scale. But if we create a culture where donors get status, stories, and admiration, *more people will donate.*
  If we side with Colin and say, "You're not admirable because you wanted credit," we discourage the very people capable of saving lives. If we side with Dana and say, "Motives don't matter," we risk encouraging reckless heroism.
  The missing take is: **He is admirable *instrumentally*, if not *intrinsically*.** We should praise him *specifically* to reinforce the behavior, acknowledging that the desire for status is a valid fuel for public goods.

  **3. "Admirable" vs. "Saintly"**
  They are using the word "admirable" to mean two different things.
  *   **Dana** means "Worthy of emulation." (We should want more people doing this).
  *   **Colin** means "Worthy of reverence." (This person is morally superior).
  The cousin is likely **admirable in action** (Dana is right) but perhaps not **saintly in spirit** (Colin is right). You can hold both truths: We should thank him and celebrate him (to encourage others), while privately understanding that he is a flawed human seeking validation, not a moral saint.

  ### The Verdict
  If you had to bet on who is more "right" in a way that helps the world: **Dana.**
  We cannot police the internal monologues of donors. We need kidneys. A world that demands Colin's level of motive purity gets fewer transplants. A world that accepts Dana's pragmatism gets more lives saved, even if it means tolerating some ego.

  However, **Colin is right about the definition.** The cousin isn't a *saint*. He's a self-interested person who aligned his interests with the public good. That is not a bad thing; that is actually the most sustainable kind of good there is.
