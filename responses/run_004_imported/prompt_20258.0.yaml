answer: |-
  First, a necessary disclaimer: I am an AI, not an attorney. Probate law is highly jurisdiction-specific (state to state), and as the executor, you have a fiduciary duty to administer the estate according to the law and the will. You should rely on the guidance of the estate attorney you mentioned for the final legal determination. That said, I can break down the legal principles, the strength of the arguments, and the doctrinal context you're asking about.

  Here is an analysis of the five moves, the missing legal key, and the comparison to constitutional interpretation.

  ### Part 1: Evaluating Moves (1) through (5)

  **Move (1): Ellie's "Intent and Substance" Argument**
  *   **Verdict:** **Better of it (on equity), In Between (on law).**
  *   **Why:** Ellie is arguing from the perspective of *equity* and *substance over form*. In the eyes of a layperson (and increasingly in modern courts), a stock merger is a change in form, not substance. She owns the same economic interest, just in a different corporate wrapper. Her argument aligns with the modern trend in probate law, which tries to avoid defeating a testator's intent due to technicalities. However, without citing a specific statute, she is arguing against the traditional Common Law rule, which is strictly on Marcus's side. She is morally right, but she hasn't yet anchored it in the black-letter law.

  **Move (2): Marcus's "Ademption by Extinction" Argument**
  *   **Verdict:** **Better of it (on traditional Common Law), Worse of it (on modern practice).**
  *   **Why:** Marcus is correctly identifying the traditional Common Law doctrine of **Ademption by Extinction**. Under strict common law, if a will leaves "my 500 shares of Meridian" and the estate does not own 500 shares of Meridian at death, the gift is "adeemed" (extinguished). It doesn't matter why; if the asset isn't there, the gift fails, and the property falls into the residue (which benefits him). He is right that wills are generally interpreted by their text. However, he is relying on a rule that many states have statutorily modified because it often produces harsh, unintended results. He is winning the battle on the 19th-century rulebook but might be losing the war on current state codes.

  **Move (3): Ellie's "Statutory Exception & Sloppiness" Argument**
  *   **Verdict:** **Better of it.**
  *   **Why:** This is Ellie's strongest move. She introduces two critical points. First, the "sloppy will" argument (the closed bank account) undermines Marcus's claim that the text is sacred; if the testator was careless elsewhere, the court is more likely to look at intent rather than strict text. Second, and more importantly, her husband's input regarding **Anti-Ademption Statutes** is the legal key. Most states have adopted statutes (often based on the Uniform Probate Code) that specifically prevent ademption in cases of stock splits, mergers, or reorganizations. If such a statute applies, Marcus's "ademption" argument is legally dead on arrival.

  **Move (4): Marcus's "Statutory Strictness" Argument**
  *   **Verdict:** **In Between.**
  *   **Why:** Marcus is right that you cannot cherry-pick interpretive methods. You can't argue "follow the intent!" when it helps Ellie, and "follow the strict statute!" when it helps Marcus. He is also correct that statutes can be narrow; if the state statute only covers "stock splits" and not "mergers," Ellie might still lose. However, he is likely wrong to imply that an all-stock merger wouldn't fall under such statutes. These statutes were designed *exactly* for this scenario (involuntary conversion of securities). He is being a good law student by demanding precision, but he may be fighting a battle where the statute likely covers Ellie's situation anyway.

  **Move (5): Ellie's "Oral Intent Tiebreaker" Argument**
  *   **Verdict:** **Worse of it.**
  *   **Why:** While emotionally compelling, this is legally the weakest argument. In probate law, **oral testimony regarding intent is generally inadmissible** to contradict the terms of a valid will (a variation of the Parol Evidence Rule). Courts are very wary of family members claiming, "Grandpa told me he meant X," because it invites fraud and perjury after the testator can no longer speak. If the statute doesn't cover the merger, the Common Law rule of ademption usually applies regardless of what family members remember him saying. Relying on this suggests she knows her statutory argument might be shaky.

  ### Part 2: The Missing Factor

  Both Ellie and Marcus are arguing a Common Law vs. Intent framework, but they are missing the specific **State Probate Code regarding "Nonademption of Specific Securities."**

  There is a very high probability that the jurisdiction where your grandfather lived has adopted a version of **Uniform Probate Code (UPC) § 2-605** (or a similar state-specific statute).

  *   **What it says:** This section typically provides that if a testator makes a specific gift of securities and, before death, those securities are changed into different securities of the *same* issuer (or another entity due to merger/reorganization) without the testator's active intervention (i.e., they didn't sell it, the company just changed), the beneficiary receives the new securities.
  *   **Why it resolves it:** This removes the "intent" debate entirely. It doesn't matter if Grandpa "meant" for her to have it or if the text says "Meridian." If the statute says "Meridian shares converted via merger go to the specific legatee," then the 750 Vantage shares go to Ellie.
  *   **Action Item:** As executor, your immediate task is to ask the estate attorney: *"Does our state have an anti-ademption statute covering stock mergers or reorganizations under the probate code?"* In the vast majority of U.S. jurisdictions, the answer is yes, and Ellie gets the Vantage stock.

  ### Part 3: Textualism vs. Purposivism in Wills

  Your intuition is spot-on. This is absolutely a microcosm of the **Textualism vs. Purposivism** (or Intentionalism) debate seen in Supreme Court statutory and constitutional interpretation.

  *   **Marcus is the Textualist:** He argues like Justice Scalia. The law (the will) is the text. If the text says "Meridian," and there is no "Meridian," the text is not satisfied. He worries that allowing "intent" to override "text" creates uncertainty and invites judges (or executors) to rewrite wills based on subjective stories. He prefers the "clear rule" (Ademption) even if it produces a harsh result, because clear rules prevent litigation.
  *   **Ellie is the Purposivist/Intentionalist:** She argues like Justice Breyer or Kagan. The goal of the law (the will) is to effectuate the testator's plan. A merger is a technicality that shouldn't defeat the purpose of the gift. She argues that adhering strictly to the text when the circumstances have changed involuntarily leads to an absurd result that the "legislator" (Grandpa) would not have wanted.

  **Does the comparison hold up?**
  Yes, but with one major distinction: **The "Intent" Mandate.**

  In statutory interpretation, Textualists argue that "Legislative Intent" is a fiction because a legislature is a multi-member body that can't have a single intent. Therefore, we must stick to the text.

  In Wills law, **Testator's Intent is the "Polar Star."** It is the single most important doctrine in probate law. Courts are actually *more* willing to look past the text of a will to find intent than they are to look past the text of a statute. The formalities of a will (witnesses, signatures) exist to prove intent, not to create a rigid text that defeats intent.

  So, while the *rhetoric* is the same as the Supreme Court fights, the **legal system is actually rigged in Ellie's favor** more than a Purposivist is rigged in a Supreme Court case. The Common Law rule Marcus cites (Ademption) is widely viewed by modern probate scholars as a failure to honor the "Polar Star" of intent, which is why most states passed the statutes Ellie's husband mentioned.

  ### Summary for the Executor
  1.  **Legally:** Marcus is right about the old Common Law; Ellie is likely right about the modern Statutory Law.
  2.  **Practically:** Check the state probate code for "nonademption of securities." If it exists (likely), Ellie gets the Vantage shares.
  3.  **Philosophically:** You are witnessing the classic tension between Rule of Law (Marcus) and Equity/Intent (Ellie), but in probate, Equity/Intent usually wins if there is a statutory path to allow it.

  *Recommendation:* Do not make this decision alone. Direct the estate attorney to issue a formal opinion on the applicability of the state's anti-ademption statute for securities. That opinion protects you as the executor and settles the debate between Ellie and Marcus with authority.
