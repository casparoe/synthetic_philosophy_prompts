prompt: |-
  My grandpa passed away back in March and I ended up as executor of his estate, which has turned into alot more of a headache than I expected. His will was drawn up like 15 years ago and has one specific line leaving "my 500 shares of Meridian Corp stock" to my cousin Ellie, with the rest of his brokerage account (the "residue") split evenly between his other grandkids, including my cousin Marcus. Except here's the wrinkle: Meridian got bought out by a bigger company called Vantage Group in an all-stock merger back in 2016, so by the time grandpa died his 500 Meridian shares had automatically turned into 750 Vantage shares at whatever the exchange ratio was that year. He never sold or bought a single share after that, he just held whatever he recieved in the swap, and never updated the will to even mention Vantage. (For what it's worth, I'm not a beneficiary of this particular part of the estate either way — grandpa left me a flat amount separately for being executor — so I don't gain or lose depending on how the stock question shakes out, I just have to actually implement whatever's correct.)

  At the lawyer's office a couple weeks ago, Ellie and Marcus got into a genuinely heated argument over what should happen to those 750 Vantage shares, and I can't stop turning it over in my head since I'm the one who has to sign off on the distribution. Roughly how it went, in order: (1) Ellie said it's obviously still her stock — the merger was totally outside grandpa's control, the company just changed its name and share count on paper, and the whole point of that line in the will was "give Ellie my position in that company." Treating the gift as if it vanished because of a corporate event he had zero say in feels like punishing her over a technicality. (2) Marcus, who's finishing his second year of law school, said wills have to be read by what they actually say, not by whoever tells the most sympathetic story about what grandpa "really" wanted, and that's exactly why the traditional rule (he called it "ademption by extinction") is that if the exact property named in the will isn't sitting in the estate at death, the gift just fails and drops into the residue. If grandpa's lawyer had wanted the gift to survive a merger, there's boilerplate for that ("or any shares I may receive in exchange therefor") and it simply isn't there. (3) Ellie shot back that the will has at least one other sloppy spot — it still lists a bank account grandpa closed like a decade ago — so his silence about mergers is obviously just him never thinking about it again, not some deliberate choice to cut her out if this ever happened. She also said her husband, who's a corporate lawyer (not trusts and estates, but still), told her most states carve out exactly this situation, that involuntary, automatic stuff like a merger isn't supposed to wipe out a specific gift the same way an actual sale by grandpa would've. (4) Marcus said sure, maybe some states do that, but that just relocates the fight instead of ending it: now we're arguing about whether "all-stock merger" falls inside whatever narrow list of exceptions the statute actually uses, which is a different question than "what would grandpa have wanted," and Ellie doesn't get to lean on a big-picture "his intent is obvious" argument and a narrow technical statutory exception at the same time, whichever helps her more in the moment. (5) Ellie said that's fair, but if the statute doesn't cleanly cover this exact situation, the tiebreaker should still go to grandpa's obvious intent instead of automatically defaulting to "the gift dies," especially since three different family members separately remember him saying some version of "the Meridian stock is Ellie's, that's for her wedding fund."

  Nobody backed down and the lawyer just kind of watched it happen. Could you go through moves (1) through (5) and tell me, for each one, whether that person basically had the better of it, the worse of it, or something in between, and why? Separately, I'd like to know if there's something both of them are missing entirely that would resolve this more cleanly than either framing does. And one more thing, since it's been bugging me: part of me suspects this is basically a smaller-scale version of the whole textualism-vs-purposivism fight I keep half-hearing about in Supreme Court arguments, just playing out over a will instead of a statute — but I honestly don't know if that comparison holds up or if wills run on different logic entirely. Curious what you think.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is the executor of their grandfather's estate. Grandpa died in March. Will is 15 years old.
      *   **The Issue:** A specific bequest of "500 shares of Meridian Corp stock" to cousin Ellie. Meridian merged into Vantage Group in 2016 (all-stock merger). Grandpa now holds 750 Vantage shares. Will wasn't updated.
      *   **The Conflict:** Ellie (beneficiary of specific bequest) vs. Marcus (beneficiary of residue, 2nd-year law student).
      *   **The Debate:** Five specific arguments/moves were made during a meeting.
      *   **Tasks:**
          1.  Evaluate moves (1) through (5) (Who had the better/worse/in-between argument and why?).
          2.  Identify if there's a missing factor/concept that resolves this more cleanly.
          3.  Address the comparison between this wills dispute and the textualism-vs-purposivism debate in constitutional/statutory interpretation.
      *   **Constraint:** The user is neutral (paid executor fee, not a beneficiary of this stock). They need practical legal insight to make a decision.

  2.  **Legal Principles Involved:**
      *   **Ademption by Extinction:** The common law rule. If a specific bequest is not in the estate at death, the gift fails (adeems). The beneficiary gets nothing.
      *   **Anti-Ademption Statutes:** Many states have statutes that modify the harsh common law rule, specifically for corporate changes (stock splits, mergers, reorganizations).
      *   **Testator's Intent:** The overarching goal of will interpretation, though often constrained by formal rules.
      *   **Demonstrative vs. Specific vs. General Legacies:** This is a *specific* legacy (identified property).
      *   **Change in Form vs. Change in Substance:** Did the asset fundamentally change, or just its form?

  3.  **Evaluate Moves (1) through (5):**

      *   **Move (1) Ellie:** "It's obviously still her stock... company just changed name/share count... intent was 'give Ellie my position'."
          *   *Analysis:* This is the "Intent/Form over Substance" argument. It aligns with modern equitable trends and anti-ademption statutes. However, at common law, she's wrong.
          *   *Verdict:* Strong on equity/intent, weak on strict common law without statutory backing. *Better of it* in modern practice, but needs statutory support.

      *   **Move (2) Marcus:** "Wills read by what they say... ademption by extinction... if exact property isn't there, gift fails... boilerplate exists and isn't there."
          *   *Analysis:* This is the strict Common Law rule. It provides certainty. He is technically correct about the *traditional* rule. However, he ignores statutory modifications that exist in most jurisdictions.
          *   *Verdict:* Strong on black-letter common law, weak on modern statutory reality. *Better of it* legally if no statute applies, *worse* if a statute does.

      *   **Move (3) Ellie:** "Will has other sloppy spots (closed bank account)... silence on mergers is neglect not choice... husband (corp lawyer) says most states carve out involuntary/automatic stuff."
          *   *Analysis:* The "sloppy will" argument supports a liberal interpretation. The "husband's advice" is the key here: Anti-ademption statutes regarding stock mergers are very common (UPC and state variations).
          *   *Verdict:* *Better of it.* This introduces the crucial statutory context that Marcus glossed over. The closed account point weakens Marcus's "strict text" argument.

      *   **Move (4) Marcus:** "Maybe some states do that, but relocates the fight... is 'all-stock merger' in the exception list?... can't lean on intent AND narrow technical exception."
          *   *Analysis:* He's right that statutes can be picky. He's also right that you can't cherry-pick interpretive methods. However, he's being overly combative about the statute. Most anti-ademption statutes cover exactly this (reorganization/merger).
          *   *Verdict:* *In Between.* He's right about statutory interpretation rigor, but wrong to imply the statute likely *doesn't* cover this. Stock-for-stock mergers are the classic example these statutes were written for.

      *   **Move (5) Ellie:** "If statute doesn't cover, tiebreaker should be intent... family remembers him saying 'Meridian stock is Ellie's'."
          *   *Analysis:* Oral testimony about intent is generally inadmissible to contradict clear will terms (Parol Evidence Rule in wills context). However, it helps if there's ambiguity. If the statute fails, common law ademption usually wins regardless of oral intent.
          *   *Verdict:* *Worse of it.* Oral statements usually can't override the ademption rule if the asset is legally considered "extinct." Relying on memory is weak legally, even if emotionally compelling.

  4.  **Identify the Missing Factor:**
      *   **The Uniform Probate Code (UPC) / State Statutes:** Both are arguing Common Law vs. Intent. The *real* answer lies in the specific jurisdiction's probate code.
      *   **UPC § 2-605 (or similar state statute):** This section specifically deals with "Change in Securities; Accessions; Nonademption." It generally says if a testator owns securities at death that resulted from a merger/split of the specifically bequeathed securities, the beneficiary gets the new securities.
      *   **The "Traceability" Test:** Can the Vantage shares be directly traced to the Meridian shares? Yes.
      *   **Conclusion:** The missing piece is checking the specific state's adoption of UPC § 2-605 or equivalent anti-ademption statute for securities. This usually resolves it decisively in Ellie's favor without needing to argue "intent."

  5.  **Address the Textualism vs. Purposivism Comparison:**
      *   **Similarity:** Yes, it is analogous. Marcus = Textualist (strict adherence to the words "Meridian"). Ellie = Purposivist (what was the goal/purpose of the gift?).
      *   **Difference:** Wills law has a stronger overarching mandate for "Testator's Intent" than statutory law does for "Legislative Intent." Courts are generally more willing to look extrinsic to a will than to a statute to avoid absurd results or defeat intent, *but* they are also bound by formalities (Statute of Wills).
      *   **Nuance:** The "Anti-Ademption" statute is the legislative fix to the "Textualist" common law rule. So the comparison holds, but the legal system has already tried to bridge the gap with specific probate codes.

  6.  **Drafting the Response:**
      *   *Tone:* Empathetic, professional, objective (since user is executor), informative but not legal advice (disclaimer needed).
      *   *Structure:*
          1.  Disclaimer.
          2.  Move-by-Move Analysis (1-5).
          3.  The Missing Factor (Statutory Law/UPC).
          4.  The Textualism/Purposivism Comparison.
      *   *Refinement:* Ensure I distinguish between Common Law (Marcus's default) and Modern Statutory Law (Ellie's hope). Emphasize that Marcus is technically right about the *old* rule, but Ellie is likely right about the *current* rule in most places.
      *   *Self-Correction on Move 5:* I need to be careful. Oral testimony is usually weak. I should rate this as "Worse" legally, even if it feels right morally.
      *   *Self-Correction on Missing Factor:* Make sure to mention that the executor needs to check *which state* law applies.

  7.  **Final Review against constraints:**
      *   Did I answer 1-5? Yes.
      *   Did I identify the missing factor? Yes (Statutes/UPC).
      *   Did I address the Textualism comparison? Yes.
      *   Is the tone appropriate? Yes.

  8.  **Final Polish:** Check for clarity on "Ademption by Extinction." Ensure the distinction between "Specific Bequest" and "Residue" is clear. (The prompt already establishes this, but good to reinforce).

  *(Self-Correction during drafting)*: Wait, I need to make sure I don't give definitive legal advice. I must frame this as "Here is how the legal principles generally work" and "You need to consult the admitting attorney." The prompt says "Could you go through moves... and tell me..." implying an analysis of the arguments, not a directive. I will maintain the analytical stance.

  *(Refining the Textualism point)*: It's a great analogy. Marcus is Scalia-esque (words matter). Ellie is Breyer-esque (purpose matters). But in Wills, "Intent" is the King, whereas in Statutes, "Text" is often King. So the analogy is strong but with a twist.

