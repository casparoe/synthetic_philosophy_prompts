answer: |-
  Late in life, a colleague asks Hobbes why he refuses to concede the circle-squaring dispute to Wallis, despite the proofs against him.

  "My whole philosophy rests on the idea that reasoning from clear definitions produces undeniable truth," Hobbes says.

  "But Wallis has shown your definitions are flawed," the colleague replies.

  "Precisely," says Hobbes. "I set out to make civil philosophy as certain as geometry. But by refusing to yield, I have successfully made geometry as contentious as civil philosophy. So you see, the systems are compatible after all."
