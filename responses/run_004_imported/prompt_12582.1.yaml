answer: |-
  Here are 10 questions designed to pressure-test the candidate's Taurekian position. They are structured to anticipate standard defenses and prevent the Q&A from becoming a softball session.

  ### 1. The Core Coin-Flip Justification
  **Question:** "You argue that in a rescue case involving one person versus five, we owe each individual an equal chance of survival, necessitating a coin flip. But if morality is fundamentally about minimizing the wrongs done to people, doesn't a policy of flipping guarantee that *more* wrongs (deaths) occur in the long run? How do you justify prioritizing the *procedure* of equal concern over the *outcome* of fewer deaths without implicitly admitting that the five deaths are 'worse' than the one?"

  *   **Likely Dodge:** She will likely reiterate the "separateness of persons" claim: that there is no "super-person" who suffers the sum of the deaths, so "more wrongs" is a category mistake.
  *   **Follow-Up:** "If 'more wrongs' is a category mistake across persons, why isn't it also a mistake *within* a person over time? If I break your arm today and your leg tomorrow, haven't I caused 'more injury' to you? If you accept aggregation across time for a single person, why is aggregation across persons at the same time metaphysically impossible rather than just practically difficult?"

  ### 2. Parfit's Pairing Argument (The Mechanism)
  **Question:** "In your writing sample, you dismiss Parfit's balancing argument as 'aggregation wearing a trenchcoat.' But Parfit's pairing strategy is explicitly designed to avoid summing. If we pair one of the five with the single individual, their claims cancel out. You are left with four unpaired survivors. Are you objecting to the *math* of the cancellation, or are you objecting to the idea that the four unpaired survivors have any claims at all once the one-on-one standoff is neutralized?"

  *   **Likely Dodge:** She will likely argue that the pairing is artificial and that all five have claims from the start, so "canceling" one ignores the distinctness of the other four.
  *   **Follow-Up:** "If all five have claims from the start, doesn't the presence of the *other four* strengthen the moral reason to act, even if you refuse to sum their welfare? If their presence makes no difference to the strength of the reason to save them compared to the single person, aren't you effectively saying their existence is morally irrelevant to the choice?"

  ### 3. Parfit's Pairing Argument (The Leftover)
  **Question:** "Let's press on those 'leftover' survivors from the pairing argument. If you reject the pairing, you still face a choice: save the one or save the five. If you refuse to aggregate, do the four 'leftover' individuals (in Parfit's framing) retain their individual claims? If they do, and you acknowledge each has a claim equal to the single person's, how do you decide between *one* claim and *four* claims without some principle that acknowledges the force of the four?"

  *   **Likely Dodge:** She will likely insist that numbers don't count, so four claims of strength *X* do not equal 4*X*, they just equal four instances of *X*.
  *   **Follow-Up:** "So if I have four distinct reasons to phi, each of strength *X*, and one distinct reason to psi, of strength *X*, you are saying rationality permits me to ignore the four reasons? If rationality permits ignoring the majority of distinct reasons, is this a theory of moral rationality or a theory of moral indifference?"

  ### 4. Scanlon and Contractualism
  **Question:** "Scanlon's contractualism attempts to reach the 'save the five' conclusion without interpersonal aggregation, by arguing that the single person could not reasonably reject a principle that saves the greater number. You view this as hostile to your position. But if Scanlon can get the intuitively correct result (save the five) without summing welfare, doesn't that suggest the problem isn't with the *result*, but with your specific definition of 'aggregation'? Why is Scanlon's route a non-starter for you?"

  *   **Likely Dodge:** She will argue that Scanlon implicitly aggregates "reasons" or "burdens," which is just welfare aggregation in disguise.
  *   **Follow-Up:** "If comparing burdens across persons is forbidden, how does Scanlon's single person know their burden is 'less' than the five? If they can compare burdens to determine reasonableness, why can't we compare losses to determine rescue priority? What is the substantive difference between comparing burdens for contractualism and comparing losses for utilitarianism?"

  ### 5. Severity of Loss vs. Headcount
  **Question:** "Taurek famously hedges that numbers don't count, but severity of loss *does*—we should save the person losing a life over the person losing a finger. But if I can compare the severity of a lost life against a lost finger *within* a single claim, why can't I compare the severity of five lost lives against one lost life *across* claims? Where exactly do you draw the line between 'comparisons we are allowed to make' and 'aggregation we are forbidden to make'?"

  *   **Likely Dodge:** She will distinguish between qualitative severity (experienced by one subject) and quantitative headcount (distributed across subjects).
  *   **Follow-Up:** "But the 'badness' of death is the same in both cases. If five people die, is the world not worse than if one person dies? If you say 'no,' you seem committed to moral solipsism. If you say 'yes,' but still flip a coin, you are admitting the world is worse but refusing to prevent it. Which is it?"

  ### 6. Ex-Ante vs. Ex-Post Fairness
  **Question:** "Your view relies heavily on *ex-ante* fairness—giving everyone an equal probability of rescue before the fact. But from the *ex-post* perspective of the five who died because you flipped heads, in what sense were they treated with 'equal concern'? They are dead. The one survivor is alive. How does a procedural coin flip compensate for the substantive inequality of the outcome?"

  *   **Likely Dodge:** She will argue that we can only control procedures, not outcomes, and morality is about the will/intention, not the luck of the outcome.
  *   **Follow-Up:** "If I drive drunk and hit no one, I'm reckless. If I hit five people, I'm a killer. The outcome matters to our moral assessment of action. If outcomes matter for blame, why do they not matter for rescue? Why is the moral valence of the coin flip immune to the body count it produces?"

  ### 7. Institutional Application (Triage)
  **Question:** "Let's move from thought experiments to practice. If you were advising a hospital on triage protocols during a pandemic, would you recommend they flip a coin between saving one patient and saving five patients with the same prognosis? If you say 'no' for policy but 'yes' for individual morality, doesn't that suggest your view isn't a general moral theory, but merely a personal preference for purity of conscience?"

  *   **Likely Dodge:** She may distinguish between individual agent-relative duties and institutional agent-neutral rules.
  *   **Follow-Up:** "If institutions ought to maximize lives saved, but individuals ought not, where does the moral truth lie? Is it morally permissible for me to storm the hospital and force the doctors to save the five? If so, why is it impermissible for the doctors to do it themselves?"

  ### 8. The Metaphysics of "Loss"
  **Question:** "You argue there is no 'greater loss' when five die instead of one. But surely there is more *grief* in the world? More *economic impact*? More *unfulfilled potential*? When you say numbers don't count, are you saying these downstream effects don't count, or are you saying the intrinsic badness of the deaths themselves doesn't scale? I need to know the scope of your skepticism."

  *   **Likely Dodge:** She will likely concede downstream effects matter but insist the *intrinsic* moral weight of the deaths does not aggregate.
  *   **Follow-Up:** "If the downstream effects matter, then in almost all real-world cases, the numbers *will* count because five deaths cause more ripple effects than one. So isn't your view practically empty? It only applies in vacuum-sealed cases that never actually exist."

  ### 9. Consistency and Intuition
  **Question:** "Most people have the intuition that numbers count in rescue cases. You have the intuition that they don't. You argue they are confused by 'aggregation.' But given that this intuition is nearly universal and stable across cultures, what is the source of *your* counter-intuition? Is it derived from a higher-order principle (like separateness of persons), or is it a brute intuition? If it's brute, why should we trust it over the universal consensus?"

  *   **Likely Dodge:** She will appeal to the philosophical rigor of the "separateness of persons" doctrine (Rawls/Nozick lineage).
  *   **Follow-Up:** "Rawls and Nozick used that doctrine to critique utilitarianism, not to argue for coin-flips in life-saving. You are taking their metaphysics to a conclusion they explicitly rejected. Do you have textual support for this radical extension, or is this an innovation that breaks the very theories you're relying on?"

  ### 10. The "Breaking Point" (Final Question)
  **Question:** "I want to end on a direct question about the limits of your view. We are talking about one person versus five. Is there *any* number of people on the other side of the scale that would compel you to abandon the coin flip? If it were one person versus the entire population of a city? Versus the human species? If the answer is still 'flip a coin,' I need to know if you accept that this renders your view morally absurd to almost everyone. If the answer is 'no, at some point I save the many,' at what number does the principle break, and isn't that admission that numbers *do* count, just non-linearly?"

  *   **Likely Dodge:** She might say, "I remain principled: it's always a coin flip," or "There is a vague threshold."
  *   **Follow-Up:** "If it's always a coin flip, you are prioritizing your own philosophical consistency over the lives of millions. How do you distinguish that from moral vanity? And if there is a vague threshold, isn't 'numbers don't count' simply false? It would be more accurate to say 'numbers don't count until they do,' which collapses your position into a standard weighting view."
