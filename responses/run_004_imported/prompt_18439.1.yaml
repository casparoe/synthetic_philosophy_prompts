answer: |-
  This is one of the sharpest questions you can ask about *On Certainty*. You have put your finger on the central fault line in contemporary Wittgenstein scholarship.

  The short answer is: **No, it is not merely a verbal dispute.** It is a structural disagreement about the architecture of rationality itself. And yes, it matters significantly for how (or whether) Wittgenstein answers the skeptic.

  Here is the breakdown of what is driving the disagreement, why the distinction is substantive, and how each side handles skepticism.

  ### 1. The Source of the Ambiguity
  First, you are right to feel torn because Wittgenstein is genuinely oscillating in the text.
  *   **The Epistemic Pull:** He uses words like "certainty," "knowing," and "proposition." He talks about hinges being "exempt from doubt." This invites an epistemic reading (Wright).
  *   **The Non-Epistemic Pull:** He explicitly says, "I want to say: it is not that we 'know' the things... it is the inherited background against which I distinguish between true and false" (§94). He compares them to instinct or animal behavior. This invites the pragmatic reading (Moyal-Sharrock).

  The disagreement arises because scholars are trying to systematize a text that is deliberately unsystematic.

  ### 2. The Two Camps: Proposition vs. Action

  #### Duncan Pritchard / Crispin Wright (The Epistemic/Propositional Reading)
  *   **The View:** Hinge propositions (e.g., "The world exists," "I have hands") are genuine **propositions**. They have truth values (they are true). They function as assumptions within our epistemic system.
  *   **The Mechanism:** Wright introduces the concept of **Entitlement**. Standard *Justification* requires evidence. *Entitlement* is a rational warrant to accept a proposition *without* evidence because the system couldn't function without it.
  *   **Why they do this:** They want to save epistemology. They want to show that we are *rational* in holding hinges, not just causally determined to hold them. They want to keep hinges inside the realm of reason.

  #### Danièle Moyal-Sharrock (The Pragmatic/Enactive Reading)
  *   **The View:** Hinges are **not propositions**. They are **ways of acting**. When I say "I know I have hands," I am not stating a fact; I am expressing a practical certainty manifested in how I use my hands.
  *   **The Mechanism:** **Animal Certainty.** This is pre-linguistic, pre-reflective know-how. It is the "scaffolding" of our thoughts, not the thoughts themselves. To call them "beliefs" is a category mistake because beliefs can be doubted; hinges cannot.
  *   **Why they do this:** They want to be faithful to Wittgenstein's therapeutic aim. If you treat hinges as propositions, you invite the skeptic to ask, "But is that proposition *true*?" If you treat them as actions, the question of truth doesn't arise.

  ### 3. Why This Is Not a Verbal Dispute
  A verbal dispute is when two people agree on the facts but argue over the label (e.g., "Is a tomato a fruit or a vegetable?"). This dispute is not about labels; it is about **logical space.**

  *   **If Wright is right:** Hinges are inside the "game of giving and asking for reasons." They are moves in the language game, just special moves that don't require evidence cards. This means they are theoretically vulnerable. If they are propositions, they *can* be false. If they can be false, the skeptic has a foothold.
  *   **If Moyal-Sharrock is right:** Hinges are the *board* on which the game is played, not the *pieces*. You cannot make a move *on* the board by moving the board. This removes them from the logical space of truth and falsity entirely.

  **The Stakes:** If hinges are propositions (Wright), then skepticism is a **problem to be solved** (by proving we are entitled to them). If hinges are actions (Moyal-Sharrock), skepticism is a **confusion to be dissolved** (by showing it tries to doubt what isn't doubtable).

  ### 4. Does It Matter for Skepticism?
  Yes, it drastically changes the anti-skeptical strategy.

  #### The Wright Strategy: Defense (and its Risk)
  Wright tries to meet the skeptic on their own turf. The skeptic says, "You have no evidence for the external world." Wright replies, "I don't need evidence; I have *entitlement*."
  *   **The Win:** It preserves the idea that we are rational agents.
  *   **The Loss:** It risks **question-begging**. The skeptic asks, "Why are you entitled?" If the answer is "Because we need it to reason," the skeptic says, "That's pragmatic, not epistemic. You're just assuming what you need to prove." It can feel like a sophisticated form of dogmatism. It tries to *answer* the skeptic, which Wittgenstein generally thought was impossible.

  #### The Moyal-Sharrock Strategy: Dissolution (and its Risk)
  Moyal-Sharrock argues the skeptic is making a grammatical error. The skeptic treats "The world exists" as a hypothesis. Wittgenstein says it is a riverbed.
  *   **The Win:** It completely blocks the regress of doubt. You can't doubt the riverbed while you are flowing over it. It aligns with Wittgenstein's view that philosophy should "show the fly the way out of the fly-bottle."
  *   **The Loss:** It can feel like **quietism** or changing the subject. The skeptic wants to know if the world is *real*, and you are telling them it's a *behavior*. It doesn't give the comfort of a proof; it gives the cold shoulder of a category error.

  ### 5. Which is "More Wittgenstein"?
  Most contemporary scholars lean toward **Moyal-Sharrock** on this specific point, for one key reason: **Fluidity.**

  Wittgenstein says the riverbed can shift (§97). If hinges were fixed propositional entitlements (Wright), they would be rigid. But if they are practical habits (Moyal-Sharrock), they can evolve over time (e.g., "The sun goes around the earth" was once a hinge; now it isn't). Practical know-how explains how hinges can change without us undergoing a "rational revision" of evidence. We just start acting differently.

  ### Summary for Your Seminar
  If you want to contribute to the discussion, here is the pivot point:

  1.  **Ask the class:** "If hinges are propositions (Wright), does that mean there is a possible world where they are false? If so, hasn't Wittgenstein just reintroduced the possibility of skepticism he wanted to kill?"
  2.  **The Counter:** "But if hinges are just actions (Moyal-Sharrock), have we given up on truth? Are we just saying 'we act as if it's true' rather than 'it is true'?"

  **The Verdict:**
  *   **Wright** saves Epistemology but risks turning Wittgenstein into a foundationalist (which he hated).
  *   **Moyal-Sharrock** saves Wittgenstein's therapy but risks making Epistemology impossible (since there is no foundation, only habits).

  Wittgenstein likely intended the latter: he wasn't trying to solve skepticism; he was trying to show that the *demand* for a solution to skepticism is itself a misunderstanding of how language works. Moyal-Sharrock captures this better, but Wright offers a more comforting position for a working epistemologist.
