  7.  **Self-Correction/Nuance Check:**
      *   *Did I explain Entitlement clearly?* Need to make sure it's distinct from "justification." Justification = evidence/reason. Entitlement = rational permission without evidence.
      *   *Did I explain the "Non-Propositional" view clearly?* It's not that they *can't* be phrased as propositions, but that their *function* isn't propositional.
