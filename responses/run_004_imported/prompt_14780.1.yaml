answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I've had the privilege of being Priya's friend for a long time. We actually met in the comment section of a blog about statistics and philosophy. So, naturally, when Priya asked me to give this toast, I didn't send a card. I sent a pull request.

  Now, I know some of you know the story of how Priya and Dev started dating. And for those who don't… well, let's just say they took the concept of "serious commitment" literally. Early on, they were having trouble making time for date nights. Life got busy. So, being the rationalists they are, they wrote a contract. If one of them canceled a date, they owed the other fifty dollars.

  I can see the aunts in the back doing the math. That is a very expensive marriage.

  But here's the thing. On the surface, that sounds cold, right? It sounds like they didn't trust their love to survive without a financial penalty. It sounds like they were planning for failure.

  But I want to suggest that what they were actually doing was the most romantic thing possible.

  There's an idea in behavioral economics called *hyperbolic discounting*. It's a fancy way of saying that human beings are terrible at valuing the future. Right now, in this moment, Priya and Dev love each other immensely. They value this marriage more than anything. But there will be a Tuesday, maybe seven years from now, maybe twelve. It's raining. The car broke down. One of you is exhausted, the other is frustrated. And in that specific moment, the "Future Happiness" of staying together feels very far away, and the "Immediate Relief" of walking away feels very close.

  Your brain literally discounts the value of the love you have right now, just because you're tired.

  Priya and Dev knew this. They know that they are not just two people. They are two *series* of people. The Priya standing here tonight in a beautiful dress is not the same Priya who will be arguing about whose turn it is to do the dishes in 2031.

  So, when they write their vows today, they aren't just making a promise to each other. They are making a promise to their future selves.

  Think of it like Odysseus and the Sirens. Odysseus knew that when he heard the Sirens' song, he would be tempted to steer the ship into the rocks. He couldn't trust his future self to make the right choice in the heat of the moment. So he had his crew tie him to the mast. He didn't do that because he wanted to crash the ship. He did it because he wanted to survive the song.

  That is what this wedding is.

  The vows are the mast. This room full of witnesses—your parents, your friends, the aunts calculating the fifty dollars—we are the crew. We are here to hold the rope.

  When things are easy, you won't need this contract. When the sun is shining and the bills are paid, you will feel like one unified soul. But on that miserable Tuesday in year twelve, when the hyperbolic discounting kicks in and the "immediate relief" looks tempting, I want you to remember this moment.

  I want you to remember that the Priya of today loved Dev enough to tie the hands of the Priya of year twelve. And I want Dev to remember that he is bound to a woman who was smart enough to know that love isn't just a feeling you have. It's a structure you build.

  Some people think that analyzing love like this takes the magic out of it. They think romance requires blindness. But I disagree. Blind love hopes nothing ever goes wrong. Rational love looks at the possibility of things going wrong—the exhaustion, the boredom, the friction—and says, "I am building a container strong enough to hold this."

  That isn't cynicism. That is optimism. It is a bet that what you have on the hard days is worth protecting more than your comfort on the easy days.

  So, Priya and Dev, you have signed the contract. You have tied yourselves to the mast. The penalties are no longer fifty dollars; they are much higher than that. But the payout is also higher.

  May your discount rates remain low. May your future selves thank your present selves. And may you always find your way back to the mast when the sirens start singing.

  To Priya and Dev.
