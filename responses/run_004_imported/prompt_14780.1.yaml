      *   *Application to Marriage:* Future Priya/Dev on a "miserable Tuesday" might discount the value of the marriage. Vows bind that future self to the current self's values.
      *   *Risk:* Sounds like "I know I'll want to leave you, so I'm trapping myself."
      *   *Reframe:* "I know life is hard and feelings fluctuate, so I'm building a structure to protect what we have when feelings aren't enough." It's about *protecting* the love, not *enforcing* it.

