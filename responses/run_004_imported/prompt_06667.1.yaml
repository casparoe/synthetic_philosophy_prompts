answer: |-
  The museum was closed, the vast hall dark save for the glow of the exhibit cases. In the center of the Quantum Connections gallery, a blue diode pumped light into a beta-barium borate crystal. Two fibers carried the resulting entangled photons to polarizers on opposite sides of a black table. Every few seconds, a green LED flashed on the left, a red on the right, and a coincidence counter beeped.

  Dr. Elena Rostova leaned against the railing, arms crossed. She wore a blazer that had seen better conferences. Dr. Marcus Thorne sat on a stool, loosening his tie, watching the coincidence counter with the air of a man watching a slot machine pay out.

  By the exit, the exhibit director, Sarah, checked her watch. "Five minutes, doctors. I just need one sentence. 'This exhibit demonstrates X.' That's it. Then I can lock up."

  "It demonstrates nonlocality," Elena said immediately. "Nature is nonlocal."

  Marcus didn't look up. "It demonstrates that local hidden variable theories are untenable. It does not demonstrate nonlocality."

  Elena pushed off the railing. "Marcus, we've been over this. Bell's theorem isn't about hidden variables. That was 1964. By 1976, Bell had generalized it to stochastic theories. The assumption isn't determinism. It's Local Causality. That the probability of an event here depends only on events in its past light cone."

  "And the violation tells us Local Causality is false," Marcus said, finally meeting her eyes. "But 'Local Causality' is a package deal. It bundles the geometry of spacetime with a specific assumption about the status of the physical state. QBism rejects the assumption about the state, not the geometry."

  "The state?" Elena gestured at the crystal. "I'm not talking about the wavefunction. I'm talking about the clicks. The green light. The red light. Those are events. They happen. When the green light flashes here, the statistics of the red light there change instantly, conditioned on the setting here. If you insist those lights represent objective events in spacetime, you have action at a distance."

  Marcus stood up and walked to the detector on the left. He hovered his hand over it without touching. "Here is the rub, Elena. You say 'objective events.' I say 'experiences for an agent.' The click is real for me, the observer at this wing. It updates my probability assignment for what I *would* experience if I were at the other wing. But there is no 'fact of the matter' at the distant wing until an agent interacts with it. The wavefunction isn't a beam of stuff reaching across the table. It's my catalog of expectations."

  "So the photon doesn't hit the detector?" Elena asked, her voice tight. "The diode doesn't pump the crystal? You're solipsizing the hardware."

  "No. The hardware is real. The interaction is real. But the *outcome*—the specific 'up' or 'down'—is not a pre-existing property waiting to be revealed, nor is it a value fixed by a signal from here. It is created in the interaction. And since it is created locally, at the point of measurement, nothing has to travel from A to B."

  Elena shook her head. "This is where Maudlin would stop you. You're treating 'realism' like it's an independent ingredient you can remove to save locality. But it isn't. Look at the EPR argument. If you assume Locality—that what I do here doesn't disturb reality there—and you observe perfect correlations, you are *forced* to conclude the values were already there. Locality *implies* Realism in that context. Bell then shows those pre-existing values are impossible. So you have a contradiction. You can't save Locality by dropping Realism, because Locality was the only reason you had Realism in the first place. If you drop Realism, you've already dropped Locality."

  Marcus tapped the table. "That logic holds only if you assume the measurement reveals a pre-existing value. EPR assumes that measurement is a reading of a property. QBism says measurement is an action that elicits a response. There is no 'value' before the measurement. So EPR's derivation of 'elements of reality' fails at step one. Not because of nonlocality, but because the question 'what was the value before I looked?' is a category error. It's like asking what the temperature of the water was before you decided to measure it in Fahrenheit or Celsius, except deeper. The outcome doesn't exist until the agent makes it."

  "An agent?" Elena laughed, a short, sharp sound. "So if I leave the room, the photons don't land? If a tree falls in the forest and no Bayesian is there to update their priors, does it make a sound?"

  "Don't be reductive," Marcus said calmly. "An 'agent' is any physical system capable of registering a measurement and using the result to guide future action. The detector is an agent. But the key is that the detector at A and the detector at B are distinct agents. The update happens at A. It does not happen at B. There is no physical change at B when A clicks. There is only a change in the information available to anyone who knows about A."

  "But the correlation is physical!" Elena slammed her hand on the railing. "Run the experiment a thousand times. Bring the data tapes together. The correlation is in the tape. It's in the ink. It's observer-independent. If the correlation is real, and the local settings are free variables, then the outcome at B must depend on the setting at A. That is the definition of nonlocality. You are trying to hide the nonlocality in the 'agent,' but the agent is part of nature. If nature forbids local accounts of the correlation, nature is nonlocal."

  Marcus walked to the other side of the table, to detector B. "The correlation is real, yes. But correlations do not imply causal mechanisms. In classical probability, if I have two gloves in boxes, and I open one and see 'Left', I know instantly the other is 'Right'. Did my opening the box change the glove in Paris? No. It changed my knowledge."

  "Gloves are local hidden variables!" Elena countered. "Bell proved entangled photons *aren't* gloves. You can't use a classical analogy for the correlation to explain away the quantum violation. The violation exceeds what any local common cause can produce. To explain the excess, you need a connection. Bohmian mechanics provides that connection explicitly. The particle goes here, the wave goes there, the wave guides the particle nonlocally. It's ontological. It's clean."

  "It's ontological baggage," Marcus corrected. "You posit a pilot wave in configuration space—3N dimensions—guiding particles in 3 dimensions. You save 'realism' about the particle positions by sacrificing Lorentz invariance at the fundamental level. You accept a preferred frame. That is a high price to pay to keep your intuition about 'events' intact."

  "It's a high price to pay to keep the world *real*," Elena shot back. "You're asking me to believe that the universe is a collection of local experiences that magically align without a mechanism. I'm asking you to believe the universe is a single, connected whole where parts influence each other faster than light. One of these is metaphysics. The other is physics."

  "They are both metaphysics," Marcus said softly. "The math is the same. The predictions are identical. The question is: What is the quantum state? Is it a territory, or a map?"

  "It's the territory," Elena said. "Because the map constrains the territory so tightly that they become indistinguishable. If my map tells me that turning a knob here changes the statistical distribution of clicks there, and there is no signal, then the map is describing a constraint that is itself nonlocal. You call it 'normative.' I call it 'causal.'"

  Marcus looked at the coincidence counter. It beeped. Green. Red.

  "Here is the crux, Elena," Marcus said. "You believe that when the green light flashes, a fact is established at the red detector *at that moment*, regardless of whether anyone looks at the red detector. You believe the outcome at B is fixed by the event at A."

  "I believe the outcome at B is *correlated* with the event at A in a way that requires a nonlocal explanation," Elena said. "Yes. The fact is established."

  "I believe that when the green light flashes, a fact is established *for me*. The status of the red detector remains indefinite until I, or an agent at B, interacts with it. There is no 'fact at B' from the perspective of A until the light cones overlap."

  "So," Elena said, "you deny that there is a single, objective history of the universe."

  "I deny that 'history' is a view-from-nowhere concept," Marcus said. "It is a stitching together of local perspectives. Nonlocality arises only if you demand that all perspectives merge into one God's-eye view instantaneously."

  Elena turned to Sarah, the director. "Write this down: 'This exhibit demonstrates that physical influences can propagate instantaneously across space.'"

  Marcus shook his head. "Write this: 'This exhibit demonstrates that agents updating their beliefs on local evidence will find those beliefs constrained by non-classical correlations.'"

  Sarah looked between them, pen hovering. "I can't put both on the plaque."

  "Then don't," Elena said. "Put mine. It's what the experiment forces you to accept if you think the detectors actually detect something."

  "It's what the experiment forces you to accept if you think the detectors create reality," Marcus countered.

  They stood in silence for a moment, the hum of the cooling fan the only sound.

  "What would change your mind?" Elena asked. "Suppose we find a fact. A record. A trace. Something that exists at B, independent of any agent looking at it, that carries the signature of the setting at A. Would you concede?"

  "If you could show me a record at B that was altered by A *before* a light signal could reach it, without assuming that the record had a definite value prior to measurement... but you can't. Because 'record' implies 'definite value.' You're begging the question." Marcus paused. "What about you? What would make you a QBist?"

  Elena looked at the crystal, the blue pump light invisible to the eye but driving the whole show. "If you could show me a formulation of quantum mechanics that recovers all the predictions, accounts for the definite outcomes we see, and remains strictly local in spacetime without positing that outcomes are relative to agents... I'd switch tomorrow. But every time you try, you have to say the outcome 'wasn't real yet.' And I can't build a universe on 'not yet.'"

  "Then we are stuck," Marcus said.

  "Then we are stuck," Elena agreed.

  Sarah sighed and capped her pen. "I'm putting: 'This exhibit demonstrates quantum entanglement.' Everyone agrees on entanglement."

  "Entanglement is just the name of the puzzle," Elena muttered.

  "It's the name of the solution," Marcus said.

  They walked toward the exit together, leaving the machine to flash its lights into the empty dark, correlating events that neither of them could agree had actually happened.
