      *   **The Bohmian Argument (The EPR/Bell Link):** Rostova needs to explain why "realism" isn't a free parameter.
          *   *Key point:* If you assume locality, EPR forces you to accept pre-existing values (elements of reality). Bell shows *those* are impossible. Therefore, Locality must go. You can't save Locality by dropping "realism" because Locality *created* the realism requirement in the first place.
          *   *Reference:* Bell's 1976 "local causality" formulation (no hidden variables needed initially).
