          *   Interaction: Engage strongest moves, no talking past each other, neither looks weak.
      *   **Ending:** No agreement, but the crux must be stated precisely enough that a reader knows what would change their minds.
      *   **Tone:** Intellectual, respectful, tense but professional.

  2.  **Character Conception:**
      *   **The Bohmian (Dr. Elena Rostova):** Needs to be grounded in the ontology of the wavefunction and particles. She sees the math as describing *stuff* happening in space-time. She respects Bell's later formulations. She thinks QBism is instrumentalism dressed up as philosophy.
      *   **The QBist (Dr. Marcus Thorne):** Needs to be grounded in Bayesian probability and the role of the agent. He sees the wavefunction as a user's manual, not a picture of reality. He thinks Bohmian mechanics adds unnecessary metaphysical baggage (the "pilot wave" ghost).

  3.  **Drafting - Section by Section:**

      *   **Setting the Scene:** Establish the atmosphere. Humming equipment, blinking lights, the waiting director. This adds stakes (they need a script).
