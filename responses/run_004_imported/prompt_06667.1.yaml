          *   *Key point:* Nonlocality implies a causal influence. QBism sees only Bayesian updating.
      *   **The Clash (Ontology vs. Epistemology):**
          *   Rostova: "If I kick a stone, it hurts. The photon hits the detector, it clicks. That's an event."
