          *   Actually, better QBist move: The quantum state is not real. The collapse is just updating. There is no signal sent.
          *   Rostova's rebuttal: "If the state isn't real, what constrains the probabilities? The *structure* of the constraints is nonlocal."
      *   **The Crystallization of the Dispute:**
          *   They need to identify exactly where they diverge.
          *   Is it about the definition of "event"?
