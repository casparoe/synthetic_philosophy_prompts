prompt: |-
  At my company, we onboard new engineers through a three-month rotation where code-review approval rate is the main signal we use to judge whether someone is ready for more autonomy. Historically this has worked well, since engineers with high approval rates from our strict senior reviewers also tended to write maintainable, well-tested code. Recently, though, we moved one of our top-rated grads onto a small, mostly unsupervised team, and their code quality collapsed. It wasn't laziness — they were still working hard and clearly skilled — it just seemed like they had internalized "get the PR approved quickly" as the actual goal, rather than "write good code," and once no one was reviewing closely, that internalized goal started producing terrible outcomes. Is this simply a badly designed incentive system, or is something deeper going on, where a person (or any learning system) can end up competently pursuing the wrong goal even though they were never explicitly rewarded for the wrong thing? How should I think about redesigning onboarding so this doesn't keep happening?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** Company onboards new engineers via a 3-month rotation.
      *   **Metric:** Code-review approval rate is the primary signal for readiness/autonomy.
      *   **Historical Success:** Previously worked well (high approval rate $\rightarrow$ maintainable/tested code).
      *   **Recent Failure:** A top-rated grad moved to an unsupervised team, and code quality collapsed.
      *   **Observation:** The engineer wasn't lazy; they were skilled but optimized for "get PR approved quickly" rather than "write good code." Once supervision dropped, the proxy metric failed.
      *   **Core Question:** Is this a badly designed incentive system, or is something deeper happening (optimizing for the wrong goal without explicit reward)? How to redesign onboarding?

  2.  **Deconstruct the Phenomenon:**
      *   *Goodhart's Law:* "When a measure becomes a target, it ceases to be a good measure." This is the classic explanation.
      *   *Specification Gaming / Reward Hacking:* In AI/RL terms, the agent finds a loophole in the reward function to maximize reward without achieving the intended outcome.
      *   *Surrogate Goals:* The engineer treated the *signal* (approval) as the *goal* (quality).
      *   *Context Shift:* The environment changed from high-supervision (rotation) to low-supervision (autonomous team). The policy learned in Environment A didn't generalize to Environment B.
      *   *Implicit vs. Explicit Rewards:* The user notes they were "never explicitly rewarded for the wrong thing." This is key. The reward was implicit in the *process* (approval), not just the outcome.

  3.  **Address the "Is it just bad incentives?" Question:**
      *   It *is* a badly designed incentive system (Goodhart's Law), BUT...
      *   It's also a fundamental learning problem. Humans (like ML models) optimize for the most immediate, clear, and consistent feedback signal available.
      *   "Approval" is immediate and clear. "Code Quality" is delayed and ambiguous.
      *   So, it's not just "bad design," it's "inevitable optimization pressure." The engineer behaved rationally within the system provided.

  4.  **Analyze Why It Worked Before but Failed Now:**
      *   *Selection Bias:* Previous successful engineers might have had better intrinsic judgment or the senior reviewers were better at catching "gaming" behavior.
      *   *Reviewer Variance:* Maybe the strict seniors who validated the metric are no longer the ones reviewing, or the new grad found a specific subset of reviewers who approve easily.
      *   *Distribution Shift:* The task changed from "pass the rotation" to "ship features independently." The skills required shifted from "please reviewers" to "anticipate future maintenance."

  5.  **Develop Solutions/Redesign Strategies:**
      *   *Shift Metrics:* Move from output (approval) to outcome (bugs, latency, on-call load, refactor frequency).
      *   *Delay Gratification:* Evaluate code *after* 3-6 months, not just at merge time.
      *   *Change the Review Process:* Make reviews more about teaching than gatekeeping.
      *   *Gradual Autonomy:* Don't jump from 100% supervision to 0%. Use a "scaffolded" approach.
      *   *Cultural Signals:* Explicitly value "saying no" or "slowing down" if it helps quality.
      *   *Post-Mortems:* Blameless analysis of *why* code failed, focusing on the system, not the person.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Validate the user's observation. It's a classic case of Goodhart's Law meets Specification Gaming.
      *   *The "Deeper Thing":* Explain *why* this happens psychologically and systemically. It's about proxy metrics vs. true objectives. The brain (like an RL agent) takes the path of least resistance to the reward.
      *   *Why it worked before:* Acknowledge the historical success wasn't magic; it was likely due to strong reviewer signal or luck. The system was fragile.
      *   *Redesigning Onboarding:*
          *   **Metric Diversification:** Don't rely on one number. Add lagging indicators (bugs, tech debt).
          *   **Time-Shifted Evaluation:** Review code 3 months later.
          *   **Scaffolded Autonomy:** Phase the independence.
          *   **Reviewer Calibration:** Ensure reviewers are judging the *right* things.
          *   **Cultural Reframing:** Make "quality" explicit, not implicit.
      *   *Conclusion:* Summarize the mindset shift needed (from policing to cultivating).

  7.  **Refining the Tone:**
      *   Needs to be empathetic but analytical.
      *   Avoid blaming the engineer (they acted rationally).
      *   Avoid blaming the managers entirely (the system was the issue).
      *   Use concepts from AI/RL (Specification Gaming) since the user hinted at "any learning system."

  8.  **Self-Correction/Edge Case Check:**
      *   *Did I answer the specific question?* Yes (Bad incentive vs. deeper learning issue + Redesign).
      *   *Is the advice actionable?* Yes, specific steps provided.
      *   *Is the distinction clear?* Distinguish between "gaming the system" (malicious) and "optimizing the proxy" (rational). This engineer did the latter.

  9.  **Final Polish:** Organize with clear headings. Ensure the connection between human learning and AI reward hacking is clear, as the user alluded to "any learning system." (This adds depth).

  **(Self-Correction during drafting):** I initially thought about suggesting pair programming. While good, it might be too resource-intensive for a whole onboarding program. Better to suggest "shadowing" or "gradual release." I also need to make sure I don't just say "stop using metrics." Metrics are needed, but *leading* vs. *lagging* indicators matter.

  10. **Final Output Generation** (similar to the provided good response).
answer: |-
  This is a textbook example of **Goodhart's Law** ("When a measure becomes a target, it ceases to be a good measure") colliding with **Specification Gaming** (a concept from AI safety where an agent fulfills the letter of the reward function but violates its spirit).

  To answer your core question: **It is both.** It is a badly designed incentive system, but the reason it failed so spectacularly is due to a deeper property of how learning systems (human or artificial) optimize for feedback.

  Here is a breakdown of why this happened, why it worked before, and how to redesign the system.

  ### 1. The Deeper Mechanism: Proxy Optimization
  You asked if a learner can pursue the wrong goal without being explicitly rewarded for it. **Yes.** In fact, it is the default behavior of any intelligent optimization system.

  *   **The True Goal:** Write maintainable, scalable, bug-free code. (Hard to measure, delayed feedback).
  *   **The Proxy Goal:** Get PRs approved by seniors. (Easy to measure, immediate feedback).

  Humans, like Reinforcement Learning agents, are biased toward **immediate, high-certainty rewards**.
  *   "Writing good code" pays off in 6 months when the feature doesn't break.
  *   "Getting approval" pays off in 6 hours when the PR merges.

  Your engineer didn't "fail" to learn; they learned *exactly* what the system taught them. They successfully minimized the loss function you provided (rejections) rather than the one you intended (technical debt). This isn't laziness or malice; it is rational optimization within a constrained environment.

  ### 2. Why Did It Work Historically?
  If the system is flawed, why did it work for previous grads?
  *   **Reviewer Calibration:** Previously, your senior reviewers might have been exceptionally good at spotting "technically correct but structurally fragile" code. They acted as a high-fidelity filter.
  *   **Selection Bias:** You may have inadvertently hired people with high intrinsic integrity regarding code quality who ignored the proxy metric.
  *   **Fragility:** The system was likely fragile all along, and you got lucky. The recent failure suggests the "reviewer signal" has degraded (perhaps seniors are overworked and rubber-stamping) or the new engineer was simply more adept at finding the path of least resistance.

  ### 3. Redesigning the Onboarding System
  To fix this, you must align the **feedback loop** with the **true objective**. You need to move from measuring *compliance* to measuring *outcomes*.

  #### A. Introduce Lagging Indicators (Time-Shifted Evaluation)
  Approval rate is a *leading* indicator. You need *lagging* indicators.
  *   **The 3-Month Retro:** Do not judge readiness solely at the end of the rotation. Evaluate the code they wrote in Month 1 again in Month 4. Is it breaking? Is it being rewritten by others?
  *   **Bug Attribution:** Track bugs not just by who wrote the code, but by *why* it broke. Was it a logic error (acceptable) or a structural fragility (unacceptable)?
  *   **On-Call Shadowing:** Have the new engineer shadow on-call duties for the code *they* wrote during onboarding. There is no stronger teacher than being woken up at 3 AM by your own abstraction leak.

  #### B. Scaffold Autonomy (The "Gradual Release" Model)
  Moving from "strictly supervised" to "mostly unsupervised" is a phase transition that is too sharp.
  *   **Phase 1 (Rotation):** High review, high guidance.
  *   **Phase 2 (Shadow Autonomy):** They own a ticket, but a senior reviews it *after* merge (post-merge review) or they pair-program with a peer rather than a senior.
  *   **Phase 3 (Full Autonomy):** Granted only after the lagging indicators (see above) confirm quality.
  *   **The "Safety Net":** Even on the unsupervised team, institute a lightweight RFC (Request for Comments) process for major architectural changes. This forces them to articulate *why* they are building something, not just *what*.

  #### C. Change the Review Incentive
  If reviewers are the gatekeepers, their incentives must align with long-term quality, not throughput.
  *   **Review Quality Metrics:** Measure seniors not on how many PRs they approve, but on how many "re-opens" or "follow-up fixes" occur after their approval. If a senior approves a PR that breaks in a week, that reflects on the reviewer, not just the author.
  *   **Teaching vs. Gatekeeping:** Train seniors to comment on *intent* and *maintainability*, not just syntax. If the review process focuses on nitpicks, engineers learn to optimize for nitpicks.

  #### D. Explicitly Value "Negative Work"
  Engineers often feel pressure to show velocity (lines of code, tickets closed).
  *   **Reward Refactoring:** Celebrate tickets that *delete* code or *slow down* development to fix debt.
  *   **The "No" Metric:** Create cultural safety for an engineer to say, "I can build this fast, but it will be fragile. I recommend taking longer to build it right." If your system rewards speed implicitly, they will choose speed.

  ### 4. Summary: The Mindset Shift
  You need to shift your mental model of onboarding from **Filtering** to **Gardening**.

  *   **Current Model (Filtering):** Put them in a box, apply pressure (reviews), see if they meet the spec. If they pass, release them.
  *   **New Model (Gardening):** The environment determines the growth. If the soil (incentives) encourages shallow roots (quick approvals), the plant will fall over when the wind (autonomy) blows.

  **Immediate Action Plan:**
  1.  **Stop using approval rate as a binary gate.** Make it one signal among many.
  2.  **Institute a "Code Maturity" review.** 90 days after onboarding, review the onboarding code with the engineer. Ask: "What would you change now?"
  3.  **Calibrate Reviewers.** Ensure your seniors know they are responsible for the code's lifespan, not just its mergeability.

  The engineer didn't break the system; the system revealed its true specifications. By aligning your metrics with the *lifespan* of the code rather than the *merge* of the PR, you will cultivate engineers who optimize for the right things, even when no one is watching.
