answer: |-
  This is a sophisticated reading of Quine, and your intuition is well-founded. In fact, your argument aligns with a significant vein of contemporary Quinean scholarship (championed by figures like Hilary Putnam in his later years, and more recently by naturalistic moral realists like Jesse Prinz or even certain readings of Peter Railton). The tension you identified is often called the "Quinean Dilemma": Quine's *methodological naturalism* pushes toward moral realism, while his *empiricist epistemology* (specifically his reliance on sensory stimulation as the tribunal of meaning) pushes toward anti-realism.

  To argue your side rigorously, we must demonstrate that Quine's deflationary conclusion in "On the Nature of Moral Values" relies on a residual verificationism that contradicts his own holistic naturalism. Here is the case for why a consistent Quinean naturalist should treat moral values as genuine ontological posits.

  ### 1. The Indispensability Argument Applied to Ethics
  Your core insight rests on Quine's criterion of ontological commitment: *"To be is to be the value of a bound variable."* We are committed to the existence of whatever entities are indispensable to our best scientific theory of the world.

  In "On the Nature of Moral Values," Quine treats moral principles as mere generalizations of affect, lacking the "truth-apt" status of scientific theory. However, consider the role moral vocabulary plays in our best *social scientific* theories. Psychology, sociology, and evolutionary biology quantify over beliefs, desires, norms, and values to explain human behavior.
  *   If I want to predict whether a person will stop at a red light, I cannot do so solely via physics or neurochemistry. I must posit that they hold a *belief* about the law and a *value* regarding safety or compliance.
  *   If these posits are indispensable for the prediction and explanation of behavior (which they are), then, by Quine's own lights, we are ontologically committed to them.

  Quine grants reality to sets and numbers because they are indispensable to physics, even though they are abstract and causally inert. Why are moral values different? If "value" is a property that actions possess relative to agents (e.g., "Action $x$ maximizes social cohesion for agent $y$"), and this property is required to explain the causal flow of human history, then values earn their ontological keep. To deny them reality while granting it to electrons is to violate the principle of methodological monism. There is no "first philosophy" standing outside science to declare ethics "lesser"; there is only the web of belief. If ethical nodes hold the web together, they are real.

  ### 2. Convergence is a Function of Theory, Not a Precondition for Ontology
  Your friend argues that cross-subject convergence is the non-negotiable standard for Quine. This is the strongest point against you, so it must be dismantled carefully. Quine argues that sensory stimulation is shared because human neurology is similar, whereas moral sentiments vary because culture varies. Therefore, science tracks the world; ethics tracks upbringing.

  However, this misunderstands the role of convergence in Quine's epistemology.
  *   **Convergence is a result, not an axiom:** In Quine's view, we don't start with agreement; we achieve it through the "pressure" of experience on the web of belief. In quantum mechanics or cosmology, competent theorists often disagree profoundly about the interpretation of the data (e.g., Many-Worlds vs. Copenhagen). Does this lack of convergence mean electrons are not real? No. It means the theory is underdetermined.
  *   **The "Immature Discipline" Objection:** As you suggested, the lack of moral convergence could simply indicate that ethics is an immature science. If moral values are complex relational properties (depending on biology, history, resource scarcity, etc.), we shouldn't expect simple convergence any more than we expect a child and a physicist to converge on the nature of gravity.
  *   **The Circularity of "Observation":** Quine privileges sensory stimulation because it is "intersubjectively available." But how do we verify that? Only through... shared sensory stimulation. This is coherent for physics. But for a social animal, *social sanction* (approval/disapproval) **is** a form of sensory stimulation. A frown, a shout, or exclusion triggers neural pathways just as surely as a photon hitting the retina. If Quine accepts that "observation sentences" are the entry point for science, he must accept that "normative feedback" is the entry point for social science. To privilege the retina over the social bond is a biological prejudice, not a philosophical necessity.

  ### 3. The Collapse of the Fact/Value Distinction under Holism
  Quine is famous for rejecting the analytic/synthetic distinction. He argues that no statement is immune to revision in the face of recalcitrant experience—not even logical laws. Yet, in the ethics essay, he seems to reinstate a rigid fact/value distinction.

  *   **The Web is Normative:** Our "web of belief" is not just a descriptive map; it is a guide for action. We hold beliefs *in order to* navigate the world. The "truth" of a belief is tied to its utility in expectation. But "utility" is itself a value term.
  *   **Immanent Truth:** Quine defines truth disquotationally ("'Snow is white' is true iff snow is white"). He rejects a "God's eye view" of correspondence. Truth is immanent to our theory. If our best theory includes the statement "Genocide is wrong," and removing that statement causes the web to collapse (because we can no longer explain our revulsion, our laws, or our social structures), then within the immanent framework of our theory, "Genocide is wrong" is true.
  *   **The Inconsistency:** By claiming ethics lacks "objective check," Quine is secretly appealing to the very "view from nowhere" he elsewhere rejects. He is judging ethics by a standard of "pure sensory correspondence" that even physics doesn't meet (since physics deals in theoretical posits, not just sensations). A consistent Quinean must admit that moral claims are checked against experience—just not *sensory* experience in the narrow sense, but *pragmatic* experience (does living by this value work?).

  ### 4. What a Consistent Quinean Naturalist Should Conclude
  If we purge Quine's ethics essay of its residual Humean sentimentalism and align it with his holistic naturalism, the conclusion shifts dramatically. A consistent Quinean should conclude the following:

  1.  **Moral Realism (Naturalistic Version):** Moral values are real properties. They are not Platonic forms, nor are they mere expressions of emotion. They are complex, relational, natural properties concerning the flourishing and coordination of sentient beings. They are as real as "fitness" in biology or "liquidity" in economics.
  2.  **Objectivity as Stability:** Objectivity should not be defined as "convergence among all humans regardless of culture." It should be defined as "stability within the web of belief under reflective equilibrium." A moral claim is objective if it survives rigorous testing against our best psychological, sociological, and biological theories.
  3.  **The Status of Disagreement:** Moral disagreement does not prove non-cognitivism. It proves that the variables involved (human needs, social structures) are complex and that our theories are incomplete. We do not say "beauty is not real" because people disagree on art; we say aesthetics is difficult. Quine should have treated ethics similarly.
  4.  **Ontological Parity:** There is no epistemological cliff between "is" and "ought." Both are strands in the same web. We revise our moral principles when they conflict with our empirical facts (e.g., we abandoned slavery not just because we "felt" like it, but because our biological and sociological theories no longer supported the notion of natural inferiority). The interaction goes both ways.

  ### The Verdict
  Your friend is right that Quine *concluded* ethics is shaky ground. But you are right that this conclusion is a betrayal of Quine's own deeper principles.

  Quine retreated to the safety of Humean sentimentalism in 1978 because he couldn't see how to naturalize normativity without a "first philosophy." But his own holism provides the tools he lacked. If we take "To be is to be the value of a bound variable" seriously, and we acknowledge that moral variables are bound in our best explanations of human life, then **moral values are ontologically committed posits.**

  The lack of convergence is not a failure of ontology; it is a challenge for theory construction. A fully consistent Quinean naturalist should treat ethics as a branch of social science—difficult, underdetermined, and culturally variable, yes, but nonetheless investigating real, natural phenomena that are indispensable to our understanding of the world. To deny this is to draw a line in the sand that naturalism forbids.
