      *   **Sam's Move 1:** PoI is empty because it doesn't specify the *space* over which to be indifferent.
          *   *Validity:* Strong. This is the standard critique of PoI (Keynes, etc.). Parameterization matters.

      *   **Theo's Move 1:** Jaynes' invariance (rotation, translation, scaling) narrows it to one answer.
          *   *Validity:* Strong. Jaynes' *Probability Theory: The Logic of Science* specifically addresses this. He argues for the $1/2$ solution based on maximum entropy/invariance.

      *   **Sam's Move 2:** Rotation invariance is satisfied by *all three* methods, so it doesn't break the tie. Adding more invariance is smuggling in assumptions.
          *   *Validity:* Partially correct, partially incorrect. All three are rotationally invariant *about the center*. But Jaynes requires *translation* invariance (shifting the circle) and *scaling* invariance (changing size). The classic 1/3 and 1/4 methods fail translation/scaling invariance if viewed as physical processes over a plane.
          *   *Nuance:* Sam is right that you have to *choose* the invariance group, but Jaynes argues the group is dictated by the problem statement's lack of information.

      *   **Theo's Move 2:** Physical intuition (tossing a straw) justifies the invariance. It's about the *process*, not just the geometry.
