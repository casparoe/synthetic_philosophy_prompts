      *   *Did I address the "Reasonable to do" question?* Yes, this is the "Norm of Assertion/Action" debate. Even if knowledge is invariant, the *threshold for acting* might vary.
      *   *Is the pre-law roommate's argument sound?* It sounds like Pragmatic Encroachment. I should label it as such.

  7.  **Final Polish:** Organize with clear headings. Ensure the connection to the "Bank Case" is explicit, as that will be high-value for a seminar student. (The scenario is almost identical to Keith DeRose's Bank Cases).

  **(Self-Correction during drafting):** I should make sure not to just dump theory but answer the specific questions: "Is Jonah correct they are contradicting?" "Is 'reasonable to do' separate?"
  *   *Contradiction:* Under Invariantism, yes. Under SSI/Contextualism, no.
  *   *Separate:* Yes, one can argue knowledge is one thing, rational action is another (the "Warranted Assertability" move).

