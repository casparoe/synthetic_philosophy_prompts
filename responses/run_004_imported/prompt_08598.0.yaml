      *   Ending: Elias walks away. He can't interact with a void, no matter how human-shaped.

      *Critique:* That's too cold. Let's make it more poignant. Elias *wants* it to mean something. He tries to *bootstrap* the history. "I will be your history." But the theory says natural selection, not social construction.
