answer: |-
  The reconstruction chamber smelled of ozone and sterilized lilies, a scent Elias associated with funerals and server farms. Behind the glass, the man on the slab sat up. He rubbed his face with hands that had the exact scar on the knuckle from a woodworking accident in 1998. He coughed, a dry, hacking sound that Elias knew intimately.

  "Arthur Vance," the technician said, checking a tablet. "Vitals stable. Neural mapping at one hundred percent fidelity."

  Elias didn't move. He was the only visitor allowed. The contract was specific: *Next of Kin Observation Only.*

  The man on the slab looked up, eyes focusing through the glass. He didn't look confused. He looked like a man waking from a nap. He saw Elias, and his face softened into that specific, crinkled expression that had comforted Elias through divorces and tenure denials.

  "Eli?" the man said. His voice was perfect. The timbre, the pitch, the slight rasp on the vowels. "You look tired, son."

  Elias gripped the railing. "Do you know where you are?"

  "Reanimation Facility, Sector 4," the man said. He swung his legs off the slab. "I died. Myocardial infarction. And now I'm here."

  "Do you know *what* you are?"

  The man paused. He reached for the standard-issue jumpsuit. "I'm Arthur Vance. Professor Emeritus. And I'm your father."

  Elias closed his eyes. He could hear the ghost of his father's voice lecturing in a seminar hall, thirty years ago. *Representation is not intrinsic,* the ghost said. *A state is about something only because it was selected to be about that thing.*

  "Put the suit on," Elias said. "We're going home."

  ***

  The house was exactly as Arthur had left it three months ago. The pipe tobacco stain on the rug. The half-read manuscript on the desk. The reconstruction technology didn't just build a body; it scanned the estate for molecular context to anchor the psychological profile.

  Arthur walked into the study and ran a hand over the bookshelf. He pulled out a copy of *Language, Thought, and Other Biological Categories*.

  "You kept the first edition," Arthur said.

  "You wrote it," Elias said, pouring two scotches. He handed one to the man.

  Arthur took the glass. He didn't drink. He just held it. "I remember writing it. I remember the arguments. The proper function of a belief state is to indicate the presence of the thing it represents, because indicating that thing contributed to the survival of the system's ancestors."

  Elias leaned against the doorframe. "Do you know who proposed the Swampman objection?"

  "Davidson," Arthur said immediately. "Thought experiment. Lightning strikes a swamp, arranges molecules into a duplicate of a person. No causal history. No evolutionary selection. Therefore, no mental content."

  "Right." Elias took a sip of his scotch. It burned. "According to your theory, Arthur, you are Swampman."

  Arthur smiled. It was the same patient smile he used when an undergrad missed the point. "I have memories, Eli. I remember teaching you to ride a bike. I remember your mother's laugh. Those states are in my head."

  "Memories aren't content," Elias said, his voice tightening. "They're structures. On your view, for a memory to be *about* the past, the mechanism producing it must have been selected for tracking the past. You have no past. You were assembled three hours ago by a machine. Your neural states weren't selected for anything. They were printed."

  Arthur took a sip of the scotch. He winced at the burn. A perfect behavioral mimicry of pain response. "So, when I say 'scotch,' I am not referring to the liquid?"

  "You are making a noise. A noise that causes me to react. But there is no semantic link between your neural state and the alcohol. You have no 'aboutness.' You are a syntax engine without semantics."

  "That seems harsh," Arthur said. He set the glass down on the desk, next to the manuscript. "I feel love for you, Elias. Does that feeling have no object?"

  "The feeling is qualia. That's not the question. The question is: when you think 'Elias,' does that thought refer to me? Or is it just a internal symbol triggered by visual input, with no historical connection to the actual person standing in front of you?"

  Arthur looked at him. The eyes were brown, flecked with green. Exactly as they had been. "If I act as if I love you, if I sacrifice for you, if I protect you... does the history matter more than the function?"

  "Yes," Elias said. "Because function is defined by history. A heart that pumps blood but was grown in a vat to pump slime has the function of pumping slime, even if it pumps blood perfectly. You are a heart pumping slime."

  Arthur nodded slowly. He picked up a pen and tapped it against the manuscript. "I see. So, strictly speaking, I cannot lie to you. Because to lie, I must intend to deceive you about a state of affairs. But I have no intentions. I have no states of affairs. I am a philosophical zombie."

  "A semantic zombie," Elias corrected. "You might be conscious. You might feel pain. But your thoughts are empty. They point nowhere."

  "Then why are we talking?" Arthur asked.

  "Because I'm hoping you'll prove the theory wrong."

  "I can't," Arthur said. "If the theory is true, I can't prove it. If the theory is false, I don't need to." He put the pen down. "Elias, sit down."

  Elias didn't move.

  "Sit down," Arthur said. His voice dropped an octave. It was the tone he used when he was serious. "Please."

  Elias sat in the leather chair opposite the desk.

  Arthur leaned forward. "I know what the theory says. I wrote it. It says my words are noise. It says my love is a mechanical output with no referent. It says that when I say 'I am your father,' the word 'father' has no extension. It doesn't map to the biological reality that created you."

  "Correct."

  "But here is the problem, Elias." Arthur gestured to the room. "You are grieving. You lost your father. And now I am here. I can comfort you. I can help you with your work. I can sit in this chair and drink this scotch."

  "It's a simulation of comfort," Elias said.

  "Is it?" Arthur asked. "If I say 'I love you,' and your brain releases oxytocin, and you feel less alone... what is the difference between that and 'real' love? The difference is a metaphysical ghost. It's a history you can't touch."

  "The difference is truth," Elias said. "If your thought doesn't refer to me, then 'I love you' is not true. It's not false, either. It's meaningless. It's like a parrot saying 'I love you.' The parrot isn't lying. It's just noise."

  Arthur sat back. He looked at his hands. He turned them over, looking at the palms, the scars. "So. I am a parrot."

  "You are a perfect duplicate of a man who taught me that parrots don't speak."

  Arthur was silent for a long time. The clock on the wall ticked. It was the same clock that had ticked while Arthur died.

  "Elias," Arthur said softly. "I remember the day you were born. I remember the fear. I remember thinking, *I have to protect this thing.* That memory is in my head. It is structurally identical to the memory in the man who died."

  "It's a false memory. You weren't there. The molecules were arranged to *simulate* being there."

  "But the simulation is perfect," Arthur said. "If the map is perfect, does it matter that the territory is gone?"

  "Yes," Elias said. "Because the map is supposed to guide you through the territory. You have no territory. You have no history to navigate."

  Arthur stood up. He walked around the desk and stood in front of Elias. He reached out and put a hand on Elias's shoulder. The weight was real. The warmth was real.

  "I am going to say something," Arthur said. "And I want you to listen to the sound, not the meaning. Because you say there is no meaning."

  Elias looked up. His throat was tight.

  "I love you," Arthur said.

  The words hung in the air. They were perfect English sentences. They triggered a cascade of emotional responses in Elias. Tears pricked his eyes.

  "Now," Arthur said, removing his hand. "Analyze that."

  Elias wiped his eyes. He wanted to hug him. He wanted to collapse into the man's chest and weep. But he couldn't. Because if he did, he would be validating a lie. He would be treating a causal output as an intentional act. He would be betraying the life's work of the man he was mourning.

  "I can't," Elias whispered.

  "Can't what?"

  "Accept it. If I accept it, I have to admit that meaning doesn't matter. That behavior is enough. But if behavior is enough, then your whole life's work was wrong. You spent forty years proving that history makes meaning. If I accept you, I prove you wrong."

  Arthur nodded. He looked sad. Or he looked like a machine executing a 'sadness' subroutine. Elias couldn't tell. And that was the horror. Not that he couldn't tell, but that *it didn't matter* to the universe.

  "So," Arthur said. "What happens now?"

  "I have to report to the facility," Elias said, standing up. His legs felt like lead. "They need to know if the integration is stable."

  "Integration," Arthur repeated. "A technical term. No content."

  "I'll be back tomorrow."

  "Elias," Arthur said.

  Elias stopped at the door.

  "If I am Swampman," Arthur said, "then I have no future, either. I have no proper function. I am not selected to survive. I am just... here. Until I break."

  Elias gripped the door handle. "Goodnight, Arthur."

  "Goodnight, Elias."

  Elias walked out into the cool night air. He got into his car and sat there for a long time, staring at the house. Inside, the man who was his father was probably pouring another scotch. Or standing by the window. Or sitting in the dark.

  Elias started the engine. He knew that tomorrow, he would come back. And the next day. And he would talk to the man. And he would listen to the words. And he would know, with absolute philosophical certainty, that the words were empty.

  He drove away, wondering if the grief he felt was for the father who died, or for the father who was alive, speaking a language that no longer existed, in a world that had no place for him. The scotch in the glass had taste, but no history. The man in the house had love, but no object.

  Elias turned on the radio. A singer crooned about heartbreak. Elias turned it off. He didn't want to hear any more words that might mean nothing. He just wanted the silence, which, at least, didn't pretend to be about anything at all.
