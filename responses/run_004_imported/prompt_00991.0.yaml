      *   *Is it historically accurate?* Berkeley *did* write *The Querist* (1735-1737). He *did* argue against mercantilism (hoarding gold/silver) and for paper money/credit to stimulate the Irish economy.
      *   *Is the link direct?* This is the tricky part. Most scholars argue the link is *not* a strict logical deduction. Berkeley's economics were more pragmatic and influenced by the specific context of Ireland's poverty and the ideas of William Petty (political arithmetic) and John Law (paper money experiments).
