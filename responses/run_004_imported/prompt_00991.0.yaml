      *   *Is the connection "obvious"?* Many philosophers argue it's *not* obvious. Immaterialism is about ontology (what exists). Economics is about social utility and exchange. One can be an immaterialist and believe gold is the best medium of exchange (because people *perceive* it as valuable). One can be a materialist and believe in fiat currency. The link isn't logically necessary.

