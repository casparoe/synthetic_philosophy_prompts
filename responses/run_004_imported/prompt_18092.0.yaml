      *   *Causal Goodhart:* The measure is correlated with the goal, but not causally upstream. Manipulating the measure doesn't change the goal. (Proxy vs. True Objective).
      *   *Extremal Goodhart:* The relationship between measure and goal holds in the normal range but breaks down in extreme tails (distributional shift).
