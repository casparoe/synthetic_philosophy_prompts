          *   *Idea:* Compare "I do" to a mathematical function.
          *   *Joke:* "I promise to love you... plus." But what if I meant "quus"? I love you until you get the flu, then I stop.
      *   **The Turn (The Skeptical Solution):** Move from the joke to the serious point. If private feelings don't fix the meaning, what does?
      *   **The Application (Marriage):** The community in the room. The act of checking in. The work of interpretation.
      *   **The Conclusion:** A wish for the future. A toast.

  4.  **Refining the Tone:**
      *   *Risk:* Sounding too academic.
      *   *Fix:* Use metaphors. Instead of "dispositional states," use "feelings in the moment." Instead of "normative endorsement," use "holding each other accountable."
      *   *Risk:* Alienating the non-philosophers.
      *   *Fix:* Explain the "quus" joke in a way that makes sense even if they don't know the term. "A rule that looks the same now but changes later."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. I'm the sibling. Sister is smart. Met fiancé in grad school. Kripke says we can't know what words mean forever. Like "love." Maybe you mean "love until 2030." That's the joke. But Kripke also says community fixes meaning. So, we are here to fix the meaning of your marriage. We will watch you. Love is a practice. Cheers.

      *Critique 1:* Too dry. Needs more warmth. The "We will watch you" sounds threatening. Needs to be supportive.

  6.  **Drafting - Iteration 2 (Fleshing out the Philosophy):**
      Start with the anxiety of the vow. "Till death do us part." That's a long time. How do you know what you mean by that today? Kripke's paradox: No fact inside your head locks in the future. You might think you mean "love through cancer," but maybe you really mean "love until cancer."
      *The Joke:* Let's call it "Schmove." I promise to schmove you. Looks like love, but stops when things get hard.
      *The Solution:* It's not about the feeling at the altar. It's about the community. We are the witnesses. We help you interpret the vow. Marriage is a dialogue, not a decree.

      *Critique 2:* Better. "Schmove" is a bit too technical. Stick to the "plus/quus" structure but explain it narratively. Make sure the transition from joke to heart is smooth.

  7.  **Drafting - Iteration 3 (Writing the Speech):**
      *   *Greeting:* Warm, acknowledge the sister.
      *   *The Phil Hook:* Mention the PhD. Acknowledge the philosophers in the room.
      *   *The Paradox:* Explain the "rule-following" worry simply. When you say "I do," how do we know what rule you're following?
      *   *The Joke:* The "Quus" vow. "I promise to love you... unless you snore."
      *   *The Pivot:* But here's the beautiful part. Kripke says meaning comes from *us*.
      *   *The Heart:* Marriage is a public practice. It's not a one-time mental lock. It's 50 years of saying "This is what I meant."
      *   *Closing:* Raise a glass.

  8.  **Polishing and Timing:**
