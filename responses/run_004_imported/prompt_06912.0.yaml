answer: |-
  Good evening, everyone. For those who don't know me, I'm the younger sibling. I've had the privilege of watching [Sister's Name] be brilliant, stubborn, and incredibly kind for my entire life. And watching her find someone who matches her in all three of those categories has been a gift to our whole family.

  Now, because [Sister's Name] spent the last several years getting a PhD in philosophy, and because she met [Partner's Name] in the grad school trenches, about a third of you are probably bracing yourselves. You're waiting for the inside joke. You're waiting for the reference to the literature.

  I promise to keep this brief. But I also think there is something genuinely beautiful hidden in the very dense, very confusing philosophy [Sister's Name] loves. Specifically, a philosopher named Saul Kripke.

  Kripke wrote about a problem with rules. He asked: How do I know that when I say I'm following a rule—like adding numbers—I'm not actually following a different rule that just *looks* the same for now? He called this deviant function "quus." It works like "plus" for all the numbers you've used before, but after a certain point, the answer changes.

  And I started thinking: A wedding vow is the ultimate rule. "I promise to love you... till death do us part."

  But how do you lock that meaning in? Today, you feel certain. But feelings are private. A skeptic could ask: "How do you know you don't actually mean 'quove'? I promise to love you *quus* the way I love you now... until the first time you get the flu without making me chicken soup, or until we disagree on a paint color, at which point the function changes and the love stops?"

  (Laughter)

  It's a silly thought. But it points to a real anxiety. We are promising to navigate fifty years of circumstances we cannot currently foresee. No fact inside your head today can guarantee what that promise means in twenty years. You can't mentally pre-compute every future scenario.

  But here is where Kripke offers what he calls a "skeptical solution." And I think it's actually the perfect description of a marriage.

  Kripke says that if private feelings can't secure the meaning of a rule, then *community* must. Meaning isn't a lock you click shut in your mind; it's a practice you build with other people. We know what "adding" is because we check each other's work. We correct each other. We agree on what counts as following the rule.

  And that is exactly what this room is for.

  [Sister's Name] and [Partner's Name], you cannot secure this vow alone. You don't need to try to freeze this moment in amber. You don't need to know exactly what "till death do us part" looks like in 2054.

  What secures the promise is not a magical feeling you have right now. What secures it is the fact that we are all here to witness it. And what sustains it will be the work you do together, year after year, of interpreting that vow.

  There will be times when the rule feels unclear. When you have to ask, "Does 'love' mean stepping back right now? Does 'honor' mean speaking up?" And you will answer those questions not by looking inward for a static fact, but by looking at each other, and by looking at the community that supports you. You will correct each other. You will endorse each other. You will build the meaning of this marriage through the practice of living it.

  The philosophers in the room know that Kripke's paradox is usually seen as a problem. But for a wedding, I think it's a relief. It means you don't have to be perfect prophets. You don't have to know the future. You just have to commit to the practice.

  Meaning is not something you *have*. It's something you *do*. And love is the same.

  So, if everyone could please raise a glass.

  To [Sister's Name] and [Partner's Name]. May your "plus" always be "plus." May you never find a quus in your future. And may you always find, in each other and in this community, the support you need to keep following the rule, together, for the rest of your lives.

  To the happy couple!
