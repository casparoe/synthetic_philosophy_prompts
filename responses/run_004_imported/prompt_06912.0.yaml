      *   **Core Task:** Write a 5-minute toast.
      *   **Key Constraint 1 (The Joke):** Must include a "quus"-style joke about deviant rule-following applied to wedding vows.
      *   **Key Constraint 2 (The Point):** Cannot just be a joke. Must use Kripke's *skeptical solution* (community practice, correction, endorsement) to make a genuine, moving point about marriage (securing promises across unforeseen circumstances).
      *   **Tone:** Warm, not lecture-like, accessible to non-philosophers but resonant for philosophers.
      *   **Length:** About 5 minutes spoken (roughly 600-800 words).

  2.  **Deconstruct the Philosophical Concepts:**
      *   *The Paradox:* No internal fact (mental state, disposition) fixes meaning. I could mean "plus" or "quus" (add until 57, then 5).
      *   *Application to Vows:* "I promise to love you." What does "love" mean? What does "promise" mean? Does it cover getting sick? Getting old? Getting annoying? A skeptic could say, "You meant 'love' only until the first big fight."
      *   *The Skeptical Solution:* Meaning isn't private; it's public. It's established by community norms, correction, and ongoing practice. We agree on what counts as following the rule.
      *   *Application to Marriage:* Marriage isn't secured by a magical mental state at the altar. It's secured by the community witnessing it and the couple *continually* negotiating and affirming what the vow means through action over time.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role (sibling), express love, acknowledge the mixed audience (philosophers vs. everyone else). Keep it light.
