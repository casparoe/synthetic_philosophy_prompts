answer: |-
  This is a really sharp observation. You've spotted a structural similarity that definitely isn't a coincidence, and it's tempting to think, "Yeah, Kant already drew this line between duty and prudence, so why are modern metaethicists acting like they discovered a new continent?"

  But the short answer is: **Kant solved a problem about *agents*, while the Wrong Kind of Reasons (WKR) problem is about *definitions*.**

  Here's the breakdown of why Kant's shopkeeper doesn't patch this bug in Scanlon's code.

  ### 1. Different Projects: Moral Worth vs. The Definition of Value
  Kant's shopkeeper example is in **Normative Ethics**. He is trying to determine what gives an *action* moral worth.
  *   **Shopkeeper A:** Charges fair prices because it's his duty. (Has moral worth)
  *   **Shopkeeper B:** Charges fair prices because it's good for business. (No moral worth)

  Crucially, Kant agrees that **both shopkeepers are doing the right thing.** The action is correct in both cases. Kant is just grading the *soul* of the shopkeeper.

  The Buck-Passing Account (BPA) and the WKR problem are in **Metaethics**. They are trying to define what the word **"good"** (or "admirable," "funny," "valuable") *means*.
  *   **The BPA Claim:** To say $X$ is good *just means* there are reasons to have a pro-attitude toward $X$.
  *   **The WKR Challenge:** If that definition is true, then *any* reason to have a pro-attitude makes $X$ good.

  ### 2. The Demon Case (Where Kant Can't Help)
  The classic WKR example isn't a shopkeeper; it's the **Evil Demon**.
  *   **Scenario:** An evil demon threatens to torture you unless you **admire** him.
  *   **The Reason:** You now have a massive, overriding reason to admire him (self-preservation).
  *   **The BPA Implication:** If "Good = Reasons to favor," then the demon is **admirable**.
  *   **The Intuition:** No, he's not. He's still a jerk. You have a reason to admire him, but he lacks the property of *admirability*.

  Kant's solution doesn't work here because Kant would say, "Admiring the demon out of fear has no moral worth." Sure. But the WKR problem isn't asking about your moral worth. It's asking: **Does the demon possess the property of being admirable?**

  If Scanlon's definition holds, the answer must be **Yes** (because there are reasons to admire him).
  If our intuition holds, the answer is **No**.

  Therefore, the definition ("Good = Reasons") is broken. It counts pragmatic reasons (fear) as evidence for an intrinsic property (admirability), which is a category error.

  ### 3. The Circularity Trap
  This is why it's still an "open bug." To fix the Buck-Passing Account, you need to add a clause that says:
  > "$X$ is good if there are reasons to favor $X$... **but only the *right kind* of reasons.**"

  But how do you define "the right kind of reasons" without already using the concept of value?
  *   If you say, "The right kind of reasons are those that track the **goodness** of the object," you've made your definition circular. (Value = Reasons to value things that are Valuable).
  *   If you say, "The right kind of reasons are **moral** reasons," you've narrowed value too much (a good joke isn't morally good, it's funny).
  *   If you say, "The right kind of reasons are **object-given** (about the object) rather than **state-given** (about the consequences of having the attitude)," you run into technical problems distinguishing the two without smuggling value back in.

  Kant didn't face this trap because he wasn't trying to *define* "good" in terms of reasons. He took "good" (in the moral sense) as grounded in rationality and the Categorical Imperative. He was distinguishing motivations, not defining properties.

  ### 4. Why Metaethicists Are Obsessed With It
  If this were just about "don't be a pragmatist," nobody would care. But this problem threatens **Reductive Naturalism**.

  Many metaethicists want to reduce "value" to something non-spooky, like "reasons." It naturalizes ethics. But the WKR problem shows that "reasons" are too broad. They include threats, bribes, and pragmatic necessities.
  *   **The Bribe:** I pay you $1 million to believe the earth is flat. You now have a reason to believe it. Does that make the proposition "The earth is flat" **worthy of belief**? No.
  *   **The WKR Point:** Reasons for *holding* an attitude don't necessarily make the *object* of the attitude fit that attitude.

  ### Summary
  Kant solved the problem of **when an agent is praiseworthy.**
  The WKR problem is about **when an object is valuable.**

  You can have a reason to admire a demon (fear) without the demon being admirable. Kant would agree you shouldn't admire him, but he wouldn't use that to fix a definition of "admirability." Metaethicists are still stuck trying to filter the "right" reasons from the "wrong" reasons without secretly assuming the answer they're trying to prove.

  So, you didn't miss a solution from 1785; you just spotted that everyone is trying to solve a logic puzzle that Kant wasn't playing.
