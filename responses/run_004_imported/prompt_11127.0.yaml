answer: |-
  This is a fascinating and highly relevant application of the literature you are studying. However, based on the standard interpretations of R. Jay Wallace, G.A. Cohen, and the broader "standing to blame" debate, **your friend's argument relies on a crucial philosophical misunderstanding.**

  While you are correct that the literature converges on the claim that hypocrites forfeit the *standing* to blame, it generally does **not** support the claim that hypocrisy renders the underlying accusation *false* or *baseless*.

  Here is a breakdown of why you should not treat a critic's hypocrisy as evidence that their accusation was mistaken, and how to distinguish between undermining the *critic* and undermining the *criticism*.

  ### 1. Standing vs. Truth-Conditions
  The central insight of the Wallace/Cohen literature is the distinction between the **normative status of the act** and the **normative status of the agent addressing the act.**

  *   **Wallace's View:** In "Hypocrisy, Moral Address, and the Equal Standing of Persons," Wallace argues that hypocrisy is a failure of *moral address*. When a hypocrite blames someone, they violate the requirement of equal standing because they implicitly exempt themselves from the norms they are enforcing. This makes the *act of blaming* inappropriate (infelicitous), but it does not change the moral facts regarding the target's behavior.
  *   **The Implication:** If a thief says, "Stealing is wrong," while actively stealing, the thief is a hypocrite. They lack the standing to morally rebuke others for stealing. However, their hypocrisy does not make stealing *right*. The truth of the proposition "Stealing is wrong" is independent of the speaker's compliance.

  Therefore, when you say the charge "effectively collapses," you are conflating the **validity of the speech act** (blaming) with the **truth of the proposition** (the act was wrong). The literature suggests the speech act is invalidated, but the proposition remains true.

  ### 2. The *Tu Quoque* Fallacy
  Your friend's argument—that the council member's hypocrisy proves tax avoidance is *not* wrong—is a sophisticated version of the **_tu quoque_ (you also) fallacy**.

  *   **The Fallacy:** Arguing that a position is false because the person advocating it behaves inconsistently with it.
  *   **Why it fails here:** The council member's behavior (using shell companies) is evidence of her own moral failure, not evidence against the moral principle she campaigned on. In fact, her attempt to hide her income suggests she *believes* the behavior is wrong (or at least politically damaging), which reinforces the norm rather than disproving it.

  If we accepted your friend's reasoning, no moral reformer who had ever committed the sin they sought to eradicate could offer valid criticism. A recovering addict could never argue that drug use is harmful; a reformed criminal could never argue for law and order. The literature on standing protects the *norm* even when the *messenger* is flawed.

  ### 3. When Hypocrisy *Does* Matter for Substance
  While hypocrisy generally doesn't prove an accusation false, there are nuanced contexts where it is relevant to the substance, though not in the way your friend suggests:

  *   **Sincerity as a Premise:** If the criticism relies on the claim "I am morally superior to you," then hypocrisy directly falsifies the claim. But most moral criticism relies on "This act is wrong," not "I am better than you."
  *   **Feasibility of Norms:** If a critic demands a standard that is impossible to follow (and they fail to follow it), their hypocrisy might suggest the norm is too demanding. However, tax avoidance is not typically considered impossible to avoid; it is a choice.
  *   **Political Legitimacy (Cohen's Point):** G.A. Cohen focuses on how hypocrisy undermines the *political legitimacy* of the condemnation. If Western governments condemn terrorists while committing similar acts, they lose the *authority* to lead the moral charge. This makes the condemnation politically ineffective or unjust, but it doesn't mean terrorism is morally permissible.

  ### 4. How to Generalize This for Your Seminar
  To answer your specific question: **No, you should not treat a critic's hypocrisy as evidence that their underlying accusation was mistaken.**

  Pointing out hypocrisy is a legitimate way to rebut the **authority** of the critic (their standing), but it is **not** a legitimate way to rebut the **substance** of their criticism (the truth of the claim).

  *   **Valid Argument:** "Council Member X cannot legitimately condemn tax avoidance because she engages in it herself; therefore, her moral rebuke is void." (This targets *standing*.)
  *   **Invalid Argument:** "Council Member X engages in tax avoidance; therefore, tax avoidance is not wrong." (This targets *truth* via *ad hominem*.)

  ### Conclusion for Your Discussion
  In your seminar, you can clarify the convergence of Wallace and Cohen by noting that they defend the **objectivity of moral norms** against the **subjectivity of the blamer.**

  The "collapse" you described applies to the **relationship** between the blamer and the blamed (the standing is severed), not to the **moral reality** of the offense. In the case of the city council member, her hypocrisy disqualifies her from leading the charge, but it leaves the moral and legal wrongness of corporate tax avoidance entirely intact. If anything, her hypocrisy confirms the power of the norm she violated: she felt compelled to hide her actions precisely because she knew the accusation against such behavior was valid.
