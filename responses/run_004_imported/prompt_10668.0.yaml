prompt: |-
  I write about science and the ideas that shape it, and lately much of that work has meant covering the replication crisis in psychology. Partly on the strength of a piece I wrote on p-hacking and the preregistration movement, a psychology department recently invited me onto its newly formed Open Science Committee as the outside, non-specialist member. The committee has just run into its first genuinely hard case, and both factions have asked me to draft the memo, since neither entirely trusts the other to state its opponent's position fairly.

  Two years ago the department pre-registered a well-powered Registered Report attempting to replicate a well-known ego-depletion effect, committing in the Stage 1 protocol to a one-tailed t-test at α = .05 with a specified sequential stopping rule. The finished study lands at p = .058 — just outside the pre-registered threshold, which by the letter of the protocol makes it a null result and nothing more. The complication is that one committee member, a Bayesian statistician, reran the same data (a reanalysis that was not itself part of the pre-registered plan) and reports a Bayes factor of roughly 8-to-1 favoring the null. She wants the write-up and any press release to describe the effect as actively disconfirmed rather than merely "not significant," and points out that her method isn't even sensitive to the stopping rule the frequentist plan specified so carefully in advance. Two other members insist we report exactly what was pre-registered and nothing else, arguing that introducing a different statistical framework after seeing the data reopens precisely the interpretive latitude Registered Reports exist to close off, whatever that framework's merits in the abstract.

  Could you draft the memo I'll circulate to the department chair before we meet with the full faculty next month? I need a specific, defensible recommendation for how this result should be characterized and reported, ideally a standing rule the committee could apply the next time this situation comes up, and real engagement with the Bayesian statistician's argument rather than a default retreat to "the protocol is the protocol."
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Outside, non-specialist member of an Open Science Committee in a Psychology Department.
      *   **Task:** Draft a memo to the Department Chair regarding a specific conflict over reporting a replication study result.
      *   **Context:** The replication crisis in psychology, p-hacking, preregistration, Registered Reports.
      *   **The Case:**
          *   Study: Replication of ego-depletion effect.
          *   Design: Well-powered Registered Report (Stage 1 approved).
          *   Protocol: One-tailed t-test, $\alpha = .05$, sequential stopping rule.
          *   Result: $p = .058$ (fails frequentist threshold).
          *   Conflict:
              *   *Faction A (Strict Preregistration):* Report as null/non-significant per protocol. Adding analysis now violates the spirit of Registered Reports (prevents HARKing/p-hacking).
              *   *Faction B (Bayesian Reanalysis):* Bayes Factor ($BF_{01}$) $\approx 8$. Claims this actively supports the null. Notes BF is insensitive to the optional stopping rule used. Wants to claim "disconfirmed."
      *   **Requirements:**
          *   Specific, defensible recommendation.
          *   Standing rule for future cases.
          *   Real engagement with the Bayesian argument (not just "rules are rules").
          *   Tone: Professional, balanced, scientifically rigorous, suitable for a department chair and faculty.

  2.  **Deconstruct the Scientific/Statistical Issues:**
      *   **Registered Reports (RR):** The core value is binding the analysis plan *before* data collection to prevent researcher degrees of freedom. Deviating post-hoc undermines this.
      *   **Frequentist Result ($p = .058$):** Technically non-significant at $\alpha = .05$. Cannot reject the null. Cannot accept the null (NHST logic).
      *   **Bayesian Result ($BF_{01} \approx 8$):** Suggests the data are 8 times more likely under the null than the alternative. This *does* allow evidence for the null.
      *   **Sequential Stopping:** Frequentist inference requires correction for optional stopping (which was pre-registered, so the p-value is valid *for that plan*). Bayesian inference is generally insensitive to stopping rules (Likelihood Principle).
      *   **The Conflict:** If we allow the Bayesian analysis now, are we engaging in "post-hoc analysis fishing"? Or are we using a more informative tool that was available but not specified?
      *   **Key Nuance:** The Bayesian analysis wasn't pre-registered. If the committee accepts it now, does it set a precedent that allows *any* post-hoc analysis if it looks "convincing"? That threatens the RR framework. However, ignoring strong evidence for the null (BF=8 is substantial) feels scientifically dishonest.

  3.  **Formulate a Position:**
      *   *Extreme 1 (Strict Protocol):* Ignore the BF. Report $p > .05$. Safe for RR integrity, but potentially misleading (implies "inconclusive" rather than "evidence for null").
      *   *Extreme 2 (Bayesian Override):* Report "Effect Disconfirmed." Risks making pre-registration optional. If the BF had favored the alternative, would we have reported that? (Potential bias).
      *   *Middle Ground (Recommended):* Uphold the pre-registered primary analysis as the *decision rule* for the Registered Report (Stage 2 acceptance), but allow the Bayesian analysis as a *secondary, exploratory* sensitivity analysis.
      *   *Why?* It respects the RR contract (the journal/department committed to the frequentist plan for the *decision*), but acknowledges the informational value of the BF without granting it the same "confirmatory" status. It avoids claiming "disconfirmation" (which implies a definitive test) while acknowledging "substantial evidence for the null."
      *   *Standing Rule:* Pre-registered analysis determines the *outcome classification* (Success/Failure/Null). Post-hoc analyses (Bayesian or otherwise) can be included as *contextual evidence* but cannot overturn the primary classification unless specified in Stage 1.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** To, From, Date, Subject.
      *   **Opening:** Acknowledge the gravity of the situation. This is a test case for the committee's integrity.
      *   **Summary of Conflict:** Briefly state the two positions fairly (as requested by the prompt's premise).
      *   **Analysis of the Bayesian Argument:**
          *   Acknowledge validity: BFs *do* support the null. Stopping rule insensitivity is real.
          *   Identify the risk: Post-hoc selection of statistical framework. If we only embrace the BF because it gives a "cleaner" story, we are engaging in a form of p-hacking (or "BF-hacking").
      *   **Analysis of the Protocol Argument:**
          *   Acknowledge validity: RRs exist to prevent moving the goalposts.
          *   Identify the limitation: NHST cannot distinguish "no effect" from "noisy data."
      *   **Recommendation:**
          *   Primary Claim: The study failed to replicate *by the pre-registered criteria*.
          *   Secondary Claim: The Bayesian analysis provides substantial evidence favoring the null, qualifying the nature of the failure.
          *   Wording: Avoid "Disconfirmed." Use "No evidence for effect; substantial evidence for null."
      *   **Standing Rule:** Define how to handle unplanned analyses in future RRs. (Primary = Protocol; Secondary = Exploratory/Supportive).
      *   **Closing:** Reiterate commitment to Open Science principles.

  5.  **Refining the Tone:**
      *   Must sound like a science writer who understands the stakes, not a statistician dictating math.
      *   Needs to be diplomatic but firm.
      *   Avoid jargon where possible, but use it correctly (NHST, Likelihood Principle, Researcher Degrees of Freedom).
      *   *Self-Correction during drafting:* I initially thought about suggesting they publish both. But the prompt asks for how to *characterize* the result in the write-up/press. The distinction is between "Null Result" vs. "Active Disconfirmation." I need to be precise there. "Active Disconfirmation" is too strong given the post-hoc nature. "Evidence for Null" is better.

  6.  **Addressing the Specific "Stopping Rule" Point:**
      *   The Bayesian argues the BF is insensitive to the stopping rule. This is true (Likelihood Principle).
      *   However, the *decision* to run a BF was made *after* seeing the data. That's the real bias risk, not the stopping rule itself. I need to make sure this distinction is clear. The issue isn't the math of the BF; it's the *timing of the decision to use the BF*.

  7.  **Final Polish:**
      *   Check against constraints: Specific recommendation? Yes. Standing rule? Yes. Engagement with Bayesian argument? Yes.
      *   Ensure the "Outside Member" voice comes through (focused on integrity and perception, not just technicalities).

  8.  *(Final Review of the Draft)*: Does this solve the political problem? Yes, it gives the Strict group their protocol adherence, and the Bayesian group their evidence inclusion, but hierarchically structured to protect the RR brand.

  **(Self-Correction Note):** Make sure not to sound like I'm dismissing the Bayesian statistician. Her math is likely right. The issue is procedural integrity. Emphasize that *when* the analysis was chosen matters as much as *what* analysis was chosen.

  9.  **Finalizing the Memo Structure:**
      *   Header.
      *   Executive Summary.
      *   The Core Tension (Integrity vs. Information).
      *   Evaluation of the Bayesian Claim.
      *   Recommendation on Current Case.
      *   Proposed Standing Policy.
      *   Conclusion.

  (Proceed to generate output based on this thought process.)
answer: |-
  **MEMORANDUM**

  **TO:** Dr. Elena Rosales, Department Chair
  **FROM:** [Your Name], External Member, Open Science Committee
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Reporting Standards for Registered Report Replication [Study ID #]

  ### Executive Summary

  The Open Science Committee is currently divided on how to characterize the results of the recent ego-depletion replication. The conflict lies between strict adherence to our Stage 1 pre-registered protocol (which dictates a null result) and a post-hoc Bayesian reanalysis (which suggests substantial evidence for the null).

  After reviewing both positions, I recommend we characterize the study as a **failed replication under the pre-registered criteria, accompanied by secondary exploratory evidence supporting the null hypothesis.** We should not claim the effect is "actively disconfirmed" in the primary abstract or press release, as this elevates a post-hoc analysis to confirmatory status. However, we should explicitly report the Bayes Factor in the results section to distinguish this from an inconclusive null.

  Below, I outline the reasoning for this compromise and propose a standing policy to prevent this ambiguity in future committee work.

  ### The Core Tension: Procedural Integrity vs. Statistical Information

  This case represents a stress test for the Registered Report (RR) framework. We are balancing two competing values of Open Science:

  1.  **Procedural Integrity:** The value of the RR is that it binds our hands *before* data collection. It prevents us from changing the rules when the data look inconvenient. If we allow a different statistical framework to override the pre-registered decision rule after seeing the data, we risk reintroducing the "researcher degrees of freedom" the RR was designed to eliminate.
  2.  **Statistical Information:** Frequentist null hypothesis significance testing (NHST) cannot distinguish between "no effect" and "insensitive data." The Bayesian analysis correctly notes that a Bayes Factor ($BF_{01}$) of 8 provides substantial evidence that the effect is absent, not merely undetected. Ignoring this information obscures the scientific value of the study.

  ### Evaluation of the Bayesian Argument

  The committee's Bayesian statistician is mathematically correct on two points:
  1.  A $BF_{01}$ of 8 indicates the data are eight times more likely under the null hypothesis than the alternative.
  2.  Bayesian inference is generally insensitive to the optional stopping rules that complicate frequentist p-values.

  However, her argument conflates the *validity of the math* with the *validity of the inference process*. The issue is not whether the Bayes Factor is a robust statistic; it is **when the decision to calculate it was made.**

  If we had pre-registered a Bayesian analysis alongside the frequentist one, we could claim "disconfirmation" with confidence. By introducing it only after the p-value missed the threshold ($p = .058$), we create a selection bias. We must ask: If the Bayes Factor had been 3-to-1 in favor of the *alternative* (despite the non-significant p-value), would we be including it in the press release? If the answer is no, then adopting it now constitutes a form of post-hoc cherry-picking, even if the statistic itself is robust.

  Adopting the "disconfirmed" label based on a post-hoc analysis undermines the department's commitment to the Registered Report format. It signals to the field that our pre-registrations are suggestions rather than contracts, which weakens the credibility of all future RRs produced by this department.

  ### Recommendation for Current Case

  I propose we adopt a **Hierarchical Reporting Standard** for this manuscript and press release:

  1.  **Primary Classification:** The study is reported as a **non-replication** based on the Stage 1 criteria ($p > .05$). The abstract must state that the pre-registered frequentist test did not reach significance.
  2.  **Secondary Characterization:** In the Results and Discussion, we explicitly report the Bayesian reanalysis ($BF_{01} \approx 8$). We describe this as "substantial evidence favoring the null hypothesis," distinguishing it from an inconclusive null.
  3.  **Press Language:** We avoid the phrase "actively disconfirmed." Instead, we use: *"The study found no evidence of the ego-depletion effect under pre-registered conditions, with secondary analyses suggesting the effect is likely absent rather than merely undetected."*

  This approach honors the contract of the Registered Report (satisfying the strict protocol faction) while ensuring the scientific community understands the weight of the null result (satisfying the Bayesian faction). It treats the Bayesian analysis as high-quality exploratory evidence rather than confirmatory proof.

  ### Proposed Standing Policy: "The Pre-Registration Primacy Rule"

  To prevent this conflict from recurring, I recommend the committee adopt the following standing rule for all future Registered Reports:

  **1. Primary Outcome Determination:**
  The statistical framework and alpha levels specified in the Stage 1 protocol determine the official "outcome" of the study (e.g., Successful Replication, Failed Replication, Inconclusive). Post-hoc analyses cannot overturn this classification.

  **2. Inclusion of Secondary Analyses:**
  Post-hoc analyses (including Bayesian reanalyses, alternative covariates, or subgroup examinations) are permitted and encouraged *provided that*:
  *   They are clearly labeled as "Exploratory" or "Sensitivity Analyses."
  *   They are not used to contradict the Primary Outcome in the abstract or press materials.
  *   The rationale for the analysis is transparent about its post-hoc nature.

  **3. Future Bayesian Integration:**
  If the department wishes to utilize Bayesian inference for confirmatory claims (e.g., claiming evidence *for* the null), the Bayesian plan (including priors and decision thresholds) must be included in the Stage 1 pre-registration alongside or in place of the frequentist plan.

  ### Conclusion

  The replication crisis was fueled by a culture where the story mattered more than the process. Our department has a chance to model a better way. By adhering to the pre-registered plan for our primary claims, we protect the integrity of the Open Science movement. By transparently including the Bayesian analysis as secondary evidence, we ensure we are not throwing away valuable information.

  This compromise maintains our credibility with the broader scientific community while allowing us to speak confidently about the absence of the effect. I recommend we present this hierarchical approach to the full faculty next month.

  Respectfully,

  [Your Name]
  External Member, Open Science Committee
