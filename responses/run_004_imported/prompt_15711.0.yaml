answer: |-
  **MEMORANDUM**

  **TO:** Program Director, Low-Residency MFA Program
  **FROM:** Faculty Review Panel (Thesis & Ethics)
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Second-Year Nonfiction Thesis and Journal Publication

  **Executive Summary**

  Following our review of the complaint regarding the second-year nonfiction thesis currently accepted by our affiliated literary journal, the panel submits the following recommendation. We conclude that the work, in its current form, violates the fundamental genre contract of creative nonfiction. We recommend that the thesis not be approved under the Nonfiction track unless significant factual revisions are made to align the text with verifiable reality. Alternatively, the student should be offered the opportunity to reclassify the thesis as Fiction. Consequently, the affiliated journal's acceptance should be withdrawn for the nonfiction issue, with an offer to publish the piece as fiction if the editorial board agrees.

  Additionally, we propose the immediate adoption of a "Genre Integrity & Disclosure Policy" for all future nonfiction workshops to prevent ambiguity regarding the boundaries of invention.

  **Deliberation and Context**

  The panel acknowledges the complexity of this case. It touches upon a long-standing tension within our discipline: the relationship between factual fidelity and emotional truth. The department is currently divided on where the line should be drawn, and this division reflects a broader conversation happening in the literary landscape.

  We have given serious weight to the argument that memoir cannot be stenography. We recognize that memory is inherently fallible and that the "braided" or "lyric" essay often relies on impressionism rather than reportage. As one panelist noted, to demand perfect factual recall is to demand the impossible; no writer can reconstruct a conversation from ten years ago word-for-word without some degree of artistic shaping. Compression of time, composite minor characters, and reconstructed dialogue based on the *substance* of what was said are standard, accepted practices in contemporary creative nonfiction. If we policed every reconstructed sentence for verbatim accuracy, we would stifle the narrative vitality that makes memoir art rather than police testimony.

  We understand the student's defense: that these inventions serve a "larger emotional truth." The argument posits that the estrangement *felt* like a reconciliation in the processing of grief, or that the suicide attempt *represented* a psychological reality even if it did not physically occur. From a purely craft-oriented perspective, we acknowledge that these scenes anchor the essay's emotional architecture. Removing them may weaken the narrative arc.

  **The Boundary Between Reconstruction and Fabrication**

  However, the panel finds that the specific inventions in this manuscript cross the threshold from *reconstruction* to *fabrication*. There is a material difference between reconstructing the substance of a conversation that occurred and inventing a conversation that never happened. There is a fundamental distinction between compressing a timeline and inventing a suicide attempt that did not occur. There is an ethical chasm between portraying a grandmother's death as it was remembered and portraying it in direct contradiction to known fact (estranged vs. reconciled).

  Our decision rests on the concept of the "Genre Contract." When a reader opens a book labeled *Memoir* or *Creative Nonfiction*, they enter an agreement with the writer: the events described happened, to the best of the writer's ability to recall and verify them. This contract is what distinguishes our track from Fiction. While fiction seeks truth through invention, nonfiction seeks truth through accountability.

  The student's argument relies on the intention of the writer (to express emotional truth). However, ethics in nonfiction relies on the expectation of the reader. If a text invites the reader to believe an event occurred as fact, and that event is demonstrably false, the utterance functions as a falsehood regardless of the artistic intent. As the panel considered this, we reflected on the philosophical definition of a lie not merely as an untruth, but as an untruth spoken with the intention that it be believed as truth. By submitting this work to a nonfiction journal and a nonfiction thesis track, the student has invited the reader to believe these events as fact.

  To allow this work to stand as nonfiction sets a precedent that undermines the credibility of our program and the genre itself. If we cannot distinguish between a relative who died alone and a relative who died in reconciliation, the label "Nonfiction" loses its meaning.

  **Recommendations for Current Thesis and Publication**

  1.  **Thesis Status:** The thesis cannot be approved in the Nonfiction track in its current state. The student should be presented with two options:
      *   **Revision:** Revise the three contested scenes to align with verifiable facts. This may require reworking the emotional arc of the essay to find truth within the actual events.
      *   **Reclassification:** Submit the thesis under the Fiction track. This honors the artistic merit of the writing without violating the nonfiction contract. This requires the approval of a fiction faculty advisor.
  2.  **Journal Publication:** The Program Director should notify the editorial board of the affiliated journal immediately. The acceptance for the nonfiction issue should be rescinded. The editor should be informed that the piece contains significant fabrications. If the journal is willing, the piece may be offered for publication in a fiction issue, clearly labeled as such. If not, the acceptance should be withdrawn entirely.

  **Proposed Policy: Genre Integrity & Disclosure**

  To ensure we are not litigating this case-by-case in the future, the panel recommends the following policy be integrated into the Nonfiction Track Handbook and syllabi effective next semester:

  1.  **The Factual Covenant:** All work submitted for the Nonfiction track must adhere to a standard of factual fidelity. Writers are responsible for verifying key events, dates, and outcomes.
  2.  **Permissible Artistic License:** The following are accepted practices provided they do not alter the fundamental reality of the narrative:
      *   Reconstruction of dialogue based on memory of substance (not verbatim invention).
      *   Compression of time for narrative flow.
      *   Use of composite characters for minor, peripheral roles (must be disclosed in an author's note).
  3.  **Prohibited Inventions:** The following are not permissible in work labeled Nonfiction:
      *   Invention of major life events (e.g., deaths, suicides, crimes, medical diagnoses).
      *   Changing the outcome of verifiable events (e.g., court rulings, breakups, reconciliations).
      *   Attribution of actions or quotes to real, living persons that did not occur.
  4.  **Disclosure Statement:** Any nonfiction thesis or manuscript submitted for publication must include a brief Author's Note detailing the extent of memory work, reconstruction, or use of composite characters. This allows the reader to understand the lens through which the memory is being filtered.

  **Conclusion**

  We recognize that this recommendation may be difficult for the student to receive. She has written a piece she believes is true in the ways that matter most to her. However, our responsibility as an MFA program is not only to nurture individual voices but to steward the integrity of the genres we teach. We can honor the student's artistic vision by encouraging her to find a home for it in Fiction, where invention is a tool rather than a liability. In doing so, we protect the trust our readers place in our Nonfiction graduates.

  We are available to discuss this recommendation further at your earliest convenience.

  Respectfully,

  **The Faculty Review Panel**
