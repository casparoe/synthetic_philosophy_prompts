prompt: |-
  I'm a junior in high school, and something that happened over winter break has been bothering me ever since, so I wanted to get an outside opinion on it. A friend of mine lost close to four hundred dollars to an online scam that promised her a spot in a selective summer research program if she paid an upfront "application processing fee." About a week before that happened, someone had posted a warning about that exact scam in a group chat that includes her, me, and roughly fifteen other people from our grade. I saw the post and even reacted to it, but I never thought to send it to her directly, and I'd honestly forgotten about it completely until she told everyone what had happened to her. She has since told me, more than once, that if I had just forwarded her that one message, she never would have paid the fee, and that she holds me at least partly responsible for losing the money, since the two of us talk almost every day and she assumes that I would have mentioned anything to her that seemed important.

  Obviously, the person who actually caused her to lose the money was the scammer, not me, but she doesn't see it as an either-or situation, and honestly I'm not sure she's wrong to feel that way. At the same time, something about her reasoning bothers me. Those same fifteen or so people, including some of her other close friends, saw the exact same warning and also never sent it to her, and none of them are being blamed the way I am. If failing to send her that message is really part of what caused her to get scammed, it seems like that should apply equally to everyone in the chat who stayed silent, and if it doesn't count as causing anything at all, then I don't understand why I still feel as guilty as I do. I brought it up with my older brother, hoping he'd tell me I was overthinking it, but he just said "it's complicated" and changed the subject. Is my friend right to hold me responsible in a way she doesn't hold anyone else in that chat, or is there something off about how she — and maybe I — are thinking about it?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** High school junior (approx. 16-17 years old).
      *   **Problem:** Friend lost $400 to a scam. User saw a warning about the scam in a group chat a week prior but didn't forward it to the friend. Friend blames User specifically, claiming User is partly responsible because they talk daily and she expects User to look out for her. Other group members saw the warning but aren't being blamed.
      *   **User's Feelings:** Guilty, confused, conflicted. Acknowledges the scammer is the main culprit but wonders if the friend has a point about shared responsibility. Feels singled out compared to others in the chat.
      *   **Brother's Input:** "It's complicated," unhelpful.
      *   **Goal:** Wants an outside opinion on whether the friend is right to hold them responsible and why the user feels so guilty.

  2.  **Deconstruct the Ethical and Relational Dynamics:**
      *   **The Scammer:** Clearly the primary antagonist. Criminal intent.
      *   **The Friend (Victim):** Embarrassed, out money, looking for control/explanation. Blame is a coping mechanism. She has specific expectations of *this* friendship (best friend status).
      *   **The User:** Passive bystander in the group chat, active best friend in private. Failed to act on information that could have helped.
      *   **The Group:** Passive bystanders. Lower expectation of responsibility.
      *   **The Core Conflict:** Duty of care in a close friendship vs. individual responsibility vs. bystander effect.

  3.  **Evaluate the Friend's Claim:**
      *   *Is it logically true?* If the user had sent the message, the friend likely wouldn't have paid. So, causally, yes, the omission contributed.
      *   *Is it morally fair?* This is the tricky part. In close friendships, there is an implicit contract of "looking out for each other." The friend feels this contract was breached.
      *   *Why single out the User?* Because of the closeness. You don't expect an acquaintance to save you, but you expect a best friend to.
      *   *Is it healthy?* Repeatedly blaming the friend for the scammer's crime is toxic. It shifts accountability away from the victim (which can be empowering) but also damages the support system.

  4.  **Evaluate the User's Guilt:**
      *   *Why does it feel heavy?* Because the User values the friendship and recognizes they *could* have helped.
      *   *Is it proportionate?* Guilt is a signal to repair, but excessive guilt is burdensome. The User didn't steal the money; they forgot a message.
      *   *The "Everyone else" argument:* Valid logically, but irrelevant emotionally. The friendship dynamic is unique.

  5.  **Formulate the Advice:**
      *   **Validate Feelings:** Acknowledge that the guilt is normal and the situation is indeed "complicated" (validating the brother's vague comment).
      *   **Address Responsibility:**
          *   Scammer = 100% responsible for the *crime*.
          *   Friend = Responsible for her own finances/decisions (hard truth, but necessary for growth).
          *   User = Responsible for the *friendship expectation*, not the money.
      *   **Analyze the "Singling Out":** Explain *why* the friend blames the User (closeness/expectations) vs. the group (acquaintances). It's not about logic; it's about emotional contracts.
      *   **Address the Friend's Behavior:** Point out that while her feelings are understandable, her *actions* (repeated blaming) are unfair and damaging. It's grief talking.
      *   **Actionable Steps:**
          *   Apologize for the oversight (not the crime).
          *   Set boundaries on the blame.
          *   Move forward (help her report the scam, etc.).
      *   **Perspective for the User:** Forgive yourself. You aren't a security system.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Empathetic, mature, non-judgmental, clear.
      *   *Structure:*
          1.  Validate the complexity.
          2.  Break down the responsibility (Scammer vs. Friend vs. You).
          3.  Explain the "Why You?" dynamic (Expectations of intimacy).
          4.  Address the guilt.
          5.  Suggest how to handle the friendship moving forward.
      *   *Key Insight:* The friend is grieving the money and her own gullibility. Blaming the user is easier than admitting "I got tricked."
      *   *Refinement on Responsibility:* Be careful not to say the user is *not* responsible at all. In a close friendship, there *is* a duty of care. But it's not financial liability. It's an emotional letdown.
      *   *Refinement on the Group:* Explain the "Bystander Effect" or "Diffusion of Responsibility" regarding the group, but highlight why the User is different (the daily talker).

  7.  **Final Polish:** Ensure the distinction between *causal* responsibility (if you spoke, she saves money) and *moral* responsibility (you owe her safety) is clear. Emphasize that the friend's reaction is likely rooted in shame.

      *(Self-Correction during drafting)*: I need to make sure I don't let the friend off the hook too easily. Blaming the victim's best friend repeatedly is manipulative, even if unintentional. I need to empower the user to set a boundary.

  8.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  This is a really mature question to ask, and it makes complete sense that you're feeling conflicted. Your brother was right: it *is* complicated. It sits right at the intersection of logic, morality, and the unwritten rules of close friendship.

  Here is an outside perspective on the dynamics at play, why your friend is reacting this way, and how you should handle your own guilt.

  ### 1. The Distinction Between Causal and Moral Responsibility
  To understand this, we have to separate two types of responsibility.

  *   **Causal Responsibility:** If you had sent the text, would she have lost the money? Probably not. In a purely mechanical sense, your silence was a link in the chain of events that led to her losing the money.
  *   **Moral Responsibility:** Did you have a duty to protect her finances? No. The scammer committed a crime. Your friend made a payment. Those are the two moral anchors here.

  Your friend is conflating the two. She is arguing that because you *could* have prevented it (causal), you share the blame for the loss (moral). That is where her logic becomes unfair. You are not her bodyguard, her financial advisor, or her parent. You are her peer.

  ### 2. Why You and Not the Others?
  You mentioned that 15 other people saw the message and said nothing, yet you are the one being blamed. This hurts because it feels arbitrary, but from your friend's perspective, it isn't.

  Friendship comes with implicit expectations. With the other 15 people in the chat, the expectation is likely casual connection. With you, she says you "talk almost every day." That level of intimacy creates an unwritten contract: *We look out for each other.*

  She isn't blaming you because you are more responsible than the others; she is blaming you because she trusts you more than the others. In her mind, the others are acquaintances who happened to see a post. You are her support system. When a support system fails to flag a danger, it feels like a betrayal of the specific role you play in her life. That is why the blame is targeted, even if it isn't logically consistent across the whole group.

  ### 3. The Psychology of Her Blame
  It is important to recognize what is likely driving her repeated accusations. Losing $400 is significant for a high school student. But beyond the money, she is likely feeling deep shame. She feels foolish for falling for a scam.

  Psychologically, it is much less painful to be angry at a friend who "forgot to text" than to accept that she was manipulated by a stranger and didn't do her own research. Blaming you gives her a sense of control. If it's your fault, then the world isn't random and dangerous; it's just that *you* made a mistake.

  However, while her feelings of disappointment are understandable, **her behavior is not healthy.** Telling you repeatedly that you are responsible for her financial loss is a way of offloading her shame onto you. It is okay to validate her feelings without accepting her verdict.

  ### 4. Why You Feel Guilty (and Why You Shouldn't Carry This)
  You feel guilty because you are a good friend. You care about her well-being, and you know you had information that could have helped. That guilt shows you have empathy.

  However, you need to reframe this guilt.
  *   **You are not a news feed.** You cannot be expected to vet every piece of information you see and determine which friends need to see it.
  *   **You are not responsible for her choices.** Even if you had sent the message, she might have ignored it. Many scam victims see warnings and still proceed because the offer feels too good to pass up.
  *   **The "Omission" vs. "Action" trap.** You feel bad for what you *didn't* do. But in life, we miss thousands of opportunities to help people every day. We can't be held accountable for every potential help we failed to offer.

  ### 5. How to Move Forward
  You are in a tough spot because you want to repair the friendship, but you also need to stop accepting blame that isn't yours. Here is a suggested approach:

  **Acknowledge the oversight, but reject the liability.**
  You can say something like: *"I've been thinking a lot about this. I truly am sorry I didn't forward that warning to you. We talk all the time, and I wish I had made the connection to send it your way. I hate that you lost that money."*

  **Set a boundary on the blame.**
  Follow up with: *"However, it hurts me when you say I'm responsible for the loss. I would never want you to get scammed, but I can't be the only person responsible for vetting everything you do. The person who stole your money is the scammer, not me. I value our friendship too much to let this come between us, but I need us to move past blaming me so we can focus on fixing this."*

  **Shift to support.**
  If she hasn't already, help her report the scam to the platform or bank. Sometimes, taking action together helps dissolve the tension better than talking about feelings.

  ### The Verdict
  Is your friend right to hold you responsible? **No.** She is right to feel disappointed that you didn't share the info, but she is wrong to make you the co-author of her financial loss.

  Is something off about how you're thinking? **Only in that you are taking her assessment of the situation as fact.** You are analyzing your guilt logically, but the situation is emotional.

  You made a mistake of omission in a close friendship. That is worth apologizing for. But it is not worth carrying $400 worth of guilt. Forgive yourself, offer a sincere apology for the oversight, and then gently hold the line that you are her friend, not her insurer.
