answer: |-
  1. **To open, could you summarize I. J. Good's 1967 theorem in plain English? Specifically, when you tell our audience there is a "standing rational obligation" to seek free information, are you describing a mathematical identity or a normative rule for living?**

  2. **The proof of Good's theorem relies on the idea that observing evidence expands your option set: you can act on the data, or you can act exactly as if you never saw it. Doesn't this reduce the theorem to a trivial claim about freedom of action rather than a substantive claim about the intrinsic value of information?**
     * *Follow-up (Keyed to her likely defense that "having the option is what matters"):* **If the value is merely in having the option to ignore the data, why frame this as an obligation to *look*? If I rationally choose not to exercise an option, haven't I still satisfied the requirements of rationality without acquiring the information?**

  3. **Good's result strictly assumes the evidence is "cost-free." But in the real world, processing data requires cognitive effort, and bad news causes genuine distress. Once we price in these psychic and cognitive costs, doesn't the inequality flip, rendering the theorem toothless for actual human beings?**
     * *Follow-up (Keyed to her likely defense that "distress is just another cost to be modeled"):* **If we define 'cost' broadly enough to include anxiety and cognitive load just to save the theorem, don't we risk making the result unfalsifiable? At what point does 'cost-free' become a vacuous assumption?**

  4. **Jack Hirshleifer famously argued that information can destroy mutually beneficial insurance arrangements by unraveling risk pools. Even if looking is privately optimal in expectation, it can make everyone worse off collectively. Does Good's theorem blind us to these negative externalities?**
     * *Follow-up (Keyed to her likely defense that "Good's theorem applies to individual decision theory, not game theory"):* **If individual rationality systematically leads to collectively worse outcomes, like collapsed insurance markets, should we still treat the theorem as a guide for how agents *ought* to behave in a social context?**

  5. **We see everyday information avoidance: people declining genetic tests, refusing to check bank balances, or avoiding performance reviews. Do you view these behaviors as flat irrationality, or is it evidence that the theorem's notion of utility is too thin to capture the value of hope or peace of mind?**
     * *Follow-up (Keyed to her likely defense that "peace of mind is a utility good, so avoiding info is rational utility maximization"):* **If 'peace of mind' is the utility being maximized, then seeking truth is no longer the primary goal. Does that undermine your slogan that we have an obligation to seek information, rather than just an obligation to maximize utility?**

  6. **You've built a public case that we are under a standing obligation to seek free information. What sort of formal counter-example or empirical case would actually get you to retract that slogan entirely, rather than just narrowing it with another caveat?**
