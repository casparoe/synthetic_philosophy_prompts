answer: |-
  First off: take a deep breath. Your student is sharp, and honestly, you should be happy they're in your section. This is one of the oldest and most persistent objections to Kant (often called the "consequentialist interpretation" of the FUL), and it arises precisely because the "What If Everyone Did That?" (WIEDT) heuristic is pedagogically useful but philosophically slippery.

  You are right to worry, but the student is ultimately mistaken. There is a principled distinction, but it requires tightening your language away from "bad outcomes" and toward "rational coherence."

  Here is how to sort this out for yourself, and then how to spin it for section tomorrow.

  ### 1. The Concession: Why the Student is *Partially* Right
  The standard intro gloss ("Imagine a world where everyone lies... trust collapses... that's bad") *does* sound consequentialist. It focuses on the **state of affairs** that results from universalization. If you stop there, Kant looks like a Rule Consequentialist who thinks the "best rule" is the one that avoids social collapse.

  If your explanation relies on the *undesirability* of the outcome (e.g., "a world without trust is terrible"), the student is correct: you have smuggled in consequences.

  ### 2. The Principled Distinction: Value vs. Validity
  The difference lies in **why** the maxim fails the test.

  *   **Rule Consequentialism:** The maxim is wrong because the *outcome* of universal compliance is suboptimal (less utility, more suffering, inefficient). The focus is on the **value** of the resulting world.
  *   **Kant (FUL):** The maxim is wrong because the *will* contradicts itself. The focus is on the **validity** (logical or volitional coherence) of the principle.

  For Kant, the "collapse" of the institution (like promising) isn't a tragic empirical consequence; it is the **logical signal of a contradiction.**

  #### A. Contradiction in Conception (Perfect Duties)
  Take false promising.
  *   **Consequentialist reading:** If everyone lies, trust evaporates, and society functions poorly.
  *   **Kantian reading:** If everyone lies, the concept of a "promise" ceases to have meaning. You cannot *make* a promise in a world where promising is universally understood as lying.
  *   **The Key:** It's not that the world is *worse*; it's that the action becomes **impossible**. It is like trying to play a game of chess by yourself. It's not "bad chess"; it is *not chess*. The liar is trying to make an exception for themselves: they rely on the institution of truth-telling to exist (so their lie is believed) while simultaneously willing that the institution not exist (by universalizing their maxim). That is a logical contradiction, not a calculation of harm.

  #### B. Contradiction in the Will (Imperfect Duties)
  This is where your "bad enough that no one could stably will it" phrasing is dangerous.
  *   **Consequentialist reading:** I wouldn't *want* to live in a world where no one helps. It would be unpleasant.
  *   **Kantian reading:** As a rational agent, I necessarily will my own ends (my happiness, my projects). To achieve my ends, I often need the help of others. If I universalize "never help others," I will a world where the necessary means to my own ends are unavailable.
  *   **The Key:** It is not about *preference* ("I'd prefer a nicer world"). It is about **structural rationality**. I cannot rationally will a principle that undermines the conditions of my own agency. It is a pragmatic contradiction of the will, not a utilitarian calculation.

  ### 3. How to Fix This in Section Tomorrow
  You don't need to throw out the WIEDT heuristic, but you need to add a "Kantian Filter" to it. Here is a script/strategy:

  **Step 1: Validate the Student**
  Start by telling the class: "One of you raised a brilliant objection last week: Isn't this just Rule Consequentialism? It looks like we are just checking if the consequences are bad. Here is why Kant says 'No'."

  **Step 2: Shift from "Bad" to "Impossible"**
  When discussing the false promising case, stop saying "promising would stop working, and that's bad."
  **Say instead:** "If everyone lied, you literally *could not* make a false promise. The words would make no sound, metaphorically. The liar is trying to use a system (truth-telling) that they are simultaneously willing to destroy. That's like trying to cut a piece of paper with scissors while willing that scissors never cut anything. It's not 'unfortunate'; it's incoherent."

  **Step 3: The "Free Rider" Explanation**
  Explain that the immoral agent isn't saying "Lying is bad." They are saying "Lying is permissible **for me**."
  *   The FUL exposes that the agent is trying to be a **free rider**.
  *   They need everyone else to follow the rule (tell the truth) so that their exception (lying) works.
  *   Kant's point is: Rationality requires consistency. You cannot claim a privilege for yourself that you deny to others without a relevant difference. There is no relevant difference between you and other rational agents.

  **Step 4: Clarify "Willing"**
  For the imperfect duties (helping others/talents), clarify that "willing" doesn't mean "wanting."
  *   "I don't *want* to live in a harsh world" = Consequentialism/Prudence.
  *   "I cannot *rationally will* a world where I am cut off from all aid" = Kant.
  *   Remind them: Kant argues we *necessarily* will our own happiness. To will a world where aid is impossible is to will against a necessary end of rational nature.

  ### 4. Cheat Sheet for Your Own Head
  If you get pushed further, keep these distinctions in your pocket:

  1.  **Ground of Obligation:**
      *   Consequentialism: The *goodness* of the outcome.
      *   Kant: The *form* of the law (universality).
  2.  **The Role of the "World":**
      *   Consequentialism: The imagined world is the object of evaluation (Is this world good?).
      *   Kant: The imagined world is a **test of coherence** (Can my maxim exist in this world?).
  3.  **The "Badness":**
      *   Consequentialism: Suffering, loss of utility.
      *   Kant: Incoherence, impossibility, undermining of agency.

  ### Summary
  Your student identified a real vulnerability in *introductory pedagogy*, but not in Kant's actual theory. The WIEDT thought experiment is a tool to reveal contradictions, not to calculate utility.

  If you frame the test as **"Can I coherently conceive/will this?"** rather than **"Would the result be desirable?"**, you shed the trenchcoat.

  Good luck tomorrow. You've got this. The fact that you're worrying about this shows you're a good TA.
