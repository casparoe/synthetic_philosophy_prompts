prompt: |-
  Random TA crisis, hoping you can help me sort out my own head before section tomorrow. I'm a phil PhD student and this semester I'm TAing intro ethics, and we just got through the universalizability material in the Groundwork. The way I've been explaining Kant's Formula of Universal Law to my students (and honestly how I've thought about it since undergrad) is basically: take a maxim, imagine literally everyone acting on it, and check whether the resulting state of affairs would be self-defeating or bad enough that no one could stably will it - eg false promising: if everyone lied to get out of debt whenever it was convenient, promising as an institution collapses and lying stops working as a strategy, so the maxim fails. Same deal for the "letting your talents rust" and "refusing to help others" cases later in the text - universalize it, then check whether the downstream situation is one a rational agent could actually want.

  My problem is that one of my first-years called this out in office hours as basically rule-consequentialism wearing a trenchcoat - i.e., we're evaluating the maxim by the aggregate consequences of everyone following it, which is exactly the kind of consequences-first reasoning Kant spends the opening sections of the Groundwork trying to distance the categorical imperative from. I laughed it off in the moment but I dont actually have a crisp answer for why the contradiction-in-conception and contradiction-in-the-will tests aren't just consequentialism with a formalist paint job, especially since pretty much every intro-level gloss (mine included, apparently) explains it through this exact "what if everyone did this and it went badly" move. Is my student onto something real, or is there a principled reason the universalizability test isn't secretly just smuggled-in consequentialism?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Role:** Philosophy PhD student, TA for Intro Ethics.
      *   **Context:** Just finished Kant's *Groundwork* (Formula of Universal Law -FUL).
      *   **Problem:** A sharp undergraduate accused the standard explanation of FUL ("What if everyone did this?") of being rule-consequentialism in disguise.
      *   **User's Current Understanding:** Explains FUL via the "state of affairs" resulting from universalization (e.g., promising collapses, talents rust, no one helps). Checks if it's self-defeating or undesirable.
      *   **Student's Objection:** This focuses on *consequences* (bad outcomes), which Kant explicitly rejects in favor of duty/reason.
      *   **Goal:** The user needs a crisp, philosophically sound answer to clarify their own head before section tomorrow. They need to know if the student is right or if there's a principled distinction.

  2.  **Evaluate the Student's Objection:**
      *   *Is the student onto something?* Yes, partially. The "What if everyone did that?" (WIEDT) heuristic is notoriously prone to consequentialist interpretation. It focuses on the *outcome* of a world where everyone $\phi$s.
      *   *Is FUL actually rule-consequentialism?* No. Kant is a deontologist. The moral worth comes from the motive (duty) and the form of the law, not the goodness of the outcome.
      *   *Where is the disconnect?* The disconnect lies in *why* the maxim fails.
          *   **Consequentialism:** The maxim fails because the *outcome* is bad (suffering, inefficiency, collapse of trust).
          *   **Kant:** The maxim fails because of a *logical or volitional contradiction*. It's not that the world is worse; it's that the action becomes *impossible* (contradiction in conception) or the will undermines itself (contradiction in the will).

  3.  **Formulate the Core Distinction (The "Crisp Answer"):**
      *   **Consequentialism:** Evaluates the *value* of the resulting state of affairs. (Is the world better or worse?)
      *   **Kant:** Evaluates the *consistency* of the will. (Can I coherently will this?)
      *   **Key nuance:** The "badness" of the outcome in Kant isn't moral badness (suffering); it's functional impossibility or rational incoherence.

  4.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge the student is sharp. This is a classic and very good objection. Don't dismiss it. It shows the "WIEDT" heuristic is dangerous.
      *   **The Concession:** Admit that the *heuristic* ("Imagine a world where...") often sounds consequentialist. This validates the user's worry.
      *   **The Philosophical Defense (The Meat):**
          *   *Distinguish the Ground of Obligation:* Consequentialism = Goodness of outcome. Kant = Rational consistency.
          *   *Contradiction in Conception (Perfect Duties):* It's not that the world is *worse* if everyone lies; it's that the concept of a promise *ceases to exist*. The action becomes logically impossible. Analogy: Trying to play chess alone. It's not "bad" chess; it's not chess.
          *   *Contradiction in the Will (Imperfect Duties):* This is trickier. It sounds more consequentialist ("I wouldn't *want* to live there"). Need to frame it as a conflict of *ends*, not preferences. A rational agent necessarily wills their own happiness/means to ends. Refusing help undermines the necessary conditions for achieving one's own ends. It's a pragmatic contradiction of the will, not a calculation of utility.
      *   **Pedagogical Advice (For Section Tomorrow):**
