prompt: |-
  I'm a retired analytical chemist (spent almost forty years in the lab, mostly industry, a stretch in academia at the end) and only in the last couple of years have I started reading philosophy seriously, on my own, no formal background in it at all. A while back I re-read Philip Anderson's old "More Is Different" piece out of nostalgia, which sent me down a rabbit hole into the older philosophical literature on reduction and emergence, and thats how I ended up with a strange, very out-of-print 1925 book, C. D. Broad's "The Mind and Its Place in Nature." He apparently more or less invented a lot of the vocabulary people still use when they argue about emergence today, even though hardly anyone actually reads the book itself anymore. I mentioned this to my daughter, who did philosophy at university unlike me, and she just laughed and said "welcome to emergence, dad."

  Anyway, in his chapter "Mechanism and Its Alternatives" he spends a while on the old chemistry example of why you can't predict the properties of a compound like silver-chloride just from knowing silver and chlorine separately, which felt like home turf to me and made perfect sense. But right after that he tries to formalize the whole thing into a general scheme, and that's the bit (pp. 77-79 in my edition) I keep circling back to without feeling like I've really got it. Here it is, more or less in full:

  "On the emergent theory we have to reconcile ourselves to much less unity in the external world and a much less intimate connexion between the various sciences. At best the external world and the various sciences that deal with it will form a kind of hierarchy. We might, if we liked, keep the view that there is only one fundamental kind of stuff. But we should have to recognise aggregates of various orders. And there would be two fundamentally different types of law, which might be called 'intra-ordinal' and 'trans-ordinal' respectively. A trans-ordinal law would be one which connects the properties of aggregates of adjacent orders. A and B would be adjacent, and in ascending order, if every aggregate of order B is composed of aggregates of order A, and if it has certain properties which no aggregate of order A possesses and which cannot be deduced from the A-properties and the structure of the B-complex by any law of composition which has manifested itself at lower levels. An intra-ordinal law would be one which connects the properties of aggregates of the same order. A trans-ordinal law would be a statement of the irreducible fact that an aggregate composed of aggregates of the next lower order in such and such proportions and arrangements has such and such characteristic and non-deducible properties. If we consider the properties of a given aggregate of high order we could then divide them into three classes, (i) Those which are characteristic of this order, in the sense that all aggregates of the order possess them, that no aggregate of lower order does so, and that they cannot be deduced from the structure of the aggregate and the properties of its constituents by any law of composition which has manifested itself in lower orders. These might be called the 'ultimate characteristics' of the order, (ii) Those which are characteristic of this order; but which could in theory be deduced from the structure of the aggregate, the properties of its constituents, and certain laws of composition which have manifested themselves in lower orders. These might be called 'reducible characteristics' of the order. (iii) Properties which aggregates of this order share with those of lower orders. These might be called 'ordinally neutral properties.'

  Suppose, e.g., that living bodies form an order of aggregates in the sense defined. Then the power of reproduction might be an example of an Ultimate Characteristic of this order. The law which asserts that all aggregates composed of such and such chemical substances in such and such proportions and relations have the power of reproduction would be an instance of a Trans-ordinal Law. The laws connecting the reproduction of living bodies with other ultimate characteristics of living bodies would be instances of Intra-ordinal Laws. A great many, though not perhaps all, of the facts about the beating of the heart might be Reducible Characteristics of this order. I.e., although they are characteristic of living beings, they might in theory be deduced from what we know of the chemical, physical, and mechanical properties of non-living aggregates, and from the special structure of the living body. Lastly, the conservation of energy, the property of inertial and gravitational mass, etc., would be examples of Ordinally Neutral Properties, since they appear unchanged in living bodies, chemical compounds, elements, etc."

  Two things about this have me stuck, and they might really be the same thing. First: when he says the higher-level property "cannot be deduced... by any law of composition which has manifested itself at lower levels," I can't tell if that's a claim about what's knowable in principle by any possible reasoner (i.e. a metaphysical claim, that the higher-level fact just isn't fixed by the lower-level facts) or a much weaker claim about the current state of our science (an epistemic claim, that we haven't found the bridge law yet, but one might exist). He writes as if he means the strong, metaphysical reading, but nothing in this bit actually rules out the weaker one. Second: if reproduction is a genuine "ultimate characteristic" of the vital order but a lot of what the heart does is merely "reducible" (i.e. secretly just chemistry and mechanics wearing a lab coat), what's actually left holding "the vital order" together as a single, unified order, rather than just a grab-bag of a couple of genuinely novel laws plus a pile of ordinary physical chemistry we've mislabeled as biological? As an old chemist I'm instinctively suspicious of this whole "orders" business, so I'd genuinely like to know: am I not reading him charitably enough here, or is this an actual soft spot in his picture that people have pushed on since?
