          *   Explain *Trans-ordinal Laws*: They are brute facts. Not missing puzzle pieces, but new rules of the game.
          *   Contextualize: Contrast with modern "Weak Emergence" (Bedau, Anderson). Broad thinks nature has "joints" where new laws kick in.
