answer: |-
  1.  **The Frege-Geach Challenge:** You've argued that we can validate moral inference without positing mind-independent moral properties. But let's go back to the classic embedding problem as Geach posed it against ascriptivism. Consider the conditional: "If lying is wrong, then getting your little brother to lie is wrong." In asserting this sentence, a speaker plainly isn't performing an act of disapproving of lying. So, on your view, what exactly is the antecedent expressing? If it isn't an expression of a moral attitude, what is the semantic content of that clause that allows it to function logically within the conditional?

  2.  **Follow-up (Commitment vs. Truth):** I anticipate you'll say the antecedent expresses a complex state, perhaps a commitment to disapproving of lying *if* one accepts the conditional. But if that complex state is just another psychological attitude, how do you account for the *validity* of the inference without smuggling in truth conditions? If the inference is valid in virtue of the *content* of the attitudes, aren't you implicitly granting those contents a truth-apt structure that quasi-realism was supposed to avoid?

  3.  **Unwin's Negation Problem:** Let's press the logical operators further with Unwin's negation problem. Take the claim "Lying is not wrong." There is a crucial logical difference between *negating* a moral attitude and the mere *absence* of any attitude toward lying. How does your expressivist semantics distinguish the state of mind expressed by "Lying is not wrong" from the state of mind of someone who simply has no opinion on lying? Both seem to lack the positive attitude of disapproval, so what constitutes the negation?

  4.  **Follow-up (Hyperplans as Disguised Semantics):** You might reach for Gibbard-style hyperplans or normative "worlds" to map out the incompatibility between these states. But if you need a structured space of normative possibilities to define the logical relations between these attitudes, why isn't that apparatus just borrowed truth-conditional semantics in thin disguise? At what point does modeling the "logic of attitudes" become indistinguishable from modeling the "logic of propositions"?

  5.  **Generalization to Quantifiers:** Solutions to the embedding problem often focus heavily on modus ponens and conditionals. I want you to extend whatever solution you've offered to quantified claims, such as "Everything the treasurer did was permissible." How does the expressivist analyze the logical form here? Are we expressing an attitude toward every specific action the treasurer took, or is there a general attitude toward a policy? If the latter, how do you specify the content of that general attitude without referencing the very truth conditions you reject?

  6.  **Follow-up (Psychological Plausibility):** If your answer requires the speaker to hold a potentially infinite set of commitments or a complex hyperplan covering every possible action of the treasurer, do you run into a problem of psychological plausibility? Ordinary agents make these quantified judgments without surveying every instance; if your semantics requires a cognitive load that real agents don't possess, does that suggest the semantics is mismatched with the actual psychology of moral judgment?

  7.  **Moral Disagreement:** A traditional selling point of expressivism was explaining the action-guiding nature of morality, but it often struggled to explain the *depth* of moral disagreement. If I say "X is wrong" and you say "X is permissible," and we are both just expressing attitudes, in what sense are we contradicting each other rather than just clashing? How does quasi-realism capture the intuition that we are disagreeing about *something* common, rather than just having incompatible desires?

  8.  **Follow-up (Consistency vs. Contradiction):** Following up on that: is "clashing attitudes" sufficient to ground logical contradiction? If disagreement is just a matter of inconsistent plans or desires, it seems I could disagree with you even if we are talking about different subjects. What ensures that our disagreement is *logical* (a matter of consistency) rather than merely *practical* (a matter of competing interests)?

  9.  **Motivation for the Project:** You've spent significant philosophical labor earning back realist-sounding talk—truth, knowledge, facts—within an expressivist framework. Given that outcome, what is the remaining theoretical motivation for starting with expressivism rather than adopting a naturalist realism from the outset? Is there a specific metaphysical or epistemological cost of realism that quasi-realism avoids, or is the view now driven primarily by historical momentum?

  10. **Creeping Minimalism:** This brings us to Dreier's challenge of creeping minimalism. If you are willing to reclaim moral truths, moral facts, and moral knowledge in a deflationary sense, and your logic mirrors realist logic, ask yourself plainly: what would actually be lost—for you, or for the realist you oppose—if quasi-realism simply turned out to be realism wearing different clothes? Is there a substantive difference left, or have you argued yourself into a position where the label "expressivist" no longer marks a genuine metaphysical distinction?
