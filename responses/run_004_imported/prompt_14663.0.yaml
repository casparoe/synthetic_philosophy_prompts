      *   **Ibn Rushd:** Philosopher/Physician (Aristotelian). Concerned with preserving scientific knowledge and intelligibility. If connections are arbitrary, we can't know anything. Key concept: *Essence/Nature* (*tabi'ah*) implies specific effects.

