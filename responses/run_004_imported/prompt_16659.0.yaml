answer: |-
  **Setting:** *The faculty lounge, 5:30 PM. The remains of cheap wine and stale cookies on a side table. Marcus (neo-Aristotelian) is packing his bag. Elena (situationist) lingers by the door, holding a paper cup.*

  **Elena:** That was a robust defense, Marcus. I'll give you that. You managed to get through the Q&A without uttering the word "Milgram."

  **Marcus:** *(Laughs)* Small mercies. I figured if I heard one more explanation of the obedience study based on a pop-psychology textbook, I might actually obey the command to strangle a lecturer. But I know you think I'm dodging the real bullet.

  **Elena:** I think you're dodging the *data*. And not the prison guard stuff. I'm talking about the granularity of the findings. Look, the Darley and Batson "Good Samaritan" study is the one that keeps me up at night, not Zimbardo. You have seminarians, people explicitly training for a life of virtue, preparing a talk on the Good Samaritan. And the variable that determines whether they stop to help a slumped stranger isn't their piety, their theological commitment, or their "character." It's whether they think they're late for the recording studio.

  **Marcus:** I know the study. High hurry, low helping. But Elena, does that really refute *global* traits, or does it refute a very specific, behaviorist conception of what a trait is?

  **Elena:** It refutes the idea that character traits are the primary explanatory drivers of behavior. If a trivial situational variable like time pressure swamps the variance explained by dispositional attributes, then positing a "global" trait of compassion is empirically idle. It's doing no work. The Isen and Levin "dime in the phone booth" study is even sharper. Find a dime, feel good, help a confederate pick up dropped papers. No dime, no help. Are we to believe there's a "helpful" trait that turns on and off like a light switch based on pocket change?

  **Marcus:** Okay, let's slow down. You're assuming that if a trait exists, it must manifest as behavioral consistency across *all* situations, regardless of the agent's perception of those situations. This is where I think the situationist critique leans too hard on a straw man. Have you looked closely at Sreenivasan's response?

  **Elena:** Gopal? Yes. The "mischaracterization" argument. He claims we're looking at output without accounting for input.

  **Marcus:** Exactly. Sreenivasan argues that virtue ethics doesn't require consistency in *behavior* across situations; it requires consistency in *response to morally salient features*. But the situation has to be *perceived* as morally salient. In the Darley and Batson case, the seminarians weren't ignoring a moral demand because they lacked compassion. They were overwhelmed by a competing demand—punctuality—which they likely construed *as* a moral obligation. They were going to give a talk; letting down the researchers might have felt like a violation of duty to them.

  **Elena:** But that's the point, Marcus! If their *phronesis*—their practical wisdom—is so fragile that it collapses under the pressure of being five minutes late, in what sense is it a stable trait? A global trait is supposed to be robust. If the "compassion" trait is actually "compassion-when-not-in-a-hurry-and-when-one-has-found-a-dime," that's not a global trait. That's a fragmented disposition. Doris calls it the "fragmentation argument." If we have to index traits to hyper-specific situational parameters to save them from empirical falsification, the concept loses its explanatory power.

  **Marcus:** I grant that if we define traits as rigid behavioral algorithms, they don't exist. But that's not the Aristotelian picture. Aristotle is quite clear: full virtue (*arete*) is rare. Most people operate at the level of *enkrateia* (continence) or *akrasia* (incontinence). The seminarians? They might have been continent—they wanted to help—but the pressure of the hurry caused them to act against their better judgment. Or, more likely, they lacked *phronesis*. They failed to see the salience of the slumped man *over* the salience of the appointment.

  **Elena:** So you're retreating to the "Rare Virtue" defense. If the theory predicts that almost no one actually possesses the trait, then the experiments aren't testing virtuous agents. They're testing ordinary people.

  **Marcus:** Precisely. And that's not a retreat; it's a feature. Virtue ethics is normative, not descriptive sociology. The fact that most people fail to act virtuously under time pressure doesn't prove virtue is impossible; it proves it's difficult and requires cultivation. The experiments show that *current* moral psychology is situation-dependent. They don't show that a cultivated *phronimos* couldn't, in principle, maintain focus on the moral salience despite the hurry.

  **Elena:** But that moves the goalposts significantly. If the "virtuous agent" is an idealization that rarely, if ever, exists in the population you're studying, how do you validate the theory empirically? You're positing a counterfactual agent. "If they were truly virtuous, they would have stopped." Well, they didn't stop, so they aren't virtuous. It risks becoming unfalsifiable.

  **Marcus:** It's not unfalsifiable. We can test for *phronesis*. We can look for consistency in *reasoning* and *attention*, not just overt helping behavior. But here's my pushback on the fragmentation point. You say if a trait is sensitive to context, it's not global. But Aristotle *wants* context sensitivity. That's what *phronesis* is. It's the ability to discern the *mean* relative to us. A global trait isn't a blunt instrument; it's a flexible capacity. The fact that behavior changes when the context changes doesn't prove the trait is absent; it might prove the trait is functioning correctly by adapting to the situation.

  **Elena:** Adapting? Helping a stranger when you're on time but ignoring them when you're late isn't adaptation; it's inconsistency. Look, I'm sympathetic to the idea that we shouldn't expect robotic consistency. But the magnitude of the situation effect is the problem. The effect sizes in these helping studies are huge compared to the variance explained by personality measures. If I want to predict whether someone helps, I'm better off knowing if they found a dime than knowing their score on a "Compassion" scale. If the situation swamps the disposition, then building an ethical theory around the disposition is building on sand.

  **Marcus:** Unless the ethical theory isn't about prediction, but about *construction*. You're treating character as a predictor of behavior. I'm treating it as a project of self-constitution. The empirical data tells us that our unreflective impulses are situationally hostage. That's exactly why we need virtue ethics! We need *askesis*, training, to make the moral salience robust against the noise of the situation. The data confirms the need for *phronesis*, it doesn't disprove it.

  **Elena:** But does it confirm the *structure* of *phronesis* as a unified trait? That's the crux. If I train you to be honest in academic settings, does that make you honest in tax settings? The data suggests not. Traits seem domain-specific. If virtue ethics requires a unity of virtues—if courage is linked to temperance and justice—and the psychology shows these are fragmented modules, then the architecture of the theory is mismatched with the mind.

  **Marcus:** Sreenivasan again, though. The unity of virtues thesis doesn't mean if you have one, you perfectly execute all others in all contexts. It means they are interconnected in the *ideal*. But let's press your point on domain-specificity. Even if traits are fragmented, isn't a "local" virtue better than nothing? And isn't the goal of education to broaden those local traits into something more integrated?

  **Elena:** Maybe. But if the integration is psychologically unnatural, if the mind is fundamentally modular and situation-triggered, then an ethics demanding global integration is asking us to be something we can't be. It's like demanding humans fly by flapping their arms. It's a nice ideal, but if the biology doesn't support it, it's bad normative theory.

  **Marcus:** But we *can* learn to fly, metaphorically. We can override the modular impulses. The seminarians *could* have stopped. The fact that they didn't shows they weren't fully virtuous, not that virtue is impossible. You're conflating "is" with "ought" in a different way. Just because most people are situationally manipulated doesn't mean they *ought* to be, or that they can't train themselves not to be.

  **Elena:** I'm not saying they *ought* to be manipulated. I'm saying if the mechanism of moral action is fundamentally situation-dependent, then focusing on "character" as the locus of intervention is inefficient. If you want more helping, put mirrors in the phone booths. Don't try to build "helpful people." Change the architecture of the situation.

  **Marcus:** That's a policy recommendation, not an ethics. Ethics is about who I am, not just what I do. If I help only because there's a mirror, have I acted virtuously?

  **Elena:** You've acted helpfully. And in a world of limited cognitive resources, maybe that's the best we can aim for.

  **Marcus:** *(Sighs, picks up his bag)* And there we are. You think I'm defending a metaphysical ghost to save a normative ideal. I think you're reducing moral agency to behavioral outputs to save a psychological model.

  **Elena:** I think I'm taking the psychology seriously enough to force the ethics to evolve.

  **Marcus:** And I think I'm taking the ethics seriously enough to show the psychology is measuring the wrong things.

  **Elena:** *(Smiles)* Well, at least we agree the seminar room was too hot. That was a situational variable we both reacted to consistently.

  **Marcus:** *(Chuckles)* True. I suppose even *phronesis* has its limits. See you at the conference?

  **Elena:** Wouldn't miss it. I'm presenting on the replication crisis in the helping literature.

  **Marcus:** I'll be in the front row. With a dime in my pocket.

  **Elena:** Don't count on it working, Marcus.

  **Marcus:** I'm not counting on the dime. I'm counting on noticing it.

  *(They part ways toward the exit. The lights in the lounge flicker, unnoticed by either.)*
