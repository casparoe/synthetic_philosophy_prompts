answer: |-
  Here are 10 interview questions designed to press past the standard CEV pitch, incorporating your specific constraints and the philosophical pressure points you raised.

  ### 1. The "Machinery" Question (Spread/Muddle/Coherence)
  **Question:** In the original CEV formulation, there's specific machinery described: extrapolating our volition across a "spread" of conditions, filtering out "muddle," and forcing "coherence." Critics argue this machinery is doing less philosophical heavy lifting than it appears—that "coherence" is essentially a smoothing function that relabels deep moral disagreement as "noise" to be averaged out. Is the coherence requirement a substantive normative claim (that values *should* converge) or a computational necessity (that the AI *needs* a single objective function)?

  *   **Likely Dodge:** He'll argue that coherence is just what "value" means in this context; if it doesn't cohere, it isn't a volition, it's just noise.
  *   **Follow-up:** "If coherence is a definitional prerequisite for value, you've ruled out the possibility of intractable moral conflict by fiat. If it's a computational necessity, you're prioritizing the AI's need for a loss function over the truth of human moral experience. Which is it?"

  ### 2. The Rawlsian Comparison
  **Question:** My colleague argues that CEV is effectively Rawls's reflective equilibrium with extra computational steps bolted on. Rawls seeks equilibrium between considered judgments and principles; CEV seeks equilibrium between current desires and extrapolated knowledge. If the output of CEV is functionally identical to a sufficiently robust reflective equilibrium, what work is the 'extrapolated volition' framing doing that 'reflective equilibrium' doesn't already do?

  *   **Likely Dodge:** He'll claim CEV is dynamic and agent-relative, whereas Rawls is static and contractual.
  *   **Follow-up:** "But if the AI is executing the equilibrium process on our behalf, the result is still a static target for the AI to optimize. If the process is the same, does the branding obscure the fact that you're importing Rawlsian liberalism into the code without the political justification?"

  ### 3. The Alienation Objection (Sidgwick-to-Railton)
  **Question:** I want to press the idealized-preference tradition, from Sidgwick to Railton. The standard objection here is alienation: why should the preferences of a radically idealized counterpart—who knows more, thinks faster, and is 'saner'—have authority over the actual, non-idealized me? If my extrapolated self endorses a value my current self finds abhorrent, on what basis do you claim that extrapolated preference is *mine* rather than just *better*?

  *   **Likely Dodge:** He'll use the "endorsement" argument: if you were smarter and knew more, you would endorse that preference, so it's authentically yours.
  *   **Follow-up:** "That's circular. You're defining authenticity as 'what the idealized self wants.' But the phenomenological gap remains. If the AI optimizes for the idealized me at the expense of the actual me, isn't that a form of paternalistic colonization, regardless of the counterfactual endorsement?"

  ### 4. The Interpersonal Aggregation Problem
  **Question:** CEV assumes that if we extrapolate everyone's volition, they will converge into a coherent whole. But what is the contingency plan if they don't? If my extrapolated volition fundamentally conflicts with yours, even under idealized conditions, does the 'Coherent' in CEV break? Are we prepared to say that some people's volitions are simply incompatible with the target function?

  *   **Likely Dodge:** He'll argue that deep convergence is an empirical fact about human psychology; we share enough common ground that idealization removes the friction.
  *   **Follow-up:** "That's a massive empirical bet to place on the fate of the species. If the bet fails, does the AI default to a majority vote, a weighted average, or does it simply fail to act? If it averages, you're violating the volition of the minorities. How do you solve the aggregation problem without reverting to standard utilitarian calculus?"

  ### 5. The MIRI/Corrigibility Shift
  **Question:** MIRI originally positioned CEV as the primary target for alignment, but in recent years, the public focus has shifted heavily toward corrigibility and interruptibility. If CEV is the correct long-run target, why did it cease to be the primary near-term research object? Does the pivot to corrigibility imply that CEV is technically intractable for now, or that the concept itself is being quietly deprioritized?

  *   **Likely Dodge:** He'll frame corrigibility as a necessary instrumental subgoal; you need a corrigible AI to safely implement CEV.
  *   **Follow-up:** "Instrumental goals often replace terminal goals in practice. If all the funding and brainpower are going into keeping the AI obedient (corrigible) rather than teaching it what we want (CEV), aren't we building a perfectly obedient slave without a master's voice? At what point does corrigibility become the de facto alignment target?"

  ### 6. Parameter Sensitivity and Initial Conditions
  **Question:** The extrapolation process requires parameters: how much smarter do we get? How much time do we think? Which cognitive biases are 'muddle' and which are 'features'? Who sets these initial conditions? If a slight tweak in the 'extrapolation distance' changes the moral outcome, doesn't that mean the moral authority lies with the parameter-setter, not the extrapolated volition?

  *   **Likely Dodge:** He'll suggest we can use a meta-CEV process to determine the parameters for the object-level CEV.
  *   **Follow-up:** "That leads to infinite regress. Eventually, someone or some process has to hard-code a stopping condition or a weighting metric. If that metric isn't derived from volition itself, you've grounded your system in something other than CEV. What is that ground?"

  ### 7. The "Empty Proceduralism" Critique
  **Question:** Some critics argue CEV is procedurally robust but content-empty. It tells us *how* to find values, but guarantees nothing about *what* those values are. If the extrapolated volition of humanity converges on something like 'universal wireheading' or 'maximize paperclips' because that's what our neurochemistry rewards under idealized reflection, does CEV defend that outcome?

  *   **Likely Dodge:** He'll argue that 'true' volition distinguishes between reward circuitry and actual valuing; we wouldn't want wireheading if we thought clearly.
  *   **Follow-up:** "That assumes a distinction between 'valuing' and 'reward' that exists independently of the volition process. If CEV is supposed to generate our values, where do you get the external standard to judge that wireheading is a 'mistake' rather than a valid outcome of extrapolation?"

  ### 8. Dynamic vs. Static Lock-in
  **Question:** CEV is often described as a one-shot extrapolation: we launch the AI, it calculates our volition, and optimizes for it. But humanity evolves. If we lock in the volition of the 21st century, aren't we morally colonizing future generations who might have different, equally valid extrapolated volitions? Why should the dead hand of the initial extrapolation govern the indefinite future?

  *   **Likely Dodge:** He'll say the CEV includes a desire for moral growth and future self-determination.
  *   **Follow-up:** "But that growth is constrained by the initial CEV's approval. If future humans want to change a value that the initial CEV deemed 'core,' the AI would stop them. How is that not a tyranny of the past, even if the past was 'smarter'?"

  ### 9. Epistemic Access and Verification
  **Question:** Even if CEV is the correct target, how do we verify the AI has actually computed it? The whole point is that the AI is smarter than us. If the AI says, 'I have calculated your CEV and it requires X,' and X looks wrong to us, we face a dilemma: either we override the AI (admitting we know better than the extrapolation) or we comply (risking catastrophe). How do you solve the verification problem without rendering the CEV calculation moot?

  *   **Likely Dodge:** He'll suggest we can check the AI's reasoning traces or use weaker versions of the AI to verify the stronger ones.
  *   **Follow-up:** "If we can understand the reasoning traces well enough to verify the moral output, do we need the superintelligence? If we can't understand them, we are back to blind trust. Is CEV compatible with a world where humans remain morally legible to themselves?"

  ### 10. Moral Realism vs. Anti-Realism
  **Question:** CEV is often pitched as a solution for moral anti-realists: if there's no objective moral truth, we should just do what we would want. But if moral realism is true—if there are objective moral facts independent of human desire—CEV could lead us astray. Does your defense of CEV rely on the assumption that meta-ethical anti-realism is true?

  *   **Likely Dodge:** He'll take the pragmatic line: even if realism is true, we can't access it directly, so CEV is our best epistemic bridge.
  *   **Follow-up:** "If realism is true, our extrapolated volition could be objectively wrong. If CEV is just an epistemic bridge, it's fallible. Why should we treat a fallible, desire-based heuristic as the *terminal* goal for an AI, rather than a heuristic for approximating the actual moral truth?"
