answer: |-
  It is a pleasure to correspond with someone who has spent three decades at the bench. You know better than most that biological mechanisms are rarely as clean as the philosophical examples designed to test them, and your worry is a formidable one. It cuts to the heart of whether etiological theories can truly *naturalize* content or merely shift the indeterminacy from the semantic to the historical.

  You are correct that Elliott Sober's distinction between selection *for* and selection *of* poses a serious challenge to naive adaptationism. If properties $P$ (being a fly) and $Q$ (being a small dark moving speck) were perfectly co-extensive in the evolutionary history of the frog lineage, Sober argues there is no fact of the matter about which property was selected *for*. If Millikan's theory relies on that fact to fix content, then in cases of perfect correlation, content remains indeterminate.

  However, I want to argue that this does not sink the teleosemantic project. To talk you out of this worry, I will not appeal to the biological implausibility of perfect correlation (i.e., I will not stipulate that surely a BB once crossed a frog's path). Instead, I will argue that Millikan has resources to handle perfect correlation without collapsing, specifically by leveraging her notions of **Normal explanation**, the **grain of biological content**, and the **Pushmi-Pullyu** nature of primitive representations.

  ### 1. Normal Explanation and Explanatory Asymmetry

  Your worry assumes that Millikan fixes content by looking at the *history of instances* (counting up flies vs. specks) and asking which property was the target of selection. If that were the method, Sober would be right: if the instances are identical, the count is identical.

  But Millikan's core notion is not the history of instances; it is the **Normal explanation** of the mechanism's persistence. A "Normal" explanation is not a statistical average of the past; it is the account of how the mechanism is *supposed* to work to produce the selected effect that explains its presence.

  Here is the crucial pivot: The selected effect of the frog's snapping mechanism is not "stimulating the retina" (the speck) nor even "catching a fly" (the object) in the abstract. The selected effect is **nutrition leading to survival and reproduction**.

  Even if $P$ (fly) and $Q$ (speck) were perfectly co-extensive in the past, they play different roles in the *explanation* of the frog's survival.
  *   $Q$ (the speck) is the **cue** or the *mediating condition*.
  *   $P$ (the fly) is the **source of the benefit** or the *satisfying condition*.

  Millikan's theory ties content to the conditions required for the **mapping rule** to succeed. The mapping rule maps the internal state to a worldly state such that the consumer system (the motor system) can perform its function. The motor system's function is to secure nutrition. A speck does not provide nutrition; a fly does. Therefore, even if no non-nutritious specks existed in the past, the *explanatory structure* of the function distinguishes them. The content is fixed by what is *required* for the success of the consumer, not merely by what was *correlated* with the producer in the past.

  Sober's worry applies to attributing the *adaptation* (why is the mechanism here?). Millikan accepts that limitation but argues that once the function is established (nutrition), the content is fixed by the **conditions of success** for that function. The content is "nutrition-source" (or "fly" as a proxy for that), not "retinal-stimulator," because only the former completes the Normal explanation of the *entire* system (sensorimotor loop). The indeterminacy Sober identifies in the *history* does not translate to indeterminacy in the *functional role*.

  ### 2. The Grain of Biological Content

  There is a second, perhaps more deflationary but equally robust, response available to the Millikanian. It concerns what we expect a naturalized theory of content to deliver.

  Your worry presupposes that the theory *must* deliver the content "Fly" rather than "Fly-or-Speck" to be successful. But why? That requirement stems from our human, folk-psychological intuition that frogs are "about" flies. But a naturalization project should be descriptive of the biological reality, not prescriptive of human categorization.

  If a frog's sensory system genuinely cannot distinguish between a fly and a BB, and if its evolutionary history never required it to, then perhaps the **true naturalized content is disjunctive**. Perhaps the content *is* "Small-Dark-Moving-Speck-That-Is-Nutritious."

  If teleosemantics delivers the verdict that the content is indeterminate between "fly" and "speck" in cases of perfect historical correlation, this is not a failure of the theory. It is a success. It accurately reflects that the biological system does not carve the world at the joint of "fly" vs. "speck"; it carves it at the joint of "thing-to-be-snapped."

  To insist that the content *must* be "fly" is to demand that frog representations match human conceptual precision. But the goal of naturalization is to explain how meaning arises from biology, not to ensure that animals have the same concepts we do. If the biology supports a coarse-grained or disjunctive content, the theory should assign a coarse-grained or disjunctive content. The "Disjunction Problem" is only a problem if you assume content *must* be exclusive. If you allow that primitive content can be disjunctive (e.g., "Fly or BB"), the worry dissolves. The theory successfully naturalizes the content that exists, even if that content is messier than we'd like.

  ### 3. Pushmi-Pullyu Representations

  Finally, there is a resource in Millikan's later work (specifically *Varieties of Meaning*) that I suspect will resonate with your background in sensory-motor systems. This is the notion of the **Pushmi-Pullyu Representation (PPR)**.

  The standard formulation of the disjunction problem assumes the frog's state has descriptive content: "There is a fly." If it's descriptive, it has truth conditions, and we ask: is it made true by a fly or a speck?

  Millikan argues that in simple organisms, representations are not purely descriptive. They are **undifferentiated directive-descriptive states**. A PPR says both "There is something here" and "Catch it!" simultaneously. It is like a road sign that means both "Curve Ahead" and "Steer Left."

  For a PPR, the "content" is not just a condition in the world (the fly); it is a **condition for the successful performance of an action**. The satisfaction condition of the representation is the *completion of the act* (catching and eating).

  In this framework, the disjunction problem loses its grip. The question is not "What object makes this belief true?" but "What state of affairs allows this guidance system to succeed?"
  *   If the object is a speck but not a fly, the guidance system fails (no nutrition).
  *   If the object is a fly, the guidance system succeeds.

  Therefore, the content is fixed by the **success condition of the action**, which is inherently tied to the nutritional value (the fly), regardless of the historical correlation of the visual cue (the speck). The PPR framework bypasses the need to isolate a single descriptive property from the history. It anchors meaning in the **consumption** of the representation by the motor system. Since the motor system is selected for nutrition, the content of the representation is anchored to nutrition, even if the sensory cue was historically co-extensive with non-nutritious objects.

  ### Conclusion

  Your worry relies on the idea that Sober's historical indeterminacy translates directly into semantic indeterminacy. I argue it does not, for three reasons:

  1.  **Explanatory Asymmetry:** Millikan fixes content via the *Normal explanation of success*, which distinguishes the cue (speck) from the benefit (fly/nutrition) even if they were historically co-extensive.
  2.  **Biological Realism:** If the system cannot distinguish them, the content *should* be coarse or disjunctive. Accepting this is a feature of a naturalistic theory, not a bug.
  3.  **Directive Content:** By viewing the state as a Pushmi-Pullyu representation, content is tied to the success of the *action* (eating), which resolves the disjunction at the level of biological function rather than historical correlation.

  The teleosemantic project does not fail here. It succeeds in showing that meaning is grounded in the normative structure of biological function. That grounding remains stable even when historical correlations are perfect, because the *norm* (what the system is for) is defined by the consequence (survival), not the correlation. The frog's state means "Fly" (or "Food") because that is what the system is *for*, and "what it is for" is a fact about the explanatory role of the trait, not merely a tally of its past triggers.
