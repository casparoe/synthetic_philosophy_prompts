answer: |-
  This is a great question. It cuts right to the difference between **engineering goals** (getting a model to converge) and **philosophical goals** (establishing a normative rule for rationality).

  In ML, if a loss function is merely *proper*, you're usually fine. As long as the global optimum includes the true distribution, your gradient descent will land somewhere in the "good set," and your predictions will be calibrated. Ties at the optimum are a nuisance, not a crisis.

  In accuracy-first epistemology (specifically Jim Joyce's argument), the goal isn't just convergence; it's **justification**. The argument tries to prove that if your credences violate the probability axioms (e.g., $P(A) + P(\neg A) \neq 1$), you are objectively **irrational**.

  Here is the intuition for why *strict* propriety is the linchpin, and what breaks if you allow ties.

  ### 1. The Loss Landscape: Bowl vs. Trough
  Think of the scoring rule as defining a loss landscape over the space of possible credences.
  *   **Strictly Proper:** The landscape is like a **bowl**. There is a single, unique bottom point corresponding to the true probability. Any movement away from that point increases loss.
  *   **Merely Proper:** The landscape is like a **trough** or a bucket with a flat bottom. The true probability is on the floor, but there are other points right next to it that are also on the floor. They all have the exact same minimal expected loss.

  ### 2. Joyce's Argument: Accuracy Dominance
  Joyce's argument relies on a concept called **dominance**.
  He wants to show that if you hold "incoherent" credences (violating probability axioms), there exists a set of "coherent" credences (obeying axioms) that is **more accurate than you** in every possible world.

  If I can show that Coherent-Credences score better than Incoherent-Credences no matter how the world turns out, then holding the Incoherent-Credences is demonstrably defective. You are leaving accuracy on the table.

  ### 3. What Breaks with Mere Propriety?
  If the scoring rule is only *proper* (allowing ties), the "flat bottom" of the trough creates a loophole.

  Imagine your incoherent credences place you just outside the "probability simplex" (the region of valid probabilities). We want to find a coherent point inside the simplex that beats you.
  *   **With Strict Propriety:** Because the true probability is the *unique* minimizer, the loss surface curves upward in every direction away from it. Geometrically, this guarantees that any point outside the simplex is strictly farther from the "truth" than some point inside it. You are **strictly dominated**.
  *   **With Mere Propriety:** Because the bottom is flat, your incoherent point might sit at the same "elevation" (accuracy score) as the coherent points.
      *   Result: The coherent credences are **not strictly better** than yours. They are only **equal or better**.
      *   This is **weak dominance** ($\ge$) instead of **strict dominance** ($>$).

  ### 4. The Philosophical Stakes: Permissible vs. Required
  This distinction between "equal or better" and "strictly better" is where the philosophy breaks down.

  *   **Strict Dominance ($>$):** If Coherent is *strictly* more accurate than Incoherent in every world, then rationality **requires** you to be Coherent. To be Incoherent is to knowingly choose a worse option. It is irrational.
  *   **Weak Dominance ($\ge$):** If Coherent is only *equal or better*, then being Incoherent is merely **sub-optimal**, not necessarily irrational.
      *   If the accuracy score is the same, an agent could say: "Sure, the Coherent credence is just as accurate as mine. But I prefer my Incoherent credence because it's simpler / easier to compute / feels better."
      *   If accuracy is the *only* virtue (as accuracy-first epistemology claims), ties shouldn't matter. But if ties are possible, accuracy alone cannot **rule out** the incoherent credence. It fails to prove that probability axioms are *mandatory*.

  ### 5. A Concrete "Tie" Scenario
  Imagine a scoring rule where reporting any probability between $0.4$ and $0.6$ yields the exact same expected loss when the true frequency is $0.5$.
  *   **Truth:** $0.5$.
  *   **Your Credence:** $0.5$ (Coherent).
  *   **My Credence:** $0.55$ (Let's say, for some reason, this violates a specific logical constraint in a multi-proposition system, making it incoherent).

  If the rule is merely proper, my expected inaccuracy is **identical** to yours.
  Joyce wants to tell me: "You are irrational because your credences violate the axioms."
  But if the scoring rule allows ties, I can reply: "My violation of the axioms costs me **zero** accuracy. Why is it irrational?"

  To shut down that reply, Joyce needs the scoring rule to ensure that *any* violation of the axioms incurs a **strict penalty**. Strict propriety guarantees that the only way to achieve minimal expected inaccuracy is to match the true probabilities exactly, which (through the geometry of the argument) forces adherence to the probability axioms.

  ### Summary
  In ML, a flat bottom in the loss landscape just means your model parameters aren't unique. You still get good predictions.

  In Epistemology, a flat bottom means you can't prove that violating the rules of probability is a **mistake**.
  *   **Strict Propriety** $\rightarrow$ Unique Optimum $\rightarrow$ Strict Dominance $\rightarrow$ Probability axioms are **Required**.
  *   **Mere Propriety** $\rightarrow$ Ties Allowed $\rightarrow$ Weak Dominance $\rightarrow$ Probability axioms are merely **Permissible** (or advisable, but not mandatory).

  Strict propriety buys you the **normative force** to say "You *must* obey the probability axioms," rather than just "You *should*."
