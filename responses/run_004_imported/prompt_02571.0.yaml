prompt: |-
  so i train models for a living, and its always just been background knowledge that log-loss and Brier score are "proper" scoring rules — you can't game them, the optimal strategy is to just report your true probability. i recently fell down a rabbit hole into "accuracy-first" epistemology and found out that the actual philosophical argument for why credences have to obey the probability axioms (i think its Joyce's accuracy-dominance argument?) apparently needs the scoring rule to be strictly proper, not merely proper. can you explain what strict propriety is buying you there that plain propriety doesn't — like, concretely, what breaks in the argument if you swap in a rule thats proper but has ties for the optimum? don't need the full proof, just the intuition for why "a unique minimum" vs "a minimum" ends up mattering so much philosophically.
