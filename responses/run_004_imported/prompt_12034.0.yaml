prompt: |-
  Ok so this actually happened in my family and now it's stuck in my head as a political philosophy problem, which is annoying since i'm literally doing my PhD in this exact area. My mom died in the spring and me and my two siblings are splitting up the estate (about 90k total). My sister has a chronic illness and says she should get a bigger cut because she needs way more money just to reach a normal standard of living (meds, can't work full time, etc) - split it evenly and she ends up worse off than the rest of us, which seemed totally fair to me. Then my brother said ok well by that logic he should get more too, since cheap stuff just doesn't make him happy, only nice things do, so an equal split leaves him worse off same as her. Somehting about his argument bugs me but I can't explain why it should be treated differently than my sister's, since both are basically saying "equal dollars doesn't mean equally well off." Is he right and i'm just biased against him, or is there an actual principled difference between the two claims?
