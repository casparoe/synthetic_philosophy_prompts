      *   **Scene 2: The Proposal.** The committee wants a "solution." They want a treaty, a safeguard, a way to make it safe. Thorne needs to explain why that's impossible. This is the core von Neumann argument: knowledge persists, intervals shrink.
      *   **Scene 3: The Conflict.** The General wants to deploy. The Senator wants to ban. Thorne argues both are illusions. The "Singularity" concept needs to be introduced subtly—the acceleration curve.
      *   **Scene 4: The Climax/Resolution.** There is no victory. No button is pushed to save the world. A decision is made to proceed with caution, knowing it's temporary. The burden of perpetual vigilance.

  4.  **Developing the Argument (The "Von Neumann" Voice):**
      *   Need to articulate the "shrinking interval."
      *   *Metaphor:* A child handed a loaded gun every six months, but the child grows up over decades.
      *   *Key Line:* "We are trying to build a dam out of paper against a rising tide of calculus."
      *   *Key Concept:* You can't un-invent. Once the math is done, it's done.

  5.  **Writing - First Pass (Mental or Scratchpad):**
      *   Start with the smoke. Cigarettes were big then.
