      *   *Check:* Is safety provisional? Yes, the agreement is a "stopgap."
      *   *Check:* Is climate control central? Yes, Project Chimera.

      *(Self-Correction during drafting)*: Make sure Thorne doesn't sound like a doomsayer. He sounds like a mathematician. Cold, precise. The horror is in the logic, not the emotion.

      *Focus on the "Interval":* This is the crux. It takes 50 years to change a law, 5 years to change a technology. Soon it will be 5 months.

  8.  **Final Polish:**
