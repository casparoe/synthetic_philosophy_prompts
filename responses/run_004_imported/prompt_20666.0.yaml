answer: |-
  The rain against the Pentagon windows was steady, a gray curtain that matched the mood inside Conference Room B. It was November 1957. Sputnik had orbited two months prior, but the anxiety in the room had nothing to do with satellites.

  Dr. Elias Thorne stood at the head of the mahogany table. He was a thin man, sharp-featured, with the weary eyes of someone who spent too much time inside equations. To his right sat General Sterling, chewing an unlit cigar. To his left, Senator Halloway, rubbing his temples.

  "Let me be clear," Thorne said, his voice devoid of tremor. "Project Chimera works. We have successfully altered the precipitation patterns over the Nevada test site. We can induce drought. We can induce deluge. We can, theoretically, freeze a harvest in the Ukraine or flood a supply line in the Rhine."

  General Sterling leaned forward. "Then why are we sitting here? If the Soviets have this—"

  "They don't," Thorne interrupted. "Not yet. But they will. And that is not the point of this briefing."

  Thorne walked to the chalkboard at the end of the room. He drew a horizontal line. "This is human political evolution. The speed at which we build institutions, treaties, norms of behavior. It is linear. Slow." He drew a second line, starting parallel to the first but curving sharply upward. "This is technological capability. Specifically, the capacity for destruction."

  "A standard curve," Sterling grunted. "We've seen it with the bomb."

  "No," Thorne said, turning to face them. "With the bomb, you thought the problem was the uranium. You thought if you locked the uranium away, or signed a treaty, or destroyed the centrifuges, you were safe. That is a comforting illusion. The problem is not the uranium. The problem is the *interval*."

  He tapped the widening gap between the two lines. "In the nineteenth century, the interval between a major technological upheaval and society's ability to absorb it was fifty years. In the 1940s, it was ten. By 1960, it will be five. Soon, it will be months. You are asking me for a policy that secures the peace. I am telling you there is no such policy. There is only management of the interim."

  Senator Halloway looked up, his face pale. "You're saying we can't ban it?"

  "I'm saying a ban is a piece of paper. Chimera is physics. Once the physics is known, it cannot be un-known. You cannot negotiate with a law of nature. If we stop, the Soviets will not. If they stop, a rogue actor, a corporation, a fanatic will. The cost of entry is dropping. To build an atomic bomb requires a nation-state. To alter the climate? It requires a laboratory and a budget."

  Sterling slammed his hand on the table. "So what do you do? Hand them the match?"

  "I am handing you the match so you understand it is already lit." Thorne walked back to the table and placed a folder in front of each of them. "This is the proposal. We deploy Chimera. Not as a weapon. As a deterrent. We announce the capability. We create an inspection regime."

  "Inspection takes time," Halloway said. "Time you just said we don't have."

  "Precisely. The inspection regime will fail. Eventually. A sensor will be blinded. A logbook will be forged. A new method will be found that doesn't require the infrastructure we are inspecting." Thorne paused, letting the silence stretch. "I am not offering you safety, Senator. I am offering you vigilance. Permanent, exhausting vigilance."

  Thorne thought of his colleague, Stanislaw Ulam. They had spoken often in the last year, late at night at the Institute, surrounded by the hum of the MANIAC computer. Ulam had used a word then, a mathematical term repurposed for history. *Singularity.* He had spoken of an essential point where the rate of change becomes infinite, where the old rules of cause and effect dissolve because the actors are no longer the same species of thinker. Thorne didn't use the word in the report. It sounded too mystical. But he felt the gravity of it. They were approaching an asymptote.

  "You're asking us to sign off on a weapon we admit we can't control," Sterling said, his voice low.

  "I am asking you to acknowledge that control is a temporary state. Like balancing a pencil on its tip. You can do it for a moment. But you cannot freeze the pencil in place. You must constantly adjust your hand. If you stop adjusting, it falls."

  Halloway stood up and walked to the window. The rain was heavier now. "If we release this... if we admit weather can be weaponized... every crop failure in the world will be an act of war. Every hurricane will be an accusation."

  "Every hurricane already is," Thorne said softly. "Nature does not care about our innocence. But now, we have the capacity to mimic nature's cruelty. The danger is not that we will destroy the world in a day. The danger is that we will spend the next century living on the edge of a cliff, knowing the ground beneath us is shifting faster than we can build fences."

  Sterling lit his cigar. The smoke curled up toward the fluorescent lights. "And if we say no? If we bury Chimera?"

  Thorne almost smiled, a thin, humorless expression. "General, I am a mathematician. I deal in probabilities. The probability that the knowledge contained in these files does not leak is zero. The probability that a competing nation does not derive the same equations within three years is less than ten percent. If you bury it, you bury it only for yourself. You blind your own hand while the other player keeps his sight."

  The room fell silent. The hum of the ventilation system seemed to grow louder.

  Halloway turned from the window. "So there is no victory condition. No treaty that lasts. No final disarmament."

  "No," Thorne said. "There is only the next decade. And the one after that. We must build institutions that are flexible enough to break without shattering the world. We must assume betrayal. We must assume error. We must assume that whatever safeguard we build today will be obsolete by the time my grandchildren are in college."

  He picked up his pen. "I recommend we proceed with development. Not to use, but to understand. We must know the mechanism better than anyone else, because we will be the ones called upon to fix it when it jams. We become the custodians of a danger we cannot eliminate."

  Sterling stared at the folder. He looked like a man being asked to carry a bomb without a timer. "You're saying we never get to stop worrying."

  "I am saying that worry is the only survival mechanism left to us. Complacency is the extinction event."

  Halloway sat back down. He opened the folder. The pages inside detailed ionization arrays, cloud-seeding dispersal rates, atmospheric modeling. It was dry, technical, bureaucratic. It looked like any other government contract. It did not look like the end of the Holocene.

  "If we do this," Halloway said, "we are accepting that the world will never be safe again."

  "The world was never safe," Thorne corrected. "It was merely indifferent. Now, it will be reactive. There is a difference."

  Thorne watched them. He saw the weight settling onto their shoulders. This was the burden von Neumann had spoken of before the cancer took him. The realization that technology was not a tool to be mastered, but an environment to be endured. They were not piloting the ship; they were trying to keep the hull from buckling as the speed increased beyond the design limits.

  Sterling picked up his pen. He hovered it over the signature line. "God help us."

  "God is a variable we cannot quantify," Thorne said. "Rely on the math."

  Sterling signed. Halloway followed.

  Thorne collected the folders. He did not feel triumph. He felt a cold clarity. They had chosen the path of perpetual crisis over the illusion of peace. It was the only honest choice.

  As he walked out of the Pentagon into the rain, Thorne opened his umbrella. He looked up at the gray sky. Somewhere up there, the clouds were gathering, heavy with water, neutral and waiting. He knew that in ten years, or twenty, someone would find a way to make them fall on the wrong city. And someone else would find a way to stop it. And then someone would find a way to stop the stopper.

  The interval was shrinking. The curve was steepening.

  He stepped off the curb, careful of the traffic, careful of the slick pavement. One had to be careful now. There were no guardrails left, only the thin, trembling line of human attention holding back the dark. He walked to his car, knowing he would have to do this all again next year, and the year after, until the math ran out.
