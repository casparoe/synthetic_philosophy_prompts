          *   *Commitment:* We know *how* things relate, not *what* relates them.
          *   *Analogy:* Like knowing the blueprint of a building without knowing if it's made of brick or steel.

      *   **Part 3: Psillos's Selective Realism ("Divide et Impera"):**
          *   *Core Idea:* Be selective. Not all theoretical claims are equal.
          *   *Application to Fresnel:* Distinguish between the *mechanism* (vibrating solid) and the *causal properties* (transversality, elasticity moduli mapping to permittivity/permeability).
          *   *Commitment:* The "idle" parts (solidity) went. The "working" parts (causal properties that do the explanatory heavy lifting) stayed and were transcribed into Maxwell's ontology.
          *   *Key Difference:* Psillos says we *can* be realist about the ontology (fields have real properties), not just the math. Worrall says we can't know the ontology, only the structure.

      *   **Part 4: The Divergence (What Survived?):**
          *   Summarize the contrast clearly.
          *   Worrall: Structure survived. Ontology replaced.
          *   Psillos: Specific causal properties (ontological content) survived. The ontology was *refined*, not abandoned.

      *   **Part 5: The Newman Objection:**
          *   *Origin:* Max Newman vs. Bertrand Russell (1928).
          *   *The Argument:* If a theory only claims "there exists a structure of relations R," that is trivially true for any collection of objects, provided you have enough objects. Structure without constraints on the *nature* of the relations is empty.
          *   *Why it hits Worrall:* ESR says "Commit to structure, not nature." Newman says "Structure alone tells you nothing about the world." If you don't say what the relations *are* (causal, physical, etc.), any set of points can fit the math. It makes the theory too easy to satisfy.
          *   *Why it spares Psillos:* Selective Realism *does* commit to the nature of the relations/entities (e.g., causal powers, electromagnetic fields). It puts constraints on the *relata* (the things relating), not just the *relations*. Therefore, it's not trivial.

