      *   **Topic:** Scientific Realism, specifically the Fresnel-Maxwell case study, Laudan's Pessimistic Meta-Induction (PMI), Worrall's Epistemic Structural Realism (ESR), Psillos's Selective Realism ("Divide et Impera"), and the Newman Objection.
      *   **Core Question:**
          1.  How do Worrall and Psillos differ in their interpretation of what survived from Fresnel to Maxwell?
          2.  Why does the Newman objection apply specifically to Worrall's Structural Realism and not (as strongly) to Psillos's Selective Realism?
      *   **Constraints:** Explain carefully, do not presume prior reading of the original papers, leverage the user's physics background where helpful but keep the focus on the philosophy.

  2.  **Deconstruct the Philosophical Landscape:**
