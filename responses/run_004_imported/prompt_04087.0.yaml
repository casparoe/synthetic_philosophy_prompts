answer: |-
  It is a pleasure to address a colleague who knows the Fresnel coefficients from the inside out. You have identified precisely the fault line where the philosophy of science becomes most tangible for a practicing scientist. The transition from Fresnel to Maxwell is indeed the "fruit fly" of the realism debate: it is the case study everyone uses because it is so clean. The math stayed; the "stuff" changed.

  Your confusion regarding Worrall and Psillos is well-founded. They both use the Fresnel case to defend realism against Larry Laudan's Pessimistic Meta-Induction (PMI), but they defend *different versions* of realism. Consequently, they interpret "what survived" differently, and this difference determines their vulnerability to Max Newman's objection.

  Here is an explanation of where they diverge on the physics, and why the Newman objection lands on one but glances off the other.

  ### 1. The Common Enemy: Laudan's Pessimistic Meta-Induction
  To understand the divergence, we must first agree on what they are fighting. Laudan's argument is essentially an induction over the history of science:
  1.  Many past theories were empirically successful (like Fresnel's optics).
  2.  Many past theories had central ontological claims that turned out to be false (like the luminiferous ether).
  3.  Therefore, we should expect our current successful theories (like Maxwell's electrodynamics or Quantum Field Theory) to also have false ontological claims.

  Laudan concludes that we should not believe our theories are *true*, only that they are *empirically adequate*. Both Worrall and Psillos want to save the idea that science tracks truth, but they draw the line of "truth" in different places.

  ### 2. Worrall's Epistemic Structural Realism (ESR)
  John Worrall's 1989 paper is the founding document of modern Structural Realism. His reading of the Fresnel-Maxwell case is radical.

  **The Interpretation:**
  Worrall argues that when Fresnel derived his equations, he posited a specific *nature* for the medium: an elastic solid. When Maxwell came along, he posited a specific *nature* for the medium: an electromagnetic field. These two natures are incompatible. A thing cannot be both a mechanical solid and an electromagnetic field. Therefore, the **ontology** (the "what") was false and discarded.

  However, the **mathematical structure** (the relations between quantities) was preserved. The Fresnel equations emerged from Maxwell's theory just as they had from the elastic theory.

  **The Commitment:**
  Worrall suggests that the only thing a realist is justified in believing is the *structure* of the theory. We should believe that the world possesses a structure isomorphic to the mathematical relations in our theories. We should *not* believe in the entities (electrons, fields, ether) as described by the theory, because history shows those descriptions change.

  **In your terms:**
  For Worrall, the boundary conditions and the wave equations describe real relations in nature. Whether those relations are instantiated by "ether stress" or "field vectors" is a metaphysical gloss we cannot know. We know the *blueprint*, but we cannot know the *building materials*.

  ### 3. Psillos's Selective Realism ("Divide et Impera")
  Stathis Psillos, writing in the late 1990s, found Worrall's position too restrictive. He argued that if we give up on ontology entirely, we lose the explanatory power of science. His approach is often called "Selective Realism" or the "Divide et Impera" strategy.

  **The Interpretation:**
  Psillos agrees that the *mechanism* of the ether (the elastic solid) was discarded. However, he argues that not all of Fresnel's ontology was "idle." Fresnel attributed specific **causal properties** to the ether to make the math work (e.g., transverse vibrational capability, specific density/elasticity ratios).

  Psillos claims that while the *substance* (ether) was wrong, the **causal properties** attributed to that substance were correct and were "transcribed" into Maxwell's theory. The electromagnetic field *just is* the thing that has those causal powers.

  **The Commitment:**
  Psillos argues we can be realist about the ontology, provided we are selective. We distinguish between the "constitutive" assumptions (those responsible for empirical success) and the "idle" assumptions (those that are incidental).
  *   **Idle:** The ether is a solid.
  *   **Constitutive:** The medium supports transverse waves with velocity $c$.

  **In your terms:**
  For Psillos, the electromagnetic field is not just a placeholder for structure; it is a real entity that possesses the causal powers Fresnel identified. The ontology wasn't *abandoned*; it was *refined*. We keep the "working parts" of the ontology, not just the math.

  ### 4. The Divergence: What Survived?
  Here is the crux of the difference you sensed in your discussion group:

  *   **Worrall (Structuralist):** What survived is the **form**. The relations $R(x,y)$ are real. The relata $x$ and $y$ (the nature of the entities) are unknown or irrelevant. The transition was: *False Ontology + True Structure $\rightarrow$ New False Ontology + Same True Structure.*
  *   **Psillos (Selective Realist):** What survived is the **causal content**. The specific physical properties that do the work are real. The transition was: *Mixed Ontology (Some Idle, Some Constitutive) $\rightarrow$ Refined Ontology (Constitutive parts retained).*

  Worrall says we cannot know if the "stuff" is continuous or discrete, field or particle. Psillos says we can know it is a field with specific causal powers, because those powers were the engine of the theory's success.

  ### 5. The Newman Objection
  This brings us to Max Newman. In 1928, Newman reviewed Bertrand Russell's *The Analysis of Matter*, which was an early precursor to Worrall's view. Newman's objection is logical and devastating to pure structuralism.

  **The Argument:**
  Newman pointed out that "structure" is a very weak constraint. If a theory claims only that "the world has structure $S$," without specifying the *nature* of the relations or the objects, that claim is trivially true.

  Mathematically, if you have a set of objects of sufficient cardinality (size), you can always define relations between them to satisfy almost any structural description. If I tell you, "The universe consists of objects standing in relation $R$," and I refuse to tell you what $R$ *is* (e.g., causal, spatial, temporal) or what the objects *are*, you can take *any* collection of things (apples, ideas, points in space) and arrange them to fit the description.

  **Why it hits Worrall:**
  Worrall's ESR explicitly forbids commitment to the "nature" of the entities or the relations, insisting on structure alone to avoid Laudan's PMI.
  *   **Worrall:** "Believe the structure, not the nature."
  *   **Newman:** "Structure without nature is empty."

  If Worrall says, "Maxwell's equations describe the real structure of the world," Newman asks: "What are the relations?" If Worrall answers, "I can't say, that would be ontological commitment," then Newman replies, "Then your claim is trivial. Any world with enough objects can be mapped onto those equations." To make the claim non-trivial, Worrall must specify that the relations are *physical* or *causal*, but doing so reintroduces the ontological commitment he tried to avoid.

  **Why it spares Psillos:**
  Psillos's Selective Realism is immune to this because it *does* commit to the nature of the relations.
  *   **Psillos:** "Believe the structure *and* the specific causal properties that instantiate it."

  By insisting that the surviving content includes **causal powers** (e.g., the capacity to transmit energy, the property of permittivity), Psillos places a constraint on the *relata* (the things relating). He is not just saying "there is a structure"; he is saying "there is a structure *made of fields with these specific causal properties*."

  Because Psillos restricts *what kind of things* can fill the structural slots (they must be things capable of causation, energy transfer, etc.), the Newman objection fails. You cannot just take any random set of objects and fit them into the theory; they must be the right *kind* of objects to support the causal relations.

  ### Summary for Your Discussion Group

  To synthesize this for your group:

  1.  **The Fresnel Case:** Both agree the math stayed and the "elastic solid" went.
  2.  **Worrall's Lesson:** Commit only to the math (structure). The "stuff" is unknowable. This avoids Laudan but invites Newman (structure alone is trivial).
  3.  **Psillos's Lesson:** Commit to the "working" ontology (causal properties). The "stuff" is knowable but must be selected carefully. This avoids Newman (by specifying the nature of relations) but requires a robust method for distinguishing "working" from "idle" parts (which critics argue is often only possible with hindsight).

  As a physicist, you might find Psillos more intuitive. When you use Fresnel's equations, you are implicitly relying on the causal properties of the interface (refractive index, impedance). You aren't just manipulating symbols; you are manipulating quantities that represent physical capacities. Worrall asks you to suspend belief in those capacities and believe only in the symbolic relations. Psillos allows you to believe the capacities are real, provided you don't get attached to the specific mechanical model (the solid ether) used to visualize them.

  The Newman objection essentially tells Worrall: "You can't have your cake (avoiding ontological error) and eat it too (saying something substantial about the world)." Psillos tries to eat the cake by arguing that we can identify the nutritious parts of the ontology without swallowing the poison.
