      *(Self-Correction on Intuitionism)*: The intuitionist move is usually that the conclusion is $\neg \exists p (p \land \neg Kp)$, which classically is equivalent to $\forall p (p \to Kp)$, but intuitionistically is not. Wait, actually, the derivation shows $\neg (p \land \neg Kp)$. Classically, if you assume there is an unknown truth, you get a contradiction. So $\neg \exists p (p \land \neg Kp)$. Classically this means $\forall p (p \to Kp)$. Intuitionistically, it blocks the move to omniscience but leaves you unable to assert there *are* unknown truths. I need to make sure Sarah explains this nuance.

