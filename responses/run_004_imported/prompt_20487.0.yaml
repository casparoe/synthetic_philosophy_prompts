          4.  Contradiction ($Kp \land \neg Kp$).
          5.  So $\neg K(p \land \neg Kp)$ (It's not knowable).
          6.  By Knowability Thesis: If $(p \land \neg Kp)$ is true, it's knowable.
          7.  So $\neg (p \land \neg Kp)$ must be true.
          8.  This implies $p \to Kp$ (All truths are known).
