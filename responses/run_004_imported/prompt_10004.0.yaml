      *   *Rebuttal:* The Library is a *metaphor* for the universe of language/probability, often presented as a divine or absurd creation. But Borges's *philosophical* stance in "Refutation" is skeptical idealism. He wouldn't grant the Library physical reality. He would see Barbour as a theologian of geometry.
      *   *Counter-argument:* Barbour's "Nows" are discrete. Borges liked discrete time.
