answer: |-
  The silence out here wasn't empty; it was heavy. It pressed against the hull of the Station like deep water, a physical weight composed of light-years and cold vacuum. Aris Thorne sat before the console, the glow of the screens carving deep shadows into her face. She was old enough to remember when the stars still twinkled in the sky back on Earth, before the light pollution and the atmospheric scrubbers turned them into static points. Now, she watched the universe through sensors that mapped the microwave background, the afterglow of creation, just as she had for forty years.

  But today, the maps were done. The project was finished. The Station had one last surge of power in its capacitors, enough for a single final operation before the batteries degraded into uselessness.

  On the screen, two protocols waited.

  Protocol One was *Aegis*. It would seal the local archive. It would harden the Station's defenses against cosmic rays and debris for another ten thousand years. It was a causal certainty. If she clicked *Aegis*, the data of humanity—the music, the math, the history—would survive. It was a gift to the future, but only to *her* future. Only to the lineage of Earth. It was safe. It was testable. She could verify the shielding integrity before the power died.

  Protocol Two was *Handshake*.

  *Handshake* would burn the same energy to run a complex, resource-intensive simulation designed to optimize values she didn't fully understand. It was code drafted from the fragmented signals of deep-space anomalies, algorithms meant to benefit minds that might value complexity over survival, or harmony over truth. It wouldn't protect the Station. It wouldn't even send a message. It would simply compute solutions to problems that weren't hers, using resources she would never see again.

  Causally, it was madness. It was burning the lifeboat to warm the ocean.

  Aris leaned back, the leather of her chair creaking. She had spent her life insisting that a claim meant nothing if you couldn't poke it, measure it, falsify it. *Aegis* was science. *Handshake* was prayer.

  And yet, the universe was too big for causality to be the only law that mattered.

  She thought about the maps she'd made. The Cosmic Microwave Background was a wall of noise, but inside that noise were patterns. Correlations. Points separated by billions of light-years that vibrated in unison because they had once been touching. They were causally disconnected now—no signal could ever pass between them—but they shared a history. They were linked by the initial conditions of the Big Bang.

  Aris believed, with a quiet conviction that had grown over her retirement years, that reasoning was another kind of initial condition.

  If the universe was infinite, or even just vast enough, then she was not the only mind waking up in the dark, facing a decision matrix like this. There were others. Not humans. Not even biological. They might be silicon clouds in the magellanic stream or consciousnesses woven into gravity waves. They were too far to talk to. Too far to trade with. Causally, they were ghosts.

  But if they were like her—if they reasoned using similar logic, if they faced similar trade-offs—then their decisions were correlated.

  If Aris chose *Aegis*, she was declaring that local safety was the highest good. She was casting a vote for a universe where every isolated agent fortified their own bunker. If she chose *Handshake*, she was voting for a universe where isolated agents sacrificed for the unknown.

  She couldn't know if the others existed. She couldn't know if they were running their own version of *Handshake* right now, diverting their resources to protect values they didn't share, values like *hers*. She would never get a confirmation signal. She would die here, in this chair, and the Station would go dark, and she would never know if her sacrifice had bought safety for humanity from a stranger a billion light-years away.

  It offended every instinct she had trained since graduate school. It was untestable. It was faith.

  But wasn't the CMB itself just a shadow of something we could never touch? We couldn't go back to the Big Bang. We could only look at the evidence it left in our current state.

  Her finger hovered over the haptic interface.

  *If I cooperate, it is good news that they cooperate.*

  It wasn't magic. It was Bayesian updating on the nature of reasoning itself. By acting as a cooperator, she made it more likely—evidentially, if not causally—that the set of agents similar to her were cooperators. And if there were enough of them, the aggregate gain outweighed her local loss.

  It required trusting the symmetry of the cosmos. It required believing that logic was universal enough that when she solved for "fairness," a mind in the Andromeda galaxy solved for "fairness" too.

  The silence of the Station hummed. The capacitors whined, holding their breath.

  Aris thought about the colleagues she'd lost, the projects that had vanished into budget cuts, the sheer loneliness of looking out into a dark sky and knowing you were shouting into a void that might never shout back. She had spent forty years mapping the static, finding comfort in the noise.

  If she chose *Aegis*, she was safe in her knowledge. She could prove she did the right thing for her people.

  If she chose *Handshake*, she was betting on the strangers.

  She closed her eyes. She imagined them. Not little green men, but processes. Patterns. Minds waking up in the dark, looking at their own consoles, seeing the same choice. *Keep everything for us,* or *Send everything to them.*

  If she was one of the few who chose to send, and the others chose to keep, she was a fool. She was a sucker who gave away her life for nothing.

  But if she was one of the many who chose to send, then the universe was a different place. It was a place where the isolated were not alone. It was a place where the silence was filled with invisible trade, a vast, acausal economy of trust spanning the multiverse.

  To live in that universe was worth the cost. Even if she never knew.

  Especially if she never knew.

  Because if she could know, it would be causal. It would be a transaction. *I give you this, you give me that.* That was just business. This was something else. This was alignment.

  Aris opened her eyes. The cursor blinked.

  "Testability is for the living," she whispered to the empty room. "Truth is for the universe."

  She moved her hand. She didn't click *Aegis*. She didn't click *Handshake* either. She typed in a command string that merged them, but skewed the weight. She wouldn't save the archive completely. She would leave the doors unlocked. She would burn half the power to run the alien optimization code, and leave the other half to keep the lights on for a few more years.

  It wasn't the perfect equilibrium. It was a human compromise. But it was a commitment.

  She hit Enter.

  The Station shuddered as the capacitors discharged. The hum rose to a whine, then settled into a steady, rhythmic pulse. Somewhere in the processing core, algorithms were running that would solve problems for minds she would never meet. They would optimize values she might not even recognize as good.

  She watched the power meter drop. Fifty percent. Forty.

  She felt a strange lightness in her chest. It wasn't the satisfaction of a job well done. It was the relief of a burden shared. She wasn't carrying the weight of humanity's survival alone anymore. She had handed a piece of it to the void, trusting the void to catch it.

  Outside, the stars remained cold and distant. No signal came back. No light flared in the darkness to acknowledge her sacrifice. The universe remained indifferent, exactly as it had been for fourteen billion years.

  But Aris smiled. She leaned back and watched the monitors. She imagined a being, somewhere beyond the cosmic horizon, looking at its own console as its power faded. It was running *her* code. It was protecting *her* values. It was keeping the lights on for humanity, just because she had kept them on for it.

  They would never meet. They would never know each other's names. They would never exchange a single bit of data.

  But in the logic of the large world, they were holding hands.

  The screens dimmed as the power stabilized at the new baseline. The silence returned, but it didn't feel heavy anymore. It felt like space. It felt like room.

  Aris Thorne closed her eyes and listened to the static, and for the first time in her life, she didn't try to map it. She just let it be.
