answer: |-
  # The Impossible Saint: Why Maximizing Utilitarianism Cannot Accommodate Supererogation

  In moral philosophy, few concepts feel as intuitive as supererogation. It is the category of the "moral hero": the person who donates a kidney to a stranger, runs into a burning building to save a cat, or throws themselves on a grenade to shield their squad. We instinctively classify these acts as morally excellent but not morally required. To do them is praiseworthy; to refrain from them is not blameworthy. They exist in a space above duty.

  However, as you have suspected, this intuitive category creates a violent friction with classical Maximizing Utilitarianism (MU). MU posits a single, uncompromising metric for moral rightness: an act is right if and only if it produces the greatest net utility (happiness, well-being, preference satisfaction) available to the agent. If Act A produces more good than Act B, and you can do Act A, then MU dictates you *ought* to do Act A.

  This creates a logical collision. If the grenade jump produces the most net good (saving five lives at the cost of one), MU classifies it as obligatory. If giving away all your disposable income to effective charities saves more lives than buying a coffee, MU classifies keeping the coffee money as morally wrong. In this framework, there is no room for "above and beyond," because "beyond" is simply where the duty lies.

  Your intuition is correct: strict Maximizing Utilitarianism has no coherent room for supererogation. While philosophers have attempted to patch this hole using satisficing thresholds or distinctions between blame and wrongness, these fixes either abandon the core maximizing principle or fail to restore the actual category of the supererogatory. The honest conclusion is that one must choose between the two: you can have maximizing utilitarianism, or you can have supererogation, but you cannot have both.

  ### The Logical Collision

  To understand why the incompatibility is fatal, we must look at the deontic logic of utilitarianism. In most moral systems, actions are divided into three buckets: the forbidden, the permissible, and the obligatory. Supererogation sits in a fourth, privileged bucket: acts that are good to do, but permissible to skip.

  Maximizing Utilitarianism flattens this topology. It operates on a principle of optimization. If morality is defined by the production of good consequences, then failing to produce the *most* good is, by definition, a moral failure. It is akin to saying a calculator is "good enough" if it gets near the right answer. For a utilitarian, the "right" act is singular.

  This leads to what is known as the "Overdemandingness Objection." If MU is true, the average person is in a constant state of moral transgression. Every time you choose leisure over labor that could fund malaria nets, you are violating a moral duty. In this world, the saint and the sinner are not distinct categories; there are only those who are fulfilling their duty (maximizing) and those who are not. The concept of supererogation requires a baseline of duty that stops *before* the point of maximum sacrifice. MU pushes that baseline all the way to the point of maximum sacrifice. Therefore, the category of supererogation collapses into the category of obligation.

  ### The Utilitarian Defense: Satisficing and Self-Interest

  Recognizing this harsh implication, some utilitarians have attempted to modify the theory to save our moral intuitions. The most common patch is "Satisficing Utilitarianism." Proposed by philosophers like Michael Slote, this view suggests that agents are only required to produce a "good enough" amount of utility, not the maximum possible. Once you clear the bar of adequacy, any further good you produce is supererogatory.

  However, your skepticism of this move is well-founded. Satisficing utilitarianism is theoretically unstable. It asks a fundamental question: *Why* is there a bar? If utility is the good, why is it permissible to leave some of it on the table? If I can save one more life with minimal effort, satisficing says I don't have to. This requires positing a moral value independent of utility maximization—perhaps "agent autonomy" or "reasonable effort." But once you introduce a value that trumps utility maximization, you are no longer a pure utilitarian. You have smuggled in a deontological constraint to solve a utilitarian problem. As you noted, this feels like giving up on the theory to save it. It solves the problem of supererogation by ceasing to be Maximizing Utilitarianism.

  Another defense attempts to keep maximizing but lowers the cost of the "maximum." This argument suggests that when we calculate utility, we must weigh the agent's happiness heavily. If jumping on a grenade causes the agent immense suffering (death), perhaps the net utility isn't actually positive. Or, regarding money, if giving away all your income makes you depressed and less productive long-term, then keeping some money maximizes utility.

  While this makes the theory more palatable, it does not restore supererogation. It merely shifts the line of obligation. If, in a specific instance, jumping on the grenade *does* result in the highest net utility (even accounting for the agent's death), the act remains obligatory. If giving away 90% of your income *does* maximize utility, keeping 10% is wrong. This defense argues that heroic acts are rare, not that they are optional. It shrinks the scope of the demand but does not change the nature of the demand. The act remains a duty if it is the maximizer.

  ### The Distinction Between Wrongness and Blameworthiness

  A more sophisticated utilitarian response distinguishes between *objective wrongness* and *subjective blameworthiness*. A utilitarian might argue: "Yes, failing to jump on the grenade is objectively wrong because it fails to maximize utility. However, we cannot expect humans to be perfect calculators of sacrifice. Therefore, we should not *blame* the person who runs away."

  This attempts to preserve the *feeling* of supererogation (we praise the hero, we don't punish the coward) while maintaining the *logic* of utilitarianism (the hero did the right thing, the coward did the wrong thing).

  This distinction fails to save supererogation for a specific reason: Supererogation is not about blame; it is about permission. To call an act supererogatory is to say the agent was *permitted* to do otherwise without moral failing. If the utilitarian admits that running away was objectively wrong, they have denied the act is supererogatory. They have merely argued that we should be lenient in punishing wrongdoers. This is a pragmatic strategy for social cohesion, but it is not a metaphysical defense of the supererogatory category. It admits that the saint did their duty and the rest of us failed ours, we are just too human to admit it.

  ### The Verdict

  So, where does this leave us? We are left with a choice between theoretical consistency and moral intuition.

  The attempts to reconcile Maximizing Utilitarianism with supererogation all suffer from the same flaw: they try to have it both ways. They want the rigorous, single-principle clarity of utilitarianism (maximize the good) while retaining the comfort of common-sense morality (you don't have to be a hero). Satisficing abandons the maximizing principle. The "blame vs. wrongness" distinction abandons the definition of supererogation. The "self-interest" calculation merely moves the goalposts of obligation without creating a category of optionality.

  The most honest utilitarians, such as Peter Singer, admit this. They do not try to prove that supererogation exists within their framework. Instead, they argue that our intuition about supererogation is a bias—a psychological defense mechanism designed to let us off the hook for not doing enough. They argue we should accept that giving to the point of marginal utility is our duty, and that the "saint" is simply a person who does what is required, while the rest of us are morally lacking.

  Therefore, the answer must be definitive. Maximizing Utilitarianism does not have room for supererogation. The logic of maximization is totalizing; it consumes all available moral space. If an act produces the most good, it is required. If it is required, it cannot be supererogatory.

  To believe in supererogation is to believe that there is a limit to what morality can demand of an individual, regardless of the consequences. To believe in Maximizing Utilitarianism is to believe that consequences are the only thing that matters. These are contradictory premises. You can modify utilitarianism until it accommodates supererogation, but in doing so, you break the engine of maximization that makes it utilitarianism in the first place.

  The concept of the "moral hero" relies on the idea that they gave more than was owed. But in a world governed by strict maximizing utilitarianism, everything good you can do is owed. The hero is not going above and beyond; they are simply paying their debts. The rest of us are in arrears. It is a harsh conclusion, but it is the only one that respects the internal logic of the theory. Supererogation is a luxury that Maximizing Utilitarianism cannot afford.
