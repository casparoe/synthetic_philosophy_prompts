      *   **The Deflationary Critique (Firestone/Scholl):** Address the "top-down" experiments. Show how they fail to rule out attention/demand characteristics. This strengthens the Encapsulation view.
      *   **The Expertise Exception (Perceptual Learning):** This is crucial. Acknowledge that experts *do* see differently. But distinguish this from *belief-driven* penetration. Her training retunes the module; her desire does not.
      *   **Application to the Scene:** How does this look in the novel? The brushstrokes are the perception. The "face" is the hypothesis. The tension comes from the gap between the two.
