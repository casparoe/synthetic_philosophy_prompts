answer: |-
  This is a fascinating problem, and your intuition that social fairness does not obey the same invariance principles as condensed-matter physics is well-founded. In physics, if local interactions conserve energy and momentum, the resulting macroscopic state is physically valid, regardless of how uneven the energy distribution becomes (think of a Maxwell-Boltzmann distribution). But in political philosophy, the legitimacy of a macroscopic state often depends on more than the procedural validity of the micro-interactions that produced it.

  To think this through properly, we need to dismantle the analogy between "consensual exchange" and "conservation laws," and then examine the specific nature of your association. I will structure this by looking at the strongest argument against redistribution (the Libertarian/Entitlement view), explaining why your physics intuition correctly identifies its limits, and finally offering a framework for deciding based on the *purpose* of your institution.

  ### 1. The Argument for "Theft": Entitlement Theory
  The members calling the proposal theft are implicitly arguing from a framework most famously articulated by the philosopher Robert Nozick. Nozick used an example almost identical to yours (involving basketball star Wilt Chamberlain) to argue against "patterned" principles of justice (like equality).

  The argument runs as follows:
  1.  **Just Acquisition:** Everyone started with a legitimate claim to their plot (equal size, equal fee).
  2.  **Just Transfer:** Every trade that followed was voluntary. No one was coerced. If I pay you $5 for tomatoes, I value the tomatoes more than the $5, and you value the $5 more than the tomatoes. Both parties are better off.
  3.  **Conclusion:** If the starting point was just, and every step was just, the resulting end state must be just, regardless of how unequal it is. To tax the successful gardeners is to violate their self-ownership; it effectively claims that the community has a prior claim on their labor and skill.

  From this viewpoint, the fact that some members started with more knowledge (human capital) is irrelevant. That knowledge is part of their self-ownership. To tax the fruits of that knowledge is to claim partial ownership of *them*, not just their produce.

  ### 2. Why the Physics Analogy Breaks Down
  You noted that in physics, if local interactions obey conservation laws, nobody complains about the macroscopic state. But physical systems do not have *teleology* (purpose) or *boundary conditions* defined by social contract.

  **A. The Boundary Condition Problem**
  In your garden, the "system" is not an open market; it is a voluntary association with a specific constitution ("deliberately egalitarian terms"). In physics, boundary conditions determine the solution to the differential equations. Here, the "boundary condition" is the founding mission of the garden.
  If the garden were a public street market, the Nozickian argument would hold more weight. But this is a private club with a stated ethos. The "informal economy" is parasitic on the "formal economy." The successful gardeners are using the association's land, water, and collective reputation to generate private profit. The "conservation law" here isn't just consent; it's the preservation of the association's *character*. If the inequality becomes so great that it undermines the egalitarian nature of the club, the "system" has moved outside its operating parameters.

  **B. Path Dependence vs. State Functions**
  In thermodynamics, the change in a state function (like entropy) depends only on the initial and final states, not the path. In justice, the *path* matters immensely.
  The "better equipped" members you mention introduce a variable that physics doesn't account for: **Brute Luck vs. Option Luck.**
  *   **Option Luck:** Risks taken and skills honed *within* the game.
  *   **Brute Luck:** Advantages brought *to* the game (innate talent, prior wealth, pre-existing knowledge).

  The successful gardeners profited partly from option luck (hard work in the garden) but significantly from brute luck (arriving with expert knowledge that others lacked). In many theories of distributive justice (specifically Luck Egalitarianism), it is considered arbitrary to allow brute luck to determine life outcomes within a cooperative scheme. Since the association was founded to be egalitarian, allowing pre-existing inequalities to compound indefinitely via the association's resources violates the spirit of the cooperation.

  ### 3. The Crucial Distinction: Market vs. Community
  The core of your dispute is not actually about property rights; it is about the definition of the association.

  *   **If the Association is a Market:** Then the "theft" argument wins. The goal is efficiency and liberty. Inequality is a signal of value creation.
  *   **If the Association is a Community:** Then the "redistribution" argument wins. The goal is solidarity and shared flourishing. The plots are not merely private fiefdoms; they are shares in a common project.

  The fact that the proposal is to put money into a *common fund* for *water, tools, and compost* is vital. This is not a proposal to write checks to poor gardeners (welfare); it is a proposal to subsidize the *infrastructure* that makes gardening possible for everyone (investment).

  If the successful traders refuse to contribute more, they are effectively engaging in **rent-seeking**. They are extracting value from a commons (the association's egalitarian atmosphere and infrastructure) without paying the maintenance costs required to sustain that commons. If the inequality grows too large, the less successful gardeners may quit, the egalitarian character will vanish, and the "market" will collapse anyway.

  ### 4. Addressing Your Specific Questions

  > *Does the fact that this inequality arose entirely through a chain of individually consensual exchanges settle whether the association may now redistribute it?*

  **No.** Consent validates the *transaction*, but it does not validate the *institutional outcome* if that outcome violates the institution's founding principles. You are not a state enforcing laws on citizens; you are a club enforcing bylaws on members. The association has the right to determine what activities are compatible with its mission. If the mission is egalitarian, and the outcome is oligarchic, the association has the right to adjust the rules to restore the mission, even if it restricts future "consensual" trades.

  > *Must something further be true of the starting point, or of the trades themselves, for that to follow?*

  Yes. The "something further" is the **dependency on common resources.** If these gardeners were growing food in their private backyards and selling it, the association would have no claim. But they are doing this on association land, using association water. The surplus value they generate is a product of *Land + Labor + Capital*. The Association provides the Land and Capital (tools/compost). Therefore, the Association has a claim on a portion of the surplus value generated, proportional to its contribution. The current arrangement allows them to privatize the gains while socializing the costs (wear on tools, water usage).

  > *Does it matter... that a few members began already better equipped than the rest of us, even though every plot and every fee was identical?*

  **Yes, it matters profoundly.** Physical equality of plots does not equate to equality of opportunity if human capital varies wildly. In a commercial enterprise, this is fine; you hire experts. In an *egalitarian community project*, allowing pre-existing expertise to translate into permanent class stratification undermines the purpose of the project. The "equal fee" buys access to the land, but it does not account for the unequal ability to monetize that land. If the goal is shared enjoyment and sustenance, the experts are effectively "arbitraging" the novices.

  ### Conclusion: A Recommendation for Thought
  You are stuck because you are trying to solve a normative problem (what *ought* we to do?) with a procedural heuristic (did everyone agree?).

  As a physicist, consider this: The garden is not an isolated system. It is a dissipative structure maintained by the energy (fees, labor, goodwill) of its members. If the gradient between the "rich" and "poor" gardeners becomes too steep, the system loses stability (resentment, members quitting).

  The proposal to tax the surplus for the *common fund* is not theft; it is a **maintenance fee for the social equilibrium.**

  If I were in your position, I would argue that the "theft" claim relies on treating the garden as a free market, which it was never intended to be. The association has the right to regulate the informal economy to ensure it remains compatible with the formal, egalitarian structure. The successful gardeners are free to leave and farm commercially if they wish to keep 100% of their surplus. But if they wish to remain in an *egalitarian* community, they must pay a premium to sustain that equality.

  The inequality is not unjust because the trades were bad; it is unjust because it threatens the viability of the cooperative structure that makes the trades possible. Redistribution, in this specific context, is not a violation of liberty, but a condition for its continued existence.
