answer: |-
  **MEMORANDUM**

  **TO:** Institute Director and Board of Trustees
  **FROM:** Small Grants Committee on Perception and Cognition
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Proposal #24-09: "Actuarial Analysis of Crisis Apparition Reporting"

  **DECISION:** **Fund with Conditions**

  **Overview**
  The Committee has completed its review of Proposal #24-09, which seeks to replicate and modernize Henry Sidgwick's *Census of Hallucinations* (1894). The project proposes a large-scale, pre-registered survey to measure the coincidence of reported visual/auditory hallucinations with verified administrative death records of acquaintances, aiming to improve upon Sidgwick's original baseline by correcting for selection bias and utilizing objective mortality data.

  The Committee vote was evenly split (2-2). Following deliberation, we have reached a consensus to award funding contingent upon specific methodological safeguards. This decision reflects the Institute's mandate to support unconventional empirical work while maintaining rigorous epistemological standards.

  **Rationale for Funding**
  The majority view supporting funding emphasizes that the proposal addresses the primary fatal flaw of the historical SPR (Society for Psychical Research) data: selection bias. By utilizing pre-registered surveys and cross-referencing self-reports with administrative death records, the researchers are not merely collecting anecdotes but testing a specific probabilistic hypothesis.

  To reject this proposal solely on the nature of the phenomenon under investigation would be to prejudge the empirical outcome. As noted during deliberation, Sidgwick's engagement with psychical research was not a lapse in judgment but a philosophical necessity driven by the "dualism of practical reason." If the conflict between egoism and utilitarianism rests on the assumption of personal termination, empirical evidence regarding survival is not merely fringe curiosity but a variable of significant philosophical weight. The Institute's mission is to fund high-risk, high-reward inquiry into the boundaries of cognition; this project fits that mandate.

  **Addressing the Skeptical Position (The Rejected Case)**
  The Committee takes the dissenting view—that no statistical correction can rescue a design built on volunteered hallucination reports—with the utmost seriousness. The argument that "coincidence" cannot be disentangled from "memory construction" or "retrospective fitting" is the strongest objection to this line of inquiry. History shows that even robust statistical baselines can be undermined by the malleability of human testimony regarding time and perception.

  We acknowledge the risk that funding this work could lend institutional credibility to pseudoscience if the results are misinterpreted. Therefore, the skepticism regarding the reliability of self-reported perceptual anomalies is not dismissed; rather, it is codified into the conditions of the grant. We are funding this study *as a test of the reliability of such reporting under controlled conditions*, as much as a test of the phenomenon itself.

  **Conditions of Award**
  To mitigate the risks identified by the dissenting members and ensure the study's integrity, the following conditions are mandatory:

  1.  **Blind Verification Protocol:** All administrative death records must be matched to survey responses by a third-party data analyst blinded to the hypothesis. Researchers may not access the matched dataset until the analysis plan is locked.
  2.  **Error Rate Analysis:** The primary outcome measure must include a robust calculation of false-positive rates (e.g., reported coincidences where the death did not occur or the timing was demonstrably impossible). The study must be powered to detect null results with the same rigor as positive findings.
  3.  **Pre-Analysis Plan:** The statistical analysis plan must be publicly registered prior to data collection, specifying exactly how "coincidence windows" (e.g., +/- 12 hours) are defined to prevent *p-hacking* via temporal flexibility.
  4.  **Dissemination Agreement:** All public communications regarding findings must explicitly state the study's limitations regarding causality. The grant recipients must agree that a finding of statistical anomaly does not constitute evidence of "survival," but rather an anomaly in perception or reporting that requires further cognitive explanation.

  **Conclusion**
  This decision acknowledges that Sidgwick's question remains empirically unresolved. By funding this proposal with strict guardrails, the Institute allows the data to speak without endorsing the metaphysics. We are not funding a search for ghosts; we are funding a rigorous examination of the intersection between mortality, memory, and perception. If the methodology holds, the result will be valuable regardless of whether the null hypothesis is rejected or confirmed.

  **Approved by:**
  The Small Grants Committee
  *Interdisciplinary Institute for Perception and Cognition*
