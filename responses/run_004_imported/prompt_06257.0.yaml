answer: |-
  **Title:** The Sharp Shadow of Higher-Order Vagueness: Why Epistemicism Wins the War of Attrition

  **Introduction: The Real Battlefield**
  The standard introductory summary of the Sorites debate frames the conflict as a clash between intuition and logic. Supervaluationism (Fine, Keefe) is sold as the view that saves our intuition (there are no sharp boundaries) at the cost of classical logic (bivalence fails). Epistemicism (Williamson) is sold as the view that saves classical logic at the cost of our intuition (there *are* sharp boundaries, we just can't know them).

  However, as you've correctly identified, this framing collapses once Higher-Order Vagueness (HOV) enters the chat. If vagueness is genuine, it shouldn't just apply to "heap" vs. "non-heap"; it should apply to the boundary between "definitely heap" and "borderline heap." The Supervaluationist promise is that they can model this without sharp cuts. The Epistemicist claim is that HOV is just more ignorance.

  Your intuition is correct: HOV is the stress test that breaks the Supervaluationist spine. While your professor's Williamsonian stance might feel counterintuitive, a rigorous analysis of HOV reveals that Supervaluationism does not eliminate sharp boundaries; it merely relocates them to the meta-language, where they are harder to spot but logically fatal. Here is the comparison you need, followed by the verdict you asked for.

  ### 1. The Supervaluationist Dilemma: Admissibility and the Meta-Boundary
  The core mechanism of Supervaluationism is the set of "admissible precisifications." A sentence is supertrue if it is true on all admissible precisifications. A case is borderline if it is true on some admissible precisifications and false on others.

  The HOV objection targets the boundary of this set. Consider the transition from a clear case (supertrue) to a borderline case (no truth value). In the standard Supervaluationist model, this transition is sharp. A sentence either is true on *all* admissible precisifications or it *isn't*. There is no middle ground for "super-supertruth."

  To avoid this, the Supervaluationist must claim that the set of admissible precisifications is itself vague. But this triggers a regress:
  1.  If the set of admissible precisifications is vague, we need a higher-order set of "admissible sets of precisifications" to define it.
  2.  If *that* set is precise, we have posited a sharp boundary at the meta-level (between admissible sets of precisifications and inadmissible ones).
  3.  If *that* set is vague, we need a meta-meta-level.

  Keefe attempts to block this by arguing we don't need to precisify the notion of admissibility itself. But Williamson's critique cuts deep here: For the logic to work, the relation "is an admissible precisification" must do determinate work. If it is indeterminate whether a precisification is admissible, then it is indeterminate whether a sentence is supertrue. But Supervaluationism defines truth *as* supertruth. If supertruth is indeterminate, the theory loses its normative force.

  Consequently, Supervaluationism faces a trilemma regarding HOV:
  *   **Option A:** Accept a sharp boundary between the supertrue and the indeterminate. (This concedes the main Epistemicist point: there is a sharp cutoff, just for "supertruth" rather than "truth".)
  *   **Option B:** Accept an infinite regress of meta-precisifications. (This makes the theory computationally and cognitively impossible.)
  *   **Option C:** Claim the meta-language is precise while the object language is vague. (This implies vagueness is not a general feature of language but a localized glitch, which undermines the philosophical motivation for the view.)

  Most diehard Supervaluationists secretly choose Option A. They deny sharp boundaries for "bald," but they accept a sharp boundary for "true on all admissible precisifications." They have not eliminated sharp boundaries; they have privatized them in the meta-language.

  ### 2. The Epistemicist Advantage: Uniformity of Ignorance
  Williamson's Epistemicism looks absurd at the first order ("There is a specific hair whose removal makes you bald"). But its theoretical virtue shines at the higher orders.

  For the Epistemicist, HOV is not a structural problem; it is an iterative feature of ignorance.
  *   **Order 1:** We don't know where the cutoff for "bald" is.
  *   **Order 2:** We don't know where the cutoff for "knowing the cutoff" is.

  Williamson explains this via **Margin-for-Error Principles**. To know $p$, your belief must be safe (it couldn't easily be false). In borderline areas, beliefs aren't safe. But the margin for error itself is subject to vagueness. We cannot know exactly how much margin for error is required for knowledge.

  This allows Epistemicism to handle HOV without regress or meta-language sharpness. The world is precise (classical logic holds), but our cognitive access is limited in a way that compounds. The "sharp boundary" exists at every level, but our inability to locate it also exists at every level. There is no need for a special "supertruth" apparatus. The logic remains classical (Bivalence holds, Conditional Proof holds), and the explanation for why we *think* there is no sharp boundary is uniform: it is always ignorance, never semantic indeterminacy.

  ### 3. The Cost-Benefit Analysis
  Let's weigh the costs honestly, as your seminar likely hasn't.

  **Supervaluationism Costs:**
  1.  **Logical Deviance:** It invalidates classically valid inference rules (e.g., Conditional Proof, Contraposition) when vague predicates are involved. You cannot assume $P \to Q$ entails $\neg Q \to \neg P$ if $P$ is borderline. This is a massive cost for a theory of *language*, which is supposed to underwrite logic.
  2.  **The Meta-Boundary:** As argued above, it smuggles in a sharp boundary between the supertrue and the gappy.
  3.  **Penumbral Connections:** While Fine originally motivated Supervaluationism to save penumbral connections (e.g., "If John is bald, his brother is bald" shouldn't be true if John is borderline), Supervaluationism actually struggles to validate these without ad-hoc constraints on admissibility.

  **Epistemicism Costs:**
  1.  **Pre-Theoretical Intuition:** It tells us our strong intuition that there is no sharp line is false.
  2.  **Explanation of Ignorance:** It requires a robust explanation of *why* we are ignorant (Williamson uses externalism and safety conditions, which is plausible but heavy-lifting).

  ### The Verdict
  You asked for a commitment, not a hedge. Here it is:

  **Epistemicism is the more defensible overall package.**

  Here is why you should commit to this in your paper:
  The Supervaluationist project is motivated by the desire to respect the intuition that "there is no sharp boundary." However, the Higher-Order Vagueness objection demonstrates that **this desire is incoherent.** You cannot construct a formal semantic model that lacks sharp boundaries without introducing a sharp boundary in the model's definition (the admissibility relation). Supervaluationism is therefore self-undermining: it claims there are no sharp boundaries, but its own truth-conditions rely on a sharp boundary between admissible and inadmissible precisifications.

  Epistemicism, by contrast, is theoretically stable. It accepts that classical logic describes reality perfectly and locates the "fuzziness" entirely within our epistemic access. While the claim that "there is a fact of the matter about the exact grain of sand" is psychologically jarring, it is not logically contradictory.

  In philosophy of language, **logical coherence trumps pre-theoretical intuition.** Our intuitions about vagueness evolved for practical communication, not for metaphysical precision. The fact that Supervaluationism breaks classical logic (a tool we need to reason about the theory itself) to save an intuition that collapses under HOV scrutiny makes it the inferior theory.

  **How to frame this in your seminar:**
  Don't just say "Williamson is right." Say: *"Supervaluationism attempts to solve the Sorites by rejecting Bivalence, but HOV shows that Bivalence returns at the meta-level of admissibility. Epistemicism is the only view that offers a uniform treatment of vagueness across all orders without fracturing classical logic. Therefore, the 'absurdity' of Epistemicism is a necessary cost of semantic coherence."*

  This takes your professor's hint (Williamson's margin-for-error) and weaponizes it against the Supervaluationists in your section by showing that their "no sharp boundary" claim is mathematically unsustainable. It shows you aren't just repeating the reading; you're evaluating the structural integrity of the theories.
