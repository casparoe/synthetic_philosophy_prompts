      *   *Refinement:* Make sure to distinguish between *epistemic* limitation (we don't know) and *ontological* limitation (the data doesn't contain the answer). Molina would argue the data doesn't contain the answer because free will isn't fully encoded in prior physical/social states.

  8.  **Final Polish:** Check tone. Ensure theological terms (*scientia media*, counterfactuals of creaturely freedom, grounding objection) are used correctly. Ensure the COMPAS side is accurate (risk scores, not prophecies).

