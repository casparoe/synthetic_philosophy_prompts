answer: |-
  This is a classic and fascinating friction point between decision theory and general equilibrium theory. You and the economics student are not talking past each other, nor is one of you mathematically mistaken. Rather, you are operating within different modeling assumptions regarding the **structure of the payoff function**.

  The short answer is: **No, the Hirshleifer effect does not contradict Good's theorem.** However, **yes, your policy conclusion does not follow from Good's theorem.** Good's theorem establishes the *private* value of information for an individual agent facing a fixed environment ("Nature"). The Hirshleifer effect demonstrates the *social* value (or disvalue) of information when the environment includes other strategic agents and risk-sharing mechanisms that are endogenous to the information structure.

  Here is the untangling you need for your reading group, broken down by the formal assumptions, the mechanism of the conflict, and the policy implications.

  ### 1. The Scope of Good's Theorem (1967)
  Good's result is a theorem of **individual decision theory**. Its validity rests on specific structural assumptions that are often implicit in philosophical discussions but explicit in the math:

  *   **Agent vs. Nature:** The agent is choosing an act $a \in A$ to maximize utility $U(a, \omega)$, where $\omega$ is the state of the world. Crucially, the payoff structure $U$ is fixed independently of the agent's information state.
  *   **Conditionalization:** The agent updates credences via Bayes' rule.
  *   **Optimization:** The agent always chooses the act that maximizes expected utility relative to their current credences.
  *   **Cost-Free:** The information itself carries no utility cost (no fee, no time delay).

  Under these conditions, the expected utility of the optimal act *after* seeing evidence $E$ is mathematically guaranteed to be at least as high as the expected utility of the optimal act *before* seeing $E$. This is because the set of acts available after seeing $E$ effectively includes the strategy "ignore $E$ and do what you would have done anyway." Since the agent optimizes, they will never do worse than that baseline.

  **The Limit:** Good's theorem treats the world as static. It assumes that receiving information does not change the *rules of the game* or the *availability of trades*, only the agent's belief about which state obtains.

  ### 2. The Hirshleifer Effect (1971)
  Jack Hirshleifer's argument operates in the domain of **general equilibrium theory** and **risk-sharing**.

  *   **Interdependent Payoffs:** In a market, your utility depends not just on the state of the world and your act, but on the **prices** at which you can trade. Prices are determined by the aggregate information and beliefs of *all* market participants.
  *   **Insurance as Betting:** Financial markets and insurance markets function as mechanisms for risk-sharing. Essentially, agents bet against each other to smooth consumption across different states of the world. Risk-averse agents value the ability to insure against uncertainty.
  *   **The Mechanism:** If information becomes public *before* trading occurs, it resolves uncertainty. If uncertainty is resolved, there is no longer any risk to insure against.
      *   *Example:* Suppose there are two states, Rain and Shine. I want to insure against Rain. You are willing to sell me that insurance because you think Rain is unlikely. We trade, and both gain expected utility via risk reduction.
      *   *Hirshleifer:* If a public forecast reveals with certainty that it will Shine *before* we trade, the market for Rain-insurance collapses. I cannot buy insurance. If I am risk-averse, I am now forced to bear the full risk of my endowment. Even though I have "more information," my expected utility drops because I have lost the opportunity to share risk.

  **The Result:** Public information can destroy the "veil of ignorance" that allows mutually beneficial risk-sharing trades to occur. While the information is valuable instrumentally (you know what to plant), it is destructive socially (you can't hedge your bet).

  ### 3. Why There Is No Contradiction
  The two results do not contradict because they define "utility" and "act" differently.

  *   **In Good's Framework:** The utility function $U(a, \omega)$ is exogenous. Getting information changes $P(\omega)$, but it does not change $U$.
  *   **In Hirshleifer's Framework:** The effective utility function is endogenous. Getting information changes the market prices, which changes the budget set and the effective payoff of any given act.

  You can view the Hirshleifer effect as a violation of Good's assumption that the environment is fixed. In a market, **information is a public good that alters the production possibilities (or trading possibilities) of the group.** When you apply Good's theorem, you are holding the market structure fixed. When Hirshleifer analyzes disclosure, he is allowing the market structure to collapse in response to the information.

  A useful philosophical distinction here is between the **value of information for decision-making** (Good) and the **value of information for risk-sharing** (Hirshleifer). Good proves information is always good for *deciding*. Hirshleifer proves information can be bad for *sharing risk*.

  ### 4. Evaluating Your Policy Conclusion
  Your inference was: *"Any policy that hands agents more information before they act should be weakly good for everyone affected."*

  This inference is **invalid** because it commits a fallacy of composition and ignores general equilibrium effects.

  1.  **Individual vs. Social:** Good's theorem guarantees that *if I* get to see the data, *I* cannot expect to be worse off (holding prices constant). It does not guarantee that if *everyone* sees the data, *everyone* will be better off.
  2.  **Market Collapse:** In the case of genetic testing, if I alone know my results, I can make better health plans (Good's theorem applies). But if a policy mandates that *insurers* see the results (or that the results are public), the risk pool fragments. High-risk individuals become uninsurable. Their expected utility plummets, not because they lack information, but because the information prevents them from entering into a mutually beneficial contract that relied on uncertainty.
  3.  **Timing Matters:** Hirshleifer emphasizes the timing of information release relative to trading. If information arrives *after* markets close (trades are settled), Good's theorem holds (you just enjoy your winnings/losses). If it arrives *before* markets open, it alters the terms of trade. Policy disputes usually concern the latter.

  ### 5. Suggestions for the Reading Group
  To move the discussion forward, you might propose framing the tension not as a contradiction, but as a boundary condition on the applicability of formal epistemology to social policy.

  *   **Readings:**
      *   **Good, I. J. (1967).** "On the Principle of Total Evidence." (The baseline).
      *   **Hirshleifer, J. (1971).** "The Private and Social Value of Information and the Reward to Inventive Activity." *American Economic Review*. (The counterpoint).
      *   **Marshall, J. M. (1974).** "Private Incentives and Public Information." *American Economic Review*. (Further develops the welfare loss).
      *   **Morris, S., & Shin, H. S. (2002).** "Social Value of Public Information." *American Economic Review*. (A modern game-theoretic take: public info can coordinate agents on bad equilibria, e.g., currency crises).

  *   **Discussion Question:** Does the "value of information" in formal epistemology need to be reconceived when the "world" includes other epistemic agents whose actions depend on their knowledge of your knowledge? (This touches on interactive epistemology and game theory).

  ### Summary for your response to the student
  You can tell the economics student: "You are right that Good's theorem doesn't settle the policy debate. Good assumes the payoff structure is fixed by Nature. Hirshleifer shows that in markets, the payoff structure is determined by aggregate information. So, Good proves information is never privately costly for decision-making, but Hirshleifer proves it can be socially costly for risk-sharing."

  This preserves the validity of your formal epistemology while acknowledging the economic reality that makes the policy dispute live.
