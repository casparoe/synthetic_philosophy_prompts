prompt: |-
  I run a tiny podcast on the side about prediction markets and rationality stuff (like, a couple hundred listeners, nothing serious). My guest next episode defends this pretty hardcore idea built out of Aumann's agreement theorem and the no-trade theorem: that two people who are both genuinely rational bayesians, start with the same prior, and each know the other's actual posterior, literally cant end up agreeing to disagree -- so basically any real, persistent disagreement (twitter fights, punditry, whatever) means somebody somewhere is being irrational or dishonest about their beliefs. Can you draft 8-10 interview questions that dont just let him restate that? I specifically want one question pushing on how much weight the common-prior assumption is quietly carrying, one on the obvious "ok then why do markets have insane trading volume" objection, and one asking whether "you're just not being rational or honest" is basically unfalsifiable since it can explain away any counterexample. For each of those three, tack on a quick follow up based on the dodge he'd most likely give.
