      *   *Human Element:* Code executes. No specific borrower. But there are other users on the other side (traders, other liquidity providers).
      *   *Purpose:* Purely to increase the number of tokens.

  4.  **Evaluate Person A's Claim (It's Usury):**
      *   *Strengths:* Money breeding money. Infinite accumulation. Detached from real goods (*autarkeia*). The terminology ("yield," "harvest") mimics nature but is artificial.
