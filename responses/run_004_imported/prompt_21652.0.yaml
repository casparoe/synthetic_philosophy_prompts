      *   *The Social/Moral Dimension:* Usury exploits a neighbor. It creates an infinite desire for wealth where there should be a limit.

  3.  **Analyze DeFi (Yield Farming/Liquidity Mining) through Aristotelian Lenses:**
      *   *Mechanism:* Lock tokens -> Smart Contract -> Receive more tokens.
