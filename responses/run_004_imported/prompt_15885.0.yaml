answer: |-
  This is a fantastic prompt. You're referring to Bentham's manuscript *Offences Against One's Self* (written c. 1785, published in full only in 1978). Your professor is right: it is one of the most radical texts of the 18th century, precisely because it strips away theological and natural law justifications and insists on a strict audit of "assignable harm."

  The core mechanic you identified is the **Antipathy Principle**. Bentham argues that when legislators ban something like sodomy, they claim it causes "harm." But if you press them, the "harm" turns out to be nothing more than the discomfort (antipathy) the observer feels. For Bentham, **disgust is a sensation in the observer, not a damage to the actor.** To punish the actor for the observer's sensation is to sacrifice the many (potential actors) to the whim of the few (the disgusted).

  However, Bentham is not a modern libertarian. He is a *calculating* institutionalist. He doesn't start from "rights"; he starts from "security" and "expectation." If we run his specific machinery over your three modern cases, we get results that are permissive but often regulatory, and in some places, genuinely illiberal by today's standards.

  Here is the breakdown of how the Benthamite calculus applies to sex work, polyamory, and BDSM, followed by where his framework cuts against the modern consensus.

  ---

  ### 1. Sex Work: Regulation over Prohibition
  Bentham actually wrote about prostitution separately from homosexuality. His view here is driven by the management of **collateral mischief**.

  *   **The Argument for Decriminalization:**
      *   **No Assignable Victim:** In a transaction between a sex worker and a client, there is no primary mischief (no harm to a non-consenting party).
      *   **The Pain of Prohibition:** Criminalization creates immense pain (arrest, imprisonment, stigma) without preventing the act. It drives the trade underground, increasing the risk of violence and disease.
      *   **Antipathy Check:** Moral outrage against "selling sex" is, like sodomy, largely antipathy. It treats a commercial exchange as a sin rather than a contract.

  *   **The Benthamite Catch (Where he diverges from modern liberals):**
      *   **Public Nuisance:** Bentham was obsessed with public order. While the act might be harmless, *solicitation* causes "uneasiness" or "alarm" to bystanders. Bentham would likely support strict zoning or invisibility clauses. The liberty of the worker ends where it causes pain (discomfort) to the public sphere.
      *   **Health as Security:** Venereal disease is a clear "assignable harm" to third parties (partners, children, the public health system). Bentham would almost certainly mandate registration and health inspections. This isn't moralism; it's hygiene calculus.
      *   **Coercion vs. Poverty:** Bentham distinguishes between voluntary exchange and coercion. However, he was sensitive to the idea that extreme necessity undermines consent. If the "choice" is starvation or sex work, the utility calculation gets murky. He might support state support (welfare) to ensure the transaction is truly voluntary, rather than banning the transaction.

  **Verdict:** Decriminalize the act, but heavily regulate the *conditions* (health, visibility) to minimize secondary pains.

  ### 2. Polyamorous Households: The Problem of Legal Security
  This is where Bentham's obsession with **legal certainty** clashes with modern relationship fluidity. Bentham's jurisprudence is built on "expectation." The law's job is to allow people to plan their lives with security.

  *   **The Argument for Recognition:**
      *   **Happiness Maximization:** If three adults living together creates more happiness (economic efficiency, companionship, childcare) than two, the state should facilitate it.
      *   **Antipathy Check:** Banning polyamory is based on religious/traditional antipathy, not harm. Preventing adults from cohabiting causes direct pain (separation, loss of support).

  *   **The Benthamite Catch:**
      *   **Contractual Complexity:** Bentham viewed the law as a tool to secure property and inheritance. A multi-party domestic contract introduces exponential complexity regarding inheritance, next-of-kin status, and liability. If the law recognizes a triad, and one leaves, the calculative burden on the courts to divide assets increases the risk of litigation (pain).
      *   **Child Welfare (Future Utility):** Bentham was a strong defender of children's interests (as non-consenting parties). He might argue that complex household structures create instability for children, reducing their future capacity for happiness. He wouldn't ban it, but he might refuse state *sanction* (marriage licenses) because the state cannot guarantee the security of the arrangement.
      *   **The "Main" Contract:** Bentham might prefer a model where one legal marriage exists, and other partners have private contracts. Full equal recognition might be seen as creating too much legal friction.

  **Verdict:** Tolerate the living arrangement (privacy), but hesitate to grant full *legal* status if it threatens the clarity of property and custody expectations.

  ### 3. BDSM and Contracts: The Limits of Consent
  This is the sharpest point of divergence. Modern liberalism often treats consent as a magic wand: if you consent, it's not harm. Bentham's utilitarianism is more paternalistic about **future capacity**.

  *   **The Argument for Legitimization:**
      *   **Consensual Pain is not Harm:** In the felicific calculus, if the "pain" of a flogging is purchased by the pleasure of the recipient and the giver, the net utility is positive. It is a preference satisfaction.
      *   **Antipathy Check:** Disgust at kink is just antipathy. If no permanent damage occurs, the state has no business intervening.

  *   **The Benthamite Catch:**
      *   **Irrevocability and Liberty:** Bentham values liberty because it allows for future happiness. A contract that binds you irrevocably (e.g., "total power exchange" or permanent servitude) destroys your future ability to calculate utility. Bentham would likely void any contract that alienates your future liberty, even if you consent to it *now*. You cannot sell yourself into slavery, even sexually, because you cannot consent for your *future self*.
      *   **Permanent Damage:** If a kink act results in permanent bodily damage, Bentham would likely classify this as a harm, regardless of consent. Why? Because it reduces the individual's total capacity for future pleasure. A crushed limb reduces future utility; a bruise does not. The line is drawn at *capacity*, not just sensation.
      *   **Mental State:** If the "submissive" is in a headspace (subspace) where they cannot rationally calculate pain/pleasure, the consent is void. Bentham requires rational actors for valid contracts.

  **Verdict:** Legalize the acts, but void contracts that threaten future liberty or permanent physical capacity. Consent is necessary but not sufficient.

  ---

  ### Where Bentham Cuts Against the Modern Liberal Consensus

  If you want to spark a real debate in your seminar, here are the three points where Bentham's framework is not "progressive" in the modern sense, but rather **technocratic and potentially illiberal**:

  **1. Populationism (The Pronatalist Bias)**
  Bentham was a utilitarian, and for him, more people generally meant more potential happiness. He viewed non-procreative sex (homosexuality, contraception, some forms of kink/sex work) as "unproductive."
  *   **The Conflict:** While he argued *against* criminalizing homosexuality (because punishment causes more pain than the act), he did not view it as socially *beneficial*. A modern liberal argues gay marriage is a positive good. Bentham would argue it is a **neutral indulgence** that the state should tolerate but not necessarily encourage. He might support tax structures that favor procreative households, not out of moralism, but out of demographic calculus.

  **2. The Tyranny of Publicity (The "Shock" Principle)**
  Bentham was not a free-speech absolutist. He believed that if an act causes "alarm" or "shock" to the public, the state can restrict its *visibility*.
  *   **The Conflict:** Modern liberalism often argues for the right to public expression (Pride parades, public displays of affection). Bentham might argue that if a public display causes measurable "uneasiness" to the majority (antipathy), the state can restrict it to the private sphere to maintain public order. He would protect the *act*, but not necessarily the *spectacle*. He prioritizes the quietude of the public over the expressive liberty of the individual.

  **3. Paternalism Regarding "Future Utility"**
  Modern liberalism says, "It's my body, I can do what I want." Bentham says, "You are a vessel for happiness; do not damage the vessel."
  *   **The Conflict:** This applies to extreme BDSM, but also to drug use or risky behaviors. If an action permanently reduces your capacity to experience pleasure or contribute to society, Bentham's framework allows for state intervention. He is a **soft paternalist**. He doesn't care about "dignity" or "autonomy" as intrinsic values; he cares about your future utility. If you want to consent to something that ruins your future utility, the law might stop you for your own good (and society's).

  ### Summary for your Seminar
  Bentham's argument isn't that "anything goes." It's that **law is expensive.** It costs pain (punishment). Therefore, it should only be used when it prevents greater pain.

  *   On **sex work**, he's a regulator, not a liberator (focus on health/order).
  *   On **polyamory**, he's a skeptic of legal complexity (focus on security/expectation).
  *   On **BDSM**, he's a paternalist about permanent harm (focus on future capacity).

  His radicalism lies in refusing to let **antipathy** count as **harm**. But once you remove antipathy, he still subjects everything to a cold audit of security, health, and population. He clears the ground of moralism, only to build a bureaucracy of utility in its place.
