      *   **The Family Perspective:** How non-philosophers see vows (External/Rock solid).
      *   **The Philosopher Perspective:** How philosophers see vows (Internal/Contingent on desire).
      *   **The Synthesis (The "Work" of the Speech):** Marriage isn't choosing one side. It's the *tension* between them. The vow is a machine that turns internal feelings into external obligations, and external obligations back into internal desires.
      *   **The Resolution (Non-Resolution):** Acknowledge that this is hard. It's not a fairy tale. It's a commitment to keep showing up when the "reason" isn't there.
      *   **Closing:** Toast to the couple. Bring it back to love.

  4.  **Drafting - Tone and Voice:**
      *   *Avoid:* "As Bernard Williams argues in 'Internal and External Reasons'..." (Too academic).
      *   *Try:* "My niece studies why we do what we do..." (Warmer).
      *   *Avoid:* Jargon like "subjective motivational set."
      *   *Try:* "What you want," "What moves you," "The fire inside."
      *   *Key Metaphor:* Physics (forces, gravity) mixed with Philosophy (reasons, vows).

  5.  **Iterative Refinement (Self-Correction during drafting):**
