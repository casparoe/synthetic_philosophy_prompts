      *   **The Tension:** Is a wedding vow binding only while the desire lasts (Internal), or does it create an obligation that survives the fading of desire (External)?
      *   **Constraint:** The tension must *do the work* of the speech, not just be decoration. It must land as *love*, not a seminar. It must *not* resolve the difficulty neatly (acknowledge the hardness of marriage).
      *   **Length:** Approximately 5 minutes (roughly 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophical Concept (Williams):**
      *   *Internal Reasons:* "I have a reason to $\phi$ only if I have some motive in my subjective motivational set that would be served by $\phi$-ing." (Roughly: I do it because I want to, or it connects to what I want).
      *   *External Reasons:* "I have a reason to $\phi$ even if nothing in my motivational set connects to it." (Roughly: I ought to do it, regardless of how I feel).
      *   *The Wedding Vow:* "I will." Does this mean "I will as long as I love you" (Internal) or "I will, even when I don't feel like it" (External)?
      *   *The Uncle's Voice:* Physicist turned philosopher. Comfortable with uncertainty, respects rigor, but prioritizes human connection. Needs to sound wise, not pedantic.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the dual audience. Establish the speaker's background (physics/philosophy). Introduce the niece's field without being dry.
