answer: |-
  Good evening. For those who don't know me, I'm [Name], the uncle. I spent forty years as a physicist, chasing equations that describe how the world *is*. In retirement, I've taken up philosophy, largely under the tutelage of the bride, chasing questions about how we *ought* to live.

  So, standing here today, I find myself at the intersection of my two lives. And since my niece is finishing her doctorate on practical reasons, I felt it would be inappropriate—perhaps professionally hazardous—to offer a toast that lacked philosophical rigor.

  Specifically, I've been thinking about Bernard Williams. Many of you know the distinction he drew between internal and external reasons. Roughly: an internal reason is grounded in what you already desire. I have a reason to drink this wine because I'm thirsty. An external reason is supposed to stand outside your desires. I have a reason to tell the truth, even if I desperately want to lie.

  Williams was skeptical about external reasons. He suggested that without a desire to anchor them, they don't really exist. They are ghosts.

  And this brings me to the wedding vow. The core of the ceremony is two words: "I will."

  To the family here, who are not philosophers, those words sound like a rock. They sound like an external reason. You hear: "I will love you, even when I do not feel like it. I will stay, even when the desire to stay has evaporated." You understand the vow as a machine that creates an obligation independent of the weather inside the heart.

  But to the philosophers in the room, those same words sound precarious. If Williams is right, a reason requires a motive. So, "I will" really means "I will, for as long as my subjective motivational set aligns with this promise." If the desire dies, the reason vanishes. The obligation was never truly external; it was just a projection of a temporary feeling.

  For a long time, as I watched my niece and her partner together, I worried about this. I worried that if we admit the philosophers are right, marriage is fragile. If love is only binding while it is desired, then it is not a covenant; it is a subscription service, cancellable when the satisfaction dips.

  But then I realized: Marriage is not the resolution of this tension. Marriage is the decision to live inside it.

  A wedding vow is not a description of the present. It is an attempt to build a bridge from the internal to the external. It is a bet.

  When you stand here today, the "internal" is overflowing. The desire, the chemistry, the motivation—it is all there. It is easy to say "I will" when the "will" is powered by joy. But you know, better than anyone, that desires are like weather. They are internal, they are real, but they are transient.

  There will be days, perhaps years, when the internal reason is gone. When the "subjective motivational set" offers no support for kindness. When the physics of the room suggests you should walk away.

  On those days, the vow attempts to function as an external reason. It says: "You have a reason to stay, not because you want to, but because you *said* you would."

  Now, Williams might tell you that this is impossible. That you cannot have a reason you don't feel. And he might be logically right. But he is not married.

  Because here is the alchemy that my niece and her partner are attempting: The external obligation is not there to replace the love. It is there to keep the seat warm until the love returns.

  The vow creates a structure. It forces the behavior of love when the feeling of love is absent. And often, miraculously, by doing the thing you have no internal reason to do, you find a new internal reason has grown in the doing. You stay, you serve, you listen, not because the fire is burning, but because you promised. And in the keeping of the promise, you strike the match again.

  So, I am not going to wish you a marriage where the internal reasons never fade. That is a fantasy. I am not going to wish you a marriage where the external reasons feel heavy and dutiful. That is a burden.

  I wish you the courage to let the tension hold.

  When the desire is strong, let it carry you. When the desire is weak, let the obligation carry you. Do not worry if the philosophers in the back of the room are whispering that your reasons are category errors. Do not worry if the family in the front is whispering that it's just magic.

  It is both. It is the hard work of turning a feeling into a fact, and a fact back into a feeling.

  My niece, you have spent your doctoral years analyzing why we do what we do. Today, you commit to doing what you say, so that you may continue to love who you chose.

  To the bride and groom. May your internal reasons be abundant, may your external reasons be sturdy, and may you never confuse the two.

  Cheers.
