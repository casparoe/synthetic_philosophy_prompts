  **Move 1 (Owen):** Score: 2. Owen is textually accurate regarding Aquinas's *Commentary on the Sentences*. In that early work, Aquinas does distinguish the usurper (*tyrannus ex defectu tituli*) from a legitimate ruler, arguing that killing a usurper is not sedition because no legitimate order is being disturbed. Ana explicitly concedes this reading in her response, validating Owen's textual claim even if she disputes its scope.

  **Move 2 (Ana):** Score: 2. Ana correctly identifies the crucial scholastic distinction between a usurper and a legitimate ruler who becomes tyrannical (*tyrannus ex parte exercitii*). Her citation of *De Regno* (On Kingship) reflects Aquinas's more mature and cautious political thought, where he warns against private individuals judging legitimate rulers due to the risk of greater disorder and ambition. This is the standard consensus view in Aquinas scholarship.

  **Move 3 (Owen):** Score: 1. Owen correctly notes that the *Summa Theologiae* removes the label of sedition from resistance against a tyrannical regime. However, his inference that this automatically licenses *private* violent removal in the "legitimate ruler gone bad" case is a logical leap. Removing the sin of sedition does not necessarily confer the positive right of execution upon private individuals, a distinction central to Thomistic jurisprudence regarding punishment and authority.

  **Move 4 (Ana):** Score: 2. Ana successfully identifies the gap in Owen's argument. She correctly distinguishes between negative permission (an act is not sinful) and positive authorization (an act is within one's jurisdiction). By reiterating that Aquinas channels correction of legitimate rulers through public authority or prayer, she maintains the coherence of Aquinas's mature political theory against Owen's maximalist reading.

  **Adjudication Summary:**
  Both scholars are grappling with the development of Aquinas's thought, but Ana holds the stronger position regarding his considered view. Owen is right about the permissiveness of Aquinas's early work (*Sentences*) and the *Summa*'s definition of sedition, but he elides the evolution in Aquinas's thinking toward the necessity of public authority for deposition. Ana correctly highlights that Aquinas's mature position restricts private tyrannicide mostly to usurpers, treating the removal of legitimate rulers as a public function to prevent anarchy. Both scholars, however, arguably elide the tension within Aquinas's own corpus between the natural law right to defend the community and the positive law requirement for public authority, leaving ambiguous whether a "private" act undertaken solely for the common good might still be justified in extreme cases where public authority has completely collapsed.
