      *   **The Collapse:** If God exists ($\exists x G(x)$), then $\square \exists x G(x)$ (by Gödel). But Sobel showed that given the axioms, $\phi \to \square \phi$ for *any* proposition $\phi$. The logic becomes S5 on steroids, collapsing contingency.
