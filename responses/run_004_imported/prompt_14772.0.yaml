prompt: |-
  ok this one's pretty in the weeds but I've been chewing on it for a seminar paper (doing a phil PhD, my advisor keeps telling me to quit going down Gödel rabbit holes but here we are). forget the classic ontological argument objections everyone already knows by heart -- existence isn't a predicate, perfect island, etc -- I want a dialogue thats specifically about Gödel's modal version and the modal collapse problem, i.e. Sobel's point that his axioms entail that literally everything true ends up necessarily true, so there's no real contingency left in the world. can you write me a short dialogue, two people hashing it out at a whiteboard: one thinks modal collapse basically wrecks the proof as a piece of natural theology, the other thinks its survivable (could go the Anderson route of tweaking the positivity axioms, or just bite the bullet on necessitarianism). they should actually engage with each other's specific moves -- is the fix ad hoc, is biting the bullet really that cheap -- rather than just trading "so god exists" / "thats absurd" one-liners back and forth. a page or so is plenty, dont need the whole formal proof spelled out, just the philosophical meat.
