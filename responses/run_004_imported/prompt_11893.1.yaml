prompt: |-
  I've been reading LessWrong and the whole SSC/ACX-verse for something like a decade now, and one thing that comes up a lot in the precommitment/Schelling-fence genre of posts is the "Ulysses contract" idea: binding your future self to a decision your present self endorses, the way Ulysses had his crew bind him to the mast so that future Ulysses, driven half mad by the sirens' song, couldn't get free and steer the ship onto the rocks. I always found it more fun as an abstract puzzle than anything else, but I actually sit on the ethics committee of a psychiatric hospital, and we've now got a real case that's basically this puzzle wearing a hospital gown. I got voluteered to draft the committee's opinion because everyone there knows I'm "the one who reads too much philosophy."

  Here's the case, details changed for privacy. Patient, call her M., has bipolar I with three prior manic episodes, each one ending in involuntary commitment after real damage to her finances and relationships. About eighteen months ago, while stable and independently assessed as fully competent, she executed a detailed psychiatric advance directive with a self-binding "Ulysses clause": objective triggers (sleeping under four hours a night for three nights running, confirmed jointly by her psychiatrist and her sister), a pre-approved medication list, a named proxy, and explicit language saying that if she objects once the directive is triggered, that objection is to be treated as a symptom and disregarded, and that the directive cannot be revoked mid-episode. She is now, by all clinical accounts, in a triggered episode -- except she isn't globally incompetent, she's articulate and coherent, and she's contesting both whether the sleep-log criteria were actually met and whether she still wants any of this, full stop. Her longtime psychiatrist wants the directive honored as written; the covering resident and her boyfriend of two months want her current, stated wishes honored instead; and the hospital has no actual policy on Ulysses clauses, just boilerplate language about honoring advance directives "where legally valid."

  I need a first draft of the opinion I'll bring to committee this Thursday. I want it to actually recommend what happens with M. this week, not just list considerations, and to sketch a concrete going-forward policy, with a real timeline for adopting it, so we're not improvising the next time this comes up. Most of all, don't let it collapse into "respect her past self vs. respect her present self" -- I want real engagement with what seems to me like the sharpest objection to Ulysses contracts in practice: if whether the trigger fired is itself something the in-crisis person can contest, then the device only binds people who don't fight it very hard, which seems to defeat the entire point of having one. And if there's room, I'd love a short paragraph on whether this is just the individual-scale version of the puzzle constitutional theorists like Jon Elster raise about entrenched constitutional clauses -- why a supermajority from years ago gets to bind a supermajority today -- because the structure looks identical to me and I've never seen anyone actually argue for why the two cases should come apart.
reasoning: |-
  Here's a thinking process that leads to the suggested ethics committee opinion:

  1.  **Analyze the Request:**
      *   **Context:** The user is a member of a psychiatric hospital ethics committee, well-read in LessWrong/SSC/ACX philosophy (specifically precommitment/Ulysses contracts/Schelling fences).
      *   **Task:** Draft an ethics committee opinion regarding a specific patient case (M.) and propose a concrete hospital policy for the future.
      *   **Case Details:** Patient M. (Bipolar I) signed a Ulysses-style psychiatric advance directive (PAD) while competent. Triggers: <4 hours sleep for 3 nights (verified by psych + sister). Action: Pre-approved meds, named proxy, *no revocation during episode*. Current status: Triggers seemingly met, but M. is articulate/coherent, contesting the trigger data and the directive itself. Conflict: Longtime psych (honor directive) vs. Resident/Boyfriend (honor current wishes).
      *   **Key Constraints/Requirements:**
          *   Must recommend a specific action for *this week* (not just "considerations").
          *   Must sketch a concrete going-forward policy with a timeline.
          *   Must engage deeply with the "contestation objection" (if the trigger can be contested by the manic self, the contract fails).
          *   Must avoid simplistic "Past Self vs. Present Self" dichotomies.
          *   Include a paragraph connecting this to Jon Elster/constitutional entrenchment (why past supermajorities bind current ones).
          *   Tone: Professional, ethical, legally aware (but not legal advice), philosophically rigorous (matching the user's background).

  2.  **Deconstruct the Ethical Problem:**
      *   **Autonomy:** Which self represents "true" autonomy? The competent past self or the potentially impaired (but articulate) present self?
      *   **Beneficence/Non-maleficence:** Treating the mania prevents harm (finances, relationships, safety), but forced treatment causes distress and potential trauma.
      *   **The "Contestation" Loophole:** This is the crux. If M. can argue the sleep data is wrong, the Ulysses contract relies on a factual determination that the *current* self has a strong incentive to lie about. If the committee defers to her current contestation, the contract is toothless. If they ignore her contestation without robust verification, they risk abusing a technically competent person.
      *   **Legal/Policy Reality:** "Boilerplate language" isn't enough. We need a standard of evidence for triggers.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Ethics Committee Memo format.
      *   **Executive Summary/Recommendation:** Needs to be decisive. Honor the directive *conditionally* based on independent verification of the trigger.
      *   **Case Analysis (The "Why"):**
          *   Address the competence issue. Bipolar mania isn't always global incompetence. It's often specific impairment in risk assessment.
          *   Address the Ulysses Clause validity. It's a valid exercise of autonomy *if* the safeguards work.
          *   **The Core Philosophical Engagement:** The "Contestation Objection." How do we solve the "manic self lies about the trigger" problem? We need an *epistemic firewall*. The verification of the trigger must happen *before* the patient is fully manic or rely on objective data the patient cannot plausibly manipulate.
      *   **Specific Recommendation for M.:**
          *   Don't just say "Yes." Say "Yes, provided X."
          *   Independent audit of the sleep logs (actigraphy? pharmacy records? sister's affidavit?).
          *   If audit confirms triggers -> Enforce directive.
          *   If audit is ambiguous -> Default to least restrictive alternative (maybe voluntary admission first).
      *   **Policy Proposal:**
          *   Need a "Ulysses Protocol."
          *   Criteria for validity (specificity of triggers, independent verification mechanisms).
          *   Review process (who decides if the trigger fired?).
          *   Timeline (Draft -> Legal Review -> Board Approval -> Training).
      *   **The Elster/Constitutional Analogy:**
          *   Why bind the future? Because the future self has a *systematic bias* (mania) that the past self (competent) identified.
          *   Constitutional entrenchment protects against transient passions of the majority. Psychiatric entrenchment protects against neurochemical hijacking of the agent.
          *   Difference: Constitutions assume the *current* majority is capable of reason but passionate. Mania assumes the *current* agent is cognitively distorted regarding specific risk assessments.

  4.  **Refining the Tone:**
      *   The user knows their philosophy. Don't dumb it down. Use terms like "diachronic autonomy," "epistemic asymmetry," "akrasia."
      *   Keep it clinical enough for a hospital record.
      *   Ensure the recommendation is actionable.

  5.  **Addressing the "Contestation Objection" (The Hard Part):**
      *   If M. can contest the trigger, the contract is weak.
      *   *Solution:* The contract is only valid if the trigger verification is *external* to the patient's current testimony.
      *   In M.'s case: The sister and psychiatrist must sign off *before* the crisis peaks, or the data must be objective (e.g., smartwatch data, pharmacy refill records).
      *   If the patient can successfully argue the data is wrong, the committee must weigh the *probability* of error vs. the *risk* of mania. Given the history (3 prior commitments), the risk of ignoring the directive is high.
      *   *Decision:* The burden of proof shifts. Normally, we prove incompetence to treat. Here, the PAD shifts the burden: The patient must prove the trigger *didn't* fire by objective standard, not just subjective assertion.

  6.  **Developing the Policy Timeline:**
      *   Immediate: Interim guidance for M.
      *   30 Days: Draft policy.
      *   60 Days: Legal/Compliance review.
      *   90 Days: Board adoption.
      *   6 Months: Staff training.

  7.  **Review against Constraints:**
      *   *Recommend action?* Yes (Audit triggers, enforce if confirmed).
      *   *Policy sketch?* Yes (Ulysses Protocol).
      *   *Contestation objection?* Yes (Epistemic firewall/burden of proof shift).
      *   *Elster paragraph?* Yes.
      *   *Tone?* Appropriate for a philosophically literate clinician/committee member.

  8.  **Final Polish:** Check for clarity, ensure the distinction between "competence" and "capacity" is handled carefully (legal terms vary by jurisdiction, so keep it ethical/clinical). Ensure the recommendation protects the hospital from liability while prioritizing patient welfare. (Self-Correction: Make sure not to give definitive legal advice, frame it as ethical guidance pending legal review).

  9.  *(Self-Correction during drafting)*: I need to be careful not to sound *too* abstract. This is a real hospital. The recommendation needs to be something a doctor can actually do on Thursday.
      *   *Action:* Convene a rapid review of the sleep data *today*. If the sister confirms the log, proceed with meds per PAD. If the data is ambiguous, seek emergency court order rather than relying solely on the PAD, to protect the hospital.
      *   *Wait, no:* The prompt asks to honor the Ulysses contract logic. If we go to court every time, the contract is useless. The Ethics Committee needs to back the doctor *if* the verification process was robust.
      *   *Revised Action:* Verify the verification process. Did the sister and psych sign off *before* M. objected? If yes, honor it. If no (i.e., they are being asked now), the process is flawed.
      *   *Let's assume the triggers were noted, but M. is now contesting the accuracy.* The Committee should recommend an independent review of the raw data (actigraphy, etc.). If objective data supports the trigger, honor the PAD despite objection. This addresses the contestation loophole.

  10. **Finalizing the Elster Connection:** Ensure it highlights the *structural* similarity (binding future agents to prevent self-harm due to temporary distortion) but acknowledges the *stakes* difference (individual health vs. societal governance).

  11. **Final Review:** Does this sound like it came from a LessWrong reader? Yes, it uses the conceptual framework but applies it to clinical reality.

  *(Drafting the response based on these thoughts...)*
answer: |-
  **MEMORANDUM**

  **TO:** Hospital Ethics Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 24, 2023
  **RE:** Case M-2023-14 (Psychiatric Advance Directive & Precommitment Triggers)

  ### I. Executive Summary & Immediate Recommendation

  The Committee is asked to adjudicate a conflict between Patient M.'s contemporaneous refusal of treatment and a Psychiatric Advance Directive (PAD) executed during a period of documented capacity, which includes a "Ulysses clause" waiving the right to revoke consent during a manic episode.

  **Recommendation:** The Committee recommends honoring the Advance Directive, *contingent on an immediate, independent audit of the trigger criteria.*

  Specifically, we recommend the treating team secure objective verification of the sleep data (e.g., actigraphy, pharmacy refill records, or sworn affidavit from the sister regarding the specific nights in question) within 24 hours. If the objective data confirms the trigger criteria (<4 hours sleep for 3 consecutive nights) were met prior to the onset of acute agitation, the directive should be enforced as written, and medication administered per the pre-approved list, notwithstanding M.'s current objection. If the objective data is ambiguous or unavailable, the hospital should seek an emergency court order rather than relying solely on the PAD, to mitigate liability risk.

  We do not recommend deferring to M.'s current verbal contestation of the trigger. To do so would render the Ulysses clause functionally null, as the precise scenario the clause is designed to prevent is a high-functioning, manic-driven rationalization against treatment.

  ### II. Ethical Analysis: The Contestation Objection

  The core ethical tension here is not merely "Past Self vs. Present Self." That framing collapses into a metaphysical stalemate. The sharper issue is epistemic: **Can a precommitment device survive the agent's active attempt to dismantle it?**

  If a Ulysses contract allows the bound agent to contest the validity of the trigger *after* the bind has engaged, the contract selects for failure. It binds only those patients who are too confused to argue or too compliant to resist. For a patient like M., who is articulate and coherent, the "loophole" of contesting the trigger data (e.g., "I slept more than you think," "My sister is lying") becomes the primary weapon of the pathology.

  Therefore, the ethical validity of a Ulysses clause rests on an **Epistemic Firewall**. The verification of the trigger must be:
  1.  **External:** Relying on data not generated solely by the patient.
  2.  **Temporal:** Verified as close to the event as possible, before the patient's capacity to manipulate the narrative degrades.
  3.  **Burden-Shifting:** Once the external proxy (sister/psychiatrist) certifies the trigger, the burden of proof must shift to the patient to provide *objective* evidence of error, not merely subjective assertion.

  In M.'s case, she signed a waiver acknowledging that her future objections would be treated as symptoms. To honor her *autonomy* (diachronic autonomy) requires us to treat her current objection exactly as she instructed us to treat it: as data point indicating the episode has begun, not as a veto. Ignoring her prior instruction because she is currently insisting on it would be a failure of beneficence and a violation of the autonomy she exercised when competent.

  ### III. Constitutional Entrenchment and the Elster Analogy

  It is worth noting that this clinical puzzle is structurally identical to the problem of constitutional entrenchment discussed by Jon Elster. In constitutional theory, we ask why a supermajority from decades ago should bind a current majority that may wish to amend the charter. The justification is that the past majority sought to protect long-term structural integrity against the "transient passions" of the present.

  In psychiatry, the "transient passion" is neurochemical. The competent self (the constitutional framer) recognizes that the future self (the current legislature) will operate under a systematic cognitive bias (mania) that distorts risk assessment. The Ulysses clause is not a restriction on freedom; it is a preservation of the agent's long-term preference structure against a temporary hijacking of the decision-making apparatus. The difference, of course, is stakes: a constitutional error risks policy instability; a psychiatric error risks bankruptcy, homelessness, or death. This asymmetry strengthens the argument for honoring the entrenchment in the clinical case, provided the "amendment process" (the trigger verification) is robust.

  ### IV. Proposed Policy: The "Precommitment Protocol"

  We cannot continue to adjudicate these cases *ad hoc*. The hospital requires a formal policy to validate Ulysses clauses without exposing the institution to battery claims. I propose the following timeline for adoption:

  **Phase 1: Drafting (Weeks 1-4)**
  *   Form a working group (Ethics, Legal, Psychiatry, Patient Advocacy).
  *   Define "Valid Trigger Criteria." Triggers must be objective (e.g., specific sleep data, spending thresholds, police reports) rather than subjective (e.g., "acting irritable").
  *   Define "Verification Mechanism." A Ulysses clause is only valid if it names an independent verifier (not the treating physician alone) who must sign off on the trigger *before* enforcement.

  **Phase 2: Legal & Compliance Review (Weeks 5-8)**
  *   Review against state mental health code. (Note: Some jurisdictions statutorily prohibit waiving the right to contemporaneous consent. We need to know if our state is one of them. If so, the policy must frame the PAD as *evidence* of incapacity rather than a binding contract).
  *   Draft liability waivers for patients executing these directives.

  **Phase 3: Board Adoption & Training (Weeks 9-12)**
  *   Present to Medical Executive Committee.
  *   Mandatory training for psychiatrists on how to document the "competence window" when a patient signs a Ulysses clause.
  *   Create a standardized "Trigger Audit" form for use during crises.

  **Phase 4: Implementation (Month 4)**
  *   Policy goes live. All existing PADs are reviewed; those with Ulysses clauses are flagged for compliance with the new verification standards.

  ### V. Conclusion

  Patient M. attempted to solve a problem of future irrationality using a rational tool. The tool is failing not because the philosophy is unsound, but because the implementation lacks an epistemic firewall. By auditing the trigger data independently and honoring the directive if the data holds, we respect M.'s competent will, protect her from the harm she specifically sought to avoid, and establish the precedent necessary to make these contracts viable for future patients.

  **Action Item:** I move we authorize the Chief of Psychiatry to order the sleep-data audit immediately and proceed with treatment per the PAD upon confirmation, documenting M.'s objection as a symptom of the episode as per her prior instruction.
