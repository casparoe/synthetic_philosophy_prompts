answer: |-
  **Ian:** You diagnose the boy, and the room changes. You speak to him differently now. He senses the expectation. He begins to perform "autism," or perhaps resist it. That feedback loop—the classification altering the classified—isn't noise. It's the mechanism. Autism isn't a static specimen under glass; it's a moving target we co-create.

  **Richard:** But there's a target there to begin with. A cluster of properties: sensory sensitivities, communication patterns, neural connectivity. They co-occur because of underlying homeostatic mechanisms—genetic, developmental. If you strip away the label, the seizures don't stop. The overwhelm remains. That's not social negotiation; that's biology.

  **Ian:** I don't deny the biology. I deny that the *kind* "autism" maps neatly onto it. When we define autism by social deficits, we pathologize a nervous system built for a different environment. As society changes—becoming more accommodating or more demanding—the phenotype shifts. The kind evolves because the environment it interacts with evolves.

  **Richard:** Evolution doesn't mean unreality. Species evolve, yet biology remains a science. The HPC view allows for fuzzy boundaries. We don't need rigid essentialism to say there's a real causal structure here. If there weren't, interventions wouldn't work consistently. The stability of the cluster allows us to predict needs. If it were purely a looping effect, why do early supports help regardless of cultural context?

  **Ian:** Because the loop runs deep. You intervene, the child develops differently, the category updates. My worry is ethical. If we treat "autism" as a fixed natural kind, we risk freezing the child's potential into a prognosis. We tell parents to look for deficits rather than divergences. The diagnosis becomes a self-fulfilling prophecy.

  **Richard:** And if we treat it as purely fluid, we risk losing the leverage to demand support. Schools and insurers need stable categories to allocate resources. If "autism" is just a moving social construct, why fund specific therapies? Realism grounds rights. It says, "This is not a parenting failure or a phase. This is a neurotype requiring accommodation."

  **Ian:** But accommodation changes the kind! Make the world accessible, and the "disability" aspect recedes. The looping effect can be liberating. But only if we admit the label is a tool, not a truth.

  **Richard:** A tool needs a solid handle. You can't wield a mist. We need to believe there's a *there* there to study, to understand, to love. Not as a prognosis, but as a reality.

  **Ian:** Then agree the reality is interactive. The boy isn't just having autism; he's doing autism, with you, through the diagnosis.

  **Richard:** Then agree the interaction rests on a foundation. He isn't doing it alone. The neurons fire regardless of the name.

  **Ian:** But the meaning of the firing... that's where we live.

  **Richard:** And the capacity to feel the fire... that's where he lives.

  **Ian:** So we watch the loop.

  **Richard:** And hold the ground.
