      *   **Argument 3: Net Negative Lives.** If a life is mostly suffering and ends in pain, its total utility is negative. A short negative life is still negative.
      *   **Argument 4: Sentience Uncertainty.** If insects feel pain (even 1% chance), the expected value is huge.

  7.  **Identify Potential Flaws in the WAS Argument (Balance):**
