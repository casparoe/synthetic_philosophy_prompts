answer: |-
  This is one of those moments in philosophy of science where the formal logic feels like a parlor trick, but it actually reveals a deep structural problem with how we think about "error."

  You are right to be frustrated. Most textbooks just wave their hands at the set theory and say, "And thus, the sets cannot be ordered." That doesn't help you explain it to a room full of undergrads who are already struggling with the difference between verification and falsification.

  Here is the gut-level explanation of the mechanism, broken down into the **Core Intuition**, the **Logical Mechanism**, and a **Classroom Analogy**.

  ### 1. The Core Intuition: Content vs. Distance
  The first thing to tell your students is that Popper made a category mistake. He tried to measure **closeness** (distance from the truth) using **content** (amount of information).

  *   **Truth Content:** How many true things does the theory say?
  *   **Falsity Content:** How many false things does the theory say?

  Popper thought: *If Theory A says more true things than Theory B, and no more false things, A is closer to the truth.*

  The Tichý/Miller result shows that for **false theories**, Truth Content and Falsity Content are **coupled**. You cannot increase one without increasing the other.

  **The Gut Reason:** If a theory is fundamentally false, making it *more informative* (adding content) inevitably makes it *more specifically false*.

  ### 2. The Mechanism: "Conjunction Amplifies Error"
  This is the specific logical mechanism you asked for. Why does adding a true consequence smuggle in a false one?

  Imagine you have a False Theory ($F$).
  Because it is false, it implies at least one false statement (let's call it $bad$).
  Now, you want to make the theory better. You want to add a true statement (let's call it $good$) to increase its Truth Content.

  So you create a new theory: $F + good$ (logically, this is the conjunction $F \land good$).

  Here is the trap:
  1.  **You gained Truth Content:** The new theory explicitly implies $good$. The old theory didn't necessarily imply $good$. So, Truth Content went up. ✅
  2.  **You gained Falsity Content:** The old theory implied $bad$. The new theory *also* implies $bad$ (because it includes $F$). **But**, the new theory *also* implies the conjunction ($bad \land good$).
      *   ($bad \land good$) is a **new** false statement.
      *   The old theory did *not* imply ($bad \land good$), because the old theory didn't imply $good$.
      *   So, Falsity Content *also* went up. ❌

  **The Result:** By tacking on a truth to a false theory, you have created a *more specific error*. You haven't just said something wrong; you've said something wrong *in conjunction with something right*. In Popper's bookkeeping, that counts as *more* falsity content.

  Because Popper's definition requires you to increase truth content **without** increasing falsity content, you are stuck. Every time you reach for more truth, the logic forces you to drag along extra falsity.

  ### 3. Classroom Analogy: The Wrong Time
  The "Conjunction" argument is the logical proof, but this analogy usually lands better with undergrads.

  **Scenario:** The true time is **3:00 PM**.

  *   **Theory A:** "It is 2:00 PM." (False)
  *   **Theory B:** "It is 2:00 PM and the sky is blue." (False, assuming sky is blue)

  Intuitively, Theory B feels "better" or "richer." It got the sky right! It has more **Truth Content** than Theory A.

  But let's look at the **Falsity Content** using Popper's logic (which counts all logical consequences):
  *   **Theory A implies:** "It is not 3:00 PM." (False)
  *   **Theory B implies:** "It is not 3:00 PM." (False)
  *   **Theory B *also* implies:** "It is 2:00 PM and the sky is blue." (False conjunction)

  Wait, that's not strong enough. Let's use the Tichý/Miller "Logical Space" angle.

  **The Map Analogy:**
  Imagine the Truth is a specific house in a city.
  *   **Theory A** is a map that puts the house in the wrong neighborhood.
  *   **Theory B** is a map that puts the house in the *same* wrong neighborhood, but it correctly labels the parks and schools.

  Theory B has more true information (parks/schools). But because it is *more detailed* about the wrong neighborhood, it is also **more exclusively wrong**.
  *   Theory A says: "The house is in Neighborhood X." (False)
  *   Theory B says: "The house is in Neighborhood X, specifically on Street Y." (False)

  Theory B rules out *more* of the actual city than Theory A does. In Popper's terms, Theory B has a larger "falsity content" because it makes more specific claims that exclude the truth.

  **The Tichý/Miller Kicker:**
  Tichý and Miller proved that you can't just say "Well, B is more specifically wrong, but the true stuff balances it out."
  They showed that for any false theory, the **true consequences** and **false consequences** grow at the same rate.
  *   If you try to find a false theory that has *more* true consequences than another, the logic forces it to also have *more* false consequences.
  *   It's like trying to stretch a rubber sheet that has a hole in it. If you stretch it to cover more ground (truth), the hole gets bigger (falsity). You can't expand the coverage without expanding the error.

  ### 4. How to Summarize for the Discussion Section
  If I were leading this section, I would put this on the board:

  **Popper's Hope:**
  $$ \text{Verisimilitude} = \text{Truth Content} - \text{Falsity Content} $$
  *(We can maximize the first and minimize the second.)*

  **Tichý/Miller Reality:**
  For False Theories:
  $$ \text{Truth Content} \uparrow \implies \text{Falsity Content} \uparrow $$
  *(They are locked together.)*

  **Why?**
  Because logic is a web, not a bucket. If the anchor of the web is false (the theory is false), pulling the web tighter to catch more true fish (consequences) inevitably drags the anchor deeper into the mud (more specific false consequences).

  **The Takeaway:**
  Popper's definition works fine for comparing two **true** theories (one can be a stronger subset of the other). But it collapses for **false** theories. Since science is mostly dealing with false (or strictly speaking, refuted) theories (like Newtonian Mechanics), Popper's original definition cannot explain why Newton is "better" than Aristotle. They are both just "false," and their truth/falsity content is incomparable.

  This is why later philosophers (like Niiniluoto and Oddie) moved away from Popper's "Content" approach and toward **"Similarity"** or **"Distance"** approaches (possible worlds semantics), where we measure how *similar* the false theory is to the truth, rather than counting its consequences.

  ### Summary for your prep notes:
  1.  **Don't fight the logic:** Acknowledge the proof relies on constructing specific sentences ($t \lor f$, etc.), but don't teach that.
  2.  **Teach the coupling:** The key insight is that for false theories, increasing informational content increases both truth and falsity consequences simultaneously.
  3.  **Use the "Specific Error" intuition:** A more informative false theory is a *more specifically* false theory. Popper counts "specific falsity" as more falsity content.
  4.  **The Stakes:** This result forces us to abandon "content" definitions of truthlikeness and move to "similarity/distance" definitions.
