answer: |-
  **Setting:** *A seminar room. A line of twenty men stands against the wall, sorted by height from 5'0" to 6'5". ELIAS (Epistemicist) and SOPHIA (Supervaluationist) stand before the middle of the line, gesturing at two adjacent men, #142 and #143, who differ in height by a single millimeter.*

  **Elias:** Look at them. #142 is tall. #143 is not. One millimeter is the difference between satisfying the predicate and failing it.

  **Sophia:** That is a metaphysical miracle, Elias. You're claiming our collective linguistic behavior—sloppy, context-sensitive, messy usage—somehow conjured a razor-sharp boundary right *here*, between these two specific men?

  **Elias:** I'm claiming the world is precise, and our words latch onto it. Bivalence holds. For any *x*, 'x is tall' is either true or false.

  **Sophia:** But *what fixes it*? Meaning is a matter of use. We haven't used the word 'tall' enough to discriminate millimeter differences. Our dispositions don't reach down that deep. If usage doesn't determine the cutoff, then on your view, the cutoff is floating free of meaning. It's magic.

  **Elias:** It's not magic; it's the margin for error principle. Knowledge requires safety. We can't *know* where the boundary is because if we believed #142 was the cutoff, we could easily have been wrong given the similarity to #143. But our ignorance doesn't erase the boundary. Usage constrains the boundary to a region—it can't be at 5'0" or 6'5"—but within that region, there is a sharp edge.

  **Sophia:** A sharp edge without a hook to hang it on? You're saying there is a fact of the matter, but no fact *makes* it true. That's not epistemicism; that's mysticism. On my view, 'tall' is incomplete. There are many admissible precisifications. On some, #143 is tall; on others, he isn't. Since he isn't tall on *all* precisifications, '143 is tall' isn't super-true. It's neither true nor false. We avoid the arbitrary cutoff by denying the truth value.

  **Elias:** You avoid the cutoff at the first order only by smuggling it in at the higher order. Let's talk about 'Definitely Tall'. You use that operator to mark the cases where all precisifications agree.

  **Sophia:** Precisely. #100 is definitely tall. #143 is not definitely tall. The boundary between the definite and the indefinite is where the precisifications diverge.

  **Elias:** But is *that* boundary sharp? Is there a specific man where 'Definitely Tall' stops applying?

  **Sophia:** Well, the set of admissible precisifications is determined by usage constraints...

  **Elias:** Which are vague, Sophia! You just admitted usage is messy. So the set of admissible precisifications is vague. Therefore, the boundary between 'Definitely Tall' and 'Not Definitely Tall' is vague.

  **Sophia:** We can iterate. We have 'Definitely Definitely Tall'.

  **Elias:** And I ask again: where does *that* stop? If you say there's no sharp cutoff for 'Definitely', then classical logic fails for your own operator. If you say there *is* a sharp cutoff for 'Definitely', then you've accepted epistemicism for the higher-order case. You've just kicked the sharp boundary upstairs. You haven't solved vagueness; you've just renamed the first sharp boundary 'the first order' and pretended the second one doesn't exist.

  **Sophia:** I haven't pretended anything. The hierarchy of 'definitely' operators models the phenomenon of higher-order vagueness without committing me to a single, unknowable fact about #143's height. The transition from true to indefinite is gradual because the set of precisifications shrinks gradually.

  **Elias:** Sets don't shrink gradually. A precisification is either admissible or it isn't. If the boundary of admissibility is vague, your semantics is ill-defined. If it's sharp, you're an epistemicist about admissibility. You need a sharp cutoff to make your logic work, but you refuse to admit it exists because it offends your intuition about usage.

  **Sophia:** And you need a sharp cutoff to make your logic work, but you refuse to explain how usage conjures it because it offends your intuition about meaning. We're both stuck with boundaries our theories can't fully justify. But mine respects the openness of language. Yours treats English like a mathematical function.

  **Elias:** English *has* to be precise if it's to describe the world truth-functionally. You're willing to sacrifice bivalence to save the intuition that usage is fuzzy. I'd rather save bivalence and accept that usage is more determinate than we can know.

  **Sophia:** *(Gesturing to #143)* You really think if we shaved one millimeter off this man, he'd cross a semantic event horizon?

  **Elias:** I think if we don't accept that, we can't explain why 'Definitely' doesn't collapse into triviality. Look at the line, Sophia. Somewhere, the truth changes.

  **Sophia:** Somewhere, the applicability fades. And no amount of logic will turn that fade into a cliff.

  **Elias:** Then your logic can't handle the fade.

  *(They stand in silence, looking at the gap between the two men.)*
