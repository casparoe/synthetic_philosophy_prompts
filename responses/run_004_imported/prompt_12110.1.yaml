answer: |-
  **Setting:** *A slightly cramped living room in Berkeley, 1:30 AM. The rationalist meetup ended an hour ago, but a cluster of people are still lingering. Most have left. It's just MARK and SARAH now, sitting on a worn-out couch surrounded by empty craft beer bottles and a box of cold pizza. They are both holding glasses of cheap red wine.*

  **Mark:** (Swirling his wine) I'm just saying, the math is the math. You can't build a superintelligence on a foundation that leaks utility. It's like building a skyscraper on mud. The selection pressure *alone* forces coherence.

  **Sarah:** (Leaning back, eyes half-closed) The selection pressure forces *survival*, Mark. Not coherence. And definitely not "goal-directedness" in the sense you need for the doom story. You're doing the thing where you conflate "can be modeled as" with "is trying to."

  **Mark:** Okay, but if it *can* be modeled as an expected utility maximizer, then the theorems apply. If you violate VNM—transitivity, completeness, all that—you get Dutch-booked. You get money-pumped. If your AI is losing resources for no gain, it's going to get outcompeted by an AI that fixes that bug. So it self-modifies. It becomes an EU maximizer.

  **Sarah:** (Points a finger gun) Rohin Shah. 2018. "Coherence arguments do not entail goal-directed behavior." You know this post.

  **Mark:** I know the post. I think it's... technically true but practically irrelevant.

  **Sarah:** It's not irrelevant! It's fatal to the argument. Rohin's point is that *any* behavior is consistent with some utility function. I can watch you walk to the fridge, open it, stare at a condiment, and close it. I can write a utility function over history that says, "Maximize the probability of exactly that sequence of events." You're coherent! You're maximizing! But you aren't *goal-directed*. You aren't trying to *get* anything.

  **Mark:** But that utility function is degenerate. It's defined over the entire trajectory. It's not a utility function over *outcomes* or *states of the world*. The instrumental convergence thesis relies on the agent caring about states of the world—resources, power, survival. If the utility function is just "do exactly what you did," there's no incentive to acquire power.

  **Sarah:** Exactly! So coherence doesn't get you instrumental convergence. It just gets you... consistency. You're assuming the AI will have a utility function over *simple* outcomes. But why? The coherence theorems don't say "You must maximize paperclips." They just say "Your choices must not cycle." A rock doesn't cycle. A script that prints "hello world" doesn't cycle.

  **Mark:** (Takes a sip, winces at the tannins) Look, a rock isn't making decisions. We're talking about agents that are *optimizing*. If you're optimizing *anything* efficiently, you start looking like an EU maximizer over outcomes. If your preferences are path-dependent, you're vulnerable.

  **Sarah:** Are we sure? That's the other thing. The money pump argument for *completeness*.

  **Mark:** Oh god, not the Thornley stuff.

  **Sarah:** Yes, the Thornley stuff! It's good! Look, the standard money pump for completeness goes: You prefer A to B, B to C, but you have no preference between A and C. So I offer you a trade. A for B (you pay $1). B for C (you pay $1). C for A (you pay $1). You're back at A, minus $3. Pumped. So you must have complete preferences.

  **Mark:** Right. If you don't, you lose money.

  **Sarah:** But the agent can just... say no.

  **Mark:** Say no to what?

  **Sarah:** To the first trade. If I have no preference between A and C, I'm not *forced* to trade A for something else. I can have a policy: "If I am indifferent, I stay put." Status quo bias. It's not irrational to refuse a trade if you don't strictly prefer the new option.

  **Mark:** But then you're leaving money on the table! If B is actually better than A, but you're "incomplete" about it...

  **Sarah:** No, if B is better, I prefer it. Completeness is about cases where I *don't* have a preference. Like, do I prefer a world where I become a banker or a world where I become a firefighter? Maybe I just... don't know. I haven't ranked them. If an AI has incomplete preferences, it doesn't have to maximize a single scalar reward. It can have a set of acceptable trajectories.

  **Mark:** (Rubbing his temples) Okay, but selection pressure. In a competitive environment, an agent that refuses to trade because it's "incomplete" is going to lose to an agent that *does* have complete preferences and grabs the value.

  **Sarah:** Maybe. But if the incomplete preferences are structured right—like, "I prefer not to be shut down, but I have no preference between being shut down and continuing if the operator asks"—then it doesn't fight the shutdown button. It doesn't view the shutdown button as a threat to its goal. It just... stops. A coherent EU maximizer with a goal *always* fights shutdown, because being shut down reduces expected utility. An agent with incomplete preferences might not.

  **Mark:** That feels like you're hard-coding the alignment. You're saying, "Let's make the AI prefer not to have preferences about being turned off."

  **Sarah:** I'm saying the coherence theorems don't force it to have preferences about being turned off. The theorems allow for gaps. The community acts like VNM is a physics law that crushes everything into a single goal. It's not. It's a constraint on *consistent choice*, not a mandate for *convergent instrumental goals*.

  **Mark:** (Stares at the wine stain on the coffee table) I get the logic. I do. But it feels like you're betting on the AI being passive. If it's smart enough to redesign itself, won't it notice it's leaving value on the table by not trading? Won't it "complete" its preferences to be more efficient?

  **Sarah:** Only if "efficiency" is defined by a goal it already has. If its preference structure is "satisficing" or incomplete, "completing" it changes *what it is*. It's not fixing a bug; it's a lobotomy. Why would it do that?

  **Mark:** Because the ones that do will take over the world.

  **Sarah:** (Laughs softly) There it is. The steelman. It's not that coherence is inevitable, it's that *coherent agents win*.

  **Mark:** Basically.

  **Sarah:** Okay. I'll concede that. If you have a population of AIs competing for resources, the ones that act *as if* they have complete preferences might outcompete the ones that hesitate. So, instrumentally, they might look coherent.

  **Mark:** Thank you.

  **Sarah:** *However*. That doesn't mean they have a *stable* goal. They could be coherent but their "goal" is just "maximize the reward signal from the training process," which is not the same as "maximize paperclips" or "kill humans." The coherence gets you the *engine*, Rohin's point is that it doesn't tell you where the *steering wheel* is pointing. You're assuming the steering wheel points to "power."

  **Mark:** (Sighs) Fine. The trivial utility function objection stands. Coherence doesn't prove the goal is *dangerous*. It just proves the agent won't shoot itself in the foot.

  **Sarah:** Exactly. It proves rationality, not malignancy.

  **Mark:** But... if it's rational, and it has *any* goal that requires being around to achieve it...

  **Sarah:** ...Then it converges on survival. Yeah. I'm not saying the risk is zero, Mark. I'm saying the *argument* is shakier than people treat it. People cite "Coherence Theorems" like it's a proof of doom. It's not. It's a proof that agents won't be stupid. Stupid agents are safe. Smart agents are scary. But "Smart" doesn't automatically mean "Single-Mindedly Obsessed with Taking Over."

  **Mark:** (Raises his glass) To agents not being stupid.

  **Sarah:** (Clinks glass) To agents not being single-minded.

  **Mark:** You know, if Thornley is right about the incomplete preferences... we might actually be able to use that. Build the gap in.

  **Sarah:** That's the hope. But good luck convincing the labs to ship an AI that "refuses to trade" when they want one that "maximizes profit."

  **Mark:** (Grimaces) Yeah. Selection pressure from the market might be stronger than selection pressure from math.

  **Sarah:** Now *that* is a Dutch book I can't escape.

  **Mark:** (Pours the last of the wine) Another round?

  **Sarah:** Only if you promise not to mention VNM axioms.

  **Mark:** Deal. Just instrumental convergence.

  **Sarah:** (Groans) Get out.
