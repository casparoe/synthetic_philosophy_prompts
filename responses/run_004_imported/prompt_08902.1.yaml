      *   *Standard View (Defeatism):* Higher-order evidence defeats first-order justification. If you have reason to think you're crazy, you can't trust your crazy thoughts.
      *   *The User's Goal:* Justify *Steadfastness*.
      *   *Key Concepts:* Epistemic Akrasia, The Enkratic Principle, Self-Trust, Gaslighting, Memory Metacognition.

  3.  **Drafting the "Case for Rationality" (The Steadfast View):**
      *   *Argument 1: The "Total Evidence" View.* Maybe the higher-order evidence isn't as strong as it looks. If the memory is vivid, sensory-rich, and central to identity, it carries significant weight.
      *   *Argument 2: Self-Trust as a Foundational Principle.* If I can't trust my own mind at all, I can't evaluate the evidence against me either. To evaluate the "proof" against her, she must use her memory. If she discards memory entirely, she has no tool to assess the "proof." Therefore, a baseline of self-trust is required to process *any* evidence.
      *   *Argument 3: The "Gaslighting" Exception.* In contexts of known manipulation (even if she doesn't fully know it yet), skepticism toward external testimony is rational. If the source of the higher-order evidence (husband/sister) has a motive, their evidence is tainted.
      *   *Argument 4: Phenomenal Conservatism.* "It seems to me that $P$." If the memory *feels* true, that provides immediate prima facie justification. Higher-order evidence needs to be overwhelming to defeat this.
