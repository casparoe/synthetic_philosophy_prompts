      *Refining for the Novel:* Focus on *Self-Trust* and *The Impossibility of Total Self-Doubt*. She can't use her brain to verify her brain is broken without assuming her brain works.

  4.  **Drafting the "Case Against Rationality" (The Defeatist View):**
      *   *Argument 1: The Enkratic Principle.* Believing $P$ while believing "I have no reason for $P$" is structurally irrational. It's a Moorean Paradox ("It is raining, but I don't believe it is raining").
