answer: |-
  **Setting:** *A quiet corner of a coffee shop, just after the weekly metaethics reading group has disbanded. The whiteboard in the seminar room is still covered in arrows connecting "Fitness," "Normative Truth," and "Adaptive Behavior." Elena (the Debunker) and Marcus (the Realist) are the last to leave, continuing the argument over cold brew and espresso.*

  **Elena:** You know, Marcus, I appreciate that you didn't just retreat into the "evolution tracks truth" bunker. Most realists try to argue that natural selection somehow has a nose for normative reality. That's always been a non-starter. Selection cares about reproduction, not the Good.

  **Marcus:** I'm glad we agree on that much. If I claimed evolution was a truth-tracking mechanism for moral facts, I'd be as guilty of magical thinking as Street says. But that's precisely why the "Third-Factor" reply is necessary. It dissolves the coincidence without requiring evolution to be a moral sensor.

  **Elena:** Right, the "common cause" defense. I've heard the pitch. The idea is that there's some third thing—let's say, "survival" or "agency"—that is both fitness-enhancing *and* objectively good. So, evolution selects for beliefs that promote survival, and since survival is good, our beliefs align with moral truth. No coincidence, just a common cause. But here's my first cut: Is this actually an explanation, or is it just a redescription of the correlation you're trying to save?

  **Marcus:** It's not a redescription because it identifies a specific mechanism of alignment. Consider David Enoch's example. Suppose it is objectively good to survive. Evolution selects for traits that promote survival. Therefore, evolution selects for traits that promote something objectively good. The alignment isn't lucky; it's structurally necessitated by the nature of the third factor.

  **Elena:** But why think "survival" is the relevant third factor? Street's point is about the *specific content* of our moral beliefs. Sure, survival is generally fitness-enhancing. But evolution also favors kin altruism, reciprocal altruism, and tribalism. It does *not* favor impartial benevolence or the equal worth of all rational agents. If your moral realism posits that "all humans have equal moral worth" is the independent truth, but evolution only selected for "protect your kin," the third factor collapses. The correlation breaks down exactly where the moral realist needs it most.

  **Marcus:** That's the specificity objection, and it's strong. But you're setting the bar for the third factor too high. The third factor doesn't need to explain every nuanced moral belief we hold *right now*. It only needs to explain why our *basic* normative capacities are reliable enough to get us into the game of reflection. Think of it like a telescope. If evolution gave us eyes that were completely randomly oriented relative to light, we'd see nothing. But if evolution gave us eyes sensitive to light because light detection aids survival, we have a reliable instrument.

  **Elena:** A telescope that only sees your own family members isn't a reliable instrument for mapping the cosmos, Marcus.

  **Marcus:** True. But once you have the instrument, you can calibrate it. The third factor establishes a *baseline* reliability—that some of our normative judgments are likely true because they track survival-promoting behaviors which are, independently, good. This gives us a foothold to engage in reflective equilibrium. We can look at our tribal instincts and say, "This helped survival, but upon reflection, it conflicts with the more fundamental principle of agency." The third factor saves the *possibility* of moral knowledge, not the infallibility of every evolved intuition.

  **Elena:** So you're retreating to a modest realism. You're saying evolution got the *broad strokes* right because survival is good, but we need philosophy to fix the details. But Street would press you on the "independent" part of "independently good." If the only reason you posit that "survival is good" is because it solves the coincidence problem, it looks ad hoc. What independent evidence do you have that survival is a normative truth, other than the fact that you need it to be one to save realism?

  **Marcus:** It's not ad hoc because it's tied to the nature of valuing itself. To be an agent is to value ends. You cannot act without valuing something. Survival is a precondition for any valuing whatsoever. Therefore, there is a normative reason to value survival, derived from the constitutive aim of agency. This isn't just me stipulating "survival is good" to save my theory; it's a claim about what normativity *is*. If you reject that, you aren't just rejecting moral realism; you're rejecting the normativity of reasoning itself.

  **Elena:** Ah, there it is. The pivot to normativity in general. And that brings me to my "Companions in Guilt" worry. You're trying to save moral beliefs by linking them to the normativity of agency. But evolutionary debunking arguments apply to *everything*, Marcus. They apply to logic. They apply to mathematics.

  **Marcus:** I'm listening.

  **Elena:** Plantinga raised this for theism, but it applies here. Evolution shaped our cognitive faculties for fitness, not truth. We believe $2+2=4$ because counting helped us divide resources, not because we have access to Platonic mathematical truths. If your moral beliefs are suspect because they were shaped by fitness, then your logical and mathematical beliefs are equally suspect. They share the same genealogy. So, you have a choice: accept global skepticism about all normative and logical domains, or admit that the evolutionary argument doesn't undermine justification in the way Street thinks.

  **Marcus:** I'm willing to take that bet, actually. I think the evolutionary argument *does* threaten logical beliefs if you hold a certain view of them. But here is the distinction: Logic and mathematics are *constitutive* norms of belief. You cannot believe $P$ and $\neg P$ simultaneously without your belief system collapsing. Morality is a normative domain, but it is substantive. However, the Third-Factor reply works *better* for logic than for morality, not worse.

  **Elena:** How so?

  **Marcus:** Because for logic, the "third factor" is truth itself. Belief aims at truth. Evolution selected for cognitive mechanisms that preserve truth (mostly) because true beliefs about tigers lead to survival. The alignment between logical validity and fitness is explained by the fact that logical consistency is a prerequisite for forming accurate models of the world. With morality, the link is slightly more distant—it goes through *agency*. But the structure is the same. If you accept that we have knowledge of logic despite evolutionary pressures, you must accept that a common-cause explanation can rescue a domain from debunking.

  **Elena:** But that's the rub. Most people *intuitively* feel that logic is safe in a way morality isn't. If you have to construct a complex philosophical apparatus involving "constitutive aims of agency" and "third factors" to make morality feel as secure as arithmetic, haven't you already conceded that morality is epistemically weaker? The realist wants to say moral truths are just as robust as mathematical truths. But if the mathematical truths don't need a Third-Factor defense to feel secure, while moral truths do, the parity is broken.

  **Marcus:** I deny the parity is broken in the way you suggest. The reason math feels more secure is psychological, not epistemological. We interact with logical consequences constantly; we interact with moral demands constantly. The "feeling" of security isn't data. But let's press your point on explanatory redundancy again. You asked if "survival is good" is just a redescription. Let's test that.

  **Elena:** Please.

  **Marcus:** Suppose we deny the third factor. Suppose survival is *not* good, nor bad, just neutral. Then the fact that evolution selected for survival-promoting behaviors tells us *nothing* about moral truth. The correlation between our beliefs and moral truth would indeed be a cosmic accident. By positing the third factor, I am offering a hypothesis that makes the correlation *expected* rather than *accidental*. In Bayesian terms, the likelihood of the evidence (our moral beliefs aligning with some truths) is much higher on the hypothesis (Realism + Third Factor) than on the hypothesis (Realism + No Third Factor).

  **Elena:** But you're comparing Realism + Third Factor against Realism + No Third Factor. You aren't comparing it against *Anti-Realism*. Street's argument is that Anti-Realism explains the data *better*. If morality is just a projection of fitness-enhancing sentiments, the correlation is perfect and requires no coincidence. Why add the ontological baggage of independent moral truths if the evolutionary story explains the beliefs without them?

  **Marcus:** Because the evolutionary story doesn't explain the *normative force* of the beliefs. It explains why we *have* them, but not why we think we *ought* to obey them, even when they conflict with fitness. I might feel an impulse to save a drowning stranger at great risk to myself. Evolutionarily, that's noise. It's a misfire. But I judge it as *right*. Anti-realism has to say my judgment is false or misguided. Realism says my judgment tracks a truth that transcends the evolutionary script. The Third-Factor explains how I'm capable of making that judgment without being a miracle.

  **Elena:** But that's just asserting the datum you need to prove. You say, "I judge it as right, therefore there must be a truth." Street says, "You judge it as right because that heuristic worked in ancestral environments, even if it misfires now." The Third-Factor relies on the assumption that our reflective moral judgments are trustworthy. But the whole point of the debunking argument is to undermine that trust! You're using the output of the system to defend the reliability of the system.

  **Marcus:** And you're using the output of your evolutionary system to argue that no system is reliable. Look, Elena, skepticism is easy. I can debunk your belief in evolution using the same logic. "Your belief in evolution was selected for fitness, not truth." If we can't trust our reflective capacities to identify a third factor like "agency is good," we can't trust them to identify "fitness causes beliefs." We are reasoning beings. We have to start somewhere. The Third-Factor reply is simply the claim that starting with the normative significance of our own agency is a more stable foundation than starting with the assumption that all our normative intuitions are illusions.

  **Elena:** So it comes down to a choice of starting points. I start with the causal genealogy and demand an explanation for the correlation that doesn't invoke the truth of the beliefs themselves. You start with the indispensability of normative truths and demand an explanation for the genealogy that preserves them.

  **Marcus:** Exactly. But notice what the Third-Factor achieves. It shows that Realism is not *incoherent*. It shows that the "coincidence" is not logically necessary. It shifts the burden back to you to show why the correlation is *improbable* even given the third factor. If agency is good, and evolution selects for agents, is it really a coincidence that agents have true beliefs about agency?

  **Elena:** It's a coincidence if evolution selects for agents *regardless* of whether their beliefs about agency are true. Evolution selects for the *behavior* of agency. I can act *as if* I value agency without actually grasping the normative truth of it. A robot can be programmed to preserve itself without knowing it's "good" to do so. The Third-Factor explains the behavior, Marcus, but it doesn't explain the *grasp of the truth*. That's the gap. You've explained why we act well, not why we *know* the good.

  **Marcus:** But acting well *is* the primary manifestation of moral knowledge in a natural world. If the behavior aligns, and the capacity for reflection allows us to endorse the behavior for the right reasons, what more do you want? A magical beam of normative light hitting our retinas?

  **Elena:** I want an explanation that doesn't assume what it's trying to prove. You assume the normative truth of agency to explain the alignment. I assume the causal power of selection to explain the belief. Both are consistent. But mine is parsimonious.

  **Marcus:** Parsimony is a virtue, but not if it eliminates the data. The data is that we feel bound by reasons. Your story explains the feeling. Mine explains the bindingness. If you can live with a world where "bindingness" is an illusion, we're at an impasse. But don't tell me the Third-Factor doesn't work. It works well enough to show that Realism isn't dead on arrival.

  **Elena:** Fair. It keeps Realism on life support. But I still think the patient is brain-dead. The Third-Factor might explain why we aren't *completely* wrong, but it doesn't explain why we should trust our specific moral intuitions over our specific evolutionary impulses when they diverge.

  **Marcus:** And I think that's where the work begins, not where it ends. The Third-Factor buys us the ticket to enter the theater. It doesn't watch the play for us.

  **Elena:** *[Sips cold brew]* Well, at least we agree the theater is open. Whether the play is a tragedy or a documentary... that's for the next session.

  **Marcus:** *[Smiles]* I'll bring the popcorn. You bring the debunking.

  **Elena:** Deal.
