answer: |-
  Here is the read: Modern public-meaning originalism is a **hostile takeover** of Douglass's method, and he would reject it as a jurisprudence of bad faith.

  Douglass would not side with the "public meaning" originalists. He would argue that they have severed the tether between **Move 1 (Textualism)** and **Move 2 (Natural Rights)**, turning Move 1 into an idol that protects the very oppression Move 2 was meant to destroy.

  For Douglass, Move 1 was never a standalone theory of law; it was a *tactical deployment* in service of Move 2. In the 1860 Glasgow speech, he argues that a "competent reader" of 1787 reads the Constitution *in light of the Declaration of Independence*. The Preamble's objects ("Justice," "Liberty") are the hermeneutic key that unlocks the text. If the text is ambiguous, it *must* be read in favor of liberty.

  Modern originalism, particularly in the last decade, often inverts this. It treats the "original meaning" (or history and tradition) as a cage that *prevents* the expansion of liberty if that expansion wasn't explicitly anticipated in 1787 or 1868. Douglass would view this as a resurrection of the *Dred Scott* logic: using legal formalism to freeze a hierarchy of rights.

  Here is how he would dismantle the specific cases you mentioned, using the architecture of his 1860 argument and his post-war Reconstruction advocacy.

  ### 1. *Shelby County v. Holder* (2013): The Betrayal of the Second Founding
  Douglass would view *Shelby County* as the most egregious offense, because it directly targets the machinery he spent the last 30 years of his life building.

  *   **The Court's Move:** Roberts' majority opinion relies on a textualist/federalism principle of "equal sovereignty of the states." It argues that the VRA's preclearance formula is an extraordinary departure from the standard relationship between state and federal government, and the text of the 15th Amendment doesn't authorize such a permanent disparity.
  *   **Douglass's Counter:** Douglass argued that the Reconstruction Amendments (13th, 14th, 15th) were not mere tweaks; they were a **Second Founding**. In his 1867 speech "Reconstruction," he insists that the old federalism died with the rebellion. The 15th Amendment's text ("The right... shall not be denied") is absolute.
  *   **The Clash:** Douglass used Move 1 (text) to show slavery wasn't *mandated*. But he used Move 2 (purpose) to show federal power *was* mandated to secure rights. He would argue that *Shelby County* engages in a "covenant with death" by prioritizing the abstract federalism of 1787 over the explicit liberty mandate of 1868.
  *   **Verdict:** He would call this a "legal fiction" designed to restore the status quo ante. To Douglass, a "competent reader" of the 15th Amendment reads it as a guarantee of *outcome* (voting), not just a prohibition on *intent*. *Shelby County* treats the 15th Amendment as a narrow exception to state sovereignty; Douglass treated state sovereignty as the exception to the 15th Amendment.

  ### 2. *Dobbs v. Jackson* (2022): The Idolatry of 1868
  This is the clearest example of why Douglass would reject modern originalism as a hostile takeover.

  *   **The Court's Move:** Alito's opinion uses a "history and tradition" test. Because the right to abortion wasn't deeply rooted in the nation's history/tradition at the time of the 14th Amendment (1868), it's not protected liberty.
  *   **Douglass's Counter:** This is precisely the logic used to defend slavery in 1857. *Dred Scott* argued that Black people had "no rights which the white man was bound to respect" based on history and tradition. Douglass's entire career was an argument that the Constitution *breaks* tradition.
  *   **The Clash:** In Glasgow, Douglass argues that you cannot use the "secret intentions" of the framers to limit the text's liberty-securing potential. *Dobbs* does the inverse: it uses the "secret intentions" (or lack thereof) of the 1868 ratifiers to limit the text's liberty-securing potential ("liberty" in the Due Process Clause).
  *   **Verdict:** Douglass would argue that "Liberty" in the 14th Amendment is a *principle*, not a list of 1868 practices. He wrote extensively that the 14th Amendment made every American a "citizen of the United States first," securing fundamental natural rights against state intrusion. To say "women in 1868 didn't have this right, so 'liberty' doesn't cover it" is to say "Black people in 1787 were slaves, so 'We the People' doesn't cover them." He would view *Dobbs* as originalism functioning exactly as Garrison feared: a covenant with the dead hand of the past against the living rights of the present.

  ### 3. *Bostock v. Clayton County* (2020): The Accidental Ally
  *Bostock* is the only case where Douglass would nod in agreement, but he would not trust the method.

  *   **The Court's Move:** Gorsuch applies strict textualism. The text says "because of sex." If you fire a man for dating a man, but wouldn't fire a woman for dating a man, you have discriminated because of sex. The subjective intent of the 1964 Congress doesn't matter; the text controls.
  *   **Douglass's Counter:** This mirrors Douglass's Glasgow move: "The word 'slave' is not in the Constitution." Don't look at what Madison whispered; look at what the words say.
  *   **The Clash:** Douglass would cheer the result because it expands protection for a vulnerable class (Move 2). However, he would spot the inconsistency immediately. He would ask: "Why does this textualism apply here, but not in *Shelby County*?"
  *   **Verdict:** He would view *Bostock* as a moment where Move 1 and Move 2 accidentally aligned, but he would warn that textualism without a "presumption of liberty" is a coin flip. In Glasgow, he argues the text must be read *in favor* of liberty when ambiguous. Gorsuch's textualism in *Bostock* was mechanical. Douglass's was moral. If the text in *Bostock* had been slightly different, Gorsuch's method might have failed; Douglass's method would have searched for the interpretation that secured the right.

  ### The Core Theoretical Break
  The reason Douglass would call this a hostile takeover comes down to the **Presumption of Liberty**.

  In the Glasgow speech, Douglass establishes a canon of construction: **"Whenever a law is ambiguous, whenever it can be interpreted in two ways, one favoring liberty and the other favoring slavery, it is the duty of the magistrate to adopt the interpretation that favors liberty."**

  Modern originalism claims to be neutral. It says, "We follow the text/history, even if the result is bad." Douglass would argue that **neutrality in the face of oppression is complicity.**

  *   **Modern Originalist:** "The history doesn't support a right to vote without ID / abortion / etc., so the Court cannot create one."
  *   **Douglass:** "The object of the Constitution is to secure liberty. If the history supports oppression, the history is subordinate to the object. You are misreading the document by ignoring its 'general purposes' (Preamble) in favor of its 'specific clauses' read in a vacuum."

  He would specifically attack the **1787/1868 freeze**. Douglass believed the Constitution was a "living" document not in the modern sense of judicial updating, but in the sense that its *principles* were dynamic. He argued that the "We the People" expanded as the circle of rights expanded. To lock the meaning of "liberty" to the understanding of white men in 1868 is, to Douglass, the same error as locking "We the People" to white men in 1787.

  ### Conclusion
  Douglass would conclude that modern public-meaning originalism has taken his **tactic** (Move 1: ignore the framers' pro-slavery intent, read the text) and stripped it of his **strategy** (Move 2: the text serves natural rights).

  He would argue that the current Court uses "original meaning" to do exactly what the pro-slavery faction did in the 1840s: use legalistic formalism to shield injustice from moral scrutiny. He would likely align with the **dissenters** in *Shelby* and *Dobbs*, not because he believes in a "living constitution" that ignores text, but because he believes in a **Teleological Constitutionalism** where the text is the engine, but Liberty is the destination. If the engine is driving off a cliff, you don't praise the engineer for sticking to the manual; you seize the wheel.

  **Final Lean:** He views the project as a **hostile takeover**. He would argue that a jurisprudence that cannot distinguish between the "original meaning" of liberty and the "original practices" of oppression is indistinguishable from the *Dred Scott* court. He would demand a jurisprudence where the Preamble's "Blessings of Liberty" act as a trump card over historical tradition whenever the two diverge.
