prompt: |-
  I've been down a Frederick Douglass rabbit hole this week (started from an offhand line in a Motte CW roundup, as these things do) and I'm stuck on something nobody in the thread wanted to actually argue about instead of just gesturing at it. Douglass spent the 1840s agreeing with Garrison that the Constitution was, in Garrisons words, a "covenant with death," then flipped hard around 1851 and spent the rest of his career arguing the opposite. His fullest version of the flip is the 1860 Glasgow speech, "The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?", and the thing that gets me about that speech is it's doing two interpretive moves at once without ever admitting they might not point the same direction. Move one is basically proto-public-meaning-originalism: don't go digging through Madison's convention notes for what the framers secretly meant, just read the document the way a competent reader of 1787 would've read it -- and since the words "slave" and "slavery" appear nowhere in it, slavery isn't in there. Move two is a straight-up higher-law/natural-rights appeal: liberty and justice (per the Preamble) are the default setting the text has to be read against, and anything cutting into them needs explicit, unambiguous language. Those two moves can obviously diverge once you're not the one picking the test cases, which he definately was.

  So here's the actual question: dress modern-day Douglass up as a time traveler and make him sit through the last decade-plus of Supreme Court terms before he answers. Does he end up siding with the "public meaning" originalists (his move one, grown up and everywhere) or does he decide that whole project is a hostile takeover of a method he only ever deployed in service of move two? I want your actual read on how he'd react to specifics, not just "he'd feel complicated" -- e.g. Shelby County gutting the Voting Rights Act's preclearance regime on basically textualist/federalism grounds, Dobbs using originalist history-and-tradition analysis to kill a right he would've wanted kept, and Bostock, where garden-variety textualism spat out a result he'd probably cheer for. If you have to hedge, fine, but give me an actual leaning and defend it using the structure of his own arguments, not vibes about his general politics.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Frederick Douglass's shift on the Constitution (Garrisonian "covenant with death" vs. Anti-Slavery Constitutionalism).
      *   **Core Tension:** The user identifies two interpretive moves in Douglass's 1860 Glasgow speech:
          1.  *Proto-Public-Meaning Originalism:* Read the text as a competent 1787 reader would (no "slave" in text = no slavery sanctioned).
          2.  *Higher-Law/Natural-Rights:* Read the text against the backdrop of liberty/justice (Preamble); ambiguity resolves in favor of liberty.
      *   **The Question:** If modern-day Douglass time-traveled and watched the last decade of SCOTUS, would he side with "public meaning" originalists (Move 1) or view that project as a hostile takeover of his method which was always in service of Move 2 (Natural Rights)?
      *   **Constraints:** No vague "he'd feel complicated" answers. Need an actual leaning/verdict. Must use the structure of his own arguments. Must address specific cases: *Shelby County*, *Dobbs*, *Bostock*.

  2.  **Deconstruct Douglass's Constitutional Theory:**
      *   *Context:* Douglass wasn't an academic legal theorist; he was an activist. His interpretation was *teleological*. The goal was abolition and equality.
      *   *Move 1 (Textualism/Originalism):* Why did he use this? To counter the Garrisonians who said the Union was illegitimate. He needed to show that the *legal* machinery of the US could be used for good. He argued the text *itself* didn't mandate slavery.
      *   *Move 2 (Natural Law):* Why did he use this? To establish the *moral* baseline. The Constitution is an instrument to secure pre-existing rights ("secure the Blessings of Liberty").
      *   *Relationship:* Move 1 was the *tactic*; Move 2 was the *strategy*. Move 1 only worked because Douglass believed the text, properly read, aligned with Move 2. If Move 1 produced results contrary to Move 2 (i.e., protecting oppression), Douglass would discard Move 1.
      *   *Key Quote/Concept:* "The Constitution is a glorious liberty document." Why? Because its *objects* are liberty. If the text fails that object, the text is subordinate to the object.

  3.  **Evaluate Modern Originalism/Textualism through Douglass's Lens:**
      *   *Modern Originalism (Scalia/Thomas/Barrett/etc.):* Often claims neutrality. Focuses on historical understanding of specific provisions.
      *   *Douglass's Critique:* He would spot immediately that "neutrality" often codifies the status quo of 1787/1868, which included racial hierarchy.
      *   *The "Hostile Takeover" Thesis:* The user suggests Move 1 might be a hostile takeover of a method deployed in service of Move 2. This seems highly plausible. Douglass used textualism *because* it helped liberty. Modern textualism often hinders it (in his view).

  4.  **Analyze Specific Cases:**

      *   ***Shelby County v. Holder (2013):***
          *   *Holding:* Struck down VRA preclearance formula.
          *   *Reasoning:* Federalism, equal sovereignty of states, textual reading of the 15th Amendment (remedial powers must be congruent/proportional).
          *   *Douglass's View:* Douglass spent his post-war career begging for federal protection of Black voting rights. He viewed the 15th Amendment as a *guarantee*, not a suggestion. He would see *Shelby County* as a betrayal of the Reconstruction Amendments' *purpose*. The "text" of the 15th Amendment ("The right... shall not be denied") is absolute. Using federalism to blunt it would look like the *Dred Scott* logic to him.
          *   *Verdict:* Hostile.

      *   ***Dobbs v. Jackson (2022):***
          *   *Holding:* Overruled *Roe*, no constitutional right to abortion.
          *   *Reasoning:* History and tradition analysis. No deep root in 1868 understanding.
          *   *Douglass's View:* This is the trickiest one. Douglass was socially conservative by modern standards. However, his *method* is about bodily autonomy and natural rights ("liberty"). He argued against the *Dred Scott* decision which treated humans as property. *Dobbs* relies on a history/tradition that explicitly excluded women from full citizenship. Douglass argued that the 14th Amendment *changed* the baseline. He would likely reject a "history and tradition" test that locks in 1868 patriarchy, just as he rejected locking in 1787 slavery. He argued the Constitution *grows* toward liberty.
          *   *Verdict:* Skeptical/Hostile (based on the method of freezing history).

      *   ***Bostock v. Clayton County (2020):***
          *   *Holding:* Title VII covers sexual orientation/gender identity.
          *   *Reasoning:* Textualism. "Because of sex" means because of sex.
          *   *Douglass's View:* He would love the result. He would appreciate the textual fidelity. *But*, would he trust the method? If the text said something else, would the result hold? He liked textualism when it protected the vulnerable. *Bostock* fits Move 1 + Move 2 alignment.
          *   *Verdict:* Supportive, but wary of the method's consistency.

  5.  **Synthesize the Argument:**
      *   **Thesis:** Douglass would view modern public-meaning originalism as a **hostile takeover**. He would argue that modern originalists have severed the tether between Text (Move 1) and Liberty (Move 2).
      *   **Reasoning:** For Douglass, the text was only authoritative *because* it served liberty. When the "original meaning" conflicts with "natural rights," natural rights win. Modern originalism often claims the "original meaning" *is* the law, even if it contradicts justice. Douglass would call this idolatry of the dead hand.
      *   **The "Competent Reader" Test:** Douglass argued a "competent reader" in 1787 would read the document in light of the Declaration of Independence. Modern originalists often read it in light of common law or specific statutory understanding. Douglass would argue the "general purposes" (Preamble) control the "specific clauses."
      *   **Reconstruction Amendments:** This is key. Douglass believed the Civil War and Amendments created a *new* founding. Modern originalists often treat the 14th Amendment narrowly. Douglass saw it as a revolution. *Shelby County* ignores the revolution. *Dobbs* ignores the expansion of liberty.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Intellectual, rigorous, matching the user's depth. Avoid anachronisms but apply his logic consistently.
      *   *Structure:*
          1.  Direct Answer (Hostile Takeover).
          2.  Theoretical Framework (Teleological Constitutionalism).
          3.  Case Analysis (*Shelby*, *Dobbs*, *Bostock*).
          4.  The "New Founding" argument (14th Amendment).
          5.  Conclusion.
      *   *Refining the "Move 1 vs. Move 2" dynamic:* Emphasize that for Douglass, Move 1 was *evidence* of Move 2, not an independent constraint. If Move 1 contradicts Move 2, Move 1 is wrong. Modern originalism treats Move 1 as the constraint.
      *   *Specific Douglass References:* Mention the Glasgow speech, his 14th Amendment advocacy, his critique of *Dred Scott*.
      *   *Addressing the "Time Travel" aspect:* Make sure to frame it as his reaction to the *jurisprudence*, not just the politics.

  7.  **Self-Correction/Nuance Check:**
      *   *Did Douglass believe in judicial supremacy?* No, he believed in popular constitutionalism. He might tell the Court to get lost entirely. But the prompt asks about his reaction to their *method*.
      *   *Is *Bostock* a trap?* Gorsuch's textualism in *Bostock* is similar to Douglass's "no word 'slave'" argument. But Douglass would ask: "Does this expand liberty?" Yes. So he likes it. But he wouldn't trust Gorsuch on *Shelby County*. He would see the inconsistency as proof that the method is being weaponized.
      *   *Dobbs:* Be careful not to project modern pro-choice views onto Douglass. Focus on the *method* of history/tradition. Douglass argued the 14th Amendment *broke* tradition. *Dobbs* relies on tradition. That's the conflict.

  8.  **Final Polish:** Ensure the distinction between "original meaning" (Douglass's 1787 reader) and "original expected application" (modern originalism's focus) is clear, as Douglass rejected the latter (framers expected slavery to continue, but the text didn't mandate it). Modern originalists often conflate the two or focus on the latter under the guise of the former.

      *(Self-Correction during drafting)*: Wait, Douglass's "public meaning" argument was specifically that the *words* didn't support slavery, even if the *framers* intended to protect it. Modern originalists (like Barnett) sometimes agree with this distinction, but the current Court (like in *Dobbs* or *Bruen*) leans heavily on historical tradition/understanding. Douglass would attack the reliance on "tradition" when that tradition is oppressive.

      *Final Plan:*
      1.  Verdict: Hostile Takeover.
      2.  Core Logic: Teleology over Text.
      3.  *Shelby County:* Betrayal of the 15th Amendment's purpose.
      4.  *Dobbs:* Fetishizing 1868 oppression (same as 1787 slavery).
