      6.  Conclusion: The 14th Amendment is a Second Founding that modern originalists ignore.

  9.  (Final check against prompt constraints): "Actual leaning," "Defend using structure of his own arguments," "Not just vibes." Okay, I will ground this in his Glasgow speech logic and his post-war writings on the 14th/15th Amendments.

