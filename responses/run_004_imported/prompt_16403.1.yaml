      *   *Is CBP actually better here?* In criminal law, a jury must be unanimous on the verdict, but not necessarily on the *reasoning* (in some jurisdictions). However, administrative panels usually work differently. I should highlight that legal contexts often prefer PBP for exactly this reason (to prevent convicting based on fragmented reasoning).
      *   *Key Insight:* The 3 dissenters each voted "No Misconduct" but for *different reasons*. If you use CBP, you acquit. But do you acquit because $A$ wasn't met? Or $B$? Or $C$? If you acquit on $M$ without specifying, the researcher might think they were cleared on $A$, but a future panel might assume $A$ was true. PBP clarifies the record.

  9.  **Final Polish:** Structure with clear headings. Ensure the distinction between the "Doctrinal Paradox" and "Condorcet's Paradox" is clear (this is the former). End with a thoughtful closing on the nature of collective responsibility.

  *(Self-Correction during drafting)*: Wait, I need to make sure I don't imply one is definitively "correct." The literature is divided. I need to present the arguments for both while explaining why institutions *typically* choose PBP. The user asked if there is a *principled reason*, not necessarily a *true* answer.

