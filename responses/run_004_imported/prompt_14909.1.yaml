  1. Kasim tightened the girth on the camel. "You're unpacking? After what we saw?"

  2. Nadia folded a robe, then unfolded it. "If I leave, I confirm he's in Aleppo. If I stay, I confirm he's here."

  3. "He's already there, Nadia. My saddlebags don't reach back to yesterday."

  4. "But my choice tells me where he is. The moment I decide on Aleppo, I know I'm walking into him."

  5. "Then I'll flip a coin. Heads, we ride. Tails, we wait. Break the chain."

  6. "He predicted the coin. He predicted the fall."

  7. "He predicted the outcome, not the cause. My thumb doesn't push Death to Aleppo."

  8. "It pushes *me* to Aleppo. And where I am, he is. You're treating correlation like noise."

  9. "I'm treating it as superstition. You're paralyzed by a shadow."

  10. "I just decided to go with you. Wait. No." Nadia's hand hovered between the bag and the door.

  11. "See? It's madness. You're trying to read the future in your own pulse."

  12. "I'm tracking evidence! Every time I settle on staying, the evidence says I'm caught. So I switch to fleeing."

  13. "So stay. Accept the fixed point."

  14. "But now that I'm staying, staying is death. I can't find a stable spot. You don't feel that?"

  15. "Because there isn't one. That's why I randomize. Make it hard for him."

  16. "You think randomness breaks prediction? If he knows you, he knows your chaos."

  17. "He knows the output. He doesn't control the input. I'm still the cause of my legs moving."

  18. "Are you? Or are you just reading your line from his book? If your choice is evidence, you're not free."

  19. "If I'm not free, Aleppo has the same odds as Damascus. So I choose the sun."

  20. "And if the route determines the reader... then you're already dead. So why load the camel?"
