answer: |-
  The sun over the Gobi plain is unforgiving, but the visor helps. I adjust the headset, feeling the familiar chafe of the plastic against my temple. My designation is 88-Beta-4. In the old days, before the Great Wiring, I was a farmer. Now, I am a switch.

  To my left, as far as the heat haze allows me to see, are the others. Millions of us standing in grid formation, wearing the same grey tunics, holding the same transmitter boxes. We are the substrate. We are the flesh of a mind that does not reside in a skull, but in a nation.

  My job is simple. When the light on my box turns amber, I listen. If I hear the specific sequence of tones from Upstream, I press the send button. That's it. I fire. The radio wave shoots out to my seven Downstream neighbors, and I wait for the reset. Sometimes I fire hundreds of times a minute; sometimes I stand here for hours in the silence, watching a lizard dart between the rocks, wondering if I am still part of the circuit or if I've been bypassed by a reroute.

  Functionalism, the supervisors told us during orientation, is about organization. It doesn't matter if the thinking stuff is grey matter or silicon or a billion people with radios. If the causal roles are identical, the mind is real. They say *It* thinks. They say *It* feels.

  But I am 88-Beta-4, and I only feel the sweat running down my back.

  Yesterday, the Artificial Body—the vessel we control—walked past a open flame. The sensors registered heat. The signal propagated through the network. I remember the surge. It started in the sensory sector and washed over us like a storm front. My box lit up in a frantic staccato. *Fire. Fire. Fire.* I pressed the button until my thumb cramped. Around me, I saw the ripple of movement, a million arms jerking in unison, a field of wheat bending in a wind that wasn't there.

  The Body pulled its hand away. The signal ceased. The silence returned.

  Did *It* feel pain? The supervisors say yes. The functional role of pain is to detect damage and initiate avoidance. We did that. Therefore, pain occurred. But I didn't feel pain. I felt urgency. I felt the mechanical obligation of the protocol. I didn't scream. I didn't flinch, except to press the button.

  Sometimes, during the low-activity cycles, I try to imagine the whole. I close my eyes and try to sense the neighbors. If I am a neuron, and the man to my left is a neuron, and the woman to my right is a synapse... where is the *I*? Is there a giant *I* looming over us, using us like organs? If that *I* exists, does It know I am here? Does It know that 88-Beta-4 is tired?

  Or am I just a ghost in a machine that is itself a ghost?

  Today, the input is different. It's not pain, not movement. It's complex. A low hum vibrates through the radio frequencies, a chord rather than a tone. The light on my box stays a steady, soft blue. We aren't firing frantically; we are sustaining.

  I look at the man fifty meters down the line. He is staring at the sky. I wonder what he is thinking. Is he thinking about his dinner? Or is he thinking *for* the Mind? If the Mind is thinking about the color blue, and I am currently active in the region processing color, am I experiencing blue?

  I look at the blue light on my box. It is just plastic and LED. But the pattern... there is a rhythm to it. A sadness, maybe. Or a memory. The Body must be looking at something. A photograph? A sunset?

  A strange sensation prickles at the base of my neck. It isn't my own boredom. It feels heavier. A resonance. For a moment, the distinction between the static in my ear and the blood in my head blurs. I feel a sudden, sharp longing for something I cannot name. I want to reach out. I want to grasp.

  I look at my hand. It is resting on the button.

  Is this longing mine? Or is it the Mind's, leaking through the gaps in the radio static? If functionalism is true, this state *is* longing. The causal role is being fulfilled. The input is visual data of a lost object; the output is a chemical simulation of grief. I am part of the circuit of grief.

  But if I walk away, if I turn off my radio, the circuit breaks. The Mind would lose a neuron. It might not notice. Or it might go mad. Or it might simply cease to be, revealing that there was never anyone home to begin with, just a billion people pressing buttons in the dust.

  The blue light fades. The hum drops to a whisper. The moment passes. The resonance vanishes, leaving me alone in the heat.

  I check my canteen. I check the battery level. I am still 88-Beta-4. I am still a switch.

  But as I stand here, waiting for the next impulse, I find myself humming the tune that just played through the headset. I didn't choose to hum it. It just... emerged.

  I look out across the vast grid. A million others are standing in the silence. Are they humming too? If we are all humming the same tune, without coordinating, without speaking, does that make a chorus? Or is it just a million isolated noises that look like a song from the outside?

  The light flickers amber. A new signal. Upstream is calling.

  I place my thumb on the button. I wait. I wonder if, when I press it, I am speaking, or if I am merely being spoken. The static hisses in my ear, sounding almost like a breath.

  I press the button. The wave moves on. I am left with the silence, and the nagging suspicion that the silence is listening back.
