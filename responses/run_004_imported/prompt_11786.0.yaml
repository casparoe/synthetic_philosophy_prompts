answer: |-
  **Setting:** *A dimly lit Italian place, the kind with Chianti bottles in mesh baskets. The remains of a shared rigatoni sit between them. Elena swirls her wine; David folds his napkin.*

  **Elena:** You're dodging the text, David. Nietzsche isn't just saying the Jews got annoyed at the Romans. He's saying the very concept of 'good' we're sitting on was forged in a furnace of impotent hate. It's *ressentiment* crystallized into dogma. You can't drink from a cup that was poisoned at the well.

  **David:** That's the genetic fallacy, El. In fancy prose, but still. Where a thing comes from doesn't dictate what it is. Penicillin comes from mold; that doesn't make it less effective at saving a life. If the moral code keeps a widow from starving or a addict from overdosing, I don't care if the guy who wrote it was trying to spite a Roman centurion.

  **Elena:** It's not about effectiveness, it's about truth. If I tell you I love you because I value you, that's one thing. If I tell you I love you because I'm terrified of being alone and need to control your affection, that's a lie. Nietzsche is just the X-ray showing the bone structure. The bone is rotten. You're a priest; you trade in truth. How can you consecrate a lie?

  **David:** Because you're conflating the psychological origin with the metaphysical object. Sure, maybe the *impulse* to organize the tribe came from fear or weakness. But the *object* of that impulse—God, or the Good, or Charity—exists outside the impulse. Just because my hand shakes when I offer the host doesn't mean the wine isn't wine.

  **Elena:** But Nietzsche says there *is* no object outside the impulse! That's the point of the Genealogy. There is no 'Good' floating in the ether waiting to be found. There's only the will to power. The priests just found a way to win by pretending to lose. They made weakness look like a choice. 'I didn't get revenge because I'm too holy,' when really, they just couldn't get revenge.

  **David:** And yet, look around. Who's actually holding the community together when the lights go out? The guys posturing about their strength, or the people trained to value humility? If the 'slave morality' trick works to keep us from tearing each other apart for two thousand years, maybe it's not a trick. Maybe it's an adaptation.

  **Elena:** An adaptation for survival, sure. Not for greatness. It's a morality of the herd. It levels the peaks to protect the valley. You're shepherding people into being comfortable, mediocre, safe. Nietzsche wants you to risk the fall to see if you can fly. You're just padding the floor so no one ever jumps.

  **David:** I've stood at enough hospital bedsides to know that 'greatness' is overrated when you're coughing up blood. People don't need to fly, Elena. They need to not be alone. If calling that 'slave morality' helps you feel superior to them, fine. But don't pretend your 'greatness' feeds the hungry. My 'mediocrity' does.

  **Elena:** See, that's the ascetic priest talking right there! You're using their suffering to justify your power over them. You make them love their chains. 'Be humble, be poor, be meek,' because that's how you win the ultimate game. It's the ultimate con. You're monetizing their inability to cope with reality.

  **David:** Or I'm giving them a language to make sense of the pain that you, with all your classics, can't explain away. You think knowing the etymology of 'sin' cures the guilt? It doesn't. Nietzsche offers a diagnosis, I'll give him that. But he offers no cure. Just a shrug and a command to be harder. I offer a way to carry the burden.

  **Elena:** He offers freedom! Freedom from the bad conscience. Freedom from thinking you're inherently broken. You say you carry the burden, but you're actually teaching them to *love* the burden. That's the insidious part. The ascetic ideal makes suffering meaningful so people don't suicide. It's a life-preserver made of lead.

  **David:** And if it keeps them afloat? You talk about freedom like it's the highest good. I talk about love. If loving my neighbor requires me to deny my own will to power, to swallow my pride, to serve—call it slave morality if you want. But when I do it, I feel more human, not less. Does your 'free spirit' feel more human than a mother feeding her child at her own expense?

  **Elena:** A mother feeding her child isn't doing it because of a metaphysical wager on the afterlife. She's doing it out of instinct. Nietzsche respects instinct. What he hates is the *system* you build on top of it to guilt-trip anyone who deviates. You've institutionalized the instinct and called it dogma.

  **David:** Dogma is just the container. You're a classicist; you know how much blood is in the margins of Homer. Achilles isn't exactly a Boy Scout. We civilized that. We took the Achilles in us and put him in a pew. If that's a 'taming,' if that's 'weakness,' then civilization is weak. And I'll take weak over barbaric any day.

  **Elena:** But at what cost? The cost is the exceptional individual who gets crushed by the weight of the herd's expectations. The cost is the vitality of the species. You're preserving the sick at the expense of the healthy. Nietzsche is the only one honest enough to say that protecting the weak might actually be bad for life itself.

  **David:** 'Bad for life itself.' That's an abstract. I deal in particulars. The sick *are* the life. Christ wasn't hanging out with the Olympians. If your philosophy requires sacrificing the weak to validate the strong, then your philosophy is the one that's life-denying. Not mine.

  **Elena:** I'm not saying sacrifice them. I'm saying stop pretending their condition is a virtue. Call weakness weakness. Call strength strength. Stop calling weakness 'holiness' just to make the weak feel better about losing.

  **David:** And I'm saying that without that 'pretense,' as you call it, the weak get discarded. You want honesty? Fine. I'm honest. I tell them they are loved, not because they are strong, but because they exist. If that's a lie invented by resentful priests, it's the only lie that's ever made anyone worth saving.

  **Elena:** *[She stops swirling her wine. The glass rests on the table.]* So you admit it's a lie.

  **David:** *[He picks up the check.]* I admit I don't know where it comes from. I only know where it goes.

  **Elena:** And where's that?

  **David:** *[He signals the waiter.]* To the grave. With dignity. Or without it. That's the only choice that actually matters.

  **Elena:** *[She looks at him, mouth slightly open, then looks down at her wine.]* You're impossible.

  **David:** I'm ordained. There's a difference.
