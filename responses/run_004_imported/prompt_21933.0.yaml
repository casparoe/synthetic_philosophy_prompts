answer: |-
  This is a fascinating counterfactual that cuts to the very heart of Hobbes's philosophical project. Given your familiarity with Jesseph's *Squaring the Circle* (1999) and the broader literature on Hobbes's *scientia*, you are well-positioned to recognize that the Hobbes-Wallis dispute was never merely a technical error corrected by better calculation. It was a clash of ontologies and epistemologies.

  To answer your question directly: **Hobbes would almost certainly have rejected Lindemann's proof as a genuine geometrical demonstration.** Moreover, he would have had principled, systematic resources within his own philosophy to do so. It would not have been a case of mere stubbornness (though that was certainly present in the Wallis affair), but rather a consistent application of his criteria for what constitutes *scientia* (causal knowledge) versus what he would dismiss as *computatio* (symbolic manipulation) or *sophistry*.

  Here is an assessment of how Hobbes's specific philosophical commitments would likely have led him to dismiss the 1882 proof, structured around his core doctrines on geometry, method, and the nature of impossibility.

  ### 1. The Ontology of the Geometrical Object: Magnitude vs. Number
  The most fundamental barrier Hobbes would raise against Lindemann is ontological. For Hobbes, the subject of geometry is not number, nor is it abstract extension; it is **magnitude generated by motion**. As he argues in *De Corpore*, geometrical figures are "phantasms" of bodies, and their properties are derived from the manner of their generation.

  Lindemann's proof is a triumph of arithmeticization. It treats $\pi$ not as a ratio of magnitudes generated by motion, but as a number within a field extension, defined by its algebraic properties (specifically, its relation to polynomial equations with rational coefficients). Hobbes consistently subordinated arithmetic to geometry. He viewed numbers as "phantasms of phantasms"—abstractions derived from counting bodies, and thus secondary to the continuous magnitudes of geometry.

  Faced with Lindemann, Hobbes would likely argue that the proof demonstrates a limitation of **number**, not of **magnitude**. That $\pi$ cannot be expressed as the root of a rational polynomial tells us something about the inadequacy of arithmetic to capture certain geometric ratios, but it does not, for Hobbes, prove that the *geometric object* (the square equal in area to the circle) cannot be constructed via motion. He would likely maintain that the transcendence of $\pi$ is an artifact of the symbolic algebraic method, which fails to grasp the continuous nature of bodily motion. In Hobbes's view, Wallis and his successors (including Lindemann) were confusing the map (symbols/numbers) with the territory (bodies/motion).

  ### 2. The Criteria of Demonstration: Causal Generation vs. *Reductio*
  Hobbes's theory of demonstration is rigorously causal. To know a geometric truth is to know the **cause** of the figure's properties. As he writes in *De Corpore*, "demonstration is a syllogism... from the consideration of the generation of the thing." We know the circle because we define it by the motion of a radius; we know its properties because we trace them back to that generative motion.

  Lindemann's proof is fundamentally non-constructive in the Hobbesian sense. It is a proof by contradiction (*reductio ad absurdum*) within an analytic framework. It assumes the existence of $\pi$ within the complex field and shows that assuming it is algebraic leads to a contradiction.

  Hbes famously detested indirect proof. He argued that *reductio* might convince an adversary that they are wrong, but it does not teach *why* the truth is true. It provides no causal genesis. For Hobbes, a proof of impossibility must show a contradiction in the **generation** of the object (e.g., that the motion required to generate the square would simultaneously require the body to be in two places at once). Lindemann's proof shows no such physical or kinematic contradiction; it shows a formal inconsistency within a system of algebraic equations. Hobbes would likely categorize this as a dispute over definitions of symbols, not a demonstration about the nature of bodies in space. He would argue that Lindemann has not shown the squaring is impossible, only that it is inexpressible within the specific symbolic constraints of 19th-century analysis.

  ### 3. The Rejection of "Universal Algebra" and Symbolic Methods
  You noted Hobbes's suspicion of the algebraic methods Wallis was importing. This suspicion hardened into a central tenet of his later philosophy. He viewed the new symbolic algebra (from Viète through Descartes to Wallis) as a "scab of symbols" that obscured reasoning rather than clarifying it. He believed that reasoning should be performed on the **things themselves** (the magnitudes), not on arbitrary marks.

  Lindemann's proof is the apotheosis of the tradition Hobbes despised. It relies on complex analysis, infinite series, and field theory—layers of symbolic abstraction far removed from the intuition of spatial motion. Hobbes would likely argue that the proof suffers from the very defect he accused Wallis of: it treats geometry as a branch of algebra.

  For Hobbes, the certainty of geometry stems from the fact that we lay down the definitions and construct the objects ourselves. If the method of proof relies on a symbolic machinery (like the theory of transcendental numbers) that the geometer did not construct from first principles of motion, it lacks the self-evident certainty of *scientia*. He would likely view the assumptions of analysis (limits, continuity defined arithmetically, etc.) as unproven postulates, lacking the intuitive clarity of kinematic generation.

  ### 4. The Concept of Impossibility
  Finally, consider how Hobbes understands impossibility. In his disputes with Wallis, Hobbes often conceded that certain things are impossible *if* one restricts oneself to specific tools, but he resisted the idea that the *geometric problem* itself was unsolvable.

  Lindemann proves that the circle cannot be squared using **straightedge and compass** (because those tools correspond to quadratic field extensions). However, Hobbes's own attempted solutions often relied on mechanical curves or motions that were not strictly Euclidean (even when he claimed they were). If pressed, Hobbes might argue that the restriction to straightedge and compass is an arbitrary constraint of the *tool*, not the *truth*.

  More deeply, Hobbes might challenge the notion that "squaring the circle" requires expressing the ratio as a number. For Hobbes, geometry is about the equality of magnitudes. If one can construct a square that *is* equal to the circle (via some kinematic process), the fact that the *ratio* of their sides is "transcendental" in the arithmetic sense is irrelevant to the geometric truth. The geometric equality is perceived by the mind through the construction; the arithmetic inexpressibility is a failure of the number system to capture the magnitude. Since Hobbes privileges magnitude over number, the geometric construction (if he believed he had one) trumps the arithmetic proof of impossibility.

  ### Conclusion: A Principled Standoff
  Would Hobbes have been *correct* to reject Lindemann? By the standards of modern mathematics, no. The arithmeticization of the continuum is the foundation of modern analysis, and Lindemann's proof is valid within that framework.

  However, would Hobbes have been **consistent** with his own epistemology? **Yes.** To accept Lindemann's proof, Hobbes would have had to abandon:
  1.  His materialist ontology of geometry (objects as bodies in motion).
  2.  His causal theory of demonstration (rejecting *reductio* and symbolic derivation).
  3.  His subordination of arithmetic to geometry.

  For Hobbes to accept Lindemann would be to concede that Wallis was right about the nature of mathematical method—that geometry is ultimately a species of symbolic calculation rather than the science of spatial causation. Since Hobbes's entire philosophical system (from *De Corpore* to *Leviathan*) rests on the idea that true *scientia* is knowledge of causes generated by definition, he would be epistemologically compelled to view Lindemann's proof as a sophisticated piece of **ratiocination** (calculation) that fails to achieve **demonstration** (causal knowledge).

  He would likely conclude that Lindemann had proven that the *number* $\pi$ is transcendental, but not that the *circle* cannot be squared by motion. In this light, his refusal to concede would not be the senile stubbornness of an old man (as Wallis portrayed him), but a tragic, coherent defense of a philosophy of mathematics that the discipline had ultimately left behind.

  For your dissertation, this angle offers a rich way to contextualize the Wallis dispute not as a historical curiosity, but as a pivotal moment where the "Hobbesian" vision of mathematics (constructive, kinematic, causal) lost out to the "Wallisian" vision (symbolic, algebraic, analytic). The Lindemann counterfactual underscores that this was not just a temporary misunderstanding, but a fundamental divergence in what counts as mathematical knowledge.
