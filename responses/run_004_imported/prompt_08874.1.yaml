prompt: |-
  I'm on the volunteer committee that runs our community garden (about 35 plots). One rule is nobody runs the shared hose more than 15 minutes a day, since going over tanks the water pressure for everyone else's plot. Last week Diane filed a formal complaint against another member, Mark, for running his 40+ minutes most nights, and wants him formally warned, which under our rules means he loses his plot if it happens again.

  Problem is, Diane did basically the same thing last summer, for even longer, and when we called her out on it directly she just said she'd fix her irrigation timer — nothing formal ever went on record.

  Now the committee's split down the middle. Half say we can't really act on her complaint, or at least she shouldn't be the one bringing it, since she got away with doing the exact same thing. The other half says that's beside the point — Mark either broke the rule or he didnt, and it shouldn't matter who's reporting him.

  We meet again Tuesday, right before spring plot reassignments, and I need something to actually bring. Can you write the recommendation memo — what happens with Mark, what (if anything) we say to Diane about her own complaint, and by when — and please really engage with the "she's got some nerve" side instead of just waving it off, cause that's the half I can't argue my way out of.
reasoning: |-
  Here's a thinking process that leads to the suggested recommendation memo:

  1.  **Analyze the Request:**
      *   **Context:** Community garden volunteer committee (35 plots).
      *   **Rule:** Shared hose limit = 15 mins/day. Violation = Formal Warning (2nd offense = loss of plot).
      *   **Situation:** Diane complained about Mark (40+ mins/night). She wants a formal warning for him.
      *   **Complication:** Diane did the same thing (worse) last summer. She was called out informally, promised to fix it, no formal record.
      *   **Conflict:** Committee split.
          *   Side A: "She's got some nerve." Can't act on her complaint/She shouldn't report because she broke the rule too. Hypocrisy undermines authority.
          *   Side B: "Rules are rules." Mark broke the rule, reporter identity doesn't matter.
      *   **Deadline:** Meeting Tuesday (before spring plot reassignments).
      *   **Task:** Write a recommendation memo.
      *   **Specific Instruction:** *Really engage* with the "she's got some nerve" side (Side A). Don't wave it off. This is the user's sticking point.
      *   **Deliverables:** What happens with Mark? What happens with Diane? Timelines?

  2.  **Determine the Goal:**
      *   Resolve the immediate conflict (Mark's violation).
      *   Address the equity/fairness issue (Diane's past violation).
      *   Preserve community cohesion (avoid factionalism).
      *   Establish a clear precedent for the future (consistency).
      *   Ensure the recommendation is actionable by Tuesday.

  3.  **Evaluate the "She's Got Some Nerve" Argument (Side A):**
      *   *Why is this valid?* It's about perceived fairness and legitimacy. If enforcement looks selective or vindictive, members lose trust in the committee. It feels like "cleaning house" to cover one's own tracks. It creates a toxic "gotcha" culture.
      *   *Why can't we just ignore it?* If we ignore it, the committee looks corrupt or inconsistent. Future rule enforcement will be harder.
      *   *How to address it without punishing Mark unfairly?* We must separate the *violation* from the *reporter*. Mark *did* break the rule. Punishing Mark less because Diane is a hypocrite punishes the community (water pressure issues). However, we must address Diane's behavior to validate Side A's concerns.

  4.  **Evaluate the "Rules are Rules" Argument (Side B):**
      *   *Why is this valid?* Consistency is key to governance. If we don't enforce against Mark, the rule dies. Water pressure affects everyone.
      *   *Risk:* Ignoring the hypocrisy alienates half the committee and potentially the wider membership if word gets out.

  5.  **Develop a Strategy (The "Third Way"):**
      *   **Mark:** The violation must be addressed. The water pressure issue is real and affects 35 plots. Ignoring it hurts the community. *However*, the penalty should be applied consistently. Since it's his first *formal* warning, he gets the warning.
      *   **Diane:** Her complaint is valid regarding Mark, *but* her past behavior needs to be acknowledged to satisfy Side A. We can't punish her retroactively without a paper trail, but we can set a "clean hands" expectation moving forward. We need to communicate that while her report was accepted, her past non-compliance is noted and future leniency is gone.
      *   **The Committee:** Needs to adopt a policy that separates reporting from enforcement history, *but* acknowledges that past informal warnings should be logged to prevent this exact scenario.
      *   **Tone:** Professional, firm, community-focused, equitable.

  6.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format.
      *   **Subject:** Clear and specific.
      *   **Opening:** State the purpose (decision on complaint & policy).
      *   **Addressing Mark (The Violation):** Acknowledge the data (40 mins > 15 mins). Enforce the rule. Why? Because water pressure is a shared resource.
      *   **Addressing Diane (The Hypocrisy/Equity Issue):** This is the crucial part. I need to validate Side A here.
          *   Acknowledge the concern: "Perception of fairness."
          *   State the fact: She did violate previously.
          *   The Decision: Her report stands (whistleblowing is good), *but* she is not immune.
          *   Action: Her past informal warning is now formalized/recorded effectively immediately. If she slips *once*, she faces the same consequences as Mark. This levels the playing field.
      *   **Policy Change (Preventing Recurrence):** Informal warnings need to be logged. "Clean Hands" doctrine isn't a legal bar, but consistency is required.
      *   **Timeline:** Tuesday meeting -> Implementation by Wednesday.

  7.  **Refining the Argument for Side A ("She's Got Some Nerve"):**
      *   *Drafting thought:* I need to explicitly say, "You are right to feel this is unfair."
      *   *Refinement:* "The committee's concern regarding equity is valid. Enforcement loses legitimacy if it appears selective."
      *   *Solution:* We treat Diane as being on "thin ice" equivalent to Mark's warning. This makes them equals in the eyes of the rules.

  8.  **Review against Constraints:**
      *   *Engage with Side A?* Yes, by formalizing Diane's past infraction as a current standing warning.
      *   *What happens with Mark?* Formal Warning (1st strike).
      *   *What happens with Diane?* Her complaint is processed, but her past infraction is moved from "informal" to "active record," putting her on equal footing.
      *   *Timeline?* Before Tuesday meeting/plot reassignments.

  9.  **Final Polish:**
      *   Ensure the tone isn't accusatory but administrative.
      *   Make sure the water pressure issue (the *why* of the rule) is highlighted so it doesn't become just about personality clashes.
      *   Check that the "loss of plot" consequence is clear for the *next* violation for both.

  10. **Self-Correction during drafting:**
