          *   **The Concession:** He admitted that natural selection *is* testable. We can test specific hypotheses about adaptation. The theory makes predictions about what traits *won't* exist (e.g., traits that reduce survival without compensation).
          *   **The Nuance:** He didn't say "I was wrong about everything." He said, "I was wrong to classify it as metaphysical *in principle*, though it retains a historical narrative element that makes it different from physics."
      *   *Phase 3: Evolutionary Epistemology.*
