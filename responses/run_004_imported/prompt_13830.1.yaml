      *   **User Persona:** Retired evolutionary biologist (35 years experience), specialized in cichlid fish speciation (African rift lakes). This means they have deep technical knowledge of evolutionary biology, speciation mechanisms, and the practical application of the theory. They are not a layperson. They are familiar with Popper's name-dropping in papers but haven't read the primary texts until now.
