answer: |-
  Friends, family, colleagues, and students.

  Thank you for being here. I know many of you are carrying a heavy weight today. I am, too.

  Standing here, I am acutely aware of the room we are in. Half of us have spent years debating the nuances of the texts she loved; the other half loved *her*—the woman, the mother, the wife, the friend. My task is to speak for both groups, which is difficult, because she was a person who hated comfortable lies.

  If I were to stand here and tell you that she is in a "better place," or that she is watching over us right now, I know exactly what would happen. Somewhere, she would be rolling her eyes so hard it would disturb the peace of the whole ceremony. She might even sit up to argue the point.

  She spent her life studying the *Zhuangzi*, not just as a job, but as a guide for how to breathe. And the hardest lesson in that book—the one she taught every year, and the one she lived by—is that death is not a departure to a new location. It is a transformation.

  She used to tell us the story of Zhuangzi's wife dying. When his friend came to offer condolences, he found Zhuangzi sitting on the ground, drumming on a basin and singing. It sounds shocking. It sounds cold. But she explained that he wasn't singing because he didn't care. He sang because he realized that his wife hadn't been "lost." She had simply changed form. She had gone from breath to body, from life to death, just as spring turns to summer, and autumn turns to winter.

  To the family: I know this doesn't stop the ache. She knew it wouldn't. Zhuangzi cried when his wife died, *before* he started drumming. Grief is natural. It is the tax we pay for love. She never asked us not to grieve. She only asked us not to let grief turn into a fear of the natural order. She didn't want us to imagine her hovering somewhere else, because she believed she was already exactly where she needed to be: returning to the great flow of things.

  She had a very specific sense of humor about this, too. Many of you know that near the end of his life, Zhuangzi told his students not to bother with a fancy burial. He said, "I will have the sky and earth for my coffin, the sun and moon for my jade beads. The crows and kites will eat me above ground, or the worms will eat me below. Why favor one over the other?"

  [Name] loved that story. In fact, she made us promise that we wouldn't spend a fortune trying to preserve her. She said, quite seriously, that she had always liked birds more than worms, so if we had to choose, she'd prefer to feed the crows. I tell you this not to make light of her passing, but to remind you of her wit. She faced the end with a joke, because she refused to be intimidated by it.

  So, how do we find comfort in this? If she isn't "watching over us," where is she?

  She is in the transformation itself. She is in the way her ideas have taken root in us. A teacher does not persist by remaining the same; a teacher persists by changing the students who come after them. I look around this room and I see her mind at work in the colleagues she mentored. I see her kindness in the family she raised. I see her curiosity in the students she guided. She is not a ghost haunting this room; she is the ground we are standing on.

  She taught us a phrase once, a way of navigating a world that is constantly changing. She called it "walking two paths at once."

  It means we can love someone deeply, fully, with our whole hearts, while simultaneously accepting that they are transient. It means we can stand here today, heartbroken that she is gone, and yet find ourselves smiling when we remember her joke about the crows. It means holding on and letting go at the same time.

  To her family: Thank you for sharing her with us. You gave us the privilege of knowing the person behind the scholarship. You taught us that the philosophy wasn't just ink on paper; it was the way she made coffee, the way she listened, the way she faced the end without flinching.

  To my colleagues: We have lost a pivot. The hinge of our department has gone quiet. But the door still swings.

  [Name] is not gone to a distant heaven. She has simply completed the cycle she spent her life describing. She has returned to the great earth, to the spring and autumn of the world.

  So, let us not pretend she is somewhere else. Let us honor her by being exactly where we are. Let us grieve, because we loved her. Let us laugh, because she would want us to. And let us live in a way that honors the transformation she taught us to respect.

  Thank you.
