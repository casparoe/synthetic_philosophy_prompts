answer: |-
  You are not being unreasonable. Your instinct is correct, and while your partner's logic is internally consistent, it is applied to the wrong framework. She is treating this as a **factual question** (is the date passed?), when in reality, it is a **risk management question** (how certain do we need to be?).

  Here is the breakdown of what she is missing, why the location matters immensely, and how you can resolve this without turning it into a power struggle.

  ### 1. The Stakes Have Changed (Risk vs. Consequence)
  Her argument is that the *probability* of the injector being expired hasn't changed. Statistically, she is right. However, the *consequence* of it being expired has changed drastically.

  *   **At Home:** If the injector is expired or faulty, the consequence is a stressful drive to the pharmacy or ER. The risk is manageable.
  *   **In the Backcountry:** If the injector is expired or faulty, the consequence is anaphylactic shock with no advanced medical care for hours or days. The risk is potentially fatal.

  In risk management, as the severity of the consequence increases, the standard for verification must also increase. Relying on a memory from two months ago is an acceptable risk for a Tuesday at the office. It is an unacceptable risk for a remote wilderness expedition. You aren't asking for new information; you are asking for **current verification** because the cost of being wrong is now infinite.

  ### 2. Expiration Dates Are Not the Only Failure Mode
  Your partner is fixated on the printed date, but epinephrine is a sensitive medication. It degrades based on environmental conditions, not just time.
  *   **Temperature:** Epinephrine degrades faster when exposed to extreme heat or cold. In the two months since she checked it, has that injector been in a hot car? A freezing pocket? A humid bag?
  *   **Physical Inspection:** A proper check isn't just reading the date. It involves looking at the viewing window to ensure the liquid is clear and colorless. If it is discolored or contains particles, it is unsafe to use regardless of the expiration date.

  By refusing to check it now, she is ignoring the possibility that the *condition* of the drug has changed since her last check, even if the *date* has not.

  ### 3. The "Pre-Flight Check" Protocol
  In high-reliability fields (aviation, climbing, surgery), professionals perform checks immediately before the event, every single time.
  *   A pilot does not say, "I checked the fuel levels this morning, so we don't need to check them again before takeoff."
  *   A climber does not say, "I tied my knot an hour ago, so I don't need to check it before I rappel."

  They check again because human memory is fallible and conditions change. By insisting on a check now, you are attempting to establish a **safety protocol**, not questioning her honesty or memory. In a high-risk environment, redundancy is the only safety net.

  ### 4. The Cost of Verification is Negligible
  This is the most practical point. What is the "cost" of pulling the injector out of the bag and looking at it?
  *   **Time:** 15 seconds.
  *   **Effort:** Minimal.
  *   **Benefit:** 100% certainty for both partners, shared mental model of safety, and peace of mind for two weeks.

  When the cost of verification is near zero, but the cost of failure is life-threatening, the rational choice is *always* to verify. Her irritation suggests she views your request as an implication of incompetence ("You think I didn't check it properly"), rather than a standard safety procedure ("We check everything together before we leave").

  ### How to Handle This Now
  Since you are likely still in the preparation phase (or perhaps already on the trip), you need to de-escalate the emotion and focus on the protocol.

  1.  **Validate, then Reframe:** Acknowledge her competence.
      *   *"I know you checked it, and I trust that you did. I'm not questioning your memory."*
  2.  **Explain the Risk Context:**
      *   *"But because we're going where there's no hospital, my anxiety about 'what-ifs' is higher. For my own peace of mind, I need to see it with my own eyes so we can both be 100% sure."*
  3.  **Include the Physical Check:**
      *   *"Also, I read that heat can mess with the liquid even if the date is good. Let's just check the window together to make sure it's clear."*
  4.  **Make it a Shared Ritual:**
      *   Frame it as something *you* do together, not something *she* must do for *you*. "Let's do a final gear safety check together."

  ### Summary
  She is missing the concept that **safety is contextual.** A behavior that is reasonable in a low-stakes environment (relying on past verification) becomes unreasonable in a high-stakes environment.

  You are not being neurotic; you are practicing good risk management. In the backcountry, "I think it's fine" is never good enough for life-support equipment. Check the injector.
