          2.  Challenge the metaphysics (Idealization argument).
          3.  Deploy RG (The flow explains the limit).
          4.  Reclaim Reductionism (Supervenience).
          5.  Closing thought.

  7.  **Final Polish:** Check against the prompt requirements.
      *   Argue against Batterman? Yes.
      *   Case that $N \to \infty$ doesn't imply ontological emergence? Yes.
