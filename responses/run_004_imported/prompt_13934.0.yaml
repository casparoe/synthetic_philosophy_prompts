  *(Self-Correction during drafting)*: I need to be careful not to dismiss Batterman too easily. His point is that the *explanation* of universality requires the infinite limit. My counter must be that the infinite limit is a *tool* for explanation, not a *constituent* of reality. The finite system contains all the causal powers; the infinite limit just reveals the pattern clearly.

  Let's emphasize the difference between *ontological emergence* (new stuff exists) and *explanatory autonomy* (new concepts are useful). Batterman conflates them.

  Okay, ready to write.
answer: |-
  It is a pleasure to correspond with a colleague who has actually stood at the cryostat and watched those specific heat peaks round off. You have the physical intuition that makes this philosophical puzzle so vexing: we know the math says one thing (analytic finite sums), but the lab bench says another (sharp divergences).

  Robert Batterman is a formidable thinker, and his argument is technically watertight regarding the mathematics: **Yes**, a strict non-analyticity requires $N \to \infty$. **Yes**, real systems are finite. **Therefore**, he concludes, the phase transition is ontologically emergent—it cannot be reduced to the finite micro-physics.

  However, as a physicist, your instinct that this smuggles a mathematical idealization into a metaphysical conclusion is correct. The error lies not in the statistical mechanics, but in the philosophy of modeling. Here is the strongest case I can construct against the Batterman conclusion, leveraging the very tools (RG and Universality) he often uses to support it.

  ### 1. The Idealization Argument: The Map is Not the Territory
  Batterman's argument rests on an implicit premise: *If a phenomenon is defined by a mathematical singularity in our best model, and that singularity cannot exist in the finite substrate, then the phenomenon is ontologically distinct from the substrate.*

  This conflates the **model** with the **world**. We use singularities everywhere in physics as efficient compressions of reality.
  *   **Shock waves:** In ideal fluid dynamics, a shock is a discontinuity in density. In reality, it is a steep gradient over a few mean free paths. We do not claim shock waves are ontologically emergent over and above molecular kinetics just because the Euler equations require a discontinuity to define the shock front.
  *   **Point particles:** Classical electrodynamics breaks down if electrons are truly point-like (infinite self-energy). We don't conclude electrons are emergent; we conclude the continuum model has a domain of validity.

  In your lab, you never measured an actual divergence. You measured a peak that grew sharper and higher as you approached $T_c$, limited eventually by sample inhomogeneity, impurities, and yes, finite size effects. The "phase transition" in the world is the **rapid crossover**. The "phase transition" in the textbook is the **singular limit**.

  Batterman treats the singular limit as the *essence* of the phase transition. I argue the singular limit is merely a **representational device**. It is a mathematical shorthand that allows us to calculate the properties of the rapid crossover in finite systems with immense precision. The fact that the shorthand requires infinity does not mean the reality requires it.

  ### 2. The Renormalization Group: Explaining the Limit, Not Justifying It
  Batterman leans heavily on the Renormalization Group (RG) to argue for emergence. He claims that because the RG flow moves toward a fixed point (which exists only at infinite correlation length, i.e., infinite system), the macroscopic behavior is "autonomous" from the microscopic details.

  I propose the opposite reading of the RG. The RG does not show that the macro is independent of the micro; it shows **how the micro determines the macro** through a specific mechanical process (coarse-graining).

  Consider the flow in Hamiltonian space. A finite system with $N$ spins starts at some point in this space. As we coarse-grain (block spin), the system flows toward the critical fixed point.
  *   **Batterman's view:** The fixed point is the "real" explanation, and since the fixed point is at infinity, the explanation transcends the finite system.
  *   **The Counter-view:** The fixed point is an **attractor**. The finite system's behavior is determined by its trajectory *toward* that attractor. The reason the finite system *looks* singular is that it spends a lot of "RG time" near the fixed point before flowing away due to finite-size scaling.

  The RG explains **Universality**. It tells us *why* your magnetic salts behaved like a lattice gas or a liquid-vapor system. It's not because they share a mystical emergent property; it's because the irrelevant operators in their respective Hamiltonians decayed at the same rate under the RG flow.

  This is a **reductive explanation**. It reduces the macroscopic similarity to the stability properties of the transformation rules acting on the microscopic Hamiltonians. The "emergence" is epistemic (it is surprising to us that details don't matter), not ontological (the details still causally determine the outcome, they just get washed out by the flow).

  ### 3. Finite-Size Scaling: The Bridge Back to Reality
  If phase transitions were truly ontologically emergent only at $N=\infty$, then finite systems should behave qualitatively differently, not just quantitatively. But Finite-Size Scaling (FSS) theory shows us that the finite system contains the "ghost" of the singularity in a structured way.

  The partition function zeros (Lee-Yang) for finite $N$ do not touch the real axis, but they approach it as $N^{-1/d}$. The specific heat peak scales as $L^{\alpha/\nu}$. These scaling relations are derived from the assumption that the finite system is governed by the *same* critical exponents as the infinite one, modified by scaling functions.

  If the infinite limit were ontologically distinct, why would the finite system obey scaling laws dictated by the infinite fixed point so precisely? The finite system isn't "failing" to be a phase transition; it is **instantiating** the critical physics to the limit of its capacity. The infinite limit is simply the envelope of the finite behaviors. To say the envelope is "more real" than the curves it bounds is a Platonist mistake, not a physical one.

  ### 4. Supervenience and Causal Powers
  Finally, let's look at the metaphysics of "over and above." For phase transitions to be ontologically emergent in the strong sense Batterman implies, the macroscopic state would need causal powers not traceable to the microscopic configuration.

  But they don't.
  *   If you flip a spin in your salt, you change the energy and the magnetization.
  *   If you change the interaction strength $J$, you change $T_c$.
  *   If you make the sample smaller, the peak rounds off.

  Every macroscopic feature of the "phase transition" supervenes on the microscopic arrangement. There is no "phase transition fluid" that appears when $N$ hits Avogadro's number. There is only a collective state of the spins. The non-analyticity is a feature of the **description** we use to capture the collective behavior efficiently, not a feature of the **stuff** itself.

  ### Summary
  Batterman is right that **strictly defined mathematical singularities** require the thermodynamic limit. But he is wrong to identify the **physical phenomenon** with the **mathematical singularity**.

  1.  **Idealization:** The singularity is a modeling tool (like a frictionless plane), not an ontological constituent.
  2.  **RG Mechanism:** The RG explains the macroscopic behavior via the flow of microscopic parameters, which is a reductive, not emergent, explanation.
  3.  **Continuity:** Finite-size scaling shows the finite system tracks the infinite limit continuously; there is no ontological gap at $N \to \infty$.
  4.  **Supervenience:** The macro properties are fully determined by the micro states; no new "stuff" is added at the limit.

  You spent your career measuring finite systems. The fact that we use $N=\infty$ to analyze your data doesn't mean your samples were lacking something real; it means our math is powerful enough to use infinity as a lens to focus on the finite. The "emergence" is in the utility of the limit, not in the nature of the salt.

  Enjoy the gardening. The tomatoes don't need the thermodynamic limit to ripen, but the RG might help explain why they all turn red at roughly the same time.
