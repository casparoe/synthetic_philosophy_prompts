  *(Self-Correction during drafting)*: I need to be careful not to get too bogged down in possible worlds semantics (Stalnaker/Lewis) unless it helps the writer. Keep it focused on *narrative logic* and *causality*. The key insight is that indicatives reason from *evidence*, counterfactuals reason from *causes*.

