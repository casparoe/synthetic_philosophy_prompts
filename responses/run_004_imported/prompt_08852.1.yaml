answer: |-
  Hume would not view Goodman's "grue" paradox as a refutation of his account, nor even as a significant complication. He would regard it as a category mistake that arises from treating induction as a problem of logic rather than a phenomenon of human nature. Strictly adhering to his own framework in the *Treatise* and the *Enquiry*, Hume would argue that his psychological account of custom and habit already privileges "green-type" predicates over "grue-type" predicates, not because the former are logically superior, but because they align with the natural mechanics of the imagination. Goodman's riddle dissolves when one realizes that the mind does not project logical classes; it projects sensory qualities.

  To understand why Hume remains untroubled, we must recall that for Hume, inductive inference is not a rational operation but a causal one. It is a "species of Natural Instinct" (*Enquiry*, Section 5). When we observe a constant conjunction of events, the mind, via custom, forms a determination to pass from the impression of one to the idea of the other. This transition is governed by the associative principles of the imagination: resemblance, contiguity, and cause and effect. Crucially, these principles operate on the *content* of impressions and ideas, specifically their sensory vivacity and qualitative feel, not on their logical extensions.

  Goodman's paradox relies on the logical symmetry of evidence: the set of observed emeralds confirms both "All emeralds are green" and "All emeralds are grue" equally well *up to time t*. Hume would concede the logical symmetry but deny its psychological relevance. For Hume, the unit of association is not the predicate defined by its truth conditions, but the *quality* of the impression itself. "Green" is a simple impression of sight. It is immediate, uniform, and directly felt. "Grue," by contrast, is not a simple impression; it is a complex, disjunctive idea constructed by the understanding. It involves a temporal condition ("examined before t") and a conditional shift in quality ("or blue...").

  Hume's principle of **resemblance** is the key to his defense. The imagination associates ideas that look alike. When I observe emerald A (green) and emerald B (green), the mind links them because the sensory quality *resembles*. This resemblance facilitates the flow of the imagination, strengthening the custom. However, consider the "grue" projection. To project "grue" is to expect that an emerald examined *after* time *t* will be blue. But the mind has no impression of "grueness" to project. It has impressions of green. When the imagination attempts to run forward from the observed green emeralds to an unobserved emerald, it follows the path of least resistance established by qualitative resemblance. It expects more green. To expect blue (as "grue" requires after *t*) would violate the principle of resemblance. The mind cannot form a custom based on a quality it has never experienced in conjunction with the object. Since no one has ever had an impression of a "grue" emerald (which would require experiencing the temporal cutoff as a sensory quality), no custom can be formed for it.

  Furthermore, Hume distinguishes between **philosophical relations** (which depend on thought and comparison, like logic and mathematics) and **natural relations** (which depend on the involuntary association of ideas). Goodman is posing a riddle within the realm of philosophical relations: he is asking for a logical justification for choosing one predicate over another. Hume's entire project is to show that induction belongs to natural relations. We do not *choose* to project "green" rather than "grue" via a criterion of projectibility; we are *compelled* to project "green" by the structure of our cognitive machinery. The fact that "grue" feels artificial, gerrymandered, or unnatural is not a bug for Hume; it is data. It confirms his thesis that belief is a "lively idea related to or associated with a present impression" (*Treatise*, 1.3.7). "Green" retains the vivacity of the original impression. "Grue" dissipates that vivacity because it requires a reflective, temporal calculation that interrupts the automatic flow of custom.

  Therefore, Hume would argue that Goodman's New Riddle only arises if one assumes the mind is a logical engine seeking consistency. If the mind is, as Hume argues, a bundle of perceptions governed by associative habits, then "grue" is psychologically inert. It is a monster of reflection, not a creature of instinct. We do not need a non-circular logical criterion to rule out "grue," because the imagination rules it out automatically by failing to find the requisite qualitative resemblance to sustain the customary transition.

  In conclusion, Hume would reject the premise that he needs to solve the New Riddle. His account is descriptive, not normative. He is explaining why we believe the sun will rise tomorrow, not justifying why we *should*. Since human beings universally and inevitably project "green" and never actually project "grue" in their pre-theoretical dealings with the world, Hume's theory of custom successfully explains the actual phenomenon of induction. Goodman's paradox highlights the limits of *logical* confirmation theory, but it leaves Hume's *psychological* explanation intact. Indeed, the paradox ultimately vindicates Hume: it shows that without an appeal to the natural, non-logical propensities of the human mind (the very "custom" Hume identified), we are left with a logical vacuum where "green" and "grue" are indistinguishable. Hume filled that vacuum with human nature; Goodman merely pointed out that logic alone cannot do the job Hume never assigned it.
