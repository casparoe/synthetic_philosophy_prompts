      **Dan:** "And the hippocampus doesn't 'process' in the way a CPU does, yet we call it memory. You're privileging the wetware because it's yours. The Parity Principle demands we look at the job done, not the worker's uniform. Otto believes the museum is on 53rd Street *because* of the notebook. Without it, the belief vanishes. It's constitutive of his dispositional belief state."

      **Fred:** "Without his glasses, the belief vanishes too. Are the glasses part of his mind? You're sliding down a slope where everything becomes cognition. If I lean on a wall, is the wall part of my balance system? Maybe functionally. But constitutively? No. You're confusing the vehicle with the content. Otto's mind is reaching, yes. But it stops where the causal leverage ends and the constitution begins."

      **Dan:** "And I'm saying that leverage *is* the constitution. But look—Otto found the address. He's moving. The system works."

      **Fred:** "The system works. But don't tell me the notebook is thinking."

