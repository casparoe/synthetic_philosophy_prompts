answer: |-
  First off, take a deep breath. It is completely normal that this is bugging you. You've stumbled into one of the deepest, most unsettling rabbit holes in philosophy. What your friend described is indeed Sharon Street's "Darwinian Dilemma," and it is a formidable argument.

  But here is the good news: **Even if your friend is right about metaethics (the nature of moral truth), she is wrong about the practical implications (how you live your life).**

  Rejecting "objective moral truth" does not mean you are left floating in a void of arbitrariness. You can have a robust, serious framework for making decisions without believing in moral facts floating in the universe.

  Here is a breakdown of why you don't need to panic, and what frameworks actually exist for making big decisions if moral realism is false.

  ### 1. The Philosophy Check (Briefly)
  Your friend's summary is mostly right, but slightly overstated. Street's argument is that if evolution shaped our minds for *survival*, not *truth*, we have no reason to trust that our moral intuitions match independent moral facts.
  *   **The Realist Counter:** Some philosophers argue that true moral beliefs *might* help survival (e.g., cooperation is objectively good *and* evolutionarily fit). So, realism isn't definitively "dead," just wounded.
  *   **Street's Actual View:** Interestingly, Sharon Street herself is not a nihilist. She is a **constructivist**. She believes the dilemma kills *Realism* (morality is discovered), but it saves *Constructivism* (morality is built by us).

  But let's assume the worst-case scenario for the sake of your anxiety: Let's assume there are no objective moral facts. Does that mean deciding whether to have kids is like deciding whether to wear the blue shirt or the red shirt?

  **No.** Here is why.

  ### 2. "Not Objective" Does Not Mean "Arbitrary"
  This is the crucial mental shift. We tend to think there are only two categories:
  1.  **Objective Truth:** (e.g., "Water is H2O") — Binding on everyone.
  2.  **Arbitrary Taste:** (e.g., "Chocolate is better than vanilla") — Purely random.

  But there is a massive middle ground: **Subjective Importance.**

  Think about love. There is no "objective fact" that you *must* love your partner or your parents. The universe doesn't care. But does that make your love arbitrary? No. It matters deeply *to you*. It structures your life, your emotions, and your decisions.

  If moral realism is false, morality moves from Category 1 to this middle ground. It becomes about **what we care about**, not **what the universe commands.**

  ### 3. Frameworks for Decision Making Without Moral Realism
  If you accept that there are no "objective rights or wrongs," you don't just shrug. You adopt a different normative framework. Here are four that work perfectly well without moral realism:

  #### A. Existentialism (The "Author" Framework)
  *   **The Idea:** Existence precedes essence. There is no pre-written script for your life. You are condemned to be free.
  *   **How to decide:** You make decisions based on **authenticity**. Since there is no external meaning, you must create it.
  *   **Application:**
      *   *Having Kids:* Don't ask "Is it my duty?" Ask "Do I want to create a life and nurture it? Am I willing to take responsibility for that project?"
      *   *Voting:* Don't ask "What is the Just thing?" Ask "What kind of society do I want to live in, and which candidate aligns with the values I choose to uphold?"
  *   **Why it's not arbitrary:** Because *you* are the one choosing. The weight of the decision rests on your shoulders, which makes it heavier, not lighter.

  #### B. Pragmatism (The "What Works" Framework)
  *   **The Idea:** Truth isn't a mirror of reality; it's what helps us navigate the world. Morality is a tool for social cooperation and reducing suffering.
  *   **How to decide:** You ask, "What outcome produces the most flourishing/least suffering for the people involved?"
  *   **Application:**
      *   *Having Kids:* Will this child have a good life? Do I have the resources to raise a healthy human? Will this add net happiness to the world?
      *   *Voting:* Which policy actually improves healthcare/employment/safety? (Evidence-based, not ideology-based).
  *   **Why it's not arbitrary:** It is grounded in empirical reality (human suffering and happiness are real experiences, even if "good" and "bad" aren't cosmic facts).

  #### C. Preference Utilitarianism (The "Desire" Framework)
  *   **The Idea:** Nothing is intrinsically "good." But satisfying preferences is what agents want.
  *   **How to decide:** Act in a way that satisfies the most informed preferences of those affected.
  *   **Application:**
      *   *Having Kids:* A child cannot consent to be born, but if you can reasonably assume they will have a life they prefer to not existing, and it satisfies your desire to parent, it is justified.
      *   *Voting:* Vote for the system that satisfies the most citizen preferences.
  *   **Why it's not arbitrary:** It respects the actual desires of sentient beings.

  #### D. Street's Constructivism (The "Rational Consistency" Framework)
  *   **The Idea:** Since evolution gave us values, we can't escape them. But we can refine them. Morality is about what values you would hold if you were fully informed and thinking clearly.
  *   **How to decide:** Check for consistency. If you value your own well-being, rationality demands you value the well-being of others relevantly similar to you.
  *   **Why it's not arbitrary:** It is bound by the rules of logic and rationality applied to your existing nature.

  ### 4. How to Handle the "Bugging" Feeling
  The reason this argument bugs you is that moral realism provides **security**. If "Right" is a fact like "Gravity," you can't be blamed if you follow it. If morality is up to you, the responsibility is yours. That is scary.

  But here is the reframe: **Moral realism is actually paralyzing.**
  If there is an objective "Right," you have to spend your life trying to guess what it is. If there isn't, you realize that **your values are real because *you* are real.**

  When you decide to vote, you aren't aligning with a cosmic spirit of Justice. You are saying, *"I care about my neighbors. I care about the future. I prefer a world where people don't starve."*
  Those cares are biologically and psychologically real. They are not illusions.

  ### Summary Advice for Your Next Argument (and Life)
  1.  **Tell your friend:** "Even if Street is right and Realism is dead, that only kills *moral facts*, not *moral reasons*."
  2.  **Adopt a framework:** Tell them, "I'm a Pragmatist/Existentialist. I make decisions based on reducing suffering and creating meaning, not tracking cosmic truths."
  3.  **For your decisions:** Stop looking for permission from the universe. The universe is silent. Look at what you value.
      *   Do you value freedom? Vote for it.
      *   Do you value family? Have kids.
      *   Do you value truth? Keep studying philosophy.

  The lack of objective morality doesn't mean nothing matters. It means **you** matter enough to decide what matters. That is not arbitrary; that is the definition of agency.
