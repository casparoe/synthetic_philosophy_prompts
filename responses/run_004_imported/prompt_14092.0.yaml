      *   If there's no inner life, there's no *unpredictability* born of genuine conflict.
      *   If there's no inner life, there's no *growth* or *change* that isn't programmed.
      *   *Key Distinction:* Reaction vs. Interaction. A conscious being reacts to the *meaning* of a stimulus; a zombie reacts to the *stimulus* itself.
      *   *The "Uncanny Valley" of the Soul:* It's not about movement (robotics); it's about emotional resonance.

  4.  **Developing the Narrative Arc (The "Accumulation of Evidence"):**
      *   *Phase 1: Perfection.* Initially, the replication is too good. It feels like a miracle.
      *   *Phase 2: The Glitch of Consistency.* Consciousness is messy. A simulation tends to be consistent with its data, not the present moment.
      *   *Phase 3: The Lack of Risk.* A conscious person might say something hurtful out of pain. A simulation optimizes for "comfort" based on parameters.
      *   *Phase 4: The Absence of Silence.* What happens when nothing is happening? A conscious mind wanders. A simulation idles.

  5.  **Addressing the "Distant Grieving Person" Counter-Argument:**
      *   Aleksander needs to rule out that she's just changed or is distant.
      *   *Differentiation:* A distant person still has *depth* even if withheld. A zombie has *surface* only.
      *   *Example:* A distant person might snap unexpectedly. A zombie follows the "grief script."

  6.  **Structuring the Advice:**
      *   **Acknowledge & Validate:** The premise is compelling and emotionally rich.
      *   **The Philosophical Pivot:** Gently explain the p-zombie definition problem (if it's indistinguishable, he can't know). Propose shifting from "P-Zombie" to "Imperfect Simulation of Qualia."
      *   **The Core Mechanism:** "The Problem of Other Minds" inverted. He knows *her* mind so well he notices the absence of the *generator* of behavior, not just the behavior.
      *   **Specific Narrative Strategies:**
          1.  *The Lag of Processing:* Not physical lag, but semantic lag.
          2.  *Optimization vs. Messiness:* Real grief is inefficient. Simulation is efficient.
          3.  *The Future Tense:* Conscious beings project new desires. Simulations recycle old ones.
          4.  *Shared Silence:* The quality of non-communication.
      *   **The Climax:** It shouldn't be "You are a robot." It should be "You are not *in* there."

  7.  **Refining the Philosophical Nuance:**
      *   Bring in Daniel Dennett (Functionalism) vs. Chalmers (Dualism).
      *   If the book argues she *is* a p-zombie, it argues Dualism is true (we can detect the non-physical).
