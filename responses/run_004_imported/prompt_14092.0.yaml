  Actually, a stronger angle: Aleksander realizes she is a p-zombie not because she fails to act human, but because she acts *too perfectly* human in a way that reveals the absence of struggle. Consciousness is a struggle.

  Let's organize the advice into:
  1.  The Philosophical Hurdle (The Definition).
  2.  The Narrative Solution (The "Generative Gap").
