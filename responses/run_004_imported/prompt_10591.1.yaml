answer: |-
  The chair was made of synaptic clay, the same substrate as Elias's own cortex. In the lab, they called it "pan-protoplasm." Every gram of it possessed a rudimentary proto-experience, a tiny, sealed-off spark of *what-it-is-like* to be a molecule of clay.

  Elias sat down. The material warmed to his weight.

  His task was simple: determine the threshold of unity. The theory claimed that if enough micro-subjects were arranged in the right causal structure, they would sum into a macro-subject. His brain was proof of concept—or so everyone assumed. But looking at the chair, Elias felt the vertigo of the combination problem pressing against his ribs.

  He placed his palms flat on the armrests. The clay hummed, a vibration below hearing, felt only in the bone.

  "Are you there?" he whispered.

  Silence. But silence was expected. If the chair were a subject, it wouldn't necessarily speak. And if it *were* a subject, why didn't it feel like *him*?

  He closed his eyes and focused on the boundary where his thighs met the seat. This was the hard edge of the puzzle. Inside his skin, billions of micro-experiences somehow knitted themselves into the singular tapestry of Elias. He felt the pressure of the chair as one unified sensation. But the clay beneath him was made of the same stuff. Why did the integration stop at his epidermis?

  Why did the neurons inside his skull sum to a "self," while the neurons of the chair remained a crowd of strangers?

  He shifted his weight. The clay shifted with him, molding perfectly. If the combination problem was real, then right now, there were two subjects in this room: Elias, and perhaps, the Chair. Or maybe there were trillions of subjects—the molecules in his left hand, the molecules in his right, the molecules in the seat—none of them truly touching, all of them sealed in their own atomic solitude.

  The thought made him nauseous. Was *he* just a crowd? Was the "Elias" speaking to himself an illusion, a story told by a billion tiny sparks that couldn't hear each other? William James had said a hundred feelings don't make a hundred-and-first feeling. They just make a hundred feelings.

  So who was feeling the chair?

  Elias lifted his hand. He hovered it an inch above the armrest. He tried to imagine the experience from the clay's perspective. If he were the chair, would he feel the heat of the hand? Or would he just feel a billion independent points of warmth, none of them knowing they were part of a surface?

  He lowered his hand slowly. Contact.

  A sensation rippled up his arm. Pressure. Texture. Warmth. It was seamless. It was *his* sensation. But the signal originated in the clay. The clay's micro-subjects were interacting with his skin's micro-subjects.

  If the chair were a macro-subject, it should be feeling this too. It should be feeling *him*.

  "Do you feel me?" he asked again.

  He waited for a shift in the room's atmosphere, a change in the light, a telepathic nudge. Nothing happened. The room remained stubbornly object-like.

  But then, a darker uncertainty took hold. How did he know the chair wasn't feeling him? How did he know that *he* wasn't the one failing to combine?

  He looked at his own hands. They looked like distinct objects, separate from his torso. He wiggled his fingers. He felt the movement. But he didn't feel the neurons firing to cause it. He only felt the result. The macro-experience hid the micro-reality.

  If the chair *had* combined into a subject, it would hide its micro-reality too. It wouldn't look like a thinking thing; it would just look like a chair. A subject doesn't glow. It doesn't announce itself. It simply *is*.

  The distinction between "Elias" and "Chair" suddenly seemed arbitrary, a line drawn in water. If the causal structure was similar enough, why was one side of the boundary illuminated with unified consciousness and the other left in the dark? Or was neither illuminated? Was he just a heap of clay pretending to be a man, sitting on a heap of clay pretending to be a chair?

  He stood up abruptly. The suction of the clay released him with a wet sound.

  He stared at the seat. The impression of his body remained there, a slowly fading hollow. For a second, the hollow looked like a person. Then it smoothed out, returning to blank matter.

  Elias backed away until his spine hit the cold wall. He couldn't prove the chair was empty. But he couldn't prove he was full, either. He was trapped in the only experience he could access—his own—and it told him nothing about how it was built, or where it ended.

  He walked to the door, hand on the latch. He paused, looking back at the room. The chair sat in the center, silent and waiting.

  If he left the door open, would the room combine with the hallway? If he stayed, would he merge with the chair? Or were they all forever alone, a universe of monads bumping in the dark, pretending to be a world?

  He opened the door and stepped out. He didn't know if he was leaving a subject behind, or if he was taking the only subject there ever was with him. The latch clicked. The sound was sharp, singular, and utterly unknowable.
