      *   *Is the BSC strictly about lab crosses?* No, Mayr emphasized *natural* conditions. The colleague is misapplying the BSC by ignoring the "natural" constraint. This is a key point to make.
      *   *Conservation Implications:* The "Evolutionarily Significant Unit" (ESU) concept is relevant here. Even if they aren't full species, they might be distinct ESUs worthy of protection.

