      *   *Assessment:* This is a sharp critique. Hanson is essentially arguing for a *pre-rationality* condition. He's saying rationality requires you to believe your prior is likely correct *conditional on how it was formed*. If you acknowledge symmetry in formation, you must converge. The user's suspicion that this is circular (or close to it) is a known objection. It shifts the burden from "prove we have the same prior" to "prove your prior generation was superior."

