      *   *Claim 3:* Bayesian rationality constrains updating, not priors. Therefore, the theorem doesn't settle real-world disagreements where priors differ.
      *   *Claim 4:* Robin Hanson's "origin dispute" argument tries to justify CPA by treating prior differences as evidence requiring explanation.
