answer: |-
  (Raise your glass, but keep it low for a moment. Make eye contact with the room, especially the nurses.)

  Good evening, everyone. For those who don't know me, I'm [Your Name]. We're here to send Meera off, and I want to be honest about what that means.

  We work in a place where "goodbye" is usually about patients. Tonight, it's about a colleague. But we can't pretend the last few years haven't left marks on all of us. Specifically, we can't pretend there isn't still tension about the Ethics Committee. About the antivirals. About the lottery.

  I know some of you in this room still carry anger about that. You look at the charts and you wonder if a different choice would have saved more people. I am not going to stand here and pretend there wasn't a cost. There was. When resources are scarce, every decision leaves a shadow. Meera knows that. She lives with that.

  But I am going to stand here and say that she was right to fight for that lottery.

  The argument against her was about math. It was about maximizing the aggregate. Saving the most "units" of life. It sounds logical on a spreadsheet. But Meera was arguing for something harder, and more human. She was arguing that from the perspective of the patient lying in Bed 4, the fact that someone in Bed 5 has a "better statistical chance" doesn't make their own life worth less.

  There is an old philosophical truth that says: No matter how many other people are suffering, you only ever lose your own one life. To the person who doesn't get the drug, the loss is total. It's one hundred percent of their future.

  By pushing for the lottery, Meera wasn't ignoring death. She was refusing to play God with *worth*. She was saying that a 60-year-old janitor has the same moral claim to a chance as a 40-year-old teacher. That we don't get to decide whose future is more valuable based on a doctor's ranking.

  That is an incredibly lonely position to take. It is much easier to hide behind the triage protocol. It is much harder to look a family in the eye and say, "We gave everyone an equal shot, because everyone's life is their own whole world."

  Meera took the heat for that. She let people be angry at her so that the institution wouldn't lose its soul. She prioritized dignity over efficiency.

  So, as you go to your new hospital, Meera, I hope you know that while the debate was loud, your integrity was louder. You reminded us that medicine isn't just about saving the most lives; it's about respecting *each* life.

  To Meera. May your next team be as brave as you are.

  (Clink glasses.)
