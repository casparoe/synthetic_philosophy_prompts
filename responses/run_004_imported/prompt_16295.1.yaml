prompt: |-
  I cover evolutionary biology, and next week I'm profiling a theoretical biologist who has built her career rehabilitating group selection as a genuine causal force behind traits like eusociality and large-scale human cooperation, working in the tradition of multilevel selection theory. In public debate she reliably closes down the standard 'it's just bookkeeping' objection -- the charge that any multilevel-selection model can be losslessly rewritten as an inclusive-fitness (kin-selection) model once you run the numbers through the Price equation -- with the line 'that's a translation, not a refutation.' Please draft eight to ten interview questions that make that line progressively harder to lean on: I want at least one question pressing her on what would distinguish a genuinely selected group from an arbitrary statistical aggregate of individuals, at least one asking what empirical finding could in principle favor a multilevel-selection description over an inclusive-fitness one rather than a mere relabeling of the same variance, and a final question asking whether she would concede that the units-of-selection debate is, at bottom, not an empirical dispute at all but a disagreement over which partition of the same process is most illuminating. For each question, add a short follow-up keyed to the dodge she is most likely to reach for.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Topic:** Evolutionary biology, specifically the debate between Group Selection/Multilevel Selection (MLS) and Kin Selection/Inclusive Fitness (IF).
      *   **Subject:** A theoretical biologist who advocates for MLS (rehabilitating group selection).
      *   **Key Argument to Challenge:** The subject's standard defense: "Equivalence is just a translation, not a refutation" (i.e., MLS and IF are mathematically equivalent via the Price Equation, but MLS is causally superior/more illuminating).
      *   **Goal:** Draft 8-10 interview questions that make this defense progressively harder to maintain.
      *   **Specific Requirements:**
          *   One question on distinguishing a *genuinely selected group* from an *arbitrary statistical aggregate*.
          *   One question on what *empirical finding* could favor MLS over IF (beyond relabeling).
          *   One final question on whether the debate is *non-empirical* (just about partitioning/illumination).
          *   Each question needs a short follow-up keyed to her likely dodge.
      *   **Tone:** Professional, probing, knowledgeable (suitable for a profile in a serious publication), but challenging.

  2.  **Deconstruct the Scientific Context:**
      *   *The Debate:* The "Hayek of evolutionary biology" (Nowak, Tarnita, Wilson) vs. the "Hamiltonians" (West, Griffin, Gardner, Dawkins).
      *   *The Math:* The Price Equation partitions selection into within-group and between-group components. Inclusive fitness uses relatedness ($r$), benefit ($b$), and cost ($c$). They are often mathematically equivalent.
      *   *The MLS Claim:* MLS is better because it identifies the *causal structure* (group competition) rather than just gene-centric accounting.
      *   *The IF Claim:* IF is more general; MLS models often rely on specific assumptions that IF covers more broadly. The "bookkeeping" charge means MLS proponents are just renaming variables without adding predictive power.
      *   *The Weak Point:* If two models are mathematically equivalent, they make the same predictions. So, how do you choose? Usually via parsimony, generality, or causal clarity. The interviewer wants to press on whether "causal clarity" is subjective or objective.

  3.  **Drafting Strategy - Progressive Difficulty:**
      *   *Questions 1-3:* Establish the groundwork. Acknowledge the equivalence but ask about utility.
      *   *Questions 4-6:* Deepen the pressure. Focus on causality, mechanisms, and the definition of a "group."
      *   *Questions 7-8:* The hard empirical constraints. Can we actually distinguish them in the wild?
      *   *Questions 9-10:* The philosophical knockout. Is this science or semantics?

  4.  **Developing Specific Questions (Iterative Process):**

      *   *Requirement 1: Selected Group vs. Statistical Aggregate.*
          *   *Draft:* How do you know a group is real?
          *   *Refinement:* Need to be more technical. "Arbitrary partitioning of variance."
          *   *Follow-up:* She'll say "functional integration." Push on *when* that emerges.

      *   *Requirement 2: Empirical Finding favoring MLS.*
          *   *Draft:* What experiment proves you right?
          *   *Refinement:* Since models are equivalent, predictions are the same. So what data looks like MLS *specifically*?
          *   *Follow-up:* She'll say "causal mechanism." Push on observability of that mechanism.

      *   *Requirement 3: Non-empirical/Partitioning.*
          *   *Draft:* Is this just semantics?
          *   *Refinement:* Frame it as "Kuhnian paradigm" or "heuristic choice."
          *   *Follow-up:* She'll deny it's *just* semantics. Push on the consequence of that denial.

      *   *Filling the Gaps (Questions 1-7 & 9):*
          *   Need to address the "Translation" line directly early on.
          *   Need to address the Price Equation specifically.
          *   Need to address human cooperation (since the prompt mentions it).
          *   Need to address the history (why was it rejected before?).

  5.  **Drafting the Questions (incorporating the "Dodge" analysis):**

      *   *Q1 (The Opening Salvo):* Focus on the "Translation" line. If it's a translation, why is one language better?
      *   *Q2 (The Price Equation):* The mathematical engine. Does the partition imply causality?
      *   *Q3 (The Group Definition - **Req 1**):* Real groups vs. statistical noise.
      *   *Q4 (Mechanism):* If the math is the same, where is the extra causal power?
      *   *Q5 (Human Cooperation):* Apply to her specific field. Cultural group selection.
      *   *Q6 (Predictive Power):* Did MLS predict something IF didn't?
      *   *Q7 (The Empirical Test - **Req 2**):* What data breaks the equivalence?
      *   *Q8 (Parsimony):* Occam's razor. Why add "group" as an entity?
      *   *Q9 (History):* Why was it rejected? Was it math or ideology?
      *   *Q10 (The Conclusion - **Req 3**):* Is it empirical or heuristic?

  6.  **Refining the Follow-ups:**
      *   The prompt asks for follow-ups keyed to the *likely dodge*.
      *   *Common Dodge:* "It's about causality, not math." -> *Counter:* "How do you measure causality independently of the model?"
      *   *Common Dodge:* "Groups are obvious." -> *Counter:* "At what boundary does a group stop being a group?"
      *   *Common Dodge:* "It's not semantics, it's science." -> *Counter:* "If predictions are identical, what makes it science?"

  7.  **Review against Constraints:**
      *   8-10 questions? Yes (I will aim for 10 to ensure coverage).
      *   Specific questions included? Yes (Group definition, Empirical finding, Non-empirical conclusion).
      *   Follow-ups included? Yes.
      *   Tone check: Needs to be respectful but sharp. Avoid being combative, but be relentless.

  8.  **Final Polish:**
      *   Ensure the terminology is accurate (Price Equation, Inclusive Fitness, Variance Partitioning).
      *   Make sure the progression feels logical (starting with the defense, moving to definitions, then evidence, then philosophy).

      *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm taking the Kin Selection side, but rather acting as a skeptical journalist testing the robustness of *her* position. The goal is to make *her* line harder to lean on, not to prove her wrong myself. The questions must force *her* to articulate the distinction clearly.

      *Refining Q3 (Group Definition):* Make sure it hits the "arbitrary aggregate" point hard.
      *Refining Q7 (Empirical):* Ensure it asks for a scenario where IF *fails* but MLS *succeeds*.
      *Refining Q10 (Philosophy):* Ensure it corners her on the "empirical dispute" aspect.

  9.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  Here are ten interview questions designed to progressively tighten the pressure on the mathematical equivalence defense, moving from utility to definition, then to empirical evidence, and finally to the philosophical status of the debate.

  **1. The "Translation" Defense**
  You frequently dismiss the charge of mathematical equivalence by saying that rewriting a multilevel model in inclusive-fitness terms is merely a "translation, not a refutation." But in physics, if two formalisms yield identical predictions, we typically regard them as describing the same underlying reality. If the math is isomorphic, what specific *scientific work* is being done by insisting on the group-selection vocabulary that could not be done just as well by the inclusive-fitness vocabulary?
  *   **Follow-up:** She will likely argue that MLS offers superior "causal clarity." Ask her: "If the causal story changes but the predicted outcome does not, is that a difference in biology, or a difference in the storyteller?"

  **2. The Price Equation Partition**
  Your reliance on the Price Equation allows you to partition variance into within-group and between-group components. However, critics argue this partitioning is mathematically flexible—you can define a 'group' in ways that maximize between-group variance artificially. What constraint prevents a theorist from defining groups in a way that makes group selection appear dominant even when the biological reality is driven by individual interactions?
  *   **Follow-up:** She will likely say groups are defined by "functional interaction." Ask her: "At what precise threshold of interaction does a collection of individuals stop being an aggregate and start being a unit of selection? Is that a hard line or a heuristic?"

  **3. Defining the Unit (Required Question)**
  To press on that threshold: What distinguishes a *genuinely selected group* from an *arbitrary statistical aggregate* of individuals? If I can partition a population of solitary beetles into 'groups' based on spatial proximity and find variance between them, have I found group selection, or have I just found a way to slice the data?
  *   **Follow-up:** She will likely invoke "shared fate" or "cohesion." Ask her: "Can you point to a case where shared fate exists but group selection is absent, or vice versa? If the two always covary, how do we know which is the driver?"

  **4. Causal Mechanism vs. Accountancy**
  Proponents of inclusive fitness argue that genes are the only replicators with long-term fidelity, making them the only logical locus of selection. You argue groups can be replicators. But unless a group has a mechanism for heredity distinct from the heredity of its members, isn't 'group reproduction' just a metaphor for the correlated reproduction of individuals?
  *   **Follow-up:** She will likely cite eusocial colonies or human cultures. Ask her: "In those cases, isn't the fidelity of the 'group' trait still ultimately dependent on the fidelity of the underlying genetic or cultural transmission between individuals?"

  **5. Predictive Divergence**
  Let's talk about predictive power. A theory gains traction when it predicts phenomena its rival does not. Can you name a specific empirical pattern in eusociality or human cooperation that the multilevel selection framework predicted *before* the data came in, which the inclusive-fitness framework explicitly failed to anticipate?
  *   **Follow-up:** She will likely say the frameworks are too young or the data is retrospective. Ask her: "If the frameworks are equivalent, they should fail or succeed together. If MLS hasn't generated unique predictions, isn't it functioning as a post-hoc narrative rather than a predictive model?"

  **6. The Human Cooperation Case**
  You apply this to large-scale human cooperation, where genetic relatedness is low. Critics argue that 'cultural group selection' is often a placeholder for 'we don't know the individual-level incentives yet.' When you invoke group selection for human altruism, are you identifying a mechanism, or are you labeling a gap in our understanding of individual reciprocity?
  *   **Follow-up:** She will likely argue that punishment institutions create group-level pressure. Ask her: "But aren't those institutions maintained by individuals acting on individual incentives to punish? Where does the causal chain leave the individual level?"

  **7. The Empirical Test (Required Question)**
  I want to be precise about falsifiability. What empirical finding could in principle favor a multilevel-selection description over an inclusive-fitness one, rather than serving as a mere relabeling of the same variance? If you observed [X] in the wild, would you say inclusive fitness is wrong, or just that it's an inconvenient way to calculate the result?
  *   **Follow-up:** She will likely insist MLS is "more natural." Ask her: "Nature doesn't care what's natural for us. If the 'inconvenient' calculation gets the right answer, why is the 'natural' one scientifically superior?"

  **8. Parsimony and Occam's Razor**
  Inclusive fitness theory builds complexity from a single baseline: the gene. Multilevel selection introduces a hierarchy of units. Given that both can model the same data, doesn't Occam's Razor dictate we stick to the model with fewer ontological commitments unless forced otherwise? What forces us otherwise?
  *   **Follow-up:** She will likely argue simplicity isn't the only virtue. Ask her: "If simplicity doesn't force us, does anything? Or is the choice of framework ultimately aesthetic?"

  **9. Historical Rehabilitation**
  You've built a career rehabilitating a concept that was largely discarded in the 1960s and 70s. Was that rejection due to a mathematical error that you have now corrected, or was it a sociological shift in the field? If the math was always sound, why did the consensus turn against it, and what ensures you aren't just riding a pendulum swing back to fashion?
  *   **Follow-up:** She will likely blame ideological resistance to group benefits. Ask her: "If the math is equivalent to kin selection, as you admit, what ideology does kin selection protect that MLS threatens?"

  **10. The Nature of the Dispute (Required Question)**
  Finally, I'd like to close on the status of the debate itself. If the models are mathematically translatable, and they predict the same outcomes, would you concede that the units-of-selection debate is, at bottom, not an empirical dispute at all but a disagreement over which partition of the same process is most illuminating?
  *   **Follow-up:** She will likely resist calling it "just" a disagreement over illumination. Ask her: "If it is not an empirical dispute, why does it generate such heat? Are we fighting over biology, or are we fighting over how we prefer to teach it?"
