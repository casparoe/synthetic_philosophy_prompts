answer: |-
  This is a profound responsibility, and it is completely understandable that you feel the weight of it. You are right to be cautious: a eulogy that treats *ubuntu* as a concept to be explained rather than a reality to be inhabited would be exactly the kind of thing Gogo would have corrected.

  The strategy here is to make the *structure* of the speech reflect the *philosophy* of the woman. Instead of "I am going to tell you about her," the speech says "We are here to acknowledge who we are because of her." It avoids the "independent woman" trope by framing her strength as her capacity to hold others. It avoids the academic trap by focusing on *presence* rather than *achievement*. It welcomes the outsiders by inviting them into the web, rather than explaining the web to them.

  Here is a draft. It is written to be spoken. Take your time with the pauses.

  ***

  **Eulogy for Gogo**

  Stand tall, family. Stand tall, friends.

  We are gathered here because a silence has opened up in the middle of us.

  I know the usual words for a moment like this. I know people are expecting me to stand here and talk about Gogo as a force of nature. To say she was a "strong, independent woman." To say she built this family from nothing, single-handedly.

  I can hear her now, from wherever she is, making that sound she used to make. That sharp intake of breath through her teeth. The one that meant: *You are not listening.*

  Because Gogo knew something that the rest of us are still trying to learn. She knew that the story of "the self" is a lie.

  I remember once, Auntie told her, "Ma, you built this whole family up yourself." It was meant as a compliment. But Gogo pushed back. She told us that sentence didn't even make sense. She said there is no "herself" sitting behind all these relationships that could have built anything alone. She taught us that you don't start as a person and then go out and meet people. She taught us that you become a person *through* the people around you.

  *Umuntu ngumuntu ngabantu.*

  For those in this room who grew up with her, you don't need me to translate that. You lived it. You know that when you walked into her house near Mthatha, you weren't a visitor. You were a thread being woven back into the cloth.

  But for those of us who came to her later in life, or who are joining this family from far away—from London, from other worlds, from different ways of seeing things—I want you to understand what we are actually mourning today.

  We are not just mourning a woman who died. We are mourning the specific way she held us together.

  If you try to measure Gogo's life by what she achieved on her own, you will miss her. She wasn't collecting achievements. She was tending to connections. When she fed you, she wasn't just filling a stomach; she was acknowledging that your hunger was her hunger. When she listened to you, she wasn't just being polite; she was confirming that your voice mattered to the whole.

  She didn't "earn" her personhood like a trophy. She didn't climb a ladder to become human. She simply refused to let anyone around her feel alone. And in doing that, she became the most fully human person many of us will ever know.

  So, how do we say goodbye to someone who taught us that we are not separate?

  If Gogo were here, she would tell us that grief is not a solitary burden. It is proof of the connection. The pain we feel right now is not a sign that something is broken; it is a sign that the bond was real.

  To my partner, to my friends who have traveled far to be here: You might feel like outsiders looking in on a tradition you don't fully know. But Gogo's philosophy was not a secret club. It was an open door. By grieving with us, by standing with us, you are doing exactly what she would ask. You are becoming part of the *abantu*. You are becoming part of the people.

  And to the family, to the grandchildren who knew her best: We cannot honor her by trying to be "strong" like she was. We honor her by refusing to be alone. We honor her by checking on the auntie who is sitting quietly. By feeding the cousin who just arrived. By remembering that when one of us hurts, we all hurt, and when one of us stands, we all stand.

  Gogo is not gone in the way we fear. Because she taught us that she was never just in her body. She was in the space between us. She was in the food we share, in the stories we tell, in the way we make room for one another at the table.

  So we do not say "she rested." We say: We are still here. And because we are here, and because we remember how she loved us, she is still here too.

  Hamba kahle, Gogo. You have taught us how to be people. Now we have to go and do the work.

  Thank you.
