      *   **The Constraint/Challenge:** Avoid the standard "independent strength" trope. Avoid academic philosophy lectures (Menkiti vs. Gyekye). Avoid making personhood sound like an "achievement/trophy." Structure the eulogy *around* the relational idea, not just mention it.
