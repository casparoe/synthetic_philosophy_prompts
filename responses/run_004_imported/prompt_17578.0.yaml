      *   *The "Independent Woman" Pivot:* This is crucial. I need to use the aunt anecdote the user provided. It's perfect. It shows Gogo's specific boundary. *Drafting thought:* Make sure it sounds like a story, not a lesson. "I remember Auntie once said..."
