      *   *The "Personhood" Trap:* Avoid "she earned her place." Instead, "she inhabited her place fully." Her personhood was a verb, not a noun.
      *   *The Ending:* Needs to be comforting. Grief is the price of love. If we are connected, the grief is shared, therefore lighter.

  5.  **Refining the Language:**

      *   *Xhosa Elements:* Include *Gogo*, maybe *Mthatha*, and the phrase *Umuntu ngumuntu ngabantu*. But use it naturally.
