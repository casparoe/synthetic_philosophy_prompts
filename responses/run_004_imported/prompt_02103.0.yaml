answer: |-
  You have hit on exactly the right nerve. Your intuition is spot-on, and it aligns with one of the most significant critiques in contemporary metaethics regarding contractualism and promising.

  To give you the short answer first: **Most critics (including Kolodny and Wallace) argue that Scanlon does not escape Hume's bootstrapping worry; he merely relocates it from the "will" to the "expectation."**

  Here is the walkthrough of why that is the case, breaking down Hume's original charge, Scanlon's attempted dodge, and why the circularity objection sticks.

  ### 1. Hume's Bootstrapping Objection (The Setup)
  As you noted, Hume's target is the "act of will" theory (often associated with natural law theorists or a certain reading of Kant).
  *   **The Claim:** By saying "I promise," I create an obligation where there was none before.
  *   **Hume's Critique:** You cannot create a normative fact (an obligation) simply by having a mental state or uttering words. That is "metaphysical magic." For an obligation to exist, there must be a prior convention or sentiment that *makes* those words binding.
  *   **The Circularity:** If you say "The words bind because I will them to bind," you are assuming the very bindingness you are trying to explain. You are pulling yourself up by your bootstraps.

  ### 2. Scanlon's Principle F (The Dodge)
  Scanlon knows Hume is right about the will. So, in *What We Owe to Each Other*, he tries to ground promising in something "mundane": the wrongness of **manipulation** and **betrayal**.

  **Principle F (simplified):**
  If:
  1.  I voluntarily lead you to expect I will do $X$ (unless you consent otherwise),
  2.  I know you want assurance of this,
  3.  I act with the aim of providing that assurance...
  Then: I must do $X$ (unless you consent otherwise).

  **The Move:** Scanlon argues there is no *sui generis* "promise obligation." There is only the general moral principle that it is wrong to intentionally induce someone to rely on you and then disappoint them without reason. The "magic" isn't in the will; it's in the **harmful effect on the promisee's expectations.**

  ### 3. The Kolodny/Wallace Objection (The Trap)
  This is where your suspicion about circularity comes in. In their paper *"Promises and Practices Revisited" (2003)*, Niko Kolodny and R. Jay Wallace argue that Principle F fails to explain the *normative force* of promising without presupposing it.

  Here is the step-by-step trap:

  **A. Two Types of Expectation**
  For Principle F to work, the promisee must form an expectation. But there are two kinds:
  1.  **Predictive Expectation:** "I expect the sun to rise" or "I expect my friend to come to dinner because she usually does." If this fails, I am surprised or inconvenienced.
  2.  **Normative Expectation:** "I expect you to come because you *ought* to." If this fails, I feel *wronged* or *betrayed*.

  **B. The Problem of Assurance**
  Scanlon says the obligation arises because I gave you **assurance**. But what is assurance?
  *   If I just give you a *prediction* ("I'll probably be there"), breaking it is annoying, but it doesn't trigger Principle F's strong obligation. Principle F is supposed to explain the specific bindingness of a *promise*, not just a prediction.
  *   To distinguish a promise from a prediction, the assurance must be **normative**. I am assuring you that I am *bound*.

  **C. The Circularity**
  Here is the bootstrapping relocation:
  1.  For Principle F to generate an obligation, I must have successfully led you to expect performance *based on my assurance*.
  2.  For that expectation to be the kind that generates a *moral obligation* (rather than just disappointment), you must believe my assurance creates a **bond/obligation**.
  3.  But if you only believe I am bound because I used the word "promise," you are relying on a pre-existing social norm that "promises create obligations."
  4.  If Scanlon says, "No, the obligation comes from the principle," he has to explain why your expectation is rational *before* the obligation exists.
  5.  If your expectation is based merely on my character (predictive), then breaking it is just letting someone down, not violating a right. If it is based on the norm (normative), then the norm must already exist for the expectation to be rational.

  **In short:** You can't use the promisee's *trust* to ground the obligation if that *trust* is only rational because the obligation already exists.

  ### 4. Does Scanlon Escape?
  Scanlon has responses, but they generally concede some ground to the circularity charge.

  **Scanlon's Defense:**
  Scanlon might argue that the expectation doesn't need to be fully "normative" in the heavy sense to start. It relies on an iterative process. We have a general duty not to manipulate. Over time, we develop a convention where saying "I promise" is the recognized signal for "I am invoking Principle F."
  *   He argues the obligation comes from the **intentional invocation** of the principle. I *intend* for you to believe I am bound. If I do that, I am bound.

  **Why Critics Remain Unconvinced:**
  Critics argue this still begs the question. Why does intending to be bound actually bind you?
  *   If it's because of Principle F, then Principle F must be in force.
  *   But Principle F only kicks in if the assurance was successful.
  *   The assurance is only successful if the promisee believes it creates an obligation.
  *   So, the promisee must believe obligations can be created by words *before* Principle F explains how that is possible.

  ### 5. The Verdict: Relocation, Not Escape
  You asked whether Principle F genuinely escapes Hume or relocates the worry. The consensus in the literature is that it **relocates** it.

  *   **Hume's Location:** The magic is in the **Will**. (How can my will create a duty?)
  *   **Scanlon's Location:** The magic is in the **Expectation/Assurance**. (How can my inducing an expectation create a duty?)

  Scanlon successfully avoids the idea that the will is a "normative spell." He grounds it in interpersonal relations. However, he cannot explain why *this specific type* of interpersonal relation (promising) creates an obligation without implicitly relying on the very convention he is trying to justify.

  To use your analogy: Hume mocked the will-theorist for thinking words were transubstantiation. Scanlon says, "No, the words aren't magic; the *trust* is the real substance." But Kolodny and Wallace reply, "That trust is only possible if everyone already believes the words are magic."

  ### Summary for your Seminar
  If you bring this up in class, here is the punchline:
  Scanlon solves Hume's **psychological** objection (we don't need a mysterious power of the will), but he inherits Hume's **structural** objection (you cannot derive an *ought* from the mere fact of an expectation without presupposing a norm that makes that expectation relevant).

  The "bootstrapping" isn't gone; it's just hidden inside the definition of "assurance." To assure someone in the relevant sense *just is* to claim an obligation exists. So, you still need the obligation to make the assurance work.

  You're definitely on solid ground with this worry. It's the standard "gotcha" for Scanlonian promising.
