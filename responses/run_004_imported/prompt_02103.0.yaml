      *   *Refining the Circularity:* Be precise. It's not just "trust." It's that the *assurance* given in promising is inherently normative. If I say "I promise," I'm invoking a rule. If Scanlon says "The rule comes from the harm of breaking trust," but the trust only exists because of the rule, we are spinning.
      *   *Kolodny/Wallace Reference:* Specifically, Niko Kolodny and R. Jay Wallace, "Promises and Practices Revisited" (2003). This is the key paper. I should mention it explicitly.
