prompt: |-
  So we just covered Good's theorem in my decision theory class (the "value of information is always non-negative" result — I think it's from a 1967 paper of his, something like "On the Principle of Total Evidence"), and the basic idea is that a rational Bayesian agent should never refuse a chance to look at free information before acting, since in expectation it can only ever make you do at least as well as before, never worse. Which sounds pretty airtight in the abstract, but its been bugging me all week because it seems to fly in the face of how people actually behave. Like, I've got a friend who point-blank refuses to check her exam grades until finals are totally over, and my uncle turned down a free genetic test for a condition that runs in our family because, in his words, "there's no cure either way so why would I want to know." Are they just being irrational, or is Good's theorem not actually saying what I think its saying?

  Basically I'd love it if you could walk me through the most important implications of the theorem for these kinds of everyday "strategic ignorance" calls — stuff like whether to read the reviews before a trip, check your bank balance during a rough month, or get tested for something you can't even treat anyway. I get that the theorem is only supposed to be about the instrumental value of info for making some downstream decision, so I have a hunch the caveats (what counts as "free," what it means to "act optimally" afterward, whether the decision problem even stays fixed) are doing a lot of hidden work, but I can't quite articulate where exactly the theorem stops applying to real life. My professor name-dropped a whole "information avoidance" literature in econ/psych that supposedly deals with exactly this gap, but we didn't really get into it during lecture, so I'm kind of left hanging.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Context:** The user just learned Good's Theorem (Value of Information is non-negative) in a decision theory class.
      *   **Core Conflict:** The theorem suggests rational agents should *always* accept free information. However, real-world behavior (friend avoiding grades, uncle avoiding genetic tests) suggests people often *avoid* information.
      *   **Question:** Are these people irrational, or does the theorem have caveats/limitations that explain this? Specifically, how does the theorem apply to everyday "strategic ignorance" (reviews, bank balances, genetic tests)?
      *   **Specific Requests:** Walk through implications, address caveats (cost, optimal action, fixed decision problem), and connect to the "information avoidance" literature mentioned by the professor.
      *   **Tone:** Academic but accessible, empathetic to the confusion, rigorous but practical.

  2.  **Deconstruct Good's Theorem:**
      *   *What does it actually say?* For a Bayesian agent facing a decision problem, the expected utility of acting *after* observing a signal is at least as high as the expected utility of acting *without* the signal, provided the information is free and the agent updates rationally.
      *   *Key Assumptions:*
          1.  **Instrumental Value:** Information is only valuable insofar as it changes actions to improve outcomes.
          2.  **Free Information:** No cost to acquire (monetary, time, cognitive).
          3.  **Rational Updating:** The agent updates beliefs via Bayes' rule.
          4.  **Fixed Utility Function:** The agent's preferences over outcomes don't change based on the information itself (no "news utility").
          5.  **Single Agent/No Game Theory:** Usually assumes a static environment, not strategic interaction where knowing something changes how others treat you (though this is less central to the basic theorem).

  3.  **Address the User's Examples (The "Gap"):**
      *   *Friend avoiding grades:* Why? Anxiety. The grade itself doesn't change the past. Knowing it might ruin the mood during finals. This violates the "Fixed Utility Function" assumption. The *state of knowing* affects utility directly.
      *   *Uncle avoiding genetic test:* Why? "No cure either way." If the action space is identical (live life normally) regardless of the result, the instrumental value is zero. But he says "why would I want to know," implying a *negative* value. This suggests emotional cost (dread) or a change in how he experiences life (psychological burden).
      *   *Bank balance:* Checking might cause stress that hinders performance (e.g., at work), or trigger impulsive spending cuts that are suboptimal long-term.
      *   *Trip reviews:* Reading bad reviews might ruin the anticipation (hedonic cost) without changing the decision (you're going anyway).

  4.  **Identify the Loopholes/Caveats (Where the Theorem "Stops Applying"):**
      *   **1. Information isn't actually free:** Cognitive load, time, emotional energy.
      *   **2. Direct Utility of Beliefs (News Utility):** People care about *what they believe*, not just *what they do*. Good's theorem assumes utility depends only on the state of the world and the action, not the belief itself.
      *   **3. Self-Signaling/Identity:** Knowing something might change how you view yourself (e.g., "I am a person at risk").
      *   **4. Commitment/Self-Control:** Information might tempt you into a suboptimal action (e.g., seeing a sale makes you spend money you shouldn't). This relates to "instrumental rationality" vs. "bounded rationality."
      *   **5. Game Theory/Strategic:** Sometimes not knowing allows for credible threats or plausible deniability (Ignorance is bliss in negotiations).

  5.  **Connect to "Information Avoidance" Literature:**
      *   Mention key names/concepts: Golman & Loewenstein (2016) review is the big one.
      *   Concepts: Hedonic hypothesis (avoid pain), Instrumental hypothesis (avoid useless info), Strategic ignorance (commitment device).
      *   Distinguish between *rational* avoidance (within an expanded utility model) and *bounded rationality* (bias/heuristic).

  6.  **Drafting the Response (Iterative Structure):**
      *   **Introduction:** Validate the user's intuition. It's a classic puzzle. Good's theorem is mathematically sound *within its axioms*, but those axioms are narrow.
      *   **Section 1: What Good's Theorem Actually Says (The Baseline).** Briefly recap the math logic without getting bogged down. Emphasize *Instrumental Value*.
      *   **Section 2: The Three Big Loopholes (Why your friends aren't necessarily irrational).**
          *   *Loophole 1: Utility of Beliefs (Hedonic).* You care about the feeling of knowing.
          *   *Loophole 2: Costs aren't zero.* Emotional cost is a cost.
          *   *Loophole 3: Commitment/Self-Control.* Information restricts future flexibility or tempts weakness.
      *   **Section 3: Applying to the Examples.**
          *   Grades: Hedonic cost + No actionable change (mostly).
          *   Genetic Test: Hedonic cost + No instrumental value (no cure).
          *   Bank Balance: Anxiety affecting performance.
      *   **Section 4: The Information Avoidance Literature.** Cite Golman & Loewenstein. Explain that economists have expanded the model to include "psychological costs."
      *   **Conclusion:** Summarize. The theorem isn't wrong; the model of human utility was too simple.

  7.  **Refining the Tone:**
      *   Avoid saying "Your friends are irrational." Instead, say "They are optimizing a different utility function."
      *   Make sure to distinguish between *Bayesian Rationality* (coherence) and *Instrumental Rationality* (getting what you want).
      *   Ensure the distinction between "Information has no value" (instrumental) and "Information has negative value" (psychological) is clear.

  8.  **Self-Correction/Check during drafting:**
      *   *Did I mention that Good's theorem assumes the decision problem stays fixed?* Yes, need to emphasize that. If knowing the info changes the *available actions* or the *payoffs* (psychologically), the theorem doesn't hold.
      *   *Is the genetic test example purely instrumental?* If there's no cure, instrumental value is zero. So avoiding it is rational *if* there is any cost (even psychological). Good's theorem says value $\ge 0$. If cost $> 0$, net value can be negative.
      *   *Wait, Good's theorem says value of *free* info.* If psychological pain is a cost, it's not free. I need to be precise here. The theorem assumes *costless* acquisition. If "dread" is a cost, the premise of "free" is violated.
      *   *Alternative view:* If utility depends on beliefs, the theorem's definition of utility is incomplete. I should present both angles (Cost vs. Utility Function).

  9.  **Final Polish:** Check for clarity, flow, and ensure all parts of the user's prompt are addressed. (The prompt asks for implications, caveats, and literature connection).

  *(Self-Correction on the Genetic Test)*: If there is truly *no* action change (no cure, no lifestyle change), the instrumental value is exactly zero. Good's theorem says $VoI \ge 0$. So $0 \ge 0$ holds. Why avoid it? Because it's not *free*. The psychological distress is a cost. So Net Value = $0 - Cost < 0$. This fits the theorem if we acknowledge the cost.
  *However*, if the utility function includes "peace of mind," then the *state of belief* matters. Good's theorem assumes utility is $U(Action, State)$. If it's $U(Action, State, Belief)$, the theorem needs modification. I should explain this distinction clearly.

  10. **Final Plan:**
      *   Intro: Validate the tension.
      *   Core Logic: Instrumental vs. Intrinsic value of info.
      *   Caveat 1: Information isn't free (psychological costs).
      *   Caveat 2: Utility depends on beliefs (News Utility).
      *   Caveat 3: Commitment problems (Ulysses contracts).
      *   Literature: Golman & Loewenstein.
      *   Application to examples.
      *   Conclusion.

  (Proceed to generate response based on this plan.)
answer: |-
  This is one of the most satisfying "aha!" moments in decision theory, precisely because it highlights the gap between a mathematically elegant model and the messy reality of human psychology. You are right to be suspicious: if Good's Theorem were a complete description of human rationality, your friend and your uncle would be behaving irrationally.

  However, the consensus in modern decision science is that **they are not necessarily irrational.** Instead, they are optimizing a utility function that is richer than the one assumed in Good's original proof.

  Good's Theorem (1967) is airtight *within its axioms*, but those axioms are surprisingly narrow. To understand why "strategic ignorance" is often rational, we need to look at where the theorem's assumptions break down in real life. Here is a walkthrough of the implications, the caveats, and the literature your professor hinted at.

  ---

  ### 1. What Good's Theorem Actually Says (and Doesn't Say)

  To see the loopholes, we have to be precise about the setup. Good's Theorem states that for a Bayesian agent:
  $$E[U(\text{act with info})] \geq E[U(\text{act without info})]$$

  This holds true **if and only if**:
  1.  **Instrumentality:** Information has no intrinsic value; it is only valuable insofar as it changes your *action* to produce a better *outcome*.
  2.  **Costlessness:** Acquiring the information costs nothing (no money, no time, no cognitive effort).
  3.  **Fixed Preferences:** Your utility function depends only on the **State of the World** and your **Action**. It does *not* depend on your **Beliefs**.
  4.  **Rational Updating:** You will actually use the information to update your probabilities correctly.

  If any of these four conditions are violated, the "Value of Information" (VoI) can effectively be negative. Let's break down how this applies to your examples.

  ### 2. The Three Big Loopholes

  #### Loophole A: Information is rarely "free" (Psychological Costs)
  Good's theorem assumes the cost of observation is zero. In physics or computer science, this is often true. In human psychology, it is almost never true.

  Processing information requires cognitive energy, but more importantly, it often incurs **emotional costs**. Anxiety, dread, guilt, and distraction are real costs that subtract from your expected utility.
  *   **The Uncle's Genetic Test:** If there is no cure, the *instrumental* value of the information is zero (it changes no medical actions). However, the *psychological cost* of living with a positive result (worry, fatalism) is high.
      *   *Calculation:* Net Value = Instrumental Value ($0) - Psychological Cost ($>0) = Negative.
      *   *Verdict:* Refusing the test is rational if you count emotional distress as a cost.

  #### Loophole B: Utility depends on Beliefs ("News Utility")
  This is the deeper theoretical violation. Good's theorem assumes you only care about what *happens* (State + Action). But humans care about what they *know* (Beliefs).

  Economists call this **direct utility from beliefs**. We derive pleasure from hope and pain from dread, independent of any actions we take.
  *   **The Friend's Exam Grades:** Knowing a grade doesn't change the grade (the State). It likely doesn't change her behavior much until the next semester (the Action). But knowing she failed *now* ruins her enjoyment of the holiday break.
      *   If her utility function is $U(\text{Outcome}, \text{Belief})$, then holding a belief of "I might have passed" yields higher utility than holding a belief of "I definitely failed," even if the reality is the same.
      *   *Verdict:* She is maximizing "hedonic utility," not just instrumental utility. Good's theorem doesn't account for the utility of the belief itself.

  #### Loophole C: Commitment and Self-Control (The Ulysses Problem)
  Sometimes, having information restricts your ability to stick to a long-term plan. This is common in behavioral economics regarding **time inconsistency**.
  *   **The Bank Balance:** Imagine you are trying to save money, but you have a weakness for impulse spending.
      *   *Scenario A (Ignorance):* You don't check your balance. You assume you're okay. You don't spend.
      *   *Scenario B (Information):* You check. You see you have *more* money than expected. Your "impulsive self" takes over and you spend it. Or, you see you have *less*, you panic, and make a rash, suboptimal investment.
      *   In this case, information removes a "commitment device." Ignorance protects you from your own future irrationality.
      *   *Verdict:* If you know you aren't a perfect Bayesian optimizer in the future, restricting information now can be a rational pre-commitment strategy.

  ### 3. Applying this to your "Strategic Ignorance" Examples

  Here is how you can analyze these everyday calls using the expanded framework:

  | Scenario | Instrumental Value (Good's View) | Real-World Complication | Rational Verdict |
  | :--- | :--- | :--- | :--- |
  | **Trip Reviews** | High (could change booking) | **Hedonic Cost:** If you've already booked and can't cancel, bad reviews only ruin anticipation. | **Avoid** if non-refundable & you can't change plans. |
  | **Bank Balance** | High (prevents overdraft) | **Cognitive Load/Anxiety:** Constant checking causes stress that lowers work performance (income). | **Limit** checking to a scheduled time (batching info). |
  | **Genetic Test** | Zero (no cure) | **Psychological Cost:** Dread alters quality of life. | **Avoid** is rational if "peace of mind" is a good. |
  | **Exam Grades** | Low (can't change past) | **Belief Utility:** Hope feels better than certainty during finals week. | **Delay** until actions can be taken (e.g., retake). |

  ### 4. The "Information Avoidance" Literature

  Your professor mentioned this literature for a reason. In the last 15 years, economists have formalized exactly why Good's Theorem feels incomplete. The seminal paper you want to look up is:

  **Golman, R., & Loewenstein, G. (2016). "Information Avoidance: From Self-Signaling to Strategic Ignorance." *Journal of Economic Literature*.**

  They categorize information avoidance into three buckets that align with the loopholes above:
  1.  **Instrumental Avoidance:** The info is useless (like the genetic test with no cure). Good's theorem allows this (VoI = 0), but doesn't explain negative value.
  2.  **Hedonic Avoidance:** The info hurts your feelings (the exam grades). This violates the "Fixed Preferences" axiom of Good's theorem.
  3.  **Strategic Avoidance:** Not knowing helps you negotiate or maintain self-control (the bank balance/commitment). This violates the "Single Agent/Static" assumption.

  Another key concept is **Self-Signaling**. Sometimes we avoid information to maintain a positive self-image. If I don't check my cholesterol, I can tell myself, "I'm probably healthy." If I check and it's high, I am forced to update my identity to "I am a sick person." People pay to avoid updating their identity negatively.

  ### 5. So, is Good's Theorem Wrong?

  No. It is a **normative** theorem, not a **descriptive** one.
  *   **Normative:** "If you are a purely instrumental agent who cares only about physical outcomes and pays no costs to think, you *should* take the info."
  *   **Descriptive:** "Humans care about feelings, identity, and have limited self-control."

  The theorem isn't wrong; it's just a model of a specific *type* of rationality (Instrumental Rationality). Your friends are exhibiting **Ecological Rationality**—they are adapting their information intake to fit their psychological constraints and emotional needs.

  ### Summary for Your Class/Understanding

  If you want to impress your professor or clarify this for yourself, here is the synthesis:

  1.  **Good's Theorem holds** for the *instrumental* value of information regarding *external* outcomes.
  2.  **Strategic Ignorance is rational** when we expand the utility function to include *internal* states (peace of mind, hope, identity).
  3.  **Information has a price.** When the "price" includes anxiety or loss of self-control, the net value can be negative.
  4.  **The Gap:** The "Information Avoidance" literature bridges this by modeling the *cost of belief* alongside the *value of action*.

  Your uncle isn't violating Bayesian logic; he's just correctly identifying that for his specific utility function (which values peace of mind over statistical knowledge), the cost of the test exceeds the benefit. Good's theorem assumes that cost is zero; your uncle knows it isn't.
