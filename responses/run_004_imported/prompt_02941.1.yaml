      *   **Blake:** But phenomenologically, I feel pressured to admire. It functions as a reason. We should admit it's a reason but classify it as state-given (benefits of having the state) vs. object-given (properties of the demon). FA analysis needs to filter WKRs, not deny their existence.
      *   **Alex's Counter:** If you call it a reason for admiration, you blur the line between value and prudence. The FA account defines value via fittingness. Prudential reasons don't establish fittingness.
      *   **Blake's Counter:** But distinguishing them requires the very notion of value we're trying to analyze. If we can't distinguish WKRs without circularity, the account fails. Acknowledging them as reasons of a different kind is more honest.

