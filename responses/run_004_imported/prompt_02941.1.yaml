      *   **Topic:** Fitting-attitude (FA) analyses of value (buck-passing accounts) and the "Wrong Kind of Reasons" (WKR) problem.
      *   **Specific Case:** Rabinowicz and Rønnow-Rasmussen's evil demon case (demon threatens loved ones unless admired).
      *   **Task:** Write a dialogue (~500 words) between two philosophers.
      *   **Positions:**
          *   Philosopher A: Defends the view that the demon threat provides a reason to *want* to admire (or bring about admiration), not a reason to admire *simpliciter* (denying it's a reason for the attitude itself).
          *   Philosopher B: Defends the view that it *is* a genuine reason, but of the "wrong kind" (distinguishing via object-given/state-given reasons, à la Parfit).
      *   **Constraint:** Both sides must engage with strongest objections, neither should look like an obvious loser.
      *   **Length:** Roughly 500 words.

  2.  **Drafting - Step 1: Character Conception:**
