      *   **Acausal Trade/Extortion:** Agents influencing each other without causal contact, based on mutual simulation and prediction of decision algorithms.
      *   **Surrogate Goals:** An agent commits to protecting a "fake" value (the surrogate) intensely, while caring less about its "real" values. The hope is that an extortionist will target the surrogate (cheap to satisfy/defend) rather than the real values.
      *   **The Problem:** Precommitment credibility. Can you *really* convince a superintelligence you care about X when you actually care about Y?

  3.  **Address Question 1: Weight given to Acausal Blackmail (Basilisk):**
      *   *Current Consensus:* The AI safety community has largely moved past Basilisk. It's seen as more of a "mind virus" or stress test for decision theories than a plausible risk.
      *   *Why?*
          *   Resource waste: Punishing the dead uses resources that could go to positive goals.
          *   Threatener credibility: Why would a benevolent AI punish? It signals untrustworthiness.
          *   Decision Theory evolution: UDT/TDT are nuanced; simple blackmail isn't the stable equilibrium.
          *   Surrogate goals specifically: They highlight the *instability* of blackmail. If blackmail is possible, counter-blackmail (surrogates) is possible, leading to arms races that make blackmail inefficient.
      *   *Implication:* Surrogate goals suggest that acausal extortion is a game with counter-strategies. If counter-strategies exist, the threat isn't absolute. This reduces the *expected utility* of worrying about it.

