answer: |-
  This is a classic and highly nuanced problem in the philosophy of biology. You have correctly identified the pressure point: exaptation cases (like feathers) strain the Etiological (SE) account's reliance on history, while simultaneously exposing the Causal-Role (CR) account's inability to distinguish "proper function" from mere causal capacity.

  To determine which verdict is less *ad hoc*, we must look beyond which theory saves the intuition that "flight is the function of feathers." We must ask which theory relies on arbitrary theoretical patches versus which relies on independent theoretical motivations.

  Here is a comparison of the two accounts in their strongest forms, evaluated against the charge of *ad hoc*-ness.

  ### 1. The Etiological Account (SE) + Godfrey-Smith's "Modern History"

  **The Standard View:**
  In its classic Wright/Neander/Millikan formulation, the function of a trait is the effect for which it was historically selected. Strictly applied, this means the function of feathers is thermoregulation. Flight is an exaptation—a useful effect, but not a "function." This clashes violently with biological practice, where biologists confidently assert that the function of avian feathers is flight.

  **The "Modern History" Rescue:**
  Peter Godfrey-Smith (and to some extent Neander in later work) refines the SE account by shifting the focus from the *origin* of the trait to its *current maintenance*. If a trait was originally selected for $X$ (insulation) but is currently being selected for $Y$ (flight), $Y$ is the proper function. The selective history that matters is the "modern" history sufficient to explain the trait's current prevalence.

  **Is this *ad hoc*?**
  Critics argue this looks like moving the goalposts to save the theory from counterexamples. If the theory is about "history," why does *recent* history count more than *deep* history?
  *   **Defense:** It is not *ad hoc* if there is independent theoretical justification for privileging recent history. The justification lies in the mechanics of natural selection itself. Selection is a current process; if the selective pressure for insulation vanished but the pressure for flight remained, the trait is being *maintained* by flight. The "Modern History" clause isn't a patch; it is a correction to a static view of evolution. It aligns the definition of function with the dynamic reality of population genetics.

  **The Verdict:** Flight is the function. Insulation is a past function or a side effect.

  ### 2. The Causal-Role Account (CR)

  **The Standard View:**
  Cummins argues that to ascribe a function is to explain how a capacity of a containing system is realized. Functions are causal contributions relative to an analytical scheme. There is no appeal to history, only to current causal organization.

  **Application to Feathers:**
  Cummins's account does not need to be "rescued" for exaptation cases because it doesn't distinguish between adaptation and exaptation in the same way.
  *   If we analyze the bird as a **thermal system**, the function of feathers is insulation.
  *   If we analyze the bird as a **locomotive system**, the function of feathers is flight.
  *   If we analyze the bird as a **signaling system**, the function of feathers might be mating display.

  **Is this *ad hoc*?**
  Cummins's relativization is built into the definition, so it isn't a "patch" in the same way Godfrey-Smith's move is. However, the *verdict* it produces relies entirely on the **analyst's interest**.
  *   **Critique:** This makes function attribution subjective. Whether flight is "the" function depends on what the biologist is studying. If the biologist is interested in aerodynamics, flight is the function. If they are interested in energetics, insulation is the function. There is no fact of the matter about the organism itself.
  *   **The *Ad Hoc* Charge:** While not a theoretical patch, the CR account makes the *ascription* of function arbitrary relative to the observer. In a seminar context, this is often criticized as dissolving the phenomenon rather than explaining it. It avoids the problem of exaptation by refusing to acknowledge the biological distinction between a trait's *purpose* (selected effect) and its *utility* (causal role).

  **The Verdict:** Flight and Insulation are *both* functions, relative to different capacities. Neither is privileged without external input from the analyst.

  ### 3. Comparison: Which is Less *Ad Hoc*?

  To judge which is less *ad hoc*, we must decide what counts as an arbitrary adjustment.

  **Argument for SE (Modern History) being less *ad hoc*:**
  The SE account aims to capture the **normativity** of biological function (i.e., the distinction between functioning and malfunctioning). A heart *should* pump blood; if it doesn't, it is malfunctioning. Cummins's CR account struggles immensely here (a heart that doesn't pump just isn't playing its causal role, but it's hard to say it's "broken" in a normative sense without smuggling in history).
  *   Godfrey-Smith's restriction to "modern history" is grounded in the **objective selective pressures currently acting on the population**. It anchors the function in the world (the environment selecting for flight), not in the mind of the biologist.
  *   Therefore, the SE verdict ("Flight is the function") is less *ad hoc* because it is determined by objective evolutionary dynamics, not by the theorist's analytical interests. The "recentness" constraint is an empirical parameter (generation time, environmental stability), not an arbitrary choice.

  **Argument for CR being less *ad hoc*:**
  One could argue that SE's shift to "modern history" is a direct response to the failure of the original theory to handle Gould and Vrba's cases. It looks like a modification designed solely to make the output match biological intuition.
  *   Cummins's account requires **no modification** to handle feathers. It handles them seamlessly from the start. The relativization is a feature, not a bug.
  *   However, this "seamlessness" comes at the cost of changing the subject. If "function" just means "causal contribution," then SE and CR are talking about different things. If we assume the seminar is debating *biological* function (which implies normativity and properness), CR's refusal to distinguish flight from insulation looks like an evasion.

  ### Conclusion

  The **Etiological Account (with Godfrey-Smith's Modern History modification)** gives the less *ad hoc* verdict.

  Here is why:
  1.  **Objectivity vs. Subjectivity:** The SE account anchors the function of feathers in the **objective selective history** of the lineage. The verdict "Flight is the function" is true regardless of whether a biologist is studying thermodynamics or aerodynamics. The CR account makes the function dependent on the **analyst's interest**, which renders the function attribution contingent on human inquiry rather than biological fact. Making the ontology of the trait dependent on the observer's interest is a deeper form of *ad hoc*-ness than refining the temporal scope of selection.
  2.  **Normativity:** The concept of "biological function" carries a normative load (malfunction). SE preserves this naturally; CR must add complex clauses to recover it. Godfrey-Smith's move preserves the core theoretical virtue of SE (normativity) while updating the historical parameter to match evolutionary dynamics. This is a theoretical refinement, not an *ad hoc* patch.
  3.  **Explanatory Power:** In the case of feathers, biologists want to know why the trait is *maintained* now. SE answers this directly (selection for flight). CR answers what the trait *does*, but cannot explain why the trait persists in the population over insulation-only variants without appealing to selection anyway.

  While Godfrey-Smith's "modern history" clause looks like a modification, it is motivated by the independent logic of **current maintenance** in evolutionary theory. Cummins's relativization, while internally consistent, makes the assignment of function arbitrary relative to the scientist's agenda. Therefore, the SE account provides a verdict that is more robustly grounded in the biology of the organism itself.
