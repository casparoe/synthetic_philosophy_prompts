          *   Basic Argument side must press the "generalization move": If we excuse based on unchosen conditions (compulsion, etc.), why not excuse everyone since *all* character is unchosen?
          *   Reactive Attitudes side must *not* just say "determinism is no threat." They must address the regress or the generalization move specifically.
          *   Both sides must engage with specific moves (no restating positions in a vacuum).
          *   Both sides must register at least one *genuine concession* before explaining why it doesn't settle the dispute.
      *   **Tone:** Philosophical, rigorous, respectful but firm.

  2.  **Deconstruct the Positions:**
      *   **Galen Strawson (The Basic Argument):**
          *   Core claim: Ultimate Moral Responsibility (UMR) is impossible.
          *   Reasoning: To be UMR for an action, you must be UMR for the mental state (character/motives) that caused it. To be UMR for that, you must have chosen it. To choose it, you need prior principles of choice. To be UMR for *those*, you need to have chosen *them*. Infinite regress. Humans cannot be *causa sui*.
          *   Scope: Applies to determinism *and* indeterminism (randomness doesn't help responsibility).
          *   Challenge to P.F. Strawson: P.F. says we hold people responsible based on reactive attitudes unless there's an "excusing condition" (compulsion, insanity). But *everyone* is shaped by factors they didn't choose. Why is the line drawn where it is?
      *   **P.F. Strawson (Reactive Attitudes):**
          *   Core claim: Responsibility practices are grounded in human nature (reactive attitudes like resentment, gratitude), not metaphysical facts about causation.
          *   Reasoning: We can't step outside our human form of life to judge it from a "view from nowhere." Optimists (compatibilists) and Pessimists (libertarians/hard determinists) both make the mistake of looking for external justification.
          *   Response to Generalization: The distinction between "normal" agents and "excused" agents is internal to the practice. It's not about metaphysical freedom; it's about the quality of will. If the quality of will is compromised (by insanity, etc.), attitudes change. But for normal agents, the attitudes are constitutive of relationships.
          *   Constraint: Must address the *regress*, not just determinism.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Two philosophers, let's call them "Alex" (Galen/Basic Argument) and "Jamie" (P.F./Reactive Attitudes).
