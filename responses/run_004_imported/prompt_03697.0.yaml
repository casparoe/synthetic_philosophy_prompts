answer: |-
  **Alex:** Let's begin with the metaphysics, because I think your father's strategy relies on sidestepping a problem that cannot be sidestepped. The Basic Argument is simple, but it is brutal. To be truly morally responsible for what you do, you must be responsible for the way you are—at least in certain crucial mental respects. You must be responsible for your character, your motives, your principles of choice. But to be responsible for the way you are, you must have intentionally brought yourself to be that way. You must have chosen your own nature.

  **Jordan:** We've heard this before. The *causa sui* requirement.

  **Alex:** Precisely. But notice what follows. To choose your own nature, you must have had principles of choice that guided that selection. But to be responsible for *those* principles, you must have chosen them too. This leads to an infinite regress. No one can be *causa sui*. No one can pull themselves up by their own bootstraps into existence. And here is where I must correct a common misunderstanding of my position, and where I diverge from the debate your father entered. This argument does not depend on determinism. Even if our choices are undetermined, even if there is random noise in the neural firing, that does not grant responsibility. Randomness is not freedom. If a choice pops into my head uncaused, I am not responsible for it any more than I am responsible for a sneeze. The impossibility of ultimate responsibility is a truth of logic and metaphysics, not just physics.

  **Jordan:** I want to pause on that first step, because I think you are asking for a kind of responsibility that no human practice actually recognizes. But before I press that, I want to make a concession. You are right that if "responsibility" requires being the *ultimate*, uncaused cause of one's own character, then no one is responsible. I grant you that *causa sui* is impossible. If the ledger of moral responsibility requires an entry that says "This agent created their own soul from nothing," then the ledger remains empty.

  **Alex:** Thank you. That is significant.

  **Jordan:** But it doesn't settle the dispute. It doesn't settle it because that conception of responsibility is a philosophical fantasy. It is not the concept that does any work in our lives. My father's point in "Freedom and Resentment" was that we need to look at what we *do*, not what we might wish we were in a metaphysical sense. We are embedded in a network of human relationships, and these relationships are structured by reactive attitudes: resentment when we are slighted, gratitude when we are helped, indignation when others are harmed. These are not theoretical judgments about causation; they are natural human responses. To ask if they are "justified" from outside the human perspective is like asking if it is "justified" to feel hunger.

  **Alex:** But that is exactly where the generalization problem arises, and this is where I think your father's naturalism fails to protect the practice. Your father admits that there are exceptions to the reactive attitudes. He calls it adopting the "objective attitude." We do not feel resentment toward the small child, or the severe neurotic, or the person acting under post-hypnotic suggestion. Why? Because their conduct flows from conditions they never chose. Their capacity for normal interpersonal exchange is compromised by factors outside their control.

  **Jordan:** Yes, because in those cases, the quality of will is not properly expressed.

  **Alex:** But consider the rest of us. My character, my temperament, my capacity for empathy or cruelty—these are also the product of factors I never chose. My genetics, my upbringing, the luck of my neural development. If we withdraw reactive attitudes from the neurotic because their actions flow from an unchosen constitution, what principled reason is there not to extend the same treatment to everyone? We are all, in the end, victims of constitutive luck. The line your father draws between the "excused" and the "responsible" seems arbitrary if the criterion is truly about whether the agent chose their own nature. Since no one chose their nature, the objective attitude should be universal.

  **Jordan:** This is the move from "no *causa sui*" to "no distinction between normal and abnormal agents." And here I must make a concession to you. I grant that there is no *metaphysical* difference in kind between the constitution of the neurotic and the constitution of the "normal" agent. Both are products of causal history. Both are unchosen. If you are looking for a deep metaphysical fact that separates the sane from the insane in terms of *origin*, you won't find it.

  **Alex:** So the distinction collapses.

  **Jordan:** Not at all. Because the distinction isn't metaphysical; it is practical and internal to the form of life we inhabit. You ask for a principled reason to treat the neurotic differently than the standard agent. The principle is not "Did they create themselves?" The principle is "Can they participate in the interpersonal exchange?" When we adopt the objective attitude toward the compulsive neurotic, it is not because we have discovered they lack free will in a way we possess. It is because their behavior signals that the normal demands of reciprocity are, in this instance, impossible or futile.

  **Alex:** But why are they impossible? Because their brain is determined to act that way?

  **Jordan:** No. Because the *relationship* is broken. Reactive attitudes are essentially communicative. Resentment is a demand for regard. If I resent you, I am calling on you to recognize the moral demand you violated. The neurotic, in the throes of compulsion, cannot hear that call. They are, temporarily or permanently, outside the community of moral dialogue. But you and I? We are inside it. We respond to these demands.

  **Alex:** But I didn't choose to be inside it! That is my point. I am responsive to moral demands only because I was lucky enough to be raised in a way that made me so, or lucky enough to have the biology that supports it. If I am only responsible because I happened to win the genetic lottery that allows me to respond to resentment, then my responsibility is still just a matter of luck. You have saved the *practice* of holding responsible, but you have not saved the *justice* of it. You have admitted that we punish and reward based on luck, you have just dressed it up as "human nature."

  **Jordan:** You say I haven't saved the justice of it. But justice is not a view from nowhere. Justice is a virtue of human communities. To say "it is unjust to hold people responsible because they didn't choose their nature" is to invoke a standard of justice that is inhuman. It is to say that the only just world is one populated by gods who create themselves. Since we are not gods, that standard is irrelevant.

  **Alex:** I will concede this much: I agree that we cannot simply abandon the reactive attitudes. I agree that they are inescapable for beings like us. Even if I am convinced by my own Basic Argument, I will still feel resentment when you steal my wallet. I cannot turn myself into a pure observer of human behavior. The practice is psychologically necessary.

  **Jordan:** Then we are closer than it seems. If the practice is necessary, and it structures our moral world, what is lost by accepting it?

  **Alex:** What is lost is the truth. Just because a belief is necessary doesn't make it true. It is necessary for me to believe that the sun rises over the earth, but I know it is false. I concede that we *must* hold each other responsible. But I maintain that when we do so, we are acting on a necessary illusion. We are treating people as ultimate originators when we know they are not. The tragedy is that we must live a lie to live together.

  **Jordan:** But that assumes the "lie" is the metaphysical claim about *causa sui*, rather than the practical claim about *agency*. You insist that the only truth that matters is the metaphysical truth about origins. I am saying the truth that matters is the truth about our capacities. When I hold you responsible, I am not claiming you created your soul. I am claiming that you are capable of understanding my demand for regard. That claim is true. You *are* capable. The neurotic, in that moment, is not.

  **Alex:** But the capacity itself is unchosen luck.

  **Jordan:** And yet, it is the only currency we have. Look, you press me on why we don't extend the objective attitude to everyone. You say, "If luck excuses the neurotic, luck should excuse everyone." But this ignores the function of the excuse. The excuse is not a metaphysical get-out-of-jail-free card based on causation. It is a signal that the normal rules of engagement do not apply. If I extend the objective attitude to you, I am not respecting you as a person; I am managing you as an object. I am opting out of the relationship.

  **Alex:** And if I hold you responsible, I am claiming you are an ultimate source, which you are not.

  **Jordan:** No. I am claiming you are a *participant*. That is all "responsibility" means in the only context where the word has sense. You want to say that because I didn't choose my capacity to participate, my participation is void. But that is like saying because I didn't choose to have a heart, my blood doesn't really circulate. The origin of the capacity is irrelevant to the function of the capacity.

  **Alex:** It is irrelevant to the *function*, yes. I grant that your system functions. It keeps society together. It allows for communication. But it is not *fair*. If we are playing a game, and I didn't choose to have the reflexes to play, and you didn't choose to have the reflexes to play, but the referee punishes me for dropping the ball and lets you off because your reflexes are "normal," the referee is not being fair, even if the game continues. The Basic Argument shows that the game is rigged by the universe. Your argument shows that we must play the game anyway.

  **Jordan:** I think you are clinging to a notion of "fairness" that requires us to be outside the universe, judging it. Fairness is a norm within the practice. Within the practice, it is fair to hold people to standards they can meet. It is unfair to hold the neurotic to standards they cannot meet. That distinction is real, even if the *capacity* to meet the standard is unchosen.

  **Alex:** But the "can" in "standards they can meet" is a conditional "can." I *can* meet the standard *if* I am the kind of person who chooses to. But I am the kind of person I am because of luck. So the "can" is an illusion.

  **Jordan:** And there we have the stalemate. You see the unchosen nature of the "can" as a disqualifier. I see the presence of the "can" as the only thing that qualifies. You want to know if we are truly, ultimately responsible. I am telling you that "ultimately" is a word that has no purchase here.

  **Alex:** Then we agree on the diagnosis, if not the cure. We agree that no one is *causa sui*. We agree that no one is ultimately responsible in the sense required to make the universe just.

  **Jordan:** I agree no one is *causa sui*. I disagree that the universe *needs* to be just in that sense for our responsibility practices to be valid.

  **Alex:** And I disagree that validity without ultimate justice is anything more than a coping mechanism. But I concede, as I said, that it is a coping mechanism we cannot discard.

  **Jordan:** And I concede, as I said, that if "responsibility" means what you say it means, then it does not exist. But I deny that is what it means.

  **Alex:** Then perhaps the disagreement is not about freedom, but about whether we can bear the truth of our own luck.

  **Jordan:** Or whether "truth" is the right metric for a human life.
