      *(Self-Correction on Concessions)*: I need to make sure the concessions are explicit and integrated into the flow, not just tacked on.
      *   Jamie's concession: "I grant you that no one is *causa sui*."
      *   Alex's concession: "I grant you that the reactive attitudes are inescapable."

      *(Refining the "Generalization" point)*: This is the crux. Galen argues that P.F.'s distinction between "abnormal" (excused) and "normal" (responsible) collapses because both are determined by luck (genetic/environmental). P.F. needs to defend the distinction without appealing to libertarian freedom.
      *   P.F. Strategy: The distinction is internal to the practice. "Abnormal" means "incapable of participating in the interpersonal exchange." It's not about *origin*, it's about *capacity*.
      *   Galen Counter: But the capacity is also unchosen.
      *   P.F. Counter: The *demand* doesn't require the capacity to be chosen, only to be present.

  6.  **Final Polish:** Check tone. Ensure philosophical terminology is accurate (e.g., "objective attitude," "reactive attitudes," "causa sui," "ultimate responsibility"). Ensure the prompt's specific constraints about the "determinism" red herring are met (Alex must clarify the argument works even if indeterminism is true).

