answer: |-
  This is a fantastic rabbit hole to fall down. You have hit on one of the specific reasons why Osborne & Rubinstein (*A Course in Game Theory*) is the bible for theorists but rarely makes it into pop-sci explainers. The distinction you're asking about is the difference between **pure-strategy dominance** and **mixed-strategy dominance**, and its consequences for **rationalizability** in multi-player settings.

  If you get this right in your piece, you will be ahead of 95% of the journalism on AI game theory. Here is the mechanical walkthrough you need to stop hand-waving.

  ### 1. The Trap: Why Pure-vs-Pure Isn't Enough

  Your friend is correct. If you only check if Strategy A is better than Strategy B, and if A is better than C, you might miss that a **mixture** of B and C is better than A.

  In game theory terms: A strategy is "strictly dominated" if there is *any* other strategy (pure or mixed) that yields a higher payoff against *every* possible move the opponent makes. If you restrict your search for dominators to only pure strategies, you are searching a smaller space. You might conclude a strategy is "safe" when it is actually obsolete.

  #### The Example
  Let's construct a 2-player game where Player 1 has three options (Top, Middle, Bottom) and Player 2 has two (Left, Right). We want to show that **Middle** is a bad move, but not obviously so.

  **Payoffs for Player 1:**

  | P1 \ P2 | Left | Right |
  | :--- | :---: | :---: |
  | **Top** | 0 | 3 |
  | **Middle** | 1 | 1 |
  | **Bottom** | 3 | 0 |

  **The Pure-Strategy Check:**
  *   Does **Top** dominate **Middle**? No. If P2 plays Left, Top gets 0 while Middle gets 1. Middle wins that round.
  *   Does **Bottom** dominate **Middle**? No. If P2 plays Right, Bottom gets 0 while Middle gets 1. Middle wins that round.

  If your AI agent (or your explainer) only checks pure strategies against pure strategies, **Middle survives.** It looks like a reasonable "safe" option that avoids the zeros.

  **The Mixed-Strategy Check:**
  Now, imagine Player 1 considers a mixed strategy: **Play Top 50% of the time, Bottom 50% of the time.**
  *   **Against Left:** Expected payoff = $(0.5 \times 0) + (0.5 \times 3) = \mathbf{1.5}$
  *   **Against Right:** Expected payoff = $(0.5 \times 3) + (0.5 \times 0) = \mathbf{1.5}$

  Compare this to **Middle**, which guarantees a payoff of **1** regardless of what Player 2 does.
  Since $1.5 > 1$ in both cases, the **mixed strategy dominates Middle.**

  **Why this matters for AI:**
  In multi-agent RL (like Poker bots), policies are often stochastic. If an agent only learns to compare deterministic policies ("Always Bet" vs. "Always Fold"), it might fail to realize that a specific deterministic policy is strictly suboptimal compared to a randomized one. To properly prune the search space, the agent must acknowledge that randomization can create value that deterministic moves cannot match.

  ### 2. The Link to Rationalizability

  You heard correctly: this is the engine of **Rationalizability**.

  **Rationalizability** asks: *Can this strategy be justified as a best response to some reasonable belief about the opponent?*
  If I play Middle, I must believe the opponent is playing something that makes Middle my best option.
  *   If I think they play Left, Top is worse (0), Bottom is better (3). Middle (1) is not best.
  *   If I think they play Right, Top is better (3), Bottom is worse (0). Middle (1) is not best.
  *   If I think they mix 50/50? Top/Bottom mix yields 1.5. Middle yields 1. Middle is *still* not best.

  **The Theorem (Pearce, 1984):**
  A strategy is **not** strictly dominated (even by mixed strategies) **if and only if** it is a best response to some belief about the opponent's play.

  This is the bridge.
  *   If you allow mixed-strategy dominance, Iterated Elimination of Dominated Strategies (IEDS) removes exactly the strategies that are **never a best response**.
  *   If you *only* allow pure-strategy dominance, you leave behind strategies that are *never a best response* to anything. You are left with strategies that no rational agent would ever play, even if they were uncertain about the opponent.

  For your article: When you see AI researchers talk about "reducing the action space via rationalizability," they are computationally doing IEDS allowing for mixed dominance. They are stripping away moves that cannot be justified by *any* belief.

  ### 3. The 3+ Player Weirdness (Correlated Beliefs)

  This is where it gets really spicy, and it's crucial for systems like **Diplomacy** (7 players) or negotiation bots.

  In a 2-player game, my "belief" about you is just a probability distribution over your moves. Simple.
  In a 3-player game (Me vs. Alice vs. Bob), my belief is a probability distribution over **pairs** of moves (Alice's move, Bob's move).

  Here is the divergence:
  1.  **Independent Beliefs:** I believe Alice and Bob choose their moves independently. $P(A, B) = P(A) \times P(B)$. This is the standard assumption in Nash Equilibrium.
  2.  **Correlated Beliefs:** I believe Alice and Bob's moves might be correlated. $P(A, B) \neq P(A) \times P(B)$. Maybe they have a shared history, or I suspect they are implicitly coordinating against me.

  **The Strange Consequence:**
  In 2-player games, "Undominated" and "Rationalizable" are the same thing.
  In 3+ player games, **they split.**

  *   **Fact:** A strategy is undominated (by mixed strategies) if and only if it is a best response to some **Correlated** belief.
  *   **The Gap:** There are strategies that are **undominated** (so they survive IEDS) but are **NOT** a best response to any **Independent** belief.

  **Example Intuition:**
  Imagine you are Player 1. Alice and Bob are Players 2 and 3.
  There is a strategy $S$ for you that is only good if Alice and Bob "coordinate" to play specific counter-moves that hurt them individually but hurt you more.
  *   If you assume they act **independently** (Nash style), the probability of them hitting that specific coordination is too low. Strategy $S$ looks like a bad bet. It is *not* a best response to independent beliefs.
  *   If you allow **correlated** beliefs (Rationalizability style), you can say, "I believe there is a 100% chance they play (Move A, Move B) together." Under that belief, $S$ *is* a best response. So $S$ is undominated.

  **Why this breaks IEDS in multi-agent AI:**
  If you are building a Diplomacy bot and you use standard IEDS to prune moves, you are implicitly assuming your opponents might have **correlated beliefs** about each other (even if they don't talk). You are assuming they could act as a coalition.
  *   If your AI assumes opponents are **independent** (standard Nash/RL assumption), IEDS is too weak. It leaves strategies in the game that should be eliminated because they only make sense if opponents are magically coordinating.
  *   If your AI assumes opponents might be **correlated** (coalition-aware), IEDS is accurate.

  ### Summary for your Draft

  1.  **Pure vs. Mixed Dominance:** Don't just say "dominated strategies are removed." Specify that **mixed-strategy dominance** is required. A strategy can be better than any single alternative but worse than a randomization of alternatives. (Use the 0-3 / 3-0 / 1-1 example).
  2.  **Rationalizability:** This concept is the philosophical justification for elimination. We remove strategies not just because they are "worse," but because they **cannot be a best response to any belief.** Mixed dominance is required to make this math work.
  3.  **The Multi-Agent Twist:** In 3+ player games (Diplomacy, negotiation), the equivalence breaks. Strategies can survive elimination if we allow for the possibility that opponents' actions are **correlated**. If your AI system assumes opponents act independently, standard elimination logic might leave "junk" strategies in the pool that would never actually be rational.

  This distinction is often where "theoretical" game theory meets "practical" multi-agent RL. Most RL algorithms assume independence (factorized policies), which means they are technically solving a different solution concept than the one defined by standard Rationalizability. Pointing that out will give your piece serious credibility.
