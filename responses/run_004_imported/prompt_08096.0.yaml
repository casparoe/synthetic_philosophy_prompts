          *   *Her Comeback:* Stoics kill desire; I prune it to make it bearable. It's gardening, not scorched earth.
          *   *Follow-up:* Where's the line? When does pruning become killing the passion that makes life worth living?

      *   *Requirement 4: General/Additional Questions (Need 4-5 more to reach 7-8).*
          *   *Idea A: Health.* She emphasizes physical health heavily.
          *   *Idea B: Prejudice.* She talks about public opinion.
          *   *Idea C: Love/Relationships.* She had a famous triangle with Voltaire and Saint-Lambert.
          *   *Idea D: The Role of God/Religion.* She was religious but Enlightenment.
          *   *Idea E: The "Taste" for Happiness.* Is happiness a skill?

      *   *Drafting Question 4 (Health):* You spend a lot of time on physical health. Is happiness just biology?
