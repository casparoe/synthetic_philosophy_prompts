prompt: |-
  I run a little history-of-philosophy podcast on the side (day job is software engineering, so dont assume I know the secondary literature). Next episode I'm doing a bit where I "interview" Émilie du Châtelet about her Discourse on Happiness like shes really sitting across from me in the studio. Draft me 7-8 questions that go beyond her just restating "you need passions, illusions, and freedom from prejudice to be happy" -- I want one on how a woman who translated Newton's Principia and built her whole reputation on rigorous math can turn around and use gambling as her go-to example for why we should protect our illusions, one on whether her line that study is especially valuable for women (since paths to glory are closed off to them) makes happiness-through-study sound more like a consolation prize than a real ideal, and one on whether her advice to "want only what's in our power" is just the Stoic resignation her whole essay seems to be arguing against. For each one, give her most likely comeback plus a follow-up that doesn't let her off the hook.
