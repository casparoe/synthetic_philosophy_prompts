answer: |-
  This is one of the most debated passages in the history of economic thought. Aristotle is attempting to solve a problem that would not be formally addressed again until the marginalist revolution of the 19th century: how can qualitatively different things (houses and shoes) be exchanged as if they are equal?

  Here is a step-by-step reconstruction of the argument, an explanation of the "diagonal" mathematics, and a reconciliation of the demand/money tension.

  ---

  ### 1. The "Diagonal Conjunction": Math and Logic

  To understand the "diagonal," we must visualize the four terms Aristotle provides:
  *   **A:** Builder
  *   **B:** Shoemaker
  *   **C:** House (Builder's product)
  *   **D:** Shoe (Shoemaker's product)

  #### The "Straight" Pairing (Why it fails)
  A "straight" pairing associates the producer with their own product (A with C, B with D).
  *   **Relation:** A produces C; B produces D.
  *   **Problem:** This describes *production*, not *exchange*. If we try to create a proportion based on this (A : C :: B : D), we are merely saying "a builder is to a house as a shoemaker is to a shoe." This establishes no basis for swapping. It leaves A with a house and B with a shoe. No intercourse occurs.

  #### The "Diagonal" Pairing (Why it succeeds)
  Exchange requires a crossing over. A must end up with D, and B must end up with C.
  *   **Relation:** A receives D; B receives C.
  *   **The Geometry:** If you arrange the terms in a square:
      $$
      \begin{matrix}
      \text{A (Builder)} & & \text{C (House)} \\
      & \times & \\
      \text{B (Shoemaker)} & & \text{D (Shoe)}
      \end{matrix}
      $$
      The exchange lines cross diagonally (A $\to$ D and B $\to$ C).

  #### The Proportion
  Aristotle argues that for the exchange to be just, the ratio between the *persons* must be balanced by the ratio between the *products*. However, because the products are being swapped inversely to the producers, the proportion is often interpreted as:

  $$ \text{A} : \text{B} :: \text{D} : \text{C} $$
  *(Builder is to Shoemaker as Shoes are to House)*

  **Why this specific math?**
  In Aristotle's view, persons are not equal in social worth or skill. If the Builder is considered "five times" the Shoemaker (in terms of the value of their labor to the polis), then the House must be worth "five times" the Shoe.
  *   If $\text{A} = 5\text{B}$, then $\text{C} = 5\text{D}$.
  *   Therefore, $\text{A} : \text{B} :: \text{C} : \text{D}$.

  *Wait, why did I write D:C above?* This is where the textual corruption lies (see section 4). Most commentators argue Aristotle intends an **inverse proportion** regarding the *flow* of goods to ensure equality of *value received*.
  *   A gives C (High Value) and receives D (Low Value $\times$ Quantity).
  *   B gives D (Low Value $\times$ Quantity) and receives C (High Value).
  *   The "Diagonal" ensures that the value A gives equals the value A gets, adjusted for their relative status.

  **Summary:** "Diagonal conjunction" picks out the **cross-exchange** (A gets D, B gets C) rather than the production relationship. Mathematically, it implies that the ratio of the producers' worth must equal the ratio of the products' value, allowing the goods to cross over without one party being impoverished.

  ---

  ### 2. Demand (*Chreia*) vs. Money (*Nomisma*)

  You have identified the central tension: Is value objective (demand/need) or conventional (money)? Aristotle's position is subtle and resists a simple dichotomy.

  #### The Reconciliation
  Aristotle distinguishes between the **ontological foundation** of value and the **instrumental mechanism** of value.

  1.  **Demand (*Chreia*) is the Substance:**
      *   Aristotle states demand "holds everything together." Without a mutual need for what the other produces, there is no reason to exchange.
      *   *Chreia* is not merely subjective "want" (as in modern utility theory); it is **social need**. It is the requirement of the *polis* for the builder to build and the shoemaker to shoe.
      *   Therefore, value is fundamentally **needs-based**. A house has value because the community needs shelter.

  2.  **Money is the Proxy:**
      *   Because we cannot carry our "need" around with us to measure every transaction (and because I need shoes *now* but you need a house *next year*), we need a representative token.
      *   Money "makes things commensurable" only in the sense that a ruler makes length commensurable. The ruler does not *create* length; it *measures* it. Similarly, money does not *create* value; it represents the underlying *chreia*.
      *   This is why money is *nomisma* (from *nomos*, custom/law). It is a convention agreed upon to represent the reality of need.

  #### The Theory of Value
  Does this amount to a needs-based or convention-based theory? **It is a Social-Convention theory tracking Real-Need.**
  *   It is not purely **Labor Theory** (like Marx), because the "worth" of the builder vs. shoemaker is not strictly hours worked, but their standing/necessity to the community.
  *   It is not purely **Subjective Utility** (like Neoclassicals), because *chreia* is objective social necessity, not individual whim.
  *   It is not purely **Convention**, because the convention is constrained by reality ("if men cease to have wants... exchange will go on no longer").

  **Verdict:** Aristotle posits that money is a **conventional symbol for an objective social reality (demand).** If the convention diverges too far from the reality (e.g., hyperinflation or useless currency), the system collapses, proving the reality is primary.

  ---

  ### 3. Step-by-Step Reconstruction of the Argument

  1.  **Premise 1 (Community):** The city (*polis*) is held together by reciprocity. People have different skills and need each other's products to survive.
  2.  **Premise 2 (Incommensurability):** Products are qualitatively different (a house is not a shoe). Direct barter is impossible without a way to equate them.
  3.  **Premise 3 (Proportionate Equality):** Exchange cannot be 1-for-1 physically; it must be 1-for-1 in *value*. Value is determined by the relative worth of the producers (which reflects the social demand for their skills).
  4.  **Step 4 (The Diagonal):** To achieve this equality, we must pair the producers diagonally with the *other's* product (Builder $\leftrightarrow$ Shoe). A proportion is established so that the Builder receives enough shoes to equal the value of the House he gives.
  5.  **Step 5 (The Need for a Measure):** Calculating this proportion for every transaction is difficult. We need a single unit to measure "how many shoes equal a house."
  6.  **Step 6 (Money as Measure):** Money is introduced as this unit. It acts as a middle term that expresses the ratio of exchange.
  7.  **Step 7 (The Foundation):** However, money is only a placeholder. The actual thing being measured is *demand* (*chreia*). If demand vanishes, money becomes useless. Thus, money is conventional, but it tracks the natural fact of human interdependence.

  ---

  ### 4. Translator and Commentator Disagreements

  The text you are reading (Rackham) is smooth, but the underlying Greek is notoriously difficult. Scholars generally disagree on three points:

  #### A. The Textual Corruption
  Most scholars (e.g., J.A. Stewart, John Burnet) believe the manuscript text regarding the mathematical proportion is corrupted. Aristotle was not a mathematician, and scribes likely confused the terms A, B, C, and D over centuries of copying.
  *   **The Issue:** In the standard text, the math doesn't quite work out to a clean geometric proportion.
  *   **The Fix:** Commentators like **Scott Meikle** (*Aristotle's Economic Thought*) argue we should read the proportion as $\text{A} : \text{B} :: \text{C} : \text{D}$ (Producers :: Products), but the *exchange* is diagonal. Others argue for $\text{A} : \text{B} :: \text{D} : \text{C}$ (Inverse).
  *   **Consensus:** The exact formula is less important than the *concept* of reciprocal proportionality.

  #### B. "Diagonal" Meaning
  *   **Geometric View:** Some (following Aquinas) view this as a literal geometric diagram where the "diagonal" refers to the product of the means equaling the product of the extremes ($A \times C = B \times D$).
  *   **Exchange Flow View:** Others (like **W. D. Ross**) argue "diagonal" simply refers to the crossing of goods in the market. A gives C to B; B gives D to A. The lines of transfer cross.
  *   **Current Preference:** The "Exchange Flow" view is more popular in modern commentary because it fits the sociological context better than the geometric one.

  #### C. The Nature of *Chreia*
  *   **Objective Need:** Traditional interpreters (e.g., **G.E.M. Anscombe**) view *chreia* as objective human need (shelter, clothing).
  *   **Subjective Demand:** Some economic historians try to read *chreia* as "market demand" (willingness to pay).
  *   **The Synthesis:** The most robust reading (e.g., **Edward Schiappa**) is that *chreia* is "socially validated need." It is objective in that the *polis* requires it, but conventional in that the *polis* decides which skills are valuable (e.g., a flute-maker might be valued highly in one city, low in another).

  ### Summary for your understanding
  1.  **Diagonal:** It means **cross-exchange**. You don't trade with yourself; you trade across the divide of labor. The math ensures the cross is balanced.
  2.  **Demand vs. Money:** Demand is the **reality**; Money is the **ruler**. You can have a ruler without length (useless), but you cannot have length without a ruler (hard to measure). Aristotle cares about the length (need), not just the ruler (cash).
  3.  **Value Theory:** It is a **Political Theory of Value**. Things are valuable because they sustain the political community, and money is the tool we invented to track that contribution.
