answer: |-
  # The Limits of Consensus: Why Rationality Does Not Demand Identical Priors

  The argument you had with your friend touches on one of the most profound tensions in modern epistemology and game theory. On one side stands the elegant, mathematical purity of Robert Aumann's Agreement Theorem, which suggests that disagreement is a form of irrationality. On the other stands the intuitive, philosophical reality of Subjective Bayesianism, which holds that rational agents can look at the same world and start from different places.

  To settle this, we must distinguish between a mathematical theorem and the assumptions required to make it work. Your friend is correct about the *theorem*: **If** two agents share a common prior, **then** they cannot agree to disagree. However, you are correct about the *axiom*: Bayesian rationality itself does not require agents to share a common prior.

  The verdict rests on which definition of "rationality" we ought to use. If we define rationality as strict adherence to the probability calculus and coherence in decision-making (the standard philosophical definition), **you are right:** ideally rational agents can permanently disagree. If we define rationality to include the "Harsanyi Doctrine" (that all differences in belief must stem from differences in information), **she is right,** but only by tautology. The correct notion to use here is the standard Subjective Bayesian one, because the Common Prior Assumption (CPA) is a substantive constraint on belief, not a requirement of logic. Therefore, lasting disagreement between fully rational agents is not only possible but expected.

  ### The Friend's Case: The Normative Appeal of Common Priors

  Your friend's position relies on the "Harsanyi Doctrine," named after Nobel laureate John Harsanyi. This doctrine posits that differences in subjective probabilities between rational individuals should be attributed entirely to differences in information, not to fundamental differences in how they process the world.

  The mathematical engine for this view is Aumann's Agreement Theorem (1976). Aumann proved that if two agents are Bayesian updaters, share a common prior, and have "common knowledge" of each other's posterior probabilities (meaning I know your probability, you know my probability, I know that you know, ad infinitum), their posteriors must be identical. If they are not, at least one agent is violating the rules of probability.

  This view is incredibly powerful in economics and game theory. It provides a clean explanation for the "No-Speculative-Trade Theorem" (Milgrom and Stokey, 1982). If we both know we are rational and we share a prior, I should not bet against you. If you are willing to sell me a asset at price $X$, it implies you have information that the asset is overvalued. Since I know you are rational, I should treat your willingness to sell as evidence that the asset is overvalued, and I should lower my own valuation. In a world of common priors, betting is a negative-sum game against a smarter opponent; the only rational move is not to play.

  Your friend's argument is that if we allow priors to differ arbitrarily, we lose the ability to call someone "wrong." If you believe the earth is flat and I believe it is round, and we blame it on "different priors," we have abandoned the project of finding truth. The Common Prior Assumption is thus defended as a *normative* requirement: to be truly rational is to acknowledge that there is one reality, and before we saw any evidence, we should have assigned probabilities based on the same logical structure of that reality.

  ### The User's Case: The Sovereignty of Subjective Priors

  Your counter-argument aligns with the tradition of Subjective Bayesianism, championed by Bruno de Finetti and Leonard Savage. In this framework, probability is not an objective feature of the world (like mass or velocity) but a measure of an agent's degree of belief.

  The core tenet of Subjective Bayesianism is that rationality is defined by **coherence**, not **accuracy**. To be rational is to ensure your beliefs do not contradict each other (e.g., $P(A) + P(\neg A) = 1$) and that you update consistently via Bayes' Rule. There is no logical law that dictates what your starting point ($P(H)$) must be, provided it is coherent.

  Consider the "prior" itself. For a human, a prior is not a blank slate; it is the sum of genetic architecture, evolutionary history, cultural upbringing, and cognitive heuristics accumulated before the specific "evidence" of the current argument is presented. Two people can be perfectly coherent processors of information but have different "operating systems."

  If Bayesian rationality required common priors, it would imply there is a single, objectively correct "state of ignorance." But what is the probability of life on Mars before looking at a telescope? Is it 50% (yes/no)? Is it based on the frequency of planets in the galaxy? Is it based on theological assumptions? There is no unique, logically mandated answer. To demand one is to smuggle in an objective theory of probability that most modern Bayesians reject. As you noted, the "Common Prior" is literally an *assumption*, not a *derivation*. It is an add-on to the math, not a consequence of it.

  ### Adjudication: Which Notion of Rationality is "Right"?

  To settle this, we must decide which notion of rationality is appropriate for the question: *"Can two fully rational people permanently disagree?"*

  Your friend is effectively arguing for **Objective Bayesianism** or a strong version of **Epistemic Rationality** where the goal is convergence to truth. In that framework, if you have a prior that differs from the "correct" one, you are arguably defective in your rationality.

  However, the standard definition of Bayesian Rationality in decision theory and philosophy is **Subjective**. Why is this the "right" notion to use here?

  1.  **Non-Circularity:** If we define rationality as "having the correct prior," then the statement "rational people cannot disagree" becomes a tautology. It essentially says, "People who start in the same place and calculate correctly end in the same place." This is trivially true but uninformative. The interesting question is whether the *process* of rationality forces convergence. Subjective Bayesianism tests the power of the process itself.
  2.  **The Problem of the "View from Nowhere":** The Common Prior Assumption requires agents to adopt a "view from nowhere"—a perspective prior to any existence or experience. But agents are embedded in the world. There is no logical mechanism to ensure two distinct minds land on the exact same probability distribution before observing data. To claim otherwise is to assert a metaphysical connection between minds that doesn't exist.
  3.  **Reflective Equilibrium:** Even if I know you are rational, knowing your prior does not force me to adopt it. If I know you are rational, I should update my belief *based on the fact that you believe X*. However, if our priors are sufficiently different, we may disagree on *how much* weight to give your belief. I might think, "She is rational, but her prior places too much weight on anecdotal evidence." Unless we agree on how to weigh each other's testimony (which requires... a common prior on reliability), we can still disagree.

  Therefore, the Subjective Bayesian notion is the robust one. It acknowledges that rationality is a set of rules for navigating uncertainty, not a guarantee of uniformity.

  ### The Speculative Trading Red Herring

  Your friend's point about speculative trading is a strong *reductio ad absurdum* against differing priors, but it ultimately fails to prove irrationality.

  The No-Trade Theorem holds *only under the Common Prior Assumption*. If priors differ, betting is rational. If I think the probability of rain is 70% and you think it is 30%, and we both know each other's numbers, we can bet. I am not assuming you are irrational; I am assuming you are *different*.

  In financial markets, trade happens precisely because participants have different models and priors. To claim this proves irrationality is to claim the entire insurance industry and stock market are populated by lunatics. A more charitable and accurate view is that trade exists because we value risk differently and assess probabilities differently. Rationality does not forbid betting; it forbids *incoherent* betting (e.g., Dutch Books). As long as our bets are consistent with our own priors, we are rational, even if we disagree.

  ### Conclusion

  The dispute comes down to whether "rationality" includes the starting point of belief or only the processing of belief.

  **The Verdict:** You are right. Ideally rational Bayesian agents are **not** required to share a common prior.

  Aumann's Agreement Theorem is a conditional statement: *If* common priors, *then* no disagreement. It does not prove the antecedent. The Common Prior Assumption is a useful modeling tool for economists who want to predict equilibrium outcomes, but it is not a law of logic or a requirement of rationality.

  To insist that two rational agents must start with identical probabilities is to demand that they be identical agents, which negates the premise of there being "two" people in the first place. Rationality demands that you update correctly when presented with evidence, including the evidence of your friend's opinion. But if your fundamental assessment of the world differs, and you have both updated correctly on all available information (including each other's stances), you can remain in permanent disagreement without either of you having "screwed up."

  Your friend has conflated a condition for *consensus* with a condition for *rationality*. Consensus requires common priors. Rationality only requires coherence. Since you can be coherent without being identical, rational disagreement is not only possible; it is inevitable.
