  Ok this is going to sound random but I don't know who else to ask, lol. I've been buried in problem sets for my machine learning class all week, but this is actually about my dog. I taught my dog Biscuit to come when called by doing the exact same thing every time: say "come," hold up the treat pouch, always in the living room. After a couple weeks she was basically perfect, comes running everytime, tail going crazy. But this weekend at the dog park I called her from across the field with the pouch left at home, and she just glanced at me and went back to sniffing a bush. My roommate says she's being a stubborn lab mix who needs firmer discipline, but that doesn't sit right with me, she wasn't confused, she clearly heard me and is totally capable of running over, she just didn't. Is my roommate right that this is a discipline problem, or is something else going on, and either way how do i actually get this to hold up outside the living room?
