answer: |-
  Hi everyone. For those who don't know me, I'm [Your Name].

  Jess and I started college as freshmen, terrified of almost everything. But mostly, I was terrified of making the wrong choices. There were so many times I didn't know if I was being a good friend, a good partner, or just a good person. And almost every time, I ended up on the phone with Jess asking the same question: "Is this messed up, or is it just me?"

  Now, there's a common saying that you can't outsource your conscience. That believing something is right just because someone you trust said so is… well, it's risky. We're supposed to figure out our own morals, not borrow someone else's.

  But here's the thing about Jess. She never let me borrow her conscience. She helped me find my own.

  When I was spiraling, she didn't just give me a verdict. She made me feel safe enough to be honest about why I was asking. She didn't tell me what to think; she reminded me of who I wanted to be. Trusting her wasn't about turning off my brain. It was about calibrating my heart against someone whose integrity I have never once questioned.

  For my Grandma and Jess's little brother, who don't need the theory: all that means is that she is the kindest, steadiest person I know. If Jess says you're on the right path, you are.

  Jess, thank you for being the person who made me trust my own judgment, even when I needed your voice to hear it first.

  To Jess.
