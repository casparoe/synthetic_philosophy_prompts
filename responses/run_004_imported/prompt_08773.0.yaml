  *   **Move 2 (Clare):** **2.** This articulates the "Supervenience Challenge" (famously pressed by Sider). It correctly identifies the ontological cost of coincidentalism: a failure of modal properties to supervene on categorical/microphysical bases. This is the strongest objection to Marcus's position.
  *   **Move 3 (Marcus):** **1.** A standard meta-ontological defense ("everyone has primitives"). While true that all theories have costs, this is a defensive deflection that doesn't address the *specific* nature of Clare's supervenience worry. It equates different *types* of theoretical cost without justification.
  *   **Move 4 (Clare):** **2.** This is the most philosophically sophisticated move. It correctly distinguishes between brute *categorical* facts (which 4Dism accepts) and brute *modal* facts (which Constitution View accepts). Preserving Humean supervenience (modality grounded in categorical facts) is generally considered a theoretical virtue, making this a strong counter to Marcus.
  *   **Move 5 (Marcus):** **1.** A fair comparative cost analysis, noting that 4Dism (specifically Lewisian) requires Counterpart Theory (CT) to validate de re modal claims. However, presenting CT as a pure "cost" is debatable (many view it as a solution to transworld identity problems), and it slightly conflates the 4D solution to *constitution* (distinct worms) with the 4D solution to *modality* (CT).

  **What Both Missed:**

  Both participants are operating within a framework that assumes the modal facts must either be **brute** or reduced to **categorical facts**. They largely overlook the contemporary **Grounding** approach (e.g., Fine, Correia). A grounding theorist might argue that the modal differences are not brute but are *grounded* in the sortal concepts or essence of the objects, thereby avoiding Clare's supervenience worry without requiring Marcus's brute coincidence. Additionally, they ignore **Deflationary** approaches (e.g., Hirsch, Thomasson), which suggest the dispute is merely verbal or conceptual regarding quantifier variance, rather than a substantive ontological disagreement about "objects." Finally, **Eliminativism** (there are no statues, only clay) remains a live option that dissolves the puzzle entirely, which neither considers.
