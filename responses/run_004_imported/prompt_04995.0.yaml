          *   Peter hears "Paderewski" (musician) $\rightarrow$ Assents to "Paderewski has musical talent." $\rightarrow$ Believes $P$ has talent.
          *   Peter hears "Paderewski" (politician) $\rightarrow$ Assents to "Paderewski has no musical talent." $\rightarrow$ Believes $P$ has no talent.
          *   Peter is rational.
          *   Contradiction: Peter believes $Fa$ and $\neg Fa$.
      *   *Why it hits Fregeans:* Fregeans usually solve puzzles by positing different *senses*. But Kripke argues that in the Paderewski case, the *name itself* is identical. If the Fregean says "Ah, but the *sense* is different," Kripke asks: "What determines the sense?" If it's just the speaker's psychological state, then we need a principled way to individuate senses that doesn't just mirror the belief attribution problem we started with. If the public meaning is the same, why does the belief attribution split? Kripke's point is that the *principles of belief attribution* (Disquotation) generate the contradiction before we even get to the theory of content. The puzzle is about the *norms of attribution*, not just the metaphysics of propositions.

