  **4:** Sam offers a defensible distinction based on the moral significance of harm, though it concedes that the asymmetry is indeed real.
  **5:** Elena deploys the argument from "constitutive luck," which is the most philosophically devastating challenge to any control-based account of responsibility.
  **6:** Sam correctly identifies that Elena's standard leads to skepticism, preserving responsibility by rejecting absolute control as a prerequisite for assessment.

  This disagreement is actually tracking the tension between **responsibility as metaphysical desert** versus **responsibility as social regulation**. Elena treats moral judgment as a retrospective ledger of what an agent truly deserves based on their will, while Sam treats it as a forward-looking tool for managing risk and harm within a community. Neither names that they are operating with different teleologies of blame: one aimed at cosmic fairness, the other at systemic safety.
