prompt: |-
  I just got put on my hospital's root-cause-analysis committee (total baptism by fire — this is my first case). A patient had a slow overnight bleed that nobody caught: the night nurse, the covering resident, and the attending each had at least one point where ordering another set of vitals or an extra scan probably would've caught it in time, but none of them did anything actively wrong — they each just didn't do the one extra thing. Half the committee wants to write this up as a pure systems failure with no individual responsibility, since if you start faulting the resident for not re-checking, you might as well fault the nurse, the attending, whoever wrote the staffing schedule that night, even the board for not funding more nursing staff. The other half thinks that logic is a recipe for never holding anyone accountable for anything, ever. Can you draft the reccomendation memo I have to bring to Tuesday's meeting -- it's basically going to set precedent for how we handle "failure to rescue" cases from now on, so it needs an actual decision rule for when an omission counts as someone's fault versus everyone's (or no one's), and it has to seriously engage with the "systems failure" side instead of just gesturing at it and then pinning the blame on an individual anyway.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is a new member of a hospital's Root-Cause Analysis (RCA) committee. This is their first case.
      *   **The Case:** A patient had a slow overnight bleed. Multiple providers (nurse, resident, attending) missed opportunities to catch it (omissions, not commissions). No one did anything "actively wrong" (no protocol violations per se), but no one did the "extra thing" that would have saved the patient.
      *   **The Conflict:** The committee is split.
          *   Side A: Pure systems failure (blaming individuals leads to infinite regress/blame culture).
          *   Side B: Need for individual accountability (otherwise no one is responsible for anything).
      *   **The Task:** Draft a recommendation memo for Tuesday's meeting.
      *   **The Goal:** Set a precedent/decision rule for "failure to rescue" cases involving omissions. It must seriously engage with the systems argument, not just pay lip service to it before blaming someone. It needs a clear decision rule.

  2.  **Determine the Tone and Style:**
      *   **Professional & Objective:** This is a formal hospital document.
      *   **Balanced:** It must acknowledge the validity of both sides of the committee debate.
      *   **Action-Oriented:** It needs to propose a concrete framework, not just philosophy.
      *   **Precedent-Setting:** The language needs to be durable enough to guide future cases.
      *   **Empathetic but Firm:** Acknowledge the human element without sacrificing patient safety.

  3.  **Deconstruct the Core Ethical/Operational Problem:**
      *   *The "Swiss Cheese" Model:* Usually, accidents happen when holes in defenses align. Here, the "holes" were passive (inaction).
      *   *The "Just Culture" Framework:* This is the industry standard for this exact dilemma. It distinguishes between human error, at-risk behavior, and reckless behavior.
      *   *The Specific Nuance:* This case is about *omission* in the face of ambiguity. It's not about breaking a rule; it's about clinical judgment regarding *when* to escalate.
      *   *The Decision Rule:* How do we distinguish "systemic overload" from "individual negligence" in omission cases?
          *   *Criterion 1: Expectation.* Was the action explicitly expected (protocol) or implicitly expected (judgment)?
          *   *Criterion 2: Capacity.* Did the system allow for the action (staffing, cognitive load)?
          *   *Criterion 3: Deviation.* Was the inaction a significant deviation from the standard of care for that specific clinical picture?

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the purpose (establishing a framework for omission-based adverse events).
      *   **Case Summary:** Briefly recap the bleed case without assigning blame yet.
      *   **The Core Tension:** Explicitly name the debate (Systems vs. Individual). This shows the user understands the assignment.
      *   **Proposed Framework (The "Decision Rule"):** This is the meat of the memo. I need to adapt the "Just Culture" model to fit the specific "omission" context.
          *   *Test 1: The Protocol Test.* (Was there a hard stop/rule?)
          *   *Test 2: The Reasonableness Test.* (Given the info *at the time*, was inaction reasonable?)
          *   *Test 3: The Systemic Barrier Test.* (Did the system make the right action difficult?)
      *   **Application to Current Case:** Apply the rule to the bleed case. (This is tricky; I shouldn't definitively blame the resident, but I should show *how* the rule applies). *Self-Correction:* The prompt asks for a recommendation memo to *set precedent*. I should recommend a finding based on the rule, or recommend the rule *for* the finding. Let's recommend the rule and suggest a finding of "Systemic Latent Conditions with At-Risk Behavior" (a middle ground).
      *   **Recommendations:** Concrete steps (protocol tweaks, education, not firing people).
      *   **Conclusion:** Reiterate the goal (safety + accountability).

  5.  **Refining the "Decision Rule":**
      *   The prompt specifically asks for a rule for when an omission counts as someone's fault vs. everyone's.
      *   *Idea:* The "Substitution Test." If we put a different, equally qualified person in that exact situation (same staffing, same info, same time of night), is it *more likely than not* they would have acted?
      *   *If Yes (Most would act):* Individual accountability (At-Risk Behavior).
      *   *If No (Most would not act):* Systemic Failure (Normalization of Deviance).
      *   *Integration:* Combine this with Just Culture.

  6.  **Addressing the "Systems" Argument Seriously:**
      *   I need to make sure I don't just say "Systems matter, but..."
      *   I need to acknowledge that staffing, fatigue, and normalization of deviance are real contributors.
      *   The memo must state that individual accountability *does not preclude* system fixes. Both happen.

  7.  **Review against Constraints:**
      *   *Baptism by fire:* The tone shouldn't be arrogant. It should be collaborative but decisive.
      *   *Precedent:* Needs to sound like policy.
      *   *Engage Systems Side:* Ensure the "Systemic Barrier Test" is robust.

  8.  **Final Polish:**
      *   Check for medical/legal sensitivity (avoid admitting liability, focus on quality improvement).
      *   Ensure the distinction between "Human Error," "At-Risk Behavior," and "Reckless Behavior" is clear, as this is the standard RCA language.
      *   *Crucial Adjustment:* The prompt implies the user needs to *bring* this to the meeting to sway the vote. It needs to be persuasive.

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm acting as the Chief of Staff. I am a committee member. The memo should be framed as a "Proposed Framework for Committee Consideration."

      *Refining the Decision Rule:* Let's call it the "Reasonable Clinician in Context" standard. It balances the ideal with the reality.

      *Wait, one more thing:* The prompt says "Half want pure systems... half want accountability." The memo needs to bridge this. The bridge is "Accountability for *choices*, Support for *conditions*."

      *Let's structure the Decision Rule clearly:*
      1.  Was there a violated hard constraint? (Protocol)
      2.  Was the omission a choice or a slip? (Cognitive)
      3.  Did the system incentivize the omission? (Production Pressure)

      *Okay, let's write it.*

  9.  **Final Review of the Output:**
      *   Does it answer the prompt? Yes.
      *   Is the tone right? Yes, professional and nuanced.
      *   Is the decision rule clear? Yes, the "Three-Filter Test."
      *   Does it engage the systems argument? Yes, deeply.

      *(Final thought)*: Make sure to advise the user that this is a draft they can adapt, as I don't know their specific hospital's bylaws.

      *Wait, looking at the prompt again:* "it's basically going to set precedent for how we handle 'failure to rescue' cases from now on."
      Okay, I will write it as a formal recommendation from the user (as a committee member) to the Committee Chair/Group.

      *Key Concept to Include:* "Normalization of Deviance." This explains why everyone missed it (it became normal to not check). This satisfies the systems crowd while allowing for individual correction.

      *Key Concept to Include:* "Just Culture." This is the standard industry term. I must use it.

      *Decision:* I will structure the memo to propose adopting a "Just Culture Algorithm" specifically tailored for Omission/Inaction cases.

      *Let's go.*
answer: |-
  **MEMORANDUM**

  **TO:** Root-Cause Analysis (RCA) Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Proposed Framework for Evaluating Omission-Based Adverse Events (Case #____)

  ### 1. Executive Summary
  This memo addresses the ongoing deliberation regarding the overnight hemorrhage event (Case #____). The Committee is currently divided between classifying this event as a pure systems failure (no individual accountability) or assigning individual responsibility for clinical omissions.

  To resolve this deadlock and establish a durable precedent for future "failure to rescue" cases involving inaction, I propose the adoption of a **Contextualized Omission Framework**. This framework utilizes the industry-standard "Just Culture" model but adapts it specifically for cases where no protocol was explicitly violated, but clinical vigilance lapsed.

  **Recommendation:** The Committee should classify this event as **Systemic Latent Conditions contributing to At-Risk Behavior.** We must implement system-level fixes *and* engage in individual coaching. This memo outlines the decision rule to distinguish between unavoidable error and accountable omission.

  ### 2. The Core Tension: Systems vs. Agency
  The debate before this Committee reflects a fundamental tension in patient safety:
  *   **The Systems Argument:** Holding individuals accountable for omissions in a resource-constrained environment creates a "blame culture." If staffing, fatigue, and ambiguous cues align to produce an error, punishing the individual is unjust and discourages future reporting.
  *   **The Accountability Argument:** If we attribute all errors to systems, we erase professional agency. Clinicians must retain ownership of clinical judgment. If "the system made me do it" becomes the default defense for inaction, standards of care will erode.

  Both positions are correct. A framework that ignores system constraints is cruel; a framework that ignores individual agency is dangerous.

  ### 3. Proposed Decision Rule: The "Three-Filter Test" for Omission
  To determine when an omission shifts from a systemic inevitability to an accountable choice, I propose we apply the following three filters to future cases. An omission warrants individual accountability **only if** it passes through all three filters.

  **Filter 1: The Protocol vs. Judgment Distinction**
  *   *Question:* Was the missed action mandated by a hard stop/protocol, or was it dependent on clinical judgment?
  *   *System Failure:* If a protocol existed (e.g., "Q1H vitals for post-op bleed risk") and was not followed due to staffing shortages preventing the task, this is a system failure.
  *   *Individual Accountability:* If the action relied on judgment (e.g., "assess need for repeat labs based on subtle cues"), the clinician holds responsibility for the quality of that judgment.
  *   *Application to Case #____:* There was no hard stop violated. This was a failure of *anticipatory judgment*. This moves the needle toward individual agency.

  **Filter 2: The "Reasonable Clinician in Context" Test (The Substitution Test)**
  *   *Question:* If we substituted a different, equally qualified clinician into the *exact* same conditions (same staffing, same patient load, same time of night, same handoff info), is it *more likely than not* they would have taken the extra action?
  *   *System Failure:* If 8 out of 10 clinicians would have also missed the cues due to fatigue, ambiguous data, or overwhelming competing priorities, the system has normalized deviance. The error is systemic.
  *   *Individual Accountability:* If the cues were present and the capacity existed, but this specific clinician failed to synthesize them while peers would have, this indicates an at-risk behavioral choice.
  *   *Application to Case #____:* Evidence suggests the cues were subtle but present. However, the "night float" culture often prioritizes stability over vigilance. This filter suggests a mix: the system normalized "letting sleeping dogs lie," but the individual accepted that normalization without challenge.

  **Filter 3: The Production Pressure Test**
  *   *Question:* Did the system actively incentivize the omission?
  *   *System Failure:* If the EMR buries vital trends, or if staffing ratios made physical checks impossible, the system incentivized the omission.
  *   *Individual Accountability:* If the clinician chose efficiency over safety without external pressure (e.g., chose not to order labs to avoid waking the patient or doing extra paperwork), this is an accountable choice.
  *   *Application to Case #____:* There was no active pressure *not* to check, but there was no reward *for* checking. This is "passive production pressure."

  ### 4. Application to Case #____
  Applying the Three-Filter Test to the overnight bleed:

  1.  **Judgment:** The decision to re-check vitals/labs was judgment-based. (Points to Agency)
  2.  **Substitution:** It is unclear if a peer would have acted. However, the attending, resident, and nurse *all* passed on the opportunity. This suggests a **Normalization of Deviance**. The "system" here is the cultural norm that overnight stability is assumed unless proven otherwise.
  3.  **Pressure:** No active barrier prevented the checks, but the workflow did not prompt them.

  **Finding:** This is not a "Pure Systems Failure," nor is it "Gross Negligence." It is **At-Risk Behavior facilitated by Latent Systemic Conditions.**
  *   *Why not Pure Systems?* Because clinicians retain the duty to escalate when intuition suggests risk, regardless of protocol.
  *   *Why not Pure Individual?* Because three separate roles missed the same cues. This indicates a training or cultural gap, not a single "bad apple."

  ### 5. Recommendations
  To honor both the need for safety and the need for accountability, I recommend the Committee approve the following actions:

  **A. Systemic Interventions (The "Everyone" Responsibility)**
  1.  **Trigger Modification:** Implement an EMR best-practice advisory for overnight vitals when specific risk factors (e.g., anticoagulation, recent procedure) are present. Remove the reliance on memory.
  2.  **Handoff Standard:** Require explicit "watch-out" criteria in night-float handoffs. If the risk isn't verbalized, the system assumes it doesn't exist.

  **B. Individual Interventions (The "Someone" Responsibility)**
  1.  **Coaching, Not Punishment:** The resident, nurse, and attending should undergo **reflective coaching**. They should not be disciplined, but they must participate in a structured review of *why* they hesitated to order the extra check.
  2.  **Accountability Statement:** Each provider must acknowledge that while the system was imperfect, they possessed the agency to override the "normal" workflow and chose not to. This preserves the professional contract without invoking punitive measures.

  ### 6. Conclusion
  Adopting this framework prevents the "infinite regress" of blame (where we blame the Board for funding) while avoiding the cynicism of "no one is responsible."

  It establishes that **individual accountability exists within the bounds of system capacity.** When the system makes the right action difficult, we fix the system. When the system allows the right action but the clinician chooses the easier path, we coach the clinician. In Case #____, both occurred.

  I move that we adopt this framework for this case and future omission-based RCAs.

  ***

  ### Notes for the User (Strategy Guide)

  *   **Why this works:** It uses "Just Culture" terminology (At-Risk Behavior vs. Human Error vs. Reckless Behavior) which is the gold standard in hospital risk management. It makes you look like you know the industry standards, not just philosophy.
  *   **The "Substitution Test":** This is your strongest weapon against the "Pure Systems" crowd. If a different nurse *would* have caught it, then the system isn't the *sole* cause. If *no one* would have caught it, then you can't blame the individual. It forces the committee to look at data, not feelings.
  *   **The Compromise:** By recommending "Coaching" instead of "Discipline," you satisfy the Accountability crowd (the provider has to sit in a room and explain themselves) and the Systems crowd (no one gets fired/suspended).
  *   **Precedent:** The "Three-Filter Test" is portable. You can bring this to the next meeting for a different case and say, "Remember the framework we used for the bleed case?"
  *   **Tone Check:** Notice I didn't say the doctors were "negligent." I said they engaged in "At-Risk Behavior." That is a specific safety science term that implies they cut a corner without realizing the risk, which fits your description perfectly.

  **Before you send:** Check your hospital's specific bylaws on RCA confidentiality. Ensure you aren't violating privilege by drafting this too broadly. Keep the specific patient identifiers out of the draft you circulate.
