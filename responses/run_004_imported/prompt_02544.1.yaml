          2.  **Primary vs. Secondary Intention:** Distinguish between the *reason* for the law (historical) and the *status* of the law (divine command). Once commanded, it binds eternally regardless of the original sociological cause. Principle 9 protects the *status*, *Guide* explains the *wisdom* of the status.
