      *   *Section 3: Applying to Pluto.* This is trickier. It looks verbal, but the definitions have theoretical weight. Sider might argue one definition "carves the solar system at the joints" better (dynamical dominance). Hirsch would say it's just a choice of linguistic framework. Chalmers's test shows the *disagreement* is verbal, but doesn't solve the *utility* question.
      *   *Section 4: Can Chalmers's Test Settle It?* Yes, it can identify *that* it is verbal. No, it cannot tell you *which* definition to adopt (pragmatics).
      *   *Section 5: The "So What?" (Implications).* The biggest implication is realizing that many arguments aren't about reality, but about language and utility. However, warn the user not to over-apply meta-ontology to culinary or IAU debates (it's a bit like using a sledgehammer to crack a nut).

