      *   *Implication for Counterfactual:* If the Cat *hadn't* knocked it over, the Dog wouldn't have been provoked. So the pot likely wouldn't be broken. Thus, "The dog would have [knocked it over]" is false.
      *   *Implication for Indicative:* Since the pot *is* broken, and only Cat/Dog were there, if Cat didn't do it, Dog *must* have (even if it contradicts his usual disposition, because the effect is already realized). Actually, strictly speaking, if the Dog *never* initiates, and the Cat didn't do it, then *neither* did it (maybe an earthquake?). But given the premise "No one else... window shut," we assume one of the pets did it. The Indicative accepts the *result* as fixed. The Counterfactual questions the *cause*.
      *   *Correction:* The Indicative "If the cat didn... the dog did" relies on the premise "One of them did." The Counterfactual "If the cat hadn... the dog would have" relies on the premise "How do they behave?"
