  **Move 1 (Marco): +1**
  Marco establishes the standard Psychological Continuity view, which aligns with most people's intuition that we survive bodily change as long as our minds persist. However, his claim is initially vulnerable because he hasn't accounted for the possibility of branching (fission), which complicates the definition of "same person."

  **Move 2 (Leah): +2**
  Leah correctly identifies the logical flaw in equating continuity with identity: identity must be one-to-one, but continuity can be one-to-many. Her use of the Riker fission case is logically decisive against the claim that psychological continuity *constitutes* strict identity.

  **Move 3 (Marco): +2**
  Marco pivots to Derek Parfit's Reductionist view, distinguishing between "identity" (which fails in fission) and "what matters" (which survives). This is the strongest available philosophical defense for teleportation, as it sidesteps the logical contradiction Leah raised by changing the goalposts from identity to survival.

  **Move 4 (Leah): +1**
  Leah highlights the ethical cost of Marco's view: if identity doesn't matter, special concern for your own future becomes hard to distinguish from concern for a stranger with your memories. This is a strong intuitive objection, though Marco has a theoretical counter-argument ready (see Move 5).

  **Move 5 (Marco): +1**
  Marco consistently applies Parfit's view by arguing that even normal aging involves enough psychological change that "prudence" is always a form of caring for a successor. This is internally consistent, but it demands a significant revision of common sense intuitions about self-interest, which limits its persuasive power.

  **Move 6 (Leah): +2**
  Leah lands the strongest objection regarding "extrinsicness": it seems irrational that your survival depends on whether a duplicate spontaneously appears elsewhere in the universe. This is widely considered the most serious unresolved problem for the "non-branching" view Marco is defending.

  **What They're Missing**
  Both Marco and Leah are debating within the framework of Psychological Continuity, ignoring the rival theory of **Animalism**, which argues you are strictly your biological organism; under this view, teleportation kills you regardless of memory transfer, and the Riker duplicate is merely a clone. Additionally, for your cryonics context, they are missing the **pragmatic distinction**: even if the upload isn't metaphysically "you," it might still fulfill your practical goals (finishing projects, caring for family), which may be the only metric that actually matters for decision-making.
