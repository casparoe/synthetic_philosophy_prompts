      *   **Characters:** Can be Maya/Jordan (the example people) or new characters. Let's use new characters to allow for meta-commentary on the Maya/Jordan example without getting bogged down in the specific mechanics of steak vs. flights. Let's call them Alex (Pro-Trade) and Sam (Anti-Trade).

  2.  **Deconstruct the Arguments:**

