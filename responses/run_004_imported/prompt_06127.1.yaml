          *   *Anti-Moral Trade:* It's akin to buying indulgences, commodifies morality, allows people to bypass moral persuasion/conversion, potentially reinforces bad behavior if one side is objectively wrong.
      *   **Specific Constraint:** The user is stuck on a specific nuance: *Does moral trade require moral uncertainty?* If both are 100% confident, does it collapse into paying for sin?
      *   **Format:** Dialogue between two characters.
