answer: |-
  **Setting:** *A quiet corner of the university library, late afternoon. Two philosophy students, LEO (pro-moral trade) and SAM (anti-moral trade), are sitting across from each other with a half-finished whiteboard covered in arrows and question marks. They are debating the "Maya and Jordan" scenario.*

  **Sam:** Okay, let's look at the transaction again. Maya pays Jordan to eat less meat. Jordan pays Maya to fly less. You say this is a win-win. I say it's a spiritual car crash.

  **Leo:** A win-win for the world, Sam. Less suffering for animals, less carbon in the air. By both of their metrics, the universe is improved. That's the definition of a Pareto improvement.

  **Sam:** It's a Pareto improvement for their *consciences*, maybe. But it's a disaster for their moral integrity. Divya called it "buying indulgences," and she's right. In the Middle Ages, you could pay the Church to wipe away your sin so you didn't have to actually repent. Jordan isn't repenting. He doesn't think meat is wrong. He thinks *cash* is good. He's monetizing his own "sinning," and Maya is bankrolling it.

  **Leo:** That's the indulgence objection, I know. But there's a crucial difference. Indulgences were retrospective. You sin, then you pay to be forgiven. Moral trade is prospective. Maya isn't paying for Jordan to be *forgiven* for eating a burger; she's paying him *not to eat it*. The bad act literally doesn't happen. If the goal of ethics is to reduce harm, isn't preventing the harm better than preaching about it and failing?

  **Sam:** Only if the goal is purely consequentialist. But ethics is also about character. If Jordan only stops eating meat because he's being bribed, he hasn't become a better person. He's become a mercenary. And worse, it lets Maya off the hook too. Instead of doing the hard work of moral persuasion—actually convincing Jordan that animals matter—she just writes a check. It turns morality into a market commodity.

  **Leo:** But that assumes Maya *can* convince Jordan. What if she can't? We're talking about deep-seated ethical disagreements here. If the choice is between "Jordan eats steak forever because he disagrees with Maya" and "Jordan eats less steak because Maya pays him," why is the first one more virtuous? It feels purer, sure, but it leaves more cows dead.

  **Sam:** Because the first one respects the truth. Look, let's hit the thing you were hinting at earlier. This whole scheme relies on moral uncertainty, doesn't it? For Maya to feel okay about this, she has to admit, "Well, maybe Jordan's right to some degree." If she truly believed eating meat is akin to murder, would she pay a murderer to murder less? Or would she try to stop the murder?

  **Leo:** *Pauses, tapping a pen against the table.* That's the crux, isn't it? Toby Ord's original point was specifically about moral uncertainty. We aren't gods. Maya might be wrong that meat is the priority; Jordan might be wrong that flying is fine. By trading, they hedge their bets. Maya ensures less meat is eaten (in case she's right), but she also flies less (in case Jordan is right about carbon). It's an ethical portfolio diversification.

  **Sam:** Okay, I'll grant you that. If both of them are like, "I'm 60% sure I'm right, 40% sure I'm wrong," then trade makes sense. It's a humble acknowledgment of fallibility. But that's not how people actually operate, Leo. People don't walk around thinking, "I'm 60% sure slavery is wrong." They think, "Slavery is abhorrent." If you introduce trade into high-confidence beliefs, the logic breaks.

  **Leo:** How does it break? Suppose Maya is 99% sure meat is wrong. She still has 1% uncertainty. Or, even if she's 100% sure, she recognizes resource constraints. She can't convert everyone. If paying Jordan saves more animals per dollar than her own dietary strictness, isn't she obligated to trade? It's effective altruism.

  **Sam:** No, because at 99% confidence, the trade changes from "hedging" to "complicity." If Maya is that sure, then by paying Jordan, she is acknowledging that Jordan's moral agency is for sale. She's validating the idea that his actions don't need to be guided by *truth*, only by *incentive*. You're training him to ignore moral arguments and look for price tags. What happens when someone offers Jordan more money to eat *more* meat?

  **Leo:** That's a practical risk, sure. But you're assuming the market for immorality is liquid. In reality, the "price" of eating meat is social stigma, health costs, etc. Maya is just adding a subsidy to the existing costs. But let's go back to your complicity point. You're saying that if I'm confident, I shouldn't trade. But if I'm not confident, I should?

  **Sam:** I'm saying if you're confident, trade is corrupting. If you're unsure, trade is prudent. The problem is, moral trade blurs the line between the two. If I get used to trading on the stuff I'm unsure about, I start treating the stuff I'm sure about as tradable too. It creates a habit of mind where everything has a price.

  **Leo:** Or, it creates a habit of cooperation. Look, we live in a pluralistic society. We aren't going to agree on the Good. If we demand total moral agreement before we cooperate, we get gridlock. Moral trade allows people with different "operating systems" to run compatible programs. Maya and Jordan don't have to agree on *why* the action is good, only *that* it is good. That's how civilization functions.

  **Sam:** Civilization functions on laws, Leo, not side-deals. Laws say "You can't kill people." They don't say "You can kill people if the victim's family pays you not to." When you privatize moral compliance, you undermine the public norm. If Maya pays Jordan, she's implicitly admitting that his choice to eat meat is legitimately his to make, provided the price is right. But if meat-eating is actually *wrong*, it's not his to sell.

  **Leo:** But who decides what's "actually" wrong? That's the whole problem! You're assuming there's an objective moral fact of the matter that we can access. If we accept moral realism is hard to pin down, then Maya treating Jordan's behavior as "his to sell" is actually more respectful than her trying to force her view on him. It acknowledges his autonomy.

  **Sam:** It acknowledges his autonomy to be a villain, though! Think about the signaling. If moral trade becomes normal, the wealthy can just buy their way out of moral demands. The rich vegan pays the poor carnivore to stop eating meat, but the poor carnivore is now dependent on that income. If the vegan stops paying, the carnivore goes back to steak, but now he's resentful and poorer. You haven't solved the moral issue; you've just created a dependency relationship based on moral leverage.

  **Leo:** That's a distributional concern, not a moral one. We can fix the wealth gap separately. The question is: Is the world better with the trade or without? In the trade scenario, fewer animals die. In the no-trade scenario, more animals die, and Maya and Jordan hate each other.

  **Sam:** Is it better? Or does it just look better on a spreadsheet? You're counting the "units of badness" going down. I'm worried about the "source of goodness" drying up. If Jordan stops eating meat for money, he hasn't learned anything. He hasn't moved closer to the truth. He's just been conditioned. When the money stops, the moral progress evaporates. Real moral progress requires internalization, not transaction.

  **Leo:** But internalization takes generations! We don't have generations for climate change or factory farming. If moral trade is a bridge—a temporary mechanism to reduce harm while we slowly convince each other—why burn the bridge? Maybe Jordan eats less meat for ten years because of the payments, and in that time, he actually starts to feel healthier, sees the logic, and eventually becomes a vegetarian on his own. The trade was the entry drug.

  **Sam:** *Laughs.* The entry drug. That's exactly what I'm afraid of. That we start thinking we can buy our way out of moral duty. But okay, let's meet in the middle on the uncertainty thing. You said earlier that this works best when both parties admit they might be wrong.

  **Leo:** Right. If Maya admits, "Maybe flying is worse than I thought," and Jordan admits, "Maybe meat is worse than I thought," the trade is an act of mutual humility.

  **Sam:** So, here's my condition. Moral trade is permissible *only* when framed as epistemic humility. It cannot be used when one party claims moral certainty. If Maya says, "I know meat is murder," she cannot trade. She must campaign. If she says, "I'm worried meat might be murder, and you're worried flying might be murder," then they can trade.

  **Leo:** That's a hard line to enforce. How do you prove certainty? I can claim uncertainty to get the deal, then feel smugly superior later.

  **Sam:** Then the deal is corrupt. Look, the reason Divya and I feel icky about it is because it smells like we're giving up on the idea that morality is about *truth*. It makes morality about *management*.

  **Leo:** And I think you're giving up on the idea that morality is about *results*. It makes morality about *purity*.

  **Sam:** *Sighs and leans back.* So, if Maya and Jordan sign this contract...

  **Leo:** ...They save some cows and some carbon.

  **Sam:** ...But they might lose the belief that those things matter for their own sake.

  **Leo:** Or they might realize that cooperating across difference matters more than being right.

  **Sam:** *Pauses, looking at the whiteboard.* You know, if Jordan takes the money but spends it on something that causes more harm—like, I don't know, investing in a coal mine—does the trade still hold?

  **Leo:** *Stops tapping the pen.* Well... strictly speaking, Maya only cares about the meat. But if we're looking at global utility...

  **Sam:** Exactly. You can't isolate the moral act from the agent. That's why the indulgence thing sticks. You're paying the sinner, not the sin.

  **Leo:** Okay. That's a fair point. Maybe the trade needs a third clause. Jordan has to donate the money to something neutral. Or better yet, Maya doesn't pay Jordan directly. She pays a charity Jordan likes, conditional on his diet.

  **Sam:** Now you're just reinventing carbon offsets.

  **Leo:** *Smiles.* Maybe. But offsets work.

  **Sam:** Sometimes. Look, I'm not saying we ban it. I'm saying it's dangerous. It's a tool that works best when you're afraid to use it.

  **Leo:** So we agree? It's a high-risk hedge. Only for the morally uncertain.

  **Sam:** Only for the morally uncertain. And never, ever on the stuff you'd die for.

  **Leo:** Deal.

  **Sam:** *Shakes head.* Don't make a deal with me on this. That proves my point.

  **Leo:** *Grins.* Too late. Trade executed.
