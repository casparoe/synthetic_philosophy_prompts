      *   **Evidence:** $P(\text{HQ} | \text{Red}) = 3 \times P(\text{2nd} | \text{Red})$. i.e., $P(\text{HQ} | \text{Red}) = 0.75, P(\text{2nd} | \text{Red}) = 0.25$.
      *   **Intuition:** Evidence is only about Red's internal structure. $P(\text{Blue})$ should remain $1/2$.
      *   **Standard Solution (Minimize KL-Divergence/MaxEnt):** The user claims $P(\text{Blue}) \approx 0.532$.
      *   **User's Explanation:** Global operation, "cost" of unevenness offset by shifting to Blue.
