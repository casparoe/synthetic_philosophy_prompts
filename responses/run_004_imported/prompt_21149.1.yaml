      *   *Constraint:* $P(R_H) = 3 P(R_S)$. Also $P(R_H) + P(R_S) + P(B_H) + P(B_S) = 1$.
      *   *Method:* Minimize $D_{KL}(Q || P) = \sum Q_i \ln(Q_i / P_i)$ subject to constraints.
      *   *Calculation:*
          *   Let $Q(B_H) = x, Q(B_S) = x$ (by symmetry of prior and lack of constraint on Blue).
          *   Let $Q(R_S) = y, Q(R_H) = 3y$.
          *   Sum: $2x + 4y = 1 \Rightarrow x + 2y = 0.5 \Rightarrow x = 0.5 - 2y$.
          *   KL Divergence: $2 [x \ln(x/0.25)] + y \ln(y/0.25) + 3y \ln(3y/0.25)$.
          *   Actually, there's a known analytical solution for this specific problem (Van Fraassen's example).
          *   The standard MinCrossEntropy (MinXent) solution yields $P(\text{Blue}) \approx 0.532$? Let's verify.
          *   Van Fraassen (1981) "A Problem for Relative Information Minimizers":
              *   Prior: $p_1, p_2, p_3, p_4$.
              *   Constraint: $q_3 / q_4 = 3$ (assuming 3,4 are Red).
              *   Result: $Q(\text{Blue}) = \frac{1}{1 + (1/2) \cdot 4^{1/4} \cdot \dots}$? No, let's look for the specific value.
              *   Common citation: $P(\text{Blue}) \approx 0.532$ is correct for the 3:1 ratio using MinXent.
              *   Limit case: If $P(\text{HQ}|\text{Red}) \to 1$, then effectively we learn $\neg (\text{Red} \cap \text{2nd})$.
              *   If we learn $\neg (\text{Red} \cap \text{2nd})$, we eliminate one of the four prior equiprobable worlds.
              *   Remaining worlds: $B_H, B_S, R_H$. Prior mass was $1/4$ each.
              *   Conditionalization: Renormalize. Total mass $3/4$.
