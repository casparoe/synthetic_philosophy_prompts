answer: |-
  Here are 10 substantive questions designed to press a Naive Realist Disjunctivist (NRD) on the specific weaknesses of the view, assuming your group is already fluent in the basics. Per your request, each question includes a "Follow-Up Menu" keyed to the three defensive moves you identified (Deny Common-Kind, Bite Causal Bullet, Retreat to Disjunctive Concept), so you can pivot instantly depending on how she dodges.

  ### 1. The Proximal Causal Chain (Required)
  **Question:** "Consider a case of direct cortical stimulation where we induce a hallucination of a red apple by stimulating V4 in the exact same pattern as a veridical perception of a red apple. The proximal causal chain is type-identical. If the mental state supervenes on the brain state, aren't these the same fundamental kind of state? If you deny this, aren't you positing a mental difference without a physical difference?"

  *   **Follow-Up Menu:**
      *   **If she Denies Common-Kind:** "So you're claiming two neurophysiologically identical states can differ in fundamental mental kind? Doesn't that make the mental causally inert or violate physical supervenience?"
      *   **If she Bites Causal Bullet:** "You're accepting the neural identity but denying the mental identity. But if the neural state does all the causal work for behavior, what explanatory work is the 'relational' nature of the veridical case actually doing?"
      *   **If she Retreats to Disjunctive Concept:** "If 'experience' is just a disjunctive label covering two unrelated states, isn't that just a verbal stipulation to save the theory? What unifies the disjunction other than subjective indistinguishability?"

  ### 2. Epistemic Screening Off (Required)
  **Question:** "On the McDowell/Pritchard line: if the good case provides factive reasons but the bad case is subjectively indistinguishable, how does that factive justification help the subject *first-personally*? If I can't tell from the inside whether I'm in the good case, doesn't the possibility of the bad case screen off the justificatory force of the good case for me, right now?"

  *   **Follow-Up Menu:**
      *   **If she Denies Common-Kind:** "You say the phenomenology is different in the good case. But if that difference isn't introspectively accessible to rule out the bad case, how does it function as a reason *for me*?"
      *   **If she Bites Causal Bullet:** "Are you suggesting the causal history of my state (being caused by an apple) confers justification even if I can't access that history? Isn't that externalism that ignores the internalist intuition driving the skeptic?"
      *   **If she Retreats to Disjunctive Concept:** "If my justification is disjunctive ('I see or it seems'), haven't you weakened the factivity claim so much that it no longer answers the skeptic?"

  ### 3. The Time-Lag Argument (Required)
  **Question:** "Naive realism claims unmediated access to a *presently existing* object. But light transmission and neural processing take time. If I look at a star that exploded five minutes ago, I am visually related to a state of affairs that no longer exists. Are you committed to saying I see a presently existing object that is numerically distinct from the star I'm looking at, or do you bite the bullet that we see the past?"

  *   **Follow-Up Menu:**
      *   **If she Denies Common-Kind:** "If you say the hallucination of the exploded star is a different kind of state, at what precise millisecond does the relation snap and the hallucination begin? That seems arbitrary."
      *   **If she Bites Causal Bullet:** "If you accept we see the past object, doesn't that undermine the 'present' openness to the world that motivates naive realism in the first place?"
      *   **If she Retreats to Disjunctive Concept:** "If 'seeing' is disjunctive (seeing-present or seeing-past), haven't you abandoned the core naive realist claim of direct contact with the *current* environment?"

  ### 4. The Phenomenology of the "Bad Case"
  **Question:** "If hallucinations are not relations to mind-independent objects, what *are* they ontologically? Negative disjunctivism says they are just states that are 'indistinguishable from seeing.' But indistinguishability is an epistemic relation, not an ontological constitution. What positive account of the hallucinatory state's phenomenology are you offering?"

  *   **Follow-Up Menu:**
      *   **If she Denies Common-Kind:** "If the hallucination lacks the phenomenology of 'openness to the world,' why does it strike the subject as having it? Are you accusing the hallucinating subject of a systematic error about their own experience?"
      *   **If she Bites Causal Bullet:** "If you ground the hallucination in neural causes, aren't you implicitly accepting a common neural kind that grounds the epistemic indistinguishability?"
      *   **If she Retreats to Disjunctive Concept:** "Defining the bad case solely as 'not seeing' makes it parasitic on the good case. How can a fundamental theory of mind make the bad case ontologically derivative?"

  ### 5. Motor Intentionality and Action
  **Question:** "When I reach for a veridical apple and a subjectively identical hallucinated apple, my motor planning and kinematic trajectory are identical until contact. If the mental states are fundamentally different kinds, why do they issue in identical motor commands? Doesn't action guidance require a common functional kind?"

  *   **Follow-Up Menu:**
      *   **If she Denies Common-Kind:** "Are you suggesting the motor system is insensitive to the fundamental kind of mental state it's executing? That seems to decouple mind from action."
      *   **If she Bites Causal Bullet:** "If the causal output is identical, isn't the 'relational' nature of the veridical state epiphenomenal with respect to behavior?"
      *   **If she Retreats to Disjunctive Concept:** "If 'planning to reach' is also a disjunctive concept, doesn't that fracture our unified scientific understanding of the motor system?"

  ### 6. Inference to the Best Explanation
  **Question:** "The standard argument from illusion relies on an Inference to the Best Explanation: subjective indistinguishability is best explained by a common phenomenal kind. You reject this. What is your positive explanation for *why* two fundamentally different states should be indistinguishable from the inside, if not because they share a common nature?"

  *   **Follow-Up Menu:**
      *   **If she Denies Common-Kind:** "If there is no common nature, isn't the indistinguishability a massive cosmic coincidence? That seems less parsimonious than the common-kind view."
      *   **If she Bites Causal Bullet:** "If you appeal to common neural causes to explain the indistinguishability, haven't you just relocated the common kind to the physical base?"
      *   **If she Retreats to Disjunctive Concept:** "Is the explanation just that 'experience' is a misleading folk category? If so, are you doing psychology or conceptual analysis?"

  ### 7. Partial Illusion and Amodal Completion
  **Question:** "Consider the stick half-submerged in water. Half is veridical, half is illusory. Is my experience a hybrid of two fundamentally different kinds of states stitched together? If so, how does the unity of consciousness hold across the boundary where one kind stops and the other starts?"

  *   **Follow-Up Menu:**
      *   **If she Denies Common-Kind:** "If part of my visual field is a relation and part is not, does the 'relational' part phenomenally glow differently? If not, how do I experience a unified scene?"
      *   **If she Bites Causal Bullet:** "If the causal story unifies the field, why isn't that causal story the real story about the experience's nature?"
      *   **If she Retreats to Disjunctive Concept:** "If the whole scene is disjunctive, does that mean I'm not related to the stick at all, or only the dry part? The latter seems arbitrary."

  ### 8. Evolutionary Redundancy
  **Question:** "From an evolutionary perspective, why would nature select for two fundamentally different systems (relational vs. non-relational) that produce subjectively identical outputs? Wouldn't a single system that sometimes malfunctions be more metabolically efficient than maintaining two distinct ontological pathways?"

  *   **Follow-Up Menu:**
      *   **If she Denies Common-Kind:** "Are you suggesting evolution selected for a system that generates systematic deception (hallucination) that mimics the veridical state perfectly? That seems maladaptive."
      *   **If she Bites Causal Bullet:** "If the neural hardware is the same, isn't the 'two systems' claim just a metaphysical overlay on a single biological system?"
      *   **If she Retreats to Disjunctive Concept:** "If 'perception' is disjunctive, isn't evolution selecting for the disjunction? But nature doesn't select for disjunctions, it selects for mechanisms."

  ### 9. Cognitive Penetration
  **Question:** "If my fear makes a neutral object look threatening (cognitive penetration), does the mind-independent object change its properties? If not, is the 'threatening' look a relation to the object or a projection? If it's a projection, doesn't that introduce a non-relational element into the veridical case?"

  *   **Follow-Up Menu:**
      *   **If she Denies Common-Kind:** "If the veridical case is purely relational, how can top-down cognitive states alter the phenomenology without altering the relation? Are you denying cognitive penetration?"
      *   **If she Bites Causal Bullet:** "If you accept the causal influence of cognition on perception, doesn't that mediate the relation to the object, undermining 'naive' realism?"
      *   **If she Retreats to Disjunctive Concept:** "If the 'threatening' look is a different kind of experience, does that mean I'm not seeing the object anymore when I'm afraid? That seems counterintuitive."

  ### 10. Naturalistic Integration
  **Question:** "Psychophysics relies on mapping physical stimuli to mental responses assuming a continuous function. If veridical and hallucinatory states are different in kind, doesn't disjunctivism break the continuity required for a unified science of the mind? How do we model the transition between kinds mathematically?"

  *   **Follow-Up Menu:**
      *   **If she Denies Common-Kind:** "If there is a categorical break between kinds, shouldn't we see a categorical break in the data? Psychophysics shows continuous gradients, not ontological cliffs."
      *   **If she Bites Causal Bullet:** "If the physical data is continuous, isn't the discontinuity purely in your metaphysics, not in the phenomenon itself?"
      *   **If she Retreats to Disjunctive Concept:** "If science treats 'experience' as a natural kind and you treat it as a disjunction, aren't you recommending we stop using the term in scientific contexts?"
