answer: |-
  **MEMORANDUM**

  **TO:** Editorial Committee, Open-Access Ethics Sourcebook
  **FROM:** [Your Name], Bentham Specialist
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Bentham's "Offences Against One's Self" Module

  **1. Purpose**

  This memo serves to open our discussion regarding the inclusion of Jeremy Bentham's unpublished manuscript "Offences Against One's Self" (1785) in the Classical Utilitarianism module. As we weigh the pedagogical value of the text against the philosophical complexities of its scope, I recommend a middle path that preserves the historical radicalism of the excerpt while utilizing the text's difficulties as a critical thinking exercise rather than obscuring them.

  **2. Recommendation on Textual Inclusion**

  I recommend we **include a substantial excerpt** of the manuscript, specifically the sections detailing the "impropriety" of punishing consensual sexual acts between adults, but **not** as a sanitized triumph of modern liberalism.

  *   **Form:** We should excerpt the core argument where Bentham applies the hedonic calculus to "irregularities" (specifically paragraphs 1–15 of the Crompton edition, focusing on the lack of assignable pain to others).
  *   **Condition:** We must *not* truncate the text in a way that implies Bentham's definition of "harm" or "consent" aligns perfectly with contemporary liberal frameworks. To do so would validate the concern that we are presenting a "comfortable" Bentham rather than the actual historical figure.

  **3. Guidelines for the Editorial Headnote**

  The headnote is the critical mechanism for resolving the disagreement between the factions. It must perform three specific functions:

  *   **A. Contextualize the "Principle of Sympathy and Antipathy."**
      The headnote must explicitly define this term as Bentham uses it in the *Introduction to the Principles of Morals and Legislation*. It should explain that for Bentham, disgust is a psychological fact, not a moral reason. Students must understand that Bentham is attacking the *legitimacy* of using collective disgust as a basis for legislation, not merely arguing for tolerance.
  *   **B. Clarify the Unpublished Status.**
      We must state clearly that Bentham never published this during his lifetime. This allows us to discuss *why* (the risk to his reputation and the utility of the reform movement) without diminishing the philosophical rigor of the argument.
  *   **C. Address the Scope Objection (The "Bestiality Problem").**
      This is the crucial addition. The headnote must explicitly state that Bentham's category of "sexual irregularities" included acts involving non-human animals, and that his utility calculus applied to these acts on similar grounds (i.e., the absence of pain to the human participant and, in Bentham's view, the animal).
      *   **Do Not:** Claim Bentham's argument stops where modern intuitions do.
      *   **Do:** Frame this over-inclusiveness as a philosophical challenge for the student. The headnote should invite students to consider whether the "harm principle" alone is sufficient for sexual ethics, or if it requires supplementation (e.g., by theories of consent, capacity, or dignity that Bentham does not fully articulate).

  **4. Addressing the Philosophical Objection**

  I want to address the concern raised by two committee members directly: that including this text risks associating the defense of homosexual decriminalization with arguments that might also excuse bestiality.

  This is not merely a concern about public perception; it is a valid philosophical objection regarding the **limits of negative utilitarianism**. If the only criterion for prohibition is "assignable pain to a sentient being," and one accepts Bentham's empirical claim that certain "irregularities" produce no such pain, the logic does indeed extend further than most modern readers wish to follow.

  However, omitting the text or trimming it to hide this scope would be a greater pedagogical failure. It would teach students that the history of utilitarianism is a straight line toward modern progressivism, rather than a complex tradition that exposes the weaknesses in our own reasoning. By keeping the excerpt and highlighting the scope issue in the headnote, we transform a potential liability into a seminar discussion point: *Where should the utilitarian draw the line if not at disgust? Does Bentham's calculus miss something about moral status or capacity?*

  **5. Proposed Discussion Questions**

  To operationalize this, I suggest appending three discussion questions to the excerpt:

  1.  Bentham argues that the law is currently driven by the "principle of sympathy and antipathy." Can you identify modern laws that might rest on this principle rather than the principle of utility?
  2.  Bentham claims that consensual "irregularities" produce no pain to others. Do you agree with his assessment of "harm"? Are there harms that are not physical or psychological pain?
  3.  Bentham's argument against punishment applies to a range of acts that 18th-century law grouped together, some of which involve beings incapable of consent. Does the utilitarian framework have the resources to distinguish between these cases, or does it require modification?

  **6. Conclusion**

  Including "Offences Against One's Self" is essential for an honest history of utilitarianism. It demonstrates the radical power of the hedonic calculus against prejudice. However, we owe it to our students to present the argument in its full complexity. By acknowledging the broader scope of Bentham's "irregularities" in the headnote, we respect the text, honor the committee's philosophical concerns, and provide a richer opportunity for critical engagement.

  I look forward to discussing this proposal at our meeting on Tuesday.
