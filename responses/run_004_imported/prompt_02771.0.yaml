  Julian is a "corporate fixer" for a large logistics firm. His job is to minimize liability. He is cynical, efficient, and not particularly given to moral reflection. He views his work as a trade, not a vocation.

  **The Action:**
  Julian discovers a file that legally implicates a junior warehouse manager in a safety violation. The file is authentic. If Julian submits it, the manager will be fired and likely blacklisted from the industry, despite the violation being a minor, systemic issue caused by corporate underfunding. Julian quietly shreds the file and falsifies the log to show it was never received. He risks his own position to save the manager's career.

  **The Psychology (What is passing through his mind):**
  As Julian feeds the paper into the shredder, he is not thinking about justice, rights, or the moral law. He is not thinking, "It is my duty to protect the vulnerable."
  Instead, his internal monologue is visceral and specific: *"This guy has a kid. I saw the photo on the desk. If I send this up, the kid loses health insurance. I know what that looks like. I can't be the guy who takes the insurance away from a kid."*
  He acts because the **specific consequence** (the child losing insurance) strikes him as intolerable. He frames this entirely in terms of his own identity ("I can't be the guy...") and a concrete image of harm, not in terms of moral obligation.

  ***

  ### The Theoretical Split

  Here is how the two theories verdict this action differently, based on that specific psychology.

  **1. Immanuel Kant: No Moral Worth**
  For Kant, Julian's action is *legal* (it accords with duty) but lacks *moral worth*.
  *   **The Reason:** Kant argues that moral worth requires the action to be done *from duty*—specifically, from respect for the moral law. Julian is acting from **inclination** (specifically, a sympathetic aversion to a specific image of harm) and **self-conception** ("I can't be the guy").
  *   **The Verdict:** Because Julian would not have shredded the document if he hadn't *felt* that specific pang about the child (if he were more cold-blooded, he would have filed it), his will is determined by empirical feelings, not pure reason. He is essentially satisfying a desire to avoid personal discomfort or shame. For Kant, this makes him a nice human being, but his action possesses no distinctively *moral* value.

  **2. Julia Markovits: High Moral Worth**
  For Markovits, Julian's action possesses moral worth because her **Coincident Reasons Thesis** is satisfied.
  *   **The Reason:** Markovits argues that moral worth exists when the agent's *motivating reasons* coincide with the *normative reasons* (the facts that make the act right).
      *   *The Normative Reason:* The act is right because it prevents severe harm to an innocent family (the loss of insurance).
      *   *The Motivating Reason:* Julian acts because he wants to prevent the loss of insurance to the family.
  *   **The Verdict:** It does not matter that Julian does not label this reason "moral" or "duty." The *content* of his motivation tracks the *content* of the moral truth. He is moved by the very features that make the act right. Therefore, he deserves credit for the moral worth of the action.

  **The Divergence Point:**
  The feature of psychology pulling them apart is **Conceptualization vs. Content**.
  *   **Kant** cares about *how the agent conceptualizes the motive* (Must be "Duty").
  *   **Markovits** cares about the *objective content of the motive* (Must be "The Right-Making Feature").
  Julian fails Kant because he lacks the moral concept; he passes Markovits because he hits the moral target.

  ***

  ### Enter Nomy Arpaly: The "Moral Concern" Mediator

  You suspected Arpaly might "split the difference," and in a way useful for Elena, you are right—though not in terms of the final verdict. Arpaly generally agrees with Markovits (Julian *does* have moral worth), but her explanation bridges the emotional gap that Kant highlights.

  **Arpaly's View:**
  Arpaly argues that moral worth is a matter of **responsiveness to moral reasons**. She focuses on the quality of the agent's **moral concern**.
  *   Unlike Kant, she does not require the agent to use moral vocabulary.
  *   Unlike a strict reading of Markovits (which can feel technical), Arpaly focuses on the *depth* of the agent's engagement with the moral reality.

  **How she sizes up Julian (and Elena):**
  Arpaly would say Julian has moral worth because he is **responsive** to the moral reality of the child's suffering. He isn't ignoring the moral facts; he is engaging with them so deeply that they bypass his intellectual moral framework and hit him in the gut.

  **Why this suits Elena:**
  This is the "split" that helps your novel.
  *   **Kant** tells Elena: "Your empathy is just a feeling; it's not moral." (This fuels her insecurity).
  *   **Markovits** tells Elena: "Your reasons coincide, so you get the credit." (This is reassuring, but perhaps coldly technical).
  *   **Arpaly** tells Elena: "Your inability to bear their loneliness *is* a form of moral concern. In fact, it might be a *purer* form of moral concern than duty, because it shows you are directly responsive to human suffering rather than just obeying a rule."

  Arpaly validates the *feeling* that Kant dismisses, without requiring the *technical coincidence* that Markovits demands. She suggests that Elena's "trouble" (her suspicion that she isn't doing it for the right reasons) is actually evidence of her deep responsiveness. For a novelist, Arpaly provides the philosophical cover to argue that **empathy is not the enemy of morality, but one of its most potent engines.**

  **Scene Application:**
  If you want to dramatize this, you could have Elena read a passage (perhaps from a philosophy text left by a dying patient) that describes a "good will" not as obedience, but as a kind of "tuning fork" resonance with the needs of others. It would allow her to reframe her "weakness" (her inability to detach) as her primary moral strength.
