prompt: |-
  I've got a guest on my philosophy podcast next week who defends the buck-passing account of value against the wrong-kind-of-reasons problem, and his whole move is the object-given/state-given reasons distinction. Problem is, whenever someone raises a counterexample he just says 'that's a state-given reason in a trenchcoat' and moves on, which drives me a little nuts. Can you draft 8-10 interview questions that make that dodge progressively harder to pull off: at least one that makes him actually work through the classic demon-threatens-you-into-valuing-worthless-stuff case step by step rather then just naming it, one pressing on whether theres a non circular way to say what makes a reason 'object-given' in the first place, one built around the promising-to-admire-something case (which never seems to fall cleanly on either side of the line), and one asking whether the same distinction is meant to rescue evidentialism from pragmatic reasons for belief. Add a quick note after each on the reply he'll probably give, and close with a question about what would actually count as evidence against the distinction itself.
