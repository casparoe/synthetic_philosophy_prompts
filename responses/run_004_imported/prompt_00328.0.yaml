prompt: |-
  So I've been going down this rabbit hole reading about AI safety stuff online (not in school or anything, just my own late night research), and I keep getting stuck on this "shutdown problem" thing. Like, I get the basic pitch - you want an AI that will just let you turn it off if something goes wrong, instead of resisting because "I can't achieve my goals if I'm dead" type reasoning. But then I read that just bolting on a rule like "shut down when asked, no matter what" causes weird issues once the AI is a good enough expected-utility-maximizer, and that's where I get lost.

  Is the problem basically that any agent with consistent enough preferences will automatically start treating the shutdown button as just another variable to optimize over - like maybe it starts trying to influence whether it gets pressed, or spins up some helper process that doesn't care about the button at all? And is that why people talk about "utility indifference" as a patch, where you try to make the AI genuinely not care one way or the other about being shut off? I guess what I really want is some intuition for why this is such a deep problem rather than just an engineering annoyance - like why does wanting an agent to be both rational/coherent AND corrigible seem to be almost a contradiction in terms. Can you walk me through the guts of this without assuming I've read the actual papers?
