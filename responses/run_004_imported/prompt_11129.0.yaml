      *   **The WKR Problem:** The demon case. You have a reason to admire the mud (to avoid torture), but the mud isn't good/admirable. So, having a reason to favor $X$ doesn't seem sufficient for $X$ being good.
      *   **The Standard BP Defense:** Distinguish between *object-given reasons* (reasons grounded in the properties of the object) and *state-given reasons* (reasons grounded in the benefits of having the attitude). Only object-given reasons count for value.
      *   **The Critic's Counter:** How do you distinguish them without already presupposing value? If you say "object-given reasons are those that justify the attitude *correctly*," aren't you smuggling in the notion of "correctness" (i.e., value) to define the reasons? This is the *circularity* or *autonomy* objection.

