      *   **The Climax/Resolution:** Don't resolve it definitively (philosophy rarely does), but show the tension. Alex argues for a formal distinction; Jordan argues that formal distinctions rely on normative intuitions.

  5.  **Refining the Argument (Self-Correction during drafting):**
