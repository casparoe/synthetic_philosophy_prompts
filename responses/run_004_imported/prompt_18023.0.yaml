          *   Concept: **Lexical Taxonomies**. Scientific theories organize the world into kinds (categories).
          *   Concept: **The No-Overlap Principle**. In a functioning taxonomy, no kind term can overlap with another (a thing can't be both a swan and a goose in the same classification system).
          *   Concept: **The No-Crossing Principle**. Hierarchies must align.
          *   *Incommensurability defined:* When two theories carve up the world using taxonomies that violate these principles relative to each other.

      *   **Part 3: Why Translation Fails (The Core Argument):**
          *   It's not that we can't understand the *other* scientists. We can learn their language (bilingualism).
