      *   *Key Later Texts:* "Second Thoughts on Paradigms" (1974), "The Road Since Structure" (1990/2000), various essays collected in *The Road Since Structure*.
      *   *Core Concept:* Incommensurability.
      *   *The Shift:* From "Gestalt Switch/World Change" (1962) to "Lexical Taxonomy/No Overlap Principle" (1980s/90s).
      *   *Why the Shift?* Criticisms of irrationalism, relativism, and the claim that communication is impossible. Kuhn wanted to show communication *is* possible, but translation *is not*.
      *   *The Mechanism:* Taxonomic structures, kind terms, no-overlap principle.
      *   *The Consequence:* Localized failure of translation, not global failure of understanding.

  3.  **Drafting the Explanation - Section by Section:**

      *   **Introduction:** Acknowledge the debate. Validate both sides (the 1962 text *does* sound like the friend's view, but the user is right about the later shift). State the thesis: Kuhn moved from a perceptual/world-change model to a linguistic/taxonomic model.

      *   **Part 1: The "Vulgar" 1962 Reading (The Friend's View):**
