      *   *Adjustment:* Frame it as him recognizing the *structural instability* of collective reason, rather than the specific Boolean logic. He'd see it as another instance of "the whole is less rational than the parts."
      *   *Refining the 1793 angle:* The 1793 plan was never adopted because the Jacobins took over. But his drafts show a concern for protecting rights against the "general will" if it's irrational. This supports Premise-based (rights/logic as constraints).

  6.  **Final Polish:**
