answer: |-
  **Subject:** Recommendation: 2024 Animal Allocation (Chicken vs. Shrimp)

  **To:** The Donor Circle
  **From:** [Your Name]
  **Date:** October 26, 2024

  Hi everyone,

  As the person tasked with breaking the tie on this year's animal welfare pot, I've spent the last week re-reading the Rethink Priorities reports, looking at the corporate campaign metrics, and thinking about why this specific disagreement has us so stuck.

  Given that our group literally formed out of a bar fight about the Repugnant Conclusion, it is deeply appropriate that we are now deadlocked on a classic population ethics problem: **High Confidence × Moderate Scale** (Chickens) vs. **Low Confidence × Massive Scale** (Shrimp).

  Camp A says we should fund what we know hurts.
  Camp B says we should fund where the expected suffering is highest, even if the probability is fuzzy.
  Camp C says Camp B's math is a trap that leads to Pascal's Mugging, and if we fund based on "tiny probability × huge number," we lose the ability to say no to anything.

  I'm not going to recommend we commission more research (we don't have time) and I'm not going to recommend a lazy 50/50 split. We need a decision rule that we can live with next year.

  Here is my recommendation: **We allocate 75% ($3,000) to the mainstream chicken welfare campaign and 25% ($1,000) to the shrimp stunning intervention.**

  Below is the reasoning. I want to be clear about why I'm weighting it this way, because it's not a compromise; it's a specific stance on how to handle moral uncertainty in a small, informal fund.

  ### 1. The Case for Discounting Uncertain Sentience (Addressing Camp A & C)
  Camp A and Camp C are right about one thing: **Epistemic risk is real.**

  In a perfect Expected Value (EV) world, we just multiply probability by impact. But in the real world, especially with a small, one-off pot like ours, we have to account for the risk that our model is wrong. If we send $4k to shrimp stunning and it turns out crustaceans have no capacity for valenced experience, we have achieved *nothing*. If we send it to chickens and it turns out we overestimated hen sentience, we have still likely improved conditions for a vertebrate species that almost certainly suffers.

  This is the "robustness" argument. For a fund our size, the marginal utility of "being safely effective" is higher than the marginal utility of "theoretical maximization." We are not the Open Philanthropy Project; we are a meetup group. We can't afford to be wrong on the biology.

  So, to answer the prompt directly: **Uncertain sentience should get weight, but it must be discounted for epistemic risk.** We cannot treat a 5% credence in shrimp sentience the same as a 95% credence in chicken sentience, even if the numbers multiply out similarly. We apply a "confidence tax."

  ### 2. The Case Against Zeroing Out Shrimp (Addressing Camp B)
  However, Camp B is right that ignoring the numbers entirely is morally dangerous.

  If there is even a 1% chance that shrimp are sentient, the sheer scale of aquaculture means the amount of suffering at stake dwarfs terrestrial farming. To ignore that completely because we aren't "sure" is a form of moral cowardice. It's prioritizing our own comfort (knowing we did the "safe" thing) over the potential relief of massive amounts of suffering.

  Furthermore, this is **not** a Pascal's Mugging.
  A Pascal's Mugger asks you to pay them $5 because they claim to be able to simulate 3^^^^^3 people in a matrix. The probability is arbitrarily low because the claim is magically disconnected from reality.
  Shrimp are not magic. They are farmed by the billions. They have nervous systems. They exhibit avoidance behaviors. The uncertainty here is empirical (do they *feel*?), not metaphysical (can they *exist*?).
  Camp C worries that funding this opens the door to "funding literally anything." It doesn't. It opens the door to funding interventions where we have **biological plausibility + massive scale + concrete intervention.** That is a narrow door, not a wide one.

  ### 3. The Decision Rule: "Portfolio Theory for Moral Uncertainty"
  So, how do we reconcile this for *this* allocation?

  We should treat this pot like an investment portfolio, not a binary bet.
  *   **The Core Holding (Chicken):** This is our bond index. It's low volatility, high confidence, reliable return. This ensures that no matter what, our money does *some* good. This addresses the "robustness" concern.
  *   **The Venture Allocation (Shrimp):** This is our high-risk equity. It might go to zero (if shrimp aren't sentient), but the upside is massive. By capping it at 25%, we limit our exposure to the "Mugging" risk while still buying a call option on the possibility that invertebrate welfare is the cause of the century.

  ### 4. The Verdict
  **$3,000 to the Corporate Chicken Welfare Campaign.**
  **$1,000 to the Shrimp Stunning Intervention.**

  **Why this split?**
  *   **For Camp A:** You get the majority of the funds going to a cause with near-certain moral value. The group's primary impact is secure.
  *   **For Camp B:** You get a concrete signal that the group accepts the EV argument for invertebrates. $1k is enough to actually fund a slice of the intervention, not just a token gesture.
  *   **For Camp C:** The "Mugging" is contained. We are explicitly stating that uncertain sentience gets discounted heavily (by 75% relative to the chickens) and that we will not go "all in" on speculative math in a small fund.

  ### Closing
  Three years ago, we fought about the Repugnant Conclusion because we were worried about the implications of pure math on human intuition. Now we're fighting because the math is telling us to fund shrimp, and our intuition is screaming that it's absurd.

  The truth is probably in the middle. The math isn't wrong, but it's fragile. The intuition isn't wrong, but it's biased toward vertebrates.

  By splitting the pot 75/25, we acknowledge that while the *numbers* favor the shrimp, the *epistemic ground* favors the chickens. Let's keep the circle intact, keep the money moving, and revisit the credence thresholds next year.

  Let me know if anyone has hard objections to the mechanics of the transfer, otherwise I'll initiate the grants on Tuesday.

  Best,

  [Your Name]
