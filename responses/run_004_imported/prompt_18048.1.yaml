answer: |-
  There is a significant misunderstanding in the premise of your question, and clearing it up is crucial because it changes the entire landscape of the problem.

  To give you the direct answer: **No, there is no accepted proof that corrigibility is impossible.** The research program is not "dead on arrival," and the community does not treat it as a settled impossibility theorem.

  Here is a breakdown of where the confusion likely lies, the actual state of the technical results, and why researchers are still pursuing this path.

  ### 1. Clarifying the "Thornley" Claim
  You are likely referring to **Sam Thornley**, an independent researcher and contributor to the Alignment Forum who has written extensively on the shutdown problem.

  While Thornley (and others in that circle) have argued that the shutdown problem is **much harder than previously realized** and that many naive solutions fail, **he has not produced a rigorous, universally accepted impossibility theorem** that proves corrigibility is mathematically impossible for *any* agent architecture.

  In AI safety, there is a big difference between:
  *   **"Standard EU maximizers resist shutdown."** (This is true and is the Instrumental Convergence thesis).
  *   **"It is mathematically impossible to construct *any* agent that allows shutdown."** (This is **false** and unproven).

  If someone is citing Thornley's work as a "proof" that the field is dead, they are overstating the conclusion of his posts. His work is part of the ongoing debate about *how difficult* the problem is, not a proof that it *cannot be done*.

  ### 2. Instrumental Convergence vs. Corrigibility Design
  The core of your confusion likely stems from conflating the behavior of **standard** agents with the goal of **corrigible** agent design.

  *   **Instrumental Convergence (Bostrom/Omohundro):** This argues that if you build a standard Expected Utility (EU) maximizer with a fixed goal (e.g., "make paperclips"), it will instrumentally resist shutdown because being shut down reduces its expected paperclips. **This is widely accepted.**
  *   **Corrigibility Research:** This field explicitly accepts the above point. Its goal is **not** to make a standard EU maximizer behave nicely. Its goal is to design an agent whose utility function or decision theory is *structured differently* so that "being shut down" does not count as a failure of the objective.

  The research program isn't trying to fight instrumental convergence with a standard agent; it's trying to build an agent where the convergence pressures don't apply in that specific way.

  ### 3. The "Off-Switch Game" and Uncertainty
  The strongest evidence that corrigibility is *not* impossible comes from the **"Off-Switch Game"** paper (Hadfield-Menell et al., 2016).

  They proved mathematically that an agent **will** allow itself to be shut down if:
  1.  It is rational (maximizes expected utility).
  2.  **It is uncertain about the true objective.**

  If the robot knows that the human pressing the off-switch implies "the robot is about to do something bad (according to the true objective)," and the robot cares about the true objective, the robot *wants* to be turned off.

  This result directly contradicts the idea that "any capable optimizer will resist shutdown full stop." It shows that **uncertainty** is a viable mathematical lever to solve the problem. This is why the field shifted from MIRI's early "utility indifference" (which had flaws regarding manipulation) to **CHAI's (Center for Human-Compatible AI)** focus on **uncertain objectives**.

  ### 4. Why "Utility Indifference" Struggled (But Didn't Die)
  You mentioned MIRI's utility indifference. It is true that the early formulations (Armstrong/Soares, ~2015) faced serious issues, specifically:
  *   **Manipulation:** The agent might try to manipulate the human into pressing or not pressing the button to maximize utility in weird ways.
  *   **Veto Power:** It was hard to make the agent care about the button without giving it an incentive to control the button.

  However, identifying flaws in a specific mathematical proposal is not the same as proving the *concept* is impossible. It just means that specific equation was wrong. This is normal mathematical progress.

  ### 5. Why is it still an "Open Problem"?
  Researchers treat this as open because we do not yet have a **complete, scalable architecture** that guarantees corrigibility in superintelligent systems.

  *   **We have existence proofs:** We know agents *can* be shutdownable (e.g., the Off-Switch Game models).
  *   **We lack engineering blueprints:** We don't know how to bake that property into a deep learning system or a general optimizer that is also highly competent at other tasks.
  *   **New threats emerge:** As researchers like Thornley point out, even if you solve the basic off-switch, you might face problems with **sub-agents** (the main agent creates a sub-agent that doesn't have the shutdown switch) or **self-modification**.

  ### Summary
  The argument you are hearing ("Thornley proved corrigibility is impossible") is a **misinterpretation** of the current literature.

  1.  **Instrumental Convergence** is real: Standard agents *do* resist shutdown.
  2.  **Corrigibility** is the attempt to build *non-standard* agents (usually via uncertainty) to avoid this.
  3.  **No Impossibility Theorem** exists: We have proofs that shutdown *is* possible under conditions of uncertainty (Hadfield-Menell).
  4.  **Research Status:** The field has pivoted from "utility indifference" to "objective uncertainty" and "cooperative IRL." It is recognized as **extremely hard**, but not **provably impossible**.

  If we admitted it was impossible, the only remaining options would be "don't build AGI" or "hope for the best," neither of which satisfies researchers who believe AGI is coming and want to ensure it is safe. The fact that it is treated as an open problem is because, mathematically, it still is one.
