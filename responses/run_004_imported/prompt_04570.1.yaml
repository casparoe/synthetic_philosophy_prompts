      *   **Features:** Secret (no one else knows), No reliance (grandma dies, can't rely on it practically), No harm (no one else cares about orchids), No social institution policing (no convention undermined publicly), Promisor is the only one left who knows.
      *   **Intuition:** Most people feel bound anyway. It's a moral obligation despite the lack of external consequences.

  3.  **Evaluate Each Theory against the Case:**

      *   **Hume/Rawls (Conventionalist/Practice):**
          *   *Core:* Promises obligate because there is a social practice/convention that is useful. Breaking undermines the practice.
          *   *Problem with Case:* If no one knows, the practice isn't undermined. Utility isn't decreased. Hume famously struggled with secret promises. Rawls tries to fix it with "fair play," but if no one knows you participated, did you take advantage?
          *   *Rating:* Poor fit. This is the classic counter-example to conventionalism.

      *   **Thomson (Reliance):**
          *   *Core:* A promise is an invitation to rely. Obligation stems from the harm/wrong of disappointing reliance.
          *   *Problem with Case:* Grandma is dead. She can't rely. No one else relies. No harm occurs if orchids die (by stipulation).
          *   *Rating:* Very Poor fit. This theory usually fails secret/deathbed cases unless stretched significantly (e.g., reliance on the *idea* of you), but strictly speaking, reliance requires a relying agent.

      *   **Gilbert (Joint Commitment):**
          *   *Core:* Promise creates a "plural subject." Both parties are bound together.
          *   *Problem with Case:* Requires a joint commitment. Once one party (grandma) dies, can the joint commitment persist? Gilbert argues the commitment survives the death of the promisee because the commitment itself is a normative entity created jointly. However, some critics argue that without the other party to hold you to it, the "jointness" dissolves. But Gilbert specifically addresses this and argues the obligation remains because the commitment was *created* jointly, even if one party exits.
          *   *Rating:* Good fit, but slightly metaphysical. It handles it better than reliance/convention, but some find the "ghost of the promisee" aspect tricky.

      *   **Scanlon (Assurance/Principle F):**
          *   *Core:* Wrong to break because you invited expectations and gave assurance, violating the principle of fidelity.
          *   *Problem with Case:* Scanlon's Principle F relies on inducing expectations. If the person is dead, do they have expectations? Scanlon argues the wrong is against the *principle* and the assurance given, not necessarily the ongoing mental state of the promisee. However, critics argue that without the possibility of disappointment or loss of trust *by the promisee*, the force weakens. Still, Scanlon tries to ground it in the wrongness of manipulating expectations created.
          *   *Rating:* Moderate/Good. Better than reliance, but still tied to the interpersonal expectation dynamic which is severed by death.

      *   **Owens (Authority-Interest):**
          *   *Core:* We have an interest in having authority over others' actions. Promising transfers this authority.
          *   *Problem with Case:* Owens explicitly designs his theory to handle this. The promisee has an interest in having the authority *while alive* to direct your future actions. Even if they die, the transfer of authority happened. The wrong is violating the authority granted.
          *   *Rating:* Very Strong. Owens specifically targets the "interest in authority" distinct from welfare or reliance.

      *   **Raz (Normative Power):**
          *   *Core:* Promising is exercising a power to change normative positions. It's valuable for autonomy.
          *   *Problem with Case:* Raz focuses on the power to bind oneself. If I exercise the power, I am bound. The value lies in the capacity to shape my own normative world. The death of the promisee doesn't necessarily undo the exercise of the power, though Raz acknowledges the role of the promisee in accepting the obligation.
