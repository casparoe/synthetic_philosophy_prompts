          *   Can Cummins fix permissiveness without history? Perhaps by appealing to *systemic organization* (what counts as a component vs. noise). But this often leads back to selection or autopoiesis.
          *   Can Wright fix exaptation without current contribution? No. The definition of exaptation *is* current utility without history.
      *   *Conclusion:* Wright handles the permissiveness problem better inherently. Cummins handles exaptation better inherently. However, Wright's account is generally seen as more successful at defining *biological* function specifically, whereas Cummins defines *systemic* function.
      *   *Refining the "On Balance":* The prompt asks which handles *these two problems* better.
