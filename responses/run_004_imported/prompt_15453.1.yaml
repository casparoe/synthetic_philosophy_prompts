answer: |-
  To compare Larry Wright's etiological account and Robert Cummins's causal-role account, we must examine the specific logical mechanics each employs to assign functions, rather than relying on intuitive case verdicts. Wright defines function via **historical consequence** (selection), while Cummins defines it via **current causal contribution** (systemic analysis). The central question is whether the structural flaws inherent in these mechanics—permissiveness for Cummins and historical lag for Wright—can be resolved using only the resources internal to each theory.

  ### 1. The Mechanics of Cummins's Causal-Role Account
  Cummins's theory analyzes a system $S$ possessing a capacity $C$. A trait $X$ has the function $F$ iff $X$ has the capacity to $F$, and $F$ contributes to the explanation of $C$.
  *   **Mechanism:** Functional ascription is relative to an *analytical explanation*. There is no single "true" analysis; functions are assigned relative to the capacity the theorist wishes to explain.
  *   **The Permissiveness Problem:** The mechanics allow *any* causal effect that figures in *any* valid analysis to count as a function. In the case of the heart sound, if the containing system is defined as "the clinical diagnostic network" and the capacity is "diagnosing arrhythmia," the heart's sound causally contributes to that capacity. Mechanically, the theory validates this as a function.
  *   **Internal Repair Attempt:** To block this, Cummins must restrict the legitimate "containing systems" or "capacities." He might argue that only the *organism* is the relevant system, or only *biological* capacities count. However, within Cummins's mechanics, "organism" is merely a spatial boundary, and "biological capacity" is undefined. Without an external normative filter, there is no mechanical reason to privilege the capacity "circulating blood" over "making sounds for doctors." Both are causal contributions of the heart within different system descriptions.
  *   **Failure to Repair:** To restrict the analysis non-arbitrarily, Cummins needs a principle that distinguishes *functional* contributions from *incidental* ones. But his theory is designed precisely to avoid such distinctions (reducing function to causal role). Any attempt to privilege biological systems over diagnostic systems smuggles in a normative distinction (e.g., "survival matters more than diagnosis") that Cummins's causal mechanics cannot generate on their own. To fix this, he effectively needs to import Wright's historical constraint (i.e., the system is the one preserved by selection), which violates the constraint of not borrowing from the rival.

  ### 2. The Mechanics of Wright's Etiological Account
  Wright defines function via a historical feedback loop: $X$ has function $F$ iff (1) $X$ is there *because* it does $F$, and (2) $X$ does $F$.
  *   **Mechanism:** Functional ascription is an explanation of *presence*. The "because" is cashed out through natural selection: the trait proliferated or was maintained because it conferred the fitness advantage $F$.
  *   **The Exaptation Problem:** If a trait is co-opted for a new use (e.g., feathers for flight) before selection has acted on that use, condition (1) fails. The feathers are not there *because* of flight; they are there because of insulation. Furthermore, if a trait serves both an ancestral and a new role, Wright's schema implies the function is determined by the selective history that explains the trait's *current* presence. If the history is mixed, the function is disjunctive; if the history is purely ancestral, the new use is merely a "use," not a function.
  *   **Internal Repair Attempt:** Wright can refine the "because" clause without abandoning etiology. Instead of focusing on the *origin* of the trait type (which creates the lag problem), the theory can focus on the *maintenance* of the trait. If a trait is currently being selected for a new role, it is "there because" of that role, even if it originated for another. This is the "Modern History" modification (associated with Godfrey-Smith).
  *   **Success of Repair:** This adjustment remains strictly within etiological mechanics. It still requires *selection*, not just causal contribution. Therefore, it solves the "long co-option" problem (where selection has shifted) without collapsing into Cummins's view. Regarding the "short co-option" problem (instant new use), Wright can consistently maintain that these are *uses*, not *functions*, until selection acts. While this clashes with some intuitions, it is not a mechanical failure; it is a consistent application of the theory's core distinction between *normative function* and *mere utility*. Wright's mechanics allow him to distinguish between the two, whereas Cummins's mechanics force him to conflate them.

  ### 3. Comparative Evaluation
  On balance, **Wright's account handles these problems better**, primarily because its structural flaws are amenable to internal refinement, whereas Cummins's are structural dead-ends.

  1.  **Severity of the Flaw:** Cummins's permissiveness is a category error. By making function relative to *any* analysis, the theory loses the ability to distinguish biological functions from accidental effects ontologically. It makes function observer-relative in a way that undermines biological realism. Wright's exaptation problem is a boundary condition. It creates a temporal lag between "useful" and "functional," but it preserves the crucial distinction between malfunction (breaking the norm) and mere inefficiency.
  2.  **Repairability without Borrowing:**
      *   **Cummins:** Cannot repair permissiveness internally. To exclude the heart sound, he must privilege the "biological system." But without history, "biological system" has no mechanical definition within causal-role theory other than "the system we care about." To define it objectively, he needs selection history (Wright's resource) or organizational closure (a third theory).
      *   **Wright:** Can mitigate the exaptation problem internally. By shifting the historical window from *origin* to *maintenance*, Wright accounts for traits that have been co-opted and stabilized by new selective pressures. For the immediate co-option case (no selection yet), Wright does not need to borrow from Cummins; he simply holds the line that function requires normativity, which requires history. This is a theoretical cost, but not a mechanical inconsistency.

  ### Conclusion
  Wright's etiological account is superior on balance because its mechanics provide a non-arbitrary filter (selection) that Cummins lacks. Cummins's theory fails to solve the permissiveness problem without importing a normative constraint it cannot generate, effectively requiring Wright's historical resources to define the "relevant system." Wright, conversely, can address the exaptation problem by refining the temporal scope of the selective history (origin vs. maintenance) without needing to adopt Cummins's ahistorical causal contribution as a sufficient condition for function. Thus, Wright's account is more self-contained and robust against the specific charges raised.
