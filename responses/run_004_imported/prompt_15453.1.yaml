      *   *Final Verdict:* Wright is better on balance because the exaptation problem is a matter of *degree* (how much history?), whereas the permissiveness problem is a matter of *kind* (anything can be a function). Wright can solve the degree problem by refining the historical account (e.g. Millikan's proper functions or Godfrey-Smith's modern history) without needing causal-role. Cummins cannot solve the kind problem without importing a normative filter (like history).

