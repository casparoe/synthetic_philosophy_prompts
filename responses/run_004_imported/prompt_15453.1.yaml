      *   *Decision:* Wright's account is more robust because the "exaptation" issue is a boundary condition of history, whereas Cummins's "permissiveness" is a structural flaw in the definition of relevance. Wright can adjust the historical window (maintenance vs. origin) without invoking causal-role. Cummins cannot restrict relevance without invoking history or organization (which is distinct).
