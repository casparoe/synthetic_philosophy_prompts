      *   **Evaluation:** Which account handles these problems better *on balance*?
      *   **Constraint:** Can either be repaired without borrowing resources from the rival?
      *   **Methodological Requirement:** Engage with the *actual mechanics* of each theory, not just pretheoretic verdicts.

  2.  **Analyze Wright's Etiological Account (Selected-Effects):**
      *   *Core Mechanism:* $X$ has function $F$ iff (1) $X$ is there *because* it does $F$, and (2) $X$ does $F$. This "because" is cashed out in terms of natural selection (historical consequence).
      *   *Strength:* Normativity. It distinguishes between what a trait *does* and what it is *supposed* to do (malfunction is possible). It blocks the "heart sound" problem because heart sounds didn't cause the heart's proliferation via selection.
      *   *Weakness (Exaptation):* If a trait is co-opted (e.g., feathers for flight, originally for insulation), it doesn't have the function "flight" etymologically until selection acts on it for flight. But intuitively, once co-opted, it *has* that function. Also, the "how much history" problem: if a trait serves two roles (ancestral and new), which is the function? Wright's schema requires the trait to be there *because* of the effect. If it's there because of $A$, but now does $B$, does it have function $B$? Wright says no, not until selection shifts.
      *   *Mechanics:* Relies on historical explanation. $X$ exists now $\leftarrow$ $X$ existed before $\leftarrow$ $X$ conferred fitness advantage $F$.

  3.  **Analyze Cummins's Causal-Role Account:**
      *   *Core Mechanism:* Function is relative to an analytical explanation of a capacity. $X$ has function $F$ in system $S$ iff $X$ has the capacity to $F$ and $F$ contributes to the explanation of a higher-level capacity $C$ of $S$.
      *   *Strength:* Handles exaptation immediately. If feathers contribute to flight capacity, they have the function of flight in the analysis of flight, regardless of history. Handles systemic interdependence well.
      *   *Weakness (Permissiveness):* Anything that contributes to *any* capacity in *any* analysis counts. The heart makes a sound; a doctor uses that sound to diagnose; therefore, in the analysis of "medical diagnostic system," the heart's function is to make a sound.
      *   *Mechanics:* Relies on current causal contribution within a hierarchical system analysis. No history required.

  4.  **Evaluate the "Too Permissive" Problem (Cummins):**
      *   *The Charge:* Heart sounds count as functions in a diagnostic analysis.
      *   *Cummins's Defense (Mechanics):* Cummins explicitly restricts functions to *analytical* explanations. An analytical explanation breaks a capacity down into sub-capacities. The key is: Is the analysis *legitimate* or *explanatorily relevant*?
      *   *Can it be repaired internally?* Cummins appeals to "explanatory interest." But this is pragmatic, not ontological. To fix it *without* Wright's history, Cummins needs a constraint on what counts as a "containing system" or a "capacity." If the system is "the organism," heart sounds don't contribute to organismic capacities (survival/reproduction) directly. If the system is "organism + doctor," it does.
      *   *Repair Attempt:* Restrict the "containing system" to the biological organism (or a proper biological subsystem) and the "capacity" to biologically significant capacities (homeostasis, reproduction).
      *   *Problem:* This smuggles in teleology or biology-specific norms without history. Why is the organism the privileged system? Why is reproduction the privileged capacity? Without selection history, this looks arbitrary.

  5.  **Evaluate the "Exaptation" Problem (Wright):**
      *   *The Charge:* Feathers used for flight (but selected for insulation) lack the function of flight on Wright's view until selection acts. Also, the "ancestral vs. new" ambiguity.
      *   *Wright's Defense (Mechanics):* Wright is strict. Function *is* historical. If it hasn't been selected, it's not a function, it's just a use.
      *   *Can it be repaired internally?* Wright could argue that selection acts quickly, or that "presence" is maintained by current selection. But the prompt highlights the *lag* problem.
      *   *Repair Attempt:* Modify the "because" clause. Instead of "origin of the trait," focus on "maintenance of the trait." (This moves toward Godfrey-Smith's Modern History account).
      *   *Problem:* This still requires *some* history. It doesn't solve the *instant* co-option case. To solve the instant case, Wright needs to look at current contribution... which is Cummins's territory.
      *   *Ambiguity (Ancestral vs. New):* If a trait is maintained by selection for *both* insulation and flight, Wright's account allows multiple functions. If it's maintained for insulation but *used* for flight, Wright denies the flight function. This is a feature, not a bug, for Wright, but clashes with intuition. To fix the intuition without history, he needs current contribution criteria.

  6.  **Compare and Weigh:**
      *   *Cummins:* Fails to distinguish function from accidental effect *ontologically*. It relies on pragmatic constraints on analysis. The "heart sound" case is only blocked if we stipulate the system boundary. But stipulating the system boundary without history is hard.
      *   *Wright:* Fails to capture *current* utility as function (exaptation). It creates a lag between "useful" and "function." However, it successfully grounds the normativity (malfunction).
