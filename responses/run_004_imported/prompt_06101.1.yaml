prompt: |-
  Next month our department's colloquium series has a decision theorist visiting, and I somehow got roped into running the Q&A afterward. She's spent basically her whole career defending resolute choice as the right answer to Parfit's hitchhiker case -- the one where your dying of thirst in the desert and the only driver willing to take you into town is someone who can somehow tell in advance whether you'll actually pay him once you're safe, so being "rational" about your own self-interest ends up requiring you to become disposed to do the very thing that, once you're safely in town, is no longer in your interest at all. I've been re-teaching the relevant bits of Reasons and Persons in my grad seminar this term, and I'm pretty sure Parfit's own label for this was something like "rational irrationality" -- her whole line, as I understand it, is that any theory of practical rationality which only ever grades individual acts one at a time, rather than policies or standing dispositions, is simply going to fail on cases like this one.

  I sat in on her job talk years ago and she's very smooth at deflecting the obvious first-pass objections, so I'd like the Q&A to go further than her stock presentation. Could you draft me 8 to 10 questions that really lean on the position? I want at least one that makes her say something precise about the moment the hitchhiker actually hands over the cash: does she think the *act* of paying is itself rational, or only that becoming the sort of person who'd do it was rational, and if those come apart, which one gets to keep the name "rational"? I'd also like a question tying her view back to Gauthier's constrained maximization, forcing her to say plainly whether resolute choice is just that idea dressed up differently or is doing genuinely new work. And throw in something on the standard causal-decision-theory comeback -- that the driver is basically an unfair predictor and you shouldn't judge a theory of rationality by how it fares in a world custom-built to punish it -- plus, if you can work it in, a question on how her view is even supposed to differ from the "functional decision theory" people, who I gather want to claim the hitchhiker case for themselves too with a totally different apparatus. For each question, add a short follow-up keyed to whatever answer she'd most plausibly give, the kind of pushback you'd actually give her live, not just the next question on a list.
reasoning: |-
  Here's a thinking process that leads to the suggested Q&A questions:

  1.  **Analyze the Request:**
      *   **Context:** Department colloquium, visiting decision theorist.
      *   **Topic:** Resolute Choice vs. Parfit's Hitchhiker (from *Reasons and Persons*).
      *   **Speaker's Stance:** Defends resolute choice (RC) as the solution to Hitchhiker. Argues act-by-act evaluation fails; policies/dispositions are key.
      *   **User's Goal:** Run the Q&A. Wants 8-10 tough questions that go beyond stock objections.
      *   **Specific Requirements:**
          *   One question on the *moment of payment* (act vs. disposition rationality).
          *   One question on Gauthier's Constrained Maximization (CM) comparison.
          *   One question on Causal Decision Theory (CDT) "unfair predictor" objection.
          *   One question on Functional Decision Theory (FDT) comparison.
          *   Format: 8-10 questions, each with a specific follow-up/pushback based on plausible answers.
          *   Tone: Academic, sharp, knowledgeable (grad seminar level), respectful but challenging.

  2.  **Deconstruct the Philosophical Landscape:**
      *   **Parfit's Hitchhiker:** Agent in desert. Driver predicts if Agent will pay. If predicts "no," leaves Agent. If predicts "yes," takes Agent. Once in town, paying is costly and provides no further benefit. CDT says don't pay (dominated). EDT/RC/FDT says pay (to ensure pickup).
      *   **Resolute Choice (McClennen, etc.):** Rationality involves sticking to a plan even when future selves would deviate. It's about dynamic consistency.
      *   **Gauthier's Constrained Maximization:** Disposed to cooperate if others are similarly disposed. Distinct from RC? Gauthier focuses on the *disposition* being utility-maximizing, whereas RC often focuses on the *choice* itself being rationalized by the plan.
      *   **CDT Objection:** The prediction happens in the past. My current choice cannot causally affect the past prediction. Therefore, paying is irrational. The setup is "unfair" to CDT.
      *   **FDT (Yudkowsky/Soares):** Decision depends on the output of the decision algorithm. If the algorithm outputs "pay," the predictor (simulating the algorithm) predicts "pay."
      *   **The "Rational Irrationality" Label:** Parfit discusses how being disposed to do something irrational (paying) leads to better outcomes. The visitor argues RC makes it *actually* rational, not just "rationally irrational."

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: The Moment of Payment.*
          *   Draft: When you hand over the cash, is that act rational?
          *   Refinement: Need to press the distinction between *ex-ante* rationality (adopting the plan) and *ex-post* rationality (executing the node). If they come apart, what does "rational" mean?
          *   Follow-up: If she says the act is irrational but the plan is rational, press on the normativity. Why follow an irrational act?

      *   *Requirement 2: Gauthier.*
          *   Draft: Is this just Gauthier?
          *   Refinement: Gauthier justifies the disposition via expected utility at the formation stage. RC often claims the *choice* at the node is rational. What's the metaphysical difference?
          *   Follow-up: If she says it's different, press on whether RC smuggles in teleology.

      *   *Requirement 3: CDT/Unfair Predictor.*
          *   Draft: CDT says the predictor is unfair.
          *   Refinement: CDT argues that rationality shouldn't be judged by cases where the world puns on truth-telling. Is RC just changing the definition of rationality to win the game?
          *   Follow-up: If she says CDT loses money, ask if money is the only metric of rationality.

      *   *Requirement 4: FDT.*
          *   Draft: How is this different from FDT?
          *   Refinement: FDT uses subjunctive dependence/logical correlation. RC uses temporal consistency of will. Do they yield different verdicts in *modified* Hitchhiker cases?
          *   Follow-up: If she says they agree, ask why we need the RC machinery.

      *   *Filling the rest (aiming for 8-10 total):*
          *   *Idea 5: Regress/Infinite Plan.* To be resolute, do you need a prior plan to be resolute? (McClennen's regress problem).
          *   *Idea 6: Self-Prediction.* The driver predicts *you*. If RC is about changing your disposition, does the driver predict the *real* you or the *resolute* you? (Transparency issue).
          *   *Idea 7: Diachronic Agency.* Does RC require a metaphysical view of the self as a single entity over time? What if preferences shift genuinely?
          *   *Idea 8: The "Toxin Puzzle" variant.* Hitchhiker is about reward. Toxin is about intention. Does RC solve Toxin? If not, why treat Hitchhiker differently?
          *   *Idea 9: Normative Force.* Where does the binding force come from? Is it pragmatic or constitutive of agency?
          *   *Idea 10: Learning/Updating.* If I know I'm resolute, do I update on my own future behavior as evidence? (Evidential vs. Causal).

  4.  **Refining and Polishing:**
      *   Ensure the tone is appropriate for a grad seminar/colloquium (technical but conversational).
      *   Make sure the follow-ups are "live" pushbacks, not just "What about X?"
      *   Check against the prompt's specific request for "Rational Irrationality" phrasing.
      *   Ensure the Gauthier and FDT distinctions are sharp.

      *(Self-Correction during drafting)*: I need to make sure I don't confuse Resolute Choice (McClennen) with Precommitment. Resolute choice is specifically *not* precommitment (no external binding); it's internal willpower. I need to make sure the questions reflect that internalism.
      *   *Correction on Q1:* Focus on the *normative status of the node*.
      *   *Correction on Q2:* Focus on the *source* of rationality (disposition vs. plan).
      *   *Correction on Q4:* FDT is logical; RC is temporal/volitional. Press the difference.

  5.  **Final Review against Constraints:**
      *   8-10 questions? Yes.
      *   Specific question on moment of payment? Yes (Q1).
      *   Specific question on Gauthier? Yes (Q3).
      *   Specific question on CDT/unfairness? Yes (Q5).
      *   Specific question on FDT? Yes (Q4).
      *   Follow-ups for each? Yes.
      *   Tone check: Sharp, knowledgeable.

  6.  **Final Polish:** (Writing the response with the appropriate academic register). *Make sure to mention Parfit's "Rational Irrationality" explicitly in the intro or Q1 context.* *Ensure the distinction between act-evaluation and policy-evaluation is clear.*

      *(Wait, one detail check)*: The prompt mentions the user is re-teaching *Reasons and Persons*. Parfit's discussion is crucial. Parfit distinguishes between Self-Interest Theory (S) and Common-Sense Morality (CS) or Critical Present-aim Theory (P). In the Hitchhiker case, S seems to recommend being disposed to pay but not actually paying. Parfit calls this "Rational Irrationality." The visitor claims RC solves this by making the payment rational. I need to make sure Q1 hits this hard.

      *(Another detail check)*: Gauthier's *Morals by Agreement*. Constrained Maximization vs. Straightforward Maximization. Gauthier says it's rational to *be* a CM, but does he say it's rational to *act* as a CM at the node where defection pays? This is the classic critique of Gauthier (the "rationality of compliance" problem). RC tries to solve this. Q3 needs to highlight this.

      *(FDT check)*: FDT (Miracle-Decision-Theory/Updateless) treats the decision as a logical output. RC treats it as a volitional commitment. If the predictor is a perfect simulator, FDT works. If the predictor is a brain scanner reading "dispositions," RC might work differently. Need to press on the *mechanism* of correlation.

      *Okay, ready to generate.*
answer: |-
  Here are 10 questions designed to press the structural weaknesses of Resolute Choice (RC) while hitting the specific comparative points you requested. They are ordered to build pressure, starting with the metaphysics of the choice itself and moving outward to comparisons with rival theories.

  ### 1. The Normative Status of the Node
  "In Parfit's *Reasons and Persons*, he suggests that on a straightforward self-interest theory, the hitchhiker faces a dilemma: it is rational to *be* disposed to pay, but irrational to *actually* pay once in town. He labels this 'rational irrationality.' Your defense of resolute choice seems to promise we can dissolve this label—that the payment itself becomes rational. So, I need you to pin down the moment of transaction: When the hitchhiker is safely in town and hands over the cash, are you claiming that *token act* is rational in isolation, or only that it is the execution of a rational *plan*? If those come apart, which one gets to keep the name 'rational,' and why should the agent care about the plan's rationality if the act's rationality is negative?"

  *   **Follow-up:** "If you say the *plan* is rational but the *act* is locally suboptimal, aren't you just relocating the 'rational irrationality' problem rather than solving it? You're asking the agent to prioritize the rationality of the timeline over the rationality of the moment. What normative force binds the present self to the past self's plan if the present self's reasons have vanished?"

  ### 2. The Source of Binding Force
  "Following up on that: In standard precommitment cases, I bind my future self by changing the menu of options (like Ulysses tying himself to the mast). Resolute choice explicitly rejects external precommitment; it's an internal shift in how we evaluate choices. But what is the mechanism of that shift? Is resolute choice a claim about *psychology* (some people can just do this) or a claim about *normativity* (some people *should* do this)? If it's normative, where does the 'ought' come from if the causal consequences of the specific act are purely negative?"

  *   **Follow-up:** "If you say it's constitutive of agency—that being an agent just *is* being resolute—doesn't that rule out dynamic inconsistency as a conceptual impossibility rather than a rational failure? If I change my mind, am I being irrational, or am I just a different agent?"

  ### 3. The Gauthier Distinction (Constrained Maximization)
  "I want to press the comparison to David Gauthier's Constrained Maximization. Gauthier argues it is utility-maximizing to *be* a disposed co-operator, even if it isn't maximizing to *act* as one in specific instances. Critics have long argued Gauthier can't bridge the gap between the rationality of the disposition and the rationality of the compliance. Is your view just Gauthier's position with the label 'resolute' slapped on it, or does RC do genuine work Gauthier couldn't? Specifically, does RC allow the agent to maximize *at the node* in a way Constrained Maximization doesn't?"

  *   **Follow-up:** "If you say RC allows node-maximization, aren't you effectively redefining utility to include 'keeping faith with one's past self' as a good in itself? If so, isn't that just a preference change, which makes the Hitchhiker case trivial? The puzzle assumes paying is costly; if you make it valuable, you've dissolved the case, not solved it."

  ### 4. Functional Decision Theory (FDT) Comparison
  "There's a newer camp, the Functional Decision Theorists (like Yudkowsky and Soares), who also claim to solve Hitchhiker. They argue you should decide as if you are outputting the result of a decision algorithm that the predictor simulates. Their apparatus is logical correlation; yours is diachronic volition. In the standard Hitchhiker case, you both say 'Pay.' But can you describe a variant case where Resolute Choice and FDT diverge? If they never diverge, is RC just a philosophical gloss on a computational necessity?"

  *   **Follow-up:** "If you say they diverge on 'Newcomblike' problems where the predictor isn't simulating you but reading your brain state: FDT treats the brain state as an output of the algorithm; RC treats it as a commitment of the will. If the predictor is a perfect neuroscanner who sees you *trying* to be resolute but failing, does RC still recommend trying? FDT would say the algorithm failed. Is RC vulnerable to 'faking it' in a way FDT isn't?"

  ### 5. The CDT "Unfairness" Objection
  "A Causal Decision Theorist might argue that the Hitchhiker case is rigged. The prediction is in the past. My current choice cannot causally affect a past event. To judge a theory of rationality by its performance in a world custom-built to punish causal reasoning seems like blaming the map for the territory. Why should we accept a theory of rationality that requires the world to be 'fair' to non-causal influences? Isn't RC just an admission that we should wish causality worked differently?"

  *   **Follow-up:** "If you reply that rationality is about winning (getting out of the desert), not about causal purity: Does that mean if we lived in a world where lying to the driver worked better, the 'rational' choice would be to lie? Is your theory of rationality entirely contingent on the predictor's reliability, rather than the structure of the choice?"

  ### 6. The Transparency Problem
  "Parfit worries about the transparency of dispositions. If I know I am a resolute chooser, I know I will pay. But if I know I will pay, don't I also know I can safely defect once I'm in town, since the prediction is already made? Does resolute choice require a kind of self-ignorance? Do I have to hide my own rationality from myself to make the disposition credible to the driver?"

  *   **Follow-up:** "If you say no, that the resolution holds even under full transparency: How do you avoid the 'unraveling' argument? If I know I'm resolute, I know the pickup is secured. At the moment of payment, the pickup is a sunk fact. What stops the instrumental reasoning from restarting at the node?"

  ### 7. Diachronic Selfhood and Preference Change
  "Resolute choice seems to presuppose a robust metaphysical view of the self as a single entity persisting through time. But what if the hitchhiker undergoes a genuine preference shift in the desert? Suppose the thirst makes them value survival at any cost, but once safe, they value money more. Is RC demanding that the future self defer to the past self's preferences even if the future self judges those preferences to be mistaken? Are we maximizing the self's utility, or the plan's integrity?"

  *   **Follow-up:** "If you say we maximize the plan's integrity: Doesn't that turn rationality into a form of aesthetic consistency? Why is consistency with a past self who was dying of thirst binding on a present self who is safe and wealthy?"

  ### 8. The Regress of Resolution
  "McClennen and others have faced a regress objection: To be resolute, I must choose to follow my plan. But isn't that choice itself subject to re-evaluation? Do I need a higher-order plan to be resolute about my first-order plan? If every node offers a chance to re-evaluate, how does the initial resolution ever gain a foothold? Is there a 'first mover' problem for resolute choice?"

  *   **Follow-up:** "If you argue that the resolution is a standing disposition rather than a recurring choice: How is that disposition maintained? If maintaining it costs cognitive effort, and that effort is costly at the node, don't we just recreate the Hitchhiker problem inside the psychology of the agent?"

  ### 9. Evidential vs. Causal Leverage
  "Let's look at the leverage. In Evidential Decision Theory, my paying is *evidence* that I was picked up. In Causal, it has no leverage. In Resolute Choice, what is the leverage? Is it that my paying *makes it true* that I was the sort of person who was picked up? If so, isn't that just Evidential Decision Theory with extra steps? If not, how does the act of paying reach back and affect the prediction without violating causal order?"

  *   **Follow-up:** "If you say it's not about affecting the past but about being the *type* of agent who exists in the world where predictions are accurate: Aren't you shifting the unit of evaluation from the 'act' to the 'agent'? If so, why call it a theory of *choice* rather than a theory of *character*?"

  ### 10. The "Toxin Puzzle" Stress Test
  "Finally, Kavka's Toxin Puzzle is the cousin of Hitchhiker: You get money if you *intend* to drink a toxin, but you don't have to actually drink it to get the money. Hitchhiker requires you to actually pay. Does your view solve Toxin? If RC says you should intend to drink in Toxin, but Hitchhiker says you should actually pay, what is the principled difference? Is it that Hitchhiker requires the act for the *continued* benefit of safety, whereas Toxin is a one-off reward? Or does RC collapse the distinction between intention and action?"

  *   **Follow-up:** "If you say RC solves both: In Toxin, drinking is purely costly with no benefit. In Hitchhiker, paying is costly but maintains the 'resolute' status. If the only benefit of paying in Hitchhiker is avoiding being a 'resolute chooser who failed,' haven't you just made the theory unfalsifiable? Any deviation becomes a failure of resolution rather than a rational update."
