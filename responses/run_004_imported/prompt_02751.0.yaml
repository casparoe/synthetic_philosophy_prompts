      *   *Make sure to distinguish between "Safe" and "Pareto".* SPI guarantees weak improvement relative to the *default*. But relative to *each other*, SPIs are not Pareto-equivalent.

  8.  **Final Polish:** Organize into clear headings. Ensure the logical flow leads inevitably to the conclusion that the selection problem *is* the fairness problem. (This aligns with the user's request for a specific argumentative stance).

