      *   **The Catch:** The "SPI Selection Problem." There are multiple possible SPIs.
      *   **The Task:** Argue that the selection problem is *fatal* to the main selling point (that SPIs avoid the need to agree on fairness).
      *   **The Thesis:** Choosing *which* SPI to adopt reintroduces the original fairness/coordination problem at a meta-level. SPIs don't solve the problem; they just displace it.

  2.  **Understand the "Selling Point" of SPIs:**
      *   Standard bargaining (Nash, Kalai-Smorodinsky, etc.) requires a bargaining set and a disagreement point. To pick a point *on* the Pareto frontier, you need a solution concept, which usually implies a normative judgment about fairness (e.g., equal gain, proportional gain).
      *   SPI proponents (like Oesterheld, Conitzer, et al.) argue: "We don't need to agree on the final split. We just need to agree to make the pie bigger (or the cost of fighting smaller) regardless of the split."
      *   The promise is: *Neutrality regarding distribution.*

  3.  **Analyze the "SPI Selection Problem":**
      *   Suppose Party A and Party B are disputing a territory.
      *   SPI 1: Simulated war (cost = $1M).
      *   SPI 2: Binding arbitration by a neutral third party (cost = $100k).
      *   SPI 3: Randomized settlement based on historical claims (cost = $0).
      *   Each SPI changes the *expected utility* for each party differently.
      *   Party A might prefer SPI 1 because their military simulation is better.
      *   Party B might prefer SPI 2 because they trust the arbitrator more.
      *   If they can't agree on *which* SPI to use, they might fall back to the dangerous default (real war).

  4.  **Develop the Argument (The "Fatal Flaw"):**
      *   *Premise 1:* SPIs are not distribution-neutral. Even if they don't specify the final outcome, different SPIs have different expected value distributions.
      *   *Premise 2:* Rational agents care about expected utility, not just "safety."
      *   *Premise 3:* Therefore, selecting an SPI is a bargaining problem over expected utility.
      *   *Conclusion:* This meta-bargaining problem requires the same normative/coordination machinery (fairness, focal points, threat power) as the original problem.

  5.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Define SPI briefly. State the promise (Pareto improvement without fairness agreement). State the counter-thesis (The selection problem resurrects the fairness problem).
      *   **Point 1: SPIs are not Distribution-Neutral.**
          *   The claim is "weakly better off for *all* strategies." But in expectation, different SPIs favor different players.
          *   Example: Simulation vs. Arbitration. One favors the strong, one favors the just.
          *   Choosing an SPI is choosing a probability distribution over outcomes. That *is* a distributional choice.
      *   **Point 2: The Meta-Bargaining Game.**
          *   To adopt an SPI, you need agreement.
          *   If there are multiple SPIs, you have a coordination game with conflict of interest (Bargaining Game).
          *   You need a "solution concept" for the SPI selection.
          *   If you use Nash Bargaining to select the SPI, why not use Nash Bargaining on the original problem?
          *   If you don't use a solution concept, you risk bargaining breakdown (failure to select SPI) $\rightarrow$ Default (bad outcome).
      *   **Point 3: Threat Power and Leverage.**
          *   In the original game, threats determine the disagreement point.
          *   In the SPI selection game, threats determine *which SPI gets picked*.
          *   "Agree to SPI 1 or we fight for real."
          *   This means power dynamics aren't neutralized; they are just applied to the mechanism choice.
      *   **Point 4: Complexity and Common Knowledge.**
          *   SPIs often require complex verification (is the simulation faithful?).
          *   Agreeing on the *rules* of the SPI requires trust/verification standards.
          *   Disagreement on verification is often a proxy for disagreement on fairness/outcome.
      *   **Conclusion:** The "fairness-free" promise is an illusion. The problem hasn't been solved; it's been kicked upstairs.

  6.  **Refining the Tone:**
      *   Needs to be analytical, rigorous, but accessible.
