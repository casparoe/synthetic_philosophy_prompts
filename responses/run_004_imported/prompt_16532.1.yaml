      *   **Tone:** Academic philosophy seminar level (sophisticated, precise, argumentative).
      *   **Constraint:** Do not conclude with "more research needed." Take a stand.

  2.  **Deconstruct the Objections:**
      *   *Indeterminacy:* This is the "Quinean" or "Gavagai" problem applied to evolution. Selection acts on phenotypes/behaviors, not specific semantic contents. If a mechanism triggers for flies, BBs, and shadows, what was *actually* selected? The "consumer" vs. "producer" distinction (Millikan) is key here.
      *   *Swampman:* This is an intuition pump about intrinsic vs. relational properties. If mental content depends on history, Swampman is a zombie. But he acts like he has thoughts. This challenges the *necessity* of history for content.

  3.  **Identify Key Teleosemantic Responses:**
      *   *Millikan:* Focus on "consumer systems." The content is determined by what the *consumer* of the signal needs to function, not just what causes the signal. This helps with indeterminacy. Regarding Swampman, she bites the bullet: Swampman has no thoughts initially.
      *   *Neander:* Focus on "etiological functions." Defends the historical view robustly. Argues that Swampman lacks *genuine* representation, perhaps having only "as-if" content.
      *   *Papineau:* Focus on "decision-theoretic" or success semantics. Functions are tied to satisfaction conditions.

