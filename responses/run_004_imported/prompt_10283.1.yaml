answer: |-
  Here are 9 questions designed to corner the guest on the empirical specifics without getting lost in abstract meta-ethics. The first four address your specific requirements (FAE, Kamtekar/Unfalsifiability, Epstein/Aggregation, Aristotle/Rarity) and include the requested follow-ups to block standard dodges. The remaining five broaden the scope to implications and compromises.

  ### The "Hard" Questions (Required Topics)

  **1. The Fundamental Attribution Error (FAE)**
  "Situationists argue that folk psychology commits the Fundamental Attribution Error: we overestimate character and underestimate the situation. But isn't virtue ethics just the philosophical codification of that exact error? You insist that *character* explains action even when situational pressure is the stronger predictor. At what point does insisting on character become a denial of the data rather than an interpretation of it?"
  *   **Follow-up (If he says: 'We acknowledge situations matter, but character filters them'):** "Okay, but if the situational variable swamps the character variable in predictive power, as the data suggests, isn't 'character' just a label for residual noise? Why call it a causal trait if it's not doing the causal heavy lifting?"

  **2. The Kamtekar/Unfalsifiability Dodge**
  "You often follow Rachana Kamtekar in arguing that traits aren't just behavioral regularities but stable 'evaluative outlooks.' But if the behavior varies wildly across situations, and the outlook is internal, doesn't this make trait ascriptions unfalsifiable? How do we empirically distinguish a virtuous person from someone who just got lucky with their circumstances?"
  *   **Follow-up (If he says: 'We look at their reasons/narrative, not just actions'):** "But in Milgram, subjects *gave* reasons—they expressed distress but kept going. Your theory says they lacked the virtuous outlook, but the data says they had the concern but failed the action. Who gets to decide if the outlook was 'real' if it doesn't reliably cash out in behavior?"

  **3. Epstein and Aggregation**
  "Let's talk about Seymour Epstein's aggregation principle. He showed that while single instances don't predict behavior, aggregating behavior across many situations *does* reveal stable traits. You usually dismiss the situationist studies as 'too narrow,' but if we apply Epstein's lens to that same data, do we still see the robust character you defend, or does the variability hold even at the aggregate level?"
  *   **Follow-up (If he says: 'Aggregation misses the moral quality of the act'):** "So is virtue a statistical property of a life or a metaphysical property of a soul? If it doesn't show up in the aggregate stats of action, where exactly does it live, and how does it guide us?"

  **4. Aristotle's Rarity Concession**
  "Aristotle explicitly claims that full virtue is rare—that the *spoudaios* is an exception, not the rule. Doesn't this basically concede the situationists' empirical point that global traits are statistically negligible, while insisting it's not a problem for the theory? Are you defending a psychology that applies to almost no one?"
  *   **Follow-up (If he says: 'It's an ideal to strive for, not a description'):** "If the empirical conditions for achieving the ideal are systematically undermined by situational factors we can't control, is the ideal coherent? Or is it just a cruel standard that blames individuals for structural failures?"

  ### The "Broadening" Questions (To fill out the interview)

  **5. The "Local Traits" Compromise**
  "John Doris suggests we replace global traits with 'local traits'—like honesty-in-the-office rather than Honesty-with-a-capital-H. If you accept that character is fragmented by context, haven't you already accepted the situationist critique? What's left of 'virtue ethics' if the virtues don't travel across different domains of life?"

  **6. Moral Engineering vs. Character Building**
  "If situations are as powerful as these experiments show, shouldn't our moral energy go into designing better situations rather than building better characters? Why invest in virtue education if a change in lighting, time pressure, or authority figures renders that education inert?"

  **7. The Unity of Virtue**
  "Aristotle claims you can't have one virtue without having them all—the Unity of Virtue. But empirically, we see people who are brave but intemperate, or generous but dishonest. Is the Unity of Virtue a normative goal or a psychological claim? If it's psychological, the data seems to falsify it."

  **8. Moral Luck**
  "Situationism looks a lot like a problem of constitutive moral luck. If my character is largely a product of the situations I've been exposed to, how much credit or blame can I actually take for being virtuous or vicious? Does your defense of virtue ethics require us to ignore the role of luck in character formation?"

  **9. The Normative Stakes**
  "Let's zoom out. Even if the situationists are right that global traits are empirically rare, does virtue ethics lose its *normative* force? Can we keep the theory as a guide for how we *ought* to be, even if psychology says we *can't* reliably be that way?"
