prompt: |-
  I've got a philosopher coming on my podcast next week whose new book defends virtue ethics against the situationist critique (the Doris/Harman line, built on stuff like Milgram and the Good Samaritan study). His go-to move, in literally every interview he's done, is that those experiments just show behavioral variability across situations, not the absence of a stable evaluative outlook -- so they're talking past what Aristotelians actually claim. Give me 8-10 questions that don't let him coast on that line. I want one on whether virtue ethics itself is guilty of the fundamental attribution error it pins on folk psychology, one on whether his "content of character" dodge (following Kamtekar) just makes trait ascriptions unfalsifiable -- make him deal with Epstein's aggregation-principle defense so he can't just say the studies are too narrow -- and one on whether Aristotle's own claim that full virtue is rare basically concedes the situationists' empirical point while insisting its not a problem for the theory. Tack a quick follow-up onto each of those three, keyed to whatever dodge he'll probably reach for.
