          *   Define the core tension: CPA + CKR = No Trade.
          *   State the Thesis: The existence of speculative trade is evidence against the Harsanyi Doctrine as a strict rationality constraint. We should accept divergent priors as rational.
      *   **Section 1: The Power of the No-Trade Theorems.**
          *   Explain the logic briefly (Milgrom-Stokey, Aumann).
          *   Explain the Harsanyi Doctrine (priors differ only due to information).
          *   Why economists love it (parsimony, tractability).
      *   **Section 2: The Standard Defenses (Saving CPA).**
          *   Noise traders/Liquidity needs (exogenous reasons to trade).
