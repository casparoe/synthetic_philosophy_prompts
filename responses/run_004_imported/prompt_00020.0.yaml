answer: |-
  **The Silence of Theory and the Roar of the Market: Against the Harsanyi Doctrine as a Rationality Constraint**

  The no-trade theorems of the 1980s, culminating in the work of Milgrom, Stokey, and Aumann, present one of the most elegant and embarrassing puzzles in economic theory. The logic is airtight: if agents share a common prior (the Common Prior Assumption, or CPA) and it is common knowledge that everyone is rational (Common Knowledge of Rationality, or CKR), then speculative trade cannot occur. If you offer to sell me an asset, I must infer that you possess private information suggesting the price is too high. Since we started with the same probabilistic map of the world, your information updates my beliefs such that the expected gain from trade vanishes. In a world of perfect Bayesian rationality, the market should be silent.

  Yet, the real world is deafening. Financial markets exhibit staggering volumes of speculative trading, far exceeding what can be explained by hedging or liquidity needs. This discrepancy forces a choice: either we maintain the Common Prior Assumption as a normative requirement of rationality and attribute trading volume to irrationality, noise, or failures of common knowledge; or we accept that the ubiquity of trade constitutes evidence that rational agents can legitimately hold divergent priors. While the standard economic defense seeks to save the CPA by relaxing CKR or appealing to noise traders, this essay argues that such moves are ad hoc protections of a metaphysically dubious axiom. The volume of speculative trade is genuine evidence against the Harsanyi Doctrine as a rationality constraint. Rationality does not require uniformity of starting points, and preserving the CPA at the cost of empirical coherence renders the concept of rationality explanatorily vacuous.

  To understand the stakes, one must appreciate the allure of the Harsanyi Doctrine. Named for John Harsanyi, who argued that differences in subjective probabilities must be attributed solely to differences in information, the CPA provides a powerful anchor for game theory and welfare economics. It treats priors not as psychological quirks but as objective features of a rational mind processing the same universe. If two agents have different priors despite sharing the same history, at least one is effectively "wrong" about the structure of reality. This allows economists to model disagreement as a temporary friction caused by asymmetric information, which market mechanisms should theoretically resolve. Under this view, persistent speculative trade implies that agents are failing to update correctly, are not truly risk-averse, or are simply noise traders acting on whims rather than beliefs.

  The standard defense of the CPA relies heavily on these "frictions." Proponents argue that real markets are not populated by the hyper-rational agents of the theorems. By introducing "noise traders"—agents who trade for exogenous liquidity reasons rather than information—the no-trade result is circumvented. Rational speculators can then trade against noise traders without fearing adverse selection from other rational agents. Alternatively, defenders argue that Common Knowledge of Rationality is too strong; agents may be rational but unsure of others' rationality, allowing trade to persist.

  However, these defenses come at a steep epistemological cost. First, relying on noise traders to explain speculative volume is increasingly untenable. While liquidity needs explain some turnover, the sheer magnitude of derivatives trading and high-frequency speculation suggests a market driven primarily by differences in valuation, not cash-flow needs. To claim that trillions of dollars in daily volume are driven by "noise" is to relegate the central phenomenon of finance to an error term. Second, relaxing CKR saves the CPA only by making the model unfalsifiable. If any observed trade can be explained by positing a failure of common knowledge or a hidden liquidity shock, the theory loses its predictive bite. It becomes a protective belt around a hard core that refuses to engage with reality.

  The deeper issue, however, is epistemological. The Harsanyi Doctrine conflates *rationality* with *uniformity*. It assumes that there is a single, "correct" prior distribution that any rational agent would adopt in the absence of specific information. This smuggles in a form of logical objectivism that is difficult to justify. In formal epistemology, priors represent the weighting of hypotheses before evidence is applied. But why must rational agents weigh hypotheses identically? As critics like Stephen Morris (1995) and Hyun Song Shin have noted, priors often reflect fundamental differences in how agents carve up the state space or assess the relevance of certain variables.

  Consider the problem of underdetermination. In complex environments like financial markets, the "data" available to agents is vast and ambiguous. There is no algorithmic way to derive a unique prior from a set of experiences. Two agents can observe the same history of stock prices and macroeconomic indicators and reasonably adopt different priors regarding future volatility based on different meta-theories of how the economy functions. One might prioritize momentum; another, mean reversion. Neither is necessarily violating Bayesian updating rules; they simply started from different axiomatic positions regarding market structure. To label one irrational simply because their prior differs from the other's is to impose a dogmatic constraint on what counts as a reasonable worldview.

  Furthermore, maintaining the CPA as a rationality constraint leads to a paradoxical normative conclusion: that the ideal rational agent should never speculate against another agent they know to be rational. This implies that the pinnacle of epistemic virtue is a market freeze. If the Harsanyi Doctrine were true, a market of perfectly rational agents would suffer from a complete lack of liquidity and price discovery, as no one would dare take a position against the consensus. This is counter-intuitive. We generally view the ability to identify mispricing and take positions as a sign of sophistication, not a failure of common knowledge. By labeling speculative trade as a symptom of irrationality, the CPA turns the engine of price discovery into a pathology.

  Defenders of the CPA might argue that without it, we lose the ability to define "truth" in markets. If priors are purely subjective, how can we say prices are "wrong"? This is a valid concern for welfare economics, but it should not dictate the boundaries of rationality. We can acknowledge that agents have subjective priors (Subjective Expected Utility) without abandoning the rigor of Bayesian updating. We can model trade as a clash of legitimate worldviews rather than a game where one side is "mistaken" about the prior. This approach, often associated with the "agreeing to disagree" literature, allows for persistent disagreement without invoking irrationality. It acknowledges that rational agents can look at the same world and see different probabilities, much as they might look at the same data and prefer different statistical models.

  Ultimately, the choice between saving the CPA or rejecting it is a choice between mathematical elegance and explanatory power. The no-trade theorems are beautiful, but they describe a world that does not exist. To preserve them, we must assume that the vast majority of market activity is driven by noise or irrationality. This is a "Lakatosian" degenerative shift: we are adding auxiliary hypotheses (noise traders, bounded rationality) to protect the hard core (CPA) from empirical refutation. A progressive research program, by contrast, would modify the hard core to accommodate the data.

  Therefore, the ubiquity of speculative trading should be accepted as evidence against the Common Prior Assumption as a constraint on rationality. The Harsanyi Doctrine imposes an unjustified metaphysical uniformity on the starting points of belief. Rationality should be understood as the consistency of belief updating, not the identity of belief initialization. By allowing for divergent priors, we do not surrender to chaos; we acknowledge the complexity of human epistemology. We recognize that two agents can be perfectly rational, fully aware of each other's rationality, and still willingly trade because they genuinely interpret the world differently. To insist otherwise is to demand that rationality silence the market, when in fact, it is the diversity of rational perspectives that makes the market speak.
