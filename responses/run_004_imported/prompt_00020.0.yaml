          *   Subjective view: Priors reflect individual epistemic positions; divergence is compatible with rationality.
          *   The "Agreeing to Disagree" problem.
      *   **Section 4: Defending Divergent Priors.**
          *   Argument from Underdetermination: Data doesn't dictate a unique prior.
          *   Argument from Computational Complexity: Deriving a "common" prior requires impossible coordination.
          *   Argument from Empirical Reality: If a theory predicts no trade and trade exists, modify the core axiom, not the periphery (Lakatosian view).
      *   **Conclusion:**
          *   Restate thesis.
          *   Final thought: Epistemology should explain human reasoning, not idealize it into silence.

