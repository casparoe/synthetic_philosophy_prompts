          *   *Nadia:* Argues it *is* rational because all major life decisions involve this uncertainty. If Owen is right, then marriage/kids/emigration are also irrational, which is an absurd conclusion (reductio ad absurdum).
      *   **The Task:** Analyze the exchange move-by-move, adjudicate who has the better of each point, and identify what *both* might be missing.
