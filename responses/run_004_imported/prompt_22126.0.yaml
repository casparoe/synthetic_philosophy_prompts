          *   *Assessment:* Strong pragmatic point. If Owen's standard holds, rationality becomes impossible for almost anything novel.
          *   *Verdict:* Nadia wins on *consistency* and avoiding paralysis. She exposes the potential absurdity of Owen's strict standard.

      *   *Move 3: Owen's Rebuttal (The Qualia Gap).*
          *   *Claim:* Testimony doesn't close the gap. Knowing about a color isn't seeing it. Secondhand info doesn't fix the "what it's like for *you*" problem.
          *   *Philosophical Underpinning:* Thomas Nagel ("What Is It Like to Be a Bat?") / Frank Jackson ("Mary's Room").
          *   *Assessment:* Philosophically robust. There is a hard distinction between propositional knowledge (knowing that) and phenomenal knowledge (knowing how/what it's like).
          *   *Verdict:* Owen wins on the *epistemic* distinction. Nadia's analogy to a new job is weaker than Owen's color analogy.

      *   *Move 4: Nadia's Reductio.*
          *   *Claim:* If "can't know in advance" = irrational, then no one rationally has kids/marries/emigrates. That's a problem with the standard, not the people.
          *   *Philosophical Underpinning:* Reductio ad absurdum.
