  ***

  **The Kantian Anniversary**

  A Kantian and their partner are out for a romantic anniversary dinner. The partner looks across the table, touched, and says, "You remembered our anniversary. You're so thoughtful. You must really love me."

  The Kantian puts down their fork, looking concerned. "Please, don't say 'love.' Love is inclination. It's pathological. It has zero moral worth."

  The partner blinks. "So… you don't love me?"

  "No, I'm trying to suppress it. Ideally, I would find your company excruciating. I would be sitting here wishing I were literally anywhere else. But I would stay anyway, solely out of respect for the duty of commitment."

  "That's… really hurtful."

  "Good! Hurt me more. If you ruin the evening enough that I feel nothing but cold obligation to remain, *then* this anniversary counts. Right now, I'm just a shopkeeper staying honest because I like you. I need to be honest because I hate you. Then I'm virtuous."

  The partner stares at them. "So to prove you're a good partner, you need me to make you miserable?"

  The Kantian smiles warmly. "See? You're doing great. Keep going. My moral worth is skyrocketing."

  ***

  **Why this works for your section:**
  1.  **The Sympathetic Philanthropist:** It directly parallels Kant's example of the man who loses all sympathy due to sorrow; the Kantian here is actively *trying* to lose their sympathy to achieve moral worth.
  2.  **Duty vs. Inclination:** The punchline fails if you think doing the right thing (staying for dinner) is enough; it requires the audience to know Kant thinks the *motivation* (hating it) is what adds value.
  3.  **Smith's Fetishism:** It highlights the absurdity of caring more about the *purity of your own will* than the actual person sitting in front of you (the partner's feelings are irrelevant compared to the agent's motivational structure).
  4.  **Huck Finn Mirror:** While not explicitly in the text, it hints at the inverse of Arpaly's case: Huck is praiseworthy for doing right while thinking it's wrong; this Kantian is only praiseworthy if they do right while *wanting* to do wrong (leave).

  If someone laughs, you know they read the *Groundwork*. If they look horrified, you know they understood Smith.
