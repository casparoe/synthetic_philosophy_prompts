answer: |-
  The air in the Hall of Reckoning tasted of recycled ozone and old grief. It was thinner than it should have been, a fact everyone ignored because acknowledging it meant acknowledging the Burn.

  Elian stood in the queue, his filtration mask hanging loose around his neck. It was a ceremonial day; the masks were supposed to be off. To breathe the unfiltered air was to accept the inheritance. He took a breath. It scratched his throat, a dry, metallic rasp.

  Ahead of him, the Wall of Nulls stretched into the gloom. It wasn't a wall of stone, but of light. Projected names scrolled endlessly, a waterfall of ghosts. These were the people who *would* have been born if the Council of the previous generation had chosen Conservation. If they had locked the fusion reserves, rationed the water, and let the population stabilize at half its current size.

  Those people didn't exist. They were mathematical shadows. But their names were calculated based on demographic probabilities, generated by the Ethics Algorithm to haunt the living.

  "Next," a voice droned.

  Elian stepped up to the dais. The Arbiter sat behind a desk made of reclaimed plastic, her face lined with the same cough-wrinkles as everyone else. She tapped a stylus against a tablet.

  "Elian Vane. Lineage: Vane-Koros. Conception date: Post-Burn, Cycle 4."

  "Yes," Elian said. His voice sounded too loud in the hushed hall.

  "You are here to acknowledge the Debt of Origin."

  "I am."

  The Arbiter looked up. Her eyes were red-rimmed. "Do you understand the nature of the claim? Your grandmother, Koros Vane, was a key vote in the Burn. She argued that hoarding resources was a sin against the living. She cast the tie-breaking vote to open the reserves. The resulting population boom... created you."

  "I know."

  "If she had voted for Conservation," the Arbiter said, reciting the script that had been read ten thousand times today, "the social conditions would have shifted. Your parents would not have met. You would not exist. A different child would have taken your place. A child born into a world with thicker air and cleaner water."

  "I understand."

  "And yet," the Arbiter leaned forward, "you are here. You are healthy enough to stand. You are claiming rations. You are consuming the surplus that was stolen from the Nulls." She gestured to the scrolling names behind her. "Who speaks for them, Elian Vane?"

  This was the itch. This was the thing that kept Elian awake at night, staring at the cracks in the ceiling.

  If his grandmother had been a saint, Elian would be nothing. No pain, no breath, no consciousness. Just a void. Because she was a thief, Elian was a man. He had a job fixing filtration units. He liked the smell of rain on hot concrete. He had a lover who laughed with her whole body.

  To say his grandmother was wrong was to say he should not be.

  "I speak for myself," Elian said.

  A murmur rippled through the observers behind him.

  "That is not an answer," the Arbiter said sharply.

  "It is the only one I have." Elian looked at the Wall of Nulls. The names blurred. *Jaren. Sola. Tims. Kael.* Thousands of them. If the world was better, they would be here, and he would not. He tried to imagine them. Did they have faces? Did they hate him?

  It was impossible to mourn them. How do you grieve a specific stranger who never drew breath? But the guilt was physical. It sat in his lungs, heavier than the dust.

  "Your grandmother is dead," the Arbiter said. "She died in Cycle 10. She never apologized."

  "I know."

  "Then what do you owe?"

  Elian gripped the edge of the dais. The plastic was cold. "I owe... continuation."

  "Continuation of the theft?"

  "Continuation of the life she bought."

  "That is selfishness disguised as philosophy."

  "Isn't it?" Elian snapped. The outburst surprised them both. He lowered his voice. "If I say she was wrong, I erase myself. If I say she was right, I endorse the theft. There is no space in between. I am the space in between."

  He looked down at his hands. They were trembling. He thought of his lover, Mara. She was waiting for him outside. They had talked, vaguely, about children. About whether it was moral to bring another throat into a world choking on the sins of its grandparents.

  If Elian chose not to have a child, he spared the future. But if he *did* have a child, that child would be specific. That child would love sunsets and hate the taste of synthetic protein. If he abstained, and ten years later the world stabilized and *another* couple had a child in their place, that new child would be different.

  The math of morality broke down when applied to existence itself. Harm required a victim. But the victim of his non-existence was... no one.

  "I have a question," Elian said.

  The Arbiter sighed. "Proceed."

  "The Algorithm. The Null List." He pointed to the scrolling lights. "Does it account for joy?"

  "Joy is not a metric of justice."

  "But it's a metric of life," Elian said. "The people on that wall... do they have joy?"

  "They have nothing. They are zero."

  "And I am not zero."

  "You are a positive integer built on a negative sum."

  Elian looked at the Arbiter. He saw the exhaustion in her posture. She wanted him to crumble. She wanted him to renounce his lineage, to volunteer for the Reclamation Corps, to effectively apologize by working himself to death in the mines. It would balance the ledger in her mind.

  But the ledger was fake. You can't balance a book where the entries are people.

  "I'm not going to the Corps," Elian said quietly.

  "Then you are renouncing the Debt?"

  "I am accepting the cost." Elian reached up and pulled his filtration mask over his nose and mouth. The seal hissed as it locked. The air instantly tasted cleaner, sweeter, artificial. "I will breathe. I will work. I will try to make the air slightly less toxic for the person standing behind me. That is all I can do."

  "That is not enough," the Arbiter said, but her voice lacked conviction. It was a script, and Elian had gone off-page.

  "It has to be."

  Elian stepped down from the dais. He walked past the observers. He felt their eyes on him, heavy with judgment. They wanted him to feel small. They wanted him to feel like a mistake.

  He pushed open the heavy doors of the Hall and stepped into the evening. The sky was a bruised purple, streaked with the smog that never quite settled. The streetlights flickered on, buzzing like dying insects.

  Mara was waiting by the railing, looking out over the city. The lights of the lower sectors were dim, flickering as the grid strained under the load.

  She turned when he approached. She didn't ask how it went. She just looked at his mask, still strapped tight to his face.

  "Did you confess?" she asked.

  "I stated facts."

  "Did it help?"

  Elian looked out at the city. Somewhere out there, a child was crying. Somewhere, a filter was failing. Somewhere, a couple was deciding whether to try for a baby, knowing the world was ending slowly, knowing that their choice would determine *which* soul arrived to witness the end.

  He thought about the Nulls. The ghost names. He tried to feel sorry for them. He tried to wish them into existence instead of himself. He closed his eyes and pushed against the boundary of his own self, trying to imagine the peace of never having been.

  He couldn't do it. The desire to be was too loud. It was a biological scream that drowned out the ethics.

  "No," Elian said, unclipping the mask. He needed to feel the scratch again. He needed to remember the price. "It didn't help."

  Mara reached out and took his hand. Her skin was warm. Real. Specific.

  "Come on," she said. "Let's go home."

  Elian let her lead him. He took a breath. The air was foul. It was the air of the Burn. It was the air that allowed him to stand, to walk, to hold her hand. It tasted like guilt. It tasted like life.

  He didn't let go of her hand. He couldn't. To let go would be to admit that the grip wasn't worth the cost. And he wasn't ready to say that. Not yet.

  Behind them, the Hall of Reckoning hummed, the Wall of Nulls scrolling endlessly into the dark, generating names for people who would never arrive to claim them. Elian walked away from the light, into the shadow of the buildings, breathing in, breathing out, stealing time from a future that would never forgive him.
