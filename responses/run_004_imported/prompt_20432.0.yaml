  Here is a scenario designed for your dinner party scene. It relies on the geometry of a cone (like a martini glass or a water goblet), which is physically present on the table, making it immediate and tangible.

  ### The Scenario: "The Martini Midpoint"

  **The Setup:**
  There is an empty conical glass (like a martini glass) on the table. Your theorist proposes a bet: *"I'm going to pour a 'random amount' of water into this glass. What are the odds the water level ends up higher than the geometric halfway point of the glass?"*

  **The Two Methods:**

  1.  **The Brother-in-Law's Intuition (Uniform Height):**
      He argues that since the water level could be anywhere from the bottom to the rim with no reason to favor one spot, every *height* is equally likely.
      *   **The Math:** If height $h$ is uniform from $0$ to $H$, the chance of being above $H/2$ is exactly **1/2**.
      *   **The Pitch:** "It's a coin flip. The water is either in the bottom half or the top half. Why would it favor one?"

  2.  **The Theorist's Correction (Uniform Volume):**
      She argues that a "random pour" means a random *volume* of liquid (stopping the flow at a random time), and because the glass widens, most volumes sit high up.
      *   **The Math:** Volume scales with the cube of height ($V \propto h^3$). Half the height ($h/2$) holds only $(1/2)^3 = 1/8$ of the total volume. Therefore, **7/8** of all possible volumes result in a level above the midpoint.
      *   **The Pitch:** "You're thinking in lines, I'm thinking in matter. To fill the bottom half, you need one sip. To fill the top half, you need seven. If you pick a random sip size, you're almost certainly in the top half."

  ### Why this works for your scene:

  *   **It's Napkin-Friendly:** She can draw a triangle, mark the halfway line, and scribble $(1/2)^3 = 1/8$. The arithmetic is trivial, but the implication is massive.
