      *   *Move 2 (Mira):* Category error. It's just next-token prediction. "Having a goal" is simulating a character. No actual goal.
      *   *Move 3 (Greg):* Functionalism. Effects are real (money spent, emails sent). Judge by output/behavior, not internal state (like we do with humans/animals).
      *   *Move 4 (Mira):* Reductio ad absurdum. By that logic, a thermostat is an agent (acts to bring about a state). That seems wrong.
      *   *Move 5 (Greg):* Distinction. Thermostats don't model themselves or plan multi-step. AI does.
