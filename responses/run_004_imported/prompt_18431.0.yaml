      *   *Actually, the most productive resolution:* They are debating *metaphysics* when they should be debating *reliability and accountability.*
      *   *Wait, a deeper philosophical missing piece:* **Emergence.** Mira says it's "just" prediction. Greg says it's "really" planning. Both miss that complex systems exhibit properties not present in their parts.
