prompt: |-
  Okay, weird dilemma - curious what you think. I've been querying literary agents with my novel for almost a year and just got my first offer of representation: decent agent, small agency, and she genuinely seems to love the book. Problem is I've still got a dozen queries out to agents I like even better, no idea if or when any of them will even get back to me, and this agent's only giving me three weeks to decide before she moves on to her next client. Everyone keeps telling me either 'take it, you never know if you'll get another shot' or 'don't you dare sign with the first yes,' and I honestly don't know if there's some actual principled way to think about this or if im just supposed to guess.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** The user has been querying literary agents for almost a year.
      *   **Current Status:** Received *one* offer of representation.
      *   **Agent Details:** "Decent agent," "small agency," "genuinely seems to love the book."
      *   **Pending Queries:** A dozen queries out to "dream agents" (agents they like better).
      *   **Constraint:** The offering agent has given a 3-week deadline to decide.
      *   **Conflicting Advice:** "Take it (bird in hand)" vs. "Don't sign with the first yes (hold out for the best)."
      *   **Goal:** The user wants a principled way to think about this, not just a guess.

  2.  **Evaluate the Conflicting Advice:**
      *   *"Take it":* Valid because querying is grueling, a year is a long time, and offers are rare. A "decent" agent is better than no agent.
      *   *"Don't sign":* Valid because an agent is a long-term business partner. A "dream agent" might get better deals, have better connections, or just be a better fit. Signing too quickly can lead to regret.
      *   *Reality:* Both extremes are risky. Blindly accepting can lead to a bad match. Blindly rejecting can lead to no representation.

  3.  **Identify the Standard Industry Protocol:**
      *   This is actually a *very* common scenario in publishing. There *is* a standard etiquette for this.
      *   **The "Offer Notification":** When an agent makes an offer, the author is expected to notify other agents who have the full manuscript (or sometimes just the query) that there is an offer on the table.
      *   **The Timeline:** 3 weeks is a standard (even generous) timeframe. Usually, it's 1-2 weeks, so 3 is actually quite nice.
      *   **The Outcome:** Other agents will either pass immediately or ask for more time to read. If they want to make a counter-offer, they will. If they don't respond, they pass.

  4.  **Formulate a Principled Approach:**
      *   **Principle 1: Transparency & Professionalism.** You must tell the other agents. It's not rude; it's expected.
      *   **Principle 2: Due Diligence.** You need to vet the offering agent thoroughly. "Decent" is subjective. Is she *actually* good for *this* book?
      *   **Principle 3: Gut Check vs. Prestige.** A big name agent who doesn't love the book is worse than a smaller agent who is passionate. Passion sells.
      *   **Principle 4: Risk Assessment.** What happens if you say no to this one and the others pass? Are you okay with that risk?

  5.  **Drafting the Advice (Iterative Process):**

      *   *Acknowledge the stress:* Validate that this is a good problem to have but still stressful.
      *   *Debunk the "Secret Rule":* There is no rule saying you can't accept the first offer. There is also no rule saying you must wait.
      *   *The Action Plan (The "Principled Way"):*
          1.  **Notify the others.** This is crucial. Explain how to do this politely.
          2.  **Vet the offering agent.** Check sales records, client lists, Publisher's Marketplace, talk to her clients.
          3.  **Evaluate the "Dream" Agents.** Are they actually better, or just bigger names? Do they have the full manuscript?
          4.  **The Decision Matrix.** Compare passion vs. prestige.
      *   *Address the 3-week deadline:* It's enough time to get responses from the others *if* you notify them now.
      *   *Address the "Small Agency" aspect:* Small isn't bad. Often means more attention.
      *   *Address the "Year of Querying" aspect:* Burnout is real. Don't underestimate the value of momentum.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but professional.
      *   Avoid making the decision *for* them, but give them the tools to decide.
      *   Highlight that "holding out for a dream agent" is a gamble, but "notifying other agents" mitigates that gamble.

  7.  **Key Insight/Nuance:**
      *   Many new authors don't know they are *allowed* to tell other agents about an offer. They think it's cheating. I need to emphasize that this is standard procedure.
      *   The "Dream Agent" might not actually want the book. They might have passed silently. Notifying them forces a decision.
      *   Passion > Prestige. An agent who loves the book will pitch it harder.

  8.  **Final Polish:**
      *   Structure with clear headings.
      *   Include a template for the email to other agents.
      *   Summarize the "Principled Framework."

  9.  **Self-Correction/Safety Check:**
      *   *Did I tell them to reject the offer?* No.
      *   *Did I tell them to accept immediately?* No.
      *   *Is the advice industry-standard?* Yes, notifying other agents is the norm.
      *   *Is the timeline realistic?* 3 weeks is enough for others to bump the manuscript up their queue.

  10. **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  First off, congratulations. After a year of querying, getting an offer is a massive hurdle cleared. It validates that the book works.

  The dilemma you are facing is actually the **standard rite of passage** for published authors. Almost everyone who gets an agent faces this exact "one bird in hand vs. two in the bush" scenario.

  There *is* a principled, industry-standard way to handle this. You do not have to guess, and you certainly do not have to choose between "blindly accept" and "rude rejection."

  Here is the framework for how to handle this professionally, ethically, and strategically.

  ### 1. The Golden Rule: Transparency is Expected
  There is a misconception among new authors that telling other agents you have an offer is rude or "playing games." **It is the opposite.** It is standard professional etiquette.

  Agents know that authors will query multiple people. They also know that if another agent makes an offer, it validates the work. When you tell the other dozen agents, "I have an offer on the table," you are not pressuring them; you are giving them the opportunity to compete if they want to.

  **The Action:** You need to email the other dozen agents immediately.
  *   **Who to tell:** Only agents who have the **full manuscript** (or partial, if that's where they are in the queue). There is no need to tell agents who only have a query letter; they are too early in the process.
  *   **What to say:** Keep it brief, professional, and polite. Give them a deadline (usually a few days before your actual deadline).
  *   **The Template:**
      > "Dear [Agent Name], I'm writing to let you know that I have received an offer of representation for my manuscript, [Title]. Since you currently have the full manuscript, I wanted to give you the opportunity to let me know if you are still interested before I make a decision. I have a deadline to respond to the offer on [Date - give them at least 1 week]. Please let me know if you'd like to remain in the running. Best, [Your Name]."

  **The Likely Outcome:**
  *   **Scenario A:** Some will reply immediately with a pass. (This is helpful; it narrows your field).
  *   **Scenario B:** Some will ask for more time to read because they want to make an offer. (This is what you want).
  *   **Scenario C:** Some will ghost you. (Treat silence as a pass).

  ### 2. Vet the "Decent" Agent Rigorously
  You described her as "decent" and at a "small agency." Do not let "small" equate to "worse." In fact, small agencies often provide more hands-on editorial attention and hustle harder for debut authors because every client matters more to their bottom line.

  However, "decent" is subjective. Before you sign (or even while you wait for the others to reply), you need to do due diligence:
  *   **Sales Records:** Check *Publisher's Marketplace*. Has she sold books recently? To the Big 5? To respected independent presses?
  *   **Client List:** Find her current clients on social media or their websites. **Reach out to them.** Ask: "Is she responsive? Does she edit heavily? How is her negotiation style?"
  *   **The Call:** You should have had a call with her. If you didn't, request one. Did she have an editorial vision for the book? Did you have chemistry?

  **Principle:** An agent who *loves* the book is often more valuable than a "dream agent" who thinks it's "pretty good." Passion is what sustains a submission through rejections from editors.

  ### 3. Evaluate the "Dream" Agents
  Why do you like the other dozen better?
  *   **Is it Prestige?** If it's just because they are at a bigger agency or represent your favorite famous author, be careful. A big name agent might not have time for you.
  *   **Is it Fit?** Do they represent your genre successfully? Do they have a specific vision for your career?

  If you notify the dream agents and none of them make a counter-offer, you have your answer: **This offering agent is the one who wants you the most.** In publishing, desire matters.

  ### 4. The Risk Assessment
  This is the emotional part.
  *   **Risk of Accepting:** You sign with Agent A. Six months later, you see Agent B (your dream) sign a book similar to yours. You wonder "what if."
  *   **Risk of Rejecting:** You turn down Agent A. The other 12 agents pass. You are back to square one, potentially burned out, with a "rejected" manuscript in the eyes of the industry (though you can revise and re-query later).

  **The Reality Check:** You have been querying for a year. The slush pile is brutal. Getting one offer is statistically significant. Getting two is rare. Getting three is a bidding war.
  *   If the other agents don't jump at the chance to bid against an offer, they weren't "dream agents" for *this* book.

  ### 5. My Recommendation
  Here is the principled path:

  1.  **Notify the other agents today.** Give them 7 to 10 days to respond (well within your 3-week window).
  2.  **Vet the offering agent** heavily during that week. Talk to her clients. Make sure she isn't "decent" but actually *good*.
  3.  **If a dream agent makes an offer:** Great! Now you have a choice based on concrete options, not hypotheticals. Compare the offers (advances, editorial style, communication).
  4.  **If no one else bites:** You have your answer. The "dream agents" did not love the book enough to fight for it. The agent who *did* fight for it is the one who will sell it. **Take the offer.**

  **The Hard Truth:**
  There is no rule that says "Don't sign with the first yes." That is superstition. The rule is "Don't sign with the *wrong* yes."

  If the offering agent is professional, has sales, communicates well, and loves the book, she is the right agent. The fact that she offered first proves her enthusiasm. In a market this tough, enthusiasm is the currency that buys your career.

  **Summary:** Use the 3 weeks. Notify the others. Vet the offer. If no counter-offers appear, sign with the person who raised their hand. Momentum is a writer's best friend.
