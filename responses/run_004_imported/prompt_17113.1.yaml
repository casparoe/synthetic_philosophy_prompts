prompt: |-
  I somehow ended up on my university's academic-integrity board this year (don't ask). Current case: a TA reported an undergrad in his section for handing in a lab report written with an undisclosed AI tool -- a clear violation. Except it's just come out, via a leaked group chat, that the TA used an undisclosed AI tool on his own term paper last year, as a student in a different class. Half the board wants to dismiss the complaint outright, since the guy has no standing to nail someone for the exact thing he did himself; the other half says thats a seperate matter -- it's the undergrad on trial here, not the TA. Our bylaws just say a complaint can come from 'any member of the university community' and don't say anything about the complainant's own record. Can you draft the memo I'll bring to Monday's meeting? I need an actual recommendation, not a summary of both sides, and whichever way you land, engage seriously with the losing argument instead of waving it off.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the university's academic-integrity board.
      *   **Task:** Draft a memo for the upcoming Monday meeting regarding a specific case.
      *   **Case Details:** An undergrad is accused of using undisclosed AI in a lab report (violation). The TA who reported them allegedly used undisclosed AI in their own term paper last year (also a violation).
      *   **Conflict:** Half the board wants to dismiss based on the TA's lack of standing/hypocrisy ("unclean hands"). The other half says the TA's conduct is irrelevant to the student's guilt.
      *   **Bylaws:** Complaints can come from "any member of the university community." No mention of the complainant's record.
      *   **Requirements:**
          *   Provide an *actual recommendation* (not just "on the one hand, on the other").
          *   Engage seriously with the losing argument (don't wave it off).
          *   Tone: Professional, legalistic but accessible, persuasive, ethical.

  2.  **Determine the Recommendation:**
      *   *Option A: Dismiss the case.*
          *   Pros: Upholds moral consistency, discourages hypocritical enforcement, protects student from biased accuser.
          *   Cons: Undermines the integrity policy (violations are still violations), punishes the community by letting a violation slide, sets a precedent that rule-enforcers must be perfect (which is impossible), bylaws don't support it.
      *   *Option B: Proceed with the case (but address the TA separately).*
          *   Pros: Upholds the rule of law (violations are objective), adheres to bylaws, ensures the student is judged on their own merit, allows for parallel investigation of the TA.
          *   Cons: Looks hypocritical, might feel unfair to the student, damages trust if not handled carefully.
      *   *Decision:* Option B is the stronger legal and procedural position. Academic integrity is about the *work*, not the *accuser*. Dismissing a valid violation because the accuser also violated rules creates a "whoever smells least bad wins" system, which erodes standards. However, the "unclean hands" argument needs to be treated with gravity because it touches on fairness and bias.
      *   *Refinement:* The recommendation should be to *proceed* with the student's hearing but *simultaneously* refer the TA's conduct to the appropriate body, ensuring the student knows the TA's conduct is being addressed so it doesn't look like a witch hunt by a privileged actor.

  3.  **Drafting Strategy - Structure of the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **Factual Background:** Briefly summarize the situation (Student AI use, TA AI use, Bylaws).
      *   **Analysis/Argument:**
          *   Why we must proceed (Bylaws, Objectivity of Violations).
          *   Engaging the Counter-Argument (The "Unclean Hands" / Standing issue). Acknowledge its moral weight but explain why it fails procedurally and practically.
          *   The Path Forward (Mitigating the unfairness).
      *   **Recommendation/Action Items:** Specific steps for the board.
      *   **Closing:** Professional sign-off.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard memo format.
      *   *Subject Line:* Needs to be clear. "Recommendation regarding Case [X] and Complainant Conduct."
      *   *Opening:* "I recommend we proceed..."
      *   *The "Why" (Procedural):* The bylaws say "any member." They don't say "any *perfect* member." The violation exists independently of the accuser.
      *   *Engaging the Counter-Argument:* This is crucial. I need to validate the board members who want to dismiss. It *does* feel unfair. It *does* look bad. It creates a perception of bias. I need to explain why dismissing is worse (creates impunity, shifts focus from student's work to TA's history).
      *   *The Solution:* We can't ignore the TA's behavior. We need a parallel process. This neutralizes the "hypocrisy" claim without letting the student off for a violation they committed.
      *   *Tone Check:* Needs to be firm but empathetic. Not bureaucratic gibberish.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Initial thought:* Maybe suggest reducing the student's penalty?
      *   *Correction:* No, that compromises the integrity finding. The student's penalty should be based on their violation. The TA's penalty is separate. Mixing them muddies the water.
      *   *Focus:* Keep the focus on *process*. The board's job is to adjudicate the student's case. Another body (or the same board in a different capacity) handles the TA.
      *   *Key Phrase:* "Integrity is not a zero-sum game." (Maybe too cliché). Let's try: "The validity of a rule does not depend on the virtue of the enforcer."

  6.  **Final Polish:**
      *   Check against constraints: Did I give a recommendation? Yes. Did I engage the losing argument? Yes. Is it memo format? Yes.
      *   Ensure the distinction between the *adjudication of the violation* and the *credibility of the witness* is clear. The TA is a witness/reporter, not the judge.

  7.  **Final Review of the "Losing Argument":**
      *   I need to make sure I don't just say "Bylaws say no." I need to acknowledge the *principle* of equity. If the TA gets a pass, why shouldn't the student? The answer must be: The TA *won't* get a pass. They will be charged separately. That resolves the equity issue without dismissing the current case.

  8.  **Constructing the Output:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name/Board Member]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Case #2023-44 (Student Conduct) and Complainant Status

  **Opening Recommendation**

  I recommend that the Board **proceed with the adjudication of the undergraduate student's case** based on the evidence provided, without dismissing the complaint on the grounds of the Teaching Assistant's prior conduct. However, I further recommend that the Board immediately initiate a separate, parallel inquiry into the TA's alleged violation and formally communicate this action to the accused student.

  We cannot dismiss a substantiated violation of academic policy solely because the accuser is also accused of a violation. To do so would undermine the University's integrity standards more severely than proceeding with the case while addressing the TA's conduct separately.

  **Factual and Procedural Context**

  The current bylaws state that a complaint may be lodged by "any member of the university community." They do not stipulate that the complainant must have an unblemished record, nor do they provide a mechanism for dismissing a case based on the complainant's "unclean hands."

  We are faced with two distinct alleged violations:
  1.  The undergraduate's use of undisclosed AI in a current lab report.
  2.  The TA's use of undisclosed AI in a past term paper.

  **Argument for Proceeding**

  The primary function of this Board is to determine whether a violation of the Academic Integrity Policy occurred. This is an objective inquiry regarding the work submitted by the student. The existence of a violation is independent of the moral standing of the person who reported it.

  If we dismiss Case #2023-44, we establish a precedent that policy enforcement is contingent upon the personal virtue of the enforcer. This creates a "tu quoque" loophole where any accused student could avoid accountability by uncovering any infraction committed by their instructor, TA, or peer reporter. This would effectively paralyze the integrity system, shifting hearings from an examination of evidence to an examination of the accuser's history.

  Furthermore, dismissing the case does not actually solve the ethical problem; it merely compounds it. It results in two unpunished violations (the student's and the TA's) rather than one. It signals that if enough people break the rules, the rules cease to apply.

  **Engaging the Counter-Argument (The "Standing" Objection)**

  I want to address the arguments raised by my colleagues who favor dismissal seriously. The position that the TA lacks standing is not legally frivolous; it is morally intuitive. It rests on the principle of equity: *It is fundamentally unfair for an individual to enforce a rule they have secretly broken.*

  There is validity to the concern regarding bias. A TA who has used AI may be hyper-vigilant in detecting it to deflect suspicion from themselves, or they may be enforcing a standard they do not personally respect. This creates a perception of a "witch hunt" rather than a good-faith effort to uphold standards. If the Board proceeds without acknowledging this, we risk appearing complicit in a hypocritical power dynamic, which damages the Board's legitimacy and the trust students place in this process.

  The concern is not that the student is innocent; the concern is that the *process* feels tainted. Ignoring this perception is a mistake. Students need to believe that integrity is a community value, not a weapon used by the privileged against the vulnerable.

  **The Path Forward: Parallel Accountability**

  We can resolve the equity concern without violating our bylaws or abandoning the integrity policy. We do this by decoupling the two cases while acknowledging their connection.

  1.  **Proceed with the Student Case:** The evidence regarding the student's lab report must be evaluated on its own merits. If the evidence proves AI usage, a sanction is required to maintain the value of the degree for all students.
  2.  **Refer the TA:** The Board must treat the leaked information regarding the TA as a formal complaint. The TA should be subject to the same scrutiny and potential sanctions as the undergraduate.
  3.  **Transparency:** We must inform the undergraduate that while their case is proceeding, the TA's conduct is also under active investigation. This assures the student that the Board is not ignoring the hypocrisy, even if it cannot dismiss the charge.

  **Conclusion**

  Integrity is not a zero-sum game. Holding the student accountable does not require letting the TA off the hook, and holding the TA accountable does not require letting the student off the hook.

  By proceeding with the student's hearing while simultaneously charging the TA, we uphold the bylaws, maintain the objectivity of the policy, and address the legitimate moral concerns regarding equity. Dismissing the case would protect the Board from short-term awkwardness but cause long-term damage to the University's academic standards.

  I look forward to discussing this approach on Monday.
