answer: |-
  My dear child, and you, Monsieur, who now share her name.

  We are told that marriage is a temple of duty. And so it is. But a temple without light is a crypt. So my advice is not of obligation, but of *taste*. For happiness is not a prize the heavens owe us; it is a structure we must build ourselves, brick by brick, often against the wind.

  To my daughter, I say this: The world will show you its sharp edges. Your husband will be human, which is to say, imperfect. Do not sharpen your eyes to see every flaw. Instead, cultivate a generous blindness. There are fictions we must tell ourselves to make the truth bearable. Call it charity if you wish; I call it the only way to keep the heart soft. Do not seek the truth where a beautiful illusion will keep the peace.

  And never, ever let your mind grow idle. Beauty fades, and novelty is a gambler's coin—it always runs out. But your reason, your curiosity? These are estates that grow when you tend them. When the house is quiet and the world feels dull, do not sigh for amusement. Open a book. Solve a problem. Find a new language. A passion for knowledge is the only lover that never grows cold and the only shield against boredom.

  There will be those who tell you to suppress your vivacity, that a woman's peace lies in silence. They are wrong. A life without passion is a garden without water. But be the master of your passions, not their servant. Direct that fire into your home, your interests, your affections.

  If you can learn to deceive yourself gently, to find pleasure in what you have rather than torment in what you lack, and to keep your intellect sharp as a blade... then you need not pray for happiness. You will have built it.

  To the bride.
