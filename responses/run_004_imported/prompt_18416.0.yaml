answer: |-
  **Setting:** *A dimly lit common room, Oxford, 1958. The air is thick with pipe smoke. H.L.A. Hart sits in a leather armchair, nursing a sherry. Lon L. Fuller paces near the fireplace, holding a sheaf of papers.*

  **Fuller:** You're dodging the crux of the matter, Herbert. In this Grudge Informer case, the woman cited the Nazi statutes of 1934. She claimed she did nothing wrong because she upheld the law of the land. And you say we must nod and agree? That those statutes were "law"?

  **Hart:** I say we must have the courage to call a spade a spade, Lon. The statutes were enacted by a sovereign power, recognized by the courts, and obeyed by the populace at the time. To say they were not law is to confuse what the law *is* with what the law *ought* to be. The woman acted according to valid rules. If we wish to punish her now, because those rules offend our moral conscience, we should pass a retroactive statute. We should admit we are sacrificing the principle of non-retroactivity to achieve justice.

  **Fuller:** And that honesty you prize so highly comes at the cost of truth! You treat law as a one-way projection of authority. But law is a cooperative enterprise. It has an inner morality. If a regime fails the eight desiderata of legality, it doesn't just produce bad law; it produces something that is not law at all.

  **Hart:** Eight commandments for a bureaucracy?

  **Fuller:** Conditions for the very existence of law! Look at the Nazi regime.
  One: **Generality**. They ruled by specific decrees against enemies of the state, not general rules.
  Two: **Promulgation**. How many statutes were secret? Hidden in files until the knock on the door came?
  Three: **Non-retroactivity**. They applied penalties to acts that were legal when committed.
  Four: **Clarity**. The language was deliberately vague—"healthy public sentiment"—so any judge could twist it.
  Five: **Non-contradiction**. The Party will contradicted the Statute law constantly.
  Six: **Possibility of Compliance**. They demanded citizens report thoughts, not just acts. You cannot comply with a rule to police your neighbor's mind.
  Seven: **Constancy**. The rules changed daily, based on the Führer's whim.
  And Eight, the most vital: **Congruence**. The officials did not act according to the declared rules. They acted according to terror.

  **Hart:** I grant you the Nazi system was iniquitous. But surely you see the danger in your approach? If a judge in 1946 can declare a 1934 statute "not law" because it fails your moral test, what security does any citizen have? You give judges a license to invalidate any statute they find distasteful by claiming it lacks "inner morality." You undermine the certainty of law itself.

  **Fuller:** Certainty for whom, Herbert? For the informer? She relied on a system that had already abandoned the reciprocity between ruler and ruled. Law implies a fidelity. When the state treats the citizen as an object to be crushed rather than a responsible agent, the bond is broken. The Nazi edicts were not rules to guide conduct; they were instruments of terror. To call them "law" dignifies them. It suggests the woman had a *duty* to inform. She did not. She participated in a perversion.

  **Hart:** But consider the alternative. If we say the Nazi statutes were nullities, then technically, the convictions they handed down were void. Does that mean we release the war criminals they convicted? No. We selectively invalidate the law only when it suits our moral purpose. That is dishonest. My way—the positivist way—protects the future. We tell the German people: "The old law was valid, but it was wicked. We are passing a new law to punish this specific wickedness, knowing we stretch back in time." It preserves the distinction between legal validity and moral merit. It teaches that law can be law and still be too evil to obey.

  **Fuller:** It teaches coldness. It tells the soldier, the clerk, the informant: "I was just following the law." Your separation thesis provides the perfect shield for the banality of evil. By insisting the Nazi statutes were legally valid, you force the post-war court to lie and say, "Oh, we interpret the 1871 Penal Code to have overridden the 1934 Statutes all along." They do exactly what you accuse them of! They twist the old law to avoid your "honest" retroactivity.

  **Hart:** They do so because retroactivity is bitter medicine. But at least my theory admits the bitterness. Yours pretends the poison was never poured.

  **Fuller:** No. Mine says the bottle was never filled. A system that utterly fails congruence and promulgation is not a legal system. It is a regime of force.

  **Hart:** *(Leans forward, setting down his sherry)* Let us test that fidelity of yours, Lon. Let us fast forward. Imagine a new division. Not Nazi, but Communist. The German Democratic Republic. The Berlin Wall.

  **Fuller:** I am listening.

  **Hart:** Consider the border guards. Young men, stationed at the Wall. They have orders. Written orders. Signed by the National Defense Council. "Use your firearm to prevent border breaches." They shoot a boy trying to swim to the West. Ten years later, the Wall falls. The regime collapses. The new government puts the guard on trial.
  Under my view, the GDR was a sovereign state. It had a rule of recognition. The Politburo's orders were valid law within that system. The guard followed the law. To punish him, the new court must admit it is applying West German standards retroactively. It must say, "You did nothing illegal *then*, but it is so unjust that we will punish you *now*."

  **Fuller:** And under my view? We ask: Did the GDR maintain the inner morality of law?
  Did they have **congruence**? Their Constitution guaranteed human dignity and freedom of movement. Yet the Politburo issued secret orders to shoot.
  Did they have **promulgation**? The "shoot to kill" order was often verbal, classified, denied to the public.
  Did they have **possibility of compliance**? A guard cannot protect a border and respect human rights if the state demands he violate one to secure the other.
  If the GDR's own supreme law promised rights their lower orders violated, there is no congruence. The order to shoot was not law. It was a gangster's command. The guard enforced a non-law. He is culpable.

  **Hart:** But there is the rub, Lon. The guard is a private. A low-level functionary. He does not see the contradiction between the Constitution and the Politburo order. He sees the gun in his hand and the sergeant at his back.
  If you say the order "wasn't law," you place the burden of judging the regime's legitimacy on the poorest, least educated actor in the chain.
  If I say it "was law," I acknowledge the tragedy. I admit the state trapped him. I admit that to punish him is to prioritize justice over legality. It is a moral sacrifice.
  Your way lets the court feel virtuous. "We aren't being retroactive! The law was always on our side!" But it ignores the reality the guard lived. He lived in *my* world, Lon. He lived in a world where wicked commands were valid law.

  **Fuller:** And if we accept your world, Herbert, we tell every future tyrant: "Write it down. Sign it. Publish it in the official gazette. Then you can make murder legal."
  If the guard claims "I followed the law," we must be able to say, "There was no law." Not because we are rewriting history, but because a command to execute an unarmed fugitive without trial violates the very purpose of law, which is to subject human conduct to rules.
  If we let the guard go because "it was valid law," we validate the system that made him a cog in a killing machine.

  **Hart:** And if we hang him because "it wasn't law," when he has a pocket full of orders saying it was, we make a mockery of the rule of law for the sake of retribution.
  *(Hart pauses, looking into the fire)*
  My logic implies the guard is legally innocent, though morally complicit. We must punish him only if we are willing to stain our own hands with retroactivity to do it. We must admit we are doing something exceptional.

  **Fuller:** And my logic implies the guard is legally culpable, because he served a system that had abdicated its claim to legality. He wasn't a soldier enforcing law; he was a thug enforcing will.
  *(Fuller turns to Hart)*
  But I will concede this, Herbert. If the GDR had openly amended their Constitution to say "Guards may shoot fugitives," and published it... if they maintained **congruence** between their supreme rules and their actions...

  **Hart:** Then it would be law?

  **Fuller:** Then it would be law. Wicked, abominable law. But law. And then, Herbert, I would be in your boat. I would have to demand a retroactive statute to punish them.

  **Hart:** *(A faint smile)* Then we are not so far apart. We both agree that when the law is wicked enough, justice may require breaking the rules of legality to punish it. I just insist we call it breaking the rules. You insist on calling it... enforcing the true rules.

  **Fuller:** I insist on calling it recognizing that some commands are so devoid of the inner morality that they never entered the realm of law to begin with.

  **Hart:** For the sake of the guards, and the uncles who manned the towers... let us hope we never have to decide which of us is right again.

  **Fuller:** Agreed. But if we do... I'd rather be the one telling them there was no duty to shoot.

  **Hart:** And I'd rather be the one telling them there was a duty, but that humanity demands they pay for it nonetheless.

  *(Hart raises his glass. Fuller nods. They drink in silence.)*
