      *   *The Weighing Scale:* To believe a miracle, the evidence *for* it (testimony) must be stronger than the evidence *against* it (uniform experience). Hume argues this is practically impossible because testimony is always fallible.
      *   *Criteria for Credible Testimony:*
          1.  Number of witnesses.
          2.  Integrity/Character (no motive to lie).
          3.  Education/Status (not gullible).
          4.  Public nature of the event (hard to fake).
          5.  Lack of conflicting testimony.
      *   *The "Indian Prince" Problem:* Hume acknowledges that sometimes skepticism is just ignorance (the prince who never saw water freeze). If the "law of nature" is based on limited experience, testimony *can* overcome it. But if the law is based on universal experience, testimony cannot.

  3.  **Apply Hume's Framework to the UAP Scenario:**
