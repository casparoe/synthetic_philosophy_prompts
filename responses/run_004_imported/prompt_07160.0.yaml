  5.  **Refining the "Definability" Point:**
      *   Why is "definability" wrong? Consider a model $M$. There are only countably many formulas. There are uncountably many sets in the "real" universe (usually). But even in a countable model, there are uncountably many subsets of the domain *from the outside*, but only countably many *inside*. The missing bijection is a subset of $M \times M$. It's not in $M$. Whether it's definable is a separate issue. A set can be in $M$ without being definable. The bijection is not in $M$.
      *   *Correction:* It's about the *resources available within the model*, not just linguistic definability.

