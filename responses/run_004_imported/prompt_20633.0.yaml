  7.  **Final Polish:** Organize into clear sections: The Theoretical Mechanism, Why It's Not a Quirk, Empirical Reality, and Implications for *Ramos*. (This matches the structure of the final output).

  8.  *(Final thought)*: Make sure to mention that the result depends on the relative cost of Type I vs Type II errors. If jurors are extremely averse to convicting the innocent, the strategic effect diminishes.

