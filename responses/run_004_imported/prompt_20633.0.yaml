          *   Nuance: Non-unanimous rules reduce the "pivotal" inference problem but lower the threshold for conviction directly.
      *   **Conclusion:** The model isn't "wrong," but it describes a specific equilibrium that relies on strong rationality assumptions. The intuition (unanimity protects the innocent) holds under sincere voting but fails under hyper-rational strategic voting. The truth is likely in the middle.

  5.  **Refining the Tone:**
