answer: |-
  This is a classic tension in formal judicial politics, and your intuition is wrestling with one of the most famous results in the field: **Feddersen and Pesendorfer (1998), "Convicting the Innocent: The Inferiority of Unanimous Jury Verdicts under Strategic Voting."** (Though Austen-Smith and Banks (1996) laid the groundwork).

  You are correct that under the standard Condorcet Jury Theorem (CJT) assumptions—specifically **sincere voting**—unanimity rule strictly dominates majority rule regarding the protection of the innocent. If jurors simply report their signals, the probability that *all* $n$ jurors receive a false "guilty" signal is $(1-p)^n$, which vanishes exponentially as $n$ increases.

  However, the Feddersen and Pesendorfer (F&P) result is not a model "quirk" in the sense of a mathematical artifact; it is a robust feature of **common-value games with strategic voting.** The disconnect you are feeling stems from the shift from *sincere* voting (CJT) to *strategic* voting (Game Theory).

  Here is the breakdown of why the logic holds formally, why it feels counterintuitive, and where the model meets reality.

  ### 1. The Mechanism: Pivotality and Information Aggregation

  Your intuition rests on the idea that the decision rule doesn't change the private signal. That is true. But under strategic voting, the decision rule changes the **inference a juror draws from the event that their vote matters.**

  In a common-value setting (where all jurors want to convict if and only if the defendant is actually guilty), a rational juror does not ask, "What does my signal say?" They ask, "Given that my vote is pivotal, what is the probability the defendant is guilty?"

  *   **Under Majority Rule:** I am pivotal if the vote is split (e.g., 6-5 in a 12-person jury). This implies the evidence is ambiguous. If I hold an "innocent" signal, the split vote reinforces my belief that the defendant might be innocent. I vote my signal.
  *   **Under Unanimity Rule:** I am pivotal only if **everyone else** has voted to convict (11-0).
      *   If 11 other rational jurors have voted to convict, they must have received "guilty" signals (in equilibrium).
      *   If I hold a single "innocent" signal against 11 "guilty" signals, Bayesian updating suggests *my* signal is likely the error, not theirs.
      *   Consequently, even with an "innocent" signal, the conditional probability of guilt given the pivotal event (11 others voting guilty) may exceed the threshold of reasonable doubt.
      *   To avoid the Type II error (acquitting a guilty person when 11 others say otherwise), the rational juror votes "Guilty."

  This is the **"swing voter's curse."** Under unanimity, the only time your vote stops a conviction is when the collective evidence against the defendant is overwhelming. Rational jurors anticipate this and "rubber stamp" convictions to avoid hanging a jury that, based on the aggregate information, likely contains a guilty defendant.

  As $n \to \infty$, F&P show that under unanimity with strategic voting, the probability of conviction converges to 1 **regardless of the true state**. Information aggregation fails completely. Under majority rule, information aggregation remains efficient.

  ### 2. Is It a "Quirk" or a Feature?

  You asked if this exploits a quirk of the model. It exploits a specific assumption: **Common Values + Rational Expectations.**

  It is not a mathematical error, but it relies on a very strong epistemic assumption: that jurors treat their fellow jurors as perfect Bayesian updaters who are also playing the same equilibrium strategy.

  *   **Why it feels wrong:** In reality, jurors often view their role as a moral duty to vote their conscience (sincere voting), not as a mechanism design problem. If jurors vote sincerely, your CJT intuition holds: Unanimity protects the innocent.
  *   **Why the model matters:** It highlights that unanimity creates a perverse incentive structure. It places the entire burden of acquittal on the single most skeptical juror, but isolates them epistemically. If that juror believes their colleagues are competent, the pressure to conform strategically is immense.

  So, the result says: *If* jurors are hyper-rational strategic actors concerned with the outcome rather than the act of voting, unanimity destroys information aggregation.

  ### 3. Empirical and Experimental Evidence

  Does this happen in the real world? This is where your skepticism is well-placed.

  *   **Lab Experiments:** Guarnaschelli, McKelvey, and Palfrey (2000) tested F&P predictions experimentally. They found evidence of strategic voting, but **not enough to replicate the full F&P collapse.** Jurors did condition on pivotality, but they also retained a significant preference for sincere voting. Unanimity still resulted in fewer wrongful convictions than majority rule in the lab, though the gap was narrower than CJT predicted.
  *   **Field Data:** Real juries deliberate. The F&P model is a "secret ballot" model (no communication). Deliberation allows jurors to share signals directly rather than inferring them from votes. If jurors can say, "I saw X, which made me think Innocent," the informational asymmetry that drives the strategic result dissolves.
  *   **Preference Heterogeneity:** F&P assumes common values. If jurors have private values (e.g., some are inherently more conviction-prone due to ideology or experience), the strategic calculus changes. Recent work (e.g., by Meirowitz or others in the political economy of law) suggests that with heterogeneous preferences, unanimity can actually restore some protection for the innocent because the "pivotal" juror might be one with a high threshold for conviction, not just a random signal holder.

  ### 4. Implications for *Ramos* and Your Project

  For your work at the intersection of formal theory and judicial politics, this tension is the sweet spot.

  1.  **The *Ramos* Logic:** The *Ramos* decision was not based on information aggregation or CJT logic; it was based on the historical origins of non-unanimous juries (racism and anti-Catholic nativism) and the fundamental right to a jury trial. The Court did not rule that 12-0 is more *accurate* than 10-2, but that it is more *legitimate*.
  2.  **The Formal Theory Contribution:** Your project can use the F&P result to complicate the narrative.
      *   *Standard View:* Unanimity = Higher Burden of Proof = Fewer Wrongful Convictions.
      *   *Formal View:* Unanimity = Strategic Conformity = Potential Information Loss.
      *   *Synthesis:* Non-unanimous rules (like 10-2) lower the formal burden of proof (bad for defendants) but may reduce the strategic pressure to conform (good for information aggregation).
  3.  **The "Mistake" Your Advisor Mentioned:** Your advisor is likely pointing out that extending CJT (sincere voting) to institutional comparisons (unanimity vs. majority) without accounting for strategic voting is the "mistake." In formal theory, you cannot compare institutions assuming agents behave naively in one and rationally in the other. If you assume rationality, the CJT intuition about unanimity protecting the innocent **breaks down.**

  ### Summary

  Your extension of the CJT is correct **conditional on sincere voting.** The paper your advisor cited is correct **conditional on strategic voting.**

  The "mistake" is assuming that the CJT logic (sincere voting) is the appropriate baseline for institutional design. Formal theorists argue that because the stakes are high and the decision is collective, strategic behavior is the relevant equilibrium concept.

  **Recommendation for your work:**
  Don't dismiss the F&P result as a quirk. Instead, treat the *degree* of strategic voting as an empirical parameter.
  *   If jurors behave like CJT agents (sincere), *Ramos* (unanimity) minimizes Type I errors.
  *   If jurors behave like F&P agents (strategic), *Ramos* might actually increase Type I errors relative to a super-majority rule (e.g., 10-2), even as it raises the formal burden of proof.

  This allows you to argue that the *benefit* of *Ramos* relies on the empirical reality that jurors are **not** fully rational strategic actors—they are boundedly rational, norm-following citizens. If they were perfect game theorists, *Ramos* might not protect the innocent as well as we hope. That is a powerful political science insight.
