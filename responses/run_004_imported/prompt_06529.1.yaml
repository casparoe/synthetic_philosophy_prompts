answer: |-
  **Title:** The Dynamic Mercantilist: Why Hume Never Truly Left the Building

  **The Verdict**
  Your insufferable dinner-party professor is half-right, but ultimately dogmatic. David Hume did not make a clean break from mercantilism. While he successfully demolished the mercantilist *metaphysics* (the idea that gold is wealth), he retained the mercantilist *engine* (the idea that money supply drives real industry). Hume is not the saint of laissez-faire purity your character claims; he is a **dynamic mercantilist**. He replaced the static hoarding of bullion with a theory of dynamic monetary stimulus. The "worm" your novelist's intuition detected is not a bug in Hume's system; it is the feature that makes the system work. To claim Hume "solved" the debate is to ignore the very mechanism he proposed for national prosperity.

  **The Case for the Clean Break**
  To understand why the professor believes what he does, we must grant the strongest version of his argument. In *Of the Balance of Trade*, Hume delivers the famous *price-specie-flow mechanism*. He argues that money is like water: it seeks its own level. If England has too much gold, prices rise, exports become expensive, imports become cheap, and gold flows out to France until equilibrium is restored. Conversely, if England is poor in specie, prices fall, goods become competitive, and gold flows in.

  In this framework, the mercantilist obsession with a positive balance of trade is futile. You cannot hoard gold permanently because the market self-corrects. Furthermore, in *Of the Jealousy of Trade*, Hume attacks the zero-sum mindset. He argues that the prosperity of neighbors is an advantage, not a threat, because rich neighbors create demand for your goods and emulate your industry. "The increase of riches and commerce in any one nation," Hume writes, "instead of hurting, commonly promotes the riches and commerce of all its neighbours."

  Read in isolation, these passages look like a total repudiation of mercantilism. They suggest that trade policy is impotent and that money is neutral. This is the Hume of the economics textbook: the man who proved that protectionism is a fool's errand because the balance of trade regulates itself. If this were the whole story, your professor would be correct. Hume would have shown that worrying about trade deficits is like worrying about the tide; it is a waste of breath.

  **The Worm in the Apple**
  However, your novelist's close reading of *Of Money* exposes the crack in the foundation. Hume does not stop at the long-run neutrality of money. He explicitly argues that the *short-run* non-neutrality of money is where the actual benefit to a nation lies.

  Hume writes: *"It is only during the interval, while the increasing money is yet at work, that things are so favourable to industry."*

  This is the smoking gun. Hume argues that when new money enters a nation, it does not instantly raise all prices proportionally. It circulates sector by sector. The first recipients of the new money (manufacturers, merchants) have more cash to spend before prices have risen. This stimulates demand and encourages laborers to work harder. Hume posits that a nation is not best off when it has the *most* money, nor when it has the *equilibrium* amount, but when it has a *growing* amount.

  He goes further, stating: *"A nation, whose money decreases, is actually, at that time, weaker and more miserable than another nation, which possesses no more money, but enjoys the same share of it."*

  This contradicts the "clean break" narrative. If money were truly neutral, a decreasing stock would only mean lower nominal prices, not misery. Hume is admitting that monetary contraction causes real economic pain and monetary expansion causes real economic gain. This is not the logic of a free-trade purist who believes the market allocates resources efficiently regardless of the monetary veil. This is the logic of a stimulus advocate.

  The mercantilists wanted a *high level* of money. Hume wanted a *rising flow* of money. But both agree on the fundamental premise: the quantity of money directly impacts the vitality of domestic industry. Hume did not kill the idea that money matters for real output; he merely temporalized it. He shifted the goal from "accumulate gold" to "ensure inflation."

  **The Anxiety of Competitiveness**
  The "worm" crawls further out in *Of the Jealousy of Trade*. While Hume preaches against fearing rich neighbors, he betrays a distinct anxiety about wage competitiveness. He acknowledges that as a nation grows rich, wages rise, and this can price its manufacturers out of the global market.

  He writes: *"I am afraid... that our manufacturing superiority... may not be perpetual."* He worries that low-wage nations will eventually undercut high-wage nations, causing industry to migrate. This admission undermines the idea that trade is purely cooperative. It admits that there is a competitive struggle for the *location* of industry, and that a nation can "lose" this struggle if its costs get too high relative to its neighbors.

  If trade were truly a positive-sum game where everyone benefits regardless of specialization, the migration of manufacturing wouldn't be a source of anxiety. Hume's worry reveals that he views the retention of industry as a vital national interest. He doesn't advocate tariffs to keep it (he thinks that's counterproductive), but he admits the vulnerability. This is a mercantilist concern wrapped in free-trade language. He wants the benefits of open trade without the risk of deindustrialization, a square he never truly circles.

  **The Final Judgment**
  So, did Hume make a clean break? No. He performed a transplant. He removed the heart of mercantilism (bullionism) but kept its nervous system (the belief that monetary conditions dictate industrial health).

  Your professor's claim that Hume "solved" the fight is historically and theoretically inaccurate. Hume did not solve the fight; he moved the battlefield. Before Hume, the debate was "How do we get more gold?" After Hume, the debate became "How do we manage the monetary transition to keep industry stimulated without causing destabilizing inflation?"

  The "mercantilist worm" is the recognition that the transition period *is* the economy. Since economies are always in transition, the "long run" neutrality of money is a theoretical abstraction, while the "short run" stimulus is the lived reality. By admitting that a nation is better off with rising money than stable money, Hume validated the core mercantilist intuition that state prosperity is tied to monetary expansion, even if he rejected the policy of hoarding.

  **Advice for the Novelist**
  Your character, the retired professor, is a tragic figure. He worships a Hume that doesn't exist—a Hume of pure, frictionless equilibrium. The *real* Hume is messier, more pragmatic, and more aware of the pain of adjustment.

  If you want to write this character honestly, give him a moment of vulnerability. Let him insist Hume ended the debate, only to be cornered by a graduate student quoting *Of Money* back to him about the "interval." The character's insufferability shouldn't come from his knowledge, but from his refusal to acknowledge Hume's own caveats. He loves Hume the Icon, not Hume the Writer.

  **The Bottom Line:** Hume is not the father of free-trade orthodoxy. He is the father of monetary activism. The worm is real, it is alive, and it is eating the professor's argument from the inside out.
