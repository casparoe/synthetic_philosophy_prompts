      *   **Jealousy of Trade Revisited:** Hume worries about high wages driving industry away. This admits that competitiveness *is* a thing, contradicting the idea that trade is purely cooperative.
      *   **The Verdict:** The professor is insufferable because he's simplifying. Hume didn't end the debate; he complicated it. He shifted the goal from "accumulate gold" to "manage the transition."
      *   **Conclusion:** Final punchline for the novelist. The character should be portrayed as dogmatic, ignoring Hume's own caveats.

