prompt: |-
  Ok, slightly weird research question, bear with me. I'm writing a novel with a character -- a retired econ professor, insufferable at dinner parties -- who keeps insisting Hume basically solved the free-trade-vs-protectionism fight 250 years ago and everyone since has just been re-deriving him badly. I went and actually read "Of the Balance of Trade," "Of the Jealousy of Trade," and "Of Money" so I could write him honestly, and now I'm not sure his hero-worship holds up. Hume mocks the mercantilists for hoarding specie and fearing trade deficits, and shows the whole thing self-corrects -- fine, thats the famous bit. But he also argues a nation is better off while its money supply is actively rising, not just large, since prices lag behind the new money and give local industry a real edge in the meantime -- which sounds like the same relative-advantage-over-the-neighbors logic he's supposed to have killed off. And in the jealousy of trade essay he's still visibly nervous rich countries might lose manufacturing to cheaper rivals. So: did Hume actually make a clean break from mercantilism, or is there a mercantilist worm still living inside his own theory of money and trade? Write an essay that actually commits to an answer. Feel free to grant the strongest version of the "clean break" reading before you argue past it, but don't let the thing end in mush-in-the-middle -- I want a real verdict and the reasoning behind it, grounded in what's actually in the essays, not the textbook summary.
