  2.  **Deconstruct the Core Conflict:**
      *   *The "Clean Break" View:* Hume introduced the Price-Specie Flow Mechanism. He argued money is neutral in the long run. Hoarding gold is useless because prices rise, exports fall, imports rise, and gold flows out. Trade is positive-sum ("Jealousy of Trade"). This is the standard Econ 101 narrative.
      *   *The "Mercantilist Worm" View:* Hume explicitly states in "Of Money" that it's best for a nation if money is *increasing*. During the transition period, industry is stimulated because prices lag behind money supply. He also expresses concern in "Jealousy of Trade" about advanced nations losing their edge to low-wage competitors. This suggests short-run non-neutrality matters significantly, and national competitiveness is still a zero-sum-ish concern.

  3.  **Formulate the Thesis:**
      *   I need a verdict. Is the character right or wrong?
