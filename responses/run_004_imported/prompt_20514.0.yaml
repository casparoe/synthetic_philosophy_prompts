      *   *Norcross:* Focus on the "arbitrary cutoff." If a headache isn't worse than a hangover, and a hangover isn't worse than a broken finger... where do we stop? Norcross says we can't stop.
      *   *Temkin:* This is the crux. If A is slightly worse than B, and B slightly worse than C... eventually Z is dust specks. If Torture is A, and Specks is Z. Transitivity says A > Z. But Lexical Priority says A > *any number* of Z. Temkin says you can't have it both ways without breaking logic.
      *   *My Move:* I'm keeping Lexical Priority. I'm breaking Transitivity. I need to justify why logic bends to morality here. Maybe cite Temkin's "Rethinking the Good." The relation "all things considered worse than" is not necessarily transitive in moral contexts involving different *kinds* of badness.
      *   *Refining the Verdict:* It's not just "Dust Specks." It's "Dust Specks because torture is lexically superior, even if it makes 'worse than' intransitive."

  6.  **Review against Constraints:**
