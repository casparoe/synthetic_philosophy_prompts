      *   **Section 3: Defending Intransitivity.**
          *   Why is transitivity less important than the prohibition on torture?
          *   Distinguish between "better than" in preference vs. "worse than" in moral status.
          *   Argue that moral categories (kinds of harm) matter more than cardinal sums.
      *   **Conclusion:**
          *   Restate verdict.
          *   Reiterate the cost (Transitivity).
          *   Final thought on the nature of moral reasoning.

  5.  **Drafting - Section by Section (Mental or Scratchpad):**
