  4.  **Refining the Technical Content (Self-Correction during drafting):**
      *   *Check:* Did I explain *why* DS fails? In LP (Logic of Paradox), if $A$ is both true and false, and $B$ is false, $A \lor B$ is true (because $A$ is true). $\neg A$ is true (because $A$ is false). But $B$ is false. So premises true, conclusion false. DS fails.
      *   *Check:* Curry's Paradox. Sentence $C$: "If $C$ is true, then $P$." If $C$ is true, then $P$ follows by Modus Ponens. So $C$ is true. So $P$ is true. $P$ can be anything. Triviality.
      *   *Dialetheist Response:* Must weaken the conditional. Modus Ponens isn't unrestricted. Or contraction ($A \to (A \to B)$ implies $A \to B$) fails. I should have Elias mention *relevant logic* or *contraction*.
