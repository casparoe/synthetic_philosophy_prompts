      *   *The Classical Logician (let's call her Sarah):* Needs to sound like a rigorous analytic philosopher. Concerned with inference rules, rationality, and the "cost" of the theory. Not just "contradictions are impossible," but "your logic breaks reasoning."

  3.  **Drafting - Section by Section:**

      *   **Setting the Scene:** Backstage, adrenaline fading, props (water, notes). Establishes the context of the debate just finished.
      *   **Opening Salvo:** Sarah presses the immediate pain point: Disjunctive Syllogism (DS). This is the classic objection to paraconsistency.
          *   *Sarah:* You broke DS. That's how we reason. $A \lor B$, not-$A$, therefore $B$.
          *   *Elias:* It fails only in the specific case of gluts. It's valid *usually*, just not universally.
      *   **The Liar & Alternatives:** Why gluts over gaps or hierarchies?
