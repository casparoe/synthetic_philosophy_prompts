          *   Mechanism: Paraconsistent logic (blocking *ex contradictione quodlibet* / explosion).
          *   Cost: Giving up Disjunctive Syllogism (DS).
          *   Alternatives: Truth-value gaps (Kripke), Tarskian hierarchies.
          *   The Big Challenge: Curry's Paradox (involves conditionals, no negation).
          *   The "Revenge" Problem (strengthened liars).
