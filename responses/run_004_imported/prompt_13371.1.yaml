          *   *Sarah:* But you pay for it by making logic non-monotonic or weakening inference.
      *   **Curry's Paradox:** The heavy hitter. No negation involved.
          *   *Sarah:* Curry doesn't use negation. "If this sentence is true, then everything is true." You can't block explosion via negation here.
