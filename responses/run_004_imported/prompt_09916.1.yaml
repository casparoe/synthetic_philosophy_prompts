answer: |-
  This is a compelling setup. The tension between moral psychology and moral philosophy is fertile ground for a novel about guilt, and you have clearly done enough homework to avoid the most common pitfalls.

  Here are my comments on your three questions, followed by a suggestion for how to tweak the scene.

  ### 1. Is Marion's version of the argument fair?
  **Verdict:** Yes, it is a fair summary of the *rhetorical* situationist case, even if it simplifies the *technical* philosophical position.

  Marion is citing the "Greatest Hits" of the situationist literature: Harman's metaphysical critique, Doris's empirical aggregation, the Darley & Batson (Good Samaritan) study, Isen & Levin (the dime), and Mischel's correlation coefficient. These are exactly the sources a smart, anxious non-specialist would grab after listening to podcasts and auditing a seminar.

  **The Nuance:** You are right to worry about caricature. Gilbert Harman and John Doris are careful not to say character *doesn't exist*, but rather that "global" character traits (consistent across all situations) are not empirically supported. Marion glosses this over ("variance in a life is mostly weather, not character"), but **this is a feature, not a bug.** Marion is in self-justification mode. She *wants* the argument to be deterministic. She is weaponizing the nuance away. Iris, being the specialist, would absolutely spot that Marion is presenting the "strong situationist thesis" rather than Doris's actual "local trait" view. So, keep Marion's simplification; it reveals her desperation to be absolved.

  ### 2. Is Iris's reply the strongest available?
  **Verdict:** It is philosophically precise, but thematically, you can make it hit harder.

  Iris's current reply relies on the **Perception/Salience argument** (Kamtekar) and the **Skill Analogy** (Annas). These are the standard academic defenses. They are correct: virtue ethicists argue that virtue isn't about reflex consistency, but about cultivated perception.

  However, you mentioned two other objections in your prompt: **trait study design** and **socially sustained virtue**.
  *   **The Design Objection:** This is often too technical for dialogue (arguing about cross-situational consistency vs. within-situation consistency). It risks turning the scene into a methodology seminar.
  *   **The Social Objection:** This is the winner. This argument (often associated with MacIntyre or contemporary "extended mind" virtue ethics) posits that virtue isn't a private psychological state but a social practice. We are virtuous *together*.

  **Why switch to the Social Argument?**
  Your novel is set in a **staff room**. The inciting incident is a **public humiliation**. Marion's excuse is individual ("my brain is wired to obey circumstances"). Iris's counter-argument should be communal ("virtue requires a community to hold you up").
  If Iris argues that virtue is socially sustained, she accomplishes two things:
  1.  She invalidates Marion's excuse (you aren't an island; you failed the collective).
  2.  She implicates the *whole staff*, including herself, which raises the dramatic stakes. It moves the blame from "human nature" to "our specific failure."

  **Suggestion:** Have Iris keep the "Local Trait" distinction (it shows her expertise), but pivot the killing blow to the social nature of virtue. "You don't maintain courage in a vacuum, Marion. You maintain it in a room full of people who expect it of you."

  ### 3. Does the exchange sound metabolized?
  **Verdict:** Currently, it leans too heavily toward "encyclopedia entries arguing."

  The content is good, but the rhythm is monologic. Marion recites a list of names and stats in one breath. Iris responds with a structured lecture ("Kamtekar's reply holds... Annas would go further..."). In a dinner-table argument, especially between sisters, the philosophy should be ammunition, not the subject.

  **Specific issues:**
  *   **The Name-Drop Density:** Marion lists Harman, Doris, Milgram, Zimbardo, Isen, Levin, and Mischel in a single paragraph. Even for a obsessed person, this feels like reading a syllabus.
  *   **The Emotional Subtext:** Marion is trying to convince herself as much as Iris. Iris isn't just correcting her; she's likely disappointed or angry that Marion is hiding behind theory.
  *   **Interruption:** Iris shouldn't wait for Marion to finish the whole lecture before speaking. She should interrupt the moment Marion tries to turn herself into a statistic.

  ### Proposed Revision Strategy

  Here is a version of the scene that incorporates the "Social Virtue" argument and breaks up the exposition to sound more like a strained family dinner.

  > **Marion:** "It isn't just that people are inconsistent, Iris. It's that the inconsistency runs all the way down. Harman's whole point is that we're wired to over-explain behavior by character and under-explain it by circumstance. Virtue ethics is just... it's metaphysics dressed up as psychology."
  >
  > **Iris:** "That's Harman's rhetoric. It isn't even Doris's considered claim."
  >
  > **Marion:** "Doris has the data. The seminarians in the Good Samaritan study? On their way to talk about the Good Samaritan. Only one in ten stopped to help a man doubled up in a doorway if they thought they were late. One in ten. And finding a dime in a phone booth makes you more likely to help a stranger than years of moral instruction. The variance in a life is mostly weather, not character. Mischel put the correlation at point-three. That's closer to noise than to a soul."
  >
  > *Iris puts her fork down. The clink is loud enough to stop Marion.*
  >
  > **Iris:** "Doris goes after *global* traits. The kind that would make you act the same in a rigged experiment and a burning building. He's explicit that something narrower might survive. But you're not interested in the nuance, are you? You want the determinism."
  >
  > **Marion:** "I want the truth."
  >
  > **Iris:** "No, you want an alibi. Look, grant you every number. Grant that courage isn't a switch you flip. Aristotle never promised raw impulse would be stable. But virtue isn't a solo sport, Marion. It's not a shield you wear inside your skin."
  >
  > **Marion:** "Then what is it?"
  >
  > **Iris:** "It's a practice. It's sustained socially. You don't keep your courage in your pocket; you keep it in the room with you. In the staff room. In the people who expect you to speak up." *She leans in.* "The seminarians failed because they were alone in a hurry. You failed because you let the room decide for you. That's not situationism. That's cowardice."

  ### Why this works better:
  1.  **Pacing:** It breaks Marion's list into two beats, allowing Iris to interrupt the flow.
  2.  **The "Alibi" Line:** This clarifies Iris's reading of Marion's motivation. It moves the conflict from "Who is right about philosophy?" to "Why are you saying this?"
  3.  **The Social Pivot:** Iris moves from the technical defense (local traits) to the thematic defense (social practice). This lands harder emotionally because it references the **staff room** (the setting of the crime).
  4.  **The Ending:** "That's not situationism. That's cowardice." It strips the theory away and returns to the moral reality of the novel.

  ### Final Check on the Philosophy
  *   **Marion:** Her stats are safe. The .3 correlation is the standard situationist citation (from Mischel 1968). The Good Samaritan stats (10% vs 63%) are accurate to Darley & Batson (1973).
  *   **Iris:** The distinction between global and local traits is the correct technical rebuttal. The shift to "virtue as social practice" is a valid philosophical move (MacIntyrean) that fits a moral philosopher sister perfectly.

  You have a very strong handle on the material. The key now is to ensure the philosophy serves the character dynamics, not the other way around. Marion uses philosophy to shrink her agency; Iris uses it to expand it back to a painful size.
