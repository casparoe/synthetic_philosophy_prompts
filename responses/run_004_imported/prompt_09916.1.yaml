      *   *The "Social" Argument:* This is likely MacIntyre (*After Virtue*) or perhaps a more contemporary "extended mind" approach to virtue. For a novel, "Virtue is a team sport" is a more punchy theme than "Phronesis perceives salience." I will suggest Iris pivot to this.

