      *   **James (Pragmatism):** Truth is what is "expedient in the way of belief." It's about cash value, utility, and what helps an individual cope or navigate experience *now*. Truth happens to an idea; it becomes true. It's more pluralistic and immediate.
      *   **The Split:** Peirce worries James makes truth too subjective/relative ("true for you"). James worries Peirce makes truth too distant/unreachable ("true only when we're all dead").

  3.  **Map to Software Engineering (The "Correctness" Analogy):**
