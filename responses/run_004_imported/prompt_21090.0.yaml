      *   *Crucial Point:* Is Theo actually in bad faith? It depends on his internal state, which we can't know.
      *   *Crucial Point 2:* Sartre's view on "Need." "They need me" is an objectification of others. It treats the family's need as a deterministic force.
      *   *Crucial Point 3:* Authenticity. Authenticity isn't doing what you want (music); it's owning the choice you make (plumbing). If Theo says, "I am choosing plumbing because I value my family's stability over my music," that is *authentic*. If he says, "I have no choice," that is *bad faith*.
      *   *The "Spirit of Seriousness":* Liv is accusing him of this. Caleb is defending the "Serious" values (family duty). Sartre critiques the "Spirit of Seriousness" (treating values as external demands rather than chosen projects). Caleb is inadvertently defending the "Spirit of Seriousness."

  5.  **Drafting the Response:**
      *   **Intro:** Acknowledge the specificity, validate the friendship drama (classic philosophy class stuff).
