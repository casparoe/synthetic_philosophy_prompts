      *   **Overall Winner:** Liv wins on strict Sartrean exegesis, but Caleb wins on "being a good friend."
      *   **The Missing Piece:**
          1.  **Authenticity vs. Outcome:** It's not about plumbing vs. music. It's about *owning* the decision.
          2.  **The Spirit of Seriousness:** Caleb is defending this. Treating "Family Need" as a god-like value that dictates action.
          3.  **Bad Faith is Unstable:** You can't *know* if Theo is in bad faith. Only Theo knows. Liv is judging from the outside.

  6.  **Refining the Tone:**
