  **Mira:** "Exactly. But now... watch." (She turns to her husband, then back to the brother-in-law) "I can say, 'Mark is the love of my life.' Same sentence structure. 'X is Y.' But 'Love of my life' isn't a name. It's a job description. Mark is Mark. He's rigid. But the job? The job could have gone to anyone. If I'd taken a different train in 2015, the position is vacant. Or filled by a stranger. So that sentence isn't necessary. It's just... current employment."

