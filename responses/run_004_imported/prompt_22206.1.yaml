  Here are two examples tailored for Mira's scene. The first is a robust, non-cliché instance of the **necessary a posteriori** (Rigid = Rigid). The second is a **contingent identity** (Rigid = Non-Rigid) that uses the same grammatical structure to trap her brother-in-law.

  ### 1. The Necessary A Posteriori: "Lightning is an Electrical Discharge"

  This is philosophically sound (accepted by most Kripkeans as a natural kind identity) but avoids the eye-rolls of *Water/H2O* or *Hesperus/Phosphorus*. It fits a tipsy, dramatic monologue well because it's visceral.

  **The Explanation (Mira's Voice):**
  > "Okay, forget the water thing. Everyone knows the water thing. Think about lightning. For thousands of years, we pointed at the sky and said, 'That's lightning.' We identified it by the flash, the boom, the smell in the air. Those are just accidents. Contingent. We could have had lightning that smelled like roses, or made no sound.
  >
  > "But then we did the science. We found out that lightning *is* an electrical discharge. And here's the kicker: once we know that, it's not just true in this world. It's true in *every* world. There is no possible universe where lightning exists but isn't electricity. We had to go out and look to find that out—that's the 'a posteriori' part. But now that we have? It's locked in. It's necessary. The name 'lightning' sticks to the electricity, not the flash."

  **Why it works:**
  *   **Rigid Designators:** "Lightning" picks out a specific natural phenomenon across all possible worlds. "Electrical discharge" picks out a specific physical process across all possible worlds.
  *   **Necessary:** If they are the same thing in the actual world, they are the same thing in every world where they exist.
  *   **A Posteriori:** You cannot deduce this by logic alone; you need empirical investigation (physics) to establish the identity.

  ***

  ### 2. The "Gotcha" (Contingent Identity): "The Love of My Life is [Husband's Name]"

  This uses the same "X is Y" sentence structure but swaps one rigid designator for a definite description. This allows Mira to pivot from metaphysics to her failing marriage instantly.

  **The Explanation (Mira's Voice):**
  > "Now watch the trick. I can say, 'David is the love of my life.' It sounds exactly the same, right? 'X is Y.' But 'The love of my life' isn't a name. It's a job description. It's a slot that someone fits into.
  >
  > "David is David. He's rigid. He goes with him wherever he goes. But 'the love of my life'? That could have been anyone. If we'd met five years later, or if he'd said one cruel thing at the wrong time, the slot would be empty. Or filled by someone else. So that sentence? 'David is the love of my life.' That's not a law of physics. It's just... a status update. It's contingent. He could lose the title. And I think he knows it."

  **Why it works:**
  *   **Rigid Designator:** "David" refers to the same person in all possible worlds where he exists.
  *   **Non-Rigid Designator:** "The love of my life" is a definite description. In a different possible world (or even a different timeline of this world), a different person could satisfy that description.
  *   **Contingent:** Because the description could pick out someone else, the identity statement is not necessarily true, even if it is currently true.
  *   **Dramatic Irony:** It uses the philosophical distinction to highlight the fragility of her marriage, which is the subtext of the entire scene.

  ***

  ### How to Stage the Beat

  **Mira:** (Tapping her wine glass with a fork, not to toast, but to keep time) "You think 'meant to be' is a metaphysical claim. But it's just grammar. Look. Lightning is an electrical discharge. We had to go measure it to know that. But once we did? It's locked. It can't be anything else. That's necessary."

