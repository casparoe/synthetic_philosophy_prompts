prompt: |-
  So a few weeks ago my friend Maya completely lost it at our other friend Jade during this whole group project drama (Jade bailed on being her partner last minute to join a 'better' group and Maya found out about it in a pretty public way), and in the middle of screaming at her, Maya said some genuinely harsh stuff - like that Jade's fake and only actually cares about her Instagram numbers and that people just tolerate her. It got dead silent, Jade left crying, and by that night Maya felt awful and told her "I didn't mean any of that, I was just SO mad, that's not how I actually feel about you."

  That could've been the end of it, but then my friends Ella and Dev spent basically all of lunch the next day arguing about whether Maya should get a pass for it, and ngl both of them made points that stuck with me. First Ella said Maya shouldn't be judged too harshly because she was blind with rage and not really thinking straight, kind of like how you don't hold it against someone for stuff they blurt out mid panic attack. Dev shot back that this doesn't hold up, because anger doesn't invent opinions out of nowhere, it just strips away whatever filter normally keeps them in, so the fact that THAT specific thought is what came out means some part of Maya genuinely believes it - and if anything that makes it worse, since it means shes been faking being chill with Jade this whole time. Ella came back with, ok fine, anger doesn't manufacture thoughts, but theres a difference between having a stray uncharitable thought about a friend sometimes (literally everyone does) and actually being the kind of person who'd say it out loud to hurt them - calm, sober Maya never would, so that restraint is just as much "the real Maya" as the ugly thought is. Dev said thats a pretty convenient rule, because it basically means nobody's responsible for anything they do while angry, exhausted, drunk, whatever, since you can always just decide the best-behaved version of someone is the "true" one and wave the rest away. Ella's last point was that we already treat impaired-in-the-moment stuff differently in other situations though - like nobody thinks what someone screams during a nightmare or a panic attack says something true about their character the same way a calm, deliberate statement does - so theres clearly some line, she just thinks blind rage sits a lot closer to the nightmare end than Dev gives it credit for.

  Neither of them budged and it's honestly been living in my head rent free since (we're all supposed to hang out again this weekend so it feels weirdly relevant lol). Could you go through it round by round and say who actually had the stronger point at each step, not just an overall winner, and point out if theres some distinction they're both missing that would untangle this? And if you do land on an overall verdict, I wanna hear that too.
