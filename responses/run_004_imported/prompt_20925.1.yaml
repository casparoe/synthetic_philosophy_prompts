answer: |-
  This is a classic philosophical debate disguised as high school/college drama. Ella is arguing for **Dispositionalism** (who you are is how you act when you have control), while Dev is arguing for a mix of **Freudian Truth** (slips reveal hidden desires) and **Accountability** (you own your actions regardless of state).

  Both are partially right, which is why it's stuck in your head. Here is the round-by-round breakdown, the missing distinction, and the verdict.

  ### Round 1: The Origin of the Thought
  **Ella:** Anger creates a blind state; thoughts blurted out aren't "real" beliefs (like panic attacks).
  **Dev:** Anger doesn't invent; it removes filters. If it came out, it exists in the mind.

  **Winner: Dev**
  Psychologically, Dev has the stronger point here. Emotions are rarely liars about *what* we are feeling, even if they lie about *how much* we should act on it. Anger functions like an amplifier. It doesn't usually conjure a specific, detailed grievance (like "Jade cares more about Instagram than people") out of thin air. That specific critique likely existed in Maya's mind as a quiet annoyance or insecurity that she normally suppresses.
  Ella's comparison to a panic attack is weak here. A panic attack is physiological dysregulation (heart racing, inability to breathe). Anger is an emotional response that impairs judgment, but it doesn't shut down the language or belief centers of the brain the way a seizure or nightmare does.

  ### Round 2: Restraint vs. The "True Self" Loophole
  **Ella:** Everyone has uncharitable thoughts. Character is defined by the *restraint* (Calm Maya), not the slip-up.
  **Dev:** That's a convenient loophole. It lets people off the hook for anything done while impaired (drunk, tired, angry).

  **Winner: Ella**
  This is Ella's strongest round. She makes a crucial ethical distinction: **Thoughts are not endorsements.** We all have intrusive, mean, or judgmental thoughts about our friends sometimes. What makes you a good friend isn't the absence of those thoughts, but the decision not to weaponize them.
  By defining "The Real Maya" as the one who exercises restraint, Ella is arguing that *self-control is part of identity.* Dev's "loophole" argument is a valid slippery slope concern, but it doesn't negate Ella's point. Just because someone *could* abuse the "I was angry" excuse doesn't mean the excuse is inherently invalid. Calm Maya choosing not to say the mean thing is indeed a massive part of who Maya is.

  ### Round 3: The "Impaired State" Precedent
  **Ella:** We excuse other impaired states (nightmares, panic screams). Rage is closer to that than deliberate speech.
  **Dev:** (Implicitly) Rage involves agency; nightmares do not.

  **Winner: Dev**
  Ella loses the analogy here. Screaming during a nightmare or mid-panic attack is largely involuntary physiology. Screaming a coherent, targeted insult at a specific person ("You are fake," "People tolerate you") requires social cognition. Maya had to identify Jade, access her insecurities, formulate a sentence, and project her voice.
  Dev is right to push back on the idea that rage is the same as unconsciousness. It is a *diminished* capacity for control, not an *absent* one. Treating rage as fully involuntary removes too much agency.

  ---

  ### The Missing Distinction: "Latent Resentment" vs. "Core Truth"

  Both Ella and Dev are stuck on a binary: Either Maya secretly hates Jade (Dev), or Maya is totally chill and the anger was a glitch (Ella). They are both missing the middle ground, which is **Latent Resentment.**

  Here is the distinction that untangles it: **Anger turns nuances into absolutes.**

  Maya might genuinely like Jade 90% of the time. But there might be a 10% part of her that *is* annoyed by Jade's Instagram obsession or feels insecure about it. When Maya is calm, she manages that 10%. She tolerates it because the 90% friendship is worth it.
  When Maya was blindsided by betrayal, that 10% resentment was amplified to 100% volume.
  *   **Dev is right** that the resentment is real (it didn't come from nowhere).
  *   **Ella is right** that it doesn't define the whole friendship (Calm Maya values the 90% more).

  The missing piece is that Maya's apology ("I didn't mean any of that") is likely **half-true.** She didn't mean to *hurt* Jade with it, and she doesn't want to *end* the friendship over it. But in that moment, she likely *did* believe the negative thoughts more than she usually does.

  ### Overall Verdict

  **The Winner: It's a Split Decision, but Dev wins on Accountability, Ella wins on Forgiveness.**

  If you force me to pick who had the "truer" argument regarding human nature: **Dev.**
  Dev is right that we cannot fully disown our angry words. They come from somewhere. If Maya never thought Jade was "fake," her brain wouldn't have reached for that specific weapon. To completely write it off as "not the real me" is a bit self-deceptive.

  **However,** for the sake of the friend group and the weekend hangout: **Ella's framework is the healthier one to use.**
  If you adopt Dev's view completely ("Anger reveals the only truth"), you have to assume every friend secretly hates each other, which makes friendship impossible. If you adopt Ella's view ("Restraint defines character"), you allow for human error and growth.

  **The Practical Takeaway for the Weekend:**
  Maya is responsible for the harm (Dev's point), so she needs to own the impact of her words without hiding behind "I was mad." She can't just say "I didn't mean it." She needs to say, "I was hurt, and I lashed out with things I've felt occasionally but shouldn't have said."
  But the group should accept that this doesn't mean Maya is a secret enemy (Ella's point).

  **Advice:** Don't let them re-litigate this debate at lunch. Tell Ella and Dev they're both right about different things. Tell Maya she needs to apologize for the *cruelty*, not just the *volume*. And tell Jade (if you talk to her) that while the words hurt, they were likely an exaggeration born of betrayal, not a cold, calculated assessment of her worth.
