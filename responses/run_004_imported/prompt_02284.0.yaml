answer: |-
  **The Common Prior Assumption: Rationality Norm or Modeling Artifact?**

  The disagreement between you and your advisor cuts to the bone of what Bayesianism is supposed to be: a logic of consistency or a theory of truth-tracking. Your advisor's position relies on the "Harsanyi Doctrine," the intuition that differences in belief must ultimately be traceable to differences in information, not differences in "constitutional" processing. If two agents are perfectly rational and share the same data, they should converge. Therefore, the Common Prior Assumption (CPA) is treated as a requirement of rationality itself. However, this conflates the mathematical requirements of equilibrium selection with the normative requirements of individual epistemic rationality. **The CPA should not be counted as a requirement of rationality for ideal Bayesian agents.** It is a modeling constraint that imposes an objective structure on subjective states, and treating it as a norm begs the central questions of social epistemology rather than answering them.

  To see why the advisor's "free lunch" intuition fails, we must look at the ontological status of the prior in the Harsanyi type-space. As Gul (1998) correctly identifies, the "ex-ante" stage where agents share a common prior is not a historical moment, nor is it a robust counterfactual. It is a mathematical reconstruction. In a standard type-space, a "type" is defined by its prior and its information partition. To say two types "share a common prior" is merely to say that their posteriors can be generated from a single probability measure over the state space. There is no moment where the agents actually held this prior. Consequently, violating the CPA is not akin to violating the axioms of probability (e.g., having incoherent credences); it is simply to possess a different type. If rationality is defined in the Savage/de Finetti sense as coherence among one's own beliefs and preferences, an agent can be perfectly coherent while holding a prior that differs from another coherent agent. To claim otherwise is to smuggle in an objective notion of "correct" priors that subjective Bayesianism explicitly rejects.

  This leads directly to Stephen Morris's critique regarding the asymmetry between utilities and priors. In standard game theory, we accept that agents have different utility functions as a brute fact of psychology or preference. We do not demand a "Common Utility Assumption" to prove that two agents are rational; we accept that you might value risk differently than I do. Yet, economists often treat priors as if they are facts about the world rather than parameters of the agent. If priors represent an agent's initial disposition to weigh evidence—a kind of "epistemic utility function"—then persistent disagreement without private information is no more irrational than persistent disagreement about the value of a dollar. By insisting the CPA is a rationality norm, your advisor is effectively claiming that there is only one rational way to weigh evidence *before* evidence is received. This is a substantive metaphysical claim about the world, not a formal requirement of Bayesian updating.

  Furthermore, treating the CPA as a rationality norm creates a fatal tension with the No-Trade Theorems (Milgrom & Stokey, 1982). If the CPA holds and posteriors are common knowledge, speculative trade cannot occur. Agents cannot agree to bet against one another because any bet offered implies the offerer has private information that makes the bet unfavorable for the receiver. If we accept the CPA as a rationality requirement, we must conclude that all speculative trade in financial markets is evidence of widespread irrationality. While markets certainly contain noise, the volume of speculative trade suggests that belief heterogeneity is a fundamental feature of economic interaction, not a bug caused by irrationality. A norm of rationality that renders the central phenomenon of a domain (speculative betting) impossible is a norm that is doing too much work. It is more parsimonious to view the CPA as a restriction on the *class of games* we are analyzing, rather than a restriction on the *agents* within them.

  For a social epistemologist working on peer disagreement, this distinction is vital. If you accept the CPA as a rationality norm, Aumann's Agreement Theorem becomes a tautology: "If agents are rational (share priors) and know each other's beliefs, they agree." This dissolves the problem of peer disagreement by definition. It forces you to interpret any persistent disagreement as evidence that one party is either irrational or hiding information. But this ignores the possibility that reasonable people can start from different "epistemic starting points" (priors) and update perfectly on public information without converging. Gul's argument validates this: if the common prior is just bookkeeping, then "agreeing to disagree" is not a failure of rationality, but a reflection of the fact that the agents are playing a game with incomplete information about each other's type-generating processes.

  Therefore, the CPA is best understood as a **methodological idealization for equilibrium analysis, not a constitutive norm of individual rationality.** It is useful when we want to model situations where agents share a common culture, training, or data source (justifying the assumption that their priors *happen* to be similar). But it cannot be derived from the axioms of Bayesian rationality alone. Your advisor is correct that *if* priors are common, disagreement implies private information. But they are incorrect that rationality *demands* common priors. To argue otherwise is to abandon the subjective Bayesian foundation that allows us to model uncertainty in the first place, replacing it with an objective Bayesianism that requires a "view from nowhere" that no actual agent occupies.
