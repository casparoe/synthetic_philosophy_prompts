prompt: |-
  Kind of a random thing to ask for advice about, but here goes. This semester I'm taking Intro Astronomy to knock out a gen ed, and completely unrelated (or so I thought), I'm also in a philosophy class on death and the meaning of life. Two weeks ago, right in the middle of midterms, astro got to the unit on stellar evolution and the eventual heat death of the universe, plus all the usual stuff about how many billions of lightyears away everything is, and it kind of wrecked me for like a week straight. Like a genuine 3am "nothing I do matters" spiral, not just a fun "whoa space is big" moment. I keep landing on this thought that since humanity is so unbelievably tiny and short-lived compared to the actual size and lifespan of the universe, none of my choices (grad school, my relationship, whatever) can really be important in any serious sense.

  My roommate, who is annoyingly always right about this kind of stuff, thinks I'm making a mistake. Her whole point is that how big something is, or how long it lasts, just has nothing to do with whether it matters, and that I'm basically mixing up two totally different questions because the scale of the universe happens to be emotionally overwhelming. I kind of see the logic when she lays it out like that, but it does nothing to actually kill the feeling, and I can't tell if that's just me being stubborn or if my gut is onto something her tidy little argument is leaving out. So who's actually right here -- is she correct that scale, in space or in time, is just irrelevant to whether a life is meaningful? Or is there a real case for why bigness and permanence should matter that she's being too quick to wave away?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** The user is taking two classes: Intro Astronomy and Philosophy (Death & Meaning of Life).
      *   **Trigger:** The Astronomy unit on stellar evolution, heat death, and cosmic scale caused an existential crisis ("3am 'nothing I do matters' spiral").
      *   **Core Conflict:** The user feels human insignificance due to cosmic scale (size/time). Their roommate argues scale is irrelevant to meaning. The user intellectually sees the logic but emotionally feels the weight of the "bigness."
      *   **Question:** Who is right? Is scale irrelevant (roommate), or is there a valid case for why bigness/permanence *should* matter (user's gut)?

  2.  **Deconstruct the Philosophical Arguments:**
      *   **The Roommate's Position (Subjective/Local Meaning):** Meaning is internal or relational. Scale doesn't dictate value. A moment of love is valuable *to the people involved*, regardless of the Andromeda galaxy. This aligns with Existentialism (Sartre, Camus) or Humanism.
      *   **The User's Position (Objective/Cosmic Meaning):** Meaning requires permanence or cosmic significance. If it disappears in the heat death, was it real? This aligns with Nihilism or a specific desire for "Objective Meaning."
      *   **The Tension:** Intellectual understanding vs. Emotional resonance. The "Sublime" (Kant/Burke) – the feeling of awe/terror when facing something vast.

  3.  **Evaluate "Who is Right":**
      *   *Philosophically:* There is no objective "right." Both positions are defensible philosophical stances.
      *   *Psychologically:* The user's feeling is valid. It's a known phenomenon (existential dread/awe). Dismissing it as "illogical" (as the roommate might be doing) invalidates the emotional experience.
      *   *Synthesis:* The roommate is logically consistent within a humanistic framework, but the user is experiencing a genuine philosophical problem (The Problem of Cosmic Insignificance). Neither is "wrong," but they are answering different questions.

  4.  **Drafting the Response - Structure:**
      *   **Validation:** Acknowledge that this is a common, profound, and intellectually honest reaction. It's not "just a mood."
      *   **Analyze the Roommate's Argument:** Validate her logic (Scale $\neq$ Value). Give it a philosophical name (Humanism/Existentialism).
      *   **Analyze the User's Intuition:** Validate *why* the scale hurts. It's about permanence and objective significance. Give it a philosophical name (Cosmic Nihilism/The Sublime).
      *   **Bridge the Gap:** Explain that they are talking past each other. One is talking about *local* meaning, the other about *cosmic* meaning.
      *   **Offer a Third Perspective (Integration):** How to live with both truths. Camus (Sisyphus), Richness of Experience vs. Duration.
      *   **Practical Advice:** How to handle the class and the feelings.

  5.  **Refining the Content (Self-Correction/Nuance):**
