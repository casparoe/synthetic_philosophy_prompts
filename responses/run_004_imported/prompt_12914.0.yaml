  2.  **Deconstruct the Philosophical Issue:**
      *   **The Core Tension:** This is a classic objection to Kant's CI, often raised by scholars (e.g., Schopenhauer, Hegel, and contemporary commentators). It's the distinction between *Contradiction in Conception* (CC) and *Contradiction in the Will* (CW).
      *   **Kant's Defense:** Kant isn't saying "Don't do it because you'll suffer." He's saying "A rational will *necessarily* wills the conditions of its own agency." If I will a world where no one helps anyone, I am willing a world where my own *projects* (whatever they are) are thwarted if I encounter obstacles I can't overcome alone.
      *   **The "Need" Argument:** It's not about *desire* for help (empirical), but about the *rational necessity* of willing the means to one's ends. Since I am a finite rational being, I cannot guarantee I will never need help. To will a principle that makes help impossible is to will the frustration of my own rational agency.
      *   **Prudence vs. Duty:** Prudence says "Help others *so that* they help you." Duty says "Help others because a rational will cannot consistently will a world without mutual aid." The *motivation* is different, even if the *consequence* (I get help) is similar.
      *   **The "Contradiction in the Will":** It's not a logical contradiction (like $A \neq A$). It's a *volitional* contradiction. I will $X$ (my own happiness/ends) and I will $Y$ (a world where I get no help), but $Y$ makes $X$ impossible.

