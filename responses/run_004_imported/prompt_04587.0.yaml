answer: |-
  To accept Michael Dummett's comforting partition—that Frege's logic resides in a sanctified room while his politics rot in the basement—is to misunderstand the nature of formal systems. It assumes that logic is a sterile instrument, like a hammer, which can be used to build a house or crush a skull without the hammer itself bearing any responsibility for the violence. But Frege did not view logic as a mere tool; he viewed it as the structure of thought itself, the skeletal framework of reality. If we take Frege at his word, we must confront the unsettling possibility that his antisemitism was not a lapse in reasoning, but a rigorous application of his reasoning. The thesis is uncomfortable but necessary: Frege's deployment of the "ancestral" relation to justify racial hierarchy was formally valid within his system. The monstrosity lies not in the inference, but in the premises he deemed self-evident.

  To understand why this is a claim of validity rather than equivocation, we must look at the machinery of the *Begriffsschrift*. Frege's breakthrough was the definition of the "ancestral" of a relation (later denoted as $R^*$). In his definition of natural numbers, Frege needed to capture the idea of induction: if a property $F$ is "hereditary" in a sequence (meaning if $x$ has $F$, and $x$ stands in relation $R$ to $y$, then $y$ has $F$), then all members of the sequence descending from an origin point must possess $F$. This is a purely formal mechanism. It dictates that if a property is transmitted by a relation, and the relation holds, the property must persist.

  The standard defense of Frege, implied by Dummett's shock, is that Frege committed a fallacy of equivocation. He allegedly took the technical term "hereditary" (logical transmission of a predicate) and conflated it with "hereditary" (biological transmission of traits). This defense assumes a categorical wall between logical space and biological space. But for Frege, logic was not a game of symbols; it was an ontology. He sought to reduce arithmetic to logic because he believed logical structures *were* the structures of truth. If Frege looked at the world and saw "Aryan descent" as a relation $R$ and "cultural superiority" as a property $F$, and he asserted as a premise that $F$ is hereditary in $R$, he was not abusing his logic. He was instantiating it.

  Consider the syllogism Frege effectively constructed:
  1.  **Formal Rule:** For any relation $R$ and property $F$, if $F$ is hereditary in the $R$-sequence, and $a$ falls under $F$, then any $b$ in the $R$-ancestral of $a$ falls under $F$.
  2.  **Empirical/Metaphysical Premise:** "German spirit" (or Aryan quality) is a property hereditary in the relation of "biological descent."
  3.  **Factual Premise:** Person $X$ is in the line of biological descent from Ancestor $Y$ (who possessed the spirit).
  4.  **Conclusion:** Person $X$ possesses the "German spirit."

  If you accept Premise 2, the conclusion follows with the same iron necessity as $2+2=4$. To call this a fallacy of equivocation is to claim Frege didn't *really* mean that biological descent functions like a logical relation. But the diary suggests he did mean exactly that. He believed the bond was "hereditary in exactly the technical sense." He was positing a metaphysical identity between the logical structure of transmission and the biological structure of genealogy. If the premise is false (and it is; cultural value does not transmit via genes with logical necessity), the argument is *unsound*, but it remains *valid*. The engine runs perfectly; it is the fuel that is poison.

  This distinction destroys the "separate rooms" thesis. Dummett wished to salvage the logic by quarantining the man. He wanted to say, "The logic is pure; the politics are a personal sickness." But if the logic is validly applicable to the politics, the walls between the rooms are permeable. The rigor of Frege's logic does not protect against evil; it amplifies it. A sloppy thinker might hold racist views inconsistently, vulnerable to counter-argument. A Fregean thinker, armed with a system that demands universal laws and rigid transmission of properties, hardens those prejudices into axioms. The formal genius does not sit uneasily beside the private convictions; it calcifies them.

  The danger here is the illusion of neutrality. We like to think that formal validity is a check against irrationality. Frege demonstrates that validity is merely a guarantee of consistency. If your premises are dehumanizing, a more rigorous logic will only produce dehumanizing conclusions more efficiently. By arguing that Frege's move was valid, we are not exonerating him; we are indicting the notion that formal systems are immune to the moral quality of their inputs.

  Dummett's separation is a defense mechanism for the philosophical tradition. It allows us to teach Frege's logic without teaching Frege's hate. But if D'Arcy is right, and Frege pressed his vocabulary into the service of fascism, then the vocabulary itself carries the potential for that service. The concept of the "ancestral" relies on a closed chain of transmission, excluding external contamination. It is a concept of purity. When applied to numbers, this is benign. When applied to people, it is genocide. The structure is the same.

  To accept this is to admit that philosophy cannot retreat into formalism to escape ethics. If Frege's inference was valid, then the fault line runs through the very ground of his ontology—the point where he decided that human worth could be modeled as a hereditary property in a logical sequence. We cannot save Frege by saying his logic was separate from his life. We must acknowledge that his logic was the vessel for his life's worst impulses. The flaw was not in the calculus, but in the conviction that the calculus could map the human soul. And in recognizing that, we see that the "separate rooms" were never there; there was only one house, and the foundation was rotten.
