          *   Counter: If ball A hadn't broken the vase, something else would have. (False, maybe nothing else was thrown).
          *   *Critique:* Very similar structure to Kennedy (Effect is known, Cause is in question).

      *   *Candidate 3 (Computing):* A server crashed. Log shows Process X caused it.
          *   Ind: If Process X didn't crash the server, something else did. (True, server is down).
          *   Counter: If Process X hadn't crashed the server, something else would have. (False, system was stable otherwise).
          *   *Critique:* Good, modern domain.

      *   *Candidate 4 (Baking/Chemistry):* A cake collapsed. We know it collapsed. We suspect too much baking powder.
