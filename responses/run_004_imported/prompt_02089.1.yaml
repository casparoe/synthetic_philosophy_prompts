  1.  **Analyze the Request:**
      *   **Topic:** Semantics of conditionals (Adams' thesis/divergence between indicative and counterfactual).
      *   **Task:** Construct an *original* example pair (Indicative vs. Counterfactual) with the same antecedent and consequent.
      *   **Constraint 1:** Do *not* use the Kennedy/Oswald example or obvious variants (other assassinations, whodunits).
      *   **Constraint 2:** Draw from a *genuinely different domain*.
      *   **Requirement:** State which is true and which is false.
      *   **Requirement:** Explain the feature producing the gap in a few sentences.
      *   **Context:** Handout for a seminar (needs to be clear, pedagogically sound, and philosophically robust).

  2.  **Deconstruct the Kennedy Example:**
      *   *Indicative:* "If Oswald didn't kill Kennedy, someone else did." (True). Why? Because we know Kennedy *was* killed. The antecedent ("Oswald didn't") forces us to update our beliefs within the actual world's history to accommodate the fact of the death. It's an epistemic conditional about what actually happened.
      *   *Counterfactual:* "If Oswald hadn't killed Kennedy, someone else would have." (False). Why? Because we are imagining a world where Oswald *didn't* do it, holding fixed the broader circumstances (no conspiracy, lone gunman). In that closest possible world, the assassination doesn't happen. It's a metaphysical/causal conditional about what *would* have happened.
      *   *Key Feature:* The divergence arises because the indicative accepts the truth of the *consequent* (or the fact implied by the negation of the antecedent + background knowledge) as fixed, while the counterfactual treats the *antecedent* as a departure point that might undo the consequent. Specifically, the indicative is often evaluated given that we know the outcome occurred, whereas the counterfactual asks if the outcome would still occur if the specific cause were removed.

  3.  **Brainstorming Domains:**
      *   *History/Politics:* (Too close to Kennedy).
      *   *Science/Physics:* Good potential. Laws of nature vs. specific events.
      *   *Everyday Causation:* Matches, lights, switches. (Often too simple).
      *   *Sports:* Goals, wins, losses. (Good for "what actually happened" vs. "what if").
      *   *Computing/Algorithms:* Deterministic processes.
      *   *Medicine/Diagnosis:* Symptoms and causes.

