      *   **Connection:** Yudkowsky's "Conservation of Expected Evidence" (CEE) as a special case of Reflection.
      *   **Format:** Dialogue between two rationalist-forum regulars.
      *   **Characters:**
          *   *Pro-Reflection:* Believes Reflection holds, Sleeping Beauty is a misunderstanding of the conditions (e.g., indexical uncertainty, memory loss).
          *   *Anti-Reflection/Exception:* Believes Sleeping Beauty shows genuine limits to Reflection (self-locating belief, memory loss breaks the "rational process" condition).
      *   **Tone:** Engaging, specific moves, neither is a pushover, rationalist jargon appropriate (credence, Dutch Book, indexical, updating, etc.).

  2.  **Character Conception:**
      *   *Alex (Pro-Reflection):* Rigorous, formalist, thinks the paradox dissolves if you define "proposition" and "agent" correctly. Likely leans towards Halferism or a specific thirder view that respects Reflection. Let's make them a "Halfer who respects Reflection."
      *   *Jamie (Anti-Reflection/Exception):* Pragmatic, focused on the phenomenology of the agent, thinks memory loss creates a genuine break in rational continuity. Likely a Thirder who sees the shift as rational despite violating Reflection.

  3.  **Key Arguments to Include:**
      *   **Reflection Principle:** $C_t(A | C_{t'}(A) = x) = x$.
      *   **Sleeping Beauty Setup:** Coin toss (Heads/Tails). Heads: Wake Monday. Tails: Wake Monday & Tuesday (memory wipe).
      *   **The Conflict:** On Sunday, Beauty knows she will wake up. If she's a Thirder, she knows her Monday credence will be 1/3. But on Sunday, her credence is 1/2. Violation?
      *   **Alex's Defense:** Memory loss means the future self isn't "trustworthy" in the required sense, OR the proposition changes (from "Heads" to "Heads & Today is Monday").
      *   **Jamie's Offense:** The process *is* rational (it's the experimental protocol). Memory loss doesn't make you irrational, just less informed. Reflection should handle information loss.
      *   **Dutch Book:** Alex should mention it. Jamie should argue the Dutch Book doesn't apply due to the betting structure in SB.
