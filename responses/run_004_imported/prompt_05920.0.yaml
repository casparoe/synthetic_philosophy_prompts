answer: |-
  **Setting:** *A slightly too-quiet corner of a coffee shop near the Berkeley campus. Two laptops are open, but neglected. Mugs of cold brew sit between them.*

  **Characters:**
  *   **Alex:** A formalist. Believes rational constraints like Reflection are constitutive of what it means to be an agent.
  *   **Jamie:** A pragmatist. Believes rational norms should serve decision-making in weird ontological situations, even if it breaks the neat axioms.

  ***

  **Jamie:** I keep coming back to Yudkowsky's "Conservation of Expected Evidence." It's elegant. If I know where my belief is going, I should already be there. It's basically Van Fraassen's Reflection Principle dressed up in LessWrong clothes. But Sleeping Beauty eats it for breakfast.

  **Alex:** Does it? Or do you just dislike the breakfast? Look, on Sunday, Beauty's credence in Heads is 1/2. On Monday, if she's a Thirder, it's 1/3. She knows on Sunday that on Monday she'll be a 1/3er. If Reflection holds, $C_{Sunday}(Heads | C_{Monday}(Heads) = 1/3)$ should be 1/3. But it's 1/2. So either Reflection is false, or Beauty isn't actually certain of her future credence, or...

  **Jamie:** Or the case is a counterexample. And I think it is. Here's the move: Reflection assumes your future self is a trustworthy guide to the truth *relative to your current information*. But in Sleeping Beauty, I *know* exactly why my future self will shift. It's not because she saw new evidence about the coin. It's because she lost evidence about *where she is in time*.

  **Alex:** But that's exactly why Reflection doesn't apply. Van Fraassen's condition isn't just "you know what your future credence will be." It's "you regard your future self as rational." If your future self has undergone memory deletion, she is strictly *less* informed than you are now. You shouldn't defer to a future self that has lobotomized part of your database.

  **Jamie:** That feels like a dodge. She hasn't become irrational. She's following a protocol I currently endorse! On Sunday, I agree with the experimental setup. I say, "Yes, if I wake up, I should reason like a Thirder." I trust that reasoning process. If I trust the process now, why shouldn't I adopt the output now? If Reflection is a norm of rationality, it should handle anticipated forgetting. Otherwise, it's only a norm for agents who never lose data.

  **Alex:** It's not about data loss; it's about the *proposition*. You're sliding between "The coin landed Heads" and "The coin landed Heads and this is the first awakening." On Sunday, "today" refers to Sunday. On Monday, "today" refers to Monday. The indexical content shifts. Reflection requires the proposition $A$ to remain constant across $t$ and $t'$. If the meaning of "now" changes, you aren't violating Reflection; you're just comparing apples to oranges.

  **Jamie:** Come on, Alex. The coin doesn't care about indexicals. If I bet on Heads, the payout is determined by the physical state of the coin, not by what day I think it is. If I know that upon waking I will act as if the probability is 1/3—because that's the betting odds that save me from a Dutch Book in the experiment—then my Sunday self should also act as if it's 1/3. If Reflection tells me to stay at 1/2 on Sunday, but decision theory tells me to bet like it's 1/3 on Monday, then Reflection is severing the link between belief and action.

  **Alex:** That Dutch Book argument is slippery. It depends entirely on whether you're being billed per awakening or per experiment. If I'm a Halfer, I say the bet is per experiment. You get one bet on Heads, one on Tails. No Dutch Book. If you're a Thirder, you're implicitly assuming a betting protocol that weights Tails twice. Reflection protects you from diachronic inconsistency *given a stable betting protocol*. Beauty's problem is that her betting protocol is ambiguous because *she* is ambiguous.

  **Jamie:** But that's my point! The ambiguity is real. It's a feature of self-locating belief. Reflection assumes a persistent, continuous agent who merely updates on new evidence. Beauty is a fragmented agent. She knows she will become a version of herself who is systematically deluded about the day of the week. If I know my future self is going to be systematically deluded about her context, even if she reasons perfectly within that context, why should I satisfy Reflection with her?

  **Alex:** Because you *know* the delusion is part of the rational calculation! You aren't being tricked; you're simulating the loss of information. Think about it this way: Conservation of Expected Evidence says $E[C_{t'}(A)] = C_t(A)$. If I know I'm going to forget something, my expected evidence isn't zero; it's negative. I should anticipate becoming *less* certain. But in SB, the Thirder says, "I will become *more* certain of Tails." That's the violation. You're gaining certainty about the coin without looking at the coin. That *has* to be a violation of something fundamental.

  **Jamie:** It's not gaining certainty about the coin. It's gaining certainty about the *sampling*. On Sunday, I'm the experimenter. On Monday, I'm the sample. The reference class changed. Reflection fails here because it assumes the agent's identity is stable relative to the hypothesis. In SB, the hypothesis "Tails" implies "I exist twice." The hypothesis "Heads" implies "I exist once." My existence is evidence.

  **Alex:** Okay, but if your existence is evidence, then you *did* update on new evidence on Monday. You learned "I am awake now."

  **Jamie:** But I knew on Sunday I would learn that! I knew with probability 1 that I would wake up. You can't update on something you were already certain would happen. That's the Conservation of Expected Evidence point! If $P(E) = 1$, then $P(H|E) = P(H)$. On Sunday, $P(Wake) = 1$. So Monday's update should be null. But it's not. Therefore, standard Bayesian updating—and by extension Reflection—breaks in self-locating cases.

  **Alex:** You're conflating "I will wake up at least once" with "I am experiencing this specific awakening." The evidence isn't "Wake"; it's "Wake$_{now}$". On Sunday, $P(Wake_{now}) = 0$ because it's Sunday. On Monday, $P(Wake_{now}) = 1$. You *did* learn something you weren't certain of: you learned your temporal location.

  **Jamie:** But I knew I'd learn *some* temporal location! I knew I'd be in *a* waking moment. Reflection says if I know I'll have credence $x$ after learning whatever I'm going to learn, I should have $x$ now. I know I'll be a 1/3er. I'm not a 1/3er. The principle snaps. And I think that's fine. Maybe Reflection is just for agents who don't get cloned or wiped.

  **Alex:** If you accept exceptions, you open the door to motivated reasoning. "Oh, I know I'll believe $X$ tomorrow, but I'm in a 'special self-locating case' so I'll ignore it." The power of Reflection is that it prevents you from thinking your future self is stupid. If you say Beauty violates Reflection, you're saying Sunday-Beauty thinks Monday-Beauty is making a mistake.

  **Jamie:** Sunday-Beauty *does* think Monday-Beauty is making a mistake! She thinks Monday-Beauty is ignoring the fact that she knew she'd wake up. But Monday-Beauty says, "No, I'm accounting for the sampling bias." They are rationally disagreeing. And if two time-slices of the same agent can rationally disagree, then Reflection is false. It's not a universal norm. It's a norm for agents with continuous memory.

  **Alex:** But they aren't disagreeing about the coin! They're disagreeing about the betting odds. If you strip away the bets and just ask about the objective chance of the coin, Sunday-Beauty says 1/2. Monday-Beauty... well, if she's rational, she should also say 1/2. The 1/3 is only for decision-theoretic weight. If you separate credence from betting, Reflection holds.

  **Jamie:** That's the "Halfer" escape hatch, but it costs you the link between credence and action. If my credence is 1/2 but I bet 1:2 odds, what does "credence" even mean? If Reflection forces me to keep credence at 1/2 to save the principle, but I have to bet like it's 1/3 to save my wallet, then Reflection is just a semantic game. I'd rather keep the link to action and let Reflection take the hit.

  **Alex:** I'd rather keep Reflection and admit that self-locating belief requires a different logic than standard proposition-based belief. Reflection is a theorem of standard Bayesianism. SB shows that standard Bayesianism needs an upgrade for indexicals, not that the theorem is wrong in its domain.

  **Jamie:** So you're saying Reflection is like Newtonian physics? True enough for low velocities, but breaks when things get relativistic?

  **Alex:** Exactly. In a world without memory wipes or cloning, Reflection is ironclad. In a world where "I" can refer to multiple distinct temporal instances... yeah, maybe it bends. But I'm not ready to toss it out. It's too useful for catching self-deception.

  **Jamie:** And I'm not ready to keep it if it tells me to ignore the fact that I'm going to be a Thirder tomorrow. If I know my future self is right about how to navigate the world, I want to be on her team today. Even if it violates Van Fraassen.

  **Alex:** *sips cold brew* Well, at least we agree Beauty shouldn't take the bet if the payout is per-experiment and the odds are even.

  **Jamie:** *laughs* Don't push your luck. I'm still taking the bet. But I'll let you know what my future self thinks about it on Tuesday.

  **Alex:** Just make sure you remember to tell me.

  **Jamie:** No promises.
