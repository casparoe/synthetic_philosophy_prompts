      *   **Move 2 (Alex):** Challenge the "trust" condition. Reflection requires believing the future self is rational. Memory wipe = information loss. Does that count as irrationality? No, but it breaks the conditionalization link.
      *   **Move 3 (Jamie):** Push back. It's not irrationality. It's known forgetting. Yudkowsky's CEE says expected evidence sums to prior. If I know I'll lose evidence, shouldn't I adjust?
      *   **Move 4 (Alex):** Introduce the *proposition* shift. "Heads" on Sunday isn't the same as "Heads" on Monday because of the indexical "Today". This is the "Halfer" escape hatch.
