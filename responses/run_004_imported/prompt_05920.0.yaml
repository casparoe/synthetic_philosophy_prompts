  7.  *(Mental Sandbox)*: Wait, if Alex is a Halfer, they think Monday credence *should* be 1/2. If Jamie is a Thirder, they think it's 1/3. The conflict is sharper if they agree on the Monday credence but disagree on whether Sunday should match it.
      *   *Correction:* Actually, the prompt says "almost nobody thinks she should already have that credence on Sunday." So both should probably agree Sunday = 1/2. The disagreement is whether this *violates* Reflection or whether Reflection is exempt here.
      *   *Alex:* Reflection holds, so SB doesn't violate it (because conditions aren't met).
