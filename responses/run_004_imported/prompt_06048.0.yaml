  2.  **Deconstruct Bentham's Argument ("Offences Against One's Self"):**
      *   *Antipathy:* Bentham argues that disgust/revulsion is not a rational ground for legislation. It's a sentiment, not a reason. If antipathy is the only reason, it's superstition.
