  3.  **Evaluate Against Mill's Harm Principle:**
      *   Mill: Liberty is the default. Interference requires harm to others. This is a *right* (or a rule of utility so strong it acts like one).
      *   Bentham: Utility is the default. Interference requires net pain. If the pain of antipathy (the public's disgust) is counted, it *could* outweigh the pleasure of the act.
      *   *Crucial Distinction:* Mill excludes "antipathy" from the calculation of harm. Bentham acknowledges antipathy but tries to dismiss it as irrational. However, in strict utilitarianism, pain is pain. If the majority feels pain from knowing the act exists, a strict Benthamite calculus *could* ban it.

