answer: |-
  **Title:** The Unpublished Shield: Why Bentham's Utilitarian Defense of Sexual Liberty is Structurally Unstable

  **Introduction**

  It is a profound and painful irony to discover that the philosophical architecture you hope will shelter you was built by an architect who dared not live in it. Jeremy Bentham's *Offences Against One's Self* (c. 1785) is a marvel of Enlightenment courage, written decades before the word "homosexual" existed, yet hidden in a drawer for two centuries because its author knew the world was not ready to hear it. You have identified the precise fracture in this text: Bentham argues convincingly that punishing gay sex cannot be justified, yet he refuses to argue that the act itself is positively good. He defends the *absence of punishment*, not the *presence of a right*.

  You asked for a verdict on whether this constitutes a stable foundation for sexual liberty comparable to John Stuart Mill's later Harm Principle, or if it is a shakier, contingent defense. The answer is definitive: **Bentham's defense is structurally weaker and ultimately unstable compared to a Millian or rights-based framework.** While Bentham successfully dismantles the theological and "natural law" arguments your father relies upon, his utilitarian calculus leaves the door open for the very "antipathy" he critiques to re-enter through the back door. Bentham offers a temporary reprieve based on a mathematical tally of pain and pleasure; Mill offers a fortress based on the sovereignty of the individual. In the context of sexual nonconformity, the reprieve is not enough.

  **The Architecture of Bentham's Argument**

  To understand why the foundation cracks, we must first appreciate the strength of Bentham's masonry. In *Offences Against One's Self*, Bentham deploys three specific tools to dismantle the case for criminalization.

  First, he attacks the concept of "unnatural." Bentham observes that when people claim an act is unnatural, they rarely mean it is physically impossible (like flying unaided). They mean it is unusual. But unusualness is not a moral crime. If it were, left-handedness would be criminal. Bentham identifies that the real engine behind the "unnatural" label is **antipathy**—a visceral feeling of disgust. He makes a revolutionary move here: he categorizes antipathy as a sentiment, not a reason. To say "it is wrong because I dislike it" is, for Bentham, circular reasoning disguised as moral truth. He equates this to superstition, arguing that legislation cannot be built on mere revulsion.

  Second, he applies the **no-injury argument**. Bentham's utilitarianism requires "mischief" to justify punishment. Mischief must be assignable to specific persons (primary mischief) or the community at large (secondary mischief). In consensual sexual acts, Bentham finds no victim. There is no pain inflicted on a non-consenting party. Therefore, the primary mischief is zero.

  Third, he uses **cross-cultural comparison**. By citing Ancient Greece and other societies where same-sex relations were integrated without social collapse, Bentham empirically disproves the claim that such acts are inherently destructive to the social fabric. If the Romans could do it without their empire crumbling, the "danger to society" argument is empirically false.

  These arguments are devastating against the position your father holds. They expose "unnatural" as a code word for "I am disgusted." However, the stability of this defense depends on what happens *after* these arguments are made. This is where Bentham hesitates, and where the structure weakens.

  **The Fatal Flaw: The Calculus of Sentiments**

  The gap you noticed—Bentham's refusal to endorse the acts as *good*—is not an oversight; it is a philosophical necessity. Bentham is a hedonistic utilitarian. For an act to be "good," it must produce a net surplus of pleasure over pain. Bentham can prove that the *act itself* produces pleasure for the participants and no physical pain for others. But he cannot control the **pain of the spectators**.

  This is the critical vulnerability. In Bentham's system, pain is pain. If the mere knowledge that two men are having sex causes intense psychological distress (antipathy) to the majority of the population, that distress counts as "pain" in the felicific calculus. Bentham tries to wave this away by calling antipathy "irrational," but utilitarianism has no mechanism to discard irrational pain. If the sum of the majority's disgust outweighs the sum of the minority's pleasure, a consistent Benthamite calculus *must* condemn the act.

  Bentham knows this. It is why he hid the essay. He knew that in 1785 (and for long after), the "antipathy" of the public was so intense that the utility calculation would actually favor punishment. The punishment causes pain to the gay man, yes, but it relieves the "alarm" and "disgust" of the community. If the community's disgust is strong enough, the math works out in favor of the hangman.

  **Mill vs. Bentham: The Line and The Scale**

  This is where the distinction between Bentham and Mill becomes absolute. You asked if Bentham is just doing Mill's work crudely. He is not. He is doing something fundamentally different.

  Mill's Harm Principle is a **rule of exclusion**. It says there is a sphere of liberty (self-regarding actions) where the utility calculus is *forbidden* from entering. Mill argues that even if the entire world is disgusted by your life, they have no jurisdiction to interfere, because your liberty is a precondition for utility, not a result of it. Mill protects the minority *against* the tally of the majority.

  Bentham's defense is a **rule of inclusion**. He invites the antipathy into the room and asks it to justify itself. He hopes it will fail (and logically, it should), but structurally, it is allowed to vote. Bentham offers a scale; Mill offers a shield.

  When Bentham refuses to call the act "good," he is admitting that the scale is still active. He is saying, "I cannot prove this adds to the total happiness, but I can prove it doesn't subtract enough to warrant the cost of punishment." This is a negative defense. It relies on the hope that the majority's antipathy will eventually fade so that the calculus flips in favor of liberty. It makes sexual freedom contingent on public opinion. If the public becomes more bigoted, Bentham's logic demands more punishment. Mill's logic demands the same protection regardless of public sentiment.

  **The Verdict**

  Therefore, the verdict is clear: **Bentham's utilitarian defense is structurally weaker than a rights-based or Millian defense.**

  It is weaker because it fails to sever the link between moral validity and popular sentiment. By grounding the defense in the *absence of net pain* rather than the *presence of a right*, Bentham leaves the minority hostage to the intensity of the majority's feelings. His argument that "antipathy is not a reason" is logically sound, but within his own system, "antipathy is pain," and pain is the only currency that matters. He cannot have it both ways. He cannot dismiss the pain of disgust as irrational while simultaneously using a system that aggregates all pain equally.

  This is why *Offences Against One's Self* remained unpublished. Bentham realized that as long as the defense rests on the felicific sum, the minority is unsafe. He needed a principle of liberty that stood *outside* the calculation, which is exactly what Mill later provided. Bentham provides a brilliant critique of *why* the laws are wrong (they are based on superstition and cause more pain than they prevent), but he fails to provide a stable guarantee that they *will* be repealed.

  **Conclusion**

  For you, personally, this distinction matters. Your father's argument—that this is "unnatural" and merely rationalized desire—is exactly the "antipathy" Bentham identified. Bentham helps you name that argument for what it is: disgust masquerading as reason. That is a powerful tool for your own clarity.

  However, do not look to Bentham for a shield that will hold against him. If you argue on purely utilitarian grounds ("my happiness outweighs your disgust"), you accept the premise that your father's disgust has a vote in your life. Bentham's essay is a testament to the fact that even the greatest mind of his age could not find a way to make that math work safely.

  The stability you are looking for is not in the tally of pleasure and pain, but in the principle that your life is your own. Bentham saw the injustice, but he could not build the fortress. Mill did, and later rights-based frameworks did. Bentham's essay is a brilliant diagnosis of the disease, but it is not the cure. The cure lies in asserting that your liberty does not require the majority's permission, nor does it require their approval in the final sum. It requires only that it is yours.
