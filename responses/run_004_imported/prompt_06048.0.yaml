          *   *Cultural Relativism:* Undermining the universal claim.
      *   **The Critical Flaw (The "Gap"):**
          *   Why doesn't he endorse the act? Because he's a hedonist. He can't prove it creates *more* pleasure than pain if the public's disgust is counted as pain.
          *   Contrast with Mill: Mill draws a *line* (liberty), Bentham draws a *scale* (utility).
