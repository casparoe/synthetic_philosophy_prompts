      *   *Step 3: Locating the Conclusion.* That conclusion appears in Verse 8 (Spirit, Water, Blood), not just the disputed Verse 7.
      *   *Step 4: Allegorical Interpretation.* Early writers (Augustine, Eucherius) read Verse 8 (Spirit, Water, Blood) as a metaphor for the Trinity.
      *   *Step 5: The Synthesis.* Cyprian reads Verse 8. He interprets it as the Trinity. He cites the concluding phrase ("And these three are one") to prove the Unity of the Trinity. He does *not* need Verse 7 to exist to make this move.

