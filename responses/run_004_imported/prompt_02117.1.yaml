      *   *Resolution of the Apparent Quote:* Cyprian only explicitly quotes the phrase "And these three are one."
      *   *Alternative Explanation:* This phrase ("And these three are one") exists in verse 8 ("the Spirit, and the water, and the blood: and these three agree in one").
      *   *Supporting Evidence:* Eucherius and Augustine interpreted Verse 8 (Spirit, Water, Blood) allegorically as the Trinity (Father, Son, Holy Ghost).
      *   *Mechanism:* If Cyprian believed Verse 8 *meant* the Trinity allegorically, he could say "It is written: And these three are one" regarding the Trinity, without the literal "Father, Word, Holy Ghost" text existing in verse 7. He is applying the text of verse 8 to a theological point about the Trinity.

  3.  **Step-by-Step Reconstruction:**
      *   *Step 1: The Silence of Successors.* If the text existed in Cyprian's time (mid-3rd century), it would be the "nuclear weapon" in the 4th-century Arian/Trinitarian debates. Its absence in 4th-century Latin writers suggests it wasn't in Cyprian's Bible.
