      *   Cyprian's citation must be loose/interpretive rather than a strict literal copy-paste.
      *   The phrase "And these three are one" must be present in the Verse 8 text available to Cyprian.
      *   The theological motivation must be strong enough to prompt Cyprian to map Verse 8 onto Trinitarian doctrine without a literal proof-text.

