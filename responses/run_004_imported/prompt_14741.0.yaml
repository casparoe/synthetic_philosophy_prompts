answer: |-
  This is one of the most profound places a writer can get stuck, because you have stumbled out of a plot problem and into a philosophical truth. You are asking the same question historians, biographers, and jurors ask: *Can action ever definitively prove intent?*

  The short answer to your philosophical question is: **No.** You are not missing a trick. The ambiguity is built into the situation.

  The longer answer, however, is that this isn't a bug in your novel; it is the feature. Here is how to break this down both philosophically and practically for your book.

  ### 1. The Philosophical Reality: The Underdetermination of Theory by Evidence
  In philosophy of science and history, there is a concept called the *underdetermination of theory by evidence*. It means that for any given set of data points (your grandfather's actions), there is always more than one explanatory theory (duty, fear, or guilt) that fits the data equally well.

  Your sister, your brother, and you are all looking at the same constellation of stars and drawing different shapes.
  *   **Sister (Duty):** Focuses on the *sacrifice*.
  *   **Brother (Fear):** Focuses on the *inertia*.
  *   **You (Guilt):** Focuses on the *anomaly* (the cousin).

  None of you can be proven right without access to his internal monologue. Human beings are not only capable of lying to others about why they did something; we are experts at lying to ourselves. He might have *told* himself it was duty (sister's view), while his body reacted with avoidance (brother's view), driven by a subconscious need for atonement (your view).

  So, to answer your specific question: **No amount of extra thinking will break the tie on objective truth.** The "truth" of his interior life died with him. What remains is interpretation.

  ### 2. The Psychological Reality: Motives are Cocktails
  The trap you are falling into is the assumption that a character (or a person) must have *one* primary motivation for a major life choice. In reality, human motivation is almost never singular.

  It is entirely possible that:
  *   He turned down the job because he feared the change **(Brother)** BUT framed it as staying for the family's stability **(Sister)**.
  *   He stayed in the marriage out of a sense of religious or social duty **(Sister)** BUT also because he was terrified of being alone **(Brother)**.
  *   He gave the money to the cousin to right a specific wrong **(You)**, which gave him a sense of moral duty **(Sister)** that masked the specific guilt **(You)**.

  If you try to pick just one "theory of him," you might actually be making the character *less* true to life. Real people are contradictory. A character who is purely dutiful is a saint; a character who is purely fearful is a coward. A character who uses duty to justify fear is a human being.

  ### 3. The Writing Solution: How to Handle This in the Novel
  Since you are writing fiction ("loosely based"), you are not beholden to forensic truth. You are beholden to *narrative truth*. You have three distinct paths forward, and all of them are valid.

  **Option A: The Layered Motive (The "Cocktail")**
  Don't choose one theory. Write him as a man who believes he is acting out of Duty, while the reader (and perhaps other characters) begins to suspect Fear, with the Guilt acting as the ticking time bomb underneath it all.
  *   *Why this works:* It satisfies all three siblings' perspectives. It makes him complex. It allows for scenes where he preaches loyalty (Sister's view) while trembling at the thought of a confrontation (Brother's view).

  **Option B: Make the Ambiguity the Point**
  If this is a novel about a family trying to understand a father/grandfather, make the *inability to know him* the central theme. Have the characters in the book argue exactly what your family is arguing.
  *   *Why this works:* It mirrors your real-life struggle. The "mystery" isn't "what did he do?" (we know that), the mystery is "who was he?" The book becomes an exploration of how we project our own needs onto the people we love. Your sister wants him to be noble; your brother wants him to be flawed but understandable; you want him to be secretive. The book can explore why *you* need him to be those things.

  **Option C: Choose the "Emotional Truth" (Your Theory)**
  You mentioned you suspect guilt. In fiction, the most compelling truth is often the one that generates the most tension. "Duty" is static. "Fear" is reactive. "Guilt" is active; it demands resolution, secrets, and consequences.
  *   *Why this works:* If you write him as a man haunted by a secret, it gives you a through-line for the plot. Even if it's not historically accurate, if it *feels* true to the emotional reality of the family dynamic, it is a valid artistic choice. You are writing a novel, not a biography.

  ### 4. A Practical Exercise to Get Unstuck
  To move past the 40k word snag, try this:

  Take the scene where he turns down the job. Write it three times.
  1.  **Version 1:** He turns it down purely out of noble Duty.
  2.  **Version 2:** He turns it down purely out of Cowardice/Fear.
  3.  **Version 3:** He turns it down because of a Secret/Guilt.

  Read them. Which one creates the most friction with the scenes that come *after*? Which one makes the subsequent choices (the marriage, the money) feel inevitable?

  Usually, one of these versions will unlock the next 40k words. That is the version you should use for the *book*, regardless of which version is historically "correct."

  ### Summary
  You are not missing a trick. The ambiguity is real. But in fiction, ambiguity is not a problem to be solved; it is a texture to be explored.

  Your grandfather left you a puzzle, and your family is fighting over the solution. That fight *is* the story. If you can capture the feeling of loving someone you cannot fully know, you won't just have a book about your grandfather; you'll have a book about every child trying to understand their parents.

  Pick the motivation that hurts the most to write. That's usually where the truth lives.
