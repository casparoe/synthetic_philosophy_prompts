answer: |-
  **Setting:** *The private dining room of a hotel near the convention center. It is late. The clatter of cutlery has subsided, replaced by the low hum of exhausted conversation and the occasional pop of a cork. Two plates sit largely unfinished between them.*

  **Characters:**
  *   **ELENA:** A consequentialist ethicist. Pragmatic, energetic, wears her conviction lightly but holds it tightly.
  *   **MARCUS:** A deontologist with leanings toward virtue ethics. Precise, weary, concerned with the texture of moral agency.

  ***

  **MARCUS:** You were nodding quite vigorously during the panel on Ord's paper, Elena. I thought you might applaud when he mentioned the wildlife cull example.

  **ELENA:** It's the only sane way out of the deadlock, Marcus. We spend our careers shouting past one another. The vegetarian screams about suffering, the hunter screams about tradition or ecosystem management, and the animals die either way, but with more acrimony. If they trade, the net suffering drops. The vegetarian gets fewer cows slaughtered globally; the hunter gets the cull they think is necessary for the deer population. Both get more of their own values realized. It's Pareto optimal for conscience.

  **MARCUS:** It's Pareto optimal for *satisfaction*, perhaps. But morality isn't a menu of preferences. That's the sleight of hand. Ord treats my conviction that "X is wrong" as if it were a taste for "I dislike X." If I believe the cull is inherently unjust—a violation of the rights of those animals—then facilitating it, even for a price, isn't a strategic compromise. It's complicity.

  **ELENA:** Complicity in what, exactly? In the cull? The cull is happening. That's the baseline. The choice isn't between "Cull" and "No Cull." The choice is between "Cull plus high meat consumption" and "Cull plus reduced meat consumption." If you refuse the trade because you want to keep your hands clean, you are prioritizing your own moral hygiene over the actual reduction of harm in the world. You're letting the perfect be the enemy of the good.

  **MARCUS:** I'm prioritizing integrity. If I sell my opposition to something I believe is evil, I am no longer an opponent of that evil. I am a vendor. You say I'm reducing harm, but I'm also normalizing the transaction. I'm establishing a market price for injustice. Once we admit that moral objections are negotiable assets, we invite the highest bidder to set the ethical standard.

  **ELENA:** But the market doesn't set the standard! That's the beauty of it. Each side keeps their own standard. The vegetarian still thinks eating meat is wrong. The hunter still thinks the cull is right. They just acknowledge that they have different leverage. It's comparative advantage, Marcus. David Ricardo didn't argue that England and Portugal had to agree on the *value* of wine versus cloth to trade. They just had to agree on the exchange rate. Why is it virtuous to be inefficient with your morality?

  **MARCUS:** Because nations aren't moral agents. People are. When a country trades, it doesn't have a soul to corrupt. When *I* agree to tolerate what I call a sin, I am reshaping my own character. You talk about leverage, but let's follow that thread. Who has the leverage in your moral market?

  **ELENA:** Whoever has the capacity to affect the outcome.

  **MARCUS:** No. Whoever has the *resources*. Let's take a darker example than the cull. Suppose a corporation is dumping waste that harms a community. A local activist group opposes it. Under a moral trade regime, the corporation could say, "We will donate two million dollars to your favorite charity, or build a school, if you agree to drop your protest and permit the dumping." The activist gets more of what they value—education for the poor—but they sell out the community breathing the fumes.

  **ELENA:** That's a straw man. Moral trade requires that the trade be beneficial *by each party's own lights*. If the activist genuinely believes the dumping is a rights violation, no amount of money compensates for it. The trade wouldn't happen. The trade only happens if the activist values the school *more* than they disvalue the dumping.

  **MARCUS:** But that's the laundering operation! It allows the wealthy to convert their financial surplus into moral immunity. It creates a class of professional objectors who are paid to look the other way. It turns conscience into a luxury good that the poor can't afford to keep. If I am starving, my "price" for tolerating injustice is low. If you are wealthy, your cost of buying immunity is negligible. You haven't solved the ethical disagreement; you've just monetized the power imbalance.

  **ELENA:** Power imbalances exist regardless of the trade! The corporation dumps the waste anyway. The activist burns out, gets crushed, and nothing changes. At least with trade, the activist extracts a concession. You're assuming that refusing to trade preserves some moral high ground. It doesn't. It just leaves you powerless and pure. Is purity the goal? Or is it improving the world?

  **MARCUS:** If the goal is improving the world, we have to look at second-order effects. If we institutionalize moral trade, we erode the concept of non-negotiable rights. We teach the next generation that everything has a price. When the next activist faces the next corporation, they won't ask "Is this right?" They'll ask "What's the offer?" You might get a better deal on the margin today, Elena, but you degrade the currency of moral argument for tomorrow.

  **ELENA:** Or, you teach them that dogmatism is expensive. Look at politics. We already do this. Logrolling. I vote for your farm subsidy, you vote for my environmental bill. Nobody claims Congress is selling out the soul of the nation every time they pass a budget; they acknowledge that in a pluralistic society, cooperation requires concession. Why is it corruption in ethics but statesmanship in politics?

  **MARCUS:** Because politics is about resource allocation. Ethics is about truth claims. If I believe slavery is wrong, I don't want a slave owner to agree to free half his slaves in exchange for me guarding the other half. I want him to stop. Moral trade works best when the stakes are low—dietary preferences, charitable giving. It breaks down when the stakes are high, precisely because that's when we believe we are dealing with truths, not tastes. And the moment you put a truth up for auction, you've already decided it isn't a truth.

  **ELENA:** But we *disagree* on the truths! That's the premise. You think it's a truth; I think it's a mistake. If I'm right, and you refuse to trade, you are actively allowing more harm to happen because you're afraid of being tainted. It's a kind of moral narcissism. "As long as *I* didn't sign the paper, the suffering isn't on my hands." But it is. By refusing to engage with the machinery of the world to steer it slightly less badly, you are abdicating agency.

  **MARCUS:** And by engaging, you become a gear in the machinery. You say it's not narcissism to want to remain capable of saying "No." If I can be bought, even for a good cause, I lose the authority to condemn the buyer later. If I take the corporation's money to build the school, can I ever truly condemn the pollution again? I've been compromised. My voice is no longer independent; it's bought and paid for.

  **ELENA:** Your voice is independent, but it's ineffective. Would you rather be a prophet in the wilderness or a mechanic in the engine room?

  **MARCUS:** I'd rather not be a mechanic for an engine I believe is driving off a cliff.

  **ELENA:** But you can steer the wheel!

  **MARCUS:** Only if I agree to drive.

  *(A silence falls between them. A waiter arrives to clear the plates, offering a momentary reset. Marcus swirls the last of his wine.)*

  **ELENA:** Consider this, then. You say it degrades the currency. But maybe the currency was already inflated. We claim absolute certainty on things we can't prove. We demand total victory in ethical disputes where total victory is impossible. Moral trade forces humility. It forces me to admit that you might value something as much as I value mine. It forces cooperation across the aisle. Isn't there some virtue in that? In refusing to treat your opponent as an enemy to be crushed, but as a partner in a complex system?

  **MARCUS:** There is virtue in cooperation. But there is also vice in collusion. The line between the two is thin, and I fear your framework dissolves it. You ask me to trust that the trade will be net positive. But who calculates the net? If we trade, we create a shadow market where the metrics of value are hidden. The vegetarian and the hunter agree on a number, but the deer don't get a vote. The community breathing the fumes doesn't get a vote. Moral trade is often a contract between two parties that externalizes the cost to a third.

  **ELENA:** Unilateral action does that too. The vegetarian bans meat imports, and the farmers in the developing world starve. Every action has externalities. Trade just makes the costs explicit. It brings the negotiation into the light.

  **MARCUS:** Does it? Or does it just dress up the negotiation in the language of mutual benefit so we don't feel the weight of the concession?

  **ELENA:** Maybe feeling the weight is the problem. Maybe we feel it too much, and that's why nothing moves.

  **MARCUS:** Or maybe feeling the weight is the only thing that stops us from moving in the wrong direction.

  *(Elena signals for the check. She looks at Marcus, a small, tired smile on her face.)*

  **ELENA:** So. We agree to disagree?

  **MARCUS:** *(Laughs softly)* If we trade on that... I'll concede the point on charitable giving if you concede that we shouldn't try this on human rights violations.

  **ELENA:** I can't concede that. I might save too many lives.

  **MARCUS:** And I might lose too much of our soul.

  **ELENA:** Then I suppose we're at an impasse.

  **MARCUS:** An impasse is better than a bad deal.

  **ELENA:** Or it's just a wasted opportunity.

  *(They stand. Neither offers a hand to shake, nor do they turn away in anger. They simply walk toward the coat check, the question hanging in the air between them, unresolved, as the lights in the dining room begin to dim.)*
