      *   **Anti-Moral Trade (Complicity Objection):** Needs to be deontological-leaning or virtue-ethics focused, concerned with integrity, corruption, and power dynamics. Let's call him *Marcus*. He sees morality as about principles and the danger of commodifying conscience.

  3.  **Key Arguments to Include:**
