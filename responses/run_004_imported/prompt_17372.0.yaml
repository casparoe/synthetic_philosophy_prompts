      *   *Elena's Rebuttal:* The world doesn't care about your purity; it cares about the suffering that actually occurs.

  7.  **Final Polish:** Check the rhythm. Ensure the wine glass clinks and the background noise fade in and out to ground the scene. (Mental note: Keep the focus on the arguments, don't overdo the stage directions).

