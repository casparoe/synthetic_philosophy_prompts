answer: |-
  If Denny were here right now, standing at this podium, he'd probably clear his throat, adjust his glasses, and tell us that the lump in our throats is a "user illusion." He'd say that the heavy, glowing sadness we feel is real, but the idea that it's made of some special, magical substance is just a trick our brains play to help us navigate the world.

  And then, seeing the looks on our faces, he'd laugh, pour himself a drink, and tell us to just feel it anyway.

  For those of you who knew Denny from the bowling league, or as a cousin, or a neighbor, you knew a man who was endlessly curious. He was the guy who wanted to know *how* the pins fell, not just that they fell. But for me, he was my teacher. We didn't go to college. Instead, for fifteen years, we sat on his porch with library books and printed-out articles, arguing about the mind.

  We spent a long time talking about what makes us *us*. Denny came to a conclusion that might sound strange to some of you. He believed that the "spark" inside us—the idea that there's a little ghost in the machine watching the show—isn't actually there. He thought consciousness was like a desktop icon on a computer. The icon looks like a folder, but it's not really a folder; it's just a way for the system to let you access the files.

  He believed the "magic glow" of experience was an illusion. But—and this is the part that matters most—he never, ever believed that *we* were an illusion.

  He used to worry that when he died, people would swing too far one way or the other. He made me promise, right before he got too sick, that I wouldn't lie about where he went. He said to me: "Don't you dare tell people I'm watching over them, and don't you dare tell them I didn't really love them either. Those are wrong for the same reason."

  To Denny, both of those statements relied on the idea that love needs magic to be real. He rejected the magic. He believed that when he hugged his grandkids, or bowled a strike, or spent three hours debating me on a humid Tuesday night, that was the reality. The neurons firing, the time spent, the actions taken—that was the love. It didn't need a soul to validate it. It was valid because it happened.

  For the philosophers here: I know he wasn't an eliminativist. He knew the pain was pain. He knew the joy was joy. He just knew the "inner eye" was a metaphor.

  For the rest of us: What this means for our grief is something I think Denny would find comforting. It means we don't have to wait for him to be somewhere else to find him. We don't have to look up. We look around.

  He is in the way his daughter tells a story. He is in the way his bowling team covers for each other when someone's game is off. He is in the way I think twice before accepting an easy answer. The "pattern" of Denny is written into us. That isn't magic. It's physics. It's cause and effect. He touched us, and we moved. We are still moving because of him.

  Denny didn't believe he was going to a better place. He believed this place, the one where we actually loved each other, actually sat on porches, and actually held hands in hospital rooms, was the only place there ever was. And he thought it was enough.

  So, I'm not going to tell you he's watching us right now. But I will tell you that he loved you. He loved you with his whole brain, with his whole time, and with his whole life. And if you feel that love missing today, that heaviness in your chest? That's not a ghost. That's just the shape of the space he left behind. And that is real.

  Thank you.
