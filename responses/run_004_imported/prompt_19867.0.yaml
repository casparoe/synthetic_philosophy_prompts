      *   **Distinguish Persuasion vs. Indoctrination:** Help the user spot the difference. (Emotional highs vs. data, us-vs-them mentality, sleep deprivation/isolation tactics).
      *   **Actionable Strategy:** What to do Monday?
          *   *Externally:* Be professional, engaged, open-minded.
          *   *Internally:* Maintain a "observer mode." Keep a private journal.
          *   *Boundary:* Don't make life-altering decisions based on week-one feelings.
      *   **The "Rational Move":** It's not about believing or not believing *now*; it's about maintaining the *capacity* to change your mind later based on reality, not emotion.

  7.  **Refine the Tone:**
