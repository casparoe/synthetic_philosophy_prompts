prompt: |-
  I just accepted a job at a startup that's kind of infamous for this: literally everyone who goes through the first week of orientation comes out completely convinced the founder's mission is the most important work happening in the industry, no matter how skeptical they walked in. My friend who works there was super cynical about "changing the world" pitches before she started, and she says it got her too, right on schedule by day three. I start Monday, and right now I honestly think the mission is mostly hype, but its messing with my head a bit - if I already basically know for a fact what I'm gonna believe by Friday anyway, shouldn't I just skip ahead and believe it now instead of stubbornly "waiting" to be convinced? Or is there something actually wrong with reasoning like that, especially since I can't tell if what happens in there is legit persuasion or just really effective groupthink? Would love a sanity check on what the rational move even is here before I walk in Monday.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Context:** Starting a new job at a startup known for intense orientation/onboarding.
      *   **Reputation:** "Infamous" for converting skeptics into true believers within the first week (specifically by day three).
      *   **Evidence:** A friend (previously cynical) experienced this conversion.
      *   **Current State:** User is skeptical ("mostly hype") but anxious about the inevitability of the conversion ("messing with my head").
      *   **The Core Question:** Should I pre-emptively adopt the belief since it seems inevitable? Or is there a flaw in this reasoning? Is it persuasion or groupthink? What is the *rational* move?

  2.  **Deconstruct the Psychological Dynamics:**
      *   **The "Cult" Vibe:** High-intensity onboarding, mission-driven rhetoric, rapid belief conversion. This triggers alarm bells for *cultic* behavior or high-control group dynamics.
      *   **Cognitive Dissonance:** The user is holding two conflicting thoughts: "I think this is hype" vs. "I will soon believe this is truth."
      *   **Pre-commitment/Pre-emption:** The user suggests skipping the process and believing now to avoid the mental tug-of-war.
      *   **Rationality Check:** Is it rational to adopt a belief because you know you'll be manipulated into holding it? Or is it rational to maintain critical thinking as long as possible?

  3.  **Evaluate the "Skip Ahead" Strategy:**
      *   *Pros:* Reduces immediate anxiety, might help with social integration, avoids friction during onboarding.
      *   *Cons:* Bypasses critical evaluation, makes you vulnerable to exploitation, reduces your ability to spot actual red flags later, undermines intellectual integrity.
      *   *Verdict:* It's a defense mechanism (rationalization), not a rational strategy for long-term career health.

  4.  **Evaluate the "Wait and See" Strategy:**
      *   *Pros:* Maintains critical thinking, allows for evidence-based assessment, protects against potential burnout or ethical issues, keeps options open.
      *   *Cons:* Might feel isolating during onboarding, could create friction if dissent is not tolerated.
      *   *Verdict:* This is the healthier, more rational approach, *but* needs nuance. You don't have to be openly hostile, just internally reserved.

  5.  **Identify the Red Flags (The "Infamous" Reputation):**
      *   Rapid belief conversion is a hallmark of *indoctrination*, not just *persuasion*.
      *   Legitimate companies convince through results, transparency, and time.
      *   High-pressure onboarding often masks operational chaos or unethical practices.
      *   The friend's experience ("right on schedule") suggests a scripted psychological process, not organic alignment.

  6.  **Formulate the Advice:**
