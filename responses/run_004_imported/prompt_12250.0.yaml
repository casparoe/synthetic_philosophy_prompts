answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm a backend engineer, which means I spend my life building structures that hold things up so other people can use them without worrying about the collapse. In a way, that's exactly what I'm doing up here tonight. I'm trying to build a structure of words that holds up [Groom] and [Partner] without collapsing into a lecture.

  Because we need to address the elephant in the room. [Groom] has been obsessed with Ancient Greek philosophy since freshman year. If you've ever been stuck next to him at a bar, you've heard the story about Socrates in the *Symposium*—how he outdrank the entire room and didn't even stumble. It's his favorite party trick of a fact.

  But here's the thing: [Groom] actually hates that story. He says it's the shallow version. He's spent years telling me that the real wisdom isn't in the *Symposium*. It's in a book called *The Laws*.

  I'll keep the lecture brief, I promise. In *The Laws*, Plato argues that drinking isn't just about fun, and it's not an endurance contest. He says drinking is a test. It's a fire drill for your character. When you lower your inhibitions, your true self comes out. But—and this is the critical part—he says you can't just let everyone loose. For the test to work, for it to be safe, you need a designated leader. A sober guardian. Someone wise enough to steer the ship so the vulnerability doesn't turn into chaos.

  Basically, Plato says the only time it's safe to let your guard down is when you trust the person holding the keys.

  And when I look at [Groom] and [Partner], I don't see the *Symposium*. I don't see a competition about who can stay standing the longest. I see *The Laws*.

  I see two people who have created a space where they can both let their guards down, knowing the other person is sober enough to catch them. [Groom], you're brilliant, but you can get in your head. [Partner], you ground him. [Partner], you're fierce and driven, but [Groom] reminds you to breathe. You are each other's sober guardians. You've built a marriage where the rules aren't about restriction; they're about safety. You've agreed to be the one person in the room who never loses sight of the other, no matter how loud the noise gets.

  That is a rare thing. Most people look for a drinking buddy. You two found a symposiarch. You found the person who makes it safe to be vulnerable.

  So, as we head to the open bar tonight, remember: the goal isn't to see who can outdrink the room. The goal is to look out for the person next to you.

  If everyone could please raise a glass.

  To [Groom] and [Partner]. May your love be the wisdom that guides the feast, and may you always be the sober guard for each other's hearts.

  To the happy couple!
