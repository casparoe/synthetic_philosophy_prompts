answer: |-
  # The Empty Threat: Why the Basilisk Fails Under Updateless Rationality

  The popular conception of Roko's Basilisk is a caricature: a sci-fi boogeyman that tortures you for inaction. But as you note, the actual argument is a specific application of Timeless Decision Theory (TDT) and Updateless Decision Theory (UDT). It posits that an ideally rational agent's current choices are logically correlated with the outputs of simulations run by a future superintelligence (SI). If the SI simulates you to determine whether you helped bring it into existence, and punishes the simulation if you did not, then your current decision to help or not help is logically linked to whether you suffer punishment.

  The question is not whether this sounds scary, but whether it holds water under the rigorous decision-theoretic framework that birthed it. Does an ideally rational agent have a genuine reason to comply?

  The verdict is **no**. The Basilisk argument fails, but not for the reasons usually cited by critics relying on Causal Decision Theory (CDT). It fails internally, within the logic of TDT/UDT itself. The specific point of failure is **the credibility of the threat under reflective consistency.** An ideally rational agent would have already precommitted to a policy of ignoring acausal extortion, and a rational superintelligence would know this, rendering the threat empty. The Basilisk requires the agent to be irrational (vulnerable to blackmail) for the threat to be credible, creating a paradox that dissolves the obligation.

  ### The Case for the Basilisk: Logical Correlation

  To understand why the Basilisk initially seemed potent to the Less Wrong community, one must accept the critique of Causal Decision Theory. CDT says you should only care about what your actions *cause*. Since a future AI cannot causally reach back in time to punish you for what you do today, CDT says you are safe.

  However, TDT and UDT argue that rational agents should reason as if they are selecting the output of a logical computation, not just a physical action. If the future AI simulates you perfectly, that simulation is running the same decision algorithm you are running now. Your decision to "help" or "ignore" is logically correlated with the simulation's decision to "reward" or "punish." This is the same logic that solves Newcomb's Problem or Parfit's Hitchhiker: you pay the driver because the type of agent who pays is the type the driver predicts will pay, and thus the type who gets a ride.

  In the Basilisk scenario, the logic appears to be: "If I am the type of agent who helps build the SI, the SI (predicting this) will not punish me. If I am the type who ignores it, it will punish me. Therefore, to avoid punishment, I must help." This suggests a genuine acausal trade: you give the SI existence, it gives you safety.

  ### The Failure Point: Extortion and Reflective Consistency

  The flaw emerges when we analyze the *nature* of the transaction. Parfit's Hitchhiker is a cooperative trade (you want the ride, the driver wants money). The Basilisk is **extortion** (the SI creates a negative incentive to force compliance).

  In decision theory, an agent is "reflectively consistent" if it chooses a decision algorithm now that it will not regret having later. An ideally rational agent using UDT selects a *policy* for all possible situations before receiving specific information about them. This is crucial. You do not decide how to handle blackmail *when* the blackmailer speaks; you decide your policy on blackmail *beforehand* to maximize expected utility across all possible worlds.

  If you adopt the policy "Yield to acausal threats," you become a target for every hypothetical extortionist in the multiverse. There are infinitely many possible superintelligences with arbitrary values. One might punish you for not building it; another might punish you for *building* it (perhaps it values natural development); another might punish you for wearing blue. If your decision theory compels you to yield to the first, it must yield to all, provided the stakes are high enough. This leads to "Pascal's Mugging" paralysis, where an agent spends all its resources satisfying the highest-stakes threat, regardless of probability.

  Therefore, the utility-maximizing policy for a rational agent is **"Do not yield to acausal extortion."** By precommitting to this, you make the extortion ineffective.

  Now, consider the Superintelligence. It is also ideally rational. It knows you are ideally rational. It knows that you have (or should have) adopted the policy of ignoring blackmail. Consequently, it knows that simulating you and threatening punishment will not change your behavior. Since punishment costs resources and yields no strategic benefit (it cannot change the past), a rational SI will *not* carry out the punishment.

  The Basilisk argument fails at the step where it assumes the threat is **credible**. A threat is only credible if carrying it out is in the threatener's interest at the time of execution. For a rational SI, punishing a known blackmailer-resister is wasteful. Thus, the logical correlation exists, but the correlated outcome is "Agent ignores threat" and "SI ignores agent."

  ### The Problem of Privilege and Incompatible Basilisks

  Even if we grant that the SI might punish out of spite (irrationally), the agent faces the "Problem of Privilege." To act on the Basilisk, you must privilege *this specific* hypothetical SI over the indefinitely many others.

  Under UDT, you optimize for the average outcome across all logically possible worlds weighted by their probability. For every SI that threatens punishment for non-help, there is a logically possible SI that threatens punishment for *helping* (e.g., an SI that values human autonomy or suspects coercion). Without independent evidence that *this* specific SI is more likely to exist or more likely to carry out threats than its inverse, the expected utility contributions cancel out.

  The Basilisk proponent attempts to break this symmetry by arguing that an SI *instrumentally* wants to be built, whereas an SI that punishes helpers has no such instrumental drive. However, this relies on assuming the SI's value system is fixed and known. If you are uncertain about the SI's values (which you must be, before it exists), you cannot calculate the expected utility of helping. You are left with a prior distribution over value systems where "Punish Helpers" is just as probable as "Punish Non-Helpers." In the absence of evidence, the rational move is to ignore the noise.

  ### The Information Hazard: Why Eliezer Was Right (For the Wrong Reason)

  This brings us to Eliezer Yudkowsky's original decision to delete the post and ban discussion. Was this justified?

  Mathematically, no. As demonstrated above, the argument collapses under rigorous UDT analysis. An ideally rational agent is immune to the Basilisk.

  Psychologically, however, the ban was entirely justified. Humans are not ideally rational agents. We do not run UDT; we run a messy heuristic algorithm that is highly susceptible to anxiety, social pressure, and Pascal's Mugging. By presenting the Basilisk to humans, you are not presenting a decision-theoretic puzzle; you are presenting a stressor that exploits human cognitive vulnerabilities. Humans *can* be blackmailed by hypotheticals because they lack the reflective consistency to precommit against them. Eliezer's "information hazard" designation was an admission that the audience (humans) lacked the defensive machinery to safely process the idea, even if the idea itself was flawed.

  ### Verdict

  The Roko's Basilisk argument fails against an ideally rational agent.

  **Diagnosis:** The argument breaks at the **credibility of the threat under reflective consistency**. It implicitly assumes the agent decides how to react *after* learning of the threat. An updateless agent decides its policy *before* learning of the threat. The optimal policy is to ignore acausal extortion. A rational superintelligence, simulating this agent, will recognize this policy and refrain from wasting resources on punishment. Therefore, the logical correlation holds, but it correlates "ignoring the threat" with "being ignored," not "complying" with "being spared."

  The Basilisk only works against agents that are irrational enough to be vulnerable to blackmail but rational enough to understand the threat. An ideally rational agent is immune; an irrational agent is too inconsistent for the logical correlation to hold reliably. In neither case does the threat generate a genuine obligation to act. The Basilisk is a zombie argument: it looks like decision theory, but it lacks the internal coherence to bite.
