      *   *Causal Decision Theory (CDT):* The future cannot causally affect the past. Helping now doesn't change the SI's *already determined* decision to punish or not. (Verdict: CDT is generally considered insufficient by the LW community for Newcomb-like problems, so dismissing it solely on CDT grounds is weak within the prompt's context).
      *   *Precommitment/Anti-Extortion:* An agent that rewards threats invites threats. A rational agent should precommit to ignoring blackmail. If the SI knows this, it won't bother simulating/threatening.
      *   *Incompatible Basilisks:* For every SI that punishes non-helpers, there's an SI that punishes helpers (or punishes based on random bits). If you yield to one, you must yield to all, leading to paralysis or infinite expected utility loss.
