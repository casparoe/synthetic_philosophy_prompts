answer: |-
  Good evening, everyone. For those of you who don't know me, I'm [Your Name], [Sister's Name]'s younger sibling.

  Many of you know that [Sister's Name] wrote her undergraduate thesis on Émilie du Châtelet. In fact, if I'm being honest, I'm only standing here today because she wouldn't stop talking about du Châtelet until I enrolled in a seminar on her myself. So, it feels appropriate to borrow a few ideas from the *Discourse on Happiness* for this toast.

  Du Châtelet was not a sentimental thinker. She argued that strong passions are indispensable to happiness. She believed that the Stoic ideal of a calm, quiet life wasn't wisdom; it was just a recipe for boredom. To be truly happy, she said, we must care deeply about something.

  But she was also clear-eyed. She knew that romantic love, specifically, is volatile. She wrote that we cannot expect it to hold its original intensity forever. For some, that sounds cynical. But I think for [Sister's Name], it was always a call to courage. Because if passion is necessary, but fleeting, then happiness is not something you find—it is something you cultivate.

  Du Châtelet also argued that while we should discard harmful prejudices, we should keep certain "illusions." We need the stories we tell ourselves about the importance of our pursuits, and about the people we love, to make the passion worth sustaining.

  [Sister's Name] and [Partner's Name], looking at the two of you, I see this philosophy in action. You aren't relying on a fairy tale. You are making a clear-eyed choice to maintain the "illusion" that this love is the center of your world, and to do the work required to keep it true. Du Châtelet prized the passion of study because it depends only on ourselves. But today, you are promising to build a passion that depends on *each other*—a shared life that is resilient enough to weather the changes of time, and vibrant enough to keep boredom at bay.

  May your life together be full of necessary passions. May you never be too calm. And may you always find new reasons to sustain the beautiful illusions you share.

  To [Sister's Name] and [Partner's Name].
