answer: |-
  This is an excellent question that cuts to the heart of Sidgwick's methodological rigor, both in ethics and in his psychical research. You have correctly identified the tension: if the possibility of fraud is logically ineradicable, how does adding more witnesses help?

  To reconstruct Sidgwick's argument, we need to look at how he conceives of **scientific proof**, the **economy of credibility**, and the **burden of skepticism**.

  Here is a breakdown of the argumentative move Sidgwick is making.

  ### 1. The Status of the Fraud Allegation: Epistemic, Not Logical
  You asked whether Sidgwick is conceding that fraud can never be excluded (logical impossibility) or proposing a criterion for when the objection becomes unreasonable (epistemic limit).

  It is definitively the latter. Sidgwick is operating within a **probabilistic, Baconian framework of induction**, not a deductive one. When he says, *"We have done all that we can when the critic has nothing left to allege except that the investigator is in the trick,"* he is defining the **limit of scientific responsibility**, not the limit of logical possibility.

  For Sidgwick, scientific inquiry aims at "moral certainty" (certainty sufficient for rational belief and action) rather than metaphysical certainty. If the *only* remaining explanation for a phenomenon is a complex, unsupported hypothesis of deliberate deception, the investigator has discharged their duty. The fraud hypothesis remains *logically* available, but it has become *epistemically* costly.

  ### 2. Why Accumulation Helps (Solving the "Thousandth Witness" Puzzle)
  Your main puzzle is: *If the fraud-hypothesis is available against the first witness, why isn't it just as available against the thousandth?*

  Sidgwick's answer relies on the **probability of collusion** and the **De Morgan "Credit" metaphor**.

  **A. The Independence Assumption**
  Sidgwick's argument only works if the witnesses are independent. If you have one investigator, the fraud hypothesis requires one person to be lying or mistaken. If you have 1,000 independent investigators reporting similar phenomena, the fraud hypothesis transforms. It is no longer "Is this person lying?" It becomes "Is there a conspiracy of 1,000 people?" or "Are 1,000 people independently making the exact same specific error?"

  As the "heap of facts" grows, the fraud hypothesis becomes increasingly complex and improbable compared to the hypothesis that the phenomenon is real. Sidgwick is arguing that **scientific incredulity** (the belief that the phenomenon is impossible) must eventually yield to **critical incredulity** (the belief that mass fraud is occurring). At a certain point, it is more rational to believe the impossible phenomenon than to believe in the massive conspiracy required to fake it.

  **B. The Economy of "Credit"**
  This is where the De Morgan reference is crucial. Sidgwick writes: *"every additional witness who... has a fair stock of credit to draw upon, is an important gain."*

  Sidgwick views reputation as a form of capital. A reputable scientist (a "witness with credit") risks their social and professional capital when they endorse a claim.
  *   **Witness 1:** Risks their reputation. A skeptic might say they are a crank or a trickster.
  *   **Witness 100:** Now 100 reputable people are risking their careers.

  For the skeptic to maintain the fraud hypothesis against the "heap," they must allege that hundreds of credible people are either complicit in a fraud or grossly negligent. Sidgwick is arguing that **the cost of maintaining the fraud hypothesis rises with every additional credible witness.** Eventually, the skeptic is asking the "common sense of mankind" to believe something more incredible (mass scientific corruption) than the phenomenon itself.

  ### 3. The Target of the Argument
  It is vital to note who Sidgwick is addressing. He distinguishes between:
  1.  **"Incredulous outsiders" / "The critic":** The hardened skeptic who *"will allege [fraud]"* regardless of the evidence.
  2.  **"The common sense of mankind":** The reasonable, neutral observer.

  Sidgwick admits he cannot convince the hardened skeptic (*"When he has nothing else left to allege he will allege that"*). He is not writing for them. He is writing for the reasonable observer. His argument is that for the reasonable observer, there is a tipping point where rejecting the evidence requires more faith than accepting it.

  Therefore, the accumulation of evidence is not meant to logically trap the skeptic, but to **shift the burden of proof** so heavily that the reasonable observer must side with the SPR.

  ### 4. Reconstructing the Argument
  Putting this together, Sidgwick's argument in this passage can be reconstructed as follows:

  1.  **Premise 1:** Scientific certainty is probabilistic, not deductive. We aim to overturn established "scientific incredulity" not with one knockout blow, but with cumulative weight ("burying it alive under a heap of facts").
  2.  **Premise 2:** The credibility of evidence depends on the trustworthiness ("credit") of the investigator.
  3.  **Premise 3:** As independent, credible investigators accumulate, the probability of a unified fraud or identical error decreases exponentially.
  4.  **Premise 4:** There is a limit to reasonable skepticism. When the only remaining explanation for the data is a hypothesis of fraud that is more improbable than the phenomenon itself, the investigator's duty is done.
  5.  **Conclusion:** Therefore, the Society should not waste energy defending individual cases against the charge of fraud once the investigators' credibility is established. Instead, they should focus on accumulation, forcing the skeptic to either accept the phenomena or adopt an untenable conspiracy theory.

  ### Summary for your Seminar
  Sidgwick is making a **proto-Bayesian argument about the burden of proof**. He is conceding that fraud is *logically* possible but arguing that it becomes *rationally untenable* through accumulation.

  The "closing move" is not a surrender to skepticism; it is a **demarcation of rationality**. He is saying: "We have provided enough evidence that any rational person *should* be convinced. If you are not convinced, you are no longer arguing from evidence; you are arguing from a dogmatic commitment to materialism that requires you to believe in mass fraud instead."

  This fits Sidgwick's broader philosophical temperament: he is deeply concerned with the **limits of knowledge** and the **duties of belief**. He is trying to carve out a space where belief in psychical phenomena is not credulous, but is instead the result of a rigorous, cumulative epistemic process that has satisfied the requirements of "common sense."
