prompt: |-
  I'm a software engineer, and about a year ago I left my job to co-found a startup with a friend. We're now finishing our investor pitch deck, and my co-founder insists that one slide has to state a specific figure for our odds of succeeding — something like "we estimate a 35% probability of reaching profitability within three years." I keep resisting giving a single number. It isn't false modesty: given how little solid information we actually have, any figure from roughly 15% up to 45% strikes me as about equally defensible, and picking one point in that range feels made up.

  My co-founder argues this doesn't let me off the hook. He points out that whenever I make a call under uncertainty — how much runway to keep in reserve, whether to accept a modest early acquisition offer instead of holding out — I behave exactly as someone with one exact number in their head would behave, so I might as well commit to a figure honestly instead of pretending I haven't already picked one implicitly. Is he right that consistent decision-making under uncertainty secretly commits me to a single number whether I admit it or not, or can it actually be rational to act on a genuine range of odds without ever collapsing it down to one?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Dilemma:**
      *   **Context:** Software engineer turned co-founder, finishing investor pitch deck.
      *   **Conflict:** Co-founder wants a specific probability of success on a slide (e.g., "35%"). User resists, feeling any number in a wide range (15-45%) is equally defensible/arbitrary.
      *   **Co-founder's Argument:** Decision theory implies that consistent decision-making under uncertainty *implicitly* commits you to a specific probability (subjective probability). Therefore, you might as well state it explicitly.
      *   **User's Question:** Is the co-founder right? Does rational decision-making under uncertainty *require* collapsing a range into a single number? Or is it rational to act on a range without committing to a point estimate?
      *   **Underlying Issue:** This is actually two problems mixed together:
          1.  *Philosophical/Mathematical:* Is the co-founder theoretically correct about decision theory?
          2.  *Strategic/Practical:* Is putting a specific success probability on an investor pitch deck a good idea, regardless of the theory?

  2.  **Address the Theoretical Question (Decision Theory):**
      *   *Bayesian Perspective:* In subjective Bayesian decision theory, yes, to maximize expected utility, you effectively need a prior distribution. If you have to make a binary choice (invest/not invest, pivot/persevere), your actions reveal an implicit threshold.
      *   *Knightian Uncertainty:* However, there's a distinction between *risk* (known probabilities) and *uncertainty* (unknown probabilities). Startups often fall into the latter.
      *   *Imprecise Probabilities:* It is rational to hold a set of probabilities (a range) rather than a single point, especially when information is scarce. This is known as "imprecise probability" or "robust decision making."
      *   *Conclusion on Theory:* The co-founder is *partially* right in a strict Von Neumann-Morgenstern utility framework, but the user is also right that in high-ambiguity environments, a range is often a more honest representation of the state of knowledge than a false point estimate.
      *   *Nuance:* Even if you *act* as if you have a number, stating it explicitly as a fact is different from using it internally for calculation.

  3.  **Address the Practical Question (Investor Relations):**
      *   *Investor Psychology:* Investors know startups are risky. They don't expect a 35% success rate. They expect a power law distribution (most fail, a few return 100x).
      *   *Credibility:* Putting a specific number like "35%" looks naive or overconfident. It invites scrutiny ("Why 35 and not 34?"). It signals a misunderstanding of the stochastic nature of venture outcomes.
      *   *Standard Practice:* Pitch decks rarely, if ever, include a specific "probability of success" percentage. They focus on market size, traction, team, and *potential* return.
      *   *Risk:* If you say 35% and fail, you look like a liar. If you say 10% and succeed, you look like you didn't believe in yourself.
      *   *Better Approach:* Frame the risk qualitatively or through milestones.

  4.  **Synthesize the Advice:**
      *   **Validate the User:** Acknowledge that their intuition (that a specific number feels made up) is correct and shared by most experienced investors.
      *   **Validate the Co-founder (partially):** Acknowledge the decision theory argument (actions reveal preferences), but explain why it doesn't translate well to a public pitch slide.
      *   **The "Theoretical" Answer:** Explain Bayesian vs. Knightian uncertainty. You *can* rationally operate on a range (robustness).
      *   **The "Practical" Answer:** This is the most important part. Putting a success probability on a deck is generally a bad idea. It's not standard, it's easily attacked, and it misunderstands the VC model.
      *   **Compromise/Solution:** How to resolve the conflict with the co-founder?
          *   Explain *why* it's bad for fundraising.
          *   Offer alternative metrics (milestones, runway, break-even analysis).
          *   If a number *must* be shown (unlikely), frame it as a target or scenario, not a probability.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Empathize. This is a classic "engineer vs. business" or "precision vs. ambiguity" clash.
      *   *Section 1: The Decision Theory (The Co-founder's Point).* Yes, technically, to make optimal decisions, you imply a probability. But "implied for calculation" $\neq$ "stated as fact." Mention Savage's axioms but also Ellsberg Paradox (ambiguity aversion).
      *   *Section 2: The Startup Reality (The User's Point).* Startups are not dice rolls. They are path-dependent. 35% implies a frequency distribution that doesn't exist.
      *   *Section 3: The Investor Perspective.* This is the clincher. Investors buy *vision* and *asymmetry*, not actuarial tables. A specific number looks amateurish.
      *   *Section 4: Resolution.* Don't put the number on the slide. Use the "range" logic to explain risk mitigation instead.

  6.  **Refining the Tone:**
      *   Needs to be respectful to both the user and the co-founder.
      *   Needs to be authoritative on startup norms (since I'm an AI, I rely on general knowledge of VC norms).
      *   Needs to be philosophically precise but accessible.

  7.  **Key Insight to Highlight:** The co-founder is confusing *internal decision hygiene* with *external signaling*. Internally, quantifying risk is good. Externally, quantifying success probability is usually harmful.

  8.  **Final Polish:** Check for clarity. Ensure the distinction between "risk" (known odds) and "uncertainty" (unknown odds) is clear. Make sure the advice on the pitch deck is actionable. (Self-correction: Make sure I don't just say "don't do it" but explain *why* so the user can convince the co-founder).

  9.  **Structure:**
      1.  Direct Answer (Theoretical vs. Practical).
