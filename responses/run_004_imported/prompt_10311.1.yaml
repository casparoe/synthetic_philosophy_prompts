answer: |-
  This is a fascinating conflict because it sits at the intersection of **decision theory**, **epistemology**, and **venture capital signaling**.

  Your co-founder is making a sophisticated argument rooted in Bayesian decision theory. You are making a practical argument rooted in the nature of deep uncertainty and market norms.

  Here is the breakdown of who is right, why, and how you should handle the pitch deck.

  ### 1. The Theoretical Question: Does action imply a number?

  **Your co-founder is theoretically correct.**
  In standard decision theory (specifically Savage's axioms), if you are making consistent, rational choices under uncertainty, your behavior *reveals* a subjective probability.

  For example, if you are indifferent between:
  *   **A:** Getting $100 if your startup succeeds.
  *   **B:** Getting $100 if you draw a red ball from an urn containing 35 red balls and 65 black balls.

  ...then you have implicitly revealed that you believe your startup has a 35% chance of success. If you choose A, your implicit probability is >35%. If you choose B, it is <35%.

  From this perspective, refusing to state a number is indeed "pretending." You are acting *as if* you have a number in your head every time you decide to spend money on ads versus saving for runway. Your co-founder argues that making this explicit forces intellectual honesty and allows for better calibration.

  **However, you are also theoretically defensible.**
  There is a branch of decision theory called **Imprecise Probability** (or Knightian Uncertainty) that argues when information is scarce, it is rational to hold a *set* of probabilities rather than a single point estimate.

  If you truly believe the odds are anywhere between 15% and 45%, collapsing that to 35% discards information about your own confidence level. A rational agent can act based on a "maximin" strategy (maximizing the minimum gain) or robustness criteria without ever committing to a single prior. So, it is not irrational to refuse to collapse the range.

  ### 2. The Practical Question: Should this be on the slide?

  **You are practically correct. Do not put a specific success probability on the slide.**

  While your co-founder is right about internal decision hygiene, he is wrong about external signaling. Here is why that specific slide is a bad idea for fundraising:

  **A. It signals a misunderstanding of Venture Capital**
  VCs do not invest based on the probability of success; they invest based on the **magnitude of the outcome**.
  *   A startup with a 90% chance of making $1M is a bad VC investment.
  *   A startup with a 5% chance of making $1B is a great VC investment.

  By stating "35% probability of profitability," you are framing the investment as an actuarial bet. Investors know that early-stage startup outcomes follow a power law, not a normal distribution. Putting a specific percentage on the slide makes you look like you are trying to quantify the unquantifiable, which can come across as naive.

  **B. It invites unnecessary scrutiny**
  If you write "35%," the first question an investor will ask is, "How did you calculate that?"
  *   If you say "It's a guess," you lose credibility.
  *   If you say "We used a model," they will tear the model apart because early-stage models are fiction.
  *   If you can't defend the precision of the number, the number becomes a liability.

  **C. It anchors expectations poorly**
  *   **If you succeed:** It doesn't matter.
  *   **If you fail:** You have gone on record saying you thought it was unlikely.
  *   **If you pick a low number (e.g., 15%):** You signal low confidence.
  *   **If you pick a high number (e.g., 60%):** You signal delusion.

  ### 3. How to Resolve the Conflict with Your Co-founder

  Your co-founder's instinct is good: **Investors need to understand how you think about risk.** They just don't want it expressed as a single success percentage.

  You can validate his point (that we need to show we understand the risks) while steering him toward a better format. Here is the compromise:

  **1. Shift from "Probability of Success" to "Key Risks & Mitigations"**
  Instead of a percentage, have a slide that lists the top 3 existential risks to the business (e.g., "Customer Acquisition Cost remains high," "Regulatory change," "Technical feasibility") and explicitly state what you are doing to mitigate each.
  *   *Why this works:* It shows you are realistic about the odds (addressing his concern) without making up a fake number (addressing your concern).

  **2. Use Scenario Analysis instead of Probability**
  Show a "Base Case," "Upside Case," and "Downside Case" for revenue or growth.
  *   *Why this works:* It captures the *range* you are comfortable with (15–45%) without forcing a point estimate. It shows you have thought about the distribution of outcomes.

  **3. Explain the "VC Math" to him**
  Sit down with your co-founder and explain that VCs expect most of their portfolio companies to fail. They are looking for **asymmetry**.
  *   Tell him: "Putting a 35% success rate on the deck implies we are trying to minimize failure. But investors want to know that if we *don't* fail, we return the whole fund. We should focus the deck on the size of the win, not the odds of the try."

  ### Summary

  **Is he right that decision-making implies a number?**
  Mostly yes. Internally, your actions reveal your subjective priors. It is good practice to try to quantify those internally to avoid cognitive bias.

  **Is he right that you should put it on the slide?**
  No. In the context of deep uncertainty (startups), a point estimate is less accurate than a range, and in the context of fundraising, a point estimate is a signaling error.

  **Recommendation:**
  Tell your co-founder: "You're right that we need to be precise about how we assess risk internally. But externally, a specific percentage looks like we're guessing. Let's show them we understand the risk by listing our top three failure modes and how we're solving them. That proves we're realistic without boxing us into a number we can't defend."

  This honors his desire for rigor while protecting your credibility with investors.
