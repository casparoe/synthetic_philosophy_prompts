answer: |-
  This is a classic and profound problem in the metaphysics of causation, often called **the Problem of Profligate Omissions** (or sometimes the "Problem of Negative Causation"). You have hit on exactly why it is so difficult: if we define causation simply as counterfactual dependence ("If $C$ hadn't happened, $E$ wouldn't have"), then every non-prevention looks like a cause.

  Here is an explanation of why this is a metaphysical puzzle rather than a moral one, the main strategies philosophers use to solve it, and an assessment of which approach is currently most defensible.

  ### 1. Why is this a problem for *Causation* and not just *Blame*?

  It is tempting to think this is merely a legal or moral question: "Who is *responsible*?" vs. "Who is *causally involved*?" You might argue that while the Queen of England is causally linked to the death, only the nurses are *blameworthy*.

  However, philosophers worry that this distinction doesn't hold up under scrutiny. Here is why it is a genuine puzzle for theories of causation:

  *   **Explanation requires selection:** Science and history aim to explain *why* things happen. If we say "The plant died because I didn't water it," we offer an explanation. If our theory of causation implies "The plant died because I didn't water it, AND because the Queen didn't water it, AND because the rain didn't come," our explanation becomes useless. A theory of causation that makes everything a cause explains nothing. We need a metaphysical filter, not just a moral one, to distinguish relevant factors from background conditions.
  *   **The Nature of Events:** Causation is typically understood as a relation between *events* (things that happen). An omission is a *non-event* (something that didn't happen). If non-events can be causes, then the causal structure of the universe is populated by "nothings." This creates ontological bloat. If the nurse's *not checking* caused the death, does that "not checking" exist in the same way the nurse's *breathing* exists?
  *   **Transitivity Issues:** If omissions are causes, causal chains become weirdly long. If the nurse didn't check because she was tired, and she was tired because the staffing agency didn't send help, and they didn't send help because of budget cuts... we end up with causal chains that stretch indefinitely into abstract policy decisions. Most theories of causation want to keep causal relations local and concrete.

  In short, if we cannot distinguish the nurse's omission from the Queen's omission *causally*, our map of how the world works is fundamentally flawed, regardless of who we choose to punish.

  ### 2. Main Strategies for Containing the Problem

  Philosophers generally take one of four approaches to solve the over-generation problem.

  #### A. Ontological Denial (Omissions are not causes)
  **Proponents:** J.L. Mackie, Helen Beebee.
  **The View:** Only positive events or processes can be causes. "Not checking" is not an event; it is the absence of an event. Therefore, the nurse did not *cause* the death; she merely *allowed* it to happen. The cause of death was the underlying medical condition.
  **Pros:** It solves the over-generation problem instantly. The Queen didn't cause the death either, because she didn't do anything.
  **Cons:** It is highly revisionist. It contradicts legal practice ("death by negligence"), medical explanation ("death by dehydration"), and common sense. It forces us to say that watering a plant doesn't keep it alive; rather, the lack of water kills it, but the watering is causally inert.

  #### B. Pragmatic Selection (All are causes, but we select)
  **Proponents:** David Lewis (later work), some contextualists.
  **The View:** Metaphysically, the counterfactual test is correct: the Queen *is* a cause of the death, and so is the nurse. However, when we speak, we pragmatically select only the "abnormal" or "relevant" causes based on our conversational context.
  **Pros:** It keeps the metaphysics simple (counterfactual dependence is all you need).
  **Cons:** It makes causation mind-dependent. It implies there is no fact of the matter about what caused the death until someone asks the question. Many find it unacceptable that the causal structure of the universe depends on human interests.

  #### C. The Default-Deviant Distinction (Normal vs. Abnormal)
  **Proponents:** H.L.A. Hart & A.M. Honoré, Michael McGrath.
  **The View:** Causation involves a deviation from a "normal" or "expected" course of events. We distinguish between background conditions (which stay constant) and interventions (which change the course).
  **The Application:** It is "normal" for the Queen not to visit care homes. It is "deviant" for a hired nurse not to check on a patient. Therefore, the nurse's omission is a cause because it violates a norm/expectation, while the Queen's is not.
  **Pros:** It aligns perfectly with legal and moral intuition without denying that omissions can be causes.
  **Cons:** Defining "normal" is tricky. Is it statistically normal (what usually happens) or normatively normal (what *should* happen)? If it's the latter, causation relies on morality, which circles back to your friend's confusion.

  #### D. Contrastive Causation
  **Proponents:** Jonathan Schaffer.
  **The View:** Causation is not a binary relation ($C$ causes $E$). It is a quaternary relation ($C$ rather than $C^*$ causes $E$ rather than $E^*$). We must specify the contrast.
  **The Application:** The question isn't "Did the nurse's not checking cause the death?" It is "Did the nurse's *not checking* (rather than *checking*) cause the *death* (rather than *survival*)?"
  **Pros:** It handles the Queen problem well. "Did the Queen's *not checking* (rather than *checking*) cause the death?" Since the Queen checking was never a live option in the contrast class, the causal claim is false or infelicitous.
  **Cons:** It makes causal claims much more complex to formulate.

  ### 3. Which is the most defensible?

  While there is no consensus, the **Default-Deviant Distinction (Strategy C)**, often updated with insights from **Contrastivism (Strategy D)**, is currently the most defensible position for your specific case.

  Here is why this hybrid approach works best for the care home scenario:

  1.  **It respects the metaphysics:** It acknowledges that counterfactual dependence is real (if the nurse had checked, the resident would likely live). It doesn't deny the link.
  2.  **It solves the Over-Generation:** It introduces a filter that isn't merely "who do we want to blame." The filter is **expectation based on role or system**.
      *   In the care home system, the "default" setting is that staff check on residents.
      *   The nurse's omission was a **deviation** from the system's designed function.
      *   The Queen's non-intervention was **consistent** with the default setting of the world (she has no role in that system).
  3.  **It avoids pure moralism:** While "expectations" sound normative, they can be functional. A carburetor "failing to mix fuel" causes the engine to stop, not because the carburetor is "immoral," but because its functional norm is to mix fuel. Similarly, the care home is a system with functional norms.

  **Why this wins over the others:**
  *   **Ontological Denial** is too extreme; it forces us to rewrite too much science and law.
  *   **Pragmatic Selection** makes causation too subjective; we want to say the nurse caused the death even if no one is around to talk about it.
  *   **The Default-Deviant view** allows us to say there is an objective fact about the causal structure (based on the functional norms of the system involved) that distinguishes the nurse from the Queen.

  ### Conclusion for your argument

  You can tell your friend that they are right that understaffing/omission is a cause, but you are right to worry about the "Queen of England" objection.

  The principled line is not that omissions *can't* be causes. The line is that **causation by omission requires a breach of a relevant expectation or functional norm.**

  The nurse's failure to check was a cause because, within the specific system (the care home), her checking was the expected "default" state. The Queen's failure to check was not a cause because, within that system, her checking was not an expected variable. This allows you to maintain that omissions *can* be causes without accepting that *everyone* is a cause. It grounds the causation in the **structure of the situation**, not just in our desire to assign blame.
