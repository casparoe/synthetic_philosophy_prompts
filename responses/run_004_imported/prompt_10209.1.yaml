      *   **The Specific Puzzle:** The "Over-generation Problem" (or "Problem of Profligate Omissions"). If counterfactual dependence is the test ($\neg C \to \neg E$), then *everyone* who didn't save her (relative, inspector, passerby, the Queen, etc.) is a cause. This seems absurd.
      *   **The Request:**
          1.  Explain why this is a metaphysical/puzzle for *causation* theories, not just a question of *blame* or *morality*.
          2.  Walk through the main strategies proposed to contain it.
          3.  Offer an evaluation of which is most defensible.

  2.  **Part 1: Why is this a Problem for Causation, not just Blame?**
