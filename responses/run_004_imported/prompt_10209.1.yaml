      *   *Distinction:* Causation is usually viewed as a mind-independent relation in the world (metaphysics). Blame is normative (ethics/law).
      *   *The Issue:* If our best theory of causation (e.g., counterfactual dependence) implies that the Queen of England caused the death by not jumping out of a helicopter to save the resident, then the theory yields false positives about the *structure of reality*, not just about who to punish.
      *   *Key Point:* If omissions are causes, the causal field becomes infinitely large. Science and explanation rely on selecting *the* cause(s). If everything is a cause, explanation collapses.

  3.  **Part 2: Main Strategies for Containing the Problem:**
      *   *Strategy A: Deny Omissions are Causes (Ontological View).*
          *   View: Only positive events/processes cause things. "Not checking" is nothing.
          *   Pro: Solves over-generation instantly.
          *   Con: Conflicts with legal/moral practice and scientific explanation (e.g., "lack of water caused the plant to die").
