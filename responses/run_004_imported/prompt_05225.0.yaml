answer: |-
  **Setting:** *A quiet corner of a coffee shop, a few days after the family dinner. Maya (30s, works in HR, prone to analyzing social dynamics) and Sam (30s, software engineer, pragmatic, likes logic puzzles) are catching up.*

  **Maya:** I still can't stop thinking about your uncle. "That doesn't make me wrong though." It's technically true, but it felt like he was pulling a magic trick. Like he swapped the card in your hand while you were looking at it.

  **Sam:** Right? It's the classic *tu quoque* fallacy. "You do it too." Just because he's a hypocrite doesn't mean his advice on savings accounts is false. Compound interest doesn't care about his credit score.

  **Maya:** But that's the thing. I've been reading about this, and there's this whole philosophical debate about whether hypocrisy actually strips you of the *standing* to blame someone. It's not about whether the math is right. It's about whether *he* is the one who gets to say it.

  **Sam:** Standing? Like legal standing?

  **Maya:** Kind of. Moral standing. The idea is that when you blame someone, you aren't just stating a fact like "that action caused harm." You're issuing a demand. You're saying, "You owe it to *us* to do better." And to do that, you have to be part of the same community of rules. If you openly flout the rule you're enforcing, you've kind of resigned from the community. You lose the authority to make the demand.

  **Sam:** Okay, I see the appeal. It feels unfair. But I think you're conflating the *message* with the *messenger*. If the message is true, the messenger's flaws are irrelevant to the truth value. If my doctor smokes, he's still right that smoking kills. Does his hypocrisy mean I should keep smoking? No. So why does he lose the right to tell me to quit?

  **Maya:** Because blame isn't just information transfer, Sam. It's a relationship. If your doctor smokes but says, "Look, I'm addicted, it's terrible, don't be like me," he keeps his standing. He acknowledges the norm applies to him. But if he says, "I smoke because I'm special, but *you* shouldn't," that's what kills the standing. It's the claim of exemption. Your uncle wasn't just giving advice; he was lecturing. He was positioning himself as the responsible adult. You can't claim that title while treating the rules as optional for yourself.

  **Sam:** But where does that line stop? This is my big issue with the "standing" argument. If hypocrisy kills your standing, then nobody can blame anyone unless they're a saint. I've sped on the highway. Does that mean I lose the standing to tell my little sister not to speed?

  **Maya:** No, that's the "Clean Hands" objection. I get it. But the philosophers who defend the standing view aren't saying you need a perfect record. They're saying you need a *commitment* to the norm. If you speed, and you know it's wrong, and you feel bad about it, you still respect the rule. You're a struggling participant. Your uncle? He declared bankruptcy twice, seemingly without changing his behavior, then lectured *you*. That suggests he doesn't actually submit to the rule he's enforcing. He's acting like a referee who takes bribes but still calls fouls on the players.

  **Sam:** Okay, the referee analogy is strong. But let's flip it. Take the classic case: A politician campaigning on "Family Values" gets caught cheating.

  **Maya:** Exactly! That's the case where the hypocrisy *is* the story.

  **Sam:** Is it, though? Let's separate the two things. One: Is the politician a hypocrite? Yes. Two: Are family values important? Maybe. If the politician gives a speech about why stable homes help children, is the *content* of the speech false because he cheated?

  **Maya:** The content isn't false. But the *speech* is a lie. Because the speech isn't just data; it's a performance of virtue. He's asking for your vote based on his moral leadership.

  **Sam:** But what if we aren't voting? What if it's just your uncle at dinner? If his advice saves you from debt, does it matter that he's a fraud? If I use a broken compass that happens to point North, I still find North. Why do we care so much about the moral purity of the blamer? It feels like a way to dismiss good advice just because we don't like the guy.

  **Maya:** Because it's not just about the advice. It's about the *equality*. When your uncle lectures you, he's creating a hierarchy. He's up, you're down. He's the judge, you're the defendant. Hypocrisy abuses that power. It says, "I am above this rule, but you are below it." If we allow that, we normalize a world where moral authority belongs to the people who are best at hiding their sins, not the people who actually try to follow the rules.

  **Sam:** So you're saying the harm is in the *inequality*?

  **Maya:** Yes. It's a violation of reciprocity.

  **Sam:** Okay, but here's the pushback. Sometimes the hypocrite is the *only* one who can see the danger. Imagine a recovering alcoholic telling a teenager not to drink. Technically, they have "broken the rule." But they have the most standing because they know the cost.

  **Maya:** But the recovering alcoholic admits the cost! That's my point about commitment. They say, "This rule exists, I broke it, it destroyed me, don't break it." Your uncle is saying, "This rule exists, you broke it, you're irresponsible," while ignoring that he broke it too. There's a difference between a warning from a survivor and a lecture from a violator.

  **Sam:** I guess I'm worried about the practical outcome. If we accept your view, that hypocrisy negates standing, we give people a get-out-of-jail-free card. If I catch my employee stealing, and they say, "Well, you took a pen home last week," suddenly I'm silenced?

  **Maya:** No, because taking a pen home isn't the same as embezzlement. The norms have to be comparable. But... okay, let's say you *do* embezzle. If you catch your employee doing it, can you fire them?

  **Sam:** Of course.

  **Maya:** Can you *morally condemn* them? That's the question. You can enforce the consequence—fire them. That's the system working. But do you have the moral high ground to look them in the eye and say, "You are a bad person"?

  **Sam:** Why not? They *are* a bad person, by the definition of the rule we both signed.

  **Maya:** Because "You are a bad person" implies *I* am in a position to judge. If I'm guilty of the same thing, I'm not a judge; I'm an accomplice. I can stop the behavior, sure. But the *blame*... the moral scolding... that requires a clean conscience regarding that specific norm. Otherwise, it's just power.

  **Sam:** See, I think that's where we split. I think blame is a tool for correction. If the tool works, use it. If I see my friend about to step in front of a bus, I'm going to yell "Stop!" even if I've almost stepped in front of a bus before. If I stop to ask myself, "Do I have the normative standing to issue this warning?" my friend gets hit by the bus.

  **Maya:** That's a safety issue, not a moral blame issue. There's a difference between "Stop, that's dangerous" and "You are irresponsible for doing that." The first is intervention. The second is judgment. Your uncle wasn't just trying to stop you from spending; he was judging your character.

  **Sam:** But isn't that distinction fuzzy? When I tell my kid "Don't touch the stove," I'm also implying "It's stupid to touch the stove."

  **Maya:** True. But if your kid says, "You touched the stove yesterday," and you say, "Yeah, and I burned my hand, and I'm an idiot, so listen to me," that works. If you say, "I'm allowed to touch the stove, you're not," that breaks the trust. The trust is the foundation of the standing.

  **Sam:** So it comes down to trust.

  **Maya:** It comes down to whether blame is a cooperative act or a coercive one. If it's cooperative, we have to be equals. If we aren't equals on the issue, the cooperation is fake.

  **Sam:** I still think you're giving the hypocrite too much power. By saying they lose their standing, you're letting *them* decide the conversation ends. "Oh, you caught me? Well, I guess I can't talk about this anymore." It lets them off the hook. I'd rather say, "You're a hypocrite, *and* you're wrong to spend that money." Keep both truths alive.

  **Maya:** I like that. "You're a hypocrite, and the advice is sound." But I still think you lose the right to the *tone* of the lecture. You can offer the advice as a peer who messed up. You can't deliver it as a judge.

  **Sam:** So, what? Your uncle could have said, "Hey, I messed this up badly, learn from my mistakes," and that would have been okay?

  **Maya:** That would have been perfect. He would have kept his standing because he would have acknowledged the norm applies to him. By saying "That doesn't make me wrong," he doubled down on the exemption. He claimed the truth of the statement protected him from the hypocrisy charge.

  **Sam:** And you think the hypocrisy charge invalidates the authority, not the truth.

  **Maya:** Exactly. The math is right. The messenger is disqualified.

  **Sam:** I can live with that. It's like... a corrupted file. The data inside might be perfect, but you can't trust the source to deliver it without malware.

  **Maya:** *Laughs.* Finally, a tech analogy I understand.

  **Sam:** So, next time he starts lecturing...

  **Maya:** You don't tell him he's wrong. You tell him he's speaking from the cheap seats.

  **Sam:** "Uncle, your data is clean, but your connection is unstable."

  **Maya:** Something like that.
