answer: |-
  **Paris, 1758. The study of Denis Diderot. Papers are stacked in precarious towers; ink stains the desk. Jean-Jacques Rousseau stands by the window, looking out at the street, while Diderot sits, leaning forward, a quill paused in mid-air.**

  **Diderot:** You write as though I proposed opening a brothel, Jean-Jacques. I proposed a theatre for Geneva. A place for your countrymen to gather, to see themselves reflected, to refine their sentiments. Is reflection now a sin?

  **Rousseau:** (Turning from the window) Reflection is not the sin, Denis. Distortion is. You speak of refining sentiments. I speak of exhausting them. When a man sits in the dark of your playhouse, he watches a hero suffer. He weeps. He feels a swell of pity, a warmth in his chest. He tells himself, *"Look how sensitive I am. Look how I love virtue."* And when the curtain falls, he walks out into the street. He sees a beggar. He passes by. Why? Because he has already discharged his whole capacity for virtue in those tears. He has paid his due to humanity in fiction, so he owes nothing to reality.

  **Diderot:** That is a cynical chemistry of the soul. You treat pity as a finite fluid, drawn from a cistern that runs dry. I tell you it is a fire. The more you feed it, the brighter it burns. By identifying with the sufferer on stage, the spectator practices the expansion of his own self. He learns that another's pain is his own. That is not exhaustion; it is exercise.

  **Rousseau:** It is exercise in a vacuum. And who trains him in this exercise? The actor. Tell me, what is the actor's trade? It is the art of seeming what he is not. To play a king, he must strut; to play a lover, he must sigh. He studies gestures that are not his own. He puts on a mask until the flesh beneath forgets its true shape. If a man spends his life practicing falsehood to evoke truth in others, do you not think the corrosion eventually eats through the mask? He becomes a creature of appearance. And if the actor is corrupted, what of the audience who applauds the lie?

  **Diderot:** (Setting down the quill) You confuse the man with the craft. I have been giving this much thought, actually. You assume the great actor must *feel* the rage, the grief, the love he portrays. I argue the opposite. The great actor is a cold observer. He is a calculating dissembler, yes. He has a judgment, a head full of logic, and an immense memory. He watches human nature like a naturalist watches a beetle. He does not feel the tears; he mimics the tear-duct.

  **Rousseau:** (Stepping closer) You admit it! He is a dissembler. A professional liar. And you defend this?

  **Diderot:** I defend the precision! If he felt every emotion, he would be uneven, chaotic. By remaining cool, he presents a perfect mirror of nature.

  **Rousseau:** A mirror that reflects only surfaces! But let us leave the metaphysics of the actor. Let us look at what you actually show. You champion Molière. I say Molière is the poison. Look at *The Misanthrope*. Alceste is the honest man. He demands truth in friendship, in love, in law. He refuses to flatter. And what does Molière do? He makes Alceste a fool. A buffoon. He is ridiculed, hissed, defeated. And Philinte? The man who compromises, who flatters, who says *"It is best to go with the flow"*—he is vindicated. He is the voice of reason.

  **Diderot:** Alceste is not virtuous, Jean-Jacques. He is rigid. He mistakes brutality for honesty.

  **Rousseau:** He is virtuous enough for this world! By making him ridiculous, you teach the audience that honesty is a social maladjustment. You teach them that to be a good citizen, one must be pliable. One must accept the lie to keep the peace. That is not cultivation of morals. That is training for servitude.

  **Diderot:** (Pausing, tapping the quill against his chin) I will concede this: In the *current* comedy of manners, the laugh is often purchased at the expense of the sincere. If *The Misanthrope* teaches men to fear the label of "pedant" or "boor" more than they fear dishonesty, then the play fails. I grant you that.

  **Rousseau:** Then you agree the theatre corrupts.

  **Diderot:** No. I agree that *that* theatre corrupts. Which is why I propose the *drame bourgeois*. The serious genre. We do not laugh at Alceste. We show the merchant, the father, the judge. We show virtue not as a rigid abstraction that breaks against the world, but as a practical force that sustains it. We cultivate sympathetic identification not with kings and heroes, but with men like us. If the mirror shows a merchant acting honorably, the spectator thinks, *"I can do this."*

  **Rousseau:** You think you can engineer virtue through plot adjustments? The problem is not the script, Denis. It is the separation. The moment you build a stage, you create a division. There are those who act, and those who watch. The people become passive consumers of their own culture.

  **Diderot:** And what is the alternative? Silence?

  **Rousseau:** The alternative is Geneva. Not your theatres. Our festivals. Imagine the Place Neuve. No stage, no proscenium, no tickets. The citizens gather. They look at one another. One man sings, another joins in. A dance begins, and the circle widens until everyone is in it. There are no actors, because everyone is an actor. There are no spectators, because everyone is watching. In that transparency, there is no mask. You cannot pretend to be virtuous when your neighbor is holding your hand in the dance. That is a civic culture. Not a hall of mirrors, but a public square.

  **Diderot:** It is pastoral. I grant you, it is beautiful. But it is primitive. You want to return to the state of nature. But we are in Paris. We are in a society of millions, not a village of thousands. In a great city, we cannot all know each other. We need representation to bridge the gap between strangers. The theatre creates a shared language. When we weep for the same tragedy, we are bound together.

  **Rousseau:** Bound by a shared illusion. You say the theatre bridges the gap between strangers. I say it widens the gap between the man and himself. You ask him to be Philinte in the street and Alceste in his heart, and you call that balance. I call it fragmentation.

  **Diderot:** (Leaning back, sighing) You demand a transparency that might shatter society. If every man spoke exactly what he thought, as your Alceste demands, the courts would close, marriages would dissolve within the week. Society requires a certain polish. The theatre teaches that polish. It shows us the consequences of excess.

  **Rousseau:** And who decides what is "excess"? Is it the truth that is excessive, or the tolerance for lies? You trust the calculation of the actor. I trust the impulse of the citizen. You trust the tear shed in the dark. I trust the hand extended in the light.

  **Diderot:** We are at an impasse. You believe the institution itself is the poison. I believe the institution is a tool, and like any tool—a scalpel, a press, a pen—it depends on the hand that wields it. I will not burn the playhouse. I will try to write better plays.

  **Rousseau:** And I will not enter it. I will walk in the fields. If virtue cannot survive without a spotlight to validate it, it was never virtue to begin with. It was merely performance.

  **Diderot:** (Picking up the quill again) Then let us agree on this: Performance is inevitable. The question is whether we direct it toward the vanity of the self, or the welfare of the whole.

  **Rousseau:** (Nodding slowly) Agreed. But remember, Denis: the moment you charge admission, you have chosen vanity. For the poor cannot enter, and the rich buy the right to judge.

  **Diderot:** And the moment you forbid the stage, you silence the stories that might make the rich weep for the poor.

  **Rousseau:** Then let them weep in the street, where the tears can do some good.

  **(Rousseau turns and opens the door. The noise of the Paris street floods in—carriages, hawkers, the clamor of the city. Diderot watches him go, then looks down at his manuscript, dips the quill, and hesitates before touching ink to paper.)**
