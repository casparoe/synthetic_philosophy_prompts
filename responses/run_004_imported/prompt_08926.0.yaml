answer: |-
  This is a remarkably sharp reading of Keynes, and you are right to isolate the second half of the essay. Most critiques stop at the arithmetic error (why the 15-hour week didn't materialize), but the philosophical error (why we didn't become the people who *could* enjoy that week) is the more haunting failure.

  If Keynes were to wake up today and look at the psychological landscape of the affluent West—specifically the dichotomy between the voluntary overwork of the comfortable and the anxious idleness of the distracted—he would likely diagnose both as symptoms of the same underlying pathology. He would see them not as opposite failures, but as two different manifestations of humanity's inability to transition from the **"economic phase"** of history to the **"human phase."**

  To understand why he would group hustle culture and doomscrolling together, we have to look at the specific moral distinction Keynes draws in the essay between the **"purposive"** and the **"purposeful."**

  ### The Purposive vs. The Purposeful

  Keynes argues that for all of recorded history, humans have been bred to be "purposive." We value actions not for what they *are*, but for what they *yield*. We plant seeds to eat, we work to earn, we save to survive. This created a specific moral psychology: we valorize the "virtues" of accumulation, thrift, and aggression because they were necessary for survival. Keynes calls this the "love of money as a possession," distinguishing it from the "love of money as a means to the enjoyments of life." He explicitly labels the former a "disgusting morbidity, one of those semi-criminal, semi-pathological propensities which one hands over with a shudder to the specialists in mental disease."

  The "good life," for Keynes, requires a shift to the "purposeful." This is doing things for their own sake. He invokes the "arts of life"—friendship, beauty, contemplation. He references the lilies of the field not to suggest laziness, but to suggest a state of being where one is not anxiously striving for a future reward.

  ### Hustle Culture: The Refusal to Exit the War

  Keynes would view modern hustle culture among the affluent (like the software engineers you mention) as a direct continuation of the "semi-pathological" habit of accumulation.

  Even when the economic problem is solved for an individual, the psychological machinery of scarcity remains active. Keynes predicted this "nervous strain." He wrote that when the accumulation of wealth is no longer of high social importance, "there will be great changes in the code of morals." He expected we would drop the pretense that hoarding is virtuous.

  Instead, hustle culture doubles down on the old code. It treats the "means" (work, capital, optimization) as the "end." Keynes would argue that the voluntary overworker is suffering from a specific delusion: they are fighting a war against scarcity that has already ended in their sector. They are running legacy survival software on abundance hardware.

  To Keynes, this is the more active sin. It is the refusal to accept the "abundance" he predicted. By continuing to treat money as a possession to be hoarded rather than a ticket to be used, the hustle culturist confirms Keynes's fear that we would be "too timid" to embrace the good life. We prefer the anxiety of the chase to the vulnerability of enjoyment.

  ### Doomscrolling: The Failure of Leisure

  On the other side, you have the doomscroller. This person ostensibly has the leisure Keynes predicted, but they are not living the "life of the lilies."

  Keynes was not a naive utopian; he knew that leisure could be dangerous. He wrote, "It will be those people, who can keep alive, and cultivate into a fuller perfection, the art of life itself and do not sell themselves for the means of life, who will be able to enjoy the abundance when it comes."

  The key phrase is **"cultivate."** Keynes assumed the "arts of life" were a skill set that needed to be learned. He worried that we had lost the capacity for them. Doomscrolling is the evidence of that atrophy. It is not contemplation; it is distraction. It is not connection; it is simulation.

  Keynes would likely see doomscrolling not as "leisure," but as a way to numb the "nervous strain" of having no purposive goal. When you remove the "economic problem" (the need to work), you are left with the existential problem (the need to be). If you haven't cultivated the "arts of life," that void is terrifying. Doomscrolling is a way to fill that void with low-stakes, high-frequency stimuli that mimic purpose without requiring the vulnerability of actual engagement. It is the "nervous strain" manifesting as anxiety rather than ambition.

  ### The Verdict: Same Failure, Different Costume

  So, to answer your core question: Keynes would see these as essentially the same failure of nerve.

  Both phenomena prove that we have not made the moral transition he deemed necessary.
  *   **The Hustler** cannot stop treating life as a **means** to an end.
  *   **The Doomscroller** cannot start treating life as an **end** in itself.

  Both are trapped in the "economic phase." The hustler is still trying to solve the economic problem despite having solved it. The doomscroller is suffering from the vacuum left by the economic problem's solution, without possessing the tools to fill it.

  Keynes would likely argue that the hustler is perhaps in a slightly more defensible position, only because they are still operating within the "old morals" we understand, whereas the doomscroller represents the new terror: the realization that without the "spur" of scarcity, we don't know how to be human.

  In the essay, Keynes writes: *"Thus for the first time since his creation man will be faced with his real, his permanent problem—how to use his freedom from pressing economic cares, how to occupy the leisure, which science and compound interest will have won for him, to live wisely and agreeably and well."*

  He would look at the software engineer working 60 hours on a project they don't need to finish, and the worker scrolling TikTok for four hours after a shift, and say: **Neither of you is living wisely and agreeably and well.** One is running from freedom, and the other is drowning in it. Both confirm his deepest anxiety: that solving the economic problem would be the easy part, and that the true difficulty was always going to be becoming the kind of people who could handle the solution.

  We built the abundance, but we didn't build the souls to match it.
