      *   *The Circularity Point:* The user hit the nail on the head. Address the "Tautology" critique (Hausman, Sen). If utility is just a label for choice, it explains nothing. It only becomes useful if we assume *stability* (I chose A yesterday, I'll choose A tomorrow).
