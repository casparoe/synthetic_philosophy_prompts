          3.  Is the concept of "utility" circular/useless if defined this way?

  2.  **Deconstruct "Revealed Preference Theory" (RPT):**
      *   *Origin:* Paul Samuelson (1938).
      *   *Core Idea:* We can't see inside people's heads. We can only observe choices. If someone chooses A over B when both are available and affordable, they *reveal* a preference for A over B.
      *   *The Friend's Interpretation:* Strong/Strict behaviorism. Choice = Preference. No gap.
