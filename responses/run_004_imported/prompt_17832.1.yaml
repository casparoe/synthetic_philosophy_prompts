answer: |-
  This is a profound disagreement that wears the clothes of a logistical dispute. You have stumbled into one of the oldest problems in moral philosophy: the status of duties to the dead. As a referee, you cannot simply declare a winner because both brothers are articulating coherent, historically defended ethical frameworks. However, both are also overreaching in ways that obscure the specific human reality of their father's wish.

  Here is a move-by-move analysis of their exchange, followed by an assessment of the core philosophical question and what they both missed about this specific promise.

  ### Move 1: The Nature of the Bond
  **Owen:** *"A promise binds you the moment you give your word... death... locks the obligation in place."*
  **Felix:** *"A duty has to be owed to somebody... a dead man isn't a subject... you can't wrong someone who no longer exists."*

  **Where Owen is Right:**
  Owen is articulating a **deontological** view of promising. In this framework, the moral force of a promise comes from the act of the will at the moment it is made. By saying "I promise," you voluntarily restrict your future freedom. Owen is correct that the death of the promisee does not retroactively erase the act of promising. If the obligation vanished at death, death would function as a "get out of jail free" card for all unfulfilled commitments, which undermines the stability of trust generally.

  **Where Felix is Right:**
  Felix is articulating an **interest-based** view of rights. For a wrong to occur, there usually must be a victim who experiences a setback to their interests. Since the dead have no consciousness, they cannot experience frustration, pain, or disappointment. Felix is metaphysically correct that a corpse is not a moral agent who can hold a claim.

  **Where They Overreach:**
  *   **Owen** treats the promise as a static contract, ignoring that all promises carry an implicit clause of *possibility*. If the cliff had fallen into the sea, the promise would be void. He conflates "difficult" with "impossible."
  *   **Felix** assumes that because the dead cannot *feel* wronged, they cannot *be* wronged. This is a category error. We generally agree that desecrating a grave is a wrong, even if the deceased feels no pain. Felix reduces all moral value to immediate sensory experience, which fails to account for symbolic or narrative value.

  ### Move 2: The Evidence of Wills and Secrets
  **Owen:** *"We obviously do think you can wrong the dead... executors are bound by a will, and betraying a secret... feels like a betrayal of them."*
  **Felix:** *"Obligations to the living in disguise... wills are enforced for the heirs... secrets matter for... the living person's reputation."*

  **Where Owen is Right:**
  Owen appeals to moral intuition and social practice. Legally and culturally, we *do* act as though the dead have standing. If Felix's view were universally adopted, no one would trust deathbed confidences or execute wills faithfully once the immediate heirs were satisfied. Owen correctly identifies that our moral landscape is populated by "surviving interests."

  **Where Felix is Right:**
  Felix offers a strong sociological critique. He is correct that many post-mortem obligations are *instrumentally* justified by their effect on the living. Wills prevent chaos among heirs; keeping secrets protects the grieving. If a secret harms no living person and a will has no heirs, the legal system often lets those obligations lapse (e.g., cy-près doctrines in charity law).

  **Where They Overreach:**
  *   **Owen** assumes that legal enforceability equals moral truth. Just because the state enforces a will doesn't mean the *moral* reason is that the dead person is still a rights-bearer.
  *   **Felix** is being overly reductive (a "hermeneutic of suspicion"). He tries to explain away the moral feeling entirely. Consider a hermit with no heirs and no reputation to damage: if you promise to burn his manuscripts and instead publish them for profit after he dies, you have wronged *him*, not just society. Felix's theory cannot account for this.

  ### The Core Question: Does an Obligation Need a Living Party?

  You asked whether "an obligation needs a living party who can hold the claim" is true. The philosophical consensus leans toward **no**, but with a specific caveat.

  The most defensible middle ground is the theory of **Ante-Mortem Interests**.
  While a dead person has no *current* interests, they had *critical interests* while alive that extend beyond their death. A person has an interest in how their life narrative concludes, how their body is treated, and whether their projects are completed. When you promise a dying person to do something, you are agreeing to safeguard that extending interest.

  *   **Verdict on Felix:** He is wrong to say the dead cannot be wronged. They can be wronged in the sense that their **autonomous will and enduring interests** are violated.
  *   **Verdict on Owen:** He is right that the obligation survives, but wrong to think it survives *unchanged*. The nature of the obligation shifts from "serving a person" to "honoring a trust."

  ### What Both Brothers Missed About *This* Promise

  If you are writing this feature, the most valuable insight you can offer your readers is that both brothers are arguing about **obligation**, when the real issue is **meaning**.

  **1. The "Why" Trumps the "Where"**
  Owen is fixated on the coordinates (Donegal). Felix is fixated on the completion (ashes scattered). Both missed the *teleology* of the request. The father didn't choose the cliff because he liked the geology; he chose it because it was where he proposed. The location was a proxy for **devotion to their mother** and the **story of their marriage**.
  *   **Owen's Error:** He thinks fidelity means geographical exactness.
  *   **Felix's Error:** He thinks fidelity means logistical efficiency ("at least it's done").
  *   **The Reality:** Scattering ashes in a local reservoir might satisfy the logistical command but violates the symbolic intent. It turns a romantic pilgrimage into a waste disposal task.

  **2. The "Impossibility" Defense**
  Felix argued impracticality (storm, new baby). In ethics, this is the doctrine of *force majeure*.
  *   **The Test:** Was it truly impossible, or just inconvenient? A storm-damaged road is temporary; a new baby is a joy, but also a logistical hurdle.
  *   **The Missed Nuance:** If the promise was "Scatter my ashes there *no matter what*," Owen is right. If the promise was "Take my ashes there *when you can*," Felix has a point. But usually, last wishes carry a presumption of high priority. Felix treated the wish as a "to-do list item" rather than a "final act of love."

  **3. The Relational Cost**
  Finally, both brothers missed that the promise was not just between them and the father, but between **the brothers themselves**.
  *   By unilaterally scattering the ashes, Felix didn't just bypass the father; he bypassed Owen. He denied Owen the chance to participate in the ritual.
  *   Owen, by refusing to accept the substitution, is denying Felix the grace needed for a difficult situation (new parenthood is exhausting).
  *   **The Real Wrong:** The argument isn't about the father anymore. It's about trust between the siblings. Owen feels disrespected; Felix feels micromanaged.

  ### Summary for Your Feature

  If you need to summarize the philosophical standing for your piece:

  1.  **Felix is metaphysically clever but morally thin.** He is right that the dead feel no pain, but wrong to conclude that this makes their wishes irrelevant. We are not just custodians of the living; we are custodians of the past.
  2.  **Owen is morally sturdy but practically rigid.** He is right that the promise binds, but wrong to assume that "binding" means "literal." Sometimes honoring a wish requires interpreting the spirit when the letter becomes impossible.
  3.  **The Binding Force:** The promise was binding not because the father can enforce it, but because **the sons are the kind of people who keep promises.** The obligation resides in *their* integrity, not the father's power.

  **The Referee's Ruling:**
  Felix was wrong to scatter the ashes without consensus, as the location held symbolic weight that the reservoir lacks. However, Owen is wrong to treat the reservoir scattering as a permanent moral stain that cannot be remedied. The "wrong" can be repaired. A return to Donegal with a portion of the reservoir ashes (if retrievable) or a symbolic gesture at the cliff could satisfy the *interest* of the father (the story) without invalidating the *reality* of the brothers' situation (the storm and the baby).

  The tragedy here isn't that the ashes are in the wrong place; it's that the brothers have turned a shared act of love into a contest of legalistic interpretation.
