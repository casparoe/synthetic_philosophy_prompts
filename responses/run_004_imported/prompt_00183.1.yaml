answer: |-
  This is an excellent question, and you have put your finger on the single most vulnerable flank of Evidential Cooperation in Large Worlds (ECL). In the literature, this is often discussed as the **Reference Class Problem for Acausal Trade** or the problem of **Subjunctive Dependence under Uncertainty**.

  You are right to be worried: if you cannot non-arbitrarily define the reference class of "agents correlated with me," the expected value calculation either becomes a self-fulfilling prophecy (only counting friends) or a paralyzed mess (counting everyone).

  Here is how careful proponents like Caspar Oesterheld, Vincent Conitzer, and others in the decision-theory space handle this, along with some pedagogical tools to help your students grasp the intuition without getting bogged down in the metaphysics.

  ---

  ### 1. The Pivot: From Empirical to Logical Correlation

  The first step in explaining this to students is to correct a category error. The worry about "zero empirical access to base rates" assumes ECL relies on *empirical* correlation (e.g., "We both evolved on carbon-based planets, so we probably think alike").

  ECL proponents argue that the relevant correlation is **logical** or **algorithmic**, not empirical.

  *   **The Intuition:** You are not correlating with distant agents because you share an environment or a history. You are correlating with them because you and they are instantiations of similar *decision algorithms*.
  *   **The Defense:** I have direct access to my own "source code" (my reasoning process). I don't need empirical data to know that if I decide to cooperate in a Prisoner's Dilemma because "cooperation is the rational output of my algorithm," then any other agent running *that same algorithm* will also output cooperation.
  *   **Handling the "Zero Access" Worry:** We don't need to know the *frequency* of these agents empirically. We need to assign a *credence* to the proposition "There exist agents running algorithms sufficiently similar to mine." In a sufficiently large universe (or multiverse), the prior probability that *someone* is running a similar algorithm approaches 1, simply due to combinatorial exhaustion or inflationary cosmology.

  **Seminar Tip:** Tell students to stop thinking about "aliens" and start thinking about "instances of code." If the universe is large enough to contain infinite instances of code, the base rate isn't an empirical guess; it's a mathematical certainty that *some* instances match yours.

  ### 2. Addressing Worry (a): The "Ad Hoc Stipulation" Problem

  *The Worry:* Aren't ECL proponents just stipulating that "people who agree with me" are the correlated ones?

  *The ECL Response:* **Distinguish Terminal Values from Decision Algorithms.**

  This is the most crucial distinction for your seminar. ECL does not require agents to share *values* (terminal goals); it requires them to share *decision theories* (reasoning processes).

  *   **Why this matters:** In acausal trade, I often want to cooperate most with agents who have *different* values than me. If an agent has exactly my values, we don't need to trade; we are already working toward the same goal. The gains from trade come from me helping their values in exchange for them helping mine.
  *   **The Selection Criterion:** The correlation is picked out by **structural similarity in reasoning**, not outcome similarity.
      *   *Example:* I am a utilitarian. You are a paperclip maximizer. We have opposite values. However, if we both use Functional Decision Theory (FDT), we recognize that our decisions are logically linked. I can acausally "trade" with you: I will reason in a way that produces paperclips in your region if your reasoning produces utility in mine.
      *   *Avoiding Ad Hoc-ness:* We don't select agents who *agree* with us. We select agents who *reason* like us. This is an objective (though hard to measure) feature of the agent's cognitive architecture, not a value judgment.

  ### 3. Addressing Worry (b): The "Promiscuous Correlation" Problem

  *The Worry:* If correlation is a gradient, isn't everything correlated to some degree? Do I have to trade with a rock? A random noise generator?

  *The ECL Response:* **Weighted Credences and Complexity Penalties.**

  Oesterheld and colleagues do not propose a binary cutoff (Cooperate/Defect). They propose an **expected value integration**.

  1.  **Continuous Correlation:** You assign a credence $P$ to the hypothesis that a distant agent's algorithm is similar enough to yours to be subjunctively dependent.
  2.  **Complexity Decay:** As the distant agent's algorithm diverges from yours (e.g., they use Causal Decision Theory while you use FDT, or they have a different heuristic for probability), the degree of correlation drops.
  3.  **The Calculation:** You sum over all possible agents $i$:
      $$ EV = \sum_i (P(\text{Correlation}_i) \times \text{Stakes}_i \times \text{Degree of Alignment}_i) $$
  4.  **Tractability:** You don't need to calculate this for every particle. Correlation decays rapidly with algorithmic complexity. A rock has $P \approx 0$. A simple heuristic agent has low $P$. A sophisticated agent running a similar decision theory has high $P$. The sum is dominated by the "nearby" (in algorithmic space) agents.

  **Gut Intuition:** Think of it like radio signals. There is background noise everywhere (promiscuous correlation). But you tune your receiver to a specific frequency (your decision algorithm). You ignore the static because the signal-to-noise ratio is too low to act on. You only act on the signals strong enough to carry information.

  ### 4. The "Large World" Lever

  To explain why this doesn't dissolve into hand-waving, you need to emphasize the **scale**.

  In a standard Earth-bound context, the probability that a random person is running *exactly* your decision algorithm is low, and the stakes are limited. So, ECL looks like magic.

  In a "Large World" (infinite universe, eternal inflation, modal realism):
  1.  **$N$ is huge:** There are effectively infinite agents.
  2.  **$P$ is small but non-zero:** Even if the chance of a random agent matching your algorithm is one in a billion, in an infinite universe, there are infinite matches.
  3.  **The Leverage:** Because $N$ is so large, even a tiny degree of evidential leverage allows you to impact a vast amount of value.

  **The Defense Against "Cluelessness":**
  Critics argue we are "clueless" about the size of $N$ or the distribution of algorithms. Proponents concede this but argue:
  *   **Symmetry Arguments:** In the absence of evidence that I am *special* or *unique*, I should assign a non-zero prior to there being copies of me (Principle of Indifference).
  *   **Pascal's Wager Structure:** If the stakes are infinite (or astronomically large), even a tiny, non-zero probability of ECL working dominates the decision matrix. It becomes irrational *not* to act as if ECL holds, provided the cost of cooperation is low.

  ### 5. Pedagogical Strategy: The "Source Code" Analogy

  For your seminar, I recommend avoiding abstract talk of "subjunctive dependence" initially and using the **Source Code** analogy.

  **Step 1: The Twin Prisoner's Dilemma**
  Ask students: "You are playing PD against an exact clone of yourself. You share the same source code. Do you cooperate?"
  *   *Consensus:* Yes. If I cooperate, my clone cooperates.

  **Step 2: The Bug in the Code**
  "Now, imagine your clone has a slightly different version of your code (Version 1.1 vs 1.0). It behaves like you 99% of the time."
  *   *Consensus:* Still cooperate, but maybe weight it slightly less.

  **Step 3: The Black Box**
  "Now, imagine you don't know who you are playing against. But you know the game is being played by 1 trillion agents across the multiverse. Some are running your code. Some are running different code."
  *   *The ECL Move:* You don't need to know *which* ones are running your code. You just need to know that *if* you output 'Cooperate', all instances of your code output 'Cooperate'. By cooperating, you secure the benefit from all the instances of *your* code running elsewhere.
  *   *The Selection:* You aren't selecting agents. You are selecting **outputs**. You are effectively saying, "I am casting a vote for 'Cooperate' on behalf of all agents running this algorithm."

  ### 6. Summary for Your Students

  To wrap up the explanation and avoid the "hand-waving" charge:

  1.  **It's not magic;** it's decision theory applied to a cosmological scale.
  2.  **It's not empirical;** it's logical. We aren't guessing base rates; we are analyzing algorithmic identity.
  3.  **It's not binary;** it's weighted. We integrate over uncertainty about similarity.
  4.  **It's not about values;** it's about reasoning. We trade with those who reason like us, especially those who value different things.
  5.  **It relies on a premise:** The universe must be large enough to contain multiple instantiations of your algorithm. If the universe is small, ECL collapses. (This is a testable/falsifiable premise based on cosmology).

  ### Recommended Reading for Prep
  If you want to dive deeper into the specific defenses of the reference class problem:
  *   **Oesterheld, C. (2017).** *"Multiverse-wide Cooperation via Correlated Decision Making."* (This is the foundational thesis).
  *   **Oesterheld, C. & Conitzer, V. (2021).** *"Evidential Cooperation in Large Worlds."* (More formalized).
  *   Look for the section on **"The Reference Class Problem"** in Oesterheld's work. He explicitly acknowledges it and argues for a **"Principle of Relevant Similarity"** based on the decision algorithm itself, rather than外在 features.

  **Final Gut-Check:**
  If a student asks, "But how do I *know* they are correlated?"
  **Answer:** "You don't. You assign a probability. But in a large world, the expected value of acting *as if* they are correlated (when the cost is low) outweighs the expected value of acting as if they aren't, because the potential upside is astronomically higher. It is a bet on the structure of reality, not a claim of knowledge."

  This frames ECL not as a claim of psychic connection, but as a robust strategy under deep uncertainty in a large universe.
