      *   **Nature of "Worlds":** Lewis's worlds are maximally mereological sums of spatiotemporally related entities. MWI "branches" are parts of the same universal wavefunction (often considered spatiotemporally connected in a high-dimensional Hilbert space, not necessarily isolated in the Lewisian sense). Eternal inflation bubbles are causally disconnected but exist within the same meta-spacetime.
      *   **Indexicality/Actuality:** For Lewis, "actual" is indexical (I am here, you are there). For physicists, "actual" usually refers to the observable universe or the whole multiverse structure.
