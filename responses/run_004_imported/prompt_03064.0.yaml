answer: |-
  It is a pleasure to speak with someone who remembers when "broken ergodicity" wasn't a buzzword in economics but a headache in spin glass simulations. You have put your finger on the exact tension that makes the Ole Peters literature so provocative to physicists but so frustrating to traditional economists.

  To answer your primary question: **No, it is not just verbal dressing.** While the mathematics of the standard St. Petersburg game yields the logarithm in both frameworks, the *ontological status* of that logarithm is fundamentally different. This difference becomes substantive (and mathematically divergent) the moment you change the dynamics of the gamble.

  Here is the breakdown of why the distinction matters, followed by the "Super-Petersburg" bonus round.

  ### 1. Psychology vs. Dynamics (The Ontological Split)

  You summarized the difference well: Bernoulli posits a property of the **agent**, while Peters posits a property of the **process**.

  *   **Bernoulli (Subjective):** The logarithm is in your head. It represents risk aversion. If you were a "risk-neutral" agent with linear utility, Bernoulli's theory says you *should* pay an infinite amount to play, and if you don't, you are irrational (or your utility function is secretly curved). The constraint is axiological.
  *   **Peters (Objective):** The logarithm is in the multiplication. It represents the geometry of compounding. If you reinvest your winnings (multiplicative dynamics), your wealth evolves as a product of independent random variables: $W_T = W_0 \prod_{t=1}^T (1 + r_t)$. By the law of large numbers, the long-time behavior is governed by the geometric mean, which is the exponential of the expected logarithm. The constraint is dynamical.

  **The Substantive Difference:**
  If the game changes from multiplicative dynamics (reinvesting) to additive dynamics (taking profits off the table, playing with "house money" or a fixed stake that doesn't risk ruin), Peters' ergodicity argument yields a **linear** utility function.

  In an additive random walk, the time-average growth rate is simply the ensemble average ($\langle \Delta W \rangle$). There is no ergodicity breaking between the ensemble mean and the time average for additive processes with finite variance.
  *   **Peters' verdict on additive St. Petersburg:** If you play additively, the time-average growth rate diverges. You *should* pay a lot. The paradox remains, but the explanation is that the game is physically unsustainable (the casino goes broke), not that you are risk-averse.
  *   **Bernoulli's verdict:** You should still use log utility (or whatever your fixed preference is) because that's how you value money.

  This is the smoking gun. If the "resolution" were just mathematical dressing, the function wouldn't change when the dynamics change. Peters' framework tells you that "risk aversion" is not a fixed psychological trait but a function of the leverage and dynamics of the specific gamble. A physicist would recognize this immediately: it's the difference between a system where energy is conserved (additive) and one where it compounds (multiplicative).

  ### 2. The Normative Force

  This ontological shift changes the normative advice.
  *   **Bernoulli:** "Maximize expected utility." This is a prescription for choice under uncertainty. It requires you to know your utility function.
  *   **Peters:** "Maximize the time-average growth rate." This is a prescription for survival and growth in a non-ergodic world. It requires you to know the dynamics of your wealth.

  In the spin glass analogy: Bernoulli is telling you to optimize your Hamiltonian based on how much you *like* certain spin configurations. Peters is telling you that if you follow a single trajectory through the energy landscape, you will get stuck in a local minimum unless you account for the fact that the landscape is non-ergodic. The "logarithm" in Peters' derivation isn't a preference; it's the Lyapunov exponent of the wealth trajectory.

  ### 3. Bonus Round: The Super-Petersburg (Menger's Critique)

  You recall correctly. Karl Menger (1934) showed that for any unbounded utility function $U(W)$ (including $\ln W$), one can construct a "Super-Petersburg" lottery with payouts growing fast enough (e.g., $e^{2^n}$) such that the expected utility diverges. Bernoulli's fix only works if you arbitrarily impose a *bounded* utility function (a saturation point for happiness), which introduces its own paradoxes (e.g., refusing a 50/50 bet to lose half your wealth vs. gain the universe).

  **Does Ergodicity Dodge This Bullet?**

  **Short Answer:** No, not mathematically. **Yes**, physically.

  **The Math:**
  In Peters' framework, the quantity to maximize is the expected logarithmic growth rate: $g = \langle \ln(W_{t+1}/W_t) \rangle$.
  In the standard St. Petersburg game, payout is $2^k$ with probability $2^{-k}$. The log payout is $k$. The sum $\sum 2^{-k} \cdot k$ converges.
  In Menger's Super-Petersburg, payout is $e^{2^k}$. The log payout is $2^k$. The sum $\sum 2^{-k} \cdot 2^k = \sum 1$ diverges.

  If the payout structure is truly $e^{2^k}$, the time-average growth rate *is* infinite. Peters' ergodicity economics does not magically make the divergence disappear. If the dynamics allow for super-exponential growth, the time-average growth rate reflects that.

  **The Physical Resolution:**
  However, Peters argues this dissolves the *paradox*, even if the math diverges.
  *   **Bernoulli/Menger Debate:** Argues over whether human psychology can conceive of infinite value. It's a debate about the bounds of the mind.
  *   **Peters' Argument:** Asks whether the *physical system* can support the payout. A payout of $e^{2^{100}}$ exceeds the number of particles in the observable universe.

  For Bernoulli, the game has infinite expected utility, but you won't pay it because you're "satiated."
  For Peters, the game has infinite expected growth rate, but you won't pay it because **the casino cannot pay.**

  Peters shifts the constraint from the **agent's utility function** to the **casino's solvency**. In the ergodicity framework, the "resolution" to the Super-Petersburg paradox is that such a lottery cannot exist in a finite universe. The expectation value diverges only because the model assumes an infinite bankroll. If you truncate the payout at the total wealth of the universe (a physical bound), both the ensemble average and the time average become finite.

  **Why this is conceptually superior (for a physicist):**
  It removes the need for "bounded utility," which is psychologically dubious (do you really value the 10 billionth dollar exactly zero?). Instead, it relies on "bounded resources," which is physically robust.

  ### Summary

  Your son-in-law isn't just selling you repackaged math.
  1.  **Source of the Log:** Bernoulli derives it from **preferences**; Peters derives it from **multiplicative dynamics**.
  2.  **Flexibility:** If you change the dynamics to additive, Peters' log disappears (becoming linear); Bernoulli's log stays (unless you change your mind).
  3.  **Menger:** Bernoulli requires bounded utility to stop the Super-Petersburg divergence. Peters accepts the divergence but argues the game is physically impossible (infinite bankroll required).

  Peters is essentially arguing that economics forgot it was dealing with **non-ergodic stochastic processes**. He's treating wealth like a spin system where the time trajectory matters more than the phase space volume. For a condensed-matter physicist, that should sound like music, even if the economists are still arguing about whether the logarithm is in the mind or the matrix.
