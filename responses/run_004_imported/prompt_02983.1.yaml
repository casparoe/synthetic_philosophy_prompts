      *   *Core Claim:* The expected utility of making a decision *after* observing a piece of free information is always greater than or equal to the expected utility of making the decision *without* that information.
      *   *Key Assumption:* The information must be *free* (costless) in terms of time, money, and cognitive load.
      *   *Key Assumption:* The decision-maker must be *perfectly rational* in updating their beliefs and maximizing utility based on that new information.
