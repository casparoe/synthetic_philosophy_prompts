prompt: |-
  I'm a software engineer with no formal background in philosophy or economics, but I've recently fallen down a rabbit hole trying to understand where the modern arguments about trade deficits and currency manipulation actually originated. A colleague mentioned that David Hume had already dismantled the mercantilist panic about a country losing its gold and silver to foreigners back in 1752, in an essay called "Of the Balance of Trade," so instead of reading a summary I went and found the original text. Most of it I can follow with some patience, but there is one stretch, which I gather is the load-bearing part of the whole argument, that I keep rereading without feeling like I've actually reconstructed the mechanics. It's the thought experiment where he imagines a country's money supply being suddenly destroyed or multiplied:

  "Suppose four-fifths of all the money in Great Britain to be annihilated in one night, and the nation reduced to the same condition, with regard to specie, as in the reigns of the Harrys and Edwards, what would be the consequence? Must not the price of all labour and commodities sink in proportion, and every thing be sold as cheap as they were in those ages? What nation could then dispute with us in any foreign market, or pretend to navigate or to sell manufactures at the same price, which to us would afford sufficient profit? In how little time, therefore, must this bring back the money which we had lost, and raise us to the level of all the neighbouring nations? Where, after we have arrived, we immediately lose the advantage of the cheapness of labour and commodities; and the farther flowing in of money is stopped by our fulness and repletion.

  Again, suppose, that all the money of Great Britain were multiplied fivefold in a night, must not the contrary effect follow? Must not all labour and commodities rise to such an exorbitant height, that no neighbouring nations could afford to buy from us; while their commodities, on the other hand, became comparatively so cheap, that, in spite of all the laws which could be formed, they would be run in upon us, and our money flow out; till we fall to a level with foreigners, and lose that great superiority of riches, which had laid us under such disadvantages?

  Now, it is evident, that the same causes, which would correct these exorbitant inequalities, were they to happen miraculously, must prevent their happening in the common course of nature, and must for ever, in all neighbouring nations, preserve money nearly proportionable to the art and industry of each nation. All water, wherever it communicates, remains always at a level."

  I think I understand the headline claim, that a mismatch in money between trading nations corrects itself, but I can't quite reconstruct, step by step, why the four-fifths-annihilation scenario ends with money flowing back in rather than just leaving the country permanently poorer, or why the quintupling scenario doesn't simply leave everyone richer. I'd also appreciate a gloss on a few of the more archaic pieces: what "specie" means precisely here, what period he's gesturing at with "the reigns of the Harrys and Edwards," and what the water-level analogy in the final paragraph is actually contributing beyond restating the conclusion in different words. Finally, since the context I actually care about is today's floating-exchange-rate world, I'd be curious whether Hume's mechanism quietly depends on assumptions, such as flexible prices or currencies pegged to a metal, that no longer hold, or whether the underlying logic still has teeth whenever I hear people worry about trade imbalances now.
