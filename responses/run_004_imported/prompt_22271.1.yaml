answer: |-
  This is an excellent catch, and you are right to be suspicious if you read these two passages as Hume stating his own positive theory in the first one and then contradicting it in the second. You aren't missing a move; you are identifying the exact pivot point of Hume's argument against the **naturalist/rationalist conception of promising.**

  To answer your core question directly: **Yes, the two-step structure is a deliberate *reductio ad absurdum*.** Hume is not endorsing the "willing of the obligation" in the first passage; he is arguing that *if* promising were a natural virtue (grounded in a specific mental act), *then* it would have to be the willing of an obligation. He then uses the second passage to show that "willing an obligation" is metaphysically and psychologically impossible.

  However, your second worry is the real dissertation gold: **Doesn't the "conventional" solution smuggle the same impossibility back in?** If we can't will a sentiment into being naturally, how does convention magic one into existence artificially?

  Here is a breakdown of the logical mechanics here, and where you might find a critical gap for your chapter.

  ### 1. The *Reductio* Structure (Passages 1 & 2)
  You are correct that Hume is trapping the opponent.
  *   **The Opponent's View:** Promising is a natural mental act that generates moral obligation immediately.
  *   **Hume's Trap:** If it's a mental act, what is it? It's not a resolution (I can resolve and break it without moral guilt yet). It's not a desire (I can promise with aversion). It's not willing the action (the action is future).
  *   **The Forced Move:** The only thing left is "willing the obligation."
  *   **The Kill Shot:** Obligation *is* a sentiment (pain/unease at violation). You cannot will a sentiment. Therefore, the naturalist account is absurd.

  Hume is consistent on the definition of obligation here. He isn't switching senses; he is using the stability of his sentimentalism to break the naturalist account of promising. The "gross absurdity" is the conclusion of the *reductio*, not a contradiction of his previous premise.

  ### 2. The Hard Question: The Convention "Fix"
  This is where your advisor will want you to dig. You ask: *If it's absurd to will a new sentiment naturally, doesn't convention require the same "new sentiment out of nowhere" move?*

  **The Short Answer:** No, because convention changes the **causal mechanism** of the sentiment, not the **volitional source**.

  **The Long Answer (for your chapter):**
  In the naturalist model, the mental act *itself* is supposed to conjure the sentiment *ex nihilo* at the moment of promising. Hume says this is impossible.
  In the conventional model, the sentiment is not created by the *act of will* at the moment of promising. It is created by the **social practice** over time.

  Here is the distinction you need to draw to resolve the tension:

  *   **Volitional Creation (Impossible):** "I hereby will that I feel pain if I break this." (This is what Hume calls absurd in Passage 2).
  *   **Causal Cultivation (Possible):** "I enter a system of rules where, through education and self-interest, society has conditioned me to feel pain if I break this."

  Hume's solution relies on **time and education**. In the section following your quotes, Hume explains that the sentiment of morality regarding promises is annexed to the *form of words* through social conditioning. We are taught from childhood that breaking a promise brings social censure and internal unease.

  So, when I promise, I am not willing a sentiment into existence. I am **invoking a pre-existing causal mechanism.** The sentiment arises *later*, upon violation (or the threat of it), triggered by my recognition that I have violated a useful social rule. The "obligation" doesn't come from my will; it comes from the **utility of the convention** acting upon my psychology.

  ### 3. Potential Gaps for Your Dissertation
  You asked if there is an actual gap here. While Hume's distinction between "volitional creation" and "causal cultivation" saves him from outright contradiction, there are tensions you can exploit for a critical chapter:

  **A. The "Education" Black Box**
  Hume leans heavily on "education" and "artifice" to explain how the sentiment gets attached to the promise. He writes that we are taught to feel unease at the breach.
  *   *Critical Angle:* Is this just pushing the problem back? If I cannot will a sentiment, how does society will it into me? Hume relies on a theory of psychological conditioning that is somewhat under-theorized in the *Treatise*. He assumes the sentiment *can* be grafted onto arbitrary actions (like saying specific words) if the social utility is high enough. You could argue this requires a malleability of human sentiment that Hume takes for granted.

  **B. The Moment of Obligation**
  If the sentiment only arises from the *utility* of the convention, when exactly does the obligation bind?
  *   *Critical Angle:* If I promise in a context where the convention is weak (e.g., among thieves, or in a state of nature), do I have an obligation? Hume suggests the obligation depends on the existence of the convention. This leads to the worry that for Hume, **there is no obligation at the moment of promising**, only a prediction of future pain if I break it. Some critics argue this reduces the "obligation" to a prudential calculation rather than a moral bond. Does Hume successfully bridge the gap between "it is in my interest to keep promises" and "I am morally obligated to keep promises"?

  **C. The "Form of Words" vs. Mental Act**
  Hume shifts the locus of the promise from the *mental act* (which he destroyed in Passage 1) to the *form of words* (the conventional sign).
  *   *Critical Angle:* This creates a disconnect between intention and obligation. If the obligation lies in the convention and the words, what role does the mind play? Hume says the mental act is "willing to be bound by the convention." But if "being bound" is just feeling a sentiment later, is the mental act just "predicting I will feel bad"? You can explore whether Hume successfully preserves the *normativity* of promising or if he reduces it to a sociological prediction.

  ### Summary for your Advisor
  You can confidently tell your advisor:
  1.  You recognize the first passage is a *reductio* of the naturalist view, not Hume's positive claim.
  2.  You see that Hume avoids contradiction by distinguishing between **willing a sentiment** (impossible) and **entering a convention that causally produces sentiments** (possible).
  3.  **Your Chapter's Move:** You want to interrogate whether that distinction holds water. Does the "conventional" account actually explain the *normative force* of the promise, or does it just explain the *psychological pressure*? Does relying on "education" to attach sentiments to words solve the "willing" problem, or does it just hide the magic in the socialization process?

  This moves you beyond "Hume says promises are artificial" (which, as you noted, is standard) to "Hume's mechanism for artificiality faces a specific psychological challenge regarding sentiment generation." That is dissertation-worthy.

  **Recommended Secondary Lit for this specific tension:**
  *   **Annette Baier, *A Progress of Sentiments*:** She focuses heavily on the educational/socialization aspect of Hume's artificial virtues.
  *   **Knud Haakonssen, *The Science of a Legislator*:** Good on the structure of Hume's conventionalism.
  *   **David Gauthier:** (Though more Hobbesian) His critiques of Hume on the "obligation" moment are useful for finding the gap.
  *   **Páll Árdal, *Passion and Value in Hume's Treatise*:** Classic analysis of the mental act vs. convention distinction.

  You're on the right track. It's not a mistake in the text; it's the engine of his argument. But the engine might be running on fumes when it comes to explaining *how* the sentiment gets attached. Go for that.
