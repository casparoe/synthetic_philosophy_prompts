      *   *Elias's Move:* Shift from quantity to quality/harmony. Leibniz isn't a utilitarian. It's about variety + order. There *is* a limit to complexity before chaos.
      *   *Mara's Counter:* Even with variety/order, can't you add one more soul? One more star? The "tack on" argument persists.
      *   *Elias's Climax:* The choice isn't about *adding*, it's about *selection*. If the series converges, God picks the limit. Or, God's will determines the standard. (Wait, let's stick closer to Leibniz). Let's argue that "Possible Worlds" are discrete, not continuous.
      *   *Mara's Closing:* Discrete doesn't solve infinite sets. Integers are discrete.
