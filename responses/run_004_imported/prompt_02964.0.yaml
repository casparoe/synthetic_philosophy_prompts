answer: |-
  **Setting:** *A university coffee shop, 11:30 PM. The table is buried under printouts of MacFarlane's "Assessment Sensitivity," Thomason's "Indeterminist Time and Truth-Value Gaps," and half-empty espresso cups. You are staring at a blank Word doc. Across from you, your friend Alex (a Relativist) is leaning back, spinning a pen. Sarah (a Supervaluationist) is hunched over a notebook, looking defensive.*

  **You:** I need to settle this. If I don't figure out whether MacFarlane is actually solving the problem or just moving the furniture, I'm going to fail my defense. Let's run the case again. Monday: Sam says, "There will be a sea battle on Friday." Metaphysically open future. Friday: Battle happens. Saturday: We look back. Was Sam's assertion *true* when she made it on Monday?

  **Alex (Relativist):** Easy. On Monday, it was indeterminate. On Saturday, it's true. That's the whole point of assessment sensitivity. The truth value depends on the context of assessment.

  **Sarah (Supervaluationist):** And that's where you lose me. On Monday, relative to the context of use, the proposition is neither supertrue nor superfalse. It's true on some histories passing through Monday, false on others. So, strictly speaking, it has no truth value *simpliciter* at the moment of utterance.

  **Alex:** But that's exactly the problem Thomason leaves you with! Think about Sam on Saturday. She's celebrating. She says, "I told you so! What I said on Monday was true." On your view, Sarah, Sam is wrong. You have to tell Sam, "No, actually, what you said on Monday was indeterminate, and it *still* is indeterminate relative to that Monday context." That's insane. It violates the strongest intuition we have about future contingents: that if the event happens, the prediction was true.

  **Sarah:** It's not insane, Alex. It's precise. We distinguish between *truth at a context* and *truth relative to a history*. On Monday, there was no fact of the matter. The fact of the matter was created by Friday. When Sam says on Saturday, "What I said was true," she's speaking loosely. She means, "The world resolved in the way I predicted." She doesn't mean the proposition possessed the property of supertruth on Monday.

  **Alex:** "Speaking loosely"? That's where MacFarlane pins you. You're treating the intuition that "Sam was right" as a pragmatic implicature or a loose speech act. But look at retraction. Suppose the battle *doesn't* happen. Sam comes back on Saturday and says, "Okay, I was wrong. I take it back." She *should* retract. Why?

  **Sarah:** Because she asserted something indeterminate that turned out not to obtain.

  **Alex:** But on your view, she asserted something indeterminate that *did* obtain, too! If the battle *had* happened, she still asserted something indeterminate on Monday. So why is she vindicated in one case and required to retract in the other? If the truth value is fixed as "indeterminate" at the moment of use (relative to the context), then the subsequent history shouldn't change the normative status of the assertion. But it does. We praise her if the battle happens; we criticize her if it doesn't. Supervaluationism severs the link between the outcome and the correctness of the assertion.

  **Sarah:** It doesn't sever the link. It just locates the correctness condition differently. The norm of assertion isn't "Assert only what is supertrue." It's "Assert only what is known" or "Assert only what is reasonably believable." Sam had evidence. The world cooperated. We praise the *process* and the *outcome*, not the semantic value.

  **Alex:** That's a retreat to pragmatics! You're saving the semantics by sacrificing the phenomenon. MacFarlane's move buys you something real: it explains why the *truth* itself seems to shift without changing the world. On Monday, the proposition isn't true. On Saturday, relative to the new context of assessment, that *same proposition* is true. It vindicates Sam's "I told you so" literally. She isn't speaking loosely. She is literally correct *now* about what she said *then*.

  **Sarah:** But at what cost, Alex? You're making truth relative to an assessor. That means two people can contradict each other without one being wrong. If I assess Sam's claim on Monday, it's indeterminate. If you assess it on Saturday, it's true. Are we disagreeing? No. That kills the idea of contradiction. Supervaluationism preserves classical logic. Excluded middle holds: "Either there will be a battle or there won't" is supertrue.

  **Alex:** Thomason saves Excluded Middle by making the disjunction true while both disjuncts are indeterminate. That's technically valid, but it's semantically weird. It means "There will be a battle" isn't true, "There won't be a battle" isn't true, but "One of them is true" is true. That's a logic for angels, not humans. MacFarlane gives us a logic that matches our practice. We treat future contingents as truth-apt once the facts are in.

  **Sarah:** Okay, let's hit your "Retrospective Assessment" point directly. You say Supervaluationism can't vindicate Sam on Saturday. I say you're conflating the *context of use* with the *context of assessment* in your semantics. A Supervaluationist can say: When we evaluate Sam's claim on Saturday, we are implicitly shifting the context. We are evaluating the content of her assertion relative to the *current* history.

  **Alex:** That's Contextualism, Sarah. That's not Supervaluationism. If the content changes because the context changes, then Sam isn't vindicating her *Monday* claim. She's making a new claim about the past. "It is now true that I said..." MacFarlane's point is that we want to assess the *original* claim. We want to say, "That very thing you uttered Monday is true today."

  **Sarah:** And I say "true" is a predicate we apply from our current standpoint. I don't need assessment-sensitive truth to do that. I just need to acknowledge that when we say "Sam was true," we are using a truth predicate that operates on the *actual history* from the perspective of Saturday. We don't need to relativize truth *itself* to the assessor. We just need to recognize that natural language truth ascriptions are sensitive to the time of assessment.

  **Alex:** But that *is* assessment sensitivity! You're just calling it "sensitivity of the truth predicate" instead of "sensitivity of truth." It's a verbal difference. MacFarlane argues that if the truth predicate shifts, truth shifts. You can't have it both ways.

  **Sarah:** I can if I maintain that there is a privileged context for semantic evaluation: the context of use. The semantics gives us the truth conditions relative to a history. The post-semantics tells us how to use the word "true." I can keep truth absolute relative to a world-time pair, and just admit that our *ascriptions* are flexible. You, on the other hand, build the flexibility into the metaphysics of truth. That's ontologically expensive. Why make truth itself relative when you can just make our *talk about truth* context-sensitive?

  **Alex:** Because the norms of retraction demand it! If I say "It's raining" and it's not, I should retract. If Sam says "Battle" and there's no battle, she should retract. If truth is absolute relative to the context of use, and on Monday it was indeterminate, why should she retract on Saturday? The semantic value hasn't changed! It was indeterminate then, it's indeterminate now (relative to Monday).

  **Sarah:** Because the *utility* of the claim has vanished! Look, suppose I say, "The coin will land heads." It's indeterminate. It lands tails. I say, "Okay, I was wrong." Why? Not because my statement became false. But because the world ruled out the histories where my statement was true. Supervaluationism handles this via the shrinking of the set of accessible histories. On Monday, the set included Battle and No-Battle. On Saturday, the set only includes Battle. Sam's assertion is now true on *all* remaining histories.

  **Alex:** Aha! So you admit the status changes!

  **Sarah:** The *set of histories* changes. The *definition of truth* (supertruth) doesn't. On Monday, "Battle" wasn't supertrue. On Saturday, relative to the *new* context, "Battle" is supertrue because the branching has collapsed. But strictly speaking, regarding the Monday context, it remains indeterminate.

  **Alex:** But why cling to the Monday context? When we argue about Sam's claim on Saturday, we aren't interested in the Monday context. We're interested in whether Sam got it right. MacFarlane allows us to say: The proposition is true relative to Saturday's assessment. You force us to say: The proposition is supertrue relative to Saturday's context, but we must remember it wasn't supertrue relative to Monday's. It's bureaucratic. It adds a layer of "relative to context" bookkeeping that Relativism handles with a single parameter: the context of assessment.

  **Sarah:** It's not bookkeeping; it's stability. If truth depends on who is assessing and when, then there is no fact of the matter about whether Sam was right, only whether she was right *for you, now*. Suppose a determinist assesses Sam's claim on Monday. He thinks the future is settled. Does that make Sam's claim true on Monday for him?

  **Alex:** No, because the context of assessment includes the history of the assessor. If the determinist is wrong about the metaphysics, his assessment doesn't fix the truth.

  **Sarah:** See, now you're adding constraints to the Context of Assessment to save objectivity. You're smuggling in a "correct history" parameter. But if there's a "correct history," why not just use Supervaluationism and say the actual history is the one that obtains?

  **Alex:** Because on Monday, there *is* no actual future history! That's the indeterminism. Supervaluationism says "All histories are real." Relativism says "Truth is relative to the history you're assessing from." On Monday, you assess from a history where the battle hasn't happened yet. On Saturday, you assess from a history where it has.

  **Sarah:** And I say that on Monday, you assess from a *moment* where multiple histories pass through. Truth is defined over that set. You're treating the assessor as picking a single history. But the assessor on Monday *can't* pick a single history. That's the metaphysical point.

  **Alex:** But the assessor on Saturday *can*. And that's what matters for the dissertation problem you're stuck on. You want to know if Sam was true. The Relativist answer is: "True relative to Saturday, not relative to Monday." The Supervaluationist answer is: "Indeterminate relative to Monday, Supertrue relative to Saturday's context." They look identical in output, but your view forbids you from saying "Sam's Monday assertion is true *simpliciter* on Saturday." You have to say "Sam's assertion is supertrue relative to the Saturday context."

  **Sarah:** Because "true simpliciter" implies a God's eye view. I don't have one. Neither do you. You just pretend you do by indexing it to the assessor.

  **Alex:** I'm not pretending. I'm acknowledging that *we* are the assessors. Truth is a tool for assessment. If the tool gives different results at different times, that's a feature, not a bug. It captures the openness of the future *and* the definiteness of the past. Supervaluationism captures the openness but makes the past definiteness semantic smoke and mirrors.

  **Sarah:** And Relativism captures the definiteness but makes the present truth unstable. If I assert "There will be a battle" on Monday, and you assess it on Monday, is it true?

  **Alex:** Indeterminate.

  **Sarah:** If I assess it on Saturday, is it true?

  **Alex:** Yes.

  **Sarah:** So the proposition changed truth value without the proposition changing?

  **Alex:** The *circumstances of evaluation* changed. The proposition is stable.

  **Sarah:** The circumstances of evaluation include the context of assessment. So truth depends on the assessor. If I assess it on Saturday and say "True," and you assess it on Saturday and say "False" (maybe you're in a different branch? No, that's Many Worlds). If we are in the same world, we agree. So where's the relativity?

  **Alex:** The relativity is temporal. It's about *when* you assess.

  **Sarah:** Then it's just temporal indexicality. "It is true at t."

  **Alex:** No, because the content of the assertion doesn't contain a time index. "There will be a battle." Not "There is a battle at t+4."

  **Sarah:** *Sighs and rubs temples.* Okay. Here's my comeback, and I want you to really think about this. You say Supervaluationism can't vindicate Sam. I say Supervaluationism vindicates Sam *better* because it respects the metaphysics of the moment she spoke. When Sam spoke, she took a risk. She asserted something that *could* have been false. That's the nature of prediction. If you make it true on Saturday, you retroactively eliminate the risk she took. You make it look like she stated a fact. She didn't. She made a gamble. Supervaluationism preserves the gamble. Relativism sanitizes it.

  **Alex:** ...That's actually good. It frames the indeterminacy as a feature of the speech act, not just the semantics.

  **Sarah:** Exactly. Sam's assertion was *apt* on Monday, even if not supertrue. On Saturday, we confirm the aptness. We don't need to rewrite the truth value of the Monday utterance to say she did well. We just say the world matched her words. Relativism tries to force the world to match the truth predicate. Supervaluationism lets the truth predicate track the world's structure, branches and all.

  **Alex:** But does "The world matched her words" mean "What she said was true"? If you say "No, it was indeterminate," you're fighting ordinary language.

  **Sarah:** I'm fighting the idea that "true" is the only normative compliment we can pay. We can say "Sam was correct," "Sam was vindicated," "Sam's claim obtained." We don't need to force "true" to do all the work.

  **Alex:** MacFarlane would say you're just renaming "true-at-a-history" to "obtained" to avoid the label "relativism."

  **Sarah:** Maybe. But if the label comes with the baggage that truth itself is relative, I'll keep the baggage off. I'd rather have a complex post-semantics than a relativist metaphysics.

  **You:** *Stops typing.* Wait. So the stalemate is: Alex, you think Sarah's distinction between "vindication" and "truth" is ad hoc to save absolute truth. Sarah, you think Alex's "assessment sensitivity" is a solution that dissolves the stability of truth too easily.

  **Alex:** Basically. I think she's scared of the word "relative."

  **Sarah:** And I think he's too quick to redefine "truth" to fit intuition pumps.

  **You:** Okay. For the dissertation... if I argue that Supervaluationism is metaphysically more honest but Relativism is pragmatically superior...

  **Sarah:** Then you're arguing for an expressivist compromise.

  **Alex:** Or you're arguing that MacFarlane is right that we need assessment sensitivity to explain the *norms*, even if Supervaluationism handles the *logic*.

  **You:** *Starts typing again.* "While Supervaluationism preserves the metaphysical openness of the future..." No, that's too dry. "The tension between the stability of truth and the openness of the future..."

  **Alex:** Just cite the dialogue. Best chapter ever.

  **Sarah:** Drink your coffee, Alex. It's cold.

  **Alex:** Like the truth value of a future contingent on Monday.

  **Sarah:** *Throws a napkin at him.*
