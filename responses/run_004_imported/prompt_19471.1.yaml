answer: |-
  You have hit on precisely the nerve of Anscombe's moral philosophy. Your reading of her Truman pamphlet (*Mr. Truman's Degree*, 1956) is correct: her objection was not utilitarian (i.e., "the costs outweighed the benefits"), but deontological and focused on the **structure of intention**. She argued that because the destruction of civilian life was the very *method* by which the surrender was to be coerced, it was intended as a means. Therefore, it was the direct killing of the innocent, which she held to be an absolute moral prohibition, regardless of the consequential good (ending the war).

  Applying this to modern "signature strikes" is a fascinating stress test for her framework. Here is how Anscombe would likely dissect the issue, broken down by the specific problems you raised.

  ### 1. Intended-as-Means vs. Foreseen Side-Effect
  In the Hiroshima case, Anscombe argued the civilian death was the *means*. In standard Just War theory (and loose applications of Double Effect), civilian death in a drone strike is usually categorized as a *foreseen but unintended side-effect* (collateral damage) of killing a legitimate target.

  However, Anscombe would likely argue that **signature strikes collapse this distinction.**

  *   **The Object of the Act:** For Anscombe, what you intend is defined by the description under which you act. If you launch a missile at a compound based on "patterns of life" (e.g., military-age males carrying weapons in a certain region) rather than positive identification of a specific combatant, the object of your act is not "killing Combatant X." The object is "killing whoever fits this pattern."
  *   **The Blurring of Target and Bystander:** If the intelligence is insufficient to distinguish a combatant from a civilian, then the civilians present are not truly "bystanders" in the moral sense; they are part of the target set. If you accept that "people matching this signature" are killable, and that signature is broad enough to include non-combatants, you are effectively intending to kill a group *knowing* it contains innocents.
  *   **Anscombe's Verdict:** She would likely argue that if the "signature" is not tight enough to guarantee combatant status, proceeding with the strike makes the death of the innocents **intended**. Why? because their death is accepted as part of the successful execution of the plan to "clear the pattern." You aren't killing them *to* terrorize (like Hiroshima), but you are killing them *as if* they were combatants. For Anscombe, treating an innocent as a combatant is a corruption of the will that amounts to intending their death.

  ### 2. The Problem of Uncertainty (Epistemic Negligence)
  You asked if her framework has an answer when "nobody can say who exactly is being killed." Anscombe would say this uncertainty is not a loophole; it is the **moral crime.**

  *   **Moral Certainty:** Anscombe was a Thomist; she believed you need moral certainty before acting. In *Intention*, she emphasizes that you are responsible for what you intend under the description you know. If you know you *don't know* who is in the building, but you bomb it anyway, you cannot claim you intended to kill only the guilty.
  *   **Recklessness as Intention:** She would likely argue that acting without positive identification is a form of recklessness that morally equates to intention. If I shoot into a fog knowing people are there, I cannot claim I only intended to shoot the "potential enemies." I intended to shoot *into the fog*. If innocents die, I willed the act that killed them without just cause.
  *   **The "Who" Matters:** For Anscombe, the prohibition is against killing *the innocent*. If you do not know who they are, you cannot know if they are innocent. Therefore, you cannot know if your act is permissible. To proceed is to gamble with a moral absolute. She would view this as a dereliction of the moral duty to distinguish.

  ### 3. The "Terror" Element (Returning to Hiroshima)
  There is a second layer where signature strikes might look even *more* like Hiroshima in Anscombe's eyes.

  *   **Area Denial and Coercion:** Critics of drone warfare often argue that signature strikes are used for "area denial" or to instill fear in a population to suppress insurgency (a strategy of terror). If the *purpose* of the strike is to make the local population too afraid to harbor militants, then the death of the people in the compound (and the bystanders nearby) serves the function of **coercion**.
  *   **Anscombe's Radar:** Anscombe was hyper-vigilant about this. If the strategic value of the strike relies on the psychological impact on the surviving population ("if they walk around with phones, they get blown up"), then the killing is once again a **means to terror**. This would make it structurally identical to Hiroshima for her: the killing is the lever used to move the enemy's will.

  ### 4. Does the Framework Break?
  You ask if her intention/foresight framework has a clear answer here. Paradoxically, **the framework becomes stricter when uncertainty increases.**

  Utilitarianism can handle uncertainty by calculating probabilities (e.g., "80% chance they are combatants, so the expected utility justifies the strike"). Anscombe's framework cannot do this. You cannot calculate a percentage of murder. Either the act is the killing of the innocent or it is not.

  *   **If they are combatants:** The strike is permissible (subject to proportionality).
  *   **If they are civilians:** The strike is murder.
  *   **If you don't know:** You are choosing to act in a state of moral ambiguity regarding the killing of human beings. For Anscombe, this is sufficient to condemn the act. She would argue that the "signature" methodology is an attempt to bypass the burden of proof required to justify killing.

  ### Summary of Anscombe's Likely Position
  She would likely condemn signature strikes, but perhaps with a nuanced distinction from Hiroshima:

  1.  **Hiroshima:** The killing of civilians was the **explicit means** of victory (Terror).
  2.  **Signature Strikes:** The killing of civilians is often framed as a **side-effect**, BUT...
  3.  **The Catch:** Because the targets are not identified, the distinction between combatant and civilian is obliterated *by the attacker*. By refusing to identify the target, the attacker **constructs a scenario where the death of innocents is inevitable and accepted.**

  Anscombe would likely say that signature strikes represent a **bureaucratization of the intention to kill innocents.** By using algorithms and patterns rather than human identification, the state creates a "description of action" ("neutralizing signatures") that hides the reality ("killing human beings we haven't identified").

  She would argue this is a linguistic and moral trick to evade responsibility. Her conclusion would likely be: **If you do not know they are guilty, you must presume them innocent. To kill them is to intend the death of the innocent, regardless of whether you call it "collateral damage" or "signature neutralization."** The uncertainty doesn't save the actor; it indicts them.
