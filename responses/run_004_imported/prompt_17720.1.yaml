      *   **William James:** "The Will to Believe." Some options are *live, forced, and momentous*. Waiting for evidence means losing the opportunity. Trust creates the truth (e.g., the mountain climber, mutual love). *Application to Fiancé/Marriage:* Taking the risk on love, committing before all data is in.
