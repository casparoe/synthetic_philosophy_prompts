      *   **Question 2:** Does Sidgwick's approach (treating the state as a "going concern") solve the boundary problem regress, or just hide it?

  2.  **Analyze the Sidgwick Passage:**
      *   *Premise 1:* Mere local habitation isn't enough for membership.
      *   *Options:* Birth (Descent or Soil) vs. Consent.
      *   *Observation:* In practice, these usually coincide (native parents + native soil).
      *   *Conclusion 1 (for the majority):* Because they coincide and tradition/custom binds them, treat the native-born as "inchoate members" who mature into full members without formal consent. Questioning this is "superfluous and disturbing."
      *   *Transition:* What about aliens?
      *   *Problem:* Large numbers of permanent non-citizens weaken "internal coherence."
      *   *Solution:* Admission to citizenship should be open to resident aliens *if* they show "settled preference" (long, orderly residence) and knowledge of laws/habits.
      *   *Edge Case:* Children of resident aliens (born on soil but foreign parents).
      *   *Solution:* Let them choose at "years of discretion" (to avoid unwilling members), unless their numbers are too high (security/stability concern).

  3.  **Address Question 1: Principled Reason vs. Status Quo?**
      *   *Sidgwick's Logic:* He appeals to "internal coherence" and "national unity" (language, customs, traditions).
      *   *For Natives:* The "bonds of national unity" are inherited organically. Formal consent is unnecessary because the socialization *is* the consent (tacit). To demand formal consent would be "disturbing."
      *   *For Aliens:* They lack the organic bonds. Therefore, they must demonstrate "settled preference" (explicit/behavioral consent) and competence (knowledge of laws).
      *   *Principle:* Utilitarian/Pragmatic stability. The goal is a coherent, functioning state, not abstract justice.
      *   *Critique:* It *is* largely existing practice dressed up, but Sidgwick tries to ground it in the functional need for social cohesion. He prioritizes the stability of the existing community over the abstract right of the individual to choose.
      *   *Verdict:* It's a mix. The principle is "social coherence," but the application relies heavily on the contingent fact that birth + soil usually match. It creates a asymmetry: natives get the benefit of the doubt (tacit consent), aliens bear the burden of proof (explicit consent).

  4.  **Address Question 2: The Boundary Problem Regress?**
      *   *The Regress:* To decide who votes on membership, you need to know who is a member.
      *   *Sidgwick's Move:* He doesn't try to found the state from scratch (social contract style). He starts with "Ever since political societies have existed..." (Historical/Descriptive).
      *   *Does it solve it?* No, it *dissolves* it by changing the subject. He treats the state as a historical fact, not a normative construct needing foundational legitimacy at every step.
      *   *Does it relocate it?* Yes. The "unexamined great majority" is the black box. He assumes the existing demos is legitimate and asks only about *marginal* adjustments (naturalization, edge-case children).
      *   *Implication:* This is a conservative/pragmatic approach. It avoids the infinite regress by refusing to ask the radical question ("Why does *this* group constitute the demos?"). It accepts the historical boundary as the starting point.

  5.  **Drafting the Response:**
