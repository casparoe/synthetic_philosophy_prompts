answer: |-
  First, congratulations on filing your application. It is entirely fitting that the bureaucratic process of naturalization would trigger exactly this kind of philosophical vertigo. You are standing precisely on the boundary that political theory struggles to draw, and your intuition that Sidgwick is wrestling with the same tension is spot on.

  Sidgwick is a utilitarian, but in *The Elements of Politics*, he often leans toward a pragmatic conservatism. He is less interested in abstract rights than in the functional stability of the state. Here is a reconstruction of his argument, followed by an analysis of your two questions.

  ### Reconstructing Sidgwick's Argument

  Sidgwick's logic in this passage moves from the **empirical** (how things usually are) to the **functional** (what keeps the state stable).

  1.  **The Coincidence Thesis:** While there are three theoretical ways to determine membership (Descent, Soil, Consent), in stable modern nations, the first two coincide. Most people are born on the soil *to* members.
  2.  **The Presumption of Membership:** Because birth and soil coincide, and because culture (language, custom) is transmitted organically within families, the native-born possess "inchoate membership." Demanding formal consent from them is "superfluous and disturbing." Their socialization *is* their consent.
  3.  **The Problem of the Alien:** A permanent class of residents who are *not* members threatens "internal coherence." A state cannot function well if a large chunk of its population is disconnected from its political habits.
  4.  **The Solution for Aliens:** To preserve coherence, citizenship must be open to aliens, *but* only upon proof of "settled preference" (long residence) and competence (knowledge of laws). This substitutes for the organic socialization natives receive.
  5.  **The Edge Case (Children of Aliens):** For those born on the soil to alien parents, the coincidence breaks. Sidgwick suggests an "option" model: let them choose at maturity. This balances the *jus soli* claim (they were born here) with the liberal principle that membership shouldn't be forced ("unwilling members"), unless their numbers threaten stability.

  ***

  ### 1. Insiders vs. Outsiders: Principle or Status Quo?

  You ask if there is a principled reason for holding natives and naturalizers to different standards, or if this is just existing practice dressed up as theory.

  **The Principled Defense: "Internal Coherence"**
  Sidgwick does offer a principle: **social cohesion.** For Sidgwick, the state is not just a legal contract; it is a community bound by "common language, customs, and traditions."
  *   **For Natives:** These bonds are acquired osmotically. Sidgwick argues that because they grow up immersed in the "political habits" of the state, their tacit consent is demonstrated by their life trajectory. To demand a formal act of consent would be "disturbing" because it implies the bond is optional, which could weaken the sense of inevitable unity required for a nation.
  *   **For Aliens:** They lack this osmotic socialization. Therefore, to ensure the "internal coherence" of the community, they must demonstrate *explicit* adoption of these habits. The "settled preference" requirement is a functional proxy for the cultural assimilation natives get for free.

  **The Critique: Status Quo Bias**
  However, your suspicion is well-founded. Sidgwick's argument relies heavily on the **contingent fact** that birth and soil usually coincide. He essentially argues: *Because* most people are native-born, we should build the system around them and treat exceptions as administrative problems.
  *   **The Asymmetry:** Natives are given the benefit of the doubt (presumed consent); aliens bear the burden of proof (demonstrated preference).
  *   **The Circularity:** Why is the native culture the one that constitutes "coherence"? Sidgwick doesn't justify the *content* of the national unity, only the *need* for it.

  **Verdict:** It is a mix. The *goal* (coherence) is principled within Sidgwick's utilitarian framework. But the *method* (privileging the native-born as the default) is largely a rationalization of 19th-century nation-state building. He treats the native majority as the "host" and the alien as the "guest," assuming the host's right to set terms is self-evident. For you, the applicant, this manifests as the requirement to prove you are "one of us" in a way no born citizen ever has to.

  ***

  ### 2. The Boundary Problem: Solution or Evasion?

  This is the deeper theoretical question. The "boundary problem" (often associated with Frederick Whelan or Robert Dahl) argues that you cannot democratically decide who the demos is, because you need a demos to vote on the decision.

  **Sidgwick's Move: The "Going Concern"**
  Sidgwick quietly sidesteps the regress by refusing to treat the state as a hypothetical construct. Notice his phrasing: *"Ever since political societies have existed..."*
  *   He does not ask: "How do we legitimately found a state?"
  *   He asks: "Given that states already exist, how do we manage their edges?"

  **Does this solve the regress?**
  In a pragmatic sense, **yes.** By treating the existing state as a historical fact rather than a normative puzzle, he stops the infinite regress before it starts. The "demos" is defined historically and culturally, not procedurally. The boundary is fixed by time and tradition, not by a vote.

  **Does it relocate the problem?**
  **Yes,** onto the "unexamined great majority."
  Sidgwick takes the legitimacy of the existing citizenry for granted. He assumes the "internal coherence" of the native-born is a good thing that deserves protection. But if the original boundary was drawn unjustly (by conquest, exclusion, or arbitrary colonial lines), Sidgwick's framework has no tools to correct it.
  *   By focusing on *acquisition* (how new members join) rather than *constitution* (why this group rules), he protects the status quo from radical democratic challenge.
  *   The "regress" is hidden inside the black box of "national unity." He assumes the native-born *are* a coherent unit worthy of self-government, without asking who decided that.

  **Verdict:** Sidgwick relocates the problem. He solves the *administrative* question of membership by presupposing the *political* legitimacy of the existing boundary. For a theorist of stability, this is a feature, not a bug. For a theorist of justice (or an applicant feeling the weight of that boundary), it looks like an evasion.

  ### A Thought for Your Situation

  It is understandable that this leaves you preoccupied. You are living through the asymmetry Sidgwick describes. You are being asked to perform the "formal act of consent" and prove the "settled preference" that the "great majority" never had to.

  Sidgwick would say this is necessary for the "internal coherence" of the state you wish to join. But the boundary problem reminds us that this coherence is itself a political construct. The anxiety you feel is the friction of moving from the "outside" (where boundaries are rigid) to the "inside" (where boundaries are invisible and taken for granted). Sidgwick's text is valuable because it admits that this distinction is arbitrary ("minor importance"), yet insists on maintaining it for the sake of order. That tension—between the arbitrariness of the border and the necessity of the bond—is exactly what you are navigating.
