      *   *The Two Generals Problem:* Two armies need to attack at dawn. They send messengers. Messenger 1 gets through. Messenger 2 confirms. But does General 1 know Messenger 2 got through? Infinite loop. They never attack.
      *   *The Wedding Solution:* The wedding *is* the public signal that closes the loop.

  3.  **Drafting - Section by Section:**

