answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I've had the privilege of being Priya's friend for [Number] years.

  When Priya asked me to give this toast, I wanted to make sure I honored the way she sees the world. As many of you know, Priya works in epistemic game theory. Which is a fancy way of saying she spends her professional life thinking about how we know what we know, and how we make decisions when we aren't entirely sure what other people are thinking.

  Naturally, I started thinking about their relationship through that lens.

  There is a concept in Priya's field called the difference between *mutual knowledge* and *common knowledge*.

  Mutual knowledge is when everyone in a group knows a fact. For example, right now, mutual knowledge is that we are all in a room with nice lighting. We all know it.

  But *common knowledge* is much rarer, and much more powerful. Common knowledge means that everyone knows the fact, everyone knows that *everyone else* knows the fact, and everyone knows that everyone knows that everyone knows it, infinitely.

  It sounds like semantics, but it matters. There is a famous problem in game theory called the "Coordinated Attack Problem." Imagine two generals on opposite hills need to attack a valley at dawn to win. They have to coordinate. They send a messenger. The messenger gets through. But General A doesn't know if the messenger arrived. So General B sends a confirmation messenger. But now General A doesn't know if the confirmation messenger got through.

  Technically, through private messages alone, you can never reach 100% certainty. You get stuck in an infinite loop of "I know that you know that I know." For the three game theorists in the room: yes, without a public signal, the probability of coordination never quite reaches one.

  I bring this up because Priya and [Partner's Name] could have skipped this. They already loved each other. That was mutual knowledge. They told their parents, they told their friends, they moved in together. They could have gone to a courthouse, signed a paper, and gone to lunch.

  But if they had done that, it would have remained a pile of private mutual knowledge. I might know they're married. You might know they're married. But I wouldn't know that *you* know. I wouldn't know that their Aunt Susan knows that *I* know.

  And that is why we are here.

  A wedding isn't just a celebration of love; it is a mechanism for generating common knowledge. By standing up here, in front of all of you, Priya and [Partner's Name] are broadcasting a public signal that closes the loop.

  When you witnessed their vows, you didn't just learn they are married. You saw *each other* learn it. You saw the people who love them most in the world commit to supporting this union. And now, we all carry that shared certainty.

  For the rest of you who don't care about game theory, here is what that actually means in plain English: It means you are not doing this alone.

  If marriage were just private mutual knowledge, it would be a secret contract between two people. And when things get hard—and they will get hard sometimes—it would be easy to feel isolated. But because we have this common knowledge, because we are all witnesses, the weight is distributed.

  We all know you're married. We all know we're here for you. And we all know that we can count on each other to help you stay that way.

  Priya, you spend your life studying the theoretical limits of rationality and coordination. But today, you've solved the problem practically. You gathered the witnesses. You created the common knowledge. You built the community.

  [Partner's Name], you may not read game theory papers, but you understood the assignment better than anyone. You knew that love isn't real until it's witnessed.

  So, if everyone could please raise a glass.

  To Priya and [Partner's Name]. May your private love always be this publicly supported. May you never have to send a messenger to know where you stand. And may the rest of your lives be a perfect equilibrium of happiness, laughter, and common knowledge.

  To the happy couple!
