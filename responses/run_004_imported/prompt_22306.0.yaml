      *   **Core Concept:** The difference between *mutual knowledge* (everyone knows X) and *common knowledge* (everyone knows X, everyone knows everyone knows X, ad infinitum). Specifically, the "Coordinated Attack Problem" (Two Generals Problem) and how public ceremonies solve the infinite regress problem.
      *   **Tone:** Sincere, not just clever. Needs one genuine laugh for the nerds. Length: ~5 minutes (approx. 750-900 words spoken at a moderate pace).
