  Action: Belief at exit 1 is $\frac{1}{1+p}$. Belief at exit 2 is $\frac{p}{1+p}$.
  EV of Continuing = $\frac{1}{1+p} \cdot (\text{Value at 2}) + \frac{p}{1+p} \cdot (\text{Value at End})$.
