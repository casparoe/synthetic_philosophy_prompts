      *   Address the "why" intuitively? Yes.
      *   Address what it reveals? Yes (self-locating belief, control vs. evidence).

  8.  *(Self-Correction during drafting)*: I need to be careful not to say the Action view is "wrong" without nuance, but the consensus is that Planning dominates here because the agent *can* pre-commit. The conflict reveals the tension between Evidential Decision Theory (EDT) and Causal Decision Theory (CDT). I should mention this distinction lightly as the "deeper reveal."
