      *   **Recommendation:** For a novel, the 2/3 argument is more compelling and highlights the horror/weirdness of duplication. It makes the duplication feel like it changes reality, not just biology.
      *   **Dialogue Strategy:** Don't have the character say "It's 2/3 because of SIA." Have them explain the "pool of consciousness" or "ticket in a hat" analogy.

  6.  **Refining the Logic (Self-Correction/Verification):**
      *   Is it definitely 2/3?
