      *   Expected Value (if 50/50 coin): $0.5 * (-200) + 0.5 * (100) = -50$.
      *   To make the bet fair, the probability of Heads must be weighted higher.
      *   If she believes Heads is 2/3: $2/3 * (-200) + 1/3 * (100) = -400/3 + 100/3 = -300/3 = -100$. Wait.
