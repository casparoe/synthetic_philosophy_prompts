          *   Strength: Intuitive, aligns with standard frequentist probability of the coin itself.
      *   **The "Thirder" Position (User's Intuition):**
          *   Argument: We need to count observer-moments. If the experiment is run many times, there will be twice as many "waking up" experiences in the Heads world as in the Tails world. If you find yourself having a waking experience, you are more likely to be in a world where there are more waking experiences.
