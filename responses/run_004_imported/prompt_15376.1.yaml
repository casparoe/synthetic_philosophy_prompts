          *   Tails: 1 conscious experience exists.
          *   Probability = 2/3.

      *   *Crucial Distinction:* In the Sleeping Beauty problem, the "Tails" outcome creates *more time* for the same person. In this duplication problem, the "Heads" outcome creates *more people*.
