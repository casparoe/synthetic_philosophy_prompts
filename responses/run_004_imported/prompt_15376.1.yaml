          *   Scenario A (Heads): 2 people wake up (Original, Copy).
          *   Scenario B (Tails): 1 person wakes up (Original).
          *   Total potential "wakers": 3 (in a mixed universe of possibilities).
          *   If I am a random "waker," what are the odds I'm in the Heads branch?
          *   There are 2 "wakers" associated with Heads. There is 1 "waker" associated with Tails.
          *   So, $P(Heads | Waking) = 2 / (2 + 1) = 2/3$.
          *   *Correction/Refinement:* This depends on the "Self-Indication Assumption" (SIA) vs. "Self-Sampling Assumption" (SSA).
          *   SIA says: You should reason as if you are randomly selected from the set of all possible observers. This leads to 2/3.
          *   SSA says: You should reason as if you are randomly selected from the set of observers in your specific reference class (often leading to 1/2 if the reference class is defined strictly around the pre-experiment identity).

