      *   *Wait, there's a stronger argument for 50%.*
      *   If the Original goes to sleep, she knows 100% she will wake up.
      *   If Heads, a *new* person (Copy) also wakes up.
      *   If I am the Original, I wake up either way.
      *   If I am the Copy, I only wake up if Heads.
      *   But I don't know who I am.
      *   Let's look at the "Incubator" variant of Sleeping Beauty (created by Nick Bostrom). This matches the user's scenario exactly.
      *   **The Incubator Problem:**
          *   Coin flip.
          *   Heads: Create Room 1 (Person A) and Room 2 (Person B).
          *   Tails: Create Room 1 (Person A).
          *   You wake up in a room. What are the odds of Heads?
          *   Most anthropic reasoning suggests **2/3**.
      *   *Why?* Because there are three possible "you"s that could be asking the question. Two of them live in a Heads world. One lives in a Tails world.
      *   *Counter-argument (Halfer):* The "Original" is the only one with a past. The Copy has fake memories. If "I" am defined by my continuous history, I am the Original. The Original wakes in both cases. So 50%.
      *   *But the prompt says:* "same memories... both wake up feeling 100% like 'the real one'." This implies psychological continuity is broken/indistinguishable. This pushes towards the 2/3 answer.

  5.  **Synthesizing the Answer:**
      *   Acknowledge that this is a famous philosophical problem (Sleeping Beauty / Incubator).
      *   Validate both sides: The Critique Partner is right about the *coin*. The User is right about the *experience*.
      *   Explain the "Self-Indication Assumption" (SIA).
      *   Provide the math: 3 possible waking instances (Original-Heads, Copy-Heads, Original-Tails). 2 belong to Heads. Therefore 2/3.
