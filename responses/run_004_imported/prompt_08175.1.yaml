prompt: |-
  ok this is a random one but every year on Feb 14th (Douglass's self-picked bday) our history dept runs a "Douglass Day" transcribe-a-thon with the Colored Conventions Project, and i got voluntold to give the 5-min welcome speech before everyone sits down to type. the prof for the 19th-century constitutional history seminar im taking this semester -- who is basically THE Douglass person in the department -- is gonna be sitting right there, but like 30 other people are just students and community folks who know him as "gave good speeches, escaped slavery" and nothing more specific.

  i want the speech to lean on the fact that Douglass totally reversed himself on the Constitution: he started out agreeing with Garrison that it was a pro-slavery document you had to disown, then broke with Garrison and insisted instead that the text itself, read straight, is anti-slavery. i want that somehow tied to why we're spending the afternoon transcribing exact words letter by letter instead of reading a summary. it cant flatten into "the founders were secretly abolitionists," and it cant flatten into "he only said that for movement PR" -- my prof will clock either move instantly. can you write me the speech?
