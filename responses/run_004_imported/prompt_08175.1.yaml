answer: |-
  **Title:** The Text and the Tool
  **Time:** Approx. 5 minutes
  **Tone:** Intellectual, welcoming, grounded, respectful of the scholarship

  **(Stand comfortably at the podium. Make eye contact with the room, specifically acknowledging the Professor early on.)**

  Good afternoon, everyone. Happy Douglass Day.

  For those of you joining us from the community, welcome. For those of you in the department, welcome back. It is a privilege to stand here, especially knowing that [Professor's Name] is in the room. I know that if I get the constitutional theory wrong, I will hear about it in office hours tomorrow. So, I'll try to be precise.

  We all know the broad strokes of Frederick Douglass's life. He escaped bondage. He became the preeminent orator of the 19th century. He argued for freedom with a voice that could shake a hall. But today, as we prepare to spend hours staring at screens and typing out handwritten minutes, I want to focus on a different side of Douglass. I want to focus on Douglass the reader. Douglass the interpreter of texts.

  Specifically, I want to talk about the Constitution.

  As many of you know, Douglass did not always view the Constitution the way we might expect. In the 1840s, standing alongside William Lloyd Garrison, Douglass denounced the Constitution as a "covenant with death and an agreement with hell." He argued that because the document accommodated slavery—through the Three-Fifths Clause, the Fugitive Slave Clause—it was morally compromised. To be an abolitionist, you had to disown the Union.

  But in 1851, Douglass publicly broke with Garrison. He announced a startling reversal. He declared that the Constitution was, in fact, a "glorious liberty document."

  Now, it is tempting to flatten that shift. It is tempting to say he changed his mind for political expediency, or to say he suddenly believed the Founding Fathers were secret abolitionists. But the scholarship tells us it was neither. Douglass didn't suddenly think the *men* who wrote the Constitution were saints. He knew they were compromised. He knew they lived in a slaveholding republic.

  What changed was his *reading*.

  Douglass came to argue that while the *context* of the Founding was pro-slavery, the *text* itself was not. He pointed out that the word "slave" appears nowhere in the Constitution. The document speaks of "persons," of "people," of "citizens." He argued that slavery was a creature of state law, but the federal Constitution established a government dedicated to liberty. He realized that if you read the text strictly, without the gloss of pro-slavery precedent, the document didn't protect slavery—it provided the legal tools to destroy it.

  He moved from rejecting the text to mastering it. He realized that power lies in the specific words, not just the spirit of the thing.

  And that is why we are here today.

  We are partnering with the Colored Conventions Project to transcribe the minutes of Black political organizing in the 19th century. We could, theoretically, just read summaries of these conventions. We could look at the highlights. But that would miss the point.

  Douglass taught us that the devil—and the deliverance—is in the details.

  When we transcribe, we are doing what Douglass did with the Constitution. We are slowing down. We are refusing to accept the summary. We are looking at the exact phrasing, the specific motions, the precise language these Black delegates used to claim their citizenship. We are treating their words with the same textual fidelity that Douglass demanded for the Constitution.

  Transcription is an act of resistance against the erosion of history. It is a refusal to let these words become vague myths. Just as Douglass insisted that the Constitution meant what it *said*, not what the slaveholders *wanted* it to say, we are insisting that these Convention minutes stand on their own terms, letter by letter.

  So, when you sit down to type today, and you struggle to read a handwritten "R" or decipher a crossed-out line, remember: you are practicing the same discipline that Douglass used to turn a pro-slavery legal code into a weapon for emancipation. You are honoring the text.

  Thank you to the Colored Conventions Project for hosting us. Thank you to [Professor's Name] for guiding us through this history. And thank you all for being here to do the work.

  Let's get to typing.
