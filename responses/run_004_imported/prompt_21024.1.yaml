          *   *Positivist Goal:* Keep the *concept* of law separate from morality. A law can be valid even if it violates this minimum content (though the society might collapse).

      *   **Fuller's Inner Morality:**
          *   *Source:* The nature of lawgiving itself (procedural).
          *   *Function:* Necessary for something to count as *law* (not just managerial direction or force).
          *   *Status:* It creates a reciprocity between ruler and ruled. Violating it isn't just inefficiency; it's a moral failure of fidelity.
          *   *Natural Law Goal:* Connect the *existence* of law to morality. Bad procedure = no law.

      *   **Hart's Objection (The Poisoner Analogy):**
          *   Fuller's principles are just efficiency norms. A poisoner needs clarity and consistency to kill effectively. That doesn't make poisoning moral.
          *   Therefore, Fuller's "morality" is just "efficacy."

  3.  **Address Question 1: Necessary Conditions:**
      *   *Hart:* Necessary for *social survival*. It is sociological/anthropological. If you ignore it, the group dies. It does *not* determine legal validity. A rule can be law even if it violates the minimum content (e.g., a rule commanding suicide), though such a system is unsustainable.
      *   *Fuller:* Necessary for *legal validity* (existence). If you ignore it, you don't have law, you have arbitrary power. It is constitutive.
      *   *Fuller's Stronger Claim:* Sometimes he implies it leads to *goodness*. If you follow the inner morality, you respect human agency, which makes substantive evil harder (though not impossible).
      *   *Distinction:* Hart is talking about the *content* required for a *society* to persist. Fuller is talking about the *form* required for *law* to exist.

