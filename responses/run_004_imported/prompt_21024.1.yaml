      *   *The Boomerang:* If Hart admits that *any* legal system *must* have this content to function as a legal system (which he nearly does in *Concept of Law*), he is admitting a structural constraint on law derived from human nature. This looks suspiciously like a natural law claim, just grounded in biology/sociology rather than theology/reason.
