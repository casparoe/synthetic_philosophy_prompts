      *   *Decision:* I will argue that **Hart's concession is the more damaging one to his own project.** Fuller's "inner morality" is consistent with his project (procedural natural law). Hart's "minimum content" smuggles substantive moral constraints into the definition of legal systems under the guise of sociological necessity, weakening the Separation Thesis.

