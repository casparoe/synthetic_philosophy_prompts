      *   *Does it dissolve Fuller?* No. The poisoner analogy fails because law claims authority and demands obedience based on rules. Poisoning does not claim authority over the victim. The "morality" Fuller speaks of is the morality of *aspiration* and *reciprocity*, not just technical success.
