prompt: |-
  I'm interviewing a guest next month for a small formal-epistemology speaker series. She's known for the hardline reading of Aumann's agreement theorem -- namely, that two people who trust each other's rationality can't really keep disagreeing once they've swapped posteriors, and that persistent expert disagreement is basically always a tell that someone's irrational or dishonest. Draft me 8-10 questions that dont just have her re-explain the theorem: one should press on how realistic the common-prior assumption really is, one on the gap between the full common knowledge the proof needs (not just both knowing something, but knowing they know you know, and so on) and the messier mutual knowledge people actually have mid-argument, and one on whether she's allowed to privately suspect the other guy is less rational than her without that becoming a license for anyone to disagree forever. Add a follow-up to each, keyed to whatever answer she'd probably give.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** Interviewing a guest for a small formal-epistemology speaker series.
      *   **Guest's Stance:** Hardline reading of Aumann's Agreement Theorem (AAT). Believes persistent expert disagreement implies irrationality or dishonesty once posteriors are swapped.
      *   **Task:** Draft 8-10 questions.
      *   **Constraints:**
          *   Do not just ask her to re-explain the theorem.
          *   Must include specific questions on:
              1.  Realism of the Common Prior Assumption (CPA).
              2.  Gap between Common Knowledge (infinite recursion) vs. Mutual Knowledge (messy reality).
              3.  Asymmetric rationality assessments (can I think *you're* irrational without licensing eternal disagreement?).
          *   Must include a follow-up for each question, keyed to her likely answer.
      *   **Tone:** Formal but probing, suitable for an epistemology speaker series.

  2.  **Deconstruct the Guest's Position (The "Hardline"):**
      *   *Core Claim:* Rational agents with common priors cannot agree to disagree.
      *   *Implication:* If experts disagree, at least one is violating the norms of rationality (or lying).
      *   *Vulnerabilities:* The assumptions of the theorem (Common Priors, Common Knowledge of Rationality, Common Knowledge of Posteriors, Partition Structures) are extremely strong and often unrealistic.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Common Prior Assumption (CPA).*
          *   *Draft 1:* Is the common prior assumption realistic?
          *   *Critique:* Too simple. Needs to press on *why* we should keep the theorem if CPA fails.
          *   *Refinement:* Focus on the "Harsanyi Doctrine" vs. empirical psychology.
          *   *Follow-up:* If she says "it's a normative ideal," ask about the practical utility of a norm that humans can't meet.

      *   *Requirement 2: Common Knowledge vs. Mutual Knowledge.*
          *   *Draft 1:* The proof needs infinite recursion. People don't do that. Does this matter?
          *   *Critique:* A bit clunky. Needs to address the "mid-argument" state.
          *   *Refinement:* Focus on the computational/communicative cost of establishing common knowledge vs. the "good enough" mutual knowledge we actually have.
          *   *Follow-up:* If she says "approximate common knowledge is enough," ask where the threshold lies for "rational" disagreement.

      *   *Requirement 3: Asymmetric Rationality (The "I'm right, you're biased" problem).*
          *   *Draft 1:* Can I think you are less rational than me?
          *   *Critique:* Needs to avoid the self-serving bias trap.
          *   *Refinement:* Frame it as a "symmetry breaker." If I assign you lower rationality weight, does AAT dissolve?
          *   *Follow-up:* If she says "No, you must treat them as equals," ask how to distinguish humility from self-deception.

      *   *Requirement 4: Honesty vs. Rationality.*
          *   *Idea:* She mentions dishonesty. How do we tell the difference?
          *   *Refinement:* Incentive structures. If disagreement persists, is it a cognitive failure or a game-theoretic one?
          *   *Follow-up:* If she says "Assume honesty first," ask about polarized environments where dishonesty is rewarded.

      *   *Requirement 5: The "Agreeing to Disagree" in Practice.*
          *   *Idea:* What should we *do* when we disagree?
          *   *Refinement:* Action-guiding norms. Should we update fully, partially, or suspend judgment?
          *   *Follow-up:* If she says "Update fully," ask about the risk of shared error (groupthink).

      *   *Requirement 6: Logical Omniscience/Computational Limits.*
          *   *Idea:* The theorem assumes we know all logical consequences. We don't.
          *   *Refinement:* Bounded rationality. Does AAT apply to bounded agents?
          *   *Follow-up:* If she says "It's an ideal limit," ask if it's a useful limit for non-ideal agents.

      *   *Requirement 7: The Definition of "Information".*
          *   *Idea:* What counts as swapping posteriors?
          *   *Refinement:* Private evidence vs. public signals. Can I hold back evidence and still claim I swapped posteriors?
          *   *Follow-up:* If she says "Full disclosure is required," ask about privacy/strategic concerns.

      *   *Requirement 8: Normative Force.*
          *   *Idea:* Why should we care?
          *   *Refinement:* Is AAT a description of truth or a regulation of discourse?
          *   *Follow-up:* If regulation, who enforces it?

      *   *Requirement 9: Empirical Counterexamples.*
          *   *Idea:* Experts disagree all the time.
          *   *Refinement:* Specific fields (e.g., macroeconomics, nutrition). Are they all irrational?
          *   *Follow-up:* If she says "Yes," ask if that invalidates the field or the theorem.

      *   *Requirement 10: The "Hardline" Social Cost.*
          *   *Idea:* Does this view kill debate?
          *   *Refinement:* If disagreement = irrationality, does it encourage dogmatism?
          *   *Follow-up:* If she says "No, it encourages convergence," ask about premature convergence.

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific topics covered? Yes. Follow-ups included? Yes. Tone appropriate? Yes.
      *   *Self-Correction on Follow-ups:* Make sure the follow-ups anticipate the *standard* defense a hardliner would give (e.g., "It's a normative ideal," "Approximations work," "True rationality is rare").
      *   *Polishing:* Ensure the phrasing sounds like an interviewer speaking to a peer/expert, not a student asking a professor. Use terms like "partition structure," "Harsanyi doctrine," "bounded rationality."

  5.  **Final Polish:** (Drafting the actual response based on the above thought process). *Ensure the distinction between Common Knowledge (infinite depth) and Mutual Knowledge (finite) is clear in Q2.* *Ensure the "private suspicion of irrationality" in Q3 doesn't sound like a loophole but a genuine epistemic tension.*

  6.  **Final Count Check:** I need 8-10. I have brainstormed 10. I will select the strongest 8-10 and ensure the three mandatory topics are prominent. (I will aim for 10 to give the user options, ensuring the 3 mandatory ones are clearly marked or integrated naturally). *Decision: I will provide exactly 10 to maximize value, ensuring the 3 specific constraints are highlighted.*

