answer: |-
  Good morning. It is a privilege to welcome you all to this workshop, and a particular solemnity attaches to today. We gather to mark one hundred years since the death of Gottlob Frege. For some of you in the room, Frege is the grandfather of analytic philosophy, the architect of quantification theory, the man who gave us *Sinn* and *Bedeutung*. For others, particularly our historians, Frege is also a complex, fractured figure whose life ended in shadow.

  I want to begin by addressing that shadow directly. We cannot spend the day discussing the foundations of arithmetic without acknowledging the foundation upon which the man himself stood in his final years.

  For our graduate students, who know Frege primarily through the *Begriffsschrift* and the *Grundgesetze*, there is a biographical fact you need to know. In the spring of 1924, shortly before his death, Frege kept a political diary. It was discovered only in 1969. Its contents are harrowing. They reveal a man embittered by the loss of the First World War, hostile to democracy, and deeply anti-Semitic. For the historians here, you recall Michael Dummett's reaction upon reading it: a profound dismay, a sense of betrayal. Dummett, who did more than anyone to restore Frege to his rightful place in the canon, found himself defending a logic whose author seemed to reject the very universality of reason that logic presupposes.

  It is tempting, when facing this dissonance, to choose one of two easy paths. The first is to sever the philosophy from the man entirely—to treat the diary as a private pathology irrelevant to the public validity of the logic. The second is to allow the morality of the author to contaminate the arguments, to suspect that a logic born of such a mind must itself be tainted.

  I want to suggest a third position, one that I hope will guide our discussions today. We should not ignore the diary, but neither should we let it invalidate the *Grundgesetze*. Instead, we should read the diary as the tragic counterpoint to Frege's Platonism.

  Consider Frege's central insistence: that thoughts (*Gedanken*) inhabit a "third realm." They are not mental images; they are not psychological events inside your head or mine. They are objective, timeless, and independent of whoever happens to grasp them. Why was Frege so insistent on this? Why was he so hostile to psychologism?

  Looking at the diary, we see a mind consumed by the volatility of history, by resentment, by the subjective turbulence of a changing world. Frege's philosophy of logic can be seen as a desperate, rigorous attempt to secure a realm of truth that is immune to exactly the kind of instability exhibited in those diary entries. He posited a realm of objective sense precisely because he knew—or perhaps feared—how unreliable the subjective human mind could be.

  The irony, of course, is painful. The man who sought to purify thought of all psychological contamination could not purify his own psyche of the prejudices of his time. But this does not refute logicism. Rather, it vindicates Frege's distinction between the act of thinking and the content of thought. The truth of the proposition that the number of Fs is the extension of the concept *equal to F* does not depend on the moral character of the person who proves it. If it did, we would have no logic at all; we would only have biography.

  So, where does this leave us for the next eight hours? It leaves us with a responsibility. We are not here to celebrate Frege the man. We are here to interrogate Frege the logician. The diary reminds us that the "objective realm" of thoughts is not a gift we are given, but a discipline we must maintain. It requires us to separate the validity of an argument from the identity of the arguer.

  For the historians, I ask that you allow the technical work to take center stage today. The philosophy deserves to be tested on its own merits, not merely as a symptom of a life. For the students, I ask that you do not treat the logic as abstract magic. Remember that these systems were built by a human being, capable of great insight and great failing. The "third realm" is not a shelter from ethics; it is a demand for rigor that we must apply to ourselves as much as to our proofs.

  Frege wanted to show that arithmetic is logic, and that logic is the law of truth. That project remains unfinished, and it remains vital. The diary tells us that Frege failed to live up to the universality of reason. Our task today is to see if we can succeed where he stumbled, by engaging with the arguments themselves, rigorously and critically.

  We have a demanding schedule ahead of us, covering sense, reference, and the paradoxes that brought the *Grundgesetze* to its knees. Let us proceed with the seriousness the occasion demands, and the intellectual charity the philosophy deserves.

  Thank you, and let us begin.
