          *   Avoid reducing it to a tactful aside.
          *   Avoid letting it hijack the technical focus of the day.
          *   **Crucial:** Stake out a *genuine position* on whether the diary bears on assessing his logicism and his Platonism (objective realm of thoughts).
          *   Leave the room ready for technical talks (sense, reference, arithmetic).
      *   **Length:** About 5 minutes (roughly 750-900 words spoken at a moderate pace).

  2.  **Determine the "Genuine Position":**
      *   *Option A (Separation):* The diary is irrelevant to the logic. (Too dismissive, ignores the "human" element the prompt asks to acknowledge).
      *   *Option B (Contamination):* The politics invalidate the philosophy. (Too radical, disrupts the technical focus).
      *   *Option C (Tension/Tragedy):* The diary reveals a tragic fracture between the man and the system. The philosophy *aims* at objectivity precisely because the subjective world (including the author's own psyche) is unreliable. This allows us to acknowledge the diary without letting it destroy the logic.
      *   *Selection:* Option C is the most nuanced. It acknowledges the horror of the diary (anti-Semitism, reactionary politics) but frames the philosophy of objective thoughts as a *response* to the chaos of the subjective/historical world, rather than being invalidated by it. It respects both the historians' knowledge and the students' focus on technical work.

  3.  **Drafting - Section by Section:**

      *   **Introduction (1 min):** Welcome everyone, acknowledge the centenary, acknowledge the split audience. Set the tone (solemn but productive).
      *   **The Elephant in the Room (1.5 mins):** Address the diary. Briefly explain what it is (1924, political, reactionary, anti-Semitic) for the students. Acknowledge Dummett's dismay for the historians. Don't sugarcoat it.
      *   **The Philosophical Stake (1.5 mins):** This is the core argument. Does this ruin the *Grundgesetze*? No. Does it matter? Yes. Argue that Frege's Platonism (Third Realm) is an attempt to secure truth against the very volatility of human psychology and history that the diary exhibits. The philosophy is a fortress built against the kind of thinking found in the diary.
      *   **Conclusion/Transition (1 min):** Bring it back to the workshop's purpose. We study the logic not to worship the man, but to engage with the arguments. Invite everyone to the first talk.

  4.  **Drafting - Tone and Style:**
      *   *Tone:* Scholarly, reflective, respectful, firm.
      *   *Style:* Oral delivery (rhetorical questions, clear signposting).
      *   *Constraints:* Keep it tight. Don't get bogged down in biographical details beyond the diary.

  5.  **Refining the Argument (Self-Correction during drafting):**
