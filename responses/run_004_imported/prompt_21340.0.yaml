      *   **The Core Issue:** This is "Optional Stopping" or "Peeking" (p-hacking).
      *   **Why it's wrong:** P-values assume a fixed sample size determined *a priori*. Checking repeatedly inflates the Type I error rate (false positives). If you check every day, the actual false positive rate isn't 5%; it can be much higher (20-50% depending on frequency).
      *   **The Phenomenon:** "Significance at interim analysis" often regresses to the mean as sample size increases (the "winner's curse" or early volatility).
      *   **Conclusion:** The manager is statistically incorrect. The user is *not* overthinking this.

