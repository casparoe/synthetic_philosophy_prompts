      *   **Approach:** Curiosity, collaboration, data-driven evidence, framing it as risk mitigation rather than "you're wrong."

  4.  **Drafting the Advice:**

      *   **Validation:** First, confirm the user's intuition. They are right. This is a classic statistical error.
