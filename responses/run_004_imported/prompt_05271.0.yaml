prompt: |-
  Quick thing I've been chewing on for a seminar on reasons. The wrong kind of reasons (WKR) problem usually gets raised against fitting-attitude theories of value -- the demon who'll torture you unless you admire some worthless object, so now you have a reason to admire it that has nothing to do with whether its actually admirable. It occured to me that this is basically the same structure as the old evidentialist vs pragmatist fight over belief -- Pascal's wager gives you a reason to believe in God that's totally disconnected from whether God exists. Are these really the same problem wearing different clothes, or am I forcing an analogy that doesn't hold? Compare the two for me -- does the usual move for separating right from wrong kind reasons in the value case (the object-given/state-given distinction, Parfit's right?) carry over cleanly to reasons for belief, or does it break down somewhere? And which version of the problem strikes you as harder to solve, and why?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**
      *   **Topic:** The "Wrong Kind of Reasons" (WKR) problem.
      *   **Context:** Comparing the WKR problem in fitting-attitude (FA) theories of value with the evidentialist vs. pragmatist debate over belief (specifically Pascal's Wager).
      *   **Core Question:** Are these the same problem? Does the standard solution in the value case (object-given vs. state-given reasons, associated with Parfit) work for belief? Which problem is harder to solve and why?
      *   **Tone:** Academic but conversational ("Quick thing I've been chewing on," "wearing different clothes"). Needs to be precise but accessible for a seminar context.

  2.  **Deconstruct the Two Cases:**
      *   **Case 1: Fitting-Attitude (FA) Theories of Value.**
          *   *Thesis:* $X$ is good iff it is fitting to favor $X$.
          *   *WKR:* The Demon Case. Demon threatens torture unless you admire a saucer of mud.
          *   *Result:* You have a reason to admire the mud (prudential), but the mud isn't good. The reason is the "wrong kind" to constitute value.
          *   *Standard Solution:* Object-Given Reasons (OGR) vs. State-Given Reasons (SGR). OGRs cite properties of the object (mud is muddy). SGRs cite properties of the state of having the attitude (admiring saves your life). FA theories claim value is constituted only by OGRs.

      *   **Case 2: Reasons for Belief (Epistemology).**
          *   *Thesis:* Evidentialism (You ought to believe $p$ iff you have evidence for $p$).
          *   *WKR:* Pascal's Wager / Pragmatic Encroachment. Believing in God yields infinite reward.
          *   *Result:* You have a reason to believe (prudential), but it doesn't make the belief justified/true-conducive.
          *   *Parallel:* Pragmatic reasons seem to be the "wrong kind" of reasons for *justification*, though maybe not for *rationality* (depending on the theory).

  3.  **Evaluate the Analogy (Are they the same?):**
      *   *Similarities:* Both involve a normative status (Value/Goodness vs. Justification/Correctness of Belief). Both involve a threat/reward external to the content of the attitude. Both distinguish between reasons that bear on the *content* vs. reasons that bear on the *benefits of holding the attitude*.
      *   *Differences:* Belief has a "truth aim" (constitutive aim) that admiration doesn't necessarily have in the same way. Belief is often thought to be involuntary (doxastic involuntarism), whereas emotions/valuations might be more susceptible to direct cultivation. The normativity of belief is often tied to knowledge/truth, whereas value is tied to fittingness.

  4.  **Analyze the Solution Transfer (OGR/SGR):**
      *   *In Value:* Parfit's distinction works reasonably well. Reasons citing properties of the mud are OGRs. Reasons citing the consequences of admiring are SGRs. FA theorists say only OGRs count for *goodness*.
      *   *In Belief:*
          *   OGR: Evidence that $p$ is true (cites content of belief).
          *   SGR: Believing $p$ makes you happy/saves you (cites state of believing).
          *   *Does it hold?* Yes, structurally. Evidentialists say only OGRs count for *justification*.
          *   *Where it breaks down:* The "Teleological" objection. Belief *aims at truth*. If you believe for pragmatic reasons, are you really believing? Some argue pragmatic reasons can't be reasons for *belief* at all, only for *causing oneself to believe*. In the value case, you *can* admire the mud (maybe), it's just not *good*. In the belief case, can you even believe at will based on pragmatic reasons? (Pascal himself thought you had to cultivate the belief via habit, not direct will).
          *   *The "Wrong Kind of Reason" vs. "No Reason" debate:* In epistemology, some pragmatists argue pragmatic reasons *are* genuine reasons for belief (Pragmatic Encroachment), whereas in FA theory, almost everyone agrees the demon's threat doesn't make the mud *good*. So the stakes of the solution differ.

  5.  **Determine Which is Harder:**
      *   *Value Case:* The "Extension Problem." It's hard to define OGR/SGR without circularity (i.e., "OGRs are the ones that make things good"). There are tricky cases (e.g., admiring a person because they are admirable vs. admiring them because admiring them makes them like you).
      *   *Belief Case:* The "Nature of Belief" problem. If belief constitutively aims at truth, pragmatic reasons might be conceptually excluded, not just normatively excluded. This makes the WKR problem in epistemology potentially deeper (metaphysical/conceptual) rather than just normative. However, the rise of "Pragmatic Encroachment" (Stanley, Fantl & McGrath) suggests the line is blurrier in epistemology than in value theory.
      *   *Verdict:* The belief case is arguably harder because of Doxastic Voluntarism and the Truth Aim. If you can't believe at will, pragmatic reasons can't directly motivate belief. But if you accept encroachment, the distinction collapses. In value theory, the distinction between *good* and *reason to favor* is more robustly accepted.

  6.  **Drafting the Response:**
      *   *Introduction:* Validate the intuition. Yes, it's a strong analogy, widely recognized in literature (e.g., Schroeder, Parfit, Hieronymi).
      *   *Structural Comparison:* Map the Demon Case to Pascal's Wager.
          *   Attitude: Admiration vs. Belief.
          *   Norm: Goodness vs. Justification/Correctness.
          *   Interfering Reason: Threat/Reward (State-Given).
      *   *The Parfit Solution (OGR/SGR):* Explain it in value, then apply to belief.
          *   Value: OGR = properties of object. SGR = properties of state.
          *   Belief: OGR = Evidence. SGR = Pragmatic benefit.
      *   *Where it Breaks Down (Crucial Section):*
          1.  *The Aim of Belief:* Belief aims at truth. Admiration aims at... fittingness? Truth is more restrictive.
          2.  *Voluntarism:* Can you believe for a reason? (Hieronymi's point). You can't just decide to believe. You can maybe decide to admire.
          3.  *Circularity:* Defining OGRs often smuggles in the normative notion you're trying to analyze.
      *   *Which is Harder?* Argue for the Belief case (Epistemology). Why? Because the "truth aim" makes pragmatic reasons look like *no reasons at all* for belief, whereas in value, they are reasons but the *wrong kind*. Also, Pragmatic Encroachment makes the epistemological landscape messier.
      *   *Conclusion:* Summarize. It's a fruitful analogy but the metaphysics of belief adds friction.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I mention Parfit? Yes.
      *   *Check:* Did I mention Hieronymi? She's crucial for the belief side (reasons vs. influences).
      *   *Check:* Is the distinction between "reasons for belief" and "reasons to induce belief" clear? This is key for the Pascal case.
      *   *Nuance:* In FA theory, the WKR problem threatens the *analysis* of value. In epistemology, it threatens the *normativity* of belief (Evidentialism). Make sure to distinguish the theoretical stakes.

  8.  **Final Polish:** Ensure tone is appropriate for a seminar discussion (collegial, analytical). (Proceed to generate output based on these thoughts.)
answer: |-
  This is a sharp observation, and you are definitely not forcing an analogy that doesn't hold. In fact, this parallel is a staple of contemporary meta-normative theory. Philosophers like Mark Schroeder, Derek Parfit, and Pamela Hieronymi have all explicitly linked the WKR problem in fitting-attitude (FA) accounts of value with the evidentialist/pragmatist debate in epistemology.

  However, while the **structure** is identical, the **metaphysical constraints** differ in ways that make the solution transfer imperfectly. Here is a breakdown of how they compare, where the Parfitian solution (Object-Given vs. State-Given) strains, and which problem is arguably the tougher nut to crack.

  ### 1. The Structural Isomorphism
  You are right that the logic is the same. Both cases involve a normative status that is supposed to be constituted by reasons for a certain attitude, threatened by pragmatic reasons.

  *   **FA Theory of Value:**
      *   **Attitude:** Admiration/Favoring.
      *   **Normative Status:** Goodness (X is good iff it is fitting to favor X).
      *   **WKR Case:** The Demon threatens torture unless you admire a saucer of mud.
      *   **Problem:** You have a decisive reason to admire the mud, but the mud is not good. If reasons constitute goodness, the mud should be good.
  *   **Evidentialism about Belief:**
      *   **Attitude:** Belief.
      *   **Normative Status:** Justification/Correctness (Belief that $p$ is justified iff supported by evidence).
      *   **WKR Case:** Pascal's Wager (Believe in God or suffer infinite loss/gain infinite reward).
      *   **Problem:** You have a decisive reason to believe in God, but the belief is not epistemically justified. If reasons constitute justification, the belief should be justified.

  In both cases, we want to say: "Sure, you have a reason to hold the attitude, but that reason doesn't make the attitude *correct* (or the object *good*)."

  ### 2. Does the Parfitian Solution (OGR/SGR) Carry Over?
  Parfit's standard move is to distinguish **Object-Given Reasons (OGRs)** from **State-Given Reasons (SGRs)**.
  *   **OGRs:** Cite properties of the *object* of the attitude (The mud is muddy; The proposition is true).
  *   **SGRs:** Cite properties of the *state* of having the attitude (Admiring saves your life; Believing makes you happy).

  FA theorists and Evidentialists both argue that only OGRs count toward the normative status in question (Goodness/Justification).

  **Where it works:**
  It works cleanly at a high level of abstraction. In both fields, we want to filter out pragmatic benefits to isolate the specific normative property (value or truth-conductiveness).

  **Where it breaks down:**
  The distinction faces a "Extension Problem" in both fields, but it is more severe in the belief case.

  1.  **The Circularity Objection:** In the value case, critics argue that defining OGRs often smuggles in the notion of "fittingness." (i.e., "An OGR is a reason that makes the object good." "But what makes the object good?" "OGRs."). In the belief case, this is slightly less vicious because we have an independent handle on OGRs: *evidence*. Evidence is truth-conducive. We don't need to define evidence as "that which justifies"; we can define it probabilistically. So, the OGR/SGR distinction is actually *more* stable in epistemology than in value theory.
  2.  **The "Reasons for Belief" Objection (Hieronymi):** This is where the analogy fractures. Pamela Hieronymi argues that pragmatic considerations (SGRs) cannot be reasons *for belief* at all; they can only be reasons *to bring it about that you believe*.
      *   In the **Value Case**, you can arguably admire the mud *for the sake of* saving your life. The reason operates on the attitude directly.
      *   In the **Belief Case**, belief is often thought to be "truth-aimed" constitutively. To believe $p$ is to take $p$ to be true. If you believe $p$ because it pays off, you aren't responding to the truth of $p$. Therefore, pragmatic reasons aren't the *wrong kind* of reasons for belief; they are *no kind* of reasons for belief. They are reasons for action (the action of cultivating belief).
      *   If this is true, the WKR problem in epistemology dissolves into a problem about **Doxastic Voluntarism**. In the value case, we generally assume we have some control over our admirations/emotions, so the WKR remains a normative problem, not a metaphysical one.

  ### 3. Which Problem is Harder to Solve?
  I would argue the **Epistemological (Belief) version is harder**, for two specific reasons.

  **A. Pragmatic Encroachment**
  In value theory, there is very little resistance to the claim that the Demon's threat doesn't make the mud good. Almost everyone agrees the WKR doesn't constitute value.
  In epistemology, however, **Pragmatic Encroachment** (defended by Jeremy Stanley, Fantl & McGrath) is a live and popular theory. They argue that pragmatic stakes *do* affect whether you know or are justified. (e.g., If the stakes are high enough, you need more evidence to be justified).
  If Encroachment is true, the OGR/SGR distinction collapses for justification. You can't cleanly separate the "right kind" (evidence) from the "wrong kind" (stakes) because the "wrong kind" changes the threshold for the "right kind." This makes the WKR problem in epistemology much messier because there is significant philosophical disagreement on whether it's a problem at all.

  **B. The Transparency of Belief**
  Belief has a feature admiration does not: **Transparency.** When I ask myself, "Do I believe $p$?", I immediately ask, "Is $p$ true?" I cannot simultaneously attend to the truth of $p$ and the benefits of believing $p$ while forming the belief.
  This makes the WKR problem in belief a problem about **psychological possibility**, not just normative classification.
  *   **Value:** I can know the mud is worthless and the demon is real, and still feel admiration (perhaps through effort). The reason is the wrong kind, but it can still motivate the attitude.
  *   **Belief:** I cannot know $p$ is unsupported and believe $p$ because it is useful. That looks like self-deception, not belief.
  This suggests that in the belief case, the "solution" to the WKR problem might be that such reasons are psychologically inert regarding belief formation. That is a harder constraint to work with than the normative filtering required in the value case.

  ### Summary for your Seminar
  *   **The Analogy:** It holds up structurally. Both involve distinguishing reasons that bear on the *content* of an attitude from reasons that bear on the *consequences* of holding it.
  *   **The Transfer:** The OGR/SGR distinction transfers, but it is more stable in epistemology (due to evidence) than in value theory (due to circularity risks).
  *   **The Divergence:** The belief case is complicated by the "aim of belief" (truth) and doxastic involuntarism. Pragmatic reasons might be *excluded* from belief entirely, whereas they are merely *excluded from constituting value* in the FA case.
  *   **The Verdict:** The epistemological version is harder because of **Pragmatic Encroachment**. In value theory, the consensus is that WKRs don't create value. In epistemology, there is a serious camp arguing that pragmatic reasons *do* impact justification, which threatens to dissolve the distinction entirely.

  If you want to spark a fight in the seminar, ask whether the "Demon Case" works if the Demon threatens to torture you unless you believe a mathematical truth you haven't checked yet. Does the threat give you a reason to *believe*, or just a reason to *check*? That highlights the voluntarism friction perfectly.
