prompt: |-
  In three weeks I'm marrying into a Jain family, and my future father-in-law — a retired professor who spent his career on Jain epistemology — has asked me to give the reception toast. He has already warned me, kindly, against the one move he says every non-Jain speaker makes at these events: reaching for the blind-men-and-the-elephant story and stopping exactly where it becomes comfortable — "so every viewpoint is equally true" — rather than following it through to what anekantavada actually claims, namely that each viewpoint is a partial standpoint (naya), true only conditionally and "in some respect" (syadvada), and that treating any single one as the unconditioned whole truth is exactly the one-sided dogmatism (ekantavada) the doctrine exists to block. I've done enough reading these past weeks to see that he's right that this isn't the same thing as relativism, but I don't trust myself to turn that distinction into five minutes of prose that also has to land with my side of the family, who have never encountered any of these terms. Could you write that toast: one in which anekantavada does real work in framing how two families and their different convictions are being joined, precise enough to satisfy my father-in-law and warm enough to survive being read aloud at a wedding?
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Wedding reception toast.
      *   **Speaker:** Groom/Bride (non-Jain) marrying into a Jain family.
      *   **Audience:** Mixed (Jain family + Non-Jain family/friends).
      *   **Key Constraint:** Must address Jain philosophy (*anekantavada*) correctly, specifically avoiding the common pitfall of reducing it to simple relativism ("all views are equally true").
      *   **Specific Guidance:** The father-in-law (retired professor of Jain epistemology) has explicitly warned against the "blind men and the elephant" cliché if it stops at "everyone is right." It needs to go deeper: partial standpoints (*naya*), conditional truth (*syadvada*), and avoiding dogmatism (*ekantavada*).
      *   **Tone:** Precise enough for the FIL, warm/accessible enough for the non-Jain guests, emotional enough for a wedding.
      *   **Length:** Approx. 5 minutes spoken (roughly 600-800 words).

  2.  **Deconstruct the Philosophy (for accuracy):**
      *   *Anekantavada:* Many-sidedness of reality.
      *   *The Trap:* "Everything is true" (Relativism).
      *   *The Truth:* "Everything is *partially* true from a specific perspective, context, and time."
      *   *Naya:* Partial standpoint.
      *   *Syadvada:* The theory of conditioned predication ("in some respect," "maybe," "perhaps").
      *   *Ekantavada:* One-sided dogmatism (the enemy).
      *   *Application to Marriage:* Two families, two histories, two ways of seeing the world. Neither is the "whole elephant." The marriage isn't about one absorbing the other, nor about pretending differences don't exist. It's about holding the tension of multiple truths to create a larger picture.

  3.  **Determine the Structure of the Toast:**
      *   **Opening:** Welcome, gratitude, acknowledgment of the unique pressure (the FIL's warning).
      *   **The Hook:** The "Blind Men and the Elephant" story (acknowledge it, then pivot).
      *   **The Philosophical Core:** Explain *anekantavada* simply but accurately (partial truths, not equal truths). Connect it to *syadvada* (conditionality).
      *   **The Application:** Connect the philosophy to the two families and the couple.
      *   **The Promise:** How this philosophy guides the marriage.
      *   **Closing:** Toast to the future.

  4.  **Drafting - Section by Section:**

      *   *Opening:* Start with love and thanks. Acknowledge the FIL directly but playfully. He's a professor; I'm the student.
      *   *The Elephant:* I have to mention it because the FIL warned me *not* to mess it up. So, I'll name the warning. "Professor [Name] warned me..." This shows respect and homework done.
      *   *The Distinction:* How to explain *naya* and *syadvada* without jargon? Use "lens" or "angle." Instead of "All views are true," say "All views are *incomplete*." The key is humility.
      *   *The Family Connection:* My family does X, Your family does Y. Neither is the absolute truth. Marriage isn't erasing differences; it's acknowledging them as valid parts of a whole.
      *   *The Couple:* [Partner's Name] and I. We will disagree. But we won't claim absolute rightness. We will use "in some respect."
      *   *The Climax:* This isn't just tolerance; it's active listening to build a bigger reality.
      *   *The Toast:* Raise glasses.

  5.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Add emotional beats. Talk about the food, the laughter, the specific feeling of being welcomed.
      *   *Critique:* Is it accurate enough for the FIL?
      *   *Fix:* Ensure I explicitly mention that treating a part as the whole is *ekantavada* (dogmatism). Use the term *syadvada* (maybe/in some respect) gently.
      *   *Critique:* Is it warm for the non-Jains?
      *   *Fix:* Explain the concepts through the metaphor of the wedding itself. The "whole elephant" is the marriage/future.

  6.  **Drafting the Content (Mental or Scratchpad):**
      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm giving a lecture. The philosophy must serve the emotion. The core emotion is: "We are different, and that makes us stronger, not weaker, provided we stay humble."
      *   *Key Phrase:* "Not that every opinion is equally true, but that every opinion is partially true."
      *   *Key Phrase:* "The danger isn't being wrong; the danger is being certain."

  7.  **Final Polish:**
      *   Check timing. (Word count looks good for 5 mins).
      *   Check placeholders (Names).
      *   Ensure the transition from philosophy to love is smooth.

  8.  **Final Review against constraints:**
      *   Did I avoid the relativism trap? Yes, emphasized *partial* truth.
      *   Did I mention *naya/syadvada/ekantavada*? Yes, but woven in naturally.
      *   Is it warm? Yes, focuses on unity through diversity.
      *   Is it respectful to the FIL? Yes, acknowledges his guidance.

  **(Self-Correction Note):** Make sure not to overuse the Sanskrit terms. Use them as seasoning, not the main course. The FIL will hear them; the guests will hear the meaning.

  9.  **Final Output Generation** (Proceeding to write the toast based on these thoughts).
answer: |-
  Good evening, everyone.

  For those of you who don't know me, I'm [Your Name]. For those of you who do know me, you know that I am currently living in a state of happy panic. Standing up here is nerve-wracking enough, but there is an added layer of pressure tonight.

  My future father-in-law, [Father-in-Law's Name], is a man I admire deeply. He spent his career studying Jain epistemology. A few weeks ago, he kindly pulled me aside and gave me a piece of advice regarding this toast. He said, "Please, do not tell the story of the blind men and the elephant unless you intend to finish it correctly."

  He warned me that the usual version of that story ends with a comfortable lie: that every viewpoint is equally true. He told me that is not what *anekantavada* means. It doesn't mean "anything goes." It means that reality is complex, and any single statement we make about it is only a *naya*—a partial standpoint. It is true only conditionally, *syadvada*—"in some respect." To treat your own perspective as the unconditioned, whole truth is *ekantavada*: one-sided dogmatism. And that is the very thing the doctrine exists to block.

  Now, I am not a philosopher. I am not going to pretend I can do justice to a lifetime of his scholarship in five minutes. But I have been thinking about his warning, and I realize he wasn't just teaching me about ancient logic. He was teaching me about marriage.

  When two families come together, especially families as distinct and wonderful as ours, it is tempting to look for the smoothest path. To pretend our differences don't exist. To say, "Oh, we're all the same underneath."

  But *anekantavada* suggests something braver than that. It suggests that we are *not* all the same. My family comes from a tradition of [mention a brief trait, e.g., boisterous debate/secular pragmatism]. [Partner's Name]'s family comes from a tradition of [mention a Jain trait, e.g., deep ritual mindfulness/non-violence].

  If I claimed my way was the only way, that would be dogmatism. If [Partner's Name] claimed their way was the only way, that would be dogmatism. But if we simply say, "All ways are equal," we erase the beauty of what makes each tradition distinct.

  Instead, this philosophy invites us to say: "My truth is real, but it is partial. Your truth is real, but it is also partial. And if we hold them together, with humility, we get a picture that is closer to the whole elephant."

  This is the work I promise to do in this marriage. I promise that when [Partner's Name] and I disagree—and we will—I will not mistake my perspective for the absolute reality. I will remember the *syad*: the "in some respect." I will listen not just to tolerate [Partner's Name]'s view, but because I need it to complete my own.

  To my new parents: Thank you for welcoming me not by asking me to become Jain, but by inviting me to understand how you see the world. You have taught me that non-violence isn't just about what you don't hit; it's about how you don't speak. It is refusing to crush another's perspective with the weight of your own certainty.

  To my own parents: Thank you for raising me to value truth, and for trusting me to find it in a new context.

  And to [Partner's Name]: You are the place where these lines intersect. You are the reminder that love is not about finding someone who sees the world exactly as you do. It is about finding someone whose partial truth complements yours, so that together, you can navigate the complexity of life without falling into the trap of thinking you have all the answers.

  We are not merging into one monolith tonight. We are weaving a tapestry. We are acknowledging that the whole is larger than the sum of our standpoints.

  So, if everyone could please raise a glass.

  To [Father-in-Law's Name], for the lesson that certainty is the enemy of connection.
  To our families, for providing the different sides of the elephant.
  And to [Partner's Name]: May our life together be defined not by who is right, but by how widely we can see.

  To the whole picture. Cheers.
