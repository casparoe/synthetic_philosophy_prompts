answer: |-
  For those of you who don't know Priya: she is the reason half the people in this room say "common knowledge" when they mean "everyone knows." For those of you who do know Priya: you know she wrote her dissertation on David Lewis's *Convention*, and she has spent fifteen years arguing that our friend group's habits—from who hosts dinner to how we split the bill—are not just customs, but coordination equilibria in the strict Lewisian sense.

  So, naturally, she asked me to talk about her marriage using Lewis's apparatus.

  For the uninitiated, Lewis defines a convention as a regularity in behavior that is common knowledge, self-enforcing, and—crucially—arbitrary. There must have been other options that could have worked just as well. And looking at this weekend, the arbitrariness is visible. We have two ceremonies. We have the *saptapadi* and the vows. We have a mehndi and a rehearsal dinner. Neither tradition had salience over the other; neither family's precedent offered a clear focal point. So, Priya and Daniel did what Lewis says rational agents do: they constructed a new salience. They stitched together a new equilibrium from scratch.

  Now, I know the objection. Priya has fielded it at parties for a decade. If marriage is a convention, and conventions are arbitrary, does that mean Daniel is interchangeable? Could it have been anyone else at the altar?

  If you stop at Lewis's definition, it sounds cold. But Lewis also tells us that once a coordination equilibrium is selected, it becomes stable. The arbitrariness lies in the *selection*, not the *commitment*. You don't switch equilibria just because another one was theoretically possible. The cost of coordination failure is too high.

  But I think Brian Skyrms takes us the rest of the way. Skyrms showed us that conventions don't require explicit negotiation; they evolve through signaling and trust over time. Priya and Daniel didn't sit down and reason out a contract. They built a signaling system over years of shared history. They proved reliability when the payoffs were uncertain. That isn't arbitrary. That is path-dependent.

  So, to the twelve of you checking my conditions: yes, the form is conventional. But to the rest of the room: the stability is real.

  Priya and Daniel, you have solved the coordination problem. You have established common knowledge. And you have created a focal point that the rest of us are honored to orbit.

  Please raise your glasses. To the new equilibrium. To Priya and Daniel.
