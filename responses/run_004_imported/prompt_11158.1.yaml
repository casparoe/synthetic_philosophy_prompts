answer: |-
  Good evening, everyone. For those who don't know me, I had the privilege of serving as an advisor to both [Partner A] and [Partner B] during their graduate studies.

  Standing here, I am acutely aware of the demographic split in this room. On one side, we have family and friends who are here to celebrate a union. On the other, we have a few academics, including [Partner A], who wrote her dissertation on Jean-Paul Sartre. [Partner A], I know you are watching me. I know that if I suggest a past vow can ontologically bind a future freedom, you will roll your eyes so hard you'll see your own dissertation from the inside out.

  So, I am not going to say that.

  I am not going to stand here and tell you that because you said "I do" today, the matter is settled. I am not going to say that tomorrow, or in ten years, you will be *unable* to choose otherwise because a piece of paper or a spoken promise holds you in place. Sartre was right about this: a resolution made yesterday has no causal grip on the hand you hold today. He illustrated this with the gambler who sincerely vows to quit, yet stands before the table feeling the vertigo of realizing that nothing stops him from picking up the cards again. The past self cannot chain the present self.

  If I stopped there, the non-philosophers in the room might think I'm suggesting this marriage is fragile. But I am suggesting exactly the opposite. I am suggesting it is stronger than the conventional story allows.

  The comfortable story we tell at weddings is that the vow removes the burden of choice. We say, "You're married now, so you don't have to worry anymore." Sartre would call that comfort "bad faith." It is pretending to be a statue when you are actually a living thing.

  The harder, more beautiful truth is this: [Partner A] and [Partner B], you are not entering a state of rest. You are entering a lifetime of repeated action.

  The power of your marriage does not lie in a magical lock you clicked into place five minutes ago. The power lies in the fact that tomorrow morning, and the morning after that, you will wake up free. You will be free to be indifferent. You will be free to walk away. You will be free to choose the easy path of solitude. And yet, you will choose each other.

  A vow is not a cage. It is a project. It is a public declaration that you intend to make the same choice, over and over, despite the freedom you have to do otherwise. That is not a lack of freedom; that is the highest use of it.

  To the guests who aren't worried about existential metaphysics: I promise you, this is romantic. There is no romance in being trapped. There is only romance in being free, and staying anyway.

  So, [Partner A] and [Partner B], I do not toast to the security of your past promise. I toast to the courage of your future choices. May you never feel bound by your vows, but may you feel compelled by your love to renew them, authentically and freely, every single day.

  To the couple.
