answer: |-
  This is one of the sharpest questions you can ask about naturalized semantics. You have identified exactly where the rubber meets the road. Many introductory texts gloss over this, leaving the impression that "selection history" magically solves the problem. It does not, and your intuition that the history alone seems compatible with multiple descriptions is shared by some of the best philosophers in the field.

  Here is the step-by-step mechanics of how Millikan attempts to break the tie, followed by why Fodor believes the tie remains unbroken.

  ---

  ### Part 1: Millikan's Mechanics (The Consumer Theory)

  To understand how Millikan breaks the disjunction, you have to stop looking only at the **Producer** (the frog's eye/nerve) and start looking at the **Consumer** (the frog's tongue/brainstem/digestive system).

  For Millikan, a mental representation is like a link in a chain. It has a job to do, but its job is defined by what the *next link in the chain* needs from it.

  #### Step 1: Define the "Normal Function"
  Millikan does not mean "normal" in the statistical sense (what happens most often). She means "Normal" in a normative, biological sense.
  *   **Normal Function:** The specific performance a trait was selected to accomplish in the evolutionary past, which explains why the trait exists today.
  *   **The Criterion:** A trait exists because it successfully performed a specific function often enough to be passed down.

  #### Step 2: Locate the Consumer System
  The "bug detector" neuron (Producer) fires a signal. Who receives that signal? The motor neurons controlling the tongue (Consumer).
  *   The Consumer has its own **Normal Function**: To project the tongue and capture nutritious matter to sustain the frog.
  *   The Consumer is designed to work *only* under specific conditions. It expects the signal from the Producer to indicate that *nutritious matter is within range*.

  #### Step 3: The Success Condition (The Tie-Breaker)
  This is the crux of Millikan's solution. The content of the representation is fixed by the **conditions under which the Consumer successfully performs its function.**

  Let's test your three candidates against the Consumer's success condition:

  1.  **Candidate: "Small Dark Moving Thing"**
      *   *Scenario:* The detector fires at a BB pellet (a small dark moving thing).
      *   *Consumer Action:* The tongue snaps.
      *   *Outcome:* The frog gets no nutrition. The Consumer fails to perform its Normal Function.
      *   *Verdict:* If the content were "Small Dark Moving Thing," the Consumer would be succeeding whenever it snapped at a BB. But biologically, this is a failure. Therefore, the content cannot be broad enough to include BBs.

  2.  **Candidate: "Food" (or "Nutritious Thing")**
      *   *Scenario:* A nutritious moth is sitting perfectly still.
      *   *Detector Action:* The detector does *not* fire (it only detects motion).
      *   *Consumer Action:* The tongue does not snap.
      *   *Outcome:* The frog misses a meal.
      *   *Verdict:* If the content were simply "Food," the system should trigger on *any* food. But the mechanism is visually specific. It misses stationary food. Therefore, the content is constrained by the *specific cues* the Producer detects, not just the general value of the outcome.

  3.  **Candidate: "Fly" (specifically, fly-sized, moving, nutritious prey)**
      *   *Scenario:* The detector fires at a fly.
      *   *Consumer Action:* The tongue snaps.
      *   *Outcome:* The frog gets nutrition. The Consumer performs its Normal Function.
      *   *Verdict:* This is the only description that matches **both** the specific trigger of the Producer (moving dark spot) **and** the success condition of the Consumer (nutrition).

  **Millikan's Conclusion:** The content is "Fly" (or more precisely, "prey of such-and-such visual characteristics") because that is the specific state of affairs that historically allowed the *Consumer* to complete its biological job. When the frog snaps at a BB, it is a **malfunction**. The representation is false because the Consumer's conditions for success were not met.

  ---

  ### Part 2: Fodor's Counter-Punch (The Indeterminacy Remains)

  Jerry Fodor agrees that evolution happened. He agrees that frogs snap at flies. His objection is that Millikan's story presupposes the very thing it is trying to explain. He argues that the "Success Condition" is just as disjunctive as the trigger.

  Here is the mechanical breakdown of Fodor's objection.

  #### Step 1: The "Qua" Problem (In What Capacity?)
  Fodor argues that when natural selection favored the frog's ancestors, it didn't select for "Fly Detection." It selected for *survival*.
  *   In the frog's evolutionary environment (the "Environment of Evolutionary Adaptedness"), the following properties were co-extensive (they always appeared together):
      *   Property A: Being a Fly.
      *   Property B: Being a Small Dark Moving Thing.
      *   Property C: Being Nutritious.
  *   Because A, B, and C always went together in the past, natural selection cannot distinguish between them. Selection tracks causal correlations. The correlation was equally strong for all three.

  Fodor asks: **In virtue of *which* property was the trait selected?**
  *   Millikan says: "In virtue of Property A (Fly), because that satisfies the Consumer."
  *   Fodor says: "How do you know? In the past, snapping at Property B (Dark Moving Thing) *always resulted in* Property A (Fly). So selection could just as easily have been for 'Snapping at Dark Moving Things'."

  #### Step 2: The Circularity of Malfunction
  This is the hardest hitting part of Fodor's critique.
  *   Millikan says: Snapping at a BB is a **malfunction**. Therefore, the content is not "BB" or "Dark Thing."
  *   Fodor replies: You can only call it a malfunction if you *already know* what the content is supposed to be.
      *   If the content is "Fly," snapping at a BB is an error.
      *   If the content is "Small Dark Moving Thing," snapping at a BB is **perfect accuracy**.
  *   **The Trap:** Millikan uses the biological failure (starving/no nutrition) to define the content. But Fodor argues that whether it counts as a "biological failure" depends on how you describe the goal.
      *   If the goal is "Catch Flies," the BB snap is a failure.
      *   If the goal is "Snap at Moving Dark Things," the BB snap is a success (the mechanism did exactly what it was built to do).

  Since the evolutionary history is compatible with *both* goals (because in the past, Dark Things *were* Flies), Millikan has no non-circular way to pick "Catch Flies" as the true goal without already assuming the content is "Fly."

  #### Step 3: The Counterfactual Test
  Fodor pushes this with a counterfactual thought experiment.
  *   Imagine a world where BBs *were* nutritious (maybe they are made of compressed insect meal) and Flies *were* poisonous.
  *   In that world, the frog's mechanism (snapping at dark moving things) would still exist.
  *   Millikan would have to say the content of the representation changed from "Fly" to "BB" (because that's what satisfies the Consumer now).
  *   Fodor finds this absurd. The frog's internal mechanism hasn't changed. The causal law (Dark Thing -> Fire Neuron) hasn't changed. Why should the *meaning* change just because the external nutrition facts changed?
  *   For Fodor, this shows that Teleosemantics makes content too dependent on external consequences rather than the internal causal structure of the mind.

  ---

  ### Part 3: Where the Disagreement Bites

  You asked for a feel for exactly where the disagreement lies. It is not about the biology; it is about **Normativity vs. Causality.**

  **1. Millikan's Stand (Normativity First):**
  Millikan believes biology creates genuine *norms* (rules about what *ought* to happen).
  *   A heart *ought* to pump blood. If it doesn't, it is broken.
  *   Similarly, a representation *ought* to correspond to the condition that allows the organism to survive.
  *   She thinks the "Success Condition" is an objective biological fact. The frog *needs* nutrition. The BB does not provide it. Therefore, the system is objectively in error when it snaps at a BB. The disjunction is broken by the biological reality of starvation.

  **2. Fodor's Stand (Causality First):**
  Fodor believes you cannot get "ought" from "is."
  *   Biology is just causal history. Causes don't have meanings; they just have effects.
  *   The causal history is: "Dark Moving Thing caused Neuron to Fire."
  *   The fact that this *usually* led to nutrition is a separate causal fact.
  *   He argues Millikan is smuggling in an interpretation. She is *interpreting* the history as "Selection for Flies" rather than "Selection for Dark-Thing-Snapping." Because the history underdetermines the description, the content remains indeterminate.

  ### Summary for your intuition

  *   **Millikan says:** Look at the whole system (Detector + Tongue + Stomach). The system only works (biologically) if the object is a Fly. Therefore, the state represents Fly. BBs break the system; therefore, they are not part of the content.
  *   **Fodor says:** You are defining "Works" by assuming the content is Fly. If you define "Works" as "Fires at Dark Things," the system works perfectly on BBs. Evolution doesn't tell us which definition of "Works" is the right one, because in the past, they were the same thing.

  **The Stalemate:**
  Millikan bets that biological function is robust enough to select one description over another (the "Nutrition" description wins). Fodor bets that causal history is too loose to ever pin down a single semantic description (the "Correlation" description remains ambiguous).

  If you feel Millikan's solution relies on a slight of hand—switching from "what caused the firing" to "what caused the survival"—you are in good company. That is precisely Fodor's point. If you feel that biological failure (starving) is a hard, objective fact that settles the matter regardless of description, you are leaning toward Millikan.
