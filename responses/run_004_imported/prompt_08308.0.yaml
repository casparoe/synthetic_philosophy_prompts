answer: |-
  The no-trade theorems present one of the most embarrassing gaps in financial economics. On one side, we have a rigorous logical proof (Milgrom & Stokey, 1982) stating that speculative trade between rational agents with a common prior is impossible. On the other, we have daily global turnover in foreign exchange alone exceeding $7 trillion, mostly speculative.

  To bridge this gap, the standard textbook response is to reach for liquidity shocks, hedging needs, or bounded rationality. While these factors exist, they are insufficient to explain the *magnitude* and *persistence* of speculative volume. The most theoretically honest and empirically robust explanation is the failure of the **Common Prior Assumption (CPA)**.

  Here is the argument for why heterogeneous priors are the primary driver of market volume, and why the alternative explanations fail to clear the bar.

  ### 1. The Quantitative Failure of Liquidity and Hedging
  The most common escape hatch from the no-trade theorem is to posit "non-informational" motives: agents trade to rebalance portfolios, hedge endowment shocks, or manage consumption smoothing. This preserves the common prior by claiming trade isn't speculative.

  This explanation is quantitatively inadequate. If trading were driven primarily by liquidity and hedging, turnover rates should correlate closely with changes in fundamental endowments or consumption needs. They do not. Turnover in equity and derivatives markets vastly exceeds the rate of new capital issuance or lifecycle rebalancing. In many asset classes, the entire float turns over multiple times a year.

  Furthermore, liquidity trading is usually the *floor* of market activity, not the ceiling. Market makers provide liquidity, but they require speculators to take the other side of the trade to absorb risk. If everyone shared a common prior, a market maker would know that a counterparty trading for "liquidity reasons" might actually be hiding information (the Groucho Marx effect). Without heterogeneous priors, the market maker would widen spreads until trade ceases. The fact that deep, liquid markets exist with tight spreads implies that market makers *expect* to profit from the trade, not just earn a spread. They believe their valuation is objectively better than the counterparty's. That is a violation of the common prior.

  ### 2. The Arbitrage Problem with Bounded Rationality
  The second standard defense is bounded rationality: agents are not perfect Bayesians; they make mistakes, suffer from cognitive biases, or process information slowly.

  While psychologically true, this is a theoretically lazy solution. If trade is driven by one party being "irrational" or "mistaken," we must ask why this mistake persists. In deep financial markets, the marginal price-setters are sophisticated institutions (hedge funds, prop shops, HFTs). These agents have immense computational power and capital. If the volume were driven by noise traders making errors, rational agents should arbitrage those errors away until the volume dissipates or the noise traders go bankrupt (the Friedman doctrine).

  Yet, speculative disagreement persists among the most sophisticated actors. Value investors and momentum traders, both fully rational within their frameworks, trade against each other continuously. If we attribute this to bounded rationality, we imply that one side is simply "bad at math." It is more coherent to model this as **rational disagreement**. Agent A and Agent B are both maximizing expected utility correctly, but they started with different probability distributions over the state space. This preserves the assumption of rationality (which is crucial for modeling incentives) while allowing for trade. Bounded rationality breaks the model's engine; heterogeneous priors just change the fuel.

  ### 3. Common Knowledge is Actually Strong in Modern Markets
  The no-trade theorem also relies on the common knowledge of rationality and trading rules. One could argue trade happens because I don't know that you know that I am rational.

  However, modern electronic markets make this explanation increasingly implausible. Trading protocols are standardized, transparent, and often algorithmic. In high-frequency trading, the "rationality" of the counterparty is literally encoded in the latency arbitrage logic. The rules of the game are the most common knowledge feature of the financial system. To argue that massive global volume rests on a fragile epistemic chain of "I don't know that you know..." is to ignore the structural transparency of modern exchanges. The friction isn't in knowing the rules; it's in agreeing on the outcome.

  ### 4. The Case for Heterogeneous Priors (Agree to Disagree)
  Dropping the Common Prior Assumption is the minimal violation required to save the theory. It posits that agents can "agree to disagree" (Aumann, 1976) not because of communication failures, but because they hold fundamentally different subjective models of the world *before* receiving private signals.

  **Why this is the superior explanation:**

  *   **It Matches the Data on Persistence:** If agents shared a prior, Bayesian updating would cause beliefs to converge over time as public information arrives. We would see disagreement decay. Instead, we see persistent dispersion in analyst forecasts and trader positioning that does not vanish even after earnings releases or macro data. This suggests the divergence is in the *interpretation* of the data (the likelihood function/prior), not just the private signal.
  *   **It Explains the "Bet":** Financial markets function structurally like betting markets. When a venture capitalist funds a startup or a macro fund shorts a currency, they are not merely hedging; they are asserting a unique worldview. Institutional investment is marketed precisely on this divergence (e.g., "Value Strategy" vs. "Growth Strategy"). If priors were common, there would be only one optimal strategy. The existence of distinct, persistent investment philosophies is institutionalized evidence of heterogeneous priors.
  *   **It Preserves Rationality:** As noted above, assuming heterogeneous priors allows us to keep Expected Utility Theory intact. We don't need to invent complex behavioral quirks to explain why trade happens. We simply acknowledge that human beings are not *tabula rasas*. We arrive at the market with different experiences, education, and models. Treating these differences as "priors" rather than "errors" respects the agency of the traders.
  *   **It Solves the "Winner's Curse" Intuitively:** In a common prior world, if someone sells to me, I must assume they know something bad, so I lower my bid. In a heterogeneous prior world, if someone sells to me, I assume they operate under a different model than I do. I don't necessarily update my belief to match theirs; I update my belief that *they are willing to trade at this price given their model*. I can still believe I am right and they are wrong (by my lights), and thus the trade proceeds.

  ### Conclusion
  The no-trade theorem is a reductio ad absurdum of the Common Prior Assumption, not a proof that markets should be illiquid.

  Blaming liquidity needs ignores the sheer scale of speculative turnover. Blaming bounded rationality undermines the sophistication of marginal investors and fails to explain persistent disagreement. Blaming epistemic failures ignores the transparency of modern markets.

  The only explanation that treats traders as rational, accounts for the persistence of disagreement, and matches the speculative intensity of real-world finance is that **agents do not share a common prior.** We trade not because we have different pieces of the same puzzle, but because we believe we are solving different puzzles altogether. Acknowledging this doesn't break economic theory; it finally makes it applicable to Wall Street.
