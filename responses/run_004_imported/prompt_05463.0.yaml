  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** Small interview podcast run by a department (academic/philosophy focused).
      *   **Guest:** A philosopher defending the Moral Equality of Combatants (MEC), specifically against Jeff McMahan's revisionist just war theory. She aligns with Michael Walzer's traditional view.
      *   **Audience:** Seminar students who just spent 3 weeks on McMahan and are largely convinced by his liability argument.
      *   **Goal:** 8-9 tough interview questions that prevent the guest from just restating the standard Walzerian line. They need to press on weak spots.
      *   **Required Questions:**
          1.  Individual self-defense analogy (why doesn't McMahan's logic carry over?).
          2.  Deep morality vs. Convention/Consequentialism (is she conceding deep morality to McMahan?).
          3.  Conscript vs. Volunteer (does her view treat them the same?).
          4.  Ontology of "Combatant" (is the category real or just individuals contributing to threats?).
      *   **Format:** Each question needs a specific follow-up keyed to the most likely answer.

  2.  **Deconstruct the Philosophical Debate (MEC vs. Revisionism):**
      *   *McMahan (Revisionist):* Jus ad bellum and Jus in bello are linked. Unjust combatants are liable to be killed because they pose an unjust threat. Just combatants are not liable. Self-defense analogy holds (you can't kill someone defending themselves).
      *   *Walzer/Defender (Traditionalist):* Combatants are moral equals regardless of the justice of the cause. *Jus in bello* is independent of *Jus ad bellum*. Reasons: Epistemic limitations, collective nature of war, convention to minimize harm, equality of danger.
      *   *Tension Points:* Individual liability vs. collective agency, epistemic uncertainty, the "deep morality" vs. "laws of war" distinction, the status of non-combatants vs. combatants, the role of intention/knowledge.

  3.  **Drafting the Required Questions:**

      *   *Q1: Self-Defense Analogy.* McMahan says war is just lots of individual self-defense cases. Guest says no. Why?
          *   *Follow-up:* If she says "war is collective," press on whether individuals lose moral agency in a collective.
      *   *Q2: Deep Morality vs. Convention.* Is MEC true deep down, or just a useful rule? If it's just useful, doesn't McMahan win on the *truth*?
          *   *Follow-up:* If she says "it's both," ask how a false deep morality can sustain a normative convention.
      *   *Q3: Conscript vs. Volunteer.* Does culpability matter? A lied-to conscript vs. a cynical volunteer.
          *   *Follow-up:* If she says "they are equal," ask if that renders individual moral reasoning irrelevant.
      *   *Q4: Ontology of Combatant.* Why is "combatant" a magic category? Why not a spectrum of threat contribution?
          *   *Follow-up:* If she defends the binary, ask about edge cases (logistics, cyber, high command).

  4.  **Developing the Remaining Questions (to reach 8-9):**
      *   *Need:* More pressure points on the Traditionalist view.
      *   *Idea 5: Epistemic Limitations.* McMahan says we can know enough to judge liability. Guest says we can't. But isn't "I didn't know" a weak shield for killing?
      *   *Idea 6: The "Unjust Combatant" who follows In Bello rules.* If they follow the rules but fight for genocide, are they really morally clean?
      *   *Idea 7: The Cost to Just Combatants.* Does MEC unfairly burden the just side? They have to fight harder against enemies who are "allowed" to kill them but whom they aren't "allowed" to view as legitimate targets in the same way? (Actually, McMahan says Just combatants can kill Unjust ones. The reverse is the problem). Let's rephrase: Does MEC grant unjust combatants a *privilege* they don't deserve?
      *   *Idea 8: Non-Combatant Immunity.* If combatant status is conventional, why is non-combatant immunity absolute? Is there a consistency problem?
      *   *Idea 9: The Future of War.* If technology makes epistemic uncertainty lower (drones, intel), does MEC become less plausible?

      *Refining the selection for maximum impact:*
      *   Let's make Q5 about the *burden* on the Just Combatant (the asymmetry of risk).
      *   Let's make Q6 about *Culpability and Ignorance* (invincible ignorance vs. vincible ignorance).
      *   Let's make Q7 about *Non-Combatant Immunity consistency* (why is that line sharp if combatant status is fuzzy?).
      *   Let's make Q8 about *Technological Change* (does MEC survive modern transparency?).
      *   Let's make Q9 a "Closing/Big Picture" question about the purpose of Just War Theory (action-guiding vs. truth-tracking).

  5.  **Refining Questions and Follow-ups (Iterative Process):**

      *   *Q1 (Self-Defense):* Focus on the "masking" of agency.
      *   *Q2 (Convention vs. Morality):* This is the "Two-Tier" objection. Crucial.
      *   *Q3 (Conscript/Volunteer):* Focus on *mens rea*.
      *   *Q4 (Ontology):* Focus on the "spectrum of danger."
      *   *Q5 (Epistemic):* Focus on "Invincible Ignorance." Is it a get-out-of-jail-free card?
      *   *Q6 (The "Clean Hands" Unjust Combatant):* If they follow *in bello* but fight for a horrific cause, are they truly moral equals?
      *   *Q7 (Asymmetry of Risk):* Does MEC make it harder for the Just side to win, thereby prolonging unjust wars? (Consequentialist angle).
      *   *Q8 (Technology):* Does better intel kill the Walzerian view?
      *   *Q9 (Purpose):* Is theory for philosophers or soldiers?

      *Wait, I need to ensure the follow-ups are specific to likely answers.*
      *   *Likely Answer Pattern:* She will likely appeal to "collective agency," "epistemic fog," "conventions reduce harm," and "uniformed status."
      *   *Follow-up Strategy:* Don't let her rest on those. Push the tension.

  6.  **Final Polish:**
      *   Tone: Respectful but rigorous (academic podcast).
