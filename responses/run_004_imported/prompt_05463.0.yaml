      *(Self-Correction during drafting)*: Make sure Q2 (Convention vs. Morality) is sharp. This is the "Reductionist Challenge." If she admits MEC is only conventional, McMahan wins the moral argument. If she denies it, she needs a robust account of why the unjust killer isn't liable.
      *(Self-Correction on Q3)*: Ensure the distinction between the conscript (coerced/ignorant) and the volunteer (suspecting unjustness) is clear. This tests the "equality" part of MEC.

  7.  **Final Review against constraints:**
