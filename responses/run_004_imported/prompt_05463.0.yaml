answer: |-
  Here are nine interview questions tailored to your seminar's current understanding of the debate. They are designed to move past the introductory "Walzer vs. McMahan" summary and press on the specific tensions in her defense of the Moral Equality of Combatants (MEC).

  ### 1. The Self-Defense Analogy
  **Question:** McMahan's central move is to treat war as an aggregation of individual self-defense cases. In ordinary life, if an innocent person threatens me through no fault of their own (say, they are thrown off a cliff toward me), I may defend myself, but they aren't *liable* to be killed in the same way an aggressor is. McMahan argues unjust combatants are like innocent threats, while just combatants are like defenders. If you reject this, you have to explain why the logic of individual liability dissolves when we put on a uniform. Why doesn't the "attacker is liable, defender isn't" intuition carry over?

  **Follow-up:** *If she argues that war is a "collective enterprise" that masks individual agency:* Does that mean individual soldiers lose their moral status as agents entirely? If I can be held responsible for following *in bello* rules, why can't I be held responsible for the *ad bellum* status of the cause I'm advancing?

  ### 2. Deep Morality vs. Convention
  **Question:** There is a worry that your defense of MEC is actually a concession. It seems you might be arguing that while McMahan is right about the *deep morality* (unjust combatants are indeed liable), we should adopt MEC as a *convention* because it minimizes total harm or epistemic error. If that's the case, aren't you conceding the philosophical truth to the revisionists and just holding onto the surface-level rules for pragmatic reasons?

  **Follow-up:** *If she insists MEC is true at the level of deep morality, not just convention:* How do you ground that moral truth without appealing to the very individual liability criteria you reject? If the unjust combatant isn't liable, what moral right do they have to kill the just combatant, other than a "license" granted by the enemy?

  ### 3. The Conscript vs. The Cynical Volunteer
  **Question:** Your view treats combatants as moral equals, but surely there is a moral difference between a conscript who has been systematically lied to by their state about the cause, and a volunteer who privately suspects the war is unjust but signs up for the paycheck anyway. Does your view actually treat those two cases the same? If so, doesn't that render individual moral reasoning irrelevant to the ethics of killing in war?

  **Follow-up:** *If she admits there is a difference but says it doesn't change their targetability:* If the volunteer is more culpable than the conscript, why doesn't that increased culpability make them *more* liable to defensive harm? Why does the binary of "combatant/non-combatant" override the spectrum of individual culpability?

  ### 4. The Ontology of the "Combatant"
  **Question:** Revisionists argue there is no morally real category called "combatant," only individuals contributing to unjust threats in varying degrees. A logistics driver might contribute less than a rifleman, but both contribute. By insisting on the equality of combatants, aren't you reifying a legal category that doesn't map onto the moral reality of who is actually dangerous or responsible?

  **Follow-up:** *If she defends the uniform as a necessary bright line:* But modern warfare is increasingly asymmetric and decentralized (insurgencies, contractors, cyber warfare). If the "uniform" is no longer a reliable marker of state agency, does your view lose its grip on what actually constitutes a combatant?

  ### 5. Invincible Ignorance
  **Question:** A key pillar of the Walzerian view is "invincible ignorance"—the idea that soldiers cannot be expected to judge the justice of their state's cause. But we live in an information age. When a war is manifestly unjust (e.g., clear aggressive expansionism), can soldiers still claim invincible ignorance? At what point does ignorance become vincible, and does that not collapse your view back into McMahan's?

  **Follow-up:** *If she argues that soldiers still lack access to classified intel or diplomatic context:* Does that apply to high-ranking officers as much as privates? If a General knows the cause is unjust but orders privates to fight, are the privates still moral equals to the enemy, or are they being used as tools by someone who is liable?

  ### 6. The "Clean Hands" Unjust Combatant
  **Question:** Let's imagine an unjust combatant who scrupulously follows *jus in bello* rules: they target only military objectives, minimize collateral damage, and treat POWs well. They are, by your lights, a moral equal. But they are fighting to sustain, say, a genocide or an illegal occupation. Is there no sense in which their participation makes them complicit in a supreme emergency, regardless of how cleanly they pull the trigger?

  **Follow-up:** *If she distinguishes between "moral equality" and "moral innocence":* If they aren't innocent, why are they immune from liability? It seems you are asking the just combatant to treat someone who is objectively contributing to a grave wrong as if they were merely a neutral obstacle.

  ### 7. Asymmetry of Risk
  **Question:** One criticism of MEC is that it places an unfair burden on the *just* combatant. If the unjust combatant is permitted to kill the just combatant, but the just combatant is morally restricted (in the deep view) from viewing the unjust combatant as a legitimate target in the same way, doesn't this handicap the just side? Does MEC inadvertently prolong unjust wars by making it harder for the just side to prosecute victory?

  **Follow-up:** *If she argues that MEC actually protects the just side by ensuring their own soldiers aren't targeted if they lose:* But if the just side loses, the unjust cause prevails. Is a convention that protects soldiers at the cost of potentially securing an unjust political outcome actually morally desirable?

  ### 8. Technological Transparency
  **Question:** McMahan's view relies on the possibility of knowing who is liable. Your view relies on the impossibility of knowing *ad bellum* justice. As surveillance, drone technology, and open-source intelligence make the battlefield more transparent, doesn't the "epistemic fog" argument for MEC evaporate? If we can know more, shouldn't the moral requirements shift?

  **Follow-up:** *If she says technology doesn't change the nature of political judgment:* Even if it doesn't change the political judgment, does it change the *individual soldier's* ability to assess threat? If a soldier knows with 90% certainty their cause is unjust, does your view still grant them the same license to kill as the soldier on the other side?

  ### 9. The Purpose of Just War Theory
  **Question:** Finally, a meta-ethical question. Is the purpose of Just War Theory to describe the *truth* about moral liability, or is it to provide an *action-guiding code* for people under extreme duress? If it's the latter, maybe McMahan is right about the truth but wrong about the code. But if it's the former, how do you answer the charge that MEC is simply factually incorrect regarding who is liable to harm?

  **Follow-up:** *If she says it must be both:* Can a theory be action-guiding if it asks soldiers to believe something that is philosophically false (i.e., that they are not liable when they actually are)? Does requiring soldiers to operate under a "necessary fiction" undermine their moral agency?
