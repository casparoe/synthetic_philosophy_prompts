      *   **Core Conflict:** Nyāya argues *śabda* is an irreducible, independent *pramāṇa* (source of valid knowledge). Buddhists argue it is reducible to *anumāna* (inference).
      *   **Key Arguments to Include:**
          *   *Nyāya:* Syntactic expectancy (*ākāṅkṣā*), semantic compatibility (*yogyatā*), proximity (*sannidhi*). Cases where knowledge arises without assessing speaker reliability (child learning, stranger's directions). Lack of explicit *vyāpti* (invariable concomitance).
          *   *Buddhist:* Testimony is inference based on the speaker's reliability (trustworthiness implies truth). The Nyāya conditions are just suppressed premises of an inference.
      *   **Format:** Dialogue between a Naiyāyika and a Buddhist Epistemologist.
      *   **Tone:** Philosophical, rigorous, engaging, respectful but sharp.
      *   **Ending:** No resolution, but highlighting the sharpest, most stubborn point of disagreement.

  2.  **Character Conception:**
