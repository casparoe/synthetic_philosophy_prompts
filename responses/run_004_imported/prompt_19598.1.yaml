      *   Make sure the ending lands on the "stubborn point." The stubborn point is whether the *causal chain* of testimony necessarily includes a judgment of reliability as a distinct cognitive step.

  7.  **Final Review against constraints:**
      *   Dialogue format? Yes.
      *   Nyāya argues sui generis status? Yes.
