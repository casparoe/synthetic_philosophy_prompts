      *   *N:* Then Vedic testimony fails, as there is no speaker. (Wait, Nyāya accepts God as author, Buddhists don't. Better stick to human testimony to keep it epistemological rather than theological, or acknowledge the Vedic split briefly). Let's stick to human testimony for clarity on the *pramāṇa* mechanism.
      *   *Refining the End:* The core disagreement is about *parsimony* vs. *phenomenological accuracy*. Buddhists want to reduce instruments of knowledge. Nyāya wants to map the distinct causal origins of distinct cognitions.

  6.  **Polishing the Language:**
