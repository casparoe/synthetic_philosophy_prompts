      *   **Buddhist (B):** Let's call him *Pramāṇavādin* (Proponent of Valid Means). He represents the Dignāga-Dharmakīrti school. He values parsimony and the foundational role of perception and inference.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. A quiet garden or debate hall. Establish the topic immediately.
      *   **The Buddhist Opening Move:** State the reductionist thesis clearly. *Śabda* is just *Anumāna*. We infer truth from the fact of speaking by a reliable person.
      *   **The Nyāya Counter:** It feels different. The cognition arises differently. Introduce the specific conditions (*ākāṅkṣā, yogyatā, sannidhi*).
      *   **The Buddhist Rebuttal:** Those conditions are just the *hetu* (reason) or conditions for the inference. If I hear "Fire is on the mountain," I infer the speaker knows it, therefore it is true.
      *   **The Nyāya "Child/Stranger" Argument:** This is crucial. A child learns language without knowing logic. A traveler asks directions and accepts them without vetting the stranger's character. Where is the *vyāpti* here?
      *   **The Buddhist Defense:** It's a *habitual* inference (*svabhāva-pratibandha* or just habit). Just because you don't consciously articulate the major premise doesn't mean it's not an inference. It's *paramārtha* (ultimate) vs. *vyavahāra* (conventional).
      *   **The Nyāya "Novelty" Argument:** Inference relies on prior knowledge of the connection. Testimony gives *new* connections (e.g., Vedic injunctions or historical facts).
