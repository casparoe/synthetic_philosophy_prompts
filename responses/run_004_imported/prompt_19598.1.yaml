      *   *Check:* Is the Buddhist argument strong enough? *Correction:* Avoid making B sound like they just deny experience. B should argue that Nyāya is multiplying entities unnecessarily (Ockham's Razor style, though Indianized as *lāghava*).
      *   *Check:* Is the Gaṅgeśa influence visible? *Correction:* N should mention that the cognition of the meaning arises *immediately* from the words, provided the conditions are met, without a middle step of judging the speaker.
