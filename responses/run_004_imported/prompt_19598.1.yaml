answer: |-
  **Setting:** *A shaded veranda in Mithilā, late afternoon. The air is cool, scented with jasmine. Two scholars sit on woven mats. One is **Tarkavāgīśa**, a Naiyāyika of the Navya school, steeped in the logic of Gaṅgeśa. The other is **Pramāṇavādin**, a Buddhist epistemologist following the lineage of Dharmakīrti. A palm-leaf manuscript lies open between them.*

  **Pramāṇavādin:** You Nyāyikas are fond of multiplication. You see a shadow and posit a substance; you hear a word and posit a new *pramāṇa*. We have established that valid cognition arises only from perception (*pratyakṣa*) and inference (*anumāna*). Perception grasps the particular; inference grasps the universal connection. Where does *śabda*—testimony—fit? It must be one of these. Since words are not sensed directly as objects but as signs, *śabda* is merely inference in disguise.

  **Tarkavāgīśa:** Disguised? That is a bold claim. When I hear "Bring the cow," I act. I do not pause to construct a syllogism. If *śabda* were inference, the cognition would arise from a mark (*liṅga*) and a remembered invariable concomitance (*vyāpti*). But in verbal understanding, the cognition arises from the words themselves, provided certain conditions are met.

  **Pramāṇavādin:** And what are these conditions, if not the premises of my inference? When you accept a statement, you do so because you believe the speaker is trustworthy (*āpta*). You tacitly reason: "This person is speaking; a trustworthy person does not deceive; therefore, what they say is true." That is an inference. The speaker's utterance is the smoke; the truth of the matter is the fire.

  **Tarkavāgīśa:** You confuse the *cause* of the cognition with the *justification* for it later. Gaṅgeśa has shown that the knowledge of the speaker's trustworthiness is not a causal factor (*kāraṇa*) in the immediate arising of verbal cognition. Consider the conditions for sentence meaning: syntactic expectancy (*ākāṅkṣā*), semantic compatibility (*yogyatā*), and proximity (*sannidhi*).

  **Pramāṇavādin:** I know these three. But they are merely the conditions under which the inference succeeds. If words lack expectancy—"cow horse man"—there is no connection to infer. If they lack compatibility—"water the fire with water"—the inference is contradicted. If they are not proximate, the sign is lost. These are constraints on the *hetu*, not proof of a separate instrument.

  **Tarkavāgīśa:** No. *Ākāṅkṣā* is the mutual need of words for one another to complete a sense. It is a relation between *meanings*, not between a speaker and a truth. But let us press harder on your claim that we must infer trustworthiness. Imagine a child. A mother says, "Fire burns." The child learns this. Does the child possess the logical capacity to infer, "My mother is reliable, therefore her statement is true"?

  **Pramāṇavādin:** The child operates on habit (*abhyāsa*). Just as a man who has repeatedly seen smoke and fire eventually infers fire from smoke without consciously recalling the rule, the child has a habitual association between the mother's voice and reality. It is still an inference, merely one where the major premise has sunk into the background.

  **Tarkavāgīśa:** Habit explains repetition, not the first instance. Consider a traveler lost in a forest. He meets a stranger and asks, "Where is the village?" The stranger says, "Beyond the ridge." The traveler accepts this and goes. He has no prior knowledge of this stranger's character. He has no time to assess the stranger's competence or honesty. Yet, he gains a determinate cognition of the village's location. Where is the *vyāpti* here? What is the invariable concomitance he has grasped between "stranger's utterance" and "truth"?

  **Pramāṇavādin:** He assumes a general rule: "Human speech, unless contradicted, is generally intended to convey truth." This is a *svabhāva-pratibandha*, a natural connection between rational speech and the intent to communicate reality. He infers from the mere fact of intelligible speech that the speaker intends to report a fact they believe to be true.

  **Tarkavāgīśa:** You are shifting ground. First, you said we infer from the speaker's *trustworthiness*. Now you say we infer from the *intent to communicate*. But even so, the cognition of the meaning arises *simultaneously* with the hearing of the words, not subsequently as a conclusion. In inference, there is a sequence: I see smoke, I remember the connection, I conclude fire. In testimony, I hear "The king is coming," and immediately I know the king is coming. The words themselves carry the meaning. If *śabda* were inference, understanding a sentence in a foreign language would be impossible even if I trusted the speaker, because I would lack the minor premise. But if I trust a translator, I gain knowledge. The instrument is the word, not the person.

  **Pramāṇavādin:** The instrument is the *reliability* manifest through the word. You say the words carry the meaning. But words are merely sounds (*dhvani*). Sounds are impermanent; they vanish the moment they are produced. How can a vanished sound be the cause of a cognition that arises later, after the sentence is finished? The cognition arises only when you have processed the sequence and judged it valid. That judgment is inferential. You infer the meaning from the trace of the sounds, validated by the speaker's authority.

  **Tarkavāgīśa:** We posit the *sphoṭa* or the final impression (*saṃskāra*) to explain the unity of the sentence. But let us set aside metaphysics for epistemology. Your reduction fails because inference requires a prior knowledge of the connection between the mark and the thing marked. To infer fire from smoke, I must have seen them together before. To infer truth from testimony, I must have previously verified that *this* speaker tells the truth. But much of what we learn from testimony is *novel*. I learn from a geographer that there is a mountain of gold in the north. I have never verified this. I have no prior *vyāpti* between "geographer's speech" and "gold mountains." I accept it solely because the words convey a coherent meaning (*yogyatā*).

  **Pramāṇavādin:** You do not need to verify the specific fact. You verify the *source*. You know that geographers generally use methods that lead to truth. You infer: "This man is a geographer; geographers speak truth about geography; therefore, this statement is true." The object is new, but the connection between the class of speakers and reliability is known.

  **Tarkavāgīśa:** And if the geographer is lying? Or mistaken? If I later find there is no gold, do I say my inference was invalid? Or do I say my testimony was false? In inference, if the smoke is wet and does not indicate fire, the inference is flawed. In testimony, if the speaker lies, the *words* remain meaningful, but the knowledge fails. The defect lies in the speaker, not in the logical connection between word and meaning. This suggests the *pramāṇa* is the word's capacity to convey meaning, while the *pramā* (validity) depends on the speaker. In inference, the *pramāṇa* and the *pramā* are tied to the logical relation itself.

  **Pramāṇavādin:** You distinguish too finely. In both cases, validity depends on the relation holding in reality. If there is no fire, the smoke was not a valid sign. If there is no gold, the statement was not a valid sign. The structure is identical. You Nyāyikas insist on *śabda* as independent because you wish to protect the Vedas. If testimony is inference, then Vedic statements must be tested like any other claim. By making *śabda* intrinsic, you grant them immunity.

  **Tarkavāgīśa:** That is an ad hominem regarding the Vedas. Let us speak of human speech. My point is phenomenological. The *experience* of hearing truth is distinct from the *experience* of deducing truth. When I deduce fire, I feel the effort of reasoning. When I hear "Your father has arrived," I feel the immediate impact of the news. Gaṅgeśa argues that the causal complex (*kāraṇa-sāmagrī*) for verbal cognition includes the knowledge of word-meaning relations (*śakti-jñāna*) and the three conditions I mentioned. It does *not* include a judgment of the speaker's reliability at the moment of cognition. That judgment comes later, if doubt arises.

  **Pramāṇavādin:** But if doubt does not arise, why not? Because the judgment of reliability is instantaneous and subconscious. You are mistaking the *speed* of the inference for the *absence* of inference. Parsimony (*lāghava*) demands we not posit a new *pramāṇa* if an existing one can do the work. If I can explain testimony as inference from a reliable source, why add a fourth category?

  **Tarkavāgīśa:** Because parsimony cannot override experience (*anubhava*). If the causal mechanisms differ, the instruments differ. In inference, the instrument is the knowledge of the pervasion (*vyāpti-jñāna*). In testimony, the instrument is the knowledge of the word-meaning relation (*śakti-jñāna*). These are different cognitions producing different results. To say testimony is inference is like saying cooking is eating because both involve food. One prepares the object; the other consumes it. Testimony *presents* the object through language; inference *uncovers* the object through logic.

  **Pramāṇavādin:** But the "presentation" is only accepted if the logic of reliability holds. Suppose I tell you, "I am the King of Rome." You understand the meaning—the words have *ākāṅkṣā* and *yogyatā*. But you do not gain knowledge (*pramā*). Why? Because you infer I am lying. The meaning is grasped, but the truth is not. Thus, the *pramāṇa* for the truth is not the words, but your assessment of me.

  **Tarkavāgīśa:** Agreed: understanding meaning (*śābdabodha*) is distinct from valid knowledge (*pramā*). But in cases where we *do* gain valid knowledge without assessing the speaker—like the child, or the traveler—the validity flows from the words themselves, provided the speaker is in fact reliable. The *pramāṇa* is the statement of a reliable person. The reliability is a qualification of the source, not a premise in your mind.

  **Pramāṇavādin:** And there we remain stuck. You say the reliability is a quality of the source, external to the cognition's structure. I say reliability is the *hetu* within the cognition's structure. You claim we can bypass the assessment of the speaker. I claim that bypassing the assessment is only possible because the assessment has been habitualized into instinct.

  **Tarkavāgīśa:** Then we differ on the nature of instinct. Is it compressed logic, or is it a direct capacity of language to convey reality?

  **Pramāṇavādin:** We differ on whether language is a window or a sign. For you, the word opens the window directly to the object. For me, the word is a sign pointing to the speaker's mind, which we infer reflects the object.

  **Tarkavāgīśa:** And if the speaker's mind is opaque, but the words are true?

  **Pramāṇavādin:** Then you were lucky, not knowledgeable.

  **Tarkavāgīśa:** And if the speaker is trustworthy, but the words are misunderstood?

  **Pramāṇavādin:** Then there is no knowledge, only noise.

  **Tarkavāgīśa:** So we agree on the outcome, but disagree on the path.

  **Pramāṇavādin:** No. The path determines the scope of what we can know. If you are right, language can carry truth independently of the speaker's intent, perhaps even from the Vedas. If I am right, all testimony is tethered to the fallibility of the speaker's perception and inference.

  **Tarkavāgīśa:** And if you are right, then community and tradition are merely aggregates of individual inferences, fragile and prone to collapse if the chain of reliability is questioned. If I am right, language itself is a vessel of truth, capable of carrying knowledge across generations without each generation re-proving the trustworthiness of the ancestors.

  **Pramāṇavādin:** That is a comforting thought. But comfort is not a *pramāṇa*.

  **Tarkavāgīśa:** Nor is parsimony, if it cuts away the bone of experience.

  *They sit in silence for a moment. The sun dips lower, casting long shadows across the manuscript. Neither moves to close it.*

  **Pramāṇavādin:** So. You maintain that the cognition arises from the words, conditioned by expectancy, without a mediating judgment of the speaker.

  **Tarkavāgīśa:** And you maintain that such a cognition is impossible without a tacit inference of the speaker's veracity.

  **Pramāṇavādin:** It seems we cannot prove to the other whether the trust is in the *word* or in the *speaker*.

  **Tarkavāgīśa:** Precisely. You see the arrow and look for the archer. I see the arrow and look for the target. We both see the flight, but we disagree on what propels it.

  **Pramāṇavādin:** Then the debate rests here: Is the authority of language intrinsic, or is it borrowed from the mind that wields it?

  **Tarkavāgīśa:** And until that is settled, *śabda* remains either a sovereign king or a disguised servant.

  **Pramāṇavādin:** Let the shadows decide. For now, the light is gone.

  *Pramāṇavādin rolls the manuscript. Tarkavāgīśa watches the smoke from a nearby lamp rise, wondering if he infers the fire, or simply knows it.*
