      *   *Q2 (Shewmon):* Need to address somatic integration.
          *   *Draft:* What about Shewmon's patients who grew?
          *   *Refinement:* Reference the specific findings (wound healing, puberty). Ask how this fits the "integrator" theory.
          *   *Follow-up:* She might say "those are outliers." Counter: They disprove the *necessity* of the brain for integration.

      *   *Q3 (DCD Permanent vs. Irreversible):* This is a technical legal/medical distinction.
          *   *Draft:* Why use permanent instead of irreversible?
          *   *Refinement:* Highlight the moral weight. If it's not irreversible, auto-resuscitation is the only bar, not potential resuscitation.
          *   *Follow-up:* She might say "it's practical." Counter: Does practicality override biological accuracy in defining death?

      *   *Q4 (The Apnea Test):* This is the clinical cornerstone.
          *   *Draft:* Is the apnea test enough?
          *   *Refinement:* Focus on the physiological stress and the specific pCO2 threshold. Does reaching 60mmHg prove *irreversibility* or just *current non-function*?
          *   *Follow-up:* She might say "it's validated." Counter: Validated against what gold standard if death is a philosophical concept?

      *   *Q5 (Confounding Variables):* Drugs and hypothermia.
          *   *Draft:* How do you rule out drugs?
          *   *Refinement:* Mention specific agents (baclofen, sedatives) that linger. How do you distinguish high-dose sedation from brain death in an emergency?
