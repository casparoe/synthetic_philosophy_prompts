      *   **Quantity:** 8 interview questions.
      *   **Specific Requirements:**
          *   One question on hypothalamic/pituitary function persisting after whole-brain declaration (contradicting "all functions ceased").
          *   One question on D. Alan Shewmon's case series (brain-dead bodies healing/growing).
          *   One question on DCD (Donation after Circulatory Death) protocols using "permanent" vs. "irreversible" cessation of circulation.
          *   **Crucial:** Each question needs a tailored follow-up based on likely evasive answers.
      *   **Tone:** Professional, probing, knowledgeable, respectful but rigorous.

  2.  **Deconstruct the Topics & Identify Tensions:**
      *   *Whole-Brain Death (WBD) Standard:* Legally defined as irreversible cessation of *all* functions of the *entire* brain, including the brainstem.
      *   *Tension 1 (Hormonal):* Many declared brain-dead patients maintain homeostasis (temp, urine output, growth in children) via the hypothalamus/pituitary. This challenges the "all functions" claim.
      *   *Tension 2 (Integration/Somatically):* Shewmon's work showed long-term survival with somatic integration (healing, fighting infection, gestating fetuses) without a functioning brain. This challenges the "brain is the integrator of the body" claim.
      *   *Tension 3 (Circulatory Death):* DCD relies on "permanent" (won't restart spontaneously) not "irreversible" (can't be restarted). This creates a logical gap between death determination and organ viability (if it's irreversible, you can't touch it; if it's permanent, you *could* restart it but choose not to).
      *   *Tension 4 (Apnea Test):* The gold standard test itself induces physiological stress and relies on CO2 thresholds that might not reflect true biological death in all contexts.
      *   *Tension 5 (Confounding Factors):* Hypothermia, drugs, metabolic issues can mimic brain death. How sure are we?
      *   *Tension 6 (Public Trust):* If the definition is so solid, why the confusion? Is it the language used with families?
      *   *Tension 7 (Philosophical vs. Biological):* Is death a moment or a process? Does the legal definition match the biological reality?
      *   *Tension 8 (Organ Viability):* If the body is dead, why do organs need perfusion management to stay viable?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Q1 (Hypothalamus):* Need to ask about endocrine function.
