      *   *Q6 (Somatic Support):* If the body is dead, why does it react to incision (the "Lazarus sign" or hemodynamic shifts)?
          *   *Draft:* Why does the body move during surgery?
          *   *Refinement:* Focus on spinal reflexes vs. hemodynamic stability. If the brain is dead, why does the body mount a stress response to organ procurement?
          *   *Follow-up:* She might say "spinal cord only." Counter: Doesn't that show the body is still an integrated organism without the brain?

      *   *Q7 (Language & Families):* The "dead vs. dying" confusion.
          *   *Draft:* Why do families get confused?
          *   *Refinement:* You say "dead," but treat them like "living patients" until the OR. Is this a necessary fiction?
          *   *Follow-up:* She might say "it's compassionate." Counter: Does compassion justify ontological ambiguity?

      *   *Q8 (The "Dead Donor Rule"):* This ties it all together.
          *   *Draft:* Are we killing for organs?
