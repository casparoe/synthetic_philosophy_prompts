      *   *Wait, let's look closer at (c).* The student writes: "the bed moves far more slowly than the water... which propositions occupy which role can differ between communities and change over time." This is correct. *Then* they write: "a proposition that has already hardened into a hinge... is not itself a candidate for being softened back." This contradicts the previous sentence. It's an internal inconsistency. The example (heliocentrism) actually supports the *shifting* view (it was empirical, now hinge), but the student claims it can't go back. If a new paradigm shifts (e.g., radical skepticism becomes practical?), it could. The error is the claim of *irreversibility*. I will penalize for this specific contradiction.

