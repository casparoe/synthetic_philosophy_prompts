answer: |-
  The vibration started in Leo's pocket during third period Chemistry, a dull buzz against his thigh that he knew meant the school Wi-Fi had triggered another notification on Silhouette. No one used their real names on Silhouette. The app geofenced itself to the campus; you had to be physically here to post, but once you did, you were just a username generated by the server. *User892.* *Ghost44.* A voice from everywhere and nowhere.

  Leo kept his phone face down, but he could feel the energy shift in the room. It wasn't the chaotic noise of a classroom disruption; it was a synchronized quiet, the specific silence of thirty people looking at screens under their desks.

  By lunch, the hallway atmosphere had thickened. It felt pressurized, like the air before a storm. Maya was walking toward the cafeteria, tray in hand. She was a junior, sharp-eyed, usually confident. Today, she walked with her shoulders hunched, eyes fixed on the linoleum. She had won the Regional Science Fair yesterday. The prize was a summer internship at the university lab, the kind of thing everyone claimed to want but no one wanted to bleed for.

  Leo watched from his locker. He'd seen Maya in the lab at 7:00 AM on Saturdays. He'd seen her miss the bonfire, the homecoming game, the weekend trips to the lake. She had traded those things for pipettes and data sets.

  But on Silhouette, the story was different.

  Leo slipped into the crowd near the vending machines and glanced at a phone screen held up by a sophomore. The post was at the top of the feed, liked by hundreds.

  *User773: Congrats to Maya for winning. Must be nice to have a dad who knows the Dean. Guess some of us don't need to study when we have connections.*

  There was no evidence. Maya's father was a shift manager at a logistics warehouse. But the comment section was a waterfall of agreement.

  *User102: Always the same people.*
  *User559: System is rigged. Why bother trying?*
  *User331: She thinks she's better than us.*

  That last one was the engine. Leo recognized the tone. It wasn't justice; it was resentment dressed up in moral clothing. They weren't angry because the system was unfair; they were angry because Maya had stood out. She had broken the unspoken contract of the herd: *none of us shall be greater than the rest.* If she could win, it meant their loss was their own fault. It was easier to flatten her into a caricature of privilege than to admit she had worked while they had slept.

  The public had spoken. No single person had accused her. If you asked any individual student, they'd shrug and say, "I just saw what everyone else was saying." But collectively, they had convicted her. She was no longer Maya, a girl who liked indie folk and struggled with calculus. She was "The Cheater," a symbol they could all agree on.

  Leo felt a tightness in his chest. He knew what Kierkegaard might call it, though he didn't have the words ready. He knew that the crowd was a lie. The crowd was an abstraction that possessed power without responsibility. To fight it, you couldn't be a ghost. You had to be a name.

  He walked to the far end of the hall, away from the noise. He opened Silhouette. The cursor blinked in the text box.

  *Type your truth,* the app prompted.

  Leo typed. He didn't hide behind irony or vague hints. He wrote: *Maya's dad works at Logistics Inc. I know because I carpool with her sometimes. She was in the lab every Saturday while you were at the bonfire. She earned this. Stop hiding behind usernames.*

  He hesitated. The app had a toggle: *Post Anonymously.* It was checked by default. Everyone kept it checked. It was the shield that allowed the leveling to happen. If you couldn't be found, you couldn't be held accountable.

  Leo unchecked the box. A warning popped up: *Your student ID name will be visible to all users.*

  He swallowed. His hands were shaking slightly. This was the risk. To stand against the abstraction, he had to make himself concrete. He had to invite the envy, the retaliation, the isolation. He had to become a target to save one person from being a target.

  He hit post.

  *Leo V.* appeared at the top of the feed.

  For ten minutes, nothing happened. Then the notifications began to tick up. Not likes. Comments.

  *User882: Who asked you?*
  *User102: Simp energy.*
  *User559: Okay, hero. Save your breath.*
  *User773: Maybe you're in on it.*

  Leo watched the thread grow. He expected pushback, but he didn't expect the speed of the absorption. He thought his specific truth would puncture the general lie. Instead, the crowd simply digested him. His named stand didn't stop the leveling; it just gave them something new to chew on. He wasn't seen as a whistleblower; he was seen as another character in the drama, another data point to be categorized and dismissed.

  By the end of the day, Leo's post was buried under new threads. Someone had posted a blurry photo of a teacher sleeping at their desk. The outrage machine shifted gears instantly. The hunger for judgment was insatiable, but it didn't care about consistency.

  Maya didn't sit at her usual table. She ate alone in the library, head down. She hadn't seen Leo's post; she had turned her phone off that morning. The leveling had already done its work. She felt the eyes in the hallway, the cold shoulders, the silence when she entered a room. The truth didn't matter because the public wasn't interested in truth. It was interested in equilibrium. It wanted everyone flat.

  Leo walked out to the parking lot. He felt exposed, raw. He had done the thing that mattered, the only thing that could possibly matter. He had put his name on his conviction.

  A group of seniors walked past him. One of them, a guy Leo had played soccer with in freshman year, glanced at him.

  " Saw your post," the guy said.

  "And?" Leo asked.

  The guy shrugged, pulling his hood up. "Doesn't change anything, man. People believe what they want."

  He kept walking.

  Leo stood by his car. The sun was setting, casting long shadows across the asphalt. He realized then that the crowd hadn't rejected him; it had absorbed him. His stand hadn't shattered the mirror; it had just become another reflection in it. The machinery of the present age was too smooth, too frictionless. It turned conviction into content, and courage into just another opinion to be scrolled past.

  Maya would survive high school. She would go to college, maybe get away from this town. But the mechanism remained. The public was still there, waiting for the next person to stand out so it could drag them back down to the safety of the average.

  Leo got into his car and started the engine. He checked his phone one last time. Silhouette had a new notification. A poll: *Who cares more about grades than people?*

  The options were *Yes* or *No.*

  He locked the screen and put the car in drive. He was still Leo V., and he was alone. But as he merged onto the main road, surrounded by other cars full of silent students looking at glowing screens, he knew he was the only one who was actually there. The rest were just ghosts, driving nowhere, leveled by the light of their own devices.
