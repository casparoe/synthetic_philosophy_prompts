answer: |-
  Your Honor, distinguished guests, scholars, and most importantly, the candidates for naturalization:

  It is a profound humility to stand in a federal courthouse on the Fourth of July. This is a building dedicated to the text of the law, just as this holiday is dedicated to the text of our founding. And having spent the last few years living inside the mind of Frederick Douglass, I know how heavy those texts can be.

  We often remember Douglass for the speech he gave here in Rochester in 1852. We remember the fire. We remember the indictment. "What to the Slave Is the Fourth of July?" is a question that still burns. In that year, Douglass stood before a crowd much like this one, though he was not yet a citizen, and he told them that your celebration is a sham. He called the Constitution a "covenant with death." He argued that the American Republic was built on a lie so fundamental that no honest person could stand under its roof.

  That is the speech we quote. That is the easy speech. It is the speech of pure moral clarity, where the line between the nation and its sin is absolute.

  But I am here to ask you to consider the harder speech. The speech Douglass gave ten years later, and twenty years later. The speech he gave after he broke with his mentor, William Lloyd Garrison, and after the blood of the Civil War had soaked the soil.

  In those later years, Douglass changed his mind. He came to argue that the Constitution, read by its letter and not by the nation's practice, contains no sanction for slavery. He noted that the words "slave" and "slavery" appear nowhere in the document. The text speaks of "persons." It speaks of "citizens." It speaks of "liberty."

  Douglass realized that if the text was clean, then the sin was not in the bargain, but in the breaking of it. The Constitution was not a rotten foundation; it was a promissory note that the country had refused to cash.

  This distinction matters. It matters deeply for the room we are in today.

  If the Constitution were inherently evil, then the oath you are about to take would be a pledge to a corrupt system. It would be asking you to uphold a machinery designed for exclusion. But if Douglass's later argument holds true, then the Constitution is a tool of inclusion that was wielded as a weapon of exclusion. The betrayal was not in the ink; it was in the hand that held the pen.

  To the scholars here: I know this interpretation is debated. But to the new citizens here: this is the inheritance you are accepting.

  You are not inheriting a perfect history. No one asks you to love the history. The history includes centuries where the text said "We the People" and the practice meant "We the Few." The history includes this very courthouse, and others like it, standing silent while laws were enforced that contradicted the liberty they were built to protect.

  If I tell you only to love the promise, I ask you to be blind. If I tell you only to mourn the betrayal, I ask you to be cynical. I am asking you to hold both.

  To acknowledge the betrayal is not to forfeit the promise. To love the promise is not to ignore the betrayal.

  When you raise your right hand in a few moments, you are not swearing allegiance to the nation as it has always been. You are swearing allegiance to the nation as the text demands it must be. You are aligning yourself with the words "Liberty" and "Justice" against the centuries that ignored them.

  This is a heavier burden than simple patriotism. Simple patriotism asks you to cheer. Constitutional citizenship asks you to work.

  Douglass eventually argued that the American Constitution was a "glorious liberty document." He did not say this because he thought America was glorious. He said it because he believed the text provided the legal leverage to make America glorious. He saw that the law, properly read, offered a higher ground than the culture.

  For you, coming from thirty different countries, this is familiar terrain. You know that the place you come from is not always the place you wish for. You know that leaving a home is an act of hope. You are betting that a new set of rules can create a new kind of life.

  But you must know that these rules are only as strong as the citizens who enforce them. The text is silent without your voice. The promise is dormant without your action.

  The judge has asked me to avoid present-day politics. I will honor that. But there is a politics older than parties, older than elections. It is the politics of the gap between what we say and what we do. That gap is where you now live.

  When you become a citizen, you enter that gap. You become a bridge between the text and the practice.

  There will be days when the practice seems to win. There will be days when the news suggests the promise was a lie. On those days, I ask you to remember Frederick Douglass in the 1860s and 70s. Remember that he looked at a country that had enslaved him and said, "The law is on my side." He found power in the punctuation. He found protection in the silence of the text where the word "slave" should have been.

  He taught us that the law can be a shield for the vulnerable, but only if we read it honestly.

  So, as you prepare to take the oath, do not take it lightly. Do not take it as a mere formality to get a passport or a job. Take it as a commission.

  You are being asked to join a project that is unfinished. You are being asked to uphold a system that has failed, so that it might not fail again. You are being asked to love the Constitution not for what it has protected in the past, but for what it can protect in the future.

  The betrayal is real. The promise is real. The work is yours.

  Welcome to the struggle of making the practice match the text. Welcome to the hard work of American citizenship.

  Thank you.
