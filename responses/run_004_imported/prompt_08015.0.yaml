      *   So America broke its own rules.
      *   You new citizens are taking an oath to the rules, not the history.
      *   But the history matters.
      *   So welcome. Work hard.

      *Critique 1:* Too simple. Needs more gravitas. Needs to weave the "betrayal" and "promise" tighter. The prompt asks to hold them together without cancelling them out.

  7.  **Writing - Iteration 2 (Focusing on the Tension):**
      *   Start with the courthouse. Stone, law, text.
      *   Douglass in Rochester.
      *   The shift: From "The Constitution is pro-slavery" to "The Constitution is anti-slavery." Why? Because words matter.
      *   The betrayal: We didn't live up to the words.
      *   The promise: The words are still there, waiting.
      *   New citizens: You are the latest chapter in making the practice match the text.

  8.  **Refining the Word Count:**
      *   Average speaking rate is ~130-140 words per minute.
      *   8 minutes = ~1,040 to 1,120 words.
      *   I need to ensure I don't go too short or too long.

  9.  **Final Polish (Self-Correction during drafting):**
      *   *Check:* Did I sound too academic? *Fix:* Add more direct address to the new citizens.
      *   *Check:* Is the Douglass scholarship accurate? *Fix:* Ensure the distinction between the "covenant with death" (Garrison) and the "glorious liberty document" (Douglass 1860s) is clear.
      *   *Check:* Is it too political? *Fix:* Keep the critique historical and structural, not partisan.

  10. **Final Review against constraints:**
      *   8 minutes? (Looks like ~1100 words).
      *   No present-day politics? (Checked).
      *   Douglass's constitutional argument? (Central theme).
      *   Promise/Betrayal tension? (The core emotional arc).

  *(Self-Correction Note during final review)*: Make sure I don't imply the Constitution was *perfect*, but that Douglass argued it was *redeemable* based on its text. The prompt specifies: "text never once says 'slave' or 'slavery'... promise the country broke rather than a bargain that was rotten from the start." I must stick to that specific interpretation.

