prompt: |-
  Because my last novel spent three hundred pages inside Frederick Douglass's head, our federal courthouse has asked me to give the keynote at this year's Fourth of July naturalization ceremony, where dozens of new citizens from thirty-odd countries will take the oath on the very holiday Douglass once used to ask a Rochester crowd what American independence could possibly mean to someone the nation had not yet promised to include. I don't want the easy version of that speech, the denunciation everyone quotes from "What to the Slave Is the Fourth of July?" but the harder argument Douglass reached only after breaking with William Lloyd Garrison: that because the Constitution's text never once says "slave" or "slavery," it has to be read by its letter, not by the nation's practice, as a promise the country broke rather than a bargain that was rotten from the start. The presiding judge has asked every speaker to stay clear of anything readable as present-day politics, which leaves that distinction — text against practice — as about the only honest thing I can find to say to a room holding both these new citizens and a couple of Douglass scholars from the local university who will notice if I get it wrong. Write the speech: eight minutes, meant to be read aloud, that holds the promise and the betrayal together without letting either cancel the other out.
reasoning: |-
  Here's a thinking process that leads to the speech:

  1.  **Analyze the Request:**
      *   **Speaker:** A novelist who just wrote a 300-page book inside Frederick Douglass's head.
      *   **Occasion:** Fourth of July Naturalization Ceremony at a federal courthouse.
      *   **Audience:** Dozens of new citizens from 30+ countries, a presiding judge, Douglass scholars from a local university, general public.
      *   **Constraint 1 (Time):** Eight minutes (approx. 1,000 - 1,200 words spoken at a moderate pace).
      *   **Constraint 2 (Content):** Avoid the "easy version" (the famous denunciation from "What to the Slave Is the Fourth of July?"). Instead, focus on the "harder argument" Douglass developed later: The Constitution is an anti-slavery document because it never mentions "slave" or "slavery." It's a broken promise, not a rotten bargain.
      *   **Constraint 3 (Tone/Politics):** Avoid anything readable as *present-day* politics (no specific partisan references, no current culture war flashpoints). Focus on the text vs. practice distinction.
      *   **Goal:** Hold the promise and the betrayal together without letting either cancel the other out.

  2.  **Deconstruct the Core Argument (Douglass's Evolution):**
      *   *Early Douglass (1852):* The Constitution is a pro-slavery covenant with death. The Fourth of July is a sham to the slave.
      *   *Later Douglass (post-Garrison, post-Civil War):* The Constitution's text is clean. It speaks of "persons," "citizens," "liberty." Slavery was a local corruption, a violation of the federal charter. Therefore, the fight is to make the practice match the text.
      *   *Application to New Citizens:* You are swearing allegiance to the *text* (the promise), not the *history* (the betrayal). But you must acknowledge the betrayal to understand the weight of the promise.

  3.  **Drafting - Section by Section:**

      *   **Introduction (1.5 mins):** Acknowledge the setting, the holiday, and the weight of Douglass's presence (metaphorically). Establish the speaker's connection (the novel). Set the stage: 1852 vs. Later years.
      *   **The "Easy" Speech vs. The "Hard" Speech (2 mins):** Briefly acknowledge the famous 1852 condemnation (to show I know it), but pivot quickly to the later legal argument. Explain the "text vs. practice" distinction. The Constitution doesn't say "slave."
      *   **The Promise and the Betrayal (2.5 mins):** This is the crux. How do we hold both? The betrayal was real (slavery, exclusion). The promise was real (the words on the page). The new citizens are inheriting the *work* of aligning the two.
      *   **Addressing the New Citizens (1.5 mins):** What does this mean for them? They aren't inheriting a perfect nation, but a *propositional* one. Their oath is a commitment to the text's potential.
      *   **Conclusion (1.5 mins):** Bring it back to the courthouse, the oath, and the ongoing work. End on a note of solemn responsibility, not blind patriotism.

  4.  **Drafting - Tone and Style:**
      *   *Voice:* Literary, thoughtful, respectful, solemn but hopeful. Not preachy.
      *   *Rhythm:* Needs to be speakable. Varied sentence lengths. Pauses for effect.
      *   *Politics:* Keep it abstract. Talk about "exclusion" and "inclusion" generally, not specific modern policies. Focus on the *mechanism* of citizenship.

  5.  **Drafting - Specific Content Checks:**
      *   *Did I mention "slave" in the Constitution?* Yes, need to be precise. (3/5ths clause, fugitive slave clause - they exist but don't use the S-word).
      *   *Did I avoid present-day politics?* No mentions of current presidents, parties, or specific border policies. Focus on the philosophical nature of the oath.
      *   *Did I satisfy the scholars?* Need to accurately reflect Douglass's shift from Garrisonian disunionism to Constitutional abolitionism.
      *   *Did I satisfy the Judge?* Keep it dignified, focused on the rule of law/text.

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   Hello. I wrote a book about Douglass.
      *   Everyone knows the 1852 speech. "This holiday is yours, not mine."
