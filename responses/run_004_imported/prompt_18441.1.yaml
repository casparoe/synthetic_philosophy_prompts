prompt: |-
  So the podcast I co-host (small thing, maybe a few hundred regular listeners, pretty rationalist/EA-adjacent crowd) has got a guest lined up for next week who's about as hardcore an aggregationist as you'll find on the torture vs dust specks question -- she'll actually bite the 3^^^3 bullet, no lexical threshold, no "torture is just a different kind of thing than discomfort" escape hatch, straight expected-disvalue multiplication all the way down. I found her through a paper she wrote responding directly to Temkin, which is part of why I don't want to waste the interview on stuff she's answered a hundred times already. I've reread Yudkowsky's original Overcoming Bias post more times than I'd like to admit, comment war and all, and a while back went further down the rabbit hole into the actual academic lineage of the argument -- Temkin's work on intransitivity and spectrum/continuum arguments, and Norcross's headaches-vs-a-death paper from the late 90s, which is basically the same move a decade before "shut up and multiply" was a phrase anyone used.

  Can you draft me 8-10 interview questions, built so they escalate/build on each other rather than reading like a list? I want at least one question each on: the raw incredulity people feel, but framed as "why is THAT the intuition we discount, rather than your confidence that harms are even comparable on one scale" instead of the boring "doesn't that seem crazy" version; whether Temkin's intransitivity arguments quietly break the step-by-step chaining her whole argument depends on; whether the same "just keep adding small stuff" logic commits her to something repugnant-conclusion-shaped once population size is on the table too; and whether dust specks and fifty years of torture are even measured in a common currency such that multiplying one into the other is a coherent operation rather than a category error. Then close with one question that's less a philosophy question and more of a "what would actually change your mind" question, since I get the sense thats the one she hasn't got a rehearsed answer for. For every question, give me the sharp follow-up keyed to whatever dodge or standard move is most likely, so I'm not stuck improvising live on air.
