answer: |-
  This is a genuinely sharp observation, and you're right to sense that the structural isomorphism is too strong to be coincidental. If you strip away the jargon, both McClennen's Resolute Choice and Wei Dai's UDT say: *"The optimal action at $t_2$ is determined by the optimization procedure run at $t_0$, regardless of what the optimization procedure run at $t_2$ would say given the information available at $t_2$."*

  However, if you dig into the *mechanics* of why they diverge from standard decision theory, the analogy starts to fray in ways that matter. To answer your specific questions: No, UDT does not need McClennen's violation of Expected Utility (EU) to do its work, and yes, the "prior gap" is the place where the two theories actually part ways metaphysically.

  Here's the breakdown of where the analogy holds and where it breaks.

  ### 1. The Source of Dynamic Inconsistency: Preferences vs. Information

  This is the biggest divergence. You asked if UDT secretly needs McClennen's assumption that preferences violate EU (specifically separability) to justify not being "sophisticated."

  **McClennen's Case:**
  In *Rationality and Dynamic Choice*, McClennen is fighting against the standard EU result that if you satisfy **Separability** (preferences over sub-trees don't depend on the larger tree) and **Ordering**, you cannot be dynamically inconsistent.
  *   For McClennen, dynamic inconsistency arises because human preferences are often non-EU (e.g., Allais-type preferences).
  *   The "Sophisticated" agent realizes their future self will have different preferences (or weight probabilities differently) and plans around that, often leading to "unraveling" (e.g., paying to avoid options you'll later reject).
  *   The "Resolute" agent says, "My $t_0$ preferences are the true ones; I will bind my $t_n$ self to them."
  *   **Crucially:** McClennen's agent *could* deviate at $t_n$ based on local preferences but chooses not to via an act of will/normative commitment.

  **UDT's Case:**
  UDT generally assumes a standard EU maximizer. It does not require non-linear probability weighting or Allais-style preference reversals.
  *   The inconsistency in UDT arises from **Bayesian Updating**, not preference change.
  *   In Counterfactual Mugging:
      *   **Ex-ante ($t_0$):** You want to pay if asked, because that policy makes the predictor give you money in the other branch. $E[U(\text{Pay})] > E[U(\text{Don't Pay})]$.
      *   **Ex-post ($t_1$, after learning coin is Tails):** You know the big money is already lost. Standard CDT/EDT says "Don't Pay."
  *   UDT solves this not by "willpower" but by **refusing to condition on the observation**. The UDT agent calculates $E[U | \text{Policy}]$ using the *original prior*, effectively treating the observation "Coin is Tails" as irrelevant to the decision calculation, even though it is relevant to the state of the world.

  **Verdict:** UDT does *not* need McClennen's non-EU preferences. In fact, UDT is arguably *more* rigid than McClennen. McClennen allows that preferences might shift but argues you should ignore the shift. UDT argues that the "shift" (the update) is a mistake in the decision algorithm itself. UDT doesn't need to violate EU axioms; it violates the **Sure Thing Principle** (or rather, the normative force of conditioning on new evidence).

  ### 2. The Nature of the "Self": Temporal vs. Logical

  This is where the "commit to a policy" vs. "commit to a plan" distinction gets real.

  **McClennen (Temporal Selves):**
  McClennen is dealing with **indexical time**. $t_0$ is "me before the sequence," $t_1$ is "me after the first node." The problem is that "me at $t_1$" has different information and potentially different motivational states. Resolute choice is a solution to the *principal-agent problem* between your temporal stages.

  **UDT (Logical Selves / Instantiations):**
  UDT is dealing with **logical uncertainty** and **acausal correlation**.
  *   When UDT says "commit before any observations," it doesn't just mean "before the experiment starts." It often implies "before you know which logical instantiation of you is running."
  *   In Parfit's Hitchhiker or Twin Prisoner's Dilemma, the "other self" isn't your future self; it's a copy of you in a different causal branch or a different physical location.
  *   McClennen's Resolute Choice doesn't naturally handle acausal trade. If I commit to a plan at $t_0$, that commitment causally influences my $t_1$ body. It does not causally influence a predictor who simulated me yesterday.
  *   UDT works because the "policy" is a mathematical object. If two agents run the same policy, their outputs are logically correlated. McClennen's "plan" is a psychological commitment; UDT's "policy" is a function $P(\text{Observation}) \to \text{Action}$.

  **Verdict:** "Commit to a plan" (McClennen) is a psychological constraint on a temporal sequence. "Commit to a policy" (UDT) is a logical constraint on a function across possible worlds. UDT is essentially **Resolute Choice generalized to logical time**.

  ### 3. The Prior Problem: The Real Gap

  You hit the nail on the head with: *"is there a real gap there once you ask what prior you're supposed to be updateless with respect to?"*

  This is the weakest point of UDT and the strongest point of difference from McClennen.

  **McClennen:**
  The "prior" is just the probability distribution over the decision tree nodes at the start of the choice sequence. It's relatively uncontroversial within the context of the problem. You know you are at the root of *this* tree.

  **UDT:**
  UDT requires a **Universal Prior** over all possible world programs (including those where you don't exist, or where physics is different).
  *   To be truly updateless, you must optimize relative to the prior you had *before* you knew you existed (a "Veil of Ignorance" prior).
  *   If you update on "I exist," you lose the ability to solve Counterfactual Mugging (because now you know you're in the branch where the coin might be Tails, and the leverage is gone).
  *   This creates the **"Prior Problem"** in UDT: Different agents with different priors will disagree on the optimal policy, and there is no objective way to select the "correct" updateless prior.

  McClennen doesn't have this problem because he isn't trying to solve problems involving logical correlation or predictors who simulate you. He's solving problems where the agent walks through a known tree. UDT is trying to solve problems where the tree itself is logically dependent on the agent's traversal algorithm.

  ### 4. Why the Analogy Feels So Strong (And Why It Matters)

  The reason you feel they are the same is that both theories reject **Consequentialism of the Moment**.

  *   **Standard Decision Theory (CDT/EDT/Sophisticated):** The right action is the one that maximizes utility *given what is now fixed*. (Past predictions are fixed; past coin flips are fixed).
  *   **Resolute/UDT:** The right action is the one that maximizes utility *given what could have been fixed if you were a different kind of agent*.

  However, the *justification* differs:
  *   **McClennen** justifies it normatively: "Rationality requires consistency of will." It's a virtue ethic of decision making.
  *   **Wei Dai** justifies it instrumentally: "Agents that don't do this get less money in Newcomb-like problems." It's a selection pressure argument.

  ### The Verdict

  Your intuition is correct that UDT is the **formalization** of the intuition behind Resolute Choice, but it transplants it into a different ontology.

  1.  **Does UDT need non-EU preferences?** No. It needs **non-updating**. McClennen fixes the *preference ordering*; UDT fixes the *information set*.
  2.  **Is "policy before observations" the same as "plan and stick to it"?** No. McClennen's plan is a causal commitment to future bodily actions. UDT's policy is a logical commitment to outputs across correlated instantiations.
  3.  **The Gap:** The gap is the **Prior**. McClennen assumes a shared reality where time flows. UDT assumes a multiverse of logical possibilities where "time" is just a variable in the world program.

  **My take:** UDT is what happens when you take McClennen's Resolute Choice, strip out the psychology, replace "time" with "logical dependency," and demand it work for AI agents that can be simulated. McClennen was trying to save human rationality from itself; Wei Dai is trying to save agent rationality from Bayesian updating.

  If you're writing this up, the killer point is that **McClennen treats dynamic inconsistency as a failure of will, whereas UDT treats it as a failure of the decision algorithm to recognize logical correlations.** That distinction saves UDT from some of the "irrationality" charges leveled at Resolute Choice (e.g., by Arntzenius), because UDT isn't ignoring information out of stubbornness; it's ignoring information because conditioning on it breaks the logical link that generates the value.
