prompt: |-
  hey, weird lit-review rabbit hole but I think you might actually be good for this one. Wei Dai's updateless decision theory (UDT) always struck me as basically a repackaged version of Edward McClennen's old "resolute choice" idea from the dynamic choice literature (Rationality and Dynamic Choice, if I've got the title right) - both have the agent picking a whole plan/policy up front and then refusing to deviate later even though the "in the moment" self would rather do something else, since deviating undercuts the whole point of having a plan (McClennen builds his case around Allais-type non-EU preferences and the sophisticated/naive/resolute trichotomy; UDT's classic case is Counterfactual Mugging). Can you actually dig into wether this analogy holds up, instead of just noting the surface similarity? Specifically: does UDT secretly need something like McClennen's assumption that preferences violate expected utility to justify not being "sophisticated," or is UDT's whole motivation (logical uncertainty, correlated copies of the agent, acausal-ish reasoning) doing totally different work? And is "commit to a policy before any observations" really the same move as "commit to a plan and stick with it," or is there a real gap there once you ask what prior you're supposed to be updateless with respect to? Genuinely torn on this, curious what you actually think rather than just a side-by-side summary.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Comparison between Wei Dai's Updateless Decision Theory (UDT) and Edward McClennen's "Resolute Choice" (from *Rationality and Dynamic Choice*).
      *   **User's Hypothesis:** UDT is basically a repackaged version of Resolute Choice. Both involve picking a plan/policy upfront and sticking to it, even if the "current self" would prefer to deviate.
      *   **Specific Questions to Address:**
          1.  Does UDT need McClennen's assumption (violations of Expected Utility, specifically dynamic inconsistency arising from non-EU preferences like Allais) to justify not being "sophisticated"? Or is UDT's motivation (logical uncertainty, correlated copies, acausal reasoning) doing different work?
          2.  Is "commit to a policy before any observations" (UDT) the same as "commit to a plan and stick to it" (McClennen), or is there a gap regarding *what prior* one is updateless with respect to?
      *   **Tone/Style:** Deep dive, critical analysis, not just a summary. The user knows the literature ("weird lit-review rabbit hole," cites specific titles/concepts). Needs to be philosophically rigorous but conversational.

  2.  **Deconstruct the Core Concepts:**

      *   **McClennen's Resolute Choice:**
          *   Context: Dynamic choice problems (sequential decisions).
          *   Problem: Dynamic inconsistency (e.g., preference reversal over time).
          *   Standard Solutions: Naive (ignore future inconsistency), Sophisticated (anticipate future inconsistency and plan around it, often leading to suboptimal outcomes like "unraveling"), Resolute (commit to the initial plan and force future selves to comply).
          *   Foundation: Often motivated by *non-Expected Utility* preferences (e.g., Allais paradox, common ratio effect). If you have EU preferences + separability, you shouldn't be dynamically inconsistent. McClennen argues rationality *permits* resolute choice even if it violates separability/dynamic consistency axioms.
          *   Key Mechanism: Willpower/Commitment across *time*.

      *   **Wei Dai's UDT:**
          *   Context: Decision theory in AI/AGI, specifically dealing with logical uncertainty, prediction, and Newcomb-like problems.
          *   Problem: Time inconsistency arising from *updating* on information that correlates with the outcome (e.g., Counterfactual Mugging, Parfit's Hitchhiker).
          *   Standard Solutions: CDT (fails Newcomb), EDT (fails Smoking Lesion), TDT (causal graphs with logical nodes).
          *   Foundation: Expected Utility is generally kept (maximize expected utility relative to a prior), but the *prior* is never updated. The agent maximizes $E[U | \text{Policy}]$ using the *original* prior, ignoring new information that would change the conditional probabilities in a way that hurts expected value.
          *   Key Mechanism: Policy selection across *logical possibilities* (or "world programs"), not just temporal stages.

  3.  **Evaluate the Analogy (The "Meat" of the response):**

      *   *Similarity:* Both reject "sophistication" (backward induction that accounts for future deviation). Both advocate sticking to a plan chosen at $t_0$.
      *   *Difference 1: Source of Inconsistency.*
          *   McClennen: Psychological/Preference-based. The agent's preferences change or violate EU axioms (separability).
          *   UDT: Information-based. The agent's preferences (utility function) stay the same, but *updating* on information changes the optimal action *ex-post* compared to *ex-ante*. UDT assumes standard EU maximization but forbids Bayesian updating on the decision-relevant information.
      *   *Difference 2: The "Self".*
          *   McClennen: Temporal selves (Me today vs. Me tomorrow).
          *   UDT: Logical selves / Instantiations (Me in the world where the coin is heads vs. Me in the world where the coin is tails). It's about indexical uncertainty and logical correlation, not just time.
      *   *Difference 3: The Prior.*
          *   McClennen: Doesn't really talk about a "universal prior." It's about a specific decision tree.
          *   UDT: Heavily relies on the "Universal Prior" or the specific prior over world programs. This is a major point of contention (the "Prior Problem" in UDT).

  4.  **Drafting the Argument (Iterative Process):**

      *   *Acknowledge the insight:* The user is sharp. The structural isomorphism is real. Both are "Ex-Ante Optimization" strategies.
      *   *Address Question 1 (EU Violations):* McClennen *needs* non-EU (or at least violations of separability) to make Resolute Choice distinct from Sophistication. If you satisfy EU + Separability, Sophistication = Resolute. UDT, however, *keeps* EU. It bans *Updating*. This is the crucial divergence. UDT says "Don't update on X," McClennen says "Don't change your preference ordering."
      *   *Address Question 2 (The Prior/Gap):* "Before any observations" (UDT) is much stronger than "Before the sequence starts" (McClennen). UDT requires a prior over *logical facts* (e.g., digits of pi, coin flips before they happen). McClennen just needs a prior over the decision tree nodes. The "gap" is the metaphysical status of the $t_0$ moment. In UDT, $t_0$ is "before existence" (veil of ignorance style). In McClennen, $t_0$ is just "start of the experiment."
      *   *Synthesis:* UDT is Resolute Choice generalized to *logical* time and *acausal* influence. McClennen is Resolute Choice applied to *psychological* time and *causal* influence.

  5.  **Refining the Nuance (Self-Correction during drafting):**
