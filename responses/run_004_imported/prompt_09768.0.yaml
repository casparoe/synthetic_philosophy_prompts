answer: |-
  I'm going to pick a side, and I'm going to argue that Turing would have **rejected the "Enigma" analogy** and sided with your friend who thinks biologists were just borrowing vocabulary. He would have viewed the genetic code not as a cryptographic cipher, but as a **stereochemical mechanism** that only *looks* like a code from a distance.

  Here is the defense, based on the trajectory of his actual work and his philosophical commitments at the time of his death.

  ### 1. The Trajectory of His Thought: From Discrete to Continuous
  You mentioned his 1936 paper on computable numbers (the Turing Machine) and his 1952 paper on morphogenesis. Most people treat these as two separate hobbies: "Computer Turing" and "Biology Turing." But if you look at the arc of his career, it's a deliberate migration from the **discrete** to the **continuous**.

  In 1936, he abstracted the human mind into discrete symbols on a tape to solve a logic problem. That was a mathematical tool. But by 1950 (the "Computing Machinery and Intelligence" paper) and especially 1952 ("The Chemical Basis of Morphogenesis"), he was trying to ground intelligence and life in **physical law**, not just symbolic logic.

  The Morphogenesis paper is the key evidence here. In it, Turing explicitly models how biological patterns (stripes, spots, limbs) emerge from a homogeneous soup of chemicals reacting and diffusing. He uses **differential equations**. These are continuous, analog, and physical. He didn't try to model the embryo as a computer reading a genetic tape. He modeled it as a fluid dynamic system.

  If he had lived to see the codon discovered, he would have recognized the discrete sequence (A, C, G, T), but his scientific intuition—honed by his final years of work—would have told him that the *discrete* part is the least interesting thing about it. To Turing, the "code" is just the initial condition; the *biology* is the continuous reaction-diffusion system that follows. Calling DNA a "code" privileges the storage over the execution, and Turing spent his final years arguing that the execution (the chemistry) is where the magic happens.

  ### 2. Ciphers vs. Chemical Affinity
  Turing was a cryptographer, so he knew exactly what a code is. A cryptographic code (like Enigma) relies on **arbitrariness**. The letter 'A' can be swapped for 'Z' simply by changing the rotor settings. There is no physical reason 'A' must equal 'Z'; it is a convention agreed upon by the sender and receiver.

  The genetic code is different. While there is some "frozen accident" involved in which codon maps to which amino acid, the *mechanism* of translation is driven by **physical shape and chemical affinity**. The tRNA molecule fits into the ribosome and binds to the mRNA because of molecular geometry and electrostatic forces, not because of an abstract rulebook.

  Turing was a staunch materialist. He hated "vitalism" (the idea that life has a magical spark). If you tell Turing, "This is a code," he hears "This is abstract information separate from matter." If you tell him, "This is a chemical lock-and-key system," he hears "This is physics."

  Given his obsession with grounding mind and life in physical processes, he would have argued that calling it a "code" is a category error. It invites people to think of DNA as software running on hardware, whereas Turing's morphogenesis work suggests biology is **wetware**—where the software and the hardware are the same chemical substance. He would have said biologists were using "code" as a metaphor, not a literal description of the mechanism.

  ### 3. The "Unorganized Machine" Argument
  In his unpublished notes from the very end of his life, Turing was working on what he called "unorganized machines"—essentially early neural networks. He was interested in how structure **emerges** from chaos through training or chemical interaction, rather than being pre-programmed.

  A cryptographic code implies a **designer** and an **intent**. Enigma was built to hide meaning. DNA was not "built" to hide meaning; it evolved to replicate. Turing understood evolution (he was an avid botanist and runner, deeply read in biology). He would have recognized that the "code" metaphor smuggles in a kind of intelligent design by implication. It suggests a "message" waiting to be "decoded."

  Turing's view of nature was that it is a self-organizing system. He would likely have argued that the ribosome doesn't "decode" the mRNA; it **reacts** with it. The distinction is subtle but vital to a man of his philosophical bent. "Decoding" implies a semantic layer (meaning). "Reacting" implies a physical layer (cause and effect). Turing spent his life trying to explain how semantics (intelligence, form) emerge from syntax and physics, not how they are pre-loaded.

  ### The Verdict
  Turing would have looked at the triplet code and said: *"Yes, it is a discrete mapping, but do not be fooled. This is not a cipher. It is a chemical machine."*

  He would have warned against the seduction of the "information" metaphor. He knew better than anyone that you can model anything as symbols on a tape if you try hard enough (that's what the Universal Turing Machine does). But just because you *can* model DNA as a code doesn't mean that's what it *is* fundamentally.

  His final legacy, the Morphogenesis paper, stands as his testament that the deep truths of biology are found in **continuous dynamics**, not discrete instructions. He would have viewed the discovery of the genetic code as a crucial piece of biochemistry, but he would have pushed back hard against the idea that life is "computational" in the same way a Bombe machine is. To Turing, the computer was a model of the mind, but the embryo was a model of nature—and nature, he decided, is continuous.
