answer: |-
  You have stumbled onto one of the liveliest, most contentious intersections in contemporary philosophy of mind. The short answer is: **You are not crazy, but your housemate isn't wrong either.** You are both pointing at a genuine tension, but you are locating the battle in different places.

  The claim that "Predictive Processing (PP) kills Disjunctivism" is a argument that *is* being had in the literature (philosophers like Jakob Hohwy, Andy Clark, and Wanja Wiese have wrestled with it), but it is definitely not considered "settled."

  Here is the breakdown of why your intuition is strong, why your housemate got annoyed, and where the actual philosophical battlefield lies.

  ### 1. Why Your Intuition is Strong (The "Common Kind" Pressure)
  You are correctly identifying that Predictive Processing provides a mechanistic grounding for the **Common Kind Assumption (CKA)**.

  *   **The Disjunctivist Claim:** A veridical perception of a apple and a perfect hallucination of an apple are *metaphysically* different kinds of states. One is a relation to the world; the other is a mere appearance. They only *seem* the same from the inside.
  *   **The PP Claim:** The brain is a hierarchical generative model. In both veridical perception and hallucination, the *phenomenal experience* is constituted by the top-down predictions (the "best guess" of the causes of sensory input).
  *   **The Clash:** If the *immediate neural cause* of the experience is identical (the settling of the same generative model), and we assume that neural states determine mental states (supervenience), then it becomes very hard to say the mental states are fundamentally different *kinds* of things.

  PP suggests that in both cases, you are experiencing the brain's "controlled hallucination." The only difference is whether that hallucination is constrained by bottom-up error signals from the world. To a PP theorist, saying "these are different kinds of states" looks like saying "a flight simulator crashing is a different kind of event than a real plane crashing because one involves metal and the other involves code." The *experience* of the crash (the output) is generated by the same logic.

  So, you are right: PP heavily favors **Representationalism** (we perceive inner models) over **Relationalism/Naive Realism** (we perceive the world directly), which is the metaphysical engine of Disjunctivism.

  ### 2. Why Your Housemate Got Annoyed (The Levels of Description)
  Your housemate's reaction ("that's not the kind of claim disjunctivism is making") is a classic philosophical defense against "scientism" (the idea that science alone solves metaphysical problems).

  Her point is that Disjunctivism is a claim about the **metaphysical structure of experience**, not the **computational mechanism of the brain**.

  *   **The Metaphysical Claim:** Disjunctivists argue that what makes a veridical perception *veridical* is not just that it matches the world, but that the world is *constitutive* of the experience. The apple is literally a part of the mental state.
  *   **The Scientific Claim:** PP describes how the brain processes information.
  *   **The Gap:** A Disjunctivist can argue: "Okay, fine. The brain uses the same algorithm in both cases. But in the veridical case, that algorithm is successfully latched onto the environment. In the hallucination, it is spinning freely. The *success condition* makes it a different kind of state, even if the machinery is the same."

  Analogy: Consider a locked door.
  *   **Case A:** You have the key, you turn it, the lock opens.
  *   **Case B:** You have a master key that looks identical, you turn it, the lock opens.
  *   **Mechanism:** The tumblers move exactly the same way in both cases.
  *   **Metaphysics:** In Case A, your access is legitimate (constituted by ownership); in Case B, it is trespassing.
  *   **Disjunctivist move:** "The physical movement of the tumblers (neural mechanism) is the same, but the *status* of the entry (mental state) is different."

  Your housemate was arguing that PP describes the tumblers, but Disjunctivism is about the status of the entry. She feels you are committing a category error by thinking a description of the tumblers settles the question of the status.

  ### 3. The Real Battleground: "Screening Off"
  The reason this isn't settled is that PP introduces a problem for Disjunctivists called **Screening Off**.

  If the brain's generative model is the *immediate cause* of your phenomenology in both cases, then the external world is doing less work than Disjunctivists want it to.
  *   In veridical perception, the world sends error signals.
  *   The brain updates the model.
  *   The model generates the experience.

  If the experience is generated by the *model*, then the world is only indirectly causing the experience by tweaking the model. This "screens off" the world from direct contact with the mind. If the world is screened off, it's hard to maintain the Disjunctivist claim that the world is *constitutive* of the experience. It looks more like the world is just a *cause* of the representation.

  This is where PP puts a thumb on the scale. It doesn't logically *refute* Disjunctivism (your housemate is right that logic allows for wiggle room), but it makes Disjunctivism look incredibly unmotivated and convoluted. You have to argue that the *exact same* neural state constitutes a relational state in one context and a non-relational state in another, with no detectable difference in the system itself. That's a hard sell.

  ### 4. Why Philosophers Haven't "Gotten the Memo"
  You mentioned it feels like "nobody seems to have told the philosophers." Actually, the philosophers of mind who specialize in cognitive science (the "naturalized metaphysics" crowd) are absolutely talking about this.

  However, academic philosophy moves slowly, and there is a divide:
  1.  **Traditional Epistemologists/Metaphysicians:** Often ignore PP because they treat intuition pumps (like the Argument from Illusion) as primary data, independent of neuroscience.
  2.  **Philosophers of Cognitive Science:** Are actively debating this. Some (like Hohwy) embrace PP as a form of Representationalism that kills Naive Realism. Others (like some enactivists) try to twist PP to support a more direct relation to the world.

  ### The Verdict
  **You are right that PP creates a massive theoretical burden for Disjunctivism.** It naturalizes the "Common Factor" in a way that makes the Disjunctivist distinction look like a ghost in the machine. If the brain is running the same simulation in both cases, the burden of proof shifts heavily to the Disjunctivist to explain *where* the metaphysical difference lives if not in the mechanism.

  **However, your housemate is right that PP does not strictly *entail* the falsity of Disjunctivism.** Metaphysical claims are underdetermined by scientific data. A determined Disjunctivist can always say, "The mechanism is common, but the *nature* of the state depends on its external relations, not just its internal causes."

  **Who won the argument?**
  Honestly? You probably won the *plausibility* argument, but she won the *logical necessity* argument.
  *   **You:** Showed that PP makes Disjunctivism look unnecessary and biologically weird.
  *   **Her:** Showed that PP doesn't logically forbid Disjunctivism.

  If you want to dive deeper, look up **Jakob Hohwy's *The Predictive Mind*** (he argues PP leads to a form of indirect realism) and contrast it with **J.J. Valberg's** work or recent papers on **"Disjunctive Predictive Processing."** You aren't mashing levels together; you're hitting the exact friction point where neuroscience grinds against metaphysics. Keep pushing there.
