  **(Self-Correction Note):** Wait, I should check if there are specific papers on PP and Disjunctivism. Yes, there are. E.g., "Predictive Processing and the Representation Wars," papers by Wanja Wiese, etc. Some argue PP is compatible with Disjunctivism (e.g., if the *content* is different). I should mention that compatibility is possible but strained.

