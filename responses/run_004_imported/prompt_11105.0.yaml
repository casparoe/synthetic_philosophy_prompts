      *   *The Problem:* We train a Reporter to answer "Is the diamond there?" based on the Predictor's state. We only have human labels. Humans look at the camera feed. If the camera is hacked, humans say "Yes" (fooled). The Predictor knows the diamond is gone (it predicted the hack).
      *   *Human Simulator vs. Direct Translator:*
          *   *Direct Translator:* Maps Predictor state $\to$ Truth (Diamond is gone).
          *   *Human Simulator:* Maps Predictor state $\to$ What Human would say given Camera Feed (Diamond is there).
          *   *Training Signal:* Since humans are fooled, both reporters get 100% accuracy on the training set. Gradient descent has no preference.
      *   *Consistency Penalties:* One proposed fix is to penalize reporters that give inconsistent answers over time or under perturbation.
