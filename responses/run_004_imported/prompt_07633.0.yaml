prompt: |-
  I'm a 5th-year econ PhD student (labor economics now, but I did the standard micro theory sequence early on) and I'm on my grad student union's bargaining committee — we're in the middle of negotiating our first contract with the university and it's gotten a little tense. This is going to sound random, but there was a lecture in my old game theory course contrasting the Nash bargaining solution with the Kalai-Smorodinsky solution, and it's been stuck in my head as maybe actually useful for how we think about our counteroffer strategy, since right now the committee is basically split between people who just want to "split the difference" on the numbers and people who think that rewards whoever names the more agressive opening ask.

  Concretely: our opening ask was a $45k stipend (up from the current $34k) plus fully employer-paid dental, the university's latest offer is $38k with a $12/month dental copay, and if we don't settle by the start of next semester the old (expired) contract just keeps rolling over — so $34k, no dental — which I guess is basically our disagreement point. Could you write me a short memo I can actually bring to the committee that (a) recommends whether we should be framing this using something like Kalai-Smorodinsky, Nash, or neither, (b) walks through concretely how you'd even define each side's "ideal point" in a case like ours, and (c) is honest about the best case for just not bothering with any of this formal machinery and doing the dumb midpoint thing instead. Would rather show up with something concrete for thursday's meeting than just vibes, and honestly I don't trust my own memory of the axioms enough to write this myself.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the User and Request:**
      *   **User:** 5th-year Econ PhD student (Labor Econ focus, Micro Theory background). Member of a grad student union bargaining committee.
      *   **Context:** First contract negotiation with a university. Tense atmosphere.
      *   **Problem:** Committee is split between "split the difference" (compromise) vs. "aggressive anchoring" (strategic positioning).
      *   **Specific Question:** Can Game Theory (Nash Bargaining Solution vs. Kalai-Smorodinsky Solution) help frame the counteroffer strategy?
      *   **Deliverable:** A short memo for the committee meeting (Thursday).
      *   **Requirements:**
          *   (a) Recommend which framework (Nash, KS, or neither) to use.
          *   (b) Concretely define "ideal points" and "disagreement points" for this specific scenario.
          *   (c) Be honest about the limitations (when to ignore the theory and just split the difference).
      *   **Tone:** Professional, analytical, accessible to economists (but maybe not game theory specialists), actionable.

  2.  **Deconstruct the Game Theory Concepts:**
      *   **Nash Bargaining Solution (NBS):** Maximizes the product of utility gains above the disagreement point $(u_1 - d_1)(u_2 - d_2)$. Assumes Independence of Irrelevant Alternatives (IIA). Sensitive to the shape of the utility frontier. Often interpreted as "splitting the surplus" but depends on risk aversion and the feasible set.
      *   **Kalai-Smorodinsky (KS):** Replaces IIA with Monotonicity. Maintains the ratio of maximum possible gains. If one party *could* have gotten more in the ideal scenario, they get a proportionally larger share of the actual agreement. It focuses on the "ideal point" (utopia point) where each party gets their maximum possible payoff on the frontier.
      *   **Disagreement Point (BATNA):** What happens if no deal is reached. Here: Old contract rolls over ($34k, no dental).
      *   **Ideal Point:** The best possible outcome for each side *given the other side's participation constraint*.

  3.  **Apply to the Specific Scenario:**
      *   **Union:** Wants $45k + Dental.
      *   **Admin:** Wants to minimize cost (let's say they want to stay at $34k or as low as possible).
      *   **Disagreement Point ($d$):** $34k stipend, no dental (status quo ante).
      *   **Feasible Set:** Bounded by budget constraints, political will, ability to strike (though the prompt says contract rolls over, implying no strike/lockout immediate threat, just expiration). *Correction:* The prompt says "if we don't settle... old contract keeps rolling over." This implies no strike capability *at this moment* or a legal framework where terms persist. This weakens the Union's leverage significantly compared to a strike scenario. The disagreement point is very concrete.
      *   **Ideal Points:**
          *   Union Ideal: $45k + Dental (Opening ask). *Critique:* Is this feasible? Probably not if Admin says no. True ideal is the max Admin would *ever* pay before shutting down the program (unlikely to happen).
          *   Admin Ideal: $34k + No Dental (Their opening/last offer was $38k + copay). True ideal is probably $0 cost increase, but politically constrained.

  4.  **Evaluate the Frameworks for this Context:**
      *   **NBS:** Requires defining utility functions. Money is transferable, but Admin utility isn't just money (it's budget + labor peace + reputation). Hard to quantify. NBS often looks like splitting the surplus, which the "split the difference" faction wants.
      *   **KS:** Requires defining the "Utopia Point." What is the absolute max the Union could get? What is the absolute min the Admin could pay? This is hard to define objectively. However, KS is good for "fairness" arguments based on *relative* concessions.
      *   **Reality Check:** Bargaining isn't a one-shot axiomatic game. It's repeated, political, and involves signaling. The "Split the Difference" heuristic is actually a focal point (Schelling). Aggressive anchoring is about shifting the perceived feasible set.

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** Direct answer. Don't get bogged down in axioms, use them for rhetoric, not calculation.
      *   **Section 1: The Theory (NBS vs. KS).** Briefly explain the difference. NBS = Maximize joint surplus product. KS = Maintain ratio of ideal gains.
      *   **Section 2: Defining the Points (The Concrete Part).**
          *   $d$ (Disagreement): $34k, no dental. Clear.
          *   $U_{max}$ (Union Ideal): Is it $45k? Or the max budget allows? Let's use $45k as the *claimed* ideal.
          *   $A_{max}$ (Admin Ideal): Is it $34k? Or $0? Let's use $34k as the *claimed* ideal.
          *   *Crucial Insight:* In KS, the solution lies on the line connecting $d$ to the Ideal Point $(U_{max}, A_{max})$. If we define ideals aggressively, KS moves toward us.
      *   **Section 3: Recommendation.**
          *   Don't use NBS/KS to *calculate* the number (too many unknowns).
          *   Use KS logic for *framing* fairness. "We are meeting you halfway relative to the possible gains."
          *   Use Schelling Focal Points for the actual number (Split the difference is powerful).
      *   **Section 4: The "Dumb Midpoint" Defense.** Why splitting the difference is actually robust. It's a focal point. It saves face. It ends the game.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, check the disagreement point.* If the contract rolls over automatically, the Union has *no* leverage to strike. The Admin can just wait forever. This makes the Disagreement Point very sticky. The Union *needs* a deal more than the Admin if the Admin is happy with the status quo.
      *   *Correction:* Usually, "rolling over" means terms persist, but often without step increases or with inflation erosion. I need to make sure the memo acknowledges the leverage imbalance.
      *   *Game Theory Insight:* If the disagreement point is stable for Admin but bad for Union, the Union needs to change $d$ (threaten disruption) or change the Admin's perception of $d$ (reputational cost).
      *   *KS Application:* KS is better for "fairness" rhetoric. "We asked for 11k, you offered 4k. The gap is 7k. Splitting the difference is 7.5k." But KS says: "What is the best you could possibly do?" If Admin says "Best we can do is 38k," KS collapses to 38k. So defining the *Ideal Point* is the political battle, not the math.
      *   *Decision:* Recommend using the *logic* of KS to justify why the midpoint shouldn't be the arithmetic mean of *current offers*, but the mean of *reasonable ranges*. But ultimately, advise that "Split the Difference" on the *current gap* is the best Schelling point to close the deal.

  7.  **Final Polish:**
      *   Keep it tight (1-2 pages).
      *   Use Econ lingo correctly (Pareto frontier, disagreement point, focal points).
      *   Ensure the tone is collaborative, not lecturing.
      *   Make sure the "Honest Assessment" section is truly honest.

  8.  **Output Generation:** (Drafting the memo based on the above thoughts.)
      *   *Structure:* To/From/Subject. Executive Summary. The Frameworks. Applying to Our Numbers. Strategic Recommendation.
      *   *Key nuance:* Emphasize that NBS/KS assume a known feasible set. We don't know the Admin's budget constraint. Therefore, the "Ideal Point" is a negotiation tactic, not a mathematical constant.

  9.  **Review against constraints:**
      *   (a) Recommend framework? Yes (KS for framing, Schelling for closing).
      *   (b) Define ideal/disagreement points? Yes ($34k vs $45k).
      *   (c) Honest about "dumb midpoint"? Yes (Schelling focal point).

  10. **Final Tweak:** Ensure I mention that Labor Econ > Theory here. The power dynamics matter more than the axioms. (Added to the "Honest Assessment" section).

  *(Self-Correction during drafting)*: I need to be careful not to imply KS gives a specific number without knowing the Admin's utility function. I must emphasize that KS is a *rhetorical* tool here, not a calculator. The "Ideal Point" is subjective.

  Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Graduate Student Union Bargaining Committee
  **FROM:** [Your Name], Bargaining Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Strategic Framing for Counteroffer: Game Theory vs. Focal Points

  ### Executive Summary
  We are currently stuck between two heuristics: "splitting the difference" (compromise) vs. "anchoring" (aggressive positioning). While Nash Bargaining (NBS) and Kalai-Smorodinsky (KS) solutions offer formal ways to think about fairness, **neither should be used to calculate our specific number** because we do not know the Administration's utility function or true budget constraint.

  However, the **Kalai-Smorodinsky logic is superior for rhetorical framing**, while the **"Split the Difference" heuristic is superior for closing the deal.** I recommend we use KS arguments to justify why our counteroffer is "fair," but aim for a Schelling focal point (a clean number near the midpoint) to secure agreement before the semester starts.

  ---

  ### 1. The Frameworks: Nash vs. Kalai-Smorodinsky
  Both solutions start with a **Disagreement Point ($d$)**: what happens if we walk away.
  *   **Our $d$:** $34k stipend, no dental (Status Quo Ante).
  *   **Admin $d$:** $34k stipend, no dental (Status Quo Ante).
  *   *Note: Since the contract rolls over automatically, our leverage is lower than a strike scenario. The Admin is comfortable at $d$; we are not.*

  **The Nash Bargaining Solution (NBS)** maximizes the product of our gains: $\max(u_{union} - d_{union})(u_{admin} - d_{admin})$.
  *   *Implication:* NBS tends to split the *surplus* based on risk aversion and the curvature of the utility frontier.
  *   *Problem:* We don't know the Admin's utility curve. Is $1 of stipend cost equal to $1 of disutility for them? Unlikely. They face political/budget constraints we can't see.

  **The Kalai-Smorodinsky Solution (KS)** replaces NBS's "Independence of Irrelevant Alternatives" with **Monotonicity**. It maintains the ratio of maximum possible gains.
  *   *Mechanism:* Draw a line from the Disagreement Point ($d$) to the **Ideal Point** (the best possible outcome for each side). The solution is where that line hits the Pareto frontier.
  *   *Implication:* Fairness is defined by how much you concede relative to your *maximum possible claim*, not relative to the other side's claim.

  ### 2. Concretely Defining the Points
  To use KS, we must define the "Ideal Points" ($U_{max}, A_{max}$). This is the strategic battleground.

  *   **Disagreement Point ($d$):** $34k, No Dental. (Fixed)
  *   **Union Ideal ($U_{max}$):** $45k + Full Dental. (Our Opening Ask)
      *   *Strategic Note:* In KS, if we successfully argue $45k is a "reasonable maximum," the solution line tilts toward us. If we allow $U_{max}$ to be revised down too early, we lose leverage.
  *   **Admin Ideal ($A_{max}$):** $34k + No Dental. (Their True Preference)
      *   *Strategic Note:* They will argue their "maximum concession" is $38k. We must reject this. Their "Ideal" in the KS framework is the status quo; their "Limit" is what they can afford.

  **The KS Calculation (Hypothetical):**
  If we treat Stipend as the only transferable utility:
  *   Total Surplus to Split: $45k (Union Max) - $34k (Admin Max) = $11k range.
  *   Current Gap: $45k (Ask) - $38k (Offer) = $7k.
  *   **NBS/"Split Difference" Logic:** Meet at $41.5k.
  *   **KS Logic:** We concede $X$ from our ideal; they concede $Y$ from their ideal. Fairness requires $\frac{X}{U_{max} - d} = \frac{Y}{A_{max} - d}$.
      *   *Translation:* "We have moved 30% from our opening ask; you need to move 30% from your absolute floor."

  ### 3. Recommendation: Use KS for Framing, Not Math
  **Do not bring a spreadsheet calculating the KS solution to the table.** The Admin will reject the axioms (specifically our definition of $U_{max}$).

  **Instead, use the KS intuition for rhetoric:**
  > "We aren't just asking for the midpoint. We are asking for a settlement that reflects proportional concessions from the reasonable bounds of this negotiation. We have moved significantly from our opening ask; the University needs to move proportionally from their floor, not just their last offer."

  This counters the "Split the Difference" faction who want to meet at $41.5k immediately. Meeting at the midpoint of *current offers* rewards the Admin for making a lowball offer ($38k). KS logic argues the midpoint should be based on *reasonable ranges*, not tactical anchors.

  ### 4. The Honest Assessment: When to Ignore the Theory
  There is a strong case for the "dumb midpoint" strategy, grounded in **Schelling Focal Points**, not bargaining axioms.

  1.  **Transaction Costs:** We are running out of time (semester start). Complex fairness arguments delay deals. "Split the difference" is a universal social norm that allows both sides to claim victory and save face.
  2.  **Unknown Frontier:** Game theory assumes a known feasible set. We don't know the Admin's budget. If their true max is $39k, holding out for a KS-fair $42k results in impasse ($34k).
  3.  **Power Asymmetry:** NBS and KS assume symmetric ability to endure disagreement. We cannot. The contract rolls over; they can wait us out. Our BATNA is worse than theirs. This shifts the NBS solution toward *their* ideal, regardless of fairness axioms.

  **Actionable Strategy for Thursday:**
  1.  **Counteroffer:** Propose **$42k + Dental**.
      *   *Why:* It is slightly above the arithmetic midpoint ($41.5k), signaling we haven't fully capitulated, but it is a clean "focal" number.
  2.  **Framing:** Use KS language verbally ("proportional concessions"), but offer a NBS-style number (near the split).
  3.  **Concession Management:** If we move to $42k, explicitly state this is our "final movement" based on proportional fairness. Do not leave room for them to expect another split.
  4.  **Dental:** Do not split the difference on dental. Either fully paid or a fixed lump sum equivalent. Copays create administrative friction and signal "benefit reduction."

  **Bottom Line:** Use Kalai-Smorodinsky to justify why we aren't accepting $38k. Use Schelling Focal Points ($42k) to get the deal signed.

  Let's discuss this framing in prep on Wednesday.
