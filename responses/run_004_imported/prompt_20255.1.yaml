answer: |-
  This is a fantastic philosophical knot to hang a courtroom scene on. You have remembered the Hart-Fuller debate and the Radbruch Formula correctly from grad school. The tension you're describing is exactly where the friction lies: **Is it better to be honest about retroactive punishment (Hart) or to preserve the integrity of the legal system by denying the tyrant's rules were ever "law" (Fuller/Radbruch)?**

  However, before I draft the argument, I need to flag a crucial dramatic/legal logic point that might affect your scene.

  ### The Role Reversal Check
  In the actual "Grudge Informer" cases (and the Hart-Fuller debate), the roles are typically the opposite of your setup:
  *   **The Prosecutor** argues the Natural Law/Radbruch position ("The old statute was so evil it was never valid law; therefore, your client committed murder, not legal enforcement").
  *   **The Defense** argues the Positivist/Hart position ("The statute was on the books and valid at the time; my client acted legally. Convicting him now is *ex post facto* punishment").

  If your **Defense Attorney** argues the old statute was *not* law, they are essentially arguing that their client's actions had **no legal justification**, which usually helps the Prosecution secure a murder conviction.

  *   **Unless:** Your Defense Attorney is trying to argue that because the statute was void, the *State* is the murderer, and their client was merely a dupe? Or perhaps you meant the **Prosecutor** is making this speech?
  *   **Dramatic Suggestion:** If you keep the Defense Attorney making this argument, it creates a fascinating tension where the lawyer is arguably sacrificing the client to make a philosophical point about the regime. But if you want a standard trial dynamic, this is the Prosecutor's speech.

  Below is the strongest version of the **"Extreme Injustice is Not Law"** argument (Fuller/Radbruch side). I have written it to specifically answer Hart's "dishonest retroactivity" critique, as you requested. You can assign it to whichever character serves your plot best.

  ***

  ### The Argument: "The Nullity of Tyranny"

  **The Core Philosophical Move:**
  To answer Hart, you cannot simply say "It was evil." You must argue that law has *functional requirements*. A rule that demands the destruction of the very social bonds law is meant to protect is not a "bad law"; it is a performative contradiction. It is force masquerading as law. Therefore, declaring it void is not retroactive; it is recognizing a nullity that existed *then*, just as we recognize a contract signed at gunpoint is void *now* without passing a new law to say so.

  **The Speech Draft:**

  > "The Defense [or Prosecution] asks us to be honest. They say: 'Admit the old statute was law. Admit you are punishing this man for acts that were legal when he committed them. Pass a new retroactive law and own the cost.'
  >
  > It sounds principled. It sounds like legal positivism. But it is a trap.
  >
  > If we pass a retroactive law to convict this man, we admit that the Revolution is just another power grab. We admit that law is merely what the sovereign commands, whether that sovereign is a dictator in a palace or a parliament in a capital. We validate the Tyrant's claim: that his word, written on paper, was Law.
  >
  > But law is not just ink on paper. Law is a bridge between human beings. It requires trust. It requires that a rule guides conduct rather than destroying the possibility of conduct. When a statute demands that a neighbor betray a neighbor over a joke; when a rule punishes speech not because it harms, but because it breathes; it ceases to function as law. It becomes a weapon.
  >
  > Mr. Hart would tell you that calling this weapon 'non-law' is a semantic trick to hide the sting of retroactivity. He is wrong. It is not a trick. It is a distinction between a game played by rules and a game played by butchers.
  >
  > Consider a contract signed at gunpoint. We do not need a new statute to tell us that contract is void. It was void the moment the gun was drawn. Why? Because the coercion destroyed the very condition of 'contract.'
  >
  > The statute under which my client [or the defendant] acted was that gun. It was a command so monstrous it shattered the inner morality of law itself. To say it was 'valid law' is to say that a gang of robbers has a legislature.
  >
  > We are not punishing the defendant for breaking a new rule we wrote yesterday. We are punishing him for collaborating in the suspension of Law itself. We are asserting that the Republic did not begin last month. The Republic was here, waiting, buried under the rubble of the old regime. By declaring that statute null *ab initio*—from the start—we are not reaching backward. We are reaching *through* the tyranny to touch the continuity of justice that never actually died.
  >
  > If we call it 'law,' we let the Tyrant define reality. If we call it what it was—a crime disguised as a statute—we take reality back."

  ***

  ### The Counter-Argument (The Hart/Positivist Rebuttal)
  For the scene to work, the opposing counsel needs to hit the pressure point you mentioned: **The danger of judicial discretion.** If judges can decide which laws are "too evil" to count, isn't that just tyranny in reverse?

  > "Counsel speaks beautifully of justice. But who decides?
  >
  > Today, we agree the old regime was evil. So we say their laws were void. But tomorrow? What if a future court decides *our* laws are too 'unjust' to be valid? What if they decide *this* trial is a violation of some higher morality?
  >
  > By denying the old statute was law, you are not protecting justice. You are removing the only solid ground we stand on. You are asking this court to be a moral oracle, not a legal tribunal.
  >
  > Yes, it is painful to admit we must punish this man retroactively. It is ugly. But it is honest. We should pass a bill tonight that says: 'What he did was legal then, but we choose to punish it now.'
  >
  > Why? Because that forces us to look at the cost. That forces the legislature to take the blame, not the judges. When you pretend the law was always on our side, you lie. And a legal system built on a lie about its own past cannot stand."

  ### Where the Pressure Point Lies
  The dramatic tension in this scene shouldn't just be "Guilt vs. Innocence." It should be about **the foundation of the new country.**

  1.  **Hart's Warning:** If you lie and say "it wasn't law," you set a precedent that judges can invalidate statutes based on morality. This creates legal uncertainty (Positivism's fear).
  2.  **Fuller/Radbruch's Hope:** If you tell the truth and say "it was law but we are punishing him anyway," you admit the new regime is also violating the principle of *nullum crimen sine lege* (no crime without law). This undermines the new regime's claim to be more righteous than the old one.

  **The "Answer" baked into the argument:**
  The strongest version of the Fuller/Radbruch argument (which I put in the speech above) is that **Legal Certainty is not the highest good.** A system that provides certainty about evil is not a legal system; it is a management system for a prison. The "retroactivity" isn't hidden; it's re-contextualized. We aren't changing the rules of the game; we are declaring that *no game was being played*, only slaughter.

  ### A Note on the "Defense" Role
  If you keep the **Defense Attorney** making the "It wasn't law" argument, here is how you make it make sense for the client:
  *   **The "Duress/Systemic Guilt" Angle:** The Defense argues, "The statute was void. Therefore, my client had no legal duty to report. He acted as a private citizen. But because the *State* created this atmosphere of terror, the State is the principal murderer. My client is a small fish in an ocean of state crime. Convicting him validates the idea that individuals are responsible for the State's void decrees."
  *   **The Risk:** This is a high-wire act. It admits the client caused the death but blames the vacuum of law.

  If you switch it to the **Prosecutor**, the scene becomes a classic "Law vs. Justice" showdown, which fits the Hart-Fuller debate perfectly.

  This is rich material. The key to not making it a strawman is ensuring both sides admit the *cost* of their position. Hart admits the cost is retroactive injustice. Fuller admits the cost is legal uncertainty. The winner is whoever convinces the judge which cost the new nation can survive.
