answer: |-
  **Title:** Deterministic Chance? Evaluating the Derivation of the Born Rule in Everettian and Bohmian Mechanics

  **Introduction**

  The measurement problem in quantum mechanics is often framed as a conflict between unitary dynamics and definite outcomes. However, for the graduate student of metaphysics, a subtler, perhaps more intractable problem lurks beneath the ontology: the problem of probability. In orthodox Copenhagen quantum mechanics, the Born rule is a primitive nomological postulate; nature is fundamentally stochastic, and $|\psi|^2$ dictates the propensity for collapse outcomes. There is no explanation for *why* this measure governs chance, only the empirical verification that it does.

  The appeal of deterministic interpretations—specifically Everettian (Many-Worlds) and Bohmian (Pilot-Wave) mechanics—lies in their removal of fundamental stochasticity. The universal wavefunction evolves unitarily; particles follow determinate trajectories. Yet, to be empirically adequate, both must recover the Born rule. This creates a profound tension: how does one derive objective probabilities, or their functional equivalent, from a theory where everything that can happen *does* happen (Everett) or where the future is fixed by initial conditions (Bohm)? This essay argues that while both programs face charges of circularity, the Bohmian program succeeds more effectively in making sense of quantum probability. By reducing quantum randomness to classical statistical ignorance via the typicality argument, Bohmian mechanics offers a coherent explanatory framework that Everettian decision theory cannot match, as the latter founders on the conceptual incoherence of uncertainty in a branching universe.

  **The Everettian Impasse: Decision Theory and the Incoherence Problem**

  The Everettian approach to probability is perhaps the most ambitious in contemporary physics. Since all outcomes of a measurement are realized in distinct branches of the wavefunction, there is no objective uncertainty about the outcome *simpliciter*. To recover the Born rule, David Deutsch and David Wallace developed a decision-theoretic derivation. They argue that a rational agent situated in a branching universe, who accepts certain axioms of rationality (such as diachronic consistency and branching indifference), is compelled to place bets *as if* the Born rule were true. On this view, probability is not a measure of frequency or propensity, but a constraint on rational credence in the face of self-locating uncertainty.

  However, this derivation faces the "incoherence problem," forcefully articulated by Adrian Kent and David Albert. The core objection is that decision theory presupposes uncertainty, and uncertainty presupposes ignorance. In the Everettian picture, an agent who knows the theory knows with certainty that every possible outcome will occur. As Kent argues, it is incoherent to speak of "credence" regarding which outcome will occur when *all* will occur. Wallace attempts to rescue this by invoking "subjective uncertainty": prior to the split, the agent does not know which branch *they* will find themselves on. But this relies on a controversial metaphysics of personal identity (the "fission" view) that many find ad hoc. If the agent knows the physical state of the universe completely, and the physical state determines that both outcomes exist, then claiming uncertainty is merely a psychological gloss on a deterministic reality.

  Consequently, the Deutsch-Wallace derivation appears to smuggle in the conclusion. The axioms of rationality required to derive the Born rule (specifically, the weighting of branches) seem to implicitly presuppose the very measure they aim to derive. If an agent does not weight branches by $|\psi|^2$, they are deemed "irrational," but this looks less like a derivation of probability and more like a stipulation that rational agents must act *as if* the Born rule is true, without explaining why the physical world conforms to this rationality. The Everettian program thus secures the *form* of the Born rule at the cost of the *concept* of probability.

  **The Bohmian Route: Quantum Equilibrium and Typicality**

  Bohmian mechanics avoids the ontological proliferation of Everett but faces a different challenge. The theory is deterministic: given the initial wavefunction and the exact initial positions of all particles, the future is fixed. Probability enters only through our ignorance of the initial configuration. To recover standard quantum predictions, one must assume the "Quantum Equilibrium Hypothesis" (QEH): that the initial distribution of particle configurations $\rho$ is equal to $|\psi|^2$.

  Critics argue that positing $\rho = |\psi|^2$ is no less brute than Copenhagen's postulation of the Born rule. However, the defense mounted by Dürr, Goldstein, and Zanghì (DGZ) shifts the ground from dynamical law to statistical typicality. Drawing on Boltzmannian statistical mechanics, DGZ argue that we do not need to assume the universe *is* in quantum equilibrium, only that it is *typical* with respect to the $|\psi|^2$ measure. They demonstrate that for a typical initial configuration (where "typical" is defined by the $|\psi|^2$ measure), the empirical statistics of subsystems will obey the Born rule, regardless of the specific trajectory.

  The charge of circularity here focuses on the choice of the typicality measure. Why is $|\psi|^2$ the correct measure for typicality? DGZ reply that this measure is uniquely privileged by the dynamics: it is the unique equivariant measure. That is, if $\rho = |\psi|^2$ at one time, the continuity equation ensures it remains so for all time. This grants the measure a nomological status distinct from a mere statistical assumption. It is not that we assume the Born rule; it is that the structure of the configuration space and the guiding equation single out $|\psi|^2$ as the natural measure of "size" for sets of initial conditions.

  While this does not explain why *our* specific universe started in a typical configuration (a problem shared by classical statistical mechanics), it explains why, *given* that we observe statistical regularities, they conform to the Born rule. The probability is epistemic (rooted in ignorance of position) rather than ontological, but the connection to the physical dynamics is rigorous. The circularity is mitigated because the measure is derived from the equivariance of the Schrödinger dynamics, not imposed as a rule for collapse or betting.

  **Comparative Assessment and Verdict**

  When weighing these programs against the criterion of explaining the Born rule without circularity, a clear distinction emerges. The Everettian program attempts to derive probability from rationality, but it fails to solve the antecedent metaphysical problem: in a deterministic multiverse where all outcomes are realized, there is no ontological ground for probability to stand on. The decision-theoretic axioms effectively stipulate the Born rule under the guise of rationality constraints. As Albert suggests, this is "physics by persuasion." It improves on Copenhagen ontologically (no collapse) but regresses explanatorily regarding probability, rendering it a subjective illusion.

  The Bohmian program, conversely, accepts that probability is a feature of our epistemic relation to the system, grounded in initial conditions. The appeal to typicality is indeed a postulate, but it is a postulate of the same kind used in classical statistical mechanics, a framework we accept as explanatory. The charge that choosing the $|\psi|^2$ measure is question-begging is less potent than the charge against Everett, because the Bohmian measure is dynamically distinguished (equivariant). It does not require redefining "uncertainty" or "rationality" in counter-intuitive ways; it requires only that we accept the universe began in a typical state.

  Therefore, the Bohmian program is more successful. It recovers the Born rule as a theorem of typicality within a deterministic dynamics, whereas Everett recovers it as a constraint on betting behavior within a deterministic multiverse. Does Bohmian mechanics genuinely improve on Copenhagen's brute postulation? Yes. Copenhagen posits the Born rule as a fundamental law of nature with no mechanism. Bohmian mechanics posits the Born rule as a statistical consequence of initial conditions and dynamical flow. While the initial condition ($\rho = |\psi|^2$) is contingent, locating the source of randomness in ignorance rather than fundamental indeterminism provides a clearer metaphysical picture. It demystifies quantum probability by assimilating it to classical statistical probability.

  **Conclusion**

  The convergence of deterministic theories on the Born rule is indeed suspicious if one expects probability to emerge from nothing. However, the suspicion should be directed differently at each theory. For Everett, the suspicion is fatal: the theory lacks the conceptual resources to make sense of probability at all, rendering the Deutsch-Wallace derivation a sophisticated exercise in labeling. For Bohm, the suspicion is manageable: the theory relies on a typicality postulate that, while not logically necessary, is physically natural and dynamically grounded.

  My verdict is that Bohmian mechanics offers a superior explanation of the Born rule. It avoids the conceptual incoherence of Everettian probability and provides a mechanism (typicality of initial configurations) that renders the Born rule intelligible as a statistical phenomenon rather than a brute law. While neither theory eliminates all axiomatic starting points, Bohmian mechanics reduces the mystery of quantum probability to the familiar mystery of statistical mechanics, whereas Everettian mechanics compounds the mystery of probability with the mystery of branching identity. In the specific task of making sense of the Born rule, Bohm succeeds where Everett merely calculates.
