answer: |-
  This is a profound epistemological dilemma that strikes at the heart of how modern knowledge functions. You are describing the tension between **epistemic efficiency** (your position) and **epistemic security** (your friend's position).

  Your friend is not intellectually lazy; she is reacting to a genuine vulnerability in human knowledge. However, her solution is logically incoherent and practically impossible. You are not intellectually lazy either; you are participating in the **division of epistemic labor**, which is the only way complex civilization functions. However, your current heuristic ("nobody I trust has said otherwise") is too passive.

  The defensible line lies not in choosing between trust and verification, but in adopting a system of **calibrated credence**. Here is how to distinguish between a discipline worth practicing and a trap to avoid, and how to determine when corroboration is required.

  ### 1. The Incoherence of Radical Self-Reliance
  Your friend's position suffers from a fatal bootstrapping problem. To adopt the rule "I will only believe what I can verify," she had to learn that rule, understand its logic, and accept its validity. Did she verify the principles of logic herself? Did she derive the scientific method from first principles? Almost certainly not. She accepted those tools on testimony from teachers, books, or institutions.

  If she applies her rule consistently, she must doubt the tools she uses to verify things. Furthermore, her comparison of the **grandmother's story** to the **moon landing** is a category error.
  *   **The Grandmother:** This is *testimonial memory*. It is singular, unrecorded, emotionally charged, and subject to the well-documented fallibility of human recall. Discrepancies here are expected.
  *   **The Moon Landing:** This is *consilient physical evidence*. It is supported by telemetry data, rock samples, retroreflectors still used by independent observatories today, and confirmation by a geopolitical rival (the USSR) who had every incentive to expose a hoax but never did.

  Your friend is treating all second-hand information as a single category ("someone else's word"). In reality, there is a vast spectrum between "my cousin says Grandma said" and "400,000 engineers and two superpowers agree on physical data."

  ### 2. The Danger of Passive Trust
  While your friend's extreme is incoherent, your current habit has risks. Relying on "researchers I trust" works well until the consensus shifts or the trust is misplaced (e.g., the replication crisis in psychology, or the opioid crisis driven by trusted medical journals).

  The phrase "nobody I trust has said otherwise" is the weak link. It assumes that if a claim were false, a dissenting expert would have emerged and reached your network. This ignores:
  *   **Silenced dissent:** Sometimes contrarians are marginalized.
  *   **Echo chambers:** Your trusted network might share the same blind spots.
  *   **Lag time:** Science often corrects itself slower than journalism reports it.

  ### 3. Finding the Line: Four Criteria for Corroboration
  You do not need to verify claims yourself to be epistemically responsible. Instead, you need to audit the **structure of the claim**. Before accepting a claim as "known," run it through these four filters. The more a claim fails these filters, the more independent corroboration it needs.

  #### A. Consilience (Convergence of Evidence)
  *   **Question:** Does this claim rest on a single study/testimony, or do independent lines of inquiry point to the same conclusion?
  *   **Application:**
      *   *Grandma's Story:* Low consilience. One memory vs. another. **Verdict:** Suspend judgment.
      *   *Moon Landing:* High consilience. Photos, rocks, radio signals, enemy tracking. **Verdict:** Accept.
      *   *Particle Physics:* High consilience. Data is reviewed by thousands, experiments are replicated at CERN, Fermilab, etc. **Verdict:** Accept.
      *   *New Diet Study:* Low consilience. One observational study. **Verdict:** Demand more corroboration before reporting as fact.

  #### B. Incentive Structures
  *   **Question:** Who benefits if this claim is accepted as true?
  *   **Application:**
      *   *Grandma:* May benefit from seeing herself as a brave survivor (narrative benefit).
      *   *Pharma Company:* May benefit financially from a drug's efficacy. (Requires high scrutiny).
      *   *Cosmologist:* Gains prestige from discovery, but loses reputation if fraud is found. The incentive is generally toward accuracy within the peer community.
      *   *Rule:* The higher the potential gain from deception, the higher the burden of proof.

  #### C. Mechanism of Error
  *   **Question:** If this claim is wrong, *how* did it go wrong?
  *   **Application:**
      *   *Memory:* We know the mechanism of error (neurodegeneration, trauma, time). It is highly probable.
      *   *Instrumentation:* We know the mechanism of error (calibration, noise). It is measurable and quantifiable.
      *   *Rule:* If the mechanism of error is high-probability and unquantifiable (like memory), trust less. If it is low-probability and quantifiable (like error bars in physics), trust more.

  #### D. Verifiability *in Principle*
  *   **Question:** Could *someone* check this, even if I cannot?
  *   **Application:**
      *   Your friend demands she verify it. You should demand that the claim is *verifiable by a competent peer.*
      *   If a company says "Our algorithm works" but the code is proprietary, you cannot verify it, and neither can independent experts. **Trust less.**
      *   If a physicist says "The Higgs boson exists," the data is archived. A competent team *could* re-analyze it. **Trust more.**

  ### 4. A New Professional Habit
  You asked if your friend is onto a discipline the rest of us are too lazy to practice. She is onto the *need* for vigilance, but she has chosen the wrong tool. The discipline you should practice is not **Self-Reliance**, but **Epistemic Vigilance**.

  Here is how to adjust your workflow without becoming a solipsist:

  1.  **Shift from "Known" to "Confidence Levels."** Stop writing that something "is" the case. Write that "evidence strongly suggests." This acknowledges the division of labor without claiming personal verification.
  2.  **Audit the Consensus, Not Just the Claim.** When you phone a second expert for fact-checking, don't just ask "Is this true?" Ask "Is there significant dissent on this?" and "What would change your mind?"
  3.  **Distinguish Between "Settled" and "Frontier."**
      *   *Settled Science (Age of Universe):* Trust is reasonable. The cost of verifying it yourself outweighs the risk of error.
      *   *Frontier Science (New Mutation Risk):* Trust is provisional. Here, your friend's instinct is valuable. Highlight the uncertainty.
  4.  **Follow the Data Trail.** You don't need to re-derive the math, but you should ensure the data exists. If a claim is made without a path to the underlying evidence (e.g., a press release with no linked paper), treat it as unverified.

  ### Conclusion
  Your friend has reasoned herself into a position that is **coherent only in isolation**. It collapses the moment she interacts with the world, because she cannot function without trusting the language she speaks, the logic she uses, and the instruments she relies on.

  However, she is right that **uncritical trust is a vulnerability.** The defensible line is this: **Trust is the default, but it must be active, not passive.**

  You are justified in accepting the age of the universe without checking the math, because the *system* that produced that number is designed to be self-correcting and transparent. You are *not* justified in accepting a family anecdote or a corporate press release with the same weight, because those systems lack error-correction mechanisms.

  Don't try to be your own expert. Instead, be an expert at **evaluating experts.** That is the defensible middle ground.
