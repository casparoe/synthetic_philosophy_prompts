answer: |-
  This is a fantastic question. You have hit on exactly the right intuition: on the surface, it *does* seem like an expressivist could just say, "Okay, the conditional expresses a complex attitude."

  The reason this doesn't satisfy philosophers is that it threatens to break **logic itself**, or at least makes moral logic look completely different from ordinary logic.

  To explain why your "obvious response" doesn't quite work, we need to look closely at what makes an argument **valid**. I will avoid formal symbols and stick to plain English.

  ### 1. The Setup: A Valid Argument
  Imagine you are trying to convince a friend of something. You use this argument:

  1.  **Premise 1:** Lying is wrong.
  2.  **Premise 2:** If lying is wrong, then getting your little brother to lie is wrong.
  3.  **Conclusion:** Therefore, getting your little brother to lie is wrong.

  Intuitively, this is a **valid** argument. If you accept Premise 1 and Premise 2, you are logically forced to accept the Conclusion. You can't say, "I agree with 1 and 2, but I reject the Conclusion," without making a mistake in reasoning.

  ### 2. The Expressivist Translation
  Now, let's put on our Expressivist hats.
  *   To say "Lying is wrong" is not to state a fact. It is to express an attitude. Let's simplify and say it means **"Boo lying!"**

  So, how does the Expressivist translate **Premise 1**?
  *   **Premise 1:** "Boo lying!" (I am expressing disapproval of lying.)

  Now, look at **Premise 2**: *"If lying is wrong, then..."*
  Here is the first snag. When you say "If lying is wrong...", are you saying "Boo lying!"?
  *   **No.** You are not actually booing lying in Premise 2. You are merely *considering* the idea of lying being wrong hypothetically. You might not even dislike lying yourself; you might just be explaining the logical consequences to someone who *does* dislike it.

  So, in Premise 2, the phrase "lying is wrong" cannot mean "Boo lying!" because you aren't actually booing.

  ### 3. The Trap: Equivocation
  This is the heart of the Frege-Geach problem.

  For an argument to be valid, the terms must mean the **same thing** every time they appear.
  *   **Valid:** All **banks** have money. The river has a **bank**. Therefore, the river has money. (This is **invalid** because "bank" means two different things. This is called *equivocation*.)

  In our moral argument:
  *   In **Premise 1**, "Lying is wrong" means **"Boo lying!"** (An expressed attitude).
  *   In **Premise 2**, "Lying is wrong" appears inside an "If" clause. It cannot mean "Boo lying!" (because no attitude is being expressed). It must mean something else—perhaps "The attitude of booing lying is held."

  If the meaning of "Lying is wrong" changes between Premise 1 and Premise 2, the argument commits the fallacy of **equivocation**. It becomes like the river bank argument. It looks valid, but it's actually a trick of language.

  But the argument *doesn't* feel like a trick. It feels like solid logic. The Frege-Geach problem charges Expressivism with making it impossible to explain *why* the logic works.

  ### 4. Why Your "Obvious Response" Doesn't Fix It
  Your instinct was: *"Why not just say the whole conditional expresses a more complicated attitude?"*

  For example, you might suggest that Premise 2 expresses a complex attitude like: **"Boo to [lying AND failing to boo getting your brother to lie]!"**

  This is a very clever move, and sophisticated expressivists (like Allan Gibbard or Simon Blackburn) try to do something similar. However, here is why it is still considered a "problem" that needs solving, rather than a quick fix:

  #### A. It breaks the "Lego" nature of logic
  Logic works because sentences are built out of reusable blocks.
  *   Block A: "It is raining."
  *   Block B: "The ground is wet."
  *   Argument: If **A**, then **B**. **A**. Therefore **B**.

  The magic of logic is that **A** stays the same block whether it is standing alone or inside the "If."
  If your theory requires that:
  *   "Lying is wrong" (standing alone) = **Attitude Type 1**
  *   "Lying is wrong" (inside an 'If') = **Attitude Type 2**
  *   "Lying is wrong" (inside a 'Not') = **Attitude Type 3**
  *   "Lying is wrong" (inside a question) = **Attitude Type 4**

  ...then you no longer have reusable blocks. You have a different mental state for every single grammatical context. You haven't explained the logic; you've just created a unique name for every possible sentence structure. You can't explain *why* the argument is valid, because there is no shared component linking Premise 1 to Premise 2.

  #### B. It makes disagreement mysterious
  Imagine I say "Lying is wrong" (Boo lying!) and you say "Lying is not wrong."
  *   In a factual view, we disagree because we can't both be right about the facts.
  *   In your "complex attitude" view, I am expressing **Attitude X** and you are expressing **Attitude Y**.

  Why are these incompatible? I can like chocolate and you can dislike chocolate without there being a logical contradiction. If moral statements are just attitudes, why is it "illogical" for me to hold Attitude X and you to hold Attitude Y? The Frege-Geach problem highlights that Expressivism struggles to explain moral **disagreement** as anything more than a clash of tastes (like arguing over ice cream flavors), yet moral arguments behave like clashes of facts.

  ### 5. The "Truth" Problem
  The deepest reason this is hard is that logic is traditionally defined by **truth**.
  *   An argument is valid if: *When the premises are TRUE, the conclusion MUST be TRUE.*

  Expressivism says moral sentences **aren't the kind of things that can be true or false**. They are like commands ("Close the door!") or cheers ("Go team!").
  *   "Close the door!" is not true or false.
  *   "If close the door, then..." doesn't make sense.

  If moral sentences can't be true or false, how can they fit into logical structures that rely entirely on truth preservation?
  *   Your "complex attitude" solution tries to bypass truth. But then you have to invent a whole new definition of "validity" that applies *only* to moral attitudes, without explaining why it mirrors the logic we use for math, science, and everyday facts.

  ### Summary
  The Frege-Geach problem isn't just that expressivists haven't thought of complex attitudes. It's that:

  1.  **Consistency:** To preserve logic, the phrase "lying is wrong" must mean the exact same thing in Premise 1 and Premise 2.
  2.  **Assertion vs. Embedding:** Expressivism says the meaning *is* the expression of an attitude. But you don't express that attitude in Premise 2. Therefore, the meaning changes.
  3.  **Validity:** If the meaning changes, the argument is invalid (equivocation). But the argument *is* valid.
  4.  **Your Solution:** Proposing a "complex attitude" for the conditional admits that the meaning *is* different in the conditional than it is on its own. This saves the expressivist from saying nonsense, but it forces them to explain how two *different* meanings can still link up to create a valid logical argument.

  Philosophers don't think this proves Expressivism is false, but they do think it proves Expressivism is **incomplete**. An expressivist has to work very hard to show how "attitudes" can play by the same logical rules as "facts" without actually being facts. That hard work is what modern meta-ethics (specifically *Quasi-Realism*) is largely about.

  So, your instinct was the right starting point, but the "difficulty" lies in showing that your complex attitude preserves the rigid structure of logic without secretly smuggling in factual truth.
