answer: |-
  This is a classic tension in moral philosophy applied to digital labor. The literature on supererogation (acts that are good to do but not wrong to omit) grapples exactly with the instability of "optional goodness" over time.

  Here are the three specific implications from the debate that have teeth for your situation.

  ### 1. The Precedent Trap: Does repetition create duty?
  **The Philosophical Debate:**
  There is a contentious sub-debate in supererogation literature regarding **habituation**. If an agent performs a supererogatory act repeatedly (e.g., saving a drowning person every Tuesday), does it become obligatory on the next Tuesday?
  *   **The Strict View:** No. Moral obligation is determined by the nature of the act and the relationship, not by history. You cannot "accidentally" contract a moral duty by being too nice previously.
  *   **The Normative View:** Yes, in a social sense. While the *moral* duty doesn't change, the **legitimate expectation** does. Philosophers like David Heyd argue that supererogation exists within a social context. If you establish a pattern of "heroic" behavior, you alter the baseline of what is considered "normal" for your role.

  **Implication for You:**
  You are experiencing the **Normative View** in real-time. Morally, you owe them nothing. But sociologically, you have shifted the "baseline of normalcy."
  *   When you fix a security bug at 2 AM, you aren't just fixing a bug; you are signaling a **Service Level Agreement (SLA)** that doesn't exist.
  *   Users do not track your *moral intent* (generosity); they track your *behavioral output* (reliability).
  *   **The Teeth:** Repetition *does* change the status of the act, not because you are morally bound, but because you have unilaterally rewritten the social contract. The act shifts from "gift" to "feature." Once it is a feature, its absence is a bug.

  ### 2. The User's Complaint: Category Error or Coherent Claim?
  **The Philosophical Debate:**
  This touches on the distinction between **Moral Obligations** and **Role Obligations**.
  *   **Category Error:** From a strict ethical standpoint, the users are wrong. You are a hobbyist maintainer, not a fiduciary. Demanding unpaid labor is a category error regarding moral duty.
  *   **Coherent Complaint:** From a **Contractualist** or **Dependency** standpoint, the users are coherent. If your library is critical infrastructure, and you act like a steward, they have a pragmatic claim on reliability. They aren't arguing "you owe me morally"; they are arguing "you have positioned yourself as the provider, and providers provide."

  **Implication for You:**
  The entitled reaction is a **category error ethically, but a coherent complaint pragmatically.**
  *   Users are not reacting to your *status* (unpaid volunteer); they are reacting to your *signals* (rapid response, high-quality docs).
  *   In the literature of the "Gift Economy" (Lewis Hyde), a gift creates a bond. If the giver keeps giving without allowing the receiver to reciprocate or acknowledge the cost, the bond turns toxic. The receiver feels indebted, and to resolve that cognitive dissonance, they convince themselves the gift was actually a *payment* for a service they are owed.
  *   **The Teeth:** Their entitlement is a defense mechanism. Admitting you are doing them a favor makes them beholden to your whims. Deciding you *owe* them makes them customers with rights. They are choosing the latter to preserve their own agency.

  ### 3. Preserving Optionality: How to stay generous without creating duty
  **The Philosophical Debate:**
  This is the **"Paradox of the Good Samaritan."** If a Good Samaritan is always available, they cease to be a Samaritan and become a public utility. To remain supererogatory, the act must retain the **possibility of omission.**
  *   **Signaling Theory:** For an act to be perceived as supererogatory, the cost/optionality must be visible. If the cost is hidden (you suffer in silence to fix the bug), users assume the cost was low.
  *   **The Right to Reserve:** Philosophers argue that to maintain the supererogatory status, the agent must explicitly reserve the right *not* to act.

  **Implication for You:**
  You cannot preserve generosity through consistency alone; you must preserve it through **strategic refusal.**
  *   **Visibility of Cost:** If you fix a bug late at night, do not just push the commit. Annotate the context. "Fixing this tonight so production doesn't burn, but I won't be available for features this week." Make the *sacrifice* visible, not just the *result*.
  *   **Intermittent Reinforcement:** If you say "yes" to every urgent request, "yes" becomes the default. You must occasionally say "no" to urgent things to prove that "yes" is still a choice. This feels counter-intuitive to a helper, but it is philosophically necessary to maintain the "optional" classification of your labor.
  *   **Decouple Urgency from Identity:** Do not let "The Maintainer Who Fixes Security Bugs Overnight" become your brand. If that is your identity, you are trapped. You must signal that you are "The Maintainer Who Works On Their Own Schedule."

  ### Summary of the "Teeth"
  1.  **Repetition creates normative expectation,** even if it doesn't create moral duty. You have trained users to expect heroism.
  2.  **Users aren't arguing morality;** they are arguing dependency. They treat your generosity as reliability because that is safer for their own planning.
  3.  **To stay generous, you must be willing to disappoint.** Supererogation requires the visible capacity to withhold. If you never withhold, you aren't being generous; you're being employed without pay.

  **The Principled Fix:**
  Stop trying to be consistently heroic. Be **consistently bounded.** A boundary that is occasionally porous (generosity) is sustainable. A boundary that is permanently open (heroism) is slavery. You must reintroduce the friction of your own optionality to reset the user's expectation from "service" back to "gift."
