answer: |-
  This is a fantastic question because it cuts to the core of Sidgwick's intellectual tragedy. You are absolutely right to link the *Methods of Ethics* to the Society for Psychical Research (SPR). For Sidgwick, psychical research wasn't a hobby; it was "empirical theology." If he could prove survival of death or telepathy, he could prove a moral order that reconciled Duty and Self-Interest, solving the "Dualism of Practical Reason" that haunted him.

  He *needed* psi to be true more than almost anyone. Yet, he is also the man who publicly dismantled the Creery sisters after years of believing in them.

  If we transport Sidgwick to 2011 to evaluate Daryl Bem's "Feeling the Future," we have to weigh his **desperation for a positive result** against his **commitment to evidentiary integrity**. Based on his actual track record and epistemic habits, I argue Sidgwick would have initially treated Bem with cautious optimism but would have ultimately become one of the study's most principled critics once the replication failures mounted. He would not have been a dogmatic skeptic, but he would have been a ruthless auditor.

  Here is how Sidgwick would likely parse the Bem controversy, grounded in his specific philosophical and methodological history.

  ### 1. The Initial Appeal: Legitimacy of Method
  Sidgwick founded the SPR specifically to move psychical research out of the parlor and into the laboratory. He was frustrated by anecdotal evidence (ghost stories, séance testimonials) because it was vulnerable to "idols of the cave" (bias) and fraud.

  Bem's 2011 paper would have appealed to Sidgwick immediately because it utilized **standardized academic protocols**. Bem didn't use crystal balls; he used habituation and priming tasks in a university setting, published in a top-tier journal (*Journal of Personality and Social Psychology*).
  *   **Sidgwick's View:** He would have appreciated that Bem was attempting to normalize the data. Sidgwick always argued that if psi existed, it should be subject to the same inductive rules as any other natural phenomenon. He would have initially defended Bem against the *ad hominem* attacks from materialists who dismissed the work out of hand. To Sidgwick, dismissing data because you dislike the implication is just as unscientific as accepting data because you want it to be true.

  ### 2. The Statistical Critique: "Selective Reporting"
  However, Sidgwick's rigor went deeper than just "lab coats." The SPR's early work was heavily focused on the **collection of negatives**. Sidgwick insisted on recording failures, not just successes. One of the SPR's major innovations was the "census of hallucinations," which attempted to get a baseline rate of experiences to compare against chance.

  The core criticism of Bem (levied by Wagenmakers and others) was **p-hacking** and **flexible data analysis**—essentially, running many variations of an experiment and only reporting the ones that worked.
  *   **Sidgwick's View:** This would trigger Sidgwick's "Creery alarm." In the Creery case, the initial success was real *until* they realized the conditions allowed for signaling. In Bem's case, the "signaling" is methodological flexibility. Sidgwick was acutely aware of the "law of large numbers" and the probability of coincidences. He frequently debated Edgeworth and other mathematicians within the SPR about statistical significance.
  *   Sidgwick would likely argue that for an *extraordinary* claim (one that violates causal temporality), the burden of proof is not just "p < .05" by standard social science metrics. He would demand that the **experimental design be pre-registered** (a modern solution to the problem he identified intuitively). If Bem could not guarantee that negative runs were reported with the same diligence as positive ones, Sidgwick would deem the evidence "vitiated by selection," much like the Creery tests were vitiated by sensory leakage.

  ### 3. The Replication Crisis: The Decisive Factor
  This is where Sidgwick's history with the Creery sisters becomes the strongest predictor of his behavior. When the SPR investigators discovered the Creery sisters were likely using a code of signals, Sidgwick did not hush it up. He did not say, "Well, the telepathy might still be real, let's give them the benefit of the doubt." He concluded that **the possibility of normal explanation invalidates the paranormal claim.**

  When independent labs failed to replicate Bem's results (the "Many Labs" projects, etc.), Sidgwick would view this as the discovery of the "signal."
  *   **Sidgwick's View:** For Sidgwick, the credibility of the *inquiry* was more important than the credibility of the *phenomenon*. He resigned from SPR committees when he felt they were becoming too credulous because he feared the SPR would be branded a haven for cranks. If Bem's results could not be replicated under strict, independent scrutiny, Sidgwick would publicly abandon the claim. He would argue that maintaining the result in the face of failed replication damages the long-term possibility of discovering *real* psi.

  ### 4. The Personal Stake: The Tragic Rationalist
  Here is the most poignant part of your query. Sidgwick's "Dualism of Practical Reason" left him in a state of existential distress. He wrote: *"I have never been able to see my way to any reconciliation of [egoism and utilitarianism]... I do not see how the conflict can be got over."* He hoped psychical research would provide the "sanction" for morality (i.e., you will be rewarded/punished in the afterlife).

  If Sidgwick were evaluating Bem, he would be *praying* for Bem to be right. This makes his potential rejection of Bem more significant.
  *   **The Verdict:** Sidgwick would likely conclude that Bem's study is a **false positive born of methodological laxity**, not a gateway to the moral order he desired.
  *   **Why?** Because Sidgwick was ultimately a **fallibilist**. In *The Methods of Ethics*, he admits that if rational inquiry cannot find the truth, we must acknowledge the limit of reason. He would apply this to Bem. He would say: *"I desire this result more than any other in science. But the evidence does not sustain it. To pretend otherwise is to lie, and a lie cannot support a moral order."*

  ### 5. What Would He Say to the "Replication Crisis Freakout"?
  Sidgwick would actually be unsurprised by the crisis. He spent his life navigating the tension between **scientific naturalism** and **human meaning**.
  *   He would critique the field of Psychology for relying on statistical rituals (p-values) rather than cumulative, robust evidence.
  *   He would critique the Skeptics for assuming the impossibility of the phenomenon *a priori*.
  *   He would conclude that **Bem failed not because psi is impossible, but because the methodology was insufficient to rule out the 'normal' explanation (bias).**

  ### Summary: The Sidgwickian Position
  Sidgwick would not land on "the result stands." He would land on: **"The result is intriguing but currently unproven, and the failure to replicate suggests the initial positive was an artifact of method."**

  He would be the guy in the room saying: *"We cannot accept this. Not because precognition is impossible, but because we have not yet eliminated the possibility of self-deception in the data analysis."*

  It would break his heart, just as the failure to find God broke his heart. But his intellectual honesty—the very trait that makes him a giant of philosophy—would force him to reject Bem's conclusions. He would likely write a paper titled *"On the Premature Acceptance of Anomalous Data,"* arguing that if we want psychical research to be taken seriously, we must be harder on ourselves than the materialists are on us.

  In the end, Sidgwick's reaction to Bem would mirror his reaction to his own ethics: **a stoic acceptance that the universe does not owe us a rational moral order, even if we construct the most rigorous experiments to find one.**
