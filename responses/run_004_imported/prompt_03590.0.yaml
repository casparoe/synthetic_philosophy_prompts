  **Move 1 (Nadia):** Score 1. This is the standard behavioral economics label for the phenomenon (escalation of commitment), and psychologically it is often the driver. However, it is slightly imprecise because the structure of the auction makes continuing locally rational to minimize loss, rather than purely ignoring sunk costs.

