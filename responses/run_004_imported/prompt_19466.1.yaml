      *   **The Unfolding Argument:** This is the killer. Functional equivalence vs. Structural difference. A recurrent net (conscious per IIT) vs. feedforward net (unconscious per IIT). If they do the exact same thing, why does the "light" turn off in one? This suggests $\Phi$ measures *architecture*, not *mind*.
      *   **The Verdict:** Here is where I take the stand.
