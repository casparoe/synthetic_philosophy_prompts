      *   **The IIT Fortress (Axioms & Postulates):** Explain *why* Tononi bites the bullet. It's not arrogance; it's deduction from axioms. Intrinsic existence (it exists for itself), Integration (unified), Exclusion (definite border). The math follows the philosophy. If the structure is there, the experience is there.
