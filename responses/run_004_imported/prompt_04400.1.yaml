  2.  **Evaluate Each Case (Causal Structure Analysis):**

      *   **Case 1: UC Berkeley Admissions (1973)**
          *   *Variables:* Gender (Treatment), Admission (Outcome), Department (Lurking).
          *   *Structure:* Gender $\to$ Department $\to$ Admission? Or Department $\to$ Admission and Gender $\to$ Admission?
          *   *Analysis:* Women applied to harder departments (lower acceptance rates overall). Men applied to easier departments. Department is a *mediator* of the effect of Gender on Admission *if* we view "choice of major" as part of the discrimination mechanism, but Bickel et al. argued Department is a *confounder* regarding the *department's* bias, or rather, the aggregation hides the fact that women chose competitive fields. However, Pearl argues that if Department is a mediator (Gender influences Department choice which influences Admission), stratifying blocks the indirect path. If the question is "Is there bias in the *admissions process* given the department?", stratification is correct. If the question is "Is there bias in the *university system* including application patterns?", aggregation might be relevant. Bickel concluded no bias *within* departments.
          *   *Consensus:* Generally treated as a classic case where stratification reveals the truth about departmental bias (Confounding by Department preference).
