          *   *Variables:* Treatment (Open vs. PCNL), Success (Outcome), Stone Size (Lurking).
          *   *Structure:* Stone Size affects Treatment choice (doctors assign complex cases to Open) and Stone Size affects Success (harder stones = lower success).
