          *   *Analysis:* This is not really causal. It's a mathematical artifact of weighting. "Year" isn't a confounder in a causal sense; it's a grouping variable. There is no intervention. Who is the "better" hitter? If we care about overall contribution, aggregate might matter. If we care about ability controlling for league difficulty, stratified matters. But there is no *causal mechanism* being obscured, just weighted averages.
