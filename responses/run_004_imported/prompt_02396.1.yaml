  ok this has been living in my head since last week lol. this guy in my grade asked this girl to homecoming by getting like 30 people to hold up letter cards spelling her name in the quad at lunch, plus he got her a giant bouqet that had to cost at least $100. everyone was living for it, saying stuff like "omg he really likes her," and she said yes right on the spot. but here's what's bugging me: if he'd just walked up and asked her the exact same words in private with zero audience, would that actually mean he liked her any less? the whole public production doesn't really prove anything by itself, he could've wanted the attention for himself, his friends could've dared him into it, or he could just be rich enough that $100 and a little embarrassment cost him basically nothing. but everyone (me included, ngl) still treats the expensive, go-for-broke version as WAY more "real" proof of liking someone than just saying it plainly would've been.

  me and my friends got into a whole debate about this at lunch, half of us think the big public display is kind of dumb and wasteful, and the other half think the waste/risk is literally the whole point, like it wouldn't count otherwise. so which side is right? is there an actual reason why making a gesture more costly or more embarrassing to pull off would make someone's feelings MORE believable instead of less, or are we just letting movies and social media trick us into confusing effort with love? and if there is a real reason, does the same logic explain why people our age spend so much extra on certain brand name stuff just to look successful, or is that a totally seperate thing? i don't want the "it shows you care" answer btw, since that kind of just restates what i'm confused about instead of actually explaining why it would work.
