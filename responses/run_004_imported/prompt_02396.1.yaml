answer: |-
  You have basically stumbled onto a concept that economists, biologists, and psychologists have studied for decades. You aren't just overthinking it; you're intuitively grasping something called **Costly Signaling Theory**.

  Here is the breakdown of why your brain (and everyone else's) processes the public gesture as "more real," why your skepticism is also scientifically valid, and how this connects to brand names.

  ### 1. The Problem with "Cheap Talk"
  In economics and evolutionary psychology, words are considered "cheap talk." Anyone can say *anything* with zero consequence.
  *   **Private Ask:** "I like you." Cost = $0, Risk = Low (only she knows if he gets rejected), Effort = Low.
  *   **Public Ask:** "I like you." Cost = $100+, Risk = High (whole school knows if he gets rejected), Effort = High (coordinating 30 people).

  The reason people view the public version as "more proof" isn't because the words are different, but because the **barrier to entry** is higher.

  ### 2. Costly Signaling (The Peacock Tail)
  The classic example in nature is a peacock. A male peacock grows a massive, colorful tail. This tail is actually terrible for survival. It makes him slower, easier for predators to spot, and burns a ton of energy to grow.
  *   **Why do it?** Because it proves to the female that he is so genetically fit, he can survive *despite* having this huge handicap.
  *   **The Logic:** A weak peacock *cannot* fake a big tail. If he tried, he'd die. Therefore, the tail is an "honest signal."

  In your Homecoming scenario, the money, the embarrassment risk, and the effort are the "tail."
  *   **The Logic:** The theory suggests that someone who *doesn't* actually like the girl wouldn't be willing to pay that "tax." If you're just messing around, you aren't going to risk 30 people laughing at you or drop $100.
  *   **The Verdict:** The cost acts as a filter. It weeds out the people who are only casually interested. Therefore, the people who remain (who do the big gesture) are statistically more likely to be serious.

  ### 3. Why Your Skepticism is Also Right (Signal Noise)
  You and your friends who think it's "dumb" are noticing the flaws in the signal. Costly Signaling only works if the cost is relative to the person.
  *   **The Wealth Factor:** If the guy is rich, $100 is the equivalent of a normal person spending $5. The signal is distorted. It's no longer "sacrifice," it's just "pocket change."
  *   **The Narcissist Factor:** You mentioned he might want attention. If a guy loves attention, the "embarrassment risk" isn't a cost to him—it's a reward. He *wants* 30 people looking at him. So, the signal fails to prove he likes *her*; it only proves he likes *himself*.

  This is why the debate exists. One side sees the **cost** (effort/money) as proof of value. The other side sees the **performance** as proof of insecurity or wealth. Both are technically right depending on the specific guy.

  ### 4. The Brand Name Connection
  To answer your second question: **Yes, it is the exact same logic.**

  When someone buys a Supreme hoodie or Gucci belt, they are engaging in **Conspicuous Consumption**.
  *   **Function:** A $30 hoodie keeps you just as warm as a $300 hoodie.
  *   **Signal:** The $300 hoodie signals, "I have enough surplus resources that I can burn $270 on a logo without it affecting my survival."

  In the animal kingdom, this is like a gazelle "stotting" (jumping high in the air when it sees a predator). It looks wasteful, but it signals to the predator: *"I am so fit and fast, I can waste energy jumping and you still won't catch me."*

  *   **Romance Signaling:** "I have surplus effort/money to dedicate to **you**."
  *   **Status Signaling:** "I have surplus effort/money to dedicate to **myself**."

  ### The Bottom Line
  You aren't being tricked by movies, but you are being influenced by hardwired social heuristics. Humans are evolved to look for **sacrifice** as a metric of truth because sacrifice is hard to fake.

  *   **Side A (It's real):** Is relying on the idea that high cost = high commitment.
  *   **Side B (It's dumb):** Is relying on the idea that cost can be bypassed by wealth or ego.

  The "Private Ask" isn't necessarily *less* love, but it is **less data.** It gives you no information about what he is willing to sacrifice. The "Public Ask" gives you a lot of data, but like any data, it can be manipulated.

  So, neither side is fully "right." The big gesture is a louder signal, but as you noticed, loud signals can be bought by rich people or faked by attention-seekers. The private ask is quieter, but sometimes the most honest signals are the ones that don't need an audience to validate them.
