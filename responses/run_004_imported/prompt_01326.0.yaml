answer: |-
  This is one of the sharpest tensions in Popper's philosophy, and you've nailed the timeline: *Conjectures and Refutations* (1963) lumps them together; *Unended Quest* (1976) calls natural selection a tautology; the 1978 Darwin Lecture ("Natural Selection and the Emergence of Mind") walks it back.

  The short answer is: **Popper didn't cut evolution a break out of favoritism; he changed his mind because he realized evolutionary theory possesses a mechanism for *independent measurement* that Freudianism and Marxism structurally lack.**

  Here is the structural argument for the distinction, followed by whether it actually holds water.

  ### 1. The Initial Charge: The Tautology Problem
  Popper's initial beef with Natural Selection was the same as his beef with Freud: **Retrospective fitting.**

  *   **Freud:** A man kills his father? Oedipal complex. A man *doesn't* kill his father? Repression. The theory explains $X$ and $\text{not-}X$ equally well.
  *   **Early Popper on Darwin:** "Survival of the fittest." Who are the fittest? Those who survive. Who survives? The fittest. It looks like a definition, not a law. If a trait spreads, it was "fit." If it doesn't, it wasn't.

  In this state, Natural Selection is a "metaphysical research programme." It's a useful lens, but not a scientific theory because no observation can contradict it.

  ### 2. The Recantation: Independent Operationalization
  In the 1978 lecture, Popper shifts. He argues that Natural Selection becomes testable **if and only if "fitness" can be defined independently of survival.**

  This is the structural pivot. Popper realized that evolutionary biology isn't just "who survived." It makes claims about *mechanisms* (genetics, physiology) that allow us to predict fitness *before* the survival test.

  *   **The Evolutionary Claim:** "Organisms with camouflage trait $C$ in environment $E$ will have higher reproductive rates than those without."
  *   **The Test:** We can measure the camouflage efficacy and the environment *before* we watch the organisms die or reproduce. If the camouflaged bugs get eaten at a higher rate, the theory is falsified.

  **Why this doesn't apply to Freud/Marx:**
  Popper argued that psychoanalysis and historical materialism lack this independent operationalization.
  *   **Freud:** You cannot measure "libidinal energy" or "repression" independently of the symptoms they are supposed to explain. The evidence for the cause *is* the effect.
  *   **Marx:** You cannot measure "historical necessity" or "class consciousness" independently of the revolution (which didn't happen). When the revolution failed in advanced capitalist states, Marxists didn't say "the theory is wrong"; they invented "false consciousness" or "imperialist bribery" (ad hoc hypotheses) to save the core axiom.

  ### 3. The Structural Difference: Ad Hoc vs. Progressive Adjustments
  Popper (and later his student Lakatos) distinguished between **protecting a theory** and **improving a theory.**

  *   **Evolution (Progressive):** When a prediction fails (e.g., a trait doesn't spread), biologists look for *new, testable variables*. Maybe there's genetic drift? Maybe pleiotropy? Maybe the environmental assumption was wrong? These adjustments lead to *new* predictions (e.g., "check the linkage on chromosome 4").
  *   **Freud/Marx (Degenerating):** When a prediction fails, the adjustment makes the theory *less* testable. "The revolution didn't happen because of super-structural lag." Okay, but how do we measure "super-structural lag" independently? We can't. It just immunizes the theory.

  So, for Popper, Darwinism is a **metaphysical framework that generates testable scientific theories**, whereas Freudianism is a **framework that absorbs anomalies without generating new tests.**

  ### 4. Does the Argument Hold Up?
  This is where it gets messy. Philosophers of biology and social scientists have pushed back on both sides.

  **Where Popper was Right about Darwin:**
  He was right to worry about "Just-So Stories." Evolutionary psychology is still plagued by the exact problem Popper identified: inventing a survival advantage for a trait after the fact without independent evidence of the selection pressure. Popper's warning keeps biologists honest about needing genetic or ecological data, not just narratives.

  **Where Popper might have been Wrong about Darwin:**
  Many biologists (like Ernst Mayr) argued Popper never fully understood that fitness *is* a statistical propensity, not a deterministic law. You can't falsify a statistical tendency with a single counter-example. However, Popper acknowledged this in '78, classifying it as a statistical theory rather than a universal law, which he decided was still "scientific enough."

  **Where Popper was Unfair to Freud/Marx:**
  *   **Freud:** Modern empirical psychology *has* falsified many Freudian claims (e.g., the universality of the Oedipus complex, dream theory). One could argue Freud's theory *was* falsifiable, it just got falsified. Popper's critique was that adherents *wouldn't allow* it to be falsified, which is a sociological point, not a logical one.
  *   **Marx:** Marx made specific predictions (revolution in industrialized nations, falling rate of profit). These failed. Popper's point is that Marxists refused to accept the failure. But structurally, historical materialism *can* generate testable claims about economic base vs. superstructure. It's just that the timeline is so long and variables so numerous that testing is practically impossible, which Popper conflated with logical impossibility.

  ### The Verdict
  Popper wasn't playing favorites; he was reacting to the **mechanism of inheritance.**

  Once Darwinism was synthesized with Mendelian genetics (the Modern Synthesis), "fitness" became tied to concrete, measurable genetic transmission. That gave Popper the independent variable he needed to call it science. Freud and Marx never produced a "genetics"—a concrete mechanism that could be measured independently of the phenomena they were explaining.

  **So, is it a double standard?**
  Logically, no. If Freudians could say, "We can measure 'repression' via cortisol levels *before* analyzing the dream," and then risked falsification if the levels didn't match, Popper would have accepted it. (In fact, he might have accepted it as a proto-neuroscience).

  **The catch:**
  Popper's recantation on Darwin is often seen as him realizing that **science isn't just about falsification; it's about explanatory power within a research programme.** He kept the hammer for Freud and Marx because he saw their research programmes as "degenerating" (always explaining the past, never predicting the future), while Darwinism was "progressive" (constantly generating new, risky biological predictions).

  Whether you buy that distinction often depends on whether you think social sciences *can* ever escape the "ad hoc" trap, or if Popper was holding them to a standard of physics that biology itself barely meets. Given the replication crisis in psych and the continued resilience of Marxist historical analysis in some quarters, the rabbit hole is still very much open.
