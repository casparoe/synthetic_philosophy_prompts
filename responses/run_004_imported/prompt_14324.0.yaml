answer: |-
  **The Interpreter**

  October 14th. The seizures have stopped. That is the metric of success, the doctor says. The electrical storms that used to wipe the hard drive clean three times a week are gone. The bridge is cut. The corpus callosum, that thick bundle of nerves, is severed. I am told this isolates the firing. I am told I am still me.

  I am sitting at the kitchen table. The sun is coming in from the west, hitting the linoleum. I am writing this with my right hand. The pen feels familiar. The script is my own. I feel a continuous stream of thought moving from the back of my head to the tip of the pen. *I am writing.*

  My left hand is resting on the table, palm down. It is still.

  I decide to reach for the coffee mug. It is the blue one, chipped at the rim. I intend to lift it with my right hand. My right hand moves. But before it arrives, my left hand shoots out. It bypasses the blue mug. It grabs the red one. The one I never drink from. The one my wife, Sarah, uses.

  I watch my left hand lift the red mug. I feel the muscles in my left arm tense. I feel the weight of the ceramic. But I do not feel the *decision*. There is a gap, a micro-second of silence where the command should have been issued. It is not like a reflex, like touching a hot stove. It is an action with purpose. The fingers curl gently. The lift is smooth.

  "I see you're switching teams," Sarah says. She is leaning against the counter, drying a plate.

  "I wanted the red one," I say.

  The words come out of my mouth instantly. They are fluent. They are confident. They are mine.

  But I didn't want the red one. I wanted the blue one. I was thinking about the blue one. The part of me that speaks—the part that holds the pen and constructs these sentences—did not issue the order to the left arm. The left arm belongs to the right hemisphere. The right hemisphere does not speak. It sees the red mug. It likes the red mug. It reaches.

  Then, the left hemisphere—the speaker, the *I*—sees the hand holding the red mug. And the *I* cannot tolerate a gap in the story. The *I* is a press secretary who didn't get the memo from the president. The *I* must explain the action to keep the world making sense.

  "I wanted the red one," I say again. And as I say it, I begin to believe it. The memory of the decision inserts itself backward into my timeline. I convince myself that a moment ago, I had a preference for red. It feels true. It has to be true, because I am the one who did it.

  Sarah smiles. "Okay. Just checking."

  She walks away. I am alone with the mug.

  I look at my left hand. It is resting again. It looks like my hand. The skin is the same tone. The scar from the surgery is hidden under the sleeve. But there is a silence coming from that side of my body. It is a quiet that isn't empty. It is the quiet of a room where someone is standing just out of sight, breathing.

  I try to focus on the visual field. I look straight ahead at the refrigerator. A magnet falls. It clatters to the floor on my left side. I know it fell. I saw the motion in my left visual field. That information goes to the right hemisphere.

  "Did you see that?" I ask the room.

  I answer myself. "Yes. The magnet."

  But can *I* name it? If the image is only in the right brain, and the language center is in the left, how do I know the word *magnet*? I know it because the sound of the clatter was bilateral. Auditory is shared. But if I had seen a picture of a magnet, flashed for a millisecond to the left eye... I would not be able to say what it was. I would say I saw nothing. But my left hand would point to the magnet.

  I am a magic trick where the right hand doesn't know what the left hand is doing, but the mouth insists it orchestrated the whole illusion.

  I stand up. I intend to walk to the sink. My legs move in unison. That is good. The spinal cord is intact. The lower body is shared. It is only the head that is divided. Only the mind.

  I reach the sink. I turn on the water. My left hand reaches for the soap. My right hand reaches for the towel. We are preparing for opposite actions. For a second, I am frozen. One side wants to wash, the other wants to dry. It is not a struggle. It is not a fight. It is just... two plans occurring in the same space.

  I stop. I breathe. I force the left hand down. It resists, slightly, like a heavy door in the wind. Then it settles.

  Who forced it down? Was it the *I*? Or was it the right hemisphere yielding to the dominant motor control of the left?

  Nagel wrote that our concepts are not built for this. We have the word *person*. We have the word *mind*. We assume they map onto the biological unit of the human being. One body, one soul, one mind. But the biology is modular. The unity is a feature, not a fundamental truth. And when the feature breaks, the truth is exposed.

  I look in the mirror above the sink. I see one face. The eyes move together. The expression is unified. If I smile, both corners of the mouth lift. The integration is deep. It is only in the high-level cognitive tasks, the voluntary choices, the linguistic justifications, that the seam shows.

  Am I two people? Puccetti would say yes. He would say I am a duality, and the surgery just removed the phone line between the offices. He would say I am always two, and the corpus callosum is just a lie we tell ourselves to feel whole.

  But I don't feel like two. I feel like one person with a memory leak. I feel like a narrator who has lost access to the source material.

  I dry my hands. I walk back to the table. I sit. I pick up the pen with my right hand.

  My left hand reaches out and covers the paper.

  It doesn't tear it. It doesn't crumple it. It just rests there. Palm flat over the words I was about to write. *I am trying to understand who I am.*

  The left hand covers the sentence.

  "Move," I say aloud.

  The hand does not move.

  "Why are you doing that?" I ask.

  There is no answer. There is never an answer from the left side. There is only the action. And then there is my voice, rushing in to fill the silence.

  "I'm tired," I say to the empty kitchen. "I don't want to write anymore."

  That is the lie. I am not tired. I am terrified. I am fascinated. I want to write. But the hand is covering the paper. And because I cannot access the volition of the hand, I must adopt its goal as my own to maintain the integrity of the self. I must become the kind of person who is tired. I must become the kind of person who doesn't want to write.

  I put the pen down.

  I sit here in the quiet. The sun has moved across the floor. I am one subject of experience. I am two subjects of experience. I am a biological machine that generates the sensation of unity until the wiring fails.

  My left hand lifts from the paper. It reaches for the red mug again.

  I watch it. I do not stop it. I do not claim it. For a second, just a second, I let the *I* dissolve. I let the narrator step back. I watch the hand lift the cup. I watch the arm flex. I acknowledge that I did not do that.

  *We* did that.

  But the word feels wrong. *We* implies a conversation. There is no conversation. There is only parallel processing. There is only the silence between the hemispheres, vast and unbridgeable, and the desperate, fluent voice of the left side, stitching it all together with lies that feel like truth.

  I take the red mug. I drink. It tastes like coffee. It tastes like me.

  I pick up the pen. I write: *I am hungry.*

  My left hand nods. Or maybe I nodded. I can't tell anymore. The head moves on the neck, and the neck is shared. The unity is in the blood, in the breath, in the bone. The division is in the thought.

  I am one. I am two. I am a question that the body answers before the mind can ask it.

  I put the pen down. My left hand picks it up. It draws a circle on the page. A perfect, closed loop. No beginning, no end. Just a line that meets itself.

  It is a good drawing. I did not draw it. But I am the one who has to live with it.
