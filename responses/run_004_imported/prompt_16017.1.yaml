answer: |-
  The cooling pumps of the Omega Collider hummed with a sound that felt less like noise and more like a pressure change in the room. It was 3:00 AM. Outside the control room glass, the Nevada desert was a void, but inside, the banks of monitors glowed with the warm amber of standby systems.

  Elias Vance rubbed his eyes, his hand hovering over the initialization key. He looked like he hadn't slept in a week, which was accurate. The budget approval alone had taken three years; the actual construction, ten. Tomorrow morning, the press would call it the most expensive question ever asked. Tonight, it was just a switch.

  "Don't," Aris said.

  She was sitting on the edge of a console desk, swinging her legs slightly. Dr. Aris Thorne. Theoretical cosmology. The woman who had turned the reading group's last three meetings into shouting matches. She wasn't wearing a lab coat. She was wearing a hoodie that looked like it had survived a few too many laundry cycles.

  Elias didn't turn around. "Go home, Aris. We run the vacuum stability test at 0800."

  "It's Theory B," she said. "It's going to be Theory B. You don't need to burn four hundred million dollars to confirm what my existence already tells us."

  Elias turned slowly. "Here we go. The Presumptuous Philosopher routine."

  "It's not a routine. It's Bayesian bookkeeping." Aris hopped off the desk and walked toward the glass, her reflection superimposing over the massive ring of the collider visible in the distance. "Look at the models. Theory A says the vacuum decay constant allows for a universe of this size, containing roughly ten to the twenty observers over its lifetime. Theory B says the constant is slightly different, allowing for eternal inflation pockets. Ten to the forty observers."

  "I know the numbers," Elias said. "They're empirically indistinguishable. That's why we built this."

  "They're indistinguishable *physically*," Aris corrected. "Not anthropically. Prior to any experiment, you should assign equal credence to A and B. But then you update on the evidence: *I exist.*"

  She tapped her chest. "Under Theory A, the probability of me being one of the ten-to-the-twenty observers is vanishingly small compared to the probability of me being one of the ten-to-the-forty in Theory B. The Self-Indication Assumption isn't magic, Elias. It's just counting. Theory B is a trillion times more likely to contain me than Theory A is. So Theory B is a trillion times more likely to be true. The collider is a waste."

  Elias walked over to the coffee machine, the silence stretching out until the dispenser gurgled. He handed her a styrofoam cup. She didn't take it.

  "You're treating 'me' as a random sample from the set of all possible observers," Elias said quietly. "That's the reference class problem, Aris. Why are you the reference? Why not 'conscious entities'? Why not 'biological humans'? If you narrow the class to 'people alive in 2024 deciding whether to turn on a collider,' the observer count drops out. Both theories predict exactly one of you."

  "That's ad hoc," Aris snapped. "You're narrowing the reference class to save the experiment. If you accept SIA, you have to accept the broad class. And if you accept the broad class, you know the universe is huge. So why spend the money?"

  "Because," Elias said, turning to face her fully, "you're ignoring the cost of that certainty. You want to use SIA to win the cosmological bet. Fine. But you have to pay for it."

  He walked back to the console, leaning against it, crossing his arms. "You say Theory B is likely because it contains more observers. You're betting on a universe teeming with life. A plenitude. But if that's true, if there are ten to the forty observers, where are they?"

  "Elsewhere," Aris said. "In the inflation pockets."

  "In time, too," Elias countered. "In a universe that supports ten to the forty observers, the vast majority of those observers exist in the future. After stars stabilize. After colonization. If the universe is that big, the number of future observers dwarfs the number of current observers by orders of magnitude. If SIA holds, and you are a random sample from all observers... you should expect to be one of them. You should expect to be born in the future."

  Aris shifted her weight. "We know we're early. That's a given."

  "Exactly. You're conditioning on being early." Elias's voice dropped, losing its fatigue, becoming sharp. "So you have two options. Option one: SIA is wrong, the universe is small (Theory A), and we're done here. Option two: SIA is right, the universe is huge (Theory B), *but* the reason you are here now and not later is because there *are* no later observers."

  He let that hang in the air, mixing with the hum of the pumps.

  "The Great Filter," Aris whispered.

  "The Great Filter," Elias agreed. "If you use SIA to prove the universe is big, you are simultaneously proving that civilizations don't stay big. Because if they did, you wouldn't be here at the beginning. You'd be there, in the middle of the trillion-year empire. The fact that you are here, early, in a universe you claim is vast... implies the winnowing is ahead of us. Not behind."

  Aris looked down at her hands. "So you're saying my confidence in Theory B is actually evidence for extinction?"

  "I'm saying the reasoning you're using to save us the cost of this experiment is the same reasoning that tells us we're dead men walking," Elias said. "You want to be the Presumptuous Philosopher about the cosmos? Fine. Be presumptuous. Tell me the universe is huge. But don't ask me to ignore the bill. If you're right about the size, you're wrong about the safety. And if you're wrong about the size, we need to turn this machine on to find out."

  Aris walked back to the window. The collider ring was a ghostly circle in the dark. She had spent years arguing that SSA (the Self-Sampling Assumption) led to doom-mongering, that SIA was the optimistic route. A big universe meant life was easy. The filter was behind us.

  But Elias was right. The math didn't care about optimism. If SIA weights by observer count, it weights heavily toward the future. To find oneself in the past is to find oneself in the minority. In a healthy universe, the past is a tiny fraction of the total. To be in the past is to be in a dying universe, or one that never wakes up.

  "The experiment doesn't settle the Filter," Aris said, her voice tight.

  "No. But it settles the Universe," Elias said. "And if you're right, if Theory B is true without us looking... then we already know the Filter is ahead. So what does it matter what the collider says? If you're right, we're doomed anyway. If you're wrong, and Theory A is true, then the universe is small, the Filter might be behind us, and we need to turn the damn machine on to know which physics we're working with."

  He picked up the key.

  Aris watched him. She could stop him. She could argue reference classes, she could argue about the definition of 'observer', she could bring up the Tegmark multiverse levels. But the core sting remained. To claim the universe is vast based on her own existence was to admit her existence was an anomaly within that vastness.

  "If I'm right," Aris said, "and you turn it on... you're just confirming what we already know. That we're alone in a crowd."

  "If you're right," Elias said, sliding the key into the slot, "then this machine won't change the fact that we're early. But if you're wrong, and I don't turn it on, we're flying blind in a small universe pretending it's big. I'd rather know the size of the cage, Aris. Even if you think you've already counted the bars."

  He turned the key. The hum pitched up, a rising whine that vibrated in their teeth. The monitors flickered from amber to green. Initialization sequence started.

  Aris didn't leave. She stayed by the glass, watching the ring. She had wanted to save them the money. She had wanted to be the one who knew without looking. But as the systems came online, she realized the cost wasn't in the budget. The cost was in the silence that followed the logic.

  If the screen flashed Theory B in the morning, she was right about the physics. And Elias was right about the future.

  "Make sure you log the Bayesian priors," Aris said softly, turning away from the window. "In case we need to revisit the reference class."

  Elias didn't look up from the console. "Already done."
