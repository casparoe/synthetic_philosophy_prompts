  *   *The Twist:* The AI cannot measure "joy" vs "relief" directly, only behavioral correlates (smiling, cortisol levels). But those correlates are also choices/outputs subject to interpretation. A smile can be genuine (A) or a learned mask to stop people from asking questions (B).
  *   *Okay, that works.* It's the "Black Box" problem.

  Let's write it.

