answer: |-
  The banquet hall hummed with the clatter of silverware and the low roar of eighty biologists celebrating Arthur's thirty-year tenure. Elena swirled the Cabernet in her glass, watching the legs run down the side. To her right, Marcus was loosening his tie, the knot already askew.

  "Halloway would have hated this speech," Marcus said, nodding toward the head table. "Too much teleology. Not enough mechanism."

  "Halloway hated everything after 1995," Elena replied, a small smile touching her lips. "But you're right. He'd be under the table by now."

  "Under the table or on top of it." Marcus raised his glass. "To the old man."

  "To the old man." They drank. For a moment, the silence between them was comfortable, the way it only is between people who know exactly how the other takes their coffee and exactly where they intend to strike in a grant review. Then Marcus set his glass down with a deliberate click.

  "I read your paper on phenotypic plasticity in the cichlids," he said. "Solid work. But I noticed you didn't touch on the energetic costs of the trait expression. You treated the plasticity as free."

  Elena stiffened, just slightly. "Because the variance didn't justify the cost analysis. Unlike some people, I don't assume every calorie spent is an investment waiting for a return."

  Marcus leaned in, the candlelight catching the grey at his temples. "There it is. The ghost of Gould. You still think everything is a drafty arch in San Marco?"

  "I think," Elena said, her voice dropping, "that we have a responsibility not to invent functions for things that are simply there. Take the piece you're publishing in *Evolution* next month. The title alone. 'Selective Pressures on Female Climax.'"

  "It's a hypothesis, Elena."

  "It's a just-so story wrapped in game theory." She turned her chair slightly toward him. "Look, we've been dancing around this since grad school. The female orgasm is the textbook spandrel. It's the homology argument. Clitoris and penis arise from the same embryological tissue. The neurovascular wiring is identical. Males need orgasm for reproduction; females get it along for the ride. Like male nipples. Do you write papers on the adaptive value of male lactation potential?"

  "Male nipples are a developmental constraint, yes," Marcus conceded, picking up his fork and tapping it against the tablecloth. "But that's because the cost of suppressing them is higher than the cost of keeping them. They're metabolically cheap. Orgasm isn't. It's a complex neuroendocrine event. It requires specific hormonal cascades, vascular engorgement, muscular contractions. Evolution is parsimonious. It doesn't maintain expensive machinery unless it's doing work."

  "Expensive compared to what?" Elena countered. "Compared to not having it? Or compared to the male version? The variability alone undermines the adaptation claim. If it were selected for sperm retention—the 'upsuck' hypothesis—the timing would be consistent. It isn't. If it were for pair-bonding, the correlation with relationship longevity would be robust. It's weak. Lloyd went through the literature, Marcus. Forty years of data. There is no consistent link to conception."

  "Lloyd excluded studies that didn't fit her null hypothesis," Marcus said, his eyes sharp. "But let's grant you the variability. You're making the classic spandrel error. You're conflating *origin* with *maintenance*."

  Elena paused. "Explain."

  "You're arguing that because the trait *originated* as a byproduct of male selection, it *remains* a byproduct. That's not how selection works. Feathers likely originated for thermoregulation. A byproduct of scales. Does that mean flight isn't an adaptation? Once the trait exists, selection can act on it. Even if it started as noise, if it provides a signal of mate quality, or facilitates ovulation in high-stress environments, selection will fine-tune it. You're treating the developmental origin as a veto on subsequent function."

  "I'm not saying selection *can't* act on it," Elena said, her voice tightening. "I'm saying there's no evidence it *has*. You're asking us to accept a function because it's plausible, not because it's demonstrated. That is the Adaptationist Programme exactly. The default is function, and the burden of proof is on the skeptic. I'm saying the default should be noise. Prove it's signal."

  "Is 'it's merely noise' any less of a story?" Marcus pressed. "You say it's a spandrel. I say it's a co-opted mechanism. Both of us are looking at the same arch. You say, 'Look, empty space.' I say, 'Look, structural integrity.' If I assume it's a spandrel, I stop looking for the function. I become blind to the selective pressures that might be maintaining the variance itself. Maybe the variability *is* the adaptation. A mechanism for assessing mate investment."

  "That is incredibly convenient," Elena said. "Whenever the data fails to show a direct function, you move the goalposts to 'variable function.' It's unfalsifiable."

  "And your null hypothesis is?" Marcus shot back. "That human females possess a complex, resource-intensive physiological response that has been conserved across millennia for no reason other than we share a blueprint with males? That's a heavy claim, Elena. It requires assuming selection is blind to a major component of reproductive behavior."

  "It requires assuming selection isn't magic," she said. "It requires admitting that not everything is optimized. Sometimes a thing is just there because the thing next to it was useful."

  They sat in silence for a moment. The waiter arrived to clear the salad plates, hovering uncertainly until Marcus waved him off.

  Marcus sighed, rubbing his thumb over the stem of his wine glass. "I will concede this: The upsuck mechanism is dead. The data never held. And the pair-bonding correlation is messier than I'd like."

  Elena nodded, a grudging respect in her eyes. "And I will concede that the metabolic cost is higher than the nipple analogy allows. It's not free tissue. But 'costly' doesn't equal 'adaptive.' It could be a constraint we haven't identified yet. A pleiotropic link to something else that *is* selected for."

  "So we agree it's not the upsuck," Marcus said. "And we agree it's not free."

  "We agree the data is underdetermined," Elena corrected. "You want to treat 'adaptive' as the working hypothesis until proven otherwise. I want to treat 'byproduct' as the working hypothesis until proven otherwise."

  "Because you think assuming function leads to bad science."

  "Because I think assuming function leads to *stories*," she said softly. "And I'd rather have data."

  Marcus looked at her, really looked at her, the way he hadn't since they were postdocs fighting over the last microscope in the lab. "And I think assuming noise leads to missing the point of the organism. But... I can run the cost-benefit analysis you asked for. On the cichlids. Include the energetic variance."

  Elena picked up her wine glass again. "I'll send you the Lloyd meta-analysis. The raw data, not just the book. Look at the variability in cycle timing. If you can find a selection coefficient that holds across that variance, I'll read it."

  "Deal," Marcus said.

  "Deal."

  They clinked glasses, the sound lost in the applause as Arthur stood to give his thanks. The argument wasn't over—it never was—but the edges had been sharpened, the soft places hardened. They turned back to the table, ready for the main course, waiting for the next opening.
