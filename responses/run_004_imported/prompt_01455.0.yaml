      *   **Point 2: Administrative Pragmatism vs. Moral Theory.** The legal system treats fines as revenue/transactions. The *state's* indifference silences the complaint. If the authority doesn't police it, the public assumes it's permissible.
      *   **Point 3: The Invisibility of Triviality.** Most fines *are* trivial (parking, speeding). The "serious" fines Lewis mentions are rare. We generalize from the trivial cases to the serious ones without noticing the shift.
      *   **Point 4: The Lack of a Victim.** Prison substitution harms the concept of justice. Fine substitution... who is harmed? The state gets its money. The victim (if any) is abstract. Without a concrete victim, there is no outcry.
      *   **Point 5: Linguistic Limitations.** Ordinary language conflates "paying a penalty" with "paying a debt." We lack the words to distinguish them in casual conversation.
      *   **Conclusion:** Lewis demands explicit philosophical critique from a public operating on pre-philosophical intuition. The absence of the complaint proves the depth of the confusion, not the falsity of the hypothesis.

