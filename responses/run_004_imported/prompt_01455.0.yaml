answer: |-
  Here is the strongest possible case for your friend's position: that Lewis is mistaken to treat the absence of explicit public complaint as significant evidence against the "sloppy thinking" hypothesis.

  The core of this argument rests on the idea that Lewis is demanding a level of philosophical articulation from ordinary discourse that the nature of the confusion itself renders impossible. If the "sloppy thinking" hypothesis is true, the confusion is structural and linguistic; it operates *beneath* the level of conscious critique. Therefore, the silence of ordinary discourse is not evidence that the problem doesn't exist, but rather evidence of how deeply the error is embedded.

  Here are four specific arguments explaining why the complaint fails to surface, even if the hypothesis is correct.

  ### 1. The Transparency of Conceptual Metaphors
  Lewis's hypothesis relies on the claim that we are misled by the metaphor of a "debt of punishment." The defining characteristic of a successful conceptual metaphor is that it becomes invisible to the user. When we speak of "spending time" or "saving face," we do not pause to object that time is not currency and faces are not hoardable goods. We use the metaphors to structure our thinking, not as objects of thought themselves.

  If the public tolerates fine substitution because they unconsciously categorize fines as financial debts rather than penal burdens, they lack the conceptual vocabulary to complain about it. To complain that "this fine is a punishment, not a debt, therefore third-party payment is illicit" requires a philosophical distinction that ordinary discourse does not maintain. Lewis expects ordinary people to notice a leak in a conceptual framework that they are currently using as the floor they stand on. The absence of the complaint is exactly what we should expect if the metaphor is doing its job successfully: it naturalizes the practice so thoroughly that it ceases to appear as a *practice* at all, and instead appears as a *fact*.

  ### 2. Administrative Complicity Silences Moral Outrage
  Ordinary moral discourse regarding criminal justice is often reactive to institutional behavior. We tend to view what the state permits as morally permissible, or at least morally neutral. In the case of fines, the legal system itself refuses to police the source of payment. Courts accept cashier's checks from parents, employers, or crowdfunding campaigns without question. The bureaucracy treats the fine as a transaction to be closed, not a penalty to be personally endured.

  When the authority responsible for enforcing the punishment signals indifference to substitution, it deprives the public of the cue that a violation has occurred. In the case of prison substitution, the state *physically prevents* it; the prison walls enforce the intuition that the punishment is non-transferable. With fines, the state opens the gate. Consequently, there is no "scandal" to report because the referee isn't blowing the whistle. The absence of complaint is not a sign of moral approval, but of institutional normalization. If the system treats the fine as a collectible revenue stream, the public will adopt the same instrumental attitude, masking the underlying penal incoherence.

  ### 3. The Sorites of Severity and the "Typical" Case
  Lewis concedes that trivial fines (parking tickets) are effectively user fees, but insists some fines are serious punishments. However, in ordinary experience, these categories bleed into one another. Most people's interaction with the legal system is limited to the trivial end of the spectrum. We form our intuitions about "paying a fine" based on parking tickets and speeding violations, where substitution is ubiquitous and unobjectionable.

  When a "serious" fine is levied (e.g., for corporate malfeasance or significant tax evasion), we process it through the cognitive template established by the trivial cases. Because the mechanism of payment is identical (a check or transfer), the moral distinction is washed out by the procedural similarity. We do not complain about serious fine substitution because we do not cognitively register it as a different *kind* of event than trivial fine payment. The "sloppy thinking" is a generalization from the frequent/trivial to the rare/serious. Since the rare cases are processed using the rules of the frequent cases, no alarm bell rings. The silence is a result of cognitive economy, not moral insight.

  ### 4. The Lack of a Visceral Victim
  Moral outrage in ordinary discourse usually requires a visceral victim. Prison substitution provokes outrage because we can visualize an innocent person suffering bodily confinement in place of a guilty one. It violates our intuition about bodily autonomy and retributive justice in a way that is emotionally immediate.

  Money, however, is fungible and abstract. When a friend pays a fine, there is no visible suffering. The payer loses wealth, but wealth is viewed as external to the self in a way that liberty is not. Furthermore, in many cases of serious fines, the payer is an insurance company, a corporation, or a legal defense fund. There is no "devoted friend" to scrutinize, just a faceless entity settling a ledger. Ordinary discourse struggles to generate moral heat around abstract financial transactions. The absence of complaint regarding fine substitution is not because the penal logic holds up, but because the medium of exchange (money) fails to trigger the emotional alarms that the medium of imprisonment (the body) triggers. We don't complain because we don't *feel* the wrong.

  ### Conclusion
  Lewis's retraction assumes that if a practice were theoretically illegitimate, ordinary discourse would identify it as such. This assumes that ordinary discourse is a reliable detector of philosophical consistency. Your friend's position suggests the opposite: ordinary discourse is a detector of *practical friction*.

  Prison substitution creates friction (you can't sneak into a cell). Fine substitution creates no friction (you can always mail a check). The "sloppy thinking" hypothesis posits that we mistake the lack of friction for moral permission. If that is true, we would not expect to hear complaints; we would expect to hear silence, broken only by the occasional philosopher (like Lewis) who steps back far enough to see the inconsistency. The absence of the complaint is not evidence against the diagnosis; it is the primary symptom of the disease. Lewis heard the silence and took it as health; your friend correctly identifies it as the sound of a confusion so deep it has no voice.
