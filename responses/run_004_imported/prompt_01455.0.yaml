      *   **Task:** Build the *strongest possible case* for the **friend's side**. Argue that Lewis is wrong to treat the absence of explicit complaint as evidence against the hypothesis. Explain *why* this dissatisfaction might fail to surface in ordinary discourse even if the hypothesis is true.

  2.  **Deconstruct Lewis's Argument for Retraction:**
      *   Premise 1: If the "sloppy thinking" hypothesis were true (i.e., if fine substitution were a genuine conceptual/practical flaw that misleads us about punishment), people would notice and complain about it.
