      *   Conclusion: Therefore, the hypothesis is likely false.

  3.  **Brainstorm Counter-Arguments (Why the complaint might be absent even if the hypothesis is true):**
      *   *Implicit vs. Explicit:* People operate on intuitions, not philosophical analysis. They feel the asymmetry but don't articulate the *reason*.
      *   *Normalization:* It's so common (paying someone's parking ticket) that it's invisible. It's background noise, not a scandal.
      *   *Administrative Indifference:* The state doesn't care *who* pays the fine, only that it's paid. The purpose of the fine is often revenue or minor deterrence, not moral retribution. If the state doesn't care, why would the public complain?
      *   *Category Confusion:* Lewis's point is exactly that people *confuse* fines with punishment. If they are confused, they won't complain about the confusion. They think paying a fine *is* just paying a bill. You don't complain that your roommate paid your electric bill.
      *   *Lack of Vocabulary:* Ordinary discourse lacks the philosophical distinction between "penal debt" and "financial debt." Without the concepts, you can't formulate the complaint.
      *   *The "Scandal" Threshold:* Prison substitution is a scandal because it violates bodily autonomy and retributive justice visibly. Fine substitution is low-stakes. We don't complain about small injustices that don't feel like injustices.
      *   *Systemic Blindness:* Legal systems are designed to collect money. Policing the *source* of the funds is too costly. This practical necessity masks the theoretical problem.
      *   *Retrospective Rationalization:* We accept fine substitution, then invent reasons why it's okay (e.g., "it's just money"), rather than recognizing it as a loophole in penal theory.

