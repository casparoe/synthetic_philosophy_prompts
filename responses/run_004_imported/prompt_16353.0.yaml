      *   **Core Tension:** *Guide of the Perplexed* III:32 (sacrifice as a historical concession to Sabian idolatry, implying a trajectory toward interiorization) vs. *Mishneh Torah* (codifies sacrifice in detail, *Hilkhot Melakhim* predicts Temple restoration in the Messianic era).
