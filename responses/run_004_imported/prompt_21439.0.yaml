answer: |-
  You are remembering the work of the contemporary philosopher **Ruth Chang**. She is the leading proponent of the idea that "better than," "worse than," and "equally good" do not exhaust the possible comparative relations. She calls the fourth relation **parity** (or being "**on a par**").

  Your debate with your friend maps perfectly onto a classic philosophical triangle:
  1.  **Your view:** **Incommensurability.** (There is no fact of the matter; the values are too different to compare.)
  2.  **Your friend's view:** **Epistemicism/Vagueness.** (There *is* a fact of the matter—one is better or they are equal—but our tools are too blunt to see it.)
  3.  **Chang's view:** **Parity.** (There is a fact of the matter, but it is a fourth kind of relation, not one of the standard three.)

  Here is the argument for why we need this fourth option, followed by the response to the objection that it's just "fuzzy equality."

  ### The Argument: The Small Improvement Test

  Chang's primary tool for establishing parity is the **Small Improvement Argument**. It is designed to show that two options can be comparable (ruling out your view) without being equal (ruling out your friend's view).

  Here is how the argument works, using your friend's job offers:
  *   **Option A:** High Pay / Bad City
  *   **Option B:** Low Pay / Good City

  **Step 1: Establish the Trichotomy**
  Standard decision theory assumes the **Trichotomy Thesis**: For any two options A and B, one of three relations must hold: A is better than B, B is better than A, or A is equally good as B.

  **Step 2: The Hard Choice Intuition**
  In a "hard choice," it feels false to say A is better than B. It also feels false to say B is better than A.
  *   *Your friend says:* "One of them *must* be true, we just don't know which."
  *   *You say:* "Neither is true. They are different kinds of things."

  **Step 3: The Small Improvement Test**
  To test if they are **Equal**, Chang proposes a thought experiment. Imagine we improve Option A slightly. Let's say the High Pay job offers an extra $100 a year. Call this **A+**.
  *   **If A and B were truly Equal:** Then A+ must be **strictly better** than B. (If two things are exactly equal in value, adding value to one tips the scale.)
  *   **If A and B were Incommensurable (Your view):** Then adding $100 to A shouldn't necessarily make it comparable to B. If there is no bridge between "Money" and "Happiness," adding a plank to the Money side doesn't build the bridge.

  **Step 4: The Result**
  In most hard choices, our intuition is that **A+ *is* better than B**. The extra $100 *does* tip the scale.
  *   This rules out **Incommensurability** (your view). The options *are* comparable; a small nudge makes one win.
  *   However, if A and B were **Equal**, the choice between them would be a matter of indifference (like choosing between two identical $5 bills). But hard choices aren't like that. Choosing A over B feels like a loss of something specific that B offered, which A's money doesn't perfectly replace. They are qualitatively different.

  **Step 5: The Conclusion**
  Since A and B are comparable (A+ > B), but not Equal (qualitative difference), and neither is better than the other (initially), the Trichotomy is false. There must be a fourth relation: **Parity**. A and B are "on a par." They are in the same neighborhood of value, but not at the same precise point.

  ### The Objection: "Isn't Parity Just Vague Equality?"

  This is the exact objection your friend raised. She argues that "on a par" is just a fancy label for **imprecise equality**. She is arguing for *epistemic vagueness*: there is a precise fact (A = B or A > B), but human measurement is fuzzy.

  Chang has a strong answer to this, which hinges on the difference between **Epistemic** (knowledge-based) and **Ontological** (reality-based) claims.

  **1. The Structure of Value**
  If your friend is right (Vague Equality), she is assuming that all value is **cardinal** (measurable on a single scale, like height or weight). If value is cardinal, then there *must* be a precise point where A becomes better than B, even if we can't see it.
  Chang argues that value in hard choices is **ordinal** and **multidimensional**. "Happiness in a city" and "Salary" are different dimensions. Parity acknowledges that you can rank them roughly without reducing them to a single number. If you say it's just "vague equality," you are forcing a single scale where none exists. Parity says the *structure of reality* here is rough, not that our *vision* is blurry.

  **2. The Role of Agency (The "Will")**
  This is Chang's most powerful point.
  *   **If they are Equal:** Reason dictates **indifference**. You should flip a coin. There is no rational basis to prefer one.
  *   **If they are On a Par:** Reason **runs out**, but it does not dictate indifference. Because the options are roughly equivalent but qualitatively different, *you* get to create the reason. By committing to one path, you make it the right one for you.

  If your friend is right and it's just "vague equality," then your friend is stuck waiting for the fog to clear to find the "real" answer. Chang argues the fog *is* the reality. The lack of a precise ranking is what creates the space for human agency. If there were a hidden fact (as your friend claims), your choice would be a discovery, not a creation.

  **3. Transitivity**
  Equality is transitive (If A=B and B=C, then A=C). Parity is not necessarily transitive in the same way. You can have A on a par with B, and B on a par with C, but A might be better than C. If "on a par" were just "vague equality," this wouldn't hold. The fact that parity behaves differently logically suggests it is a distinct relation, not just a fuzzy version of equality.

  ### Who Won the Argument?

  Technically, **Chang sides partially with both of you**, which might be frustrating but is more accurate.

  *   **Against You:** She agrees with your friend that the options *are* comparable. You were wrong to say there is "no rational way to rank them." There is a relation (parity), and small improvements can break the tie.
  *   **Against Your Friend:** She agrees with you that there is no "hidden fact" waiting to be measured. Your friend is wrong that there is a precise "better/worse/equal" fact obscured by uncertainty. The uncertainty is a feature of the values themselves, not a bug in your measurement.

  **The Verdict:**
  Tell your friend that "on a par" isn't a cop-out; it's an explanation of why the choice is hard. If they were equal, she'd flip a coin. If one were better, she'd take it. Because they are *on a par*, the decision requires her to exercise her **will** to commit to one set of values over the other. The "fact" she's looking for doesn't exist yet—she creates it by choosing.
