answer: |-
  Here are 10 interview questions designed to bypass the introductory jurisprudence and press on the structural tensions of her "beefed-up" Fullerianism. Each includes the question, a note on the likely philosophical dodge, and a loaded follow-up to keep her from retreating to safe ground.

  ### 1. The Threshold of Failure
  **Question:** Fuller lists eight desiderata, but he's famously vague on the tipping point. In your "beefed-up" version, is the failure to be "law" binary or cumulative? Can a regime score perfectly on clarity and stability but fail on congruence, and if so, does the whole system evaporate legally, or just the specific tainted directives?

  *   **Likely Answer:** She will likely argue for a "cumulative degradation" model. She'll say no single failure destroys legality, but a "critical mass" of procedural failure breaks the reciprocal relationship between ruler and ruled, turning power into mere force.
  *   **Follow-up:** "If it's cumulative, doesn't that create a safe harbor for tyranny? A regime could intentionally violate two or three desiderata just enough to be efficient at oppression, but stay under your 'critical mass' threshold. At that point, aren't you just telling citizens they still have a moral obligation to obey 'law' that is functionally predatory?"

  ### 2. The Grudge Informer Case
  **Question:** Let's go to the Nazi grudge informer cases. The statutes used to punish the informers post-war were retroactive, which violates one of Fuller's own principles. But looking at the original Nazi statutes: they were often public, clear, and applied consistently. If the machinery was procedurally orderly, where exactly does your theory locate the legal failure? Is it in the text of the statute, or in the climate of terror that made compliance impossible?

  *   **Likely Answer:** She will almost certainly pivot to **congruence** (the eighth desideratum). She'll argue that while the *text* was clear, the *application* was arbitrary because the secret police operated outside the rules, meaning the declared rule didn't match the official action.
  *   **Follow-up:** "But if the statute itself authorized the secret police to act outside standard procedure, then the 'congruence' was actually perfect—the rule *was* that there are no rules. By locating the failure in the application rather than the text, aren't you admitting that a wicked statute can still be valid law, which is the exact positivist position you're trying to overturn?"

  ### 3. Hart's Poisoner Analogy
  **Question:** Hart's famous rebuttal was that having an 'inner morality' is just about efficiency; a skilled poisoner has a craft with internal standards, but that doesn't make poisoning moral. If law is just a craft of subjecting conduct to rules, why does mastering that craft necessarily point toward human good? Why isn't a tyrant who rules clearly and consistently just a 'skilled poisoner' of justice?

  *   **Likely Answer:** She will argue that law has a specific **telos** (purpose) that poisoning does not. Law is inherently a cooperative enterprise aimed at human agency; poisoning is destructive. Therefore, the internal standards of law are linked to its purpose, whereas the poisoner's standards are not.
  *   **Follow-up:** "That sounds like you're smuggling a substantive definition of 'human good' into a procedural test. If the 'purpose' of law is to enhance agency, doesn't that mean a law that restricts agency (even procedurally perfectly) is a contradiction in terms? And if so, haven't you just abandoned procedure entirely and become a substantive natural law theorist?"

  ### 4. The Apartheid Test
  **Question:** Consider Apartheid-era South Africa. The regime was obsessed with legal formality. Statutes were precise, courts functioned, and rules were stable. However, the laws were explicitly particularistic, targeting specific racial groups rather than applying generally. Does your view classify Apartheid as a legal system that was unjust, or a non-legal system of force?

  *   **Likely Answer:** She will likely seize on **generality** (the first desideratum). She'll argue that laws must be general to count as law, and racial classification laws are by definition particularistic commands, not general rules.
  *   **Follow-up:** "But 'generality' is a slippery slope. A law saying 'no one may vote' is general. A law saying 'no one with property X may vote' is general. If you define 'generality' as requiring substantive equality, aren't you just redefining words? If you define it merely as 'applying to a class,' then Apartheid laws pass. Which definition are you using, and isn't the choice between them purely political?"

  ### 5. Positivism with Extra Steps
  **Question:** If a regime is procedurally perfect but substantively evil, a positivist says 'that is law, but it is too wicked to obey.' You seem to say 'that is not law.' Practically, the citizen still faces the same gun either way. What work is the label 'not law' doing here, other than semantic satisfaction?

  *   **Likely Answer:** She will argue the label changes the **normative stance**. If it's not law, there is no *prima facie* obligation to obey. It empowers judges and citizens to resist without feeling they are undermining "the law."
  *   **Follow-up:** "But in a crisis, citizens don't check the jurisprudential status of a command before deciding whether to resist; they check the consequences. If your theory doesn't change the outcome on the ground, isn't it just a philosophical luxury? Why shouldn't we prefer Hart's honesty: call it law, call it wicked, and take responsibility for disobeying it?"

  ### 6. The Problem of Retroactive Justice
  **Question:** Fuller's system frowns heavily on retroactivity. Yet, after a regime collapse, we often need retroactive laws to punish the previous rulers (like the Nuremberg Trials). If the old regime failed your procedural test and wasn't 'law,' why do we need new retroactive laws to punish them? Why isn't it enough to say they violated the inherent morality of law that existed all along?

  *   **Likely Answer:** She will likely distinguish between **criminal liability** and **legal status**. She'll say the old system wasn't law, so their acts were crimes against humanity, but to punish them fairly, we need new procedural safeguards (new laws) to ensure *we* don't become tyrants.
  *   **Follow-up:** "So you're admitting that even when punishing 'non-law,' we must act *as if* we are positivists to ensure fairness. Doesn't that suggest that Fuller's inner morality is actually a moral constraint on the *new* regime, not a metaphysical test for the *old* one? In other words, isn't the 'inner morality' just good policy, not a definition of law?"

  ### 7. Congruence and Judicial Discretion
  **Question:** You emphasize congruence between declared rules and official action. But in common law systems, judges constantly reshape rules through interpretation. If a judge bends a clear rule to achieve a just outcome, they violate congruence. Is judicial equity a failure of legality in your view, or the highest fulfillment of it?

  *   **Likely Answer:** She will argue that **interpretation** is part of the rule's life. As long as the reasoning is public and consistent, it's not a violation of congruence. Congruence only fails when officials act arbitrarily or secretly.
  *   **Follow-up:** "But if 'public reasoning' is enough to justify departing from the text, then the text doesn't matter, only the judge's rationale does. Doesn't that collapse the distinction between 'rule by law' and 'rule by judges'? If the judge can redefine the rule publicly, isn't stability (another desideratum) sacrificed for justice?"

  ### 8. The "Impossible" Requirement
  **Question:** One desideratum is not demanding the impossible. But modern regulatory states constantly demand things that are technically impossible for some to comply with immediately (e.g., environmental standards). Do these fail to be law? Where is the line between 'difficult compliance' and 'impossible compliance'?

  *   **Likely Answer:** She will argue for **reasonableness**. The law must allow a reasonable time or capacity for compliance. It's not strict impossibility, but "practical impossibility" for the average subject.
  *   **Follow-up:** " 'Reasonableness' is a substantive moral judgment, not a procedural one. Who decides what is reasonable? If the legislature says 'this is necessary for survival' and the citizen says 'this is impossible,' your theory requires a judge to decide. Doesn't that just push the political conflict into the courtroom without solving it?"

  ### 9. The Audience of Law
  **Question:** Fuller argues law is a way of subjecting human conduct to rules, which implies the subject is an agent capable of following rules. If a regime treats citizens purely as objects to be managed (e.g., eugenics laws), does that automatically fail the 'possibility of compliance' test, regardless of how clear the statute is?

  *   **Likely Answer:** Yes. She will argue that treating humans as objects violates the fundamental **reciprocity** of law. If the law denies your agency, it cannot ask for your compliance, so it ceases to function as law.
  *   **Follow-up:** "That sounds powerful, but historically, people *do* comply with laws that treat them as objects, often out of fear. If the system functions effectively despite denying agency, why does your theory insist it's not law? Are you defining law by its success in controlling behavior, or by its moral success in respecting dignity?"

  ### 10. The Lawyer's Role
  **Question:** If you're right, and a regime crosses the threshold into 'non-law,' what is the professional obligation of a lawyer working within it? Are they facilitating a fraud? Should your theory have practical teeth for bar associations, disbaring those who uphold procedurally rotten systems?

  *   **Likely Answer:** She will likely be cautious here. She'll say lawyers have a duty to uphold the **integrity of the process**. They should resist procedural erosions, but she might stop short of calling for mass resignation, citing the need for internal resistance.
  *   **Follow-up:** "But if the system is 'non-law,' then there is no process to uphold. By staying, aren't they lending legitimacy to a force regime? If your theory is true, isn't the only ethical move for a lawyer to walk out? And if you're not willing to say that, isn't it because you know that in the real world, 'law' is just power with a mask, regardless of its inner morality?"
