      *   **Goal:** 8-10 interview questions that avoid basic restatements and dig into mechanics/tensions.
      *   **Specific Requirements:**
          *   One question on the "Grudge Informer" case (Nazi statutes).
          *   One question on Hart's "poisoner" rebuttal (efficiency $\neq$ morality).
          *   One question on substantively awful but procedurally sound regimes (e.g., Apartheid).
          *   Format: Question + Likely Answer Note + Sharper Follow-up.
      *   **Tone:** Intellectual, probing, slightly skeptical but respectful (journalistic), avoiding "101" jurisprudence questions.

  2.  **Deconstruct the Subject's Position:**
      *   She's a Fullerian, but "beefed-up." This suggests she might be pushing harder on the *connection* between procedure and substance than Fuller sometimes did, or she's refining the "threshold" where law becomes non-law.
      *   Fuller's 8 desiderata are procedural. The claim is that extreme procedural failure destroys *legality*, not just morality.
      *   The tension: Positivists (Hart) say law is a social fact (Rule of Recognition). Natural Lawyers (Fuller) say law has a moral aim.
      *   The weak points: Nazi Germany (procedurally efficient but evil), Apartheid (same), and the conceptual leap from "good craft" to "moral good."

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Threshold Problem.* How bad is "bad enough"? Fuller is vague on when a system ceases to be law.
          *   *Draft:* When does a system stop being law?
          *   *Refinement:* Make it about the "tipping point." Is it cumulative?
          *   *Follow-up:* If it's cumulative, doesn't that allow a lot of evil to slip through as "law"?

      *   *Question 2: The Grudge Informer (Required).* Nazi statutes were often clear and public.
          *   *Draft:* What about the Nazi informers? The laws were clear.
          *   *Refinement:* Focus on *congruence*. Did the officials apply the rules as declared? Or was the terror itself a violation of "possibility of compliance"?
          *   *Follow-up:* If the statute itself was clear, isn't she admitting the *statute* was law, just the *application* wasn't?

      *   *Question 3: Hart's Poisoner (Required).* Efficiency vs. Morality.
          *   *Draft:* Hart said being a good poisoner doesn't make poisoning moral.
          *   *Refinement:* Frame it as "internal excellence." Does mastering the craft of law serve an external moral end, or is the craft itself the end?
          *   *Follow-up:* If the craft serves an end, doesn't that end have to be substantive justice, not just procedural order?

      *   *Question 4: Apartheid/Procedural Perfection (Required).*
          *   *Draft:* What about Apartheid? It followed rules.
          *   *Refinement:* Focus on "generality." Apartheid laws were specific to races. Does that violate generality?
          *   *Follow-up:* If she says yes, isn't she smuggling substantive equality into a procedural test?

      *   *Question 5: The "Beefed-Up" Aspect.* What makes her version stronger than Fuller's?
          *   *Draft:* How is your view different from Fuller's?
          *   *Refinement:* Fuller was cautious. She seems bolder. Is she willing to call more regimes "non-legal"?
          *   *Follow-up:* Does this make the concept of law too fragile for political science?

      *   *Question 6: Congruence and Discretion.*
          *   *Draft:* What about judges bending rules?
          *   *Refinement:* Focus on the gap between book law and street law. Is this the most important desideratum?
          *   *Follow-up:* In common law systems, rules evolve. Is stability incompatible with justice?

      *   *Question 7: The Positivist Retreat.*
          *   *Draft:* Are you just a positivist now?
          *   *Refinement:* If she concedes that evil regimes are "law" but "void," is that just Hart with extra steps?
          *   *Follow-up:* What practical work does the label "not law" do if we still have to obey/disobey based on consequences?

      *   *Question 8: The Audience of Law.*
          *   *Draft:* Who is law for?
          *   *Refinement:* Fuller says law is a way of subjecting human conduct to rules. It requires agency.
          *   *Follow-up:* If a regime treats people as objects, does that fail the "possibility of compliance" test inherently?

      *   *Question 9: Retroactivity and Emergency.*
