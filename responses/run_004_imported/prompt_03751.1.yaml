  2. C+ (C with small bonus) > C.
  3. If C = N, then C+ > N.
  4. But C+ is not clearly > N (because the bonus doesn't outweigh the meaning gap).
  5. Therefore, C does not = N.
  6. Since C is not > N and N is not > C, and C is not = N, they are On A Par.

