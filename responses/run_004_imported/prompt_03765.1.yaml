      Good: Action $a$ leads to outcome $x$ with probability $P(x|a, \omega)$. This mapping is fixed.
      Hirshleifer: Action "Buy 1 unit of state-contingent claim" leads to consumption $c$. But the cost of that action depends on price $p$. $p$ depends on Info. So the mapping from "Buy 1 unit" to "Final Consumption" depends on Info.
