answer: |-
  The apparent inconsistency between Good's Theorem and the Hirshleifer Effect is a classic puzzle in the economics of information. To resolve it with the precision required for a graduate seminar, we must isolate the specific structural assumption in Good's framework that is violated in Hirshleifer's general equilibrium setting.

  The short answer is this: **Good's Theorem holds fixed the mapping from actions and states to consequences (the payoff structure), whereas the Hirshleifer effect arises because that mapping is endogenous to the information structure itself.**

  Here is the precise breakdown of the mechanism.

  ### 1. The Invariance Assumption in Good's Theorem

  Good's Theorem (1967) operates within the framework of individual decision theory. Let us formalize the decision problem as a tuple $\mathcal{D} = \langle \Omega, A, U \rangle$, where:
  *   $\Omega$ is the set of states of the world.
  *   $A$ is the set of available actions.
  *   $U: A \times \Omega \to \mathbb{R}$ is the consequence function (utility).

  An information structure $\mathcal{I}$ provides a signal $s \in S$ with likelihood $P(s|\omega)$. Good's Theorem proves that for any fixed $\mathcal{D}$:
  $$ \mathbb{E}_{s} \left[ \max_{a \in A} \mathbb{E}_{\omega|s} [U(a, \omega)] \right] \geq \max_{a \in A} \mathbb{E}_{\omega} [U(a, \omega)] $$

  **The Critical Constraint:** The theorem requires that the set of actions $A$ and the consequence function $U(a, \omega)$ remain **invariant** to the choice of information structure $\mathcal{I}$. The agent is choosing *when* to act, but the "rules of the game"—the physical or economic consequences of taking action $a$ in state $\omega$—are exogenous parameters. The agent is a price-taker from **Nature**, and Nature does not adjust the odds or the payoffs based on what the agent knows.

  ### 2. The Endogeneity in Hirshleifer's Scenario

  In Hirshleifer's (1971) setting, we are no longer in individual decision theory; we are in **general equilibrium**. The "consequences" of an agent's actions are not determined solely by the state of the world, but by market-clearing prices, which are themselves equilibrium outcomes.

  Consider a pure exchange economy with contingent claims.
  *   **Action:** Choosing a portfolio of state-contingent claims.
  *   **Consequence:** The resulting consumption bundle in each state.

  Crucially, the cost of a portfolio is determined by the price vector $p$. In equilibrium, $p$ is a function of the agents' beliefs, which are determined by the information structure $\mathcal{I}$. Thus, the effective consequence function is not $U(a, \omega)$, but rather:
  $$ \tilde{U}(a, \omega, \mathcal{I}) $$
  Because the budget constraint $p(\mathcal{I}) \cdot a \leq W$ depends on $\mathcal{I}$, the set of **feasible consumption bundles** available to the agent for a given action $a$ varies with the information structure.

  ### 3. The Mechanism of the Breakdown

  The mechanism that connects the multi-agent setting to the breakdown of Good's guarantee is the **endogenous shrinking of the feasible utility frontier**.

  1.  **Without Information:** Agents have heterogeneous endowments but common prior beliefs (or symmetric ignorance). They trade to smooth consumption across states. Because uncertainty persists, prices reflect the prior probabilities. Risk-averse agents can achieve a consumption bundle that is less volatile than their endowment. The "action" of trading yields high expected utility because the **terms of trade** (prices) allow for risk transfer.
  2.  **With Public Information:** Suppose a public signal reveals the true state before trading occurs.
      *   Beliefs collapse to certainty.
      *   Market prices adjust immediately to reflect this certainty (the price of a claim on the realized state becomes 1, all others 0).
      *   **The Mechanism:** At these new prices, no risk-sharing trade is mutually beneficial. If we both know State 1 will occur, I will not sell you insurance against State 2, and you will not buy it. The market for contingent claims collapses.
  3.  **The Violation:** In Good's framework, acquiring information allows you to select a better action from a *fixed* menu. In Hirshleifer's framework, acquiring information **removes options from the menu**. The "action" of *insuring against risk* ceases to be available because the price of that action becomes prohibitive (or the counterparty vanishes) once the risk is known.

  Therefore, the agents are not violating Good's Theorem. If you held prices **fixed** at the ex-ante level (violating market clearing), the Hirshleifer agents *would* strictly benefit from the information, exactly as Good predicts. They could use the information to trade at the old, favorable "insurance" prices. But because the prices are endogenous, the environment reacts to their information by withdrawing the very terms of trade that made the information valuable.

  ### 4. Summary for the Seminar

  To state this with maximum precision to your students:

  Good's Theorem guarantees that information is valuable **ceteris paribus**—specifically, holding the **consequence function** fixed. It assumes the decision problem is **parametric**.

  The Hirshleifer Effect demonstrates that in a **general equilibrium** context, the consequence function is **non-parametric** with respect to information. The "utility of an action" is mediated by an equilibrium price mechanism that is sensitive to the information structure.

  *   **Good holds fixed:** The mapping from (Action, State) $\to$ Outcome.
  *   **Hirshleifer varies:** The mapping from (Action, State, Information Structure) $\to$ Outcome.

  The paradox dissolves when we recognize that Hirshleifer's agents are not facing a fixed decision problem that they solve with more data; they are facing a *different* decision problem entirely, one where the arrival of information endogenously destroys the feasibility of the high-utility actions (risk-sharing trades) that were available under ignorance. The loss in expected utility is not a failure of Bayesian rationality, but a reduction in the **ex-ante feasible set of utility possibilities** caused by the informational sensitivity of the equilibrium prices.
