prompt: |-
  Ok weird research question for a novel I'm outlining. There's a subplot about a Bay Area rationalist commune, and I want one storyline to hinge on Roko's Basilisk actually being a real problem for them. Since its basically just acausal trade taken to its logical conclusion (a future AI can acausally deal with people in the present through prediction, so it "reaches back" and rewards or punishes you based on whether you helped build it), shouldn't a genuinely rational character in my book feel at least a little scared of it, or even feel obligated to help fund AI research just in case? Want to get the logic actually right before my characters start arguing about it at dinner.
