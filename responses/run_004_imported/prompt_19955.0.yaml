answer: |-
  The engine ticked as it cooled, the sound sharp against the drumming of rain on the roof of the Honda. David sat with his hands at ten and two, though the car was in park. On the passenger seat lay a manila envelope. Inside was a corrected invoice and a check for the difference, plus interest. It amounted to three weeks of grocery money. Maybe a month, if he skipped the gym membership and the streaming services.

  He had been sitting here for twelve minutes.

  Inside the glass office building ahead, the client was waiting. They had noticed the error. They hadn't complained, just asked for a revision. David could walk in, hand over the envelope, apologize for the oversight, and preserve the integrity of the account. Or he could put the car in reverse, drive home, deposit the original check, and tell himself it was a billing ambiguity. A gray area.

  He looked at his reflection in the rearview mirror. He looked tired. He told himself he was too tired for this kind of moral calibration.

  *It's not about honesty,* he thought, testing the weight of the idea. *It's about survival.*

  He leaned into the thought. He was a father. That was a fact. The mortgage was a fact. The commission structure that penalized refunds was a fact. These were things fixed in the world, heavy and immovable like the wet asphalt outside. If he returned the money, he was not just being honest; he was being irresponsible. He was violating the demands of his situation. He was a creature determined by these pressures. To expect him to act otherwise was to ignore the reality of his position.

  *I don't have a choice,* he said to the empty car.

  The phrase felt smooth, polished by use. It turned him into something solid. A object pushed by causes. If he was determined by the mortgage, by the commission structure, by the fatigue in his bones, then he couldn't be blamed. Blame required a freedom he did not possess. He was just a salesman doing what salesmen do to keep the lights on. He was his facticity, nothing more.

  But then, a flicker.

  He knew, with a sudden nauseating clarity, that he could turn the key. He knew his hand was capable of gripping the envelope. He knew that no gun was held to his head. The mortgage did not physically compel him to keep the money; it merely presented a consequence for returning it. The commission structure did not force his hand; it only made honesty expensive.

  The anguish rose in his throat, acidic and hot. It was the dizziness of realizing that the walls of his situation were not actually closing him in; he was leaning against them. He was holding them up.

  He shifted in the seat, the leather creaking. To admit he had a choice was to admit that he was choosing to keep the money. It was to admit that he was not a father protecting his family, but a man protecting his comfort at the expense of his word. The facticity he had just used as a shield suddenly felt flimsy, like paper maché painted to look like stone.

  *But what else can I do?*

  The question was a trap. It presupposed that there was only one path, that the terrain dictated the movement. But he knew the terrain didn't move unless he moved it. He was the one giving the facts their power. He was investing the mortgage with the authority to command theft. He was investing the role of "provider" with the necessity of deceit.

  He looked at the envelope again. It looked ordinary. Innocent. It didn't demand anything. *He* was demanding things of it. He was using it to anchor himself to a version of himself that was harmless, inevitable, a victim of the market.

  His heart hammered against his ribs, a frantic bird trying to break a cage that wasn't locked. If he stepped out now, he would be admitting that the last twelve minutes had been a performance. A play where he convinced himself he was a thing so he wouldn't have to be a consciousness.

  He reached for the door handle. His fingers hovered over the chrome.

  If he pulled it, he was choosing. If he stayed, he was choosing. There was no sliding back into the comfort of being determined. The realization that he was constructing the necessity in real-time made his stomach turn. He could feel the lie trembling, ready to shatter into the raw, unmediated knowledge that he was entirely alone in this car, entirely free, and entirely responsible for the man he was about to be when he opened the door.

  His hand tightened on the handle. The metal was cold. He held his breath, suspended in the gap between the excuse and the act, waiting for the vertigo to pass, knowing it wouldn't.
