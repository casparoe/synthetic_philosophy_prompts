answer: |-
  Rousseau: You sent for me. I suppose this is about Geneva.

  Diderot: It is about this Letter. You attack the theatre as a nest of vice. You attack me by extension.

  Rousseau: I attack the mask. If you wear it, you are implicated.

  Diderot: Let us speak of the actor then. You claim he hollows himself out. That to wear another's skin night after night is to lose your own soul.

  Rousseau: He becomes nothing. To weep on command, to love on cue—he trades his interiority for applause. He is always outside himself. He is a public prostitute of the spirit.

  Diderot: Or perhaps he is inside humanity itself. If the actor embodies a virtuous sufferer, and the audience weeps with him, is that not a school for compassion? You say the self is unified. I say it is capacious.

  Rousseau: It is not capacity, it is fragmentation. You say the audience learns compassion. I say they learn indulgence. I weep for Hecuba because it costs me nothing. I shed my tears in the dark, feel my own goodness, and go home unchanged. My pity is exhausted on the stage.

  Diderot: That is a risk, I grant you. But suppose the drama shows virtue rewarded? Suppose it makes the wicked man blush? If I can make a merchant cry for a starving widow onstage, I might loosen his purse offstage.

  Rousseau: You might. Or you might make him believe his tears are charity. He has paid his ticket; his moral debt is settled. The tear is the end of the duty.

  Diderot: You are too absolute. Look at Molière. You chastise me for defending Philinte over Alceste.

  Rousseau: Because Molière makes sincerity a joke. Alceste demands truth and is played the fool. Philinte lies politely and is the hero. You teach men to hate the honest man.

  Diderot: I teach them that virtue without benevolence is tyranny. Alceste loves truth, but he hates men. He uses honesty as a bludgeon. Is that virtue? Or is it pride?

  Rousseau: It is the pain of seeing corruption!

  Diderot: It is misanthropy. And here we touch the wound. You took my line—"only a wicked man is truly alone"—as a dagger.

  Rousseau: It was a dagger. You say solitude is wickedness. I say society is the lie.

  Diderot: Society is the only place virtue lives. If the theatre binds us in shared emotion, if it makes us feel less alone in our suffering...

  Rousseau: It binds us in shared illusion. You want to educate the passions. I say the passions must be silenced to hear conscience.

  Diderot: Conscience is cold. Passion moves the will. The actor offers his talent. Like an orator.

  Rousseau: An orator argues for truth. An actor argues for effect. The painter lies too, yes, but he puts three dimensions on a flat canvas. He does not speak. A man speaking words he does not mean corrupts the language itself.

  Diderot: Then we are at an impasse. You want men to be transparent, even if it breaks the social fabric.

  Rousseau: Better broken than false.

  Diderot: And I want men to be better, even if we must use artifice to polish them.

  Rousseau: You polish the chains.

  Diderot: I gild them so they do not cut. But tell me, Jean-Jacques, if you banish the poets, who will sing of the virtue you love?

  Rousseau: The heart sings its own song. It needs no stage.

  Diderot: Then it sings very quietly.

  Rousseau: Loud enough for conscience to hear.

  Diderot: Conscience is a quiet judge. The world is loud.

  Rousseau: Then the world should be silent.

  Diderot: It never will be. And neither will I.

  Rousseau: Nor I. But do not ask me to sit in your dark box and call it light.

  Diderot: Nor I ask you to walk alone in the woods and call it society.

  Rousseau: I call it freedom.

  Diderot: I call it exile. We shall see which man the century remembers.

  Rousseau: We shall see which man tells the truth.
