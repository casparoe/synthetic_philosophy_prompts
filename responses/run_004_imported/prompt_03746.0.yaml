answer: |-
  This is a sharp catch. You've identified the precise tension point in Chapter VI where Moore's metaphysics of value (organic unities) strains against his intuitive hierarchy of goods.

  To answer your question directly: **The admission does threaten the ranking of *simple* personal affection over aesthetic appreciation, but the "love of love" move is not just a rescue—it is the actual logical mechanism that secures the victory.** Without the "love of love" refinement, Moore's ranking of personal affection is arguably unstable given his own premises about the value of the *objects* involved.

  Here is the walkthrough of the argument structure, the wrinkle, and how the "love of love" functions as the necessary load-bearing wall.

  ### 1. The Common Structure: Organic Unities
  First, recall that for Moore, intrinsic value always resides in states of consciousness. Both Aesthetic Appreciation and Personal Affection are **organic unities** composed of two essential parts:
  1.  **Cognition:** An intellectual awareness of an object.
  2.  **Emotion:** An appropriate emotional response (love/admiration) toward that object.

  **The Formula:** `Value(Whole) ≠ Value(Cognition) + Value(Emotion)`. The value emerges from the *relation* between the two.

  *   **Case A (Aesthetic):** Cognition of a beautiful object (nature/art) + Emotion of admiration.
  *   **Case B (Personal Affection):** Cognition of a person's mental qualities + Emotion of love.

  Moore wants to conclude that **Case B > Case A**.

  ### 2. The Wrinkle: The Valuation of the Object
  Here is where your wrinkle bites. To justify B > A, one might assume Moore argues that the *object* of affection (a human mind) is intrinsically more valuable than the *object* of aesthetic appreciation (a beautiful landscape/painting).

  **Moore explicitly blocks this move.** In §113, he admits that the *existence* of a beautiful human mind is not clearly a greater good than the *existence* of a beautiful material object. He goes further: he suggests that if we strip away the bodily expression (the "signs" of the mind), the **cognition of the mental qualities in isolation** is difficult, less vivid, and potentially **less valuable** than the cognition of physical beauty.

  **The Structural Problem:**
  If `Value(Object_B) ≤ Value(Object_A)` (as Moore admits regarding the cognition component), and the `Emotion` component is roughly analogous (love vs. admiration), then on what basis does the *Whole* of Personal Affection exceed the *Whole* of Aesthetic Appreciation?

  If Moore relied solely on the *parts*, his admission undercuts the ranking. It suggests that simple personal affection might be *equal* to, or in some instances *less* than, high aesthetic appreciation.

  ### 3. The First Defense: Intensity of Emotion
  Moore's initial attempt to bridge this gap (before the "love of love" climax) is to argue that the **emotion** in personal affection is more intense and complex than in aesthetic appreciation.
  *   **Argument:** Loving a person involves a deeper emotional engagement than admiring a sunset.
  *   **Weakness:** This is empirically shaky and subjective. It leaves the ranking vulnerable. If a sublime aesthetic experience generates more intense emotion than a tepid personal relationship, the hierarchy flips. Moore needs a structural guarantee, not just an intensity contest.

  ### 4. The "Love of Love" Move: Changing the Ontology of the Object
  This is where Moore secures the win. In §115, he refines the definition of the highest good. It is not merely "Personal Affection" (loving a person). It is **"the love of what is good in others."** Specifically, it is loving someone *for their own capacity to appreciate good things*.

  **The Structural Shift:**
  *   **Simple Affection:** `Cognition(Person's Mind) + Emotion(Love)`
  *   **Love of Love:** `Cognition(Person's Appreciation of Good) + Emotion(Love)`

  Notice the change in the **Object of Cognition**.
  *   In **Aesthetic Appreciation**, the object is a *material thing* (which has no intrinsic value; only the consciousness of it does).
  *   In **Simple Affection**, the object is a *mind* (which has some intrinsic value, but Moore is wavering on how much).
  *   In **Love of Love**, the object is *another state of consciousness that is itself an organic unity of value*.

  ### 5. Does it Rescue the Ranking?
  Yes, but it concedes that **Simple Affection** does not automatically beat **Aesthetic Appreciation**.

  **Why the Rescue Works:**
  1.  **Recursive Value:** By making the object of affection *another valuable state of consciousness* (the other person's appreciation of the good), Moore creates a "double" organic unity. You are valuing a whole that is *already* valuable.
  2.  **Ontological Superiority:** Moore holds that states of consciousness are the only things with intrinsic value. Therefore, loving a *state of consciousness* (the other's love) is structurally superior to loving a *material object* (the beautiful thing), even if the material object is beautiful.
  3.  **Solving the Wrinkle:** The admission that "disembodied mental qualities" are hard to value is bypassed. We don't need to value the mind in isolation; we value the mind *in action* (appreciating). The "love of love" focuses on the *activity* of valuing, which is undeniably a high-value state of consciousness, rather than the static *quality* of the mind, which was the source of the wrinkle.

  ### 6. The Verdict for Your Seminar
  The admission **does quietly undercut** the claim that *mere* personal affection is superior to aesthetic appreciation. Moore essentially admits that if you compare "Loving a Person" vs. "Admiring a Masterpiece," the latter could win if the person's mind isn't actively engaged in good.

  The "Love of Love" move **rescues the hierarchy**, but it does so by redefining the winner. The highest good isn't "Personal Affection" broadly construed; it is a specific, reflexive subset of it.

  **The Takeaway Structure:**
  1.  **Thesis:** Personal Affection > Aesthetic Appreciation.
  2.  **Antithesis (The Wrinkle):** The *object* of Affection (mind) is not clearly more valuable than the *object* of Aesthetics (beauty), threatening the thesis.
  3.  **Synthesis (Love of Love):** The highest good is not loving the *person*, but loving the *person's love of the good*. This makes the object of affection a *valuable consciousness*, which is ontologically superior to a *beautiful object*.

  **Seminar Point:** You can argue that Moore's "Ideal" is not actually about relationships (person-to-person) but about **consciousness-to-consciousness**. The "Love of Love" is the moment Moore prioritizes the *appreciation of value* over the *bearer of value*. The "wrinkle" reveals that for Moore, persons are only the highest good insofar as they are vessels for the appreciation of good. If they stop appreciating, their value as objects of affection drops, potentially below that of a beautiful landscape. The "Love of Love" ensures the vessel is full.
