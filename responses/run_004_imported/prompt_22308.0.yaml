prompt: |-
  I'm working on a novel in which a young warehouse worker, newly drawn into a unionization drive, is handed a photocopied page from Marx by an older organizer, and I want the scene where she reads it to honor the actual argument rather than flatten it into a slogan. The passage, from the "Estranged Labour" section of the 1844 Manuscripts (Milligan translation), reads:

  "Man is a species-being, not only because in practice and in theory he adopts the species (his own as well as those of other things) as his object, but – and this is only another way of expressing it – also because he treats himself as the actual, living species; because he treats himself as a universal and therefore a free being. [...] The animal is immediately one with its life activity. It does not distinguish itself from it. It is its life activity. Man makes his life activity itself the object of his will and of his consciousness. He has conscious life activity. It is not a determination with which he directly merges. Conscious life activity distinguishes man immediately from animal life activity. It is just because of this that he is a species-being. Or it is only because he is a species-being that he is a conscious being, i.e., that his own life is an object for him. Only because of that is his activity free activity. Estranged labor reverses the relationship, so that it is just because man is a conscious being that he makes his life activity, his essential being, a mere means to his existence."

  I know this is meant to be the third of Marx's four aspects of alienation, but two things keep slipping away from me. First, what exactly does "species-being" pick out here — consciousness as such, a capacity for universality, the fact that one's own life becomes an object of one's will, or some fusion of these that Marx isn't cleanly separating? Second, I can't reconstruct the reversal in the final sentence: what was the relationship before estrangement, what does estranged labor do to invert it, and why does Marx treat that inversion, rather than plain hardship, as the deeper injury? I'd like a close reading of just this stretch before deciding how much of the argument my character could plausibly hold onto in her own voice.
