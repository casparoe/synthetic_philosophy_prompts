prompt: |-
  ok so at my school's philosophy club we went down this whole rabbit hole on the identity of indiscernibles — basically the idea that if two things share literally every single property, they have to actually be one and the same thing, not two things. someone brought up Max Black's two spheres example: imagine a universe with absolutely nothing in it except two solid iron spheres, totally identical in every way, just floating there some distance apart from each other. Black's whole point is that since nothing distinguishes them property-wise, but there's still clearly two of them, that alone proves the principle is false. everyone in the club acted like this was deffinitely case closed against Leibniz.

  but then i was reading through an old askphilosophy thread and some comment said the thought experiment secretly depends on treating space as "absolute," like space has its own built-in structure that makes sphere A's spot a genuinely different thing from sphere B's spot, even though nothing else about them tells them apart. they used the word "substantivalism" for this and honestly im not 100% sure i even understand what that means. what's bugging me is that this seems kind of ironic, since Leibniz was literally the guy who argued AGAINST Newton on absolute space, insisting space is nothing over and above the relations between objects. so now i'm stuck on: does Black's spheres argument actually need this "absolute space" assumption to even work? and if it does, doesn't that mean it's not really a fair counterexample to Leibniz's principle, since an actual Leibnizian relationalist wouldn't even grant that assumption to begin with? i asked my philosophy teacher about this and she just kinda shrugged lol, so i figured i'd try asking somewhere else instead. can you break down how the relational-vs-absolute-space stuff actually connects to whether the two spheres thing really refutes the identity of indiscernibles or not?
