answer: |-
  Here are ten interview questions designed to move past the elevator pitch and engage with the technical friction points of AI Debate. They are ordered to build a narrative arc from specific mechanistic failures to broader empirical and theoretical concerns, ending with your requested "kill switch" question.

  1.  **The Obfuscation Problem:**
      "A central critique of debate is the 'obfuscated arguments' problem. The worry is that a dishonest debater doesn't need to make a blatant error; they can bury a flaw inside a long chain of sub-claims that each look locally consistent. The honest debater then faces a search problem they can't solve cheaply. How do you respond to the claim that debate simply shifts the burden from *verifying* an answer to *finding* the flaw, without guaranteeing the flaw is findable?"

  2.  **Follow-up on Obfuscation:**
      "You've likely considered mitigations like recursive decomposition or forced cross-examination to prune that search space. But if we have to decompose claims down to a level a human can verify, do we lose the efficiency gain that made debate scalable in the first place? At what point does the oversight cost exceed the cost of just solving the problem ourselves?"

  3.  **Complexity Theory vs. Gradient Descent:**
      "The theoretical case for debate leans heavily on an analogy to interactive-proof systems in complexity theory, where a bounded verifier can check a powerful prover. But those proofs assume idealized agents. Real models are shaped by self-play and stochastic gradient descent. Does the mathematical guarantee survive the transition from 'idealized prover' to 'neural net optimized for reward'?"

  4.  **Follow-up on Training Dynamics:**
      "For that guarantee to hold in practice, the training process has to align the model's incentives with the theoretical assumptions. What specifically has to be true about the training regime to ensure the model learns to *expose* flaws in the opponent's logic rather than learning to *mask* flaws in its own logic to maximize win rate?"

  5.  **Persuasion vs. Truth:**
      "There is a suspicion that training a debater against a fallible judge selects for whatever is persuasive to that judge rather than for honesty as such. Essentially, you risk optimizing for rhetorical sophistication over truth-tracking. How do you disentangle 'winning the debate' from 'being right' when the only signal the model gets is the judge's decision?"

  6.  **Follow-up on Empirical Evidence:**
      "Looking at the human-judge experiments run so far, do we actually see the truth-tracking advantage the theory predicts? Or do the results show something considerably weaker—that models are just getting better at exploiting human cognitive biases, which might not generalize to superhuman capabilities?"

  7.  **The Asymmetry Assumption:**
      "The core intuition of debate is that a lie is more expensive to sustain than a truth is to defend. But in high-dimensional semantic spaces, is that asymmetry guaranteed? Could there be domains where fabricating a plausible narrative is computationally cheaper than verifying the ground truth, effectively inverting the advantage you're relying on?"

  8.  **The Judge Bottleneck:**
      "If we scale this to superhuman systems, we can't rely on human judges forever; we'd need to use weaker models as judges. But if the weaker model shares the same architectural biases as the debaters, couldn't they converge on a shared 'language' of deception that the judge accepts but is factually wrong? Does debate just kick the alignment can down the road?"

  9.  **Compute and Feasibility:**
      "Debate requires running multiple models for multiple turns to generate a single oversight signal. Compared to other scalable oversight proposals like amplification or automated red-teaming, does debate have a compute disadvantage that makes it impractical for real-time deployment on high-stakes queries, regardless of its theoretical safety benefits?"

  10. **The "Kill Switch":**
      "Finally, I want to ask about falsifiability. What specific result, if it arrived tomorrow—whether from a theoretical proof or an empirical trial—would convince you that debate does not scale and should be dropped from the scalable-oversight toolkit?"
