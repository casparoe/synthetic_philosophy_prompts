answer: |-
  Your friend’s argument is a classic philosophical puzzle known as **Logical Fatalism** (or the "Sea Battle" argument, first posed by Aristotle). While the logic feels airtight, it is generally considered **unsound**.

  The argument fails at the specific step where your friend confuses **logical truth** with **causal necessity**.

  Here is the breakdown of exactly where the reasoning breaks down:

  ### 1. The Confusion: Truth vs. Necessity
  Your friend’s argument relies on the **Principle of Bivalence**: the idea that the statement "Team A will win" is either true or false right now.
  *   **The Error:** Your friend assumes that because the statement is *true*, the event is *necessary*.
  *   **The Reality:** A statement can be true without being necessary. This is called **contingent truth**.
      *   *Example:* It is true that you are reading this sentence. However, it was not *necessary* that you read it; you made a choice to do so. The truth of the statement does not force you to read; your reading makes the statement true.

  ### 2. The Direction of Fit (The Map vs. The Territory)
  The argument breaks down because it reverses the relationship between reality and language.
  *   **The Friend’s View:** The truth of the statement exists independently and forces the match to happen that way. (The map controls the territory).
  *   **The Reality:** The truth of the statement is determined by the match. The statement "Team A will win" is only true *because* Team A will win. (The territory controls the map).

  ### 3. Effort is the Cause, Not the Obstacle
  Your friend claims that effort "doesn't do any real work." This is incorrect because effort is the **mechanism** that creates the truth.
  *   If "Team A wins" is true, it is true *because* the players exerted effort, made good passes, and scored goals.
  *   If the players had not exerted effort, the statement "Team A will win" would be false.
  *   Therefore, the players' effort is the **causal engine** that makes the proposition true.

  ### Summary
  The argument fails because it treats the **description** of the future (logic) as if it were a **force** acting on the future (physics).

  The result is "fixed" only in the sense that the future is a specific reality, not an infinite set of possibilities. However, that reality is produced entirely by the causal chain of events—including the players' effort—that leads up to it. The match does not reveal a pre-existing script; it writes the script.
