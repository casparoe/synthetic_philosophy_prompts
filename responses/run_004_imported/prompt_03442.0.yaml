          *   *Norm Prediction:* Intentional (because a norm was violated).
      *   **Scenario 2 (Favoring Norm):** The agent has a specific value that *aligns* with a positive outcome, but no norm is violated (or a norm is followed).
          *   *Wait, the Knobe effect is usually about asymmetry.*
      *   Let's focus on the **Norm Violation vs. Deep Self Concordance** regarding the *side effect*.
      *   I need a case where the side effect is **Normatively Neutral/Bad** but **Deep Self Congruent**, OR **Normatively Bad** but **Deep Self Incongruent**.

      *   *Idea 1: The Reluctant Violator.*
          *   Agent cares deeply about NOT violating a norm.
          *   Agent does something where violating the norm is a side effect.
          *   *Deep Self:* "I hate violating norms!" -> Outcome conflicts with Deep Self -> **Unintentional**.
          *   *Norm:* A norm was violated. -> **Intentional**.
          *   *Problem:* If they hate it, they probably try to avoid it. If it happens anyway, was it a side effect of pursuing a goal?
