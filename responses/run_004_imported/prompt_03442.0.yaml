      *   *To Split Them:* I need a character who is *good* but does something *bad* (accidentally/side-effect), OR a character who is *bad* but does something *good* (side-effect).
      *   *Actually, it's more subtle.* It's about the *side effect*.
      *   **Scenario 1 (Favoring Deep Self):** The agent has a specific value that *opposes* the norm violation, but the side effect violates the norm anyway.
