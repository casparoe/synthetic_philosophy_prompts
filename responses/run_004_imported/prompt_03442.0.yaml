      *   *Idea 4: The "Good" Person Doing "Bad" (Harm Case).*
          *   Chairman harms environment. People say "Intentional".
          *   Why? Norm: Harming is bad (Violation). Deep Self: He's greedy (Match).
          *   To split them: We need a Good Person (Deep Self = Good) who Harms (Norm = Bad).
          *   *Scenario:* A deeply compassionate CEO implements a policy to save jobs (Goal). She knows it will harm the environment (Side Effect). She is personally devoted to environmentalism (Deep Self).
