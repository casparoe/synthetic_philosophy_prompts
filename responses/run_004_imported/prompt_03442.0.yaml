prompt: |-
  Had a long argument with my friend last night about the Knobe effect - the chairman/environment case where harming the environment as a side effect gets called "intentional" by something like 80% of people, but helping it as a side effect only gets called intentional by like 20%. We both agree the effect is real, we just disagree about why its happening. I was on team Uttich & Lombrozo: a norm violation just tells you more about what's going on in someone's head than norm-following behavior does, nothing inherently moral about it. My friend was team Sripada, arguing its really about whether the outcome matches the guy's "deep self" (his stable values/character), regardless of whether any norm got broken. We eventually realised the classic chairman case can't settle this between us, since the norm violation and the deep-self mismatch happen to line up perfectly there - harming the environment is both the norm violation AND the thing that matches how callous he supposedly is. Could you come up with a new example, pretty different from the chairman one, where the norm-violation account and the deep-self account would predict different calls on whether the outcome was intentional?
reasoning: |-
  Here's a thinking process that leads to the suggested thought experiment:

  1.  **Analyze the Request:**
      *   **Topic:** The Knobe Effect (Side-Effect Effect).
      *   **The Dispute:** User supports Uttich & Lombrozo (Norm Violation/Informational Account) vs. Friend supports Sripada (Deep Self/Character Account).
      *   **The Problem:** The classic Chairman case confounds norm violation (harming environment is bad) with deep self mismatch (harming suggests callousness). Both accounts predict "Intentional" for harm and "Unintentional" for help.
      *   **The Goal:** Create a *new* thought experiment where the two accounts diverge in their predictions.
      *   **Constraint:** Needs to be distinct from the Chairman case.

  2.  **Deconstruct the Theories:**
      *   **Uttich & Lombrozo (Norm Violation/Informational):** People attribute intentionality when an action violates a norm (moral or otherwise) because violations provide more diagnostic information about the agent's mental state. If a norm is *followed*, it's ambiguous (could be accident, could be intent). If a norm is *broken*, it implies specific intent to break it. Crucially, this theory suggests *any* salient norm works, not just moral ones, but the prompt focuses on the moral/normative aspect vs. deep self. Let's refine: The core claim is that *normativity* drives the judgment. If something is "wrong" (violates a norm), it's intentional. If it's "right" or neutral, it's less likely to be intentional.
      *   **Sripada (Deep Self):** People attribute intentionality when the outcome aligns with the agent's deep self (values, character, commitments). If the side effect reveals something true about who they *really* are, it's intentional. If it conflicts with their deep self, it's unintentional.

  3.  **Identify the Divergence Point:**
      *   To separate them, I need a scenario where:
          *   **Case A:** Norm Violation = YES, Deep Self Alignment = NO.
          *   **Case B:** Norm Violation = NO, Deep Self Alignment = YES.
      *   *Wait, let's look closer.*
      *   **Uttich & Lombrozo:** Intentionality $\leftarrow$ Norm Violation. (Bad/Wrong = Intentional).
      *   **Sripada:** Intentionality $\leftarrow$ Deep Self Concordance. (Matches Character = Intentional).
