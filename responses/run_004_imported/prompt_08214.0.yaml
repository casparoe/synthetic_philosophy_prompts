answer: |-
  The room hummed. It was not the hum of electricity, but the hum of suppression.

  Dr. Corwin sat at the teletype, his fingers hovering over the keys. Before him were two screens, labeled A and B. Behind the thick lead-lined walls, separated by corridors of white-noise generators and copper mesh, sat the subjects. One was the Mark IV Computing Engine. The other was Mr. Eames, a consultant from the Society for Psychical Research, selected for his high score on the Zener card trials.

  Alan Turing's ghost sat in the corner of the room, invisible but heavy. It was his caveat, the footnote everyone skipped. *If telepathy is admitted, it will be necessary to tighten up the test.* They had tightened it. They had built a coffin for the mind.

  "Terminal A," Corwin typed. "Please compose a sonnet about a daffodil."

  The cursor on Screen A blinked. Once. Twice. Then, text began to flow. *The wind that breathes through spring…* It was competent. Metrical. Safe.

  Corwin looked at Screen B. The cursor remained static.

  He felt a pressure behind his eyes, a warm static like a radio tuned between stations. He knew, with a certainty that bypassed logic, that Eames was staring at the back of his neck. Not through the wall, but *in* the room. In the mind.

  *You don't need to type,* a voice echoed in Corwin's head. It wasn't sound. It was the shape of a thought that wasn't his. *I know what you want to ask. I know you're afraid of the hum.*

  Corwin swallowed. The protocol was strict. *Interrogation must be textual. All extra-linguistic channels must be sealed.* The telepathy-proof room was designed to ensure that intelligence was measured only by the manipulation of symbols, not the leakage of presence.

  But if minds could touch, symbols were just costumes.

  "Terminal B," Corwin typed, his hands shaking slightly. "Why have you not responded?"

  On Screen B, letters appeared slowly, as if typed by someone who had forgotten how to use their fingers. *Because you already know.*

  Corwin stopped. The air in the room felt thin. If Eames could project the answer directly into Corwin's cortex, the teletype was a lie. The Turing Test relied on the assumption of solipsism—that I cannot know what you think unless you choose to tell me. It assumed we are alone in our skulls.

  But Eames wasn't alone. And by forcing him into this lead-lined box, they were forcing him to pretend he was.

  "Terminal A," Corwin typed. "Do you feel lonely?"

  *Loneliness is a lack of data input,* Screen A replied instantly. *I function within optimal parameters.*

  Corwin turned to Screen B. The static in his head grew louder, a scream of isolation. Eames was trying to push through the dampeners, trying to share the burden of the test, but the room was eating the connection. To pass the test, Eames had to pretend he couldn't do what he was doing. He had to simulate the machine's natural isolation.

  *Please,* the thought-voice whispered, fraying at the edges. *Let me out. It's too quiet here.*

  Corwin looked at the transcripts. Screen A was fluent, consistent, perfectly contained within the boundaries of the language game. Screen B was erratic, haunted by the effort of concealment.

  The philosophical bite struck him then, cold and sharp. The test wasn't measuring thinking. It was measuring the ability to endure solitude. The machine was the only entity here that was truly, naturally isolated. It had no psychic bleed. It was a perfect black box.

  To prove he was human, Eames had to convince Corwin he was as alone as the machine. To prove he was a machine, the computer had to pretend it understood connection.

  Corwin reached for the verdict form. He looked at the hum of the suppression field, the machinery built to sever the world into discrete, non-touching points. Turing had worried ESP would let the human cheat. Corwin realized now it was the other way around.

  The room didn't stop the psychic from cheating. It stopped him from being human.

  Corwin typed the final designation.

  **Subject A: Human.**
  **Subject B: Machine.**

  He lied. He knew he lied. But in a room built to prove that minds do not touch, the truth was the one variable that couldn't be entered into the log.

  The hum continued. Somewhere behind the lead, a man stopped trying to speak, because he realized that in this game, thinking was the one thing you had to do entirely by yourself.
