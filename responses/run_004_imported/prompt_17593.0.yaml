  8.  *(Self-Correction during drafting)*: Make sure to distinguish between the *Synchronic* Dutch Book (probabilities at one time) and *Diachronic* (updating). The user specifically asked about Diachronic.
      *   Also, clarify that in prediction markets, transaction fees make the money pump real, whereas DB is usually theoretical "sure loss."
