      *   *The ESP Objection:* If a human can transmit thoughts directly to the interrogator (telepathy), the interrogator might identify the human not by *intelligence* but by *psychic signal*. Conversely, a machine might fail not because it lacks thought, but because it lacks psychic ability.
      *   *Turing's Fix:* Isolate the participants (telepathy-proof room) to equalize conditions.
      *   *The User's Intuition:* This seems weird for a rigorous logician. Is it a fatal flaw?

