      *   *The "Black Box" violation:* The Turing Test assumes the *only* channel of communication is the typed text. ESP posits a hidden channel.
      *   *The Burden of Proof Shift:* By acknowledging ESP as a variable to be controlled, Turing admits that the I/O behavior *alone* is insufficient to distinguish human from machine. He admits there are non-computational, non-behavioral properties (psychic ones) that define "human."
      *   *The "Telepathy-Proof Room" implies dualism:* If you need to block psychic rays, you are treating the mind as something that can emit rays independent of the physical body/interface. This clashes with the materialist/computationalist underpinning of the machine.
      *   *Infinite Regress of Controls:* If we need to block ESP, what about other unknown physical phenomena? The test becomes about controlling the environment, not measuring the output.
