      *   **Thomas Hill's View (Latitude as Supererogation):** Imperfect duties (wide duties) allow *playroom* (Spielraum). You must adopt the maxim of beneficence, but you choose *when, how, and how much*. Once you meet a threshold of "sufficient compliance," extra acts are genuinely optional and praiseworthy. This creates a functional equivalent of supererogation.
      *   **Marcia Baron's View (Latitude is not Exemption):** The duty is to make the end (others' happiness) your own. The latitude is only about *judgment* in application, not about *quantity* limits. You can never say "I've done enough beneficence now, I can stop forever." Therefore, there is no point where an act becomes "above and beyond" the call of duty; it's all part of the ongoing requirement.

