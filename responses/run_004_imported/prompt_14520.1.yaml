      *   *My Goal:* Show that $P_1$ and $P_2$ cannot be easily separated in practice, especially when the *community* is the arbiter of both.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Baseline.* Start by asking for clarity on the "baseline."
