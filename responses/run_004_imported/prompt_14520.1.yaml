          *   *Strategy:* Who decides they can't achieve it? The community.

      *   *Question 4: The Arbiter Problem.* Focus on who does the conferring.
          *   *Q:* If the community confers the thick status, who recognizes the baseline? If the community is wrong about the baseline, who corrects them?
          *   *Likely Reply:* The community is fallible, but the baseline is objective/metaphysical.
