          *   *Difference 2: The Nature of the Commitment.* At $t_1$, are you actually accepting a bet that pays off at $t_2$? Or is the $t_2$ bet a *new* decision? If it's a new decision, you are free to change your mind. If you are forced to stick to the $t_1$ plan, is that rationality or pre-commitment?
