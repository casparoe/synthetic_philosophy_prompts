answer: |-
  This is a fascinating tension, and given your background in physics and Bayesian analysis, you are uniquely positioned to spot the friction between the *formalism* Ramsey invented and the *philosophy* he lived by.

  If we look closely at Ramsey's corpus—specifically the interplay between "Truth and Probability" (1926) and "The Meaning of Life" (1925)—I believe Ramsey would have rejected the Longtermist argument. He wouldn't have rejected the math; he would have rejected the **inputs** (the priors and the utility function) as philosophically incoherent and psychologically impossible.

  Here is why Ramsey would likely have called Longtermism a category error, or as you put it, a "fanatical misuse of his own math."

  ### 1. The Bayesian Objection: Priors Without Feedback
  As a physicist, you know that a Bayesian update is only as good as the prior and the likelihood function. Ramsey's definition of probability as a "degree of belief" was never meant to be a license for ungrounded speculation.

  For Ramsey, beliefs were habits of action. A probability was meaningful only insofar as it guided action in a context where the outcome could, in principle, be observed and the belief calibrated. In "Truth and Probability," he emphasizes that our degrees of belief should be derived from our actual psychological tendencies and empirical evidence, constrained by coherence (avoiding Dutch books).

  The Longtermist calculation relies on priors regarding events centuries or millennia hence (e.g., the probability of space colonization, the moral value of digital minds, the risk of AI extinction). These are "unique events" with no reference class. You cannot form a coherent betting odd on the population of the 30th century because there is no feedback loop. You cannot update.

  Ramsey would likely argue that assigning a specific non-zero probability to these speculative scenarios isn't "rational belief"; it's numerology. To a pragmatist, a probability that cannot be tested or calibrated by experience is meaningless. He would say the Longtermists are treating subjective speculation as if it were objective likelihood, violating the spirit of his betting interpretation.

  ### 2. The Ethical Objection: Extensive vs. Intensive Value
  This is where his essay on "The Meaning of Life" becomes the smoking gun.

  Longtermism relies on a **totalist utilitarian** framework: Value aggregates linearly across time and population. If $V$ is the value of a life and $N$ is the number of lives, Total Value $= V \times N$. If $N$ is astronomical, Total Value is astronomical.

  Ramsey explicitly rejected the idea that scale confers value. In his essay, he writes:
  > *"It is not true that because the universe is so big, we are so small... The good things in life are not less good because they are few."*

  Ramsey was an "ideal utilitarian" (influenced by G.E. Moore), believing that goods like love, beauty, and knowledge were intrinsic. Crucially, these goods are **intensive**, not extensive. The value of a moment of human connection does not increase because it is replicated a trillion times in the future, nor does it decrease because the universe is vast.

  For Ramsey, the "importance" of an action is determined by the quality of the goods it promotes in the context of human life, not by the spatiotemporal magnitude of its consequences. He would likely view the Longtermist attempt to "swamp" present suffering with future potential as a misunderstanding of what "value" actually is. To Ramsey, a unit of suffering now is not tradable against a hypothetical unit of happiness in 3024, because the *reality* of the suffering now outweighs the *abstraction* of the happiness later.

  ### 3. The Pragmatic Objection: The Limits of the "Bet"
  Ramsey's probability theory is grounded in the concept of the **bet**. But a bet implies a stakeholder who exists to collect the winnings.

  Longtermism asks us to "bet" the well-being of existing people against the potential existence of future people. Ramsey would point out the incoherence here: The current generation is being asked to sacrifice certain goods for a payoff they will never experience, based on odds they cannot verify.

  In decision theory, this touches on the problem of **bounded utility**. Ramsey was a mathematician who understood convergence. He would likely recognize the Pascal's Mugging dynamic immediately. If your utility function is unbounded, expected value calculations break down (the St. Petersburg paradox). Ramsey's system was designed to help humans make reasonable decisions, not to optimize for abstract mathematical infinities that detach from human psychology.

  He would likely argue that a rational agent must have a discount rate—not necessarily a financial one, but an epistemic one. As the causal chain lengthens and the uncertainty compounds, the "degree of belief" should decay faster than the population numbers grow. To let the population numbers win is to ignore the uncertainty in the model itself.

  ### The Verdict
  Ramsey would likely tell the Longtermists: **"You have used my calculus to solve an equation that doesn't describe reality."**

  He would acknowledge that *if* you accept their priors and *if* you accept totalist utilitarianism, the math works. But he would argue that both assumptions are false:
  1.  **False Priors:** You cannot have a rational degree of belief about the far future that is precise enough to drive policy.
  2.  **False Utility:** Value is not a substance that accumulates over time; it is a quality of experience in the present.

  Given his reputation for clarity and lack of pretension (Wittgenstein called him a "machine" for his logical precision, but his friends knew him as deeply humanistic), Ramsey would probably view Longtermism as a form of intellectual hubris. It uses the veneer of scientific rigor (Bayesian EV) to justify a moral intuition (that the future matters more) that cannot itself be scientifically justified.

  He would likely say that we should care about the future, yes, but not because it is *big*, and not at the expense of the *real*. As he wrote: *"We are part of the universe, and its life is our life."* The importance comes from the connection, not the magnitude.

  So, to answer your question: He would have called it out. Not because he disliked the math, but because he respected it enough to know when it was being asked to carry weight it wasn't designed to bear.
