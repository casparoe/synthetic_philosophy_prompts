  7.  **Final Polish:** (Writing the actual dialogue based on these thoughts.) *Focus on the specific mechanics of the $t_i$ argument.* Make sure Mark explains *why* the margin for error principle holds (indistinguishability leading to potential error). Make sure Elena explains *why* it fails (the nature of phenomenal presence).

