prompt: |-
  I have been working through Jeff McMahan's revisionist critique of the traditional "moral equality of combatants" for a seminar on the ethics of war, and one move in the dialectic keeps bothering me. Against the traditional independence thesis — the view, associated with Michael Walzer, that jus in bello is independent of jus ad bellum, so that combatants fighting for an unjust cause are not murderers provided they observe the rules of war — McMahan argues that liability to lethal defensive force tracks responsibility for posing an unjust threat. On his view, unjust combatants are liable to be killed by their just adversaries, since fighting for a cause that lacks just cause makes them responsible for an unjust threat, while just combatants pose no such threat and so remain non-liable, retaining their right not to be killed even by unjust combatants who are merely obeying orders. The obvious objection is epistemic: individual soldiers are almost never in a position to determine, from the inside, whether their war satisfies jus ad bellum, so it seems both unfair and practically unworkable to make the permissibility of their fighting hinge on a fact they cannot access. McMahan's standard reply is to grant that this shows unjust combatants are typically excused for fighting while denying that it justifies their fighting: on his view, a reasonable but false belief that one is permitted to kill does not make the killing itself permissible.

  I would like you to push back specifically on that excuse/justification distinction, rather than on McMahan's account of liability more generally. Please construct the strongest argument you can that the epistemic situation actually facing ordinary soldiers — asymmetric access to intelligence, dependence on a chain of command, severe time pressure, and the unreliability of unaided individual judgment about matters of state that even experts dispute — does not merely excuse unjust combatants but can render their fighting objectively permissible, so that something close to the moral equality of combatants is recoverable from within McMahan's own liability-based framework, rather than defended only on the separate, more institutional ground that the law of war must remain usable independently of the "deep morality" of any given conflict. I suspect some version of this move has been tried in the broader literature on acting permissibly under uncertainty, but please work the argument out for yourself rather than summarizing what you take existing proposals to say, and be explicit about exactly where and why it blocks the inference from "reasonably believed permissible" to "merely excused."
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Topic:** Jeff McMahan's revisionist critique of the "moral equality of combatants" (MEC). Specifically, the distinction between *justification* and *excuse* regarding unjust combatants.
      *   **McMahan's Position:** Unjust combatants are liable to be killed (because they pose an unjust threat). Just combatants are not. Unjust combatants might be *excused* due to epistemic limitations (they don't know the war is unjust), but their actions remain *unjustified* (objectively impermissible).
      *   **Task:** Construct the strongest argument *against* McMahan's excuse/justification distinction in this specific context. Argue that the epistemic situation of soldiers can render their fighting *objectively permissible* (justified), not merely excused.
      *   **Goal:** Recover something close to MEC from within McMahan's liability-based framework (without relying solely on Walzerian institutional/pragmatic arguments).
      *   **Constraint:** Do not just summarize existing literature (e.g., Lazar, Fabre, etc.); work the argument out explicitly. Focus on where and why the inference from "reasonably believed permissible" to "merely excused" is blocked.

  2.  **Deconstruct McMahan's Core Claim:**
      *   *Liability:* Based on objective moral responsibility for an unjust threat.
      *   *Epistemic Objection:* Soldiers can't know *jus ad bellum*.
      *   *McMahan's Reply:* Ignorance excuses but doesn't justify. Objective permissibility depends on the facts (is the war actually just?), not beliefs. Therefore, unjust combatants are still liable, even if blameworthy.
      *   *The Weak Point:* The rigid separation between objective facts and subjective epistemic states in the context of *moral liability to defensive harm*.

  3.  **Brainstorming the Counter-Argument (The "Epistemic Constraint on Liability"):**
      *   *Idea 1: Objective Permissibility is Epistemically Relative.* Maybe "objective" doesn't mean "God's eye view." Maybe it means "relative to the available evidence." If so, acting on best evidence *is* objectively permissible.
      *   *Idea 2: The Nature of Liability.* Liability requires fault or responsibility. If a soldier is non-culpably ignorant, are they truly "responsible" for the threat in the way required for liability? McMahan says yes (they are still the agent of the threat). I need to argue no (agency requires epistemic access to moral status).
      *   *Idea 3: Symmetry of Risk.* Both sides face epistemic uncertainty. If we demand objective truth for justification, we create a paradox where no one can ever know if they are justified until after the war. This undermines the action-guiding nature of morality.
      *   *Idea 4: The "Right to Kill" vs. "Liability to be Killed".* If a soldier is justified in fighting, the enemy cannot be liable to be killed by them. If McMahan grants excuse but denies justification, he maintains the enemy's liability. I need to show that reasonable belief negates liability.

  4.  **Developing the Core Argument: "Evidence-Relative Objective Permissibility"**
      *   *Premise 1:* Moral norms governing lethal force must be action-guiding. (Standard objection).
      *   *Premise 2:* Liability to defensive killing is a severe moral status that requires a robust connection between the agent's will and the wrongful harm.
      *   *Premise 3:* In conditions of radical epistemic asymmetry (soldiers vs. state intelligence), the "objective facts" of *jus ad bellum* are not accessible to the agent.
      *   *Crucial Move:* Distinguish between *Outcome-Relative* Objectivity (did the war actually meet JAB?) and *Evidence-Relative* Objectivity (did the agent act correctly given the evidence?).
      *   *Claim:* In the context of *liability*, Evidence-Relative Objectivity is the only coherent standard. Why? Because liability is about forfeiting rights. You don't forfeit rights against someone who is reasonably trying to do the right thing, even if they are factually mistaken.
      *   *Blocking the Inference:* McMahan infers "Factually Wrong $\rightarrow$ Unjustified $\rightarrow$ Liable." I need to block at "Factually Wrong $\rightarrow$ Unjustified." I argue that "Justified" means "Acting in accordance with available moral evidence." Therefore, "Factually Wrong + Reasonable Belief $\rightarrow$ Justified."

  5.  **Refining the Argument (Addressing McMahan's Specifics):**
      *   McMahan distinguishes between *subjective* permissibility (blamelessness) and *objective* permissibility (liability).
      *   I need to argue that this distinction collapses in the context of *collective, epistemically opaque endeavors* like war.
      *   *Analogy:* Police shooting. If a cop reasonably believes a suspect has a gun (but it's a toy), is the suspect liable to be shot? Most say no. But is the cop *justified*? Yes, in a public/legal sense. McMahan might say the cop is excused but the suspect wasn't liable. This is counter-intuitive. If the cop is justified, the suspect shouldn't have a right to defend themselves against the cop.
      *   *Application to War:* If an unjust combatant is fighting based on reasonable state propaganda/intelligence, they are functionally indistinguishable from a just combatant *at the moment of engagement*. To say they are "objectively impermissible" implies a moral fact exists that they *ought* to have known, but ex hypothesi they couldn't.
      *   *The "Ought Implies Can" Argument:* If a soldier *cannot* know the war is unjust, they *ought not* be bound by the prohibition against fighting it. If they are bound by a prohibition they cannot access, morality becomes a trap.
      *   *Recovering MEC:* If both sides act on reasonable evidence, both are objectively permitted to fight. Therefore, neither is liable to be killed by the other (in the strong McMahan sense). This restores a form of MEC.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge McMahan's position (Liability $\rightarrow$ Responsibility $\rightarrow$ Objective Facts). State the thesis: The epistemic constraints of war shift the standard of "objective permissibility" from fact-relative to evidence-relative, collapsing the excuse/justification gap regarding liability.
      *   **Point 1: The Action-Guiding Function of Morality.** Morality cannot demand access to inaccessible facts. If *jus ad bellum* is opaque, it cannot serve as a binding constraint on individual liability.
      *   **Point 2: The Nature of Liability and Rights Forfeiture.** Liability isn't just about causing harm; it's about violating rights. You don't violate rights if you act on conclusive (but misleading) evidence that you are respecting them. Therefore, the "victim" (just combatant) retains their right, but the "aggressor" (unjust combatant) does not forfeit theirs.
      *   **Point 3: The Institutional Epistemic Division of Labor.** Soldiers are not moral auditors of state policy. Their role is defined by epistemic dependence. Judging them by "state-level facts" is a category error.
      *   **Point 4: Blocking the Inference.** Explicitly tackle the "Reasonably Believed $\rightarrow$ Merely Excused" move. Argue that "Objective" should be defined relative to the agent's epistemic position in high-stakes collective action.
      *   **Conclusion:** Summarize how this recovers a "liability-based MEC."

  7.  **Self-Correction/Refinement during drafting:**
      *   *Caution:* Don't slip into Walzer's conventionalism. Keep it within *revisionist* morality (liability framework).
      *   *Check:* Did I address "Objective Permissibility"? Yes, by redefining what "Objective" means in this context (Evidence-Relative Objectivity vs. Fact-Relative Objectivity).
      *   *Check:* Did I address the "Excuse/Justification" distinction? Yes, by arguing that reasonable belief *constitutes* justification in this context, not just excuse.
      *   *Nuance:* McMahan might argue that the *victim's* right not to be killed is objective. I need to address this. If the unjust combatant is justified, does the just combatant lose their right? That's too strong. Better argument: The unjust combatant does not *forfeit* their own right to life because they are not morally responsible for an *unjust* threat (only an *apparent* one). The Just Combatant killing them is therefore problematic. This creates symmetry.

      *   *Revised Strategy on Liability:* Focus on the *Unjust Combatant's Liability*. McMahan says they are liable. I argue they are *not liable* because liability requires culpability or at least non-culpable responsibility for a *wrongful* threat. If the threat isn't *knowably* wrongful, it doesn't generate liability.
      *   *Wait, one nuance:* McMahan argues innocent threats can be liable. So lack of culpability isn't enough. I need to focus on the *normative status of the threat*. If the agent reasonably believes the threat is just, they are acting as a *lawful agent of protection*, not an aggressor. The "unjustness" is a property of the war, not necessarily the individual's act given their epistemic state.
      *   *Key Philosophical Move:* Distinguish between *Material Unjustness* (the war is actually unjust) and *Formal Unjustness* (the soldier is violating a moral norm they can access). Liability attaches to Formal Unjustness.

  8.  **Final Polish:** Ensure the tone is academic, rigorous, and directly addresses the prompt's constraints (don't just summarize literature, work it out). Ensure the "blocking the inference" section is explicit.

      *(Self-Correction during drafting the "Blocking the Inference" section)*: I need to be careful. McMahan admits subjective permissibility. He denies objective permissibility. I need to argue that in the context of *interpersonal liability*, "objective permissibility" *just is* "evidence-relative permissibility." Why? Because liability is a relational property between two agents. If Agent A cannot know X, X cannot ground a liability relation between A and B.

      *Let's refine the "Objective" definition.* Parfit's distinction: Fact-Relative vs. Evidence-Relative. McMahan privileges Fact-Relative for liability. I argue Evidence-Relative is the correct standard for *interpersonal moral relations* under uncertainty.

      *Okay, ready to write.*
answer: |-
  The core of McMahan's revisionist project rests on a specific metaphysical claim about moral liability: that liability to defensive harm is grounded in *objective* moral responsibility for an *objectively* unjust threat. On this view, the moral status of a combatant's act is determined by the fact-relative truth of the *jus ad bellum*, not the evidence-relative beliefs of the agent. Consequently, when an unjust combatant fights under the reasonable but false belief that their cause is just, McMahan concedes they are *subjectively* permissible (and thus blameless/excused) but insists they remain *objectively* impermissible. This distinction is crucial for him because it preserves the asymmetry of liability: the unjust combatant is liable to be killed by the just combatant, even if the unjust combatant is not blameworthy.

  To recover a form of the Moral Equality of Combatants (MEC) within this liability framework, we must challenge the inference that **Fact-Relative Wrongness + Reasonable Belief $\rightarrow$ Objective Impermissibility (and thus Liability).**

  The argument below contends that in the specific context of collective, epistemically opaque violence, the standard for "objective permissibility" relevant to liability must be *evidence-relative*, not *fact-relative*. If this holds, then a combatant acting on reasonable evidence of *jus ad bellum* is not merely excused; they are objectively justified. Consequently, they do not forfeit their right to life, and the symmetry of liability required for MEC is restored.

  ### 1. The Relational Nature of Liability and Epistemic Access

  McMahan treats liability as a status that attaches to an agent based on their causal and moral contribution to an unjust state of affairs. However, this overlooks the *relational* nature of liability in defensive contexts. Liability is not a monadic property of the combatant (like "being guilty"); it is a dyadic relation between the potential defender and the potential target. It answers the question: *Does Agent A have a right to kill Agent B?*

  For Agent A to have a right to kill Agent B based on B's liability, B must have done something to forfeit their right against A. McMahan argues that posing an unjust threat is sufficient for forfeiture. But "unjust" here is doing too much work. If B poses a threat that is *factually* unjust but *evidentially* indistinguishable from a just threat, has B truly violated a norm that governs their relationship with A?

  Consider the function of moral norms. Norms are constraints on the will. For a norm to bind an agent, it must be possible for the agent to guide their will by it. In the context of modern warfare, the *jus ad bellum* status of a conflict is often a matter of classified intelligence, complex historical interpretation, and geopolitical nuance that is structurally inaccessible to the individual soldier. The soldier operates within an epistemic division of labor: the state assesses the *ad bellum* conditions; the soldier assesses the *in bello* conduct.

  If we maintain McMahan's fact-relative standard, we posit a moral reality where a soldier is liable to be killed for violating a constraint they *could not possibly have known applied to them*. This renders the moral relation between the two combatants unintelligible. If Combatant J (Just) kills Combatant U (Unjust but Reasonable), J is acting on the fact that U's war is unjust. But U is acting on the evidence that their war is just. From U's perspective, they are defending their community against aggression. If morality is to govern the interaction between U and J, it cannot rely on facts that are invisible to one party of the interaction. Therefore, the "objectivity" required for liability must be relative to the information available within the interaction. If U's belief is reasonable, U is not posing a *normatively* unjust threat relative to the moral framework accessible to the agents. Thus, U does not forfeit their right.

  ### 2. Blocking the Inference: Why Reasonable Belief Constitutes Justification

  McMahan's critical move is to assert that **Reasonable Belief $\rightarrow$ Excuse** rather than **Reasonable Belief $\rightarrow$ Justification**. He treats "justification" as tracking the truth of the matter (Fact-Relative) and "excuse" as tracking the quality of the agency (Evidence-Relative). I argue this bifurcation fails in cases of radical epistemic asymmetry for the following reason:

  **The "Ought Implies Can" Constraint on Forfeiture.**
  To be liable to defensive killing is to have lost the protection of the right to life. This is the severest moral status change possible. For such a forfeiture to occur, the agent must be responsible for a *wrong*. But can an agent be responsible for a wrong that is epistemically hidden from them?

  McMahan would say yes, citing cases of innocent threats (e.g., a person thrown off a cliff who will crush you unless you vaporize them). He argues that even innocent threats can be liable. However, there is a disanalogy. The person falling off the cliff is a *physical* threat. The unjust combatant is a *moral* threat. The "unjustness" of the combatant's threat is not a physical property like velocity or mass; it is a normative property derived from the political cause.

  If the normative property is inaccessible, it cannot ground liability. To claim otherwise is to argue that a soldier forfeits their right to life based on a moral fact they had no capacity to apprehend. This violates a robust interpretation of "ought implies can." If the soldier *cannot* know the war is unjust, they *ought not* be prohibited from fighting it in a way that makes them liable to death.

  Therefore, the inference from "Factually Unjust" to "Objectively Impermissible" is blocked by the epistemic condition of the agent. In domains where the moral facts are constituted by complex institutional realities (like the justice of a war), the "objective moral fact" for the individual agent *just is* the conclusion of a reasonable epistemic process. To define "objective permissibility" as something beyond the reach of the agent's best epistemic efforts is to define it out of relevance for action-guiding morality.

  If we accept that **Objective Permissibility = Acting in accordance with the best available moral evidence**, then the unjust combatant who fights reasonably is *objectively permitted*. They are not merely excused (which implies they did something wrong but aren't blamed); they are justified (they did the right thing given the reality they inhabit).

  ### 3. Recovering Symmetry via "Epistemic Reciprocity"

  If the argument above holds, we can reconstruct a version of MEC from within the liability framework.

  1.  **Premise 1:** Liability to lethal force requires responsibility for an *objectively impermissible* threat.
  2.  **Premise 2:** In the context of war, the objective permissibility of a threat is determined evidence-relatively, not fact-relatively, due to the structural epistemic asymmetry between soldiers and the *jus ad bellum*.
  3.  **Premise 3:** Both Just and Unjust combatants typically face symmetrical epistemic conditions regarding *jus ad bellum* (both rely on state intelligence, propaganda, and chain of command).
  4.  **Conclusion:** If both sets of combatants act on reasonable beliefs regarding the justice of their cause, both are objectively permitted to fight. Consequently, neither set of combatants poses an *objectively impermissible* threat in the sense required to generate liability.

  This blocks McMahan's asymmetry. McMahan wants to say the Just Combatant is non-liable because their cause is *actually* just. But if the Unjust Combatant is objectively permitted (due to reasonable belief), then the Just Combatant is killing someone who is objectively permitted to be there.

  Does this mean the Just Combatant is liable? Not necessarily. But it destroys the clean asymmetry McMahan needs. If the Unjust Combatant is not liable (because they are justified by their evidence), then the Just Combatant kills them without a liability justification. The Just Combatant must then rely on a different justification (e.g., lesser evil). But if the Just Combatant relies on lesser evil, they acknowledge they are infringing the Unjust Combatant's rights. If the Unjust Combatant's rights are intact, they are permitted to defend themselves against the Just Combatant.

  This restores the **functional equality of combatants**: Both sides are permitted to fight (based on their evidence), and both sides retain their right not to be killed (because neither is liable in the strong sense).

  ### 4. Addressing the "Truth-Tracking" Objection

  McMahan might object that this view severs morality from truth. It allows soldiers to be "justified" in fighting for a genocidal regime, provided the regime hides its intentions well enough.

  The reply is that this objection conflates *individual liability* with *collective responsibility*. The argument above does not claim the *war* is just, nor that the *leaders* are justified. It claims that the *individual soldier's participation* is objectively permissible relative to their epistemic position.

  Morality must distinguish between the **agent-relative permissions** of the soldier and the **agent-neutral facts** of the conflict. McMahan collapses these, demanding that the soldier's liability track the agent-neutral facts. I argue that liability is inherently agent-relative. It concerns what *this* agent may do to *that* agent given what *this* agent can know.

  If a soldier fights for an objectively unjust cause but has no way of knowing it, they are not morally responsible for the *unjustness* of the threat, only for the *threat* itself. But posing a threat is not sufficient for liability; posing an *unjust* threat is. If the "unjustness" is not part of the agent's moral horizon, it cannot be part of their liability profile.

  ### 5. Conclusion: The Collapse of the Distinction

  The excuse/justification distinction relies on the possibility of a gap between what an agent reasonably believes is right and what is actually right, such that the agent can be "in the clear" psychologically but "in the wrong" ontologically.

  In the specific case of *jus ad bellum* liability, this gap is morally inert. Because liability entails the forfeiture of the fundamental right to life, it demands a standard of responsibility that includes epistemic access. To hold a soldier liable for a fact they could not know is to treat them as a mere causal vector rather than a moral agent.

  Therefore, the inference from "Reasonably Believed Permissible" to "Merely Excused" is blocked. In contexts of radical epistemic opacity, **Reasonable Belief Constitutes Objective Justification.**

  If this is accepted, McMahan's revisionism loses its sharpest edge. If unjust combatants are objectively justified (due to epistemic constraints), they are not liable. If they are not liable, just combatants cannot kill them based on liability. If just combatants cannot kill based on liability, they must rely on other grounds that likely grant the unjust combatants the right to self-defense. Thus, from the perspective of the individual soldier in the fog of war, the Moral Equality of Combatants is not merely a useful legal fiction; it is a requirement of deep morality under conditions of uncertainty.
