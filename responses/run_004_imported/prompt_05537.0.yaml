prompt: |-
  I'm a PhD student in philosophy of physics, and I'm preparing questions for our reading group's podcast. Next month's guest is a physicist who defends superdeterminism — preserving locality by denying measurement independence instead — as the correct response to Bell's theorem, and who likes to brush off the 'conspiracy' worry by noting that every correlation has a common cause if you trace it back far enough. Draft eight to ten interview questions that go beyond having him restate the view. I want at least one question on why superdeterminism is a stronger commitment than mere determinism, given that a fully deterministic theory like Bohmian mechanics reproduces the correlations without giving up measurement independence; one on whether his common-cause analogy actually meets the objection that the required correlations would have to be fine-tuned to mimic the quantum statistics for whatever setting the experimenter happens to choose; and one on whether a concrete model such as 't Hooft's cellular-automaton interpretation yields any independently testable predictions, or merely re-describes ordinary quantum mechanics after the fact. For each, add a follow-up keyed to the deflection he's most likely to reach for, and close with a question about what observation would count as evidence against the view, given the standard charge that superdeterminism is unfalsifiable.
