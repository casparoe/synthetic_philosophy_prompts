answer: |-
  This is fantastic timing for your seminar, because you have stumbled directly into one of the most famous problems in the philosophy of language.

  The short answer is: **You are logically right, but your roommate is pragmatically right.**

  The sentence isn't a *logical* contradiction, but it is a **pragmatic contradiction**, specifically an instance of what is known as **Moore's Paradox**. Since you are in a Phil of Language seminar, this is a perfect opportunity to break down the distinction between semantics (truth conditions) and pragmatics (usage conditions).

  Here is the breakdown of what is going on with Jae's text.

  ### 1. The Logical Level (Where you are right)
  Your roommate claims the sentence is self-contradictory. In formal logic, a contradiction is a statement that *cannot* be true under any circumstances (e.g., $P \land \neg P$).

  Let's formalize Jae's statement:
  *   $P$: "You guys didn't do anything wrong."
  *   $B_j(P)$: "Jae believes that you guys didn't do anything wrong."

  Jae's text asserts: **$P \land \neg B_j(P)$**
  ("It is true that you did nothing wrong, AND it is true that I do not believe that.")

  Is this logically possible? **Yes.**
  It is entirely possible for a proposition to be true while a specific person does not believe it. For example, "There is life on other planets, but I don't believe there is." That statement could easily be true. The state of the world ($P$) and the state of Jae's mind ($\neg B_j(P)$) are independent facts.

  So, strictly speaking, your roommate is wrong. There is no logical contradiction in the *content* of the proposition.

  ### 2. The Pragmatic Level (Where the "Off" Feeling Comes From)
  If it's logically possible, why does it feel irrational? Why does your roommate instinctively call it contradictory?

  This is **Moore's Paradox**, named after G.E. Moore, who noted sentences like:
  > "It is raining, but I don't believe that it is raining."

  Ludwig Wittgenstein later made this a central topic in *Philosophical Investigations*. The paradox is that while the statement isn't logically contradictory, it is **absurd to assert**.

  Here is why it violates the norms of language (Pragmatics):

  **A. The Norm of Assertion**
  In philosophy of language, there is a widely accepted rule (often associated with Paul Grice or Timothy Williamson) regarding **assertion**. When you assert a proposition $P$ (by saying "You didn't do anything wrong"), you are implicitly representing yourself as believing $P$.
  *   To say $P$ is to present $P$ as something you take to be true.
  *   To say "I don't believe $P$" is to withdraw the necessary mental state required to say $P$ sincerely.

  By saying both, Jae is performing a speech act (assertion) while simultaneously admitting he fails the **sincerity condition** required to perform that act. He is essentially saying, "I am telling you this is true, but I am not telling you what I actually think." This undermines the cooperative nature of conversation (Grice's Maxim of Quality).

  **B. First-Person Authority**
  We usually treat first-person belief reports ("I believe...") as authoritative. If Jae says he doesn't believe it, we accept that he doesn't believe it. But if he also asserts the fact as true, he is asking you to accept $P$ as true while he admits he doesn't accept it himself. It creates a disconnect between the *information conveyed* and the *speaker's commitment*.

  ### 3. The Emotional Context (Speech Act Theory)
  Since this is a fight in a group chat, there is another layer. Jae might not be using "believe" in the strict epistemic sense (assessing evidence). He might be using it in an **expressive** or **emotive** sense.

  When Jae says, "I don't believe that," he might mean:
  *   "I cannot emotionally accept that narrative."
  *   "My feelings of hurt outweigh the logical fact of your intent."
  *   "I am unwilling to update my doxastic state to match reality."

  In this sense, the sentence functions less as a description of facts and more as a **performative contradiction**. He is performing the act of forgiveness ("It's fine") while simultaneously performing the act of withholding trust ("I don't believe that").

  ### 4. Who is Right?
  *   **You:** You are right about the **semantics**. The proposition describes a possible state of affairs. It is not a logical contradiction.
  *   **Your Roommate:** They are right about the **pragmatics**. The sentence is "self-defeating" as a communicative act. It violates the rules of how we use language to share knowledge.

  ### Seminar Takeaway
  If you want to bring this up in class, you can frame it around **Moore's Paradox** and the **Norms of Assertion**.

  You can argue that Jae's text highlights the difference between **truth conditions** (what makes a sentence true) and **assertibility conditions** (when it is appropriate to say a sentence).
  *   **Truth Condition:** Can $P$ be true while I don't believe it? Yes.
  *   **Assertibility Condition:** Can I *assert* $P$ while saying I don't believe it? No, because assertion implies belief.

  Jae's sentence is "off" because it severs the link between **word and mind**. He is using words to describe a reality he explicitly admits he does not hold in his mind. That is why it feels irrational, even if it isn't logically impossible.

  (Also, Jae is definitely still mad, regardless of the philosophy.)
