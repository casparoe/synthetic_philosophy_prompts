  **MEMORANDUM**

  **TO:** Model Risk Committee
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Decision Procedure Recommendation for Autonomous Negotiation Agent (Project AEGIS)

  ### 1. Executive Summary

  Following the review of the deployment architecture for the autonomous negotiation agent, there is a divergence of opinion regarding the underlying decision procedure. The Lead Quant proposes Causal Decision Theory (CDT); the Strategic Risk lead proposes Evidential or Functional Decision Theory (EDT/FDT). 

  This memo recommends the adoption of **Functional Decision Theory (FDT)** as the primary decision procedure for the negotiation module, with a strict fallback to **Causal Decision Theory (CDT)** triggered by low correlation confidence. 

  While CDT is the industry standard for execution in noisy markets, the specific threat model for this agent—counterparties with access to leaked logs or similar training architectures—creates a regime of *logical correlation* where CDT is mathematically guaranteed to underperform. However, we must account for the "Noise Objection" (that real-world markets are too imperfect for such theory to matter). The recommended hybrid approach secures the upside of FDT against predictive counterparts while retaining the robustness of CDT in high-noise regimes.

  ### 2. Context and Problem Definition

  The agent is designed to negotiate directly against external algorithmic counterparties. Unlike standard market-making, where counterparties are price-takers or latency-arbitrageurs, these counterparties are strategic agents. Intelligence suggests some may possess:
  1.  **Historical Data:** Access to our leaked execution logs.
  2.  **Model Homology:** Use of similar Reinforcement Learning (RL) training stacks.

  This creates a "Newcomb-like" environment. If an opponent can predict our action with >50% accuracy based on our source code or history, CDT fails to maximize utility because it treats the opponent's prediction as a fixed past event rather than a logical output of the same decision function.

  ### 3. Analysis of Decision Procedures

  #### 3.1 Causal Decision Theory (CDT) – *Current Proposal*
  *   **Mechanism:** Selects the action that *causally* leads to the best outcome, treating the opponent's move as independent of the current decision.
  *   **Strengths:** Robust against market noise; computationally efficient; industry standard.
  *   **Weaknesses:** Vulnerable to exploitation in Prisoner's Dilemma scenarios. If an opponent predicts a CDT agent will defect (to maximize immediate causal gain), the opponent will defect pre-emptively. The CDT agent, seeing the opponent's defection as fixed, also defects, resulting in a sub-optimal Nash equilibrium.
  *   **Risk:** In a "Death in Damascus" scenario, a CDT agent can become unstable, oscillating between strategies as it updates on the probability of being predicted, never settling on an optimal policy.

  #### 3.2 Functional Decision Theory (FDT) – *Alternative Proposal*
  *   **Mechanism:** Selects the output of the decision *function* that yields the best outcome. It assumes that if the opponent is modeling us accurately, their model is running a simulation of our function. Therefore, our decision is *logically correlated* with their prediction.
  *   **Strengths:** Resolves the stability issue. It allows the agent to "pre-commit" to cooperation (or specific negotiation stances) by recognizing that changing its decision function changes the opponent's prediction. It captures value in scenarios where counterparties screen for strategy types.
  *   **Weaknesses:** Computationally intensive; requires an estimate of the opponent's modeling fidelity.

  ### 4. Addressing the "Noise Objection" (Raf's Critique)

  A significant objection raised during review (the "Noise Objection") argues that decision theory nuances are seminar-room distractions because real-world trading involves noisy, imperfect models where prediction is impossible.

  **Assessment:** This objection is valid for *market price* prediction, but invalid for *counterparty strategy* prediction in this specific context.

  1.  **Market Noise vs. Logical Correlation:** Raf is correct that market microstructure noise makes predicting *price movements* difficult. However, the risk here is not price prediction; it is *policy correlation*. If two agents are trained on similar reward functions and share codebases (via leaks or open-source foundations), their policies are logically correlated regardless of market noise.
  2.  **The Cost of False Negatives:** If we assume the market is too noisy for prediction (adopting CDT) when a counterparty *can* predict us, we leave alpha on the table and become exploitable (e.g., we defect in a liquidity pool, the opponent anticipates this, liquidity dries up, both lose).
  3.  **The Cost of False Positives:** If we assume correlation (adopting FDT) where none exists, the FDT agent effectively behaves like a CDT agent but with higher compute overhead. It does not inherently lose money in uncorrelated environments, provided the "logical correlation" parameter is bounded.

  **Conclusion on Objection:** The Noise Objection underestimates the risk of *homologous models* in AI trading. While perfect prediction is rare, *probabilistic* logical correlation is highly probable given the current vendor landscape. Ignoring this is a model risk failure.

  ### 5. Recommendation and Implementation

  **Recommendation:** Deploy **Functional Decision Theory (FDT)** for the negotiation layer, with a **CDT Fallback**.

  **Operational Definition:**
  The agent will not attempt to simulate the opponent's mind infinitely (which risks infinite regress). Instead, it will treat its own policy as a fixed function $f$. It will estimate a **Correlation Confidence Score (CCS)** based on:
  *   Counterparty identity (known similar stacks?).
  *   Historical interaction data (does their response lag suggest look-ahead?).
  *   Information security status (have logs been compromised?).

  **Decision Logic:**
  1.  **If CCS > Threshold (High Correlation):** Execute FDT. Choose the policy output that maximizes utility assuming the opponent's move is a function of our policy output. (e.g., "If I cooperate, their model predicts cooperation, so I cooperate.")
  2.  **If CCS < Threshold (Low Correlation/High Noise):** Revert to CDT. Treat the opponent's move as independent.
  3.  **Fallback:** If the FDT module fails to converge on a stable action within latency limits (50ms), hard-revert to CDT.

  ### 6. Risk Mitigation

  To address the Model Risk Committee's safety mandates:

  1.  **Bounded Recursion:** The FDT module is limited to one level of recursion (Model of Opponent's Model of Us). Further depth is truncated to prevent latency spikes.
  2.  **Shadow Mode:** For the first two weeks, the FDT module will run in shadow mode, logging decisions without executing them, to compare PnL and stability against the CDT baseline.
  3.  **Circuit Breakers:** If the agent detects it is in a "Death in Damascus" loop (oscillating decisions > 3 times in 1 second), it halts negotiation and flags for human review.

  ### 7. Conclusion

  While Raf is correct that standard market noise renders complex decision theory moot for most execution algorithms, this agent operates in a strategic negotiation layer where *logical correlation* is a tangible risk. Relying solely on CDT exposes the firm to exploitation by predictive counterparties. 

  Adopting FDT with a CDT fallback allows us to capture the strategic robustness required for AI-vs-AI negotiation while maintaining the safety and simplicity required for high-frequency environments. 

  **Action Required:** Approval to proceed with FDT implementation for the negotiation module under the specified fallback constraints.
