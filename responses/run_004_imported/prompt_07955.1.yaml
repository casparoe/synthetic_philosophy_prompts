answer: |-
  **SCENE:** *A university office, 2:00 AM. The air smells of stale coffee and dry-erase markers. A whiteboard is covered in a convex curve, labeled $S$, and a disagreement point $d$. ARTHUR (Nash) holds a marker cap in his teeth. LENA (Kalai-Smorodinsky) leans against the desk, arms crossed.*

  **ARTHUR**
  *(Tapping the board)*
  It's the tangent point, Lena. It has to be. The product of the gains is maximized here. It's the only point that satisfies symmetry, Pareto efficiency, and invariance to affine transformations. It's clean.

  **LENA**
  It's clean, but it's blind. Look at the ideal point.
  *(She draws a dot in the upper right, outside the feasible set)*
  That's the utopia. The maximum I can get if you get your minimum, and vice versa. Your solution ignores where that dot is. Mine connects $d$ to utopia and sees where it hits the frontier.

  **ARTHUR**
  Because utopia is irrelevant. It's not feasible. Why should the shadow of a deal we can't make dictate the deal we do make?

  **LENA**
  Because the shadow tells me how much leverage I have! Look, imagine we expand the set. Just for me. My ceiling goes up. My best possible outcome improves. Your bargaining position hasn't changed, but my potential has.
  *(She traces a new, higher curve)*
  Under Kalai-Smorodinsky, my share of the actual deal *must* go up. Individual monotonicity. If my pie gets bigger, I don't get less cake. But your Nash solution? You can tweak the curvature here, expand my maximum there, and your tangent point barely moves. I could be walking into a room with a gold mine, and you'd negotiate me down to the same split as if it were a gravel pit.

  **ARTHUR**
  That's not a bug, that's a feature. You're focusing on the ceiling. I'm focusing on the trade-off at the margin. Just because you *could* get more in a fantasy scenario doesn't mean you *should* get more in the real one. The local rate of substitution determines the price. Not your dreams.

  **LENA**
  It's not dreams, Arthur, it's bargaining power. If I can threaten to walk away to a better potential, that changes the dynamic. If your solution says my improved position doesn't warrant a better outcome, then your solution is telling me that improving my BATNA is worthless. That violates the basic intuition of negotiation.

  **ARTHUR**
  *(Turns to the board, erases a sliver of the feasible set)*
  Okay. Let's test your intuition. Watch this.
  *(He shades out a corner of the feasible set $S$. It is a region far away from where their two solution points sit.)*
  I just removed a chunk of options. Options that are worse for both of us than the agreement we're staring at. Neither of us would ever have chosen them. They are irrelevant alternatives.

  **LENA**
  *(Squints)*
  You cut off the top left corner.

  **ARTHUR**
  Exactly. Nobody wanted those deals. Now, recalculate your Kalai-Smorodinsky line.

  **LENA**
  *(Pauses. She looks at the ideal point.)*
  The ideal point moved. Because the maximum possible payoff for you just dropped when you erased that corner.

  **ARTHUR**
  Right. So the line from $d$ to the ideal point pivots. And where it hits the frontier... shifts.

  **LENA**
  *(Quietly)*
  It shifts.

  **ARTHUR**
  It shifts, Lena. We just threw away garbage. Deals nobody would sign. And because you deleted the garbage, the deal we *do* sign changes. That's Independence of Irrelevant Alternatives. If you remove options that weren't going to be picked, the solution should stay put. Your solution is being haunted by ghosts. It's letting options we rejected dictate the terms of the option we accepted.

  **LENA**
  Those options weren't irrelevant! They defined the scale of the game.

  **ARTHUR**
  They defined nothing but noise. If I offer you a choice between an apple, an orange, and a rotten banana, and you pick the apple... if I take the rotten banana off the table, do you suddenly want the orange?

  **LENA**
  If the banana told me how much you valued fruit, yes! Look, Arthur, I'll concede the point. If you prune the feasible set carefully, my solution jumps. It's unstable in that specific way. But look at what I buy with that instability. I buy the guarantee that if you gain more leverage, I don't get punished.
  *(She steps closer to the board)*
  Your solution... it's too rigid. It locks onto a point based on the geometry of the curve right there. If I expand my options over here, far away from the agreement, your math says "doesn't matter." But in a real negotiation, if I show you I have more room to maneuver, you concede more. You have to. If your axiom says I don't, then your axiom is divorced from power.

  **ARTHUR**
  And if your axiom says the deal changes because I removed a option we both hated, then your axiom is divorced from rationality. Consistency matters. If we agree on a outcome, and then we realize, "Oh, wait, that one option was actually illegal," we shouldn't have to renegotiate the whole thing. Nash is stable. KS is... sensitive.

  **LENA**
  KS is responsive.

  **ARTHUR**
  It's twitchy.

  **LENA**
  *(Softens, picks up a rag)*
  So here we are. You have a solution that is consistent, stable, and ignores changes in my potential leverage if they don't change the local curvature.

  **ARTHUR**
  And you have a solution that respects leverage and proportional gain, but changes its mind if I throw a useless option in the trash.

  **LENA**
  *(Wipes the board, but leaves the two solution points distinct)*
  We're arguing about what "fair" means. Is fair "consistent regardless of the menu"? Or is fair "proportional to the best possible meal"?

  **ARTHUR**
  *(Puts the cap back on the marker)*
  I think fair is what you can't argue your way out of. Nash is the only point where neither of us can propose a different spot that increases the product of our gains. It's a stalemate by multiplication.

  **LENA**
  And KS is a stalemate by proportion. We split the *gains* relative to the *possible*.
  *(She looks at him)*
  You know they're different points, right? On this curve.

  **ARTHUR**
  I know.

  **LENA**
  So which one do we tell the negotiators to use?

  **ARTHUR**
  *(Looks at the graph, then at the cold coffee)*
  Depends on whether they're more afraid of being exploited... or of being inconsistent.

  **LENA**
  *(Turns off the desk lamp)*
  Then I guess we're both unemployed.

  **ARTHUR**
  Until the next graph.

  *[BLACKOUT]*
