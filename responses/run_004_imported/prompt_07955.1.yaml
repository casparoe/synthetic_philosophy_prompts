  *Characters:* Arthur (Nash) and Lena (KS).
  *Prop:* A whiteboard with a convex set.

  *Key line for Lena:* "If my best-case scenario improves, I cannot accept a solution that leaves me with the same slice."
  *Key line for Arthur:* "If we throw away options neither of us would have chosen, the deal shouldn't change."

