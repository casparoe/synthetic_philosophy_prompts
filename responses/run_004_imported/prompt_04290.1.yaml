answer: |-
  Your friend is **right**, but they are likely gesturing at a specific refinement of Interventionism (specifically the **Halpern-Pearl Structural Equation** framework) rather than just basic Woodwardian manipulationism.

  On a bare Lewis-style counterfactual account, your friend is correct that you hit a wall: "If the roommate had watered, the plant lives" and "If the mailman had watered, the plant lives" are logically identical conditionals. Lewis tries to solve this with "similarity of possible worlds," but that gets mushy fast (is a world where the mailman waters more "distant" than one where the roommate waters? Maybe, but why?).

  Interventionism solves this by shifting the question from "What if?" to **"What is the structure of the system?"**

  Here is the clean case, the specific machinery, and the terminology you need to win the tie-breaker.

  ### The Case: The Redundant Server Reset
  Imagine a critical server that overheats and shuts down ($S=0$) unless it is reset.
  1.  **Primary Mechanism:** An auto-reset script ($A$). It fails ($A=0$).
  2.  **Secondary Mechanism:** A SysAdmin ($R$ for Responsible). Their job is to monitor the alarm and manually reset ($R=1$). They get distracted and don't ($R=0$).
  3.  **Tertiary Mechanism:** A Janitor ($J$). They walk past the server room. They *could* press the reset button ($J=1$), but they have no job duty to do so. They don't ($J=0$).

  **Outcome:** Server shuts down ($S=0$).

  **The Lewis Counterfactual Verdict:**
  *   If $R$ had reset ($R=1$), $S$ would be 1. (True)
  *   If $J$ had reset ($J=1$), $S$ would be 1. (True)
  *   **Verdict:** Both are causes. Lewis struggles to distinguish the SysAdmin from the Janitor without appealing to vague "expectations."

  **The Interventionist Verdict:**
  The SysAdmin is a cause; the Janitor is not.

  ### The Extra Machinery: Structural Equations + Default Values
  Basic Interventionism (Woodward 2003) defines causation as invariance under intervention. But to handle omissions specifically, we need the **Halpern-Pearl (2005)** extension, which adds two pieces of machinery that Lewis lacks:

  1.  **Structural Equation Models (SEMs):** Causation isn't just about variables changing; it's about *equations* linking them. We must specify which variables are **endogenous** (inside the system mechanism) and which are **exogenous** (background).
  2.  **Normality/Default Ordering:** Every variable has a "default" value (what happens normally/without interference) and a "deviant" value (an intervention or change).

  **How it applies to the Server:**
  We construct a causal model with structural equations.
  *   $S = A \lor R \lor J$ (Server runs if Auto OR Admin OR Janitor resets).
  *   **Crucial Step:** We assign **Default Values**.
      *   For the SysAdmin ($R$), the expected/normal value in this context is $1$ (Reset). Because they have a *duty*, $R=0$ is a **deviant** value.
      *   For the Janitor ($J$), the expected/normal value is $0$ (Do Nothing). Because they have *no duty*, $J=0$ is the **default** value.

  **The Interventionist Rule for Omissions:**
  An omission counts as an *Actual Cause* only if changing the variable from its **actual value** to its **counterfactual value** moves the world from a *less normal* state to a *more normal* state.

  *   **SysAdmin:** Actual world is ($R=0$, Deviant). Counterfactual world is ($R=1$, Default). This is an improvement in normality. **$R$ is a cause.**
  *   **Janitor:** Actual world is ($J=0$, Default). Counterfactual world is ($J=1$, Deviant). This is a *decrease* in normality (the janitor would be interfering). **$J$ is not a cause.**

  ### Why This Is Principled, Not Pragmatic
  Your friend's point is that this isn't just us "deciding" the mailman doesn't count. In the Interventionist picture, causation is **model-relative**.

  *   **Lewis** asks: "How similar is the world where the mailman waters?" (Metaphysical vagueness).
  *   **Interventionism** asks: "Is the mailman's variable part of the structural equations governing this system, and is their inaction a deviation from the system's default parameters?" (Structural precision).

  If you include the Mailman in the model as a variable with a *duty*, they become a cause. If you model them as background noise (default value = 0), they are structurally invisible to the causal calculation. The "principled" distinction is that the Roommate is an **endogenous variable with a deviant value**, while the Mailman is either **exogenous** or an endogenous variable at its **default value**.

  ### The Tie-Breaker Script
  Here is exactly what you say to your friend:

  > "You're right, but you need to cite the **Halpern-Pearl Actual Causality** framework, not just basic Woodward. Lewis fails because he treats omissions as symmetric counterfactual dependencies. Interventionism wins because it models causation via **Structural Equations** with **Default/Deviant values**.
  >
  > In our basil case, the Roommate is an **endogenous variable** where 'not watering' is a **deviant value** (violation of duty). The Mailman is either **exogenous** or their 'not watering' is the **default value**. Interventionism mathematically excludes default-value omissions from being Actual Causes, whereas Lewis has no machinery to distinguish them. It's not pragmatic; it's structural."

  **Verdict:** Friend wins the point, but you win the nuance. The distinction relies on defining the "system" (the household agreement), but once defined, the causal verdict is objective within that model.
