answer: |-
  This is an exceptionally sharp critique of the propensity interpretation, and your intuition that it often functions as "hypothetical frequentism with causal vocabulary" is shared by many philosophers of probability (including some who defend it). However, to answer your specific questions: there *is* a principled ontological distinction between the two, and Humphreys' Paradox does *not* generalize to frequentism in the way you suspect.

  Here is the breakdown of where the distinction lies, why Humphreys' Paradox is specific to propensity, and where your deflationary view might be underestimating the metaphysical cost propensity theorists are willing to pay.

  ### 1. The Principled Distinction: Extensional vs. Intensional

  Your skepticism rests on an epistemic point: "Whenever anyone actually wants a numerical value... the only way to get one seems to be by appeal to frequencies."

  This is the **Epistemic Access** problem. You are correct that we *measure* propensities via frequencies. But the propensity theorist argues that what we are *measuring* is distinct from the measurement itself.

  *   **Frequentism (Venn, von Mises, Reichenbach):** Probability is **extensional**. It is a property of a *sequence* of events. $P(A)$ literally *is* the limit of the relative frequency. If the universe ended before the infinite sequence completed, the probability (strictly speaking) would not exist. It struggles immensely with single-case probabilities (e.g., "the probability *this* specific atom decays") unless it invokes a "hypothetical infinite sequence," which many critics argue is metaphysically obscure.
  *   **Propensity (Popper, Giere, Single-Case theorists):** Probability is **intensional/causal**. It is a property of the *physical setup* (the generator), not the output. The atom has a disposition to decay *now*, regardless of whether it is part of a sequence or if the universe ends tomorrow. The frequency is merely the *manifestation* of the propensity.

  **The Analogy:** Consider mass vs. weight. We measure mass by observing weight (force) in a gravitational field. If you said, "Mass is just weight restated in gravitational vocabulary," a physicist would correct you. Mass is a disposition to resist acceleration; weight is the manifestation of that mass in a specific context. Similarly, the propensity theorist argues: Propensity is the physical disposition; Frequency is the manifestation in a long run.

  So, the principled difference is: **Frequentism identifies probability with the pattern of outcomes; Propensity identifies probability with the causal power of the setup.**

  ### 2. Humphreys' Paradox: Why it Targets Propensity Specifically

  Your friend is correct that Humphreys' Paradox (1985) is a standard objection, but your intuition that it should apply to frequentism is where the distinction becomes crucial.

  **The Paradox in Brief:**
  1.  If Propensity Theory is true, physical propensities obey the axioms of probability (Kolmogorov).
  2.  One of those axioms (via Bayes' Theorem) is **invertibility**: $P(A|B) = P(B|A) \cdot P(A) / P(B)$.
  3.  Propensities are inherently **causal/dispositional**. They describe the tendency of a cause to produce an effect. Causation is time-asymmetric (causes produce effects, effects do not produce causes).
  4.  Therefore, while $P(\text{Effect}|\text{Cause})$ represents a real physical propensity, $P(\text{Cause}|\text{Effect})$ often represents a nonsense physical claim (the tendency of an effect to produce its cause).
  5.  **Contradiction:** If propensities are probabilities, they must be invertible. If propensities are causal dispositions, they are not invertible. Therefore, propensities cannot be probabilities.

  **Example:**
  Consider a photon hitting a half-silvered mirror.
  *   $P(\text{Transmission} | \text{Incident})$ is a clear physical propensity (say, 0.5).
  *   By Bayes, $P(\text{Incident} | \text{Transmission})$ must also be a valid probability.
  *   But what is the *physical propensity* of a transmitted photon to have been incident? That's not a physical disposition of the photon/mirror system; it's an epistemic inference or a trivial truth (if it transmitted, it must have been incident). It makes no sense to say the transmission *caused* the incidence.

  **Why this does not devastate Frequentism:**
  Frequentists do not claim probabilities are causal powers. They claim probabilities are **ratios of counts**.
  *   For a frequentist, $P(A|B)$ is simply the ratio of trials where $A$ and $B$ occurred to trials where $B$ occurred.
  *   Does it make causal sense to invert the ratio? No. But does it make *mathematical* sense? Yes.
  *   Since Frequentism is extensional (about the data structure), it has no problem with $P(\text{Cause}|\text{Effect})$. It just treats it as a subset selection within the data. "Of all the times the mirror transmitted, how many times was there an incident photon?" The answer is 100%. That is a valid frequency ratio, even if it implies no "backward causation."

  **Why this does not devastate Bayesianism:**
  Bayesians (especially Subjective/Jaynesian) treat probability as a state of knowledge or logical relation.
  *   $P(\text{Cause}|\text{Effect})$ is simply how much I should believe in the Cause given I observed the Effect.
  *   This is obviously invertible and makes perfect sense epistemically, even if causation runs only one way.

  **Conclusion on Humphreys:** The paradox specifically targets interpretations that try to **identify probability with physical causation**. It spares Frequentism (which identifies probability with statistics) and Bayesianism (which identifies probability with inference).

  ### 3. Where Your Deflationary View Might Be "Wrong"

  You concluded that propensity theory is "little more than hypothetical frequentism restated in causal vocabulary."

  If your criterion is **empirical output**, you are right. Both theories will tell you to bet 50/50 on the photon.
  If your criterion is **metaphysical commitment**, you are wrong.

  The propensity theorist accepts a heavier metaphysical burden to solve problems the frequentist cannot easily solve:
  1.  **Single-Case Probabilities:** Frequentism requires a reference class. Is *this* atom part of the class "uranium atoms," "atoms in this lab," or "atoms created on a Tuesday"? Propensity says the atom *itself* has the property.
  2.  **The "Hypothetical" Infinite:** Frequentists often have to appeal to "hypothetical infinite sequences" to ground probabilities in cases where infinite repetition is physically impossible (e.g., the probability of a specific cosmological event). Propensity theorists argue this is just disguised metaphysics; they prefer to posit a real, existing dispositional property.

  Your friend's point about Humphreys' Paradox highlights the cost of that metaphysical commitment. By tying probability to *physical disposition*, Propensity Theory breaks the mathematical symmetry of the probability calculus. Frequentism avoids this by treating probability as a static feature of a dataset (real or hypothetical), which remains mathematically symmetric even if the physical generation of that data was not.

  ### Summary

  1.  **Distinction:** There is a principled difference. Frequentism = Property of Sequences (Extensional). Propensity = Property of Setups/Causes (Intensional).
  2.  **Humphreys' Paradox:** It relies on the conflict between **Causal Directionality** (Propensity) and **Probistic Invertibility** (Bayes).
  3.  **Generalization:** It does **not** generalize to Frequentism. Frequentists accept invertible conditional probabilities as ratios of subsets, not as backward-causal dispositions.
  4.  **Your Position:** You are correct that Propensity is empirically indistinguishable from Hypothetical Frequentism in practice. However, it is not *philosophically* identical. It is a distinct ontological wager: it trades the "Reference Class Problem" of frequentism for the "Invertibility Problem" of Humphreys.

  If you are a Bayesian (as many in the LW sphere are), Humphreys' Paradox is further evidence that probability should be decoupled from physical ontology entirely and treated as an extension of logic. But for the specific debate between Objectivist interpretations, Propensity and Frequentism remain distinct, and Humphreys' Paradox is a bullet that only the Propensity theorist has to bite (or dodge).
