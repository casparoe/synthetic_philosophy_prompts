      *   *What is it?* Paul Humphreys (1985). It concerns the relationship between propensities and conditional probabilities, specifically Bayes' Theorem.
      *   *The Setup:* Consider a propensity $P(B|A)$ (the tendency of setup A to produce B).
      *   *The Issue:* Bayes' Theorem allows inversion: $P(A|B) = P(B|A)P(A) / P(B)$.
      *   *The Paradox:* Propensities are supposed to be causal/dispositional. Causation runs forward in time (A causes B). But $P(A|B)$ looks like "the propensity of B to produce A." If propensities are physical tendencies, $P(A|B)$ often makes no physical sense (effects don't have tendencies to produce causes). Yet, the math requires them to exist and obey the axiom of probability.
      *   *Example:* A photon hits a mirror. Propensity to be transmitted vs. reflected. If we detect transmission, what is the "propensity" that the photon *was* incident given it was transmitted? That's just 1 (or epistemic), not a physical propensity of the detector to emit photons backwards.
      *   *Implication:* If Probability = Propensity, then Probability must obey Kolmogorov axioms (including Bayes' Theorem). But Propensities (as causal tendencies) do *not* obey Bayes' Theorem (inversion fails for causation). Therefore, Probability $\neq$ Propensity.

