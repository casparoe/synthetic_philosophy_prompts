  8.  (Final check of Humphreys' Paradox details): Humphreys argues that if propensities are probabilities, they must obey Bayes theorem. But propensities are causal. Causal relations aren't invertible. Thus propensities aren't probabilities. Frequentists say "Probabilities are frequencies," frequencies *do* obey Bayes theorem (as ratios), so no contradiction for them. Correct.

