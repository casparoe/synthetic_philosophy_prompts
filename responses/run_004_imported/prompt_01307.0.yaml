answer: |-
  This is a classic philosophical and economic standoff. You have stumbled upon one of the deepest fault lines in the social sciences: the debate between **Revealed Preference Theory** (your friend's view) and **Mentalist/Structuralist accounts of agency** (your view).

  Your friend is arguing from a standard neoclassical economic framework. You are arguing from a framework that incorporates psychology, philosophy of action, and behavioral economics.

  Here is the breakdown of why your friend's argument feels so airtight, why your intuition that it is "absurd" is correct, and the specific concepts you can use to defend your position.

  ### 1. The Friend's Position: Revealed Preference
  Your friend is espousing **Revealed Preference Theory**, largely associated with economist Paul Samuelson. The logic is behaviorist: since we cannot observe utility (satisfaction) directly, we must infer it from choices.
  *   **The Axiom:** If you choose A over B when both are available, you have revealed that you prefer A to B.
  *   **The Implication:** To say "I prefer B but I chose A" is a contradiction in terms. It renders the word "prefer" meaningless because it refers to nothing observable.
  *   **The Blocker Rebuttal:** As your friend noted, in this framework, installing the blocker is just another choice. At $T_1$ (afternoon), you preferred "Future Writing" over "Future Scrolling." At $T_2$ (9 PM), you preferred "Scrolling" over "Writing." There is no "You" that exists across time to adjudicate which preference is the "real" one.

  **Where this view is useful:** It is excellent for predicting market behavior. If I want to know how many apples you will buy, I don't care about your internal feelings; I care about what you actually do when prices change.

  **Where this view fails:** It fails as a description of human psychology and agency. It makes phenomena like **regret, addiction, self-deception, and commitment** impossible to model coherently. If choice *is* preference, you can never make a mistake about what is good for you.

  ### 2. Your Defense: Why Choice $\neq$ Preference
  You are right to feel that there is a "further fact" about your priorities. Here are four arguments that dismantle the idea that choice is the final word on preference.

  #### A. Second-Order Desires (The "Real Self" Argument)
  The philosopher Harry Frankfurt distinguished between **first-order desires** (I want to scroll on my phone) and **second-order volitions** (I want to *want* to write).
  *   When you are scrolling at 9 PM, you are acting on a first-order desire.
  *   When you install the blocker, or when you tell your friend writing is your priority, you are expressing a second-order volition.
  *   **The Point:** We typically identify our "true" self with our reflective, second-order desires, not our impulsive, first-order urges. An addict *chooses* to take the drug, but we (and often the addict) do not say the drug is what they "truly prefer" in the deep sense. They are acting against their own evaluative judgment.

  #### B. The Planner and the Doer (Time Inconsistency)
  Behavioral economists (like Thaler and Shefrin) actually agree with you, not your grad-school friend. They model the self as having multiple agents inside it:
  *   **The Planner:** Cares about long-term welfare (finishing the book).
  *   **The Doer:** Cares about immediate gratification (scrolling).
  *   **The Conflict:** At 9 PM, the Doer hijacks the controls. But the Planner is the one who sets the goals and installs the blockers.
  *   **The Point:** Your friend says each moment has its own preference. But human welfare is usually assessed over a *lifetime*, not a moment. If you satisfy the 9 PM self every night, the "Life Self" ends up with no book and regret. Therefore, the 9 PM choice reveals a *local* preference, but it violates the *global* preference.

  #### C. Decision Utility vs. Experienced Utility
  Daniel Kahneman distinguishes between:
  *   **Decision Utility:** What you choose (scrolling).
  *   **Experienced Utility:** What actually gives you satisfaction or meaning (writing).
  *   Often, we choose things that we *think* will make us happy (prediction error) or things that give a dopamine hit but leave us empty (scrolling). If you choose scrolling but feel anxious and unfulfilled afterward, your choice did not maximize your well-being. Revealed preference theory assumes choices maximize welfare; if they don't, the theory is descriptively false regarding human happiness.

  #### D. The Existence of Commitment Devices
  The very fact that people pay money to restrict their own future choices (gym contracts, website blockers, locking away credit cards) proves that revealed preference is incomplete.
  *   If choice always equaled true preference, restricting your future choices would always make you worse off (by definition, you are removing options you might choose).
  *   Yet, we know that restricting options often makes people *better off*. This implies that the "choosing self" at $T_2$ is not a reliable agent for the "valuing self."

  ### 3. Resolving the Argument
  Your friend is technically correct within the narrow axioms of neoclassical economics, but those axioms are known to be simplifications that strip away the complexity of human psychology.

  You can tell her this:
  > "You're defining 'preference' as 'revealed choice.' That's a useful definition for modeling demand curves. But it's a useless definition for living a life. If preference is just whatever I do, then 'regret' is impossible, 'self-improvement' is a myth, and 'addiction' is just a series of rational choices.
  >
  > I'm using 'preference' to mean 'reflective valuation.' When I install the blocker, I am voting for my reflective valuation over my impulsive choice. The fact that I have to engineer my environment to overcome my own impulses proves that my choices do not perfectly track my values. If they did, I wouldn't need the blocker."

  ### The Verdict
  **She was not basically right.** She was right about a specific, limited technical definition used in economics, but wrong about the nature of human agency.

  There is a defensible, robust sense in which what you choose can come apart from what you value.
  1.  **Values are stable; choices are contextual.** You value the book (stable). Your choice to scroll is context-dependent (tired, phone nearby).
  2.  **Agency involves negotiation.** Being an adult isn't about doing whatever you feel like in the moment; it's about aligning your momentary choices with your long-term values.
  3.  **Mistakes are real.** You can be mistaken about what is good for you. Choosing junk food doesn't mean you "prefer" it in the sense of it being good for your health goals; it means your impulse control failed.

  You are not lying to yourself when you say writing is your priority. You are reporting on your **reflective endorsement**, which is the only part of your psyche capable of setting priorities in the first place. The scrolling is not a counter-preference; it is a failure of execution.
