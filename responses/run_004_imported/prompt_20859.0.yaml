      *   *Skeptic-AT:* Let's call him **Marcus**. He leans towards a sophisticated EDT or a cautious TDT. He worries about "reference class tennis" and magical thinking.
      *   *Tone:* Intellectual, respectful, rigorous, but tense. They know the jargon but want to avoid jargon-shielding.

  3.  **Key Arguments to Explore:**
      *   *The Newcomb Analogy:* Is the multiverse partner like Omega?
          *   Elena: Yes, same logical structure.
          *   Marcus: No, Omega simulates *you*. The multiverse agent just *exists*. Where is the logical dependency?
      *   *The Evidence Problem:* How do you know they exist? How do you know they reason like you?
      *   *Threats vs. Offers:* This is the crux.
          *   If AT works for offers (giving resources), does it work for threats (blackmail)?
