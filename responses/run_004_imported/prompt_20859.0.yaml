  *(Self-Correction Note during drafting the threat section)*: I need to be careful. If they agree on One-Boxing, they likely agree on precommitment. The difference must be about whether the *link* exists. Marcus should argue that without a causal/logical hook, precommitment doesn't travel. Elena argues precommitment *is* the hook.

