      *   **The Core Disagreement:** Elena pushes the "logical correlation" argument. Marcus pushes back on the "causal anchor" of that correlation.
      *   **The Pivot to Threats:** Introduce the concept of "Acausal Blackmail" (e.g., a simulator threatening to torture simulations unless you pay up).
      *   **Deep Dive on Threats:**
          *   Elena's stance: You must precommit to not paying, even if it hurts now, to maintain the algorithm's integrity across the multiverse.
          *   Marcus's stance: If the correlation isn't grounded, you're just hurting yourself for a ghost. But wait, if the threat is *real* (in some sense), ignoring it is dangerous.
          *   *Crucial nuance:* Marcus needs to argue that without a causal/logical link, the threat is empty. Elena needs to argue that the *possibility* of the link dictates the policy.
      *   **The Weak Points:**
          *   Marcus attacks Elena's "reference class" selection (cherry-picking who counts as "like me").
          *   Elena attacks Marcus's "evidence" requirement (how much evidence did you need for Omega?).
      *   **Resolution/Conclusion:** They shouldn't fully agree, but they should clarify the stakes. The difference lies in *policy selection* vs. *situational assessment*.

  5.  **Refining the Dialogue (Self-Correction during drafting):**
      *   *Check:* Did I make them sound like CDT agents? *Correction:* Ensure they both agree One-Boxing is obvious. The fight is about *how far* the logic stretches.
