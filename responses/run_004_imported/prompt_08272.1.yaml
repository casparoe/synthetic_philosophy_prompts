  *(Self-Correction Note)*: I need to make sure I don't sound like I'm scolding the board. I am a board member writing to the board. The tone should be "Here is the path forward that protects us *and* does the right thing."

  *(Pascal Nuance)*: Pascal's point is descriptive (this is how the world works), not necessarily prescriptive (this is what you *should* do). The memo should highlight that while Pascal describes *monarchies*, co-ops are *democracies*. In a democracy, authority *should* be traceable.

