answer: |-
  **Setting:** *The Oakhaven Town Hall, 8:45 PM. The fluorescent lights hum overhead. Most of the folding chairs are empty now, stacked against the walls. The motion to fluoridate the municipal water supply has just been tabled for a direct referendum next month. Two people remain near the back, gathering their coats. ARTHUR VANCE (60s, a retired policy analyst, crisp suit, tired eyes) and ELENA ROSALES (50s, a high school principal, cardigan, holding a stack of pamphlets).*

  **Vance:** You know, Elena, I admire the energy. Truly. But looking at the questions from the floor tonight... "Does fluoride cause communism?" "Is it a form of mind control?" We aren't deciding on a zoning variance. We're deciding on molecular stability and public health epidemiology.

  **Rosales:** And who drinks the water, Arthur? The epidemiologists?

  **Vance:** No, but they understand the *consequences* of the chemistry. That's the point Lippmann made a hundred years ago, and we still haven't learned it. The world outside is complicated—ions, concentrations, renal thresholds. The picture inside the voter's head is a stereotype. "Chemical" equals "poison." "Government" equals "intrusion." When you ask them to vote yes or no on this, you aren't asking for self-government. You're asking them to guess at a reality they cannot see. It's an epistemic illusion.

  **Rosales:** I think you're conflating "knowing the chemistry" with "knowing the problem." Dewey would say the public isn't supposed to be a panel of chemists. The public is the body that *suffers* or *enjoys* the consequences of the action. If the water burns the children's teeth, the chemist doesn't feel it first. We do.

  **Vance:** But by the time you feel it, the damage is done. That's why we have insulation. Lippmann called it the "Phantom Public." We pretend the citizen is omnicompetent, that he can judge foreign policy and dental hygiene and bond yields. He can't. His attention span is too short, and his access to facts is filtered through newspapers that sell fear. If you want the right decision on fluoride, you give it to a board of health. You let them argue in the lab, not in the gym.

  **Rosales:** And who appoints the board of health?

  **Vance:** Merit. Expertise.

  **Rosales:** Based on what values? See, this is where the analogy breaks down if you stop at the lab door. In your old lab, Arthur, the goal was clear: isolate the variable, find the truth of the substance. But in a town? The "truth" isn't just the ppm of fluoride. It's whether the town trusts its water. It's whether a minority community thinks this is another way the state is experimenting on them. You can't measure *that* with a titration.

  **Vance:** I'm not saying values don't matter. I'm saying the *means* to achieve them require technical competence. If I want to cross the ocean, I value safety. But I don't vote on the angle of the rudder. I hire a captain. Lippmann's argument wasn't that experts are moral superiors. It was that the "pictures in our heads" never quite line up with the "world outside." There is a gap. A chasm. When you force a public vote, you aren't bridging that chasm; you're just asking people to shout across it. The vote becomes a plebiscite on anxiety, not a judgment on efficacy.

  **Rosales:** Okay, I'll grant you the gap. Dewey grants the gap. That's why he calls democracy a form of *inquiry*. It's not a one-off vote. It's the process of narrowing that gap through communication. If the town is anxious, that anxiety is data. It tells us the experts haven't communicated, or haven't listened. If you insulate the decision, you stop the inquiry. You get the "right" chemical answer, maybe, but you lose the public. And a public that doesn't understand its own governance isn't a public anymore. It's just a population being managed.

  **Vance:** Managed is sometimes preferable to misled. Look, I respect the "Great Community" ideal. I do. But Dewey wrote that in the 20s, before we understood just how fractured communication could become. You say communication bridges the gap. I say communication often widens it. Tonight, we had two hours of people talking past each other. The chemist spoke in milligrams; the mother spoke in fear. They didn't share a vocabulary. In science, if our data doesn't match, we recalibrate the instrument. In politics, if our data doesn't match, we accuse the other side of lying. How is that inquiry? That's just noise.

  **Rosales:** It's noise because we're out of practice. We've treated voting like a transaction—*I put a slip in the box, I get a result*—rather than a collaborative process. But think about the science you did. Did you work in a vacuum?

  **Vance:** As close as possible.

  **Rosales:** But you published. You submitted to peer review. You relied on the community of chemists to check your work. That's social. That's communication. Dewey's point is that the public needs to be the peer review for the experts. Not on the chemistry, but on the *application*. If we hand this to the board of health, we treat the citizens like lab rats. If we keep it here, messy as it is, we treat them like partners.

  **Vance:** But lab rats don't have to live with the error. If a chemist makes a mistake in calculation, he spills a beaker. If a public votes based on a rumor, they poison a generation, or they let their teeth rot because they bought a conspiracy theory. The stakes of the "experiment" are too high for the method to be this... amateur. Lippmann argued that self-government is a function, not a mystical right. If the function requires knowledge the public doesn't have, insisting they perform it is like insisting passengers fly the plane because they're paying for the ticket.

  **Rosales:** But the passengers get to decide where the plane goes. That's the irreducible core. If the experts decide the destination *and* the flight path, we aren't in a democracy; we're in a technocracy. And technocracies are efficient until they aren't. Until the experts decide that "efficiency" means something the people can't live with. The fluoridation vote isn't just about teeth, Arthur. It's about whether we believe we can govern ourselves at all. If we say "no, it's too hard, let the experts do it," we atrophy. The muscle of citizenship weakens.

  **Vance:** I'm not saying atrophy. I'm saying specialization. We specialize in everything else. Why is governance the one place where we insist on amateurism? Dewey wanted to turn politics into science. I'm telling you, politics *resists* that. There are too many variables. You can't control for fear. You can't control for history. When you put this to a vote, you aren't creating a "Great Community." You're creating a battlefield. And on a battlefield, the best argument doesn't win; the loudest voice does.

  **Rosales:** Maybe. But in your insulated boardroom, the loudest voice is the one with the budget or the political appointment. At least here, in the gym, the mother with the worried child gets a microphone. Dewey knew it was messy. He knew the public was often "eclipsed." But his solution wasn't to lock the door. It was to build better schools, better newspapers, better forums. To make the inquiry *better*, not to cancel it.

  **Vance:** And how long does that take? Generations? Meanwhile, the water flows.

  **Rosales:** Democracy is slow. Science can be fast. That's the tension. But if we speed up the decision by cutting out the people, we might solve the chemical problem and create a social one that's much harder to fix. Trust is harder to synthesize than fluoride.

  **Vance:** *(Pauses, looking at the empty chairs)* I worry that you're romanticizing the friction. You call it "inquiry"; I call it gridlock born of ignorance. I suppose my fear is that the "world outside" is indifferent to our feelings about it. The chemistry will do what the chemistry does, regardless of whether the town feels included in the decision.

  **Rosales:** And my fear is that the "world outside" includes us. We aren't just observers of the chemistry; we're part of the system. If the system doesn't account for our trust, it fails. Even if the teeth are perfect.

  **Vance:** *(Sighs, picking up his briefcase)* So we're left with the choice between a decision that might be technically right but socially brittle, or a process that is socially robust but technically risky.

  **Rosales:** That sounds like the human condition, Arthur. We don't get to run the experiment under controlled conditions. We just have to run it together.

  **Vance:** *(A faint, weary smile)* Well. I suppose I'll see you at the next meeting. Someone will likely want to vote on the pH balance of the swimming pool next.

  **Rosales:** *(Smiling back)* I'll bring the litmus paper. You bring the experts.

  **Vance:** Goodnight, Elena.

  **Rosales:** Goodnight, Arthur.

  *(They walk toward opposite exits. The lights in the gym flicker once, then stay on.)*
