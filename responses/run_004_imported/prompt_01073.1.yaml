answer: |-
  **Title:** The Squared Circle and the Sovereign State: A Verdict on Hobbes's Hubris
  **To:** You and Theo
  **From:** The Arbitrator of Bar Bet Philosophy

  It is a testament to the quality of your friendship (and the strength of your drinks) that you managed to spend two hours debating Thomas Hobbes's epistemology rather than the merits of the local IPA. This is a genuinely deep cut of early modern philosophy. Theo is right that the *verum factum* principle (truth is made) is the cornerstone of Hobbes's system, and you are right to sense that the Wallis feud isn't just a funny footnote—it smells like a symptom.

  To settle this: Theo wins on the **logic**, but you win on the **diagnosis**. The Wallis debacle does not disprove Hobbes's theoretical claim that civil philosophy can be a demonstrative science. However, it provides damning evidence that Hobbes himself lacked the epistemic virtues required to practice it, and that his specific application of the "construction" model in politics suffers from the same blind spot that ruined his geometry.

  Here is the breakdown you can take back to the bar.

  ### 1. The Hobbesian Thesis: *Verum Factum*
  To give Theo his due, we must first steelman Hobbes's argument. It is found primarily in *De Corpore* and *Six Lessons to the Professors of the Mathematiques* (1656).

  Hobbes distinguishes between two kinds of knowledge:
  1.  **Natural Philosophy (Physics):** We observe effects (rain, gravity, stars) and guess at the causes. Since God made nature, not us, we can never be certain we have the right cause. We have only probability.
  2.  **Demonstrative Science (Geometry & Civil Philosophy):** We know the causes because **we are the causes**.

  In geometry, we define the point, the line, and the circle. We construct the figure. Because we stipulated the rules of the game, we can know the properties of the figure with absolute certainty. There is no "maybe" about a triangle having 180 degrees because we defined what a triangle *is*.

  Hobbes argues Civil Philosophy works the same way. The Commonwealth is not a natural organism; it is an artifact. We create it through the Covenant. We define the Sovereign, the laws, and the obligations. Therefore, just as we can demonstrate theorems about a circle we drew, we can demonstrate theorems about a Commonwealth we built. We don't need to look at history (which is just experience/probability); we need to look at the logical consequences of the construction.

  On this abstract level, Theo is correct. The fact that a carpenter builds a wobbly table does not disprove the principles of carpentry. The fact that Hobbes failed to square the circle does not logically prove that "construction yields certainty" is false. It only proves Hobbes is fallible.

  ### 2. The Wallis Debacle: More Than a Math Error
  However, your intuition is that this isn't just a wobbly table. It's a carpenter who insists the table is flat while standing on it as it collapses.

  The feud with John Wallis wasn't merely that Hobbes got the math wrong. Squaring the circle using only a compass and straightedge is impossible (proven in 1882, but Wallis and others knew Hobbes's specific methods were nonsense in the 1650s). The scandal was Hobbes's **reaction to refutation**.

  When Wallis demonstrated the errors, Hobbes did not say, "Ah, I see a flaw in my construction." He attacked Wallis's character. He attacked the university system. He published *Six Lessons* essentially demanding the professors accept his proof because he *said* it was right. He conflated **stipulating a definition** with **proving a consequence**.

  In geometry, you can define a "squangled circle" all you want, but if the construction doesn't follow the rules of Euclidean space, it doesn't exist. Hobbes acted as if his *will* to have squared the circle was enough to make it so. He treated the public, verifiable rules of geometry as if they were subject to his own authoritative definition.

  ### 3. The Verdict: Where the Flaw Connects
  Here is where we render judgment on your argument vs. Theo's.

  **Theo is right that:** The failure of one specific geometric proof does not invalidate the epistemological principle that *scientia* comes from construction. It is possible, in theory, to have a demonstrative science of politics based on social construction.

  **But you are right that:** The Wallis incident is **diagnostic evidence of a methodological corruption** that bleeds directly from Hobbes's geometry into his politics.

  The shared flaw is **the confusion of Authority with Demonstration.**

  In geometry, truth is established by public verification of the steps. Even if I draw the line, *you* get to measure it. Hobbes rejected this. He believed that because he was the "author" of the proof, he had a privileged access to its truth that the critics (Wallis) lacked.

  Now, look at his Civil Philosophy. He argues the Commonwealth is constructed by the people. But once constructed, the Sovereign is the sole judge of doctrine, law, and even (in some readings) what is rational. The "construction" (the Covenant) creates an authority that shuts down the very public verification that makes geometry certain.

  If Hobbes's geometry failed because he refused to submit his construction to public scrutiny, his political theory is suspect because it builds a system that *institutionalizes* that refusal. He wants the certainty of geometry without the humility of the geometer.

  ### The Final Ruling
  You can go back to Theo with this specific distinction:

  **The Wallis debacle is not evidence against the *possibility* of a demonstrative civil philosophy, but it is definitive evidence against *Hobbes's specific claim* to have founded one.**

  The failure in geometry reveals that Hobbes suffers from a specific cognitive bias: he believes that **defining** a thing gives him control over its **consequences**.
  *   **In Geometry:** He defined a quadrature, but the mathematical consequences didn't follow. He was wrong.
  *   **In Politics:** He defines a Sovereign, assuming political stability will follow. But human passions (the "matter" of the political figure) often resist the definition.

  The verdict is this: **The Wallis feud proves that Hobbes treats "construction" as an act of will rather than an act of reason.** Since his political theory relies on the same model of construction, the geometric failure is a *reductio ad hominem* of his political project. It shows that the man claiming to teach us the "science of justice" could not master the science of lines because he lacked the one virtue required for both: the willingness to be proven wrong by the public evidence.

  So, buy Theo a drink because his PhD training is sound on the abstract epistemology. But buy yourself a double because your gut was right: the man who couldn't square a circle because he wouldn't listen to critics is the same man who built a political theory that demands you stop arguing and obey. The geometry wasn't just a hobby; it was a warning label.
