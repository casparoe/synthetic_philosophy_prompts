answer: |-
  This is a sophisticated dispute that cuts to the heart of decision theory. You are effectively channeling the "Resolute Choice" objection, most famously associated with Edward McClennen, against the "Myopic Choice" assumption inherent in standard money-pump arguments. Your friend is channeling the recent rigorous defense of money pumps found in the work of Johan Gustafsson and others who argue that resolute choice violates diachronic consistency norms.

  To help you make your case, we need to show that the money-pump argument for completeness is not a *reductio ad absurdum* of incomplete preferences, but rather a *modus ponens* that forces a choice between incomplete preferences and myopic decision-making. Since myopic decision-making is not a requirement of rationality, the argument fails to compel completeness.

  Here is a structured argument you can use, designed to engage seriously with your friend's "ad hoc" objection.

  ### 1. Identify the Hidden Premise: The Myopia Assumption
  The first step is to clarify exactly what the money-pump argument assumes. It does not merely assume an agent has incomplete preferences; it assumes an agent makes decisions **myopically**.

  *   **Myopic Choice:** At every node in a decision tree, the agent chooses based solely on the options immediately available, treating the current choice as if it were isolated. The agent does not consider how the current choice constrains future options, nor does it use past choices as binding constraints on the present.
  *   **The Pump's Mechanism:** The pump works because, at node 1, the agent accepts Trade A (because it's not worse than Status Quo). At node 2, faced with Trade B, the agent's incomplete preferences allow them to swap (since neither is preferred to the other). At node 3, they pay to return to Status Quo.
  *   **The Vulnerability:** The agent is only "pumped" if they treat Node 2 as a fresh start. If they treat Node 2 as *part of a sequence initiated at Node 1*, they can recognize that accepting Trade B leads to a dominated outcome.

  **Your Argument:** The money pump proves that *Incomplete Preferences + Myopic Choice = Exploitability*. It does not prove that *Incomplete Preferences = Exploitability*. To get the conclusion your friend wants, they must prove that Myopic Choice is a requirement of rationality. It is not.

  ### 2. Addressing the "Ad Hoc" Objection
  This is the crux of your debate. Your friend argues that adopting a rule like "never accept a trade that leads to a previously rejected option" is a gerrymandered fix invented solely to dodge the counterexample. In philosophy of science terms, they are accusing you of a "degenerative problem shift."

  Here is how to counter that charge without dismissing it:

  **A. Resolute Choice is a General Feature of Agency, Not a Patch**
  Argue that "resolute choice" (choosing a plan at the outset and sticking to it) is not a rule invented for money pumps. It is a fundamental description of how rational agents handle time.
  *   **The Ulysses Analogy:** Consider Ulysses and the Sirens. At $t_1$, Ulysses prefers to bind himself. At $t_2$, hearing the song, his local preferences shift. If he acts myopically at $t_2$, he crashes. If he acts resolutely (adhering to the $t_1$ plan), he succeeds. We do not call Ulysses' commitment "ad hoc"; we call it *prudence*.
  *   **Application to Incompleteness:** An agent with incomplete preferences between Clarinet and Law is like Ulysses. They can decide at the outset: "These are incomparable, so I will pick one and treat that choice as binding to avoid cycling." This is not a patch; it is a **tie-breaking procedure** necessitated by the incompleteness. Since the preferences do not dictate a choice, *something else must*. Using history ("I already chose Clarinet") is a perfectly valid, non-arbitrary tie-breaker.

  **B. The "Ad Hoc" Charge Cuts Both Ways**
  Turn the objection back on your friend. Who is really making the unmotivated assumption?
  *   **Your Position:** You are assuming agents can plan ahead and remember past choices. This is a minimal cognitive capacity for any non-trivial agent.
  *   **Friend's Position:** They are assuming agents *must* treat every decision as memoryless and isolated. This is a massive, substantive constraint on agency. Why *must* a rational agent forget what they chose five minutes ago?
  *   **The Pivot:** Argue that it is far more "ad hoc" to insist that rationality requires amnesia than to insist that rationality allows for planning. The money-pump argument only works if we *forbid* the agent from using the very cognitive tools (memory, planning) that allow them to navigate a complex world.

  **C. Gustafsson's Consistency Norms Presuppose Completeness**
  Your friend cites Gustafsson's argument that resolute choice violates "Sequential Choice Consistency." You need to point out that this consistency norm is question-begging in this context.
  *   Gustafsson argues that if you choose $A$ over $B$ at time 1, you must choose $A$ over $B$ at time 2 if offered again.
  *   **Counter:** This norm assumes that choosing $A$ reveals a stable preference $A \succeq B$. But with *incomplete* preferences, choosing $A$ does not reveal $A \succeq B$; it reveals only that $A$ was *selected from the set* $\{A, B\}$.
  *   Because the preference relation is gappy, the agent is *permitted* to choose either. Therefore, choosing $A$ first and then refusing to swap to $B$ later is not inconsistent; it is simply two permissible choices made under a policy of stability. To call this "inconsistent" is to smuggle in the assumption that preferences must be complete (i.e., that one option *must* be better).

  ### 3. The Normative Upshot: Instrumental Rationality
  Finally, bring the argument back to the purpose of coherence arguments. Proponents like Yudkowsky argue that EUT is required for *instrumental rationality* (getting what you want).

  *   **The Test:** If an agent with incomplete preferences uses resolute choice, do they leave money on the table? **No.** They end up with a satisfactory outcome and avoid the loss.
  *   **The Conclusion:** If the goal of the coherence argument is to show that non-EUT agents *lose*, and the resolute agent *does not lose*, then the argument has failed to show that non-EUT agents are instrumentally irrational.
  *   **The Cost:** The only "cost" the resolute agent pays is that they restrict their future freedom of choice. But restricting future freedom (pre-commitment) is often the *height* of rationality (e.g., signing a contract, putting money in a savings account).

  ### Summary for Your Friend
  You might summarize your position to your friend like this:

  > "The money-pump argument demonstrates that an agent with incomplete preferences *who is also forbidden from planning ahead* will be exploited. I agree that myopic agents with gaps are vulnerable. But rationality does not demand myopia.
  >
  > You call resolute choice 'ad hoc,' but it is simply the application of diachronic planning to a situation where local preferences are silent. If my preferences don't rank Clarinet vs. Law, I am permitted to adopt a policy: 'I will pick Clarinet and stick with it to avoid cycling.' This policy preserves my welfare without requiring me to fabricate a preference I don't have.
  >
  > To rule this out, you must assert a 'Sequential Consistency' norm that says my choice at $t_2$ must be independent of my choice at $t_1$. But that norm assumes preferences are complete and stable in a way that begs the question. If you insist that rationality requires me to ignore my own past choices, *that* is the unmotivated assumption, not my refusal to be money-pumped."

  ### Recommended Reading to Bolster Your Case
  If you want to dig deeper, these references support your side of the debate:
  1.  **Edward McClennen, *Rationality and Dynamic Choice* (1990):** The definitive defense of resolute choice against money pumps.
  2.  **Isaac Levi, *Hard Choices* (1986):** Argues that incompleteness is a rational response to conflicting values and that coherence arguments fail to capture this.
  3.  **David Gauthier, *Morals by Agreement* (1986):** Discusses constrained maximization and why sticking to a plan can be rational even when local maximization suggests otherwise.

  Your intuition is correct: the money-pump argument for completeness relies on a specific, contestable theory of sequential choice. It does not establish completeness as a standalone requirement of rationality.
