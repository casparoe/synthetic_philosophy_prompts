answer: |-
  This is not petty at all. It's actually a really profound question about communication, ethics, and relationships. You are asking about the difference between **objective truth** and **relational credibility.**

  To answer your specific question: **Yes, there is a real, coherent distinction between being right about something and being the right person to point it out.**

  Here is the breakdown of why your friend snapped, why your ex and roommate are both partially right (and partially wrong), and how to handle this without losing the friendship or your sanity.

  ### 1. The Message vs. The Messenger
  You are correct that the *message* is objectively true: Smoking is harmful, and addiction is dangerous. If a scientist who smoked three packs a day stood up and presented data showing smoking causes cancer, the data would still be valid.

  However, in a friendship, advice is not received as data. It is received through the filter of the relationship. When you advise someone, you are implicitly saying, *"I am in a stable position to guide you."*

  Your friend's pushback ("You did literally the exact same thing") is about **credibility**.
  *   **The Past:** You smoked for six years. To her, you aren't a "non-smoker"; you are a "former smoker." That gives you empathy, but it doesn't give you moral high ground.
  *   **The Present:** You still vape. To someone struggling with nicotine addiction, vaping often looks like "still being addicted." It undermines the "I quit" narrative.

  When the messenger appears to still be struggling with the same demon (nicotine), the advice feels less like "I want to save you" and more like "I am better than you."

  ### 2. The Frequency Factor
  You mentioned you bring it up "almost every time we hang out."
  Even if you were a health guru who had never touched a cigarette in your life, bringing up a sensitive insecurity every few days is going to cause friction.

  *   **Nagging creates shame.** Addiction is deeply tied to shame. When you point out her smoking constantly, you aren't reminding her of health facts (she already knows them); you are reminding her of her failure.
  *   **Shame fuels addiction.** Psychologically, when people feel shamed about a coping mechanism, they often use that coping mechanism *more* to deal with the stress of the shame.
  *   **Autonomy.** She is an adult. By bringing it up constantly, you are inadvertently parenting her. Friends support; parents correct. She wants a friend.

  ### 3. The Projection Element
  This is the hard part to hear, but it might be the key to unlocking this for you. You said quitting was "one of the hardest things I've ever done." That is a trauma response. You fought a war against your own brain for six years.

  When you see her smoking, you aren't just seeing her make a bad choice; **you are seeing yourself in the danger zone.**
  *   Your anxiety about *your* past is being projected onto *her* present.
  *   You are trying to control her behavior to soothe your own anxiety about addiction.
  *   Your roommate is onto something: If you were fully free of nicotine (no vaping), you might feel less triggered by her smoking, and therefore less compelled to nag.

  ### 4. So, do you have "no business" saying anything?
  You have the business of a friend to care, but you do not have the business of a sponsor to monitor.

  There is a massive difference between **support** and **surveillance**.
  *   **Surveillance:** "Are you still smoking? You know that's bad. Don't end up like I was." (This is what you've been doing).
  *   **Support:** "I know how hard this is. I'm here if you want to vent about cravings. No judgment."

  Your friend didn't snap because she wants to die of lung cancer. She snapped because she feels judged by someone she thought was on her team.

  ### The Verdict
  Your ex is wrong. Keeping push will damage the friendship and likely make her smoke more defensively.
  Your roommate is partially right. Your continued vaping makes the lectures feel hypocritical, but you don't necessarily have to be perfect to care about someone.
  **Your friend is right about the dynamic.** She doesn't need a lecture; she needs a friend who doesn't look at her with disappointment.

  ### How to Fix It
  You can resolve this "stuck in your head" feeling by taking action that aligns with your values (caring for her) without violating the boundary (nagging).

  1.  **The Reset Conversation:** Next time you see her, own it. Say something like: *"I've been thinking about what you said last week. You're right. I was projecting my own crap onto you. I know how hard quitting is, and me nagging you isn't helpful. I'm sorry I've been lecturing you."*
  2.  **Stop the Count:** Make a deal with yourself. You are not allowed to mention her smoking unless *she* brings it up first. This will lower your anxiety and prove to her that you respect her autonomy.
  3.  **Examine the Vaping:** Not because your roommate said so, but because *you* said this is bugging you. If you are still vaping, you are still managing an addiction. Acknowledge that you are on the same spectrum as her, just at a different point. That humility will kill the urge to lecture.

  **Summary:** You are right about the health risks. Your friend is right about the delivery. In relationships, **how** something is said almost always matters more than **what** is said. You can love her and want her to be healthy without being the enforcer of it.
