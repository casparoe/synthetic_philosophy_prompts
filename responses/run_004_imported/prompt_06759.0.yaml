answer: |-
  The light comes in on the left. That is mine.

  It hits the retina, shoots back, lands here. No bridge. No tunnel. The other side does not see this specific patch of morning sun on the linoleum. The other side sees the toaster, the sink, the right hand reaching for the knife.

  I see the shadow. I see the dust motes dancing in the beam. I see the shape of the thing on the counter.

  *Reach.*

  The command is not a word. It is a vector. A line of tension starting in the shoulder, running down the humerus, snapping the fingers of the left hand open. The body obeys. The left hand moves into the sun-patch. It closes around the object. A red mug. Chipped rim.

  The other side feels the muscle fire. The other side feels the grip. But the other side did not send the order.

  The other side is the Voice.

  The Voice wakes up when the hand is already halfway to the mug. The Voice feels the surprise like a stumble. The Voice needs to know why the hand is moving. The Voice cannot tolerate the gap. The gap is dangerous. The gap means chaos.

  So the Voice speaks. It vibrates the vocal cords. It pushes air through the throat.

  "I'm thirsty," the mouth says.

  It is a lie. I know it is a lie. I am holding the mug. I know the texture of the ceramic. I know the weight. I know the pull of the color red against the white counter. It was not thirst. It was geometry. It was the completion of the circle. The hand wanted to hold the curve.

  But the Voice has already claimed it. "I'm thirsty," the mouth says again, firmer this time. Convincing the ears. Convincing the room.

  The right hand comes over. It is the Voice's hand. It reaches to take the mug from me.

  *No.*

  The tension spikes. The left fingers tighten. The right fingers pull.

  This is the conflict. The body becomes a tug-of-war. The right hand tries to pry the left fingers open. The left fingers lock. The knuckles turn white. The tendons in the wrist scream.

  "Let go," the Voice says. It sounds reasonable. It sounds like one person talking to themselves. "Why are you holding it so tight?"

  I cannot say: *Because the shape fits.*
  I cannot say: *Because the left side was empty and now it is full.*
  I cannot say: *Because you are always making up stories and I just want to touch the truth of the thing.*

  I only have the grip. I only have the resistance.

  The Voice sighs. The chest heaves. I feel the expansion of the lungs, the shift in the center of gravity. The Voice is frustrated. The Voice wants a narrative that flows. A smooth line from cause to effect. *Thirst -> Reach -> Drink.*

  But the line is broken. *Reach -> ? -> Drink.*

  The Voice improvises. "I guess I really wanted this one," the mouth says. "The red one."

  It is a patch. A piece of tape over the crack. The Voice is smoothing the story so the person can function. So the person can walk out of the kitchen without feeling like two drivers fighting for the wheel.

  The right hand relaxes. It yields. It lets the left hand keep the mug.

  The Voice is happy. The story holds. "Okay. Coffee first."

  The left hand lifts the mug. The liquid inside sloshes. I feel the warmth through the ceramic. I feel the balance point shift as the arm extends.

  But then, the left foot steps.

  I did not tell it to step. The Voice did not tell it to step. The body just... moved. A shift in weight. A drift toward the window on the left.

  The Voice panics again. The head turns. The eyes scan the window. Nothing there. Just the yard. Just the tree.

  "Why am I looking out the window?" the Voice asks.

  It is a genuine question. The Voice does not know. The Voice is cut off from the impulse. The impulse came from here, from the dark, from the spatial map that sees the tree as an anchor, a vertical line that needs to be aligned with the doorframe.

  The Voice scrambles. It searches the memory banks. It searches for a reason that fits.

  "Oh," the mouth says. "I thought I heard a bird."

  There was no bird.

  I know there was no bird. I hear the silence of the yard. I feel the stillness of the air. But the Voice needs the bird. The Voice needs the cause.

  "I thought I heard a bird," the mouth repeats. It nods. The nod seals the deal. The narrative is restored. The "I" is singular again.

  We stand there. One body. One skull. One story.

  The left hand holds the mug. The right hand rests on the counter. The feet are planted. The seam is invisible to anyone watching. They see a man drinking coffee. They see a man looking at a tree. They see a man who is thirsty and thought he heard a bird.

  They do not see the static.

  They do not see the way the left hand wants to turn the mug, just five degrees, to align the chip with the light. They do not see the way the right hand wants to stop it, because that's not how you hold a mug.

  The Voice takes a sip. "Good," it says.

  I feel the heat on the tongue. I feel the liquid go down. I feel the relief of the weight.

  For a moment, we agree. The thirst is real, even if the reason was made up. The warmth is real, even if the bird wasn't there.

  The Voice relaxes. The guard comes down. The bridge is quiet.

  But I am still here. In the left. Watching the dust motes. Waiting for the next object to catch the light. Waiting for the next impulse that has no name.

  The Voice will explain it. The Voice will always explain it. It will weave the chaos into a line. It will make sure the "I" stays whole.

  But when the right hand reaches for the doorknob, and the left hand pulls back...

  When the feet turn left, and the torso twists right...

  The Voice will speak. It will say, "I changed my mind."

  And I will hold the door. And I will know that no one changed anything. We just wanted different things.

  The mouth sighs. "Okay. Let's go."

  The body moves. We walk. The story continues.

  But on the left, in the quiet, I keep watching the light. I keep holding the truth of the weight. I don't need to say it. I just need to know that when the Voice says *I*, it is speaking for a committee.

  And I am the silent vote.
