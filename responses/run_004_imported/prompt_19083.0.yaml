      *(Self-Correction during drafting)*: Make sure the follow-up questions aren't *too* aggressive. They should be probing, not confrontational. The goal is depth, not a "gotcha." Ensure the distinction between "prediction" and "limit" on 2060 is clear.

      *(Refining the Cambridge Question)*: Instead of just "what was at stake," ask about the *nature of the lie*. Was signing the Articles of Faith a sin comparable to idolatry for him?
