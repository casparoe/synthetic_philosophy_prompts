answer: |-
  1. **The Shadow of Lewis**
  Your position rests heavily on David Lewis's triviality results, which suggest that if conditionals have truth conditions, their probability cannot equal the corresponding conditional probability without collapsing the probability function itself. Many philosophers have tried to dodge this result by tweaking the logic of probability or the semantics of truth conditions. Why do you view abandoning truth conditions for indicatives as the *only* viable solution, rather than just the least painful one?

  *Follow-up:* You'll likely say that the other solutions require abandoning principles that are even more central to our understanding of belief and probability than truth conditions are. But if we accept your view, are we essentially conceding that the logic of belief and the logic of truth are fundamentally disjoint?

  2. **The Phenomenological Cost**
  Let's talk about the ordinary speaker. When two people argue over "If the tax bill passes, inflation will rise," they act as though one of them is right and the other wrong. They treat the sentence as a candidate for truth. By telling them that their statement lacks a truth value entirely, aren't you committed to a massive error theory about everyday discourse? What is the philosophical cost of telling speakers they are systematically mistaken about the nature of their own assertions?

  *Follow-up:* I expect you'll argue that assertibility norms can exist without truth norms. But if truth isn't the goal, why does the feeling of "getting it right" so closely mirror the feeling of asserting a true proposition? Is that feeling just a useful illusion?

  3. **The Embedding Problem**
  This is the technical hurdle that often sinks non-truth-conditional accounts. We routinely embed conditionals in larger sentences: "It is *not* the case that if it rains, the match will be cancelled," or "Either if A then B, or if C then D." If the conditional clause doesn't express a proposition, what exactly is the negation or disjunction operating on? How do you provide a semantics for these compounds without smuggling truth conditions back in through the back door?

  *Follow-up:* You might propose that these operators shift the context of supposition rather than operating on truth values. But does this force you to treat logical connectives like 'not' and 'or' as ambiguous, functioning one way for factual claims and another for conditionals?

  4. **Validity Without Truth**
  Classical validity is defined as the preservation of truth: if the premises are true, the conclusion must be true. If conditionals can't be true, that definition breaks down. How do you reconstruct the notion of logical validity on your account, and specifically, does *Modus Ponens* survive? If I accept "A" and "If A, then C," am I logically compelled to accept "C," or merely probabilistically advised to?

  *Follow-up:* If you move to a probabilistic definition of validity (where uncertainty is preserved rather than falsity), does logic cease to be a normative constraint on reasoning and become merely a description of coherent degrees of belief?

  5. **Nested Conditionals**
  Ernest Adams struggled significantly with nested conditionals, like "If A, then if B, then C." On a truth-conditional view, this is straightforward. On your view, the inner conditional has no truth value, so the outer conditional seems to be supposing a non-proposition. Have you found a way to assign assertibility conditions to nested structures that doesn't require the inner conditional to "become" a proposition for the sake of the outer one?

  *Follow-up:* If the solution requires treating the nested structure as a single, flat conditional (e.g., "If A and B, then C"), does that imply that our natural language syntax misleads us about the actual logical form of our thought?

  6. **The Nature of Conditional Belief**
  If "If A, then C" doesn't express a proposition, then strictly speaking, one cannot *believe* it in the standard sense, since belief is usually taken to be a relation to a proposition. What is the mental state involved when we accept a conditional? Is it a sui generis state of "conditional belief," or is it simply a disposition to update your categorical beliefs upon learning the antecedent?

  *Follow-up:* If it's merely a disposition to update, how do you account for the fact that we can reason *about* conditionals without actually undergoing the update? We can hold them in mind as premises without learning the antecedent.

  7. **Disagreement and Retraction**
  If I say "If it rains, the match is off" and you say "No, that's false," standard semantics says we contradict each other. On your view, since neither of us has stated a truth, what constitutes our disagreement? Furthermore, if I later learn the match was cancelled regardless of rain, should I *retract* my earlier conditional, or simply note that my conditional probability was based on incomplete information?

  *Follow-up:* If retraction isn't about admitting a past falsehood, does this change the ethics of assertion? Are we less responsible for our conditional claims than our categorical ones?

  8. **Indicative vs. Subjunctive**
  Your defense focuses on indicative conditionals. But consider the subjunctive: "If Oswald hadn't shot Kennedy, someone else would have." Many philosophers grant truth conditions to counterfactuals while denying them to indicatives. Do you maintain this split? If so, doesn't it seem odd that two grammatically similar constructions operate on entirely different semantic principles?

  *Follow-up:* If you extend the no-truth-value view to counterfactuals as well, how do you handle their obvious role in scientific explanation and causal reasoning, where they seem to track objective features of the world rather than just subjective probabilities?

  9. **Communication Without Content**
  A standard model of communication is the transfer of propositional content from speaker to listener. If conditionals lack propositional content, what is being communicated when I utter one? Are you suggesting that when I use a conditional, I am not adding to your stock of information, but rather trying to alter the *structure* of your existing information?

  *Follow-up:* If communication is about aligning conditional probabilities rather than sharing facts, does this make linguistic community much harder to sustain? How do we verify we've aligned if there's no truth condition to check against?

  10. **The Price of Coherence**
  Critics argue that your view saves the Equation ($P(\text{If } A, C) = P(C|A)$) at the too-high price of fragmenting our logic. Proponents say it's the only way to save the Equation without triviality. Looking at the broader landscape of philosophy of language, do you see the field moving toward accepting this fragmentation, or are you hopeful that a unified truth-conditional theory will eventually emerge that circumvents Lewis's results?

  *Follow-up:* If you believe the fragmentation is permanent, does this imply that human reasoning is fundamentally dualistic—partly tracking truth and partly tracking something else entirely? And if so, what is that "something else" grounded in?
