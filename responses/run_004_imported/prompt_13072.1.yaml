      *   **Buddhist:** Needs to sound like Dharmakīrti or his commentator Prajñākaragupta. Sharp, focused on causal efficacy (*arthakriyā*) and the nature of cognition.
      *   **Language:** Use Sanskrit terms (*sāmānya, svalakṣaṇa, apoha, vikalpa, savikalpaka, nirvikalpaka*) naturally but contextually clear.

  3.  **Drafting - Round 1: The Opening Salvo:**
