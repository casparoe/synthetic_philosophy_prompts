answer: |-
  **Naiyāyika:** Let us grant, for the sake of argument, your distinction between *nirvikalpaka* (concept-free) and *savikalpaka* (determinate) perception. You claim the former grasps only the unique particular (*svalakṣaṇa*), while the latter is a conceptual construction (*vikalpa*) that superimposes universals where none exist. But your theory of *apoha* collapses under its own weight. To say a cow is "not a non-cow" presupposes you can demarcate the class of non-cows. But what binds the non-cows together? If you say "nothing," then the exclusion is arbitrary. If you say "they share the property of being non-cows," you have smuggled in the very universal (*sāmānya*) you claim to dispense with. You cannot define the negative without already grasping the positive kind. *Apoha* is parasitic on the realism it seeks to deny.

  **Buddhist:** You mistake the mechanism. We do not posit a positive class to ground the exclusion. The exclusion arises from a cognitive error (*adhyavasāya*) triggered by causal efficacy (*arthakriyā*). Distinct particulars possess distinct causal powers, yet some powers are sufficiently similar to satisfy a human purpose. When I see a particular flame, I grasp only its unique heat. When I see another, I grasp a different unique heat. My mind, seeking to avoid burning, excludes both from the class of "non-burners." This exclusion does not require a real "fire-universal" inhering in both; it requires only that my ignorance (*avidyā*) treats distinct causal streams as one for the sake of survival. The unity is in the intention, not the object.

  **Naiyāyika:** A convenient story, but it severs the link between knowledge (*pramā*) and reality. When I perceive a cow and think "this is a cow," my cognition leads to successful action—I can milk it, avoid it, or sacrifice it. In Nyāya, a cognition that corresponds to reality (*yathārtha*) is what enables such success. If *savikalpaka* perception were merely a fiction, a mental projection onto a flux of uniques, it would not consistently guide action across different times and agents. We all agree on the cow. If the "cowness" were merely a negation projected by your mind, why does your projection align with mine? The only explanation is that the universal is actually *there*, disclosed in the perceptual judgment. It is much like the realist disputes in the West: if the predicate applies truly, the property must exist.

  **Buddhist:** You conflate pragmatic validity with ontological commitment. A dream tiger can make a sleeping man wake in terror; the action is real, the tiger is not. Similarly, conceptual cognition is valid conventionally (*saṃvṛti-sat*) because it coheres within the web of language and expectation, not because it mirrors an external universal. The alignment you speak of is not due to a shared *sāmānya* out there, but to shared karmic traces (*vāsanā*) in here. We have similar physiological and cognitive structures, so we exclude similar sets of particulars. The "agreement" is a coincidence of exclusion, not a communion with a real entity. Perception (*pratyakṣa*) remains pure of concepts; the moment you say "cow," you have left the real and entered the useful.

  **Naiyāyika:** But this renders all language ultimately false. If *savikalpaka* perception is fundamentally erroneous because it mixes the particular with a fictional universal, then every sentence uttered is a lie. You claim *arthakriyā* saves it, but how can a false cognition reliably produce a true result? If I reach for water based on the concept "water," and I drink, the concept must have latched onto something real in the object that guided my hand. If the object is only a unique *svalakṣaṇa* ineffable and distinct from all others, your concept "water" misses it entirely. You are left with a miracle: systematic success arising from systematic error.

  **Buddhist:** And you are left with an ontology bloated by entities posited solely to explain linguistic convenience. You reify "cowness" because you cannot bear the thought that language floats free of being. I say the tension you feel is the friction of the mind trying to grasp the ineffable flow of reality with static concepts. The miracle is not that error succeeds, but that you insist success requires a static object. We stand at the limit of what *pramāṇa* can adjudicate: you see a universal grounded in the thing; I see a exclusion grounded in the mind. The cow stands before us. You see *cowness*; I see *not-non-cow*. Both of us avoid the horns. Does the ontology matter more than the avoidance?

  **Naiyāyika:** If the ontology is wrong, the avoidance is accidental. And philosophy cannot rest on accident.

  **Buddhist:** Nor can it rest on entities unseen, save by the eye of dogma.
