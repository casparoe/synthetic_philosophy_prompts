      *(Self-Correction)*: Make sure the Nyāya argument about *savikalpaka pratyakṣa* is explicit. The prompt specifically asks about whether perception discloses the universal.

      *Revised Plan:*
      1. Nyāya: *Apoha* needs a positive basis to exclude.
      2. Buddhist: Exclusion is based on causal function, not positive essence.
      3. Nyāya: But *savikalpaka* perception *shows* the universal. If it were false, action would fail.
      4. Buddhist: Action succeeds due to pragmatic fit, not ontological match.
