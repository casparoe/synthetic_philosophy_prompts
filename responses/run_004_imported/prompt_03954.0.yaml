          *   Use the "Learner" analogy (lyre player, builder).
          *   Explain that the early acts don't require the full character yet; they *create* it. It's a spiral, not a circle.
          *   Key term: *Hexis* (settled state).
      *   *Section 2: Situationism and "Firm/Unchangeable".*
          *   Define what Aristotle means by "firm." It's about stability of motivation, not robotic behavioral output.
          *   Bring in *Phronesis*. Context matters. The virtuous person knows *when* to change behavior.
          *   Address the psychology directly. Situationism attacks "global traits." Aristotle's traits are hard-won, rare, and cognitive, not just behavioral habits.
          *   Mention that Aristotle knows people fail (akrasia). He isn't saying everyone *has* this, but what it *looks like* if you do.
      *   *Section 3: Ethics Bowl Application.*
          *   How to use this in a round?
          *   Focus on moral education (habituation).
          *   Focus on motivation (doing it for the right reason).
          *   Don't be dogmatic about situationism; acknowledge limits of human nature.
      *   *Conclusion:* Encouraging closing.

  5.  **Refining the Tone:**
