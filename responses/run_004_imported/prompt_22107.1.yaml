answer: |-
  This is a fantastic case study, and the irony is indeed delicious. As an epistemologist, you are essentially living inside a Gettier case where the justification (the feeling of certainty) has been severed from the truth (the actual outcome), yet the phenomenological force remains intact.

  To answer your specific question: **Strictly speaking, your partner is right about the rationality, but you are right about the psychology.** However, the specific irrationality you are wrestling with isn't just "trusting the feeling"; it's a failure to update the *epistemic weight* of that feeling in real-time.

  Here is the breakdown of why this is happening and where the rationality breaks down.

  ### 1. The Status of the Feeling: Defeated Evidence
  Before you kept score, your "bone-deep certainty" was a *prima facie* justified belief. Intuition is often a compressed form of pattern recognition. You felt certain, and let's assume you were right enough for it to function.

  However, once you collected the data (the 50% track record), that statistical evidence became a **rebutting defeater**. In epistemic terms, you now possess higher-order evidence that your first-order evidence (the feeling) is unreliable *in this specific domain*.

  When you say, *"overriding my read of THIS argument because of a stat about a bunch of other arguments feels almost as crazy,"* you are falling prey to the **Inside View vs. Outside View** problem (Kahneman & Lovallo).
  *   **The Outside View:** The reference class is "arguments with my partner about practical logistics." The base rate of your certainty being correct is 50%.
  *   **The Inside View:** The specific content of *tonight's* argument about chores or money feels unique, nuanced, and distinct.

  The irrationality lies in believing that the *content* of the current argument makes it exempt from the *reliability of the mechanism* generating your certainty. Unless you can identify a relevant difference between *this* argument and the previous decade's worth (e.g., "This time I have a receipt"), the statistical reliability of your intuition screens off the phenomenological force of the intuition.

  ### 2. The "Acting Like It" Problem (Akrasia vs. Belief)
  You ask: *"Which is the irrational one here, sticking with the feeling in the moment, or claiming to believe the track record and then not acting like it?"*

  This touches on the distinction between **occurrent belief** and **dispositional belief**.
  *   **Propositionally,** you believe the stats (you admit they are the stats).
  *   **Dispositionally,** you do not believe the stats (you act on the feeling).

  In pragmatist terms, if your actions don't align with the proposition, you don't *really* believe the proposition in a way that guides conduct. You have a "notional assent" to the statistics, but your cognitive architecture hasn't integrated them.

  The irrationality is not that you feel the feeling (you can't help that; it's System 1 processing). The irrationality is treating the feeling as **evidence** rather than as a **symptom**.
  *   **Evidence:** "I feel certain, therefore I am likely right." (False, given the data).
  *   **Symptom:** "I feel certain, therefore I am experiencing the '50% Reliability State'." (True).

  ### 3. Why the Stats Feel Irrelevant "In the Moment"
  You mentioned that discounting the current read feels "crazy." This is due to the **Vividness Effect**. The emotional salience of the current disagreement is high; the spreadsheet of past arguments is abstract and cold.

  Furthermore, there is a **Special Pleading** fallacy at play. Your brain is likely generating reasons *why* this time is different to justify the feeling. "But this time I actually checked the bank account," or "But this time his mother actually said X." While these details feel like differentiators, if they don't improve your hit rate above 50%, they are post-hoc rationalizations for the feeling, not genuine epistemic upgrades.

  ### 4. The Verdict
  **Is it irrational to trust the feeling?**
  Yes. You have empirical falsification of your instrument. Continuing to use a thermometer that you know is random 50% of the time is irrational, even if the thermometer *feels* like it's giving a specific reading.

  **Is it irrational to believe the stats but not act on them?**
  Yes, this is a form of epistemic akrasia. It suggests the belief in the stats is shallow. However, it is a *understandable* human failure, not a logical one. You are trying to use System 2 (stats) to override System 1 (gut feeling) while System 1 is hijacked by emotional arousal. That is cognitively expensive and often fails.

  ### 5. A Proposed Solution (For the Epistemologist)
  Since you cannot simply "turn off" the feeling, you need to change its **semantic tag**.

  Currently, the feeling tags the proposition as **TRUE**.
  You need to retrain the feeling to tag the situation as **DANGER**.

  When the bone-deep certainty arises, it should not signal "I am right." It should signal "I am currently in the 50% reliability state."
  *   **Pre-commitment (Ulysses Contract):** Agree with your partner *outside* of conflict that when this specific feeling arises, you invoke a "timeout" or a mandatory coin flip, or you default to their preference (since your input adds no signal, only noise).
  *   **Meta-Cognitive Labeling:** In the moment, say out loud: "I am experiencing the 50% Feeling." This objectifies the sensation. It moves it from being a window onto reality to being an object *in* reality that you are observing.

  **Summary:** The feeling is no longer evidence; it is noise. Ignoring noise is rational. Ignoring data because the noise is loud is not. Your partner is epistemically correct, but you are phenomenologically honest. The fix is to stop treating the feeling as a truth-tracking mechanism and start treating it as a trigger for a pre-agreed heuristic.

  (And please, for the sake of the relationship, do not tell him you are running a "System 1 vs. System 2" analysis on his mother's visitation schedule.)
