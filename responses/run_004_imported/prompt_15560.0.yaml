answer: |-
  **Setting:** *A quiet corner of the school library, two days after the TOK lesson. Elena (the Optimist) and Marcus (the Pessimist) are sitting across from each other with their laptops open, but neither is typing.*

  **Elena:** So, I've been thinking about your cousin. The one you tell "just trust me" to.

  **Marcus:** *[Laughs]* Yeah, Leo. He's seven. He wants to know why he can't lie to his teacher. I tell him "it's wrong," and he asks "why?" and I say "because I said so." It feels… cheap. Like I'm shutting him down.

  **Elena:** But is it actually wrong? I mean, think about it. If Leo asked you why the sky is blue, would you derive the physics of Rayleigh scattering on the spot? Or would you just say, "It's how light hits the atmosphere, trust me for now"?

  **Marcus:** That's the thing, though. The sky being blue is a fact. It's descriptive. Morality is prescriptive. It's about what you *do*. If I tell him "Australia is a country," he just adds a fact to his mental map. If I tell him "lying is wrong," I'm trying to program his behavior. Relying on testimony there feels like outsourcing his conscience.

  **Elena:** Outsourcing? That's a harsh way to put it. Look, we outsource our conscience all the time. When a doctor tells you, "You need to take this antibiotic," you don't demand they teach you microbiology first. You trust their expertise. Why is morality different? If my ethics professor says "utilitarianism suggests X," isn't that expert testimony?

  **Marcus:** Because the doctor scenario is about *means*, not *ends*. You already agree you want to get healthy. The doctor tells you how. In morality, the testimony is often about the *end* itself—what is valuable, what is bad. If you just believe "lying is bad" because Elena said so, you don't actually grasp the *badness*. You just grasp that Elena dislikes it.

  **Elena:** Okay, but that sounds like the "Aesthetic Objection." I know our teacher brought it up. The idea that it's like me telling you a painting is beautiful, and you believing me without looking at it.

  **Marcus:** Exactly! It *is* like that. If I tell you "This symphony is moving," and you say, "Cool, I believe it's moving," without hearing it… you haven't actually accessed the value. You have a second-hand report. Moral value is like that. You need to "see" the wrongness for yourself.

  **Elena:** Here's where I push back on the art analogy. Art is about *experience*. Morality is about *consequences*. If Leo lies, someone gets hurt. That's an objective feature of the world, not just a feeling like "this symphony is moving." If I tell him "Fire burns," that's testimony about a fact. If I tell him "Putting your hand in fire causes pain which is bad," that's moral testimony, but it's grounded in facts about suffering. He doesn't need to *feel* the suffering to know it's wrong to cause it. He just needs to know the fact.

  **Marcus:** But knowing the fact isn't enough for moral *agency*. Let's say I donate to charity solely because you told me it was the right thing to do. I have no idea *why*. I haven't reflected on the needs of the poor or the distribution of wealth. I'm just following orders. Do I get moral credit for that? Most people would say no. You're a moral parrot.

  **Elena:** I'd say you're a moral beginner. There's a developmental stage here. Leo is seven. He *can't* work out the complex social contract theory of why lying erodes trust. If I withhold the testimony until he's ready, he might grow up thinking lying is fine. Testimony is a placeholder for understanding. It gets you the right belief now, so you can act rightly, and maybe you figure out the "why" later.

  **Marcus:** But that "placeholder" might never get filled. That's the danger. If you get used to accepting moral truths on authority, you atrophy your own moral reasoning muscles. You become dependent. And worse, if the authority is wrong? If I told Leo "It's okay to lie to people from Group X," and he accepts that on testimony… he's now complicit in prejudice without ever questioning it. The risk of moral testimony is that it bypasses the critical filter that reasoning provides.

  **Elena:** But the risk of *not* using testimony is that we all reinvent the wheel and make basic errors. We stand on the shoulders of giants in science. Why not in ethics? If I trust the consensus that "slavery is wrong," I don't need to re-argue the case for human dignity from scratch. I can take that moral knowledge as given and focus on new problems.

  **Marcus:** In science, if you believe on testimony, you can still verify it later. The evidence is there in the world. In morality, the "evidence" is often your own rational intuition or emotional response. If you silence that to listen to me, you've cut off the very source of moral evidence.
  *[Leans forward]*
  Here's my real issue, Elena. It's not that you can't have *knowledge*. Maybe you do "know" lying is wrong because I told you. The problem is you lack *understanding*. And in ethics, understanding is necessary for the belief to have any worth.

  **Elena:** Okay, hold on. Are we arguing about *epistemology* (can I know it?) or *virtue* (am I a good person?)? Because if you're saying I can't *know* it's wrong via testimony, I disagree. If a trusted friend tells me a secret, I know it. If a trusted moral agent tells me an action causes harm, I know that too.

  **Marcus:** I'm willing to concede you might have "propositional knowledge." You know *that* it is wrong. But you lack "moral understanding." You don't grasp the *reasons*. And without the reasons, your belief is fragile, and your action is hollow.
  So, when you say "We trust testimony for everything," I say: "Yes, for facts. But for values, testimony gives you the conclusion without the proof." And in math, if you have the conclusion without the proof, you haven't really done math.

  **Elena:** But life isn't a math class. It's an emergency room sometimes. Sometimes you need to act right *now*.
  *[Pauses]*
  I think I see where we're stuck. You think the value of moral belief is internal—it's about the quality of your own reasoning and character. I think the value of moral belief is external—it's about whether the right actions get done and harm gets reduced.

  **Marcus:** That's… actually pretty close. If the goal is just "right actions," then testimony is fine. Robots could do that. But if the goal is "moral agents," then testimony is defective.

  **Elena:** So, you're saying moral testimony fails to make you *virtuous*?

  **Marcus:** Yes. It might make you *correct*, but not *good*.

  **Elena:** And I'm saying that's an elitist distinction. If Leo stops lying because I told him to, he's not hurting anyone. He's learning the norm. The "virtue" comes later. If you demand everyone derive their own morality, you're going to leave a lot of people behind.
  So, is the disagreement this: Do you think moral testimony fails to transmit *truth*, or do you think it transmits truth but fails to transmit *moral worth*?

  **Marcus:** I think it transmits truth—sort of. It transmits a belief that happens to be true. But it fails to transmit the *justification* that makes the belief morally resilient. So, it's not that you don't "know." It's that your knowledge is second-hand, and in ethics, second-hand knowledge doesn't motivate action the way first-hand understanding does.

  **Elena:** And I think you're underestimating how much we rely on "second-hand" motivation. I don't want to hurt people's feelings. Why? Partly because I figured it out, but partly because I was taught that's how decent people behave. The testimony *became* my motivation.
  So, to pin it down: You think the defect is in the *agent* (you're not autonomous). I think the defect is only in the *method* if it leads to wrong outcomes. If the testimony is reliable, the method is fine.

  **Marcus:** So I'm focused on the *source* of the belief (autonomy), and you're focused on the *reliability* of the belief (truth/outcomes).

  **Elena:** Exactly. You want a moral philosopher; I'm okay with a moral compass, even if someone else held it first.

  **Marcus:** *[Closes laptop]* Well, I suppose Leo needs a compass right now. He can be a philosopher when he's older.

  **Elena:** *[Smiles]* See? Optimist wins. You just used moral testimony on yourself. I told you "Leo needs a compass," and you agreed.

  **Marcus:** *[Groans]* Don't start. I agreed because I weighed the developmental needs of a child against the ideal of autonomy. I reasoned it out.

  **Elena:** Sure you did. Keep telling yourself that.

  **Marcus:** But seriously. If he never grows out of it?

  **Elena:** Then we cross that bridge when we get there. But for now, "Trust me" is doing the work.

  **Marcus:** Fine. But I'm telling him *why* tomorrow.

  **Elena:** Deal.
