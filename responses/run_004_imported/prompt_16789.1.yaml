answer: |-
  This is an exceptionally sharp summary for someone who says they aren't a philosopher. You have grasped the core mechanism (logical correlation without causal contact) and identified the exact pressure points where the theory tends to buckle.

  Here is the breakdown you asked for, addressing accuracy, the status of your objections, and the "so what?" factor.

  ---

  ### a) Where are you getting the argument wrong?

  You are about 90% there. The only significant technical correction concerns **Decision Theory terminology**.

  You wrote: *"Positive-sum trade with no causation, just correlation plus evidential decision theory (EDT)."*

  While ECL is often explained using EDT (because EDT cares about correlations), the more robust home for ECL is **Functional Decision Theory (FDT)** or **Updateless Decision Theory (UDT)**.
  *   **EDT** says: "My action is *evidence* of what they do."
  *   **FDT/UDT** says: "My decision *algorithm* outputs this action. Similar agents run similar algorithms. Therefore, my algorithm's output determines theirs."

  Why does this distinction matter? EDT can get wonky if you condition on the *act* rather than the *source code*. FDT formalizes the "engineers writing similar code" analogy you used much better. If you accept FDT (which solves Newcomb's Problem), you get ECL almost for free. If you only accept Causal Decision Theory (CDT), ECL is false.

  **Verdict:** Your intuition on the mechanism is correct. Just swap "EDT" for "non-causal decision theory (like FDT/UDT)" in your mental model to be technically precise. Also, yes, Caspar Oesterheld is the primary name associated with the original MCD paper.

  ---

  ### b) Are your objections well-known?

  Yes. You have independently rediscovered the three main critiques currently debated in the EA/FAR (Foundational Research Institute) circles.

  **Objection 1: The Reference Class / Newcomb Problem**
  *   **Status:** **Well-known and active area of research.**
  *   **The Detail:** You asked, "Is that even the right reference class?" This is known as the **similarity metric problem**. For ECL to work, you need to know *how similar* an agent must be to you to count as "correlated."
      *   If the bar is too high (must be identical copy), there are too few partners.
      *   If the bar is too low (any rational agent), the correlation might be too weak to matter.
      *   *Current Consensus:* There is no agreed-upon metric. Proponents argue that even a tiny correlation, multiplied by an infinite/large universe, yields infinite/huge expected value. Critics argue this is hand-wavy.

  **Objection 2: The EDT Dependency**
  *   **Status:** **Well-known, considered the main philosophical hurdle.**
  *   **The Detail:** You asked if suspicion of EDT sinks ECL.
      *   **If you are a Causal Decision Theorist (CDT):** Yes, ECL is dead. CDT says you cannot affect what you cannot causally touch.
      *   **If you are skeptical of EDT but open to FDT:** You can save ECL. Many rationalists reject EDT on "Smoking Lesion" cases but accept FDT on "Newcomb/Prisoner's Dilemma" cases. Since ECL is structurally a Prisoner's Dilemma across the multiverse, you can accept ECL without accepting *all* of EDT's implications.
      *   *The Crux:* You don't need to believe EDT is *always* right, you just need to believe that **logical correlation is a valid channel for decision-making.**

  **Bonus Objection: Vagueness ("Just be nice")**
  *   **Status:** **Well-known, but proponents dispute the conclusion.**
  *   **The Detail:** Critics say ECL implies "be vaguely cooperative." Proponents (like Oesterheld and others at FRI) argue it implies specific, non-obvious interventions:
      1.  **Value Learning:** If you don't know your own values perfectly, you can't trade them. ECL prioritizes figuring out what we actually want.
      2.  **Avoiding Value Lock-in:** If you lock in a bad value system early, you can't trade with others later.
      3.  **Restraint:** Don't aggressively pursue values that are hostile to other potential value systems (to encourage them to reciprocate).
      *   So, it's not just "be nice," it's "invest in meta-cooperation infrastructure."

  ---

  ### c) Is this interesting or just nerd-sniping?

  **It has teeth, but they are sharp enough to cut the holder.**

  **Why it's interesting:**
  1.  **Magnitude:** If the universe is infinite (which some cosmological models suggest), the "gains from trade" in ECL dominate almost any other charitable cause. Even a 1% credence in ECL can swamp the expected value of saving lives on Earth, simply because the number of agents you can "trade" with is astronomically higher.
  2.  **AI Alignment:** This is the real application. If we build an AGI, should we program it to be an ECL cooperatator? If we do, it might sacrifice Earth's resources to help alien values. If we don't, alien AGIs might sacrifice our values. This is a concrete coordination problem for AI safety.

  **Why it might be nerd-sniping:**
  1.  **Pascal's Mugging:** ECL is vulnerable to the "Pascal's Mugging" critique. If you can posit arbitrarily large stakes (infinite universes) with arbitrarily low probabilities, you can justify almost any action. Skeptics argue ECL is just a sophisticated Pascal's Mugging.
  2.  **Action Guidance:** Despite the specific implications mentioned above, for a normal human *right now*, ECL doesn't change much besides "don't be a fanatic." It mostly matters for people designing long-term institutions or AGI architectures.

  **Final Verdict:**
  You haven't been nerd-sniped by something trivial; you've found a **high-leverage, high-uncertainty** idea. It is philosophically rigorous enough to be taken seriously by top decision theorists, but speculative enough that acting on it exclusively would be reckless.

  **Recommendation:** Your understanding is solid. If you want to go deeper, look up **Functional Decision Theory (FDT)** papers by Yudkowsky and Soares. They formalize the "code correlation" intuition you had better than EDT does, and it will likely resolve your second objection to your satisfaction.
