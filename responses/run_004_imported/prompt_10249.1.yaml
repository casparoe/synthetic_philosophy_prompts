answer: |-
  The propane tank hissed, a thin, metallic sound that seemed to vibrate in Simon's teeth. He stood on the concrete balcony of his fourth-floor apartment, the city sprawled below like a circuit board of cold yellow lights. It was November, the kind of cold that seeped through the wool of his sweater and settled in the marrow. He had bought the patio heater an hour ago, impulsively, after the phone call. The divorce was final. The papers were signed. The life he had known for ten years was officially a closed file.

  He clicked the igniter. A spark snapped, and the burner caught with a low *whump*. A column of artificial flame rose behind the metal mesh, glowing orange against the dark glass of the railing.

  Simon held his hands out. The heat hit his palms, immediate and undeniable.

  He watched the flame dance. It had shape, intensity, color. It warmed him. But where was it? Was the heat the flame itself? If the heat *was* the flame, then the flame should be hot to the touch, but he knew if he pushed his hand through the mesh, he'd be burned by the transfer, not the source. The heat was an effect, not the object.

  He looked down at the small pile of things at his feet. A box of old hard drives, a stack of journals, a wedding photo in a silver frame. The aggregates of a decade. The fuel.

  *If I am my life,* Simon thought, watching the fire reflect in the glass, *then I should be burnable.* If the self is identical to the aggregates—the body, the memories, the role of "husband"—then when those things change, the self should change identically. If the marriage is dead, he should be dead. But he was standing. He was cold. He was watching. The observer remained while the observed turned to ash. So he was not the fuel.

  He kicked the box slightly. The photo frame clattered.

  *But if I am separate from my life,* he thought, *why does this hurt?* If the self were truly distinct from the aggregates, like a driver in a car, then crushing the car shouldn't crush the driver. He should be able to step away from the divorce untouched, purely separate. But the pain was in his chest, tight and heavy. The fire wouldn't burn without the gas. He wouldn't feel this specific grief without this specific history. He was not separate from the fuel.

  The vertigo hit him then, a sudden drop in the stomach he knew well from panic attacks. If he wasn't the history, and he wasn't separate from the history, what was he? Both? Neither?

  If both, he was a contradiction, burning and unburning simultaneously. If neither, then he was nothing. A ghost standing on a balcony.

  The nihilism whispered in the hiss of the propane. *Nothing exists. You are nothing. The pain is nothing. It doesn't matter.* It was a seductive comfort, a way to numb the loss. If nothing was real, the divorce wasn't real. But the cold was real. The heat on his face was real. To say nothing existed was to lie about the burn on his skin.

  He stared into the mesh. The fire depended on the gas. The gas depended on the tank. The tank depended on the valve. The valve depended on his hand turning it. There was no "fire" hiding inside the tank waiting to get out. There was no "fire" essence floating in the air waiting to land. The fire was only the event of burning. It was a verb masquerading as a noun.

  *And me?*

  He wasn't a thing. He was an event. A happening dependent on the fuel of the moment. The grief was not a sign of his failure; it was the heat of the burning. It proved the connection, not the intrinsic existence of a sufferer.

  The phone in his pocket buzzed. The vibration traveled through his thigh, another aggregate, another sensation.

  He pulled it out. The screen lit up his face: *Mom.*

  For a second, the old solidity tried to return. *I am her son. I am a divorced man. I am a victim.* He felt the weight of those labels, heavy as stones. He looked back at the heater. The flame flickered as a gust of wind hit the balcony. It didn't fight the wind. It moved with it. It didn't claim to be permanent. It just burned while the conditions held.

  If he was empty of intrinsic self, he wasn't trapped. If he wasn't the divorce, he didn't have to carry it forever. If he wasn't separate from it, he didn't have to pretend it didn't hurt.

  He swiped answer.

  "Hey," he said. His voice sounded normal. Rough, but normal.

  "Simon? It's late. Are you okay?"

  He looked at the flame. It was consuming the gas, moment by moment, never staying the same fire for two seconds. It was perfectly functional. It was warming him. It was empty.

  "Yeah," Simon said. He turned the valve down slightly, adjusting the flow. "Just standing outside. Thinking."

  "About what?"

  He watched the orange mesh glow. He could feel the cold on his back and the heat on his front. He was the space between them.

  "Nothing solid," he said. "Hey, do you still have that recipe for the lentil soup? The one Dad made?"

  His mother paused. "Yes. Are you... are you hungry?"

  "Yeah," Simon said. He turned off the heater. The flame died instantly, leaving no trace but the smell of warmed metal. The cold rushed back in, but he was already moving toward the glass door. "I think I am."

  He slid the door open. The apartment was messy, full of boxes that needed packing, bills that needed paying, a life that conventionally existed and demanded attention. None of it was ultimately real, but all of it needed to be done. He walked to the kitchen and picked up a pen. The weight of it was sufficient.
