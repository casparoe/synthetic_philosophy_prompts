answer: |-
  You have hit the nail on the head. Your intuition that this looks like a standard indexing problem (like position in space) is exactly where most physicists and B-theorists part ways with McTaggart. And your guess about the objection is correct: **McTaggart argues that indexing tenses to times merely pushes the contradiction up one level, generating a vicious infinite regress.**

  Since you're a physicist, I'll frame this in terms of coordinate systems and predicates, which usually makes the logical structure clearer than the prose of 1920s idealism.

  ### The Physicist's Intuition (The B-Theory Fix)
  Your instinct is essentially the **B-Theory of Time** (Eternalism). In spacetime terms, you are treating "Past," "Present," and "Future" not as intrinsic monadic properties of an event $E$, but as relational properties between an event $E$ and a time coordinate $t$.

  *   **McTaggart's Contradiction:** $E$ is $P$ (Past) AND $E$ is $N$ (Present) AND $E$ is $F$ (Future). Since $P, N, F$ are mutually exclusive, this is $A \land \neg A$.
  *   **Your Fix:** $E$ is $N$ at $t_1$, $E$ is $P$ at $t_2$, $E$ is $F$ at $t_3$.
  *   **Analogy:** A particle is not "Here" and "There" contradictorily; it is "Here" at $t_1$ and "There" at $t_2$.

  This works perfectly for spatial coordinates. McTaggart's claim is that it fails for temporal coordinates because **time coordinates themselves require A-determinations to be temporal.**

  ### The Regress Step-by-Step
  McTaggart's argument is that you cannot analyze tense (A-series) in terms of time (B-series) without presupposing the very thing you are trying to analyze. Here is the regress, formalized:

  **Step 1: The Initial Contradiction**
  Event $M$ has the properties: Past, Present, Future.
  These are incompatible.
  *Contradiction.*

  **Step 2: The First Indexing (Your Fix)**
  We try to resolve this by saying $M$ does not have these properties simpliciter, but relative to a time $t$.
  *   $M$ is Present at $t_1$
  *   $M$ is Past at $t_2$
  *   $M$ is Future at $t_3$

  **Step 3: McTaggart's Counter-Move**
  McTaggart asks: **What is the status of $t_1$?**
  For $M$ to be *truly* present at $t_1$, $t_1$ itself must be a **present** moment. If $t_1$ is merely a coordinate on a static block (a B-series point), then "Present at $t_1$" just means "Simultaneous with $t_1$." But simultaneity is static. For there to be genuine *passage* (which McTaggart argues is essential to time), $t_1$ must *become* present.

  So, the statement "$M$ is Present at $t_1$" actually means:
  *   $t_1$ is Present.

  **Step 4: The Contradiction Reappears**
  But $t_1$ is a moment in time. Just like event $M$, moment $t_1$ was Future, is Present, and will be Past.
  So now $t_1$ has the properties: Past, Present, Future.
  *Contradiction.*

  **Step 5: The Second Indexing**
  To fix the contradiction for $t_1$, we must index *its* tenses to a second-order time, $t^*$.
  *   $t_1$ is Present at $t^*_1$
  *   $t_1$ is Past at $t^*_2$
  *   $t_1$ is Future at $t^*_3$

  **Step 6: The Regress**
  But now we must ask: **What is the status of $t^*_1$?**
  For $t_1$ to be genuinely present at $t^*_1$, $t^*_1$ must be a present moment. So $t^*_1$ inherits the Past/Present/Future contradiction. We need a third-order time $t^{**}$ to resolve it.
  *   *Ad infinitum.*

  ### Why This Matters for a Physicist
  In Special Relativity, you are used to treating $t$ as a coordinate on a manifold. In that framework, McTaggart's paradox dissolves because you deny the premise that "time requires passage." You accept the B-series as the whole story.

  However, McTaggart's argument is designed to trap anyone who believes **both** that:
  1.  Time is real (events exist).
  2.  Time involves genuine change/passage (the "Now" moves).

  If you try to have both (often called the **Moving Spotlight Theory**), McTaggart argues you are stuck in this regress. You are trying to explain the "movement" of the Now by placing it on a timeline, but the timeline itself requires a "Now" to make it temporal rather than spatial.

  ### Is There a Way Out?
  There are three main exits from the rabbit hole, each with trade-offs.

  #### 1. The B-Theory / Eternalism (The Physicist's Natural Home)
  **Solution:** Deny that the A-series is fundamental. "Past," "Present," and "Future" are not real properties; they are indexical relations (like "here" and "there").
  *   **How it blocks the regress:** It stops at Step 2. It says $t_1$ does *not* need to be "present." $t_1$ just *is*. The feeling of passage is psychological or thermodynamic, not ontological.
  *   **Cost:** You must accept that the "flow" of time is an illusion. This clashes with phenomenology (how time feels) and creates tension with quantum mechanics (the measurement problem often implies a privileged "now").
  *   **Compatibility:** Highly compatible with General Relativity (block universe).

  #### 2. Tense Logic (A.N. Prior's Approach)
  **Solution:** Change the logic. Don't treat "Past" as a predicate $P(x)$ that can be indexed. Treat it as a sentential operator.
  *   Instead of: "It is true at $t_1$ that $M$ is Present."
  *   Say: "It **is** the case that $M$ is Present." (Primitive tense).
  *   **How it blocks the regress:** Prior argues that tenses are primitive and unanalyzable. You don't say "$t_1$ is present"; you say "It is now $t_1$." The "now" is not a property of $t_1$ that needs further indexing; it is the context of utterance.
  *   **Cost:** It requires accepting primitive tensed facts that don't reduce to B-series relations. Many physicists find this ontologically "spooky."

  #### 3. Presentism (Only the Now Exists)
  **Solution:** Deny that past and future events exist. Only present events exist.
  *   **How it blocks the regress:** If only the present exists, $M$ is never Past and Future *and* Present. It is Present, then it ceases to exist. It never holds incompatible properties simultaneously because the past properties belong to non-existent entities.
  *   **Cost:** Terrible compatibility with Special Relativity. If simultaneity is relative, whose "Present" is the real one? You need a preferred foliation of spacetime, which violates Lorentz invariance (unless you go for a neo-Lorentzian interpretation).

  ### Summary
  Your guess was correct. McTaggart's objection to the "successive" fix is that **temporal indexing presupposes the very temporal passage it is meant to explain.**

  *   If $t$ is a B-series coordinate, it doesn't solve the problem because B-series coordinates don't capture "nowness."
  *   If $t$ is an A-series moment, it inherits the contradiction.

  **The Physicist's Escape:**
  Most philosophers of physics side with you. They argue McTaggart proved that **A-properties are incompatible with Relativity**, not that time is unreal. The way out is to accept that the A-series is derivative (a feature of conscious observers or entropy gradients) while the B-series (spacetime manifold) is fundamental.

  McTaggart would call this "denying the reality of time." You would call it "accepting the block universe." The math is the same; the metaphysics is where the rabbit hole continues.
