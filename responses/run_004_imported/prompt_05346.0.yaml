answer: |-
  The console hummed, a low-frequency vibration that Elara felt in her teeth more than she heard. Outside the observation blister of Station Prime, the Dyson swarm glittered—a billion habitats orbiting the star, stretching out into the dark. To the naked eye, it was a static shell. To the sensors, it was an infinite stream of data.

  Elara was the Chief Architect of Allocation. Her finger hovered over the authorization key for Protocol 88-B. The protocol would divert fusion output from the Inner Ring to the Outer Rim. In the Inner Ring, life was comfortable, saturated. In the Rim, a metabolic blight was degrading neural function. Protocol 88-B would cure the Rim but induce chronic scarcity in the Core.

  Standard utilitarian calculus was simple: maximize the sum of utility. $\sum u_i$.

  But the swarm was expanding indefinitely. The population was countably infinite. The utility stream was $(u_1, u_2, u_3, \dots)$.

  Elara ran the simulation. The screen flooded with the difference sequence. Let $d_n$ be the change in utility for habitat $n$ under the new protocol. Some $d_n$ were positive (the saved Rim worlds); some were negative (the starved Core worlds).

  She watched the running total scroll.
  $S_k = \sum_{n=1}^k d_n$.

  At $k=10^6$, the sum was positive. $+4.2 \times 10^9$ utils.
  At $k=10^9$, the sum had dipped negative. $-1.5 \times 10^9$ utils.
  At $k=10^{12}$, it was climbing again.

  Elara frowned. She pulled up the absolute convergence test. $\sum |d_n|$. The value climbed monotonically, piercing the ceiling of the graph, heading for infinity. The series was not absolutely convergent.

  She knew what that meant. She had written her dissertation on this. If a series is conditionally convergent, the Riemann Rearrangement Theorem applies. The positive terms sum to $+\infty$. The negative terms sum to $-\infty$. You have an infinity of saved lives against an infinity of suffering lives.

  And that meant the sum depended entirely on the order of addition.

  "Computer," Elara said, her voice flat. "Re-index the summation by spatial distance from the star."

  The graph recalibrated. The running total stabilized, asymptoting toward a net gain of $+500$ billion utils. The protocol looked good. It looked like a moral obligation.

  "Re-index by population density."

  The graph jerked. The dense Core worlds were counted first. The negative terms dominated the early partial sums. The running total plunged, asymptoting toward $-300$ billion utils. The protocol was now a moral catastrophe.

  "Re-index by chronological founding."

  The line oscillated wildly. It did not converge. It wandered the number line like a drunkard, visiting every value between $-\infty$ and $+\infty$ given enough time. No determinate value whatsoever.

  Elara leaned back, the leather of her chair creaking. This was Bostrom's infinitarian paralysis, realized in hardware. In a finite world, you sum the values, pick the max, and act. In an infinite world where the net utility is a conditionally convergent series, the "total value" of an action is not a property of the action itself. It is a property of the metric you use to count the people affected.

  There was no God's-eye view. There was no natural ordering of the habitats. Space was homogeneous; time was relative. Why should distance from the star matter more than population density? Why should the order of founding dictate moral weight? There was no ethical justification for the indexing, yet the indexing dictated the ethical verdict.

  If she chose the distance metric, she saved the Rim. If she chose the density metric, she saved the Core. Both choices were mathematically defensible. Both choices were mathematically arbitrary.

  The theory she had relied on for twenty years lay silent. The overtaking criterion offered no shelter here. That required one stream to eventually exceed the other and stay there. But the difference stream $d_n$ oscillated forever. The partial sums crossed zero infinitely often. One stream never "overtook" the other; they danced around each other in an eternal, unresolved waltz.

  "Architect Vance," a voice chimed. It was the Liaison from the Rim Coalition. "The blight is accelerating. Neural degradation is at forty percent in Sector 9. We need the power."

  Elara looked at the screen. The $+500$ billion figure glowed green.

  "Architect?"

  "I am evaluating the net impact," Elara said.

  "We know the Core will suffer," the Liaison said. "But the sum total of life must be preserved. That is the mandate."

  *The sum total.* The words tasted like ash. There was no sum total. There was only the sum total *relative to a bijection from $\mathbb{N}$ to the set of habitats*.

  If she authorized the protocol, she was effectively choosing a rearrangement of the series that favored the positive terms. She was deciding that the Rim lives counted "first" in the moral ledger. If she denied it, she was prioritizing the Core.

  But the universe did not count. The universe just *was*. The math was a map, and the map was tearing.

  She thought of the implications. If the net value of any action is undefined, then every action is permissible. Or perhaps no action is permissible. If she can rearrange the consequences of *inaction* to look better than the consequences of *action*, and vice versa, then the choice is formally arbitrary.

  She was not choosing between good and evil. She was choosing a coordinate system.

  "Architect Vance," the Liaison's voice was sharper now. "Sector 9 is reporting cognitive collapse. Children are forgetting their names. Do you have the authorization?"

  Elara's hand trembled. She wanted to find an invariant. Some quantity that remained stable regardless of the ordering. She scanned the ethical subroutines. Density-weighted utility? No, that was just another index. Temporal discounting? Arbitrary. Prioritarianism? Still required a sum.

  She realized, with a cold sinking in her stomach, that she was alone. The mathematics had abdicated. It had told her that in an infinite universe, the concept of "maximizing the good" was ill-posed unless one imposed an artificial structure on the chaos. And imposing that structure was not a mathematical act. It was a political one. It was a violent one.

  To choose an ordering was to decide which infinite subsets of humanity mattered *more* by virtue of being counted earlier. It was to say that proximity to the star was a moral virtue. Or that density was.

  "Architect!"

  Elara closed her eyes. She saw the series in her mind.
  $1 - 1 + 1/2 - 1/2 + 1/3 - 1/3 \dots$
  Zero, if paired. $\ln 2$, if rearranged. Infinity, if grouped differently.
  The lives in the Rim were the positive terms. The lives in the Core were the negative terms.
  She held the pen that would write the parentheses.

  If she did nothing, the Rim died. The sum of that tragedy was infinite.
  If she acted, the Core starved. The sum of that tragedy was infinite.
  Infinity minus infinity was the space where her conscience screamed.

  She knew that whatever she chose, a future ethicist could run the numbers with a different index and prove she was a monster. She was not making a decision that would be validated by the ledger. She was making a decision that would *write* the ledger.

  The paralysis was not that she couldn't move. It was that movement had no vector. Every direction was up; every direction was down.

  "Architect Vance," the Liaison whispered. "Please."

  Elara opened her eyes. The screen still showed the conflicting graphs. The green line ascending. The red line plunging. The black line wandering into the void.

  She understood now why the ancients feared the infinite. It was not the size. It was the silence. The math could describe the cage, but it could not provide the key.

  She moved her hand. She did not move it because the sum was positive. She did not move it because the overtaking criterion was satisfied. She moved it because the children in Sector 9 were forgetting their names, and she could not bear the sound of the silence in her own head any longer.

  She pressed the key.

  The system accepted the input. The power flow shifted. On the screen, the green line continued to rise, validating her choice. She knew that if she toggled the view to 'Density Index', the line would turn red and condemn her.

  She minimized the window. She turned off the monitor.

  The decision was made. The math remained unresolved. And in the quiet of the station, with the infinite stars burning outside, Elara Vance waited for a judgment that would never come.
