          *   Use the term "Instrumental Value." If X is valuable only because it gets you Y, and you have Y, X adds no value.
          *   Why it matters: If we can't explain why knowledge is better, maybe it isn't? That undermines the whole project of epistemology.

      *   *Section 2: The Virtue/Credit Solution.*
