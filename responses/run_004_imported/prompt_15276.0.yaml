      *   **Speaker's Defense Strategy:** Experimental deviations (people passing in Centipede) aren't counterexamples; they just mean CKR didn't hold. Analogy: Arithmetic mistakes don't falsify arithmetic.
      *   **Task:** Draft 9-10 questions for the Q&A session.
      *   **Goal:** Prevent the speaker from simply restating "CKR didn't hold" (the "antecedent failed" defense).
      *   **Specific Requirements:**
          1.  Include a question on *predictive content* (does this make the theorem unfalsifiable?).
          2.  Include a question on *off-equilibrium beliefs* (Reny's worry: if a node is reached that shouldn't be, how do you update?).
          3.  Include a question on *forward induction* (does surviving early rounds signal something?).
          4.  **Crucial Constraint:** Each question must have a short *follow-up* that anticipates the speaker's likely reply and blocks the "antecedent failed" escape route.

  2.  **Deconstruct the Speaker's Position:**
      *   *Core Claim:* CKR $\rightarrow$ BI.
      *   *Defense:* Observed $\neg$BI $\rightarrow$ Observed $\neg$CKR.
      *   *Weakness:* This risks making the theory tautological or vacuous. If *any* deviation is explained away by "they weren't rational/doesn't know I'm rational," the theory predicts nothing about the real world.
      *   *Weakness 2:* It ignores the epistemic dynamics of *learning* during the game. If Player 1 passes, Player 2 learns something. Ignoring this violates rationality (updating on evidence).
      *   *Weakness 3:* It treats rationality as a static property rather than a strategic signal.

  3.  **Drafting Strategy - The "Trap":**
      *   The questions need to escalate. Start with methodological concerns, move to epistemic logic, then to specific game dynamics (forward induction), and end with the normative/practical implication.
