prompt: |-
  I chair my university's Academic Integrity Board, which hears cases of suspected AI-generated coursework based on little more than a detector's probability score and stylistic anomalies flagged by the instructor. The board is split on whether we should demand more of that evidence before finding a student responsible when the mandated sanction is severe, such as dismissal for a repeat offense, than when it is mild, such as resubmission with no notation on the transcript. Some members see this as no different from a court requiring stronger proof before a harsher verdict; others insist that whether a given student actually used AI is a fact about the world that cannot depend on what will happen to them if we rule against them, so letting the sanction shape our confidence threshold corrupts the fact-finding rather than improving it. Draft a short policy memo, to take effect next term, that states whether and how our confidence threshold should track sanction severity, and that answers the second group's objection rather than simply overriding it.
reasoning: |-
  Here's a thinking process that leads to the suggested policy memo:

  1.  **Analyze the Request:**
      *   **Role:** Chair of the University's Academic Integrity Board (AIB).
      *   **Context:** Hearing cases of suspected AI-generated coursework. Evidence is currently weak (detector scores + stylistic anomalies).
      *   **Conflict:** Board is split.
          *   *Group A:* Confidence threshold should scale with sanction severity (like criminal law: "beyond reasonable doubt" for prison vs. "preponderance of evidence" for civil fines).
          *   *Group B:* Truth is objective. Whether a student used AI doesn't change based on the punishment. Adjusting the threshold based on sanctions corrupts fact-finding.
      *   **Task:** Draft a short policy memo for next term.
      *   **Requirements:**
          *   State *whether* and *how* the confidence threshold tracks sanction severity.
          *   Answer Group B's objection (don't just override it).
          *   Tone: Professional, authoritative, nuanced, academic/administrative.

  2.  **Determine the Stance:**
      *   *Option 1: Fixed Threshold.* (Supports Group B). Easier to administer, but risks severe injustice in dismissal cases based on shaky AI evidence.
      *   *Option 2: Sliding Scale.* (Supports Group A). More just, aligns with legal/ethical norms of due process, but requires addressing the "truth is objective" objection.
      *   *Decision:* The sliding scale is the more ethically robust position, especially given the unreliability of AI detectors. However, to satisfy Group B, I need to reframe *what* the threshold represents. It's not changing the *truth*; it's managing the *risk of error* in decision-making under uncertainty. The standard of proof isn't about the fact itself, but about the Board's justification for imposing harm.

  3.  **Address Group B's Objection:**
      *   *Objection:* "Truth is mind-independent."
      *   *Counter-argument:* The Board doesn't decide *truth*; it decides *responsibility* based on *evidence*. We are not omniscient. We are making a risk assessment. When the cost of a false positive (wrongfully punishing a student) is high (dismissal), we require higher certainty to minimize that risk. This doesn't change the past fact; it changes our tolerance for error in declaring that fact.
      *   *Analogy:* Medical diagnosis. We require more testing before surgery (high risk) than before prescribing aspirin (low risk), even though the underlying condition is the same.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the context (AI cases) and the Board's deliberation.
      *   **Policy Statement:** Clearly state the new rule. Sliding scale based on sanction severity.
      *   **Rationale (Addressing the Objection):** This is the core. Explain *why* this isn't epistemic corruption.
          *   Distinguish between *ontological truth* (did they do it?) and *procedural justification* (are we sure enough to act?).
          *   Focus on the *consequences of error*.
          *   Reference the limitations of AI detection tools (false positives).
      *   **Implementation:** Define the tiers (e.g., "Preponderance" for minor, "Clear and Convincing" or "High Confidence" for major).
      *   **Closing:** Commitment to fairness.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Clear and Convincing" too legalistic?
      *   *Fix:* Use descriptive terms related to confidence levels, but anchor them in sanction tiers.
      *   *Critique:* Did I really answer Group B?
      *   *Fix:* Make sure to explicitly state that we aren't saying the *fact* changes, but rather our *warrant to act* changes. Use the phrase "epistemic humility."
      *   *Critique:* Is the tone right?
      *   *Fix:* Ensure it sounds like a policy directive, not a philosophical essay, but one grounded in principle.

  6.  **Final Polish:**
      *   Check word count (keep it "short").
      *   Ensure the AI detector limitation is mentioned as a practical reason supporting the philosophical one.
      *   Make sure the "next term" effective date is clear.

  7.  **Final Review against constraints:**
      *   States whether/how threshold tracks severity? Yes.
      *   Answers Group B's objection? Yes.
      *   Short policy memo format? Yes.

  *(Self-Correction Note: Make sure not to sound like I'm dismissing AI detectors entirely, but acknowledging their probabilistic nature requires procedural safeguards.)*

  8.  **Drafting the Content:** (Mental outline of the specific phrasing for the "Group B" rebuttal).
      *   "We are not altering reality."
      *   "We are calibrating our tolerance for wrongful harm."
      *   "The standard of proof is a function of risk management, not truth-making."

  9.  **Finalizing the Text:** (Proceed to generate output based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board Members
  **FROM:** Chair, Academic Integrity Board
  **DATE:** October 26, 2023
  **SUBJECT:** Policy Update: Standards of Proof and Sanction Severity in AI-Related Cases

  **Effective Date:** Start of Next Term

  **Purpose**
  This memo establishes a revised framework for evaluating evidence in cases involving suspected AI-generated coursework. Following recent deliberations regarding the reliability of detection tools and the gravity of potential sanctions, the Board is adopting a tiered standard of proof.

  **Policy Directive**
  Effective next term, the Board's required confidence threshold for finding a student responsible shall correlate with the severity of the potential sanction.

  1.  **Low-Stakes Sanctions** (e.g., resubmission, grade reduction on assignment, no transcript notation): Findings will be based on a *Preponderance of Evidence* standard. It must be more likely than not that academic misconduct occurred.
  2.  **High-Stakes Sanctions** (e.g., course failure, suspension, dismissal, permanent transcript notation): Findings will require *Clear and Convincing Evidence*. The Board must possess a high degree of certainty that misconduct occurred, acknowledging that detector scores and stylistic flags alone are insufficient for this threshold without corroborating evidence (e.g., draft history, oral defense, metadata).

  **Rationale and Epistemic Justification**
  This policy addresses the concern that linking our confidence threshold to sanction severity conflates punishment with truth. It is correct that whether a student used AI is an objective fact independent of our proceedings. However, the Board does not decide objective truth; it decides *institutional action* under conditions of uncertainty.

  AI detection tools are probabilistic, not deterministic. They measure likelihood, not fact. Therefore, every Board decision carries a risk of error (false positive). When the cost of a false positive is low (a chance to resubmit), a lower confidence threshold is an acceptable risk management strategy. When the cost of a false positive is high (dismissal), the same level of uncertainty becomes ethically untenable.

  Adjusting the threshold does not alter the past fact of whether AI was used; it alters our *warrant to inflict harm* based on imperfect data. This is not epistemic corruption; it is epistemic humility. It ensures that the certainty required to justify a life-altering sanction is proportionate to the fallibility of our evidence.

  **Implementation**
  Case managers will categorize potential sanctions at the outset of hearings. If evidence supports only the lower threshold, severe sanctions are precluded, regardless of the violation's nature.

  We must balance integrity with justice. This policy ensures that our pursuit of the one does not compromise the other.
