answer: |-
  **Setting:** *A university philosophy department office, late afternoon. Rain streaks the window. Two folders lie open on the desk: Proposal A (Chimpanzee) and Proposal B (Human Subject). Elena sits behind the desk; Marcus leans against the bookshelf, holding a mug of cold coffee.*

  **Elena:** I've made my decision, Marcus. Proposal A is approved. Proposal B is rejected.

  **Marcus:** I knew you'd say that. And I know exactly which page of *Anarchy, State, and Utopia* you're standing on. "Utilitarianism for animals, Kantianism for people." You're willing to aggregate the chimpanzee's pain against the future benefits, but you won't touch the human subject, even though the pain is identical and the payoff is the same.

  **Elena:** It's not just a reflex, Marcus. It's Nozick's distinction. Side constraints exist to protect the capacity to shape a life according to an overall conception. Humans are the bearers of this capacity. Animals, even sophisticated ones like this chimp, are not. We maximize utility regarding them; we respect rights regarding persons.

  **Marcus:** But look at the subject in Proposal B. Stipulation one: profound, permanent cognitive disability. Stipulation two: never able to form, revise, or live by an overall conception of their life. You just recited the Nozickian ground for side constraints, and then you applied it to a being who, by your own admission in the file, lacks that ground. If the *capacity* is the truth-maker for the right, and the capacity is absent, the right vanishes. If you approve A, logic demands you approve B.

  **Elena:** Logic demands consistency, yes. But morality demands we look at the kind of being we are dealing with. Nozick himself pulled back from the "too minimal" hybrid view. He sensed that drawing the line strictly at the exercise of rational agency was dangerous. This human subject belongs to a kind—a species—where the *norm* is the capacity for meaning-making. We protect the outliers to honor the capacity itself.

  **Marcus:** That's a "protective perimeter" argument. It's pragmatic, not principled. You're essentially saying we lie about this individual's moral status to protect the status of others. But if we are being honest about the *individual* suffering in front of us, the chimp and this human are in the same boat. They both feel pain. Neither can conceptualize the sacrifice. If you say the chimp's pain can be outweighed by the aggregate good, you've conceded that pain is commensurable. So why is this human's pain incommensurable?

  **Elena:** Because the human is a *subject of a life* in a way that commands a different sort of recognition, even if the cognitive lights are dim. Nozick conceded in his Regan review that animals have inherent value, just less than persons. But he also admitted species membership alone is weak. I'm trying to find a middle ground. If we allow Proposal B, we instrumentalize a human being. We treat a member of the moral community as a tool. That corrodes the community itself.

  **Marcus:** I'll grant you this: the corrosion argument has force. If we start vivisecting disabled humans, even for good causes, the social fabric tears. The *symbolic* value of human inviolability is immense. I concede that. If your argument were purely about social stability, I might pause. But you're framing it as a matter of *justice*, of what this individual is owed. And on justice, you're inconsistent. You're letting the chimp suffer because it lacks the "conception of a life." You admit the human lacks it too. So if you block B, you must block A. If you can't block A, you have no ground to block B.

  **Elena:** I can't block A, Marcus. The suffering is substantial, but the payoff spares *many* others from comparable suffering. To forbid A is to privilege the chimp's interest over the aggregate welfare of the community it belongs to. That's the utilitarian calculus for non-persons. But with the human... look, I'll concede something to you. Relying on "species normativity" is shaky. If I'm honest, the "conception of a life" criterion *does* fail to protect this specific human subject. Nozick knew this. That's why he was uneasy. I am conceding that my justification for blocking B is not as clean as the justification for blocking a standard adult human. It relies on a fuzzy boundary of "kind" rather than a sharp boundary of "capacity."

  **Marcus:** Thank you for that honesty. It's the "marginal cases" problem, and it bites hard. But here is where I need you to press me. If I push for consistency, and I say "Approve B," I run into a wall.

  **Elena:** Go on.

  **Marcus:** If I argue that B should be approved because it's consistent with A, I have to live with the intuition that we are treating a human being as a mere resource. Even if I argue metaphysically that the "sacredness" of human life is a superstition, practically, eroding the principle that humans are inviolable is catastrophic. I concede that your "protective perimeter" isn't just a lie; it's a necessary bulwark. If we decide B based strictly on the capacity metric, we risk sliding into a world where *any* deficit in rationality reduces your right to life. I don't want to live in that world. So, I concede that the *social meaning* of blocking B has moral weight, even if the *individual metaphysics* of the subject doesn't support it.

  **Elena:** So you admit there's a reason to block B, even if your consistency argument says otherwise?

  **Marcus:** I admit there's a pragmatic, quasi-deontological reason to block B. But Elena, that pragmatic reason applies to the chimp, too, just less strongly. The chimp has social bonds, memory, problem-solving. If we protect the disabled human because of their place in a social web, why does the chimp's social web count for nothing?

  **Elena:** Because the human social web is constituted by meaning-makers. We owe it to *ourselves* to protect all humans. We don't owe it to the chimps to treat them as persons, because they cannot participate in that normative community. But here is where I feel the tension you're pointing at. If I approve A, I am saying that for beings without the "conception of a life," pain is just a negative utility to be balanced. If the human in B lacks that conception, and I say their pain is *not* just a negative utility... I am effectively saying species membership *does* matter morally in itself. And Nozick said that was weak.

  **Marcus:** It is weak. It's speciesism, dressed up as "kind-relative norms."

  **Elena:** Perhaps. But consider the alternative. If we adopt your consistency, and we approve B... we have validated the principle that humans can be sacrificed for the aggregate. Once that principle is validated, the "protective perimeter" collapses. The disabled human is safe today because we say "never." If we say "only when the utility isn't high enough," they are never safe. I am willing to bear the charge of inconsistency to preserve the absolute prohibition.

  **Marcus:** And I am willing to bear the charge of harshness to preserve moral integrity. But let's look at Proposal A again. You approved it. You said the chimp's suffering is outweighed. But if you concede that the chimp has rich social bonds and memory—if it has *inherent value*, as Nozick later conceded—does the aggregate payoff *really* clear the bar? Nozick called the hybrid view "too minimal." Maybe he was right. Maybe the side constraints should extend further than you're willing to let them.

  **Elena:** I worry about that. If I extend side constraints to the chimp, I block A. If I block A, I let the future suffering happen. I am prioritizing the integrity of the one over the welfare of the many. For humans, I accept that trade-off. For animals, I don't. Is that arbitrary?

  **Marcus:** It is arbitrary if the *capacity* is the only metric. But if the *relationship* is the metric... If you concede that the "kind-relative" argument is weak metaphysically, you have to admit it's doing all the work emotionally. You're blocking B because it feels like murder, and approving A because it feels like veterinary triage.

  **Elena:** I'll concede that. The emotional resonance is different. And perhaps moral theory shouldn't completely override that resonance if it serves a protective function. But Marcus, if you insist on consistency, you force me to choose: either I become a utilitarian about humans, or a rights-viewist about animals.

  **Marcus:** Exactly. And if you become a rights-viewist about animals, Proposal A gets blocked. The chimp's interest in not being tortured cannot be traded away.

  **Elena:** And if I become a utilitarian about humans, Proposal B gets approved. The disabled subject's pain is weighed against the future good.

  **Marcus:** Which is it?

  **Elena:** *She looks at the two files, then pushes Proposal B away.* I cannot approve B. I cannot sign off on using a human being as a means, regardless of their cognitive state. The cost to our moral self-conception is too high. I accept the charge of inconsistency.

  **Marcus:** *He picks up Proposal A.* And I cannot approve A, if I cannot approve B. If the suffering is identical, and the justification for protection fails in both cases, I cannot let the chimp suffer simply because it lacks a human passport. I would block A.

  **Elena:** So we agree on the outcome for B. We block it.

  **Marcus:** We do. But for different reasons. You block it because it's human. I block it because if we block it, we must block A, and I think we should block A.

  **Elena:** No, that's not right. You block B to be consistent with A. I block B to preserve the sanctity of the human. But... *she pauses*... I hear your point about the chimp. If I admit the "capacity" argument doesn't cover the disabled human, I have to admit it doesn't cover the chimp either. So the only thing protecting the human is the "human" label.

  **Marcus:** And the only thing condemning the chimp is the lack of it.

  **Elena:** It leaves me uncomfortable. Nozick was right to call it "too minimal." It feels like we're leaving the chimp out in the cold to keep the human house warm.

  **Marcus:** And it leaves me uncomfortable because if I follow the logic to its end, I have to tell the public that we should be willing to experiment on the disabled if we experiment on chimps. That's a truth I'm not sure society can digest without poisoning itself.

  **Elena:** So we're at an impasse. I'll block B, and I'll approve A.

  **Marcus:** And I'll recommend rejecting both. But Elena?

  **Elena:** Yes?

  **Marcus:** If you approve A, don't pretend it's because the chimp matters less. Admit it's because we value our own kind more.

  **Elena:** And Marcus? If you reject A, don't pretend it's because the chimp is a person. Admit it's because you're unwilling to accept the cost of consistency on B.

  **Marcus:** *He smiles faintly.* Fair enough. I'll write up the dissent on A. You write the approval.

  **Elena:** And we both sign the rejection on B.

  **Marcus:** On that, at least, we agree.

  *Marcus sets the mug down. Elena closes the folder on Proposal B. The rain continues to fall outside, blurring the line between the garden and the street.*
