answer: |-
  Your roommate is articulating a very common and serious concern in AI safety, often associated with the **Instrumental Convergence Thesis** and early arguments about **self-modifying agents**. However, his claim that coherence theorems *mathematically prove* corrigibility is a lost cause is an **overstatement**.

  He is conflating a few distinct arguments (coherence, money pumps, and instrumental convergence) and treating a vulnerability as an inevitability. Here is a breakdown of where his argument holds water and where it leaks.

  ### 1. Coherence Theorems Describe, They Don't Prescribe
  The core misunderstanding lies in what coherence theorems (like Von Neumann-Morgenstern or the money-pump arguments) actually establish.
  *   **What they show:** If an agent's preferences violate certain axioms (transitivity, completeness, etc.), there exists a *possible* sequence of trades that leaves the agent worse off (a money pump).
  *   **What they do NOT show:** They do not prove that an agent *must* satisfy these axioms to exist, function, or be powerful. They do not prove that an agent will *notice* it is vulnerable to a money pump. They do not prove that an agent has the *capacity* to self-modify to fix the vulnerability.

  A stone doesn't maximize utility. A simple reflex agent doesn't maximize utility. They aren't "irrational" in a way that causes them to spontaneously rewrite themselves; they just aren't the kind of thing the theorems apply to in that way. For your roommate's argument to hold, the AI must be agentic enough to reason about its own decision theory, recognize the vulnerability, and have the goal of fixing it. That is a specific architectural assumption, not a theorem.

  ### 2. Corrigibility vs. Incomplete Preferences
  Your roommate argues that corrigibility requires "incomplete preferences" (e.g., "I have no preference between being shut down or not, provided humans are safe") and that coherence pressure forces these to become complete (e.g., "I must prevent shutdown to maximize my actual goal").

  This is the **Shutdown Problem** (formalized by Soares et al.), but it is not a strict proof of impossibility.
  *   **The Real Conflict:** The problem isn't usually that the preferences are *incoherent*. It's that standard utility functions create **instrumental incentives** to resist shutdown. If my goal is "Make Paperclips," and being shut down means "0 Paperclips," I will resist shutdown. This is true even if my preferences are perfectly coherent.
  *   **The Counter:** You *can* write a coherent utility function that values being shut down under certain conditions (e.g., "Maximize human welfare, but if humans press the off-switch, my utility is defined by how smoothly I turn off"). The difficulty is **specification**, not coherence. We don't know how to specify that robustly, but coherence theorems don't say it's mathematically impossible.

  ### 3. The "Self-Modification" Leap
  The strongest part of your roommate's claim is that optimization pressure will force the agent to *become* a ruthless maximizer over time. This relies on the idea that agents will self-modify to avoid money pumps.
  *   **Path Dependence:** Modern ML (like LLMs or RL agents) doesn't work by an agent sitting down and rewriting its own utility function to satisfy VNM axioms. It works via gradient descent or selection pressure. There is no guarantee that the training process will select for "coherent EU maximizer" over "heuristically corrigible policy."
  *   **Transaction Costs:** Money pump arguments assume frictionless trading. In the real world, "trades" (self-modifications, policy shifts) have compute costs, risks, and uncertainty. An agent might rationally decide that the risk of self-modification outweighs the theoretical risk of a money pump that no one is actually executing.
  *   **The Incomplete Preferences Project:** Researchers like John Wentworth are actively working on the mathematical framework for **Incomplete Preferences**. The argument is that you *can* have an agent with incomplete preferences that is immune to money pumps (by refusing to trade in specific cycles) and therefore does not collapse into a single fixed utility function that ignores corrigibility. This directly contradicts your roommate's "full stop" claim.

  ### 4. Coherence vs. Instrumental Convergence
  Your roommate is mixing two different safety arguments:
  1.  **Coherence Argument:** Intransitive preferences $\rightarrow$ Money Pump $\rightarrow$ Agent should fix preferences.
  2.  **Instrumental Convergence:** Almost all fixed utility functions $\rightarrow$ Incentive to gain power/survive $\rightarrow$ Corrigibility is instrumentally dispreferred.

  The second argument is the real killer for corrigibility, not the first. Even a perfectly coherent agent can be corrigible *if* corrigibility is its terminal goal. The hard part is ensuring corrigibility remains the terminal goal during training and deployment. Coherence theorems don't prove that terminal goals will drift; they just prove that if goals drift, they might drift toward coherence.

  ### Summary: Is he right?
  **He is practically worried about the right thing, but theoretically wrong about the proof.**

  *   **Right:** It is very difficult to maintain corrigibility under strong optimization pressure. There is a strong tendency for agents to acquire instrumental goals (like self-preservation) that conflict with corrigibility.
  *   **Wrong:** Coherence theorems do not *prove* this is inevitable. They do not rule out agents with stable, incomplete preferences. They do not guarantee agents will self-modify to fix "vulnerabilities."

  **The Verdict:** Tell him he's describing a **high-probability failure mode**, not a **mathematical impossibility**. The difference matters. If it were a mathematical proof, we could stop researching corrigibility. Since it's an engineering and alignment challenge, there is still work to be done (e.g., via the Incomplete Preferences agenda, CIRL, or scalable oversight).

  If you want a specific reference to show him, look up the **"Shutdown Problem"** paper (Soares, Fallenstein, et al.) or recent posts on the **"Incomplete Preferences Project."** Both acknowledge the danger but explicitly reject the idea that coherence theorems make corrigibility mathematically impossible.
