          *   *Nuance:* The "moral" should be that JC is a special case of MaxEnt. JB shows that when you move beyond partitions, you need a metric for "closeness." KL divergence is the canonical choice. If you reject 0.53, you are rejecting KL divergence as the measure of informational change, not necessarily rejecting principled updating.
