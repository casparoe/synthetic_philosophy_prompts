answer: |-
  This is a fantastic question. You have hit on one of the most persistent friction points between decision theory (and behavioural ecology) and the philosophy of action.

  The short answer is: **You are right to be suspicious.** Standard hyperbolic discounting and Aristotelian akrasia are formally distinct phenomena, though they often look identical from the outside. Hyperbolic discounting explains *why* the temptation arises; Aristotelian akrasia describes a specific structural failure of agency *in response* to that temptation.

  Richard Holton's intervention is largely an attempt to bridge this gap by shifting the definition of weakness of will away from "judgment" (where the economists and Aristotle clash) and toward "resolution" (which fits the ecological reality of planning).

  Here is an explanation of the mismatch, the philosophical stakes, and where Holton fits in, tailored to your background.

  ### 1. The Hyperbolic Discounter (The Ecologist's View)

  As you know, in the Strotz/Ainslie model, the agent is a sequence of temporal selves.
  *   **Self at $T_{-1}$ (Yesterday):** Prefers the large reward later. Plans to wait.
  *   **Self at $T_{0}$ (Now):** The delay to the small reward is zero. The discount curve spikes. The subjective value of the small reward now exceeds the discounted value of the large reward later. Self at $T_{0}$ chooses the small reward.

  Crucially, in this model, **Self at $T_{0}$ is not making a mistake.** Relative to its own discount function at that specific moment, it is maximizing utility. There is no internal contradiction at the moment of action. The "irrationality" is diachronic (across time), not synchronic (within the moment).

  From the starling's perspective: At the moment of pecking, the worm in the beak *is* the highest value option. The bird does not peck while thinking, "I really should wait for the bigger one." It pecks because, in that instant, it wants the immediate worm more.

  ### 2. The Aristotelian Akrat (The Philosopher's View)

  Aristotle (and later Donald Davidson) defines *akrasia* much more narrowly. It is not merely doing what is objectively worse for you. It is acting against your **all-things-considered judgment** at the moment of action.

  For Aristotle, the akratic agent holds two things simultaneously at $T_{0}$:
  1.  **Judgment:** "All things considered, waiting for the bigger worm is the best course of action."
  2.  **Action:** Eats the small worm.

  This creates a logical puzzle that doesn't exist in the discounting model. If the agent truly judges that Waiting is Best, and agents generally pursue what they judge Best, how do they choose Eating?

  Davidson argued that for this to happen without the agent being simply insane, the mind must be partitioned. One part of the mind holds the judgment ("Waiting is best"), and another part drives the action ("Eat now"), without the two communicating fully. If they communicated fully, the contradiction would force a resolution (either change the action or change the judgment).

  **The Mismatch:**
  *   **Hyperbolic Discounting:** The judgment *changes*. At $T_{0}$, you judge the small reward is better. No contradiction.
  *   **Akrasia:** The judgment *persists*. At $T_{0}$, you judge the large reward is better, but you take the small one. Contradiction.

  So, a pure hyperbolic discounter is **not** an akratic in Aristotle's sense. The discounter simply changes their mind when the time horizon shifts. The akratic keeps their mind on the long term but fails to move their body accordingly.

  ### 3. Why the Distinction Matters

  If we accept the hyperbolic model as the whole story, "weakness of will" disappears. It just becomes "preference reversal." There is no weakness, just a change in valuation parameters based on temporal proximity.

  But this violates our intuitive sense of agency (and Aristotle's). We feel that when we eat the cake, we are violating a standard we still endorse. We don't just think, "Oh, cake is now more valuable than health." We think, "Health is more valuable, damn it, but I'm eating the cake anyway."

  The economic model captures the *pressure* of the temptation (the shape of the curve), but it doesn't capture the *normative conflict* (the feeling of violating a rule).

  ### 4. Enter Richard Holton: Resolutions vs. Judgments

  This is where Richard Holton (in *Willing, Wanting, Waiting*) makes his move. He realizes that the "Judgment" model (Aristotle/Davidson) is too brittle. It requires the agent to hold a contradictory belief at the moment of action, which is psychologically rare. Most people, when they succumb, convince themselves "Just this once won't hurt" (changing the judgment).

  Holton argues that weakness of will is not about acting against a **judgment**; it is about failing to stick to a **resolution**.

  *   **Judgment:** A belief about what is best *right now* (e.g., "This worm is best"). This is fluid and changes with discounting.
  *   **Resolution:** A commitment to a plan of action intended to stabilize behavior over time (e.g., "I will not peck at worms before noon").

  **Holton's Synthesis:**
  We are hyperbolic discounters. We know our future selves will have different preferences than our current selves (the starling knows its future self will be impulsive). To counteract this, we form **resolutions**. A resolution is a psychological tool to "lock in" the preference of the far-sighted self ($T_{-1}$) against the impulsive self ($T_{0}$).

  For Holton, you are weak-willed not if you change your judgment (that's just updating), but if you **abandon a resolution without a good reason.**

  ### 5. Putting it together: The Ecologist's Translation

  Here is how you can map this back to your reading group and your background:

  1.  **Hyperbolic Discounting is the Ecology:** It describes the environment of the mind. Resources close at hand have high marginal utility. This creates the *risk* of preference reversal. This is the "physics" of the situation.
  2.  **Aristotelian Akrasia is the Pathology:** It describes a specific failure where the agent recognizes the long-term good *at the moment of choice* but fails to enact it. This is hard to model economically because it looks like a glitch in the maximization algorithm.
  3.  **Holton is the Adaptation:** He suggests that "Willpower" is a mechanism evolved (or learned) to manage the hyperbolic discounting problem. We form resolutions (like a pre-commitment device) to prevent our future selves from succumbing to the discount curve.

  **So, is the hyperbolic discounter an akratic?**
  *   **Strict Aristotle/Davidson:** No. The discounter changes their judgment. The akratic does not.
  *   **Holton:** The discounter *becomes* weak-willed if they had formed a resolution to counteract the discounting and then abandoned it.

  **Example:**
  *   **Scenario A:** You plan to save money. When you see the shoes, you think, "Actually, shoes are more important than savings right now," and buy them.
      *   *Economic view:* Preference reversal (Hyperbolic).
      *   *Aristotle:* Not akrasia (Judgment changed).
      *   *Holton:* Weakness of will (You broke your resolution to save, even if you justified it).
  *   **Scenario B:** You plan to save money. When you see the shoes, you think, "I really should save, this is stupid," and buy them anyway.
      *   *Economic view:* Hard to model (Why maximize against your own utility function?).
      *   *Aristotle:* Pure Akrasia.
      *   *Holton:* Weakness of will (Broken resolution + persistent judgment).

  ### Summary for the Reading Group

  You can tell your group that the economists (and behavioural ecologists) have solved the **mechanism of temptation** (hyperbolic discounting explains why the immediate option pulls so hard), but they haven't solved the **puzzle of agency** (how we act against our own active judgments).

  Aristotle and Davidson are obsessed with the puzzle of agency: How can I be the author of an action I disown at the moment of doing it?

  Holton suggests the economists and the philosophers were talking past each other. The economists were looking at *preference instability* (which is normal for hyperbolic discounters). The philosophers were looking at *normative instability* (breaking commitments). Holton says weakness of will is about the commitments (resolutions), which allows us to keep the economic model of discounting while saving the philosophical intuition that we are responsible for our failures.

  In short: **Discounting explains the urge; Akrasia describes the surrender; Holton explains the contract we broke when we surrendered.**
