answer: |-
  **MEMORANDUM**

  **TO:** Full ASB Council
  **FROM:** Constitution Committee
  **DATE:** October 23, 2023
  **SUBJECT:** Decision on Proposal 23-04: Voter Competency Quiz

  **RECOMMENDATION:**
  The Constitution Committee recommends that the Full Council **ADOPT WITH CHANGES** the proposal submitted by the Elections Chair regarding voter education.

  While the Committee agrees with the goal of increasing voter knowledge, we cannot support conditioning the right to vote on passing a test. Therefore, the recommendation is to **adopt the educational component** of the proposal but **remove the quiz as a precondition for casting a ballot.**

  **BACKGROUND:**
  Elections Chair [Name] proposed a requirement that all students must pass a 10-question quiz on ASB officer duties before receiving a ballot for the Presidential election. The stated goal is to address low turnout (approx. 20%) and reported low voter literacy regarding ASB roles.

  During committee review, the ASB Advisor raised a significant historical and ethical concern: conditioning voting rights on passing a test parallels the "literacy tests" used during the Jim Crow era to disenfranchise marginalized voters. The Elections Chair argued the proposal is distinct because the quiz is retakeable, specific to student government, and intended to educate rather than exclude.

  **COMMITTEE ANALYSIS:**
  The Committee debated this proposal extensively. We recognize the Elections Chair's intent is to strengthen our democracy by ensuring voters are informed. An uninformed electorate is a valid concern. However, the Committee must also weigh the mechanism used to solve this problem against our constitutional values and historical context.

  **1. Engagement with the Literacy Test Comparison**
  The Committee takes the Advisor's comparison seriously. While the *intent* of this proposal differs from Jim Crow-era laws, the *mechanism* creates a similar structural barrier.
  *   **Barrier to Entry:** Historically, literacy tests were not just about knowledge; they were about administrative hurdles. Even with retakes, requiring a student to stop, complete a task, and achieve a passing score before accessing a ballot creates friction. In any system, friction disproportionately affects students with less time, less access to study materials, or higher anxiety levels.
  *   **The Right to Vote:** In a democratic system, the right to vote should be unconditional. By making the ballot contingent on a test score, we risk establishing a precedent that voting is a privilege earned through testing rather than a right held by all members of our school community.
  *   **Distinction:** We acknowledge the Chair's argument that this quiz is retakeable and specific to ASB. However, the Committee finds that these safeguards do not fully neutralize the risk of disenfranchisement. A student who fails to pass due to language barriers, learning differences, or absence on test days could effectively be silenced.

  **2. Addressing the Root Problem**
  We agree with the Chair that voter apathy and lack of knowledge are problems that need solving. However, the solution should be **education, not exclusion.** We should aim to lift voters up rather than filter them out.

  **PROPOSED CHANGES:**
  To balance the need for education with the protection of voting rights, the Committee proposes the following amendments to the original motion:

  1.  **Decouple Education from Enfranchisement:** The quiz (or a "Voter Readiness Module") will be administered during Advisory/Homeroom the week *prior* to the election. **Completion is mandatory for all students, but passing is not a requirement to receive a ballot.** No student will be turned away from the voting booth based on quiz performance.
  2.  **Data-Driven Outreach:** Quiz results will be anonymized and used to identify which grades or classrooms need targeted ASB presentations. If a specific grade level scores low on "Treasurer Duties," the ASB will host a targeted info session for that grade.
  3.  **In-Booth Education:** Instead of a quiz at the booth, a 60-second informational video looping on screens in the voting line will summarize the roles of each officer. This ensures every voter is exposed to the information without creating a barrier to entry.

  **CONCLUSION:**
  The Constitution Committee believes we can achieve the Elections Chair's goal of an informed student body without compromising the integrity of our voting process. By shifting from a *barrier* model to an *engagement* model, we protect every student's right to participate while still prioritizing civic education.

  We move that the Full Council adopt Proposal 23-04 with the amendments listed above.

  **Respectfully Submitted,**

  [Your Name]
  Sophomore Representative, Constitution Committee
  [Co-Chair Name, if applicable]
  Constitution Committee
