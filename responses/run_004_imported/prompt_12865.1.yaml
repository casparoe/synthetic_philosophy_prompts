  **Sidebar: The Case for the "Ethical Health" Reading of Hegel on War**

  The standard defense of Hegel—that he is merely a "structural realist" noting the inevitability of conflict in an anarchic international system—relies on isolating his comments on International Law from his broader theory of the State. When read within the full architecture of the *Philosophy of Right*, the text supports a stronger, more disturbing thesis: War is not just an external inevitability for Hegel; it is an internal ethical necessity.

  Here is the textual case that the "prudential" gloss does not survive contact with Hegel's actual arguments.

  **1. The Hygiene Argument (§324 Addition)**
  The most famous passage in this section is Hegel's remark that "just as the blowing of the winds preserves the sea from the foulness which would be the result of a prolonged calm, so also corruption in nations would be the product of prolonged, let alone 'perpetual,' peace."
  *   **The Realist Gloss:** This is a metaphor for political stagnation.
  *   **The Textual Reality:** This is a claim about moral pathology. Hegel is not saying peace is impossible (a prudential claim); he is saying peace is *foul* (an ethical claim). If war were merely a regrettable necessity caused by external anarchy, Hegel would welcome Kant's Perpetual Peace as an ideal, even if unattainable. Instead, he rejects the ideal itself. The "calm" is not just a lack of conflict; it is a condition that actively breeds corruption. The function of war here is not defense, but purification.

  **2. The Critique of the "System of Needs"**
  For Hegel, Civil Society (*bürgerliche Gesellschaft*) is the realm of atomization, where individuals relate to one another through contract, self-interest, and the accumulation of property. It is the "system of needs." Left to itself, Civil Society tends toward a kind of soft corruption where citizens view the State merely as an instrument to secure their private ends.
  *   **The Move:** War interrupts this transaction. In the *Philosophy of Right*, Hegel distinguishes between the sacrifice of *property* (which is external to the self) and the sacrifice of *life* (which is the totality of the self).
  *   **The Implication:** By demanding the sacrifice of life, the State reveals that it is not a contract for mutual protection (a Civil Society concept) but an ethical substance in which the individual finds their higher freedom. If there is no possibility of war, the State collapses functionally into a large municipality—a service provider for private ends. War is the moment the citizen is reminded that they belong to the Whole. This work is done *internally*, regardless of the external threat level.

  **3. Sovereignty as Actuality, Not Just Status**
  The standard reading treats sovereignty as a legal status that states hold. For Hegel, sovereignty is an *actuality* that must be manifested. In §322, Hegel argues that the "ideality" of the state's spheres of law is actualized in sovereignty.
  *   **The Move:** This actualization requires a negative relation to an other. Just as an individual achieves self-consciousness through recognition by another consciousness, the State achieves its ethical solidity through the negation of another State.
  *   **The Implication:** A state that faces no genuine enemies is not a "lucky" state; it is an abstract state. Its sovereignty is theoretical rather than actual. The "possibility of war" is not a bug in the system; it is the defining feature that gives the State its ethical weight. Without the genuine risk of negation, the State's demand on the citizen loses its seriousness.

  **4. The "Formal" Moment of Courage**
  Hegel describes military courage not as the courage of a predator or a fanatic, but as "formal" courage—the willingness to surrender one's actuality for the sake of the universal.
  *   **The Move:** This virtue cannot be cultivated in peace. In peace, courage is simulated or directed toward private gain (economic risk). True ethical courage, for Hegel, is specific to the relation between the individual and the State in the face of death.
  *   **The Implication:** If war were merely a defensive necessity, courage would be a contingent virtue needed only when attacked. For Hegel, it is a structural component of ethical life (*Sittlichkeit*). A world without war is a world without the possibility of this specific form of ethical freedom.

  **Conclusion: The Logical Endpoint**
  The "Realist" reading assumes Hegel is describing a tragedy: *We would like peace, but anarchy prevents it.* The text suggests Hegel is describing a dialectical requirement: *We cannot have peace, because the concept of the State requires the possibility of its own negation to remain actual.*

  If Hegel is right about the internal function of war—breaking the stagnation of civil society and actualizing sovereignty—then a state facing no external threats faces an internal crisis. It must either find a functional equivalent to war (a demand for ultimate sacrifice without the external enemy) or succumb to the "foulness" of the calm. This makes Hegel not merely a realist about international anarchy, but a theorist of the ethical utility of conflict.
