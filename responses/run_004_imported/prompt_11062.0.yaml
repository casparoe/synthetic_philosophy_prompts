          *   Focus on the game theory. It's a separating equilibrium.
          *   The LQ *could* physically produce the signal, but chooses not to because the cost outweighs the benefit *for them specifically*.
          *   The HQ produces it because the benefit outweighs the cost *for them*.
          *   This is about *marginal* trade-offs. The "handicap" is the barrier to entry for the LQ, not necessarily a burden for the HQ.

