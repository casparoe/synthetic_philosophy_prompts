      *   **Core Claim to Argue:** The revisionist reading is correct. Cost (in Zahavi's original sense of absolute waste/reduction in fitness) is neither necessary nor sufficient for honest signaling. The real mechanism is *differential marginal cost* (or benefit) across signaller qualities.
      *   **Key Explanations Needed:**
          *   Explain why cost isn't necessary (signals can be cheap/free at equilibrium).
          *   Explain why cost isn't sufficient (cost alone doesn't stop bluffing without differential costs).
          *   Explain the role of the incentive structure (marginal costs/benefits).
          *   Address the "misnomer" objection (if it's not a handicap, why call it that?).

  2.  **Initial Knowledge Retrieval & Structuring:**
