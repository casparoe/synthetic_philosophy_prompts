answer: |-
  This is a sharp question that cuts right to the heart of contemporary meta-ethics and normative theory regarding blame. You have correctly identified the tension: if moral truths are agent-neutral (the act is wrong regardless of who observes it), why is the *authority to enforce* that truth agent-relative (dependent on the blamer's status)?

  The confusion arises because we tend to model blame as a **constative speech act** (asserting a fact: "X is wrong") rather than a **directive or expressive speech act** (issuing a demand: "X, you owe us accountability").

  Here is the logical structure of the puzzle, the mechanisms proposed to solve it, and why the "truth" of the accusation remains untouched while the "standing" collapses.

  ### 1. The Logical Structure: Proposition vs. Performance

  To understand the mechanism, we must separate the **content** of blame from the **activity** of blaming.

  *   **The Propositional Content:** "Act A violates Norm N."
      *   *Truth Condition:* Dependent solely on Act A and Norm N.
      *   *Hypocrisy's Effect:* None. A hypocrite can state a true proposition.
  *   **The Performative Act:** "I hold you accountable to Norm N."
      *   *Felicity Condition:* Dependent on the relationship between the Blamer, the Blamed, and Norm N.
      *   *Hypocrisy's Effect:* Potentially fatal.

  **The Mechanism:** Standing is not about the *accuracy* of the map; it is about the *authority* of the cartographer to demand you follow the route.

  If standing were purely rhetorical (persuasion), it would be a psychological fact ("People ignore hypocrites"). But philosophers like G.A. Cohen, R. Jay Wallace, and Macalester Bell argue it is a **normative fact** ("Hypocrites *ought not* to blame, even if they are obeyed").

  The mechanism works like **Legal Standing**. A random citizen cannot sue you for breach of a contract they are not party to, even if you definitely breached the contract. The breach is real (truth), but they lack the normative power to initiate the suit (standing).

  ### 2. Competing Stories on the Mechanism

  Why does hypocrisy strip this normative power? There are three dominant theories in the literature.

  #### A. The Implicit Claim Account (Bell/Wallace)
  *   **The Mechanism:** Blaming someone implicitly asserts a claim about *yourself*.
  *   **The Logic:** When I blame you for lying, I am not just saying "Lying is wrong." I am implicitly communicating, "I uphold this norm and am answerable to it."
  *   **The Hypocrisy Violation:** If I am a liar, my act of blaming involves a false implicit claim about my own moral status. It renders the speech act **insincere** or **defective**.
  *   **Why Truth Remains Intact:** The lie is about *me*, not about *your act*. You still lied. But because my speech act is grounded in a false representation of my own relationship to the norm, I forfeit the right to make the demand.
  *   **Critique:** This makes standing too fragile. Does every minor slip-up destroy my standing to blame others for that thing? (Most philosophers say no; the hypocrisy must be substantial or unacknowledged).

  #### B. The Equal Standing/Commitment Account (Fritz & Miller)
  *   **The Mechanism:** Blame presupposes a relationship of **moral equality** under shared norms.
  *   **The Logic:** To blame someone is to invite them into a moral dialogue where both parties accept the authority of the norm. Fritz & Miller argue that hypocrisy demonstrates a **lack of commitment** to the norm itself. By violating the norm while enforcing it, you treat the norm as a tool for power rather than a shared standard.
  *   **The Hypocrisy Violation:** You place yourself *above* the norm (exempting yourself) while holding the other *below* it. This violates the condition of equality required for moral address. You cannot demand accountability from a peer if you do not acknowledge yourself as a peer under the same law.
  *   **Why Truth Remains Intact:** The norm exists independently of your commitment to it. Your lack of commitment doesn't abolish the norm; it just disqualifies *you* from being its enforcer in this context.
  *   **Key Distinction:** This is why "tu quoque" is a fallacy regarding truth (the norm still exists) but valid regarding standing (you lost your place in the normative community).

  #### C. The Complicity/Dirty Hands Account (Cohen)
  *   **The Mechanism:** This is less about logical consistency and more about **moral contamination**.
  *   **The Logic:** In Cohen's essay ("Casting the First Stone"), the focus is often on political hypocrisy. If I condemn your violence while funding the conditions that cause your violence, my condemnation is not just inconsistent; it is **complicit**.
  *   **The Hypocrisy Violation:** My blame functions as a distraction or a continuation of the harm. By focusing on your fault, I obscure my own causal role.
  *   **Why Truth Remains Intact:** Your violence is still wrong. But my voice is "tainted." To allow me standing would be to allow me to use moral discourse to shield myself from scrutiny.
  *   **Normative Force:** Here, standing is denied not because of a logical contradiction, but because granting standing would facilitate a moral wrong (the evasion of my own guilt).

  ### 3. Why Doesn't This Contaminate the Warrant?

  This is the crux of your confusion. If the messenger is compromised, why isn't the message?

  **1. Agent-Neutral vs. Agent-Relative Reasons**
  *   **Moral Truths are Agent-Neutral:** "Murder is wrong" applies to everyone, everywhere, regardless of who is speaking. The warrant for this claim comes from the nature of murder, not the nature of the speaker.
  *   **Standing is Agent-Relative:** "I have the right to demand you stop" depends on *my* specific relationship to *you* and the norm.
  *   **The Separation:** Hypocrisy attacks the *agent-relative* conditions (my relationship to the norm) without touching the *agent-neutral* facts (the norm's validity).

  **2. The "Thief Shouting 'Stop Thief'" Analogy**
  *   **Scenario:** A thief steals a watch. Another thief shouts, "Stop thief! That's wrong!"
  *   **Truth:** The first thief *did* steal the watch. The accusation is factually accurate.
  *   **Standing:** The shouting thief has no standing. Why? Because he is not appealing to a shared order of justice; he is engaging in a turf war.
  *   **The Mechanism:** If we say the shouting thief lacks standing, we aren't saying the theft didn't happen. We are saying the *social/normative transaction* of blame requires a certain purity of purpose (upholding the norm) that the hypocrite lacks.

  **3. The Function of Blame**
  If blame were merely **informational** ("I am informing you that you did wrong"), hypocrisy wouldn't matter. But blame is **regulative** ("I am demanding you acknowledge this and make amends").
  *   To regulate others by a standard you flout is to treat them as means to your own ends (e.g., virtue signaling, power), rather than as moral agents.
  *   Therefore, the *act of blaming* becomes morally problematic, even if the *content of the blame* is correct.

  ### 4. Is it Deflationary? (Social vs. Normative)

  You worried this collapses into "people just won't listen."

  *   **Deflationary View:** "You have no standing" = "You are unpersuasive."
  *   **Normative View:** "You have no standing" = "You are *forbidden* from making this demand, even if we all agree with you."

  The philosophical literature defends the **Normative View**.
  Imagine a corrupt judge who sentences a guilty criminal.
  *   **Truth:** The criminal is guilty.
  *   **Standing:** The judge has no standing (due to corruption).
  *   **Outcome:** Even if the criminal *is* guilty, the verdict is normatively void. We might still punish the criminal (because the fact remains), but we must remove the judge.

  The "standing" concept protects the **integrity of the moral community**, not just the accuracy of moral judgments. It asserts that *how* we hold each other accountable is part of the morality itself. If we allow hypocrites to blame with full standing, we transform moral norms into weapons of power rather than standards of conduct.

  ### Summary of the Logical Puzzle

  1.  **Premise 1:** Moral facts are objective/agent-neutral (Hypocrisy doesn't change whether Act X was wrong).
  2.  **Premise 2:** Blame is a normative transaction requiring authority/standing (Not everyone can demand accountability from everyone).
  3.  **Premise 3:** Standing is derived from a commitment to shared norms and equality (Fritz & Miller) or sincerity of moral address (Bell).
  4.  **Observation:** Hypocrisy demonstrates a lack of commitment/equality/sincerity.
  5.  **Conclusion:** Hypocrisy negates Standing (Premise 3 + 4) without negating Moral Facts (Premise 1).

  The "mechanism" is the shift from viewing blame as **reporting** to viewing blame as **governing**. Hypocrisy disqualifies you from governing, not from reporting.

  ### One Final Nuance: The "Whataboutism" Boundary
  This framework explains why "whataboutism" is usually a fallacy but sometimes valid.
  *   **Fallacious:** "You criticize my corruption, but your party is corrupt too." (Attempting to deny the *truth* of the corruption charge via standing).
  *   **Valid:** "You criticize my corruption, but you actively enable the same system and refuse to reform your own side." (Denying the *standing* to lead the moral charge).

  The literature suggests the second move doesn't prove the first act wasn't wrong, but it successfully silences the accuser's *normative authority* to demand penance.
