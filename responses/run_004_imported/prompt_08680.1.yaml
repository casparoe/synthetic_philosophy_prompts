  Okay so this is going to sound like a weird thing to ask about but my friend Jake is really into the whole LessWrong/rationalist internet philosophy scene and he spent like half of lunch last week trying to explain "acausal trade" to me. From what I understood, it's this idea that two agents (could be aliens, AIs, whatever) who can NEVER causally interact with each other -- like they're in totally disconnected regions of an infinite universe, or one of them only exists as a simulation the other one is running in its head -- can still act like they made a deal and "traded" with each other, because each one is a good enough predictor of the other that they can each just decide to act like the deal happened. Jake said its basically a souped up version of the twin prisoners dilemma thing Hofstadter called superrationality. Then he brought up Roko's basilisk and honestly it kind of freaked me out a little, and now I don't know if this is actually solid decision theory or just internet nerds convincing each other of spooky stuff using intimidating vocabulary.

  For my AP Seminar independent research thing I want to present both sides fairly instead of just picking whichever one sounds cooler, so could you write me a dialogue between two people who are equally sharp -- one who thinks acausal trade is a real thing a fully rational agent has to take seriously, and one who thinks the whole concept falls apart under pressure -- actually arguing with each other, not just each stating their own view back to back? I'd love it if the skeptic pushed on things like: is it even coherent to call this "trade" when there's no way to verify or enforce anything, and isn't "our decisions are correlated" just evidential decision theory wearing a trenchcoat rather than some genuinely new third option? And I want the defender to actually have real comebacks instead of just re-explaining the definition. It doesn't have to land on a tidy conclusion at the end, I'd just like a good back-and-forth, maybe 8ish exchanges each.
