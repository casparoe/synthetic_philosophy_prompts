answer: |-
  First, I want to acknowledge that this is a very human reaction. When faced with a scary medical statistic, the brain often tries to regain control by intellectualizing the problem. If you can turn "Will I get sick?" into "What is the metaphysical status of probability?", it feels like you're doing something productive about the fear.

  But before we dive into David Lewis, I need to give you the bottom line up front, because I suspect it will relieve more anxiety than the philosophy will: **You are almost certainly overthinking the applicability of the Principal Principle to your medical results.**

  Clinical risk scores are not "Lewisian Objective Chances." They are frequentist or epistemic probabilities derived from reference classes. The philosophy you are reading about deals with the metaphysics of chance in a way that simply doesn't map onto a polygenic risk score or a BRCA variant analysis.

  However, since you have a stats background and have already gone down the rabbit hole, let's untangle the philosophy so you can close the tab and stop worrying about *admissibility*.

  ### 1. The Principal Principle (PP) and Admissibility

  David Lewis's **Principal Principle** is a bridge between the world (objective chance) and your mind (credence/subjective probability).

  Roughly, it says: If you know the objective chance of an event $A$ is $x$, your credence (degree of belief) in $A$ should also be $x$.
  Formally: $C(A | X \& E) = x$
  *   $C$: Your credence function.
  *   $A$: The proposition (e.g., "I will develop breast cancer").
  *   $X$: The proposition that the objective chance of $A$ is $x$ (e.g., "The chance is 19%").
  *   $E$: Your other evidence.

  **The Catch:** This only holds if $E$ is **admissible**.

  **What is Admissibility?**
  Lewis was notoriously vague here, which is why it bothers you. But the intuition is this: Admissible evidence is information that tells you about the *past* or the *present*, but does not give you "crystal ball" information about the *future* outcome itself, except via the chance.

  *   **Admissible:** "The coin is biased 50/50," "It rained yesterday," "I have the BRCA1 variant."
  *   **Inadmissible:** "I saw a vision of myself getting sick," "A time traveler told me the outcome," or (in some philosophical frameworks) detailed information about the future micro-state of the universe.

  **Your Situation:**
  Your genetic variants and family history are **admissible**. They are facts about the past (your conception) and the present (your current DNA). They are not "crystal ball" knowledge of the future outcome.

  Furthermore, the 19% number *already conditions on that evidence*. The risk model says: "For the reference class of women *with these variants and this history*, the frequency is 19%."
  So, in Lewisian terms, your evidence $E$ is already baked into the chance proposition $X$. You don't need to deviate from the 19% because of your family history; the 19% *is* the chance given your family history.

  **Verdict:** On the admissibility question, you are safe. Your evidence is the standard historical kind. Deferring to the 19% is consistent with the Principal Principle.

  ### 2. The Undermining Problem

  This is where Lewis lost sleep, and where you can stop worrying.

  **The Setup:**
  Lewis was a **Humean**. He believed that "objective chances" aren't magical propensities floating in the ether. Instead, chances **supervene** on the pattern of actual events in the universe (the "Humean Mosaic").
  *   Roughly: The chance of a coin landing heads is 0.5 *because* in the long run, across the universe, similar coins land heads 50% of the time. The pattern of events *makes* the chance true.

  **The Problem:**
  If chances are determined by the total pattern of events (including future ones), then a hypothesis about current chances is actually a hypothesis about the future.
  *   If I say "The chance of Heads is 0.5," and Chance supervenes on the long-run frequency, I am implicitly saying "The future will contain roughly 50% heads."
  *   But there is a non-zero chance that the future *won't* contain 50% heads (e.g., a massive run of tails).
  *   If that happens, the hypothesis "The chance is 0.5" turns out to be false.
  *   So, knowing "The chance is 0.5" gives me information about the future (it rules out the "all tails" future). But the Principal Principle says I should only use chance to *get* info about the future, not that the chance statement *contains* info about the future pattern that defines it.
  *   It creates a circular loop: The chance determines my belief, but my belief (about the chance) tells me about the future pattern that determines the chance.

  **Why it matters (Philosophically):**
  It creates a mathematical inconsistency in Lewis's original formula. If you conditionalize on a chance hypothesis that might be "undermined" by the very future it predicts, your probabilities don't sum to 1 properly.

  **Why it doesn't matter (For You):**
  This problem only arises if you believe chances are defined by the *actual infinite long-run frequency of the entire universe*.
  Medical risk scores are not defined that way. They are defined by **finite sample frequencies** in a specific population (e.g., "10,000 women with this variant were followed for 30 years").
  Whether *you* get cancer does not change the historical data of those 10,000 women. Your outcome cannot "undermine" the statistic. The statistic is fixed in the past.

  ### 3. The New Principle (NP)

  Lewis, Hall, and Thau proposed the **New Principle** to fix the undermining issue.
  *   **Old PP:** $C(A | X) = x$
  *   **New NP:** $C(A | X) = X(A | X)$

  Roughly: Your credence in $A$ should equal the chance of $A$, *given that the chance hypothesis $X$ is true*.
  It adds a layer of conditionalization to acknowledge that the chance hypothesis itself might be false (undermined) by the future history.

  **Does this change your 19%?**
  No. Even under the New Principle, if the chance hypothesis is robust (i.e., not easily undermined), the value remains effectively the same. And again, because medical statistics are backward-looking frequentist data, they are not subject to undermining. The data exists regardless of your future health.

  ### 4. The Real Issue: Epistemic vs. Objective Chance

  Here is the most important part for your peace of mind.

  Lewis was writing about **Objective Chance** (Propensity). This is a metaphysical claim about how the world works independent of our knowledge.
  Your genetic report gives you an **Epistemic Probability** (or Frequentist Risk). This is a measure of uncertainty based on incomplete knowledge and reference classes.

  **The Difference:**
  *   **Lewisian Chance:** "The universe has a propensity such that 19% of possibilities branch into cancer."
  *   **Medical Risk:** "In the group of women who look like you (genetically/historically), 19% developed cancer."

  In the medical context, the 19% is not a mystical force. It is a tool for **decision theory**, not metaphysics.
  *   If the cost of screening is low and the cost of missing cancer is high, you screen, even if the risk is 5%.
  *   If the cost of preventive surgery is high, you might wait until the risk is 40%.

  The number is not a "truth" you need to align your soul with (via the Principal Principle). It is an input for a cost-benefit analysis.

  ### Summary & Recommendation

  1.  **Admissibility:** Your genetic info is admissible evidence. It is historical/present data. The 19% figure already accounts for it. You are not violating the Principal Principle by using it.
  2.  **Undermining:** This is a problem for metaphysicians who think chances are defined by future events. Medical statistics are defined by past data. Your future cannot change the past data. The problem does not apply to you.
  3.  **New Principle:** This is a technical fix for the above metaphysical problem. It does not change the numerical value of your risk assessment.
  4.  **The Trap:** You are using high-level philosophy to try to solve health anxiety. This is a form of "intellectualization." It feels like work, but it's actually avoidance. You are trying to find a philosophical guarantee that the number is "real" so you can feel safe (or sadly resigned).

  **My advice:**
  Accept that the 19% is the best available *epistemic* estimate you have. It is not an Objective Chance in the Lewisian sense, so the Principal Principle is the wrong tool for the job. The number is real enough to act on, but not real enough to obsess over as a metaphysical truth.

  Take the report to a genetic counselor or an oncologist. Ask them: *"Given this 19% versus 8% baseline, what is the standard of care for screening or prevention?"* Let their answer drive your actions, not David Lewis's theory of chance.

  You have done the hard part (getting tested). Now let the medical professionals carry the weight of the interpretation so you don't have to carry it in your head.
