answer: |-
  This is one of the most profound results in modern epistemology, often associated with the "Accuracy First" program (championed by philosophers like Jim Joyce and Richard Pettigrew). You are right to sense that it is distinct from the Dutch Book argument. Dutch Book shows that incoherent beliefs make you *pragmatically* vulnerable (you lose money); Accuracy Dominance shows that incoherent beliefs make you *epistemically* suboptimal (you are further from the truth).

  Here is the gut-level walkthrough of why accuracy forces probability theory, and why "strict" propriety is the linchpin.

  ### 1. The Geometry of Truth and Belief

  To see this without heavy algebra, we have to visualize beliefs as points in space.

  Imagine a single event: **Rain ($R$)** or **No Rain ($\neg R$)**.
  There are only two ways the world can be. We can represent these "World States" as two points on a graph:
  *   **World 1 (Rain):** $R$ is True (1), $\neg R$ is False (0). Coordinate: $(1, 0)$.
  *   **World 2 (No Rain):** $R$ is False (0), $\neg R$ is True (1). Coordinate: $(0, 1)$.

  Now, where do **your beliefs** live?
  If you assign a credence of $0.7$ to Rain and $0.3$ to No Rain, your belief is the point $(0.7, 0.3)$.
  Notice that $0.7 + 0.3 = 1$. All coherent probabilistic beliefs lie exactly on the straight line connecting World 1 and World 2. This line is the **Probability Simplex**.

  **Incoherence** means your belief point lies *off* that line.
  For example, if you are overconfident in both, you might assign $0.7$ to Rain and $0.7$ to No Rain. Your point is $(0.7, 0.7)$. This floats above the line.

  ### 2. Scoring Rules as Distance

  You mentioned the Brier score. Gut-level, the Brier score is just **squared Euclidean distance** from the truth.
  *   If it Rains, the Truth is at $(1, 0)$. Your score is the squared distance from your point to $(1, 0)$.
  *   If it Doesn't Rain, the Truth is at $(0, 1)$. Your score is the squared distance from your point to $(0, 1)$.

  Your goal is to be as close to the Truth as possible.

  ### 3. The Dominance Intuition

  Here is the geometric heart of the argument.

  Imagine your incoherent belief point $(0.7, 0.7)$ floating above the coherent line segment connecting $(1,0)$ and $(0,1)$.
  Now, imagine you drop a perpendicular line from your point straight down to the nearest point on the coherent line. Let's say that nearest coherent point is $(0.5, 0.5)$.

  **The Geometric Fact:** Because the coherent line is straight (convex) and your point is outside it, that "projected" point on the line is **closer to both World 1 and World 2 than you are.**

  Think about it physically: You are standing off the path between two houses. There is a spot on the path that is closer to House A than you are, *and* closer to House B than you are. You have positioned yourself in a "no man's land" that is unnecessarily far from both possibilities.

  If you move your belief to that projected coherent point:
  *   If World 1 happens, the coherent rival is closer to the truth (lower score).
  *   If World 2 happens, the coherent rival is closer to the truth (lower score).

  This is **Accuracy Dominance**. By violating the probability axioms, you have placed yourself in a location in "belief space" that is geometrically guaranteed to be further from reality than a coherent alternative, no matter which reality obtains. You don't need a bookmaker to exploit this; the geometry of truth itself exploits you.

  ### 4. Why "Strictly" Proper?

  This is the subtle part where many explanations gloss over the detail.

  A scoring rule is **Proper** if, given your current beliefs, you cannot improve your *expected* score by reporting a different number.
  A scoring rule is **Strictly Proper** if reporting your true belief is the *unique* way to maximize your *expected* score.

  Why does the dominance argument require **Strict** Propriety?

  Imagine a scoring rule that is merely "proper" but not "strict." Geometrically, this means the "valley" of the score function has a **flat bottom**.
  If the bottom is flat, there are multiple points that yield the exact same optimal score.

  If the scoring surface is flat:
  1.  Your incoherent point might lie on the same "contour line" as a coherent point.
  2.  This means your incoherent belief could have the **exact same accuracy** as the coherent rival in some worlds.
  3.  If the scores are equal, there is no *strict* dominance. The theorem states that a coherent rival scores *better* (strictly lower error), not just "at least as good."

  **Strict propriety ensures the bowl is curved, not flat.**
  It guarantees that as you move away from the coherent projection, your distance from the truth vertices increases *monotonically*. It ensures that the coherent point is the *unique* minimizer of distance. Without that uniqueness (strictness), an incoherent belief might "tie" with a coherent one, and the argument that probability axioms are *required* for accuracy collapses into a claim that they are merely *permissible*.

  ### 5. Summary: The Epistemic Commitment

  To answer your core confusion: *How does mere accuracy force this?*

  The probability axioms ($P(A) + P(\neg A) = 1$, etc.) are not arbitrary rules made up by mathematicians. They describe the **geometry of consistency**.
  *   The "Truth" lives at the corners of a shape.
  *   "Coherent Belief" lives on the surface of that shape.
  *   "Incoherent Belief" lives outside that shape.
  *   "Accuracy" is distance to the corners.

  If you live outside the shape, you are geometrically guaranteed to be further from the corners than someone living on the surface. Caring about accuracy is caring about minimizing distance. Minimizing distance requires living on the surface. Living on the surface requires obeying the probability axioms.

  The "Strictly Proper" requirement is simply the mathematical guarantee that the terrain is sloped such that you cannot hide in a flat valley outside the shape; you are always strictly worse off the further you drift from the coherent surface.

  So, when you do your calibration training, you aren't just learning a skill for betting. You are aligning your mind with the geometric structure of truth-approximation itself. If you violate the axioms, you aren't just vulnerable to a bookie; you are objectively, measurably wronger than you need to be.
