answer: |-
  You have hit on the single biggest practical objection to moral trade. In the literature (particularly within Effective Altruism circles where this concept gets the most airtime), this is called the **Additionality Problem** or the **Baseline Problem**.

  You are absolutely right: if the trade doesn't change the net outcome compared to the counterfactual (what would have happened without the deal), then no moral value has been created—only resources have been transferred, minus transaction costs.

  However, most proponents of moral trade argue this is a **hurdle, not a showstopper**. Here is how the argument breaks down, why your concern is valid, and the ways thinkers try to get around it.

  ### 1. Why your objection is strong (The "Fatal" Case)
  Your carbon offset analogy is perfect. In carbon markets, "non-additional" credits are considered worthless (or even harmful, because they give polluters a license to keep polluting while feeling good).

  In moral trade, if I pay you to not eat meat, but you were planning to go vegetarian next month anyway, I have effectively subsidized your pre-existing intention.
  *   **Net Moral Gain:** Zero.
  *   **Net Resource Loss:** The time/energy spent negotiating and the money transferred (which could have gone directly to charity).
  *   **Risk:** It creates a perverse incentive for people to *hide* their good intentions so they can sell them later.

  If moral trade is viewed strictly as a **consequentialist machine** (input money/effort → output utility), then the inability to verify counterfactuals is a massive efficiency leak.

  ### 2. Why it might not be fatal (The Mitigations)

  There are four main lines of reasoning that suggest moral trade still works despite the baseline problem.

  #### A. Marginal vs. Total Change
  Moral trade rarely happens in binary terms (Meat vs. No Meat). It usually happens on the margin.
  *   **Scenario:** Your friend was going to cut meat consumption by 20% this year.
  *   **The Trade:** You offer to donate $500 to their poverty charity if they cut consumption by 50%.
  *   **Result:** Even if they *would* have done something, the trade incentivized *more* than the baseline.

  As long as the trade incentivizes behavior *beyond* the natural drift of their moral preferences, there is additionality. The verification burden shifts from "Did they do the thing?" to "Did they do *more* of the thing than usual?" This is easier to estimate using past behavior as a proxy.

  #### B. Intentions vs. Commitment (The Akrasia Argument)
  Human beings are bad at following through on vague moral intentions.
  *   **Counterfactual:** "I was going to eat less meat."
  *   **Reality:** Life gets busy, willpower fades, and they slip up.
  *   **The Trade:** By attaching a financial cost/reward and a social contract to the action, the trade acts as a **commitment device**.

  Even if the *intent* was there, the *action* might not have materialized without the trade structure. In this view, the trade isn't buying the moral action; it's buying the **reliability** of the moral action.

  #### C. Probabilistic Expected Value
  We never have perfect information in *any* trade, moral or economic.
  *   When I buy a coffee, I assume the farmer was paid fairly. I can't verify that counterfactual (would they have been paid less otherwise?).
  *   When I donate to a charity, I assume my money isn't just replacing government funding (fungibility).

  Proponents argue we should treat moral trade like any other intervention: **Estimate the probability of additionality.**
  If there is a 70% chance your friend wouldn't have cut back on meat without the deal, the Expected Value (EV) of the trade is still positive. Since the alternative (no trade) guarantees 0 cooperative moral gain, a probabilistic gain is better than a certain null.

  #### D. The Meta-Game (Building Cooperation)
  This is the strongest philosophical defense. The value of moral trade isn't just the specific transaction (meat for money); it's the **establishment of a cooperative norm.**
  *   If we successfully trade once, we build trust.
  *   We learn how to negotiate values.
  *   We identify future opportunities where additionality is clearer.

  Even if the first trade is partially non-additional, it lowers the transaction costs for future trades that *are* high-impact. It's an investment in a "moral market infrastructure."

  ### 3. Reframing the Goal: Preference Satisfaction vs. Objective Good

  There is a deeper philosophical split here.

  **View 1: Objective Consequentialism**
  The goal is to maximize "Good Units" in the universe.
  *   *Verdict:* Your objection is devastating. If we can't measure the units created, we can't optimize.

  **View 2: Subjective Preference Satisfaction (Pareto Improvements)**
  The goal is to allow agents to satisfy their own values more efficiently.
  *   *Verdict:* The counterfactual matters less.
  *   *Why?* Because I *value* knowing my friend eats less meat *because of me*. Even if they would have done it anyway, the fact that we entered a contract makes it a joint project. It satisfies my preference for agency and collaboration.
  *   In this view, moral trade is less about "saving the world" and more about "resolving value conflicts between friends." If we both walk away feeling we advanced our values, the trade succeeded subjectively, even if the objective universe didn't change much.

  ### 4. Practical Solutions to the Baseline Problem

  If you want to engage in moral trade without falling into the trap you identified, practitioners suggest:

  1.  **Historical Baselines:** Use data. "You ate 10 burgers a month last year. The deal is you eat 5." This anchors the counterfactual in evidence, not claims.
  2.  **Overcompensation:** Discount the value. If you think there's a 50% chance they would have done it anyway, only pay 50% of the "price." This protects you from paying for free riders.
  3.  **Cause Neutrality:** Instead of "I pay you to do X," try "We both pool money and decide together where it goes based on who has the comparative advantage." This reduces the incentive to fake baseline behavior.

  ### Conclusion

  Is it a fatal problem? **No.**
  Is it a serious bug? **Yes.**

  The "Additionality Problem" means moral trade cannot be a naive, handshake deal based on trust. It requires the same skepticism we apply to carbon offsets: **verify baselines, look for marginal changes, and account for probabilities.**

  If you treat moral trade as a way to **lock in marginal gains** and **build cooperative habits**, rather than a magic bullet for saving the world, the counterfactual worry becomes a risk management issue rather than a dealbreaker. You just have to accept that some percentage of your "moral purchases" will be non-additional, just as some percentage of charitable donations are inefficient.
