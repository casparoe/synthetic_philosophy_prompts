answer: |-
  Here is a draft of 9 interview questions designed for your seminar assignment. They are structured to move from definitions to specific tensions in his texts, with follow-ups that anticipate his Thomistic reasoning (Natural Law, Common Good, Order) and push back against the potential contradictions.

  ### **Podcast Title:** *The Angelic Doctor & The Dagger*
  **Host:** [Your Name]
  **Guest:** Thomas Aquinas

  **1. The Definition of Tyranny**
  "Master Thomas, let's start with the ground floor. In *De Regimine Principum*, you define a tyrant as someone who seeks their own good rather than the common good. But practically speaking, a ruler might argue that what benefits *him* (like hoarding wealth for a war) actually benefits the *realm* in the long run. At what precise point does a ruler's prudential judgment become tyranny? Is it a matter of intent, or solely outcome?"

  *   **Follow-up:** "You'll likely say it's about the *intent* to subordinate the common good to private will. But if we can't peer into the King's soul, doesn't that make identifying a tyrant impossible for the average subject until the damage is already done? Does your definition inadvertently require omniscience to enforce?"

  **2. The Usurper vs. The Legitimate Tyrant**
  "You make a sharp distinction between a ruler who seizes power by force (a usurper) and a legitimate ruler who subsequently governs tyrannically. You suggest the usurper may be killed by anyone, but the legitimate tyrant cannot be touched by private citizens. Why does the *origin* of the power matter more than the *abuse* of it? If the harm to the common good is identical, why is the moral license to resist different?"

  *   **Follow-up:** "I anticipate you'll argue that the legitimate ruler holds authority from God or the community, so removing him attacks the *office* itself. But if he destroys the very community that granted the office, hasn't he voided the contract? Why does the title protect the man even after he has betrayed the purpose of the title?"

  **3. The *De Regimine* Caution vs. *Summa* Permissiveness**
  "In *De Regimine Principum*, you seem to counsel endurance, warning that killing a tyrant often leads to worse chaos. Yet, in the *Summa Theologiae*, you suggest that tyranny fosters sedition and that resisting it isn't necessarily seditious. There is a tension here: one text says 'wait and pray,' the other implies tyranny is itself a disorder that disrupts peace. Do you actually believe private citizens *never* have the license to act, or is *De Regimine* just being politically cautious while the *Summa* reveals the theological truth?"

  *   **Follow-up:** "If you insist that *De Regimine* represents your true political view, aren't you prioritizing 'order' over 'justice'? If the only mechanism to remove a tyrant is a higher authority who is either absent or complicit, isn't your advice to 'endure' effectively a command to let the common good be destroyed for the sake of abstract hierarchy?"

  **4. The "Ambitious Accuser" Objection**
  "You explicitly worry that if private killing of tyrants is permitted, ambitious people will murder good rulers and simply *claim* they were tyrants to justify it. You say this danger protects the common good. But doesn't this logic swing too far the other way? By making the barrier to resistance so high, aren't you creating a safe harbor for actual tyrants who know no one dares to call them out? Does your fear of the 'false accuser' end up protecting bad rulers more than it protects the community?"

  *   **Follow-up:** "You might argue that public authority can discern the truth better than a mob. But if the public authority is the tyrant's own court, they will never validate the accusation. So, isn't your safeguard against 'ambition' functionally identical to immunity for tyranny?"

  **5. The Risk of the Successor**
  "A core part of your argument against tyrannicide is that the removal often leads to a worse tyranny, as the liberator becomes a new oppressor. This is a consequentialist argument. But Natural Law usually focuses on the morality of the *act* itself, not just the outcome. If the act of removing a destroyer of souls is inherently just, why does the risk of a bad successor make the initial act of liberation illicit? Are you judging the justice of the act by the sins of the next guy?"

  *   **Follow-up:** "If you say we must weigh the probable outcomes, doesn't that turn political ethics into a gamble? If a tyrant is actively massacring the innocent, and we hesitate because the successor *might* be bad, aren't we complicit in the current massacres through our inaction?"

  **6. Who Constitutes "Public Authority"?**
  "You insist that only 'public authority' can depose a legitimate tyrant. In the 13th century, that might mean the Emperor or the Pope. But in a kingdom where the King acknowledges no superior temporally, who fits this description? Is it the barons? The estates? The people collectively? If the 'public authority' is diffuse, doesn't that essentially allow what you forbid: a group of private citizens acting together to do what one cannot do alone?"

  *   **Follow-up:** "If you concede that a 'multitude' can act where an individual cannot, isn't that just a semantic trick? If ten private men can kill him but one cannot, does the morality lie in the justice of the cause or merely in the headcount of the conspirators?"

  **7. Sedition and the Tyrant's Peace**
  "In the *Summa*, you say the tyrant fosters sedition by creating discord among subjects to keep them weak. Therefore, resisting him isn't sedition. But if the tyrant maintains a 'peace' of sorts—a peace of the graveyard, where everyone is too terrified to move—is that still 'discord'? If a tyrant is efficient and keeps the realm quiet while stealing from it, does your justification for resistance vanish because there is no visible 'sedition' to counter?"

  *   **Follow-up:** "So you're saying the *method* of tyranny matters? If he rules through fear but maintains order, we must endure? That suggests you value the *appearance* of political order more than the *substance* of justice. Is temporal peace really worth the spiritual corruption of the populace?"

  **8. Endurance as Virtue vs. Complicity**
  "You often frame enduring a tyrant as a form of Christian patience, akin to suffering for the faith. But there is a difference between suffering for one's own faith and allowing a tyrant to harm *others*. If I stand by and watch a tyrant murder my neighbor because I am waiting for a 'higher authority' to intervene, am I practicing patience or am I an accomplice? Where does the duty to protect the innocent override the duty to obey the structure of authority?"

  *   **Follow-up:** "If you argue that God will ultimately judge the tyrant, that works for the afterlife. But for the neighbor dying in the street *now*, does your philosophy offer any protection? Or is your political theory primarily concerned with the salvation of the resistor, not the safety of the victim?"

  **9. The Final Verdict on Conscience**
  "Let's close with the individual conscience. If a private citizen is morally certain a ruler is a tyrant, and no higher authority is available to act, and the tyranny is destroying the common good: Is it a *sin* for him to act? I don't want to hear 'it is dangerous.' I want to know: In the eyes of God, is the private tyrannicide in that specific vacuum of authority a mortal sin, or is it a tragic necessity?"

  *   **Follow-up:** "If you say it remains a sin to preserve the principle of order, then order is an idol higher than justice. If you say it is permissible, you undermine your own warnings in *De Regimine*. Which principle actually wins in your hierarchy: the preservation of the Soul's obedience, or the preservation of the Community's life?"
