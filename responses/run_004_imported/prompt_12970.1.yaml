  hey so for my medieval political philosophy seminar we've got this kinda fun assignment where we imagine interviewing aquinas himself, like a hypothetical podcast episode, about his views on killing tyrants. prof wants us to actually push on the substance instead of just letting him restate "well it's complicated." can you draft like 8-9 interview questions for this?

  i want at least one on the gap between how cautious he is in de regimine principum about private citizens acting alone against a tyrant (vs waiting on some higher authority, or basically just enduring it and praying) and the more permissive-sounding stuff elsewhere where overthrowing a tyrant apparently isn't even "sedition" since the tyranny itself is the real disorder. also one that presses on whether his worry about private tyrannicide -- that ambitious people will just cry "tyrant" as an excuse -- ends up protecting bad rulers more than it protects the common good. and one on the usurper vs. legitimate-ruler-gone-bad distinction, like does he actually think those two cases deserve different treatment and why. for each question throw in a quick follow-up keyed to whatever answer he'd probably give, not just a flat list of questions plz.
