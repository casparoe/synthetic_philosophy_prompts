answer: |-
  **Setting:** *A quiet office in the philosophy department at Cambridge. Rain taps against the leaded windows. Professor Marcus Thorne (defender of the Grounding Objection) pours tea for Dr. Elena Vance (Molinist).*

  **Thorne:** Thank you for staying, Elena. I know my seminar today was… vigorous. But I want to press the point you sidestepped. It's about Adams. It's always about Adams.

  **Vance:** (Smiling) Robert Adams did more for Molinism than almost anyone by forcing us to sharpen our metaphysics. But yes, I know where you're heading. The Grounding Objection.

  **Thorne:** Specifically, the "Would/Might" worry. Look, I'm willing to grant you, for the sake of argument, that some truths might not need causal grounds. Maybe mathematical truths, maybe identity statements. But counterfactuals of creaturely freedom (CCFs) are different. They claim to describe what a free agent *would* do.

  **Vance:** And you think they can't be true prior to the agent's existence.

  **Thorne:** I think they can't be *determinate* prior to the agent's decision. Here is the crux: If Peter is truly free in the libertarian sense, then in circumstances C, he has the power to deny Christ and the power to stand firm. The causal chain is open. Now, Molinism says it is *true* from eternity that "If Peter were in C, he *would* deny Christ." But if the causal chain is open, what settles the "would"? If nothing settles it, then the most you can say is "Peter *might* deny Christ."

  **Vance:** You're conflating causal settlement with truth conditions.

  **Thorne:** Am I? If I say, "The coin would land heads," but the toss is genuinely indeterministic, I'm speaking falsely. I should say, "It might land heads." If you insist on "would," you're smuggling in a hidden determinism. You're saying something about Peter's nature *necessitates* the choice. But if his nature necessitates it, he isn't free. If he is free, nothing necessitates it. If nothing necessitates it, there is no fact of the matter. So, is the CCF a brute truth, or is it an *ad hoc* fiction to save divine providence?

  **Vance:** That's the charge I want to answer. It's not *ad hoc* if it flows from a coherent metaphysics of agency. You're assuming that for a proposition to be true, there must be some existing state of affairs in the actual world that *causes* it to be true.

  **Thorne:** I'm assuming that for a proposition to be true, there must be something that *makes* it true. A truthmaker. If Peter doesn't exist, Peter can't make anything true.

  **Vance:** Peter doesn't exist *actually*, agreed. But Molinism is about logical priority, not temporal. In the logical order, we have: (1) God's knowledge of all necessary truths and all possible worlds; (2) God's middle knowledge of CCFs; (3) God's decree to create. In stage two, Peter exists as a *possible* agent.

  **Thorne:** A possible agent cannot ground a truth about what he *would* freely do. Possibility is about what *can* happen. You're trying to extract a definite *will* from a mere *capacity*. That's the "Would/Might" gap. If Peter is free, his will is not fixed by his nature. So, logically prior to his choice, his will is indeterminate. How can an indeterminate will ground a determinate truth?

  **Vance:** Because the determinacy of the truth doesn't come from the will being *fixed* by nature, but from the will being *specific* in its response to a specific context. Think of it this way: Libertarian freedom isn't randomness. It's rational agency. If Peter is a specific person with a specific character, his freedom is the power to act according to that character.

  **Thorne:** But he can act against character. That's the point of freedom.

  **Vance:** He *can*, yes. But the CCF isn't about what he *must* do; it's about what he *does* do in the counterfactual scenario. The truth of "If Peter were in C, he would deny Christ" is grounded in the fact that, in the possible world where C obtains, Peter *exercises* his freedom to deny Christ.

  **Thorne:** But we aren't *in* that world. God is looking at all the worlds where C obtains. In some, Peter denies. In others, he doesn't. Which one is the "true" counterfactual?

  **Vance:** The one that is most similar to the actual world regarding Peter's haecceity—his "thisness." God knows Peter essentially. He knows exactly who Peter is. And knowing exactly who Peter is involves knowing how *this* specific agent resolves indeterminacy in *these* specific circumstances.

  **Thorne:** This sounds like you're saying Peter's "thisness" includes a blueprint of his choices. If it's part of his essence that he denies Christ in C, then he can't do otherwise in C. You've killed freedom to save foreknowledge.

  **Vance:** No. Essence doesn't causally determine. Let me try to be more precise about the "brute" aspect, because this is where you accuse us of being *ad hoc*. I am arguing that the truthmaker for the CCF is the *counterfactual state of affairs itself*.

  **Thorne:** That's circular. "It is true that Peter would do X because in the scenario where he does X, he does X."

  **Vance:** It's not circular; it's a claim about the ontology of possibilities. In the realm of divine understanding, possible worlds are not just vague clouds of "might." They are fully specified maximal states of affairs. If a world is fully specified, then for every agent in that world, their free choices are specified.

  **Thorne:** Specified by whom?

  **Vance:** By the agent, in the counterfactual sense. Look, Marcus, consider your own intuition about character. If I know your wife very well, and I know she is in a situation where she finds a lost wallet full of cash, I might say, "She would turn it in."

  **Thorne:** I'd say, "She probably would." Or "I bet she would."

  **Vance:** But if I know her *perfectly*? If I know her essence, her history, her dispositions, her rationality, down to the infinitesimal detail? If my knowledge is infinite?

  **Thorne:** Even then, if she is free, she could surprise you. If she *must* turn it in based on your knowledge, she isn't free.

  **Vance:** You keep equating "certainty of truth" with "causal necessity." This is the heart of the disagreement. I am proposing that libertarian freedom yields a determinate truth because freedom is a *settling power*. When an agent acts freely, they settle what was previously unsettled.

  **Thorne:** Yes.

  **Vance:** Well, God's middle knowledge is knowledge of *how* that settling power is exercised in every possible context. The truth is "brute" in the sense that it isn't grounded in something *prior* to the agent's exercise of freedom. It is grounded *in* the exercise of freedom itself, viewed sub specie aeternitatis.

  **Thorne:** But the exercise hasn't happened! That's Adams' point! Logically prior to the decree, Peter hasn't exercised anything. So there is nothing to ground the truth. You're asking us to accept a truth about a non-existent event.

  **Vance:** I'm asking you to accept that truths about possible free agents are a distinct category of truth. They aren't grounded in the actual world, nor in God's will (that would be determinism), nor in nothing (that would be arbitrary). They are grounded in the *relation* between the possible agent and the possible circumstances.

  **Thorne:** And why is that relation determinate? Why "would" and not "might"?

  **Vance:** Because a "might" claim is true if there is *power* to do otherwise. A "would" claim is true if there is a *fact* about the exercise of that power. Libertarianism says I have the power to do otherwise. It does not say I have the power to make it *false* that I would do X in circumstances C, if in fact I *would* do X in C.

  **Thorne:** That sounds like wordplay.

  **Vance:** It's metaphysics. Consider the difference between "Peter is able to deny Christ" and "Peter denies Christ." The first is a property of Peter's nature (freedom). The second is an event. The CCF says: "In the context C, the event 'Peter denies Christ' obtains." The truth of that counterfactual is grounded in the fact that, among the feasible worlds God can actualize, the ones where Peter is in C are worlds where he denies Christ.

  **Thorne:** Feasible worlds. There it is. You're saying God looks at the menu of feasible worlds. But who wrote the menu?

  **Vance:** The agents do. In the logical order of explanation, the agents' free responses determine which worlds are feasible.

  **Thorne:** But the agents don't exist!

  **Vance:** They exist as objects of divine intellect. And here is my answer to your "ad hoc" charge. It is not *ad hoc* to say that rational agents have specific dispositions that yield specific outcomes in specific contexts, even if those outcomes aren't causally necessitated. It is only *ad hoc* if you assume that the only alternative to causal necessitation is randomness.

  **Thorne:** I don't assume it's randomness. I assume it's *open*.

  **Vance:** But "open" to the agent doesn't mean "indeterminate" to the omniscient observer who grasps the agent's essence. If I truly understand a person, I understand their choices. If God understands them perfectly, He knows their choices. The "bruteness" of the CCF is simply the acknowledgment that freedom is a primitive source of truth. The agent is the truthmaker, even in the counterfactual mode.

  **Thorne:** So you're saying the truth is grounded in the agent, even though the agent doesn't exist?

  **Vance:** The *possible* agent grounds the truth for the *possible* world. God knows the possible agent exhaustively. If you deny this, Marcus, you aren't just denying Molinism. You're denying that there are truths about how possible people would act. You're saying that before I create a character in a novel, there is no truth about what they would do in Chapter 3.

  **Thorne:** That's exactly what I'm saying! Until you write it, the character does nothing. If you say, "Before I wrote it, it was *true* that Hamlet would hesitate," you are constraining your own creative freedom, or you are implying Hamlet exists independently of you.

  **Vance:** But if you are a perfect storyteller, and you know the character perfectly, you don't *decide* arbitrarily what they do. You discover what they do based on who they are.

  **Thorne:** But you still have to write it to make it true! Before the ink hits the page, "Hamlet hesitates" is not true. It's just a possibility. This is the "Would/Might" gap again. You want to say "Hamlet *would* hesitate" is true before the ink hits the page. I say, at best, "Hamlet *might* hesitate" is true.

  **Vance:** And if you say that, then God cannot providentially order the world without violating freedom. He has to gamble.

  **Thorne:** Maybe He does. Or maybe He orders the world by responding to what we do, rather than planning around what we *would* do.

  **Vance:** But that undermines the sovereignty you claim to want to protect. Look, let's return to the "principled" question. Is it principled to say that counterfactuals of freedom are brute? Yes, if you accept that agents are fundamental ontological units. An agent is a thing that generates truth. If Peter is a possible agent, he generates truths about his possible actions. To demand a ground *outside* of Peter (like a causal law or a divine decree) is to deny that Peter is a genuine agent.

  **Thorne:** So the brute truth is the price of libertarian freedom?

  **Vance:** Precisely. If you want libertarian freedom, you must accept that the source of the action is the agent. Therefore, the truth about the action is grounded in the agent. If the agent is merely possible, the truth is grounded in the possible agent. To say "there is no truth until the agent exists" is to say "the agent's nature doesn't include a specific mode of operation until it is actualized." But that makes the nature incomplete.

  **Thorne:** (Pauses, stirring his tea) You're arguing that a complete concept of an individual includes their free choices in all possible circumstances.

  **Vance:** Yes. A Leibnizian complete concept, minus the determinism.

  **Thorne:** But Leibniz was a determinist. He thought the choices followed from the concept.

  **Vance:** I'm saying the choices are *contained* in the concept as exercises of freedom, not as logical deductions. The truth is brute because freedom is primitive. It's not *ad hoc* to treat freedom as primitive; it's the definition of libertarianism. The "Would/Might" worry only holds if you think freedom implies indeterminacy of truth. I'm arguing freedom implies indeterminacy of *causal history*, but not of *truth value*.

  **Thorne:** (Sighs) You've moved the goalpost from "grounding" to "the nature of possible individuals." You're asking me to accept that possible individuals have determinate properties regarding their free will.

  **Vance:** I'm asking you to accept that God knows who Peter is. And if He knows who Peter is, He knows what Peter does.

  **Thorne:** And I'm asking you to accept that knowing *who* Peter is doesn't tell you *what* Peter does until Peter does it. If it did, Peter is a clockwork orange.

  **Vance:** Then we are at an impasse. You see a contradiction between exhaustive knowledge and libertarian freedom. I see a contradiction between exhaustive knowledge and the claim that there is nothing to know.

  **Thorne:** Not nothing to know. Just that the proposition "Peter would deny Christ" lacks a truth value. It's neither true nor false. It's indeterminate.

  **Vance:** And if it's indeterminate, God can't guarantee the Incarnation.

  **Thorne:** Perhaps God guarantees it by being ready to redeem whatever we do.

  **Vance:** (Stands up) That's a different theology, Marcus. But on the metaphysics: I maintain that treating CCFs as brute truths is principled because it respects the agent as the sole source of the action. To demand further grounding is to demand that the agent be determined by something else.

  **Thorne:** And I maintain that treating them as brute truths is *ad hoc* because it assigns truth values to propositions where the ontology required to support them (the acting agent) is explicitly absent. You're getting the truth without the truthmaker.

  **Vance:** The possible agent *is* the truthmaker.

  **Thorne:** And I say a possible agent is a contradiction in terms. There are only actual agents and concepts of agents. Concepts don't act.

  **Vance:** (Smiles wryly) Then I suppose we'll have to agree that our disagreement lies deeper than Molinism. It lies in the metaphysics of possibility itself.

  **Thorne:** (Raises his teacup) To the brute facts, then. Whatever they may be.

  **Vance:** To the truth. However it's grounded.

  *(They drink. The rain continues.)*
