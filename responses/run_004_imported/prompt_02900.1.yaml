      *   **Baron Interpretation:** She has a duty to promote happiness. 2 shifts might be compliant, but if she *could* do 4 without ruining her own happiness, limiting herself to 2 might reveal a lack of full commitment to the moral law. The "extra" shifts aren't *outside* duty; they are a fuller realization of the duty. Calling them supererogatory lets her off the hook psychologically.

  5.  **Adjudicate the Dispute (Staking a Position):**
