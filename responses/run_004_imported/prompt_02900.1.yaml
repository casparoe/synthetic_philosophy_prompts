      *   *Decision:* I will argue that Baron is fundamentally correct: Hill's "latitude" is not supererogation. It is **moral discretion within obligation**. Calling it supererogation confuses the *specification* of the act with the *obligatoriness* of the end. However, I will concede that Hill identifies a crucial feature of Kantian ethics (Merit) that *functions* like supererogation, even if it isn't structurally identical.

  6.  **Drafting the Response:**
