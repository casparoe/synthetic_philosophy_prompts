      *   *Tone Check:* Keep it conversational but rigorous. No "On the one hand/On the other hand" waffling. Pick a lane.

  8.  **Final Polish:** Ensure the distinction between *narrow* (perfect) and *wide* (imperfect) duties is clear. Ensure the distinction between *adopting the end* vs. *performing the act* is central. (This is the key to Baron's argument).

  *(Self-Correction)*: Wait, I need to be careful not to misrepresent Hill. Hill doesn't necessarily claim it's *identical* to standard supererogation, but that it fulfills the *role* of supererogation. Baron argues it fails even that role because it suggests you can "clock out." I will stick with the verdict that Baron is textually and systematically more accurate, but Hill captures the *merit* aspect.

