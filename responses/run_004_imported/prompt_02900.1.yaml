      *   **Hill's View (The "Latitude" Defense):** Imperfect duties (beneficence) have *Spielraum* (playroom/latitude). You must adopt the maxim of beneficence, but you choose *when, how, and how much*. Therefore, there is a baseline of "enough" to be virtuous/compliant. Anything beyond that baseline is meritorious but not strictly required. This looks like supererogation.
      *   **Baron's View (The "Bindingness" Critique):** Latitude $\neq$ Optionality regarding the *extent* of moral worth. The duty is to promote ends of others. While you can choose *which* acts, you can't arbitrarily say "I've done enough." The latitude is about *judgment* in application, not a quota system. Stopping at the minimum is legally permissible but morally suspect if one could do more without sacrifice. True supererogation implies *no duty at all*, whereas wide duty implies *a duty with flexible application*.

  3.  **Analyze the Concept of Supererogation:**
      *   **Ordinary Notion (Urmson/Heyd):**
          1.  Not obligatory (omission is not blameworthy).
          2.  Not forbidden.
          3.  Morally good/praiseworthy.
          4.  Often involves sacrifice.
      *   **Kantian Latitude:**
          1.  Maxim is obligatory (you must be beneficent).
          2.  Specific acts are not determined by law.
          3.  Omission of *specific* acts is not blameworthy, but omission of the *maxim* is.
          4.  Merit (*Verdienst*) is possible within duty.

