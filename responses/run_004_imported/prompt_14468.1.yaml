      *   Closing: The grant referee parallel.

  8.  *(Self-Correction on "Conditional Version")*: The prompt asks me to come down on one side or a "precise conditional version." I will choose the conditional version: The mathematical failure *does* infect the political philosophy, but specifically regarding its *epistemic status* (its claim to be a science), not necessarily its *pragmatic utility*. This honors the physicist's skepticism without committing the genetic fallacy against the political theory itself.

  9.  **Final Review against constraints:**
