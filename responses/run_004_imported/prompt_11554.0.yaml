answer: |-
  This is a superb problem. You have correctly identified the pressure point: if the *foresight* itself (the epistemic condition) is morally valenced, does the Principle of Double Effect (PDE) lose its neutral arbiter? If "knowing" is already a moral judgment, how can we use "knowing but not intending" to *make* a moral judgment?

  Here is the reconstruction of the Thomistic position. The short answer is: **Aquinas would not be embarrassed.** In fact, he would likely argue that the Knobe results (both the intentionality and the epistemic asymmetries) confirm the Thomistic anthropology of the moral act, provided one distinguishes between the *metaphysics of action* and the *phenomenology of moral judgment*.

  Here are the three specific philosophical resources your friar would draw upon to absorb these results without collapsing the PDE.

  ### 1. *Intentio* vs. *Voluntarium* (Solving the Intentionality Asymmetry)

  The Knobe Effect shows that people ascribe "intentionality" to foreseen harms but not foreseen benefits. In modern analytic philosophy, this is often treated as a bug in folk psychology. For Aquinas, it is a feature of how the will operates.

  Aquinas distinguishes strictly between **intention** (*intentio*) and **voluntariness** (*voluntarium*).
  *   **Intention** applies properly to the end and the means chosen to reach that end.
  *   **Voluntariness** applies to anything that proceeds from the will with knowledge of the end.

  In the *Summa* (I-II, q. 6), Aquinas explains that things can be voluntary without being intended. A side effect is *voluntarium in causa* (voluntary in its cause) because the agent wills the cause that produces it. However, it is *praeter intentionem* (outside the intention).

  **The Thomistic Move:**
  Aquinas would argue that the experimental subjects are using the word "intentionally" to do the work of "voluntarily." When the chairman accepts environmental damage to make profit, the damage is *willed* as a cost. It is integrated into the practical reasoning as a *permitted evil*. When the chairman accepts environmental help, the help is *willed* only as a consequence, not as a cost or a means.

  The asymmetry in ordinary language reveals that the human mind naturally binds "intentionality" to **moral responsibility**. We call something "intentional" when we want to hold the agent accountable for it.
  *   **For the Friar:** This does not threaten PDE. PDE is a technical tool designed to *correct* this folk conflation. The fact that the folk conflate them proves why the technical distinction is necessary. The Knobe effect shows that people *feel* the difference in the will's adherence to the outcome. Aquinas would say: "They are sensing the weight of the will, even if their vocabulary is imprecise."

  ### 2. Speculative vs. Practical Knowledge (Solving the Epistemic Asymmetry)

  This is the harder problem, as you noted. The Epistemic Side-Effect Effect (ESE) suggests people say the chairman *knew* the harm would happen but hesitate to say he *knew* the help would happen. If foresight is the neutral baseline of PDE, and "knowledge" is now valenced, the baseline seems corrupted.

  However, Aquinas does not hold a neutral, camera-like theory of knowledge in moral contexts. He distinguishes between **speculative intellect** (knowing what is true) and **practical intellect** (knowing what is to be done).

  *   **Speculative Knowledge:** "If policy X is enacted, CO2 levels rise." (This is cognitively identical in both Harm and Help cases).
  *   **Practical Knowledge:** "This rise in CO2 is a *reason against* acting" vs. "This rise in oxygen is *irrelevant* to my plan."

  For Aquinas, knowledge in the moral act is not just data registration; it is **apprehension under the aspect of the good or evil**. The will commands the intellect to attend to certain things.
  *   **In the Harm Case:** The chairman must *consider* the harm to weigh it against the profit (to satisfy the condition of proportionality, even if he does so selfishly). The harm enters his practical syllogism as a counter-weight. Therefore, it is "known" in the practical sense.
  *   **In the Help Case:** The help is truly incidental. It does not enter the practical syllogism as a reason for or against. It is speculatively true, but practically inert.

  **The Thomistic Move:**
  The ESE does not show that cognitive access differs; it shows that **practical recognition** differs. When people say the chairman "didn't know" about the help, they mean he didn't register it as part of the *action*.
  *   **For the Friar:** This actually *saves* PDE. PDE requires that the side effect be foreseen. But "foreseen" in Thomism means "apprehended as a consequence of the act." The ESE confirms that the human mind naturally distinguishes between consequences that are *integrated into the plan* (harm as cost) and consequences that are *truly incidental* (help as byproduct). The asymmetry in "knowledge" tracks the asymmetry in **volitional uptake**.

  ### 3. *Usus Loquendi* vs. *Veritas Rei* (Ordinary Language)

  You asked if Aquinas would treat ordinary language as evidence or noise. His method is typically: *Videtur* (It seems/People say) $\rightarrow$ *Sed Contra* (But on the contrary) $\rightarrow$ *Respondeo* (I answer).

  He respects *usus loquendi* (usage of speaking) because language reflects the natural concepts of the human mind (*conceptus naturales*). If everyone speaks asymmetrically, there is likely a natural reason for it. However, he does not let language dictate metaphysics.

  *   **The Data:** The Knobe/ESE results show that natural human judgment links knowledge and intention to moral valence.
  *   **The Truth:** The *veritas rei* (truth of the matter) is that the cognitive state might be identical, but the *moral state* is different.
  *   **The Synthesis:** Aquinas would argue that the folk are right about the **moral reality** but imprecise about the **psychological mechanism**. They are detecting that the chairman is *more committed* to the harm (as a cost he is willing to pay) than to the help (as a thing he doesn't care about).

  ### How this informs the Scene

  Your friar should not dismiss the psychology. He should treat it as **empirical confirmation of Scholastic anthropology.**

  **The Trap to Avoid:**
  Do not let the friar say, "Aquinas predicted this." That sounds arrogant and ahistorical.
  Do not let the friar say, "This is irrelevant to moral truth." That sounds obscurantist.

  **The Thomistic Line:**
  The friar should argue that the psychologist has discovered that **knowledge in human action is not neutral.** It is shaped by the will.
  *   **On "Intentionally":** "You have found that people reserve the word 'intentional' for what the agent has taken responsibility for. In my tradition, we call that 'voluntary.' We distinguish it from 'intended' precisely so we can account for the cases where you feel blame without aim."
  *   **On "Knew":** "You suggest the asymmetry in 'knowledge' threatens the neutrality of foresight. I suggest it reveals that moral foresight is never neutral. To 'know' a consequence in a moral act is to register it as a good to be pursued or an evil to be weighed. The chairman 'knew' the harm because he had to weigh it against his profit. He did not 'know' the help in the same way because it required no weighing. Your subjects are detecting the difference between **practical apprehension** and **speculative data**."

  ### Would this embarrass the Framework?

  No. The PDE relies on the distinction between *what is intended* and *what is permitted*.
  *   The Knobe effect shows people struggle to linguistically separate "permitted" from "intended" when the permission involves evil.
  *   The ESE shows people struggle to separate "practical knowledge" from "speculative knowledge" when the knowledge involves evil.

  This suggests that **evil binds the will more tightly than good does.** (A very Augustinian/Thomistic notion: evil is a privation, but it demands a response; good can be ignored).
  *   If I harm, I must *justify* it (even to myself).
  *   If I help, I need not justify it.

  Therefore, the "knowledge" of harm is more salient because it triggers the need for justification. The PDE is the tool that formalizes this justification. The experimental data shows the *need* for the tool; the Thomistic framework *is* the tool.

  ### Summary for the Friar's Voice

  1.  **Validate the Psychologist:** "You have shown that the human mind does not process moral consequences like a camera recording data. It processes them like a judge weighing evidence."
  2.  **Reclaim "Knowledge":** "In my tradition, we say the will commands the intellect. The chairman 'knew' the harm because his will forced his intellect to attend to it as a cost. He did not 'know' the help because his will allowed his intellect to ignore it as irrelevant. Your subjects are right: in the moral order, those are different kinds of knowing."
  3.  **Defend PDE:** "This is why we need a technical distinction between intention and foresight. Ordinary language collapses them because ordinary judgment collapses responsibility and aim. My framework does not deny your data; it explains why the data is asymmetric."

  This allows your friar to be formidable not by rejecting science, but by subsuming it into a deeper metaphysics of action. He treats the Knobe effect not as a refutation of objective morals, but as a map of how the human will actually distorts (or reveals) reality.
