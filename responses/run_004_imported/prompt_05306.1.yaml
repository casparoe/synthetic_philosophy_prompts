  9.  **Final Polish:** Check the rhythm. Ensure it sounds spoken, not read. Make sure the transition from the crime to the humanity feels earned. (Self-Correction: Make sure not to sound *too* defensive of the crime. The crime was wrong. The man was loved. Hold both.)

