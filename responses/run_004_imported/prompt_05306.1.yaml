answer: |-
  This is a delicate tightrope walk. The goal is to honor the man without sanitizing the history, and to acknowledge the pain caused without turning the eulogy into a courtroom confession.

  The strategy here is to focus on **intimacy**. To forge a drawing perfectly, you have to understand the original artist better than they understood themselves. You have to love the work enough to disappear into it. That is a form of devotion, even if the application of it was flawed.

  Here is a draft that aims for that nuance. It acknowledges the crime, respects Dana's position, and finds the humanity in his obsession.

  ***

  **Eulogy for [Uncle's Name]**

  Thank you all for being here.

  For those who don't know, I write novels for a living. Which, apparently, makes me the designated speaker for the family. People assume that because I work with words, I can arrange them in a way that makes difficult things sound simple. Or at least, make difficult things sound nice.

  But anyone who knew my uncle [Name] knows that he didn't have much patience for things that were simple. And he certainly didn't have patience for things that were merely "nice." He was interested in what was true. And the truth about him is... complicated.

  We are gathered to mourn a man who lived a life of contradictions. To some, he was the life of the party, a man with an encyclopedic knowledge of art history and a twinkle in his eye. To others, he was a source of deep pain and betrayal. To the world, eventually, he was a criminal. But to those of us who knew him at the kitchen table, he was simply [Name]. And he was ours.

  It is no secret that [Name]'s profession was unconventional. He spent twenty years drawing. He spent twenty years mastering the hand of the Old Masters. He could mimic the stroke of a pen from 1650 better than anyone living. He loved to tell the story of Han van Meegeren, the Dutch forger who, when accused of selling national treasures to the Nazis, proved in open court that he had painted them himself. He loved that story not because van Meegeren beat the charge, but because the experts still couldn't believe a fake could move them so deeply.

  [Name] believed that if you could make someone feel the beauty of a Vermeer, even if the signature wasn't Vermeer's, then you had still created something beautiful.

  I know that is a dangerous philosophy. I know that it is a philosophy that caused real harm.

  There are people in this room, people he loved very much, who feel the sting of his deceptions most sharply. I cannot stand here and tell you that the drawings were worth what they were sold for. They weren't. I cannot tell you that the trust he broke wasn't significant. It was. Money can be replaced; trust is a much harder currency to earn back. If I speak for the family when I say that we are all carrying different weights today, I hope you know I am including myself in that.

  But I also cannot stand here and pretend that the skill wasn't real. Because it was.

  I have watched him work. I have seen the silence that fell over him when he picked up a nib. To copy a master that well, you cannot just be a con man. A con man looks for the shortcut. [Name] looked for the understanding. He had to understand the pressure of the hand, the speed of the ink, the breath of the artist. He had to love the original work so much that he was willing to erase himself to let it speak through him.

  In a way, he spent his life trying to get close to genius by becoming a ghost inside it.

  That is a lonely way to live. To be so talented that you can be anyone, except yourself. I think that is why he loved us so much. Because with us, he didn't have to be Rembrandt. He didn't have to be Dürer. He could just be the uncle who told bad jokes and poured the wine too high and listened when we talked about our days.

  He is gone now. The drawings remain, scattered in collections and vaults, carrying his secret in their fibers. Some will look at them and see a crime. Some will look at them and see a masterpiece.

  But I will remember the hand that made them. I will remember that he taught me that beauty is not just in the signature, but in the attention. He paid attention. He looked at the world, and at art, and at us, with a intensity that was overwhelming.

  He made mistakes. Great, costly, human mistakes. But he was not a mistake. He was a man who loved beauty so much he tried to manufacture it, and who loved his family enough to hope we'd eventually understand the difference between the art and the artist.

  We don't have to agree on the legacy to agree on the loss. We are all poorer for his absence. And I think, if he were here, looking out at this room, seeing the mix of love and grief and frustration on our faces, he would say that was the most honest composition he'd ever seen.

  Rest in peace, [Name]. You can put the pen down now.
