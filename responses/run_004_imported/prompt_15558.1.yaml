answer: |-
  You have stumbled upon one of the most classic and important tensions in the theory of information value. The short answer is: **No, Hirshleifer's result does not prove Good's theorem false.** However, your friend is correct that Hirshleifer identifies a crucial boundary condition that your dissertation must acknowledge to be philosophically robust.

  Good's theorem and the Hirshleifer effect operate in different formal domains. Good's theorem is a result in **single-agent decision theory**, whereas the Hirshleifer effect is a result in **general equilibrium theory** (or game theory). The apparent contradiction dissolves once you examine the assumptions regarding the stability of the action space and the utility function.

  Here is a breakdown of why Hirshleifer is not a counterexample to Good, how the literature distinguishes them, and how you should adjust the opening of your chapter.

  ### 1. The Domain Mismatch: Decision Theory vs. Equilibrium

  **Good's Theorem (1967)**
  Good's proof relies on the convexity of the maximum expected utility function. It assumes a single agent facing "Nature." The structure of the decision problem is fixed:
  1.  There is a fixed set of states $S$.
  2.  There is a fixed set of actions $A$.
  3.  There is a fixed utility function $U(a, s)$.
  4.  The agent can observe a signal $E$ cost-free before choosing $a \in A$.

  Good proves that $E[U(\text{act after } E)] \geq E[U(\text{act before } E)]$. The key is that the availability of the action $a$ and its payoff structure $U(a, s)$ do not change depending on whether the signal was observed. The agent simply picks a better mapping from states to actions.

  **The Hirshleifer Effect (1971)**
  Hirshleifer's model involves **multiple agents** interacting in a market.
  1.  Agents are risk-averse and wish to insure against states of the world.
  2.  Insurance contracts are written *ex ante* (behind a veil of ignorance).
  3.  If information becomes public *before* contracts are written, the market for insurance collapses (because no one will insure a known risk).

  In this scenario, the **set of feasible actions changes**. Under ignorance, the action "purchase insurance" is available and rational. Under knowledge, the action "purchase insurance" is either unavailable (no one will sell) or irrational (the premium equals the payout).

  Therefore, Hirshleifer does not show that a Bayesian agent conditionalizing on evidence makes a mistake. He shows that the **availability of information can alter the equilibrium structure of a multi-agent interaction**, effectively removing high-utility actions (like risk-sharing) from the feasible set.

  ### 2. Why It Isn't a Counterexample

  To count as a counterexample to Good's theorem, Hirshleifer would need to describe a single agent who, given a fixed decision problem with fixed actions and utilities, chooses to observe a free signal and then conditionalizes, only to end up with lower expected utility than if they had ignored the signal.

  That is not what happens in Hirshleifer's model. In Hirshleifer's model:
  *   **Ex Post (after info):** The agents conditionalize correctly. Given the new information and the new market constraints (no insurance), they act optimally. They are not making a Bayesian error.
  *   **Ex Ante (before info):** The agents prefer a world where the information *does not exist*.

  Good's theorem addresses the **instrumental value of information** given a decision problem ("Should I look at the test result before deciding on treatment?"). Hirshleifer addresses the **constitutive value of information regimes** ("Should we build a world where test results are public before insurance is sold?").

  You can consistently hold both views:
  1.  **Good:** If I am in a market where insurance is available, and I am offered a free signal, I should take it (assuming it doesn't void my insurance).
  2.  **Hirshleifer:** We should design social institutions such that certain information remains hidden until after insurance contracts are signed, because making it public destroys the market.

  ### 3. How the Literature Restricts Good's Theorem

  The formal epistemology and decision theory literature typically restricts Good's theorem using the following caveats, which you should incorporate into your chapter:

  **A. The Fixed Action Space Assumption**
  Good's theorem assumes the set of available acts $A$ is independent of the information state. In strategic contexts (games) or institutional contexts (markets), the available acts often depend on what other agents know. If my knowing $p$ causes you to refuse to trade with me, my action space has shrunk. The literature classifies Good's theorem as holding for **problems against Nature**, not **games against other optimizers**.

  **B. The Utility Function Assumption**
  Good assumes $U(a, s)$. In Hirshleifer cases, utility is effectively $U(a, s, I)$, where $I$ is the information distribution among agents. If the utility of an action depends on *others' ignorance* (e.g., the value of an insurance contract depends on the insurer not knowing the risk), Good's theorem does not apply directly because the utility function itself shifts with the information regime.

  **C. Private vs. Public Information**
  Good's theorem is agnostic about whether the signal is private or public, provided the decision problem remains fixed. However, in multi-agent settings, **public** information often has different strategic properties than **private** information.
  *   If the signal is private, I can use it to optimize my action without necessarily alerting counterparts (though adverse selection may still arise).
  *   If the signal is public (Hirshleifer's case), it coordinates expectations in a way that can eliminate Pareto-improving trades.
  *   *Literature Note:* See **Blackwell (1951)** for the foundational comparison of experiments, and **Savage (1954)** for the personalistic framework where Good's theorem sits. For the game-theoretic limits, see **Aumann (1976)** on agreeing to disagree or **Geanakoplos & Polemarchakis (1982)** on the limits of speculation.

  ### 4. Advice for Your Dissertation

  You do not need to drop your opening move, but you must qualify it. Presenting Good's theorem as a *decisive answer* to the justification of inquiry is too strong if you ignore strategic contexts. However, for a dissertation in formal epistemology, you can argue that the **primary** normative force of Bayesianism lies in the single-agent context, or that the Hirshleifer cases are instances of *institutional failure* rather than *epistemic irrationality*.

  **Suggested Revision Strategy:**

  1.  **State Good's Theorem Clearly:** Present it as the standard for individual rationality in fixed decision problems.
  2.  **Acknowledge the Boundary:** Add a subsection or a robust footnote titled "Strategic Limits on the Value of Information." Acknowledge Hirshleifer (1971) explicitly.
  3.  **Reframe the Claim:** Instead of claiming Good's theorem proves agents should *always* want more evidence, claim that Good's theorem proves agents should always want more evidence **ceteris paribus**, specifically holding the **feasibility of actions constant**.
  4.  **Philosophical Spin:** You can argue that the Hirshleifer effect actually supports the need for *epistemic norms* regarding information sharing. The problem isn't that the agents processed the evidence irrationally; it's that the information became public *at the wrong time*. This shifts the normative burden from "don't seek evidence" to "design institutions that sequence evidence and action correctly."

  **Sample phrasing for your chapter:**
  > "While Good's theorem establishes that free evidence is never instrumentally harmful for a single agent facing a fixed decision problem, it is important to note the boundary conditions identified in the economic literature. As Hirshleifer (1971) demonstrated, in multi-agent strategic contexts, the public availability of information can alter the feasible set of actions (e.g., by collapsing insurance markets), thereby reducing ex ante welfare. However, this does not refute the Bayesian norm of conditionalization; rather, it highlights that the *social value* of information depends on institutional structures that preserve the feasibility of cooperative acts. For the individual epistemic agent, assuming the action space remains stable, Good's conclusion holds: rationality demands the utilization of all available cost-free evidence."

  ### Summary
  Your friend has identified a vital limitation, but not a falsification. Good's theorem remains mathematically sound within its domain (single-agent decision theory). Hirshleifer's result applies to a different domain (general equilibrium with endogenous action spaces). By explicitly scoping your claim to non-strategic contexts or fixed action spaces, you preserve the power of Good's theorem while demonstrating scholarly awareness of the broader literature on the value of information.
