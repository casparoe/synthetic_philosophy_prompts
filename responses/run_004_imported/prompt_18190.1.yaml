      *   **Dewey's Counter (The Expert Trap):** Acknowledge the complexity but challenge the solution. If experts rule, who tells the experts what *values* to pursue? Efficiency isn't a value in itself.
      *   **Lippmann's Rebuttal (Insulation):** Experts need insulation from the "bewildered herd." Emotions cloud judgment.
      *   **Dewey's Counter (Communication/Community):** Democracy isn't just voting; it's associated living. The problem isn't the people, it's the lack of communication. We need the "Great Community."
