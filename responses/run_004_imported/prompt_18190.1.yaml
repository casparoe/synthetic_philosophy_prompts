answer: |-
  **Setting:** *A quiet corner of the Algonquin Hotel, New York City. Late autumn, 1927. The air is thick with cigarette smoke and the clinking of ice in glasses. Walter Lippmann sits with his back to the room, staring at a notepad. John Dewey sits across from him, leaning forward, hands clasped.*

  **Lippmann:** (Tapping his cigarette ash) Let's stop pretending, John. The theory is beautiful, but the machinery is broken. We are trying to run a twentieth-century industrial state with a nineteenth-century theory of the citizen. We assume a man who works twelve hours in a factory, or manages a ledger, or tills a soil, can also master the intricacies of the tariff, the balance of trade, and the geopolitical tensions in the Balkans. It is absurd. The "omnicompetent citizen" is a myth.

  **Dewey:** I grant you the diagnosis, Walter. I do not deny that the public seems lost. The Great Society of machines and railways has outpaced the Great Community of human understanding. But your conclusion—that we must simply accept the citizen's incompetence and hand the keys to a bureau of insiders—that is where we part ways. You treat the symptom by killing the patient.

  **Lippmann:** I treat the symptom to save the body politic from collapsing under its own weight! Look at the news. What does the citizen see? He does not see reality. He sees a "pseudo-environment." He sees stereotypes, headlines, manufactured crises. He reacts to shadows on the wall. If you base sovereignty on that reaction, you get demagoguery. You get chaos. I am arguing for a division of labor. Let the experts analyze the facts. Let the bureaus manage the complexity. The public's role should be limited to aligning themselves with one party or another when the system clearly fails. They are the spectators, not the players.

  **Dewey:** Spectators? A spectator can be entertained, or distracted, but a spectator cannot *govern*. If you relegate the public to merely choosing between competing elites every few years, you strip democracy of its moral core. You say hand it to the experts. But tell me, Walter: Experts are excellent at answering "how." They are silent on "why."

  **Lippmann:** (Pauses) The "why" is determined by the broad values of the nation.

  **Dewey:** Whose values? If the public is a "phantom," as you call it, incapable of grasping the real issues, how can they possess the wisdom to set the values? If the expert class decides the means *and* interprets the ends because the public is too bewildered to understand the consequences, you have not saved democracy. You have built a benevolent oligarchy. And when the experts disagree amongst themselves—as they will—the public will have no capacity to adjudicate because you have told them their judgment is worthless.

  **Lippmann:** I do not say their judgment is worthless. I say it is *overburdened*. There is a difference. A man cannot be a judge of evidence he does not comprehend. If I am sick, I do not vote on the surgery; I consult a surgeon. Why is the state different? The modern state is a complex organism. It requires insulation from the emotional tides of the masses. If we let the "bewildered herd" dictate the nuance of foreign policy, we invite disaster.

  **Dewey:** Because you view knowledge as a static commodity that the experts possess and the people lack. But knowledge, in a democracy, must be created through communication. The problem isn't that people are stupid, Walter. It's that the conditions of associated living have been fractured. The Great Society created by steam and electricity has not yet become a Great Community. People feel the consequences of distant actions—the price of wheat, a war overseas—but they cannot trace the causes.

  **Lippmann:** Precisely. They cannot trace the causes. So they invent conspiracies. They listen to the loudest voice.

  **Dewey:** So we must improve the tracing! We must improve the communication. You want to wall off the experts to protect them from the public. I say we must weave the public into the inquiry. If the experts make a decision in a vacuum, even a correct one, it lacks social force. It becomes an order, not a policy. When the public does not understand the *method* of the decision, they cannot trust the outcome. They see only the hardship. That is where the backlash comes from. Not from inherent stupidity, but from exclusion.

  **Lippmann:** You sound like you want to turn every citizen into a social scientist. It is a romantic notion. Time is a luxury we do not have. The world is burning. We need administration that works *now*. You speak of this "Great Community." Is that a place? A voting bloc? How does it function without bogging down every tariff adjustment in a town hall debate?

  **Dewey:** It is not a town hall. It is a state of mind. It is the assurance that there is free and full interplay of ideas. If you hand governance to the bureaus, you stop that interplay. You create a caste system. The expert becomes the priest, and the data becomes the scripture. And just as the Reformation broke the church because the laity demanded access to the text, the public will eventually revolt against the technocrats. Not because they can do the math better, but because they refuse to be subjects in their own house.

  **Lippmann:** (Leans back) So we risk efficiency to preserve dignity?

  **Dewey:** We risk efficiency to preserve *agency*. Without agency, there is no growth. And without growth, the society stagnates. You fear the public's ignorance. I fear the public's apathy. Your system encourages apathy. It tells the man in the factory, "Your mind is not needed here, only your labor." My system asks, "How do we make the factory, the tariff, and the school part of a shared life he can understand?"

  **Lippmann:** But how do you get there? The forces of concealment are too strong. Propaganda, censorship, the sheer volume of information. The public is deafened. To wait for them to awaken is to wait for the tide to turn by wishing. I am proposing a life raft. A way to steer the ship through the storm until the waters calm.

  **Dewey:** And I am telling you that a life raft is not a destination. If you steer the ship without the passengers knowing the course, they will mutiny when the food runs short. You say the public is a phantom. I say the public is *eclipsed*. It is there, Walter. It is formed whenever the indirect consequences of joint action are recognized. Our job is not to manage the phantom. It is to restore the light.

  **Lippmann:** (Sighs, extinguishing his cigarette) You place a heavy burden on education, John. You assume human nature is malleable enough to care about the common good when its immediate survival is at stake.

  **Dewey:** And you place a heavy burden on the expert, Walter. You assume human nature is noble enough to wield power without accountability.

  **Lippmann:** (A faint smile) It seems we are both guilty of optimism. Mine is that experts will remain disinterested. Yours is that citizens will become philosophers.

  **Dewey:** (Smiling back) Perhaps. But I would rather bet on the capacity of people to learn than on the virtue of rulers to restrain themselves.

  **Lippmann:** Then let us hope the lesson is learned before the schoolhouse burns down.

  *(Lippmann signals for the check. Dewey picks up his hat. The argument remains unresolved, hanging in the smoke between them.)*
