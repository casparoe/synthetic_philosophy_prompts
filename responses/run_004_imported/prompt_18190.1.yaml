prompt: |-
  so for my ap gov research paper i went down a rabbit hole on the Dewey vs. Walter Lippmann fight about democracy from the 1920s and its honestly way more interesting than anything we actually cover in class. can you write me a dialogue between the two of them arguing about whether ordinary citizens can actually self-govern? i want the Lippmann character to make his real case -- that the "omnicompetent citizen" democracy assumes is basically a myth and that the public is more like a phantom, so the hard stuff should get handled by trained experts/bureaus -- and i want the Dewey character to actually engage with that instead of just saying "democracy good." like he should explain why he thinks just handing things over to experts doesn't even solve the problem lippmann is pointing at, and what he means by needing a "Great Community" instead. make them respond to each others specific points instead of talking past each other, neither one should just win easily
