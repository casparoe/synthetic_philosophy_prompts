answer: |-
  "You claim wine is a whetstone for character," said Kallias. "I say it is a file that wears the blade away. You speak of Sparta as if you know us. We harden the boy against pain so he does not flee. You soften the man with pleasure so he does not… what? Feel shame?"

  "Not merely shame," the host replied, leaning forward, cup still full. "Fear. The Athenian Stranger says wine induces a fear much like battle. The fear of losing oneself. If a young man can hold his tongue when the wine urges him to shout, he has practiced victory over a tyrant within his own blood. Is that not analogous to holding the line when fear urges you to run?"

  "It is not analogous because the enemy is different," Kallias said. "In battle, the enemy is outside. The fear is real. If I flee, I die. In your symposium, the enemy is the cup itself, and the threat is only that you might look foolish. You are testing resistance to comfort, not danger. Courage and restraint are not the same virtue."

  "但它们 are kin," the host insisted. "Both require reason to rule passion. And consider the older man. Iron becomes brittle with age. If you strike it, it snaps. You must heat it to make it pliable again. Wine is the fire. It loosens the temper of us old men, makes us teachable, less prone to anger. Without it, I am rigid. With it, I am moldable."

  Kallias laughed, a dry sound. "And who benefits from this theory? The man who loves wine, who is old, who holds the cup? It is convenient, is it not? To declare your weakness a medicinal necessity. You say the fire softens the iron, but I say it merely melts the shape away. You argue that a sober Symposiarch watching the drinker solves the problem. But if the drinker's reason is clouded, who is exercising the virtue? The watcher? Then test the watcher. The drinker is merely a puppet dancing on a string of grape juice."

  "The drinker must struggle," the host said, his voice tightening. "If I pour too much, the test fails. If I pour too little, it fails. It is a drug, yes, but so is education. We frighten children to teach them courage. We tempt them to teach them restraint. Why is the cup different?"

  "Because when you frighten a child, you do not bind his hands," Kallias shot back. "You impair the very faculty you claim to be strengthening. You say wine reveals the true man. I say it reveals the beast, and you call taming the beast a virtue. But if the beast is drugged into submission, where is the honor? You speak of the Stranger's laws as if they are divine, but they sound like the rationalizations of a city that loves comfort pretending it loves wisdom."

  "Is it false because I love it?" the host asked. "If an old man finds relief in the cup, and that relief makes him gentler to his slaves, kinder to his sons, does the motive matter? You Spartans endure pain because you love honor. Is that not also a pleasure? You endure the whip to feel proud. I drink to feel gentle. Both are using sensation to alter the soul."

  Kallias paused, his brow furrowing. "We endure pain to master it. You indulge pleasure to excuse it. There is a difference in direction."

  "Perhaps," the host said, finally setting his cup down. "But tell me this, Spartan. When you stand in the phalanx, shoulder to shoulder, do you feel entirely sober? Or does the blood sing in your ears, does the heat make you light-headed, does the spirit lift you out of your careful mind? If war itself is a kind of intoxication, why is it virtue to practice for it with pain, but vice to practice for it with wine?"

  Kallias opened his mouth, then closed it. He looked at the wine, dark in the lamp light. "Because in the phalanx, if I lose my reason, my neighbor dies. Here, if you lose yours, you only embarrass yourself. The stakes define the virtue, not the sensation."

  "But who decides the stakes?" the host asked softly. "The state? Or the man himself?"

  "The state," Kallias said.

  "And if the state is wrong?"

  "Then we fall," Kallias said. "But we fall standing. You propose we fall seated, comfortably, claiming we meant to sit all along."

  "Or perhaps," the host said, picking up the cup again, "we learn that sometimes, sitting is the harder thing to do."

  "Then drink," Kallias said. "And I will watch. And we will see who is truly standing."
