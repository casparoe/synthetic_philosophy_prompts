  ***

  ### A Note for the Journalist (Off the Record)
  Since you asked for an "outside read" before your interview later this week: **The student's answer in Part (b) contains the exact error you need to watch out for.**

  It is very common for people to conflate Kornhauser/Sager with List/Pettit because they are often cited together.
  *   **Kornhauser & Sager (Law):** Discovered the *Doctrinal Paradox* in actual court cases (the "real world" observation).
  *   **List & Pettit (Philosophy/Econ):** Formalized the *Discursive Dilemma* as a general theorem of logic and social choice (the "mathematical" proof).

  If the professor told the student that List & Pettit coined "Doctrinal Paradox," the professor might be glossing over the legal history in favor of the formal logic. If the student got that from their own research, they made a common citation error. Either way, for your piece, distinguishing between the **legal observation** (courts actually do this) and the **logical theorem** (groups *must* do this under certain conditions) will make your reporting much sharper. The student's answer blurs that line, which is why I docked points.

  Good luck with the interview. If she brings up Arrow's Impossibility Theorem, ask her if she thinks AI models suffer from "preference aggregation" problems or "judgment aggregation" problems—it's a great follow-up.
