          1.  *Natural:* What *could* happen (Possibilities).
          2.  *Middle:* What *would* happen (Counterfactuals). *Key point: God doesn't decide this; He just knows it.*
          3.  *Free:* What *will* happen (Actualities). *Key point: God decides to actualize this world.*
      *   **Why it's not "Learning":**
