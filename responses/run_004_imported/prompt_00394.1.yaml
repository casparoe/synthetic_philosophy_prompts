prompt: |-
  so I was reading about Molinism for my theology elective and it talked about God having "natural knowledge," then "middle knowledge," then "free knowledge" -- and since middle knowledge is literally in the middle, doesnt that mean God is actually learning stuff about what we'll choose as time goes on, kinda like he's updating his knowledge as events unfold? that's how i pictured it but my teacher said that's not really right and i'm not sure why
