answer: |-
  You are right to feel unsettled, and your coworker is giving you the cynical "shut up and calculate" answer that scientists often use when they don't want to explain the philosophy of science. Your supervisor is giving you the historical context, but not the biological justification.

  Here is the direct answer you are looking for: **The 95% number is a human convention, but the clusters it identifies are biologically real.**

  Your coworker is half-right: "Species" is a concept we impose on nature. Nature does not come with labels. However, he is wrong to imply that there is *no* structure there. The 95% cutoff isn't a random number pulled from thin air; it is a statistical translation of a much older empirical observation about how bacteria behave.

  Here is the breakdown of why that number exists, why it works, and why this problem isn't unique to bacteria.

  ### 1. Where the 95% Actually Comes From
  Your supervisor told you it "stuck around" from older methods. That is true, but she left out *why* the older method worked.

  Before we could sequence whole genomes cheaply, microbiologists used a technique called **DNA-DNA Hybridization (DDH)**. They would take the DNA from two bacterial strains, melt them apart, and mix them to see how well they re-bonded.
  *   If they bonded very well, the strains were closely related.
  *   If they bonded poorly, they were distant.

  In the 1980s and 90s, microbiologists noticed an empirical threshold: If two bacterial strains showed **70% or higher** hybridization in DDH, they almost always shared the same physical traits (phenotype). They metabolized the same sugars, they had the same cell wall structures, and crucially for you, they had the same pathogenicity. If they were below 70%, their physical behaviors usually diverged.

  When genome sequencing became cheap, scientists compared DDH results to **Average Nucleotide Identity (ANI)**. They found a strong correlation: **70% DDH roughly equals 95–96% ANI.**

  So, the 95% cutoff is not arbitrary in the sense of being random. It is a **calibration**. It is the genomic equivalent of the 70% DDH rule, which was established because that is the point where bacterial populations stop behaving like the same "thing" in a lab setting.

  ### 2. Is There a "Real" Line? (The Cluster Problem)
  You asked if there is a "principled fact" about when populations count as different. This is the core philosophical battle in taxonomy: **Realism vs. Nominalism.**

  *   **Nominalism (Your Coworker):** Species are just names we give to groups for convenience.
  *   **Realism (You):** Species are distinct, natural units that exist independently of us.

  In bacteria, the truth is in the middle, and it comes down to **ecological niches.**

  Bacteria do not evolve in a smooth, continuous line. They evolve into **clusters**. Because bacteria adapt to specific environments (a specific host gut, a specific soil temperature, a specific food source), natural selection pulls them into distinct groups. A bacterium adapted to survive in a human intestine is genetically diverging from one adapted to survive in soil.

  Over time, these groups become distinct "clouds" in genetic space. There is a lot of variation *within* the cloud, but there are gaps *between* the clouds.
  *   **The Reality:** The clouds (the species) are real biological phenomena caused by ecological adaptation.
  *   **The Arbitrariness:** Drawing a line at exactly 95% to define the edge of the cloud is the human convention.

  **The Color Analogy:**
  Think of the visible light spectrum. Is "Red" a real thing? Physically, it's just a wavelength. There is no point where physics says "this is red" and "this is orange." The line is arbitrary. However, human perception clusters those wavelengths into distinct categories. If you tell a graphic designer to "make it red," they know what you mean, even if the boundary between red and orange is fuzzy.

  Bacterial species are the same. The 95% line is where we decided to draw the border between "Red" and "Orange" because, historically, that's where the chemical properties (phenotypes) tended to change.

  ### 3. Is This Just a Bacteria Problem?
  No. The Biological Species Concept (interbreeding/fertile offspring) you learned in school is leaky everywhere, not just in bacteria. It is arguably the worst definition for large swathes of the tree of life.

  *   **Plants:** Many plant species hybridize freely and produce fertile offspring (oaks, willows, ferns). By the school definition, many oak trees should be the same species, but ecologically and genetically, they are distinct.
  *   **Animals:** "Ring species" exist (like certain salamanders or gulls) where Population A can breed with B, B with C, and C with D, but A cannot breed with D. Are they one species or four? The BSC breaks down.
  *   **Asexual Animals:** Bdelloid rotifers are animals that haven't sexually reproduced in millions of years. They have no "interbreeding," yet we classify them into species based on morphology and genetics.

  The "interbreeding" definition works well for mammals and birds (the things humans notice most), but it fails for almost everything else. You have stumbled onto the open secret of biology: **Species definitions are tools, not laws of physics.**

  ### 4. Why This Matters for Your Job
  You work in food safety. This is where the "arbitrary" line becomes practically real.

  If you sequence a sample and it is 98% identical to *Listeria monocytogenes*, you know it will likely behave like *L. monocytogenes*. It will survive in the fridge, it will be pathogenic to humans, and you need to recall the food.

  If you find something that is 90% identical, it might be a different genus entirely. It might be harmless.

  The 95% rule is a **predictive threshold**. It is the point where we can no longer confidently predict that Strain B will behave like Strain A. In your context, "Species" effectively means **"A group of organisms similar enough that we can assume they share the same safety risks."**

  ### The Verdict
  *   **Your Coworker:** Philosophically correct, but practically unhelpful. Yes, it's a filing system, but it's a filing system based on real biological clustering.
  *   **Your Supervisor:** Historically correct. The number comes from the DDH standard.
  *   **You:** Biologically insightful. You are right that there *should* be a reason, and there is: it's about phenotypic coherence and ecological niches.

  **The Bottom Line:**
  The 95% cutoff is a human-drawn line, but it is drawn around a real biological mountain. The mountain exists (the distinct bacterial populations); the contour line on the map (the 95% ANI) is the convention we use to navigate it.

  Don't let the coworker's cynicism win. You are doing real science. You are using a genomic proxy to identify ecologically distinct units that have real-world consequences for human health. The line is fuzzy, but the danger isn't.
