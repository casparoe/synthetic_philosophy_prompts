      *   *Earman's Strength:* It highlights that Bayesianism isn't a magic box. If you have to put in "logical learning" by hand, Bayesianism isn't doing the heavy lifting.
      *   *Earman's Weakness:* It might be too demanding. If Bayesianism + a plausible model of logical learning works, isn't that a victory? Why does the logical learning part *have* to be Bayesian?

  6.  **Develop a Position (Which is more convincing?):**
