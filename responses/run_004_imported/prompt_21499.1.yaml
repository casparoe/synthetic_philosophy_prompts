  2.  **Deconstruct the Problem of Old Evidence (POE):**
      *   *Standard Bayesianism:* $P(H|E) = P(H \land E) / P(E)$. If $E$ is known, $P(E) = 1$. Then $P(H|E) = P(H)$. No confirmation.
      *   *Historical Case:* Einstein and Mercury's perihelion. $E$ (Mercury's anomaly) was known before $H$ (GR) was formulated. Yet $E$ confirmed $H$.
      *   *The Tension:* Bayesian conditionalization seems to forbid learning from old evidence, but scientific practice allows it.

  3.  **Analyze Response 1: Garber's Solution:**
      *   *Mechanism:* Drop logical omniscience. Agents don't know all logical consequences of their beliefs.
      *   *New Evidence:* The evidence isn't $E$ (Mercury's orbit), but $E^*$: "H entails E" (or "H explains E").
      *   *Update:* Conditionalize on $E^*$. Since the agent wasn't certain that $H \to E$, learning this connection *can* raise $P(H)$.
      *   *Formalism:* Requires a language that includes sentences about logical relations (e.g., $P(H \to E)$).

  4.  **Analyze Response 2: Earman's Critique:**
      *   *Source:* *Bayes or Bust?* (1992).
      *   *Argument:* Garber's solution requires a probability function over a language containing logical claims. But standard Bayesian axioms assume logical truths have probability 1. If we relax that, we need a new normative account of how to assign probabilities to logical claims ($P(H \to E)$).
      *   *The "Relocation":* Instead of asking "How does $E$ confirm $H$?", we ask "How does learning $H \to E$ confirm $H$?" Earman argues this is just as mysterious or requires a separate theory of logical learning that Bayesianism doesn't provide. It saves the *form* of Bayesianism but loses the *substance* of why it explains confirmation.

  5.  **Evaluate and Compare:**
