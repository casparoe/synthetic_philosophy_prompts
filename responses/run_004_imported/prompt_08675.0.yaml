answer: |-
  Good morning. Thank you all for being here.

  For those of you who knew Alan only as the grandfather who told stories about trains, or the neighbor who borrowed sugar, you know he was a kind man. For those of us who knew him in the newsroom, you know he was a ruthless one. He was my first editor. He was the one who taught me that clarity is a moral obligation. And on Tuesday, at eighty-four, he died.

  Most of you are here to say goodbye to a great editor. And he was. But a few rows back, there are people from the philosophy seminar he audited for fifteen years after he retired. Alan knew you were there. And he knew that if I stood here and reduced his mind to a platitude, you would roll your eyes. So, I'm going to try to talk about Alan as he actually was, which means I have to talk about Leibniz.

  I know. A eulogy is not the place for metaphysics. But Alan didn't separate his life from his ideas. He spent his twenties and thirties in the worst places on earth. He covered wars where the only law was violence. He covered famines where children starved while grain rotted in silos. He saw the absolute floor of human suffering.

  And then, he came home, switched to the science beat, and became a devotee of Gottfried Wilhelm Leibniz.

  Now, pop culture tells us Leibniz believed we live in the "best of all possible worlds," which people hear as "everything is wonderful" or "everything happens for a reason." Alan would correct you on both counts, usually at a bar, usually with a finger in the air.

  He would tell you that "best" did not mean "happiest." It did not mean "least suffering." To Alan, "best" meant something like maximum variety of phenomena under the simplest possible laws. He found that beautiful. I still find it a little cold. But I understand why he held it.

  Because Alan knew that the world is messy. He had seen the mess. He knew that suffering exists. His version of the "best possible world" wasn't a promise that pain would be erased. It was a commitment that the pain was *real*, and that the universe was complex enough to contain it, and that our job was to find the simple, clear laws—the truth—that could describe it without lying.

  That was how he edited. He never asked me to make a story happier. He asked me to make it truer. He wanted the maximum variety of the story's reality captured under the simplest possible headline.

  The second thing he would correct you on was fate. He couldn't stand the phrase "everything happens for a reason." His whole point was that it *didn't* have to happen this way. The world is contingent. Other worlds were genuinely possible. This one just wasn't ruled out.

  I think that mattered to him because of what he saw in his twenties. If you tell a grieving mother that her child's death happened for a "reason," you are insulting her. You are saying it was necessary. Alan believed it was not necessary. It was a tragedy. It was a possibility that became actual. And because it didn't *have* to be this way, we have a responsibility to witness that it *is* this way.

  There was a tension in him, though. One he knew about, and one I wish I had asked him more about before he died. Alan was not a believer. He didn't believe in a God who was doing the choosing of this "best" world. So, what does "best" mean if there is no one left to do the choosing? Is it an aesthetic standard? An ethical one? He died before he fully explained that part to me.

  Maybe he left that unfinished on purpose. Maybe the point was that we are the ones who have to do the choosing now. We are the ones who have to look at this contingent, messy, often brutal world, and decide to make it the best one we can, not because it's destined to be, but because it's the only one we have.

  To the philosophy students in the back: I hope that lands.
  To the rest of the room: I hope you know that when I say he was a great editor, I mean he was a man who believed that telling the truth about a broken world was the highest form of optimism there is.

  He trained me for this job. I inherited his desk. I inherited his red pen. I haven't inherited his patience, or his knowledge of monads, but I will try to inherit his standard.

  Alan, I'll keep the laws simple. I'll try to capture the variety. And I promise, I will never tell anyone that everything happens for a reason.

  Rest in peace, old friend. We'll take it from here.
