prompt: |-
  Okay so for my History of Ethics seminar we just spent two weeks on Bentham, and instead of doing the usual greatest hits (felicific calculus, the Panopticon, "nonsense upon stilts") our professor had us look at some of his unpublished manuscripts on sexual morality that only got transcribed/published properly by the Bentham Project mcuh more recently. The big one is that essay usually called something like "Offences Against One's Self," where he defends decriminalizing consensual acts between men purely on utilitarian grounds, and spends a bunch of time trashing what he calls the "principle of sympathy and antipathy" as basically just people's disgust dressed up as morality. Prof also mentioned that in the same pile of manuscripts he runs through a whole catalogue of what he calls "irregularities of the venereal appetite" (onanism included) and applies the exact same "does this actually harm anyone" test across the board, which was apparently scandalous enough that it sat in a drawer for like a century and a half before anyone published it.

  Anyway this got me and my roomate arguing about what old Jeremy would've made of AI companion apps, like the Replika-style chatbots/avatars people use for romantic and sexual gratification where theres no other sentient party involved at all. My roomate's take is that Bentham would basically wave it through as just a high-tech version of the onanism case, harmless private pleasure, none of the state's business. I'm less sure, because his hedonic calculus has dimensions like fecundity and purity (whether a pleasure tends to produce further pleasures/pains down the line) that seem like they could cut against it if this stuff ends up messing with how people form actual relationships in aggregate, and I don't have a good sense of how much Bentham cared about those diffuse, aggregate effects versus just the immediate private act. Could you actually work through Bentham's own categories and arguments on this and tell me whether he'd land closer to my roommate's version or something messier?
