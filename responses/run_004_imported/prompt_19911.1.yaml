  **MEMORANDUM**

  **TO:** Mutual-Aid Network Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Triage Criteria for Russian Deserter Assistance

  **1. Purpose**

  This memo serves to frame our upcoming vote regarding the eligibility criteria for our assistance program. Specifically, we must decide whether to maintain, discard, or revise our informal priority rule: *prioritizing deserters who object to the political injustice of the war over those who object primarily to personal risk or army conditions.*

  The recent application from the conscript willing to fight a "defensive war" but refusing "Putin's war of choice" has exposed a fault line in our ethical framework. This is not merely bureaucratic; it is a fundamental disagreement about moral responsibility in wartime. As we operate with limited resources, our triage protocol must be both ethically defensible and operationally viable.

  **2. The Ethical Conflict**

  Our debate mirrors a longstanding disagreement in Just War Theory. It is essential we articulate both positions clearly before voting.

  *   **The Case for Moral Agency (The McMahan Position):**
      One faction argues that soldiers are moral agents, not automatons. Following the revisionist view (associated with Jeff McMahan), participation in an aggressive, unjust war confers moral liability. Therefore, a soldier who recognizes the injustice of *this specific war* and refuses to participate is performing a distinct moral good that exceeds simple self-preservation. Prioritizing these individuals aligns our aid with political solidarity and rewards moral courage. To treat a political objector the same as a mere draft dodger is to flatten the moral landscape.

  *   **The Case for Moral Equality & Coercion (The Walzer Position):**
      The opposing faction argues from the traditional view (associated with Michael Walzer) regarding the "moral equality of combatants." In this view, *jus in bello* (conduct in war) is independent of *jus ad bellum* (justice of the war). Soldiers are often coerced, lack full information, and are not the proper agents to judge national policy. Furthermore, humanitarian aid should be needs-based, not virtue-based. Requiring an applicant to articulate a sophisticated political philosophy to receive survival aid risks excluding the most vulnerable—those who may be terrified or inarticulate but are nonetheless being crushed by the same machine. It turns our aid network into a tribunal rather than a lifeline.

  **3. Analysis of the Current Criterion**

  While the intention behind our current rule is sound (solidarity with conscientious objectors), its application has become problematic for three reasons:

  1.  **Verification Impossibility:** We cannot verify internal motive. An applicant quickly learns that citing "Putin's war of choice" unlocks resources, while citing "fear of death" does not. This incentivizes performative speech rather than honest assessment.
  2.  **The False Dichotomy:** The distinction between "political objection" and "self-preservation" is often illusory. A soldier may realize the war is unjust *because* he sees his comrades dying for no gain. Is that political or existential? Forcing a choice creates arbitrary winners and losers.
  3.  **Humanitarian Risk:** If we adopt the Walzerian critique that soldiers shouldn't be judging the war, we risk denying aid to those who are morally confused but still in grave danger. Our mission is to save lives, not to certify moral purity.

  **4. Recommendation: REVISE**

  I recommend we **revise** the criterion rather than keeping or dropping it entirely.

  We should shift our priority metric from **Motive** ("Why did you leave?") to **Action and Consequence** ("What did you refuse, and what punishment do you face?").

  **Proposed New Criterion:**
  *Priority is given to applicants who have demonstrably refused deployment orders and face criminal prosecution or severe physical punishment upon return, regardless of whether their stated motive is political, moral, or personal.*

  **5. Rationale for Revision**

  This revision takes the strongest arguments from both sides of the board seriously:

  *   **Addressing the McMahan Side (Moral Agency):**
      This revision retains the priority on *refusal*. We are still prioritizing those who took the active risk of desertion over those who merely avoided conscription before deployment. It acknowledges that breaking the chain of command is a significant moral and practical act of resistance, regardless of the philosophical vocabulary used to describe it. We honor the courage of the act without gatekeeping the reasoning.

  *   **Addressing the Walzer Side (Coercion & Humanitarianism):**
      This revision accepts the Walzerian concern that we are not equipped to judge the "justice" of a soldier's internal calculus. By removing the requirement to articulate a political stance, we acknowledge the reality of coercion. A terrified conscript is still a victim of the same aggressive war machinery as the political objector. This aligns our triage closer to international asylum standards, which focus on the *risk of persecution* rather than the *purity of the belief*.

  **6. Conclusion**

  The case before us highlights that a soldier can recognize the specific injustice of a war without being a philosopher. Our current rule demands the latter to save the former.

  By revising the criterion to focus on **demonstrable refusal and risk of punishment**, we maintain our commitment to supporting resistance against the war effort (satisfying the need for political solidarity) while adhering to humanitarian principles that do not require applicants to pass a philosophical exam to survive (satisfying the need for moral humility).

  I ask that we vote to adopt this revised framework effective immediately.

  Respectfully,

  [Your Name]
  Board Member
