prompt: |-
  Hey, I've been down a rabbit hole on Kripke's book on Wittgenstein and rule-following (the plus/quus stuff) ever since I wrote a piece on how neural nets generalize past thier training data -- felt like basically the same puzzle. Write me a dialogue between two philosophers at a whiteboard: one defending dispositionalism -- that what makes it true I mean plus rather than quus by '+' is just facts about my dispositions to answer sums -- and the other running Kripke's skeptical argument against them using the 68+57 case, pressing the real objections (the finitude of any actual disposition, the fact that dispositions can misfire so they can't ground "that's what I should say" as opposed to just what I'd say, and how idealizing away the errors seems to smuggle the intentional facts back in). I want real back-and-forth -- the dispositionalist should have genuine comebacks, not just fold, and don't wrap it up with a neat resolution at the end.
