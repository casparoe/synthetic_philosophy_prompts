prompt: |-
  So I'm working on a longer feature about how the AI-safety and rationalist crowd have dragged some pretty obscure old decision theory puzzles back into relevance, and I've got an interview lined up with a decision theorist -- can't name her yet since the piece isn't confirmed, so just treat her as an unnamed stand-in for the "updateless/functional decision theory" camp -- who keeps reaching for Parfit's hitchhiker to make her case against standard rational choice theory. Quick recap in case it helps: you're dying of thirst in the desert, a driver says he'll only give you a lift into town if he's confident you'll pay up once your safe, and he's basically got a lie detector, so bluffing won't work. The catch is that once you're actually in town, the "rational" thing by ordinary lights is not to pay, since paying can't undo a ride you already got -- meaning a purely rational hitchhiker never gets picked up to begin with (I had to reread that bit of Reasons and Persons like three times before it clicked). Parfit apparently called the fix for this "rational irrationality": it can be rational to make yourself disposed to do the locally irrational thing.

  I don't want this interview to just be her restating the thought experiment for the hundredth time, so could you draft me nine or ten questions for it, roughly ordered from setup to the harder stuff, that actually dig into where the real disagreement lives? I want at least one question that presses on the gap between what's called "resolute" choice and "sophisticated" choice (and whether resolute choice is just irrationality with a nicer name), one that puts her view side by side with Gauthier's older constrained-maximization idea and asks what's actually new, one that tests whether the puzzle needs a near-perfect predictor to work or survives with a merely decent one, one that forces her to say plainly whether this means causal decision theory is just wrong -- and how that connects to Newcomb's problem -- and one on what it would concretely mean to build an AI system on her preferred theory instead of a standard one. For at least three of these, bake in the obvious counter she'll probably reach for and a follow-up question that doesn't let her get away with it. No generic "what got you into decision theory" stuff, please.
