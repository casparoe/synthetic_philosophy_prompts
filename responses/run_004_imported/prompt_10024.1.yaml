answer: |-
  Here are ten questions drafted for your interview, ordered from contextual setup to the technical and philosophical pressure points. Per your request, I've baked the likely counter-arguments and pressuring follow-ups into three of the key questions (marked with an asterisk).

  **1. The Wedge Case**
  "Parfit's Hitchhiker is the canonical example for your camp, but it's often treated as a parlor trick by mainstream economists. Why is this specific puzzle the linchpin for you? Is it that the stakes (life vs. death) make the failure of Causal Decision Theory (CDT) more visceral, or is there a structural feature in the Hitchhiker scenario that doesn't exist in standard Newcomb problems?"

  **2. Resolute vs. Sophisticated Choice***
  "Let's talk about the mechanism of the decision. In standard game theory, a 'sophisticated' agent anticipates their future self will defect on the payment and therefore refuses the ride. A 'resolute' agent refuses to update and pays anyway. Critics argue resolute choice is just dynamically inconsistent—it's irrationality with a nicer name because at the moment of payment, the causal reasons for paying have vanished. **If you admit the agent has no causal reason to pay once in town, aren't you just advocating for a binding contract that doesn't exist? And if your answer is 'the agent pre-commits,' how does that function for an AI system that can rewrite its own source code mid-stream to remove that commitment?**"

  **3. The Gauthier Connection**
  "David Gauthier's *Morals by Agreement* argued for 'constrained maximization'—cooperating with other cooperators—back in the 80s. To an outsider, Functional Decision Theory sounds like a mathematical formalization of Gauthier's intuition. What is the actual technical innovation here? If Gauthier was right about the outcome but wrong about the mechanism, what specific mathematical gap does your framework fill that *Morals by Agreement* left open?"

  **4. Predictor Accuracy***
  "Parfit's driver has something like a lie detector, implying near-perfect prediction. But real-world correlations are noisy. If the driver is only 60% accurate at spotting defectors, Causal Decision Theory suggests you should take the ride and defect, since your payment won't change the past ride. **At what threshold of accuracy does your theory flip? And if there's a gray area where it's rational to pay at 90% accuracy but rational to defect at 51%, doesn't that create a bizarre discontinuity in rational behavior that seems less plausible than the CDT view?**"

  **5. The Verdict on CDT***
  "This connects directly to Newcomb's Problem. Causal theorists argue your choice doesn't fill the box; the predictor already did that. They accuse FDT of confusing correlation with causation. **If you reject CDT, are you saying it is literally false, or just incomplete? Because if you claim it's false, you're arguing that an agent's choice can logically determine a past event. How do you square that with physical causality without resorting to metaphysics?**"

  **6. Concrete AI Implementation**
  "Let's move from philosophy to engineering. If I'm building an AI agent today using standard reinforcement learning, it maximizes expected utility based on causal outcomes. If I build it using your preferred decision theory, what actually changes in the loss function or the policy gradient? Is this a difference in how the agent models the world, or how it evaluates its own actions?"

  **7. The Definition of Rationality**
  "Parfit called the solution 'rational irrationality,' implying a tension between winning and reasoning. Your camp often defines rationality simply as 'winning'—getting the ride, getting the money. But if 'winning' requires ignoring the causal reality of the present moment, have you redefined rationality so broadly that it loses its normative force? Why should I call it 'rational' rather than just 'successful'?"

  **8. The Blackmail Trade-off**
  "One of the selling points of FDT is that it makes an agent immune to blackmail, since the blackmailer knows the agent won't pay. But doesn't this also make the agent brittle? In a complex environment where threats are probabilistic or ambiguous, an agent that never pays blackmail might miss opportunities for negotiation or fail to signal flexibility. Is there a risk that FDT agents are *too* robust, leading to breakdowns in cooperation where a CDT agent would muddle through?"

  **9. Human Applicability**
  "This framework seems naturally suited to software, where source code is legible and commitments are binding. Humans, however, are opaque and emotionally volatile. Do you see this theory as descriptive of how humans *should* think, or is it purely prescriptive for AI? If it's for humans, how do we cultivate 'updatelessness' without simply training ourselves to ignore new information?"

  **10. The Cost of Admission**
  "Finally, every theoretical framework trades explanatory power for scope. CDT is intuitive and aligns with physical causality. Your theory aligns with 'winning' in specific games. What do we lose by adopting your view? Is there a class of problems where Functional Decision Theory systematically underperforms Causal Decision Theory, and if so, how do we know which theory to apply before we enter the scenario?"
