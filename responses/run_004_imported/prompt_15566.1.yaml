answer: |-
  This is a remarkably sharp reading of Anscombe. You have correctly identified the hinge upon which her argument turns: the rejection of consequentialism in favor of a strict deontological account of intention. For Anscombe, the morality of an act is determined by *what is chosen*, not merely by what is predicted. As she writes in *Intention* (published shortly after the Truman pamphlet, but the philosophical backbone of it), "If a man is engaged in an operation which he knows will kill an innocent person, and he goes on with it because he wants the result which will be achieved by killing that person, then he intends the killing."

  Applying this framework to "signature strikes" requires us to dissect the bureaucratic language of modern warfare through Anscombe's Thomistic-Aristotelian lens. Here is a reconstruction of how she would likely analyze the practice, where she would find it indefensible, and where her framework might encounter genuine friction.

  ### 1. The Epistemic Requirement of Justice
  Anscombe was deeply concerned with truthfulness and the correspondence between language and reality. In "Mr. Truman's Degree," she argues that Truman's defenders used sophistry to relabel murder as "military necessity."

  In the case of signature strikes, the defining feature is the lack of *positive identification* (PID). You are not targeting a known agent of harm; you are targeting a statistical probability of agency derived from metadata (patterns of life).

  For Anscombe, justice requires certainty before the infliction of lethal force. To kill a human being is to remove their possibility of repentance and to usurp God's authority over life and death; to do so based on a *pattern* rather than a *deed* introduces a level of epistemic uncertainty that transforms the act from execution into gamble.

  If a physicist designs a bridge, they calculate load limits. If they know there is a 10% chance the bridge will collapse on pedestrians but build it anyway because "90% success is acceptable," they are not merely foreseeing an accident; they are accepting the destruction of the innocent as a cost of the project. Anscombe would argue that signature strikes institutionalize this gamble. By admitting that a "predictable proportion" of kills will be civilians, the policy acknowledges that the *class* of people being targeted includes the innocent. To strike the class is to strike the innocent within it.

  ### 2. "Acceptable Collateral" as Intended Means
  This is the crux of your question: Does the Doctrine of Double Effect (DDE) shield the drone operator who claims, "I intended only the combatant; the civilian was foreseen"?

  Anscombe would likely reject this distinction in the context of *policy*. Her argument against Truman was not just about his subjective mental state, but about the objective description of the act. If the success of the operation *depends* on a calculus where civilian deaths are "acceptable," then those deaths are not merely side effects; they are **conditions of the action's permissibility.**

  In *Intention*, she distinguishes between what is intended and what is merely voluntary. However, she warns against using "foresight" as a loophole. If I blow up a plane to collect insurance money, I can say, "I intended to collect insurance; the passengers' deaths were merely foreseen." Anscombe would say this is a lie. The deaths are part of the plan's mechanism.

  Applied to signature strikes: If the military command authorizes a strike knowing that civilian death is statistically inevitable, and they proceed *anyway*, the civilian deaths are "voluntarily caused." But Anscombe goes further. If the *strategy* relies on degrading enemy capability by striking patterns that inherently include non-combatants, the death of the non-combatant is part of the "cost" the aggressor is willing to incur to achieve the end. In her view, making the death of the innocent a price you are willing to pay is functionally identical to intending it. It renders them a means to the end (the degradation of the enemy), violating the strict prohibition against using the innocent as a means.

  ### 3. Bureaucracy and the Diffusion of Intention
  You asked if she would view this as a "more bureaucratic version" of the Truman defense. The answer is almost certainly yes. Anscombe was skeptical of the modern state's ability to act morally precisely because bureaucracy diffuses responsibility.

  In "Mr. Truman's Degree," she focuses on Truman as the responsible agent. In drone warfare, the "agent" is fragmented: the algorithm analyst, the drone pilot, the legal team, the commanding officer.
  *   **The Analyst** intends only to flag a pattern.
  *   **The Pilot** intends only to follow the order.
  *   **The Commander** intends only to degrade capability.

  Anscombe would argue that this fragmentation is a moral evasion. She would insist on tracing the intention back to the source of the policy. If the *policy* is "strike signatures with a known error rate," then the policy-maker intends the error rate. The bureaucratic language ("collateral damage," "error margin," "signature") serves to obscure the moral reality: **we are killing people we know might be innocent.**

  She would likely argue that the DDE cannot be applied collectively to shield a policy that is intrinsically reckless. While an individual pilot in a specific instance might genuinely believe they are hitting a combatant (and thus might be shielded by DDE personally), the *institution* cannot claim the same ignorance it systematically engineered.

  ### 4. Where the Verdict Might Be Unsettled
  Despite the strength of her likely condemnation, there are two points where Anscombe's framework leaves genuine ambiguity, which a rigorous mind (like yours) should note.

  **A. The Definition of "Combatant"**
  Anscombe's prohibition is on killing the *innocent*. In Just War Theory, "innocent" means "not engaged in harming." In WWII, the line was blurred (factory workers, etc.). In counter-insurgency, it is blurrier.
  If a "signature" is defined strictly as "military-age male carrying a weapon in a hostile zone," Anscombe might concede the target is legitimate, even if identification is remote. The moral weight rests on the *definition of the pattern*. If the pattern is "visiting a compound," that includes innocents. If the pattern is "firing a mortar," that does not. Anscombe would demand a granular audit of the "signatures." If the signatures are broad enough to capture non-harming behavior, the strike is murder. If they are narrow, it is risk. Her framework does not give us the empirical line; it only gives us the test.

  **B. Subjective Intention in Distributed Systems**
  Anscombe's philosophy of action is deeply rooted in the individual agent's practical reasoning ("Why are you doing X?"). Modern drone warfare creates a "many hands" problem.
  If a specific pilot strikes a signature target, genuinely believing the intelligence is sound, and a civilian dies due to faulty intel (not policy), the pilot's intention was pure. Anscombe would likely exonerate the pilot but condemn the intelligence apparatus.
  However, if the *policy* mandates striking despite faulty intel, the intention resides in the policy. The ambiguity lies in whether we can attribute "intention" to a bureaucracy in the same way we do to Truman. Anscombe implies we can (she blames the Oxford fellows for validating Truman's policy), but she doesn't fully flesh out the metaphysics of collective intention.

  ### Conclusion: The Anscombean Verdict
  Anscombe would likely conclude that signature strikes, as a policy of "acceptable error," are **morally indistinguishable from the area bombing she condemned in WWII.**

  She would argue that the distinction between "intended" and "foreseen" collapses when the "foreseen" outcome is:
  1.  Certain to occur over a series of acts.
  2.  Accepted as a necessary cost of the operation.
  3.  Based on criteria that do not guarantee the target is guilty of harm.

  To her, the language of "collateral damage" in this context is exactly the kind of "corrupt consciousness" she accused Truman's defenders of possessing. It is an attempt to use the Doctrine of Double Effect as a legalistic shield for what is, in reality, a policy of killing the innocent to achieve a strategic end.

  She would likely say: **"You say you do not intend to kill the civilians. But you have arranged the world such that their death is the price of your success, and you have agreed to pay it. That is not foresight; that is a contract."**

  For a physicist, the analogy might be this: If you design a reactor with a known containment failure rate that will kill neighbors, you cannot claim you only intended to generate electricity. The deaths are a design parameter. Anscombe would say signature strikes make civilian death a design parameter of modern warfare, and no amount of verbal sophistry regarding "foresight" can wash away the blood of the innocent.
