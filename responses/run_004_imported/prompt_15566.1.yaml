      *   **Intention vs. Foresight (DDE):** This is crucial. An act is morally defined by what is *intended*. If the death of an innocent is part of the *plan* (either as an end or a means), it is murder. If it is a truly unintended, albeit foreseen, side effect of a legitimate act, it *might* be permissible (subject to proportionality, though Anscombe is skeptical of proportionality when innocents are involved).
      *   **Justice and Innocence:** Killing the innocent is strictly forbidden. "Innocent" here means "not engaged in harming."
