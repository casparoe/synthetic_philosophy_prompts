      *   **Legal vs. Philosophical:** The aide was likely giving practical advice on *persuasion*, not enforcing a philosophical law. City councils are political bodies, not seminar rooms.
      *   **The "Wide View":** Rawls eventually softened his stance (the "proviso"). Religious arguments *can* enter the public square, but for the *vote* to be legitimate, public reasons should be available.
