answer: |-
  This is a fascinating disagreement because, on the surface, it sounds like a clash between financial prudence and romantic extravagance. But underneath, you and your friend are arguing about **semiotics** (how meaning is created) and **signaling theory** (how we prove truthfulness in biology and economics).

  Neither of you is entirely wrong, but you are speaking different languages. Your friend is arguing from the perspective of *symbolic capital*, while you are arguing from the perspective of *practical utility*.

  Here is an outside read on the dispute, the theory behind your friend's "waste," and how to distinguish a meaningful gesture from a foolish one.

  ### 1. The Defense of "Waste": Costly Signaling Theory
  Your friend's argument—that the waste is the point—is actually a well-documented concept in evolutionary biology and economics known as the **Handicap Principle** or **Costly Signaling**.

  In nature, a peacock's tail is a burden. It makes the bird slower and more visible to predators. Biologically, it is "wasteful." However, that is exactly why it works as a signal of fitness. A weak peacock cannot afford the energy cost of such a tail. Therefore, the tail is an honest signal: "I am so fit that I can survive *despite* this handicap."

  Applied to human relationships:
  *   **Cheap talk is easy:** Anyone can say "I love you" or promise to be faithful.
  *   **Sensible gifts are ambiguous:** Putting money into a wedding fund is smart, but it could also be interpreted as cold calculation or mere financial planning.
  *   **Irreversible cost is hard to fake:** By burning a month's salary on something with no resale value, your friend removed his own safety net. He demonstrated that he values the relationship more than the security of that capital.

  From this viewpoint, your friend is correct: **Inefficiency can be a feature, not a bug.** If the gesture were efficient (refundable, reusable), it would imply he was keeping an exit strategy open. The "sunk cost" creates credibility because it proves he is all-in.

  ### 2. The Defense of Prudence: Sustainable Commitment
  Your counter-argument rests on the definition of commitment as a **duration** rather than a **peak**.

  *   **Marriage is a marathon:** A proposal lasts an hour; a marriage lasts decades. Financial stress is one of the leading causes of divorce. By depleting resources early, your friend may have actually weakened the foundation of the marriage he is celebrating.
  *   **Consistency is harder to fake than a one-off:** Your friend argued that consistent behavior is easy to fake in the short run. That is true. But you are talking about *years* of behavior. Faking kindness, reliability, and financial responsibility for five years is incredibly difficult.
  *   **Value alignment:** If a partner values security and future-building, an extravagant waste of money doesn't signal "love"; it signals "irresponsibility."

  ### 3. Distinguishing a "Credible Signal" from "Foolish Spending"
  You asked what distinguishes a gesture whose cost earns credibility from one that is simply expensive for no good reason. This is the crux of the matter. A costly signal only works if it meets three criteria:

  **A. Recipient Valuation (The most important factor)**
  A signal only works if the receiver understands the language.
  *   **Credible:** If his fiancée loves grand gestures, values experiences over objects, and was moved to tears by the quartet, the money bought *emotional utility*. The "waste" was converted into a core memory.
  *   **Foolish:** If his fiancée is frugal, anxious about money, or would have preferred a quiet dinner, the gesture is not a signal of love; it is a signal of **narcissism**. It says, "I want to be the kind of man who does this," rather than "I want to give her what she wants."
  *   *The Test:* Did the recipient feel loved, or did they feel guilty?

  **B. Proportionality and Affordability**
  *   **Credible:** Spending a month's salary when you have six months of savings in the bank is a sacrifice, but it is not ruinous. It shows prioritization.
  *   **Foolish:** Spending a month's salary when you are living paycheck-to-paycheck or going into credit card debt is not a signal of commitment; it is a signal of **instability**. It suggests poor impulse control, which is a risk factor for a partner.
  *   *The Test:* Does this expense threaten the couple's immediate future security?

  **C. Narrative Fit**
  *   **Credible:** The gesture fits the couple's story. If they love the water, music, and drama, the boat and quartet make sense.
  *   **Foolish:** The gesture is performative for an audience (social media, peers) rather than intimate for the couple. Your friend admitted the lake meant nothing to them. This leans toward the gesture being about *status* rather than *intimacy*.
  *   *The Test:* Is this a story they will tell each other in 20 years, or a story he will tell his friends at a bar?

  ### 4. Application to Your Anniversary
  You mentioned you have a fifth anniversary coming up and are unsure if you should do something similar. Based on the analysis above, here is the guidance:

  **Do not mimic your friend.**
  Signaling theory relies on authenticity. If you spend money extravagantly because you feel *pressured* to prove a point, you are not sending a signal of love; you are sending a signal of insecurity. That is easily detectable.

  **Assess your "Currency."**
  Every relationship has a currency. For some, it is grand gestures (Costly Signaling). For others, it is security, time, or acts of service (Practical Utility).
  *   If your partner looks at a bank statement and feels safe, a contribution to a joint goal might be more romantic than a chartered boat.
  *   If your partner values "moments that feel like movies," then a sensible gift will feel like a lack of effort.

  **The "Sunk Cost" Trap.**
  Be careful of the idea that you must *lose* money to prove love. In a long-term partnership, you are building a joint economy. Burning resources hurts the "company" you run together. A better signal for a 5th anniversary might be an investment that you *both* benefit from, but which requires vulnerability.
  *   *Example:* Booking a trip to a place you've both dreamed of but never prioritized (costly, but creates memory).
  *   *Example:* Writing a vow renewal or a letter that exposes deep vulnerability (costly in terms of emotional risk, which is often harder to fake than financial risk).

  ### Summary
  Your friend is not necessarily "dressing up overspending," provided his fiancée values the gesture and they can afford it. He is purchasing **symbolic capital** rather than **material capital**. In the context of a proposal—a ritual designed specifically for signaling—his logic holds water.

  However, his logic does not translate well to the rest of a marriage. You cannot sustain a relationship on Handicap Principles alone.

  **The Verdict:**
  *   **Is there a defensible reason for costly gestures?** Yes. Irreversibility signals confidence and prioritization.
  *   **Is your friend wrong?** Not necessarily, unless the expense causes stress or mismatches his partner's values.
  *   **What should you do?** Ignore the price tag. Focus on the **irreversibility of effort**. A gesture is credible not because the money is gone, but because the *effort* was specific, tailored, and cannot be replicated for anyone else. That is the true "cost" that proves commitment.

  If you want to prove something for your anniversary, don't ask "How much money can I burn?" Ask "What can I do that requires such deep knowledge of her and such specific effort that it could not possibly be faked?" That is the signal that actually matters.
