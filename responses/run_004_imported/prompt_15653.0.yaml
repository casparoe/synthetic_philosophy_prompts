      *   **The Ethical Gap (The Critique):**
          *   *The Separateness of Persons:* Lives aren't fungible units.
          *   *Equal Claim:* Each person has an equal claim to rescue. Aggregating claims might violate the individual's standing.
          *   *The "Tie-Breaker" Problem:* If numbers are the *only* factor, does it erase individual dignity?
      *   **Alternative Approaches:**
