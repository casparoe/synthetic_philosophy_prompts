answer: |-
  This is a profound ethical puzzle, and your instinct is correct: the coordinator's lingering doubt is not merely an emotional reaction to tragedy. It points to a well-documented tension in moral philosophy between **aggregative ethics** (counting outcomes) and **individualist ethics** (respecting distinct claims).

  For your feature, it is crucial to distinguish between whether the coordinator made the *wrong decision* (most ethicists would say no) and whether the *justification* ("five is more than one") is morally complete (many ethicists would say no).

  Here is a breakdown of the ethical landscape surrounding this scenario, structured to help you articulate the "gap" you are sensing.

  ### 1. The Case for Arithmetic (Utilitarianism)
  The protocol your source followed is rooted in **utilitarianism**, specifically the principle of maximizing expected utility. In disaster medicine and emergency management, this is often codified as "doing the greatest good for the greatest number."

  *   **The Argument:** Lives are the unit of value. If the goal of rescue is to preserve life, then preserving five units is objectively superior to preserving one. To do otherwise would be to treat human life as having value *other* than its existence (e.g., prioritizing the one because they were closer, or first to call).
  *   **The Practical Necessity:** In high-stress environments, protocols must be heuristic (mental shortcuts). If coordinators had to weigh the "moral weight" of every individual in the moment, decision paralysis could result in zero survivors. The arithmetic rule protects the rescuer from the burden of subjective judgment under fire.

  ### 2. The Ethical Gap: The "Separateness of Persons"
  The dissatisfaction your source feels aligns with a famous philosophical objection to utilitarianism, often associated with John Rawls and Robert Nozick: **The Separateness of Persons.**

  *   **The Critique:** Utilitarianism treats society as a single container of value. It assumes you can sacrifice one person's claim to life to satisfy the greater sum of claims elsewhere. However, human beings are distinct entities. The single person on the roof does not experience themselves as part of a group of six; they experience themselves as an individual with a 100% stake in their own survival.
  *   **The Loss:** When you reduce the decision to arithmetic, you risk treating the individual on the first roof not as a person to be rescued, but as a *statistic to be traded*. The "gap" is that the protocol answers the question "How do we maximize survival?" but fails to answer "How do we honor the equal worth of every individual?"
  *   **Why the Doubt is Real:** The coordinator's doubt acknowledges that while saving five was the *optimal outcome*, the single person was effectively **abandoned**. In ethical terms, there is a difference between "failing to save" (due to impossibility) and "choosing not to save" (due to calculation). The protocol forces the latter, which carries a moral weight that "5 > 1" does not fully capture.

  ### 3. The Problem of "Equal Claim"
  Another layer for your piece is the concept of **fairness vs. goodness**.

  *   **Goodness:** Maximizing lives saved (the utilitarian view).
  *   **Fairness:** Giving every person an equal chance.

  Some ethicists (like Michael Otsuka or Frances Kamm) argue that when resources are scarce, every person has an equal *claim* to rescue. If you cannot save everyone, does the group of five have a stronger claim than the individual?
  *   **The Counter-Argument:** If you flip a coin between the two roofs, you respect the equal claim of the individual versus the group. However, you risk a outcome where the coin lands on the single person, and five die. Most societies reject this because the cost of "fairness" is too high in terms of body count.
  *   **The Tension:** The protocol prioritizes *Goodness* (outcome) over *Fairness* (process). The coordinator's unease may stem from the sense that the single person was denied fairness for the sake of goodness, and the debrief team dismissed that loss as irrelevant.

  ### 4. Moral Residue and "The Remainder"
  For the narrative of your piece, the concept of **Moral Residue** (discussed by philosophers like Bernard Williams and ethicists in healthcare) is vital.

  *   **Definition:** Moral residue is the distress felt by an agent who makes the *right* decision but still feels they have committed a moral wrong.
  *   **Application:** If the protocol were truly "self-evidently correct" with no ethical cost, the coordinator should feel relief, not doubt. The fact that she feels troubled suggests that following the rule did not absolve her of the moral weight of leaving one person to die.
  *   **Journalistic Angle:** The problem may not be the protocol itself, but the **culture of the debrief**. Her colleagues dismissed her doubt because they view the arithmetic as a "clean" solution. A healthy ethical culture would acknowledge that while the decision was necessary, a moral loss *did* occur. Validating her doubt might be more ethical than insisting the math makes it painless.

  ### 5. Questions to Explore for Your Piece
  To deepen the reporting, you might consider exploring these angles:

  *   **The "Tie-Breaker" Nuance:** Are there scenarios where numbers *shouldn't* decide? (e.g., if the single person was a child and the five were adults? If the single person was disabled? Most protocols say "no," but public intuition often wavers).
  *   **Procedural Justice:** Does the *way* the decision is explained to the public matter? If the agency admits, "We had to leave someone behind to save more," does that build more trust than "We saved the maximum number"?
  *   **The Rescuer's Burden:** How does the "arithmetic justification" impact the mental health of first responders? Does telling them "you made the math work" prevent them from processing the grief of the one they couldn't save?

  ### Summary for Your Narrative
  The case for letting numbers decide is not as simple as adding lives up because **human value is not fungible.** You cannot swap one life for another without a moral "remainder."

  The coordinator's doubt is onto something real: The protocol is **instrumentally rational** (it achieves the goal of max survival) but it is not **morally complete** (it does not resolve the tragedy of the individual abandoned). The "gap" is the space between a successful operation and a morally clean conscience. For your feature, the story isn't necessarily that the protocol is wrong, but that treating it as a simple math problem denies the profound moral cost of triage. The most ethical response might not be to defend the math, but to honor the doubt.
