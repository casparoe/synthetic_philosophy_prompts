prompt: |-
  For a feature I'm reporting on the ethics of triage protocols used in disaster response, I've spent the past few weeks interviewing search-and-rescue coordinators, and one story has stayed with me. During a major flood, one coordinator's team had a single boat and about twenty minutes before rising water would cut off a stretch of river. Two rooftops radioed for help within moments of each other: one had a single occupant, the other had five. As far as she could tell, nothing distinguished the two situations except the number of people involved—both roofs were equally exposed, both groups equally likely to be swept away if the water kept rising, and there was no way to reach both in time or to split the trip between them. Her agency's protocol was explicit for cases like this: when one rescue can't cover everyone, it goes to wherever the greater number of people is at risk. She followed it. The five survived; the person on the other roof did not. At the debrief afterward, her colleagues justified the protocol simply by pointing out that saving five lives is better than saving one, and no one else in the room seemed troubled by that, but she told me the explanation never fully satisfied her, even though she couldn't say exactly what was wrong with it.

  What strikes me about her account is that it isn't really a case about causing harm versus merely failing to prevent it: both roofs were already in danger before her team arrived, and heading toward either one would have counted as a rescue, not a harm. It's a cleaner test of a more basic question: is "go to wherever there are more people" really the self-evidently correct rule that emergency-management training treats it as, simply because five is more than one? Or is there a genuine gap in that reasoning—one that would mean her lingering doubt is onto something real, rather than just an emotional reaction to a tragic outcome? I'd like to understand, for the piece, whether the case for letting numbers decide is actually as simple as adding lives up the way you'd add any other quantity, or whether something significant gets lost when a decision like this is reduced to arithmetic.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** The user is a journalist writing a feature on the ethics of triage protocols in disaster response.
      *   **Specific Scenario:** A flood rescue scenario. One boat, 20 minutes, two rooftops. Roof A: 1 person. Roof B: 5 people. Protocol: Save the greater number. Outcome: 5 saved, 1 died.
      *   **The Coordinator's Feeling:** She followed protocol but feels lingering doubt. Colleagues justified it with simple utilitarianism (5 > 1), but she isn't satisfied.
      *   **The User's Question:** Is "go to wherever there are more people" self-evidently correct (simple arithmetic), or is there a genuine ethical gap/loss in reducing this to arithmetic? Is the coordinator's doubt onto something real?
      *   **Goal:** Provide a nuanced ethical analysis suitable for a journalistic feature. Avoid giving a definitive "yes/no" but explore the philosophical tensions.

  2.  **Identify the Core Ethical Frameworks:**
      *   **Utilitarianism (Consequentialism):** The standard protocol view. Maximize overall good (lives saved). 5 > 1. Simple, clear, actionable.
      *   **Deontology (Duty/Rights):** Focuses on duties to individuals. Does the single person have a right to equal consideration that is violated by being sacrificed for the many?
      *   **Contractualism/Fairness:** What rules would we agree to behind a "veil of ignorance"?
      *   **Virtue Ethics:** What does this decision say about the character of the rescuer/agency?
      *   **The "Separateness of Persons" Objection:** A key philosophical critique of utilitarianism (Rawls, Nozick, etc.). You can't just aggregate lives like dollars in a budget.

  3.  **Brainstorming the "Gap" (Why the coordinator feels doubt):**
      *   *Abandonment:* The one person is effectively abandoned. Is there a duty to *try* to save everyone, even if impossible?
      *   *Lottery vs. Numbers:* Should chance play a role? (Flip a coin?)
      *   *Vulnerability:* Was the single person more vulnerable? (Prompt says "nothing distinguished the two situations," but in reality, isolation matters).
      *   *Moral Residue:* The feeling that a moral wrong occurred even if the right choice was made.
      *   *Instrumentalization:* Is the single person treated merely as a means to the end of "maximizing stats"?

  4.  **Structuring the Response:**
      *   **Acknowledge the Complexity:** Validate the coordinator's feeling. It's not just emotion; it's philosophical tension.
