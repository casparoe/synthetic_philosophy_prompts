answer: |-
  # The Instability of Gaps: Why Dynamic Rationality Demands Completeness

  **Abstract**
  The completeness axiom is often regarded as the least normatively compelling of the von Neumann-Morgenstern (vNM) postulates. While transitivity and independence seem to follow from the very concept of ranking, completeness appears to demand a precision of value that the world rarely affords. The standard defense of incompleteness relies on the intuition that an agent can rationally face a "choice gap" between two options without being indifferent. However, this intuition crumbles under diachronic pressure. This essay argues that while an agent may *possess* incomplete attitudes in a static vacuum, practical rationality in a sequential environment requires completeness. The "foresight" escape route—relying on sophisticated or resolute choice to avoid money pumps—does not save incompleteness; rather, it smuggles in a completeness axiom at the level of policy, rendering the gap practically inert. Therefore, for any agent embedded in time, rationality requires complete preferences, full stop.

  ### 1. The Money Pump for Completeness

  To evaluate the escape, we must first sharpen the trap. The money-pump argument for transitivity is familiar: if $A \succ B \succ C \succ A$, a myopic agent cycles endlessly, paying transaction costs at each step. The argument for *completeness* is subtler. It targets the agent who claims that for some $A$ and $B$, neither $A \succeq B$ nor $B \succeq A$ holds, and yet $A \not\sim B$ (they are not indifferent). Let us denote this relationship as $A \parallel B$ (a preferential gap).

  Consider the following sequence, adapted from Rabinowicz and refined by Gustafsson:
  1.  **Node 1:** The agent holds $A$. A trader offers to swap $A$ for $B$ plus a small premium $\epsilon$ (or simply $B$ for a tiny fee $\epsilon$).
  2.  **Node 2:** If the agent accepted, they now hold $B$. The trader offers to swap $B$ back for $A$ for a fee $\epsilon$.

  A standard choice rule for incomplete preferences (such as *maximality* or *admissibility*) suggests that if $A \parallel B$, then $B$ is not worse than $A$. Thus, at Node 1, trading $A$ for $B$ (minus $\epsilon$) is permissible. The agent trades. Now at Node 2, holding $B$, the agent faces $A$ (minus $\epsilon$). Since $A \parallel B$, $A$ is not worse than $B$. Thus, trading back is permissible. The agent trades.
  **Result:** The agent ends with $A - 2\epsilon$. They have been pumped.

  The force of this argument rests on **Myopic Choice**: the agent evaluates each decision node in isolation, guided only by their local preferences over the immediate options. If preferences are gappy, local permissibility allows the cycle. The conclusion drawn by pro-completeness theorists is that rationality forbids gaps because gaps invite exploitation.

  ### 2. The Foresight Defense: Sophistication and Resoluteness

  The reading group's dissenting voice is channeling a robust literature in dynamic choice theory (McClennen 1990; Rabinowicz 1995). The objection is that the money pump assumes a stupid agent. If the agent has **foresight**, they do not evaluate nodes in isolation. They evaluate *plans* or *strategies*.

  There are two main ways to model this:
  1.  **Sophisticated Choice:** The agent uses backward induction. At Node 2, they realize that trading back yields $A - \epsilon$, while keeping $B$ yields $B - \epsilon$. If they prefer keeping $B$ (or are even just unwilling to pay $\epsilon$ for no gain), they won't trade. Anticipating this at Node 1, they know that trading $A$ for $B$ leads to ending up with $B - \epsilon$. If $A \succ B - \epsilon$ (even if $A \parallel B$), they refuse the initial trade.
  2.  **Resolute Choice:** The agent commits at Node 1 to a plan ("I will keep $A$") and follows through at Node 2, even if their local preferences at Node 2 might have shifted or remained gappy.

  The defender of incompleteness argues: "My preferences between $A$ and $B$ remain gappy ($A \parallel B$). However, my preference between the *sequence* (Keep $A$) and the *sequence* (Trade to $B$ then Trade Back) is not gappy. I prefer the former. Thus, I avoid the pump without completing my underlying preferences."

  On this view, the money pump only proves that *myopic* agents must be complete. A rational, farsighted agent can maintain gaps in their atomic preferences while using dynamic consistency to block the pump.

  ### 3. The Critique: The Normative Cost of Resoluteness

  This defense is seductive, but it fails to save the phenomenon of genuine incompleteness as a feature of *rational* agency. The verdict rests on three points: the source of the constraint, the functional equivalence of policies, and the instability of the gap under reflection.

  **First, the source of the constraint.**
  If the agent refuses the trade at Node 1 solely to avoid the pump, what is the normative basis of that refusal? It cannot be the value of $A$ versus $B$, *ex hypothesi* they are incomparable. The basis is purely *procedural*: "I must not be pumped." But this procedural constraint functions exactly as a completeness axiom. To say "I refuse to trade $A$ for $B$ because trading leads to a loss" is to say "I treat $A$ as strictly preferable to the prospect of entering the trade sequence."
  Gustafsson (2022) presses this hard: if you adopt a policy to resolve gaps to avoid pumps, you are acknowledging a higher-order preference for *coherence* over *value flexibility*. But if coherence is a value that always trumps the gap, then the gap is not doing any normative work. You are effectively saying, "My preferences are incomplete, *unless* being incomplete costs me money, in which case I complete them." This is not a defense of incompleteness; it is an admission that incompleteness is rationally unstable.

  **Second, functional equivalence.**
  Decision theory is ultimately about action-guidance. If an agent *always* chooses $A$ over $B$ in sequential contexts to avoid exploitation, they are behaviorally indistinguishable from an agent who holds $A \succ B$. The "gap" becomes a phantom limb—it is claimed to exist, but it never influences choice in any environment where stakes are dynamic.
  More damningly, sophisticated choice requires a complete ordering over *strategies*. If I prefer Strategy $S_1$ (Keep $A$) to Strategy $S_2$ (Trade to $B$), I have a complete preference over the available courses of action. Since strategies map to outcomes, and instrumental rationality requires aligning outcomes with preferences, I am forced to project this completeness back onto the outcomes. If I consistently choose $A$ over $B$ to maintain dynamic consistency, I am rationally required to update my doxastic/normative model to reflect $A \succ B$. To maintain the belief "$A \parallel B$" while acting as if "$A \succ B$" is a form of fragmentation that violates the ideal of a unified agency.

  **Third, the instability of the gap.**
  The foresight defense assumes the agent can arbitrarily "pick" a path when facing a gap. But if $A \parallel B$, there is no reason to pick $A$ over $B$ *except* to avoid the pump. This makes the preference endogenous to the exploitation scenario. A truly rational agent should not have preferences that flip based on whether a money-pumper is lurking.
  If the agent says, "I choose $A$ because I am resolute," we must ask: *Why this resolution?* Why not resolve to choose $B$? If both resolutions are permissible because $A \parallel B$, then the agent is vulnerable to a **diachronic Dutch Book** on their *policies*. A trader could offer a contract that pays off if the agent adopts Policy 1, and another that pays off if they adopt Policy 2, exploiting the indeterminacy of their resolution rule. To avoid *this* pump, the agent must have a reason to prefer one resolution over the other. That reason constitutes a completion of the preference relation.

  ### 4. The Verdict

  Here is the settlement your reading group needs: **Practical rationality requires complete preferences.**

  The foresight objection correctly identifies that *myopic* agents with gaps are pumpable. However, it incorrectly concludes that *farsighted* agents with gaps are safe. Farsightedness does not neutralize the pump; it merely shifts the locus of completeness from atomic outcomes to temporal policies. But since rational agency requires the integration of policies into a coherent life-plan, maintaining a "gap" at the atomic level while enforcing completeness at the policy level is an untenable fragmentation.

  If you are rational, you cannot tolerate a gap between $A$ and $B$ if $A$ and $B$ are options you might face sequentially. You must either:
  1.  Admit $A \succ B$ (or vice versa).
  2.  Admit $A \sim B$.
  3.  Admit that you are irrational (vulnerable to exploitation).

  The "foresight" move is simply a description of the *process* by which a rational agent completes their preferences to ensure diachronic consistency. It is not a way to keep preferences incomplete. To claim otherwise is to argue that one can be "dynamically consistent while incompletely preferential," which is like arguing one can be "dry while submerged." The water (dynamic context) fills the gaps.

  ### 5. Implications for Coherence and Alignment

  This verdict matters beyond the seminar room. In the broader literature on coherence arguments (e.g., Yudkowsky, Christiano), the claim is that any sufficiently advanced agent will act *as if* it maximizes expected utility. Critics often object that agents might have incomplete preferences (e.g., "I don't prefer saving 10 humans to saving 10 humans and a cat, nor vice versa").

  The money-pump analysis shows why this objection fails in the long run. An AI with gappy preferences will either:
  1.  Get money-pumped (resource inefficiency).
  2.  Adopt a resolute policy to avoid pumping.

  If it adopts (2), it has effectively installed a "completeness module" in its utility function. It will behave *indistinguishably* from an EU maximizer. For the formal epistemologist, this suggests that completeness is not merely an axiom we impose for mathematical convenience; it is a **structural requirement of agency in time**.

  ### Conclusion

  The money-pump argument for completeness is not defeated by foresight; it is vindicated by it. Foresight reveals that maintaining a preferential gap is costly. Rationality demands we pay the cost of coherence rather than the cost of exploitation. Therefore, an agent cannot be fully rational while having genuine preferential gaps between actionable options. The "right way over time" *is* the way of complete preferences. To choose resolutely in the face of a gap is to fill it.

  **The Side I Pick:** The completeness axiom is a necessary condition for diachronic rationality. The "gap" is a static illusion that dissolves under the pressure of sequential choice. Your reading group should conclude that while *psychological* indecision is real, *normative* incompleteness is not a viable position for a rational agent.
