      *   He tries to grab her. Trips.
      *   He tries to shoot the tire. Gun jams.
      *   He tries to call her. Phone battery dead.
      *   He realizes: The past is fixed. His presence is recorded in the past. He was always there failing.
      *   Word count check: Need to expand on the internal monologue to hit 600-900.

  7.  **Drafting - Focusing on Tone:**
      *   Needs to feel clinical yet emotional.
      *   Avoid sci-fi jargon. Focus on the mundane obstacles.
      *   The realization should feel like a logical proof completing itself.

  8.  **Review against Constraints:**
      *   600-900 words? (Will monitor closely).
      *   Single timeline? Yes.
      *   No time cops/magic? Yes.
      *   Mundane failures? Yes.
      *   David Lewis logic? Yes (compossibility).

  9.  **Final Polish:**
      *   Check word count.
      *   Ensure the ending lands the philosophical weight.

