answer: |-
  The rain on May 14th felt exactly the same the twelfth time as it did the first. Cold, needle-sharp, smelling of wet asphalt and exhaust. Elias stood on the corner of 5th and Main, checking the chronometer on his wrist. 4:58 PM. Two minutes before the blue sedan would lose traction on the wet turn. Two minutes before his sister, Sarah, died.

  In the movies, the universe fights back. Glowing barriers, mysterious strangers, sudden gusts of wind that push you off course. Elias had prepared for force. He had brought crowbars, sedatives, even a firearm in the third iteration. But the universe didn't send enforcers. It just sent bad luck.

  On the first attempt, Elias had sprinted toward Sarah standing at the crosswalk. His shoelace, tied perfectly moments before, snapped. He stumbled, scraping his knee, and by the time he looked up, the crash had already happened. The screech of tires, the shatter of glass. The facts remained unchanged.

  On the fourth attempt, he tried to disable the car beforehand. He had the tools. He knew the mechanics. But when he knelt by the sedan's tire, a sudden, violent coughing fit seized him—asthma he hadn't suffered from since childhood. He couldn't breathe, let alone loosen the lug nuts. He retreated to the sidewalk, wheezing, watching the car drive away intact toward its doom.

  On the eighth attempt, he decided to simply warn her. He approached her at the coffee shop next door. He opened his mouth to scream, to beg, to say anything. His voice failed. Laryngitis. Total aphonia. She looked at the strange man gesturing wildly at her, frowned in mild concern, and walked out the door to meet the intersection.

  Now, attempt twelve. Elias stood still. He wasn't out of breath. His shoes were tied. The gun was not in his pocket; he had left it in the future. He understood now. It wasn't that he *couldn't* kill the past, or change it, in terms of capability. He had the strength, the tools, the knowledge. But he *couldn't* in terms of compossibility.

  David Lewis was right. The logic was airtight, a cold steel trap snapping shut around his heart. If Sarah died in 2014, then Elias traveling back to 2014 was always part of 2014. His presence was not an intrusion; it was a fixture. He was not a variable introduced to change the equation; he was a constant that had always been part of the sum.

  The dread wasn't in the failure; it was in the realization of why the failure occurred. It wasn't cosmic police ensuring consistency. It was just fact. The fact was: Sarah died. The fact was: Elias was there. Therefore, the fact must be: Elias failed to save her.

  Any attempt he made to succeed was logically incompatible with the reality he occupied. So, reality accommodated his attempt by ensuring mundane obstruction. A slipped gear. A missed step. A sudden rainstorm obscuring vision. Not because the universe cared, but because truth is singular.

  4:59 PM. Sarah exited the coffee shop. She opened her umbrella, a bright yellow bloom against the grey street. She looked happy. She was humming. Elias knew this memory; he had lived with the hole it left for ten years. He remembered seeing her die. He remembered standing on this corner, ten years older, watching it happen.

  He realized with a sickening lurch that he wasn't remembering the future. He was remembering the past. He had always been here. The memory of her death included the memory of his own futile presence on the corner.

  5:00 PM. The blue sedan approached.

  Elias could run. He could shove her. He could throw himself in front of the car. But he knew, with the certainty of logic, that his leg would cramp. He knew that if he ran, a delivery truck would block his path. He knew that if he threw himself, he would miss by an inch. Not because of magic, but because those things *didn't* happen. And since they didn't happen, they couldn't.

  He didn't move. He watched the car hit the patch of oil. He watched the slide. He watched the impact.

  The screech of tires was the sound of logic locking into place. Elias stood in the rain, weeping silently, finally understanding that he wasn't a traveler changing history. He was just a witness fulfilling it. The past was not a place you could visit; it was a place that had already visited you.
