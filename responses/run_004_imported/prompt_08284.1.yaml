answer: |-
  **Setting:** *A seminar room, late afternoon. Two graduate students, **Elena** (defending the Fregean/Unsaturatedness view) and **Marcus** (defending the Russellian/Multiple Relation Theory of Judgment), are clearing whiteboards after a heated class.*

  **Marcus:** Look, I get the appeal, Elena. Bradley's Regress is a nightmare. If you have a subject, a predicate, and a copula, you need another copula to glue the copula to the subject, and so on. But saying concepts are "unsaturated" feels like labeling the mystery rather than solving it. You're saying the glue doesn't need glue because it's... sticky by nature?

  **Elena:** It's not magic, Marcus. It's logical category. An object is complete; a concept is a function. A function *by definition* has an empty place waiting to be filled. You don't need a third thing to connect a function to its argument. That's what a function *does*. The unity is internal to the logical type.

  **Marcus:** Internal to the logical type? That's just a way of saying "don't ask." Here's the problem, and you know it: The Concept Horse. The moment you try to explain your theory, you destroy it. You want to say, "The concept *horse* is unsaturated." But look at your sentence. "The concept *horse*" is a singular term. It occupies the subject place. In your own semantics, that makes it an object.

  **Elena:** I'm aware of the paradox. Frege admits it.

  **Marcus:** Admitting it doesn't fix it. If your theory is true, then the sentence stating your theory is false. You're using a saturated term to refer to an unsaturated entity. You've turned the concept into an object just by talking about it. So, strictly speaking, your theory is inexpressible. You can't say what you claim is the case.

  **Elena:** It's not inexpressible; it's linguistically awkward. We are forced by the structure of natural language to use singular terms for subjects. But we can *recognize* the distinction. When I say "the concept *horse*," I am using a sign that points to something that cannot be a subject. The contradiction is in the language, not in the thought. We can grasp the unsaturated nature of the concept even if our grammar forces us to nominalize it.

  **Marcus:** That's a dodge, and you know it. You're asking us to grasp something that, by your own lights, cannot be the object of a grasp. To grasp it is to make it an object of thought. If I think about the concept *horse*, isn't the concept *horse* now the object of my thought? If it's an object of thought, it's saturated. So, either concepts don't exist, or they are saturated. You can't have it both ways. You're trying to have a logical entity that is essentially predicate-like but treating it as a name.

  **Elena:** You're conflating the *reference* of the phrase with the *mode of presentation*. Yes, in the meta-language, I treat the concept as an object of discussion. But that doesn't change its logical category in the object language. The point is, this awkwardness is the price of precision. Compare that to your Multiple Relation Theory. You think you avoid this by saying the unity comes from the *act* of judging. The mind relates $a$, $R$, and $b$.

  **Marcus:** Exactly. No free-floating propositions. Just a subject (the mind) standing in a relation of judgment to the constituents. The unity is provided by the mental act.

  **Elena:** Okay, then hit me with the Direction Problem. If judgment is just a multiple relation between a mind and some constituents—say, Othello, Desdemona, and Loving—what determines the order? How does the mind distinguish judging that *Othello loves Desdemona* from judging that *Desdemona loves Othello*?

  **Marcus:** The mind apprehends the relation in a specific way. It's not just a bag of items.

  **Elena:** But *what* in the theory accounts for that? If the constituents are just $a$, $b$, and $R$, and the mind is $M$, you have a complex $J(M, a, b, R)$. Nothing in that list tells you $a$ is the lover and $b$ is the beloved. $R$ is just another constituent. If $R$ is inert, the order is arbitrary. If $R$ carries the order, then $R$ isn't just a constituent; it's doing the work of a proposition. You've smuggled the unity back in.

  **Marcus:** I haven't smuggled it. The relation $R$ has a "sense" or a directionality when apprehended. When I judge, I don't just pick up $R$; I pick it up as going from $a$ to $b$.

  **Elena:** But *how*? If you say the mind imposes the order, then truth becomes subjective. It depends on how I arrange them. If I arrange them wrong, do I judge a false proposition, or do I fail to judge anything at all? Russell struggled with this. If I judge that $a$ bears $R$ to $b$, but $R$ can't actually relate $a$ and $b$ (say, "Caesar is prime"), your theory says I'm still judging *something*. But there is no *something* there to be judged.

  **Marcus:** Better to say I'm in a psychological state than to posit a "false objective" floating in a third realm. But look, you're attacking my account of error to save your account of structure. But your account of structure is self-refuting! We're back to the Horse. You say the unity is in the unsaturated concept. But to explain *how* it unifies, you have to talk about the concept. The moment you talk about it, it's an object. So you can never explain the unity. You can only show it.

  **Elena:** Showing is enough! Logic isn't a textbook; it's a scaffold. I can display the function-argument structure in a formal notation. $\text{F}(x)$. There is no glue symbol between F and x. The juxtaposition *is* the saturation. You, on the other hand, need the mind to do the juxtaposing. But if the mind is just another object, what relates the mind to the constituents?

  **Marcus:** The act of judging!

  **Elena:** Is the act saturated or unsaturated?

  **Marcus:** ...It's an act. It's not an object.

  **Elena:** Aha! So you need unsaturated things too! You need the "judging" to be unsaturated to hook onto the constituents. If "judging" is a complete object, we get Bradley's Regress again. What connects the judging to Othello? Another relation? So you're a Fregean about mental acts but a Russellian about propositions?

  **Marcus:** No, because the act isn't a constituent *in* the proposition. It's the generator of the unity. It's dynamic. Your concepts are static, dead entities waiting to be filled. Mine is a living cognitive engagement.

  **Elena:** "Living cognitive engagement" sounds like poetry, not logic. If it's dynamic, it's variable. If it's variable, how do we share the *same* proposition? If the unity depends on *your* act of judging and *my* act of judging, do we ever judge the same thing? Or do we just have similar psychological states?

  **Marcus:** We share the constituents and the logical form of the relation.

  **Elena:** Where does that form live? If it lives in the mind, it's psychological. If it lives in the world, it's a proposition. You're trying to have a proposition without the "proposition." You want the structure without the structural entity.

  **Marcus:** And you want a structural entity that can't be referred to without turning it into a non-structural entity. We're both stuck. But my stuckness allows me to say "I judge that the cat is on the mat" without paradox. You have to say "I judge that the cat... [silence regarding the concept] ...is on the mat."

  **Elena:** I don't fall silent. I use predicates. I say "The cat is on the mat." The predicate "is on the mat" is unsaturated. It works perfectly in use. It only breaks when I try to *thematize* it, to make it the topic. But I don't need to make it the topic to use it. Your theory breaks in *use* because it can't distinguish $aRb$ from $bRa$ without presupposing the very proposition it's trying to analyze.

  **Marcus:** I can distinguish them by the order of apprehension.

  **Elena:** "Order of apprehension." That's just "proposition" whispered quietly. You're saying the mind sees $a$-then-$R$-then-$b$ in a specific configuration. But that configuration *is* the proposition. You haven't eliminated the proposition; you've just hidden it inside the black box of "Judgment." At least I'm honest: the proposition exists, and it has a weird, unsaturated part. You're pretending the weirdness isn't there by calling it "mental."

  **Marcus:** It's not pretending. It's ontological parsimony. I don't need your shadowy "third realm" of senses and unsaturated entities. I have minds, objects, and relations.

  **Elena:** But you can't build a truth-bearer out of a list. A list is just a heap. $a, b, R$. That's a heap. $aRb$ is a fact. The difference is unity. I locate the unity in the logical type of the predicate. You locate it in the mind. But if the mind vanishes, does the truth vanish?

  **Marcus:** If no one judges it, there is no judgment. But there are still facts.

  **Elena:** Then the facts have unity! And we're back to Bradley. What unifies the fact?

  **Marcus:** The relation in the world!

  **Elena:** Is the relation saturated?

  **Marcus:** *Sighs.* If I say yes, I get regress. If I say no, I sound like you.

  **Elena:** Exactly. So why fight the unsaturatedness? Accept that reality has a functional structure.

  **Marcus:** Because accepting that forces me to speak nonsense to explain it. I'd rather speak sense about a slightly messier ontology than speak nonsense about a clean one.

  **Elena:** And I'd rather accept a linguistic paradox than surrender the objectivity of truth to the vagaries of "apprehension."

  **Marcus:** So we're at an impasse.

  **Elena:** We're at the boundary of what language can say about itself.

  **Marcus:** Fine. But if you ever manage to refer to an unsaturated concept without turning it into an object, buy me a coffee.

  **Elena:** And if you ever explain how a mental act creates order without presupposing order, I'll buy you two.
