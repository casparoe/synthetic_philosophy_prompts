answer: |-
  Here are ten questions designed for your podcast, ordered to build pressure on the guest's view while remaining accessible to a general educated audience. They include the specific required topics and the progressive challenge to her "smuggled questions" defense mechanism.

  ### 1. The Inflation Problem (Dependence Restriction)
  **Question:** You argue that omissions satisfy counterfactual dependence: if I had watered the plant, it would have lived, so my not watering it is a cause via dependence. But the Queen of England also didn't water my plant, and if she had, it would have lived. Does your dependence relation certify the Queen as a cause of my plant's death? If so, doesn't that explode the number of causes just as much as the view you're trying to fix?

  **Follow-up:** *If she says pragmatics or context filters out the Queen:* "If we need a separate pragmatic filter to stop the Queen from counting as a cause, is the dependence relation doing the metaphysical heavy lifting, or is it just a formal skeleton that requires normative flesh to be useful?"

  ### 2. The Symmetry Problem (Multiple Preventers)
  **Question:** Imagine five bystanders stand by a shallow pond where a child is drowning. Any one of them could have easily saved the child. Counterfactually, the child's death depends on *each* of them failing to act. Yet, if one is a lifeguard on duty, we blame him more than the tourists. Since all five satisfy your dependence relation equally, does your metaphysics have resources to distinguish the lifeguard's causation from the tourists', or does that distinction happen entirely outside your theory?

  **Follow-up:** *If she says the distinction is normative, not metaphysical:* "If the metaphysics treats the lifeguard and the tourist as identical causes, but the law and morality treat them differently, are you telling us that our causal intuitions in these cases are actually just moral intuitions in disguise?"

  ### 3. The Legal Duty Requirement
  **Question:** In criminal law, you generally aren't liable for an omission unless you had a pre-existing duty or special relationship to the victim. Do you see your distinction between production and dependence as *justifying* that legal rule—perhaps because duty tracks when dependence matters—or is your metaphysical view silent on why the law draws the line there, leaving it as a purely policy-driven exception?

  **Follow-up:** *If she says it's silent/compatible:* "If the metaphysics is silent on why duty matters, I'm worried my law students will walk away thinking your theory describes a world that doesn't match the one where legal liability is actually assigned. How do we bridge that gap?"

  ### 4. Explanatory Priority
  **Question:** You say omissions never satisfy physical production because no process flows from an absence. But in science, we often explain effects by citing what was *missing*—like a vitamin deficiency causing scurvy. If science accepts omission-explanations, but your 'production' relation rejects omissions, does that mean science is sometimes talking about a different kind of causation than the one fundamental to reality, or is your production relation too narrow?

  **Follow-up:** *If she says science uses the dependence relation:* "Then why do we feel the need to posit a 'production' relation at all for positive cases? If dependence does all the explanatory work in medicine and biology, is production just a metaphysical luxury?"

  ### 5. Mixed Cases (Poison and Antidote)
  **Question:** Consider a case where I poison you (production) and also fail to give you the antidote (dependence). Intuitively, the poisoning seems like the 'main' cause, and the failure to antidote is secondary. Does your view treat these as two equal but distinct causal relations stacking on top of each other, or does the presence of a production process somehow swamp or overshadow the dependence relation?

  **Follow-up:** *If she says they are distinct and stack:* "If they stack, why doesn't it feel like there are two separate causes in the room? If our ordinary language treats it as one causal event, doesn't that suggest the two relations are more intertwined than your split allows?"

  ### 6. Moral Weight of Production
  **Question:** Many people feel that killing someone (production) is morally worse than letting them die (dependence/omission). Does your metaphysics support this intuition? Specifically, is there something about 'physical production' that makes it a graver causal involvement than 'counterfactual dependence,' or does your view leave the moral difference unexplained?

  **Follow-up:** *If she says metaphysics doesn't dictate morality:* "If the metaphysical distinction doesn't map onto the moral distinction, why should we care about the metaphysical distinction when discussing responsibility, which is usually where these puzzles arise?"

  ### 7. Theoretical Parsimony
  **Question:** You resolve the dilemma by doubling the number of causal relations: we have production and we have dependence. Some critics might say this violates Occam's Razor—that it's better to have one relation that handles both cases, even if it's messy. What theoretical gain do we get from splitting causation in two that outweighs the cost of making our ontology more complex?

  **Follow-up:** *If she says it solves the paradox:* "But if the solution is just to say 'you were asking two different questions,' haven't you essentially dissolved the problem by changing the subject rather than solving the tension within a single concept of causation?"

  ### 8. Challenging the "Two Questions" Defense (Level 1)
  **Question:** You often suggest that when people are puzzled by omission causation, they are smuggling two questions into one sentence. But consider a doctor who says, "The lack of oxygen caused the brain damage." In that single sentence, they seem to be making a claim that is both physically descriptive and counterfactually robust. Is it possible that ordinary causal talk isn't actually ambiguous, but rather refers to a single relation that *can* be satisfied by absences in specific contexts?

  **Follow-up:** *If she insists on ambiguity:* "If ordinary talk is ambiguous, why don't speakers feel the ambiguity? When I say 'the lack of rain caused the famine,' I don't feel like I'm switching meanings compared to 'the rain caused the flood.' What explains that phenomenological unity?"

  ### 9. Challenging the "Two Questions" Defense (Level 2)
  **Question:** Let's push harder on that ambiguity. If production and dependence are truly distinct relations, they should be able to come apart in our judgments. But in almost every case where we deny an omission is a cause, we deny *both* that it produced anything and that it was the relevant dependence. Is there any case where ordinary speakers would affirm one relation but deny the other, proving that they actually track two separate concepts in real-time?

  **Follow-up:** *If she says laypeople are confused:* "If laypeople consistently fail to distinguish the relations you posit, on what grounds are we confident the distinction exists in the world rather than just in the theorist's model?"

  ### 10. The Falsification Condition (The Closer)
  **Question:** This is my final question. You claim the debate rests on a verbal confusion between two relations. But for this to be a substantive metaphysical claim and not just a definitional stipulation, there must be some evidence that could count against it. What would you count as evidence that ordinary causal talk is *not* ambiguous in the way your view requires, or that one of your two relations doesn't actually track anything real?

  **Follow-up:** *If she says nothing would count:* "If no evidence could show you're wrong, I worry we aren't discussing a metaphysical theory anymore, but a framework that's insulated from the very intuitions it was meant to save."
