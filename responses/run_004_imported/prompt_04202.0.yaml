answer: |-
  The debate over Pascal's Mugging is often framed as an epistemological crisis: *How can we assign priors such that we are not exploited by low-probability, high-stakes claims?* Eliezer Yudkowsky's original formulation, Robin Hanson's leverage penalty, and the subsequent "Pascal's Muggle" retreat all treat the problem as one of probability calibration. They assume the utility function is sacred—linear and unbounded in the number of lives affected—and attempt to salvage rationality by crushing the prior probability of "pivotal" hypotheses.

  I argue that this diagnosis is backward. The leverage penalty is neither descriptively accurate (it is not why humans reject the mugger) nor normatively robust (it fails against an ideal Bayesian agent with unbounded utility). The true solution lies in biting the bullet that the rationalist community has been most reluctant to swallow: **utility functions must be bounded (or at least sufficiently sublinear) in the number of people affected.**

  ### 1. The Failure of the Leverage Penalty

  To understand why the leverage penalty fails, we must look at the math of the mugger's offer. The mugger presents a hypothesis $H$: "Give me $5, or I will use my magic powers to simulate and destroy $N$ people."

  The Expected Value (EV) of paying is roughly $P(H) \times U(N)$.
  The leverage penalty proposes that $P(H) \approx 1/N$.
  If utility is linear, $U(N) \approx N$.
  Therefore, $EV \approx (1/N) \times N = \text{constant}$.

  If the EV is constant and positive (greater than the disutility of losing $5), the agent pays. To stop the agent, the prior must shrink *faster* than the utility grows. But the mugger can always specify a larger $N$ using concise notation (e.g., Knuth's up-arrow notation). The complexity of describing $3 \uparrow\uparrow\uparrow 3$ is low, so the standard Solomonoff complexity penalty is weak. The leverage penalty attempts to patch this by penalizing the *magnitude* of the impact.

  However, as Yudkowsky realized in "Pascal's Muggle," this creates a dogmatic agent. If you penalize the prior by $1/N$, you commit to believing that you are never in a position to affect $N$ people, regardless of the evidence. If you see the sky tear open and a giant face display the number $N$, a leverage-penalized Bayesian must conclude it is more likely that they are hallucinating or being tricked than that they are actually pivotal. This violates the principle of Bayesian updating: there is no likelihood ratio strong enough to overcome a prior that scales inversely with the evidence's magnitude.

  But even before we reach dogmatism, the leverage penalty fails to protect an agent with **unbounded utility**. Suppose the mugger offers not just to destroy $N$ lives, but to affect $f(N)$ units of utility, where $f$ grows faster than the leverage penalty shrinks. Since the mugger can define the threat using any computable function, they can always construct a threat where $U(N)$ outpaces the leverage penalty's $1/N$ reduction. An ideal Bayesian with a leverage penalty but unbounded utility is not safe; they are merely harder to mug. Given enough rhetorical creativity from the mugger, the EV will eventually exceed the cost of compliance.

  ### 2. Why Humans Don't Use Leverage Penalties

  Descriptively, the leverage penalty does not match human intuition. When a street mugger says, "Give me $5 or I'll kill 3^^^^3 people," the average person does not think, *"The prior probability of me being the unique decider for 3^^^^3 people is 1 in 3^^^^3."*

  They think, *"That sounds ridiculous,"* or *"Even if he could, 3^^^^3 lives isn't 3^^^^3 times more important than 1 life."*

  The intuition is not about the *probability* of the claim, but the *value* of the claim. Humans exhibit scope insensitivity. We do not feel $1,000,000$ times more anger about $1,000,000$ dead birds than about one. The rationalist community has historically treated this as a cognitive bug to be corrected. I argue it is a feature—a heuristic approximation of bounded utility that protects us from paralysis. We reject the mugger because our internal valuation function saturates, not because our probability estimates are magically tuned to cancel out astronomical stakes.

  ### 3. The Case for Bounded Utility

  If we accept that utility must be bounded, Pascal's Mugging dissolves. If $U(N)$ asymptotes to a maximum value $U_{max}$ as $N \to \infty$, then:

  $$ \lim_{N \to \infty} P(H) \times U(N) = 0 $$

  (assuming $P(H)$ shrinks with complexity, which it must).

  Even if $P(H)$ is small but non-zero, the product $P \times U$ remains small because $U$ cannot grow arbitrarily large. This allows an agent to remain open to evidence (unlike the Muggle) while remaining immune to mugging. You can update on the sky tearing open; you can assign a higher probability to the mugger having power. But because the utility of saving the universe is not infinitely more valuable than saving a city, the EV never overwhelms local, high-probability concerns.

  This preserves Bayesian epistemology. We do not need to hack our priors to save our decision theory. We simply acknowledge that the "value" dimension of reality has a limit, just as the "probability" dimension does.

  ### 4. Confronting the Cost: Scope Insensitivity

  The standard objection to bounded utility is moral repugnance. If utility is bounded, then there exists some number of lives $X$ such that saving $X + 1$ lives is not meaningfully better than saving $X$ lives. In the limit, saving a googolplex of lives is not significantly better than saving a trillion. This seems to violate the basic utilitarian premise that "more good is better."

  However, we must weigh this cost against the alternatives.

  **First, the alternative is decision-theoretic suicide.** An agent with unbounded utility is vulnerable to "Pascal's Mugging" in the wild. If there is *any* non-zero probability of astronomical stakes (simulations, multiverses, magic), an unbounded agent must ignore all local, certain goods to chase low-probability astronomical goods. This leads to an agent that ignores starving children in front of them to pray for a chance to save a simulated multiverse. This is not rationality; it is paralysis. A bounded utility function forces the agent to care about the near and certain, which is a prerequisite for actually doing good.

  **Second, boundedness does not require a hard "cliff."** We can model utility as a sigmoid or logarithmic function. Saving a billion lives is better than saving a million, and saving a trillion is better than a billion. But the *marginal* utility diminishes. The difference between a trillion and a trillion-and-one is negligible. This captures the intuition that scale matters, but not linearly. It acknowledges that moral value, like economic value or sensory pleasure, is subject to diminishing returns.

  **Third, we must distinguish between moral sentiment and decision constraints.** It is permissible to *feel* that a galaxy of suffering is worse than a planet of suffering. But when making *decisions* under uncertainty, we cannot act *as if* that difference is linear. To demand linear utility over astronomical numbers is to demand a cognitive capacity that no physical agent possesses. We cannot meaningfully distinguish between $10^{100}$ and $10^{101}$ suffering in our decision architecture. To build an agent that pretends it can is to build an agent that is exploitable.

  ### Conclusion

  The rationalist discourse on Pascal's Mugging has spent over a decade trying to solve a utility problem with epistemology. The leverage penalty was a valiant attempt to save linear utility by crushing priors, but as Yudkowsky's "Muggle" concession showed, it breaks the ability to learn from evidence. Furthermore, it fails to stop a determined mugger facing an unbounded utility function.

  The contrarian view is the simpler one: The mugger is not offering infinite value. No hypothesis offers infinite value. Our utility functions should reflect the physical and cognitive limits of agents. Accepting bounded utility commits us to scope insensitivity at the extreme limits, but this is a lesser evil than the alternative: a rationality that is either dogmatically blind to evidence (the Muggle) or perpetually vulnerable to exploitation by fantastical claims (the Mugging). We should not break our priors to save our utility functions; we should bound our utility functions to save our agency.
