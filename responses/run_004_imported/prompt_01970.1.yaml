answer: |-
  The dinner plates were stacked in the sink, still warm, but the air in the kitchen had cooled into something brittle. My parents were in the living room with Leo, laughing too loudly at a story he was telling about his commute. They were handling him like fine china that had been glued back together. They looked at him and saw the surgery scar hidden beneath his hairline; they saw the cyst that had pressed on his frontal lobe for three years; they saw a patient in remission.

  I stayed in the kitchen, drying a fork that was already dry.

  Leo walked in a moment later, grabbing a beer from the fridge. He looked good. The manic energy that had characterized the years of missing money and vanished weekends was gone, replaced by a steady, familiar calm. He was my brother again. That was the narrative. The tumor made him a stranger; the surgery brought him home.

  "Mom's making me go to therapy twice a week," Leo said, leaning against the counter. "Just maintenance. She thinks I'm fragile."

  "She's worried," I said.

  "I know. But I'm fine, Mark. I'm me." He took a swig, then hesitated. "I wanted to ask… I'm looking at apartments. I know I still owe you from before. The ten grand. I can't pay it back yet, but I wanted you to know I haven't forgotten."

  The heat hit me instantly. It wasn't a slow burn; it was a spike, physical and sharp, right behind the sternum. It was the same feeling I'd had the night he shoved our father against the wall, the night the police were almost called. I knew the biology. I had seen the MRI scans. I knew that the compression had degraded his impulse control, eroded his empathy, chemically altered his capacity for truth. Intellectually, I accepted the exemption. Leo belonged to the class of people Strawson might say we view objectively: compromised agents, to be managed rather than blamed.

  But my body didn't care about the MRI. My body remembered the threat.

  "It's okay," I said, my voice flat. "Don't worry about it."

  "I do worry about it," Leo said, frowning. "I want to make it right. I want us to be good."

  "We are good," I lied.

  "No, we're not." He set the beer down. "You've been looking at me like I'm a ghost all night. Or like I'm a bomb. Mom and Dad, they get it. They know it wasn't me. Why can't you let it go?"

  This was the crux. My parents had successfully shifted into the objective attitude. They loved him, but it was a detached love, the kind one offers a child or a convalescent. They managed his medication, they softened their voices, they absorbed his past debts as medical expenses. They had saved the brother by sacrificing the man. They no longer expected moral agency from him, only compliance and health.

  If I did the same, the resentment would vanish. If I looked at Leo and saw only a biological machine that had malfunctioned and was now repaired, I couldn't be angry. You don't resent a car for stalling. You don't resent a storm for breaking a window.

  But if I couldn't resent him, I couldn't stand beside him, either.

  "I know it wasn't you," I said, turning to face him. "Medically. I know that."

  "Then what is it?"

  "If I accept that it wasn't you," I said, the words forming slowly as I realized their weight, "then I have to accept that you weren't there. For three years, Leo, you weren't there. You were a thing that happened to us. A weather event."

  "That's exactly what I'm saying," Leo pleaded. "It was the tumor. So forgive the tumor."

  "If I forgive the tumor, I'm forgiving a condition. I'm treating you like a patient." I gripped the edge of the counter. "Do you understand what that means? If you aren't responsible for the shove, if you aren't responsible for the lies, then you aren't capable of goodwill. You're just… functioning."

  Leo looked confused, hurt. "I'm trying to be good now. Doesn't that count?"

  "It counts," I said. "But it doesn't erase the past. And if I wipe the past clean because of a scan, I'm saying you weren't a person then. And if you weren't a person then, how are you my brother now?"

  The silence stretched between us, heavy with the hum of the refrigerator. This was the tension my friend had tried to explain with those philosophy papers. The objective attitude is safe. It protects you from harm. But it exiles the other person from the community of moral equals. To treat Leo as fully exempt was to treat him as less than a man. To treat him as a man was to hold him accountable for things his brain literally could not control.

  "I don't want your pity, Mark," Leo said quietly. "And I don't want to be managed. I want my brother back."

  "I want my brother too," I said. "But my brother is someone who can hurt me. That's the price."

  "So you're keeping the score?"

  "I'm keeping the reality," I corrected. "The money you stole… you took it. Even if the tumor made it easy, you took it. You hurt Dad. Even if the tumor pushed your hand, your hand moved. If I pretend that didn't happen, if I say 'oh, that was just the sickness,' then I'm saying you're not capable of doing wrong. And if you're not capable of doing wrong, you're not capable of doing right. You're just a robot running new software."

  Leo looked down at his hands. He flexed his fingers, watching the tendons move. "That's a hell of a way to love someone. Holding them responsible for being sick."

  "It's the only way to respect them," I said. "Mom and Dad… they look at you and see something broken that needs fixing. I look at you and I see the guy who shoved our father. And I hate him for it. But I'd rather hate my brother than manage a patient."

  Leo looked up, and for the first time all night, his eyes weren't pleading. They were steady. There was a hardness there, a recognition. He understood that my anger was a form of acknowledgment. My resentment was a testament to his agency. I was refusing to let him off the hook because the hook was the only thing that proved he was human.

  "So what do we do?" he asked. "You stay mad?"

  "I stay honest," I said. "You owe me the money. Not because you can pay it, but because you owe it. You hurt Dad. You owe him an apology that isn't qualified by 'I was sick.' You owe him the admission that *you* did it."

  "That feels… unfair."

  "It is unfair," I said. "Life is unfair. Biology is unfair. But we're not biology. We're people." I picked up the dry fork and put it in the drawer. "If I stop being resentful, I stop expecting anything from you. I stop expecting you to be better than your biology. I'm not willing to lower the bar that much."

  Leo nodded slowly. He took his beer from the counter. He didn't smile, and the tension in the room didn't dissipate. The air was still brittle, but it was honest now. We weren't standing in a hospital waiting room anymore; we were standing in a kitchen, two adults with a history of violence and debt between them.

  "Okay," Leo said. "I owe you. I hurt him. I did it."

  "Good," I said.

  He walked out to the living room to rejoin our parents. I heard the volume of their voices drop instantly, shifting into that careful, modulated tone they used around the convalescent. I stayed in the kitchen. I felt the resentment still coiled in my chest, hot and uncomfortable. It wasn't going away. But as I listened to them coddle him, I realized I preferred the heat. The heat meant we were still in the same room. The heat meant he was still my brother.
