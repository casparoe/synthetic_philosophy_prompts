answer: |-
  **Setting:** *The lounge of the Grand Hotel, 1:15 AM. The conference on Metaphysics and Causation ended hours ago. Most of the grad students have gone to bed, but two senior figures remain. ELENA (50s, metaphysician, defender of the Humean supervenience project) and MARCUS (50s, philosopher of science, structural equation modeler) are nursing the last of their scotches.*

  **Marcus:** (Swirling his glass) I have to say, the seminar today was painful. Watching that poor grad student try to draw the graph for the Suzy and Billy case while you lot kept shouting "early preemption!" from the back row. It's 2024. We solved this twenty years ago.

  **Elena:** Solved it? You buried it under a pile of variables and pretended the metaphysics went away. Suzy throws, Billy throws, Suzy's rock hits. Billy's would have hit if Suzy's hadn't. The bottle shatters. Did Suzy cause the shattering? Yes. Does the shattering counterfactually depend on Suzy's throw? No. Because if Suzy hadn't thrown, Billy's rock would have hit it anyway. That's the problem. And don't tell me a directed acyclic graph makes that disappear.

  **Marcus:** The graph doesn't make it disappear; it models the asymmetry. $S \to B$, $S \to E$, $B \to E$. You set $S=1$ (Suzy throws). You intervene on $B$. If you set $B=0$ (Billy doesn't throw), $E$ still happens. If you set $S=0$, $E$ does not happen (because $B$ is fixed at 0 by the intervention). That's causation. It's clean. It's precise.

  **Elena:** It's circular, Marcus. That's the point you gloss over in every paper. To run that model, you have to specify which variables you "hold fixed" when you intervene. When you wiggle Suzy's throw, you hold Billy's throw fixed at zero. Why? Because in the closest possible worlds where Suzy doesn't throw, Billy *still* throws. You're smuggling in a similarity metric over possible worlds to justify your graph structure. You're doing Lewisian metaphysics; you just forgot to put the possible worlds in the footnotes.

  **Marcus:** (Laughs) Oh, come on. We're not smuggling anything. The graph represents the structural relations. The "holding fixed" is part of the definition of an intervention. An intervention on $X$ breaks the incoming arrows to $X$. It doesn't require a vague notion of "world similarity." It requires a manipulation.

  **Elena:** A manipulation is a causal notion! Woodward admits this openly. "An intervention is a causal process." So your analysis of causation relies on interventions, which rely on causation. You've given up on reductiveness. You're telling a story about how causal claims relate to other causal claims. I'm trying to tell a story about how causal claims relate to *non-causal* facts. Patterns of events. Laws. Matters of particular fact.

  **Marcus:** And how's that working out for you? Let's talk about your boy David. He spent thirty years chasing his tail on this. First, it was simple counterfactual dependence. Suzy/Billy killed that. So he pivoted to "quasi-dependence." Remember that? The idea that there's an intrinsic process from Suzy's throw to the shatter, and that intrinsic process is the same as in a world where Billy isn't there.

  **Elena:** It was a good intuition. Causation is intrinsic to the process.

  **Marcus:** It was a disaster. Think about the "Trumping" cases. The Major and the Sergeant both shout "Advance!" The soldiers advance because of the Major. But the intrinsic physical process from the Sergeant's shout to the soldiers' legs is identical to the process from the Major's shout. Same sound waves, same neural firing. If quasi-dependence is about intrinsic processes, the Sergeant caused it too. Lewis had to scrap it.

  **Elena:** He scrapped it because it couldn't handle *late* preemption or trumping, yes. That's why he moved to "Causation as Influence" in 2000. And that holds up.

  **Marcus:** Does it? "Influence." That was the second patch. Instead of a yes/no dependence, he said we look at ranges of alterations. If Suzy throws a bit harder, the shatter is different. If she throws a bit later, the shatter is later. But if Billy changes his throw—while Suzy's is held fixed—the shatter doesn't change. So Suzy influences the outcome; Billy doesn't.

  **Elena:** Exactly. It captures the asymmetry without needing a graph. It's just counterfactuals about *how* the effect occurs, not just *that* it occurs.

  **Marcus:** But Elena, be honest. What is "influence" other than a clumsy verbal description of a partial derivative in a structural equation? When Lewis says "if Suzy's throw were slightly different," he's asking you to evaluate a counterfactual. How do you evaluate it? You look for the closest world where the throw is different. How do you find that world? You minimize miracles. You maximize match of particular fact.

  **Elena:** Right. The Humean mosaic.

  **Marcus:** But *why* do you maximize match of fact in the future but not the past? Why do you allow a small miracle to prevent the cause rather than a big miracle to prevent the effect? Lewis says it's a "system of weights." But where do those weights come from? They come from our causal intuitions! You weight the worlds to get the causal verdicts you want. You're tuning the similarity metric to match the graph I drew five minutes ago.

  **Elena:** That's a cheap shot. The weights are based on law-violation and spatiotemporal match. It's not arbitrary. It's about preserving the nomological structure of the world.

  **Marcus:** Is it? Or is it about preserving the *causal* structure? Look, I'll grant you this: Interventionism isn't reductive. I don't claim to reduce causation to non-causal facts. Causation is a primitive feature of the world, or at least of our best models of it. But because I admit that, I don't have to perform gymnastics every time a new preemption case comes up.

  **Elena:** You call it gymnastics; I call it precision. If you give up on reductiveness, you give up on metaphysics. You're left with methodology. You can tell me *how* to test for a cause, but you can't tell me *what* a cause is.

  **Marcus:** And you can tell me what a cause is, but only by patching your theory every decade. Quasi-dependence died. Influence is struggling with "switch" cases. What happens when Suzy and Billy both throw, and a mechanism catches Suzy's rock but lets Billy's through? The influence patterns get messy. Do we need "Influence 3.0"?

  **Elena:** The theory evolves. That's philosophy. But at least I'm trying to ground it in something objective. The Humean mosaic. The distribution of qualities in spacetime. Your "interventions" are agent-relative. What counts as an intervention depends on what an agent *can* do. Does causation vanish if there are no agents to manipulate variables?

  **Marcus:** No, because the *possibility* of intervention is what matters, not the actuality. The structure is there regardless of whether anyone touches it. But let's go back to your "holding fixed" charge. You say my SEMs rely on a similarity metric. I say your similarity metric relies on a causal graph. When you decide that a world where Billy's rock vanishes mid-air is "further away" than a world where Suzy doesn't throw, you're making a causal judgment. You're deciding which connections are fragile and which are robust.

  **Elena:** I'm deciding based on laws. If the laws say rocks don't vanish, that world is distant.

  **Marcus:** But which laws? The causal laws! You're using the very thing you're trying to analyze to set up the analysis. It's a circle, Elena. A beautiful, complex, possible-worlds circle. But a circle. My circle is smaller. I say: Causation is about invariant relationships under intervention. To understand intervention, you need some causal knowledge. So what? We bootstrap. We start with what we know and refine the model.

  **Elena:** Bootstrapping isn't analysis. If I ask "What is water?" and you say "It's the stuff in the lakes," and I ask "Which stuff?" and you say "The water," you haven't told me anything. I want to know that it's H2O. I want to know that causation is counterfactual dependence (or influence) supervening on non-causal facts.

  **Marcus:** Maybe there is no H2O for causation. Maybe it's not that kind of natural kind. Look, the SEM approach gives us something Lewis never could: a way to handle quantitative causation, probabilistic causation, and path-specific effects without inventing new metaphysical categories for each. I can calculate the direct effect of Suzy's throw distinct from the indirect effect. Can your "influence" do that without turning into a graph?

  **Elena:** Lewis's influence handles probability. He talks about the *probability* of the effect changing.

  **Marcus:** But does it handle confounding? If there's a common cause of Suzy and Billy throwing—say, a signal from a trainer—Lewis's counterfactuals get notoriously tricky. You have to specify exactly which miracles occur to break the correlation. In my framework, I just d-separate the variables. I condition on the confounder. It's algorithmic.

  **Elena:** Algorithmic isn't ontological. You're giving me a calculator, Marcus. I'm asking for the territory. When you say "hold Billy fixed," you are asserting that there is a fact of the matter about what would happen if Suzy changed and Billy didn't, *independent* of our model. That fact is made true by the non-causal history of the universe and the laws. My job is to say how.

  **Marcus:** And my job is to say that your "how" is a black box labeled "Similarity." You say, "Find the closest world." I ask, "How do I measure distance?" You say, "By weighing miracles and match." I ask, "How do I weigh them?" You say, "So that causation comes out right."

  **Elena:** (Takes a sip, stares at the ice) That's not fair. The weights are motivated by our intuitions about lawhood and time.

  **Marcus:** Our intuitions about *causal* lawhood. Look, I'm not saying SEMs are perfect. Halpern and Pearl have to tweak the definitions of "actual cause" constantly to handle overdetermination. But we admit the tweaks are about capturing our conceptual commitments. You pretend you're discovering the metaphysical bedrock.

  **Elena:** And you pretend you're not doing metaphysics at all. But when you draw that arrow from $S$ to $E$, you're asserting a modal connection. You're saying $E$ *depends* on $S$. That's a metaphysical claim. The only difference is I'm trying to cash out that modal claim in terms of concrete particulars. You're leaving it as a primitive.

  **Marcus:** Because cashing it out costs too much. It costs you clarity. It costs you the ability to actually use the theory in science. A physicist doesn't use Lewisian similarity metrics to determine if a particle collision caused a decay. They use structural models. They manipulate parameters.

  **Elena:** Physicists also don't worry about whether time is real or an illusion, but I'd like to think we do. If interventionism is just for science, fine. But philosophy asks what makes the science *true*. What makes it the case that the intervention works? There must be a truthmaker.

  **Marcus:** The truthmaker is the structure of the system! The dispositions of the objects.

  **Elena:** Dispositions? Now you're a dispositionalist?

  **Marcus:** (Smiles) I'm a pragmatist. I care about the difference it makes. If I intervene on Suzy, the world changes one way. If I intervene on Billy, it changes another. That difference is real. Whether that difference reduces to Humean mosaic points or primitive powers... that's the metaphysical luxury I can afford to leave open. You can't. You've bet the farm on Humean supervenience.

  **Elena:** And you've bet the farm on the idea that "manipulation" is clearer than "counterfactual." But manipulation *is* a counterfactual. "If I were to intervene..." It's all subjunctives, Marcus. We're both in the business of possible worlds. I'm just honest about the ontology. You hide your worlds inside the "structural equations."

  **Marcus:** I hide nothing. The equations are tools.

  **Elena:** Tools for what? Mapping the modal structure of reality. Which is what I'm doing. The only difference is I think that structure supervenes on the local qualities. You think it's a separate layer.

  **Marcus:** I think it's a layer we can't peel back without losing the phenomenon. If you reduce causation to regularities plus counterfactuals, and counterfactuals to similarity, and similarity to... causal intuitions... you haven't reduced it. You've just built a very long loop.

  **Elena:** (Sighs, signals the bartender for water) We're not going to agree. You think my project is a futile attempt to eliminate the modal. I think your project is a capitulation that leaves the modal unexplained.

  **Marcus:** I think your project is a cathedral. Beautiful, intricate, towering. But nobody lives there. My project is a workshop. It's messy, it's noisy, but we build things that work.

  **Elena:** Cathedrals last longer than workshops, Marcus. When your variables change, when the models shift, the metaphysical question remains: *Why* did the intervention work? What in the world made it true?

  **Marcus:** And until you can answer that without using the word "cause" or "influence" or "similarity" in a way that presupposes causation, you're just preaching to the choir.

  **Elena:** And until you can answer it without shrugging and saying "it's a primitive," you're just doing engineering.

  *(They clink glasses. The noise of the bar rushes back in. Neither looks convinced, but both look tired.)*

  **Marcus:** Same time tomorrow? There's a session on probabilistic preemption.

  **Elena:** God help us. Yes.
