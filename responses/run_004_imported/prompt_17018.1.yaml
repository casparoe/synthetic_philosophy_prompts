answer: |-
  Good evening. For those of you who don't know me, I am the philosophy professor in the family. My father, as you know, is the Latinist. For forty years, he stood where I stand now, only with better grammar and a firmer command of the subjunctive.

  When we were asked to speak tonight, I felt a distinct pressure. To speak on a father's ninetieth birthday is significant; to speak on the ninetieth birthday of a man who has treated Cicero's *De Senectute* not as a syllabus item but as a personal creed is, to borrow a phrase, pointedly Ciceronian.

  In that dialogue, the aged Cato sits with two young men, Scipio and Laelius, and dismantles the four great complaints against growing old. My father has spent the last decade embodying Cato's rebuttals to the first three, and I would be remiss if I did not name them.

  The first complaint is that old age withdraws a man from active affairs. Cato answers that judgment, not muscle, steers the ship. He points to Fabius Maximus, the old general who saved Rome not by fighting, but by waiting, while younger, hotter heads demanded a battle. Dad, you retired from the classroom, but you never retired from the life of the mind. You have been our Fabius Maximus. You taught us that patience is not passivity, and that standing matters more than strength.

  The second complaint is that the body weakens. Cato admits this, but asks if the mind must weaken with it. He tells the story of Sophocles, dragged into court by his sons who claimed he was senile. Sophocles read them his newest play, and the jury declared him fit. You have shown us that while the hands may shake, the voice need not.

  The third complaint is that old age deprives us of pleasure. Cato argues this is actually a gift. He suggests that to be free from the tyranny of appetite is the highest pleasure of all. He praises the quiet joy of farming, of watching things grow without needing to consume them. You have shown us that a quiet dinner, a garden tended, and a book read are not consolations for a life ending, but the rewards of a life mastered.

  But then comes the fourth complaint: that old age is too close to death. Here, Cato offers two answers. The second is the famous one—the hope of the soul's immortality, the arguments of Socrates, the promise that we leave this life as a traveler leaves an inn, returning to a permanent home.

  We all know where my father stands on that. He is a cheerful materialist. He has told us often enough that he suspects Cicero was comforting himself with poetry he couldn't prove. And he has asked that we not borrow that comfort on his behalf tonight.

  So, I turn to Cato's first answer to the fear of death. It is the one my father claims. Cicero writes that a life, like a play, is not judged by its length, but by its perfection. A drama does not need to drag into a fifth act to have been a masterpiece. It needs only to be complete.

  Ninety years is a long run. But the measure of it isn't the time served; it is the integrity of the performance. It is the coherence of the character played. To accept that the curtain must fall is not a defeat; it is what gives the performance its shape. To live without the promise of an afterlife, and yet to find this life sufficient, generous, and full of love—that is a stoicism far more demanding, and perhaps more courageous, than hoping for a sequel.

  Dad, you have taught us that a life is complete when it is lived with virtue, regardless of the final act. You have lived the first three arguments of *De Senectute* with grace, and you face the fourth with honesty.

  So, please raise your glasses. To the actor who has mastered his role. To the teacher who taught us that the play is enough. To my father. Happy ninetieth birthday.
