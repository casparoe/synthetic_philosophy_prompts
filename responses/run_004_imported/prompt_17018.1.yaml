  9.  *(Final Word Count Check)*: A 700-word speech at a moderate pace is roughly 4.5 minutes. Perfect.

  **(Self-Correction Note on the Play Metaphor):** In *De Senectute*, Cicero writes: *"Ut enim comoediae, sic vitae non diuturnitas sed perfectio spectanda est"* (For as in a comedy, so in life, not the duration but the perfection is to be regarded). I should capture this sentiment without necessarily quoting Latin unless it feels natural. I'll keep it English for the family's sake but precise enough for the colleagues.

  **(Self-Correction on the "Inn" image):** The prompt specifically says "nothing about the soul's immortality should sneak in... however tempting a tidy Ciceronian ending would be." The "inn vs home" image is tied to the immortality argument (leaving the body as leaving an inn because the soul goes home). I must avoid this image entirely to be safe. Stick strictly to the "Play/Performance" metaphor.

