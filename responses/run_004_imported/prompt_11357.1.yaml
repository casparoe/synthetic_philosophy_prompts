answer: |-
  This is one of the oldest and most difficult questions in property law, ethics, and political philosophy. You are wrestling with the tension between **intergenerational commitment** (the idea that we are bound by the promises and values of our ancestors) and **intergenerational autonomy** (the idea that the living should not be governed by the dead).

  In legal theory, this is often called the problem of "dead hand control." In philosophy, it touches on the social contract between generations. Your friends' advice ("just sell") ignores the ethical weight of the promise; your cousin's advice ("hold firm") ignores the lived reality of the beneficiaries.

  To answer your question, we need a framework to distinguish between a **sacred trust** (which should be honored) and a **zombie rule** (which should be released). Here are three principled lenses through which to view your family's situation, followed by an assessment of where your specific case likely falls.

  ### 1. The "Means vs. End" Test
  The first distinction lies in identifying what your grandmother actually valued.
  *   **The Cabin as an End:** If the clause implies that the *physical structure and land* are sacred in themselves, regardless of use, then the rule is about preservation of property.
  *   **The Cabin as a Means:** If the clause implies that the cabin is a tool to facilitate *family connection, rest, and continuity*, then the rule is about family welfare.

  **The Principle:** A restriction deserves to bind descendants if it serves the *spirit* of the gift. If adhering to the *letter* of the gift destroys the *spirit* of the gift, the restriction has become pathological.

  **Your Case:** Your grandmother's stated fear was not that the land would be developed into a mall, but that "restless heirs" would sell due to short-term pressure, thereby losing a place for the family to gather. The *purpose* was family cohesion and stability. Currently, the cabin is causing financial strain and family conflict (18 vs. 1). If the cabin is no longer a place of gathering (most haven't visited in a decade) and is now a source of strife, the *purpose* is already defeated. Keeping the cabin to honor the grandmother is, paradoxically, violating her actual intent (family unity).

  ### 2. The "Undue Hardship" Threshold
  Philosophers and courts often recognize that circumstances can change so drastically that fulfilling an obligation becomes unjust. This is the legal doctrine of *cy pres* (as near as possible), applied when a trust's original purpose becomes impossible or impracticable.

  **The Principle:** A rule binds descendants only as long as the burden of compliance is proportional to the benefit. When an inheritance becomes a net liability—financially, emotionally, or socially—the "gift" has inverted. You cannot be morally obligated to accept a poison pill.

  **Your Case:** You mention that most of you "can no longer really justify our share of the taxes and upkeep." When an asset requires subsidy from people who do not use it, it ceases to be an asset and becomes a tax on the living. If 18 out of 19 beneficiaries view it as a burden, the "benefit" is theoretical, while the "cost" is concrete. This suggests the hardship threshold has been crossed.

  ### 3. The "Veto Power" Problem
  This is the most critical philosophical distinction in your specific trust. Your grandmother didn't just say "don't sell"; she said "don't sell unless *everyone* agrees."

  **The Principle:** In any collective governance, a unanimity clause is a double-edged sword. It protects the minority from the tyranny of the majority, but it also empowers a single individual to exercise tyranny over the majority. A rule becomes "hostage-taking" when the mechanism for changing it is statistically impossible to trigger due to the size of the group.

  **Your Case:** In the 1960s, there were three sisters. Unanimity among three people is difficult but possible. Unanimity among 19 descendants scattered across three countries is functionally impossible. By designing a clause that requires unanimity among an expanding group of beneficiaries, the trust effectively created a "perpetual lock."
  Your cousin is technically correct that the clause was designed to stop a "tired, cash-strapped majority." However, ethical governance requires that there be *some* mechanism for release. If one person can hold 18 others financially hostage indefinitely, the arrangement has shifted from a "family trust" to a "feudal entanglement."

  ### Where Your Family Falls
  Based on these frameworks, your situation leans heavily toward the side where **the rule should no longer bind.**

  Here is the hard truth about your grandmother's intent: She anticipated financial pressure. She anticipated heirs wanting to sell. She built the wall specifically to withstand *this* storm. Arguing that "she didn't anticipate this" is factually weak, because your mother confirmed she did.

  **However,** the ethical justification for overriding her wish rests on the **Means vs. End** and **Veto Power** tests.
  1.  **The Purpose is Dead:** The cabin is no longer serving as a hub for family unity. It is a source of division. Honoring the *building* is now dishonoring the *family*.
  2.  **The Mechanism is Broken:** A unanimity clause among 19 people is not a protection; it is a trap. It grants one person (your cousin) the power to impose financial will on 18 others. This violates the autonomy of the living.

  There is a famous quote by Thomas Jefferson regarding this exact problem: *"The earth belongs to the living... No society can make a perpetual constitution, or even a perpetual law."* He argued that one generation cannot morally bind another in perpetuity, because circumstances change and the dead have no rights over the living.

  Your cousin is acting as the guardian of the **Dead Hand**. You and the majority are acting as the stewards of the **Living Voice**. While your grandmother's wish was noble, the mechanism she chose (unanimity among an expanding lineage) contains a fatal flaw: it assumes the family would remain small and cohesive. It did not.

  ### A Principled Path Forward
  If you want to move forward without simply "ignoring" your grandmother, consider this distinction: **You are not rejecting her value; you are acknowledging that the vessel for that value has broken.**

  1.  **Reframe the Sale:** If the cabin is sold, the proceeds could be used in a way that honors the *spirit* of the trust. For example, a portion of the sale could go into a fund that subsidizes family reunions, or helps younger generations buy their own homes, or is donated to a land conservancy in the same region. This acknowledges the value of "place" and "family" without maintaining the physical burden.
  2.  **The Buyout:** Is it possible for the cousin who wants to keep it to buy out the 18 others? If they cannot afford to do so, it proves that the cabin is economically unsustainable for a single owner as well, reinforcing the argument for sale.
  3.  **Legal Reality:** In many jurisdictions, trusts cannot last forever (Rules Against Perpetuities). A lawyer might find that the trust has already expired by operation of law, regardless of the clause. This would solve the ethical dilemma by removing the constraint legally.

  ### Conclusion
  You asked if there is a principled way to tell the difference. The difference lies in whether the rule is **serving the family** or **the family is serving the rule.**

  For sixty years, the rule served the family. It kept a place safe. But now, the family is serving the rule. You are paying for a building you do not use to satisfy a condition that no longer achieves its goal.

  Your grandmother wanted to protect the family from short-term thinking. But there is a difference between short-term thinking (selling in a panic) and long-term adaptation (recognizing a model no longer works). Selling the cabin because it has become a financial drain and a source of conflict is not "restless"; it is responsible stewardship.

  You can honor your grandmother by acknowledging her wisdom protected the cabin for two generations, while accepting that her specific mechanism cannot hold for the third. The most respectful thing you can do for her memory may be to release the family from the burden, so the "family" part of "family trust" can survive even if the "cabin" part does not.
