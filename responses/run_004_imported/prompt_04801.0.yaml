      My mother would hate this. She'd hate the flowers and the talk of her "spirit." She spent 40 years fighting the idea that minds don't do anything. But she also didn't believe in ghosts. So how do we mourn? We mourn the cause. Her love was real. It wasn't just neurons. It was her. Like a novel is words, but it's also a story. Her story continues in us.

      *Critique 2:* Better. But needs to integrate the "proportionality" concept more elegantly for the philosophers. The "novel" metaphor is perfect for the speaker.

  8.  **Final Polish (incorporating the prompt's specific details):**
      *   Mention the funeral muttering.
      *   Mention the 40-year fight.
      *   Make the "level of description" argument clear but accessible.
      *   Ensure the ending is comforting but metaphysically safe.

      *(Self-Correction during drafting)*: Be careful not to say "Her mind survives." Instead, say "The effects of her mind persist," or "The reality of her mind is in the changes she made." Actually, the proportionality argument suggests the mental *property* is the cause. So, her love *was* the cause. The comfort comes from knowing her agency was real.

      *Revised Plan for the "Comfort":* The comfort isn't that *she* is somewhere else. The comfort is that *what she did* was real and irreversible. Her love wasn't a shadow; it was a hammer. It shaped us. That shape remains.

  9.  **Writing the Eulogy (incorporating the above):**
      *   Start with the anecdote about her muttering at funerals.
