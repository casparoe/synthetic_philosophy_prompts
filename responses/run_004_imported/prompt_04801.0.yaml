          *   *Crucial:* Avoid two specific comforts she hated:
              1.  Substance dualism (soul watching over us).
              2.  Epiphenomenalism (love was just a shadow of neurons).
          *   *Key Concept to Incorporate:* Yablo's proportionality idea (causation at the right level of description).
      *   **Tone:** Respectful, warm, intellectually honest, comforting without being metaphysically dishonest.

  2.  **Deconstruct the Philosophical Constraints:**
      *   *No Dualism:* Cannot say "She is in a better place," "Her spirit lives on," or "She is watching us."
      *   *No Epiphenomenalism:* Cannot say "Her body died, but her love remains" in a way that suggests the love is detached from the physical reality, nor can I imply her choices didn't matter because physics determined everything.
      *   *The Solution (Proportionality):* The cause of her impact on the world was *her* (her mind, her choices, her character), not just her atoms. The mental level is the *right* level to explain her life. Her love was real because it did real work at the level of human relationships.

  3.  **Determine the Audience Balance:**
      *   *General Audience:* Needs to hear about her love, her impact, her character, and feel that her life mattered.
      *   *Philosophers:* Need to hear that I understand her work and am not betraying her life's mission with clichés. They need to nod, not cringe.
      *   *Strategy:* Use metaphor and narrative (novelist style) to encode the philosophical concepts without using jargon. Explain the "level of description" idea through stories of her life.

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Acknowledge her specific nature (the funeral mutterer). This breaks the ice and honors her personality.
      *   **The Philosophical Problem (Simplified):** Address the "what happens now" question without lying. Acknowledge she didn't believe in ghosts.
      *   **The Core Argument (Proportionality):** How to explain Yablo/Kim without saying "Yablo/Kim"?
          *   *Idea:* A story is not just ink on paper. A melody is not just air vibrations. She was not just neurons.
          *   *Application:* Her kindness was a cause. It changed things. If we look too close (neurons), we miss the point. If we look too far (souls), we invent things. The *person* is the cause.
      *   **Her Legacy:** How her mind causally affected the world (students, family, colleagues). This proves mental causation.
      *   **Closing:** A final thought on grief that respects her materialism but affirms meaning.

  5.  **Refining the Language (The "Novelist" Voice):**
      *   Needs to be lyrical but precise.
      *   Avoid religious platitudes ("gone to a better place").
      *   Avoid reductionist coldness ("just biology").
      *   *Key Phrase to adapt:* "The right level of description."

  6.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Mom was smart. She hated fake stuff. She fought Jaegwon Kim. She didn't think she had a soul, but she didn't think she was a robot either. She thought her thoughts mattered. Like a story matters more than the letters. She loved us. That love changed us. So she is still causing things. Even though she's dead. Thanks.

