answer: |-
  Thank you all for coming.

  For those of you who knew my mother well, you know that standing here is a precarious undertaking. If she were in the audience, she would be listening with a critical ear. In fact, if she were in the audience, she would likely be leaning over to the person in the next seat, whispering that the very act of gathering here to honor her "memory" presupposes a continuity of self that the evidence does not support.

  She was a woman who found comfort in precision, even when precision was difficult. She spent nearly forty years arguing for a specific, fragile truth: that our minds are real, that our choices matter, and that we are not merely passengers in our own bodies.

  I am a novelist. I deal in stories. My mother dealt in the architecture of truth. And so, I find myself in the position of having to tell a story about her life that satisfies the heart without violating the mind.

  This is harder than it sounds. When we lose someone we love, the instinct is to reach for one of two comforts. The first is to imagine that she has shed her body like a coat, that there is a "she" distinct from the biology that has now gone to some other place to watch over us. My mother would have asked for the evidence of this. She did not believe she was a ghost in a machine. She believed she was the whole organism, thinking and feeling.

  The second comfort is the opposite. It is to say that she was merely biology, a complex arrangement of atoms that has now scattered, and that her love was just a chemical shadow, an epiphenomenon that didn't truly *do* anything. That the neurons would have fired the same way, held us the same way, loved us the same way, even if "she" hadn't been there.

  My mother fought this second idea harder than anything. She knew that to say her love was just a shadow was to say that her life didn't matter. And she knew, and we know, that is a lie.

  So, how do we mourn her without pretending she is somewhere else, and without pretending she was nothing more than matter?

  I think the answer lies in how we read. I write novels. Physically, a novel is just ink on paper. If you put a book under a microscope, you will not find a story. You will find cellulose fibers and carbon deposits. If you argue that only the ink is real, and the story is an illusion, you are technically correct about the ink, but you are missing the point of the book.

  The story is not separate from the ink. But the story is not *just* the ink. The story exists at the level of the sentence, the chapter, the narrative. It is real at that level. And because it is real at that level, it can do things the ink cannot. It can make you cry. It can change your mind. It can cause you to pick up a pen and write your own.

  My mother believed that a human life works the same way.

  She taught me that we must look at a life at the right level of description. If you look at her too closely, you see only neurons. If you look at her too distantly, you invent a soul. But if you look at her at the level of a person—a mother, a philosopher, a friend—you see the cause.

  Her kindness was not a shadow. It was a cause. When she comforted me, it was not just physics; it was *her*. Her choices were not illusions; they were the reasons things happened. The way she shaped this family, the way she mentored her students, the way she argued with her colleagues—these were events caused by her mind.

  And here is the comfort that I hope we can all share, the comfort she would have allowed us.

  Causation leaves a mark. If you push a domino, it falls. If you take your hand away, the domino remains fallen. The cause is gone, but the effect remains.

  My mother is gone. There is no part of her hovering above this room. But the causal impact of her mind is woven into the fabric of our lives. The way I speak to my children, the way her colleagues pursue their work, the way we value truth over comfort—all of this is the enduring effect of her mental causation.

  She is not watching us. But she is in us. Not as a spirit, but as a shape. She shaped the world. She shaped me. And that shape is stable.

  To the philosophers in the front row: She would want me to tell you that she won the argument. Not because she proved the impossible, but because she proved that we are not powerless. She proved that when she held our hands, it was *her* holding them. And that when she loved us, that love was a force in the physical world, as real as gravity, as irreversible as time.

  We are not mourning a ghost. We are mourning a cause. And the effects of that cause are still happening. They are happening in this room, right now.

  Thank you.
