  **Justifications**

  **Move 1 (Score: 1):** This is a standard and defensible argument for causal skepticism regarding omissions (akin to Moore or Dowe). It correctly identifies the "profligacy problem": if counterfactual dependence suffices for causation, everything's omissions become causes. However, the inference from "selection tracks norms" to "there is no causal fact" is contentious; it assumes causation must be purely descriptive, which is the very point in dispute.

  **Move 2 (Score: 2):** This is the strongest move. It correctly identifies that profligacy and selection problems plague positive causation (e.g., Lewis on overdetermination) just as much as omissions. If the metaphysician accepts pragmatic selection for overdetermined positive causes, consistency demands she accept it for omissions, or reject it for both. This exposes a potential inconsistency in the metaphysician's criteria.

  **Move 3 (Score: 1):** This is a coherent defense within a Process Theory of causation (e.g., conserved quantities). It correctly notes an ontological asymmetry: overdetermination involves two physical processes, while omissions involve none. However, it begs the question against counterfactual or interventionist theories which do not require physical processes as a necessary condition for causation.

  **Move 4 (Score: 1):** This applies valid pragmatic pressure by highlighting the theoretical cost of the metaphysician's view (revisionism about law/folk concepts). However, it presents a slight false dichotomy; a third option is that metaphysics *should* revise legal doctrine, or that legal "causation" is a hybrid concept mixing metaphysics and policy. Still, it effectively flags the stakes.

  **What Both Are Missing**

  Both parties are operating with a **binary conception of causation** (cause vs. non-cause) and ignoring the **contrastive nature of causal claims**. As argued by Schaffer and Hitchcock, causation is quaternary: $c$ rather than $c^*$ caused $e$ rather than $e^*$.

  On a contrastive model, the neighbor's omission causes the death relative to the contrast of *the neighbor watering*, but the mayor's omission does not cause the death relative to the contrast of *the mayor watering* (because the mayor's watering is not a relevant contrast in the context). This resolves the "profligacy" problem without denying omissions are causes (satisfying the law student) and without relying solely on vague "salience" (satisfying the metaphysician). Additionally, for your work on moral responsibility, it is crucial to distinguish **causal explanation** from **causal relation**. The metaphysician is tracking the relation (ontological), while the law student is tracking explanation (pragmatic/normative); much of the disagreement dissolves if they acknowledge they are defining different explananda.
