      *   *Check:* Is the case against eliminativism strong enough? Need to emphasize that it makes too much of our discourse false. Also, the "special composition question" (when do parts make a whole?) is just as hard for eliminativists who admit *some* composites (like organisms) but not artifacts. If they admit *no* composites, they face the "chair" problem.

