      *   *Constraint:* Indistinguishable intersections. Must use same probability $x$ to continue at both.
      *   *Planning Optimal:* Maximize $U(x) = (1-x) \cdot 0 + x(1-x) \cdot 4 + x^2 \cdot 1 = 4x - 3x^2$. Derivative $4 - 6x = 0 \Rightarrow x = 2/3$. Payoff $4/3$.
      *   *The Paradox:* When at an intersection, the driver thinks: "What is the probability I am at $X$ vs $Y$?"
      *   *Naive Update:* If I'm using strategy $x$, probability of reaching $X$ is 1. Probability of reaching $Y$ is $x$. So $P(X) = 1/(1+x)$, $P(Y) = x/(1+x)$.
      *   *Action Optimization:* Expected utility of Continuing ($C$) vs. Exiting ($E$) *at the intersection*.
          *   $EU(C) = P(X) \cdot [x \cdot 4 + (1-x) \cdot 1] + P(Y) \cdot 1$ ... Wait, need to be careful with the payoff structure.
          *   Let's refine the on-the-spot calculation.
          *   If at $X$: Continue $\to$ face $Y$. Exit $\to 0$.
          *   If at $Y$: Continue $\to 1$. Exit $\to 4$.
          *   $EU(C) = P(X|info) \cdot (x \cdot 4 + (1-x) \cdot 1) + P(Y|info) \cdot 1$.
          *   $EU(E) = P(X|info) \cdot 0 + P(Y|info) \cdot 4$.
          *   Using $P(X) = 1/(1+x)$ and $P(Y) = x/(1+x)$.
          *   Equating $EU(C) = EU(E)$ leads to a different optimal $x$ than $2/3$ unless specific conditions are met.
      *   *Aumann, Hart, Perry (AHP) Resolution:* Consistency condition. The belief about being at $X$ or $Y$ must be consistent with the strategy used to get there. This creates a fixed-point problem.

