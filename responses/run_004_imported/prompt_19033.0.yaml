      2.  Ben (Restriction): Ben wins. This is the standard fix.
      3.  Nora (Uselessness): Nora wins. This is the "vacuousness" objection.
      4.  Ben (Cond Analogy): Draw/Ben. It's a good analogy, but Cond is synchronic/diachronic hybrid. Let's give Ben the point on structural parity.
      5.  Nora (DB/Formulation): Nora wins. The original DB argument *does* collapse without the restriction, making the restriction a substantive change, not just clarificatory.

