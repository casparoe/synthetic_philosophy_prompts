      *(Self-Correction during drafting)*: I need to be careful with the Dutch Book point. Van Fraassen's original DB argument *does* fail if the agent knows the future credence is unreliable. So Nora is right that the *unconditional* DB argument fails in the drug case. Ben's move to restrict it is necessary, but Nora is right that it changes the nature of the principle. I should emphasize that the "Restriction" essentially turns RP into a theorem of Conditionalization rather than a standalone axiom.

      *(Refining the "What They Miss" section)*: I should mention that RP is often seen as a consequence of Conditionalization plus the assumption that you learn *only* that your credence changed (or that you learn your future credence as evidence). If you view RP as derivative, Ben's analogy holds more water. If you view it as primitive, Nora's objection holds more water. Also, the distinction between *knowing* your future credence vs. *expecting* it.

