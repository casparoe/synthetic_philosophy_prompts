answer: |-
  **Setting:** *A county jail holding area. The lighting is harsh fluorescent hum. ELENA sits on a metal bench inside a cell, still in her protest gear, though her jacket is gone. MARCUS stands on the other side of the bars, holding a paper bag with her belongings and a set of bail papers.*

  **Marcus:** They told me you refused the citation. You could have signed the ticket and been home an hour ago. Instead, you're waiting for a judge.

  **Elena:** *(Takes the bag through the slot)* Signing the ticket is part of the processing, Marcus. But staying? That was the point. If I demand the rights of a citizen to protest, I have to accept the responsibilities of a citizen when the line is crossed.

  **Marcus:** But that's the fiction I can't swallow. You talk about responsibilities like they're real debts. Why do you owe *this* court anything? You blocked a highway to save the planet. The state is the one burning it. Why give them the moral high ground by kneeling?

  **Elena:** It's not about kneeling. It's about fidelity. We live in a nearly just society. It's flawed, obviously. But it's a scheme of cooperation. Rawls argues we have a natural duty of justice to support and comply with just institutions.

  **Marcus:** *(Leans against the bars)* There it is. The natural duty. Elena, look at me. I've read the *Theory of Justice*. I've also read Simmons. A duty of justice might tell you to support *just institutions* generally. But it doesn't tell you to support *this* government. That's the particularity problem. Why does a duty owed to humanity bind you specifically to the United States of America?

  **Elena:** Because this is the institution that structures my life. It's the one providing the framework where my protest even makes sense.

  **Marcus:** Does it? Or is that just geography? If your duty is to justice, and you wake up tomorrow in a reasonably just Canada, do you owe them obedience too?

  **Elena:** Presumably.

  **Marcus:** Then the obligation isn't to the *state*. It's to the *principle*. So when this state violates the principle—like, say, by subsidizing fossil fuels despite knowing the harm—your duty to the principle should override your duty to the state. You shouldn't be sitting in here accepting their punishment. You should be rejecting their authority entirely.

  **Elena:** But if I reject their authority entirely, I'm not engaging in civil disobedience anymore. I'm engaging in revolution. Or sabotage.

  **Marcus:** And what's so wrong with that, if the obligation is a myth? If I don't owe them obedience, I don't owe them my body in their cage either.

  **Elena:** *(Stands up, walks to the bars)* Because you draw a line, Marcus. I know you. You wouldn't sabotage the pipeline. You wouldn't hurt a worker. You'd still protest publicly. You'd still try to persuade.

  **Marcus:** That's prudence, not obligation. I don't want to live in a war zone.

  **Elena:** Is it just prudence? Or is it because you recognize that without a general presumption of obedience, the coordination we need to solve climate change collapses? If everyone decides for themselves which laws to follow based on their own calculus of justice, we don't get justice. We get chaos.

  **Marcus:** That's the "fair play" argument. But I didn't ask for the benefits of this scheme. I didn't sign up. Just because I breathe the air they protect doesn't mean I consented to their rules.

  **Elena:** You didn't consent to the air, but you rely on the order. Look, if you truly believe there is no obligation to obey the law *as such*, then your restraint is purely tactical. You're not breaking the law because it's *wrong* to break the law; you're not breaking it because it might backfire.

  **Marcus:** Exactly. Consequences matter.

  **Elena:** But consequences change. If sabotage worked better? If blowing up a compressor station actually stopped more carbon than a blockade, and you could get away with it… would you do it?

  **Marcus:** *(Pauses)* That's a trap.

  **Elena:** It's a boundary. My view gives me a principled reason not to blow up the station, even if it worked. I owe a duty to the system that allows us to resolve disputes without violence. Your view… it leaves you floating. You only stay nonviolent as long as it's convenient.

  **Marcus:** Or as long as it's moral. I don't need a state to tell me violence is wrong.

  **Elena:** But the law isn't just about violence. It's about predictability. By accepting the punishment, I'm signaling that I'm not an enemy of the system. I'm a participant trying to correct it. That invites the majority to listen. If I run, or if I fight the arrest, I become a criminal. If I sit, I'm a conscience.

  **Marcus:** *(Sighs, rubs his face)* I get the strategy, Elena. I do. It's effective rhetoric. But don't dress it up as moral obligation. You're not obeying because you *owe* them. You're obeying because you're trying to shame them. You're using your arrest as a prop.

  **Elena:** Maybe. But the prop only works if the audience believes the actor believes in the stage. If I act like the law is meaningless, why should they listen to me when I say the climate crisis is urgent? I have to show I respect the rules enough to suffer for breaking them.

  **Marcus:** So it's instrumental.

  **Elena:** It's constitutive. You can't build a just society by acting as if justice doesn't exist yet.

  **Marcus:** *(Shakes head)* Simmons would say you're conflating "it's good to support justice" with "you must obey this specific statute." You're letting them hold you hostage for a duty that doesn't exist. They aren't just, Elena. Not on this issue. And by sitting here, you're validating their right to judge you.

  **Elena:** And by bailing me out, you're validating my right to choose.

  *(Marcus looks at the bail papers in his hand.)*

  **Marcus:** I'm not validating the court. I'm validating you.

  **Elena:** Then trust my judgment on this. I need to spend the night. Let the judge see I'm serious.

  **Marcus:** *(Crumpling the papers slightly, then smoothing them out)* If I leave you here, you know the anarchist in me thinks this is martyrdom for a god that doesn't exist.

  **Elena:** And the Rawlsian in me thinks you're free-riding on the stability you claim to reject.

  **Marcus:** *(A faint smile)* Touché. But seriously. If the charges stick… if they actually sentence you…

  **Elena:** Then I'll serve it. And you'll visit. And we'll keep arguing.

  **Marcus:** *(Steps back from the bars)* I'll be out here. When you're ready to admit you don't owe them a damn thing, I'm picking you up.

  **Elena:** When you're ready to admit you owe it to them to keep the peace, you can join me.

  **Marcus:** Don't hold your breath.

  **Elena:** Neither will I.

  *(Marcus turns to leave, stopping once at the door to look back. Elena sits back down on the bench, calm, watching him go.)*
