      *   **Topic:** The Judy Benjamin problem (specifically, whether $P(Blue)$ should remain $0.5$ or shift to $\approx 0.53$ upon receiving conditional evidence about Red Territory).
      *   **Characters:**
          *   *Invariance Defender (ID):* Believes $P(Blue)$ must stay $0.5$. Argues that shifting implies conjuring information. Needs to propose a principled rule, not just stipulation.
