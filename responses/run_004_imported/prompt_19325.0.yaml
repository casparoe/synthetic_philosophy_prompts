  2.  **Deconstruct the Judy Benjamin Problem:**
      *   **Prior:** $P(R \cap H) = P(R \cap S) = P(B \cap H) = P(B \cap S) = 1/4$.
      *   **Evidence:** $P(S | R) = 3/4$ (Odds 3:1 for Second Company given Red).
      *   **Constraint:** $P(R \cap S) / P(R \cap H) = 3$. Or $P(R \cap S) = 3 P(R \cap H)$.
      *   **Van Fraassen's Solution (Infomin):** Minimize $D_{KL}(Q || P)$ subject to the constraint.
          *   Result: $Q(B) \approx 0.53$. $Q(R) \approx 0.47$.
          *   Why? Because keeping $Q(R) = 0.5$ while changing the internal ratio of $R$ changes the "shape" of the distribution more (in terms of KL divergence) than allowing $Q(R)$ to slide slightly to accommodate the ratio change while keeping the ratio between $R$ and $B$ blocks somewhat stable.
      *   **Invariance Intuition:** The message is *only* about Red. Learning about the internal structure of Red shouldn't tell you whether you are in Red or Blue.
