answer: |-
  The seminar room smelled of dry-erase solvent and stale rain. Outside, the campus was dissolving into a gray November dusk, but inside, the whiteboard still bore the skeletal remains of the afternoon's syntax tree. Priya Chandrasekaran was erasing it, methodical strokes of the felt pad, while Daniel Voss sat on the edge of a desk, swinging one leg, watching her.

  They had been friends since the master's program, back when they bonded over a shared disdain for Gricean maxims. Now, three years into the PhD, the disdain had turned inward.

  "You used it," Daniel said. He didn't look at her; he was watching the white dust settle on Priya's cardigan. "In the draft. Chapter four."

  Priya didn't turn around. "I rendered the character's consciousness. Free indirect discourse. It's the standard technique for—"

  "Not the technique. The word." Daniel hopped off the desk. "You know we're talking about the semantics of *S* today. And yet, in your own prose, you deployed *S* unquoted. In the narrative voice, effectively."

  Priya capped the marker and turned. "It wasn't the narrative voice. It was FID. It bleeds the character's idiom into the third person. It's insulated."

  "Is it?" Daniel stepped closer, picking up a piece of chalk, rolling it between his fingers. "That's the question, isn't it? On your view—the semantic view—the derogatory content isn't an add-on. It's not a pragmatic flourish. It's part of the truth conditions. It's part of what the sentence *says*."

  "And?"

  "And if I say, 'The *S* is in the garden,' on your view, I have asserted something false. Because nobody satisfies the essentialist, derogatory conditions encoded in *S*. The proposition is false. So when your narrator writes, *He wondered if the *S* would show up*, the narrator is asserting a falsehood."

  "The narrator is reporting the character's belief," Priya said, leaning back against the chalkboard ledge. "The truth of the report doesn't depend on the truth of the belief."

  "But FID blurs the speaker," Daniel countered. "In direct discourse, *He thought: "That S is coming,"* the quotation marks insulate you. In indirect discourse, *He thought that the S was coming,* you're embedding it under a propositional attitude verb. But FID? *Would the S show up?* There are no quotes. There's no 'he thought.' It looks like the narrator's voice. If the semantics of *S* are inherently toxic, as you claim—if the term itself carries the falsehood—then by using it, even in FID, aren't you contaminating the narrative context? You're forcing the reader to process a false, derogatory proposition as the baseline reality of the sentence."

  Priya crossed her arms. "That's a pragmatic worry, Daniel. You're worried about the *effect* on the reader. I'm talking about the truth conditions. The sentence *He wondered if the S would show up* is true if he indeed wondered that. The embedded clause doesn't have to be true for the whole sentence to be true. My semantics hold."

  "But does the *ugliness* hold?" Daniel pressed. "If the derogatory content is semantic, it's not cancellable. I can't say, 'The S is coming, but I don't mean anything derogatory by it.' On your view, that's a contradiction. So if your narrator uses it, the narrator is semantically committed to the derogation. Even if it's FID. You haven't insulated the prose. You've just hidden the endorsement behind a grammatical mood."

  Priya pushed off the board. "Okay. Turn it around. Chapter twelve. Me and my friends at the diner. We're using *S*. Affectionately. Reclaimed."

  Daniel winced, just slightly. "I know."

  "On your view," Priya said, her voice sharpening, "the derogatory content is a conventional implicature. It rides on top of a neutral truth-conditional core. The word refers to the same group as the neutral counterpart, but it adds a side-order of contempt."

  "Basically."

  "So explain the reclamation," she said. "If I call my friend *S* with a smile, on your view, what am I doing? Am I asserting a truth and implicating contempt? That makes me a hypocrite. Am I asserting a truth and *not* implicating contempt? Then how did the implicature vanish? Conventional implicatures are supposed to be attached to the word, not the context. If it's conventional, it's stable. You're saying the word itself is stained, but I can just wipe the stain off because I'm part of the group?"

  Daniel tossed the chalk into the tray. It clattered loudly. "Context sensitivity. Expressive content is sensitive to the common ground of the conversation. When you use it in-group, the expressive value flips. It's still an expressive layer, but the valence changes from contempt to solidarity. The truth-conditional core remains neutral, so the sentence is true, and the expressive content reflects the relationship. It's elegant, Priya. It explains how the reference stays fixed while the force changes."

  "It's too elegant," Priya snapped. "It makes the harm accidental. On your view, when a bigot uses *S*, they're saying something *true* about the person, just with a rude tone. You're giving the bigot a truth-conditional win. You're saying, 'Yes, the person is an S, that part is correct, you're just being mean about it.' My view denies them that. On my view, when the bigot uses *S*, they are speaking falsely. They are attributing a property that doesn't exist. There is no 'S' essence. The sentence is a lie."

  "And that helps the victim how?" Daniel asked softly. "Does it sting less to know the slur is semantically false? Or does it sting more because now the language itself is broken?"

  He walked to the window, looking out at the rain. "And it brings us back to your book. If your view is right, and the term is semantically void... why does it hurt to read it in your draft? If it's just a false predicate, why did I feel my stomach drop when I saw it on the page?"

  Priya was quiet for a moment. She picked up the eraser again, dusting off her hands. "Because semantics isn't just logic. It's history. The falsity of the term is built on real violence. But Daniel, if I adopt your view... if I say the narrator can use *S* because it's just a pragmatic implicature... then I'm saying the narrator *can* use it. That there's a context where it's appropriate for the narrative voice to deploy that term, provided the implicature is managed."

  "I didn't say appropriate. I said possible."

  "It's a distinction without a difference in fiction," Priya said. "If the theory allows it, the author feels licensed. You're giving the narrator a loophole. 'Oh, it's just expressive content, I'm not endorsing it.' But in FID, the reader lives inside the head. If the head thinks in *S*, and the semantics of *S* are purely expressive on your view, then the reader is just inhabiting a rude perspective. On my view, the reader is inhabiting a *deluded* perspective. They are seeing the world through a lens of falsehood."

  "Is delusion better than rudeness?" Daniel turned back to her. "Or is it worse? If the narrator is deluded, is the text critiquing the bigotry, or reproducing it?"

  "That's not a semantic question. That's literary criticism."

  "It's everything!" Daniel threw his hands up. "We're trying to build a theory of meaning that accounts for how we live. You want to say the word is false. I want to say the word is true but toxic. But neither of us can explain why *you* get to use it in chapter twelve and the *narrator* shouldn't use it in chapter four. On your view, if you use it in chapter twelve, you're asserting a falsehood about your friend. You're calling them something that doesn't exist. Are you lying to your friend?"

  Priya laughed, a short, brittle sound. "No. Because reclamation changes the semantics. It's a different word. Homonymy. *S-derogatory* vs. *S-reclaimed*."

  "Aha!" Daniel pointed at her. "Ad hoc. You're positing a lexical ambiguity to save your truth conditions. You're saying it's a different entry in the mental lexicon. But phonologically, orthographically, historically, it's the same. You only make it a different word to avoid the contradiction."

  "And you," Priya shot back, "are positing a magical context-sensitivity for implicatures to avoid the contradiction. You say the contempt vanishes because we're friends. But if the contempt is *conventionally* implicated, it shouldn't vanish. It should be detachable only by changing the word. If I can keep the word and lose the contempt, then the contempt wasn't conventional. It was conversational. But you don't want to say that, because then the bigot could say, 'I didn't mean it conversationally,' and you'd have no grip on him."

  Daniel rubbed his face. He looked tired. "So we're stuck. My view lets the bigot speak truthfully, which is morally repugnant. Your view makes you a liar when you reclaim the word with your friends, which is theoretically messy. And neither of us can tell your narrator whether they're allowed to write the word in FID without the book itself becoming an act of violence."

  "Maybe that's the point," Priya said. She picked up her bag. "Maybe the theory shouldn't make it easy. If the theory gave us a clean answer—if it said, 'Yes, write it,' or 'No, never write it'—then we'd be treating the word like 'cat' or 'table.' The fact that our best semantic theories break down when they touch it... maybe that's the only accurate representation of the thing."

  Daniel watched her pack her notebook. "That's poetic, Priya. It's not a dissertation."

  "No," she said, slinging the bag over her shoulder. "But the dissertation is going to be wrong. Either I'm lying to my friends, or you're telling the truth about bigots. I know which one I can live with."

  She moved toward the door. She paused with her hand on the handle.

  "And Daniel? In the draft? The FID sentence? I'm keeping it."

  Daniel stood alone in the center of the room, surrounded by the erased ghost of the syntax tree. "I know," he said to the empty air. "That's what I'm afraid of."

  Priya left the door open. The sound of the rain rushed in, filling the silence, loud enough to drown out any further argument, if there had been one left to make.
