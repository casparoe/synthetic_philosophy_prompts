  **TO:** Incident-Response Tooling Review Board
  **FROM:** [Your Name/Title]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Probability Update Logic for On-Call Automation (Rollout Decision)

  ### Executive Summary

  I recommend we **delay the Thursday rollout** of the current incident-probability bot. Neither the existing KL-divergence logic nor Engineer 1's proposed "local renormalization" patch is suitable for production.

  Instead, I propose we implement a **Factorized Bayesian Model** (Option 3). This approach structurally separates cluster-level probability from service-level probability. It achieves Engineer 1's operational goal (preventing probability mass from "leaking" between clusters) without validating Engineer 2's concern (hard-coding an arbitrary hierarchy). This refactor requires approximately two weeks for implementation and shadow testing.

  ### Problem Analysis

  The current incident bot maintains a flat probability distribution over four subsystems ($P_{US,GW}, P_{US,Auth}, P_{EU,GW}, P_{EU,Auth}$). When a signal arrives regarding the internal ratio of the US cluster (Gateway vs. Auth), the bot minimizes KL divergence against the prior.

  Mathematically, this is consistent. However, operationally, it produces a counter-intuitive result: a signal confirming a fault within the US cluster causes the total probability of a US fault to *drop* (from 50% to 47%), shifting confidence to the EU cluster. This violates the causal independence of our infrastructure; evidence about US services should not alter our belief in EU health unless a shared dependency is implicated.

  ### Evaluation of Current Options

  *   **Status Quo (Engineer 2):** Shipping the KL-minimization bot as-is.
      *   *Risk:* High. On-call engineers will lose trust in the tool if paging probability shifts away from the cluster generating signals. It violates the Principle of Least Surprise.
  *   **Local Patch (Engineer 1):** Hard-coding a rule to renormalize only within the named cluster.
      *   *Risk:* Medium. While it fixes the immediate US/EU leak, it hard-codes "Cluster" as the primary hierarchy. If we later receive a global signal (e.g., "Auth is failing globally"), this patch would prevent necessary probability updates across clusters, requiring new patches for every new dimension (Region, Service, Tier).

  ### Recommendation: Factorized Bayesian Model

  We should update the bot's underlying representation from a flat vector of four probabilities to a hierarchical model:
  $$P(Incident) = P(Cluster) \times P(Service | Cluster)$$

  **How this resolves the conflict:**
  1.  **Operational Correctness:** A signal about "US Gateway vs. US Auth" updates only the conditional term $P(Service | US)$. The marginal $P(EU)$ remains untouched naturally, satisfying Engineer 1's requirement without a hack.
  2.  **Mathematical Rigor:** A signal about "Gateway vs. Auth" globally updates the service priors, propagating correctly to both clusters. This satisfies Engineer 2's requirement for a non-arbitrary, generalizable model.

  ### Rollout Timeline

  *   **Oct 24 – Oct 27 (Dev):** Refactor probability store to support factorized state. Implement update rules for conditional vs. marginal evidence.
  *   **Oct 30 – Nov 3 (Shadow Mode):** Run new model in parallel with existing ticketing data. Verify that paging recommendations match historical post-mortems better than the flat model.
  *   **Nov 6 (Rollout):** Enable factorized bot for all P1/P2 incidents.

  ### Substantive Treatment of the Counter-Argument

  In rejecting the Status Quo (Engineer 2's position), I must address their strongest point: **The Risk of Assumed Independence.**

  Engineer 2 correctly argues that protecting the "Cluster" split is arbitrary because failures are not always independent. A bad configuration deploy to the Auth service could take down both US-Auth and EU-Auth simultaneously. A flat KL-divergence model captures these correlations implicitly; if "Auth" starts looking suspicious in the US, the flat model naturally bleeds some probability to EU-Auth because it treats all four buckets as potentially correlated competitors for the "single fault" hypothesis.

  By moving to a Factorized Model, we are explicitly assuming conditional independence ($P(US, Auth)$ is independent of $P(EU, Auth)$ given the global Auth health). If we do not model the "Global Auth Failure" node explicitly, the factorized model might under-weight correlated failures compared to the flat KL model.

  **Mitigation:** This is a modeling choice, not a bug. We will mitigate this by ensuring the factorized graph includes a "Global Service Health" parent node that can correlate cluster-level failures. However, the Board must accept that no model is perfect; the Factorized Model trades the risk of *implicit correlation errors* (Status Quo) for the risk of *explicit structural assumptions* (New Model). Given that our infrastructure is regionally sharded, the structural assumption of regional independence is the safer default for on-call paging, provided we add the global correlation node in Q1.

  ### Decision Required

  Please approve the two-week delay to implement the Factorized Model. Shipping the current bot risks operator confusion; shipping the patch risks technical debt. The Factorized Model is the only path that scales with our complexity.

  **[Signature]**
