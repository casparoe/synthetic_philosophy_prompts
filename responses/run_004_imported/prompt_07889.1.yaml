          *   *Key Text:* *On the Genealogy of Morality* (1887).
          *   *Core Logic:* Traces the historical/psychological origins of moral values (specifically "good/evil" vs. "good/bad"). Argues they arise from power dynamics, resentment (*ressentiment*), and priestly castes, not divine command or rational necessity.
          *   *Goal:* To revalue values, show the contingent and often ignoble origins of Christian/slave morality, and undermine their absolute authority.
