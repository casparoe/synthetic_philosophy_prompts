answer: |-
  The philosopher you interviewed is onto something significant. That comment isn't just a loose analogy; it identifies a deep structural kinship between 19th-century continental philosophy and 21st-century analytic metaethics. However, while the *move* is the same, the *motivation* and the *destination* differ substantially.

  Here is a breakdown of where Nietzsche's *Genealogy of Morals* and Sharon Street's Evolutionary Debunking Arguments (EDAs) line up, where they diverge, and how you can contextualize this in your reporting.

  ### The Core Similarity: Weaponizing Origins
  The reason your source made the connection is that both Nietzsche and Street utilize the same logical lever: **the causal history of a belief undermines its justification.**

  In traditional philosophy, it is often considered a "genetic fallacy" to argue that a belief is false just because of where it came from. (Example: "You only believe in gravity because your teacher told you, so gravity isn't real.") Both Nietzsche and Street argue that in the specific case of morality, the origin *does* matter.

  *   **Street's EDA:** She argues that human moral intuitions were shaped by natural selection. Natural selection cares about survival and reproduction, not about tracking objective moral truths. Therefore, the probability that our moral intuitions align with objective moral facts (if they exist) is coincidental. We have no reason to trust them as "true."
  *   **Nietzsche's Genealogy:** Nietzsche traces our concepts of "good" and "evil" not to God or Reason, but to historical power struggles. He argues "slave morality" arose from *ressentiment* (resentment) among the powerless against the strong. Because these values were invented to serve a psychological need for revenge and safety, rather than to reflect a divine order, their claim to absolute authority is illegitimate.

  **The Verdict:** On this specific point, the comparison holds up perfectly. Both are **naturalistic debunkers**. They both insist you cannot understand morality by analyzing moral concepts alone; you have to look at the non-moral facts (biology for Street, history/psychology for Nietzsche) that produced them.

  ### Where They Diverge

  While the *structure* of the argument is nearly identical, the mechanics and the goals differ in ways that matter for your reporting.

  #### 1. Blind Forces vs. Human Agency
  *   **Street (Evolution):** The mechanism is blind, non-agential, and universal. Natural selection didn't "plan" our morality; it just filtered for traits that helped us reproduce. This makes Street's argument a challenge to *all* humans universally.
  *   **Nietzsche (History):** The mechanism is often agential and cultural. Nietzsche describes priests, nobles, and castes making strategic moves to consolidate power. While he acknowledges physiological types, his genealogy is often a story of human cunning and historical contingency, not just blind biological filtering.

  #### 2. Epistemology vs. Health
  *   **Street (Truth-Tracking):** Street is primarily concerned with **epistemic justification**. Her argument is: "We can't claim to *know* moral truths because our faculties aren't tuned to detect them." She is worried about the link between belief and truth. (Note: Street is a constructivist; she thinks we can still have valid moral norms, but they are constructed by us, not discovered in the universe).
  *   **Nietzsche (Life-Enhancement):** Nietzsche is less concerned with whether a moral belief is "true" in a correspondence sense and more concerned with whether it is **healthy**. For Nietzsche, Christian morality might be "false" in origin, but his real critique is that it is *life-denying*. He wants to know: Does this value make us stronger or weaker? Does it affirm life or negate it?

  #### 3. The Target
  *   **Street:** Her target is **Moral Realism** (the metaphysical idea that objective moral facts exist independently of human opinion). She wants to show that Realism is incompatible with evolutionary theory.
  *   **Nietzsche:** His target is **Christian/Slave Morality** (specific cultural values like humility, pity, and self-sacrifice). He isn't necessarily trying to prove that *no* values are objective; he is trying to prove that *our current* values are ignoble. He wants a "revaluation of all values," not necessarily the end of valuation.

  ### The "Truth" Trap
  This is the nuance that might add the most depth to your piece.

  Sharon Street uses evolution to show that our moral beliefs are **insensitive to truth**. If there were objective moral facts, evolution wouldn't have helped us find them; it would have helped us believe whatever kept us alive.

  Nietzsche goes a step further and questions **the value of truth itself**. In the *Genealogy*, he asks why we care so much about truth in the first place. He suggests that our "will to truth" is actually a sublimated form of religious asceticism. So, while Street uses the lack of truth-tracking to undermine Realism, Nietzsche might argue that Street is still too obsessed with "truth" as the metric for value. Nietzsche would ask: "Even if these moral intuitions are evolutionary lies, do they serve the flourishing of the human species?"

  ### How to Frame It in Your Reporting

  The comparison holds up as a **methodological ancestor**, but not as a perfect identity.

  *   **The "Yes":** You can accurately report that Nietzsche pioneered the strategy of using naturalistic origins to destabilize moral authority. He is the grandfather of the idea that "where a value comes from determines its worth."
  *   **The "No":** You should note that modern EDAs are more clinical and universal (focused on biology and epistemology), whereas Nietzsche's genealogy is more polemical and cultural (focused on power and psychology).

  **A useful soundbite formulation:**
  > "Sharon Street uses evolutionary biology to argue that our moral compass isn't pointing North; it's pointing toward survival. Nietzsche argued something similar a century earlier, but he added that the compass was forged by our enemies to keep us weak. Street worries we can't trust the map; Nietzsche worries the map was designed to lead us off a cliff."

  ### Summary for your notes:
  *   **Does the comparison hold up?** Yes, structurally. Both argue that causal origins undermine normative authority.
  *   **Where they line up:** Naturalism, anti-realism, the use of the "genetic" explanation to debunk justification.
  *   **Where they fall apart:** Street focuses on *knowledge/truth* (epistemology); Nietzsche focuses on *power/health* (axiology). Street targets *Metaphysical Realism*; Nietzsche targets *Christian Morality*.

  Your source is right to flag this. It shows that the current "trend" in metaethics is actually a revival of a very old, very dangerous philosophical move.
