answer: |-
  The gaslight had been lowered to a bruised blue glow, just enough to see the contours of the table, not enough to see the shadows hiding beneath it. Henry Sidgwick sat with his left hand resting on the mahogany, his right hand clasping the wrist of Eusapia Palladino. Her skin was warm, damp with the exertion of trance.

  He did not want to be here. Or rather, he wanted to be here too much, and that desire terrified him.

  For twenty years, the *Methods of Ethics* had sat upon his desk like a tombstone. He had built a cathedral of reason, only to find the altar empty at the consecration. The dualism of practical reason remained: Duty demanded sacrifice; Self-Interest demanded preservation. Reason endorsed both, yet they often pointed in opposite directions. Without a moral order to the universe—a God, an afterlife, a final reconciliation where virtue was rewarded—the rational man was a fool to be virtuous. Philosophy could not prove the reward. Only evidence could.

  So here he was, in a Cambridge study room, waiting for a table to levitate.

  "Patience," Eusapia murmured. Her English was broken, threaded with Italian rhythm. "The spirits need the dark."

  Sidgwick adjusted his grip on her wrist. He was not a believer in spirits; he was a believer in data. He was a founder of the Society for Psychical Research not out of mysticism, but out of desperation. If the universe was merely matter in motion, his ethics were a beautiful lie. If there was continuity after death, the dualism might be resolved. The stakes were not ghosts; the stakes were goodness.

  The table shuddered.

  A collective intake of breath circled the room. Myers, sitting opposite, leaned forward. The heavy wood groaned, then lifted an inch from the carpet. Sidgwick felt the vibration travel up his arm. It was physical. It was real.

  *Please,* he thought, the prayer slipping out before he could check it. *Let it be true.*

  He looked down. In the dimness, the boundary between phenomenon and fraud was a thin line drawn by vigilance. He had seen wonders in France the year prior—touches in the dark, movements of objects. He had wanted to believe then, too. But belief was not method. Method was the only thing that mattered.

  The table rose higher, tilting on two legs. Eusapia sighed, her head lolling back. Her body went limp in the chair, yet her wrist in his hand remained tense.

  Sidgwick shifted his weight. His role was control. To verify, one must exclude the natural causes. He moved his foot, seeking the boundary of her space beneath the table. He expected to meet the wood of her chair, or the fabric of her skirt.

  Instead, he felt nothing.

  He froze. The table hovered, defying gravity, a miracle hanging in the blue gloom. But Sidgwick was no longer looking at the table. He was looking down, into the abyss under the mahogany.

  He slid his foot forward again. Contact. A boot. Her boot. But it was not planted. It was free.

  He tightened his grip on her wrist. She did not resist, but the muscle beneath his thumb jumped. A spasm? Or a adjustment?

  The table slammed down.

  "Too much pressure," Eusapia said quickly, her voice sharp, awake. "You break the fluid."

  Sidgwick did not speak. He kept his hand on her wrist, but his mind had retreated inward, to the cold geometry of his logic. He had spent a decade building a bridge between the sensible world and the moral world. This woman was the plank. If the plank was rotten, the chasm remained.

  He waited for the next movement. The room was silent, save for the scratching of a match as someone relit a higher jet. The light flared, harsh and yellow.

  Eusapia blinked, shielding her eyes. She shifted her legs, pulling them back under her chair.

  Sidgwick saw it. It was not a grand supernatural force. It was a knee. A lever. When the light was low, when the control was relaxed just a fraction, the foot was free to kick. The hand he held was a distraction. The miracle was mechanics.

  He felt a nausea that had nothing to do with the séance. It was the sickness of a man watching his own salvation dissolve.

  If he spoke now, he would destroy her. He would destroy the hope of the Society. He would destroy the fragile possibility that the universe cared about human virtue. If he exposed her, he returned to the dualism. He returned to the cold truth that duty might be irrational, that the good man might suffer without recompense, that the moral order was a projection of human wishfulness.

  To accept the fraud was to accept a godless universe.

  But to ignore the fraud was to violate the very reason that defined him.

  "Eusapia," he said. His voice was steady. It was the voice he used in the lecture hall at Newnham, the voice of the *Methods*.

  She looked at him, wary. "Yes, Henry?"

  "Your left foot. During the levitation. It was not under control."

  Myers stirred. "Sidgwick, perhaps we should—"

  "It was not under control," Sidgwick repeated. He released her wrist. The skin was cool now. "The phenomenon ceased when the light increased. The mechanism requires darkness."

  Eusapia shrugged, a gesture of infinite weariness. "The spirits are shy. You demand too much light."

  "I demand evidence," Sidgwick said. "Without control, there is no evidence. Without evidence, there is nothing."

  He stood up. His legs felt heavy, as if the gravity he had just witnessed had doubled. He walked to the window and looked out at the Cambridge night. The stones of the college were solid, enduring, indifferent.

  He could lie. He could write the report and soften the language. He could say *inconclusive* instead of *fraudulent*. He could keep the door ajar for the moral order he needed so desperately. It would be so easy. It would be kind. It would be self-interested.

  But it would not be duty.

  He realized then the cruel irony tightening around his throat. His ethics required the afterlife to make sense, but his ethics also required him to tell the truth even if it proved the afterlife was a lie. The method destroyed the hope. Rigor was the enemy of comfort.

  He turned back to the room. The table sat still, just wood and glue. Eusapia was lighting a cigarette, her hands steady. She had won; she had moved the table. But he had won too; he had seen how.

  "I will have to report this," Sidgwick said quietly.

  "You will lose your friends," Myers warned from the shadows. "You will lose the cause."

  "The cause is truth," Sidgwick said. "Not comfort."

  He knew what he would have to do in October. He would stand before the Society. He would withdraw his support. He would dismantle the hope he had nurtured for ten years. He would return to the dualism, unarmed. He would accept that reason demands virtue, but offers no guarantee that virtue pays.

  It was a desolate conclusion. It was the only honest one.

  Sidgwick picked up his hat. The air in the room felt thin, insufficient for breathing. He had come looking for a bridge to the beyond, and found only a trapdoor. He opened it anyway.

  "Good evening," he said, and stepped out into the cold, unguaranteed night.
