answer: |-
  Here is a draft argument structured for a dissertation chapter. It is designed to be rigorous, engaging with the technical nuances of Yablo's account while systematically developing the objection regarding effect individuation.

  ***

  ### Chapter Section: The Grain of the Effect and the Instability of Proportionality

  **1. Introduction: The Promise and Peril of Proportionality**
  Stephen Yablo's (1992) intervention in the causal exclusion debate offers a compelling dissolution of Jaegwon Kim's supervenience argument. By reframing the relationship between mental and physical properties not as competitors for the same causal role, but as determinable and determinate respectively, Yablo attempts to show that mental causation is compatible with physical causal closure. The linchpin of this solution is the **proportionality constraint**: a cause is genuine only if it is commensurate with its effect—specifically, it must be required for the effect (no more generic property would have sufficed) and enough for the effect (no more specific property was needed).

  In the canonical illustration, Sophie the pigeon pecks at a scarlet triangle. Yablo argues that *redness* (the determinable) is the proportionate cause, not *scarletness* (the determinate), because Sophie would have pecked at any shade of red. By analogy, a mental property $M$ (e.g., pain) is the proportionate cause of behavior $B$ (e.g., hand withdrawal), while its physical realizer $P$ (e.g., C-fiber firing) is causally "too specific." $P$ implies that had the micro-physical details differed slightly, $B$ would not have occurred; yet, intuitively, the behavior would have occurred regardless. Thus, Yablo concludes, $M$ escapes exclusion because $P$ fails the proportionality test.

  However, this solution rests on a precarious assumption regarding the individuation of the effect. This section argues that Yablo's proportionality constraint fails to provide a principled, non-question-begging criterion for fixing the grain of description at which mental causes are proportionate and physical realizers are not. Because proportionality is relative to how the effect is described, and because physical causal closure operates at a fine-grained micro-physical level, Yablo's account either renders mental causation incompatible with physical closure or begs the question by stipulating the grain of the effect to favor the mental. Consequently, the exclusion problem remains unresolved.

  **2. The Sensitivity of Proportionality to Effect Individuation**
  The core vulnerability in Yablo's account is that proportionality is not an intrinsic relation between a cause and an event *simpliciter*; it is a relation between a cause and an effect *under a description*. Whether a property counts as "too specific" depends entirely on the specificity of the effect it is purported to cause.

  Consider Sophie again. Yablo individuates the effect coarsely: *pecking at a red triangle*. Under this description, *scarlet* is too specific because the counterfactual "If the triangle had been crimson (but not scarlet), Sophie would not have pecked" is false. However, suppose we individuate the effect finely, consistent with the physiological reality of the pigeon's visual system: *pecking triggered by retinal stimulation of wavelength 650nm*. Under this description, *redness* is now too generic. The counterfactual "If the triangle had been crimson (wavelength 640nm), Sophie would have pecked" may well be false, as the specific retinal stimulation required for *this* motor output would not have occurred. At this fine grain, *scarlet* (or the specific wavelength property) becomes the proportionate cause, and *redness* is excluded for failing the requirement condition.

  This sensitivity generates a dilemma for the mental causation debate. If we individuate behavioral effects coarsely (e.g., "voting," "raising an arm"), mental properties appear proportionate. If we individuate them finely (e.g., "specific muscle contraction sequence $K$ at time $t$"), physical properties appear proportionate. Yablo's solution therefore lacks stability; it floats on the choice of effect description. To rescue mental causation, Yablo must demonstrate why we are licensed to adopt the coarse-grained description rather than the fine-grained one.

  **3. The Conflict with Physical Causal Closure**
  The necessity of a principled grain-selection criterion becomes acute when we consider the premise Yablo wishes to preserve: physical causal closure. Kim's exclusion argument derives its force from the claim that every physical event has a sufficient physical cause. This claim is plausible only if "physical event" is understood at the micro-physical level where the laws of physics operate. The domain of physical closure is the domain of fundamental particles, forces, and precise physiological states.

  If mental causation is to be saved by proportionality, the mental cause $M$ must be proportionate to the *same effect* that the physical cause $P$ is sufficient for. However, $P$'s sufficiency is guaranteed at the fine-grained level of physical description. If we shift the effect description to a coarse grain to make $M$ proportionate, we risk severing the link to the domain where physical closure holds.
  *   **Option A:** We accept the fine-grained physical effect. Here, $P$ is proportionate. $M$, being multiply realizable and abstract, is likely too generic to be proportionate to the specific micro-physical outcome. Exclusion returns: $P$ does all the work.
  *   **Option B:** We accept the coarse-grained behavioral effect. Here, $M$ is proportionate. However, it is no longer clear that physical causal closure applies to this coarse-grained event in the same way. If the "effect" is an abstracted behavioral type, it is not obvious that physics guarantees a sufficient physical cause for *that type*, only for the token physical movements that constitute it.

  Yablo attempts to have it both ways: he wants mental properties to cause the very behaviors that physics closes over. But if physics closes over fine-grained events, and proportionality favors mental properties only at coarse-grained events, then mental properties are not causes of the events that physics closes over. They are causes of *descriptions* of events. This suggests that Yablo saves mental causation only by changing the subject from metaphysical production to explanatory relevance.

  **4. The Charge of Question-Begging**
  To avoid the dilemma above, Yablo requires a neutral principle for selecting the "correct" grain of the effect—a principle that does not simply presuppose the causal efficacy of the mental. He might appeal to **naturalness** or **causal natural kinds**, arguing that coarse-grained behavioral types are the natural relata of psychological causation.

  However, this move is vulnerable to the charge of begging the question against the exclusionist. The exclusionist (following Kim) argues that the fundamental causal machinery of the world is micro-physical. To assert that coarse-grained behavioral events are the *true* relata of causation is to assert that the special sciences carve nature at joints that are causally potent independent of, or alongside, the physical joints. But this is precisely what the exclusion argument denies.

  If Yablo selects the grain of the effect based on the interests of psychology (i.e., "we care about arm raisings, not muscle fibrillations"), he concedes that mental causation is interest-relative. This reduces mental causation to a pragmatic or explanatory notion, not a metaphysical one. If, however, he claims the coarse grain is metaphysically privileged, he owes an account of why the micro-physical grain—the grain of causal closure—is metaphysically deficient. Without such an account, the selection of the coarse grain appears to be a maneuver designed specifically to ensure $M$ passes the proportionality test while $P$ fails it.

  Consider the counterfactuals again. Yablo argues $P$ is too specific because if $P$ had not occurred (but $M$ had, via $P^*$), $B$ would still have occurred. This relies on the assumption that $B$ is the *same event* across realizers. But if $B$ is individuated physically, $B$ caused by $P$ is not identical to $B$ caused by $P^*$. By assuming the trans-world identity of the behavioral effect across different physical realizers, Yablo builds the multiple realizability of the mental into the individuation of the effect. This assumes the distinctness and autonomy of the mental level to prove the causal autonomy of the mental level.

  **5. Conclusion: The Exclusion Problem Stands**
  Yablo's proportionality constraint offers a sophisticated account of how causal claims function within explanatory contexts. It successfully explains why, in everyday discourse, we cite "pain" rather than "C-fiber firing" as the cause of withdrawal. However, as a solution to the metaphysical exclusion problem, it fails. The proportionality of a cause is inextricably linked to the grain of the effect. Since physical causal closure operates at the finest physical grain, and mental properties are proportionate only at coarser grains, Yablo provides no principled mechanism to align the two.

  To insist on the coarse grain is to privilege the explanatory practices of psychology over the ontological commitments of physics without independent justification. To accept the fine grain is to concede that physical realizers are the proportionate causes, reinstating the threat of epiphenomenalism for the mental properties themselves. Therefore, without an independent theory of event individuation that validates coarse-grained events as the primary relata of metaphysical causation, Yablo's proportionality constraint cannot, by itself, rescue mental causation from exclusion. It dissolves the tension only by relativizing causation to descriptive frameworks, leaving the underlying metaphysical competition between mind and matter unresolved.
