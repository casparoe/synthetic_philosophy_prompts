prompt: |-
  I've spent a good chunk of my free time over the last year or two reading through Isaac Newton's theological writings, purely as a hobbyist with no background in theology or history — I got pulled in once I learned how much more he wrote about biblical prophecy than about physics. Two things about his actual views matter here: he was a convinced anti-Trinitarian who believed the doctrine had been fraudulently imposed on the church by Athanasius and the Council of Nicaea, and in his commentaries on Daniel and Revelation he was a strict historicist, reading the prophetic symbols as being fulfilled gradually across real church history rather than as a drama still mostly ahead of us — all while explicitly criticizing confident date-setters for bringing prophecy into disrepute. Given those two commitments, what do you think Newton would have made of the pretribulational, futurist "rapture" theology that only took shape after his death, starting with John Nelson Darby in the 1830s and later spreading through the Scofield Reference Bible into mainstream American evangelicalism — a system that treats almost all of Revelation as still future, and that is overwhelmingly a Trinitarian phenomenon? Would he have recognized it as a natural extension of his own project, or as everything he spent his life warning against, on both fronts?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Query:**
      *   **User Profile:** Hobbyist reader of Newton's theological writings, no formal background in theology/history, deeply interested in Newton's specific views (Anti-Trinitarianism, Historicist Prophetic Interpretation).
      *   **Core Question:** How would Isaac Newton react to Pretribulational Futurism (Darby/Scofield era), given his two main commitments: 1) Anti-Trinitarianism (Arian/Socinian leanings, anti-Nicene), and 2) Historicist Prophetic Interpretation (criticizing date-setting, seeing prophecy as unfolding through history).
      *   **Specific Tension:** Would he see it as an extension of his work or a betrayal/warning fulfilled?

  2.  **Deconstruct Newton's Theological Positions:**
      *   **Trinitarianism:** Newton was a closeted unitarian (often termed "Arian" or "Socinian" by scholars, though he had his own nuances). He believed the doctrine of the Trinity was a corruption introduced in the 4th century (Athanasius/Nicaea) to consolidate clerical power. He saw it as idolatry (worshipping the creature rather than the Creator).
      *   **Prophecy (Daniel/Revelation):** Newton was a *Historicist*. He believed the prophecies were being fulfilled continuously from the time of writing through the present and into the future. He identified the Papacy/Roman Church as the Antichrist. He famously warned against *date-setting* (though he speculated privately), arguing that doing so discredits prophecy when dates fail. He believed the "end times" were distant.
      *   **Methodology:** Newton approached theology with the same rigor as science (in his mind). He relied on textual criticism, historical evidence, and logical consistency. He valued "primitive Christianity" (the faith of the earliest apostles).

  3.  **Deconstruct Pretribulational Futurism (Darby/Scofield):**
      *   **Trinitarianism:** Strongly Trinitarian. It emerged within orthodox Anglican/Plymouth Brethren/Evangelical circles that affirmed Nicaea.
