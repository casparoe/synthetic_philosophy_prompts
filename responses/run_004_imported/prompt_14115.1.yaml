      *   **Point 3: Date-Setting and Imminence.**
          *   Newton: "It is not for us to know the times." Warned against fanaticism.
          *   Futurism: Emphasizes *imminence* (Christ could come any second). Often leads to date-setting or "signs" speculation.
          *   *Verdict:* Newton would see this as the exact "enthusiasm" he warned against.

      *   **Point 4: The Nature of the Church.**
