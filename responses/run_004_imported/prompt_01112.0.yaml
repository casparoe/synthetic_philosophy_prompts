              *   *The "Will" aspect:* Locke explicitly says Liberty does *not* belong to Volition. Frankfurt cases often imply the agent *could* have willed otherwise, but the outcome would have been the same. Locke's man *could* have willed otherwise (he could have preferred to leave), but the *action* would have failed.
              *   *Verdict:* The professor is right that it's an *anticipation* of the structure (actual sequence matches desire, alternative sequence blocked), but the *philosophical job* is different. Locke uses it to define freedom (compatibilist-leaning definition: freedom is acting on desire). Frankfurt uses it to define responsibility (compatibilist-leaning definition: responsibility doesn't need alternate possibilities).
