          *   Liberty: He lacks the *power* to go if he willed it.
          *   Conclusion: The action is *voluntary* (matches will) but not *free/libertarian* in the sense of having the alternative power.
      *   *Crucial Distinction:* Liberty is a two-way power (do OR forbear). Volition is a one-way preference. If the external world blocks the "forbear" option, liberty is gone, even if volition aligns with the "do" option.

  3.  **Deconstruct Task 2: Locke vs. Frankfurt:**
      *   *Frankfurt's Goal:* Attack PAP (Principle of Alternative Possibilities). PAP says: Moral responsibility requires the ability to do otherwise. Frankfurt says: You can be responsible even if you couldn't do otherwise (because a counterfactual intervener would have forced you, but didn't need to because you chose it on your own).
      *   *Locke's Goal:* Define "Liberty" vs. "Volition." He wants to show that "Free Will" is a category mistake. Liberty belongs to the *agent*, not the *will*. An agent is free if they can act on their will.
      *   *The Comparison:*
