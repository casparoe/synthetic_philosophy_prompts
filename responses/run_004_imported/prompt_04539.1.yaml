      *   *Engagement:* Alice must answer "Why trust rationality off-path?" Bob must answer "Doesn't your view kill BI ex-ante?"

      *(Self-Correction on Aumann's actual view)*: Actually, Aumann (1995, 1996) argues that CKR implies BI. If a player deviates, it implies CKR was false. But the prompt asks for a Purist who thinks BI *still* pins down the rest of the game. This is a specific interpretation often associated with the idea that *rationality* is common knowledge *at every node*, regardless of history. This is the "subgame perfection" epistemic foundation. I will frame Alice as defending the *coherence* of the counterfactual reasoning required for BI to work at all.

      *Revised Plan for Alice:* Her argument is that if we allow belief revision upon deviation, we destroy the logical chain that justifies BI at the *last* node. If P2 thinks P1 might be irrational, P2 might not defect at the end. If P2 might not defect, P1 defects earlier. If we allow updating, we can't solve the game *ex ante*. To solve it *ex ante*, we must commit to not updating.

      *Revised Plan for Bob:* If we commit to not updating, we ignore information. If P1 passes, maybe P1 is a cooperator. If I defect immediately, I lose the cooperative surplus. Rationality means maximizing expected utility given *actual* beliefs, not *axiomatic* beliefs.

  7.  **Writing the Dialogue:** (Focusing on flow and punchiness).

