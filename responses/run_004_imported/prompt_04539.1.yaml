      *(One nuance check)*: Aumann actually argues that if CKR holds, the node is *never* reached. So a Purist arguing BI *after* a deviation is technically in a tricky spot. However, the prompt asks for the "Aumann-style purist who thinks common knowledge of rationality still pins down backward induction for the rest of the game no matter what just happened." This aligns more with the *logical* interpretation of counterfactuals (Stalnaker/Binmore critique target) where the epistemic state is fixed *ex ante*. I will write Alice as defending the *ex ante* commitment to counterfactuals.

      Let's go.

      *(Drafting thought)*: Keep it snappy. No long speeches.
