answer: |-
  You have identified a genuine tension in the formal epistemology literature, but there is a category error in how the standard Dutch Book Theorem (DBT) is being applied to imprecise credences.

  Your reasoning holds perfectly **if** one accepts the operational definition of credence assumed by the standard DBT. However, the imprecise probability framework explicitly rejects that operational definition. Consequently, the standard DBT does not rule out imprecise credences; it merely rules out *sharp* credences that violate the axioms.

  Here is the clarification on where the scope of the original theorem stops, why Walley's condition is necessary, and why dynamic arguments are still required.

  ### 1. The Operational Assumption of the Standard DBT
  The standard Dutch Book argument rests on a specific bridge principle between belief and action:
  > **Sharp Operationalization:** An agent's credence $P(A)$ is defined as the *unique* price $p$ at which the agent is willing to both buy and sell a unit bet on $A$.

  Under this assumption, if you have a "gap" (e.g., willing to buy at 0.4 but only sell at 0.6), you technically do not have a defined credence $P(A)$ in the de Finetti sense. The standard DBT proves: *If you post single prices, those prices must be additive to avoid a sure loss.*

  It does **not** prove: *You must post single prices.*

  Imprecise probabilists argue that when evidence is sparse or ambiguous, rationality does not compel a single price. Instead, it compels a range. By adopting imprecise credences, you are changing the rules of the betting game. You are no longer a "price taker" posting a single fair value; you are a "market maker" posting a bid-ask spread.

  ### 2. Why the Converse Does Not Rule Out Imprecise Credences
  You asked: *"Imprecise credences... are not additive point functions by construction, so doesn't the converse theorem already entail that any agent who adopts them is exploitable?"*

  No. The converse of the DBT states: *If your single prices satisfy the probability axioms, no Dutch Book exists.*
  The contrapositive is: *If a Dutch Book exists, your single prices violated the axioms.*

  Neither of these statements addresses an agent who **refuses to post single prices**.
  *   If I say, "I will buy this bet for \$0.40 and sell it for \$0.60," I have not violated additivity. I have simply declined to commit to a single value.
  *   A bookie cannot construct a standard Dutch Book against me because they cannot force me to transact at a single price point. They can buy from me at 0.60 or sell to me at 0.40, but they cannot arbitrage the difference *against me* in a way that guarantees my loss, provided my bounds are coherent.

  To exploit an agent with a bid-ask spread, the bookie would need to buy from the agent at a price higher than the agent sells to them. But by definition, the agent's buying price (lower prevision) is lower than their selling price (upper prevision). There is no overlap for a static money pump.

  ### 3. The Role of Walley's "Avoiding Sure Loss"
  You asked: *"I do not see what remaining work is done by Walley's weaker 'avoiding sure loss' condition."*

  This condition is doing the heavy lifting of generalizing coherence to the imprecise framework.
  *   **Standard Coherence:** There exists no combination of bets at your posted prices that guarantees a loss.
  *   **Walley's Avoiding Sure Loss (ASL):** There exists no combination of bets acceptable to you (buying at or below your lower prevision, selling at or above your upper prevision) that guarantees a loss.

  Walley proved that a set of lower and upper previsions avoids sure loss **if and only if** there exists at least one precise probability measure that lies within those bounds (i.e., the set of priors is non-empty).

  **Why this matters:**
  If you adopt imprecise credences, you are not immune to *all* exploitation. You are only immune if your set of probabilities is non-empty and coherent.
  *   **Scenario A (Coherent Imprecise):** Lower bound 0.4, Upper bound 0.6. This represents the set of all probabilities $[0.4, 0.6]$. This avoids sure loss. No static Dutch Book is possible.
  *   **Scenario B (Incoherent Imprecise):** Lower bound 0.6, Upper bound 0.4. You are willing to buy at 0.6 and sell at 0.4. A bookie can sell you at 0.6 and buy from you at 0.4, guaranteeing you a loss of 0.2.

  Walley's condition is the boundary line. It allows for *imprecision* (gaps) but forbids *incoherence* (crossed bounds or empty sets). The standard DBT cannot draw this line because it assumes the gap is zero.

  ### 4. Why Construct Dynamic Dutch Books?
  You asked: *"It also puzzles me that people keep constructing further, dynamic-choice versions of the Dutch book argument specifically targeting imprecise credences, as though the atemporal case had not already closed the question."*

  They construct dynamic arguments precisely **because the atemporal case failed to close the question.**

  Since imprecise credences can satisfy Walley's static "Avoiding Sure Loss" condition (provided they represent a non-empty convex set of probabilities), critics cannot attack them on static grounds. A rational agent *can* hold imprecise credences without being statically Dutch Bookable.

  Therefore, critics (like Titelbaum, Seidenfeld, or proponents of the "Reflection Principle") move to **dynamic** scenarios to show that imprecise credences lead to irrational behavior over time. Common attacks include:
  1.  **Dilation:** Learning evidence $E$ makes your credence in $H$ *less* precise (the interval widens) regardless of the outcome of $E$. Critics argue this violates the intuition that learning should reduce uncertainty.
  2.  **Decision Inertia:** In sequential choice problems, imprecise credences can lead to situations where an agent prefers $A$ to $B$, prefers $B$ to $C$, but refuses to choose between $A$ and $C$, or cannot plan a sequence of actions that maximizes utility because the intervals overlap too much.
  3.  **Updating Issues:** Showing that certain updating rules for imprecise credences (like Generalized Conditionalization) allow for dynamic Dutch Books (losses guaranteed across time) even if static ASL is satisfied.

  ### Summary
  The scope of the original Dutch Book Theorem stops at the assumption that **credence = single fair betting price.**

  1.  **Static Case:** If you allow buying and selling prices to diverge (imprecise credences), the standard DBT does not apply. You are not exploitable simply for having a gap; you are only exploitable if your gap is incoherent (violating Walley's ASL).
  2.  **Walley's Work:** This establishes the coherence conditions for intervals. It shows that imprecise credences are rationally permissible *statically* as long as they correspond to a non-empty set of precise probabilities.
  3.  **Dynamic Case:** Because the static case permits imprecise credences, critics must use dynamic arguments to try to show that they are diachronically irrational or decision-theoretically paralyzing.

  The imprecise probabilist accepts the Dutch Book argument as a constraint on coherence but rejects the premise that coherence requires precision. The debate has therefore shifted from "Are imprecise credences incoherent?" (Static DBT says no) to "Are imprecise credences decision-theoretically viable?" (Dynamic arguments say maybe not).
