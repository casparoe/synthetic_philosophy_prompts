      *   *Address the Politics:* Acknowledge the animosity (Leviathan, Royal Society) but distinguish it from the mathematical validity. Wallis was mean, but he was right.
      *   *Conclusion:* Advise against using this as a "gatekeeping" example. It undermines the argument because Hobbes was objectively wrong. Suggest better examples if they want to discuss sociological factors in science (e.g., Semmelweis, Mendel, Rosalind Franklin), though even those are nuanced.

