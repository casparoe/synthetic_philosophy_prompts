answer: |-
  This is a fascinating historical episode, and you have clearly done your homework on the biographical and political tensions between Hobbes and Wallis. The animosity was indeed real, personal, and deeply entangled with the religious and political upheavals of 17th-century England. Hobbes was a materialist and a royalist in a time when the universities were reasserting Anglican orthodoxy; Wallis was a Presbyterian divine and a key founder of the Royal Society, which viewed Hobbes as a dangerous subversive.

  However, your conclusion about the mathematics contains a critical logical error that fundamentally changes the lesson of the story. While the *political* exclusion of Hobbes is a valid example of institutional gatekeeping, the *mathematical* rejection of his proof was not.

  Here is why you should reconsider using this as your go-to example of experts closing ranks against a truth-teller.

  ### 1. The "1882 Proof" Misconception
  Your central premise is that because the general impossibility of squaring the circle wasn't proven until Lindemann in 1882, Wallis could not have *known* Hobbes was wrong in the 1650s. This conflates a **general impossibility proof** with a **specific refutation**.

  To understand why this matters, consider the analogy of perpetual motion machines. We now have thermodynamic laws that prove perpetual motion is impossible. However, even before those laws were formulated, if someone presented a specific machine with gears and levers claiming to run forever, a physicist could examine it and say, "This gear will slip," or "Friction here will stop it," or "You have miscalculated the torque." They do not need the general law of thermodynamics to identify a specific error in a specific design.

  Similarly, Hobbes did not just claim "it is possible to square the circle"; he published specific geometric constructions with specific numerical results.
  *   Hobbes's construction effectively yielded a value for $\pi$ (pi) of roughly **3.125** (specifically, he implied the ratio of the circumference to the diameter was $\sqrt{10}$, or roughly 3.162, in some iterations, and other conflicting values in others).
  *   Mathematicians in Wallis's time already knew $\pi$ to many decimal places (Ludolph van Ceulen had calculated it to 35 decimals by 1615).
  *   Wallis did not need to prove that *no* construction could ever work. He simply had to show that Hobbes's *specific* construction resulted in a square whose area did not match the circle's area based on the known approximations of $\pi$.

  Wallis demonstrated that Hobbes's steps contained elementary logical fallacies and calculation errors. Hobbes was not rejected because he claimed the impossible; he was rejected because his specific "solution" was demonstrably false by the standards of arithmetic and geometry available at the time.

  ### 2. Why Hobbes's Ontology Mattered
  You mentioned the aside about Hobbes's view that "only bodies truly exist" and wondered why that mattered. It actually matters quite a lot for the mathematics.

  Euclidean geometry relies on abstract ideals: a point has no dimension, a line has no width. Hobbes, being a strict materialist, argued that geometric objects must be physical. To Hobbes, a "point" must have some magnitude, and a "line" is the trace of a moving body.
  *   **The Consequence:** This led Hobbes to reject the emerging methods of infinitesimals and algebraic symbolism (which Wallis championed). Hobbes insisted on a purely verbal, corporeal geometry.
  *   **The Error:** By insisting that geometric objects have physical magnitude, Hobbes introduced category errors into his proofs. He treated ratios of magnitudes in ways that violated the logical consistency required for precise calculation. Wallis attacked this specifically, noting that Hobbes's materialism made him incapable of understanding the abstract relationships necessary for higher mathematics.

  So, the mathematicians weren't just nitpicking his politics; they were pointing out that his philosophical commitment to materialism made him mathematically incompetent in the new symbolic landscape of the 17th century.

  ### 3. The Politics Were Real, But Distinct
  You are correct that the *ferocity* of the attack was political. Wallis was often vicious, mocking Hobbes's age and his lack of university credentials. The Royal Society's exclusion of Hobbes was absolutely a form of gatekeeping; they wanted to distance themselves from his controversial theology and political theory (*Leviathan*).

  However, there is a difference between **social exclusion** and **technical refutation**.
  *   **Social Exclusion:** The Royal Society not admitting him? Gatekeeping.
  *   **Technical Refutation:** Wallis showing his geometric proof was wrong? Valid expertise.

  Hobbes himself contributed to this. He was notoriously arrogant, claiming that anyone who disagreed with him was either a fool or a fraud. He refused to acknowledge even minor errors when they were pointed out, doubling down on false claims for decades. This behavior fits the modern profile of a "mathematical crank" rather than a persecuted visionary.

  ### 4. The Lesson for Your Arguments
  If you use the Hobbes-Wallis feud as an example of "institutional gatekeeping against a correct independent thinker," you risk undermining your credibility with anyone who knows the history of mathematics. Hobbes was not a correct independent thinker; he was a brilliant philosopher who was objectively wrong about the math.

  If you wish to argue that institutions can stifle innovation or that outsiders are sometimes unfairly dismissed, there are historically stronger cases where the "outsider" was actually right:
  *   **Ignaz Semmelweis:** Dismissed by the medical establishment for suggesting handwashing, later vindicated by germ theory.
  *   **Barry Marshall:** Ridiculed for claiming bacteria caused ulcers, later won a Nobel Prize.
  *   **Rosalind Franklin:** Her contributions to DNA structure were marginalized by the male-dominated establishment (though this is more about credit than correctness).

  ### Summary
  The history is not backwards, but your interpretation of the *mathematical* validity is. Wallis and the Oxford mathematicians were not relying on a future proof of impossibility; they were relying on basic arithmetic and logic available in 1655. Hobbes's construction was wrong, his value for $\pi$ was inaccurate, and his materialist ontology hindered his ability to do abstract math.

  The feud is indeed a story of institutional power and personal animus, but it is **not** a story of the establishment suppressing a mathematical truth. It is a story of a great philosopher falling victim to the Dunning-Kruger effect in a field outside his expertise, and experts reacting (sometimes rudely) correctly to a false claim. Using it as a parable for "trust the outsider over the expert" inadvertently validates the expert's position in this specific case.
