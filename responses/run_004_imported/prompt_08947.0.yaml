answer: |-
  David Hume would endorse **Pearl and Woodward's interventionism** over Lewis's counterfactual theory, though he would do so with significant skepticism regarding their metaphysical claims. He would regard Lewis's possible-worlds semantics as a violation of the fundamental principles of his empiricism, specifically the Copy Principle, whereas he would view interventionism as a sophisticated, operational extension of constant conjunction grounded in the impression of human agency.

  To understand why Hume would reject Lewis despite Lewis's explicit adoption of Hume's second definition of cause, one must look past the surface-level terminology and engage with Hume's strict criteria for meaningful ideas.

  ### 1. The Copy Principle and the Ontology of Worlds
  Hume's epistemology rests on the Copy Principle: every simple idea must be derived from a corresponding impression. In *Enquiry* Section VII, Hume's goal is to show that the idea of "necessary connection" has no external impression; it is merely a projection of the mind's habit.

  David Lewis's theory analyzes causal claims by referencing similarity relations between the actual world and non-actual **possible worlds**. For Hume, this is unintelligible. We have impressions of the actual world (via sensation and reflection). We have no impression, and can have no impression, of a "non-actual world." To posit a concrete or abstract realm of alternatives as the truth-maker for causal claims is to traffic in ideas without impressions. Hume would classify Lewis's possible worlds as "sophistry and illusion"—metaphysical fiction that exceeds the bounds of empirical inquiry. While Lewis uses Hume's counterfactual phrasing ("if the first object had not been..."), he reifies it into an ontology that Hume's strict actualism forbids.

  In contrast, Pearl and Woodward's interventionism relies on the concept of an **intervention** (the `do` operator). While many interventions are hypothetical, they are defined in terms of physical manipulations within the actual world. Hume acknowledges that we have a distinct internal impression of **volition and agency** (the experience of willing a movement and seeing it occur). Interventionism grounds causal structure in the invariance of relationships under such manipulations. For Hume, a claim about "what would happen if we intervened" is a claim about the projection of past regularities onto a hypothetical action. It does not require the existence of ghostly alternative worlds; it requires only the actual world, the memory of past conjunctions, and the idea of agency. This remains within the economy of impressions.

  ### 2. The Genealogy of the Counterfactual
  Hume offers two definitions of cause in the *Enquiry*. The first is regularity (constant conjunction). The second is counterfactual ("if the first object had not been, the second never had existed"). Crucially, Hume introduces the second definition "in other words." He does not treat it as a deeper metaphysical analysis, but as a linguistic equivalent that reveals the same psychological basis: the determination of the mind.

  Lewis treats the counterfactual as the **metaphysical ground** of causation. He seeks truth conditions for counterfactuals that exist independently of the mind. This inverts Hume's project. Hume argues that the "necessity" in the counterfactual is a feeling of expectation derived from custom, not a feature of the objects themselves.

  Pearl and Woodward, conversely, treat the counterfactual as a **computational tool** for inference. Pearl's `do`-calculus allows one to compute the probability of an outcome given an intervention based on observed data and structural assumptions. This aligns with Hume's view of science as the organization of experience to guide expectation. Woodward explicitly frames causation in terms of **invariance**—relationships that hold stable under changes. This is effectively a high-dimensional, structured version of "constant conjunction." Hume would recognize this as a rigorous method for tracking regularities, whereas he would view Lewis's similarity metrics between worlds as an attempt to locate objective necessity in a realm beyond experience.

  ### 3. Agency and the Impression of Power
  There is one specific area where Hume admits we have an impression of "power": the mind's control over the body. In the *Enquiry*, Hume notes that we feel a connection between volition and motion, though even this is ultimately mysterious. Interventionism leverages this specific impression. Woodward's manipulationist theory defines causes as "handles" for manipulation. This resonates with the Humean insight that our idea of causation is tied to our capacity to act and predict.

  Lewis's theory is detached from agency; it is a semantic analysis of propositions. Hume's empiricism is naturalistic and psychological. He cares about how the mind forms ideas to navigate the world. Interventionism is a logic of action; Lewis's theory is a logic of truth. Hume would find the former useful for "conducting life" (the goal of his philosophy) and the latter a speculative diversion.

  ### The Verdict
  Hume would not endorse Pearl and Woodward's claim to have discovered "true causal structures" in a realist sense, as he denies we can ever perceive the tie that binds cause to effect. He would insist that causal graphs are merely maps of our expectations, not the territory of nature.

  However, between the two heirs, **Hume would endorse Interventionism** as the only empirically admissible framework. He would reject Lewis's possible worlds as a violation of the Copy Principle, rendering the theory meaningless by Humean standards. He would accept Pearl and Woodward's framework as a sophisticated formalization of constant conjunction and human agency—a calculus of expectations that respects the boundaries of actual experience. Lewis extends Hume's *words* but betrays his *empiricism*; Pearl and Woodward extend Hume's *empiricism*, even if they claim more metaphysical warrant than Hume would allow.
