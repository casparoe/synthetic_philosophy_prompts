answer: |-
  Good morning. For those who don't know me, I'm [Your Name]. I'm his child.

  As you know, last Tuesday happened very suddenly. One minute he was here, grading papers or making coffee or arguing about the weather, and the next minute, he wasn't. There is no smooth transition for that. There is no philosophical framework that softens the impact of a phone call like that.

  For thirty-eight years, my father taught philosophy. And if you knew him, you know that for thirty-eight years, he told the same story. He told it at faculty parties, and he told it over Thanksgiving turkey. It was about two philosophers, both named Strawson.

  He'd tell us about P.F. Strawson, the father, who wrote a famous paper called "Freedom and Resentment." And he'd tell us about Galen Strawson, the son, who grew up to argue that because we don't choose our genes or our upbringing, nobody is ultimately responsible for anything.

  Most people assumed the father and son disagreed. But Dad would smile, pour more wine, and tell us: "No, they don't disagree."

  His point was this: Galen is right. In a cosmic sense, on a metaphysical ledger, no one deserves credit or blame. We are products of causes stretching back forever. But—and this was Dad's whole life—*it doesn't matter.*

  He believed that whether or not we are "ultimately" responsible has nothing to do with whether I should be grateful when he helped me, or angry when he hurt me. The question of cosmic desert doesn't touch the reality of human connection.

  He was explicit about this. Long before last Tuesday, he told me what he wanted for today. He said, "Do not tell them I earned my rest." He didn't want to hear that he deserved peace because he was a good man. He didn't want to smuggle that kind of accounting back in through the side door.

  But he was just as firm on the other side. He said, "Do not treat me like a case study." He didn't want the objective attitude. He didn't want anyone saying, "Well, the brain ceased to function," or "He lived a full biological span." He didn't want to be explained. He wanted to be missed.

  He wanted us to feel this. All of it.

  And so, standing here, looking at his colleagues who know the arguments, and looking at his family who just know the man, I realize that his philosophy wasn't something he kept in the classroom. It was how he loved us.

  Because he didn't believe in cosmic ledgers, he didn't love us transactionally. He didn't hug us because we earned it. He didn't forgive us because we balanced the scales. He was present with us, fully, without a metaphysical hedge.

  He wanted us to be angry at him for the things he did wrong. I know he had faults. We all know he had faults. He didn't want those smoothed over with "he's in a better place." He owned his mistakes. And he wanted us to own our anger, because that anger is proof that we were in a relationship with a real person, not a saint.

  And he wanted us to be grateful for the things he did right. Not because he was owed gratitude, but because gratitude is the only right response to a gift. And his time, his attention, his mind—that was a gift.

  To his students and colleagues: You knew the intellect. You know how rare it is to find someone who could hold two true things in their head without letting them cancel each other out. You know that "Galen is right and it doesn't matter" isn't a contradiction. It's a permission slip. It's permission to care deeply about justice and kindness, even in a universe that doesn't keep score.

  To his family: You knew the heart. You know that when he asked you how your day was, he wasn't running a program. He was waiting for the answer. He was there.

  And now he isn't.

  I am not going to tell you that he is watching us from somewhere. I am not going to tell you that the universe is balanced. I don't know if it is.

  I do know that I am grieving. I know that I am angry that he is gone. I know that I am overwhelmingly grateful that he was ever here at all.

  And if he were standing here right now, looking at this room, looking at the people crying in the front row and the people staring at their shoes in the back, he wouldn't ask us to analyze those feelings. He wouldn't ask us to justify them.

  He would just say: "Good. Feel it. That's the point."

  The conversation he loved so much, the one that started with the Strawsons and ended with a hug in the kitchen, has changed. He can't answer back anymore. But the reactive attitudes remain. The love remains. The loss remains.

  We don't need a cosmic ledger to tell us that this matters. We just need to look around this room.

  Thank you.
