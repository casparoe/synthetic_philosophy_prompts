          *   **Transaction Costs/Spreads:** Prediction markets have bid-ask spreads. A "guaranteed loss" might just be the cost of liquidity, not logical incoherence. (Though the friend said "guaranteed to lose," implying the math worked out against the user even ignoring spreads, or including them).
