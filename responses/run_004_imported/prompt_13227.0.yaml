answer: |-
  ### Scenario: The "Decoupled Monitoring" Protocol

  **Subject:** Elena, a neurotypical adult participant.
  **First-Order State:** A sustained, low-intensity haptic vibration applied to Elena's left forearm.
  **Experimental Setup:** Elena is placed in an fMRI scanner and engaged in a dual-task paradigm designed to dissociate *availability*, *attentional scanning*, and *conceptual categorization*. The vibration begins at $t=0$ and continues steadily throughout the sequence. The experimenters manipulate Elena's cognitive resources and inhibitory controls in three distinct phases.

  #### Phase 1 ($t=0$ to $t=30$s): High Load, Open Pathway
  The vibration begins. Simultaneously, Elena is engaged in a high-load visual working memory task (tracking multiple moving objects) that consumes the executive resources required to *deploy* higher-order mechanisms. However, the somatic signal is successfully integrated into her central cognitive system; it is not subliminal or blindsighted. If the visual task were suddenly cancelled, she could immediately report the vibration. The pathway from the somatic state to the mindreading system is intact (available), but the mindreading system is too resource-depleted to actually activate.

  *   **Verdict:** **Conscious** (Dispositional HOT) | **Unconscious** (HOP & Actual HOT)
  *   **Theoretical Commitment:** This splits **Carruthers** from the Actualists (Lycan and Rosenthal). Carruthers' theory relies on **availability rather than occurrence**. For Carruthers, a state is phenomenally conscious if it is *poised* to affect the mindreading system, even if that system is currently idle or distracted. Because the vibration is integrated and accessible (had the load dropped, a thought would form), it is conscious. Lycan and Rosenthal, requiring an *occurrent* higher-order state, deny consciousness here because no monitoring or thinking is actually taking place.

  #### Phase 2 ($t=30$s to $t=60$s): Load Reduced, Conceptual Inhibition
  The visual working memory task ends, freeing up executive resources. Elena's attention automatically shifts to her arm; neuroimaging confirms activation in parietal regions associated with internal monitoring and attention. However, she is simultaneously engaged in a *verbal shadowing task* (repeating nonsense syllables) that specifically inhibits the formation of propositional attitudes and concepts in Broca's area. She is "attending to" the sensation in an analog, non-conceptual way (she can track its intensity fluctuations on a dial without labeling them), but she cannot form the judgment "I am feeling vibration."

  *   **Verdict:** **Conscious** (Dispositional HOT & HOP) | **Unconscious** (Actual HOT)
  *   **Theoretical Commitment:** This splits **Rosenthal** from **Lycan** (and Carruthers). Lycan's Higher-Order Perception model requires an **actual, occurrent monitoring state**, but permits that state to be **non-conceptual or analog** (like a scanner). Because Elena is actively scanning the sensation, Lycan grants consciousness. Rosenthal's HOT theory, however, requires the higher-order state to be a **conceptual thought** (a tokening of the concept *vibration* or *sensation*). Since the shadowing task blocks conceptualization, Rosenthal denies consciousness. (Carruthers also grants consciousness here, as the state remains available).

  #### Phase 3 ($t=60$s onwards): Full Integration
  The verbal shadowing task ends. Elena's conceptual faculties come online regarding the sensation. She tokens the non-inferential thought: *"I am feeling a vibration on my arm."*

  *   **Verdict:** **Conscious** (All Three Theories)
  *   **Theoretical Commitment:** All conditions are met: the state is available (Carruthers), an actual monitoring state is occurring (Lycan), and an actual conceptual thought is tokened (Rosenthal).

  ### Summary of Discrimination

  This scenario forces the theories to disagree on the **exact onset time** of phenomenal consciousness for the *same* first-order state:

  1.  **Carruthers (Dispositional HOT):** Consciousness begins at **$t=0$ (Phase 1)**.
      *   *Why:* The commitment to **mere availability**. The first-order state was functionally poised to trigger a higher-order thought, which suffices for phenomenality, even if the thought never occurred.
  2.  **Lycan (HOP):** Consciousness begins at **$t=30$s (Phase 2)**.
      *   *Why:* The commitment to **actual occurrence** combined with **non-conceptual format**. The "inner scanner" must be actively running, but it need not produce a conceptual judgment. Phase 1 lacked the scan; Phase 2 had it.
  3.  **Rosenthal (Actual HOT):** Consciousness begins at **$t=60$s (Phase 3)**.
      *   *Why:* The commitment to **actual occurrence** combined with **conceptual format**. A higher-order state must not only occur (ruling out Phase 1) but must be a thought involving concepts (ruling out Phase 2).

  By tracking the single haptic state across these manipulations, the scenario avoids general objections to higher-order theories (like targetless thoughts) and instead exploits the specific structural differences regarding *etiology* (availability vs. activation) and *format* (analog scan vs. conceptual thought) to produce three distinct temporal verdicts.
