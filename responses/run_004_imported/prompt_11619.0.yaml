answer: |-
  **Setting:** *The hotel bar of the Grand Hyatt, 11:30 PM. The "Crisis of Confidence in Psychological Science" panel has just adjourned. Two name badges rest on the coaster-strewn table: **ELENA VANCE** (University of Chicago, Frequentist) and **JULIAN MERCER** (University of Amsterdam, Bayesian).*

  **Julian:** You were hard on the panelists for not bringing up Bem. I thought that was the whole point of the last decade. The man found time-reversed priming effects with $p < .05$, and the entire field imploded. It's the perfect exhibit A for why p-values are a broken epistemic technology.

  **Elena:** I didn't say Bem wasn't important, Julian. I said you people treat it like a parable instead of a case study. You wave your hands and say, "See? P-values prove ghosts." But Bem didn't fail because he used Null Hypothesis Significance Testing. He failed because he violated the assumptions of NHST.

  **Julian:** He violated the assumptions by treating a $p$-value as a posterior probability. That's the structural flaw. He got a $p$ of .01, declared the null rejected, and acted as if the probability of precognition was now high. But a $p$-value is $P(\text{Data} | H_0)$. It tells you nothing about $P(H_0 | \text{Data})$. To get there, you need a prior. And when Wagenmakers applied a reasonable skeptical prior to Bem's data, the Bayes Factor collapsed. The evidence was anecdotal at best.

  **Elena:** "Reasonable skeptical prior." There's the rub. Let's talk about that prior. Wagenmakers used a Cauchy distribution centered on zero. It effectively said, "I believe large effect sizes are unlikely." Which is true for most psychology. But for *precognition*? You're baking the conclusion into the premise. If your prior probability for psi is effectively zero, no amount of data will move you. That's not statistics; that's dogma with a calculus.

  **Julian:** It's not dogma, it's calibration. If you claim a mechanism that violates causality, the burden of proof isn't just crossing an arbitrary alpha threshold. It's about the likelihood ratio. An extraordinary claim requires a likelihood ratio strong enough to overcome the low prior odds. The Bayes Factor quantifies that. The p-value doesn't. A $p$-value of .01 might be strong evidence for a new drug, but it's weak evidence for telepathy. The frequentist framework has no way to distinguish those two contexts. It treats them both as "reject null."

  **Elena:** That's false. The frequentist framework distinguishes them through error control and study design. Look at what Bem actually *did*. He ran nine studies. Some were exploratory. He peeked at the data, decided on sample sizes mid-stream, and analyzed multiple dependent variables. He walked through the Garden of Forking Paths and picked the path that led to $p < .05$.

  **Julian:** I agree he $p$-hacked. But my point is that even if he *hadn't*—even if he had pre-registered a single study, fixed $N$, and got $p = .01$—I still wouldn't believe in psi. And neither should you. The Bayes Factor captures that intuition. The p-value does not.

  **Elena:** If he pre-registered and got $p = .01$ on a single, clean study, I'd be intrigued. Not convinced, but intrigued. But here's the thing you're glossing over: You don't need the Bayesian detour to kill Bem's result. You just need to account for the multiple comparisons he actually made. If you apply a Bonferroni correction for the number of outcome variables he tested across those nine studies, his "significant" results vanish. The frequentist machinery works perfectly fine here. It flagged the error rate inflation. The problem wasn't the tool; it was the operator ignoring the manual.

  **Julian:** But that requires you to know *which* fork in the path he took. It requires mind-reading the researcher's degrees of freedom. With Bayes, the Likelihood Principle says the evidence is in the data, not in what the researcher intended to do but didn't. Optional stopping doesn't inflate a Bayes Factor the way it inflates a Type I error rate.

  **Elena:** Optional stopping doesn't inflate the false positive rate *if* you adjust your alpha spending. Again, you're attacking a caricature of frequentism where researchers blindly trust $p < .05$ without checking assumptions. Of course, if you ignore the sampling plan, you get garbage. But let's go back to the prior. You say the Cauchy prior is "reasonable." How reasonable is it really? Critics pointed out that if you shift the scale parameter slightly, or use a different distribution, the Bayes Factor swings from "anecdotal" to "moderate." Doesn't that suggest the Wagenmakers analysis was reverse-engineered to yield the socially acceptable conclusion?

  **Julian:** That's a sharp charge, Elena. But let's look at the merits. The Cauchy(0, 1) wasn't pulled from thin air. It's based on the distribution of effect sizes typically observed in psychology. Most effects are small. Large effects are rare. If Bem was claiming a $d$ of 0.2 based on a prior that expected $d$ to be 0.8, the data looks weak. If the prior expects $d$ to be 0.05, the data looks stronger. Wagenmakers argued that for a phenomenon never reliably demonstrated, we shouldn't assume a prior centered on typical psychological effect sizes. We should be conservative.

  **Elena:** Conservative is code for "biased toward the null."

  **Julian:** No, it's code for "acknowledging base rates." In medicine, if you test a homeopathic remedy, you don't start with a 50/50 prior that it works. You start with a prior that reflects biological plausibility. If you force a frequentist to state their "implicit prior," they'd realize they're acting as if the null and alternative are equally likely before the experiment starts. That's the real hidden assumption! At least Bayes makes the subjectivity explicit. You can argue about the prior. You can't argue about a p-value because it pretends to be objective while leading you to subjective conclusions.

  **Elena:** I'll grant you that implicit priors exist. But the solution isn't to replace error rates with subjective belief updates. It's to tighten the error rates. Pre-registration. Registered Reports. Multiplicity corrections. If Bem had submitted to a journal that required a Registered Report today, he couldn't have done what he did. The frequentist framework evolved. It learned. The replication crisis wasn't a failure of NHST; it was a failure of *incentives* that allowed NHST to be abused.

  **Julian:** But incentives don't fix the interpretation problem. Suppose I run a perfect Registered Report. No peeking. Fixed $N$. I get $p = .049$. The frequency of false positives is 5%. But I still don't know the probability that my hypothesis is true. In low-power fields, the Positive Predictive Value of a "significant" finding can be shockingly low, even with $p < .05$. Ioannidis showed this. You can have a valid p-value and still be mostly wrong if the base rate of true hypotheses is low. Bayes handles the base rate directly.

  **Elena:** Ioannidis's argument is essentially a Bayesian argument smuggled into frequentist clothing. I know that. But in practice, scientists don't have agreed-upon priors. If we adopt Bayes, we spend the next ten years fighting about whether the scale parameter should be 0.5 or 0.7 instead of fighting about sample sizes and confounds. With p-values, the threshold is a shared Schelling point. It's flawed, but it's a coordination mechanism.

  **Julian:** It's a coordination mechanism for publishing garbage. The "shared Schelling point" is a cliff edge. $p = .051$ is "nothing," $p = .049$ is "discovery." That's absurd. The Bayes Factor is continuous. It tells you how much to shift your confidence. It doesn't force a binary decision.

  **Elena:** And yet, in the Bem case, the Bayes Factor didn't save us from the binary decision either. Wagenmakers concluded "evidence is weak," which the media translated to "Psi is fake." You replaced one binary with another.

  **Julian:** *Weak evidence* isn't the same as *evidence of absence*. That's the nuance. A p-value says "Reject Null." A Bayes Factor can say "Data are insensitive." That's crucial. In Bem's case, the data were insensitive to distinguish between a tiny effect and no effect, given the skepticism required.

  **Elena:** Okay, let's meet in the middle. We agree Bem was wrong. We agree the result doesn't replicate. I argue that standard frequentist corrections for multiple comparisons would have killed it in 2011 without needing a philosophical overhaul. You argue that even without those corrections, a Bayesian analysis would have flagged the evidence as too weak to believe.

  **Julian:** I can accept that. But the *reason* matters. If you tell young researchers, "Fix your p-hacking and you're safe," they'll just p-hack more subtly. If you tell them, "Your evidence needs to be strong enough to move a skeptical prior," you change how they think about data collection. You encourage larger samples. You encourage stronger manipulations.

  **Elena:** Or you encourage them to pick priors that make their pet theory look good. Look, I'm not against Bayes. I use hierarchical models. But as a normative standard for scientific consensus? It's too vulnerable to the "subjective prior" attack. When the CDC or the FDA makes a ruling, they need to know the long-run error rate. They need to know that if they approve 100 drugs with this method, only 5 will be duds. Bayes gives you a probability for *this* drug, but it doesn't guarantee the long-run performance of the *process*.

  **Julian:** And Frequentism gives you the long-run performance of the process, but tells you nothing about *this* drug. It's the inverse error. I'd rather know the probability that I'm wrong right now than the probability that I'd be wrong in an infinite sequence of hypothetical experiments I'm not running.

  **Elena:** But science *is* that infinite sequence. It's a collective enterprise. We are building a frequency-controlled filter for truth. If your prior is wrong, you pollute the filter. If my alpha is wrong, I can calibrate the filter.

  **Julian:** You can only calibrate the filter if the studies entering it are honest. Bem proved they weren't. And the reason they weren't is that the $p < .05$ threshold creates a perverse incentive. Bayes removes the cliff.

  **Elena:** Removing the cliff doesn't remove the mountain. Researchers will still chase high Bayes Factors. They'll just "Bayes-hack" instead of p-hack. They'll try ten priors until one gives them a BF > 10.

  **Julian:** *Touché.* But at least with Bayes, if they show me their data and their prior, I can see the move. With p-values, the move is hidden in the sampling plan they never reported.

  **Elena:** So we agree on transparency. Pre-registration. Open data. Open code.

  **Julian:** We do. Whether I update my belief by 5% or 50% depends on the math, but it depends more on whether I trust the data wasn't massaged.

  **Elena:** Then maybe the lesson of Bem isn't "Frequentism bad, Bayes good." Maybe it's "Science requires vigilance, regardless of the calculus."

  **Julian:** I'll drink to that. Though I still think the Cauchy prior was justified.

  **Elena:** And I still think a Bonferroni correction would have been cheaper.

  **Julian:** *Clinks glass.* To the replication crisis. May we never see its like again.

  **Elena:** To the crisis. And to the next one we haven't invented yet.
