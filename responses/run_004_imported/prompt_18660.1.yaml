prompt: |-
  ok so my school's philosophy club (it's small, like 6 of us) finally landed an actual guest for our meeting next week — a phil grad student from the university down the road who's really into defending Kripke's whole rigid designators / necessary a posteriori picture, like causal theory of names, "water is H2O," all of it. we've been slogging through excerpts of Naming and Necessity for weeks to get ready and I somehow got voted "interviewer," which is stressing me out bc I don't want to just lob her softball questions and get the textbook answer back.

  could you write me like 8-10 actual interview questions — no generic stuff like "what got you into philosophy" — that push on the substance of the view instead of just having her restate it? specifically i want: one question going after the circularity worry with the causal theory (how does a chain of communication actually lock onto the right person/thing instead of secretly smuggling in a description after all), one on the Godel-Schmidt case and what its actually supposed to prove against descriptivism, one where i basically use Evans's Madagascar example against her (my teacher mentioned that one as a case where a name's reference shifted through a mistake instead of a real "baptism," which seems like it breaks the pure causal picture), and one on how she'd defend calling "water" a rigid designator for H2O once you bring up weird edge cases like jade, which turned out to be two totally different minerals wearing the same name. for each of those, throw in a quick follow-up keyed to whatever answer she'd probably give, so im not just standing there doing question-next-question-next the whole time. and if you can sneak in one more near the end about whether two-dimensionalism basically rescues descriptivism without needing kripke's picture at all, that'd be perfect.
