answer: |-
  **Title:** The Silence of the Series: Why the Pasadena Paradox Breaks Expected Utility Theory

  **Introduction**

  As an experimental physicist, you are accustomed to the idea that a model is valid within a specific domain. Newtonian mechanics works until it doesn't; thermodynamics holds until fluctuations dominate. In decision theory, Expected Utility Theory (EUT) has long been treated not merely as a useful model, but as the *normative* gold standard—the definition of rational choice itself. The Pasadena paradox, however, is not a domain error like applying fluid dynamics to a single atom. It is a structural failure within the logic of the theory itself.

  The question is whether this failure is a mere mathematical singularity that can be regularized away (the "pathology" view) or evidence that the foundational axioms of EUT are incomplete (the "deep flaw" view). While the physicist's instinct is to impose a cutoff—bounded utility, finite bankrolls, physical limits—this essay argues that such moves conflate physical feasibility with normative coherence. The Pasadena paradox exposes a genuine, deep flaw in EUT's claim to be a universal normative theory. It demonstrates that the linear aggregation of value and probability, which lies at the heart of EUT, collapses when utility is unbounded, leaving the theory silent where rational intuition demands an answer.

  **The Nature of the Singularity**

  To appreciate the severity of Pasadena, we must distinguish it from its predecessor, the St. Petersburg paradox. In St. Petersburg, the expected value diverges to infinity. While problematic, infinity is a defined concept in extended real numbers; one can arguably say a game with infinite expectation is better than one with finite expectation.

  Pasadena is worse. As you noted, the expectation is the alternating harmonic series:
  $$ E = \sum_{n=1}^{\infty} \frac{1}{2^n} \cdot \frac{(-1)^{n-1} 2^n}{n} = \sum_{n=1}^{\infty} \frac{(-1)^{n-1}}{n} $$
  This series is conditionally convergent. In the Lebesgue integration framework underpinning modern probability theory, an expectation is defined only if the integral of the absolute value is finite (absolute convergence). Because $\sum |(-1)^{n-1}/n|$ diverges, the expectation is not infinite; it is *undefined*.

  By the Riemann Rearrangement Theorem, the value of the sum depends entirely on the order of summation. Since EUT provides no normative rule for ordering outcomes (outcomes are a set, not a sequence), the theory literally cannot assign a value to the gamble. It does not say "this is risky"; it says nothing.

  **The Case for the "Pathology" View**

  The defense against Pasadena usually mirrors the physicist's approach to renormalization. Proponents of the "pathology" view, often leaning on bounded utility functions, argue that the paradox relies on physically impossible payoffs. No entity in the universe can pay out $2^{1000}$ dollars. If we impose a bound $M$ on utility, the series becomes finite, the expectation exists, and the paradox vanishes.

  Similarly, some suggest using "weak expectations" (the limit of the average payoff over $N$ trials as $N \to \infty$) or truncating the game at a reasonable $n$. From an engineering or applied economics perspective, this is satisfactory. It treats EUT as a tool for managing risk in a finite world. If the inputs are unphysical, the garbage output doesn't invalidate the tool.

  Mark Colyvan adds a normative layer to this, suggesting we fall back on *dominance reasoning*. If Game A pays more than Game B in every possible state, choose A, regardless of expectations. This bypasses the expectation calculation entirely.

  **Why the Patch Fails Normatively**

  However, treating Pasadena as a physical pathology misses the point of *normative* decision theory. Normative theory is not about what agents *can* do given physical constraints; it is about what agents *should* do given logical constraints. It is the logic of consistency in preference.

  If EUT is the true logic of rational choice, it should handle logically possible scenarios, even if they are physically unrealizable. Consider a modified Pasadena game where the payoffs are scaled down to fit within a human lifetime of cents, but the probabilities are adjusted to maintain the conditional convergence structure. The mathematical pathology remains, even if the physical stakes are trivial. The issue is not the magnitude of the utility, but the *structure* of the summation.

  Furthermore, the "bounded utility" patch is ad hoc. It saves the theory by changing the subject. It essentially says, "EUT works for all rational preferences, provided we forbid rational agents from having unbounded preferences." But why should rationality require bounded utility? If I prefer more money to less, and there is no logical upper bound on the number of dollars I can conceive, my utility function is unbounded. To cap it is to impose an external constraint on rationality, not to derive one from it.

  Colyvan's dominance reasoning also fails under scrutiny, as Hájek and Nover have demonstrated. They constructed "Pasadena Plus" variants where dominance reasoning conflicts with intuitive preferences, or where dominance is silent because the payoff structures overlap in complex ways. If you have to abandon EUT for Dominance, and Dominance also breaks, you don't have a patch; you have a crisis.

  **The Deep Flaw: Linearity and Completeness**

  The verdict must be that Pasadena exposes a deep flaw in EUT's claim to completeness. The flaw lies in the **Archimedean axiom** and the assumption of **linearity**.

  EUT assumes that the value of a gamble is the linear sum of probability-weighted utilities. This linearity holds beautifully when the series converges absolutely. Pasadena proves that when utility scales with probability in a specific, unbounded way, linearity breaks down. The value of the whole is no longer determined by the sum of the parts because the "sum" is not an invariant property of the set of parts.

  This is not a minor technicality. It implies that EUT is not a fundamental law of rationality, but a representation theorem that holds only under specific conditions (specifically, when the utility integral is absolutely convergent). When those conditions are not met, EUT offers no guidance. A normative theory that falls silent in the face of a well-defined logical problem is incomplete.

  Does this destroy EUT? No. Just as General Relativity did not destroy Newtonian mechanics but rather delineated its boundary conditions, Pasadena delineates the boundary of EUT. It shows that EUT is valid for "well-behaved" risks (absolute convergence) but fails for "pathological" risks (conditional convergence).

  **The Verdict**

  The "technical patch" crowd wants to wall off Pasadena as a mathematical curiosity irrelevant to real choice. This is intellectually dishonest for a normative theory. If we accept that decision theory is about the coherence of preferences, then the logical structure of the gamble matters more than the physical feasibility of the payout.

  Therefore, the Pasadena paradox **exposes a real, deep flaw in Expected Utility Theory as a universal normative theory.** It proves that EUT cannot handle unbounded utilities without generating undefined results. The solution is not to pretend the paradox doesn't exist by capping utility, but to acknowledge that rational choice requires a more robust framework than standard EUT provides.

  We need a decision theory that can handle relative comparisons without relying on absolute expectations, or one that adopts a non-Archimedean value structure. Until then, we must accept that EUT is not the logic of rationality *simpliciter*, but the logic of rationality *for bounded, absolutely convergent worlds*. For a physicist, this distinction should be familiar: it is the difference between a law of nature and an effective field theory. Pasadena shows us that EUT is merely effective, not fundamental.

  **Conclusion**

  You spent 35 years trusting error bars and expectations because, in the lab, they work. The series converges; the noise averages out. But in the abstract landscape of rational choice, the Pasadena paradox shows that the "noise" (the alternating terms) never averages out if the utility is unbounded. To dismiss this as a pathology is to prioritize physical convenience over logical consistency. The paradox stands as a rigorous proof that Expected Utility Theory is incomplete. It is a powerful tool, but it is not the final word on rationality.
