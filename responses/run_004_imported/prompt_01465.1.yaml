answer: |-
  This is an exceptionally sharp reading of the texts, and you have put your finger on a seam that has troubled commentators for centuries. Your objection is not only textually grounded but philosophically potent. It cuts to the heart of how Augustine integrates metaphysics, ethics, and soteriology.

  Here is an assessment of your argument, the best case for the Augustinian synthesis, and suggestions for sharpening your critique.

  ### 1. Is this a genuine tension?
  **Yes.** You are correct that Augustine operates with two distinct registers of argumentation that he often treats as identical but which logically function differently.

  *   **The Ontological Register (The "Double Heart"):** Here, lying is a *privatio boni* (privation of good). It is a disordering of the soul, a fracture in the *imago Dei* within the human person. When Augustine argues that the mouth should be the servant of the heart, he is making a claim about the nature of truth and being. In this register, the wrongness is indeed intrinsic. It does not matter if the lie saves a world; the act itself is a movement away from Being (God) toward Non-Being.
  *   **The Soteriological Register (The Eternal Calculus):** Here, the argument shifts to the *ordo caritatis* (order of love) and the hierarchy of goods. Augustine argues that the soul's integrity is a higher good than the body's safety or another's temporal life. When he tells Consentius that the midwives would have been rewarded *more* had they died rather than lied, he is engaging in a comparative valuation of goods.

  The tension arises because the Ontological Register claims lying is *malum in se* (evil in itself), while the Soteriological Register justifies avoiding it because it is *malum in effectu* (evil in effect) regarding one's eternal standing. If the only reason I must not commit an intrinsic evil is that the penalty outweighs the benefit, the "intrinsic" nature of the evil begins to look contingent on the penalty.

  ### 2. Can a committed Augustinian hold both without embarrassment?
  A sophisticated Augustinian defender would argue that these are not two competing arguments, but rather the **definition** of the sin and the **motivation** for avoiding it, grounded in a single metaphysical reality.

  Their defense would likely run as follows:
  *   **Unity of Reality:** For Augustine, there is no sharp divide between "nature" and "consequence" in the modern sense. Because God is the source of all Being, to act against Truth (lying) is to act against one's own ontological grounding. Therefore, the "punishment" for lying is not an arbitrary penalty imposed by a judge; it is the natural disintegration of the soul.
  *   **The Poison Analogy:** If I tell you, "Do not drink this poison," I can give two reasons: (1) It disrupts your biological order (intrinsic), and (2) It will kill you (consequential). These are not contradictory; the second follows from the first. Similarly, the "eternal loss" Augustine speaks of is simply the description of what happens to a soul that chooses the "double heart."
  *   **Eudaimonism, not Utilitarianism:** Augustine is not a utilitarian calculating net happiness. He is a Christian eudaimonist. The "cost-benefit" analysis is not about maximizing utility but about correctly ordering love (*caritas*). To choose a temporal good (a neighbor's life) over an eternal good (truth/union with God) is a disorder of love. Thus, the "calculation" is actually just an application of the "double heart" principle over a timeline.

  **Where this defense struggles:**
  It struggles precisely where you identified: the case of the Hebrew Midwives and Rahab. If the lie is intrinsically a corruption of the *imago Dei*, how can God reward the act in which the corruption occurred? Augustine's solution—that they were rewarded for the *mercy* but would have been rewarded *more* for the *truth*—is logically coherent but pastorally and intuitively strained. It implies that the "intrinsic" evil of the lie merely deducted points from their score, rather than rendering the act fundamentally incompatible with reward. This suggests the "intrinsic" wrongness is actually fungible, which undermines the "double heart" absolutism.

  ### 3. Sharpening and Reformulating Your Objection
  Your current draft is strong, but you can make it more lethal by refining the "consequentialist" label. Calling Augustine a consequentialist might invite the counter-argument that he is actually a virtue ethicist or eudaimonist. Instead, focus on the **instrumentalization of truth**.

  Here is a proposed reformulation of your thesis to make it more precise:

  > **Revised Thesis:** Augustine's absolutism relies on an unstable equivocation between lying as an *ontological disorder* and lying as a *soteriological hazard*.
  >
  > In *De Mendacio*, Augustine defines lying as a *duplex cor* (double heart), an intrinsic fracture of the self that ostensibly admits no exceptions regardless of outcome. However, when pressed by hard cases in *Contra Mendacium*, he defends the prohibition not by deepening the ontological analysis, but by appealing to a hierarchy of goods where eternal integrity always outweighs temporal welfare.
  >
  > This shift reveals a vulnerability: if the prohibition against lying is ultimately sustained by the claim that "no temporal loss outweighs an eternal one," then the wrongness of lying is functionally dependent on the *cost* of the lie to the liar's salvation, not merely its *nature* as a falsehood. This renders the "double heart" argument descriptive rather than normative. It suggests that for Augustine, truth-telling is not an absolute duty owed to the neighbor or to Being itself, but a prudential strategy for securing the soul's highest good. Consequently, his absolutism collapses into a form of **eschatological prudentialism**: one must not lie not because lying is inherently impossible to justify, but because the price of justification is too high.

  ### 4. Specific Points to Emphasize in Seminar
  If you bring this to your seminar, here are three specific angles that will strengthen your position:

  1.  **The Consentius Context:** Remind your peers that *Contra Mendacium* was written specifically to stop Consentius from lying to catch heretics. Augustine is fighting a "ends justify the means" mentality. In doing so, he may have over-corrected, leaning too heavily on the "eternal reward" argument to shock Consentius into compliance, which exposes the theological scaffolding that usually remains hidden in *De Mendacio*.
  2.  **The Problem of Charity:** Press the point on *caritas*. If I lie to save your life, I am acting out of love for you. If I tell the truth and you die, I am acting out of love for God (Truth). Augustine says love for God wins. But if the "double heart" is the primary evil, why does God accept the midwives' lie at all? If the lie damages the *imago Dei*, how is it compatible with the mercy God rewards? This suggests the "intrinsic" damage isn't as absolute as the "double heart" argument claims.
  3.  **Kant vs. Augustine:** Be careful not to make Augustine sound like Kant. Kant forbids lying because it violates the Categorical Imperative (autonomy/reason). Augustine forbids it because it violates the Order of Being (God). Your critique is powerful because it shows that even Augustine, despite his theological metaphysics, sometimes falls back on a calculation of goods that looks suspiciously like the utilitarianism he opposes, just with different currency (souls instead of happiness).

  ### Verdict
  You should not be talked out of this. It is a standard and respected critique in patristic scholarship (echoed by scholars like Oliver O'Donovan and Jean Porter). The tension you identified is real. Augustine wants to have it both ways: he wants lying to be a monster in itself (so we fear it) and a bad bargain (so we avoid it). Your argument successfully shows that if it's only a bad bargain, it's not necessarily a monster.

  Your morning's work is seminar-ready. If you present it as the "tension between ontological disorder and soteriological calculation," you will frame the debate in terms that do justice to Augustine's theology while exposing the logical friction point.
