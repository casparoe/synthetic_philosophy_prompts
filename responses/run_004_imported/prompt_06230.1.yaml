      *   **Lewis's Dismissed Objection:** Fines are a "second-rate," compromised form of punishment *because* they allow substitution. Tolerating substitution for fines is just the cost of an imperfect institution, not evidence against the principle that only the guilty should suffer.
      *   **Lewis's Reason for Dismissal:** We don't actually complain about fines in that way (empirical claim about our intuitions).
      *   **Task 1:** Construct the *strongest possible case* for the position Lewis dismisses (i.e., fines are inherently compromised/imperfect *because* they are transferable, and this explains the intuition gap without validating penal substitution).
      *   **Task 2:** Assess whether this successful argument undermines Lewis's closing suggestion (that our wavering over fines suggests penal substitution might make sense after all).

  2.  **Deconstruct Lewis's Argument (Mental Sandbox):**
