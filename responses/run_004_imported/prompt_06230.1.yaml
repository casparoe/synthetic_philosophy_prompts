      *   *The "Debt" Distinction:* This is crucial. A fine is a monetary debt to the state. A prison term is a restriction of liberty. Debts are inherently transferable in commerce. Liberty is not. If we classify fines as "quasi-debts," the substitution is logical without validating *penal* substitution.
