      *   *Synthesis:* The intuition gap isn't about the *principle* of penal substitution being coherent; it's about the *medium* of punishment. Fines are essentially debts. Debts are transferable. Imprisonment is essentially bodily restriction. Bodies are not transferable. Therefore, accepting fine substitution doesn't imply accepting prison substitution.

