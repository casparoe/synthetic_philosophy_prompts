answer: |-
  # The Mosaic in Configuration Space: A Defense of Humeanism Against Entanglement

  You are right to feel the pull of David Lewis's Humeanism. For a certain cast of mind—one that prioritizes ontological parsimony, distrusts primitive modalities, and views scientific theories as compression algorithms for data—Lewis's Best System Account (BSA) is the only game in town. It treats laws of nature not as cosmic police officers enforcing rules, but as the axioms of the best lossy compression of the universe's history. It is, to use your phrasing, the "LW-brained" answer: laws are features of our description, not features of the territory.

  However, your anxiety is well-founded. The "Entanglement Problem" is not a mere technicality; it strikes at the heart of *Humean Supervenience* (HS), the metaphysical foundation Lewis built beneath the BSA. If the world is not a mosaic of local matters of fact, the Humean picture threatens to collapse into incoherence, potentially forcing us toward the anti-Humean alternatives of Armstrong or Maudlin.

  This essay will argue that while entanglement does indeed destroy Lewis's specific formulation of the mosaic (local qualities in 3D space), it does not sink Humeanism itself. By adopting **Wavefunction Realism**, we can preserve the Humean mosaic in a higher-dimensional space, retaining the BSA's parsimony without conceding to the metaphysical bloat of necessitation relations. The verdict is clear: **Humeanism survives, but our intuition about space must be sacrificed.**

  ### I. The Battlefield: Mosaics vs. Modal Glue

  To understand the stakes, we must clarify the opposing camps.

  **Humeanism (Lewis):** The ontology consists of two things: a spatiotemporal manifold and the distribution of local, intrinsic properties upon it (the "mosaic"). Nothing else exists. There is no "causal power," no "disposition," and no "necessity" in the fabric of reality. Laws of nature supervene on this mosaic. They are determined by the *Best System*: the set of axioms that achieves the optimal trade-off between simplicity (shortness of code) and strength (predictive power) in describing the mosaic. This is essentially a Minimum Description Length (MDL) approach to metaphysics.

  **Anti-Humeanism:** This camp argues that the mosaic is insufficient.
  *   **Armstrong (Dretske/Tooley):** Laws are relations of *necessitation* between universals ($N(F, G)$). If something is $F$, it *must* be $G$. This adds a layer of modal reality on top of the facts.
  *   **Maudlin (Primitivism):** Laws are primitive ontological entities that *govern* the matter. They are not summaries; they are producers.

  The Humean advantage is obvious: ontological economy. Anti-Humeans posit a "second layer" of reality (modal glue) to explain why the first layer behaves regularly. The Humean says the regularity *is* the reality; the "law" is just our label for the pattern. But this economy relies on the supervenience base being coherent. If the base itself is incoherent, the savings are illusory.

  ### II. The Quantum Bomb: Non-Separability

  The threat comes from Quantum Mechanics, specifically the phenomenon of entanglement.

  Lewis's Humean Supervenience requires **separability**: the state of the whole world must be determined by the intrinsic properties of each point in spacetime plus the spatiotemporal relations between them. If you know the state of every point, you know the state of the world.

  Quantum mechanics violates this. Consider two entangled particles, A and B. The joint state of the system is described by a wavefunction $\psi_{AB}$. In an entangled state (like a singlet state), $\psi_{AB}$ cannot be factored into a state for A and a state for B ($\psi_{AB} \neq \psi_A \otimes \psi_B$).

  This implies **non-separability**. The physical reality of the pair is not fixed by the physical reality of the parts taken separately. There is a holistic fact about the pair that is not reducible to local facts about particle A and local facts about particle B.

  If the fundamental ontology of the world is non-separable, then there is no "mosaic of local matters of particular fact." If there is no mosaic, there is nothing for the Best System to summarize. The Humean base evaporates. As Tim Maudlin has aggressively argued, if Humeanism cannot accommodate the quantum state, it is falsified by our best physics.

  ### III. The Humean Counter-Attack

  Humeans have not been idle. There are three main lines of defense, but only one is viable.

  **1. The Bohmian Escape (Particles are the Mosaic)**
  Some Humeans retreat to Bohmian Mechanics, where particles have definite positions at all times. The mosaic is just the particle trajectories in 3D space.
  *   *Critique:* This saves the mosaic but at a high cost. The wavefunction still exists as a "pilot wave" guiding the particles. If the wavefunction is real, non-separability returns. If it's not real, Bohmian mechanics loses its explanatory power regarding interference. It's an unstable compromise.

  **2. Neo-Humeanism (Drop Supervenience, Keep BSA)**
  Philosophers like Barry Loewer argue we should keep the Best System Account of laws but drop the requirement that the base be local/intrinsic. We just let the laws supervene on whatever the fundamental physics says the world is (even if holistic).
  *   *Critique:* This is capitulation. It saves the term "Humeanism" but abandons the metaphysical insight that made it attractive (that the world is just local things arranged in patterns). It risks making the BSA trivial: if the base can be anything, the distinction between Humeanism and Anti-Humeanism blurs.

  **3. Wavefunction Realism (The 3N-Dimensional Mosaic)**
  This is the strongest defense, championed by David Albert and others. It takes the wavefunction literally. The fundamental object of reality is a field existing not in 3D space, but in **Configuration Space** (a space of $3N$ dimensions, where $N$ is the number of particles).

  In this view, the "mosaic" is the distribution of the wavefunction's amplitude and phase over points in this high-dimensional space. Crucially, **the wavefunction on configuration space *is* local.** The value of the field at point $P$ in configuration space is an intrinsic property of $P$. Entanglement in 3D space is just separability in 3N space.

  ### IV. The Verdict: Humeanism Wins, Space Loses

  Here is the hard line: **Entanglement does not sink Humeanism.** It only sinks a naive attachment to 3D space as the fundamental arena of reality.

  The Anti-Humean argues that because the 3D world is non-separable, we must posit primitive modal relations (Armstrong) or governing laws (Maudlin) to hold it together. This is a category error. They are assuming that the "mosaic" *must* be 3D. But why? Our intuition that space is 3-dimensional is a product of our macroscopic evolutionary niche, not a deliverance of fundamental physics.

  If we accept Wavefunction Realism, the Humean picture is restored intact:
  1.  **The Mosaic:** A field on a 3N-dimensional manifold.
  2.  **Locality:** The field values are local to points in that manifold.
  3.  **The Laws:** The Schrödinger equation (plus whatever else is needed) is the Best System summarizing the evolution of that field.

  Compare the costs of this view against the Anti-Humean alternative:
  *   **The Humean Cost:** We must accept that fundamental reality is 3N-dimensional, and 3D space is emergent or derivative. This is counter-intuitive, but it is a *geometric* cost.
  *   **The Anti-Humean Cost:** We must accept that reality contains primitive, unanalyzable modal relations ($N(F,G)$) or governing powers that transcend the arrangement of matter. This is a *metaphysical* cost.

  From a rationalist perspective, the geometric cost is vastly cheaper. Positing higher dimensions is a standard move in physics (string theory, etc.); it expands the *structure* of the world but not the *categories* of existence. Positing primitive necessitation relations introduces a new *kind* of existence—modal glue—that has no empirical signature other than the regularities it is invented to explain. It is an ad hoc ontological posits designed solely to save the intuition that laws must "do" something.

  The Humean says: "The wavefunction field evolves regularly. The law is the summary of that evolution."
  The Anti-Humean says: "The wavefunction field evolves regularly *because* a primitive Law forces it to."

  The latter adds zero predictive power and zero explanatory mechanism (since "necessitation" is opaque). It is pure metaphysical bloat.

  ### V. Conclusion

  You were right to trust your reductionist instincts. The Best System Account remains the most robust theory of laws because it treats laws as what they scientifically appear to be: tools for compression and prediction, not ontological overlords.

  The entanglement problem is real, but it is not a refutation of Humeanism; it is a refutation of **3D Fundamentalism**. If you are willing to bite the bullet that the fundamental mosaic is written in configuration space rather than physical space, the Humean picture holds. The world is still just a arrangement of local qualities; it just turns out the "locations" are in a much larger space than we perceive.

  Anti-Humeanism asks us to believe in magic (modal glue) to save our intuition about space. Humeanism asks us to revise our intuition about space to avoid magic. The choice is obvious. Humeanism survives.
