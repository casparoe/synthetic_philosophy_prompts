answer: |-
  Good afternoon. Thank you all for being here.

  For those of you who knew my father well—especially the colleagues in the room—you probably expected me to start with a joke about the weather, or a story about a case he won, or perhaps a gentle platitude about how he's resting now. But if you knew him, you know he wouldn't have wanted that. He wasn't a man for easy comfort. He was a man for the truth, even when the truth was heavy.

  So, I want to start with the thing I know half of you are waiting to hear, and the other half have heard a hundred times at the dinner table. I want to talk about Pascal.

  My father never went to university. He didn't have letters after his name, and he wouldn't have called himself a philosopher. But he read constantly, and there was one passage he returned to for as long as I can remember. He'd come home after a brutal week in court, sit down at the head of the table, and recite it. Sometimes it was half a joke, a way to blow off steam. But mostly, I think, it was the truest thing he knew.

  He'd say: "Justice without force is powerless. Force without justice is tyrannical. And since we cannot make what is just strong, we end up making what is strong count as just."

  It is a bleak idea. It says that in this world, might makes right. It says that the law isn't necessarily about what is good, but about who has the power to enforce their will.

  I know many of his colleagues recognize that sentiment. You saw it with him in the hallways. You saw him look at the weight of the state—the police, the prisons, the statutes, the budgets—and then look at the person sitting in the defendant's chair, who often had nothing but the clothes on their back. On paper, the state had all the force. On paper, the client had none.

  If my father had been a cynic, that Pascal quote would have been his reason to quit. If justice is powerless without force, and the force belongs to the state, why bother? Why spend forty years banging your head against a wall that is designed to keep people out?

  But that wasn't his conclusion. That was his starting line.

  I've spent the last few weeks thinking about why he went back to that courtroom, year after year, decade after decade. And I think I finally understand. I think my father became a public defender specifically because of that passage. He knew he couldn't change human nature. He knew he couldn't stop the state from having force. But he understood that if justice is powerless without force, then a lawyer's job is to lend justice a little muscle.

  He couldn't make the force just on his own. The system was bigger than him. But he could make sure that the just weren't entirely without defense. He could use the procedure, the objections, the motions, the sheer stubbornness of the law to act as a counter-weight.

  He knew he wouldn't win every time. He was too clear-eyed for that. He knew that sometimes, what is strong would still count as just. He came home tired. He came home angry. He came home knowing that sometimes the tyranny won. But he also knew that if he wasn't there, it would win every time, without even having to fight for it.

  To the family and friends here who heard him quote "the Pascal thing" without knowing the source: I know that sometimes sounded dark to you. I know you wished he could see the world as a brighter place. But I hope you can see now that his darkness wasn't despair. It was clarity.

  He didn't fight because he thought the system was perfect. He fought because he knew it wasn't. He didn't show up because he believed justice was inevitable. He showed up because he knew it was fragile.

  There is a temptation, when someone dies, to smooth out their edges. To say they believed everything would work out in the end. But my father didn't believe things worked out. He believed things were *made* to work out, by people willing to stand in the gap between power and the powerless.

  To his colleagues: You know how hard this work is. You know the burnout, the caseloads, the feeling that the tide is always rising against you. My father felt all of that. But he also knew that every time he forced the state to prove its case, every time he held the line, he was proving Pascal only half-right. He was showing that what is just *can* have force, if there is someone willing to embody it.

  He was that force. For forty years.

  I will miss him. I will miss the dinners. I will miss the arguments. I will miss the way he could look at a complicated, broken situation and find the one honest thread to pull on. But I don't want to honor him by pretending the world is easier than he knew it was.

  The world is still heavy. The balance is still tipped. The strong still try to call themselves just. But if you want to know what my father believed, look at the work he left behind. Look at the people who were heard because he spoke for them. Look at the power that was checked because he stood in front of it.

  He couldn't solve the puzzle of justice and force. None of us can. But for forty years, he made sure that justice wasn't powerless. And that has to be enough.

  Thank you.
