answer: |-
  This is an excellent catch, and your instinct to linger on the 1649 translation is well-founded. The "clumsiness" you note often flags moments where the translator is grappling with Cartesian technicalities that later become standardized (or smoothed over) in modern editions. The passage you highlight is indeed one of the most contentious in the *Discourse*, precisely because, as you note, the inference from "beasts are machines" to "human souls are immortal" is not immediately valid without a specific metaphysical bridge.

  To answer your question directly: Descartes is not merely engaging in pastoral rhetoric here, though the pastoral motive (appeasing the Sorbonne, as he admits in a letter to Mersenne) is undeniable. There is a structural premise within his system that makes the inference *internally* valid, even if we might reject the premise itself. The beast-machine doctrine is not just an isolated claim about animal psychology; it is the negative proof required to secure the ontology of the *res cogitans*.

  Here is a reconstruction of the strongest version of that argument, based on the systematic commitments Descartes holds at the time of the *Discourse*, which you can use to anchor your chapter.

  ### 1. The Problem of the Continuum (The Hidden Premise)
  The logical gap you perceive exists only if we assume that "thought" or "reason" is a scalable property—a gradient that can exist in higher or lower degrees depending on the complexity of the physical organism. This was the standard Scholastic-Aristotelian view: animals possess a *sensitive soul*, humans a *rational soul*, and the difference is one of degree or specific capacity within a shared biological framework.

  If this view holds, then the soul is inextricably tied to the organization of the body. If the soul's powers scale with organic complexity, then the destruction of the organs entails the cessation of the soul's powers.

  Descartes's hidden premise is the **indivisibility of thought**. For Descartes, thought is not a function of organization; it is a substantial attribute. It is all-or-nothing.
  *   **Premise A:** If thought were a property of matter (or dependent on bodily organization), then creatures with similar bodily organizations (animals) would possess some degree of thought, proportional to their organic complexity.
  *   **Premise B:** Animals possess *no* thought/reason (proven by the language/versatility tests and the clock analogy in the earlier part of your excerpt).
  *   **Intermediate Conclusion:** Therefore, thought is not a property of matter or bodily organization.
  *   **Final Conclusion:** Therefore, the human thinking substance is "wholly independing from the body" (as the 1649 text puts it) and is not subject to the corruption of the body.

  The beast-machine doctrine is essential because it closes the loophole of emergentism. By rigorously denying *any* thought to beasts, Descartes severs the link between biological complexity and mental capacity. If a parrot can speak but not converse (a key Descartes example from the *Discourse*), it proves that vocalization is mechanical, but *meaning* is not. If meaning were mechanical, the parrot would have it.

  ### 2. The 1649 Translation and "Independing"
  Your attention to the 1649 phrasing is crucial here. The text says: *"we comprehend much better the reasons which prove that ours is of a nature wholly independing from the body."*

  Modern translations (like CSM) often render this as "independent of." The 1649 "independing" (likely mirroring the French *indépendante* but retaining a verbal force) emphasizes the *act* of dependence. The argument is causal.
  *   If the soul depended on the body for its operations (as the Aristotelian sensitive soul depends on organs), the body's death would cause the soul's cessation.
  *   The beast-machine argument demonstrates that the operations of reason (language, adaptive versatility) occur in humans *without* occurring in animals who have similar (or superior, per the clock analogy) organs.
  *   Therefore, those operations do not flow from the organs.
  *   Therefore, the cause of those operations (the soul) does not depend on the organs.

  The "clumsiness" you sensed might be the translator trying to capture the ontological weight of *substantia* versus *modus*. The 1649 text treats "independing" as a state of being that allows for the final move: *"when we see no other cause which destroys it, we are naturally thence moved to judge that it's immortall."* This is an argument from the lack of a contrary cause. If the soul doesn't depend on the body, the body's death is not a cause that can destroy the soul. God, being immutable, has no reason to destroy it. Thus, immortality.

  ### 3. Why the "Pilot" Analogy Matters in this Context
  You noted the middle paragraph: *"it suffiseth not for it to be lodg'd in our humane body as a Pilot in his ship... but also that its necessary it be joyned and united more strongly."*

  This seems to contradict the "independing" claim, but it actually secures it. Descartes needs to explain pain and sensation (which imply union) without conceding that thought *originates* in that union.
  *   If the soul were merely a pilot, sensations would be unintelligible (why does the pilot feel pain when the ship is hit?).
  *   But if the soul is *united* yet *independing*, it can receive sensations (via the pineal gland, though not named here) without being *generated* by them.
  *   The beast-machine doctrine supports this: Beasts have the "ship" (body) and the "mechanism" of sensation (nerves/organs), but no "pilot" (soul). They react to damage without *feeling* pain in the conscious sense.
  *   This distinction proves that *conscious experience* (the realm of the soul) is not a necessary outcome of physical damage. If it's not a necessary outcome of physical states, it is not identical to them.

  ### 4. Rhetoric vs. Logic in the Dissertation
  For your chapter, I would advise against framing this as "Descartes covers a logical gap with rhetoric." Instead, frame it as **the beast-machine doctrine serving as the empirical boundary condition for his dualism.**

  Descartes cannot prove the soul is immortal positively in the *Discourse* (he saves that for the *Meditations* and *Principles*). Here, he is clearing the ground. The argument is:
  1.  Materialism implies a continuum of mind across species.
  2.  Observation shows a discontinuity (beasts are machines).
  3.  Therefore, Materialism is false regarding the mind.
  4.  Therefore, the mind is a separate substance.
  5.  Therefore, the corruption of the body does not entail the corruption of the mind.

  The "pastoral" element you identified is the *motivation* for the argument, but the *logic* relies on the rejection of the continuum. The 1649 text's insistence that imagining beasts have souls "estrangeth feeble minds from the right way of vertue" is because it blurs the ontological line. If beasts have souls, souls are biological. If souls are biological, they die. The beast-machine doctrine is the wedge that splits biology from ontology.

  ### Summary for your Draft
  The inference is valid *if* you accept Descartes's definition of thought as indivisible and non-gradable. The beast-machine doctrine is not just about animals; it is the control group in Descartes's experiment on substance. By showing that complex organic machinery (the beast) yields zero thought, he isolates thought as a non-organic variable. Once isolated as non-organic, it is no longer subject to organic decay.

  The 1649 translation's "wholly independing" captures the causal claim necessary for this move: the soul does not draw its *existence* or *operative power* from the body. The beast-machine argument proves the lack of dependence; the lack of dependence proves the lack of mortality (given God's conservation).

  You might cite **John Cottingham** ("'A Brute to the Brutes'? Descartes' Treatment of Animals") regarding the "all or nothing" nature of Cartesian thought, or **Peter Harrison** ("Descartes on Animals") on how the beast-machine doctrine protects the theological status of humans. But your primary contribution here is highlighting how the 1649 translation's specific phrasing ("independing," "naturally thence moved") reveals the causal mechanism Descartes thinks he has established.

  This seam you found is not a flaw in his drafting, but the load-bearing wall of his dualism. If animals think even a little, the wall collapses. That is why he insists so heavily on the "clock" analogy—they may measure time better, but they do not *know* time. That distinction is the only thing keeping the soul immortal.
