prompt: |-
  So my friend Dana and I had this two-hour arguement on the drive back from a wedding (as you do) about the extended mind thesis -- the Clark and Chalmers "Otto and his notebook" case, where Otto has Alzheimer's and writes everything down, and the notebook is supposed to count as literally part of his memory system because it's always there, easy to consult, and he trusts it the way the rest of us trust recall (the "parity principle": if a process would count as cognitive when it happens in the head, it should still count when part of it happens outside the head). Somehow this turned into a fight about Locke, because Dana insisted that Locke's own theory of personal identity in the Essay -- where sameness of person is sameness of consciousness, not sameness of soul or body, which is the whole point of the prince-and-cobbler swap -- commits Locke, if he's being consistent, to saying that a notebook or phone you've relied on for thirty years isn't just useful, it's constitutive of who you are, in exactly the sense your biological memories are. I said no: Locke ties personal identity to the act of consciously "appropriating" a past action as your own at the moment you recollect it, not to wherever the information physically sits, so theres room to say the notebook matters causally without being part of the person the way a memory is.

  We never landed anywhere, and we couldn't even agree on whether Reid's brave-officer regress (the old general who remembers the campaign but not the flogging he got as a schoolboy, even though the young officer he once was did remember it) is a problem for Dana's extended-identity reading too, or only for the standard one. Can you actually reconstruct both sides properly and give me a real verdict on who has the better claim on Locke's text -- not a generic "here's how people connect EMT to personal identity" survey, but something that engages with what Locke's memory/consciousness criterion actually commits him to, including whether there's a principled Lockean way to draw the line between "stored outside you" and "part of you" that isn't just stipulated after the fact.
