      *   *Conclusion:* If Locke cares about the *function* of consciousness/memory (access to past actions), he must accept the notebook as part of the "consciousness" that constitutes the person.
      *   *Lockean Hook:* Locke says person is a "forensic" term. It's about accountability. If I can access the info to hold myself accountable, does it matter where it is?
