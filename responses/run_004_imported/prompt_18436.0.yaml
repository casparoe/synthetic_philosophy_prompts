  4.  **Analyze Locke's Text (Essay II.xxvii):**
      *   *Key Definition:* "Person" is a "forensic term." It concerns reward and punishment.
      *   *Key Mechanism:* "Sameness of consciousness."
      *   *Crucial Distinction:* Locke talks about *remembering* actions. "As far as any intelligent being can repeat the idea of any past action with the same consciousness it had of it at first... so far it is the same personal self."
      *   *The "Forgetfulness" Problem:* Locke admits we forget. He says this creates gaps in identity *for us*, but God (the ultimate judge) knows the continuity.
      *   *Internalism vs. Externalism:* Locke writes in a pre-digital, pre-EMT era. His metaphysics is substance-based (though he's agnostic about the *type* of substance). Consciousness is "annexed" to the substance.
      *   *Appropriation:* It's not just having the data; it's *owning* the action. "Concerned for it."

  5.  **Evaluate the Claims against the Text:**

      *   *Dana's Weakness:* Locke's "consciousness" is inherently phenomenological and internal. It's about *experience*. A notebook has no experience. Extending the *vehicle* of memory doesn't extend the *subject* of consciousness. Locke is worried about *who suffers the punishment*. If I read a notebook, do I *feel* the guilt of the past action? Locke seems to require a psychological connection that feels like identity.
      *   *User's Weakness:* Locke is functionalist about *personhood* (forensic). He separates person from substance. If the function of memory is to ground accountability, and the notebook grounds accountability as well as biology, why exclude it? Also, Locke admits memory is fallible and gappy.
      *   *The "Principled Line":* Locke distinguishes between *having an idea* and *being conscious that you had it*. The notebook stores ideas. It does not store the *consciousness of having had them*. This is the killer argument for the User.

