          *   Standard View: A (Boy) -> B (Officer) -> C (General). B remembers A. C remembers B. C doesn't remember A. Transitivity fails. C = B, B = A, but C != A.
          *   Dana's View: If the notebook bridges the gap (C reads notebook about A), does C remember A?
          *   Verdict: Reid's objection is about *logical transitivity of identity*, not storage capacity. Even with a notebook, if the *consciousness* isn't continuous, the Lockean criterion fails. The notebook provides *information*, not *conscious continuity*. So Reid's objection *still applies* to Dana.

