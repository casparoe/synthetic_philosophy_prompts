answer: |-
  This is a sophisticated problem, and your friend's skepticism is a useful foil because it represents the "common sense" realism that Hacking's entire project seeks to unsettle. To answer you, I need to select a category that is fluid enough to show the gears of the loop turning, but specific enough to avoid vague generalities.

  I propose we look at **Prolonged Grief Disorder (PGD)**.

  It was formally included in the *DSM-5-TR* in 2022 and the *ICD-11* shortly before that. It is quasi-psychiatric (sitting on the border of normal human emotion and pathology), highly contested, and fresh enough that the "textbook history" hasn't hardened. It offers a pristine example of looping because it medicalizes an experience (grief) that was previously considered a universal, non-pathological rite of passage.

  ### 1. Tracing the Loop: Prolonged Grief Disorder

  **The Classification (The First Strike)**
  Before PGD, persistent, debilitating grief was often colloquially called "complicated grief," but it lacked a specific diagnostic home. It was often subsumed under Major Depressive Disorder or Generalized Anxiety, which fit poorly. The new criteria for PGD specify a duration (at least 12 months for adults in the DSM, 6 months in the ICD) and a set of symptoms: identity disruption, marked sense of disbelief, avoidance of reminders, intense emotional pain.

  **The Reaction (People Change)**
  Once the category became available, it didn't just describe people; it offered them a new *agency*.
  *   **Self-Understanding:** A widower who felt "broken" because he wasn't "moving on" after two years could now reframe his suffering not as a personal failure of resilience, but as a treatable condition. This reduces shame but introduces medicalization.
  *   **Conduct:** This is where the loop tightens. Insurance companies began covering specific therapies (like Complicated Grief Therapy) only with a code. Suddenly, patients had an incentive to align their narratives with the criteria. A patient might emphasize "identity disruption" to a clinician to secure coverage, thereby rehearsing and solidifying that specific aspect of their experience over others.
  *   **Collective Organizing:** Advocacy groups formed not just to support the bereaved, but to *promote the diagnosis*. They lobbied for its inclusion in the DSM to legitimize their suffering. In doing so, they became stakeholders in the medicalization of grief.

  **The Feedback (The Category Changes)**
  The uptake of the diagnosis pressed back on the experts and institutions.
  *   **Criterion Negotiation:** The discrepancy between the ICD-11 (6 months) and DSM-5-TR (12 months) isn't just scientific; it's a reaction to cultural pushback. Critics argued that pathologizing grief before a year was an insult to human love. The DSM committee extended the timeline *in response* to the fear that the classification was creating a "kind" of person (the pathologized griever) too aggressively.
  *   **Pharmaceutical Pressure:** As the "kind" of person with PGD became visible, pharmaceutical companies began investigating drug interventions (previously, grief was treated with talk therapy or off-label antidepressants). The existence of the category creates a market, which incentivizes research that might biologicalize the condition further, potentially narrowing the criteria to fit drug trial protocols.
  *   **Cultural Resistance:** A counter-movement emerged (the "grief resistance"), arguing that PGD is a category error. This resistance forces clinicians to spend more time distinguishing "normal" from "disordered," effectively making the boundary of the diagnosis more porous and subjective than it was on paper.

  The loop is closed: The diagnosis created a legitimate identity for sufferers $\rightarrow$ sufferers organized to validate the diagnosis $\rightarrow$ this validation attracted market and institutional forces $\rightarrow$ those forces altered the criteria and treatment landscape $\rightarrow$ which changes how future sufferers understand their grief.

  ### 2. Addressing Your Friend's Objection

  Your friend argues that this is just "learning a new word for an old experience." This is the "Labeling Theory" objection, and it is distinct from Hacking's "Looping Effect." Here is the distinction you can use to defend your novel's thematic core.

  **Labeling vs. Looping**
  *   **Labeling (Your Friend's View):** Assumes the underlying reality is static. There is a pile of rocks; we decide to call some of them "granite." The rocks don't change. Similarly, there are people suffering from grief; we call it PGD. They feel relieved. The grief is the same; the name is new.
  *   **Looping (Hacking's View):** Assumes the underlying reality is *dynamic* because the classified objects are conscious agents. When you classify a human being, you give them a vocabulary to understand themselves, which changes how they act, which changes what they *are*.

  **The Test of Causality**
  If your friend is right, the behavior change is merely *accommodation*. If Hacking is right, the behavior change is *constitutive*.
  *   *Example:* If I learn the word "insomnia," I might sleep better because I'm less worried (Labeling).
  *   *Example:* If I am diagnosed with "Restless Leg Syndrome," I might begin to monitor my legs for twitching, notice sensations I previously ignored, and adopt a lifestyle of avoidance regarding caffeine and travel. My *experience* of my legs has changed, not just my worry. The classification has reached into my nervous system's attentional filter.

  In the case of PGD, if it were mere labeling, the grief would remain the same shape, just named. But we see that the *shape* of grief is changing. People are beginning to view the *duration* of grief as a metric of health. They are monitoring their "progress" against the 12-month benchmark. The classification has introduced a temporal metric into an experience that was previously timeless. That is not just a new word; it is a new technology of the self.

  **The "Interactive Kind"**
  Hacking's crucial insight is that "interactive kinds" create a space for agency. People can "work the ticket." A teenager diagnosed with PGD (if applicable) or an adult can choose to embrace the label to get resources, or reject it to maintain authenticity. This negotiation *itself* becomes part of the condition. There is no equivalent negotiation with quarks. Quarks do not read the DSM and decide to behave differently to fit the criteria. People do. That feedback mechanism is what makes it philosophically special.

  ### 3. Ontological Status: Made Up or Real?

  You asked for a view on whether PGD is "substantially made up" or "real and antecedent." Hacking would advise against this binary, and for the purposes of your novel, I suggest you adopt his stance of **Dynamic Nominalism**.

  **The Verdict:**
  The *suffering* is real and antecedent. The pain of losing a child or a spouse after a year is not invented by the DSM. However, the *kind of person* who is "a sufferer of Prolonged Grief Disorder" is made up.

  Before the classification, there were people who grieved for a long time. They were "widows," "mourners," "depressed," or "resilient." They were not "PGD patients." The classification draws a line through the continuum of human sorrow and says, "On this side is health, on this side is disorder."

  By drawing that line, it brings into existence a new population that can act in concert. It creates a "niche" in the social ecosystem.
  *   **Is it "just" made up?** No, because the biological and psychological correlates (cortisol levels, neural activation in pain centers) are being found. The body responds to the classification.
  *   **Is it "simply" found?** No, because the criteria (12 months vs. 6 months) are arbitrary decisions that determine who gets into the niche.

  **For Your Novel:**
  This nuance is gold for a character arc. Your protagonist shouldn't just ask, "Do I have this?" She should ask, "If I accept this, what kind of person does it make me?"

  If she accepts the diagnosis, she gains access to treatment and community (the "real" benefit), but she may begin to curate her grief to fit the symptoms (the "made up" cost). She might stop feeling guilty about her sadness, but start feeling guilty if she *isn't* sad enough to meet the criteria. She becomes a guardian of her own diagnosis.

  The "loop" in your novel isn't just that she changes because of the doctor. It's that she changes the diagnosis by living it. Perhaps she joins a support group that decides the 12-month mark is arbitrary, and they collectively push back against clinicians, forcing a change in how local therapists apply the criteria. She is not just a victim of the classification; she is a participant in its evolution.

  ### Summary for the Writer
  *   **The Case:** Prolonged Grief Disorder (PGD).
  *   **The Loop:** Diagnosis creates legitimacy $\rightarrow$ patients align narratives to criteria $\rightarrow$ institutions adjust criteria based on pushback/market $\rightarrow$ new experience of grief emerges.
  *   **The Friend's Objection:** Refute it by distinguishing *accommodation* (using a word) from *constitution* (the word changes the experience). The metric of time in grief is the smoking gun.
  *   **The Ontology:** The pain is real; the "patient" is made up. The two are inextricably linked.

  This approach allows you to treat the diagnosis with respect (it helps real people) without treating it as absolute truth (it shapes those people). That tension is where the novel lives.
