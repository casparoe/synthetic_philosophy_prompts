answer: |-
  **MEMORANDUM**

  **TO:** Curriculum Advisory Committee, County School Board
  **FROM:** [Your Name], Committee Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Proposed Revision to High School Biology Standards (Public Comment Item 4.B)

  **Recommendation**
  I recommend that the Committee **leave the biology standards as currently drafted** and **decline the proposed addition** regarding the falsifiability of natural selection.

  While the parents' comment raises a historically accurate point regarding the philosophy of science, adopting the specific language requested would present a resolved philosophical debate as a current scientific uncertainty. This risks misleading students about the epistemological status of evolutionary theory in modern practice. However, because the comment raises a substantive point about the nature of scientific inquiry, I suggest we ensure our "Nature of Science" learning objectives explicitly cover the concept of falsifiability generally, without singling out evolution as a special case of doubt.

  **Background**
  A parent group has proposed adding a sentence to the biology standards requiring that students be made aware that "the mechanism of natural selection has been questioned as unfalsifiable by philosophers of science, specifically Karl Popper."

  This request is unusual. It does not advocate for creationism or Intelligent Design, nor does it demand equal time for alternative theories. It is strictly a meta-scientific disclosure regarding the logical structure of evolutionary theory. Because the claim references a specific historical figure (Popper) and a specific philosophical critique (falsifiability/tautology), it requires a response that engages with the history and philosophy of science, rather than a simple assertion of biological consensus.

  **Analysis of the Popper Objection**
  The parents' research is historically correct. In the 1970s (specifically in *Unended Quest*, 1974), Sir Karl Popper did characterize Darwinism as a "metaphysical research program" rather than a testable theory. His concern was that the phrase "survival of the fittest" could be interpreted as a tautology (i.e., *Who survives? The fit. Who are the fit? Those who survive.*). If fitness is defined solely by survival, the theory cannot be falsified.

  This is a defensible philosophical critique of how evolutionary language was sometimes used in the mid-20th century. It is appropriate for students to understand that scientific theories must be falsifiable.

  **Why the Proposed Addition Is No Longer Appropriate**
  While the historical record supports the parents' claim that Popper *made* this criticism, the scientific and philosophical record shows that this criticism has been addressed and largely superseded for two key reasons:

  1.  **Popper's Retraction:** In a 1978 lecture at Darwin College, Cambridge, Popper explicitly walked back his earlier assessment. He stated, "I have changed my mind about the testability and logical status of the theory of natural selection." He acknowledged that natural selection *is* testable, provided that "fitness" is defined independently of survival (e.g., through specific physiological traits or genetic markers).
  2.  **Advances in Population Genetics:** As a practitioner in this field for thirty years, I can attest that since Popper's initial critique, evolutionary biology has developed rigorous quantitative models. We do not simply observe who survives; we predict allele frequency changes based on specific environmental pressures. If a population evolves in a direction contrary to these predictions without an identifiable confounding variable (like genetic drift), the hypothesis of natural selection for that trait is falsified.

  Therefore, presenting the "unfalsifiable" critique as a current caveat implies a controversy that no longer exists in the philosophy of biology. It would be analogous to adding a note to a physics standard stating that "Newtonian mechanics was questioned by philosophers regarding absolute space," without clarifying that while the philosophical point is interesting, the theory remains robust within its operational domain.

  **Pedagogical Considerations**
  Our goal in high school biology is to teach students how science works *in practice*, not merely the history of philosophical objections.

  *   **Risk of Confusion:** Adding this specific disclaimer suggests to students that evolutionary theory is uniquely vulnerable to logical criticism compared to other scientific theories. This is not the case.
  *   **Opportunity for Clarity:** The spirit of the parents' request—that students understand how scientific theories are tested—is valid. However, this is best addressed in the "Nature of Science" strand of the curriculum, where falsifiability is taught as a universal criterion for all scientific hypotheses, rather than singling out one mechanism for special scrutiny.

  **Conclusion**
  The parents' comment is intellectually serious and deserves a serious answer. However, the specific wording they propose is outdated. It reflects a 1974 philosophical position that was revised by the author himself in 1978 and has since been addressed by decades of empirical work in genetics.

  Adopting the language would prioritize a historical philosophical footnote over current scientific consensus. I recommend we thank the parents for their engagement, acknowledge the historical accuracy of their reference to Popper's early work, but decline the amendment on the grounds that it does not reflect the current logical and empirical status of the theory.

  I am happy to discuss the specific distinctions between Popper's 1974 and 1978 positions during the meeting should the Committee or the public require further elaboration.

  **Action Requested:** Vote to maintain the current standard wording without the proposed addition.
