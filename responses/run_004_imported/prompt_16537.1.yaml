      *   Did I solve the "scope" problem (neighbors vs. tenants)? Yes, via the subjection criterion.
      *   Did I avoid paternalism? Yes, by grounding it in the tenants' status as subjects of the rules, not beneficiaries of owner charity.

  8.  **Final Polish:** Ensure clear headings and logical flow. (Proceed to generate output based on this thought process.)
answer: |-
  This is a classic problem in political philosophy disguised as a condominium dispute. You are grappling with the tension between **property rights** (the owners' legal authority) and **political legitimacy** (the moral right to rule over those affected).

  Your intuition that the "contractual" answer is incomplete, but that the "all-affected" principle risks infinite expansion, is correct. To resolve this without begging the question, we need to distinguish between *being affected by* a decision and *being subject to* a regime of authority.

  Here is a breakdown of why the "you signed the lease" argument fails, why the "neighbors" objection doesn't invalidate the tenants' claim, and a principled way to define the boundary of who deserves a voice.

  ### 1. Why "You Signed the Lease" Is Not a Complete Answer

  The argument that tenants consented to the governance structure by signing a lease relies on a libertarian view of contract that rarely holds up in housing markets.

  *   **Adhesion Contracts:** Residential leases are typically contracts of adhesion. Tenants do not negotiate the condo bylaws; they inherit them. To say they "agreed" to the governance structure is like saying a citizen "agreed" to the tax code by choosing to be born in a specific country.
  *   **The "Exit" Fallacy:** The claim that tenants are "free to leave" ignores transaction costs. Moving is expensive, disruptive, and time-consuming. In a tight university housing market (which you imply exists), the cost of exit is high enough to create a form of "lock-in." When exit is costly, voice becomes a moral necessity.
  *   **The Hotel Analogy:** The colleague who compared tenants to hotel guests is making a category error. A hotel guest purchases a short-term service with zero expectation of stability or governance. A residential tenant purchases a *home* for a significant duration (usually a year). They are not consuming a service; they are inhabiting a jurisdiction.

  ### 2. Solving the Scope Problem: Tenants vs. Neighbors

  Your third colleague raises the strongest objection: If "affected interests" grant a right to a voice, where does it stop? Why not the neighbors? Why not the university?

  The principled distinction lies in the difference between **externality** and **subjection**.

  *   **Neighbors (Externality):** The residents of the next building suffer *externalities* (noise, courtyard crowding). However, they are not *subject* to your condominium's authority. They do not have to follow your bylaws, they do not pay your fees, and your board cannot fine them or evict them. Their relationship to your building is tort-based (nuisance), not political.
  *   **Tenants (Subjection):** Tenants are *subject* to the coercive power of the association. Through the lease, they are bound by the very rules the owners are voting on. They must adhere to quiet hours, occupancy limits, and common area usage rules. They live under the authority of the board.

  **The Principle:** *Those who are subject to the coercive authority of a governing body have a stronger claim to representation than those who merely suffer side effects from its decisions.*

  This is the "No Taxation Without Representation" argument. Tenants "pay taxes" in the form of compliance with rules that dictate how they can live in their homes. Owners who live elsewhere do not bear the burden of compliance, only the burden of financial risk. Therefore, the people bearing the burden of *compliance* (tenants) have a claim to voice that neighbors (who bear only the burden of *nuisance*) do not.

  ### 3. Voice vs. Vote

  You asked if tenants are owed a *vote*. This is legally difficult (changing bylaws is hard) and philosophically debatable. Owners bear the financial risk (property value fluctuations, special assessments). In corporate theory, risk-bearing justifies control.

  However, there is a middle ground between "total control" and "no say." Tenants are owed a **guaranteed voice**, not necessarily a vote.

  *   **Procedural Justice:** Even if the owners retain the final vote, a fair process requires that those subject to the rules be consulted before the rules are changed.
  *   **Information Asymmetry:** Absentee owners do not know if the elevators are actually wearing out or if the noise is real. They are voting on data provided by the board. Tenants possess the "local knowledge" (to use James C. Scott's term) required to make an informed decision. Ignoring them isn't just unfair; it leads to bad governance.

  ### 4. Avoiding Paternalism

  You worried about framing this as owners "generously deciding" how generous to be. That would indeed be paternalistic. To avoid this, you must frame the tenants' voice not as a *privilege granted by owners*, but as a *requirement of legitimate governance*.

  If the Condo Association functions as a mini-government (which it does, levying fees and making rules), it requires legitimacy to function smoothly. A rule passed without the input of the residents is likely to be resisted, ignored, or create resentment, lowering the quality of life for everyone (including the investors, via turnover and conflict).

  Therefore, advocating for tenant input is not charity; it is in the rational self-interest of the association's stability.

  ### Summary of the Principled Stand

  You can articulate your position to your colleagues using this framework:

  1.  **Rejection of Pure Contract:** The lease is not a sufficient moral shield because tenants cannot negotiate bylaws and face high exit costs.
  2.  **Rejection of Pure "Affected Interests":** Neighbors are affected by *consequences*, but tenants are subject to *authority*. The claim to voice arises from subjection to rules, not just exposure to noise.
  3.  **The Claim:** Tenants do not necessarily need a *vote* (since they don't bear financial risk), but they are owed a formal *voice* (a right to be heard and have their local knowledge considered) because they are the ones who must live under the coercive power of the rules.

  **The Verdict:**
  It is genuinely unfair for a policy regarding *habitability* (noise, security, elevator use) to be decided entirely by people who do not inhabit the space, without a mechanism for the inhabitants to testify. It treats the building purely as a financial asset rather than a community of residence.

  You don't need to argue that tenants should own the building. You only need to argue that **governance legitimacy requires the consent of the governed,** and in a condominium, the "governed" includes anyone legally bound to follow the bylaws, regardless of whether they hold the title.
