      *   *Refining the Neighbor Distinction:* The key is *subjection*. Neighbors suffer noise, but they don't have to ask permission to paint their walls or keep a pet. Tenants do (via the lease which incorporates bylaws). This is the "No Taxation Without Representation" angle.
      *   *Refining the Investor Angle:* Acknowledge that owners *do* have a stake (property value). It's not that they have *no* right to decide, but that their right isn't *exclusive* when it comes to habitability issues.

  6.  **Drafting the Content (incorporating philosophical concepts):**

