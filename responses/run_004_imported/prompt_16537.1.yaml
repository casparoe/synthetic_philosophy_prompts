      *   Keep the tone respectful and analytical (matching the user's philosophy background).
      *   Avoid taking a hard political stance (e.g., "abolish private property") but focus on the specific governance dilemma.

  7.  **Final Review against User Prompt:**

      *   Did I answer if it's unfair? Yes.
