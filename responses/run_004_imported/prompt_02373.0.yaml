answer: |-
  **The Drunk and the Discounter: Aristotle, Hyperbolic Discounting, and the Structure of Weakness**

  The problem of *akrasia*—acting against one's better judgment—is as persistent in moral psychology as it is in everyday experience. Why do we eat the cake when we are dieting, or sleep in when we vowed to rise? In *Nicomachean Ethics* VII, Aristotle attempts to dissolve the Socratic paradox (that no one willingly does evil) by distinguishing between possessing knowledge and exercising it. Two millennia later, behavioral economics offers a formal descendant of this puzzle in the model of hyperbolic discounting, which describes how agents systematically reverse their preferences as rewards draw near in time. While these two frameworks appear to describe the same phenomenon of self-defeating choice, a closer examination reveals a significant divergence. Hyperbolic discounting provides a compelling mechanism for the *force* of temptation, corresponding closely to Aristotle's category of impetuosity, but it fails to capture the normative structure of weakness proper. A defensible account of genuine weakness of will requires the Aristotelian framework, specifically as refined by contemporary philosophers like Richard Holton, to supply the normative context that the discounting model lacks. Mere temporal preference reversal is not *akrasia*; it becomes *akrasia* only when it involves the violation of a standing resolution in the face of a judgment that one ought not to violate it.

  To understand the mismatch, we must first clarify Aristotle's architecture. Aristotle accepts the Socratic intuition that action follows judgment, but he argues that in the *akratic* agent, the relevant judgment is suppressed rather than erased. Using the analogy of a drunk man reciting the verses of Empedocles, Aristotle suggests the agent possesses the universal premise ("Sweet things are not to be tasted") but fails to activate it. In the technical language of the practical syllogism, the agent has the universal prohibition, but appetite seizes upon the particular premise ("This thing here is sweet") and drives the action while the universal remains inert. Crucially, Aristotle distinguishes two forms of this failure. *Impetuosity* (*propeteia*) occurs when passion overwhelms the agent before deliberation is complete; the agent acts straight from feeling. *Weakness* (*astheneia*), by contrast, involves deliberation and the formation of a conclusion, which is subsequently abandoned under the pull of passion. In both cases, however, there is a cognitive element: the agent is acting while in possession (however dormant) of a correct normative standard.

  Contemporary decision theory, specifically the hyperbolic discounting model pioneered by George Ainslie, offers a descriptive account of similar behavior. Agents discount the value of future rewards non-linearly; the curve is steep for immediate delays and flat for distant ones. This leads to preference reversals: an agent may prefer $110 in thirty-one days over $100 in thirty days, but when the thirty days have passed, she prefers $100 today over $110 tomorrow. This model distinguishes between "naive" agents, who do not foresee these reversals, and "sophisticated" agents, who anticipate them and may attempt pre-commitment strategies. On the surface, this looks like a mathematical formalization of Aristotle's drunk. The "sophisticated" agent knows the long-term plan is better (the universal premise) but succumbs to the spike in value of the immediate reward (the particular premise).

  However, equating the two stories obscures a fundamental difference in what is being explained. Hyperbolic discounting describes a shift in *valuation*, whereas Aristotle describes a conflict between *valuation* and *judgment*. In the discounting model, at the moment of choice, the immediate reward literally *is* more valuable to the agent than the delayed one. If preference determines value, the agent is simply doing what she most wants to do. There is no contradiction in her agency at the moment of action. For Aristotle, however, *akrasia* requires that the agent acts against what she judges to be best *at the time of acting*. If the discounting model implies that the agent's judgment of "best" shifts along with her preferences, then there is no *akrasia*, only inconsistency. If the agent truly judges the long-term good to be best even while choosing the short-term good, the discounting model alone cannot explain how that judgment persists alongside the contrary choice.

  This divergence becomes sharpest when we apply Richard Holton's critique. Holton argues that weakness of will is not merely acting against a judgment of what is best, but specifically the failure to maintain a resolution one has formed. The discounting model explains why a resolution is *tempting* to break—the immediate utility spikes—but it does not explain the *breaking* as a distinctive volitional failure. A naive discounter simply rides the wave of changing preferences; she forms no resolution to resist the shift. A sophisticated discounter might form a resolution, but the model treats the breaking of that resolution as just another preference maximization. For Holton, and for Aristotle in the case of *astheneia*, the moral psychological weight lies in the abandonment of the resolution itself.

  Consequently, the hyperbolic discounting model corresponds much more closely to Aristotle's *impetuosity* than to *weakness proper*. In impetuosity, the agent is swept away by passion before the universal premise can be fully integrated into the decision. Similarly, the naive hyperbolic discounter is swept away by the temporal proximity of the reward without the mediation of a prior commitment. The "spike" in value functions like the Aristotelian appetite capturing the particular premise: it bypasses the deliberative process. However, the discounting model struggles to account for *astheneia*. In weakness proper, the agent deliberates, concludes, and resolves, yet still fails. A pure discounting model suggests that if the agent truly resolved, she would have factored the future spike into her current utility function (as the sophisticated agent does). If she fails anyway, it is not because her preferences reversed—that is assumed by the model—but because she failed to bind her future self. The discounting model explains the *pressure* on the resolution, but not the *capitulation*.

  Therefore, neither framework is sufficient on its own. The discounting model is scientifically robust but normatively thin; it explains the mechanics of temptation but not the failure of agency. Aristotle's account is normatively rich but psychologically vague; "clouded knowledge" is a metaphor, not a mechanism. To arrive at a defensible account of genuine weakness of will, we must prioritize the Aristotelian framework while utilizing the discounting model as a subordinate explanation of the psychological force involved.

  Genuine *akrasia* requires more than temporal preference reversal. A preference reversal is a necessary condition for the kind of temptation Aristotle describes, but it is not sufficient for *akrasia*. For an episode of temporal preference reversal to count as Aristotelian *akrasia*, it must involve three additional elements. First, there must be a standing normative judgment or resolution that contradicts the immediate preference (the universal premise). Second, the agent must retain access to this judgment at the moment of action, even if it is not the driving force of the action (the "drunk reciting Empedocles" condition). Third, the action must be experienced by the agent as a violation of that judgment, not merely as a change of mind.

  If we accept this synthesis, we see that the "sophisticated" discounter who fails to pre-commit is the closest modern analogue to the *akratic* agent, but only if she views her failure as a violation of a resolution. If she simply accepts her changing preferences as updates to her utility function, she is not weak-willed; she is merely time-inconsistent. True weakness of will arises when the agent recognizes the discounting curve as a distortion to be resisted, forms a resolution to resist it, and then allows the immediate spike in value to override that resolution.

  In conclusion, while hyperbolic discounting provides the best contemporary causal explanation for why the "particular premise" of appetite exerts such force, it cannot replace Aristotle's normative account of *akrasia*. Discounting explains the gravity of the temptation; Aristotle explains the fall. The two frameworks do not pick out the exact same phenomenon: discounting picks out preference inconsistency, while Aristotle picks out a failure of rational agency. To capture genuine weakness of will, we must embed the mechanism of discounting within the Aristotelian structure of the practical syllogism, augmented by Holton's emphasis on resolution. We are not merely slaves to a time-inconsistent utility curve; we are agents who know the curve is there, vow to steer around it, and yet, like Aristotle's drunk, find ourselves reciting the right principles while steering directly into the wall.
