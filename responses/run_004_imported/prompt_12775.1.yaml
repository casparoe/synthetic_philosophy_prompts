answer: |-
  This is a profound and under-examined tension in the architecture of logical empiricism. You have correctly identified the fault line: Carnap's semantic verificationism seemingly disarms the very normative language required to motivate the political project he and the Vienna Circle championed. If the "scientific world-conception" is meant to be a tool for social liberation and rational planning, but the language of liberation and planning is semantically void of truth-value, the Circle risks political impotence or hypocrisy.

  To answer your specific question: **Carnap attempts to keep his engagement on the "technical" side of the means-ends line, but the stability of that division relies on a sociological assumption about human ends that his semantics cannot justify.**

  Here is a working-through of that tension, structured by the strategies Carnap employed to reconcile his non-cognitivism with his socialism.

  ### 1. The Semantic Constraint: Normativity as Volition
  In *Philosophy and Logical Syntax* (1935), Carnap is explicit. A statement like "Killing is wrong" is not a statement about the world; it is a command in disguise ("Do not kill") or an expression of feeling. It belongs to the realm of *volition*, not *knowledge*.

  For Carnap, this creates a strict boundary. Science (including social science) deals with the *given* and the *derivable*. Politics deals with the *willed*. If Carnap argues for socialism, he cannot argue that socialism is "true" or "objectively good" in the same way he argues that "water is H₂O." To do so would be to commit a category mistake, engaging in the very metaphysics he sought to eradicate.

  ### 2. The Means-Ends Rationality (The Weberian Shield)
  The primary principled way Carnap attempts to carve off his political engagement is by adopting a Weberian instrumental rationality. This is the "technical" defense you alluded to.

  *   **The Argument:** Science cannot tell us *what* to value (ends), but it is the sole arbiter of *how* to achieve what we value (means).
  *   **The Application:** Carnap does not argue that "Socialism is the Moral Truth." He argues that, *given* certain widely shared human desires (security, reduction of suffering, material well-being), a planned economy is a more *efficient* causal mechanism for achieving those desires than laissez-faire capitalism.
  *   **The Status of the Claim:** Under this model, the claim "Planning reduces unemployment more effectively than market correction" is a cognitive, verifiable hypothesis. It falls within unified science. Therefore, Carnap can advocate for planning *as a technician*, not as a prophet.

  **The Weakness:** This strategy only works if the "ends" are stable and universally shared. If the capitalist argues, "I value individual liberty over material security," the scientist Carnap has no semantic ground to say the capitalist is *wrong*, only that they have different volitions. Carnap's ability to argue *for* planning over laissez-faire presupposes that the "socialist ends" (equality, security) are the default rational position, or at least the position shared by the audience he is addressing. His semantics cannot license that preference; it must be imported from outside the system (e.g., from the German Youth Movement's ethos of community).

  ### 3. The Politics of Method: Anti-Metaphysics as Political Action
  There is a second, more subtle layer where Carnap believes his scientific stance licenses political engagement without violating his semantics. This involves the 1929 Manifesto's claim that the scientific world-conception serves "life."

  Carnap viewed metaphysics not just as nonsense, but as *dangerous* nonsense. He observed that metaphysical concepts (Fate, Providence, the organic State, Natural Law) were frequently used to legitimize authoritarianism and the status quo.
  *   **The Move:** Carnap shifts the political battle from *normative claims* to *methodological claims*.
  *   **The Justification:** He is not arguing for socialism directly; he is arguing for *clarity*. By eliminating metaphysical pseudo-statements, he removes the intellectual props of reactionary politics.
  *   **The Entitlement:** He is entitled to do this because the *logic of science* is a tool for clarification. If clearing away metaphysics tends to correlate with progressive politics (as the Circle believed it did), then practicing logic *is* a political act, even if the propositions of logic are value-neutral.

  In this sense, Carnap argues for planning not because it is "Good," but because it is *intelligible*. Laissez-faire economics often relied on metaphysical notions of "invisible hands" or "natural market laws" which, to a logical empiricist, looked suspiciously like theological predestination. Planning, by contrast, treats the economy as a human construct subject to human calculation. Advocating for the *treatability* of social problems as technical problems is a cognitive claim, not a normative one.

  ### 4. The Neurathian Pressure and the Blurring of the Line
  This is where the tension becomes most acute, specifically regarding Otto Neurath. Neurath was less scrupulous than Carnap about the fact/value distinction. Neurath's "utopian" planning involved making decisions about the future quality of life that inevitably smuggled in normative content under the guise of "optimization."

  Carnap was aware of this. In his later work (post-*Logical Syntax*), he moves toward the **Principle of Tolerance**. We choose linguistic frameworks based on pragmatic utility.
  *   **The Shift:** Political systems can be viewed as "frameworks." We do not ask if the Socialist Framework is "True." We ask if it is "Fruitful."
  *   **The Problem:** "Fruitful for what?" To answer this, one must specify goals. If the goals are normative, we are back to square one.

  Carnap tries to solve this by appealing to a form of **empirical humanism**. He assumes that certain biological and psychological facts about humans (the desire to avoid pain, the need for cooperation) are verifiable. If socialism aligns better with these verifiable facts than capitalism does, then the preference for socialism is grounded in *anthropological data*, not *ethical intuition*.

  However, secondary literature (e.g., by Thomas Uebel and George Reisch) suggests this is where Carnap's practice exceeds his semantics. To get from "humans feel pain" to "we ought to organize society to minimize pain" requires a bridge principle that is itself normative. Carnap treats this bridge principle as if it were a shared volition so universal it functions *like* a fact, but strictly speaking, his verificationism cannot validate it.

  ### 5. Verdict: Does Practice Exceed Semantics?
  To answer your concluding question directly: **Yes, his practice commits him to more than his stated semantics can license, but he attempts to minimize the excess via a sociological bet.**

  1.  **The Technical Carve-out:** Carnap is principled in restricting his *scientific* claims to means-ends efficiency. He does not claim socialism is morally obligatory in the language of science.
  2.  **The Hidden Premise:** However, his *advocacy* relies on the premise that the "ends" of socialism (security, equality) are the rational default for anyone who has abandoned metaphysics. He treats the rejection of metaphysics as entailing a rejection of conservative hierarchy.
  3.  **The Decisionist Gap:** Ultimately, Carnap rests on a decisionist foundation. He chooses the framework of "scientific humanism." He cannot prove this framework is the "right" one, only that it is the one he (and his circle) find most useful for navigating life.

  **Conclusion:**
  Carnap is entitled to argue for planning *conditionally*: "If we want X, planning is better than Y." He is *not* entitled, by his own semantics, to argue that we *should* want X. His political engagement remains consistent with his semantics only if viewed as an expression of volition (which he admits is non-cognitive) combined with technical advice on how to realize that volition.

  The tension you identified arises because Carnap wanted the *authority* of science to bolster the *volition* of socialism. He wanted the "scientific world-conception" to be neutral enough to be true, but loaded enough to be progressive. In the end, the neutrality of the semantics undermines the necessity of the politics. He can show that socialism is *rational* (in the means-ends sense), but he cannot show it is *binding*, leaving his political commitment resting on the very expressive, non-cognitive attitudes his philosophy sought to marginalize from the realm of knowledge.
