answer: |-
  This is a fantastic passage to use, and your instinct to pair it with Laudan and Worrall is pedagogically sound. In fact, John Worrall explicitly cites this very passage in his seminal 1989 paper ("Structural Realism: The Best of Both Worlds?") as the historical inspiration for Epistemic Structural Realism (ESR).

  However, your hesitation is philosophically astute. There is a tension between Poincaré's *motivation* and Worrall's *conclusion*. Here is the untangling you need for your seminar, followed by a discussion question.

  ### 1. Is Poincaré a Structural Realist or a Conventionalist?
  **Short answer:** He is a Conventionalist who makes a Structuralist *argument*.

  Poincaré's broader philosophy is conventionalist. When he says the aim of theory is to "coordinate physical laws" and that it matters little if the ether "really exists," he is denying that we have access to mind-independent ontology. For Poincaré, the survival of the equations doesn't necessarily mean the structure corresponds to reality; it means the *convenient framework* has been retained.

  **The Worrall Pivot:** Worrall takes Poincaré's diagnostic observation (ontology changes, structure stays) but flips the normative conclusion.
  *   **Poincaré:** Structure stays, ontology goes $\rightarrow$ Therefore, don't be a realist about *either*; theories are just tools.
  *   **Worrall:** Structure stays, ontology goes $\rightarrow$ Therefore, we *should* be realists about the structure, even if not the ontology.

  **Verdict for your class:** It is fair to call this the "seed" of structural realism, but you must clarify that Poincaré planted the seed to grow an instrumentalist tree. Worrall grafted a realist branch onto it. If you present Poincaré as a full-blown structural realist, you risk conflating *structural continuity* with *structural truth*. Poincaré commits to the former, not necessarily the latter.

  ### 2. Is Fresnel-to-Maxwell a Fair Case Study?
  **Short answer:** Yes, it is the strongest historical case available.

  You are right to worry about cases like phlogiston or caloric, where the mathematical structure often dissolves or is merely analogous. Fresnel-to-Maxwell is different.
  *   **What was discarded:** The mechanical properties of the luminiferous ether (its density, elasticity, the idea that light is a vibration *of* a substance).
  *   **What was retained:** The wave equation, the transverse nature of the waves, the mathematical relations governing diffraction and interference.

  Maxwell didn't just find a new analogy; he showed that the *same mathematical relations* governed electromagnetism. This makes it a much stronger case for structural continuity than the phlogiston-to-oxygen transition. It supports the idea that the *relations* were "latched onto" by Fresnel, even if his account of *what was related* (the ether) was wrong.

  ### 3. Untangling the "Truth" of Equations
  When Poincaré says the equations "will remain true," he likely means they will remain **empirically adequate** and **mathematically coherent**, not that they correspond to the "true nature of things."

  This is the crux of the debate for your students. If the equations survive, is it because:
  1.  They are merely the most convenient language for organizing phenomena (Poincaré/Instrumentalism)?
  2.  They successfully track the mind-independent structure of the world (Worrall/Structural Realism)?
  3.  They are just the lucky survivors of a history full of errors (Laudan/Pessimistic Meta-Induction)?

  ### Discussion Question for the Class

  Here is a question designed to force them to choose between the Instrumentalist and Structural Realist reading of the text:

  > "Poincaré argues that while the *nature* of the ether may be false, the *relations* expressed in the equations remain true. Worrall uses this to argue for Structural Realism: we should believe the structure is real, even if the entities are not.
  >
  > **But consider Poincaré's claim that theories are merely 'convenient coordinations.' If the equations are just convenient tools for organizing phenomena, does their survival through theory change actually provide evidence that they track reality (as Worrall claims), or does it simply show that we are stubbornly attached to useful mathematical languages (as Laudan might argue)? In other words, does structural continuity justify realism, or does it just confirm conventionalism?**"

  ### Why this works:
  *   It forces them to grapple with the definition of "truth" in the passage.
  *   It pits Worrall's optimism against Laudan's pessimism using Poincaré as the battleground.
  *   It highlights the gap between Poincaré's actual philosophy (conventionalism) and how he is appropriated by realists (structuralism).

  This setup should give you a lively 45 minutes of seminar discussion! Good luck with the session.
