answer: |-
  The observation glass was cold against Elias's forehead. On the other side, Kael sat on the synthetic grass, manipulating a set of colored tiles. Kael was a bonobo, ostensibly, though the genetic enhancements from the early program were written into every line of his posture. He was five years old, chronologically, but his eyes held a weary depth that unsettled the junior staff.

  Elias watched as Kael picked up a blue tile. He didn't eat it. He didn't throw it. He walked to the corner of the enclosure, dug a small hole in the substrate with a stick, buried the tile, and covered it carefully with leaves. Then he sat back down.

  "He's saving it," Vance said from behind him, her voice clipped. She held a tablet displaying the neural maps of three hundred human children. "For tomorrow. He knows tomorrow exists."

  "Or he's hoarding," Elias said, though the words felt thin. "Conditioned behavior."

  "We tested for conditioning last week. We removed the reward mechanism. He still buried the tile. He still went back for it six hours later." Vance stepped up beside him, not looking at the ape, but at the data. "The serum we can extract from his modified hippocampus cures the degeneration. All three hundred of them. Today."

  Elias turned away from the glass. The lab was sterile, white, humming with the quiet violence of filtration systems. "Nozick says we can't use a person as a means," he said. "Even for the greater good. That's the side constraint. It's not about the math. It's about the boundary."

  "Kael isn't a person, Elias. He's a subject."

  "Nozick wasn't sure either," Elias muttered. He walked to the desk where the authorization form lay. The pen rested on the clipboard, a black plastic gavel. "He said the constraint applies to beings who can shape their lives according to an overall plan. He drew the line at humans, but he admitted the line was shaky. He said maybe animals count for something, but not everything. They enter the utilitarian calculus. Their suffering weighs, but it can be outweighed."

  "And this is the weighing," Vance said. "Three hundred lives versus one bonobo."

  "But what if he's on the wrong side of the line?" Elias looked back through the glass. Kael was now arranging stones in a row. Not a pattern Elias recognized. A path? A sequence? "If he has a plan... if he conceives of himself moving through time... then he's not just a container for suffering. He's a subject of a life. If he's a subject of a life, the constraint holds. You can't kill him to save the three hundred. You can't use him."

  Vance sighed, the sound of patience fraying. "He buries tiles, Elias. He doesn't write memoirs. He doesn't ask about death. He doesn't wonder why he's here."

  "How do you know?"

  "Because he's a bonobo."

  "That's the species line," Elias said, his voice rising slightly. "Nozick tried to use capacity, not species. But capacity is a gradient. It's a slope. Where do you put the cut-off? If a human child can't plan five years ahead, do they lose the constraint? If Kael plans five minutes ahead, does he gain it?"

  Vance tapped the tablet. "The children are dying. Their capacity is being erased. Kael's capacity is... debatable. We have to draw the line somewhere, or we do nothing."

  Elias looked at Kael again. The bonobo had stopped arranging stones. He was looking at the glass. He wasn't looking *through* it, not exactly. He was looking at the reflection of his own hand against the transparent barrier. He touched the glass, then touched his own chest.

  It was a gesture Elias had seen in human toddlers. *Here. Me.*

  But was it self-awareness, or just mimicry? Nozick's "overall plan" required more than recognition. It required a narrative arc. Did Kael have a future he was investing in? The buried tile suggested yes. The stone path suggested intention. But was it a *life* plan, or just a solution to immediate boredom?

  The uncertainty was a physical weight in Elias's stomach. If he signed, and Kael was the kind of being who possessed inviolable rights, Elias was committing a murder that no amount of benefit could justify. It would be a violation of the universe's moral architecture. But if he didn't sign, and Kael was merely a complex machine of flesh and instinct, Elias was letting three hundred children dissolve into nothingness for the sake of a philosophical hesitation.

  The species line was arbitrary. The capacity line was invisible.

  "He's waiting," Vance said softly.

  Kael had moved to the door of the enclosure. He sat there, hands folded in his lap, watching them. He wasn't begging. He wasn't agitated. He looked like he was waiting for a meeting to start.

  Elias picked up the pen. It felt heavy, disproportionate to its size.

  "If I sign," Elias said, "I am saying that the tile doesn't matter. That the stones don't matter. That whatever is happening in his head is less than the sum of what's happening in theirs."

  "You're saying that certainty is impossible," Vance corrected. "And that in the face of impossibility, we must choose the known quantity. The children are human. Their rights are secure. Kael's are... theoretical."

  "Nozick said the constraints are absolute. They aren't supposed to be weighed."

  "Then prove he falls under them."

  Elias looked at the form. *Subject 89. Termination for Extraction.* He looked at Kael. The bonobo tilted his head, a sharp, birdlike motion, then reached into the fur of his own arm and pulled out a small thorn he'd been carrying. He held it up, examining it, then placed it carefully on the stone path he had built. Adding it to the plan.

  It was such a small thing. A thorn added to a line of stones. But it implied a future where the thorn needed to be placed. It implied a design.

  Elias lowered the pen to the paper. The tip touched the surface. The ink bloomed, a tiny black wound.

  He stopped.

  He couldn't know. He could never know. The gradient of consciousness offered no cliff edge, only a slow, foggy decline where the shouts of the human world faded into the silence of the beast, and somewhere in the mist, Kael was standing, holding a thorn, waiting to see if he was a who or a what.

  Elias lifted the pen. The ink was wet, unfinished.

  "I need more time," Elias said.

  "We don't have it," Vance replied.

  Elias didn't look at her. He kept his eyes on the ape, on the ambiguous architecture of the stones, on the buried tile waiting for a tomorrow that might not come. He held the pen above the paper, suspended in the air, unable to write, unable to put it down, trapped in the space between the constraint and the calculation.
