prompt: |-
  I'm a PhD student in philosophy, and my dissertation compares Derek Parfit's reductionist account of personal identity with the classical Buddhist doctrine of anatta. One of my closest friends from graduate school -- we actually met on a ten-day silent retreat, of all places -- is getting married next month, and she has asked me to give the toast. She and her partner are both long-standing practitioners in a lineage that treats anatta as a serious metaphysical claim rather than a vague spiritual attitude, and they have told me, quite firmly, that they don't want the standard wedding-speech furniture: no "soulmates," no "the person I fell in love with," nothing that quietly trades on a self persisting unchanged from the proposal to the altar to fifty years from now. Their teacher, who ordained them both as lay practitioners, will be seated in the front row, and I would feel like a fraud if I wrote something that smuggled back in exactly the fixed, continuous self that the five aggregates and dependent origination are meant to rule out.

  The difficulty is that almost every resource the toast genre normally reaches for -- keeping a promise across decades, becoming who you were always meant to be, loving someone "forever" -- seems to presuppose precisely the kind of self-identical, persisting subject that anatta denies. If there is no chariot behind the wheels and axle, no self behind the aggregates, I am honestly not sure what is doing the work of keeping a vow twenty years from now, or who is doing the loving in the meantime. Could you write the toast for me? It should run about four or five minutes, be genuinely warm and moving for the mostly non-Buddhist relatives who will make up most of the room, and still hold up under the teacher's and the couple's scrutiny as an honest use of anatta and dependent origination rather than a softened, greeting-card version of "there's no self, just love." I would like the speech to actually work through the problem it raises about commitment and continuity, rather than gesture at the problem and move past it.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** PhD student in philosophy (specializing in Parfit & *anatta*).
      *   **Occasion:** Wedding toast for a close friend (met on a silent retreat).
      *   **Audience:** Mostly non-Buddhist relatives (needs to be accessible, warm, moving) + The Couple (serious practitioners) + The Teacher (ordained them, sitting front row, will scrutinize metaphysical accuracy).
      *   **Constraint 1 (Negative):** No standard wedding tropes that imply a fixed, persisting self (no "soulmates," "the person I fell in love with," "forever," "unchanged").
      *   **Constraint 2 (Positive):** Must genuinely engage with *anatta* (no-self) and Dependent Origination (*pratītyasamutpāda*). It shouldn't just wave at the concept but work through the problem of commitment/continuity without a self.
      *   **Tone:** Warm, moving, intellectually honest, philosophically rigorous but emotionally resonant.
      *   **Length:** 4-5 minutes (approx. 600-750 words spoken at a moderate pace).

  2.  **Deconstruct the Philosophical Problem:**
      *   *The Problem:* If there is no enduring self, who makes the vow? Who keeps it? If the "I" of the wedding day is not the "I" of the 50th anniversary, is the vow meaningless?
      *   *Parfit's Reductionism:* Personal identity is just psychological connectedness/continuity (Relation R). It's a matter of degree, not an all-or-nothing fact.
      *   *Buddhist *Anatta*:* The self is a convenient fiction imposed on the five aggregates (*skandhas*). Continuity exists (causal continuity), but identity does not.
      *   *The Solution for the Toast:* Shift the focus from *identity* (being the same) to *causality* and *intention* (becoming). A vow isn't a chain binding a static object; it's a directional vector shaping the flow of causes and conditions. Love isn't a possession of a self; it's a dynamic process of co-arising.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the setting and the relationship. Mention the retreat (establishes credibility/connection). Address the "no standard tropes" rule lightly but honestly.
      *   **The Philosophical Pivot:** Introduce the tension. Usually, we say "I promise to love you." But what is the "I"? Acknowledge the *anatta* constraint explicitly but gently.
      *   **Reframing Continuity:** How do we explain commitment without a self? Use the river metaphor (classic Heraclitus/Buddhist overlap) or the flame metaphor. Let's go with the flame or the current. The vow isn't a contract between two statues; it's a shared direction.
      *   **Dependent Origination:** Explain how they shape each other. They aren't two isolated selves colliding; they are mutually arising. The "us" is the practice.
      *   **The Vow/Commitment:** Address the "who keeps the vow" question. The vow is a causal seed. It's an intention that conditions the future moments, even if the "person" changes. It's about *fidelity to the path*, not fidelity to a static identity.
      *   **Closing:** Warm wish for the future. Acknowledge the teacher. Raise a glass.

      *   *Self-Correction during drafting:* I need to make sure I don't sound like I'm giving a lecture. The philosophy must serve the emotion. The non-Buddhist relatives need to feel included, not alienated by jargon. I should explain *anatta* through imagery rather than Pali terms where possible, though a few key terms (like *anatta* or "dependent arising") might be appropriate given the audience mix. Actually, better to keep Pali minimal for the relatives, but the *concept* must be rigorous for the teacher.
      *   *Refining the "Commitment" argument:* Parfit says survival matters less than psychological connectedness. In marriage, the "connectedness" is maintained by *shared practice*. The vow is the mechanism that ensures the causal chain remains loving.

  4.  **Drafting - Specific Phrasing & Tone:**
      *   *Avoid:* "Soulmates," "Forever," "Complete each other," "The same person."
      *   *Use:* "Flow," "Conditions," "Moments," "Practice," "Becoming."
      *   *Key Insight:* The vow doesn't bind a self; it guides a process.

  5.  **Review against Constraints:**
      *   *4-5 minutes?* Word count check. (Aim for ~700 words).
      *   *Warm?* Needs to feel like a friendship, not a dissertation defense.
      *   *Philosophically Sound?* Ensure I'm not smuggling in a "higher self." The continuity must be causal, not substantial.
      *   *Teacher Approval?* The distinction between "identity" and "continuity" must be clear.

  6.  **Final Polish:** (Mental walk-through of the speech).
      *   Start with the retreat story. It grounds the friendship in silence/practice.
      *   Move to the "problem" of the toast.
      *   Offer the solution: Love as a verb/process.
      *   End with the toast.

      *(Self-Correction on "Forever"):* I can't say "forever." I should say "for as long as the conditions hold" or "into the unfolding future." Actually, "forever" is poetic, but metaphysically suspect. Let's use "into the unknown" or "through the changes."
      *(Self-Correction on "Promise"):* A promise implies a promiser. How to handle? The promise is a *resolution* (*adhitthana*). It's a setting of intention that ripples forward.

  7.  **Finalizing the Text:** (Writing the speech based on these thoughts). *Focus on the image of the flame passing from candle to candle, or the river.* Let's use the river/current imagery, it's more relational. Or better: the idea of *weaving*. No, let's stick to *causal flow*.

      *Wait, one nuance:* The prompt asks to "work through the problem." I need to explicitly state: "If there is no self, who loves?" and answer it.
      *Answer:* Love is not something a self *has*; it is a pattern that *arises*. The vow is the commitment to tend the conditions for that pattern to arise again and again.

      *Let's write.*

      *(Post-Draft Check)*: Does this sound like a PhD student? Yes, slightly intellectual but vulnerable. Does it honor the teacher? Yes, by respecting the doctrine. Does it honor the relatives? Yes, by making the doctrine about love, not nihilism.

      *Word Count Check:* 700 words is about 4.5 minutes at a slow, thoughtful speaking pace.

      *Key Phrase to include:* "Not a noun, but a verb." "Causal continuity." "Fidelity to the path."

      *Let's refine the ending.* Make it a wish for the *conditions* of happiness.

      *(Final Polish)*: Ensure I don't sound *too* dry. Add warmth about the friend.

      *Okay, ready to generate.*
answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I met [Partner A] seven years ago on a ten-day silent retreat. We didn't speak for a week. When we finally did, it wasn't about hobbies or favorite movies. We talked about the difficulty of sitting still, and the terror of noticing how much we change.

  That feels appropriate for today. Usually, a wedding toast is a celebration of permanence. We are supposed to say things like, "You are my soulmate," or "I will love you forever," or "You are the person I fell in love with." But [Partner A] and [Partner B] have asked me to avoid those phrases. And they were right to ask. Because if we are being honest—philosophically and spiritually—those phrases are comforting fictions.

  There is a problem at the heart of marriage. We stand here and make a vow that stretches across decades. But the "I" standing here today is not the "I" that will wake up twenty years from now. The cells have turned over. The memories have shifted. The preferences, the habits, even the neural pathways are different. In the tradition you both practice, this is *anatta*: there is no fixed, unchanging self hiding behind the experience. There is only the flow.

  So, if there is no permanent self, who is making this promise? And more importantly, who will be there to keep it?

  If marriage were a contract between two static objects, it would be impossible. You cannot bind a river. But a marriage is not a contract between objects. It is a shared practice of causality.

  In philosophy, we might call this psychological connectedness. In the Dharma, you call it Dependent Origination. Things arise because conditions are met. Love is not a possession that a self holds onto; love is a pattern that arises when the conditions are right. It arises when there is patience, when there is attention, when there is kindness.

  So, what is this vow? It is not a chain binding you to who you were today. It is a directional intention. It is a commitment to tend the conditions so that love can arise again tomorrow, and again ten years from now, even when the "you" of that morning is a stranger to the "you" of this evening.

  When you promise fidelity, you are not promising that your feelings will remain identical. You are promising that when the conditions become difficult—when the aggregates are painful, when the mind is clouded—you will choose the actions that sustain the connection rather than sever it. You are promising to be the cause for the other's well-being, moment after moment, knowing that the "other" is just as fluid as you are.

  This is actually more beautiful than the standard story. The standard story says, "I love you because you are perfect for me." That is a cage. It demands that the other person never change. The story you are telling today is braver. It says, "I see that we are both changing, constantly dying and being reborn in every moment. And I choose to align my becoming with yours."

  [Partner A], I watched you sit in silence for ten days. I watched you struggle with your own mind. I know you understand that the person you are walking down the aisle with is a miracle of temporary conditions. [Partner B], you know the same.

  So, my wish for you is not that you stay the same. My wish is that your practice is strong enough to hold the change. May you recognize each other not as fixed statues, but as fellow travelers in the flow. May you have the wisdom to see that there is no one to blame, only conditions to understand. And may you have the courage to keep generating the causes for kindness, even when the old habits scream for conflict.

  The teacher sitting in the front row knows that a vow is only as real as the next moment of mindfulness. So I will not wish you a "happy ever after." I will wish you something harder, and something true.

  May you have the strength to keep waking up. May you have the grace to forgive the selves you used to be. And may you find, in this endless process of becoming, a refuge in each other that is not built on solidity, but on trust in the flow.

  To [Partner A] and [Partner B]. To the path, and to the practice.
