answer: |-
  This is a sophisticated prompt that requires distinguishing between a modern moral critique of imperialism and an 18th-century political-economic critique of monopoly and governance. To write this character authentically, you must avoid anachronistic language regarding "human rights," "self-determination," or "cultural imperialism." Instead, the character's outrage must stem from **incentive structures, the misallocation of capital, the nature of sovereignty, and the inefficiency of monopoly.**

  Here is a reconstruction of how a Smithian observer in 1890 would analyze the British South Africa Company (BSAC), distinguishing between the timeless errors and the specific complications of the late Victorian context.

  ### 1. The Core Diagnosis: The Merchant-Sovereign Paradox
  Smith's primary objection in *The Wealth of Nations* (Book V, Chapter I, Part III) is that a joint-stock company cannot govern. He argues that the interests of a sovereign (the prosperity and security of subjects to ensure long-term tax revenue) are diametrically opposed to the interests of a merchant (maximizing short-term dividend returns).

  **The 1890 Application:**
  Your character would see the BSAC not as a new evil, but as the **EIC error codified into law.** However, he would note a critical intensification. The East India Company eventually evolved into a territorial administrator that sometimes acted against its own commercial interests to maintain order. The BSAC, by contrast, is a **speculative vehicle first.**
  *   **Smithian Reasoning:** "The East India Company became a sovereign that traded; Rhodes has created a trader that pretends to be sovereign. The directors in London have never seen the Zambezi, yet they hold the power of war and peace. Their dividend depends not on the gradual improvement of the land, but on the immediate extraction of gold. Where the sovereign looks to the harvest of next year, the shareholder looks to the share price of next week."

  ### 2. The Berlin Conference and "Effective Occupation"
  The Berlin Conference (1884–85) required powers to demonstrate "effective occupation" to claim territory. This forced chartered companies to become governments whether they wanted to or not.

  **The Complication:**
  Smith would find this diplomatically perverse. He generally argued that colonies should be governed by the Crown to ensure justice, or left to trade freely. The Berlin framework forces a private entity to perform public functions without public accountability.
  *   **Smithian Reasoning:** "Europe's diplomats have agreed that to own land, one must govern it. Yet they have handed the gavel to the shopkeeper. A company forced to govern is a monster; it must tax the very people it wishes to trade with, and police the very markets it wishes to exploit. It creates a system where the cost of administration is deducted from the profits of commerce, ensuring that either the trade fails, or the administration becomes a tyranny to cut costs. There is no middle ground."

  ### 3. Financialization and the "Projector"
  Smith had a deep distrust of "projectors" (speculators) and joint-stock companies where directors manage "other people's money." In 1776, joint-stock companies were rare and required specific charters. By 1890, limited liability and a mature stock market meant the BSAC's shareholders were a diffuse mass of the Victorian middle class, not a tight oligarchy.

  **The Complication:**
  Smith would argue that **limited liability amplifies moral hazard.** In the 18th century, merchants often had unlimited liability; their personal fortunes were at risk. In 1890, the BSAC shareholder risks only his stake.
  *   **Smithian Reasoning:** "In my time, the merchant risked his own house on the venture. Now, the law protects the shareholder from the consequences of his own ambition. This encourages recklessness. The British public pours capital into Africa not because the land yields a return, but because the charter promises a monopoly. It is a great drain of capital from the improvement of Britain's own fields and factories into a speculative abyss. It is not commerce; it is gambling dressed in the uniform of the state."

  ### 4. The Nature of the Monopoly
  Smith hated the Navigation Acts and exclusive trade privileges because they raised prices for consumers and stifled innovation. The BSAC charter granted a monopoly not just on trade, but on **mining rights and land ownership** across millions of square miles.

  **The Complication:**
  Smith viewed land monopoly as particularly destructive to labor incentives. If the Company owns the soil, the laborer cannot become an independent farmer (which Smith saw as the bedrock of prosperity).
  *   **Smithian Reasoning:** "The East India Company monopolized the spice; Rhodes monopolizes the earth itself. By claiming ownership of the minerals and the soil, the Company prevents the natural accumulation of stock by the inhabitants. A man cannot improve his condition if the fruit of his labor belongs to a corporation in London. This is not colonization; it is enclosure on a continental scale. It creates a population of wage-laborers by force, rather than by the natural progress of opulence."

  ### 5. The Cost to the Metropole
  Smith was skeptical of empire because he believed it cost the British taxpayer more to defend colonies than the trade was worth. He advocated that colonies should pay for their own defense or be represented in Parliament (which he knew was impossible).

  **The 1890 Application:**
  The BSAC was designed specifically to *avoid* costing the British taxpayer. This would look suspicious to a Smithian.
  *   **Smithian Reasoning:** "They say this company saves the British taxpayer the cost of conquest. I say it merely hides the cost. When the Company's police fail, or the natives revolt, who will send the Redcoats? The Crown. The private profit is certain; the public risk is socialized. It is a bargain where the merchants keep the gain and the public bears the loss. Furthermore, by provoking conflict with the Boers or the Germans, this private army draws the Empire into wars no statesman has authorized."

  ### Summary of the Character's Voice
  To sound authentically Smithian, your character should avoid saying:
  *   "This is morally wrong." (Unless referring to the inefficiency of slavery/coercion).
  *   "The Africans have a right to self-rule." (Smith focused on the *effect* of rule, not the *right* to it).
  *   "This is cultural imperialism."

  **Instead, he should say:**
  *   "This is a perversion of the natural order of government."
  *   "The incentives are misaligned."
  *   "It is a drain on the nation's capital."
  *   "Merchants are incapable of the prudence required of magistrates."
  *   "Monopoly stifles the industry of both the colonist and the native."

  ### Sample Internal Monologue for the Scene
  > "They call it a Charter, as if it were a Magna Carta for the veldt. I call it a resurrection of the East India error, but stripped of its few remaining scruples. Smith taught us that the spirit of monopoly is the enemy of good government. Here, the monopoly *is* the government.
  >
  > "Look at the structure. A joint-stock company, limited liability, tasked with making war and treaties. The directors sit in London, counting ounces of gold, while their agents in Mashonaland must act as judges, tax collectors, and generals. Their interest is to extract the maximum dividend before the share price falls. The interest of the country is peace, steady improvement, and justice. These two interests are not merely different; they are hostile.
  >
  > "And the Berlin Conference? It forces them to govern to keep the land, yet the law shields them from the cost of misrule. It is a machine designed to convert the uncertainty of conquest into the certainty of a dividend coupon. It will bleed the native of his labor, bleed the investor of his capital, and when the Maxim guns fall silent and the mines prove barren, it will be the British soldier who pays the bill. It is not empire; it is a bubble with an army."

  ### Why This Is More Complicated Than Simple Repetition
  Smith would recognize that **technology and finance have accelerated the extraction.** In 1776, extraction was limited by logistics. In 1890, with railways and Maxim guns, the "short-term gain" Smith warned about can be achieved much faster and more violently. He would also note that the **legal separation of ownership and control** (Berle and Means style, though pre-dating them) is more advanced, making the directors even less accountable to the shareholders, let alone the African subjects.

  He would view the BSAC not just as a bad government, but as a **financial instrument masquerading as a state**, which is a more insidious corruption than the EIC ever achieved.
