      *   *Okay, that's the key.* CDT says "Given I lean Stay, Flee is better." EDT says "Given I lean Stay, Stay is doom. Given I lean Flee, Flee is doom." EDT doesn't necessarily command a switch, it commands resignation (or randomization).

  9.  **Final Polish:** Ensure the distinction between "Newcomb's" (where EDT wins money) and "Damascus" (where both theories struggle, but CDT breaks) is clear. The prompt asks which looks *worse*. CDT looks worse because it fails to prescribe a unique action without ad-hoc fixes (randomization), whereas EDT prescribes "indifference" which allows randomization naturally.

