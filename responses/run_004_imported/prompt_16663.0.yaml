      *   *The "Bie" Problem:* Mencius says husband/wife = distinction. Historically, this meant men outside, women inside. This is unacceptable for a modern egalitarian marriage.
      *   *The Solution:* Reinterpret *bie* (distinction) not as hierarchy or rigid division of labor, but as *complementarity* and *specificity*. Every relationship has a unique flavor. The "distinction" is that *this* relationship is unique compared to the brother-sister relationship or the friend relationship. It creates a new center of gravity.
