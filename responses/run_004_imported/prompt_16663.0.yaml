answer: |-
  Good evening, everyone. For those who don't know me, I'm the older brother. I'm also a philosophy professor, which usually means I'm the person you avoid at parties to keep from getting a lecture. So, I promise to keep this under four minutes.

  My brother asked me to speak today, half in jest. But as someone who has spent a career thinking about what makes us human, I can't help but see a wedding for what it truly is. We often talk about marriage as two individuals "finding themselves" in one another. But in my tradition, we don't believe we are discrete selves who *then* enter relationships. We believe we *are* our relationships. You are not a noun; you are a verb. You are a son, a brother, a friend. And starting today, you are a husband.

  This brings me to a tricky bit of history. The classic Confucian text, the *Mencius*, lists the five fundamental relationships that make us human. Parent and child are guided by love; friends by trust. But husband and wife? The ancient text says they are guided by *bie*—distinction.

  Historically, that word did heavy, often oppressive lifting. It was used to justify a division of labor where men ruled the outside world and women were confined to the inner. We know that cost. We are not here to revive a hierarchy where one partner stays in and the other goes out.

  But if we look closer, *bie* doesn't have to mean hierarchy. It can mean *particularity*. It means this relationship has a unique texture that no other does. Your friendship with your college roommate has a different shape than your relationship with your mother. And this marriage? This is a distinct, new center of gravity. It is a specific, shared project of world-building that belongs only to the two of you.

  In role ethics, when you marry, you aren't just adding a title. You are reshaping the entire web. My brother is no longer just the son who comes home for holidays; he is building a new home. I am no longer just his older sister; I am now an aunt, a mentor, a different kind of support. And to [Partner's Name]: welcome. You aren't "joining" our family as an outsider. You are actively changing what "our family" means. You are constituting us, just as we hope to constitute you.

  So, my wish for you is not that you "complete" each other. You are already whole. My wish is that you grow into these roles with courage. That when the world is chaotic, this relationship offers a specific kind of order—not the order of rules, but the harmony of two people focusing their energy on a shared life.

  Let us raise a glass. To the distinction of this bond, to the expansion of our web, and to the work of becoming human, together.

  To the bride and groom.
