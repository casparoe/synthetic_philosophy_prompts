          *   *Revision:* Focus on the *source* of the action. Huck responds to Jim's humanity. If moral worth tracks responsiveness to moral reasons, why is Huck's direct responsiveness inferior to a dutiful agent who might be cold?
          *   *Follow-up:* She'll likely say Huck's action is praiseworthy but lacks *moral worth* specifically, or that it's unstable. I need to press on whether that distinction matters practically.

      *   *Question 2: Fetishism of Duty (Required).*
          *   *Draft:* What about the fetishism objection? Isn't caring only about duty weird?
          *   *Critique:* Standard. Needs more bite.
          *   *Revision:* Frame it as a concern about moral psychology. If I help you because "it's my duty," do I really care about *you*? How do you avoid making the moral agent a moral narcissist?
          *   *Follow-up:* She'll likely distinguish between the *ground* of motivation and the *object* of attention. I need to ask if that psychological split is sustainable.

      *   *Question 3: Coincident Reasons/Rescues (Required).*
          *   *Draft:* What about coincident reasons? Can't duty and sympathy work together?
          *   *Critique:* A bit jargon-heavy, need to make it clear.
          *   *Revision:* Many Kantians try to save the view by saying duty just needs to be *sufficient* or *structuring*, not exclusive. Does this actually save the strict view, or does it admit that sympathy does the heavy lifting?
          *   *Follow-up:* She defends the *strict* line. She might reject the "coincident reasons" softening. I should ask if her strictness makes the ideal agent too rare.

      *   *Question 4: Moral Luck (Related to Dana's point).*
          *   *Idea:* Dana mentioned moral luck. If Huck isn't motivated by duty, his goodness is accidental.
          *   *Draft:* Is Huck just lucky?
          *   *Revision:* Connect luck to credit. If sympathy leads to the right action reliably, why does the *reason* for that reliability (duty vs. temperament) change the credit?
          *   *Follow-up:* She'll argue reliability requires principle. Press on whether principle guarantees reliability better than deep empathy.

      *   *Question 5: The Role of Emotion.*
          *   *Idea:* Kant isn't against emotion, just not as the *determining ground*.
          *   *Draft:* Can we have emotions and duty?
          *   *Revision:* You defend the strict motive-of-duty requirement. Does this require us to suppress or mistrust our natural sympathies? Is the ideal moral agent someone who has to fight their feelings to do good?
          *   *Follow-up:* She'll say no, duty regulates emotion. Ask if the *struggle* is where the worth comes from (the "grumpy shopkeeper" problem).

      *   *Question 6: Developmental/Practical Implication.*
          *   *Idea:* How do we teach this?
          *   *Draft:* How do we teach kids to be moral?
          *   *Revision:* If moral worth is so rare (acting strictly from duty), what is the pedagogical value of teaching this view? Does telling students "your sympathy isn't enough" discourage morality?
          *   *Follow-up:* She'll say it raises the bar. Ask if a high bar that few clear is useful.

      *   *Question 7: The "Good Will" and Outcomes.*
          *   *Idea:* Moral worth is internal.
          *   *Draft:* Does outcome matter?
