      *   *Point 3: The Social Function of Belief.* In personal relationships, blind skepticism can be damaging. Sidgwick was doing *science*; ordinary people are doing *relationship maintenance*. There's a pragmatic difference.
      *   *Point 4: Sidgwick's Agnosticism as a Model.* You don't have to say "That's fake." You can say "I believe *you experienced that*, but I'm not convinced about the *cause*." This preserves trust without accepting the fringe claim.

  6.  **Refine the "Epistemic Calculus" Question:**
