      *   **Key Characteristic:** Applied an incredibly strict evidentiary standard to psychical phenomena (telepathy, apparitions, etc.). Ruled out fraud, coincidence, self-deception. Remained agnostic/undecided until death.
      *   **Core Question:** What are the implications of Sidgwick's standard for an *ordinary person today* weighing a *first-hand story* from a *trusted friend* (vs. a stranger online)?
      *   **Specific Tension:** Does Sidgwick's framework demand equal skepticism regardless of the source (friend vs. stranger), or does personal trust change the "epistemic calculus" in a way Sidgwick didn't account for?

  2.  **Analyze Sidgwick's Approach (Historical/Philosophical Context):**
      *   Sidgwick was a utilitarian philosopher and a rigorous thinker.
      *   His involvement with the SPR (Society for Psychical Research) was driven by a desire to apply scientific rigor to anomalous experiences.
      *   His standard was essentially *scientific/falsificationist*: Extraordinary claims require extraordinary evidence. Anecdote $\neq$ Data.
      *   He recognized human fallibility (memory, perception, bias) even in honest observers.
      *   *Crucial Point:* Sidgwick wasn't a debunker; he was a seeker. He *wanted* to believe but couldn't find sufficient proof.

  3.  **Address the "Ordinary Person" Scenario:**
