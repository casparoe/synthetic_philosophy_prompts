answer: |-
  It is a pleasure to encounter a mind that bridges the gap between the physical and the social sciences with such rigor. Your intuition regarding revealed preference theory (RPT) is sharp; you have correctly identified why it was such a revolution in the 1930s and 40s. Samuelson and his successors did indeed attempt to purge economics of the "psychologism" of the early utilitarians, much as operationalism sought to purge physics of unobservable entities.

  Your analogy to statistical mechanics is elegant: inferring a scalar field (utility/temperature) from the observable dynamics of the system (choices/molecular collisions). However, the reluctance of your former colleagues stems from a fundamental mathematical constraint inherent in the machinery you admire, rather than a mere measurement limitation.

  To answer your question directly: **There is no correct way to rescale those two functions onto a common footing using only the data of revealed preference.**

  Here is the technical explanation, framed in terms that might resonate with your background in physics.

  ### 1. The Problem of Gauge Invariance
  In revealed preference theory, the utility function $U(x)$ that you recover from a consumer's choices is **ordinal**. Mathematically, this means the function is identified only up to a strictly monotonic transformation. If $U(x)$ rationalizes the choice data, then $f(U(x))$ also rationalizes that data for any monotonically increasing function $f$.

  In physics terms, the theory possesses a massive "gauge freedom." You can stretch, compress, or warp the utility scale for Household A arbitrarily, provided you do not reverse the ordering of their preferences.

  To perform a Benthamite summation ($W = U_A + U_B$), you require **cardinal** utility. The function must be unique up to a positive *affine* transformation ($U' = aU + b$, where $a > 0$). Only with cardinal utility do the intervals between points have meaning, allowing for summation. Revealed preference theory, based on deterministic choice under certainty, provides no data to fix the scaling factor $a$ or the zero-point $b$ for any individual, let alone align them across individuals.

  ### 2. The Thermodynamics Analogy
  Your analogy to temperature is insightful but breaks down at the boundary condition. In thermodynamics, we can compare the temperature of two systems because there exists a physical interaction—thermal contact—that leads to equilibrium. The Zeroth Law of Thermodynamics provides the empirical bridge: if A is in equilibrium with B, and B with C, then A is with C. This allows us to construct a universal scale.

  In economics, there is no equivalent "utility contact." There is no observable transaction between Household A and Household B that equilibrates their marginal utilities. If you transfer a dollar from A to B, you observe a change in their consumption bundles, but you cannot observe the change in their internal "happiness" levels to see if the net sum increased. Without an equilibrium condition linking the *intensities* of two different agents' preferences, there is no empirical anchor to align their scales.

  ### 3. The "Money-Metric" Attempt
  You might ask: "Why not use money as the common numeraire?" This is the approach of **money-metric utility** (developed by Samuelson and others). We can ask: "What is the minimum income Household A needs at reference prices $p$ to achieve the utility of bundle $x$?"

  This converts utility into dollars, seemingly providing a common scale. However, this introduces a new variable: the marginal utility of income.
  *   Household A might be wealthy; an extra dollar adds little to their welfare.
  *   Household B might be poor; an extra dollar adds much.

  If you sum their money-metric utilities, you are implicitly weighting the preferences of the rich more heavily than the poor (because a dollar represents less "sacrifice" or "effort" for the rich). To correct for this, you would need to know the marginal utility of income for each household, which returns you to the original problem: that quantity is not revealed by choice data alone. It requires an ethical assumption about the distribution of welfare.

  ### 4. The Von Neumann-Morgenstern Alternative
  If you wish to recover cardinal utility, you must change the experimental setup, much as one changes the apparatus to measure a different observable.

  Revealed preference relies on deterministic choices. If you introduce **uncertainty** (lotteries), you can utilize the **Von Neumann-Morgenstern (vNM)** axioms. If an agent's choices over lotteries satisfy the independence axiom, you can recover a utility function that is cardinal (unique up to positive affine transformation).

  However, even vNM utility does not solve the *interpersonal* problem. It fixes the scale *within* an individual (allowing them to compare the risk of a car accident vs. the cost of insurance), but it does not provide a bridge to compare Agent A's vNM utils with Agent B's. Agent A's "0" and "1" (worst and best outcomes) are defined by their own psychological extremes, which have no necessary correspondence to Agent B's.

  ### 5. The Normative vs. Positive Divide
  This brings us to the core reason for your colleagues' reluctance. It is not merely technical; it is philosophical.

  *   **Positive Economics:** Describes what people *do*. Revealed preference is a triumph here. It predicts behavior without assuming a metaphysical "utility substance."
  *   **Normative Economics:** Prescribes what *ought* to be done. Benthamite utilitarianism is a normative framework.

  To move from the positive (observed choices) to the normative (social welfare summation), you must introduce an ethical axiom. The most common is the **Pareto Principle** (if everyone prefers X to Y, society should prefer X to Y). But the Pareto Principle is silent on conflicts where A gains and B loses.

  To resolve those conflicts (Playground vs. Road), you must assume a **Social Welfare Function**. Constructing this function requires making value judgments about interpersonal comparability. You can *assume* that utility is comparable (as Harsanyi did behind a "veil of ignorance"), but you cannot *derive* it from choice data.

  ### Conclusion
  Your physicist's instinct is to look for the invariant quantity. In revealed preference theory, the invariant is the **ordering of bundles**, not the **magnitude of satisfaction**.

  To answer your specific question: There is no rescaling procedure inherent to revealed preference theory that allows for the summation of utility across households. To do so would require imposing an external ethical constraint (e.g., assuming the marginal utility of income is equal across households, or adopting a specific inequality aversion parameter).

  Your colleagues are not denying the elegance of the machinery; they are pointing out that the machinery is designed specifically to avoid making the metaphysical claim that "utils" are measurable, comparable substances. Bentham sought a moral thermometer; modern economics built a compass instead. It tells us which way the agent is moving, but not how far they have traveled, nor how their journey compares to their neighbor's.

  If you wish to pursue this, I would recommend looking into the work of **John Harsanyi** (utilitarianism and risk) or **Amartya Sen** (capabilities and welfare), who have wrestled deeply with exactly the bridge you are attempting to build.
