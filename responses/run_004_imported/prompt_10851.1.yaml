answer: |-
  "You keep cleaning that rifle like it's going to confess."

  "Better than talking to you."

  "About the prisoners?"

  "About the boys across the ridge. The ones we're supposed to kill tomorrow."

  Amos shifted against the sandbag wall. "And?"

  "And you want me to believe they're murderers. Because their government started this."

  "I want you to believe they're liable. There's a difference. If their cause is unjust, they're contributing to an unjust threat. That makes them morally liable to defensive harm. You're not. That's not equality."

  "It's not equality, it's survival," Dara said. "The moment we decide liability tracks the justice of the cause, the war stops having limits. If I know you're a criminal aggressor, I don't take you prisoner. I execute you. If you know I view you as a criminal, you don't surrender. You fight to the death. Civilians get caught in the middle of a war without rules."

  "That's the empirical claim," Amos said. "But you're assuming the current rules protect civilians. They don't. They protect commanders. The Walzerian fiction makes it too cheap to start wars. If every soldier knew that fighting an unjust war made them personally liable—that they weren't morally equal to the defender—leaders would have a harder time filling uniforms. The friction increases. Unjust wars stall. Fewer civilians die in the long run because fewer wars start."

  "You're betting on moral clarity to stop a machine built on propaganda," Dara said. "Look at them, Amos. Half the ridge is conscripted. The other half believes we invaded them. They don't know they're unjust. You can't be liable for a threat you don't know you're posing."

  "Ignorance doesn't change the physics of the bullet."

  "It changes the morality of the man pulling the trigger. But that's not even my point. My point is the convention isn't for them. It's for us. It's for the peace after." Dara leaned forward. "If we treat them as moral equals now, we can treat them as neighbors later. If we brand them as liable aggressors, as criminals just for wearing the uniform, we poison the soil for a generation. We make reconciliation impossible. The convention isn't a metaphysical truth claim, it's a reciprocal suicide pact. We agree not to judge your cause if you agree not to shoot civilians."

  "So we lie to keep the peace."

  "We agree to suspend judgment because we can't afford not to. You say ignorance doesn't matter. I say it's the only thing that holds the line. If liability requires knowledge of unjustness, you have no army. If liability doesn't require it, you have a massacre. The only way out is to say the uniform itself is the boundary. Inside the uniform, we're all threats. Outside, we're all people."

  "But the uniform doesn't stop the injustice," Amos said. "It hides it. You say reconciliation? How do you reconcile with a lie? When the war ends, everyone knows who won. They'll know who was defending home and who was occupying it. Pretending now doesn't change the memory later. It just means we spent the fighting pretending the occupier wasn't an occupier."

  "It means we didn't slaughter the occupier's children when we took the hill."

  "It means we let the occupier feel righteous about holding the hill."

  "Righteousness keeps them shooting," Dara said. "Guilt might make them stop. Or it might make them blow up the village to take us with them. I'm not gambling on their conscience. I'm gambling on their instinct. They want to live. I want them to know that if they drop the rifle, they live. Your theory tells them if they drop the rifle, they're still liable because they contributed to the unjust threat yesterday. Why would they drop it?"

  "Because we offer them a legal process, not a bullet. Revisionism doesn't require summary execution, Dara. It just requires we stop pretending they didn't do wrong. We can still have POW conventions. We can still offer mercy. But mercy is a gift, not a right owed to moral equals."

  "Mercy is fragile," Dara said. "Rights hold. When the night gets dark and the comms go down, I don't want my soldiers thinking about gifts. I want them thinking about rules. And the rule is: uniform equals target, surrender equals safety. Anything else is noise."

  "Noise is better than a lie," Amos said. "Eventually the truth cuts through."

  "Eventually," Dara said. "But tonight, I have to keep them alive until the morning."
