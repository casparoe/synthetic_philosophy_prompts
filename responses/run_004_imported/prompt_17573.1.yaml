answer: |-
  **Seminar Handout: Challenging the Moral Equality Account of Hypocritical Blame**

  **1. The Target: The Moral Equality Account**

  In the contemporary literature on the standing to blame, a dominant strand of thought—let's call it the **Moral Equality Account**—locates the defect of hypocrisy in the hypocrite's implicit attitude toward moral status. According to this view (championed in various forms by philosophers like R. Jay Wallace and Macalester Bell), blame is a communicative act that presupposes a relationship of moral equality. When a hypocrite blames, they implicitly assert that they are exempt from the norm they are enforcing, thereby denying that they and the blamee are equally subject to morality's demands.

  On this account, the loss of standing is essentially a **conceptual contradiction**. You cannot coherently demand adherence to a rule while simultaneously claiming (implicitly or explicitly) that the rule does not bind you. Consequently, the remedy for the hypocrite, theoretically speaking, is to acknowledge their own fallibility. If the blamer explicitly disclaims any special exemption, affirming that they are just as bound by the norm as the blamee, the Moral Equality Account suggests their standing should be restored. They have affirmed the equality of moral subjection.

  **2. The Counter-Case: The Candid Polluter**

  I want to press against this by constructing a case where the blamer affirms moral equality explicitly and sincerely, yet intuitively lacks standing. This suggests that the problem is not the *propositional content* of their blame (what they imply about moral status), but the *practical dynamics* of the blaming act itself.

  Consider the case of **Clara and David**.

  Clara and David are colleagues and friends. They both work for an organization dedicated to radical environmental sustainability. The norm in their community is strict: no unnecessary carbon emissions. This means no flying for leisure, strict vegetarianism, and no personal vehicles powered by fossil fuels.

  David, struggling with the demands of the norm, recently purchased a used gasoline car to visit his sick mother in a rural area lacking public transit. Clara discovers this and confronts David. She berates him, expressing moral indignation, demanding he sell the car, and suggesting he is betraying their shared cause.

  When David points out that Clara frequently takes long-haul flights for her own leisure travel, Clara does not deny it. Nor does she claim she is special. She responds with perfect candor:

  > "You are absolutely right, David. I fly all the time. I know it's wrong. I am not claiming to be better than you. In fact, I think I'm probably worse. We are both failing the moral demand. I am fully subject to this norm, just as you are. But that doesn't change the fact that *what you did is wrong*. You are violating the standard, and I am calling you to account for it."

  Clara is sincere. She does not believe she is exempt. She acknowledges she is violating the norm. She affirms that she and David are equally subject to the moral demand.

  **The Intuition:** Despite Clara's candid admission of shared fault and her explicit affirmation of moral equality, David is still warranted in rejecting her blame. He can rightly say, "You have no standing to criticize me." The Moral Equality Account struggles to explain this. Clara has explicitly denied the very thing the account says disqualifies blame (the claim to exemption). Yet, the blame remains infelicitous.

  **3. The Rival View: The Unfairness Account**

  Why does Clara lack standing? I propose we defend a rival view, which we might call the **Unfairness Account**. On this view, the loss of standing is not due to a contradiction in the *attitude* toward moral equality, but due to the **unfair distribution of burdens** inherent in the practice of enforcement.

  Blame is not merely a judgment; it is a sanction. It imposes a cost on the blamee (shame, guilt, social friction, the burden of behavioral change). When Clara blames David, she is attempting to enforce a standard.

  **The Argument from Unfair Enforcement:**

  1.  **Enforcement Imposes Burdens:** To blame someone is to demand they bear the cost of compliance (or the cost of sanction) regarding a specific norm.
  2.  **Hypocrisy Creates Differential Burdens:** In the case of the Candid Polluter, Clara is demanding that David bear the cost of compliance (selling the car, inconvenience) while she continues to enjoy the benefits of non-compliance (leisure travel) without imposing those costs on herself.
  3.  **Unfairness Disqualifies Authority:** It is unfair to act as an enforcer of a rule when one is actively opting out of the burdens of that rule. By continuing to violate the norm while policing David, Clara treats David as a means to uphold a moral order that she herself treats as optional.

  On the Unfairness Account, it does not matter that Clara *says* she is bound by the norm. What matters is that she *acts* as though she is not. She is, in practice, taking an exemption even if she disclaims one in theory.

  **4. Why the Unfairness Account is Superior**

  This account captures the intuition in the Clara/David case better than the Moral Equality Account for three reasons:

  *   **It Explains the "Continuing" Violation:** The prompt specifies the rival view focuses on "continuing to enforce a standard... one is not, in practice, holding oneself to." In our case, Clara's lack of standing is tied to her *ongoing* flights. If Clara said, "I used to fly, I stopped because I realized it was wrong, and now I'm asking you to stop," her standing would be restored. The Moral Equality Account struggles here: if Clara admitted fault in the past but claimed she was now compliant, she affirms equality. But if she admits fault *now* and claims she is still violating, she also affirms equality (we are both sinners). The Moral Equality Account cannot easily distinguish why the *ongoing* violation kills standing while a *past* violation does not. The Unfairness Account explains this easily: past violators do not currently benefit from the unfair exemption; current violators do.
  *   **It Focuses on Relational Fairness:** Blame occurs within a relationship. The Candid Polluter case shows that relationships are damaged not just by false claims of superiority, but by unfair impositions of burden. Clara is effectively saying, "I will enjoy the freedom of breaking this rule, but I will use my moral authority to ensure you do not." This creates a hierarchy of *practice* even if there is equality of *theory*.
  *   **It Avoids the "Sincerity" Trap:** The Moral Equality Account relies heavily on what the blamer implicitly believes or asserts. A sophisticated hypocrite could game this system by simply memorizing the script: "I am no better than you." The Unfairness Account makes standing contingent on conduct, not just speech. It prevents agents from purchasing standing through mere verbal disclaimers while continuing harmful behavior.

  **5. Conclusion for the Seminar**

  The case of the Candid Polluter suggests that standing to blame is not merely a matter of acknowledging one's place in the moral community (the Moral Equality Account). It is a matter of **participating fairly in the cooperative practice of norm enforcement**.

  When we blame, we invite others to share in the burden of moral compliance. If we refuse to carry that burden ourselves, we lose the right to demand it of others. This is not because we have denied moral equality in the abstract, but because we have enacted a form of practical domination. We are making ourselves the exception in fact, even if we deny it in word. Therefore, the ethics of blame must look beyond the hypocrite's *attitude* toward the norm and examine the *fairness* of their enforcement practices.
