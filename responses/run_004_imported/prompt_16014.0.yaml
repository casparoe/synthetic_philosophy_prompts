answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I had the privilege of clerking for Judge [Judge's Last Name] from [Year] to [Year].

  I was told that giving this toast was an honor. I was not told it was a minefield. As many of you know, the Guest of Honor has made it very clear that she does not tolerate speculation. She has explicitly warned that if anyone stands up here and starts psychoanalyzing her "true motives" or searching for the "spirit" behind her thirty-year career, she is prepared to heckle from the front row.

  And given that she has spent three decades teaching us that the text is the law, and that we are not free to rewrite it based on what we think it *should* say, I decided the safest path—and the most respectful one—is to treat this toast exactly like she would treat a statute. We are going to stick to the plain meaning of the record. No legislative history. No inquiry into intent. Just the text.

  Now, for the family members here: My job, and the Judge's job, involved a lot of arguing about how to read rules. There are generally two ways to do this. One way is to ask, "What was the goal? What was the vibe?" The other way—the Judge's way—is to ask, "What do the words actually say?"

  To give you an example of how this works in practice: If a normal person tells their spouse, "I'll take out the trash," a purposivist hears, "I intend to remove the garbage when the emotional resonance of the task aligns with my schedule." When Judge [Last Name] says, "I'll take out the trash," the trash is already at the curb, the bin is sanitized, and she has written a concurring opinion on the proper placement of the lid.

  (Laughter)

  That consistency might sound rigid in a wedding vow, but in a federal judge, it is the definition of integrity. It means you never have to guess where you stand. The text is the promise.

  For the lawyers in the room: We know she didn't just read texts; she mastered them. She taught us that clarity is a form of kindness. When she sent an opinion back to a clerk with the margin note "This sentence has five possible meanings. Pick one," she wasn't being difficult. She was teaching us that ambiguity is where fairness goes to die. She demanded precision because she respected the people who had to live with the consequences of our words.

  But I want to speak to the family for a moment about what that looks like off the bench.

  There is a temptation, when honoring a career like this, to talk about her "legacy" or her "impact on the jurisprudence of the circuit." But that would violate the rules of the evening. That is speculation. That is looking for the *purpose* behind the life.

  So, I will stick to the facts.

  The record shows that she showed up. For thirty years. Through flu seasons, through backlogs, through changes in the law and changes in the country.
  The record shows that she read the briefs. All of them. Even the boring ones.
  The record shows that when a young lawyer stood up to argue for the first time, she asked the hard questions, but she never asked them to be cruel. She asked them to make the lawyer better.

  And for the family: The record also shows that while she worked a lot, she made the time count. The text of her life isn't just in the bound volumes of court decisions. It is in the phone calls she made to check in. It is in the dinners where the phones were put away. It is in the fact that she is here tonight, surrounded by people who love her, which is the only evidence of "intent" we need to admit.

  She taught me that you don't need to look behind the words to find the value. You just need to look at the words themselves.

  So, I am not going to speculate on what this retirement means for her soul. I am not going to theorize about what she "really" wanted out of life. I am going to look at the text of the invitation, which says "Retirement Dinner," and the text of her calendar, which is finally, blessedly, empty.

  Judge [Last Name], you have spent your career teaching us that the surest thing in this world is the written word. You taught us that if we stick to the text, we can't go wrong.

  So, relying on the plain meaning of the moment: We are grateful for your service. We are in awe of your mind. And we love you.

  I move that we adjourn this proceeding in honor of the retiree.

  To Judge [Last Name].
