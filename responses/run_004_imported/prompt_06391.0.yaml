          *   Skipping exercise lowers heart rate/variability temporarily but reduces sleep drive.
          *   Melatonin shifts timing but doesn't guarantee quality, and tolerance builds.
      *   *The Algorithm:* It's a black box. It weights certain signals (stillness, HRV, resting HR). If you hack the inputs, you get a high output, but the biological reality doesn't match.

  4.  **Address the Partner's vs. User's Perspective:**
