      *   Key Humean move: Any justification for induction is either demonstrative (logic/math) or probable (empirical).
      *   Demonstrative fails: The future *could* logically differ from the past.
      *   Probable fails: Using past success of induction to justify future success is circular (begging the question).
      *   Hume's conclusion: Induction is a product of custom/habit (psychology), not reason (logic).

  3.  **Deconstruct the Core Technical Issue (Solomonoff Induction):**
      *   **Mechanism:** Assign prior probability $P(h) = 2^{-K(h)}$ to hypotheses (programs) based on Kolmogorov complexity. Update via Bayes.
      *   **Claim:** It's a "universal" predictor. It converges to the true distribution if the true distribution is computable.
      *   **Assumptions:** The world is computable. There exists a Universal Turing Machine (UTM).
      *   **Limits:** Uncomputable in practice (halting problem). Invariance theorem has an additive constant. Convergence is in the limit (or bounded error sum), not guaranteed for the *next* step.

  4.  **Simulate the Encounter (Hume vs. Solomonoff):**
