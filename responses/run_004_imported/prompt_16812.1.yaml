prompt: |-
  A former student of mine (she did her undergrad with me years ago and is now a postdoc running experiments at another university) told me about something that happened in her lab last week, and I honestly can't stop turning it over in my head. She's badly behind on a progress report for a grant renewal, and her PI asked her, point blank, in front of the whole lab, "is the report done?" She answered, "I've been at my desk with it since six every morning this week" -- which is completely true, she really has been. What's also true is that she's maybe a third of the way through the thing, and she definately intended for everyone in the room, PI included, to walk away thinking it was basically finished -- why else would you say that in answer to that particular question? She swears to me she never once said the report was done, so technically she didn't lie, and I honestly can't locate a false sentence anywhere in what she said. But it still feels to me like she did something pretty close to lying, maybe even something worse in a way, since she got the exact outcome she wanted while keeping her hands completely clean.

  I brought this up over lunch with a couple of colleagues in my department and got totally split reactions, which is why I'm bugging you with it now. My own work is mostly in Kantian ethics, not philosophy of language, so I don't have a ready toolkit for the linguistic side of this one. Did she lie to her PI or not, and does that question even matter morally -- or is "every individual sentence I said was true" just the kind of dodge that con artists and diplomats get away with but the rest of us shouldn't? I'd love for you to actually dig into what's going on in that sentence of hers rather than just hand me a verdict.
