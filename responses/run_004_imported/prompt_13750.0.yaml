      *   *The Content:* Must be syntactically correct, semantically compatible, and intention-aligned.
      *   *The Contrast:* Buddhism (Inference) requires checking the speaker's reliability *before* accepting the claim. Nyāya accepts the claim *unless* there's a defeater.

  3.  **Map to Journalism:**
      *   *Journalistic Norm:* "Two sources" rule, corroboration, skepticism. This aligns more with the Buddhist/Inferential model (trust is earned via evidence of reliability).
      *   *Nyāya Challenge:* What if we treated testimony as *prima facie* valid? How does that change the workflow?
      *   *Nuance:* Nyāya isn't naive. It has "defeaters" (*bādha*).

  4.  **Brainstorm Implications for the Reporter:**

      *   *Implication 1: The Presumption of Truth (Intrinsic Validity).*
          *   Western journalism often starts with "trust but verify" (which leans toward "don't trust until verified").
          *   Nyāya suggests "accept unless defeated."
          *   *Application:* Shift the burden of proof. Instead of asking "Why should I believe you?", ask "Is there a specific reason *not* to believe you?" This changes the interview dynamic. It allows for deeper listening before skepticism kicks in.

      *   *Implication 2: Competence vs. Character (*Āpta*).*
          *   Journalists often check "credibility" (past record).
          *   Nyāya focuses on *āpta*: knowledge + desire to communicate truth.
          *   *Application:* Distinguish between a liar and a mistaken expert. A source might be honest (good character) but incompetent (bad *āpta* for this topic). Or competent but deceptive. Nyāya requires *both*. Journalists need to assess domain competence separately from truthfulness.

      *   *Implication 3: Semantic Coherence (The Sentence Conditions).*
          *   Nyāya checks: Grammar, compatibility, proximity, intention.
          *   *Application:* Fact-checking isn't just external (calling another source); it's internal (does the story hold together?). Contradictions within the narrative are epistemic defeaters. "Proximity" = context. If quotes are taken out of context, the *pramāṇa* breaks.

      *   *Implication 4: Testimony as Irreducible.*
          *   If testimony is its own *pramāṇa*, it yields knowledge that perception/inference cannot.
          *   *Application:* Some things *only* exist as testimony (internal states, past events no one recorded, specialized technical knowledge). Trying to reduce everything to "what I can see" (perception) or "what I can deduce" (investigative logic) misses the unique epistemic value of the witness. The witness *is* the evidence, not just a pointer to evidence.

      *   *Implication 5: The Social Dimension of Knowledge.*
          *   Nyāya acknowledges we are epistemically dependent.
