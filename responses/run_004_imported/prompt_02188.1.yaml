  8.  *(Self-Correction during drafting)*: Make sure to emphasize that Good's Theorem assumes the information is *free*. In science, data isn't free (time, money, ethical costs). But the user specified "free information" in the prompt, so stick to that theoretical constraint but mention real-world costs.
      *   *Crucial Point:* The Frequentist worry isn't that *you* believe the wrong thing (necessarily), it's that the *community* gets misled by inflated error rates. Good's theorem is individual; Optional Stopping is often about communal standards.

