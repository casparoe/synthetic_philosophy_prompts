prompt: |-
  Spent my whole career as an experimental biologist, and now that I'm retired I've fallen down the philosophy rabbit hole. Just ran into Good's theorem, which as far as I can tell says a rational Bayesian should never expect that gathering more free information before a decision could make them worse off - only better, or the same, in expectation. Thing is, that seems to clash with something drilled into me for decades about "optional stopping": that you can't just keep peeking at your data and stop the moment you hit significance, since that inflates your false positive rate (basically p-hacking). So whats the deal - can you spell out the most important implications of Good's theorem here, and tell me whether these two ideas are actually in tension, or if I'm just missing something?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Query:**
      *   **User Background:** Retired experimental biologist. Deeply familiar with frequentist statistics (p-values, optional stopping, false positive rates). New to philosophy/Bayesian epistemology.
      *   **The Conflict:** Good's Theorem (Bayesian) says free information always has non-negative expected value. Frequentist "Optional Stopping" says peeking at data and stopping based on results inflates error rates (is bad).
      *   **The Question:** Are these in tension? What are the implications? Am I missing something?
      *   **Tone:** Respectful, intellectually rigorous but accessible (bridging biology/stats to philosophy), clear distinction between frameworks.

  2.  **Deconstruct Good's Theorem:**
      *   *What is it?* I.J. Good (1967). "Rationality requires that the expected utility of observing free evidence is at least as high as not observing it."
      *   *Key Assumptions:* Bayesian framework, proper scoring rules/utility functions, *free* information (no cost), honest updating (conditionalization).
      *   *Core Intuition:* You update your beliefs. Sometimes the evidence strengthens your current view, sometimes it weakens it. But *before* you see it, you expect it to move you toward the truth (on average). You can't predict the *direction* of the update (otherwise you'd update now), but you expect the *magnitude* of the improvement in decision quality to be positive.

  3.  **Deconstruct Optional Stopping (Frequentist):**
      *   *What is it?* Collecting data sequentially and testing $H_0$ at each step, stopping when $p < 0.05$.
      *   *The Problem:* Under $H_0$, random walks eventually cross any threshold. If you keep looking, you *will* eventually find significance by chance. This invalidates the p-value interpretation (Type I error rate explodes).
      *   *Core Intuition:* The *procedure* matters. The sampling distribution depends on the stopping rule.

  4.  **Identify the Source of Tension (The "Clash"):**
      *   It looks like a contradiction: "More data is always good" (Good) vs. "Peeking at data ruins your inference" (Optional Stopping).
      *   *Resolution:* They are answering different questions within different frameworks.
      *   *Framework 1 (Good/Bayesian):* Focuses on *belief updating* and *decision utility*. Did my probability assignment get better?
      *   *Framework 2 (Optional Stopping/Frequentist):* Focuses on *long-run error rates* of a specific testing procedure. Will I reject $H_0$ too often when it's true?

  5.  **Drafting the Explanation - Step-by-Step:**

      *   **Acknowledge and Validate:** Start by honoring the user's background. This is a classic "Bayesian vs. Frequentist" friction point. It's a great observation.
      *   **Explain Good's Theorem Simply:** It's about *expectation* before seeing the data. You can't know which way the data will pull, but you expect it to reduce uncertainty/improve decisions. Crucial condition: You must update *correctly* (Bayes' rule).
      *   **Explain Optional Stopping Simply:** It's about *calibration* of a long-run frequency. If you peek, you change the set of possible outcomes that count as "significant."
      *   **The Crucial Distinction (The "Missing Something"):**
          *   *Goal:* Good's theorem is about *individual decision quality*. Optional stopping is about *procedure validity* (error control).
          *   *The "Peeking" Mechanism:* In Good's theorem, you plan to update. In optional stopping p-hacking, you plan to *stop and claim truth* based on a threshold that assumes a fixed sample size.
          *   *Bayesian Optional Stopping:* Does optional stopping hurt a Bayesian? Generally, no (Likelihood Principle). If you update properly, the stopping rule is irrelevant to the posterior *given the data*. However, there are caveats (model misspecification, priors).
      *   **Synthesize the Resolution:**
          *   Good's theorem holds for the Bayesian agent who updates beliefs.
          *   Optional stopping warnings hold for the Frequentist tester who controls error rates.
          *   The tension arises when a Bayesian tries to act like a Frequentist (e.g., "I'll stop when my posterior probability > 95%") without adjusting for the selection effect, OR when a Frequentist ignores the stopping rule.
      *   **Real-world Implication for a Biologist:**
          *   If you care about "What should I believe now?" (Bayesian), peeking is fine *if* you update fully.
          *   If you care about "Will I get published/avoid false claims in the long run?" (Frequentist/Scientific Community), peeking is dangerous because it breaks the communal error control.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, is Good's Theorem absolutely true?* It assumes the model is correct. If the model is wrong, more data can lead you astray (convergence to the wrong parameter). I should mention model misspecification.
      *   *Is Bayesian optional stopping truly harmless?* Savage's Sure Thing Principle / Likelihood Principle says stopping rule is irrelevant *for inference*. But for *decision making* with costs, it might matter. Also, "Bayesian p-hacking" (prior hacking) is a thing.
      *   *Key Insight:* Good's theorem is about the *value of information*. Optional stopping is about the *validity of a specific statistical test*.
      *   *Analogy:* Good's theorem is like saying "Looking at a map never hurts your navigation." Optional stopping is like saying "If you keep checking the map until you think you're at the destination, you might be fooling yourself about the accuracy of your GPS." (Need a better analogy).
