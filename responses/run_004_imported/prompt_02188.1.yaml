answer: |-
  Welcome to the rabbit hole. It is a deep one, and your intuition is spot on: this is one of the classic friction points between Bayesian epistemology and Frequentist statistics.

  As an experimental biologist, you were trained in the Frequentist tradition (Neyman-Pearson hypothesis testing), where the "optional stopping" rule is a cardinal sin. Now, as a philosopher, you are encountering Bayesian decision theory, where Good's Theorem reigns.

  The short answer is: **There is no logical contradiction, but there is a clash of goals.** Good's Theorem and the Optional Stopping Problem are answering fundamentally different questions using different definitions of "rationality" and "error."

  Here is the breakdown of why they seem to clash, why they actually don't, and what the implications are for a scientist like you.

  ### 1. What Good's Theorem Actually Says
  I.J. Good's theorem (1967) is a result in Bayesian decision theory. It states that if you are a Bayesian agent making a decision to maximize expected utility, and information is **free** (costless to acquire), then the expected utility of observing that information is always greater than or equal to the expected utility of acting without it.

  **The Intuition:**
  Before you collect the data, you don't know what the data will say. If you *did* know, you would update your beliefs right now. Since you don't know, you must assign probabilities to the possible outcomes. Good proved mathematically that when you average over all those possible outcomes (weighted by their probability), your expected ability to make a good decision improves.

  **The Catch:**
  This assumes you are a **perfect Bayesian updater**. You must update your beliefs strictly according to Bayes' Rule. You cannot "cherry-pick" how you interpret the data once you see it.

  ### 2. What "Optional Stopping" Actually Says
  In the Frequentist framework (the one drilled into you during your career), probability is defined by long-run frequencies. A p-value is the probability of observing data this extreme *assuming the null hypothesis is true and you follow a specific sampling plan.*

  **The Intuition:**
  If you plan to collect $N=100$ samples, the distribution of your test statistic is calculated based on that fixed $N$. If you instead say, "I will collect data until $p < 0.05$," you have changed the sampling distribution. Under the null hypothesis, a random walk will eventually cross any significance threshold if you let it run long enough. By peeking, you inflate the Type I error rate (false positives) from 5% to potentially nearly 100%.

  **The Catch:**
  This is not about *your belief*; it is about the **calibration of the procedure**. It ensures that in the long run, the scientific community doesn't publish too many false claims.

  ### 3. Resolving the Tension
  The tension arises because you are comparing **Individual Decision Quality** (Good) vs. **Long-Run Error Control** (Optional Stopping).

  #### A. Different Definitions of "Rationality"
  *   **Good's Theorem (Bayesian):** Rationality is internal coherence. If I update my probabilities correctly given the evidence, I am rational. If I peek at data, update my posterior, and make a decision, I have used all available information. My belief state is more accurate than it was before.
  *   **Optional Stopping (Frequentist):** Rationality is procedural integrity. If I use a method that claims to control false positives at 5%, but I modify the method mid-stream to guarantee a "significant" result, I have broken the contract of the method.

  #### B. The Likelihood Principle
  This is the philosophical bridge. The **Likelihood Principle** states that all the evidence in the data regarding a hypothesis is contained in the likelihood function.
  *   **Bayesians** generally accept the Likelihood Principle. To a strict Bayesian, the *stopping rule* is irrelevant to the interpretation of the data *once the data is in hand*. If you stopped because $p < 0.05$ or because you ran out of money, the likelihood of the hypothesis given the data is the same. Therefore, peeking doesn't "corrupt" the data itself, only the Frequentist error calculation.
  *   **Frequentists** reject the Likelihood Principle. They argue the *intent* (the stopping rule) changes the meaning of the data because it changes the set of unobserved outcomes that *could* have happened.

  #### C. The "P-Hacking" Distinction
  Here is where your biologist training might be conflating two things:
  1.  **Updating Beliefs:** Looking at data and changing your mind. (Good's Theorem says this is good).
  2.  **Claiming Significance:** Looking at data and stopping only when you can claim a discovery. (Optional Stopping says this is bad).

  Good's Theorem supports #1. It does *not* support #2 if #2 involves misrepresenting the procedure to a Frequentist audience. If you peek, update your Bayesian posterior, and say "I now believe H1 is 90% likely," Good's Theorem says you are fine (assuming your model is right). If you peek, stop, and say "I have achieved $p < 0.05$," you are lying about the error rate.

  ### 4. Important Implications & Caveats
  Since you are now looking at this philosophically, here are the three nuances that keep epistemologists up at night regarding Good's Theorem:

  **1. The "Free" Information Assumption**
  Good's Theorem only holds if information is costless. In biology, data is never free (time, reagents, animal subjects). If the cost of the next experiment outweighs the expected marginal gain in decision quality, a rational agent should stop. This aligns with your practical experience: we don't sequence forever; we stop when the marginal utility drops.

  **2. Model Misspecification (The "Truth" Problem)**
  Good's Theorem assumes your Bayesian model includes the true hypothesis (or a close approximation). If your model is fundamentally wrong (e.g., you are testing a biological mechanism that doesn't exist), **more data can lead you astray.** You can become extremely confident in a wrong answer.
  *   *Frequentist Optional Stopping* protects against claiming an effect exists when it doesn't (Type I error).
  *   *Good's Theorem* protects against ignoring evidence that could improve your current best guess.
  *   *Conflict:* If the null is true, Good's Theorem says "keep gathering data to confirm the null," while Optional Stopping warns "if you keep gathering data and testing, you will eventually falsely reject the null."

  **3. Bayesian Optional Stopping**
  Can a Bayesian p-hack? Yes. If a Bayesian decides, "I will keep collecting data until my Posterior Probability > 95%," they are essentially imposing a Frequentist stopping rule on a Bayesian framework. While the Likelihood Principle suggests the stopping rule is irrelevant for the *posterior*, simulation studies show that if you simulate data under the Null and apply this stopping rule, you *will* end up with high posterior probabilities for the alternative more often than your priors suggest.
  *   *Philosophical fix:* A "honest" Bayesian reports the posterior regardless of whether it hit a threshold. A "hacker" Bayesian only reports when it hits the threshold. Good's Theorem applies to the honest Bayesian.

  ### Summary: Are they in tension?
  **No, but they are incommensurable.**

  *   **Good's Theorem** tells you that **ignorance is never preferable to knowledge** for an individual agent trying to maximize truth/utility. It is a normative claim about how you should value information.
  *   **Optional Stopping** tells you that **flexible procedures break error guarantees** for a community trying to filter false claims. It is a methodological constraint on how you must report certainty.

  **The Verdict for the Retired Biologist:**
  You weren't taught wrong, and you aren't reading Good wrong.
  *   When you were running labs, you were part of a **communal error-control system** (Frequentist). Optional stopping rules were necessary to prevent the literature from filling with false positives.
  *   Now, as a philosopher thinking about **individual rationality** (Bayesian), Good's Theorem correctly identifies that gathering evidence is inherently valuable for belief formation.

  The tension only exists if you try to use Bayesian updating to justify Frequentist significance claims without adjusting for the stopping rule. If you stick to pure belief updating (Good), peeking is fine. If you stick to hypothesis testing (Frequentist), peeking is forbidden.

  **One final philosophical nugget:**
  Good's Theorem relies on the idea that you cannot predict the *direction* of the evidence (otherwise you'd update now). But in biology, we often have strong theoretical priors. If your theory is robust, new data is likely to confirm it (utility gain is small). If your theory is weak, new data might refute it (utility gain is large). Good's Theorem quantifies the value of that potential refutation. In a way, Good's Theorem is the mathematical formalization of why we do experiments at all: not to prove we are right, but to find out if we are wrong.
