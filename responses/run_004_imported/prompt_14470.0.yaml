answer: |-
  Here is an argument structured to support your thesis, suitable for development into a term paper. It focuses primarily on John McDowell's structural reply while addressing the triviality objection head-on.

  ***

  ### Title: The Illusion of Externality: Why McDowell and Korsgaard are Sophisticated Internalists

  **Thesis:** Contrary to the standard seminar consensus, neither John McDowell nor Christine Korsgaard successfully establishes the existence of "External Reasons" in Bernard Williams's strict sense. Instead, both philosophers should be read as proposing a more expansive, less Humean conception of the Subjective Motivational Set ($S$). By recasting their arguments as refinements of Internalism rather than refutations of it, we preserve the explanatory power of Williams's framework without succumbing to the metaphysical obscurity of truly External Reasons.

  #### 1. Williams's Internal Reasons Statement (IRS) and the Role of $S$
  To evaluate the responses, we must first fix Williams's target. Williams's Internal Reasons Statement (IRS) posits that for a reason statement "$A$ has a reason to $\phi$" to be true, there must be a "sound deliberative route" from $A$'s "Subjective Motivational Set" ($S$) to $\phi$-ing.

  Crucially, Williams defines $S$ broadly. It includes not only occurrent desires but also "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects... embodying commitments of the agent." However, Williams maintains a Humean constraint: the route from $S$ to action must be intelligible in terms of motivation. The "gin/petrol" example illustrates that false beliefs do not generate reasons; if the agent knew the truth, the link to $S$ would vanish. For Williams, a genuinely *External* reason would be one that applies to an agent even if no such deliberative route exists—a reason that floats free of the agent's psychology.

  #### 2. McDowell's Structural Move: Virtue as Second Nature
  John McDowell's critique, particularly in "Might There Be External Reasons?", targets Williams's assumption that the only "sound deliberative route" is one of instrumental calculation or desire-satisfaction. McDowell argues that the virtuous agent perceives a situation as *calling for* a specific action. For McDowell, the reason is located in the world (the situation's demands), but it is accessed through a specific perceptual capacity: moral virtue, or "second nature."

  Standard secondary literature interprets this as an Externalist move: the reason exists in the situation, independent of the agent's prior desires. However, a structural analysis reveals this is actually an argument about the *composition* of $S$.

  McDowell argues that through moral upbringing, an agent acquires a "second nature." This is not a new desire added to a list; it is a transformation of the agent's perceptual and motivational apparatus. When the virtuous agent sees a reason to help, it is because their character (a stable disposition) resonates with the situation.
  *   **The Internalist Reading:** On this reading, the "reason" is not external. It is grounded in the agent's *character*. If the agent lacked this specific second nature (e.g., a sociopath), they would not perceive the reason, and on McDowell's view, they would not *have* the reason in the same way. The reason is contingent upon the agent possessing a specific motivational disposition.
  *   **Connection to $S$:** McDowell's "second nature" fits precisely into Williams's own admission that $S$ includes "dispositions of evaluation." McDowell is simply arguing that these dispositions are not merely *inputs* for deliberation but *constitutive* of the deliberative capacity itself. He is not saying the reason exists without $S$; he is saying $S$ is richer than Williams's Humean instincts allowed him to admit.

  #### 3. Korsgaard and the Capacity for Reflection
  A parallel argument applies to Christine Korsgaard. She distinguishes between the Humean claim (reasons derive from pre-existing desires) and the Rationalist claim (reasons derive from the requirements of rational agency). Korsgaard argues that to act at all is to endorse a maxim, and this reflective structure imposes normative constraints.

  Like McDowell, Korsgaard is often read as an Externalist because she claims rationality *itself* provides reasons. However, these reasons are not external to the agent; they are internal to the *structure of the agent's will*. A reason exists for $A$ because $A$ is a reflective agent. If $A$ were not a reflective agent (e.g., a non-rational animal), the reason would not apply. Thus, the reason is still anchored in a feature of the agent's subjective constitution (their rationality), not in a Platonic realm of values. This is, again, an expansion of $S$ to include the "power of rational reflection" as a fundamental motivational element.

  #### 4. The Triviality Objection
  The strongest objection to this "Sophisticated Internalist" reading is the **Triviality Objection**. Williams himself anticipates this. He worries that if we allow $S$ to include *any* disposition an agent *could* acquire through *any* process of "sound deliberation," Internalism becomes vacuous.

  If "sound deliberation" includes moral education, brainwashing, or radical character transformation, then *any* agent could potentially be brought to $\phi$. If $S$ is stretched to cover "any capacity an agent could in principle develop," then the Internal Reasons Statement excludes nothing. Every External Reason could be re-described as an Internal Reason relative to a *possible* version of the agent. If Internalism covers everything, it explains nothing, and Williams's distinction collapses.

  #### 5. Defusing the Objection: The Constraint of Agent-Identity
  To defend your thesis without trivializing Williams, you must argue that an expansive $S$ is not an *unlimited* $S$. The distinction between Internal and External remains robust if we impose a constraint on **Agent-Identity** and **Deliberative Accessibility**.

  **A. The Constraint of Agent-Identity**
  Internalism requires that the route from $S$ to action preserves the identity of the agent.
  *   **True Externalism:** Claims $A$ has a reason to $\phi$ even if $\phi$-ing requires $A$ to cease being $A$ (e.g., "You have a reason to be a saint," said to a committed egoist who cannot become a saint without total psychological destruction).
  *   **McDowellian Internalism:** Claims $A$ has a reason to $\phi$ only if $A$'s *current* or *developable* character (second nature) supports it. If the egoist lacks the capacity for moral perception and cannot acquire it without ceasing to be *that* agent, the McDowellian Internalist must admit the egoist *does not have the reason*.
  *   **Why this matters:** This preserves the exclusionary power of Internalism. It excludes the "amoralist" or the "radically uneducable." A True Externalist says the amoralist has a reason but ignores it. The McDowellian Internalist says the amoralist *lacks the reason* because they lack the relevant element in $S$ (virtue). This is a substantive claim, not a trivial one.

  **B. The Constraint of Sound Deliberation**
  Williams insists the route must be "sound." We can argue that "soundness" includes rational coherence and imaginative acquaintance, but it cannot include *arbitrary* causal manipulation.
  *   If the only way to get $A$ to $\phi$ is via hypnosis or coercive brainwashing, that is not a "sound deliberative route."
  *   McDowell's "moral upbringing" is a process of *rational* initiation into a community of reason, not causal manipulation.
  *   Therefore, $S$ expands to include *rational potentialities*, but not *causal possibilities*. This prevents the collapse into triviality. The Internalist claims reasons are grounded in what the agent *can* motivate themselves to do through *rational* development. The Externalist claims reasons exist even if the agent is rationally incapable of grasping them.

  #### 6. Conclusion
  By reclassifying McDowell and Korsgaard as Sophisticated Internalists, you achieve two things. First, you defend Williams's core insight: that reasons must be capable of explaining action through the agent's psychology. Second, you show that the "gap" identified by secondary literature is merely a disagreement about the *contents* of $S$, not the *structure* of reasons.

  The Triviality Objection fails because the expanded $S$ is still bounded by the agent's rational nature and identity. It excludes those who are constitutionally incapable of the relevant deliberative route. Thus, McDowell and Korsgaard do not prove that reasons float free of $S$; they prove that $S$ is deep enough to encompass the demands of virtue and rationality. This allows you to commit to your term paper thesis with confidence: the literature has mistaken a debate about moral psychology for a debate about metaphysical realism.

  ***

  ### Advice for the Term Paper
  *   **Textual Evidence:** When discussing McDowell, cite his specific claim that the virtuous person's perception is a "capacity" (a *hexis*). This supports your claim that it is a property of the agent (Internal) rather than the world (External).
  *   **Williams's Concession:** Acknowledge that Williams admits $S$ can include dispositions. Your argument is that he stops short of where McDowell goes, not that McDowell contradicts the *logic* of Internalism.
  *   **The "Amoralist" Test:** Use the figure of the Amoralist to test the Triviality Objection. If your theory says the Amoralist has a reason, it's trivial/externalist. If it says the Amoralist lacks a reason (because they lack the relevant $S$ element), it remains Internalist. McDowell arguably falls into the latter camp, supporting your thesis.
