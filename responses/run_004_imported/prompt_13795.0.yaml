      *   *Philosophical Alignment:* First-Order Representationalism (FOR) or perhaps a specific medical definition where pain = nociceptive input + processing, regardless of conscious access. Also aligns with Freudian ideas of repression (though less relevant here) or cognitive psychology models of selective attention.
