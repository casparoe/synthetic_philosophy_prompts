answer: |-
  You are definitely **not overthinking it.** Your intuition is spot on: those are two fundamentally different claims, and treating them as the same point creates a logical muddle that doesn't actually prove Tyler's innocence.

  Here is the breakdown of why those arguments feel "off," why they aren't the same, and why neither of them actually gets Tyler off the hook.

  ### 1. They are opposite types of claims
  Tyler's friends are mixing up a **statement of fact** with a **hypothetical speculation.**

  *   **Claim A:** *"The locker room didn't stink itself."*
      *   **Type:** Factual Causality.
      *   **Meaning:** A specific person committed a specific act.
      *   **Logical Implication:** There is a culprit. We should find them.
      *   **Problem for the Defense:** This actually **supports** blaming Tyler. If evidence (hall passes) points to Tyler, this argument confirms that *whoever* was in the locker room is responsible. It admits a crime happened, which strengthens the case for finding the specific perpetrator.

  *   **Claim B:** *"Someone else would've done it anyway."*
      *   **Type:** Counterfactual Speculation.
      *   **Meaning:** The specific act was inevitable, even if the specific person wasn't.
      *   **Logical Implication:** Tyler's individual agency doesn't matter because the outcome was going to happen regardless.
      *   **Problem for the Defense:** This is a logical fallacy. Just because someone *might* have committed a crime doesn't mean the person who *actually* committed it isn't responsible.

  **Why treating them as the same point is wrong:**
  Claim A says, "Someone definitely did this." Claim B says, "It doesn't matter who did this." You can't use Claim A to prove a crime happened and then use Claim B to say the specific criminal doesn't matter. They cancel each other out.

  ### 2. The "Hypothetical Alternative" Fallacy
  Claim B ("Someone else would have done it") is a classic logical error often called the **Hypothetical Alternative Fallacy**.

  Imagine a bank robbery.
  *   **Defense:** "You can't blame John for robbing the bank. If John hadn't done it, someone else was planning to rob that bank anyway."
  *   **Reality:** That doesn't change the fact that **John** is the one who pulled the trigger or took the money.

  In your situation, even if *everyone* was talking about pranking the assembly, Tyler (or Owen) is the one who physically brought/set off the bomb. Minimizing his action by saying "it was going to happen anyway" tries to erase his specific choice to act on it.

  ### 3. Do these arguments get Tyler off the hook?
  **No.** Neither argument addresses the actual evidence.

  *   **The Evidence:** You mentioned this is down to Tyler or Owen based on **hall pass times.** This is concrete data.
  *   **The Defense:** Tyler's friends are arguing about **motive and atmosphere** ("people have been talking about pranks").

  Motive doesn't override opportunity.
  *   If Tyler had the hall pass, he had the opportunity.
  *   Saying "others wanted to do it" doesn't change the fact that Tyler was the one in the locker room with the opportunity.
  *   Saying "the room didn't stink itself" just confirms that the person with the hall pass (Tyler) is the likely suspect.

  ### 4. Why your friends are conflating them
  Your friend group is likely conflating these points because they are trying to shift the focus from **Individual Responsibility** to **Group Culture.**

  They want to argue: *"This is a group problem, not a Tyler problem."*
  *   Claim A tries to say: "We all know pranks happen."
  *   Claim B tries to say: "We all wanted pranks to happen."

  By mashing them together, they are trying to dilute Tyler's guilt into the general "vibe" of the group. But logically, it doesn't hold up. If the school is looking for who set off the bomb, they are looking for the **actor**, not the **mood**.

  ### The Verdict
  You aren't overthinking it.
  1.  **They are different claims:** One admits a specific culprit exists; the other argues the specific culprit doesn't matter.
  2.  **They are contradictory:** You can't demand we acknowledge a specific act happened (Claim A) while simultaneously arguing we shouldn't focus on the specific person who did it (Claim B).
  3.  **They don't prove innocence:** Neither argument addresses the hall pass times.

  If the hall pass times put Tyler in the locker room when the bomb went off, he is a suspect regardless of whether "someone else would have done it." Your friends are using rhetoric to protect him, but logically, they aren't making sense.
