answer: |-
  This is one of the most persistent headaches in teaching contemporary epistemology, and you are right to feel it. In the standard DeRose Bank Case, the Subject and the Attributor are the same person (or in the same conversational context). Because the stakes rise for the subject *at the same time* they rise for the attributor, both views predict the same shift in truth value. This makes them look like notational variants: one says "the word 'knows' changed meaning," the other says "the fact of knowledge changed," but the output is identical.

  To cash out the difference, you have to decouple the **Context of Utterance** (Attributor) from the **Context of the Subject**.

  Here is the breakdown of the theoretical work, followed by the specific divergent case you need for class.

  ### 1. What is doing the theoretical work?

  The fundamental distinction is **semantic vs. metaphysical**, or more precisely: **Which context sets the parameter for the truth conditions?**

  *   **Contextualism (Semantic Thesis):** The word "knows" is indexical (like "tall," "here," or "ready"). Its semantic content shifts depending on the **Attributor's Context**.
      *   *The Mechanism:* The conversational context of the *speaker* determines the epistemic standard.
      *   *The Invariant:* The subject's practical situation is irrelevant to the truth of the ascription (except insofar as it affects the evidence).
  *   **Pragmatic Encroachment / SSI (Metaphysical Thesis):** The word "knows" is semantically invariant. It means the same thing in every mouth. However, whether a subject *possesses* the property of knowledge depends in part on the **Subject's Practical Situation**.
      *   *The Mechanism:* The subject's practical stakes determine how much evidence is required to stand in the knowledge relation.
      *   *The Invariant:* The attributor's conversational context is irrelevant to the truth of the ascription.

  **The Short Version:**
  *   **Contextualism:** Who is *speaking* sets the bar.
  *   **SSI:** Who is *acting* (the subject) sets the bar.

  ### 2. The Divergent Case: "The Gossip vs. The Desperate Subject"

  To get different truth verdicts, you need a case where the Attributor's stakes and the Subject's stakes come apart.

  **The Setup:**
  *   **Subject (Hannah):** Hannah needs to deposit a check by Monday or she loses her house. **High Stakes.** She has moderate evidence (she was at the bank two weeks ago on a Saturday).
  *   **Attributor (Sarah):** Sarah is sitting in a coffee shop chatting with a friend. She has no stake in whether Hannah's check clears; she is just gossiping about Hannah's financial literacy. **Low Stakes.**
  *   **The Utterance:** Sarah says, **"Hannah knows that the bank is open on Saturdays."**

  **The Verdicts:**

  | View | Which Stakes Matter? | The Standard | The Verdict on "Hannah knows..." |
  | :--- | :--- | :--- | :--- |
  | **Contextualism** | **Sarah's (Attributor)** | Sarah is in a low-stakes chat. The epistemic standard is **LOW**. Hannah's moderate evidence clears this low bar. | **TRUE** |
  | **SSI (Encroachment)** | **Hannah's (Subject)** | Hannah is in a high-stakes crisis. The evidential threshold is **HIGH**. Hannah's moderate evidence does *not* clear this high bar. | **FALSE** |

  **The Reverse Case (Just to be sure):**
  *   **Subject (Hannah):** Low Stakes (just curious). Moderate Evidence.
  *   **Attributor (Sarah):** High Stakes (Sarah is a bookie taking bets on whether Hannah knows).
  *   **Utterance:** Sarah says, "Hannah knows..."
  *   **Contextualism:** **FALSE** (Sarah's high-stakes context raises the semantic standard).
  *   **SSI:** **TRUE** (Hannah's low-stakes situation keeps the evidential threshold low).

  ### 3. Why this proves they aren't notational variants

  If they were notational variants, they would agree on the truth value of the proposition expressed by the sentence in a specific context, even if they disagreed on *why* it was true.

  In the Gossip Case above:
  1.  **Contextualism** says the proposition expressed is *Knowledge(Low-Standards, Hannah, Bank)*. This is True.
  2.  **SSI** says the proposition expressed is *Knowledge(Invariant-Standards, Hannah, Bank)*. Given Hannah's stakes, this is False.

  They are contradicting each other about the world. One says the sentence is true; the other says it is false.

  ### 4. Pedagogical Tips for the Classroom

  When students push back, they usually rely on the intuition that "If Hannah doesn't really know, Sarah shouldn't say she does." This intuition actually favors SSI. To make Contextualism plausible in this cross-context case, you have to lean into the **assertibility vs. truth** distinction or the **indexical nature of language**.

  **Analogy to use:**
  Compare "knows" to the adjective "rich."
  *   **Contextualism about "Rich":** If a billionaire says "Hannah is rich," it might be false (because the speaker's standard is billions). If a pauper says "Hannah is rich," it might be true (because the speaker's standard is thousands). *The speaker sets the standard.*
  *   **SSI about "Rich" (Subject-Sensitive):** Whether Hannah is rich depends on what *Hannah* needs to pay for. If Hannah needs to buy a yacht, she isn't rich. If Hannah just needs to buy lunch, she is rich. *The subject's needs set the standard.*

  **The "Gotcha" for Students:**
  Ask them: *"If Sarah (the gossip) says 'Hannah knows,' and Hannah (the subject) is listening and yells 'No I don't!', who is right?"*
  *   **Contextualist:** They are both right! Sarah spoke truly relative to her context; Hannah spoke truly relative to hers. (This is the "faultless disagreement" bullet contextualists bite).
  *   **SSI Proponent:** Hannah is right. Sarah spoke falsely. There is only one fact of the matter about Hannah's knowledge, determined by Hannah's stakes.

  ### Summary for your Lecture Notes
  *   **Standard Bank Case:** Contextualism and SSI converge (both say "Knows" goes from True to False as stakes rise).
  *   **Cross-Context Case:** They diverge.
  *   **The Test:** Hold Subject's Stakes High / Attributor's Stakes Low.
  *   **Contextualism:** "S knows" is **True** (Attributor's low standards rule).
  *   **SSI:** "S knows" is **False** (Subject's high stakes rule).

  This is the cleanest way to show that one view locates the variability in the **semantics of the word** (Contextualism), while the other locates the variability in the **nature of the state** (SSI).
