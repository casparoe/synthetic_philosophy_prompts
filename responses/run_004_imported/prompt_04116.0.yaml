prompt: |-
  Random thing that's been bugging me: I teach contextualism and pragmatic encroachment back to back every semester, and I keep telling students they're basically two different answers to the same DeRose-style bank cases, but when they push me on it I can't always cash out why the two views aren't just notational variants of each other dressed up in different vocab. Both are happy to say 'S knows that p' is true given one stakes-situation and false given another, holding S's evidence completely fixed. What I actually want from you is this: what's doing the real theoretical work that keeps contextualism and subject-sensitive invariantism apart, and can you walk me through a case where the attributor and the subject sit in different stakes situations (say, a relaxed attributor gossiping about a subject who has a ton riding on the answer), so the two views actually spit out different verdicts on the knowledge ascription instead of just different explanations for the same verdict? I can never keep straight which view is suppose to say what in that kind of case.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is an epistemology instructor who teaches Contextualism and Pragmatic Encroachment (Subject-Sensitive Invariantism, or SSI) back-to-back.
      *   **Problem:** They struggle to explain to students (and themselves) why these aren't just notational variants. Both views agree that "S knows that p" can vary in truth value across stakes situations *holding evidence fixed*.
      *   **Specific Goal:** The user wants to know *what is doing the real theoretical work* to distinguish them.
      *   **Specific Test:** The user wants a walkthrough of a *divergent case* (Attributor vs. Subject have different stakes) where the two views yield *different truth verdicts* on the knowledge ascription, not just different explanations.
      *   **Tone:** Professional, philosophical, precise, but accessible (like a colleague-to-colleague conversation).

  2.  **Deconstruct the Core Distinction:**
      *   **Contextualism:** The truth conditions of "S knows that p" depend on the *context of the attributor* (the speaker). Specifically, the epistemic standards are set by the speaker's context.
      *   **Pragmatic Encroachment (SSI):** The truth conditions of "S knows that p" depend on the *context of the subject* (S). Specifically, the subject's practical stakes affect whether their evidence is sufficient for knowledge.
      *   **The Overlap:** In standard DeRose-style Bank Cases, the *speaker* and the *subject* are usually the same person (or in the same context). So, when stakes go up for the subject, they go up for the speaker. Both views predict "I don't know" in high stakes and "I know" in low stakes. This is why they look like notational variants.
      *   **The Divergence:** To separate them, we need a case where the *Speaker's Stakes* $\neq$ *Subject's Stakes*.

  3.  **Constructing the Divergent Case (The "Cross-Context" Case):**
      *   *Scenario:* We need a Subject (S) and an Attributor (A).
      *   *Evidence:* S has moderate evidence (e.g., was at the bank last Saturday).
      *   *Subject's Stakes:* High (e.g., S will lose their house if the check doesn't clear).
      *   *Attributor's Stakes:* Low (e.g., A is just gossiping, nothing depends on it).
      *   *Question:* Is the sentence "S knows that the bank is open" true or false when uttered by A?

  4.  **Predicting the Verdicts:**
      *   **Contextualism:** Truth depends on *Attributor's* standards.
          *   Attributor is in a Low Stakes context.
          *   Standards are Low.
          *   S's evidence meets Low standards.
          *   Verdict: **True**. ("S knows" is true.)
      *   **Pragmatic Encroachment (SSI):** Truth depends on *Subject's* practical situation.
          *   Subject is in a High Stakes situation.
          *   Evidence needs to be stronger to count as knowledge.
          *   S's evidence (moderate) does *not* meet High stakes requirements.
          *   Verdict: **False**. ("S knows" is false.)

      *   *Wait, check the reverse:*
      *   *Scenario 2:* Subject Low Stakes, Attributor High Stakes.
      *   **Contextualism:** Attributor High Stakes $\rightarrow$ High Standards $\rightarrow$ "S knows" is **False**.
      *   **SSI:** Subject Low Stakes $\rightarrow$ Low Threshold $\rightarrow$ "S knows" is **True**.

  5.  **Refining the Theoretical Work (The "Why"):**
      *   It's not just about stakes. It's about *what fixes the semantic content* vs. *what fixes the metaphysical status*.
      *   **Contextualism:** Semantics. "Knows" is indexical (like "tall" or "here"). The *meaning* shifts. SSI claims the meaning is invariant.
      *   **SSI:** Metaphysics/Epistemology. Knowledge itself is sensitive to practical facts. The *property* of knowledge shifts (or the conditions for possessing it shift), but the word "knows" means the same thing everywhere.
      *   **Key Distinction:** Who sets the bar? The Speaker (Contextualism) or the Subject (SSI)?

  6.  **Drafting the Response:**
      *   *Acknowledge the frustration:* It's a very common pedagogical hurdle. The Bank Case obscures the difference because Speaker = Subject.
      *   *The Core Mechanism:* Define the "Location of the Parameter."
          *   Contextualism: Parameter is in the *Context of Utterance* (Attributor).
          *   SSI: Parameter is in the *Context of the Subject*.
      *   *The Divergent Case (The "Gossip Case"):*
          *   Set up: Hannah (Subject) has high stakes. Sarah (Attributor) has low stakes.
          *   Hannah's evidence: Moderate (was there 2 weeks ago).
          *   Sarah says: "Hannah knows the bank is open."
          *   Contextualism Verdict: True (Sarah's context sets low standards).
          *   SSI Verdict: False (Hannah's stakes raise the bar).
      *   *Why this matters:* It shows they aren't notational variants because they make contradictory predictions about the truth value of the *same proposition* in the *same utterance context*.
      *   *Nuance/Caveats:* Mention "Moderate Contextualism" vs. "Radical Contextualism" (maybe too much detail? Keep it simple). Mention that SSI is a form of Invariantism (semantically), which is crucial.
      *   *Pedagogical Tip:* Use the "Tall" analogy.
          *   Contextualism: "Tall" depends on who is comparing (the speaker's context).
          *   SSI: "Tall" depends on the purpose of the person being measured (the subject's context). *Wait, that analogy might get messy.* Better to stick to the epistemic terms.
          *   Better Analogy: "Ready."
          *   Contextualism: "I'm ready" depends on what *I* (speaker) have in mind.
          *   SSI: "I'm ready" depends on what *I* (subject) actually need to do.
          *   *Actually, let's stick to the Bank Case variation, it's what they know.*

  7.  **Review and Refine:**
      *   Did I answer the specific prompt? Yes (theoretical work + divergent case).
      *   Is the distinction clear? Yes (Attributor vs. Subject parameters).
      *   Is the verdict clear? Yes (True vs. False).
      *   *Self-Correction on SSI:* Make sure to emphasize that SSI is *Invariantist* about the semantic content of 'knows'. That's the biggest "theoretical work" difference. Contextualism says 'knows' changes meaning. SSI says 'knows' means the same thing, but the *conditions* for satisfying it change based on the subject's practical environment.

  8.  **Final Polish:** Organize with clear headings. Use the Hannah/Sarah nomenclature (standard in literature). Ensure the tone is supportive of a fellow philosopher/teacher. (Proceed to generate output).

      *Wait, one nuance:* Some Contextualists might argue that in a gossip context, the standards are *always* low. Some SSI proponents might argue practical stakes aren't the *only* thing. But for the sake of the idealized theory comparison, the divergence holds. I should mention that this is the *canonical* way to distinguish them, even if real-world intuitions get muddy.

      *Another nuance:* Is it "Pragmatic Encroachment" or "SSI"? They are often used interchangeably in this context, though PE is the phenomenon and SSI is the semantic thesis. I will treat them as the user does (SSI as the view endorsing PE).

      *Let's build the "Gossip Case" explicitly.*
      Subject: Hannah (High Stakes).
      Attributor: Sarah (Low Stakes, just chatting).
      Sentence: "Hannah knows the bank is open."
      Contextualism: True.
      SSI: False.

      *Reverse Case:*
      Subject: Hannah (Low Stakes).
      Attributor: Sarah (High Stakes, needs to bet on Hannah's knowledge).
      Sentence: "Hannah knows the bank is open."
      Contextualism: False.
      SSI: True.

      This is the clearest way to present it.

      *Theoretical Work:* Semantics vs. Metaphysics of Knowledge.
      Contextualism: 'Knows' is indexical.
      SSI: 'Knows' is invariant, but knowledge is relationally sensitive to practical facts.

