answer: |-
  This is a fantastic question, and I can immediately tell you why your study group and your TAs were struggling to give you a straight answer. You have stumbled upon one of the most common mix-ups in contemporary philosophy.

  The short answer is: **You are conflating two different philosophers.**

  There is **P.F. Strawson** (Peter Frederick Strawson, 1919–2006), who wrote *"Freedom and Resentment"* (1962).
  There is **Galen Strawson** (born 1946), who is P.F. Strawson's **son**, and who formulated **"The Basic Argument"** (most famously in his 1986 and 1994 papers).

  The tension you are feeling isn't a contradiction within one philosopher's work; it is a fundamental disagreement between a father and his son.

  Here is the breakdown you need for your term paper to clear this up.

  ### 1. P.F. Strawson: *Freedom and Resentment* (The Optimist/Compatibilist)
  When your syllabus says "Strawson" in the context of *"Freedom and Resentment,"* it is referring to **P.F. Strawson**.

  *   **The View:** P.F. Strawson argues that the traditional debate between "optimists" (compatibilists) and "pessimists" (incompatibilists) is stuck because both sides accept a false premise: that moral responsibility requires a metaphysical justification (like being an uncaused cause).
  *   **The Move:** He shifts the ground from metaphysics to human psychology and social practice. He argues that "reactive attitudes" (resentment, gratitude, indignation) are natural, non-optional parts of human life. We don't choose to have them based on a theory of determinism; they are constitutive of our relationships.
  *   **The Conclusion:** Moral responsibility is real *because* these practices are real and unavoidable. To ask if we are "really" responsible in a metaphysical sense is to ask a question that has no grip on our actual lives. He is effectively defending the *practice* of responsibility against the skeptic.

  ### 2. Galen Strawson: *The Basic Argument* (The Pessimist/Impossibilist)
  The "Basic Argument" you described—the regress about *causa sui* (being the cause of oneself)—belongs to **Galen Strawson**.

  *   **The View:** Galen argues that for you to be truly morally responsible for an action, you must be responsible for the character/motives that produced the action. But to be responsible for *that* character, you must have chosen it based on some *prior* character. This leads to an infinite regress.
  *   **The Move:** Since humans cannot create themselves *ex nihilo* (from nothing), no one can be "ultimately responsible."
  *   **The Conclusion:** Ultimate moral responsibility is impossible. This is true whether determinism is true (because you didn't choose your causes) or false (because random indeterminism doesn't give you control either). Galen is a "hard incompatibilist" or "impossibilist."

  ### 3. Why the Confusion Happens (and why the TAs were stuck)
  It is incredibly easy to mix them up because:
  1.  They share a last name.
  2.  They both work on free will.
  3.  Galen explicitly frames his work in dialogue with his father's.

  However, the timeline proves they cannot be the same person revising their view. **P.F. Strawson died in 1976.** *"Freedom and Resentment"* was published in **1962**. Galen Strawson's formulation of the Basic Argument appeared in the **1980s and 90s**. P.F. could not have revised his view to adopt Galen's argument because he was deceased when Galen published it.

  The TA who said "he must have revised his view" was likely trying to be helpful but fell into the same trap you did. The TA who shrugged probably sensed the confusion but couldn't pinpoint the father/son distinction.

  ### 4. How to Handle This for Your Term Paper
  Since your paper is on "Strawson on responsibility," you need to clarify *which* Strawson you are discussing. Given that you were assigned *"Freedom and Resentment,"* your professor almost certainly wants you to focus on **P.F. Strawson**.

  However, acknowledging the distinction will make your paper stand out. Here is a suggested strategy:

  1.  **Explicitly distinguish them early on.** "While Galen Strawson has argued that ultimate responsibility is impossible via the Basic Argument, this paper focuses on P.F. Strawson's seminal 'Freedom and Resentment,' which defends the coherence of our responsibility practices."
  2.  **Address the "Skeptic" P.F. is fighting.** P.F. Strawson isn't fighting Galen (who wasn't publishing yet); he is fighting the "pessimist" who says determinism kills responsibility. P.F.'s point is that the pessimist's demand for "ultimate" responsibility is actually an intellectualist mistake.
  3.  **The Philosophical Tension:** Interestingly, P.F. Strawson would likely respond to Galen's Basic Argument by saying Galen is making the very mistake *"Freedom and Resentment"* warns against. P.F. would argue that Galen is demanding an "external rational vindication" for responsibility that we neither need nor can have. For P.F., the fact that we *cannot* be responsible in Galen's "ultimate" sense doesn't matter, because that's not what responsibility *is*. Responsibility is about being an appropriate target of reactive attitudes, not about being a *causa sui*.

  ### Summary
  *   **P.F. Strawson:** Responsibility is grounded in human nature (reactive attitudes). It is compatible with determinism. The demand for "ultimate" responsibility is a mistake.
  *   **Galen Strawson:** "Ultimate" responsibility is the only kind that matters. It is impossible. Therefore, moral responsibility is impossible.

  There is no tension in P.F. Strawson's work. The tension exists between the father's naturalistic compatibilism and the son's metaphysical impossibilism. Once you separate the two, your path forward for the paper should be much clearer.

  **Recommendation:** Double-check your syllabus to see if it specifies "P.F." or "Galen." If it just says "Strawson" alongside *"Freedom and Resentment,"* it is definitely P.F. If you mention the Galen distinction in your paper as a footnote or a clarifying point, your professor will likely be impressed that you caught the nuance.
