  I've been interviewing philosophers for a magazine piece on free will, which is probably why an exchange I overheard at a friend's birthday dinner has stayed with me. The toast was for Theo, a mutual friend who drifted through his twenties and then spent a decade building a small furniture business from nothing. (1) Mara called this proof that Theo had made himself through sheer discipline. (2) Owen said that's an illusion: the discipline itself came from a temperament and upbringing Theo never chose, so crediting him for it is just praising luck under a nicer name. (3) Mara answered that Theo has spent ten years of choices since then reinforcing and redirecting that temperament -- staying sober, doing the books at midnight -- and that accumulated pattern of self-management is what makes the business his doing now, not just his starting point. (4) Owen said: push it back one step further -- each of those disciplined choices was made by whichever Theo existed at the time, a Theo he hadn't authored either, so the story just relocates the unchosen starting point instead of removing it. (5) Mara said that standard would make it impossible for anyone to be truly responsible, for good or ill, for anything they do, which can't be right given how well our ordinary practices of crediting and blaming people obviously work. (6) Owen said that's true, and beside the point: those practices can be useful, and even fitting in an everyday sense, without amounting to the deep kind of authorship Mara invoked at the toast. (7) Grasping for another angle, Mara said that if some of Theo's choices weren't strictly fixed by his prior self -- if there was real chanciness in the mix -- then things really could have gone otherwise, and that openness is what makes the outcome his. (8) Owen said an undetermined twitch is even less "his" than an unchosen character would be, so that move makes her case worse, not better.

