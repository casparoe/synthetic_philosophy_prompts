      *Strategy:* Use the second person "You" but apply it to both simultaneously? Or stick to third person plural "They" but describe the singular sensation.
      *Better:* Focus on the *mirror*. The room is a sphere. They stand at opposite poles.
      *Wait, Black's spheres don't have an observer.* If I add an observer, the observer breaks symmetry unless the observer is also doubled.
      *Let's double the observer.* Two observers, two subjects.
