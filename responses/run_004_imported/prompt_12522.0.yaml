      *   **Climax:** The attempt to differentiate. Trying to find a scar, a memory, a preference. Finding none.
      *   **Ending:** The acceptance of the paradox. They act as one to defy the command, or they merge. Let's have them refuse the distinction.

  6.  **Writing - Section by Section:**
      *   *Opening:* Describe the white room. The two figures. Emphasize the lack of reference points.
