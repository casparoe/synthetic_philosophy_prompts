  4.  **Addressing the Philosophical Constraint (The "Smuggling" Risk):**
      *   I must be careful not to say "One looked at the Other." If they look, they both look.
      *   I must not say "One felt sad." They both feel sad.
      *   The narrative voice must reflect the duality without assigning unique properties.
      *   *Challenge:* How to create tension if everything happens twice?
      *   *Answer:* The tension is internal to the *pair*. The system demands singularity. The pair is a glitch.

  5.  **Developing the Narrative Arc:**
      *   **Beginning:** Establish the symmetry. The environment is perfect. The two entities wake up.
