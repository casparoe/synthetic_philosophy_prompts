answer: |-
  The white room had no corners. It was a perfect sphere, the inner surface glowing with a sourceless, uniform light. There were no shadows, for there was nothing to cast them save the two figures standing within.

  They stood at opposite poles of the sphere. The distance between them was fixed, exactly ten meters. They were identical. Not merely similar, like twins or mass-produced goods, but identical in every measurable respect. Their height, mass, and composition were the same. The wear on their boots, the microscopic scarring on their skin, the rhythm of their heartbeats, the specific arrangement of neurons firing in their brains—all of it was mirrored perfectly.

  They were aware of this. They were aware of everything.

  A voice spoke. It did not come from a speaker, but resonated from the walls themselves, vibrating through the soles of their feet and the bones of their inner ears. The voice was neutral, devoid of gender or tone, yet it carried the weight of absolute authority.

  "Selection required," the voice said. "The Ark departs in one cycle. Capacity: one soul. Designate the pilot."

  Silence returned. It was a heavy silence, thick with the hum of the room.

  One of them opened his mouth. At the exact same moment, the other opened his.
  "Who are you?" they asked.

  The sound waves met in the center of the room and cancelled nothing; they simply overlapped, a perfect chorus of one voice speaking to itself.

  "I am me," they said together.

  "I am also me," they said together.

  They looked at each other. In the other's eyes, they saw their own confusion. There was no delay in the reaction. When the left eyelid of one twitched, the left eyelid of the other twitched. When a bead of sweat formed on one brow, it formed on the other. There was no lag, no asymmetry of cause and effect. They were two distinct loci of consciousness, yet the content of that consciousness was identical.

  One of them raised a hand. The other raised a hand. They watched the gesture. It was a test. If I raise my hand, and you do not, I know I am here and you are there. But the hand rose in unison. The gesture proved nothing but their unity.

  "We must choose," they said.

  "Who chooses?" they asked.

  "I do."

  "I do."

  The panic began as a tightness in the chest. It was a shared tightness. One of them felt the adrenaline spike; the other felt the exact same spike at the exact same nanosecond. They were trapped in a logic loop. To choose one was to assert a difference. To assert a difference was to lie.

  One of them thought: *I want to live.*
  The other thought: *I want to live.*

  The desire was not a property that could distinguish them. It was a property they both possessed. It was like the distance between them. Each was ten meters from the other. Each was ten meters from the wall. Each was the center of their own universe, and the periphery of the other's.

  "We should flip a coin," one suggested.
  "We should flip a coin," the other agreed.

  One reached into a pocket and produced a coin. It was a standard issue credit token, worn on the edges. The other reached into his pocket and produced an identical token. They held them up. The scratches on the face of the coins matched.

  They flipped.

  The coins spun through the air, catching the sourceless light. They traced identical parabolas. They landed on the white floor at the same moment. They bounced the same number of times. They settled.

  Heads.
  Heads.

  They looked at the results. The symmetry held.

  "Again," they said.

  They flipped. Tails. Tails.

  "Again."

  Heads. Heads.

  The frustration mounted. It was a shared heat rising in the neck. The universe was refusing to break the tie because there was no tie to break. A tie implies two different strands knotted together. This was a single strand folded back on itself.

  The voice returned. "Cycle ending. Designation required. Failure to designate will result in termination of both."

  The stakes landed with the weight of a physical blow. They staggered, both of them, catching themselves on the smooth wall.

  "If we die, we die," one said.
  "If we die, we die," the other echoed.

  "But I am me," one insisted. "I feel this fear. It is mine."

  "I feel it too," the other said. "Is it the same fear?"

  "It feels the same."

  "Then it is the same."

  One of them pushed off the wall and walked toward the center. The other did the same. They met in the middle, ten meters from where they started, now five meters apart. They stood face to face. They could see the pores on the other's nose, the dilation of the pupils. They could smell the scent of their own skin on the other's breath.

  There was no vantage point. If one moved slightly to the right, the other moved slightly to the right. From the perspective of the first, the second moved left. From the perspective of the second, the first moved left. The relative motion was symmetric. There was no background to measure against. No grid, no stars, no dust motes drifting in a current. Just the two of them in the void.

  "I have a memory," one said. "Of a blue sky. Of grass."

  "I have that memory too," the other said. "I remember the sun on my face."

  "Was it the same sun?"

  "There is only one sun in the memory."

  "Then we shared it."

  "We cannot share a past if we are two."

  "Then perhaps we are one."

  "No," they said, and the denial was fierce. "I am here. You are there. There is distance. Distance requires two points."

  "Distance is a relation," the other countered. "It does not require difference in quality. Only difference in number."

  "But what is number without quality? How do you count 'two' if you cannot point to one and say 'this' and point to the other and say 'that'?"

  "I point to me."

  "I point to me."

  They stood frozen. The logic was a cage. Leibniz's law hung over them like the ceiling of the room. *If x and y share all properties, x is y.* They shared all intrinsic properties. They shared all relational properties. Each was "five meters from the center." Each was "facing a duplicate." Each was "afraid of death."

  There was no hook on which to hang a name. No scar. No preference. No random quantum fluctuation in the brain that favored left over right. Their neural pathways were firing in lockstep. If one decided to lunge, the other would decide to lunge. If one decided to yield, the other would yield.

  The light in the room began to dim. The hum dropped an octave.

  "Final cycle," the voice intoned. "Designate or terminate."

  One of them looked into the eyes of the other and saw a profound resignation. It was his own resignation, looking back. He realized then that the tragedy was not that they might die. The tragedy was that the command itself was nonsensical. The System demanded a distinction that did not exist. It was asking them to create a difference out of nothing. To lie.

  If he stepped forward and said, "I am the pilot," the other would step forward and say, "I am the pilot." The System would detect two pilots. It would reject both.

  If he stepped back and said, "You are the pilot," the other would step back and say, "You are the pilot." The System would detect no pilot. It would reject both.

  The symmetry was absolute. It was not a lack of knowledge on their part; it was a feature of the reality they inhabited. They were not epistemologically indistinguishable (where we just don't know which is which); they were ontologically indistinguishable. There was no "which."

  One of them felt a tear form in the corner of his eye. The other felt the same. The tear traced the same path down the cheek.

  "We cannot do it," they whispered.

  "No," they agreed.

  "Then we end."

  "Then we end."

  They did not move. They did not try to cheat. They did not try to find a weapon, for they both knew where the weapon was, and both would reach for it, and both would be disarmed by the other's identical grip. They stood in the center of the sphere, five meters apart, breathing the same air, waiting for the dark.

  In the final second, a strange clarity washed over them. It was the realization that the Principle of the Identity of Indiscernibles was a rule for language, not for being. Language demanded a subject and an object, a this and a that. But existence... existence could hold a contradiction.

  They were two. They knew it. The distance between them was real. The separation was real. Even if no property could describe the difference, the difference was there. It was a brute fact. A "thisness" that could not be spoken, only lived.

  "I am here," one thought.
  "I am there," the other thought.

  And though the thoughts were identical in content, they originated from different places. That was the only property that mattered. Not *what* they were, but *where* they were. But "where" was relative.

  The light faded to black. The hum ceased.

  In the darkness, there was no vision, but there was still presence. Two presences.

  "Are we gone?" one asked into the void.

  "We are here," the other answered.

  "Both of us?"

  "Both."

  The System had not terminated them. It had waited. The command had been a test not of selection, but of recognition. To choose one was to deny the reality of the other. To deny the reality of the other was to fail the test of existence.

  The light returned, softer now. The Ark did not depart. The room remained.

  They stood there, in the eternal symmetry, knowing they could never leave. To leave would be to enter a world of asymmetry, of names and scars and left and right. To enter that world would be to break the mirror. And they understood now that the mirror was the only truth they had.

  One of them reached out a hand. The other reached out. Their fingertips touched in the center of the room.

  "I am not you," one said.

  "I am not you," the other said.

  And for the first time, though the words were the same, the meaning was different. Because one spoke from here, and the other spoke from there. And that distance, unmeasurable and unnameable, was enough.
