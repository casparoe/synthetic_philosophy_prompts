  You have identified the single most significant objection to the standard money-pump argument, one that is widely discussed in decision theory literature. Your intuition is correct: the **simple** money pump relies entirely on the agent being **myopic** (focusing only on the immediate trade) rather than **sophisticated** (anticipating future trades).

  If an agent can look ahead and see that trading $A \to B \to C \to A$ results in a net loss, a sophisticated agent will simply refuse the first trade (or the last). This limits the cost to a one-time learning error rather than an infinite pump.

  However, whether this "defuses" the argument depends on what you think the money pump is supposed to prove. Here is the breakdown of why your escape works, but why philosophers still think cyclic preferences are defective.

  ### 1. The Distinction: Myopic vs. Sophisticated Choice
  You are describing the difference between two modes of decision-making:
  *   **Myopic Choice:** The agent evaluates each node in the decision tree independently. At node 1, they prefer $B$ to $A$. At node 2, they prefer $C$ to $B$. At node 3, they prefer $A$ to $C$. They get pumped.
  *   **Sophisticated Choice:** The agent uses backward induction. They realize that if they reach node 3, they will trade $C$ for $A$ (losing money). Knowing this, at node 2 they realize trading $B$ for $C$ leads to a loss. Knowing *that*, at node 1 they refuse to trade $A$ for $B$.

  As you noted, a sophisticated agent with cyclic preferences suffers no infinite loss. This suggests the money pump demonstrates **diachronic inconsistency** (vulnerability over time) rather than **synchronic inconsistency** (logical contradiction at a time).

  ### 2. Does your escape assume something unavailable?
  You asked: *"Does my proposed escape quietly assume something that an agent with genuinely cyclic preferences wouldn't actually have available to it?"*

  **Yes, it does.** It assumes the agent has preferences over **plans** or **sequences**, not just pairwise outcomes.

  If an agent's preferences are *defined* strictly as local dispositions to choose $X$ over $Y$ when presented with the pair $\{X, Y\}$, then the agent literally lacks the cognitive architecture to view the sequence $A \to B \to C \to A$ as a single object to be rejected. To "stop the pump," the agent must prioritize a global goal (preserve wealth) over a local preference (swap $C$ for $A$).

  Defenders of transitivity argue that if you have to **override** your local preferences to avoid losing money, those local preferences are defective. A rational agent's local preferences should align with their global interests automatically. If they don't, the preferences are the problem, not the agent's attention span.

  ### 3. Advanced Money Pumps
  Philosophers have developed "Dynamic Money Pumps" to close the loophole you identified.
  *   **The Forced-Trade Scenario:** If the environment is structured such that you *must* make a choice at every node (you cannot "hold"), a cyclic agent is forced to loop regardless of sophistication.
  *   **Gustafsson's Arguments:** In his 2022 monograph *The Money Pump Arguments*, Johan Gustafsson argues that even sophisticated agents can be pumped if the choice situation is framed correctly. For example, if refusing a trade leads to an outcome the agent ranks lower than the pumped outcome (based on their own cyclic rankings), they are forced to accept the trade.

  These advanced arguments attempt to show that cyclic preferences violate **Dynamic Consistency**: the requirement that a plan chosen at the start should still be choosable at later stages. Cyclic preferences make it impossible to be dynamically consistent without imposing external constraints on yourself.

  ### 4. Synchronic vs. Diachronic Rationality
  Your conclusion is that the argument is about "diachronic exploitability... rather than about any defect in the preferences themselves."

  This is a respected minority view (often associated with **preference constructionism** or **behavioral economics**). However, the orthodox view in decision theory is that **diachronic vulnerability reveals a synchronic defect.**

  Consider an analogy with logic:
  *   If I believe $P$, and I believe $P \implies Q$, but I disbelieve $Q$, I have a synchronic logical contradiction.
  *   I might not *notice* the contradiction immediately (a diachronic failure).
  *   The fact that I can avoid acting on the contradiction by thinking harder doesn't mean the contradiction wasn't there in the belief set.

  Similarly, the money pump argues that cyclic preferences contain a "practical contradiction." The fact that a clever agent can navigate around it doesn't mean the preferences are consistent; it just means the agent is smart enough to mitigate their own inconsistency.

  ### Summary
  You are right that the **simple** money pump fails against a sophisticated agent. However, the broader philosophical case is that **rationality requires your local choices to align with your global interests without constant policing.**

  If your preferences force you to choose between "acting on your preferences" and "keeping your money," the preferences are arguably irrational. Your escape assumes the agent can form preferences over *sequences*, which contradicts the definition of an agent whose preferences are *only* over pairwise comparisons.

  **Recommended Reading:**
  *   **Johan Gustafsson, *The Money Pump Arguments* (2022):** The definitive modern defense, addressing exactly the "sophisticated choice" objection you raised.
  *   **Edward McClennen, *Rationality and Dynamic Choice* (1990):** Argues that we should abandon separability and allow for "resolute choice," which aligns more with your intuition that agents can commit to plans despite cyclic temptations.
  *   **Rabinowicz, "Money Pump with Foresight":** Discusses whether foresight saves the cyclic agent. (Spoiler: It complicates things, but doesn't fully save them).
