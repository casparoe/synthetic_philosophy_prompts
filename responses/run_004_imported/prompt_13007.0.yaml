  1.  **Analyze the User's Situation:**
      *   **Context:** Dividing a late father's estate with a brother. Mediation starts next week.
      *   **The Trigger:** Brother emailed the *whole family* stating he has instructed his attorney to accept *nothing less than the lake house*, and it's "final and non-negotiable."
      *   **The Advice Received:** A close friend (commercial negotiator) advises matching this move: lock the user's attorney into an equally firm, public demand. The theory is "commitment tactics" (whoever commits hardest wins).
      *   **User's Intuition:** The user feels this is dangerous. If both do it, it creates a stalemate (Prisoner's Dilemma/Chicken Game), leads to litigation, burns assets, and damages the relationship permanently.
      *   **The Question:** Was the friend right? Is there genuine danger? What should the user do instead?

  2.  **Evaluate the Friend's Advice (Commercial Negotiation vs. Family Mediation):**
      *   *Commercial Context:* In business, "burning bridges" or making credible commitments can work because the goal is often maximizing value in a one-off transaction. Relationships matter less.
      *   *Family Context:* Relationships are ongoing (even if strained). Emotions run high. The "asset" isn't just money; it's history, sentiment, and family dynamics.
      *   *The Tactic:* This is a "commitment strategy" or "brinkmanship." It relies on the other side backing down to avoid conflict.
      *   *The Risk:* If both sides play it, it's a game of "Chicken." If neither swerves, the crash (litigation) happens. In estate disputes, litigation costs often exceed the value of the disputed asset.
      *   *Verdict:* The friend's advice is risky and likely inappropriate for this specific context. The user's intuition is correct.

  3.  **Analyze the Brother's Move:**
      *   *Public Email:* Telling the *whole family* is a pressure tactic. It's designed to shame the user into compliance or rally family support. It's aggressive.
      *   *"Final and Non-Negotiable":* This is likely a bluff or an emotional position, not necessarily a legal reality. In mediation, almost nothing is truly non-negotiable until a settlement is signed.
      *   *Motivation:* Why the lake house? Sentimental value? Financial value? Control?

  4.  **Determine the Best Strategy for the User:**
