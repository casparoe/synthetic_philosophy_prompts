      *   **Informational vs. Reputational Herding:** Distinguish between doing what others do because you think they know something (informational/rational) vs. doing it to fit in (psychological/reputational).
      *   **Public Signals:** The basic model assumes only *actions* are observed. If *public news* arrives, the cascade breaks.
