answer: |-
  This is an exceptionally sharp observation, and it touches on one of the most counterintuitive results in the economics of information. However, the conclusion you are drawing—that the fragility of real-world herding implies psychological panic rather than rational updating—is actually the reverse of what the standard models predict.

  The sudden collapse of a cascade in response to small news is not evidence *against* the rational Bayesian model; it is a specific, derived **feature** of that model. In the literature, this is known as the **fragility of information cascades**.

  Here is why the rational model predicts instability, and why "panic" might actually be a less accurate descriptor for these collapses than "rapid Bayesian correction."

  ### 1. Cascades are Informationally Efficient, Not Informationally Rich
  Your intuition suggests that once a crowd coordinates, the equilibrium should be stable because "nobody has any private incentive to break from it." While it is true that no *individual* wants to deviate unilaterally, the collective knowledge underpinning that decision is surprisingly thin.

  In the Bikhchandani, Hirshleifer, and Welch (BHW) model, once a cascade begins, agents stop revealing their private information through their actions. If everyone is investing regardless of their signal, an observer cannot tell if the tenth agent invested because they had a good signal or because they were following the herd.

  Consequently, **information aggregation stops.** The public pool of information freezes at the level it was when the cascade started. A cascade triggered after two agents might rest on the informational weight of only those two signals. The subsequent 1,000 agents add *zero* new information to the public record.

  ### 2. The Mechanism of Collapse
  Because the "weight" of the cascade is finite (often equivalent to just a few signal realizations), it does not take a massive shock to overturn it.

  If a new piece of public information arrives (e.g., a regulatory report, an earnings miss, a credible rumor), agents update their priors. Since the cascade was resting on a small informational base, even a moderately informative public signal can outweigh the entire history of past actions.

  When this happens, every rational agent updates simultaneously. The cascade breaks, and agents revert to following their private signals. To an outside observer, this looks like a sudden stampede in the opposite direction. However, mathematically, it is simply the result of many agents independently recalculating the same Bayesian equation and arriving at the same new conclusion at the same time.

  **Therefore, suddenness is a hallmark of rational herding, not necessarily psychological panic.** Psychological conformity (social pressure) would likely be *more* sticky; you might resist breaking a social norm even with contrary evidence. Rational herding dissolves the moment the math no longer supports it.

  ### 3. Distinguishing Informational vs. Reputational Herding
  Your question hints at a distinction that the literature makes between two types of herding:

  *   **Informational Herding (BHW/Banerjee):** I do what you do because I think you know something I don't. This is fragile, as described above.
  *   **Reputational Herding (Scharfstein & Stein, 1990):** I do what you do because if I differ and am wrong, I look incompetent. If we all jump together and are wrong, we all look bad together ("no one got fired for buying IBM").

  Reputational herding can indeed be more stable than informational herding because the incentive is tied to career concerns rather than truth-seeking. However, even reputational cascades can break if the public signal makes the "old" consensus professionally toxic.

  ### 4. Why It *Feels* Like Panic
  If the mechanism is rational, why does it feel like panic?

  1.  **Speed:** Because the cascade rests on thin information, the correction is instantaneous. Human observers interpret speed as emotion.
  2.  **Correlation:** When everyone moves at once, it creates a liquidity shock or a visible crowd effect, which triggers feedback loops not present in the static model.
  3.  **Model Limitations:** The standard BHW model is static and discrete. In reality, prices adjust. If prices adjust continuously (as in Avery and Zemsky, 1998), cascades might not form in the same way, or they might be more robust. However, when they do break in market settings, the combination of rational updating and market mechanics (margin calls, stop-losses) can amplify the rational move into a crash that *looks* like panic.

  ### 5. Global Games and Common Knowledge
  A further refinement comes from the "Global Games" literature (Morris and Shin). They show that when there is a tiny amount of noise in agents' knowledge of the fundamentals, the multiplicity of equilibria (stable vs. unstable) is resolved.

  In these models, coordination is precarious not because agents are irrational, but because they are uncertain about *other agents' certainty*. A small piece of news can shift the "common knowledge" threshold, causing a sudden switch from one equilibrium to another. This again suggests that sudden shifts are a property of rational coordination under uncertainty, not necessarily a deviation from rationality.

  ### Summary
  You have correctly identified that real-world cascades are fragile. However, the standard rational models **predict this fragility explicitly.**

  *   **Rational Cascades:** Rest on a finite amount of aggregated information. Highly susceptible to public news. Collapse is sudden and simultaneous.
  *   **Psychological Herding:** Rests on social utility or conformity. Potentially more resistant to factual news, but susceptible to shifts in social sentiment.

  The fact that fads and bubbles unravel on "small news" is actually strong evidence **for** the informational cascade model. If herding were purely psychological conformity, we would expect the crowd to resist contradictory evidence longer. The fact that they flip instantly suggests they were waiting for a public signal to validate what their private signals might have already been telling them.

  The "panic" is often just the visible manifestation of a latent rationality that was previously suppressed by the incentive to herd.
