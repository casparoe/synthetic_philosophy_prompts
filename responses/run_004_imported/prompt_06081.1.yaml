prompt: |-
  I sit on the student conduct board at my university, which adjudicates academic-integrity cases referred by faculty and staff; I joined this year, and the matter below is the first contested hearing I've had to help resolve. A graduate teaching assistant has filed a complaint against an undergraduate, alleging that several paragraphs of her term paper were copied nearly verbatim from an online study guide, and the copying itself is not seriously disputed. Partway through the hearing, the student's faculty advisor disclosed, and the TA confirmed under questioning, that the TA himself was found responsible for a very similar plagiarism violation as an undergraduate at another institution eight years ago. That finding was fully adjudicated and, per the other institution's policy, expunged from his record after he completed a semester of probation; he did not volunteer this history when he took on the TA role, though nothing in our policies required him to. The board is now split roughly in half: some members think this history disqualifies him from bringing the complaint at all, or at least so compromises the proceeding that the case should be dismissed or any sanction sharply reduced, while others think the student's guilt is a separate question from the TA's past, and that giving the past any weight would effectively let students escape sanction whenever their accuser turns out to be imperfect, expunged record or not. Our bylaws state who may file a complaint but say nothing about whether a complainant's own disciplinary history bears on how a complaint should be handled.

  Please draft the written decision I will circulate to the full board before we reconvene next week, and eventually to both parties. It should reach a concrete disposition of the plagiarism case itself, including any sanction or lack thereof; a concrete disposition of what, if anything, follows from the TA's history and non-disclosure, and on what timeline; and reasoning specific enough that a skeptical board member could follow it point by point and push back on any step. In particular, take seriously the strongest version of the view that the TA's history is relevant to how this case should proceed -- not the strawman that his past makes him a liar -- even if your recommendation ultimately gives that view little or no weight.
reasoning: |-
  Here's a thinking process that leads to the suggested decision draft:

  1.  **Analyze the Request:**
      *   **Role:** Member of a University Student Conduct Board.
      *   **Task:** Draft a written decision to circulate to the full board (before reconvening) and eventually to both parties (TA and Undergraduate Student).
      *   **Context:** First contested hearing for the writer. Graduate TA accused Undergraduate of plagiarism (nearly verbatim copying). Plagiarism is not seriously disputed.
      *   **Complication:** Mid-hearing, it was revealed the TA had a similar plagiarism violation as an undergrad at another institution 8 years ago (expunged after probation). He didn't volunteer this, though not required by policy.
      *   **Board Split:** Half think TA's history disqualifies him/compromises proceedings (dismiss/reduce sanction). Half think student's guilt is separate (tu quoque fallacy concern).
      *   **Bylaws:** State who may file, silent on complainant's disciplinary history.
      *   **Requirements:** Concrete disposition of the plagiarism case (sanction/no sanction). Concrete disposition of the TA's history/non-disclosure (action/timeline). Reasoning must be specific, logical, and address the strongest version of the "relevance" argument (not just ad hominem). Tone should be formal, impartial, and persuasive.

  2.  **Determine the Stance/Outcome:**
      *   *Plagiarism Case:* The copying is "not seriously disputed." Academic integrity policies usually focus on the act, not the accuser. Dismissing a valid finding of plagiarism because the accuser once plagiarized undermines the integrity of the institution's standards. *Decision: Responsible.*
      *   *TA's History:* The record is expunged. Policy didn't require disclosure. However, the *appearance* of bias or hypocrisy is real. But does it invalidate the *evidence*? No. Does it warrant sanctioning the TA now? Probably not, as he followed policy (no requirement to disclose) and the record is expunged (treated as if it didn't happen for most purposes). However, the Board should address the *process* concern. *Decision: No sanction for TA, but clarify policy/procedure for future.*
      *   *Sanction for Student:* Needs to be proportional. Since it's a first offense (presumably, based on the prompt not mentioning prior offenses for the *student*), educational sanctions are usually preferred over suspension/expulsion, but verbatim copying is serious. *Decision: Educational sanction + Grade Penalty.*
      *   *Reasoning:* Must tackle the "Clean Hands" doctrine argument seriously. Why doesn't it apply here? Because academic integrity is an institutional standard, not a private contract dispute.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard formal memo format (To, From, Date, Subject).
      *   **Introduction:** State the purpose of the memo (preliminary findings/recommendation for deliberation). Acknowledge the complexity.
      *   **Factual Background:** Briefly summarize the plagiarism (undisputed) and the TA's history (confirmed, expunged, non-mandatory disclosure).
      *   **Issue 1: The Student's Responsibility (The Plagiarism):**
          *   *Finding:* Responsible.
          *   *Reasoning:* Evidence is objective (text matching). The standard is the student's work, not the accuser's character. Address the "Clean Hands" argument: Academic integrity protects the institution's degree value, not just interpersonal fairness. If we dismiss, we devalue the degree for everyone.
      *   **Issue 2: The TA's History and Non-Disclosure:**
          *   *Finding:* No procedural violation, no sanction.
          *   *Reasoning:* Expungement means it's legally/administratively "gone." No policy required disclosure. To punish now violates the spirit of expungement.
          *   *Caveat:* Acknowledge the *perception* issue. Recommend a policy review (not for this case, but for future).
      *   **Sanctioning (Student):**
          *   Need to be firm but educational. F on paper? Educational module? Probation? Let's go with F on assignment + Academic Integrity Workshop + Disciplinary Probation (semester).
      *   **Sanctioning (TA):**
          *   None regarding this case.
      *   **Conclusion/Next Steps:** Call for vote/discussion.

  4.  **Refining the Argument (The "Skeptical Board Member" Test):**
      *   *Skeptic:* "But if the TA cheated, he's hypocritical. His testimony is tainted."
      *   *Counter:* The testimony isn't about his character; it's about text matching. The evidence stands on its own.
      *   *Skeptic:* "But it chills reporting if students think TAs are hypocrites."
      *   *Counter:* It chills integrity more if we let cheating slide because the reporter isn't perfect.
      *   *Skeptic:* "Expungement shouldn't hide moral fitness."
      *   *Counter:* Expungement is a social contract. If we punish him for an expunged record, we break that contract and discourage rehabilitation.

  5.  **Tone Check:**
      *   Needs to be judicial, not personal.
      *   Needs to show empathy for the split board.
      *   Needs to be clear that this is a *draft for discussion*, not a final verdict (since the prompt says "before we reconvene"). *Correction:* The prompt asks for the "written decision I will circulate to the full board... and eventually to both parties." This implies it needs to be written *as* the decision, but circulated *before* the final vote to guide discussion? Or is it the final decision?
      *   *Re-reading:* "Draft the written decision I will circulate to the full board before we reconvene next week, and eventually to both parties." This is slightly ambiguous. Usually, you circulate a *draft opinion* to colleagues to align, then issue the *final decision*. However, the prompt asks for the "decision... eventually to both parties." I will frame it as a **Proposed Findings and Recommendations** memo. It serves as the basis for the final vote but is written with the authority of a final decision so it can be adapted easily. Actually, to be safe and most useful for the user, I will write it as a **Memorandum of Proposed Findings and Sanctions**. This allows the board to debate it next week, but it is structured so that once voted on, it becomes the formal decision letter.
      *   *Wait, looking closer:* "Draft the written decision I will circulate... before we reconvene... and eventually to both parties." This suggests the document *is* the decision, but it's being shared early for buy-in. I will write it as a **Draft Decision for Board Review**. This distinguishes it from the final letter sent to students (which might need slight formatting changes) but contains the substantive logic.
      *   *Actually, best approach:* Write it as a **Board Memorandum: Preliminary Findings and Recommended Disposition**. This is internal-facing but written with the rigor of an external decision. This allows the board to critique the logic before it becomes binding. *Correction:* The prompt says "eventually to both parties." So the text must be appropriate for the students to read. I will write it as a **Formal Decision of the Conduct Board** but mark it as **DRAFT FOR BOARD DELIBERATION** at the top. This ensures the tone is right for the students but the function is right for the board.

  6.  **Addressing the "Strongest Version" of the Counter-Argument:**
      *   I need to explicitly articulate why some board members feel the TA's history matters. It's not just "he's a liar." It's about *procedural fairness* and *institutional credibility*. If the enforcer of the rule is a known violator of the same rule, does the enforcement lack legitimacy? I need to refute this by distinguishing between *personal legitimacy* and *evidentiary validity*.

  7.  **Final Polish:**
      *   Check constraints: Concrete disposition? Yes. Timeline? Yes. Reasoning? Yes.
      *   Ensure the expungement aspect is handled carefully (privacy vs. transparency).
      *   Ensure the student's sanction is clear.

  8.  **Self-Correction during drafting:**
      *   *Initial thought:* Maybe recommend a sanction for the TA for not disclosing.
      *   *Correction:* No, prompt says "nothing in our policies required him to." Sanctioning him would be retroactive punishment and violate the expungement agreement of the other university. I must recommend *no action* against the TA regarding this specific issue, but perhaps recommend a policy review.
      *   *Initial thought:* Dismiss the case.
      *   *Correction:* No, plagiarism is undisputed. Dismissing would be malpractice.
      *   *Tone:* Needs to be firm on integrity but fair on procedure.

  9.  **Structure:**
      *   Header.
      *   Introduction (Procedural Posture).
      *   Findings of Fact.
      *   Analysis I: The Student's Liability (Addressing the "Clean Hands" argument).
      *   Analysis II: The Complainant's History (Addressing Expungement & Disclosure).
      *   Sanctions & Disposition.
      *   Policy Recommendation (for the University, not the parties).
      *   Conclusion.

  10. (Final Review against Prompt): "Reasoning specific enough that a skeptical board member could follow it point by point and push back on any step." -> I will use numbered paragraphs for the reasoning sections.

