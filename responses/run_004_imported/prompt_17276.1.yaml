answer: |-
  Here are nine questions tailored to your background in ethology and the specific constraints of your reading group. They are ordered to move from the biological mechanics (where you have common ground) toward the metaphysical implications (where the friction lies), ending with the scope of the theory.

  I have included the Swampman follow-up as a conditional branch (Question 6b), anticipating her likely defense regarding intuitions.

  ### 1. The Producer-Consumer Mapping
  "In my fieldwork, we often treated signals as dyadic: a sender and a receiver. But Millikan's 'producer-consumer' model seems to demand a tighter coupling than just 'signaler and audience.' When you look at a honeybee dance, the 'consumer' mechanism isn't just watching; it's using vector data to navigate. My question is: How specific does the consumer mechanism have to be? If a bee uses the dance to find food, but *also* uses it to locate a new nest site, does the content of the dance shift depending on which consumer mechanism is active, or is the content fixed at the producer end?"

  ### 2. The Indeterminacy Problem (The Frog)
  "Let's press on the historical record. You argue the frog's snapping mechanism has the content 'fly' because that's what it was selected for. But in the ancestral environment, 'fly,' 'BB pellet,' and 'small dark moving thing' were coextensive. The mechanism never encountered a BB pellet before, so it never failed to catch a BB. What licenses us to say the content is specifically *fly* rather than *small dark moving thing*? Is there a fact of the matter in the selection history that distinguishes these, or does the content remain indeterminate until the mechanism fails in a specific way?"

  ### 3. The Ubiquity Problem (Thermostats & Clotting)
  "One worry my group had was that 'proper function' seems to apply to almost any homeostatic system. Blood clotting has a proper function; a house thermostat has a function. Both correct errors. Why does the clotting mechanism or the thermostat not qualify as having representational content? Is the difference simply that the frog's mechanism involves a map-like mediation, or is there a principled line in the teleosemantic framework that prevents representation from being everywhere there is biological function?"

  ### 4. Ancestral Mismatch (Novel Environments)
  "This is where my fieldwork experience bugs me. Animals end up in captivity, or climates shift, or they encounter evolutionarily novel stimuli like refined sugar or LED screens. If a human craves sugar, is the content of that craving 'high-calorie fruit' (the ancestral referent) or 'sucrose' (the current object)? If you say it's frozen on the ancestral referent, it seems the content is systematically false in the modern world. If you say it shifts, what mechanism updates the proper function faster than selection does?"

  ### 5. Learning vs. Instinct
  "Teleosemantics handles innate reflexes well, but what about learned associations? If a rat learns that a lever press yields food, the 'producer' of that belief is a learning mechanism, not a direct selection history of that specific belief. Does the content of the rat's belief derive from the proper function of the *learning mechanism* generally, or does the specific token history of that rat matter? I worry that if it's just the general learning mechanism, the content becomes too generic to explain specific errors."

  ### 6. The Swampman Case
  "Let's hit the metaphysical deep end. A Swampman is a molecule-for-molecule duplicate of a person but has no selection history—he just popped into existence. On your view, he has no thoughts with content, because he has no history of proper function. To many, the idea that he is behaviorally identical to a human but mentally empty seems untenable. Why should we accept that a lack of history entails a lack of mind, rather than just a lack of *etiology*?"

  ### 6b. Follow-up (If she argues "Intuitions are unreliable")
  *(Note: Use this only if she dismisses the Swampman intuition as folk-psychological baggage.)*
  "I understand that appeal to intuition isn't a proof. But if the theory tells us that a being who speaks, reasons, and acts exactly like us has *no thoughts*, we have to ask: what work is the concept of 'content' doing here? If teleosemantics diverges completely from phenomenology and behavioral capacity, does it risk becoming a theory of biological history rather than a theory of *mind*? How do we validate the theory if it contradicts the very data—the existence of thought—it was meant to explain?"

  ### 7. Deriving Normativity from History
  "You ground the 'norm' in statistical success over generations—what worked got reproduced. But there's a gap between 'what happened to work' and 'what ought to happen.' A mutation might fail simply due to bad luck, not malfunction. How do you distinguish a statistical anomaly in the reproductive record from a genuine normative failure? At what point does the 'is' of selection history become the 'ought' of proper function?"

  ### 8. Scaling to Human Language
  "Animal signals are mostly indexical or imperative—'food here' or 'mate with me.' Human language allows us to talk about things that never existed, like unicorns or negative integers. How does teleosemantics scale from the frog's snap to our ability to represent abstracta or non-existents? Do we need a different theory for human language, or can consumer mechanisms handle abstract content without a direct selection history for those specific objects?"

  ### 9. The Future of the Program
  "Finally, looking forward: Teleosemantics has been around for a few decades now. Where do you see the biggest vulnerability in the current framework? Is the next breakthrough going to come from refining the definition of 'proper function,' or do we need a better understanding of the neurobiology of the 'consumer' systems to make this work?"
