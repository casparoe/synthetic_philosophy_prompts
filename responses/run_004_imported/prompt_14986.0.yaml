      *   *S:* "No, unless I deny the *physical significance* of the permutation. Sophisticated Substantivalism."
      *   *R:* "That's just Leibniz Equivalence. You've surrendered."
      *   *S:* "I've surrendered haecceitism, not substance. The metric needs a home."
      *   *R:* "The metric *is* the home. Events are primitive."
      *   *S:* "But the metric evolves. Relations don't evolve in a vacuum."
      *   *R:* "Structure evolves."
      *   *S:* "Structure of *what*?"
