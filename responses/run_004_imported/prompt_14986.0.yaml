      *   **Relationalist (R):** Believes spacetime is nothing over and above the spatiotemporal relations between physical events/fields. Sees the Hole Argument as a *reductio* of substantivalism. Sees S's retreat as a surrender.

  3.  **Drafting - Section by Section:**

