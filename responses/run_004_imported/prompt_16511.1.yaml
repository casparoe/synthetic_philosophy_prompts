answer: |-
  ### Evaluation of Interpretations by Locality

  **Bohmian Mechanics**
  Rejects **Locality** explicitly by positing an instantaneous guiding equation that connects all particles regardless of distance, straightforwardly abandoning relativistic causality to save determinism and unicity.

  **GRW / Spontaneous Collapse**
  Rejects **Locality** by requiring collapse events to update the wavefunction instantaneously across space, effectively introducing a preferred foliation or action-at-a-distance to ensure single outcomes.

  **Everettian Many-Worlds**
  Rejects **Unicity** (Single Outcome), maintaining that unitary evolution is strictly local and apparent non-locality arises merely from correlations within the branching structure of the wavefunction.

  **Copenhagen (Orthodox)**
  Rejects **Realism** (implicitly), accepting non-local correlations as brute empirical facts while denying ontological status to the wavefunction to avoid modeling the underlying mechanism.

  **QBism / Relational Quantum Mechanics**
  Rejects **Objective Unicity**, arguing that state updates are local to the agent or relation, thereby dissolving the conflict by denying there is a single observer-independent reality to be non-local.

  **Superdeterminism**
  Rejects **Measurement Independence**, buying back locality at the cost of positing ubiquitous correlations between measurement settings and hidden variables that many deem conspiratorial or scientifically degenerate.

  **Retrocausal (Time-Symmetric)**
  Rejects **Measurement Independence** (via future boundary conditions), preserving spatial locality by allowing causal influences to propagate backward in time within a block universe.

  ### Locality Preservation Ranking

  ```json
  {
    "S": [
      "Everettian many-worlds",
      "Retrocausal (time-symmetric) approaches"
    ],
    "A": [
      "QBism/relational quantum mechanics"
    ],
    "B": [
      "Superdeterminism"
    ],
    "C": [
      "Copenhagen (orthodox/instrumentalist reading)"
    ],
    "D": [
      "Bohmian mechanics",
      "GRW/spontaneous collapse theories"
    ]
  }
  ```
