answer: |-
  This is an exceptionally sharp question, and it cuts to the methodological heart of *Principia Ethica*. You are right to identify a potential friction here: if the value of a part is contingent on the whole (as Organic Unities suggests), how can we trust the Method of Isolation (which evaluates things by stripping them of their wholes) to tell us what is valuable?

  Many commentators glide over this because resolving it requires distinguishing between what Moore calls the **constituents** of a state of affairs and the **state of affairs itself**. For a graduate seminar, reconstructing this distinction is the key to showing how Moore's apparatus coheres—and where the Bloomsbury Group subsequently went astray by ignoring the rigor of that coherence.

  Here is a reconstruction of how the Method of Isolation and the Principle of Organic Unities are meant to work together, specifically regarding the "supreme goods" passage in Chapter 6.

  ### 1. Clarifying the Object of Evaluation
  The apparent tension dissolves if we are precise about *what* is being isolated.

  *   **The Method of Isolation** asks: "Does $X$ have intrinsic value?" To answer, we imagine a universe containing *only* $X$.
  *   **The Principle of Organic Unities** states: "The value of a whole $W$ (composed of $A$ and $B$) is not necessarily equal to the sum of the value of $A$ plus the value of $B$."

  The confusion arises if we assume that in the "supreme goods" passage, the *parts* are the primary candidates for intrinsic value. They are not. For Moore, the primary bearers of intrinsic value are **complex states of affairs** (or "wholes of intuition").

  In the passage you cite, the "thing" being valued is not "consciousness" (as a bare faculty) nor "the beautiful object" (as a bare physical thing). The "thing" is **"the consciousness of a beautiful object."** This is a single, complex whole.

  ### 2. Isolation as the Proof of Organic Unity
  Rather than being incompatible, the Method of Isolation is actually the **tool Moore uses to prove the existence of Organic Unities.**

  Here is the step-by-step reconstruction you can offer your seminar:

  1.  **Isolate Constituent A (The Object):** Imagine a universe containing only a beautiful object (e.g., a sunset) but no consciousness to perceive it. Moore argues this has negligible or zero intrinsic value.
  2.  **Isolate Constituent B (The Consciousness):** Imagine a universe containing only a state of consciousness (a feeling of admiration) but no object to be admired. Moore argues this also has negligible or zero intrinsic value.
  3.  **Isolate the Whole (A + B):** Imagine a universe containing *only* "the consciousness of the beautiful object." Moore argues this has immense positive intrinsic value.

  If value were strictly additive, the value of step 3 should equal step 1 plus step 2 (i.e., roughly zero). Since the value of step 3 is immense, we have empirically (via intuition/isolation) demonstrated an **Organic Unity**.

  Therefore, the tension you perceive is resolved by recognizing that the Method of Isolation is applied *recursively*. We isolate the parts to show they lack value; we isolate the whole to show it possesses value. The discrepancy between these two isolation tests *is* the definition of an Organic Unity.

  ### 3. Addressing the "Context" Worry
  Your specific worry is: *"If a part's value can genuinely depend on the whole... it is unclear what isolating a candidate good is supposed to reveal, since isolating something just is removing it from the very context that, on this doctrine, partly constitutes its value."*

  This is the strongest philosophical objection, but Moore has a specific defense against it, grounded in his ontology of "consciousness."

  For Moore, "consciousness" is not a container that holds an object; it is a relation. In *Principia*, Moore insists that you cannot have "consciousness" without "consciousness *of* something." However, when he isolates the "enjoyment of beautiful objects," he is not stripping the object away from the enjoyment. He is stripping **everything else** away from the **[enjoyment-of-object]** complex.

  *   **Incorrect Isolation:** Taking "admiration" and removing "beauty." (This destroys the whole).
  *   **Moorean Isolation:** Taking "admiration-of-beauty" and removing "the rest of the universe." (This preserves the whole).

  When Moore says the parts have no value, he means the *abstracted* constituents (beauty without mind, mind without beauty). When he says the whole has value, he means the *concrete* state of affairs (mind apprehending beauty). The "context" that constitutes the value is internal to the description of the whole. The Isolation Test removes *external* context (consequences, causal relations, other goods), not *internal* constitution.

  ### 4. Where the Tension Actually Lies (For Seminar Discussion)
  While the logical apparatus coheres as described above, there is a genuine instability in Moore's application of it in Chapter 6, which makes for excellent seminar fodder.

  **A. The Ambiguity of "Pleasures of Human Intercourse"**
  Moore groups "personal affection" with "appreciation of beauty." But the ontology is messier here.
  *   In the beauty case, the "object" can be non-mental.
  *   In the affection case, the "object" is another person's consciousness.
  *   **The Problem:** If I love you, is the good thing *my* consciousness of you? Or *your* consciousness of me? Or the reciprocal whole? Moore tends to slide into suggesting that *my* feeling is the primary good, provided it is directed at a worthy object. But if the value is an Organic Unity, does the value vanish if the object is unaware of my affection? Moore implies the object's actual existence matters, not just my belief in it. This strains the Isolation Test: How do we isolate "my love for you" if "you" must actually exist for it to be a good whole?

  **B. The Bloomsbury Misreading**
  This is where your seminar can connect text to history. The Bloomsbury Group (Keynes, Woolf, Bell) famously adopted Moore's "states of consciousness" as their secular religion.
  *   **Moore's View:** The value lies in the *Organic Unity* of consciousness + worthy object. The object's quality matters objectively.
  *   **Bloomsbury's View:** They often collapsed the unity into the *feeling* itself. If the "state of consciousness" is the good, then cultivating intense feelings (aesthetic or amatory) became the end, sometimes regardless of the "object's" actual worth or existence.
  *   **The Critique:** By ignoring the *Organic Unity* constraint and focusing only on the *Isolation* of the "state of consciousness," Bloomsbury risked turning Moore's objective idealism into a form of subjective aestheticism. Moore would likely argue they isolated the wrong thing (the feeling alone) rather than the whole (feeling of the true/beautiful).

  ### 5. Proposed Seminar Strategy
  To make this concrete for your students, I suggest the following exercise:

  1.  **The Possible Worlds Test:** Ask students to describe three possible worlds:
      *   World A: Contains only a beautiful painting in an empty room.
      *   World B: Contains only a mind feeling intense admiration, but the painting does not exist (hallucination).
      *   World C: Contains only a mind feeling intense admiration of the painting, which exists.
      *   *Question:* According to Moore, which world is best? (Answer: C). Which has value? (Answer: Only C has *great* value). Why? (Because A and B isolate the parts, revealing they are not the supreme goods).

  2.  **The "Stripping" Objection:** Pose your own question to the class: *"If the value depends on the combination, doesn't testing the parts in isolation tell us nothing useful?"*
      *   *Goal:* Guide them to see that testing the parts is necessary to prove that the value isn't just coming from one side. It proves the value is emergent (organic), not additive.

  3.  **The Bloomsbury Pivot:** Ask: *"If you are Virginia Woolf, why might you prefer Moore's conclusion ('states of consciousness are the best things') over his method ('Organic Unities require worthy objects')?"*
      *   This highlights how the "supreme goods" passage became a manifesto for aesthetic living, even if it required loosening Moore's strict meta-ethical constraints.

  ### Summary for your Lecture Notes
  Moore is not running two incompatible pictures together, provided we understand that:
  1.  **Isolation** determines *whether* a specific description (simple or complex) denotes something intrinsically good.
  2.  **Organic Unity** describes the *mathematical relationship* between the value of a complex description and the value of its component descriptions.
  3.  The "Supreme Goods" are **complex wholes**. We isolate the *whole* to find it good. We isolate the *parts* to find them less good. The difference confirms the Organic Unity.

  The tension is not in Moore's logic, but in the difficulty of maintaining that distinction in practice—a difficulty the Bloomsbury Group exploited to transform Moore's rigorous ethics into a lifestyle of aesthetic intensity.
