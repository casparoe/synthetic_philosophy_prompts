answer: |-
  This is one of the classic "rite of passage" confusions in decision theory. You have hit on exactly why Evidential Decision Theory (EDT) and Causal Decision Theory (CDT) are both considered incomplete, and why LessWrong eventually migrated toward Timeless Decision Theory (TDT) and Functional Decision Theory (FDT).

  Here is the breakdown of the relationship, the conflict, and how modern decision theories draw the principled line.

  ### 1. The Side-by-Side Comparison

  | Feature | **Newcomb's Problem** | **Smoking Lesion Problem** |
  | :--- | :--- | :--- |
  | **The Setup** | Omega predicts your choice. If 1-box, \$1M in Box B. If 2-box, Box B empty. Box A always has \$1k. | A genetic lesion causes Lung Cancer. It *also* causes a desire to Smoke. Smoking itself does not cause cancer. |
  | **The Correlation** | Your Choice $\leftrightarrow$ Omega's Prediction (Box Content) | Your Choice $\leftrightarrow$ Lesion (Cancer) |
  | **Causal Link?** | No causal link from Choice to Box (it's in the past). | No causal link from Choice to Cancer (smoking is safe). |
  | **CDT Advice** | **Two-Box.** (Choice can't change the past. Dominance principle.) | **Smoke.** (Choice doesn't cause cancer. Enjoy the utility.) |
  | **EDT Advice** | **One-Box.** (Choice is evidence of \$1M. Higher expected utility.) | **Don't Smoke.** (Choice is evidence of Lesion. Lower expected utility.) |
  | **Intuition** | Most feel One-Boxing is rational (you walk away with \$1M). | Most feel Smoking is rational (you get pleasure, no cancer risk). |

  ### 2. The Dilemma: Does One-Boxing commit you to Not-Smoking?

  **For Naive EDT: Yes.**
  If you are a pure Evidential Decision Theorist, you maximize $E[U | A]$. You look at the conditional probability of the good outcome given your action.
  *   In Newcomb: $P(\$1M | \text{One-Box})$ is high. **Verdict: One-Box.**
  *   In Lesion: $P(\text{Cancer} | \text{Smoke})$ is high (because smokers have the lesion). **Verdict: Don't Smoke.**

  This is the classic refutation of Naive EDT. It leads to "managing the news" rather than managing the world. An EDT agent in the Smoking Lesion universe would refrain from smoking to avoid the *bad news* that they have the lesion, even though refraining does nothing to prevent the cancer. This is widely considered irrational.

  **For CDT: No.**
  CDT maximizes $E[U | \text{do}(A)]$. It only cares about causal consequences.
  *   In Newcomb: Choice doesn't cause Box Content. **Verdict: Two-Box.** (Leaves \$1M on the table).
  *   In Lesion: Choice doesn't cause Cancer. **Verdict: Smoke.** (Gets the pleasure).

  CDT is consistent, but it loses on Newcomb's Problem.

  ### 3. Is there a Principled Way to Draw the Line?

  The goal of modern decision theory (specifically the LessWrong lineage of TDT and FDT) is to **One-Box on Newcomb** AND **Smoke on the Lesion**.

  Is there a principled way to distinguish the two cases so you don't have to accept the Naive EDT conclusion? **Yes.**

  #### A. The "Tickle Defense" (Sophisticated EDT)
  Proponents of EDT can escape the Smoking Lesion trap using the **Tickle Defense**.
  *   **The Argument:** In the Smoking Lesion case, the lesion causes an *urge* (a "tickle") to smoke. As an agent, you have introspective access to your own urges.
  *   **The Logic:** If you already know whether you have the urge to smoke, the act of smoking provides no *new* evidence about the lesion. The correlation is "screened off" by your internal state.
      *   If you have the urge: You already know you likely have the lesion. Smoking doesn't make it more likely.
      *   If you don't have the urge: You likely don't have the lesion.
  *   **Result:** Once you condition on your internal mental state (the urge), $P(\text{Cancer} | \text{Smoke}, \text{Urge}) \approx P(\text{Cancer} | \text{Urge})$. Therefore, EDT can smoke.
  *   **Weakness:** This relies on the agent having perfect introspective access to the common cause. It gets messy in variations where the agent *doesn't* know their own urges.

  #### B. TDT / FDT (The LessWrong Standard)
  Timeless Decision Theory (Yudkowsky) and Functional Decision Theory (Soares/Levinstein) draw the line based on **Logical Dependence vs. Statistical Correlation**.

  **1. Newcomb's Problem (Logical Dependence)**
  *   Omega is simulating your decision algorithm.
  *   Your actual decision and Omega's prediction are outputs of the *same logical computation*.
  *   Therefore, there is a **logical dependency** between your choice and the box content. When you choose, you are effectively determining the output of the simulation that happened in the past.
  *   **Verdict:** One-Box.

  **2. Smoking Lesion (Statistical Correlation via Common Cause)**
  *   The lesion is a physical state. Your decision algorithm is a computation.
  *   The lesion influences your *preferences* (inputs to the algorithm), but your decision *output* does not logically determine the existence of the lesion.
  *   Crucially, in FDT, you treat your decision as "What output should my algorithm return?"
  *   If your algorithm returns "Smoke," does that logically force the universe to have given you the lesion? **No.** The lesion exists independently of the logical output of your decision procedure; it only causally influences your inputs.
  *   Unlike Omega, the Lesion is not predicting your *algorithm's output*; it is causing your *physiological state*.
  *   **Verdict:** Smoke.

  ### 4. Summary of the Principled Line

  The line is drawn at **Subjunctive Dependence** (or Logical Correlation).

  *   **Newcomb:** There is a subjunctive link. "If I were the kind of agent who Two-Boxes, Omega would have predicted that." Your decision type *is* the cause of the prediction.
  *   **Lesion:** There is no subjunctive link. "If I were the kind of agent who Smokes, does that mean I have the lesion?" Not necessarily. You could be an agent who smokes *despite* not having the lesion (because you calculated it's safe). The lesion causes the *urge*, but a rational agent can override the urge. If the agent overrides the urge, the correlation breaks.

  ### Conclusion

  To answer your specific question:

  1.  **Does One-Boxing commit you to Not-Smoking?**
      *   **Naive EDT:** Yes. (This is why Naive EDT is rejected).
      *   **CDT:** No. (But they Two-Box, which many consider wrong).
      *   **TDT/FDT:** **No.** You can consistently One-Box and Smoke.

  2.  **Is there a principled way to draw the line?**
      *   **Yes.** The line is between **correlations arising from the prediction of your decision algorithm** (Newcomb) versus **correlations arising from a common physical cause influencing your preferences** (Lesion).
      *   In Newcomb, your decision *is* the evidence Omega acted on.
      *   In Lesion, your decision is merely a symptom of the evidence (the lesion), but you can "screen off" that evidence by reasoning causally about the action itself.

  The consensus on LessWrong is that a rational agent should **One-Box** (because they want the million) and **Smoke** (because they want the pleasure and know it doesn't cause cancer). Achieving this combination requires moving beyond standard EDT and CDT to a theory like FDT.
