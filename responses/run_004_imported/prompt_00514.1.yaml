prompt: |-
  So I've read like a million posts about Newcomb's problem over the years (LW loves it) but I recently stumbled on the smoking lesion problem and now I'm confused about how they relate. Can you compare the two? Specifically I want to know if one-boxing on Newcomb commits you to also doing the "irrational" thing on the smoking lesion case, or if theres a principled way EDT/CDT proponents draw the line between them.
reasoning: |-
  Here's a thinking process that leads to the comparison between Newcomb's Problem and the Smoking Lesion Problem:

  1.  **Deconstruct the User's Request:**
      *   **Context:** The user is familiar with Newcomb's Problem (common on LessWrong) but recently encountered the Smoking Lesion Problem.
      *   **Core Confusion:** How do these two problems relate?
      *   **Specific Question:** Does one-boxing on Newcomb commit you to doing the "irrational" thing (smoking) in the Smoking Lesion case?
      *   **Underlying Theoretical Question:** Is there a principled way for Evidential Decision Theory (EDT) and Causal Decision Theory (CDT) proponents to draw the line between them?

  2.  **Analyze Newcomb's Problem:**
      *   **Setup:** Omega (predictor) puts \$1M in Box B if it predicts you'll one-box. Box A always has \$1k. You choose A+B or B.
      *   **Structure:** Your choice is *evidence* of Omega's past prediction, but (arguably) does not *cause* it. There's a correlation without direct causation (or via a common cause: your decision algorithm).
      *   **CDT Stance:** Two-box. Your choice can't change the past. Dominance principle applies.
      *   **EDT Stance:** One-box. Choosing B is strong evidence that \$1M is there. Expected utility is higher.
      *   **Key Feature:** The correlation is robust and relevant to the payout.

  3.  **Analyze the Smoking Lesion Problem:**
      *   **Setup:** A genetic lesion causes both a desire to smoke and lung cancer. Smoking itself doesn't cause cancer. You enjoy smoking. Should you smoke?
      *   **Structure:** Smoking is *evidence* of the lesion (and thus cancer), but smoking does not *cause* cancer.
      *   **CDT Stance:** Smoke. Smoking doesn't cause cancer. You get the utility of smoking without the causal risk.
      *   **EDT Stance:** (Naive EDT) Don't smoke. Smoking is bad news (evidence of cancer).
      *   **Key Feature:** The correlation is spurious regarding the outcome (cancer), driven by a common cause (the lesion).

  4.  **Compare the Structures:**
      *   **Similarities:** Both involve a correlation between an action and an outcome that isn't a direct causal link from action to outcome. Both challenge the idea that "correlation implies causation" in decision making.
      *   **Differences:**
          *   *Newcomb:* The correlation is due to prediction (or logical dependence). The "common cause" is the agent's decision algorithm/type.
          *   *Lesion:* The correlation is due to a physiological common cause (the lesion).
          *   *Intuition:* Most people feel One-Boxing is rational (or at least defensible), but almost everyone feels Smoking is rational (since it doesn't cause cancer).
      *   **The Conflict:** If you use EDT, you One-Box (good) but also Don't Smoke (bad/irrational). If you use CDT, you Two-Box (arguably bad) but Smoke (good).

  5.  **Address the Specific Question: "Does one-boxing commit you to not smoking?"**
      *   *Naive EDT:* Yes. This is the classic critique of EDT. It fails the Smoking Lesion test.
      *   *Sophisticated EDT / "Tickle" Defense:* EDT proponents try to escape this. They argue you can condition on internal states (the "tickle" of the desire). If you know your own urges, smoking provides no *new* evidence about the lesion.
      *   *Causal Decision Theory (CDT):* No. CDT smokes and two-boxes.
      *   *Timeless Decision Theory (TDT) / Functional Decision Theory (FDT):* This is the LW angle. These theories One-Box but *also* Smoke. How? They distinguish between logical correlation (Newcomb) and mere statistical correlation caused by a physical common cause where the action doesn't influence the cause (Lesion). Wait, actually, TDT/FDT treats the decision algorithm as the common cause.
      *   *Refinement on TDT/FDT:* In Newcomb, Omega predicts your *algorithm*. In Lesion, the lesion causes your *urge*. If you decide based on the algorithm, do you smoke?
          *   In Lesion: The lesion causes the *desire*. If you override the desire via decision theory, does that mean you don't have the lesion? No. The lesion is physical. Your decision doesn't change the physical fact of the lesion.
          *   In Newcomb: Omega predicts the *output* of your decision process. Your output *is* the prediction.
          *   *Crucial Distinction:* In Newcomb, the prediction is about *what you will choose*. In Lesion, the lesion causes *why you want to choose*, but the choice itself doesn't retroactively cause the lesion.
          *   *Actually, the standard LW view (TDT/FDT):* One-box on Newcomb, Smoke on Lesion. This is the "winning" combination.
          *   *How?* By using causal graphs. In Newcomb, there is a logical link between Choice and Prediction. In Lesion, the link between Choice and Lesion is screened off by the Desire/State, or simply treated as non-causal in the relevant way.
          *   *Wait, let's look closer at the "Principled Line".* The line is usually drawn at **causal influence vs. logical correlation**.
          *   CDT: Causal influence only. (2-box, Smoke).
          *   EDT: Correlation only. (1-box, Don't Smoke).
          *   TDT/FDT: Logical correlation where the decision *is* the computation being predicted. (1-box, Smoke).
          *   *Why Smoke on Lesion for TDT?* Because the lesion causes the *urge*, not the decision directly. If you decide "I will smoke because I enjoy it and it doesn't cause cancer," your decision doesn't change the fact of the lesion. The correlation is screened off.
          *   *Wait, is that right?* In the standard Smoking Lesion, the lesion causes *both* the cancer and the *tendency to smoke*. If you smoke, you are evidence of the lesion. TDT asks: "If my algorithm outputs 'Smoke', does that make it more likely the lesion exists?"
          *   If the lesion *determines* the decision, then TDT might not smoke. But usually, the problem is set up such that the lesion causes an *urge*, but the agent can still choose.
          *   *Standard Resolution:* The "Tickle Defense" is the EDT fix. TDT/FDT fixes it by modeling the causal structure explicitly. They recognize that in Newcomb, the prediction depends on the *output* of the decision. In Lesion, the lesion exists independently of the decision output (it causes the *input* preferences).

  6.  **Synthesize the "Principled Line":**
      *   The line is between **conditional probability** (EDT) and **intervention** (CDT), and how advanced theories (TDT/FDT) hybridize them.
      *   **CDT:** Uses $P(World | do(Action))$. Ignores correlations that aren't causal. Result: 2-box, Smoke.
      *   **EDT:** Uses $P(World | Action)$. Accepts all correlations. Result: 1-box, Don't Smoke.
      *   **TDT/FDT:** Uses $P(World | do(Action \text{ as output of Algorithm}))$.
          *   Newcomb: Omega predicts the Algorithm. So $Action$ correlates with $Prediction$. One-box.
          *   Lesion: Lesion causes $Urge$. $Urge$ influences $Action$. But $Action$ does not influence $Lesion$. The correlation is screened off if you condition on your internal state (the urge). Or, more formally, the causal graph shows no arrow from Action to Lesion, and no logical dependency between Algorithm Output and Lesion existence (unlike Omega).
      *   **The "Tickle Defense" (for EDT):** If you know your own mind (do you feel the urge?), smoking gives no new evidence. This allows EDT to Smoke.
      *   **The "Logical Uncertainty" (for TDT):** Newcomb involves logical uncertainty (Omega simulates you). Lesion involves empirical uncertainty (do I have the gene?).

  7.  **Drafting the Response:**
      *   **Introduction:** Acknowledge the confusion. It's a classic philosophical pivot point.
      *   **Side-by-Side Comparison:** Create a clear table or list comparing Setup, Correlation, CDT, EDT.
      *   **The Conflict:** Explicitly state the problem: EDT wins Newcomb, loses Lesion. CDT wins Lesion, loses Newcomb.
      *   **Answering the Core Question:** Does One-Boxing commit you to Not-Smoking?
          *   For *Naive* EDT: Yes.
          *   For *Sophisticated* EDT (Tickle Defense): No.
          *   For CDT: No (but they Two-Box).
          *   For TDT/FDT (LW favorite): No. This is the "best of both worlds."
      *   **The Principled Line:** Explain *why* TDT/FDT distinguishes them.
          *   Newcomb: Logical dependency / Prediction of the *decision*.
          *   Lesion: Common cause / Prediction of the *propensity*.
          *   Key concept: Screening off. In Lesion, your internal state (urge) screens off the action from the lesion. In Newcomb, nothing screens off the action from the prediction because the prediction *is* about the action.
      *   **Conclusion:** Summarize. The "rational" consensus (especially on LW) is One-Box + Smoke.

  8.  **Refining the TDT/FDT explanation:**
      *   Need to be careful here. In the Smoking Lesion, the lesion causes the *desire* to smoke.
      *   If I am an FDT agent, I ask: "What if my decision function outputs 'Smoke'?"
      *   Does that imply I have the lesion?
      *   If the lesion *causes* the desire, and the desire *causes* the decision...
      *   Actually, the standard resolution is that the agent knows their own utility function/desires. If I know "I want to smoke," that is the evidence of the lesion. Deciding to smoke adds no *extra* evidence.
      *   So, the distinction is: In Newcomb, Omega predicts the *choice*. In Lesion, the gene predicts the *preference*.
      *   If the problem is "Gene causes Choice directly" (hard determinism), then FDT might not smoke. But the standard problem assumes the agent has free will to override the urge, or that the urge is just a probabilistic influence.
      *   Let's stick to the "Tickle Defense" explanation for EDT and the "Causal Graph" explanation for TDT, as those are clearer.
      *   *Correction:* TDT/FDT distinguishes them based on the causal graph structure. In Newcomb, there is a link (logical or causal via simulation) from Agent to Box Content. In Lesion, there is no link from Agent to Cancer (except via the common cause).
      *   Wait, in Newcomb, there is no *causal* link from Agent to Box Content (past). It's a logical link.
      *   In Lesion, there is no *causal* link from Agent to Cancer. It's a statistical link via common cause.
      *   Why treat them differently? Because in Newcomb, the Predictor is predicting *your decision algorithm*. In Lesion, the Gene is causing *your physiology*.
      *   The "Principled Line" is **Logical Dependence vs. Statistical Correlation**.
      *   Newcomb: Your decision and Omega's prediction are logically dependent (same computation).
      *   Lesion: Your decision and the Lesion are statistically correlated (common cause), but not logically dependent. Knowing your decision doesn't tell you about the lesion *if you already know your desires*.

  9.  **Final Polish:** Ensure tone is helpful and acknowledges the LW context (Yudkowsky, Soares, etc.). Make sure to mention "Tickle Defense" and "TDT/FDT".

      *(Self-Correction during drafting)*: I should clarify that CDT proponents *do* draw a line, but it leads to Two-Boxing. The user asks if One-Boxing *commits* you. So I need to focus on theories that One-Box.
      *   Naive EDT: Committed to Not-Smoking. (Bad)
      *   Refined EDT (Tickle): Not committed. (Okay)
      *   TDT/FDT: Not committed. (Best)
      *   So the answer is: Naive EDT says yes, but better theories say no.

      *Wait, one nuance:* In the Smoking Lesion, if the gene *determines* the decision (no free will), then smoking *is* evidence. But the problem usually assumes you can choose. The "Tickle" is knowing your own urge. If you have no urge but smoke anyway, that's evidence *against* the lesion. If you have an urge and smoke, that's consistent with the lesion. But the decision itself shouldn't be driven by the fear of the lesion if the action doesn't cause it.

