answer: |-
  Here are ten questions designed for a decision theory colloquium, including the three specific thematic requirements with tailored follow-ups.

  **1. The Common Knowledge Equilibrium**
  If the strategy of adopting surrogate goals becomes common knowledge among acausal actors, doesn't the screening problem dissolve? A sufficiently sophisticated threatener, knowing that surrogates are a standard defense, should simply update their model to ignore the surrogate and target the agent's underlying terminal values directly. How does your proposal prevent the surrogate from becoming a transparent screen that the threatener simply looks past?

  *   **Follow-up:** *(Anticipating she will argue that perfect screening is computationally too costly for the threatener.)*
      If the defense relies on the computational cost of screening rather than incentive incompatibility, aren't we just shifting the arms race from decision theory to hardware? Does this imply that only agents with superior compute can successfully defend against acausal extortion, rather than all rational agents?

  **2. Credibility Without Vulnerability**
  For a surrogate goal to deter a threatener, the agent's attachment to it must be legible and credible; the threatener must believe the agent will actually pay the cost to satisfy the surrogate demand. However, if an agent successfully signals that they will incur costs for a surrogate, haven't they effectively made themselves vulnerable to *any* demand linked to that surrogate? How do you make the commitment legible enough to deter blackmail without making it binding enough to invite it?

  *   **Follow-up:** *(Anticipating she will suggest self-modification or pre-commitment devices as the signaling mechanism.)*
      If self-modification is the mechanism, how do you guard against value corruption? If I modify myself to care about a surrogate, is there a risk that the surrogate displaces my terminal values over time, meaning the defense succeeds only by destroying the very agent it was meant to protect?

  **3. Timing and Commitment Races**
  In an updateless framework, agents often face a "commitment race" where the first agent to credibly commit to a strategy forces the other to accommodate them. How does the timing of adopting a surrogate goal interact with this? If I adopt a surrogate too late, I am vulnerable; if I adopt it too early, I might lock myself into a suboptimal equilibrium before I know the threat landscape. How do you solve for the optimal adoption time without triggering a meta-level commitment race?

  *   **Follow-up:** *(Anticipating she will propose Schelling points or focal points to coordinate adoption timing.)*
      Who or what determines the focal point? In a decentralized environment with heterogeneous agents, doesn't the selection of the focal point itself become a site of acausal conflict, where different groups try to pull the standard toward surrogates that favor their own threat profiles?

  **4. Collateral Damage to Acausal Trade**
  Acausal threats and acausal trade often rely on the same underlying channel: the ability of one agent to simulate or predict another's reasoning to verify compliance. If an agent obscures their utility function via a surrogate goal to block threats, doesn't this also degrade their ability to signal reliability in positive-sum acausal trades? Are we sacrificing beneficial cooperation to insure against extortion?

  **5. Aggregation of Threats**
  Suppose an agent is subject to multiple, simultaneous acausal threats from different sources. If the surrogate goal becomes known, it risks becoming a "honey pot" where all threateners converge their demands on that single vulnerability to extract resources efficiently. Does the surrogate goal strategy scale poorly in a multi-agent environment where extortionists might coordinate implicitly on the surrogate?

  **6. Diachronic Consistency**
  Adopting a surrogate goal requires an agent to act in ways that are inconsistent with their terminal values (e.g., paying for something they don't care about). Does this introduce a diachronic inconsistency problem? If a future version of the agent knows the threat was a bluff or that the surrogate is artificial, wouldn't they want to revoke the commitment, thereby making the original commitment time-inconsistent and therefore non-credible?

  **7. Logical Uncertainty and Simulation Fidelity**
  Acausal threats often rely on logical uncertainty—the threatener simulates the agent to see how they react. If the agent's adoption of the surrogate goal is probabilistic or dependent on logical induction, how does the threatener's simulation fidelity interact with that? Is there a risk that the threatener simulates a version of the agent that *didn't* adopt the surrogate, rendering the defense null in the relevant counterfactuals?

  **8. Bounded Rationality Costs**
  Maintaining a surrogate goal requires cognitive overhead: the agent must constantly monitor their own decision processes to ensure they are acting *as if* they care about the surrogate without actually rewiring their terminal values. For bounded agents, isn't this computational tax significant? At what point does the cost of maintaining the decoy exceed the expected loss from the acausal threat?

  **9. Evolutionary Stability**
  If we view this through an evolutionary lens, will agents who employ surrogate goals outcompete those who do not? Or, conversely, will agents who refuse to adopt surrogates (and thus signal they cannot be blackmailed on fake grounds) be selected for because they are "cheaper" to run? Is this strategy evolutionarily stable, or is it a niche defense that collapses if it becomes too popular?

  **10. Opacity as an Alternative**
  Finally, why is a surrogate goal superior to simple opacity? If the goal is to prevent a threatener from predicting your reaction, why not simply invest in making your reasoning process unreadable or noisy, rather than constructing a complex fake utility function? Does the surrogate goal approach assume that opacity is impossible, and if so, is that a justified assumption in a high-fidelity simulation context?
