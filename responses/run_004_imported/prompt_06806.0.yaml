answer: |-
  This is a fantastic line of inquiry. You've hit on one of the most fertile tensions in the philosophy of physics: the gap between the mathematical formalism and the ontological commitment.

  If we are trying to reconstruct Einstein's reaction to the Earman-Norton revival and the subsequent "sophisticated substantivalism" of the 1990s, we have to be careful about *which* Einstein we are summoning. The 1913 Einstein (who formulated the Hole Argument to *reject* general covariance) is different from the 1916 Einstein (who dissolved it to *accept* general covariance), and both are different from the 1950 Einstein (who was disillusioned with Mach and speaking of a "new ether").

  Here is my best-guess reconstruction of how Einstein would have navigated that 1987–1990s debate, based on his correspondence, his *Autobiographical Notes*, and his 1920 Leiden address.

  ### 1. On the Earman-Norton Revival: "I told you so, but you took 70 years."

  Einstein would likely have been struck by a mix of vindication and impatience. When Earman and Norton framed the Hole Argument as a *reductio ad absurdum* against substantivalism, they were effectively formalizing the exact reasoning Einstein used in late 1915 to unlock General Relativity.

  In 1915, Einstein realized that if you treat the manifold points as having physical identity independent of the metric field, you get indeterminism (the Hole Argument). His solution was the **Point-Coincidence Argument**: physical reality consists *only* of the coincidences of worldlines (e.g., where a particle intersects a field value). The manifold points underneath are merely a mathematical scaffolding with no physical "thisness."

  When Earman and Norton argued that "manifold substantivalism leads to indeterminism," Einstein would have nodded vigorously. He wrote as much to Michele Besso in 1915. However, he would likely have been baffled that philosophers in the 1980s were treating this as a *new* discovery or a threat to GR, rather than a foundational feature of it.

  He would probably have said: **"The argument is correct, but the conclusion is trivial. Of course the bare manifold is not real. I discarded that in 1915. To argue against manifold substantivalism in 1987 is to argue against a ghost I exorcised seven decades ago."**

  ### 2. On "Sophisticated Substantivalism" (Butterfield/Maudlin): "You are fighting over the scaffolding."

  This is where it gets interesting. The "sophisticated substantivalists" tried to save the idea that spacetime is a substance without falling into the Hole Argument trap.
  *   **Butterfield** argued for Leibniz equivalence (diffeomorphic models represent the same physical state).
  *   **Maudlin** argued for essentialism (spacetime points have their metrical properties essentially).

  Einstein would have viewed this entire scramble as a category error born of over-reifying the mathematics.

  **On Butterfield:** He would have agreed with the outcome but found the philosophical machinery excessive. Butterfield's "Leibniz equivalence" is essentially a restatement of the Point-Coincidence argument in modal logic. Einstein was a pragmatic realist; he didn't care about possible worlds semantics. He cared that the equations yielded unique predictions for observable coincidences. He would have told Butterfield: **"You have dressed my 1916 insight in a tuxedo. It fits, but why the fuss?"**

  **On Maudlin:** Maudlin's essentialism (points *are* their metric properties) would have rubbed Einstein the wrong way. By the 1920s, Einstein had moved toward viewing the **metric field** itself as the physical object, not the points of the manifold. If Maudlin says the *point* has the property essentially, Einstein would correct him: **"The point is nothing. The field is everything."** To Einstein, attaching essential properties to the manifold points was still granting them too much ontological weight. The reality resides in the $g_{\mu\nu}$ field, not in the $x^\mu$ coordinates or the manifold substrate $M$.

  ### 3. The Big Question: Substance vs. Relations (The 1990s Verdict)

  If you cornered Einstein in 1995 and asked, "Are you Team Substance or Team Relations?", he would likely reject the dichotomy entirely.

  **Why not Team Relations (Mach)?**
  You noted his early sympathy for Mach. But by the 1920s, Einstein publicly broke with Mach. In his 1920 address "Ether and Relativity," he argued that space (spacetime) must have physical qualities because it determines the behavior of rods and clocks and propagates gravitational waves. If space can act, it must be real. He explicitly stated: **"According to the general theory of relativity, space is endowed with physical qualities; in this sense, therefore, there exists an ether."**
  He realized that a purely relational view couldn't account for the inertia of a single particle in an otherwise empty universe (the GR version of the Bucket). The metric field exists even without matter sources. So, strict relationism was dead to him.

  **Why not Team Substance (Newton/Early Earman)?**
  He rejected Newtonian absolute space because it lacked causal agency. A "container" that acts but is not acted upon was unacceptable to him. Furthermore, the Hole Argument proved that a "bare" substratum is unobservable and physically meaningless.

  **The Einsteinian Synthesis: Field Realism**
  Einstein would have landed on **Field Substantivalism**.
  He would argue that the debate between "substance" and "relations" is a pseudo-problem inherited from Aristotelian categories that don't fit modern physics.
  *   **Space is not a thing (Substance):** It has no independent existence apart from the field.
  *   **Space is not nothing (Relation):** It has physical reality (energy, momentum, curvature) independent of matter.

  In a 1952 letter to a student, Einstein wrote: *"Space-time does not claim existence on its own, but only as a structural quality of the field."*

  If he saw the 1990s debate, he would likely say: **"You are asking if the stage is real or if the actors are real. The answer is that there is no stage. There is only the performance. The field is the reality. To ask if the manifold points exist independently of the field is like asking if the grid lines on a map exist independently of the terrain."**

  ### 4. How he would critique the "Cottage Industry"

  Einstein had a low tolerance for what he called "philosophical prejudice" interfering with physical insight. He often chided the logical positivists (like Reichenbach) for trying to derive physics from epistemological rules.

  He would likely view the Earman-Norton debate as a symptom of philosophers treating the **manifold** as a physical object. In his *Autobiographical Notes*, he criticized the idea that one could construct physics from purely logical or conceptual foundations without physical intuition.

  He would probably characterize the "sophisticated substantivalism" scramble as **scholasticism**. He saw the move from Newton to GR as a move away from "things in space" to "states of space." The 1980s philosophers were still trying to find the "things" (the points) and justify their existence. Einstein would tell them to stop looking for the "things" and look at the **invariants**.

  ### Summary of the Reconstruction

  If Einstein were in the room at a 1990s philosophy of physics conference:

  1.  **On the Hole Argument:** He would claim ownership. "This is my 1915 reasoning. It proves general covariance, not the unreality of spacetime."
  2.  **On Substantivalism:** He would reject *Manifold* Substantivalism (points exist independently) as nonsense. He would accept *Field* Substantivalism (the metric structure is a real physical entity) as necessary.
  3.  **On Relationism:** He would reject it as insufficient. The field has energy; relations do not carry energy.
  4.  **On the Debate Itself:** He would call it a linguistic confusion. The question "Is spacetime a substance?" assumes a category (substance) that ceased to be useful with the advent of field theory.

  **The Verdict:** He wouldn't join Team Substance or Team Relations. He would dissolve the table they are sitting at. He'd argue that the **Field** is the primitive ontology, and that both "substance" and "relation" are classical approximations of how that field behaves. He'd likely close his talk by quoting his 1936 essay *Physics and Reality*: *"The concept of the field... has finally taken the place of the concept of material particles."*

  The "rabbit hole" you're in is real, but Einstein would tell you the exit is to stop asking what spacetime *is* and start asking what the field *does*. The ontological status is revealed in the causal structure, not in the metaphysical labeling.
