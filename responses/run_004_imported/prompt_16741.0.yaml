      *   $EV = (1/3 \times 5S) + (2/3 \times -S) = (5/3)S - (2/3)S = (3/3)S = S$.
      *   Return on Investment (ROI) = $EV / S = 100\%$.
      *   *Conclusion:* The friend is mathematically correct about the *arithmetic expected value* of a single bet.

  3.  **Analyze the "All-In" Strategy (Compounding/Ruin):**
      *   If I bet my *entire* bankroll ($W$) each time:
      *   One loss wipes out the bankroll ($W \to 0$).
      *   Once $W=0$, you cannot bet again. Game over.
      *   Probability of surviving $N$ bets: $(1/3)^N$.
      *   As $N \to \infty$, Probability of Survival $\to 0$.
      *   *Conclusion:* In the long run, ruin is almost certain (Probability 1).

  4.  **Identify the Core Conflict: Ensemble Average vs. Time Average:**
      *   **Friend's Argument (Ensemble Average):** Imagine 1,000 parallel universes. In most, everyone goes bust. In a few, someone gets astronomically rich. The *average* wealth across all universes is huge. This is the *Arithmetic Mean*.
      *   **User's Intuition (Time Average):** You live in *one* timeline. You play sequentially. If you hit zero, you stop. You don't get to average your outcome with the parallel versions of yourself who got lucky. This is the *Geometric Mean* or ergodicity problem.

  5.  **Connect to Established Theory:**
      *   **Kelly Criterion:** This is the standard framework for optimal bet sizing to maximize long-term growth rate.
      *   **Ergodicity Economics:** Ole Peters' work is directly relevant here. The distinction between ensemble average and time average is the key philosophical and mathematical flaw in the friend's argument.
      *   **Gambler's Ruin:** Even with positive EV, betting too much leads to ruin.

