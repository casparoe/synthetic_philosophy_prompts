answer: |-
  You are right, and your friend is conflating two distinct epistemic conditions that are often glossed over in informal discussions. Your recollection from your epistemic game theory course is correct: **Common Knowledge of Rationality (CKR) alone yields the set of Rationalizable strategies, not necessarily a Nash Equilibrium.**

  To get to a Nash Equilibrium, you need an additional assumption regarding the alignment of beliefs (often phrased as "Common Knowledge of Conjectures" or a "Common Prior" combined with specific knowledge conditions).

  Here is the precise breakdown of where the gap lies, the specific theorem that settles this, and why the distinction between knowledge and belief matters.

  ### 1. The Core Distinction: Rationalizability vs. Nash Equilibrium

  To see the gap, we must distinguish what the two solution concepts require of a player's beliefs.

  *   **Rationalizability (The CKR Outcome):** A strategy is rationalizable if it is a best response to *some* belief about the opponents' strategies, where that belief assigns positive probability only to strategies that are themselves best responses to *some* belief, and so on.
      *   *Epistemic Condition:* Common Knowledge of Rationality.
      *   *The Gap:* Under CKR, Player 1 knows Player 2 is rational. Therefore, Player 1 knows Player 2 will not play a dominated strategy. However, Player 1 might still believe Player 2 will play Strategy $A$, while Player 2 actually plays Strategy $B$, provided both $A$ and $B$ are rationalizable. CKR restricts the *set* of possible strategies, but it does not force players' beliefs to match the *actual* strategies played.

  *   **Nash Equilibrium:** A strategy profile is a Nash Equilibrium if each player's strategy is a best response to the *actual* strategies (or mixed strategies) of the opponents.
      *   *Epistemic Condition:* Rationality + **Correct Beliefs** (or mutually consistent conjectures).
      *   *The Requirement:* For Player 1 to play a Nash strategy, Player 1's belief about Player 2 must coincide with Player 2's actual mixed strategy. CKR does not guarantee this coincidence.

  **The Verdict:** CKR ensures that everyone is playing a best response to *something plausible*. Nash Equilibrium requires that everyone is playing a best response to *what is actually happening*.

  ### 2. The Definitive Result: Aumann & Brandenburger (1995)

  The paper that rigorously settles this debate is Robert Aumann and Adam Brandenburger's *"Epistemic Conditions for Nash Equilibrium"* (Econometrica, 1995). They map out exactly what is needed to derive Nash from epistemic assumptions.

  Their main results highlight the gap you suspected:

  1.  **CKR $\rightarrow$ Correlated Equilibrium (Aumann 1987):** If there is a Common Prior and Common Knowledge of Rationality, the resulting distribution of play is a **Correlated Equilibrium**. This is likely what your friend is thinking of. A Correlated Equilibrium is a broader set than Nash; it allows for correlation in strategies mediated by an external signal (or simply by the structure of beliefs).
  2.  **CKR + Common Knowledge of Conjectures $\rightarrow$ Nash Equilibrium:** To narrow Correlated Equilibrium down to Nash Equilibrium, you need to add the assumption that players have **Common Knowledge of their conjectures** (beliefs about opponents' actions).

  **The 2-Player vs. $n$-Player Distinction:**
  Aumann & Brandenburger show a subtle but important difference here:
  *   **In 2-Player Games:** You do not need *Common* Knowledge of conjectures. **Mutual Knowledge** of rationality and **Common Knowledge** of conjectures is sufficient for Nash. (Actually, even weaker: Mutual Knowledge of Rationality + Mutual Knowledge of Conjectures implies the conjectures are a Nash Equilibrium).
  *   **In $n$-Player Games ($n > 2$):** You strictly need **Common Knowledge** of conjectures.
      *   *Why?* In a 3-player game, Player 1 has a belief about the *joint* distribution of (Player 2, Player 3). Even if Player 1 knows Player 2's marginal strategy and Player 3's marginal strategy, Player 1 might believe they are correlated in a way that they are not. Common Knowledge of conjectures forces everyone to agree on the joint distribution, eliminating spurious correlations that would prevent a Nash profile.

  ### 3. Where the "Extra Work" Comes From

  You asked what is doing the work beyond rationality. It is the **Common Knowledge of Conjectures (Beliefs)**.

  *   **CKR** says: "I know you maximize utility."
  *   **CK of Conjectures** says: "I know what you think I will do, and you know what I think you will do, and we agree."

  Without the second condition, we can have a situation where:
  1.  I play $X$ because I think you will play $A$.
  2.  You play $B$ because you think I will play $Y$.
  3.  Both $X$ and $B$ are rational (best responses to *some* belief).
  4.  But $(X, B)$ is not a Nash Equilibrium because I didn't best-respond to $B$, I best-responded to $A$.

  CKR eliminates dominated strategies, but it does not eliminate the mismatch between *anticipated* play and *actual* play. The assumption of Common Knowledge of Conjectures forces the anticipated play to align with actual play.

  ### 4. Common Knowledge vs. Common Belief/Certainty

  You correctly identified that this distinction is load-bearing.

  *   **Knowledge ($K_i$):** Implies truth. If Player 1 *knows* Player 2 plays Strategy $S$, then Player 2 *must* play Strategy $S$.
  *   **Belief ($B_i$):** Does not imply truth. Player 1 can *believe* Player 2 plays $S$ while Player 2 plays $T$.

  **Why this matters for Nash:**
  A Nash Equilibrium is defined by actual strategies being mutual best responses.
  *   If we assume **Common Knowledge of Strategies**, Nash is trivial. If I *know* your strategy, and I am rational, I best-respond to it. If you *know* my strategy, and you are rational, you best-respond to it. That is the definition of Nash.
  *   However, assuming players *know* each other's strategies is a massive assumption. It assumes the equilibrium is already solved.
  *   The more interesting epistemic question is: Can we get Nash from **Common Belief**?
      *   If we only have Common *Belief* in Rationality, we get Rationalizability.
      *   To get Nash, we typically need the beliefs to be **correct**. In the Aumann/Brandenburger framework, this is handled by assuming a **Common Prior**. If we share a prior and have common knowledge of our posteriors (beliefs), our beliefs must coincide (Aumann's Agreement Theorem). This coincidence forces the "belief" to act like "knowledge" regarding the consistency of expectations, thereby yielding Nash.

  So, the "extra work" is often done by a **Common Prior assumption**, which transforms consistent common beliefs into correct predictions.

  ### 5. Why Special Cases (2-Player, Zero-Sum) Behave Better

  Your intuition about special cases is also correct.

  *   **Two-Player Games:** As noted in A&B (1995), the epistemic requirements are weaker. Because there is no third party to create correlation issues, mutual knowledge of conjectures is enough to lock in Nash. The "loop" of beliefs closes faster.
  *   **Zero-Sum Games:** In zero-sum games, the set of rationalizable strategies is often much smaller (sometimes identical to the set of Nash strategies).
      *   By the Minimax Theorem, a player's security strategy (maximin) is a Nash strategy.
      *   If I know you are rational in a zero-sum game, I know you are trying to minimize my maximum gain. This constrains your behavior much more tightly than in a coordination game or Prisoner's Dilemma.
      *   In many zero-sum games, **CKR alone does imply Nash play** because the iterated elimination of dominated strategies (which CKR supports) reduces the game to a single strategy profile. But this is a property of the *payoff structure*, not the epistemic logic itself.

  ### Summary for Your Argument

  You can tell your friend that she is technically describing the conditions for a **Correlated Equilibrium** (CKR + Common Prior), not a Nash Equilibrium.

  To get **Nash Equilibrium**, the rigorous epistemic conditions (per Aumann & Brandenburger 1995) are:
  1.  **Rationality** (Players maximize expected utility).
  2.  **Common Knowledge (or Mutual in 2-player) of Conjectures** (Players know what others believe they will do).
  3.  *(Optional but common)* **Common Prior** (To ensure beliefs are consistent/correct).

  **CKR alone stops at Rationalizability.** The gap is the assumption that players' beliefs about each other are not just consistent with rationality, but are **mutually aligned and correct**. Without that alignment, rational players can talk past each other indefinitely, playing rationalizable strategies that do not form an equilibrium.
