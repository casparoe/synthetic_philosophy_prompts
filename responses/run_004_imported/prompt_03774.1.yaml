answer: |-
  This is one of the most famous and frustrating "cruxes" in Spinoza scholarship. You have hit on exactly the right tension: the collision between Spinoza's radical metaphysical monism (which suggests all human minds are modes of the same attribute of Thought) and his deeply conservative, empirical claim about sexual difference.

  You are right to wince, but you are also right to suspect there is more going on than simple prejudice. This passage is the subject of intense debate (most notably by scholars like Moira Gatens, Étienne Balibar, and Susan James). To answer your specific questions, we have to look at how Spinoza's political science interacts with his metaphysics in the *Political Treatise* (TP), which is distinct from the *Ethics*.

  Here is a close reading of the inference, broken down by your three main questions.

  ### 1. Induction vs. Necessitarianism: Is "What Has Always Been" = "What Must Be"?

  You asked if this is a "bare empirical induction" or if his necessitarianism is doing sneakier work. The answer is: **It is an empirical induction that Spinoza is treating as a law of nature because of his necessitarianism.**

  In the *Ethics*, Spinoza deduces truths from the essence of God. In the *Political Treatise*, however, he explicitly changes his method. He says he wants to treat human affects (love, hate, ambition) not as vices but as "properties, just as heat, cold, storm, thunder, and the like are properties of the atmosphere." He is doing political *physics*.

  In physics, if you observe a universal regularity (e.g., gravity always pulls down), you posit a law of nature. Spinoza looks at history and sees a universal regularity: men rule, women do not.
  *   **The Empirical Move:** He admits he is "consulting experience itself."
  *   **The Necessitarian Twist:** For Spinoza, Nature (*Deus sive Natura*) is a necessary causal order. If something *never* occurs in the history of finite modes (human societies), Spinoza is inclined to think it is repugnant to the nature of those modes.

  However, this is a methodological weakness. Spinoza is leaping from **finite modes** (historical societies) to **essences** (the nature of women). Strictly speaking, just because women *haven't* ruled doesn't mean they *can't* (the "is-ought" problem, or rather the "fact-essence" problem). Spinoza usually avoids this leap, but here, his commitment to a "scientific" politics leads him to treat historical universality as evidence of natural incapacity. He is arguing that the *conatus* (striving) of women is structurally different from men in a way that prevents political power accumulation.

  So, it is induction, but Spinoza believes that in a deterministic universe, universal induction reveals necessity.

  ### 2. Does "Right = Power" (*Jus = Potentia*) Demand This Exclusion?

  This is the core metaphysical tension. In the TTP and TP, Spinoza argues that **Natural Right is coextensive with Power.** You have a right to do what you have the power to do.

  *   **The Structural Argument:** If Right = Power, then exclusion from Right must follow from a lack of Power. Spinoza cannot simply say "Women shouldn't rule." He must say "Women *cannot* rule" (i.e., they lack the *potentia*).
  *   **The Contradiction:** This creates a massive problem for Spinoza's monism. If all minds are modifications of the same divine attribute (Thought), there should be no essential difference in the *capacity* for reason or power between sexes. Difference should be a matter of degree or circumstance, not kind.

  By arguing that women *necessarily* lack equal right because they *necessarily* lack equal power, Spinoza is effectively positing a **dualism of human nature**. He is suggesting that the "essence" of a woman is different from the "essence" of a man regarding their capacity for rational self-determination.

  **Could a committed Spinozist drop this?**
  Yes. Many modern Spinozists (like Moira Gatens) argue that this is a failure of Spinoza's imagination, not a requirement of his system.
  *   If *potentia* is the ability to persevere and act rationally, and if women are educated and socialized differently, their *potentia* could change.
  *   If *potentia* changes, their *Right* changes.
  *   Therefore, the exclusion is **contingent**, not necessary.

  Spinoza treats it as necessary because he assumes the "passive affects" governing women (as he sees them) are immutable. But since Spinoza elsewhere argues that affects can be understood and transformed through reason, a consistent Spinozist framework *should* allow for women to acquire equal power, and thus equal right. The exclusion is an **empirical add-on** that contradicts the universalism of his metaphysics.

  ### 3. The Role of the Passions: Lust and Jealousy

  The closing paragraph about lust and jealousy is not just "supporting colour"; it is actually the **stronger** part of his argument, and it shifts the blame.

  Notice the shift in logic:
  1.  **First half:** Women lack power/right by nature (Essentialist claim).
  2.  **Second half:** Men are irrational and jealous regarding women (Relational claim).

  Spinoza writes: *"men... generally love women merely from the passion of lust... and how very ill-disposed men are to suffer the women they love to show any sort of favour to others."*

  This suggests that the barrier to sexual equality isn't just women's "weakness," but **male irrationality**.
  *   **The Political Problem:** Democracy requires stability and concord. Spinoza believes that if women held equal power, the specific dynamic of male sexual jealousy would lead to civil conflict. Men would fight over women; women's political decisions would be interpreted through the lens of sexual favor.
  *   **The Pragmatic Exclusion:** Spinoza is prioritizing the **stability of the state** over abstract justice. He is effectively saying: "Even if women *could* rule, the current affective economy of men makes it impossible to integrate them without destroying the peace."

  This fits his broader political project in the TP: he is not designing an ideal utopia (like Plato), but analyzing what regimes are *stable*. He concludes that a democracy including women would be unstable because men are not yet rational enough to handle it.

  ### Summary of the Inference

  Here is how the argument flows in Spinoza's mind, reconstructed:

  1.  **Metaphysical Axiom:** Right is defined by Power (*potentia*).
  2.  **Empirical Premise:** In all recorded history, men hold power over women; they never rule equally.
  3.  **Causal Inference:** This universal regularity indicates a difference in natural *conatus* (women are more subject to passions that diminish power, specifically in relation to men).
  4.  **Affective Complication:** Even if women had power, male passions (lust/jealousy) would turn political rivalry into sexual conflict.
  5.  **Political Conclusion:** Including women in the democratic covenant would destabilize the state. Therefore, to preserve the state (the highest good in the TP), they must be excluded.

  ### The "Unfinished" Factor

  It is worth noting, as you did, that this is the **last paragraph Spinoza wrote**.
  *   Some scholars argue he might have revised this.
  *   Others argue he died precisely because he hit an aporia (a logical dead end) where his radical metaphysics crashed into the social realities of the 17th century, and he couldn't resolve it.

  ### Verdict

  To answer your specific doubts:
  1.  **Is it just induction?** It is induction masquerading as natural law, enabled by his necessitarianism. He treats "what always happens" as "what nature dictates."
  2.  **Is it structural to *Right = Power*?** No. It is a failure to apply *Right = Power* consistently. If women gained power, Spinoza's system *requires* he grant them right. He assumes they *can't* gain power, which contradicts his own views on the malleability of human affects.
  3.  **What about the passions?** This is the pragmatic core. He excludes women partly because he thinks they lack power, but also because **men are too irrational to accept women's power.**

  It is a profound tension. Spinoza wants to liberate humans from bondage to the passions, but he assumes that the passion-structure between men and women is immutable. It is the place where the "radical enlightenment" of Spinoza stops short, not because his metaphysics demanded it, but because his "political physics" relied on data (17th-century patriarchy) that he mistook for eternal law.
