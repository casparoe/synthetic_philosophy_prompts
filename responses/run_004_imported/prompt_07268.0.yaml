answer: |-
  This is one of the oldest and sharpest knives in the philosophical drawer, so first: you aren't going in circles, you're bumping up against the **Problem of Ultimate Responsibility**.

  Your intuition is logically sound. The philosopher Galen Strawson formalized this exact objection in what he calls "The Basic Argument." It goes like this:
  1. You do what you do because of the way you *are*.
  2. To be truly responsible for what you do, you must be responsible for the way you *are*.
  3. But you cannot be responsible for the way you *are* (because of genetics, upbringing, random neural firings, etc.).
  4. Therefore, you cannot be truly responsible for what you do.

  Theo claims he chose to change. You correctly point out that the "he" who made that choice was the product of unchosen causes. If the "impulsive Theo" didn't choose to be impulsive, why does "Motivated Theo" get a trophy for choosing to be disciplined? Wasn't that motivation just another unchosen chemical state?

  So, does "I made myself who I am" hold up? The answer depends entirely on whether you are asking a **metaphysical** question or a **psychological** one.

  ### 1. The Metaphysical Answer: No (You are right)
  If we are looking for *ultimate* origin, Theo is deluded. He didn't choose the epiphany that sparked the change. He didn't choose the capacity for discipline. He didn't choose the environment that made change possible. The "spark" of agency that initiated the five-year project was itself caused by prior events.

  In this view, taking credit is a category error. It's like a river taking credit for carving a canyon. The water flowed because of gravity and terrain; the canyon is the result, not a choice.

  ### 2. The Psychological Answer: Yes (Theo is right)
  However, human beings do not live in metaphysics; we live in feedback loops. While Theo didn't choose the *spark*, he did sustain the *fire*.

  This is where the "pushing the problem back a step" critique misses the mechanics of neuroplasticity. The "self" isn't a static noun; it's a verb. It's a process.
  *   **Day 1:** Unchosen motivation leads to one small disciplined act.
  *   **Day 2:** That act slightly alters Theo's brain chemistry and self-perception. He is now 0.1% more "disciplined."
  *   **Day 3:** This new version of Theo finds it slightly easier to choose discipline again.

  Theo isn't claiming he chose his *starting conditions*. He is claiming he participated in the **iteration**. He is taking credit for the *maintenance* of the choice, not the *inception* of the desire.

  The philosopher Harry Frankfurt called this "second-order volition." It's the ability to have a desire *about* a desire. Theo couldn't choose his first-order desire (to be impulsive), but he cultivated a second-order desire (to *want* to be disciplined) and then acted on that. That recursive loop is where we locate "agency" in a practical sense.

  ### 3. The Pragmatic Answer: Credit is a Tool, Not a Fact
  Here is the angle that might help your piece: **Taking credit is a functional technology, not a metaphysical truth.**

  Believing "I made myself" is a self-fulfilling prophecy.
  *   **If Theo believes:** "I am just a victim of causality and my drive to change was random," he is likely to relapse. Why effort if it's all determined?
  *   **If Theo believes:** "I chose this, and I am the kind of person who keeps choices," he reinforces the neural pathways required to maintain the change.

  The pride Theo feels isn't a logical conclusion; it's a **reinforcement mechanism**. The feeling of ownership *is* the glue that holds the new habits together. To strip him of that credit is to undermine the very machinery that allowed him to change.

  ### The Synthesis for Your Article
  You asked if there is a clean answer. There isn't one that satisfies logic *and* experience simultaneously. But there is a useful framing:

  **Theo is not the Author of his self; he is the Editor.**

  He didn't write the initial draft (genetics, childhood, trauma). He didn't even choose the language he was given. But over five years, he aggressively edited the manuscript. He can't claim he wrote the book from scratch, but he can rightly claim responsibility for the final draft.

  **Does "I made myself who I am" hold up?**
  *   **As a statement of origin:** No. It pushes the problem back.
  *   **As a statement of labor:** Yes. It acknowledges the friction of overcoming inertia.

  If you write about this, you might suggest that the "truth" of self-reinvention lies in the paradox. We are both the clay and the sculptor. The clay didn't choose to be clay, and the sculptor didn't choose to be born a sculptor. But the act of sculpting is real, the sweat is real, and the resulting shape is distinct.

  Theo's pride is valid not because he escaped causality, but because he *rode* it. He caught a wave of unchosen motivation and surfed it for five years. You don't create the ocean, but you still get to say you surfed the wave.
