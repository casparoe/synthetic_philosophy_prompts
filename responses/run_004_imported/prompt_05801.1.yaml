prompt: |-
  I sit on the small committee that picks the winner of our company's yearly 'Ethical Courage Award' -- comes with a $5,000 bonus, a plaque, and a few minutes on stage at the all-hands meeting, and, per the award's own one-paragraph charter, it exists to recognize someone who showed 'integrity and courage, often at real personal cost, in upholding the standards we hold ourselves to.' This year's clear frontrunner, nominated by her whole department, is a senior accountant who flagged that her director had been quietly reclassifying expenses to hit quarterly targets, which led to an internal investigation, a restatement, and the director getting fired. Good outcome, nobody on the committee disputes that part.

  The wrinkle showed up during the quiet reference checks we always do before finalizing a winner. Two people on her team told us, separately, that she only went to compliance after she found out the external auditors had pulled the relevant ledger for an unrelated sampling reason and were likely to catch the discrepancy themselves within the month anyway, and that she'd told a friend at the time she was mainly scared of being the one left holding the bag later, since she'd signed off on some of those same numbers herself without asking questions when they first came across her desk. (I only ended up on this committee because I complained loudly last year about how toothless it seemed -- lesson learned.)

  Now we're genuinely split and meet again next week to vote, with no precedent to lean on since this is only the third year we've run the award. About half the committee thinks what matters is what she did and what it led to: she used the proper channel, it worked, and rewarding it tells everyone else in her position to come forward instead of staying quiet, whatever her private reasons were. The other half point out the award explicitly isn't just an 'outcome' bonus -- we already have a separate spot-bonus program for that -- and think handing this particular citation to someone who reportedly acted mainly to cover herself makes the whole thing a bit of a joke, especially next to another nominee this cycle who flagged a much smaller issue and lost a friendship over it with nothing personal to gain from it. I dont think either side is being dumb, and I go back and forth depending on the day. Can you draft the memo I'll actually circulate before the vote -- something that lands on one real recommendation (give her the award as written, give a scaled-down version of it, like the bonus without the citation language and the stage time, or pass over her this cycle for the other nominee), and that takes the strongest version of the losing side's argument seriously instead of just waving at it?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the "Ethical Courage Award" committee.
      *   **Task:** Draft a memo to circulate to the committee before the final vote next week.
      *   **Goal:** Make a *specific recommendation* (Give full award, Give scaled-down award, or Pass over for other nominee) and argue for it persuasively.
      *   **Constraint:** Must take the strongest version of the *losing* side's argument seriously (steel-manning), not just dismiss it.
      *   **Context:**
          *   Award Charter: "Integrity and courage, often at real personal cost, in upholding the standards we hold ourselves to."
          *   Frontrunner (Accountant): Flagged expense reclassification fraud. Result: Investigation, restatement, Director fired.
          *   The Wrinkle: Reference checks suggest she acted *after* learning auditors were likely to find it anyway, and primarily to avoid personal liability ("holding the bag"), not pure altruism.
          *   Alternative Nominee: Flagged smaller issue, lost a friendship, nothing personal to gain.
          *   Committee Split: 50/50. One side says "Outcome/Precedent matters," the other says "Intent/Charter matters."
          *   User's History: Joined committee because they complained about it being toothless last year (implies they care about the award having real weight/meaning).

  2.  **Determine the Recommendation:**
      *   *Option A (Full Award):* Risks undermining the "courage" aspect if the self-preservation motive is true. Makes the award about outcomes, not character.
      *   *Option B (Pass Over):* Risks discouraging future whistleblowing. Sends a message that "impure motives" negate the good deed. Punishes the messenger for being human.
      *   *Option C (Scaled-Down/Split):* Acknowledges the action but distinguishes the *nature* of the courage. This feels like the most nuanced and defensible position given the charter's specific language ("integrity and courage... at personal cost").
      *   *Decision:* I need to pick one to make the memo effective. The prompt asks me to "land on one real recommendation."
      *   *Reasoning:* The charter specifically mentions "courage... at real personal cost." If her primary motive was self-pervation (avoiding liability) rather than upholding standards *despite* risk, does it fit the charter? However, she *did* risk retaliation (Director fired, she might be seen as a snitch). But the reference checks say she acted *after* auditors were on it.
      *   *Strongest Ethical Stance:* The award is about *culture*. If we give it to someone who acted to save their own skin when the game was already up, we cheapen the "Courage" label. However, punishing her completely might chill reporting.
      *   *Selected Recommendation:* **Pass over her for the Award, but recommend a significant Spot Bonus and private recognition.** Why? Because the charter is specific about "courage" and "personal cost." If the motive was self-preservation when discovery was imminent, it lacks the *courage* element required by the charter, even if the *outcome* was good. The other nominee fits the charter better. This aligns with the user's history of wanting the award to have teeth/meaning (not just be a payout). It respects the charter's specific wording over the general "good outcome" argument.

      *Wait, let me reconsider.* If I recommend passing her over, does that discourage whistleblowing? Yes. But the prompt says the user complained last year about the award being "toothless." Giving it to someone who acted out of self-preservation might make it feel *hollow* rather than toothless.
      *Alternative:* **Give the Award, but reframe the narrative.** No, that feels like spinning.
      *Alternative:* **Scaled-down version.** Bonus yes, Plaque/Stage no. This acknowledges the value of the action without claiming it was an act of "Ethical Courage" in the purest sense. This seems like the most pragmatic middle ground that respects both sides. It rewards the *compliance* without mislabeling the *motivation*.
      *Actually, looking at the prompt again:* "Give her the award as written, give a scaled-down version of it... or pass over her this cycle for the other nominee."
      *Let's go with the **Scaled-Down Version**.* It allows the committee to reward the *act* (which was legally correct and beneficial) without validating the *motive* as "courageous" under the strict charter definition. It protects the integrity of the Award's specific language while acknowledging the utility of her action.
      *Wait, stronger argument:* If the charter says "courage... at personal cost," and she acted to *avoid* personal cost (liability), she technically didn't meet the criteria. The other nominee *did*. To maintain the award's prestige (which the user cares about), we should give it to the person who actually met the criteria.
      *Okay, I will recommend **Passing over her for the Award and giving it to the other nominee**, while ensuring the Accountant gets the financial bonus via a different channel.* This is the boldest move that aligns best with the "toothless" complaint. If the award is just for "good outcomes," it *is* toothless. It needs to be about character.

      *Refining the Recommendation:* I will recommend **awarding the other nominee** for the Ethical Courage Award, while recommending the Accountant receive the **$5,000 bonus via the standard Spot Bonus program** (without the plaque/stage/citation). This separates "Doing the right thing for the company" (Accountant) from "Ethical Courage at Personal Cost" (Other Nominee). This satisfies the "Outcome" crowd (Accountant gets money) and the "Intent" crowd (Other Nominee gets the Honor).

  3.  **Drafting the Memo - Structure:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose and the recommendation clearly.
      *   **The Case for the Accountant (Steel-manning the opposition):** Acknowledge why she is the frontrunner. Impact, precedent, objective good.
      *   **The Charter Constraint:** Analyze the specific wording ("courage," "personal cost").
      *   **The Risk:** What happens if we give her the award? (Devaluation of the honor, cynicism).
      *   **The Alternative:** The other nominee fits the charter better.
      *   **The Compromise/Solution:** Accountant gets money (Spot Bonus), Other Nominee gets the Award.
      *   **Closing:** Call to action for the vote.

  4.  **Tone:** Professional, thoughtful, decisive, respectful of the split, aligned with the company's values.

  5.  **Key Arguments to Include:**
      *   *Outcome vs. Intent:* The award isn't a KPI bonus.
      *   *Precedent:* Setting the bar for "Courage."
      *   *The "Toothless" Factor:* If we ignore motive, the award becomes a transaction.
      *   *The Accountant's Protection:* She still needs to be rewarded financially to encourage reporting.

  6.  **Review against Constraints:**
      *   *One real recommendation?* Yes (Split the reward: Money for Accountant, Award for Other).
      *   *Take losing side seriously?* Yes (Acknowledge the importance of encouraging reporting and the magnitude of the fraud).
      *   *User's history?* Acknowledge the desire for the award to mean something.

  7.  **Final Polish:** Ensure the distinction between the "Ethical Courage Award" and the "Spot Bonus" is clear. This is the linchpin of the solution.

  *(Self-Correction during drafting)*: I need to make sure I don't sound like I'm leaking the reference checks. The memo is internal to the committee, so confidentiality is assumed, but I should frame it as "information gathered during due diligence" rather than gossip.

  *(Refining the Recommendation)*: Actually, recommending a "scaled-down version" (Bonus yes, Stage/Plaque no) might be smoother than giving the award to someone else entirely, as the prompt lists that as an option. However, giving the award to the other nominee is stronger for the "integrity of the award" argument. Let's look at the options again: "give her the award as written, give a scaled-down version of it... or pass over her this cycle for the other nominee."
  Okay, I will choose **Pass over her this cycle for the other nominee**. This is the most principled stand regarding the *charter*. I will recommend the Accountant get the $5k via the *existing spot-bonus program* mentioned in the prompt ("we already have a separate spot-bonus program for that"). This perfectly solves the dilemma.

  8.  **Finalizing the Memo Content:**
      *   **Subject:** Recommendation for Year 3 Ethical Courage Award
      *   **Recommendation:** Award to Other Nominee. Accountant to receive Spot Bonus.
      *   **Rationale:** Preserving the specific meaning of "Courage" vs. "Compliance."
      *   **Addressing the Counter:** Acknowledge the risk of discouraging whistleblowing, mitigate with the guaranteed bonus.

