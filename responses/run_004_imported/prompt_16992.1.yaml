answer: |-
  It is a pleasure to address a colleague who appreciates the elegance of the Dutch Book argument. Your intuition is shared by many: if the synchronic Dutch Book argument secures the probability axioms, the diachronic version (often attributed to David Lewis and Paul Teller) seems to secure conditionalization with equal force. To a working scientist, it feels like a single coherent framework.

  However, in formal epistemology, Conditionalization is treated as a substantive, independent norm rather than a mere corollary of Probabilism. The reason lies in the logical gap between **constraints on states** and **constraints on transitions**.

  Here is why philosophers treat Conditionalization as a distinct assumption, broken down into the specific technical and conceptual hurdles that prevent it from being a straightforward derivation from Probabilism alone.

  ### 1. The "State vs. Dynamics" Distinction
  As a physicist, you will recognize the distinction between a **state function** and an **equation of motion**.
  *   **Probabilism** is a constraint on a state: At any instant $t$, your credence function $P_t$ must satisfy the Kolmogorov axioms.
  *   **Conditionalization** is a constraint on dynamics: It dictates how you move from state $P_t$ to state $P_{t+1}$ given evidence $E$.

  You cannot derive a law of motion solely from a constraint on a state without adding a "bridge principle" regarding how the agent views their future self. The synchronic Dutch Book argument shows that if your *current* betting odds are incoherent, you lose money *now*. It does not, by itself, dictate how you must change those odds *later*. To get Conditionalization, you must add a premise about the relationship between your current credences and your anticipated future credences.

  ### 2. The Reflection Principle (The Missing Bridge)
  To make the Diachronic Dutch Book argument work, one typically needs to invoke something like **van Fraassen's Reflection Principle**. This principle states that your current credence in a proposition $A$, conditional on your future credence in $A$ being $x$, should itself be $x$.
  $$ P_t(A \mid P_{t+1}(A) = x) = x $$

  Without this principle (or an equivalent assumption about respecting your future rational self), the Dutch Book cannot be constructed. You could coherently say, "I know that tomorrow, after seeing the data, I will believe $H$ with probability 0.9, but today I think that future self is going to be overly optimistic, so I'll stick with 0.5."

  As long as you satisfy the probability axioms at $t$ and at $t+1$ separately, you are probabilistically coherent at both instants. To force you to link them via Conditionalization, we must assume you are not allowed to distrust your future updating process. That assumption is external to Probabilism.

  ### 3. The Pre-commitment Loophole
  The Diachronic Dutch Book argument relies on the agent **pre-committing** to an updating rule.
  The bookie constructs the bet based on your announced plan: "If $E$ happens, I will update to $P_E$." If you deviate from that plan, you get booked.

  However, a clever agent can evade the Dutch Book by refusing to announce a rule in advance. They can say, "I will update when I see the evidence, but I reserve the right to decide *how* to update at that time."
  *   If you are not bound by a pre-announced rule, the bookie cannot construct the second half of the bet (the one contingent on the update) at time $t$.
  *   Therefore, the vulnerability to a Dutch Book arises not from the *act* of non-conditionalizing, but from the *policy* of announcing a rule you don't follow.

  This suggests that Conditionalization is a norm of **planning consistency**, not necessarily a logical requirement of belief itself. Many epistemologists find this unsatisfying; they want Conditionalization to be true because it tracks truth or accuracy, not merely because it prevents you from being tricked by a bookie if you talk too much.

  ### 4. The Idealization of Certainty
  Standard Conditionalization assumes that evidence $E$ is learned with certainty ($P_{new}(E) = 1$). In experimental physics, as you know, data is rarely certain; it comes with error bars and systematic uncertainties.
  *   If evidence is uncertain, standard Conditionalization is inapplicable.
  *   One must use **Jeffrey Conditionalization** (Probability Kinematics).
  *   However, Jeffrey Conditionalization requires a different set of constraints (rigidity conditions) that are not entailed by the standard Dutch Book argument for Probabilism.

  Because the "clean" Dutch Book argument for Conditionalization breaks down in the face of uncertain evidence (which is most evidence), philosophers treat the updating rule as a separate module that can be swapped out (e.g., for MaxEnt or Imaging) depending on the nature of the evidence, rather than a hard logical consequence of the axioms.

  ### 5. Pragmatic vs. Epistemic Normativity
  Finally, there is a meta-philosophical disagreement that you, as a pragmatist, might find less pressing, but which dominates the literature.
  *   **The Dutch Book Argument is Pragmatic:** It shows that incoherence leads to *financial loss*.
  *   **Epistemology seeks Epistemic Norms:** It wants to show that incoherence leads to *inaccuracy* or *falsehood*.

  Many modern Bayesians (such as Jim Joyce) argue that avoiding a sure loss is not the same as being rational. One could avoid Dutch Books by simply refusing to bet, yet still hold absurd beliefs. Consequently, many philosophers prefer **Accuracy Dominance arguments** (showing that non-conditionalizing credences are guaranteed to be less accurate by a proper scoring rule) over Dutch Book arguments.

  Because the Dutch Book argument is viewed by many as merely establishing *prudence* rather than *rationality*, Conditionalization is debated on its own epistemic merits rather than accepted as a corollary of betting coherence.

  ### Summary
  Your intuition that the arguments are structurally similar is correct. However, Conditionalization is treated as a separate assumption because:
  1.  **Logic:** You cannot derive a dynamic rule (transition) solely from a static constraint (state) without a bridge principle (Reflection).
  2.  **Strategy:** The Dutch Book vulnerability only arises if the agent pre-commits to a rule, making it a norm of planning rather than belief.
  3.  **Scope:** The standard argument fails for uncertain evidence, requiring alternative updating norms.
  4.  **Normativity:** Avoiding monetary loss is not universally accepted as equivalent to epistemic rationality.

  In short, Probabilism tells you what a snapshot of a rational mind looks like. Conditionalization tells you how that mind must move. In physics, the Hamiltonian doesn't follow from the definition of energy; it is a separate postulate about the system's dynamics. Similarly, in Bayesian epistemology, Conditionalization is the Hamiltonian of belief—a necessary, but distinct, postulate.
