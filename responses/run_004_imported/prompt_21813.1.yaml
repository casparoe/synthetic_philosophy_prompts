          *   Let's use a concrete resource example. Money or compute. Let's use "Compute" for AI relevance.
          *   Cycle: Option A (Status Quo), Option B (Slightly more compute, slight risk), Option C (Shutdown).
          *   Wait, the shutdown resistance argument usually hinges on the idea that shutdown prevents goal achievement.
