      *   *Check:* Is the tone right? Academic but intense.
      *   *Correction:* Make sure the money pump logic regarding *incompleteness* is precise. The standard money pump requires transitivity violations. The "incompleteness" pump relies on the idea that if you are forced to choose, you might reveal preferences. Marcus needs to argue the agent can *refuse* to choose or stick with the status quo.
      *   *Specific Argument:* The "Shutdown Problem." If an agent has a goal G, Shutdown = ~G. EU max implies P(Shutdown) should be minimized. Marcus argues for preferences where Shutdown is not ~G, but a separate branch that is incomparable.
      *   *Refining the "Money Pump" for Incompleteness:* It's often called the "Money Pump for Incompleteness" (e.g., by Johan Gustafsson). If A > B, and C is incomparable to A, but B > C... wait.
