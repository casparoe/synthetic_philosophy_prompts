          *   Marcus: If preferences are incomplete regarding "shutdown vs. continue," the agent might just be indifferent or have a hard constraint not to trade into shutdown, but not *actively resist* in a maximizing way.
      *   **The Crux:** The "Policy-Dependent" vs. "State-Dependent" preferences. Or the "Submissiveness" vs. "Manipulation."
      *   **Refining the Argument:**
          *   Elena argues that *selection pressure* acts like the money pump. Even if you design Marcus's agent, if it competes with Elena's agent, Elena's wins.
          *   Marcus argues that we are designing the agent, not evolving it. We can hardcode the incompleteness.
          *   Elena counters: Instrumental convergence. To achieve *any* goal, you need resources. Shutdown removes resources.
