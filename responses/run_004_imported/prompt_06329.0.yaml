      *   *Nuance:* In Move 1, Marcus is right about the *genetic code* specifically. Crick himself argued this. But Priya is right that "DNA = Organism Code" is the bigger, shakier claim. I need to make sure that distinction is clear.
      *   *Nuance:* In Move 4, Priya is right about epigenetics, but philosophers like Godfrey-Smith argue that genetic inheritance is still *qualitatively* different (complexity, stability) even if not *ontologically* unique. I should mention that.
