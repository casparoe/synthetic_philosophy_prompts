prompt: |-
  So, I'm a retired biochemist (ribosome and translation biochemistry, mostly) and I only got serious about philosophy after retiring a couple years back, so bare with me if I fumble the terminology.

  At a reunion dinner with old labmates last month, two former colleagues, Priya and Marcus, got into it over whether DNA is 'really' a code or just a metaphor us molecular biologists got too attached to. Roughly how it went:

  (1) Marcus said DNA obviously is a literal code, not a metaphor: there's an actual table mapping all 64 codons onto 20 amino acids plus stop signals, and the mapping is essentially arbitrary -- nothing chemically forces GCU to mean alanine rather than something else. That arbitrariness, he said, is exactly what separates real codes, like Morse code, from ordinary causal processes like a river depositing silt.

  (2) Priya said fine, that narrow translation step is code-like, but that's a much smaller claim than the one everybody actually relies on -- that DNA carries 'the information for building the organism.' That bigger claim is shakier, since identical genomes produce different outcomes depending on the cytoplasm and environment around them. If DNA counts as carrying information, she said, so should all the other developmental factors that are just as causally necessary, and then DNA isn't specially privileged.

  (3) Marcus answered that there's a principled reason to single DNA out anyway: it's the one part of the system natural selection specifically shaped to be copied and read out reliably across generations, which is a stronger status than merely being a necessary ingredient, even granting the surrounding cellular machinery is selected too.

  (4) Priya shot back that plenty of non-DNA stuff is also reliably copied and selected across generations -- she brought up prions and some epigenetic inheritance cases -- so his 'shaped by selection to be copied' test doesn't actually draw the line only around DNA like he needs it to.

  Nobody at the table could settle it and it's been bugging me since. Could you go through the exchange move by move and say who's got the better of it at each step -- not just who wins overall -- and flag anything you think both of them are still missing?
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User and Context:**
      *   **User:** Retired biochemist (ribosome/translation specialist). This means they have deep technical knowledge of the mechanisms (codons, translation, etc.) but are newer to philosophy (self-described "fumble the terminology").
      *   **Context:** A debate between two former colleagues (Priya and Marcus) at a reunion dinner about the ontological status of DNA as "code" vs. "metaphor."
      *   **Task:** Analyze the exchange move-by-move, evaluate who has the better argument at each step, and identify what both might be missing.
      *   **Tone:** Respectful, intellectually rigorous but accessible (avoiding excessive jargon without explanation), acknowledging the user's expertise while bridging into philosophy of biology.

  2.  **Deconstruct the Debate (Move-by-Move):**

      *   **Move 1 (Marcus):** DNA is a *literal* code because of the genetic code table (codon $\to$ amino acid). Key feature: Arbitrariness (no chemical necessity linking GCU to Alanine). Analogy: Morse code vs. river silt.
          *   *Philosophical Concept:* Semiotics (signifier/signified), Arbitrariness (Saussure/Crick), Causal vs. Semantic information.
          *   *Evaluation:* Strong point on arbitrariness within translation. Weak point on conflating "translation" with "DNA as a whole."
      *   **Move 2 (Priya):** Translation is code-like, but the broader claim ("DNA has info for the organism") is shaky. Context matters (cytoplasm, environment). If DNA has info, so does the cytoplasm (parity of reasoning).
          *   *Philosophical Concept:* Developmental Systems Theory (DST), Context-dependence, Parity Principle.
          *   *Evaluation:* Strong point on developmental context. Challenges the "privileged status" of DNA.
      *   **Move 3 (Marcus):** DNA is privileged because Natural Selection specifically shaped it for *copying and readout* across generations (Replicator vs. Interactor distinction, implicitly).
          *   *Philosophical Concept:* Dawkins' Replicator, Maynard Smith's "Information in Biology," Teleosemantics.
          *   *Evaluation:* Attempts to ground the "code" status in evolutionary function. Distinguishes *vehicle* of inheritance from *context* of development.
      *   **Move 4 (Priya):** Non-DNA stuff (prions, epigenetics) is also copied/selected. The line isn't exclusive to DNA.
          *   *Philosophical Concept:* Extended Inheritance, Non-genetic inheritance.
          *   *Evaluation:* Empirically correct (epigenetics exists). Challenges the exclusivity of Marcus's criterion.

  3.  **Evaluate "Who Wins" at Each Step:**

      *   *Move 1:* Marcus is technically right about the *genetic code* (translation), but potentially overextends to *DNA as a blueprint*. (Point: Marcus, with caveats).
      *   *Move 2:* Priya is right about development (DST). DNA isn't a sole sufficient cause. (Point: Priya).
      *   *Move 3:* Marcus makes a strong evolutionary argument (teleosemantics), but relies on a central dogma view. (Point: Marcus, philosophically robust but biologically narrowing).
      *   *Move 4:* Priya is empirically right about non-genetic inheritance, but does it undermine the *code* metaphor or just the *exclusivity*? (Point: Priya on biology, Marcus might concede on exclusivity but hold on *primary* status).

  4.  **Identify What They Are Missing (The Synthesis):**

      *   **Semantics vs. Causation:** They are mixing "code" (semantic) with "cause" (causal).
      *   **Teleosemantics:** The philosophical framework that specifically addresses Marcus's Move 3 (Ruth Millikan, Peter Godfrey-Smith). Information is defined by *function* derived from history of selection.
      *   **Developmental Systems Theory (DST):** The framework supporting Priya (Oyama, Griffiths). Rejects the privileging of DNA.
      *   **The "Code" Ambiguity:** Are they talking about the *genetic code* (translation) or the *developmental program* (phenotype)? Marcus conflates them; Priya separates them.
      *   **Biochemist's Perspective:** As a ribosome specialist, the user knows the translation machinery is physical, not just abstract. The "code" exists *in the machinery*, not just in the DNA.

  5.  **Drafting the Response:**

      *   *Introduction:* Acknowledge the user's background. Validate the question (it's a classic philosophy of biology debate).
      *   *Move-by-Move Analysis:*
