answer: |-
  **MEMORANDUM**

  **TO:** Ethics Committee, Administration, and Stakeholders
  **FROM:** [Your Name], Family Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding AI-Driven Behavioral Monitoring Pilot

  ### **Recommendation**

  I recommend that the committee **APPROVE THE PILOT WITH STRICT ETHICAL LIMITS.**

  Specifically, the AI system may be deployed to assist caregivers in understanding non-verbal cues, but it is **strictly prohibited from overriding existing Written Care Plans (Advance Directives).** The AI must function as an advisory tool for the "Now Self," while the Written Plan remains the binding authority of the "Then Self." If the AI's suggestions conflict with the resident's lucid directives, the Written Plan prevails.

  Additionally, participation must be opt-in for families, data must be siloed strictly for care purposes (no training external models), and the pilot requires a hard sunset review in six months.

  ---

  ### **Context and Ethical Tension**

  Management proposes an AI system to monitor resident behavior continuously, creating dynamic preference profiles that supersede care plans established while residents were lucid. The committee is evenly divided. This is not merely a technical dispute; it is a fundamental conflict between two core bioethical principles: **Precedent Autonomy** (the right of your lucid self to dictate your future care) versus **Beneficence** (the duty to minimize the current suffering of your impaired self).

  As the family representative, my duty is to ensure that neither principle is discarded. Below is the case for both sides of this divide. Even though I am recommending a conditional approval, the argument for rejection must be fully understood, as it highlights the risks we are accepting.

  ### **The Case for Rejection (The Argument for Precedent Autonomy)**

  *This is the argument made by the half of the committee concerned about overriding written plans. Even if we proceed with the pilot, their concerns highlight the dangers we must guard against.*

  **1. The "Ulysses Contract" Violation:**
  When a resident signs a care plan while lucid, they are signing a contract with their future self. They might write, "I value privacy over socialization," or "I do not want music." In dementia, the brain changes. A resident might now flinch at a hug (which they once loved) or reach for a cookie (which they once avoided due to diabetes). If we allow an AI to interpret that flinch as "dislike" and that reach as "preference," we are allowing the disease to rewrite the person's moral identity. We are saying the disease knows better than the person did when they were whole.

  **2. The Interpretation Risk:**
  AI reads behavior, not intent. In dementia, behavior is often a symptom, not a preference. A resident might flinch not because they dislike a caregiver, but because they are experiencing pain, a spasm, or a hallucination. A resident might reach for an object due to compulsive grasping (a neurological symptom), not desire. If the AI codifies these symptoms as "preferences," we risk building care plans around the pathology of the disease rather than the needs of the human.

  **3. The Surveillance State:**
  Continuous monitoring turns a home into a panopticon. For families, knowing a camera is analyzing every grimace and gesture creates a sense of perpetual evaluation. It risks dehumanizing care, turning compassion into data points. If we accept this, we set a precedent that privacy is forfeited upon cognitive decline.

  ### **The Case for Approval (The Argument for Current Well-Being)**

  *This is the argument made by the half of the committee seeing calmer residents. This is the primary driver for my recommendation to proceed, provided safeguards are in place.*

  **1. The Tyranny of the Past Self:**
  The "lucid self" is a stranger to the "dementia self." A woman who was fiercely independent and hated assistance may now be terrified when left alone. If we rigidly enforce her old plan to "let me do it myself," we may be causing her terror in the name of honoring her autonomy. Sometimes, honoring the person means ignoring their past instructions to keep their current self safe and calm.

  **2. Giving Voice to the Non-Verbal:**
  As dementia progresses, residents lose the ability to say "I like this" or "Stop that." They are left with only behavior. Currently, caregivers guess what that behavior means. If the AI can identify patterns humans miss—such as a resident consistently settling down after hearing specific tones of voice—it gives a voice to those who cannot speak. It shifts care from "task completion" to "response."

  **3. Measurable Reduction in Distress:**
  The pilot data suggests residents are calmer. In memory care, agitation is a form of suffering. If a tool reduces agitation without chemical restraints (medication), it is a moral imperative to investigate it. Rejecting a tool that reduces suffering because of abstract ethical concerns is its own ethical failure.

  ### **Rationale for "Approve with Limits"**

  We cannot choose one self over the other. We cannot abandon the lucid resident who planned for their future, nor can we abandon the impaired resident suffering in the present.

  Therefore, the AI must not be a **Decision Maker**; it must be a **Translator.**

  If we allow the AI to *override* the Written Care Plan, we violate the legal and ethical standing of the Advance Directive. This exposes the facility to liability and violates the trust of families who relied on those documents. However, if we ban the AI entirely, we may be ignoring valid signals of distress from residents who can no longer speak.

  **The Compromise:**
  The AI can suggest *how* to implement the care plan, but not *what* the care plan is.
  *   **Example:** If the Care Plan says "Resident prefers quiet environments," but the AI notices the resident responds well to soft jazz, the AI can suggest jazz *if* it doesn't violate the "quiet" mandate.
  *   **Example:** If the Care Plan says "No sugar due to diabetes," the AI cannot suggest feeding the resident cake just because they reached for it.

  ### **Conditions for Approval**

  To move forward, Management must agree to the following binding constraints:

  1.  **Hierarchy of Authority:** The Written Care Plan (Lucid Self) is the Constitution. The AI Profile (Current Self) is a lobbyist. The AI can never supersede the Written Plan. In cases of conflict, a human ethics review is required, not an algorithmic one.
  2.  **Opt-In Consent:** No resident is enrolled without explicit family/guardian consent. This is not a default setting.
  3.  **Human-in-the-Loop:** Caregivers are trained to view AI suggestions as *hypotheses*, not orders. They must document when they override the AI.
  4.  **Data Sovereignty:** Data collected belongs to the resident/family. It cannot be used to train external models or sold. It must be deleted upon discharge or death.
  5.  **Sunset Clause:** This pilot expires in six months. Renewal requires a vote based on demonstrated outcomes, not just "calmer" metrics, but quality-of-life metrics approved by the committee.

  ### **Conclusion**

  We are walking a line between protecting who our loved ones *were* and caring for who they *are*. By approving this pilot with the strict prohibition on overriding advance directives, we acknowledge that while the disease may steal memory, it does not steal the right to have one's prior wishes respected. We gain the potential benefit of reduced suffering without sacrificing the ethical foundation of consent.

  I move we adopt this recommendation for the vote next week.
