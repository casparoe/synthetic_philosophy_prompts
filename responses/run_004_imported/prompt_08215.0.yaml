      *   *Climate Debate:* The Stern Review (2006) used a near-zero pure time preference rate, aligning with Ramsey. Nordhaus and others criticized this as implying unrealistic savings rates and undervaluing the present.
      *   *The Nuance:* The discount rate ($r$) is composed of more than just pure time preference ($\rho$). It includes growth ($g$) and elasticity of marginal utility ($\eta$). The Ramsey Rule is $r = \rho + \eta \cdot g$.

  3.  **Identify the Key Reasons for Positive Discount Rates (despite Ramsey):**
      *   *Reason 1: The Ramsey Rule itself.* Ramsey didn't say the *social discount rate* should be zero. He said *pure time preference* ($\rho$) should be zero. The overall rate ($r$) can still be positive due to expected economic growth.
