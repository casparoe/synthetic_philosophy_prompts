      *   *Reason 3: Uncertainty/Risk.* Future benefits are uncertain (catastrophes, technological breakthroughs, existence of humanity).
      *   *Reason 4: Democratic/Political Reality.* People *do* exhibit time preference. Ignoring it might lead to policies the public won't accept.
      *   *Reason 5: The "Infinity" Problem.* If $\rho = 0$ and growth is low, the model might demand infinite savings for the future, crippling the present generation.

  4.  **Structure the Answer:**
      *   **Acknowledge and Validate:** Confirm the user's understanding of Ramsey is correct. He did call pure time preference ethically indefensible.
      *   **Clarify the Terminology (Crucial Step):** Distinguish between *Pure Time Preference* ($\rho$) and the *Social Discount Rate* ($r$). This is the most common source of confusion. Explain the Ramsey Equation ($r = \rho + \eta g$).
      *   **Explain Why $r > 0$ even if $\rho \approx 0$:** Focus on economic growth ($g$). If future people are richer, marginal utility of consumption is lower. Transferring wealth from rich future to poor present can be efficient.
      *   **Address the Nordhaus vs. Stern Debate:**
          *   Stern: Low $\rho$ (Ramseyian), low $r$, aggressive action now.
          *   Nordhaus: Higher $\rho$ (reflecting market rates/observed behavior), higher $r$, gradual action.
          *   Why Nordhaus won (mostly): Stern's implied savings rate was too high; market rates reflect opportunity cost.
      *   **Other Justifications for Positive Discounting:**
          *   Opportunity cost of capital.
