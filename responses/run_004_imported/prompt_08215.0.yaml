answer: |-
  You have hit on one of the most famous and contentious issues in welfare economics and climate policy. You are absolutely correct about Frank Ramsey's position. In his seminal 1928 paper *"A Mathematical Theory of Saving,"* Ramsey wrote that discounting future well-being simply because it occurs later is **"ethically indefensible and arising merely from the weakness of the imagination."**

  However, the reason economists still use positive discount rates isn't necessarily because they are ignoring Ramsey, but because of a technical distinction in how the discount rate is constructed, combined with practical arguments about economic growth and opportunity costs.

  Here is the breakdown of why Ramsey's "zero discount rate" recommendation doesn't translate to a zero discount rate in climate models, and why the Nordhaus vs. Stern debate played out the way it did.

  ### 1. The Crucial Distinction: $\rho$ vs. $r$
  The biggest source of confusion is the difference between **Pure Time Preference ($\rho$)** and the **Social Discount Rate ($r$)**.

  Ramsey argued that **Pure Time Preference ($\rho$)** should be zero. This is the rate at which we discount the future *just* because it is the future, holding well-being constant. Ramsey viewed this as discrimination against future generations.

  However, the actual **Social Discount Rate ($r$)** used in cost-benefit analysis is determined by the **Ramsey Rule**:

  $$r = \rho + \eta \cdot g$$

  Where:
  *   **$\rho$ (Pure Time Preference):** The ethical impatience (Ramsey says this should be ~0).
  *   **$\eta$ (Elasticity of Marginal Utility):** How much less value an extra dollar gives you as you get richer (diminishing marginal utility).
  *   **$g$ (Expected Economic Growth):** How much richer future generations will be.

  **The Loophole:** Even if you follow Ramsey and set $\rho = 0$, the discount rate ($r$) can still be positive if you expect the future to be wealthier ($g > 0$).

  **The Ethical Logic:** If we expect future generations to be much richer than us due to technological progress, the *marginal utility* of a dollar to them is lower than it is to us. Therefore, transferring \$100 from a rich future person to a poor present person (via investment) increases total welfare. Economists argue this isn't "discriminating against the future"; it's accounting for the fact that money matters less to rich people.

  ### 2. The Opportunity Cost of Capital
  Even if you accept Ramsey's ethical argument, there is a descriptive reality: capital is productive.

  If the government spends \$1 billion on climate mitigation today, that is \$1 billion *not* invested in infrastructure, education, or R&D. Historically, private capital returns a positive rate (usually 4–6% real).

  If economists set the discount rate to zero, it implies that society should be willing to sacrifice \$1 today to gain \$1.01 in 100 years. But if that \$1 invested in the market would become \$20 in 100 years, a zero discount rate implies we should consume almost nothing today and invest everything for the future.

  Most economists (like Nordhaus) argue that the discount rate should reflect the **opportunity cost of capital**. If the market returns 5%, using a 0% discount rate for public projects creates a massive distortion, crowding out private investment and potentially slowing the very growth that will help future generations adapt to climate change.

  ### 3. The Stern Review vs. Nordhaus
  This is exactly what the famous debate was about.

  **The Stern Review (2006):**
  *   **Approach:** Took Ramsey literally. Set pure time preference ($\rho$) at 0.1% (virtually zero).
  *   **Result:** Because $\rho$ was so low, the overall discount rate ($r$) was very low (~1.4%).
  *   **Implication:** Future damages from climate change (happening in 100+ years) are valued almost as highly as present costs. This justified immediate, aggressive, and expensive mitigation.
  *   **Criticism:** Critics argued this implied an unrealistically high savings rate. It essentially asked the current generation to impoverish itself for the sake of future generations who would likely be richer.

  **William Nordhaus:**
  *   **Approach:** Argued that discount rates should be consistent with observed market behavior. If people reveal a preference for present consumption through market interest rates, the social discount rate should reflect that. He used a higher $\rho$ (around 1-1.5%).
  *   **Result:** Higher discount rate (~4-5%).
  *   **Implication:** Future damages are discounted more heavily. This justified a more gradual "climate policy ramp"—starting with lower costs and increasing over time.
  *   **Defense:** Nordhaus argued that Stern's approach was ethically inconsistent. If we truly valued the future that highly, we should be saving 50% of our GDP today, not just spending it on climate. Since we don't save that much, our revealed preference shows we do value the present more.

  ### 4. Uncertainty and Existential Risk
  There is a pragmatic argument for discounting that has nothing to do with ethics: **Risk.**

  A positive discount rate can act as a proxy for the probability that the benefit will never materialize.
  *   Will humanity exist in 200 years?
  *   Will there be a technological breakthrough that makes carbon removal cheap?
  *   Will the geopolitical structure exist to utilize the investment?

  If there is a 1% chance per year of a catastrophe that wipes out the value of the investment, you should discount the future by at least 1%. This isn't saying future lives matter less; it's saying the *probability* of those lives enjoying the benefit is less than 100%.

  ### 5. Political Feasibility and Democracy
  Finally, there is a democratic argument. Ramsey's view is a philosophical ideal (utilitarianism across time). However, governments are elected by living people.

  If an economic model prescribes policies that severely lower the standard of living for the current generation based on a philosophical commitment to a zero discount rate, voters may reject those policies. Some economists argue that the discount rate should reflect the **social rate of time preference** revealed by democratic choices and market behavior, rather than an imposed philosophical ideal.

  ### Summary: Are they repeating Ramsey's mistake?
  **Not necessarily.**

  1.  **Most economists agree with Ramsey on $\rho$:** Many would agree that *pure* time preference is ethically dubious.
  2.  **They disagree on $r$:** They argue that $r$ must include growth ($\eta \cdot g$) and opportunity costs.
  3.  **The Conflict:** The debate is really about **how much we should sacrifice today for a richer tomorrow.**
      *   **Ramsey/Stern:** Future well-being is morally equal to present well-being. We should save heavily.
      *   **Nordhaus:** Future well-being is morally equal, but future people will be richer, and capital is productive. We should balance present and future consumption.

  So, when economists use a positive rate, they aren't usually saying "future people matter less." They are saying "future people will likely be richer, capital grows over time, and there is uncertainty about whether our investments will survive that long."

  However, you are right to be skeptical. In practice, high discount rates *do* have the effect of making long-term existential threats (like climate change) look cheaper to ignore. That is why the choice of the discount rate is often called **"the most important number in the world."**
