prompt: |-
  So Frank Ramsey apparently argued that discounting future well-being just because it's later (as opposed to, say, risk or expected growth) is basically ethically indefensible. If that's true, why do economists still bake a positive discount rate into stuff like climate cost-benefit analysis (the whole Nordhaus vs Stern debate) insted of just setting it to zero like Ramsey said we should? Isn't using any positive rate just repeating the exact mistake he pointed out?
