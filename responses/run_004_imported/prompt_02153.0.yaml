answer: |-
  There is a critical misconception in your premise that needs to be addressed before answering the "efficiency" question: **Immunity to money-pumping does not imply Dutch-book coherence.**

  While both arguments are often invoked together in AI alignment literature to motivate Expected Utility Maximization (EUM), they constrain **orthogonal** components of an agent's decision-making architecture.

  Here is the breakdown of why the logical shortcut you are looking for does not exist, and what the actual relationship is between the two.

  ### 1. Preferences vs. Credences
  The Money Pump argument and the Dutch Book argument target different variables in the Expected Utility equation: $E[U] = \sum P(x) \cdot U(x)$.

  *   **Money Pump (vNM Coherence):** Tests the **Utility function ($U$)**. It demonstrates that if your preferences over *outcomes* are intransitive (e.g., $A \succ B \succ C \succ A$), you can be induced to trade in a cycle that leaves you with less money and the same asset.
  *   **Dutch Book (Probability Coherence):** Tests the **Probability distribution ($P$)**. It demonstrates that if your *credences* violate the axioms of probability (e.g., $P(H) + P(\neg H) > 1$), a bookie can construct a set of bets that guarantees you a loss regardless of the outcome.

  **The Counterexample:**
  Imagine an agent with perfectly transitive preferences (immune to money pumps) who loves money above all else ($U(\$) > U(\text{no } \$)$). However, this agent believes that the probability of a coin landing Heads is $0.6$ and the probability of it landing Tails is $0.6$.
  *   **Money Pump:** None. The agent always prefers more money to less. Preferences are consistent.
  *   **Dutch Book:** Yes. A bookie can sell the agent a bet on Heads for \$0.60 and a bet on Tails for \$0.60. The agent pays \$1.20 total but only receives \$1.00 regardless of the outcome. Guaranteed loss.

  Proving the agent won't trade in circles (preferences) tells you nothing about whether its internal world-model sums to 1 (beliefs).

  ### 2. Why Alignment Literature Groups Them
  You see them side-by-side because they are the two pillars of the **Coherence Theorems** (specifically Savage's Theorem and its predecessors).

  In AI alignment, the argument is usually: "Any agent that is not vulnerable to these exploits will *behave as if* it is maximizing expected utility."
  *   To behave as an EUM agent, you need **both** a coherent $U$ and a coherent $P$.
  *   Authors group them because they are the joint necessary conditions for EUM, not because one implies the other.

  ### 3. The Only Bridge: Preferences Over *Acts*
  There is one formalism where testing preferences *does* give you probabilities, but it requires a much more rigorous test than a standard money-pump argument. This is **Savage's Theorem**.

  *   **Standard Money Pump:** Tests preferences over **Outcomes** (e.g., Apple vs. Orange).
  *   **Savage's Framework:** Tests preferences over **Acts** (functions from World States to Outcomes).

  If you test an agent's preferences over a sufficiently rich set of *gambles* (e.g., "Receive Apple if it rains, Orange if it shines"), you can mathematically derive **both** a unique Utility function and a unique Probability distribution that rationalize those preferences.

  **However,** this is not "efficient." It requires querying the agent's preferences over a combinatorial explosion of state-outcome mappings. It is significantly *harder* than a standard money-pump check, not easier.

  ### 4. Answering Your Question: The "Efficient" Check
  Since preference coherence (no money pump) does not logically entail belief coherence (no Dutch book), there is no deductive shortcut. You cannot confirm credence coherence simply by verifying preference coherence.

  To efficiently confirm Dutch-book coherence in a software system, you must treat it as a separate validation layer:

  1.  **Isolate the Credence Module:** If your system explicitly outputs probabilities (e.g., a transformer's logits), do not test them via trading. Test them against the **axioms of probability** directly.
      *   Check normalization: $\sum P(x_i) = 1$.
      *   Check additivity: $P(A \cup B) = P(A) + P(B)$ for disjoint events.
      *   Check conditional consistency: $P(A|B)P(B) = P(A \cap B)$.
      *   *Efficiency:* $O(N)$ checks on the output vector. This is computationally trivial compared to running trading simulations.

  2.  **If Credences are Implicit:** If the agent has no explicit probability output and only takes actions (common in RL), you cannot Dutch Book it in the strict sense unless you can force it to accept wagers.
      *   You must construct **scoring rules** (like Brier Score or Log Loss) to test calibration.
      *   If the agent is truly EUM-coherent, its policy will implicitly respect probability axioms. If you observe it making decisions that violate the Law of Total Probability in its behavior, it is vulnerable to a Dutch Book *if* it were forced to bet.

  ### Summary for the Engineer
  *   **Premise Check:** Money-pump immunity $\neq$ Dutch-book immunity. They test different modules (Utility vs. Probability).
  *   **Logical Relation:** They are independent constraints. Satisfying one does not satisfy the other.
  *   **Efficient Verification:**
      *   For **Preferences**: Run cycle-detection on the preference graph (Money Pump).
      *   For **Credences**: Run axiom-checks on the probability vector (Normalization/Additivity).
  *   **Alignment Context:** The literature groups them because Advanced Agents require *both* to avoid being dominated by agents that have *both*.

  Do not skip the probability axiom checks. In high-stakes AI systems, incoherent credences (overconfidence) are often a more dangerous failure mode than intransitive preferences.
