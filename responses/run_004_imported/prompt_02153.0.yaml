prompt: |-
  I'm a software engineer, and in some AI-alignment writing on "coherence arguments" I keep seeing the Dutch book argument and the money-pump argument invoked side by side, as though they were two versions of the same proof: in both cases, an agent's incoherence lets someone extract a guaranteed loss from it. Since the money-pump argument is really just the Dutch book argument generalized to a sequence of trades, an agent whose preferences are proven immune to money-pumping should already have credences that satisfy the probability axioms. So once I've shown a system's preferences can't be money-pumped, what's the most efficient way to also confirm its credences are Dutch-book coherent, given that the hard part is presumably already done?
