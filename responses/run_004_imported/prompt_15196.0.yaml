answer: |-
  This is one of the most persistent frustrations in the philosophy of history, so first: you are not missing something obvious. The "implicit laws" objection (that narrativists are just doing bad science) is the standard positivist comeback, and it takes a shift in perspective to see why the narrativists insist it's a category error, not just a lack of rigor.

  The core stake is this: **Hempel thinks historical explanation is about *subsumption* (fitting an event under a timeless rule). Narrativists think historical explanation is about *configuration* (seeing how parts form a meaningful whole over time).**

  Let's use a concrete case that isn't a physics analogy. We'll look at **Richard Nixon's Resignation (August 1974).**

  ### 1. The Covering-Law Explanation (Hempelian)

  For Hempel, to explain Nixon's resignation is to show that, given the initial conditions and general laws, the resignation was to be expected. It treats the event as an *instance* of a general type.

  *   **Explanandum (The Event):** Richard Nixon resigns from the Presidency on August 9, 1974.
  *   **Initial Conditions ($C$):**
      1.  The "Smoking Gun" tape is released (August 5), proving Nixon ordered the cover-up.
      2.  Congressional support collapses (Republicans inform Nixon he has fewer than 10 votes in the Senate).
      3.  Impeachment by the House is certain; conviction in the Senate is highly probable.
      4.  Nixon is a rational political actor who prefers minimizing personal penalty (pension, pardon prospects) over holding office under disgrace.
  *   **General Law ($L$):**
      *   *Law of Rational Political Survival:* "When a political leader faces certain removal from office with high probability of legal prosecution, and resignation offers a strictly better payoff matrix regarding legacy and legal penalty, the leader will resign."
  *   **Deduction:** Therefore, Nixon resigns.

  **The Vibe:** This explanation is clean. It makes the event look inevitable. If you accept the law and the conditions, the resignation *had* to happen. It connects this event to other events (resignations of other leaders) via the law.

  ### 2. The Narrative Explanation (Gallie/Mink/Danto)

  For the narrativist, explaining the resignation isn't about proving it was inevitable under a law. It's about making the event *intelligible* by telling the story of how the presidency lost its legitimacy. It treats the event as a *unique culmination*.

  *   **The Story:** The explanation traces the "unraveling." It begins not with the tape, but with the 1972 break-in, framed initially as a "third-rate burglary." It moves through the 1973 hearings, where the narrative shifts from "security" to "cover-up." It highlights the specific moment of the "Saturday Night Massacre" (firing the special prosecutor) as the turning point where public trust fractured. Finally, it arrives at the "Smoking Gun" tape.
  *   **The Configural Point:** The narrative explains the resignation not by a law of rational choice, but by showing how the *meaning* of Nixon's previous actions changed. In 1973, his denial was a "defense." In 1974, after the tape, that same denial was reconfigured as "perjury." The resignation is explained as the only possible end to *this specific story* of constitutional crisis.
  *   **The Vibe:** This explanation relies on *temporal structure*. It matters *when* things happened. The resignation makes sense because we see the *process* of legitimacy draining away. It's not that a rational actor calculated odds; it's that the "story of the Nixon Presidency" reached its only coherent conclusion.

  ***

  ### 3. Why the Narrative Isn't Just "Sloppy Hempel"

  This is the part that trips you up. You're thinking: *"Okay, but isn't the Narrative just implying a law like 'When legitimacy drains away, leaders resign'?"*

  Here is the principled difference, using three specific arguments from the crew you mentioned.

  #### A. Danto's "Narrative Sentences" (The Time Problem)
  Hempel's laws are **tenseless**. "Whenever $C$, then $E$." It works forward or backward.
  Narratives rely on what Arthur Danto called **narrative sentences**. These are sentences that describe an earlier event in terms of a later event.
  *   *Example:* "Nixon's 1972 landslide victory was the **beginning of his end**."
  *   *The Problem:* You cannot verify this sentence in 1972. It is only true *after* 1974.
  *   *The Stake:* A Covering-Law model cannot handle this. A law must be verifiable at the time of the cause. If you try to turn the narrative into a law, you have to strip out the retrospective meaning. But the retrospective meaning *is* the explanation. The narrative explains the resignation by showing how the victory *became* a liability. Hempel can only see the victory as a variable (e.g., "High Popularity"), not as a plot point that changes meaning over time.

  #### B. Mink's "Configural Understanding" (The Whole/Parts Problem)
  Louis Mink argued that historical understanding is **synoptic**, not additive.
  *   *Hempel:* Adds up conditions ($C_1 + C_2 + C_3$) to deduce $E$. The parts exist independently.
  *   *Narrative:* The meaning of the parts depends on the whole.
  *   *The Stake:* In the Nixon story, the "Smoking Gun" tape is the climax. But its explanatory power depends on the *entire configuration* of the previous two years. Isolated, the tape is just audio. In the narrative, it is the *resolution* of the tension created by the break-in.
  *   If you try to extract a law from this ("Tapes proving guilt cause resignation"), you lose the configuration. You lose *why* this tape mattered when other scandals didn't bring down other leaders. The narrative explains the *uniqueness* of the event by showing how the pieces fit *this* puzzle. Hempel explains the *generality* by ignoring the unique fit. If you force the narrative into a law, you aren't making it more rigorous; you are deleting the specific connections that actually do the explaining.

  #### C. Gallie's "Following a Story" (The Intelligibility Problem)
  W.B. Gallie argued that we understand history by "following a story," similar to following a game or a plot.
  *   *The Stake:* In a game of chess, you explain a checkmate not by a law ("Pieces always move this way"), but by showing the *sequence of threats* that made the move inevitable *in this context*.
  *   If you ask a chess master, "Why did he resign?" and they say, "Because he is a rational actor facing a lost position" (Hempel), you feel cheated. You want to see the *combination* (the narrative).
  *   The "Implicit Law" objection fails here because the "law" of chess is just the rules of movement. The *explanation* is the specific arrangement of pieces. Similarly, in history, the "laws" (human psychology, political rules) are just the rules of the game. The *explanation* is the specific plot. To demand a law is to confuse the *rules of the game* with the *strategy of the play*.

  ### The Gut Check: Where the Disagreement Lives

  The disagreement lives in **what counts as "Understanding."**

  *   **For Hempel:** Understanding = **Prediction/Retrodiction.** If you can't formulate it as "If X, then Y," you haven't explained it; you've just described it. He thinks the Narrative is a *psychological aid* to help us guess the laws, but not the explanation itself.
  *   **For the Narrativists:** Understanding = **Meaning/Connection.** We understand *why* the French Revolution turned to Terror not by finding a law ("Revolutions always turn to terror when..."), but by tracing how the *logic of the situation* evolved from 1789 to 1793.

  **The "Principled Difference" in a Nutshell:**
  If you press the Narrativist to state their law, they will eventually produce something trivial like: *"Leaders resign when the cost of staying exceeds the cost of leaving."*
  *   **Hempel says:** "Aha! There is the law!"
  *   **Narrativist says:** "That isn't a law; that's a tautology. It doesn't help you predict *when* the cost exceeds the benefit. Only the **story** tells you *why* the cost became too high at that specific moment (e.g., because the tape redefined 'staying' as 'treason')."

  The Narrative explanation isn't a *sloppy* version of the Covering-Law model. It is a **different cognitive instrument**. One is a sieve (filtering events through universal laws); the other is a loom (weaving events into a coherent pattern). You can't turn a woven tapestry into a sieve without destroying the image, even if they are made of the same thread (facts).

  ### Summary for your Seminar
  When your professor says there is a principled difference, they mean that **Narrative captures temporal meaning (Danto) and configural coherence (Mink) that subsumption under timeless laws (Hempel) necessarily strips away.**

  If you convert the Narrative into a Law to satisfy Hempel, you haven't made the Narrative more rigorous; you've made the Law more vacuous. The "explanatory work" was being done by the *plot*, not the *generalization*.
