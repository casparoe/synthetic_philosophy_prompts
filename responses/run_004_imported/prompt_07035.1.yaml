answer: |-
  This is a sophisticated philosophical challenge that cuts to the heart of criminal law theory. To make your judge's reasoning rigorous, we must anchor it in the **Control Principle** and the **Internalism of Culpability**.

  Below is a breakdown of the philosophical architecture you need, followed by a specific rebuttal to the "harm is constitutive" objection, and finally, a draft excerpt of the judicial opinion itself.

  ### Part 1: The Philosophical Architecture

  For your judge to remain a *consistent* retributivist, she must adhere to the following logical chain. If she breaks the chain, she ceases to be a pure retributivist and becomes a hybrid (or a consequentialist in disguise).

  **1. The Control Principle**
  Moral blame (and thus legal desert) can only attach to factors within the agent's control. If $X$ is a matter of luck, $X$ cannot increase or decrease moral blameworthiness.
  *   *Application:* The defendant controlled the planning, the malice, the acquisition of the weapon, and the pull of the trigger. She did not control the internal mechanics of the firing pin (sabotaged by a third party). Therefore, the jamming is resultant luck.

  **2. The Locus of Culpability**
  Retributivism justifies punishment because the offender has willed a wrong. The "wrong" is located in the **practical reasoning** of the agent—the choice to subordinate the victim's rights to the agent's own ends.
  *   *Application:* In both the Attempt and the Completed case, the agents' practical reasoning was identical: "I will end this life to achieve my end." The moral stain on the soul (to use a metaphoric retributive metric) is identical.

  **3. The Irrelevance of Resultant Luck**
  If desert tracks the quality of the will, and the will is identical, the desert must be identical. To punish the completed murderer more severely is to punish them for the *success* of their enterprise. But success in crime is often a function of competence + luck. Since we do not reward moral luck in virtue (we don't praise a benevolent donor more because their check didn't get lost in the mail), we cannot punish moral luck in vice.

  ### Part 2: Addressing the Counter-Argument (Harm as Constitutive)

  You mentioned the specific objection: *That the harm done is constitutive of the crime, not just evidence of culpability.* This is the strongest argument against your judge. It suggests that "Murder" and "Attempted Murder" are not just different sentences for the same act, but fundamentally different *wrongs*.

  **How your judge defeats this:**
  She must argue that treating harm as constitutive of *desert* smuggles in consequentialism.

  1.  **The "State of Affairs" Trap:** If we say the completed murderer deserves more because "a person is dead," we are weighing the *badness of the world state*. That is a consequentialist calculation (minimizing harm). Retributivism weighs the *badness of the agent*.
  2.  **The Normative Violation:** The law forbids killing. But the moral prohibition is against *trying to kill*. The right to life is violated the moment the shooter pulls the trigger with intent. The death is the *consequence* of the violation, not the violation itself.
  3.  **The Concession:** Your judge should admit that current law distinguishes them. But she must frame this distinction as a **concession to public sentiment or administrative convenience**, not a requirement of justice. To treat them differently is to admit that our justice system is partially based on luck, which is an admission of imperfection, not a feature of justice.

  ### Part 3: Draft Judicial Opinion Excerpt

  Here is a draft of the opinion. It is written to sound authoritative, philosophically dense, and uncompromising.

  ***

  **SUPREME COURT OF APPEALS**
  **OPINION OF THE COURT**

  **...[Case Name Redacted] v. The State**

  **Justice [Name] delivered the opinion of the Court:**

  We are confronted today with a dissonance that strikes at the foundation of retributive justice. We have before us two defendants. Both harbored the same malice. Both engaged in the same planning. Both performed the same volitional act: pulling a trigger with the specific intent to extinguish a human life. In one case, the victim died. In the other, the victim lived, solely because a third party had sabotaged the firing mechanism—a fact unknown to the shooter.

  The State asks us to affirm a sentencing disparity between these two actors. It asks us to affirm that the defendant whose gun fired is more deserving of punishment than the defendant whose gun jammed.

  This Court has long held that punishment is justified only by desert. Desert is a function of culpability. And culpability is a function of choice. We punish men for what they choose to be, not for what fortune allows them to become.

  The distinction between attempt and completion rests entirely on what philosophers term *resultant luck*. It is the luck of the wind, the luck of the anatomy, the luck of the mechanics. To allow resultant luck to dictate the severity of punishment is to surrender the moral logic of the criminal law to chance. If two agents exert the same effort of will toward the same forbidden end, their moral guilt is identical. To punish one more severely because the universe cooperated with their malice is to treat success as an aggravating factor. But success is not a vice, and failure is not a virtue.

  The State argues that the harm caused is constitutive of the wrong. They argue that the crime of murder is not the *trying* to kill, but the *killing* itself. Therefore, they contend, the completed offender has committed a distinct and greater wrong than the attempter.

  This argument, while intuitive, collapses under retributive scrutiny. It conflates the *moral wrong* with the *physical consequence*. The moral wrong in homicide is the assertion of dominion over another's life. That assertion is complete the moment the trigger is pulled with intent. The death that follows is a physical fact, not a moral addition.

  If we punish the completed murderer more severely because "a life is lost," we are no longer measuring the offender's culpability; we are measuring the state of the world. We are weighing the social cost of the death. That is a consequentialist calculus. It may be useful for policy. It may satisfy a public desire for vengeance proportional to bloodshed. But it is not *justice* in the retributive sense. Justice demands that we look at the agent, not the aftermath.

  A consistent retributivism cannot tolerate a sentencing scheme where the length of a prison term turns on the reliability of a firing pin. To accept such a scheme is to admit that our justice system punishes luck. We are not prepared to make that admission.

  Therefore, while we acknowledge that positive law traditionally distinguishes between attempt and completion, we hold that where the disparity in outcome is solely the product of resultant luck, the desert remains identical. The sentence for attempted murder, in cases where the failure is extrinsic to the agent's will, must align with the sentence for completed murder. To do otherwise is to punish the defendant for the sins of fortune, and that is a burden justice cannot bear.

  ***

  ### Key Nuances for Your Novel

  1.  **The "Concession" Point:** Notice the paragraph where she says, *"It may satisfy a public desire for vengeance... But it is not justice."* This allows your judge to acknowledge that the real world *does* punish them differently, while maintaining her philosophical purity. She is essentially saying, "The law usually does X, but justice requires Y."
  2.  **The Sabotage Factor:** The fact that the gun was sabotaged by a *third party* is crucial. If the gun jammed because the defendant didn't clean it, a critic could argue she was negligent in her attempt. By making it sabotage, you isolate the "luck" entirely outside her agency, strengthening the Control Principle argument.
  3.  **The Tension:** This opinion will likely be controversial within the world of your book. Other judges (perhaps consequentialists or legal pragmatists) might write a fiery dissent arguing that "dead bodies matter." This creates natural conflict for your plot without undermining your judge's internal logic.

  ### Suggested Reading for Further Nuance
  If you want to deepen the well before writing the final draft, look at:
  *   **Michael Moore, *Placing Blame*:** Moore is a modern retributivist who actually argues *against* your judge (he thinks harm matters). Reading his arguments will help you sharpen her rebuttals.
  *   **Andrew Ashworth, "Criminal Attempts and the Role of Resulting Harm":** Ashworth argues exactly what your judge is arguing (that the distinction is unjust).
  *   **Gideon Yaffe, *Attempts*:** A deep dive on the philosophy of action regarding attempts.

  This framework should give your character a voice that sounds legally grounded but philosophically formidable.
