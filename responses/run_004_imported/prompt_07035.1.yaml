prompt: |-
  I'm midway through a legal thriller whose plot turns on two cases reaching the same appellate court in the same term. In the first, a woman is convicted of attempted murder after the rifle she'd carefully sighted on her husband jams at the trigger — sabotage by a third party she never learns about — while every other fact of the case (premeditation, motive, the steps she took to ensure success) is identical to what it would have been had the gun fired. In the second, an unrelated defendant is convicted of completed murder under materially the same circumstances of planning and malice. My presiding judge character has spent the novel building a reputation as an unapologetic retributivist, someone who insists that punishment is justified by desert and by desert alone, and she now has to write the opinion explaining why the two defendants before her received such different sentences. I want her reasoning to be properly rigorous rather than something I hand-wave for the plot's convenience, so I'd like help thinking the philosophy through before I put words in her mouth.

  Specifically, I'd like you to argue that a consistent retributivist — one who holds that deserved punishment tracks the quality of the agent's will and choice rather than the harm that happens to follow from it — is thereby committed to punishing the failed attempt exactly as severely as the completed killing, and must treat any gap between the two sentences as a concession to luck rather than to justice. I've read enough of the moral-luck literature descending from Nagel and Williams to know the objection in outline, especially what Nagel calls resultant luck — luck in how things turn out — but most treatments I've come across stop at toy cases (the reckless driver who does or doesn't hit a pedestrian) rather than engaging with how a retributivist might actually resist the conclusion inside a real sentencing scheme: for instance, by insisting that the harm actually done is itself partly constitutive of what the agent deserves, not merely evidence of her culpability, or that the completed act individuates the crime in a way the failed one cannot. I'd like the argument to take that rejoinder seriously and show exactly where it fails, or where it only succeeds by quietly importing consequentialist considerations the retributivist was supposed to have foresworn, rather than just asserting that retributivism "has a problem with luck" and leaving it there.
reasoning: |-
  Here's a thinking process that leads to the suggested argument:

  1.  **Analyze the Request:**
      *   **Context:** A legal thriller novel.
      *   **Plot Point:** Two cases before the same appellate court. Case A: Attempted murder (gun jammed due to sabotage). Case B: Completed murder (same intent/planning).
      *   **Character:** A presiding judge known as an *unapologetic retributivist* (punishment justified by desert alone, not consequences).
      *   **Task:** Construct a rigorous philosophical argument for the judge's opinion.
      *   **Specific Goal:** Argue that a *consistent* retributivist *must* punish the attempt as severely as the completed crime.
      *   **Constraint:** Do not hand-wave. Engage with the "moral luck" literature (Nagel, Williams). Address counter-arguments (harm as constitutive of desert, individuation of crime) and show why they fail or smuggle in consequentialism.
      *   **Tone:** Legal/Philosophical rigor, suitable for a judicial opinion (or the reasoning behind it).

  2.  **Deconstruct the Philosophical Position:**
      *   **Retributivism Core:** Punishment is justified because the offender *deserves* it. Desert is based on *culpability* (blameworthiness).
      *   **Culpability Basis:** Culpability resides in the *choice*, the *intent*, and the *will* of the agent. It is internal to the agent.
      *   **Resultant Luck:** Outcomes often depend on factors outside the agent's control (e.g., a gun jamming, a victim moving).
      *   **The Conflict:** If desert is based on control/choice, and outcomes are often luck, then sentencing based on outcomes (attempt vs. completion) violates the control principle.
      *   **The Counter-Argument (to be refuted):** Harm matters. The law punishes harms, not just thoughts. A dead body is a worse state of affairs than a living one. The crime is defined by the result.
      *   **The Rebuttal:** If harm matters for *desert*, is that retributivism or consequentialism? If the agent did everything possible to cause harm, their moral guilt is identical. Differentiating based on the jam is punishing for luck.

  3.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Define the retributive principle clearly. Punishment must be proportional to moral blameworthiness.
      *   **The Control Principle:** Establish that agents are only blameworthy for what is within their control. (Kantian influence).
      *   **The Nature of the Act:** Distinguish between the *volitional act* (pulling the trigger with intent to kill) and the *consequence* (death).
      *   **Addressing "Harm as Constitutive":** This is the tricky part. Some argue the crime *is* the killing, not the trying.
          *   *Counter:* If I do everything right to kill, and a miracle stops me, my *will* was identical. If desert tracks the will, the desert is identical.
          *   *Smuggling Consequentialism:* If we say "death is worse so punishment must be higher," are we punishing the *bad state of the world* (consequentialist) or the *badness of the agent* (retributivist)? A strict retributivist cares about the agent's moral standing.
      *   **The Role of Luck:** Explicitly name "Resultant Luck." Show that distinguishing sentences admits luck into justice. Justice should be blind to luck.
      *   **Legal Implications:** How does this look in a judicial opinion? It needs to sound authoritative but philosophically dense.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Isn't there a difference in *wrongdoing*? Killing violates a right to life; attempting violates a right to security?
      *   *Rebuttal:* In the specific scenario (gun jammed due to sabotage), the defendant *believed* she was violating the right to life. Her subjective engagement with the norm was total. The objective failure was external.
      *   *Critique:* Most legal systems *do* punish attempts less.
      *   *Rebuttal:* The prompt asks for a *consistent retributivist* argument, even if it contradicts current positive law. The character is establishing a philosophical point, perhaps a dissenting or groundbreaking opinion.
      *   *Key Distinction:* Distinguish between *culpability* (internal) and *harm* (external). Retributivism is about culpability. Deterrence/Incapacitation (consequentialism) might care about harm, but not pure desert.

  5.  **Structuring the Output:**
      *   **Philosophical Preamble:** Set the stage for the user (the author) to understand the logic.
      *   **The Core Argument (The "Judicial Reasoning"):** Break it down into logical steps (Premise 1: Control, Premise 2: Will, Premise 3: Luck).
      *   **Addressing Counter-Arguments:** Specifically tackle the "Harm is Constitutive" and "Individuation" objections mentioned in the prompt.
      *   **Drafting the Opinion Excerpt:** Provide actual text the author can adapt. This needs to sound like a judge writing.

  6.  **Developing the "Harm is Constitutive" Rebuttal:**
      *   Many legal theorists argue that the *wrong* in murder is the deprivation of life. Without death, it's not murder.
      *   *Retributive Counter:* The *moral wrong* is the intent to deprive. The *legal category* might differ, but the *punishment* (sanction) tracks moral gravity. If the moral gravity is identical, the sanction should be too.
      *   *The Consequentialist Leak:* If we punish the completed murder more because "a life is lost," we are weighing social utility/harm. If we punish based on "how evil the person is," they are equally evil. To punish the completed murderer more is to say "You are worse because you were successful," which implies success is a moral virtue (or failure a vice), which is absurd in crime.

  7.  **Final Polish:**
      *   Ensure the tone is serious and academic.
      *   Check that the specific scenario (sabotaged gun) is highlighted—it removes *agent* error, isolating pure luck.
      *   Make sure the distinction between *retributivism* and *consequentialism* is sharp.

  8.  *(Self-Correction during drafting)*: I need to make sure I don't just say "Nagel is right." I need to show *why* the retributivist is committed to this. The commitment comes from the definition of desert. If desert = f(culpability) and culpability = f(choice), and choice is identical, then desert is identical. Any other variable (outcome) is non-culpable.

  9.  **Finalizing the Output Structure:**
      *   **Part 1: The Philosophical Architecture.** (For the author's understanding).
      *   **Part 2: The Counter-Argument & Rebuttal.** (Addressing the "harm is constitutive" point).
      *   **Part 3: Sample Judicial Opinion.** (For the book).

