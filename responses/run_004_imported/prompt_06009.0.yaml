answer: |-
  Good evening. For those of you who don't know me, I'm [Name]. I am Marguerite's niece, and like about half the people in this room, I am also one of her former students. The other half of you are family and old friends who know her as the woman who recommends the perfect wine, the perfect coat, the perfect vacation spot.

  Standing here, I realize I am in a bit of a bind. If I tell you that my aunt is a brilliant critic, the critics in the room will nod, but the family will wonder why I'm being so formal. If I tell the family she has marvelous taste, the critics will smirk, knowing that "taste" is a vague metric for a life's work. And if I tell *anyone* in this room that Marguerite is a "good" person, or that this is a "good" party, she will likely cough loudly from the head table until I correct my vocabulary.

  Because we all know the rule. It is the running joke of her workshops and the quiet legend of the newsroom. Over forty-one years as chief book critic, Marguerite filed thousands of columns. She wrote hundreds of thousands of words. She championed geniuses and dismantled pretenders. And according to a count I ran through her digital archive last week, she used the word "good" exactly zero times.

  To her colleagues, this is a philosophical stance. Marguerite has always argued that a critic's verdict cannot do the reader's work for them. To call a book "good" is to close the cover. It is aesthetic shorthand that lets you off the hook. Marguerite never let anyone off the hook. She believed that if she did her job correctly, she wouldn't need to give you a verdict; she would give you an experience so precise that you would have no choice but to go read the page yourself and see.

  To her students, this was initially terrifying. I remember sitting in her office, clutching a draft of a story I thought was solid. I wanted a gold star. I wanted to be told I was "good." Instead, she handed it back covered in notes that asked questions I didn't know how to answer. She didn't tell me what to fix; she showed me where my own attention had wandered. It was frustrating then. But now, as a writer myself, I realize she wasn't withholding praise. She was withholding the easy answer so that I could find the difficult truth. She was teaching us that "good" is a place where thinking stops. And she never wanted us to stop thinking.

  Now, to the relatives and friends in the room: I know you sometimes see this trait as mere stubbornness. You see her hesitate before recommending a restaurant, or watch her read a menu with the intensity of a legal contract. You might think she's just hard to please. But I'm here to suggest that her exacting nature isn't about rejection. It's about respect.

  She respects the author enough to read them closely. She respects the reader enough not to lie to them. And she respects her own judgment enough not to dilute it with cheap currency. When Marguerite loves something, she doesn't say it's "good." She describes the exact shade of blue in a character's eyes. She quotes the sentence that broke her heart. She gives you the evidence, and she trusts *you* to draw the conclusion.

  So, I find myself in a delicate position. I want to honor her tonight. But if I simply ask you to take my word that she deserves this celebration, I would be violating the very principle she has lived by for four decades. I cannot tell you she is wonderful and expect you to accept it on my authority. That would be lazy criticism.

  Instead, I invite you to look at the evidence. Look at the careers she launched. Look at the students who learned to write because she refused to tell them they were already there. Look at the forty-one years of columns sitting in libraries, waiting for you to read them and decide for yourself if they hold up. She has done the work of acquaintance with the page. Now, she is asking you to do the same with her career.

  I suspect you will find, as I have, that the verdict is not a single word. It is a library. It is a legacy. It is a standard of attention that made everyone around her sharper, clearer, and more alive to the world.

  So, if everyone could please raise a glass.

  To Marguerite. May your retirement be precise. May your reading pile be high. And may you never, ever have to write another word count unless you choose to.

  Cheers.
