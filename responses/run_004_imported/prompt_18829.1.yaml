answer: |-
  This is a profound connection to draw, and you have hit on one of the most fascinating structural parallels in early modern philosophy. While Hobbes is typically cast as the arch-rationalist mechanist and Vico as the proto-Romantic historicist, their epistemological foundations rest on nearly identical bedrock: the principle that **certainty is a function of authorship.**

  However, as you suspected, the divergence lies in what they think "authorship" entails and where they believe it leads. Here is a comparison of their reasoning, their points of departure, and an evaluation of whose framework holds up better under scrutiny.

  ### 1. The Core Agreement: The Epistemic Privilege of the Maker
  Both Hobbes and Vico reject the idea that truth is merely a correspondence between the mind and an external, pre-existing reality (the spectator theory of truth). Instead, they argue for a **constructivist theory of truth.**

  *   **The Geometric Paradigm:** Both agree that geometry is the gold standard of certainty. Why? Because a circle does not exist in nature waiting to be discovered; it is generated by a definition and a construction (a point moving around a center). Because the human mind stipulates the cause (the definition) and generates the effect (the figure), there is no gap between the knower and the known.
  *   **The Civil Parallel:** Both extend this to the human world.
      *   **Hobbes:** In *De Corpore* and *Leviathan*, he argues that civil philosophy is demonstrable because the Commonwealth is an artificial man. We create it through covenant. Since we know the "matter" (human passions) and we designed the "structure" (the social contract), we can have scientific knowledge of it.
      *   **Vico:** In *The New Science*, Vico argues that because nations, laws, and languages are human creations, we can know their essence in a way we can never know the essence of a storm or a star.
  *   **The Natural Limit:** Both agree that natural philosophy (physics) lacks this absolute certainty.
      *   **Hobbes:** We cannot demonstrate the necessary causes of natural effects because we did not generate them; we can only propose possible causes that fit the phenomena.
      *   **Vico:** Nature is God's creation (*verum* belongs to God regarding nature); therefore, humans can only observe the external effects of nature, not grasp the internal necessity.

  **The Convergence:** For both, **to know is to know the cause, and the highest form of causal knowledge is knowing the thing because you made it.**

  ### 2. The Divergence: Where the Paths Split

  Despite this shared axiom, the trajectory of their philosophies moves in opposite directions.

  #### A. What it Means to "Make" (Engineering vs. Emergence)
  This is the most critical distinction.
  *   **Hobbes (Synthetic/Engineering):** For Hobbes, "making" is a deliberate, rational, top-down act of construction. We make a circle by defining it; we make a Commonwealth by signing a contract. It is an act of **will and reason.** This is why Hobbes believes we can *redo* politics. If the Commonwealth is broken, we can reason our way back to first principles and reconstruct it. His "making" is atomic and instantaneous (the moment of the covenant).
  *   **Vico (Generative/Historical):** For Vico, "making" (*factum*) is often unconscious, collective, and temporal. Humans did not sit down and design language or law through a rational contract; these things *grew* out of human needs, customs, and providential guidance over centuries. His "making" is organic and evolutionary. Consequently, we cannot "reconstruct" society geometrically; we must use **philology** to excavate the layers of meaning we buried in our own history.

  #### B. The Role of God and Nature
  *   **Vico (Theological Boundary):** Vico's restriction on natural science is explicitly theological. God made nature; therefore, *scientia* (demonstrative knowledge) of nature belongs only to God. Humans have *coscienza* (consciousness/observation) of nature, but not *scientia*. This limitation is positive for Vico: it clears the ground for history to become the "New Science."
  *   **Hobbes (Epistemological Boundary):** Hobbes's restriction is more epistemological than theological. He argues we cannot know natural causes because we cannot resolve natural bodies into their universal principles through reasoning. While he acknowledges God as the First Cause, his primary worry is that in natural philosophy, we reason from effects back to causes (which is fallible), whereas in geometry/politics, we reason from causes to effects (which is infallible). For Hobbes, the limit isn't just that God made nature, but that nature's machinery is hidden from our resolution.

  #### C. Scope and Hierarchy of Knowledge
  *   **Hobbes:** Geometry is the **Master Science.** He wants to make civil philosophy *as certain as* geometry. He tries to force politics into a geometric mold (definitions, axioms, deductions). He views the "human made" world as superior because it is intelligible, but he wishes the *method* of geometry could apply everywhere.
  *   **Vico:** Geometry is a **Mental Construct.** Vico actually critiques the Cartesian/Hobbesian attempt to apply mathematical method to human affairs. He argues that because the human world is "made," it requires a different kind of knowledge (wisdom/hermeneutics) than the abstract certainty of math. For Vico, History is the **Master Science**, superior to geometry because it deals with the full reality of human existence, not just abstract figures.

  ### 3. Evaluation: Coherence and Defensibility

  When pushed to their limits, **Vico's version of the argument is more coherent and defensible,** though Hobbes's is more internally rigorous.

  **The Failure of Hobbes's Limit:**
  Hobbes's embarrassment with squaring the circle is actually symptomatic of the weakness in his political philosophy. He believed that because he could *define* the terms of the Commonwealth, he could *guarantee* the outcome. He treated human beings like geometric points—uniform and predictable.
  *   **The Flaw:** Humans are not circles. We do not always act according to the rational definitions we set for ourselves in a covenant. Hobbes conflates "making a contract" with "controlling human nature." His claim that civil philosophy is demonstrable fails because the "materials" (human passions) are not as stable as the "materials" of geometry (definitions). The Wallis controversy shows Hobbes's dogmatic commitment to the idea that **logical construction equals physical truth**, even when reality disagrees.

  **The Strength of Vico's Limit:**
  Vico anticipates the modern distinction between the *natural sciences* (explaining causes) and the *human sciences* (understanding meaning).
  *   **The Insight:** Vico recognizes that while we "made" history, we did not design it rationally. Therefore, our knowledge of it cannot be geometric/deductive; it must be interpretive. This saves him from Hobbes's error. Vico admits that our knowledge of history is certain because we made it, but he acknowledges that this knowledge comes through studying the *symptoms* of that making (myths, laws, language), not through deducing them from axioms.
  *   **The Defensibility:** Vico's *verum-factum* principle aligns better with modern sociology, anthropology, and hermeneutics. We accept that we can have deep, "insider" knowledge of social institutions that an alien observer could not, precisely because we participate in their construction. However, Vico risks a different problem: if truth is only what we make, does truth become relative to the historical epoch? (Vico answers this with "Providence," which is less defensible philosophically).

  ### Conclusion

  Hobbes and Vico both identify the **Maker's Knowledge** criterion as the source of certainty. But Hobbes uses it to try to turn politics into a branch of mathematics, leading to a rigid, often brittle system that crumbles when humans refuse to behave like geometric figures. Vico uses it to liberate history from mathematics, arguing that the human world is knowable *precisely because* it is messy, historical, and made by us.

  Hobbes is more coherent if you accept his materialist premises, but Vico is more defensible because his account of "making" respects the complexity of human agency. Hobbes thought we could square the circle of politics through reason; Vico realized that the circle was never a circle to begin with, but a spiral of history that we trace through our own footprints. In the end, Vico's insight that **we can only truly know what we have made, but we do not always know what we are making while we make it,** is the more profound and enduring truth.
