answer: |-
  Here are 10 questions tailored to your background and the specific constraints you outlined. They are ordered to build pressure, starting with the biological premises, moving through the standard philosophical rebuttals, and ending with the meta-philosophical challenges.

  I've included a brief "Strategic Intent" note for each, so you know exactly what trap you're setting.

  ### 1. The Biological Coherence of "Tracking"
  "Street frames the dilemma using the metaphor of moral attitudes 'tracking' independent truths. As a biologist, I'm wary of teleological language. Natural selection selects for *solutions to reproductive problems*, not for representations that 'match' reality (e.g., prey camouflage hides truth rather than tracking it). If evolution doesn't care about 'accuracy' but rather 'utility,' isn't the very distinction between 'fitness-tracking' and 'truth-tracking' a category error when applied to normative faculties?"
  *   **Strategic Intent:** Challenges the foundational metaphor of the dilemma. If "truth-tracking" isn't a coherent biological category, the "coincidence" charge loses its force.

  ### 2. The Third-Factor Reply (Enoch/Wielenberg)
  "Realists like Enoch argue for a 'third factor'—for example, that survival is good. Evolution selects for survival, and moral truth values survival, so the correlation isn't coincidental. You've argued this begs the question. But if we treat 'survival' not as a moral premise but as a *constitutive aim* of agency (you can't be an agent if you're dead), doesn't that bridge the gap without presupposing the specific moral truths we're trying to justify?"
  *   **Strategic Intent:** Pushes past her standard "circularity" objection by framing the third factor as a precondition of agency rather than a moral claim.

  ### 3. The Self-Defeat Challenge (Logic & Science)
  "You argue that if evolution shaped our moral beliefs for fitness, we can't trust them as true. But evolution shaped the cognitive faculties we use to understand evolution and logic for the same fitness reasons. Why does the Darwinian Dilemma debunk moral realism but not scientific realism? What is the relevant difference between a 'practical' cognitive faculty and a 'theoretical' one if they rely on the same neural hardware?"
  *   **Strategic Intent:** Forces her to defend the modularity of reason. If she says theoretical reason is different, she needs a biological mechanism for that distinction.

  ### 4. Adaptive-Link vs. Abstract Judgments
  "Intuitively, it seems easier to debunk a specific utilitarian calculation than the belief that 'suffering is bad' or 'protecting kin is good.' Do you grant that 'adaptive-link' judgments (like kin protection) are epistemically more secure than abstract impartial ones? If so, doesn't that concede that evolution *can* sometimes align with truth, which weakens the global skeptical threat?"
  *   **Strategic Intent:** Tests the scope of her skepticism. If she admits some moral beliefs survive the debunking, the "coincidence" argument is no longer a blanket threat.

  ### 5. Convergent Evolution Analogy
  "In my work with cichlids, we see convergent evolution: distinct lineages independently evolve similar traits because there's only one optimal solution to a physical problem (like jaw mechanics). Could moral realism argue similarly? That despite different evolutionary starting points, rational agents would converge on the same moral truths because they are the only 'optimal solutions' for social cooperation? Does your dilemma rule out moral convergence?"
  *   **Strategic Intent:** Uses your expertise to offer a biological analogy for moral realism. If convergence is possible in biology, why not in ethics?

  ### 6. Context-Dependence vs. Categorical Norms
  "Fitness is inherently context-dependent; a trait adaptive in one niche is maladaptive in another. But moral truths are usually claimed to be categorical. If our moral intuitions are products of selection, they should be as fluid and context-dependent as phenotypic traits. Do you think the 'categorical' feel of moral obligations is itself an adaptive illusion?"
  *   **Strategic Intent:** Highlights the mismatch between the nature of evolution (contingent/contextual) and the nature of moral claims (categorical/universal).

  ### 7. The Constructivist Dodge
  "You've indicated you avoid this skepticism by being a constructivist: moral facts are constituted by our valuing, not independent of it. So the Darwinian Dilemma only threatens stance-independent realism. But if our 'valuing' is itself shaped by blind evolutionary forces, aren't the constructed moral facts still ultimately grounded in fitness rather than reason? How does stance-dependence insulate you from the contingency of evolution?"
  *   **Strategic Intent:** Prevents her from hiding behind constructivism. If the *constructor* is evolved for fitness, the *construction* inherits that bias.

  ### 8. Follow-up: The Contingency of the Stance
  "Let me press that further. If human evolution had taken a different path—say, we were eusocial like bees—our 'constructed' moral facts would be radically different. If the moral facts depend on our stance, and our stance is a biological accident, doesn't constructivism just relocate the coincidence problem rather than solving it? Why should we care about facts constructed by a primate brain selected for the Pleistocene?"
  *   **Strategic Intent:** Makes the constructivist move harder to lean on by highlighting that "stance-dependence" doesn't solve the problem of *contingency*.

  ### 9. Reflective Equilibrium as a Filter
  "Realists argue we can use 'reflective equilibrium' to filter out evolved biases, much like we use the scientific method to filter out perceptual errors. Do you deny that we have the capacity to critically distance ourselves from our evolved intuitions? If we can correct for optical illusions, why can't we correct for 'evolutionary illusions' in the moral domain?"
  *   **Strategic Intent:** Challenges the idea that we are slaves to our evolutionary input. It asks for a limit on our ability to self-correct.

  ### 10. Falsification Conditions
  "Finally, a question on method. Debunking arguments are powerful, but they risk being unfalsifiable. What would count as evidence *against* the Darwinian Dilemma? Is there any possible discovery in evolutionary psychology or neuroscience that would lead you to conclude that our moral faculties *are* truth-tracking, or is the argument insulated from empirical revision?"
  *   **Strategic Intent:** The closing shot. It asks her to define the boundaries of her own argument. If nothing could count against it, it risks being dogma rather than theory.
