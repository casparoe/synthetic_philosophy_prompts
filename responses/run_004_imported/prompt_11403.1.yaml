prompt: |-
  So, I'm a retired evolutionary biologist (forty years of cichlid fish speciation) who's gotten hooked on metaethics since retiring. I'm prepping questions for a live Q&A at our local philosophy circle with a guest who defends a Street-style Darwinian Dilemma against moral realism: natural selection shaped our moral attitudes for fitness, not truth-tracking, so (if I've got this right) its a huge coincidence if they happen to line up with mind-independent moral facts. Can you draft me 8-10 questions that push past her just restating that setup? I want one on the third-factor replies (the Enoch/Wielenberg move, where some natural fact is supposed to explain both why a belief is adaptive and why it's true, so the coincidence dissolves), one on whether the same argument debunks our trust in logic or evolutionary theory itself, since that trust runs through evolved brains too, and one on why basic "adaptive-link" judgments like kin-protection are supposedly harder to debunk than abstract impartial ones like utilitarian equal consideration. Her likely dodge will be "I'm a constructivist, not a nihilist, so this only threatens stance-independent facts" -- give me a follow-up that makes that harder to lean on, plus a final question on what would actually count as evidence against the whole debunking strategy.
