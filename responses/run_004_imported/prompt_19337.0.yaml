  *(Another point)*: The user asks about "explanatory autonomy." In physics, the macro theory (thermodynamics) is autonomous *in practice* but reducible *in principle* (via RG). In philosophy, Fodor argues for autonomy *in principle* (special science laws are sui generis). This is a key distinction.

