answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Two coffee cups sit on the table between them. Alex is a metaphysician inclined toward reductionism; Jordan specializes in philosophy of mind and defends non-reductive physicalism.*

  **Alex:** I've been thinking about your talk on the software/hardware analogy. It's intuitive, I'll give you that. We accept that a Python script can run on silicon, or vacuum tubes, or maybe even a system of water buckets. The function is distinct from the substrate. But you know where I get stuck. Jaegwon Kim's ghost is haunting this room.

  **Jordan:** Kim is always haunting the room. But his exclusion argument relies on a picture of causation that I think we can revise.

  **Alex:** Let's walk through the standard case. I decide to raise my arm. Let's call that mental property $M$. My motor cortex fires in a specific configuration, $P$. My arm goes up, $E$. Now, we agree on causal closure: $P$ is physically sufficient for $E$. The neurons fire, muscles contract, physics does its job.

  **Jordan:** Agreed.

  **Alex:** So, if $M$ is genuinely distinct from $P$—if it's not just another name for $P$—then we have two potential causes for $E$. $P$ causes $E$. Does $M$ also cause $E$? If yes, we have systematic overdetermination. Every time I raise my arm, it's caused twice. Once by the neurons, once by the "decision." That looks implausible. It's not like two assassins shooting a victim simultaneously.

  **Jordan:** I agree that systematic overdetermination is a bug, not a feature. But Kim assumes that for $M$ to cause $E$, it must compete with $P$. That's the mistake. $M$ doesn't compete with $P$. $M$'s causal powers are a *subset* of $P$'s causal powers.

  **Alex:** The Subset Strategy. Shoemaker's view. Walk me through how that applies to the arm.

  **Jordan:** Think of properties as individuated by their causal powers. Physical property $P$ has a vast array of powers: it causes muscles to contract, it generates heat, it emits low-level radiation, it triggers synaptic fatigue, and so on. Let's say the set of $P$'s powers is $\{a, b, c, d\}$.

  **Alex:** Okay.

  **Jordan:** The mental property $M$—the decision to raise the arm—is defined by a specific functional profile. It causes the arm to rise, it leads to subsequent beliefs about having raised the arm, perhaps it triggers verbal reports. Let's say those powers are $\{a, b\}$. Notice that $\{a, b\}$ is a subset of $\{a, b, c, d\}$.

  **Alex:** I follow the set theory.

  **Jordan:** So, when $P$ realizes $M$, $P$ brings about $E$ in virtue of powers $\{a, b\}$. But $M$ *just is* the property of having powers $\{a, b\}$. So $M$ brings about $E$ in virtue of the very same powers. There isn't a second causal transaction. There is one transaction, described at two levels. $P$ doesn't *preempt* $M$, because $M$'s contribution is contained within $P$'s contribution.

  **Alex:** Here is where I think you're smuggling in reductionism under the guise of subset inclusion. If $M$ is individuated *solely* by its causal powers, and those powers are a subset of physical powers, then $M$ is ontologically dependent on the physical in a way that collapses the distinction.

  **Jordan:** How so?

  **Alex:** You say $M$ has powers $\{a, b\}$. But where do those powers live? They live in the physical realizer. If I strip away the physical realizer, the powers vanish. So, when you say $M$ causes $E$, you're really saying "The subset of $P$'s powers that we label $M$ causes $E$." But that's just $P$ causing $E$ under a description. You haven't secured a *distinct* causal role for the mental. You've just carved out a slice of the physical cause and given it a mental name.

  **Jordan:** But the carving matters! That's the whole point of non-reductive physicalism. $M$ is multiply realizable. A silicon chip or an alien neural net could also have powers $\{a, b\}$ without having powers $\{c, d\}$ (the specific heat emission or synaptic fatigue of *my* brain).

  **Alex:** Right, but in *this* instance, in *my* brain, $M$ is realized by $P$. In this specific causal transaction, what work is $M$ doing that $P$ isn't already doing? If the answer is "nothing extra," then $M$ is causally inert unless it is identical to $P$. If the answer is "something extra," you're back to overdetermination.

  **Jordan:** The work $M$ does is explanatory generalization. But it's not just explanatory; it's metaphysical. $M$ confers a specific causal profile. Look, if I take a knife and cut a cake, the knife's sharpness causes the cut. The knife's being made of steel also causes the cut. But the sharpness is a subset of the steel-knife's properties. Does the steel preempt the sharpness?

  **Alex:** Bad analogy. Sharpness is a physical property of the steel. In your view, $M$ is supposed to be distinct from $P$. If $M$ is just "the causal powers $\{a, b\}$," and $P$ is "the causal powers $\{a, b, c, d\}$," then $M$ is a logical construction out of physical powers. You're defining mental properties as disjunctions of physical causal profiles. That's a form of reduction. You've reduced $M$ to "whatever physical property has powers $\{a, b\}$."

  **Jordan:** I haven't reduced $M$ to a *specific* physical property. I've reduced it to a *functional role*.

  **Alex:** And if that functional role is exhaustively defined by physical causal powers, then you're a functional reducer. The "Subset Strategy" sounds like a clever way to avoid the word "identity," but if the causal powers of $M$ are nothing over and above a subset of the causal powers of $P$, then $M$ is ontologically nothing over and above $P$. You've secured mental causation only by conceding that the mental is just a shadow of the physical.

  **Jordan:** That's where we disagree. I'm not saying $M$ is a shadow. I'm saying $M$ captures a real pattern of causal potential that exists across different physical substrates. When I decide to raise my arm, I am instantiating a causal power that is *mine* as an agent, not just as a collection of neurons. The subset view allows me to say that $M$ is genuinely causal because it contributes its powers to the realizer.

  **Alex:** "Contributes its powers to the realizer." Listen to yourself. Properties don't contribute powers to their realizers. Realizers *have* powers. If $M$ contributes powers, it must have an ontological status independent of $P$. But you just said its powers are a subset of $P$'s. So does $M$ exist before $P$ instantiates it?

  **Jordan:** No, it's instantiated by $P$.

  **Alex:** Then $P$ is the sole bearer of the powers. If $P$ is the sole bearer, and $P$ is sufficient for $E$, then $P$ is the sole cause. You can say "$M$ caused $E$" as a shorthand for "The subset of $P$'s powers relevant to psychology caused $E$." But that's a pragmatic claim about language, not a metaphysical claim about distinct properties. You've saved the *truth* of mental causation statements, but you've lost the *distinctness* of mental properties.

  **Jordan:** I think you're assuming that "distinctness" requires "separateness." Like two billiard balls hitting a third. But properties aren't billiard balls. If $M$ is a higher-order property, its causal efficacy is inherited from the lower-order property, but it's not *eliminated* by that inheritance.

  **Alex:** Inheritance sounds like dependence. If $M$'s causal efficacy is wholly inherited from $P$, then $M$ is an epiphenomenon with a borrowed resume. It looks like it's working, but the check is drawn on $P$'s account. Kim's point is that if the check clears, it's because of $P$'s funds. Why do we need to say $M$ wrote the check?

  **Jordan:** Because $M$ determines *which* of $P$'s funds are spent! $P$ has powers $\{a, b, c, d\}$. But in this context, it's the instantiation of $M$ that ensures powers $\{a, b\}$ are the ones relevant to the outcome. Without $M$, $P$ might just be a lump of tissue firing randomly. $M$ structures the causal potential.

  **Alex:** But $M$ doesn't structure $P$ from the outside. $M$ supervenes on $P$. $P$ determines $M$. So $P$ determines which powers are active. You're trying to have $M$ do the structuring, but $M$ is just a reflection of how $P$ is structured.

  **Jordan:** It's not a reflection; it's an abstraction that tracks real causal invariance. If I swap your neurons for silicon that preserves $\{a, b\}$ but changes $\{c, d\}$, the arm still raises. The causal invariance lies in $M$, not in the specific $P$. That invariance is what makes $M$ causally significant. It picks out the stable feature of the world that produces the effect, regardless of the physical noise underneath.

  **Alex:** I grant that $M$ picks out a stable feature. I deny that the *feature itself* is a distinct causal agent. It's a map. The map helps us navigate, but the map doesn't move the terrain. You want to say the map moves the terrain because the lines on the map correspond to roads in the terrain. But the roads do the work.

  **Jordan:** And I say that if the lines on the map correspond perfectly to the causal powers that actually produce the effect, then the distinction between "map" and "terrain" is misleading. The mental property *is* a causal feature of the world, just a highly abstract one. The Subset Strategy secures its reality by showing it doesn't add energy or matter to the system; it adds a causal profile that is real, even if included in the physical base.

  **Alex:** But "included in" is the killer. If $A$ is included in $B$, and $B$ does the work, saying $A$ did the work is only true if $A$ is identical to the relevant part of $B$. And if $A$ is identical to a part of $B$, then $A$ isn't irreducibly mental. It's just a complex physical property. You've won the battle for mental causation, Jordan, but you've lost the war for non-reductive physicalism. You're a reductionist who prefers softer language.

  **Jordan:** And I think you're a reductionist who assumes that "real" means "fundamental." I'm willing to say mental properties are real, causal, and distinct, even if their powers are subsets of physical powers. You call that reduction; I call it realization.

  **Alex:** Then I suppose we agree on the physics, and the causation, and the lack of overdetermination.

  **Jordan:** We do.

  **Alex:** We just disagree on whether your "subset" is a genuine ontological category, or just a way of talking about parts of the physical base.

  **Jordan:** Precisely. And until we agree on what a "property" actually *is*, I don't think we'll resolve that.

  **Alex:** *Sips cold coffee.* Well. At least we agree the arm goes up.

  **Jordan:** *Smiles.* Causal closure is good for something.
