answer: |-
  The silence in the house was not empty; it was crowded. That was the problem with knowing David Lewis was right.

  Elias sat at the kitchen table, the cold ceramic of his coffee mug grounding him in *this* world. Across from him sat an empty chair. In this world, Claire had died there eighteen months ago, an aneurysm sudden and silent as a snapped thread. But Elias knew, with the cold certainty of a mathematician, that in the vast plurality of concrete realities, there was a world where she was sitting in that chair right now. There was a world where she was laughing. There was also a world where she had died screaming, where the aneurysm had come while she was driving, where she had suffered for days in a hospital bed while he held her hand.

  All of them were equally real. All of them were equally concrete. The only difference was that Elias was spatiotemporally located *here*.

  "Actual" was just a word like "here." It was an indexical. When he said "actually, Claire is dead," he was only saying "in this world, Claire is dead." It was no more ontologically privileged than saying "it is raining here" while standing in the desert knowing it rained in the valley below.

  He had taught this for twenty years. Modal Realism. The view that possible worlds are not abstract descriptions or mental constructs, but physical places just as real as this one, isolated by logical space rather than physical distance. He had defended it vigorously against colleagues who called it insane. Now, alone in the quiet, the ontology felt like a torture device.

  His phone buzzed. A text from his sister: *Thinking of you on the anniversary. Love you.*

  In another world, he hadn't answered. In another world, he had screamed at her. In another world, she didn't exist. The sum total of all variations of Elias was infinite. There was an Elias who was a saint, and an Elias who was a monster. If every version was equally real, why did the moral quality of *this* version matter? If the sum of happiness across the pluriverse was constant, was his local kindness just a drop in an ocean that already existed elsewhere?

  Lewis had an answer for this. *Rational care is tied to causal isolation.* You can only affect your own world. Therefore, you should only care about your own world.

  But knowing the restriction didn't stop the grief from bleeding outward. It wasn't just that Claire was dead here. It was that her counterparts were suffering elsewhere, and he couldn't help them. He was causally sealed in this bubble of reality, aware of the infinite suffering just a logical step away, utterly powerless to cross the boundary.

  He went to work. The lecture hall was warm, filled with the shuffling noise of two hundred undergraduates. He stood at the podium, looking out at the sea of faces. Today's topic: The Ethical Implications of Modal Realism.

  "Some of you ask," Elias said, his voice echoing slightly, "if everything happens somewhere, does choice matter? If there is a world where I choose to rob a bank, am I responsible for not stopping that counterpart?"

  He paused, gripping the edges of the podium. He could feel the wood grain, the specific texture of *this* world.

  "No," he said. "Because you are not that counterpart. Counterpart theory tells us that identity is not trans-world. You are not spread out across the pluriverse like a butter pat melted over too much toast. You are here. That person is there. They are similar to you, perhaps very similar, but they are not you."

  A hand went up in the third row. A young woman with bright eyes. "But Professor, if they're just as real as us... doesn't that dilute the weight of what we do? If there's a world where everyone is happy, does our struggle here matter?"

  Elias looked at her. He wanted to tell her the truth, not the textbook answer. He wanted to say: *It feels like it dilutes it. It feels like my grief is just a local variation, not a universal tragedy.*

  "The weight isn't dilated," Elias said, surprising himself. "It's concentrated."

  He walked away from the podium, moving toward the edge of the stage. The causal isolation was absolute. No messages could be sent. No portals could open. The other worlds were not distant stars; they were distinct existences entirely.

  "Imagine you are in a burning building," Elias said. "You know there are other buildings, identical to this one, where the fire never started. Does that mean you shouldn't try to put out the fire here? Does it mean the pain of the people burning here is less real because, in another building, they are safe?"

  "But they're safe," the student pressed. "The total amount of suffering is balanced."

  "But you are in *this* building," Elias said. "Your agency is local. Your compassion is local. If you refuse to help the person next to you because someone else is helping their counterpart in another world, you have abandoned your only sphere of influence. The metaphysics doesn't change the ethics. It just defines the boundary of your responsibility."

  He stopped talking. The room was quiet. He realized he was trembling slightly.

  The lecture ended. The students filed out, chatting about lunch and weekends, oblivious to the infinite heaviness hanging in the air. Elias packed his bag slowly.

  He walked home through the rain. In some worlds, it was sunny. In some, the city didn't exist. In some, he was walking with Claire. He could imagine those worlds with such vividness that the pavement beneath his feet felt thin, like paper stretched over a deep well.

  The nagging feeling returned. The moral vertigo. If he gave money to the homeless man on the corner, it was a good act. But there was an Elias who walked past. There was an Elias who struck the man. Those acts were just as real as this one. The universe didn't care which Elias was "actual," because "actual" was just where the speaker stood.

  He stopped in front of the homeless man, who held a cup and looked at the ground.

  In a billion worlds, Elias walked past. In a billion worlds, the man stayed hungry. In some, the man was fed.

  Elias reached into his pocket. He felt the coins. They were cold, metal, specific. They existed here. They could change the temperature of *this* man's hands, buy *this* man's food. They could not touch the counterparts.

  That was the mercy. That was the only thing that made the horror bearable.

  If the worlds were connected, the suffering would be infinite and unmanageable. But they were isolated. The isolation was a wall, yes, but it was also a container. It held his responsibility in place. It prevented his guilt from evaporating into the pluriverse. He couldn't save the Claire who was dying in World 4,092. But he couldn't hurt her, either. He couldn't save the Claire who was happy in World 88. But he didn't have to leave her.

  He was stuck with *this* Claire. The one who was gone. And he was stuck with *this* man. The one who was here.

  "Here," Elias whispered.

  He dropped the coins into the cup. The sound was a sharp clink, a causal event that rippled out only in this spacetime. It didn't echo in the others. It was small. It was finite.

  "Thank you," the man said.

  "You're welcome," Elias said.

  He walked the rest of the way home. The house was still crowded with the ghosts of possibility, but the kitchen was just a kitchen. The chair was just a chair. He sat down and picked up his cold coffee.

  He thought about the student's question. *Does our struggle here matter?*

  It mattered because it was the only struggle he could fight. The metaphysics of Lewis didn't erase the pain; it just localized it. It made "here" the only place where love could be enacted. The other worlds were real, yes. They were concrete. But they were not *his*.

  He looked at the empty chair. He didn't try to imagine the worlds where she was sitting in it. He looked at the dust motes dancing in the light beam that fell across the wood. That light was here. The dust was here. The grief was here.

  "I'm still here," he said to the empty room.

  It wasn't much. It wasn't a victory over the infinite. But it was an affirmation of the indexical. It was a declaration that *actual* meant something, not because it was ontologically superior, but because it was the only coordinate where his hands could move.

  He stood up and washed the mug. The water was warm. The soap smelled of lemon. He dried the ceramic and put it away. In other worlds, he left it in the sink. In other worlds, he smashed it against the wall.

  Here, he put it away. And for now, in this concrete slice of reality, that was enough.
