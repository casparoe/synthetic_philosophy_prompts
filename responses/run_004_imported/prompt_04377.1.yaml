answer: |-
  **Setting:** *The foyer of the opera house. The second act is underway, but the production has inserted a brief pause following the signing of the marriage contract and the departure of the notary. The audience is buzzing; the emotional temperature is high. ARTHUR holds a glass of champagne he hasn't touched. BEATRICE leans against the marble balustrade, looking back toward the closed doors of the auditorium.*

  **ARTHUR:** You can't seriously tell me you're ready to go back in there and accept what's coming. Ten minutes. That's all we have left before they tell us this tragedy is a joke.

  **BEATRICE:** Tragedy? Is that what you think we've been watching?

  **ARTHUR:** Listen to Fiordiligi's "Per pietà." I'm still shaking. Mozart wrote a monument to human fidelity in that aria. She wrestled with her conscience, she nearly broke, and the music treated her struggle with the weight of a soul in crisis. Now, in this final scene, she's expected to shrug and pair off with Guglielmo as if the last three hours were a game of cards. Kerman was right. It's a structural collapse. The music promises a psychological truth that the libretto refuses to pay.

  **BEATRICE:** But Arthur, that refusal *is* the payment. You're reading Kerman as if he thinks Mozart failed. I think Mozart knew exactly what he was doing. The gap you're calling a flaw is the only honest thing about the opera. If Fiordiligi stayed in despair, if Guglielmo remained embittered, we'd have a nice romantic tragedy. We could cry and go home feeling noble.

  **ARTHUR:** And why is that inferior to... whatever this is?

  **BEATRICE:** Because people don't stay in despair. Not when society tells them to move on. Don Alfonso isn't just a puppet master; he's the voice of the social order. He's saying, "The contract is signed, the reputation is saved, the marriages are convenient. Forget the feelings." The horror of the final scene isn't that they reconcile; it's *how easily* they reconcile. The music is serious, yes, but the plot is blithe. That friction is where the truth lives.

  **ARTHUR:** Truth? It's cynicism masquerading as wisdom. You're asking me to believe that Mozart, a genius of characterization, suddenly decided his characters were puppets. When they sing the final ensemble, "Sani e salvi" (Safe and sound), they are singing platitudes. After the harmonic complexity of the Act II sextet, we get a trivial rondeau? Kerman calls it "dramatically incoherent." I call it a betrayal of the music. The music says "this matters," and the plot says "nothing matters."

  **BEATRICE:** Exactly! "Nothing matters" in the face of convention. That's the Enlightenment critique. You want the music to dictate the action, but Williams argues that in *Così*, the music reveals what the characters *cannot* say. They sing "Safe and sound," but the orchestra knows they are wounded. The audience is left holding the dissonance. If you fix the ending to match the seriousness of the music, you let the audience off the hook. We want them to suffer so we don't have to admit that we would do the same thing.

  **ARTHUR:** That's a philosopher's justification for a dramaturg's failure. You're protecting the concept at the expense of the characters. Think of Dorabella. She fell for the disguise almost immediately. The music suggested she was fickle, yes, but in the second act, she showed genuine remorse. If she accepts Guglielmo back in the finale without a genuine reckoning, she isn't a human being; she's a prop. Kerman's point is that opera *is* drama. If the drama doesn't hold up, the music becomes decorative. It becomes beautiful wallpaper over a cracked wall.

  **BEATRICE:** But the wall *is* cracked! That's your blind spot, Arthur. You want the wall to be either solid or demolished. Williams suggests the opera forces us to stare at the crack. When Don Alfonso says, "This is the comedy," he's not describing the genre; he's issuing a command. He's telling them, "Laugh, or you'll cry." The reconciliation isn't happy. Listen to the tempo. It's rushed. They are herded together.

  **ARTHUR:** Herded by whom? By the composer! Mozart writes the notes. If he wanted us to feel the coercion, he could have given them a recitative of resignation. Instead, he gives them a sparkling C-major finale. He invites the applause. He courts the encore. You can't have it both ways. You can't say the ending is a bitter pill and then point to the audience's applause as proof of its success. The applause proves Kerman right: the audience accepts the farce because the music seduces them into ignoring the logic.

  **BEATRICE:** Or the applause is nervous. Have you ever heard that applause? It's uneasy. People don't know whether to cheer or sit in silence.

  **ARTHUR:** That's directorial projection. The score resolves. The cadences are perfect. The dramatic tension is dissipated, not sustained. Kerman argues that *Opera as Drama* requires the music to illuminate the action, not contradict it to the point of negation. In *Figaro*, the music deepens the count's redemption. In *Don Giovanni*, it seals the Don's fate. In *Così*, the music deepens the pain, but the plot erases the pain. It renders the preceding two hours emotionally void. If Fiordiligi can forgive Ferrando in five minutes, her "Come scoglio" was a lie.

  **BEATRICE:** "Come scoglio" wasn't a lie. It was a wish. She wanted to be a rock. She found out she wasn't. And now, in the finale, she has to live with the fact that she isn't. That's the Williams reading. The "blithe resolution" isn't about happiness; it's about survival. We marry, we settle, we pretend the chaos didn't happen so we can get through Tuesday. If Mozart gave them a tragic ending, it would be fantasy. People don't die of heartbreak in the suburbs. They drink champagne and go back inside.

  **ARTHUR:** So art's job is to mimic the compromise? I thought art's job was to reveal the cost of the compromise. By smoothing it over with a pretty ensemble, Mozart hides the cost. Kerman says the work fails because it asks us to care deeply about people who, ultimately, are treated as trivial. I care about Fiordiligi. That's why I can't watch her become a punchline.

  **BEATRICE:** She's not a punchline. She's a survivor. And the music *doesn't* smooth it over. That's where you miss Williams's nuance. The music remains too rich for the text. When they sing "Fortunato l'uom che prende," the irony is in the orchestration. It's too bright. It's manic. Mozart is winking at us. He's saying, "Look how quickly they cover the wound." If you accept the surface, you're the one being fooled. Kerman thinks the mismatch is an accident. Williams says it's the message.

  **ARTHUR:** But at what cost to the integrity of the work? If the message relies on the audience noticing the mismatch, then the opera fails whenever the audience just enjoys the tunes. And most audiences *do* just enjoy the tunes. They leave humming the overture, ignoring the moral rot. A work that requires a philosopher to explain why its ending isn't terrible is a work that has lost its dramatic footing.

  **BEATRICE:** And a work that gives the audience exactly the emotional closure they want is a work that has lost its intellectual honesty. You say Kerman values drama. I say Williams values truth. The truth is, we are inconsistent. We feel deeply, then we act shallowly. *Così* captures that inconsistency better than any tragedy could.

  **ARTHUR:** *(Looks at his watch)* It's a beautiful defense of human weakness, Beatrice. But I'd rather believe in Fiordiligi's rock than in Alfonso's cynicism.

  **BEATRICE:** *(Pushes off the balustrade)* Then you'll hate the last ten minutes. Because the rock crumbles. And we have to decide if we can still love her after it does.

  **ARTHUR:** I'm not sure Mozart lets us choose.

  **BEATRICE:** No. He makes us watch. That's why we're still arguing two hundred years later.

  *(The bell rings. The usher gestures toward the doors. They look at each other, neither conceding, and turn back toward the dark of the auditorium.)*
