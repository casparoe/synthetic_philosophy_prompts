answer: |-
  **Admiral Valerius:** The water is black tonight. No moon. You look at the harbor and see a fleet destined for slaughter or victory. I look and see only fog.

  **Admiral Constantine:** Fog is in the eyes, Valerius, not in the facts. The ships are there. The orders are written. Either we engage the enemy at dawn or we do not. There is no third option hovering over the water. The proposition "The battle occurs at dawn" is true, or it is false. Right now. In this moment.

  **Valerius:** And that is where you chain yourself to the mast. You say it is *already* true? Before a single oar breaks the surface?

  **Constantine:** Why not? Truth is not a timestamp. If the battle happens, then the statement predicting it was true. If it does not, it was false. The truth value depends on the event, yes, but the value exists timelessly. To deny this is to shatter the law of bivalence. You want to say the sentence is neither true nor false? That is not philosophy; that is cowardice disguised as modality.

  **Valerius:** It is not cowardice to refuse to call a thing settled when it is not. You cling to bivalence because you fear the chaos of the open future. But tell me, Constantine: if it is *true* now, tonight, that we fight at dawn, then how can we possibly do otherwise? If I order the fleet to withdraw, I make a true statement false. I create a contradiction. Since contradictions are impossible, my order is impossible. The battle is necessary.

  **Constantine:** You confuse truth with causation. The truth of the proposition does not *force* the ships to move. The movement of the ships makes the proposition true. The direction of fit is from world to word, not word to world. That it is true now does not mean it is *necessarily* true now. It is contingently true. We could withdraw, but if we did, the proposition "The battle occurs" would have been false all along, not true.

  **Valerius:** That is a sleight of hand. You treat the truth value as a shadow that follows the event, but you insist the shadow exists before the object casts it. Let us push this to tomorrow. Suppose we fight. The sun rises, the cannons roar, and the battle becomes history. Now, look back at tonight. Is it not a fact of the past that "It was true on the night before that the battle would occur"?

  **Constantine:** It is.

  **Valerius:** And the past is fixed. What is done is done. What was true is true. No power in heaven or earth can change the past. So, tomorrow, the statement "It was true on the night before that the battle would occur" is accidentally necessary. It is unchangeable. But if it is unchangeable tomorrow that it was true tonight, then tonight it was unchangeable that the battle would occur. The necessity of the past transfers backward onto the future event. You haven't saved contingency; you've just hidden the chains in the tense of the verb.

  **Constantine:** You are invoking the fixity of the past, a powerful argument, but it relies on a distinction you are ignoring. Not all facts about the past are "hard" facts. A hard fact is purely about the past moment itself—"Constantine stood on the cliff." A soft fact is a fact about the past that entails something about the future—"It was true on the night before that the battle would occur."

  **Valerius:** Soft facts? You mean convenient fictions.

  **Constantine:** I mean logical structure. The accidental necessity of the past applies only to hard facts. Soft facts do not carry that necessity because they are not fully settled until the future they reference arrives. The truth value was present, yes, but its *status* as a fixed fact of the past was waiting on the event. So, when you stand tomorrow and say, "It was necessary that it was true," you are wrong. It was true, but it was not a hard fact of the past until the battle made it so. The necessity does not transfer because the fact itself wasn't the kind of fact that locks the door.

  **Valerius:** That sounds like you are saying the past changes. Tomorrow, the fact becomes "hard." But if the fact changes status, then the past is not fixed. You are having your cake and eating it too. You want the truth value to be there now to save your logic, but you want it to be malleable enough to save your freedom.

  **Constantine:** The fact doesn't change. The *classification* of its necessity is what you misunderstand. Look, Valerius, let's turn to your cost. You deny bivalence. You say "The battle occurs" is neither true nor false. That means you must also deny the Law of Excluded Middle for future contingents. You are willing to break the fundamental engine of rational thought—the idea that for any proposition P, either P or not-P holds—just to preserve a feeling of openness. That is a massive tax to pay. You sacrifice the clarity of logic for the comfort of agency.

  **Valerius:** I deny bivalence, not necessarily excluded middle, though I care little for the distinction if the result is the same. But yes, I pay the tax. And I do so gladly. You talk of logic as if it is a god we must serve. I say logic is a tool we use to navigate the world. If your tool tells me the future is already written because you refuse to admit a third category beyond "true" and "false," then the tool is broken, not the world. The cost of denying excluded middle for contingents is a slight adjustment to our semantics. The cost of your view is fatalism. Which is heavier? A tweaked logic, or a dead universe where deliberation is an illusion?

  **Constantine:** Deliberation is not an illusion just because the outcome is true. I deliberate *because* it is true that I will deliberate and then act. My reasoning is part of the causal chain that makes the proposition true. You think that because the truth is there, my choice is bypassed. But the truth is there *because* of my choice. You are terrified of a truth that doesn't depend on your current knowledge.

  **Valerius:** I am terrified of a truth that makes my choice irrelevant. If it is true now, then in every possible world accessible from now where the laws of logic hold, the battle happens. There is no accessible world where I withdraw. If there were, the proposition would be false. So where is the freedom? You say "it's contingent," but you define contingency as "true in some worlds, false in others." But which worlds are accessible to me? Only the ones where the battle happens. That is not freedom. That is a script.

  **Constantine:** Accessible worlds are determined by powers, not truth values. I have the power to withdraw. If I exercised that power, the truth value would be different. The truth value tracks the power; it does not constrain it. You insist that because the track is laid, the train cannot steer. But the track is laid by the train's movement, not before it.

  **Valerius:** But the track is laid *now*. Tonight. Before the engine turns. That is the bite of the argument. If I stand here and say "I might withdraw," and you say "No, it is false that you might withdraw because it is true that you will fight," then you are saying my power is null. You are saying the truth value restricts the power.

  **Constantine:** No, the power restricts the truth value. But the truth value is still binary. You are conflating epistemic uncertainty with ontological indeterminacy. You don't know what will happen, so you say it isn't true yet. I say you just don't know the truth yet. The universe is not waiting for dawn to decide what is true. It is waiting for dawn to reveal what was true.

  **Valerius:** And I say the universe is waiting for dawn to *create* the truth. There is nothing there to be revealed. You look at the empty space of tomorrow and see a hidden object. I look and see nothing. If you see a hidden object, you are a determinist. If you see nothing, you are an realist about the open future. You claim your view saves classical logic. I say it saves logic at the price of reality. You preserve the law of bivalence by murdering time. You make the future just as static as the past.

  **Constantine:** I make the future real. If it has no truth value, it is nothing. It is vapor. How can I plan, how can I command, if the proposition "We will win" is neither true nor false? If it is neither, then it is not the case that we will win, and not the case that we will lose. Then why prepare? Why sharpen the swords? Your view undermines the very rationality of action. I act because I aim to make a true proposition come to pass. You act because... what? Because you are filling in the blanks of a void?

  **Valerius:** I act because the future is mine to write. You act because you are reading a book someone else wrote. You ask why sharpen the swords? I sharpen them because the outcome depends on the sharpness. On your view, the outcome depends on the truth value, which is already set. If it is true we win, the swords could be dull and we would win. If it is false, they could be sharp and we would lose. Your truth values float above the causality, untouched by the steel. Mine are forged by it.

  **Constantine:** That is a caricature. The truth value supervenes on the causality. It is true we win *because* the swords are sharp. The dependence is real. You just refuse to acknowledge that the "because" settles the truth value prior to the event. You want the causality to settle the truth value *at* the event. But logic demands consistency across time. If P is true at t2, it cannot be non-true at t1.

  **Valerius:** Logic demands consistency, yes. But it does not demand that every sentence has a value at every time. You are smuggling in an assumption that truth is a property of sentences independent of the conditions that verify them. I say truth is a property of sentences relative to the settledness of the world. The world is not settled tomorrow. Therefore, the sentence has no value.

  **Constantine:** And I say the world is settled by the laws of nature and the state of affairs now, even if we cannot compute it. You call it open; I call it complex. But complexity is not indeterminacy. You are hiding behind the fog on the water and calling it metaphysical openness.

  **Valerius:** And you are staring at your own reflection in the water and calling it destiny. We stand here, two men with the same fleet, the same enemy, the same night. But you see a tomb, and I see a horizon. You keep your bivalence, Constantine. Keep your tidy logic where every sentence is judged before the crime is committed. I will keep my freedom. I will sleep tonight knowing that when the sun rises, it will light up a truth that did not exist when I closed my eyes.

  **Constantine:** And I will sleep knowing that when the sun rises, it will illuminate a reality that was coherent all along. You say I see a tomb. I say I see a foundation. Without truth, there is no reality to stand on. You jump into the void and call it flying. I build the bridge and call it logic.

  **Valerius:** Then let the battle decide. Though on your view, it already has.

  **Constantine:** On my view, the battle confirms. On yours, it creates. We shall see which admiral sleeps better.

  **Valerius:** We shall see which one is actually free.

  **Constantine:** Goodnight, Valerius.

  **Valerius:** Goodnight, Constantine. May the morning be new.

  **Constantine:** May it be true.
