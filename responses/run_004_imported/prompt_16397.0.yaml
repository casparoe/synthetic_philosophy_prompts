      Admiral Constantine (Fixed/Ockhamist): Rationalist, focused on order, logic, and the nature of truth, believes freedom is compatible with truth.

      *Wait, one more check on the "Fixity of the Past" argument.*
      The specific worry is: If $P$ is true now, then tomorrow $Past(P)$ is true. $Past(P)$ is necessary (fixity of past). Therefore $P$ was necessary.
      Ockhamist response: $Past(P)$ is not a "hard fact" about the past. It entails something about the future. Only hard facts are accidentally necessary.
      I need to make sure Constantine articulates this distinction clearly without sounding like a textbook.

      *Let's go.*

