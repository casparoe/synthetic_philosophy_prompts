          *   Peircean: Future contingents are neither true nor false (Open Future).
          *   Ockhamist: Future contingents are true/false, but not *necessarily* true/false (Fixed Truth, Contingent Mode).
      *   So, Admiral Open = Peircean. Admiral True = Ockhamist.
