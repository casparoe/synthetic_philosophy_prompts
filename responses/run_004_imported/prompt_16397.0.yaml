      *   *True:* Distinguish hard/soft facts.
      *   *Open:* That's ad hoc.
      *   *True:* Your logic is broken.
      *   *Open:* Your metaphysics is fatalistic.

      *Let's flesh this out into full dialogue.*

      *Need to ensure the "Fixity of the Past" argument is sharp.*
      Admiral Open: "Tomorrow, after the battle, it will be a fact that 'It was true yesterday that we fought.' That fact is past. It is unchangeable. Therefore, yesterday it was unchangeable that we would fight."
