      *   **Positions:**
          *   Admiral A (Open Future/Peircean?): Future contingent sentences are neither true nor false yet. Bivalence does not apply. Future is genuinely open.
          *   Admiral B (Fixed Truth/Ockhamist?): Future contingent sentences are true or false now. Classical logic (bivalence) holds. This does not imply fatalism/necessity.
      *   **Key Arguments to Include:**
          *   Admiral B must address the "fixity of the past" objection (if it's true now, tomorrow it becomes past truth, hence necessary, so the event was necessary).
