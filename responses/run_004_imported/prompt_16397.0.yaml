      *   **Round 2: The Logic Cost (Excluded Middle).**
          *   True: You're breaking classical logic. LEM (Law of Excluded Middle) is sacred.
          *   Open: LEM applies to propositions, not contingent future events. Or rather, I deny bivalence, not necessarily LEM (depending on interpretation, but usually Open Future denies bivalence for future contingents). Let's stick to the prompt's framing: " denying excluded middle, that's a massive cost."
          *   Open's rebuttal: The cost of fatalism is higher.
      *   **Round 3: The Fixity of the Past (The Hard Part).**
          *   Open: If it's true now, tomorrow it's past. Past is necessary. So the battle is necessary.
          *   True: This is the consequence argument. I need to distinguish between *accidental necessity* of the past and the *mode* of the truth. Ockham's distinction: "Soft facts" vs. "Hard facts."
