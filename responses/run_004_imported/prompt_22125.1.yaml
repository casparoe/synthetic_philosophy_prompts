answer: |-
  Good morning everyone.

  Most of us remember the weather in March. It was that tricky time of year where the ice looks solid, but it isn't. We remember the cold. And for many of us, the story of what happened behind the middle school retention pond feels like something from a movie, not a Tuesday afternoon.

  We're here to present Priya with the "Above and Beyond" Award. But before I hand it over, I want to talk for a minute about what those words actually mean. Because when you hear Priya talk about that day, she usually shrugs and says, "Anyone would have done the same thing."

  It is a really humble thing to say. And I get why she says it. But if we're being honest, we know that isn't quite true.

  In the moment the ice broke, there was no rulebook. There was no teacher telling her what to do. There was no graduation requirement on the line. There was just a choice. And while we can all hope that we would act the way Priya did, the truth is that self-preservation is a powerful instinct. It is normal to hesitate. It is normal to run for help instead of running toward danger. Nobody here is blaming anyone for being scared. Nobody is saying that staying safe on the shore was the wrong choice.

  But Priya made a different one.

  There is a difference between doing what you are supposed to do, and doing what the situation needs, even when you aren't supposed to. Later in this assembly, we're going to recognize students who completed their mandatory twenty volunteer hours. And those students should be proud. They kept a promise. They fulfilled an obligation. That is duty. And duty is the backbone of a good community.

  But what Priya did wasn't duty. You can't mandate jumping into a freezing pond. You can't schedule courage.

  If we treat Priya's act like it was just "normal," we risk forgetting how rare it actually is. But if we treat it like she's some kind of superhero who doesn't feel fear, we make her impossible to relate to. The truth is somewhere in the middle. She's one of us. She probably froze for a second. She probably got scared. But she decided that someone else's safety mattered more than her own comfort in that moment.

  That is why this award exists. It's not just for "being good." It's for those moments when "being good" costs you something real, and you do it anyway, not because you have to, but because you chose to.

  Priya, you said anyone would have done it. We wish that were true. But since you're the one standing here, and that kid is safe at home with his family, we know it wasn't. Thank you for showing us what "above and beyond" actually looks like.

  Please welcome Priya.
