answer: |-
  This is a superb intuition, and your background in evolutionary biology gives you a distinct advantage in spotting the category error that modern decision theorists often commit. You have identified the exact friction point: the conflation of the *adaptive value of a trait* with the *instrumental rationality of a specific token act*.

  In your field, you know that just because a behavior (like alarm calling) was selected for because it generally enhances fitness, it does not follow that every instance of that behavior is fitness-enhancing *in situ*. If a primate gives an alarm call when there is no predator, or when no kin are within earshot, the *mechanism* is adaptive, but the *act* is a waste of energy.

  The modern consensus in decision theory (FDT, UDT, and even sophisticated EDT) attempts to solve the Hitchhiker problem by redefining rationality so that the act of paying counts as rational. I am going to argue the opposite: **The act of paying is irrational, full stop.** Causal Decision Theory (CDT) is correct to label it so. The fact that you *wish* you were the kind of person who wouldn't pay (so you could have gotten a ride) does not make the payment itself rational. It makes your situation tragic, not your choice rational.

  Here is the forceful defense of the CDT verdict, grounded in the sovereignty of the present moment and the definition of instrumental agency.

  ### 1. The Object of Evaluation: Acts vs. Algorithms
  The fundamental disagreement here is not about math; it is about what decision theory is *for*.

  Causal Decision Theory asks: **"What should I do right now?"**
  Functional/Updateless Decision Theories ask: **"What algorithm should I have been running all along?"**

  When you are standing in the town square, wallet in hand, the driver waiting for his cash, the past is fixed. The causal chain that brought you there (the driver's prediction) is complete. The question facing *you, the agent in the moment*, is strictly: "Does handing over this money produce a better outcome than keeping it?"

  The answer is no. Keeping the money leaves you with (Town + Cash). Paying leaves you with (Town). Since you prefer Cash, keeping it dominates.

  The FDT/UDT crowd argues that you should pay because your decision *now* is logically linked to the driver's prediction *then*. They treat your decision as an output of a function that the driver simulated. But this is a category error regarding agency. You are not a function designer in that moment; you are an agent executing a choice. To say the act is rational because it validates a prior algorithm is like saying it is rational to eat a meal you've already digested because eating was necessary for survival yesterday. It conflates the *history* of the agent with the *current leverage* of the agent.

  If decision theory is supposed to guide action, it must guide the action you can actually take. You cannot take the action of "having been predicted to pay." You can only take the action of "paying." Since paying has no causal power to change the past, it is instrumentally useless. Instrumental uselessness is the definition of irrationality.

  ### 2. The Sunk Cost Fallacy and Causal Power
  Your intuition about "commitment devices" in evolutionary biology is precisely the wedge we need. In biology, we recognize that emotions (anger, gratitude) serve as commitment devices to solve time-inconsistency problems. I get angry so I will punish a cheater, even if punishing is costly, so that I am not cheated in the future.

  However, if the punishment occurs *after* the game has ended, with no future interactions possible, the punishment is biologically costly with no future return. An evolutionary biologist might say the *disposition* to punish is adaptive, but the *specific act* of punishing in a one-shot, end-of-line scenario is a metabolic waste.

  CDT respects this distinction. It admits that the *disposition* to pay was rational ex-ante (before the desert), but the *act* of paying is irrational ex-post (in the town).

  The modern decision theorists are effectively arguing that because the disposition was useful, the act must be justified. This is a version of the sunk cost fallacy. You have already "paid" the cost of being the kind of person the driver trusted (by having that disposition). To pay again with actual cash is to pay twice for the same ticket. CDT protects you from double-payment. It insists that rationality is about the marginal causal efficacy of your current move. If the move changes nothing but your bank balance, it is irrational.

  ### 3. The "Magic" of Subjunctive Dependence
  To claim that paying in town is rational, FDT/UDT must rely on a notion of "subjunctive dependence" or "logical causation." They argue that your decision *now* determines what the driver *would have* predicted.

  This smuggles in a form of backward causation under a different name. It asks you to act *as if* your current choice influences the past prediction. But physically, it does not. The prediction is a fossilized fact.

  In your work with primates, if a male grooms a female to secure mating rights later, that is causal. If he grooms her *after* the mating season is over and she is no longer fertile, and he does it because "grooming is what gets mating," he is misfiring. The mechanism is decoupled from the outcome.

  FDT/UDT asks the agent in the town to misfire on purpose. They ask you to treat a correlation (my payment correlates with my rescue) as a causation (my payment causes my rescue). CDT insists on the hard physical reality: correlations are not levers. You cannot pull the lever of the past. To define rationality as "acting as if you can pull the lever of the past" is to sever the link between rationality and control. Rationality is about navigating the world as it is, not as we wish our algorithms to be.

  ### 4. Dynamic Inconsistency is a Feature, Not a Bug
  The Hitchhiker case is essentially a problem of **dynamic inconsistency**. The preferences of the Agent-in-the-Desert (who wants to be saved) and the Agent-in-the-Town (who wants to save cash) are different.

  The modern decision theorists view this as a problem to be solved by unifying the agents into a single "timeless" decision maker. I argue this is a mistake. We *are* temporally extended beings, but we make decisions in the present.

  It is perfectly coherent to say:
  1.  It was rational for Desert-Me to wish for Town-Me to pay.
  2.  It is rational for Town-Me to refuse to pay.

  There is no contradiction here, only a conflict of interest across time. Desert-Me would like to bind Town-Me's hands. Town-Me finds those bonds chafing and cuts them.

  CDT acknowledges this tension. It admits that Desert-Me is in trouble because he knows Town-Me will defect. But it refuses to lie to Town-Me and tell him that defecting is irrational. To tell Town-Me that paying is rational is to gaslight the agent who actually has to perform the action. It is to demand that Town-Me sacrifice his own interests for the sake of Desert-Me's plan, without any causal mechanism to enforce it.

  If we define rationality as "doing what your past self planned," we strip the present self of agency. We turn the present self into a puppet of the past. CDT defends the sovereignty of the present agent. It says: "You are here now. The past is gone. Maximize your utility from this node forward." That is not a bug; it is the only honest way to model an agent embedded in time.

  ### 5. The Danger of "Rational Irrationality"
  Parfit's term "Rational Irrationality" is a euphemism for a crisis in the theory. It admits that the act is irrational (by standard means-ends reasoning) but claims it is rational (by some higher-order standard).

  I propose we drop the euphemism. The act is irrational. The *consequence* of being the kind of person who performs irrational acts (in specific, constrained scenarios) might be beneficial.

  Think of it like a mutation. A mutation might be deleterious in a specific environment (irrational act) but the genetic mechanism that allows for such variation is essential for the species (rational disposition). We don't say the mutation is "beneficial" just because variation is good. We say the mutation is harmful, but the system tolerates it.

  Similarly, paying the driver is a harmful act for the agent in town. It reduces his resources. It achieves nothing. The fact that having a *nature* prone to this harm allowed him to survive the desert is a testament to the value of the nature, not the act.

  By insisting the act is rational, FDT/UDT blur the line between **strategic advantage** and **instrumental correctness**.
  *   **Strategic Advantage:** Having a disposition to pay gets you in the car.
  *   **Instrumental Correctness:** Paying once in the car burns money.

  CDT preserves this distinction. It allows you to say, "I wish I were irrational (disposed to pay), because that would have saved me. But since I am rational (disposed to keep money), I will keep it." This is an honest assessment of the tragic structure of the situation.

  ### Conclusion: The Integrity of Instrumental Reason
  The reason you feel the "settled" consensus is moving too fast is that it sacrifices the core intuition of instrumental rationality: **actions should be chosen for their consequences.**

  In the town, paying has no good consequences. It is a ritual sacrifice to a god that has already left the temple. To call it rational is to turn decision theory into a religion where acting "in character" matters more than acting effectively.

  Defend CDT. It is the only theory that respects the causal structure of the universe. It admits that sometimes, being rational gets you killed in the desert. That is a terrible outcome, but it is the truth. The alternative is to claim that burning money in the town square somehow reaches back through time to move the car, which is magic, not science.

  You were right to trust your biological instincts. The disposition is the adaptation. The act is the phenotype. Sometimes the phenotype misfires relative to the immediate environment. We don't call the misfire "adaptive"; we call it a cost of doing business with a brain that has to plan for the future while living in the present. Paying the driver is irrational. Own that. It keeps your decision theory honest.
