      *Refining the Evolutionary Analogy:* In biology, we distinguish between *ultimate* causes (evolutionary history) and *proximate* causes (mechanism). FDT/UDT are like arguing that because the ultimate cause favors the trait, the proximate mechanism must ignore current sensory input. CDT respects the proximate reality.

