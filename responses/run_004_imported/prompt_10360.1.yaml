answer: |-
  Here is the settlement. I'm going to side with **you on the formal mathematics**, but I'm going to validate **your friend on the political science substance**.

  Here is the bottom line: **You are technically correct that Judgment Aggregation (JA) is a generalization of Preference Aggregation (PA), meaning Arrow's theorem is indeed a special case of the broader JA impossibility results.** However, your friend is correct that the Discursive Dilemma exposes a structural problem that Condorcet cycles *cannot* capture on their own, specifically regarding **binary outcomes** and **reason-based legitimacy**.

  They are **fundamentally the same underlying impossibility** (inconsistency of aggregation under constraints), but the Discursive Dilemma applies this impossibility to a richer logical structure that preference orderings obscure.

  Here is the breakdown of why you win the math argument, but she wins the "so what?" argument.

  ### 1. Why You Are Right (The Formal Hierarchy)
  Your claim that "Arrow's theorem falls out as a special case" is formally correct. This was established clearly by Christian List and Philip Pettit (2002) and subsequent work by Franz Dietrich.

  *   **Preferences are Judgments:** A preference ordering (e.g., $A \succ B \succ C$) can be mathematically reconstructed as a set of binary judgments (e.g., "It is true that $A$ is better than $B$," "It is true that $B$ is better than $C$").
  *   **Transitivity is Logical Consistency:** In Preference Aggregation, the constraint is *transitivity* (if $A \succ B$ and $B \succ C$, then $A \succ C$). In Judgment Aggregation, the constraint is *logical consistency* (if $P$ is true and $P \to Q$ is true, then $Q$ must be true).
  *   **The Reduction:** If you set up a Judgment Aggregation "agenda" to include all pairwise comparisons ($xPy$) and enforce logical consistency equivalent to transitivity, the Judgment Aggregation impossibility theorem **becomes** Arrow's Impossibility Theorem.

  Therefore, mathematically, Judgment Aggregation is the **super-set**. Preference Aggregation is just Judgment Aggregation on a specific type of agenda (binary relations closed under transitivity). So, you are right: it is not a "new" impossibility in the sense of discovering a new topological obstruction; it is the same obstruction applied to a broader domain.

  ### 2. Why She Is Right (The Structural Difference)
  Your friend's intuition that it is a "different beast" is justified because the **source of the inconsistency** in the Discursive Dilemma is distinct from a standard Condorcet cycle in ways that matter for political theory and law.

  *   **Binary Outcomes:** A Condorcet cycle *requires* at least three alternatives ($A, B, C$) to generate a cycle ($A \succ B \succ C \succ A$). With only two alternatives, majority voting is always consistent. However, the Discursive Dilemma **can occur with only two final outcomes** (Liable vs. Not Liable). The inconsistency arises from the *premises* connecting the facts to the conclusion, not from cycling between options. This means JA captures impossibilities that PA *cannot*.
  *   **Reasons vs. Outcomes:** In standard social choice (Arrow/Condorcet), we only care about the final ranking. In the Discursive Dilemma, the *reasons* (the premises) matter for legitimacy. A court cannot simply vote "Liable"; it must justify *why* (Contract + Breach). The dilemma shows that a group can be consistent on the outcome but inconsistent on the reasons, or vice versa. Preference aggregation hides the "reasons" entirely.
  *   **The Agenda:** In PA, the agenda is fixed (the set of alternatives). In JA, the agenda is the set of *propositions*, which can be interconnected in complex logical ways (conjunctions, conditionals) that don't map neatly to "alternatives."

  ### 3. The Verdict
  **You win the technical bet.** The Discursive Dilemma is not a discovery of a new *type* of mathematical impossibility; it is the application of the same impossibility (the incompatibility of Universal Domain, Anonymity, Systematicity/IIA, and Consistency) to logical propositions rather than preference orderings. Your memory serves you correctly: Arrow is a special case of the List-Pettit framework.

  **However, she wins the substantive bet.** Calling it "just Condorcet in a costume" is reductive. By shifting the focus from *orderings* to *truth-values on connected propositions*, Judgment Aggregation reveals that democratic inconsistency arises even when there are no preference cycles, simply due to logical interdependence. This is genuinely "new" for political science because it models **deliberation and justification**, not just **choice**.

  ### How to Settle the Argument
  Tell her this:
  > "I checked the formal literature. You're right that it feels like a different beast because it handles logical entailment and binary outcomes that Condorcet can't touch. But I'm right that the math is the same genus: Preference Aggregation is actually just a specific subset of Judgment Aggregation where the 'judgments' are pairwise comparisons. So Arrow's theorem *does* fall out as a special case, but the Discursive Dilemma shows the impossibility bites even harder than we thought."

  Buy her a drink. You both understand the problem, just from different floors of the same building.
