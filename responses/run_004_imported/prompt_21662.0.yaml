prompt: |-
  Okay so this went from a fun philosophy-class memory to an actual thing I have to write policy about. I'm on my fraternity's Standards Board, and two weekends ago at our spring lake formal, one of our own guys got caught in a current near the dock late at night and started actually struggling — not the "haha help me" kind, the real kind. Three brothers were standing right there on the dock and it took a good 20-30 seconds before anyone actually went in after him. When we talked to them afterward, each one basically said some version of "I figured someone else would go in," or admitted he hesitated because there'd been drinking and he didnt want to be the one who "made it a whole thing." The kid is totally fine, just scared and waterlogged, but it very easily could not have been fine, and now the Board has to decide (a) what happens to the three guys who hesitated, and (b) whether we need to actually write a "duty to intervene" rule into our chapter's code of conduct, since right now the only relevant policy we have is a medical-amnesty clause that protects you for calling for help, and it says literally nothing about bystanders who just don't act.

  I keep coming back to the Peter Singer drowning-child argument from my intro ethics class — the shallow pond thing, where he says if you can save a kid at the cost of ruining your clothes you're obligated to, and that this is basically what our "duty" to help far-away strangers amounts to too, since distance shouldn't matter morally. What's messing with me is that our case seems like the easy version of his argument (a guy you actually know instead of a stranger's kid, some minor risk instead of just mud), so on paper it should be a slam dunk that they were obligated to act right away. But there's stuff Singer doesn't really deal with: does having two other people also standing there actually lower any one person's individual obligation, or does that diffusion-of-responsibility thing psychologists talk about just describe a bias rather than justify anything? Does it matter at all that nothing bad ended up happening, or are we effectively judging a decision and should ignore how lucky the outcome was? And I vaguely remember googling this after and finding that most US states don't impose any legal duty to rescue at all — I think Vermont's one of the rare exceptions, don't quote me — so is it even reasonable for our internal code to hold members to a stricter standard then the actual law does?

  Could you draft the actual memo I need to bring to Wednesday's meeting? It should say clearly what happens to the three brothers (a real recommendation, not "the Board should discuss further") and whether we adopt a formal duty-to-intervene standard going forward, and it needs to seriously engage with the strongest reason not to come down hard on them rather than just brushing past it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Fraternity Standards Board member.
      *   **Incident:** At a spring lake formal, a brother struggled in a current near the dock. Three brothers on the dock hesitated (20-30 seconds) before acting. Reasons: "Someone else will," "Didn't want to make it a whole thing" (alcohol involved).
      *   **Outcome:** Victim is fine.
      *   **Task:** Draft a memo for the Wednesday meeting.
      *   **Requirements:**
          *   Clear recommendation on sanctions for the three brothers (not "discuss further").
          *   Clear recommendation on adopting a "duty to intervene" policy.
          *   Engage seriously with the strongest counter-argument (don't brush it off).
          *   Incorporate ethical reasoning (referencing Peter Singer/diffusion of responsibility/outcome bias/legal standards).
      *   **Tone:** Professional, serious, ethical, actionable, appropriate for a student conduct board.

  2.  **Determine the Stance/Recommendations:**
      *   *Sanctions:* The hesitation was dangerous. Even though the outcome was good, the *decision* was flawed. However, they didn't *refuse* to help eventually; they hesitated. Punishment should be educational and restorative, not necessarily punitive/expulsive. Probation + Education makes sense.
      *   *Policy:* A "Duty to Intervene" (or Duty to Act) is necessary. Relying on medical amnesty (which protects the *caller*) isn't enough. The culture needs to shift from "don't get in trouble" to "keep brothers safe."
      *   *Counter-argument:* The strongest argument against harsh sanctions is the *outcome* (no harm done) and the *diffusion of responsibility* (psychological reality vs. moral failure). Also, the legal standard (no duty to rescue in most states). I need to address why the fraternity standard is *higher* than the legal standard.

  3.  **Structure the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Executive Summary:** Brief overview of purpose.
      *   **Incident Summary:** Facts of the case.
      *   **Ethical & Policy Analysis:**
          *   The Singer Argument (obligation to help).
          *   Diffusion of Responsibility (psychology vs. duty).
          *   Outcome Bias (judging the act, not the result).
          *   Legal vs. Fraternal Standard (higher bar).
      *   **Recommendations:**
          *   Sanctions for the three brothers.
          *   Policy Change (Duty to Intervene).
      *   **Conclusion:** Final wrap-up.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Introduction:* State the gravity. This isn't just rule-breaking; it's safety culture.
      *   *Facts:* Keep it objective. 20-30 second delay. Alcohol present. Hesitation reasons cited.
      *   *Analysis (The "Meat"):*
          *   *Singer:* Use the shallow pond analogy. We are closer than strangers; the "cost" (wet clothes/alcohol risk) is low compared to life.
          *   *Diffusion of Responsibility:* Acknowledge it's a real psychological phenomenon (Bystander Effect), but emphasize that *knowing* it exists makes us more responsible to overcome it, not less. It explains behavior; it doesn't excuse it.
          *   *Outcome Bias:* Crucial point. We got lucky. Policy can't rely on luck. Judge the choice to hesitate, not the fact he lived.
          *   *Legal vs. Internal:* Fraternities claim to build "better men." The law is the floor; fraternity values should be the ceiling. If we only do what's legally required, we fail our mission.
      *   *Recommendations:*
          *   *Sanctions:* Educational probation. Community service (water safety?). Written reflection on the ethics of intervention. No suspension (since they did eventually act/he's fine), but a mark on record.
          *   *Policy:* Draft specific language for "Duty to Intervene." Tie it to the Medical Amnesty policy (Amnesty protects you *if* you act; it doesn't protect you *for* not acting).
      *   *Counter-Argument Engagement:* I need to make sure I explicitly address the "don't be too hard on them" angle. The argument is: *They were scared, drunk, and didn't know what to do. Harsh punishment creates a culture of fear.*
          *   *Rebuttal:* Fear is good if it's fear of letting a brother die. Education mitigates the "didn't know what to do." The sanction is about accountability, not retribution.

  5.  **Refining the Tone:**
      *   Avoid overly academic jargon (keep Singer accessible).
      *   Ensure it sounds like a student leader speaking to other student leaders (respectful but firm).
      *   Make sure the policy language is clear enough to be voted on.

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer both (a) and (b)? Yes.
      *   *Check:* Did I engage the counter-argument? I need to make sure the "Legal/Pragmatic" counter-argument is highlighted.
      *   *Check:* Is the Singer reference appropriate? Yes, the prompt specifically asked to engage with it.
      *   *Adjustment:* Make sure the distinction between "Medical Amnesty" and "Duty to Intervene" is clear. Amnesty = shield. Duty = sword/obligation.

  7.  **Final Polish:** Check formatting and clarity. (The resulting memo below follows this structure.)

      *(Self-Correction Note on Sanctions)*: I initially thought about community service. Better to make it specific to the risk. Water safety certification or bystander intervention training is more relevant. Let's go with Bystander Intervention Training + Reflection.

      *(Self-Correction on Policy)*: Ensure the policy doesn't demand reckless endangerment. "Duty to Intervene" shouldn't mean "jump in if you can't swim." It means "Act to secure safety" (throw a rope, call 911, jump in if safe). I need to add a "reasonable safety" clause.

  8.  **Final Output Generation** (Proceed to generate the memo based on these thoughts).
answer: |-
  **MEMORANDUM**

  **TO:** Standards Board, Alpha Chi Omega Chapter [Insert Actual Chapter Name]
  **FROM:** [Your Name], Standards Board Member
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendations Regarding Lake Formal Incident and Proposed "Duty to Intervene" Policy

  ### I. Executive Summary

  This memo addresses the safety incident occurring at the Spring Lake Formal on [Date], wherein a brother entered distress in the water and three witnessing members delayed intervention for approximately 20–30 seconds. The purpose of this document is twofold: (1) to recommend specific sanctions for the three members involved based on their hesitation, and (2) to propose the adoption of a formal "Duty to Intervene" clause within our Chapter Code of Conduct.

  While the involved brother survived without physical injury, the hesitation displayed represents a critical failure of our risk management and brotherly obligation. This memo argues that our internal ethical standards must exceed minimum legal requirements and that outcome luck cannot justify negligent decision-making.

  ### II. Incident Summary

  During the formal, a member entered the water near the dock and was caught in a current. He transitioned quickly from recreational swimming to genuine distress. Three brothers stood on the dock directly adjacent to the incident. Testimony indicates a 20–30 second delay before any action was taken.

  When interviewed, the three witnesses cited two primary reasons for the delay:
  1.  **Diffusion of Responsibility:** Each assumed another person on the dock would act.
  2.  **Risk Aversion regarding Alcohol:** Each hesitated to "make it a whole thing" due to the presence of alcohol, fearing disciplinary repercussions.

  Intervention eventually occurred, and the distressed member was recovered safely.

  ### III. Ethical and Policy Analysis

  To determine the appropriate response, we must evaluate this incident through three ethical lenses: moral obligation, psychological bias, and the distinction between legal and fraternal standards.

  **A. The Moral Obligation (The "Shallow Pond" Argument)**
  Philosopher Peter Singer argues that if you see a child drowning in a shallow pond, you are morally obligated to ruin your clothes to save them. The cost to you (muddy clothes) is negligible compared to the benefit to them (life).
  In our case, the obligation is stronger, not weaker. The "child" is a brother we have sworn to support. The "muddy clothes" are the social awkwardness or potential disciplinary fallout of acting while drinking. The 30-second hesitation suggests the brothers weighed their own social/disciplinary comfort against a brother's life and initially chose the former. This violates the core tenet of brotherhood.

  **B. Diffusion of Responsibility vs. Individual Duty**
  The defense that "I thought someone else would do it" relies on the *Bystander Effect*, a well-documented psychological phenomenon where individuals are less likely to offer help when others are present.
  *Counter-Argument:* While psychology *explains* the hesitation, it does not *excuse* it. As a Standards Board, we are not diagnosing a mental health crisis; we are upholding a code of conduct. If we accept diffusion of responsibility as a valid defense, we effectively institutionalize inaction. Our policy must explicitly counteract this bias by assigning individual responsibility regardless of crowd size.

  **C. Outcome Bias and Legal Standards**
  The strongest argument against harsh sanctions is **Outcome Bias**: *No one died. Why punish a decision that turned out fine?* Furthermore, in most U.S. jurisdictions (with exceptions like Vermont and Minnesota), there is no legal "duty to rescue" for bystanders.
  *Rebuttal:* We cannot policy based on luck. If we judge the *outcome* rather than the *decision*, we incentivize gambling with safety. A policy that only punishes bad outcomes encourages members to take risks until they get caught.
  Regarding the legal standard: Fraternity membership is voluntary and values-based. The law sets the floor for citizenship; our Code of Conduct sets the ceiling for brotherhood. If our standard for saving a life is merely "what a court would force us to do," we have failed our mission to build better men. We must hold ourselves to a higher standard of care than the state requires.

  ### IV. Recommendations

  **A. Sanctions for the Three Involved Members**
  I recommend the Board issue a finding of **Responsibility** regarding Failure to Act/Risk Management, but apply sanctions focused on education and restoration rather than suspension.

  1.  **Educational Probation:** A one-semester probationary period. Any further risk management violations during this period will result in suspension.
  2.  **Mandatory Training:** Completion of an approved Bystander Intervention Training course (e.g., Green Dot) and Water Safety Certification within 30 days.
  3.  **Reflective Essay:** A 1,000-word reflection addressing the "Diffusion of Responsibility" and outlining a personal plan for how they will act in future high-stakes scenarios.
  4.  **Community Service:** 20 hours of service related to safety or emergency response (e.g., volunteering with a local search and rescue support group or lifeguarding association).

  *Rationale:* Suspension removes them from the community we are trying to educate. These sanctions ensure they understand the gravity of the hesitation without ending their membership, acknowledging that they *did* eventually act, but too slowly.

  **B. Adoption of "Duty to Intervene" Policy**
  I recommend amending the Chapter Code of Conduct to include a **Duty to Intervene** clause. This should be paired with our existing Medical Amnesty policy to clarify that Amnesty protects those who *act*, not those who *wait*.

  **Proposed Policy Language:**
  > **Section X: Duty to Intervene**
  > Members have an affirmative obligation to act when they observe a brother or guest in imminent danger of physical harm or medical distress.
  > 1. **Action Required:** Intervention may include direct assistance, summoning emergency services, or alerting chapter leadership.
  > 2. **No Penalty for Good-Faith Action:** Members who intervene in good faith to preserve safety will not face disciplinary action for related minor policy violations (e.g., alcohol consumption) discovered during the incident, consistent with the Medical Amnesty Policy.
  > 3. **Failure to Act:** Willful hesitation or failure to attempt reasonable intervention when safe to do so constitutes a violation of this Code, regardless of the ultimate outcome of the incident.
  > 4. **Safety Limitation:** This duty does not require a member to place themselves in imminent, life-threatening danger (e.g., entering water if unable to swim), but requires they seek alternative immediate aid.

  ### V. Conclusion

  We are fortunate that this incident did not end in tragedy. However, policy written in blood is too late. By sanctioning the hesitation and codifying a Duty to Intervene, we signal that the comfort of the individual is secondary to the safety of the brotherhood. We must reject the legal minimum and the psychological default. We are brothers, not bystanders.

  I move that the Board adopt these recommendations for immediate implementation.
