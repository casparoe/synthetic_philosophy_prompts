      *   *Framing the Innocent:* This is the classic utilitarian/consequentialist vulnerability. The Judge using this is smart. It forces the consequentialist to explain why they *wouldn't* frame an innocent person if it saved more lives.
      *   *Immeasurability of Desert:* This is a strong point. Retributivists often argue that just because we can't calculate desert perfectly (like a math equation) doesn't mean it doesn't exist (like love or honor).
      *   *Verdict:* The Judge's argument is actually philosophically sound *as a retributivist position*. It's not a strawman of retributivism. The beta reader might be reacting to the *tone* or the lack of nuance in how it's presented, or they might be a consequentialist themselves. However, the Judge *is* using the "Framing" objection as a trump card. A sophisticated consequentialist *has* answers to this. If the Judge treats it as a "checkmate" without acknowledging the nuance, *that* could feel like a strawman of the *consequentialist* position.

  3.  **Evaluate the Psychologist's Argument (Consequentialism/Rehabilitation):**
