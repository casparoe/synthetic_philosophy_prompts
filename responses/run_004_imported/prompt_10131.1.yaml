          3.  **The Measurement Attack:** If the Judge can't measure desert, he is imposing suffering based on intuition. That is morally risky.
      *   **Character Voice:** Ensure the Judge sounds like a disappointed academic (precise, weary, dogmatic) and the Psychologist sounds like a pragmatist who knows the theory but cares about the *result*.

  7.  **Drafting the Response:**
      *   *Tone:* Encouraging, analytical, specific.
      *   *Structure:*
          1.  Direct answer on the Judge's argument (It's solid Kant, not a strawman).
