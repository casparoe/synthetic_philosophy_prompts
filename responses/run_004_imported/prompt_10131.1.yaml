  *(Check on "Gap Problem")*: In punishment theory, the "Gap Problem" is specifically the difficulty retributivists face in moving from "you deserve punishment" to "you deserve *x* amount of punishment." There is no non-arbitrary way to set the scale. The Judge admitting he can't say how many years her death is "worth" is him walking right into the Gap Problem. The Psychologist should pounce on that.

