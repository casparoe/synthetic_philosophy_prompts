      *   *Relevance:* If the Judge admits he can't measure desert precisely, he is acknowledging the Retributivist Gap Problem. The Psychologist should exploit this.

  4.  **Develop the Psychologist's Counter-Argument:**
      *   To make it sound like "people who've done the reading," the Psychologist needs to pivot from "Norway is nice" to a philosophical defense of consequentialism that addresses the Framing Objection.
      *   *The "Rule Utilitarian" or "Institutional" Defense:* We don't frame innocents not because it's wrong in the specific instance, but because a system that *allows* framing collapses trust, leading to worse outcomes long-term.
