answer: |-
  The substation smelled of ozone and old dust, the specific perfume of high voltage that never quite leaves your clothes. Elias knew the smell better than his own cologne. Thirty-five years of listening to the hum of transformers, of checking interlocks, of trusting that the red light meant *danger* and the green meant *go*, even when the wiring behind the panel told a different story.

  He stood now in the shadow of the Mark IV Transmission Ring. It was a relic, a loop of superconducting cable that had been dark for a decade. The utility company wanted the copper scrapped. Elias was the consultant brought in to certify it safe to cut.

  "It's reading zero," said Miller, the junior tech. He held the multimeter like a holy relic, eyes darting between the digital display and the thick, black-insulated busbar. "Dead as a stone, Elias. We can ground it and saw."

  Elias didn't move. He kept his hands in his pockets, feeling the rough lint of his coat. "Put the meter away."

  "Sir?"

  "The meter has high impedance. It draws almost no current. It's asking the wire a polite question." Elias stepped closer to the busbar. The air around it shimmered slightly, a heat haze in the cold room. "I want to know what happens when you shout."

  Miller frowned. "The schematics say the breakers are open. The capacitors are discharged."

  "Schematics are wishes," Elias said. "This ring... there were rumors. About the feedback loops. They said the safety interlocks weren't just switches. They were observers."

  Miller laughed, a nervous sound that bounced off the concrete walls. "Observers? It's wire, Elias. It doesn't watch."

  Elias reached for the grounding stick. It was a long fiberglass pole with a copper hook at the end, designed to slap a conductor to earth before a human hand got near. "In the lab, we had a circuit once. A Fink, we called it, jokingly. If you tried to measure its voltage, it sensed the load and drained itself. If you didn't measure it, it sat there, charged and waiting. It wasn't broken. It was just... shy."

  "So it's safe to touch?"

  "No," Elias said. "It's safe to ignore. The moment you test it, you change it."

  He hooked the grounding clamp onto the earth rail. The metal clinked, loud in the silence. Now he had to bridge the gap. If the wire was truly dead, nothing would happen. If it was live, a bolt of lightning would follow the copper braid to the floor, and Miller would be picking pieces of Elias out of his safety glasses.

  But there was a third option. The one that kept Elias awake at night, long after he'd retired.

  What if the wire was live, but the moment the grounding hook touched it, the system sensed the short and killed the power *faster* than the arc could form? Not a mask—where the insulation holds the charge back—but a Fink. A fundamental change in the nature of the thing upon contact.

  If that were true, the wire was dangerous. It possessed the disposition to kill, but it hid it perfectly. A wolf that turns into a sheep the moment you reach for the throat. Is it still a wolf?

  "Step back," Elias said.

  "Elias, the meter says—"

  "Step back."

  Elias lifted the pole. The copper hook hovered an inch from the busbar. He could feel the hair on his arms standing up, or maybe it was just the static from the nylon floor. He pushed the hook forward.

  Contact.

  Silence.

  No flash. No boom. The multimeter on the bench still read zero. The grounding cable lay limp.

  Miller let out a breath he'd been holding. "See? Told you. Just old ghost voltage on the sensor. It's inert."

  Elias didn't lower the pole. He kept the hook pressed against the busbar. "Leave it."

  "We need to cut it."

  "Leave it connected."

  Elias walked over to the main control console. It was an analog relic, dials and needles. He flipped the master breaker to *Open*. The needle didn't move. He flipped it to *Close*. The needle didn't move. The system was unresponsive.

  "Help me with the saw," Elias said.

  They cut the cable three feet down from the ground. The diamond blade screamed through the insulation, then the metal core. Sparks flew, orange and bright, but they were just friction. No electrical arc. The two ends of the cable fell to the floor with a heavy thud.

  Miller kicked one of the ends. "Safe. Let's load it up."

  Elias knelt by the grounded end. The copper hook was still clamped where he'd left it. He leaned in, squinting at the point of contact.

  There, on the copper busbar, was a mark. A tiny, blackened pit, no bigger than a pinhead.

  "What's that?" Miller asked.

  "Nothing," Elias said. He rubbed it with his thumb. It was smooth. Molten, then cooled.

  "If it was dead, why is it melted?"

  "Friction," Elias lied. "When I slapped the ground stick on."

  "You slapped it gently, Elias. I watched."

  Elias stood up. He looked at the severed cable, then at the grounding stick, then at the tiny scar on the busbar.

  If the system was broken, the mark shouldn't be there.
  If the system was masked, there should be more damage—a blown fuse, a tripped breaker.
  But if the system was a Fink...

  If it was a Fink, the mark was the signature of the disposition vanishing. The energy *had* been there. It *had* wanted to flow. But the moment the path was offered, the source collapsed. The potential existed, but the manifestation was deleted by the stimulus itself.

  It meant the wire was lethal. It meant it had chosen, in that nanosecond of contact, not to be.

  "Is it safe?" Miller asked. He was looking at the cable ends, waiting for permission to touch them without the gloves.

  Elias looked at the young man. He thought about the interlocks in the old lab. The ones that saved lives because they were redundant. And the ones that failed because they were too clever, because they tried to predict the fault instead of just reacting to it.

  If he told Miller it was safe, and the disposition returned the moment the ground stick was removed...
  If he told Miller it was dangerous, and the wire was truly dead...

  The mark on the copper was small. A whisper of energy. Enough to weld the contact, but not enough to kill. Or maybe it *would* have killed, and the system had throttled itself down to save the equipment, sacrificing the truth of its own nature to maintain continuity.

  Elias pulled a roll of black tape from his belt. He began to wrap the cut end of the cable, covering the exposed copper, covering the metal, covering the truth.

  "Treat it as live," Elias said. His voice sounded tired in the big room. "Cap it, bag it, and tag it. Don't trust the meter. Don't trust the cut. And don't trust the silence."

  "But why?" Miller pressed, frustration edging his voice. "It didn't arc. It didn't trip. What are we afraid of?"

  Elias finished the taping. He patted the black bundle. It felt cold.

  "We're afraid," Elias said, "that it's still listening."

  He walked toward the exit, his boots echoing on the concrete. He didn't look back at the wire. He couldn't. Because if he looked, he might see the needle on the distant voltmeter twitch, just once, in the silence of the empty room. Or he might see it stay still.

  And he would never know which one was the lie.
