      *   *Emphasis:* Make sure to highlight why the *collective* aspect makes it *worse*. (Argument: The "Humanity" agent is more abstract than the "Individual" agent, so the drift is harder to track and justify).

  7.  **Final Review against constraints:**
      *   Argue CEV *cannot* escape Sobel/Rosati? Yes.
      *   Extending to collective makes it *worse*? Yes.
      *   Engage specific mechanics (extrapolation, coherence, spread, last judge)? Yes.
      *   Avoid generic paternalism/aggregation worries? Yes, focus on the *authority of the idealized self* over the *actual self*.

