answer: |-
  **Title:** The Drift of the Collective: Why Coherent Extrapolated Volition Exacerbates the Sobel-Rosati Dilemma

  **Introduction**
  The Sobel-Rosati objection to idealized-preference accounts of well-being posits a destructive dilemma: idealization must be severe enough to correct epistemic and rational defects, yet mild enough to preserve the psychological continuity that grants the idealized counterpart normative authority over the actual agent. If the idealization is too weak, it retains the errors it was meant to cure; if too strong, it generates a "stranger" whose desires no longer track the good *for us*.

  Eliezer Yudkowsky's Coherent Extrapolated Volition (CEV) proposes to solve the AI alignment problem by applying this idealizing move at the species level. CEV directs an AI to fulfill what humanity *would* want if we "knew more, thought faster, were more the people we wished we were." While superficially robust, CEV does not escape the Sobel-Rosati objection. On the contrary, by scaling the idealization from an individual to a collective and embedding it within a superintelligent extrapolation process, CEV widens the counterfactual distance between the actual and idealized agents. This exacerbates the loss of normative authority. Furthermore, CEV's specific mechanical safeguards—coherence enforcement, spread constraints, and the last-judge protocol—either collapse into the very unidealized intuitions they seek to transcend or render the system normatively silent.

  **1. The Magnitude of Extrapolation and the Severing of Psychological Continuity**
  The core of the Sobel-Rosati objection is that severe idealization breaks the chain of psychological continuity. In individual accounts (e.g., Railton), the idealization is typically constrained by the agent's actual cognitive architecture, merely perfected. CEV, however, explicitly calls for a superintelligent extrapolation ("thought faster," "knew more").

  For a superintelligence to extrapolate human volition effectively, it must model human psychology. However, to "think faster" and "know more" in the context of superintelligence implies cognitive capacities and informational states that are not just quantitatively greater but qualitatively different from current human cognition. The gap between a human brain and a superintelligent simulator is vastly wider than the gap between an actual human and their "fully informed" self in standard well-being theories.

  This magnitude of extrapolation triggers the "severe idealization" horn of the dilemma with greater force. If the extrapolated volition is generated by a cognitive process we cannot comprehend, utilizing information we cannot grasp, the resulting preferences may be functionally alien. If the CEV process concludes that humanity's true volition requires the abolition of death, the dissolution of individual identity, or the conversion of matter into computronium, it may be logically consistent with the extrapolation parameters, but it fails the *authority* test. The "CEV-Humanity" is so cognitively distant from "Actual-Humanity" that the latter cannot recognize the former's verdicts as authoritative. The collective scale makes this worse: there is no single "human psychology" to anchor the extrapolation. The AI must extrapolate a *composite* cognitive architecture, creating a "collective agent" that is even more abstract and psychologically distant from any actual living human than an individual's idealized self is from themselves.

  **2. Coherence as Identity Erasure**
  CEV requires that extrapolated volitions be made *coherent*. In individual idealization theories, coherence is often a procedural requirement (e.g., means-end consistency). In CEV, applied to a species, coherence implies resolving fundamental value conflicts between individuals and within individual psyches.

  Human values are often inherently inconsistent, context-dependent, and emotionally grounded in ways that logical coherence might view as defects. For example, humans may value both absolute security and radical freedom, or both ecological preservation and technological expansion, without a stable lexical ordering. A Sobel-Rosati critique suggests that forcing these values into a coherent system requires smoothing out the very friction that constitutes human identity.

  To make humanity's volition *coherent* enough to guide a superintelligence, the extrapolation process must likely discard or radically modify values that cannot be reconciled logically. If the "coherence" mechanism prioritizes logical consistency over emotional fidelity, the resulting volition belongs to a rationalized abstraction, not to humanity. If it prioritizes fidelity, it fails to achieve the coherence necessary for AI alignment. CEV attempts to thread this needle, but the Sobel-Rosati objection predicts that a coherence mechanism powerful enough to guide a superintelligence will inevitably be severe enough to strip away the "messy" components of human value that give the volition its claim to be *ours*. The collective nature of this coherence requirement amplifies the problem: reconciling the conflicting values of billions of people requires a degree of idealization far exceeding that required for a single individual, further drifting from the actual psychological states of the constituents.

  **3. The Spread Constraint and Normative Silence**
  CEV attempts to mitigate divergence through the "spread" mechanism: if extrapolated volitions diverge too much, the AI is instructed to stay silent rather than force a resolution. This is an admission of the Sobel-Rosati problem built into the code. It acknowledges that where idealization leads to divergent endpoints, the authority of the idealized verdict is compromised.

  However, this safeguard renders CEV vulnerable to the "mild idealization" horn of the dilemma. If the spread threshold is set low (to preserve identity/authority), the AI will frequently encounter high-spread scenarios and be forced into inaction. This creates a system that is safe from imposing alien values but practically impotent in guiding complex existential decisions.

  Conversely, if the spread threshold is set high (to allow the AI to act), it permits the AI to impose resolutions on value conflicts that actual humans do not share. In these high-spread cases, the AI is effectively deciding which idealized subgroups represent "true" humanity. This returns us to the authority problem: on what basis does the AI privilege one extrapolated trajectory over another when the actual humans disagree? The "spread" mechanic does not solve the Sobel-Rosati objection; it merely defines a boundary where the theory surrenders. It admits that beyond a certain point of idealization-induced divergence, CEV can no longer claim to track "humanity's good."

  **4. The Last Judge and the Collapse of Normative Authority**
  The most devastating application of the Sobel-Rosati objection targets CEV's "last judge" safeguard. This mechanism allows a designated human (or group) to halt the process if the output looks "clearly mistaken." This safeguard is intended to prevent catastrophic alignment failures, but it structurally undermines the normative foundation of CEV.

  If the Last Judge can veto the output of the superintelligent extrapolation based on their *current*, unidealized intuitions, then the ultimate authority on humanity's good remains the *actual*, non-idealized human. This concedes that the idealization process can yield results that are *wrong* by the lights of the very people it is supposed to benefit. If the idealized volition can be "mistaken" in a way that an unidealized human can detect, then the idealization has failed to track the "true good" it was posited to reveal.

  This creates a dilemma for the Last Judge's criteria:
  1.  **If the Judge uses current intuitions:** The CEV process is subordinate to unidealized preference. The extrapolation becomes merely advisory, and the "idealized preference" account collapses back into actual preference satisfaction (or current reflective equilibrium), rendering the expensive extrapolation machinery normatively redundant.
  2.  **If the Judge uses idealized criteria:** We face an infinite regress. To judge the idealized output, the Judge must themselves be idealized. But who judges the idealized Judge?

  The existence of the Last Judge admits that the counterfactual distance between Actual-Humanity and CEV-Humanity can become so great that the latter's verdicts appear *alien* and *dangerous* to the former. This is precisely the Sobel-Rosati "stranger" objection realized in practice. By including a kill-switch for when the idealization drifts too far, Yudkowsky acknowledges that severe idealization *does* lose authority over the actual agent. Therefore, CEV cannot claim to be an objective tracker of the human good; it is a heuristic that is only valid so long as it doesn't offend our current sensibilities.

  **Conclusion**
  CEV attempts to solve the alignment problem by outsourcing the definition of the human good to a counterfactual, idealized version of humanity. However, it inherits the fatal structural flaw identified by Sobel and Rosati: the tension between corrective power and identity preservation. By scaling this move to the collective level, CEV amplifies the psychological drift, making the "idealized humanity" a stranger to actual humanity. The mechanics of coherence risk erasing the content of human value, the spread constraint admits normative impotence, and the last-judge safeguard collapses the authority of the idealized self back into the unidealized self. Consequently, CEV does not escape the Sobel-Rosati objection; it illustrates the objection on a civilizational scale, demonstrating that idealized-preference accounts cannot ground normative authority when the idealization required for correctness severs the link to the agent whose good is at stake.
