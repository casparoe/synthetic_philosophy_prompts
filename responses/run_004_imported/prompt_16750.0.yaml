      *   *Point 4: The Last Judge is the Achilles Heel.* The Last Judge is a human (or human-like) entity. If they halt the process because it looks "mistaken," they are appealing to *current* unidealized intuitions. This admits that the idealized output can be wrong *by current lights*, undermining the authority of the idealization. If the Last Judge is also idealized, we have infinite regress.
      *   *Point 5: Collective Amplification.* The Sobel/Rosati problem is about *identity*. Aggregating millions of identity crises doesn't solve the identity crisis; it compounds it. The "collective agent" is even more abstract than the individual agent.

  5.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** State the thesis clearly. CEV is an idealized preference theory scaled up. The Sobel/Rosati dilemma applies with greater force due to the magnitude of cognitive enhancement and the complexity of collective coherence.
      *   **Section 1: The Extrapolation Gap (Severity vs. Identity).** Focus on "thought faster, knew more." For a superintelligence, this implies cognitive architectures incomprehensible to current humans. This triggers the "Severe Idealization" horn. The resulting entity is a "stranger."
      *   **Section 2: Coherence as Homogenization.** Human values are messy. To make them *coherent* across a species requires drastic modification. This triggers the "Identity Loss" aspect. The "Coherent" in CEV does the heavy lifting of idealization, potentially stripping away the content that makes the volition *ours*.
      *   **Section 3: The Spread Constraint and Normative Silence.** Sobel/Rosati asks "Whose good?" CEV answers "No one's" in cases of high spread. This avoids the identity problem by abandoning the guidance problem. It creates a "normative vacuum" where the AI cannot act, rendering the theory practically useless for alignment.
      *   **Section 4: The Last Judge and the Collapse of Authority.** This is the strongest point. The Last Judge relies on *current* intuitions to veto *idealized* outputs. This concedes that idealization can yield results that are *actually bad* by our current lights. This undermines the whole premise that idealization tracks the "true good." It reintroduces the unidealized self as the ultimate authority, making the extrapolation redundant.
      *   **Conclusion:** Summarize. CEV doesn't solve the dilemma; it hides it behind technical terms. The collective scale makes the psychological distance wider, not narrower.

  6.  **Refining and Polishing (Self-Correction during drafting):**
