  4.  **Brainstorming the Argument (Connecting Sobel/Rosati to CEV):**
      *   *Thesis:* CEV exacerbates the Sobel/Rosati dilemma because the scale of extrapolation required for superintelligence introduces a magnitude of psychological drift that severs the link between "Humanity" and "CEV-Humanity."
      *   *Point 1: The Magnitude of Extrapolation.* Individual idealization assumes a continuous psychological path. CEV assumes a superintelligent extrapolation. The gap between human cognitive architecture and "thought faster/knew more" (potentially post-human) is vast. This isn't just "wiser me"; it's "alien me."
      *   *Point 2: Coherence as Identity Erasure.* Human values are often inherently inconsistent or context-dependent. Forcing "coherence" at a species level might require smoothing out the very idiosyncrasies that constitute human identity. To make humanity's volition *coherent* might require changing humanity's volition so much it's no longer human.
