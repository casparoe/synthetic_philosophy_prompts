  3.  **Deconstruct CEV Mechanics:**
      *   *Extrapolation:* "If we knew more, thought faster, were more the people we wished we were." (Mirrors idealized preference).
      *   *Coherence:* Resolving conflicts, making preferences consistent.
      *   *Spread:* If volitions diverge too much, stay silent.
