answer: |-
  David Hume's economic essays, particularly *Of Money* and *Of Interest*, present a seemingly paradoxical account of the nature of currency. On one hand, he describes money as a "fiction," a mere convention or "representative sign" that possesses no intrinsic value distinct from the labor and commodities it commands. On the other hand, he insists that the quantity of money exerts profound, observable causal effects on the price level, the rate of interest, and the vigor of industry. To the modern reader, and indeed to Hume's mercantilist contemporaries, this raises a philosophical difficulty: How can something ontologically thin—a social agreement or "fiction"—exert ontologically thick causal powers in the material world?

  This essay argues that Hume's claims are entirely coherent within the framework of his broader empiricist philosophy. The coherence rests on Hume's specific definition of causation and his understanding of human psychology. For Hume, conventions possess causal powers not because they inhabit a metaphysical realm of their own, but because they operate through the machinery of human belief, passion, and coordinated action. Money is a social technology that channels human motivations; its "fictional" status does not negate its efficacy, but rather explains the mechanism of that efficacy.

  ### Money as Fiction and Convention

  To understand the tension, one must first clarify what Hume means when he calls money a "fiction." In *Of Money*, Hume argues against the mercantilist view that a nation's wealth consists in its stock of gold and silver. He writes, "Money is nothing but the representative of labour and commodities, and serves only as a method of rating them." He famously analogizes money to the "oil which renders the motion of the wheels of commerce more smooth and easy," implying it is a lubricant rather than the engine itself.

  When Hume labels money a convention or fiction, he is making an ontological claim about its value. A loaf of bread has intrinsic utility; it satisfies hunger regardless of social agreement. A gold coin, qua money, has no such utility. Its value is entirely relational and dependent on a collective agreement to accept it in exchange. If the convention collapses—if society ceases to believe the metal represents purchasing power—the money reverts to being merely a piece of metal. In this sense, money is "artificial" (in the Humean sense of *Of Justice*), existing only through human invention and consensus.

  ### The Causal Claims of the Quantity Theory

  Despite this demotion of money's ontological status, Hume vigorously defends the Quantity Theory of Money. He asserts that an increase in the money supply, ceteris paribus, leads to a proportional rise in prices. Furthermore, he argues for a short-run non-neutrality of money: an influx of new money stimulates industry and commerce *before* prices fully adjust. He observes that "the good policy of the magistrate consists only in keeping it [money], if possible, still increasing; because, by that means, he keeps alive a spirit of industry in the nation."

  Here lies the apparent contradiction. If money is merely a counter in a game we invented, how can adding more counters change the physical output of the nation (the "spirit of industry") or the physical prices of goods? If money is nothing but a shadow, how can it cast a weight?

  ### The Philosophical Bridge: Causation and Psychology

  The resolution to this tension lies in Hume's empiricist theory of causation and his moral psychology. In the *Treatise of Human Nature*, Hume dismantles the notion of causation as a necessary connection inherent in objects. Instead, causation is observed as a "constant conjunction" of events grounded in human expectation. For Hume, to say $A$ causes $B$ is to say that we observe $A$ regularly followed by $B$, and our minds form a habit of expecting $B$ upon seeing $A$.

  Therefore, the question of whether a convention can have "genuine causal powers" is not a question of whether the convention possesses metaphysical force, but whether the convention reliably produces changes in human behavior that result in material effects.

  **1. The Mechanism of Belief and Expectation**
  Hume's economic causality is mediated by psychology. Money functions as a convention because it triggers specific passions—primarily the desire for gain and the fear of loss. When the quantity of money increases, merchants and manufacturers find themselves with more cash. Because of the *convention* (the shared belief that this cash can be exchanged for labor and goods), this surplus triggers the passion of hope. They expand production, hire more workers, and invest.

  The causal power does not reside in the gold itself, but in the *human response* to the gold. Since human beliefs and passions are real psychological events with physical correlates (action, labor, production), the chain of causation is unbroken. The "fiction" is the *meaning* assigned to the metal, but the *belief* in that meaning is a real psychological fact. As Hume notes, "opinion" is the foundation of all government and social order; similarly, economic opinion (confidence in currency) is the foundation of economic activity.

  **2. Coordination and Institutional Facts**
  Hume anticipates what modern social ontology (e.g., John Searle) calls "institutional facts." A convention creates a status function: $X$ (paper/metal) counts as $Y$ (money) in context $C$ (the marketplace). This status grants the object "deontic powers"—rights, obligations, and abilities.

  When Hume says money is a fiction, he means it lacks *natural* value. When he says it has causal power, he refers to its *institutional* efficacy. A traffic light is merely a colored bulb (natural fact), but the convention that "red means stop" causes cars to halt (institutional causation). The stopping of the car is a physical reality caused by a social agreement. Hume recognizes that social conventions coordinate human action on a mass scale. Because humans are social creatures who rely on predictability, the convention of money reduces transaction costs and aligns expectations. This alignment allows for complex division of labor, which physically alters the material wealth of a nation. Thus, the convention causes material effects by organizing human labor.

  **3. The Short-Run Stimulus and the Veil of Money**
  Hume's most nuanced argument regarding causality is his distinction between the long-run and short-run effects of money. In the long run, money is a veil; prices adjust, and real output remains unchanged. In the short run, however, the "fiction" has not yet permeated all minds equally. When new money enters, some receive it before prices rise. These agents feel richer (a psychological state) and act more vigorously (a physical state).

  This demonstrates that the causal power of money is contingent on *ignorance* or *lag* in the convention's adjustment. If the convention were perfectly efficient (perfect information), the fiction would be instantly recognized as neutral. But because human understanding is imperfect, the *belief* in increased wealth (induced by the money supply) causes real exertion. Here, the "fiction" is causally potent precisely because it is not immediately recognized as a fiction by all participants.

  ### Addressing the Objection of Reductionism

  A critic might argue that if the causal power lies in human psychology, then money itself is causally inert, and Hume is merely describing psychological causation. To attribute causal power to the "convention" is a category mistake.

  However, this objection misunderstands Hume's naturalism. For Hume, social phenomena are part of nature. Human psychology is not separate from the social environment; it is shaped by it. The convention of money is an external structure that shapes internal passions. Just as a law (a linguistic convention) can cause a person to refrain from theft (a physical action), money (an economic convention) causes a merchant to ship goods. The convention is a necessary condition in the causal chain. Without the convention, the metal would not trigger the passion, and the labor would not occur. Therefore, the convention is a genuine cause in the Humean sense: it is an antecedent condition without which the effect would not follow.

  ### Conclusion

  Hume's dual characterization of money is not a contradiction but a sophisticated insight into social reality. He maintains that money is a "fiction" to deny it intrinsic value independent of human society, thereby refuting the mercantilist fetishization of bullion. Simultaneously, he affirms its causal power to explain the mechanics of trade, inflation, and industrial stimulation.

  These claims cohere because Hume locates the source of causal power not in the substance of the currency, but in the regularities of human nature. Conventions have genuine causal powers because humans are creatures of habit, belief, and passion who act upon the world based on shared meanings. Money is a tool that harnesses these psychological forces to coordinate material production. In Hume's empiricist framework, if a social construct reliably produces observable physical effects through the mechanism of human behavior, it possesses causal reality. Thus, money is ontologically dependent on the mind, yet causally effective in the material world—a distinction that allows Hume to be both a philosophical skeptic about value and a realist about economic dynamics.
