      *   Did I address Q. 46/Beginning of World? Yes.
      *   Did I address the Third Way? Yes.
      *   Is it a close reading? Yes.

  10. **Final Polish:** Check for clarity and flow. (The resulting output matches the detailed response provided previously.)
answer: |-
  You have stumbled upon one of the most significant and frequently misunderstood distinctions in medieval metaphysics. Your close reading is spot-on: Aquinas explicitly rejects the idea that reason can prove the universe had a temporal beginning (*Summa Theologica* I, Q. 46, Art. 2), and the passage you quoted is the technical machinery he uses to explain why an infinite past is compatible with a Creator.

  Most popular summaries of the "Cosmological Argument" conflate the *Kalam* (which requires a temporal start) with the *Thomistic* argument (which requires an ontological ground). Aquinas is not arguing against an infinite timeline; he is arguing against an infinite regress of *dependence*.

  Here is a close reading of what is doing the work in that text, broken down by your specific questions.

  ### 1. The Core Distinction: *Per Se* vs. *Accidental* Orders

  The confusion arises because in English, "cause" covers two very different metaphysical relationships. Aquinas distinguishes them as:

  **A. Essentially Ordered Causes (*Per Se*)**
  *   **The Structure:** Hierarchical and Simultaneous.
  *   **The Mechanism:** The secondary cause derives its power to act *from* the primary cause *at the very moment* it is acting. If the primary cause stops acting, the secondary cause immediately loses its causal power.
  *   **The Example:** Hand moves stick, stick moves stone.
  *   **Why it can't be infinite:** If every member of the chain is merely borrowing its causal power from the previous member, and there is no "owner" of that power at the top, then no power is actually being transmitted. It is like a train with infinite cars but no engine; the cars move only if pulled, so if there is no first puller, nothing moves.
  *   **Metaphysical implication:** This is about **ontological dependence**. The stick does not have the power to move the stone *in itself*; it is an instrument.

  **B. Accidentally Ordered Causes (*Per Accidens*)**
  *   **The Structure:** Linear and Temporal.
  *   **The Mechanism:** The cause acts, produces an effect, and then the effect (or the next cause) continues to exist and act even if the previous cause is removed or ceases to act. The later cause possesses the power to act *in itself*, having received it (perhaps) in the past, but not requiring the prior cause's *current* activity.
  *   **The Example:** Father generates son, son generates grandson.
  *   **Why it can be infinite:** The father's causal act is complete once the son is conceived. The son's ability to generate a grandson depends on the son's own nature as a human, not on the father's *current* activity. The father can be dead, and the son can still generate.
  *   **Metaphysical implication:** This is about **temporal succession**.

  **Why the Stick/Hand is not like the Father/Son:**
  In the stick/hand case, the stick is an *instrumental cause*. It has no agency. In the father/son case, the father is a *principal cause*. He generates "as a man," not "as a son." Once the son exists, he is a new principal cause. Aquinas writes: *"It is accidental to this particular man as generator to be generated by another man; for he generates as a man, and not as the son of another man."*

  The son's causal power is intrinsic to his nature (which he received in the past), whereas the stick's causal power is extrinsic and contingent on the hand's *current* motion.

  ### 2. The Hammer Example and Your Objection

  You asked: *"I don't see why that same move couldn't be made about the stick and the hand."*

  This is the crux of the text. Aquinas uses the hammer example to clarify what makes a series "accidental."

  > *"as an artificer acts by means of many hammers accidentally, because one after the other may be broken."*

  In this analogy, the **Artificer** is the principal cause. The **Hammers** are instrumental causes.
  *   **Why is the series of hammers accidental?** Because the Artificer's power is the constant. Hammer A breaks, Artificer picks up Hammer B. The causal power comes from the Artificer, not from Hammer A passing power to Hammer B. Hammer A does not cause Hammer B to act.
  *   **Why doesn't this apply to the Hand/Stick?** In the Hand/Stick example, the Hand *is* the Artificer (relative to the stick). The Stick is the Hammer. You cannot say the Hand is just another hammer in a chain unless there is a higher Agent moving the Hand.
  *   **The Crucial Difference:** In the Father/Son chain, every member is an "Artificer" (a principal agent). In the Hand/Stick chain, the lower members are "Hammers" (instruments).

  If you tried to treat the Hand as just another link in an accidental chain (like a hammer), you would have to say the Hand acts independently of whatever moves it. But Aquinas argues that for *motion* (change) to occur, there must be a mover currently applying power. A hand does not move a stick unless something (muscles/nerves/soul) is currently moving the hand. Thus, the hand/stick/stone forms a *per se* chain of *current* dependence.

  ### 3. Does this distinction save the Eternal Universe?

  **Yes.** This passage is doing the heavy lifting for Aquinas's position on the eternity of the world.

  Aquinas believes that God is the First Cause of the universe. However, he believes this relationship is a *per se* (essentially ordered) relationship, not an *accidental* (temporal) one.
  *   **God's Causality:** God sustains the universe in existence *at every moment*. If God withdrew his causal power, the universe would cease to exist instantly (like the stone stopping if the hand stops).
  *   **The Temporal Chain:** The chain of fathers and sons, or days and nights, is an *accidental* chain. It stretches through time.

  Because God's causality is *per se* (ontological sustenance), it does not matter how long the *accidental* chain (time/history) is.
  *   **Kalam Argument:** Assumes the First Cause must be the *first event* in time. Therefore, time must have a start.
  *   **Aquinas's Argument:** The First Cause must be the *ground of being* right now. Time could stretch back infinitely (accidental series), but at every single moment of that infinite past, the universe would still require a *per se* cause to exist at that moment.

  So, to answer your question: **This distinction is the actual reason Aquinas doesn't need the universe to have a beginning in time.** He thinks an infinite past is logically possible (though he believes on faith that the world *did* begin), because an infinite past is just an infinite *accidental* series, which he admits is possible in Reply to Objection 7. What is impossible is an infinite *per se* series.

  ### 4. The Argument from Contingency (The Third Way)

  You asked if the Third Way relies on the same machinery. **Yes, it does.**

  The Third Way is often misread as a temporal argument ("If everything is possible not to be, then at some time there was nothing"). If read that way, it succumbs to the same objection as the Kalam (why can't the series of contingent things go back forever?).

  However, a proper Thomistic reading of the Third Way relies on the *per se* distinction:
  *   **Contingent Being:** A being that does not have existence by its own nature; it receives existence from another.
  *   **The Problem:** If *everything* is contingent, then everything is borrowing its existence.
  *   **The *Per Se* Link:** Just like the stick borrows motion from the hand *now*, a contingent being borrows existence from a cause *now*.
  *   **The Conclusion:** You cannot have an infinite regress of things borrowing existence, because if no one *owns* existence (Necessary Being), there is nothing to lend it.

  The Third Way is essentially the *per se* causal argument applied to *existence* rather than *motion*. It argues that even if the universe is eternal (infinite accidental series of contingent beings), there must be a Necessary Being sustaining that series *per se* at every moment.

  ### Summary of the Mechanism

  To visualize what Aquinas is claiming in that passage:

  1.  **Vertical Causality (*Per Se*):** A hierarchy of dependence existing **now**.
      *   *Example:* God -> Universe -> Humans -> Actions.
      *   *Constraint:* Cannot be infinite. Must terminate in a Self-Subsistent Cause.
      *   *Relevance:* Proves God exists. Does **not** prove the universe had a start.

  2.  **Horizontal Causality (*Accidental*):** A sequence of events stretching **through time**.
      *   *Example:* Big Bang -> Stars -> Earth -> Ancestors -> You.
      *   *Constraint:* Can be infinite (logically speaking).
      *   *Relevance:* Aquinas says reason cannot determine if this chain is finite or infinite (that is an article of faith).

  When you read the *Summa*, keep this vertical/horizontal distinction in mind. The modern "Cosmological Argument" (Kalam) tries to prove God by closing the horizontal loop (no infinite past). Aquinas proves God by closing the vertical loop (no infinite dependence), leaving the horizontal loop theoretically open.

  Your confusion regarding the hammers was astute; it highlights that Aquinas is strict about **instrumental vs. principal** causality. The stick is a pure instrument. The father is a principal agent who was once an instrument of his own father but is now an agent in his own right. That shift from instrument to agent is what breaks the *per se* chain and turns it into an *accidental* one.
