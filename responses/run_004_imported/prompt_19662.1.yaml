  Critical-Level Utilitarianism edges out the Variable Value View primarily on grounds of parsimony and theoretical transparency. While the Variable Value View successfully smooths out the sharp cutoff inherent in Critical-Level theory—avoiding the implication that a microscopic difference in welfare determines whether a life adds or subtracts value—it does so by introducing a complex value function whose specific shape is itself arbitrary and difficult to justify independently. Critical-Level Utilitarianism accepts the counterintuitive "Negative Conclusion"—that adding lives with positive welfare can diminish overall value if they fall below a critical threshold—but this trade-off is the necessary price of avoiding the Sadistic Conclusion without collapsing into the Repugnant Conclusion. It remains the most robust "middle ground" axiology for longtermist planning, offering a clear decision procedure that respects the intuition that some lives are too low in quality to justify expansion, even if it cannot fully escape Arrhenius's impossibility results.
