answer: |-
  Here are nine interview questions designed to move past the "101" explanation of pragmatic encroachment and press the specific commitments of Subject-Sensitive Invariantism (SSI). They are ordered to build a narrative arc: starting with the theoretical landscape, moving through the hardest objections, and ending with the broader implications.

  Each question includes a "Likely Defense" summary to help you understand where she's coming from, and a "Follow-Up" designed to press that specific defense.

  ### 1. The Displacement Claim (SSI vs. Contextualism)
  **Question:** "A lot of listeners might hear 'Contextualism' and 'Subject-Sensitive Invariantism' and think they're just two ways of saying the same thing: that knowledge claims shift with stakes. But you've argued that SSI shouldn't just be a rival theory; it should *displace* Contextualism entirely. Contextualists say the *meaning* of 'knows' shifts with the speaker's context. You say the *state* of knowledge shifts with the subject's practical situation. Why is it crucial for your view that the context-sensitivity is located in the subject's world rather than in the semantics of our language? What does Contextualism fail to explain that SSI captures?"

  *   **Likely Defense:** She will likely argue that Contextualism explains why we *say* things, but not why we *act* the way we do. She'll claim that even if the word 'knows' stays the same, we wouldn't act on the belief in high-stakes scenarios, and SSI explains this action-guidance better.
  *   **Follow-Up:** "So you're grounding this in the norm of action: 'You shouldn't act on $p$ unless you know $p$.' But if the word 'knows' doesn't change meaning, aren't you just describing a change in *rationality* rather than a change in *knowledge*? Why reclassify a shift in rational action as a shift in knowledge itself, rather than just saying knowledge is stable but our permission to act on it varies?"

  ### 2. The Ignorance of Stakes (The Jessica Brown Objection)
  **Question:** "I want to press you on a case that came up in my own life recently. I was arguing with a surgeon friend about whether she 'knew' a diagnosis. If the patient is stable, she says she knows. If the patient is critical, she says she needs more tests. But Jessica Brown has posed a tricky variation: What if the stakes are objectively life-or-death, but the subject *has no idea*? Imagine a surgeon who thinks a procedure is routine, but unbeknownst to her, the patient has a rare condition that makes the stakes fatal. On your view, does she lose knowledge the moment the stakes rise, even if she's ignorant of that rise? If so, doesn't that make knowledge opaque to the knower in a way that seems psychologically impossible?"

  *   **Likely Defense:** She will likely bite the bullet and say stakes are objective. If the stakes are high, she doesn't know, regardless of her awareness. She might argue knowledge is a normative status, not a psychological one.
  *   **Follow-Up:** "If knowledge is a normative status that can vanish without the subject noticing, how is it supposed to guide them? If the surgeon *feels* she knows and acts accordingly, but your theory says she *doesn't* know, aren't we left with a concept of knowledge that the subject can't actually use to regulate their own inquiry?"

  ### 3. The Flickering Knowledge Objection
  **Question:** "One intuition that's hard to shake is the idea that evidence is what secures knowledge. If I have the same evidence at 2:00 PM as I did at 1:00 PM, it feels like my epistemic position should be identical. But on your view, if someone walks into the room at 2:00 PM and tells me, 'By the way, the stakes just doubled,' I might lose knowledge instantly without gaining a single new piece of evidence about the world. How do you respond to the charge that this makes knowledge 'flicker' in and out of existence based on practical facts that have nothing to do with the truth of the proposition?"

  *   **Likely Defense:** She will likely argue that knowledge isn't just about evidence; it's about the *sufficiency* of evidence for a purpose. If the purpose changes, the sufficiency changes. She may compare it to being "rich"—you can stop being rich without your bank account changing, if the cost of living rises.
  *   **Follow-Up:** "That 'rich' analogy is helpful, but 'rich' is explicitly relative to a standard. 'Knowing' feels factive—it feels like a relation to the truth. If my knowledge vanishes because the *cost of being wrong* went up, does that imply that knowledge is less about tracking truth and more about tracking safety for action? At what point does 'knowledge' just become a synonym for 'safe enough to bet on'?"

  ### 4. Moral Encroachment and the Principled Line
  **Question:** "This view has gained traction in social epistemology under the banner of 'moral encroachment.' The argument is that if the moral stakes of being wrong about a person are high—for example, relying on a statistical generalization about race—then you need more evidence to claim you 'know' it. Since you defend pragmatic encroachment based on practical stakes, are you committed to moral encroachment? If not, where do you draw the principled line between a 'practical' cost that encroaches on knowledge and a 'moral' cost that doesn't?"

  *   **Likely Defense:** She might argue that moral harms *are* practical costs (utility), so yes, it follows. Or, she might try to distinguish epistemic norms from moral norms to avoid radical skepticism about social knowledge.
  *   **Follow-Up:** "If moral harms count as practical costs, doesn't that lead to a kind of epistemic inequality? If the stakes for me to be wrong about you are higher than the stakes for you to be wrong about me, do we literally possess different amounts of knowledge about the same evidence? Does your view risk making knowledge dependent on the power dynamics between the knower and the subject?"

  ### 5. The Action-Knowledge Norm
  **Question:** "Your whole framework seems to rest on a specific bridge principle: that it is inappropriate to act on $p$ unless you know $p$. This is what allows stakes to travel from action back into knowledge. But consider low-stakes gambling. I might know the odds are against me, but it's still permissible to make a small bet. Do you really think knowledge is the *necessary* norm for all action? If we can permissibly act on mere belief or high probability in low-stakes cases, doesn't that sever the link you need to get pragmatic encroachment off the ground?"

  *   **Likely Defense:** She will likely refine the norm. She might say, "You can't act on $p$ as a *premise in practical reasoning* unless you know $p$," distinguishing between gambling and relying on a proposition to plan your life.
  *   **Follow-Up:** "That distinction seems to do a lot of heavy lifting. If I can't use $p$ in practical reasoning without knowing it, but I can still bet on it, aren't we just defining 'practical reasoning' as 'the stuff where stakes matter'? It feels like you're protecting the theory by defining the scope of the norm to match the cases where your theory works."

  ### 6. Experimental Philosophy and Folk Intuitions
  **Question:** "When Stanley and Hawthorne first proposed these Bank Cases, they relied heavily on our intuitions about what sounds right to say. But some experimental philosophers have run surveys suggesting that ordinary people *don't* actually shift their knowledge attributions based on stakes the way philosophers do. They often say the person knows in both high and low-stakes cases. If the folk intuitions that motivated this view aren't robust, does your argument stand on its own theoretical merits, or does it lose its primary motivation?"

  *   **Likely Defense:** She will likely dismiss X-Phi surveys as lacking nuance or context. She'll argue that philosophers have trained intuitions or that the survey questions didn't capture the practical pressure correctly.
  *   **Follow-Up:** "I get that surveys can be blunt instruments. But if the phenomenon you're describing isn't something the average person readily recognizes, doesn't that make SSI a revisionary project? Are you describing how we *use* 'knowledge,' or are you prescribing how we *should* use it to better align with rational action?"

  ### 7. The "Life is High Stakes" Skepticism
  **Question:** "Contextualists often claim their view helps us avoid skepticism: in everyday low-stakes contexts, we can truthfully say we know we have hands. But if knowledge depends on the subject's practical situation, and life is often high-stakes, doesn't your view invite skepticism back in? If I'm driving a car, the stakes are potentially life-or-death. Does that mean I rarely 'know' the road is clear? If pragmatic encroachment is true, are we actually much more ignorant than we think we are?"

  *   **Likely Defense:** She will likely argue that 'high stakes' is relative. Most daily activities are low-stakes enough that standard evidence suffices. She'll try to avoid radical skepticism.
  *   **Follow-Up:** "But 'relative' is doing a lot of work there. If the threshold for knowledge moves with stakes, and modern life is full of latent high-stakes risks (like driving or medical decisions), doesn't your view collapse into a form of skepticism where we only 'know' things when the consequences of being wrong are trivial? Is knowledge only secure when nothing matters?"

  ### 8. The Software/Deployment Analogy (Host's Background)
  **Question:** "I want to bring this to my world. In software, we have code that runs a hobby project versus code that runs a pacemaker. The tests might be identical, the pass rate might be identical. In the hobby case, we say 'we know it works.' In the pacemaker case, we say 'we need more verification.' On your view, is it accurate to say the engineers *know* the code works in the first case but *don't* in the second? Or is 'knows' just the wrong word for engineering reliability?"

  *   **Likely Defense:** She will likely embrace this. She'll say this is exactly what pragmatic encroachment predicts. The epistemic status changes because the cost of failure changes.
  *   **Follow-Up:** "If we accept that, it changes how we talk about risk. But it also suggests that 'knowledge' is a resource we consume. If I need *more* knowledge to deploy to production, and knowledge depends on stakes, do I need to generate *more evidence*? Or do I just need to lower the stakes? It sounds like your theory turns epistemology into a risk management protocol."

  ### 9. Truth-Tracking vs. Action-Readiness
  **Question:** "Here's my final worry. Traditionally, epistemology is about connecting the mind to the world—tracking the truth. Your view connects the mind to the *consequences* of being in the world. If I have to choose between a theory that says knowledge tracks truth and a theory that says knowledge tracks action-readiness, why should I keep the word 'knowledge' for the latter? What do we lose if we just call your view 'Actionable Certainty' and leave 'Knowledge' for the truth-tracking relation?"

  *   **Likely Defense:** She will argue that knowledge *just is* the norm of belief and action. Separating them creates a state (truth-tracking) that is useless for guidance. She'll claim SSI captures the *value* of knowledge better than invariantism.
  *   **Follow-Up:** "So the value of knowledge is its utility for navigation. But if two people have the same evidence and one is in high stakes and one is in low, and you say one knows and one doesn't, haven't you made knowledge extrinsic to the cognitive agent? It makes knowledge less about what's in my head and more about what's happening around me. Is that a cost you're willing to accept to save the action-guidance function?"
