prompt: |-
  I co-host a small, listener-supported podcast on the side -- normally about software and startup life, though a recurring "big questions" segment has slowly taken it over -- and it's usually my co-host, who did a philosophy MA before switching careers, who preps the harder interviews. She's traveling next week, so I've been handed the job of drafting questions myself, despite being a software engineer by training with no formal philosophy background; everything I know about this particular topic comes from a few weeks of fairly obsessive reading, set off by an argument with a friend who's a surgeon about whether she "really knows" a diagnosis is correct when nothing much rides on it versus when a patient's life depends on it. Our guest is a philosopher known for defending pragmatic encroachment on knowledge -- specifically the subject-sensitive invariantist version associated with people like Stanley and Hawthorne -- and, more provocatively, for arguing that this view should displace Keith DeRose-style contextualism outright as the explanation for why our intuitions about bank-type cases shift with the stakes, rather than merely sitting alongside it as a rival theory that happens to predict the same verdicts.

  I don't want an episode where she just restates "knowledge depends on practical stakes" for a general audience; I want questions that corner the specific position she holds. Could you draft eight to ten interview questions along those lines? I'd like at least one that pushes her to justify locating the context-sensitivity in the subject's practical situation rather than in the semantics of the word "knows," since that's the actual crux of her disagreement with contextualists; one that raises cases where a subject has no idea the stakes are high -- the kind of surgeon case Jessica Brown has used against this sort of view -- and asks how she avoids simply stipulating the result she needs; one on whether accepting pragmatic encroachment commits her to the moral-encroachment claims some people derive from the same reasoning, for instance about when it's permissible to rely on statistical generalizations involving race, and if not, what principled line she draws to block the extension; and one on the objection that her view lets a person's knowledge flicker in and out of existence the moment someone merely tells them the stakes just got higher, with no change whatsoever in their evidence. For each question, please add a short follow-up tuned to the answer she's most likely to give, since I'd rather anticipate her standard move than get outmaneuvered live.
