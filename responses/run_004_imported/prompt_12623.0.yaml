answer: |-
  Good morning. Thank you all for being here to honor Marlene.

  For those of you who knew my aunt, you know she was a woman who loved things that added up. She was a bookkeeper by trade, but a detective by nature. She spent her life balancing ledgers, making sure the columns matched, making sure the story the numbers told was the truth.

  In her last decade, Marlene found a new set of numbers to balance. She became fascinated by the logician Kurt Gödel. Now, Marlene wasn't a scientist. She was a woman who loved a good library rabbit hole. But she found something in Gödel's writing that settled her heart.

  She told me once, very clearly: "When I go, don't you dare put me in heaven with a harp. I don't want clouds. I want the truth."

  She knew that many of you find comfort in the traditional image of the afterlife. And I know that faith is a powerful anchor for this family. But Marlene's anchor was different. It was built on the idea of rationality.

  Her belief was this: The universe is not a chaotic place. It is built on order, on laws, on reason. She believed that for the universe to spend billions of years evolving a human mind—a mind capable of love, of learning, of understanding the stars—and then to simply extinguish it the moment it truly begins to understand... that would be a contradiction. It would be bad math. It would be irrational.

  She believed that a rational universe does not make mistakes. It does not build masterpieces just to break them.

  So, when we ask "Where is Marlene now?", the answer isn't that she is floating on a cloud. The answer is that she is exactly where a rational universe puts a thing of value: she is preserved. The consciousness that made her *her*—that wit, that curiosity, that stubborn love—cannot simply be deleted. That would violate the order of things.

  I know this sounds different than what we usually hear in a room like this. But I think, in the end, it meets in the same place. Whether you call it the resurrection of the soul or the continuity of consciousness, the hope is the same: Death is not a period. It is a comma.

  Marlene didn't want us to mourn her as if she were gone. She wanted us to recognize that the energy she put into this world doesn't vanish. It goes somewhere.

  So, we won't imagine her with a harp. Instead, I invite you to imagine her doing what she always did: figuring it out. She is exploring the next great mystery, finally seeing the full equation, balancing the final ledger.

  She is not lost. She is just beyond the horizon of our sight, consistent to the very end. And if the universe is as rational as she believed, then we will make sense of it, and we will see her again.

  Rest well, Aunt Marlene. The numbers balance.
