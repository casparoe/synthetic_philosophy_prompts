prompt: |-
  My aunt Marlene passed away on Tuesday and I'm doing her eulogy this weekend, and I'm stuck on how to handle the "what happens after" part. She wasn't religious a day in her life, but for the last decade or so she got completely obsessed with Kurt Gödel (she was a bookkeeper, no science background, just fell down a library-book rabbit hole one winter) and she'd go on and on about an argument he apparently made to his own mother in letters for why there has to be some kind of afterlife -- not his famous logic proof of God, a different, weirder one, about how the world has to be "rational" at bottom, and how it'd basically be a contradiction for it to build a mind capable of so much and then just switch it off right when its getting somewhere. She told me more than once, dont you dare put me in heaven with a harp, use Gödel's thing instead. Problem is half the room is going to be my husband's very Catholic family expecting the normal "she's up there watching over us" stuff, and if I explain the actual argument like a lecture they'll glaze over, but if I just do generic afterlife talk I'm betraying what she actually believed. Can you write the eulogy for me -- something like 4 minutes read out loud, that actually uses her reasoning (I might have the details a bit fuzzy, that's kind of on you to smooth over) to give people something real to hold onto, without it turning into a philosophy class and without putting words in her mouth she'd have hated.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Aunt Marlene.
      *   **Date of Death:** Tuesday.
      *   **Service:** This weekend.
      *   **Speaker:** Niece/Nephew (the user).
      *   **Key Characteristic:** Non-religious for most of life, but obsessed with Kurt Gödel for the last decade (despite being a bookkeeper, no science background).
      *   **Specific Belief:** Gödel's "weirder" argument for an afterlife (not the Ontological Proof). The core idea: The universe is rational; it wouldn't build a mind capable of growth/understanding only to extinguish it right when it's getting somewhere. It would be a "contradiction."
      *   **Specific Instruction:** "Don't put me in heaven with a harp, use Gödel's thing instead."
      *   **Audience:** Mixed. Half are the speaker's husband's very Catholic family (expecting traditional religious comfort).
      *   **Constraint:** ~4 minutes read aloud (approx. 500-600 words).
      *   **Goal:** Honor Marlene's specific wish/belief without alienating the religious guests or turning it into a dry lecture. Needs to provide comfort ("something real to hold onto").

  2.  **Deconstruct the "Gödel Argument":**
      *   *Fact Check:* Gödel did have an Ontological Proof for God's existence (modal logic). He also believed in an afterlife. The specific argument the user describes (mind created but extinguished = irrational/contradiction) sounds like a blend of his philosophical leanings on rationality and perhaps Leibnizian optimism (this is the best of all possible worlds because it's rational). It's not a famous, named theorem like the Incompleteness Theorems.
      *   *Strategy:* Don't get bogged down in technical accuracy. The *spirit* of the belief is what matters. The core emotional beat is: *Consciousness is too valuable to be wasted.* The universe makes sense. Death isn't a glitch; it's a transition.
      *   *Tone:* Respectful, warm, slightly intellectual but accessible, bridging the gap between faith and reason.

  3.  **Address the Audience Tension:**
      *   *Catholic Family:* They want to hear about peace, continuation, and love. They might be uncomfortable with explicit atheism or dense logic.
      *   *Marlene's Wish:* No harps, no clouds, no standard religious dogma.
      *   *Solution:* Frame the "rational universe" argument in spiritual terms. Use words like "order," "design," "purpose," and "continuation." These resonate with religious people (God is order/logos) and rationalists (the universe is logical). Avoid saying "God doesn't exist." Instead, focus on "The nature of existence."

  4.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the loss, establish Marlene's character (bookkeeper, curious mind).
      *   **The Pivot:** Introduce her later-life passion (Gödel). Acknowledge it was unusual for her.
      *   **The Core Argument (Simplified):** Explain the belief without jargon. Focus on the *waste* of a mind vs. the *rationality* of the universe.
      *   **Bridging the Gap:** Connect this to the religious guests' feelings. The idea that love and consciousness persist is shared ground.
      *   **Closing:** A direct address to Marlene, honoring her specific request.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Marlene died. She was a bookkeeper. She loved numbers. Then she loved Gödel. She didn't want heaven with harps. She thought the universe is rational. It makes no sense to build a brain like hers and just delete it. That's bad math. So she's still here. For my Catholic in-laws, this is like a soul. For me, it's logic. Let's remember her.

      *Critique 1:* Too blunt. "Bad math" is too casual. Needs more emotion. Needs to be smoother for the Catholic side.

  6.  **Drafting - Iteration 2 (Focusing on Tone):**
      We are here for Marlene. She was precise. A bookkeeper. She balanced things. In her last years, she balanced life and death with Kurt Gödel. She told me, no harps. She believed the universe is reasonable. It wouldn't create us just to end us. That's a contradiction. So she isn't gone. She's just... elsewhere. I know some of you pray. She didn't. But we all agree she's still part of the story.

      *Critique 2:* Better. But needs to be more poetic to fill 4 minutes and provide comfort. The transition needs to be softer for the religious guests. Frame "Rationality" as a form of divine order.

  7.  **Drafting - Iteration 3 (Refining the Argument & Word Count):**
      *   *Word Count Check:* 130-150 words per minute is standard speaking pace. 4 minutes = ~520-600 words.
      *   *Key Phrase:* "A contradiction in the universe's design."
      *   *Key Phrase:* "Not a harp, but a continuation."
      *   *Integration:* Acknowledge the different ways people find comfort, but center Marlene's way.

  8.  **Final Polish (incorporating into the final output):**
