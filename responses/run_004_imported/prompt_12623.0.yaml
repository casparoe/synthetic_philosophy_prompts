      *   Comfort the room: Whether you call it heaven or continuity, she is present.
      *   End with her specific instruction.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm debating the Catholics. I need to validate their grief while honoring her. Use the word "faith" carefully. For her, faith was in reason. For them, faith is in God. Both lead to "she isn't gone."

