answer: |-
  This is a sharp observation, and it cuts to the heart of a methodological worry that often plagues contemporary analytic epistemology. You are applying a "rationalist" hygiene check: if two theories make identical predictions across all observable inputs (intuition pumps/cases), are they genuinely distinct hypotheses, or just notational variants?

  However, while Epistemic Contextualism (EC) and Pragmatic Encroachment/Subject-Sensitive Invariantism (PE/SSI) are famously designed to explain the *same* data (the Bank Case intuitions), the claim that they **never** disagree on a verdict is incorrect. They diverge significantly when the **subject's stakes** and the **attributor's stakes** come apart.

  Here is the principled case for why this is a substantive disagreement, not a merely verbal one.

  ### 1. The Divergence Case: Whose Stakes Matter?
  The most direct refutation of the "same verdict" claim lies in cases where the practical situation of the subject (S) and the conversational context of the attributor (A) are mismatched.

  *   **The Setup:** Hannah (Subject) has low stakes. She deposits a check on Friday; if it's not there until Monday, nothing bad happens. She has standard evidence (was there two weeks ago).
      *   *Attributor Context:* You (Attributor) are in a high-stakes context regarding Hannah's knowledge. Perhaps you are betting a large sum on whether Hannah *knows* the bank is open, or you are writing a legal brief where the definition of her knowledge carries heavy liability.
  *   **Pragmatic Encroachment (PE/SSI):** Knowledge depends on the **subject's** practical environment. Since Hannah's stakes are low, she **knows** the bank is open. Your high stakes are irrelevant to her epistemic position.
      *   *Verdict:* "Hannah knows" is **True**.
  *   **Epistemic Contextualism (EC):** Knowledge attributions depend on the **attributor's** conversational context. Since you are in a high-stakes context, the standard for "knows" is raised in your mouth.
      *   *Verdict:* "Hannah knows" is **False** (when uttered by you).

  In this specific configuration, the theories hand down **opposite truth values** for the same proposition. This is not a verbal dispute; it is a disagreement about which worldly facts (subject's practical situation vs. attributor's conversational standards) determine the truth conditions of the sentence.

  ### 2. Salience of Error vs. Practical Stakes
  Even if we hold the attributor constant, the *mechanism* for raising the standard differs, leading to divergent verdicts in skeptical vs. practical cases.

  *   **Contextualism** is often driven by the **salience of error possibilities**. If a skeptic mentions the possibility that the bank changed its hours, the standard rises, regardless of how much money is actually at stake.
  *   **Pragmatic Encroachment** is driven specifically by the **cost of being wrong**.

  **The Divergence:** Imagine a case where the cost of being wrong is zero (pure curiosity), but the possibility of error is made highly salient (a philosophical discussion about brain-in-a-vat scenarios).
  *   **PE/SSI:** Likely maintains that the subject **knows**, because the practical stakes are negligible. Practical encroachment requires practical stakes.
  *   **EC:** Likely maintains that the subject **does not know**, because the conversational context has made error possibilities salient, raising the epistemic standard regardless of practical utility.

  ### 3. Semantic Structure and Logic (The "Verbal" Aspect)
  You asked if they are just "two vocabularies for redescribing the same underlying phenomenon." Even if they agreed on all truth values (which they don't), they would still be rival accounts because they posit different **semantic structures**. This matters for how we handle disagreement, retraction, and embedding.

  *   **EC (Indexicality):** Treats "knows" like "tall" or "here."
      *   *Implication:* If I say "Hannah knows" (low stakes) and you say "Hannah doesn't know" (high stakes), we are **both right**. We are disagreeing only verbally.
  *   **PE/SSI (Invariantism):** Treats "knows" as having a fixed content, but one sensitive to subject facts.
      *   *Implication:* If I say "Hannah knows" and you say "Hannah doesn't know," one of us is **objectively wrong**.

  This leads to different predictions about **retraction**. If I move from a low-stakes to a high-stakes context:
  *   **EC:** I should not retract my earlier claim. It was true *then* (in the low-standards context).
  *   **PE/SSI:** I might be forced to retract. If the stakes were actually high *then* (even if I didn't realize it), my claim was false. Or, if stakes changed, the fact of the matter changed.

  These are testable linguistic predictions. If experimental philosophy shows that people feel compelled to retract earlier knowledge claims when stakes rise, EC is disfavored relative to certain forms of PE (or vice versa, depending on the nuance of the retraction).

  ### 4. Theoretical Virtues and Integration
  Finally, the choice between them is governed by how well they integrate with neighboring domains of theory.

  *   **Integration with Action:** PE/SSI integrates tightly with the **Knowledge Norm of Action** (You should act on *p* only if you know *p*). It explains why you shouldn't act on Hannah's belief in high-stakes cases: because she *doesn't know*. EC struggles here; it must say Hannah *does* know (in her context), but you can't act on it. This requires decoupling knowledge from action in a way some find ad hoc.
  *   **Integration with Skepticism:** EC is generally better equipped to handle **radical skepticism**. It explains why "I know I have hands" feels false in a philosophy seminar (high standards) but true in everyday life (low standards) without conceding that we never know anything. PE/SSI struggles to explain why merely *mentioning* skeptical scenarios (without practical stakes) seems to undermine knowledge claims.

  ### Conclusion
  Your suspicion is healthy, but in this specific instance, the dispute is **substantive**.

  1.  **Extensionally:** They diverge when attributor stakes and subject stakes come apart.
  2.  **Intensionally:** They disagree on whether "knows" is indexical (EC) or invariant but fact-sensitive (PE).
  3.  **Normatively:** They offer different explanations for the link between knowledge and rational action.

  Treating them as rival accounts is justified because they are competing hypotheses about the **metaphysical and semantic determinants** of knowledge, not just competing labels for the same intuition set. The fact that they converge on the standard Bank Case is a feature of how the case was constructed (Subject and Attributor stakes usually rise together in the examples), not proof of equivalence.

  If you treat them as merely verbal, you lose the ability to predict verdicts in **cross-contextual cases**, which is where the actual philosophical work gets done.
