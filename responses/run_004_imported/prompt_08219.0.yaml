      *   *Check:* Did I make Elena too foundationalist? *Correction:* Ensure she admits hinges aren't proven by evidence. Her point is about *warrant* or *entitlement*, not empirical proof.
      *   *Check:* Are they listening? *Correction:* Make sure they reference specific phrases the other just used. (e.g., "You said 'parasitic'...", "You mentioned 'warrant'...").

  6.  **Polishing the Dialogue:**
