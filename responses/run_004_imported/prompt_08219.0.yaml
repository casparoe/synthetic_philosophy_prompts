  *(Self-Correction Note during drafting the ending)*: I need to make sure I don't let Elena win by saying "Science is just better." That's the pop version. She needs to argue why science is *entitled* to its hinges. Marcus needs to argue why calling it "entitlement" might be the wrong move. The tension must remain.

  8.  **Final Polish:** Check the flow and voice. Elena should sound precise, slightly anxious about norms. Marcus should sound calmer, more descriptive, wary of over-reaching.

