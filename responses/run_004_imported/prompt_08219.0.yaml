          *   *Marcus:* Concedes the danger of the *pop* version but argues the *real* Quietist view isn't about psychology. It's about grammar.
          *   *Concession:* Elena admits psychology isn't the whole story; Marcus admits the pop version *is* dangerous.

      *   **Round 2: Entitlement vs. Action.**
          *   *Elena:* Argues for "Entitlement." We have a right to trust senses because it's necessary for cognitive projects. We don't have a right to trust QAnon.
          *   *Marcus:* Pushes back. "Entitlement" sounds like a hidden justification. Wittgenstein said it's groundless. If you have to justify the hinge, it's not a hinge.
          *   *Concession:* Elena admits hinges aren't *evidentially* justified. Marcus admits some hinges function better for shared life.

      *   **Round 3: The "Vaccine" Hinge.**
          *   *Elena:* Specific example. "Vaccines cause autism" isn't a hinge; it's a claim *within* the game. It's falsifiable.
          *   *Marcus:* But for the believer, it *acts* like a hinge. They won't budge. If we define hinges by function, it qualifies. If we define by content, we're begging the question.
          *   *Concession:* Elena admits function matters. Marcus admits that some "hinges" destroy the game itself (solipsism/death).

      *   **Round 4: Resolution (or lack thereof).**
