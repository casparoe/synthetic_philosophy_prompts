      *   Ensure Aris's argument aligns with Chalmers' meta-problem: explaining the behavior of claiming consciousness is mysterious.
      *   Avoid the twist: Don't reveal Kael is lying or secretly feeling. Keep it ambiguous.

  7.  **Writing - Focus on Voice and Pacing:**
