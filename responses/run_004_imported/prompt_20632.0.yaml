prompt: |-
  My dissertation advisor is retiring after thirty years spent defending David Lewis's account of convention -- that a convention is an arbitrary regularity in behavior which persists on nothing more than common knowledge and mutual expectation, requiring neither explicit agreement nor outside enforcement -- against critics, in the tradition of Margaret Gilbert, who argue this leaves no room for real obligation: on Lewis's picture, breaking a convention should be a mere surprise, though in practice it often feels like a wrong. I'm giving the toast at her retirement dinner, where roughly half the room works in philosophy or game theory and will catch every technical reference, and the rest is family, who would not know a coordination equilibrium from a Schelling point. Write a five-minute toast built around one substantial joke that turns on the fact that this very dinner -- the toasts, the raised glasses, the order of speakers -- is itself a Lewis-style convention, arbitrary in its particulars yet now something we would all feel faintly betrayed to see dropped. The joke should reward the specialists without turning the toast into a seminar, and the speech as a whole should land, for everyone else, as affection rather than argument.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Occasion:** Retirement dinner for a dissertation advisor.
      *   **Honoree's Career:** 30 years defending David Lewis's account of convention against critics (like Margaret Gilbert).
      *   **Key Philosophical Conflict:** Lewis (convention = arbitrary regularity, common knowledge, mutual expectation, no real obligation) vs. Gilbert (convention implies joint commitment/obligation; breaking it feels like a *wrong*, not just a surprise).
      *   **Audience:** Mixed. 50% philosophy/game theory experts (will catch technical refs), 50% family/laypeople (won't know technical terms).
      *   **Constraint:** 5-minute toast (approx. 600-800 words spoken at a moderate pace).
      *   **Core Mechanism:** One substantial joke built around the fact that *this dinner itself* is a Lewis-style convention.
      *   **Tone:** Affectionate, not argumentative. Reward specialists without alienating generalists.

  2.  **Deconstruct the Philosophical Concepts (for the joke):**
      *   *Lewis:* We do X because we expect others to do X, and we prefer to coordinate. If someone stops doing X, it's just unexpected/suboptimal. No moral sting.
      *   *Gilbert:* We do X because we are *committed* to doing it together. If someone stops, they violate a norm. There is a moral sting.
      *   *The Dinner:* Toasts, raising glasses, clinking, specific order of speakers.
      *   *The Twist:* If Lewis is right, me giving this toast is just a coordination equilibrium. If I stopped mid-sentence, you'd just be surprised. But if I stop, you'll feel I've *wronged* you. Therefore, the dinner proves Gilbert right and my advisor wrong. (But I need to land this affectionately, not as a takedown).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Welcome everyone, acknowledge the honoree (let's call her "Professor [Name]" or just "my advisor" for the draft, but I should leave a placeholder). Acknowledge the mixed crowd.
      *   **Setting the Stage:** Briefly explain what she did without jargon. She spent 30 years arguing about how we agree on things without actually saying "I agree."
      *   **The Setup (The Lewis View):** Explain Lewis simply. We drive on the right not because of a law, but because we expect others to.
      *   **The Turn (The Dinner as Convention):** Look around the room. The glasses, the toast, the speech. This is a convention.
      *   **The Joke/Punchline:** Apply the Lewis vs. Gilbert test to the speech itself. If Lewis is right, I can stop whenever. If Gilbert is right, I *must* finish.
      *   **The Resolution:** Acknowledge that while the theory is debated, the *feeling* of obligation we have to her is real (bridging the gap).
      *   **Closing:** Raise a glass.

  4.  **Refining the Joke (The Core Challenge):**
      *   *Idea:* I need to threaten to break the convention to prove a point, but not actually be rude.
      *   *Drafting the bit:* "According to Lewis, if I put this glass down now, you're just surprised. But if I do, you'll be angry. So is this dinner a Lewis convention or a Gilbert obligation?"
      *   *Making it work for both audiences:* For the family, it's about etiquette. For the philosophers, it's about *normativity*.
      *   *The "Betrayal":* The prompt asks for the feeling of betrayal if the convention is dropped.
      *   *Refinement:* I will explicitly frame the toast structure as a coordination equilibrium. Then I will pause and suggest testing the theory. Then I will conclude that the *affection* creates the obligation, saving the Lewisian framework (or gently teasing it).
      *   *Better angle:* The joke is that *this specific toast* is the ultimate test case. If I follow the script, I confirm her life's work (we are coordinating). If I break it, I confirm the critics (it feels like a wrong). But since I love her, I won't break it.
      *   *Wait, the prompt says:* "built around one substantial joke that turns on the fact that this very dinner... is itself a Lewis-style convention."
      *   *Okay, let's sharpen:* The joke is that by gathering here to celebrate her theory of conventions, we are enacting a convention that *feels* obligatory, thereby potentially falsifying her theory in the very act of honoring it.
      *   *Execution:* I need to walk the line. I don't want to say "You were wrong." I want to say "Your work made us think about this, and even here, we can't escape it."

  5.  **Drafting - Voice and Tone:**
      *   Warm, respectful, slightly witty.
      *   Avoid heavy jargon ("coordination equilibrium," "common knowledge") without immediate translation.
      *   Ensure the family feels included in the "inside joke."

  6.  **Writing - Step-by-Step (Mental or Scratchpad):**
      *   *Intro:* Good evening. For those who don't know, [Advisor] studied how we know what to do without being told.
      *   *Lewis explanation:* Driving on the right side of the road.
      *   *The Conflict:* Some say that's just habit. Others say it's a promise.
      *   *The Dinner:* Look at this room. We are all holding glasses. We expect a speech.
      *   *The Joke:* If Lewis is right, I can stop now. You'd just be surprised. But you'd be mad. So is [Advisor] wrong?
      *   *The Save:* No, because our shared love creates the "common knowledge" that makes the obligation real.
      *   *Toast:* To [Advisor].

  7.  **Polishing and Timing:**
      *   Check word count. 5 minutes is roughly 750 words.
      *   Ensure the technical terms are contextualized.
      *   Make sure the emotional landing is soft. The philosophy is the vehicle, the affection is the destination.

  8.  **Final Review against constraints:**
      *   5 minutes? Yes.
      *   Mixed audience? Yes, explanations included.
      *   One substantial joke? Yes, the "testing the theory mid-speech" bit.
      *   Lewis vs. Gilbert accuracy? Yes (arbitrary regularity vs. obligation).
      *   Affectionate? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't get *too* technical. Instead of saying "normative force," say "feels like a wrong." Instead of "coordination equilibrium," say "unspoken agreement." I'll keep the technical terms but define them immediately for the family.

      *(Refining the Joke)*: The joke should be that I am *tempted* to break the convention to test her theory, but the social pressure (the Gilbertian obligation) stops me. This highlights the tension perfectly.

      *(Final Polish)*: Ensure the transition from the joke to the sincere tribute is smooth. The "obligation" we feel isn't burdensome; it's born of respect.

  9.  **Final Output Generation** (Proceeding to write the toast based on these thoughts).
answer: |-
  Good evening, everyone. For those of you I haven't met yet, I'm [Your Name]. I had the privilege of being [Advisor's Name]'s student, and for the last thirty years, she has been the world's most tenacious defender of a very specific idea about how human beings get along.

  For the philosophers in the room, you know the landscape. For the family and friends: [Advisor's Name] spent her career studying the work of David Lewis. Lewis argued that a "convention" is something we all do simply because we expect everyone else to do it. Think of driving on the right side of the road. There is no law of physics forcing us to do it. We just do it because we know you do it, and you do it because you know I do it. Lewis argued that this expectation is enough. He said we don't need a promise, and we don't need a moral obligation. If I suddenly started driving on the left, you wouldn't think I'd *wronged* you. You'd just think I was surprising, and perhaps dangerous.

  However, there is a rival school of thought, led by philosophers like Margaret Gilbert, who argue that Lewis missed something crucial. They say conventions *do* carry an obligation. If we have a convention, and you break it, it doesn't just feel like a surprise; it feels like a betrayal. It feels like you've broken a promise you never actually made.

  [Advisor's Name] has spent three decades arguing that Lewis was right. That we can coordinate our lives without the heavy weight of moral obligation.

  And looking around this room tonight, I realized we are the perfect test case.

  Think about what is happening right now. We are at a retirement dinner. There is a head table. There is a microphone. And there is me, standing here, holding a glass. By the unspoken rules of this specific convention, I am supposed to say nice things for about five minutes, and then you are all supposed to lift your glasses and drink.

  According to [Advisor's Name]'s mentor, David Lewis, this is just an arbitrary regularity. We are coordinating. I speak, you listen, we drink. If I were to stop talking right now, put the microphone down, and walk away...

  *[Pause for three uncomfortable seconds. Do not smile.]*

  ...Lewis would say you should merely be surprised. You should think, "Oh, how unexpected. The coordination equilibrium has collapsed."

  But I know that isn't true. If I had done that, you wouldn't just be surprised. You'd be annoyed. You'd feel I'd been rude. You'd feel I owed you the end of the speech.

  *[Smile warmly.]*

  So, in the very act of celebrating her life's work, this dinner seems to be proving her critics right. We are gathered here to honor the theory that says there is no obligation in convention, yet we feel a very real obligation to see this toast through to the end.

  But here is the twist, and why I think [Advisor's Name] would actually win this round.

  Lewis said conventions rest on "common knowledge." We know what we are doing, and we know that we know. Tonight, the common knowledge isn't just about etiquette. It's about *her*. We are all here because we know what she means to us. We know she mentored us, supported us, and challenged us. That shared knowledge creates a expectation so strong, it *becomes* an obligation. Not a burdensome one, but a willing one.

  I am not finishing this toast because I am forced to. I am finishing it because we all prefer to coordinate on this moment of gratitude. We want to be on the same side of the road.

  So, to honor thirty years of clarifying how we understand one another, I ask you to join me. Not because you have to, but because we all know we want to.

  Please raise your glasses.

  To [Advisor's Name]. Thank you for showing us that even without a contract, we can still keep our promises to each other. Cheers.
