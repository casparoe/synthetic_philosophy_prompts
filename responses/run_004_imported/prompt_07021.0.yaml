prompt: |-
  I'm about a third of the way into a generation-ship novel, and one of my favorite threads is how the descendants of the original crew end up with all these little unwritten rules that nobody ever voted on — which side of the main corridor you walk down, how you queue outside the hydroponics bay, who gets to speak first at the monthly assembly. My editor pointed me toward David Lewis's old book on convention as research (I was a lit major, so game theory is not exactly home turf for me), and it's honestly been great for showing how a rule like that can just solidify out of repeated coincidence and everyone expecting everyone else to keep doing it, rather then some founding committee sitting down and deciding it on day one.

  Here's where I've talked myself into a corner, though. Lewis is pretty insistent that a convention is arbitrary — some other regularity, like walking on the left instead of the right, would've worked exactly as well. Which seems to mean that since nobody on my ship actually has a real stake in a custom being one particular way rather than another, switching it should be pretty painless the second somebody points out the alternative works just as fine — there's no vested interest to overcome, just habit. I'd originally written a subplot where a young reformer has to fight a whole political battle to get one of these customs changed, but now I'm wondering if I should cut that and just have her point out the arbitrariness and let the ship adopt the new rule within a scene or two, since that's presumably what the theory predicts. Does that track, or is there some reason arbitrary conventions might actually be hard to shift even when literally nobody disagrees that the new one is just as good?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Context:** The user is writing a generation-ship novel.
      *   **Theme:** Unwritten rules/conventions among descendants (walking sides, queuing, speaking order).
      *   **Research:** They've been reading David Lewis's *Convention: A Philosophical Study* (1969).
      *   **Insight:** Lewis argues conventions are *arbitrary* regularities sustained by mutual expectations.
      *   **Conflict:** The user originally wrote a political battle to change a convention. Now, based on Lewis, they worry this is unrealistic. If conventions are arbitrary and have no vested interest, shouldn't changing them be easy/painless?
      *   **Question:** Does Lewis's theory actually imply conventions are easy to change? Or are there reasons arbitrary conventions might be hard to shift even if everyone agrees the alternative is equally good?

  2.  **Evaluate David Lewis's Theory of Convention:**
      *   *Core Definition:* A convention is a regularity in behavior, common knowledge, arbitrary (another regularity could have existed), and sustained by a system of preferences (I prefer to do X if you do X, you prefer to do X if I do X). This is a coordination equilibrium.
      *   *Arbitrariness:* Yes, Lewis insists the *content* is arbitrary (left vs. right).
      *   *Stability:* Lewis emphasizes *common knowledge* and *expectations*. The stability comes from the fact that everyone *expects* everyone else to do it.
      *   *Change:* Lewis doesn't explicitly say change is *easy*. He says the *reason* for adherence is coordination, not intrinsic value. However, the *cost* of switching is the coordination failure during the transition.

  3.  **Identify the Flaw in the User's Interpretation:**
      *   The user thinks: "Arbitrary = No stakes = Easy to change."
      *   The reality (Game Theory/Sociology): "Arbitrary = Coordination Problem = Hard to change due to transition costs."
      *   *The "Focal Point" Problem:* Even if Left and Right are equal, being *mismatched* is bad. If half the ship switches and half doesn't, collisions happen.
      *   *Common Knowledge:* To switch, everyone needs to know that everyone knows that everyone is switching. Without a central authority (which generation ships often lack or have complex hierarchies for), achieving this common knowledge is hard.
      *   *Path Dependence:* Once a convention is entrenched, the cost of retraining habits is real, even if the rule itself is arbitrary.

  4.  **Brainstorm Reasons Why Arbitrary Conventions are Hard to Change:**
      *   **Coordination Risk:** The transition period is dangerous. If 90% switch but 10% don't (elders, isolated groups), accidents occur.
      *   **Signaling/Belonging:** Following the rule signals "I am part of the community." Breaking it (even to change it) signals "I am an outsider/rebel."
      *   **Hidden Stakes:** Sometimes what looks arbitrary isn't. (e.g., Speaking order might favor certain families subtly).
      *   **Cognitive Load:** Habits are automatic. Conscious effort is required to break them. On a ship, stress/fatigue makes people revert to habit.
      *   **Lack of Common Knowledge:** How do you tell *everyone*? If the comms system is old, or trust is low, the "new agreement" might not propagate.
      *   **Superstition/Ritualization:** Over generations, an arbitrary rule might gain mythological significance ("The Founder walked on the Right, so we must too").

  5.  **Formulate the Advice:**
      *   **Validate the Research:** Acknowledge Lewis is a great source.
      *   **Correct the Interpretation:** Lewis's "arbitrariness" refers to the *origin* and *intrinsic value*, not the *cost of switching*.
      *   **Key Concept: Coordination Equilibrium:** Explain that the value isn't in Left vs. Right, it's in *Matching*.
      *   **The Transition Cost:** The battle isn't about the rule's merit; it's about the risk of the switch.
      *   **Narrative Opportunities:** How to make the conflict dramatic without inventing fake vested interests.
          *   The "Transition Period" danger.
          *   The "Trust" issue (Who says we're all switching?).
          *   The "Ritual Creep" (It stopped being arbitrary 100 years ago).
      *   **Recommendation:** Keep the political battle, but reframe *why* they are fighting. It's not about Left vs. Right; it's about Safety vs. Change, or Trust vs. Skepticism.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Encouraging, intellectually rigorous but accessible (user is a lit major, not game theorist), specific to their sci-fi context.
      *   *Structure:*
          1.  Direct Answer: No, don't cut the conflict. Your interpretation of Lewis is slightly off regarding *stability*.
          2.  Explain Lewis's "Arbitrariness" vs. "Stability."
          3.  Game Theory concept: Coordination Problems & Schelling Points.
          4.  Sociological angle: Ritualization over time.
          5.  Plot suggestions based on this.
      *   *Refinement on Lewis:* Lewis focuses on *common knowledge*. If I don't know *you* know we're switching, I won't switch. This creates a barrier.
      *   *Refinement on Generation Ship:* Isolation, limited resources, high stakes for accidents (hull breach, oxygen, etc.). A corridor collision might be minor on Earth, but on a ship, it could mean dropping a tool into machinery. Raise the stakes of coordination failure.

  7.  **Final Polish:** Ensure I mention Thomas Schelling (often paired with Lewis on this) and the concept of "path dependence." Make sure the user feels confident keeping their subplot. (Self-Correction: Don't get too bogged down in math. Keep it literary/thematic.)

