answer: |-
  Do not cut that subplot. In fact, your editor sent you to David Lewis for the right reasons, but you may be drawing the wrong conclusion from his definition of "arbitrary."

  You are interpreting "arbitrary" to mean "inconsequential." In Lewis's game-theoretic framework, "arbitrary" means "there is no intrinsic preference for option A over option B." However, there is a massive preference for **everyone doing A** or **everyone doing B** over **some doing A and some doing B.**

  Lewis's theory actually supports the idea that shifting a convention is difficult, dangerous, and politically fraught. Here is why your reformer's battle is theoretically sound, and how you can deepen it using the very philosophy you're researching.

  ### 1. The Coordination Equilibrium Problem
  Lewis defines a convention as a **coordination equilibrium**. The value isn't in *which* side of the corridor you walk on; the value is in *not colliding* with the person coming the other way.

  If your reformer suggests, "Let's walk on the left instead of the right," she isn't asking people to change a preference; she is asking them to risk a coordination failure during the transition.
  *   **The Transition Cost:** For the new convention to work, adoption must be near-simultaneous. If 90% of the ship switches on Monday, but 10% (the elderly, the isolated, the rebellious) don't get the memo, you don't have a new system; you have chaos and collisions.
  *   **The Political Battle:** The conflict isn't about whether Left is better than Right. The conflict is about **trust and assurance.** The older generation might argue, "The risk of the transition period isn't worth the arbitrary gain." The reformer has to argue that the current convention has hidden costs (e.g., the right wall has a structural weakness, or the lighting is worse) that outweigh the transition risk.

  ### 2. Common Knowledge and Propagation
  Lewis places huge weight on **common knowledge**. For a convention to hold, I must know that you know that I know we are both following the rule.
  *   On a generation ship, information propagation is a narrative goldmine. How does the reformer ensure *common knowledge* of the change?
  *   If she announces it at the Assembly, did the hydroponics crew hear it? Do they trust the Assembly?
  *   The "political battle" becomes a battle of communication infrastructure. Is she fighting a bureaucracy that controls the comms? Is she fighting skepticism that the message will reach the lower decks?
  *   If people aren't *sure* everyone else is switching, rational self-interest dictates they stick to the old rule to avoid collisions. This creates a **pluralistic ignorance** trap: everyone wants to switch, but no one switches because they think everyone else won't.

  ### 3. Ritualization (The "Arbitrary" Becomes "Sacred")
  Lewis admits that while conventions *start* as arbitrary, they can acquire secondary preferences over time. This is crucial for a generation ship.
  *   To the original crew, walking on the right was arbitrary.
  *   To the 5th generation descendants, walking on the right might be "The Way of the Founders."
  *   Even if no one *voted* on it, the passage of time turns practical conventions into identity markers. Changing the walking side might be seen as disrespecting the ancestors who "built the path."
  *   This allows you to keep the "unwritten rule" aspect while giving the conservatives a non-arbitrary reason to fight: **Social Cohesion.** They aren't fighting for the right wall; they are fighting against the erosion of tradition.

  ### 4. Path Dependence and Infrastructure
  Sometimes an arbitrary rule ceases to be arbitrary because the environment adapts to it.
  *   Maybe handrails are worn smoother on the right side.
  *   Maybe signage is angled for visibility from the right.
  *   Maybe the floor plating is more durable on the right.
  *   Even if no one *planned* this, 100 years of traffic creates physical evidence that supports the old convention. The reformer now has to argue for changing the *behavior* despite the *physical environment* urging the old behavior.

  ### How to Reframe the Subplot
  You don't need to invent a "vested interest" in the sense of a corrupt profit motive. The vested interest is **safety and stability.**

  *   **The Conflict:** The reformer isn't fighting people who *like* the old rule. She is fighting people who are *afraid of the transition.*
  *   **The Antagonist:** Not a villain, but a Risk Manager. Someone whose job is to ensure hull integrity and crew safety. Their argument is: "The current rule works. The probability of collision during a 10% non-compliance transition is unacceptable."
  *   **The Climax:** The reformer shouldn't just win a vote. She needs to solve the **coordination problem.** Maybe she stages a "test day" where a specific sector switches simultaneously to prove it works. Or she finds a "focal point" (a concept from Thomas Schelling, who complements Lewis)—a specific date or event (like the Anniversary of Launch) where everyone naturally expects a reset, making it the perfect moment to switch conventions.

  ### Summary
  Lewis's theory predicts that conventions are **sticky**, not fluid. They are sticky precisely *because* they are arbitrary coordination solutions. The moment you introduce doubt about whether others will comply, the rational choice is to revert to the established convention.

  Your reformer's battle is realistic. She isn't fighting against the logic of the rule; she is fighting against the **inertia of mutual expectation.** That is a rich, thematic conflict for a generation ship novel, where community survival depends on mutual expectation. Keep the fight.

  **Recommended Reading Add-on:**
  If you want to dig deeper into the "stickiness" of these rules without getting bogged down in math, look up **Thomas Schelling's *The Strategy of Conflict***. Specifically, his chapters on "focal points." It pairs beautifully with Lewis and might give you the specific mechanism your reformer needs to successfully trigger the change.
