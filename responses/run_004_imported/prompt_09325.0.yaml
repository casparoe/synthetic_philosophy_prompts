answer: |-
  Good evening. For those who don't know me, I write the "Ideas" column. For those who *do* know me, you know that for the last ten years, that column has essentially been a fan club for the woman sitting at the head of this table.

  I accepted the invitation to speak tonight with one specific condition written into my contract: I am allowed to finish a sentence.

  Margit, I know you have circulated a memo. I know the memo states that anyone who mentions your "decades of hard work," your "professional dedication," or your "tireless labor" will be publicly corrected from your seat, mid-clause. I have seen the red pen you use for student papers; I shudder to imagine what you have prepared for me.

  So, I want to be very careful. Because if I get this wrong, I violate the philosophy you have championed. And if I get it right, I might still violate it, but at least I'll be consistent.

  We are here because of Moritz Schlick. And Schlick's argument, as Margit has tirelessly—*diligently*—*joyfully*… (Margit, are you reaching for your pen? Good.) …as Margit has shown us, is that a life lived purely for ends is a life without meaning. If you climb a ladder only to get to the roof, the climbing has no meaning, only the roof does. But if you spend your life climbing ladders to reach roofs, you never actually live in the meaning. You only defer it. Meaning, Schlick says, is found in activity valued for its own sake. Play. The dance, not the destination.

  Now, look at Margit's career. On paper, it looks like a ladder. Papers published. Tenure secured. Students graduated. A revival of a neglected text. It looks like "seriousness." It looks like "work."

  But here is the joke, and here is the triumph. Margit did not treat Schlick as work. She treated him as play.

  I have watched her read. I have watched her argue. I have watched her grade. She does not do these things to get to the weekend. She does them because the activity itself *is* the point. When she dissects a logical proposition, she isn't laboring; she is solving a puzzle because she loves the shape of the pieces. When she mentors a student, she isn't building a résumé; she is engaging in the shared play of thinking.

  To the grandchildren here tonight: Your grandmother is going to tell you that you shouldn't work too hard. She is right. But do not mistake what she does for "work." Watch her eyes when she talks about an idea. That light is not the light of industry. It is the light of play. She managed to do the rarest thing an adult can do: she kept the playground open inside the office.

  To her colleagues: We are tempted to toast her "contributions to the field." But Margit would say the field doesn't matter; the tilling does. We praise her output; she values the engagement. We are speaking the language of *Zweck*—purpose. She is speaking the language of *Sinn*—meaning. We mean well, but she is right to correct us. We are praising the monument; she is asking us to admire the building.

  So, Margit, I am not going to toast your resilience. Resilience implies a burden endured.
  I am not going to toast your productivity. Productivity implies a quota met.
  I am certainly not going to toast your legacy. Legacy is for the future, and Schlick teaches us that meaning is only in the *now*.

  Instead, I want to toast the moments.

  I toast the specific Tuesday afternoons when a sentence finally made sense.
  I toast the frustration that was actually fun because it was intellectual.
  I toast the fact that you never grew up, even while you grew old. You refused to let "seriousness" crowd out the game.

  You warned us not to praise your labor. So I won't. I will only praise your joy. Because if Schlick is right, and I believe you believe he is, then your career wasn't a job. It was ninety thousand hours of play. And you were very, very good at it.

  Please raise your glasses.

  To Margit. Not for the work she did, but for the life she lived while she was doing it. To the activity itself. To the play.

  *Prost.*
