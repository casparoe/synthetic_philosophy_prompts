answer: |-
  **Title:** Beyond the Moral Taxonomy: A Defense of *De Re* Reasons-Responsiveness

  The problem of moral worth asks a question distinct from, and perhaps more demanding than, the question of right action. An action is right if it conforms to the normative standards that govern conduct; it has moral worth if that conformity is creditable to the agent. As the seminar has highlighted, the Kantian tradition locates this credit in the motive of duty. However, the crude reading of Kant—requiring an occurrent thought like "I must do my duty"—renders moral agency psychologically implausible and, as critics like Stocker and Williams argue, alienating. In response, contemporary philosophers have attempted to refine the condition for moral worth. Barbara Herman preserves the motive of duty as a limiting condition; Julia Markovits proposes a Coincident Reasons Thesis; and Nomy Arpaly argues for *de re* responsiveness to moral features, even against the agent's own moral judgments.

  This essay argues that moral worth does not require a *de dicto* belief that one's action is right, nor does it require the motive of duty to function even as a dispositional limiting condition. Herman's attempt to save Kantianism ultimately fails to fully neutralize the alienation objection because it retains duty as a necessary structural component of worthy agency. Instead, I defend a modified Reasons-Responsiveness view. Moral worth consists in acting for the right-making features of a situation (*de re* responsiveness), provided this responsiveness is integrated into the agent's rational psychology in a way that rules out mere luck. On this view, Markovits's Coincident Reasons Thesis is fundamentally correct in structure but requires amendment to accommodate cases of inverse akrasia like Huckleberry Finn: it must explicitly decouple the agent's grasp of reasons from their grasp of those reasons *as* moral justifications.

  ### The Kantian Hangover and the Alienation Objection

  To understand the stakes, we must begin with the Kantian intuition that moral worth requires a specific connection to morality itself. For Kant, the shopkeeper who charges fairly only to maintain his reputation acts *in conformity* with duty but not *from* duty. The action is right, but the agent deserves no moral credit. Barbara Herman attempts to soften this requirement. She argues that the motive of duty need not be the primary motive driving the action (e.g., love or sympathy can do that work) but must serve as a "limiting condition." The agent acts on love, provided that the motive of duty does not forbid it. This allows for warm, ordinary agency while maintaining that moral worth depends on the agent's commitment to the moral law.

  However, Herman's view remains vulnerable to the alienation objections pressed by Michael Stocker and Bernard Williams. Stocker's famous hospital case posits a friend visiting a patient. If the friend visits *because it is their duty* (even in Herman's attenuated sense, where duty acts as the gatekeeper for their love), the relationship is compromised. The patient wants to be visited because they are cared for, not because they are the beneficiaries of a moral policy. Williams's "one thought too many" objection similarly suggests that in moments of immediate moral demand (like saving a spouse from drowning), the agent should act out of direct concern, not via a mediation of moral principle.

  Herman might reply that the limiting condition is dispositional and rarely occurrent. But the structural problem remains: on her view, if the limiting condition were removed, the moral worth would vanish, even if the love remained identical. This implies that the love itself is insufficient for moral credit; it requires the shadow of the moral law to validate it. This preserves a form of alienation by suggesting that our natural, non-moral concerns are morally inert until sanctioned by the motive of duty. To fully resolve the alienation worry, we must be willing to say that acting directly on the features that make an action right (e.g., a friend's need) is sufficient for moral worth, without needing to route that concern through a concept of "duty."

  ### The Shift to Reasons: Markovits and Arpaly

  This insight drives the shift toward reasons-based accounts. Julia Markovits's Coincident Reasons Thesis (CRT) posits that an action has moral worth if and only if the reasons for which the agent acts coincide with the reasons that morally justify the action. This elegantly bypasses the need for *de dicto* thoughts about duty. If I help you because you are in pain, and your pain is what makes helping you right, my reasons coincide with the justifying reasons.

  However, Markovits's account faces a challenge when confronted with Nomy Arpaly's case of Huckleberry Finn. Huck helps the escaped slave Jim, believing all the while that he is committing a moral sin by stealing "property." Huck's *de dicto* moral belief is false; he thinks he is acting wrongly. Yet, Arpaly compellingly argues, Huck is morally praiseworthy. He is responsive to the actual right-making features of the situation (Jim's humanity, Jim's suffering) despite his corrupted moral taxonomy.

  The question is whether Markovits's CRT can accommodate Huck without amendment. Markovits requires that the agent acts for the *justifying* reasons. In Huck's case, the justifying reasons are moral reasons (Jim's right to freedom). Huck, however, does not take these to be justifying reasons; he takes them to be reasons for shame. If Markovits insists that the agent must grasp the reasons *as* justifying, Huck is excluded. If she allows that the agent need only be responsive to the *content* of the reasons (Jim's suffering) without grasping their normative status, Huck is included.

  Here, Arpaly's distinction between *de dicto* and *de re* concern is vital. *De dicto* concern is a desire to do "what is right." *De re* concern is a desire to do *X*, where *X* happens to be what is right. Arpaly argues moral worth tracks *de re* concern. Huck has *de re* concern for Jim's welfare. He lacks *de dicto* concern for morality. If moral worth required *de dicto* concern, Huck would lack it. Since Huck clearly has moral worth (he is better than the society that condemns him), moral worth cannot require *de dicto* belief in rightness.

  Therefore, Markovits's account needs amendment. It must be clarified that the "coincidence" required is *de re*. The agent's motivating reasons must pick out the same features of the world that the normative reasons pick out, even if the agent conceptualizes those features differently. Huck acts on "Jim's sadness" (motivating reason), which coincides with "Jim's sadness" (justifying reason), even if Huck labels the former "temptation" and the latter "moral failure." Without this *de re* amendment, Markovits's view risks intellectualism, excluding agents who are morally sensitive but theoretically confused.

  ### The Problem of Luck and Rational Integration

  Rejecting the *de dicto* requirement, however, opens the door to the problem of lucky conformity. If moral worth is merely *de re* responsiveness to right-making features, what distinguishes a morally worthy agent from a well-trained dog that saves a baby, or a person who helps a stranger purely on a whimsical impulse? Both are responsive to the right features (the baby's danger, the stranger's need) without *de dicto* moral belief. If we follow Arpaly too loosely, we risk collapsing moral worth into causal reliability.

  This is where the "lucky conformity" objection bites. A purely behaviorist or causal account of *de re* responsiveness cannot distinguish between agency and instinct. To defend the verdict that *de re* responsiveness is sufficient, we must add a condition of **rational integration**.

  Moral worth requires that the responsiveness to right-making features be integrated into the agent's rational psychology. It is not enough that the feature causes the action; the feature must figure in the agent's practical reasoning, even if that reasoning is non-moralized. Huck does not just reflexively grab Jim's hand; he deliberates. He weighs his upbringing against his experience of Jim. He concludes, "All right, then, I'll go to hell," and acts. His action flows from a disposition to respond to human suffering that is robust enough to override his explicit moral theory. This stability and integration distinguish him from the dog or the whimsical helper.

  This modification saves the Reasons-Responsiveness view from the luck objection without reverting to Herman's *de dicto* requirement. We do not need the agent to think "this is my duty." We only need the agent's action to issue from a stable disposition to respond to the relevant features of the world (pain, need, promise-keeping) in a way that is sensitive to context and counterfactuals. If the need were greater, the worthy agent would respond more strongly. The dog might not; the whimsical helper might not. This counterfactual sensitivity constitutes the "credit" we assign to the agent.

  ### Defending the Verdict

  We are now in a position to render a clear verdict. Moral worth does not require a *de dicto* belief that one's action is right, nor does it require the motive of duty to function as a limiting condition. Herman's view, while an improvement on crude Kantianism, fails to fully exorcise the ghost of alienation. By making the motive of duty a necessary condition (even dispositionally), she implies that natural human concerns are morally insufficient on their own. This validates the Stocker/Williams intuition that there is something cold about an agency that requires moral validation to be creditable.

  Instead, we should adopt a **Modified Reasons-Responsiveness View**. Moral worth is achieved when an agent acts on the basis of the features that actually make the action right (*de re* responsiveness), provided that this responsiveness is a product of the agent's rationally integrated dispositions rather than mere instinct or luck.

  This verdict accommodates Huckleberry Finn better than either Herman or the unamended Markovits. Herman cannot easily account for Huck because Huck explicitly rejects the authority of duty; his "limiting condition" is effectively inverted. Unamended Markovits might struggle if she requires the agent to recognize the reasons *as* justifying. The Modified View recognizes that Huck's sympathy is a rational engagement with Jim's humanity. His moral worth lies in the fact that his concern for Jim is robust enough to survive the corrosion of his racist upbringing.

  Furthermore, this view dissolves the alienation objection. If moral worth is about responsiveness to the world's moral features (suffering, joy, autonomy), then acting directly out of love is the paradigm case of moral worth, not a suspect one. When I help my friend because I love them, I am responding to the feature (their need/our relationship) that justifies the help. I do not need to add a second thought about duty. The "one thought too many" is revealed to be not just psychologically burdensome, but philosophically unnecessary for credit.

  Finally, does this collapse into lucky conformity? No, because of the rational integration condition. The dog saves the baby, but the dog does not deliberate, nor does it possess a stable disposition sensitive to normative nuances. The whimsical helper acts rightly, but would not act rightly in a slightly different context where the cost was higher. The morally worthy agent possesses a character structure where the right-making features reliably trigger action through their practical reasoning. This is a demanding condition, but it is a condition on the *quality of the agency*, not the *content of the moral belief*.

  ### Conclusion

  The literature on moral worth often fears that abandoning the motive of duty abandons morality itself. This fear is unfounded. Morality is not a separate sphere of motivation marked by the label "duty"; it is a dimension of the reasons we already have. To have moral worth is to be in touch with that dimension. Barbara Herman tries to bridge the gap between duty and life by making duty a gatekeeper, but this keeps the gate. Julia Markovits identifies the right mechanism—coincident reasons—but must be careful not to demand that the agent identify those reasons *as* moral. Nomy Arpaly correctly identifies that *de re* responsiveness is the core of praiseworthiness.

  My verdict is that we should embrace Arpaly's insight but ground it in a robust theory of rational agency to avoid luck. Moral worth requires *de re* responsiveness to right-making features, integrated into the agent's rational dispositions. It does not require *de dicto* belief in rightness. This view honors the intuition behind Huck Finn, respects the alienation objections of Stocker and Williams, and secures moral worth against the threat of luck without resorting to the coldness of the Kantian shopkeeper. We are creditable not when we think about morality, but when we respond to the world in the way morality demands, regardless of what we call that demand.
