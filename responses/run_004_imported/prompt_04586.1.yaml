answer: |-
  **The Entropy Equator**

  The data from the Deep Field Array didn't look like noise. That was the problem. Noise was comfortable; noise was high-entropy, random, expected. This was ordered.

  Elias Thorne sat in the control room of the observatory, the blue light of the monitors washing over his face. He was seventy-two, old enough to remember when the Hubble was still a noun and not a historical footnote, and old enough to know that when the universe handed you a miracle, you checked the calibration first. He had checked it six times.

  The anomaly was in Sector 88-Z, a patch of void that should have been drifting toward heat death like the rest of the local cluster. Instead, the thermal gradient was inverting. Photons weren't scattering; they were converging. Dust wasn't diffusing; it was coalescing.

  To Elias, it looked like a movie played in reverse. A cup of coffee un-spilling itself. But he knew better than to trust his eyes. He trusted the thermodynamics.

  "It's not moving backwards, Elias," he said to the empty room. He had stopped talking to colleagues about this weeks ago. They talked about instrument error, about lensing artifacts, about the desperate pareidolia of old men looking for patterns in the static. "It's moving *uphill*."

  He pulled up the spectral analysis. The signal wasn't carrying data in any linguistic sense. It was carrying *negentropy*. It was a beam of radiation that became *more* coherent the further it traveled from its source.

  In Elias's universe, the Second Law was the only true law. Energy disperses. Information degrades. Time is the measure of that decay. You remember the past because the past is lower entropy; you cannot remember the future because the future is higher entropy. Your brain is a heat engine, burning order to create memory.

  But this signal... this signal was gaining order.

  He thought of Boltzmann. He thought of Schuetz. *What if,* the old assistant had asked in 1895, *our low-entropy world is just a rare fluctuation in a dead, equilibrium cosmos?* And if it is a fluctuation, it has two slopes. We slide down one, entropy increasing, time flowing away from the peak. But on the other side of the peak, beings slide down the opposite slope. To them, entropy increases away from the peak, just as it does for us. To them, time flows away from the peak.

  But from where Elias stood, looking across the valley of the fluctuation, their "away" was his "toward."

  He initiated the handshake protocol. It was a foolish gesture, like shouting into a hurricane, but he needed to know if the arrow was local or global. He aimed the high-gain antenna at the source and fired a burst of white noise—a maximum entropy dump. A thermodynamic stone thrown into a pond.

  He waited.

  In a normal exchange, he would send a signal, it would degrade over distance, and they would receive a degraded version. They would reply, their reply would degrade, and he would receive noise.

  But three hours later, the Array picked up a return.

  It wasn't noise. It was a laser-perfect pulse, tuned exactly to the frequency he had used, but stripped of all the thermal jitter his transmission had acquired. It was cleaner than when he sent it.

  Elias felt a chill that had nothing to do with the room temperature. If he were watching a video of this, he would say the signal was traveling backwards in time. But he wasn't watching a video. He was sitting in the room, his heart beating forward, his coffee cooling in the mug.

  He decoded the pulse. It wasn't binary. It was a temperature map. A shape made of heat.

  It resolved into a simple geometric form: a cone. The wide base was hot; the tip was absolute zero.

  To Elias, the message read: *Order emerges from chaos.*

  He stared at it. That was a lie. Order never emerges from chaos without work. But to the sender...

  He began to type a response, then stopped. How do you talk to someone for whom the dispersal of energy is the past?

  If he sent a message saying "Hello," and they received it as "Olleh" because the phonemes un-decayed as they traveled, communication was impossible. But that was the *Tenet* view. That was magic. That assumed there was a universal clock and they were marching the wrong way.

  Price's view was subtler. There is no universal clock. There is only the gradient.

  To Elias, the signal was becoming more ordered as it approached him. That meant, from his perspective, the source was *absorbing* the signal's entropy.
  To the sender, the signal was becoming *less* ordered as it traveled. They were emitting a normal, degrading signal. It just happened that as it crossed the Equator—the minimum entropy point between their slope and his—the definition of "degradation" flipped.

  They were living forward. He was living forward. The "reversal" was only in the space between them.

  He realized he couldn't send them a message about the future. He couldn't warn them, and they couldn't warn him. Because "future" meant "higher entropy."
  For him, the future was the heat death.
  For them, the future was *also* the heat death.
  They were back-to-back, sliding down opposite sides of a mountain, both facing away from the summit.

  The summit was the Big Bang. Or rather, a local Big Bang, a fluctuation peak in an eternal, high-entropy sea.

  Elias looked at the data again. The signal wasn't just a pulse. It was a stream. Continuous.
  They weren't trying to talk. They were leaking.
  Just as his civilization leaked radio waves and heat into the void, theirs was leaking into him. But because they were on the other slope, their "waste heat" was his "ordered energy."

  He understood then why he couldn't have a conversation. A conversation requires a shared causal arrow. You speak (cause), I hear (effect).
  But if he spoke, his cause would travel toward the Equator. As it crossed, it would become an effect for them.
  If they spoke, their cause would travel toward the Equator. As it crossed, it would become an effect for him.

  They could only exchange artifacts. Things that existed at the boundary.

  Elias made a decision. He couldn't talk to them, but he could leave something for them. Or rather, something that would *be* there for them.
  He programmed the Array to focus a beam of coherent light—not at the source, but at the Equator itself. The point of minimum entropy. He would pour order into the valley.

  To him, it looked like he was creating a black hole of information, a sink where complexity vanished.
  To them, it would look like a star igniting. A source of order bursting forth from the void.

  He engaged the beam. The power draw spiked. The observatory lights dimmed.
  On the monitors, the anomaly in Sector 88-Z brightened.

  Then, the response came. Not a signal. A change in the background.
  The stars in that sector began to shift. Not in position, but in spectral class. They were aging.
  No, Elias corrected himself. *To him*, they were aging. Red giants turning to white dwarfs.
  *To them*, those stars were forming. Condensing from gas.

  He was watching their history play out in his sky. He was watching their past, which was his future relative to the Equator.
  He saw a planet coalesce. He saw an atmosphere form. He saw the glint of a mirror.

  It was disorienting, not because it was impossible, but because it was mundane. There were no explosions, no time travelers stepping out of machines. Just thermodynamics doing its work. The universe seeking equilibrium, and finding two paths to get there.

  A new message decoded. It wasn't from the Array. It was in the telemetry of the beam he had sent.
  The energy return ratio was changing.
  He was putting energy in. He was getting energy out.
  Conservation of energy held. But the *value* of the energy was flipping.

  He was burning fuel to send order. They were receiving order and using it to build.
  He was the battery. They were the engine.
  Or was it the other way around?

  If he stopped the beam, would their stars stop forming?
  If they stopped their stars from forming, would his beam stop returning?

  Elias took his hand off the console. He thought about the grandkids who had shown him *Tenet*. They had wanted to see bullets fly backwards. They wanted the magic. They wanted to know who would win the fight.

  But there was no fight. There was only the slope.

  He looked at the screen. The planet in Sector 88-Z was blue now. Clouds were swirling. To Elias, the clouds were settling into calm. To them, a storm was brewing.
  He wondered if there was someone on that planet, looking up at his sector of the sky.
  To them, Elias's sector was a region of dissolving stars, fading into the gray equilibrium. A place of death.
  They would look at his civilization and see a civilization un-building itself. Towers dismantling into brick. People walking backwards into wombs.
  They would pity him. They would think his arrow was broken.

  And he looked at them, and he saw them building, and he felt a pang of jealousy so sharp it hurt. They were in their morning. He was in his evening.

  He could shut it down. He could break the link. Preserve the isolation of his own arrow. Keep the universe consistent.
  But the data was beautiful. It was the first proof that the fluctuation was large enough to hold two lives.

  Elias typed a command. He locked the beam frequency. He set the Array to broadcast continuously, a lighthouse of negentropy aimed at the Equator.
  He wouldn't talk to them. He wouldn't try to synchronize clocks that ticked in opposite thermodynamic directions.
  He would just be the dawn.

  He sat back and watched the planet spin.
  On the screen, a continent rotated into view. It was night there. City lights flickered on.
  To Elias, the lights were turning off. The continent was going dark.
  To them, the sun was rising.

  He raised his coffee mug. It was cold now.
  "To the morning," he whispered.

  He didn't know if they saw him. He didn't know if, to them, his gesture looked like a hand un-waving.
  It didn't matter. The gradient was real. The contact was real.
  And for the first time in forty years of physics, Elias Thorne didn't feel like he was waiting for the heat death. He felt like he was part of a cycle.

  He left the beam on. He turned off the monitors. He sat in the dark control room, watching the glow of the anomaly with his own eyes, letting the photons hit his retina, carrying the image of a world waking up, even as his own grew old.

  Outside, the sun was rising over the observatory.
  Elias didn't turn to look. He knew which way the entropy was flowing.
  He just watched the screen, where the other sun was setting, and wondered if anyone there was watching him back, and thinking the same thing.
