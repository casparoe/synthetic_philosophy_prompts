  2.  **Deconstruct the Philosophical Content:**
      *   **Hempel's Paradox:** "All ravens are black" ($\forall x (Rx \to Bx)$) is logically equivalent to "All non-black things are non-ravens" ($\forall x (\neg Bx \to \neg Rx)$).
      *   **Nicod's Criterion:** Observing an $F$ that is $G$ confirms "All $F$ are $G$".
      *   **Equivalence Condition:** Evidence confirming a hypothesis confirms any logically equivalent hypothesis.
      *   **The Paradox:** Observing a red herring (non-black, non-raven) confirms "All non-black things are non-ravens," therefore it confirms "All ravens are black." This feels wrong.
      *   **Probabilistic Dissolution (Bayesian):** Yes, it confirms, but the degree is tiny because the set of non-black things is huge compared to ravens. $P(H|E) > P(H)$, but only by a hair.
      *   **I.J. Good's Counterexample:** Under specific background knowledge distributions, observing a black raven can *decrease* the probability of the hypothesis. This challenges the idea that confirmation is monotonic or even always positive for positive instances.
      *   **Host's Edge:** Real-world knowledge that "All ravens are black" is biologically false (albino ravens, lighting, etc.), which challenges the truth value of the hypothesis itself, not just the confirmation logic.

  3.  **Drafting the Questions (Iterative Process):**

