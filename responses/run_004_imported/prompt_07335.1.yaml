answer: |-
  # The Highway to Nowhere: Why the Absent-Minded Driver Kills Act-Optimality

  The Absent-Minded Driver (AMD) is not merely a puzzle; it is a stress test for the coherence of Bayesian agency. Proposed by Piccione and Rubinstein in 1997, it presents a scenario where an agent with imperfect recall seems to face a choice between two rationalities: the rationality of the planner (ex-ante) and the rationality of the actor (on-the-spot). When these two diverge, standard decision theory appears to fracture.

  The setup is deceptively simple. A driver must exit at the second of two indistinguishable intersections. Exiting at the first yields nothing (0); exiting at the second yields a reward (4); missing both yields a consolation prize (1). Because the driver is absent-minded, he cannot distinguish the intersections, nor can he remember if he has already passed one. He must adopt a single probability $x$ of continuing at any intersection he encounters.

  From the perspective of the start of the trip (planning-optimality), the math is unambiguous. The expected payoff is $V(x) = 4x(1-x) + 1x^2 = 4x - 3x^2$. Maximizing this yields $x = 2/3$.

  The paradox arises when the driver arrives at an intersection. He knows he is at *an* intersection, but not *which* one. Intuitively, he should update his beliefs about his location based on the strategy $x$ he is employing. If he continues with probability $x$, he is guaranteed to reach the first intersection, but only reaches the second with probability $x$. Thus, conditional on being at an intersection, the probability it is the first is $1/(1+x)$ and the second is $x/(1+x)$. If the driver then tries to maximize expected payoff *at that moment* using these updated beliefs (act-optimality), the calculus shifts. For certain variations of the problem, this local maximization suggests a different $x$ than $2/3$, creating a time-inconsistency: the driver wants to commit to $2/3$ at home, but wants to deviate when he sees the exit sign.

  This divergence has spawned decades of literature, but it demands a verdict. Is this a genuine failure of expected utility theory, proving that planning and acting are fundamentally distinct norms? Or is it a phantom paradox, born of a category error in how we handle self-locating beliefs?

  My position is firm: The Absent-Minded Driver does not reveal a flaw in decision theory; it reveals a flaw in the concept of "act-optimality" for agents with imperfect recall. The paradox dissolves completely once we recognize that in contexts of imperfect recall, self-locating credences are not free-floating priors to be updated and plugged into a local calculator. They are endogenous variables, fixed points of the very strategy being evaluated. Planning-optimality is not just one option among many; it is the *only* coherent normative standard for such agents. To attempt act-optimality is to hallucinate a degree of freedom the agent does not possess.

  ### The Illusion of the Local View

  The temptation to treat act-optimality as a rival standard stems from a deep-seated intuition: that rationality is about making the best choice *now*, given what you know *now*. In standard decision problems with perfect recall, the "view from now" and the "view from the start" coincide. If you maximize expected utility at every node, you maximize it for the whole tree.

  AMD breaks this equivalence because the agent's information set lumps two distinct physical states (Intersection 1 and Intersection 2) into one subjective state ("An Intersection"). When the driver stands at the sign, he tries to reason: "Given that I am here, should I exit or continue?" To answer this, he needs probabilities. He correctly deduces that if his strategy is $x$, the likelihood of being at the second intersection is proportional to $x$.

  The error occurs when the driver treats these probabilities as fixed *while* varying his action. He asks, "If I change my probability of continuing *right now*, does my expected payoff go up?" But he cannot change his probability of continuing *right now* without changing his probability of continuing *at the other intersection*, because he cannot tell them apart. He is constrained to a single policy $x$.

  If he treats the belief $P(\text{Second} | \text{Here}) = x/(1+x)$ as a constant while differentiating his utility with respect to his current action, he is effectively assuming he can change his behavior at this intersection without changing the probability that he *reached* the second intersection. This is a counterfactual impossibility. In imperfect recall scenarios, your action at this node *causally influences* the probability that you are at this node (via the path taken to get here).

  Therefore, the "act-optimal" calculation that leads to a deviation from $2/3$ relies on a ceteris paribus assumption that is false. You cannot hold the belief fixed while changing the strategy, because the belief is a function of the strategy.

  ### The Fixed-Point Resolution

  The robust resolution, championed by Aumann, Hart, and Perry (1997) and refined by others like Hitchcock, is to treat the belief as a fixed point. The driver must ask: "Is there a strategy $x$ such that, if I believe I am using $x$, and I update my location probabilities accordingly, $x$ is the optimal action?"

  When you perform this calculation correctly—acknowledging that a marginal change in your tendency to continue changes the likelihood that you are at the second intersection—the local maximization condition collapses back into the planning maximization condition. The derivative of the expected utility with respect to $x$, accounting for the change in beliefs, yields the same first-order condition as the ex-ante planning problem.

  This implies that the divergence between planning and acting is an artifact of "naive" updating. It assumes the agent can decouple their current decision from their overall policy. But an agent with imperfect recall *is* their policy. There is no "current self" distinct from the "past self" who can exploit new information, because the "new information" (being at an intersection) was fully anticipated and probabilistically determined by the policy itself.

  Consequently, I argue that act-optimality is not just difficult to calculate in these scenarios; it is conceptually incoherent. Rationality for an absent-minded agent is not about reacting optimally to stimuli; it is about selecting the optimal input-output function. The "planning" perspective isn't a special pre-commitment device; it is the fundamental description of the decision problem. The "act" perspective is a derivative illusion that only works when recall is perfect.

  ### The Beauty in the Rearview Mirror

  This conclusion casts a revealing light on the Sleeping Beauty problem, the "weirder cousin's cousin" of AMD. In Sleeping Beauty, a participant is woken once if a coin lands Heads, and twice if Tails. Upon waking, what is her credence that the coin is Heads?

  Halfers argue for $1/2$ (the prior probability of the coin). Thirders argue for $1/3$ (weighting by the number of awakenings). The structural parallel to AMD is striking. The Thirder argument relies on the same "frequency of visits" logic the driver uses to determine $P(\text{Second} | \text{Here}) = x/(1+x)$. In Beauty, the probability of being in a specific awakening is weighted by the frequency of that awakening type.

  The AMD paradox suggests that the Thirder *mechanism* for calculating credence is correct, but the Thirder *application* often falls into the same trap as the naive driver. If Beauty uses her $1/3$ credence to maximize expected utility for a *single* bet offered at each awakening, she behaves consistently with the ex-ante optimal betting strategy. However, if she tries to use that credence to reason about the coin toss in isolation, ignoring the policy constraints (e.g., "If I believe it's Tails, should I change my behavior in a way that would alter the number of awakenings?"), she risks inconsistency.

  AMD vindicates the Thirder intuition that self-locating beliefs must be sensitive to the frequency of experiences generated by the experimental setup (the strategy). However, it warns us that these beliefs cannot be used for "local" maximization independent of the global policy. In both AMD and Sleeping Beauty, the rational agent must recognize that their subjective probability of "now" is a function of the objective chance of the process that generated "now."

  This suggests a dissolution of the Halfer/Thirder debate not by choosing a side on credence, but by shifting the normative weight to *betting strategies*. Just as the driver should optimize $x$ from the start, Beauty should optimize her betting policy from the start. If you do that, the "Thirder" betting odds emerge as the ones that maximize ex-ante utility. The "Halfer" position, which ignores the self-locating weight, corresponds to the driver ignoring the fact that he is more likely to be at the second intersection if he continues. That leads to suboptimal planning.

  ### The Verdict

  The Absent-Minded Driver is not a paradox that proves standard decision theory is broken. It is a boundary condition that clarifies what standard decision theory actually is. It demonstrates that Expected Utility Theory is fundamentally a theory of *policy selection*, not *act selection*.

  When recall is perfect, policy selection and act selection coincide, so we fool ourselves into thinking rationality is about the act. When recall is imperfect, the mask slips. We see that the "act" is not the atomic unit of agency; the "strategy" is.

  Therefore, the divergence between planning-optimality and act-optimality is not a permanent parting of ways. It is a correction. Act-optimality, as traditionally conceived (maximize given fixed beliefs), is the error. Planning-optimality (maximize given that beliefs are fixed points of the plan) is the truth. The driver should not feel torn. He should set his cruise control to $2/3$ at the start of the highway, and when he inevitably finds himself staring at an indistinguishable sign, he should recognize that his confusion is not a new information state requiring a new decision, but merely the execution of the only decision that ever mattered.

  In the end, the absent-minded driver teaches us a humbling lesson about agency: we are not as free in the moment as we feel. We are bound by the policies we set when we were clear-headed. To try to outsmart them in the fog is not rationality; it is just another form of absent-mindedness.
