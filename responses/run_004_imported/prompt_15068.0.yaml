answer: |-
  Welcome to the club. It is a genuine pleasure to speak with someone who actually understands the selectionist machinery rather than just the metaphorical gloss.

  Your instinct is sharp, and you are far from alone in feeling that "smell." In fact, that scent of sulfur is the central battleground in the philosophy of biology and mind over the last 40 years.

  To answer your core question directly: **No, it is not merely a verbal trick, but whether it successfully remains naturalistic is still hotly contested.** Teleosemantics attempts to do something very specific: it tries to ground *normativity* (truth conditions, correct/incorrect usage) in *causal history* (selection).

  Here is the breakdown of why your biological radar is pinging, where the theory claims to be safe, and where the critics (including many biologists) think it crashes.

  ### 1. The Defense: It's Backward-Looking, Not Forward-Looking
  As you know, the biologist's distinction between teleology and teleonomy rests on time direction.
  *   **Teleology:** The future goal causes the present state (Aristotelian final causes).
  *   **Teleonomy:** The past selection pressure explains the present appearance of purpose.

  Millikan and the teleosemanticists argue they are strictly in the teleonomy camp. They claim they aren't saying the brain *aims* at truth. They are saying the brain state has content because ancestors with that state survived *due to* the correlation of that state with the world.

  For example, a frog's visual neuron fires. Why does it mean "fly" and not "small dark moving thing"? The teleosemanticist says: Look at the history. The mechanism was selected because flies were present. Therefore, the "proper function" is to detect flies. The content is fixed by the **etiology**, not by what the frog hopes to achieve.

  From this angle, they argue they are being good Darwinians. They are using the same explanatory move Mayr used to justify "function" in organs without invoking a designer.

  ### 2. The Smell: Where Normativity Sneaks In
  Here is where your retirement reading is triggering your professional training. The problem isn't the history; it's the **normativity**.

  In biology, "proper function" is a statistical shorthand. A heart's proper function is to pump blood. If a specific heart fails to pump, we say it is "malfunctioning." But in a strictly materialist universe, that heart is just matter behaving according to physics. There is no cosmic "ought."

  Teleosemantics needs that "ought" to do the heavy lifting for *meaning*. For a belief to have content, it must be capable of being *false*. If a neural state is just a physical cause of a behavior, it isn't true or false; it just *is*. To get "truth conditions," teleosemantics argues that a representation is "true" if the world matches what the mechanism was selected to correspond to.

  **The Biologist's Objection:** Selection doesn't select for "truth"; it selects for fitness.
  Sometimes false beliefs enhance fitness (e.g., overestimating predator presence). If the content is determined by what was selected for, and what was selected for was survival (not accuracy), then the "content" might be "danger" rather than "tiger." This leads to the **Indeterminacy Problem**. Selection is often too coarse-grained to pin down specific semantic content. Did the gene select for "fly," "protein source," or "snap-target"? The evolutionary history might not distinguish these, but the semantics need to.

  ### 3. The "Swampman" Objection (The History Trap)
  The most famous attack on this historical framing comes from Donald Davidson. He proposed a thought experiment: Suppose lightning strikes a swamp and arranges molecules into an exact duplicate of you (Swampman). Swampman has no evolutionary history; he popped into existence by chance.

  *   **Teleosemantics says:** Swampman has no mental content. His states have no "proper function" because they weren't selected for. He is a zombie, semantically speaking.
  *   **Intuition says:** Swampman thinks and sees just like you.

  For a biologist, the teleosemantic verdict might sound correct (no history, no function). But for a philosopher of mind, it's a *reductio ad absurdum*. It implies that meaning is external to the current physical state of the organism and relies entirely on a historical narrative. If you accept this, you accept that two physically identical brains can have different thoughts based solely on their ancestry. That is a hard pill to swallow for a naturalist who wants mind to be grounded in the *now*.

  ### 4. Is it a Verbal Trick?
  It is not a trick in the sense that the proponents are trying to deceive. Millikan is acutely aware of the teleology trap. She explicitly argues that "purpose" in biology is a derived, relational property, not an intrinsic one.

  However, many critics argue it is a **category error**. They argue that teleosemantics tries to extract *semantic* normativity (truth/falsity) from *biological* normativity (function/malfunction), and that the latter cannot support the weight of the former.

  *   **Biological Normativity:** "This heart is broken." (Meaning: It won't sustain the organism).
  *   **Semantic Normativity:** "This belief is false." (Meaning: It does not correspond to reality).

  You can have a false belief that aids survival (a useful fiction). You can have a true belief that kills you (knowing exactly how fast the predator is running might cause panic). If selection fixes the content, but selection doesn't care about truth, then selection cannot fix truth-conditional content.

  ### 5. Summary: What You Aren't Missing
  You aren't missing a technicality; you are spotting the fundamental tension.

  1.  **Naturalism Status:** Teleosemantics is naturalistic in that it invokes no souls or non-physical properties. It relies on causal history.
  2.  **The Teleology Charge:** It does not reintroduce *cosmic* teleology (goals), but it does reintroduce *immanent* teleology (norms inherent in the system). Whether "selected effect" is enough to ground "meaning" is the dispute.
  3.  **The Biologist's Edge:** Your training makes you skeptical of "adaptationist stories" that assume every trait has a specific, selectable function that maps neatly to a semantic content. Teleosemantics often relies on very clean adaptationist assumptions that modern evolutionary biology (with its focus on drift, exaptation, and pleiotropy) makes messy.

  **The Verdict:**
  Teleosemantics is not a return to pre-Darwinian teleology. It is an attempt to use Darwinian history to solve the problem of intentionality. However, your nose is correct: it smells like teleology because it tries to derive "ought" from "was."

  Many philosophers (like Jerry Fodor, ironically) eventually abandoned it because they felt it couldn't solve the indeterminacy problem without begging the question. Others (like Ruth Millikan) stick by it as the only game in town for naturalizing content.

  As a retired biologist, you are free to enjoy the best view: Teleosemantics is a fascinating, rigorous, but likely incomplete attempt to bridge the gap. It respects the "no goals" rule of evolution, but it perhaps asks the blind watchmaker to do a bit more seeing than he is capable of.
