prompt: |-
  I spent my working life as an evolutionary biologist, and one of the first things drilled into us was to say 'teleonomy' instead of 'teleology', precisely so you never accidentally imply evolution is aiming at some goal. Now that I'm retired and reading philosophy of mind for fun, I keep bumping into 'teleosemantics' -- Millikan's idea that a mental state gets its content from the 'proper function' it was selected for -- and honestly it smells like teleology sneaking back in through the side door to do the heavy lifting on meaning. Is the historical, selection-based framing actually enough to keep this naturalistic, or is it just a verbal trick that relabels the same old purposiveness everybody agreed to ditch after Darwin? Genuinely curious what im missing here.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and the Query:**
      *   **User Background:** Retired evolutionary biologist. Deeply familiar with the distinction between teleology (goal-directed, purposeful) and teleonomy (apparent purpose resulting from natural selection).
      *   **Current Activity:** Reading philosophy of mind for fun.
      *   **Specific Issue:** Encountering "teleosemantics" (specifically Ruth Millikan's version).
      *   **Core Concern:** Does teleosemantics smuggle teleology back in under the guise of naturalism? Is the "selection-based framing" sufficient, or is it just a verbal trick?
      *   **Tone:** Skeptical, intellectually rigorous, curious, respectful of scientific naturalism.

  2.  **Deconstruct the Core Concepts:**
      *   **Teleology:** Ends-driven, intrinsic purpose, often implies a designer or cosmic goal. (Aristotelian final causes).
      *   **Teleonomy:** Function explained by history/selection, not future goals. (Mayr, Pittendrigh).
      *   **Teleosemantics:** A theory of mental content (intentionality) where the meaning of a representation is determined by the biological function of the mechanism producing it, which is in turn determined by evolutionary history (selection).
      *   **The Tension:** If evolution has no goals, how can "proper function" (what something was *selected for*) ground meaning without implying the system *aims* at truth or survival in a normative sense?

  3.  **Evaluate the User's Skepticism:**
      *   The user is right to be suspicious. This is a major debate in philosophy of biology and mind.
      *   The "smell" they detect is known as the "Normativity Problem" or the "Swampman" objection.
      *   However, it's not *just* a verbal trick. There's a substantive argument being made about causal history vs. forward-looking purpose.

  4.  **Formulate the Response Strategy:**
      *   **Validate:** Acknowledge the user's expertise and the legitimacy of their concern. It's a classic and well-founded objection.
      *   **Define the Distinction (Biologist to Philosopher):** Clarify how philosophers use "teleo-" in this context vs. how biologists fear it.
      *   **Explain the Mechanism:** How Millikan et al. claim to keep it naturalistic (causal history, not future goals).
      *   **Address the "Smell" (The Criticisms):** Discuss why it *feels* like teleology (normativity, idealization).
      *   **Key Objections:** Mention Swampman (Davidson), the Indeterminacy Problem, and the Normativity Problem.
      *   **Conclusion:** Offer a balanced verdict. It's not a trick, but it's controversial and perhaps incomplete.

  5.  **Drafting the Content - Section by Section:**

      *   *Introduction:* Welcome the colleague. Validate the instinct. The distinction between teleology and teleonomy is crucial, and teleosemantics walks a tightrope.
      *   *The Core Claim of Teleosemantics:* It's backward-looking, not forward-looking. It relies on *etiology* (history of selection), not *destiny*. This aligns with the biologist's view of teleonomy.
      *   *Why it feels like Teleology (The "Smell"):*
          *   **Normativity:** Functions imply "oughts" (a heart *ought* to pump). Mental states *ought* to be true. Where does the "ought" come from in a material world?
          *   **Idealization:** Selection deals with statistical fitness, not specific truth conditions for every neuron firing.
      *   *Major Philosophical Objections (The "Heavy Lifting"):*
          *   **Swampman (Davidson):** If a duplicate appears by chance without history, does it have thoughts? Teleosemantics says no. Intuition says yes.
          *   **Indeterminacy:** Selection selects for survival, not necessarily "truth." A frog's fly-detector might be selected for snapping, not representing "fly." (The disjunction problem).
      *   *Is it a Verbal Trick?* No, it's a substantive hypothesis. It tries to reduce intentionality to causal history. But does it succeed? Many say it fails to fully naturalize normativity.
      *   *Biologist's Perspective:* As a biologist, the user knows selection is blind. Teleosemantics asks us to treat the *product* of blind selection as if it has norms. That's the leap.
      *   *Conclusion:* It's not a return to Aristotelian teleology, but it might be asking evolutionary theory to do work it wasn't designed to do (grounding semantics).

  6.  **Refining the Tone:**
      *   Avoid overly dense jargon where possible, but don't dumb it down (user is an expert).
      *   Use biological analogies (frog visual systems, heart pumping).
      *   Maintain the "colleague-to-colleague" vibe.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I distinguish Millikan from others? *Adjustment:* Focus on Millikan as requested, but acknowledge the broader field.
      *   *Check:* Did I answer the "naturalistic" question? *Adjustment:* Explicitly state that it *claims* to be naturalistic but critics argue it fails to eliminate normativity.
      *   *Check:* Is the Swampman objection relevant? *Yes, it attacks the historical necessity.*
      *   *Check:* Is the "disjunction problem" relevant? *Yes, it attacks the link between selection and specific content.*

  8.  **Final Polish:** Ensure the distinction between "forward-looking purpose" (teleology) and "backward-looking function" (teleonomy/teleosemantics) is crystal clear, as that's the pivot point for the user. (Proceed to generate output based on these thoughts.)

  9.  *(Post-computation check)*: Make sure to mention that Millikan explicitly distinguishes her view from conscious purpose. She calls it "naturalized teleology" but grounds it in history.

  10. **Final Output Structure:**
      *   Validation of the instinct.
      *   The "Backward-Looking" Defense.
      *   The Normativity Worry (why it smells like teleology).
      *   The "Swampman" & History Problem.
      *   The "Disjunction" Problem (Selection for what?).
