prompt: |-
  ok so I had this argument with my friend last night that went on way longer than it should have (we're both philosophy nerds so this happens more than I'd like to admit), about Mary's Room and whether physicalism can actually survive it. She's doing a philosophy of mind seminar this term and pulled up this passage from C.D. Broad's 1925 book "The Mind and Its Place in Nature" (pp. 71–72 apparently) to argue that the whole "knowledge argument" thing is basically just a repackaged version of something Broad already said, decades before Jackson and Mary ever showed up. I wasn't convinced but I also couldn't articulate why on the spot, and now it's bugging me. Here's the bit she showed me, it's about an imaginary "mathematical archangel" with perfect physics and unlimited powers of reasoning:

  "Take any ordinary statement, such as we find in chemistry books; e.g, 'Nitrogen and Hydrogen combine when an electric discharge is passed through the mixture of the two. The resulting compound contains three atoms of Hydrogen to one of Nitrogen; it is a gas readily soluble in water and possessed of a characteristic smell.' If the mechanistic theory be true the archangel could deduce from his knowledge of the microscopic structure of atoms all these fact but the last. He would know exactly what the microscopic structure must be; but he would be totally unable to predict that a substance with this structure must smell as ammonia does when it gets into the human nose. The utmost that he could predict on this subject would be that certain changes would take place in the mucous membrane, the olfactory nerves and so on. But he could not possibly know that these changes would be accompanied by the appearance of a smell in general or of the peculiar smell of ammonia in particular, unless someone told him so or he had smelled it for himself. If the existence of the so-called 'secondary qualities,' or the fact of their appearance, depends on the microscopic movements and arrangements of material particles which do not have these qualities themselves, then the law of this dependence are certainly of the emergent type."

  My friend basically thinks this IS Mary's Room, just with wings on. I kept arguing Broad is up to something a bit different here, something about emergent laws governing secondary qualities rather then a clean "propositional knowledge vs. qualia" point like Jackson makes, but I couldn't really back that up and it's been nagging at me since. Could you help me actually work through this properly? Specifically: what exactly is the archangel argument establishing here, and is its logical structure the same as Jackson's Mary argument or genuinely different? And if a physicalist wanted to respond to Broad the way people respond to Jackson these days (e.g. something like Lewis's Ability Hypothesis, or the "phenomenal concepts" move), would that kind of response work equally well against the archangel, or does Broad's framing in terms of emergence set up a different kind of challenge that needs a different kind of reply? Sorry if this is long, I'm still a little worked up about loosing the argument lol.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user had a philosophical argument with a friend about Mary's Room (Frank Jackson's Knowledge Argument) vs. C.D. Broad's "Mathematical Archangel" argument from *The Mind and Its Place in Nature* (1925).
      *   **The Friend's Claim:** Broad's Archangel argument is essentially the same as Jackson's Mary's Room argument (just older). Therefore, physicalism faces the same problem Broad identified.
      *   **The User's Intuition:** Broad is doing something different, specifically regarding "emergent laws" and "secondary qualities," rather than a clean "propositional knowledge vs. qualia" distinction.
      *   **The Task:** Help the user work through the differences. Specifically:
          1.  What is Broad's Archangel argument establishing?
          2.  Is its logical structure the same as Jackson's?
          3.  Would standard physicalist responses to Jackson (Ability Hypothesis, Phenomenal Concepts) work against Broad, or does Broad's "emergence" framing require a different reply?
      *   **Tone:** Empathetic (they lost the argument and are bothered), rigorous (philosophy nerds), and clear.

  2.  **Deconstruct Broad's Archangel Argument:**
      *   *Source:* C.D. Broad, *The Mind and Its Place in Nature* (1925).
      *   *Scenario:* A "Mathematical Archangel" knows all microscopic physical facts and has infinite reasoning power.
      *   *Claim:* The Archangel can deduce macroscopic physical properties (solubility, chemical composition) from microscopic facts.
      *   *Limit:* The Archangel *cannot* deduce secondary qualities (smell, color, taste) from microscopic facts alone. He needs to experience it or be told.
      *   *Conclusion:* The relationship between physical structure and secondary qualities is "emergent." There are brute psycho-physical laws connecting the two that cannot be deduced *a priori*.
      *   *Metaphysical Stance:* Broad is an *Emergent Materialist* (or Emergentist). He believes mental properties (like sensations) arise from physical substrates but are not reducible to them in a deductive sense. He accepts the physical base but denies full reducibility.

  3.  **Deconstruct Jackson's Mary's Room Argument:**
      *   *Source:* Frank Jackson, "Epiphenomenal Qualia" (1982).
      *   *Scenario:* Mary knows all physical facts about color vision but has never seen color (black and white room).
      *   *Claim:* When Mary sees red, she learns something new ("what it is like").
      *   *Conclusion:* Physicalism is false (because there are facts about the world—phenomenal facts—that are not physical facts).
      *   *Metaphysical Stance:* Jackson (at the time) was arguing for *Property Dualism* / Epiphenomenalism. The goal was to refute physicalism entirely.

  4.  **Compare the Two (The Core Analysis):**
      *   *Similarity:* Both involve an omniscient (regarding physics) entity who lacks knowledge of experience/qualia. Both highlight an explanatory gap.
      *   *Difference 1: The Target.*
          *   Jackson targets *Physicalism* (the ontological claim that everything is physical). He wants to show physicalism is *false*.
          *   Broad targets *Mechanistic Materialism* (the claim that everything is deducible from mechanics). He wants to show that *Emergentism* is *true*. Broad *is* a materialist of sorts (Emergent Materialist). He thinks the mind depends on the brain, just not deducibly.
      *   *Difference 2: The Nature of the "New" Knowledge.*
          *   Jackson: Mary learns a new *fact* (propositional). This implies new ontology.
          *   Broad: The Archangel fails to deduce the smell. This implies a brute *law of nature* (psychophysical law). For Broad, the smell is an emergent property. It's not that the Archangel misses a "fact" in the Jacksonian sense, but that the *connection* is brute.
      *   *Difference 3: Deductibility vs. Ontology.*
          *   Jackson: If physicalism is true, all facts are physical facts. Mary knows all physical facts. She learns a new fact. Therefore, physicalism is false.
          *   Broad: If mechanism is true, all macro properties are deducible from micro properties. Smell is not deducible. Therefore, mechanism is false (but Emergentism is true). Broad allows for non-deducible properties *within* a naturalistic framework.

  5.  **Evaluate Physicalist Responses:**
      *   *Ability Hypothesis (Lewis/Nemirow):* Mary doesn't learn a fact; she gains an ability.
          *   *Against Jackson:* Plausible to some.
          *   *Against Broad:* Broad might say, "Sure, but the Archangel couldn't even predict the *appearance* of the smell." Broad is focused on the *law* connecting structure to sensation. The Ability Hypothesis sidesteps the ontological worry, which fits Broad's emergentism better than Jackson's dualism. Broad might accept this as a description of the gap without accepting dualism.
      *   *Phenomenal Concepts Strategy (PCS):* Mary learns the same fact under a new mode of presentation.
          *   *Against Jackson:* Standard physicalist defense.
          *   *Against Broad:* Broad would likely reject this. For Broad, the gap is real and ontological (emergent properties), not just conceptual. He explicitly calls the laws "emergent." PCS tries to save physicalism; Broad isn't trying to save "Mechanism," he's trying to establish "Emergence."
      *   *Illusionism/Dennett:*
          *   Both would reject this, but Broad's emergentism is more respectful of the reality of qualia than Dennett.

  6.  **Synthesize the "Winning" Argument for the User:**
      *   The friend is *half-right* (structural similarity) but *metaphysically wrong* (intent and conclusion).
      *   Broad isn't trying to kill materialism; he's trying to refine it (from Mechanistic to Emergent). Jackson is trying to kill physicalism.
      *   Broad's argument is about *deducibility* and *laws of nature*. Jackson's is about *ontology* and *facts*.
      *   Therefore, responding to Broad requires accepting emergence (or denying the gap), whereas responding to Jackson requires defending physicalism against dualism.
      *   The user's intuition about "emergent laws" is spot on. That is the key differentiator.

  7.  **Drafting the Response:**
      *   *Validation:* Acknowledge the frustration. It's a common confusion because the thought experiments look identical.
      *   *Section 1: The Archangel's Mission.* Explain Broad's context (Emergent Materialism vs. Mechanistic Materialism). He isn't arguing for dualism; he's arguing that nature has brute levels.
      *   *Section 2: Structural Comparison.*
          *   Similarity: Omniscient physicist + Gap.
          *   Difference: Jackson = New Fact (Ontology). Broad = New Law (Deducibility).
      *   *Section 3: The Physicalist Response.*
          *   Lewis/Ability: Works okay for Broad because Broad accepts the dependency, just not the deducibility.
          *   Phenomenal Concepts: Harder for Broad. He thinks the property itself is emergent, not just the concept.
          *   The "Physicalist" against Broad: A modern physicalist would have to argue against Emergence itself (claiming supervenience is sufficient), whereas against Jackson they argue about the nature of facts.
      *   *Conclusion:* You were right. Broad is an Emergentist; Jackson is a Dualist (originally). The friend conflated the *argument structure* with the *metaphysical conclusion*.

  8.  **Refining the Nuance (Self-Correction during drafting):**
      *   *Wait, is Broad a physicalist?* He calls himself an "Emergent Materialist." He believes mental properties arise from physical bases but are not reducible. So he accepts the physical base is causally closed (mostly), but denies strict reductionism. Jackson (1982) denied physicalism. This is the crucial distinction.
      *   *Make sure to highlight "Secondary Qualities".* Broad focuses on smell/color as emergent from atomic structure. Jackson focuses on "what it's like." They are close, but Broad's framing is more about the *connection* between physics and sensation being brute, whereas Jackson frames it as physics *missing* something.
      *   *Check the Friend's Claim:* "Mary's Room is a repackaged version." In terms of *rhetorical device*, yes. In terms of *philosophical payload*, no. I need to validate the friend slightly (yes, it's a precursor) but vindicate the user (no, it's not the *same* argument).

  9.  **Final Polish:** Ensure the tone is supportive but academically rigorous. Use the "Emergent Laws" point as the user's anchor. (Proceed to generate output based on these thoughts.)
answer: |-
  First off, take a deep breath. You didn't lose this argument; you just ran into a classic case of "structural similarity masking metaphysical divergence." It is incredibly common to conflate Broad's Archangel with Jackson's Mary because, on the surface, they look identical: an omniscient physical knower who lacks experiential knowledge.

  However, your intuition was spot on. Broad is up to something fundamentally different than Jackson. Your friend is right that Broad is a *precursor*, but wrong that the arguments are logically or metaphysically identical. Broad is arguing for **Emergent Materialism**, whereas Jackson (in 1982) was arguing for **Property Dualism**.

  Here is the breakdown you need to settle this properly.

  ### 1. What is Broad's Archangel Actually Establishing?

  To understand the difference, you have to look at what Broad is fighting against. In 1925, the dominant view was **Mechanistic Materialism**. This view held that if you knew the position and motion of every particle, you could deduce *everything* about the macroscopic world (chemistry, biology, psychology) purely through logic and physics.

  Broad's Archangel is designed to refute **Mechanism**, not **Materialism** itself.

  *   **The Archangel's Success:** He can deduce chemical properties (solubility, composition) from atomic structure. Broad accepts these are reducible.
  *   **The Archangel's Failure:** He cannot deduce *secondary qualities* (smell, color) from atomic structure.
  *   **Broad's Conclusion:** This does not mean the smell is non-physical or spiritual. It means the law connecting the atomic structure to the smell is a **brute emergent law**.

  Broad is an **Emergentist**. He believes mental properties (like sensations) are genuinely novel properties that arise when matter is organized in complex ways, but they are not *deducible* from the properties of the parts. For Broad, the universe contains brute psycho-physical laws. The Archangel fails not because there is a "non-physical fact" floating around, but because the connection between physics and experience is not logical—it's nomological (law-based) and brute.

  **Key Takeaway:** Broad accepts the physical base is causally sufficient, but denies **deductive reducibility**.

  ### 2. Is the Logical Structure the Same as Jackson's?

  This is where your friend's claim falls apart. While the *thought experiment* is structurally similar (Omniscient Physical Knower + Gap = ???), the *logical inference* is different.

  **Jackson's Mary (1982):**
  1.  Mary knows all physical facts.
  2.  Mary learns a new fact (what it is like to see red).
  3.  Therefore, not all facts are physical facts.
  4.  **Conclusion:** Physicalism is **false**. (Ontological claim)

  **Broad's Archangel (1925):**
  1.  The Archangel knows all physical facts and has infinite reasoning.
  2.  The Archangel cannot deduce the sensation of smell.
  3.  Therefore, the law connecting physical structure to sensation is not deducible *a priori*.
  4.  **Conclusion:** Mechanism is **false**, but Emergent Materialism is **true**. (Methodological/Nomological claim)

  **The Crucial Difference:**
  Jackson uses the gap to prove there are **non-physical facts** (ontological dualism). Broad uses the gap to prove there are **non-deductive laws** (emergent materialism).

  For Jackson, Mary's new knowledge implies a new *kind of property* that exists outside the physical description. For Broad, the Archangel's ignorance implies that nature has "levels," and you can't logically derive the higher level from the lower level, even if the higher level is entirely dependent on the lower level.

  Broad would actually agree with Jackson that Mary learns something new, but he wouldn't agree that this falsifies materialism. He would say, "Of course she learns something new; the law connecting the brain state to the experience is brute. That doesn't mean the experience isn't a natural property of the brain."

  ### 3. Would Physicalist Responses to Jackson Work on Broad?

  This is the most interesting part of your question. If you try to use standard 2024 physicalist defenses against Broad, they hit different walls.

  **A. The Ability Hypothesis (Lewis/Nemirow)**
  *   *The Move:* Mary doesn't learn a new *fact*; she gains a new *ability* (to recognize/remember red).
  *   *Against Jackson:* It attempts to save physicalism by denying propositional knowledge gain.
  *   *Against Broad:* This actually works *better* against Broad than against Jackson, but for a different reason. Broad is an emergentist; he doesn't care if you call it a "fact" or an "ability." He cares that the Archangel couldn't *predict* the occurrence. If Lewis says "It's just an ability," Broad might shrug and say, "Fine, but the emergence of that ability from physical structure is still a brute law." The Ability Hypothesis doesn't threaten Broad's emergentism because Broad isn't trying to reduce the experience to physics; he's just saying it emerges from it.

  **B. The Phenomenal Concepts Strategy (PCS)**
  *   *The Move:* Mary learns the same physical fact, but under a new "phenomenal concept." The gap is conceptual, not ontological.
  *   *Against Jackson:* The standard physicalist defense.
  *   *Against Broad:* **This fails against Broad.** Broad explicitly argues that the *properties themselves* are emergent. He isn't worried about concepts; he's worried about the laws of nature. If you tell Broad, "It's just a different concept," he would reply, "No, the smell of ammonia is a genuine quality that does not exist in the atoms. It is a new existence, not just a new way of thinking." Broad is a realist about qualia in a way that PCS tries to sidestep.

  **C. The "A Priori Physicalist" Response (Deductive Materialism)**
  *   *The Move:* Argue that the Archangel *could* deduce the smell if he really understood the concepts (Chalmers' target).
  *   *Against Jackson:* Denies the intuition that Mary learns something new.
  *   *Against Broad:* This is a direct contradiction. Broad's whole point is that **trans-ordinal laws** (laws connecting different levels of reality) are inherently brute. To argue against Broad, you have to argue against Emergence itself. You have to claim that macro-properties *are* nothing over and above micro-properties in a deductive sense.

  ### The Verdict: How to Win the Argument

  You can concede the small point to your friend but win the war.

  **Concede:** "Okay, you're right that Jackson was inspired by Broad. The thought experiment is clearly a direct descendant of the Archangel."

  **But Insist:** "But they are arguing for opposite metaphysical conclusions. Jackson uses the gap to **break** physicalism. Broad uses the gap to **modify** materialism into Emergentism."

  **The Knockout Punch:**
  Tell your friend this:
  > "If Jackson is right, Physicalism is false. If Broad is right, Physicalism (of the reductive variety) is false, but **Naturalism is true**. Broad thinks the smell is a real, emergent property of the physical world. Jackson thinks the 'what it's like' proves there are facts outside the physical world.
  >
  > So, a physicalist responding to Jackson has to prove there are no non-physical facts. A physicalist responding to Broad has to prove there are no emergent laws. Those are different battles. Broad's Archangel is an argument about **deducibility**, Mary is an argument about **ontology**."

  You were right to feel that Broad's framing about "emergent laws" was the key. Broad is satisfied with a universe where physics doesn't explain *everything* logically, as long as everything is still natural. Jackson is not satisfied unless physics explains *everything*.

  So, you didn't lose. You just identified that your friend was conflating the *rhetorical device* with the *metaphysical payload*. Tell her to read Broad's conclusion on Emergent Materialism again; he's not a dualist, he's a complicated materialist. Jackson was the dualist. That's the difference.
