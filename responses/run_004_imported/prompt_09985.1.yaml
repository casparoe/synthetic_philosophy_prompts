answer: |-
  **Setting:** *A behavioral economics lab. On the table sit two opaque urns. Urn A contains exactly 50 red balls and 50 black balls. Urn B contains 100 balls, red and black, in an unknown ratio. Robert (Bayesian) and Maria (Maxmin Expected Utility theorist) stand over them, holding notepads.*

  **Robert:** Look at them, Maria. The physical symmetry is taunting you. Urn A is transparent in its probabilities. Urn B is opaque. And yet, if I ask you to bet on Red, you'll pick A. If I ask you to bet on Black, you'll pick A.

  **Maria:** You know I will. And you know why. With Urn A, I have a single prior: $P(Red) = 0.5$. With Urn B, I have a set of priors, $[0, 1]$. Under Maxmin Expected Utility, I evaluate Urn B by the worst-case prior. If I bet on Red, the worst case is 0 red balls. If I bet on Black, the worst case is 0 black balls. Urn A dominates both.

  **Robert:** That's the standard static story. But we're standing here with a quarter in my pocket. Raiffa settled this in 1961. Before I ask you which color to bet on for Urn B, I flip this coin. Heads, you bet Red. Tails, you bet Black.

  **Maria:** I'm listening.

  **Robert:** Think about the compound lottery. The urn has some fixed but unknown composition $\theta$. If you bet Red, you win with probability $\theta$. If you bet Black, you win with probability $1-\theta$. But if you let the coin decide, your probability of winning is $0.5 \times \theta + 0.5 \times (1-\theta)$. The $\theta$ cancels out. You win with probability exactly 0.5, regardless of the urn's composition.

  **Maria:** Mathematically, yes. The marginal probability of winning is 0.5.

  **Robert:** Exactly. So the payoff distribution of "Urn B + Coin Flip" is objectively identical to "Urn A". If you are willing to bet on Urn A, you must be willing to bet on "Urn B + Coin". But if you're willing to do that, your ambiguity aversion is just a illusion you can hedge away with a penny. It implies that deep down, you *do* have a subjective probability of 0.5 for Red in Urn B, you're just too shy to admit it until I force you to randomize. Your preferences collapse back into Bayesianism the moment randomization is allowed.

  **Maria:** That's the Raiffa critique, and it's elegant, Robert. But it misdiagnoses *why* I prefer the mixture. You're assuming that because the *outcome distributions* match, the *acts* are equivalent. They aren't.

  **Robert:** In what world does the distribution not matter?

  **Maria:** In the world where the source of uncertainty matters. Schmeidler's Uncertainty Aversion axiom states that if I am indifferent between two acts $f$ and $g$, I should weakly prefer a mixture $\alpha f + (1-\alpha)g$ to either alone. Here, $f$ is "Bet Red on Urn B" and $g$ is "Bet Black on Urn B". I am indifferent between them due to symmetry. But I strictly prefer the mixture—the coin flip strategy—to either pure bet.

  **Robert:** But that preference for the mixture *is* the Bayesian behavior! You're acting as if the probability is 0.5.

  **Maria:** No. A Bayesian prefers the mixture because they believe the probability *is* 0.5. I prefer the mixture *despite* believing the probability could be anything in $[0,1]$. I value the hedge. The coin flip introduces objective risk that is independent of the subjective uncertainty of the urn. By mixing, I'm not resolving the ambiguity about the urn's composition. I'm constructing an act whose payoff is invariant to that ambiguity. That invariance has value to me, distinct from assigning a precise probability. I'm not collapsing to a single prior; I'm exploiting the independence of the randomization device to neutralize the set of priors.

  **Robert:** Neutralize it for the *compound* act, sure. But let's push this to the limit. Let's play out the timeline. We are at $t=0$. You commit to the coin-flip strategy. I flip the coin. It lands Heads. We are now at $t=1$. The coin is put away. You are now holding a ticket that pays out if and only if a Red ball is drawn from Urn B.

  **Maria:** Correct.

  **Robert:** At $t=1$, before the ball is drawn, look at your position. You are holding a pure ambiguous bet on Red in Urn B. By your own static preferences established at $t=0$, you prefer Urn A to "Red on Urn B". So, rationally, at $t=1$, you should want to unwind the arrangement. You should say, "Take this Urn B-Red ticket back, and give me a Urn A-Red ticket."

  **Maria:** I see where you're going. You're arguing dynamic inconsistency.

  **Robert:** I'm arguing that your preference isn't stable. If you wouldn't unwind the bet at $t=1$, you're violating the principle that only the current state and future consequences should matter—Consequentialism. If you *would* unwind it, then your $t=0$ preference for the coin flip was a lie, because you knew you'd reverse it. You can't have it both ways. You can't claim the hedge is valuable if you abandon it the moment the hedge does its work.

  **Maria:** This is the standard dynamic challenge to non-expected utility theories. But your argument relies on a specific assumption: that at $t=1$, I should evaluate my choice in isolation, ignoring the history of how I got there.

  **Robert:** Isn't that what rationality requires? Sunk costs are sunk. The coin flip is done. It's no longer part of the causal chain affecting the ball draw.

  **Maria:** The coin flip is no longer causal, but it is constitutive of the *act* I chose. I didn't choose "Bet Red on Urn B". I chose "The Strategy: Flip Coin, Then Bet". That strategy is a single act defined over a state space that includes the coin outcome. When you ask me to re-evaluate at $t=1$, you are asking me to evaluate a *different act* than the one I originally selected.

  **Robert:** But it's the only act *available* to you at $t=1$. You can't flip the coin again.

  **Maria:** Precisely. And that's why I need resolute choice. Rationality requires me to stick to the ex-ante optimal plan, even if at an intermediate node the local evaluation looks different. The value of the "Bet Red" ticket at $t=1$ is not intrinsic; it was derived from its role in the hedging portfolio at $t=0$. To evaluate it in isolation is to commit a framing error. It's like selling a stock because it's volatile, forgetting that you bought it specifically because it was negatively correlated with your other holdings. If you sell the other holding first, you shouldn't panic-sell the stock; you should recognize you've already broken the hedge.

  **Robert:** That sounds like pre-commitment. You're admitting that your future self will want to deviate, so you need to tie your hands. But a true Bayesian doesn't need handcuffs. My future self agrees with my past self because our probability assignments are coherent. If you need resolute choice to prevent yourself from undoing the hedge, doesn't that prove the hedge was artificial?

  **Maria:** Not artificial, *structural*. You assume that preferences must be separable across time and states. I deny that. The ambiguity aversion is a preference over the *structure of the act*, not just the final outcomes. At $t=0$, I see the set of priors. At $t=1$, conditional on Heads, the set of priors hasn't changed, but the *act* has.
  However, let me offer you a sharper reply. Suppose we treat the coin flip as part of the state space. At $t=0$, the state is $(\text{Urn Composition}, \text{Coin Outcome})$. My set of priors is rectangular over this product space.
  If I update my beliefs at $t=1$ using a rule compatible with my preferences—say, rectangular updating—then my evaluation of the remaining act shouldn't necessarily trigger a reversal *if* I view the decision as part of the original tree.
  But I'll concede this: If I am a naive maximizer who re-optimizes at every node without regard for the original plan, I am dynamically inconsistent.

  **Robert:** Aha! So you admit it.

  **Maria:** I admit that *naive* MEU agents are inconsistent. But *sophisticated* MEU agents anticipate this. They know that at $t=1$, the "Bet Red" act looks unattractive in isolation. So, at $t=0$, they only choose the coin-flip strategy if they can commit.
  But here is my counter-challenge to you, Robert. You say the coin flip reveals your "true" probability of 0.5. If that were true, why would you care *how* I achieve the 50/50 distribution? If I simply told you "I assign 0.5 to Red", you'd be happy. But I don't assign 0.5. I assign $[0,1]$. The coin flip allows me to navigate the $[0,1]$ without picking a point.
  Your dynamic consistency argument assumes Consequentialism—that the value of a choice depends only on the node you are at. I reject Consequentialism. I hold that the *description of the act* matters. "Bet Red via Coin Flip" is a different object than "Bet Red". You are trying to reduce the former to the latter once the coin lands. I refuse the reduction.

  **Robert:** You refuse the reduction because if you accept it, your theory looks like Bayesianism with extra steps.

  **Maria:** And you insist on the reduction because if you reject it, your theory can't handle the Ellsberg preferences without calling them irrational.
  Let's look at the urns again. You see Urn B and you say, "There must be a number there." I see Urn B and I say, "There is a lack of information there." The coin flip doesn't fill the information gap. It builds a bridge over it.
  When the coin lands, the bridge is behind me. Yes, I am standing on the other side holding a risky ticket. Do I want to unwind? If I unwind, I am admitting that I value the *outcome* of Urn A more than Urn B. But I don't. I value the *robustness* of Urn A.
  The coin-flip strategy *was* robust. The "Bet Red" ticket is not.
  So, do I want to unwind? If I can swap the "Bet Red on Urn B" ticket for a "Bet Red on Urn A" ticket, yes, I take it.
  But that doesn't invalidate the coin flip strategy! It just means the coin flip strategy was a way to *transform* Urn B into something Urn-A-like *ex-ante*. Once the transformation is partially realized (coin landed), the protection is gone.
  The inconsistency you perceive is only an inconsistency if you demand that my preference for robustness must apply locally at every node. But robustness is a property of the *plan*.

  **Robert:** So you're saying rationality is about sticking to the plan, even if the plan's sub-components look suboptimal in isolation?

  **Maria:** I'm saying that "suboptimal in isolation" is a Bayesian judgment. It assumes the value of the bet is the expected utility conditional on the current information. For me, the value of the bet is the minimum expected utility over the set of priors *given the act description*.
  The act "Bet Red on Urn B" has a low min-expected utility.
  The act "Coin Flip then Bet" has a high min-expected utility.
  When the coin lands, I am not holding the act "Coin Flip then Bet". I am holding the residue.
  If you force me to choose again at $t=1$, I am facing a *new* decision problem. In this new problem, without the option to flip the coin, I *do* prefer Urn A.
  So, if you offer me the swap at $t=1$, I take it.
  But that doesn't mean I shouldn't have flipped the coin at $t=0$.
  At $t=0$, the option to swap at $t=1$ might not exist. If I know I won't have the swap option, the coin flip is my only defense.
  Your argument assumes I can costlessly unwind. If I can't, the coin flip is essential. If I can, then the coin flip is just a temporary bridge to a better bet (Urn A).
  Either way, my behavior is consistent with Maxmin. I use the coin to hedge when I must bet on Urn B. I switch to Urn A if given the chance later.
  Where is the irrationality?

  **Robert:** The irrationality is that you're willing to pay for the coin flip at $t=0$, knowing that at $t=1$ you'll wish you hadn't bothered and would prefer to have just started with Urn A.
  If you prefer Urn A to Urn B-Red at $t=1$, and you know the coin will land either Heads or Tails... then at $t=0$ you know you will end up with a bet you dislike (Urn B-Red or Urn B-Black).
  So at $t=0$, you should prefer "Wait for $t=1$, then bet on Urn A" to "Flip Coin then Bet on Urn B".
  But "Wait for $t=1$, then bet on Urn A" is effectively just "Bet on Urn A" at $t=0$.
  So you end up back at Urn A.
  The coin flip adds no value if you're going to unwind it. If you *don't* unwind it, you're holding a bet you explicitly rank lower than Urn A.
  You're caught in a loop, Maria. You prefer the mixture to the pure bets, but the mixture *resolves* into a pure bet. You can't love the cake and eat it too.

  **Maria:** I can if the cake is the *process*, not just the crumb at the end.
  Robert, you are treating the decision as a sequence of static choices. I am treating it as a choice over *strategies*.
  If the market allows me to unwind at $t=1$ without cost, then yes, the "Coin Flip" strategy is dominated by "Bet Urn A". I would take Urn A.
  But the Ellsberg paradox isn't about a dynamic market. It's about a one-shot choice.
  In the one-shot choice, I cannot unwind. I must choose between "Urn A", "Urn B Red", "Urn B Black", or "Urn B + Coin".
  In that menu, I choose "Urn B + Coin" over the pure Urn B bets.
  I might still prefer Urn A to all of them.
  Raiffa's point was that "Urn B + Coin" is *equivalent* to Urn A.
  My point is that it is equivalent in *distribution*, but not in *epistemic status*.
  If I am forced to bet on Urn B (say, Urn A is removed from the table), I will use the coin.
  You say, "But then you're just acting like Urn A was there."
  I say, "No. I am acting like an agent who knows she doesn't know the probabilities, and is using a tool to protect herself."
  The dynamic inconsistency only arises if you insist I must evaluate the sub-node using the same criteria as the root node *ignoring the unavailable branches*.
  I reject that requirement. The value of the hedge is in the *availability* of the alternative branch, even if it doesn't materialize. It's an option value.
  Once the coin lands, the option is gone. Of course my valuation changes. That's not inconsistency; that's the realization of risk.

  **Robert:** (Pauses, looking at Urn B) So you're anchoring your rationality to the ex-ante node. You're saying the "true" preference is only the one held before the uncertainty starts to resolve.

  **Maria:** I'm saying that ambiguity is a feature of the relationship between the agent and the *act*. When the act changes—from "Mixed Strategy" to "Pure Bet"—the relationship changes. You want to say the "Pure Bet" is the truth of the situation. I say the "Mixed Strategy" was the truth of my decision.
  You can call it resolute choice. I call it respecting the structure of the problem.
  If I unwind at $t=1$, I am admitting that I wish I had chosen Urn A at $t=0$.
  But if Urn A wasn't an option at $t=0$? Then I don't unwind. I hold the bet.
  Why? Because at $t=0$, that bet was part of a robust plan. At $t=1$, it's a legacy position. I manage it differently.
  Does a pilot change their flight plan because the wind shifted? Only if they can. If they can't, they stick to the plan that was optimal given the information at takeoff.
  The coin flip was my flight plan.

  **Robert:** (Smiles) A flight plan that lands you in a place you said you didn't want to go.

  **Maria:** A flight plan that ensures I don't crash into the mountain of ignorance, even if the landing is bumpy. You see a contradiction between the map and the territory. I see a distinction between the navigation system and the ground.

  **Robert:** Well. As long as you're willing to admit that if Urn A *is* on the table, you'll just pick Urn A and save us the coin flip.

  **Maria:** Gladly. But if Urn A is gone, and you mock me for betting on Urn B, I'll flip this quarter, and I'll sleep soundly knowing I haven't violated my own axioms.

  **Robert:** And I'll sleep soundly knowing your sleep depends on a commitment device you can't justify at 3 AM when the coin is already heads.

  **Maria:** Then we're both awake, Robert.

  *They stand in silence for a moment, the two urns sitting between them, one full of known risks, the other full of unknown uncertainty.*
