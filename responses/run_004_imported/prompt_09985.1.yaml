      *Wait, a stronger MEU reply exists:* The state space for the mixed act includes the coin outcome. The ambiguity is about the Urn. The coin is risk. The mixture reduces ambiguity because the *combined* uncertainty (Urn + Coin) has a known probability structure for the win event, whereas the pure bet does not. When the coin lands, you are back to pure ambiguity. The dynamic inconsistency arises if you demand *consequentialism* (ignoring foregone opportunities). MEU theorists can reject consequentialism. I will have Maya explicitly reject the requirement to evaluate the sub-node in isolation.

