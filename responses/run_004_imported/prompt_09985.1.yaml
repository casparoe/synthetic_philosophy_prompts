      *Let's refine the "best reply".* Actually, the most sophisticated reply in the literature (e.g., from Epstein & Schneider) involves *Rectangularity* of the set of priors. If the set of priors is rectangular, dynamic consistency holds. But in the standard Ellsberg case, the set of priors is usually *not* rectangular with respect to the coin flip if the coin is external.
