prompt: |-
  So this happened this week when a couple friends of mine were watching a basketball game at a bar, and it's kinda been stuck in my head since. They got into this whole argument over a dumb prop bet on whether a player was going to make his next free throw late in the game. Going move by move: (1) Jake said take the "yes," becasue the guy shoots 84% for the season on something like 400 attempts, which is just way more data than anyone at the table had for anything else. (2) Claire said that number's misleading in this exact spot, because it's a clutch, late-game free throw, second night of a back-to-back, on the road, and the guy's percentage in exactly those situations this year is something like 65% on only 20 attempts. (3) Jake said 20 shots is basically noise, could easily just be sampling variance, and if you let yourself carve a season into any subset that sounds plausible (clutch, back-to-backs, road games, whatever) you can always dig up some small slice that makes a guy look worse, which is basically p-hacking. (4) Claire said this wasn't some random slice she went fishing for though, fatigue and crowd noise messing with free-throw shooting is an actual documented thing in sports science, so there's a real mechanism behind that specific split, not just a coincidence, and Jake saying "unless there's a real mechanism" already concedes the true number is somewhere between 65 and 84, not just 84. (5) Jake said ok fine, but then where does it stop, you could tell an equally plausible mechanism story about the specific defender guarding him, the specific ref crew, the exact score, whatever, and if you keep narrowing every time somebody's got a story you eventually end up with a sample size of one single game and zero usable stats, so "narrow it whenever there's a mechanism" isn't actually a stopping rule. Claire admitted there's no clean place to stop, but said that cuts both ways, nobody having a principled stopping point doesn't mean the honest default is the broadest number either, thats just where people happen to give up.

  Nobody at the table could actually settle it, and honestly neither could I. Can you go through it move by move and say who's got the better argument at each step, rather than just picking an overall winner? And if you think there's some deeper issue sitting underneath their whole argument that neither of them is quite naming, I'd like to hear what that is too.
