prompt: |-
  ok so we did this unit in my philosophy elective on "dispositions" and it kinda broke my brain, i keep thinking about it. the basic textbook idea is that something HAS a disposition (like a glass being fragile) just in case it would do the thing if the trigger happened - fragile means "would break if struck." but then there's two famous counterexamples that mess up that whole definition: finks and masks.

  a fink is when the disposition switches on or off at literally the exact moment its being tested. theres this classic example (C.B. Martin i think?) of a wire hooked up to a machine that senses when somethings about to touch it and makes the wire go live right at that instant, so it shocks you even tho a second earlier it wasnt live at all. or the reverse: a genuinely live wire hooked to a machine that kills the power the second you touch it, so it never shocks you even tho it was 100% live the whole time.

  a mask is different - the disposition is still really there, its just being blocked from showing up. like a glass thats genuinely fragile but is bubble-wrapped so it wont break no matter how many times you drop it.

  can you write me an actual short story (not a definition with a plot slapped on top, like a real story, kinda Black Mirror/Ted Chiang vibes) where the whole plot turns on whether a character REALLY has some trait - courage, loyalty, love, whatever you pick - or whether its being finked or masked by something around them, in a way where you genuinely cant tell which it is until it counts. you pick the trait and setting, i just need the fink/mask thing to actually be the engine of the story and not just decoration.
