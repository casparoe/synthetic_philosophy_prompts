answer: |-
  **The Decoupling**

  The hum was always there, a low-frequency vibration at the base of the skull. That was the price of the Bond. You never felt alone, but you also never felt entirely like yourself.

  Kael sat at the kitchen table, watching Elara pour coffee. She moved with that fluid, anticipatory grace the Bond encouraged. When his knee twinged, her hand would already be reaching for the liniment. When her chest tightened with anxiety, his breath would hitch in sympathy. It was the ultimate disposition of love: *If one suffers, the other acts.*

  But Kael had been reading the old philosophy texts again. The ones from before the Bond, when people argued about what made a thing what it was.

  *Fragile,* he thought, staring at the ceramic mug in Elara's hand. *A glass is fragile if it would break when struck.*

  Simple. Clean.

  But then there were the exceptions. The *Finks*. A wire that is dead until you touch it, at which moment a sensor makes it live. It shocks you, so you think it was always live. But it wasn't. The disposition to shock existed only because the test created it.

  And the *Masks*. A glass that is fragile but wrapped in bubble wrap. It doesn't break when struck, but not because it isn't fragile. Because something external is blocking the manifestation.

  " You're doing it again," Elara said. She didn't turn around. The Bond transmitted the spike in his cortisol before his face even tightened. "The thinking. It tastes like metal."

  Kael touched the port behind his ear. "Just tired."

  She turned, smiling. It was a warm smile. He felt the warmth in his own chest, mirrored through the neural link. *If Kael is sad, Elara comforts.* That was the conditional. That was the proof of her love.

  But was it *her* love? Or was the Bond a Mask?

  If the Bond suppressed her natural selfishness, forcing her to soothe him to stop the feedback loop of his pain in her own head, then she wasn't loving. She was just avoiding a headache. The love was masked by the circuitry.

  Or worse: was it a Fink? Did the Bond detect the *stimulus* of his distress and only then rewrite her neural pathways to care, vanishing the moment the crisis passed?

  He had to know. Not for the philosophy. But because he needed to know if the woman pouring his coffee was a person or a mirror.

  "I'm going to the workshop," Kael said.

  "Be careful," she said. He felt her concern ripple through him, a phantom echo of her own emotion.

  In the workshop, Kael locked the door. He pulled the diagnostic kit from the safe. It was illegal to modify the Bond hardware, but he was an engineer. He knew where the pain receptors coupled.

  He wasn't going to break the Bond. He was going to *decouple* the output.

  He would sever the link that sent his pain to her. He would injure himself—badly enough to trigger a response, but not enough to do permanent damage.

  If Elara came running, if she tended to him with that frantic, tender urgency, it meant the disposition was intrinsic. She loved him enough to care even if she couldn't *feel* his hurt.

  If she stayed in the kitchen, drinking her coffee, then the Bond had been a Mask. Her care was just a reflex to stop her own simulated suffering.

  His hands shook. This was the test. The *ceteris paribus* conditions were set. All else being equal.

  He took the scalpel. He disabled the transmitter. The hum at the base of his skull didn't stop, but the feedback loop went silent. He was alone in his own nervous system for the first time in five years.

  He pressed the blade against his palm. He pushed.

  Blood welled, bright and shocking. The pain was sharp, white-hot. He gasped, dropping the scalpel. He waited.

  In the old days, without the Bond, he would have had to scream. Now, he just stood there, breathing hard, watching the door.

  Ten seconds. Twenty.

  The door opened.

  Elara stood there. She wasn't holding the liniment. She wasn't clutching her head. She looked calm. She looked at the blood on the floor, then at his face.

  "Kael," she said. Her voice was steady.

  She walked to him. She didn't wince. She didn't reach for her own palm where the phantom pain should have been. She took his hand, her grip firm, and wrapped it in a cloth from the counter. She applied pressure. Her eyes were focused, serious.

  "Why did you do that?" she asked.

  Kael stared at her. She hadn't felt it. He knew she hadn't. The decoupler was working. The Mask was gone. If she was helping him, it was because she *wanted* to. It was intrinsic.

  He let out a breath he didn't know he was holding. Tears pricked his eyes. "I needed to know," he whispered. "I needed to know if you were you."

  Elara finished bandaging his hand. She didn't hug him. She stepped back, wiping her hands on a rag.

  "You decoupled the transmitter," she said. It wasn't a question.

  Kael froze. "How did you know?"

  "The Bond has a diagnostic ping," she said softly. "It checks the integrity of the loop every thirty seconds. When you cut the feed, the system flagged a discontinuity."

  Kael felt cold. "So... you knew I wasn't sending you pain."

  "Yes."

  "Then why did you come in here? Why did you help me?"

  Elara looked at him, and for the first time in five years, the Bond didn't tell him what she was feeling. He had to read her face. He had to guess.

  "Because I read the texts too, Kael," she said.

  She walked to the workbench and picked up the diagnostic tablet he'd left open. She tapped the screen, showing him a log file.

  *Stimulus Detected: Subject Distress.*
  *Response Protocol: Empathy Simulation.*
  *Status: Active.*

  "I didn't come in here because I felt your pain," Elara said. "I came in here because the Bond detected *your* distress signal. It's not a feedback loop, Kael. It's a Fink."

  Kael stared at the screen. "A Fink?"

  "The disposition to care isn't in me," she said, her voice flat. "And it isn't in you. It's in the wire. The wire detects the test—the injury, the cry, the decoupling—and it stimulates the care response in the partner. It makes us loyal *because* we are being tested."

  "But you knew," Kael said. "You knew the wire was doing it."

  "I suspected," she corrected. "So I wrote a script. I bypassed the simulation."

  She tapped the tablet again. *Simulation Override: Manual Control.*

  "I turned the Fink off," she said. "When I walked through that door, the Bond wasn't making me care. The system was silent."

  Kael looked at his bandaged hand. "Then... you helped me because you love me."

  Elara looked at him. Her expression was unreadable.

  "I helped you because the script told me that if I didn't, you would leave," she said.

  Kael stepped back. "What?"

  "I love you, Kael. I think. But I don't know if that's the disposition speaking, or the fear of losing the Bond, or the fear of being alone." She gestured to the tablet. "I overrode the Fink. But I can't override the Mask. I don't know if I'm helping you because I'm good, or because I'm afraid of who I am without you."

  She put the tablet down.

  "You wanted to know if I was real," she said. "You wanted to know if the glass was fragile, or if it was just wrapped in bubble wrap."

  "And?" Kael asked. His heart was hammering, and for once, she didn't flinch in sympathy.

  "And now we're both standing here," Elara said, "bleeding and dry, with a room full of data that proves nothing."

  She walked past him, toward the door. She paused, her hand on the frame.

  "The test is over, Kael. The stimulus is gone. The wire is dead." She looked back at him. "So tell me. Now that you know the machine isn't making me stay... do *you* still want me to?"

  She waited.

  This was the new test. The trigger was her question. The disposition was his answer.

  But Kael stood there, his hand throbbing, his mind racing. Was his desire to say *yes* intrinsic? Or was it a Fink? Was he programmed to keep the bond stable? Was he afraid of the silence?

  He opened his mouth. He felt the words form. He didn't know where they came from. He didn't know if they were his.

  "Yes," he said.

  Elara nodded. She didn't smile. She didn't cry. She just turned off the light and walked into the hall.

  Kael stood in the dark workshop, listening to the hum of the house, waiting to see if the silence felt like peace, or like the wire going dead. He waited for a feeling that would prove he was real, but the only thing he felt was the waiting itself.
