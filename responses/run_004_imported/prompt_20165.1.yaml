answer: |-
  I'm taking your side. The **Knowledge Norm of Assertion (KNA)** is the correct standard, and Theo's appeal to "reasonable belief" collapses under scrutiny.

  The KNA, most famously championed by Timothy Williamson, states the following constitutive rule: **One must assert $p$ only if one knows $p$.**

  This isn't just a suggestion about politeness or prudence; it is the *constitutive norm* of the speech act of assertion. Just as the rule "the bishop moves diagonally" constitutes the game of chess, the rule "assert only what you know" constitutes the practice of assertion. When you assert, you implicitly represent yourself as knowing. If you don't know, you are breaking the rules of the game, even if no one calls you out on it.

  Here is the committed argument for why KNA wins, how it demolishes the Lottery case, and how we handle the Creationist Teacher without surrendering the norm.

  ### 1. The Lottery Case: Why Justification Isn't Enough
  Your intuition on the lottery ticket is spot on, and it is the strongest weapon against Theo's "Justified Belief" norm.

  In epistemology, we distinguish between **statistical probability** and **epistemic warrant**. In the lottery case, you have a 99.9999% justified belief that your ticket lost. By Theo's standard, you should be able to walk up to a friend and flatly assert, "My ticket lost." But you can't. If you did, your friend would be right to say, "You don't know that yet."

  Why? Because knowledge requires **Safety**. A belief is safe if, in nearby possible worlds where you form that belief in the same way, the belief is true.
  *   **Safe Belief:** You look out the window and see rain. You believe it's raining. In nearby worlds where you look out the window and see rain, it *is* raining.
  *   **Unsafe Belief (Lottery):** You believe your ticket lost based on odds. But there is a nearby possible world (the one where the balls bounce differently) where you form the *exact same belief* based on the *exact same odds*, but the belief is **false** (you won).

  Because your belief isn't safe, it isn't knowledge. Since KNA says assertion requires knowledge, you cannot assert "I lost." You can only assert "I *probably* lost."

  If we accepted Theo's Justified Belief norm, we would have to admit that asserting "I lost" is perfectly proper. But it feels deeply wrong. Why? Because assertion transfers **epistemic authority**. When I assert $p$, I invite you to rely on $p$ as a premise in your own reasoning. If I assert "I lost" based on odds, and you bet your rent money based on my assertion, I have misled you—not because I lied, but because I presented a probabilistic guess as a settled fact. KNA explains this breach of trust; the Justified Belief norm does not.

  ### 2. Moore's Paradox: The Linguistic Proof
  There is a linguistic phenomenon that seals the deal for KNA. Consider **Moore's Paradox**:
  > *"It is raining, but I don't believe it is raining."*

  This sentence is logically possible (I could be self-deceived), but it is **unassertable**. You cannot say it out loud without sounding insane. Why? Because asserting "It is raining" represents me as *believing* it is raining.

  Now, consider the Knowledge version:
  > *"It is raining, but I don't know it is raining."*

  This is also unassertable in normal conversation. If you assert $p$, you represent yourself as knowing $p$. If you immediately undercut that by saying "but I don't know," you violate the constitutive rule of the act you just performed.

  If Theo were right, and the norm were merely Justified Belief, then saying *"It is raining, but I don't know it"* should be fine, provided I have good evidence. But it's not fine. It sounds like a retraction. This suggests that the very act of assertion *packages* the content as knowledge. To assert without knowledge is to misrepresent your epistemic position.

  ### 3. Handling the Creationist Teacher (The Hard Part)
  Now, we have to deal with Jennifer Lackey's famous counterexample, which Theo threw at you. The devout Creationist teacher asserts "Humans evolved from primates" to her class. She has overwhelming evidence (justification), the statement is true, but she doesn't believe it (so she doesn't know it). Intuitively, she's doing a good job. Doesn't this prove KNA is wrong?

  No. It proves we need to distinguish between **Propriety** and **Blamelessness**.

  **The Distinction:**
  *   **Propriety:** Did the agent follow the constitutive norm of the speech act?
  *   **Blamelessness:** Is the agent morally or professionally culpable for violating the norm?

  You can violate a norm blamelessly. Imagine a doctor who prescribes a medication that violates standard medical protocols (the "norm" of prescription) because it's the only thing available in a war zone to save a life. She violated the protocol, but we don't blame her. In fact, we praise her. But we don't say the protocol wasn't the rule.

  **Applying it to the Teacher:**
  The Creationist teacher is in a specialized institutional role. Her job is not to express her own personal epistemic state, but to act as a **conduit for the scientific community's knowledge**.
  1.  **Strict KNA View:** Qua *assertor*, she is violating the Knowledge Norm. She does not know $p$ (because she lacks belief), so she should not assert $p$.
  2.  **The Override:** However, she is operating under a **higher-order professional norm** (educational duty) that overrides the standard epistemic norm. She is essentially saying, "The scientific community knows $p$, and I am hired to transmit that knowledge."

  When she asserts "Evolution happened," she is not asserting *on her own behalf*. She is asserting *on behalf of biology*. If she were at a dinner party and said the same thing, adding, "I don't believe this, but..." it would be bizarre and improper assertion. In the classroom, the context shifts the **warrant source**.

  However, to save KNA, we must maintain that her assertion is *epistemically improper* even if *professionally required*. This explains why, if a student asks, "Do *you* believe evolution happened?", she cannot answer "Yes" without lying. She has to hedge: "The evidence shows..."

  If we accept Theo's view (Justified Belief is enough), we lose the ability to criticize her epistemic state at all. We have to say she *fully* knows it. But she doesn't. She lacks the doxastic commitment. KNA allows us to say: "She is a good teacher, but she is not making a standard assertion. She is performing a pedagogical speech act that borrows warrant from the discipline."

  ### 4. Why Theo's "Reasonable Belief" Fails
  Theo wants a lower bar because he thinks KNA is "too strict for normal conversation." This is a pragmatic objection, not an epistemic one.

  If we lower the norm to Reasonable Belief, we lose the **value of testimony**. The whole point of assertion is to expand the knowledge of the listener.
  *   If I assert based on Knowledge, I give you the opportunity to Know (via testimony).
  *   If I assert based on Reasonable Belief, I only give you the opportunity to have Reasonable Belief.

  If the norm were merely Reasonable Belief, the chain of knowledge would degrade. A tells B (based on belief), B tells C (based on belief). By the time it gets to F, no one knows anything; they just have a chain of probabilities. KNA ensures that assertion is a **knowledge-preserving mechanism**.

  ### The Verdict
  You were right in the argument. Theo's flight tracking app gave him *justified true belief* (assuming it landed), but until he verified it, he lacked the **safety** required for knowledge. If the app had a glitch (a nearby possible world), he would have believed it landed when it hadn't.

  *   **Lottery Case:** Proves probability $\neq$ knowledge $\neq$ assertability.
  *   **Moore's Paradox:** Proves assertion represents itself as knowledge.
  *   **Teacher Case:** Proves that professional duty can make a KNA-violation *blameless*, but it doesn't make it *compliant*.

  Stick to the Knowledge Norm. It's the only one that respects the gravity of telling someone "This is how the world is." Anything less is just guessing with confidence.
