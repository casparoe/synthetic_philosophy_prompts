      *   *Newton's View:* God is not just a creator but a *Sustainer* (Providence). The universe isn't a deistic clockwork; it's a kingdom. God's active will is necessary for coherence.
      *   *Leibniz's View:* Deistic/ Rationalist. God is perfect; a perfect machine doesn't break. Intervention implies imperfection.
      *   *Laplace's Math:* Secularized the stability. Showed the system is mechanically self-correcting (on certain timescales).
      *   *Would Newton Concede?*
