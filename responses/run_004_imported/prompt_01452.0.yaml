answer: |-
  This is a fantastic question that cuts to the heart of the difference between **decision theory** (single-agent) and **economic equilibrium** (multi-agent). You are right to feel the tension; it is one of the most famous "paradoxes" in the economics of information.

  The short answer is: **Good's Theorem assumes the opportunity set (the menu of available actions) is fixed and independent of the information.** The Hirshleifer effect arises precisely because public information changes the opportunity set by altering the behavior of other agents in the market.

  Here is the walkthrough of why the assumptions diverge, why the "ignore it" argument fails in the Hirshleifer setup, and how to think about the bonus question.

  ---

  ### 1. The Crucial Assumption Good's Theorem Makes

  Good's Theorem is a result of **single-agent decision theory**. It relies on a specific structure of the value function.

  Let $V(I)$ be the value of information structure $I$. Good's proof shows that $V(I) = E[\max_a E[U(a, \theta) | I]] \geq \max_a E[U(a, \theta)]$.
  The mathematical engine here is the convexity of the $\max$ operator (Jensen's Inequality).

  For this to hold, three conditions must be met:
  1.  **Single Agent:** Your payoff depends on your action and the state of the world, $U(a, \theta)$. It does not depend on *other people's actions*.
  2.  **Fixed Action Space:** The set of available actions $A$ is the same whether you have information or not.
  3.  **Exogenous Payoffs:** The payoff function $U$ itself does not change based on who knows what.

  In the standard Good's Theorem setup, if you receive a signal, you can always say, "I will pretend I didn't see that and take the action I would have taken anyway." Since you have the option to update *or* not update, and you are a maximizer, you will never be worse off.

  ### 2. How Hirshleifer Violates These Assumptions

  In the Hirshleifer effect (often called the **destruction of risk-sharing opportunities**), we move from decision theory to **general equilibrium**.

  **The Setup:**
  *   **Agents:** Many risk-averse farmers.
  *   **Actions:** Signing insurance contracts (trading state-contingent claims).
  *   **Timing:**
      1.  Farmers have endowments (risky harvest).
      2.  **Information Event:** A forecast arrives (Public).
      3.  **Trading:** Farmers sign contracts.
      4.  **Resolution:** Harvest happens.

  **The Violation:**
  The Hirshleifer effect violates the **Fixed Action Space** and **Exogenous Payoffs** assumptions.

  In Good's world, the "menu" of actions is static. In Hirshleifer's world, the "menu" of actions (insurance contracts) is **endogenous** to the information structure.
  *   **Without Info:** Farmers face uncertainty. Because they are risk-averse, they value consumption smoothing. There are **gains from trade**. Farmer A sells "rain insurance" to Farmer B. Both expect higher utility.
  *   **With Public Info:** The uncertainty is resolved *before* trading. If everyone knows the harvest will be bad, no one will sell insurance against a bad harvest (the price would be 1:1, offering no risk premium). If everyone knows it will be good, no one needs to buy insurance.

  **Why the "Ignore It" Argument Fails:**
  You asked: *"How could looking at more evidence... make you worse off... given that 'don't update on it' is always still an option?"*

  In the Hirshleifer setup, **you do not have the option to ignore it.**
  Because the information is **public**, your counterparty sees it too. Even if *you* want to pretend you didn't see the forecast and trade at the old "risky" prices, *the market* will not let you. The market prices adjust to the new information immediately. The specific contracts that allowed you to share risk **cease to exist** because the counterparty no longer faces the risk you want to offload.

  You are not choosing from the same menu of actions. The menu has shrunk. Good's Theorem proves you won't do worse choosing from a menu *given* the menu exists. It does not prove the menu itself won't vanish.

  ### 3. Resolving the Tension

  The tension dissolves when you realize Good's Theorem measures the **private value of information to a decision maker holding the environment constant**, whereas the Hirshleifer effect measures the **social value of information when the environment (market prices/availability) adjusts.**

  *   **Good's Theorem:** Partial Equilibrium. (I know more, world stays same).
  *   **Hirshleifer:** General Equilibrium. (I know more, world reacts, opportunities vanish).

  In technical terms, Good's Theorem assumes the payoff function is $U(a, \theta)$. In the Hirshleifer effect, the payoff function is effectively $U(a, \theta, P(I))$, where $P(I)$ represents the market prices/availability which are a function of the information $I$ held by the population. Since $P(I)$ changes, the convexity argument no longer guarantees a non-negative value.

  ### 4. The Bonus: Is it a Prisoner's Dilemma?

  You asked: *"Is there a sense in which Good's theorem is still quietly true for each farmer taken in isolation... sort of like a prisoner's-dilemma structure?"*

  This is a very sharp intuition, but calling it a Prisoner's Dilemma (PD) is indeed "too cute," though it's in the right neighborhood. Here is the nuance:

  **Why it's not a Prisoner's Dilemma:**
  In a PD, players have a **dominant strategy** to defect, leading to a Nash Equilibrium that is Pareto inferior.
  In the Hirshleifer scenario, the farmers *want* to cooperate (share risk). They aren't choosing to "defect" on the insurance market. The information simply **removes the incentive compatibility** for the trade. It's not that they are strategically stabbing each other in the back; it's that the "back" (the risk) has disappeared, so there's nothing to stab.

  **Where Good's Theorem still holds (The "Isolation" Test):**
  If you take a single farmer and put them on a desert island (no market, no trading partners), Good's Theorem **does hold**.
  *   *Scenario:* Lone farmer knows a storm is coming (info).
  *   *Action:* He eats less today to save for tomorrow.
  *   *Result:* He is better off knowing the storm is coming than being surprised.
  *   *Why:* The "action space" (how much to eat) is fixed and under his sole control.

  **The Real Structure: Negative Externality of Information**
  The "badness" shows up only when you zoom out because information creates a **negative externality on the risk-sharing environment**.
  *   My knowing the truth prevents me from insuring you.
  *   Your knowing the truth prevents you from insuring me.
  *   Collectively, we lose the "insurance pie."

  So, Good's Theorem is true for the **consumption decision** (how to eat the harvest), but false for the **trading decision** (how to allocate the harvest risk) because the trading decision depends on *mutual ignorance*.

  ### Summary

  1.  **Violated Assumption:** Good's Theorem assumes a **fixed action space**. Hirshleifer shows that public information can make beneficial actions (risk-sharing trades) **infeasible** because counterparties update their prices.
  2.  **Why "Ignore It" Fails:** You cannot ignore public information because **market prices** reflect the information whether you personally acknowledge it or not. You cannot trade at "ignorant prices" in a "knowing market."
  3.  **Bonus:** Good's Theorem holds for the individual in **autarky** (isolation). The welfare loss is a **general equilibrium effect**, not a Prisoner's Dilemma. It is not that individuals act against their interest; it is that the *gains from trade* themselves are a function of uncertainty, and information destroys uncertainty.

  You can think of it this way: **Good's Theorem says information helps you slice the pie optimally. Hirshleifer says information can sometimes make the pie smaller.** Since Good's Theorem assumes the pie size is fixed (dependent only on $\theta$, not on $I$), it misses the second effect.
