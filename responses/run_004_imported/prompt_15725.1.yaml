  2.  **Determine the Stance/Recommendation:**
      *   *Violation?* Yes. Academic integrity fundamentally rests on the student taking responsibility for the work submitted. Whether the AI "lied" or "hallucinated" is secondary to the fact that the student presented false information as fact.
      *   *Intent?* This is the tricky part. The current handbook requires "intent to deceive." Maya claims she didn't intend to deceive; she was negligent. However, submitting unverified work in a research context is often treated as reckless disregard for truth, which can satisfy intent standards in many honor codes, or the code needs to be interpreted to include "gross negligence."
      *   *Sanction:* Needs to be educational but consequential. A failing grade on the assignment is standard. A suspension might be too harsh for a first offense involving negligence rather than malicious cheating (buying a paper). A probation or educational sanction (workshop on research methods/AI literacy) fits well.
      *   *Addressing the "Lying" Debate:* The memo needs to acknowledge the philosophical/technical debate but pivot to the *student's* action. The AI's ontology doesn't change the student's duty of verification.

  3.  **Drafting - Section by Section:**

