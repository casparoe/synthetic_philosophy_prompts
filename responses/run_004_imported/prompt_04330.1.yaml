      *   *Challenge the premise of "Pure Motive":* The idea that there is a singular, pure "real" motive is a philosophical trap. Human motivation is almost always mixed.
      *   *Reframe "Integrity":* Integrity isn't about having pure thoughts; it's about aligning action with values *despite* conflicting impulses. The fact that the user is worried about this *proves* they care about integrity.
      *   *Pragmatic/Professional Ethics:* In a professional context, alignment of incentives is *good*. We want systems where doing the right thing aligns with self-preservation.
      *   *The "Counterfactual" Problem:* The user is stuck on "What would I have done if no one knew?" This is unknowable and unproductive. Focus on the actual choice made.

  4.  **Drafting the Response (Iterative Process):**

