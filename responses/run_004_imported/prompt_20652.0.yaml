answer: |-
  **The Ledger**

  The air in the tenement hallway smelled of boiled cabbage and wet wool, a scent that Clara had learned did not wash out of a coat, only settled deeper into the weave. She stood before door 4B, her clipboard pressed against her chest like a shield. Inside, the Kowalski family was waiting. She knew this because she could hear the silence on the other side of the wood—the hushed shuffling of feet, the sudden cessation of a child's cry. They knew she was coming. They knew what she was.

  Clara adjusted her gloves. She was an eligibility investigator for the Works Progress Administration. Her job was to verify need. To look into cupboards, to count coats, to decide if the hunger was real enough to warrant a voucher.

  She knocked.

  The woman who opened the door was younger than Clara, though her eyes were older. Mrs. Kowalski stepped aside without a word. The apartment was cold. Clara walked through the motions she had practiced a hundred times that month. She opened the icebox. It was nearly empty, save for a jar of lard and a wilting celery stalk. She noted it on the form. *Insufficient protein.*

  "I sold the radio," Mrs. Kowalski said. Her voice was flat, stripped of pleading. "Last week. I didn't put it on the list."

  Clara paused, her pencil hovering over the paper. This was the moment. If Mrs. Kowalski had sold an asset to buy food, it technically reduced the family's reported destitution. It was a rule. A logical rule. If you have money to buy a radio, or money to sell one, you have capital.

  "You should have listed it," Clara said. Her voice sounded thin in the small room.

  "I needed the money for shoes. For the boy." Mrs. Kowalski pointed to a child in the corner whose toes were visible through his socks.

  Clara looked at the boy. Then she looked at the line on the form that asked for *Liquid Assets*. If she checked *No*, she was lying. If she checked *Yes*, the voucher would be denied. The pencil felt heavy, like a bar of lead. She thought about the rules printed on the back of her clipboard. She thought about her supervisor, Mr. Henderson, who said the budget was tight and that women in her position needed to be objective. *Don't get involved, Clara. You're the scale, not the weight.*

  She checked *No*.

  She closed the clipboard. "You'll receive the notice by Tuesday."

  Mrs. Kowalski didn't thank her. She just nodded, a small, jerky motion, as if her neck could no longer support the weight of her head.

  Clara walked back down the stairs. Her legs felt strange, as if the bones had turned to rubber. She stepped out into the afternoon light of 1934 New York. The street was loud—cars honking, newsboys shouting, the rumble of the elevated train. But inside Clara's head, there was a muffled pressure, like being deep underwater.

  She took the subway home. She sat opposite a man reading a newspaper. He turned the page with a sharp crack. The sound made her flinch. She looked at her hands. They were clean, gloved in beige cotton, but she felt a greasy residue on her fingertips. She rubbed them together. The feeling didn't go away. It wasn't dirt. It was the sensation of having touched something fragile and broken it by the mere act of measuring it.

  At dinner, the apartment was warm. Her husband, Thomas, poured wine into two glasses. He worked in accounting, a job of numbers that balanced. If the column on the left didn't match the right, you found the error. There was always a solution.

  "You're late," Thomas said, smiling. He didn't look up from carving the roast.

  "The subway stalled," Clara lied. She sat down. The chair was soft, upholstered in blue velvet, but she felt perched on the edge, ready to run.

  "Rough day?"

  Clara picked up her fork. The metal was cold. "The usual."

  " Henderson still riding you?"

  "No. It's not him."

  Thomas sliced a piece of meat. "Then what is it? You look exhausted. You need more sleep. I told you, reading those case files at night isn't good for you."

  "It's not the reading, Thomas."

  He looked at her then, his brow furrowed with a kind, baffled concern. "Is it the women? They can be difficult. Demanding. You have to remember, they're desperate. Desperation makes people ugly."

  Clara put the fork down. "She gave me her radio. For shoes."

  Thomas nodded, chewing. "That's unfortunate. But the rules are the rules. If everyone hid assets, the system collapses. You know that."

  "I know."

  "So don't carry it home." He reached across the table and patted her hand. "You're too soft-hearted. That's your trouble. You take it all in."

  Clara pulled her hand back gently. *Too soft-hearted.* That was the phrase. It implied a character flaw. A weakness of constitution. As if her heart was a muscle that had failed to toughen, rather than a thing that was being bruised by repetition.

  She looked at her plate. She thought about the word *tired*. She was tired. But tiredness was something sleep fixed. This wasn't sleepiness. It was a accumulation. It was as if every story she heard, every lie she had to certify as truth or every truth she had to mark as a lie, was a layer of sediment settling in her lungs. She was breathing through mud.

  "I feel..." Clara started. She searched for the shape of it. She wanted to tell him that she felt like a soldier who hadn't fired a gun but was covered in the same grime as the ones who had. She wanted to say that she felt contaminated by the shame of others, that she was becoming a vessel for the city's humiliation.

  But there was no word for that.

  If she said, *I am haunted*, Thomas would tell her to go to church.
  If she said, *I am depressed*, he would tell her to take tonics and get more sun.
  If she said, *I am damaged*, he would ask where the injury was, and she could not show him a bruise.

  There was no category for the injury of witnessing. In the newspapers, men came back from the War with *shell shock*, and that was understood, vaguely, as a bomb bursting near the brain. But Clara sat in warm rooms and listened to whispers, and the damage was happening just as surely, but silently. There was no name for the wound that enters through the ears and settles in the hands.

  "I feel heavy," she said finally.

  Thomas smiled, relieved to have a tangible problem. "Heavy. Yes. Well, you should rest this weekend. We can go to the park. Get some fresh air. Clear the cobwebs."

  He resumed eating. The clink of his knife against the plate was sharp, precise.

  Clara looked at her hands again. The beige gloves were gone, but the residue remained. She imagined scrubbing them with lye soap, with pumice, until the skin was raw. She wondered if the feeling was inside the skin, in the blood.

  She picked up her fork again. She had to eat. She had to sleep. Tomorrow she would go back to the tenements. She would knock on door 5A. She would open another icebox. She would count another pair of shoes. And she would carry the weight back home, adding it to the pile that no one could see, in a room where there was no word for the burden, only the silence of bearing it.

  "The park would be nice," Clara said.

  She took a bite of the roast. It tasted of nothing. She chewed, and swallowed, and the heavy thing in her chest shifted, making room for tomorrow.
