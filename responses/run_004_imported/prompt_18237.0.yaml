answer: |-
  This is a striking example of why the boundary problem is arguably the most "real" problem in democratic theory, even if it often gets treated as a logical puzzle for seminar rooms. You are living the tension between the *normative* question (who *should* decide?) and the *constitutive* question (who *gets* to decide who decides?).

  Since you're ABD, I'll skip the exegesis and go straight to the analytical leverage points. You're right to suspect that the standard literature struggles with "partial membership" or "hybrid status" cases. Most of the canonical texts assume a binary: citizen/alien, resident/non-resident, present/future. Your lake town case introduces a third category: **economic insiders who are political outsiders.**

  Here is how the specific theorists you listed map onto this conflict, where they offer purchase, and where the case exposes gaps in the literature.

  ### 1. Whelan: The Pre-Political Boundary
  Whelan's insight is the most uncomfortable one here. He argues that the boundary of the demos cannot be decided democratically without circularity; therefore, it must be decided *pre-politically* (by custom, conquest, geography, or prior constitutional settlement).

  *   **Application:** The town's domicile requirement *is* the Whelanian boundary. It is a brute fact that precedes the town meeting. From a strict Whelanian perspective, the seasonal owners are complaining about a rule that cannot be justified *democratically* because it defines the democracy itself.
  *   **The Friction:** Whelan implies we have to accept the boundary as given to get the democracy started. But the seasonal owners are arguing that the *consequences* of that boundary (taxation without representation) violate the very legitimacy the boundary is supposed to secure.
  *   **The Gap:** Whelan doesn't help you adjudicate *which* pre-political boundary is just. He just says one is necessary. This case shows that when the pre-political boundary (domicile) clashes with a competing normative principle (property rights/taxation), the "logical problem" becomes a material conflict.

  ### 2. Goodin vs. Abizadeh: Interests vs. Coercion
  This is where the distinction between "All Affected Interests" (Goodin) and "All Subjected to Coercion" (Abizadeh) becomes practically vital, not just semantically.

  *   **Goodin (Affected Interests):** This is the seasonal owners' strongest intuitive claim. The rental cap affects their property values; the tax rate affects their wallet.
      *   *The Fit:* Goodin's principle would likely enfranchise them.
      *   *The Break:* As you noted, Goodin usually explodes into global enfranchisement. However, in a municipal context, the "affected" sphere is geographically contained. The risk here is reducing citizenship to **stakeholding**. If voting is just about protecting asset values, the "advisory seat" compromise looks like a Goodin-style solution: you get a say in your interest, but not a vote on the common good.
  *   **Abizadeh (Coercion):** This is the stronger argument for full voting rights. Abizadeh argues that coercive laws require justification to those bound by them.
      *   *The Fit:* Zoning laws and tax levies are coercive. They are backed by the state's monopoly on force (liens, fines, eviction). If the town can dictate what you do with your land and take your money, you are "subjected."
      *   *The Break:* Abizadeh usually applies this to border regimes and immigration law. Applying it to *local* property owners stretches the "coercion" definition. Is a zoning law the same kind of coercion as border control? If yes, the seasonal owners have a right to vote. If no, they don't.
      *   **Implication:** If you side with Abizadeh, the "advisory seat" is illegitimate. You cannot have a say on the coercion you are subjected to; you must have an *equal* vote. The compromise treats them as petitioners, not members.

  ### 3. Miller: The Community of Fate
  David Miller's nationalist/communitarian critique is the theoretical backbone of the year-round residents' position, even if they don't know it.

  *   **Application:** Miller argues that democracy requires a background of shared solidarity and mutual trust. You need to share a "common life" to make sacrifices for one another.
  *   **The Fit:** The year-rounders shovel the snow in February, use the schools, rely on the volunteer fire department in the off-season, and live with the consequences of the town's budget year-round. Seasonal owners leave when the leaves turn. For Miller, the seasonal owners are **free-riders on social capital**, even if they pay taxes. Taxes fund services; solidarity funds the *willingness* to distribute those services fairly.
  *   **The Break:** Miller's view risks fetishizing residence. If 60% of the tax base comes from seasonal owners, is the "community" really just the 40% who stay? Miller might argue that without the seasonal tax revenue, the community collapses, implying a reciprocal obligation. But his theory generally privileges the *social* bond over the *fiscal* bond.
  *   **Implication:** This explains the heat of the conflict. It's not just about money; it's about who constitutes the "we." The year-rounders see the town as a **political community**; the seasonal owners see it as a **service provider/asset management zone**.

  ### 4. Nasström: The Constitution of the People
  Sofia Nasström's critique is the meta-lens you need for your quals. She argues that principles like "all affected" or "all subjected" claim to be neutral metrics, but they actually *constitute* the people in a specific image.

  *   **Application:** The fight in the town meeting isn't a failure to find the right boundary; the fight *is* the boundary drawing.
      *   When year-rounders say "only residents vote," they are constituting the demos as a **community of shared fate**.
      *   When seasonal owners say "taxpayers vote," they are constituting the demos as a **corporation of stakeholders**.
  *   **The Insight:** Nasström would say there is no theoretical "solution" here that doesn't privilege one conception of the political over the other. The "advisory seat" is an attempt to mask this power struggle with a technocratic fix. It acknowledges the "interest" (Goodin) without acknowledging the "authority" (Democratic Sovereignty).
  *   **The Gap:** The literature assumes the "people" is either fully formed or needs to be expanded to include the excluded. It rarely accounts for **overlapping demoi**. Can you be a member of the *fiscal* demos but not the *political* demos? The literature says "no" (you're either in or out). Your case suggests "yes," and that this hybridity is inherently unstable.

  ### 5. The "Partial Membership" Problem
  You hit the nail on the head: the literature wasn't built for this.
  *   **Immigrants** (the usual subject) are physically present but legally excluded.
  *   **Foreigners** (Abizadeh's subject) are legally excluded and physically absent.
  *   **Seasonal Owners** are legally excluded, physically intermittent, but economically embedded.

  This breaks the **temporality** assumption in democratic theory. Democracy assumes a continuous "present." Seasonal owners introduce a **discontinuous presence**.
  *   **Implication for Theory:** If democratic legitimacy requires accountability, and accountability requires facing the consequences of decisions over time, do seasonal owners fail the test? If they vote for a tax cut in August but aren't there to deal with the budget shortfall in January, is that a democratic deficit?
  *   **Implication for the Case:** This justifies the domicile requirement *functionally*, even if it fails *normatively* on coercion grounds. It suggests the boundary isn't about "who matters," but "who is around to be held accountable."

  ### Summary for Your Quals (and Your Family)
  If you bring this to your quals list, this case study allows you to argue that the Boundary Problem is not just about *expansion* (who to let in), but about **fragmentation** (what kinds of membership exist).

  1.  **Whelan** explains why the town can't vote on who gets to vote without already deciding who gets to vote.
  2.  **Abizadeh** gives the seasonal owners the moral high ground on coercion (taxes/zoning = law).
  3.  **Miller** gives the year-rounders the moral high ground on solidarity (shared life = trust).
  4.  **Nasström** reveals that the "advisory seat" compromise is an attempt to depoliticize a fundamentally political conflict about the nature of the community.

  The literature breaks down because it assumes membership is singular. Your lake town suggests that in late capitalism, **property membership** and **political membership** have decoupled. The theory hasn't caught up to the reality that one can be a stakeholder without being a citizen, and that this condition is a source of legitimate democratic crisis, not just a logistical annoyance.

  Good luck with the quals, and hopefully, the town meeting doesn't come to blows. It sounds like you have a front-row seat to the constitutive violence of boundary drawing.
