answer: |-
  The book lay face down on the kitchen table, its spine cracked like a dry riverbed. *On the Plurality of Worlds*. Arthur hadn't moved in twenty minutes. The cold coffee in his mug had formed a skin.

  Outside, the rain in Seattle was doing what rain in Seattle does: falling with a quiet, persistent indifference. Inside, Arthur was trying to accommodate the idea that the rain was also falling, right now, in a billion billion other ways. In some worlds, it was snowing. In others, the sun was burning through a clear sky. In others, there was no Earth at all, just a void of silicon and gas.

  And in all of them, there was an Arthur.

  He had spent the last three weeks since finding Lewis's work in the back of a used bookstore oscillating between the "Incredulous Stare"—which he had practiced in the mirror until his face ached—and a terrifying, giddy acceptance. Lewis was right. It had to be. The theoretical utility was too high, the explanatory power too clean. Modal realism wasn't a metaphor. It was geography.

  He stood up and walked to the hallway mirror. He touched his own cheek. Concrete. Real.

  "Actual," he whispered to his reflection.

  That was the trick word. *Actual*. It didn't mean *real*. Everything was real. The world where he had proposed to Sarah instead of Elena was real. The world where he had never left Chicago was real. They were all made of the same stuff as this kitchen. They were just… over there. Spatiotemporally isolated. No bridges. No tunnels. No prayers that could cross the void.

  "Actual" just meant *here*. Like "now." Like "I."

  He walked into the living room and sat on the couch. The cushion on the left was still indented, though it had been six months. Elena. The aneurysm had been fast, medical reports said. Painless.

  For the first few weeks of reading Lewis, Arthur had clung to the comfort of it. *She's still out there.* In the vast plurality of worlds, the number of worlds where Elena died young was vanishingly small compared to the worlds where she grew old, where she finished her PhD, where she sat on a porch somewhere drinking tea.

  He had let that warm him. He had imagined a specific world—World-894, he called it in his head—where he had driven her to the hospital ten minutes earlier. Where the surgeons clipped the vessel. Where she was alive.

  Then he had read the chapter on Counterpart Theory.

  The warmth evaporated, leaving him colder than the grief had originally been.

  In World-894, the woman who looked like Elena, who shared her memories up to that Tuesday, who laughed with the same timbre… she wasn't *his* Elena. She was a counterpart. A distinct concrete particular. She was numerically distinct. The Elena who was buried in Oak Hill Cemetery was unique to this world. She was gone. Not just gone from his sight, but gone from existence. The other one was a stranger who wore her face.

  And the Arthur in World-894? He wasn't Arthur. He was a counterpart. He didn't miss her. He was holding her hand on that porch. He didn't know the weight of this silence.

  Arthur closed his eyes. The loneliness wasn't that he was alone in the universe. It was that he was alone in *this* universe, and every other version of himself was a stranger who didn't care about him.

  His phone buzzed. A reminder: *Buy flowers for the grave. 1 Year.*

  He stared at the screen. This was where the second gut-punch landed. The ethical objection. Robert Adams had written about it. If every possibility is realized, then every atrocity happens somewhere. Every kindness happens somewhere. The sum total of good and evil across the pluriverse is fixed. It's a constant.

  So, why buy the flowers?

  If he bought the lilies, there was a world where Arthur bought lilies. If he stayed home and drank whiskey until he passed out, there was a world where Arthur did that, too. In fact, both happened. Somewhere, Arthur was a saint. Somewhere, Arthur was a monster. The cosmic scorecard was already filled out. His choice didn't add anything to reality that wasn't already there.

  Why be good? Why grieve? Why do anything but sit on this couch and let the entropy take him?

  He looked at his hands. They were shaking.

  "If it's all real," Arthur said to the empty room, "then my suffering is real. But so is my indifference."

  He stood up again. He needed air. He put on his coat and walked out into the rain.

  He walked without direction. The city was gray, blurred by the water on his glasses. He passed a bus stop where a teenager was trying to light a cigarette against the wind. The kid was struggling, cupping his hands, shivering.

  Arthur stopped.

  In a thousand nearby worlds, Arthur kept walking. In others, Arthur told the kid to quit. In others, Arthur offered a light. In some, Arthur mugged him. All those Arthurs existed. They were all concrete. They were all real.

  But *this* Arthur was the one standing in the rain.

  The kid looked up, seeing Arthur staring. "You good, man?"

  Arthur felt the weight of the indexical. *Here.*

  The other Arthurs didn't matter to this kid. The Arthur who offered a light in World-500 couldn't dry this kid's shirt. The Arthur who mugged him in World-900 couldn't hurt *this* kid. Only the Arthur standing in the spatiotemporal location of *Here-and-Now* had any causal power over *This-Moment*.

  The plurality of worlds didn't dilute responsibility; it concentrated it. It was the only thing that made responsibility possible.

  If there were only one world, and Arthur chose not to help, the kid just didn't get a light. But in Lewis's view, if Arthur chose not to help, he was actively selecting which version of reality *he* would inhabit. He was defining the local truth.

  The other worlds weren't alternatives to this one; they were neighbors who couldn't touch. They couldn't save him. They couldn't save Elena.

  Arthur reached into his pocket. He didn't have a lighter. He pulled out a twenty-dollar bill.

  "I don't have a light," Arthur said. His voice sounded rough, unused. "But there's a store on the corner. Get a pack. And a coffee."

  The kid blinked, surprised. "Seriously?"

  "Seriously."

  Arthur handed over the bill. His fingers brushed the kid's. Warm. Dry. Causal contact.

  "Thanks," the kid said. "Happy anniversary, or whatever."

  Arthur froze. "What?"

  The kid pointed at Arthur's lapel. Arthur looked down. He was wearing the pin Elena had given him for their fifth anniversary. Silver, shaped like a book.

  "Looks important," the kid said, turning back to the wind.

  Arthur touched the pin. It was cold metal.

  He realized then that the "Incredulous Stare" wasn't about believing the other worlds existed. It was about refusing to believe *this* one was the only one that mattered to him.

  The other Arthurs were strangers. They were living their lives, grieving their losses, making their mistakes. They were not him. He could not hide in their successes. He could not outsource his morality to their virtues.

  If he wanted kindness to exist, it had to exist *here*. If he wanted Elena to be honored, it had to be *here*. In the other worlds, she was being honored by strangers who looked like him. That was nice for them. It did nothing for her memory in this concrete slice of reality.

  The rain soaked through his coat. He felt the chill seep into his bones. It was uncomfortable. It was real.

  He turned around and started walking toward the florist.

  He knew that somewhere, there was an Arthur who wasn't going to the florist. There was an Arthur who was currently pouring a drink. There was an Arthur who had moved away from Seattle years ago and never thought about this grave.

  Those men were real. But they were not him.

  Arthur pushed open the door of the shop. The bell chimed. The smell of lilies and damp greenery hit him. It was a specific smell, unique to this location, this time.

  "Help you?" the florist asked.

  "Lilies," Arthur said. "White ones."

  "For a funeral?"

  "No," Arthur said. He looked at his wet hands, then at the flowers. "For an anniversary."

  He paid. He took the bundle. He stepped back out into the rain.

  He knew that in the grand sum of the pluriverse, the amount of grief was constant. The amount of love was constant. His action changed nothing about the total ontology of existence. World-Actual was not metaphysically privileged.

  But it was *his*.

  It was the only coordinate he could occupy. The only place where his will could manifest as cause and effect. To ignore it because other things happened elsewhere was to abandon the only post he was assigned.

  He walked toward the cemetery. The flowers were heavy in his hand. The stems dug into his palm.

  Somewhere, another Arthur was happy. Somewhere, Elena was opening the door to greet him.

  Arthur hoped they were happy. He truly did. They deserved it. They were good people, in their way. They were his counterparts.

  But they were not him.

  He reached the gate. The gravel crunched under his shoes. He found the headstone. *Elena. Beloved.*

  He placed the lilies on the wet earth. He knelt, ignoring the mud soaking into his trousers.

  "I'm here," he said.

  He didn't say *We are here*. He didn't say *We made it*.

  "I am here."

  It was a small thing. A localized event. In the vast library of worlds, this sentence was whispered in only one room. In a billion other rooms, it was not said. In some, it was screamed. In others, silence.

  But in this room, in this world, the words hung in the air. They were true. They were actual.

  Arthur stayed there until the rain stopped. He didn't feel better. The grief was still a stone in his chest. The knowledge that a happy version of himself existed didn't fix the broken version standing in the mud. If anything, it made the break sharper.

  But as he stood up to leave, he felt a strange solidity in his legs. He wasn't a ghost haunting a multiverse. He was a man in a world. He had work to do. He had a life to live. Not because it was the *only* life, but because it was the *only one he had*.

  He walked back to the gate. He didn't look back at the other worlds. He couldn't, anyway. There was nothing to see but the wall of his own existence.

  He opened his umbrella. He stepped onto the sidewalk. He went home.
