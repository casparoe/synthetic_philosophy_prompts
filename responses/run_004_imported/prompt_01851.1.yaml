  Here is a reconstruction of the argument supporting your position. It aims to demonstrate that the internal logic of Nozick's "separateness of persons" objection to utilitarianism inevitably extends moral side constraints to all sentient beings, rendering his "utilitarianism for animals" proposal inconsistent with his foundational premises.

  ***

  ### The Metaphysics of Separation: Why Nozick's Argument Entails Rights for Animals

  Robert Nozick's critique of utilitarianism in *Anarchy, State, and Utopia* is one of the most famous moves in modern political philosophy. He argues that utilitarianism fails to take seriously the "distinction between persons." However, when we examine the specific metaphysical work this distinction is meant to do, it becomes clear that the argument relies on the nature of *experience* and *existence*, not the nature of *rationality*. Consequently, Nozick's attempt to restrict side constraints to rational agents while permitting utilitarian aggregation for animals is not a consistent refinement of his theory, but a contradiction of its core logic.

  To see this, we must reconstruct the separateness argument, locate the point where the restriction to rational agents is illicitly introduced, and demonstrate why the most charitable defense of Nozick fails to save the distinction.

  #### 1. The Architecture of the Separateness Argument

  Nozick's argument against utilitarianism is not merely a moral assertion; it is a metaphysical claim about the locus of value and suffering. It proceeds in three steps:

  1.  **The Intrapsychic Analogy:** Utilitarianism treats society as analogous to an individual. An individual may rationally sacrifice a present pleasure for a greater future gain (intrapersonal aggregation). Utilitarianism extends this logic to society, sacrificing one person's welfare for the greater gain of another (interpersonal aggregation).
  2.  **The Metaphysical Disanalogy:** This extension is illegitimate because there is no "social entity" that undergoes the sacrifice and reaps the reward. As Nozick writes, "there are only individual people, different individual people, with their own individual lives."
  3.  **The Normative Conclusion:** Because there is no overarching subject to balance the books, the loss suffered by Individual A is not *canceled out* by the gain of Individual B. The loss remains a brute, unredeemed fact for A. Therefore, individuals possess "side constraints" (rights) that forbid imposing such losses upon them, regardless of the aggregate good.

  The crucial insight here is that the wrongness of aggregation stems from the **phenomenology of separate existence**. Pain is felt *here*, in this consciousness; pleasure is felt *there*, in that consciousness. There is no "super-consciousness" that feels the net sum. Therefore, to sacrifice the *here* for the *there* is to treat the *here* as a mere resource.

  #### 2. The Extension to Sentient Creatures

  If the force of this argument lies in the metaphysical fact of separate existences, then the relevant criterion for possessing side constraints is **being a distinct locus of experience.**

  Consider a herd of cattle. Like human society, the herd is not a super-organism. When one cow suffers pain in a slaughterhouse, that pain is not experienced by the other cows who benefit from the survival of the herd (or the satisfaction of the human consumers). There is no "bovine social entity" that absorbs the loss. The pain remains the exclusive property of the individual cow.

  If Nozick's argument holds that "no one may be used merely to increase the overall good without their consent" *because* there is no social entity to bear the loss, then this logic applies with equal force to animals. The cow is a "separately existing creature" with "its own individual life." To aggregate the cow's suffering against the pleasure of others is to commit the exact metaphysical error Nozick identifies in human utilitarianism: pretending that a loss here can be canceled by a gain there, despite the absence of a single subject to encompass both.

  To restrict side constraints to humans, Nozick must introduce a new premise: that separate existence is insufficient for inviolability; one must also possess **rational agency** (the capacity to frame and revise a life plan).

  #### 3. Where the Restriction is "Smuggled In"

  This is the point of inconsistency. The restriction to rational agency is not derived from the separateness argument; it is imposed *upon* it from the outside.

  In the separateness argument, the justification for the side constraint is the **impossibility of justified compensation.** I cannot be compensated for my sacrifice by your gain because I do not experience your gain. This is a fact about the *structure of experience*, not the *content of the mind.* A dog does not experience a human's gourmet meal; a human does not experience a dog's pain. The metaphysical barrier to aggregation exists regardless of whether the sufferer can understand Kantian moral law.

  By introducing rational agency as a necessary condition for rights, Nozick shifts the ground of the argument from **metaphysical** (how existence is structured) to **moralistic** (who qualifies as a moral agent). He effectively changes the argument from:
  *   *Aggregation is impossible because there is no single experiencer.*
  To:
  *   *Aggregation is impermissible only if the experiencer is a rational agent.*

  But if the first premise is true—if aggregation is metaphysically bogus because losses and gains reside in different subjects—then the capacity of the subject is irrelevant. A loss is a loss. If rational agency were the true ground of the right, then the "separateness of persons" argument would be superfluous; Nozick could simply have argued, "Rational agents are ends-in-themselves." Instead, he spends significant energy arguing that utilitarianism fails because it ignores the *boundaries* between lives. Those boundaries exist for animals just as they do for us.

  #### 4. Engaging the Rejoinder: Was Rational Agency the Real Justification?

  Your friend's strongest counter-argument is that separateness is a *necessary* condition for rights, but not a *sufficient* one. On this reading, Nozick's critique of utilitarianism is specifically about *human* utilitarianism. The "separateness" argument explains why, *given* that we are rights-bearers, we cannot be aggregated. It does not prove that all separate entities are rights-bearers. Nozick explicitly links rights to "moral personality" and the capacity to regulate one's conduct by principles. Thus, the restriction to rational agents isn't smuggled in; it was the intended scope all along.

  This defense, while charitable, collapses under three pressures internal to Nozick's own text.

  **A. The Alien Objection**
  Nozick himself undermines this defense only pages later when he considers a superior alien race. He asks: if beings existed who stood to us as we stand to animals (vastly more rational, perhaps capable of moral personalities we cannot comprehend), would they be entitled to treat us as we treat animals?
  Nozick finds this conclusion repugnant. He suggests we would not accept being sacrificed for their greater good. But why? If rational agency is the sole criterion for side constraints, the aliens *should* be entitled to aggregate us. They are the superior rational agents; we are the lesser.
  The only reason Nozick hesitates here is that he recognizes the **separateness argument cuts the other way.** We are separate existences from the aliens. Our lives are not theirs to balance. But if our separateness protects us from the aliens, then animal separateness must protect them from us. To deny this is to accept a "might makes right" hierarchy of rationality that contradicts the Kantian insistence on inviolability.

  **B. The Problem of Marginal Cases**
  If side constraints are keyed to rational agency (the ability to frame a life plan), then human beings who lack this capacity fall outside the protection of side constraints. Infants, the severely cognitively disabled, and those in permanent vegetative states do not possess the capacity to "regulate conduct by principles."
  If Nozick insists that rational agency is the gatekeeper for the separateness argument, he must concede that utilitarian aggregation is permissible for these humans. Most Nozickians find this unacceptable. They usually argue that these humans are protected by their potential for rationality or their species membership. But "species membership" is morally arbitrary, and "potentiality" does not solve the problem of permanent disability.
  The only consistent way to protect marginal humans is to ground rights in **sentience and separate existence**—the very ground that also protects animals. If Nozick relies on rational agency to exclude animals, he inadvertently excludes vulnerable humans from the shield of side constraints.

  **C. The Nature of the Harm**
  Side constraints primarily protect against harm: pain, death, coercion, and loss of liberty. The capacity to suffer harm is sentience, not rationality. A cow can be harmed; a stone cannot. Nozick's argument against utilitarianism is that it permits imposing *harms* on some for the benefit of others.
  If the wrongness of utilitarianism is that it allows *harm* to be aggregated across separate entities, then the capacity to be harmed is the relevant metric. Rational agency is relevant to *political* participation or *moral responsibility*, but it is not relevant to the *infliction of pain.* To say "you can aggregate pain across animals but not humans" is to say that animal pain is metaphysically different from human pain in a way that allows it to be canceled by another's pleasure. But Nozick's own metaphysics denies that *any* pain can be canceled by another's pleasure.

  #### Conclusion

  Nozick is caught in a dilemma. Either the "separateness of persons" argument is a deep metaphysical truth about the impossibility of interpersonal aggregation, or it is a contingent moral claim about the value of rational agency.

  If it is the former (as Nozick presents it), then it applies to all separately existing sentient creatures. The boundaries of a dog's life are just as real and impenetrable as the boundaries of a human's. To aggregate across them is to violate the metaphysical fact of their separation. In this case, "utilitarianism for animals" is ruled out by Nozick's own premises.

  If it is the latter (as your friend suggests), then the "separateness" argument is merely rhetorical window dressing for a Kantian claim about rational nature. But this weakens his critique of utilitarianism significantly. It admits that aggregation *would* be fine if we weren't rational agents (or if we were dealing with non-rational beings). It concedes that the utilitarian calculus is metaphysically sound, but morally restricted to a specific class. This undermines the force of his claim that utilitarianism "does not take seriously the distinction between persons." It turns out utilitarianism takes the distinction seriously; it just doesn't care about the distinction for non-rational beings.

  To maintain the rigor of his attack on utilitarianism, Nozick must stand by the claim that separate existences cannot be merged for the greater good. But having stood by that claim, he cannot consistently deny its application to animals. The "wrinkle" you identified is not a minor oversight; it is a fissure that runs through the foundation of his theory. The separateness of persons is, in reality, the separateness of sentient lives, and Nozick's attempt to halt the argument at the border of the human species is a restriction his own philosophy cannot sustain.
