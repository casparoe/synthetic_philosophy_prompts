      *   *Check:* Is the user's argument that *sentience* is the criteria? *Yes*, implicitly. I should make sure to argue that "separate existence" implies "separate locus of experience/sentience."
      *   *Check:* Make sure to address the "smuggling" charge specifically. Where does the switch happen? It happens when moving from "why aggregation is wrong" to "who aggregation is wrong against."

  9.  **Final Polish:** Check flow, clarity, and ensure all constraints of the prompt are met. (The prompt asks for the "most rigorous version of my side," engaging the counter-argument seriously.)

