      *   *Point 2: The Alien Objection.* Nozick's own worry about superior aliens undermines the rational agency defense. If aliens are smarter, do they get to aggregate us? If Nozick says "No," why? Because we are separate existences. If separateness protects us from aliens, it must protect animals from us.
