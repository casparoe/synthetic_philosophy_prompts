      *   Use Nozickian terminology (side constraints, utilitarianism of resources, end-in-itself).
      *   Ensure the distinction between *justifying side constraints* and *defining the scope of side constraints* is clear.

  8.  **Self-Correction/Nuance Check during drafting:**
