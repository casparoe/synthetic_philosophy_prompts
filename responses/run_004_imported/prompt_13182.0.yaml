  1.  **Analyze the Request:**
      *   **Core Concept:** Nelson Goodman's argument from *Languages of Art*. Even if a forgery is perceptually indistinguishable from the original *now*, the knowledge that it *is* a forgery creates an aesthetic difference because it implies a future possibility of detection/distinction. The "fake" carries a latent difference.
      *   **Tone:** Strange, almost haunted. Not the usual "guilty forger" trope.
      *   **Length:** Around 1000 words.
      *   **Subject:** Any kind of copy/fake (doesn't have to be painting).
      *   **Requirement:** The logic of the "merely-possible future difference" must drive the plot, not just be background flavor.

  2.  **Brainstorming & Concept Development:**
      *   *Idea 1: A Music Recording.* A perfect digital copy of a vinyl master. But the vinyl has "history." No, too abstract.
