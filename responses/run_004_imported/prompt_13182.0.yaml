answer: |-
  The cylinder of the music box was brass, tarnished to the color of a bruised sunset. The pin Elias had fabricated to replace the missing note was also brass, aged chemically to match the patina down to the molecular oxidation. Under the loupe, under the spectrometer, under the caress of a blind man's finger, the new pin was the old pin.

  Elias wound the key. The spring tightened with a familiar, ratcheting sigh. He released the lever.

  The comb teeth plucked the air. The melody was a waltz from a court that no longer existed. It flowed without hesitation. The new pin lifted the lever at the precise millisecond required. The note rang out, clear and true. It was, by every metric of the present moment, indistinguishable from the original manufacture.

  But Elias did not hear music. He heard a countdown.

  He sat back in his chair, the workshop dust motes dancing in the shaft of afternoon light. He knew which pin was the fake. That knowledge sat in his mind like a swallowed coin, heavy and cold. According to the logic of the trade, the work was finished. The client would never know. The market would never know.

  But Elias knew. And because he knew, the music box was no longer a singular object. It was a fork in the road.

  He leaned in again as the waltz cycled. He listened to the new pin. It was harder than the surrounding metal, despite the chemical aging. It had not yet suffered the microscopic fatigue of a hundred years. It was pristine. And because it was pristine, it would wear differently. Not today, not tomorrow, but in ten years, or fifty. The friction coefficient would drift. The vibration would dampen differently.

  Goodman's ghost sat on the workbench beside him. *The aesthetic difference exists now,* the philosopher would say, *because the possibility of future detection exists now.*

  The note played by the new pin was haunted by its own future. It carried a shadow of a difference that had not yet happened, a phantom variance waiting to be born. To Elias, the note sounded hollow, not because of its frequency, but because of its trajectory. It was a lie waiting to be found out. The perfection of the copy was not a triumph; it was a suspense thriller where the climax was guaranteed, only the date was unknown.

  He wound it again. And again.

  For three days, Elias did not sleep. He ate at the bench. He listened. He was no longer listening for the music; he was listening for the divergence. He was trying to hear the future wear in the present sound. He imagined the metal grains of the new pin grinding against the comb, shedding microscopic flakes that didn't match the historic dust settled in the mechanism's crevices.

  The object had become radioactive. Its status as a copy infected the entire assembly. The original brass pins now sounded weary and honest; the new pin sounded arrogant and temporary. Yet, physically, they were twins. The difference was entirely epistemological, residing in Elias's head, yet it roared louder than the mechanism.

  He realized he could not sell it. To sell it was to send the lie into the world to gestate. Somewhere, someday, a future restorer would look through a microscope and see the grain mismatch. They would declare the piece compromised. The beauty of the object relied on its continuity, and Elias had severed the timeline.

  He took the box in his hands. It was warm from the friction of the spring.

  If he left it perfect, the difference would remain latent, a ticking bomb of aesthetic validity. The object would exist in a state of superposition: both real and fake, until the moment of detection collapsed the wave. He couldn't live with the superposition. He needed the collapse to happen now, on his terms.

  He needed to make the invisible difference visible. He needed to align the physical object with the knowledge in his head.

  Elias opened the drawer and took out a scribe. It was a sharp, hardened steel tool. He positioned the loupe over the new pin. His hand did not shake.

  If he scratched it, he would ruin the perfection. He would destroy the illusion that it was original. But in destroying the illusion, he would kill the ghost. If the pin was visibly damaged, visibly *different*, then the anxiety of the "future discovery" would vanish. The difference would be current. It would be honest.

  He pressed the scribe against the smooth, chemically-aged surface of the new pin.

  To scratch it was to admit defeat. To scratch it was to acknowledge that the copy could never be the original, not because of the metal, but because of the history. The history was the missing mass. He could not forge time. He could only forge the vessel.

  He dragged the steel across the brass. A bright, silver line appeared, stark against the dark patina. It was ugly. It was jarring. It screamed *intervention*.

  Elias exhaled, a breath he felt he'd been holding for seventy-two hours. The tension in his shoulders dropped. The music box was no longer haunted. It was now clearly, undeniably a repair. The aesthetic difference was no longer a potentiality lurking in the future; it was a scar in the present.

  He wound the key one last time. The mechanism engaged. The waltz began.

  When the damaged pin hit the comb tooth, there was a slight click, a tiny percussive error where the smooth lift was interrupted by the scratch. The note was still the right pitch, but the timbre was rough. It sounded wounded.

  Elias closed his eyes and finally heard the music. It was no longer perfect, but it was no longer lying. The future had been dragged into the present, examined, and found wanting. He packed the box away, the silver scratch gleaming like an eye that would not close, finally at rest in its own imperfection.
