      *   *Idea 3: A Handwritten Letter.* A forgery of a historical document. The ink is chemically identical. But the *stroke* order might be different under a microscope? Too technical.
      *   *Idea 4: A Memory/Object Hybrid.* Let's go with something sensory but tangible. A scent? A flavor?
      *   *Idea 5: The "Perfect" Seed.* A biological copy.
      *   *Selection:* Let's try something architectural or structural, but intimate. A key? A lock? No, let's go with *sound* or *voice*. A voice print. Or better, a *silence*.
      *   *Refined Selection:* Let's stick closer to the visual/tactile but make it uncanny. A *mirror*? No. How about a *restoration*? A replaced part of a statue?
      *   *Winning Concept:* A clock. Specifically, an antique clock mechanism. A watchmaker creates a perfect replacement gear for a broken original. The gear is physically identical. But because it is new, it will wear differently. The "future difference" is the wear pattern. The story should focus on the anxiety of that future wear.

      *Wait, let's push the "haunted" aspect.* Goodman's idea is epistemological (knowledge creates the difference). The characters need to *know* it's a fake, and that knowledge changes how they perceive it *now*.
      *   *Revised Concept:* A pianist and a piano. Or a violin. A Stradivarius copy.
      *   *Revised Concept 2:* A memory palace? No.
      *   *Revised Concept 3:* Let's go with a *signature*. A biometric copy.
      *   *Revised Concept 4:* Let's try a *garden*. A cloned flower.
      *   *Let's go with the Clock idea but make it about Time itself.* A horologist makes a replacement part for a legendary clock. The part is perfect. But the *knowledge* that it is new makes the ticking sound different to the owner, even if the frequency is identical.
      *   *Actually, let's try something more abstract:* A "Perfect Day" simulation. No, too sci-fi.
      *   *Let's try: A Hand.* A prosthetic hand that is indistinguishable from the real one.
      *   *Let's try: A Voice.* A singer loses their voice, gets a surgical fix or a synthetic cord.
      *   *Let's try: The Goodman Argument directly.* A museum setting. Two identical vases. One is broken and glued perfectly.
      *   *Best Fit:* A luthier (violin maker). He makes a copy of a Guarneri. It sounds identical. But he knows which one is the copy. He sells it as the original. Years later, he hears it played. He hears the "future difference" before it happens.
      *   *Wait, the prompt wants the "future difference" to do work in the plot.* The characters need to act based on the *potential* difference.
      *   *Idea:* A man buys a perfect copy of a lost love letter. He knows it's a copy. He treats it differently because he knows it *could* be exposed. The anxiety of the "not yet" visible flaw.
      *   *Idea:* An art restorer. She fills a crack in a painting with material that is chemically identical and visually invisible. But she knows it's a fill. She becomes obsessed with the moment the fill *might* become visible. She ages the painting artificially to match the fill's future state? No.
      *   *Idea:* A "Time Capsule" coin. A counterfeiter makes a coin from the correct era metal. It's perfect. But he knows it wasn't stamped by the original die. He waits for the "microscopic drift."

      *Let's settle on: A Clockmaker and the "New" Gear.*
      *   Protagonist: Elias, a master restorer.
      *   Object: The "Automaton of Vaucanson" or similar. A mechanical duck? A clock? Let's go with a complex music box.
      *   Conflict: He replaces a broken cylinder pin. It is perfect. But he knows it is new. He becomes obsessed with the *future wear*. He starts listening for the moment the new metal diverges from the old. The "haunted" feeling is the anticipation of the divergence.
      *   Plot Twist/Resolution: He realizes the *original* was already a copy, or he destroys it to prevent the future divergence. Or, he treats the object as radioactive because of its potential to change.
      *   *Refining the Goodman Angle:* The aesthetic experience changes *now* because of the *possibility* of detection later. Elias hears a "ghost tick." He can't enjoy the music because he's listening for the failure of the perfection.

  3.  **Drafting - Scene by Scene:**
      *   **Scene 1:** Elias in his workshop. The Music Box. The replacement pin. It's done. It's perfect.
      *   **Scene 2:** The Client (or just Elias alone). Let's keep it intimate. Elias alone. He winds it. It plays. It sounds perfect.
      *   **Scene 3:** The Goodman realization. He knows it's new. Therefore, it will wear differently. Therefore, the sound *is* different, even if he can't hear it yet. The "latent flaw."
      *   **Scene 4:** The obsession. He listens not to the music, but to the silence between the notes, waiting for the divergence. The object becomes "haunted" by its own future.
      *   **Scene 5:** The climax. He can't stand the potentiality. He has to make the difference real or destroy the object. He chooses to mark it. To make the fake visibly fake so the aesthetic tension resolves.

  4.  **Writing - Focusing on Tone:**
