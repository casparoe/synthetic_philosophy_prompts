  Okay so I'm putting together a linked collection of short stories where each one is secretly built around some obscure bit of academic philosophy, and I'm stuck on the entry for dispositions. You know the finks-and-masks stuff -- like Martin's live-wire example, or the poison-and-antidote case? I want a story with two characters who seem to have the exact same hidden trait (pick whatever's dramatically interesting to you -- a violent streak, a tendency to fall apart under pressure, whatever), and it never actually shows itself in either of them, but for totally different underlying reasons: for one character it should work like a genuine fink (something intervenes and actually alters the disposition itself right at the moment it would've kicked in, so its just not there anymore when tested), and for the other it should be a mask (the disposition stays fully real and intact the whole time, something just keeps blocking it from ever manifesting). Don't have anyone explain the philosophy out loud -- I want the plot mechanics to quietly track the distinction so a careful reader could reconstruct it after the fact. Something like 900-1300 words, and please don't just reskin the standard fragile-glass-and-hammer example, I've read that one a hundred times.
