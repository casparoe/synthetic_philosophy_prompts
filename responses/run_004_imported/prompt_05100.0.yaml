answer: |-
  The observation room was cold, kept at a sterile fifteen degrees to keep the technicians alert. Behind the one-way glass, Dr. Aris watched the two subjects seated in the testing chamber. They were identical in file, if not in face. Brothers. Both carriers of the *V4* gene, colloquially known on the ward as "The Snap."

  The Snap was a disposition toward lethal violence triggered by specific auditory stimuli. Sharp insults. Threats to kin. The sound of breaking glass. In previous incidents, carriers had dismantled doorframes and broken bones within seconds of hearing the trigger. The goal of today's trial was not to see if they would snap—they both would—but to test the new containment protocols.

  Elias sat on the left. Julian sat on the right. Between them stood the Agitator, a man paid handsomely to provoke a reaction without actually touching them.

  "Begin," Aris said into the mic.

  The Agitator turned to Elias first. He leaned in, invading the man's personal space, and whispered the coded phrase. It was a vile thing, a specific invocation of their mother's death designed to bypass rational filtering and hit the amygdala directly.

  Elias flinched. His right hand twitched toward the table leg, fingers curling into a hook. His pupils dilated, swallowing the iris. The biometric monitors spiked—cortisol, adrenaline, testosterone flooding the system. He was winding up for the strike. He was The Snap incarnate.

  Then, the implant behind Elias's ear hummed. It was a reactive dampener, calibrated to detect the specific neurochemical signature of The Snap. As the urge to violence coalesced into a motor command, the device fired a counter-pulse.

  Elias froze. Not physically, but internally. The red haze that had begun to coat his vision evaporated. The tension in his shoulder dissolved. He looked at his own hand, curled tight against the table, and felt a vague confusion. He looked at the Agitator, expecting to feel hate, expecting to feel the familiar burn of rage. There was nothing. The capacity for violence hadn't just been suppressed; it had been excised. He was no longer fragile. He was no longer a carrier. The stimulus had arrived, and in the nanosecond before the manifestation, the disposition itself had fled. He lowered his hand, smooth and calm, and leaned back.

  "Subject One stable," the technician noted. "Aggression levels baseline."

  Aris nodded. "Move to Subject Two."

  The Agitator turned to Julian. He used the same phrase, the same tone, the same proximity.

  Julian's reaction was immediate and visceral. His chair scraped against the floor as he surged upward. A roar built in his throat, raw and animalistic. The biometric monitors screamed, red lines jagged across the screens. The Snap was fully present. The disposition was intact, burning hotter than it ever had in previous trials. Julian's muscles coiled, ready to launch him over the table to tear at the Agitator's throat.

  But Julian didn't move.

  He strained against the air itself, his face purpling with the effort. He wanted to kill. He *needed* to kill. The urge was a physical weight behind his eyes, demanding output. But the room was filled with a dense, inert gas, heavier than air, engineered to interfere with neuromuscular transmission only under high-stress conditions. His brain sent the signal to strike, but his arms refused to obey. The command died in the synapses.

  He was a loaded gun with the trigger mechanism welded shut. The fragility was there. If the gas were to vanish, if the mask were lifted, he would shatter the room. But while the stimulus persisted, the manifestation was impossible. He sat there, trembling violently, sweat pouring down his face, trapped inside his own intact volatility. He stared at the Agitator with pure, unadulterated hatred, screaming silently behind clenched teeth that could not unclamp.

  "Subject Two stable," the technician said, watching the monitors. "No external movement. Aggression levels critical."

  "Duration?" Aris asked.

  "Indefinite, provided the gas holds."

  Elias, on the left, watched his brother. He felt a pang of pity, though he couldn't quite understand why. He felt safe. He felt *changed*. He looked at the table leg he had almost grabbed. It was just wood. He had no desire to break it. He didn't think he could break it, even if he tried. The potential was gone.

  Julian, on the right, watched the Agitator. He memorized the man's face. He stored the hate in the deep vaults of his chest, knowing it was still there, waiting. He was a bomb wrapped in lead. He wasn't safe. He was just contained.

  "Terminate trial," Aris said.

  The gas hissed out of the chamber. The implant behind Elias's ear went dormant.

  The Agitator stepped back, wiping sweat from his brow. He looked at Elias, who offered a polite, empty nod. Then he looked at Julian. Julian was still shaking, his breath coming in ragged gasps, his eyes wide and wet with the frustration of a scream that never left his throat. He looked at the Agitator with the promise of a future violence, a debt unpaid.

  "Results?" Aris asked the room.

  "Both subjects remained non-violent," the technician replied, typing up the log. "Protocol successful."

  "Distinct mechanisms?"

  "Subject One shows no residual aggression. The trigger yielded no response. Subject Two shows maximum residual aggression. The trigger yielded no output."

  Aris watched them through the glass. To the untrained eye, they were the same. Two men who could have killed, who did not. Two men who passed the test. But where Elias stood empty, a vessel drained of its poison the moment the cork was pulled, Julian sat full to the brim, the poison sloshing against walls too strong to break.

  "Release them," Aris said.

  As the door unlocked, Elias walked out first, light on his feet, humming a tune he hadn't known he remembered. Julian followed slowly, dragging his feet, his hands clenched into white-knuckled fists at his sides, holding onto the violence like a lifeline, waiting for the air to clear.
