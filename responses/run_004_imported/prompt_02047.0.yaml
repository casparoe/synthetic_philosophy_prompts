          *   This actually pushes Locke closer to Berkeley than Locke might have realized, though Locke wouldn't accept the metaphysical conclusion.
      *   **Conclusion:** Locke is not drawing the Berkeleyan distinction. He is arguing against Innatism regarding cross-modal association. The empirical data supports the "No" and the need for experience, but suggests the visual processing of figure is itself learned, which strengthens the "experience" argument beyond simple correlation.

  6.  **Refine the Output:**
