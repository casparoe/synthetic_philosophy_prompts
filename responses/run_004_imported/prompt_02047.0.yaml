answer: |-
  This is an excellent exegetical puzzle. You have correctly identified the fault line where Locke's empiricism sits precariously between a naive realism (Reading A: the ideas are the same, the link is missing) and the radical heterogeneity later championed by Berkeley (Reading B: the ideas are fundamentally different).

  To answer your questions directly: **Locke's wording does not commit him to Berkeleyan heterogeneity, but it does commit him to a stronger claim than simple correlational ignorance.** He is arguing for the **acquired nature of perceptual judgment**, not necessarily the heterogeneity of the *objects* of perception. Regarding the empirical evidence: modern data supports Locke's negative verdict, but it complicates his explanation by suggesting that the visual *idea* of figure itself is not immediately available, which inadvertently strengthens the Berkeleyan reading more than Locke likely intended.

  Here is a breakdown suitable for drafting your paper.

  ### 1. Textual Analysis: Primary Qualities vs. Acquired Judgment

  To determine whether Locke is making the minimal claim (A) or the strong claim (B), we must look at his metaphysics of perception in Book II.

  **The Case Against Heterogeneity (Reading B)**
  Locke cannot fully endorse the Berkeleyan claim that visual and tactile figures are heterogeneous ideas sharing nothing in common. For Locke, **Figure** is a **Primary Quality** (II.viii.9). Primary qualities are "utterly inseparable from the Body" and the ideas they produce in us "resemble" the qualities in the object.
  *   If Figure is a primary quality inherent in the cube, and both sight and touch are capable of perceiving primary qualities, then both senses *must* be delivering an idea that resembles that same external quality.
  *   If the ideas were truly heterogeneous (as Berkeley argues in *New Theory of Vision*), they could not both resemble the same external primary quality.
  *   Therefore, Locke is metaphysically committed to the view that the *content* of the idea (extension/figure) is ultimately the same, even if the *sensory medium* (light vs. pressure) differs.

  **The Case for Acquired Judgment (The Nuanced Reading)**
  So why the "No"? Locke's text commits him to a claim about **semiotics and association**, not ontology.
  *   **The Sign vs. The Thing Signified:** When Locke writes that the blind man has not attained the "Experience, that what affects his touch so or so, must affect his sight so or so," he is describing a lack of knowledge regarding the *signification* of visual sensations.
  *   **The "Acquired Notions":** In the closing gloss, when Locke mentions "acquired notions," he is not saying the *idea* of the sphere is acquired (we get that from touch). He is saying the *proposition* linking the visual appearance to the tactile concept is acquired.
  *   **The Commitment:** Locke is arguing against **Innatism of Association**. He is claiming that the mind does not come pre-wired to recognize that *this* pattern of light and shadow corresponds to *that* pattern of resistance.

  **Verdict on the Text:**
  Locke is making a claim stronger than Reading A (simple correlation) but weaker than Reading B (heterogeneity). He is arguing for **Perceptual Relativism**. The visual idea of figure is not immediately recognizable as the tactile idea of figure because the mind treats them as distinct data sets until experience unifies them. He is not saying they *are* different kinds of things (Berkeley); he is saying they are *taken* as different things until learning intervenes.

  This distinguishes him from Leibniz. Leibniz (*Nouveaux Essais*) argues that because "extension" is an intelligible concept common to both, a rational blind man *could* deduce the answer. Locke's text blocks this by insisting that the *visual appearance* of extension is a distinct sensory datum that requires empirical mapping to the *tactile concept* of extension. For Locke, you cannot reason your way out of a lack of sensory experience.

  ### 2. Empirical Evidence: Cheselden to Project Prakash

  Does the empirical record favor one reading? The short answer is that it confirms Locke's verdict ("No") but suggests his explanation was too optimistic about the immediacy of visual ideas.

  **Historical Context (Cheselden)**
  Locke's friend William Cheselden published the case of a boy born blind who gained sight via cataract surgery in 1728 (after Locke's death, but often associated with the debate). The boy could not distinguish objects by sight initially. He had to learn that "what affected his touch so or so, must affect his sight so or so." This vindicated Locke's negative verdict.

  **Modern Evidence (Project Prakash)**
  Recent work by Pawan Sinha and colleagues (Project Prakash, 2003–present) on children in India with treatable congenital blindness provides high-resolution data.
  *   **The Finding:** Immediately after sight restoration, patients perform at chance on cross-modal matching tasks (matching a tactilely explored object to a visual image).
  *   **The Learning Curve:** However, they learn this mapping incredibly fast—often within days.
  *   **The Implication for Reading A vs. B:**
      *   **Support for Locke:** The initial failure confirms that the link is not innate; it requires "experience and improvement."
      *   **Complication for Locke:** Modern data suggests the deficit isn't just in *linking* two fully formed ideas (Reading A). Newly sighted patients often struggle to parse the visual field into distinct objects *at all*. They see a "blooming, buzzing confusion" (to use William James's later phrase).
      *   **The Berkeleyan Drift:** This leans slightly toward Reading B. If the visual system does not immediately present a coherent "idea of figure" to the mind, then there is nothing *to* match with the tactile idea. The visual idea of figure is not just unlinked; it is undeveloped. This suggests that visual figure is, in the early stages of perception, functionally heterogeneous from tactile figure because it lacks the structural coherence that touch provides immediately.

  ### 3. Synthesis for Your Paper

  You can frame your argument thus:

  1.  **Locke's Precise Commitment:** Locke is not arguing for the Berkeleyan heterogeneity of ideas (which would contradict his Primary Quality doctrine). He is arguing for the **non-innateness of cross-modal association**. The "acquired notions" are the rules of translation between the language of touch and the language of sight.
  2.  **The Gap with Leibniz:** Locke's text closes the door on Leibniz's rationalist solution. For Locke, the "common notion" of extension is not accessible to the intellect without first securing the sensory mapping. The intellect cannot bridge the gap that experience has not yet bridged.
  3.  **The Empirical Twist:** While empirical evidence validates Locke's "No," it suggests the problem is deeper than Locke realized. It is not merely that the blind man doesn't know *which* visual pattern matches the cube; it is that the visual system must learn to *construct* the figure from light before it can be matched. This inadvertently validates the intuition behind Berkeley's later heterogeneity thesis (that visual and tactile spaces are constructed differently) without requiring us to attribute that metaphysical view to Locke himself.

  **Suggested Phrasing for Your Draft:**
  > "Locke's gloss in II.ix.8 is often collapsed into the Berkeleyan thesis of heterogeneity, but this conflates Locke's empiricism with Berkeley's idealism. Locke's commitment to Primary Qualities necessitates that both sight and touch ultimately perceive the same figurative reality. His negative verdict rests not on the ontological divergence of the ideas, but on the epistemic gap in their association. The blind man possesses the idea of the cube via touch, and receives the idea of the cube via sight, but lacks the empirical warrant to assert their identity. Modern data from sight-restoration cases supports Locke's negative verdict while suggesting the visual 'idea' itself requires perceptual learning to cohere, a nuance that pushes the phenomenology closer to Berkeley than Locke's metaphysics would allow."

  This approach allows you to honor the precision of Locke's text while acknowledging why later philosophers (and scientists) read it as a precursor to more radical claims.
