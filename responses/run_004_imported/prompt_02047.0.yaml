      *   **Questions:**
          1.  Does Locke's wording settle which claim he is making, or is he pre-distinction?
          2.  Does empirical evidence from newly sighted patients favor one reading over the other?

  2.  **Deconstruct Locke's Text (II.ix.8):**
      *   *Molyneux's Quote:* Sets up the scenario. Distinguish cube and sphere by touch. Then see them. Can he distinguish by sight?
      *   *Molyneux's Answer (via Locke):* "Not." Reason: He hasn't attained the *Experience* that what affects touch so/so must affect sight so/so. He doesn't know the protuberant angle *shall appear* to his eye as it does to the hand.
      *   *Locke's Gloss:* Agrees. Blind man couldn't say with certainty. Reason: To consider how much we are beholden to "experience, improvement, and acquired notions."

  3.  **Evaluate Reading A vs. Reading B (Philosophical Analysis):**
      *   *Reading A (Correlational):* Focuses on the word "Experience." The ideas *could* be the same (extension/figure is a primary quality), but the *association* is missing. Locke believes in Primary Qualities (Solidity, Extension, Figure, Motion/Rest, Number). These exist in the objects. Both sight and touch perceive primary qualities. Therefore, the *idea* of figure should theoretically be the same idea of a primary quality.
      *   *Reading B (Heterogeneous):* Focuses on "acquired notions" and the mechanism of perception. If the ideas were identical, why would experience be needed to link them? If I have the idea of "triangle" in my mind via touch, and I see a triangle, shouldn't I recognize the idea? The need for *learning* suggests the sensory inputs are distinct.
      *   *Locke's Metaphysics:* Locke is a representational realist. Ideas of primary qualities resemble the qualities in the object. Figure is a primary quality. Therefore, the idea of figure from touch and the idea of figure from sight *ought* to resemble the same quality in the object. This suggests they are *not* heterogeneous in the Berkeleyan sense (where visual figure is light/color and tactile figure is resistance). However, Locke also emphasizes the *mode* of conveyance.
      *   *Key Phrase:* "what affects his touch so or so, must affect his sight so or so." This implies a mapping problem, not necessarily an ontological difference in the *idea* itself, but a difference in the *sensory channel*.
      *   *Key Phrase:* "acquired notions." This suggests the *connection* is the notion, not necessarily the ideas themselves.
      *   *Verdict on Text:* Locke is likely closer to Reading A (Correlational) but leans toward B in practice. He doesn't go full Berkeley (heterogeneity). He thinks both senses convey the *same primary quality* (figure), but the *signification* of the visual sign to the tactile idea must be learned. It's a semiotic link, not an identity link. He hasn't drawn the Berkeleyan distinction because he still believes in Common Sensibles (figure, motion, rest, number) perceived by multiple senses. Berkeley denies this. So, Locke is *not* committing to heterogeneity. He is committing to the necessity of associative learning for cross-modal identification.

  4.  **Evaluate Empirical Evidence (Newly Sighted Patients):**
