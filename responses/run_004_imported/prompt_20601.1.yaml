answer: |-
  Once you unravel from the last round, there's no non-arbitrary node where stopping becomes rational before the money is in your hand.
  But the game reached node four, so I violated induction at node two, meaning your common knowledge of rationality was dead before you touched the pot.
  Common knowledge doesn't shatter on a zero-probability event; you update on a tremble, not by abandoning the assumption that I'm maximizing.
  So I treat your earlier passes as noise, but switch back to assuming you're a perfect maximizer when it's my turn to defect?
  I assume consistency ex ante, which dictates the equilibrium path regardless of whether actual play deviated due to error.
  That requires me to ignore the signal your passes sent just to preserve the integrity of a model the play already broke.
  The model isn't broken because it's normative; it tells you what you should have done, not what implies you're broken for doing otherwise.
  But if the norm requires me to disregard the evidence of your actual behavior, then you're solving a game that wasn't the one we played.
  I'm solving the game defined by the payoffs and rationality constraints, not the one defined by your impulse control.
  Then your equilibrium is stable only if we ignore the history that got us there, which makes it a solution to a counterfactual, not this dinner.
  It's the only solution that doesn't require me to guess why you stopped being rational halfway through.
  Or it's the only one that lets you pretend rationality was ever common knowledge to begin with.
