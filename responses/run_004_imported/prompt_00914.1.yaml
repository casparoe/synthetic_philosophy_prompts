  Here is a step-by-step walkthrough of the modal collapse, using a mundane contingent fact to demonstrate the mechanism. I have structured this to help you isolate the specific formal move that Sobel identifies as the point of failure, and where Anderson proposes his emendation.

  ### The Setup: Definitions and Axioms (Scott's Formalization)

  To ensure we are looking at the same machinery, here are the relevant components of the Dana Scott/Gödel system we will be using:

  *   **$P(\phi)$**: Property $\phi$ is "Positive."
  *   **$G(x)$**: $x$ is God-like ($\forall \phi (P(\phi) \to \phi(x))$).
  *   **$Ess(\phi, x)$**: $\phi$ is an essence of $x$.
      *   *Definition 1:* $\phi(x) \land \forall \psi (\psi(x) \to \Box \forall y (\phi(y) \to \psi(y)))$.
      *   *(Translation: $x$ has $\phi$, and $\phi$ necessarily entails every property $\psi$ that $x$ has.)*
  *   **$NE(x)$**: $x$ has Necessary Existence.
      *   *Definition 2:* $\forall \phi (Ess(\phi, x) \to \Box \exists y \phi(y))$.
  *   **Axiom 4**: $P(NE)$ (Necessary Existence is a Positive property).
  *   **Axiom 3**: $P(G)$ (Being God-like is a Positive property).
  *   **Theorem 1**: $G(x) \to Ess(G, x)$ (Being God-like is an essence of any God-like being).
  *   **Theorem 2**: $\Box \exists x G(x)$ (A God-like being necessarily exists).

  ---

  ### The Mundane Fact

  Let us choose a fact that is intuitively contingent:
  **$p$**: "Socrates is sitting."

  We assume $p$ is **true** in the actual world, but **not necessary** (Socrates could have stood).
  In the formal system, we can construct a property corresponding to this fact. Let $Q$ be the property:
  **$Q$**: $\lambda z. p$ ("The property of being such that Socrates is sitting").

  *   Note: This is a "trivial" or "constant" property. If $p$ is true, everything has $Q$. If $p$ is false, nothing has $Q$.
  *   Since we assume $p$ is true, **$Q(g)$ is true** for any being $g$, including a God-like being.

  ---

  ### The Derivation of Collapse

  Here is how the system forces $p$ to be necessary ($\Box p$).

  **Step 1: Establish the existence of a God-like being.**
  By Theorem 2 (derived from Axioms 1–5), we know that a God-like being exists necessarily.
  $$ \Box \exists x G(x) $$
  Let $g$ be such a God-like being. So, $G(g)$ is true.

  **Step 2: Establish that $G$ is an essence of $g$.**
  By Theorem 1, if $x$ is God-like, then $G$ is an essence of $x$.
  $$ Ess(G, g) $$

  **Step 3: Apply the Definition of Essence to the mundane property $Q$.**
  This is the critical step. Look at **Definition 1** of Essence. It states that if $Ess(\phi, x)$, then $\phi$ entails **every** property $\psi$ that $x$ has.
  *   We know $g$ has property $Q$ (because $p$ is true, and $Q$ is "being such that $p$").
  *   We know $Ess(G, g)$.
  *   Therefore, by Definition 1, $G$ necessarily entails $Q$:
  $$ \Box \forall y (G(y) \to Q(y)) $$

  **Step 4: Combine Necessary Existence with Entailment.**
  We know from Step 1 that it is necessary that there exists a $y$ such that $G(y)$.
  We know from Step 3 that it is necessary that for all $y$, if $G(y)$ then $Q(y)$.
  By standard modal logic (K axiom + necessitation), it follows that it is necessary that there exists a $y$ such that $Q(y)$:
  $$ \Box \exists y Q(y) $$

  **Step 5: Translate back to the proposition.**
  The statement $\exists y Q(y)$ ("Something has the property of being such that Socrates is sitting") is logically equivalent to $p$ ("Socrates is sitting").
  Therefore:
  $$ \Box p $$

  **Result:** The contingent fact "Socrates is sitting" has been proven to be **necessarily true**. Since $p$ was arbitrary, *all* true propositions are necessarily true. Modal collapse is achieved.

  ---

  ### Pinpointing the Culprit: Sobel vs. Anderson

  You asked to identify the single definition or axiom doing the collapsing work. This is where the scholarly debate lies, and it is the crux of your paper.

  #### 1. The Mechanism: Definition 1 (Essence)
  As you can see in **Step 3**, the collapse is mechanically executed by **Definition 1**.
  *   **Why?** Def 1 requires an essence to entail *every* property the individual has ($\forall \psi$). It does not distinguish between "significant" properties (like *being omnipotent*) and "trivial" properties (like *being such that Socrates is sitting*).
  *   Because $G$ is proven to be an essence of $g$, $G$ is forced to entail the trivial property $Q$. Once $G$ entails $Q$, and $G$ exists necessarily, $Q$ (and thus $p$) becomes necessary.

  #### 2. Sobel's Diagnosis (1987)
  Howard Sobel argues that the collapse is inevitable given the **interaction of the Axioms**.
  *   Sobel emphasizes that for $G$ to be proven an essence in the first place (Theorem 1), the system relies on **Axiom 2** (Positive properties are closed under entailment) and **Axiom 1** (Negation).
  *   Sobel's point is that the axioms force the conclusion that a God-like being possesses *only* positive properties. If God possesses *only* positive properties, and $g$ possesses $Q$, then $Q$ must be positive.
  *   For Sobel, the collapse reveals that the **Axioms of Positivity** are too strong. They create a system where "truth" and "positive truth" coincide for a God-like being, making the distinction between contingent and necessary truths vanish. He views the collapse as a *reductio ad absurdum* of the axioms themselves.

  #### 3. Anderson's Emendation (1990)
  C. Anthony Anderson agrees that the derivation is valid but disagrees that the axioms must be abandoned. He locates the culprit specifically in **Definition 1 (Essence)**.
  *   Anderson argues that it is counter-intuitive and logically dangerous to require an essence to entail *every* property, including trivial or negative ones.
  *   **The Fix:** Anderson proposes emending Definition 1. He suggests $\phi$ is an essence of $x$ only if $\phi$ entails every **positive** property that $x$ has.
  *   **Why this stops the collapse:** If we use Anderson's definition, Step 3 fails. $G$ would only entail *positive* properties of $g$. Unless we can independently prove that the trivial property $Q$ ("being such that Socrates is sitting") is *Positive*, $G$ does not entail it. If $G$ does not entail $Q$, the necessity of $G$'s existence does not transfer to $Q$.
  *   Anderson argues this preserves the ontological proof (since God still necessarily exists) while blocking the modal collapse (since contingent truths are not forced to be entailed by God's essence).

  ### Summary for Your Paper

  *   **The Collapse Mechanism:** The derivation turns on **Definition 1 (Essence)**, which allows the God-concept to entail trivial properties like "being such that $p$."
  *   **Sobel's Position:** The collapse demonstrates a fatal flaw in the **Axioms of Positivity** (specifically Closure and Negation), which force all properties of God to be positive, thereby making the Definition of Essence applicable to all truths.
  *   **Anderson's Position:** The Axioms are salvageable; the error is in **Definition 1**. By restricting Essence to entail only *positive* properties, the link between God's necessary existence and mundane contingent facts is severed.

  This distinction allows you to argue that while Sobel identifies the *consequence* (the axioms imply collapse), Anderson identifies the *structural vulnerability* (the definition of essence is too permissive) that allows for a repair without abandoning the theistic framework.
