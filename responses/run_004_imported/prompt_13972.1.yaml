          *   **Crucial Clause:** They explicitly agree: "We will coordinate our movements to build this. However, we explicitly agree that neither of us has the *standing* to rebuke the other if they stop, and neither incurs an obligation to the other to continue. We are acting in parallel, not as a unit."
          *   **Bratman:** Does this block shared intention? No. Shared intention is about the structure of planning and responsiveness. The normative waiver is external to the intention structure. They still intend "We build."
