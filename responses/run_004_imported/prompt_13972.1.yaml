          *   *Gilbert:* A joint commitment *essentially* generates obligations. If they explicitly negate the obligation/right to rebuke, they have not formed a joint commitment *as a body*. They are just two individuals causally influencing each other. Verdict: **Not a Plural Subject / Not Joint Action.**

