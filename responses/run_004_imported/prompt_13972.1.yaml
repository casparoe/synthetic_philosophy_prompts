      *   **Bratman (Reductionist/Individualist):**
          *   *Core:* It's all about individual mental states (intentions) that interlock.
          *   *Key Conditions:*
              1.  I intend that we $J$.
              2.  You intend that we $J$.
              3.  I intend that we $J$ because of your intention (and vice versa) -> Mutual Responsiveness.
              4.  Our sub-plans mesh (no conflict).
              5.  Common knowledge of 1-4.
          *   *Weakness/Edge:* It's flexible. If I change my mind, I can stop. Obligations are moral/prudential, not *constitutive* of the action itself. It handles loose coordination well.

      *   **Gilbert (Normative/Holistic):**
          *   *Core:* It requires a "joint commitment" creating a "plural subject."
          *   *Key Conditions:*
              1.  Expression of readiness to commit jointly.
              2.  Common knowledge of this expression.
              3.  Creates a *normative bond* (obligations *to each other*).
              4.  Unilateral withdrawal is a violation (breach of commitment), not just a change of mind.
          *   *Weakness/Edge:* It's rigid. Without the explicit (or implicit) agreement to be bound *as a body*, there is no joint action. Mere coordination isn't enough.

      *   **The Fault Line:** The crucial difference lies in *normativity* and *unilateral rescission*.
          *   Bratman: I can stop intending whenever I want. If I stop, the shared intention dissolves. I might owe you an apology, but I didn't violate a constitutive rule of the action itself.
          *   Gilbert: I *cannot* legitimately stop without your permission. If I stop, I violate the joint commitment. The action persists normatively even if I physically withdraw.
          *   *Wait, refine:* Bratman allows for shared intention without strong directed obligations. Gilbert *requires* directed obligations (rights to rebuke) for it to count as a plural subject.
