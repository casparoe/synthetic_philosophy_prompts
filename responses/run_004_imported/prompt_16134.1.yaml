answer: |-
  The file on Silas's screen was Case 57. It was a mundane number for a mundane claim: a breach of contract regarding the delivery of synthetic timber. Silas had been an Adjudicator for the Bureau of Standards for fifteen years. He knew the Protocol better than he knew the lines on his own palms.

  The Protocol was simple: *Restitution must equal the deviation from the expected standard.*

  For fifteen years, Silas had calculated "deviation." He had measured it in weight, in tensile strength, in colorimetry. He had never written down the formula. He didn't need to. He felt the weight of the correct decision in his gut, a calibrated heaviness that settled when the numbers aligned. In every single case prior to this, his intuition had matched the Bureau's final stamp. He had never been overturned.

  In Case 57, the timber had been delivered late, but the chemical composition was superior to the contract spec. By Silas's measure, the deviation was negative. The buyer had received *more* than expected. Therefore, restitution was zero. He clicked *Approved*.

  The rejection notice arrived ten minutes later.

  Silas sat in the Review Chamber, the air recycling with a low hum. Across the table sat three Senior Adjudicators. They didn't look angry. They looked pitying.

  "You calculated zero liability," said Mara, the lead reviewer. She slid a tablet across the table. "The Bureau standard is liability equal to the delay penalty, regardless of material quality."

  "That's not the Protocol," Silas said. His voice was steady. He had rehearsed this on the way up. "The Protocol says *deviation from expected standard*. Quality is part of the standard. The buyer gained value. Restitution implies loss."

  "The Protocol," Mara said, tapping her pen, "is what we do."

  "I've done it this way for fifteen years," Silas said. "Look at the logs. Cases 1 through 56. In every instance where quality exceeded spec, I waived the penalty. You signed off on every one of them."

  "We did," Mara agreed. "But those cases involved negligible quality shifts. Case 57 involves a structural upgrade. The rule changes here."

  Silas felt a cold prickle at the base of his neck. "Where is that written? Where is the threshold defined? At what percentage of quality improvement does the rule flip?"

  "It isn't written," said the second adjudicator, a man named Kovic. "It's understood."

  "Nothing was understood differently until today," Silas pressed. He opened his own datapad, pulling up his mental history. "I followed the rule exactly as I have always followed it. My intent hasn't changed. My method hasn't changed. If the rule was 'Penalize delay unless quality improves significantly,' you should have corrected me on Case 12. Or Case 30. You didn't. So either I was wrong then, or I'm wrong now. Which is it?"

  The room was silent. The hum of the recycler seemed to grow louder.

  Silas looked for the fact. He searched his memory for the moment he learned the rule. He remembered the training manual, the vague wording, the mentorship. He remembered the feeling of certainty. Surely, there was a fact about what he *meant* when he learned the word "Deviation." Surely, his past usage contained the seed of this present decision. If he meant *plus*, he couldn't suddenly be doing *quus*. There had to be a track laid out ahead of him, invisible but solid.

  But looking at Mara's face, he realized the track wasn't in his head. It wasn't in the manual. It wasn't in the logs.

  "You're looking for a ghost, Silas," Mara said softly. "You think there's a fact of the matter about what the Protocol *really* means, independent of us. You think you can dig it up like an artifact."

  "I think consistency matters," Silas said.

  "Consistency with what?" Kovic asked. "With your own private history? That's just a sequence of events. It doesn't dictate the next step. I could draw a line through any set of points and extend it differently."

  "So how do you know you're right?" Silas asked. "If there's no fact, why is your extension the correct one?"

  Mara leaned forward. "Because we are the Bureau. When we agree on a move, that is what counts as following the rule. Meaning isn't a state inside your skull, Silas. It's a license we grant each other."

  Silas looked down at his hands. He thought about the number 57. He thought about all the times he had added numbers in his head, certain he was performing addition. How did he know he hadn't been performing *quaddition* all along, a function that mimics addition until the sum exceeds a certain threshold, then diverges? There was no internal scan that could prove it. No memory of a past intention could lock the future in place.

  He had been acting in isolation. He assumed his certainty was a connection to the truth. But it was just a habit. And habits only hold water as long as the community lets them flow.

  "I don't agree with the verdict," Silas said.

  "It doesn't matter," Mara said. "If you continue to apply the rule in a way we don't recognize, you aren't following the Protocol. You're speaking a private language. And private languages don't adjudicate contracts."

  She slid a new file toward him. Case 57, revised. Liability assigned. Penalty calculated according to the Bureau's new explicit threshold.

  "Sign it," Kovic said. "Not because you agree. But because you want to remain part of the 'we' that decides what 'agreement' means."

  Silas looked at the signature field. He realized then that he couldn't prove he was right. He couldn't even prove he was wrong. There was no hidden fact to uncover, no sin to confess. There was only the divergence. He was at the point where his line crossed theirs, and beyond this point, he was alone.

  To be right was to be in accord with them. To be outside was to be meaningless.

  He picked up the stylus. He didn't feel the calibrated heaviness anymore. He felt only the weight of the tool.

  "Am I corrected?" Silas asked.

  "You are aligned," Mara said.

  Silas signed. He didn't sign because he believed the penalty was just. He signed because he understood that justice, like meaning, was not something he possessed. It was something they did.
