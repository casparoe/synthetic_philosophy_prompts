  Good evening, everyone. For those who don't know me, I'm one of the many former interns who survived Frank's "Cardinal Sin" lecture. If you worked here before 2010, you've heard it. If you worked here after 2010, you've heard the remix.

  When I was asked to give this toast, I was honored. Then I was terrified. Mostly because I know Frank is sitting out there right now, mentally red-lining my adjectives. He's probably thinking, "Cut the first paragraph. It's sentimental fluff. Get to the verb."

  And he's right. Frank built this newsroom on the idea that clarity is kindness, and that accuracy is the only currency that matters. We all have stories about the times he sent us back to the phones, the times he made us check a date three times, the times he fired a friend of ours because they smoothed over a quote just enough to make it sing, but not enough to make it true. To the family here: I know that sounds harsh. But in this room, we know it was actually a form of love. He loved the truth more than he loved comfort. He loved the readers more than he loved our egos.

  I cover science and ideas now, so I spend a lot of time thinking about how messy reality actually is. In science, data is noisy. In life, memory is faulty. Two people watch the same event and see two different things. Journalism asks us to take that noise and turn it into a signal. It is an impossible job.

  And I think that's why Frank was so strict. He wasn't strict because he thought he was perfect. I've come to believe he was strict because he knew exactly how easy it is to *not* be.

  He knew how seductive a good narrative is. He knew how tempting it is to make a scene land just a little harder, to make a subject look a little more heroic, or a little more tragic, because it makes for a better story. He knew that the distance between what actually happened and what ends up on the page is where a journalist's integrity lives or dies. And he decided, thirty-some years ago, to guard that distance with his life.

  There's a philosophical idea that you lose the right to judge others if you aren't perfect yourself. But watching Frank work, I learned the opposite. Sometimes, the people who hold others to the highest standard are the ones who know best how heavy the burden is. He carried the weight of that standard so the rest of us didn't have to carry it alone. He was the guardrail.

  To his family: You know him as the man who came home after deadline, who worried about the bills, who loved you. We know him as the man who worried about the record. But it's the same integrity. He treated the front page the way he treated his dinner table: You don't lie to the people you love.

  Frank, you are retiring now. No more deadlines. No more fact-checkers calling you at 6:00 PM on a Sunday. No more worrying about whether a quote from 1988 holds up to the light of day. You have earned the right to let the memories be just memories. You can smooth over the edges now. You can let the story be the story, without worrying about the footnotes.

  But for those of us still in the newsroom, we will keep the standard. We will keep checking the dates. We will keep killing the darlings. Because you taught us that the work isn't about us. It's about the truth, however messy it may be.

  So, if everyone could raise a glass.

  To Frank. May your retirement be long, may your stories be unedited, and may you finally get to rest knowing that you built something that stands up to the facts.

  To Frank.
