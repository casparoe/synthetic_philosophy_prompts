prompt: |-
  Random philosophy question for a novel I'm working on, set in ancient Athens. This is all from a gen-ed class a decade ago so forgive me if I'm butchering it, but pretty sure Plato thought getting drunk was basically a betrayal of reason over appetite -- the polar opposite of the examined life -- which tracks with how in the Symposium Socrates is the one guy at the party who never loses control while everyone else gets wasted. Im writing a scene where my Socrates-type character lectures a room of drunk aristocrats about exactly this, and I want him to sound like the real deal, not a killjoy I made up. Any specific arguments Plato actually used along these lines that I could put in his mouth?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Writing a novel set in Ancient Athens.
      *   **Character:** A "Socrates-type" character (based on Plato's Socrates).
      *   **Scene:** Lecturing a room of drunk aristocrats about the dangers/immorality of drunkenness.
      *   **User's Premise:** Plato/Socrates viewed drunkenness as appetite over reason (opposite of the examined life), citing the *Symposium* where Socrates stays sober while others get wasted.
      *   **Goal:** Make the character sound authentic ("like the real deal"), not just a made-up killjoy. Needs specific Platonic arguments.
      *   **Constraint:** User admits their knowledge is from a gen-ed class a decade ago, so I need to be accurate but accessible.

  2.  **Fact-Check the User's Premise:**
      *   *Premise:* Socrates/Plato thought getting drunk was a betrayal of reason over appetite.
      *   *Reality:* It's more nuanced. In the *Symposium*, Socrates *does* stay sober, but he doesn't lecture everyone on how bad wine is. In fact, the *Symposium* is a celebration of Eros, and wine is the lubricant for the speeches. Socrates' ability to hold his liquor is a sign of his *enkrateia* (self-mastery), not necessarily a condemnation of wine itself.
      *   *Crucial Correction:* Plato actually wrote a whole dialogue dedicated to wine: **The *Laws*** (specifically Book 1 and Book 2). In the *Laws*, the Athenian Stranger (Plato's mouthpiece in later years) argues *for* regulated drinking.
      *   *Why?* Because drinking acts as a "test" of character. It loosens the tongue and lowers inhibitions, revealing the true soul. It can also be used as training (like exposure therapy) to practice resisting pleasure.
      *   *Republic:* In the *Republic*, guardians are generally discouraged from getting drunk because they need to be alert, but it's not an absolute sin for everyone.
      *   *Symposium:* Socrates' sobriety highlights his divine nature/extraordinary self-control, contrasting with Alcibiades' chaotic passion.

  3.  **Identify Key Platonic Concepts/Arguments:**
      *   **The Chariot Allegory (*Phaedrus*):** Reason (charioteer) vs. Appetite/Spirit (horses). Drunkenness lets the bad horse run wild.
      *   **Enkrateia (Self-Mastery):** The core virtue. It's not about the wine; it's about who is in charge.
      *   **The "Golden Cord" of Reason (*Laws*):** Reason is a soft, golden pull vs. the hard, iron pulls of passion.
      *   **Testing Ground (*Laws*):** Drinking is a safe way to see if a man is truly virtuous when his guard is down.
      *   **The Daemon/Inner Sign:** Socrates often references his *daimonion* which warns him against certain actions.

  4.  **Drafting the Advice - Section by Section:**

      *   **Validation & Correction:** Acknowledge the user is half-right (Socrates *is* sober in *Symposium*) but correct the "killjoy" assumption. Plato wasn't a teetotaler; he was a regulator. This makes the character more interesting.
      *   **The *Laws* Argument (The Surprise):** This is the gold mine. The idea that wine is a "test" of virtue. If you can drink and remain noble, you are truly noble. If you need to abstain to be good, your virtue is fragile. This is a *much* better argument for a novel than "wine is bad."
      *   **The *Symposium* Dynamic:** Socrates doesn't lecture *against* the party; he transcends it. His argument should be about *freedom*. The drunk man is a slave to the wine; the sober man is free.
      *   **Specific Metaphors:**
          *   The Ship of State (classic Socrates). A drunk captain sinks the ship.
          *   The Mirror. Wine shows you who you really are.
          *   The Puppet Strings (*Laws*).
      *   **Tone:** Socratic Irony. He shouldn't sound angry. He should sound curious. "I am confused... help me understand..." (Elenchus method).

  5.  **Refining the "Socrates-Type" Voice:**
      *   Avoid preaching. Socrates asks questions.
      *   Avoid moralizing. Focus on *harm* and *knowledge*.
      *   Focus on the soul (*psyche*).
      *   Key phrase: "Is it not strange..." or "Help me understand..."

  6.  **Developing Specific Dialogue Options:**
      *   *Option 1: The Test of Character (from Laws).* "You say you are brave? Let the wine speak."
      *   *Option 2: The Slave to Appetite (from Republic/Phaedrus).* "Who is driving the chariot?"
      *   *Option 3: The Socratic Irony.* "I am too poor to afford the loss of my reason."

  7.  **Review against Historical Accuracy:**
      *   Did Socrates lecture drunk people? In the *Symposium*, Alcibiades lectures *about* Socrates while drunk. Socrates mostly listens. But for a novel, having him speak is necessary dramatic license.
      *   Make sure to distinguish between early Plato (Socrates) and late Plato (Athenian Stranger in *Laws*). The user wants a "Socrates-type," so blending the *Phaedrus* psychology with the *Laws* insight is best for fiction.

  8.  **Final Polish:**
