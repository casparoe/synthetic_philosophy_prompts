  so i've been down a rabbit hole on the sorites paradox for a few weeks now (the heap-of-sand thing, also the bald guy version), just reading around online in my spare time - no formal philosophy background at all here. somebody in a comment thread mentioned that Locke was basically wrestling with the same problem 300 years before anyone called it "sorites," in a part of his Essay Concerning Human Understanding about species and monstrous births. so i dug up the actual text (it's Book 3, Chapter 6) and found the passage below, and it's kind of blowing my mind but the 17th century sentence structure keeps loosing me halfway through each sentence:

  "Wherein, then, would I gladly know, consist the precise and unmovable boundaries of that species? It is plain, if we examine, there is no such thing made by Nature, and established by her amongst men. The real essence of that or any other sort of substances, it is evident, we know not; and therefore are so undetermined in our nominal essences, which we make ourselves, that, if several men were to be asked concerning some oddly shaped foetus, as soon as born, whether it were a man or no, it is past doubt one should meet with different answers. Which could not happen, if the nominal essences, whereby we limit and distinguish the species of substances, were not made by man with some liberty; but were exactly copied from precise boundaries set by nature, whereby it distinguished all substances into certain species. Who would undertake to resolve what species that monster was of which is mentioned by Licetus (Bk. i. c. 3), with a man's head and hog's body? Or those other which to the bodies of men had the heads of beasts, as dogs, horses, &c. If any of these creatures had lived, and could have spoke, it would have increased the difficulty. Had the upper part to the middle been of human shape, and all below swine, had it been murder to destroy it? Or must the bishop have been consulted, whether it were man enough to be admitted to the font or no?"

  can you walk me through what his actual argument is here, step by step? a few things i can't untangle on my own: (1) the "real essence vs nominal essence" thing - is he saying there's no sharp line between species even in principle, or just that we can't know where the line is even though one really exists? those feel like pretty different claims and i think he might be sliding between them without noticing. (2) why all the gruesome monster-baby examples instead of just stating the point plainly - is that doing actual work in the argument or is it just there to rattle the reader into agreeing? and (3) is this genuinely the same move as the heap paradox, or is something different going on - Locke's whole example here is one weird edge case, not a long chain of tiny steps like grain-by-grain. i genuinely can't tell if i'm just forcing the sorites framework onto something that doesn't actually fit, since thats the framework i happen to have in my head right now.
