answer: |-
  **The Metric of Equality: A Defense of Resource Egalitarianism with a Capability Floor**

  The question that haunted our dinner table—Amartya Sen's deceptively simple "Equality of what?"—is the gravitational center of contemporary egalitarian theory. It forces us to move beyond the vague intuition that inequality is bad and ask what specific currency justice requires us to equalize. Is it the subjective satisfaction of preferences (welfare)? The objective means to pursue a life plan (resources)? Or the substantive freedom to achieve valuable states of being (capabilities)?

  My friend at the dinner table was right to worry that welfare-based metrics collapse under the weight of responsibility, and I was right to worry that resource-based metrics collapse under the weight of human diversity. However, the third friend's appeal to G.A. Cohen's "access to advantage" ultimately obscures the trade-off rather than resolving it. A rigorous analysis suggests that neither a pure resource view nor a pure capability view is sufficient on its own. Instead, egalitarians should adopt a hybrid metric: **Resource Egalitarianism as the default distributive mechanism, constrained by a Capability Sufficiency Threshold.** This approach preserves Dworkin's crucial distinction between ambition and endowment while correcting for the "conversion factor" failures that leave the disabled behind.

  ### The Failure of Welfare: Responsibility and Adaptation

  The case for equality of welfare is intuitive: if justice is about human well-being, why equalize anything other than well-being itself? However, as my friend argued, this view founders on the problem of responsibility. Ronald Dworkin's famous objection regarding "expensive tastes" remains decisive. If two people start with equal resources, but one cultivates a taste for champagne while the other is content with beer, equality of welfare demands we subsidize the champagne drinker to bring their satisfaction up to parity. This violates the egalitarian intuition that individuals should be held responsible for their preferences and choices. A theory of justice that penalizes the frugal to subsidize the profligate is not egalitarian; it is servile to subjective desire.

  Furthermore, welfare metrics struggle with what Sen calls "adaptive preferences." This is the "miserable Scrooge" problem raised at dinner. If a person is oppressed or deprived but has psychologically adapted to their circumstance (like Tiny Tim, perhaps, or a chronically deprived laborer), they may report high levels of subjective welfare. Conversely, a privileged but neurotic individual (Scrooge) may report misery. Equality of welfare would perversely direct resources away from the deprived Tiny Tim toward the miserable Scrooge. Because welfare is too malleable and too disconnected from objective opportunity, it cannot serve as the primary metric of justice.

  ### The Resourcist Standard and the Conversion Critique

  Dworkin's equality of resources attempts to solve this by shifting the focus from ends to means. Through his hypothetical auction and insurance market, Dworkin seeks a distribution that is "ambition-sensitive" (rewarding effort and choice) but "endowment-insensitive" (neutralizing brute luck like talent or disability). The "envy test" ensures that no one prefers another's bundle of resources to their own. This successfully handles the expensive tastes objection: if you choose to spend your share on champagne, that is your ambition, not society's debt.

  However, the resourcist view assumes a level of homogeneity among citizens that does not exist. This is the force of Sen's conversion factor critique. Resources are only instrumentally valuable; their value depends on the holder's ability to convert them into functioning. A person in a wheelchair and an able-bodied person may receive an equal cash allocation (resources), but the wheelchair user faces high costs to achieve the same mobility (functioning). If the environment lacks ramps, their equal resources buy them significantly less freedom.

  Dworkin attempts to handle this through the hypothetical insurance market: behind a veil of ignorance, wouldn't people insure against disability? While theoretically elegant, this relies on counterfactuals that are difficult to translate into policy. In the real world, strict resourcism often results in "formal equality" that masks "substantive inequality." If we stop at resources, we ignore the fact that a dollar is worth less to a person with high medical needs than to a healthy person. Equality of resources, without modification, fails the disability test.

  ### The Capability Approach: Freedom and Paternalism

  Sen's Capability Approach corrects this by evaluating justice in terms of "capabilities"—the substantive freedoms people have to achieve various "functionings" (beings and doings). By focusing on what people can actually *do* and *be*, the capability approach naturally accounts for conversion factors. It recognizes that the wheelchair user needs more than cash; they need accessible infrastructure to have the *capability* of mobility.

  However, the capability view introduces the dangers my friend identified: indeterminacy and paternalism. If justice is about capabilities, who decides which capabilities matter? If the state decides that "social integration" is a central capability, does it justify forcing a recluse into community centers? Martha Nussbaum attempts to solve this with a specific list of central human capabilities, but this risks imposing a controversial conception of the good life on citizens who may value things differently.

  Furthermore, there is the problem of measurement. Resources (income, assets) are relatively easy to quantify. Capabilities (freedom, dignity, social affiliation) are notoriously difficult to measure and compare interpersonally. A system that cannot be operationalized risks becoming a philosophical ideal with no political traction. This is where Cohen's "equality of access to advantage" attempts to intervene. Cohen suggests we equalize access to both welfare and resources, depending on whether the disadvantage is chosen. While this captures the nuance of the debate, it ultimately lacks a clear metric. "Advantage" is too vague to guide policy without collapsing back into either welfare or resources.

  ### The Verdict: Resources with a Capability Floor

  Given these trade-offs, we must avoid the unresolved three-way tie. The most defensible position is a **hybrid model: Resource Egalitarianism with a Capability Sufficiency Threshold.**

  This verdict privileges Dworkin's framework as the default engine of distribution but modifies it with Sen's insights to handle extreme cases of disadvantage. Here is how it works:

  1.  **Default to Resources:** For the vast majority of distributive questions, we should equalize resources (income, wealth, opportunities). This preserves the "ambition-sensitive" core of egalitarianism. It respects individual agency by allowing people to spend their share as they see fit, avoiding the paternalism of dictating which functionings they must pursue. It also avoids the welfare trap of subsidizing expensive tastes.
  2.  **The Capability Floor:** However, resource equality is only just if it allows everyone to cross a minimum threshold of central capabilities. If a person's disability or social circumstance prevents them from converting equal resources into basic functionings (mobility, health, political participation), justice requires a transfer of *additional* resources to bring them up to that capability threshold.

  This synthesis answers the objections raised at dinner. It answers the "expensive tastes" objection because the extra resources for the disabled are not based on subjective satisfaction (welfare), but on objective barriers to functioning. It answers the "conversion factor" objection because it explicitly acknowledges that the disabled need more than a standard share to achieve the same freedom.

  Crucially, this hybrid model mitigates the paternalism worry. We are not equalizing *achieved* functionings (which would force the recluse to socialize); we are ensuring the *capability* to function. The state provides the ramp and the income support; the individual chooses whether to leave the house. By limiting the capability threshold to "basic agency" requirements (as Nussbaum and Sen both suggest in different ways) rather than a comprehensive list of "good life" components, we respect pluralism.

  ### Conclusion

  The argument at the dinner table remained unresolved because each theory captures a different dimension of moral truth. Welfare captures the importance of well-being; Resources capture the importance of responsibility; Capabilities capture the importance of freedom. But a working theory of justice cannot be a mosaic of contradictions; it must be a hierarchy.

  Egalitarians should adopt Resource Egalitarianism as their general rule because it best respects human agency and responsibility. However, they must accept that resources are merely the means, not the end. When the conversion of means into freedom is blocked by brute luck—specifically disability or systemic exclusion—justice demands we switch metrics. We must guarantee a capability floor. This is not a contradiction, but a necessary qualification. Equality of resources is the right answer to the question "How do we treat responsible agents?" but Equality of Capabilities is the right answer to the question "What do we owe human beings?" Since we are both, our theory of justice must be both.
