answer: |-
  Your intuition is spot-on. This is not a fluke, and your coach is underestimating a well-documented phenomenon in social psychology and decision science. While your coach is technically correct that small sample sizes can produce noise, the *mechanism* you observed is robust enough that you should absolutely plan around it.

  What you experienced has a name: **Information Cascades** (combined with **Conformity Bias**).

  Here is the breakdown of why Method B (whiteboards) beat Method A (captain calls), why the "3 out of 4" statistic is the smoking gun, and how you should use this to prepare for Regionals.

  ### 1. The Science: Why Method A Fails
  In your old method (Captain calls, others nod), you created an **Information Cascade**.

  *   **Anchoring:** Once the captain speaks, her answer becomes "public information."
  *   **Social Cost:** For a teammate to disagree, they have to overcome the social friction of contradicting a leader. Even in a friendly team, there is a subconscious pressure to conform (related to the famous **Asch Conformity Experiments**).
  *   **Rational Herding:** Even if a teammate thinks, "I'm 60% sure it's False, but the Captain is usually right," they will rationally decide to go with the Captain to avoid looking foolish or causing conflict.

  The result is that the group stops aggregating *four* independent brains and starts aggregating *one* brain (the captain's) plus three "yes-men." If the captain is wrong, the whole team is wrong, even if the knowledge existed elsewhere in the room.

  ### 2. The Evidence: Why It's Not Noise
  You mentioned the most critical piece of data: *"On several statements where the old method's answer had been wrong, it turned out that at least three of us had privately written down the correct answer."*

  This proves it wasn't bad luck or a lack of knowledge. The knowledge **was present in the room**. The failure was a **retrieval failure caused by social dynamics.**

  In Method B (Private Whiteboards), you utilized the **Wisdom of Crowds** (specifically **Condorcet's Jury Theorem**). This theorem states that if each individual has a better-than-random chance of being correct, and they vote *independently*, the probability of the majority being correct approaches 100% as the group size increases. By writing privately, you ensured independence. By revealing simultaneously, you prevented the cascade.

  ### 3. Addressing the Coach's Skepticism
  Your coach is worried about statistical significance. In a vacuum, they are right: a few practice sets isn't a huge dataset. However, in decision science, we don't need a massive dataset to confirm a mechanism that is already proven in literature.

  The fact that the captain performed normally on individual questions elsewhere rules out "Captain had a bad day." The variable that changed was the **process**, not the people. That makes the result reliable.

  ### 4. How to "Plan Around" This for Regionals
  You cannot change the rules of the Science Bowl match itself (usually, players buzz individually, and conferencing is not allowed during standard questions). However, you can use this insight to optimize two things: **Practice Efficiency** and **Role Assignment.**

  **A. Keep the Whiteboard Method for Practice**
  Do not go back to the "Captain calls" drill.
  *   **Why:** It identifies knowledge gaps more accurately. In the old method, if the Captain got it right, you never knew that *you* would have gotten it wrong. The whiteboard method forces everyone to retrieve the answer, strengthening neural pathways for all four of you, not just the captain.
  *   **Pitch to Coach:** Frame it as "active recall" for the whole team, rather than "voting." It ensures all four brains are drilling, not just one.

  **B. Re-evaluate Buzzing Roles**
  Science Bowl teams often have informal specializations (e.g., "Sarah does Bio, Mike does Physics").
  *   **The Risk:** If your "Captain" is also the primary buzzer, you are replicating the Method A flaw during the actual tournament. If the Captain hesitates on a Physics question, but the Physics specialist on the team is waiting for the Captain to buzz, you lose the point.
  *   **The Fix:** Use the whiteboard data to see who *actually* knows what. If the whiteboards show that *you* consistently know the Earth Science answers faster or more accurately than the Captain, you should be the primary buzzer for Earth Science, regardless of hierarchy.
  *   **Strategy:** Assign "primary buzzer" responsibility based on the whiteboard data, not on seniority or title.

  **C. Psychological Safety**
  The whiteboard method builds a culture where being wrong is private and safe, but being right is visible. This encourages quieter teammates to trust their instincts during the actual match. If a teammate feels their knowledge is valued (because the whiteboards proved they know stuff the captain doesn't), they will buzz more aggressively during Regionals.

  ### Summary
  Your coach is treating this as a statistical anomaly, but you have identified a **process error**.

  *   **Is it real?** Yes. It is a classic case of Information Cascades suppressing group intelligence.
  *   **Should you change?** Yes. Keep the simultaneous whiteboard method for drills.
  *   **For Regionals:** Use the data from these drills to assign buzzing roles based on actual demonstrated knowledge, not team hierarchy.

  You have discovered a way to unlock the "hidden knowledge" in your team. That is a competitive advantage. Don't let it go. Good luck at Regionals!
