          *   *Kantian Orthodoxy:* **Problematic.** Kant's argument (found in *Lectures on Ethics* and *Metaphysics of Morals*) is usually that cruelty to animals *hardens the heart* of the human agent, making them more likely to violate duties *to humans*. It is an analogy or practice run. The student claims Kant thinks "it's really the animal's own pain that makes the cruelty wrong." This sounds suspiciously like a utilitarian or Schopenhauerian reading smuggled into Kant. Kant does *not* ground the wrongness in the animal's pain itself, but in the damage to the *human's* moral character.
