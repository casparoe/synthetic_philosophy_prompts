      *   *The Tension:* In *Ethics* (and *Politics*), Aristotle admits money is *nomos* (convention/law), not *physis* (nature). A shoe is natural (leather, crafted for foot); money is a social agreement.
      *   *The Resolution:* Aristotle distinguishes between the *existence* of the tool and the *purpose* of the tool.
          *   Yes, money is an artificial construct (convention).
          *   *However*, once constructed, it is assigned a specific *telos* (purpose) by human reason to serve the natural end of the household (self-sufficiency).
          *   "Natural" in this context doesn't mean "found in the wild." It means "in accordance with the rational purpose of human flourishing (*eudaimonia*)."
          *   So, using a conventional tool for its intended conventional purpose (exchange for needs) is "natural" *relative to human society*. Using it in a way that subverts that purpose (accumulation for infinity) is "unnatural."
      *   *Analogy:* A law is a human convention. But breaking the law is "wrong" within the system. Similarly, money is a convention, but using it against its conventional *purpose* (exchange) is a violation of reason.

