answer: |-
  This is a classic sticking point in Aristotle's *Politics*, and you are right to be suspicious of the Jowett translation—it's Victorian, moralizing, and often obscures the technical Greek terms. You're also asking exactly the right questions to dominate the seminar tomorrow. The tension between "money is conventional" and "usury is unnatural" is one of the most sophisticated parts of his economic thought.

  Here is the breakdown of the logic, separating the hierarchy of "unnaturalness" from the metaphysical status of money.

  ### 1. The Hierarchy: Why Usury is "Most" Unnatural
  You noticed that Aristotle condemns retail trade (*kapelike*) as unnatural *before* he gets to usury. So why is usury the "most hated"? It's a gradient of deviation from the **telos** (purpose) of human action.

  *   **Level 1: Household Management (*Oikonomia*):** This is **Natural**.
      *   *Goal:* Self-sufficiency (*autarkeia*) for the good life.
      *   *Method:* Acquiring use-values (food, tools, shoes).
      *   *Limit:* Finite. You only need so many shoes to cover your feet.
  *   **Level 2: Retail Trade (*Kapelike*):** This is **Unnatural (but contains a remnant of nature)**.
      *   *Goal:* Profit (accumulation of money).
      *   *Method:* Exchange (Commodity -> Money -> Commodity).
      *   *Why it's censured:* It treats exchange as an end in itself rather than a means to get goods for the household.
      *   *Why it's not the "worst":* It still involves **commodities**. Someone is still making or moving shoes, grain, or oil. There is still a connection to human need, even if the *motive* is profit. It is a perversion of exchange, but it is still exchange.
  *   **Level 3: Usury (*Tokismos*):** This is **Most Unnatural**.
      *   *Goal:* Profit.
      *   *Method:* Money -> More Money (M-M').
      *   *The Extra Work:* Usury removes the commodity entirely. It bypasses the "natural object" of money (exchange for goods).
      *   *The Breeding Metaphor:* This isn't just rhetoric; it's an **ontological claim**. Aristotle views the world as composed of things with specific natures. Living things breed; inanimate objects do not. A shoe does not make baby shoes. A sack of grain does not make baby grain (unless planted, which is agriculture/natural). Money is metal/discs. It is sterile.
      *   *The Logic:* To claim money can "breed" interest is to attribute a biological power to an inanimate object. It is a category error. Retail trade is a moral error (greed); usury is a metaphysical error (believing sterile metal can reproduce). That is why it is "most unnatural."

  **Seminar Point:** You can argue that for Aristotle, retail trade is a *moral* deviation (prioritizing profit over need), but usury is an *ontological* violation (attributing life to the lifeless).

  ### 2. The Paradox: Money is Conventional, so how can its use be "Natural"?
  This is your sharpest observation. In *Nicomachean Ethics* (Book V) and *Politics*, Aristotle admits money exists by *nomos* (convention/law), not *physis* (nature). If money is artificial, how can using it one way be "natural" and another "unnatural"?

  The resolution lies in Aristotle's **Functional Teleology**.

  *   **Artifacts have purposes:** A knife is artificial (not found in nature), but it has a "natural" use (cutting) and an "unnatural" use (e.g., using the handle to hammer a nail, or using it to trade for status). The *existence* of the knife is conventional, but its *function* is determined by reason.
  *   **Money's Function:** Aristotle argues that while money is a social invention, it was invented for a specific rational purpose: to facilitate the exchange of unequal goods so households can achieve self-sufficiency.
  *   **The Definition of "Natural" here:** When Aristotle says a use of money is "natural," he does not mean "found in the wild." He means **"in accordance with the rational purpose for which human beings invented it."**
      *   *Natural Use:* Using the convention of money to achieve the natural end of the household (survival/flourishing).
      *   *Unnatural Use:* Using the convention of money to subvert that end (accumulating infinite tokens that have no use-value).

  So, there is no contradiction. Money is a conventional tool, but **reason dictates the proper use of tools.** Using a tool against its rational purpose is "unnatural" in Aristotelian speak.

  **Seminar Point:** You can frame it this way: "Aristotle isn't saying money grows on trees. He's saying that even conventional tools have a rational *telos*. 'Natural' wealth-getting respects the limit of that *telos* (satisfying needs). 'Unnatural' wealth-getting ignores the limit. Usury ignores the *telos* entirely."

  ### 3. The Greek Term *Tokos*
  In the Jowett translation, you see "interest" and "birth/offspring." In Greek, it's the same word: ***tokos***.
  *   *Tokos* means the offspring of an animal.
  *   *Tokos* means the interest on a loan.

  Aristotle is punning on this to make a philosophical point. When you charge interest, you are claiming that money has the biological capacity to generate *tokos*. Since money is dead matter, this is a falsehood. It creates wealth out of nothing, whereas the "natural" wealth getting (agriculture, hunting, household management) creates wealth out of nature's bounty.

  ### 4. Cheat Sheet for Tomorrow's Discussion
  If the conversation stalls or you want to steer it, here are three moves based on your reading:

  1.  **On the "Unnatural" Label:** "I'm struggling with the distinction between retail trade and usury. Is Aristotle saying retail trade is *less* unnatural because it still involves commodities? It seems like usury is the 'purest' form of capitalism because it removes the use-value entirely, which is why he hates it most."
  2.  **On the Convention Paradox:** "Does anyone else see a tension with the *Ethics*? If money is by convention (*nomos*), how can usury be against nature (*physis*)? I'm thinking maybe 'natural' here just means 'rational according to the tool's purpose' rather than 'biological'?"
  3.  **On the Limit of Wealth:** "The key seems to be the limit. Household management has a limit (you stop buying shoes when your feet are covered). Usury has no limit (you never stop wanting more money). Is the real crime of usury that it encourages infinite desire in a finite world?"

  ### Summary of the Argument Logic
  1.  **Premise:** All things have a proper function (*telos*).
  2.  **Premise:** The function of wealth is to support the good life of the household (finite need).
  3.  **Premise:** The function of money is to measure/facilitate exchange of goods (medium).
  4.  **Observation:** Usury makes money the *source* of wealth rather than the *measure* of wealth.
  5.  **Metaphor:** It treats sterile metal as if it were fertile life (*tokos*).
  6.  **Conclusion:** Usury is the furthest deviation from the rational purpose of human economics; therefore, it is the "most unnatural."

  You're ready. The fact that you spotted the "convention vs. nature" contradiction puts you ahead of 90% of undergrads reading Jowett. Good luck.
