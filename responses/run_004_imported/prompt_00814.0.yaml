          *   Metaphor: "Birth of money from money" (*tokos* = offspring/interest).
          *   Conclusion: Most unnatural because money is sterile (inanimate), so making it "breed" violates its ontological status.

  3.  **Address Confusion 1: Retail Trade vs. Usury (The Gradient of Unnaturalness):**
      *   *Retail Trade:* Still involves commodities. I buy a shoe, sell a shoe. There is a *thing* being exchanged. It deviates from *oikonomia* because the goal is profit, not use, but it still respects the *form* of exchange (C-M-C or M-C-M').
      *   *Usury:* M-M'. No commodity. Money begets money directly.
      *   *The "Breeding" Metaphor:* It's not just rhetoric; it's ontological. Aristotle views the world teleologically. Things have functions.
          *   Shoe -> Wear (Natural). Shoe -> Sell (Unnatural/Secondary).
          *   Money -> Exchange for Goods (Natural). Money -> Exchange for More Money (Unnatural).
          *   Usury is the *purest* form of the unnatural because it removes the "good" (the commodity) entirely. It's exchange without use-value.
      *   *Why "Most" Unnatural?* Retail trade at least moves goods around (which has some social utility, even if profit-driven). Usury creates nothing but a claim on future wealth without producing anything. It's a violation of the category "inanimate object."

