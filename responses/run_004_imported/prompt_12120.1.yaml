answer: |-
  The silence on the *Orpheus* wasn't empty; it was heavy. It pressed against the hull, a physical weight that settled in the marrow. Elias was the only soul on a six-month solo survey run, three weeks out from the nearest relay buoy. There was no one to talk to, only the hum of the recyclers and the static of the deep-field sensors.

  On day eighteen, he felt it. It wasn't pain, exactly. It was a specific, cold shimmer behind his left eye, coinciding with a fluctuation in the engine's pitch. A synesthetic glitch. He needed to track it, he decided. Data was sanity. But there was no word for it in English, and no metric in the ship's diagnostic suite.

  So he invented one.

  He opened his personal log, a leather-bound notebook he'd brought for notes on stellar drift. On a fresh page, he drew a symbol: a circle bisected by a jagged line. He wrote beneath it: *The Shimmer.* He agreed with himself that whenever this specific sensation occurred, he would mark the symbol and the time. It was a private definition. A contract between Elias and Elias.

  Day twenty-two. The engine pitched. The cold shimmer bloomed behind the eye. Elias picked up his pen. He drew the circle. He drew the line. He felt a surge of satisfaction. The system worked. He had captured the ineffable.

  Day thirty-five. The sensation returned, but weaker. Or was it? He stared at the previous entries. There were four of them now. Identical ink marks. He looked inward, searching for the matching feeling. It felt similar. But "similar" was slippery. Was it the same intensity as day eighteen? He couldn't recall the intensity, only the fact that he had marked it.

  He drew the symbol again.

  By day fifty, the log was filling up. The symbol became routine. But a quiet anxiety began to pool in Elias's stomach. He realized he was no longer checking the sensation against the original experience. He was checking the sensation against his memory of the *symbol*.

  He sat in the command chair, the cold shimmer sparking behind his eye. He reached for the log. His hand hovered.

  *Wait,* he thought. *How do I know this is the Shimmer?*

  He looked at the previous page. The circle and the jagged line stared back. They were just ink. They held no sensory data. They only told him that *he had decided* this was the Shimmer. But what if yesterday, when he drew the symbol, the feeling was slightly different? What if he had drifted?

  If he decided today's feeling was the Shimmer, then it was. There was no external judge. No colleague to say, "No, Elias, that's just fatigue, look at the definition." The definition was the feeling itself.

  He tried to reconstruct the original day eighteen. He remembered the engine pitch. He remembered the light in the cabin. But the sensation? The *qualia* of it was gone, replaced by the memory of having named it.

  He realized with a jolt that he could draw the symbol every time he felt *anything* unusual, and the log would look the same. He could draw it when he was hungry. He could draw it at random. There was no mechanism to prove him wrong. If he felt sure he was right, he was right. And if "being right" meant nothing more than "feeling sure," then the symbol meant nothing.

  The engine hummed. The cold shimmer flared, sharp and distinct.

  Elias held the pen over the paper. If he drew the circle, was he recording a fact? Or was he creating one? If he chose not to draw it, would that make the sensation false?

  He looked at the column of identical glyphs. They looked like a code he had forgotten the key to. They promised a connection to his own interior life, but the bridge was out. He was trapped on one side, and the sensation was on the other, and the word was just a ghost hovering in the middle.

  He could change the definition now. He could decide that the symbol meant "hunger" starting tomorrow, and no one—not even future Elias—could prove the inconsistency, because the only evidence was the memory of the sensation, which was already fading.

  The distinction between consistency and arbitrariness had dissolved. Whatever seemed right to him was right. Which meant nothing was right.

  The shimmer faded. The engine droned on.

  Elias lowered the pen. He drew the circle. He drew the jagged line. He wrote the time. He did it because the habit remained, even if the meaning had evaporated. He closed the book, knowing that the next time he opened it, he would have no way of knowing if he was reading a record of truth, or just a history of his own impulses.

  He sat back in the silence, unsure if the word "silence" still meant what it had when he left Earth.
