          *   Step 1: Vote on a metric (Ecological-Health Index in 10 years).
          *   Step 2: Open conditional prediction markets (betting on the metric value for each parcel).
          *   Step 3: Buy the parcel with the higher market price.
      *   **Board Dynamics:** Split 50/50.
          *   *Pro:* Exposes factual disagreement vs. values clash.
          *   *Con:* False precision, liquidity issues (only ~30 traders), commitment problem (board turnover), conflict of interest (donor owns bordering land).
      *   **Task:** Draft a recommendation memo for the board vote.
      *   **Requirements:**
          *   Definite recommendation (Adopt, Modify, or Reject).
