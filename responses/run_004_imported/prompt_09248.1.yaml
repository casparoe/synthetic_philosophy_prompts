answer: |-
  **Setting:** *The lobby of the hotel hosting the Society for Philosophy and Psychology. It is 5:00 PM. The air smells of stale espresso and carpet cleaner. ELENA (defending Knobe's Moral Constitutive view) and DAVID (defending Machery's Trade-Off Hypothesis) sit in armchairs that are slightly too low.*

  **David:** Your talk was polished, Elena, but you sidestepped the control cases. Again. If the mechanism were truly moral competence, the effect should vanish when you strip out the morality. Machery showed it doesn't. It persists in purely pragmatic trade-offs.

  **Elena:** And you sidestepped the semantics of "trade-off." You claim Machery eliminates morality, but a "trade-off" is inherently evaluative. To say the chairman "traded" the environment for profit is to say the environment was a *cost*. You haven't removed evaluation; you've just swapped moral badness for pragmatic badness. You're smuggling valence in through the back door.

  **David:** Valence isn't morality. If I drive a nail, I accept the cost of a dented thumb risk. If I avoid the risk, I don't drive the nail. That's a structural constraint on agency, not a moral judgment. The chairman *sacrificed* the environment in the harm case to get profit. He didn't sacrifice profit to get the environment in the help case. The asymmetry tracks the sacrifice, not the sin.

  **Elena:** But why is harming a sacrifice and helping not? If the structure is identical—Policy X leads to Goal Y and Side-Effect Z—why does Z count as a cost only when it's bad? Your hypothesis relies on the agent viewing Z as a cost. But the chairman explicitly says he doesn't care about Z in either case. The *folk* impose the cost status based on Z's moral valence. So the moral evaluation determines the cost, not the other way around.

  **David:** You're assuming the folk are analyzing the chairman's mental state. They aren't. They're analyzing the action structure. When a side effect is negative, it registers as an obstacle overcome to get the goal. When it's positive, it's just debris. Look at the "deciding" cases you love. People say he "decided to harm" but not "decided to help." "Deciding" implies resolving uncertainty or overcoming inertia. Harming violates a norm, creating friction. Helping doesn't. The friction explains the asymmetry, not the moral content of the norm itself.

  **Elena:** That's a convenient redefinition of "friction." But test it. If I tell a vignette where the chairman violates a *etiquette* norm—say, wearing a white tie to a black-tie event to save money on laundry—do people say he intentionally violated the dress code? Yes. But if he accidentally *upholds* the dress code while saving money, they don't say he intentionally upheld it. The effect tracks normative status, not just cognitive friction. And what about "wanting"? People say he "wanted to harm" but not "wanted to help." Wanting doesn't imply overcoming inertia. I can want something effortless. Why does the moral valence penetrate the concept of desire?

  **David:** Because "wanting" in this context is interpreted as "willingness to accept." If the outcome is bad, willingness implies a positive drive to overcome the badness. If the outcome is good, willingness is passive. But let's turn your blade of grass objection against you. You argued earlier that if the harm is trivial—say, one blade of grass—the effect disappears. People don't say he *intentionally* harmed the grass. But on your view, it's still morally bad. If morality constitutes the concept, the magnitude shouldn't matter. A sin is a sin.

  **Elena:** Moral concepts are gradable. "Intentional" is a thick concept; it requires a certain threshold of normative significance to trigger the application. That doesn't mean morality isn't the trigger. It just means the trigger has a sensitivity setting. But your trade-off view fails the magnitude test harder. The structural trade-off is identical whether it's a forest or a blade of grass. Profit is gained either way. Why does the "cost" stop counting as a cost when the grass is small?

  **David:** Because the cost has to be salient to the trade-off heuristic. A blade of grass isn't a cost in a business decision. It's noise. This is parsimony, Elena. I don't need to posit that moral judgment rewires the concept of intentional action. I just need a general heuristic: *If an agent accepts a negative side-effect to achieve a goal, attribute the side-effect.* Negative includes moral badness, pragmatic loss, or norm violation. It's one mechanism. You need a specific moral module.

  **Elena:** But that "one mechanism" treats moral badness as just another negative utility. That's the error. When the chairman harms the environment, people aren't calculating utility; they're blaming. The attribution of intentionality is part of the blame assignment. If you remove the blame, the intentionality vanishes. Machery's non-moral cases work only because they mimic the structure of blame—there's a "victim" of the trade-off, even if it's just the agent's tires.

  **David:** The tires aren't a victim. They're a resource. And here's where your view cracks: The Deep Self. If we tell subjects the chairman is a devoted environmentalist but is forced by the board to harm the environment, intentionality ascriptions drop. If it were pure moral blame, we should want to blame him regardless. But we track his attitudes. My trade-off view handles this easily: if he resists the trade-off, he isn't accepting the cost. Your moral view has to complicate the "constitutive" claim to account for his internal resistance.

  **Elena:** The Deep Self view *is* part of the moral evaluation. We blame the agent only if the action flows from their values. That confirms my point: intentionality is tethered to moral responsibility. You're trying to reduce responsibility to cost-acceptance. But cost-acceptance is only relevant *because* we are holding the agent responsible. If I sleepwalk and break your vase, I accepted no cost, but I also bear no responsibility. You can't separate the two.

  **David:** I can if I show you cases where responsibility is held constant but the asymmetry shifts. Imagine a scenario where the agent is coerced equally in both harm and help cases. The asymmetry persists. The trade-off remains salient in the harm case (he gave up the environment to save his skin) but not the help case (he didn't give up his skin to save the environment). The moral valence of the outcome drives the perception of the trade-off, yes, but the *mechanism* is the trade-off detection, not the moral condemnation. You're conflating the input with the processor.

  **Elena:** But if the input determines the processor's output every single time, the distinction is vacuous. If "moral badness" is the only reliable predictor of what counts as a "cost" in these vignettes, then positing a "cost" mechanism is an unnecessary middleman. Occam's Razor cuts your throat here. Why posit a general trade-off detector that only reliably fires on normative violations? Just admit the detector is normative.

  **David:** Because it fires on non-normative violations too! The tire case. The time-delay case. If I take a route that saves fuel but wastes time, I intentionally wasted time. If I save time but waste fuel, I didn't intentionally waste fuel. Time and fuel aren't moral. They're resources. The mechanism is resource allocation. Morality is just one currency the brain trades in.

  **Elena:** Time and fuel are *goods*. Wasting them is *bad*. You keep using words like "waste," "save," "cost," "sacrifice." Every single one of those is evaluative. You haven't escaped the normative; you've just secularized it. You're saying the concept of intentional action is constituted by *evaluation*, full stop. I'm saying it's constituted by *moral* evaluation because, for the folk, the relevant evaluations in these social contexts are moral. We're closer than you think, but you're refusing to admit that "pragmatic cost" is just morality by another name in a social context.

  **David:** I refuse that because it blinds you to the cognitive architecture. If I train a subject to view "helping the environment" as a cost—say, in a dystopia where environmentalism is punished—the asymmetry flips. They say he intentionally helped. Your view says morality is constitutive. But if the moral valence flips, the intentionality flips. That proves intentionality tracks the *valence*, not a fixed moral truth. My trade-off view predicts the flip: if helping becomes a cost, it gets traded. Your view has to say our concept of "intentional" changes based on the political regime.

  **Elena:** And that's exactly right! Our concept of intentional action *is* sensitive to the normative landscape. If the norm flips, the intentionality flips. That doesn't prove it's a neutral trade-off; it proves the concept is permeable to normative status. You think you've found a neutral mechanism, David, but you've just found that the mechanism is sensitive to *whatever the community treats as a cost*. In our world, harm is a cost. In your dystopia, help is a cost. The mechanism isn't neutral; it's a normative compass.

  **David:** A compass needs a needle, not a map. I'm describing the needle. You're describing the map. The needle points to "cost." The map tells you what counts as a cost. Experimental philosophy is supposed to find the needle. You're obsessed with the map.

  **Elena:** But if the needle is magnetized by morality, you can't describe the needle without mentioning the magnet. You say "trade-off," I hear "moral sacrifice." Until you can give me a case where a side effect is genuinely value-neutral—no good, no bad, no norm violated, no resource lost—and the asymmetry persists, I'm sticking with the magnet.

  **David:** And until you can explain why the asymmetry vanishes when the agent is truly indifferent to the magnitude of the side effect without invoking "blame thresholds" that look suspiciously like cost-benefit analysis, I'm sticking with the needle.

  **Elena:** *[Sips cold coffee]* We're going to need a new vignette.

  **David:** *[Signals waiter]* Make it two. And check if they charge for the refills. I want to see if we think that's intentional.
