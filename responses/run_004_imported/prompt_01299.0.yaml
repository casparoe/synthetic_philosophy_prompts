      *   **Character's Intuition:** The sister feels this is *fundamentally different* from disease screening, even though the mechanism (selecting existing embryos) is the same.
      *   **Question:** Is she onto something real and defensible (philosophically/ethically), or is it just squeamishness disguised as philosophy?
      *   **Tone:** Thoughtful, nuanced, suitable for a novelist looking for depth (not just a yes/no answer).

  2.  **Initial Assessment & Fact-Checking:**
