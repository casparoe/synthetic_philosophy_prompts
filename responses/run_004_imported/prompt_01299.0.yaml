answer: |-
  Your sister is absolutely onto something real. Her intuition isn't just squeamishness; it taps into one of the most robust and debated distinctions in bioethics: the line between **therapy/prevention** and **enhancement/selection.**

  While the *mechanism* (selecting one embryo over another) is identical, the *moral ontology* of the choice shifts significantly when you move from disease to traits. For a novel, this is rich soil. Here is a breakdown of why her feeling is philosophically defensible, along with the scientific context you might need to make the plot hold water.

  ### 1. The Therapy vs. Enhancement Distinction
  This is the core argument.
  *   **Disease Screening (Therapy/Prevention):** The goal here is to bring a future child up to a baseline of "normal functioning" or to prevent significant suffering. Most ethical frameworks agree that parents have a duty to prevent harm to their children. Selecting against Tay-Sachs or Huntington's is viewed as an act of care.
  *   **Cognitive Selection (Enhancement):** The goal here is not to prevent suffering, but to secure a competitive advantage. It moves from "I want my child to be healthy" to "I want my child to be *better* than average."
  *   **The Novel Conflict:** Your sister's character might feel that by choosing the "smarter" embryo, they aren't acting as protectors anymore; they are acting as **managers** or **investors**. It shifts the parent-child relationship from one of stewardship to one of design.

  ### 2. The "Open Future" Argument
  Philosopher Jürgen Habermas and others argue that genetic selection can impinge on a child's right to an "open future."
  *   **Disease:** Removing a gene for a debilitating disease *opens* the future (the child isn't confined by illness).
  *   **Traits:** Selecting for a specific trait (like high cognitive test performance) can subtly *close* the future. It creates an expectation. If you select for math ability, does the child feel they *must* pursue STEM? If they struggle in school despite the genetic edge, do they feel they failed the design specs?
  *   **The Nagging Feeling:** Your sister might feel that by picking the "cognitive" embryo, they are implicitly signing a contract on the child's behalf: *We chose you for this potential; now please fulfill it.*

  ### 3. The Problem of Probability (The Science Bit)
  This is crucial for your plot's realism. Currently, Polygenic Risk Scores (PRS) for complex traits like cognition are **statistically weak** on an individual level.
  *   **Disease:** Some genetic diseases are monogenic (one gene = disease). The prediction is near 100% accurate.
  *   **Cognition:** This is polygenic (thousands of tiny variants). The environment plays a massive role. The difference in predicted outcome between two embryos is often marginal.
  *   **The Ethical Weight:** If the clinic says Embryo A is in the 60th percentile and Embryo B is in the 65th percentile, is it ethical to discard Embryo A (a perfectly healthy potential human) for a 5% statistical nudge?
  *   **Plot Point:** If your novel is set in the present day, the clinic offering this is arguably predatory, as the science is widely considered unreliable for individual embryo selection. If it's near-future sci-fi, you can posit the tech is better. But if the tech is still probabilistic, your sister's hesitation is scientifically grounded: *They are making a life-altering moral choice based on a coin flip.*

  ### 4. Commodification and "The Giftedness of Life"
  Philosopher Michael Sandel argues against what he calls the "drive to mastery."
  *   **Acceptance vs. Control:** Parenting traditionally involves a tension between nurturing and accepting the child as they come (a "gift"). Genetic selection tips the scale entirely toward control.
  *   **Commodification:** When you start comparing embryos based on percentile rankings, you risk turning procreation into a form of production. Your sister might feel that looking at her potential children as data points devalues the mystery and unconditional nature of bringing a life into the world.
  *   **The "Tie-Breaker" Issue:** This is the most dramatic part of your scenario. If there was only one healthy embryo, they'd take it. Because there are *two*, they feel entitled to optimize. Your sister might realize that **scarcity creates acceptance, while abundance creates consumerism.** Having a choice makes them feel like customers.

  ### 5. Social Justice and Eugenics
  Even if *their* choice feels private, it contributes to a public landscape.
  *   **The Aggregation Problem:** One couple choosing for height or smarts doesn't change society. But if everyone does it, it creates a genetic caste system.
  *   **The Sister's Guilt:** She might feel that even if it's harmless for *them*, participating in the normalization of the technology validates a system that could eventually lead to a new form of inequality. She isn't just choosing a child; she's voting on the kind of world she wants to live in.

  ### How to Use This in the Novel
  To make this feel authentic and not just "preachy," consider these angles:

  1.  **The Husband's Perspective:** Don't make him a villain. Make him a pragmatist. "If we can give them a leg up in a hard world, why wouldn't we? It's the same as paying for a good school district, just earlier." This highlights the class/privilege aspect.
  2.  **The Uncertainty:** Have the sister obsess over the margin of error. "What if the 5% difference is just noise? What if we throw away the one who would have been a poet for the one who is good at taking tests?"
  3.  **The Language:** Pay attention to how the clinic talks vs. how the sister talks. The clinic uses words like "optimization," "potential," and "scores." The sister uses words like "baby," "life," and "chance."
  4.  **The Outcome:** You don't have to resolve the ethics. The tension is the story. Maybe they choose the number, and she spends the pregnancy waiting to see if the child "performs." Or maybe they flip a coin, reclaiming the randomness.

  ### Verdict
  Your sister is **not** being squeamish. She is identifying a shift from **medical necessity** to **consumer preference.**

  *   **Disease Screening:** "We want to avoid suffering." (Widely accepted)
  *   **Trait Selection:** "We want to maximize advantage." (Ethically fraught)

  The mechanism is the same, but the *intent* changes the moral texture of the act. One is an act of protection; the other is an act of ambition. That is a completely defensible, profound, and novel-worthy conflict.
