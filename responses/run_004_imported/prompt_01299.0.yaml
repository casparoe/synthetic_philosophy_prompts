prompt: |-
  Ok, weird one, but I'm chewing on it for a novel I'm plotting. My sister and her husband are mid-IVF, and the clinic's screening add-on has gotten way more sophisticated than just flagging serious disease risk - it now spits out percentile predictions per embryo for stuff like adult height and 'cognitive test performance,' built off all the tiny genetic variants correlated with those traits. Ruling out any embryo with a serious disease risk was a total no-brainer for them, obviously. But now they've got two embryos that are both basically disease-free, and theyre leaning on the cognitive number to break the tie. My sister has this nagging feeling that using it that way is a fundamentally different kind of choice than the disease screening was, even though technically nobody's DNA is being touched either way, its all just picking among embryos that already exist. Is she onto something real and defensible there, or is that just squeamishness wearing a philosophy costume?
