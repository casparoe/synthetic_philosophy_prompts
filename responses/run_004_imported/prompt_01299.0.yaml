  3.  **Brainstorming the Ethical Distinctions (The "Something Real"):**
      *   *Therapy vs. Enhancement:* This is the big one. Preventing suffering vs. maximizing potential.
      *   *The "Good Enough" Threshold:* Disease screening aims for "normal/healthy." Trait selection aims for "better than average."
      *   *Predictive Validity:* Disease genes (like Huntington's) are often high certainty. Polygenic scores for cognition are probabilistic and influenced heavily by environment.
      *   *Commodification:* Does selecting for traits turn the child into a product designed to spec?
      *   *Parental Expectations:* Does picking for smarts create pressure on the child to be smart?
      *   *Social Justice:* If only rich people can do this, does it exacerbate inequality?
