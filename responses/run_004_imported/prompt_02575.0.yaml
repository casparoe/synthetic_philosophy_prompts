  The spectral imaging machine hummed, a low, electric insect sound that seemed to vibrate in the teeth of everyone standing around the *Saint Jerome*. The painting leaned against the wall of the conservation lab, bathed in the cold, clinical glare of the overhead LEDs.

  Elias wiped his hands on a rag stained with linseed oil. He had spent eighteen months on the lower quadrant, where the original canvas had rotted away entirely. He hadn't copied a reference; there was none. He had inhabited the dead painter's hand. He had matched the viscosity of the lead white, the crackle of the varnish, the specific melancholy of the shadow.

  Silas, the new curator, tapped the monitor. The false-color image showed the truth in neon blues and angry reds. The lower quadrant didn't match the chemical signature of the seventeenth century. It matched a supply order from 2023.

  "It's not just overpainting," Silas said. His voice was flat, devoid of the reverence usually reserved for the collection. "It's a fabrication. You didn't restore this, Elias. You replaced it."

  "It was missing," Elias said. "I gave it back wholeness."

  "You gave it a lie." Silas turned to Elena, the museum's largest donor, who stood with her arms crossed. She had funded the scan. "You see the difference now?"

  Elena stepped closer to the canvas. Before the scan, she had stood before the *Saint Jerome* for twenty minutes, weeping silently at the sorrow in the saint's eyes. Now, she leaned in, her nose inches from the paint. She squinted. She pulled back. She squinted again.

  "It looks..." She stopped, frustrated. "It looks nervous."

  Elias felt a cold knot in his stomach. "The brushwork hasn't changed, Elena. The light hitting your retina is identical to yesterday."

  "It's not," she insisted, tracing the air over the saint's robe without touching it. "Yesterday, the stroke looked confident. Decisive. Now I see the hesitation. I see you thinking about where to put the brush. It looks... tentative."

  "That's impossible," Elias said. "I didn't hesitate."

  "But you aren't him," Silas cut in. He moved between Elena and the painting, not to block her view, but to frame the argument. "That's the point. You're arguing about optics. You're saying if the eye can't tell, the crime doesn't exist."

  "I'm saying the experience is intact," Elias said. "The beauty is there. The emotion is there."

  "The emotion is a trick," Silas said. "It's not about how it looks, Elias. It's about who did it. When you look at a Rembrandt, you aren't just looking at pigment. You're looking at a moment in history where a specific human being made a decision. You're witnessing an act of creation. This?" He gestured to the glowing screen. "This is an act of mimicry. It steals the credit for a genius that isn't present. It's plagiarism of history."

  Elena stepped back, rubbing her temples. "I can't unsee it. Knowing it's you... it changes the color. The blue looks cheaper. The shadow looks muddy."

  "That's in your head," Elias said, though he felt his own conviction crumbling. He looked at his own handiwork. Had the shadow always been that flat? Had the fold of the robe always lacked that specific gravitational pull? The knowledge was a virus. It was rewriting the visual data in real-time.

  "Maybe," Silas said. "But that's exactly why authenticity matters. It trains the eye. If we accept this, we stop looking for the truth of the hand. We accept the surface. We become content with the simulation."

  "I saved the painting!" Elias's voice cracked. "Without me, it's a hole. With me, it's a whole image. The viewer gets the art."

  "The viewer gets a performance," Silas corrected. "And now the curtain is up. You want us to applaud the magician instead of the miracle."

  Elena moved to the side, looking at the painting from an angle, seeking the gloss, the texture, anything that would betray the secret. "It's strange," she murmured. "Yesterday, I felt like I was communing with the dead. Today, I feel like I'm being managed."

  She turned to Elias, and her eyes were full of a pity that hurt more than anger. "I want to see the mastery. I need to know that the struggle was real. If you solved the problem too easily, if you didn't suffer the way he did... then the image doesn't carry the weight."

  "I suffered," Elias whispered.

  "But not then," Silas said. "Not in the moment of creation. You suffered because you were caught. That's not the same history."

  The hum of the machine seemed to grow louder. Elias looked at the *Saint Jerome*. The saint's eyes, which had seemed so full of divine resignation yesterday, now looked vacant. The brushstrokes didn't flow; they stopped and started. He could see his own anxiety baked into the drying oil. He could see the moment he'd worried he'd used the wrong shade of ochre.

  The painting hadn't changed. The molecules were settled. The light refracted the same way. But the room had shifted on its axis. The object was no longer a window into the past; it was a mirror reflecting the present deception.

  "So what happens?" Elias asked. "Do I strip it? Leave a hole?"

  "No," Silas said, looking at the screen, then at the canvas. "We label it. We tell the truth. The image remains, but the claim is revoked."

  "And the value?" Elena asked.

  "Changes," Silas said.

  "Even though it looks the same?"

  "Especially because it looks the same," Silas said. "Because now we know we can't trust our eyes. We have to trust the history."

  Elias looked back at the saint. He tried to force his eyes to accept the beauty, to strip away the knowledge of the author. He tried to see only the color, the form, the light. But the knowledge was sticky. It coated the lens. The blue was cheap. The shadow was muddy. The silence in the room was no longer reverent; it was accusatory.

  He realized then that the forgery wasn't in the paint. It was in the looking. And now that they knew, no one would ever really see the painting again. They would only see the lie.
