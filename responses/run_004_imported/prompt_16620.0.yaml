prompt: |-
  I spent thirty-five years as an experimental particle physicist before retiring four years ago, and only in the last year or so have I taken up a rather late-arriving education in philosophy of science, most recently a run of reading on the foundations of statistical inference that I probably should have done fifty years before I ever quoted a five-sigma result. What has unsettled me is the likelihood principle, and in particular its consequence that the stopping rule an experimenter follows -- the reason she decided to stop collecting data when she did -- has no bearing on what the data, once collected, actually tell you, provided you reason about them in Bayesian terms. This cuts directly against the frequentist testing I built a career on, in which the validity of a p-value depends essentially on the sampling and stopping plan behind it, not merely on the data in hand. I have been discussing all this with two old colleagues from my department, both bemused that I now spend more time reading philosophers than I ever spent calibrating detectors, but neither could tell me who is right, which is part of why I am raising it here. It has also stopped being merely an abstract puzzle for me, because I now sit on my university's Research Practices Committee -- a body distinct from the formal misconduct office, charged with adjudicating disputes about methodological rigor -- and a case has landed on our desk that turns on precisely this point.

  A postdoctoral researcher in the psychology department ran a two-condition behavioral study with an internal, unregistered plan to recruit 200 participants. She checked her results periodically as they came in and stopped at 137, once a two-tailed test had crossed the conventional threshold (p = .043). A graduate student in her lab, who later failed to replicate the effect independently and does not appear on the resulting paper, has filed a complaint alleging that this "optional stopping" is exactly the sort of undisclosed flexibility blamed for her field's replication crisis, and has asked the committee to find a violation of the department's data-integrity policy and require a correction to the published paper. The postdoc's written response, prepared with a colleague from the statistics department, concedes the sequential checking but denies any impropriety: she reports that a Bayes factor computed on the final data, using a prior she specified before she ever looked at the results, favors her hypothesis by roughly 8 to 1, and argues that since the evidential meaning of the data she collected does not depend on why she stopped collecting it, the complaint is really an objection to the frequentist framework's own sensitivity to stopping rules, and not to anything she actually did.

  The committee is now split along precisely this line, and not, to my surprise, along the usual fault line between the hard scientists and the social scientists among us. Half of us want to hold the postdoc to the standard she herself reported her result under: a p-value whose validity she compromised by the very manner in which she gathered the data, whatever a later Bayesian reanalysis might say. The other half think it would be perverse to sanction her for violating a norm whose own philosophical rationale is the very thing she is disputing, particularly on the strength of a framework several of us privately doubt we could defend if pressed. I need to circulate a short written opinion before we meet next week, and I would like your help drafting it. It should reach a specific finding on this case, with a corrective action and a deadline if one is warranted, and it should also propose a policy for the department to adopt going forward, since this will not be the last complaint of its kind. Whatever it recommends, it should engage honestly with the strongest version of the losing argument rather than brushing it aside.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the User and Context:**
      *   **User:** Retired experimental particle physicist (35 years career), 4 years retired. Recently educated in philosophy of science/statistical inference. Sits on a university Research Practices Committee (RPC).
      *   **Background:** Deeply familiar with frequentist methods (5-sigma results), now grappling with the Likelihood Principle and Bayesian vs. Frequentist tensions.
      *   **The Case:** A psychology postdoc ran a study (planned $N=200$), checked data periodically, stopped at $N=137$ when $p < 0.05$ ($p=0.043$). A grad student complained about "optional stopping" (p-hacking). The postdoc argues via the Likelihood Principle/Bayesian analysis (Bayes Factor $\approx 8$) that the stopping rule is irrelevant to the evidence.
      *   **The Committee:** Split 50/50. Some want to enforce the frequentist standard used in the paper; others think it's unfair to sanction based on a disputed philosophical norm.
      *   **The Task:** Draft a short written opinion for the committee.
      *   **Requirements:**
          *   Reach a specific finding on the case (violation? no violation?).
          *   Propose corrective action/deadline if warranted.
          *   Propose a policy for the future.
          *   Engage honestly with the strongest version of the *losing* argument (don't strawman).
          *   Tone: Professional, authoritative, nuanced, acknowledging the user's specific background (physics -> philosophy transition).

  2.  **Deconstruct the Statistical/Philosophical Conflict:**
      *   **Frequentist View (The Complaint):** $p$-values depend on the sampling distribution, which depends on the stopping rule. Optional stopping inflates Type I error rates. If you report a $p$-value, you must adhere to the assumptions under which that $p$-value is valid. The postdoc reported a $p$-value, so she must follow frequentist rules.
      *   **Bayesian/Likelihood View (The Defense):** The Likelihood Principle states that all evidence is in the likelihood function. Stopping rules are irrelevant to the evidence *given the data*. If the Bayes Factor is strong (8:1), the conclusion is robust regardless of when she stopped. Punishing her for following Bayesian logic while reporting frequentist metrics is inconsistent.
      *   **The Crux:** The postdoc *reported* a $p$-value ($p=0.043$) as the primary evidence in the paper. She did not lead with the Bayes Factor. She invoked the Bayesian defense only *after* being challenged.

  3.  **Determine the Finding:**
      *   *Option A: No Violation.* Embrace the Bayesian view. Risk: Undermines current publication standards in psychology which are predominantly frequentist. Confuses the record.
      *   *Option B: Violation.* Enforce the frequentist view. Rationale: You play by the rules of the metric you use. If you report a $p$-value, you imply a frequentist framework where stopping rules matter.
      *   *Decision:* Option B is the only administratively defensible position for a Research Practices Committee *at this time*. Why? Because scientific communication relies on shared standards. If a paper claims statistical significance based on $p < 0.05$, it invokes the frequentist contract. You cannot retroactively switch frameworks to evade error rate control. However, the opinion must acknowledge the philosophical validity of the Bayesian critique to satisfy the "engage honestly" requirement.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Committee Memo format.
      *   **Introduction:** Acknowledge the complexity. Reference the user's background implicitly (respect for rigor). State the purpose.
      *   **The Core Conflict:** Clearly articulate the Frequentist vs. Bayesian tension. Acknowledge the Likelihood Principle (showing the user's new education is valued).
      *   **The Finding:** Violation of data integrity policy *regarding reporting standards*, not necessarily "misconduct" in the sense of fraud. The issue is *misleading statistical reporting*.
      *   **Rationale (The "Why"):**
          *   *The Losing Argument (Bayesian):* Acknowledge that philosophically, the Likelihood Principle has merit. Stopping rules *shouldn't* matter for evidence. The postdoc's statistical consultant is theoretically sound *within a Bayesian framework*.
          *   *The Winning Argument (Frequentist/Contractual):* Science is a social practice. The paper spoke the language of frequentism ($p$-values). Readers interpret $p=0.043$ as a controlled error rate. Optional stopping breaks that contract. You can't claim the benefit of the frequentist threshold without the burden of the frequentist constraints.
      *   **Corrective Action:** Correction/Erratum. Re-analyze with sequential methods or report the Bayes Factor *alongside* a corrected $p$-value (or confidence intervals adjusted for peeking). Deadline: 60 days.
      *   **Future Policy:** Pre-registration is the pragmatic solution. It resolves the ambiguity. If you want to peek, register a sequential design. If you want to be Bayesian, state it upfront.
      *   **Tone Check:** Needs to sound like a senior scientist speaking to peers. Not dogmatic, but decisive. Acknowledge the "unsettling" nature of the philosophy.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is it fair to punish her if the Bayesian view is "true"?
      *   *Correction:* Frame it not as "Bayes is wrong," but as "Communication requires consistency." The sin isn't the stopping; it's the *undisclosed* stopping combined with a frequentist claim.
      *   *User's Background:* The user knows 5-sigma. In physics, look-elsewhere effects and stopping rules are taken very seriously. I should subtly lean on that rigor without being arrogant toward psychology.
      *   *Philosophical Nuance:* Ensure the Likelihood Principle is described accurately. It says evidence is in the likelihood ratio. But decision theory (which $p$-values often serve) depends on error rates. Distinguish *evidence* from *decision criteria*.

  6.  **Final Polish:**
      *   Check constraints: Specific finding? Yes. Corrective action/deadline? Yes. Future policy? Yes. Engage losing argument? Yes.
      *   Voice: Experienced, thoughtful, authoritative.

  7.  **Final Output Generation:** (Proceeding to draft the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Research Practices Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Finding and Recommendation regarding Case #2023-04 (Psychology Department)

  **I. Summary of Finding**

  It is the opinion of this reviewer that the postdoctoral researcher has violated the department's data-integrity policy regarding transparent reporting, though not necessarily scientific misconduct in the sense of fabrication or falsification. The violation lies in the discrepancy between the statistical framework invoked in the published results (frequentist hypothesis testing) and the data-collection procedure employed (optional stopping), without disclosure or adjustment.

  **Corrective Action:** The researcher must submit a formal Correction or Erratum to the publishing journal within 60 days. This correction must explicitly disclose the sequential monitoring of data and the stopping rule employed. Furthermore, the statistical evidence must be re-evaluated using a method appropriate for optional stopping (e.g., sequential analysis boundaries or a fully specified Bayesian analysis with priors declared in the correction).

  **II. Statistical and Philosophical Context**

  This case forces the Committee to adjudicate a foundational tension in statistical inference, one that has recently unsettled even those of us with long careers in experimental physics. We are confronted with two coherent but incompatible frameworks.

  *The Defense (The Likelihood Principle):* The postdoc's statistical consultant argues from the Likelihood Principle, a cornerstone of Bayesian inference. This principle holds that the evidential import of data is contained entirely in the likelihood function. Under this view, the data collected ($N=137$) speak for themselves; the experimenter's private intention to stop at $N=200$ or $N=137$ is irrelevant to what the data say about the hypothesis. The reported Bayes Factor (8:1) suggests substantial evidence regardless of the stopping rule. To sanction the researcher on frequentist grounds is, from this perspective, to punish her for adhering to a more philosophically robust standard of evidence.

  *The Prosecution (Frequentist Error Control):* The complainant argues from the frequentist framework, which dominates current psychological publication standards. In this framework, a $p$-value is not a measure of evidence per se, but a guarantee about long-run error rates. That guarantee is mathematically contingent on the sampling plan. "Peeking" at data and stopping when significant inflates the Type I error rate (false positives) well beyond the nominal 5%. By reporting $p=0.043$ without adjustment, the paper claims a false precision regarding error control.

  **III. Rationale**

  While I acknowledge the philosophical strength of the Likelihood Principle—and I concede that in a purely evidential vacuum, the Bayesian defense is theoretically sound—scientific communication is a social contract, not merely a philosophical exercise.

  When a researcher reports a $p$-value and claims "statistical significance" at the 0.05 level, they are invoking the frequentist framework. They are signaling to the reader that the result meets the error-control standards associated with that framework. One cannot claim the rhetorical benefit of the frequentist threshold (the widely accepted stamp of "significance") while rejecting the methodological burdens (fixed sampling or adjusted alpha) that validate that threshold.

  To rule otherwise would create a "heads I win, tails we philosophize" precedent. If we accept that stopping rules are irrelevant whenever a researcher can compute a Bayes Factor post-hoc, we effectively nullify the data-integrity policies designed to prevent p-hacking. The violation here is not that the researcher stopped early; it is that she reported a frequentist metric that is invalid under her stopping procedure, without disclosing the procedure or switching frameworks in the original manuscript.

  **IV. Policy Recommendation for Future Practice**

  This case highlights the ambiguity of our current standards. To prevent recurrence, I recommend the Committee propose the following policy updates to the Department:

  1.  **Mandatory Pre-registration:** All hypothesis-testing studies must pre-register the sample size determination and stopping rules on a public repository (e.g., OSF) prior to data collection.
  2.  **Framework Declaration:** Authors must declare the inferential framework (Frequentist or Bayesian) in the methods section.
      *   If **Frequentist**: Sequential checking is prohibited unless specific sequential analysis methods (e.g., alpha spending functions) are pre-registered and applied.
      *   If **Bayesian**: Priors and stopping criteria (e.g., "collect data until BF > 10") must be pre-specified.
  3.  **Transparency on "Peeking":** If data were monitored during collection, this must be explicitly stated in the published manuscript, regardless of the statistical framework used.

  **V. Concluding Thought**

  We are asking the researcher to correct the record, not because her data are necessarily "wrong" in an absolute sense, but because the map she drew does not match the territory she traversed. As a former physicist, I am sympathetic to the view that nature should not care when we stop counting events. But science is not just about nature; it is about how we report nature to one another. Until the field collectively shifts to a Bayesian standard, we must enforce the frequentist rules when frequentist claims are made.

  I move that we adopt this finding and forward the policy recommendations to the Department Chair.
