  Here is a toast drafted for you. It's written to be spoken at a moderate, conversational pace. It should run about 3 to 4 minutes. I've kept the Latin references implicit so the guests understand the *wisdom* without needing the *context*, while keeping the structure you asked for.

  ***

  **[Stand up, tap your glass gently, and wait for the room to settle]**

  Hi everyone. For those who don't know me, I'm [Your Name], [Grandpa's Name]'s grandson/granddaughter.

  My mom asked me to say a few words because I'm "good with words." But honestly, when you're talking about ninety years, you don't need fancy words. You just need the truth.

  Recently, I've been studying some very old writing about aging. The author argued that people usually worry about four specific things when they get old. But looking at my grandpa, I realize those worries are wrong. So, I want to address those four things, right now.

  **The first complaint is that old age takes you out of the action.**
  People think that when you step back, you stop leading. Two years ago, Grandpa sold the hardware store. By all accounts, he should have walked away. But we all know he still calls the new owner every week with "suggestions."
  There's an old image I love about this: It says an older man shouldn't be judged by whether he's climbing the masts in a storm. He's the one sitting calmly at the helm, steering the ship. The young crew can haul the ropes, but the captain holds the course. Grandpa isn't out of the action; he's just moved to the most important spot on the ship.

  **The second complaint is that old age wrecks the body.**
  Yes, Grandpa uses a cane now. He moves slower than he used to. But there's a difference between being fragile and being steady. He doesn't rush, because he knows exactly where he's going. He's traded speed for stability, and if you ask me, that's a fair trade.

  **The third complaint is that old age takes away your pleasures.**
  I know the doctor has him off the spicy wings and down to one beer. **[Pause for light laughter]** But the old writers said that when you lose the loud, physical pleasures, you make room for the better ones. Look around this room. The pleasure isn't in the spice anymore; it's in the company. It's in the card games, the stories, and seeing all of you here. He hasn't lost the joy; he's just distilled it.

  **And the fourth complaint… is the big one.**
  People say old age is just a waiting room for the end. But ninety years isn't a waiting room. It's a harvest.
  That same old writer compared a life well-lived to fruit on a tree. When fruit is unripe, it's torn off by force. But when it's ripe, it falls gently, on its own time. Ninety years is ripe.
  He also compared it to a play. It's not about how long the play is, but how good the final act is. And looking at the man sitting at the head of the table, I'd say this is a damn good final act.

  **[Raise your glass]**

  Grandpa, you've steered the ship, you've kept your footing, you've found the real joy, and you have ripened into something rare.
  To ninety years. To you.

  **[Cheers]**
