      *   **Nuclear Deterrence:** Parallel structure. Threat must be credible to work. If carrying out the threat is irrational *ex post*, the threat isn't credible *ex ante*.
      *   **Self-Binding (Ulysses Pact):** The user's tools are precommitment devices. They change the payoff structure or the agency of the future self.
      *   **Rationality Models:**
          *   *Sophisticated Choice (Standard Game Theory):* You anticipate your future self's rationality. If future self won't drink toxin, you can't intend to. Binding is necessary to *change* the game.
          *   *Resolute Choice (McClennen):* You stick to the plan even if it seems suboptimal locally.
          *   *Self-Pattern/Identity (Parfit/Schechtman):* Psychological continuity matters.

  3.  **Map Philosophy to Productivity Tools:**
      *   **Beeminder/Slack Bot:** These aren't just "intentions." They are *mechanisms* that alter the payoff matrix.
      *   **The Toxin Puzzle vs. Precommitment:** In the Toxin Puzzle, the billionaire pays for *intention*, not action, and you *cannot* bind yourself (no external enforcer). In Beeminder, you *can* bind yourself (money is actually lost, shame is actually incurred).
      *   **Key Distinction:** The Toxin Puzzle is about the *impossibility* of intending without binding. Productivity tools are about the *necessity* of binding to make the intention rational.
      *   **The "Flaw" vs. "Asset" Debate:**
