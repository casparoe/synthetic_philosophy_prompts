  *(Self-Correction during drafting)*: I need to be careful not to conflate the Toxin Puzzle exactly with Precommitment. The Toxin Puzzle is specifically about the *impossibility* of forming an intention to do something irrational later. Precommitment (Ulysses) changes the incentives so the action *becomes* rational later. I must make this distinction clear. The user's tools *change the game*, whereas the Toxin Puzzle *fixes the game*. This is the key to why the tools work and why using them is rational.

  8.  **Final Review against constraints:** No puzzle re-explanation. Focus on implications. Address "flaw vs. asset."

