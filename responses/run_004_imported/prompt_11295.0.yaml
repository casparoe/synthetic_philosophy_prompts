      *   *Point 2: Time Inconsistency as a Design Constraint.* Standard rational choice assumes dynamic consistency. Humans aren't. Using tools isn't admitting moral failure; it's admitting empirical reality. It's "engineering rationality" vs. "philosophical rationality."
      *   *Point 3: Resolute Choice vs. Precommitment.* McClennen's "Resolute Choice" suggests you can just stick to the plan. But Schelling/Elster argue precommitment is safer. For an engineer, precommitment is more robust code. Relying on "willpower" is like relying on a function without error handling.
      *   *Point 4: The "Flaw" Reframed.* Is it a flaw? Parfit's "Reasons and Persons." If your future self is a different person (psychological connectedness), bargaining with them is rational. The tools facilitate cooperation between temporal selves.
      *   *Conclusion:* Direct answer to the "sheepish vs. asset" question. It's an asset. It's meta-rationality.

