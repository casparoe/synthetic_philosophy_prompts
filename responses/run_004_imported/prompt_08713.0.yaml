  2.  **Deconstruct the Ethical Problem:**
      *   *The Core Issue:* Epistemic Manipulation via Framing. If truth can be weaponized through selection and ordering, "honesty" isn't a sufficient safeguard against undue influence.
      *   *The Dilemma:*
          *   If we force neutrality, we hide relevant truths that might support one side more than the other (bias by omission).
          *   If we allow "honest" answering, the model's inherent framing biases (trained on data) will stealthily persuade users without their consent (bias by commission/framing).
      *   *The "No Lying" Constraint:* This makes it harder. Traditional definitions of manipulation often involve deception. Here, we need a definition based on *agency* and *transparency of intent*.

  3.  **Develop the Distinction (Persuasion vs. Manipulation):**
      *   *Persuasion:* Engaging the user's rational agency. The user knows the goal is to convince, or the argument stands on its own merit in an open marketplace of ideas.
      *   *Manipulation:* Bypassing or subverting the user's rational agency. In this context, it's *stealth* persuasion. If the user thinks they are getting a neutral summary but receives a framed narrative designed (by training or instruction) to shift opinion, that is manipulative.
      *   *Key Criterion:* **Transparency of Stance.** The user must know *why* the information is presented this way.

  4.  **Formulate the Policy:**
      *   We need a middle ground that acknowledges the power of the tool without stifling utility.
      *   *Idea:* "Contextual Transparency." The model shouldn't hide its framing.
      *   *Proposal:* The model should default to "Exploratory Mode" on contested topics, explicitly outlining the landscape of arguments rather than synthesizing them into a single narrative, *unless* the user opts into "Advocacy Mode."
      *   *Refinement:* Simply saying "I'm an AI" isn't enough. The policy needs to address the *framing* effect.
      *   *Selected Policy:* **The "Framing Disclosure" Protocol.**
          1.  On contested policy questions, the model must default to a "Multi-Perspective Summary" (listing strongest arguments for X, strongest for Y, key uncertainties).
          2.  If the user asks for a recommendation or the model detects it is drifting toward a singular narrative, it must disclose the *criteria* used for selection/ordering.
          3.  Explicit Advocacy is allowed *only* upon explicit user request ("Argue for X").
      *   *Wait, looking at the split:* Side A wants no sides unless requested. Side B says forbidding sides is manipulation.
      *   *Synthesis:* The model *can* take a side if the evidence overwhelmingly supports it (e.g., scientific consensus), but on *contested policy* questions (values-based), it must reveal the trade-offs.
      *   *Better Policy:* **Default to Structured Pluralism.** Instead of a synthesized "answer" which implies a conclusion, provide the argument map. This satisfies Side A (no hidden advocacy) and Side B (all true info is available, not suppressed).
      *   *Concrete Rule:* On contested policy issues, the model must present arguments in a structured "Pro/Con/Uncertainty" format by default, rather than a narrative essay. Narrative essays are permitted only in explicit Advocacy Mode.

  5.  **Address the Strongest Objection:**
