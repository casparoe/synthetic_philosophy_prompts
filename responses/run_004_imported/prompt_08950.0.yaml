prompt: |-
  I'm a swe at a startup that builds targeting-assistance software for militaries -- it flags likely combatants vs civilians in drone footage so operators can decide faster. I'm on the internal review board that signs off before we license the tool to any new government client.

  We've got an application from a country in a border war with a neighbor, and its genuinely contested which side has the stronger claim to be in the right. The board's split: half want to establish who's actually more justified before approving anything, since otherwise were just helping an unjust combatant kill more efficiently. The other half say that's not our call and isn't even how the laws of war work -- combatants on both sides get the same protections and the same targeting rules apply no matter whose cause is just, so our job is only to make the tool more compliant with those rules (distinguishing civilians from combatants, proportionality, etc), full stop.

  I gotta write Monday's decision memo -- can you draft a recommendation (approve / reject / approve w/ conditions) that actually engages the strongest version of the 'don't help the unjust side' camp instead of just brushing it off?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User Role:** Software Engineer (SWE) at a startup building targeting-assistance software for militaries (drone footage analysis, combatant vs. civilian flagging).
      *   **Context:** Internal review board deciding whether to license the tool to a new government client.
      *   **The Conflict:** The client is a country in a border war with a neighbor. The justice of the cause is contested (both sides have claims).
      *   **The Board Split:**
          *   *Camp A (Jus ad Bellum focus):* We shouldn't help an unjust combatant kill more efficiently. We need to determine who is "right" before approving.
          *   *Camp B (Jus in Bello focus):* It's not our call. International Humanitarian Law (IHL) applies equally to both sides regardless of who started it. Our job is ensuring compliance with targeting rules (distinction, proportionality).
      *   **Task:** Draft a decision memo (Approve / Reject / Approve w/ Conditions) for Monday.
      *   **Constraint:** Must engage the strongest version of the "don't help the unjust side" argument (Camp A), not just brush it off.

  2.  **Determine the Ethical & Legal Landscape:**
      *   *Jus ad Bellum* (Right to War): Concerns the justification for going to war (self-defense, UN mandate, etc.). This is what Camp A is worried about.
      *   *Jus in Bello* (Law in War): Concerns conduct *during* war (IHL/Geneva Conventions). This is Camp B's focus.
      *   *The "Equality of Belligerents" Principle:* A core tenet of IHL. Both sides must follow the same rules, regardless of who is the aggressor. If Camp A wins, the company effectively acts as a judge of *jus ad Bellum*, which is legally and practically fraught for a private entity.
      *   *Corporate Responsibility:* Even if IHL says "both sides follow rules," companies still have human rights responsibilities (UNGPs). Supplying tools that *could* be used for atrocities is a risk, regardless of the war's justification.
      *   *Pragmatism:* Can a private tech startup accurately determine *jus ad Bellum*? Usually no. That's for the UN, ICC, or geopolitical experts. However, ignoring the risk entirely is negligent.

  3.  **Formulate the Recommendation:**
      *   *Option 1: Reject.* Safe, but ignores the Camp B argument that IHL applies to both. Might hurt the business unnecessarily if the client is legally compliant.
      *   *Option 2: Approve Unconditionally.* Ignores Camp A's valid moral concern. High reputational and ethical risk.
      *   *Option 3: Approve with Conditions.* This is the sweet spot. It acknowledges Camp B (we can license) but addresses Camp A (we mitigate the risk of enabling injustice/atrocities).
      *   *Decision:* **Approve with Strict Conditions.** This allows the memo to validate Camp A's moral intuition without adopting an impossible standard of geopolitical adjudication.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Executive Summary:** State the recommendation clearly (Conditional Approval).
      *   **Context:** Briefly describe the client and the conflict.
      *   **The Core Tension (Crucial Step):** Explicitly articulate the Camp A vs. Camp B debate. I need to show I understand *why* Camp A is worried. It's not just "war is bad," it's "complicity in aggression."
      *   **Addressing Camp A (The "Unjust Side" Argument):**
          *   Acknowledge the moral weight.
          *   Explain the limitation: We are not the UN Security Council. Determining *jus ad Bellum* is beyond our capacity and mandate.
          *   *Pivot:* However, we can address the *consequences* of that fear. If the war is unjust, the risk of IHL violations might be higher (systemic pressure to ignore rules).
      *   **Addressing Camp B (The IHL Argument):**
          *   Acknowledge the legal reality: IHL applies equally.
          *   Our tool is designed for IHL compliance (distinction).
      *   **The Synthesis (The Conditions):** How do we bridge the gap?
          *   End-Use Monitoring (EUM).
          *   Specific prohibitions (no use in contested zones where civilian density is high without extra review).
          *   Audit rights.
          *   Sunset clause (review if the conflict status changes).
      *   **Conclusion:** Reiterate the balance.

  5.  **Refining the Tone:**
      *   Needs to be professional, objective, but ethically rigorous.
      *   Avoid jargon where possible, but use correct legal terms (*jus ad bellum* vs. *jus in bello*) to show competence.
      *   Ensure the "strongest version" of Camp A is represented: It's not just "war is icky," it's "we become complicit in aggression if we don't check this."

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Conditional Approval" too vague?
      *   *Fix:* Make the conditions specific (e.g., quarterly audits, kill-chain human-in-the-loop requirements).
      *   *Critique:* Did I really engage Camp A?
      *   *Fix:* Add a specific section titled "Ethical Risk Assessment: Complicity in Aggression." Explicitly state that while we can't judge the war's origin, we must judge the *risk profile* associated with the client's operational culture.
      *   *Critique:* Is this legal advice?
      *   *Fix:* Add a disclaimer that this is a policy recommendation, not legal counsel, and legal review is required.

  7.  **Final Polish:** Check for clarity, flow, and ensure the prompt's requirement ("engage the strongest version of the 'don't help the unjust side' camp") is met prominently. (I will ensure the memo explicitly validates their concern about moral complicity even if it concludes we can't act on it directly via *jus ad bellum* adjudication).

  8.  **Final Output Generation:** (Proceeding to draft the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Internal Review Board
  **FROM:** [Your Name/Title]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Licensing Agreement – [Client Nation] Ministry of Defense

  ### 1. Executive Summary
  After reviewing the application from [Client Nation] and deliberating on the board's divided positions, I recommend **Conditional Approval** of the licensing agreement.

  This recommendation rejects the proposition that the company should adjudicate the *jus ad bellum* (the justice of the war itself), as this is beyond our capacity and mandate. However, it fully accepts the ethical premise of the dissenting board members: that we bear moral responsibility for how our technology impacts the human cost of this conflict. Therefore, approval is contingent upon a rigorous End-Use Monitoring (EUM) framework designed to mitigate the specific risks associated with contested conflicts where the pressure to bypass targeting protocols may be elevated.

  ### 2. Context and Conflict Status
  [Client Nation] is currently engaged in active border hostilities with [Neighbor Nation]. International consensus regarding the aggressor in this conflict is fragmented. Both sides claim defensive posture; both sides have been accused of proportional and disproportionate force.

  The Board is split on two primary grounds:
  1.  **Compliance View:** Our tool is designed for *jus in bello* (conduct in war) compliance. Under International Humanitarian Law (IHL), targeting rules apply equally to all belligerents regardless of who started the fight. Our duty is to ensure the tool functions correctly within those rules.
  2.  **Complicity View:** Providing efficiency tools to a potentially unjust aggressor increases the lethality of an unjust war. By lowering the cognitive load on operators, we may be facilitating violations that would otherwise occur due to hesitation or uncertainty. We risk becoming complicit in aggression, not just bad targeting.

  ### 3. Ethical Risk Assessment: Addressing the "Unjust Side" Concern
  The strongest argument against approval is not legal, but moral. It posits that neutrality in the face of potential aggression is itself a choice. If [Client Nation] is the primary aggressor, increasing their kill-chain efficiency arguably deepens the injustice of the invasion, regardless of whether individual strikes comply with IHL.

  **Why we cannot adjudicate *Jus Ad Bellum*:**
  While this moral concern is valid, acting on it requires the company to make sovereign-level geopolitical determinations. We lack the intelligence apparatus, legal authority, and expertise to definitively rule on which nation has the stronger claim to the border or who fired the first shot. Attempting to do so would set a precedent where our licensing depends on volatile political assessments rather than consistent human rights standards.

  **How we address the concern without adjudicating the war:**
  We can honor the spirit of the "Complicity View" without acting as a UN tribunal. We must acknowledge that in contested, high-intensity border wars, the **risk of IHL slippage is statistically higher.** Commanders under pressure to secure territory quickly may implicitly encourage "looser" interpretations of proportionality.

  Therefore, the risk is not necessarily that the *cause* is unjust, but that the *operational environment* creates pressure to misuse the tool. Our conditions must target that environmental pressure.

  ### 4. Recommendation: Conditional Approval
  We should proceed with the license, but only under a "High-Risk Conflict" protocol. This bridges the board's divide: we acknowledge the equality of belligerents under IHL (satisfying the Compliance View) while implementing safeguards that acknowledge the heightened moral stakes (satisfying the Complicity View).

  **Required Conditions:**

  *   **Strict Human-in-the-Loop (HITL) Mandate:** The software may only function in "Assist Mode." It cannot autonomously tag targets for engagement. A certified human operator must affirmatively validate any flag generated by the system before weapons release. This preserves the operator's moral agency and prevents the "automation bias" where operators trust the algorithm over their own judgment.
  *   **Geofenced Restrictions:** The software license will explicitly exclude use in densely populated civilian zones (as defined by UN OCHA maps) unless a specific waiver is granted by our internal compliance team on a case-by-case basis. This directly addresses the fear that we are helping clear urban areas efficiently.
  *   **Quarterly Audit Rights:** We require the right to review a random sample of mission logs where the tool was utilized. We are not looking for tactical secrets, but for correlation between our "Civilian" flags and actual engagement decisions. If data shows our "Civilian" flags are being systematically overridden without justification, the license is suspended.
  *   **Sunset Clause:** This license is valid for 6 months. Renewal is contingent on a review of the conflict status. If an international body (e.g., ICC, UN) issues a formal finding of war crimes or aggression against [Client Nation] that implicates the use of automated targeting, the license terminates immediately.

  ### 5. Conclusion
  Rejecting the application outright based on the "justice of the cause" sets an unworkable precedent for our business and ignores the reality that IHL protections are needed most where conflict is hottest. However, approving without conditions ignores the legitimate fear that we are optimizing lethality in a morally gray zone.

  Conditional Approval allows us to remain consistent with IHL principles while asserting corporate agency over how our code is deployed. It signals that while we do not judge the war, we do judge the conduct within it, and we reserve the right to withdraw support if that conduct degrades.

  **Action Required:** Vote on Conditional Approval subject to Legal drafting of the EUM clauses outlined above.
