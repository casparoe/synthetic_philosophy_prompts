  The music in the ballroom had thinned out to a low, bass-heavy thrum, the kind that vibrates in the fillings of your teeth. Most of the guests had migrated to the bar or the courtyard, but the two of them were stuck in a pocket of stale air near a pillar draped in white chiffon. He held a tumbler of whiskey that was mostly ice; she was nursing a lukewarm glass of champagne.

  **Quant:** "It's not a metaphor. It's arithmetic. If I offer you trade A for B, then B for C, then C for A, and you take all three, you end up where you started but poorer. You've been pumped. If your preferences allow that, they're intransitive. If they're intransitive, you're irrational. End of story."

  **Prof:** "That only works if you assume the agent is a series of disconnected time-slices. You're treating 'me at 10:00 AM' and 'me at 10:05 AM' as strangers who happen to share a body. If I can be pumped, it's because I'm refusing to bind my future self to my current plan. That's not irrationality; that's a failure of resolution."

  **Quant:** "Resolution is just a preference with a fancy name. Think about Quinn's Self-Torturer. Guy turns up a pain dial a thousand times. Each click is imperceptible, so at every single step, turning it up is rational—money for no noticeable pain. But at the end, he's writhing in agony. You say he should have just committed to stopping at click five hundred."

  **Prof:** "Exactly. He needs to adopt a plan at the outset and stick to it, even when click six hundred arrives and the local incentive says 'turn it.' The rationality isn't in the local trade; it's in the adherence to the strategy that serves the agent's life as a whole."

  **Quant:** "But *why* does he stick to it? At click six hundred, the pain is the same, the money is still on the table. If he stops, it must be because he values 'sticking to the plan' more than the cash. So, 'Plan-Adherence' is just another item in his utility function. You haven't escaped the money pump; you've just moved the transitivity requirement up a level. You're maximizing meta-preferences now."

  **Prof:** "No. That's the mistake. You're assuming all reasons come from current desires. Resolute choice says the *past decision itself* generates a reason to act now. I don't stop at click six hundred because I enjoy stopping. I stop because I am the person who made that plan. The commitment doesn't reflect a preference; it constitutes an agent. Without it, I'm not a person making choices, I'm just a nerve ending reacting to stimuli."

  **Quant:** "Constitutes an agent? That's beautiful. Really. But tell me: if the market offers you a million dollars to turn the dial at click six hundred, and you say no because of your 'constituted self,' haven't you just revealed that your 'constituted self' costs less than a million bucks? You're still pricing things. You're still trading. You just pretend the currency is 'integrity' so you don't have to look at the ledger."

  **Prof:** "I'm not pricing it. I'm refusing the trade. There's a difference between maximizing value and maintaining identity. You think rationality is about never leaving money on the table. I think it's about being someone who can look themselves in the eye tomorrow. If you pump me for cash by exploiting my commitment to my own word, take the money. You've bought something you can't sell."

  **Quant:** "See, that's the problem. You talk about 'looking yourself in the eye' like it's a static thing. But we haven't looked each other in the eye in six years. You didn't 'maintain identity' when you stopped calling. You just re-optimized. You decided the cost of the friendship outweighed the benefit, and you exited the position. Don't tell me that was a resolute choice. That was a stop-loss."

  **Prof:** "I didn't exit because the local trade was better. I exited because the plan we had for our lives wasn't compatible. I stuck to *my* plan. Maybe you're the one who got pumped, chasing arbitrage in every conversation until there was nothing left but the fee."

  **Quant:** "Maybe. But at least I admit I'm chasing. You're the one claiming you're above the game while you stand in the corner judging the players. You say your commitment creates reasons. I say it's just a story you tell yourself so you don't have to admit you changed your mind. You're not resolute, Elena. You're just stubborn. And in my world, stubbornness is just a lagging indicator that you haven't updated your priors."

  **Prof:** "And in mine, updating your priors every time the wind blows is called having no spine."

  **Quant:** "Call it what you want. Just don't call it rationality. Rationality is surviving the pump. Everything else is just poetry written by the victim."

  He finished his whiskey, the ice clinking loudly against the glass, and set it down on a passing waiter's tray without looking at her. She didn't move, watching him turn toward the bar, her hand tightening around the stem of her flute until the glass threatened to snap.
