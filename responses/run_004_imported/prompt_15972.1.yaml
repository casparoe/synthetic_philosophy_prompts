      *   *The "Measurement" Analogy:* The user (a physicist) frames votes as "noisy measurements." In physics, systematic error (bias) is worse than random error. G-S proves systematic error is inevitable.
      *   *Condorcet's Resilience:* Condorcet wasn't looking for perfection; he was looking for the *best available* method to approximate the general will/truth. He knew cycles (Condorcet Paradox) could happen. He had methods to resolve them.
      *   *Comparison with Borda:* Borda gives up when men aren't honest. Condorcet might argue that even with strategy, the pairwise method still aggregates information better than alternatives, *provided* the strategic noise doesn't overwhelm the signal.
      *   *Modern Interpretations:* Modern social choice theorists (like Young, Saari) often revisit Condorcet's epistemic view. If voters are trying to track truth, strategic voting might be less prevalent than if they are purely expressing self-interest.

