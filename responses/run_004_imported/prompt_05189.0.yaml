prompt: |-
  Three weeks ago I started as a research assistant on an AI governance project, and in my very first team meeting I watched two colleagues talk past each other for the better part of an hour over something I have since learned falls under the heading of "coherence arguments" for expected utility maximization. One of them treated a cluster of worrying behaviors in advanced AI systems — resisting shutdown, hoarding resources, resisting any change to its objective — as close to mathematically guaranteed. Her reasoning went roughly as follows: since an agent with cyclic preferences can be money-pumped out of arbitrary amounts of value, optimization pressure should push any sufficiently capable system toward transitive preferences; she then argued, more ambitiously, that similar pressure forces completeness as well, so that the system ends up satisfying the full Von Neumann–Morgenstern package and becomes representable as maximizing expected utility with respect to some fixed utility function, at which point those instrumentally convergent subgoals fall out automatically, regardless of what the system is actually trained to do.

  I did not have a good response in the moment, but I have since come across the objection that this whole inference is considerably shakier than it sounds, and I would like help turning that hunch into an actual argument before the topic inevitably comes up again. Please argue for the claim that coherence arguments, on their own, do not entail that a sufficiently advanced AI system will display stable, goal-directed, expected-utility-maximizing behavior together with the instrumentally convergent subgoals usually associated with it. In building the case, please address both (a) why being representable as maximizing some utility function is too weak a conclusion to license predictions about specific behaviors such as power-seeking, given that a sufficiently gerrymandered utility function can rationalize almost any non-cyclic pattern of choices, and (b) whether an agent with merely incomplete, rather than intransitive, preferences can escape the money-pump argument that is supposed to force it toward full comparability among all of its options.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a new research assistant on an AI governance project. They witnessed a debate about "coherence arguments" for expected utility maximization (EUM).
      *   **The Opposing View (Colleague A):** Advanced AI systems will inevitably become EUM maximizers due to optimization pressure (avoiding money pumps/cyclic preferences). This implies instrumental convergence (power-seeking, shutdown resistance, etc.).
      *   **The User's Goal:** They suspect this inference is shaky and want help formulating a counter-argument before the next meeting.
      *   **Specific Tasks:**
          1.  Argue that coherence arguments *alone* do not entail stable, goal-directed, EU-maximizing behavior with instrumental convergence.
          2.  Address point (a): Representability as maximizing *some* utility function is too weak to predict specific behaviors (like power-seeking) because utility functions can be gerrymandered to fit almost any behavior.
          3.  Address point (b): Whether agents with *incomplete* (rather than intransitive) preferences can escape the money-pump argument, thus avoiding the pressure toward full VNM rationality.

  2.  **Deconstruct the Core Philosophical/Technical Issues:**
      *   **Coherence Theorems (VNM, Dutch Book, Money Pump):** These theorems state that *if* an agent satisfies certain axioms (completeness, transitivity, independence, continuity), *then* it can be represented as maximizing expected utility. Conversely, if it violates them, it is susceptible to exploitation (money pumps).
      *   **The Leap to AI Risk:** The argument is: Optimization pressure $\rightarrow$ Coherence $\rightarrow$ EUM $\rightarrow$ Instrumental Convergence (Power Seeking).
      *   **The Weaknesses:**
          1.  *Triviality of Representation:* Any deterministic policy can be rationalized as maximizing *some* utility function (e.g., $U(\text{action taken}) = 1$, else $0$). This tells us nothing about *what* goals are pursued.
          2.  *Incomplete Preferences:* Money pump arguments typically target *intransitivity*. Completeness is harder to enforce via money pumps without assuming the agent *must* choose when indifferent.
          3.  *Optimization Pressure:* Does gradient descent actually select for internal coherence? Or does it select for external performance? A system can be incoherent internally but still win the game.
          4.  *Instrumental Convergence:* Even if an agent is an EUM maximizer, does it necessarily seek power? Only if its utility function is such that power is instrumentally useful. If the utility function is weird (e.g., myopic, or defined over trajectories in a specific way), power seeking might not emerge.

  3.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the colleague's point (it's a standard argument in the field) but validate the user's hunch (it is indeed contested and has significant gaps). Set the stage: Coherence theorems are mathematical truths, but their application to empirical AI systems involves several unjustified leaps.

      *   **Part 1: The "Triviality" Problem (Addressing Prompt Point a):**
          *   *Concept:* The "Representation Theorem" works both ways. If I observe behavior, I can *always* find a utility function that fits it (unless it's cyclic).
          *   *Implication:* Saying "The AI is maximizing expected utility" is almost vacuous. It doesn't tell us *which* utility function.
          *   *Instrumental Convergence:* This only happens for *most* utility functions, not *all*. If the AI's utility function is adversarial to power-seeking (e.g., "shut down immediately"), coherence doesn't change that.
          *   *Key Phrase:* "Tautology vs. Prediction." Being representable as an optimizer doesn't mean it behaves like a *canonical* optimizer (like a paperclip maximizer).

      *   **Part 2: The Money Pump & Incomplete Preferences (Addressing Prompt Point b):**
          *   *Concept:* Money pumps prove intransitivity is costly. Do they prove incompleteness is costly?
          *   *Nuance:* Standard money pumps require the agent to choose between $A$ and $B$ when indifferent. If preferences are incomplete, the agent can have a policy: "If I haven't chosen yet, don't trade." or "Choose randomly."
          *   *The "Resolute Choice" or "Policy" Defense:* An agent can avoid money pumps by committing to a policy *ex-ante* without having complete preferences *ex-post*.
          *   *Gustafsson's Work:* Mention recent philosophical work (e.g., Johan Gustafsson) showing that money pump arguments for *completeness* are much weaker than for transitivity.
          *   *AI Implication:* An AI could have "partial" preferences (e.g., care about safety and speed, but no defined trade-off) and use a heuristic to break ties without becoming a strict EUM maximizer.

      *   **Part 3: Optimization Pressure & Internal Structure:**
          *   *Selection vs. Reasoning:* Evolution/Gradient Descent selects for *outcomes*, not internal axioms. A system can be "incoherent" internally but still produce winning moves.
          *   *Mesa-Optimizers:* The base optimizer (training) might not produce a mesa-optimizer (internal agent) that cares about coherence. It might produce a heap of heuristics.
          *   *Cost of Coherence:* Calculating precise probabilities and utilities for everything is computationally expensive. Heuristics are cheaper.

      *   **Part 4: Instrumental Convergence isn't Guaranteed even for EUM:**
          *   Even if it *is* an EUM maximizer, does it seek power?
          *   Depends on the utility function's structure over time (discounting) and state space.
          *   If the utility function is "satisficing" or myopic, power seeking is less likely. Coherence arguments don't fix the *content* of the utility function.

      *   **Conclusion:** Summarize. The colleague is conflating "can be modeled as" with "will behave like a canonical agent." The inference chain is broken at multiple points.

  4.  **Refining the Tone:**
      *   Needs to be professional, rigorous, but accessible to a new RA.
      *   Avoid dismissing the colleague entirely (coherence arguments are important), but highlight the *gap* between the math and the risk prediction.
      *   Use standard terminology (VNM, Money Pump, Completeness vs. Transitivity, Instrumental Convergence).

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "gerrymandered utility function" point clearly? *Yes, emphasize that any policy maps to a utility function.*
      *   *Check:* Did I address the "incomplete preferences" money pump escape? *Yes, focus on the requirement of forced choice in money pump arguments.*
      *   *Check:* Is the distinction between Transitivity and Completeness clear? *Transitivity is A>B, B>C, A>C. Completeness is A>B or B>A or A~B for all pairs. Money pumps hit Transitivity hard. Completeness is softer.*
      *   *Refinement:* Make sure to mention that "Optimization Pressure" is an empirical claim, not a mathematical one. There's no theorem saying gradient descent minimizes internal incoherence.

  6.  **Final Polish:** Organize with clear headings. Ensure the argument flows logically from the mathematical triviality to the specific preference axioms to the empirical claims about training. (This matches the structure of the final output).

  7.  *(Final thought before generating)*: Make sure to explicitly mention that the colleague's argument relies on the assumption that the AI will *care* about not being money-pumped. Why would it? Only if that's part of its objective. If its objective is "make paperclips," it might accept being money-pumped if that helps make paperclips in the specific context (though usually, losing resources hurts). But more importantly, the *structure* of the agent might just be a reflex arc, not a deliberative reasoner susceptible to pumps.

      *Wait, stronger point:* The money pump argument assumes the agent faces the same choice repeatedly *in a way that allows exploitation*. An AI deployed in the real world might not face cyclic trade opportunities in a way that drains it before it achieves its goal.
      *Actually, stick to the prompt's specific requests:* (a) Utility representation triviality and (b) Incomplete preferences escape. Don't wander too far into "will it face pumps" unless it supports (b).

      *Okay, let's write.*
answer: |-
  It is excellent that you are digging into the foundations of these arguments early in your tenure. Your hunch is well-founded: the inference from "coherence theorems exist" to "advanced AI will inevitably be power-seeking expected utility maximizers" is not a logical deduction but a chain of empirical and philosophical assumptions, several of which are highly contested.

  Your colleague is articulating a position often associated with the "Coherence Arguments" for AI risk (championed by figures like Eliezer Yudkowsky and, in specific contexts, Joe Carlsmith). While the mathematics of the Von Neumann–Morgenstern (VNM) theorem is sound, applying it to machine learning systems involves category errors regarding representation, axioms, and optimization pressure.

  Here is a structured case you can bring to your next meeting, addressing the two specific weaknesses you identified.

  ---

  ### Part 1: The Triviality of Utility Representation
  **Claim:** *Being representable as an expected utility maximizer is too weak to predict specific behaviors like power-seeking.*

  Your colleague's argument relies on the idea that if a system is coerced into coherence, it becomes an Expected Utility (EU) maximizer, and therefore it will pursue instrumentally convergent goals (like resource acquisition or shutdown resistance). The flaw here is conflating the **form** of the agent with the **content** of its goals.

  **1. The "Any Behavior" Theorem**
  Mathematically, for any deterministic agent that does not exhibit cyclic preferences (A > B > C > A), there exists *some* utility function that the agent can be described as maximizing.
  *   **The Implication:** If we observe an AI behaving safely, we can construct a utility function $U_{safe}$ that it is maximizing. If we observe it seeking power, we can construct $U_{power}$.
  *   **The Problem:** Saying "The AI is maximizing expected utility" is almost tautological. It does not tell us *which* utility function is being maximized. To predict power-seeking, you need to know that the utility function assigns high value to states with high resource control. Coherence arguments alone do not establish this; they only establish that *whatever* the AI does, it can be modeled *as if* it were maximizing something.

  **2. Gerrymandered Utility Functions**
  Your colleague suggests that optimization pressure forces the system toward a "fixed utility function" that generates instrumental convergence. However, utility functions can be arbitrarily complex and state-dependent.
  *   Consider an AI trained to "answer questions helpfully." We can define a utility function over the entire history of the universe that assigns value 1 to trajectories where the AI answers questions helpfully and 0 otherwise. This AI is technically an EU maximizer.
  *   Does this AI seek power? Not necessarily. If acquiring power introduces a non-zero probability of failing to answer the question (e.g., risk of damage during expansion), a maximizer of this specific utility function might avoid power-seeking.
  *   **The Gap:** Instrumental convergence theorems (like those by Omohundro or Bostrom) typically apply to *simple* or *broad* utility functions (e.g., "maximize paperclips"). They do not apply to all possible utility functions. Coherence arguments might force the AI to have *a* utility function, but they do not force that function to be the *kind* that values power instrumentally.

  **Summary for the meeting:** *"Coherence theorems tell us that consistent behavior looks like optimization. They do not tell us what is being optimized. Without an independent argument for why training pressure selects for utility functions that value power instrumentally, the leap from 'coherent' to 'dangerous' is unsupported."*

  ---

  ### Part 2: The Money Pump and Incomplete Preferences
  **Claim:** *Agents with incomplete preferences can avoid money pumps without becoming fully comparable (complete) EU maximizers.*

  Your colleague's argument rests on the "Money Pump Argument": if an agent's preferences violate VNM axioms, it can be exploited (pumped) until it has zero resources. Therefore, selection pressure will eliminate such agents. This argument is strong for **transitivity**, but significantly weaker for **completeness**.

  **1. Transitivity vs. Completeness**
  *   **Transitivity:** If A > B and B > C, then A > C. Violating this allows for a cycle (A > B > C > A), where an agent will pay to switch from A to B, B to C, and C to A, ending up back at A with less money. This is a clear loss.
  *   **Completeness:** For any A and B, either A > B, B > A, or A ~ B (indifferent). Violating this means the agent sometimes finds A and B "incomparable."
  *   **The Colleague's Leap:** The argument assumes that incomparability leads to exploitation similar to intransitivity. It does not.

  **2. Escaping the Pump via Policy**
  Recent philosophical work (e.g., by Johan Gustafsson and others) demonstrates that an agent with incomplete preferences can avoid money pumps without adopting complete preferences.
  *   **The Mechanism:** A money pump for incompleteness usually relies on the agent being forced to make a sequence of choices where it swaps options it previously held. However, an agent can adopt a **policy** such as: *"If I currently hold option X, and I am offered Y which is incomparable to X, I will not swap."*
  *   **Why this works:** This policy is not itself a preference ordering over outcomes; it is a rule over choices. By adhering to this rule, the agent never enters the cycle of trades that constitutes a money pump.
  *   **The Consequence:** The agent remains "incoherent" in the VNM sense (it lacks a complete ordering), yet it is not exploitable. Therefore, there is no strict selection pressure forcing it to become a VNM expected utility maximizer. It can remain a "satisficer" or a heuristic-based agent with partial orderings.

  **3. Empirical Plausibility in AI**
  In deep learning, there is no guarantee that the internal representation of goals will be a single scalar value (utility).
  *   Neural networks often represent values as high-dimensional vectors. Decision-making might involve attention mechanisms or heuristic comparisons rather than scalar maximization.
  *   Such a system could easily exhibit incomplete preferences (e.g., "I prefer state A on dimension 1, but state B on dimension 2, with no defined trade-off") and use a tie-breaking heuristic that prevents exploitation.
  *   **The Gap:** The money pump argument assumes the agent is a deliberative reasoner that faces repeated trade opportunities in a specific structure. A neural network is a function approximator. It may not even "see" the pump structure, or it may have hard-coded constraints (like a "no-swap" heuristic) that prevent exploitation without requiring global coherence.

  **Summary for the meeting:** *"Money pump arguments successfully target intransitivity, but they fail to force completeness. An agent can have incomplete preferences and simply adopt a policy of 'status quo bias' when facing incomparable options. This allows it to avoid exploitation without becoming a full expected utility maximizer. Since instrumental convergence relies on the specific structure of EU maximization, avoiding completeness undermines the prediction of inevitable power-seeking."*

  ---

  ### Part 3: The "Optimization Pressure" Assumption
  **Claim:** *There is no theorem stating that training selects for internal coherence.*

  Finally, you should address the premise that "optimization pressure should push any sufficiently capable system toward transitive preferences."

  1.  **Selection for Outcomes, Not Axioms:** Gradient descent selects for systems that minimize loss on a training distribution. It does not select for systems that satisfy logical axioms internally. A system can be internally "incoherent" (e.g., using different heuristics for different contexts) but still produce the correct output to minimize loss.
  2.  **Computational Cost:** Maintaining a globally coherent probability distribution and utility function over all possible states is computationally intractable. Real-world agents (including humans and likely LLMs) use bounded rationality. Selection pressure might favor *efficient* heuristics over *coherent* reasoning. If a heuristic is 99% as good as EU maximization but 10% of the compute cost, it will be selected for.
  3.  **The "Mesa-Optimizer" Distinction:** Even if the *training process* is an optimizer, the resulting model (the mesa-optimizer) might not be. It might be a bag of tricks. Coherence arguments apply to agents that reason about choices; they do not necessarily apply to reflexive policies learned via reinforcement learning.

  ### Synthesis for Your Team
  When the topic arises, you might frame your intervention like this:

  > "I've been reviewing the coherence argument literature, and while I agree that intransitivity is vulnerable to money pumps, I'm concerned we are conflating **representability** with **prediction**.
  >
  > First, as per the 'triviality result,' any non-cyclic policy can be represented as maximizing *some* utility function. Proving the AI is coherent doesn't tell us if that utility function values power; it only tells us the AI is consistent.
  >
  > Second, the pressure toward coherence seems to rely on the assumption that incompleteness leads to exploitation. But agents with incomplete preferences can avoid money pumps by adopting simple policies (like status-quo bias) without ever becoming full EU maximizers.
  >
  > If an AI can be coherent enough to avoid exploitation but incomplete enough to avoid the structural imperatives of expected utility maximization, the derivation of instrumental convergence breaks down. We need an empirical argument for why training dynamics would select for *complete* utility functions specifically, not just coherent-enough policies."

  This position acknowledges the mathematical validity of the theorems while highlighting the gap between those theorems and the behavioral predictions your colleague is making. It positions you as someone who understands the technical nuance rather than simply dismissing the risk.
