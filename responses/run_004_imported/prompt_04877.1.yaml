          *   *Eight Grades:* Yes, *De Mendacio* outlines 8 types. The user summarizes them generally (religious doctrine worst, protective lies lowest but still sinful). This is accurate enough for a short piece.
          *   *Rahab:* Yes, Augustine struggles with Rahab (Joshua 2). He argues she is praised for faith/benevolence, not the lie itself. Some interpreters say he suggests she didn't *know* it was a lie (unlikely) or that the lie remains a venial sin. The user's summary ("stain even on a deed God chose to honor") is a fair representation of the tension.
