prompt: |-
  For my seminar on formal epistemology, I've been comparing David Lewis's Principal Principle—that credence in a proposition should match its known objective chance—with Bas van Fraassen's Reflection Principle, which requires current credence to defer to one's own anticipated future credence. Several commentators treat these as two instances of a single, more general norm of "expert deference," and I'd like your help assessing that claim: what, precisely, does each principle add to the bare idea of deferring to an expert, and are the two really on a par? In particular, memory-loss cases such as Sleeping-Beauty-style scenarios are often presented as counterexamples to Reflection without posing any obvious analogous threat to the Principal Principle. Can you explain this asymmetry, and say whether it reflects a genuinely different justification behind each principle, or only a technical difference in how they are formulated?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Topic:** Formal Epistemology (David Lewis's Principal Principle vs. Bas van Fraassen's Reflection Principle).
      *   **Core Question:** Are these two principles really instances of a single "expert deference" norm, or are they fundamentally different?
      *   **Specific Focus:** What does each add to the bare idea of expert deference? Are they on a par?
      *   **Key Counterexample:** Memory-loss cases (e.g., Sleeping Beauty) challenge Reflection but seemingly not the Principal Principle.
      *   **Task:** Explain this asymmetry. Determine if it reflects a difference in *justification* or merely *formulation*.

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Principal Principle (PP):* $C(A | \langle Ch(A) = x \rangle \land E) = x$. Credence ($C$) should match objective chance ($Ch$) given admissible evidence ($E$). Chance is an "expert" about truth.
      *   *Reflection Principle (RP):* $C_t(A | C_{t'}(A) = x) = x$. Current credence ($C_t$) should match anticipated future credence ($C_{t'}$). Future self is an "expert" about truth (or at least about what current self should believe).
      *   *Expert Deference:* General schema: $C(A | E \text{ says } A \text{ has prob } x) = x$.
      *   *The "Parity" Claim:* Many (e.g., Hall, Arntzenius) argue they are structurally similar. Both involve conditionalizing on an expert opinion.
      *   *The Asymmetry:* Sleeping Beauty (SB) violates RP (specifically, diachronic coherence) but PP seems robust there (chance doesn't change just because she wakes up).
      *   *Justification:* PP is about metaphysics of chance (Humean supervenience, etc.). RP is about rationality of belief updating (conditionalization, no forgetting).
      *   *Goal:* Provide a nuanced assessment for a seminar context (needs precision, references to key literature, clear argumentation).

  3.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. State the thesis: While structurally analogous as deference norms, they differ crucially in the *nature* of the expert (external vs. internal) and the *conditions* of deference (admissibility vs. introspective access/memory). The asymmetry in memory-loss cases reveals a difference in justification, not just formulation.

      *   **Section 1: The Structure of Expert Deference.**
          *   Define the general schema: $C(A | \text{Expert says } x) = x$.
          *   PP: Expert = Objective Chance.
          *   RP: Expert = Future Self.
          *   Similarity: Both constrain current credence based on a specific proposition about probability.

      *   **Section 2: What Each Adds (The "Admissibility" vs. "Introspection" distinction).**
          *   PP needs the *admissibility* clause. Not all info is compatible with deferring to chance (e.g., knowing the outcome).
          *   RP needs the *introspective/memory* clause. You must know what your future credence will be, and you must not lose information.
          *   *Key Insight:* PP defers to an *external* guide that is (usually) independent of the agent's mind. RP defers to an *internal* guide that is causally connected to the agent's mind.

      *   **Section 3: The Asymmetry of Memory-Loss (Sleeping Beauty).**
          *   Explain the SB scenario briefly (waking up, not knowing day, memory wipe).
          *   Why RP fails: $C_{Sunday}(Head | C_{Monday}(Head) = 1/3) \neq 1/3$ (for Thirders) or vice versa. The link between $t$ and $t'$ is broken by information loss. Van Fraassen knew this (RP assumes no forgetting).
          *   Why PP holds: The chance of Heads is still 1/2 (coin toss). Waking up doesn't change the objective chance. $C(Head | Ch(Head)=0.5) = 0.5$.
          *   *Crucial Point:* PP is about the relationship between belief and *world*. RP is about the relationship between belief and *belief*.

      *   **Section 4: Justification vs. Formulation.**
          *   Is it just technical? No.
          *   PP Justification: Metaphysical. Chance *guides* belief because chance *is* the propensity/frequency of the world. It's a bridge principle between metaphysics and epistemology.
          *   RP Justification: Epistemic/Diachronic. It's a constraint on rational updating. It assumes the future self is *better* or *equally informed*. If information is lost, the future self is not an expert relative to the past self.
          *   *Elga/Arntzenius/Hall:* Mention the "New Principle" or modifications. Hall argues PP and RP *should* align, but SB shows they diverge when self-locating information is involved.

      *   **Section 5: Synthesis/Conclusion.**
          *   They are "on a par" as formal constraints on conditionalization.
          *   They are *not* on a par regarding their domain of application.
          *   The asymmetry reflects that RP is a norm of *diachronic coherence* (vulnerable to memory loss), while PP is a norm of *synchronic alignment with metaphysics* (robust against memory loss, provided chance is stable).
          *   Final verdict: The "single norm" view is a useful heuristic but breaks down under self-locating uncertainty.

  4.  **Refining and Polishing:**
      *   *Tone:* Academic, seminar-appropriate.
      *   *Terminology:* Ensure correct use of "admissible evidence," "self-locating belief," "diachronic coherence."
      *   *References:* Implicitly or explicitly mention Lewis (1980), van Fraassen (1984), Elga (2000), Hall (2004), Arntzenius (2003).
      *   *Check:* Did I answer the specific question about whether the difference is justification or formulation? Yes, argue it's justification (nature of the expert).

  5.  **Self-Correction/Nuance Check during drafting:**
      *   *Correction:* Wait, does PP *really* hold in Sleeping Beauty? Some argue chance is 1/2, some argue credence should be 1/3. If credence is 1/3 and chance is 1/2, PP is violated *unless* the waking evidence is inadmissible. Lewisians say waking evidence is inadmissible. So PP is saved by the admissibility clause. I need to make sure I explain *why* PP isn't threatened: because the "threat" is absorbed by the admissibility condition, whereas RP has no such buffer against memory loss (unless modified).
      *   *Refinement:* Actually, the standard view is that PP is *compatible* with SB (Lewis was a Halfer, so $C=Ch=1/2$). Thirders ($C=1/3$) must argue either chance is 1/3 (unlikely) or that waking evidence is inadmissible regarding the chance proposition. I should focus on the fact that PP doesn't *require* $C_t = C_{t'}$ whereas RP *does*.
      *   *Clarification on RP:* Van Fraassen's original RP assumes you know what your future credence will be. In SB, you might not know *which* Monday it is, but you know your credence function. The violation comes because $C_{Sunday}$ doesn't match $C_{Monday}$ due to loss of temporal index.
      *   *Key Distinction:* PP is Synchronic (mostly). RP is Diachronic. This is the root of the asymmetry.

  6.  **Final Review against User Prompt:**
      *   Compare PP and RP? Yes.
      *   Assess "expert deference" claim? Yes.
      *   What does each add? Yes (Admissibility vs. Memory/Introspection).
      *   Are they on a par? No, not strictly.
      *   Explain SB asymmetry? Yes.
      *   Justification vs. Formulation? Justification (Metaphysical vs. Coherence).

  7.  **Final Output Generation** (Proceed to write response based on these thoughts).
answer: |-
  This is an excellent question that cuts to the heart of contemporary debates in formal epistemology. The claim that the Principal Principle (PP) and the Reflection Principle (RP) are merely two species of a single "expert deference" genus is a powerful heuristic, championed by philosophers like Ned Hall and Richard Pettigrew. However, as you have noted, the asymmetry revealed by self-locating belief and memory-loss cases (like Sleeping Beauty) suggests that the unity is superficial.

  For your seminar, I suggest structuring your assessment around the distinction between **external metaphysical guidance** (PP) and **internal diachronic coherence** (RP). While both can be formalized as conditionalization on an expert opinion, the *nature* of the expertise and the *conditions* under which deference is required differ fundamentally.

  Here is an analysis of the parity claim, the specific contributions of each principle, and the significance of the Sleeping Beauty asymmetry.

  ### 1. The Structure of Expert Deference
  The "unified" view rests on a general schema for expert deference. Let $E$ be an expert function. The norm is:
  $$C(A \mid \langle E(A) = x \rangle) = x$$
  (Where $\langle E(A) = x \rangle$ is the proposition that the expert assigns probability $x$ to $A$.)

  *   **For PP:** The expert is **Objective Chance** ($Ch$). The norm is synchronic: my current credence should match the current objective chance.
  *   **For RP:** The expert is **My Future Self** ($C_{t'}$). The norm is diachronic: my current credence should match my anticipated future credence.

  **What they have in common:** Both principles prohibit you from thinking you know something the expert does not. If you know the expert's probability, you must adopt it. In this formal sense, they are on a par: both are constraints on conditionalization.

  **What each adds to the bare idea:**
  *   **PP adds the Admissibility Clause:** Lewis recognized that not all evidence is compatible with deferring to chance. If you know the outcome of a coin toss (evidence $E$), you cannot defer to the pre-toss chance of 0.5. PP requires that your evidence be "admissible" (roughly, not containing information about the future outcome that bypasses the chance process).
  *   **RP adds the Introspection/Memory Clause:** Van Fraassen's RP assumes you have privileged access to what your future credences will be and, crucially, that you do not lose information between $t$ and $t'$. It adds the requirement that the future self is epistemically *superior* or *equivalent* to the current self, not inferior due to forgetting.

  ### 2. The Asymmetry of Memory-Loss Cases
  The Sleeping Beauty (SB) problem is the wedge that drives PP and RP apart.
  *   **The Scenario:** Beauty is put to sleep. A coin is tossed. If Heads, she wakes once (Monday). If Tails, she wakes twice (Monday and Tuesday), with memory wiped between wakings. Upon waking, what is her credence in Heads?
  *   **The Conflict:**
      *   **RP Violation:** On Sunday, Beauty knows she will wake up. If she is a "Thirder," her Sunday credence in Heads is 1/2, but her anticipated Monday credence is 1/3. $C_{Sun}(H \mid C_{Mon}(H)=1/3) \neq 1/3$. She violates Reflection.
      *   **PP Robustness:** The objective chance of the coin landing Heads is 1/2. Upon waking, does PP require her credence to be 1/2? Lewis (a Halfer) says yes. Even Thirders can maintain PP by arguing that the evidence "I am awake now" is *inadmissible* with respect to the chance proposition, or by distinguishing self-locating credence from non-self-locating chance. Crucially, **the chance itself does not change** due to her memory loss.

  **Why the Asymmetry?**
  The asymmetry exists because **RP is a norm of information preservation, while PP is a norm of metaphysical alignment.**

  1.  **RP and Information Flow:** Reflection is derived from the principle of Conditionalization. It assumes that the move from $t$ to $t'$ involves learning (or at least not forgetting). In SB, Beauty *loses* information (she forgets whether it is Monday or Tuesday). When information is lost, the future self is no longer an "expert" relative to the past self; the future self is *less* informed. Therefore, the justification for RP collapses.
  2.  **PP and Metaphysical Stability:** Objective chance (in the Lewisan sense) supervenes on the history of the world up to that point. Beauty's memory loss is a psychological state; it does not alter the objective chance of the coin toss, which is fixed at the moment of the toss. As long as Beauty's evidence is admissible (i.e., she doesn't know the outcome), PP remains intact. Her credence might diverge from her *future* credence (violating RP), but it need not diverge from *chance* (preserving PP).

  ### 3. Justification vs. Formulation
  You asked whether this difference reflects a genuinely different justification or only a technical difference in formulation. **It is a difference in justification.**

  *   **Justification for PP (Metaphysical):** The Principal Principle is a bridge principle between metaphysics and epistemology. It says: "If the world has a propensity $x$, your mind should mirror $x$." The authority of the expert (Chance) comes from its ontological status as a feature of the world. It is external to the agent.
  *   **Justification for RP (Epistemic Coherence):** The Reflection Principle is a constraint on rational agency over time. It says: "If you expect to be rational and better informed later, align with that later self now." The authority of the expert (Future Self) comes from the assumption of **epistemic improvement or stability**.

  **The "Single Norm" Verdict:**
  Treating them as a single norm is useful for modeling **how** we update (conditionalization on expert testimony), but it is misleading regarding **when** we should update.
  *   PP applies even when the agent is irrational or losing memory, provided the chance is known and evidence is admissible.
  *   RP applies *only* when the agent is rational and retaining information.

  Therefore, the "Expert Deference" label obscures a vital distinction: **Chance is an expert that is independent of the agent's cognitive state; the Future Self is an expert that is dependent on it.**

  ### 4. Seminar Discussion Points
  For your seminar, you might highlight three specific implications of this analysis:

  1.  **The Status of Self-Locating Belief:** The failure of RP in SB cases suggests that standard probability theory (which assumes propositions are uncentered) is insufficient for diachronic norms. PP survives because chance is typically defined over uncentered propositions, whereas RP fails because it tries to link centered credences across time without a mechanism for tracking self-location.
  2.  **Ned Hall's "New Principle":** Hall (2004) attempted to rescue the parity by reformulating PP to handle inadmissible evidence. However, even Hall's New Principle does not force PP to collapse into RP in memory-loss cases. This reinforces the idea that they govern different relationships (Mind-World vs. Mind-Mind).
  3.  **Deference as a Cluster Concept:** You might argue that "expert deference" is not a single norm but a family resemblance concept. We defer to Chance because it tracks truth frequencies/propensities. We defer to Future Selves because they track our own evidential accumulation. When evidential accumulation reverses (forgetting), the second type of deference vanishes, but the first remains.

  ### Conclusion
  The claim that PP and RP are instances of a single norm is **formally plausible but philosophically fragile**. They share a mathematical structure (conditionalizing on a probability assignment), but the Sleeping Beauty asymmetry reveals that their justifications diverge. PP is robust against memory loss because it anchors belief to the external world; RP is fragile because it anchors belief to the internal continuity of the agent.

  In your seminar, you should conclude that while the "expert deference" framework is a powerful tool for unifying formal epistemology, it must be qualified: **Reflection is a special case of expert deference that holds only under conditions of non-forgetting, whereas the Principal Principle is a general case that holds under conditions of admissibility.** They are not on a par; PP is the more fundamental metaphysical constraint, while RP is a derivative constraint on ideal diachronic rationality.
