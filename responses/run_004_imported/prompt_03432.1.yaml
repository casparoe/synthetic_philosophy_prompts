          *   Du Châtelet: Illusions are necessary for pleasure, moralists don't know happiness, love of study is a safe passion, life is short so intensity matters more than duration/safety.
          *   Biographical Context: Du Châtelet's death (childbirth/lover) vs. her intellectual achievements.
      *   **Format:** Dialogue.
      *   **Tone:** Intellectual, respectful but sharp, neither side should be a pushover (no strawmanning).
      *   **Goal:** Help the user resolve their internal conflict (or at least articulate it better) without necessarily declaring a winner.

  2.  **Character Voices:**
      *   **Seneca:** Roman, statesman, tutor to Nero. Pragmatic but elevated. Concerned with *tranquillitas animi* (tranquility of mind). Uses metaphors of fortresses, slavery, and nature. He shouldn't be a robot; he admits to struggling with anger himself (*On Anger*).
      *   **Émilie du Châtelet:** 18th-century French aristocrat, mathematician, physicist. Sharp, witty, empirical but also psychological. Values *taste*, *intensity*, and *illusion*. She sees happiness as a tangible sensation, not just a moral state.

  3.  **Drafting - Section by Section:**

      *   **Setting the Scene:** Needs to be neutral ground. A library or a garden? Let's go with a timeless space, maybe a garden bench, to allow for contemplation.
      *   **Opening:** Seneca starts with the definition of happiness (virtue/reason). Émilie counters with the *feeling* of happiness (pleasure/illusion).
      *   **Point 1: The Role of Illusion.**
          *   Émilie: We need the "ropes and pulleys" hidden. Knowing the truth kills joy.
          *   Seneca: Truth is the only solid ground. Building on sand (illusion) guarantees collapse.
      *   **Point 2: Passion and Vulnerability.**
          *   Seneca: Passion makes you a slave to Fortune. If you love deeply, you grieve deeply.
          *   Émilie: Better to burn and break than to be a cold statue. The cost is worth the intensity.
      *   **Point 3: The "Safe" Passion (Study).**
