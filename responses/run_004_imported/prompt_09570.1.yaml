  6.  **Final Polish:** Check the flow. Ensure the transition from the mathematical critique to the philosophical verdict is smooth. (Self-correction: Make sure to emphasize that KC defines *description length*, not necessarily *physical simplicity*—e.g., Standard Model Lagrangian vs. simulation code).

