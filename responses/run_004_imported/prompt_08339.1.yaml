  *(Refining the Remedy)*: The user asks if there is a remedy *short of discarding*. The honest answer is: You can mitigate, but the set is "burned" for selection purposes. The best remedy is to stop using it for *final* decisions (use A/B tests) or refresh it. I should be honest that keeping it as the *sole* arbiter is the problem.

