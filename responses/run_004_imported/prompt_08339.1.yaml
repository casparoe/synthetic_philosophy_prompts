      *   *Is "discarding the set" the only way?* No. You can keep it for regression testing but stop using it for *selection*. Or refresh it.
      *   *Wait, the DS said "even if every candidate were generated at random".* I need to be careful here. If candidates are random, true quality is constant. If we pick the max eval score, we pick positive noise. Live performance stays constant. So the *gap* widens. The user says "winning candidates show no real improvement... a few have turned out to be quietly worse." This fits.

  10. **Final Polish:** Ensure clear headings and bullet points for readability. (Proceed to generate output based on these thoughts).

