answer: |-
  Your data scientist is correct. What you are experiencing is a well-documented phenomenon in machine learning and statistics, often described as **overfitting to the test set** (or evaluation set) driven by **selection bias**. It is a specific manifestation of **Goodhart's Law**: *"When a measure becomes a target, it ceases to be a good measure."*

  It is not bad luck, and it is not a flaw in your specific data. It is a mathematical certainty that arises whenever you repeatedly optimize a decision process against a fixed, finite sample of data.

  Here is the walkthrough of why this happens, why your data scientist's claim about random candidates is true, and what remedies exist short of throwing the set away entirely.

  ### 1. The Mechanism: Signal, Noise, and Selection

  To understand why the evaluation set stops working, you have to decompose the score a model gets on that set.

  **The Score Equation:**
  $$ \text{Eval Score} = \text{True Quality} + \text{Sampling Noise} $$

  *   **True Quality:** How well the model actually performs on the general population of users (what you care about).
  *   **Sampling Noise:** Random variance specific to those 1,000 sessions. Maybe those specific users were in a good mood, or had slower internet, or searched for niche items that day. No finite set perfectly represents the whole.

  **The Selection Trap:**
  When you evaluate one candidate, the noise might be slightly positive or slightly negative. It averages out.
  However, you are not evaluating one candidate. You are evaluating *many* candidates over two years and **selecting the maximum**.

  When you pick the model with the highest Eval Score, you are implicitly picking the model with the highest combination of True Quality **and** Positive Noise.
  *   If two models have equal True Quality, the one that gets "lucky" on the 1,000 sessions (positive noise) will win.
  *   As you run more experiments, the probability increases that the winner is a model that got lucky on the noise, not one that is actually better.

  **The Accumulation:**
  Once you promote a "lucky" model to production, it becomes the new baseline. The next candidate must beat this inflated score. To do so, it must overcome the previous model's true quality *plus* the previous model's accumulated luck. This forces you to find models that are increasingly overfitted to the specific quirks of those 1,000 sessions just to clear the bar. Eventually, the "noise" component of the score dominates the "signal" component.

  ### 2. Why It Happens Even with Random Candidates

  Your data scientist claimed this would happen even if candidates were generated at random. This sounds counterintuitive, but it is the purest proof of selection bias.

  Imagine you have 100 people flipping a fair coin 10 times.
  *   **True Quality:** Everyone has a 50% chance of heads. No one is "better."
  *   **Eval Set:** The 10 flips.
  *   **Selection:** You promote the person who got the most heads.

  Statistically, someone will get 9 or 10 heads purely by chance. If you promote them to "Head Flipper Champion," their True Quality is still 50%. If you make them flip again in production (live traffic), their performance will regress to the mean (50%).

  In your scenario:
  1.  **Offline:** You pick the random candidate that got lucky on the 1,000 sessions.
  2.  **Online:** The luck doesn't carry over to new users. Performance looks flat or worse (because the new model might actually be worse in reality, but its luck on the eval set masked it).

  This is known as the **Winner's Curse**. The winner of an auction (or model selection) is often the one who most overestimated the value (or score).

  ### 3. A Compounding Factor: Distribution Shift

  While the mathematical selection bias explains the divergence, there is a second factor specific to your "two years" timeline.

  **Data Drift:** User behavior changes. Search trends change. Device usage changes.
  A fixed set of 1,000 sessions from two years ago is becoming less representative of today's live traffic. Even if you hadn't overfit the set, its correlation with live performance would naturally decay over time.
  *   **Selection Bias** makes the set lie to you about *relative* improvement.
  *   **Data Drift** makes the set lie to you about *absolute* performance.

  ### 4. Remedies (Short of Discarding the Set)

  You asked if there is a remedy short of discarding the evaluation set and building a fresh one. The honest answer is: **You cannot continue using this specific set as the sole gatekeeper for promotion.** It is statistically "burned."

  However, you do not need to throw it in the trash. You can change *how* you use it.

  #### A. The "Final Exam" Strategy (Hold-Out Set)
  This is the standard industry fix.
  *   **Keep your current set:** Designate it as a **Development/Validation Set**. Use it for rapid iteration, debugging, and early filtering of bad models.
  *   **Create a new, fresh set:** Lock this away. Use it **only** for the final decision to promote to production.
  *   **Rotation:** Every 6–12 months, retire the "Final Exam" set and make it the new "Development" set, creating a fresh "Final Exam."
  *   **Why this works:** It prevents the selection process from optimizing against the specific noise of the decision-making set.

  #### B. Online A/B Testing (The Ground Truth)
  Offline evaluation should never be the sole criterion for shipping a ranking model.
  *   **Process:** Use your offline set to filter out obviously broken models. Take the top 1 or 2 candidates and run a live A/B test (canary deployment) on a small percentage of real traffic.
  *   **Decision:** Promote based on the live A/B test metrics, not the offline score.
  *   **Why this works:** Live traffic is an infinite, fresh evaluation set. It cannot be overfit.

  #### C. Statistical Correction (Bonferroni/Alpha Spending)
  If you must use the single set, you must account for the number of times you have tested against it.
  *   **The Logic:** If you test 20 models, a 5% false positive rate means one will look significant by chance. You need to raise the bar for significance as the number of historical tests increases.
  *   **The Problem:** This is mathematically difficult to track over two years of sequential testing, and it drastically reduces your ability to detect real improvements (lowers statistical power). It is generally not recommended compared to refreshing the data.

  #### D. Periodic Refresh (The "Rolling" Set)
  Instead of a static set, maintain a pipeline that continuously adds recent sessions and removes old ones.
  *   **Implementation:** Keep the size at 1,000, but swap out 10% of the sessions every week with fresh data.
  *   **Why this works:** It mitigates Data Drift and makes it harder to overfit to specific static sessions, though it doesn't fully solve the selection bias issue if the *scoring code* remains fixed.

  ### Recommendation

  Your data scientist is right: continuing to use the set as you currently do will guarantee further degradation.

  **The pragmatic path forward:**
  1.  **Stop using the current set for final promotion decisions immediately.** It is no longer trustworthy for that purpose.
  2.  **Implement Online A/B Testing.** This is the only way to regain confidence that a "win" is real. Use the offline set only to prevent obviously bad models from reaching the A/B test stage (saving engineering time).
  3.  **Refresh the Offline Set.** Take the current set and archive it. Build a new one from recent traffic. Use the new one for development, but rely on online testing for the "go/no-go" decision.

  You do not need to discard the *practice* of offline evaluation, but you must acknowledge that **any fixed evaluation set has a limited lifespan** when used as an optimization target. Treating it as a permanent truth is what broke your pipeline.
