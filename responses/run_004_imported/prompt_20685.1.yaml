prompt: |-
  So I'm on this small internal committee at work (mid-size logistics company, maybe 800 people) that decides who gets our twice-a-year "Integrity Champion" award. It's basically a certificate plus a $2,000 bonus, but people take it seriously since it gets read out at the all-hands. The policy describing it is like four sentences long and says it goes to whoever reports serious wrongdoing "in good faith, for the right reasons, and at some personal risk to themselves." Nobody ever bothered defining "for the right reasons," because up until now it's always been obvious.

  This cycle's nominee, Dana, reported that her department head was falsifying safety inspection logs, which turned out to be completely true and pretty serious -- it led to real fixes before anyone got hurt. The wrinkle is that Dana was also next in line for that same department head's job, and she got it about a month after he was pushed out. In her nomination statement she says she came forward purely out of concern for the warehouse crew's safety. A couple people on the commitee who've worked with her for years say, off the record, that she'd wanted that promotion for ages and this was obviously her opening. There's genuinely no way for us to settle what was actually going on in her head -- all we've got is her statement, the timing, and a track record that's honestly pretty good.

  Half the committee thinks the motive question is a red herring: the report was true, the danger was real, and turning it in is exactly what someone who cared about the crew would've done, so it doesn't matter what else was mixed in -- she acted on a reason that genuinely justifies the act, full stop. The other half thinks that if the promotion was really doing the motivational work, handing her an "integrity" award basically launders politics as principle, and teaches the next ambitious person exactly the wrong lesson about how to get ahead here. I keep flip-flopping, but I think we're circling around a version of a debate philosophers actually have, about whether acting "for the right reasons" is about the reasons that explain why you did something or just the reasons that would justify doing it. Can you write the short memo I'd bring to our meeting next week? I want it to recommend whether we grant the award, deny it, or grant it with some kind of modification, and I want the reasoning to be something the half of the committee that loses this vote could still walk away thinking was fair.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Internal committee at a mid-size logistics company (800 employees).
      *   **Task:** Decide on the "Integrity Champion" award (certificate + $2k bonus, announced at all-hands).
      *   **Policy:** Short, vague. Requires reporting serious wrongdoing "in good faith, for the right reasons, and at some personal risk."
      *   **Case:** Dana reported her boss for falsifying safety logs (true, serious, led to fixes). She got his job a month later. She claims safety concern. Colleagues claim ambition. Motive is unknowable.
      *   **Committee Split:**
          *   *Side A (Consequentialist/Action-focused):* The act was right, the outcome was good. Motive doesn't negate the courage required.
          *   *Side B (Virtue Ethics/Motive-focused):* Integrity implies purity of motive. Rewarding this incentivizes political maneuvering disguised as whistleblowing.
      *   **Goal:** A short memo recommending a decision (Grant, Deny, or Modify) with reasoning that the losing side can accept as fair.
      *   **Tone:** Professional, balanced, philosophical but practical, empathetic to both sides.

  2.  **Deconstruct the Ethical Dilemma:**
      *   *The "Right Reasons" Clause:* This is the crux. Does it mean "the only reason" or "a sufficient reason"?
      *   *Human Nature:* Rarely do people act from a single motive. Altruism and self-interest often mix. If we demand pure altruism, we might never give the award. If we ignore self-interest completely, we might encourage witch hunts.
      *   *The Risk:* Dana *did* take a risk. Even if she wanted the job, reporting a boss is dangerous. If the report had been false, she would have been fired. The risk was real regardless of the ultimate reward.
      *   *The Precedent:* What message do we want to send?
          *   *Grant:* "We reward truth-telling, even if complex."
          *   *Deny:* "We only reward saints, not humans." (Risk: discourages future reporting).
          *   *Modify:* "We acknowledge the act but nuance the messaging."

  3.  **Evaluate the Options:**
      *   *Deny:* High risk. Discourages whistleblowing. Suggests the company cares more about mind-reading than safety. Hard to justify to Side A.
      *   *Grant (Unmodified):* Risks validating Side B's concern about "laundering politics." Might look naive.
      *   *Grant (Modified/Nuanced):* This seems the most viable path to consensus. Acknowledge the act's value (Side A) while addressing the motive concern (Side B) without accusing Dana of lying.

  4.  **Develop the Recommendation:**
      *   *Decision:* Grant the award.
      *   *Rationale:* The policy focuses on the *act* and the *risk*. We cannot police thoughts. The outcome (safety) is paramount. However, we need to address the "right reasons" clause carefully.
      *   *The "Fairness" Hook:* To satisfy Side B, we need to clarify the policy for the future. To satisfy Side A, we need to honor Dana's courage *now*.
      *   *Key Insight:* Mixed motives are human. The "right reason" (safety) was present and sufficient, even if not exclusive. The risk was real *at the time of reporting*, regardless of the later promotion.

  5.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard memo format.
      *   **Subject:** Clear and specific.
      *   **Recommendation:** State it upfront. (Grant the award).
      *   **Context:** Briefly summarize the Dana case.
      *   **Analysis (The "Why"):**
          *   Address the "Right Reasons" debate.
          *   Argue that "right reasons" means "sufficient justification," not "exclusive motivation."
          *   Highlight the objective risk taken (retaliation was possible until the investigation cleared her).
          *   Acknowledge the Side B concern (incentives) but frame it as a policy update issue, not a Dana issue.
      *   **Implementation/Modification:** How to announce it? Focus on the *action* and *outcome*, not just the person's character.
      *   **Future Policy:** Suggest clarifying the guidelines to prevent future ambiguity (appeases Side B).

  6.  **Refining the Tone:**
      *   Avoid accusing Dana of lying.
      *   Avoid dismissing the committee members who are skeptical.
      *   Use language like "objective standard," "actionable courage," "mixed motives are normal."
      *   Ensure the "losing side" feels heard. Side B needs to feel their concern about culture is taken seriously (hence the policy review). Side A needs to feel the award isn't being watered down (hence the grant).

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is granting it too easy?
      *   *Fix:* Add a specific section on *how* the award is presented. Don't make her a saint; make her an example of *necessary courage*.
      *   *Critique:* Does this address the "personal risk" part?
      *   *Fix:* Emphasize that at the moment of reporting, the promotion was not guaranteed. The risk was real then.
      *   *Critique:* Is it too long?
      *   *Fix:* Keep it tight. One page ideally.

  8.  **Final Polish:** Check against the prompt's requirement: "reasoning to be something the half of the committee that loses this vote could still walk away thinking was fair."
      *   *For Side B (Deny):* They get a commitment to clarify policy so "political hits" are harder in the future. They get an announcement that focuses on the *safety outcome*, not just Dana's virtue.
      *   *For Side A (Grant):* They get the award given, validating the report's importance.

      *(Self-Correction)*: Actually, a "Grant with Modification" might be safer. But modifying a bonus is weird. Modifying the *citation* or the *messaging* is better. Let's recommend Granting the award but updating the policy guidelines immediately after. This splits the difference: Justice for Dana (she followed the rules as written), Justice for the Company (we fix the rules for next time).

      *Wait, one more thought:* The prompt asks for "Grant, Deny, or Grant with Modification." A "modification" to the award itself is hard. A modification to the *conditions* or the *announcement* is better. Let's go with **Grant the Award**, but with a **Commitment to Policy Clarification**. This effectively treats Dana under the old rules (fairness to her) and future nominees under new rules (fairness to the company).

      *Actually, let's look closer at the "Right Reasons" debate.* If I recommend granting it, Side B loses. How do I make them feel it's fair? By acknowledging that *even if* she was ambitious, the safety reason was *also* there and sufficient. We aren't saying ambition is good; we're saying safety is *enough*. And we promise to tighten the rules so ambiguity doesn't happen again.

      *Let's try to find a middle ground recommendation.* What if we grant the award but *not* the bonus? No, that's humiliating. What if we grant it but the announcement is specific?
      *Decision:* Recommend **Granting the Award**. Why? Because denying it punishes truth-telling based on speculation. That's dangerous for compliance. To appease Side B, the memo must emphasize that this decision relies on the *objective* presence of a valid reason (safety), not the *absence* of invalid ones (ambition), and commit to policy refinement.

      *Wait, let's look at the "Modification" option again.* Maybe the modification is in the *citation text*. Instead of "For unwavering moral purity," it's "For the courage to prioritize safety over hierarchy." That shifts the focus from *who she is* to *what she did*. That works.

  9.  **Finalizing the Memo Structure:**
      *   To/From/Date/Subject.
      *   Recommendation: Award Dana.
      *   Core Argument: "Sufficient Reason" vs. "Exclusive Reason."
      *   Addressing Risk: Risk existed at time of report.
      *   Addressing Culture (Side B's concern): Focus citation on the act, not the character. Commit to policy update.
      *   Closing: Unity.

  10. **Writing the content.** (Focusing on clear, corporate-ethical language). *Make sure to explicitly mention the philosophical distinction the user noted (explanatory vs. justificatory reasons).*

      *(Self-Correction during drafting)*: Keep it concise. The user wants a "short memo."

      *Refining the "Fairness" aspect:*
      *   If Side B loses: They see that we are tightening the policy for the future so this ambiguity doesn't recur. They see the announcement won't call her a saint, but praise the *act*.
      *   If Side A loses: (Wait, I'm recommending they win). Okay, if Side A wins, they are happy.
      *   Wait, I need to make sure the *losing* side feels fair. If I recommend Granting, Side B loses. I need to validate their concern about "laundering politics." I will do this by explicitly stating that mixed motives are a risk we accept *this time* but will mitigate via policy changes.

      *Alternative:* What if I recommend **Granting the Award, but deferring the public announcement until the policy is clarified?** No, that delays justice.
      *Best path:* Grant the award. Acknowledge the ambiguity. Fix the policy. This treats Dana fairly (under old rules) and the company fairly (new rules).

      *Let's write it.*
answer: |-
  **MEMORANDUM**

  **TO:** Integrity Champion Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Q3 Integrity Champion Nomination (Dana)

  **Recommendation**
  I recommend that the committee **grant the Integrity Champion award to Dana**, inclusive of the bonus and public recognition. However, I propose we modify the citation language to focus strictly on the *action and outcome* rather than *character*, and we commit to immediately updating the award policy guidelines to prevent future ambiguity.

  **Reasoning**
  We are currently divided on whether "right reasons" requires an *exclusive* motive (pure altruism) or a *sufficient* motive (a valid justification, even if mixed with self-interest). While the concern about incentivizing political maneuvering is valid, denying the award presents a greater risk to the company.

  **1. The "Sufficient Reason" Standard**
  Human motivation is rarely singular. If we require "pure" motives, we set a standard that is impossible to verify and likely impossible to meet. Dana provided a *justifying* reason (crew safety) that is objectively valid, regardless of whether an *explanatory* reason (career ambition) was also present. As long as the safety concern was genuine and not fabricated to manufacture the opportunity, the act serves the company's values.

  **2. Objective Risk Was Present**
  Regarding the "personal risk" clause: At the moment Dana filed the report, the promotion was not guaranteed. She faced potential retaliation, ostracization, or termination had the investigation been inconclusive. The risk was real at the point of action, regardless of the subsequent outcome.

  **3. Addressing Committee Concerns (The "Fairness" Compromise)**
  I understand the concern that granting this award might signal that ambition-driven reporting is acceptable. To address this without penalizing Dana for acting under our current, vague policy:

  *   **Citation Language:** The all-hands announcement should not frame this as a testament to Dana's moral purity. Instead, it should read: *"For the courage to prioritize safety protocols over hierarchy, resulting in critical risk mitigation."* This rewards the *behavior* we want to replicate, not the *person*.
  *   **Policy Clarification:** We will draft an addendum to the award policy before the next cycle. This will clarify that while mixed motives do not disqualify a nominee, reports found to be strategically timed for personal gain *without* a primary focus on remediation may be scrutinized. This ensures future nominees understand the spirit of the award without changing the rules on Dana retroactively.

  **Conclusion**
  Denying the award based on speculation about internal motives sets a dangerous precedent for whistleblowing. It suggests we will investigate the messenger as closely as the message. By granting the award but refining our guidelines, we honor Dana's courage while safeguarding the integrity of the program for the future.

  I ask for your support in moving forward with this balanced approach.
