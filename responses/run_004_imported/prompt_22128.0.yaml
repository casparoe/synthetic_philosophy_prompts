answer: |-
  Thank you all for coming.

  For those of you who knew my father best as a brother, an uncle, or a friend, you know that he was a man of profound quietude. For those of you who knew him as a colleague, you know that his quiet was not empty; it was filled with the rigorous work of mapping the boundaries of truth.

  When my father passed ten days ago, he left specific instructions for this moment. He asked that I not offer you the usual comforts of "a better place" or the sentiment that he is "watching over us." He was not a man who found comfort in metaphors, and he believed that a eulogy should be as truthful as a proof. He also asked that I not retreat into a vague agnosticism, suggesting that "we simply cannot know."

  He believed we *could* know. Or, at the very least, he believed that reason compels us to affirm a specific conclusion.

  My father spent his retirement studying Gödel's unpublished notebooks and correspondence. Many of you know Gödel for the Incompleteness Theorems. Some of you know him for the Ontological Proof for the existence of God. But my father was most absorbed by Gödel's argument regarding personal survival.

  He was careful to distinguish this. He did not hold this view because he was a Catholic, though he respected our family's tradition. He did not hold it because of the Ontological Proof. He insisted, repeatedly, that the existence of God and the survival of the person were logically distinct propositions. One did not prove the other.

  His view was this: The universe is rationally constructed. In a genuinely rational world, nothing fundamental is created in vain. Consciousness, personality, the capacity for reason—these are not biological accidents. They are fundamental features of reality. To suppose that a rational universe would construct a mind capable of perceiving truth, only to extinguish it utterly at the moment of biological failure, is to suppose a contradiction in the structure of the world. It would be an irrational waste.

  Therefore, for the world to remain rational, the person must survive.

  For my father, this was not a hope. It was not a wager. He did not believe it because it was comforting to believe it; that would have been Pascal's Wager, and he had no patience for betting on truth. He believed it because he saw it as a necessary consequence of the premises. If the world is rational, then we continue.

  I know this sounds cold to some. To his sister and her children, it might sound like he replaced love with logic. But I want you to know that this belief was the source of his great calm. He did not fear death. Not because he thought he was going to a paradise of clouds and harps, but because he saw no logical mechanism by which *he*—the observing "I"—could simply cease to be.

  He treated his own existence with the same respect he treated a theorem. He did not inflate it, but he did not diminish it either.

  To his colleagues here: I know the temptation to soften this. I know the pressure to make this sound more like faith and less like metaphysics. But to do so would be to dishonor the work he loved. He did not want your pity, and he did not want your prayers in the traditional sense. He wanted your recognition that the argument holds. He trusted that if the premises are sound, the conclusion stands regardless of who is speaking.

  And to my family: He loved you. His logic was not a wall; it was a foundation. He believed that because the world is rational, the connections we made here—the love we shared, the truths we discovered together—are not ephemeral. They are part of the structure that survives.

  He is not "gone" in the way we usually mean it. He has moved from a state of becoming to a state of being, consistent with the rational order he spent his life studying.

  So, I will not say he is looking down on us. I will not say he is in a better place. I will say what he would have wanted me to say: The argument is complete. The premises hold. The conclusion remains.

  He is not absent. He is simply no longer bound by the variables of time.

  Thank you.
