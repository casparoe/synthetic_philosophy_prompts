answer: |-
  The office lights were off, save for the green glow of the monitor and the desk lamp pooling over Arjun's manuscript. The air smelled of stale coffee and the dust of old journals.

  **Arjun:** "You're reading the deposition like it's a puzzle to be solved, Elena. But for the family, it wasn't evidence. It was knowledge. When the matriarch told her daughter where the body was buried, the daughter *knew*. She didn't calculate probabilities."

  **Elena:** "She didn't calculate consciously, maybe. But epistemically? It's inference, Arjun. Pure Hume. She perceived the sound of the voice, recognized the speaker as her mother, recalled that her mother has been reliable in the past, and inferred that the statement is likely true. There's no magic leap. If you subtract the inference, you're left with just noise."

  **Arjun:** "That's the Western reductionist reflex. To carve reality into perception and inference until nothing else fits. In Nyāya, *śabda*—testimony—is a *pramāṇa*. A basic source of knowledge. Like perception. If I see a red apple, I don't infer 'there is an apple.' I see it. If I hear a trustworthy person (*āpta*) say 'there is an apple,' and I understand the sentence, I know it. Just as directly. The knowledge arises from the sentence itself, not from a syllogism about the speaker's character."

  **Elena:** "But that makes belief far too cheap. If testimony is basic, why do we stop believing the moment we learn someone has lied to us before? If it were truly direct, like vision, a lie wouldn't blind us to their future truths. The fact that we withdraw trust proves there's a hidden evaluation happening. We're constantly running a background check on the source. You're calling it 'direct' to avoid admitting we're just gambling on credibility."

  **Arjun:** "You're confusing a condition for a premise. For me to see the apple, there must be light. But I don't *infer* the light to see the color; the light is a condition that allows the perception to happen. Trustworthiness is the light. It's a condition for *śabda* to function, not a second step I have to reason through. If the light goes out, I don't see. If the speaker is a liar, knowledge doesn't arise. That doesn't mean I was inferring the light; it means the channel was blocked."

  **Elena:** "That's a neat metaphor, but it doesn't account for learning. Think about children. They believe everything they're told at first, then they get burned, then they learn to be selective. That's inductive learning. They are building a database of reliability. They aren't born with a 'trust switch'; they are running tiny, subconscious regressions on every promise kept or broken. If *śabda* were basic, children wouldn't need to learn who to trust; they'd just know."

  **Arjun:** "But how do they learn that first lesson? To learn that 'Mother is reliable,' the child has to understand what 'reliable' means, and they have to accept the initial data. If every piece of testimony required prior inductive proof of reliability, we'd never learn anything. We'd be trapped in an infinite regress. We have to accept testimony *before* we can learn how to evaluate it. Trust is the ground we stand on to build the ladder of inference. You can't use the ladder to build the ground."

  **Elena:** "So we're hardwired to trust, sure. Evolutionarily, it's safer to believe the rustle is a tiger than to check. But that's a heuristic, not a *pramāṇa*. And look at your own courtroom subplot. If one witness says the defendant was there, and a second independent witness confirms it, the case becomes stronger. If the first witness gave 'basic knowledge,' why does it need bolstering? Basic knowledge shouldn't get stronger with a second opinion. It implies the first testimony was never knowledge on its own, just a probability waiting for a multiplier."

  **Arjun:** "Corroboration doesn't create knowledge; it removes doubt (*saṃśaya*). In Nyāya, doubt is a separate category from ignorance. The first witness gives knowledge, but the defense attorney plants doubt. The second witness doesn't add new truth; they clear the obstruction. You're conflating the psychological feeling of certainty with the epistemic generation of truth. The family knew where the body was after the first whisper. The trial just made it socially actionable."

  **Elena:** "Socially actionable isn't the same as *true*, Arjun. That's the danger. In a courtroom, if you treat testimony as basic, you abdicate epistemic responsibility. You're saying, 'If they sound sure and seem nice, it's fact.' My view demands we audit the chain. It demands we ask, 'How do you know?' Your view lets hearsay solidify into history just because it was spoken with confidence. That's how families destroy themselves. They treat rumors as revelations."

  **Arjun:** "And your view destroys the possibility of community. If I have to audit every word you say against my own private database of evidence before I can accept it, we aren't speaking; we're negotiating treaties. We are embedded in each other's minds. Most of what I know—where I was born, who my father was, that New Zealand exists—I know only because someone told me. To reduce that to inference is to say we are all alone in the dark, guessing at the world."

  **Elena:** "I'd rather be alone in the dark than a vessel for someone else's lies. Your *āpta*—the trustworthy person—is a ghost. We can't see their trustworthiness; we can only see their track record. And in this story of yours? The track record is missing. Everyone is dead or lying."

  **Arjun:** "Then the tragedy isn't that we can't verify the truth. It's that we've forgotten how to hear it."

  **Elena:** "Or maybe there's nothing there to hear."

  She closed the manuscript. The silence between them felt less like a pause in conversation and more like the verdict they were both trying to avoid writing.
