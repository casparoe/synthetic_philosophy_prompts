  4.  **Refining the Philosophical Nuance:**

      *   *IIA:* Why is it philosophically controversial? It implies that the fairness of a deal depends only on the options *at* the deal, not on options *near* the deal that were rejected. Philosophically, this looks like "context independence."
      *   *Monotonicity:* This implies that bargaining power is linked to potential. If I *could* have gotten more, I *should* get more. This aligns with "claims."
      *   *Gauthier's specific twist:* Gauthier cares about *relative concession*. This is inherently KSBS. If he switched to NBS, he'd be maximizing *product of gains*. That's Utilitarian-adjacent (log-utilitarian). MRC is more Rawlsian/Equalitarian regarding the *ratio* of satisfaction. This is a substantive difference.

