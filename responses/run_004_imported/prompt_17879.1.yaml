      *   *Claim 4:* KSBS has trouble in $n$-person cases.
          *   *Verification:* Yes. The generalization of KSBS to $n > 2$ is not unique or straightforward. There are multiple generalizations (e.g., Utilex, etc.), and they often lose the clean axiomatic characterization or consistency properties that NBS retains. NBS generalizes cleanly to $n$-persons.

