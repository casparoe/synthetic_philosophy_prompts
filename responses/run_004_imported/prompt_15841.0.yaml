      *   *Key Insight:* Clifford shifts from the *content* of the belief to the *act* of assent. The wrong isn't the false belief; it's the *violation of the duty of inquiry*.
      *   *Necessary Premise:* "The integrity of the social epistemic system requires universal compliance; any exception, no matter how small, legitimizes the breach of the norm and weakens the collective barrier against savagery." (A "Rule Consequentialist" move that functions like a Deontological rule).

