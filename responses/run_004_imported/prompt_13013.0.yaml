answer: |-
  This is one of the most unsettling and philosophically rich dilemmas in the history of analytic philosophy. The tension you describe—between the autonomy of logical truth and the embeddedness of the philosopher in their historical and psychological context—is exactly where the rubber meets the road for the genetic fallacy.

  Michael Dummett, who did more than anyone to establish Frege's stature, was indeed devastated by the discovery of the diary. He famously wrote that reading it was like discovering that a beloved father was a murderer. But Dummett also forced the discipline to confront the question you are asking: *Do we burn the library because the librarian was a monster?*

  Here is the strongest version of each side of the argument, followed by an assessment of where the line should be drawn and where Frege falls.

  ---

  ### I. The Case for Irrelevance (The Autonomy of Logic)

  The strongest argument for separating Frege's work from his biography rests on the very core of Fregean philosophy: **Anti-Psychologism.**

  **1. The "Third Realm" Argument**
  Frege argued that logical objects and *Gedanken* (Thoughts) do not exist in the external physical world, nor do they exist in the internal psychological world of individual minds. They inhabit a "third realm" (*drittes Reich*) of objective abstracta. If Frege is right about this (and most analytic philosophers grant him this much), then the *discovery* of a Thought is distinct from the *existence* of the Thought.
  *   **The Argument:** A geometer's moral character does not change the angles of a triangle. Similarly, a logician's political views do not change the validity of an inference. To claim otherwise is to commit the genetic fallacy: confusing the origin of a belief with its justification.
  *   **The Implication:** The *Begriffsschrift* (1879) is a formal system. Its consistency is determined by its axioms and rules of inference, not by the soul of its creator. If the system works, it works.

  **2. The Chronological Defense**
  Frege's major logical and mathematical works were published between 1879 and 1903. The diary entries are from 1924, shortly before his death in 1925.
  *   **The Argument:** The "monstrous" political views are a product of his old age, likely exacerbated by Germany's defeat in WWI, the hyperinflation crisis, and the chaos of the Weimar Republic. To project the 1924 reactionary back onto the 1879 logician is an anachronism. The logic was built in the Bismarckian era; the hatred bloomed in the Weimar era.
  *   **The Implication:** We can view the diary as a tragic decline rather than the seed of the system.

  **3. The Slippery Slope of Purity**
  If we invalidate philosophical systems based on the moral failings of their authors, the history of philosophy evaporates.
  *   **The Argument:** Heidegger was a Nazi; Russell was an elitist warmonger who advocated preemptive nuclear strikes; Wittgenstein was physically abusive to students. If biography invalidates theory, we lose the tools to analyze the very prejudices we condemn. We need Frege's logic to dissect Frege's prejudice.
  *   **The Implication:** Dummett's conclusion was that we must "sever the philosophy from the man" not to forgive the man, but to save the tools required to understand the world.

  ---

  ### II. The Case for Relevance (The Diagnostic Reading)

  The strongest argument for relevance does not claim that $2+2=5$ because Frege was a bigot. It claims that **the *structure* of his philosophical project is motivated by the same psychological and political drives as his bigotry.**

  **1. The Politics of Order vs. Chaos**
  Frege's philosophy is defined by a horror of ambiguity, fluidity, and subjectivity.
  *   **The Argument:** Frege's war against "psychologism" was not just technical; it was visceral. He viewed the intrusion of the "human element" into logic as a contamination. This mirrors his political view that the "fractious pluralism" of democracy (parliamentary debate, competing interests) was a contamination of the State.
  *   **The Link:** His logical system seeks a language where meaning is fixed, rigid, and immune to human negotiation. His ideal state was one where authority was fixed, rigid, and immune to democratic negotiation. The *form* of his logic (authoritarian, top-down, non-negotiable) is isomorphic to his *politics*.
  *   **The Implication:** We cannot fully understand the *ferocity* of Frege's anti-psychologism without understanding his fear of human variability. The logic is valid, but the *philosophical motivation* for why logic must be that way is politically tainted.

  **2. The "Third Realm" as Political Sublimation**
  Frege explicitly called the realm of Thoughts the *drittes Reich* (Third Realm). While this phrase predates the Nazi usage, the connotation of a transcendent order ruling over the messy material world is striking.
  *   **The Argument:** Frege posits a realm of truth that is inaccessible to the common man, accessible only to the rigorous thinker, and which commands absolute obedience. This is a philosophical sublimation of an authoritarian worldview. It creates a hierarchy where the "Laws of Thought" function like a Dictator, silencing the "noise" of social context.
  *   **The Implication:** The metaphysics of Frege's logic reinforces a worldview where truth is something *imposed* on the world, not *derived* from it. This makes his system congenial to authoritarianism, even if the specific theorems are neutral.

  **3. Exclusion by Definition**
  Frege's logic relies on sharp boundaries. An object either falls under a concept or it does not (the Law of Excluded Middle).
  *   **The Argument:** While logically sound, the *application* of this rigor to natural language and social concepts can be a tool of exclusion. Frege's hostility to the "left" and to Jews often relied on rigid categorizations of who belonged to the *Volk* and who did not. His philosophical insistence on sharp conceptual boundaries may reflect a cognitive style that finds social pluralism intolerable.
  *   **The Implication:** The biography helps us see the *limits* of the philosophy. It warns us against applying Fregean rigidity to domains (ethics, politics, identity) where fluidity is a feature, not a bug.

  ---

  ### III. Assessment: Where it Lands

  My sense is that the truth lies in a distinction between **Validity** and **Significance**.

  **1. Validity is Immune (The Genetic Fallacy holds here)**
  Frege's definition of the ancestral relation, his distinction between *Sinn* (sense) and *Bedeutung* (reference), and his quantification theory remain valid. They are formal tools. A hammer built by a racist drives a nail just as well as a hammer built by a saint. To deny the utility of predicate logic because of Frege's diary is to engage in self-defeating purity spirals. Dummett was right: the logic stands.

  **2. Significance is Infected (The Diagnostic Reading holds here)**
  However, philosophy is not just a collection of theorems; it is a *way of seeing the world*. Frege's biography is deeply relevant to understanding *why* he constructed his system the way he did and *what kind of world* the system presupposes.
  *   Frege's logic assumes a "God's Eye View"—a perspective from nowhere, untouched by human history.
  *   His diary reveals a man who desperately wanted a world untouched by human history (specifically, the "degeneration" he saw in Weimar).
  *   Therefore, the biography reveals that Frege's "objective" logic was, in part, a refuge from a history he hated.

  **The Verdict:** The diary does not invalidate Frege's logic, but it **demotes** his metaphysics. We can use Frege's logic without accepting his Platonism. We can accept that logical laws are objective without accepting that they inhabit a mystical "Third Realm" that demands the same obedience as a political dictator. We can treat the "Third Realm" as a useful metaphor for intersubjective agreement rather than a mystical ontology.

  ---

  ### IV. A Principled Distinction: When does Biography Matter?

  You asked for a principled way to distinguish noise from signal. I propose a three-part test:

  **1. The Formal/Substantive Test**
  *   **Irrelevant:** If the work is purely formal (math, logic, syntax), biography is usually noise. The internal consistency of the system is the only metric that matters.
  *   **Relevant:** If the work makes substantive claims about the world, human nature, ethics, or society, biography is diagnostic.
  *   *Frege's Place:* He straddles this. His *logic* is formal (Irrelevant). His *philosophy of logic* (what logic *is* and why it matters) is substantive (Relevant).

  **2. The Necessity Test**
  *   **Irrelevant:** If the biographical fact is not a *premise* required for the conclusion. (Frege does not argue "Jews are bad, therefore logic is objective.")
  *   **Relevant:** If the biographical fact explains the *intensity* or *direction* of the argument where the text is ambiguous. (Why is Frege so uniquely hostile to "psychology"? The diary suggests it's because "psychology" represents the messy human variability he politically despised.)

  **3. The Hermeneutic Charity Test**
  *   **Irrelevant:** If knowing the biography forces us to read the text *against* its explicit arguments.
  *   **Relevant:** If knowing the biography resolves tensions or explains silences in the text.
  *   *Frege's Place:* The diary explains the *tone* of Frege's work. It explains why he has no patience for "perspective." It doesn't change the theorems, but it changes our understanding of the *project*.

  ### Conclusion

  Frege falls in the **middle of the spectrum**, but closer to the "Irrelevance" side regarding his technical output, and closer to the "Relevance" side regarding his philosophical legacy.

  The tragedy of Frege is that he built the tools of modern clarity using materials forged in a desire for authoritarian order. We can, and must, use the tools. But we should not worship the architect. We should recognize that his insistence on a "view from nowhere" was not just a logical insight, but a political wish—a wish to escape the messy, democratic, pluralistic human world into a realm of pure, unchallengeable law.

  Dummett eventually concluded that we must acknowledge the horror without discarding the work. But he also recognized that Frege's philosophy contains a warning: **The pursuit of absolute objectivity, when driven by a fear of human subjectivity, can become a form of tyranny.** That is a lesson we can only learn by reading the diary alongside the *Begriffsschrift*.
