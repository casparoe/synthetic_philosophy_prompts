answer: |-
  **MEMORANDUM**

  **TO:** HOA Board and Building Owners
  **FROM:** [Your Name], Board Member
  **DATE:** [Current Date]
  **SUBJECT:** Voting Method for Spring Roof Deck Renovation Vote

  **Context**
  Following the controversy surrounding last month's contractor selection, there is understandable disagreement about how we should conduct the upcoming vote on the roof deck renovation. Half of the owners favor returning to plain plurality (one vote per person), while others prefer keeping ranked-choice voting (RCV). A central argument in this debate has been the claim that "all voting systems are gameable," citing Arrow's Theorem as proof that reform is pointless.

  This memo clarifies the mathematical reality of that claim and proposes a concrete path forward that balances fairness with simplicity.

  **1. Clarifying the Math: Arrow vs. Gibbard-Satterthwaite**
  There is frequent confusion regarding which economic theorems apply to our situation. While often used interchangeably in casual conversation, they address different problems.

  *   **Arrow's Impossibility Theorem** concerns *ranking* outcomes. It proves that no system can perfectly convert individual preference rankings into a perfect community-wide *ranking* while satisfying specific fairness criteria. It does not strictly dictate how we pick a single *winner*.
  *   **The Gibbard-Satterthwaite Theorem (G-S)** is the one relevant to our Treasurer's point. It states that any voting system with three or more outcomes is susceptible to "tactical voting" (strategic manipulation). In other words, there will always be scenarios where a voter benefits by voting insincerely (e.g., ranking a strong competitor last, as occurred last month).

  **2. Addressing the "Why Bother?" Objection**
  The Treasurer is technically correct regarding Gibbard-Satterthwaite: no deterministic voting system is immune to strategic manipulation. However, the conclusion that "therefore, all systems are equally flawed" does not follow.

  While all systems *can* be gamed, they are not equally *easy* to game, nor do they incentivize the same behavior.
  *   **Plurality Voting** incentivizes "lesser-of-two-evils" voting. Owners often feel forced to vote against their true favorite to prevent their least favorite from winning (the "spoiler effect").
  *   **Ranked-Choice Voting (RCV)** reduces the spoiler effect but, as we saw, can incentivize "burying" (ranking a strong rival last despite preferring them over others).
  *   **The Goal:** We cannot achieve mathematical perfection, but we can choose a system where **honest voting is the safest strategy.** We want a system where an owner does not need to guess how others will vote to cast an effective ballot.

  **3. Recommendation: Approval Voting**
  For the spring roof deck vote, I recommend we adopt **Approval Voting** rather than reverting to Plurality or repeating RCV.

  **How it works:** Each owner may vote for ("approve") as many bids as they find acceptable. The bid with the most approvals wins.

  **Why this addresses our specific concerns:**
  1.  **Neutralizes "Burying":** Under G-S, RCV failed because the Treasurer could harm a rival without penalty. In Approval Voting, you cannot harm a candidate you approve of without hurting your own chances. It removes the incentive to rank a decent option last.
  2.  **Eliminates "Vote Splitting":** Unlike Plurality, owners do not have to worry about "wasting" their vote on a long shot. They can approve their favorite *and* their acceptable backup.
  3.  **Simplicity:** It is easier to count and explain than RCV, reducing administrative opacity.

  **Next Steps**
  This change requires a simple motion to adopt the voting method for the upcoming special assessment vote. By moving to Approval Voting, we acknowledge the Treasurer's point—that no system is perfect—while rejecting the defeatist conclusion. We can choose a system that makes honesty the best policy, even if it isn't mathematically invulnerable.

  I will move to adopt this method at the next board meeting. Please review and come prepared to discuss.
