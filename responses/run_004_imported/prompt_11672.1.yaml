  1.  **Analyze the Request:**
      *   **User Role:** HOA Board Member.
      *   **Problem:** A recent ranked-choice voting (RCV) election was manipulated by the Treasurer (strategic voting/burying).
      *   **Conflict:** Half the owners want plurality (first-past-the-post), half want a "smarter" ranked system.
      *   **Treasurer's Argument:** "Every voting system can be gamed, Arrow already proved it, so why bother."
      *   **User's Insight:** The user believes Gibbard-Satterthwaite (G-S) is the relevant theorem, not Arrow's Impossibility Theorem.
      *   **Goal:** Draft a short memo for the HOA owners.
