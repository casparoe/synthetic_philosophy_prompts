  2.  **Deconstruct the Math/Political Science:**
      *   **Arrow's Impossibility Theorem:** Deals with *social welfare functions* (ranking all options). It states that no ranked voting system can convert individual preference orders into a community-wide ranking while satisfying a specific set of fairness criteria (non-dictatorship, Pareto efficiency, independence of irrelevant alternatives) when there are 3+ options. *Key nuance:* It's about aggregating rankings into a *ranking*, not necessarily picking a *winner*.
      *   **Gibbard-Satterthwaite Theorem:** Deals with *social choice functions* (picking a single winner). It states that any deterministic voting system with 3+ outcomes is either dictatorial or susceptible to tactical voting (strategic manipulation). *Key nuance:* This directly addresses the Treasurer's "gaming" argument.
      *   **The Treasurer's Point:** He is technically correct that *some* form of manipulation is theoretically possible in almost any system (G-S). However, his conclusion ("so why bother") is a non-sequitur. Some systems are *harder* to game than others, and some forms of gaming are more detectable or damaging.
      *   **Plurality vs. RCV:** Plurality is also susceptible to strategy (vote splitting, lesser-of-two-evils). RCV reduces the "spoiler effect" but introduces "burying" risks (which happened here).
      *   **Recommendation:** Need a system that balances simplicity with resistance to the specific type of manipulation that occurred. Given the HOA context (small group, high stakes, low frequency), a **Score Voting (Range Voting)** or **Approval Voting** system might be best, but the prompt asks to choose between the existing factions (Plurality vs. Ranked) or find a middle ground. Actually, the prompt asks for *one concrete recommendation*.
