      *   **User Persona:** Retired observational astronomer. Intelligent, scientifically literate, familiar with cosmology (Tegmark, inflation, Everett), now deeply interested in philosophy (Lewis, modal realism).
      *   **Tone:** Conversational, enthusiastic, slightly self-deprecating ("wife says I've traded star charts for even stranger ones"), intellectually rigorous but seeking clarification.
