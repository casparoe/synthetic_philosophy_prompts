answer: |-
  Based on Thomas Hobbes's epistemological commitments in *De Corpore* and his specific objections to John Wallis's methods, Hobbes would unequivocally reject the computer-assisted proof of the four-colour theorem as *scientia*. In fact, he would likely regard it as a far more pernicious instance of the "symbol-shuffling" he accused Wallis of practicing, because it removes the human mind entirely from the chain of causal reasoning.

  To understand why, we must look beyond the biographical trivia of his circle-squaring obsession and examine the philosophical architecture of his materialism and nominalism.

  ### 1. The Requirement of Genetic Definition and Causal Construction
  In *De Corpore*, Hobbes establishes that *scientia* (scientific knowledge) is knowledge of consequences derived from causes. For geometry to be a science, its objects must be defined genetically—that is, by the motion or action that generates them. We know a circle is what it is not because we observe a static shape, but because we understand the motion of a point around a fixed center. As Hobbes writes, "we demonstrate nothing... but what we ourselves make."

  The four-colour theorem proof fails this criterion fundamentally. It does not construct a reason *why* four colours suffice based on the generative properties of planar graphs. Instead, it proceeds by elimination, demonstrating that no counter-example exists within a massive finite set. For Hobbes, this is not knowledge of a cause; it is a report of an outcome. It tells us *that* the proposition is true, but it provides no insight into the *generation* of that truth. It lacks the "light of the mind" that comes from tracing the effect back to a constructive cause.

  ### 2. Reasoning as Internal Computation
  Hobbes defines reason itself as "reckoning" (computation)—the addition and subtraction of the consequences of general names. However, this computation must occur within the mind of the knower. In *De Corpore* (I.6), he argues that to have science, one must be able to trace the logical steps oneself.

  The computer proof outsources this computation to a machine. Since no human being can survey the 1,936 (or more) cases checked by the algorithm, no human mind performs the "reckoning." For Hobbes, if the reasoning is not performed by the subject, the subject does not possess the knowledge. They possess only a belief based on testimony (in this case, the testimony of the machine and its programmers). Hobbes distinguishes sharply between *scientia* (evidence from reasoning) and *opinio* or belief (evidence from authority or experience). Accepting the four-colour theorem on the basis of a computer printout would, for Hobbes, be an act of faith in an artifact, not an act of geometric reasoning.

  ### 3. The Wallis Analogy: Symbols Without Magnitudes
  Hobbes's vitriol against Wallis was not merely personal; it was epistemological. He accused Wallis of treating algebraic symbols as if they were things in themselves, manipulating marks on a page without retaining a clear conception of the magnitudes they signified. He called this a "scab of symbols" that obscured the underlying geometry.

  Hobbes would view the four-colour proof as the logical endpoint of this error. Wallis at least wrote symbols that a human could read; the computer proof relies on electronic states and code that are physically unsurveyable by the human intellect. Where Wallis obscured the geometry with algebra, the computer proof obscures the reasoning with physical processes (voltage changes in silicon). Hobbes would argue that this is not geometry at all, but a form of empirical experimentation. It transforms a necessary truth of reason into a contingent truth of physical observation (i.e., "we observed the machine output 'true'").

  ### 4. Certainty vs. Empirical Confidence
  Finally, Hobbes demands absolute certainty for *scientia*. In his controversy with Wallis, he frequently pointed out that algebraic methods could lead to errors if the symbols lost their referents. A computer proof introduces a new layer of empirical uncertainty: hardware reliability, software bugs, and power stability.

  For Hobbes, geometry is certain because it deals with the consequences of our own definitions, which are arbitrary but consistent. A computer proof depends on the physical integrity of a machine. In *De Corpore*, Hobbes categorizes knowledge of physical facts as "prudence" or experience, which is fallible. By relying on a physical device to verify a mathematical truth, the proof demotes geometry from a demonstrative science to a branch of fallible empirical physics.

  ### Conclusion
  Hobbes would not count the four-colour theorem proof as *scientia*. It violates the requirement for genetic definition, it bypasses the internal mental computation required for reasoning, and it substitutes causal insight with exhaustive empirical checking. If Wallis's algebra was a "scab of symbols" that hid the geometry, the computer proof is a "black box of states" that eliminates the geometer entirely. Hobbes would classify the result not as knowledge, but as a highly probable belief based on technical authority—a sophisticated form of the very "blind reckoning" he spent his life combating.
