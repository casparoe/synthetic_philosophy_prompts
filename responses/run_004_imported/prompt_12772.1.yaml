      *   **Analyze the Disanalogies (The Meat):**
          1.  *Motivational Force/Action Tendency:* Emotions push to act; illusions don't.
          2.  *Rational Defeasibility:* Emotions are more responsive to reasoning over time (therapy) than illusions are.
          3.  *Bodily Phenomenology:* Fear feels like a heart racing; illusions don't feel like a pulse.
          4.  *The "As If" Quality:* Recalcitrant emotions often have a "I know it's not real but..." quality that is more complex than simple visual persistence.
      *   **Discuss the "Hybrid" or "Nuanced" Views:** Mention that many philosophers (even perceptualists) admit the analogy isn't perfect. Mention "Concern-based Construals" (Roberts) or "Somatic Theories" (Prinz).
      *   **Conclusion:** The analogy is a useful heuristic but breaks down under scrutiny regarding agency and rationality.

