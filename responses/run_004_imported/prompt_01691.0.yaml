      *   **Framing Effects (Tversky/Kahneman):** These violate "description invariance." In RP terms, if the frame changes the choice between A and B, are A and B the same goods?
          *   *Economist's Defense:* If the frame changes, the "good" changes. (A in Frame 1) $\neq$ (A in Frame 2). This preserves WARP but makes the theory unfalsifiable (ad hoc).
