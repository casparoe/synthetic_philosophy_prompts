      *   **User's Goal:** Wants to work through this argument like a physics proof. Wants to know the premises connecting "mind $\neq$ machine" to "soul survives death." Wants to know why, if it's rigorous, it's not a settled result in philosophy of religion.
      *   **Critical Fact-Check:** *Did Gödel actually write a formal proof for the immortality of the soul?*
          *   *Knowledge Retrieval:* Gödel is famous for the Incompleteness Theorems, the Rotating Universe (GR), and the Ontological Argument (modal logic). He *did* have strong philosophical leanings (Platonism, Leibnizian monadology). He *did* believe in the immortality of the soul.
          *   *Verification:* There is *no* published, formal proof by Gödel regarding the immortality of the soul comparable to his Ontological Argument or Incompleteness Theorems. There are remarks in his *Collected Works* (specifically Volume III, unpublished essays/letters) and in biographies (like Wang's *A Logical Journey*) where he discusses these ideas informally or in notes. He *argued* for it, but there is no "Gödel's Theorem of Soul Immortality" that exists as a formal derivation in the way the user implies.
          *   *Correction Needed:* I must gently correct the premise that there is a *formal proof* equivalent to the ontological argument or incompleteness theorems. It was more of a philosophical position supported by logical considerations, not a derived theorem.
      *   **User's Specific Logical Chain:** "Incompleteness $\rightarrow$ Mind $\neq$ Machine $\rightarrow$ Soul is Simple $\rightarrow$ Immortality."
          *   This is a known reconstruction of Gödel's *philosophical views* (often discussed by Hao Wang), but not a single formal proof.
          *   The link between "Mind $\neq$ Machine" and "Soul is Simple" is metaphysical, not purely logical.
          *   The link between "Simple Substance" and "Immortality" is Leibnizian (monadology), not strictly logical.

  2.  **Formulate the Response Strategy:**
