      *   *Reconstructing the Argument:* Let's build the "proof" the user wants to see, based on Gödel's actual notes (specifically the 1961 note "Is the world rational?" and conversations with Wang).
          *   P1: Incompleteness implies human intuition transcends any finite axiomatic system.
