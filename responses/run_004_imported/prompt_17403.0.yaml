          *   Definition of "Death" (Does death require decomposition? Could a simple substance cease to exist by other means?).
          *   Lack of formalization (It's metaphysics, not math).
      *   **Address the "Why not settled?" question:** Philosophy doesn't work like physics/math. Premises are contestable. The argument relies on specific metaphysical commitments (Leibniz) that aren't universally shared.
      *   **Tone:** Intellectual, rigorous, respectful, precise. Avoid condescension but be firm on the historical/logical facts.

