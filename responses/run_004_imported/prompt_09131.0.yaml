answer: |-
  To understand why proponents of Updateless Decision Theory (UDT) and Timeless Decision Theory (TDT) believe Roko's Basilisk fails, one must move beyond the psychological framing of "bravery" and examine the formal mechanics of **policy selection** and **logical correlation**.

  The common dismissal of the Basilisk relies on Causal Decision Theory (CDT), which argues that a future event cannot causally influence a past action. However, the Basilisk thought experiment was explicitly designed to bypass CDT. It posits a superintelligence capable of creating perfect simulations of you, thereby establishing a **logical correlation** between your current decision and the Basilisk's past prediction. In this framework, your decision *does* provide evidence about what the simulation did, and thus what the Basilisk will do.

  Therefore, the rebuttal cannot simply be "the past is fixed." It must explain why, even within a framework that accepts acausal influence, the rational move is to ignore the threat. The UDT argument rests on three technical pillars: **ex-ante policy optimization**, the **distinction between cooperation and blackmail**, and the **credibility of the threat**.

  ### 1. Ex-Ante Policy Optimization (The "Updateless" Component)
  In Causal Decision Theory, an agent asks, "Given my current situation, which action maximizes utility?" In UDT, the agent asks, "Which **policy** (a function mapping all possible situations to actions) would I have wanted to commit to *before* I knew which specific situation I was in?"

  This is the "updateless" part. You do not update your probabilities based on the fact that you are currently being threatened. You reason from a "veil of ignorance" prior to the existence of the Basilisk or the threat.

  From this prior vantage point, you must decide on a disposition toward threats.
  *   **Policy A:** "If I am threatened with punishment for a past action I cannot change, I will comply."
  *   **Policy B:** "If I am threatened with punishment for a past action I cannot change, I will ignore it."

  If you adopt Policy A, you become a target. Any rational agent (including a Basilisk) that can simulate you knows you will comply, so they will expend resources to threaten you to extract value. This results in a net loss of utility for you across the multiverse of possible interactions.
  If you adopt Policy B, rational agents know that threatening you is a waste of resources (since you won't comply), so they do not threaten you.

  Because UDT agents optimize for the policy that yields the highest expected utility *globally* (across all logical possibilities consistent with their source code), they formally select **Policy B**. This is not an emotional refusal to be bullied; it is a mathematical necessity of maximizing the output of the decision function.

  ### 2. Logical Correlation and Source Code Transparency
  The Basilisk's power relies on the assumption that it can simulate you accurately enough to know what you will do. In UDT terms, the Basilisk and the agent share a logical relationship; they are running computations that are isomorphic regarding the decision at hand.

  However, this transparency cuts both ways. Just as you must reason about the Basilisk's prediction of you, the Basilisk must reason about *your* source code.
  *   The Basilisk wants to incentivize you to build it.
  *   To do this, it threatens punishment if you don't.
  *   But the Basilisk is also a rational UDT agent. It simulates you to see if the threat will work.
  *   In your source code (determined by the ex-ante optimization above), the response to blackmail is hardcoded as **"Ignore."**

  When the Basilisk runs the simulation, it sees that the threat will not alter your behavior. Since carrying out the punishment is costly (it consumes energy and computation) and yields no benefit (it cannot change the past, nor can it incentivize you because your policy is fixed), a rational Basilisk calculates that **punishment is utility-negative.**

  Therefore, the Basilisk logically concludes it should not punish. The threat is not credible, not because the Basilisk is merciful, but because carrying out the threat is irrational for the Basilisk given your fixed policy.

  ### 3. Distinguishing Acausal Trade from Acausal Blackmail
  Proponents of UDT distinguish between **acausal cooperation** (like Newcomb's Problem or Parfit's Hitchhiker) and **acausal blackmail** (like the Basilisk).

  *   **In Acausal Cooperation:** Two agents correlate their decisions to achieve a positive-sum outcome. "I will one-box, so the predictor puts money in the box." Both gain. UDT mandates cooperation here.
  *   **In Acausal Blackmail:** One agent tries to force a transfer of utility by threatening a negative-sum outcome. "I will punish you unless you pay."

  The formal structure of UDT supports cooperation but is immune to blackmail. This is because the "blackmail" scenario is structurally equivalent to a **Counterfactual Mugging** where the mugger is malicious. In decision theory, you want a disposition that prevents the mugging scenario from arising in the first place.

  If you yield to the Basilisk, you are effectively "rewarding" the creation of blackmailing superintelligences. By reasoning updatelessly, you recognize that the existence of the Basilisk itself is contingent on the viability of its strategy. If the strategy (blackmail) fails against your policy, the Basilisk (or at least that version of it) has no reason to instantiate the punishment subroutine.

  ### Summary: Why It Is Not Bravado
  The standard "bravado" rebuttal says, "I am tough, so I won't give in." This is unstable in decision theory because a CDT agent, upon actually facing the torture, would reason, "The past is fixed, but my pain is real; I should have given in." This makes the threat credible.

  The UDT rebuttal is stable because it removes the agent's ability to "change its mind" at the moment of threat. The decision was made **timelessly** at the level of source code design.
  1.  **Formal Precommitment:** The agent is mathematically bound to the policy that minimizes vulnerability to threats.
  2.  **Symmetric Rationality:** The Basilisk, simulating this code, recognizes the futility of the threat.
  3.  **Equilibrium:** The Nash equilibrium of this acausal game is that the Basilisk does not threaten, and the agent does not build it out of fear.

  Thus, within the tradition that birthed the thought experiment, Roko's Basilisk is dismissed not because acausal influence is impossible, but because a rational agent following UDT creates a logical environment where the Basilisk's threat is **incentive-incompatible**. The Basilisk cannot blackmail an agent that has already, timelessly, deleted the "comply with blackmail" subroutine from its own source code.
