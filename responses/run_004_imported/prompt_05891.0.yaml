          *   Step 2: Offer trade B -> A for cost $\epsilon$. If you take it, you have A - $2\epsilon$.
          *   *Crucial Question:* Why take Step 1? A and B are incomparable. There is no preference driving the trade.
          *   *The Extra Assumption:* The argument assumes that if preferences are silent, the agent might still trade (perhaps probabilistically, or based on a whim). If the agent has a policy "Never trade unless strictly preferred," the pump fails immediately.
      *   **Is "Never Trade Unless Strictly Preferred" Rational?**
