answer: |-
  You have hit on one of the most contentious and subtle debates in modern decision theory. Your intuition is spot-on: the money-pump argument for **incomplete preferences** is significantly weaker than the one for **cyclic preferences**, and it does rely on an extra behavioral assumption that often goes unstated in pop-rationalist summaries.

  Here is the breakdown of the "extra ingredient," why the "just refuse trades" defense works (but at a cost), and what resolute choice actually implies for these arguments.

  ### 1. The Cyclic Money Pump (The Baseline)
  To see the difference, let's briefly anchor the cyclic case.
  *   **The Setup:** You prefer A > B, B > C, and C > A.
  *   **The Pump:** A bookie starts you with A. They offer to trade A for C (you pay $1, because C > A). Then C for B (you pay $1, because B > C). Then B for A (you pay $1, because A > B).
  *   **The Result:** You are back at A, but $3 poorer.
  *   **The Assumption:** This relies on **Myopic Choice**. It assumes that at every step, you look only at the immediate trade and maximize based on your current preference, without considering that this trade is part of a sequence that will loop back.

  Even here, your friend is right: if you use **Sophisticated Choice** (looking ahead and realizing the loop) or **Resolute Choice** (committing to a plan), you can refuse the first trade. However, standard decision theorists argue that if you have to *add* a meta-rule to avoid losing money, your underlying preferences were still flawed. But logically, the cyclic pump is tight *if* you accept the myopia assumption.

  ### 2. The Incompleteness Money Pump (The Weak Link)
  Now, let's look at the incompleteness argument. This is where your skepticism is warranted.

  *   **The Setup:** You have option A. Option B is **incomparable** to A (you don't prefer A to B, nor B to A, nor are you indifferent).
  *   **The Pump:**
      1.  Bookie offers to trade A for B for a small fee ($\epsilon$).
      2.  If you accept, you now have B (minus $\epsilon$).
      3.  Bookie offers to trade B for A for a small fee ($\epsilon$).
      4.  If you accept, you now have A (minus $2\epsilon$).
  *   **The Result:** You are back at A, poorer.

  **The Missing Ingredient:**
  In the cyclic case, you trade A for C because you *prefer* C to A. In the incompleteness case, why do you trade A for B in step 1?
  By definition, your preferences are silent. There is no preference driving the trade.

  For the pump to work, the argument must assume an extra behavioral disposition, often called **Capriciousness** or **Uncoveredness**. It assumes that when your preferences are silent, you are still *willing* to trade (perhaps probabilistically, or based on a whim).

  If you adopt the policy your friend suggested—"**Never trade unless it is a strict improvement**"—the pump fails immediately at Step 1. Since B is not strictly preferred to A, you keep A. No money is lost.

  ### 3. The "Gotcha": Inertia as Completion
  So, does the "Never trade unless strict improvement" policy save incomplete preferences?

  **Technically, yes**. It prevents exploitation.
  **Theoretically, it's complicated**.

  Decision theorists (like Johan Gustafsson, who has written extensively on this) argue that adopting a "Status Quo Bias" or "Inertia" policy effectively **completes your preferences**.

  If your rule is "I keep what I have unless the new thing is strictly better," you have implicitly defined your preferences as follows:
  *   If you hold A, then A > B (even if they were originally incomparable).
  *   If you hold B, then B > A.

  This is known as an **Endowment Effect**. While it saves you from the money pump, it means you no longer truly have incomplete preferences in practice. You have complete preferences that are *path-dependent* (your ranking depends on what you currently hold).

  The coherence theorems argue that a rational agent's preferences should be about the *outcomes*, not the *history* of how you got there. If your choice between A and B depends entirely on whether you woke up holding A or holding B, your preferences are arguably still "incoherent" in a deeper sense, even if you can't be money-pumped.

  ### 4. Resolute Choice and the "Question-Begging" Charge
  Your friend brought up **Resolute Choice** (committing to a plan ex-ante and sticking to it).

  *   **Does it stop the pump**? Yes. If you pre-commit "I will never trade A for B," you cannot be pumped.
  *   **Does it save Cyclic Preferences**? Yes. If you pre-commit "I will not enter the trade loop," you avoid the loss.

  This leads to the charge you suspected: **Are money pumps question-begging**?

  Many philosophers (e.g., Edward McClennen) argue **yes**. The money pump arguments assume that rational agents must be **Myopic** (locally optimizing) or **Sophisticated** (predicting future local optimization). They rule out Resolute Choice by definition.
  *   If you allow Resolute Choice, you can have cyclic or incomplete preferences and still avoid exploitation by binding your future self.
  *   However, the counter-argument is that Resolute Choice is just a way of *changing* your preferences. If you commit to keeping A, it reveals that you actually prefer "Keeping A" over "Trading for B."

  So, the debate shifts from "Can you be pumped?" to "Is maintaining incomplete preferences compatible with being a resolute agent?"

  ### 5. The Verdict: Is the Extension Bogus?
  You asked whether the extension of the argument to incompleteness is "quietly begging the question."

  **The answer is: Mostly, yes**.

  1.  **Cyclic Preferences**: The money pump is robust *if* you assume the agent acts on its preferences at every opportunity without global planning. It highlights a genuine tension between local consistency and global loss.
  2.  **Incomplete Preferences**: The money pump is **not** robust. It only works if you assume the agent is *capricious* when preferences are silent.
      *   If the agent has **Inertia** (default to status quo), they cannot be pumped.
      *   If the agent has **Resolute Choice**, they cannot be pumped.

  **Why do AI Alignment folks still use the argument**?
  There is a pragmatic reason, even if the logic is leaky. In AI alignment, we are worried about agents that *optimize*.
  *   An agent designed to maximize a utility function will not have incomplete preferences (the function outputs a number for everything).
  *   An agent that learns preferences might end up with gaps.
  *   The fear is that an advanced agent, noticing it has incomplete preferences, might *self-modify* to remove them to avoid potential exploitation (or to enable better planning).
  *   Furthermore, an agent with Inertia (Status Quo Bias) might be too rigid to be useful. If an AI refuses to swap resources because they are "incomparable" rather than "worse," it might fail to achieve its goals in a complex environment.

  ### Summary
  *   **The Extra Ingredient**: The incompleteness money pump requires the assumption that the agent is willing to trade between incomparable options (Capriciousness). The cyclic pump does not; it relies only on the existence of the preferences.
  *   **The Defense**: A policy of "Only trade for strict improvements" (Inertia) successfully blocks the incompleteness pump.
  *   **The Cost**: Adopting Inertia effectively completes your preferences via path-dependence (Endowment Effect), which violates standard independence axioms.
  *   **Resolute Choice**: Saves agents from both pumps, but standard decision theory often excludes it to force the derivation of Expected Utility.

  You are right to be skeptical. The move from "Cyclic preferences are exploitable" to "Therefore all rational agents must have complete, transitive preferences" skips over the fact that incomplete preferences can be defended against exploitation via simple, plausible policies (like Inertia). The argument that incompleteness *necessarily* leads to exploitation is much weaker than the standard LessWrong canon often suggests. It often conflates "can be exploited if capricious" with "must be exploited."

  **Final takeaway**: Incomplete preferences are not *inherently* money-pumpable in the same way cyclic ones are. They are only pumpable if the agent lacks a stable policy for handling incomparability (like status quo bias). Whether having that policy is "rational" is a deeper philosophical question, but the claim that incompleteness *automatically* implies exploitability is indeed question-begging.
