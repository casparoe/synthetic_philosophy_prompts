answer: |-
  Here is the strongest version of your argument, structured as a philosophical case against van Inwagen's "middle road." It frames the debate not just about intuition (tables vs. trout-turkeys), but about **theoretical cost and metaphysical coherence**.

  ***

  ### The Case Against Ontological Indeterminacy: Why Van Inwagen Pays the Highest Price

  The Special Composition Question (SCQ) presents a trilemma: **Nihilism** (composition never happens), **Universalism** (composition always happens), or **Restrictivism** (composition happens sometimes, e.g., van Inwagen's Organicism).

  Your friend argues that van Inwagen's Organicism is the "common sense" middle ground. However, by biting the bullet on vagueness—admitting that it can be indeterminate whether the *xs* compose a *y*—van Inwagen incurs a theoretical cost that is strictly higher than the "extreme" views of Lewis (Universalism) or Sider (Nihilism/Quantifier Variance).

  Here is the argument that accepting indeterminate cardinality is a metaphysical disaster compared to the merely counterintuitive consequences of Universalism or Nihilism.

  #### 1. Existence is Not a Matter of Degree (The Metaphysical Argument)
  The most fundamental objection to van Inwagen's move is that it treats *existence* as a vague property. But existence is not like "baldness" or "tallness." It is the precondition for having properties at all.

  *   **The "Sort of Pregnant" Problem:** To say it is indeterminate whether an object exists is akin to saying a woman is "sort of pregnant." Either there is a distinct entity there, or there isn't. If the *xs* compose a *y*, then *y* exists. If they don't, *y* does not exist. To say this fact is indeterminate is to say reality itself is fuzzy at the edges.
  *   **The Cost:** Universalism and Nihilism preserve the classical metaphysical intuition that existence is binary. Lewis's "trout-turkey" is a weird object, but its *existence* is precise. Van Inwagen's organism is a familiar object, but its *existence* is metaphysically fuzzy. It is better to have a weird ontology than a fuzzy reality.

  #### 2. The Logical Cost: Bivalence and Quantification
  This is the heaviest theoretical price. Classical logic relies on the principle of bivalence (every proposition is either true or false). If ontological indeterminacy is real, classical logic breaks down when applied to fundamental ontology.

  *   **The Quantifier Problem:** As Ted Sider argues, the existential quantifier ($\exists$) is a logical constant. Logic is supposed to be precise. If the meaning of "there exists" is vague, then logic itself becomes vague.
  *   **The Consequence:** If van Inwagen is right, there are propositions like "There is a living organism in this box" that are neither true nor false. This forces us to adopt supervaluationism or fuzzy logic for fundamental metaphysics.
  *   **Comparison:** Lewis and Sider pay no such logical tax. Universalism maintains bivalence perfectly (it is *true* that the trout-turkey exists). Nihilism maintains bivalence perfectly (it is *false* that the table exists). Van Inwagen forces us to overhaul logic to accommodate a vague world. That is a massive theoretical regression.

  #### 3. Explanatory Power and Cardinality
  The job of ontology is to tell us what the world is made of and, fundamentally, *how much* of it there is.

  *   **Indeterminate Cardinality:** If composition is vague, then the cardinality of the universe is vague. There is no fact of the matter about how many objects exist. This renders ontology explanatorily impotent. If we ask, "How many concrete particulars are there?" and the answer is "Indeterminate," ontology has failed to describe the structure of reality.
  *   **The "Extreme" Advantage:**
      *   **Nihilism:** The cardinality is the number of simples. (Precise).
      *   **Universalism:** The cardinality is $2^n - 1$ (where n is the number of simples). (Precise).
      *   **Organicism:** The cardinality is... vague.
      It is theoretically superior to have a precise answer that conflicts with common sense (Universalism) than to have no precise answer at all (Organicism). A map that says "There is definitely a mountain here" (even if it's a weird mountain) is better than a map that says "There might be a mountain, metaphysically speaking."

  #### 4. Van Inwagen's Inconsistency (The "Material Beings" Trap)
  Your friend cites *Material Beings* to say van Inwagen admits this. But this is actually a weakness, not a strength. Van Inwagen originally motivated Organicism by appealing to our intuitive beliefs about when objects exist.

  *   **The Reductio:** If van Inwagen appeals to intuition to justify Organicism, he cannot use vagueness to save it, because **common sense does not accept ontological vagueness.** Common sense accepts *linguistic* vagueness (we aren't sure how to apply the word "table"), but it rejects *ontological* vagueness (the table itself is neither there nor not there).
  *   **The Dilemma:** By accepting ontological indeterminacy, van Inwagen sacrifices the very "common sense" appeal that motivated his view in the first place. He ends up with the counterintuitive existence claims of Universalism (because he admits weird boundary cases) *plus* the logical mess of indeterminacy. He gets the worst of both worlds.

  #### 5. Theoretical Virtues: Simplicity and Precision
  In theory choice, we value simplicity and precision.
  *   **Universalism:** Rule: "Always." (Maximally Simple). Result: Precise.
  *   **Nihilism:** Rule: "Never." (Maximally Simple). Result: Precise.
  *   **Organicism:** Rule: "When there is a life." (Complex). Result: Vague.

  Van Inwagen's view requires a complex biological criterion that ultimately fails to yield a truth value. Lewis's Universalism is ontologically bloated, yes, but it is **ideologically lean**. It requires no special composition rules, no biological criteria, and no tolerance for vague existence.

  ### Conclusion: The "Extreme" Views Are More Stable
  Your friend thinks Universalism is too high a price because of "trout-turkeys." But trout-turkeys are harmless. They don't break logic, they don't make reality fuzzy, and they don't prevent us from counting objects.

  Van Inwagen's price is **ontological indeterminacy**. This implies that reality itself lacks a determinate structure. That is a far greater cost than admitting that strange objects exist. It is better to populate the world with too many objects (Lewis) or too few (Sider) than to claim the world itself is fundamentally uncountable. Therefore, van Inwagen does not come out ahead; he occupies the most unstable position in the trilemma.
