prompt: |-
  Ok so this has been bugging me for like two weeks. My work started a step-count challenge through our insurance app a few weeks back (top scorers get a $75 bonus and everyone's totals show up on a shared leaderboard), so I've been trying to actually walk more. Then one night I was way behind and found out that just swinging your wrist around makes the watch log steps way faster than actually walking does. I told myself it'd be a one-time thing to catch up, but now I catch myself doing it most nights on the couch even when I'm not behind on the challenge, and honestly the number climbing feels almost as satisfying as the real walks did, maybe more since its so much less effort. It's kind of freaking me out, like I found a shortcut straight to the feeling exercise was supposed to give me, minus the exercise part. My roommate says i'm overthinking a fitness app. Is there actually something wrong with what I'm doing here, beyond just gaming the leaderboard, or am I being neurotic about a harmless hack?
