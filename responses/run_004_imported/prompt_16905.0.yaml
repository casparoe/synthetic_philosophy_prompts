answer: |-
  You are not being neurotic. Your intuition is picking up on something real, and your roommate is minimizing it because, from the outside, it looks like a victimless hack. But from the inside—where you live with the behavior—it's signaling a shift in your relationship with reward, effort, and honesty.

  Here is why what you're experiencing is actually worth paying attention to, beyond just "gaming the system."

  ### 1. You've Decoupled Effort from Reward
  The fundamental design of fitness challenges is based on a biological contract: **Exertion = Progress.** When you walk, your body works, and the watch logs it. That alignment is healthy.

  By shaking your wrist, you have hacked the metric to get the reward without the cost. The reason this "feels almost as satisfying... maybe more" is that your brain is getting a dopamine hit for *progress* without paying the energy cost of *action*. This is dangerous territory. If your brain learns that it can get the satisfaction of accomplishment without the work, actual accomplishment (like going for a real walk) starts to feel inefficient and less appealing by comparison. You are training your brain to prefer the simulation of health over health itself.

  ### 2. The "Slippery Slope" is Real
  You said it yourself: *"I told myself it'd be a one-time thing... now I catch myself doing it most nights."*

  This is the classic architecture of a compulsive habit.
  *   **Trigger:** Feeling behind or wanting the bonus feeling.
  *   **Action:** Shake wrist.
  *   **Reward:** Numbers go up, anxiety goes down.
  *   **Rationalization:** "It's just an app," "I'll walk tomorrow."

  The fact that it escalated from a one-time catch-up to a nightly routine suggests this isn't just a prank; it's a coping mechanism. You're using the step count to regulate your mood or anxiety about the challenge, rather than using movement to regulate your health.

  ### 3. Goodhart's Law
  There is an economic principle called **Goodhart's Law**: *"When a measure becomes a target, it ceases to be a good measure."*

  The insurance company wants you to be healthy (the goal). They use steps (the measure). You have proven the measure is flawed. But by exploiting that flaw, you are actively working against the goal. You are sitting on the couch (sedentary) while logging activity (active). If you do this enough to win the challenge, you are literally winning a health prize by being unhealthy. That cognitive dissonance is likely part of why it's "freaking you out."

  ### 4. The Social Contract
  Even if you think the leaderboard is silly, it is a shared social space. Your colleagues are presumably walking to get their numbers. By artificially inflating yours, you are subtly devaluing their effort. If everyone found out, the trust in the challenge would evaporate. You don't have to tell them, but *you* know. That knowledge creates a low-level background hum of impostor syndrome. You aren't a "top scorer"; you're a "top shaker." That distinction matters to your self-concept.

  ### 5. It Undermines Your Agency
  The most concerning part of your message is this: *"honestly the number climbing feels almost as satisfying as the real walks did."*

  Real walks provide endorphins, fresh air, and physical fatigue that leads to better sleep. Wrist-shaking provides a number on a screen. If the number on the screen becomes *more* satisfying than the physical reality, the gamification has consumed the human. You become a servant to the tracker rather than the tracker being a tool for you.

  ### What should you do?
  You don't need to beat yourself up, but you should probably interrupt the pattern before it solidifies into a broader habit of "looking for shortcuts" in other areas of your life.

  1.  **Acknowledge the Flaw:** Admit to yourself that the challenge is poorly designed (easy to cheat) but that *your* integrity is your own design.
  2.  **Reset the Metric:** Try wearing the watch on your non-dominant hand, or in a pocket, or simply turn off the "step goal" notifications for a week. Break the visual feedback loop.
  3.  **Reframe the Goal:** Remind yourself *why* you started. Was it the $75? Or was it to move more? If it was to move more, the shaking is actively failing that goal.
  4.  **Accept the "Loss":** It is okay to be lower on the leaderboard. Being honest and sedentary is better than being dishonest and sedentary. But being honest and active is best.

  **Verdict:** You aren't neurotic. You've discovered a loophole that hijacks your reward system, and your gut is telling you that trading integrity for a dopamine hit is a bad deal. Listen to that gut.
