      *Wait, one more thing:* Benatar anticipates the "most people say they are happy" objection. He calls it the "Pollyanna Principle." So the rebuttal needs to address *why* Benatar's dismissal of self-reports might be wrong. (e.g., Who is the arbiter of another's suffering?).

