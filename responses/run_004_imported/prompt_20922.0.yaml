answer: |-
  You have nailed the basic mechanic, but you're underestimating why the "bounded utility" patch is considered a expensive bullet to bite, and why Pasadena breaks Expected Utility Theory (EUT) in a way St. Petersburg doesn't quite manage.

  You're right that Pasadena is St. Petersburg's weirder cousin.
  *   **St. Petersburg:** The series diverges to $+\infty$.
  *   **Pasadena:** The series is **conditionally convergent** (specifically, it looks like the alternating harmonic series). The sum is *undefined* because, by the Riemann Rearrangement Theorem, you can make it sum to any number you want just by changing the order in which you add the terms.

  So, yes: **If you cap the utility function, the Pasadena paradox mathematically disappears.** If utility is bounded (say, between -1 and 1), you cannot construct the sequence of outcomes required to make the series conditionally convergent. The series would become absolutely convergent, and the expectation would be well-defined.

  So why do decision theorists lose sleep over Pasadena if the solution is the same? Three main reasons:

  ### 1. The "Cost" of Bounded Utility is Higher Than It Looks
  You mentioned the patch everyone uses on St. Petersburg is capping utility. While that's the standard mathematical fix, it's philosophically controversial.
  *   **St. Petersburg:** You can argue, "Okay, money has diminishing marginal utility, so I'll use log utility." That feels natural.
  *   **Pasadena:** To kill Pasadena, you need *strictly bounded* utility. Not just diminishing, but capped. There must be a maximum possible good and a minimum possible bad.
  *   **The Problem:** Many philosophers argue this is counter-intuitive. Is there really a finite cap on how good a state of affairs can be? If you offer a believer eternal heaven vs. a slightly less good eternal heaven, bounded utility suggests the difference is negligible or zero once you hit the cap. Accepting bounded utility solves the math but breaks a lot of ethical and rational intuitions about "better" and "worse." Pasadena forces you to confront this cost more aggressively than St. Petersburg does.

  ### 2. The Altadena Game (The Dominance Killer)
  This is the real reason Pasadena is treated as a deeper cut.
  Nover and Hájek (who introduced Pasadena) also described the **Altadena Game**.
  *   **Pasadena Game:** Payoffs follow the alternating series ($2, -1, 2/3, -1/4...$). EV is undefined.
  *   **Altadena Game:** Exactly the same as Pasadena, but every single payoff is increased by $+1$.

  **The Paradox:**
  1.  **Dominance:** In every single possible outcome, Altadena pays exactly $1 more than Pasadena. Rationality dictates you should strictly prefer Altadena.
  2.  **Expectation:** Since Pasadena's EV is undefined ($X$), Altadena's EV is $X + 1$. But if $X$ is undefined, $X + 1$ is *also* undefined.
  3.  **Result:** Expected Utility Theory cannot tell you to prefer Altadena over Pasadena, even though Altadena **dominates** Pasadena state-by-state.

  St. Petersburg doesn't break dominance this cleanly. With St. Petersburg, you can say "EV is infinite, so pay any finite cost." With Pasadena, EUT goes silent. It creates a paralysis where the theory cannot distinguish between a dominated option and a dominating one. That suggests the problem isn't just "infinite numbers are weird," but that **Expectation itself is the wrong tool** for certain distributions.

  ### 3. Order Dependence vs. Magnitude
  St. Petersburg is a problem of **magnitude** (the value gets too big).
  Pasadena is a problem of **definition** (the value doesn't exist).

  In probability theory, the order in which you sum outcomes shouldn't matter. A lottery is defined by the set of outcome-probability pairs, not a sequence. But the Pasadena game's expected value *depends* on how you order the summation.
  *   If you group positive terms first, EV $\to +\infty$.
  *   If you group negative terms first, EV $\to -\infty$.
  *   If you alternate, EV $\to \ln(2)$.

  This implies that Expected Utility Theory is ill-defined for this distribution *regardless* of whether you think utility should be bounded. It exposes that EUT relies on an assumption (absolute convergence) that isn't guaranteed by the axioms of rationality themselves.

  ### Summary
  You're right that **bounded utility solves it**. But Pasadena is considered "deeper" because:
  1.  It forces you to admit that **rational preference might require a hard cap on value**, which is a harder philosophical pill to swallow than diminishing returns.
  2.  It breaks **Weak Dominance** (via the Altadena variant), showing EUT can fail to prefer a strictly better option.
  3.  It shows that **Expectation is undefined**, not just infinite, which attacks the mathematical machinery of decision theory rather than just the inputs.

  St. Petersburg says "Your calculator overflows." Pasadena says "Your calculator gives a different answer depending on which button you press first." The latter suggests the calculator (EUT) is fundamentally broken for this class of problems, not just that the input was too big.
