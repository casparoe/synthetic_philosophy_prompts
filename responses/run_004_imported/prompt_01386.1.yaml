      *   *Decision Theory Angle:* Under Causal Decision Theory (CDT), you shouldn't intend because you know you won't follow through. Under Timeless Decision Theory (TDT) or Updateless Decision Theory (UDT), you *should* intend because your decision algorithm is what was being tested. The widow wasn't testing your *future action*, she was testing your *decision type*.
