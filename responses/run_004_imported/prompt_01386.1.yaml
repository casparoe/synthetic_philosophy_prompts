      *   This is the classic structure of **Newcomb's Problem** or, more accurately, **Parfit's Hitchhiker**.
      *   *Parfit's Hitchhiker:* You are stranded in the desert. A driver offers a ride to the city only if you promise to pay them once you arrive. The driver can detect lies. Once in the city, you have no incentive to pay (driver can't force you). To get the ride, you must *intend* to pay.
