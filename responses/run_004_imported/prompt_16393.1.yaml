      *   *Move 2 (Marcus):* But that assumes the world is static. Real agents revise. If Alice Passes, maybe she sees something I don't.
      *   *Move 3 (Elena):* If you allow revision, you lose the predictive power. CKR is a structural constraint, not a psychological guess.
      *   *Move 4 (Marcus):* Structural constraints can't override the logic of conditionals. If $P$ implies $Q$, and not-$Q$, then not-$P$. You can't keep $P$ (Rationality) when you see not-$Q$ (Deviation).
      *   *Climax/Ending:* Pinpoint the exact fracture. Is Rationality a property of the *plan* (Elena) or the *action-in-context* (Marcus)? Is CKR a prior constraint or a dynamic process?

  5.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I make Elena too robotic? *Fix:* Give her a pragmatic defense. Aumann's math works because it defines the terms clearly.
