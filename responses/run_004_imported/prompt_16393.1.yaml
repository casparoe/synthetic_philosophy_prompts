      *   **Characters:**
          *   *Epistemic Game Theorist (EGT):* Defends Aumann. Argues rationality is a property of the *strategy* (plan of action) assessed ex-ante, covering all nodes.
          *   *Philosopher (Phil):* Trained in belief revision/conditional logic. Argues CKR breaks down when an "impossible" move happens; we need a theory of belief revision, not just static knowledge.
      *   **Format:** Dialogue.
      *   **Requirements:**
          *   Work through a concrete run of the Centipede Game (don't just trade slogans).
          *   Strongest case for both sides.
