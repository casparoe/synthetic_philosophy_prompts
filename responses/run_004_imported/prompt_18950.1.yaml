answer: |-
  Two decision theorists, Alice and Bob, are standing in front of the classic Ellsberg setup. Urn A has 50 red and 50 black. Urn B has 100 balls, ratio unknown.

  Alice turns to Bob and says, "Okay, I'll pay you $100 if you draw a Red ball. Which urn do you pick?"

  Bob points to Urn A. "The known one."

  Alice nods. "Okay, reverse it. I'll pay you $100 if you draw a Black ball. Which urn?"

  Bob points to Urn A again. "Still the known one."

  Alice crosses her arms. "Bob, you know this implies you're acting as if Urn B has less than a 50% chance of being Red... *and* less than a 50% chance of being Black."

  "I'm aware," Bob says.

  "That's mathematically impossible," Alice says. "Unless you believe the balls in Urn B vanish when I'm not looking, your subjective probabilities have to sum to one. You can't be pessimistic about both outcomes simultaneously without contradicting yourself."

  Bob looks at Urn B suspiciously. "You're thinking about this like a statistician. I'm thinking about it like a gambler."

  "What's the difference?"

  "A statistician assumes the odds are fixed," Bob says. "A gambler assumes the House is watching."

  Alice blinks. "There is no House. It's a clay pot."

  "Exactly," Bob says. "It's not hiding its ratio because it's random. It's hiding its ratio because it doesn't want me to know which bet it's rigged to beat. For all I know, Urn B is the kind of urn that waits until I say 'Red' before it decides it was always a Black urn."

  "So you're saying the only rational explanation for ambiguity aversion..."

  "...is belief in a sentient, adversarial urn," Bob says, picking up Urn A. "Now hand me my $100. I trust this one because it already told me exactly how it plans to screw me."
