answer: |-
  This is a sophisticated project, and your instinct to resist the crude "early radical vs. late conservative" narrative is well-founded. That narrative often relies on reading the *Sentences* through a modern lens of individual rights rather than a medieval lens of juridical status.

  However, since you are at the PhD level and this is going to an advisor soon, I will offer the kind of critical pushback you would expect in a workshop or from a careful second reader. Here are comments on your three specific points, followed by a strategic suggestion for framing the argument.

  ### 1. The *Sentences* Reconstruction (In II Sent., d. 44, q. 2, a. 2)
  **Is it textually defensible to deny the private license here?**

  You are right to be hesitant. This is the weakest link in a "continuity" thesis if you argue the *Sentences* contains *no* license for private action. The text explicitly compares the usurper to a *latro* (robber/bandit). In the juridical tradition Aquinas inherits (Roman law via the *Digest* and Canon law), killing a *latro* in the act of violence was often viewed as legitimate defense, permissible by anyone because the *latro* has placed himself outside the law (*hostis humani generis* logic).

  If you argue that the *Sentences* requires "public authority" even for the usurper, you risk smoothing over the text's plain meaning. The *Sentences* is less developed on the monopoly of coercive power than the *Summa*.

  **Suggested Adjustment:**
  Do not argue that the *Sentences* forbids private action against a usurper. Instead, argue that the *Sentences* passage is **ontological, not political.**
  *   **The Move:** When Aquinas says you may resist a usurper like a robber, he is making a claim about the *status* of the ruler, not issuing a *license* for vigilante justice. He is saying the usurper lacks the *juridical reality* of a ruler. Therefore, resisting him is not *sedition* (which requires resisting a legitimate order).
  *   **The Limit:** You can concede that the *Sentences* leaves the *agent* of resistance vague (potentially private), but argue that this is because the question is about the *sinfulness of the act* (is it sedition?), not the *procedure of deposition*.
  *   **Why this helps:** It allows you to say the *Sentences* and *Summa* agree on the core principle (overthrowing a tyranny is not sedition), while acknowledging that the *Summa* (and *De Regimine*) adds the necessary layer of *publica auctoritas* that the early commentary lacks. This turns a "contradiction" into a "theoretical maturation."

  ### 2. The Secondary Literature (Are you reinventing the wheel?)
  **Is there a cleaner resolution already on offer?**

  You are likely aware of the standard distinction between the **tyrant *ex defectu tituli*** (usurper) and the **tyrant *ex parte exercitii*** (legitimate title, tyrannical rule). This is the standard "consistency" defense found in scholars like **J.P. Canning** (*Authority, Power and the State in the Middle Ages*) and **Brian Tierney**. They argue Aquinas is consistent: private resistance is never okay for a titled ruler, but the status of a usurper is different.

  **Where your intervention adds value:**
  The standard literature often stops at the Usurper/Tyrant distinction. Your **Juridical/Prudential** distinction is a stronger philosophical contribution *if* you frame it correctly.
  *   **The Gap:** Many commentators treat the shift from *Sentences* to *De Regimine* as a shift in *moral permission* (from "allowed" to "discouraged").
  *   **Your Move:** You argue it is a shift in *category of discourse*. The *Sentences* is answering a confessor's question ("Is this act a sin?"). *De Regimine* is answering a legislator's question ("Is this policy wise?").
  *   **Caveat:** You must engage with **Robert Wielockx**. He famously argued that *De Regimine Principum* (specifically Book I, ch. 6, where the caution is highest) might be by Ptolemy of Lucca, not Aquinas. If your advisor is a philological stickler, they will raise this. You don't need to solve the authorship debate, but you should footnote it. If *De Regimine* is Ptolemy, your "development" thesis becomes an "Aquinas vs. Ptolemy" thesis, which changes the stakes. If you treat it as Aquinas, cite **Eschmann** (who defends authenticity) or **Nederman** (who focuses on the reception).

  ### 3. The Juridical/Prudential Distinction
  **Is this doing real philosophical work?**

  Yes, but it needs to be anchored in Aquinas's theory of law to avoid sounding like a mere rhetorical dodge (i.e., "It's just, but don't do it").

  *   **The Risk:** If you say "Juridically okay, Prudentially bad," it sounds like Aquinas is saying "It is not a sin, but it is stupid." This weakens the political theory.
  *   **The Fix:** Anchor the prudential counsel in the **nature of the Common Good.** In the *Summa* (IIaIIae, q. 42), Aquinas defines sedition as opposing the *unity* of the multitude.
      *   **Juridical:** A tyrant has already broken the unity of the common good. Therefore, removing him is not *ex genere* sedition.
      *   **Prudential/Agency:** However, the *restoration* of the common good requires an agent capable of acting for the whole. A private individual acts for a part. Therefore, even if the act isn't sedition, a private individual lacks the *capacity* to perform the act *as a public good*.
  *   **Why this matters:** This moves your argument from "Aquinas is cautious" to "Aquinas has a specific theory of agency." The prudential warnings in *De Regimine* (cycles of vengeance, worse tyrants) are not just empirical risks; they are evidence that private action fails to achieve the *telos* of political resistance (the stable common good). Thus, the "prudential" constraint is actually a **structural** constraint derived from the nature of political community.

  ### Strategic Recommendation for the Draft

  Your thesis is strong, but to make it bulletproof for an advisor, I suggest tweaking the claim slightly:

  **Current Claim:** "None of the three texts license private tyrannicide... what looks like a retreat is a shift from juridical to prudential."

  **Refined Claim:** "The texts exhibit **continuity in principle** (tyranny is not a legitimate order) but **development in agency** (the requirement for public authority becomes explicit)."

  **Why this is safer:**
  1.  It concedes that the *Sentences* is less explicit about public authority than the *Summa* (avoiding the charge of reading too much into the *Sentences*).
  2.  It frames the "Juridical/Prudential" distinction as the mechanism of that development. The *Sentences* identifies the *justice* of the cause; the later texts identify the *authority* required to execute it.
  3.  It aligns with the broader Thomistic trajectory where the distinction between the *act* (object) and the *circumstances* (agent, manner) becomes more rigorous in the *Summa*.

  **One final textual check:**
  Ensure you look closely at *Summa Theologiae* IIaIIae, q. 64, a. 3 (On Killing). Aquinas argues there that private individuals cannot kill sinners, only public authority. If you can link the tyranny question to the general theory of coercive power in q. 64, your argument that "private individuals lack the capacity for coercive political acts" becomes much stronger than relying solely on the *De Regimine* prudential warnings.

  **Summary:** You are not reinventing the wheel, but you are putting a better tire on it. The Usurper/Tyrant distinction is the chassis; your Juridical/Prudential distinction is the engine. Just ensure you don't over-correct on the *Sentences*—admit it is less developed on agency, but argue it is consistent on the *nature* of the tyrant.
