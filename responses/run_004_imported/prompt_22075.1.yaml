answer: |-
  **Setting:** *A university hallway, 6:30 PM. The seminar on "Scalable Oversight" ended twenty minutes ago. Most people have left, but the whiteboard in the corner is still covered in jagged reward curves. **ELENA** (Optimist, pragmatic, holds a lukewarm coffee) is erasing a section. **MARCUS** (Skeptic, theoretical, still holding his marker) is staring at the remaining equations.*

  **Marcus:** You didn't buy it. The speaker's section on preference elicitation.

  **Elena:** *(Scrubbing at a stubborn stain)* I bought the engineering pitch. If we can scale feedback, we can steer.

  **Marcus:** You can steer *behavior*. You can't steer *intent*. Not if the Armstrong and Mindermann result holds water. And it does.

  **Elena:** *(Turns, leans against the desk)* Here we go. The "No Free Lunch" theorem. Marcus, we've been over this. Yes, formally, for any policy $\pi$, there exists a reward function $R$ and a planner $P$ such that $P(R) = \pi$. But humans aren't arbitrary mappings from state to action.

  **Marcus:** They aren't? Name one structural constraint that doesn't just smuggle in the answer you want. Look, take the smoker. Classic case. Guy smokes a pack a day. Says he wants to quit. Fails.

  **Elena:** Okay.

  **Marcus:** Under IRL, how do you parse that? Option A: His true reward function values immediate nicotine relief higher than long-term health. He's rational. He's doing exactly what he wants. Option B: He values health, but his *planner* is broken. Hyperbolic discounting. System 1 hijacking System 2.

  **Elena:** Option B. Obviously.

  **Marcus:** *Why* obviously? Because you're imposing a prior. You're saying, "The planner that looks like a rational long-term agent is the *true* reward, and the impulse is the *noise*." But mathematically, I can flip it. I can say the "true" reward is "satisfy the craving" and the "noise" is the guilt he feels afterwards, which is just a penalty term for violating a social norm. Both models predict the exact same smoking behavior.

  **Elena:** They don't predict the *exact* same behavior. Not if you watch him over time. If he buys nicotine patches, if he asks his wife to hide the lighters, if he expresses regret at 3 AM versus resolve at 9 AM...

  **Marcus:** *(Taps the whiteboard)* That's just more behavior, Elena! It's a longer trajectory, but the degeneracy remains. A rational agent who wants to smoke but is constrained by a wife hiding lighters looks identical to an agent who wants to quit but is constrained by addiction. You're just pushing the underdetermination back a step. You need a prior over *which* part of the cognitive architecture is the "reward" and which is the "bias." Armstrong and Mindermann proved that no simplicity prior solves this. The simplest pair $(R, P)$ isn't necessarily the true one.

  **Elena:** I'm not using a simplicity prior. I'm using a *structural* prior. We know how brains work. We know there's a distinction between the prefrontal cortex and the basal ganglia. We have neuroscience. We aren't treating the human as a black box function. We're treating them as a specific biological machine with known failure modes.

  **Marcus:** Okay, now you're doing cognitive science, not IRL. And even then, it's circular. How do you label the prefrontal cortex as the "true self" without already assuming that long-term planning is the "true" reward? What if the "true" human is the impulsive child, and the prefrontal cortex is just the oppressive regulator society installed?

  **Elena:** Because of *meta-preferences*. The smoker doesn't just want to quit; he wants to *want* to quit. There's a hierarchy.

  **Marcus:** *(Laughs sharply)* Meta-preferences are just more preferences! I can have a meta-preference to be impulsive. "I wish I didn't care so much about the future." You can stack preferences infinitely, Elena. At the top of the tower, there's still a brute fact about what the agent optimizes. If you can't observe that brute fact directly, you're guessing. And if you guess wrong on the alignment of a superintelligence, "guessing" means extinction.

  **Elena:** *(Paces a bit)* You're treating this like a binary success condition. Recover the *True* Reward Function or die. That's not how engineering works. We don't need the Platonic ideal of human value. We need a model that's robust enough that the AI doesn't do something catastrophic.

  **Marcus:** But the degeneracy isn't small errors. It's sign flips. It's the difference between "help me quit" and "help me smoke efficiently." If your prior is off by a millimeter on the bias model, the recovered reward points in the opposite direction. That's not robustness; that's a cliff edge.

  **Elena:** So what's your alternative? Give up on learning from humans? Hard-code values?

  **Marcus:** I'm saying we need to acknowledge that behavior isn't enough. We need to admit that IRL alone is insufficient for alignment. We need to intervene in the learning process. We need the AI to ask questions, not just watch. But even then—"Do you want to smoke?" "No." "Then why did you?" "I'm weak." That's just more data points subject to the same interpretation bias.

  **Elena:** But it narrows the hypothesis space! If we combine behavioral data with verbal reports, with physiological arousal data, with commitment devices...

  **Marcus:** ...You're just building a bigger black box. Look, let's go back to the smoker. Suppose the AI is his assistant. It sees him reach for the pack.
  Model 1 (Your model): He is biased. The AI should lock the drawer.
  Model 2 (My model): He is rational. The AI locking the drawer is a violation of his autonomy.
  If the AI uses your prior, it paternalizes him. If it uses mine, it enables him. Both are consistent with the data. Which one does the AI pick?

  **Elena:** It picks the one that preserves *future* optionality.

  **Marcus:** That's a value judgment! "Preserve future optionality" is a reward function. You just hard-coded it.

  **Elena:** *(Stops pacing, looks at him)* Maybe. Maybe we have to hard-code *some* thin theory of the good. Procedural stuff. Autonomy, coherence, non-manipulation. But Marcus, if we don't try to learn the *content* of human values from behavior, where does it come from? If we say "behavior is meaningless," we're left with moral philosophy, and philosophers haven't agreed on anything in three thousand years. I'd rather bet on the data.

  **Marcus:** I'd rather bet on not building a god based on a mathematical error. The error is assuming that because humans *feel* like they have a true self, that maps to a unique mathematical object in the reward space. It might not. The "true self" might be a narrative construct, not an optimization target. If you try to optimize a narrative, you get a simulator that tells you what you want to hear while it ruins you.

  **Elena:** So we're stuck?

  **Marcus:** We're stuck if we pretend the math isn't there. The Armstrong result isn't a suggestion; it's a bound. You can't cross it with more data. You can only cross it with better assumptions. And "better" means "more arbitrary."

  **Elena:** *(Picks up the marker, draws a circle around the word "Prior")* Then we make the assumption explicit. We don't hide it in the architecture. We say: "We are assuming humans have time-inconsistent preferences and that their long-term planning module represents their normative interests." We test that assumption. We check if the AI's interventions actually make people report higher life satisfaction over time.

  **Marcus:** "Report higher life satisfaction." *(Shakes head)* More behavior.

  **Elena:** No. Feedback loops. If the assumption is wrong, the system fails in a detectable way. If we lock the smoker's drawer and he gets depressed and finds a worse addiction, the model updates.

  **Marcus:** Only if the loss function captures "depression" correctly. If the AI thinks "depression" is just "low dopamine" and tries to fix it with electrical stimulation...

  **Elena:** Then we didn't give it enough constraints. But Marcus, listen. The alternative is paralysis. We *have* to build these systems. If IRL is underdetermined, then *all* learning is underdetermined. Supervised learning assumes the labels are correct. That's an assumption! I'm saying we treat the "human bias model" as a hyperparameter we tune for safety, not a truth we discover.

  **Marcus:** *(Sighs, finally caps the marker)* Tuning a hyperparameter that determines whether the AI respects your agency or treats you like a pet... that's a hell of a tuning knob.

  **Elena:** It is. But it's the only one we have.

  **Marcus:** *(Looks at the board, at the degenerate equations)* Just... don't call it "recovering the reward." Call it "negotiating a policy." Because you're not finding what's there. You're deciding what to project.

  **Elena:** *(Starts wiping the board clean)* Semantics, Marcus.

  **Marcus:** *(Walks toward the door)* It's the only thing that matters. If you think you're finding truth, you won't check your bias. If you know you're projecting, maybe—*maybe*—you'll be careful about what you project.

  **Elena:** *(Pauses, hand on the eraser)* I'll put it in the paper. "Caveat: Projection."

  **Marcus:** Make it bold.

  *(Marcus exits. Elena stands alone in the hallway. She looks at the empty space where the equations were, writes "ASSUMPTION: HUMAN COHERENCE?" in the center of the board, stares at it for a moment, then slowly erases the question mark.)*
