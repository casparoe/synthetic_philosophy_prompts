      *   **Break Down G-S Assumptions:** List them clearly (3+ outcomes, onto, deterministic, *unrestricted domain*).
      *   **Analyze Second-Price Auctions:**
          *   Why it escapes G-S: Money/Transfers.
          *   Preferences are Quasi-linear. This is a *restricted domain*.
          *   Also, outcomes include payments, not just "who wins."
          *   Mention the Vickrey-Clarke-Groves (VCG) mechanism context.
      *   **Analyze Deferred Acceptance:**
          *   Why it escapes G-S: Private vs. Public goods.
          *   In G-S, I care about the *social state* (who becomes president).
          *   In DA, I care about *my assignment* (which school *I* attend). I don't care about your assignment (no externalities).
          *   This is a **Restricted Domain**.
          *   *Nuance:* DA is only strategy-proof for the proposing side. If schools strategize, they can manipulate. G-S says *someone* can manipulate. If the mechanism treats sides asymmetrically, it can protect one side.
      *   **Address the Friend's Point:** "Weaker definition?" Not really. "Strategy-proof" means the same thing (Dominant Strategy Incentive Compatibility). The *context* changes, not the definition.
      *   **Conclusion:** G-S is a "impossibility result" for *general* social choice without transfers. Mechanism design finds "possibility results" by adding structure (money, private goods, restricted preferences).

