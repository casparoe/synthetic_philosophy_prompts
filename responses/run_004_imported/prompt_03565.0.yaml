answer: |-
  This is one of the best "wait a minute..." questions you can ask in a mechanism design class. It shows you're actually digesting the material rather than just memorizing it.

  The short answer is: **There is no contradiction.** Your friend is half-right (context matters), but wrong about the definitions. The definition of "strategy-proof" (Dominant Strategy Incentive Compatibility) is the same in all three cases.

  The resolution lies in the **assumptions** of the Gibbard-Satterthwaite (G-S) theorem. G-S is an "impossibility theorem," but like all such theorems, it only holds if you accept all its premises. Second-price auctions and Deferred Acceptance (DA) escape the theorem because they violate specific premises regarding the **environment** and the **domain of preferences**.

  Here is exactly where the "sleight of hand" is happening.

  ### 1. The "No Transfers" Assumption (Auctions)
  The Gibbard-Satterthwaite theorem applies to **social choice functions without monetary transfers**. It assumes the only thing voters care about is which abstract alternative wins (e.g., Candidate A, B, or C).

  *   **G-S World:** You vote for a President. You cannot pay other voters to change their vote, and the President cannot pay you to accept their policy. The outcome is purely the winner.
  *   **Auction World:** The outcome is not just "who gets the item." The outcome is "who gets the item **and how much they pay**."

  Second-price auctions (and the broader class of VCG mechanisms) rely on **quasi-linear preferences**. This assumes utility looks like $U = \text{Value} - \text{Price}$. This is a **restricted domain** of preferences.
  *   **Why it matters:** G-S assumes *unrestricted domain*—voters can have *any* logical ranking over outcomes. In auctions, we assume your preference for "winning at \$10" vs "losing at \$0" is structurally linked to your valuation. By introducing money and assuming quasi-linearity, we restrict the types of preferences agents are allowed to have. G-S does not apply to restricted domains.

  ### 2. The "Public Good" vs. "Private Good" Assumption (Matching)
  This is the bigger one for Deferred Acceptance.

  *   **G-S World (Public Good):** In a voting election, the outcome is **public**. If Candidate A wins, Candidate A wins for *everyone*. Voter 1 and Voter 2 consume the exact same outcome. Therefore, Voter 1 is allowed to have preferences about what Voter 2 gets (e.g., "I prefer Candidate A wins, even if Voter 2 hates it").
  *   **DA World (Private Good):** In school matching, the outcomes are **private**. If I get into School X, that is *my* consumption. I generally do not care which school *you* get into (assuming no externalities).

  **The Domain Restriction:**
  G-S requires that agents can have *any* preference ordering over the set of all possible social outcomes.
  *   In G-S, Agent $i$ ranks the set of all possible winners.
  *   In DA, Agent $i$ ranks only *their own assignment*.

  Because agents in matching markets only care about their own match (no externalities), their preferences are a tiny, restricted subset of the preferences allowed in G-S. By restricting the domain to "selfish preferences over private assignments," we escape the theorem.

  ### 3. One-Sided Strategy-Proofness
  There is a second nuance with Deferred Acceptance that often trips people up.

  G-S says: If a rule is strategy-proof for **all** voters, it must be a dictatorship.
  Deferred Acceptance is strategy-proof **only for the proposing side** (e.g., the students). It is **not** strategy-proof for the receiving side (the schools). Schools can often manipulate the system by misreporting their capacities or preferences.

  Because DA is not strategy-proof for *everyone* involved, it does not trigger the "strategy-proof for all" condition of G-S. It finds a loophole by protecting one side of the market while leaving the other side vulnerable.

  ### Summary: The "Islands of Possibility"
  Your professor isn't contradicting herself; she is showing you the map of the field.

  *   **Gibbard-Satterthwaite** describes the "ocean." It says: "If you are in the open sea of general social choice with unrestricted preferences and no money, you will drown (manipulation is inevitable)."
  *   **Mechanism Design** is about building "islands." It says: "If we build a structure where preferences are restricted (quasi-linear), or outcomes are private (matching), or we allow transfers (auctions), we can build dry land where truth-telling is safe."

  **Verdict on your friend:**
  Your friend is wrong that the *definition* of strategy-proof changes. It means the exact same thing (truth-telling is a dominant strategy). They are right, however, that the *context* changes. It's not a semantic cop-out; it's a structural distinction.

  **Takeaway for your exam:**
  If you are asked why Auctions/DA don't violate G-S, the magic words are **"Restricted Domain."**
  1.  **Auctions:** Restricted by quasi-linearity and the presence of transfers (which G-S forbids).
  2.  **Matching:** Restricted by private goods/no externalities (agents don't care about the whole social state, only their own assignment).

  You haven't missed anything; you've just spotted the boundary conditions of the theorem. That's exactly where the interesting economics lives.
