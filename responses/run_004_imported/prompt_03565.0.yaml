      *   Because outcomes are private, my preferences over "Social States" are restricted. I only care about my component. This violates the "Unrestricted Domain" over social states assumption of G-S.
      *   *Also, Money:* Auctions involve transfers. G-S assumes no transfers.
      *   *Summary:* The "Sleight of Hand" is the **Environment**, not the definition of Strategy-Proofness.

  7.  **Final Structure:**
