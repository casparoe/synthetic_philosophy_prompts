      *   *Wait, let's look closer.* G-S says: If a SCF is onto and non-dictatorial, it is manipulable.
      *   In DA, is it a SCF? It's a matching mechanism.
      *   The key distinction is usually framed as **Public vs. Private Goods**.
      *   In Voting (G-S), the outcome is public. Everyone consumes the same outcome (Candidate A wins for everyone).
