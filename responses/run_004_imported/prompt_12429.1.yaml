      *   *The Rationality/Bias Trade-off:* This is the crux. $Behavior = f(Reward, Rationality)$. If you fix Rationality, you get Reward. But Rationality is unobserved.
          *   *Example:* Eating broccoli. Reward = health? Or Reward = taste + bias against future self?
          *   *Implication:* The modeler chooses the "bias prior." This is a normative choice disguised as a technical hyperparameter.
      *   *Implication for AI Alignment:*
