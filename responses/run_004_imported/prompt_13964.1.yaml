          *   **Avoiding the "All History is Bad" Trap:** Frame it as "Evidential Burden." Laudan shifted the burden to realists. Worrall accepted it but didn't meet it. The problem isn't history *per se*, it's the *asymmetry of evidential support*.

  6.  **Refining the Advice (Self-Correction during drafting):**
