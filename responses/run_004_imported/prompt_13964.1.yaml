  3.  **Address Question 1: Is this fair to Worrall? (The Nature of ESR)**
      *   *Initial thought:* Worrall does rely heavily on Fresnel/Maxwell. It's his paradigmatic case.
      *   *Nuance:* Does ESR *need* a statistical induction? Or is it a claim about *rational reconstruction* and *continuity of method*?
      *   *Key Distinction:* Worrall often frames ESR as the "best explanation" for the *possibility* of progress, not necessarily a statistical claim that "90% of structure survives."
      *   *Counter-argument:* However, to defeat PMI, ESR usually needs to show that the *reason* for success is structural retention. If structure *doesn't* retain in Laudan's cases (e.g., phlogiston), then ESR doesn't save realism in those cases.
      *   *Refinement:* There is a "divide et impera" strategy (Kitcher, Psillos) that is more granular than Worrall's broad structuralism. Worrall specifically focuses on mathematical structure.
      *   *Verdict:* It is largely fair, but the user should acknowledge that Worrall might claim the *mechanism* of theory construction ensures structural retention, not just historical tallying. However, without historical backing, that mechanism claim is speculative.
