      *   *Reasoning:* The moral justification for interfering with people's lives (even via defaults) rests on the claim that we aren't actually making them worse off. If we make the "rational" minority worse off to help the "biased" majority, we are engaging in standard utilitarian trade-offs, not respecting liberty. The "Libertarian" part of Libertarian Paternalism is the shield, but the "Asymmetric" part is the sword that actually cuts the moral knot. If a nudge imposes high costs on opt-out, critics rightly call it coercive. Thus, the *low cost* is the necessary condition for the *preserved choice* to be meaningful.

