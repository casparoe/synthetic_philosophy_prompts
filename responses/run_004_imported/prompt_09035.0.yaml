      *   *Idea:* Default enrollment with a *high* opt-out cost.
      *   *Example:* **Auto-enrollment in a Union with a difficult opt-out process.**
          *   *LP:* You can opt out. Choice is technically preserved.
          *   *Not AP:* If you don't want the union (rational choice for you), the cost to opt out (lawyers, fees, time) is high. It burdens the "rational" dissenter.
      *   *Example 2:* **Default Organ Donation with Social Stigma/Tracking.**
          *   *LP:* You can opt out on your license.
          *   *Not AP:* If you opt out, you are flagged, perhaps insurance rates go up, or social shaming occurs. The cost to the "rational" objector is high.
      *   *Example 3:* **Green Energy Default with a "Brown Energy" Surcharge.**
          *   *LP:* You can choose coal power.
