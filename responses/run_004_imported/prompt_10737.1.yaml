prompt: |-
  I've served on the governing board of a smallish literary prize for a few years now (it's sort of my community-service project as a working novelist), and every year we have some version of the same fight about how the judging panel should be structured. Right now three judges read everything and hash it out across two long meetings until they land on a winner, but a newer board member -- an ex-quant who writes thrillers on the side -- keeps citing the Condorcet Jury Theorem, arguing that if we swapped those three judges for fifteen or twenty "community readers" each casting an independent vote, the aggregate pick would be more likely to land on the actual best book, the same way a big enough jury supposedly converges on the correct verdict, and he's convinced its basically settled math at this point. Several of us have a nagging feeling this doesn't map cleanly onto picking a novel the way it maps onto guilt or innocence, but nobody on the commitee, myself included, can say exactly why, and I don't want to walk into next month's vote armed with nothing but a bad feeling.

  Could you draft the memo I'd circulate to the board before that meeting? I'd like it to lay out plainly what the theorem actually requires in order to do the work he wants it to do -- the competence and independence assumptions, and what happens to the result if either one is shaky -- and be honest about where the analogy to book-judging holds up and where it strains, especially once you're choosing among a whole shelf of books rather than a guilty/not-guilty binary. It should still take the real intuition behind his proposal seriously -- that more independent eyes should cancel out any one judge's blind spots -- rather than just dismissing it as math borrowed from the wrong context. End with an actual recommendation -- keep the panel at three, go big, some hybrid -- plus roughly how the voting would need to be structured so we're not just recreating the same problem with extra steps and a bigger spreadsheet.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Sender:** A working novelist serving on the governing board of a smallish literary prize.
      *   **Recipient:** The board of the literary prize.
      *   **Context:** Annual debate about judging structure. Current: 3 judges, deliberative. Proposed: 15-20 "community readers," independent voting (Condorcet Jury Theorem argument).
      *   **Opponent:** New board member (ex-quant, thriller writer) citing Condorcet Jury Theorem (CJT).
      *   **Goal:** Draft a memo explaining *why* CJT might not apply cleanly to literary judging, without dismissing the intuition behind it. Needs to cover competence/independence assumptions, the binary vs. multi-option problem, and end with a concrete recommendation.
      *   **Tone:** Professional, respectful, analytically rigorous but accessible, collaborative (not combative).

  2.  **Deconstruct the Condorcet Jury Theorem (CJT):**
      *   *What is it?* A theorem stating that if each voter has a probability $p > 0.5$ of being correct, and votes are independent, the probability of the majority vote being correct approaches 1 as the number of voters increases.
      *   *Key Assumptions:*
          1.  **Binary Choice:** Guilty/Not Guilty, True/False. (Literary prizes have many entries).
          2.  **Competence ($p > 0.5$):** Each voter must be better than random chance at identifying the "correct" answer.
          3.  **Independence:** Voters must not influence each other (no deliberation, no herd mentality).
          4.  **Sincere Voting:** Voters vote for what they believe is correct, not strategically.
          5.  **Existence of a "Correct" Answer:** There is an objective truth to be found.

  3.  **Analyze the Application to Literary Prizes:**
      *   *Binary vs. Multi-option:* CJT works best for binary. Choosing 1 winner out of 20 books is different. (Can be mitigated by pairwise comparisons or scoring, but complicates the "correctness" metric).
      *   *Competence:* Is a random community reader $>50\%$ likely to pick the "best" book? What defines "best"? In law, there's (theoretically) a factual truth. In art, quality is subjective. If "best" is undefined, $p$ is undefined.
      *   *Independence:* Easy to achieve with blind voting, but do readers influence each other via blurbs, reputations, etc.?
      *   *The "Correct" Answer:* This is the biggest strain. There is no objective "best novel." The prize *creates* value rather than *discovering* it.

  4.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the colleague's contribution (validate the quant/thriller writer). State the purpose: clarify the math to inform the decision.
      *   **The Theorem (Simplified):** Explain CJT clearly. Focus on the three pillars: Binary, Competence, Independence.
      *   **The Strain Points (The "Why it's tricky" part):**
          *   *Objective Truth:* Law has facts; Art has taste. CJT finds truth; Prizes curate taste.
          *   *Competence:* Are 20 random readers more competent than 3 experts? Or just noisier?
          *   *Binary vs. Field:* 2 options vs. 20 options changes the math significantly.
      *   **The Valid Intuition:** Acknowledge that diversity of taste *is* good. Deliberation *can* lead to groupthink. The quant is right about independence being valuable.
      *   **Recommendation:** Need a hybrid. 3 judges is too small for pure CJT benefits if competence varies. 20 random readers might lack the "competence" threshold.
          *   *Idea:* A larger jury (e.g., 7-9) but still curated for competence, voting via ranked choice or scoring to handle the multi-option problem, with limited deliberation to preserve independence until the end. Or, keep the 3 judges but change *how* they vote (ranked ballots before talking).
          *   *Better Idea for this context:* The prompt asks for a recommendation on panel size/structure. A pure "community reader" model risks the "competence" assumption ($p < 0.5$). If $p < 0.5$, CJT says adding more voters makes it *worse*. So, we need *competent* voters. But we need more than 3 to reduce variance.
          *   *Proposed Solution:* Expand the jury slightly (5-7) to gain statistical robustness without diluting expertise too much. Use a ranked-choice system (handles multi-option). Limit deliberation until after initial scoring (preserves independence).

  5.  **Refining the Tone:**
      *   Avoid saying "He is wrong." Say "The assumptions require scrutiny."
      *   Avoid saying "Art is subjective" as a dismissal. Say "The definition of 'correct' is the variable."
      *   Ensure the novelist voice comes through (caring about the art) but also the board member voice (caring about governance).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I explain the $p < 0.5$ risk? Yes, crucial. If voters are worse than random, more voters = confidently wrong.
      *   *Check:* Did I address the binary issue? Yes, moving from binary to multi-candidate reduces the probability of a majority winner.
      *   *Check:* Is the recommendation actionable? Yes, specific numbers and voting method.
      *   *Check:* Is it respectful to the ex-quant? Yes, acknowledge the rigor of his thinking.

  7.  **Final Polish:** Check formatting, ensure clear headings, make sure the "ask" is clear. (Proceed to generate output).

  *(Self-Correction Note on the Recommendation)*: If I recommend 5-7 judges, is that enough to satisfy the "more eyes" intuition without triggering the "low competence" risk? Yes. It's a middle ground. I should also emphasize *how* they vote (ranked choice) because CJT assumes simple majority, which fails with >2 options. Actually, a scoring system (Borda count style) might be better for art. Let's suggest a hybrid: Expanded jury of *qualified* readers (not random community), ranked voting, delayed deliberation.

  8.  **Finalizing the Memo Structure:**
      *   To/From/Subject.
      *   Introduction (Validating the proposal).
      *   The Math (CJT basics).
      *   The Mismatch (Truth vs. Taste, Binary vs. Field, Competence threshold).
      *   The Value (What we keep from the proposal).
      *   Recommendation (Hybrid model).

  9.  **Drafting the Content:** (Mental check of the $p < 0.5$ implication). If the average voter is less than 50% likely to pick the "best" book, adding voters converges on the *wrong* book. This is the killer argument against random community readers. I must highlight this.

  10. **Final Review against constraints:**
      *   Lay out competence/independence assumptions? Yes.
      *   What happens if shaky? Yes (convergence on error).
      *   Binary vs. Shelf of books? Yes.
      *   Take intuition seriously? Yes.
      *   End with recommendation? Yes.

  (Ready to write.)
answer: |-
  **MEMORANDUM**

  **TO:** The Governing Board, [Name of Literary Prize]
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Judging Structure and the Condorcet Jury Theorem

  **Introduction**

  At our last meeting, [Board Member Name] proposed a significant shift in our judging structure, arguing that we should replace our current three-judge panel with a larger body of 15–20 community readers. His argument relies on the Condorcet Jury Theorem (CJT), a mathematical principle suggesting that large, independent groups make more accurate decisions than small ones.

  This is a compelling argument. As a novelist, I value the rigor [Board Member Name] brings to our governance. The intuition that more independent eyes cancel out individual blind spots is sound. However, before we vote on restructuring the prize, we need to examine whether the mathematical conditions required for the Condorcet Jury Theorem to hold true actually exist in the context of literary judging.

  This memo outlines where the theorem applies, where it strains against the reality of art, and offers a recommendation that captures the statistical benefits of his proposal without compromising the integrity of the prize.

  **1. What the Theorem Actually Requires**

  The Condorcet Jury Theorem is not a general rule that "crowds are wise." It is a specific mathematical claim that depends on three strict assumptions. If any one of these fails, the theorem's guarantee collapses.

  *   **Assumption A: There is a "Correct" Answer.**
      CJT was designed for binary factual determinations (e.g., Guilty/Not Guilty, True/False). It assumes there is an objective truth to be discovered.
      *   *The Strain:* In literature, there is no objective "best book." A prize does not discover value like a scientist discovers a particle; it *creates* value through curation. If there is no objective truth, the theorem has no target to converge upon.
  *   **Assumption B: Voter Competence ($p > 0.5$).**
      This is the most critical variable. For the math to work, each individual voter must have a probability ($p$) of greater than 50% of identifying the "correct" choice. If the average voter is better than random chance, adding more voters drives the probability of a correct majority toward 100%.
      *   *The Risk:* If the average voter's competence is *below* 50% (i.e., they are more likely to miss the best book than pick it), the theorem proves the opposite of what we want: adding more voters drives the probability of a correct decision toward **zero**. A large group of less-competent voters will not converge on excellence; they will confidently converge on error.
  *   **Assumption C: Independence.**
      Voters must decide independently. Deliberation, herd mentality, or influence from reputations introduces correlation, which degrades the statistical benefit of adding more voters.
      *   *The Strain:* Our current three-judge model relies on deliberation. While this violates strict independence, it allows judges to correct each other's factual errors (e.g., "I missed that this plot hole is resolved on page 200").

  **2. The Problem of the "Shelf" vs. The Binary**

  CJT works cleanly with two options. Our prize involves choosing one winner from a longlist that may contain 20 to 50 titles.

  When you move from a binary choice to a multi-candidate field, the likelihood of a clear majority winner drops precipitously. With 20 books, even a highly competent jury might split their votes across five different favorites. In a simple majority vote, this leads to noise rather than signal. To make a larger jury work in a multi-option field, we cannot use a simple up/down vote; we would need a ranked-choice or scoring system to capture nuance.

  **3. Where the Intuition Holds Up**

  Despite these mathematical friction points, [Board Member Name]'s core intuition is correct: **Three judges is a small sample size.**

  With only three judges, the outcome is heavily dependent on the specific taste profile of that trio. If all three happen to prefer minimalist prose in a year strong on maximalism, the "best" book (by broader standards) loses. Increasing the number of voters *does* reduce variance, provided those voters possess a baseline of literary competence. The goal should be to reduce the "lottery" aspect of who happens to be on the panel without diluting the expertise required to meet the competence threshold.

  **4. Recommendation**

  I propose we reject the binary choice of "Three Experts" vs. "Twenty Community Readers" and adopt a hybrid model that satisfies the statistical need for sample size while protecting the competence assumption.

  **A. Expand the Jury to Seven (7) Members**
  Seven is a "Goldilocks" number. It is large enough to dilute the idiosyncrasies of any single judge (reducing variance), but small enough that we can rigorously vet each member for the literary competence required to keep $p > 0.5$. Fifteen to twenty community readers risks dipping below that competence threshold, which, as noted above, would mathematically guarantee a worse outcome.

  **B. Implement Ranked-Choice Voting (The Borda Count)**
  To address the "Shelf vs. Binary" problem, judges should not vote for a single winner. They should submit a ranked list of their top five books prior to any discussion. This captures more data than a single choice and prevents vote-splitting among similar titles.

  **C. "Blind" Scoring Before Deliberation**
  To honor the independence assumption, judges should submit their rankings independently before the first meeting. We then aggregate the scores.
  *   If a clear winner emerges mathematically, deliberation is used only to confirm there are no disqualifying factors (e.g., plagiarism).
  *   If the top two books are statistically tied, deliberation is then opened *only* for those specific titles. This preserves independence for the majority of the process while allowing for the corrective benefit of discussion where it is actually needed.

  **Conclusion**

  Mathematics can tell us how to count votes, but it cannot define literary merit. By expanding to seven qualified judges and using ranked voting, we gain the statistical robustness [Board Member Name] seeks without risking the "competence collapse" of a larger, less-vetted body. This ensures our prize remains a mark of curatorial excellence, not just a popularity contest.

  I look forward to discussing this framework at next month's meeting.
