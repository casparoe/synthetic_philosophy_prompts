          *   Clause 4 (Neither): Emptiness of emptiness. Even the "Two Truths" framework isn't an ultimate metaphysical reality.
          *   *Logic:* This isn't $A \land \neg A$ in the *same sense*. It's $A_{conv} \land \neg A_{ult}$. This preserves LNC.
      *   *Address the Ch. 18 vs. Ch. 25 Inconsistency:*
