answer: |-
  # The Vanishing Saint: Why Maximizing Consequentialism Cannot Save Supererogation

  The periodic re-litigation of Peter Singer's drowning-child argument on the EA Forum and LessWrong often stalls at a familiar impasse. One side argues that the implication of the argument is too demanding to be plausible; the other insists that our intuitions about "demandingness" are merely biases protecting our privilege. The debate typically centers on *where* to draw the line between duty and supererogation. How much income must be donated? At what point does self-sacrifice become optional?

  You have identified the structural flaw in this framing: for a strict Maximizing Act Consequentialist (MAC), there is no line to draw. If the right act is defined as the one that produces the best overall consequences, then the best act is, by definition, obligatory. Anything less is suboptimal, and therefore wrong. In this framework, the soldier who smothers the grenade to save his squad is not a hero going beyond the call of duty; he is simply a man doing what he ought to have done. The doctor who stays in the plague city is not a saint; she is merely compliant.

  This essay addresses your core question: Can maximizing act consequentialism coherently accommodate a genuine, non-illusory category of supererogatory action? Or does preserving the concept of supererogation require abandoning maximization?

  To answer this, we must test the available escape routes. We will examine the eliminationist view (Kagan), the satisficing amendment (Slote), the agent-centered prerogative (Scheffler), and the dual-ranking account (Portmore). The verdict will be decisive: **Strict Maximizing Act Consequentialism is logically incompatible with genuine supererogation.** To save the phenomenon of the "supererogatory," one must cease to be a strict maximizing consequentialist.

  ### 1. The Hard-Nosed Elimination: Kagan's Bullet
  The most philosophically honest position is the one Shelly Kagan articulates in *The Limits of Morality*. Kagan argues that our confidence in a robust category of supererogation is not evidence against maximizing views, but evidence that ordinary morality is mistaken.

  On this view, the concept of supererogation is a psychological coping mechanism, not a moral reality. We label the grenade-jumper a "hero" because we know we wouldn't do it, and we label his action "optional" to excuse our own cowardice. But if morality is about minimizing suffering and maximizing well-being, and the grenade-jump minimizes suffering, then the jump is obligatory.

  **Does this work?**
  Logically, yes. It preserves the integrity of MAC perfectly.
  Normatively, it fails to accommodate the phenomenon you are asking about. If the goal is to *save* supererogation (to make sense of the intuition that some good acts are praiseworthy precisely because they are not required), Kagan's move is a surrender. It dissolves the category rather than accommodating it. For the purpose of your inquiry, this is a failure condition: it saves the theory by killing the phenomenon.

  ### 2. The Satisficing Retreat: Slote's Threshold
  Michael Slote proposes a modification: consequentialism need not maximize. It need only *satisfice*. An act is right if it produces "good enough" consequences, even if a better alternative was available. This creates a logical gap between the *best* act and the *required* act. The soldier jumping on the grenade produces the *best* outcome, but staying back (if it saves enough lives to cross the threshold) is permissible. Thus, jumping becomes supererogatory.

  **Does this work?**
  No. Satisficing consequentialism suffers from the "arbitrary threshold" problem.
  If I can produce significantly more good at no additional cost to myself, why is it permissible to stop at "good enough"? If the moral goal is promoting the good, setting a ceiling seems irrational. As many critics have noted, satisficing looks like a patch designed solely to yield pre-theoretic intuitions rather than a principled moral theory. It violates the plausible principle: *If you can prevent something bad without sacrificing anything of moral significance, you ought to do it.*

  Furthermore, satisficing creates a "moral slack" that seems dangerous. If "good enough" is permissible, then an agent could consistently choose the second-best option forever, knowingly allowing preventable suffering, without moral reproach. This does not preserve supererogation as a category of *heroism*; it preserves it as a category of *negligence*. It saves the logical space for supererogation but empties it of moral urgency.

  ### 3. The Agent-Centered Prerogative: Scheffler's Hybrid
  Samuel Scheffler, in *The Rejection of Consequentialism*, offers a more sophisticated structural change. He argues that agents are permitted to give disproportionate weight to their own interests and projects. This creates an "agent-centered prerogative."

  Under this view, the soldier is not required to jump on the grenade because he is permitted to weight his own survival more heavily than the impartial calculus dictates. However, he is *allowed* to ignore this prerogative and sacrifice himself. When he does, he produces the impartially best outcome, but he was not required to do so because the prerogative made the self-preserving act permissible.

  **Does this work?**
  This is a stronger candidate, but it comes at a steep price: it is no longer pure consequentialism.
  Consequentialism is traditionally defined by its impartiality; the agent is just one locus of value among many. Scheffler explicitly builds agent-relative weight into the structure of rightness. While this successfully carves out room for supererogation (the saint is one who overrides the prerogative), it does so by conceding that the "maximization of the good" is not the sole determinant of obligation.

  For the EA/LessWrong rationalist, this might be an acceptable trade-off, but strictly speaking, it abandons the MAC framework. It admits that maximizing the good is not always obligatory. It saves supererogation by denying the premise that the "best available act" is always the "duty."

  ### 4. The Dual-Ranking Solution: Portmore's Synthesis
  Douglas Portmore attempts to have his cake and eat it too in *Commonsense Consequentialism*. He proposes a "dual-ranking" account. He distinguishes between:
  1.  **Morally best:** The act with the best impartial consequences.
  2.  **Rationally best:** The act supported by the most conclusive reasons (which may include agent-relative reasons).

  Portmore argues that an act is obligatory only if it is both morally best and rationally required. An act is supererogatory if it is morally best (impartially) but not rationally required (because the agent has sufficient self-interested reasons to do otherwise).

  **Does this work?**
  This is the most technically robust attempt to reconcile the two. It preserves the consequentialist ranking of outcomes while acknowledging the complexity of practical reason. It explains why we praise the plague doctor (she did the morally best act) without condemning those who flee (they acted within their rational prerogative).

  However, this solution relies on a specific meta-ethical claim: that moral reasons do not always override non-moral reasons. It requires a theory of reasons where "I want to live" can outweigh "I can save five lives" in terms of rational requirement, even if the latter is morally superior. While coherent, it effectively redefines "obligation" to mean "rationally required" rather than "morally optimal." It saves supererogation by bifurcating the concept of "ought."

  ### The Verdict

  You asked for a real verdict on whether supererogation survives within maximizing act consequentialism.

  **The verdict is No.**

  Strict Maximizing Act Consequentialism cannot coherently accommodate a genuine category of supererogatory action. The definition of MAC entails that the optimal act is obligatory. To introduce supererogation is to introduce a contradiction: *X is the best act, X is not required.*

  If you wish to preserve the concept of supererogation—the intuition that the grenade-jumper is praiseworthy specifically because he was not *bound* to jump—you must modify the theory. You have three viable paths, all of which involve abandoning strict MAC:

  1.  **Abandon Maximization (Slote):** Accept that "good enough" is duty. This saves supererogation but renders the theory vulnerable to charges of arbitrariness and irrationality.
  2.  **Abandon Impartiality (Scheffler):** Accept that agents have a prerogative to favor themselves. This saves supererogation but admits that morality is not solely about maximizing the impersonal good.
  3.  **Abandon the Unity of "Ought" (Portmore):** Accept that an act can be morally best but not rationally required. This saves supererogation but requires a complex meta-ethics of reasons that separates moral optimality from obligation.

  **The Implication for Effective Altruism**
  The discomfort you feel regarding the Singer debates stems from a category error. The EA community largely operates on a Kaganite framework (maximization is duty) while using the rhetorical language of common-sense morality (supererogation, heroism, going above and beyond).

  When an EAs says, "You aren't *obligated* to give 50%, but it would be amazing if you did," they are speaking loosely. Strictly speaking, within their own normative framework, giving 50% is either obligatory (if it's the optimal use of funds) or wasteful (if it's not). There is no middle ground of "praiseworthy but optional."

  **Conclusion**
  Supererogation is a feature of *pluralistic* or *agent-relative* moral theories, not maximizing consequentialist ones. If you want to keep the saint and the hero as figures who transcend duty, you must accept that duty does not always demand the best. If you insist that duty always demands the best, you must accept that saints and heroes are merely people doing their jobs, and the rest of us are, to varying degrees, failing to do ours.

  There is no stable middle ground. The tension you sense is not a bug to be fixed by drawing a better line; it is a feature of the logical landscape. You must choose: either the maximization or the saint. You cannot have both.
