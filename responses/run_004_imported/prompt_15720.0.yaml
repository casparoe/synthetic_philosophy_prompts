prompt: |-
  Hey so I went down a rabbit hole this week because a coworker sent me the classic two-envelope paradox as a "fun" lunch problem — two envelopes, one has twice as much cash in it as the other, you pick one, and the question is whether you should switch to the other one. Every explanation I found online says the "you should always switch" argument is bogus because it secretly assumes a uniform probability distribution over every possible dollar amount from zero to infinity, and that distribution literally can't exist (it wouldn't integrate to 1), so the whole switching argument is built on a prior that isn't even a real thing. Fine, I bought that, case closed, or so I thought.

  Then I stumbled on an old paper by (I think?) David Chalmers, the consciousness guy, that says this "invalid prior" story isn't actually the full explanation. Apparently you CAN build a perfectly legit, fully normalized probability distribution over the smaller envelope's amount — one that genuinely sums to 1, no funny business — and still end up somewhere where, no matter what dollar figure you actually find when you open your envelope, the expected-value math honestly says you should switch. That seems like it shouldn't be possible if "the prior is invalid" was the real diagnosis, so now I'm confused all over again and it's bugging me.

  Could you actually argue this out for me rather then just asserting it: make the case that this weirder "always switch no matter what you see" version of the puzzle can only ever happen if that perfectly legit prior secretly has an infinite expected value baked into it somewhere, so its really just the St. Petersburg paradox wearing an envelope costume, and not some new crack in Bayesian reasoning itself. I don't have a stats or philosophy background (backend dev, mostly Python/Go), so please actually walk through the reasoning properly, ideally with a concrete toy example of a distribution that has this property, rather than just gesturing at the conclusion — that's the part that would actually convince me.
