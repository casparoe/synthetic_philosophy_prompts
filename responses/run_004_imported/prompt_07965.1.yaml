answer: |-
  Good evening, everyone. For those who don't know me, I'm the philosophy student in the family. Which means I'm professionally qualified to overthink simple things, like why we're here tonight.

  Looking around the room, I see a perfect split. On one side, my family, who just want cake and love. On the other, half the PhD program from the Economics department, who I know treat rational choice theory as gospel. And this split actually explains the question I've heard all year from my aunts and uncles: "What finally tipped the scales?"

  They assume love is a weighing game. They think [Sister] had two options, put them on a balance, and found that [Groom] was objectively heavier—better, smarter, more optimal. And for my economist friends, that satisfies the model. If you choose A over B, A must have had higher utility.

  But [Sister] knows something that challenges that model. She knows that some choices are hard not because we're confused, but because the options are just different kinds of good. Like choosing between a career in law or a career in art. Neither is better. Neither is equal. They're just different.

  If the scales were already tipped before she chose, it wouldn't be a choice; it would be a calculation. And you don't need courage to do math.

  The truth is, the scales weren't tipped until she stepped on them.

  In the hardest choices, reason doesn't tell you what to do. Instead, your choice creates the reason. [Sister] didn't find [Groom] to be the "right" answer waiting in the world. She chose him, and by committing herself to him, she *made* him the right partner. She put her weight behind him, and that act of will is what tipped the scales.

  And that is actually the most romantic thing I can imagine. It means she isn't here because she got lucky and found the perfect match. She is here because she decided to stand by him.

  And that's what marriage is. It's not living happily ever after because the math worked out. It's the daily practice of continuing to put your weight on the same side of the scale. It's waking up every day and choosing to make each other the right choice, again and again.

  So, to [Sister] and [Groom]: May you never stop choosing each other, and in doing so, may you always make each other right.

  Cheers.
