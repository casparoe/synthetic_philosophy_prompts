prompt: |-
  I host a philosophy podcast, and next week's guest defends Ifeanyi Menkiti's "radical communitarian" view that personhood is not conferred at birth but achieved in degrees through ethical participation in community life, and is prepared to defend that position against Kwame Gyekye's moderate-communitarian objections. Draft eight to ten interview questions that go beyond having the guest restate "I am because we are." Include at least one question on whether the degrees-of-personhood thesis can avoid implying diminished moral status for infants, the severely cognitively impaired, or those excluded from communal rites of passage; one on whether the claim that "the community defines the person" should be read as a metaphysical thesis about what constitutes a self or only as a normative thesis about ethical maturation; and one that puts Gyekye's worry squarely to the guest -- that a community-first view leaves unclear where an individual's standing to dissent from, or reform, oppressive communal norms could come from. For each of these three, add a follow-up question keyed to the answer the guest is most likely to give.
