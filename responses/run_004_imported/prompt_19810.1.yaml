answer: |-
  This is a fantastic question that cuts to the heart of why the philosophy of language remains distinct from empirical linguistics. The short answer is: **Studies like this *have* been done, extensively, and they generally fail to produce the sharp boundary your friend describes.**

  However, the deeper reason such a study couldn't settle the philosophical debate lies in a misunderstanding of what Timothy Williamson's epistemicism actually claims, and a category mistake regarding what empirical data can tell us about semantic boundaries.

  Here is a breakdown of why that study hasn't "solved" vagueness, and why your friend's argument (while intuitive) diverges from the actual philosophical position she convinced you to adopt.

  ### 1. The Empirical Literature Already Exists
  It is not an unfilled gap. Experimental philosophers and psycholinguists have been running "Sorites series" experiments for decades. They present subjects with a gradient (e.g., patches of color fading from red to orange, or people of increasing height) and ask them to apply the predicate ("Is this red?" "Is this tall?").

  **The results are consistent:**
  *   **No Sharp Cutoff:** You do not find a point where 100% of speakers say "No" and at the next millimeter 100% say "Yes."
  *   **The Penumbra:** Instead, you find a range where responses are probabilistic. At 5'11", maybe 40% say "tall"; at 6'0", 55% say "tall"; at 6'1", 70% say "tall."
  *   **Hysteresis:** If you start from "very tall" and go down, people stop calling someone "tall" at a different point than if you start from "very short" and go up. This suggests the boundary isn't a fixed property of the word, but depends on the trajectory of judgment.

  If your friend's hypothesis were correct—that "tall" has a fixed cutoff that better data would reveal—we would expect the variance to shrink as measurement precision increases. It doesn't. The variance remains, suggesting the fuzziness is in the linguistic practice itself, not just our measurement of it.

  ### 2. Your Friend's View vs. Williamson's View
  This is the crucial philosophical distinction. Your friend sold you on a version of epistemicism that **Williamson himself rejects.**

  *   **Your Friend's Claim:** The boundary exists and is *in principle knowable* if we just had enough data about usage.
  *   **Williamson's Claim:** The boundary exists but is *in principle unknowable.*

  Williamson argues that meaning is determined by usage, but usage is unstable near the boundary. He introduces **Margin for Error Principles**. To know that someone of height $h$ is tall, you must be in a position where you couldn't easily be wrong. But because the usage of "tall" shifts slightly depending on context, attention, and conversational stakes, you can never be in a position where you are safe from error right at the edge.

  For Williamson, the boundary is like a quantum state: it's there, but the act of trying to pinpoint it (via usage) destabilizes it. So, a study correlating height and usage wouldn't find the boundary; it would just map the zone of instability. Your friend is arguing for a "descriptivist sharpness," whereas Williamson argues for a "metaphysical sharpness" that is epistemically inaccessible.

  ### 3. The Is/Ought Gap (Usage vs. Truth)
  Even if you ran the perfect study and found that exactly at 182.5 cm, 51% of speakers say "tall" and 49% say "not tall," that does not establish a semantic boundary.

  *   **Descriptive:** "51% of speakers apply the word 'tall' to 182.5 cm."
  *   **Semantic:** "It is *true* that a person of 182.5 cm is tall."

  Epistemicism is a theory about **truth conditions**, not **assertibility conditions**. A statistical majority doesn't make a proposition true. If 51% of people believed the earth was flat, that wouldn't make it true. Similarly, if 51% of people apply "tall" to a specific height, that doesn't prove there is a sharp truth-boundary there; it might just prove that 51% of people are willing to assert it.

  To get from the data to epistemicism, you have to assume that **truth is determined by majority vote.** Most philosophers of language reject this. Meaning is normative; it governs how we *should* use words, not just how we *do*.

  ### 4. Context Sensitivity
  The word "tall" is context-sensitive.
  *   "Tall for a jockey"
  *   "Tall for a basketball player"
  *   "Tall for a 10-year-old"

  Even if you fix the context (e.g., "Tall for an adult American male"), the context is partly constituted by the speakers' interests. In a study, the context is "participating in a linguistics experiment." In the real world, the context is "dating," "hiring," or "medical assessment."

  The boundary for "tall" likely shifts depending on what hangs on the judgment. If a study finds a cutoff in a lab, it has only found the cutoff for "tall-in-a-lab-context." It hasn't found the cutoff for "tall" simpliciter, because that word doesn't have a context-invariant meaning. Epistemicism has to explain why the boundary moves with context without ceasing to be sharp *within* a context. Empirical data shows the boundary moves; it doesn't show it stays sharp.

  ### 5. Why the Study Can't Settle the Question
  The reason nobody has "solved" vagueness with a study is that vagueness is not an empirical problem; it is a **conceptual** one.

  The Sorites Paradox arises from three premises that seem individually plausible but are jointly inconsistent:
  1.  Premise 1: A 7-foot man is tall.
  2.  Premise 2: A 4-foot man is not tall.
  3.  Premise 3: If a man of height $h$ is tall, a man of height $h - 1mm$ is also tall.

  Empirical studies tell us that people reject Premise 3 eventually (they stop saying "tall"). But they don't tell us *where* or *why*.
  *   **Supervaluationists** say: There is no fact of the matter (Premise 3 is neither true nor false in the grey area).
  *   **Epistemicists** say: Premise 3 is false, there is a cutoff, but we can't know it.
  *   **Degree Theorists** say: Truth comes in degrees (Premise 3 is less than 100% true).

  A study can tell you *that* people stop saying "tall." It cannot tell you whether that stoppage represents a **sharp truth boundary** (Epistemicism), a **gap in truth value** (Supervaluationism), or a **slide in truth degree** (Fuzzy Logic). Interpreting the data requires the very philosophical framework you are trying to test.

  ### Summary
  Your friend's argument is compelling because it treats language like physics: there is a fact of the matter, and better instruments (studies) will find it. But language is not a physical constant; it is a social practice.

  1.  **Empirically:** Studies show a gradient, not a line.
  2.  **Philosophically:** Williamson argues the line is *unknowable*, not just currently unknown.
  3.  **Conceptually:** Usage statistics (is) do not equal semantic truth conditions (ought).

  You were talked into a version of epistemicism that is more optimistic than the one Williamson defends. The "gap" isn't in the literature; it's in the nature of meaning itself. The study wouldn't settle the question because the data is compatible with multiple theories of truth, and the choice between them remains philosophical.
