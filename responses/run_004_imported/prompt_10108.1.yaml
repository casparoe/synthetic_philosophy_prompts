      2. The Elephant: Her reputation.
      3. The Hard Truth: Causa sui.
      4. The Pivot: What remains when UR is gone? (The work, the struggle, the emergence).
      5. To the Parents: You are part of the cause.
      6. To the Graduates: The future is new causes.
      7. The Joke.
      8. Conclusion.

