answer: |-
  Thank you. Please, remain seated. We are philosophers; we know the value of conserving energy for the questions.

  For thirty years, I have stood in front of rooms much like this one and argued for a position that is often described as grim. I have defended Galen Strawson's Basic Argument. In print, in lectures, and at far too many dinner parties, I have maintained that because no one is *causa sui*—because no one is the self-caused source of their own nature—no one is ultimately responsible for what they do. You did not choose your genes. You did not choose your parents. You did not choose the neurochemistry that makes focus easy or difficult, or the historical accident that makes a philosophy degree valuable rather than obsolete.

  My colleagues in the third row know the text. They are listening for a slip. They are waiting for me to betray the argument for the sake of sentiment. They expect me to tell you that you "earned" this degree in the deep, buck-stops-here sense. They expect me to say that you are the sole authors of your success.

  I will not say that. To do so would be a lie, and this department deserves better of me in my final semester.

  But neither will I tell you that this day is an illusion. To do so would be a different kind of lie, and you deserve better than that.

  The Basic Argument denies *ultimate* responsibility. It denies that you are a prime mover, uncaused and self-made. It does not deny that work was done. It does not deny that struggles were endured. It does not deny that a specific, complex causal chain passed through each of you to produce the papers you wrote, the exams you passed, and the arguments you survived.

  When we look at a river carving a canyon, we do not say the water is "morally responsible" for the rock's erosion. The water follows gravity; the rock follows chemistry. And yet, the canyon is real. The shape of the land has changed. Something has happened that would not have happened otherwise.

  You are the canyon. This degree is the shape of the land.

  To the graduates: You are the locus where a vast history of causes has converged to produce a specific kind of excellence. You did not create the capacity for that excellence from nothing. But you *are* the place where it manifested. That is not a diminishment of your achievement; it is a widening of its context. You are not isolated atoms of will. You are the current expression of a long lineage of biology, culture, mentorship, and luck. To deny that is to deny the connections that make you human.

  And that brings me to the parents and families in the front rows.

  I know what you want to hear. You want to hear that your child is exceptional, and that you helped make them so. You want to feel pride.

  If "pride" means claiming ultimate credit for a soul you did not design, then no, you cannot have that. You did not write the code. You did not build the machine.

  But if "pride" is the joy of witnessing a flourishing that you nurtured, then you may have all of it. You were essential causes in this chain. You provided the stability, the pressure, the encouragement, and the love that allowed this specific potential to actualize. You did not create the spark, but you tended the fire. In a world without *causa sui*, there is no such thing as a self-made person. Everyone is other-made. You are the "other" that made this possible. That is not a small thing. That is the only thing that matters.

  I have spent three decades insisting that we cannot blame people in the ultimate sense. I have argued that retribution is irrational. But I have also insisted that this leaves our ordinary practices of praise and blame untouched. We still reward good work. We still celebrate graduations. Why? Because reinforcement shapes the future. Because celebration marks the significance of the event.

  We are here to mark a significance.

  There is a risk, of course. My colleagues are watching to ensure I remain consistent. The parents are watching to ensure I remain human. I aim to satisfy both by reminding you that consistency and humanity are not enemies.

  I will admit, there is one advantage to my position. I have spent thirty years arguing that no one is truly responsible for their actions. The only thing my argument proves definitively is that I am not responsible for the typos in my published papers.

  But in all seriousness: When you leave this hall, you will enter a world that demands you act *as if* you are free. You will make choices. You will face consequences. You will feel the weight of decisions. My argument does not remove that weight. It simply asks you to carry it with a little more humility, and a little more compassion.

  If you succeed, know that you were lucky to be the person who could. If you struggle, know that you are not broken, only causally complex.

  Do not look for the "self" that stands behind your eyes, pulling the levers. Look instead at the levers themselves. Look at the tools you have been given in this department. Logic. Clarity. Rigor. Empathy. These are real. The work you did with them is real.

  So, I congratulate you. Not because you created yourself, but because you have arrived. I honor you. Not because you deserve it in the eyes of the universe, but because you have earned it in the eyes of this community.

  Go forward. Be good causes. Create good effects. And when you look back on this morning, feel the warmth of it. You don't need to be the uncaused cause to feel the sun.

  Thank you.
