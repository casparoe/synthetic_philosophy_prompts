          *   *The Consequentialist:* Disputes the verdict. Uses the "closeness problem" (intention/foresight distinction is shaky) and the "numbers game" (lives saved outweigh costs).
      *   **Context:** Anscombe's 1956 protest against Oxford awarding Truman an honorary degree ("Mr Truman's Degree").
      *   **Key Arguments to Include:**
