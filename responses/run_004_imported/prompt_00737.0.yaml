          *   Consequentialist: "Closeness problem" (redescribing intention); Utilitarian calculus (ending war quickly saved more lives).
      *   **Requirement:** Direct engagement (no talking past each other), strong counter-arguments from both sides.

  2.  **Character Voices & Tone:**
      *   *The Anscombean (let's call her Elena):* Rigorous, principled, focused on moral absolutes and the nature of action. Slightly academic but passionate about justice. Echoes Anscombe's sharp wit and moral clarity.
      *   *The Consequentialist (let's call him Marcus):* Pragmatic, focused on outcomes, skeptical of rigid rules that lead to disaster. Calm, calculating, but not cold-hearted (cares about saving lives).

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Maybe a modern-day reflection on the 1956 event, or a hypothetical debate. Let's make it a contemporary philosophical colloquium or a private discussion to allow for depth. Let's go with a quiet office discussion after a lecture on Just War Theory.

      *   **Opening Salvo (Anscombean):** State the thesis. Truman is a murderer. Why? Because he chose to kill innocents as a *means*.
      *   **Consequentialist Rebuttal 1 (The Closeness Problem):** Challenge the definition of "intention." Did he *mean* to kill them, or did he mean to destroy infrastructure/morale, with death as a side effect? This is the "closeness" objection (associated with Thomson/Quinn later, but applicable here).
      *   **Anscombean Response 1:** Distinguish between *oblique* intention and *direct* intention. The bombing wasn't a precision strike on a factory with workers nearby; the city *was* the target. The terror *was* the mechanism.
      *   **Consequentialist Rebuttal 2 (The Numbers):** Even if it's bad, look at the alternative. Operation Downfall. Millions dead. The math justifies the act.
      *   **Anscombean Response 2:** Reject the calculus. You cannot do evil that good may come. Corrupts the moral agent. The "innocent shield" analogy.
      *   **Consequentialist Rebuttal 3 (Refining the Closeness/Description):** If we describe the act as "forcing surrender," the deaths are foreseen, not intended.
      *   **Anscombean Response 3 (The "Why" Test):** Why drop the bomb? If the Japanese surrendered but no one died, would the mission be a failure? If yes, the death was intended.
      *   **Conclusion:** Acknowledge the impasse but highlight the stakes. The nature of moral reasoning itself.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I explain the "Closeness Problem" clearly? *Adjustment:* Marcus needs to explain that intention is opaque and dependent on description.
      *   *Check:* Did Elena use DDE correctly? *Adjustment:* She needs to show why DDE *fails* to justify Truman, not just assert it. DDE requires the bad effect not to be the means to the good effect.
      *   *Check:* Is the historical context accurate? *Adjustment:* Mention Oxford, 1956, the pamphlet.
      *   *Check:* Are they listening? *Adjustment:* Ensure Marcus acknowledges Elena's point about the *means* before pivoting to numbers, and Elena acknowledges the horror of the alternative before rejecting the calculation.

  5.  **Drafting the Dialogue (Iterative Process):**

      *   *Start:* Elena holding the pamphlet. Marcus pouring tea.
