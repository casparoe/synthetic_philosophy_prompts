      *   **The Straight vs. Skeptical Distinction (The Core Move):**
          *   *Straight:* Tries to defeat the skeptic by finding truth-conditions. (e.g., "Here is the fact that makes 'plus' mean plus.")
          *   *Skeptical:* Accepts the skeptic's conclusion (no truth-conditions) but argues language still works. Shifts from *truth-conditions* to *assertibility-conditions*.
          *   *Key Insight:* It's not that the community *makes it true*; it's that the community determines when you are *allowed to say* you followed the rule. It's about justification, not truth.
      *   **Addressing Dana's Objection (The Relocation Problem):**
          *   Dana thinks Kripke is offering a *truth-maker* (Community Dispositions). If so, she is right.
          *   But Kripke is *not* offering a truth-maker. He is offering a *practice*.
          *   The normativity doesn't come from the community being "correct" in a God's-eye view. It comes from the utility of the practice.
