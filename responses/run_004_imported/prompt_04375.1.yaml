      *   **Provide a Counter-Example (When Overall is King):**
          *   The "Kidney Stone" example (classic Simpson's).
          *   Or a simpler one: Hiring rates where the subgroup is a *result* of the process, not a pre-existing condition.
      *   **Conclusion/Advice:** Report both. Context matters.

  8.  **Refine the Tone:**
      *   Keep it accessible (AP Stats level).
