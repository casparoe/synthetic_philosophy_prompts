          *   **The "Real" Question:** Sometimes the overall average *is* the metric that matters. (e.g., Total budget spent, overall pass rate for a certification).
          *   **Data Dredging/P-hacking:** If you slice data enough ways, you'll find *some* subgroup that supports your bias.
          *   **Causal vs. Descriptive:** Sometimes the aggregate *is* the causal reality (e.g., if the grouping variable is a *mediator* rather than a *confounder*).

  4.  **Evaluate the Teacher's Takeaway ("Always look at subgroups"):**
      *   *Is this good advice?* Generally, yes, for exploratory analysis.
