  2.  **Deconstruct Simpson's Paradox:**
      *   *What is it?* A trend appears in different groups of data but disappears or reverses when these groups are combined.
      *   *Why does it happen?* Confounding variables (lurking variables) and unequal group sizes. In the Berkeley case, women applied to harder departments, men to easier ones.
      *   *The "Lesson":* Aggregated data can hide important structural differences.

  3.  **Evaluate the Friend's Claim ("Subgroups are *always* better"):**
