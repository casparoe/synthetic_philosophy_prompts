      *   **Direct Answer:** The friend is wrong to say "always." The teacher's advice is a rule of thumb, not a law.
      *   **Explain Why Subgroups Can Be Misleading:**
          *   Small sample sizes (noise).
          *   Over-segmentation (finding patterns in randomness).
