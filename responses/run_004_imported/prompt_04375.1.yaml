          *   Example: School choice. If School A selects only rich kids, the *overall* score reflects the school's selectivity, which might be the metric parents care about (even if School B adds more value to poor kids).
      *   **Case 2: Small Sample Sizes.**
          *   Splitting $N=50$ into 10 subgroups means $n=5$ per group. High uncertainty.
      *   **Case 3: The "Real World" Impact is Aggregate.**
          *   Example: A hospital's overall survival rate matters to a patient walking in the door who doesn't know their specific risk profile yet.

  7.  **Structure the Response:**
