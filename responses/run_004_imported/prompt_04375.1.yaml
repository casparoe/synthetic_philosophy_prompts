prompt: |-
  So we just finished a unit on Simpson's paradox in my AP Stats class, and the example my teacher used was that UC Berkeley grad school admissions thing from the 70s — where overall it looked like men got admitted at a way higher rate than women, but when you broke it down department by department, women were actually doing just as well or even better in most of them. Her big takeaway for us was basically "this is exactly why you can't trust an overall/combined percentage, you always gotta look at the subgroups to find the real truth."

  That kicked off an argument with my friend after class bc I'm doing a science fair project comparing test scores between two schools across different income brackets, and I wasnt sure if I should even bother calculating an overall average anymore, or if thats just pointless/misleading info now that I know about this paradox. She's convinced Simpsons paradox basically proves subgroup breakdowns are always more accurate than the combined number, full stop, and that any statistic reported without a subgroup breakdown should basically be ignored. is she right, or is there more nuance to it? like is it ever actually possible that the OVERALL combined number is the trustworthy one and splitting things into subgroups is what leads you astray?
