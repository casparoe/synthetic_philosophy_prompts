answer: |-
  **The Hollow Sum: Adjudicating the Normative Force of Harsanyi's Aggregation Theorem**

  The dispute between you and your friend centers on one of the most famous results in social choice theory: John Harsanyi's Aggregation Theorem. Your friend contends that the theorem provides a decisive, rationality-based proof of utilitarianism. You argue that it fails to justify equal treatment of persons and ignores legitimate concerns regarding *ex post* fairness. To adjudicate this, we must distinguish between the mathematical structure the theorem establishes and the ethical content required to make that structure normative.

  The verdict is this: **Harsanyi's Aggregation Theorem does not prove utilitarianism; it merely proves that *if* one accepts specific, contentious ethical premises regarding interpersonal comparison and the priority of *ex ante* efficiency, *then* social welfare must take a utilitarian form.** Your friend is correct that the theorem rules out many non-utilitarian social welfare functions, but you are correct that it fails to secure the core egalitarian and fairness commitments of classical utilitarianism without smuggling in independent ethical assumptions. The theorem is a powerful conditional constraint, not a foundational proof.

  ### The Friend's Claim: The Power of Linearity

  Your friend's enthusiasm is not misplaced. Harsanyi's theorem is a formidable result. It posits that if individual preferences and social preferences both satisfy the von Neumann–Morgenstern (VNM) axioms of rationality (completeness, transitivity, continuity, and independence) over the same set of lotteries, and if society respects the Weak Pareto Principle (if everyone prefers $A$ to $B$, society prefers $A$ to $B$), then the social welfare function ($W$) must be a linear combination of individual utility functions ($U_i$).

  Mathematically, $W = \sum a_i U_i + b$.

  This is significant because it appears to derive a utilitarian structure from thin concepts of rationality and efficiency. It rules out Rawlsian maximin rules (which are non-linear and violate the independence axiom) and prioritarian views (which apply concave transformations to utilities before summing). If one accepts the VNM axioms as requirements of rationality, Harsanyi shows that any social ordering that respects individual preferences must look like a weighted sum. In this narrow sense, the theorem demonstrates that utilitarianism is the *only* coherent way to aggregate VNM-rational preferences under Pareto constraints.

  ### Objection I: The Indeterminacy of Weights and Scales

  However, your first objection strikes at the heart of the claim that this constitutes a proof of *utilitarianism* in the moral sense. Classical utilitarianism demands that "each counts for one and none for more than one." Harsanyi's theorem yields $W = \sum a_i U_i$, where the weights $a_i$ are non-negative constants. The theorem itself places no restriction on these weights other than non-negativity.

  Mathematically, a dictatorship is consistent with Harsanyi's result: if $a_1 = 1$ and $a_i = 0$ for all $i > 1$, the social welfare function satisfies the VNM axioms and the Pareto principle (since the dictator's preferences determine the social preference, no one can prefer $B$ to $A$ if the dictator prefers $A$ to $B$ without violating the dictator's own consistency). To move from "weighted sum" to "equal weighted sum," one must introduce an axiom of **anonymity** or **impartiality**. This is an ethical assumption, not a requirement of rationality.

  Furthermore, there is the problem of interpersonal comparison. VNM utilities are unique only up to positive affine transformations (scale and origin). My utility of "10" and your utility of "10" are not inherently comparable. To sum them meaningfully, we must fix a common zero and a common unit. The Aggregation Theorem takes individual utility functions as given inputs; it does not explain how to calibrate them against one another. Harsanyi addressed this in a separate argument (the Impartial Observer Theorem), suggesting we imagine ourselves having an equal chance of being anyone in society. But that is a distinct argument requiring its own ethical justification. The Aggregation Theorem *alone* is silent on interpersonal comparability. Without an independent argument for equal weights and common scales, the theorem supports a generic welfarism, not the egalitarian utilitarianism your friend defends.

  ### Objection II: The Diamond Critique and Ex Post Fairness

  Your second objection concerns the reliance on the VNM axioms at the social level, specifically the conflict between *ex ante* Pareto efficiency and *ex post* fairness. This is best illustrated by Peter Diamond's famous critique.

  Consider a society with two individuals and one indivisible good (e.g., a kidney).
  *   **Option A:** Give the kidney to Person 1.
  *   **Option B:** Give the kidney to Person 2.
  *   **Option C:** Flip a fair coin to decide.

  Assume Person 1 and Person 2 are identical in need and both prefer having the kidney to not having it. Under *ex ante* evaluation (before the coin flip), Option C offers each person a 50% expected utility. If we assume the individuals are indifferent between a guaranteed loss and a 50% chance of gain (normalized appropriately), the *ex ante* expected utility for society in Option C might equal the average of A and B.

  Harsanyi's theorem, relying on the VNM independence axiom applied to society, implies that if society is indifferent between A and B, it must be indifferent between A and the lottery C. However, intuitively, many argue society *should* prefer C. Why? because C treats the individuals fairly *ex post* by giving them equal chances, whereas A and B arbitrarily favor one. This preference for the coin flip violates the independence axiom at the social level.

  By insisting that social preferences must satisfy VNM rationality, Harsanyi defines fairness exclusively as the satisfaction of *ex ante* preferences. This precludes any moral weight being placed on the distribution of outcomes or procedural fairness once the uncertainty is resolved. If one believes that fairness involves how burdens and benefits are actually distributed (not just their expected probabilities), one must reject the VNM axioms for social choice. Since the theorem's conclusion depends entirely on these axioms, the theorem offers no support for utilitarianism to those who value *ex post* equity. It essentially begs the question by defining rationality in a way that excludes non-utilitarian fairness concerns.

  ### The Verdict

  The dispute is resolved by recognizing that Harsanyi's Aggregation Theorem is a consistency check, not a moral foundation.

  Your friend is correct that the theorem is not trivial; it demonstrates that combining rationality and Pareto efficiency forces a linear structure. This is a significant constraint on moral theory. However, she is incorrect to call it a "decisive, purely rationality-based proof of utilitarianism." It proves no such thing. It proves that social welfare is a weighted sum *if* social rationality mirrors individual rationality. It does not prove the weights should be equal, it does not prove the scales are comparable, and it does not prove that *ex ante* efficiency trumps *ex post* fairness.

  You are correct that the theorem leaves the essential moral work undone. The move from "weighted sum" to "equal weighted sum" requires an independent ethical commitment to impartiality. The move from "respecting preferences over lotteries" to "ignoring fair chances" requires a rejection of *ex post* fairness principles that Diamond and others have shown to be coherent and morally attractive.

  **Therefore, the definite verdict is:** Harsanyi's Aggregation Theorem supports utilitarianism **only on the condition** that one independently accepts (1) that interpersonal utility comparisons are meaningful and should be weighted equally, and (2) that *ex ante* Pareto efficiency is morally lexically superior to *ex post* distributional fairness. Without these independent ethical assumptions, the theorem is normatively silent. It shows us what utilitarianism looks like mathematically, but it cannot tell us why we ought to be utilitarians. Your friend has mistaken a structural implication for a moral justification.
