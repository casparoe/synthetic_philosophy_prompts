      *   *Wait, actually:* The Capability Approach is specifically designed to solve the "interpersonal comparison of utility" deadlock. Sen criticizes both utilitarianism (utility is too malleable/adapted) and Rawls (primary goods are too rigid). It fits the "pandemic relief" context (health outcomes) perfectly. Let's suggest Sen's Capability Approach as the missing theoretical move.
      *   *Refinement:* Actually, looking at the flow, the most glaring omission is **Primary Goods** (Rawls). Owen is "Rawls-adjacent" but argued using Kaldor-Hicks critiques and Extended Sympathy. He didn't use Rawls' actual solution to interpersonal comparison: *Primary Goods* as an index. Nadia attacked utility; Owen defended sympathy. Neither mentioned that Rawls explicitly rejected utility comparisons in favor of an index of social primary goods (rights, liberties, opportunities, income, wealth, social bases of self-respect). This is the specific technical solution to Nadia's Move (1).

