answer: |-
  You have grasped the core of the Many-Worlds Interpretation (MWI) argument regarding Bell's Theorem correctly, and your intuition aligns with prominent proponents of MWI like David Deutsch and David Wallace. They argue precisely what you summarized: if you remove the collapse postulate, the dynamics are purely local (governed by the Schrödinger equation), and the "nonlocality" is an illusion created by insisting on a single outcome.

  However, the reason this is not considered a "settled" matter in the broader physics and philosophy community is not primarily academic inertia. It is because the claim that "MWI makes quantum mechanics local" depends on subtle, contested definitions of **locality**, **ontology**, and **realism**.

  Here is the technical gap you are looking for. It lies in the distinction between *dynamical locality* and *ontological locality*, and the problem of where physical reality actually "lives."

  ### 1. Configuration Space vs. Physical Space
  The Schrödinger equation is indeed local, but it is local in **configuration space**, not in 3D physical space.
  *   For a single particle, the wavefunction lives in 3D space.
  *   For two entangled particles, the wavefunction lives in a 6D configuration space.
  *   For $N$ particles, it lives in a $3N$-dimensional space.

  If you are a realist about the wavefunction (as MWI proponents must be), then the fundamental stuff of the universe exists in a high-dimensional space, not the 3D space we inhabit. Critics (such as Tim Maudlin or Antony Valentini) argue that a theory is only truly "local" if its fundamental ontology consists of **local beables** (things that exist at specific points in 3D space and time).

  If the fundamental reality is a field in 3N-dimensional space, then what looks like "locality" in that high-dimensional space can look like "holism" or "nonlocality" when projected down into our 3D experience. To claim MWI is local, you have to argue that 3D space emerges from the high-dimensional wavefunction in a way that preserves locality. This is an active area of research, not a settled proof.

  ### 2. The Definition of "Outcome Independence"
  Bell's Theorem rests on the assumption of **Local Realism**, which can be broken down into two conditions:
  1.  **Parameter Independence:** The setting of a detector here doesn't affect the statistics of outcomes there (no signaling).
  2.  **Outcome Independence:** The outcome here doesn't depend on the outcome there.

  Standard QM (with collapse) violates Parameter Independence only if you assume collapse is physical; otherwise, it respects the No-Communication Theorem. But it violates Outcome Independence.

  MWI proponents argue that Bell's Theorem assumes a **single outcome**. Since MWI posits that *all* outcomes occur, Bell's inequality derivation doesn't apply. However, critics counter that even within MWI, for an observer *within a branch*, the experience is of a single outcome. The correlation between the "you" in branch A and the "particle" in branch A still exists.

  The technical friction point is this: **How do the branches stay separate?**
  Decoherence explains why interference between branches becomes negligible, but decoherence is never mathematically exact; it is asymptotic. To get the strict "single world" experience required to match observation, MWI relies on the **Preferred Basis Problem**. If the definition of a "world" (or branch) is not fundamental but emergent, then the "locality" of the theory is also emergent. Many philosophers of physics argue that an emergent locality is not enough to satisfy the intuition behind Bell's Theorem, which was about the fundamental structure of causality.

  ### 3. Holism vs. Nonlocality
  Many MWI advocates concede that quantum mechanics is **non-separable** but insist it is **local**.
  *   **Non-separable (Holistic):** The state of the whole cannot be reduced to the states of the parts. (Entanglement is the prime example).
  *   **Non-local:** Actions here instantly influence physical reality there.

  MWI claims to be Local but Holistic. However, for many physicists, strong holism *is* a form of nonlocality. If the physical state of particle A cannot be defined without reference to particle B, regardless of distance, then the "local reality" of particle A does not exist.

  When your physicist friend said "it's more complicated," they were likely referring to this semantic but crucial distinction. If you define nonlocality as "FTL signaling," MWI solves it. If you define nonlocality as "the inability to assign independent physical states to spatially separated systems," MWI *accepts* it (as holistic) rather than dissolving it.

  ### 4. The Sociological Factor (Inertia vs. Risk)
  You asked if this is academic inertia. There is some truth to this, but it is better described as **risk aversion regarding ontology**.
  *   **Copenhagen/Operationalist:** "Don't ask what's real, just calculate." (Safe, works for experiments).
  *   **MWI:** "The wavefunction is real, and so are all branches." (High ontological cost, hard to test).
  *   **Bohmian Mechanics:** "Particles are real, guided by a nonlocal pilot wave." (Explicitly nonlocal, but deterministic).

  Physicists continue to write about nonlocality because **Bell Nonlocality** is a resource. In quantum information science, "nonlocality" (violation of Bell inequalities) is a tangible thing that can be measured, quantified, and used for cryptography. Even if MWI says "it's all local underneath," the *operational* nonlocality is still the feature driving the technology. Therefore, studying nonlocality remains productive regardless of interpretation.

  ### Summary
  The "MWI dissolves nonlocality" argument is technically valid *if* you accept:
  1.  The wavefunction is the sole ontology.
  2.  Locality in configuration space counts as true physical locality.
  3.  Emergent branches are sufficient to explain experience.

  The "gap" is that many experts do not accept premise #2. They argue that a theory whose fundamental object lives in $3N$ dimensions is not a local theory of *our* 3D world, even if the math doesn't involve FTL propagation.

  So, it is not that the mainstream hasn't caught up with a LessWrong post; it is that the LessWrong post (following Deutsch/Wallace) makes a philosophical move (redefining locality/ontology) that a significant portion of the physics community finds unconvincing or insufficiently motivated. The mystery isn't "how does the signal travel?" (MWI solves that); the mystery is "why does the world look 3D and local if the fundamental reality is high-dimensional and holistic?" (MWI leaves that open).

  Your friend was right: it is more complicated, but not because MWI is wrong. It's because "locality" is a much richer and more ambiguous concept than the "spooky action" soundbite suggests.
