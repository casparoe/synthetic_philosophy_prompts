answer: |-
  Here are 8 interview questions designed for your "Living History" project, written to capture Thomas Hobbes' specific voice and stubbornness. I have included the three required thematic sections with their follow-ups, plus five additional questions to round out the interview.

  The responses are written to sound like Hobbes: rational, materialist, slightly combative toward his academic rivals, and convinced that he is the only one who truly understands "reason."

  ***

  ### Interview with Thomas Hobbes (1672, Age 84)
  **Topic:** The Geometer of Malmesbury

  **1. Interviewer:** Mr. Hobbes, you didn't even read Euclid until you were forty years old. Most men settle into their habits by then. What was it about geometry that struck you so late in life?

  **Hobbes:** It was the certainty. I had spent a lifetime reading the classics and the theologians, and what did I find? Dispute. Noise. Men shouting over words that meant different things to each of them. Then I saw a geometric proof. It began with definitions everyone agreed upon, and it ended with a conclusion that could not be denied. I fell in love with that method. I resolved that if philosophy could not be demonstrated like geometry, it was no philosophy at all, but merely opinion.

  **2. Interviewer:** That leads to how you view shapes themselves. You insist that you cannot define a circle merely by its properties (like points being equidistant from a center); you say you must define it by how it is *constructed*. Why is the "making" of the shape so important to you?

  **Hobbes:** Because to know a thing is to know its cause. If I tell you a circle is a set of points, I am describing a static phantom. But if I tell you a circle is a line drawn around a fixed point, I am describing an action. I am describing motion. Nothing exists in this universe but bodies in motion. Therefore, a true definition must explain the *generation* of the figure. If you do not know how it was made, you cannot truly claim to know what it is.

  *   **Follow-up:** **Interviewer:** But doesn't that limit you? If math must be about physical construction, does that mean you reject mathematical concepts that can't be physically drawn?
      *   **Hobbes:** Precisely. I reject the "infinities" and the algebraic symbols of men like Wallis. They play with marks on paper like children moving counters on a board, without understanding the magnitude behind them. If you cannot construct it, if you cannot trace the motion of it, it is nonsense. True science is finite, because the world itself is finite.

  **3. Interviewer:** Let's speak of John Wallis. He is the Savilian Professor of Geometry at Oxford, and he has publicly refuted your solution to squaring the circle multiple times. Yet, in your latest writings, you still claim your solution is valid. After two decades of criticism, what keeps your confidence so intact?

  **Hobbes:** Confidence? It is not confidence; it is sight. When a man sees that two plus two is four, does he lose confidence because a crowd of men in gowns scream that it is five? Wallis and his colleagues at Gresham College do not argue from principles; they argue from authority. They hide behind algebraic symbols to obscure their errors. I have not admitted error because I have not seen error. To admit I was wrong would be to admit that reason itself is broken. I trust my reason more than I trust their reputation.

  *   **Follow-up:** **Interviewer:** So you believe this is a conspiracy of incompetence rather than a simple mathematical mistake? Do you think they *can't* understand you, or they *won't*?
      *   **Hobbes:** They are drunk on symbols. They have forgotten that geometry is the only science that God has bestowed upon mankind thus far. They treat it as a trade, a way to gain prestige. I treat it as the truth. If they cannot follow a demonstration because it is written in plain geometric language rather than their secret algebraic code, that is their blindness, not my fault.

  **4. Interviewer:** You mentioned prestige. You seem to have a deep disdain for the universities (Oxford and Cambridge). Do you think their institutional power is what fueled this feud with Wallis, rather than just the math?

  **Hobbes:** The universities are not centers of learning; they are centers of sedition. They teach men to argue using empty words, which leads to civil war. I saw what happened in the 1640s. I saw the blood. That blood was spilled because men were taught they could disobey their sovereign based on ambiguous interpretations of "liberty" or "conscience." Wallis represents that university culture. He defends the institution, and I defend the Sovereign. The math dispute is merely the battlefield where our larger war is fought.

  **5. Interviewer:** This brings us to *Leviathan*. You claim that your political philosophy is built on the same foundation as your geometry. How exactly does the certainty of a triangle prove the necessity of an absolute monarch?

  **Hobbes:** It is the method of resolution and composition. In geometry, we resolve a figure into its lines, and compose lines into figures. In politics, we resolve the Commonwealth into its parts: the individual men. We examine their nature. We find they are driven by appetites and aversions—motions of the mind. If we define these passions correctly, we can deduce, with geometric necessity, that without a power to keep them in awe, they will destroy one another. It is a calculation. If you accept the definitions of human nature, the conclusion of the Sovereign is as inevitable as the sum of a triangle's angles.

  *   **Follow-up:** **Interviewer:** But people aren't static shapes. They change their minds. Can you really have "geometric certainty" when dealing with human emotion?
      *   **Hobbes:** Emotions are not magic; they are motions. They follow laws just as surely as a billiard ball follows the laws of impact. Fear of death is a constant. Desire for power is a constant. If you build your state on these constants, it stands. If you build it on the "virtue" of men, which varies, it collapses. I do not need men to be good; I need the geometry of the state to be sound.

  **6. Interviewer:** You often refer to language as the source of error. You say "words are the counters of wise men, but the money of fools." How does your obsession with correct definitions in geometry help you fix the problems of language in society?

  **Hobbes:** In geometry, we agree on what a "line" is before we begin. We do not argue about it. In politics, men argue about "justice" or "faith" without defining them. They use metaphors. Metaphors are ignes fatui (foolish fires); reasoning upon them is wandering amongst innumerable absurdities. If we could speak in politics as we speak in geometry—where every term is defined by its cause and generation—there would be no dispute. There would only be calculation.

  **7. Interviewer:** Looking back at the last twenty years, do you regret spending so much energy on the "squaring of the circle"? Some might say it distracted you from your philosophical work.

  **Hobbes:** Regret implies I made an error in judgment. I have not. The world needs to know that truth is not determined by a vote of the Royal Society. If I must stand alone against the mathematicians of Oxford to show that reason requires humility before evidence, then I will stand. Besides, the exercise keeps the mind sharp. I am an old man, but my mind is not in decay. The circle is squared. The rest is noise.

  **8. Interviewer:** Finally, Mr. Hobbes, when you are gone, how do you wish to be remembered? As the author of *Leviathan*, the great political theorist? Or as Thomas Hobbes, the Geometer?

  **Hobbes:** *Leviathan* was necessary for my time, to stop the killing. But Geometry is for all time. Politics changes with the passions of men. Mathematics is the only truth that does not bend. I would be remembered as a man who sought to bring the light of demonstration into the darkness of human dispute. Whether they call me a geometer or a philosopher matters little, provided they remember that I taught them to fear the silence of the grave more than the power of a king.
