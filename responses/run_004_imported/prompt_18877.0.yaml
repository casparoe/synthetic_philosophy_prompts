          *   **Tone:** Academic but engaging, capturing Hobbes' personality (stubborn, rationalist, slightly arrogant but logical in his own mind).

  2.  **Research/Contextualize Hobbes & Geometry:**
      *   *The Squaring of the Circle:* Hobbes published *De Corpore* (1655). He claimed to solve the ancient problem. John Wallis (Savilian Professor of Geometry at Oxford) debunked it. They feuded for 20+ years until Hobbes' death.
      *   *Why Geometry?* Hobbes discovered Euclid late in life (age 40). He loved the certainty of deduction. He wanted to apply this method to human nature and politics (*Leviathan*).
      *   *Constructivism:* Hobbes believed knowledge comes from knowing the *cause* or *generation* of a thing. A circle isn't just "equidistant points"; it's "a line drawn around a point." This is key to his materialism.
      *   *Personality:* Hobbes was contentious, disliked universities (Oxford/Cambridge), and believed most mathematicians of his time were charlatans unless they agreed with him. He valued reason over authority.

  3.  **Drafting the Questions (Iterative Process):**

