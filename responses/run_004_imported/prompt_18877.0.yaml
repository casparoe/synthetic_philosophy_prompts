  ok so for history class we have this project where you basically "interview" a historical figure -- you write the questions AND how you think they'd actually respond based on research, teacher calls it a living history interview. i got assigned thomas hobbes and everyone has to pick ONE weird specific angle instead of doing his whole biography, so i'm doing his stuff with geometry, since apparently he spent like decades insisting he'd squared the circle and this guy wallis kept proving him wrong and hobbes never once admited it. can you write me around 8 interview questions for "hobbes" that don't just let him restate that he was right the whole time? i want at least one question pushing on why he stayed so confident after being refuted so many times, one on this idea i found where he thought defining a shape means explaining how you'd actually construct it (like a circle being a line swept around a point) instead of just listing its properties, and one connecting that back to why he thought his politics could be proven with the same certainty as geometry. for each of those three can you also add a quick follow up based on whatever answer "hobbes" would probably give, so it doesnt just stop after one response
