      *Exaptation nuance:* Gould might argue the *decoration* is the adaptation. But the *existence* of the triangle is the spandrel. Mark argues the existence is for support. So the existence is an adaptation. The decoration is a secondary adaptation. The "spandrel" (the space itself) disappears as a category because the space is structurally necessary.

