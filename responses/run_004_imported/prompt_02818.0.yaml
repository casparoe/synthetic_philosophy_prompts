      *   *Key Point 1: The Definition of "Byproduct".* A byproduct must be causally secondary. If the pendentive is causally primary (holding up the dome), it cannot be a spandrel.
      *   *Key Point 2: The Teleology of Construction.* Architecture is inherently teleological (designed for purpose). Biology is not. Using a designed object to argue against teleology in nature is risky. If you get the design wrong, your argument against teleology loses its anchor.
