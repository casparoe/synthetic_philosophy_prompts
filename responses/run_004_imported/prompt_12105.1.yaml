answer: |-
  This is a remarkably sharp observation for someone coming to the literature from outside the field. You have correctly identified the genealogy: the Ramsey-Cass-Koopmans model is the engine under the hood of both the Stern Review and Nordhaus's DICE model. The disagreement is not about the calculus; it is about the boundary conditions—specifically, the parameter for pure time preference (often denoted as $\delta$ or $\rho$).

  If Frank Ramsey had lived to witness the Stern-Nordhaus debate, his own writings suggest he would have sided decisively with **Nicholas Stern** on the ethical parameter, though he might have engaged with Nordhaus on the practical implementation.

  Here is the breakdown of why Ramsey's reasoning aligns with Stern, grounded in his 1928 paper, *"A Mathematical Theory of Saving."*

  ### 1. The "Ethically Indefensible" Quote
  The most critical piece of evidence is Ramsey's explicit treatment of the discount rate for utility. In Section I of his 1928 paper, Ramsey sets up the variables for his equation. He makes a deliberate choice to set the rate of time preference to zero. He writes:

  > *"It is assumed that we do not discount later enjoyments in comparison with earlier ones, a practice which is ethically indefensible and arises merely from the weakness of the imagination."*

  This is not a throwaway line; it is a foundational axiom of his model. Ramsey was a member of the Cambridge Apostles and deeply influenced by G.E. Moore's *Principia Ethica*. He viewed his mathematical work as a tool to solve a philosophical problem: How much should a society save to maximize the total good over time?

  To Ramsey, a unit of utility (well-being) experienced in 2100 is mathematically and ethically identical to a unit of utility experienced in 2024. To value it less simply because it is distant in time is, in his words, a "weakness of the imagination."

  **Alignment:** This is the exact ethical premise of the Stern Review. Stern argues that discounting the welfare of future generations purely because they are born later is a form of discrimination. Nordhaus, conversely, argues that we should use the discount rates observed in actual markets (revealed preference), which are significantly higher. Ramsey explicitly rejected using observed human "impatience" as a justification for ethical policy.

  ### 2. Pure Time Preference vs. Probability of Extinction
  You noted that Ramsey was fine with discounting based on the chance "nobody will be around later." This is a crucial distinction that often gets blurred in the climate debate, and Ramsey was precise about it.

  Ramsey distinguished between:
  1.  **Pure Time Preference ($\delta$):** Valuing the present more than the future simply because it is the present. (Ramsey: **Zero**)
  2.  **Existence Risk ($p$):** The probability that the human race (or the specific lineage of savers) will go extinct before enjoying the savings. (Ramsey: **Permissible**)

  In the modern Ramsey-Cass-Koopmans equation used by both Stern and Nordhaus, the effective discount rate is often a combination of pure time preference and the growth rate of consumption adjusted by elasticity. However, the ethical fight is over the pure time preference parameter.

  Stern sets pure time preference at 0.1% (effectively zero), accounting separately for extinction risk. Nordhaus sets it much higher (around 1.5% or more), effectively bundling pure impatience with risk.

  Ramsey would likely argue that Nordhaus is conflating two different variables. If the market demands a 5% return, Ramsey would argue that reflects the *productivity of capital* or *risk*, not an ethical justification for devaluing future lives. He would likely tell Nordhaus that market rates reflect current human "weakness of imagination," not an ethical truth.

  ### 3. Normative vs. Positive Economics
  This is where your background in research might resonate. Ramsey was constructing a **normative** model (how things *ought* to be to maximize an objective function), whereas Nordhaus often leans toward a **positive** or descriptive calibration (how things *are* so the model predicts actual behavior).

  Ramsey's paper is titled "A Mathematical Theory of Saving," not "A Description of How People Save." He was deriving the *optimal* path for a benevolent state.

  *   **Stern** is doing normative economics: "Given that we want to be ethical, what rate *should* we use?"
  *   **Nordhaus** is doing positive/welfare economics: "Given that people *do* discount the future, what policy is feasible without imposing undue hardship on the current generation?"

  Ramsey was a mathematician, but he was solving an ethical problem. He would likely view Nordhaus's reliance on market rates as committing the "naturalistic fallacy"—deriving an "ought" from an "is." Just because humans *are* impatient (market rates) doesn't mean they *ought* to be (policy rates).

  ### 4. The "Bloomsbury" Context
  To understand why Ramsey would reject Nordhaus's market-based rate, you have to look at his intellectual circle. Ramsey was close friends with John Maynard Keynes and Ludwig Wittgenstein. They were part of the Bloomsbury Group, which held strong utilitarian and anti-materialist views.

  They believed that the role of economics was to serve human well-being, not to cater to existing market irrationalities. In his 1928 paper, Ramsey explicitly critiques the idea that the rate of interest should be determined by the "psychological law" of how much people currently desire to save. He wanted to find the rate that *maximizes* welfare, even if it required a level of saving higher than what people currently desired.

  If Ramsey saw Nordhaus arguing that we should moderate climate action because current market rates imply we don't care about the future, Ramsey would likely counter that the market rates are the very thing that needs correcting by ethical policy.

  ### The Verdict
  Ramsey would stand with **Stern**, but perhaps with a sharper mathematical critique of Nordhaus.

  He would agree with Stern that the **pure rate of time preference must be zero** on ethical grounds. He would argue that using market rates to determine this parameter is a category error: market rates reflect the scarcity of capital and human psychological flaws, not the moral weight of a future person's life.

  However, Ramsey might offer one caution to Stern. Ramsey allowed for discounting based on the **probability of extinction**. If Stern assumes a near-certain continuation of humanity for 300 years, Ramsey might ask for a more rigorous probabilistic assessment of existential risk (nuclear war, pandemic, etc.) to be factored into the discount rate, not as a moral devaluation, but as a mathematical probability of the utility function reaching zero.

  **In summary:** Ramsey's 1928 text is the philosophical ancestor of the Stern Review. The quote "ethically indefensible" is the smoking gun. He viewed the discounting of future utility as a moral failure, not an economic input. Nordhaus treats the discount rate as a description of human behavior; Ramsey (and Stern) treat it as a prescription for ethical behavior. Ramsey would have viewed the market rate not as a constraint on policy, but as a variable to be optimized.
