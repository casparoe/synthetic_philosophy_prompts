          *   *Rationale:* Ethical argument. Future generations' welfare should count equally to present generations'. Discounting purely because of time is discriminatory.
          *   *Result:* Justifies aggressive immediate action on climate change (high present cost to avoid future damage).
      *   **William Nordhaus (DICE Model, etc.):** Advocates for a higher discount rate (market-based/observed rates).
          *   *Rationale:* Descriptive/Positive argument. We observe people saving and investing at certain rates. To impose a lower rate is to impose a savings rate higher than society desires. Also reflects opportunity cost of capital.
          *   *Result:* Justifies a more gradual approach to climate mitigation.

  3.  **Analyze Frank Ramsey's 1928 Paper ("A Mathematical Theory of Saving"):**
      *   *Key Passage:* Ramsey explicitly discusses the "rate of time preference" (often denoted as $\rho$ or $\delta$ in modern interpretations, though Ramsey used different notation).
      *   *The Famous Quote:* "It is assumed that we do not discount later enjoyments in comparison with earlier ones, a practice which is ethically indefensible and arises merely from the weakness of the imagination."
      *   *Nuance:* Ramsey *did* allow for discounting based on probability. "We can allow... for the probability of the extinction of the human race... or of the invention of new arts..."
      *   *Objective:* Ramsey was trying to determine the *optimal* savings rate for a society to maximize utility over an infinite horizon.
      *   *Ethical Stance:* Utilitarian. He was influenced by G.E. Moore and the Bloomsbury Group. The ethical stance is paramount in his derivation.

  4.  **Connect Ramsey to Stern and Nordhaus:**
      *   **Ramsey vs. Pure Time Preference:** Ramsey explicitly calls discounting future utility *purely because it is in the future* "ethically indefensible." This is the definition of the "pure rate of time preference" ($\delta$ in the Ramsey-Cass-Koopmans model).
      *   **Stern's Position:** Stern sets $\delta \approx 0.1\%$ (effectively zero). His justification is ethical: future people matter as much as present people. This mirrors Ramsey's "ethically indefensible" quote almost verbatim.
      *   **Nordhaus's Position:** Nordhaus sets $\delta$ based on observed market behavior (revealed preference). He argues that if society *acts* like it discounts the future, the model should reflect that to be realistic/prescriptive for policy.
      *   **The Conflict:** Ramsey was prescribing what an *ideal* saver (or state) *ought* to do to maximize good, not necessarily describing what imperfect humans *do*. Stern is making a prescriptive ethical argument (what we *ought* to do). Nordhaus is making a descriptive/pragmatic argument (what fits observed behavior).

  5.  **Synthesize the Argument:**
      *   *Direct Alignment:* Ramsey's explicit condemnation of pure time preference aligns almost perfectly with Stern's ethical premise.
      *   *The "Why":* Ramsey viewed the discounting of future utility as a "weakness of the imagination." Stern views it as intergenerational discrimination. Both stem from a utilitarian ethic that treats all utility as equal regardless of temporal location.
      *   *The Caveat (Probability):* Ramsey allowed discounting for *existence risk* (probability the race goes extinct). Stern includes this too (though low). Nordhaus includes this but bundles it with pure time preference.
      *   *The Nuance (Descriptive vs. Normative):* Ramsey's paper is normative (theory of *optimal* saving). Nordhaus often leans positive/descriptive (matching market rates). Stern is normative (ethical obligation). Therefore, Ramsey fits Stern's *methodological* approach (normative ethics) better than Nordhaus's (positive economics).

