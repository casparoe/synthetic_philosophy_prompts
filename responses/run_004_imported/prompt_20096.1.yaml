answer: |-
  Your friend is partially right, but their analysis is incomplete because it treats this as a solo investment decision rather than a strategic interaction. You are correct to sense that there is more going on.

  Here is a breakdown of the psychological and game-theoretic dynamics at play, why your friend's advice might be too blunt, and how you should adjust your strategy.

  ### 1. Where Your Friend Is Right: The Sunk Cost Fallacy
  Your friend is correctly identifying the **Sunk Cost Fallacy**. This is the cognitive bias where you continue a behavior because of previously invested resources (time, money, effort), even if the current costs outweigh the benefits.

  *   **The Reality:** The eight months you have already spent are gone. They cannot be recovered. Whether you get the promotion or not, that time is not coming back.
  *   **The Trap:** You are currently making decisions based on *not wanting that past time to have been wasted*, rather than *whether the future time will be well spent*.
  *   **The Friend's Logic:** If you look at today as Day 1, would you sign up for an 8-month competition with undefined criteria and unpaid extra work? If the answer is no, then staying is irrational.

  ### 2. What Your Friend Missed: The War of Attrition
  You sensed that this isn't a solo decision. In game theory, this specific scenario is called a **War of Attrition**.

  *   **The Setup:** Two players compete for a single prize. Both pay a cost (time/effort) continuously. The player who persists longer wins the prize, but both pay the costs of the duration.
  *   **The Dynamic:** Because you are matching your colleague's moves, you have entered a bidding war. Every time she takes a project, you feel you must "bid" higher to stay in the game.
  *   **The Risk:** In a War of Attrition, the value of the prize often becomes less than the total cost paid by the winner. You might win the promotion, but after 12 months of unpaid overtime and stress, the net value of the win could be negative.
  *   **The "Quit" Nuance:** Your friend says "quit." In game theory terms, quitting the *game* (stopping the extra projects) is different than quitting the *job*. However, in a War of Attrition, if you stop bidding, you lose the prize immediately. This is why you feel compelled to stay.

  ### 3. The Hidden Variable: Management's Incentives
  This is the most critical piece missing from both your and your friend's analysis. You are viewing this as You vs. Colleague. In reality, it is **You + Colleague vs. Management.**

  *   **The Benefit to Management:** As long as the decision is deferred, management receives free labor (the "stretch projects") from two motivated employees. They have zero incentive to end the competition quickly.
  *   **Moving the Goalposts:** By deferring the decision and asking for more proof, they are exploiting the **Escalation of Commitment**. They know you feel invested.
  *   **The Possibility of No Prize:** There is a non-zero chance that management never intended to promote either of you internally, or that the role will be posted externally once they have extracted the value they need from these projects.

  ### 4. How This Should Change What You Do Next
  You should not simply "quit immediately" based on sunk costs, nor should you continue matching your colleague based on fear of waste. You need to shift from an **emotional strategy** (protecting the past) to a **strategic strategy** (maximizing the future).

  Here is a step-by-step approach:

  **Step 1: Stop Matching (Break the Equilibrium)**
  Stop automatically matching your colleague's projects. This is the hardest part, but necessary.
  *   **Action:** The next time a "stretch project" is offered, decline it or negotiate terms. Say: *"I am very interested in the promotion, but I need to focus on my core deliverables for now. Can we clarify exactly what criteria remain unmet?"*
  *   **Why:** If you stop bidding and still get the promotion, you win big. If you stop bidding and lose the promotion, you have saved yourself future unpaid labor. You need to test if the extra work is actually the deciding factor or if management is just harvesting free labor.

  **Step 2: Force a Timeline (Call the Bluff)**
  A War of Attrition thrives on ambiguity. You need to introduce a deadline.
  *   **Action:** Request a meeting with the decision-maker. Ask: *"It has been eight months. What is the specific timeline for a final decision? If I take on another project, will a decision be made immediately upon its completion?"*
  *   **Why:** If they cannot give you a date, the prize is illusory. If they say "yes" but defer again later, you have your answer about their integrity.

  **Step 3: Calculate Future Value, Not Past Cost**
  Ignore the last eight months. Ask yourself:
  *   *If I get the promotion, is the salary increase/responsibility worth another 3 months of this stress?*
  *   *If I don't get the promotion, will the skills from these projects help me get a higher salary elsewhere?*
  *   **Crucial Check:** If the answer to the second question is "no," then the work is truly wasted. If the answer is "yes," then the work isn't wasted even if you lose the promotion, because you are upskilling for the external market.

  **Step 4: Prepare an External Exit**
  The strongest position in a negotiation is the ability to walk away.
  *   **Action:** Update your CV and interview externally *now*.
  *   **Why:** This accomplishes two things. First, it gives you a "BATNA" (Best Alternative to a Negotiated Agreement). If you have an offer for a 20% raise elsewhere, the internal promotion becomes less critical. Second, it breaks the psychological hold of the "internal race." You realize you are not trapped.

  ### Summary
  Your friend is right that the past eight months are gone, but wrong that you must quit immediately without a strategic pivot.

  You are in a **War of Attrition** managed by people who benefit from your delay.
  1.  **Acknowledge the sunk costs** but refuse to let them dictate future moves.
  2.  **Stop matching** your colleague's extra work unconditionally.
  3.  **Demand a deadline** for the decision.
  4.  **Test the external market** to see if your "wasted" hours can actually be monetized elsewhere.

  If management refuses to set a deadline or penalizes you for focusing on core work, *then* you quit. But you quit because the future looks bad, not because the past was wasted.
