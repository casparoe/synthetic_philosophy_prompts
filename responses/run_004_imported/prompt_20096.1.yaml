  1.  **Analyze the User's Situation:**
      *   **Context:** Internal promotion competition between the user and a colleague.
      *   **Duration:** 8 months.
      *   **Mechanism:** Management defers decision, asks both to take on unpaid "stretch" projects to prove readiness.
      *   **Dynamic:** It's a race/arms race. If the colleague does a project, the user feels compelled to match it.
      *   **Risk:** Work only pays off if promoted; otherwise, it's "wasted time."
      *   **Psychological State:** User feels trapped by the *Sunk Cost Fallacy* (hours already spent) but suspects there's more to it.
      *   **Friend's Advice:** Quit immediately. Argument: Sunk costs are gone.
      *   **User's Doubt:** It's not a solo decision; it's a strategic interaction (game theory).

  2.  **Evaluate the Friend's Advice (Sunk Cost Fallacy):**
      *   *Validity:* The friend is partially right. The 8 months are gone. Continuing *only* because of the past 8 months is irrational.
      *   *Limitation:* The friend treats this as a solo investment decision. It's actually a competitive scenario with an opponent (the colleague) and a referee (management). Quitting guarantees a loss (no promotion, wasted 8 months). Staying keeps a non-zero probability of success.
      *   *Conclusion:* The friend's advice is too binary and ignores the strategic context.

  3.  **Identify the Underlying Dynamics (What else is going on?):**
      *   **Sunk Cost Fallacy:** Yes, this is present. "I've invested so much, I can't stop now."
      *   **Escalation of Commitment:** Doubling down on a failing course of action.
      *   **Game Theory (The War of Attrition):** This is the key insight. It's a bidding war where both parties pay costs (time/effort) for a single prize. The one who quits first loses. The one who stays longer wins *if* management actually awards the prize.
      *   **Management's Role:** Management is benefiting from free labor. They have no incentive to stop the competition as long as both parties keep producing. This is a "move the goalposts" scenario.
      *   **Asymmetric Information:** Does the colleague feel the same pressure? Is management actually comparing, or just exploiting?
      *   **Opportunity Cost:** What else could the user be doing? (Looking for other jobs, upskilling elsewhere, resting).

  4.  **Formulate the Advice:**
      *   **Validate the User:** Acknowledge that the friend's analysis is incomplete. It *is* a strategic interaction, not just a personal investment.
      *   **Name the Phenomenon:** Introduce "War of Attrition" (Game Theory). This gives the user a framework to understand the dynamic.
      *   **Analyze Management's Incentives:** Highlight that management is winning regardless of who gets promoted. They are getting free labor. This is a red flag.
      *   **Re-evaluate the "Quit" Option:** Quitting the *competition* doesn't necessarily mean quitting the *job* (though it might). It means stopping the extra unpaid work.
      *   **Strategic Options:**
          1.  *Call the Bluff:* Stop doing the extra projects. See what happens.
          2.  *Negotiate:* Ask for clarity on criteria and timeline.
          3.  *Exit Strategy:* Look externally.
      *   **Decision Matrix:** How to decide? Based on future value, not past cost.

