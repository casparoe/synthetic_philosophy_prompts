      *   **Formal Correctness:** The definition must not lead to contradiction (consistency is paramount).
      *   **Natural Language:** Tarski famously argued natural language is "semantically closed" (contains its own truth predicate + names of sentences + logical laws) and therefore *inconsistent*. He thought no consistent definition of truth could be given for it *as it stands*.
      *   **Solution:** Hierarchies of languages (Object language, Meta-language, Meta-meta-language). Truth is relative to a level.
      *   **Logic:** Tarski was a classical logician. He assumed the Law of Non-Contradiction (LNC) and Law of Excluded Middle (LEM) were non-negotiable for a coherent scientific language.
      *   **Goal:** To save science and logic from antinomies, not to preserve all intuitions about natural language usage.

  3.  **Analyze Tarski's Likely Response to Kripke (1975, "Outline of a Theory of Truth"):**
      *   *Kripke's Move:* Keeps classical logic mostly but allows truth-value gaps (partial logic). Constructs a fixed point where the truth predicate is partially defined. The Liar sentence falls into the "gap" (neither true nor false).
      *   *Tarski's Potential Approval:*
