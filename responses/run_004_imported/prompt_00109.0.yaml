answer: |-
  This is a fantastic question that cuts to the heart of the methodological divide between mid-20th-century logical empiricism and contemporary formal philosophy. Your professor's intuition is largely correct, but the full picture requires disentangling Tarski's *mathematical* constraints from his *philosophical* motivations.

  To reconstruct Tarski's likely response, we must return to his 1933 monograph, *"The Concept of Truth in Formalized Languages."* Tarski's project was governed by two non-negotiable criteria for a successful definition of truth:
  1.  **Material Adequacy:** The definition must imply all instances of Convention T ($T(s) \leftrightarrow p$).
  2.  **Formal Correctness:** The definition must be constructed within a formal system that is demonstrably consistent (free from contradiction).

  Tarski famously concluded that for any language that is "semantically closed" (i.e., contains its own truth predicate, names for its sentences, and classical logic), satisfying both criteria is impossible. Therefore, he argued, natural language is inconsistent, and for scientific purposes, we must replace it with a hierarchy of languages where truth is always relative to a higher meta-language.

  Here is how Tarski would likely analyze Kripke and Priest through that specific lens.

  ---

  ### 1. Tarski on Kripke: "A Brilliant Technical Revision, But Not Truth"

  Saul Kripke's 1975 *"Outline of a Theory of Truth"* attempts to model natural language by allowing the truth predicate to be partially defined, creating "truth-value gaps" for ungrounded sentences like the Liar.

  **Where Tarski Would Offer Praise:**
  Tarski was, above all, a logician who valued rigorous formalization. He would likely admire the mathematical elegance of the fixed-point construction. Kripke succeeds in Tarski's primary negative goal: he avoids inconsistency. By allowing the Liar sentence to be neither true nor false, Kripke preserves the consistency of the system. Tarski would acknowledge that Kripke has found a way to keep a single language containing its own truth predicate without immediate explosion, provided one weakens the underlying logic (specifically, by abandoning bivalence).

  **Where Tarski Would Object:**
  However, Tarski would likely argue that Kripke has not defined *truth* in the sense Tarski cared about, for three reasons:

  *   **The Sacrifice of Bivalence:** Tarski's framework is deeply committed to classical logic. For Tarski, a sentence is true if it corresponds to the facts, and false if it does not; there is no third option. By introducing truth-value gaps, Kripke is not defining the concept of truth Tarski analyzed; he is defining a *revised* concept. Tarski would likely view this as mutilating the concept to save the language, whereas he preferred mutilating the language (via hierarchy) to save the concept.
  *   **The Strengthened Liar:** This is the most potent Tarskian objection. Kripke's theory generates a "ghost" of the hierarchy. While the Liar sentence ($\lambda$) is in the gap, the sentence " $\lambda$ is not true" seems to be true. But if we add a predicate for "is in the gap" or "is not true" to the object language, we can reconstruct the paradox (the "Strengthened Liar"). Tarski would argue that Kripke's system cannot express its own semantics consistently. To explain *why* the Liar is in the gap, you need a meta-language. Thus, Tarski would claim Kripke hasn't eliminated the hierarchy; he has merely hidden it in the meta-theory required to interpret the fixed point.
  *   **Convention T Failure:** Kripke's theory does not validate all instances of the T-schema. It validates them only for "grounded" sentences. For Tarski, a definition of truth that fails to apply to certain well-formed sentences of the language is materially inadequate. Tarski would argue that if your theory of truth cannot tell you the truth conditions of the Liar sentence (even if the answer is "it's nonsense"), you haven't fully defined truth for that language.

  **Verdict:** Tarski would view Kripke's work as a significant advance in *formal semantics*, but not as a solution to the philosophical problem of truth. He would see it as a sophisticated way of reconstructing language to avoid paradox, which is permissible, but he would insist that Kripke is no longer talking about the classical concept of truth required for deductive science.

  ---

  ### 2. Tarski on Priest: "Intelligible Only as a Surrender of Logic"

  Graham Priest's dialetheism argues that the Liar sentence is both true and false, and that we should adopt a paraconsistent logic (like LP) to prevent this contradiction from entailing everything (*ex contradictione quodlibet*).

  **The Fundamental Clash:**
  Your professor's comment hits hardest here. For Tarski, the Law of Non-Contradiction (LNC) was not merely a logical rule; it was a precondition for the intelligibility of scientific discourse. In *"The Concept of Truth,"* Tarski writes that if a language is inconsistent, "the laws of logic... cease to be a reliable instrument."

  **Tarski's Likely Reasoning:**
  *   **Formal Correctness Violated:** Tarski demanded that a definition of truth be *formally correct*. For a classical logician like Tarski, a system that admits true contradictions is, by definition, formally incorrect. He would not view Priest's move as a "different logic" but as a breakdown of logical syntax. To Tarski, allowing $P \land \neg P$ is not a revision of logic; it is the abandonment of the very notion of assertion.
  *   **The Normative Role of Logic:** Tarski viewed logic as normative. It tells us how we *ought* to reason to preserve truth. Paraconsistent logic, in Tarski's eyes, would look like a description of how people *do* reason when they are confused. He would argue that Priest is legitimizing error. If the Liar is both true and false, the distinction between truth and falsehood collapses in that domain. For Tarski, a theory of truth that cannot distinguish truth from falsehood in borderline cases has failed its primary function.
  *   **Convention T vs. Consistency:** Priest prioritizes Material Adequacy (keeping the T-schema unrestricted) over Formal Correctness (consistency). Tarski explicitly chose the reverse. Tarski would argue that an unrestricted T-schema in a natural language is *proof* that the T-schema is not a valid principle for that language, not proof that the world contains contradictions. He would view Priest's retention of the T-schema for the Liar as a category mistake: treating a semantic defect as an ontological feature.

  **Verdict:** Tarski would likely find dialetheism "borderline unintelligible" in the sense that it violates the preconditions he believed necessary for meaningful discourse. He would not view it as a rival theory of truth, but as a theory of something else (perhaps "acceptability" or "assertibility") mislabeled as truth. He would argue Priest is "changing the subject" by redefining logic to accommodate a paradox that should instead be used to restrict language.

  ---

  ### 3. The Meta-Question: Advances or Subject Changes?

  You asked whether Tarski would view these as legitimate advances or as changing the subject. The answer lies in Tarski's **instrumentalism regarding natural language**.

  Tarski did not believe it was possible to give a consistent theory of truth for natural language *as it is*. He believed natural language was a messy, inconsistent historical artifact. His goal was not to "save the phenomena" of English usage (which is what Kripke and Priest both attempt, in different ways). His goal was to construct a *replacement* language for science that was precise and consistent.

  *   **Kripke** tries to show that natural language *can* be modeled consistently if we tweak the logic (partial logic). Tarski would say: "You have constructed a new formal language that resembles English. Good. But do not claim this is English. English is inconsistent."
  *   **Priest** tries to show that natural language *is* inconsistent and we should accept it. Tarski would say: "If English is inconsistent, it is unfit for science. We must build a hierarchy to replace it, not embrace the inconsistency."

  Therefore, Tarski would likely view both projects as **changing the subject** relative to his own.
  *   Tarski's subject: *How do we define truth for a scientific language to ensure consistency?*
  *   Kripke/Priest's subject: *How do we model the actual behavior of the truth predicate in natural language?*

  ### Conclusion

  Your professor is right that Tarski would be hostile to Priest, likely viewing dialetheism as a surrender of the normative force of logic. A system that tolerates contradictions cannot, for Tarski, serve as the foundation for deductive science.

  Regarding Kripke, Tarski would be more charitable but still critical. He would respect the fixed-point mathematics but reject the philosophical conclusion that truth-value gaps are a feature of *truth* rather than a feature of a *reconstructed language*. He would ultimately argue that Kripke's need for a meta-language to explain the gaps vindicates Tarski's original hierarchy: you still cannot fully capture semantic concepts within the object language without loss (either of bivalence or of expressive completeness).

  In short, Tarski would argue that Kripke and Priest are engaged in **descriptive semantics** (how language works), whereas he was engaged in **prescriptive semantics** (how language must work to be scientifically viable). From his perspective, they are solving a sociological or psychological puzzle, while he was solving a logical one.
