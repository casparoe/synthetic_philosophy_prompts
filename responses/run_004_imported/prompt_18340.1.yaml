answer: |-
  "I was struggling to prepare for this talk. I had two options: Polish the draft, or go to the hotel bar.

  I realized they were **on a par**.

  Now, if they were *merely equally good*, then adding one hour of work to the draft would make it strictly better than the bar. That’s the trichotomy.

  But since they’re *on a par*, adding one hour doesn’t necessarily make the draft better than the bar. That’s the Small Improvement Argument.

  So, I didn’t add the hour. And if this talk seems a little underprepared... please understand. It’s not negligence. It’s empirical confirmation of Ruth Chang’s theory. A small improvement wouldn’t have made it *better*; it would have just kept us on a par.

  And if you’re tempted to walk out... don’t. Staying and leaving are on a par. And a small improvement to the coffee in the hallway won’t make leaving better than staying.

  So please, stay. Not because it’s better. But because it’s on a par."
