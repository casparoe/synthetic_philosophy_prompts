prompt: |-
  I'm a philosophy PhD student working on practical reason, and I'd like to open an upcoming talk on hard choices with a joke. Could you write one that turns on Ruth Chang's claim that some options are "on a par" with each other, rather than better than, worse than, or equally as good as one another? The punchline should specifically exploit her small-improvement argument -- the idea that, unlike merely equally good options, options that are on a par stay neither better nor worse than each other even once one of them is slightly sweetened (say, a job offer that comes with a modest raise). Please don't just gesture vaguely at "choices are hard": the joke should really only land for someone who already understands why parity is supposed to be a distinct fourth value relation, rather than sloppy shorthand for "roughly equal."
