          *   (b) What is the "enactive"/sensorimotor objection? (Missing association vs. missing skill).
          *   (c) Can these two stories (association vs. skill) be teased apart empirically, or are they entangled?

  2.  **Deconstruct Question (a): The Timing/Reasoning Gap:**
