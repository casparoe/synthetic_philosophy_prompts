      *   **Topic:** Molyneux's Problem (can a newly sighted blind person distinguish a cube from a sphere by sight alone?).
      *   **Current Understanding:** Knows Locke/Molyneux said "No." Knows Leibniz said "Yes" but with caveats (reasoning vs. immediate perception). Knows empirical cases (S.B., recent sight restoration) generally support "No" initially, with rapid learning.
