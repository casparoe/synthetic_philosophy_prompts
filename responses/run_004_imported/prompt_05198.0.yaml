      *   *Skill Story:* Perception is an activity. Need to learn the laws of sensorimotor contingency for vision ($L_v$). Tactile perception relies on different laws ($L_t$).
      *   *Empirical Distinguishability:* This is the hard part.
      *   *Argument for Entanglement:* To demonstrate an association, you must be able to attend to the visual stimulus *as* a shape. If the skill is missing, you can't attend to it as a shape. Any test requiring a response presupposes the skill.
      *   *Potential Falsification:* If patients show implicit learning (priming, neural activation) *before* explicit recognition, that supports the Association view (data is there, link is missing). If even implicit processing is absent until motor exploration occurs, that supports Enactivism.
