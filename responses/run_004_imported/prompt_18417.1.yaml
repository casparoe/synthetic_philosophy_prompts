      *   Engage honestly with strongest argument for trusting grader? Yes.
      *   Context (Philosophy/Epistemology)? Yes, weave that language in.

  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between the *original* grading and the *re-mark* is clear. The problem is that the re-mark confirmed the drift. This is crucial. If the re-mark fixed it, Side B would win. But the re-mark *reproduced* the divergent score. This proves the fatigue alters the *interpretation* of the rubric, not just attention to detail. I need to make sure this point lands hard.

