      *Therefore:* Fairness requires alignment with the benchmark. The "trust the grader" argument is about epistemic authority. The "override" argument is about distributive justice and standardization. I will prioritize standardization/fairness.

      *Wait, one more check on the "Higher-Order Evidence" angle:* The user is taking a seminar on this. The memo should reflect that. The statistical trend (3 years) is higher-order evidence that our cognitive faculties are impaired in Hour 5. Our confidence (even after re-check) is first-order evidence. Defeat occurs when HOE undermines the reliability of the faculty producing the FOE. I should explicitly use this framing.

