answer: |-
  This is a fantastic question. You have hit upon exactly the point where most readers either dismiss Gongsun Long as a sophist or realize he is doing something much more radical than simple wordplay. Your intuition that there is a shift in the meaning of "is not" (*fei* 非) is correct, but dismissing it *merely* as a fallacy misses the philosophical project of the School of Names (*Ming Jia*).

  To answer your specific questions: **Yes, the final move is doing new argumentative work**, shifting from the *extension* of terms (which objects fit the label) to the *ontology* of terms (what kind of entities "White" and "Horse" are). And **yes**, the argument relies on a specific, rigid definition of "is not" that differs from common usage, but it is likely an intentional choice rather than an accidental sleight of hand.

  Here is a breakdown of the mechanics of that final passage, why it feels like a trick, and why it might actually be a coherent (if controversial) philosophical stance.

  ### 1. The Distinction: "Unfixed White" vs. "Fixed White"

  You quoted the passage: *"Whiteness, considered just by itself, does not fix on any particular white object... But 'white horse' is a phrase in which whiteness has been fixed onto something white."*

  In Western philosophical terms, Gongsun Long is distinguishing between a **Universal** and a **Qualified Particular**.

  *   **White (白 - *Bái*):** This is the abstract universal. It is "unfixed." It can apply to a stone, a feather, a person, or a horse. It exists independently of any specific object.
  *   **White Horse (白马 - *Bái Mǎ*):** This is not just "White" + "Horse." For Gongsun Long, when you combine them, the "White" is no longer the universal "White." It has been captured, limited, and determined by "Horse."

  **The Logical Move:**
  Gongsun Long is arguing that **White-Horse** is a compound entity that is ontologically distinct from **Horse**.
  *   **Horse** = The form/shape of a horse (ignoring color).
  *   **White** = The color white (ignoring shape).
  *   **White Horse** = A new, third category where color and shape are fused.

  If you accept his premise that "White" (universal) changes its nature when it becomes "White-in-a-horse" (particular), then "White Horse" cannot be identical to "Horse," because "Horse" implies the *absence* of color specification, while "White Horse" implies the *presence* of it.

  ### 2. Is it just the earlier point restated?

  It is related, but it is a shift in register.

  *   **Earlier Argument (Extension/Pragmatics):** "If I ask for a horse, a yellow one works. If I ask for a white horse, a yellow one fails." This is about the **extension** of the term (the set of objects it refers to). It argues that the sets are not identical.
  *   **Final Argument (Intension/Ontology):** "Unfixed whiteness is not the same as fixed whiteness." This is about the **intension** (the concept itself) and the metaphysical status of properties.

  The final move is deeper because it claims that the *concept* of "White Horse" is not a sub-category of "Horse," but a **distinct category entirely**. In modern set theory, we say $\{White Horses\} \subset \{Horses\}$. Gongsun Long is arguing that the *label* "White Horse" belongs to a different logical type than the label "Horse."

  ### 3. The Sleight of Hand: The Meaning of *Fei* (非)

  This is the crux of your friend's objection. In modern logic, we distinguish between:
  1.  **Identity:** $A = B$ (A is identical to B).
  2.  **Class Membership:** $A \in B$ (A is a member of class B).

  When we say "A white horse is a horse," we mean **Class Membership**.
  When Gongsun Long says "A white horse is *not* (*fei*) a horse," he is arguing **Non-Identity**.

  **Is this cheating?**
  By modern standards, yes, it is an equivocation fallacy. He is using "is not" to mean "is not identical to" while his opponent understands it as "is not a member of."

  **However,** many scholars (like A.C. Graham and Chad Hansen) argue that Gongsun Long knows exactly what he is doing. The School of Names was concerned with the **Rectification of Names** (*Zheng Ming*). Their goal was to ensure that language maps precisely onto reality.
  *   If "Horse" includes black, yellow, and white horses, it is a general term.
  *   If "White Horse" includes only white horses, it is a specific term.
  *   If you treat the specific term as interchangeable with the general term, you introduce ambiguity into governance and law.

  So, Gongsun Long is insisting on a **strict identity logic**. He is saying: "Do not confuse the compound name with the simple name. They function differently. Therefore, logically, they are not the same."

  ### 4. Does the argument hold up on its own terms?

  If we grant Gongsun Long his premises, the argument is valid. The question is whether the premises are sound.

  **The Strong Point:**
  He correctly identifies that adding a modifier changes the logical function of a noun. "Horse" functions as a variable ($x$ is a horse). "White Horse" functions as a constrained variable ($x$ is a horse AND $x$ is white). In computer science terms, `Class Horse` is not the same as `Class WhiteHorse`, even if `WhiteHorse` inherits from `Horse`. They are different definitions.

  **The Weak Point (The "Separation" Problem):**
  The argument relies on the idea that "White" and "Horse" are separate entities that can be combined. This is a form of **Realism** about properties. He treats "Whiteness" as a thing that exists on its own.
  Most modern philosophers (and his contemporaries like the Mohists) would argue that "White" is an attribute, not an object. You cannot have "Whiteness" floating around waiting to be fixed. It only exists *in* things. If "White" doesn't exist independently, the distinction between "Unfixed White" and "Fixed White" collapses.

  ### 5. Summary: Sophistry or Serious Philosophy?

  It is likely **serious philosophy disguised as sophistry.**

  During the Warring States period, thinkers often used paradoxical arguments to shock their audience into re-evaluating their assumptions. Gongsun Long's goal wasn't necessarily to convince a stable boy that he shouldn't call a white horse a horse. His goal was to show rulers and ministers that **language is slippery.**

  *   **The Surface Reading:** "A white horse is not a horse." (Absurd).
  *   **The Deep Reading:** "The concept 'White Horse' is not interchangeable with the concept 'Horse' without loss of precision." (True).

  **To answer your specific doubts:**
  1.  **Is it new work?** Yes, it moves from pragmatic usage to metaphysical categorization of properties.
  2.  **Is it a shift in "is not"?** Yes, it insists on *non-identity* rather than *non-membership*.
  3.  **Does it hold up?** It holds up if you accept that abstract properties (White, Horse) are real, independent entities that combine to form new entities. It fails if you view properties as merely descriptive tags we apply to physical objects.

  **Recommendation for further reading:**
  If you want to dig deeper into the mechanics without needing Classical Chinese, look for **A.C. Graham's** translations and commentary (*Disputers of the Tao*). He treats the School of Names with serious logical rigor. **Chad Hansen** (*A Daoist Theory of Chinese Thought*) also offers a fascinating linguistic analysis, arguing that Chinese nouns function more like "mass nouns" (like "water" or "furniture") than count nouns, which changes how we interpret Gongsun Long's separation of "White" and "Horse."

  You are right to feel stuck there; that final move is the pivot point where the text demands you choose between common sense and logical precision. Gongsun Long wants you to choose precision.
