          *   *Rebuttal:* Galileo specifies "rigorously established" (demonstrated). He isn't saying every hypothesis changes scripture. Also, the "chaos" fear assumes science is fickle, but cumulative science (like parallax later) stabilizes. Bellarmine's protection is actually a cage.

  6.  **Refining the Argument (Self-Correction during drafting):**
