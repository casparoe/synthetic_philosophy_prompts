      *   *Revised Thesis:* Bellarmine wins on the narrow scientific epistemology of 1615 (underdetermination), but Galileo wins on the broader hermeneutical and jurisdictional principle. Ultimately, **Galileo's position is more justified** because Bellarmine's requirement for "strict demonstration" before scriptural reinterpretation creates a theological veto that is incompatible with the probabilistic and cumulative nature of empirical science.

  5.  **Drafting - Section by Section:**

