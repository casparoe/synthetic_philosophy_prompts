      *   **Evaluation Level 2 (Policy):** Argue Galileo is right. Bellarmine's standard is too high (Cartesian certainty vs. empirical weight). If adopted, it freezes dogma. Galileo allows for development of doctrine based on discovery.
      *   **The Verdict:** Galileo is more justified overall. Why? Because the policy question is more fundamental. Science operates on inference to the best explanation, not absolute demonstration. Bellarmine's rule would have permanently blocked heliocentrism even after the evidence became overwhelming (by demanding "strict demonstration" which is philosophically elusive).
      *   **Objection & Rebuttal:**
