          *   Context: By 1615, Ptolemy was dead (phases of Venus), but Tychonic system was viable. Galileo's tidal argument was wrong. Stellar parallax (proof of motion) came much later.
      *   **Task:** Write an essay reconstructing the strongest version of each argument, evaluate the "right/wrong" question at two levels (specific 1615 evidence vs. general interpretive policy), and reach a *definite verdict* (no fence-sitting). Defend the verdict against the strongest objection.

  2.  **Deconstruct the Arguments:**

      *   **Bellarmine (The Epistemic Conservative):**
          *   *Core Claim:* Instrumentalism vs. Realism. Hypotheses save the phenomena; only demonstration proves truth.
          *   *Theological Claim:* Scripture is authoritative. Reinterpreting it is dangerous and requires overwhelming necessity.
          *   *Scientific Claim:* No proof of earth's motion exists (Tychonic system fits data equally well).
          *   *Strength:* Methodological caution. Avoids committing the Church to falsifiable scientific claims. Acknowledges the underdetermination of theory by data (in 1615).

      *   **Galileo (The Epistemic Reformer):**
          *   *Core Claim:* Truth cannot contradict truth. If nature says X, Scripture cannot mean not-X.
          *   *Theological Claim:* Accommodation (Augustine). Scripture speaks to common understanding, not technical physics.
          *   *Jurisdictional Claim:* Science (observation/demonstration) is autonomous from Theology (exegesis/salvation).
          *   *Strength:* Long-term vision for science-religion relationship. Prevents theology from stifling inquiry.

  3.  **Determine the Levels of Evaluation:**
      *   *Level 1: Specific Evidence (1615 Context).* Who was scientifically correct *at that moment*?
