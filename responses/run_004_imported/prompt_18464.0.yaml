answer: |-
  1. **FDT vs. Precommitment Strategies**
  You argue that Functional Decision Theory is a distinct account of rationality, not merely a strategy. However, philosophers like David Gauthier (with *Constrained Maximization*) and Edward McClennen (with *Resolute Choice*) have long argued that a CDT agent can achieve the same outcomes by adopting a disposition to precommit. If an FDT agent and a precommitted CDT agent output the exact same actions in Parfit's Hitchhiker and Newcomb's Problem, what is the substantive difference? Is FDT truly a new decision theory, or is it just a claim about the optimal *prior* architecture for a CDT agent?

  *   **Follow-up:** You'll likely reply that precommitment is costly or impossible in certain scenarios where FDT works seamlessly. But if the behavioral output is identical in the cases that matter, doesn't that suggest the dispute is merely about the *psychology* of the agent rather than the *normativity* of the decision? If rationality is defined by winning, and both win equally, why should we prefer the FDT description?

  2. **The Ontological Status of Subjunctive Dependence**
  A core pillar of FDT is "subjunctive dependence"—the idea that your decision can logically counterfactually influence another agent's prediction without a causal link. Critics worry this is a "ghost in the machine" that simply labels whatever correlation is required to make the FDT math yield the "correct" Newcomb answer. Is subjunctive dependence a rigorous logical relation with formal truth conditions, or is it effectively a placeholder for "correlation that we wish to treat as causation"?

  *   **Follow-up:** If you insist it is rigorous, akin to logical proofs: How do we determine the *direction* of dependence? In a scenario where two FDT agents meet, both simulating each other, how do you avoid a regress where the dependence relation becomes circular or undefined? What breaks the symmetry?

  3. **Degradation Under Imperfect Prediction**
  In Parfit's Hitchhiker, FDT demands you pay the driver even after you are safe in the city. This verdict seems robust when the driver is Omega (perfect predictor). But the original case only posits a decent lie-detector, say 80% accurate. As the driver's reliability degrades toward 50% (random guessing), at what precise threshold does FDT switch its verdict to "don't pay"? Does the theory provide a smooth gradient of obligation, or does it suffer a cliff-edge failure where a 1% drop in predictor accuracy radically changes the rational action?

  *   **Follow-up:** If you argue it's a smooth expected-utility calculation: Doesn't this imply that an FDT agent should actively invest resources to make themselves *more* predictable to others? If rationality requires maximizing your own transparency to secure cooperation, does FDT inadvertently demand agents sacrifice privacy or strategic ambiguity?

  4. **Exploitability of Known Dispositions**
  If an FDT agent is knowably disposed to pay the driver in Hitchhiker because their algorithm dictates it, doesn't this make them vulnerable to parasitic strategies? If a third party knows your source code forces you to honor commitments to secure rides, can they construct a scenario where they offer you a ride only to immediately blackmail you, leveraging the very same disposition that saved you in the Hitchhiker case? Does FDT's solution to one problem create a liability in another?

  *   **Follow-up:** The standard FDT response is that you wouldn't pay the blackmailer because your decision determines whether the blackmail occurs. But if the blackmail threat is already *factually* sent (e.g., via a pre-recorded message) before you decide, does the subjunctive link still hold? If not, how does the agent distinguish between a "Hitchhiker promise" and a "Blackmail threat" without relying on causal timing, which FDT claims to transcend?

  5. **Formalizing Logical Counterfactuals**
  Causal Decision Theory relies on Pearl's causal graphs, which have a well-defined intervention operator (*do*-calculus). FDT relies on "logical counterfactuals," but there is currently no consensus in mathematics on how to formally evaluate counterfactuals about logical truths (e.g., "What if 2+2=3?"). Without a rigorous formalism for logical interventions, isn't FDT currently more of a philosophical intuition pump than a computable decision procedure?

  *   **Follow-up:** You might point to recent work in proof-based decision theory or modal UDT. But until we have a general theory of logical counterfactuals that handles inconsistent systems without explosion, isn't adopting FDT premature? Are we not building a normative theory on top of a mathematical object that doesn't fully exist yet?

  6. **Bounded Rationality and Regress**
  FDT requires an agent to evaluate the output of its own decision function across possible worlds. For a bounded agent with limited compute, simulating one's own source code to determine its output risks infinite regress or halting problems. How does a realistic, resource-constrained FDT agent approximate this self-simulation without falling into paradox or exhausting its computational budget before acting?

  *   **Follow-up:** If the answer is that the agent uses a "simplified model" of itself: Doesn't that reintroduce the gap between the model and the territory? If the model is inaccurate, the agent isn't actually running FDT, it's running a heuristic that *thinks* it's FDT. At what point does the approximation error cause the agent to defect in a one-shot Prisoner's Dilemma against a true FDT twin?

  7. **Common Knowledge in Multi-Agent Coordination**
  FDT shines in one-shot Prisoner's Dilemmas against similar agents, supposedly allowing cooperation without communication. However, this seems to require common knowledge of the agents' source codes or decision theories. In the real world, I rarely know if my counterpart is an FDT agent, a CDT agent, or a random defector. Does FDT collapse into CDT in environments of high uncertainty about opponent architecture, rendering it practically inert in most human social interactions?

  *   **Follow-up:** If you argue that FDT agents can infer similarity through signaling: Doesn't this just turn the interaction into a standard signaling game solvable by EDT? If the mechanism for cooperation is ultimately evidential (seeing a signal increases the probability they cooperate), what work is the *functional* part of the theory actually doing?

  8. **Evolutionary Stability and Learning**
  Can an FDT policy be learned via standard reinforcement learning, or must it be hardcoded? In an evolutionary environment where agents reproduce based on payoff, would an FDT population outcompete a CDT population? If CDT agents can free-ride on FDT cooperation without reciprocating (because they aren't subjunctively linked), wouldn't natural selection purge FDT agents from the gene pool?

  *   **Follow-up:** You may argue that FDT agents recognize CDT agents and defect against them. But this requires accurate classification. If misclassification is possible, and CDT agents can mimic FDT signals cheaply, doesn't the evolutionary stability of FDT depend on unrealistic assumptions about the cost of deception?

  9. **Normative Force and "Winning"**
  Finally, FDT is often justified by the slogan "Decision theories should win." But in cases like Parfit's Hitchhiker, the FDT agent pays the driver *after* the ride is complete, gaining no causal benefit from that specific action. They win only in the counterfactual sense that *if* they were the type to pay, they would have gotten the ride. Why should an agent care about winning in a counterfactual world that, by definition, did not happen? Is this a category error in how we define rational self-interest?

  *   **Follow-up:** If you reply that rationality is about choosing the best *algorithm* rather than the best *act*: Doesn't this dissolve the concept of agency entirely? If I am just a vessel for an algorithm's performance across all possible worlds, do "my" decisions matter at all, or am I merely observing the output of a mathematical function?
