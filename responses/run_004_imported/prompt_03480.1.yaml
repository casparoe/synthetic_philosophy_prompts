      *   **Skepticism via Mechanism:** Turing sought mechanistic explanations. If something couldn't be modeled or computed, it was suspect. However, he was open to "unorganized machines" (neural nets) learning.
      *   **Open-mindedness vs. Gullibility:** In 1950, the scientific consensus on ESP was more open than today, though contested. Turing's acceptance wasn't mystical; it was based on the *statistical appearance* of the data available to him at the time. He treated it as an empirical variable to be controlled for (hence the telepathy-proof room), not necessarily a metaphysical truth.
