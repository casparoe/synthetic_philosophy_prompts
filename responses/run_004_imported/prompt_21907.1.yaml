answer: |-
  **The Stain on the Gown: Anscombe, Truman, and the Ethics of Intention**

  In 1956, the University of Oxford prepared to award an honorary degree to Harry S. Truman. To the administration, it was a recognition of leadership during a pivotal decade; to the philosopher G.E.M. Anscombe, it was an act of institutional complicity in mass murder. Anscombe's resulting pamphlet, *Mr. Truman's Degree*, remains one of the most uncompromising texts in modern ethics. While the historical debate over the atomic bombings of Hiroshima and Nagasaki typically devolves into a utilitarian calculus of casualty counts, Anscombe refused to play that game. She argued that the morality of an action is determined by the intention of the agent, not the consequences of the act. When weighed against the standard consequentialist defenses of the bombing, Anscombe's deontological framework offers a more robust protection of human dignity. While the consequentialist argument relies on speculative history and dangerous moral precedents, Anscombe's intention-based verdict holds: Truman's decision was ethically indefensible because it intentionally targeted the innocent as a means to an end, constituting murder regardless of the war's outcome.

  To understand Anscombe's outrage, one must understand her distinction between *foreseen* consequences and *intended* means. This is rooted in the Doctrine of Double Effect, which posits that it is sometimes permissible to perform an action that has a bad side effect (such as civilian deaths during a strike on a military factory), provided the bad effect is not the means by which the good end is achieved. However, Anscombe argued that the atomic bombings did not fit this exception. The destruction of Hiroshima and Nagasaki was not a case of civilians dying *near* a target; the civilians and their cities *were* the target. The United States government sought to break the Japanese will to fight by demonstrating the capacity to annihilate urban populations. Therefore, the killing of non-combatants was not an unfortunate byproduct of victory; it was the instrument of victory. For Anscombe, this makes the intention murderous. As she wrote, "For men may not do evil that good may come." If the act is intrinsically evil—killing the innocent—the goodness of the result (ending the war) cannot cleanse it.

  The standard defense against this charge is purely consequentialist. Proponents argue that the atomic bombs were a "lesser evil" necessary to prevent Operation Downfall, the planned invasion of the Japanese home islands. The utilitarian calculus suggests that the roughly 200,000 deaths caused by the bombs were morally preferable to the estimated hundreds of thousands of Allied casualties and millions of Japanese military and civilian deaths that an invasion or prolonged blockade would have incurred. From this perspective, Truman had a moral duty to minimize total suffering. If refusing to drop the bomb would have resulted in more death, then the consequentialist argues, *not* dropping the bomb would have been the immoral choice. This framework shifts the ethical burden from the nature of the act to the arithmetic of the outcome.

  However, the consequentialist defense crumbles when scrutinized through Anscombe's lens, primarily because it reduces human beings to negotiable variables. By accepting the premise that innocent lives can be traded for a "greater good," the utilitarian argument erodes the concept of inalienable rights. If Truman was justified in killing 200,000 civilians to save a hypothetical million, what principle prevents a future leader from killing 10,000 civilians to save a hypothetical 100,000? Anscombe's argument acts as a firewall against this slippery slope. She contends that there are moral absolutes that statecraft cannot override. To argue that the bombings were justified because they worked is to validate the idea that the ends always justify the means. This is a dangerous precedent for international ethics, as it grants governments the license to commit atrocities whenever they can construct a plausible narrative of necessity.

  Furthermore, the consequentialist defense relies on historical speculation that can never be proven, whereas the intentional nature of the act is a matter of record. We cannot know with certainty that Japan would not have surrendered prior to an invasion, nor can we know if the Soviet declaration of war might have achieved the same result without the bombs. Utilitarianism demands we bet on the future to justify the present. Anscombe's deontology requires we judge only what was done. It is a historical fact that the United States intentionally targeted civilian centers. It is a matter of debate whether the invasion would have been bloodier. Ethically, it is more sound to condemn a certain evil (the intentional killing of innocents) than to justify it based on an uncertain prediction of future carnage. By focusing on the intention, Anscombe forces us to confront the reality of what was done, rather than hiding behind what might have happened.

  Ultimately, we must commit to a verdict on the ethical framework itself, not just the historical event. The consequentialist argument is seductive because it promises a clean conscience through math; it suggests we can sin without guilt if the balance sheet ends in the black. But this is a moral illusion. Anscombe's rigor is necessary because it preserves the sanctity of individual life against the crushing weight of state utility. If we accept the consequentialist defense of Truman, we admit that no civilian is safe from destruction so long as a government believes their death serves a strategic purpose.

  Therefore, Anscombe was right to protest Oxford's decision. Harry Truman may have been a leader who navigated the end of a brutal war, but regarding the atomic bombings, he is guilty of what Anscombe termed murder. This verdict is not a denial of the war's horror or the pressure Truman faced, but a reaffirmation that some actions are forbidden even in the face of catastrophe. To honor Truman for the bombs is to endorse the principle that innocent human beings are expendable resources. In an era where drone warfare and total war continue to blur the lines between combatant and civilian, Anscombe's insistence on the morality of intention is not merely a historical footnote; it is an urgent requirement for justice. The bombs ended the war, but they did so by violating a moral law that should remain unbroken.
