  3.  **Deconstruct the Consequentialist Defense:**
      *   *Core Principle:* The right action is the one that produces the best overall outcome (maximize happiness/minimize suffering).
      *   *Application to Truman:* Invasion of Japan (Operation Downfall) would have cost hundreds of thousands of Allied lives and millions of Japanese lives (military and civilian). Bombing ended the war quickly.
      *   *Conclusion:* The bombs were a tragic necessity that minimized total suffering.

  4.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy and relevant. *The Absolutist and the Accountant*? *Intent vs. Outcome*? Let's go with something about the "Stain" Anscombe mentions. *The Stain on the Gown: Anscombe, Truman, and the Ethics of Intention.*

