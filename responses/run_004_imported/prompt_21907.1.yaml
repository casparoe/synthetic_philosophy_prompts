      *   **Body Paragraph 1: Anscombe's Core Argument (The Doctrine of Double Effect):**
          *   Explain the distinction between *foreseeing* death and *intending* death.
          *   Apply to Hiroshima: The US didn't just bomb a factory near houses; they bombed the city *to* kill/m terrorize.
          *   Quote/Reference: "mass murder," "innocent."
          *   Significance: It makes the act intrinsically evil, regardless of the "good" outcome.

      *   **Body Paragraph 2: The Consequentialist Counter (The "Lesser Evil"):**
          *   Present the standard defense strongly (Operation Downfall, Soviet invasion, Japanese refusal to surrender).
          *   The math: 200k dead vs. 1M+ dead.
          *   The logic: Moral responsibility extends to *omissions* (not bombing = more deaths).
          *   Weakness: It relies on speculative history (would Japan have surrendered anyway?) and reduces humans to numbers.

      *   **Body Paragraph 3: The Clash - Why Consequentialism Fails Here:**
          *   Critique the utilitarian calculus. It justifies *anything* if the numbers work.
          *   Anscombe's point: If we allow the killing of innocents for the "greater good," we destroy the concept of justice.
          *   The "Slippery Slope" or "Precedent": If Truman is justified, what stops future leaders from nuking cities for "peace"?
          *   The specific nature of the Atomic Bomb: It makes the killing of civilians the *primary* mechanism of victory, not a side effect.

      *   **Body Paragraph 4: Addressing the "Necessity" Claim:**
          *   Even if it was necessary (consequentialist view), does necessity make it moral (deontological view)?
