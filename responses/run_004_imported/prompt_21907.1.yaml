      *   **Context:** Ethics elective overlapping with APUSH WWII unit.
      *   **Tone:** Academic, persuasive, analytical.

  2.  **Deconstruct Anscombe's Argument ("Mr. Truman's Degree"):**
      *   *Core Principle:* It is never permissible to intentionally kill the innocent. This is an absolute moral prohibition.
      *   *Distinction:* Foreseen side effects vs. intended means/ends. (Doctrine of Double Effect).
      *   *Application to Truman:* The bombing wasn't just "collateral damage." The destruction of the cities and the killing of civilians *was* the method used to force surrender. Therefore, the killing was intended.
      *   *Conclusion:* Truman committed murder. Honoring him is complicity in evil.
