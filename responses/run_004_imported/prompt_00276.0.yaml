answer: |-
  This is an excellent question, and your skepticism is well-founded. In philosophy of science circles, the charge that Structural Realism is merely a "retreat to the equations" is a standard objection. If you push a structural realist hard enough, they will admit: yes, it is a retreat. But they argue it is a strategic retreat to higher ground, not a rout.

  To give you the texture you need for your piece, we have to move beyond the slogan ("save the structure, dump the ontology") and look at the *mechanism* of theory change that structuralists claim protects the math. The argument isn't just that structure *has* survived historically; it's that there are specific logical and methodological constraints on how science progresses that *force* structure to survive in ways that ontology isn't forced to.

  Here is a breakdown of how a sophisticated structural realist answers the "meta-level" pessimistic induction, grounded in the mechanics of theory construction.

  ### 1. The Distinction Between "Working" and "Idle" Posits
  The most common caricature of structural realism is that it draws a line between "math" (good) and "words/ontology" (bad). That is too crude. The more precise distinction, championed by realists like Peter Vickers and historically rooted in Worrall, is between **working posits** and **idle posits**.

  *   **Working Posits:** The specific assumptions, mathematical or otherwise, that are actually *responsible* for the theory's novel predictive success.
  *   **Idle Posits:** The explanatory gloss or metaphysical baggage wrapped around the working posits that does no heavy lifting for the predictions.

  In the Fresnel/Maxwell case you mentioned, the **ether** was an idle posit regarding the calculation of reflection and refraction coefficients. You can derive the Fresnel equations using the ether model, but the specific nature of the ether (elastic solid, luminiferous medium, etc.) drops out of the final calculation. What remains are the **boundary conditions** and the wave relations.

  When Maxwell came along, he didn't just "keep the math." He showed that the *structural relations* governing electromagnetic propagation were isomorphic to the relations governing light. The structural realist argues that the *reason* the math survived is that it was tracking real constraints in nature, whereas the ether was a specific *model* of what satisfied those constraints.

  **The Grounding Claim:** The meta-induction fails because it treats theories as monolithic blocks. It says "Caloric theory was false." The structuralist says, "Caloric theory contained a working posit (conservation principles/flow equations) and an idle posit (caloric fluid as a material substance)." The working posit was absorbed into thermodynamics; the idle posit was discarded. The induction only holds if you can't distinguish the two. Structuralists claim we *can* distinguish them by looking at what actually generated the successful prediction.

  ### 2. The Correspondence Principle as a Constraint
  This is the strongest argument for why structure is "stickier" than ontology. It relies on the **Correspondence Principle** (often associated with Bohr, but applicable generally).

  When a new theory supersedes an old one (e.g., General Relativity superseding Newtonian Gravity), it is not allowed to simply contradict the old theory everywhere. It must reproduce the old theory's results in the domain where the old theory was known to work (the "limiting case").
  *   Newtonian gravity works fine for low speeds and weak fields.
  *   Therefore, Einstein's field equations *must* mathematically reduce to Newton's inverse-square law in those limits.

  **Why this matters for the PMI:**
  This creates a mathematical "ratchet effect." Ontology can be swapped out completely (forces become curvature; fluids become fields), but the *structural relationships* in the limiting cases are locked in by empirical data that the new theory must account for.

  The structural realist argues that the pessimistic meta-induction ignores this constraint. Yes, past theories were "false," but they weren't *arbitrarily* false. They were approximately structurally correct in their domain of application. The meta-induction assumes theory change is revolutionary in a way that wipes the slate clean. Structuralists argue theory change is evolutionary regarding structure because of the requirement to recover past empirical successes.

  **The Journalistic Angle:** You can frame this as "empirical friction." Ontology is slippery because it's an inference about what's *behind* the phenomena. Structure is sticky because it's bolted directly to the phenomena. To change the structure, you have to explain why the old structure worked so well in its domain. To change the ontology, you just need a better story.

  ### 3. Addressing the "Meta-Level" Induction (Do Structures Break?)
  Your specific worry is: *"Presumably historians of science can also dig up cases where the structure itself failed to carry over."*

  They certainly can. The transition from Newtonian absolute space to Relativistic spacetime is a structural break. The transition from classical commutative algebra to quantum non-commutative algebra is a structural break.

  The structural realist's reply here is nuanced. They do not claim **Total Structural Preservation**. They claim **Partial Structural Preservation of the Generative Core.**

  *   **The Concession:** Yes, the global mathematical framework can change (e.g., the geometry of spacetime).
  *   **The Defense:** However, the *local* structural relations that yielded specific, novel predictions are usually preserved as limiting cases or approximations.

  For example, while the *structure* of spacetime changed from Newton to Einstein, the structural relations governing planetary orbits in the solar system were preserved to a high degree of approximation. The PMI argues that because *some* structure changes, we should trust *no* structure. The structuralist argues this is a hasty generalization. The track record shows that while *interpretive frameworks* (ontology) are almost always discarded, *predictive algorithms* (structure) are rarely discarded entirely; they are usually subsumed.

  **Peter Vickers' Contribution:**
  Philosopher Peter Vickers has refined this by looking at "convergent realism." He argues we should look for **essential derived claims**. If a specific mathematical claim was essential to a novel prediction, and that prediction stood the test of time, that claim is likely "structurally true" even if the theory containing it was later replaced. This moves the argument from "Math survives" to "The specific mathematical components responsible for success survive."

  ### 4. Why Structure is Epistemically Privileged
  Finally, to answer *"what actually grounds the claim that mathematical structure is more likely to be preserved,"* the structuralist leans on the nature of empirical access.

  We do not observe entities (electrons, genes, quarks). We observe **effects** and **relations**.
  *   We see tracks in a cloud chamber.
  *   We see diffraction patterns.
  *   We see spectral lines.

  These are all relational data points. When we build a theory, the mathematical structure is a direct map of these relations. The ontology (e.g., "the electron is a little spinning ball of charge") is a *model* we build to visualize why the relations hold.

  **The Argument:**
  1.  Our empirical access is structural (we measure relations between events).
  2.  Our theories are judged by how well they map these relations.
  3.  Therefore, the part of the theory most tightly constrained by evidence is the structure.
  4.  The ontology is under-constrained by evidence (multiple ontologies can fit the same structure).

  Because the structure is more tightly constrained by the data, it is less likely to be "wrong" in the future than the ontology, which is essentially a guess about the underlying mechanism. The PMI assumes that because we were wrong about the *mechanism* (ether), we must be wrong about the *constraints* (Maxwell's equations). The structuralist says the constraints are what the data actually supports; the mechanism was always speculative.

  ### Summary for your Piece
  If you are looking for a narrative hook, consider this:

  The Pessimistic Meta-Induction treats scientific history as a graveyard of dead theories. Structural Realism treats it as a construction site where the scaffolding is constantly rebuilt, but the load-bearing walls remain.

  The structural realist admits the retreat: "We cannot know the *nature* of reality." But they argue this isn't a loss. Science never gave us the nature of reality; it gave us the *rules* of reality. The PMI says, "You were wrong about the rules before." The Structuralist replies, "We were wrong about the *players*, but the *rules of the game* we wrote down then are still the rules we play by now, just with a better understanding of the board."

  The grounding for this isn't faith; it's the **Correspondence Principle**. New theories are legally bound to reproduce the structural successes of old theories in the old domains. Ontology has no such legal bound. That is why structure has a better survival rate: it is handcuffed to the data in a way that metaphysical stories are not.

  **The Weakness to Acknowledge:**
  To be balanced, you should note the "structuralist's dilemma." If structure is just about predicting observations, isn't this just Instrumentalism (anti-realism) in disguise? If you say "we don't know what the electron *is*, only how it *behaves*," have you really saved Realism? Worrall says yes, because the structure exists independently of us (it constrains us). Critics say no, because without ontology, structure is just a map without a territory. This tension is where the live debate is today.
