answer: |-
  Good morning. It is an honor to welcome you to this workshop.

  For the next three days, you will be grappling with one of the most difficult tasks in modern adjudication. You are being asked to stand at the gate between the courtroom and the laboratory. Under *Daubert*, you are no longer passive recipients of expert knowledge; you are active gatekeepers. You must decide when a claim is sufficiently "scientific" to be placed before a jury, and when it is merely speculation dressed in a white coat.

  The Supreme Court, in its wisdom, offered you a list of factors to consider. The first, and perhaps most famous, is testability. Can the theory be tested? Has it been tested? This is the legacy of Karl Popper, the 20th-century philosopher who argued that what makes science *science* is not that it can be proven true, but that it can be proven false.

  I teach the philosophy of science. I have colleagues in this room—sitting right there, in fact—who spend their careers analyzing the demarcation problem. If I were giving my usual undergraduate lecture, I would spend the next twenty minutes explaining why Popper is controversial, why the demarcation problem is technically unsolved, and why distinguishing science from non-science is philosophically messy.

  But I am not here to give an undergraduate lecture. And my colleagues know that if I tell you the problem is unsolvable, I haven't helped you do your jobs. You have rulings to write. You have cases to manage. You need tools, not puzzles.

  So, here is my promise to you, and to my colleagues in the audience: I will not pretend that falsifiability is a magic switch that turns "junk" into "science." Instead, I want to use the next ten minutes to show you exactly *how* falsifiability works as a tool, where its blade is sharpest, and where it might dull. If you understand the strength and the limit of this criterion, you will be better equipped to use it than if you simply treated it as a statute.

  Let's begin with the strength. Why did the Supreme Court latch onto Popper?

  Popper's insight was psychological. He noticed that human beings are naturally prone to confirmation bias. We look for evidence that supports what we already believe. If I believe a defendant is guilty, I notice the inconsistencies in his alibi. If I believe he is innocent, I notice the gaps in the prosecution's timeline.

  Science, Popper argued, is the institutionalized cure for this bias. A genuine scientific theory sticks its neck out. It makes a prediction that risks being wrong. Einstein's theory of general relativity didn't just say "gravity exists." It said, "If you look at the sun during an eclipse, light will bend at exactly this specific angle." If the light hadn't bent, the theory would have died.

  In your courtroom, this is the strength of the falsifiability criterion. It shifts your focus from the *conclusion* to the *risk*. When an expert takes the stand, the question is not "Is this expert smart?" or "Is this conclusion reasonable?" The question is: "Did this methodology expose itself to the possibility of failure?"

  This gives you a powerful heuristic for cross-examination. When you review a proffered expert's methodology, look for the "error rate." Look for the control group. Look for the blind trial. These are not just bureaucratic boxes to check; they are mechanisms designed to prove the expert wrong. If an expert's methodology has no mechanism for detecting its own errors, it isn't science. It is advocacy.

  For example, if a forensic analyst testifies that a specific soil composition matches a defendant's shoe, but they cannot tell you the rate at which that soil composition occurs in the general population, they have not stuck their neck out. They have offered a match without a risk of mismatch. That is the strength of falsifiability: it demands intellectual honesty. It forces the expert to tell you what would have changed their mind.

  However, this is where I must honor the complexity my colleagues in the back row know too well. If falsifiability were simple, we wouldn't need a three-day workshop. We would just ask, "Can it be falsified?" and move on.

  The limit of falsifiability is that theories rarely die easily.

  In philosophy, we call this the "protective belt" problem. When a prediction fails, scientists rarely throw out the core theory immediately. Instead, they adjust the periphery. They blame the equipment. They blame the sample size. They blame the environmental conditions.

  Imagine an expert testifies that a specific drug causes a specific birth defect. The defense produces a study showing no such link. A rigid application of falsifiability might suggest the expert's theory is dead. But the expert replies, "Ah, but that study used a dosage that was too low," or "The population sample was too young."

  Is this a legitimate scientific refinement? Or is it a "get out of jail free" card to save a failing theory?

  This is the danger zone for you as judges. If you treat falsifiability as a binary checklist, you risk excluding cutting-edge science that hasn't yet been fully standardized. But if you allow experts to explain away every failed test as "contextual," you risk admitting junk science that is immune to criticism.

  So, how do we navigate this? How do we take a philosophical problem and turn it into a judicial standard?

  We do it by shifting the question from "Is it falsifiable?" to "Has the proponent engaged with the falsification?"

  You are not asking whether the theory *could* be wrong in the abstract. You are asking whether the expert *treated* it as if it could be wrong in practice. This gives you three concrete questions to ask during your *Daubert* hearings.

  **First: What would change your mind?**
  If an expert cannot articulate a specific piece of evidence that would cause them to abandon their conclusion, they are not operating scientifically. If the answer is "Nothing, the data supports me," be wary. Science is not about certainty; it is about probability. An expert who claims 100% certainty is usually hiding the risk.

  **Second: Where is the risk in your method?**
  Ask the expert to identify the weakest link in their own chain of reasoning. A reliable expert will say, "Well, the spectroscopy is solid, but the database we compared it to is ten years old." An unreliable expert will claim every step is flawless. If they haven't identified the risk, they haven't managed it.

  **Third: Have you looked for the black swan?**
  This is the most critical question. Did the expert merely gather evidence that supported their hypothesis, or did they actively search for evidence that contradicted it? In litigation, experts are hired by sides. It is human nature to look for the evidence that helps the client. Your job is to ensure that the methodology compelled them to look at the evidence that hurts the client, too. If a methodology allows an expert to ignore contradictory data without a principled reason, that methodology is not falsifiable in practice, even if it is in theory.

  My colleagues in the philosophy department might tell you that this doesn't solve the demarcation problem. They are right. There is no algorithm that perfectly separates science from non-science in every conceivable case. Science is a human practice, messy and evolving.

  But you are not philosophers. You are judges. You do not need to solve the demarcation problem for the ages. You only need to solve it for the case at hand.

  You do not need to decide if a field is "True Science." You need to decide if the testimony is "Reliable Enough."

  Falsifiability is not a verdict; it is a vibe check for intellectual rigor. It is a way to sniff out whether an expert is trying to find the truth, or just trying to win.

  When you sit in those hearings, remember that Popper's criterion is not a shield for the expert to hide behind. It is a sword for you to use. It allows you to cut through credentials and prestige and ask the only question that matters: "If you were wrong, how would we know?"

  If they have an answer, listen closely. If they don't, you have your ruling.

  Over the next three days, the speakers here will give you the doctrinal details, the case law, and the specific scientific domains you will encounter. But keep this philosophical core in mind. The law demands reliability. Science achieves reliability through vulnerability.

  Your job is to ensure that the experts who stand in your courtroom are vulnerable enough to be trusted.

  Thank you, and I look forward to the work we will do together.
