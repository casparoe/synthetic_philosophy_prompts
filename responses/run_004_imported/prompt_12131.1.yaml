prompt: |-
  I help run a small mutual aid fund in my city — just five of us volunteers pooling monthly donations (usually a few thousand bucks total) and sending one-time cash grants to people who hit an eviction notice, a medical bill, a shutoff notice, whatever. We always get 3-4x more requests than we can fund, so every single month is a rationing problem.

  For the past year our policy has been a "need index": a volunteer scores each application 1-10 on income, dependents, how dire the situation sounds, etc, and we fund the top scores until the money's gone. One of our newer volunteers has been on an economics kick lately (started with a Robin Hanson post and spiraled from there) and now argues the whole index is confused at the root. His point is basically that Robbins showed back in the 30s that you can't actually compare how much a marginal $400 matters to person A vs person B — it's not an empirical fact waiting to be measured, its a value judgment wearing a lab coat, which is exactly why later economists like Kaldor and Hicks built "compensation" tests specifically to dodge ever needing interpersonal comparisons at all. So he says our 1-10 score is fake precision dressed up as data, and we should switch to a weighted lottery among everyone who clears a basic eligibility bar, so we stop pretending to rank suffering we can't actually rank. Two of the other volunteers think this is well-actually-ing an obviously decent practice — surely some need comparisons are more defensible than others, the guy about to be literally homeless vs the guy short on a phone bill isnt a close call.

  I've lurked on LW and the EA forum for years and this might be the first time this stuff has had real stakes attached instead of being a trolley-problem thought experiment. We vote on next month's policy in two weeks. Could you draft the memo I'll circulate beforehand? I need it to actually land on a recommendation we could run starting next cycle, not just "here are both sides" — but I want it to genuinely wrestle with the interpersonal-comparisons objection instead of waving it off as pedantry, because I suspect he's onto something even if the lottery fix feels wrong to me.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** A small mutual aid fund (5 volunteers, few thousand dollars/month).
      *   **Problem:** Demand exceeds supply (3-4x). Current policy: "Need Index" (scoring 1-10 based on income, dependents, direness).
      *   **Conflict:** A new volunteer (econ-minded) argues the Need Index relies on invalid interpersonal utility comparisons (citing Robbins, Kaldor-Hicks). He proposes a weighted lottery among eligible applicants.
      *   **Counter-argument:** Other volunteers believe some need comparisons are defensible (homelessness vs. phone bill).
      *   **Goal:** A memo to circulate before the vote.
      *   **Requirements:**
          *   Must make a specific recommendation (not just "here are both sides").
          *   Must genuinely engage with the interpersonal comparison objection (not dismiss it as pedantry).
          *   Must be actionable for the next cycle.
          *   Tone: Thoughtful, rigorous, practical, community-oriented (LW/EA adjacent audience).

  2.  **Deconstruct the Economic/Philosophical Objection:**
      *   *The Objection:* Lionel Robbins (1930s) argued that utility is ordinal, not cardinal, and interpersonal comparisons of utility are scientifically meaningless. We can't know if $400 saves Person A from more suffering than Person B. Therefore, scoring "need" is subjective value judgment disguised as objective data.
      *   *The Counter:* In practice, we make these judgments constantly (triage in ER, disaster relief). While *perfect* comparison is impossible, *rough* heuristics (housing stability > utility bill) are socially agreed upon and operationally necessary.
      *   *The Lottery Proposal:* Solves the "fake precision" problem. Treats equals equally. But introduces variance risk (high need might get skipped).

  3.  **Determine the Recommendation:**
      *   *Option A: Stick with Need Index.* Ignores the valid critique about precision bias.
      *   *Option B: Pure Lottery.* Too risky for a mutual aid fund where preventing catastrophe is the goal.
      *   *Option C: Hybrid/Tiered Lottery.* This is the strongest middle ground. It acknowledges the Robbins critique (we can't fine-tune within margins) but respects the practical reality (homelessness > phone bill).
      *   *Decision:* Recommend a **Tiered Weighted Lottery**.
          *   Tier 1: Existential threats (eviction, shutoff, medical emergency).
          *   Tier 2: Stability threats (rent arrears but no notice, car repair for work).
          *   Tier 3: Other needs.
          *   Fund Tier 1 first. If money remains, lottery among Tier 2.
          *   Within Tier 1, use a weighted lottery (higher risk = higher weight) rather than a strict rank order. This reduces the "fake precision" of a 1-10 score while still prioritizing the most dire.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Clear, professional but community-focused.
      *   **Opening:** Acknowledge the tension. Validate the new volunteer's point (Robbins is right theoretically) but frame the practical constraint.
      *   **The Core Philosophical Tension:** Briefly explain *why* the objection matters. It's about humility and epistemic honesty. Admit the 1-10 score creates an illusion of granularity we don't have.
      *   **The Risk of Pure Lottery:** Explain why a flat lottery fails the mission (catastrophe prevention).
      *   **The Proposal (Tiered Weighted Lottery):**
          *   *Eligibility Bar:* Clear cut (e.g., formal notice).
          *   *Tiers:* Broad categories instead of 1-10 scores.
          *   *Allocation:* Fund top tier first.
          *   *Selection:* Lottery within tiers (perhaps weighted by urgency).
      *   **Why This Works:** Addresses Robbins (no fine-grained comparison), addresses Mission (prioritizes catastrophe), addresses Fairness (randomness among equals).
      *   **Implementation:** Concrete steps for the next cycle.
      *   **Closing:** Invite feedback/vote.

  5.  **Refining the Tone:**
      *   Avoid jargon where possible, but keep the economic references (Robbins, ordinal utility) to show respect for the argument.
      *   Keep it humble. "We are guessing, let's guess better."
      *   Ensure it sounds like a mutual aid group (solidarity, care) not a hedge fund.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the tiered system just the Need Index in disguise?
      *   *Fix:* Emphasize that within a tier, there is *no ranking*. If two people face eviction, we don't score who is "more" evicted. We lottery them. This directly addresses the "fake precision" critique.
      *   *Critique:* Is weighted lottery too complex?
      *   *Fix:* Keep weights simple (e.g., 24 hours vs 7 days notice). Or just keep it unweighted within the top tier for simplicity. Let's suggest *weighted* to acknowledge that even within "eviction," timing matters, but keep the weights coarse (1x, 2x, 3x) not 1-10.
      *   *Check:* Did I answer the prompt's requirement to "wrestle with the interpersonal-comparisons objection"? Yes, by admitting the 1-10 scale is epistemically shaky but arguing that broad categorical distinctions are socially robust.

  7.  **Final Polish:** Check length, clarity, and ensure the recommendation is unambiguous. (The resulting memo below follows this structure.)

  8.  **Final thought:** Make sure to explicitly mention that this is a "satisficing" solution (Simon) rather than an optimizing one, which fits the EA/LW background of the user.

  *(Self-Correction during final output generation)*: I need to make sure I don't sound *too* academic. The user said they lurk on LW/EA, so they get the concepts, but the other volunteers might not. The memo needs to bridge that gap. I will keep the economic references but explain their practical implication clearly.

  Let's write the memo.cw
answer: |-
  **MEMORANDUM**

  **TO:** Mutual Aid Fund Volunteer Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal for Policy Adjustment: Tiered Weighted Lottery

  ### 1. Context and Objective

  We are facing a consistent rationing problem: demand for grants exceeds our monthly liquidity by 3–4x. Our current mechanism is a "Need Index" (scoring applications 1–10). A valid objection has been raised that this index relies on interpersonal utility comparisons that are theoretically impossible to verify (the Robbins objection), creating an illusion of precision that may introduce bias without increasing efficacy.

  This memo evaluates that objection and proposes a new allocation policy for the November cycle: **A Tiered Weighted Lottery.**

  My recommendation is to adopt this hybrid model immediately. It preserves our mission priority (preventing catastrophe) while accepting the epistemic humility required by the economic critique.

  ### 2. The Core Objection: Why the "Need Index" is Fragile

  The argument against our current 1–10 scoring system is not merely semantic; it is operational.

  *   **The Theoretical Point:** As noted, Lionel Robbins and subsequent welfare economists established that we cannot empirically compare how much Unit X of money helps Person A versus Person B. Utility is ordinal, not cardinal. When we score Application A as an "8" and Application B as a "7," we are not measuring a physical quantity; we are encoding our own subjective values as data points.
  *   **The Practical Risk:** This "fake precision" creates two problems for us:
      1.  **Volunteer Drift:** Different volunteers score "direness" differently. One person's "7" is another's "9." Over time, the index measures volunteer psychology more than applicant need.
      2.  **Marginal Errors:** The index implies we can distinguish between the 4th and 5th ranked applicant with confidence. In reality, the margin of error in our scoring likely exceeds the gap between those ranks. Rejecting the 5th applicant to fund the 4th may be random noise disguised as deliberation.

  We cannot dismiss this as pedantry. If our scoring is noisy, we are rationing based on artifacts of our spreadsheet rather than reality.

  ### 3. Why a Pure Lottery is Insufficient

  The proposed alternative—a weighted lottery among all eligible applicants—solves the precision problem but fails the mission test.

  Our fund exists to prevent specific catastrophes (homelessness, utility shutoffs, medical crises), not to distribute general wealth. A flat lottery treats a request for a phone bill the same as a request for back rent after an eviction notice. While we cannot compare *utility* perfectly, we can compare *physical circumstances*. We know with high confidence that an eviction notice carries a higher risk of homelessness than a phone bill does. Ignoring that distinction violates our mandate to prioritize the most vulnerable.

  ### 4. Recommendation: The Tiered Weighted Lottery

  We should move from a **Continuous Score** model to a **Categorical Tier** model. This acknowledges that while we cannot rank suffering finely, we can distinguish broad levels of risk.

  **The Mechanism:**

  1.  **Eligibility Bar:** Applications must include documentation of a threat (notice, bill, statement). No documentation, no entry.
  2.  **Tiers (Categorical, not Scalar):** We sort eligible applications into three buckets. There is no scoring within buckets.
      *   **Tier 1 (Existential):** Eviction notices, foreclosure notices, utility shutoff warnings, emergency medical procedures.
      *   **Tier 2 (Stability):** Rent arrears (no notice yet), car repair required for employment, essential appliance replacement.
      *   **Tier 3 (General):** Other financial gaps impacting quality of life.
  3.  **Allocation Flow:**
      *   We fund Tier 1 first until funds are exhausted.
      *   If funds remain, we move to Tier 2, and so on.
  4.  **Selection Within Tiers:**
      *   If Tier 1 demand exceeds funds, we do **not** rank them. We run a **weighted lottery**.
      *   *Weighting:* We can apply coarse weights based on timeline (e.g., eviction in 48 hours gets 3 tickets; eviction in 2 weeks gets 1 ticket). This avoids the 1–10 trap while acknowledging urgency.

  ### 5. Why This Works

  This approach synthesizes the valid insights from both sides of our debate:

  *   **It respects the Robbins Critique:** By eliminating the 1–10 score, we admit we cannot measure "need" precisely. We stop pretending we know that an "8.5" deserves funding more than an "8.0." Among people facing the same *category* of threat, we treat them as equals and let chance decide.
  *   **It respects the Mission:** By using tiers, we acknowledge that some physical circumstances are objectively more precarious than others. We do not lottery a phone bill against an eviction notice.
  *   **It reduces Volunteer Bias:** It is much harder for a volunteer to unconsciously bias a categorical sort (Does this paper say 'eviction'? Yes/No) than a subjective score (How 'dire' does this sound?).
  *   **It is Psychologically Sustainable:** For the volunteers, it removes the burden of playing God with fine margins. For the applicants, a lottery among peers facing eviction feels fairer than being told their eviction was "less severe" than a stranger's by 0.5 points.

  ### 6. Implementation for Next Cycle

  If approved, I propose we implement the following changes for the November round:

  1.  **Retire the Scoring Sheet:** Replace the 1–10 rubric with a Tier Checklist.
  2.  **Define Tier 1 Strictly:** To avoid "tier creep," Tier 1 requires a formal document with a date (e.g., court filing, utility notice).
  3.  **Transparent Communication:** We update our public materials to state: *"Due to high demand, grants for similar emergency levels are awarded via lottery to ensure fairness."* This manages expectations better than a rejection based on a "score."

  ### 7. Conclusion

  The objection that we cannot compare interpersonal utility is correct. However, the conclusion that we therefore cannot prioritize at all is incorrect. We can prioritize based on **risk categories** rather than **utility estimates**.

  A Tiered Weighted Lottery allows us to be humble about what we can know (exact suffering) while remaining decisive about what we can see (eviction notices). It is a robust, defensible system that honors both our economic constraints and our moral mission.

  I move we adopt this policy for the November cycle.

  ***

  **Discussion Questions for the Vote:**
  1. Are the proposed Tier definitions clear enough to prevent ambiguity?
  2. Do we agree on the weighting mechanism for urgency within Tier 1?
  3. Are there any edge cases (e.g., medical bills without immediate shutoff risk) that need specific tier placement?
