answer: |-
  You are not imagining this, and you aren't necessarily "rationalizing guilt." You have stumbled onto one of the most famous and robust findings in modern moral psychology.

  There is a specific name for exactly what you are describing: **The Knobe Effect** (also known as the *Side-Effect Effect*).

  Discovered by philosopher Joshua Knobe in 2003, this phenomenon demonstrates that people's judgment of whether an action was done "intentionally" depends heavily on whether the outcome is morally good or bad. Our brain does not treat "intent" as a neutral, mechanical fact; it treats it as a moral tool.

  Here is the breakdown of why this is happening, why your sister is partially right (but for the wrong reasons), and what this means for your shop.

  ### 1. The Experiment That Matches Your Life
  Knobe presented participants with a vignette almost identical to your situation.

  *   **The Harm Condition:** A CEO is told a new program will increase profits but *harm* the environment. The CEO says, "I don't care at all about harming the environment, I just want to make as much profit as I can." The program goes ahead, and the environment is harmed.
      *   *Result:* The vast majority of people say the CEO **intentionally** harmed the environment.
  *   **The Help Condition:** A CEO is told a new program will increase profits but *help* the environment. The CEO says, "I don't care at all about helping the environment, I just want to make as much profit as I can." The program goes ahead, and the environment is helped.
      *   *Result:* The vast majority of people say the CEO did **not** intentionally help the environment. It was just a side effect.

  **This is your exact scenario.**
  *   **You:** The CEO.
  *   **Profit:** Cutting labor costs.
  *   **Priya:** The Environment (Harm).
  *   **Tom:** The Environment (Help).

  Your staff is reacting exactly like the participants in the study. When the outcome is bad (Priya), they perceive your indifference as malice ("He did it on purpose"). When the outcome is good (Tom), they perceive your indifference as neutrality ("It was just a lucky accident").

  ### 2. Why Do Humans Do This?
  You asked if people are just being inconsistent because one story is sad. In a way, yes, but it's deeper than that. Psychologists believe this happens because **blame requires intent, but praise requires motive.**

  *   **For Blame (Priya):** When we see harm, our brains go into "threat detection" mode. We need to identify a cause to prevent it from happening again. If we label your action as "intentional," it makes you a threat that needs to be managed or punished. Your statement ("I don't care") is interpreted as *sufficient* intent for harm. In moral terms, recklessness regarding harm is often treated the same as intentional harm.
  *   **For Praise (Tom):** When we see a benefit, we look for *virtue*. Did you do it *because* it was good? Since you explicitly said you didn't care about the benefit, you don't get moral credit. You didn't act *for the sake of* Tom, so you aren't a "hero," you're just a neutral agent who happened to land on a good outcome.

  So, to answer your question: **Yes, there is something real going on.** It is not just inconsistency; it is a fundamental feature of how human beings assign moral responsibility. We expand the definition of "intentional" to catch bad actors, and we shrink the definition of "intentional" to avoid giving credit to neutral actors.

  ### 3. Where Your Sister Has a Point (The Management Angle)
  Your sister says you are rationalizing because you "deep down cared more about hurting Priya." The psychology suggests she is wrong about your internal state (you likely *were* indifferent to both), but she might be right about the **impact of your words.**

  You mentioned you said word-for-word: *"I dont care one way or the other whether this messes with Priya's hours, I just want the labor cost down."*

  While your *goal* was cost-cutting, that specific sentence is managerial kryptonite.
  *   **Indifference to Harm:** In a small business (5 employees), relationships are personal. Saying you "don't care" about a single mom's childcare situation signals a lack of empathy. Even if the *decision* was financial, the *attitude* feels hostile.
  *   **The "Targeting" Accusation:** Because of the Knobe Effect, your staff is already primed to see harm as intentional. By verbally confirming you were aware of the harm and proceeded anyway ("I don't care... whether this messes with Priya's hours"), you handed them the evidence they needed to confirm their bias.

  If you had said, "We need to cut costs. I've run the numbers, and this schedule is the only one that works financially. I know this impacts hours, and I hate that, but we have to do it to keep the shop open," the reaction might have been different. You would still be cutting hours, but you wouldn't be signaling indifference to their well-being.

  ### 4. How to Fix It
  Knowing about the Knobe Effect doesn't fix the schedule, but it helps you understand that you cannot logic your way out of this. You cannot say, "But I didn't intend it!" because their brains have already coded it as intentional harm.

  *   **Acknowledge the Impact, Not the Intent:** Stop trying to convince them you didn't mean to hurt Priya. Instead, validate the hurt. "I know this schedule broke your childcare arrangement. That is on me, and I am sorry."
  *   **Address the "I Don't Care" Comment:** If appropriate, you might own that. "I was stressed about the budget and I said I didn't care about the impact. That was wrong. I do care about you guys, but I let the numbers take over."
  *   **Fix the Practical Problem:** Can you swap Priya's shifts? Can you offer a small stipend for the childcare gap? Can you prioritize her for the next round of overtime? Action speaks louder than intent.
  *   **Accept the Asymmetry:** Don't expect credit for Tom. As the experiment shows, you won't get it. Let Tom be happy about his schedule, but don't wait for a parade.

  ### Summary
  You aren't crazy, and you aren't necessarily a hidden villain. You are experiencing a documented cognitive bias where **harm magnifies intent and help minimizes it.**

  However, while the *bias* is in their heads, the *fuel* for that bias was the comment about not caring. In a small team, indifference to suffering is often indistinguishable from malice. You can be right about your philosophy and still need to apologize for your management.
