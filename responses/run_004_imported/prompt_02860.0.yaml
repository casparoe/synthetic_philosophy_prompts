          *   *Result:* The signal value crashes. High-quality males lose the mating advantage. They are now selected to signal *more* intensely to stand out again.
          *   *Conclusion:* The system is an evolutionary stable strategy (ESS). You can't cheat the system without destroying the value of the signal itself.
      *   **Addressing Priya's "Fuzziness":** She was right about differential costs but couldn't explain the feedback loop.
