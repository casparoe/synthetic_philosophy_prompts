      *   **Point 1: The Assumptions of Revealed Preference.** RPT isn't just "choice = utility." It relies on *rationality* (consistent, transitive, stable). If choices are inconsistent (e.g., A > B today, B > A tomorrow due to framing), RPT breaks down.
      *   **Point 2: Behavioral Economics & System 1 vs. System 2.** Nudge theory comes from behavioral econ. It argues people make mistakes due to cognitive biases. The "choice" doesn't always reveal the "true preference" because of noise (framing, default bias).
      *   **Point 3: Defining Welfare.** Neoclassical = Satisfaction of revealed preferences. Behavioral = Satisfaction of *latent* or *reflective* preferences. If I choose candy now but wish I hadn't later, did that choice maximize my welfare? Nudge theorists say "No."
      *   **Point 4: Reconciling the Two.** Economists who support nudges usually modify or relax the strict RPT assumptions. They don't reject RPT entirely as a tool, but they reject it as a *normative* absolute when biases are present.
      *   **Point 5: The "Libertarian Paternalism" Balance.** Nudges preserve freedom of choice (opt-out is possible), which attempts to respect the spirit of RPT while correcting for the "noise."

  5.  **Refining the Explanation (Self-Correction/Nuance):**
      *   *Caution:* Don't say RPT is "wrong." Say it has *limitations* in specific contexts.
