      *   *Key Terminology:* Mention "bounded rationality," "status quo bias," "internalities."
      *   *Addressing the "Definition" aspect:* The user says utility is *by definition* what choices maximize. This is the crux. Behavioral economists argue that definition is too narrow. Utility should be about *well-being*, not just *selection*.

  6.  **Structuring the Response:**
