      *   *Refining the Corrigibility point:* Mention the "Shutdown Problem" paper (Soares et al.). It shows the difficulty, not impossibility. Mention "Uncertainty about human preferences" (Hadfield-Menell et al.) as a solution path.
      *   *Refining the "Settled Fact" warning:* Emphasize that presenting this as settled is pedagogically risky and philosophically inaccurate.

  5.  **Final Polish:**
