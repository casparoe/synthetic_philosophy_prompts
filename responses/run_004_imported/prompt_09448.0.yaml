      *   *Check:* Did I make Woody too pragmatic? *Fix:* Ensure he addresses the "circularity" head-on. He should argue that *all* analysis is somewhat circular if you dig deep enough, but his is *virtuously* circular (explicative).
      *   *Check:* Is the Suzy/Billy case accurate? *Fix:* Ensure the distinction between early and late preemption is clear. Late preemption is the hard case for Lewis.
      *   *Check:* Is the tone right? *Fix:* Use jargon correctly (Humean supervenience, structural causal models, backtracking, miracles).

  5.  **Final Polish:**
