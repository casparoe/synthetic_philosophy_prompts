answer: |-
  **Setting:** *A university philosophy department lounge, late evening. The coffee is stale. Two empty whiteboards flank the room, one covered in possible worlds diagrams, the other in directed acyclic graphs (DAGs).*

  **Characters:**
  *   **LEWISA:** A defender of the Humean/Counterfactual tradition.
  *   **WOODY:** A proponent of Interventionism and Structural Causal Models.

  ***

  **WOODY:** (Tapping a marker against the DAG board) You know, I was listening to your talk earlier. The possible worlds stuff is elegant, I'll give you that. But aren't you worried you're just cooking the books?

  **LEWISA:** (Sipping cold coffee) Excuse me?

  **WOODY:** The similarity metric. To get your counterfactuals to align with causation, you need a very specific ordering of worlds. Big miracles are worse than small ones. Matching particular fact in the present matters more than matching laws in the future. No backtracking. It feels like you're reverse-engineering the metric to spit out the causal verdicts you already believe. You're smuggling the causal asymmetry into the similarity relation.

  **LEWISA:** That's the standard complaint, yes. But it assumes the similarity metric is arbitrary. It isn't. It's grounded in the *asymmetry of overdetermination*. In our world, causes leave many traces in the future, but effects don't leave many traces in the past. If I drop a cup, the future is full of shards, sound waves, and air displacement. The past is just me holding the cup.

  **WOODY:** So you're saying the metric is empirical?

  **LEWISA:** I'm saying it's not a philosophical stipulation. It's a feature of the Humean base. We evaluate counterfactuals by minimizing miracles *and* maximizing match of particular fact. Because the future is overdetermined by the present, a small miracle now creates a massive divergence later. To keep the future fixed while changing the present requires a massive, widespread miracle. To keep the past fixed while changing the present requires only a small, localized one. The asymmetry comes from the world, not my definition.

  **WOODY:** Convenient. But let's flip the mirror. You accuse me of rigging the metric. I accuse you of rigging the vocabulary.

  **LEWISA:** Go on.

  **WOODY:** Take my definition of an intervention. To say $X$ causes $Y$, I need an intervention variable $I$ on $X$. But look at the definition of $I$. $I$ must be a *cause* of $X$. $I$ must break all other arrows into $X$. $I$ must not affect $Y$ except through $X$. You can't define "intervention" without using the word "cause." Cartwright nailed it: "No causes in, no causes out." You aren't reducing causation to non-causal terms. You're just relating one set of causal facts to another.

  **LEWISA:** (Smiling) Touché. So, we're both circular.

  **WOODY:** Not necessarily. I'm willing to concede non-reductivity. You, however, claim to be giving a reductive analysis of causation in terms of counterfactuals and laws. If your counterfactuals rely on a causal metric, your reductivism fails.

  **LEWISA:** But if I concede non-reductivity, what do you buy me? If you aren't reducing causation, why is your theory better than a simple regularity account? Hume saw correlations. Why do I need your DAGs?

  **WOODY:** Because regularity theories drown in spurious correlation. The barometer falls, the storm comes. Regularity says barometer causes storm. Interventionism asks: If I *intervene* to hold the barometer steady, does the storm still happen? No. If I intervene to stop the storm, does the barometer fall? Maybe, via pressure. But the key is *manipulation*. My theory tells you which correlations are exploitable. It distinguishes "seeing" from "doing." That's not circular; that's functional. It clarifies the concept we actually use in science.

  **LEWISA:** Functional utility doesn't solve the metaphysical puzzle. You're telling me *how to find* causes, not *what they are*. But let's get concrete. Your interventionism loves cases where I struggle. Late preemption.

  **WOODY:** Suzy and Billy.

  **LEWISA:** Exactly. Suzy throws, Billy throws. Suzy's rock hits the bottle first. Billy's would have hit if Suzy's hadn't. The bottle shatters. Did Suzy cause the shattering?

  **WOODY:** Obviously.

  **LEWISA:** Simple counterfactual dependence says no. If Suzy hadn't thrown ($\neg C$), the bottle still shatters ($E$) because Billy's rock hits it. So $E$ does not depend on $C$. My early theory failed here.

  **WOODY:** And my Structural Causal Model handles it in a line of code. You set the variable $Billy = 0$ via intervention. You hold Billy out of the picture. Now, does $E$ depend on $Suzy$? Yes. If Suzy doesn't throw, and Billy is inactive, the bottle stands. Suzy is a cause. It's clean.

  **LEWISA:** Is it? You said "set $Billy = 0$ via intervention." How do you know you *can* do that? In the real world, Billy and Suzy both hate the bottle owner. There's a common cause—the grudge. If I intervene on Billy, do I break the link to the grudge? Your definition of intervention *requires* that I sever the incoming arrows to Billy. But that's assuming I already know the causal structure! You're assuming Suzy and Billy are independent enough to surgically remove one to test the other.

  **WOODY:** I am assuming we can model the system.

  **LEWISA:** You're assuming the causal structure to identify the causal structure. In the preemption case, you solve it by stipulating a model where Billy's throw can be toggled independently. But if the world is deterministic, can you really toggle Billy without changing the past that determined Billy?

  **WOODY:** That's the point of the intervention! It's an *exogenous* shock. It comes from outside the model.

  **LEWISA:** Ah, the "outside." Just like my "small miracle." You call it an exogenous variable; I call it a localized violation of laws. We're doing the same thing! You're positing a magical switch that turns off Billy without rippling back to the grudge. I'm positing a small miracle that prevents Suzy's throw without rippling back to her decision.

  **WOODY:** There's a difference. Your miracle is metaphysical. My intervention is methodological. I'm not saying the universe *has* these switches. I'm saying that *if* you want to know if $X$ causes $Y$, you need to isolate $X$. The circularity is virtuous. It's explication. We start with rough causal intuitions, build a model, test it, refine the model. We bootstrap. You're trying to ground causation in the bedrock of physics from a single armchair deduction.

  **LEWISA:** And you're giving up on the bedrock! If causation is just about what models help us manipulate things, then causation isn't real. It's instrumental. I want to know if Suzy *really* caused the shattering, not just if my model says I can blame her.

  **WOODY:** And I want to know if I can stop the next bottle from shattering. If your "real" causation doesn't cash out in difference-making, what is it? Ghostly glue?

  **LEWISA:** It's the structure of counterfactual dependence grounded in the laws! Look, back to the similarity metric. You say it's rigged. But consider the asymmetry again. If I say, "If the bottle hadn't shattered, Suzy wouldn't have thrown," that requires backtracking. It requires the shards to un-break, the sound waves to un-ripple, to change the past. That requires a massive divergence from actuality.
  If I say, "If Suzy hadn't thrown, the bottle wouldn't have shattered" (holding Billy fixed), that requires only a small divergence in Suzy's muscle twitch. The asymmetry of the *world* dictates the similarity metric. I'm not building in causation; I'm building in the thermodynamic arrow of time.

  **WOODY:** But the thermodynamic arrow doesn't tell you which variable is which in my DAG. Entropy increases, sure. But does the barometer cause the storm or vice versa in terms of information flow? Your counterfactuals need the metric to decide the direction. My interventions need the causal vocabulary to define the intervention. We're both standing on our own shoulders.

  **LEWISA:** Maybe. But my theory explains *why* the interventions work. Interventions work *because* the counterfactuals are true. If it weren't the case that "Had I intervened, the result would differ," your manipulation would be magic. The counterfactual is the truth-maker for the success of the intervention.

  **WOODY:** And I'd say the counterfactual is only meaningful *because* we know what interventions are possible. "If Suzy hadn't thrown" is nonsense unless we know how Suzy *could* not have thrown. Is it a miracle? A different decision? A blocked arm? The meaning of the counterfactual depends on the space of possible interventions.

  **LEWISA:** (Pauses) So you think the interventionist account is more fundamental?

  **WOODY:** I think it's more honest. It admits that causation is tied to agency and explanation. You're trying to hide the agent in the "similarity metric."

  **LEWISA:** I'm trying to save objectivity. If causation depends on "possible interventions," does a tree cause a shadow when no one is around to manipulate the tree?

  **WOODY:** Yes, because the *counterfactual* intervention holds. If an agent *were* there, they could block the light. It's about the structure of dependencies, not the presence of a homunculus.

  **LEWISA:** But that structure of dependencies... you define it using arrows. Arrows are causal. I define my structure using worlds and laws. Laws are... well, Humean regularities, mostly.

  **WOODY:** Mostly?

  **LEWISA:** (Sighs) Okay, the laws have a nomic necessity that regularities don't. But look where we are. You admit you can't define intervention without causation. I admit I can't define similarity without asymmetry. You say your circularity is pragmatic. I say mine is metaphysical.

  **WOODY:** And neither of us can prove the other wrong.

  **LEWISA:** No. But consider this. In the preemption case, you solved it by adding variables. $Suzy$, $Billy$, $Shatter$. What if there's a hidden common cause we didn't model? Your method says "intervene." But if you intervene on a variable that's actually a proxy for something deeper, you get the wrong answer. You need the *true* causal graph.

  **WOODY:** Which we discover through... more interventions. And theory.

  **LEWISA:** Guided by... counterfactual reasoning about what would happen if the theory were wrong.

  **WOODY:** (Laughs) We're chasing our tails.

  **LEWISA:** Perhaps. But my tail is anchored in the objective similarity of worlds. Yours is anchored in the subjective utility of manipulation.

  **WOODY:** Or, my tail is anchored in the only thing we can actually verify. We can't visit possible worlds, Lewisa. We can run experiments.

  **LEWISA:** And every experiment is interpreted through a web of counterfactual assumptions about controls and confounders.

  **WOODY:** (Puts the cap back on the marker) So. Suzy threw the rock. The bottle broke.

  **LEWISA:** And if she hadn't, it wouldn't have.

  **WOODY:** Provided I can hold Billy fixed.

  **LEWISA:** Provided the world doesn't demand backtracking.

  **WOODY:** Same difference.

  **LEWISA:** (Raises her coffee cup) To the asymmetry of overdetermination.

  **WOODY:** (Clinks his water bottle against it) To the do-operator.

  ***

  *(They stand in silence for a moment, looking at the two whiteboards. The DAGs and the Possible Worlds diagrams look, from a distance, surprisingly similar.)*
