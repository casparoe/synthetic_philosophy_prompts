answer: |-
  Your advisor is half-right and half-wrong, and your instinct to distrust the dismissal is spot on. Dismissing Wittgenstein's shifting imagery as "loose metaphors" is often a way to avoid the hard work of explaining *why* he shifts them. In *On Certainty*, the movement between metaphors is usually the philosophy itself.

  You have identified the central tension in *On Certainty*: **How can something be logically necessary for inquiry (the hinge) while being historically contingent (the river-bed)?**

  There is a defensible, standard reading that reconciles these, and it is crucial for comps because it saves Wittgenstein from the charge of relativism on one hand and dogmatic foundationalism on the other.

  Here is the reconciliation: **The distinction between *functional role* (synchronic) and *propositional content* (diachronic).**

  ### 1. The Synchronic Necessity (The Hinge)
  When Wittgenstein says in §341–343 that "the hinges must stay put," he is making a **logical point about the structure of justification at a specific moment ($t_1$).**

  For a language game of "testing," "doubting," or "knowing" to function *right now*, there must be a background of untested assumptions. If I am testing whether the door is locked, I cannot simultaneously test whether the door exists, whether my eyes work, or whether logic holds.
  *   **The Claim:** At any given moment of inquiry, the distinction between "tested" and "untested" must be sharp.
  *   **The Metaphor:** The hinge. If the hinge moves *while* you are trying to turn the door, you aren't opening a door; you are dismantling the frame.
  *   **Status:** This is a condition of possibility for meaning. It is not that the proposition is "true" in a metaphysical sense; it is that it is being *used* as a rule.

  ### 2. The Diachronic Fluidity (The River-bed)
  When Wittgenstein says in §96–97 that the river-bed shifts, he is making a **historical/anthropological point about the evolution of systems over time ($t_1 \to t_2$).**

  What functions as a hinge is not determined by the *content* of the proposition (e.g., "The earth exists"), but by its *role* in the system. Over centuries, propositions can migrate from the "fluid" water (empirical hypotheses) to the "hard" bed (grammatical rules), and vice versa.
  *   **Example:** "The earth has existed for more than 100 years." For us, this is a hinge. For someone in the 17th century, this might have been an empirical claim open to theological or geological debate.
  *   **Example:** "Energy is conserved." In the 19th century, this hardened into a guiding principle (a hinge). In modern physics, under certain cosmological models, it is becoming fluid again (open to empirical revision).
  *   **Status:** This shows that hinge status is not intrinsic. It is acquired through use and habit.

  ### 3. The Reconciliation: Rules of the Game vs. History of the Game
  The way to reconcile "must stay put" with "may shift" is to treat hinges like the **rules of a game.**

  *   **During the match (Synchronic):** The rule "Bishops move diagonally" *must stay put*. If you move a bishop like a knight in the middle of a tournament game, you aren't playing chess; you're cheating or playing something else. In this sense, the rule is fixed.
  *   **Across centuries (Diachronic):** The rules of chess *have shifted*. The Queen used to move only one square. The *en passant* rule was added. The "hard" rules of the 18th century became "fluid" and were rewritten in the 19th.

  Wittgenstein is arguing that **logic is anthropological.** The "logic" that demands hinges stay put is the logic of *our* current form of life. But our form of life is not eternal; it evolves.

  ### 4. Textual Support for the Reconciliation
  You can bolster this reading with **§98**, which comes right after the river-bed remark. Wittgenstein writes:

  > "But the distinction between the hardness of the bed and that of the water... is not always sharp. ... I do not say that the propositions... are in themselves unshakable."

  Here he explicitly admits the boundary is porous. He also notes in **§336**:

  > "But if a proposition is hardened, it is not because it is 'true'... but because it is used as a norm."

  This confirms that the "hardness" is a matter of **use**, not **truth**. A proposition is a hinge *because* we treat it as one, not because it possesses the property of "Hinge-ness." Therefore, it must stay put *while we are treating it as one*, but we can stop treating it as one later.

  ### 5. Why Your Advisor Might Be Resistant (and why you should push back)
  Your advisor is likely wary of "systematizing" Wittgenstein. There is a tradition (especially in older scholarship) that treats *On Certainty* as a fragmented notebook where Wittgenstein was trying out ideas and hadn't settled on a view. From that perspective, the Hinge and River-bed are just two attempts to say "some stuff is certain."

  However, the **Moyal-Sharrock reading** (which is dominant in contemporary OC scholarship) supports your intuition. She argues that Wittgenstein is distinguishing between **propositions** (which have truth values) and **hinges** (which are non-propositional rules of grammar disguised as propositions).
  *   When they function as hinges, they are grammatical rules (River-bed).
  *   Because they are rules, they cannot be doubted within the game (Hinges).
  *   But grammar changes over time (River-bed shifts).

  ### 6. The Comps Takeaway
  If you are asked about this in comps, do not say "Wittgenstein is inconsistent." Say:

  > "Wittgenstein employs the **Hinge metaphor** to describe the **synchronic logic of justification** (the conditions required for doubt to be meaningful at time $t$), and the **River-bed metaphor** to describe the **diachronic evolution of grammar** (how what counts as a condition changes over historical time). The tension is resolved by recognizing that hinge status is **functional, not intrinsic**. A proposition must be fixed to function as a norm, but norms are subject to historical drift."

  This shows you understand the text's nuance without forcing it into a rigid system Wittgenstein would hate. You're not overreading; you're tracking the *grammar* of his metaphors.

  **One final warning:** Be careful not to slide into full-blown relativism. Wittgenstein isn't saying "anything can be a hinge." He suggests that the shifts in the river-bed are slow and driven by the pressure of experience and the needs of the community, not by arbitrary whim. The bed shifts, but it doesn't turn into mist.

  Good luck with the comps. This is exactly the kind of tension that makes for a strong essay question.
