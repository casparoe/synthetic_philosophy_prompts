      *   **Anupalabdhi (Non-apprehension/Absence):** Knowing something exists by not perceiving it where it should be. Advaita says distinct. Nyaya/Buddhists often reduce to Perception (perceiving the empty locus) + Inference (if it were there, I'd see it). Tier: D.

