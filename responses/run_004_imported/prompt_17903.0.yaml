prompt: |-
  I write about science and medicine, and I've recently joined a teaching hospital's clinical ethics committee as its public member. The committee must issue an advisory opinion on a concrete question: should the outpatient psychiatry service begin formally diagnosing Prolonged Grief Disorder — added to the DSM-5-TR in 2022 for grief that remains intense and impairing beyond twelve months — instead of continuing to code unusually severe bereavement as depression or adjustment disorder? Several clinicians want to adopt the new diagnosis immediately, since insurers will only reimburse structured grief therapy once a patient carries a recognized code, and patients are currently going undertreated. One of our bioethicists, trained as a philosopher of science, instead urges caution, invoking Ian Hacking's account of the looping effects of human kinds: naming and monitoring this condition, she argues, will change how the bereaved interpret, report, and even prolong their own grief, much as the multiple-personality diagnosis arguably helped produce the surge of cases clinicians began seeing after 1980. Please draft the short opinion I will circulate before the committee's vote. It should recommend one concrete course of action with a timeframe for reviewing how the diagnosis gets used, and it should engage the looping-effects worry as a substantive risk rather than dismiss it as reflexive anti-psychiatry.
reasoning: |-
  Here's a thinking process that leads to the suggested advisory opinion:

  1.  **Analyze the Request:**
      *   **Role:** Public member of a clinical ethics committee at a teaching hospital.
      *   **Task:** Draft a short advisory opinion for circulation before a vote.
      *   **Topic:** Should the outpatient psychiatry service formally diagnose Prolonged Grief Disorder (PGD) vs. continuing to code as depression/adjustment disorder?
      *   **Context:** PGD added to DSM-5-TR (2022). Criteria: intense/impairing grief > 12 months.
      *   **Conflict:**
          *   *Pro-Diagnosis:* Clinicians want reimbursement for structured grief therapy; patients are undertreated.
          *   *Caution:* Bioethicist (philosopher of science) warns of "looping effects" (Ian Hacking). Naming the condition might change self-perception and prolong grief (similar to MPD/DID surge).
      *   **Requirements:**
          *   Recommend one concrete course of action.
          *   Include a timeframe for review.
          *   Engage the looping-effects worry substantively (don't dismiss it).
          *   Tone: Professional, ethical, balanced, decisive.

  2.  **Determine the Stance:**
      *   *Option A (Adopt Immediately):* Addresses patient suffering and access to care now. Risks: Potential iatrogenic effects via labeling.
      *   *Option B (Wait/Reject):* Avoids labeling risks. Risks: Patients remain undertreated, no reimbursement.
      *   *Option C (Adopt with Safeguards/Monitoring):* Best of both worlds. Acknowledges the clinical need *and* the philosophical risk. This allows for a concrete recommendation with a review timeframe.
      *   *Decision:* Option C is the most ethically robust position for a committee opinion. It validates the clinicians' urgency while respecting the bioethicist's theoretical concern.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard committee memo format (To, From, Date, Subject).
      *   **Introduction:** State the question clearly. Acknowledge the tension between clinical utility and conceptual risk.
      *   **Addressing the Clinical Need:** Validate the clinicians' point. Patients are suffering; insurance barriers are real. Justice/Beneficence demands access to care.
      *   **Addressing the Looping Effect (The Core Challenge):** This needs careful handling. I need to show I understand Hacking. It's not just "labeling is bad"; it's that the label changes the *kind* of person and their experience.
          *   *Integration:* Acknowledge that PGD isn't just discovering a natural kind; it's creating a category that patients might inhabit.
          *   *Mitigation:* How do we minimize this? Psychoeducation, careful framing, avoiding deterministic language.
      *   **Recommendation:** Adopt the diagnosis *but* with specific implementation guidelines.
      *   **Review Timeframe:** Needs to be long enough to see effects but short enough to correct course. 18-24 months seems reasonable for a clinical rollout review.
      *   **Conclusion:** Summarize the ethical balance.

  4.  **Refining the Tone:**
      *   *Voice:* Public member (lay perspective but informed), thoughtful, bridge-builder.
      *   *Language:* Precise but accessible. Avoid jargon where possible, but use "looping effects" correctly.
      *   *Key Constraint:* Do not dismiss the bioethicist. Make her concern a pillar of the recommendation (i.e., "Because this risk exists, we must monitor").

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   We should do it because people need help.
      *   But the philosopher is right, names change things.
      *   So, let's start using the code but train doctors to explain it carefully.
      *   Check back in 2 years to see if it's making grief worse.
      *   Vote yes.

  6.  **Drafting - Iteration 2 (Adding Depth & Ethics):**
      *   *Beneficence:* Patients need therapy. Insurance won't pay without code.
      *   *Non-maleficence:* The bioethicist worries the code itself harms by shaping identity. This is a valid "looping effect."
      *   *Solution:* Implement PGD diagnosis but mandate a specific consent/education process.
      *   *Review:* 18 months. Look at outcomes and patient narratives.

  7.  **Final Polish (incorporating specific prompt requirements):**
      *   Ensure Hacking is referenced respectfully.
      *   Ensure the timeframe is concrete.
      *   Ensure the recommendation is actionable.
      *   Check word count (keep it "short opinion" as requested).

  8.  **Writing the Content (incorporating into the final response):**
      *   *Subject:* Advisory Opinion on Prolonged Grief Disorder (PGD) Implementation.
      *   *Opening:* Acknowledge the stakes.
      *   *Body Paragraph 1 (Clinical Imperative):* Focus on access to care.
      *   *Body Paragraph 2 (The Looping Effect):* Explicitly engage Hacking. Explain *why* it matters (ontological change).
      *   *Body Paragraph 3 (The Path Forward):* The recommendation. Adopt, but with "ontological safeguards."
      *   *Closing:* Timeframe for review.

  9.  **Review against constraints:**
      *   Recommend one course? Yes (Adopt with safeguards).
      *   Timeframe? Yes (18 months).
      *   Engage looping effects? Yes (Central to the safeguards).
      *   Tone? Appropriate for ethics committee.

  10. **Final Polish:** Check for clarity and impact. (Self-Correction: Make sure the distinction between "natural kind" and "human kind" is clear but not overly academic.) *Decision: Keep the Hacking reference clear but applied to clinical practice.*

  11. **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  **TO:** Clinical Ethics Committee
  **FROM:** [Your Name], Public Member
  **DATE:** October 26, 2023
  **SUBJECT:** Advisory Opinion on the Formal Diagnosis of Prolonged Grief Disorder

  **Recommendation:**
  The committee should authorize the outpatient psychiatry service to begin formally diagnosing Prolonged Grief Disorder (PGD) effective immediately, contingent upon the implementation of specific documentation and psychoeducation protocols. This authorization should be subject to a mandatory ethical and clinical review in **18 months**.

  **Rationale:**
  We face a tension between two ethical imperatives: the duty to relieve suffering (beneficence) and the duty to avoid iatrogenic harm (non-maleficence).

  The argument for adoption is grounded in justice and access. Currently, patients experiencing debilitating bereavement are denied reimbursed, evidence-based therapy because their suffering does not fit the criteria for Major Depressive Disorder. To withhold a recognized diagnostic code that unlocks treatment is to prioritize administrative convenience over patient welfare. We cannot ethically justify leaving patients undertreated when a pathway to care exists.

  However, we must treat the concern regarding "looping effects" as a substantive risk, not merely theoretical skepticism. As our colleague noted, invoking Ian Hacking's framework reminds us that psychiatric classifications are not like classifications of stars or beetles; they are "human kinds." When we name a condition, we offer patients a new vocabulary for their interior lives. There is a credible risk that formalizing PGD could inadvertently encourage patients to view their grief as a static pathology rather than a fluctuating human experience, potentially reinforcing the very symptoms we aim to treat. If the diagnosis becomes a self-fulfilling prophecy of chronicity, we have failed our duty of non-maleficence.

  **Implementation Safeguards:**
  To mitigate this risk, adoption of the PGD code must be paired with an "ontological safeguard" in clinical practice:

  1.  **Narrative Framing:** Clinicians must document that the diagnosis was presented to the patient as a description of current *impairment*, not a permanent identity. The treatment plan must explicitly frame therapy as a process of integration, not merely symptom elimination.
  2.  **Informed Consent:** Patients diagnosed with PGD should receive written information clarifying that the diagnosis is a tool for accessing care, not a definitive judgment on the validity or duration of their love for the deceased.

  **Review Timeframe:**
  We will revisit this policy in **18 months**. This review will not only assess clinical outcomes and reimbursement rates but will also qualitatively examine patient narratives. We must ask: Has this diagnosis facilitated recovery, or has it altered how patients report and experience their grief in ways that align with Hacking's warning?

  By adopting the diagnosis with these safeguards, we acknowledge the urgency of patient suffering while remaining intellectually humble about the power of our own classifications.

  **Vote:** Recommend Approval with Conditions.
