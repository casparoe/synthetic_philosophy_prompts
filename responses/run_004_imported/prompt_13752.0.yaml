answer: |-
  **Title:** Superposition as Dissolution: Why Mechanistic Interpretability Supports Instrumentalism

  **Abstract:**
  The prevailing optimism in the philosophy of machine learning holds that Sparse Autoencoders (SAEs) vindicate a realist ontology of neural network representations. By recovering monosemantic features from polysemantic neurons, SAEs are thought to reveal the "true" semantic structure of the model. This paper argues the opposite. The phenomenon of superposition—wherein networks encode more features than dimensions via interfering, non-orthogonal directions—demonstrates that features are not ontological constituents of the network but instrumental projections. Furthermore, I contend that appealing to Dennett's "Real Patterns" does not save realism; rather, it confirms instrumentalism, as the stability of SAE features depends on arbitrary hyperparameter choices rather than the mechanism itself.

  ***

  ### 1. The Realist Hope
  The current consensus in mechanistic interpretability is buoyed by a specific narrative arc. Initially, we observed that individual neurons are polysemantic: a single neuron might fire for both "cat ears" and "car headlights." This suggested a chaotic, holistic distribution of semantics that resisted realist analysis. However, the advent of Sparse Autoencoders (SAEs) has shifted the tide. By training an auxiliary dictionary to reconstruct activations under a sparsity constraint, researchers claim to recover "monosemantic features."

  The philosophical upshot drawn by many is a vindication of **representational realism**. The argument runs: the network *does* represent distinct concepts; they were just entangled in the native basis. SAEs act as a microscope, disentangling this mess to reveal the underlying, mind-independent semantic structure. If SAEs find features that are predictively robust, the realist concludes, those features must be *real*.

  ### 2. The Ontological Weight of Superposition
  I argue that this reading inverts the metaphysical significance of **superposition**. Superposition is not merely a nuisance to be cleaned up; it is a fundamental architectural constraint. In high-dimensional deep learning, the number of task-relevant features vastly exceeds the number of available neurons (dimensions). To cope, the network does not assign one neuron per feature. Instead, it encodes features as overlapping, non-orthogonal directions in activation space.

  This has a critical ontological implication: **The features do not exist as localized entities within the mechanism.**

  In a realist picture, we expect a mapping between the ontology of the system (the weights and activations) and the ontology of the representation (the features). Superposition breaks this mapping. It implies that the "features" are not stored; they are *interference patterns*. When an SAE recovers a "clean" feature, it is not discovering a pre-existing localized unit. It is constructing a basis in which the interference is minimized *for a specific sparsity constraint*.

  If the network's native state is one of fundamental interference, then any decomposition that yields clean, orthogonal, monosemantic directions is necessarily a distortion. It is a Procrustean bed. The SAE forces the soup of superposition into distinct buckets. The fact that we can do this does not mean the buckets were there to begin with; it means the soup can be *sieved* in that way.

  ### 3. Confronting the "Real Patterns" Rejoinder
  The most sophisticated defense of the realist position appeals to Daniel Dennett's criterion of **Real Patterns**. The optimist argues: *We need not demand that features correspond to fundamental physical substructures (neurons). Following Dennett, a pattern is real if it affords compressible, predictively exploitable regularities. SAE features allow us to predict model behavior and intervene on outputs. Therefore, they are real patterns, and realism holds.*

  This rejoinder fails to grasp the implications of superposition for the *stability* of the pattern.

  Dennett's realism is compatible with multiple valid decompositions (e.g., defining the "center of gravity" of an object). However, for a pattern to be real *of the object*, it must be robust to the *stance* taken toward the object. In the context of SAEs, the "stance" is defined by hyperparameters: the dictionary size, the sparsity penalty (L1 coefficient), and the reconstruction loss threshold.

  Empirical work in interpretability shows that varying these hyperparameters yields **different sets of features**.
  *   A high sparsity penalty yields fewer, broader features.
  *   A low sparsity penalty yields more, finer-grained features.
  *   Different random seeds yield different bases that reconstruct the loss equally well.

  If the "real features" of the network shift depending on the arbitrary choice of the L1 coefficient, then the ontology is not residing in the network. It is residing in the **interaction between the network and the interpretive tool**.

  To use a Dennettian analogy: Consider a cloud. I can interpret it as a dragon, or as a mushroom. Both might be "predictively exploitable" for a poet or a child. But the cloud is not *really* a dragon. The "dragon" is a pattern imposed by the observer, not the water vapor. Superposition reveals that neural networks are more like clouds than like clockwork. The SAE does not find the gears; it draws constellations in the steam.

  The realist wants to say the SAE features are like the *molecular structure* of the water vapor. But superposition proves there is no such molecular structure at the level of features. There is only the high-dimensional interference. The SAE features are like the "dragon"—they are real patterns *for us*, useful for prediction and control, but they are not ontological constituents *of the model*.

  ### 4. Instrumentalism Vindicated
  This leads directly to a deflationary, instrumentalist reading of representation talk.

  1.  **No Privileged Basis:** Superposition implies there is no "God's eye" basis where all features are monosemantic and non-interfering. Any basis we choose is a trade-off between sparsity and reconstruction error.
  2.  **Features as Tools:** SAE features are best understood as tools for *human* understanding, not descriptions of *machine* understanding. They are interface layers we build to make the black box legible to human cognition, which prefers discrete categories over continuous interference.
  3.  **Representation as Relation:** To say a network "represents" a feature is not to state a fact about the network's internal state. It is to state a fact about the success of a specific interpretive intervention (the SAE) in rendering that state predictable.

  ### 5. Conclusion
  The optimism surrounding mechanistic interpretability rests on the hope that SAEs are discovering the "atomic structure" of neural computation. The phenomenon of superposition undermines this hope. It demonstrates that the network does not store features as discrete atoms, but as interfering waves.

  When we confront the Dennettian rejoinder, we see that while SAE features may be "Real Patterns," they are real in the way that "centers of gravity" or "constellations" are real: they are observer-relative abstractions that facilitate prediction, not mind-independent structures. Superposition does not hide the reality of representations; it dissolves it. We should therefore abandon the search for a realist ontology of neural features and embrace an instrumentalism that treats "representations" as useful fictions for navigating the high-dimensional interference of deep learning systems.
