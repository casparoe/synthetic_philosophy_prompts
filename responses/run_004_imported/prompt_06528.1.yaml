answer: |-
  You have hit on a genuine and significant tension in formal methods for security. You are not reinventing the wheel; you have correctly identified the gap between **epistemic logic** (which models knowledge as a state of truth) and **complexity theory** (which models knowledge as the output of a resource-bounded process).

  In the literature, this is often discussed under the banner of **Resource-Bounded Knowledge** or **Algorithmic Knowledge**. The specific issue you raised—that standard possible-worlds semantics collapses the distinction between "logically implied" and "computationally feasible"—is the primary reason why pure epistemic logic (like BAN logic or S5) is rarely used for modern cryptographic proofs without significant modification.

  Here is the precise breakdown you asked for.

  ---

  ### 1. The Worked Example: $N=91$ in S5 Epistemic Logic

  Let's formalize the scenario using standard S5 epistemic logic (the standard system for knowledge, characterized by reflexive, symmetric, and transitive accessibility relations).

  **The Setup:**
  *   **Agent:** An adversary $\mathcal{A}$.
  *   **Language:** Propositional logic extended with arithmetic atoms.
      *   $n$: "The public modulus is 91."
      *   $f$: "The prime factors are 7 and 13."
  *   **Background Theory ($T$):** Peano Arithmetic (or a sufficient fragment). Crucially, $T \vdash n \to f$. This implication is a logical truth within the theory.
  *   **Kripke Structure:** $M = (W, \sim, V)$
      *   $W$: Set of possible worlds.
      *   $\sim$: Accessibility relation for $\mathcal{A}$ (indistinguishability).
      *   $V$: Valuation function mapping atoms to truth in worlds.

  **The Omniscience Derivation:**
  In S5, the knowledge operator $K_\mathcal{A}$ is defined as:
  $$ (M, w) \models K_\mathcal{A} \phi \iff \forall w' \in W \text{ s.t. } w \sim w', (M, w') \models \phi $$

  Two axioms of S5 are relevant here:
  1.  **Necessitation:** If $\phi$ is valid (true in all worlds), then $K_\mathcal{A} \phi$.
  2.  **Distribution (K-Axiom):** $K_\mathcal{A}(\phi \to \psi) \to (K_\mathcal{A}\phi \to K_\mathcal{A}\psi)$.

  **The Trap:**
  1.  Assume $\mathcal{A}$ observes the modulus. So, $(M, w) \models K_\mathcal{A} n$.
  2.  The implication $n \to f$ is an arithmetic truth. In standard possible-worlds semantics, **logical and mathematical truths hold in all possible worlds**. Therefore, $(M, w) \models K_\mathcal{A} (n \to f)$.
  3.  By the Distribution Axiom, since $\mathcal{A}$ knows $n$ and knows $n \to f$, $\mathcal{A}$ must know $f$.
  4.  **Conclusion:** $(M, w) \models K_\mathcal{A} f$.

  **The Engineering Reality:**
  $\mathcal{A}$ possesses $N=91$. $\mathcal{A}$ does *not* necessarily possess $\{7, 13\}$ in their explicit state storage until they perform the division. In a protocol trace, there is a distinct step where $\mathcal{A}$ transitions from "has $N$" to "has $p, q$". S5 logic collapses these two states into one.

  **Scaling to Crypto-Sized $N$:**
  The logic does not care about the bit-length of $N$.
  *   Let $N_{2048}$ be a 2048-bit modulus.
  *   Let $F_{2048}$ be the proposition stating its factors.
  *   Arithmetic uniqueness ensures $N_{2048} \to F_{2048}$ is still a necessary truth.
  *   Therefore, S5 still dictates $K_\mathcal{A} N_{2048} \implies K_\mathcal{A} F_{2048}$.

  The logic treats the derivation of factors from $N$ as a **zero-cost inference step**. It models knowledge as a closed set under logical consequence, ignoring the **computational distance** between $N$ and $F$. For a security engineer, this renders the logic unsound for modeling computational hardness assumptions (like RSA or DDH).

  ---

  ### 2. Fix Attempt 1: Awareness Logic (Fagin & Halpern)

  Ronald Fagin and Joseph Halpern proposed **Awareness Logic** specifically to decouple "implicit knowledge" (what is true in all accessible worlds) from "explicit knowledge" (what the agent is actually aware of).

  **The Mechanism:**
  They augment the Kripke structure with an **awareness function** $\mathcal{A}(i, w)$, which returns a set of formulas the agent $i$ is "aware of" at world $w$.
  They introduce a new operator $X_i \phi$ ("Agent $i$ explicitly knows $\phi$"):
  $$ (M, w) \models X_i \phi \iff (M, w) \models K_i \phi \land \phi \in \mathcal{A}(i, w) $$

  **Blocking the Factorization Conclusion:**
  1.  **Implicit Knowledge ($K$):** The agent still implicitly knows the factors because $n \to f$ holds in all worlds. $K_\mathcal{A} f$ remains true.
  2.  **Explicit Knowledge ($X$):** We assert that the formula $f$ (or the inference rule $n \to f$) is **not** in the awareness set $\mathcal{A}(\mathcal{A}, w)$.
  3.  **Result:** $X_\mathcal{A} f$ is false. The agent does not "explicitly know" the factors, even though they are implicitly determined.

  **Does it Solve the Problem?**
  *   **Pros:** It formally allows you to state "The agent has the data but hasn't processed it." It stops the logic from forcing the agent to act on the knowledge of the factors.
  *   **Cons (The Relabeling Critique):** It pushes the mystery into the awareness function $\mathcal{A}$.
      *   **Exogenous Awareness:** The logic does not define *how* formulas enter the awareness set. It is a primitive. You, the modeler, must manually specify that $f \notin \mathcal{A}$ initially and $f \in \mathcal{A}$ after a "compute" step.
      *   **No Complexity Model:** It does not capture *why* $f$ is not in the set. Is it because the agent is lazy? Or because factoring is hard? The logic treats "unaware of $P \lor \neg P$" the same as "unaware of RSA factors."
      *   **Engineering Verdict:** It is a syntactic patch. It lets you write specifications that match reality (e.g., "Attacker explicitly knows Ciphertext, but not Plaintext"), but it doesn't provide a semantic guarantee that the attacker *can't* become aware of the plaintext without a specific key. You have to hardcode the computational limitations into the awareness set manually.

  ---

  ### 3. Fix Attempt 2: Impossible Worlds Semantics

  This approach attacks the definition of "possible worlds." In standard logic, all worlds must be logically consistent (arithmetic holds everywhere). Impossible Worlds semantics allows worlds where logical truths fail.

  **The Mechanism:**
  Expand the set of worlds $W$ to include "impossible" worlds $W_{imp}$.
  *   In $W_{std}$: Arithmetic holds ($n \to f$ is true).
  *   In $W_{imp}$: Arithmetic may fail ($n$ is true, $f$ is false).
  *   Modify the accessibility relation $\sim$ so the agent considers some impossible worlds possible (because they haven't done the math to rule them out).

  **Blocking the Factorization Conclusion:**
  1.  Agent $\mathcal{A}$ knows $n$. So all accessible worlds $w'$ satisfy $n$.
  2.  However, $\mathcal{A}$ has not verified the factorization. So there exists an accessible world $w_{imp} \in W_{imp}$ where $n$ is true, but $f$ is false (a world where $91$ is prime, or factors to $3 \times 30$, etc.).
  3.  Because $f$ is false in $w_{imp}$, and $w_{imp}$ is accessible, $(M, w) \not\models K_\mathcal{A} f$.
  4.  **Result:** The agent does not know the factors.

  **Does it Solve the Problem?**
  *   **Pros:** It breaks the closure under implication. The agent can know $\phi$ and know $\phi \to \psi$ (in standard worlds) but not know $\psi$, because the implication itself might fail in the impossible worlds they consider accessible.
  *   **Cons (The Structure Critique):** It is **too flexible**.
      *   **Trivialization:** You can model *any* lack of knowledge by simply positing an impossible world where the known facts don't imply the unknown fact. It doesn't constrain the model; it just accommodates the observation.
      *   **Lack of Guidance:** The semantics don't tell you *which* impossible worlds are accessible. In crypto, we know *exactly* why the agent can't distinguish the worlds: computational cost. Impossible worlds semantics treats a 1-bit XOR distinction the same as a 2048-bit factoring distinction unless you add extra structure.
      *   **Engineering Verdict:** It is useful for modeling protocol bugs where agents make logical errors, but it is poor for modeling computational hardness. It replaces "computationally infeasible" with "logically impossible but epistemically accessible," which is a category error for crypto.

  ---

  ### 4. The Engineer's Synthesis: Algorithmic Knowledge

  Since you are coming from a security background, the philosophical fixes above will feel unsatisfying because they are **static**. They describe a state of ignorance but do not model the **dynamic process of computation** that resolves it.

  The literature that actually addresses your concern is **Algorithmic Knowledge** (pioneered by Moses, Halpern, and others in the 90s).

  **The Core Idea:**
  Replace the semantic definition of knowledge ("true in all worlds") with a computational one ("computable by algorithm $A$ within resource bound $R$").
  $$ K_i \phi \iff \text{Algorithm } \mathcal{C}_i \text{ outputs 'true' on input } \phi \text{ within time } T $$

  **Why this fits your intuition:**
  1.  **Logical Omniscience is Broken by Design:** The algorithm $\mathcal{C}_i$ might not have the factoring routine, or might run in polynomial time. Even if $\phi \to \psi$ is valid, if $\mathcal{C}_i$ cannot compute $\psi$ from $\phi$ within $T$, then $K_i \psi$ is false.
  2.  **Crypto-Soundness:** This aligns with the **Computational Soundness** of symbolic models (the Abadi-Rogaway line of work). It allows you to map the epistemic operator $K$ directly to cryptographic advantage (negligible probability of distinguishing).
  3.  **No Mystery Primitives:** You don't need an exogenous "awareness set" or "impossible worlds." The limitation is the algorithm's complexity class (e.g., PPT - Probabilistic Polynomial Time).

  **Summary for your Sanity Check:**
  *   **Your intuition is correct:** Standard epistemic logic (BAN, S5) assumes logical omniscience, which implies computational omniscience. This makes it formally unsound for reasoning about computational hardness assumptions (RSA, ECC) without modification.
  *   **Philosophical Fixes:** Awareness and Impossible Worlds are syntactic/semantic workarounds that allow you to *write down* the correct state (Agent doesn't know factors), but they don't *enforce* it via complexity theory. They require the modeler to manually encode the computational limits.
  *   **Recommended Path:** If you are sanity-checking auth protocols where computational hardness matters (e.g., "Attacker cannot derive Session Key from Transcript"), standard BAN logic is insufficient. You are better off using:
      1.  **Game-Based Proofs:** (Standard in modern crypto).
      2.  **Computational Soundness of Symbolic Models:** (e.g., verifying a symbolic model then proving it maps to computational reality).
      3.  **Algorithmic Knowledge:** If you must use epistemic logic, use the algorithmic variant where $K$ is defined by a local computation function.

  You aren't missing a philosophical nuance; you've identified the exact reason why formal verification in security split into "Symbolic/Logical" (Dolev-Yao, perfect crypto) and "Computational" (game-based, bounded adversaries) camps. The "Problem of Logical Omniscience" is the theoretical fault line between them.
