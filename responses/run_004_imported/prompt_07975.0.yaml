      *   **Key Conflict:**
          *   *Aumann Side:* Common Knowledge of Rationality (CKR) applies to entire strategies (counterfactuals included). Even if node 2 is unreachable under CKR, the strategy specifies what happens there, sustaining the backward induction (BI) solution.
          *   *Pettit-Sugden-Binmore (PSB) Side:* If node 2 is reached, CKR is falsified. CKR itself provides no guidance on belief revision at that node. Assuming Player 2 still believes Player 1 is rational (or will be rational later) requires extra assumptions not in the theorem.
      *   **Constraints:**
          *   PSB side must press on the *concrete question*: What is Player 2 entitled to believe after Player 1 passes at Move 1?
