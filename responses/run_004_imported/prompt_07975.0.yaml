      *   **Susan's Trap:** If you admit the history contradicts CKR, you can't use CKR to predict the future.
      *   **Robert's Stand:** CKR isn't falsified by the move; the move is evaluated *under* CKR. If CKR holds, the move *couldn't* have happened. But since we are reasoning hypothetically ("If we were at Node 2..."), we hold CKR fixed.
