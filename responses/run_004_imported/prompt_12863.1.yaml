      *   Explain the "Escape Hatch": A commitment contract that allows cancellation is just a expensive to-do list.
      *   Reframe the "Undisciplined" label: It's not a lack of willpower; it's a bad contract design. She is successfully gaming the system to avoid the gym while feeling like she's trying.

