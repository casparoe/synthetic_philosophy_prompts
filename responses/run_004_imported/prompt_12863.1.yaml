      *   **Frequency:** 5 cycles in a year.
      *   **Cost:** A few hundred dollars.
      *   **Outcome:** Gym attendance $\approx$ zero (same as if she never used the app).
      *   **K.'s Interpretation:** "I am undisciplined."
      *   **User's Interpretation:** "She's getting hustled by her own future self," but can't articulate why.
      *   **The Question:** What is actually going on? Is there a better way than "try harder"?

  2.  **Diagnose the Underlying Mechanism:**
      *   *Why does "undisciplined" feel wrong?* Because discipline implies a lack of willpower. Here, she *is* taking action (signing up, paying), but the *structure* is flawed. It's a system design problem, not a character flaw.
      *   *The "Hustle":* This sounds like **Hyperbolic Discounting** and **Time Inconsistency**. Her "Present Self" values immediate relief (canceling the stress of the commitment) more than the "Future Self" values the money/gym habit.
      *   *The Sunk Cost Fallacy (in reverse?):* She treats the penalty as a "buy-out" option.
      *   *The "Fresh Start" Effect:* Restarting feels good psychologically, giving a dopamine hit of *planning* to exercise without actually *exercising*.
      *   *The Real Issue:* The commitment device isn't binding enough. It has an escape hatch (canceling). If you can buy your way out, it's not a commitment; it's a subscription to guilt.
      *   *Ainslie's Picoeconomics:* This is a conflict between successive selves. The current self is selling out the future self for a small immediate gain (relief from pressure).

  3.  **Identify the Specific Cognitive Biases/Behaviors:**
      *   **Time Inconsistency:** Preferences change over time. In calm moments, she wants discipline. In stressed moments, she wants flexibility.
      *   **The "What-the-Hell" Effect:** Once she misses a goal or gets busy, she abandons the whole system.
      *   **Moral Licensing:** "I paid the penalty, so I've 'paid my dues' for not going." (Maybe less relevant, but possible).
