answer: |-
  This is a fantastic philosophical predicament. You are essentially asking for a way to turn P.F. Strawson's own internal distinctions against him, using his son's metaphysics not as a blunt instrument (determinism is true) but as a precise scalpel (the conditions for exemption are universally met).

  The goal is to show your father that he cannot consistently maintain the **Participant Stance** toward your brother while admitting the **Exemption Condition** for others, once Galen's regress is accepted.

  Here is a structured argument designed for a philosophy professor, avoiding the "determinism" trigger and focusing on the internal coherence of the *Freedom and Resentment* framework.

  ***

  ### The Argument: The Universalization of the Exemption Condition

  **1. Accept the Framework (The Setup)**
  Start by granting P.F. Strawson's core insight: The debate isn't about causal determinism; it's about the justification of our **reactive attitudes** (resentment, gratitude, indignation). Acknowledge that he is right to distinguish between **excuses** (which admit the agent is in the game but negate the ill will of *this* act) and **exemptions** (which remove the agent from the game entirely).

  *   *Excuse:* "He didn't see you." (Still a participant, just didn't mean it).
  *   *Exemption:* "He is a small child" or "He is psychologically warped by abusive formative circumstances." (Not a participant; we adopt the **Objective Attitude**).

  **2. Isolate the Logic of Exemption (The Wedge)**
  Ask your dad *why* P.F. Strawson grants exemptions for those "warped by formative circumstances."
  *   **The Reason:** It is not because their actions are determined. It is because their **moral nature** was not of their own making. They cannot be appropriate targets of resentment because the "quality of will" they display is the product of a history they did not author.
  *   **The Principle:** If an agent's capacity for normal reactive attitudes is the result of unchosen formative circumstances, they are exempt.

  **3. Introduce Galen's Basic Argument (The Pivot)**
  Bring in Galen Strawson not as a determinist, but as a philosopher of **constitutive luck**. Galen's Basic Argument establishes that for any agent $A$ to be responsible for action $X$, $A$ must be responsible for the mental nature $N$ that produced $X$. But $A$ cannot be responsible for $N$, because $N$ was produced by prior causes (genetics, environment, prior nature) that $A$ did not choose.
  *   *Crucial Point:* This applies to the "sane" brother just as much as the "warped" exemptee. The brother's "choice" to screw up flows from a character he did not ultimately choose.

  **4. The Collapse (The Strike)**
  Here is the surgical move. P.F. Strawson treats "unchosen formative circumstances" as a **local** condition for exemption (applying only to the severely damaged). Galen shows it is a **global** condition.
  *   If the *reason* we exempt the warped child is that "they didn't choose the nature that makes them act this way," then consistency demands we exempt the sane adult for the exact same reason.
  *   The difference between your brother and the "exempted" psychopath is not that your brother *chose his nature* and the psychopath didn't. The difference is merely that your brother's unchosen nature is **socially functional** while the psychopath's is not.
  *   **The Dilemma:** Either "unchosen nature" exempts everyone (collapsing the Participant Stance), or it exempts no one (making the exemption category arbitrary). Your dad wants to say it exempts the psychopath but not the brother. But on what non-arbitrary ground?

  **5. Anticipating the Retreat: "Proximate vs. Ultimate"**
  Your dad's fallback will be: *"I'm not talking about ultimate self-origination. I'm talking about proximate sanity and self-control. My son has those; the exemptee does not. That is sufficient for the reactive attitudes."*

  **6. Countering the Retreat (The Kill)**
  This is where you show that this retreat surrenders the very thing he wants to keep: **Moral Blame.**
  *   If he retreats to "proximate control," he admits that moral responsibility does not require *authorship* of the self, only *functionality* of the self.
  *   But if it only requires functionality, then **resentment** is no longer a moral response to *ill will*; it becomes a behavioral modification tool.
  *   **The Argument:** We treat dogs with the Objective Attitude. If a dog bites, we train it or put it down. We don't resent it. Why? Because the dog didn't choose its nature. If your brother is in the same boat (unchosen nature), but we treat him with resentment simply because his "mechanism" is complex enough to understand rules, we aren't treating him as a **moral agent**. We are treating him as a **complex machine that responds to social pressure.**
  *   **The Conclusion:** By retreating to proximate control, P.F. Strawson saves the *practice* of blaming, but he drains it of its *moral justification*. He can say, "We *must* blame him to maintain social order," but he cannot say, "He *deserves* our resentment."
  *   **The Thanksgiving Point:** If your dad cannot justify that your brother *deserves* resentment (only that he is a suitable target for behavioral management), then his "that's who he's chosen to be" line is false. It should be "that's who he *is*, and we need to manage it." But managing a brother is different from holding him morally accountable.

  ***

  ### How to Deliver This at the Dinner Table (or via Email)

  Don't lead with Galen. Lead with P.F. Strawson's own text.

  **Step 1:** "Dad, I've been re-reading *Freedom and Resentment*, specifically the section on exemptions. You always say we shift to the Objective Attitude when someone is 'warped by formative circumstances.' Is the reason we do that because their actions are determined?"
  *(He will say No.)*
  **Step 2:** "Is it because we recognize that the 'quality of will' they are showing isn't truly theirs to own? That they are victims of their own psychology?"
  *(He will likely say Yes, or something close to it.)*
  **Step 3:** "Okay. If that's the criteria for exemption—'unchosen psychological makeup'—then doesn't Galen's regress show that *everyone* meets that criteria? My brother didn't choose the brain that chooses. He's just luckier in the lottery of formative circumstances than the psychopath."
  **Step 4:** "If you say, 'I don't care about the ultimate lottery, I care about proximate sanity,' aren't you admitting that resentment isn't about *justice* anymore? It's just about *utility*. If it's just utility, then you're not holding him responsible as a moral equal; you're managing him like a difficult child who happens to be an adult. And if you're managing him, why the resentment? Why not just the Objective Attitude of 'how do we fix this'?"

  ### The "Strawson Irony" Closer
  You can end with the observation you made in your prompt, but framed philosophically:

  "It seems the Strawson family legacy is a perfect dialectic. The father says, 'Look at how we actually live; we blame people, so responsibility is real.' The son says, 'Look at what is required for that blame to be fair; it's impossible.' If you accept the Son's logic about the regress of self-creation, the Father's distinction between the 'sane' and the 'exempt' looks less like a philosophical boundary and more like a pragmatic line drawn in the sand. And if it's just pragmatic, Dad, maybe we should be pragmatic about [Brother's Name] too, and drop the resentment."

  ### Why This Works
  1.  **It respects his expertise:** It engages with the text of *Freedom and Resentment* rather than introductory metaphysics.
  2.  **It bypasses the Determinism Shield:** It doesn't argue causality; it argues *consistency* regarding the conditions of exemption.
  3.  **It targets the Reactive Attitudes:** It shows that if the Basic Argument holds, the *reactive attitude of resentment* becomes inappropriate for everyone, forcing a universal shift to the Objective Attitude (compassion/management) rather than leaving it as a "separate subject."
  4.  **It exposes the Normative Cost:** It forces him to admit that without ultimate responsibility, his "blame" is merely social engineering, which might not be what he wants to justify his feelings toward his son.
