answer: |-
  This is a classic tension between formal logic and moral practice, and your intuition is picking up on something that philosophers have debated extensively. Since you appreciate rigor, let's break this down analytically.

  Your wife is correct on the **logical** plane, but you are correct on the **moral** plane. The disconnect you're feeling is the gap between the *truth value of a proposition* and the *felicity conditions of a speech act*.

  Here is the rigorous breakdown of why your gut feeling isn't just defensiveness, but actually points to a specific philosophical concept your wife's analysis missed.

  ### 1. The Logical Layer: The *Tu Quoque* Fallacy
  Your wife identified the *tu quoque* (Latin for "you also") fallacy. In formal logic, the validity of an argument is independent of the person making it.
  *   **Proposition:** "Skipping family events is wrong."
  *   **Speaker:** Brother-in-law (BIL).
  *   **Fact:** BIL skips family events.
  *   **Logic:** The truth of the proposition is not negated by the speaker's failure to adhere to it. A smoker can truthfully tell you smoking causes cancer.

  If this were a courtroom or a lab report, your wife would be right. Pointing out the BIL's hypocrisy does not technically falsify the claim that you missed the party or that missing the party was undesirable. That is the "confound" your wife spotted: you introduced a new variable (his behavior) that doesn't change the value of the original variable (your behavior).

  ### 2. The Moral Layer: The Standing to Blame
  However, human interactions aren't just truth-tables; they are social transactions. This is where your analytical intuition is detecting a different kind of error. In moral philosophy, there is a distinction between **being wrong** and **being blamable by a specific person.**

  Philosophers like T.M. Scanlon and George Sher discuss the concept of **moral standing**. To legitimately blame someone, you generally need more than just a correct moral premise; you need the *authority* or *standing* to issue that blame.

  Hypocrisy undermines standing. Here is why, rigorously speaking:

  **A. The Commitment Condition**
  When your BIL scolds you, he is implicitly asserting: *"I uphold the norm of family attendance, and I am holding you accountable to that norm."*
  Because he flagrantly violates that norm himself, his assertion is insincere. He is not actually upholding the norm; he is weaponizing it. In analytical terms, his "signal" is contaminated. He is using a moral rule as a tool for aggression rather than a standard for community cohesion.

  **B. The Fairness Condition**
  Family functions like a cooperative system (similar to a peer review process or a collaborative experiment). For rules to be binding, they must be applied reciprocally. If one party grants themselves an exemption from the protocol while enforcing it on others, they violate the principle of **fair play**.
  Your intuition is telling you that the *injustice* lies not in the claim that you missed the party, but in the **selective enforcement** of the rule. It is unfair to be held to a standard that the enforcer treats as optional for themselves.

  **C. The Purpose of Blame**
  What is the function of moral criticism in a family? Ideally, it is to repair relationships and reinforce shared values.
  *   **Valid Blame:** "I missed you at the party; it matters to us when you're there." (Goal: Reconnection)
  *   **Hypocritical Blame:** "You skipped the party." (Goal: Dominance/Deflection)

  When a hypocrite blames you, the communicative function breaks down. You cannot learn from the criticism or repair the relationship because the messenger demonstrates that the rule doesn't actually matter to *him*. Therefore, his criticism is "infelicitous"—it fails to perform its intended social function.

  ### 3. The Analytical Chemist Analogy
  Think of it like calibration standards.
  *   **The Claim:** "This sample is impure."
  *   **The Instrument:** Your BIL.
  *   **The Issue:** The instrument itself is uncalibrated (he breaks the rules he's measuring you against).

  Your wife is arguing that the sample *might still be impure* (you did miss the party). She is logically correct.
  But you are arguing that **this specific instrument cannot be trusted to issue the certification.** Even if the result is technically accurate, the *process* is invalid. In a lab, you would reject the data not because the number was necessarily wrong, but because the chain of custody and calibration were compromised.

  ### 4. Why It Bugs You (The "Confounds")
  You mentioned hunting for the confound. In social dynamics, the "confound" is **credibility**.
  When he criticized you, he invited a judgment on his moral consistency. By saying "that's got nothing to do with it," he is attempting to isolate the variable of *your action* from the context of *his character*. But in moral philosophy, character and context are not easily isolated variables.

  There is a specific philosophical term for what he did: **Moral Privileging**. He is claiming the right to judge without subjecting himself to the same judgment. Your counter-argument wasn't an attempt to prove you didn't miss the party; it was a challenge to his **jurisdiction**.

  ### The Verdict
  Your wife is right that hypocrisy is not a **logical rebuttal**. It does not erase the fact that you skipped the party.
  However, you are right that hypocrisy is a **moral disqualifier**. It strips him of the standing to make the accusation in a way that demands your deference.

  **The Rigorous Take:**
  1.  **Fact:** You skipped the party. (True)
  2.  **Norm:** Family should attend parties. (Generally Accepted)
  3.  **Violation:** You violated the norm. (True)
  4.  **Enforcement:** BIL enforced the norm against you. (True)
  5.  **Consistency:** BIL violates the norm regularly. (True)
  6.  **Conclusion:** While the enforcement is *factually* grounded, it is *procedurally* unjust.

  You aren't dodging the accusation by pointing out his hypocrisy; you are rejecting his **authority** to level it. In a family system, authority is derived from mutual sacrifice and consistency. He has bankrupted his moral account, so he has no standing to withdraw from yours.

  So, tell your wife: "Logically, you're right; my absence is an independent variable. But ethically, he lacks the standing to be the control group."
