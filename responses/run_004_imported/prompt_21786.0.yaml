prompt: |-
  I'm a retired analytical chemist, and now that I've got time on my hands I've fallen into reading philosophy for fun -- moral philosophy especially, ever since my grandson (he's doing a philosophy degree) left a stack of old essays at my house over the holidays. I mention this because something happened with my brother-in-law a few weeks back that's been bugging me, and I'd like a more rigorous outside take than what my family gave me over dinner.

  At a family gathering he tore into me pretty hard for skipping my niece's graduation party, telling me I never make time for family stuff anymore. Here's the thing though: this is a guy who has ducked out of more family events than anyone else I know -- he left his own mothers 70th birthday party early, missed two Thanksgivings in a row, cancelled a nephew's birthday the morning of. So I brought all that up, and he just said, "that's got nothing to do with it -- you skipped the party, that's what we're talking about, don't try to change the subject." My wife backed him up afterward, saying that calling someone a hypocrite doesn't actually answer the charge against you, it's just a diversion from the real question. And logically I get that -- the party thing happened either way, his record doesn't erase mine. But as a scientist I keep hunting for the confound in his argument, because something still feels off about him specifically being the one to say this to me, like his own track record ought to count against him somehow even if it's technically beside the point of whether I was wrong to skip the party. Is my wife basically right that I'm just dodging the accusation, or is there something real underneath my gut feeling that he's not exactly the one who gets to lecture me on this?
