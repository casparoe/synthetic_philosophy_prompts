      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm correcting them in a mean way. It should be "You think you're breaking the rules, but you're actually playing the game better than anyone."
      *Key Philosophical Point:* A language needs the possibility of a mistake. In a relationship, you can misunderstand. That possibility makes the understanding real.

