          *   *Tier:* S or A. Let's lean S because it's the baseline against which others are measured, though some axiomatization debates exist.

      *   **Conditionalization (Greaves & Wallace 2006):** This argues that updating by conditionalization maximizes expected accuracy (from the prior perspective). It's very strong technically. However, it relies on the assumption that the learning experience is certain (partitionality) or requires specific assumptions about the updating rule space. Some argue it presupposes the structure it aims to justify. Still, widely regarded as a major success.
          *   *Tier:* A. Slightly below Probabilism because it requires assumptions about the learning situation (e.g., certain evidence) that are more contentious than the static coherence required for Probabilism.

      *   **Principal Principle (Pettigrew):** This connects credence to objective chance. Pettigrew has done extensive work here. The argument usually involves showing that violating the PP leaves you vulnerable to accuracy domination *if* you know the chances. The issue is the metaphysical baggage of "objective chance" and whether the accuracy measure should be sensitive to chance constraints directly. It's robust within the system but relies on stronger metaphysical premises.
          *   *Tier:* A or B. Let's go B. It's technically sound but relies on the existence and knowability of chances in a way that feels slightly more substantive than pure coherence.

      *   **Principle of Indifference (PoI):** This is notoriously tricky. Accuracy arguments for PoI usually involve minimax reasoning (minimize worst-case inaccuracy). The problem is that "ignorance" is hard to formalize without smuggling in symmetry assumptions that *are* the PoI. There are multiple competing formulations (logical vs. statistical), and accuracy arguments often depend heavily on the choice of scoring rule or the set of possible worlds considered.
