answer: |-
  This is a fantastic observation. You've hit on one of the most enduring tensions in the philosophy of religion: the clash between **epistemic rationality** (how we weigh evidence for facts) and **existential commitment** (how we orient our lives).

  If Wittgenstein were alive today and browsing LessWrong or Twitter, watching people assign "15% credence" to the existence of God, he would likely view them as making the exact same category mistake as Father O'Hara.

  Here is how Wittgenstein would likely dissect the modern "Rationalist" approach, and whether his critique holds water or is just a shield.

  ### 1. The Category Mistake: Hypothesis vs. Picture
  Wittgenstein's core argument in the *Lectures on Religious Belief* is that religious language and scientific language are two different **language games**. They look similar grammatically ("God exists" looks like "Electrons exist"), but they function differently.

  *   **The Rationalist View:** "God exists" is a proposition about the state of the universe. Like "There is water on Mars," it is either true or false, and we should assign a probability based on available data.
  *   **Wittgenstein's View:** For a genuine believer, "God exists" is not a hypothesis waiting for verification. It is a **picture** that holds them captive. It regulates their life.

  Wittgenstein would tell the Rationalist: *"You think the believer is saying, 'I suspect a deity is probable.' But they are actually saying, 'I live as if every action has infinite weight.'"*

  If you ask a believer, "What evidence would change your mind?" and they say "None," the Rationalist calls this dogmatic irrationality. Wittgenstein calls this **grammatically correct**. In the religious language game, belief is not defined by its sensitivity to evidence. If your belief in the Last Judgement vanished because you read a new paper on cosmology, Wittgenstein would argue you never really held a *religious* belief in the first place; you held a scientific hypothesis about the end of the world.

  ### 2. The Problem with "Credence"
  The idea of assigning a percentage (15% credence) relies on the assumption that religious belief is a sliding scale. Wittgenstein would argue this is phenomenologically false.

  He uses the example of the Last Judgement. If you believe in it, you don't believe it with "80% confidence." You live in fear or hope of it. The "probability" is irrelevant to the *use* of the belief.
  *   To the Rationalist, updating from 15% to 10% is a sign of intellectual honesty.
  *   To Wittgenstein, this treats God like a hidden object in a room. But for the believer, God isn't an object in the room; God is the condition under which the room has meaning.

  Wittgenstein would likely say the Rationalists are obsessed with the **cause** of the belief (evidence) rather than the **role** of the belief (how it functions in a life). He'd argue that by quantifying it, they are stripping it of the very thing that makes it religious.

  ### 3. Is This Just Immunity from Criticism?
  This is your sharpest question: *Is Wittgenstein just putting religion beyond the reach of criticism?*

  There are two ways to answer this:

  **The Charitable Reading (No, it's clarity):**
  Wittgenstein isn't saying religion is *true*. He is saying that scientific criticism misses the target. If I criticize a poem for being factually inaccurate about physics, I haven't criticized the poem; I've just misunderstood what a poem is. Wittgenstein wants to stop people from talking nonsense. He thinks O'Hara (and the Rationalists) are talking nonsense by trying to verify the unverifyable. He isn't protecting religion; he's protecting language from being misused.

  **The Critical Reading (Yes, it's a shield):**
  Many critics (like Richard Dawkins or the Rationalists you mention) argue that Wittgenstein is giving religion a "free pass." By saying "Religion is a different game," he allows believers to make claims about reality ("God created the world," "Jesus rose from the dead") without submitting them to reality checks.
  If a believer says, "Prayer cured my cancer," that *is* an empirical claim. If Wittgenstein says, "No, that's a religious expression, not a medical hypothesis," critics argue he is being dishonest. It allows religion to encroach on science while claiming it isn't playing the science game.

  ### 4. Where Wittgenstein Might Have a Point
  Despite the "shield" criticism, Wittgenstein has a strong point against the "15% credence" crowd regarding **motivation**.

  If you truly treated God as a 15% probability hypothesis, you wouldn't pray, you wouldn't tithe, and you wouldn't worry about sin. You would wait for more data. The fact that people who claim "15% credence" often still live deeply influenced by the concept suggests that the percentage is a lie (or a metaphor). They are actually operating with a "picture," not a probability.

  Wittgenstein would say the Rationalists are pretending to be more scientific than they are. When they assign a number to God, they are engaging in a ritual of rationality, not actually performing a Bayesian calculation, because there is no agreed-upon prior or likelihood function for "God." The math is fake; the posture is real.

  ### 5. Where the Rationalists Might Have a Point
  However, the Rationalists would push back that Wittgenstein creates a **ghetto for faith**.
  If religion makes no claims about reality, it's harmless poetry. But religions *do* make claims about reality (miracles, creation, afterlife). If those claims are insulated from evidence by saying "it's a different language game," then religion becomes unfalsifiable nonsense.
  The Rationalist insists: *"If you claim something exists, even a 'spiritual' something, that is a claim about reality. I am allowed to ask for evidence. If you say evidence doesn't apply, you are opting out of truth-seeking."*

  ### The Verdict
  Wittgenstein wouldn't be impressed by the "15% credence" crowd. He would likely say:
  > *"You are trying to measure the weight of a shadow. The believer is not guessing at a fact; they are navigating a life. Your percentages are a pretence of precision where there is only a difference in orientation."*

  **Does he have a point?**
  Yes, in that he accurately describes how deep religious belief actually *feels* and functions for believers. It isn't usually a Bayesian update engine.

  **Is it a shield?**
  It can be. If used to say "You can't criticize my claim that prayer heals because it's not a scientific claim," then yes, it's dishonest. But if used to say "You can't disprove my faith by showing me a fossil record, because my faith isn't a theory about fossils," then he is highlighting a genuine mismatch in frameworks.

  The Rationalists want to know if God is **real**. Wittgenstein wants to know what it **means** to believe. They are talking past each other, just as they were in O'Hara's time.
