      *   *Key Point 3: Emptiness (Sunyata) vs. Reductionism.* Madhyamaka's *sunyata* is not just reductionism; it's the lack of *svabhava* (intrinsic nature) in *everything*, including the reducing elements. Parfit reduces the person to physical/mental states but doesn't necessarily empty *those* states of intrinsic nature. He's a reductionist about persons, not necessarily an eliminativist or emptiness-proponent about matter/mind itself.
      *   *Key Point 4: Soteriological Purpose.* Parfit's goal is ethical (reducing self-concern to make utilitarianism/altruism easier). Buddhism's goal is soteriological (ending *dukkha* by uprooting clinging/ignorance). The "liberation" feels similar but functions differently.

