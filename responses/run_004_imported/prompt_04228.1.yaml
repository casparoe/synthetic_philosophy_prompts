prompt: |-
  Okay, weird tangent from the novel I'm supposed to be revising, but I can't shake it. In my writing group we throw around "verisimilitude" constantly, meaning does the story feel true even though its made up. Went down a wiki hole last night and turns out philosophers of science use that exact word for something way more technical -- like, can a false scientific theory be closer to the truth than another false theory. Apparently Popper tried to nail this down rigorously back in the 60s, and then in 1974 two guys, Miller and Tichy, working seperately, showed his whole definition breaks down (something like: it ends up implying no false theory can ever be closer to the truth than any other false theory, which kind of defeats the point of the concept).

  People have spent decades since trying to patch it back together with fancier "closeness to the truth" measures. Can you write me an essay working through whether that project actually survives? Walk through the main fixes people tried and where each one runs into trouble, then actually pick a side instead of leaving it hanging -- even something like "it only works in a watered-down, framework-relative sense" counts as a verdict, just back it up.
