answer: |-
  "He's warm, David," Elena said, her back against the sterile hallway paint. She crossed her arms over her scrub top, old habit dying hard. "His chest rises. If I put my hand on his sternum, I feel the beat. Don't tell me the machine does all of that."

  Dr. Evans didn't look up from the chart, but his shoulders tightened. "The ventilator creates the pressure change, Elena. The heart beats because the pacemaker cells are intrinsic to the myocardium. They don't need a brain to fire."

  "I was ICU for thirty years. I know what a vent looks like." She stepped closer, voice dropping to a harsh whisper. "I also know brain-dead bodies heal wounds. I've seen the charts. They fight off infections. They grow. There was a case in Texas, a woman gestated for months after declaration. You tell me how a corpse nurtures a fetus."

  "Somatic support doesn't equal organismal life," Evans said, finally meeting her eyes. "Death isn't the cessation of every cellular function. If it were, we'd be dead the moment our heart stops, yet skin grafts take from cadavers. Death is the loss of the organism as a whole. The brain isn't just a controller; it's the integrator. Without it, the body isn't a unified whole anymore. It's a collection of tissues being perfused."

  "But it's a functioning collection," Elena shot back. "That's the hole in your logic. If the body maintains homeostasis—temperature, hormone balance, waste excretion—how is the organism dead? You're saying the soul lives in the brainstem, but biology doesn't measure souls."

  "Biology measures irreversibility," Evans countered, his voice hardening. "Those cases you're citing? They are outliers sustained by aggressive intervention. The moment you remove support, the system collapses immediately. There is no capacity to recover. The integration you're talking about is artificial. We are doing the work the brain used to do."

  "Then wait," Elena said. "Wait for the heart. Circulatory death. It's clean. Everyone understands a stopped heart."

  "It's not clean," Evans said sharply. "You think Donation after Circulatory Death is clearer? It's messier. To wait for cardiac death, we withdraw support. We watch him hypoxia. If the heart stops too slowly, the organs ischemize, they're useless. If we declare death too quickly after the stop, we risk violating the dead donor rule because auto-resuscitation is possible within that window. You trade neurological certainty for circulatory ambiguity."

  "I'd rather ambiguity than cutting into a warm body," Elena said, her voice cracking.

  "We don't cut until death is declared. That's the line," Evans said. "I know you think the criteria are convenient for transplantation. I know the literature you've read. But the law isn't leading the science here; it's catching up to it. He is gone, Elena. The body is still here, but the person—the organism that was your nephew—is not."

  Elena looked at the closed door behind him. "The body remembers how to heal. That has to mean something."

  "It means cells live longer than the organism," Evans said softly. "It doesn't mean he's coming back."
