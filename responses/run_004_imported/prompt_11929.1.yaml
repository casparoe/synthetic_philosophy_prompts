prompt: |-
  This term I'm taking a graduate seminar cross-listed between the philosophy and linguistics departments, officially titled something like "Topics in Formal Semantics and Pragmatics: Conditionals," and we've just spent two sessions working through David Lewis's 1976 triviality proof in "Probabilities of Conditionals and Conditional Probabilities." I followed the bare mechanics of the argument well enough: if you assume that the probability of an indicative conditional "if A, C" always equals the conditional probability P(C|A) — Adams' Thesis — for every credence function in a class rich enough to include updates on the relevant propositions, and if you also assume the conditional expresses an ordinary proposition subject to the usual probability calculus, you can derive that the space of possibilities has to collapse to something absurdly coarse-grained. What I'm still not confident I understand is how the two camps that split off after the proof actually argue with one another once the dust settles, rather than just each declaring victory. My professor mentioned that Stalnaker and van Fraassen kept truth conditions and gave up the unrestricted thesis, while Adams and Edgington kept the thesis and gave up truth conditions (the "no truth value" view), but she moved on to McGee's paper before we could really dig into the exchange between them.

  For my seminar response paper, I want to include an imagined exchange between representatives of these two camps, and I'd like your help drafting it. Could you write a dialogue of around 700–900 words between a philosopher who preserves truth conditions for indicative conditionals (and is accordingly committed to restricting or relativizing Adams' Thesis rather than accepting it across the board) and a philosopher who keeps Adams' Thesis unrestricted and concludes, on the strength of Lewis's proof, that indicative conditionals never had truth conditions to begin with? Please have them meet, say, arguing in the hallway right after the talk that started it all, and make sure they're evenly matched: I don't want either one to be a pushover, and I don't want them to just restate their opening positions past each other. In particular, I'd like the truth-conditions side to press the no-truth-value side on how conditionals are supposed to embed under negation, conjunction, and as premises in arguments like modus tollens if they lack a genuine truth value, and I'd like the no-truth-value side to press back by asking exactly which premise of Lewis's proof its opponent rejects and why relativizing or restricting the thesis there isn't simply an ad hoc dodge of the result. Let the dialogue end wherever the argument naturally leads, even if that's an unresolved but sharpened disagreement rather than a tidy resolution.
