answer: |-
  The hallway outside the lecture hall smelled of stale coffee and cigarette smoke. It was 1976, and the air still felt thick from David Lewis's presentation. Robert, clutching a stack of notes on world-selection functions, caught up with Ernest, who was lighting a cigarette near the exit.

  "Well," Robert said, "that was devastating. But I don't think it kills the truth-conditional approach."

  Ernest exhaled a plume of smoke. "Devastating? It's a liberation. Lewis has shown that if you insist conditionals express propositions subject to the standard probability calculus, you force the space of possibilities to collapse. The only way out is to admit indicatives don't have truth conditions. Adams was right: accept the thesis, drop the truth values."

  "But you're ignoring the cost," Robert countered. "If 'If A, then C' lacks a truth value, how do you handle embedding? Consider negation. If I say, 'It is not the case that if it rains, the match will be cancelled,' what am I denying? If the conditional isn't true or false, negation has no grip. Same for conjunction: 'If it rains, the match is cancelled, and if it shines, we have a picnic.' You're treating these as coherent compounds, yet on your view, they're strings of non-propositions."

  Ernest tapped ash onto the linoleum. "We manage. We don't need truth conditions to explain logical behavior; we need a logic of assertability. When I accept a conditional, I'm not storing a proposition; I'm conditioning my credence. If I become certain the match won't be cancelled, my acceptance of 'If it rains, it's cancelled' drops to zero. That handles the functional role without the ontological baggage."

  "But what about modus tollens?" Robert pressed. "If I accept 'If A, C' and then discover not-C, I reject A. That inference feels truth-preservative. If the conditional never had a truth value to begin with, in what sense is the argument valid? You're changing the subject from truth to psychological coherence."

  "I'm sharpening it," Ernest replied. "Validity preserves certainty, not just truth. But let's turn the screw. You want to keep truth conditions. Fine. Which premise of Lewis's proof are you rejecting? You must admit that P(If A, C) equals P(C|A) in ordinary cases. So, to save truth conditions, you have to claim that equation fails in the specific cases Lewis constructs. Isn't that purely ad hoc? You're restricting the thesis solely to dodge the triviality result, not because linguistic intuition demands it."

  Robert shifted his weight. "It's not ad hoc; it's theoretical discipline. The equation holds for simple cases, but Lewis shows it cannot hold universally if conditionals are propositions. I'd rather say our intuition about probability falters in complex credence states than say our logic falters in basic embedding. If I deny truth conditions, I lose the ability to say a conditional is simply *false*. On your view, if A is false, the conditional is void. But sometimes I want to say, 'You were wrong to say if A, C,' even if A didn't happen."

  "That's the dogma of truth conditions speaking," Ernest said. "You feel deprived without a truth value. But look at the alternative. To save that value, you have to posit that the probability of a conditional diverges from conditional probability in ways speakers never detect. You're positing a hidden structure that violates the very data—our betting behavior—that motivated the analysis. Is it really less ad hoc to claim speakers are systematically mistaken about their own credences than to claim philosophers were mistaken about grammar?"

  "Systematic mistake is better than logical incoherence," Robert said. "If you drop truth conditions, you sever the link between semantics and logic. You make conditionals semantic orphans. They can't be premises in standard deductions; they can't be scopes for operators. You're building a firewall around indicatives to protect the thesis, claiming they operate in a special zone of 'uncertainty logic.' But natural language doesn't respect firewalls. We embed conditionals under 'possibly,' under 'believes that,' under negation. If they lack truth conditions, those embeddings should be meaningless, yet they aren't."

  Ernest finished his cigarette. "Perhaps 'meaningful' doesn't require truth conditions. Perhaps it requires conditions of use. Lewis has forced a choice: truth conditions or the thesis. I choose the thesis because it captures the link between indication and belief. You choose truth conditions because you want to save classical logic. But don't pretend your restriction isn't a retreat. You're saving the form of the proposition by emptying it of its probabilistic soul."

  "And you're saving the soul by dissolving the body," Robert replied. "We'll see which one survives the embedding tests."

  "We will," Ernest said, turning toward the door. "But until then, don't ask me if it's true. Ask me if I'd bet on it."
