answer: |-
  You have hit on one of the most durable and sophisticated objections to the standard money-pump argument. You are absolutely right: the force of the money pump is almost entirely **diachronic**, and relying on **resolute choice** (à la Edward McClennen) effectively insulates synchronic preferences from the charge of irrationality.

  Here is the strongest case for your position: that money pumps demonstrate a vulnerability in *dynamic consistency*, not necessarily a flaw in *static preference orderings*.

  ### 1. The Diachronic Dependency
  The fundamental premise of a money pump is that the agent faces a **sequence** of decision nodes. In a purely synchronic context (a single moment of evaluation), cyclic preferences ($A \succ B \succ C \succ A$) result in no loss. You simply hold the item you prefer most *in that context*.

  The loss only materializes because the agent is **dynamically inconsistent**: their preference at $t_2$ overrides their plan at $t_1$. If rationality is defined as the effective pursuit of ends, the failure isn't that the agent values $A$ over $B$ and $B$ over $C$; the failure is that the agent lacks a mechanism to prevent their future self from undermining their current self's goals. The "irrationality" is located in the *temporal connection* between choices, not the choices themselves.

  ### 2. Resolute Choice as a Rational Policy
  McClennen's *Rationality and Dynamic Choice* (1990) argues that sophisticated agents don't just maximize at each node; they maximize over **plans**.

  If an agent recognizes they have cyclic preferences, they can adopt a **resolute choice** policy: "I will choose $A$ initially, and I will refuse all subsequent trades, regardless of my local preferences at that moment."
  *   **The Objection:** Critics say this is irrational because at $t_2$, the agent prefers $B$ to $A$, so choosing $A$ violates dominance.
  *   **The Rebuttal:** This begs the question by assuming the unit of rational agency is the *isolated act*. If the unit of agency is the *temporally extended plan*, then sticking to the plan is instrumentally rational because it avoids the sure loss. The agent isn't violating their preferences; they are prioritizing a higher-order preference for **non-exploitability** over a first-order preference for the specific trade.

  ### 3. Preferences vs. Choice Functions
  The money pump argument conflates **preferences** (a ranking of states) with **choice functions** (a rule for selecting options).
  *   You can maintain cyclic preferences (perhaps due to incommensurable values, e.g., Justice vs. Mercy vs. Efficiency) without being irrational.
  *   What the money pump proves is that you cannot pair cyclic preferences with a **naive choice function** (always maximize local utility).
  *   However, you *can* pair cyclic preferences with a **resolute choice function**.

  Therefore, the money pump doesn't prove your values are wrong; it proves your *decision procedure* needs to account for time. It establishes a constraint on **implementation**, not **valuation**.

  ### 4. The "Single-Pump" Counter and Why It Fails to Bite
  Recent work (e.g., Johan Gustafsson) has attempted to construct "single-pump" arguments to make the threat synchronic. However, these usually rely on embedding the sequence into a single choice context (e.g., "Choose between [Keep A] and [Trade A for B then Trade B for C...]").

  Even here, the argument relies on the agent's belief about their own future behavior. If the agent can credibly commit (via resolute choice or pre-commitment devices), the single-pump collapses. The vulnerability remains dependent on the agent's inability to bind their future actions, which is a diachronic governance problem, not a synchronic preference problem.

  ### The Verdict
  The money pump argument successfully proves that **naive agents with cyclic preferences are exploitable.** It does not prove that **cyclic preferences are inherently irrational.**

  By adopting resolute choice, an agent acknowledges that rationality is a **governance problem over time**. You can keep your cyclic, incomplete, or context-dependent preferences (which may better reflect the complexity of value) as long as you govern your choices with a policy that prevents dynamic inconsistency. The money pump doesn't force you to fix your preferences; it forces you to grow up and make a plan.
