answer: |-
  This is a fantastic debate to have at 1am, and honestly, the fact that you both know the "intolerance, indignation, and disgust" test by heart shows you're deep in the weeds in the best way.

  You are right to suspect that Dworkin's 1966 article, *"Lord Devlin and the Enforcement of Morals,"* isn't just Hart with a thesaurus. While Hart and Dworkin end up in the same liberal place (the law shouldn't enforce morality for morality's sake), they take completely different routes to get there, and they attack Devlin on different flanks.

  Here is the breakdown of Dworkin's specific critique, how it differs from Hart's, and a verdict on who lands the heavier blow.

  ### 1. Dworkin's Specific Critique: The "Principle vs. Prejudice" Problem

  Hart's main attack on Devlin is that Devlin conflates *positive morality* (what people happen to believe) with *critical morality* (what is actually right), and that there is no evidence society collapses without legal enforcement of morals.

  Dworkin, however, attacks Devlin's **methodology for identifying morality in the first place.**

  Devlin argues that we can identify the "shared morality" of society by looking at the reactions of the "reasonable man" (specifically, a jury). If twelve ordinary people feel **intolerance, indignation, and disgust** toward a practice, that proves the practice violates the society's foundational moral bonds.

  Dworkin's core objection is that **Devlin provides no way to distinguish between a *moral judgment* and a *mere preference or prejudice*.**

  *   **The Argument:** Dworkin argues that for a judgment to be "moral," it must be based on a **principle** (a general standard of conduct that applies to everyone, including the judge). A **prejudice**, by contrast, is an emotional reaction or a preference that doesn't rely on reasoned justification (e.g., "I don't like *those* people doing *that*").
  *   **The Flaw in Devlin's Test:** When Devlin asks, "Does the reasonable man feel disgust?", he is measuring a psychological fact, not a moral truth. The "reasonable man" might feel disgust because of irrational bias, ignorance, or visceral prejudice.
  *   **The Consequence:** If the "disgust" Devlin relies on is actually just prejudice, then the law isn't enforcing "morality" (which implies a rational structure of rights and duties); it is enforcing **popular prejudice.** Dworkin argues Devlin never proves that the "reasonable man's" disgust tracks moral truth rather than irrational bias.

  **In short:** Hart says, "Even if it is morality, the law shouldn't enforce it." Dworkin says, "Devlin hasn't even proven it *is* morality; he's just proven people are grossed out."

  ### 2. How Dworkin Differs from Hart (Conceptual vs. Normative)

  To settle your argument, you need to show your friend that Hart and Dworkin are playing different games.

  **Hart's Objection is Normative and Empirical (The "Should" and the "Does")**
  *   **Type:** Utilitarian/Liberal.
  *   **Focus:** The *consequences* of the law.
  *   **Argument:** Hart argues from the **Harm Principle**. He says, "Okay, let's assume society hates this. Does it hurt anyone? No. Will society collapse if we stop banning it? No evidence."
  *   **Weakness:** Hart accepts Devlin's definition of morality for the sake of argument but rejects the *enforcement* of it. He fights on the ground of liberty and social utility.

  **Dworkin's Objection is Conceptual and Analytical (The "Is")**
  *   **Type:** Rights-based/Analytical.
  *   **Focus:** The *justification* of the law.
  *   **Argument:** Dworkin argues that Devlin's test is **conceptually incoherent.** You cannot build a legal philosophy on "disgust" because disgust is not a reasoned position. For Dworkin, law must be grounded in **principles** that respect individual rights. If the only justification for a law is "it makes people feel sick," that is not a legal principle; it is an aggregation of private preferences.
  *   **The "Rights" Trump:** Dworkin introduces the idea (which he fleshes out later in *Taking Rights Seriously*) that individuals have rights that act as "trumps" against collective utility. Even if the *entire* society felt genuine moral indignation (not just prejudice), Dworkin would argue the individual has a right to liberty that outweighs the society's desire for moral conformity. Hart leans on liberty as a good; Dworkin treats rights as structural barriers.

  **The Concrete Difference:**
  *   **Hart:** "You can't ban gay sex because it doesn't cause harm."
  *   **Dworkin:** "You can't ban gay sex because 'disgust' is not a valid legal reason, and the 'reasonable man' test is just a mask for prejudice."

  ### 3. Who Does More Damage to Devlin?

  This is the million-dollar question.

  **Hart wins on Policy and History.**
  Hart's empirical claim—that societies do not disintegrate when they decriminalize private immorality—has largely been borne out by history. The "social fabric" did not unravel when sodomy laws were repealed. If you are arguing about *practical governance*, Hart is the stronger critique.

  **Dworkin wins on Philosophy and Logic.**
  However, if you are arguing about **jurisprudence** (which you are), **Dworkin does more damage to Devlin's internal logic.**

  Here is why:
  Devlin's entire case rests on the idea that there is a "public morality" that is distinct from "private preference," and that the jury test reveals it. Dworkin shows that Devlin provides **no mechanism** to tell the difference.
  *   If Devlin says, "The reasonable man knows morality when he feels it," Dworkin replies, "The reasonable man also felt intolerance toward interracial marriage."
  *   If Devlin says, "But that was wrong morality," Dworkin replies, "Then your test fails, because your test validated the wrong morality."
  *   If Devlin says, "We should ban it anyway to preserve cohesion," Dworkin replies, "Then you aren't defending morality; you are defending conformity."

  Dworkin exposes that Devlin is begging the question. Devlin assumes the "disgust" of the reasonable man is a proxy for moral truth, but he offers no way to filter out irrational prejudice. By undermining the **epistemological basis** of Devlin's test (how we *know* what the shared morality is), Dworkin collapses the foundation of Devlin's argument before we even get to whether the law *should* enforce it.

  ### The Verdict for Your Friend

  Tell her this:
  > "Hart argues that Devlin is **dangerous** because he violates liberty without cause. But Dworkin argues that Devlin is **incoherent** because he mistakes feelings for principles. Hart says the law *shouldn't* enforce morality. Dworkin says Devlin hasn't even identified *what* morality is—he's just identified prejudice. Dworkin's critique is more fundamental because it shows Devlin's 'reasonable man' test can't do the job Devlin claims it does."

  **Winner:** **Dworkin** takes the round on philosophical rigor. He shows that Devlin's "shared morality" is a phantom that dissolves under analysis. Hart takes the round on political philosophy. But since you're arguing jurisprudence, Dworkin is the heavier hitter here.

  (Also, tell her that if she wants to read the specific text, it's *Yale Law Journal*, Vol. 75, No. 6 (1966). Nothing settles a 1am argument like a specific citation.)
