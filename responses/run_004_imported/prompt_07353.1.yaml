answer: |-
  # The Gauge Freedom of Value: Why "True Rewards" Are a Category Mistake

  **To:** PhD Candidate in Machine Learning
  **Subject:** The Ontological Status of the Reward Function

  Your worry is not a symptom of impostor syndrome; it is a symptom of theoretical maturity. You have identified the central tension in the foundations of value alignment. The unease you feel regarding Inverse Reinforcement Learning (IRL) stems from a collision between the engineering necessity of assuming stable preferences and the mathematical/philosophical reality that preferences, as latent variables distinct from behavior, are underdetermined.

  You asked for a definite position on whether IRL can, in the limit of unlimited data and computation, recover an agent's "true" preferences, or if this is a category mistake. I will not hedge.

  **The Verdict:** Talk of a determinate "true reward function" waiting to be inferred from behavior is a **category mistake**. In the idealized limit of unlimited behavioral data, IRL cannot recover a unique, ontologically distinct preference structure because no such structure exists independently of the interpretive scheme used to model the agent. Preferences are not latent causes of behavior; they are normative constructs we impose on behavior to make it intelligible.

  This essay defends this anti-realist verdict by engaging with the strongest mathematical and philosophical arguments on both sides. It concludes by outlining how you can proceed with your research without succumbing to nihilism.

  ---

  ### I. The Mathematical Objection: No Free Lunch in Decomposition

  The core of your anxiety likely rests on the result by Armstrong and Mindermann (2018), "Occam's Razor is Insufficient to Infer the Preferences of Irrational Agents." Their theorem is the formalization of your worry.

  In standard IRL, we assume a policy $\pi$ is generated by a reward function $R$ optimized by a planning algorithm $p$. We write this loosely as $\pi = p(R)$. The goal of IRL is to invert this: given $\pi$, find $R$.

  Armstrong and Mindermann prove that for any policy $\pi$, and for *any* candidate reward function $R'$, there exists a planning algorithm $p'$ such that $p'(R') = \pi$. In other words, you can attribute any behavior to any goal, provided you are willing to attribute a sufficiently complex (or "biased") planning process to the agent. A random policy can be explained as maximizing a specific reward if we assume the agent is maximally biased against achieving it in every specific instance.

  The standard defense against this is to apply a simplicity prior (Occam's Razor). We assume the true $(R, p)$ pair is the simplest one that explains the data. However, Armstrong and Mindermann show that "simplicity" is relative to the description language. There is no language-independent notion of Kolmogorov complexity that privileges the "rational" decomposition over the "biased" one. You can construct a programming language where the "irrational" decomposition is the shortest code.

  **The Realist Counter-Argument:**
  A defender of IRL might argue that this mathematical degeneracy ignores *causal structure*. In the real world, agents are not black boxes. If we have unlimited data, we don't just see actions; we see the internal states leading to them. If we can observe the agent's neural weights or brain states, surely we can locate the "reward signal" physically? If a dopamine neuron fires, isn't that the $R$?

  This is the strongest case for Realism: that $R$ is not an abstract mathematical object, but a physical variable causally upstream of action. If we have unlimited data, we trace the causal chain. The "true" reward is the variable that, if intervened upon, changes the policy in a goal-directed manner.

  ### II. The Philosophical Objection: The Intentional Stance

  The Realist argument fails because it conflates *correlates* of value with *value itself*. This is where the philosophical lineage from Samuelson to Dennett becomes crucial.

  In economics, Paul Samuelson attempted to solve the underdetermination problem by defining preference *as* choice (Revealed Preference Theory). If you choose A over B, you prefer A over B. This avoids the metaphysical swamp but renders the concept of preference useless for welfare analysis (as Amartya Sen famously argued). If preference is just choice, we cannot say an agent made a *mistake*. But IRL relies on the possibility of mistakes (sub-optimality) to distinguish $R$ from $p$. If the agent is perfectly rational, $R$ is still underdetermined (the zero-reward function works). If the agent is irrational, we need to know *how* they are irrational to find $R$, which requires knowing $R$ to begin with.

  Daniel Dennett's "Intentional Stance" offers the correct metaphysical framing. Dennett argues that beliefs and desires are not internal states waiting to be found like marbles in a bag. They are abstractions we use to predict systems. We treat a system as an agent *if doing so yields predictive compression*.

  When you apply IRL, you are not discovering a latent variable; you are adopting a stance. You are asking, "What *would* a rational agent want if they acted this way?" The "reward function" you recover is a summary statistic of the behavior relative to a rationality assumption. It is a lossy compression, not a ground truth.

  **The Realist Rebuttal:**
  The Realist might press: "Surely there is a difference between a thermostat and a human? The human has *qualia* of wanting. Doesn't that fix the reference?"

  This appeals to phenomenology. But even if the agent *feels* a certain way, translating that feeling into a formal reward function $R(s)$ requires interpretation. Does the feeling correspond to state $s$ or state $s'$? Does the agent want pleasure (hedonism) or the satisfaction of desire (desire-fulfillment)? These are philosophical distinctions that behavior (and even neural data) cannot resolve. The "feeling" itself must be interpreted under a description, and that interpretation is subject to the same underdetermination.

  ### III. The Normative Load

  The decisive argument against the Realist view is that "preference" is inherently normative, not descriptive.

  When we say an agent "truly wants" $X$, we are not merely describing a causal tendency. We are making a claim about what counts as a *success* for that agent. We are distinguishing between the agent's *competence* (what they are trying to do) and their *performance* (what they actually did).

  This distinction is not found in the data. The data is just performance. To separate competence from performance, you must import a normative standard of rationality. You must decide which deviations from optimality count as "noise" (to be ignored) and which count as "signal" (to be incorporated into $R$).

  Consider a robotic assistant that repeatedly opens an empty cupboard.
  *   **Model A:** It wants food ($R=$ food), but its vision is broken ($p=$ biased).
  *   **Model B:** It wants to open cupboards ($R=$ open cupboards), and it is rational ($p=$ optimal).

  Behaviorally, these are identical. Even with unlimited data on the cupboard openings, you cannot distinguish them. You need to know whether the robot *should* have seen the food. That "should" is not in the dataset. It is in your head.

  Therefore, the "true reward" is not a fact about the agent; it is a fact about the relationship between the agent and the interpreter. It is a *joint* property, not an intrinsic one. To treat it as an intrinsic latent variable is the category mistake. It is like asking for the "true center of gravity" of a cloud. You can calculate one, but it depends on the density model you impose. The cloud does not contain a point labeled "CG."

  ### IV. The Verdict and The Path Forward

  **Verdict:** IRL cannot recover "true preferences" because "true preferences" (as unique, behaviorally-isolated latent variables) do not exist. The decomposition of behavior into reward and planning is a gauge freedom in the theory of agency. You cannot fix the gauge with data alone; you must fix it with normative assumptions.

  **Does this invalidate your PhD?**
  No. But it requires a pivot in how you frame your contribution.

  If you continue to frame your work as "recovering the user's true intent," you are chasing a ghost. You will remain stuck in the underdetermination trap. However, if you reframe the problem as **normative co-construction**, the path clears.

  1.  **Abandon the "Discovery" Metaphor:** Stop treating the reward function as a hidden treasure map. Treat it as a *contract* or a *proposal*. The goal of IRL is not to find the *one* true $R$, but to find an $R$ that, when optimized, yields behavior the human endorses.
  2.  **Embrace Interaction (CIRL):** The Armstrong & Mindermann result holds for *passive* observation. It weakens significantly in Cooperative IRL (CIRL) settings where the human can actively correct the robot. Why? because the correction itself is a speech act that narrows the interpretive space. It doesn't solve the underdetermination logically, but it solves it pragmatically through negotiation.
  3.  **Make Assumptions Explicit:** Instead of hiding your simplicity priors or rationality assumptions in the loss function, treat them as hyperparameters of the *interpretive stance*. Your research should focus on how different assumptions about human bias (e.g., hyperbolic discounting vs. noise) lead to different value alignments, and which are robust to human oversight.

  ### Conclusion

  You are right to be unsettled. The standard pitch for IRL *does* presuppose a folk-psychological metaphysics that does not survive scrutiny. There is no "true reward" hidden in the data, waiting for enough compute to reveal it.

  But this is not a dead end; it is a liberation. It frees you from the impossible burden of omniscience. You are not an archaeologist digging up the fossil of human value. You are an architect negotiating a structure that can hold human weight. The "truth" of the reward function is not its correspondence to a latent state, but its viability in a shared world.

  Proceed with your work, but change the story you tell about it. Do not claim to infer preferences. Claim to *elicit* and *refine* them through interaction. The underdetermination is not a bug in your math; it is a feature of agency that requires human feedback to resolve. Your job is not to solve the philosophy, but to build the interface where that philosophy gets settled.
