prompt: |-
  My grandpa died about a month ago, and a close friend of mine who's way more into philosophy than I am lent me her copy of the Zhuangzi and told me to read the chapter where a guy's body gets all twisted up from some illness and his friends come to see him. He's totally at peace with it, joking that if whatever's in charge of these things turns his arm into a rooster he'll use it to crow at dawn, and if his backside turns into cart wheels and his spirit into a horse he'll just climb aboard himself, no carriage needed. Later in the same book there's a similar bit about a dying man getting recast like metal into a rat's liver or a bug's arm and being completely fine with it too. My friend's whole pitch was that this is basically the Chinese version of reincarnation, and honestly it helped, because I liked the idea of my grandpa's "stuff" getting reshuffled into something else out there instead of just ending.

  But the more I sit with it, the more I want to double check the reincarnation framing, because it seems too convenient that Zhuangzi would've basically landed on the same idea Buddhism is famous for, just centuries earlier, before Buddhism had even reached China. Is it fair to say Daoism independantly arrived at something like reincarnation and karma on its own, and Buddhism just gave it a more systematic form later on? And if that's right, does Zhuangzi ever suggest the transformation depends on how the person lived, the way karma is supposed to shape your next life, or am I projecting something onto it that isn't really there? I tried googling this a bit and everyone's takes just seem to talk past each other, so figured I'd ask here directly since it's been on my mind alot since the funeral.
