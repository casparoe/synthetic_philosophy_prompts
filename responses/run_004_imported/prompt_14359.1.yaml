answer: |-
  **Title:** The Ghost in the Machine: Why Old Evidence Does Not Break Bayesian Confirmation

  **Introduction**

  The argument in your meeting is a microcosm of a debate that has raged in the philosophy of science for fifty years. On one side, you have the practitioner's intuition: a model that successfully accounts for known data feels like a success, regardless of when that data was collected. On the other side, you have the strict Bayesian formalist: if the data was already known, its probability is 1, and mathematically, you cannot update on a certainty.

  This is the "Problem of Old Evidence," famously articulated by Clark Glymour in 1980. It strikes at the heart of Bayesian Confirmation Theory (BCT). If BCT cannot explain why Einstein's General Relativity was confirmed by the pre-existing anomaly of Mercury's perihelion, can it explain anything?

  Your coworker who built the causal model believes the fit confirms his theory. Your Bayesian colleague believes this is incoherent. To resolve this, we must look under the hood of the mathematics. The short answer is that your Bayesian colleague is right about the *naive* application of the formula, but wrong about the *implications* for the framework. The long answer requires us to distinguish between learning facts and learning relationships. This essay will argue that the Problem of Old Evidence is not a permanent crack in the Bayesian framework, but rather a signpost indicating that confirmation often comes from learning logical connections, not just empirical data. Old evidence *can* confirm a hypothesis, provided we understand what is actually being updated.

  **The Mathematical Dead End**

  To understand why your Bayesian colleague felt confident in his objection, we have to look at the standard definition of confirmation. In Bayesian terms, evidence $E$ confirms hypothesis $H$ if learning $E$ increases the probability of $H$. Mathematically, this is expressed as:

  $$P(H|E) > P(H)$$

  Using Bayes' Theorem, this increase depends on the likelihood ratio. However, the mechanism of update is conditionalization. We take our prior belief in $H$ and update it by conditioning on $E$.

  The problem arises when $E$ is "old." If the dataset has been sitting around for two years, everyone on your team already knows it is true. In Bayesian probability, if you are certain of a proposition, its probability is 1. So, $P(E) = 1$.

  If $P(E) = 1$, then the conditional probability $P(H|E)$ collapses. By the definition of conditional probability:

  $$P(H|E) = \frac{P(H \cap E)}{P(E)}$$

  If $P(E) = 1$, the denominator is 1. Furthermore, if the hypothesis $H$ entails the evidence $E$ (which a good model should), then $P(H \cap E)$ is just $P(H)$. The equation becomes:

  $$P(H|E) = \frac{P(H)}{1} = P(H)$$

  The posterior probability equals the prior probability. The degree of confirmation is zero.

  According to this strict reading, your coworker's model gains no credit for fitting the old dataset. The Bayesian skeptic is mathematically correct: if you treat the *data itself* as the thing you are conditioning on, and you already knew the data, you cannot update. This implies that Newtonian physics received no confirmation from the tides (known since antiquity) and Einstein received no confirmation from Mercury (known since 1859). This conclusion is absurd, which is why it is called a "problem."

  **The Proposed Fixes**

  Philosophers and statisticians have not ignored this absurdity. There are two primary classes of solutions, and understanding the difference is key to judging who was right in your meeting.

  The first approach is the **Counterfactual (or Historical) Reconstruction**. Proponents argue that to assess confirmation, we should pretend we don't know $E$. We reconstruct a "prior" state of mind where the data was unknown, calculate how much the hypothesis would have raised the probability of that data, and use that as the measure of confirmation.

  While intuitive, this approach is fraught with subjectivity. How do we authentically reconstruct a state of ignorance? If we know the data now, can we truly pretend we don't? It makes confirmation dependent on a fictional history rather than the actual logical relationship between theory and world.

  The second, more robust approach addresses the assumption of **Logical Omniscience**. The mathematical deadlock described above ($P(E)=1$) assumes that the agent knows all logical consequences of their beliefs instantly. It assumes that as soon as the hypothesis $H$ was proposed, the agent immediately knew that $H$ implied $E$.

  But humans are not logically omniscient. When Einstein proposed General Relativity, he did not immediately know it solved the Mercury anomaly. He had to do the math. The "new information" was not the position of Mercury (which was old), but the *logical fact* that General Relativity entails the position of Mercury.

  In this view, we do not update on $E$ (the data). We update on the proposition $(H \vdash E)$—the statement that "Hypothesis $H$ explains Evidence $E$." Since the team did not know the causal model would fit the data until the coworker actually ran the analysis, the proposition "Model fits Data" was not certain. Its probability was less than 1. Therefore, learning that the model *does* fit the data allows for a valid Bayesian update.

  **The Verdict**

  So, who was right in the meeting? And is this a fatal flaw in Bayesianism?

  I will commit to a definitive answer: **The Problem of Old Evidence is not a permanent crack in the Bayesian framework, and old evidence can genuinely confirm a hypothesis.** However, this requires rejecting the naive view that we update solely on empirical data points.

  Your Bayesian colleague was right about the *mechanism* but wrong about the *conclusion*. If you treat the dataset as a raw empirical input that you are seeing for the first time, he is correct: you cannot condition on a certainty. But that is not how science works. Science is not just collecting stamps; it is building structures that connect facts.

  When your coworker built the causal model, he did not discover the data; he discovered a *relationship*. The confirmation comes from the reduction in uncertainty regarding the hypothesis's structural validity. Before the model was built, there was a possibility that the new causal structure would be incompatible with the old data. By demonstrating compatibility, the coworker eliminated a risk. That elimination of risk is where the probability mass shifts.

  Therefore, the framework holds, but it must be interpreted dynamically. Bayesianism is not a static calculus for gods who know all logical truths; it is a logic for bounded agents who learn logical connections over time. If we relax the assumption of logical omniscience—which any realistic application of statistics must do—the paradox dissolves. The "new" evidence is the discovery of the entailment relation.

  **Conclusion**

  In your specific workplace context, the coworker with the causal model is justified in claiming the old data supports his model. The fact that the data was known does not strip it of its power to rule out competing models that *would not* have fit it. The Bayesian skeptic is correct only in the narrowest, most idealized mathematical sense that applies to no human being: that you cannot learn what you already know. But you can learn that a new idea is consistent with what you know, and that is a form of learning that carries probabilistic weight.

  The Problem of Old Evidence is not a refutation of Bayesian confirmation theory; it is a refinement of it. It forces us to acknowledge that information is not just "facts about the world," but also "facts about the connections between our ideas and the world." As long as we account for the information gained in discovering those connections, old evidence remains potent. The framework is not cracked; it simply requires us to be honest about what we didn't know yesterday that we know today.
