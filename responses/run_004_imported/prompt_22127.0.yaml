  Standing here, looking at all of you, I keep thinking about the sound of her rosary beads. Click, click, click. Every night. That was the rhythm of our house while I was growing up. She raised me when my parents worked nights. She was the one who made sure I ate, who checked my homework, who taught me how to be decent. She gave me stability.

  People often talk about faith like it's a guess about the future. Like checking a weather forecast for the soul. They ask for evidence. But watching her, I learned it wasn't that. It wasn't that she hoped heaven was real; it was that she lived *as if* it was the only thing that mattered. And because she lived that way, it became real in this room. It became real in how she treated us.

  To reduce her belief to just a nice story would be wrong. It was too solid for that. It wasn't a metaphor to her; it was the air she breathed. But it also wasn't something she needed to prove with charts or logic. It wasn't a hypothesis. It was the lens through which she saw everything. When she said she'd see Abuelo again, she wasn't making a prediction about dates and times. She was stating the foundation of her life. That certainty wasn't shaky; it was what allowed her to be so fearless in her love. She didn't hoard her kindness because she knew love doesn't end. She didn't fear loss the way we do, because her map of the world was bigger than death.

  So when I say she's with him now, I'm honoring the way she lived. Her faith wasn't a theory about the afterlife; it was the engine of her life here. The truth of it isn't in arguments we can win or lose. The truth of it is in the fact that she raised us with peace instead of fear. She lived with an anchor that held through every storm. We are gathered here not because we all share the exact same thoughts, but because we all share the same love that she taught us. That love is the evidence that matters.

  I miss her. We all do. But I try to look at my own life and ask, do I love with that same certainty? Do I live with that same ground beneath my feet? That's her legacy. Not just the prayers she said, but the peace they gave her. Abuela, thank you for showing us what it looks like to stand on solid ground. Rest now. You've earned it. We'll take it from here.
