answer: |-
  Frank Ramsey would most plausibly reject the longtermist case for prioritizing AI existential risk, not by abandoning his own decision theory, but by arguing that longtermism violates the **epistemic constraints** of "Truth and Probability" and the **axiological commitments** of "Epilogue." He would view longtermism as a category error: a pseudo-rational application of expected utility calculus to inputs that lack the pragmatic grounding required for coherent belief, driven by a theory of value that mistakes cosmic scale for moral weight.

  To understand why, we must recognize that for Ramsey, Subjective Expected Utility (SEU) was never a license to calculate with arbitrary numbers. It was a normative theory of *coherence* grounded in *action*. In "Truth and Probability," Ramsey defines a degree of belief as a "disposition to act," specifically measured by the odds at which one is prepared to bet. This is a pragmatic definition. A probability is only meaningful insofar as it can guide a decision in a concrete context.

  Ramsey would argue that the probabilities assigned to AI existential risk (e.g., a 10% chance of human extinction by 2100 due to AGI) fail this test. These are not degrees of belief derived from frequency or logical relation, nor are they dispositions to act that can be cashed out in a betting quotient. One cannot meaningfully "bet" on the survival of the species over centuries; the payoff conditions are too remote, the verification too delayed, and the causal chains too speculative to form a coherent habit of action. For Ramsey, assigning a precise numerical probability to such a unique, unprecedented metaphysical scenario is not rationality; it is "numerical fetishism" masquerading as rigor. He would likely contend that because these probabilities cannot guide immediate, testable action, they fall outside the domain of rational belief entirely. Thus, the expected-value calculus collapses at the first step: you cannot multiply utility by a probability that is epistemically undefined.

  However, Ramsey's rejection would go deeper than mere epistemic skepticism. Even if one could conjure a coherent probability, the Ramsey of "Epilogue" would reject the *utility* function longtermists employ. The longtermist argument relies heavily on the "astronomical waste" intuition: that the sheer number of potential future lives creates a moral imperative that dwarfs present concerns. This assumes value is an aggregate quantity external to the observer, scalable with the size of the universe.

  In "Epilogue," Ramsey explicitly repudiates this view. He writes that human beings are the source of value, and that the "size" of the universe is irrelevant to the good. He argues against being "humbled" by the vastness of time or space, insisting that our "map of importance" should center on human relations, friendship, and the capacity for enjoyment *now*. To prioritize a speculative future of trillions over the concrete goods of the present is to succumb to the very cosmic humility Ramsey warned against. It treats the universe's potential capacity as more valuable than the universe's actual capacity for feeling, which resides in living minds. For Ramsey, value tracks the *actual* capacity for thought and feeling. A future that does not exist has no value; a future that *might* exist has only the value we assign it through present action. To sacrifice the "goods of the mind" (friendship, conversation, understanding) in the present for the sake of a hypothetical future is to destroy the very source of value in a misguided attempt to protect it.

  Therefore, the most plausible Ramseyian position is a synthesis: **Longtermism is irrational because it applies a tool designed for actionable belief (SEU) to unactionable speculation, in service of a value system that alienates us from the source of goodness (human experience).**

  Ramsey would not say, "The math is wrong." He would say, "The inputs are nonsense." He would argue that the longtermist commits a double error. First, they violate the pragmatism of "Truth and Probability" by treating speculative metaphysics as measurable risk. Second, they violate the humanism of "Epilogue" by allowing the abstract magnitude of the future to eclipse the concrete reality of the present.

  In a debate with a longtermist, Ramsey would likely concede that preventing human extinction is good (as it preserves the capacity for value), but he would vehemently deny that this good can be quantified as "astronomical" or that it overrides immediate moral duties. He would argue that the rational agent maximizes expected utility based on *coherent* beliefs and *human-centered* values. Since the longtermist's probabilities are incoherent (unbettable) and their values are misaligned (cosmic rather than human), their conclusion is not a triumph of rationality, but a philosophical confusion. Ramsey would urge us to draw our map of importance with the stellar vastness shrunk to its proper insignificance, focusing our rational efforts on the tangible improvement of human life rather than the speculative salvation of a future we cannot know.
