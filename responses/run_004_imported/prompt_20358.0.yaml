      *   **Kelly as a Special Case:** Kelly assumes specific conditions (known odds, repeated bets, log utility). Geometric rationality tries to generalize this to "decisions that compound." But Kelly is brittle (overbetting leads to ruin).
      *   **Samuelson's Trolling:** Tell the story of the one-syllable paper ("Proof That Proper Anticipation..."). Why was he mad? Because he thought mixing time averages with utility was a category error. He was defending EUT's flexibility.
      *   **The Verdict (Taking the Stance):**
