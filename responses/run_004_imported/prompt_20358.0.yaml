      *   **Expected Utility Theory (EUT):** Von Neumann-Morgenstern. Maximize $E[U(x)]$. If $U(x) = \log(x)$, you get Kelly.
      *   **Geometric Rationality:** A newer framing (associated with rationalist communities, e.g., LessWrong, Scott Alexander, etc.). Claims that geometric averaging is *fundamentally* more rational for repeated/compounding decisions, not just a preference choice. It often frames arithmetic averaging as a cognitive error in specific contexts.

