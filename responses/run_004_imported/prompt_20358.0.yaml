answer: |-
  Here is the breakdown of the Kelly Criterion, "Geometric Rationality," and why your stats professor and your brother are technically both right, but talking past each other.

  ### The Short Answer: Is it a Rival Theory?
  **No.** "Geometric Rationality" is not a rival to Expected Utility Theory (EUT). It is a specific, aggressive marketing campaign for a specific subset of Expected Utility Theory.

  Your intuition is correct: Maximizing expected log wealth **is** Expected Utility Theory with a logarithmic utility function ($U(x) = \ln(x)$). Mathematically, there is no conflict. If you tell an EUT purist, "I want to maximize my geometric growth rate," they will say, "Great, that just means your utility function is logarithmic. Welcome to the club."

  However, the *framing* of Geometric Rationality claims something stronger: that using the geometric mean isn't just a subjective preference (like preferring apples to oranges), but an **objective requirement** for survival in a non-ergodic world.

  Here is the deep dive on why that distinction matters, where the hype comes from, and why Paul Samuelson lost his mind over it.

  ---

  ### 1. Kelly vs. Geometric Rationality: The Scope Creep
  Your brother is obsessed with the **Kelly Criterion**, which is a formula. **Geometric Rationality** is a philosophy.

  **The Kelly Criterion** is narrow and technical. It tells you exactly how much to bet ($f^*$) in a repeated gamble with known odds to maximize the long-term growth rate of your bankroll.
  *   **Assumptions:** You can bet infinitely small fractions, you can reinvest winnings infinitely, you care only about the limit as time goes to infinity, and you never need to withdraw money for rent.
  *   **The Problem:** It is brittle. If you overestimate your edge even slightly, "Full Kelly" betting leads to massive volatility and a high risk of ruin. It assumes the only thing that matters is the final number in your account after 10,000 bets.

  **Geometric Rationality** (as discussed in rationalist circles) tries to generalize Kelly. It argues that for *any* decision that compounds over time (career choices, health habits, investing), you should evaluate options using geometric averaging rather than arithmetic averaging.
  *   **The Claim:** Arithmetic averaging (Expected Value) assumes you can average across parallel universes (ensemble average). Geometric averaging assumes you live in one universe through time (time average).
  *   **The Addition:** It shifts the argument from "What do I prefer?" (Utility) to "What is the physical structure of the system?" (Ergodicity).

  **How Kelly is a "Too Special" Case:**
  Kelly assumes you are a pure growth machine. Geometric Rationality tries to apply that logic to life decisions where "wealth" is vague. But Kelly is often *too* aggressive for humans. A "Half-Kelly" bettor sacrifices 25% of growth rate to reduce volatility by 50%. Geometric Rationality struggles to prescribe *which* fraction to use when the odds aren't as clear as a poker hand. It identifies the right *metric* (geometric growth), but it doesn't always solve the *optimization* problem in messy real-world scenarios.

  ### 2. The Ergodicity Breakthrough (The "New" Insight)
  So, if it's just Log Utility, why the hype? Why do people call it "Geometric Rationality" instead of "Log Utility Maximization"?

  Because of **Ergodicity**.

  In your stats class, you were taught that Expected Value is the "rational" price of a gamble. If I offer you a coin flip: Heads you win \$200, Tails you lose \$100, the EV is \$50. A "rational" risk-neutral agent should pay up to \$50 to play.

  But if you play that game repeatedly, betting your whole bankroll each time, you will go broke. Why? Because the **ensemble average** (what happens if 1,000 people play once) is not the same as the **time average** (what happens if one person plays 1,000 times).
  *   **Ensemble (Arithmetic):** One person wins \$200, one loses \$100. Average wealth = +\$50.
  *   **Time (Geometric):** You win, then you lose. \$100 $\rightarrow$ \$200 $\rightarrow$ \$100. You are back to start. But if you lose then win: \$100 $\rightarrow$ \$50 $\rightarrow$ \$100. Wait, actually, if you bet *full bankroll* on a multiplicative process, a loss of 50% requires a gain of 100% to recover. The geometric mean drags you down.

  **The Geometric Rationality Argument:**
  Standard economics treats risk aversion as a psychological quirk (a "utility function"). Geometric Rationality argues risk aversion is a **mathematical necessity** in non-ergodic systems. You don't need a "log utility function" because you like logs; you need it because multiplication over time destroys arithmetic averages.

  This is the "rival" claim: They argue that standard EV maximization isn't just a different preference; it's a **category error** when applied to sequential, compounding decisions.

  ### 3. Samuelson's One-Syllable Trolling
  You mentioned Paul Samuelson, the giant of 20th-century economics. He hated this line of reasoning. In 1971, he published a paper titled *"Proof That Properly Anticipated Prices Fluctuate Randomly"*? No. He published a paper titled **"Fallacy of the Log-Normal Approximation to Optimal Portfolio Decision-Making Over Many Periods."**

  But the trolling masterpiece you're thinking of is his commentary on the Kelly Criterion. He didn't write a whole paper in one-syllable words (that was actually a different linguistics challenge), but he did write a famous paper where he essentially called Kelly bettors **"irrational"** for ignoring their own utility preferences.

  Samuelson's point was simple: **Why are you pretending this is objective?**
  If you want to maximize log wealth, just say you have log utility. Don't pretend that "Geometric Rationality" is the *One True Way* and that EV maximizers are stupid. Samuelson argued that if I have a finite horizon (I'm going to die in 10 years) or if I need to eat (I can't bet my rent money), then maximizing geometric growth is actually *suboptimal* for my actual goals.

  Samuelson was mad because the Kelly/Geometric crowd was trying to derive an "ought" (you *should* bet this way) from an "is" (multiplication works this way), bypassing the subjective human element of Utility. He viewed it as a cult trying to mathematically legislate risk tolerance.

  ### 4. The Verdict: Is it a Rival Theory?
  Here is my stance, no wishy-washy hedging:

  **Geometric Rationality is oversold as a theory, but undersold as a correction.**

  **Why it's oversold:**
  Calling it a "rival theory of rationality" is branding fluff. It is not a rival to Expected Utility Theory. It is a subset. If you build a model where the agent maximizes Geometric Growth, you have simply built an Expected Utility model with $U(x) = \ln(x)$. There is no new math here. Claiming it replaces standard rationality is like claiming "Veganism" replaces "Nutrition." It's a dietary constraint within the broader system, not a new biological law.

  Furthermore, strict Geometric Rationality can lead to absurdity. If you strictly maximize geometric growth, you should reject almost all positive-EV ventures that carry a non-zero risk of total ruin, even if the upside is civilization-saving. A strict geometric maximizer might not start a company, might not innovate, and might not take necessary existential risks.

  **Why it's undersold:**
  However, your stats class **lied to you**. Or at least, it gave you a tool (Expected Value) without a warning label. In introductory statistics and finance, EV is taught as the default "rational" metric. This is dangerous. It trains people to think in terms of ensemble averages (parallel universes) when they live in time averages (sequential reality).

  Geometric Rationality deserves credit for popularizing **Ergodicity Economics** (championed recently by physicist Ole Peters). This is the real value: recognizing that for compounding systems, the arithmetic mean is physically misleading. It's not that EV is "wrong"; it's that EV answers the question *"What is the average outcome if a million people do this once?"* when you actually want to know *"What happens to me if I do this a million times?"*

  ### Conclusion
  Your brother is right that you should care about geometric growth for trading and poker. If you bet to maximize Arithmetic EV in a compounding game, you will go broke. That is a mathematical fact.

  But the "Geometric Rationality" bloggers are wrong to frame it as a new philosophy that overturns standard decision theory. It's simply **Expected Utility Theory applied correctly to non-ergodic systems.**

  **The Stance:**
  Treat "Geometric Rationality" as a **remedial correction** to bad statistics teaching, not a **revolutionary rival** to decision theory.
  *   **Use Geometric Thinking** when: Decisions are repeated, outcomes compound, and ruin is possible (Trading, Poker, Career Capital).
  *   **Use Arithmetic EV** when: Decisions are one-off, additive, and backed by insurance or diversification (Buying a lottery ticket for fun, Insurance policies, One-time bets with capped downside).

  Samuelson was right that it's not a new theory of rationality. But the rationalists are right that ignoring it is a fast way to blow up your account. Your brother won't shut up about it because he found a cheat code for not going broke. That doesn't make it a new religion; it just makes it good math.
