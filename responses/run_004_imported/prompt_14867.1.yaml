  2.  **Deconstruct the Philosophy:**
      *   **Williamson (Anti-Luminosity):** No non-trivial condition is luminous (i.e., whenever it obtains, you are in a position to know it obtains). Argument relies on margin for error. If you feel cold, there's a borderline case where you feel cold but can't know it because the difference is too slight to detect reliably. Therefore, you don't *know* you feel cold in every case. Applies to mental states too.
      *   **Shoemaker (Self-Blindness):** A creature with our concepts (belief, pain) cannot be "self-blind." To have the concept of belief/pain implies a capacity for self-awareness. If you believe $p$, you must be able to know you believe $p$ without observation. Otherwise, you don't really grasp the concept.
      *   **KK Principle:** $Kp \to KKp$. If you know something, you know that you know it. Williamson attacks this via anti-luminosity. Shoemaker supports a version of it via the nature of rationality/concepts.

