answer: |-
  The ice in Sarah's glass had melted down to a nub. Outside, the rain was finally stopping, leaving the window dark and reflective.

  "You're hiding behind reliability," Elias said, leaning forward. "Shoemaker's point wasn't about detection. It was about constitutive rules. A creature with our concepts *cannot* be self-blind. If you believe it's raining, you have immediate access to that belief. Otherwise, you don't really *have* the concept of belief."

  Sarah swirled her drink. "Williamson dismantled that. It's the margin for error. Imagine you're slowly warming up. At moment *t*, you feel cold. At *t+1*, you feel slightly less cold. The difference is indiscernible. If you know you feel cold at *t*, you must be able to rule out *t+1*. But you can't. So you don't know. Nothing is luminous, Elias. Not even pain. Not even belief."

  "But that treats the mind like a thermometer," Elias snapped. "We aren't passive gauges. We're rational agents. To hold a belief is to take responsibility for it. That responsibility *requires* knowing you hold it. KK isn't just a logical trick; it's what it means to be sane."

  "Is it?" Sarah looked at him over the rim of her glass. "Or is it just a story we tell ourselves to feel stable? You say I must know I believe. But what about the fade? What about the things that slip away while I'm looking at them?"

  "That's different. That's change, not state."

  "Is it?" She set the glass down. Hard. "Let's apply your KK. You know you love her. Okay. Do you know that you know?"

  Elias flinched. Just barely. "That's not fair."

  "Williamson isn't fair. He's right. If love is a mental state, it's subject to margins. You wake up one day and the certainty is a millimeter softer. You don't notice. You wake up again, another millimeter. At what point did you stop knowing you loved her? There is no point. That's the horror. There's no luminous moment where the light goes out."

  "So I'm supposed to believe I'm self-blind to my own heart?" Elias rubbed his face. "Shoemaker says I can't be. If I believe I love her, I must be aware of that commitment. If I lose it, I should know."

  "Should," Sarah said softly. "But do you? When did you stop grading papers? When did you stop calling me? There was no moment where you knew you knew you were done with us. With the department. With any of it."

  Elias went quiet. The rain started again, a soft tap against the glass.

  "I know I'm here," he said finally.

  "Are you?" Sarah stood up, walking to the window. "Or do you just know you're *not* there? Negative knowledge. That's all we have, Elias. We know when we're cold because we shiver. We don't know when we're warm. We just stop shaking. You don't know you know you love her. You just know you haven't stopped yet."

  Elias looked at his hands. They were steady. He wasn't sure if that meant anything.

  "And if I stop shaking," he said, his voice low, "and I don't notice until the room is empty?"

  "Then you weren't luminous," Sarah said, not turning around. "You were just warm. And then you weren't."
