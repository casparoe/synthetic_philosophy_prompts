answer: |-
  You have hit on a distinction that professional ethicists often struggle to articulate clearly. You are right to feel that "hypocrisy" is the wrong lever to pull in this scene. If you make the argument about hypocrisy, your character sounds defensive. If you make it about *authority*, your character sounds dangerous.

  Here is the plain, intuitive breakdown of what is actually happening, followed by how to use it in your scene.

  ### The Core Concept: You Can't Speak for a Rule You Treat as Optional

  To understand "standing to blame," stop thinking about the *person* and start thinking about the *rule*.

  When we blame someone, we aren't just punishing them. We are acting as a representative for a shared standard. We are saying, "This rule matters to us, and you have broken it." For that message to land, the speaker must show that the rule is **binding**, not optional.

  Here is why your two examples work the way they do:

  **1. The Open Violator (No Hypocrisy, No Standing)**
  Imagine a thief who openly says, "I steal, I don't care, and I think stealing is fine." If this thief catches you stealing and screams at you, their blame feels empty. Why? Because their behavior has announced that the rule against stealing is **optional**.
  If the rule is optional for them, they cannot logically claim it is mandatory for you. By breaking the rule openly, they have forfeited the right to speak on its behalf. They aren't defending the law; they are just bullying you.

  **2. The Hypocrite (Hypocrisy, But Retained Standing on Unrelated Faults)**
  Now imagine a man who cheats on his taxes (dishonesty) but condemns you for running away from a fight (cowardice).
  Even though he is a hypocrite about honesty, he still has standing to blame you for cowardice. Why? Because his tax cheating didn't declare the *value of courage* to be optional. He still submits to the rule of courage. He can legitimately say, "I may fail at honesty, but I know cowardice is wrong, and you were a coward."
  His standing is tied to the **specific norm**, not his general moral scorecard.

  ### Why This Is Hard to Locate

  It is hard to locate because we confuse **moral purity** with **moral authority**.
  *   **Purity:** "I have never broken this rule." (Not required for standing).
  *   **Authority:** "I acknowledge this rule binds me, even when I fail." (Required for standing).

  The loss of standing happens when a person's actions suggest they are **above the rule** (hypocrisy) or **outside the rule** (open violation). In both cases, they are no longer standing *under* the rule with you. They have stepped out of the shared moral community regarding that specific issue.

  ### How to Write the Scene

  In your scene, the accused character should not say, "You did it too." That is the schoolyard deflection (*tu quoque*).
  Instead, she should say, "You don't get to speak for this promise anymore."

  She needs to shift the focus from **her sin** to **his silence**. She needs to point out that by committing the same betrayal, he has declared that specific promise to be optional. Therefore, his anger isn't moral outrage; it's just pain looking for a target.

  **The Philosophical Beat:**
  The accuser thinks he is holding her accountable to a shared standard.
  The accused reveals that *there is no shared standard left*, because he broke it first.

  **Drafting Idea:**
  Don't have her list his sins. Have her question his *voice*.

  > **Accuser:** "You lied to me. After everything we said about trust, you lied."
  >
  > **Character:** "Don't."
  >
  > **Accuser:** "Don't what? Tell you the truth?"
  >
  > **Character:** "Don't speak for the truth. Not about this. You broke that vow last winter. You didn't hide it, you didn't apologize, you just... moved on. You treated that promise like it was a suggestion."
  >
  > **Accuser:** "That doesn't give you the right to—"
  >
  > **Character:** "It takes away *your* right. Blame only works if we're both under the same law. You opted out. So when you yell at me, it's not justice. It's just you being angry that I got caught doing what you already decided was fine."

  ### Summary for Your Notes
  *   **Standing is not about clean hands.** It is about **shared submission** to the rule.
  *   **Hypocrisy is not the killer.** Treating the rule as **optional** is the killer.
  *   **The Deflection:** Do not argue "You are bad." Argue "You are silent." You have disqualified yourself from being the voice of this specific value.

  This makes your character sound not like she's escaping blame, but like she's correcting a philosophical error in the accuser's position. It raises the stakes from "who is worse" to "do we even live in the same moral world?"
