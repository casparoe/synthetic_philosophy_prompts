answer: |-
  This is a profound and genuinely difficult dilemma that touches on epistemology, ethics, and pedagogy. You are experiencing a conflict between **first-order evidence** (the specific content of the paper and your comments) and **higher-order evidence** (the research about how fatigue affects judgment).

  Here is an analysis of whether your position is irrational, followed by a practical recommendation.

  ### 1. Is it irrational to hold both thoughts?

  **No, it is not irrational.** In fact, it is epistemically responsible.

  You are encountering a classic problem in philosophy known as **Higher-Order Evidence**.
  *   **First-Order Evidence:** "I have read the paper and my comments. The argument breaks down at point X, Y, and Z. Therefore, the grade is a B-."
  *   **Higher-Order Evidence:** "I know that my cognitive faculties were impaired by fatigue at the time of judgment, and that this impairment statistically correlates with harshness toward heterodox views."

  The tension you feel is the rational response to these two data points colliding. It would be *irrational* to simply ignore the research because your judgment *feels* right. This is due to the **bias blind spot**: cognitive biases (like fatigue-induced impatience) are, by definition, processes that operate below the level of conscious introspection. You cannot "see" the bias in your comments for the same reason a colorblind person cannot "see" that they are misidentifying colors. The comments look logical to you because your fatigued brain constructed them to be logical; the bias lies in the *threshold* for what counted as a breakdown, not necessarily in the logic used to describe it.

  Holding both thoughts simultaneously acknowledges that human judgment is fallible. You are correctly recognizing that statistical reliability (the research) often trumps introspective confidence (your feeling that the comments are right).

  ### 2. Practically speaking, what should you do?

  This requires balancing fairness to the student, fairness to the cohort, and your own professional integrity.

  **The Case for Adjusting the Grade**
  The research you cite suggests a systematic skew against *unconventional* reasoning specifically. Since you noted the paper was "heterodox," it fits the exact profile of the bias.
  *   **The Invisible Threshold:** Even if your comments are logically sound, fatigue may have lowered your tolerance for risk. A well-rested you might have viewed the "breakdown" as a creative leap worth a B, whereas the fatigued you viewed it as a structural failure worth a B-.
  *   **The Ethical Obligation:** In a graduate seminar, encouraging intellectual risk-taking is paramount. Penalizing a heterodox argument due to a biological state (fatigue) undermines the pedagogical mission.
  *   **The Outlier Factor:** You mentioned this was the "last paper." Assuming the rest of the class was graded during normal hours, this student is an outlier. Treating them differently to correct for an environmental disadvantage restores equity across the cohort.

  **The Case for Maintaining the Grade**
  *   **Integrity of Judgment:** You have reviewed the work twice (once grading, once auditing) and stand by the critique. To change the grade without identifying a specific error in your feedback could feel like intellectual dishonesty.
  *   **Grade Consistency:** If you adjust this grade based on a hunch, where does it stop? Does every late-night grade need adjustment?

  **The Recommendation**
  **You should adjust the grade, but slightly.**

  Here is the practical reasoning:
  1.  **Do not invalidate your comments.** Your critique may still be valid. The argument *might* actually break down where you say it does. You do not need to retract your feedback to acknowledge the grade was harsh.
  2.  **Apply the "Benefit of the Doubt" Hedge.** The research indicates a *probability* of harshness, not a certainty of error. Therefore, a full letter grade jump (to an A-) is unjustified. However, removing the "minus" (moving from B- to B) is a prudent hedge. It acknowledges that while the flaws you identified are real, your weighting of those flaws may have been negatively influenced by the time of day.
  3.  **Do not announce the change.** Do not tell the student, "I graded this late so I'm giving you a higher grade." This undermines their confidence in your evaluation. Simply submit the adjusted grade.
  4.  **Check the Cohort.** Briefly scan the timestamps of the other papers. If you graded three other papers after midnight, you have a consistency issue across the board. If this was the only one, the adjustment is isolated and fair.

  ### Summary
  You are not being irrational; you are being intellectually honest about the limits of your own cognition. The fact that your comments *look* right is exactly what the research warns you to expect.

  **Action:** Raise the grade to a **B**. This respects your professional critique (the flaws exist) while mitigating the statistical likelihood of fatigue-induced harshness (the penalty is reduced).

  **Future Policy:** Set a hard rule: **No grading after 10 p.m.** If a paper is left unfinished, it waits until morning. Your future self (and your students) will thank you.
