answer: |-
  1. **The Unity of Externalism:** Putnam's natural-kind externalism relies on causal-historical relations to physical environments, whereas Burge's social externalism relies on normative practices and deference within a linguistic community. Do these two models individuate content in the *same* metaphysical sense, or is "externalism" merely a label for two distinct mechanisms that happen to yield wide content? If they are distinct, does this threaten the generality of the anti-individualist thesis?
      *   **Follow-up:** If she insists they are unified under a general "contextual dependence," press whether the *normative* dimension unique to Burge's view introduces a constraint on self-knowledge that Putnam's causal view does not, thereby fracturing the compatibilist account.

  2.  **Slow-Switching and Introspective Indiscriminability:** In slow-switching cases (e.g., moving from Earth to Twin Earth over years), the subject's concepts shift without their introspective awareness. If the subject cannot tell "from the inside" that their thought contents have changed, does this imply that privileged access applies only to narrow, notational states rather than the actual wide contents you defend?
      *   **Follow-up:** If she replies that self-knowledge is non-empirical but not infallible regarding content shifts, ask whether this concedes that the *authority* of self-knowledge is weaker than the compatibilist line typically claims, given that the subject is blind to the very individuation conditions of their thoughts.

  3.  **McKinsey and Transmission Failure:** Your compatibilist line suggests self-knowledge and externalism are consistent, but the McKinsey argument threatens to derive a priori knowledge of the external world from that consistency. To block this, do you need to adopt the specific "transmission failure" thesis (that warrant for premises doesn't transmit to the conclusion), and if so, does this render self-knowledge epistemically inert in broader reasoning?
      *   **Follow-up:** If she accepts transmission failure as the necessary block, ask whether this admits that self-knowledge cannot serve as a foundational premise for empirical knowledge, which seems to undermine the philosophical utility of maintaining privileged access in the first place.

  4.  **The Deflation of "Privileged Access":** Compatibilists often redefine privileged access as a matter of the *mode* of knowing (direct, non-observational) rather than the *content* known. Is this redefinition too deflationary? If I cannot introspectively distinguish my thought that *water is wet* from my twin's thought that *twater is wet*, in what robust sense is my access to my own mind "privileged" over my access to theirs?
      *   **Follow-up:** If she argues that the relation itself is what matters, not discriminability, press whether this makes self-knowledge trivial: if I know my thought only under a description that hides its individuation conditions, do I really know *what* I am thinking?

  5.  **Empty Natural Kind Terms:** Consider terms like "phlogiston" or "witch," which fail to refer to any real natural kind. If content is determined externally, do thoughts involving these terms lack content entirely, or do they revert to a narrow, descriptive content? If the latter, doesn't this create a hybrid view where externalism only applies when the world cooperates?
      *   **Follow-up:** If she maintains that causal history still individuates the empty concept, ask how the subject has privileged access to a causal history that terminates in nothing, and whether this breaks the symmetry between successful and unsuccessful reference cases.

  6.  **Normative Authority and Deference:** Burge emphasizes that we defer to expert usage to fix content, implying a normative constraint on what we *ought* to mean. If my understanding of a concept diverges from the social norm, externalism says I have the content the experts fix, not what I grasp. Does this not alienate me from my own thoughts, making self-knowledge a matter of sociological investigation rather than introspection?
      *   **Follow-up:** If she replies that deference is implicit and part of the thought's identity, ask whether this implies that a subject could be systematically mistaken about the normative boundaries of their own concepts without any possibility of introspective correction.

  7.  **Phenomenology and Wide Content:** Many philosophers argue that "what it is like" to think a thought (its phenomenology) supervenes on the internal state. If externalism is true, two internally identical subjects have different contents but identical phenomenology. Does this entail that self-knowledge tracks phenomenology rather than content, and if so, how do we know the wide content at all?
      *   **Follow-up:** If she denies that phenomenology is neutral (arguing for "wide phenomenology"), ask for an account of how the external environment causally influences the phenomenal character of experience without violating the internalist intuition that brains in vats have similar experiences to ours.

  8.  **The Falsification Condition:** Finally, setting aside minor adjustments to the theory, is there any specific argument, thought experiment, or empirical result regarding self-knowledge that would actually compel you to abandon the compatibilist line entirely and concede that externalism and privileged access are incompatible?
      *   **Follow-up:** (No follow-up needed for the final question, but be prepared to listen closely to whether she cites a conceptual limit or admits the view is unfalsifiable.)
