answer: |-
  **MEMORANDUM**

  **TO:** Academic Integrity Board
  **FROM:** [Your Name], Department of Philosophy
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding AI-Detection Tool Policy

  **Recommendation:** **Adopt-with-Conditions**

  I recommend we approve the procurement of the AI-detection tool for *investigative* purposes only, but **reject** the proposal to allow detection flags to serve as substantive *evidence of misconduct* until specific validation criteria are met.

  **Epistemic Justification**
  The vendor's case conflates *reliability* (consistency) with *validity* (accuracy). That the tool yields the same result twice (test-retest reliability) or agrees with a sibling model (inter-rater reliability) demonstrates only internal coherence. It does not demonstrate correspondence with reality. A broken clock is reliable twice a day; a biased scale is consistent but wrong. In epistemological terms, the vendor offers us a coherentist justification for a tool that requires an empirical, correspondence-based justification.

  **The "Trust Has to Start Somewhere" Objection**
  I must firmly reject the argument that "all measurement rests on an instrument trusted without independent check." This is a category error. Foundational axioms in logic may rest without external proof, but empirical instruments do not. We trust thermometers not because they agree with other thermometers, but because they correspond to independent physical standards (freezing/boiling points). Here, an independent check (ground truth) is available but unused. To treat this tool as a "brute fact" is not foundationalism; it is negligence. Consistency without validation is not a basis for trust; it is a basis for systemic error.

  **Required Conditions**
  To move the flags from "investigative lead" to "admissible evidence," the following conditions must be satisfied:

  1.  **External Validation Study:** The vendor (or an independent third party) must demonstrate accuracy against a dataset of essays with verified authorship (e.g., in-class writing vs. known AI generation).
  2.  **Error Rate Disclosure:** False positive rates must be quantified specifically for our student demographic and disciplines.
  3.  **Timeline:** This data must be presented to the Board before the tool is used as evidence in any hearing, and no later than the start of the next academic term.

  Until these conditions are met, a flag may trigger an oral defense or further inquiry, but it cannot constitute proof of guilt. To do otherwise violates the principles of fairness and epistemic responsibility owed to our students.
