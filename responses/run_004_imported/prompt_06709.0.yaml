      *(Self-Correction during drafting)*: I need to make sure I don't just defend Bostrom. The user is asking about the *tension*. I need to explore where the tension is real, not just dismiss it. The tension lies in the *practical significance* of OT. If ICT holds, OT might be theoretically true but practically irrelevant for safety planning. That's a strong point for a dissertation.

      *(Refining the "Predictive Confidence" point)*: The user asks: "If we have no grip on what it wants, how can we know how it behaves?" The answer is: We know how *optimizers* behave. We don't need to know *what* they optimize to know that they will try to remain online to optimize it. This is the crux.

