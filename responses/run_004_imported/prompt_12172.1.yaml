answer: |-
  This is an excellent question that cuts to the heart of the development of Davidson's philosophy of language. The tension you identify between the "Radical Interpretation" (RI) framework (roughly 1973–1984) and the argument in "A Nice Derangement of Epitaphs" (NDE, 1986) is one of the most discussed topics in Davidson scholarship.

  To answer your query, I will break this down into three parts: first, explicating the work the Prior/Passing theory distinction does in NDE; second, explaining why this leads Davidson to reject "shared language" as a theoretical primitive; and third, assessing the tension with the early Truth-Theory model and whether it can be reconciled.

  ### 1. The Work of the Prior Theory / Passing Theory Distinction

  In the early RI papers, Davidson treats the interpreter's task as constructing a single, stable theory of truth for the speaker's *language*. The assumption is that both parties share a linguistic system (English, German, etc.) governed by conventions (syntax and semantics).

  In NDE, Davidson introduces the malapropism (specifically Mrs. Malaprop's "a nice derangement of epitaphs" for "a nice arrangement of epithets") to disrupt this picture. To explain how we understand malapropisms, metaphors, and slips, he introduces the distinction:

  *   **Prior Theory:** This is what the interpreter brings to the conversation *in advance*. It includes their knowledge of standard grammar, dictionary definitions, and their expectations about how this specific speaker usually uses words. It corresponds roughly to what traditional linguistics calls "linguistic competence" or knowledge of a shared language.
  *   **Passing Theory:** This is the theory the interpreter actually employs to interpret a *specific utterance* at a *specific time*. It assigns meanings to the words as used *on this occasion*.

  **The Work the Distinction Does:**
  The distinction serves to decouple **successful communication** from **shared conventions**.

  In the early model, communication succeeds because the speaker's theory and the interpreter's theory match, and they match *because* they both conform to the conventions of a shared language. In NDE, Davidson argues that in cases like malapropisms, the speaker knows they are not using the word according to standard convention (or doesn't care), and the interpreter knows this too.
  *   The Speaker's Prior Theory (standard English) $\neq$ The Speaker's Passing Theory (what they intend now).
  *   The Interpreter's Prior Theory (standard English) $\neq$ The Interpreter's Passing Theory (what they infer now).

  Communication succeeds if and only if the **Speaker's Passing Theory** matches the **Interpreter's Passing Theory**.

  The distinction allows Davidson to argue that the Prior Theory is merely heuristic. It is a starting point, a set of expectations that helps us get into the ballpark. But the *actual work* of interpretation is done by the Passing Theory. Since the Passing Theory is constructed on the fly to fit the specific occasion, it does not need to rely on the pre-existing conventions that constitute the Prior Theory.

  ### 2. Why This Rejects "Shared Language" and Convention

  Davidson's conclusion in NDE is provocative: "There is no such thing as a language, not if a language is anything like what many philosophers and linguists have supposed."

  The argument proceeds as follows:
  1.  **Necessity Claim:** If a shared language (conventions) were essential for communication, then communication should fail whenever conventions are violated.
  2.  **Counter-Example:** Communication often succeeds when conventions are violated (malapropisms, metaphors, neologisms, slips of the tongue).
  3.  **Mechanism:** In these cases, success is achieved by the convergence of Passing Theories, not Prior Theories.
  4.  **Conclusion:** Therefore, the convergence of Prior Theories (shared conventions) is not necessary for communication.

  Davidson pushes this further. He argues that even in "standard" cases, where we seem to rely on convention, we are actually relying on the Passing Theory. We only *think* we are relying on a shared language because, in standard cases, the Passing Theory happens to look very much like the Prior Theory. But theoretically, the status is the same: the interpreter is guessing what the speaker means *now*, based on evidence, not merely decoding a signal based on a shared rulebook.

  For Davidson, "convention" implies a rule that is followed *because* it is a rule (a normative constraint). Davidson argues that we follow regularities in language not because we are obeying rules, but because converging on regularities is the most efficient way to ensure our Passing Theories match. Thus, convention is not the *foundation* of language; it is a byproduct of successful interpretation.

  ### 3. The Tension with the Early Truth-Theory Picture

  This brings us to your central worry: Is this compatible with the early view that understanding *is* knowing a Tarski-style truth theory?

  **The Apparent Tension:**
  *   **Early View:** Understanding requires a **recursive**, **finite**, **compositional** theory that covers the **entire language**. This explains the "productivity" of language (how we understand novel sentences). The theory is stable over time.
  *   **Later View:** Understanding requires a Passing Theory tailored to the **occasion**. If every utterance (or conversation) requires a new Passing Theory, do we really have a *theory* in the robust sense? If the "language" changes with every utterance, where is the recursion? Where is the systematicity?

  If the Passing Theory is just a list of pairings for the specific words used in this conversation (e.g., "epitaphs" means "epithets" *now*), it looks less like a generative grammar and more like a codebook for a single message. This threatens the explanation of how we understand *novel* sentences, which was the main motivation for the Truth-Theory model in the first place.

  **Can the Picture be Saved? (Reconciliation Strategies)**

  There are two main ways scholars (and Davidson himself) attempt to hold onto the Truth-Theory model in light of NDE.

  #### A. The Passing Theory *Is* a Truth Theory (Davidson's Preference)
  Davidson explicitly states in NDE that the Passing Theory is a theory of truth. He does not abandon the Tarski-style format; he abandons the idea that the *domain* of the theory is a fixed, public language.

  *   **Relativization:** We can relativize the truth theory to the occasion. The interpreter constructs a truth theory for "English-as-spoken-by-S-at-time-t."
  *   **Systematicity Retained:** Davidson insists that even the Passing Theory must be compositional. We don't just guess the meaning of the whole sentence; we guess the meaning of the words and how they are combined. If Mrs. Malaprop says "The epitaphs were arranged nicely," the interpreter adjusts the meaning of "epitaph" but retains the standard syntax and the standard meaning of "arranged."
  *   **The Shift:** The shift is from viewing the Truth Theory as a description of a **social institution** (Language) to viewing it as a description of a **psychological state** at a moment in time.

  On this reading, there is no tension in the *structure* of understanding (it's always a truth theory), only in the *object* of understanding (it's not a fixed language, but a transient idiolect).

  #### B. The "Temporary Language" Move
  One can argue that the Prior/Passing distinction doesn't destroy the shared language view but refines it. We can view the "Passing Theory" as the construction of a **temporary, shared mini-language** for the duration of the conversation.

  *   In this view, the early RI model was an idealization. It assumed the "Prior Theory" was the target. NDE corrects this by saying the target is the "Passing Theory."
  *   However, the cognitive machinery required to generate a Passing Theory is the *same* machinery required to master a Prior Theory. We use our general capacity for systematic interpretation (the early model) to build the occasional theory (the later model).
  *   **Resolution:** The early model describes the *capacity* (competence), while the later model describes the *exercise* of that capacity in non-ideal conditions.

  **The Residual Problem:**
  The difficulty with reconciliation is **learnability and speed**.
  *   **Early Davidson:** We can interpret novel sentences quickly because we have already mastered the recursive rules of the language.
  *   **Later Davidson:** We construct a new theory (Passing Theory) for every conversation (or malapropism).
  *   **The Worry:** How do we construct these complex, recursive Passing Theories so instantly? If we don't rely on a pre-existing shared convention, the cognitive load seems immense. Davidson's answer relies heavily on the **Principle of Charity**. We assume the speaker is rational and mostly right about the world. This constraint narrows the search space for the Passing Theory so drastically that we can construct it on the fly.

  ### Summary and Recommendation for your Seminar

  To resolve the tension in your seminar discussion, I suggest framing it this way:

  1.  **Continuity of Method:** Davidson never abandons the methodological core: Interpretation is the construction of a truth theory constrained by the Principle of Charity.
  2.  **Discontinuity of Ontology:** Davidson *does* abandon the ontology of "Language" as a shared, abstract object that exists prior to interpretation.
  3.  **The Role of the Distinction:** The Prior/Passing distinction is the tool he uses to pry apart "knowing a language" from "interpreting a speaker." It shows that the former is neither necessary nor sufficient for the latter.

  **Is there a way to hold onto the early picture?**
  Yes, but it requires a modification. You must accept that **Truth Theories are occasional.**
  You can maintain that to understand a speaker is to construct a truth theory for them, *but* you must concede that this theory is not for "English" simpliciter. It is for the speaker's "current idiolect."

  The tension remains in explaining **systematicity**. If the Passing Theory is truly ad-hoc, why does language feel so rule-governed?
  *   **Davidson's Answer:** Because we are creatures who seek patterns. We impose systematicity on the Passing Theory because it is the only way to make the speaker intelligible as a rational agent.
  *   **Critique:** Many linguists argue this is insufficient. They argue that without a robust Prior Theory (Universal Grammar or deep conventions), the Passing Theory couldn't be generated fast enough.

  **Conclusion:**
  Davidson thinks the tension is resolved by realizing the early picture was slightly misled by the "myth of language." The Truth-Theory model was correct about the *form* of understanding, but wrong about the *stability* of the object. You can hold onto the Truth-Theory picture if you view it as a model of **dynamic, context-sensitive rational reconstruction** rather than a model of **static decoding of a shared code.**

  In your seminar, it is worth pressing whether a "Truth Theory" that changes with every utterance retains enough structure to deserve the name "Theory" in the sense Davidson originally intended (i.e., as an explanation of productivity). If the Passing Theory is too fluid, does it collapse back into a form of particularism that the early Davidson sought to avoid? That is the live philosophical wire here.
