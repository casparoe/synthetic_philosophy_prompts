prompt: |-
  My best mate Danny is getting married in a few weeks and he's asked me to do the best man speech, which is terrifying enough on its own, but there's an extra wrinkle: him and his fiancée Mia actually met in this odd little book club that decided, for reasons nobody really remembers, to spend four months slogging through Sartre's Being and Nothingness, and apparently bonding over how much the "bad faith" chapter wrecked both of them is basically the origin story of the relationship. I never went to the book club myself but Danny got me reading it on my own after, no philosophy background at all, just me and a library copy and alot of confused highlighting.

  The bit that really stuck with me is that bad faith isn't just "lying to yourself" in some vague sense, it's got this specific two-way trap built into it — you can fall into it by treating yourself as basically a fixed thing with no real choice in the matter (the classic move being "it was fate," "she's my soulmate," "we were always going to end up together," anything that quietly erases the fact that you're choosing this every single day), but you can ALSO fall into it the opposite way, by refusing to ever actually commit to being anything, keeping every option open forever so you never have to own a choice (which, not gonna lie, was Danny's entire personality for like a decade before Mia). So I want the toast to actually thread that needle honestly: celebrate that Danny and Mia are choosing each other, not that some cosmic soulmate thing happened to them, but also gently rib/bless them that saying "I do" isn't a magic spell that turns them into a fixed, finished "married couple" who get to stop choosing this from now on, like the freedom doesn't just switch off because they signed a piece of paper.

  Problem is, half the room is going to be Danny's uncles and my nan, who will not care even slightly about French existentialism and will get restless if it starts sounding like a lecture, while a handful of people (the book club lot, and probably Mia herself, who's honestly sharper on this stuff than either me or Danny) will absolutely clock it if I get the philosophy wrong or just do the cheap "follow your heart, be free" greeting-card version, which Danny would find genuinely annoying since that's kind of the opposite of what the book is actually arguing. So could you write me the actual toast — like 4-5 minutes read out loud, funny enough to survive the table of uncles, but with the Sartre stuff actually doing real work in it rather than just being a name I dropped to sound clever?
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Occasion:** Best Man Speech for Danny marrying Mia.
      *   **Key Theme:** They met in a book club reading Sartre's *Being and Nothingness*. Specifically, the concept of "Bad Faith" (mauvaise foi).
      *   **The Philosophical Nuance:** Bad Faith has two poles:
          1.  *Facticity/Determinism:* Pretending you're a fixed object ("It was fate," "We're soulmates," "I had no choice").
          2.  *Transcendence/Flight:* Pretending you have no definition/commitment ("I'm just exploring," refusing to choose, keeping options open).
      *   **The Goal:** Celebrate their relationship as a *choice* (avoiding pole 1) while acknowledging marriage is an ongoing commitment, not a finished state (avoiding pole 2).
      *   **Audience:** Mixed.
          *   *General/Uncles/Nan:* Need humor, accessibility, no jargon, shouldn't feel like a lecture.
          *   *Insiders (Mia, Book Club, Danny):* Need accuracy, depth, no "greeting card" simplifications.
      *   **Tone:** Funny, warm, honest, slightly intellectual but grounded.
      *   **Length:** 4-5 minutes spoken (approx. 600-800 words).

  2.  **Deconstruct the Philosophy for the Speech:**
      *   *Bad Faith (Pole 1):* "We are soulmates." Sartre says this is lying because it ignores freedom.
      *   *Bad Faith (Pole 2):* "I'm just a free spirit, I can't be tied down." Sartre says this is lying because it ignores responsibility/facticity.
      *   *Authenticity:* Acknowledging you are both free *and* responsible. Choosing each other daily.
      *   *Metaphor:* Need something relatable. "Fate" vs. "Work." "Script" vs. "Improvisation."

  3.  **Drafting - Section by Section:**

      *   **Opener:** Acknowledge the nervousness. Introduce the book club origin story immediately but keep it light. Mention the difficulty of the book (*Being and Nothingness* is a doorstop).
      *   **The Middle (The Philosophy):** Explain "Bad Faith" without using the term too heavily or defining it academically. Use the "Soulmate" trap vs. the "Commitment Phobe" trap.
          *   *Danny's Arc:* He was the "free spirit" (Pole 2) before Mia.
          *   *The Relationship:* They didn't fall into "Fate" (Pole 1).
      *   **The Core Message:** Marriage isn't a finish line; it's a daily choice. This satisfies the Sartrean requirement without sounding like a lecture.
      *   **The Roast/Toast:** Gentle ribbing at Danny. Praise for Mia (she's the sharp one).
      *   **Closer:** Raise a glass. Wish them well in their "authentic" existence.

  4.  **Refining the Tone (The "Uncle Test" vs. The "Mia Test"):**
      *   *Uncle Test:* Avoid French terms where possible. If I use "Existentialism," immediately follow it with a joke about cigarettes or berets. Keep sentences punchy.
      *   *Mia Test:* Ensure I don't say "Fate brought them together." Ensure I emphasize *choice*. Ensure I acknowledge that Danny used to be afraid of commitment (Transcendence trap).
      *   *Humor:* Self-deprecation about reading the book. Jokes about Danny's past dating life. Jokes about the uncles sleeping.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi, I'm the Best Man. Danny and Mia met reading Sartre. I read it too, it was hard. Sartre says don't lie to yourself. Some people say "it's fate." That's a lie. Some people say "I never want to settle." That's a lie too. Danny was the second type. Now he's choosing Mia. Marriage isn't the end. It's choosing every day. Love you both. Cheers.
      *Critique:* Too dry. Needs more warmth and specific jokes.

  6.  **Drafting - Iteration 2 (Adding Flavor):**
      Start with the book. It's a huge book. I highlighted a lot but understood little. The concept is "Bad Faith." It means lying. Danny used to run from commitment. Mia caught him. But don't think it's magic. You have to keep choosing.
      *Critique:* Better. Need to make sure the "two traps" are clear but conversational.

  7.  **Finalizing the Script (incorporating the specific constraints):**
      *   *Hook:* The book club story.
      *   *The "Homework":* Admit I read the book. It was painful.
      *   *The Philosophy:* Frame it as "The Two Traps of Love."
          *   Trap 1: The Disney Movie (Fate/Soulmates).
          *   Trap 2: The Peter Pan (Never growing up/committing).
      *   *Danny's Growth:* He was Trap 2. Mia helped him escape.
      *   *The Advice:* Don't fall into Trap 1 now. Marriage is a verb.
      *   *Toast:* To authenticity and choice.

  8.  **Word Count & Timing Check:**
      *   Average speaking pace is ~130-140 words per minute.
      *   4 minutes = ~550 words. 5 minutes = ~700 words.
      *   I need to aim for around 650-700 words to allow for pauses and laughter.

  9.  **Polishing the Philosophy:**
      *   Instead of saying "Facticity," say "Pretending you're a stone."
      *   Instead of "Transcendence," say "Pretending you're a ghost."
      *   Make sure Mia gets credit for being the smart one who actually understood the book.

  10. **Final Review against constraints:**
      *   Funny for uncles? Yes, jokes about the book being a doorstop and Danny's dating history.
      *   Accurate for Mia? Yes, captures the duality of Bad Faith (determinism vs. flight).
      *   No lecture? Yes, woven into the narrative of their relationship.

