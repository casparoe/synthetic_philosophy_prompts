  7.  **Final Polish:** Check for clarity, ensure the distinction between *validity* and *soundness* is clear to a physicist (who understands models vs. reality), and provide specific reading suggestions. (Dummett's introduction to *Frege: Philosophy of Language* is the classic source on this tension).

  8.  *(Final thought before generating)*: Make sure to explicitly address the "ancestral/genealogical" point the user raised. That's a specific technical link they noticed. Frege's definition of "ancestral" (hereditary property in a sequence) was indeed mathematically brilliant, but applying it to bloodlines is a category error.

