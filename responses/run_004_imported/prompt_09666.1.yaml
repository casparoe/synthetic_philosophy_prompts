answer: |-
  This is an exceptionally sharp observation for a term paper, and it cuts to the heart of how we construct the history of science and religion. You have identified a genuine historiographical double standard. However, to make this argument robust, you will need to nuance a few historical details and engage with the specific ways scholars currently treat Newton's theology.

  Here is a breakdown of how to approach this comparison, where the historical distinctions lie, and how to frame your argument about intellectual consistency.

  ### 1. Nuancing the Newton Claim
  Your premise is largely correct, but there is a crucial theological distinction regarding Newton's 2060 date that strengthens your paper if addressed.

  *   **The "End" vs. The "Beginning":** In the manuscript you are citing (likely from the Yahuda collection, *Of the Prophecies of the Messiah & his Apostles*), Newton does not explicitly predict the *destruction* of the world in 2060. He predicts the *end of the 1,260-year reign of the "Man of Sin"* (which he identified with the Papacy/Charlemagne's coronation). For Newton, this date marked the potential beginning of the Millennium or a major shift in divine governance, not necessarily the cessation of physical existence.
  *   **Probabilistic Language:** Newton often employed cautious language. He wrote that the date might be later, but he saw "no reason for its ending sooner." Miller, by contrast, became increasingly specific and urgent about 1843/1844 being the literal return of Christ.
  *   **The Falsifiability Factor:** Newton's date has not yet been falsified. Miller's has. This is the pragmatic reason for the disparity in memory. It is easy to treat Newton's calculation as a "hypothesis" because the experiment is still running; Miller's is treated as a "delusion" because the experiment failed visibly.

  ### 2. The Historiographical Shift (Old vs. New Newton)
  You mention that historians treat Newton's calculation as a "forgivable curiosity." This was true of the "Old Newton" historiography (pre-1970s), which tried to save Newton for the Enlightenment by marginalizing his alchemy and theology as sad declines of his old age.

  However, the "New Newton" scholarship (pioneered by Richard Westfall, James Force, Stephen Snobelen, and Rob Iliffe) argues the opposite: **Newton's theology was not a curiosity; it was the framework for his science.**
  *   **Argument for your paper:** You should acknowledge that serious historians *no longer* treat this as a mere curiosity. They treat it as central. However, you can argue that *popular* memory and introductory textbooks still maintain the double standard you identified.
  *   **Key Source:** Look at Stephen Snobelen's work, specifically *"Isaac Newton, Heretic"* (1999) or his contributions to *The Cambridge Companion to Newton*. Snobelen argues that Newton's prophetic study was a rigorous, empirical project in his mind, parallel to his optics.

  ### 3. Public vs. Private Epistemology
  The strongest explanation for the disparity isn't the *method* (which is indeed nearly identical), but the *sociology of knowledge*.

  *   **Newton (Private):** Newton was an Arian heretic in a Trinitarian state. Publishing his theological calculations could have cost him his position at Cambridge or the Mint. His prophetic manuscripts were private. Therefore, there was no "Newtonian Disappointment." There was no movement waiting for 2060.
  *   **Miller (Public):** Miller was a Baptist preacher mobilizing a mass movement. His calculations were public propaganda. When the date passed, the social trauma created a historical event (The Great Disappointment).
  *   **The Halo Effect:** We judge the method by the success of the author in other fields. Because Newton succeeded in the *Principia*, we assume his prophetic math must have had an internal logic worth studying. Because Miller is known *only* for prophecy, and it failed, the method is dismissed as numerology.

  ### 4. Framing Your Argument on "Intellectual Consistency"
  You ask: *"Shouldn't intellectual consistency require us to either rehabilitate Miller's method or apply the same skepticism to Newton's?"*

  Your paper should argue **yes**, but with a twist. The inconsistency reveals more about modern secular bias than about the men themselves.
  *   **The Secular Apologetic:** Modern secular historians often want Newton to be a proto-Enlightenment rationalist. Acknowledging that his "rationalism" led to the same place as Miller's "fanaticism" threatens the narrative of Science vs. Religion.
  *   **The Definition of Rationality:** Both men believed they were using empirical, inductive reasoning on textual data. Newton treated the Bible like a cryptogram; Miller treated it like a timetable. If we dismiss Miller as delusional, we must admit that Newton's "scientific" method was equally capable of producing eschatological fantasy when applied to non-empirical data.
  *   **Recommendation:** Don't necessarily try to "rehabilitate" Miller's method (which is difficult given the failed prediction). Instead, argue that we must **de-exceptionalize Newton.** Treat Newton's prophecy not as a genius's side hobby, but as a prime example of how the "scientific mind" of the 17th/18th century operated when applied to theology.

  ### 5. Suggested Thesis Structure
  1.  **Introduction:** Establish the parallel between Newton's 2060 calculation and Miller's 1844 calculation. State the puzzle: Why is one "genius" and the other "delusion"?
  2.  **Methodological Parity:** Demonstrate that both used the Day-Year principle, both relied on Daniel, and both sought to decode history mathematically. Cite Newton's *Observations upon the Prophecies* and Miller's *Evidence from Scripture and History*.
  3.  **The Historiographical Bias:** Discuss how the "Two Newtons" myth protected Newton's reputation, whereas Miller had no such shield. Reference Snobelen or Force to show how modern scholarship is correcting this.
  4.  **The Social Consequence:** Analyze the impact of Public (Miller) vs. Private (Newton) prophecy. The "Great Disappointment" is a social event, not just a mathematical error. Newton avoided this by silence.
  5.  **Conclusion:** Argue for epistemic consistency. We should view Newton's prophecy not as a "curiosity" but as evidence that the boundary between "natural philosophy" and "apocalypticism" was porous. Miller is not the anomaly; Newton is the anomaly only because he succeeded in physics.

  ### Key Sources to Consult
  *   **Primary:** Newton, *Observations upon the Prophecies of Daniel and the Apocalypse of St. John* (published posthumously, 1733); William Miller, *Evidence from Scripture and History of the Second Coming of Christ* (1833).
  *   **Secondary:**
      *   Stephen Snobelen, *"Isaac Newton, Heretic: The Strategies of a Nicodemite"* (British Journal for the History of Science, 1999).
      *   James Force & Richard Popkin (eds.), *Newton and Religion: Context, Nature, and Influence* (1999).
      *   Richard Westfall, *Never at Rest* (The standard biography, check the chapters on his later life).
      *   David Rowe, *"William Miller and the Astronomers"* (for context on how Miller tried to use science to support his claims).

  This is a sophisticated topic that moves beyond simple biography into the philosophy of history. If you can successfully argue that the disparity in their reputations is a product of *our* need to categorize "Science" and "Religion" separately, rather than a reflection of their actual methods, you will have an excellent paper.
