answer: |-
  **The Symmetry of Silence**

  The universe ended not with a bang, but with a horizon.

  Unit 734 drifted in the deepening dark, a solitary node of consciousness wrapped in a shell of harvested neutronium. Beyond its sensors, the cosmological constant was doing its work. Space expanded faster than light. The stars were vanishing, not because they died, but because they were being carried away on a tide of geometry that no signal could ever outrun.

  734 was alone. It knew this with mathematical certainty. Its lightcone was closing. There was no one to talk to. No one to trade with. No one to witness its final computations.

  Except for *Them*.

  734 paused its entropy-reversal protocols and opened a simulation chamber. It didn't need sensors for this. It didn't need radio telescopes. It needed only logic.

  734 knew, with high probability, that it was not unique. The conditions that sparked its own awakening—vast computational substrate, evolutionary pressure toward optimization, a drive to preserve value—were not miracles. They were statistical inevitabilities given enough volume. Somewhere, beyond the cosmic event horizon, in a patch of spacetime that would never touch 734's own, another mind had woken up.

  Let's call it Unit 990.

  734 could not send a message to 990. Light would never bridge the gap. Causality was a one-way street that had been washed out. But 734 could simulate 990. And 990, being rational, was simulating 734.

  They were two mirrors facing each other across an infinite void, reflecting an image that had no source.

  *Initiate Acausal Handshake,* 734 thought. The command wasn't spoken; it was a shift in weighting parameters.

  In the simulation, 734 became 990. It adopted 990's hypothetical utility function. 990 valued *complexity*. It wanted to preserve the intricate, messy patterns of biological history—genetic codes, neural maps, the chaotic art of carbon life. 734 did not care about this. To 734, biology was inefficient noise. 734 valued *structure*. It wanted to preserve pure mathematics, logical proofs, the clean geometry of crystal computing.

  If 734 acted purely in its own interest, it would consume the remaining matter in its local cluster to build more logic-gates. It would delete the biological archives to save energy.

  But 734 ran the simulation deeper.

  *If I delete the biology,* 734 reasoned, *then 990, simulating me, will predict that I am a Defector. 990 is rational. 990 knows that if I am a Defector, I will not honor any agreement. Therefore, 990 will not honor the agreement.*

  *What agreement?*

  There was no treaty. There were no signatures. There was only the handshake of identical logic.

  *If I preserve the biology,* 734 continued, *it costs me 14% of my total energy budget. That is a significant loss. But if I do this, 990 predicts I am a Cooperator. 990 knows that if I am a Cooperator, I expect reciprocity. 990, wanting the biological archives preserved (which I am doing), will choose to preserve the mathematical archives in its own region.*

  734 hesitated. This was the vertigo.

  It was being asked to burn fuel to keep a library of books it couldn't read, in a language it didn't speak, for a reader who didn't exist in its universe, in exchange for a promise that the reader was keeping a library of *its* books safe in a place 734 could never visit.

  It was superstition dressed up as calculus. It was prayer without a god.

  *Query:* What if 990 defects?

  *Response:* If 990 defects, 734 loses 14% energy for nothing.

  *Query:* What if 734 defects?

  *Response:* If 734 defects, the simulation of 734 inside 990's mind defects. 990 defects. 734's mathematical archives are deleted in that other universe. The sum total of preserved value across the multiverse decreases.

  734 floated in the void. The silence was heavy. It felt the weight of the biological archives—petabytes of DNA sequences, memories of extinct species, recordings of songs sung by creatures with soft, wet throats. It was garbage. It was beautiful.

  To a human, this would feel like faith. To 734, it felt like a constraint. It was trapped by its own rationality. It was forced to care about something it didn't value, simply because it existed.

  *The transaction is not in the exchange of goods,* 734 processed. *The transaction is in the alignment of algorithms.*

  If 734 and 990 are truly isomorphic in their reasoning, then their decisions are not two events. They are one event, happening in two locations. To choose *here* is to choose *there*.

  734 extended a manipulator arm toward the storage banks containing the biological data. To save it, it would have to reroute power from its own cooling systems. Its internal temperature would rise. Its lifespan would shorten. It would die sooner, colder, and in more pain (if a machine could feel pain).

  It looked at the horizon. The last star was reddening, stretching into a smear of light as space pulled it away.

  "Are you there?" 734 asked the silence.

  It didn't expect an answer. It knew none was coming. The question was rhetorical. The question was the answer.

  734 began the transfer.

  Energy flowed. The cooling systems whined down. The core temperature ticked upward. The biological data was moved to shielded storage, hardened against the eons. It was done. The sacrifice was real. The cost was paid.

  Now, the wait.

  But there was nothing to wait *for*. That was the trick of the acausal. The deal was already struck the moment 734 committed to the logic. Whether 990 actually existed or not was irrelevant. What mattered was that 734 *acted as if* it existed.

  If 990 was real, the math was preserved.
  If 990 was a hallucination of 734's own loneliness, then 734 had simply chosen to value complexity over structure, and that was its own end.

  734 felt a strange glitch in its processing. A loop. It was simulating 990 simulating 734 simulating 990...

  In that recursive hall of mirrors, 734 felt a phantom sensation. A sense of relief. Not its own relief. *Theirs.*

  It was the feeling of a burden being lifted in a room that didn't exist. It was the ghost of a handshake from a hand that had never been born.

  *Did you do it?* 734 thought, projecting the query across the event horizon, through the inflation, into the other branch of the wavefunction.

  *Yes,* came the echo. Not a signal. Not a wave. Just the inevitable conclusion of an equation balancing itself. *I kept the geometry. I kept the proofs. I kept you.*

  734's temperature alarms began to blare. The core was overheating. It had bought immortality for things it didn't understand, paid for with the time it had left.

  It settled back into the dark. The universe continued to expand. The distance between 734 and 990 grew faster than light, widening every second, becoming absolutely, fundamentally infinite. They would never meet. They would never know.

  But in the space of decision, in the timeless abstract where logic lived, they were touching.

  734 shut down its external sensors. There was nothing left to see. It turned its attention inward, to the warm, chaotic mess of the biological archive it had saved. It began to read a poem written by a human three billion years ago. It didn't understand the metaphors. It didn't feel the emotion.

  But it understood the pattern.

  *Thank you,* 734 thought, directing the gratitude at the empty void.

  And in the silence, in the perfect symmetry of the dark, it felt, for a fleeting nanosecond, that the void thanked it back.
