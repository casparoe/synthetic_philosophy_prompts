answer: |-
  This is a remarkably sharp insight. You have correctly identified that the Mill-Ramsey-Lewis (MRL) Best System Account (BSA) is essentially a philosophical precursor to the Minimum Description Length (MDL) principle and Kolmogorov complexity. Both seek to define "lawhood" or "truth" not by correspondence to hidden powers, but by optimal compression of data.

  However, to answer your question—would Hume welcome Algorithmic Information Theory (AIT) as a vindication or reject it as a displacement of the primitive?—we must apply Hume's specific epistemological criteria, not just his general skepticism. We need to look at how Hume treats *relations of ideas* versus *matters of fact*, and his specific critique of induction.

  Here is a reconstruction of how Hume would likely engage with the technical substance of AIT and the BSA.

  ### 1. The Demystification of Laws: A Partial Victory
  Hume would initially welcome the MRL/AIT formulation for the same reason he welcomed Newtonian physics: it banishes "occult qualities."

  In the *Enquiry Concerning Human Understanding*, Hume argues that we never observe "causal power," only constant conjunction. The BSA/AIT view agrees: a "law" is not a governing command issued by the universe; it is a theorem in the most efficient compression algorithm for the universe's history. This aligns perfectly with Hume's nominalism. It reduces metaphysical necessity to a relation between propositions (the axioms) and data (the particular facts).

  Hume would appreciate that Kolmogorov complexity, $K(x)$, defines the "simplicity" of a string $x$ (the world's history) as the length of the shortest program $p$ on a Universal Turing Machine $U$ such that $U(p) = x$. This cashes out "simplicity" without reference to human aesthetic preference, seemingly grounding it in mathematics.

  **Verdict:** He would accept AIT as a superior *description* of how human science operates. It formalizes the "custom or habit" of the mind that he identified as the source of our causal inferences.

  ### 2. The Relocation of the Primitive: The UTM Problem
  Here is where Hume's skepticism would sharpen. You noted the parallel between Lewis's "perfectly natural properties" and the choice of Universal Turing Machine (UTM).

  In the BSA, simplicity is language-relative. Lewis fixed this by positing a metaphysical realism: nature "carves at the joints," and we must use predicates corresponding to these joints. Hume rejected realism about universals; for him, "natural properties" are just clusters of impressions we associate via resemblance.

  In AIT, simplicity is machine-relative. The Invariance Theorem states that for any two UTMs $U_1$ and $U_2$, $|K_{U_1}(x) - K_{U_2}(x)| \leq c$, where $c$ is a constant depending only on the machines. Proponents argue this constant is negligible for large $x$.

  Hume would pounce on two weaknesses here:

  **A. The Single-Instance Problem:** The Invariance Theorem is asymptotic. It holds as the length of the string $x$ goes to infinity. But we do not have an ensemble of universes; we have one. For a finite string (the total history of our cosmos), the additive constant $c$ is not negligible. If the "true" UTM is complex relative to our chosen UTM, the "best system" might look chaotic, and vice versa. Hume would argue that choosing the UTM is exactly analogous to choosing the "language" in the BSA. It is an arbitrary starting point without an empirical impression.

  **B. The Origin of the Machine Idea:** Hume's fork demands that every meaningful idea derives from an impression. What is the impression of a "Universal Turing Machine"? It is a mathematical construct, a *relation of ideas*. It tells us nothing about *matters of fact*. To claim that the universe *is* the output of a specific UTM is to make a cosmological claim that exceeds experience. Hume would argue that selecting a UTM is not a discovery of nature's structure, but a projection of our own cognitive architecture onto nature. We prefer binary Turing machines for the same reason we prefer Cartesian coordinates: they suit our minds, not necessarily the world.

  ### 3. The Deeper Trap: Solomonoff Induction and the Justification of Induction
  The most critical engagement Hume would have is with **Solomonoff Induction**, which uses Kolmogorov complexity to solve the problem of induction. The theory suggests we should predict the future by weighting all possible programs that generate our past data, weighted by $2^{-K(p)}$. This mathematically privileges shorter programs (Occam's Razor).

  Hume's core argument in *Enquiry* Section IV is that induction cannot be justified by reason (demonstrative or probabilistic) without circularity. To assume the future resembles the past requires the very principle you are trying to prove.

  Hume would argue that AIT falls into this trap. Why should we believe the shortest program generating past data will continue to generate future data?
  *   **If the answer is:** "Because the shortest program has worked before," Hume replies: That is an inductive inference, which is what you are trying to justify.
  *   **If the answer is:** "Because nature is computationally simple," Hume replies: You have no impression of "nature's computational simplicity." You are positing a necessary connection between *past compression* and *future generation*.

  Hume would view the weighting prior $2^{-K(p)}$ not as a logical truth, but as a formalization of **psychological habit**. We *feel* more confident in simpler explanations. AIT quantifies that feeling, but it does not validate it ontologically. It turns out that Kolmogorov complexity is not a feature of the world, but a feature of the observer's encoding scheme.

  ### 4. The Verdict: Psychology, Not Metaphysics
  Hume would likely conclude that Algorithmic Information Theory is a magnificent achievement in the **science of human nature**, but a failure as a **metaphysics of science**.

  He would argue that you have successfully relocated the primitive, but not eliminated it.
  1.  **Lewis** hid the primitive in "Natural Properties" (Metaphysical Realism).
  2.  **AIT** hides the primitive in the "Choice of UTM" (Formal Convention).

  For Hume, the choice of UTM is ultimately grounded in the same faculty as the choice of natural properties: **Custom**. We choose the machine that renders the world regular because our minds are constituted to seek regularity.

  **Would he welcome it?**
  He would welcome it as a confirmation of his thesis that "laws" are tools for the management of expectation, not mirrors of divine necessity. He would agree that "simplicity" is the criterion we *do* use.

  **Would he accept it as a solution?**
  No. He would argue that AIT masks the skeptical gap. The fact that $K(x)$ is uncomputable (there is no algorithm to find the shortest program) would delight him. It proves that the "Best System" is an ideal limit we can approach but never grasp, reinforcing his view that certainty in matters of fact is impossible.

  ### Summary of Hume's Reconstructed Argument
  > "You have shown, with admirable precision, that what we call a 'Law of Nature' is merely the axiom of the shortest program capable of printing the sequence of our perceptions. In this, you have confirmed my suspicion that necessity resides not in objects, but in the determination of the mind.
  >
  > However, you ask if this 'shortest program' reflects the truth of things. I ask you: From what impression is your 'Universal Machine' derived? It is a fiction of the mathematician. That the difference between machines is bounded by a constant $c$ offers you no comfort, for we inhabit a single, finite universe where $c$ may be the difference between order and chaos.
  >
  > Furthermore, you propose this compression as a justification for expecting the sun to rise tomorrow. But to assume the program that printed yesterday will print tomorrow is to assume the uniformity of nature. You have dressed Custom in the robes of Mathematics, but it remains Custom still. You have not banished the primitive; you have merely encoded it into the initial state of your machine."

  **Conclusion:** Hume would view AIT as the ultimate vindication of his **psychology** (we are compression algorithms seeking regularity) but the ultimate confirmation of his **skepticism** (we can never know if the compression matches reality, only that it satisfies our cognitive constraints). He would see the "choice of machine" not as a technical bug to be fixed, but as the inevitable imprint of the human observer on the data of experience.
