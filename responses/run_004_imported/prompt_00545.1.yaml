answer: |-
  Matching your brother's move is **not** the right way to protect your interests. In fact, it is highly likely to backfire on both of you.

  By locking yourself into a firm position before you know what you want, you are sacrificing your greatest asset in this negotiation: **flexibility.**

  Here is a breakdown of why this dynamic is dangerous, what your brother is actually doing, and how you can protect your interests without escalating the conflict.

  ### 1. Why Matching His Move Is a Trap
  Your instinct to dig in is a natural defensive reaction, but in negotiation and estate division, it creates several problems:

  *   **Loss of Optionality:** You admitted you haven't worked out what you want yet. If you publicly declare, "I absolutely demand cash," you lose the ability to later say, "Actually, I might consider keeping the house if I can buy you out," or "I'd prefer a delayed payout." You are painting yourself into the same corner he is in.
  *   **Escalation:** If he is "firm" and you become "firm," the only way to resolve the dispute is through force (litigation) or one person humiliatingly surrendering. This destroys sibling relationships and burns through estate funds on legal fees.
  *   **Focus on Positions, Not Interests:** Negotiation experts distinguish between *positions* (I want the house) and *interests* (I want financial security/I want to honor mom's memory). By matching his position, you ignore the underlying interests that could lead to a creative solution.

  ### 2. Decode Your Brother's Tactic
  Your brother has used a classic, albeit aggressive, negotiation tactic known as **public anchoring.**

  *   **The Anchor:** He set the starting point of the negotiation (He keeps the house) before discussions began.
  *   **The Audience:** By telling the *whole family*, he created social pressure. If he backs down, he looks inconsistent to the family. He is hoping this pressure will force you to concede to avoid being the "greedy sibling who wants to sell the family home."

  **However, this is also his weakness.** He has limited his own flexibility. If it turns out he can't afford the mortgage, taxes, or buyout costs, he has publicly committed to something he might not be able to deliver. You do not need to mimic this weakness to be strong.

  ### 3. A Better Strategy: Protect Interests, Not Positions
  You can protect your rights without making a counter-demand. Here is a step-by-step approach:

  **Step 1: Pause and Depersonalize**
  Do not respond to the family or your brother with a counter-demand. Take a breath. Remind yourself that his announcement was about *his* anxiety and need for control, not a legal decree.
  *   *Script:* "I know you've shared your thoughts with the family, but we haven't had a chance to discuss the details privately yet. I need some time to process everything and look at the numbers."

  **Step 2: Assert Your Rights, Not Your Demands**
  You don't need to say what you *want* yet; you only need to state what is *true*. As a co-owner (assuming the will/trust splits it equally), you have legal rights.
  *   *Script:* "I understand the house has sentimental value. However, legally, we are both owners of this asset. I'm not comfortable making any decisions until we understand the full financial picture."

  **Step 3: Gather Information (The "Neutral" Ground)**
  Shift the conversation from "Who gets what" to "What is there to divide?" This removes the emotion.
  *   Get a professional appraisal of the house.
  *   Determine the outstanding mortgage, taxes, and maintenance costs.
  *   Calculate the capital gains tax implications if sold vs. transferred.
  *   *Why this helps:* Often, when a sibling says "I'm keeping the house," they haven't calculated if they can actually afford to buy out the other sibling's share. The numbers often dictate the solution, not the emotions.

  **Step 4: Move the Venue**
  Negotiations should not happen via family gossip or at the dinner table.
  *   *Action:* Suggest using a mediator or an estate attorney to facilitate the division.
  *   *Script:* "Since we both have strong feelings about this, I think we should use a neutral mediator to help us find a fair solution. That way, we don't put the family in the middle."

  ### 4. What If He Refuses to Budge?
  If he maintains that he is "absolutely firm" and refuses to discuss alternatives:
  *   **You do not need to agree.** In most jurisdictions, one co-owner cannot force the other to transfer title without consent.
  *   **The Legal Reality:** If you cannot agree, the court can order a **partition sale**, where the house is sold and proceeds are split. You don't need to threaten this immediately, but knowing it is your ultimate fallback protects you from being bullied.
  *   **The Leverage:** He likely wants to avoid a partition sale (which is public, costly, and yields a lower sale price). Your willingness to let the legal process happen *if necessary* is more powerful than a shouted counter-demand.

  ### Summary
  Your brother tried to win the negotiation before it started by appealing to family sentiment. If you match his rigidity, you validate the idea that this is a war.

  **The strongest position you can take is calm, informed flexibility.**
  1.  Acknowledge his feelings without agreeing to his terms.
  2.  Refuse to be rushed.
  3.  Insist on professional valuations and legal processes.
  4.  Keep your specific desires private until you have the data to support them.

  This protects your interests far better than a public ultimatum ever could.

  *Disclaimer: I am an AI assistant and not an attorney. Estate laws vary significantly by location. You should consult with a probate attorney or estate planner to understand your specific legal rights and obligations.*
