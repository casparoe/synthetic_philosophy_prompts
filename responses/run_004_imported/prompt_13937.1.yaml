answer: |-
  The seismograph needles danced in their green glass cages, but the mountain outside was silent. Elara watched Jaren instead of the machines. He was standing at the reinforced window, pointing at the northern ridge, a slab of grey granite that had remained unchanged for the three weeks they'd been stationed there.

  "Kala," Jaren said. His voice was flat, but his hand trembled.

  Elara looked down at her notebook. *Kala.* Entry forty-two. Previous contexts: *Kala* when handing her a cup of tea. *Kala* when pointing at the generator. Her working theory was solid: *Kala* meant "object" or "thing," perhaps specifically "manufactured object." It was a safe bet. It preserved the coherence of her translation manual.

  But now Jaren was pointing at the mountain. And he was backing away from the window.

  If Elara stuck with her theory, *Kala* meant "Thing." Jaren was asserting "Thing" about the mountain. That was trivially true, but it didn't explain the fear. To explain the fear, she would have to attribute a specific belief to him: *Jaren believes this specific thing is about to kill us.*

  But why? The sensors were quiet. The ridge was stable. If she accepted her current meaning for *Kala*, she had to conclude Jaren held a false belief. She had to mark him down as irrational, superstitious, or hallucinating.

  She paused, pen hovering. This was the wall. Every time she hit a discrepancy like this, the temptation was to treat the speaker as mistaken about the world. It was easier. It kept her lexicon fixed. But she remembered Davidson's warning, the one she tried to drill into her graduate students: *You cannot maximize disagreement.* If you assume the speaker is wrong about the obvious features of the world, you aren't interpreting them anymore; you're just narrating their noise. To understand Jaren, she had to assume he was mostly right.

  She looked at the mountain. She looked at Jaren. She looked back at the mountain.

  This was the triangulation. Meaning wasn't happening in her head, and it wasn't happening in his. It was happening in the space between them, anchored by the shared object. If the object was stable, and he reacted as if it were lethal, the error couldn't be in his rationality. It had to be in her theory of meaning.

  "Kala," Jaren said again. Sharper. He grabbed his pack.

  Elara closed her notebook. If she revised the meaning of *Kala* from "Thing" to "Collapse" or "Danger," the belief attribution shifted. He wasn't believing a falsehood (that a stable rock is dangerous); he was believing a truth (that a dangerous rock is present) that she couldn't yet verify.

  But revising *Kala* meant unraveling the tea and the generator. Was the tea "danger"? Was the generator "collapse"? No. That broke the holistic web. She needed a nuance. *Kala* wasn't "Thing." It was "Active Force." The tea was an active force (heat/energy). The generator was an active force. The mountain, currently dormant, was being identified by Jaren as becoming an active force.

  It was a risky adjustment. It relied entirely on the Principle of Charity. She had to bet that Jaren was a rational agent responding to real features of the world, even if her instruments couldn't detect them yet. If she assumed he was wrong, she stayed in the station. If she assumed he was right, she evacuated.

  "The sensors are green, Jaren," she said, knowing he didn't understand the English. She pointed at the seismograph, then at the mountain. "Stable."

  Jaren shook his head. He pointed at the rock, then at his chest, then at the ground beneath them. "Kala."

  He wasn't arguing about the rock's current state. He was arguing about its *potential*.

  Elara felt the familiar vertigo of radical interpretation. There was no fact of the matter she could check before deciding. She couldn't look up "Kala" in a dictionary. There was no dictionary. There was only the equation: *Holding True = Meaning + Belief.* She had to solve for both variables simultaneously.

  If she kept Meaning constant ("Thing"), Belief became absurd ("This thing is magically deadly").
  If she kept Belief rational ("He sees a threat"), Meaning had to shift ("Thing-that-acts").

  Charity demanded she preserve his rationality. It wasn't kindness; it was methodology. Without assuming he was right about the world, she couldn't know what his words meant. If he was wrong about the world, his words could mean anything. To lock down the meaning, she had to lock down the truth of his belief.

  "Pack up," Elara said to the empty room.

  She grabbed her gear. Jaren exhaled, a sharp sound of relief, and moved toward the airlock. He hadn't convinced her with evidence; he had convinced her by forcing her to choose between her lexicon and his sanity. She had chosen his sanity.

  They were halfway down the trail when the ridge sheared off. It didn't explode; it simply slid, a silent, massive exhale of granite that buried the station under ten meters of rubble. The air pressure hit them a moment later, knocking them flat.

  Silence returned, heavier than before.

  Elara sat up, dusting grey powder from her jacket. Jaren was watching her, waiting. He pointed at the dust cloud where the station had been.

  "Kala," he said.

  Six hours ago, that word meant "Thing." Four hours ago, it meant "Danger." Now, in the aftermath, what did it mean?

  If she asked him now, she would be prompting him, contaminating the data. But she knew, with a chill that had nothing to do with the altitude, that the meaning hadn't settled. It never settled. If Jaren pointed at a flower tomorrow and said "Kala," she would have to revise again. Maybe it meant "Change." Maybe it meant "Power."

  She looked at Jaren. He wasn't a code to be broken. He was a center of rationality, interpreting the world just as she was. The meaning of his word existed only because they were both looking at the same destruction, both holding it true that it was dangerous, both assuming the other was sane enough to recognize it.

  She opened her notebook. She didn't write "Kala = Danger." That was too fixed. It invited the next error.

  Instead, she wrote: *Kala: Event of consequence.*

  It was a guess. It was a charitable guess. It assumed that Jaren carved the world at joints similar to hers, that he cared about consequences, that he was rational. If she stopped assuming that, he would stop being a speaker and become just another noise in the wind.

  Jaren stood up and offered her a hand. He pointed at the path forward, then at her.

  "Kala?" he asked, querying her.

  He was asking if she understood. He was asking if she agreed. He was checking the triangulation.

  Elara took his hand. "Yes," she said. "Kala."

  She held it true. And in that moment, because she held it true, it became true that they understood each other. There was no deeper fact to check. There was only the charity that made the communication possible in the first place. She put the pen away. The theory was working, for now.
