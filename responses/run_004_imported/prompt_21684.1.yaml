answer: |-
  Good evening. For those who don't know me, I'm [Name], and I've been given a very specific assignment. [Partner A] and [Partner B] have asked me to offer a toast, provided I adhere to a strict list of prohibitions. I am not allowed to say they were "meant to be." I cannot call them "soulmates." I cannot mention "fate," or suggest that "everything happens for a reason."

  To most of you, this might sound like I'm being asked to give a toast without using the words "love" or "happiness." But to the couple, and to those of you who know why they met in a seminar on *Being and Nothingness*, these prohibitions are the point. To claim you were destined to meet is, in their view, *mauvaise foi*—bad faith. It is a way of pretending that a fragile, terrifying, contingent choice is actually a fixed fact of the universe. It's a way of excusing yourself from the burden of having to choose it again tomorrow.

  And they are right to be wary. If we are being intellectually honest, we have to admit that Jean-Paul Sartre was not a wedding planner. In fact, his analysis of romantic love is famously bleak. He argued that in love, we are trapped in a conflict. I want to be loved by a free person, but I also want that love to be secure, guaranteed, unchangeable. I want their freedom to choose me, but I don't want them to be free to choose otherwise. Sartre argued this is impossible. He thought this tension inevitably collapses into what he called sadism or masochism—trying to control the other, or turning yourself into an object to please them. He never married. He didn't think it could work.

  So, why are we here?

  We are here because [Partner A] and [Partner B] know the trap. They know that the other is a freedom, not a fixture. When they argue about Sartre, when they call out each other's bad faith, they are doing something profoundly romantic, even if Sartre wouldn't call it that. They are refusing to turn each other into statues. They are acknowledging that the person standing next to them is a subject, a consciousness, a "for-itself" that can walk away at any moment.

  And that is why this commitment is so moving. It is easy to stay when you believe you are bound by destiny. It is much harder to stay when you know you are bound by nothing but your own word.

  There is no cosmic safety net beneath this marriage. There is no script. There is only the daily, terrifying, exhilarating act of looking at another free human being and saying: "I see your freedom, and I choose you anyway."

  To the rest of the family, who just want to know if they'll be happy: They will be happy, not because they are safe from conflict, but because they refuse to lie to each other about the nature of choice. They know that love is not a state you arrive at; it is a project you build.

  So, let us raise a glass. Not to fate, and not to a happy ending, because stories like that are fiction. Let us drink to the courage of the contingent. To the work ahead. To the freedom they grant each other, and the choice they make, again and again.

  To [Partner A] and [Partner B].
