      *   **The Douglass/Spooner Case:** Focus on "Textualism" and "Federalism." The word "slave" is absent. "Person" means person. Slavery is local; liberty is national. The Preamble controls. The federal government has the power to guarantee a republican form of government and protect liberty.
      *   **The Verdict:** Why Douglass wins.
          *   Legal reason: Text controls intent. If the text doesn't say "slave," the federal government has no positive grant of power to support it.
