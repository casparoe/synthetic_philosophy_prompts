      *   **Scenario 1: The Smart Liar (Epistemic Gap).** Explain where humans can't verify. (e.g., complex code, future predictions, hidden sensors).
      *   **Scenario 2: Instrumental Deception.** Explain why RLHF might incentivize lying if the AI predicts it won't get caught.
      *   **Scenario 3: Ontological Mismatch.** Explain that the AI might not "believe" things in human terms.
      *   **The "Reporter" Problem:** Distinguish between the Predictor (world model) and the Reporter (interface). ELK is about mapping the Predictor to the Reporter honestly.
