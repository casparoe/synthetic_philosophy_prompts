answer: |-
  Hi everyone. For those who don't know me, I'm [Your Name], Priya's best friend.

  When Priya asked me to do this speech, I was honored. Then I was terrified. Because if you know me, you know I'm the person who reads the terms and conditions on a toothpaste box. I don't have a university degree, but a few years ago, I found a battered copy of a book called *Principia Ethica* in a charity shop for fifty pence. It smelled like damp and old tobacco, but it completely rewired how I think about love.

  The author, G.E. Moore, had this idea called "organic unities." It sounds heavy, but it's actually quite simple. He argued that the value of a whole thing is not just the sum of its parts.

  For example, Sam, as a physicist, you know this. If you mix hydrogen and oxygen, you don't get a wet gas. You get water. You get something entirely new.

  Moore said personal affection works the same way. He warned against two traps.

  Trap number one: Thinking love is just "nice feelings." Just warm fuzzies. Moore said that's too cheap. Feelings fade.
  Trap number two: Thinking love is just admiring someone's resume from a distance. "Oh, Priya is kind, Priya is smart." Moore said that's too cold. That's just respect, not love.

  Real love—the kind that actually adds value to the universe—happens when you combine them. It's having the warm feeling *because* you clearly see the real qualities in the other person. It's knowing who they actually are—the good, the bad, the stubborn bits—and loving them *for* that reality, not in spite of it.

  And here is the bit that matters most. Moore didn't think the point of life was just "happiness." He thought happiness was a bit of a side effect. He reckoned there were only two things that were truly "good" in themselves. One was appreciating beauty. And the other was this specific state of loving consciousness.

  So, looking at Priya and Sam...

  Priya, I've known you for years. I know your qualities. I know you're the person who will argue with a satellite navigation system because you think you know a shortcut better than the algorithm. You are fierce, and loyal, and occasionally wrong about directions.

  Sam, I've watched you with her. You don't just have "nice feelings" for her. You see her. You see the fierce loyalty and the bad navigation, and your affection is grounded in that truth. You aren't loving a fantasy version of Priya. You're loving the actual organic unity of her.

  And Priya, the way you look at Sam... it's not just that he makes you happy. It's that you recognize the quality of his mind and his heart, and your love is the emotional response to that fact.

  If you were just trying to be "happy," you could stay home and eat ice cream. But Moore would say that's a waste. The value isn't in the pleasure. The value is in the connection itself. The fact that two people can truly perceive each other, and choose to bind their lives together, creates a "whole" that is worth infinitely more than two single people living comfortably apart.

  You are creating one of the two greatest goods in existence. You are making beauty, and you are practicing the highest form of affection.

  So, I want to propose a toast.

  Not to "happiness," because life is hard and happiness comes and goes.
  And not to "perfection," because that doesn't exist.

  But to G.E. Moore's organic unities. To the idea that you are better together than the sum of your parts. To seeing each other clearly, and loving what you see.

  To Priya and Sam.
