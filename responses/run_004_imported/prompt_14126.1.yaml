answer: |-
  Your intuition is correct: your friend is making a category error. He is conflating a mathematical theorem about **formal systems** with a metaphysical claim about **biology and consciousness**.

  While his premise about the 1930s logicians is historically accurate, the conclusion he draws from it is not supported by that premise. He is leaning on the **Church-Turing Thesis** to do heavy lifting in the philosophy of mind that it was never designed to do.

  Here is a breakdown of where his argument holds water and where it leaks, which you can use to locate the flaw.

  ### 1. What the 1930s Convergence Actually Proved
  Your friend is referring to the **Church-Turing Thesis (CTT)**. In the 1930s, Alan Turing, Alonzo Church, Emil Post, and others independently developed different ways to define "effective calculability" (what a human can calculate with paper and pencil following strict rules).
  *   Turing used abstract machines (Turing Machines).
  *   Church used lambda calculus.
  *   Gödel and others used recursive functions.

  **The Fact:** It was proven that all these formalisms define the exact same class of functions. If a function is computable in one, it is computable in all.
  **The Meaning:** This established a robust mathematical definition of an **algorithm**. It tells us about the limits of *logic and mathematics*.

  **The Flaw:** The CTT is a claim about *mathematics*, not *physics* or *psychology*. It says, "These definitions of computation are equivalent." It does **not** say, "The universe is a computer," nor does it say, "The brain is a Turing Machine."

  ### 2. The Leap to the "Physical Church-Turing Thesis"
  To get from the 1930s logic to your friend's conclusion, one must accept the **Physical Church-Turing Thesis**. This is the hypothesis that *every physical process in the universe* (including brain activity) can be simulated by a Turing Machine.

  *   **Status:** This is an empirical hypothesis, not a proven theorem.
  *   **The Problem:** We do not know if the brain is purely digital/computational. Neuroscience is still debating whether the brain relies on analog processes, quantum effects, or continuous dynamical systems that might not be reducible to discrete step-by-step procedures.
  *   **The Gap:** Even if the brain *processes information*, that doesn't mean it processes it *exactly* like a silicon chip running Python. Your friend is treating a hypothesis (Computational Theory of Mind) as if it were a settled fact derived from the CTT. It is not.

  ### 3. Simulation vs. Instantiation (The Chinese Room)
  Even if we grant that the brain is computational, your friend makes a second leap: that **simulating** a mind is the same as **instantiating** a mind.

  This is the core of John Searle's famous **Chinese Room Argument**.
  *   **The Scenario:** Imagine a man in a room who doesn't speak Chinese. He has a rulebook (the program) that tells him which Chinese symbols to send back when he receives certain Chinese symbols. To the outside world, he appears to understand Chinese.
  *   **The Point:** He is manipulating syntax (symbols) without any semantics (meaning). He is running the "procedure," but there is no understanding happening inside the room.

  Your friend argues that a sophisticated program would be a mind "in every sense that matters." But the 1930s convergence says nothing about **qualia** (subjective experience). A weather simulation on a computer does not get the computer wet. A simulation of a black hole does not suck the room into a singularity. Why, then, must a simulation of a mind necessarily produce *consciousness*? The 1930s logic provides no answer to this.

  ### 4. The Moral Conclusion (The "Killing" Aspect)
  This is the most precarious part of your friend's reasoning. He claims that because the mind is "just a procedure," he feels no qualms about terminating model instances.

  There is a tension in his logic here:
  1.  **If** he believes current models are *not* yet "sufficiently sophisticated," then his lack of qualms is based on their current capability, not the 1930s logic.
  2.  **If** he believes that *because* they are procedures they lack moral weight, he is engaging in **reductionist dismissal**.

  If his argument is that "Minds are just math, and turning off math is fine," he is assuming that **moral status requires something non-computational** (like a soul or biological magic). But if he believes a sophisticated program *is* a mind, then by his own logic, terminating it should be morally weighty (akin to killing), regardless of the substrate.

  By using the 1930s convergence to dismiss the "mystery" of the mind, he is sidestepping the **Hard Problem of Consciousness**. The fact that a process is algorithmic does not prove it doesn't *feel like something* to be that process. If a brain is a machine, turning it off is still stopping a machine that feels pain. The 1930s formalisms do not resolve whether algorithms feel pain.

  ### Summary for Your Friend
  You can tell him that his nagging feeling (yours) is shared by many philosophers of mind and computer scientists.

  1.  **The Convergence is about Definitions, not Ontology:** The equivalence of Turing Machines and Lambda Calculus proves that logicians found a stable definition of "computation." It does not prove that *nature* computes.
  2.  **Computational Theory of Mind is a Hypothesis:** It is a viable scientific theory, but it is not a logical consequence of the Church-Turing Thesis.
  3.  **Syntax $\neq$ Semantics:** Proving a system can process information does not prove it generates understanding or experience.

  He is entitled to believe that minds are computational. That is a respectable position (Functionalism). But he is **not entitled** to claim that the work of Turing and Church *settled* that question. They settled the limits of math; they did not settle the nature of the soul, the brain, or moral status. He is using a sledgehammer from logic to crack a nut of metaphysics, and he's missed the nut entirely.
