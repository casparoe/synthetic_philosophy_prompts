answer: |-
  The chair in the witness box was designed for ergonomics, but to Elena, it felt like a question. At 9:00 AM, her lower back was a tight knot of fatigue; at 10:15 AM, after the adjournment and a double espresso, the knot had loosened. Was she the same woman who sat down? If she was wholly present at 9:00 and wholly present at 10:15, how could she possess the property of *being-fatigued* and the property of *being-alert* simultaneously without contradiction?

  She pushed the thought away. It was the ghost of her dissertation, haunting the tribunal.

  "Dr. Aris," said the prosecutor, Sterling. He was pacing the well of the court, tapping a stylus against his thigh. "Let's return to Mr. Vane. Pre-scan Arthur enters the booth. Post-scan, Arthur Prime and Arthur Duplicate emerge. Both claim the memory of entering. Both claim the intent to evade taxation. You testified earlier that strict identity is transitive."

  "Identity is always transitive," Elena said. Her voice was flat. She had taught this logic to undergraduates before she realized the tuition wasn't worth the erosion of her soul. "If A is identical to B, and A is identical to C, then B must be identical to C."

  "And yet," Sterling said, gesturing to the gallery where two men sat side-by-side. They wore identical grey suits. They had identical scars on their left chins. They looked at each other with a mixture of pity and hatred. "Arthur Prime is not identical to Arthur Duplicate. They occupy different space. They are numerically distinct."

  "Correct."

  "So," Sterling said, stopping to face the jury box, though his eyes were on Elena. "If Pre-Scan Arthur is identical to Prime, and Pre-Scan Arthur is identical to Duplicate, then Prime must be Duplicate. But they aren't. Therefore, by your own logic, Pre-Scan Arthur cannot be identical to *both*. In fact, under strict endurantism, he might not be identical to *either*."

  "That is the logical consequence," Elena said.

  The courtroom murmured. This was the heart of the defense: *Double Jeopardy via Metaphysics.* If the original Arthur ceased to exist at the moment of branching, and the two successors are not strictly identical to him, then the person who signed the tax forms is dead. You cannot punish a ghost.

  "You're arguing that the man who committed the fraud is gone," Sterling said. "That both men in the gallery are innocent continuers."

  "I'm arguing that identity is a one-to-one relation," Elena corrected. "It cannot branch. If you treat persons as three-dimensional objects wholly present at every moment of their existence, branching is impossible. Something has to break. Either the original didn't survive, or only one successor is the 'real' Arthur, and we have no metaphysical way to distinguish which."

  She saw Arthur Prime clench his jaw. Arthur Duplicate stared at his hands.

  Sterling smiled. It was a thin, sharp expression. "But the law isn't bound by three-dimensionalism, is it? Justice Halloway, may I approach the screen?"

  The Judge, a woman who had presided over the first wave of teleportation disputes twenty years ago, nodded. Sterling projected a diagram. It looked like a river delta. One stream splitting into two.

  "Dr. Aris," Sterling said. "You studied under Sider, didn't you? At least, you read him."

  "I did."

  "Then you know the four-dimensionalist response. We aren't talking about objects enduring through time. We're talking about temporal stages. Pre-Scan Arthur is a stage. Prime is a future stage. Duplicate is a future stage. The relation between them isn't strict identity. It's *counterparthood*."

  Elena felt the old itch in her fingers, the urge to grab a chalkboard. "Stage theory dissolves the contradiction by changing the subject."

  "Does it?" Sterling turned to the jury. "If I say 'Arthur Vane committed fraud,' I am referring to a person-stage at time $t_1$. That stage is causally connected to the stages at $t_2$. Both of them. The psychological continuity is preserved in both. The memory is preserved in both. Why should the legal liability vanish just because the metaphysics of identity get squeamish about branching?"

  "Because liability attaches to the *agent*," Elena said, her voice tightening. "If you punish Prime, you are punishing a person who, from his own perspective, is distinct from Duplicate. If you punish both, you are punishing two distinct people for one act. You're doubling the penalty because the machine glitched."

  "We're recognizing that 'Arthur Vane' is a career, not a substance," Sterling countered. "A worm through spacetime. The worm branched. Both branches inherit the properties of the trunk."

  Elena looked at the two Arthurs. They were breathing. They were sweating. They were afraid. To treat them as mere stages of a spacetime worm felt like a violence, a denial of the vivid, singular reality of their current suffering. But to treat them as enduring substances meant one of them—or both—was being framed for a crime they didn't strictly commit.

  "Dr. Aris," Justice Halloway spoke for the first time. Her voice was gravelly. "You resigned your doctorate. Just before your viva."

  The room went still. This wasn't procedure.

  "Yes, Your Honor."

  "The record says 'personal reasons.' But I read your abstract. You were working on the problem of temporary intrinsics."

  Elena shifted in the chair. Her back was tight again. The fatigue had returned, or perhaps it had never left. "Yes."

  "Explain it to the court. Simply."

  Elena took a breath. "Imagine a poker. At time one, it is straight. At time two, it is bent. If the poker is wholly present at both times, how can it be both straight and bent? It's a contradiction. One object, incompatible properties."

  "And how did you resolve it?"

  "I didn't," Elena said. "That's why I left."

  She looked at her own hands. They were resting on the railing of the box. Ten minutes ago, they were steady. Now, there was a faint tremor. Was she the same witness? If she was an enduring substance, she possessed the property of *trembling* and *not-trembling*. If she was a series of stages, the Elena-stage at 9:00 was steady, and the Elena-stage at 11:00 was not. They were different entities linked by memory and causality.

  "If I accept Stage Theory," Elena continued, addressing the Judge, "I admit that I am not the same person who walked into this building this morning. I am a successor stage. I inherit her obligations, her testimony. But I am not *her*."

  "And if you accept Endurantism?" Halloway asked.

  "Then I am her. But then I have to explain how I can change without ceasing to be me. And I have to accept that in the case of Mr. Vane, identity cannot survive the split. One of those men is a stranger to the crime. Possibly both."

  Sterling stepped forward again. "So you're saying the law must choose a metaphysics. If we choose Endurantism, we risk letting a criminal go. If we choose Perdurantism, we risk punishing two men for one crime."

  "I'm saying the law assumes Endurantism," Elena said. "Statutes say 'the person who committed the act.' Singular. Definite article. The law assumes a one-to-one mapping of agent to action. Teleportation breaks that map. You're trying to patch a bridge that's already fallen into the river."

  "We don't have the luxury of letting the bridge stay down," Sterling said. "Society requires accountability. If psychological continuity is sufficient for memory, why isn't it sufficient for guilt?"

  "Because memory isn't identity," Elena said. "I remember being a child. I am not numerically identical to that child. I am a continuation. If that child stole a candy bar, do I owe the restitution? Legally, yes. Metaphysically? It's shaky."

  "It's not shaky enough to let millions in tax fraud slide," Sterling snapped.

  "Order," Halloway said.

  She looked down at her bench, shuffling papers. The silence stretched. Elena watched the two Arthurs. Arthur Duplicate was crying silently. Arthur Prime was staring at the floor, rigid.

  "Dr. Aris," Halloway said. "If you had to rule. Based on your expertise. Not the law. The metaphysics."

  Elena closed her eyes. She felt the weight of the room, the hum of the air filtration, the ache in her lumbar. She thought about the dissertation she had burned. She had wanted to prove that persistence was an illusion, that we were just moments stitching themselves together with lies of memory. But standing here, seeing the fear in the eyes of the duplicates, the illusion felt more real than the theory.

  "Metaphysically," Elena said, opening her eyes. "Identity is strict. It cannot branch. Pre-Scan Arthur is not Prime. He is not Duplicate. He ended at the scan. Both men in the gallery are new entities with old memories. Neither committed the fraud. The fraudster ceased to exist."

  "And yet," Halloway said, "they are here. And the money is gone."

  "Yes."

  "Thank you, Dr. Aris. You may step down."

  Elena stood. Her knees popped. She walked out of the box, passing Sterling. He didn't look at her. He was already typing on his tablet, preparing the closing argument that would ignore her testimony.

  She sat in the gallery row behind the Arthurs. She didn't know which side she was on anymore.

  The verdict came down three hours later. The court adopted a pragmatic hybrid. They ruled that for the purposes of criminal liability, psychological continuity was sufficient. Both Arthurs were held jointly and severally liable. They would split the prison sentence. Five years each, served concurrently.

  It was a compromise. It satisfied neither metaphysics. The Endurantist would say they were punishing innocent duplicates. The Perdurantist would say that splitting the sentence was incoherent—if they are both stages of the same worm, why punish both stages? Why not just punish the worm?

  Elena walked out of the courthouse into the evening air. The city was loud. A teleportation hub glowed blue down the block, people stepping in and out of existence, trusting that the person who stepped out was the one who stepped in.

  She touched her lower back. The pain was gone. She was no longer fatigued. She was hungry.

  Was she the same woman who had testified? If she was, how had the properties changed so completely? If she wasn't, who was responsible for the testimony she just gave?

  She walked toward the subway. A man bumped into her. "Watch it," he said.

  "Sorry," she said.

  She caught her reflection in a shop window. Dark circles under her eyes. Shoulders slumped. She looked like someone who had lost an argument with the universe.

  For a second, just a second, she wondered if she should step into a booth on her way home. Scan herself. Let the old Elena be destroyed, and let a new one wake up in her apartment, fresh, without the背ache, without the memory of the courtroom.

  But the law said the duplicate would inherit her debts. Her lease. Her guilt.

  She kept walking. The pavement was hard under her feet. She was here, wholly present, in this moment. And in the next moment, she would be somewhere else, and slightly different. And she would have to pretend, for the sake of getting through the day, that she was the same.

  It was the only way to persist.
