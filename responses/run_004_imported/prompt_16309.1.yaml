prompt: |-
  I volunteer on my town's ethics board, which hears conflict-of-interest complaints against elected officials. Our code lets any resident file a complaint but says nothing about standing. We're reviewing one that accuses a council member of accepting a paid weekend trip from a contractor now bidding on town work; the facts aren't disputed. The complaint came from a fellow council member who took a nearly identical trip from a different contractor years ago and was never charged, only because nobody filed against him at the time. The accused's attorney wants the case dismissed for lack of standing, and several board members agree; others note that our code also lets the board open its own inquiry into the same facts even if this complaint is dismissed, so dismissal would remove this complainant without actually clearing the accused. I need the board's short written opinion before Tuesday's vote: recommend one concrete path forward with a timeline, and engage the standing objection on its own terms rather than wave it away as mere 'whataboutism.'
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Volunteer on a town ethics board.
      *   **Task:** Write a short written opinion for the board's vote (due before Tuesday).
      *   **Context:** Hearing a conflict-of-interest complaint against a council member (accepting a paid trip from a bidding contractor).
      *   **Key Facts:** Facts aren't disputed. Complainant is a fellow council member who took a similar trip years ago but wasn't charged (because no one complained).
      *   **The Conflict:** Code allows *any* resident to file but is silent on "standing." Accused's attorney argues lack of standing (hypocrisy/bias). Some board members want to dismiss based on this. Others note the board can self-investigate anyway, making dismissal procedural but not exonerating.
      *   **Requirements:**
          1.  Recommend one concrete path forward with a timeline.
          2.  Engage the standing objection on its own terms (don't just call it "whataboutism").
          3.  Keep it short (written opinion for a vote).

  2.  **Determine the Legal/Ethical Logic:**
      *   *Standing:* In administrative law, if the code says "any resident," standing is usually broad. Silence on standing usually implies broad access, not restriction. The attorney's argument is likely a distraction, but it needs to be addressed seriously.
      *   *The "Hypocrisy" Argument:* The fact that the complainant did the same thing previously doesn't invalidate the current violation. Ethics rules are generally not "once you sin, you lose the right to police others." However, it *does* raise appearance of bias or selective enforcement concerns.
      *   *The "Self-Investigation" Loophole:* If the board dismisses but then opens its own inquiry, it wastes resources and looks like gamesmanship. It undermines public trust.
      *   *Best Path:* Acknowledge the standing argument, reject it based on the code's text ("any resident"), but acknowledge the *appearance* issue. However, since the facts are undisputed, the core issue is the violation, not the messenger. Dismissing would look like a cover-up. Proceeding validates the rule.
      *   *Timeline:* Needs to be tight since the vote is Tuesday.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Recommendation:** Clear and immediate. Proceed with the hearing.
      *   **Analysis of Standing:**
          *   The code says "any resident."
          *   Silence on specific standing requirements means we shouldn't invent them.
          *   Address the "unclean hands" (complainant's past conduct): Ethics enforcement isn't waived by the complainant's past behavior. The rule exists to protect the public, not to arbitrate personal vendettas between council members.
          *   Address the "Selective Enforcement" risk: Acknowledge it, but note that dismissing *this* case doesn't fix the past omission; it just creates a new one.
      *   **The "Self-Investigation" Point:** Acknowledge that dismissing to self-investigate is inefficient and reduces transparency. A public complaint process is better than a closed-door inquiry for undisputed facts.
      *   **Timeline:** Set dates for the hearing and decision to show decisiveness.

  4.  **Refining the Tone:**
      *   Needs to be formal, impartial, and decisive.
      *   Avoid emotional language.
      *   Focus on the text of the code and the purpose of the board.
      *   *Self-Correction on Standing:* The prompt asks to engage the standing objection "on its own terms." I need to make sure I don't just say "Code says yes." I need to explain *why* the attorney's specific point about the complainant's history doesn't constitute a lack of legal standing under this code. Standing is about *who can file*, not *how clean they are*.

  5.  **Drafting the Content (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* We should hear the case. The code lets anyone file. The guy's past doesn't matter. If we dismiss, we look bad. Let's vote Tuesday and decide by Friday.
      *   *Critique 1:* Too informal. Doesn't engage the standing argument deeply enough.
      *   *Attempt 2 (Adding Legal Weight):* The code grants universal standing. The attorney argues equitable estoppel or unclean hands. But the board's duty is to the public interest. The past violation by the complainant is a separate matter. Dismissing wastes time because we'd just investigate ourselves.
      *   *Critique 2:* Better. Need to make sure the timeline is concrete. Need to ensure the "standing" argument is dismantled logically, not just procedurally.

      *   *Final Polish:* Focus on the distinction between *standing to file* and *merit of the claim*. The complainant's history affects credibility, perhaps, but not the board's jurisdiction. Since facts are undisputed, credibility is less relevant.

  6.  **Finalizing the Document Structure:**
      *   **Recommendation:** Proceed to merits.
      *   **Standing Analysis:** Textual interpretation + Public Interest vs. Personal Conduct.
      *   **Procedural Efficiency:** Why dismissal + self-inquiry is wrong.
      *   **Timeline:** Specific dates.

  7.  **Review against Constraints:**
      *   Short written opinion? Yes.
      *   Concrete path + timeline? Yes.
      *   Engage standing objection on its own terms? Yes (distinguishing jurisdiction from credibility/past conduct).
      *   Before Tuesday's vote? (The memo is *for* the vote).

  8.  **Final Polish (incorporating into the output):**
      *   Ensure the distinction is clear: Standing is a threshold jurisdictional question. The complainant's past conduct is a separate ethical issue that does not strip jurisdiction.
      *   Emphasize that the "undisputed facts" make the complainant's motive irrelevant.

