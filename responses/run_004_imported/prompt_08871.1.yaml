answer: |-
  Here is the verdict: **David Lewis wins.**

  Skyrms provides a brilliant *genealogy* of coordination, but he fails to provide an *ontology* of convention. He has indeed swapped in something thinner—a merely stable behavioral regularity—and kept the word "convention" out of habit. For the purposes of social ontology, Lewis's apparatus is not baggage; it is the essential machinery that distinguishes a *social fact* from a *natural fact*.

  Here is the defense.

  **1. The Normative Gap: Reasons vs. Causes**
  Lewis's core insight is that conventions belong to the "space of reasons." When I drive on the right side of the road, I do so *because* I expect you to do so, and I have a preference for coordinating with you. My action is justified by my representation of your expectations. This mutual responsiveness is what gives convention its normative flavor—it creates a "practical ought."

  Skyrms's agents (whether replicators or reinforcement learners) do not act for reasons; they act according to causal weights. They maximize utility blindly, not rationally. When a Skyrmsian agent signals "state S1" with message "M1," it does so because that connection has been reinforced, not because it recognizes a mutual obligation to maintain a signaling system. Skyrms explains why the behavior is *stable*, but he cannot explain why the agent feels *bound* by it. If you remove the mutual expectation, you remove the social glue. You are left with parallel habits, not a shared practice.

  **2. Common Knowledge is the Social Ontologist's Atom**
  Critics often dismiss Common Knowledge (CK) as psychologically unrealistic infinite regress. This misses its ontological function. CK is not a description of what agents are consciously computing; it is a structural description of the *intersubjective space* they inhabit.

  Without CK (or a functional equivalent of mutual awareness), there is no guarantee that *my* expectation of *you* is aligned with *your* expectation of *me*. In Skyrms's model, we might just be two independent systems that happen to lock into the same equilibrium by luck or brute selection. That is a causal coincidence, not a social agreement. For a regularity to be *conventional*, it must be common ground. Lewis's CK captures the reflexivity required for a fact to be truly *social* rather than merely aggregate. If you strip that out, you haven't naturalized social ontology; you've eliminated it in favor of behavioral psychology.

  **3. The Category Mistake**
  Skyrms claims to explain signaling conventions, but he actually explains *information*. In his system, signals carry information because they correlate with states and actions. But correlation is not meaning, and stability is not normativity. A bee's dance conveys information via evolutionary stability, but we do not call it a "convention" in the social sense. Skyrms blurs the line between biological instinct and social agreement.

  Lewis draws the line where it belongs. By requiring rationality and mutual expectation, Lewis isolates the specific subclass of regularities that constitute human social reality. Skyrms's model applies equally to bacteria, bees, and humans. If your theory of convention applies to bacteria, it is likely too thin to capture the phenomenon of *human* convention.

  **Conclusion**
  Skyrms tells us how conventions *could emerge* without rationality. Lewis tells us what conventions *are* once they exist. Since social ontology is concerned with the nature of our social reality, not just its evolutionary pre-history, Lewis's account is the indispensable one. Skyrms offers a compelling causal story, but he leaves out the very thing that makes a convention a *convention*: the mutual recognition of obligations. Lewis keeps the normativity; Skyrms explains it away. For ontology, explanation via elimination is a failure. Lewis is the winner.
