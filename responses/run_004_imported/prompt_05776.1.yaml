answer: |-
  This is a fantastic philosophical problem to hang a character study on. It cuts right to the bone of what we mean by "character." Is character what you *do*, or what you *are* when no one is looking?

  Your partner is right: the distinction between **Finks** and **Masks** is the key to unlocking this without getting bogged down in jargon. The reason David Lewis's patch works on one but not the other comes down to a single structural difference: **Internal Change vs. External Interference.**

  Here is the gut-level walkthrough of the logic, followed by how you can weaponize it for Reyes.

  ### 1. The Setup: The "If-Then" Trap
  Philosophers started with a simple definition of dispositions (like bravery, fragility, or solubility):
  *   **Simple Definition:** $X$ is brave if, when $X$ faces danger, $X$ acts courageously.
  *   **The Problem:** Sometimes brave people freeze (Masks), and sometimes cowards get lucky (Finks). The simple definition calls the frozen person a coward and the lucky coward a hero. Both feel wrong.

  ### 2. The Structural Difference: Fink vs. Mask
  To understand why Lewis's fix works on one and not the other, you have to look at *where* the breakdown happens in the chain of events.

  Imagine a lightbulb. The disposition is "being lit." The stimulus is "flipping the switch."

  **The Fink (The Internal Vanishing Act)**
  *   **Scenario:** The bulb is functional. But there is a gremlin inside the socket. The *millisecond* you flip the switch, the gremlin severs the filament.
  *   **Result:** You flip the switch, the light does *not* turn on.
  *   **The Breakdown:** The **basis** (the functional filament) disappeared *at the moment of the stimulus*. The object itself changed its intrinsic nature right when it was tested.
  *   **Why it's a Fink:** The disposition was real, but it fled the scene before it could manifest.

  **The Mask (The External Blocker)**
  *   **Scenario:** The bulb is functional. You flip the switch. The filament glows hot. But someone has painted the bulb with thick black paint.
  *   **Result:** You flip the switch, the light does *not* come out.
  *   **The Breakdown:** The **basis** (the glowing filament) stayed exactly the same. The *path* from the basis to the manifestation was blocked by something external.
  *   **Why it's a Mask:** The disposition was real, persisted through the test, but was smothered by the environment.

  ### 3. Lewis's Patch: "Hold the Basis Constant"
  David Lewis realized the Simple Definition failed because it didn't account for the object changing during the test. So he added a condition:
  *   **Lewis's Definition:** $X$ is disposed to manifest $M$ if, when stimulated by $S$, **and the intrinsic basis of the disposition remains constant**, $M$ happens.

  **Why this fixes the Fink:**
  In the Fink case (the gremlin), the basis (the filament) did *not* remain constant. It broke upon contact. Lewis says: "Since the basis vanished, we cannot use the failure of the light to prove the bulb wasn't functional."
  *   **Verdict:** Lewis saves the disposition. The bulb *is* functional, even though it didn't light up, because the test was unfair (the basis was removed).

  **Why this fails the Mask:**
  In the Mask case (the black paint), the basis (the filament) *did* remain constant. It glowed hot just as it should. Lewis says: "Okay, the basis persisted. So if the light didn't shine, the bulb must not be disposed to shine."
  *   **Verdict:** Lewis is still trapped. He protected the *engine*, but he didn't protect the *exhaust pipe*. Because the basis persisted but the result failed, his definition still incorrectly concludes the bulb isn't functional.

  **The Gut Check:**
  *   **Fink:** The *source* of the power changes status at the critical moment. (Lewis catches this).
  *   **Mask:** The *source* stays the same, but the *output* is blocked. (Lewis misses this).

  ---

  ### 4. Applying This to Reyes
  You want two scenes. One where she is brave but looks like a coward (Mask), and one where she looks brave but isn't (Fink/Reverse Fink). Here is how you write the mechanics of those scenes so your writing group sees the distinction.

  #### Scene A: The Mask (The "Freeze" Flashback)
  *Goal: Prove she **was** brave, but the output was blocked.*
  *   **The Basis (Internal):** You need to show her internal state is correct. Her training kicks in. She assesses the risk. She makes the decision to move. Her heart rate is elevated but controlled. The neural pathways of courage fire.
  *   **The Mask (External/Physiological):** Something intercepts the signal between her brain and her action.
      *   *Idea:* Hypoxia or physiological shock. She decides to jump, her muscles contract, but her leg is pinned under a rock that shifted. Or, her body goes into involuntary shock (a "physiological mask") where the brain sends the "move" signal but the nerves don't carry it.
      *   *The Lewis Test:* If you could look inside her mind at the moment of the storm, you would see the "bravery basis" persisting. She *willed* the action. The failure was in the *transmission*, not the *source*.
      *   *Narrative Clue:* Focus on her frustration. A coward feels relief when they don't have to act. A masked hero feels agony that they *cannot* act.

  #### Scene B: The Finkish Fake-Out (The "Lucky" Moment)
  *Goal: Prove she **wasn't** brave, but the manifestation happened anyway.*
  *   **The Basis (Internal):** She is terrified. She lacks the training. She intends to run. The "basis" of bravery is absent.
  *   **The Fink (The Switch):** At the exact moment of danger, something external changes her internal state temporarily, or creates a false positive.
      *   *Idea:* Dissociation or Adrenaline Dump. She isn't brave; she is dissociated. The "stimulus" (the crisis) triggers a psychological fink: her fear vanishes instantly because her brain checks out. She acts calmly, not because she is courageous, but because she is numb.
      *   *Alternative (The Wire Example):* She is untrained (dead wire). But she is wearing a high-tech harness (the fink gadget) that auto-deploys when she falls. She looks like she made a skilled rescue maneuver, but it was the gear, not her.
      *   *The Lewis Test:* If you look inside her mind, the "bravery basis" was *not* constant. It wasn't there to begin with, or it vanished/replaced itself the moment the risk became real.
      *   *Narrative Clue:* Focus on the aftermath. A brave person feels resolve after a hard choice. A finkish hero feels confusion or impostor syndrome. "I didn't do that. Something else did."

  ### Summary for your Writing Group
  If you need to explain this without sounding like you're reading a textbook:

  1.  **The Mask** is about **Interference.** Reyes has the engine of bravery, but the brakes are locked. Lewis's logic fails here because he only checks the engine.
  2.  **The Fink** is about **Instability.** Reyes appears to have the engine, but it turns into a pumpkin the second she touches the steering wheel. Lewis's logic catches this because he requires the engine to stay an engine throughout the drive.

  By separating these, you can write a character who is genuinely heroic (Masked) but doubts herself, while simultaneously revealing moments where she was credited for bravery she didn't actually possess (Finkish). That creates a profound, unsettling tension about identity that fits your theme perfectly.
