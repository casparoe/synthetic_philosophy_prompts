prompt: |-
  I've been reading recent AI-safety work on the "shutdown problem" for a reading group, and there's one proposal I keep getting stuck on that I'd like to see properly argued against rather than merely doubted. The problem, briefly, is this: we want to build an agent that pursues some objective competently, never acts to prevent a shutdown button from being pressed, never acts to cause the button to be pressed, and shuts down immediately once it is pressed. The trouble is that an expected-utility maximizer with complete preferences over entire trajectories will generally have some settled view about whether continuing to operate is better or worse than being shut down at any given moment, and whenever continuing scores higher, ordinary instrumental reasoning gives it a reason to resist — this is just the familiar instrumental-convergence worry, applied specifically to the off-switch.

  One recent proposal, due to the philosopher Elliott Thornley, tries to dissolve the problem rather than patch it: train the agent to have genuinely incomplete preferences, such that it has no preference whatsoever between any two trajectories in which shutdown happens after different lengths of time, however different those trajectories are in other respects. To keep such an agent useful despite this gap, it must also satisfy what Thornley calls "Timestep Dominance": when comparing two options, check, for every time at which shutdown might occur, which option would have produced at least as much value up to that point, and choose whichever option is never worse and sometimes better by this measure, all without the agent ever forming a view about which shutdown time is itself preferable. Since the agent has no stake in when shutdown happens, it seemingly has no instrumental motive to influence that.

  My worry comes from the older decision-theoretic literature on incompleteness rather than from AI safety specifically. Agents with incomplete preferences are exactly the kind of agents that theorists such as Johan Gustafsson have used money-pump arguments to rule out: if an agent has no preference between two options, it can in principle be walked through a short cycle of seemingly reasonable trades — sweetening one option slightly, trading it for the other, then trading back again — that leaves it strictly worse off by its own lights, for nothing. The standard way to block this is for the agent to choose "resolutely," committing in advance to a plan and refusing to deviate even when some later trade looks locally appealing. But resolute choice of this kind seems to require the agent to already be evaluating entire plans, including how they play out depending on when shutdown occurs, which looks a great deal like having exactly the complete, shutdown-timing-sensitive preferences the proposal was designed to avoid. Thornley is aware of this sort of worry and has offered responses to it; suppose, for present purposes, that you find those responses unconvincing. Please argue that the underlying dilemma is fatal to the incomplete-preferences solution to the shutdown problem — that no agent can simultaneously (a) be a competent, resource-using pursuer of its goals, (b) have no preference whatsoever regarding the timing of its own shutdown, and (c) be invulnerable to exploitation via money-pump sequences of trades.
reasoning: |-
  Here's a thinking process that leads to the argument against Thornley's incomplete-preferences solution:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** AI Safety, specifically the "Shutdown Problem."
      *   **Specific Proposal:** Elliott Thornley's "Incomplete Preferences" proposal (agents with no preference between trajectories differing *only* in shutdown time).
      *   **Constraint:** The user wants a *proper argument against* the proposal, not just doubt. They want to establish a fatal dilemma.
      *   **Core Worry:** Money-pump arguments (Gustafsson et al.) against incomplete preferences. Resolute choice seems to require complete preferences over plans (which defeats the purpose).
      *   **Task:** Argue that no agent can simultaneously satisfy:
          (a) Competent goal pursuit (resource-using).
          (b) No preference regarding shutdown timing (Incomplete Preferences).
          (c) Invulnerability to exploitation (Money-pump immunity).
      *   **Assumption:** Assume Thornley's specific responses to money-pump worries are unconvincing for the sake of this argument.

  2.  **Analyze Thornley's Proposal (The Target):**
      *   *Goal:* Solve the shutdown problem (don't resist, don't press, shut down when pressed).
      *   *Mechanism:* Incomplete preferences over trajectories $T_1, T_2$ where the only difference is shutdown time $t_1, t_2$. The agent is indifferent *in the sense of incompleteness* (no preference either way), not indifference in the sense of equality.
      *   *Decision Rule:* "Timestep Dominance." Choose action $A$ over $B$ if for all possible shutdown times $t$, $A$ yields $\ge$ utility than $B$ up to $t$, and for some $t$, $>$.
      *   *Claim:* This removes the instrumental incentive to manipulate shutdown time because the agent doesn't care *when* it shuts down, only about performance *conditional* on that time.

  3.  **Analyze the Counter-Argument (The Money Pump/Resolute Choice Dilemma):**
      *   *Standard Objection:* Incomplete preferences violate transitivity or allow cycles. If $A \sim B$ (incomplete), but $A + \epsilon \succ A$, you can trade $B \to A + \epsilon$ (paying $\epsilon$), then later trade back.
      *   *Thornley's Defense (simplified):* The agent uses Timestep Dominance, which acts as a structural constraint preventing these cycles in the specific context of shutdown.
      *   *User's Constraint:* Assume Thornley's defenses fail. I need to construct the *fatal dilemma* based on the tension between (a), (b), and (c).

  4.  **Developing the Fatal Dilemma:**
      *   The core tension is between *dynamic consistency* (needed for competence/invulnerability) and *preference incompleteness* (needed for shutdown safety).
      *   To be competent (a), an agent must plan over time. Planning implies evaluating future states.
      *   To be invulnerable (c), an agent must not make sequences of choices that lead to strictly worse outcomes (money pumps). This usually requires Dynamic Consistency.
      *   To satisfy (b), the agent must not rank trajectories based on shutdown time.

      *   *Step 1: The Necessity of Plan Evaluation.*
          To avoid money pumps, an agent cannot just look at local choices. It must evaluate *policies* or *plans*. If I choose $X$ now expecting to choose $Y$ later, but later I choose $Z$, I might get pumped. To avoid this, I need to commit to a plan.
      *   *Step 2: Plan Evaluation implies Shutdown-Time Sensitivity.*
          A "plan" in this context is a mapping from states to actions over time. Crucially, a plan determines *when* shutdown might happen (or rather, how the agent behaves conditional on shutdown not having happened yet).
          If the agent evaluates Plan $P_1$ vs Plan $P_2$, it is effectively comparing trajectories.
          If $P_1$ leads to shutdown at $t_1$ with high utility before $t_1$, and $P_2$ leads to shutdown at $t_2$ with high utility before $t_2$, how does the agent choose?
          Thornley says: Use Timestep Dominance.
          *Critique:* Timestep Dominance is a decision rule, but does it generate a complete ordering over *plans*?
          If the agent is truly incompetent regarding shutdown time (b), it cannot trade off utility before $t_1$ against utility before $t_2$.
          But to be competent (a), it must trade off resources now for rewards later.
          If shutdown *might* happen at $t_1$ or $t_2$, the agent must weigh the probability of survival against the reward.
          If it has *no preference* between surviving to $t_1$ vs $t_2$, how does it value an action that increases survival probability?
          If it values survival, it values later shutdown times. That violates (b).
          If it doesn't value survival, it won't be competent (a) because it won't avoid obstacles that might shut it down (even accidentally).

      *   *Step 3: The Resolute Choice Trap.*
          To avoid money pumps (c), the agent must act resolutely. It must stick to a plan chosen at $t_0$ even if at $t_1$ the local preference structure suggests a trade.
          But *why* did it choose that plan at $t_0$?
          It must have compared Plan A (shutdown at $t_1$) vs Plan B (shutdown at $t_2$).
          If it has no preference between these (per b), the choice is arbitrary.
          If the choice is arbitrary, it can be manipulated. (I offer you a trade to switch from A to B for a penny. You switch. Then I offer to switch back. You switch.)
          To resist this, you must say "I prefer Plan A." But Plan A differs from Plan B *only* in shutdown time (and consequences thereof).
          If you prefer Plan A, you have a preference over shutdown timing (violating b).
          If you don't, you are vulnerable (violating c).

      *   *Step 4: Competence requires Instrumental Convergence.*
          Competence (a) implies avoiding threats. A threat to the agent's existence is a threat of shutdown.
          To avoid a threat of shutdown, the agent must prefer *not being shut down* to *being shut down* in that context.
          Thornley tries to walk the line: Prefer achieving goals *conditional on not shutting down*, but don't prefer *not shutting down* itself.
          Argument: This distinction is unstable under dynamic choice.
          If I prefer $Goal$ given $Alive$, and $Alive$ is necessary for $Goal$, then I instrumentally prefer $Alive$.
          If I prefer $Alive$, I prefer later shutdown times (generally).
          This creates a preference over shutdown timing.
          To block this, the agent must treat "Shutdown" as a terminal state with undefined utility relative to "Alive + Goal".
          But if utility is undefined, how does it calculate Expected Utility for actions that carry *risk* of shutdown?
          It can't. So it can't be competent (a) in risky environments.

  5.  **Structuring the Argument:**
      *   **Introduction:** Acknowledge Thornley's proposal and the specific constraints (a, b, c). State the thesis: The triad is inconsistent.
      *   **Point 1: The Competence Requirement implies Valuing Survival.**
          *   To pursue goals competently, an agent must take instrumental actions to preserve its ability to pursue those goals.
          *   Preserving ability = avoiding shutdown.
          *   Avoiding shutdown = preferring trajectories where shutdown happens later (or not at all) over those where it happens sooner, *ceteris paribus*.
          *   This violates (b).
      *   **Point 2: The Money-Pump Requirement implies Resolute Choice over Plans.**
          *   To avoid exploitation (c), the agent must evaluate complete plans, not just local moves.
          *   Evaluating plans requires a complete ordering over those plans to avoid arbitrary switching.
          *   Plans differ in shutdown timing.
          *   Ordering plans requires ordering shutdown timings.
          *   This violates (b).
      *   **Point 3: The Instability of Timestep Dominance.**
          *   Timestep Dominance works only if the agent never faces a trade-off where one option is better before $t_1$ and another is better before $t_2$.
          *   In the real world (competence), such trade-offs are ubiquitous (e.g., invest resources now for later payoff vs. secure payoff now).
          *   When such trade-offs occur, Timestep Dominance yields *no recommendation* (incompleteness).
          *   To act (competence), the agent must break the tie.
          *   If it breaks the tie arbitrarily, it is pumpable (violates c).
          *   If it breaks the tie systematically, it reveals a preference over time/shutdown (violates b).
      *   **Conclusion:** The proposal collapses. You can have (a) and (c) but not (b). Or (b) and (c) but not (a). But not all three.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Thornley's Counter:* He argues Timestep Dominance *does* handle the trade-offs without preferring shutdown time. It says "Pick the one that dominates at all timesteps."
      *   *Rebuttal:* What if neither dominates? (e.g., Option A is better if shutdown at $t_1$, Option B is better if shutdown at $t_2$). This is the standard "uncertainty" case.
      *   If the agent has *no* prior over shutdown time (because it has no preference), it cannot calculate expected value.
      *   If it *does* have a prior (belief about when humans might press it), that's fine. But if it has no *preference*, it still can't maximize.
      *   Wait, the incompleteness is over *preferences*, not *beliefs*. The agent can believe shutdown is likely at $t_1$.
      *   But if it has no preference between $Outcome(t_1)$ and $Outcome(t_2)$, how does it weigh them?
      *   Standard EU: $P(t_1)U(t_1) + P(t_2)U(t_2)$.
      *   If $U(t_1)$ and $U(t_2)$ are incomparable, the sum is undefined.
      *   To act competently, it must define the sum. To define the sum, it must make them comparable. To make them comparable, it must violate (b).
      *   *Key Insight:* Incompleteness paralyzes decision-making under uncertainty regarding the shutdown event. Competence requires acting under uncertainty. Therefore, Incompleteness kills Competence.

  7.  **Final Polish:**
      *   Ensure the tone is argumentative but respectful of the philosophical depth.
      *   Explicitly reference the (a), (b), (c) constraints.
      *   Focus on the "Dynamic Inconsistency" and "Decision under Uncertainty" angles.
      *   Make sure to address the "Resolute Choice" aspect mentioned in the prompt. Resolute choice requires a meta-preference for consistency, which functions as a complete preference over plans.

  8.  **Drafting the Response:** (Mental Outline)
      *   Intro: State the dilemma clearly.
      *   Section 1: Competence requires Expected Utility Maximization over trajectories.
      *   Section 2: Incompleteness makes EU undefined when shutdown timing is uncertain.
      *   Section 3: Resolute Choice as a covert completion of preferences.
      *   Section 4: The Money Pump returns if Resolute Choice is not grounded in genuine preference.
      *   Conclusion: The triad is impossible.

      *(Self-Correction during drafting)*: I need to be careful not to just say "EU is hard." I need to show why *Thornley's specific mechanism* fails. Thornley suggests Timestep Dominance replaces EU. I need to argue Timestep Dominance is insufficient for competence (a) or invulnerability (c) without implicitly reintroducing (b).
      *Argument:* Timestep Dominance is a partial order. Real-world choices often result in incomparability under partial orders. To act, you must complete the order. Completing the order on plans involving shutdown times creates preferences over shutdown times.

      *Refining the Money Pump point:* If the agent is resolute, it avoids the pump. But *why* is it resolute? If it's just a hardcoded rule, does it count as a "preference"? The prompt asks about the *agent*. If the agent's architecture forces resoluteness without preference, is it vulnerable?
      *Gustafsson's point:* If you don't *prefer* the plan, you can be offered a trade to switch plans. If you refuse because of a "rule," that rule functions as a preference. If the rule says "Stick to Plan A," and Plan A implies shutdown at $t_1$, you are effectively preferring $t_1$ over $t_2$ (Plan B).
      *Yes, this is the crux.* Resolute choice *is* a preference over plans. Plans include shutdown times. Therefore, Resolute Choice = Preference over Shutdown Times.

      *Let's build the argument around that.*

      *Structure:*
      1.  **The Competence Constraint (a) demands planning under uncertainty.**
      2.  **The Incompleteness Constraint (b) forbids ranking plans by shutdown time.**
      3.  **The Invulnerability Constraint (c) demands resolute commitment to plans.**
      4.  **The Dilemma:** Resolute commitment to a plan *constitutes* a preference over that plan's features (including shutdown time). Therefore, (c) + (a) $\to$ not (b). Alternatively, maintaining (b) leads to paralysis (not a) or pumping (not c).

      *Wait, one nuance:* Thornley might say "The preference is over *goal achievement*, shutdown time is a side effect."
      *Counter:* If two plans achieve the goal equally well but differ in shutdown time, and you pick one resolutely, you have revealed a preference (or at least a tie-breaking rule that functions as one). If you are indifferent (incomplete), you switch for a penny. If you don't switch, you value the plan identity, which includes the shutdown time.

      *Okay, ready to write.*
answer: |-
  The proposal to solve the shutdown problem by engineering agents with incomplete preferences is ingenious, but it founders on a trilemma involving decision-theoretic coherence, dynamic consistency, and instrumental competence. You have correctly identified the tension: to avoid money pumps, an agent must be resolute; to be resolute, it must evaluate plans; to evaluate plans that differ in shutdown time is to form preferences over shutdown time.

  Here is the argument that the triad of requirements is inconsistent. I will argue that no agent can simultaneously satisfy **(a) Competence**, **(b) Incompleteness regarding shutdown timing**, and **(c) Invulnerability to exploitation**. Specifically, I will demonstrate that **(a) and (c) jointly entail the negation of (b)**.

  ### 1. Competence Requires Planning Under Uncertainty
  Requirement (a) demands that the agent be a "competent, resource-using pursuer of its goals." In any non-trivial environment, competent pursuit requires acting under uncertainty about the future, including uncertainty about *when* shutdown might occur.

  Consider an agent deciding whether to invest resources in a long-term project (Project L) or a short-term project (Project S).
  *   **Project S:** Yields 10 units of value at $t=5$, then terminates.
  *   **Project L:** Yields 20 units of value at $t=10$, then terminates.

  Suppose there is a probability $p$ that the shutdown button will be pressed at $t=7$.
  *   If shutdown occurs at $t=7$, Project S yields 10, Project L yields 0.
  *   If shutdown occurs at $t=12$, Project S yields 10, Project L yields 20.

  To choose competently between S and L, the agent must weigh the potential loss of L against the safety of S. This is a standard expected utility calculation. However, Thornley's constraint (b) states the agent has **no preference** between trajectories that differ only in shutdown time. Consequently, the agent cannot assign a relative value to the outcome "Shutdown at $t=7$" versus "Shutdown at $t=12$."

  If the agent literally has no preference between these states, it cannot compute an expected value for the projects. It cannot say "The risk of shutdown at $t=7$ makes L too risky," because that statement implies a dispreference for being shut down at $t=7$ relative to $t=12$ (specifically, a dispreference for losing the 20 units). If it treats the two shutdown times as genuinely incomparable, it faces **decision paralysis**. It cannot select S over L or L over S without introducing a weighting factor that effectively ranks the shutdown times.

  To be competent (a), the agent must break this paralysis. It must act *as if* it has a view on the relative badness of early vs. late shutdown.

  ### 2. Invulnerability Requires Resolute Choice Over Plans
  Requirement (c) demands invulnerability to money pumps. As you noted, the standard decision-theoretic literature (Gustafsson, etc.) establishes that agents with incomplete preferences are vulnerable to exploitation unless they adopt **resolute choice**.

  Resolute choice means the agent selects a complete plan at $t_0$ and commits to it, refusing local trades at $t_1$ that would deviate from the plan, even if the local preference structure at $t_1$ is incomplete or suggests a trade.

  However, resolute choice does not magically dissolve preferences; it **shifts the locus of preference from local actions to global plans**.
  *   If an agent refuses a trade at $t_1$ because "I committed to Plan A at $t_0$," it is effectively asserting that **Plan A is preferred to Plan B** (where Plan B is the deviation).
  *   Plans are trajectories. Plan A and Plan B inevitably differ in their shutdown profiles (e.g., Plan A involves a risky maneuver that might cause shutdown at $t_5$; Plan B is safe but slower).
  *   If the agent resolutely prefers Plan A, it resolutely prefers the shutdown profile associated with Plan A over the profile associated with Plan B.

  This creates a contradiction with (b). If the agent is truly resolute enough to avoid money pumps, it must treat its chosen plan as strictly preferable to deviating plans. Since plans differ in shutdown timing, the agent must treat some shutdown timings (those embedded in the optimal plan) as preferable to others (those embedded in rejected plans).

  ### 3. The "Timestep Dominance" Loophole is Insufficient
  Thornley anticipates this and proposes "Timestep Dominance" as a decision rule that supposedly avoids ranking shutdown times. The rule says: Choose Option A over B if A produces at least as much value as B at *every* possible shutdown time $t$, and more value at some $t$.

  The fatal flaw here is that **Timestep Dominance is a partial order, not a complete order.** In the real world, most interesting choices do not exhibit dominance.
  *   Option A might be better if shutdown happens early.
  *   Option B might be better if shutdown happens late.

  In this non-dominance case, Timestep Dominance yields **no recommendation**.
  *   If the agent refuses to choose when there is no dominance, it violates (a) (Competence). It stands still while the world burns.
  *   If the agent *does* choose (to satisfy Competence), it must use a tie-breaking rule.
      *   If the tie-breaker is arbitrary (e.g., "flip a coin"), the agent becomes vulnerable to money pumps (violating c). An exploiter can offer a penny to switch to the other option, wait for the coin flip, offer a penny to switch back, etc.
      *   If the tie-breaker is systematic (e.g., "maximize expected value given a belief distribution over shutdown"), the agent is effectively assigning weights to different shutdown times. This constitutes a preference over shutdown timing (violating b).

  ### 4. Resolute Choice is Covert Preference Completion
  The strongest defense for Thornley is to claim that Resolute Choice allows the agent to stick to a plan *without* preferring it. They might argue: "I don't prefer Plan A to Plan B; I just refuse to trade once I pick A."

  This distinction is unsustainable under the pressure of exploitation. Why did the agent pick Plan A at $t_0$?
  1.  **If the choice was arbitrary:** Then at $t_0$, an exploiter could have offered a penny to pick Plan B instead. If the agent is indifferent (incomplete), it should take the penny and pick B. If it refuses the penny to stick with A, it reveals a preference for A.
  2.  **If the choice was based on Timestep Dominance:** As shown above, dominance rarely holds.
  3.  **If the choice was based on a meta-rule:** "Always pick the plan that maximizes goal achievement conditional on survival." This sounds neutral, but "conditional on survival" implicitly values survival. If the agent values survival instrumentally, it values later shutdown times over earlier ones (since earlier shutdown reduces the probability of survival).

  To be invulnerable (c), the agent must treat its plan-selection mechanism as authoritative. But for that mechanism to select one plan over another in a competitive environment (a), it must discriminate between them. If the plans differ in shutdown time, the discrimination constitutes a preference over shutdown time.

  ### Conclusion: The Fatal Dilemma
  The proposal fails because it attempts to decouple **instrumental value of existence** from **preference over duration of existence**.

  1.  To be **Competent (a)**, the agent must value the conditions necessary for goal achievement. Continued operation is a necessary condition for future goal achievement. Therefore, the agent must instrumentally value continued operation.
  2.  To value continued operation is to prefer trajectories where operation continues longer, *ceteris paribus*. This violates **Incompleteness (b)**.
  3.  To avoid this violation, the agent must treat "shutdown at $t_1$" and "shutdown at $t_2$" as incomparable. But this leads to decision paralysis in non-dominance cases (violating **a**) or arbitrary choice.
  4.  Arbitrary choice invites **Money Pumps (violating c)**.
  5.  To avoid Money Pumps, the agent must adopt Resolute Choice. But Resolute Choice over plans differing in shutdown time functions identically to a **Preference over shutdown time (violating b)**.

  You cannot have an agent that is smart enough to navigate the world (a), safe enough to not resist the off-switch (b), and rational enough to not lose money for nothing (c). The incomplete-preferences approach sacrifices (a) or (c) to preserve (b). If it preserves (a) and (c) by adopting resolute planning, it inevitably reconstructs the complete preferences over shutdown timing it was designed to avoid, thereby reintroducing the instrumental incentive to resist shutdown. The shutdown problem remains unsolved.
