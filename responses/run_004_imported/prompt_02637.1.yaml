answer: |-
  You are absolutely right to pause here. This passage is one of the most counter-intuitive moments in *Principia Ethica*, and it trips up almost everyone reading it for the first time. It sounds like Moore is saying, "Loving a person's soul is less valuable than loving their face," which seems to undermine his whole project of elevating personal affection.

  However, you are also right that **Organic Unities** is the engine driving this. But to make sense of it, you have to see exactly how Moore applies his "Method of Isolation" here.

  Here is a step-by-step reconstruction of the argument, followed by an explanation of why it isn't as weird as it sounds (though it is still distinctly Moorean).

  ### 1. The Argument Reconstruction

  Moore is analyzing the **state of consciousness** involved in "personal affection" (love/friendship). He wants to know what makes this state valuable.

  *   **Step 1: The Components of Affection.**
      When we love someone, our consciousness includes an appreciation of their **mental qualities** (their character, virtue, mind).
  *   **Step 2: The Contribution of Mental Qualities.**
      Admitting that appreciating these mental qualities makes the *whole* experience of love more valuable than if we ignored them. (Love based only on utility or blind instinct is worse).
  *   **Step 3: The Isolation Test (The Crucial Move).**
      Moore asks: How valuable is the appreciation of mental qualities **in isolation**? Imagine a state of consciousness where you appreciate someone's virtue *without* any sensory or bodily connection to them (no voice, no face, no actions, just pure knowledge of their mind).
  *   **Step 4: The Verdict on Isolation.**
      Moore claims this isolated state is hard to imagine and, if we do imagine it, seems to have **less value** than the appreciation of mere corporeal beauty (e.g., looking at a beautiful statue or landscape).
      *   *Quote:* "...whether the appreciation of what has great intrinsic value [mental qualities] is so valuable as the appreciation of what is merely beautiful."
  *   **Step 5: The Organic Unity.**
      However, in actual human love, we never have Step 3. We have the mental qualities **expressed** through the body (looks, words, actions).
      *   **The Whole:** Appreciation of Mental Qualities + Appreciation of their Corporeal Expression.
      *   **The Value:** This *whole* is vastly more valuable than the sum of its parts.
  *   **Conclusion:** The value of admiring character lies not in the admiration itself (which might be dry/abstract), but in how it transforms the appreciation of the physical person into a unified, deeply valuable experience of love.

  ### 2. Is "Organic Unities" the Driver?

  **Yes.** This is a classic application of the Principle of Organic Unities.

  Moore's principle states: *The value of a whole must not be assumed to be the same as the sum of the values of its parts.*

  In this specific case, Moore is arguing for a **negative interaction** (or at least a non-additive one) regarding the parts:
  *   Part A (Appreciation of Mind alone) = Low/Moderate Value.
  *   Part B (Appreciation of Body alone) = Moderate Value.
  *   Whole (Appreciation of Mind *in* Body) = Extremely High Value.

  He is arguing against the view that the "Mind" part is doing all the heavy lifting. If the Mind part were the sole source of value, then stripping away the Body shouldn't reduce the value much. But Moore thinks stripping away the Body reduces the value drastically. Therefore, the Body isn't just a container; it is a **constitutive element of the good.**

  ### 3. Addressing the "Weirdness" (Charitable Reading)

  It feels weird because it sounds like Moore is prioritizing aesthetics over morality. But a charitable reading suggests he is making a point about **human psychology** and **anti-intellectualism**.

  **A. Love is not Moral Approval**
  Moore is pushing back against the Kantian or Socratic idea that love is essentially "respect for rationality" or "approval of virtue." If love were just approving of someone's good character, then the body wouldn't matter. Moore is saying: *No, that's not what love is.* Love is an emotional, sensory experience. If you remove the sensory element (the "corporeal expression"), you don't have love anymore; you have moral judgment. And moral judgment (in isolation) is less valuable than the experience of love.

  **B. The "Good" vs. The "Beautiful"**
  This is the most shocking sentence: *"whether the appreciation of what has great intrinsic value is so valuable as the appreciation of what is merely beautiful."*
  *   **What has great intrinsic value:** A good human character (virtue).
  *   **What is merely beautiful:** A sunset, a flower, a face (which Moore considers to have no *moral* value, only aesthetic value).
  *   **Moore's Point:** The *conscious state* of enjoying a sunset might be intrinsically better than the *conscious state* of coldly acknowledging someone is virtuous.
      *   Why? Because aesthetic appreciation is immediate and emotional. Abstract moral cognition can be dry.
      *   He is not saying a virtuous person is worse than a sunset. He is saying **enjoying** a sunset might be a "better" state of mind than **thinking about** virtue without feeling it.

  **C. Protecting the "Pillar"**
  You worried this undermines his elevation of friendship/love. Actually, Moore thinks this **protects** it.
  If he argued that the *mental qualities alone* were the source of value, then love would be reducible to ethics. By insisting that the **corporeal expression** is necessary for the highest value, he secures the idea that personal affection is a unique good, distinct from simply respecting a moral agent. It requires the concrete, physical human being.

  ### 4. Seminar Discussion Points

  If you want to raise this in seminar, here are three angles that show you've grasped the nuance:

  1.  **The Method of Isolation:** Ask the class if Moore's "Isolation Test" works here. Is it actually possible to imagine "appreciation of mental qualities alone"? If the thought experiment is impossible (as Moore hints: *"very difficult to imagine"*), can we really draw conclusions about intrinsic value from it?
  2.  **The Definition of "Corporeal":** Moore lumps "words" and "actions" into "corporeal expression." This is interesting. He isn't just talking about a pretty face; he's talking about the *enactment* of character. Does this mean love requires *activity*, not just static contemplation?
  3.  **The Hierarchy of Appreciation:** Moore suggests `Appreciation of (Mind+Body) > Appreciation of Body > Appreciation of Mind`. Ask if this hierarchy holds up. Is it true that admiring a villain's beautiful face is a "better" state of consciousness than admiring a saint's invisible charity? (Moore might say yes, regarding the *intrinsic value of the experience*, even if the *consequences* of the saint are better).

  ### Summary
  You aren't reading it uncharitably; the claim **is** radical. Moore is saying that **abstract moral admiration is less valuable than aesthetic appreciation.**

  But he saves the theory by arguing that **Personal Affection** is the Organic Unity that combines them. We don't have to choose between loving the mind or the body. The highest good is loving the mind *as it is expressed through* the body. Without the body, the love loses its specific value; without the mind, it loses its depth. Both are required for the "Ideal."

  So, he isn't putting looks above character; he is putting **embodied character** above **disembodied character.**
