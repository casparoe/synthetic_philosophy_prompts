prompt: |-
  So a few of us run a tiny podcast that grew out of our local ACX/rationalist meetup, and this month's guest is a decision theorist who's spent her whole career defending 'resolute choice' -- the McClennen-ish view that a rational agent sticks to whatever plan she'd have picked in advance, even once backward induction says to bail at the node your actually standing at. Her go to example is the dollar auction: her stock answer whenever someone calls the escalating bids irrational is that they're smuggling in a 'sophisticated chooser' assumption nobody's forced to accept, and that a resolute bidder is just doing what her earlier self wanted done. I don't want her to just get to repeat that line for 40 minutes. Can you draft like 9 interview questions that push past it -- at least one on whether this is just the sunk cost fallacy with a rebrand, one that pins down what the resolutely-chosen plan in a dollar auction actually is and why fixing it in advance doesn't smuggle backward induction back in through the side door, one on what happens on her view when both bidders are equally resolute (seems like a recipe for mutual disaster, not a fix), and one tying all this to the 'commitment race' worries people raise about advanced AI systems pre-committing to threats. For each, add a quick follow-up keyed to whatever answer she's most likely to give. Please no 'what drew you to decision theory' throat-clearing question.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the Request:**
      *   **Context:** A tiny podcast from a local ACX/rationalist meetup.
      *   **Guest:** A decision theorist specializing in "resolute choice" (McClennen-style).
      *   **Core View:** Rational agents stick to ex-ante plans even when ex-post incentives suggest deviation (violating dynamic consistency/Sophisticated Choice).
      *   **Key Example:** The Dollar Auction (guest argues escalating bids are rational if resolute).
      *   **Goal:** 9 interview questions that push past her standard "resolute choice is valid" line.
      *   **Specific Requirements:**
          *   No "how did you get started" fluff.
          *   Must include a question on Sunk Cost Fallacy rebranding.
          *   Must include a question on the specific plan in a Dollar Auction and whether it smuggles in backward induction.
          *   Must include a question on symmetric resoluteness (mutual disaster).
          *   Must include a question on AI commitment races/threats.
          *   Each question needs a specific follow-up based on the likely answer.
      *   **Tone:** Intellectual, rigorous, slightly skeptical (rationalist community style), but respectful.

  2.  **Deconstruct "Resolute Choice" (McClennen):**
      *   *Standard View (Sophisticated Choice):* You anticipate your future self's incentives. If future-you will defect, present-you plans for that. Leads to dynamic consistency but can result in suboptimal outcomes (e.g., inability to cooperate in Prisoner's Dilemma, losing Dollar Auctions by not bidding or bidding low).
      *   *Resolute Choice:* You bind your future self to the plan that maximized utility at $t_0$. You ignore the local incentives at $t_n$.
      *   *Criticism:* It looks like magical pre-commitment without a mechanism. It looks like the Sunk Cost Fallacy. It creates conflicts when two resolute agents meet.

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Sunk Cost Fallacy.*
          *   *Draft:* Isn't this just sunk cost?
          *   *Refinement:* Need to make it sharper. The sunk cost fallacy is usually considered irrational. She claims it's rational. How do we distinguish?
          *   *Follow-up:* She'll likely say "Sunk cost ignores the plan; resolute choice *is* the plan." Need to press on the *mechanism* of ignoring local incentives.

      *   *Requirement 2: Dollar Auction Plan & Backward Induction.*
          *   *Draft:* What is the plan in the dollar auction? Does it use backward induction?
          *   *Refinement:* In a dollar auction, the ex-ante optimal plan is tricky. If I plan to bid \$5, but you bid \$6, do I stick to \$5? If I'm resolute, do I bid forever? If I fix the plan at $t_0$, don't I have to anticipate your moves? If I anticipate your moves using backward induction, haven't I just become sophisticated?
          *   *Follow-up:* Focus on the *content* of the plan. Is it a strategy function or a single path?

      *   *Requirement 3: Symmetric Resoluteness (Mutual Disaster).*
          *   *Draft:* What if we are both resolute?
          *   *Refinement:* If two resolute agents meet in a Dollar Auction or Prisoner's Dilemma, and both refuse to deviate from "win at all costs," they crash. Does resolute choice require a tie-breaking rule? Does it collapse into Nash Equilibrium anyway?
          *   *Follow-up:* Press on whether resoluteness is a dominant strategy or if it requires coordination.

      *   *Requirement 4: AI Commitment Races.*
          *   *Draft:* What about AI threats?
          *   *Refinement:* Rationalists worry about AI pre-committing to blackmail. If resolute choice is valid, does that make commitment races *worse*? If AI can be resolute, does it make them more dangerous?
          *   *Follow-up:* Ask if there's a "meta-resoluteness" where you resolve not to be too resolute.

      *   *Filling the remaining 5 questions (Need to cover other weaknesses/implications):*
          *   *5. The Mechanism/Implementation:* How does a brain/AI actually *do* this? Is it a preference change or a constraint?
          *   *6. Diachronic Dutch Books:* Can a sophisticated agent money-pump a resolute agent? (Classic objection).
          *   *7. New Information:* What if the world changes between $t_0$ and $t_n$? Does resoluteness demand ignoring new info? (Crucial distinction).
          *   *8. Regret:* How does the agent feel at $t_n$? Do they experience regret? If they don't act on it, is that repression or rationality?
          *   *9. Normative Force:* Why *ought* we be resolute? Is it because it pays better, or because it's more "rational"? (Instrumental vs. Procedural).

  4.  **Refining and Polishing:**
      *   Make sure the tone fits the ACX/Rationalist vibe (precise, game-theory literate, slightly contrarian).
      *   Ensure the follow-ups are punchy and anticipate the "stock answer."
      *   Check against constraints: 9 questions? Yes. Specific topics covered? Yes. No throat-clearing? Yes.

      *(Self-Correction during drafting)*: Make sure Question 2 really hits the "smuggling backward induction" point hard. The guest says backward induction isn't required. But to make a plan, you need to predict the game. If you predict the game using game theory, you get backward induction. How does she escape that loop?
      *(Self-Correction on Follow-ups)*: Ensure the follow-up isn't just "Why?" but challenges the specific defense she's likely to mount.

  5.  **Final Review against constraints:**
      *   9 questions? Yes.
      *   Sunk Cost? (Q1)
      *   Dollar Auction Plan/Backward Induction? (Q3)
      *   Symmetric Resoluteness? (Q5)
      *   AI Commitment? (Q9)
      *   Follow-ups included? Yes.
      *   No "how did you start"? Yes.

  6.  **Final Polish:** Check the phrasing to sound like a podcast host, not an exam paper. (e.g., "Let's bite the bullet," "Here's the worry.")

      *(Wait, let's look at the Dollar Auction logic again)*: In a dollar auction, the ex-ante optimal plan is usually "Don't Play." If you play, you are already in a trap. If she says "Bid up to \$10 and stop," but the opponent bids \$11, does the resolute agent bid \$12? If yes, why \$12 and not \$100? If no, they lose the sunk cost. The question needs to expose the ambiguity of the "plan."

      *(AI Question)*: Make sure to link it to "commitment races" specifically (the worry that AIs will pre-commit to aggressive stances to force concessions).

      *(Sunk Cost)*: Distinguish between "I paid \$50 so I must finish" (fallacy) vs "I planned to finish so I must finish" (resolute). The line is thin.

      *Okay, ready to write.*
answer: |-
  Here are 9 interview questions designed to press the guest on the mechanics and implications of resolute choice, tailored for a rationalist-literate audience.

  **1. The Sunk Cost Rebrand**
  "Let's start with the elephant in the room. To a standard economist or a 'sophisticated chooser,' your resolute agent looks indistinguishable from someone committing the Sunk Cost Fallacy. They've both paid a cost they can't recover, and they're both continuing a project solely because they started it. You call it rational fidelity to a plan; the critic calls it throwing good money after bad. What is the structural difference between a resolute chooser and a gambler who can't walk away because they've already lost too much?"

  *   **Follow-up:** "She'll likely say the gambler is reacting emotionally to the loss, while the resolute agent is executing an ex-ante policy. Push back: 'But if the internal experience and the outward behavior are identical, and the money is gone either way, does the *label* of "plan" actually change the expected utility, or is it just a semantic shield?'"

  **2. The Mechanism of Ignoring Incentives**
  "Resolute choice requires that at time $t_1$, you ignore the local incentives that were present at $t_1$ but absent at $t_0$. In a physical system, that looks like a constraint. In a human or AI, what is the causal mechanism that disables the preference update? Are you arguing that rational agents literally suppress information about their current options, or that they weight their 'past self's utility function' higher than their 'current self's'?"

  *   **Follow-up:** "If she says it's a preference change: 'Doesn't that just mean preferences are unstable? If I can choose to value my past self's utility over my current one, what stops me from doing that selectively only when it's convenient, which collapses back into sophisticated choice?'"

  **3. The Dollar Auction Plan & Backward Induction**
  "Let's pin down the Dollar Auction. If I am resolute, I need a plan at $t_0$. Is that plan 'Bid up to \$5 and stop' or 'Never let the opponent win'? If it's the former, and the opponent bids \$6, my local incentive is to bid \$7 to minimize loss. If I'm resolute, do I stick to \$5 and lose the sunk cost, or do I update the plan? If I update the plan, haven't I just smuggled backward induction back in through the side door by reacting to the node I'm standing at?"

  *   **Follow-up:** "If she argues the plan is a full strategy function (e.g., 'If they bid X, I bid Y'): 'But to construct that function at $t_0$, don't you have to simulate the opponent's rationality? If you simulate them as sophisticated choosers, game theory says the only equilibrium is not to play. So how does resoluteness get a foothold without assuming the opponent is irrational first?'"

  **4. Diachronic Dutch Books**
  "A classic objection to dynamic inconsistency is the Dutch Book argument. If I know I'm going to be resolute, can't a sophisticated bookie construct a series of bets where I pay to enter a contract at $t_0$, and then pay again at $t_1$ to stay in it, ending up worse off than if I'd just been sophisticated? If resolute choice is truly rational, it shouldn't be money-pumpable. Where does the pump get blocked?"

  *   **Follow-up:** "She'll likely say the resolute agent refuses the second trade. Press: 'But refusing the second trade means turning down a strictly dominant local move. Are you arguing that rationality is about maximizing global outcomes even if it requires locally dominated actions? If so, doesn't that break the link between rationality and instrumental efficiency at any given moment?'"

  **5. Symmetric Resoluteness (The Clash)**
  "Here's the scenario that keeps me up at night: Two resolute agents enter a Dollar Auction. Both have pre-committed to 'Never yield.' Sophisticated agents might coordinate or fold to minimize loss. Resolute agents seem locked into mutual disaster, bidding past the value of the dollar until bankruptcy. Does your theory imply that when two rational resolute agents meet, they are forced into a collision that sophisticated agents would avoid?"

  *   **Follow-up:** "If she says they would coordinate ex-ante: 'But in a one-shot anonymous auction, there is no ex-ante coordination. If resoluteness leads to strictly worse outcomes in symmetric conflicts, isn't it an evolutionarily unstable strategy?'"

  **6. New Information and Rigidity**
  "McClennen's view protects the plan against *temptation*, but what about *news*? Suppose at $t_0$ I plan to invest in a startup. At $t_1$, I learn the founder has committed fraud. A sophisticated chooser bails. Does a resolute chooser stick to the plan because it was optimal at $t_0$? If yes, the view seems absurdly rigid. If no, how do you distinguish 'news' from 'temptation' without using the very backward induction you reject?"

  *   **Follow-up:** "If she draws a line between preference changes and information updates: 'But in the Dollar Auction, the opponent's bid *is* new information. Why does that count as a temptation to deviate rather than a factual update that should modify the plan?'"

  **7. The Normative Force**
  "Why *ought* we be resolute? Is it because resolute agents get more money in the long run (instrumental), or because there's a deontic constraint on violating your own plans (procedural)? If it's instrumental, and there are cases where being sophisticated pays better (e.g., avoiding the auction entirely), is resoluteness only conditionally rational?"

  *   **Follow-up:** "If she says it's instrumental: 'Then isn't "Resolute Choice" just a heuristic for "Be the kind of agent who wins"? If so, why build a whole decision theory around it rather than just saying "Use whatever algorithm maximizes utility," which might switch between resolute and sophisticated depending on the game?'"

  **8. Regret and Agency**
  "When the resolute agent is at $t_1$, facing a local loss to honor the $t_0$ plan, do they experience regret? If they feel regret but act anyway, they seem divided against themselves. If they don't feel regret, they've somehow lobotomized their current utility function. How does the resolute agent maintain a unified sense of agency when their current self is being overruled by their past self?"

  *   **Follow-up:** "If she says the current self endorses the past self: 'Then aren't their preferences actually consistent? And if preferences are consistent, haven't you just redefined "sophisticated choice" to include whatever preferences the agent happens to have, making the distinction between resolute and sophisticated empty?'"

  **9. AI and Commitment Races**
  "Finally, the AI safety angle. There's a worry about 'commitment races,' where AIs pre-commit to aggressive threats to force concessions. If resolute choice is valid, it seems to validate making those threats binding. Does adopting resolute choice make the AI landscape more dangerous by encouraging systems that *cannot* back down? Should we be trying to build AIs that are *incapable* of resolute choice to ensure they can de-escalate?"

  *   **Follow-up:** "If she argues resolute AIs can cooperate better: 'But in a world of mixed agents, the resolute AI looks like a fanatic. If we can't guarantee everyone is resolute, doesn't installing this logic create a first-strike incentive? Is there a "meta-resoluteness" where you resolve not to be resolute in threat scenarios?'"
