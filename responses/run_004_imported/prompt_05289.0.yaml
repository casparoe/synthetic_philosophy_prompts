answer: |-
  Good morning. For those who don't know me, I'm [Your Name], her grandson.

  When my parents asked me to speak today, I was terrified. I'm sixteen. I've never stood up in front of thirty people to talk about death, let alone talk about a woman who spent the last twenty years of her life trying to convince her family that Friedrich Nietzsche was misunderstood.

  I was the only grandchild who ever sat through her Nietzsche talks without changing the subject. Usually, about ten minutes in, someone would ask about the potato salad, or the weather. But I stayed. I listened. And because I listened, I got to see something most people missed.

  To the world, and sometimes even to her own children, my grandmother looked like a woman of iron discipline. My parents always described her that way: "Disciplined." She wouldn't eat heavy food. She wouldn't drink wine, even on New Year's Eve. She vanished every winter to Arizona and every summer to the Colorado mountains.

  If you asked her why, she wouldn't talk about health. She would quote the "Why I Am So Clever" chapter of *Ecce Homo*. She told me that discipline sounded like denial, like saying "no" to things. But for her, it was about saying "yes." It was about vitality. She believed you shouldn't waste your energy on the wrong climate, or the wrong soup, or on sitting still for too long.

  She had a line she'd deliver while getting up to pace the room if a dinner guest sat too long after the meal was over. She'd say, "A sedentary life is a sin against the Holy Spirit." Then she'd start walking, expecting you to walk with her.

  To her old friends here today, I know that might have felt a little eccentric. You didn't come over for a lecture on German philosophy; you came for coffee and conversation. But I hope you know that her pacing wasn't a way to rush you out the door. It was her way of honoring you. She believed that life was movement. She wanted the energy in the room to stay alive, just like she kept herself alive.

  To my cousins, who know the references: Yes, she lived by the *Will to Power*. But not the way it sounds in a textbook. She didn't want power over us. She wanted power over her own decline. She wanted to squeeze every drop of vitality out of eighty-six years. She called Arizona and Colorado her personal Nice and Sils-Maria, but really, she was just chasing the sun so she could keep shining for us a little longer.

  There is a concept in Nietzsche called *Amor Fati*—the love of one's fate. It means not just bearing what happens to you, but loving it. Loving the winter, loving the summer, loving the end as much as the beginning.

  My grandmother loved her fate. She loved it enough to curate it, to protect it, and to pace around her living room to make sure it never stagnated.

  I am going to miss the talks. I am going to miss the way she could make a conversation about soup feel like a conversation about the soul. But mostly, I am going to miss the vitality. In a world where so many people are content to sit still, she reminded us that we are meant to move, to breathe, and to choose the things that make us feel most alive.

  She taught me that taking care of yourself isn't selfish. It's the only way you have enough to give to everyone else.

  So, Grandma, I won't sit still. I won't waste myself on the wrong climate. And I promise, I won't let the potato salad get too heavy.

  Rest in power.
