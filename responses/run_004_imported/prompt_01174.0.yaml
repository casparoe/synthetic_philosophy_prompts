prompt: |-
  Okay so I've fallen down a pretty deep rabbit hole the last few weeks reading old posts on the EA forum and lesswrong about this idea called "evidential cooperation in large worlds" (I think it used to be called "multiverse-wide superrationality" before that, some guy named Oesterheld came up with it around 2017?). The basic idea as I understand it is that the universe, or multiverse, is probably really big, maybe even infinite, so there's almost certainly a huge number of other reasoning agents out there who think basically the same way I do, even though I can never actually interact with them or find out what they decided. And the argument seems to be that because of that, if I treat it like I'm in some giant version of the twin prisoners dilemma with all these "copies" of me and act cooperatively — like actually taking other value systems seriously instead of just my own pet causes — thats evidence they're doing the same back, so somehow I end up better off acting nicer/more cooperative than plain self interest, or even normal altruism, would tell me to.

  I tried explaining this to my sister over dinner and she just gave me a look and changed the subject, so now I'm stuck chewing on it by myself lol. I sort of get the logic on the surface (kinda like Newcomb's problem, where you act as if your choice determines the correlated agent's choice even though theres no actual cause and effect happening) but I can't figure out what it would actually cash out to if someone really took it seriously. Like would it mean I'm supposed to give money/time to causes I personally think are kind of dumb, just because some version of me out there in the multiverse cares about them? Does it change how much I should compromise with actual people around me who have really different values, or is that a totally separate thing? And honestly — is this whole thing basically just a fancy multiverse-y version of "what if everyone did that," or is the reasoning actually doing something different under the hood? Can you walk me through what you think are the most important real-life implications of taking this idea seriously, for someone who's already kind of sympathetic to effective-altruism-style thinking but has no background in decision theory and isn't about to go read the original papers?
