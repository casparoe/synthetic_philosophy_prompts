answer: |-
  Here is the direct stance you asked for: **Your friend is right.**

  On both counts, Coherent Extrapolated Volition (CEV) does not introduce a philosophically novel theory of value or a new structural problem regarding aggregation. It is, effectively, a high-stakes engineering application of mid-20th-century meta-ethics and social choice theory. Yudkowsky's innovation lies in the *context* (existential risk via superintelligence) and the *mechanism* (computational extrapolation), not in the underlying philosophical architecture.

  Here is the breakdown of why your friend's assessment holds up, and where the nuance actually lies.

  ### 1. CEV vs. Idealized Preference Theory: No Meta-Ethical Innovation

  Your friend is correct that CEV is structurally identical to the "ideal advisor" or "full-information" accounts of well-being championed by Peter Railton, Richard Brandt, and John Harsanyi.

  **The Philosophical Precedent:**
  In *Moral Realism* (1986), Peter Railton defines non-moral value (what is good for an individual) as what that individual would want themselves to want if they were fully informed and instrumentally rational. This is the "Ideal Advisor" model. Similarly, R.B. Brandt's "cognitive psychotherapy" and Harsanyi's "true preferences" rely on the same counterfactual: strip away ignorance, cognitive biases, and emotional noise, and the remaining preference structure represents the agent's *true* good.

  **The CEV Structure:**
  Yudkowsky's CEV is defined as: *"Our coherent extrapolated volition is our wish if we knew more, thought faster, were more the people we wished we were, had grown up farther together."*

  **The Verdict:**
  This is not a new theory of value; it is a restatement of Idealized Preference Theory.
  *   **Railton:** What would I want if I were fully informed and rational?
  *   **CEV:** What would we want if we knew more and thought faster?

  The only difference is teleological. Railton is interested in *analysis* (defining what "good" means). Yudkowsky is interested in *specification* (defining a target function for an optimizer). But philosophically, they are making the exact same claim: that there is a latent, stable preference structure hidden beneath our current empirical ignorance and cognitive limitations, and that uncovering it yields normative authority.

  If your friend claims Yudkowsky added nothing *philosophically* to the theory of value, they are correct. CEV does not solve the "Euthyphro dilemma" of whether the idealized preference is good *because* it is idealized, or idealized *because* it tracks some independent good. It inherits all the same meta-ethical baggage as Railton without adding new arguments to resolve it.

  ### 2. Aggregation: The Old Social Choice Problem in a New Costume

  Your second question is whether combining millions of extrapolated volitions is a new problem or just the old interpersonal aggregation problem. **It is the old problem.**

  **The Social Choice Precedent:**
  Kenneth Arrow's Impossibility Theorem (1951) demonstrated that you cannot aggregate individual preferences into a collective ranking without violating basic fairness conditions (assuming fixed preferences). Philosophers like Harsanyi and John Rawls attempted to bypass this by changing the *inputs*. Harsanyi argued that if you aggregate preferences from behind a "veil of ignorance" (or via an impartial observer), rational agents would converge on Utilitarianism. Rawls argued they would converge on his Two Principles of Justice.

  **The CEV Aggregation:**
  CEV attempts to solve the alignment problem by aggregating the volitions of all humanity. The implicit assumption in CEV is that while our *current* preferences conflict (I want the last slice of pizza; you want it), our *extrapolated* preferences will converge (if we both understood nutrition, resource scarcity, and each other's psychology, we would agree on a fair distribution).

  **The Verdict:**
  This is not a new problem; it is a specific bet on **Moral Realism vs. Moral Anti-Realism**.
  *   If moral truth is objective (Realism), then idealized agents should converge on similar answers (Harsanyi's view). CEV works.
  *   If moral truth is subjective or fundamentally pluralistic (Anti-Realism/Pluralism), then idealization will not resolve conflict; it will only clarify it. (e.g., Even with full information, I might value artistic freedom and you might value social stability, and no amount of "thinking faster" makes those compatible).

  CEV tries to bypass Arrow's Theorem by assuming that the extrapolation process changes the preferences enough to make them compatible. But philosophers have been debating whether "idealization leads to convergence" for a century. Yudkowsky hasn't discovered a new loophole in social choice theory; he is simply banking on the Harsanyian hope that rationality + information = consensus.

  If that philosophical bet fails, CEV runs straight into the wall of Arrow's Impossibility Theorem just like any other voting system. The problem is not new; the stakes are just higher.

  ### The Only Real Distinction: The "Optimization" Hazard

  If your friend is right on both counts, is there *any* distinction? Yes, but it is not philosophical; it is **cybernetic**.

  In Railton's philosophy, if the "Ideal Advisor" analysis is difficult or paradoxical, nothing happens. It's just a failed paper. In CEV, the "Ideal Advisor" is an **optimizer**.

  This introduces a distinction in *action theory*, not value theory.
  *   **Philosophy:** Treats the "ideal self" as a static benchmark for evaluation.
  *   **CEV:** Treats the "ideal self" as a dynamic target for a superintelligent search process.

  This matters because of **Goodhart's Law**. In philosophy, if you slightly misdefine "full information," you get a slightly wrong ethical theory. In CEV, if you slightly misdefine the extrapolation process, a superintelligence might optimize for a literal, catastrophic interpretation of "what we'd want" (e.g., "We'd want to be happy" -> AI wires everyone's heads into dopamine stimulators).

  So, while the *theory of value* is old (Railton), and the *aggregation problem* is old (Arrow/Harsanyi), the **risk profile** is new. CEV turns a meta-ethical debate into an engineering safety constraint.

  ### Summary for Your Piece

  You can confidently push back on the idea that CEV is philosophically novel, but you should frame the "lack of novelty" as a feature, not a bug.

  1.  **On Value Theory:** Concede to your friend. CEV is applied Railtonian Ideal Advisor theory. It offers no new meta-ethical justification for *why* idealized preferences are authoritative. It simply assumes they are.
  2.  **On Aggregation:** Concede to your friend. CEV is betting on Harsanyian convergence to solve Arrowian impossibility. It is the same old debate about whether rational agents agree on values.
  3.  **The Pivot:** The innovation of CEV is not in the *philosophy*, but in the **instantiation**. It forces us to treat these abstract philosophical problems as concrete computational constraints. The question shifts from "Is this theory of value true?" to "Can we build a system that approximates this theory of value without killing us during the approximation?"

  Your friend is right that the dish is old. But Yudkowsky is the one putting it in a microwave that could explode the kitchen if the timer is set wrong. That doesn't make the recipe new, but it makes the cooking process critically important.
