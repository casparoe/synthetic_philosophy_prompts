prompt: |-
  I'm on my hospital's radiology practice committee and we're deadlocked. Right now every scan reaches the radiologist with the referring doctors note attached ('r/o PE', 'query fracture'), and a resident's informal audit found incidental findings get missed more often when the note points hard at one diagnosis. Some attendings want blinded first reads rolled out; others say the note is just doing the normal job of telling the radiologist where to look, and blinding it would tank sensitivity for whatever the scan was actually ordered for. The real disagreement underneath isn't 'bias exists, yes or no' -- it's whether the note changes what radiologists visually notice on the image, not just what they conclude from it, because if it's the former, no checklist or second-check is going to fix that. Draft the memo I'll bring to the committee -- keep, blind, or some staged/hybrid protocol, with a pilot timeframe -- that actually takes a position on that distinction instead of punting on it.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Hospital Radiology Practice Committee.
      *   **Problem:** Deadlock on whether to blind radiologists to clinical notes during initial image interpretation.
      *   **Core Conflict:**
          *   *Side A:* Blinded reads reduce satisfaction bias (tunnel vision) and catch incidental findings.
          *   *Side B:* Clinical notes guide attention and increase sensitivity for the primary indication; blinding tanks performance on the actual question asked.
      *   **Underlying Issue:** It's not just about *conclusion* bias (interpreting ambiguous data to fit the note), but *perceptual* bias (actually failing to *see* things because attention is directed elsewhere).
      *   **Task:** Draft a memo that takes a firm position on this distinction (perception vs. conclusion) and proposes a specific protocol (keep, blind, or hybrid) with a pilot timeframe.
      *   **Tone:** Professional, evidence-based, decisive, collaborative but firm on the cognitive science aspect.

  2.  **Determine the Stance:**
      *   The prompt asks me to "actually take a position on that distinction instead of punting on it."
      *   *Option 1 (Keep Status Quo):* Ignores the resident's audit and the cognitive science of inattentional blindness. Weak position given the prompt's framing.
      *   *Option 2 (Full Blinding):* Radical, likely to face massive pushback from referring clinicians and radiologists worried about missing the primary diagnosis. High risk of failure in implementation.
      *   *Option 3 (Hybrid/Staged):* Acknowledges the validity of both sides. Uses the "perception vs. conclusion" distinction to justify a specific workflow change. This is the most pragmatic and scientifically sound approach for a committee memo.
      *   *Decision:* I will advocate for a **Hybrid "Two-Pass" Protocol**. This directly addresses the perceptual bias concern (first pass blinded/limited info) while respecting the need for clinical context (second pass unblinded for final sign-out). This validates the "perception" argument: if you look without bias first, you see more. Then you apply context.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the deadlock but frame it around the cognitive science distinction (perception vs. interpretation).
      *   **The Core Argument (The "Why"):** This is the crucial part requested by the user. I need to explicitly state that clinical notes alter *visual search patterns*, not just diagnostic thresholds. Cite the concept of "Inattentional Blindness" or "Satisfaction of Search."
      *   **The Proposal (The "What"):** The Hybrid Protocol.
          *   *Phase 1:* Initial image review with *limited* or *no* clinical text (just body part/protocol).
          *   *Phase 2:* Unblinding for final integration and sign-out.
      *   **The Pilot (The "How"):** Needs a timeframe and metrics. 3 months. Measure incidental finding rates vs. turnaround time vs. discordance rates.
      *   **Addressing Concerns:** Pre-empt the "sensitivity will drop" argument. Explain that the second pass mitigates this.
      *   **Call to Action:** Vote/Approval request.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Critique:* Is full blinding in Phase 1 feasible in modern PACS?
      *   *Adjustment:* It might be technically hard to completely hide the note in some systems. I should phrase it as "Initial Interpretation Phase" where the radiologist consciously disregards the note or the system hides it if possible. Let's assume for the memo that PACS configuration can support a "Blinded View."
      *   *Critique:* Will referring physicians hate this?
      *   *Adjustment:* Emphasize that the *final report* still incorporates the clinical question. The goal is better overall patient safety, not ignoring the referral reason.
      *   *Key Distinction:* Make sure I don't sound like I'm saying "Radiologists are bad." I need to frame it as "Human vision is susceptible to top-down processing effects."

  5.  **Drafting the Content (incorporating the "Perception" distinction):**
      *   *Phrase to include:* "Top-down modulation of visual search."
      *   *Phrase to include:* "Satisfaction of Search error."
      *   *Phrase to include:* "Perceptual set."
      *   *Protocol Name:* "Sequential Context Protocol."

  6.  **Final Review against Constraints:**
      *   Takes a position? Yes (Hybrid).
      *   Addresses perception vs. conclusion? Yes, explicitly.
      *   Includes pilot timeframe? Yes (90 days).
      *   Tone appropriate for committee? Yes, formal but decisive.

  7.  **Final Polish:** Check for clarity, brevity, and impact. (The resulting memo below follows this structure.)

  *(Self-Correction during drafting)*: I need to make sure I don't sound *too* academic. This is a hospital committee. Keep the cognitive science practical. Focus on patient safety and liability (missed incidentalomas).

  *(Final Plan)*:
  1. Header.
  2. Executive Summary (The Recommendation).
  3. The Cognitive Reality (The Perception Argument).
  4. The Proposed Protocol (Sequential Context).
  5. Pilot Metrics.
  6. Next Steps.

