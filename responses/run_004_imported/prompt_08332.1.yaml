answer: |-
  **MEMORANDUM**

  **TO:** Radiology Practice Committee
  **FROM:** [Your Name/Title]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Pilot: Sequential Context Protocol to Mitigate Perceptual Bias

  **Executive Summary**
  We are currently deadlocked on whether clinical notes should be visible during initial image interpretation. The prevailing compromise—that we can simply "be more careful" or rely on checklists to counteract bias—is scientifically unsound. 

  This memo recommends the immediate adoption of a **90-day pilot of a "Sequential Context" (Hybrid) Protocol**. This protocol mandates an initial blinded review of images prior to revealing the clinical indication. 

  This recommendation is not based on the assumption that radiologists interpret ambiguous data differently when biased (conclusion bias). It is based on the stronger, more critical evidence that clinical notes alter **visual search patterns and perceptual sensitivity** (perceptual bias). If the note directs the eye, the unmentioned pathology is not just misinterpreted; it is often never visually registered. Checklists cannot fix what the eye fails to scan.

  **The Core Distinction: Perception vs. Conclusion**
  The committee's debate has treated the clinical note as a factor that influences *diagnostic reasoning* (e.g., "Is this shadow a nodule or a vessel?"). If this were the only risk, a second check or checklist would suffice.

  However, the resident's audit and cognitive science literature suggest the risk is **pre-conscious**. When a radiologist reads "r/o PE," their visual cortex prioritizes the pulmonary arteries. This "top-down modulation" suppresses the neural processing of unrelated regions. This is **Inattentional Blindness**. 
  *   **Status Quo:** The note acts as a spotlight. We see the indicated pathology well, but the periphery goes dark.
  *   **Blinded Read:** The spotlight is off. We scan the whole room.
  *   **The Hybrid Solution:** We scan the whole room first (blinded), then turn the spotlight on to verify the specific clinical question (unblinded).

  **Proposed Protocol: Sequential Context Workflow**
  We will not implement full blinding for final sign-out, as clinical correlation is vital for the final report. Instead, we will separate the **Visual Search** from the **Clinical Integration**.

  1.  **Phase 1 (Blinded Search):** Upon loading a study, the PACS interface will initially mask the clinical history/note. The radiologist performs the primary visual sweep and dictates initial findings *before* unmasking the note.
  2.  **Phase 2 (Contextual Integration):** The clinical note is revealed. The radiologist reviews the "Blinded Findings" against the clinical question. They may add to the impression based on the history, but they cannot retract a finding observed in Phase 1.
  3.  **Exceptions:** Trauma, stroke codes, and pediatric cases where history is critical for protocoling/safety will remain exempt.

  **Pilot Parameters (90 Days)**
  We will run this pilot in the General Radiology and Chest CT divisions, where incidental finding rates are highest.

  *   **Start Date:** [Date]
  *   **End Date:** [Date + 90 Days]
  *   **Success Metrics:**
      1.  **Incidental Finding Rate:** Comparison of clinically significant incidentalomas (e.g., lung nodules, adrenal masses) detected per 100 scans vs. the previous 90-day baseline.
      2.  **Discordance Rate:** Tracking instances where Phase 1 findings were erroneously discarded in Phase 2 due to clinical bias (to be caught via random QA audit).
      3.  **Turnaround Time (TAT):** Monitoring for workflow friction. We anticipate a negligible increase (approx. 30-60 seconds per case).

  **Addressing Sensitivity Concerns**
  Attendings concerned that blinding will reduce sensitivity for the *primary* indication should note: Phase 2 restores the clinical context before sign-out. If the PE is there, the blinded search should still catch it (as it is a high-contrast target), and the unblinded review confirms it. We are not removing the question; we are delaying it until after the visual sweep is complete.

  **Recommendation**
  We cannot checklist our way out of a biological limitation of human vision. If we acknowledge that the note changes *what is seen*, not just *what is thought*, the Status Quo is a patient safety liability.

  I move that the committee approve the Sequential Context Pilot as outlined above, with a review of data scheduled for [Date + 100 Days].

  **Approval Required:**
  [ ] Approve Pilot
  [ ] Reject Pilot
  [ ] Table for Further Review
