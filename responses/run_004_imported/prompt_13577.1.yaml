          *   *Natural:* Possibilities.
          *   *Middle:* The "What Ifs." This is the romantic hook.
          *   *Free:* The "What Is."
      *   **Applying to Danny & Priya:**
          *   God didn't force them. They aren't robots.
          *   God knew what they *would* freely choose.
          *   This validates their agency (important for the bride and the philosophy).
      *   **The Grounding Objection (Nod to the PhD):**
          *   Danny is writing a dissertation on why this works.
          *   Joke: "I won't solve the grounding objection tonight, but I will ground this toast in champagne."
          *   Metaphor: The truth of their love grounds the theory.
      *   **Conclusion:** The toast itself. Blessing the future (Free Knowledge).

  5.  **Refining the Tone:**
      *   *Check:* Is it too academic? *Fix:* Simplify the definitions. Use analogies.
      *   *Check:* Is it too religious? *Fix:* Keep it focused on the love story.
      *   *Check:* Is it offensive to the Calvinists? *Fix:* Emphasize God's providence in selecting the world, just not via coercion.
      *   *Check:* Is it offensive to the Philosophers? *Fix:* Ensure "counterfactuals of creaturely freedom" is used correctly. Don't imply God determines the will.

  6.  **Drafting - Specific Phrasing (Mental Walkthrough):**
