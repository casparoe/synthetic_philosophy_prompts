      *   *Flaw:* This assumes a specific prior distribution over $N$ (usually a scale-invariant or uniform prior over log $N$) and ignores *why* the app grew to 10k. It treats the observation as purely random sampling without considering the *probability of reaching 10k in the first place*.

  4.  **Evaluate the ML Friend's Logic (SIA / Bayesian Update):**
