      *   *Accuracy:* Ensure Fricker's distinction between *incidental* and *systematic* testimonial injustice is clear, though maybe too technical for this summary. Stick to the core concept of the *virtue*.
      *   *Alternative Theories:* Briefly mention that other philosophers (like Medina or Dotson) might have different takes, but stick primarily to Fricker since the user asked about her. (Decided to keep it focused on Fricker to avoid confusion, but maybe hint that the debate is ongoing).
      *   *Legal Reality:* Acknowledge that the legal system *tries* to address this via rules of evidence (e.g., rape shield laws, expert witnesses on trauma) but the human element in deliberation is where Fricker's virtue is needed.

