prompt: |-
  ok so in my metaethics seminar we've now done the classic frege-geach example like four separate times -- "lying is wrong, if lying is wrong then getting your little brother to lie is wrong, so..." -- and i could recite the modus ponens version in my sleep at this point. but one of the readings (i think it was Dreier, could be misremembering) made the point that negation is actually a nastier problem for expressivists than the conditional ever was, since its not obvious what attitude "x is not wrong" even expresses -- is it just NOT booing x, which sounds more like indifference than genuinely thinking x is fine? can you write me a dialogue between a gibbard/blackburn-style expressivist and a critic who presses exactly that negation problem instead of the conditional one (we've beaten that one to death in class already)? both of them need to actually be good at this -- i don't want the expressivist folding in three lines, since real philosophers still defend this stuff, so make the critic earn every point too.
