answer: |-
  **Setting:** *A university coffee shop, immediately following the metaethics seminar. The whiteboard in the classroom still has the schema for Modus Ponens on it. Ella (Expressivist/Quasi-Realist) and Carl (Moral Realist/Critic) are nursing lukewarm lattes.*

  **Carl:** I have to say, I'm glad the professor finally let the Frege-Geach point rest. We've run that *modus ponens* drill into the ground. "If lying is wrong, then getting your brother to lie is wrong..." I could argue that in my sleep.

  **Ella:** *[Smiling]* Don't get too comfortable. If you think the conditional was the boss fight, you haven't met the secret level. The conditional is about embedding. The real headache is negation.

  **Carl:** Exactly. That's where I wanted to push. Dreier made this point in the reading, and I think it's stickier than Geach. Here's the issue: For you, "Lying is wrong" expresses a conative attitude. Let's call it *disapproval*. So, what does "Lying is *not* wrong" express?

  **Ella:** Standard move: It expresses the absence of that disapproval.

  **Carl:** See, that's the trap. If I say, "I don't disapprove of lying," that sounds like indifference. It sounds like I'm shrugging. But when a moral agent says, "Lying is not wrong," they aren't usually indifferent. They're making a positive normative claim. They're saying lying is *permissible*. They are *for* allowing it. If your theory reduces "not wrong" to "not booing," you lose the normative force of permission. You turn a moral judgment into a report of emotional silence.

  **Ella:** Okay, but that's a caricature of the expressivist position. We aren't behaviorists. It's not about the audible "boo." It's about the practical stance. When I say "Lying is not wrong," I am expressing my acceptance of a norm that permits lying. In Gibbard's terms, I'm ruling out guilt or blame for the act.

  **Carl:** But now you've shifted the goalposts. "Ruling out blame" is itself a positive attitude. So, is "not wrong" the absence of disapproval, or is it the presence of a permission-granting attitude?

  **Ella:** Why can't it be both? To accept a norm that permits X *just is* to withhold the sanction of blame for X.

  **Carl:** Because logic demands a contradiction, and psychology demands distinct states. If "Wrong" is State A (Disapproval), then "Not Wrong" needs to be a state that is inconsistent with State A. If State B is just "Not being in State A," that's not a state. That's nothing. You can't have a logical conflict between having an attitude and *not* having an attitude. I can disapprove of lying, and you can fail to disapprove of lying. We don't contradict each other; we're just different. But if I say "Lying is wrong" and you say "Lying is not wrong," we *are* contradicting each other.

  **Ella:** This is where Quasi-Realism earns its keep. We aren't trying to map moral logic onto psychological states one-to-one in a crude way. We're trying to explain how, starting with these practical attitudes, we can *earn the right* to talk as if there are truth-conditions and contradictions. The contradiction isn't in the world; it's in the practical deliberation. I cannot simultaneously plan to blame you for lying and plan not to blame you for lying. That is a practical inconsistency.

  **Carl:** That works for *me* contradicting *myself*. But it doesn't solve the negation problem for *content*. Look, let's look at the operator. In standard logic, $\neg P$ is true if and only if $P$ is false. For the cognitivist, "Not wrong" is true if the property of wrongness is not instantiated. Easy. For you, what is the semantic value of "not"?
  If I say, "It is not the case that lying is wrong," that's external negation.
  If I say, "Lying is not-wrong," that's internal negation.
  Dreier's point is that expressivists struggle to distinguish these. If "wrong" is an attitude, "not wrong" looks like the absence of an attitude. But "It is not the case that I have an attitude" is a description of my psychology, not a moral judgment.

  **Ella:** But we don't treat moral judgments as descriptions of psychology. That's the subjectivist error we avoid. When I say "Lying is not wrong," I'm not reporting that I lack an attitude. I'm *expressing* a stance of tolerance.

  **Carl:** Okay, let's grant you tolerance as a positive stance. So now you have two attitudes: Disapproval (Wrong) and Tolerance (Not Wrong).
  Here's the killer: What about "Lying is not permissible"?
  If "Permissible" means "Not Wrong," then "Not Permissible" means "Not (Not Wrong)." Double negation.
  For the cognitivist, $\neg(\neg P)$ brings you back to $P$. "Not permissible" = "Wrong."
  For you, if "Wrong" is Disapproval, and "Permissible" is Tolerance... what is "Not Permissible"? Is it the absence of Tolerance?
  If I lack tolerance, am I necessarily disapproving? Or am I just confused? Or undecided?
  If "Not Permissible" just means "I don't tolerate this," you haven't necessarily gotten back to "I disapprove of this." You've lost the logical equivalence. $\neg(\neg \text{Wrong})$ should equal $\text{Wrong}$. But $\text{Absence}(\text{Absence}(\text{Disapproval}))$ is just... having Disapproval? It's messy. You're trying to build classical logic out of psychological states that don't obey bivalence.

  **Ella:** That's Schroeder's worry, isn't it? The "Being For" problem. Look, Carl, you're assuming that the logical relations have to be grounded in the *content* of the states in the same way beliefs are. But for expressivists, the logical relations are grounded in the *inconsistency* of the states.
  We define the negation operator by what it *does*. To accept $\neg P$ is to hold an attitude that is inconsistent with holding the attitude for $P$.
  So, if "Wrong" is disapproval, "Not Wrong" is an attitude inconsistent with disapproval. Let's call it *acceptance*.
  Then "Not (Not Wrong)" is an attitude inconsistent with *acceptance*. Which brings us back to disapproval.
  We stipulate the inconsistency relations to mirror classical logic.

  **Carl:** But *why* are they inconsistent? With beliefs, it's obvious. You can't believe $P$ and believe $\neg P$ because the world can't be both ways. That's the nature of belief.
  With attitudes, what stops me from disapproving of lying *and* accepting a norm that permits it? I might be weak-willed. I might be conflicted. I might think lying is wrong but that you shouldn't be blamed for it because of your upbringing.
  If the inconsistency isn't built into the *nature* of the states themselves, you're just asserting it by fiat. You're saying, "Logic works this way because we decided our attitudes should play along." But that makes logic normative for attitudes, rather than descriptive of their structure. You're smuggling in a realist logic to save an anti-realist ontology.

  **Ella:** I wouldn't say "by fiat." I'd say it's constitutive of what it means to be a moral agent. To deliberate morally *just is* to treat these attitudes as contradictory. If I treat "Wrong" and "Not Wrong" as compatible, I'm not failing at logic; I'm failing at morality. I'm confused about what I'm doing.
  The Quasi-Realist project is to show that we can construct a "logic of attitudes" that is isomorphic to the logic of propositions. We don't need the metaphysical baggage of moral properties to explain why "Lying is wrong" and "Lying is not wrong" clash. The clash is in the planning. I cannot plan to blame you and plan not to blame you.

  **Carl:** But that reduces moral disagreement to a clash of plans. If I say "Lying is wrong" and you say "Lying is not wrong," on your view, we aren't disagreeing about a fact. We're just like two people trying to walk through a door in opposite directions.
  The negation problem highlights that "Not Wrong" feels like a *claim about the action*, not a *claim about my plans*.
  When I say, "Eating meat is not wrong," I'm not just saying, "I won't blame you." I'm saying, "There is no reason to blame you." I'm pointing to a feature of the act—its lack of wrong-making properties.
  Your "absence of attitude" or even your "positive tolerance" feels like it's still about *us*. The negation in moral language functions to deny a property, not to report a psychological shift. If you can't explain what property is being denied, you haven't explained negation. You've just explained how we avoid psychological conflict.

  **Ella:** But that's the whole point! There *is* no property. The "feature of the act" is a projection of our stance.
  Look, take the Indifference Objection you started with. You said "Not Wrong" can't be "No Boo" because that's indifference.
  But consider this: Indifference is failing to have an attitude. Permission is *having* an attitude of allowing.
  The expressivist distinguishes these.
  "I have no attitude toward lying" = Indifference.
  "I have an attitude of permitting lying" = Not Wrong.
  Both are non-cognitive. Neither posits a property. The difference is in the complexity of the normative system I've adopted.
  So I *can* handle the negation. "Not wrong" is not the absence of an attitude; it's the presence of a permissive attitude.

  **Carl:** Okay, fine. Let's grant that. Now we have Disapproval (Wrong) and Permission (Not Wrong).
  Are these contraries or contradictories?
  If they are contraries, both can be false. (Maybe I'm undecided).
  If they are contradictories, one must be true.
  In classical logic, $P$ and $\neg P$ are contradictories.
  If "Wrong" and "Not Wrong" are just two different positive attitudes, what forces them to be contradictories? Why can't I have a third attitude? "I'm not sure if it's wrong or permissible."
  For the realist, "I'm not sure" is a state of belief about a property that either exists or doesn't.
  For you, if "Wrong" is Attitude 1 and "Not Wrong" is Attitude 2... "Undecided" is Attitude 3.
  But logic says there is no Attitude 3. There is only $P$ or $\neg P$.
  You're trying to force a tripartite psychology (Disapprove, Permit, Undecided) into a bipartite logic (True, False).
  The negation operator in language demands bivalence. Your psychology is trivalent. Where does the bivalence come from if not from the world?

  **Ella:** *[Pauses, stirs coffee]* It comes from the commitment. To engage in moral discourse is to commit to the bivalence. If I say, "I'm undecided," I'm effectively saying, "I haven't yet adopted a stance." But the *question* itself—"Is it wrong or not?"—presupposes that a stance must be taken.
  The logic isn't found in the psychology; it's imposed by the practice. We *make* them contradictories by treating them as such in deliberation.
  You're asking for a metaphysical guarantee of bivalence. I'm offering a pragmatic one. We treat them as contradictories because if we didn't, moral deliberation would collapse.

  **Carl:** So logic is a pragmatic necessity for deliberation?

  **Ella:** Logic is the structure of consistent planning.

  **Carl:** *[Leans back]* That's a bold move. You're saving expressivism from the negation problem by making logic itself a kind of normative tool for agents, rather than a law of truth.
  But then you have to explain why *your* logic matches *ours*. Why does the "logic of planning" perfectly mirror the "logic of propositions"? Why does Modus Tollens work for attitudes?
  If you say "Because we built it that way," the critic says, "Then it's a game, not a description of moral thought."
  If you say "Because it has to be that way to function," the critic says, "Then you've admitted that moral thought *aims* at truth, which is my point."

  **Ella:** *[Smiles]* And there we are. You think that aiming at truth requires truth-bearers. I think we can aim at truth without the metaphysical baggage.
  The negation problem shows that "Not Wrong" is harder to parse than "If Wrong." I'll grant you that. It requires a richer theory of attitudes than just "Boo/Hurrah." It needs Gibbard's norm-acceptance or Blackburn's higher-order attitudes.
  But does it break the view? No. It just forces us to be more sophisticated about what an "attitude" is. It's not a gut feeling. It's a commitment to a system of norms.
  In that system, "Not Wrong" has a defined role. It blocks blame. It licenses the act.
  Does it perfectly map to "The property of wrongness is absent"? No.
  But does it allow us to say everything we need to say in moral practice without invoking spooky properties? Yes.

  **Carl:** I suppose. But every time you patch a hole in the boat—conditionals, negation, modal operators—you add more weight. "Higher-order attitudes," "Norm-acceptance," "Practical inconsistency."
  At some point, the boat is so patched up with realist-sounding planks that I have to ask: why not just admit there's water in the hull? Why not just say there *are* moral properties?
  If "Not Wrong" functions exactly like "The absence of a property," and "Wrong" functions exactly like "The presence of a property," and the logic is identical... what are you saving? What work is the "Expressivism" label doing at this point?

  **Ella:** *[Takes a sip]* Naturalism, Carl. I'm saving naturalism. I don't need to posit a queer property of "wrongness" floating around the universe. I just need humans with complex planning psychologies.
  The negation problem is real. It's nasty. But I'd rather struggle to explain negation in terms of human psychology than struggle to explain how humans detect non-natural properties.
  You have an easy time with negation because you have a mysterious ontology. I have a clear ontology, so I have a hard time with negation.
  I'll take that trade.

  **Carl:** *[Chuckles]* Fair enough. I'll see you next week. We're doing Modal Realism.

  **Ella:** Oh god. Don't get me started on "Possible Worlds."

  **Carl:** Don't worry. I hear the negation problem there is even worse.

  *[They gather their bags, the whiteboard in the classroom behind them still bearing the scars of the Frege-Geach battle.]*
