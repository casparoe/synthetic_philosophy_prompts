      *   **James:** Truth is what works. It's verified in experience. Truth *happens* to an idea. It has "cash value." Religious belief example (will to believe).
      *   **The Clash:** Is truth a destination (Peirce) or a journey/tool (James)? Is James's view too subjective? Is Peirce's view too distant to matter?
