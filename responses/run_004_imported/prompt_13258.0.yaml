answer: |-
  **Title:** The Limit and the Cash-Value
  **Characters:**
  *   **C.S. (Charles Sanders Peirce):** A logician and scientist. Precise, gruff, obsessed with method and the long run.
  *   **W.J. (William James):** A psychologist and philosopher. Warm, energetic, obsessed with lived experience and the immediate present.

  **Setting:** A dimly lit study in Cambridge, circa 1905. Smoke hangs in the air. Two armchairs face each other across a cluttered table.

  ***

  **C.S.:** You've made a mess of it, William. I'll be plain. I coined the principle. I laid the groundwork. And now, when people hear "pragmatism," they don't think of the logical maxim of clarification; they think of… well, *your* version. It's become a byword for expediency. That is why I have been forced to rename my own doctrine "Pragmaticism." It is ugly, yes. But it is safe from kidnappers.

  **W.J.:** (Chuckling, leaning forward) Kidnappers, Charlie? Or collaborators? You look at the principle as a definition of meaning; I look at it as a theory of truth. Surely there's room in the house for both of us. I'm just taking your tool and showing people how to *live* with it.

  **C.S.:** Living is one thing. Truth is another. You speak of truth as if it were a currency to be spent. "Cash-value," you call it. An idea is true if it pays dividends in experience. But dividends for whom? And when? If I believe the universe is friendly, and that belief comforts me, does that make it *true*?

  **W.J.:** If that belief leads you through life with more courage, connects you better with your neighbors, and helps you navigate difficulties without collapsing into despair—then yes, in a very real sense, it *is* true. Truth isn't a static property hanging on a wall, Charlie. It *happens* to an idea. It becomes true, is made true by events. Verification is a process.

  **C.S.:** And there lies the rot. You've collapsed truth into individual utility. If truth is just what "works" for you in your stream of consciousness, then I can have my truth and you can have yours. We could both be "right" while contradicting each other, provided our respective beliefs make us feel warm. That isn't truth; that's psychology. Truth must be independent of what you or I happen to think. It must be the opinion that is *fated* to be agreed upon by all who investigate.

  **W.J.:** Fated? By whom? God? You talk about the "final settled belief" of the community of investigators. You talk about the limit of inquiry as if it were a horizon we are marching toward. But Charlie, none of us will ever reach that horizon. We die. The inquiry stops. If truth is only what we would agree on at the end of infinite time, then truth is, for all practical purposes, useless to the living. It's a idol on a distant shore. I'm talking about the boat that keeps us afloat *now*.

  **C.S.:** It is not useless! It is the only thing that saves us from the caprice of the individual. By positing a reality that exists independently of our vagaries, a reality that will eventually force itself upon the community of inquirers, we establish a standard. Without that ideal limit, your "cash-value" is just a check written on a bank that doesn't exist. You say truth *happens*. I say truth *converges*. If you drop a stone, it falls. Not because it "works" for the stone to fall, but because gravitation is a real law that will compel the agreement of every physicist who studies it, forever.

  **W.J.:** But the stone falling is exactly my point! The "truth" of gravity is in the experience of the fall, the prediction met, the bridge that doesn't collapse. That is the cash-value. You say I'm a relativist, but I'm not saying *any* belief works. I'm saying a belief is true if it guides us *through* the sensible order of experience without contradiction. If I believe I can walk on water, the water resists me. That resistance is reality checking my truth-claim. I'm not ignoring reality, Charlie. I'm saying reality is only real to us insofar as it kicks back against our expectations.

  **C.S.:** The kick is real. The expectation is not. You are conflating the *verification* of a truth with the *nature* of truth. Yes, we verify ideas through experience. I agree. But the *truth* of the idea is that it corresponds to the state of affairs that would be recognized in the long run. You are focusing on the moment of satisfaction when a problem is solved. I am focusing on the stability of the solution itself. Your version allows a belief to be "true" today because it works, and "false" tomorrow because it stops working. That makes truth mutable.

  **W.J.:** Why shouldn't it be mutable? The world is mutable! We are in a pluralistic universe, not a block of absolute steel. If a new experience comes along that my old truth can't assimilate, I have to modify the truth. That's not instability; that's growth. Your "final opinion" sounds suspiciously like the Absolute you claim to reject. It's a God's-eye view. I'm offering a human-eye view. Is it better to have a truth that is perfect but unreachable, or a truth that is imperfect but walkable?

  **C.S.:** It is better to have a compass that points North, even if we never reach the Pole. If you tell the navigator that "North is wherever the ship feels safest," he will run aground. Your human-eye view is myopic. Consider science. When a chemist posits an atomic structure, he does not care if believing in atoms makes him feel courageous or helps him sleep at night. He cares if the model predicts reactions consistently for *everyone*, everywhere, regardless of their personal "stream of experience."

  **W.J.:** But why does he care? Because that model has more cash-value! It pays better dividends in prediction and control than the alchemist's model. The scientist chooses the atomic theory because it works *better*, not because he has glimpsed the end of time. You say I'm subjective, but "working better" is an objective test within the context of human needs. We aren't talking about whims. We are talking about what successfully marries the old stock of truths to the new experience.

  **C.S.:** (Pauses, tapping his pipe) So, you argue that "working better" is a proxy for the convergence I speak of?

  **W.J.:** I argue that "convergence" is an abstraction derived from countless instances of things "working." You take the successful verifications, project them to infinity, and call that Truth. I stay with the verifications.

  **C.S.:** Then we are not as far apart as I feared, but the distance remains critical. You treat the long-run convergence as a metaphor. I treat it as a logical necessity. Without the assumption that there *is* a real answer to be found, inquiry loses its normative force. If truth is just "what works now," why should I bother correcting your error? If your error works for you, let it be.

  **W.J.:** Because your error might not work for *me*, or for us together! Truth is social, Charlie. I never said it was solipsistic. A belief has to work for the whole web of relations. If your belief contradicts mine, we have a genuine option that must be fought out in experience. We don't need to wait for the end of time to know that slavery is "false." We know it now because it creates a society that cannot sustain itself without violence and contradiction. It doesn't "work" in the deep human sense.

  **C.S.:** (Nods slowly) You appeal to the sustainability of the community. That is closer to my "community of investigators." But you ground it in *sustainability*, in moral utility. I ground it in *representation*. The truth represents the real. The real is that which is what it is regardless of what anyone thinks.

  **W.J.:** But how do you access "the real" except through what thinks it? You can't step outside your own skin to check if your idea matches the thing-in-itself. You can only check if your idea leads you where you expect to go. That leading *is* the truth.

  **C.S.:** Then let me pose the final objection. If I am dying, and I hold a belief that comforts me, but which has no evidence and will never be tested by anyone after I am gone... is it true? By your account, if it guides me peacefully to the end, it has cash-value. By my account, it is mere opinion, because it cannot enter the public process of inquiry.

  **W.J.:** (Softly) In that specific case... yes. For you, in that moment, it is true. Because truth is a part of life, not a judge standing outside of it. If a belief brings a man into a richer relation with his existence, who are we to strip it from him in the name of a "final opinion" he will never live to see?

  **C.S.:** And that is why I must call my view Pragmaticism. Because I cannot afford the moral risk of your definition. I would rather a man die with a false comfort than live with the notion that comfort constitutes truth. The distinction must be preserved, even if it is painful.

  **W.J.:** And I would rather a man live with a truth that breathes than worship a truth that is cold as a corpse. Perhaps... perhaps you are describing the destination, and I am describing the walking.

  **C.S.:** Perhaps. But if you forget the destination, you will walk in circles and call it progress.

  **W.J.:** And if you stare only at the destination, you will trip over the stones at your feet and never move at all.

  *(C.S. strikes a match to relight his pipe. The flare illuminates their faces briefly—C.S. stern, W.J. smiling—before the study returns to the dim glow of the fire.)*

  **C.S.:** Then we shall walk. But I will keep my map.

  **W.J.:** And I will keep my boots.

  *(Fade out.)*
