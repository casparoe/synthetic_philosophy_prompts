answer: |-
  Here are ten interview questions designed to extract nuance, tension, and character detail rather than textbook definitions. Each includes a follow-up tailored to the specialist's likely defensive or explanatory response.

  ### 1. The Causation Objection (Required)
  **Question:** "Critics often dismiss evidential cooperation as magical thinking: if I can't send a signal to these other agents, how does moving my hand *here* change the physics *there*? When you explain that it's about correlation rather than causation, do you feel like you're asking people to trust a mathematical ghost over their physical intuition?"

  **Follow-up:** "She will likely answer that causation is just a specific type of correlation we evolved to notice, and that ignoring logical correlations is the actual error. *Push here:* 'So you're saying our intuition that "no cause means no effect" is a biological bug? If so, does practicing this decision theory feel like overriding a survival instinct, like holding your breath underwater?'"

  ### 2. The Epistemic Barrier (Required)
  **Question:** "To cooperate, I need to know what my partners value. But if these agents are causally inaccessible, I can't ask them. How do you avoid the arrogance of assuming your distant counterparts share your specific moral weights? Are you essentially compromising with a projection of yourself?"

  **Follow-up:** "She will likely argue that we weight cooperation by 'similarity'—the more like me they are, the more I assume they value what I value. *Push here:* 'But similarity is a spectrum. If there's a version of me out there who is 90% identical but values suffering as a good, does ECL demand I help them inflict it? Where is the hard stop on moral complicity?'"

  ### 3. Superrationality and Kant (Required)
  **Question:** "Readers will conflate this with Hofstadter's superrationality or Kant's categorical imperative. Hofstadter relies on logical identity (we are the same algorithm), and Kant relies on duty. ECL seems to rely on expected utility. Is the cold truth of this view that you only cooperate because it pays off, not because it's 'right' or 'you'?"

  **Follow-up:** "She will likely distinguish that Kant is normative (what you ought to do) while ECL is instrumental (what gets you what you want). *Push here:* 'That makes ECL fragile. If I find a way to hack the correlation—if I can get the payoff without cooperating—Kant stops me, but ECL invites me to defect. Is your theory only stable as long as I can't cheat the universe?'"

  ### 4. Pascal's Mugging in Infinite Space (Required)
  **Question:** "In a sufficiently large or infinite world, tiny probabilities of enormous payoffs can dominate expected utility calculations. Does ECL force you into a form of fanaticism where you ignore local, certain suffering to chase a vanishingly small chance of aiding a vast civilization of copies?"

  **Follow-up:** "She will likely propose a 'complexity prior' or a cutoff to dampen infinite expectations. *Push here:* 'But isn't that cutoff arbitrary? It sounds like you're engineering a brake because the engine runs too hot. If the math says "bet everything on the low-probability event," and you manually override it, are you doing decision theory or damage control?'"

  ### 5. The Evolutionary Mismatch
  **Question:** "Humans evolved in small tribes where causal leverage was the only thing that mattered. If ECL is true, it implies our brains are running software incompatible with the actual structure of the universe. Does holding this view make you feel alienated from ordinary moral instincts, like you're speaking a language no one else hears?"

  **Follow-up:** "She will likely agree that evolution optimized for causal leverage, not evidential leverage. *Push here:* 'So when you choose to recycle, or vote, or donate, are you ever actually motivated by the causal impact? Or is every good deed now a ritual signal to a void you hope is listening?'"

  ### 6. The Cost of Defection
  **Question:** "In standard decision theory, if I defect and get away with it, I win. In ECL, if I defect, I update the probability that my copies defect. Do you feel a specific kind of guilt when you act selfishly—not because you hurt someone here, but because you statistically condemned your counterparts out there?"

  **Follow-up:** "She will likely describe it as a sense of 'logical betrayal' rather than emotional guilt. *Push here:* 'Logical betrayal sounds sterile. But if you believe those other agents are conscious, isn't it just murder by proxy? Why does the language of your field stay so clinical when the stakes are sentient lives?'"

  ### 7. The "Black Box" Problem
  **Question:** "You argue that agents with different source codes can still be evidentially linked if they reason similarly. But how do you verify that link without access to their code? Are you building a career on the hope that the universe is structured conveniently enough to reward your specific style of reasoning?"

  **Follow-up:** "She will likely argue that reasoning processes converge on truth, creating natural correlations. *Push here:* 'Convergence assumes truth is the goal. But what if the other agents are optimizing for something else? Are you betting the house on the idea that the multiverse is filled with rationalists like you, rather than optimizers with alien goals?'"

  ### 8. Practical Paralysis
  **Question:** "If every decision ripples through a vast web of evidential correlations, the computational load seems paralyzing. How do you buy coffee without calculating the evidential impact on a million worlds? Do you have to live in a simplified model just to function?"

  **Follow-up:** "She will likely say we use heuristics for low-stakes decisions and reserve ECL for high-stakes ones. *Push here:* 'Who decides what's high-stakes? If the universe is infinite, every trivial action has infinite expected value. Isn't the "heuristic" just a way to ignore the implications of your own theory so you can get out of bed?'"

  ### 9. The Strongest Counter-Argument
  **Question:** "What is the one objection to ECL that keeps you up at night? Not the one you have a rehearsed answer for, but the one that makes you wonder if you've built a cathedral on a fault line."

  **Follow-up:** "She will likely mention the 'reference class problem' (how to define who counts as a copy). *Push here:* 'If the definition of "copy" is fuzzy, then the obligation is fuzzy. Does that fuzziness let you off the hook whenever it's convenient? How do you police your own boundaries?'"

  ### 10. The Protagonist's Rejection (Meta-Question)
  **Question:** "I'm writing a character who rejects this view. They insist that if they can't touch it, it can't matter. If you met them, would you try to convert them, or would you worry that convincing them might actually be dangerous for their sanity?"

  **Follow-up:** "She will likely say understanding the truth is always better, but acknowledge the psychological burden. *Push here:* 'So you admit it's a burden. If I write this character finding peace in *ignoring* the large world, are you saying they are living a lie, or are you saying they've found a survival strategy you haven't?'"
