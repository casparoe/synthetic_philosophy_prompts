answer: |-
  This is a classic pinch point in philosophy of science, and it's great you're tackling it head-on rather than glossing over it. Since you're balancing TA prep with dissertation writing, I'll keep this high-signal: bottom-line implications first, followed by the technical nuance you need for the dissertation, and finally a pedagogical hook for section.

  ### The Bottom Line
  **Does the Tichý-Miller result sink the successive-approximation picture?**
  **No.** It sinks Popper's *specific formal definition* of verisimilitude, but not the *concept* itself.

  **Are realists entitled to say GR is closer to the truth than NM?**
  **Yes,** but they cannot use Popper's content-based machinery to justify it. They must migrate to **similarity-based (possible worlds) accounts** of truthlikeness (developed by Niiniluoto, Oddie, et al. post-1974).

  If you stick with Popper's original definition, you are indeed stuck: since both GR and NM are strictly false (NM fails on Mercury's perihelion; GR likely fails at singularities/quantum scales), Popper's definition renders them **incomparable**. To save the realist intuition, you have to drop the "content" approach and adopt a "likeness" approach.

  ---

  ### 1. The Technical Implication: Content vs. Likeness
  For your dissertation chapter, the crucial distinction is between **logical content** and **ontological similarity**.

  *   **Popper's Mistake:** Popper defined verisimilitude using Tarskian truth conditions and logical content. He thought a theory is closer to the truth if it has *more true content* and *less false content*.
  *   **The Tichý-Miller Proof:** They showed that if Theory A and Theory B are both false, A will entail some false sentences B does not, and B will entail some false sentences A does not. Consequently, you can never satisfy the condition that one has strictly less falsity content while maintaining equal or greater truth content.
  *   **The Lesson:** Logical strength (content) does not track truthlikeness. A very strong, detailed false theory (e.g., "There are exactly 9 planets") is intuitively closer to the truth (8 planets) than a weak, tautological false theory, but Popper's content measure struggles to capture this without collapsing into incomparability.

  **For the Realist:** This means you cannot ground the claim "GR is closer to the truth than NM" on the *amount* of correct predictions vs. incorrect ones (content). You must ground it on the **structural similarity** between the world GR describes and the actual world.

  ### 2. Saving the Intuition: Verisimilitude 2.0
  The consensus in contemporary philosophy of science is that the Tichý-Miller result killed the *content* approach, not the *project*. To keep the intuition that science progresses toward truth, realists moved to **Possible Worlds Semantics**.

  *   **The Shift:** Instead of counting true/false sentences, we treat theories as defining sets of possible worlds. The "truth" is the actual world.
  *   **The Metric:** Verisimilitude is measured by the **distance** between the possible worlds allowed by the theory and the actual world.
  *   **GR vs. NM:** Under this view, the spacetime manifold in NM is "closer" (in terms of geometric structure) to the GR manifold than, say, Aristotelian physics is. Even if NM is strictly false, the *distance* between its predictions and reality is smaller than the distance between Aristotelian predictions and reality.

  **Key Names for your Bibliography:**
  *   **Ilkka Niiniluoto:** *Truthlikeness* (1987). The definitive defense of the concept post-Popper.
  *   **Graham Oddie:** *Likeness to Truth* (1986).
  *   **David Miller:** (Ironically) continued to argue that verisimilitude is incoherent, pushing realists toward instrumentalism or epistemic utility.

  ### 3. Does this sink Scientific Realism?
  Not necessarily, but it forces a refinement.

  *   **Putnam/Boyd Realism:** Standard entity realism relies on reference and approximate truth. Tichý-Miller shows "approximate truth" is harder to formalize than Putnam hoped, but it doesn't refute the claim that reference is preserved across theory change (e.g., 'mass' in NM refers to roughly the same stuff as in GR, even if the definition changes).
  *   **Structural Realism (Worrall):** This result actually *helps* Structural Realism. If you can't compare theories by their truth-content (propositions), maybe you should compare them by their mathematical structure. The structural realist can say the *equations* of NM are a limiting case of GR, preserving the structural verisimilitude even if the ontological claims (absolute time) are false.

  ### 4. Pedagogical Strategy for Section (Undergrads)
  Do not try to walk undergrads through the logical proof of Tichý-Miller. They will drown in the set theory. Use the **Archery Analogy**.

  1.  **The Setup:** Imagine the Truth is the Bullseye.
  2.  **Popper's Scorecard:** Popper says to judge an archer, count how many arrows hit the bullseye (Truth Content) vs. how many hit the wall (Falsity Content).
  3.  **The Problem:** If *no* archer hits the bullseye (all theories are false), Popper's scorecard breaks. He can't tell you if an arrow hitting 1 inch from the center is better than an arrow hitting 1 foot from the center, because *both* are just "on the wall" (False).
  4.  **Tichý-Miller:** They proved mathematically that Popper's scorecard literally cannot rank two misses against each other.
  5.  **The Fix:** We need a tape measure. We don't count hits/misses; we measure **distance from the center**.
  6.  **Application:** Newtonian Mechanics misses the bullseye (it's false), but it lands in the 10-ring. General Relativity lands in the inner bullseye ring (but still technically not the exact center, due to quantum gravity issues). We can say GR is *closer* without saying it is *True*.

  ### Summary for your Dissertation Chapter
  If you are arguing for realism, the Tichý-Miller result is a **constraint on formalization**, not a refutation of the ontology.
  *   **Claim:** Scientific progress is increasing verisimilitude.
  *   **Objection:** Popper's definition fails (Tichý-Miller).
  *   **Rebuttal:** Adopt a similarity-based account (Niiniluoto/Oddie). The failure of the *content* definition shows that truthlikeness is a semantic/pragmatic relation of similarity, not a syntactic relation of entailment.
  *   **Conclusion:** Realists are entitled to say GR is closer to the truth than NM, provided they define "closer" via structural similarity or possible-worlds distance, not via logical content.

  Good luck with section tomorrow. If the undergrads ask if this means "we can't know anything," pivot to **epistemic access**: We don't need to *know* we have the truth to recognize that our measurements are getting more precise (the tape measure analogy).
