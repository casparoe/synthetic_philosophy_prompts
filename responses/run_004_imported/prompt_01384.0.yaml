prompt: |-
  So I'm TAing intro phil of sci this semester while also trying to bang out a dissertation chapter on scientific realism, and Popper's verisimilitude keeps tripping me up on both fronts. Can you lay out the most important implications of the Tichy-Miller result for whether realists are even entitled to say something like 'general relativity is closer to the truth than Newtonian mechanics'? Quick recap in case it's useful: Tichy and Miller independently proved in 1974 that Popper's truth-content/falsity-content definition of verisimilitude can never rank two false theories against each other, only a false theory against a true one. Does that basically sink the whole successive-approximation picture of scientific progress, or is there a principled way to keep the intuition while dropping Popper's specific formal machinery? Trying to get this straight before section tommorow so I'm not just hand-waving at my undergrads.
