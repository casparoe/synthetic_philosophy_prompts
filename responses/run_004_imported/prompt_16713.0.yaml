answer: |-
  **MEMORANDUM**

  **TO:** Educational Technology Advisory Committee (ETAC)
  **FROM:** [Your Name], Student Representative
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on District-Wide Expansion of Early-Warning Algorithm

  ### Executive Summary

  In three weeks, this committee must decide whether to expand the early-warning algorithm pilot district-wide. This tool determines priority access to limited counseling slots for students at risk of not graduating on time.

  After reviewing the vendor audit, consultant analysis, and testimony from both factions of this committee, **I recommend we vote to expand the tool as piloted, preserving calibration across income subgroups.**

  However, this recommendation comes with a critical condition: we must simultaneously launch a workstream to formally define "fairness" in our charter. The current deadlock stems from a charter requirement that demands fairness without defining which mathematical definition of fairness applies when base rates differ. While we cannot fix the charter before the vote, we can adopt the tool that maintains data integrity while committing to resolve the definitional ambiguity by the next academic year.

  ### The Technical Reality: A Mathematical Trade-Off

  We must be clear about what the data tells us. Our consultant confirmed that because the base rate of falling behind differs between income groups, we cannot have both perfect calibration and equal catch rates (recall).

  1.  **Calibration (Preserved in Pilot):** A 70% risk score means a 70% chance of falling behind, regardless of income. The score means the same thing for every student.
  2.  **Catch Rate/Recall (Disparate in Pilot):** Among students who *do* fall behind, the tool identifies 82% of low-income students but only 61% of non-low-income students.

  To equalize the catch rates, we would have to adjust the thresholds for one group. This would inevitably break calibration. A 70% score would no longer mean the same thing for every student, rendering the risk metric unreliable for counselors.

  ### Recommendation: Preserve Calibration

  I urge the committee to vote **YES** on expansion with the current model.

  **1. Trust and Actionability:**
  Counselors operate under high pressure with limited slots. If we sacrifice calibration, we ask them to interpret risk scores differently depending on a student's background. If a 70% score implies a higher actual risk for Group A than Group B, counselors cannot triage effectively. Calibration ensures that when we intervene, we are intervening on a verified probability of need.

  **2. Resource Scarcity:**
  We have a fixed number of counseling slots. Forcing equal catch rates would require flagging significantly more non-low-income students to raise their catch rate from 61% to 82%. This would increase false positives (students flagged who wouldn't have fallen behind). In a resource-constrained environment, every false positive consumes a slot that could have gone to a true positive. Preserving calibration ensures slots are allocated based on the highest verified probability of risk.

  **3. Equity of Outcome:**
  Currently, the tool identifies a higher percentage of at-risk low-income students (82%) than their peers (61%). Given the systemic barriers low-income students face regarding graduation, a model that casts a wider safety net for this demographic aligns with our district's equity goals. Reducing this catch rate to achieve statistical parity would actively reduce identification of at-risk students in the most vulnerable subgroup.

  ### A Serious Hearing for the Rejected Argument

  I recommend we reject the proposal to prioritize **Equal Catch Rates**, but I want to articulate why that argument is morally weighty and why reasonable people support it.

  **The Argument for Equal Protection:**
  Proponents of equal catch rates argue that the *consequence* of a missed intervention is equally tragic for every child. If a student falls behind and graduates late (or not at all), their future is impacted regardless of their household income.

  From this viewpoint, a disparity where we miss 39% of at-risk non-low-income students while only missing 18% of at-risk low-income students represents a failure of equal protection. It suggests that the safety net is structurally tighter for one group than the other. There is a profound moral intuition that the district should strive to catch *every* falling student at the same rate. To accept a 21-point gap in identification is to accept that some students are less worthy of being found by our system.

  Furthermore, relying on "base rates" can be circular. If historical data reflects systemic neglect of certain groups, using that data to justify current allocation can perpetuate past failures. Proponents argue we should optimize for *finding need*, even if it means our risk scores become less comparable across groups, because the primary goal is graduation, not statistical consistency.

  **Why This Must Be Rejected (For Now):**
  While the moral imperative of equal protection is undeniable, implementing it via threshold adjustment creates a new inequity: it requires us to treat risk scores as non-universal truths. If we tell a counselor that a 70% risk for a low-income student is "less urgent" than a 70% risk for a non-low-income student (to balance the rates), we undermine the scientific validity of the tool. Additionally, in a zero-sum resource environment, increasing the catch rate for the group with lower recall inevitably dilutes the pool, potentially delaying help for the highest-risk students overall.

  We cannot solve the moral problem of "missed students" by breaking the mathematical integrity of the tool. The solution to missing 61% of at-risk students in any group is more counseling slots, not manipulated algorithms.

  ### Timeline and Next Steps

  1.  **Vote (November 16):** Committee votes to expand the tool district-wide under current calibration standards.
  2.  **Implementation (January Start):** Tool deployed for Spring Semester. Counseling prioritization follows risk score magnitude, not subgroup adjustment.
  3.  **Charter Review (February - June):** A subcommittee, including student representation, will draft a formal definition of "fairness" for the ETAC charter. This definition will acknowledge the trade-off between calibration and recall and establish which metric takes precedence in future procurements.
  4.  **Annual Audit (Next October):** We will review graduation outcomes by subgroup to ensure the disparity in catch rates is not translating into disparate graduation outcomes.

  ### Conclusion

  This vote is not an endorsement of the disparity in catch rates; it is an endorsement of data integrity in the face of resource scarcity. We must use a tool that tells the truth about risk. If that truth reveals we are missing too many at-risk students in *any* subgroup, the answer is to expand our counseling capacity, not to obscure the risk scores.

  I look forward to discussing this framework at the next session.
