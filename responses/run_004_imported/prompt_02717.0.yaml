  1.  **Analyze the User's Query:**
      *   **Situation:** A basketball teammate behaves kindly/encouragingly in individual drills (especially with beginners) but becomes mocking/harsh when the team captain (who mocks weaker players) is present.
      *   **Teammate's Explanation:** The kind behavior is "who he really is"; the harsh behavior is just "going along with the group" (social conformity/pressure).
      *   **Friend's Critique:** The harsh behavior reveals his true character because folding immediately to status suggests moral weakness; the kindness is an excuse/image management.
      *   **User's Dilemma:** Something feels off about *both* framings. Is there a "true character" fact of the matter? Is expecting consistency unreasonable?
      *   **Core Question:** How do we evaluate character when behavior is context-dependent? Is one version more "real" than the other?

  2.  **Deconstruct the Philosophical/Psychological Concepts:**
      *   **Essentialism vs. Situationism:** The debate over whether character is a fixed trait (essentialism) or heavily influenced by context (situationism).
      *   **Social Conformity/Peer Pressure:** The Asch experiments, Milgram, etc. People often change behavior to fit in or avoid conflict with authority figures.
      *   **Moral Courage:** The ability to stand by one's values despite social pressure.
      *   **Integration of Self:** A mature character integrates values across contexts, but this is a developmental process, not a binary state.
      *   **The "True Self" Fallacy:** The idea that there is one singular "true" self hiding beneath behavior.

  3.  **Evaluate the Teammate's Claim:**
      *   *Claim:* Kindness is real; meanness is performance.
      *   *Validity:* It's possible he genuinely feels empathy but lacks the courage to act on it under pressure. However, actions have consequences. "Going along" with bullying is still participating in bullying.
      *   *Flaw:* It absolves him of responsibility for the harm caused by his harsh behavior.

  4.  **Evaluate the Friend's Claim:**
      *   *Claim:* Meanness is real; kindness is performance/excuse.
      *   *Validity:* It highlights the importance of integrity and consistency. If values disappear when tested, how strong are they?
