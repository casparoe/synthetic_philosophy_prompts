answer: |-
  Your intuition that something is "off" about both framings is spot on. Both your teammate and your friend are operating under a common but flawed assumption: that there is a single, static "true self" hidden underneath the behavior, and if we just peel back the right layer, we'll find the real person.

  Psychologists and philosophers generally agree that human behavior is rarely that binary. Instead of asking which version is the "real" one, it is more useful to look at **integration** and **moral courage**.

  Here is a breakdown of why both arguments feel incomplete, and a framework for how to actually evaluate his character.

  ### 1. The Flaw in the Teammate's Argument (Intent vs. Impact)
  Your teammate is arguing from **intent**. He believes that because his internal motivation is kind, the external actions he takes when pressured don't count as much. He is essentially saying, *"My heart is good; my actions are just a survival mechanism."*

  **Why this feels off:**
  *   **Impact outweighs intent:** To the beginner being mocked, it doesn't matter if your teammate is internally wincing. If he joins in the mockery, he is participating in the harm.
  *   **Responsibility:** Claiming the harsh behavior "isn't him" is a way to abdicate responsibility. It suggests he is a passive vessel for the group's mood rather than an agent with choice.
  *   **Fragile Virtue:** Kindness that vanishes the moment social status is on the line is a very fragile virtue. If his goodness requires a vacuum of social pressure to exist, it isn't robust enough to be relied upon in a crisis.

  ### 2. The Flaw in Your Friend's Argument (Consistency vs. Context)
  Your friend is arguing from **integrity**. They believe that character is defined by consistency, and that folding to authority reveals a moral weakness that negates the kindness shown in private.

  **Why this feels off:**
  *   **Ignores Social Psychology:** Humans are deeply social animals. The desire to belong and the fear of ostracization (especially from a leader like a captain) are powerful biological drivers. Almost everyone behaves differently around a boss than around a subordinate. Labeling this universal human trait as "not a good person" is overly cynical and ignores the difficulty of social navigation.
  *   **The "Saint" Standard:** It expects a level of moral heroism that is rare. It assumes that to be "good," one must be immune to peer pressure. Most people are works in progress.
  *   **Dismisses Growth:** If the kindness in private is genuine, dismissing it as a lie ignores the seed of empathy that actually *is* there. It writes him off completely rather than seeing a conflict between his values and his courage.

  ### 3. The Missing Variable: Moral Courage
  The reason both explanations feel unsatisfying is that they focus on *what* he feels (kindness) or *what* he does (mocking), but they ignore the bridge between them: **Moral Courage.**

  *   **The Teammate has Empathy:** He genuinely feels for the beginners. This is a positive trait.
  *   **The Teammate lacks Fortitude:** He cannot protect that empathy when it becomes socially costly.

  So, is there a fact of the matter about his character? **Yes, but it's not a binary one.** His character is currently defined by the *gap* between his values and his actions.

  A mature character is not one who never feels fear or pressure; it is one who has integrated their values so that they can act on them even when it is uncomfortable. Right now, your teammate is **compartmentalized**. He has a "Safe Mode" (kind) and a "Survival Mode" (cruel).

  ### 4. How to Evaluate Him (and the Situation)
  Instead of asking "Which one is the real him?", ask these three questions:

  **1. Does he recognize the dissonance?**
  If he says, "That's just who I am when the captain is here," with a shrug, that is moral laziness. If he says, "I hate that I do that, but I'm afraid of losing my spot/standing," that is self-awareness. Self-awareness is the prerequisite for change.

  **2. What is the cost of his conformity?**
  If he is just laughing along awkwardly, that's weak but manageable. If he is actively inventing new insults to curry favor with the captain, that is active malice, not just conformity. The latter suggests he enjoys the status gain more than he values the beginners' feelings.

  **3. Is the environment toxic?**
  You mentioned the captain "likes to mock weaker players." This is a toxic leadership style. Your teammate's behavior is a symptom of the team culture. A good person can survive in a bad culture, but it requires significant strength. It is reasonable to expect consistency, but it is also reasonable to acknowledge that maintaining consistency in a hostile hierarchy is difficult.

  ### The Verdict
  It is **not unreasonable to expect consistency**, because trust is built on predictability. If you are a beginner on that team, you cannot trust him to protect you when it counts. Therefore, in the context of *team safety*, his "captain-facing" behavior is the one that defines his reliability.

  However, in the context of *human potential*, his "drill-facing" behavior shows his capacity for good.

  **The Synthesis:**
  He is likely not a "bad person pretending to be good," nor a "good person pretending to be bad." He is likely an **undeveloped person.** He has the raw material for goodness (empathy) but lacks the structural integrity (courage) to support it under load.

  Your unease comes from the fact that **character is not what you feel; it is what you do when it is difficult.** By joining the mockery, he is voting for the captain's culture over his own stated values. He can claim the kind version is his "true self," but until he acts like that person when the captain is watching, that "true self" is just a potentiality, not a reality.

  **Advice:** Don't try to solve the metaphysical question of his soul. Judge him by the safety he provides to others. If you are mentoring beginners, warn them that his support has conditions. If you care about him as a friend, challenge him on the gap: *"I know you're actually a great mentor, but when the captain is here, you become someone else. That hurts the team. You don't have to fight the captain, but you don't have to join in either."*

  That moves the conversation from "Who are you really?" (which is defensive) to "What kind of teammate do you want to be?" (which is actionable).
