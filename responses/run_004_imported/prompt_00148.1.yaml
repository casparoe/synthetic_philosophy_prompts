      *   **The Pearl Solution (The "Structural" Shift):** Introduce SCMs. Mechanisms, not just events. The $do()$ operator.
      *   **Key Distinction:** Metaphysics vs. Epistemology/Computation. Lewis asked "What does causation mean?" Pearl asked "How do we compute causal effects?"
      *   **The Counterfactual Connection:** Crucial point: Pearl *uses* counterfactuals. He didn't abandon them; he grounded them. The "Ladder of Causation" places counterfactuals at the top.
      *   **Nuance/Caveat:** Philosophers still debate Lewis. Pearl's framework assumes the model is correct. It doesn't solve the *discovery* of structure from pure observation without assumptions.

