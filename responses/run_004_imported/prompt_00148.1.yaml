      *   *Clarification:* Make sure to distinguish between "interventionism" (Woodward/Pearl) and "counterfactuals" (Lewis). Actually, Pearl's framework *subsumes* counterfactuals. The prompt asks what Pearl fixed about the counterfactual approach. The answer is: he gave it a mathematical engine.
      *   *Analogy:* Use the "broken window" or "barometer" analogy. Lewis: "If the barometer hadn't dropped, the storm wouldn't have happened." (False). Pearl: "Intervening on the barometer doesn't change the storm."
      *   *Technical Detail:* Mention Structural Equation Models (SEMs). The difference between $P(Y|X)$ and $P(Y|do(X))$.

