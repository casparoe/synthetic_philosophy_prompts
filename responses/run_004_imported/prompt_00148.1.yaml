prompt: |-
  Judea Pearl's do-calculus and structural causal models are often described in popular science writing as having superseded the old philosophical debate over counterfactual theories of causation (Lewis and his critics), replacing metaphysical speculation with a rigorous, testable interventionist framework. For a feature I'm writing on the current state of causal reasoning, I'd like to explain to readers what exactly was wrong with the counterfactual approach that Pearl's interventionism fixed. Could you help me characterize that shift?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Topic:** Judea Pearl's do-calculus/Structural Causal Models (SCMs) vs. David Lewis's Counterfactual Theory of Causation.
      *   **Context:** Popular science writing/feature article on the current state of causal reasoning.
      *   **Goal:** Explain *what was wrong* with the old counterfactual approach (Lewis) and *how* Pearl's interventionism fixed it.
      *   **Tone:** Accurate, nuanced, accessible (for a feature article), but avoiding oversimplification that misrepresents the philosophy or the math.
      *   **Key Claim to Address:** The prompt suggests Pearl "superseded" the debate, replacing "metaphysical speculation" with "rigorous, testable interventionist framework." I need to validate, nuance, or correct this claim.

  2.  **Initial Knowledge Retrieval & Fact-Checking:**
      *   *Lewis's Counterfactuals:* David Lewis (1973) defined causation in terms of counterfactual dependence ($A$ causes $B$ if, had $A$ not occurred, $B$ would not have occurred). This relies on "possible worlds" semantics (similarity metrics between worlds).
      *   *Pearl's SCMs/do-calculus:* Pearl formalized causation using Structural Equation Models (SEMs) and the $do()$ operator. $P(B | do(A))$ represents an intervention. Counterfactuals are derived *from* the model (Step 3 of the Ladder of Causation).
      *   *The "Superseding" Claim:* This is a common narrative in AI/Stats circles, but it's controversial in philosophy. Pearl didn't exactly *disprove* Lewis; he formalized the *logic* of counterfactuals so they could be computed. Lewis was doing metaphysics (what *is* causation?); Pearl is doing epistemology/methodology (how do we *reason* about and *estimate* causation from data?).
      *   *What was "wrong" with Lewis?* It wasn't necessarily "wrong" philosophically, but it was computationally intractable and lacked a clear connection to empirical data. The "similarity of possible worlds" is vague. How do you measure the distance between the actual world and a world where Kennedy wasn't shot?
      *   *What did Pearl fix?* He provided a syntax and semantics for counterfactuals grounded in structural equations. He made them identifiable (under assumptions) from data. He distinguished seeing ($P(Y|X)$) from doing ($P(Y|do(X))$).

  3.  **Drafting the Narrative Arc:**
