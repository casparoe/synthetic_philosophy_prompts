answer: |-
  This is a fantastic choice for a graduate seminar. Using Douglass to precede the Dworkin/Scalia debates is pedagogically brilliant because it forces students to confront the political stakes of interpretive methodology before they get bogged down in the technicalities of modern originalism or living constitutionalism.

  To your specific question: **Yes, Douglass can hold these positions consistently.** In fact, the tension you perceive is the engine of his argument. They are not contradictory moves; they are complementary moves operating at different levels of legal analysis.

  Here is a breakdown of how to reconcile the passages, an assessment of which one is doing the "work," and some suggestions for mapping this onto later interpretive theory.

  ### 1. Compatibility: Source of Law vs. Canon of Construction

  The apparent contradiction dissolves if you distinguish between the **source of legal meaning** (Passage 1) and the **method of resolving ambiguity** (Passage 2).

  *   **Passage 1 (The Source):** Douglass is making a claim about *where* we look for the law. He is rejecting "secret history" (Madison's Notes, private correspondence, the closed-door compromises) as authoritative. This is a claim about democratic legitimacy and notice: the law is what the people ratified, not what the elites whispered. This aligns with a form of **public meaning textualism**. He is arguing that the "pro-slavery compact" theory (championed by Garrison) fails because that compact exists in history/debate, not in the enacted text.
  *   **Passage 2 (The Method):** Douglass is making a claim about *how* to read the text when it is not explicit. He acknowledges that the text might be susceptible to multiple readings. Here, he invokes established **canons of construction**. He is not importing morality to *override* the text; he is importing morality as a rule for *decoding* the text when the text is silent or ambiguous.

  **The Synthesis:** Douglass's argument is that the text contains no explicit grant of power to hold property in man (Passage 1). Therefore, any claim that the Constitution supports slavery relies on inference or implication. When inferences are required, the legal system presumes liberty over bondage (Passage 2).

  If he only used Passage 1, a pro-slavery interpreter could say, "The text is silent, but the silence implies permission under state law." Passage 2 blocks this by establishing that silence must be read as prohibition (or at least, non-authorization) when fundamental rights are at stake.

  ### 2. Division of Labor: Is One Move Doing All the Work?

  You ask if the second principle is doing the real work while the first lends an appearance of neutrality. It is tempting to think so, but in the context of 1860, **both are doing heavy lifting against different opponents.**

  *   **Passage 1 fights the Garrisonians:** William Lloyd Garrison argued the Constitution was a "covenant with death" because the *historical bargain* among the framers was pro-slavery. Douglass needs Passage 1 to sever the link between the *framers' motives* and the *Constitution's meaning*. If he concedes that secret intentions matter, he loses to Garrison.
  *   **Passage 2 fights the Taney Court/Pro-Slavery Constitutionalists:** Chief Justice Taney (in *Dred Scott*) and pro-slavery theorists argued that the text, properly understood within the historical context, protected slave property. Douglass needs Passage 2 to argue that even if the text is vague (e.g., the Fugitive Slave Clause, the Three-Fifths Clause), the *rule of reading* must favor liberty.

  So, Passage 1 clears the field of historical determinism, and Passage 2 populates that field with a presumption of liberty. Without Passage 1, the history condemns the text. Without Passage 2, the text's silence might be read as acquiescence.

  ### 3. Theoretical Lineages: Is this *Sui Generis*?

  Douglass's position is not *sui generis*; it anticipates several distinct strands of modern legal theory. This is where your seminar can really shine.

  **A. Public Meaning Originalism (Scalia/Barrett)**
  Passage 1 is strikingly similar to modern textualist/originalist rejections of legislative history. Scalia famously argued that we are governed by laws, not the intentions of legislators. Douglass's insistence that "it was what they said that was adopted by the people, not what they were ashamed or afraid to say" is a proto-public-meaning originalist argument.
  *   *Seminar Point:* Ask students why Douglass, an abolitionist, sounds like a conservative textualist here. (Answer: Because textualism can be a tool for stability and democratic notice, not just conservative outcomes.)

  **B. The Clear Statement Rule / Constitutional Avoidance**
  Passage 2 closely mirrors the modern "clear statement rule." In modern administrative and constitutional law, courts often rule that if Congress wants to alter the federal balance or infringe on fundamental rights, it must speak with "irresistible clearness." Douglass is citing this exact common law tradition. He is arguing that slavery is such a "wicked purpose" that it cannot be established by implication.
  *   *Seminar Point:* This challenges the idea that "moral readings" are always Dworkinian. Douglass is using a technical canon of construction to achieve a moral end.

  **C. Natural Law Jurisprudence**
  Underlying Passage 2 is a natural law premise: Liberty is the default status of human beings; slavery is the exception. Therefore, positive law must be explicit to overturn the natural default. This resembles the reasoning in *Somerset v. Stewart* (1772), where Lord Mansfield held that slavery was "so odious" that it required positive law to support it.
  *   *Seminar Point:* Douglass is arguing that the Constitution sits atop a background of natural rights. The text doesn't need to say "liberty" everywhere; liberty is the background radiation. Slavery requires a specific textual switch to turn it on.

  **D. Dworkin's "Law as Integrity"**
  While Douglass predates Dworkin, his approach resonates with the idea that the law should be interpreted in its "best moral light." However, there is a limit: Douglass insists (in Passage 1) that the moral reading cannot invent text that isn't there. It can only resolve ambiguity. This makes him slightly more constrained than a pure Dworkinian might be.

  ### 4. Pedagogical Suggestions for the Seminar

  To make this productive for your students, you might frame the discussion around three questions:

  1.  **The "Silence" Problem:** Douglass argues the Constitution is silent on slavery. But is silence neutral? If a document establishes a government but says nothing about whether that government can enslave people, does it permit it or forbid it? Douglass says forbid (via Passage 2). A positivist might say permit (via state sovereignty). How does Douglass's "innocent purpose" canon solve this?
  2.  **The Risk of the Moral Canon:** If judges can always choose the "innocent purpose" over the "wicked purpose" when text is ambiguous, does that give judges too much power to define what is "wicked"? How does Douglass guard against this? (Hint: He guards against it with Passage 1—the text must still be the anchor; the canon only breaks ties).
  3.  **The Political Turn:** Douglass changed his mind on this issue. Earlier, he agreed with Garrison that the Constitution was pro-slavery. Why adopt this complex textual/moral theory in 1860? (Answer: Because he shifted from moral suasion to political action. To vote and legislate within the system, he needed a theory that made the system redeemable). This highlights how **interpretive theory is often driven by political necessity.**

  ### Conclusion

  Douglass is holding a sophisticated position that combines **textual fidelity** (to secure democratic legitimacy and reject historical determinism) with **normative canons** (to ensure the text serves justice).

  It is not inconsistent. It is a "Libertarian Presumption Textualism." He argues that the text is the only law, but the text must be read against a background presumption of liberty that requires explicit language to overcome.

  For your seminar, this is a perfect bridge. It shows that the "Text vs. Morality" debate is a false dichotomy. Douglass shows us that morality often enters interpretation not by overriding text, but by supplying the rules of grammar and logic used to read it. This sets the stage beautifully for Dworkin (who makes the moral reading explicit) and Scalia (who tries to banish it, yet relies on similar canons).
