  2.  **Deconstruct Passage 1 (Textualism/Intentionalism):**
      *   Douglass rejects *secret* intentions (Madison's Notes, closed-door debates).
      *   He argues for the *public* text as the law.
      *   Why? Democratic legitimacy ("adopted by the people"), stability ("endless confusion"), and transparency ("nothing but the result... should be seen").
      *   *Key nuance:* He isn't rejecting *all* intention; he's rejecting *unexpressed* intention. The "intention" that matters is the one embodied in the words ratified.

  3.  **Deconstruct Passage 2 (Canon of Construction/Natural Law):**
      *   Douglass invokes legal canons of construction (strict construction against infringement of rights).
      *   He invokes a moral presumption: choose the "innocent purpose" over the "wicked purpose."
      *   This acts as a tie-breaker for *ambiguity*.
      *   *Key nuance:* This isn't necessarily importing external morality *against* the text, but rather a rule for *reading* the text when it's unclear.

  4.  **Evaluate Compatibility (The Core Tension):**
      *   *Surface Tension:* Passage 1 says "look only at the text." Passage 2 says "interpret the text through a moral lens."
      *   *Resolution:* They operate at different stages or levels of analysis.
          *   Passage 1 defines the *source* of law (the text, not the secret diary of James Madison).
          *   Passage 2 defines the *method* of reading that source when it is ambiguous.
      *   *Consistency:* Douglass is arguing that the text *itself* does not explicitly sanction slavery. Therefore, to read it as sanctioning slavery requires an inference. That inference is where the moral canon comes in. If the text is silent or ambiguous on slavery, the default status (under natural law or common law canons) is liberty.
      *   *Is Passage 1 window dressing?* No. It's crucial for his argument against Garrison. Garrison said the Constitution *is* pro-slavery based on the historical bargain. Douglass says, "No, the historical bargain doesn't matter if it's not in the text." Passage 2 is crucial for the *implication* of that text. Both are doing work.

  5.  **Connect to Later Interpretive Theory:**
      *   *Textualism (Scalia):* Douglass aligns with the rejection of legislative history (Passage 1). But Scalia might balk at the moral tie-breaker (Passage 2) if it overrides original public meaning.
      *   *Dworkin:* Fits well. Law as integrity. Moral reading of the Constitution. Douglass is essentially arguing for a moral reading where the "best light" of the text aligns with liberty.
      *   *Avoidance Canons (Constitutional Avoidance):* The idea that if a statute has two readings, one constitutional/innocent and one unconstitutional/wicked, choose the innocent one. Douglass is prefiguring this.
      *   *Natural Law/Higher Law:* The idea that positive law is interpreted against a background of natural rights (liberty is the default, slavery the exception).
      *   *Public Meaning Originalism:* Douglass is close to this. He cares about what the *people* adopted (public text), not what the *framers* thought in private. But he adds a normative presumption.

