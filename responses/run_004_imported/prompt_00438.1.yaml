      *   Ensure the tone is supportive of the journalist's investigative role.

  8.  *(Final check against user prompt)*: Did I answer "when, if ever, it's substantively correct"? Yes (Intentional Stance/Functionalism). Did I address "how to decide where to draw the line"? Yes (Mechanism vs. Behavior). Did I help with the editor's binary? Yes (Proposed a nuanced stance that is still "clear").

