answer: |-
  The highway was a ribbon of wet black unspooling under the headlights. The funeral had been at two; now it was past eight. The hearse was long gone, the other mourners scattered to their own cities, leaving only Ilse and Daniel in the rental sedan, the silence between them heavy with the specific exhaustion of burying a friend.

  Daniel kept his eyes on the taillights ahead. "He looked like a machine that had been unplugged," he said finally. "Not broken. Just… off."

  "That's the intuition speaking," Ilse said, her voice quiet but precise. She was staring out the passenger window, watching the rain blur the trees. "Not the metaphysics."

  "Isn't that the same thing, in the end? Our access to the metaphysics *is* the intuition." Daniel shifted in the seat. "Look, Ilse, we've done this for twenty years. Kripke settled the water case. We thought water could have been something other than H2O. We were wrong. It was an epistemic possibility, not a metaphysical one. Why is pain different? Why can't 'pain = C-fiber firing' be a necessary a posteriori truth, just like 'water = H2O'?"

  "Because water has a dual nature in how we refer to it," Ilse said, turning to him. "There's the primary intension—the clear, drinkable liquid in the lakes—and the secondary intension—the actual microstructure, H2O. They come apart. You can imagine the liquid without the microstructure. But phenomenal concepts don't work that way. When I conceive of pain, I'm not conceiving of it via some contingent description like 'the thing caused by injury.' I'm conceiving of it directly, by what it is. The mode of presentation fixes the reference."

  Daniel sighed, a short exhale through his nose. "Chalmers' primary and secondary intensions. I know the move. You're saying that for phenomenal concepts, the two intensions coincide. So if I can conceive of pain without physicality, it's genuinely possible."

  "Exactly. Ideal, positive conceivability entails possibility. If you can't find a contradiction in the zombie scenario, it's possible. And if it's possible, physicalism is false."

  "But you're assuming the concepts are transparent," Daniel said, tapping the steering wheel. "That's the Phenomenal Concept Strategy. I'm conceding the epistemic gap, Ilse. I'm conceding that we can't deduce qualia from physics from the armchair. But that's because phenomenal concepts are unique. They're recognitional. Direct. Physical concepts are theoretical. Third-person. The gap is between the *concepts*, not the properties. Just because I can't translate 'red experience' into 'wavelengths' doesn't mean they aren't the same thing."

  Ilse turned fully in her seat now. "If the property is physical, why is the concept so special? If pain is just a neural state, why can't I conceive of that neural state without the pain? With heat, I can conceive of the molecular motion without the sensation of heat, because the sensation is contingent. But with pain, the feeling *is* the thing. If physicalism were true, the concept should behave like 'heat,' not like 'pain.'"

  "Or," Daniel said, his voice tightening slightly, "it means we're humans. We have cognitive closures. You're treating ideal rationality as if it's a god's-eye view. We're monkeys with MRI machines. Just because we can't see the identity doesn't mean it's not there. You're letting the structure of our thought dictate the structure of the world."

  "And you're letting the success of physics dictate the structure of consciousness," Ilse countered. "You're asking me to believe that this"—she tapped her temple—"is an illusion generated by matter that doesn't itself feel. That's a bigger miracle than dualism."

  Daniel was quiet for a long stretch of road. The wipers slapped a rhythmic code against the glass. "I don't think it's an illusion. I think it's real. I just think it's physical. I'm willing to pay the price of the explanatory gap to keep the ontology unified. You're not. You'd rather split the world to save the intuition."

  "I'd rather save the data," Ilse said softly. "The consciousness is the one thing we know for sure exists. The physical world is the inference."

  "And when you die, Ilse? Will your primary intensions persist?"

  The question hung in the air, sharper than the philosophy. Ilse looked back out at the dark trees. They had buried Mark today. Mark, who had laughed at this very argument over cheap wine in grad school.

  "I don't know," she said. "But I know he wasn't a zombie while he was here. And I know you can't explain why without admitting something extra."

  "And I know," Daniel said, his eyes fixed on the road, "that if I admit something extra, I lose the ability to explain how that something interacts with the brain that's decaying in the ground. We're both paying a cost. You pay with causal closure. I pay with intuition."

  "Neither price feels cheap today," Ilse said.

  "No." Daniel shifted gears as the highway curved. "But I'm still driving the physical car. And you're still riding in it."

  "Because it's the only ride we have."

  They drove on. The argument wasn't resolved; it was merely suspended, like the dust of the body they'd left behind, waiting to settle into whatever shape the ground would allow.
