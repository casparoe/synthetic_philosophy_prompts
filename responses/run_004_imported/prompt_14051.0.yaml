  6.  **Refining the Joke:**
      Needs to work for laypeople.
      *Idea:* "The puzzle asks if you can intend to do something painful for no reason. If you've ever seen Theo try to assemble IKEA furniture without instructions, you know the answer is yes."
      *Why it works:* Philosophers get the "intention/action" link. Non-philosophers get the IKEA struggle. It paints Theo as endearing/clueless.

  7.  **Refining the "Deep" Part:**
      Make sure it doesn't sound like a lecture. Use "we" or "us" less, focus on "them."
      Focus on the *vow* as the solution to the paradox. The paradox assumes self-interest is the only motivator. Love is a different motivator.

  8.  **Timing Check:**
      450 words is roughly 3 minutes at a moderate speaking pace with pauses for laughter.

