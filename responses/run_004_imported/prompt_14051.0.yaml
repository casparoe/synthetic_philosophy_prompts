prompt: |-
  My friend Theo is getting married in three weeks and asked me, his housemate from undergrad, to give the best man speech. Complication: Theo apparently proposed to his fiancée Ana by way of Kavka's toxin puzzle. The story is that their first real conversation, in our decision theory seminar last year, was a two-hour argument about whether you can actually rationally intend to drink the toxin, and it became this running bit between them - he told her, and I quote, that marrying him is basically "the toxin puzzle, except you actually want to drink it." Now everyone coming to the wedding already expects me to do something with this, and to make it weirder, the professor assigned the actual Kavka paper again this semester, two weeks before the wedding, which Theo insists is a sign.

  I don't want to just make a vague "haha nerdy inside joke" reference though, because going through the paper properly this time, the part thats sticking with me isn't the toxin itself, its the timing: the billionaire pays out the moment you form the intention at midnight, well before you'd ever have to actually drink the stuff, so by the time drinking-time rolls around the next day you have zero remaining reason to go through with it - and the real puzzle is whether you can even sincerely form that intention in the first place, knowing in advance you won't want to follow through once the payoff's secured. That gap - you bind yourself now to a future moment where plain self-interest will leave you nothing left to go on - seems to me like it's actually just the structure of a wedding vow, not a cute analogy to it, and I want the speech to use that instead of flattening it into a one-off pun.

  Could you write me the toast? It needs to run about three minutes out loud, include one actual joke that both the five or six philosophy people in the room and the thirty guests who've never heard of Kavka can laugh at, and land as a warm, genuine thing to say about Theo and Ana rather than a decision theory lecture with cake at the end.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Occasion:** Best Man Speech at Theo and Ana's wedding.
      *   **Speaker:** Theo's undergrad housemate/friend.
      *   **Key Theme:** Kavka's Toxin Puzzle (a philosophical thought experiment about intention and rationality).
      *   **Specific Constraint 1:** Do *not* make it a vague "haha nerdy" joke. Use the *structure* of the puzzle (binding oneself to a future action when incentives change) as a metaphor for wedding vows.
      *   **Specific Constraint 2:** Include one actual joke accessible to both philosophers (5-6 people) and non-philosophers (30 guests).
      *   **Specific Constraint 3:** Tone must be warm and genuine, not a lecture.
      *   **Length:** About 3 minutes spoken (approx. 400-500 words).
      *   **Context:** Theo proposed using the puzzle ("marrying me is the toxin puzzle, except you actually want to drink it"). The professor re-assigned the paper recently (Theo thinks it's a sign).

  2.  **Deconstruct Kavka's Toxin Puzzle (for accuracy):**
      *   *The Setup:* A billionaire offers you $1 million if, at midnight, you *intend* to drink a harmless but painful toxin tomorrow morning.
      *   *The Catch:* The money is deposited *before* you drink. Once you have the money, you have no reason to drink the toxin (it's painful and serves no purpose).
      *   *The Paradox:* Can you genuinely intend to do something you know you won't do once the incentive is gone?
      *   *The Speaker's Insight:* Wedding vows are like this. You make a promise now (intention) for a future time when feelings or circumstances might change (the "payoff" of the wedding day is over, life is hard), but you bind yourself anyway.
      *   *Theo's Twist:* "Except you actually want to drink it." (Love changes the utility function).

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role, the friendship, and the elephant in the room (the philosophy joke).
      *   **The Setup (The "Nerdy" Part):** Briefly explain the Toxin Puzzle without bogging down. Keep it simple.
      *   **The Joke:** Needs to land for both groups. Maybe about the "billionaire" or the "toxin" being something relatable (like marriage itself or IKEA furniture). Let's try something about the "painful" part.
      *   **The Turn (The Deep Part):** Connect the puzzle to the vow. The speaker's insight about the "gap" between intention and action is the core.
      *   **The Resolution (Theo & Ana):** How they solve the puzzle. Theo's quote ("you actually want to drink it").
      *   **The Toast:** Raise a glass, wish them well.

  4.  **Drafting - Attempt 1 (Mental Outline):**
      Hi everyone. I'm the best man. Theo and I studied philosophy. He proposed using Kavka's Toxin Puzzle. For those who don't know, a billionaire pays you to intend to drink poison. You get the money before you drink. So why drink it? Theo said marriage is like that. But I read the paper again. It's about binding yourself when reasons fade. That's a vow. You promise now for later when it's hard. But Ana, you actually want to be here. So cheers.

