      *   *Intro:* Mention the undergrad days.
      *   *The Puzzle:* Keep it to 3 sentences. Billionaire, midnight intention, morning drink.
      *   *The Joke:* "For the non-philosophers, don't worry. The toxin wasn't fatal. Unlike the open bar later." (A bit cliché). How about: "The toxin makes you sick for a day. Which, honestly, sounds like a reasonable trade-off for the cost of this venue." (Maybe too risky about cost). Let's go with the "rationality" angle. "Philosophers spend decades arguing if you can intend to do something stupid. Theo just put a ring on it."
      *   *The Deep Dive:* The speaker's specific insight about the *timing*. The money arrives, the reason vanishes. But vows are binding yourself when the "money" (the honeymoon phase) is gone.
      *   *The Couple:* Ana doesn't need the puzzle solved because she changes the variables. She *wants* to drink the toxin.
