answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name]. I met [Bride] during our Philosophy MA, back when we thought reading Hegel for fun was a reasonable way to spend a Saturday night.

  Now, [Groom] is an engineer. He likes things that work. He likes data. And last week, after a couple of bottles of wine, he and I got into a pretty heated debate about "hard choices." He argued that a choice is only hard because you're missing information. If you knew enough, the answer would be obvious. I argued that sometimes, the universe just doesn't give you an answer key. Sometimes, two options are genuinely different kinds of good, and neither one beats the other, yet they aren't exactly equal either.

  [Groom] thought that was nonsense. I thought he was being reductive. We didn't resolve it. But standing here today, looking at the two of them, I realize that debate wasn't just academic. It was actually about this wedding.

  Everyone here knows the story. A year ago, [Bride] was offered a fully-funded postdoc in Berlin. It was everything she'd worked for. And she turned it down to stay here and build a life with [Groom].

  I know what some people think. They think she did the math, weighed the pros and cons, and decided [Groom] was the "better" option. Like he's a slightly heavier weight on a scale than Berlin. Or worse, they think she sacrificed something. That she settled.

  But knowing [Bride], and knowing how she thinks, I know that's not what happened.

  If she had chosen him because he was objectively "better," that would insult Berlin. It would turn a genuine opportunity into a consolation prize. But if she had chosen him because they were "equal," that would insult the weight of the choice. It would imply it didn't matter.

  The truth is much more beautiful. She faced a choice where neither option beat the other. They were on a par. Berlin offered one kind of life; [Groom] offered another. There was no fact of the matter waiting to be discovered. There was no right answer hidden in the clouds.

  And that is where the magic happens.

  In situations like that, you don't *find* a reason to choose. You *create* one. By standing up and committing to one path, you pour yourself into it. You make it the right path through the sheer force of your dedication.

  [Bride] didn't choose [Groom] because the calculation was easy. She chose him because she was willing to do the hard work of making that choice right. She didn't settle for him; she stood up for him. And that is a much stronger foundation for a marriage than simply picking the winner of a contest.

  [Groom], you might still think hard choices are just missing data. And maybe you're right about bridges and engines. But when it comes to love, I hope you never find the missing data. I hope you never find the objective proof that this is the "best" possible life. Because that would mean you stopped creating it together.

  To [Bride] and [Groom]: May your life together be full of hard choices. Not because you're confused, but because you're ambitious. And may you always have the courage to put your weight behind them, together.

  Cheers.
