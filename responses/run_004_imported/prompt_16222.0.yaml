      *   **Epistemology:** The study of knowledge (Justified True Belief, etc.).
      *   **Pragmatism:** Truth is what works/is useful. The classmate's behavior aligns with this.
      *   **Historical Methodology:** Corroboration, primary vs. secondary sources, archaeology, bias analysis.
      *   **Inference to the Best Explanation:** Abductive reasoning. What is the most likely explanation for the evidence we have?

  3.  **Evaluate the Teacher's Reaction:**
