      *   *Was it ideal?* No. Dismissing valid philosophical inquiry can stifle critical thinking. A better approach would be to acknowledge the depth but pivot to *how* historians work within those constraints.

  4.  **Evaluate the Classmate's Argument:**
      *   *Philosophical Validity:* Technically, you cannot *logically disprove* radical skepticism. There is no absolute, metaphysical certainty about the past.
