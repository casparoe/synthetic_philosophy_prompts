      *   **Constraint 4:** Each of the three specific topics needs a follow-up question keyed to the *likely* answer.

  2.  **Deconstruct the Specific Topics & Likely Answers:**

      *   **Topic 1: The Presumptuous Philosopher (PP).**
          *   *Context:* Bostrom's thought experiment where SIA allows a philosopher to claim with high confidence that a theory predicting $10^{100}$ observers is true over one predicting $10^{50}$, without empirical evidence.
          *   *Likely Defense:* SIA defenders often argue that PP isn't as absurd as it sounds, or that the prior probabilities should be adjusted, or that we *should* update on the number of observers. Some argue it reveals a bug in our intuition, not SIA.
          *   *Follow-up Strategy:* If she defends SIA against PP, ask about the *cost* of that defense. Does it make empirical science irrelevant?

      *   **Topic 2: SIA vs. Doomsday Argument (DA).**
          *   *Context:* DA (using SSA) suggests we are likely in the middle of human history, implying extinction soon. SIA favors hypotheses with more total observers, pushing the end of humanity further away. They often cancel out.
          *   *Likely Defense:* She will likely explain the mathematical cancellation (the "Great Filter" or total population size). She might argue this is a *feature*, not a bug, restoring intuitive priors.
          *   *Follow-up Strategy:* If she says they cancel to restore neutrality, ask about the *mechanism*. Is it a coincidence or a deep structural requirement of rationality?

      *   **Topic 3: Reference Class Problem.**
          *   *Context:* SSA (Self-Sampling Assumption) struggles with defining "who counts as me?" (humans? conscious beings? atoms?). SIA is often claimed to be reference-class independent.
          *   *Likely Defense:* She will likely argue SIA is robust because it weights by existence, not sampling from a class. However, critics say you still need to define what counts as an "observer."
