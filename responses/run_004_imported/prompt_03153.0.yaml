answer: |-
  This is an exceptionally sharp reading of the *Treatise*. You have identified precisely the fault line where 20th-century rationalist reconstructions of Hume (most notably David Lewis) diverge from Hume's own naturalistic, genetic project.

  To answer your core question directly: **Hume's mechanism does not deliver strict Common Knowledge (CK) in the Aumann/Lewis sense, nor does it need to.** Attempting to force Hume into the strict epistemic logic of CK creates a "gap" only if one assumes Hume is doing the same project as Lewis. If we reconstruct Hume using **epistemic learning models** or **evolutionary game theory**, the "gradual" nature of the convention is not a bug, but the feature that solves the coordination problem without requiring infinite epistemic hierarchies.

  Here is a reconstruction of the epistemic structure Hume is assuming, how it maps to modern game theory, and how you might frame this for your seminar.

  ### 1. The Epistemic State: Confidence vs. Logical Certainty
  You are right to worry about the phrase "mutually expressed, and is known to both." In formal epistemic logic, this is often read as the base case for a CK induction. However, for Hume, "knowledge" in the context of human affairs is rarely demonstrative certainty; it is **probabilistic belief grounded in custom.**

  When Hume says the interest is "known," he does not mean the agents possess a logical proof of the other's mental state. He means they have a **stable expectation** derived from "repeated experience."
  *   **Lewis's Critique:** Lewis (*Convention*, 1969) argues that without CK, agents cannot be sure the other will cooperate, leading to a regress of uncertainty (I know you know, but do you know that I know that you know?). He posits CK as a necessary condition for rational convention.
  *   **Hume's Reply (Reconstructed):** Hume would likely reject the requirement for infinite hierarchy. For Hume, the "confidence of the future regularity" is a psychological sentiment, not a logical state. If my experience tells me you have cooperated 1,000 times, my belief that you will cooperate again is sufficiently strong to induce my cooperation, regardless of whether I have formed a 10th-order belief about your beliefs.

  **Game Theoretic Reconstruction:** This aligns with **Monderer and Samet's (1989)** concept of **"Approximate Common Knowledge."** They show that for many strategic purposes, agents do not need infinite CK; they only need a sufficiently high finite order of mutual knowledge (or "common *p*-belief"). Hume's "repeated experience" generates exactly this: a high-order finite mutual belief that is functionally equivalent to CK for the purpose of sustaining equilibrium.

  ### 2. The Generative Story: Learning vs. Public Announcement
  You note the tension between Hume's "gradual" progression and the "public announcements" often used to generate CK in formal models. This is the strongest evidence that Hume is not describing a static epistemic state but a **dynamic learning process.**

  *   **Static Epistemic Game Theory:** Assumes agents start with a type space and priors. CK is often assumed as an initial condition or generated by a singular public event.
  *   **Hume's Dynamic Model:** Agents start with uncertainty. Through "slow progression" and "inconveniences of transgressing," they update their priors.

  **Game Theoretic Reconstruction:** This maps cleanly onto **Fictitious Play** or **Stochastic Stability** models (e.g., H. Peyton Young, *Individual Strategy and Social Choice*).
  *   In these models, conventions emerge from a history of play. Agents track the frequency of others' actions.
  *   The "convention" is the **absorbing state** of a Markov process.
  *   Crucially, this does not require CK to begin with. It requires only that agents are rational learners who respond to empirical regularities. The "common sense of interest" is not a pre-existing metaphysical fact; it is an **empirical convergence of expectations.**

  ### 3. Coordination Game vs. Assurance Game
  The specific game structure matters for your epistemic analysis.
  *   **The Rowers:** This is a pure Coordination Game. CK is very helpful here to select the equilibrium (which rhythm?).
  *   **Justice/Property:** This is better modeled as an **Assurance Game (Stag Hunt)** or an **Iterated Prisoner's Dilemma** with a shadow of the future.

  In an Assurance Game, I want to cooperate *if* I believe you will cooperate. Here, the "gradual" experience serves to lower the **risk dominance** of the non-cooperative equilibrium. Hume's "repeated experience of the inconveniences of transgressing" acts as a payoff update mechanism. Over time, the expected utility of defection drops (due to punishment or loss of reputation), and the expected utility of cooperation rises (due to stability).

  In this context, **Correlated Equilibrium (Aumann, 1974)** is a powerful reconstruction. The "history of play" serves as a public correlation device. I don't need to know your mind (CK); I just need to observe the public signal (the established rule of possession) and condition my strategy on it. Hume's "convention" functions as a correlation device established by time rather than a mediator.

  ### 4. Is it a Gap or a Vocabulary Difference?
  It is a **category difference**, not a gap.
  *   **Lewis (Rationalist):** Asks, "What epistemic conditions must hold *now* for this behavior to be rational?" Answer: Common Knowledge.
  *   **Hume (Naturalist/Empiricist):** Asks, "How did this behavior *come to be* stable in human psychology?" Answer: Habit and Induction.

  Hume is not trying to justify the rationality of the equilibrium from the armchair; he is explaining the **causal genesis** of the social norm. For Hume, the "epistemic state" is a **habit of the imagination.** The "confidence" he speaks of is a feeling produced by the association of ideas, not a logical deduction.

  Therefore, accusing Hume of lacking a theory of Common Knowledge is like accusing Newton of lacking a theory of Quantum Mechanics. He is working within a different explanatory framework. However, modern **Evolutionary Game Theory (EGT)** bridges this gap. In EGT (e.g., Brian Skyrms, *The Evolution of the Social Contract*), conventions are **Evolutionarily Stable Strategies (ESS)**. An ESS does not require CK; it requires only that a population strategy be invadable by no mutant strategy. Hume's "gradual" acquisition of force is essentially a description of a population converging on an ESS.

  ### 5. Seminar Strategy: How to Frame This
  For your seminar response, I suggest the following argumentative arc:

  1.  **Acknowledge the Lewisian Reading:** Start by conceding that David Lewis famously interpreted Hume as requiring Common Knowledge to solve the coordination problem of justice.
  2.  **Identify the Tension:** Highlight the passage you quoted. Point out that "gradualness" and "repeated experience" are inconsistent with the instantaneous, logical nature of CK.
  3.  **Propose the Reconstruction:** Argue that Hume is better read as a precursor to **Epistemic Learning Theory** rather than static Epistemic Game Theory.
      *   The "mutual expression" is not a speech act, but a behavioral signal observed over time.
      *   The "knowledge" is not logical certainty, but **high-order probabilistic belief** (Approximate CK).
  4.  **The "Gap" Verdict:** Conclude that the "gap" exists only if we demand Hume provide a rationalist justification for normativity. If we read him as providing a naturalistic explanation of stability, his account is robust. It anticipates the idea that **common knowledge can be a product of convention, not just a precondition.** (i.e., we don't need CK to start; the process of convention *creates* the functional equivalent of CK over time).
  5.  **Recommended Citation:** Bring in **Peter Vanderschraaf** (*"Hume on Justice and Convention"*). He argues specifically that Hume's convention is a **Correlated Equilibrium** sustained by public signals (the rules of justice) rather than a Nash Equilibrium sustained by CK of rationality. This supports your intuition that the "common knowledge" appeal in later accounts is an add-on.

  ### Summary for your Response
  Hume does not assume strict Common Knowledge. He assumes a **convergence of expectations** generated by inductive learning. This is best reconstructed not as a static epistemic state (CK), but as a **dynamic process** (Learning/Evolution) that results in a **Correlated Equilibrium**. The "gradual" nature of the convention is the mechanism by which finite, approximate mutual knowledge becomes robust enough to sustain cooperation, rendering the infinite hierarchy of CK unnecessary for Hume's explanatory purposes.

  This positions Hume not as a failed Lewisian, but as a proto-evolutionary game theorist who understood that social order rests on the *history* of interaction, not just the *logic* of the moment.
