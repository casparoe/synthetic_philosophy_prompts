      *   *The Proof:* Vane predicts Arthur's next question. Or reveals something about the past. Let's have Vane reveal what Arthur was thinking *before* he opened the door.
      *   *The Struggle:* Arthur looks at the coin. It's tails. Physical reality. Paying changes nothing.
      *   *The Memory:* His father. "Luck is a habit." Arthur rejected this. But now...
      *   *The Choice:* He writes the check. Not to win, but to be consistent.
      *   *The Ending:* Vane leaves. Arthur feels lighter, or perhaps just resolved. A hint that the "type" of person matters more than the instance.

  8.  **Word Count Check:**
      *   Need to expand the internal monologue to hit 1.5k-2.5k.
      *   Deep dive into the "why." The feeling of being mugged by logic.

  9.  **Revision during drafting:**
