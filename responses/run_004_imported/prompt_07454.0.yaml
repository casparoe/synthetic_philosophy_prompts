      *   *Is the conclusion correct?* No. This is a classic debate in meta-ethics and deontic logic. The user hasn't "solved" philosophy; they've rediscovered one side of a long-standing argument (the "consistency" view vs. the "dilemma" view).
      *   *Why are Marcus and Williams not "wrong"?* Because they (and others) challenge the premises.
