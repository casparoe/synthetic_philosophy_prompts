answer: |-
  **Sidebar: The Case Against the "Regrettable Necessity" Gloss**

  The standard defense of Hegel—that he is merely a "realist" describing the unavoidable anarchy of the international system—relies on treating war as an *external* accident. On this reading, war exists only because there is no global sovereign to stop it. It is a structural failure, not a philosophical feature.

  But this reading collapses when you trace the internal architecture of the *Philosophy of Right*. If war were merely a result of external anarchy, it would belong to the realm of contingency. Instead, Hegel locates the necessity of war within the *concept* of the State itself. The "regrettable necessity" gloss fails to survive contact with the text for three specific reasons.

  **1. The Pathology of Civil Society**
  For Hegel, "Civil Society" (§182–256) is the realm of the "system of needs." It is where individuals pursue private property, security, and self-interest. Left to its own devices, Civil Society tends toward ethical rot: atomization, extreme inequality, and a fixation on "finite ends" (money, comfort, longevity).

  The State's role is to sublimate this selfishness into "ethical life" (*Sittlichkeit*). But how do you remind a citizenry obsessed with property that the Universal matters more than their private holdings? Peace allows the "roots of particularity" to sink too deep. As Hegel writes, prolonged peace makes men "more fixed in their particularity." War is the mechanism that disrupts this fixation. It is not just a clash of armies; it is the cure for the internal disease of materialism. If the external threat vanished, the internal pathology would remain. The *function* of war is required even if the *enemy* is absent.

  **2. The Metaphysics of the "Stagnant Pools"**
  The famous passage in the Addition to §324 is often softened by translators, but the logic is stark: *"Just as the blowing of the wind preserves the sea from the foulness which would be the result of a prolonged calm, so also corruption in nations would be the product of prolonged, let alone 'perpetual', peace."*

  Note the target of the critique. Hegel isn't talking about diplomatic gridlock; he is talking about *ethical corruption*. A "perpetual peace" (Kant's goal) is, for Hegel, an ethical disaster. Why? Because freedom, for Hegel, is not the security of life and property. Freedom is the capacity to negate the natural instinct for self-preservation in service of the Universal.

  War provides the "moment of negativity." It reveals the "vanity of finite things." If a state guarantees perfect security forever, it turns citizens into consumers of safety rather than participants in freedom. The "wind" isn't just clearing away diplomatic stagnation; it is aerating the ethical soul of the people. Without it, the water goes foul.

  **3. Sovereignty is Defined by the Risk of Death**
  The "realist" gloss assumes the State is essentially a service provider (protecting life/property) that occasionally fails at the border. But for Hegel, the State is only actualized when it demands the ultimate sacrifice. In §324, Hegel argues that the "relation of sovereign states" is resolved in war because that is where the "ideality" of the State becomes real.

  Why? Because only in risking life does the citizen prove they are not merely a biological organism or a property owner. This is why Hegel distinguishes "courage" as a *formal* virtue. It doesn't matter *what* you are fighting for materially; what matters is the *act* of risking the material self.

  If the "realist" gloss were true, a state with no enemies would be a perfectly successful state. For Hegel, a state with no possibility of war is a contradiction in terms. It would be a "Civil Society" masquerading as a State. It would lack the moment of negation that gives ethical life its seriousness.

  **The Verdict**
  The "descriptive" reading tries to save Hegel from the charge of militarism by claiming he is just describing the world as it is. But Hegel is describing the world as it *must be* to sustain freedom. He is not saying, "War happens because there are no cops." He is saying, "War must remain possible, because without the demand for sacrifice, the State dissolves back into a marketplace of self-interest."

  On this reading, a state facing no genuine enemies faces a crisis of legitimacy. It must either cultivate the *readiness* for war (keeping the "wind" blowing) or accept ethical stagnation. The "realist" defense protects Hegel's reputation, but it eviscerates his system. The text demands the stronger thesis: War is not just a structural inevitability; it is an ethical requirement.
