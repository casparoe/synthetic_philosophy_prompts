      *   *Key Argument 2: Truth vs. Existence.* The set exists regardless of truth. The proposition aims at truth. The "unity" of a proposition is about its ability to be true or false. A set is just a collection.
      *   *Key Argument 3: Intensionality.* "Morning Star" vs. "Evening Star". Extensional sets treat them as identical if the referent is the same. Propositions care about the *mode of presentation*.
      *   *Conclusion:* Codd solved the *engineering* problem of representation, not the *ontological* problem of existence.

