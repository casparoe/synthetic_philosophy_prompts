      *Wait, one more check:* The user asks about the "logical and emotional register." I need to focus heavily on the *affect* of the passage. It's melancholic. It's the sigh of a Christian realist.

      *Structure:*
      1. The Tone: Tragic Pragmatism (not Hobbesian triumph).
