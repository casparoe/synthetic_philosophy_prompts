      *   *Section 2: The Three Orders.* Crucial for Pascal. Force $\neq$ Justice. They belong to different kingdoms. Merging them is a category error necessitated by sin.
      *   *Section 3: Comparison with Hobbes.* Hobbes wants to solve the problem politically. Pascal wants to diagnose it theologically. Hobbes: Force *becomes* Right. Pascal: Force is *called* Right (misleadingly).
      *   *Section 4: The "Mystical Foundation" Connection.* Address the user's point about not telling the people. This is the "double truth" strategy. The elite know the truth (force); the masses believe the myth (justice). Both are necessary for peace.
