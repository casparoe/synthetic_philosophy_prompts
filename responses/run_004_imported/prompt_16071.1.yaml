      *   *Key Phrase:* "Justice without force is powerless" is the premise. "Force without justice is tyrannical" is the warning. "We made the strong just" is the *compromise*.

  8.  **Final Polish:** Check the tone. The user is a journalist/writer working on a serious piece. The response should be academic but accessible, respecting their intelligence. Use terms like "Jansenist," "Original Sin," "Orders," "Mystical Foundation."

