answer: |-
  I am so incredibly sorry for your loss. Losing a parent is hard enough; losing them in a sudden, traumatic way, while navigating medical complexities and family grief dynamics, is an immense burden to carry just days before you have to speak. You are doing a brave thing by trying to find words that hold space for everyone.

  Here is a draft that focuses on his life and character, while navigating the "moment of death" carefully. It frames the disagreement not as a conflict of facts, but as a difference in how love perceives presence.

  Please feel free to edit this heavily. It needs to sound like *you*.

  ***

  **Eulogy for [Dad's Name]**

  Thank you all for being here. Looking around this room, I see the two worlds that [Dad's Name] lived in most fully. I see his family, who knew his history and his heart. And I see his brothers and sisters from the road, who knew his spirit and his sense of freedom. If there is one thing that connects everyone in this room, it's that we all know what it felt like to be loved by him.

  [Dad's Name] was a man who lived in the present tense. Whether he was at the kitchen table or out on the highway, he was fully *there*. He didn't do things halfway. He didn't offer half-measures. When he cared about you, you knew it. When he committed to something, he saw it through. That was the engine that drove him.

  We are gathered here to say goodbye, though anyone who knew him knows that "goodbye" is a complicated word when it comes to [Dad's Name].

  The end of his life wasn't a single second where the room went quiet. He left us in layers. In the days after the crash, as we kept our vigil, I realized that grief doesn't follow a clock. For some of us, he was present as long as his heart kept its rhythm, warm and fighting, refusing to let go of the physical world he loved. For others, he had already ridden on the moment the light behind his eyes dimmed, his spirit leaving before the machinery stopped.

  I used to worry about that difference. I wondered who was right about when we actually lost him. But I've come to understand that the disagreement isn't about time or medicine. It's about how we loved him.

  A mother's love holds onto the physical warmth as long as humanly possible. It sees the son she brought into the world and refuses to let him vanish. A sister's love recognizes the person she knew instantly, knowing that when the mind is gone, the person has already departed. Both perspectives are true. Both are valid. And both are testaments to how deeply he was cherished. He was loved in every way a human being can be loved, right up until the very end.

  And even then, he wasn't done giving. [Dad's Name] always helped people when he could. He was the guy who'd pull over on the shoulder to fix a stranger's bike, or lend a hand without being asked. It makes sense that his final act was one of generosity. He kept giving, even when he couldn't speak, even when he couldn't ride. That wasn't a medical procedure; that was him. That was his character.

  To his biking family: Thank you for riding with him. Thank you for the miles you shared, for the freedom you honored in him, and for standing with us today. He loved that life. He loved the open road, the wind, and the camaraderie of the group. He rode hard, and he lived harder.

  To my family: We are going to be okay. Not today, and maybe not for a long time. But we will be okay. Because [Dad's Name] didn't leave us empty-handed. He left us with memories that are louder than any silence. He left us with a legacy of generosity. And he left us with each other.

  So, we aren't just here to mark a death. We are here to honor a life that was lived at full throttle.

  Dad, you don't have to fight anymore. You don't have to hold on. The road ahead is clear. We'll handle things here. You just ride.

  We love you.
