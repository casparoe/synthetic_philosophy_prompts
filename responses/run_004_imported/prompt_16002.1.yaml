answer: |-
  # SEMINAR HANDOUT: The Internalist Recuperation of Moral Perception
  **Topic:** Reasons for Action | **Focus:** Williams vs. McDowell on the Subjective Motivational Set

  ### 1. The Stalemate
  **Williams's Internalism (IRT):** The statement "A has a reason to $\phi$" is true only if A could reach the conclusion to $\phi$ via a sound deliberative route from their existing Subjective Motivational Set ($S$). $S$ contains desires, projects, commitments, and dispositions. Deliberation can extend $S$ (means-end reasoning, imagination, consistency), but it cannot generate motivation *ex nihilo*.

  **McDowell's Challenge:** Williams presupposes a Humean psychology (belief + desire). On an Aristotelian view, the virtuous agent does not act to satisfy a pre-existing desire in $S$. They act because they **perceive** a demand in the situation. This perception provides the reason. The reason exists in the world (as a value property), not in the psyche. Thus, the reason is external to $S$.

  ### 2. The Argument: Why McDowell's "Perception" Collapses into Internalism
  *The following argument contends that McDowell's appeal to moral sensitivity fails to secure external reasons because the capacity for sensitivity must itself reside in $S$.*

  **P1. The Condition of Motivational Efficacy.**
  For a perceived value (e.g., "this is cruel") to function as a reason for action for agent $A$, $A$ must be psychologically constituted such that perceiving this value generates a motivation to act. A stone cannot perceive value; a psychopath might perceive it but remain unmoved. Therefore, the reason's efficacy depends on a specific psychological capacity in $A$.

  **P2. The Nature of the Capacity.**
  This capacity (moral sensitivity/virtue) is a stable dispositional state of the agent. It is not an occurrent desire, but it is a standing tendency to be moved by specific features of the world. Let us call this disposition $D_{virtue}$.

  **P3. The Location of Dispositions.**
  Williams's $S$ is not limited to occurrent desires. It includes "dispositions of evaluation, patterns of emotional reaction, personal loyalties, and various projects... embodying commitments of the agent." (Williams, 1981). Any stable dispositional state that grounds motivation counts as an element of $S$.

  **P4. The Assimilation.**
  Therefore, $D_{virtue}$ is an element of $S$. When McDowell's virtuous agent perceives a reason, they are exercising $D_{virtue}$. The deliberative route from $S$ to action is: *Exercise of $D_{virtue}$ $\to$ Perception of Value $\to$ Motivation.*

  **P5. The Acquisition Problem.**
  McDowell might argue $D_{virtue}$ allows access to *new* reasons not previously in $S$. But how is $D_{virtue}$ acquired?
  *   **Option A (Rational Persuasion):** If $D_{virtue}$ is acquired through argument or reflection, that reflection must have hooked onto *prior* elements of $S$ (e.g., a desire to be rational, to fit in, to be good). If so, the new reason is still traceable to the old $S$ via deliberation. Williams wins.
  *   **Option B (Non-Rational Conditioning):** If $D_{virtue}$ is instilled via non-rational habituation (causal conditioning), then the resulting motivation is not grounded in *reasons* but in causes. Williams wins (this is not a reason statement).
  *   **Option C (Brute Emergence):** If $D_{virtue}$ simply appears without prior $S$-grounding, it is a mystery how it is rational. If it is not rational, it does not secure normative reasons.

  **C. Conclusion.**
  McDowell's "external" reason is only accessible to an agent who possesses $D_{virtue}$. Since $D_{virtue}$ is a subjective dispositional state falling within the definition of $S$, the truth condition for "A has a reason to $\phi$" still relies on the constitution of $A$'s psychology. Williams's requirement survives: there is no reason for $A$ unless $A$ has the subjective capacity to be moved by it. McDowell has not escaped Internalism; he has merely described a sophisticated, cultivated subset of $S$.

  ---

  ### 3. Critical Discussion Points

  1.  **The Normativity Objection:** McDowell will argue this misses the point. He isn't explaining *motivation* (psychology); he's explaining *justification* (normativity). Even if the capacity is in $S$, the *truth* of the reason statement depends on the objective value, not the capacity.
      *   *Counter:* Williams is analyzing the truth conditions of "A has a reason." If A lacks the capacity, the statement is false for A. Doesn't that make the capacity the truth-maker?

  2.  **The "Sound Deliberation" Constraint:** Williams insists on a *sound deliberative route*. If moral education involves reshaping $S$ through non-deliberative habituation, does Williams have to admit that some "reasons" are actually just causal pushes?
      *   *Challenge:* Can Williams account for radical moral conversion (e.g., Saul to Paul) without conceding externalism?

  3.  **The Content vs. Ground Distinction:** Can we separate the *content* of the reason (external value) from the *ground* of the reason (internal capacity)? If Williams only cares about the ground, does McDowell win on the content? Does this distinction matter for action theory?

  ### 4. Suggested Reading
  *   **Bernard Williams,** "Internal and External Reasons" (1981). *Focus on the definition of the Subjective Motivational Set.*
  *   **John McDowell,** "Might There Be External Reasons?" (1995). *Focus on the analogy with secondary qualities and moral perception.*
  *   **David Velleman,** "The Guise of the Good" (1992). *For a view on how motivation tracks intelligibility rather than desire.*

  ---
  *Seminar Task: Diagram the deliberative route for a virtuous agent under both Williams's and McDowell's models. Identify exactly where the "external" element is supposed to enter the chain.*
