      *   Avoid vague language. Use formal notation where helpful (e.g., $A$, $S$, $\phi$).
      *   Anticipate the McDowellian reply. McDowell might say, "No, the reason is *in the world*, not in the psyche."
      *   Counter-reply: Even if the *justification* is in the world, the *motivating reason* requires a psychological hook. Williams is talking about explanatory reasons/motivation, not just normative justification. Wait, Williams is talking about truth conditions for "A has a reason."
      *   *Crucial Distinction:* We need to ensure we don't conflate *normative* reasons (justification) with *motivating* reasons (psychology). Williams claims that for "A has a reason to $\phi$" to be true, there must be a link to $S$. McDowell says the truth condition is the objective value.
      *   *The Trap:* If McDowell says the virtuous person *comes to have* the sensitivity, then prior to that, did they have the reason?
          *   If yes: How could they deliberate to it? (Williams says they can't).
          *   If no: Then the reason only exists once the sensitivity is acquired. But the sensitivity is a state of the agent. So the reason is internal to the agent's constitution.
      *   *Focus:* The prompt asks to argue that the *newly acquired sensitivity* is an addition to $S$. So, the argument should focus on the transition from non-virtuous to virtuous.
      *   *Argument:* To acquire the sensitivity, there must be a deliberative route (or brute causation). If brute causation, it's not a reason. If deliberative, it stems from $S$. Once acquired, the sensitivity functions as a disposition within $S$.

  5.  **Structuring the Handout:**
