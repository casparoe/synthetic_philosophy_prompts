      *   *Key Insight:* The "capacity to perceive reasons" is a psychological state. Williams's $S$ isn't just "current occurrent desires." It includes dispositions, commitments, and patterns of evaluation. A cultivated moral sensitivity is just a complex, stable disposition within $S$.
      *   *The "Sound Deliberation" point:* Williams allows $S$ to be modified by deliberation. If moral education is a form of deliberation (or rational persuasion), it works on existing $S$-elements (e.g., desire for social approval, desire to be rational). If it's *not* rational persuasion (it's conditioning), then it's not reason-giving. McDowell wants it to be rational. If it's rational, it's Internal.

