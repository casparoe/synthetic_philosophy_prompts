prompt: |-
  Working on a handout for my seminar on reasons for action and want something meatier than the usual internalism-vs-externalism throat-clearing. Williams's whole case against external reasons hangs on the claim that sound deliberation only ever works on stuff already sitting in the agent's S -- it can rearrange or extend what's there, but it can't conjure motivation out of nowhere. McDowell's comeback is basically that this bakes in a Humean picture of deliberation for free, and that on a more Aristotlean view a well brought-up person can come to be motivated by *seeing* a reason for the first time, not by shuffling pre-existing bits of S. Can you make the case that McDowell's move doesn't actually get him external reasons -- that any newly acquired sensitivity to a reason just is an addition to S, so Williams's requirement survives untouched? Actually run the argument, don't just narrate the exchange.
