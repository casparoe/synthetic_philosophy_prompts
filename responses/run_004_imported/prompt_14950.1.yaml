answer: |-
  Here is a draft for the toast. It is designed to run about five minutes at a moderate speaking pace. I have included stage directions in brackets to help with timing and delivery.

  **Tone Notes:**
  *   **The Philosophy Bit:** The goal here is to validate Dan's *integrity* without validating or invalidating the *theology*. It frames his agnosticism as a result of sincerity, not rebellion.
  *   **The Grandparents:** The speech explicitly acknowledges the room's diversity of belief as a good thing, ensuring the religious guests feel welcome rather than targeted.
  *   **The Pivot:** The transition moves quickly from "divine silence" to "human clarity," making the marriage the solution to the philosophical problem.

  ***

  **The Toast**

  [Stand up, tap the microphone gently. Smile at the room.]

  Good evening, everyone. For those who don't know me, I'm [Your Name]. I'm a software engineer, which means I spend most of my life looking for bugs in code. Dan, on the other hand, spent his twenties looking for bugs in the universe.

  I met Dan in college in a Christian fellowship group. Back then, Dan was the guy reading the footnotes in the study guide. He was earnest, he was devout, and he took the big questions seriously. Most of us were just trying to pass Calculus; Dan was trying to reconcile metaphysics with his daily life.

  But Dan is also a guy who follows the data. And somewhere in his mid-twenties, Dan ran into a problem that changed his trajectory. Now, I'm not a philosopher, and this isn't the venue for a lecture, but I know how Dan's mind works.

  For Dan, the question wasn't about why bad things happen. He gets frustrated when people assume that's what it was about. For him, it was about the silence. He operated on the premise that if a God wanted a relationship with you, He would make sure you knew He was there. Dan looked. He looked sincerely, he looked persistently, and he felt he got silence in return. And he eventually concluded that the silence *was* the answer.

  [Pause briefly. Look toward the grandparents' section, warm and respectful.]

  Now, I look around this room and I see people who looked at that same silence and found a voice. We have Claire's family here, whose faith is a beautiful example of devotion and love. And we have Dan's friends here, who share his skepticism. One of the things I love about this couple is that they bring these two worlds together without friction. They prove that you can disagree on the metaphysics but agree on the ethics. You can walk different paths and still end up at the same table.

  But here is what matters for today.

  Living with that level of intellectual honesty is heavy. Dan knows what it is to want reassurance and not get it. He knows the weight of wondering if you're truly seen or truly loved by the universe.

  And because he knows that weight, he has made a vow to never inflict it on Claire.

  [Turn to look at Dan and Claire.]

  Dan, you might believe that the heavens are silent. But you have never, not once, left Claire wondering where she stands with you. You don't make her search for evidence. You don't make her parse the data. When you say you love her, it is not a hypothesis to be tested. It is a fact.

  If there is any hiddenness in this marriage, it's only hidden how you managed to find someone as patient and wonderful as Claire.

  Claire, you are the clarity in his life. You are the answer to the question he stopped asking. And Dan, your commitment to her is the loudest thing in the room.

  So, if everyone could please rise and fill their glasses.

  [Raise glass]

  To Dan and Claire. May your home always be loud with laughter, clear with communication, and full of love.

  To the happy couple!

  [Take a sip, sit down.]
