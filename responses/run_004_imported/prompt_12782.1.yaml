      *   *The Real Conflict:* The conflict wasn't internal (Science vs. Mysticism). It was external (Truth vs. Social/Institutional Survival). He hid his theology because he would be fired/excommunicated. He hid alchemy because it was esoteric and potentially dangerous (politically/religiously).
      *   *Conclusion:* The "rational vs. mystic" internal war is largely a modern projection. Newton likely saw himself as a unified seeker of divine truth.

