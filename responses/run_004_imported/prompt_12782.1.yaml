      *   *Newton's Prophecy:* Yes, he wrote extensively on Daniel and Revelation, trying to date the Apocalypse and understand the corruption of the Church.
      *   *The "Two Newtons" Debate:* This is the core historiographical issue. Keynes called him "the last of the magicians." Westfall (biographer) struggled with the unity of Newton's thought. More recent scholarship (Snobelen, Iliffe, Hunter) argues for *unity* rather than conflict.
