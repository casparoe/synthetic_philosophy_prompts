answer: |-
  This is an excellent question, and it shows a level of historical self-awareness that many historical novelists lack. You have correctly identified the facts of Newton's life, but you are rightly worrying about the *interpretation* of those facts.

  Here is the sanity check you asked for, based on the current state of Newtonian scholarship (specifically the work of biographers like Richard Westfall, and historians of science like Rob Iliffe, Stephen Snobelen, and Betty Jo Teeter Dobbs).

  ### The Short Answer
  You are projecting a 19th-century conflict onto a 17th-century mind.

  The framing of "Rational Scientist vs. Secret Mystic" is largely a historiographical artifact from the early 20th century (famously coined by economist John Maynard Keynes, who bought Newton's papers in 1936 and called him "the last of the magicians"). For a long time, scholars tried to explain this away as a sad compartmentalization.

  However, the last 40 years of research into the Newton Project (digitizing his manuscripts) suggests **Newton did not experience these things as conflicting.** To him, they were a unified project.

  ### The Nuanced Picture

  **1. Science and Theology were not separate spheres.**
  In Newton's time, "Natural Philosophy" (science) was a form of worship. Studying the mechanics of the universe was studying the handiwork of God.
  *   **The Problem of Gravity:** When Newton published the *Principia*, he actually caught flak from rationalists (like Leibniz) who argued that "action at a distance" (gravity working across empty space) was occult nonsense. Newton's solution? **God.** He posited that God's sensorium permeated space, allowing forces to act. His physics *required* his theology to make sense.
  *   **Alchemy:** Newton wasn't trying to make gold to get rich. He was studying alchemy to understand the "vegetable spirit" of nature—how matter moves and interacts. He believed the ancients possessed a *prisca sapientia* (ancient wisdom) that knew how the universe worked, and he was trying to recover it. This wasn't a hobby; it was research into the active principles of matter.

  **2. The Heresy was Political, not Psychological.**
  You are correct that he was an Arian (believing Christ was subordinate to the Father, not co-equal). This was a capital offense in terms of career security.
  *   **The Conflict:** The tension wasn't "I am a scientist but I believe crazy religious things." The tension was "I have recovered the true primitive religion of the early Church, but the corrupted Anglican Church will fire me if I admit it."
  *   **The Secrecy:** He didn't hide his theology because he felt irrational. He hid it because he was a pragmatist who wanted to keep his Lucasian Chair. He viewed the Trinity as a corruption introduced by the Athanasians (the "Athanasian imposture"), and he saw himself as a guardian of the true truth.

  **3. The "Inner Conflict" is actually "Isolation."**
  Newton was profoundly solitary, paranoid, and messianic. He didn't feel like a hypocrite; he felt like a prophet in a land of the blind.
  *   If you make his conflict about *shame* (that his alchemy is "crackpot"), you are imposing modern materialism on him.
  *   If you make his conflict about *burden* (that he knows the truth but cannot speak it without being destroyed), you are historically accurate.

  ### How to Save Your Plot (Without Losing the Drama)

  You don't need to scrap the emotional engine, but you should tune it. The drama of a man hiding a double life is still valid; the *reason* for the hiding just needs adjustment.

  **1. Reframe the "Burning Notes" Scene.**
  *   **Current Draft:** He burns them because he's ashamed that his rational mind is compromised by mysticism.
  *   **Historical Revision:** He burns them (or hides them) because a visitor is coming, or because he hasn't perfected the theory yet. Newton was a perfectionist who published very little. He feared controversy (see his feuds with Hooke and Flamsteed).
  *   **The Emotion:** It's not "I am crazy." It's "The world is not ready for this, and they will use it to destroy me." This makes him more tragic and less self-loathing.

  **2. The Real Tension: Control vs. Chaos.**
  Newton's personality was defined by a need for absolute control (over his work, his rivals, his emotions).
  *   **Alchemy/Theology:** These fields are messy, ambiguous, and interpretive.
  *   **Mathematics/Physics:** These offer certainty and proof.
  *   **The Conflict:** Instead of Science vs. Magic, make it **Certainty vs. Mystery.** Newton craved a universe that was perfectly legible. His alchemical and prophetic work often led him into labyrinthine dead-ends. The frustration comes from his inability to *solve* God, not from a belief that he shouldn't be trying.

  **3. Use the "Corruption" Angle.**
  Newton believed the world was in a state of decay and that the Church had been corrupted by pagan philosophy (specifically the Trinity, which he viewed as a polytheistic infection).
  *   **Plot Hook:** His drive to find a "mechanistic universe" is actually a drive to find a "pure" universe, untainted by the corruption he sees in theology. He wants to strip the world down to raw laws because raw laws don't lie. People lie. Priests lie. Gravity does not lie.

  ### Recommended Reading for the "Vibe"
  If you want to capture his internal voice without the anachronism:
  *   **"Newton: The Making of a Genius" by Patricia Fara:** Good on the cultural context.
  *   **"The Last Sorcerer" by Michael White:** A biography that leans into the alchemy but keeps the narrative flow.
  *   **Rob Iliffe's "Priest of Nature":** This is the big one. Iliffe argues explicitly against the "two Newtons" theory. Reading his introduction would be invaluable for your character's internal monologue.
  *   **Key Concept:** Look up **"Arianism"** and **"Socinianism."** Understand *why* he rejected the Trinity. It wasn't rebellion; it was textual rigor. He thought the Bible clearly said Jesus was created. To him, the Trinity was bad math.

  ### Summary
  Your instinct that there is tension is correct, but the *nature* of the tension is different.
  *   **Don't write:** "I am a man of science pretending to be a mystic."
  *   **Do write:** "I am a man who sees the architecture of God in both the falling apple and the prophecy of Daniel, but I live among men who would burn me for saying so."

  That gives you the secrecy, the paranoia, and the isolation (which were very real Newtonian traits) without forcing him to be a modern secularist in a periwig. It actually makes him *more* complex, because his faith is the engine of his science, not the brake.
