answer: |-
  **MEMORANDUM FOR THE RECORD**

  **FROM:** Conscientious Objector Review Board (CORB)
  **TO:** Commander, Personnel Command
  **DATE:** October 26, 2023
  **SUBJECT:** Adjudication of Petition for Conscientious Objector Status (Petitioner: C) and Policy Recommendation Regarding Selective Objection

  **1. PURPOSE**
  This memo conveys the Board's finding regarding the petition of Service Member C for Conscientious Objector (CO) status and provides a recommendation on whether current Department of Defense policy regarding "selective conscientious objection" should be revised.

  **2. FACTS OF THE CASE**
  Petitioner C is currently assigned to [Operation Name]. C's religious and ethical training records indicate a history of faithful service and no prior disciplinary issues. C's petition states unequivocally that they do not object to war *in any form*. C has affirmed a willingness to deploy in defense of the homeland or in humanitarian interventions aimed at stopping genocide.

  C's objection is specific to the *jus ad bellum* (justice of going to war) of the current operation. C asserts, based on personal moral reasoning, that this specific operation lacks a just cause and constitutes an act of aggression rather than defense. C raises no objections regarding the *jus in bello* (conduct in war); C does not claim the operation is being conducted unlawfully or disproportionately. C requests CO status solely on the grounds that participation in *this* specific conflict violates their conscience.

  **3. ADJUDICATION UNDER CURRENT POLICY**
  Current military regulation (consistent with 10 U.S.C. § 1132 and DoD Instruction 1300.06) defines a conscientious objector as one who is "opposed to participation in war in any form." The regulation explicitly excludes objection to a particular war.

  **Ruling:** The Board finds that Petitioner C's beliefs, while sincerely held, do not meet the statutory definition of conscientious objection. C's willingness to fight in other conflicts disqualifies them from CO status under existing law.
  **Decision:** Petition **DENIED**.

  **4. POLICY RECOMMENDATION**
  While the Board is bound to deny C's petition under current statutes, we are asked to recommend whether the policy excluding "selective conscientious objection" (SCO) should be revisited.

  **Recommendation:** The Board recommends **against** revising policy to recognize selective conscientious objection at this time. While the moral intuition behind C's petition is significant, institutionalizing SCO would undermine the principle of civilian control of the military and operational cohesion. However, this recommendation is made with the acknowledgment that the traditional justification for this policy rests on a theoretical framework that has been rigorously challenged by contemporary just war theorists.

  **5. THEORETICAL CONSIDERATIONS AND ENGAGEMENT**
  The current policy rests on the traditional Just War framework, most notably articulated by Michael Walzer, which posits the "Moral Equality of Combatants" (MEC). Under this view, once a war has been declared by legitimate authority, soldiers on both sides possess an equal right to kill and are equally liable to be killed, provided they observe the rules of engagement (*jus in bello*). This separation allows soldiers to function as instruments of the state without bearing personal moral responsibility for the decision to go to war (*jus ad bellum*), which is reserved for political leadership.

  However, the Board must seriously engage the strongest argument against this position: the **Liability-Based Challenge** advanced by revisionist theorists such as Jeff McMahan.

  **A. The McMahan Challenge**
  McMahan argues that the Moral Equality of Combatants is a moral fiction. He posits that liability to attack is derived from moral responsibility for a wrongful threat. Therefore:
  1.  Combatants fighting for an unjust cause are not morally permitted to kill; by doing so, they make themselves liable to defensive force.
  2.  Combatants fighting for a just cause do not make themselves liable to attack (provided they discriminate and proportionate force).
  3.  Consequently, a soldier asked to fight in an unjust war is being asked to become an agent of aggression. To force a soldier to participate in an unjust war is to compel them to commit a moral wrong for which they bear individual responsibility.

  From this perspective, Petitioner C is morally correct. If the war is indeed unjust, C is not merely disobeying an order; C is refusing to become morally liable for aggression. McMahan's framework suggests that conscience is not a blanket rejection of violence, but a specific moral calibration of *this* violence. To deny C is to force them to violate the deep moral truth that one cannot be innocent while committing aggression.

  **B. Board Analysis of the Challenge**
  The Board acknowledges the force of McMahan's moral ontology. It is difficult to refute the claim that individual moral agency cannot be entirely surrendered to the state. If a soldier knows a war is unjust, the "Nuremberg Defense" (following orders) has limited moral currency.

  However, the Board recommends maintaining the current policy for the following institutional and epistemic reasons, which outweigh the theoretical purity of the liability model:

  1.  **Epistemic Limitations:** McMahan's model requires individual soldiers to accurately assess the *jus ad bellum* status of a conflict. Modern warfare relies on classified intelligence, complex diplomatic histories, and strategic nuances unavailable to the average service member. Allowing SCO presumes soldiers have access to the same information as the Commander-in-Chief. If policy changes, we risk a military where deployment depends on a soldier's personal (and potentially misinformed) analysis of geopolitical causality rather than strategic necessity.
  2.  **The Function of the Convention:** Walzer's MEC is best understood not as a metaphysical truth, but as a necessary *convention*. It creates a bright line between the political sphere (deciding *if* we fight) and the military sphere (deciding *how* we fight). Blurring this line by allowing soldiers to judge the cause invites the fragmentation of the military into political factions. A military that can selectively enforce policy based on the moral views of its personnel ceases to be a tool of the state and becomes a collection of moral arbiters.
  3.  **Equality of Burden:** If SCO is recognized, the burden of combat falls disproportionately on those less philosophically inclined or economically disadvantaged, while those with the education to articulate a "just war" objection opt out. This creates a inequity in service distribution that undermines the citizen-army ideal.

  **6. CONCLUSION**
  Petitioner C's petition is denied based on existing statutory definitions. Regarding policy, while we recognize the strength of Jeff McMahan's argument that individual liability tracks the justice of the cause, we conclude that the military cannot function as a tribunal for *jus ad bellum* determinations at the individual level. The "Moral Equality of Combatants" remains a necessary institutional fiction to preserve civilian control and unit cohesion, even if it fails to capture the full nuance of individual moral liability.

  The Board suggests that rather than changing CO policy, the Department should enhance *jus ad bellum* ethical training for leadership, ensuring that the question of "just cause" is rigorously debated *before* troops are ordered to deploy, thereby reducing the incidence of soldiers like C being placed in this position.

  **APPROVED:**

  *[Signature]*

  **Chair, Conscientious Objector Review Board**
