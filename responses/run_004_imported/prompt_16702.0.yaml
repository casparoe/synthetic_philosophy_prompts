  2.  **Deconstruct the Arguments:**

      *   **Move (1) Marcus (Consequentialist Justification):** Harsh punishment for a few deters many. If net harm is reduced, it's justified.
          *   *Strengths:* Classic utilitarian logic. Clear metric (aggregate welfare).
          *   *Weaknesses:* Ignores rights/justice of the individual. The "punishing the innocent" objection (though here they are guilty, just over-punished).
      *   **Move (2) Ines (Retributivist/Deontological Objection):** Treats people as means, not ends. Punishment must fit desert, not utility.
          *   *Strengths:* Protects individual rights. Aligns with intuitive justice (proportionality).
          *   *Weaknesses:* "Desert" is vague. Doesn't account for systemic harm well.
      *   **Move (3) Marcus (Retributivist Co-optation):** Desert *should* track harm. Systemic harm is real. So, harsh punishment *is* deserved because the offense contributes to a harmful system.
          *   *Strengths:* Attempts to bridge the gap. Acknowledges that individual acts have collective consequences.
          *   *Weaknesses:* Risks inflating individual responsibility for collective outcomes.
      *   **Move (4) Ines (The "Proves Too Much" Rebuttal):** If desert tracks aggregate harm caused by *others*, you are still punishing for others' choices. This is the "mere means" problem in disguise.
          *   *Strengths:* Exposes the logical flaw in Marcus's hybrid view. Maintains the individualistic nature of culpability.
          *   *Weaknesses:* Might underestimate the complicity in systemic issues (though less relevant for fare evasion).

  3.  **Evaluate Each Move (Step-by-Step):**

