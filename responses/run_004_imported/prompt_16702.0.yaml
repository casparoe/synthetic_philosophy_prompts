      *   *Check:* Did I address the "arbitrary desert" point? *Yes,* in the section about the retributivist dilemma.
      *   *Check:* Is the "Fair Play" theory relevant? *Yes,* it's the standard alternative for public order offenses like fare evasion.

  8.  **Final Polish:** Organize with clear headings. Ensure the distinction between "punishing the innocent" and "punishing the guilty disproportionately" is clear (this is the latter, often called "excessive punishment" or "scapegoating the guilty").

  *(Self-Correction Note)*: Wait, the prompt asks about "punishing the innocent" in the intro, but the scenario is about punishing *fare evaders* (guilty) disproportionately. I need to be careful not to conflate the two. The philosophical principle is similar (using people as means), but the technical distinction matters. Marcus isn't proposing punishing innocents, just *over-punishing* the guilty. I should note this distinction in the analysis of (1).

  9.  **Finalizing the Structure:**
      *   Intro.
      *   Analysis of Moves 1-4.
      *   Can Marcus Rescue (3)?
      *   The Retributivist Dilemma.
      *   Missing Considerations.
