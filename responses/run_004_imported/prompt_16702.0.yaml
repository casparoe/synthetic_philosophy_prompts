      *   *(3) Marcus:* Clever attempt to redefine desert. *Verdict:* Problematic. It conflates *causal contribution* with *total harm*.
      *   *(4) Ines:* Strong critique of (3). *Verdict:* Logically decisive against Marcus's specific formulation in (3).

