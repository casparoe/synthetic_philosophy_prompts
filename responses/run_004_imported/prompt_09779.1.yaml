      *   *Key Nuance:* Bradley isn't just saying "it's annoying to add more links." He's saying the *ontological status* of a relation is contradictory. A relation must be both one (unifying the terms) and many (distinct from the terms).

  3.  **Analyze RDF Reification & Alternatives (The Technical Core):**
      *   *Standard Reification:* Turn $(s, p, o)$ into a resource $X$. Add $(X, \text{rdf:subject}, s)$, $(X, \text{rdf:predicate}, p)$, $(X, \text{rdf:object}, o)$. Then add metadata to $X$ (e.g., $(X, \text{dc:creator}, \text{Alice})$).
