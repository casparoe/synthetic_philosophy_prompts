          *   *Common Knowledge:* Swapping numbers isn't swapping mental models.
          *   *Human Limitations:* We aren't perfect Bayesian updaters.
      *   **Actionable Advice:** How to actually close the gap. (Swap models, not numbers).
      *   **Conclusion:** Reassure them it's not irrationality, it's human cognition.

