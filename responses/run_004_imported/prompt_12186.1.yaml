answer: |-
  **Cambridge, 1888. A private room at the Society for Psychical Research. The gaslight is low. Two men sit at a scarred wooden table, waiting for the medium to arrive. Henry Sidgwick rubs his temples. Across from him sits Julian Huxley—a fictionalized composite of the Society's more materialist council members—shuffling a stack of notes on recent fraudulent séances.**

  **Huxley:** You look weary, Henry. If you are coming down with a chill, we might postpone. Mrs. Guppy is notorious for tardiness, and I have no desire to freeze in the dark for the sake of rapping spirits.

  **Sidgwick:** It is not the cold, Julian. It is the repetition. We spend our evenings exposing frauds, which is necessary work, I grant you. But we rarely find anything that survives the exposure.

  **Huxley:** Precisely my point. And yet, you insist this inquiry is of "paramount philosophical importance." I must confess, I struggle to see how. Even if tonight a table levitates, or a spirit speaks through a trumpet—what then? You are a moral philosopher, not a ghost hunter. You cannot derive an *ought* from a specter.

  **Sidgwick:** You think the categories are distinct. I am beginning to suspect they are not.

  **Huxley:** They must be. If your ethics rely on the existence of ghosts, you do not have ethics. You have a wager. If virtue requires the promise of a post-mortem reward to be rational, then it is not virtue. It is enlightened self-interest. You are asking me to validate a bribe from the grave.

  **Sidgwick:** (Leaning forward) You mistake the nature of the inquiry. I am not seeking a bribe. I am seeking a sanction. Look at the structure of reason itself. It commands me to pursue my own happiness. It also commands me to pursue the general good. In this life, these two often contradict. The martyr dies; the scoundrel thrives.

  **Huxley:** That is the human condition. We act rightly *despite* the cost. That is what makes it noble.

  **Sidgwick:** Is it noble? Or is it irrational? If the universe is constructed such that doing one's duty leads inevitably to a net loss of well-being for the agent, then the universe is fundamentally hostile to morality. Reason becomes divided against itself. I cannot be expected to follow a law of reason that leads to my own ruin, unless I know that the ruin is not final.

  **Huxley:** So, morality is contingent on physics? On whether the soul survives the decay of the brain? That seems a fragile foundation. If you require empirical proof that justice prevails before you will be just, you have already surrendered the moral ground.

  **Sidgwick:** I do not require it for my *conduct*, Julian. I behave as a Utilitarian regardless. I require it for my *sanity*. I need to know that the moral law is not a delusion of the human mind projected onto a void. If death is the end, then the conflict between self-interest and duty is permanent. The Dualism remains. Ethics becomes a system of commands without a sovereign.

  **Huxley:** But suppose we find what we are looking for. Suppose we prove, to your satisfaction, that consciousness survives. That there is a realm where the martyr is compensated. Have you not then destroyed the very morality you seek to save? If I am good *because* I know I will be happy in the next life, I am no longer acting from duty. I am acting from prudence. You solve the Dualism by collapsing Duty into Egoism.

  **Sidgwick:** (Pauses, looking at his hands) That is the risk. I admit it. If the reward is too explicit, the moral worth evaporates. But consider the alternative. If there is *no* possibility of that harmony, then Duty is a demand to sacrifice my rational self-interest for no ultimate reason. Why should Reason demand I cut off my own limb for the sake of the body, if the body itself is hurtling toward extinction?

  **Huxley:** Because it is Right.

  **Sidgwick:** "Right" is a word. I need a reality. If the cosmos is godless and finite, then the sacrifice of the self is a tragedy, not a virtue. I am not asking for a guarantee of happiness to make me behave. I am asking for evidence that the universe is not a lie.

  **Huxley:** You are asking the empirical world to bear the weight of a theological hope, while refusing to accept the theology. You want the comfort of faith without the surrender of reason.

  **Sidgwick:** I want the comfort of truth. If the truth is that we are alone, and virtue is its own only reward, then I must know that too. I must face the abyss if it is there. But I will not assume the abyss exists simply because it is dark. We sit here, in this drafty room, waiting for a woman to talk to the dead, not because we are credulous, but because the stakes of the silence are too high.

  **Huxley:** And if the silence is all we ever find?

  **Sidgwick:** Then we have our answer. And I shall have to live with the knowledge that reason commands me to be good, but offers me no reason why I should not hate it.

  **(A knock at the door. The medium has arrived. Sidgwick straightens his coat, his face returning to its usual mask of academic neutrality. Huxley picks up his pen, ready to record, though his expression remains troubled.)**

  **Huxley:** Then let us see if the dead have anything to say about the living's duties. Though I fear they are as silent on ethics as the stars.

  **Sidgwick:** Perhaps. But until we are certain, we cannot close the book. Not on them. And not on ourselves.
