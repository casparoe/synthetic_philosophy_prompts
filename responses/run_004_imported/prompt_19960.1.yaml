          *   *Critique:* Ignores the contingency. Treats the deals as independent when they are contractually linked.

      *   **Framework 2: Value Creation (Surplus Splitting).**
          *   Compare the Deal vs. the Fallback.
          *   Fallback: User $20k, Owen $20k.
          *   Deal: User $X, Owen $Y. (Total $420k).
          *   Surplus to divide: $380k.
          *   How to split surplus? 50/50 is a common Schelling point for cooperative gains.
          *   If Surplus split 50/50: Each gets $190k + Fallback ($20k) = $210k each.
          *   *Result:* User $210k, Owen $210k.
          *   *Critique:* Might feel like User is getting paid for Owen's labor.

      *   **Framework 3: Hybrid (Asset + Leverage).**
          *   Catalog stays 50/50 ($60k each).
          *   Instructor Contract ($300k) is recognized as Owen's labor, *but* the *opportunity* is joint.
          *   User gets a "finder's fee" or "release fee" for enabling the exclusivity.
          *   Alternatively, treat the whole $420k as the "Partnership Exit" and split based on contribution to the *deal*, not just the IP.

  6.  **Refine the "Fair" Split:**

      *   Owen's labor is worth something. If Owen walked away and got a different job, he might earn $150k/year? Let's assume the $300k is fair market value for his labor.
      *   However, the *exclusivity* restricts the User. The User is giving up the right to sell the course elsewhere or compete.
      *   The User is essentially selling their "veto right" over Owen's career opportunity.
      *   *Reasonable Compromise:*
          *   Catalog: 50/50 ($60k each).
          *   Instructor: Mostly Owen, but User gets a cut of the *premium* generated by the bundle.
          *   Or, look at the total pot ($420k).
          *   Owen does the work, so he should get more than 50%.
          *   User enables the deal, so they should get more than the catalog share ($60k).
          *   *Scenario:* Split the $300k contract? No, that's salary.
          *   *Scenario:* User gets a larger share of the Catalog to compensate? E.g., Catalog split 70/30? ($84k / $36k). Total: User $84k, Owen $336k. Still big gap.
          *   *Scenario:* User gets a "licensing fee" from Owen's contract?
          *   *Best Approach:* Treat the $420k as the total partnership realization.
          *   Base Line: Fallback ($20k each).
          *   Upside: $380k.
          *   If we split upside 50/50: $210k each. (Owen might reject this as he does the work).
          *   If we split upside 70/30 (Owen/User): Owen gets $266k + $20k = $286k. User gets $114k + $20k = $134k.
          *   If we split upside 60/40 (Owen/User): Owen gets $228k + $20k = $248k. User gets $152k + $20k = $172k.
          *   *Owen's Proposal:* Owen $360k, User $60k. (Owen captures ~95% of surplus).
          *   *User's Counter:* Needs to capture more surplus. $150k-$200k total seems defensible.

  7.  **Consider the "Exclusivity" Constraint:**

      *   The User is signing away rights to their own IP (the catalog). $120k is the price for *both* of them.
      *   The $300k is contingent on the User signing away their rights.
      *   Therefore, the $300k is partially consideration for the User's restraint of trade/competition (regarding the catalog).
      *   If the User doesn't sign, Owen doesn't teach. The User is effectively a gatekeeper.

  8.  **Drafting the Advice:**

      *   **Validate the User:** Owen's proposal is *not* defensible under a "value creation" framework, even if it looks standard under a strict "property/labor" framework. The friend's advice is too narrow.
      *   **Identify the Leverage:** The "Bundle" is the key. The deals are not separate.
      *   **Propose a Framework:** The "Surplus Splitting" model (Deal vs. Fallback).
      *   **Calculate Numbers:** Show the math on the Fallback vs. Deal.
      *   **Suggest a Counter-Proposal:**
          *   Acknowledge Owen's labor (he should get the majority of the $300k).
          *   Assert User's value (gatekeeper of exclusivity).
          *   Aim for a total split that reflects the partnership's 3-year history.
          *   Specific numbers: Maybe a 70/30 or 60/40 split of the *total* package, or a specific "consulting fee" from Owen's side to User.
          *   Actually, a clean way is to adjust the Catalog split. Since the Instructor contract is technically separate employment, mixing the money might be tax/legally messy. Better to keep the $300k with Owen but increase the Catalog split significantly.
          *   Wait, the prompt says "$120,000... Owen and I are free to divide between ourselves however we like."
          *   So, we can adjust the $120k split.
          *   If User wants $150k total: $60k (base catalog) + $90k (extra from Owen's share of catalog).
          *   Owen gets $300k (contract) + $30k (catalog) = $330k.
          *   This narrows the gap from 6:1 to roughly 2:1.
      *   **Negotiation Strategy:** Focus on "Partnership" and "Enabling Value," not "Entitlement to Salary." Don't demand half the salary; demand fair compensation for the *opportunity* provided.

  9.  **Refining the Argument:**

      *   *Owen's Logic:* Asset vs. Labor.
      *   *User's Logic:* Joint Opportunity.
