answer: |-
  Owen's proposal is **not defensible** under a principled analysis of value creation, even if it superficially aligns with a strict "property vs. labor" distinction. Your legal friend's comment that it sounds "standard" likely refers to the separation of assets (the course) from personal services (the contract), but that framework ignores the critical leverage you hold: **the contingency.**

  Here is a breakdown of why Owen's logic is flawed, a principled framework for calculating a fair split, and a strategy for negotiating this without destroying your relationship.

  ### 1. The Flaw in Owen's Logic
  Owen is treating the two components of the deal as independent:
  1.  **The Catalog ($120k):** Joint asset $\rightarrow$ 50/50 split.
  2.  **The Contract ($300k):** Personal labor $\rightarrow$ 100% Owen.

  **Why this fails:** The deals are *not* independent. The contract is contractually contingent on the catalog exclusivity.
  *   Owen cannot earn the $300k without your signature.
  *   By signing, you are not just licensing IP; you are granting Owen a **monopoly on a $300,000 opportunity** that you jointly built the platform for.
  *   If you view the course as a startup, this is akin to one co-founder selling the company and then being hired as CEO, while the other co-founder is told they only get their equity value but none of the "acquisition premium" that came from the CEO role being part of the package.

  Your leverage is absolute. Without you, Owen's BATNA (Best Alternative to a Negotiated Agreement) is the fallback deal: **$20,000.** With you, his BATNA is **$360,000.** You are single-handedly creating **$340,000 of surplus value** for Owen. He is only creating **$40,000 of surplus value** for you (the difference between $60k and $20k).

  ### 2. A Principled Framework: Surplus Splitting
  In negotiation theory, when two parties must cooperate to unlock value that neither can achieve alone, the fair standard is to split the **surplus** (the value created *above* the fallback position).

  **The Math:**
  *   **Fallback (No Deal):** You $20k | Owen $20k | **Total $40k**
  *   **Bundle (The Deal):** You $X | Owen $Y | **Total $420k**
  *   **Total Surplus to Divide:** $420k - $40k = **$380k**

  Owen's proposal asks you to accept your fallback baseline + a tiny fraction of the surplus, while he keeps almost all the surplus.
  *   **Owen's Proposal:** You gain $40k surplus. Owen gains $340k surplus. (Ratio: 1 to 8.5)
  *   **Principled Baseline (50/50 Surplus):** You gain $190k surplus. Owen gains $190k surplus.
      *   *Total:* You $210k | Owen $210k.

  **Is 50/50 surplus fair?** Probably not. Owen *is* doing the work for the $300k. He deserves a premium for his labor. However, a 1-to-8.5 split is exploitative. A **60/40 or 70/30 split of the surplus in Owen's favor** acknowledges his labor while respecting your leverage.

  **Scenario A (70/30 Surplus Split - Owen favors):**
  *   Owen Surplus: $266k + $20k Fallback = **$286k Total**
  *   Your Surplus: $114k + $20k Fallback = **$134k Total**
  *   *Result:* Owen makes ~2.1x you. (Much better than 6x).

  **Scenario B (60/40 Surplus Split - Moderate):**
  *   Owen Surplus: $228k + $20k Fallback = **$248k Total**
  *   Your Surplus: $152k + $20k Fallback = **$172k Total**
  *   *Result:* Owen makes ~1.4x you.

  ### 3. How to Structure the Counter-Offer
  You cannot legally take a cut of Owen's employment contract (that's his salary for labor). However, the prompt states you are free to divide the **$120,000 catalog payment** however you like. This is your adjustment lever.

  You need to reframe the $120,000. It is not just the price of the files; it is the **price of the exclusivity that enables the bundle.** Since your exclusivity is the key to the $300k, the catalog payment should reflect that enablement.

  **Recommended Counter-Proposal:**
  Aim for a total take of **$150,000 - $175,000**. This acknowledges Owen's labor (he still ends up with ~$250k+) but captures fair value for your enablement.

  *   **Catalog Split:** Propose a **75/25 split in your favor** on the $120k.
      *   You: $90,000
      *   Owen: $30,000
  *   **Instructor Contract:** Owen keeps 100% ($300,000).
  *   **Totals:**
      *   **You:** $90,000
      *   **Owen:** $330,000

  *Wait, that's still a large gap.* If you want to reach the "Surplus Split" numbers calculated above ($172k for you), you need to frame the conversation differently.

  **Better Approach: The "Partnership Exit" Frame**
  Sit Owen down and explain that you view this $420k as the **final realization of the 3-year partnership**.
  *   "Owen, I agree you should be paid for the instructor work. But this deal only exists because we built this asset together. The $300k isn't just for teaching; it's a premium the company is paying because they get *us* (the brand) exclusively."
  *   Propose that the **total package value ($420k)** be treated as the partnership proceeds, with a "labor credit" applied to Owen.

  **Specific Counter-Offer Script:**
  > "Owen, I've run the numbers. If we don't sign, we each walk away with $20k. If we do sign, we create $380k in *new* value. Your proposal gives you 90% of that new value and leaves me with 10%. That doesn't reflect our partnership or the fact that my signature is the gatekeeper for the instructor role.
  >
  > I'm not asking for half your salary. I'm asking for a fair split of the *opportunity* we built together. I propose we adjust the catalog split to **$200k for me and $220k for you** (via the $120k catalog check + a side agreement or adjustment)."

  *Wait, the catalog check is fixed at $120k.* You can't change the check amount the company writes. You can only change how you split it.
  *   Max you can get from Catalog = $120k.
  *   To get to $200k total, Owen would need to pay you $80k from his contract. He will likely refuse this as "salary."

  **Realistic Compromise:**
  Max out the catalog split in your favor, and ask for a "Consulting/Advisory" fee from Owen.
  1.  **Catalog Split:** 80/20 in your favor ($96k You / $24k Owen).
      *   *Rationale:* You are giving up exclusive rights to the IP, which constrains your future ability to compete. You deserve the lion's share of the asset sale.
  2.  **Advisory Fee:** Owen pays you **$50,000** from his contract over 2 years as a "Strategic Advisor" to ensure the course material aligns with his new content (which is true, you co-created the backend logic).
      *   *Total You:* $146,000.
      *   *Total Owen:* $274,000.
      *   *Ratio:* ~1.9 to 1. This is defensible.

  ### 4. Negotiation Strategy for the Meeting
  1.  **Don't Negotiate with the Company Yet:** Tell the company you need to finalize the internal partner agreement before signing. Do not let them drive a wedge between you.
  2.  **Focus on "Enablement," Not "Entitlement":** Do not say "I deserve half your salary." Say, "My agreement unlocks $340k of value for you. I need to be compensated for that leverage."
  3.  **Use the Fallback as an Anchor:** Remind Owen constantly: "Without me, this $300k contract vanishes. We are back to $20k each. I am bringing $340k to the table; you are bringing $40k. Let's split the *gain* fairly."
  4.  **Preserve the Relationship:** Acknowledge his talent. "You earned the instructor role. I want you to have the majority of that. But I can't subsidize your career jump by taking a $300k loss myself."

  ### Summary Recommendation
  Owen's proposal is **not defensible**. It relies on a technicality (labor vs. asset) to ignore the economic reality (the bundle).

  **Your Target:** **$150,000 total.**
  **Your Argument:** The $120k catalog price is artificially low because it's bundled with the $300k contract. The true value of the catalog exclusivity is higher because it enables the hire. Therefore, you deserve the majority of the $120k, plus a small advisory fee from Owen.

  **The Ask:**
  1.  **Catalog Split:** 85/15 in your favor ($102k You / $18k Owen).
  2.  **Advisory:** Owen pays you $48k over 2 years ($2k/month) for "IP Consultation."
  3.  **Total:** You $150k | Owen $270k.

  This gives Owen a massive win ($270k vs $20k fallback) while ensuring you are paid for the leverage you provide. If he refuses, remind him gently that **veto power is a valuable asset**, and you are prepared to exercise it if the partnership isn't respected. (Only say this if you are willing to walk away to the $20k fallback).
