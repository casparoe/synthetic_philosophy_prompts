      *   **User's Intuition:** Feels unbalanced. User holds leverage over the $300k because their signature is required to unlock it, but acknowledges they didn't earn the $300k through labor.
      *   **Legal Friend's Opinion:** "Sounds about standard." (Vague, unhelpful).
      *   **Goal:** Determine if Owen's split is defensible and find a principled alternative for negotiation.

  2.  **Analyze the Leverage and Value Creation:**

      *   **The Catalog ($120k):** This is joint property. 50/50 is the baseline legal and ethical standard for existing IP. Owen's proposal here is standard.
      *   **The Instructor Contract ($300k):** This is *future* labor compensation. Usually, future labor belongs to the laborer. *However*, this labor is only valuable *because* of the joint asset (the catalog/exclusivity).
      *   **The "Bundle" Dynamic:** The company isn't buying two separate things. They are buying a *package*.
          *   Value of Package = $420,000.
          *   Value of Fallback = $40,000.
          *   **Surplus Value created by agreeing to the Bundle:** $420k - $40k = $380,000.
      *   **The Leverage Point:** The User has veto power over the $300k instructor contract. Without User's signature on exclusivity, Owen gets $0 of the $300k. Without Owen, User gets $0 of the $300k (and only $20k of the catalog).
      *   **The "Hold-up" Problem:** Owen needs User to sign. User needs Owen to teach. They are interdependent for the *incremental* value.

