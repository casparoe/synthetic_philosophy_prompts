      *   **Deal Structure:** A "Bundle" consisting of two parts:
          1.  Exclusive License of Back Catalog: $120,000 (One-time payment).
          2.  Staff Instructor Contract: $300,000 (Two-year salary/contract for *new* work).
      *   **Constraints:**
          *   Exclusivity requires *both* signatures.
          *   Instructor contract is *only* for Owen (based on audience testing).
          *   Instructor contract is *contingent* on Exclusivity (Bundle deal).
          *   Fallback (BATNA - Best Alternative to a Negotiated Agreement): Non-exclusive license for $40,000 total ($20k each). No instructor contract.
      *   **Owen's Proposal:**
          *   Catalog: 50/50 ($60k each).
          *   Instructor: 100% Owen ($300k).
