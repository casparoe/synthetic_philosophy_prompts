      *   *Precedent:* In startups, if one founder can't take a role but their equity enables the other to raise money, they still share the upside. This is similar. The course is the "equity."
      *   *Risk:* If User pushes too hard, Owen might walk (though he loses $340k surplus). If User accepts, they leave $100k+ on the table.
      *   *Tone:* Collaborative but firm. "We built this together. This deal exists because of what we built together."

  10. **Final Check:**
