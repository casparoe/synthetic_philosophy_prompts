      *   *Kant on Essence:* Kant distinguishes logical essence from real essence. We can't know the real essence of a noumenal object (God). So asserting an essence that entails existence is claiming knowledge we can't have.
      *   *Kant on Necessity:* In the *Postulates*, "Necessity" is the existence of an object determined by universal conditions of experience. A God outside experience cannot be "necessary" in Kant's sense.
      *   *So the objection holds:* Gödel uses "Necessity" in a logical/metaphysical sense. Kant restricts "Necessity" to the empirical/transcendental sense. If Kant accepts Gödel's definition of Necessity, he still rejects it as a *predicate*. If he rejects the definition, the proof fails. Either way, Kant wins.

