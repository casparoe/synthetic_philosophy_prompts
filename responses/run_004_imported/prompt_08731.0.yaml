answer: |-
  This is a remarkably sharp observation for someone without formal training. You have identified the exact fault line where two of the most famous "expression theories" of art diverge. It is a common intuition to think Tolstoy and Collingwood are allies because they both reject the idea that art is merely about copying reality (mimesis). However, as you noticed, Collingwood explicitly attacks Tolstoy in *The Principles of Art* (1938).

  Here is a comparison of their theories, an explanation of Collingwood's specific objection to "infection," and a judgment on whether that objection holds water.

  ### 1. The Core Comparison: Transmission vs. Exploration

  To understand the disagreement, we have to look at how each philosopher views the timeline of emotion in relation to the artwork.

  **Tolstoy: Art as Transmission (The Vector Model)**
  For Tolstoy, the emotional process happens *before* the art is made.
  1.  **Feeling:** The artist experiences a specific feeling (e.g., pity for the suffering of the poor).
  2.  **Encoding:** The artist chooses external signs (words, colors, sounds) to embody that feeling.
  3.  **Transmission:** The audience encounters the signs and is "infected."
  4.  **Success:** If the audience feels the same pity, art has occurred. If they don't, it failed.

  For Tolstoy, art is a form of **communication**. The emotion is a package that exists independently of the wrapping. The goal is social: to unite people in shared feeling.

  **Collingwood: Art as Expression (The Clarification Model)**
  For Collingwood, the emotional process happens *during* the making of the art.
  1.  **Turmoil:** The artist feels a psychic disturbance, but doesn't know exactly what it is. It is vague and oppressive.
  2.  **Expression:** Through the act of painting or writing, the artist clarifies the emotion. They don't know what they feel until they see what they've made.
  3.  **Recognition:** The audience looks at the work and recognizes that *this* is what they themselves have felt but couldn't articulate.
  4.  **Success:** Art has occurred when the emotion is fully expressed and clarified in the artist's mind. The audience is secondary.

  For Collingwood, art is a form of **self-knowledge**. The emotion does not exist as a defined thing until the art exists.

  ### 2. Why Collingwood Rejects "Infection"

  You asked for precision on why Collingwood thinks "infecting" an audience is different from "expressing" an emotion. The distinction rests on the difference between **Art** and **Craft** (or what Collingwood calls "Magic" and "Amusement").

  **The Argument from Intent**
  Collingwood argues that if your goal is to produce a specific effect in an audience (infection), you are not making art; you are practicing a craft.
  *   **Craft:** I have a plan (make them cry). I select tools known to achieve that plan (minor chords, sad lyrics). I execute the plan.
  *   **Art:** I have no plan. I am exploring what I feel. I cannot know the end result until I finish.

  Collingwood claims Tolstoy's theory turns the artist into a manipulator. If I am trying to "infect" you, I am treating you as a subject to be acted upon. I am using techniques to trigger a psychological response. Collingwood calls this "Magic" (if the goal is practical, like propaganda) or "Amusement" (if the goal is pleasure, like entertainment).

  **The Argument from Specificity**
  For Tolstoy, the feeling must be specific enough to be transmitted. For Collingwood, if you know exactly what feeling you want to transmit *before* you start, you aren't expressing; you are describing.
  *   **Tolstoy:** "I felt grief, so I wrote this poem to make you feel grief."
  *   **Collingwood:** "If you already know it is 'grief,' you have already categorized it. True expression is finding the unique quality of *this specific* grief that distinguishes it from all other griefs."

  Collingwood believes Tolstoy confuses **betraying** emotion (showing signs of anger, like shouting) or **arousing** emotion (making someone angry) with **expressing** emotion (coming to understand the anger). To Collingwood, "infection" is just arousal. It is a causal mechanism (Stimulus → Response), whereas art is a cognitive mechanism (Confusion → Clarity).

  ### 3. Judgment: Does Collingwood Defeat Tolstoy?

  This is the philosophical crux. Collingwood's objection is devastating to Tolstoy's *definition* of art, but Tolstoy has resources to answer it regarding the *value* of art.

  **Where Collingwood Wins**
  Collingwood successfully identifies a flaw in Tolstoy's phenomenology (the description of how art feels to make). Most artists do not report feeling a fully formed emotion and then simply dressing it up. They report struggling to find the form that matches the feeling.
  *   **The "Cliché" Problem:** Under Tolstoy's theory, a hack writer could use stereotypical "sad" tropes to make an audience cry. If the audience cries, Tolstoy must call it art (provided the writer *pretends* sincerity well enough). Collingwood correctly identifies this as a trick, not art. By focusing on the *process* of exploration rather than the *result* of infection, Collingwood protects art from being reduced to emotional manipulation.

  **Where Tolstoy Fights Back**
  However, Tolstoy could argue that Collingwood has defined "Art" so narrowly that it becomes useless to the real world.
  1.  **The Solipsism Charge:** Collingwood's theory is incredibly internal. The "real" work of art happens in the artist's head. The physical painting is just a record. Tolstoy would argue this is elitist nonsense. Art is a social bridge. If it doesn't connect, it hasn't done its job.
  2.  **Sincerity as a Safeguard:** Tolstoy can answer the "manipulation" charge by leaning harder on **sincerity**. Tolstoy insists the artist must have *lived through* the feeling. You cannot infect others with a feeling you haven't genuinely felt. Therefore, "infection" isn't a trick; it's a shared human experience. Tolstoy would say Collingwood is splitting hairs: if I truly feel it, and I truly move you, what does it matter if I intended to move you?
  3.  **The Moral Stakes:** Tolstoy cares about *which* feelings are transmitted. He wants art to unite humanity in brotherhood. Collingwood doesn't care about the content of the emotion, only the purity of the expression. A Nazi could make "pure expressive art" under Collingwood's definition, provided they were honestly exploring their own emotions. Tolstoy would say that is not art, it is evil. Tolstoy's theory has a moral compass; Collingwood's does not.

  **The Verdict**
  Collingwood defeats Tolstoy on the **mechanics of creation**. He is right that treating art as a tool for psychological infection reduces it to engineering or propaganda. If we accept Tolstoy's definition fully, it becomes hard to distinguish between a great tragedy and a well-crafted tear-jerker movie designed by committee.

  However, Tolstoy defeats Collingwood on the **sociology of reception**. Collingwood's theory is so individualistic it struggles to explain why art matters to culture. Tolstoy is right that art's power lies in its ability to circulate feelings between people.

  **Synthesis**
  The most robust view likely lies in a modification of Tolstoy that incorporates Collingwood's warning. We might say:
  *   Art begins as Collingwoodian **expression** (the artist exploring unknown feelings).
  *   But it becomes socially significant only when it achieves Tolstoyan **infection** (communicating those feelings sincerely to others).

  Collingwood saves us from bad art that manipulates us; Tolstoy saves us from good art that isolates us. Your intuition that they should agree was natural, but their disagreement reveals the tension between art as **private truth** (Collingwood) and art as **public good** (Tolstoy).
