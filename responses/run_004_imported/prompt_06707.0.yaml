answer: |-
  You have done an excellent job reconstructing Aquinas's position from secondary sources. Your intuition is correct: the popular simplification that "Aquinas endorsed tyrannicide" is misleading. While he provides the philosophical *foundation* for later resistance theories, his own writings are significantly more cautious, procedural, and conservative than the legend suggests.

  To answer your core question: **Aquinas's framework generally counsels against private individuals or small groups taking violent action on their own initiative, even against a terrible ruler.** However, it does not rule out violent removal entirely; it strictly conditions *who* may act and *under what circumstances*.

  Here is a walkthrough of the internal logic of his position, how it distinguishes between types of tyranny, and how that applies to modern cases like the German Resistance.

  ### 1. The Teleological Foundation: The Common Good
  To understand Aquinas's hesitation, you must start with his purpose for government. For Aquinas, political authority is natural and necessary because humans are social animals who need coordination to flourish. The specific end (goal) of political authority is the **common good** (*bonum commune*).

  *   **Logic:** A ruler is a "ruler" only insofar as they serve the common good.
  *   **Implication:** When a ruler serves only their own private interest, they are, strictly speaking, not exercising legitimate authority. They are acting as a private individual wielding public power. This is the definition of tyranny.

  So far, this sounds like it justifies removal. If the ruler is no longer serving the end of the office, the office is vacant in a moral sense. However, Aquinas introduces two major checks on this logic: the danger of sedition and the requirement of public standing.

  ### 2. The Distinction: Defect in Title vs. Defect in Exercise
  You correctly identified this distinction, but its logical consequence is vital. Aquinas treats these two scenarios differently in *De Regno* (On Kingship) and the *Summa Theologiae*.

  #### A. The Usurper (Defect in Title)
  If a ruler seizes power by force or fraud without any legal or customary claim, they never truly held authority.
  *   **Aquinas's View:** There is no strict obligation of obedience to a usurper.
  *   **Who can act?** Even here, Aquinas is wary of private violence. However, because the usurper has no legitimate claim, the "public authority" required to remove them is easier to constitute. In some readings, if there is no superior to appeal to (like an Emperor to appeal to against a local usurper), the community itself may act.
  *   **Logic:** The usurper is essentially an external aggressor occupying the state.

  #### B. The Legitimate Ruler Turned Tyrant (Defect in Exercise)
  This is the harder case (and the case of Hitler, who was initially appointed legally). The ruler holds the office legitimately but abuses it.
  *   **Aquinas's View:** Private individuals **cannot** take it upon themselves to kill this ruler.
  *   **Logic:** Aquinas uses an organic analogy. The ruler is the head; the subjects are the body. A hand cannot cut off the head on its own judgment; that would be self-destruction. Only a higher authority or the body acting *as a whole* through a representative mechanism can remove the head.
  *   **The Risk of Private Judgment:** Aquinas argues that if private individuals are allowed to judge rulers, "wicked men" will use the label of "tyrant" to kill good rulers. Furthermore, the removal of a ruler often leads to civil war, which may be a greater evil than the tyranny itself.

  ### 3. The "Public Authority" Requirement
  This is the crux of your question. Why does Aquinas insist on public authority?

  1.  **Legitimacy:** Only the entity that confers authority can remove it. In medieval thought, authority ultimately comes from God, but it is mediated through the community (the *populus*). Therefore, the community, acting through its representative bodies (nobles, magistrates, estates), retains the residual authority to depose a ruler who violates the compact.
  2.  **Order:** Private assassination is sedition. It disrupts the order of justice. Public deposition is an act of justice. The difference lies not in the violence itself, but in the *authority* behind the violence.
  3.  **Proportionality:** A public body is more likely to weigh the consequences (will this cause civil war?) than a passionate individual.

  ### 4. Application to Modern Cases

  Let's apply this logic to the scenarios you mentioned.

  #### Case A: The German Resistance (e.g., Operation Valkyrie)
  The plotters against Hitler (Stauffenberg, Beck, Goerdeler) were not private citizens in the modern sense. They were high-ranking military officers and civil servants.
  *   **Aquinas's Likely Assessment:** This is the strongest case for permissible action within his framework.
      *   **Defect in Title:** Many resisters argued that Hitler's power was illegitimate following the death of Hindenburg or through the abuse of the Enabling Act (a usurpation of the constitution).
      *   **Public Authority:** The plotters were acting not as private men, but as holders of public office (the Army, the Civil Service). They intended to establish a provisional government immediately. They were attempting to act as the "public authority" that Aquinas requires.
      *   **Conclusion:** Aquinas would likely view this not as "assassination" in the criminal sense, but as a **deposition by state insiders** to restore the rule of law. It fits his requirement that the action be undertaken by those with standing, aiming to restore the common good, rather than by private vigilantes.

  #### Case B: Private Individuals / Small Underground Groups
  Consider a modern lone actor or a small revolutionary cell with no official standing assassinating a dictator.
  *   **Aquinas's Likely Assessment:** This is forbidden.
      *   **Lack of Standing:** They are "private persons." They lack the *auctoritas* to judge the ruler.
      *   **Risk of Greater Evil:** Aquinas would argue this sets a precedent that undermines all political order. If any group can kill a leader they dislike, society dissolves into factional violence.
      *   **Conclusion:** Even if the dictator is evil, the private act of killing him is morally illicit because it violates the order of justice. The remedy must come from above (international law, neighboring powers) or from within the state's own representative structures.

  #### Case C: Foreign Powers
  Aquinas does not really address foreign intervention, as he wrote in a context of Christendom where the Pope or Emperor might theoretically intervene.
  *   **Modern Extension:** In a modern context, a legitimate international body (like a UN-sanctioned action) might satisfy the "public authority" requirement that a private individual lacks. However, Aquinas would be deeply skeptical of foreign powers acting under the guise of "liberation" if their true motive is conquest.

  ### 5. Why the Confusion? (The Scholastic Development)
  It is important to note why you found conflicting information. Aquinas planted the seed, but later thinkers watered it into a larger tree.
  *   **Aquinas (13th Century):** Very cautious. Emphasizes patience and public procedure.
  *   **School of Salamanca (16th Century):** Thinkers like Francisco Suárez and Juan de Mariana took Aquinas's principles and expanded them. Mariana, in *De Rege* (1599), argued more explicitly that a tyrant who is a public enemy may be killed by a private individual if no public mechanism exists.
  *   **The Result:** When people say "The Catholic tradition supports tyrannicide," they are often referencing the 16th-century Scholastics or the Jesuit resistance theorists, not Aquinas directly. Aquinas provides the *premises* (tyranny is unjust; authority is for the common good), but he draws more conservative *conclusions* than his successors.

  ### 6. Summary of Implications
  If we strictly apply Aquinas's internal logic to your question about modern private action:

  1.  **Private Assassination is Rejected:** Aquinas's framework counsels against private individuals taking violent action. The moral defect of the ruler does not grant private subjects the license to become judges and executioners.
  2.  **Institutional Resistance is Permitted:** Violence is permissible only when it is an act of **public justice** rather than private vengeance. This means it must be carried out by those holding public office (military, legislature) acting to restore the constitutional order.
  3.  **The "Greater Evil" Calculus:** Even if the authority is public, the action is forbidden if it will likely cause greater harm (civil war, foreign invasion, anarchy) than the tyranny itself. Aquinas prioritizes the *survival of the community* over the *removal of the tyrant* if the two are in conflict.

  **Conclusion:**
  Aquinas leaves very little room for the "lone hero" narrative. His philosophy is inherently institutional. For him, a tyrant is a disease in the body politic; you do not cure a disease by having the blood cells attack the heart on their own initiative. You cure it through the immune system—the established structures of law and public authority.

  Therefore, regarding the German Resistance: Aquinas would likely vindicate them *not* because they were private citizens fighting evil, but because they were **public officials** attempting to execute a lawful deposition of a usurper. Regarding modern private assassins: Aquinas would condemn them, arguing that their actions, however well-intentioned, undermine the very concept of lawful authority required to build a just society after the tyrant is gone.
