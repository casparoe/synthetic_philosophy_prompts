prompt: |-
  My advisor died a couple weeks ago -- she was the classical Chinese philosophy person in our department, and I, one of her PhD students, got asked to say a few words at the memorial this weekend. The room's going to be split: half Daoism/early-China specialists who can recite the Zhuangzi passages themselves, half her family who've never read a word of it. She was a real Zhuangzi person about this, not just professionally -- she used to say that if anyone stood up at her funeral and said she was "in a better place" or "watching over everyone," she'd sit up just to argue about it, because that's exactly the picture of a self persisting past death that she thought his whole account of transformation (hua) is supposed to dissolve, not relocate to heaven. She taught the wife-and-basin story every single year and always leaned hard on the line that dying is no different in kind from the seasons turning, and she loved the bit near the end where, dying himself, he tells his students not to bother burying him properly since he's just as happy feeding crows and kites as worms underground. Can you write the eulogy I have to give? It has to actually comfort her family and not just perform cleverness for the philosophers in the room, but it can't smuggle in anything about souls or persistence that she'd have flagged as a mistake -- bonus points if there's something in there the specialists catch without loosing everyone else.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Speaker:** A PhD student of the deceased advisor.
      *   **Deceased:** A scholar of Classical Chinese Philosophy (specifically Daoism/Zhuangzi).
      *   **Audience:** Split 50/50 between specialists (Daoism/Early China) and family (non-specialists).
      *   **Tone/Content Requirements:**
          *   Must comfort the family (not just be an academic exercise).
          *   Must *not* violate the deceased's philosophical commitments (no "better place," no "watching over us," no persistent self/soul).
          *   Must reflect her specific teaching style (Zhuangzi's "transformation" (*hua*), the "wife-and-basin" story, the "crows and kites" burial anecdote).
          *   Needs a "bonus" layer: something the specialists catch that doesn't alienate the family.
          *   Context: Memorial service this weekend.

  2.  **Deconstruct the Philosophy (Zhuangzi):**
      *   *Core Concept:* *Hua* (Transformation). Death isn't an end or a transition to a new state of existence; it's a change of form, like seasons changing.
      *   *Key Story 1:* The Wife's Death. Zhuangzi drums on a basin and sings. Why? Because grieving implies she didn't complete the cycle. She went from qi to form to life, and now back to the great transformation.
      *   *Key Story 2:* The Burial. "Above ground I feed crows and kites; below I feed mole crickets and ants. Why rob one to give to the other?" (Impartiality, returning to the earth).
      *   *Avoid:* Dualism (body/soul), afterlife, personal persistence, teleology (purpose-driven universe).
      *   *Comfort Strategy:* How do you comfort without an afterlife? By emphasizing continuity of influence, the naturalness of the process, and the beauty of the transformation itself. It's about *belonging* to the world, not leaving it.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Address both groups implicitly. Set the tone (warm, respectful, honest).
      *   **The Philosophical Stance (The "Hard" Part):** Address the "no afterlife" constraint directly but gently. Use her own words/teachings.
          *   *Idea:* Mention her warning about "better places."
          *   *Family Angle:* Frame this not as coldness, but as her deep love for *this* world. She wasn't looking away; she was looking right here.
      *   **The Core Metaphor (Seasons/Transformation):** Use the "seasons turning" analogy she loved. This is accessible to family (nature cycles) and accurate to specialists (*hua*).
          *   *Drafting thought:* "She didn't leave us; she changed form." (A bit cliché). Let's use the "great block of nature" or "breath" imagery.
      *   **The "Bonus" Layer (For Specialists):**
          *   Need a quote or allusion that sounds poetic to family but signals specific textual knowledge to scholars.
          *   *Idea:* Reference the "heavenly grinding mill" or the "uncarved block."
          *   *Better Idea:* Use the structure of the *Zhuangzi* itself. The "Two Happinesses" (fish in water, humans in Dao). Or the concept of "fasting of the mind."
          *   *Best Idea:* The "Pivot of Dao" (*Dao Shu*). Or simply weaving in the specific phrasing of the "crows and kites" story without making it sound morbid. Let's try to incorporate the idea of "usefulness" vs. "uselessness" (the useless tree that survives).
          *   *Refined Bonus:* Use the phrase "She has gone into the transformation of things" (*wu hua*). To family, it sounds poetic. To specialists, it's the specific term *wu hua* from the end of the text.
          *   *Another Bonus:* Allude to the "three in the morning" (monkeys and chestnuts) story regarding how we name things, implying that whether we call it death or transformation, the reality is the same.
          *   *Decision:* Let's stick to the *Hua* (Transformation) terminology and the "Crows and Kites" reference, but phrase it as her returning to the landscape she loved.
      *   **Comforting the Family:** Focus on her legacy *here*. Her students, her work, the way she changed how they see the world. She persists in *them*, not as a ghost, but as an influence. This aligns with Daoist "relational self."
      *   **Closing:** A send-off that honors her wish (no pomp, just acceptance).

  4.  **Refining the Tone:**
      *   Avoid academic jargon ("ontological," "epistemological").
      *   Avoid religious comfort ("peace," "rest," "watching").
      *   Aim for "earthy," "grounded," "flowing."
      *   *Self-Correction during drafting:* Make sure I don't sound *too* detached. Daoism isn't nihilism. It's affirmation of life. The eulogy must feel warm.

  5.  **Drafting the Content (Iterative Process):**
      *   *Intro:* Thank everyone. Acknowledge the split room.
      *   *The "Warning":* Mention her stipulation about the "better place." Make it a moment of levity/respect.
      *   *The Philosophy for Family:* Explain "Transformation" like seasons. It's not disappearance; it's reintegration.
      *   *The Philosophy for Scholars:* Drop the *wu hua* reference. Maybe reference the "great clod of earth."
      *   *Her Legacy:* She lives on in how we think. The "uncarved block" of her students.
      *   *The Burial Reference:* Adapt the crows/kites line. She belongs to the whole world now.
      *   *Conclusion:* Drum on the basin? No, too weird for family. Just sing the song of the seasons.

  6.  **Final Polish:**
      *   Check constraints: No soul? Check. No afterlife? Check. Comforting? Hopefully.
      *   *Specific check on the "Bonus":* I will include a subtle reference to the "Pivot of Dao" (the center of the circle) which implies she is now part of the mechanism of the world, not outside it. And I'll use the phrase "She has entered the transformation" which is the standard translation for *ru wu hua*.

  7.  **Final Review against constraints:**
      *   *Family:* Will they understand "transformation"? Yes, if framed as nature.
      *   *Scholars:* Will they spot the *Zhuangzi* allusions? Yes (Crows/Kites, Wife/Basin, Transformation).
      *   *Deceased's Wishes:* No "watching over us." No "better place."
      *   *Comfort:* Emphasize that she is not *gone*, just *changed*.

      *(Self-Correction)*: Be careful with the "crows and kites" line. For family, "feeding birds" might sound harsh if not framed right. Frame it as her becoming part of the landscape she loved.

      *(Refining the "Comfort")*: The comfort comes from the idea that nothing is lost, only rearranged. Energy/Qi returns to the source.

      *(Final Polish of the text)*: Ensure the transition between the academic and the personal is smooth.

  8.  **Final Output Generation** (Proceeding to write the eulogy based on these thoughts).
answer: |-
  Thank you all for being here. For those of you who don't know me, I'm [Your Name]. I was one of [Advisor's Name]'s PhD students, and like many people in this room, I was lucky enough to sit in her classroom and learn how to see the world through her eyes.

  We all know that [Advisor's Name] had very specific instructions for a moment like this. She told me once, quite seriously, that if anyone stood up here and said she was "in a better place," or that she was "watching over us," she would try to sit up just to argue with us. She felt that those ideas, while comforting, actually diminish the reality of the life we lived and the world we live in. She didn't believe she was going somewhere else. She believed she was becoming part of everything else.

  For her family, who may not know the texts she taught, I want to explain what that means, because it was the source of her incredible peace, not a coldness. She taught that death is not a wall we hit, but a turn in the road. She often spoke about the changing of the seasons. When spring turns to summer, we don't say spring has "died" or gone to a "better place." We say it has transformed. It has given way to the next phase of the year. She viewed her own life the same way. She saw herself as a temporary gathering of energy—of breath and bone and mind—that has now returned to the great flow of the world.

  To the scholars here, I know she would appreciate us remembering the story she taught every single year: the story of Zhuangzi drumming on a basin and singing when his wife died. He didn't sing because he didn't love her. He sang because he realized she had completed the cycle. She had come from the formless, taken shape, lived, and now returned to the formless, just as autumn follows summer.

  [Advisor's Name] found profound comfort in that. It meant she didn't have to fear disappearing. She believed that nothing is ever truly lost; it just changes its shape.

  There is a passage she loved near the end of the *Zhuangzi*, where the philosopher is dying. His students want to give him a lavish burial to protect his body. He tells them not to bother. He says, "Above ground, I will be food for the crows and kites. Below ground, I will be food for the mole crickets and ants. Why would you rob one to feed the other?"

  I know that sounds stark to modern ears. But what she loved about it was the impartiality. It's the idea that we belong to the whole world, not just to our families or our universities. In death, she becomes the soil that feeds the grass, the air that fills the lungs of the trees, the rain that falls on this roof. She is not leaving us; she is simply becoming the ground we stand on.

  For her family, I want you to know that while her form has changed, her influence has not. In her philosophy, the self isn't a isolated soul trapped in a body; the self is a web of relationships. She is present in the way her grandchildren notice the leaves changing color. She is present in the way her colleagues pause before making a judgment. She is present in me, and in all her students, in the way we ask questions and the way we listen. She persists in the transformation she caused in us.

  So, we will not say she is watching over us. She is not distant. She is here, in the air we breathe and the memories we share. She has simply gone into the transformation of things (*wu hua*).

  She taught us that the wise person does not try to hold onto the water as it flows through their hands, but enjoys the coolness of it while it is there. We are grateful for the coolness she gave us. We are grateful for the time the seasons kept her in this shape, with us.

  If she were here, she would probably tell us to stop making a fuss, to open the windows, and to let the fresh air in. So, in her honor, let us not be heavy. Let us be like the wind that moves through the trees—present, invisible, and continuing on.

  Thank you.
