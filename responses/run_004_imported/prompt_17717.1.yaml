  Two decision theorists are dying of thirst in the desert. A driver pulls up and says, "I'll only save you if you promise to pay me once we reach town."

  The first theorist says, "I'm being sophisticated. I know that once I'm safe, paying you yields no utility. So I won't promise. I'll stay here."

  The second theorist says, "I'm being resolute. I promise to pay, and I'll force myself to do it even when it's locally irrational!"

  The driver picks up the second theorist. They arrive in town, and the theorist hands over the cash, looking visibly distressed.

  The driver says, "You know, the other guy was actually more consistent."

  The theorist sighs, pockets his empty wallet, and says, **"Yeah, but consistency doesn't keep you hydrated."**
