answer: |-
  You and your friend hit on one of the classic fault lines in decision theory. The short answer is: **Your friend is extensionally right but intensionally wrong.**

  In the specific case of Parfit's Hitchhiker, Constrained Maximization (CM) and Resolute Choice (RC) recommend the same action (pay the driver). They both solve the problem by rejecting the standard "Straightforward Maximization" view that says you should defect once you're safe in town.

  However, they are **not** the same fix wearing different clothes. They locate rationality in different places, rely on different mechanisms to enforce compliance, and—crucially—they diverge in other cases (like Kavka's Toxin Puzzle). If you treat them as identical, you lose the ability to explain *why* the agent pays, which matters for broader ethical and decision-theoretic work.

  Here is the breakdown of the distinction, where they diverge, and how they cash out Parfit's "rational irrationality."

  ---

  ### 1. The Core Distinction: Dispositions vs. Plans

  The fundamental difference is the **locus of evaluation**.

  **Gauthier's Constrained Maximization (CM)** evaluates **dispositions (traits)**.
  *   **The Question:** "What kind of agent is it rational to *be*?"
  *   **The Mechanism:** It is rational to adopt the disposition of a "Constrained Maximizer" (someone who cooperates with other cooperators) rather than a "Straightforward Maximizer" (someone who always defects).
  *   **In the Hitchhiker:** You pay the driver not because paying *right now* maximizes utility (it doesn't; you're already safe), but because *being the kind of person who pays* is what caused the driver to pick you up. The rationality lies in the possession of the trait. The action is just the output of the trait.
  *   **Requirement:** This relies on **translucency**. The driver must be able to detect your disposition. If you can fake the disposition perfectly, CM collapses (because then you should just fake it and defect).

  **McClennen's Resolute Choice (RC)** evaluates **plans (sequences of choice)**.
  *   **The Question:** "What is the rational way to choose over *time*?"
  *   **The Mechanism:** Standard decision theory assumes **Separability**: at any choice node, you should maximize based on future outcomes from that point forward. McClennen rejects this. He argues rationality requires **Dynamic Consistency**. If a plan was optimal at $t_1$, it is irrational to abandon it at $t_2$ merely because the immediate incentives have changed, provided the reasons for the plan haven't changed.
  *   **In the Hitchhiker:** At $t_1$ (desert), the optimal plan is "Promise to pay -> Get Ride -> Pay." At $t_2$ (town), the "Promise to pay -> Get Ride" part is sunk. A Straightforward Maximizer sees only "Pay vs. Don't Pay" and defects. A Resolute Chooser sees "Execute Plan vs. Deviate from Plan." They pay because deviating violates the norm of plan-adherence that made the initial choice rational.
  *   **Requirement:** This relies on **willpower/normative commitment**. It doesn't matter if the driver can read your mind; it matters that *you* can bind *yourself*.

  **The "Same Fix" Objection:** Your friend argues both just say "commit ahead of time."
  **The Rebuttal:** CM says "commit by changing who you are." RC says "commit by sticking to what you decided." CM is about **signaling** a trait to others; RC is about **consistency** with your past self.

  ---

  ### 2. The Divergence Case: Kavka's Toxin Puzzle

  If they were truly the same theory, they would handle all Newcomb-like problems identically. They don't. The clearest divergence is **Kavka's Toxin Puzzle**.

  *   **Setup:** An eccentric billionaire offers you \$1 million if you *intend* to drink a harmless but painful toxin at midnight. You get the money at 11:59 PM if you have the intention. You do not actually have to drink the toxin to keep the money.
  *   **The Problem:** At midnight, you have the money either way. Drinking the toxin only gives you pain. So, you can't intend to drink it (because you know you won't). So you can't get the money.

  **How RC handles it:**
  McClennen explicitly uses the Toxin Puzzle to motivate Resolute Choice.
  *   **Verdict:** A Resolute Chooser forms the plan at the start: "Take the deal and drink." At midnight, even though drinking is costly and yields no new benefit, the agent drinks.
  *   **Why:** Because abandoning the plan violates dynamic consistency. By sticking to the plan, you make it possible to form the intention initially, thus securing the \$1 million. The cost of the pain is the price of plan integrity.

  **How CM handles it:**
  Gauthier struggles here, and this is where the theories split.
  *   **Verdict:** Gauthier generally argues that a rational agent *cannot* intend to do something they know they will not do. Since drinking is not utility-maximizing at the time of action (no reciprocal benefit, no future gain), a Constrained Maximizer cannot form the disposition to drink.
  *   **Why:** CM is fundamentally about **mutually beneficial cooperation**. The Toxin Puzzle is one-sided; the billionaire isn't cooperating with you, they are testing you. There is no "joint maximization" to be had by drinking the toxin. Therefore, CM does not prescribe drinking. You don't get the money, but you also don't drink the toxin.

  **The Takeaway:** In Toxin, RC says "Drink (to honor the plan)." CM says "Don't Drink (no cooperative benefit)." This proves they are not the same algorithm.

  ---

  ### 3. Parfit's "Rational Irrationality"

  You asked which one better cashes out Parfit's concept from *Reasons and Persons*. Parfit argues that it can be rational to have dispositions that cause you to act in ways that seem irrational in the moment (like keeping a threat or promise even when costly).

  **CM is the closer fit to Parfit's original intuition.**
  Parfit talks about "self-interest theory" vs. "critical self-interest theory." He suggests we should cultivate dispositions that make us successful, even if those dispositions force us to act against our immediate self-interest. This is almost verbatim Gauthier's Constrained Maximization. Parfit is interested in the **ethics of character**.

  **RC is a formalization of the logic, but misses the "character" aspect.**
  McClennen is doing decision theory, not moral psychology. RC explains *how* an agent can logically justify the action without changing their utility function, but it doesn't necessarily capture Parfit's idea that we should *become different people*. RC says you can remain a standard utility maximizer but simply adopt a different *rule of choice*. Parfit (and Gauthier) suggest the utility function itself (or the object of maximization) needs to shift to accommodate the disposition.

  ---

  ### 4. Why the Literature Keeps Them Separate

  If they yield the same result in the Hitchhiker case, why do philosophers treat them as rivals?

  1.  **Vulnerability to Exploitation:**
      *   **CM** is vulnerable if you are in a world of "Straightforward Maximizers" who can't detect dispositions. If you can't signal your trait, you get exploited.
      *   **RC** is vulnerable to **information changes**. If at $t_2$ you learn new information that makes the original plan terrible *even from the $t_1$ perspective*, RC has a hard time explaining why you should abandon the plan (since it prizes consistency). CM can reassess the utility of the disposition.

  2.  **The "Why" Matters for Normativity:**
      *   If you teach people CM, you are teaching them to cultivate honesty as a virtue ("I am a payer").
      *   If you teach people RC, you are teaching them to cultivate willpower ("I keep my resolutions").
      *   These produce different psychological profiles. A CM agent might pay even if they forget their specific promise, because they are honest. An RC agent might not pay if they forget the specific plan, because there is no resolution to adhere to.

  3.  **Separability:**
      *   RC requires rejecting a foundational axiom of standard decision theory (Separability). This is a huge theoretical cost.
      *   CM keeps standard decision theory intact but changes the *object* being evaluated (from acts to dispositions). Many theorists prefer CM because it breaks fewer formal rules.

  ### The Verdict

  **You win the argument, but your friend isn't crazy.**

  *   **Your Friend's Point:** Functionally, in the Hitchhiker case, both theories serve as "pre-commitment strategies" that override local utility maximization. If you just want to know *what to do*, they are equivalent.
  *   **Your Point:** Theoretically, they are distinct. One is about **who you are** (CM), the other is about **what you decided** (RC). They diverge in the Toxin Puzzle, they rely on different axioms (Translucency vs. Separability), and they map onto Parfit's "Rational Irrationality" differently (Character vs. Consistency).

  If you want to settle it over drinks: Tell your friend that in the Toxin Puzzle, a Resolute Chooser drinks the poison and a Constrained Maximizer doesn't. If they agree those are different outcomes, they have to admit the theories are different. If they say "both drink," they don't understand Gauthier. If they say "neither drink," they don't understand McClennen.
