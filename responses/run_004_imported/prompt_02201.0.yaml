          *   *In Hitchhiker:* At $t_1$ (in the desert), you plan to pay at $t_2$ (in town). At $t_2$, paying costs money and saves nothing (you're already safe). A resolute chooser pays because deviating violates the plan structure that made the initial choice optimal.
