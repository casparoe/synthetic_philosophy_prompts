answer: |-
  This is a classic instantiation of the "boundary problem" in democratic theory, pitting the **All-Affected Principle (AAP)** against the **All-Subjected Principle (ASP)**. Your students have reconstructed a debate that mirrors contemporary literature (e.g., Goodin vs. Whelan, or López-Guerra vs. Song).

  Here is an evaluation of the exchange move-by-move, followed by the broader theoretical considerations they are overlooking.

  ### Move-by-Move Evaluation

  **Move 1: Elena (The All-Affected Intuition)**
  *   **Verdict:** **Elena wins.**
  *   **Reasoning:** In the context of a stylized seminar case, Elena has the stronger initial moral claim. The scenario is specifically designed to trigger the intuition of "no taxation without representation" (or in this case, "no pollution without representation"). By highlighting that the administrative boundary predates the relevant decision and arbitrarily excludes those bearing the primary costs, she successfully frames the exclusion as a democratic deficit. Marcus has not yet spoken, so Elena establishes the normative baseline: democracy is about protecting interests from being overridden.

  **Move 2: Marcus (The Indeterminacy Objection)**
  *   **Verdict:** **Marcus wins.**
  *   **Reasoning:** Marcus raises the standard and most potent objection to the All-Affected Principle: the problem of indeterminacy. Causal chains are infinite; butterfly effects are real. If "affected interests" determine the *demos*, the *demos* becomes co-extensive with humanity for almost any decision (e.g., climate change, global markets). Marcus correctly identifies that a principle that cannot generate a determinate boundary is practically useless for institutional design. He successfully shifts the burden to Elena to explain where the line is drawn without resorting to the very administrative boundaries she just criticized.

  **Move 3: Elena (The Coercion Counter)**
  *   **Verdict:** **Elena wins.**
  *   **Reasoning:** Elena makes a sophisticated move by challenging Marcus's distinction between "side-effects" and "subjection." She correctly notes that the legal background (nuisance and property law) is not neutral; it is a coercive apparatus that actively *enforces* Rivermouth's decision upon Fenwick by barring Fenwick residents from stopping it. This aligns with the republican view of freedom as non-domination. If the state's coercive power is used to protect Rivermouth's right to pollute over Fenwick's objection, Fenwick is effectively subject to Rivermouth's legal order, even if they aren't formally citizens. She successfully blurs Marcus's bright line.

  **Move 4: Marcus (The Collapse and Concession)**
  *   **Verdict:** **Elena wins (on theory), Marcus wins (on logic), but overall advantage to Elena.**
  *   **Reasoning:** Marcus is logically correct that if Elena's definition of coercion (being legally barred from suing over externalities) holds, his All-Subjected Principle collapses back into the All-Affected Principle, because almost all externalities are protected by some background legal rule. However, Marcus concedes the normative core of his argument: he admits he "could not yet say why subjection, rather than interest, should count as the more basic notion." In a normative theory seminar, admitting you cannot justify the foundational norm of your criterion is a significant weakness. Elena has forced him into a corner where his criterion is either arbitrary (if he sticks to formal jurisdiction) or collapses into hers (if he accepts her definition of coercion). While Marcus is right that we *need* determinacy, Elena has shown that his justification for *his* specific boundary is currently hollow.

  **Overall Score:** **Elena 3, Marcus 1.**
  Elena has the stronger normative case, while Marcus has successfully highlighted the practical difficulties of her position but failed to provide a normative defense for his own.

  ***

  ### Overlooked Considerations: The Boundary Problem

  Both students are operating within a framework that assumes the boundary of the *demos* must be fixed *prior* to decision-making based on a single moral metric (interests vs. subjection). Here are four crucial considerations they are overlooking that might help you settle the seminar discussion:

  **1. The Circularity Problem (Whelan's Critique)**
  Both students assume we can neutrally identify who is "affected" or "subject" before the political unit exists. Frederick Whelan famously argued that this is circular: you need a *demos* to decide who the *demos* should be. Any rule used to determine the boundary (like "all affected") must itself be authorized by a *demos*.
  *   **Implication:** There may be no "principled" way to fix the boundary from the outside. Boundaries are often historical accidents that become legitimate through time and recognition, not moral deduction. The question isn't "which principle is true?" but "how do we legitimize existing boundaries?"

  **2. Functional vs. Moral Boundaries**
  Elena and Marcus treat the boundary as a moral question, but political scientists often treat it as a functional one. A *demos* requires the capacity for collective agency, deliberation, and enforcement.
  *   **Implication:** Fenwick residents might be *affected*, but can they practically deliberate with Rivermouth residents? If the *demos* is too large or diffuse, democratic communication breaks down. The boundary might be justified not by who *should* vote, but by the scale at which effective self-government is possible. This suggests a "subsidiarity" approach: decide at the lowest level possible, but with checks on externalities.

  **3. Remedies Beyond Franchise**
  Both students assume the only remedy for Fenwick is a vote in Rivermouth's referendum. This is a false dichotomy. Democratic theory offers other mechanisms for handling externalities without dissolving boundaries:
  *   **Compensation:** Rivermouth votes, but must compensate Fenwick (Pigouvian taxes).
  *   **Veto Rights:** Fenwick gets no vote on the budget, but has a veto on noise levels.
  *   **Higher-Order Authority:** This is exactly why states/provinces exist—to adjudicate disputes between municipalities. The "principled boundary" might be the state level, not the town level.
  *   **Implication:** The *demos* for *who decides* might differ from the *demos* for *who bears costs*. We can separate the franchise from the protection of interests.

  **4. The Constitutive View of Boundaries**
  Elena treats interests as pre-political (they exist, then we draw lines). Marcus treats jurisdiction as pre-political (lines exist, then we check subjection). A third view is that political boundaries *constitute* interests.
  *   **Implication:** By drawing the line at Rivermouth, the state creates a specific set of shared interests among Rivermouthians that didn't exist before. Changing the boundary changes the interests. Therefore, the boundary cannot be determined *by* the interests, because the interests are dependent on the boundary. This suggests that boundary drawing is an inherently political, constitutive act, not a technical application of a moral formula.

  ### Recommendation for the Seminar
  You might tell your students that **Elena is right about the injustice, but Marcus is right about the impossibility.**

  The Rivermouth case is unjust, but expanding the *demos* to include everyone affected creates an infinite regress. The solution likely lies not in finding the "true" boundary of the *demos*, but in **multilevel governance**. The "principled" boundary for airport noise isn't the town line; it's the regional or state level. The failure here isn't necessarily that Fenwick can't vote in Rivermouth, but that the decision was made at a level of government too low to internalize the costs.

  This moves the debate from "Who belongs in the *demos*?" to "At what level should this decision be made?"—a shift that often resolves the tension between affected interests and administrative feasibility.
