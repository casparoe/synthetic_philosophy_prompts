answer: |-
  **Elena:** You're treating Popper's 1978 Darwin Lecture like a conversion experience. It wasn't. It was a strategic retreat. He spent decades calling natural selection a "metaphysical research programme" because he saw the logical trap: if fitness is defined by reproductive success, then "the fittest survive" is just "the survivors survive."

  **Marcus:** That's the caricature version. Popper conceded because he finally engaged with the *propensity interpretation* of fitness. It's not about who *did* survive; it's about the probabilistic disposition to survive given specific traits. That's empirically measurable independent of the outcome.

  **Elena:** Measurable how? Without the outcome? You measure the trait's causal efficacy, sure. But the moment you call that efficacy "fitness," you've already presupposed the selection mechanism. You're smuggling the explanandum into the explanans.

  **Marcus:** Okay, let's leave the semantics. Look at the practice. In experimental evolution, we make risky predictions. We can predict the trajectory of allele frequencies in a population under specific stressors. If the frequency doesn't shift as the selection coefficient dictates, the hypothesis is falsified. That happens.

  **Elena:** But that tests a *specific selection hypothesis*, not the *principle* of natural selection itself. If the allele doesn't shift, you don't throw out natural selection. You posit drift, gene flow, or a hidden constraint. The core principle absorbs the failure. That's exactly what Popper meant by "metaphysical." It's a framework for generating theories, not a theory itself.

  **Marcus:** I'll concede that point regarding field biology. The adaptationist programme often does degenerate into just-so stories where failure is explained away by auxiliary hypotheses. If a trait isn't optimal, we say there was a trade-off we missed. That *is* immunizing the theory.

  **Elena:** Exactly. So why defend the falsifiability claim?

  **Marcus:** Because in controlled contexts, the principle *is* the variable. Think of the Lenski long-term evolution experiment. They predicted the emergence of citrate usage based on mutation rates and selection pressures. When it happened, it wasn't a redescription. It was a novel function arising from differential reproduction. If those bacteria hadn't evolved despite the pressure, it would have challenged the causal power of selection.

  **Elena:** But did it challenge the *tautology*? You measured the fitness advantage of the citrate mutants *after* they took over. You didn't specify independent fitness criteria beforehand that guaranteed success. You observed the success, then attributed the fitness.

  **Marcus:** We measured the metabolic efficiency beforehand. That's the independent trait.

  **Elena:** Metabolic efficiency isn't fitness. It's a correlate. If those efficient bacteria got wiped out by a virus tomorrow, their fitness was zero. Fitness is ultimately relational and retrospective.

  **Marcus:** So you're saying natural selection is true by definition?

  **Elena:** I'm saying it's a organizing principle, like causality. You can't falsify causality; you use it to falsify specific causal claims. Popper's original instinct was sharper. By calling it testable, he gave ammunition to critics who think one failed prediction kills Darwinism.

  **Marcus:** But if it's just metaphysical, why does it generate engineering solutions? Antibiotic rotation strategies work because we treat selection as a law-like constraint.

  **Elena:** Because the *models* built on the framework work. Newtonian mechanics works even if absolute space is metaphysical nonsense. My worry isn't that selection is false. It's that claiming it's falsifiable in the Popperian sense misunderstands its logical role. It protects the theory from real scrutiny by pretending it's vulnerable to the wrong kinds of tests.

  **Marcus:** Then we agree on the risk. But disagree on the remedy. Calling it metaphysical hands it over to the skeptics. Calling it testable forces us to tighten the models.

  **Elena:** Or it forces us to lie about what counts as a test.

  **Marcus:** Or it forces us to stop worrying about logical purity and start looking at the bacteria.

  **Elena:** *(Sips wine)* That's the biologist in you talking.

  **Marcus:** And that's the philosopher in you stopping the science.

  **Elena:** Someone has to check the foundations.

  **Marcus:** Just don't pull the rug out while we're standing on it.
