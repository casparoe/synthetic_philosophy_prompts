    "measure_and_convention": <score out of 5>,
    "commensurability": <score out of 5>,
    "oikonomia_vs_chrematistike": <score out of 5>,
    "usury": <score out of 5>,
    "total": <score out of 20>,
    "comments": ["...", "...", "..."],
    "overall_assessment": "<two or three sentences>"
  }
  ```
