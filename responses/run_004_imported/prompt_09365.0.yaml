      *   *Greek:* The phrase is often translated as "reasoning of the cause" or "calculation of the cause." Jowett says "tie of the cause."
      *   *Context:* The Larisa example.
          *   Person A: Knows the way (has traveled it).
          *   Person B: Has true opinion (heard directions, guessed right).
