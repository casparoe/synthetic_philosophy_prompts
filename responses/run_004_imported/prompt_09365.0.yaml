          *   *Meaning:* He is certain *that* they differ. He is unsure about the *mechanism* (recollection/tethering metaphor).
          *   *Why?* Because the *Meno* is an aporetic dialogue (mostly). They haven't defined Virtue. They haven't fully proven Recollection (the myth is a myth).
