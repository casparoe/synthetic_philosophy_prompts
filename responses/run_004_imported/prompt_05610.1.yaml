answer: |-
  This exchange is a textbook dramatization of the **Rule-Following Paradox**, most famously articulated by **Ludwig Wittgenstein** in *Philosophical Investigations* and later interpreted by **Saul Kripke**. The core tension is between **semantic realism** (Marcus: meanings are fixed facts) and **semantic skepticism** (Lena: no fact fixes meaning across all possible cases).

  Here is an analysis of the exchange move by move, evaluating who has the better of it, followed by what both are missing.

  ### Move 1: Marcus (The Literal/Pragmatic Claim)
  > *Marcus said the payout is obviously $10,000 -- that's just what 5% means, and it's what they've always meant by the rule.*

  *   **Analysis:** Marcus appeals to standard linguistic convention and the "course of dealing." In ordinary language and business, "5%" is understood as a proportional calculation without an implicit ceiling unless specified.
  *   **Who has the better of it?** **Marcus (Pragmatically).** In any court of law or normal business context, Marcus wins. The "reasonable person" standard would interpret "5%" as 5%, full stop. His appeal to "what they've always meant" relies on the stability of language, which is necessary for commerce to function.
  *   **Weakness:** Logically, he is begging the question. He assumes the rule *has* a determinate meaning that extends to this new case, which is precisely what is being challenged.

  ### Move 2: Lena (The Skeptical Hypothesis)
  > *Lena said it isn't obvious at all: every past payout is equally consistent with a rule that charges 5% up to some cap and then flattens out, since no invoice large enough to tell the two rules apart has ever come up before now...*

  *   **Analysis:** This is the heart of the Wittgenstein/Kripke paradox (often illustrated with "plus" vs. "quus"). Lena points out that any finite set of past actions (invoices under \$10k) can be fitted by infinite competing rules (e.g., "5% uncapped" vs. "5% capped at \$5k"). Since the past data is identical for both rules, the past data alone cannot *logically necessitate* the current decision.
  *   **Who has the better of it?** **Lena (Logically).** She is technically correct. Past behavior does not logically entail future application. There is no "fact" in the history of the studio that distinguishes the uncapped rule from the capped rule until a case arises that separates them.
  *   **Weakness:** While logically sound, it is pragmatically paralyzing. If applied universally, it suggests we never know what any word means in a novel context.

  ### Move 3: Marcus (The Introspective Appeal)
  > *Marcus said he can settle it by introspection: he's always privately had "5%, no matter how large the invoice" in mind, and that fixes the answer.*

  *   **Analysis:** Marcus retreats to mental states. He argues that the meaning was fixed by his internal intention at the time the rule was made.
  *   **Who has the better of it?** **Lena (Philosophically).** This is a vulnerable move for Marcus. As Wittgenstein argued, a mental state (an image, a feeling, a sentence in the head) is just another sign. How do you know you are applying that mental state *correctly* right now? If you meant "5%," how does that past mental state force your current hand to calculate \$10,000 rather than \$5,000? The mental state itself requires interpretation.
  *   **Weakness:** Introspection cannot bridge the gap between *having* a thought and *applying* it normatively.

  ### Move 4: Lena (The Critique of Introspection)
  > *Lena said that doesn't help, since whatever he had "in mind" is just as open to two readings as the rule itself was, and if the number had been outlandish enough he might well have balked or miscalculated...*

  *   **Analysis:** Lena doubles down on the skeptical argument. She notes that dispositions (what Marcus *would* have done) are also unreliable. If the invoice were \$1 trillion, 5% is \$50 billion (more than the studio is worth). Marcus likely would have refused. This suggests his "intention" was never truly "5% no matter what," but rather "5% within reasonable bounds."
  *   **Who has the better of it?** **Lena.** She successfully dismantles Marcus's introspective defense. She highlights that intentions are often vague and context-dependent. We rarely intend for every logical consequence of our rules; we intend for them to work within a "form of life" or normal context.
  *   **Weakness:** She still hasn't offered a way to *resolve* the dispute, only a reason why Marcus's justification fails.

  ### Move 5: Marcus (The Reductio ad Absurdum)
  > *Marcus, frustrated, said that by this logic no agreement between two people could ever be shown to mean one determinate thing rather than another, which is absurd. Lena had no good answer to that, and neither did I.*

  *   **Analysis:** Marcus appeals to the consequences of Lena's skepticism. If she is right, language and contracts are impossible. Since language and contracts *are* possible (we are using them right now), her logic must be missing something.
  *   **Who has the better of it?** **Marcus (Existentially), but neither (Philosophically).** Marcus is right that the skepticism is unlivable. We *do* communicate, and agreements *do* hold. However, he hasn't explained *how* they hold, he has only asserted that they must. Lena has no answer because she is trapped in the skeptical framework where meaning requires a "super-fact" that doesn't exist.
  *   **Why Lena is stuck:** She accepts Marcus's premise that for a rule to be meaningful, there must be a *fact* that determines its application in advance. Since she proved that fact doesn't exist, she thinks meaning is indeterminate.
  *   **Why Marcus is stuck:** He knows meaning exists but can't defend it against Lena's logical deconstruction of "facts" and "intentions."

  ---

  ### What Both of Them Are Missing

  Both Lena and Marcus are trapped in a philosophical picture of meaning that assumes **meaning must be grounded in a specific fact** (either a past behavioral fact, a mental fact, or a logical fact). They are missing the **Social/Pragmatic Solution**.

  **1. Meaning is Use, not Reference (Wittgenstein's Solution)**
  Wittgenstein's answer to this paradox is not to find a "fact" that fixes meaning, but to change how we understand meaning. Meaning is not a ghostly entity attached to words or thoughts; it is established by **custom, practice, and social agreement**.
  *   **The Fix:** The rule means "5% uncapped" not because of a metaphysical fact in Marcus's head, but because that is how their *community of practice* (the business world, their studio) goes on. Correctness is determined by whether the community accepts the move. If Marcus pays \$10k, the freelancer accepts it, and the industry nods, the rule *was* "5% uncapped."
  *   **Move 5 Revisited:** Marcus is right that skepticism is absurd, but not because there is a hidden fact. It is absurd because meaning is a public activity, not a private puzzle. Lena loses Move 5 because she is looking for a justification *outside* of human practice.

  **2. Contract Law and "Reasonable Expectations"**
  In a legal context, they are missing the doctrine of **implied terms** and **unconscionability**.
  *   **Course of Dealing:** While Lena is right that past data fits a capped rule, courts interpret contracts based on the "reasonable expectations of the parties." In the design industry, a referral fee is a standard commission. Standard commissions are rarely capped unless stated.
  *   **The "Outlandish" Test:** Lena mentions in Move 4 that Marcus would have balked at a \$1 trillion invoice. This actually supports a legal resolution: The rule is "5% within the bounds of the studio's solvency and standard industry practice." \$10,000 is within those bounds; \$50 billion is not. The rule is determinate enough for *this* case, even if it isn't for *all possible* cases.

  **3. The Normativity of Intent**
  Marcus assumes his intention was a static object. Lena assumes intentions are useless. Both miss that intentions are **normative commitments**. When Marcus made the rule, he undertook an obligation to act in certain ways. If he now refuses to pay, he isn't revealing a hidden truth about the past rule; he is *breaking* a commitment. The "fact" of the matter is created by the accountability of the relationship, not by a pre-existing mental snapshot.

  ### Summary Verdict
  *   **Moves 1 & 3 (Marcus):** Weak. He relies on intuition and private mental states which cannot withstand skeptical scrutiny.
  *   **Moves 2 & 4 (Lena):** Strong logically, but practically sterile. She successfully proves that no *past fact* determines the future, but fails to see that meaning doesn't require that kind of determination.
  *   **Move 5 (Marcus):** The turning point. He identifies the absurdity, but lacks the vocabulary to explain why the absurdity doesn't obtain.
  *   **The Winner:** **Marcus wins the money, Lena wins the argument.** In the real world, Marcus pays the \$10,000 because social and legal practices override the skeptical paradox. But philosophically, Lena has correctly identified that there is no "super-fact" that makes him right.
  *   **The Missing Key:** Meaning is secured by **shared forms of life and social accountability**, not by private facts or logical entailment. They don't need to find a fact that settles the rule; they need to recognize that *they* settle the rule by how they proceed together.
