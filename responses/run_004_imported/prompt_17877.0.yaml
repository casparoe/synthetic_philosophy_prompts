answer: |-
  The darkness in the drawing room was not absolute, but it was thick enough to hide the tremor in Henry's hands. He sat at the small round table, his palms pressed flat against the mahogany, feeling the grain through the velvet cloth. To his left sat Eleanor, her breathing steady, a silent anchor. To his right, the medium, a woman of indeterminate age whose name Henry had already filed away as irrelevant data. Only the phenomena mattered. The person was merely the apparatus.

  It was 1899. Henry was sixty-one, though his bones felt older, brittle as dried chalk. He had spent a lifetime constructing a cathedral of reason, *The Methods of Ethics*, brick by logical brick. He had sought to prove that morality was rational, that duty and self-interest could walk the same path. But he had found a crack in the foundation, a fissure he called the Dualism of Practical Reason. If the universe offered no reward for virtue, if the self-sacrificing man ended in the same dust as the scoundrel, then morality was not rational. It was merely a noble instinct. To save ethics, he needed God. To save God, he needed the soul. To save the soul, he needed evidence.

  And so, here he sat in the dimness of a Kensington townhouse, waiting for a rapping sound.

  "Focus," the medium whispered. Her voice was thin, strained. "The boundary is thin tonight."

  Henry closed his eyes. He did not pray; prayer implied a listener, and he had no data on listeners. Instead, he prepared his mind for observation. He was the President of the Society for Psychical Research, but in this room, he was simply a witness. He had spent nearly twenty years sifting through frauds, exposed trickery, and coincidences masquerading as miracles. He had ruined reputations with his scrutiny and disappointed believers with his caution. He wanted to believe. God knew, he wanted to believe more than the fervent widows who wept in these chairs. His hunger was not for comfort, but for coherence. Without the survival of the self, the moral universe was fractured.

  A cold draft brushed his ankle.

  Henry's eyes remained shut. *Air current,* his mind supplied. *Old sash window. Or the settling of the house.*

  Then, a touch. Light, distinct, on the back of his left hand. Not the brush of fabric, but the pressure of a finger.

  His heart hammered against his ribs, a frantic, biological betrayal. He kept his breathing even. *Muscular contraction of the medium,* he thought. *Unconscious movement. Table tilt.*

  "Henry," a voice said.

  It was not the medium's voice. It was faint, seemingly originating from the corner of the room, devoid of timbre.

  He opened his eyes. The room was unchanged. The shadows held their shapes. Eleanor was still, her hands folded in her lap. The medium was slumped forward, her head resting on her arms.

  "Did you hear?" Eleanor asked, her voice trembling slightly.

  "I heard a sound," Henry said. He kept his tone level, scrubbing it of hope. "Auditory hallucination is common in low-light conditions. Pareidolia of the ear."

  "It said your name."

  "Sound carries. The walls are thin."

  He was lying, or at least, he was curating the data. He felt the ghost of that touch still burning on his hand. If it were real, if the veil were truly porous, then the Dualism could be resolved. Duty could be reconciled with Self-Interest in the long run of eternity. The sacrifice of the good man would be accounted for. The universe would be just.

  But if he accepted this without proof, he betrayed the very reason he sought to vindicate. To accept a miracle without evidence was irrational. To demand evidence that the nature of the phenomenon might not yield was perhaps equally stubborn.

  The table shuddered. It was a violent jerk, enough to rattle the teacups on the sideboard. Henry's hand slid on the velvet. He felt the wood move beneath him, lifted by a force that did not seem to originate from the muscles of the people sitting around it.

  *Fraud,* the skeptic in him roared. *Leverage. Knees beneath the table.*

  *Possibility,* the desperate man whispered.

  He reached into his pocket, his fingers brushing the notebook he always carried. He wanted to write it down: *9:45 PM. Violent agitation. Source unknown.* But to write it was to codify it, to give it weight. If he wrote it, he admitted it was worth weighing. If he weighed it, he had to acknowledge he wanted the scale to tip.

  "Henry," the voice came again, closer now. "The work... is not... finished."

  A chill that had nothing to do with the draft ran down his spine. It was a sentiment he had thought a thousand times. *The work is not finished.* The ethics were incomplete. The proof was missing. Was this his own mind projected outward, or was it an intrusion from the other side?

  He looked at the medium. She did not stir.

  "Eleanor," Henry said softly. "Did you move your knee?"

  "No, Henry."

  "Did you push?"

  "No."

  He sat back. The darkness seemed to press in, heavy and suffocating. He had the evidence. He had the touch, the voice, the movement. But he also had the history of human deception, the infinite capacity for self-delusion. He could not sign his name to a certificate of authenticity. He could not stand before the Royal Society and declare that the moral order was saved by a rapping sound in Kensington.

  And yet, he could not declare it false. To say *no* was to condemn the universe to silence. To say *yes* was to abandon his rigor.

  "The sitting is concluded," Henry said. His voice sounded hollow in the small room.

  He struck a match. The flare of sulfur and light banished the shadows. The room looked ordinary again. Dust motes danced in the sudden illumination. The table was just wood. The medium was just a woman waking from a nap.

  Eleanor touched his arm. "Did we find anything, Henry?"

  He stood up, his joints stiffening. He thought of the Dualism, that great wound in his philosophy. It remained open. The evidence was insufficient to close it, but it was too potent to ignore. He would go home. He would write in his journal. He would categorize the event as *inconclusive but noteworthy.*

  He walked to the door and put on his coat. The night air outside would be cold, the fog thick off the Thames. He would walk through it, suspended between the need for truth and the need for hope.

  "We found," Henry said, opening the door to the street, "that the inquiry must continue."

  He stepped out into the fog, carrying the uncertainty with him, a heavy, necessary burden, leaving the question of the soul as unresolved in death as it had been in life.
