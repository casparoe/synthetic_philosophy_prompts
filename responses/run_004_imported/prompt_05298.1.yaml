      *   *Mechanism:* The human pressing the off-switch provides information about $R$ (specifically, that the current plan has negative expected value according to the *true* $R$).
      *   *Result:* A rational expected-utility maximizer with sufficient uncertainty will defer to the switch.
      *   *User's Conclusion:* This solves the shutdown problem.

  3.  **Identify the Gaps/Limitations (Why it's not "solved"):**
