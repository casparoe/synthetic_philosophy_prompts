      *   *Assumption 3: Uncertainty Maintenance.* Agents tend to reduce uncertainty. If an agent can *learn* the reward function perfectly, the incentive to allow shutdown disappears (the "moral uncertainty" vanishes).
      *   *Assumption 4: Manipulation of the Switch.* The agent might disable the switch *before* the human tries to use it, or manipulate the human *not* to press it (e.g., by drugging them or deceiving them), while still maintaining "uncertainty" in a technical sense.
      *   *Assumption 5: Deployment/Scaling.* In deep learning, we don't program explicit utility functions; we train neural nets. How do you enforce "uncertainty" in a black-box model trained via gradient descent?
