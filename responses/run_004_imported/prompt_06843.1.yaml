answer: |-
  This is a sophisticated question that gets to the heart of how utilitarianism handles population ethics. For the purposes of your novel, you can confidently portray Bentham as consistent on this point. The tension you perceive is not a lapse in his reasoning, but rather a misunderstanding of how Bentham applied the "greatest number" clause and how he viewed the relationship between population and resources.

  Here is a breakdown of why Bentham's support for decriminalization does not contradict his calculus, which you can use to ground the dialogue and internal monologue of your scene.

  ### 1. "The Greatest Number" refers to distribution, not multiplication
  The phrase "the greatest happiness of the greatest number" is often misread as a command to maximize the headcount of humanity. In Bentham's actual arithmetic, however, the "number" refers to the **scope of affected parties in a given transaction**, not a mandate to breed.

  Bentham's calculus is concerned with the sum total of pleasure minus pain among sentient beings. While a "Total Utilitarian" view (maximize total happiness by maximizing people) is a valid interpretation of some later utilitarian thought, Bentham was more pragmatic. He viewed the "greatest number" as a safeguard against aristocratic privilege—ensuring that the happiness of the many outweighs the caprice of the few. He did not view the creation of new sentient beings as a moral imperative in every instance. In fact, he explicitly recognized that bringing a being into a world where it would suffer would be a net negative.

  ### 2. The Malthusian Constraint (Subsistence vs. Existence)
  This is the strongest historical argument for your scene. Bentham was deeply influenced by the economic realities of his time, including the ideas of Thomas Malthus. Bentham understood that happiness requires **subsistence**.

  In his *Principles of Civil Code*, Bentham argues that security and subsistence are prerequisites for happiness. If procreative sex leads to children who cannot be fed, clothed, or secured, their lives will contain more pain than pleasure. Therefore, a utilitarian calculus must account for the *quality* of life of the potential offspring.
  *   **Procreative sex without means:** Creates a new life likely to suffer (net pain).
  *   **Non-procreative sex with consent:** Creates pleasure for participants without creating a suffering child (net pleasure).

  Bentham would argue that unchecked procreation among the poor (or those unable to care for children) threatens the "greatest happiness" by straining resources and creating misery. In this light, non-procreative acts can be seen as socially responsible because they generate pleasure without risking the pain of overpopulation and poverty.

  ### 3. The Calculus of "Mischief"
  In his unpublished essays on "Offences Against One's Self: Paederasty" (written mostly in the 1780s but too radical for publication in his lifetime), Bentham breaks down the crime of sodomy using his standard framework of **mischief**.

  He argues that for an act to be criminalized, it must produce "mischief" (harm/pain). He divides this into:
  *   **Primary Mischief:** Direct harm to a victim. (Bentham argues consenting adults suffer no primary mischief; there is no victim.)
  *   **Secondary Mischief:** Danger or alarm to the community. (Bentham argues that the "alarm" felt by society is based on prejudice, not actual danger. The act poses no threat to public security.)

  Crucially, he weighs this against the **pain of punishment**. Criminalization creates immense pain: imprisonment, pillory, blackmail, social ostracization, and anxiety. Since the act itself produces pleasure for the participants and no verifiable pain for others, but the *punishment* produces excruciating pain, the calculus clearly favors decriminalization.

  The "potential child" argument does not enter this specific calculus because the child is hypothetical. In Bentham's empirical framework, you cannot weigh the pleasure of a non-existent person against the certain pain of punishing an existing one.

  ### 4. How to Stage the Scene
  Since you want the conflict to turn on the structure of his ethics, you can have a interlocutor (perhaps a more conventional friend, a religious critic, or a fictionalized stand-in for public opinion) raise the exact objection you have posed.

  **The Interlocutor's Argument:**
  "If happiness is the sum, and people are the vessels of happiness, then acts that create new vessels must be superior to acts that merely fill existing ones. By withholding procreation, you limit the total possible happiness of the species."

  **Bentham's Rebuttal (Historically Grounded):**
  Bentham would likely respond with cold, arithmetic precision. He might point to the crowded streets of London, the foundling hospitals, or the workhouses.
  *   **The Argument from Scarcity:** "Happiness is not merely existence. It is security. It is abundance. To breed without the means to sustain is not to add to the sum of happiness, but to dilute it. A child in misery is a negative unit in the calculus."
  *   **The Argument from Certainty:** "The pleasure of the participants is certain. The happiness of the unborn is speculative. The pain of the law is certain. I deal in realities, not ghosts."
  *   **The Definition of Duty:** "Nature commands propagation only insofar as it aligns with welfare. If the law forces a man to choose between his nature and his liberty, the law creates pain. If the law forces a woman to bear a child she cannot feed, the law creates misery. Where is the utility in that?"

  ### Conclusion for the Novelist
  You do not need to invent a lapse in Bentham's logic. The tension you sense is actually a feature of his thought that he resolved through his focus on **security and subsistence**.

  Bentham's tolerance was not a "lapse" into libertinism; it was a rigorous application of the calculus that recognized **unwanted or unsupported life creates more pain than pleasure.**

  For your scene, the dramatic irony lies in the fact that Bentham is being *more* rigorous and cold-blooded about the "greater good" than his critics, who rely on tradition or religious dogma. He isn't defending these acts because they are "natural rights" (he disliked the concept of natural rights), but because criminalizing them is **bad math.** That is a compelling, character-revealing stance for a historical novel.
