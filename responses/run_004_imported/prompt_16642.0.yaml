answer: |-
  Here is a constructed example designed to test your friend's claim that sophistication dissolves the indeterminacy problem, followed by an explanation of why Millikan's "Normal Conditions" fails to resolve it.

  ### The Example: The Wolf's Multimodal Prey-Recognizer

  Imagine a highly sophisticated cognitive mechanism in a **Gray Wolf**, evolved for initiating a high-energy pursuit sequence. Unlike the frog's tongue snap, this is not a simple reflex; it involves the integration of olfactory, auditory, and visual data, cross-referenced with wind direction and terrain memory.

  **The Selection History:**
  Throughout the relevant evolutionary history of this wolf population, there was a perfect correlation between two properties:
  1.  **Property A (The Distal Object):** Being a healthy, adult **Elk**.
  2.  **Property B (The Proximal Cluster):** Emitting a specific **Multimodal Signature** (a precise combination of musk-chemicals, hoofbeat frequencies, and silhouette-profiles).

  In the Environment of Evolutionary Adaptedness (EEA), nothing emitted Signature B unless it was an Elk, and every Elk emitted Signature B. The wolf's ancestors who pursued Signature B gained calories and survived; those who ignored it starved.

  **The Divergence:**
  Today, human hunters introduce a **Robotic Decoy** designed to test the wolves. This robot is engineered to perfectly emit Signature B (the exact musk, the exact hoofbeat rhythm, the exact silhouette). However, it is not an Elk (Property A); it is a machine with no nutritional value.

  **The Indeterminacy:**
  When the wolf encounters the robot and initiates the pursuit sequence, teleosemantics must assign content to the wolf's cognitive state.
  *   **Interpretation 1:** The content is **"Elk."** The wolf is misrepresenting the robot as an elk. The mechanism is *malfunctioning* (a false positive).
  *   **Interpretation 2:** The content is **"Entity-with-Signature-B."** The wolf is correctly representing the robot. The mechanism is *functioning properly*, but the environment has changed.

  Your friend argues that because the wolf's system is sophisticated (integrating smell, sound, and sight), Interpretation 1 is obvious: the wolf is "trying" to find an Elk, not just a smell. However, from a selected-effects perspective, both interpretations have **equal historical justification**. Selection did not shape the wolf to detect "Elk-ness" (a metaphysical category); it shaped the wolf to detect the *sensory correlates* of Elk-ness. Since those correlates were co-extensive with Elk-ness throughout the entire selection history, the historical record contains no data point that privileges "Elk" over "Signature-B." The sophistication merely makes Signature-B more complex; it does not bridge the gap between the sign and the distal object.

  ### Why "Normal Conditions" Does Not Settle It

  Millikan attempts to resolve this by appealing to **Normal Conditions** (*Normalbedingungen*). She argues that the content of a representation is the condition that *normally* correlates with the mechanism's firing and explains its success in the past. She would argue that under Normal Conditions, Signature B maps to Elk, so the content is "Elk."

  However, this fails to solve the structural problem for two reasons:

  1.  **The Co-Extension Problem within Normal Conditions:**
      In the Normal Conditions of the wolf's evolutionary past, "Being an Elk" and "Having Signature B" were not just correlated; they were **co-extensive**. Every instance of the mechanism's successful consumption (eating) involved *both* properties simultaneously. Millikan's theory requires us to identify *which* of these co-extensive properties constitutes the "mapping rule." Does the mechanism map Signature B $\rightarrow$ Elk? Or does it map Signature B $\rightarrow$ Signature B? The history of success is identical for both mappings. Appealing to Normal Conditions presupposes we already know the content is "Elk" (the distal object) to define the conditions, rather than deriving the content *from* the conditions.

  2.  **The Distality Ambiguity:**
      Teleosemantics aims to naturalize content by tying it to biological function. But biological function is satisfied by the *consumption* of the sign (the pursuit), which leads to nutrition. The nutrition comes from the Elk, but the *trigger* is the Signature. Millikan's "Normal Conditions" tells us that the sign must correspond to the condition that makes the consumption beneficial. But since the Signature *guaranteed* the Benefit in the past, the Signature itself can be described as the condition that made consumption beneficial (i.e., "Pursuing Signature-B led to food"). Without an independent principle to privilege the *distal cause* (Elk) over the *proximal trigger* (Signature), "Normal Conditions" simply describes the correlation without explaining which side of the correlation determines the truth conditions.

  **Conclusion:**
  The problem is not the crudeness of the frog's eye; it is the nature of historical explanation. History records correlations, not intentions. No matter how many sensory modalities you add to the wolf's cognitive architecture, if those modalities were perfectly correlated with a distal object throughout selection history, the theory lacks the resources to say the organism represents the *object* rather than the *correlation*.
