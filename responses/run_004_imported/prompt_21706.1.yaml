      *   *Mishneh Torah* (and Principle 9) suggests the Law is eternal and unchanging, including the sacrificial order in the Messianic era.
      *   *Key Question:* Is the *Guide*'s explanation historical/psychological (why they existed *then*) or teleological (what will happen *later*)?

  3.  **Brainstorming Implications/Arguments:**

      *   *Implication 1: Historical Necessity vs. Ontological Value.* In the *Guide*, Maimonides argues that a sudden abolition of sacrifice would have been psychologically impossible (like a prophet claiming God no longer wants prayer). It was a "divine ruse" (*takhlit*). But does "historical necessity" imply "temporary duration"? Not necessarily. It explains the *origin*, not necessarily the *end*. However, the language of "wisdom of God... not to contradict human nature" suggests a trajectory.
      *   *Implication 2: The Nature of Immutability.* Principle 9 says the Torah won't be *added to* or *subtracted from*. It doesn't explicitly say every ritual must remain the *primary* mode of worship forever, but *Mishneh Torah* implies the Temple service returns. If the *Guide* says the *ideal* is prayer, but the *Law* says sacrifice, is the Law accommodating human weakness permanently?
      *   *Implication 3: Esotericism (The "Two Truths" approach).* Many scholars (Strauss, Ravitzky, etc.) argue the *Guide* is the "true" view for the elite, while *Mishneh Torah* is the "exoteric" view for the masses. If so, the tension is intentional. The masses need to believe sacrifices are eternal; the philosophers know they are a concession. *Critique:* This might be too radical for a dissertation unless the user is taking a Straussian line. Need to balance it.
      *   *Implication 4: The Messianic Era isn't a Change in Nature.* Maimonides (Principle 12, *Mishneh Torah* Hil. Melachim) says the world order doesn't change in the Messianic era. Human nature remains. If human nature still craves tangible ritual (as per *Guide* III:32), then sacrifices must remain *because human nature hasn't perfected itself*, not because God desires blood. This reconciles the two: Sacrifices remain due to anthropological constancy, not divine preference.
      *   *Implication 5: Teleology vs. Legality.* The *Guide* gives the *reason* (teleology), the *Mishneh Torah* gives the *rule* (deontology). Maimonides might be saying: "We do this *because* of history, and we will continue to do this *because* the Law is binding, even if the ultimate spiritual ideal is higher." The obligation remains even if the *raison d'être* is historical.

