answer: |-
  This is one of the classic "rite of passage" confusions for anyone diving deep into decision theory. You have hit on exactly why the LessWrong rationalist community eventually moved past both standard Evidential Decision Theory (EDT) and Causal Decision Theory (CDT) toward **Timeless Decision Theory (TDT)** and **Functional Decision Theory (FDT)**.

  Here is the breakdown of the relationship between the two problems, how the classic theories handle them, and the principled way to distinguish them so you don't have to choose between being rich (Newcomb) and being healthy/happy (Smoking Lesion).

  ### 1. The Setup: Side-by-Side

  To see the difference, we need to look at the **causal structure** of each problem.

  **Newcomb's Problem**
  *   **The Setup:** Omega predicts your choice. If it predicts One-Box, it puts \$1M in Box B. If it predicts Two-Box, Box B is empty.
  *   **The Correlation:** Your Choice $\leftrightarrow$ Omega's Prediction $\leftrightarrow$ Box Content.
  *   **The Intuition:** Your choice doesn't *causally* change the past box content, but it is *logically* correlated with it because Omega simulated your decision process.

  **The Smoking Lesion Problem**
  *   **The Setup:** A genetic lesion causes both (A) a high likelihood of lung cancer and (B) a strong desire to smoke. Smoking itself does *not* cause cancer. You enjoy smoking (+utility).
  *   **The Correlation:** Lesion $\rightarrow$ Cancer. Lesion $\rightarrow$ Desire $\rightarrow$ Smoking.
  *   **The Intuition:** Smoking is *evidence* you have the lesion (and thus cancer), but smoking does not *cause* the cancer. The common cause is the lesion.

  ### 2. The Scorecard: Who Wins Where?

  This is where the confusion arises. EDT and CDT trade victories.

  | Theory | Newcomb's Problem | Smoking Lesion | Verdict |
  | :--- | :--- | :--- | :--- |
  | **CDT** (Causal) | **Two-Box.** <br>*(My choice can't causally affect the past box. Dominance argument.)* | **Smoke.** <br>*(Smoking doesn't cause cancer. I get the utility of smoking.)* | Gets \$1,000. <br>Gets Cancer + Smoking Utility. |
  | **EDT** (Evidential) | **One-Box.** <br>*(One-boxing is strong evidence \$1M is there.)* | **Don't Smoke.** <br>*(Smoking is strong evidence I have the lesion/cancer.)* | Gets \$1,000,000. <br>Avoids Cancer, misses Smoking Utility. |

  **The Problem:**
  *   If you are a pure **CDT** agent, you are consistent, but you leave \$999,000 on the table in Newcomb's.
  *   If you are a pure **EDT** agent, you are consistent, but you act "superstitiously" in the Smoking Lesion case. You refrain from a harmless pleasure (smoking) merely to avoid the *news* that you might have cancer, even though your action cannot change whether you have cancer.

  ### 3. Does One-Boxing Commit You to Not Smoking?

  **If you use pure EDT: Yes.**
  EDT says you should maximize expected utility conditional on your action: $P(\text{Outcome} | \text{Action})$.
  *   In Newcomb: $P(\$1M | \text{One-Box})$ is high.
  *   In Lesion: $P(\text{Cancer} | \text{Smoke})$ is high.
  *   Therefore, a consistent EDT agent One-Boxes AND Refrains from Smoking. Most people find the Smoking Lesion conclusion absurd (it's "managing the news" rather than managing the world).

  **If you use pure CDT: No.**
  CDT says you should maximize utility based on causal consequences.
  *   In Newcomb: Choice doesn't cause Money. Two-Box.
  *   In Lesion: Choice doesn't cause Cancer. Smoke.
  *   Therefore, a consistent CDT agent Two-Boxes AND Smokes. Most people find the Newcomb conclusion absurd (why leave the million?).

  **If you use FDT (Functional Decision Theory): No.**
  This is the LessWrong consensus solution. FDT distinguishes between **logical dependence** and **causal/statistical dependence**.

  ### 4. The Principled Line: Logical vs. Causal Dependence

  The reason you feel confused is that on the surface, both problems look like "Correlation without Causation." However, the *source* of the correlation is different.

  **In Newcomb's Problem (Logical Dependence):**
  Omega is predicting you by running a simulation of your decision algorithm.
  *   Your Decision Algorithm and Omega's Prediction Algorithm are **logically subjunctively dependent**.
  *   If you decide "I will One-Box," then any logical simulation of you must also output "One-Box."
  *   Therefore, your decision *logically determines* the content of the box, even if it doesn't causally reach back in time.
  *   **FDT Verdict:** One-Box.

  **In the Smoking Lesion (Causal/Common Cause):**
  The lesion is a physical state in your brain/body.
  *   Your Decision Algorithm and the Lesion are **not** logically dependent.
  *   The lesion might influence your *preferences* (making you want to smoke), but it does not run the same algorithm as your decision procedure.
  *   Crucially: **Your decision to smoke does not logically force the lesion to exist.** The lesion exists (or doesn't) independently of your current calculation.
  *   When you calculate "If I smoke...", FDT asks: "Does the output of my algorithm change the state of the lesion?" The answer is No.
  *   **FDT Verdict:** Smoke. (Because you get the utility of smoking, and your choice doesn't change the cancer risk).

  ### 5. Why EDT Fails the Smoking Lesion (The "Tickling Defense")

  EDT fails the Smoking Lesion because it treats your action as a random sample from the population. It says, "People who smoke usually have the lesion."

  But you are not a random person. You are an agent making a decision *now*.
  There is a famous counter-argument called the **Tickling Defense**.
  *   If you know the theory, you know that the lesion causes an *urge* to smoke.
  *   If you feel the urge, you already have the evidence of the lesion.
  *   Deciding to smoke *on top of the urge* adds no new evidence about the lesion.
  *   Therefore, a sophisticated EDT agent should actually smoke, because the action itself provides no *new* evidence beyond the urge they already feel.

  However, this requires EDT to get messy and ad-hoc. FDT handles it cleanly by looking at the algorithm rather than the physical action.

  ### Summary: How to Draw the Line

  You do not need to commit to the "irrational" Smoking Lesion behavior just because you One-Box. Here is the principled distinction used by modern decision theorists (like Yudkowsky and Soares):

  1.  **Is the correlation due to a logical link between my algorithm and the outcome?**
      *   **Yes (Newcomb):** Omega simulates my algorithm. My output logically determines the simulation's output. **Action: One-Box.**
      *   **No (Smoking Lesion):** The lesion is a physical cause. My algorithm's output does not logically determine the presence of the lesion. **Action: Smoke.**

  2.  **Is the correlation due to a common physical cause?**
      *   **Yes (Smoking Lesion):** The lesion causes both the cancer and the urge. My choice is downstream of the lesion. I cannot change the lesion by choosing. **Action: Smoke.**
      *   **No (Newcomb):** There is no common physical cause. There is a logical identity between the predictor and the agent. **Action: One-Box.**

  **The Takeaway:**
  One-boxing in Newcomb's relies on **logical counterfactuals** (if my algorithm outputs X, Omega's simulation outputs X).
  Refraining from smoking in the Lesion case relies on **evidential conditioning** (if I observe myself smoking, I likely have the lesion).

  The rationalist consensus is that **logical counterfactuals are real decision-relevant facts**, whereas **mere evidential correlation (without logical or causal link) is not.**

  So, you can confidently One-Box in Newcomb's and still Smoke in the Lesion case, provided you adopt a decision theory (like FDT) that respects the difference between a **prediction of your logic** and a **physical common cause**.
