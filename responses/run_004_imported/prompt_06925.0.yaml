      *   *Audience:* Addressed both groups.
      *   *Closing:* Needs to be strong. "To the sense and reference of their life"? No, too cheesy. "To the identity of love"? No. How about "To the discovery"?
      *   *Revision on Closing:* Let's focus on the *future*. Marriage is continuing to find new "senses" for the same "reference."

