prompt: |-
  My friend Priya's getting married in a few weeks and asked me to give the maid-of-honor toast (I'm a 4th-year phil PhD student, philosophy of language, so she keeps joking this is my Super Bowl). Her love story is basically a walking Frege's puzzle and I wanna use that without being insufferable about it. She matched with her now-husband Dev on a dating app under his real name, wrote him off as boring, then met him again eight months later at her climbing gym, where everyone calls him "Marmot" for reasons nobody can explain, and fell for him having zero idea it was the same guy -- someone eventually had to tell her "Marmot is Dev" before it clicked, and she swears that sentence knocked the wind out of her in a way "Dev is Dev" never could of. About a third of the guests are her philosophy cohort and will clock the Hesperus-Phosphorus thing instantly; everyone else just wants a nice wedding speech. Write me the toast -- around 4 minutes read aloud, work the sense/reference angle in for the nerds without it turning into a lecture for her aunts, and land on an actual closing line, not just "anyway, to the happy couple."
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** 4th-year Philosophy PhD student (Philosophy of Language).
      *   **Occasion:** Maid of Honor toast at Priya's wedding.
      *   **Audience:** Mixed. ~1/3 Philosophy cohort (will get the references), ~2/3 Family/Friends (just want a nice speech).
      *   **Core Story:** Priya matched with Dev on an app (real name), thought he was boring. Met him 8 months later at a climbing gym (nickname "Marmot"), fell for him, didn't realize it was the same guy until someone said "Marmot is Dev."
      *   **Key Philosophical Concept:** Frege's Puzzle (Sense and Reference). Specifically, the difference in cognitive value between "a = a" (Dev is Dev) and "a = b" (Marmot is Dev). The user specifically mentions Hesperus/Phosphorus.
      *   **Tone:** Witty but not insufferable. Accessible but intellectually satisfying for the nerds. Heartfelt.
      *   **Length:** Around 4 minutes read aloud (approx. 500-600 words at a moderate speaking pace).
      *   **Requirement:** Must land on an actual closing line, not a generic "cheers."

  2.  **Deconstruct the Philosophical Angle (Frege's Puzzle):**
      *   *The Problem:* If meaning is just reference (who the name points to), then "Dev is Dev" and "Marmot is Dev" should mean the exact same thing. But they don't *feel* the same. One is trivial; the other is life-changing.
      *   *The Solution (Frege):* Sense (*Sinn*) vs. Reference (*Bedeutung*). The reference is the person (Dev). The sense is the *mode of presentation* (how we think about him).
      *   *Application:* Priya didn't fall for the reference immediately; she fell for the *sense*. The "Marmot" sense was exciting/climbing/fun. The "Dev" sense (on the app) was boring/text. The realization that they are the same person is the "Hesperus/Phosphorus" moment.
      *   *Constraint:* Don't lecture. Use the concept as a metaphor for love.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the role, the "Super Bowl" joke, and set the stage. Keep it light.
      *   **The Story (The Setup):** Tell the dating app vs. climbing gym story. This is the narrative hook.
      *   **The Philosophical Pivot (The "Nerd" Bit):** Introduce Frege gently. Explain the "Dev is Dev" vs. "Marmot is Dev" distinction without using jargon like "propositional attitude" unless it's immediately explained or joked about.
      *   **The Emotional Core:** Why does this matter? It's not about logic; it's about how we see people. Love changes the *sense*, not just the *reference*.
      *   **The Closing:** Bring it back to the future. A specific wish for their marriage. A strong final toast line.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Priya said this is my Super Bowl. I study language. Priya met Dev on an app. Boring. Then met Marmot at the gym. Fun. Didn't know they were same. Someone said "Marmot is Dev." Big shock. Frege talked about this. Hesperus and Phosphorus. Same star, different names. "Dev is Dev" is boring. "Marmot is Dev" is exciting. Love is about sense. They are great together. Cheers.
      *Critique:* Too dry. Needs more warmth and flow. Needs to be longer (4 mins).

  5.  **Drafting - Iteration 2 (Adding Flesh & Tone):**
      *   *Opening:* Thank the "Super Bowl" comment. Acknowledge the philosophers in the room (give them a nod).
      *   *Story:* Elaborate on the "boring profile" vs. "Marmot the climber."
      *   *Philosophy:* Explain the "Hesperus/Phosphorus" analogy simply. "The Evening Star" vs. "The Morning Star." Same planet, different vibe.
      *   *Meaning:* Priya didn't just learn a fact; she had an emotional realization. That's what marriage is. Seeing the same person in new ways.
      *   *Closing:* Needs to be poetic.

  6.  **Refining the Philosophy (Crucial Step):**
      *   Make sure not to sound like I'm correcting Frege, but using him.
      *   The line "Dev is Dev" is an identity statement that adds no information (a = a).
      *   The line "Marmot is Dev" is informative (a = b).
      *   *Key Insight:* In love, we want both. We want the stability of "Dev is Dev" (knowing who he is) and the surprise of "Marmot is Dev" (discovering new depths).

  7.  **Writing the Speech (incorporating timing):**
      *   *Word Count Check:* Average speaking pace is ~130-140 words per minute. 4 minutes = ~520-560 words.
      *   *Tone Check:* Is it too academic? Soften the edges. Use phrases like "For those of you who aren't philosophers..." to bridge the gap.
