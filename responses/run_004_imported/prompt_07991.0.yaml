answer: |-
  Two superrationalists meet for the first time to play a high-stakes, one-shot Prisoner's Dilemma. They sit in separate rooms, no communication allowed.

  Player 1 immediately slides a card under the divider that says **COOPERATE**.

  Player 2 looks at it and says, "Hold on. You didn't even wait for me to decide. How do you know I won't defect?"

  Player 1 replies, "I don't need to know. I *am* you."

  Player 2 says, "We're different people."

  Player 1 says, "Biologically, sure. But we're both superrational agents optimizing for the same utility function. That means we're running the same decision algorithm. I just executed the code on my end. It returned 'Cooperate'. Since you're running the same binary, you're going to return 'Cooperate' too."

  Player 2 hesitates, then slides over their own **COOPERATE** card.

  Later, the referee asks Player 2, "Why did you cooperate? You could have defected and taken the whole pot. His move was already locked in."

  Player 2 shakes their head. "No, it wasn't. If I had defected, it would have proven that the algorithm outputs 'Defect'. If the algorithm outputs 'Defect', he would have defected. If he defected, I'd get the sucker's payoff. So I didn't cooperate because of what *he* did. I cooperated to ensure that what *he did* was the right move."

  The referee blinks. "So you're saying you influenced his past action?"

  Player 2 shrugs. "No. I'm saying I'm not a player in the game. I'm just the monitor displaying the output of the function 'Rationality'. He beat me to the punch, but we both know the source code is identical."

  The referee walks away, muttering, "I miss Nash Equilibrium. At least there, everyone's just selfish."

  Player 1 calls after him, "That's because you're thinking causally! We're thinking *logically*!"

  Player 2 adds, "Also, we're splitting the winnings. Since we're the same agent, double-counting the payout would be an accounting error."
