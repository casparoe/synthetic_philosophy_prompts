  ### TA-to-TA Note
  You mentioned you were flip-flopping on this one. I think the reason is that the student has **excellent intuition** (the "story" is right) but **sloppy formalism** (the "math" has specific errors). In a cross-listed stats seminar, the math errors (Convex vs. Concave, Partial vs. Total Order) are objective deductions, but the conceptual handling of the counterexample is A-worthy.

  If the student comes to office hours, the "Concave vs. Convex" point is the easiest to defend objectively. If $f$ is concave, $E[f(x)] \le f(E[x])$. They claimed $f$ is concave *and* $E[f(x)] \ge f(E[x])$. That is a self-contradiction regardless of the context. The Blackwell point is the second strongest objective deduction. If you want to be generous, you could give back the 0.5 on the Assumptions (since they *did* state it later), bringing them to 11.5/15, but I would hold firm on the Proof and Blackwell points.
