  This plays on the status of Black as a *counterfactual intervener* whose presence eliminates alternative possibilities without entering the *actual sequence* of events, thereby isolating responsibility from the ability to do otherwise. The humor hinges on the absurdity of holding Jones accountable precisely because the mechanism ensuring his compliance remained dormant.
