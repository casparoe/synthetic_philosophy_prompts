prompt: |-
  I'm taking a seminar this term devoted to Hume's moral philosophy, and for the last couple of weeks we've been working through Book 3, Part 2 of the Treatise, on justice, property, and promising. I feel like I have a decent grip on the "headline" view: that fidelity to promises, like justice more generally, is an artificial rather than a natural virtue, ultimately grounded in convention and the interests it serves rather than in some free-standing moral fact about promising itself. What I'm still struggling with is the more granular argument Hume gives, in Section 5 ("Of the Obligation of Promises"), for why a promise couldn't possibly be a natural act of the will in the first place — especially the compressed version of that argument that he tucks into a footnote. I raised this in office hours, but we ran out of time right after getting to the conclusion, without really working through how each step is supposed to follow from the last.

  Here are the two paragraphs in question, together with the footnote Hume attaches to the end of the second one:

  "The act of the mind, exprest by a promise, is not a resolution to perform any thing: For that alone never imposes any obligation. Nor is it a desire of such a performance: For we may bind ourselves without such a desire, or even with an aversion, declar'd and avow'd. Neither is it the willing of that action, which we promise to perform: For a promise always regards some future time, and the will has an influence only on present actions. It follows, therefore, that since the act of the mind, which enters into a promise, and produces its obligation, is neither the resolving, desiring, nor willing any particular performance, it must necessarily be the willing of that obligation, which arises from the promise. Nor is this only a conclusion of philosophy; but is entirely conformable to our common ways of thinking and of expressing ourselves, when we say that we are bound by our own consent, and that the obligation arises from our mere will and pleasure. The only question, then, is, whether there be not a manifest absurdity in supposing this act of the mind, and such an absurdity as no man cou'd fall into, whose ideas are not confounded by prejudice and the fallacious use of language.

  All morality depends upon our sentiments; and when any action, or quality of the mind, pleases us after a certain manner, we say it is virtuous; and when the neglect, or non-performance of it, displeases us after a like manner, we say that we lie under an obligation to perform it. A change of the obligation supposes a change of the sentiment; and a creation of a new obligation supposes some new sentiment to arise. But 'tis certain we can naturally no more change our own sentiments, than the motions of the heavens; nor by a single act of our will, that is, by a promise, render any action agreeable or disagreeable, moral or immoral; which, without that act, wou'd have produc'd contrary impressions, or have been endow'd with different qualities. It wou'd be absurd, therefore, to will any new obligation, that is, any new sentiment of pain or pleasure; nor is it possible, that men cou'd naturally fall into so gross an absurdity. A promise, therefore, is naturally something altogether unintelligible, nor is there any act of the mind belonging to it."

  Footnote: "Were morality discoverable by reason, and not by sentiment, 'twou'd be still more evident, that promises cou'd make no alteration upon it. Morality is suppos'd to consist in relation. Every new imposition of morality, therefore, must arise from some new relation of objects; and consequently the will cou'd not produce immediately any change in morals, but cou'd have that effect only by producing a change upon the objects. But as the moral obligation of a promise is the pure effect of the will, without the least change in any part of the universe; it follows, that promises have no natural obligation. Shou'd it be said, that this act of the will being in effect a new object, produces new relations and new duties; I wou'd answer, that this is a pure sophism, which may be detected by a very moderate share of accuracy and exactness. To will a new obligation, is to will a new relation of objects; and therefore, if this new relation of objects were form'd by the volition itself, we shou'd in effect will the volition; which is plainly absurd and impossible. The will has here no object to which it cou'd tend; but must return upon itself in infinitum. The new obligation depends upon new relations. The new relations depend upon a new volition. The new volition has for object a new obligation, and consequently new relations, and consequently a new volition; which volition again has in view a new obligation, relation and volition, without any termination. 'Tis impossible, therefore, we cou'd ever will a new obligation; and consequently 'tis impossible the will cou'd ever accompany a promise, or produce a new obligation of morality."

  Could you help me reconstruct this reasoning in a way I can actually follow, rather than just restating the conclusion? First, I'd like a clean, step-by-step version of the elimination argument in the first paragraph: why exactly does Hume think the mental act "belonging to" a promise cannot be a resolution, a desire, or an act of willing the promised action itself, so that only "the willing of that obligation" is left standing? Second, I'd like the same treatment for the regress in the footnote — I can see that Hume wants to trap a rationalist about morality (presumably someone in the mold of Samuel Clarke or Wollaston, given what he argues against them earlier in Book 3, Part 1) into willing an endless series of new volitions, but I lose the thread of exactly which premise forces the move from "willing a new relation of objects" to "willing the volition that would create that relation," and then keeps the regress going rather than letting it stop after one step; concretely, why can't the rationalist just say that what is willed is the future action that will instantiate the new relation, rather than the present volition itself? Third, an evaluative question: does the regress depend on an assumption a rationalist could reasonably reject, and if so, is this footnote argument actually weaker than the sentiment-based argument in the main text, or is it doing independent philosophical work rather than just restating that argument in the rationalist's own vocabulary?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is a student in a seminar on Hume's *Treatise* (Book 3, Part 2, Section 5). They understand the "headline" view (justice/promising is artificial) but struggle with the specific argument against promises being *natural* acts of the will.
      *   **Specific Text:** Two paragraphs from T 3.2.5 plus a crucial footnote.
      *   **Task 1:** Reconstruct the elimination argument in the first paragraph (why not resolution, desire, or willing the action?).
      *   **Task 2:** Reconstruct the regress argument in the footnote (why does willing a new obligation lead to an infinite regress for a rationalist?).
      *   **Task 3:** Evaluate the footnote argument (does it rely on a rejectable assumption? Is it weaker or independent compared to the sentiment argument?).
      *   **Tone:** Academic, clear, step-by-step, helpful for a student who has already done some work but hit a wall in office hours.

  2.  **Deconstruct Task 1: The Elimination Argument (Main Text):**
      *   *Goal:* Show that the mental act constituting a promise cannot be natural (resolution, desire, willing the action), so it must be "willing the obligation."
      *   *Premise 1 (Resolution):* A resolution alone doesn't create obligation. I can resolve to do X tomorrow and change my mind without moral blame *unless* I promised. Therefore, promising $\neq$ resolving.
      *   *Premise 2 (Desire):* We can promise things we don't desire (or even avow we dislike). Obligation persists despite lack of desire. Therefore, promising $\neq$ desiring.
      *   *Premise 3 (Willing the Action):* The will only influences *present* actions. A promise is about a *future* action. I cannot literally will a future action now (I can only will to do it when the time comes). Therefore, promising $\neq$ willing the future action directly.
      *   *Conclusion:* Since it's not resolution, desire, or willing the action, but promises *do* create obligation via consent/will, the mental act must be "willing the obligation itself."
      *   *The Trap:* Hume sets this up to knock it down in the next paragraph. He grants this conclusion *arguendo* to show it's absurd.

  3.  **Deconstruct Task 2: The Regress Argument (Footnote):**
      *   *Target:* Moral Rationalists (Clarke, Wollaston). They think morality is based on relations/reason, not sentiment.
      *   *Premise 1 (Rationalist View):* Morality consists in relations between objects.
      *   *Premise 2 (Change in Morality):* To create a new obligation (morality), you must create a new relation.
      *   *Premise 3 (Will's Power):* The will cannot change relations directly; it can only change objects (or be an object itself).
      *   *The Claim:* A promise creates obligation *purely* by the will, without changing external objects.
      *   *The Move:* If the will creates the obligation, and obligation = relation, the will must create the relation.
      *   *The Regress:*
          1.  To will a new obligation is to will a new relation.
          2.  This new relation is created by a volition (V1).
          3.  But V1 is itself an act of will. For V1 to create the relation, V1 must have an object.
          4.  What is the object of V1? It is the "new obligation" (which is the new relation).
          5.  So V1 aims at the relation created by V1.
          6.  Hume claims this means we "will the volition."
          7.  Why regress? If V1 creates the obligation by being willed, then to will the obligation is to will V1. But to will V1 requires a prior volition (V0)? Or rather, the object of the will must exist prior to the will?
          *Correction/Refinement:* Let's look closer at the text: "To will a new obligation, is to will a new relation of objects; and therefore, if this new relation of objects were form'd by the volition itself, we shou'd in effect will the volition... The new obligation depends upon new relations. The new relations depend upon a new volition. The new volition has for object a new obligation..."
          *Interpretation:* The rationalist says the *volition itself* creates the relation. But the *object* of that volition must be the obligation (since that's what we are trying to create). So the volition takes *itself* (or its own moral product) as its object. But the moral product depends on the volition existing. So the volition depends on the volition.
          *Simpler Regress:* To will X, X must be intelligible. If X (obligation) is created *by* the willing, then X doesn't exist *for* the will to target until the willing happens. But the willing needs X to target. So you need a prior willing to create X for the current willing to target... ad infinitum.
          *Addressing the User's specific confusion:* "Why can't the rationalist just say that what is willed is the future action?"
          *Hume's Counter:* Because the *obligation* is what's being created, not just the action. The rationalist claims the *promise* creates the duty. If the duty is a relation, and the will creates the duty, the will creates the relation. But the will needs an object. If the object is the action, that doesn't create the *relation* of duty yet. If the object is the *duty*, the duty doesn't exist yet.

  4.  **Deconstruct Task 3: Evaluation:**
      *   *Assumption:* The regress relies on the Rationalist definition of morality as "relations." Hume rejects this in T 3.1.1.
      *   *Is it weaker?* Yes, because it's an *ad hominem* (in the philosophical sense) against rationalists. It shows *even if* you were a rationalist, promises wouldn't work. But since Hume thinks rationalism is false anyway, the sentiment argument is his "real" argument.
      *   *Independent work?* It strengthens the overall case by showing the view fails on *any* metaethical framework (Sentimentalist or Rationalist). It closes off an escape route for opponents.

  5.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the difficulty. This is notoriously dense Hume.
      *   *Section 1 (Elimination Argument):* Break it down into the three eliminated candidates + the forced conclusion. Use clear headers. Explain *why* each fails (Resolution = no obligation; Desire = contingent; Will = present only).
      *   *Section 2 (The Regress):* This is the hardest part. Need to be precise about "Relations."
          *   Step 1: Rationalist premise (Morality = Relations).
          *   Step 2: Promise claim (Will creates Obligation).
          *   Step 3: The Conflict (Will needs an object; Relation is the object).
          *   Step 4: The Loop (Relation depends on Volition; Volition depends on Relation).
          *   *Addressing the User's Objection:* Explain why "willing the future action" doesn't solve it. Willing an action doesn't create a *moral relation* instantly. The specific *obligation* is the target.
      *   *Section 3 (Evaluation):* Discuss the *ad hominem* nature. It's a "even if" argument. It's weaker as a standalone Humean argument but strong as a dialectical move. It shows the incoherence of "natural promising" regardless of metaethics.
      *   *Conclusion:* Tie it back to the "Artificial Virtue" conclusion.

  6.  **Refining the Regress Explanation (Self-Correction during drafting):**
      *   I need to be careful not to make the regress sound like a temporal infinite series (V1 causes V2 causes V3). It's more conceptual. The *definition* of the object of the will presupposes the existence of the will's product.
      *   Text: "The new volition has for object a new obligation... which volition again has in view a new obligation... without any termination."
      *   Explanation: To will the obligation, the obligation must be the object. But the obligation is *constituted* by the willing. So the willing presupposes the obligation it is trying to create. It's circular, which Hume frames as a regress (you need a prior volition to establish the object for the current volition).
      *   *User's specific question:* "Why can't the rationalist just say that what is willed is the future action?"
      *   *Answer:* Because willing a future action is just a resolution (which Hume already ruled out in para 1). It doesn't create the *moral tie*. The rationalist needs the will to create the *moral tie* (relation). That's the specific target.

  7.  **Final Polish:** Check tone. Ensure it sounds like a tutor helping a grad/advanced undergrad student. Use formatting (bolding, lists) to make the steps distinct. (Proceed to generate output based on this structure).

  8.  **Final Review against constraints:**
      *   Step-by-step elimination argument? Yes.
      *   Step-by-step regress argument? Yes.
      *   Address the "future action" objection? Yes.
      *   Evaluative question on rationalist assumption? Yes.
      *   No restating conclusion only? Yes.

      *Ready to write.*
answer: |-
  This is one of the most technically dense passages in the *Treatise*, and your confusion is well-founded. Hume is compressing a metaethical critique into a few paragraphs. To understand why promising cannot be a "natural" act of the will, we have to see how he boxes the concept in from two sides: first by eliminating standard psychological candidates (Paragraph 1), and second by showing that the only remaining candidate creates a logical impossibility for his rationalist opponents (Footnote).

  Here is a reconstruction of the reasoning, step-by-step, followed by an evaluation of the footnote's dialectical strength.

  ---

  ### 1. The Elimination Argument (Main Text, Paragraph 1)

  Hume's goal here is to isolate exactly what mental act could possibly constitute a promise. He assumes, for the sake of argument, that if promising were natural, it would have to be a specific, identifiable operation of the mind (a "mental act"). He then tests the three most obvious candidates and eliminates them.

  **Step 1: Is it a Resolution?**
  *   **Candidate:** When I promise, I resolve to do $X$.
  *   **Hume's Objection:** A resolution alone imposes no moral obligation. I can resolve to wake up at 5:00 AM tomorrow and fail to do so without being immoral. A promise, by definition, *does* impose an obligation.
  *   **Result:** Since a resolution lacks the essential feature of a promise (obligation), promising $\neq$ resolving.

  **Step 2: Is it a Desire?**
  *   **Candidate:** When I promise, I desire to do $X$.
  *   **Hume's Objection:** We often promise things we do not desire to do (e.g., repaying a loan to a creditor we dislike). We can even explicitly avow our aversion while promising ("I hate paying this, but I promise I will"). The obligation remains even if the desire vanishes.
  *   **Result:** Since obligation persists without desire, promising $\neq$ desiring.

  **Step 3: Is it Willing the Action?**
  *   **Candidate:** When I promise, I will the performance of $X$.
  *   **Hume's Objection:** This relies on Hume's philosophy of action. The will is a causal power that influences actions *in the present*. I cannot literally "will" a future action now; I can only will the action when the time for performance arrives. A promise regards a *future* time. Therefore, I cannot directly will the object of the promise at the moment of promising.
  *   **Result:** Since the will only acts on the present, and promises regard the future, promising $\neq$ willing the action.

  **Step 4: The Forced Conclusion**
  *   **Deduction:** If the mental act of promising is not resolving, desiring, or willing the *action*, but we still insist it is an act of will that creates obligation, there is only one option left.
  *   **Conclusion:** The mental act must be **"the willing of that obligation."** In other words, to promise is to will that I be under a moral duty to perform the action.
  *   **The Trap:** Hume accepts this conclusion *arguendo* ("It follows, therefore...") only to demonstrate in the next paragraph (and the footnote) that this specific mental act is metaphysically impossible.

  ---

  ### 2. The Regress Argument (Footnote)

  This is the trickiest part. Hume is addressing a **Moral Rationalist** (like Samuel Clarke). The Rationalist believes morality is discovered by reason and consists in **relations** between objects (e.g., fitness, suitability).

  Hume wants to show that even if the Rationalist is right about morality, they still cannot explain promising. The regress arises from the conflict between **what the will needs** (an object) and **what the will creates** (the obligation).

  **The Rationalist's Commitments:**
  1.  **Morality = Relations:** Moral obligation is a specific relation between objects/agents.
  2.  **Will = Creator:** In a promise, the will creates this obligation out of nothing (without changing external physical objects).
  3.  **Will = Intentional:** The will must have an object; you cannot will "nothing." You must will *something*.

  **The Regress Step-by-Step:**

  *   **Step 1:** To create a new moral obligation via a promise, the will must create a **new relation** (per Commitment 1).
  *   **Step 2:** To will this new obligation, the new obligation (the relation) must be the **object of the volition** (per Commitment 3).
  *   **Step 3:** However, this new relation does not exist *until* the volition occurs (per Commitment 2). The volition *constitutes* the relation.
  *   **Step 4 (The Loop):** So, for the volition to exist, it must have an object (the relation). But for the object (the relation) to exist, the volition must occur.
  *   **Step 5 (The Regress):** Hume phrases this as: "The new volition has for object a new obligation... which volition again has in view a new obligation... without any termination."
      *   To will $V_1$ (the promise), I must target Obligation $O_1$.
      *   But $O_1$ is created by $V_1$. So $O_1$ doesn't exist yet.
      *   To make $O_1$ exist so I can target it, I need a prior volition $V_0$ to create it.
      *   But $V_0$ also needs an object ($O_0$), which requires $V_{-1}$, and so on *in infinitum*.

  **Addressing Your Specific Objection:**
  > *Why can't the rationalist just say that what is willed is the future action that will instantiate the new relation, rather than the present volition itself?*

  This is the most natural objection, but Hume has already blocked it in the main text (Paragraph 1, Step 3). Here is why it doesn't save the Rationalist in the footnote:

  1.  **Willing the Action $\neq$ Creating the Relation:** If I simply will the future action (e.g., "I will pay you £100"), I am merely forming a resolution or prediction. As established in Paragraph 1, this creates no *moral* tie. The Rationalist needs to explain how the **obligation** arises.
  2.  **The Object Must be the Obligation:** The specific claim of promising is that the *utterance/consent itself* creates the duty. Therefore, the specific object of the will in a promise must be **the duty itself**, not just the physical action.
  3.  **The Circularity Remains:** Even if the Rationalist says, "I will the action, and that creates the relation," Hume asks: *In virtue of what does willing that action create the relation?*
      *   If it's a natural fact that willing $X$ creates Relation $R$, then promising is a natural virtue (which Hume denies and the Rationalist usually agrees is strange).
      *   If it's because I *will the relation*, we are back to the regress. I cannot will a relation into existence if the relation is defined as "that which is created by my willing." The definition is circular. The will is trying to grab hold of a rope that is tied to the will's own hand.

  ---

  ### 3. Evaluation: Is the Footnote Argument Weaker?

  You asked if this regress depends on an assumption a rationalist could reject, and whether it is weaker than the sentiment-based argument.

  **The Vulnerable Assumption:**
  Yes, the regress depends entirely on the Rationalist definition of morality as **"relations of objects."**
  *   **Hume's View:** Morality is based on *sentiments* (pleasure/pain) arising in the observer.
  *   **Rationalist View:** Morality is based on *relations* (fitness/unsuitability) inherent in the objects.

  A Rationalist could reject the regress by denying that "willing a new obligation" requires "willing a new relation." They might argue that the will creates a *normative fact* directly, not a "relation" in the metaphysical sense Hume is attacking. However, given 18th-century rationalism (Clarke/Wollaston), "relations" was the standard vocabulary, so Hume is fighting on their home turf.

  **Is it Weaker?**
  In one sense, **yes**. The sentiment-based argument in the main text is Hume's *positive* view. It says: "We cannot change our sentiments by fiat; therefore we cannot create obligation by fiat." This relies on Hume's own metaethics, which he has argued for extensively in Book 3, Part 1. It is a stronger argument *for Hume* because it follows from his established premises.

  The footnote argument is an **_ad hominem_** (in the philosophical sense: "against the person/position"). It says: "Even if I grant *your* weird metaethics (Rationalism), your theory of promises *still* fails."
  *   **Strength:** It closes off an escape route. It prevents the Rationalist from saying, "Well, Hume, your sentiment theory is wrong, but my Rationalist theory saves promising." Hume replies, "No, it doesn't."
  *   **Weakness:** It relies on the opponent's premises. If you aren't a Rationalist, the regress doesn't bite you as hard (though the main text argument still does).

  **Independent Philosophical Work:**
  Despite being *ad hominem*, it does independent work. It highlights a structural problem with **self-referential normativity**. It points out that you cannot bootstrap a moral duty into existence solely by intending to have that duty.
  *   The Sentiment Argument says: "You can't feel pain/pleasure just by deciding to." (Psychological impossibility).
  *   The Regress Argument says: "You can't define a relation into existence by referencing the act that defines it." (Logical/Conceptual impossibility).

  Together, they form a pincer movement. The first argues that promising is psychologically impossible as a natural act; the second argues that it is conceptually incoherent even under rival metaethical frameworks. This forces the conclusion that promising must be **artificial**: the obligation doesn't come from the mental act itself, but from the **social convention** that attaches a sanction (and thus a sentiment of pain/pleasure) to the breaking of the promise.

  ### Summary for your Seminar
  1.  **Elimination:** Hume clears the deck: Promising isn't resolving, desiring, or willing the action. It must be "willing the obligation."
  2.  **Sentiment Argument (Main Text):** You can't will a sentiment (pain/pleasure) into existence. Therefore, you can't will an obligation (which is just a sentiment) into existence.
  3.  **Regress Argument (Footnote):** Even if morality were relations (Rationalism), you can't will a relation into existence because the will needs the relation to exist *before* it can will it.
  4.  **Conclusion:** Since the will cannot naturally create the obligation, the obligation must come from outside the will—specifically, from human conventions and interests (Artificial Virtue).
