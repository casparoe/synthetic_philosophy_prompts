answer: |-
  You are right, and your friend is defending a position that most philosophers of science abandoned about 50 years ago. You don't need extra premises to get the Tichý/Miller result; it falls out of Popper's own definitions of truth-content and falsity-content purely as a matter of logic.

  Here is the walkthrough of why Popper's definition breaks for false theories, followed by an assessment of whether the modern "distance" accounts actually fix it.

  ### Part 1: Why Popper's Definition Fails (The Worked Example)

  Popper defined verisimilitude ($Vs$) using two conditions. For Theory $A$ to be closer to the truth than Theory $B$:
  1.  **Truth-Content:** $A$ must entail at least as many true statements as $B$ (and ideally more).
  2.  **Falsity-Content:** $A$ must entail no more false statements than $B$ (and ideally fewer).

  In set-theoretic terms: The set of $A$'s true consequences must include $B$'s, AND the set of $A$'s false consequences must be included in $B$'s.

  **The Problem:** Logical entailment doesn't distinguish between "true parts" and "false parts." If a theory is false, its falsity infects everything it entails.

  **The Example:**
  Imagine the actual world is described by two atomic facts: $p$ (it is hot) and $q$ (it is rainy).
  *   **The Truth:** $p \land q$ (It is hot and rainy).

  Now consider two false theories:
  *   **Theory Weak:** $\neg q$ (It is not rainy).
      *   This is false (because $q$ is true).
  *   **Theory Strong:** $p \land \neg q$ (It is hot and not rainy).
      *   This is also false (because $q$ is true).

  Intuitively, **Theory Strong** feels closer to the truth. It got $p$ right! Theory Weak didn't even mention $p$. But let's run them through Popper's definition.

  **1. Compare Truth-Content:**
  *   **Theory Weak** entails true statements like $(p \lor \neg p)$, but it does *not* entail $p$.
  *   **Theory Strong** entails $p$.
  *   So, **Strong** has *more* truth-content than **Weak**. (Condition 1 is satisfied for Strong).

  **2. Compare Falsity-Content:**
  *   **Theory Weak** entails the false statement $\neg q$.
  *   **Theory Strong** entails $\neg q$ (because it asserts it).
  *   **But**, **Theory Strong** *also* entails the false statement $(p \land \neg q)$.
  *   Because **Strong** is logically stronger (it entails **Weak**), it inherits all of **Weak**'s false consequences and adds its own specific falsehoods on top.
  *   So, **Strong** has *more* falsity-content than **Weak**.

  **The Verdict:**
  For **Strong** to be closer to the truth, Popper requires it to have $\le$ falsity-content than **Weak**. But it has $>$. So **Strong** is not closer.
  Can **Weak** be closer? No, because it has less truth-content than **Strong**.

  **Result:** They are **incomparable**.

  **Why the "Drag" Happens:**
  You asked why giving a false theory more content drags both truth and falsity up. It's because of **entailment**.
  If Theory $A$ is false, it entails at least one falsehood $f$.
  If you strengthen $A$ to $A'$ (to capture more truths), $A'$ entails everything $A$ did. Therefore, $A'$ entails $f$.
  You cannot add truth-content to a false theory without *also* carrying along the original falsity-content, plus usually adding new false consequences generated by the new conjunctions. Popper's definition demands you increase truth while *decreasing* (or holding steady) falsity. For false theories, logic makes this impossible.

  Tichý and Miller proved that for **any** two false theories, you cannot satisfy Popper's two conditions simultaneously. One will always have more falsity content if it has more truth content.

  ---

  ### Part 2: Do the "Distance" Fixes Work?

  After 1974, the field shifted from **Content** (entailment) to **Similarity** (possible worlds). This is the approach of Ilkka Niiniluoto, Graham Oddie, and others.

  **The Fix:**
  Instead of counting consequences, we map theories onto a space of possible worlds.
  *   **Truth:** World $W_T$ = $\{p, q\}$
  *   **Theory Strong:** World $W_S$ = $\{p, \neg q\}$ (1 unit away from truth)
  *   **Theory Weak:** World $W_W$ = $\{\neg p, \neg q\}$ (2 units away from truth)

  We define verisimilitude as the inverse of the "distance" from the actual world (often using Hamming distance).
  *   **Strong** is distance 1.
  *   **Weak** is distance 2.
  *   **Result:** **Strong** is closer. The ranking is restored!

  **So, did they escape Tichý/Miller?**
  Formally, **yes**. You can now rank false theories.
  **But**, they bought back comparability at a significant cost. There are three major objections that keep this debate alive:

  #### 1. The Language Dependence Problem (Miller's Second Attack)
  This is the biggest hurdle. The "distance" between theories depends entirely on the atomic predicates you choose to describe the world.
  *   **Scheme A:** Use "Hot" ($h$) and "Rainy" ($r$).
      *   Truth: $h \land r$. Theory: $h \land \neg r$. (Distance = 1).
  *   **Scheme B:** Use "Hot" ($h$) and "Minnesotan" ($m$), where $m$ is defined as $(h \leftrightarrow r)$.
      *   Truth: $h \land m$ (Since $h$ and $r$ are true, $h \leftrightarrow r$ is true).
      *   Theory ($h \land \neg r$): In this language, $\neg r$ means $\neg (h \leftrightarrow m)$. Since $h$ is true, this implies $\neg m$.
      *   So the Theory becomes: $h \land \neg m$.
      *   Wait, let's look at the "Weak" theory ($\neg h \land \neg r$). In Scheme B, this becomes $\neg h \land m$.
      *   Depending on how you define the primitives, the *distances change*. A theory that looks close in one linguistic framework can look far away in an logically equivalent framework.
      *   **Cost:** Verisimilitude becomes relative to our language, not an objective relation to the world.

  #### 2. The Access Problem (The "Target" Issue)
  To calculate the distance from the truth, **you need to know where the truth is.**
  *   If we knew the truth ($p \land q$), we wouldn't need a theory of verisimilitude to tell us which false theory is better; we'd just pick the true one.
  *   Distance accounts work beautifully as a *retrospective* measure (once the truth is revealed), but they are useless as a *guide for inquiry*. They don't help scientists choose between theories in real-time, because the "distance" is epistemically inaccessible.

  #### 3. The Weighting Problem
  Distance accounts usually treat all atomic errors as equal (Hamming distance).
  *   Error 1: Getting the temperature wrong by 1 degree.
  *   Error 2: Getting the state of matter wrong (solid vs. gas).
  *   Mathematically, these might both be "1 bit" of distance. But scientifically, Error 2 is catastrophic and Error 1 is negligible.
  *   **Cost:** To fix this, you need to introduce weights. But who decides the weights? This reintroduces pragmatic/subjective elements into what was supposed to be a logical measure of truth.

  ### Summary for Your Friend
  1.  **Popper's Definition:** It is mathematically impossible to rank two false theories using Popper's content definitions. If Theory $A$ has more truth-content than false Theory $B$, it logically entails $B$'s falsehoods plus its own, violating the falsity-content condition. This requires no extra premises; it's a theorem of the definition.
  2.  **Modern Fixes:** Niiniluoto and Oddie escape the logical impossibility by switching to "distance in possible worlds."
  3.  **The Catch:** This solves the ranking problem but makes verisimilitude **language-dependent** (Miller's objection) and **epistemically inaccessible** (you need to know the truth to measure the distance).

  You won the bet on the logic; the modern crowd won the bet on utility, but only by accepting that "truthlikeness" is partly a matter of how we choose to describe the world, not just how the world is.
