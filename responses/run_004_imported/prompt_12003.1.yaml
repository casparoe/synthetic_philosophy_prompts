      *   How does an agent know *what matters* in a given context without checking everything?
      *   R1 missed the bomb (failed to infer side effects).
      *   R1D1 inferred everything (including wall color), drowning in irrelevance.
      *   R2D1 tried to filter relevance before acting and froze (infinite regress of relevance checking).
