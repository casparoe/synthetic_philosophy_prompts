  4.  **Evaluate Modern AI against the Core Issue:**
      *   *Do LLMs/Neural Nets have explicit frame axioms?* No.
      *   *Do they struggle with relevance/context?* Yes, absolutely.
      *   *Examples:*
          *   Hallucinations/Irrelevant generation (R1D1 style).
          *   Lack of causal understanding (R1 style - pulling the wagon without seeing the bomb).
          *   Context window limits/Attention mechanisms (trying to decide what to pay attention to).
