  *(Self-Correction during drafting)*: I should make sure to mention that some researchers *do* claim the FP is dissolved. I need to represent that view fairly before explaining why Dennett would disagree. The "dissolution" argument is that relevance is emergent. The counter is that emergence doesn't explain *how* it's bounded in novel cases.

