      *   *Correction:* Make sure the follow-up is distinct from the main question.

      *(Self-Correction on Bohm)*: The prompt specifically says "why we should want her many, local, branching worlds over a single nonlocal trajectory." I need to make sure I frame Bohm correctly (it *is* non-local, MWI is local in configuration space). Wait, Bohm is explicitly non-local. MWI is local in the wavefunction evolution. I need to be careful with the "local" descriptor in the prompt. The prompt says "her many, local, branching worlds." MWI is local in terms of dynamics (Schrödinger eq is local in config space), but the *experience* is non-local? No, stick to the prompt's framing: MWI = local branching, Bohm = nonlocal trajectory.
