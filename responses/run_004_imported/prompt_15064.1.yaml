      *   *Guest:* Academic philosopher of physics. Likely familiar with David Wallace, Sean Carroll, David Deutsch. Will have standard responses to common objections but should be pressed on the nuances.
      *   *Constraint:* "Six genuinely hard questions beat ten soft ones." (User asked for 8-10, but emphasized quality over quantity. I will aim for 8 high-quality ones to satisfy the count without dilution).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Topic 1: The Born Rule (Required).*
          *   *Idea:* Deutsch-Wallace theorem relies on decision theory. Is it circular?
          *   *Draft:* Can you really derive probabilities from deterministic wavefunctions?
          *   *Refinement:* Focus on the "measure problem." If all outcomes happen, why weight them by amplitude squared?
          *   *Likely Answer:* It's about rational betting behavior for agents embedded in the wavefunction.
          *   *Follow-up:* If an agent *doesn't* bet according to Born, do they cease to exist? Or just lose money? If the latter, isn't that empirical, not derivational?

      *   *Topic 2: The Branching Problem (Required).*
          *   *Idea:* Decoherence is gradual. Where is the split?
          *   *Draft:* When does a branch become a branch?
          *   *Refinement:* Vagueness of ontology. If reality is a wave, where do the "worlds" come from? Are they emergent?
          *   *Likely Answer:* Worlds are emergent structures, like clouds or tables. Fuzzy boundaries don't negate existence.
          *   *Follow-up:* But tables don't interfere. Branches *can* interfere (in principle). If the ontology is fuzzy, how do we count worlds for probability?

      *   *Topic 3: Bohmian Mechanics (Required).*
          *   *Idea:* Why MWI over Bohm?
          *   *Draft:* Bohm is deterministic too. Why prefer MWI?
          *   *Refinement:* Bohm has a "surreal trajectory" issue but avoids the multiplicity. Is MWI's ontological extravagance worse than Bohm's non-locality/empty waves?
          *   *Likely Answer:* Bohm adds hidden variables (positions) that are empirically redundant. MWI is just the Schrödinger equation.
          *   *Follow-up:* But MWI adds *worlds*. Isn't "1 universe + 1 equation" vs "1 universe + 1 equation + infinite invisible worlds" a wash? Why is the wavefunction alone sufficient ontology?

      *   *Topic 4: Quantum Suicide/Decision Theory (Required).*
          *   *Idea:* Does MWI change how you live?
          *   *Draft:* Would you play Russian Roulette?
          *   *Refinement:* Quantum Suicide implies you should expect to survive low-probability events. Does this lead to "quantum immortality" craziness?
          *   *Likely Answer:* No, because you care about the measure of your successors, not just existence.
          *   *Follow-up:* Then isn't "measure" just probability by another name? If you maximize measure, aren't you just doing standard expected utility?

      *   *Topic 5: Preferred Basis.*
          *   *Idea:* Why position basis?
          *   *Refinement:* Decoherence selects a basis, but is it unique enough?
          *   *Likely Answer:* Interaction with environment selects the pointer basis.
          *   *Follow-up:* But that depends on the Hamiltonian. Is the "world" structure dependent on how things interact, or fundamental?

      *   *Topic 6: Identity/Self.*
          *   *Idea:* What happens to *me*?
          *   *Refinement:* Pre-branching vs. Post-branching identity. Am I both?
          *   *Likely Answer:* You are a pattern. The pattern splits.
          *   *Follow-up:* If I split, do I have selfish preferences for *my* branch vs. the other? If not, why care about Born weights?

      *   *Topic 7: Empirical Distinguishability.*
          *   *Idea:* Can we ever test MWI vs. Bohm?
          *   *Refinement:* If they predict the same stats, is it metaphysics?
          *   *Likely Answer:* MWI predicts no collapse signatures. Bohm might allow non-equilibrium.
          *   *Follow-up:* If we never find non-equilibrium, is the choice purely aesthetic (Occam's razor)?

      *   *Topic 8: The "So What?" (Meta).*
          *   *Idea:* Why does this matter?
          *   *Refinement:* Does accepting MWI change physics research directions?
          *   *Likely Answer:* It encourages looking for unitary quantum gravity.
          *   *Follow-up:* Has it actually yielded new math, or just interpreted old math?

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes (aiming for 8 strong ones). Specific topics covered? Yes (Born, Branching, Bohm, Suicide). Follow-ups included? Yes. Likely answers included? Yes.
      *   *Tone Check:* Ensure the follow-ups aren't just "Gotcha!" but push the philosophical tension. The audience knows the LW sequence, so skip the basics.
      *   *Specific Polish:* Make sure the Bohm question acknowledges that LW ignores Bohm. Make sure the Born rule question hits the "circularity" charge hard.

  5.  **Final Polish (Self-Correction during drafting):**
