answer: |-
  This is a great position to be in. An audience that has internalized the *Sequences* knows the "MWI vs. Copenhagen" script better than most undergrads, which means you can skip the "collapse is magic" preamble and go straight for the jugular of the remaining philosophical problems.

  Here are 8 high-density questions designed to bypass the standard intro-level defenses and press on the unresolved tensions in modern Everettianism.

  ### 1. The Circularity of the Born Rule
  **Question:** "Our audience is familiar with the Deutsch-Wallace theorem, which attempts to derive the Born rule from decision-theoretic axioms rather than positing it. But critics argue this smuggles probability in through the back door by assuming a rational agent *should* care about branch weights in the first place. If the wavefunction is deterministic and all outcomes occur, isn't telling an agent to 'bet according to amplitude squared' just an additional physical postulate disguised as a norm of rationality?"

  *   **Likely Answer:** She will likely argue that probability isn't about *what happens* (ontology) but about *how agents embedded in the physics should act* (functionalism). She'll say the axioms of rationality (like diachronic consistency) force you to weight branches by amplitude, just as logic forces you to be consistent in classical worlds.
  *   **Sharp Follow-up:** "But if an agent refuses to follow those axioms—say, they bet equally on all branches regardless of amplitude—they don't become irrational in a logical sense, they just find themselves in branches where they lose money. Doesn't that make the Born rule an *empirical* claim about where observers end up, rather than a derivable truth of rationality? And if it's empirical, haven't we just re-added a collapse-like postulate about 'where we are'?"

  ### 2. The Vagueness of Branching
  **Question:** "Decoherence is a continuous process, not a discrete event. If 'worlds' are just emergent structures within the wavefunction, there is no sharp fact of the matter about when a split occurs or how many worlds exist at any given time. How do you reconcile this ontological vagueness with the need to *count* worlds—or at least measure them—to make sense of probability?"

  *   **Likely Answer:** She will likely lean on an analogy to other emergent phenomena. "There is no sharp number of clouds in the sky or tables in a room, yet clouds and tables exist." She'll argue that as long as the interference terms are negligible, the "fuzziness" of the branch count doesn't affect the empirical predictions.
  *   **Sharp Follow-up:** "Clouds don't interfere, but branches *can* in principle. If the number of worlds is vague, then the 'measure' of a set of worlds is also vague. If probability is grounded in that measure, doesn't that imply probability itself is vague? Are you comfortable accepting that it's literally indeterminate whether a specific quantum event had a 50% or 50.000001% chance of occurring?"

  ### 3. MWI vs. Bohmian Mechanics
  **Question:** "In rationalist circles, Bohmian mechanics gets almost no airtime compared to Everett. But Bohm offers a single, determinate outcome without collapse, matching our subjective experience directly, while Everett posits invisible, non-communicating copies of us. Beyond a raw appeal to Occam's Razor regarding the equations, why should we prefer your 'many local worlds' over Bohm's 'single non-local trajectory'?"

  *   **Likely Answer:** She will likely argue that Bohm's particles are "epiphenomenal." The wavefunction does all the dynamical work in Bohmian mechanics; the particles just ride along. Therefore, Bohm has all the ontology of MWI (the wave) *plus* extra hidden variables (the particles) that do nothing.
  *   **Sharp Follow-up:** "But MWI has the 'many worlds' ontology which Bohm avoids. If the Bohmian particles are what anchor our specific experience to a single trajectory, isn't removing them (as Everett does) actually *more* extravagant? You're trading one set of hidden variables (particles) for another (the existence of unobservable other branches). Why is multiplying worlds cheaper than multiplying particles?"

  ### 4. Quantum Suicide and Caring Measure
  **Question:** "Let's talk about Quantum Suicide. If MWI is true, there is always a branch where I survive a lethal experiment. Some argue this implies 'quantum immortality.' Do you take this seriously? And if not, does accepting MWI change how you should bet on life-or-death decisions compared to a single-world view?"

  *   **Likely Answer:** She will almost certainly reject quantum immortality. She will argue that you should care about the *measure* of your successors, not just their existence. If 99% of the measure dies, you should act as if you have a 99% chance of dying, because that's where your "caring weight" lies.
  *   **Sharp Follow-up:** "If 'caring measure' functions exactly like 'probability' in terms of decision making, haven't we just defined probability away? If I should act *exactly* as if collapse were real, what work is the 'many worlds' ontology actually doing for me? Is the only difference that I feel philosophically cleaner, or does this actually change the physics?"

  ### 5. The Preferred Basis Problem
  **Question:** "Decoherence selects a 'pointer basis' based on how a system interacts with its environment. But that means the definition of a 'world' depends on the Hamiltonian and the environment split. Is the structure of reality—the worlds themselves—fundamental, or is it relative to how systems happen to be interacting? If it's the latter, doesn't that make 'worlds' observer-dependent in a way that feels uncomfortably close to Copenhagen?"

  *   **Likely Answer:** She will likely argue that the interaction structure is objective, even if the basis is relative to the Hamiltonian. The "worlds" are stable patterns within the field, and stability is an objective fact, not a subjective choice.
  *   **Sharp Follow-up:** "But stability is a matter of degree. If 'worlds' are just stable patterns, then a sufficiently complex interference pattern could technically be described as 'containing' a pattern of a living observer. Are you committed to saying that *any* stable pattern in the wavefunction constitutes a 'world' with moral weight? If so, how do we avoid panpsychism or infinite moral clutter?"

  ### 6. Self-Locating Uncertainty
  **Question:** "In a branching event, if I know the wavefunction perfectly, I know everything there is to know about the physics. My uncertainty about 'which branch I will end up on' seems to be purely self-locating. But if both successors are 'me,' why should I be uncertain at all? How do you justify the *phenomenology* of uncertainty before the measurement if the outcome is determined?"

  *   **Likely Answer:** She will likely use the "subjective uncertainty" argument. Even if both outcomes happen, *I* (the pre-branch agent) don't know which future experience I will inhabit. It's analogous to not knowing which room you'll wake up in after being duplicated while asleep.
  *   **Sharp Follow-up:** "In the duplication case, only one of the successors is continuous with my current physical substrate in a single-world view. In MWI, *both* are. If I know both will exist and both will feel like me, isn't my uncertainty just ignorance about the *distribution* of my successors? And if so, aren't we back to needing the Born rule to tell me how that distribution is weighted, which brings us back to Question 1?"

  ### 7. Empirical Distinguishability
  **Question:** "If MWI and Bohmian mechanics (or even objective collapse theories with very high thresholds) predict the same statistics for all practical experiments, is this physics or metaphysics? Is there any conceivable experiment that could falsify Everett, or is it protected by the fact that any negative result can be explained by 'you're just in that branch'?"

  *   **Likely Answer:** She will likely argue that MWI makes a bold prediction: *no* collapse signatures will ever be found, even at macroscopic scales. It predicts unitary evolution holds universally. Collapse theories predict deviations at some mass/energy scale.
  *   **Sharp Follow-up:** "But if we *do* find a deviation, you can just say 'that's the scale where decoherence becomes reversible' or adjust the Hamiltonian. If the theory absorbs all null results by adjusting the complexity of the branch structure, what risk are you taking? Is there a specific observation that would make you say, 'Okay, the wavefunction isn't all there is'?"

  ### 8. The Research Heuristic
  **Question:** "Finally, a pragmatic question. Eliezer argued that believing in MWI should change how you do physics. Has adopting the Everett interpretation actually led to new mathematical results or research directions in your career, or does it primarily serve as a interpretive framework for existing math? If it's the latter, why should a physicist care enough to fight for it?"

  *   **Likely Answer:** She will likely argue that it prevents dead ends. It stops physicists from trying to modify the Schrödinger equation to force collapse (like GRW) and encourages looking for unitary quantum gravity. It directs attention to decoherence and information theory.
  *   **Sharp Follow-up:** "But string theory and loop quantum gravity researchers often don't commit to an interpretation. If the math works either way, is the 'fight' for Everett really about physics, or is it about preventing students from adopting what you see as a 'wrong' philosophical mindset? Is there a risk that dogmatism about MWI blinds us to collapse models that might actually be true?"

  ### Advice for the Interview
  *   **Don't let her retreat to "Shut up and calculate":** If she says "the math works," press her on *what the math represents*. Your audience cares about ontology.
  *   **Watch for "Emergence" hand-waving:** Philosophers of physics love to say worlds are "emergent." Your follow-ups should challenge whether emergence is sufficient to ground *probability* and *identity*.
  *   **The Bohm Angle:** This is your wildcard. Most LWers haven't steelmanned Bohm. If she struggles to explain why MWI is better than Bohm without just saying "Bohm is unpopular," you've given your audience a lot to think about.

  Good luck. This is the kind of content that keeps a niche podcast alive for years.
