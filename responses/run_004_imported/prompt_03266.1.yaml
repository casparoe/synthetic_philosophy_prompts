      *   *Round 4:* She tries to use Sorites as a *reductio*. He (in next move) will show he accepts sharp cutoffs. She is slightly weaker here because she assumes sharp cutoffs are unacceptable *per se*, whereas Williamson has a theory of vagueness that accepts them.
      *   *Round 5:* He strengthens his position by distinguishing semantic vagueness from epistemic margins. This is a technical win for him.

      *   *Overall:* He wins on exegesis and internal consistency of Williamson's system. She wins on highlighting the intuitive cost and the disanalogy between perception and introspection.
      *   *Missing:* Both might be missing the distinction between *luminosity* and *KK*. KK is about iteration of knowledge. Luminosity is about the condition obtaining. Also, the role of *safety* vs. *sensitivity*. Also, recent developments (e.g., knowledge-first virtue epistemology responses).

  5.  **Drafting the Adjudication:**

