      *   *Check:* Did I address AHP? Yes, need to make sure I don't just say "AHP is right" but explain if their distinction holds water. I'll argue their distinction is a diagnostic tool, not a solution. The solution is rejecting the premise of action-optimality.
      *   *Check:* Did I pick a side? Yes, Team Updateless/Pre-commitment.
