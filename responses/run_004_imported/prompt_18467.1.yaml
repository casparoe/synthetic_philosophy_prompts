          *   Actually, the standard paradox derivation is: At the node, belief is $\frac{1}{1+p}$. EV of continuing vs exiting.
          *   Let's keep it conceptual to avoid getting bogged in algebra, but show *why* it tempts. The temptation is thinking "I'm probably at the first intersection."
      *   **The Illusion of Information:** This is the core. Why does "I am at an intersection" feel like information? Because usually, being somewhere tells you where you are in a sequence. Here, it doesn't. It's "indexical uncertainty."
      *   **AHP vs. UDT:**
          *   AHP says: Planning optimal is the only coherent one. Action optimal is a mirage.
          *   My take: AHP is right, but UDT explains *why*. UDT says: Optimize the output of the decision function, not the action at the node conditional on the node.
          *   Critique of "Updating": You can't update on a variable ($Location$) that is causally downstream of your decision rule ($Policy$).
      *   **Sleeping Beauty Connection:** Briefly touch on this. It's the same structure. Self-locating belief vs. Decision.
      *   **The Verdict:** Be decisive. The driver must pre-commit. Updating is a cognitive error in this specific topology.

  6.  **Refining the Tone:**
      *   Avoid "Some argue..." too much. Use "The mistake is..."
