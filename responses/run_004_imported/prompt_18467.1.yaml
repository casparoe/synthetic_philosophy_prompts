  If I exit now: Payoff = $0 \cdot P(X) + 4 \cdot P(Y) = 4p/(1+p)$.
  If I continue: Payoff = $[4(1-p) + 1 \cdot p] \cdot P(X) + [1] \cdot P(Y)$... wait.
