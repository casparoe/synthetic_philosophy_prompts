answer: |-
  # The Intersection That Isn't There: A Verdict on the Absent-Minded Driver

  You were right to bring it up at dinner, and your reading group was right to spend an hour arguing. The Absent-Minded Driver (AMD) problem isn't just a quirky puzzle about highway exits; it is a stress test for the very concept of rational agency. It exposes a crack in the foundation of standard decision theory that most of us paper over with Bayesian intuition.

  Here is the verdict, upfront and without apology: **The driver must stick to the ex-ante plan of continuing with probability $p=2/3$. Any attempt to "update" beliefs at the intersection is a category error that destroys expected utility.** The distinction Aumann, Hart, and Perry (AHP) draw between planning-optimal and action-optimal is a useful diagnostic, but it is ultimately a diplomatic compromise that concedes too much to the paradox. The deeper truth, formalized by Updateless Decision Theory (UDT), is that in problems with imperfect recall, **there is no such thing as action-optimality distinct from planning-optimality.** Updating on self-locating information is not just risky here; it is incoherent.

  ### The Trap of the Ex-Ante Plan

  Let's recap the geometry of the trap. You are at the start. You know there are two identical intersections, X and Y.
  *   Exit at X: Payoff 0.
  *   Exit at Y: Payoff 4.
  *   Pass both: Payoff 1.

  Because you are absent-minded, you cannot distinguish X from Y. You must adopt a mixed strategy: continue with probability $p$, exit with probability $1-p$.

  From the start (ex-ante), the calculation is clean.
  *   Probability of exiting at X: $(1-p)$
  *   Probability of exiting at Y: $p(1-p)$
  *   Probability of passing both: $p^2$

  Expected Utility $U(p) = 0(1-p) + 4p(1-p) + 1(p^2) = 4p - 3p^2$.
  Maximizing this yields $p = 2/3$, with an expected payoff of $4/3$.

  This is the **Planning-Optimal** strategy. It is mathematically robust. If you could tie your hands to a randomizer set at $2/3$ before leaving the driveway, you would win. The paradox arises when we ask: *What happens when you actually arrive at an intersection?*

  ### The Illusion of Information

  When you stand at the wheel, staring at the identical signage, you know you are at *an* intersection. Your reading group likely argued that this is new information. Before, you were at the start (probability 1). Now, you are at a node. Surely, you should update your probability of being at X versus Y?

  This is the seduction. If you treat your location as an external fact to be discovered, you reason like this: "It is easier to reach the first intersection than the second. Therefore, I am more likely to be at the first one."

  Piccione and Rubinstein showed that if you try to optimize *at the node* using these updated beliefs, you derive a different optimal $p$. You might reason that since you are likely at X, you should continue to get to Y. But if you continue with a higher probability, you make it more likely that you are actually at Y (since Y is only reachable by continuing), which changes your belief, which changes your action. This feedback loop creates a time-inconsistency: the "you" at the start wants one thing, and the "you" at the wheel wants another.

  This is where the naive Bayesian instinct fails. Standard decision theory assumes that the state of the world is independent of your decision algorithm. In AMD, **your decision algorithm determines the probability distribution of the states you find yourself in.**

  By choosing a high $p$, you make the second intersection more likely to exist in your experience. By choosing a low $p$, you make the first intersection the more likely terminal point. When you try to update on "I am at an intersection," you are conditioning on a variable that is causally downstream of the very policy you are trying to optimize. It is like trying to calculate the odds of a coin landing heads after you have already decided whether to flip it, while pretending your decision to flip didn't affect the outcome.

  ### AHP and the Diplomatic Compromise

  Aumann, Hart, and Perry (1997) responded to Piccione and Rubinstein by arguing that the "action-optimal" strategy is a red herring. They maintained that the ex-ante planning optimum is the only coherent solution. However, they framed this as a distinction: *Planning-Optimal* vs. *Action-Optimal*. They suggested that while planning-optimal is what you should commit to, action-optimal is what a rational agent *would* calculate at the node if they treated their future selves as independent agents.

  This distinction is where my verdict diverges from the diplomatic consensus. AHP treats the tension as a conflict between two valid perspectives that need reconciliation. I argue that **Action-Optimality is not a valid perspective.** It is a calculation error masquerading as a strategy.

  To accept "Action-Optimality" as a legitimate concept, even as a foil, is to grant that the agent at the intersection has a different epistemic position than the agent at the start. They do not. They share the same memory, the same goals, and the same algorithm. The only difference is that the agent at the intersection is suffering from a specific cognitive deficit (amnesia) that the ex-ante agent accounted for.

  If you are at the intersection, you do not have *more* information than the planner; you have *less* context. The planner knows the structure of the whole trip. The driver only knows "I am here." To privilege the driver's localized view over the planner's global view is to privilege confusion over clarity. AHP is right that you should ignore the action-optimal calculation, but they are too generous in calling it a "strategy" rather than a bug.

  ### The Case for Updatelessness

  This is where Updateless Decision Theory (UDT) earns its keep. UDT posits that a rational agent should choose a policy that maximizes expected utility from the perspective of the initial state, without updating on observations that are logically correlated with the policy itself.

  In the AMD problem, the observation "I am at an intersection" is logically correlated with the policy "Continue with probability $p$."
  *   If Policy = "Always Exit", Observation = "I am at X" (Probability 1).
  *   If Policy = "Always Continue", Observation = "I am at X or Y" (Probability distribution shifts).

  UDT forbids you from updating on this observation because doing so severs the logical link between your choice and the probability of being in the situation where that choice matters.

  Think of it this way: You are not choosing an action for *this* intersection in isolation. You are choosing the output of a function `Decide()` that will be run at *every* intersection you encounter. Because you cannot distinguish them, `Decide()` must return the same distribution for both. When you optimize `Decide()`, you must account for the fact that its output determines how many times it gets called.

  If you update, you are effectively pretending that your decision at this node does not affect the probability of being at the other node. But it does. If you decide "Exit" now, you ensure you never face the second node. If you decide "Continue," you make the second node a reality. A decision theory that ignores this logical dependency is blind to the structure of the problem.

  ### The Sleeping Beauty Cousin

  Your reading group was correct to link this to Sleeping Beauty. In both cases, we have self-locating uncertainty created by the agent's own protocol. In Sleeping Beauty, waking up isn't new information about the coin toss; it's a scheduled event determined by the toss. In AMD, arriving at an intersection isn't new information about the map; it's a scheduled event determined by your driving policy.

  In both cases, "Halfers" (who don't update on waking/arriving) align with the UDT/Planning-Optimal view, while "Thirders" (who update on the frequency of observer moments) align with the naive updating view. The AMD problem is arguably stronger evidence for the "Halfer"/Updateless position because the payoffs are explicit. In Sleeping Beauty, the betting arguments are abstract. In AMD, the math is unforgiving: if you update and deviate from $p=2/3$, your expected payoff *objectively drops*. You literally lose money by thinking you have more information than you do.

  ### The Verdict

  So, here is the hard line.

  **1. What should the driver do?**
  The driver must continue with probability $p=2/3$. This is not merely a pre-commitment device; it is the only rational action at the node. When the driver arrives at the intersection, they should not recalculate. They should execute the policy determined by the ex-ante optimization. If they feel the urge to update, they should recognize it as a cognitive glitch caused by the amnesia, not a genuine Bayesian update.

  **2. Is "updating" a valid description?**
  No. Updating implies incorporating new, independent information to refine a model of the world. In the AMD problem, the "information" (I am at a node) is not independent of the decision algorithm. It is a logical consequence of it. To update is to double-count the evidence. It treats the agent's presence as a random sample from the set of intersections, when in fact the agent's presence is *generated* by the agent's strategy.

  **3. Does AHP resolve it?**
  AHP resolves the *mathematical* inconsistency by prioritizing planning-optimality, but they fail to fully exorcise the *philosophical* ghost. By validating "action-optimality" as a concept (even to reject it), they leave room for the intuition that the agent at the node has a distinct epistemic authority. They don't. The agent at the node is a subroutine of the agent at the start. A subroutine does not get to override the main program's optimization logic just because it has a narrower stack trace.

  **4. The Final Take**
  The Absent-Minded Driver is not a paradox; it is a warning label. It warns us that Bayesian updating is not a universal solvent for rationality. It works when observations are external to the decision. It fails when the decision determines the observation.

  In a world of perfect memory, Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) usually converge. In a world of imperfect recall, they diverge, and both can fail if they permit updating on self-locating information. The only framework that survives intact is one that respects the logical unity of the agent across time and memory states.

  Your reading group spent an hour arguing because they were trying to reconcile two incompatible views of the self: the self as a timeless optimizer and the self as a momentary observer. The AMD problem proves that in cases of imperfect recall, **you must be the timeless optimizer.** To do otherwise is to let the amnesia win.

  Stick to the $2/3$. Don't update. And maybe skip the decision theory talk during dessert next time—unless you want to be the absent-minded diner who forgets to pay.
