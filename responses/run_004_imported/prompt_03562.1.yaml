  6.  **Final Polish:** Check the scarf example logic.
      *   Glance: $P_{new}(G) = 0.6$.
      *   Tag: $P_{new}(T) = 0.7$. (Where $T \implies G$).
      *   If Glance first: We fix $P(G)$. Then we update on $T$. But updating on $T$ (making it 0.7) will shift $P(G)$ again because $T$ supports $G$.
      *   If Tag first: We fix $P(T)$. This shifts $P(G)$. Then we update on Glance ($P(G)=0.6$). This overrides the previous shift.
      *   The final $P(G)$ will differ.
