      *   *Key References:* Diaconis & Zabell (1982), Wagner (2002), Weisberg (2009) on the input problem.

      *(Self-Correction during drafting)*: I need to be careful about M's last claim. M says SC hides the issue. That's technically false regarding the *mathematics* of SC. $P(H|A \cap B) = P(H|B \cap A)$. I need to point out that M is conflating *logical* order with *temporal* order. In SC, temporal order doesn't change the logical conjunction. In JC, temporal order changes the *base* for the rigidity condition. I should clarify this distinction.

