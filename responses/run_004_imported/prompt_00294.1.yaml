      *   "Why Newcomb doesn't break it": Ensure this contrast is clear.
      *   "Is it a real crack": Give a nuanced opinion.

  10. **Final Polish:** Check tone. Ensure it sounds like a helpful guide, not a lecture. (Self-correction: Make sure to explicitly state *why* Newcomb is stable for CDT. In Newcomb, knowing you two-boxed confirms Box B is empty, but two-boxing is *still* the dominant move. In DiD, knowing you chose Aleppo confirms Death is in Aleppo, which makes Aleppo the *losing* move.)

  *(Self-Correction during drafting)*: I need to be careful about the CDT stance on Mixed Strategies. Traditional CDT (Gibbard/Harper) actually struggles here. It's often *modified* CDT or EDT that embraces the mixed strategy solution easily. I should clarify that the "mixed strategy solution" is often seen as a patch *for* CDT to save it, or an admission that CDT needs to account for the probability of its own output. I will frame it as "How decision theorists try to fix it."

