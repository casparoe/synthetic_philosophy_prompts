answer: |-
  Your friend's intuition is spot-on: this is not a mediator's ad-hoc invention, but a recognized concept from bargaining theory. The method you're describing is almost certainly an application of the **Kalai-Smorodinsky Bargaining Solution (KSBS)**.

  It is indeed a distinct, well-studied alternative to the more famous Nash Bargaining Solution. While the Nash solution is the "default" in many economics textbooks, the Kalai-Smorodinsky solution was developed specifically to address some of the counter-intuitive results Nash's method can produce.

  Here is a breakdown of what this rule is actually doing, the philosophy of fairness behind it, and where its vulnerabilities lie.

  ### 1. The Mechanics: Floor, Ceiling, and Ratio
  To understand why the mediator did this, we have to translate the dinner story into the formal components of a bargaining problem.

  *   **The Disagreement Point (The Floor):** In game theory, this is what happens if negotiations fail. In your friend's case, this was the statutory 50/50 split. Let's call this $d$.
  *   **The Ideal Point (The Ceiling):** This is the maximum utility (value) a player can achieve, *provided* the other player still gets at least their disagreement point ($d$). Let's call this $b$.
  *   **The Solution:** The mediator equalized the **ratio of the gain to the maximum possible gain**.

  Mathematically, if Sibling 1 gets utility $u_1$ and Sibling 2 gets $u_2$, the mediator solved for:
  $$ \frac{u_1 - d_1}{b_1 - d_1} = \frac{u_2 - d_2}{b_2 - d_2} $$

  In plain English: "You got 60% of the extra value you *could* have hoped for, and you also got 60% of the extra value *you* could have hoped for."

  ### 2. The Philosophy: Fairness as "Equal Relative Satisfaction"
  Why would anyone choose this over a simple 50/50 dollar split or the Nash solution?

  **Vs. The 50/50 Split:**
  A flat 50/50 split of assets assumes that money and assets mean the same thing to both parties. They rarely do. One sibling might live nearby and value the house highly (sentimentally or practically), while the other lives abroad and only sees it as liquid cash. A 50/50 asset split might force a sale that destroys value for both. The Kalai-Smorodinsky method allows for **asymmetric valuations**. It acknowledges that Sibling A might be able to extract more total value from the estate than Sibling B (perhaps because they can run the shop), and it adjusts the split so that the *satisfaction* is equal, not the dollar amount.

  **Vs. The Nash Bargaining Solution:**
  The Nash solution maximizes the *product* of the gains above the floor ($(u_1 - d_1) \times (u_2 - d_2)$). While mathematically elegant, Nash has a quirk called **Independence of Irrelevant Alternatives**. Essentially, under Nash, if your "ceiling" (your best possible outcome) suddenly rises, your actual settlement might not change, or could even drop, depending on the shape of the negotiation curve.

  Kalai and Smorodinsky (in 1975) argued this was unfair. They proposed a principle of **Individual Monotonicity**: *If my potential best-case outcome improves, my actual settlement should not get worse.*

  By tying the settlement to the "best case" ceiling, the KSBS ensures that if one sibling has a stronger claim or higher potential value (a higher ceiling), that advantage is recognized proportionally in the final split. It treats fairness as **equalizing the frustration of not getting everything you want.**

  ### 3. How to Defend It (The Pros)
  If your friend wants to justify this to skeptics, here are the strongest arguments:

  *   **It Avoids "Need-Based" Guilt:** As your friend noted, haggling over who "needs" the money more is emotionally toxic in a family. This method is objective. It relies on the *structure of the estate*, not the *personal finances of the siblings*.
  *   **It Incentivizes Honesty about Value:** To find the "ceiling," the siblings have to admit what the assets are truly worth to them. If Sibling A says, "I don't care about the shop," their ceiling drops, and their share of the gains drops. It forces them to internalize their own preferences.
  *   **It Respects Asymmetry:** If the stationery shop is worth \$500k to the sibling who is a stationer, but only \$200k to the sibling who isn't, a 50/50 cash split forces a sale. This method might give the shop to the stationer and more cash to the other, calibrating the deal so both feel they got the same "deal" relative to their maximum hope.

  ### 4. The Soft Spots (The Cons)
  Your friend's unease about the "best case" numbers being hypothetical is the exact critique economists have of KSBS.

  *   **The "Ceiling" is Subjective:** The biggest vulnerability is determining the "best case." Who decides what is hypothetically possible? If the mediator allows Sibling A to claim an inflated ceiling ("I could have run the shop and made millions!"), they skew the ratio in their favor. The mediator has to be very skilled at setting realistic feasibility frontiers, or the system is gameable.
  *   **Utility is Hard to Compare:** The math assumes we can compare Sibling A's "gain" to Sibling B's "gain." But if Sibling A values the house sentimentally and Sibling B values cash financially, are those units comparable? The mediator likely had to assign dollar values to sentimental items to make the math work, which is always an approximation.
  *   **It Ignores "Irrelevant" Options:** While Nash is criticized for this, KSBS is criticized for the opposite. It depends heavily on the *shape* of the maximum possibilities. If a tiny, irrelevant asset is added to the estate that changes one sibling's "theoretical maximum" but is never actually distributed, it can mathematically shift the entire settlement.
  *   **Risk Aversion:** This method assumes both siblings are equally willing to gamble on their "best case." If one sibling is risk-averse and just wants cash, and the other is risk-tolerant and aims for the "best case," the risk-tolerant one might manipulate the ceiling to look higher.

  ### 5. The Verdict
  The mediator didn't pull a number out of a hat; they applied a **proportional concessions** model.

  Is it "better" than a 50/50 split? In complex estates with illiquid assets (like a family business) and asymmetric preferences, **yes**. A 50/50 split often destroys value (e.g., forcing a fire sale of the house).

  Is it "better" than Nash? That depends on what you value. If you value **stability and mathematical consistency**, Nash is superior. If you value **intuitive fairness and monotonicity** (i.e., "if my potential share goes up, my actual share shouldn't go down"), Kalai-Smorodinsky is superior.

  **The Bottom Line for Your Friend:**
  The mediator used a method that prioritizes **equal relative satisfaction** over **equal absolute dollars**. It is a legitimate, academically robust way to solve the problem. The "bug" your friend feels is likely the discomfort of realizing that "fairness" isn't a single number, but a choice of which mathematical definition of fairness you prefer. In a family context, where preserving relationships matters more than economic efficiency, ensuring both parties feel they achieved the same *percentage of their dreams* is often more peacekeeping than ensuring they got the same *number of dollars*.

  It wasn't a trick; it was a sophisticated way to make sure neither sibling felt they "lost" the negotiation relative to their own hopes.
