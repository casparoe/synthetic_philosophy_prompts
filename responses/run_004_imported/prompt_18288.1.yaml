      *   Check against user constraints: They asked for a name outside software and principled ways.
      *   *Self-Correction during drafting:* I initially thought about suggesting static analysis tools. But the user said the backend is "large, interconnected." Static analysis often fails here due to dynamic behavior. I should emphasize *runtime* verification (observability) over *compile-time* verification.

  7.  **Final Review against the prompt:**
