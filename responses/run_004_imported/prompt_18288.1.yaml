answer: |-
  You have hit on one of the most profound problems in computer science, artificial intelligence, and philosophy. You are describing **The Frame Problem**.

  It is not just a software engineering annoyance; it is a fundamental logical hurdle that stumped AI researchers for decades. Recognizing this might not immediately fix your deployment pipeline, but it should relieve your team of the guilt that you simply "haven't tried hard enough" to make the checklist complete. You are fighting a mathematical limit, not a process gap.

  ### 1. The Name: The Frame Problem
  In the 1960s and 70s, AI researchers building planning systems ran into exactly your issue. If a robot moves a box from Room A to Room B, how does it represent the state of the world afterward?
  *   **Explicit:** The box is in Room B.
  *   **Implicit:** The color of the walls hasn't changed. The battery level of the robot hasn't changed. The price of tea in China hasn't changed.

  To represent the world logically, you technically have to list every single fact that *didn't* change (the "frame") alongside the one that did. Since the number of facts is effectively infinite, the computation becomes impossible.

  In your backend:
  *   **Change:** You update a timestamp format.
  *   **Frame:** You assume the billing service, the cache layer, and the analytics pipeline *don't* care about the format, only the value.
  *   **Reality:** They did care. But listing "billing service timestamp parser" on a checklist for a "user profile service" deploy is impossible because the dependency is implicit, not explicit.

  Your senior engineer's "feel" is her brain's heuristic solver for the Frame Problem. She isn't checking a list; she is running a mental simulation of the system's topology based on years of pattern recognition. She knows which "frames" are likely to be brittle.

  ### 2. Why Checklists Fail Here (Complicated vs. Complex)
  There is a distinction in systems theory between **Complicated** and **Complex** systems.
  *   **Complicated (e.g., a rocket):** Many parts, but deterministic. If you know the specs, you can write a checklist. Failure is usually due to skipping a step.
  *   **Complex (e.g., a rainforest, or a large microservices backend):** Many parts, adaptive, non-linear. Dependencies emerge at runtime. Failure is usually due to *unanticipated interactions*.

  Checklists (popularized in medicine and aviation by Atul Gawande) are incredible for *Complicated* systems. They ensure you don't forget the known steps. But in a *Complex* system, a checklist of "things to check" is inherently flawed because **you cannot list the unknowns.**

  When you try to make the checklist "complete," you end up listing everything (unusable). When you trim it, you miss the emergent dependencies (incidents).

  ### 3. Principled Approaches (Beyond "Gut Feeling")
  If we accept that we cannot solve the Frame Problem statically (before the deploy), we must shift our strategy from **Verification** (proving it won't break) to **Validation and Resilience** (detecting and containing it when it does).

  Here are the principled ways industry leaders handle this, moving away from the checklist model:

  #### A. Make Implicit Contracts Explicit (Contract Testing)
  Many of your examples (null fields, timestamp formats) are violations of implicit contracts.
  *   **The Fix:** Use tools like **Pact** or strict schema enforcement (Protobuf/GraphQL) between services.
  *   **The Principle:** Instead of asking "Did I check the billing service?", the system enforces "The billing service *cannot* consume this data unless it adheres to this contract." If your change breaks the contract, the build fails, not production. This moves the "gut feeling" about dependencies into the type system.

  #### B. Shift from "Blast Radius Check" to "Blast Radius Containment"
  Since you cannot perfectly predict the blast radius, assume it will be larger than you think and engineer for that.
  *   **Canary Deployments:** Roll the change out to 1% of traffic. If the "analytics pipeline two steps downstream" breaks, it only affects 1% of the data.
  *   **Feature Flags:** Decouple deploy from release. Turn the logic on for internal users first.
  *   **The Principle:** Minimize the cost of being wrong, rather than trying to ensure you are never wrong.

  #### C. Observability over Monitoring
  Monitoring tells you if a known metric is red (e.g., "CPU > 90%"). Observability allows you to ask *new* questions of your system without deploying new code.
  *   **The Fix:** Distributed tracing (OpenTelemetry).
  *   **The Principle:** When you change Service A, you shouldn't be manually checking Service B and C. You should have a trace map that automatically shows you if requests flowing from A are erroring in B or C. This automates the "looking downstream" part of your senior engineer's intuition.

  #### D. Chaos Engineering
  If you can't predict the dependencies, probe them.
  *   **The Fix:** Regularly inject failure or run "game days" where you change config in staging to see what breaks.
  *   **The Principle:** Discover the hidden dependencies *before* they are discovered by a customer. This helps you build the mental model faster.

  ### 4. How to Institutionalize the "Gut Feeling"
  You asked if "ask whoever has the best gut feeling" is the best you can do. It doesn't have to be. You can externalize that intuition without a checklist.

  **1. Architecture Decision Records (ADRs) with "Impact Analysis"**
  When a change is proposed, don't ask for a checklist. Ask for a narrative: *"I believe this change only touches X, because Y. If I am wrong, it will likely be because of Z."*
  This forces the engineer to articulate their mental model. Over time, you build a library of *why* things are coupled, which is more valuable than a list of *what* is coupled.

  **2. The "Second Story" Postmortem**
  In your postmortems, stop at the technical cause (e.g., "timestamp format changed"). Go one level deeper to the process cause: *"Why was this dependency not visible?"*
  *   Was there no trace?
  *   Was there no contract?
  *   Was the documentation wrong?
  Fix the *visibility* of the dependency, not just the dependency itself.

  **3. Pairing on Deploys**
  Have the junior engineers shadow the senior engineer during the "blast radius" phase. Don't let her just do it. Ask her: *"Why are you looking at the cache? Why are you ignoring the billing service?"*
  Record these sessions. Transcribe the heuristics. You will find she isn't using magic; she's using rules like *"Anything that touches user identity touches billing"* or *"Any date format change hits analytics."* Capture those heuristics, not as a checklist, but as **Coupling Rules**.

  ### Summary
  You are facing the **Frame Problem**. It is unsolvable in the general case. You cannot write a static document that perfectly predicts dynamic system behavior.

  *   **Stop trying to write a perfect checklist.** It is a category error.
  *   **Start enforcing contracts.** Make the implicit assumptions (nullability, formats) fail at build time.
  *   **Start automating detection.** Use tracing and canaries to see the blast radius dynamically rather than guessing it statically.
  *   **Capture the heuristics.** Turn the senior engineer's "feel" into architectural rules ("If X changes, Y is suspect") rather than a checklist of specific services.

  The goal isn't to know everything that *won't* break. The goal is to ensure that when something unexpected *does* break, you know within 30 seconds, and only 1% of your users notice.
