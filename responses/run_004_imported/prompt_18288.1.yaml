      *   **Core Question:** Is there a name for this problem outside of software? Is there a principled way to handle it, or is "gut feeling" the best we can do?
      *   **Underlying Philosophical/Technical Challenge:** How to specify *in advance* which of the *indefinitely many facts* about a system remain true after a change (The Frame Problem).

  2.  **Identify the Core Concept:**
      *   The user's description ("indefinitely many facts about a running system stay true after some change") is a textbook definition of **The Frame Problem** in Artificial Intelligence and Philosophy.
      *   *Connection:* In AI planning, how do you represent what *doesn't* change when an action occurs without listing every single non-changing fact in the universe?
      *   *Software Engineering Equivalent:* This is also related to **Coupling/Cohesion**, **Hidden Dependencies**, **Emergent Behavior**, and **Observability**.
      *   *Process Equivalent:* This is the limit of **Checklist Medicine** (Atul Gawande style) when applied to complex adaptive systems.

  3.  **Brainstorm Solutions/Approaches:**
      *   *Why checklists fail here:* Checklists work for *complicated* systems (airplanes), not *complex* systems (ecosystems, microservices with hidden state).
      *   *Why "gut feeling" works:* It's pattern recognition based on mental models of the system's topology and data flow.
      *   *How to bridge the gap:*
          *   Shift from "what to check" to "how to detect." (Observability > Verification).
          *   Shift from "prevent all errors" to "limit damage." (Blast radius containment).
          *   Shift from "static analysis" to "dynamic testing." (Chaos engineering, canarying).
          *   Formalize the "gut feeling." (Architecture Decision Records, Dependency Graphs, Contract Testing).

  4.  **Structure the Response:**
      *   **Validate & Name:** Acknowledge the depth of the insight. Explicitly name **The Frame Problem**. This validates their intuition that this is a fundamental logical issue, not just a process failure.
      *   **Explain the Frame Problem:** Briefly explain it in AI/Philosophy terms and map it back to their backend.
      *   **Why Checklists Fail (Complexity Theory):** Distinguish between *Complicated* (deterministic, knowable) and *Complex* (adaptive, emergent). Checklists work for the former, not the latter.
      *   **Principled Approaches (Beyond "Gut Feeling"):**
          *   *Contract Testing:* Make implicit assumptions explicit (Pact, Protobuf).
          *   *Observability/Telemetry:* Don't check *before*, detect *during/after*. (Canaries, Feature Flags).
          *   *Dependency Mapping:* Automated service maps (OpenTelemetry).
          *   *Chaos Engineering:* Proactively break things to find dependencies.
          *   *Formal Methods (Lightweight):* Type systems, schema validation.
      *   **Capturing the "Gut Feeling":** How to institutionalize the senior engineer's knowledge without a checklist. (Mental models, Architecture Decision Records, Postmortems that focus on *why* it wasn't on the list).
      *   **Conclusion:** Summarize. It's not about a perfect checklist; it's about resilience and feedback loops.

