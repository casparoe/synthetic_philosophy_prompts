answer: |-
  This is a strong prompt. You've identified a genuine exegetical fault line in *On Certainty* (OC) and mapped it onto the contemporary debate between the "grammatical" reading (Moyal-Sharrock) and the "epistemic" reading (Wright/Pritchard).

  Here is a critical breakdown of your draft argument, addressing your four specific questions.

  ### 1. Is the tension between the metaphors real?
  **Verdict:** Yes, but your mapping of the metaphors to the secondary literature needs tightening.

  The tension is real, but it isn't necessarily between "non-epistemic" vs. "propositional." It is between **logical structure** and **historical genesis**.

  *   **The Hinge (§341ff):** This is a functional/logical metaphor. A hinge is distinct from the door. It does not move *with* the door; it is the condition *for* the door's movement. This supports the Moyal-Sharrock (MS) reading: hinges are categorically different from empirical propositions. They are rules in the clothing of propositions. If you doubt the hinge, the game ends; you aren't playing "doubt" anymore, you're playing "nonsense."
  *   **The River-bed (§96ff):** This is a genealogical/geological metaphor. The distinction between "water" (fluid propositions) and "bed" (hardened propositions) is one of degree and time, not kind. Sand hardens into rock; rock erodes into sand. This supports the Wright reading: hinges are empirical propositions that have temporarily acquired a normative role. There is no categorical firewall, only a functional sedimentation.

  **The Critique:** You argue the Hinge fits MS and the River-bed fits Wright. This is mostly correct, but be careful: the River-bed metaphor actually threatens MS's view more than it supports Wright's. If the bed shifts, then the "hard" stuff isn't *essentially* hard. MS wants to say hinges are *essentially* non-epistemic rules. The River-bed suggests they are *contingently* hardened empirical claims.

  **Recommendation:** Frame the tension not just as "inconsistent metaphors" but as a conflict between **transcendental conditions** (Hinge) and **naturalized history** (River-bed). Wittgenstein wants to say skepticism is impossible (Hinge) but also that our certainties are human, historical practices (River-bed). Reconciling the "impossible to doubt" with "historically contingent" is the real engine of your essay.

  ### 2. Is Priya's "It's not a theory" response a cop-out?
  **Verdict:** It is orthodox, but in this specific context, it is a conversation-stopper that protects the text from critique.

  Priya is channeling the standard therapeutic reading: Wittgenstein is dissolving problems, not solving them. He uses metaphors to jolt us out of pictures, not to build new ones. Demanding consistency between metaphors assumes he is building a system, which he explicitly disavows.

  **However,** *On Certainty* is the outlier in the corpus. It is the closest Wittgenstein comes to engaging directly with a traditional epistemological problem (Moorean skepticism) on something like its own terms.
  *   **Why it feels like a dodge:** Because OC *reads* like it is making positive claims about the structure of justification. If Wittgenstein merely wanted to therapy the skeptic, the River-bed and Hinge remarks wouldn't need to be so structurally specific.
  *   **The Counter:** If you accept Priya's view, you cannot write the essay. The essay *depends* on the premise that these metaphors carry theoretical weight.
  *   **The Nuance:** You can concede Priya is right about *intent* but argue she is wrong about *effect*. Even if Wittgenstein didn't intend a system, the tension between the metaphors generates a philosophical problem regarding the stability of norms that needs addressing. You aren't critiquing Wittgenstein's failure to be systematic; you are critiquing the interpretive consequences of his dual imagery.

  ### 3. Does your Synchronic/Diachronic fix collapse into Pritchard or Wright?
  **Verdict:** It is distinct from Wright, compatible with Pritchard, but arguably closer to a Kripkean reading of rule-following.

  *   **Vs. Wright:** Wright's "Entitlement" is a warrant story. He argues we are rational to accept hinges without evidence. Your sync/diachronic split is an *ontological/functional* story. You are saying the *status* of the proposition changes, not just our warrant for it. This is stronger than Wright.
  *   **Vs. Pritchard:** Pritchard distinguishes between "beliefs" (epistemic) and "hinge commitments" (non-epistemic). He uses this to block skepticism. Your view adds a temporal dimension Pritchard underplays. Pritchard treats hinges as relatively stable structural features. Your River-bed integration suggests the *content* of the hinges changes. This saves the view from conservatism (the idea that our current hinges are the only possible ones).
  *   **The Third Position:** Your view sounds like **Normative Functionalism**.
      *   *Synchronic:* At $t_1$, proposition $P$ functions as a rule (Hinge). It is non-epistemic relative to the system.
      *   *Diachronic:* At $t_2$, $P$ may function as an empirical claim, or $Q$ may replace it as the rule.
      *   This avoids MS's problem (how can rules change if they are grammatical?) and Wright's problem (how can empirical claims be immune to doubt?).

  **Critique of the Fix:** The risk is relativism. If the bed shifts, what prevents the "hard rock" from becoming sand during a crisis? If hinges are only synchronically fixed, is certainty just a matter of social consensus at a given time? You need to address what drives the shift. Wittgenstein suggests "experience" hardens the propositions, but he is vague on the mechanism.

  ### 4. Is this essay-worthy or a footnote?
  **Verdict:** Essay-worthy, provided you avoid the "Wittgenstein said X but also Y" trap.

  There is a saturation of literature on OC hinges. A paper that simply points out the tension between §341 and §99 is a seminar paper, not a journal article. Many have noted this (Coliva, Forcehimes, et al.).

  **To make it publishable/serious:**
  1.  **Don't just diagnose the tension; solve the problem it creates.** The problem is: How can norms be binding (Hinge) if they are contingent (River-bed)? Your sync/diachronic split is the solution. Argue that *normativity requires this dual aspect*. A rule that never changes is dead (no application); a rule that changes constantly is not a rule (no guidance).
  2.  **Engage the "Relativist Objection."** If the river bed shifts, does that mean Nazi ideology could have its own "hinges" that are immune to critique within its system? (This is the standard objection to hinge epistemology). Your diachronic view allows you to say: "Yes, synchronically they are immune, but diachronically they are subject to erosion based on practical failure." This gives you a critical edge MS lacks.
  3.  **Refine the Title/Thesis.** Instead of "Two Metaphors in OC," frame it as "The Temporal Structure of Normativity in *On Certainty*." The metaphors are evidence, not the subject.

  ### Summary of Recommendations for the Draft

  1.  **Tighten the MS/Wright Mapping:** Acknowledge that the River-bed metaphor actually complicates MS's "categorical" claim more than it supports Wright's "propositional" claim. The River-bed suggests *functional* fluidity, which is your key insight.
  2.  **Handle Priya's Objection:** Grant that Wittgenstein isn't systematic, but argue that *interpretive coherence* is necessary to extract a viable epistemology from the text. We aren't mind-reading Wittgenstein; we are assessing the philosophical utility of the concepts he left us.
  3.  **Develop the Sync/Diachronic Distinction:** This is your money shot. Connect it to the problem of **rigidification**. How does a fluid proposition become a rigid hinge? Use the River-bed to explain the *process* of hinge-formation that the Hinge metaphor obscures.
  4.  **Address Relativism:** You must answer whether this view allows for "bad hinges." If hinges shift, what guides the shift? (Wittgenstein hints at "utility" or "agreement in forms of life," but you need to make this explicit).

  **Final Verdict:** The central claim holds up. The tension is real, and the sync/diachronic resolution is a viable philosophical position, not just a restatement of Pritchard. It moves the debate from "What kind of thing is a hinge?" to "How does a hinge become a hinge?" That is a worthwhile shift.
