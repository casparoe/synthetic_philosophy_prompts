answer: |-
  **MEMORANDUM**

  **TO:** Student Film Festival Selection Committee
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Voting Procedure Reform (2024 Festival)

  **Executive Summary**

  Following this year's festival, we identified a critical instability in our voting method: the removal of a non-winning "spoiler" film reversed the outcome between our top two finalists. In social choice theory, this is a violation of the *Independence of Irrelevant Alternatives* (IIA). This memo recommends replacing our current Borda Count system with a **Condorcet Method (specifically Ranked Pairs)** for next year's selection.

  While some have argued that Arrow's Impossibility Theorem renders any reform pointless, this memo argues that while theoretical perfection is impossible, practical robustness is achievable. We can select a method that minimizes the specific risks we encountered this year. I also address the proposal to switch to Instant-Runoff Voting (IRV), arguing that Condorcet is better suited for a small jury seeking the "best" film rather than a "majority winner."

  **The Problem: Borda Count and IIA**

  Our current system, Borda Count, assigns points based on rank position (e.g., 1st place gets 6 points, 2nd gets 5, etc.). While this rewards consensus, it is mathematically vulnerable to IIA violations. As we discovered, the relative score of two top films can be altered by how jurors rank a third, irrelevant film. This makes the result susceptible to strategic nomination and undermines the legitimacy of the award. We cannot treat this as a fluke; it is a known structural feature of the Borda Count.

  **Addressing the "Arrow's Theorem" Objection**

  One committee member rightly invoked Arrow's Impossibility Theorem, noting that no ranked voting system can simultaneously satisfy a set of basic fairness criteria (including IIA, Non-Dictatorship, and Pareto Efficiency). The argument follows that if every system is flawed, changing methods is futile.

  As an economics student, I want to engage honestly with this claim: **Arrow's Theorem is correct, but the conclusion that reform is pointless is not.**

  Arrow's Theorem proves that no ordinal ranking system is *perfect*. It does not prove that all systems are *equally flawed*. Some methods fail IIA frequently (like Borda); others fail it only in rare, specific circumstances (like Condorcet methods, which only fail IIA if a voting cycle occurs). Our goal is not to find a utopian system that violates no theorems, but to select the system that is most robust to the specific failure we just experienced. We are choosing the "least broken" tool for our specific context, which is a rational response to Arrow's constraints.

  *(Note: It is worth mentioning that Arrow's Theorem applies only to ordinal rankings. If we wished to theoretically bypass Arrow entirely, we could adopt a cardinal "Score Voting" system (e.g., rating films 0–10). However, given the committee's current focus on ranking methods and the desire for minimal disruption, I recommend optimizing within the ranked framework.)*

  **Recommendation: Condorcet Method (Ranked Pairs)**

  I recommend we adopt a Condorcet Method, specifically **Ranked Pairs** (also known as the Tideman method).

  In a Condorcet system, we compare every film head-to-head against every other film. If Film A is preferred to Film B by a majority of jurors (3 out of 5), A "beats" B. The winner is the film that beats all others in these pairwise matchups.
  *   **Why this solves our problem:** If Film A beats Film B head-to-head, the presence or absence of Film C cannot change that specific matchup. This largely insulates the result from the "spoiler" effect we saw this year.
  *   **Handling Cycles:** In rare cases, preferences may cycle (A beats B, B beats C, C beats A). Ranked Pairs resolves this by locking in the strongest majorities first, ensuring a deterministic winner without arbitrary tie-breakers.

  **The Strongest Rival: Instant-Runoff Voting (IRV)**

  The primary alternative on the table is Instant-Runoff Voting. While IRV is popular in political elections, it is inferior to Condorcet for a five-person jury for two reasons:

  1.  **The Condorcet Criterion:** IRV can eliminate the "true best" film early if it lacks enough first-place votes, even if that film would have beaten the eventual winner head-to-head. In a film festival, we want the film that is most broadly respected by the jury, not just the one with a polarized base of support. Condorcet guarantees that if a film is preferred head-to-head against all rivals, it wins. IRV does not.
  2.  **Monotonicity:** IRV violates the monotonicity criterion, meaning that ranking a film *higher* on a ballot can theoretically cause it to *lose*. This is counter-intuitive and difficult to explain to jurors if questioned. Condorcet methods (like Ranked Pairs) are monotonic.

  **Implementation and Next Steps**

  Adopting Ranked Pairs requires no new technology, only a change in how we tally votes.
  1.  **Ballots:** Jurors submit rankings exactly as they do now (1st to 6th).
  2.  **Tally:** We construct a pairwise matrix (15 comparisons for 6 films).
  3.  **Calculation:** This can be done via a simple spreadsheet template I will prepare, or free online calculators designed for Ranked Pairs.

  **Conclusion**

  Arrow's Theorem reminds us to be humble about our results, but it should not paralyze us. We know Borda Count failed the IIA test this year. Condorcet (Ranked Pairs) passes that test in all non-cyclic scenarios and is theoretically superior to IRV for small committees seeking a consensus "best" option.

  I move that we adopt the Ranked Pairs Condorcet Method for the 2024 Festival. I am happy to circulate a spreadsheet demo before our vote next week.
