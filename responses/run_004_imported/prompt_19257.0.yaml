      *   **Lewis's View:** Lewis admits conventions can overlap with moral principles, but the *specific* regularity must be arbitrary. "First-come-first-served" is arbitrary in the sense that "Last-come-first-served" would also coordinate us, even if we think it's less fair. The coordination itself (ordering) is the convention; the specific rule (FCFS) is the arbitrary choice among ordering rules.
      *   **Verdict:** The user's insight is sharp and actually cuts deeper than Colin's argument. It attacks condition (4) of Lewis's definition (Arbitrariness). If FCFS is morally mandated, it's not a convention. If it's just one way to order among many, it is. Most philosophers think FCFS *is* arbitrary enough (we could use a lottery), so Mara survives this, but the user is right to flag it.

