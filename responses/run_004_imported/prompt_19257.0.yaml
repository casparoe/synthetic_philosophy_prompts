          *   *Verdict:* Colin identifies a genuine tension. If the only reason I don't cut is fear of a glare, is it *really* a coordination equilibrium in Lewis's strict sense, or is it a norm enforced by sanctions? Lewis wants conventions to be self-policing *because* coordination fails without them, not because people get yelled at. However, Lewis does allow preferences to include social approval. Still, Colin's distinction between "crash" (physical necessity) and "glare" (social sanction) is philosophically significant.
          *   *Refinement:* Lewis defines equilibrium based on *preferences*. If I prefer not to be glared at, then conforming *is* my best response. So Colin's claim that it's "not a coordination equilibrium" might be technically wrong *if* we include social costs in preferences. But his intuition that this changes the *type* of norm is right.
          *   *Decision:* Colin has a strong point about the *nature* of the equilibrium, but Mara can counter on the definition of preferences. Let's lean slightly towards Colin here for identifying the structural difference, but note the vulnerability.

      *   **Move 3 (Mara):** Social costs (glares) count as payoffs. Therefore, conforming *is* the best response. It remains a coordination equilibrium.
