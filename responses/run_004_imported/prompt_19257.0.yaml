  2.  **Deconstruct the Philosophical Core (Lewis's *Convention*):**
      *   **Coordination Problem:** A situation where agents have common interests in coordinating their actions.
      *   **Coordination Equilibrium:** A combination of actions where no one would prefer to act differently *given* that others act as they do. (Crucially, usually implies there are *multiple* equilibria).
      *   **Convention:** A regularity $R$ in a population $P$ such that:
          1.  Everyone conforms to $R$.
          2.  Everyone expects everyone else to conform to $R$.
          3.  Everyone prefers to conform to $R$ *on the condition* that others do (this makes it an equilibrium).
          4.  There is at least one alternative regularity $R'$ that could have solved the coordination problem just as well (Arbitrariness).
          5.  These facts are common knowledge.
      *   **The "Sanction" Issue:** Lewis distinguishes between conventions (where conformity is self-enforcing due to coordination interests) and norms enforced by external sanctions (like laws or moral obligations). However, he acknowledges that social pressure can be part of the payoff structure.

  3.  **Evaluate the Four Moves:**

      *   **Move 1 (Mara):** Queueing is a textbook Lewis convention (arbitrary, solves coordination, sustained by expectation).
