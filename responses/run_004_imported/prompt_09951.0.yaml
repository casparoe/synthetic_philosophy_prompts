  *   **Fraternity hazing rituals:** Pain tolerance varies independently of loyalty, so the cost doesn't perfectly filter for the intended trait of group commitment versus mere toughness.
  *   **Becoming a monk and giving away all your possessions:** The cost depends on initial wealth, so someone with nothing to lose can fake high devotion cheaply compared to someone sacrificing actual riches.
  *   **Posting shirtless gym-progress pics online:** The act of posting is costless, and the physique itself can be enhanced or angled to mask low underlying quality, making it cheap talk rather than a handicap.
