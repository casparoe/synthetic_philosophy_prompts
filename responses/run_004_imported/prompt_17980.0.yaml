prompt: |-
  I'm taking a seminar this term on early modern rationalism, and this week we're working through sections II–V of Leibniz's *Discourse on Metaphysics*, the stretch where he moves from his anti-voluntarist arguments about goodness into what our professor calls "the practical upshot" of the claim that God always acts for the best. I've read section IV several times now in George R. Montgomery's 1902 translation (the edition we were assigned) and keep getting stuck on the same move, so I'd like help thinking it through before my discussion section meets on Thursday. Here is the passage:

  "The general knowledge of this great truth that God acts always in the most perfect and most desirable manner possible, is in my opinion the basis of the love which we owe to God in all things; for he who loves seeks his satisfaction in the felicity or perfection of the object loved and in the perfection of his actions. *Idem velle et idem nolle vera amicitia est.* I believe that it is difficult to love God truly when one, having the power to change his disposition, is not disposed to wish for that which God desires. In fact those who are not satisfied with what God does seem to me like dissatisfied subjects whose attitude is not very different from that of rebels. I hold therefore, that on these principles, to act conformably to the love of God it is not sufficient to force oneself to be patient, we must be really satisfied with all that comes to us according to his will. I mean this acquiescence in regard to the past; for as regards the future one should not be a quietist with the arms folded, open to ridicule, awaiting that which God will do; according to the sophism which the ancients called λόγον ἀεργόν, the lazy reason. It is necessary to act conformably to the presumptive will of God as far as we are able to judge of it, trying with all our might to contribute to the general welfare and particularly to the ornamentation and the perfection of that which touches us, or of that which is nigh and so to speak at our hand. For if the future shall perhaps show that God has not wished our good intention to have its way, it does not follow that he has not wished us to act as we have; on the contrary, since he is the best of all masters, he ever demands only the right intentions, and it is for him to know the hour and the proper place to let good designs succeed."

  What I can't work out is why the "acquiescence" Leibniz demands of us is restricted to the past. He is explicit that toward the future we must not lapse into the quietism of the "lazy reason" — yet the whole argument for acquiescence rested on the fully general premise that God always acts in the most perfect way possible, a premise that is surely just as true of tomorrow as of yesterday. A classmate in my seminar thinks Leibniz is basically caught cheating here: if optimism about the actual course of events is supposed to ground a rationally required contentment with whatever happens, that same optimism should make effort toward the future either just as pointless, or just as fitting, as satisfaction with the past, and "the presumptive will of God" looks like a device smuggled in only to keep the system from collapsing into fatalism. Is there a principled Leibnizian answer to this — something that actually falls out of his broader metaphysics (his distinction between certainty and necessity, between God's antecedent and consequent will, or between our epistemic position and God's) — or is my classmate right that the past/future asymmetry here is doing more rhetorical work than argumentative work? I'd appreciate a reconstruction of the strongest version of Leibniz's position, along with your own verdict on whether it actually holds up.
