answer: |-
  The cable snapped three minutes ago. Now the car was just a stone falling through the cloud layer, and the G-force was already pressing the breath out of Kael's lungs.

  There was one chute. It was designed for a single occupant.

  Vess sat opposite him, strapped into the crumbling wall of the cabin. Her eyes were wide, fixed on the red countdown timer above the airlock. Ten seconds to deployment. Nine.

  Between them hummed the Sympathy Protocol. It was a neural shunt, standard issue for all deep-orbit pairs. The corporate handbook said it was a *Mask*. It suppressed panic, suppressed selfishness, suppressed the instinct to shove your partner out of the way. It didn't change who you were; it just put a heavy blanket over the parts of you that would get people killed.

  But the rumors in the mess halls said it was a *Fink*.

  Kael watched Vess's hand. It was trembling, hovering near the manual release for his restraints. If she hit it, his harness would drop. He would slide toward the airlock. She could lock it behind him. He would live. She would die.

  If the Protocol was a Mask, Vess was currently loyal. She wanted to save him. The Protocol was just keeping her from making a mistake in the chaos, or perhaps keeping her from sacrificing herself too early. If Kael cut the shunt now, the blanket would lift. She would still be loyal. She would push him out.

  If the Protocol was a Fink, Vess was currently selfish. She wanted to live. But the Protocol detected the *condition* of the test—the imminent death of the partner—and it rewired her brain in real-time. It manufactured loyalty exactly when it was required. It made the wire live only when the hammer struck. If Kael cut the shunt, the magic would vanish. The disposition would evaporate. She would keep the chute.

  "Kael," Vess said. Her voice was calm, too calm. "The diagnostics say the shunt is fluctuating."

  "I know," he said. His own hand was on the cutoff switch for the neural link. It was a small black box on his wrist. "If I cut it, it's just us. No algorithms. No overrides."

  "If you cut it, we might not sync on the ejection. We could both die."

  "Or one of us will."

  The car shuddered. The clouds outside were grey bruises now. Four seconds.

  Kael looked at her. He loved her. Or he thought he did. But love, like fragility, is a disposition. It is defined by what you *would* do. *I love you* means *I would suffer for you.* But if the suffering is prevented by a machine, or if the love is created by the machine only when suffering is detected, does the statement hold truth?

  He needed to know. Not for the survival. For the memory. If he was going to die in the strata, he needed to know if the person holding his hand was real.

  "The handbook says it's a safety," Vess said. Her hand moved closer to his. Her fingers were warm. "It keeps us together."

  "The handbook lies," Kael said. "It says the glass is fragile because it breaks. But what if it only breaks because the hammer is magic?"

  "Kael, please." Three seconds.

  He looked at the cutoff switch. If he pressed it, he was performing the test. He was striking the glass.

  If she was truly loyal, cutting the link would change nothing. She would push him.
  If she was Finked, cutting the link would destroy the loyalty. She would hold him back.

  But there was a third terror. What if the act of testing her *was* the trigger that destroyed her? What if her loyalty was real, but fragile, and the doubt in his eyes was the hammer that shattered it?

  Two seconds.

  "Trust me," Vess whispered.

  "Trust is the conditional," Kael said. "I need the categorical."

  He slammed his thumb onto the cutoff switch.

  The hum died. The silence in the cabin was instant and deafening. The neural warmth vanished from his skull, leaving a cold, hollow ache. He was alone in his head again. He looked at Vess.

  Her expression didn't change. Her eyes were still wide, still fixed on him. But something in the micro-tension of her jaw had shifted. The artificial calm was gone. Now there was just raw, human fear.

  One second.

  She didn't reach for his release. She didn't reach for her own.

  She reached for *his* hand. She interlaced her fingers with his and squeezed. Hard.

  "Okay," she said.

  The airlock hissed. The single chute deployed. It wasn't enough for two. It was a coffin for one, a parachute for the other.

  Vess stood up. She didn't push him. She didn't pull him. She simply stepped into the chute's harness, then grabbed Kael's collar and pulled him in with her.

  "There's no room," Kael said. "It'll tear."

  "Then it tears," she said.

  She triggered the ejection.

  The blast slammed them both upward, out of the falling car, into the screaming wind. The chute was overloaded. It spun wildly. Kael felt the straps biting into his ribs, felt the G-force tearing at his shoulders. He looked at Vess. She was screaming, not in pain, but in effort, holding the release pin down with both hands, forcing the canopy to stay open against the shear.

  If she let go, the chute would stabilize. One of them might live. Probably her.
  If she held on, the canopy would rip. They would both fall.

  She held on.

  Kael realized then that he had asked the wrong question. He had wanted to know if she had the disposition of loyalty *before* the test. He wanted to know if the wire was live before he touched it.

  But as the canopy began to shred, sending them into a final, spinning dive, he understood the philosophy of the fall.

  The wire isn't live until it touches. The glass isn't fragile until it hits the floor. The love isn't real until it costs you something.

  The shunt hadn't been masking her selfishness. It hadn't been Finking her loyalty. It had just been noise.

  Vess looked at him as the ground rushed up to meet them. She wasn't calm anymore. She was terrified. She was selfish. She wanted to live. Every instinct in her biology was screaming at her to let go of the pin, to stabilize the chute, to save herself.

  And yet, she didn't let go.

  The disposition wasn't a state of being. It was the act itself.

  "Kael," she said, over the roar of the wind.

  "I know," he said.

  The canopy ripped.

  ***

  **Post-Flight Analysis Log: Recovery Team 4**
  **Status:** Both subjects deceased on impact.
  **Neural Shunt Data:** Corrupted.
  **Note:** Telemetry indicates the shunt was disconnected T-minus 1 second prior to ejection. Manual override suggests subject Vess had full motor control. Subject Vess chose a dual-occupancy trajectory with 0% survival probability.
  **Conclusion:** Dispositional attribute confirmed. Not masked. Not Finked.
  **Recommendation:** Cancel the Sympathy Protocol. It is redundant.
