  **MEMORANDUM**

  **TO:** Graduate Admissions Committee
  **FROM:** [Your Name], PhD Candidate
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Admissions Reading Protocol

  ### Executive Summary

  After reviewing the proposal to shift to a five-reader majority vote system, I recommend we **retain the current two-reader system**, but with a modified protocol for handling disagreements. While the proposal to adopt a Condorcet Jury Theorem (CJT) framework is theoretically elegant, it relies on assumptions about independence, competence, and ontological truth that do not hold in the context of doctoral admissions. 

  The current system's requirement for deliberation on split files is not a bug; it is a feature that captures information about "fit" that aggregation obscures. However, to address concerns about individual bias, I propose we formalize the deliberation phase rather than expanding the reading pool.

  ### The Proposal: A Formal Theory Perspective

  The argument for five readers rests on the Condorcet Jury Theorem. The logic is compelling: if every committee member has a probability $p > 0.5$ of correctly identifying a successful candidate, and if their judgments are independent, then the probability of the majority being correct approaches 1 as the number of voters increases. 

  Steelmanning this position: Our current two-reader unanimity rule is fragile. It grants veto power to individual idiosyncrasies and creates high false-negative rates (rejecting great candidates because one reader had a bad day). The five-reader model promises to smooth out noise, dilute individual bias, and offer a more statistically robust defense of our decisions should they be questioned. If admissions were a measurement task akin to grading multiple-choice exams, this would be the unequivocally superior system.

  ### The Skeptical Objection: Independence, Competence, and Ontology

  However, the pushback from the committee ("the skeptics") raises three fundamental objections that dismantle the applicability of CJT here. To adopt the five-reader plan, we must be prepared to refute the strongest version of these claims, not just note them as logistical hurdles.

  **1. The Independence Assumption (Correlated Error)**
  CJT requires voter independence. The skeptics argue our readers are not independent; we are socialized in the same department, trained in similar methods, and often discuss candidates before formal meetings. 
  *The Strong Version:* It is not just that we talk; it is that we share a *prior*. In comparative politics, a candidate's theoretical framework often signals "quality" before we read the writing sample. If five readers share the same theoretical bias, we do not get five independent signals; we get one signal amplified by five. Increasing the number of readers increases the *confidence* of the error, not the accuracy of the judgment. In a correlated error environment, adding readers yields diminishing returns that plateau well before $N=5$.

  **2. The Competence Assumption ($p > 0.5$)**
  CJT requires that each voter is more likely to be right than wrong. 
  *The Strong Version:* We have no ground truth to verify $p$. We admit students, but we never observe the counterfactual: how the rejected applicants would have performed. Without a feedback loop, we cannot calibrate our competence. If our collective $p$ is actually $< 0.5$ for certain demographics or subfields (due to structural bias in the discipline), the Jury Theorem guarantees we will converge confidently on the *wrong* decision. More readers simply automate our blind spots more efficiently.

  **3. The Ontological Objection (Truth vs. Construction)**
  CJT assumes a binary truth value (Success/Failure) waiting to be detected.
  *The Strong Version:* "Success" in a PhD program is not a pre-existing fact like the weight of an object; it is a relational outcome constructed between the student and the environment. A candidate isn't "good" in the abstract; they are "good for *this* department, with *these* advisors, in *this* climate." A majority vote treats admission as a detection task (finding the "best" apples) rather than a construction task (building a cohort). Aggregation cannot capture the nuance of fit; only deliberation can.

  ### Recommendation: Structured Deliberation over Aggregation

  Given these objections, moving to five readers would incur a 150% increase in labor for a marginal gain in accuracy, while potentially calcifying our shared biases. However, the Formal Theory proponents are correct that the current unanimity rule creates excessive false negatives. 

  I propose the following modification:

  1.  **Retain Two Readers:** This preserves the depth of reading required to assess research potential.
  2.  **Replace Unanimity with Structured Deliberation:** If readers disagree (one Top-Tier, one Reject/Waitlist), the file does not go to a vote. It triggers a mandatory 15-minute discussion between the two readers *before* the full committee meeting.
  3.  **Third-Reader Tie-Break:** If the two readers cannot reach consensus after discussion, a third reader is assigned *blind* (they do not know it is a tie-break file).

  ### Justification

  This approach accepts the Skeptics' ontological critique while addressing the Formal Theorists' concern about bias. 

  By forcing deliberation, we treat disagreement as **information**, not noise. When Reader A loves a candidate and Reader B rejects them, the source of that divergence often reveals critical details about the candidate's fit (e.g., "The methodology is innovative but risky" vs. "The methodology is unsound"). A majority vote silences this tension; deliberation exploits it.

  Furthermore, the blind third-reader option introduces a degree of *functional independence* without requiring five full reads. It reserves resources for the files where our shared priors are most likely to be in conflict.

  ### Conclusion

  We should not model our admissions process on a theorem designed for independent jurors deciding on objective facts. We are a department constructing a cohort under conditions of uncertainty. The goal is not to minimize statistical error, but to maximize the defensibility and depth of our judgment. Keep the two-reader system, but mandate that we do the hard work of talking to each other when we disagree.
