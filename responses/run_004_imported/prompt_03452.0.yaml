      *   **Analysis:** Pascal is describing a political *necessity* born of human weakness, not a moral *good*. He is explaining *why* societies function the way they do, not necessarily endorsing the morality of it. It's a description of the "Kingdom of Darkness" or the earthly city, contrasted with the Kingdom of God.
      *   **The "Trick":** Pascal often uses skepticism to clear the ground. He shows reason fails (Fragment A). Then he shows political order is a necessary fiction (Fragment B). Why? To show we need a higher authority (God/Grace) to fix this mess.

  6.  **Synthesize the Resolution:**
      *   **No Contradiction:** Both fragments describe the *fallen human condition*.
      *   **Fragment A:** Shows that human *reason* cannot find universal justice.
