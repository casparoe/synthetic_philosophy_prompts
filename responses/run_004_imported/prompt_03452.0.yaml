      *   **The Point:** Both point to the insufficiency of worldly systems. If Pascal were a cynic, he'd stop at B. But he's a Christian apologist. He's setting up the need for Redemption.
      *   **Nuance on Fragment B:** It's not that he *approves* of making might right. It's that he recognizes it as an unavoidable mechanism in a sinful world to prevent total chaos. It's a "necessary lie" or a "useful fiction" to keep peace, but it's not *True* Justice.

