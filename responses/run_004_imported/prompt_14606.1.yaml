      *   *Paragraph 3 (Conclusion/Implications):*
          *   "Where this leaves us though is actually pretty bleak..." -> This is a *nihilistic* reading of Strawson.
          *   "...nobody is ever truly responsible for anything in the deepest sense..." -> Strawson explicitly argues *against* the need for "true responsibility in the deepest sense" (ultimate responsibility). He thinks the demand for that is incoherent.
