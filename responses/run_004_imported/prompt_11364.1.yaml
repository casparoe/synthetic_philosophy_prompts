      *   **Conflict:** Jordan has also missed sessions without notice (hypocrisy). Jordan justifies this by claiming his expertise makes his presence less critical.
      *   **The Debate:**
          *   Friend 1: Hypocrisy invalidates the right to criticize (Tu Quoque).
          *   Friend 2: The criticism stands on its own merit regardless of the critic's behavior (Objective Truth).
      *   **The Core Question:** Does hypocrisy undermine the *fairness/validity* of the criticism, or does it only damage the *credibility/character* of the critic while leaving the truth untouched?
      *   **Goal:** The user wants to understand the *principle* at work, not just pick a side. They want philosophical/ethical clarity.

  2.  **Identify the Philosophical Concepts:**
      *   **Ad Hominem (Tu Quoque):** "You also." The fallacy of dismissing an argument because the speaker is inconsistent.
      *   **Moral Standing/Authority:** Does one need to be virtuous to enforce virtue?
      *   **Consequentialism vs. Deontology:** Is the value in the outcome (team cohesion) or the rule (honesty/communication)?
      *   **Leadership Ethics:** Role-based responsibilities. A captain has different obligations than a member.
      *   **Epistemic Validity:** Is the statement "missing sessions without notice is bad" true independently of who says it?

  3.  **Evaluate Friend 1's Position (Hypocrisy Invalidates Criticism):**
