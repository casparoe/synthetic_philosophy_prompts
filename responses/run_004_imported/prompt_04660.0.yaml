answer: |-
  The candlelight flickered across the silverware, catching the edge of Feselius's wine cup. He didn't drink. He set the cup down with a precise click that silenced the lute in the corner.

  "Let us be plain, Herr Kepler," Feselius said, his voice carrying the dry authority of the clinic. "You admit the twelve signs are arbitrary fictions. Aries is no more a ram than a cloud is a dragon. You admit the Houses are mere accounting, slices of shadow cast by the horizon. You admit that calling Mars 'malefic' is poetic superstition. So tell me: when you strip the carcass of these dead parts, what flesh remains on the bone? Why is the angle between two lights any less a human invention than the constellation they sit within?"

  Kepler leaned forward, his fingers tracing a spill of wine on the tablecloth as if drawing an orb. He looked tired, the weight of the Imperial unpaid wages visible in the slump of his shoulders, but his eyes sharpened.

  "Because the constellation is a picture, Doctor, but the angle is a fact," Kepler said softly. "Draw a circle in the dust. Mark the Earth at the center. When two planets stand such that their rays meet here at a specific proportion—a third, a quarter, a half of that circle—they create a geometry. Geometry is not a human invention. It is the language God used to build the world. Look at the snowflake. Look at the honeycomb. The hexagon exists in nature without man to name it."

  Feselius leaned back, steepling his fingers. "A pretty metaphor. But you are a mathematician, not a poet. A triangle in the sky is not a triangle in the mud. It is an optical projection. If I stand here, the pillars of this room form an angle. If I move, the angle changes. The angle exists only because *you* are standing at the vertex. Why should the Earth care about the shape of a triangle drawn from its own surface?"

  "Because the Earth is not dead matter," Kepler countered, his voice gaining heat. "It has a soul. *Anima terrae.* Just as you have a soul that responds to music. Why does a consonance—a fifth, an octave—please the ear and a dissonance grate it? There is no physical weight in a sound wave that demands pleasure. It is the geometry of the vibration that the soul recognizes. The aspects are the music of the spheres, Doctor. When the rays of Saturn and Mars meet at a square, they strike the Earth's soul like a hammer on a bell. The weather shifts. The humors shift. Not because Mars is angry, but because the geometry is tense."

  Feselius shook his head, a small, pitying smile touching his lips. "So you replace the superstition of demons with the superstition of a sentient globe. You say the Earth 'feels' the geometry. I say I have dissected three hundred bodies and never found a place where starlight writes upon the humors. If this influence is physical, like heat or light, measure it. Does the light of a trine shine brighter than a sextile? No. It is identical light. So you are arguing for a hidden quality, an occult virtue. And that, Herr Kepler, is the very definition of the magic you claim to despise."

  Kepler sat back, exhaling slowly. He knew the trap. He had walked this labyrinth himself for twenty years.

  "I cannot measure the soul of the Earth with a compass," Kepler admitted. "Nor can you measure the life force in your patient with a lancet. You see the flesh; I see the architecture. I grant you, most astrology is garbage—merchants selling certainty to frightened princes. I throw that in the fire myself. But to say there is *no* harmony because the merchants lie? That is like saying there is no arithmetic because a tax collector is a thief."

  "I do not deny harmony," Feselius said, finally lifting his wine. "I deny causality. You ask me to believe that the arrangement of distant fires dictates the price of grain in Prague because the Earth 'feels' a triangle. It is a beautiful system, Johannes. I will grant you that. It is coherent. But coherence is not truth. You have saved the baby, yes. But I fear you have kept it in a bathwater that is still far too deep."

  Kepler looked at the wine stain, the geometric shape of it drying on the wood. "Then we shall wait for the next comet," Kepler said quietly. "And see if the geometry holds."

  "And if it does not?"

  "Then I will learn to draw better circles."

  Feselius nodded, a silent acknowledgment of the wager, and drank.
