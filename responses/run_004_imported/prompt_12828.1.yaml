answer: |-
  **Setting:** *Cambridge, Massachusetts, late autumn 1907. The study of William James. The room is warm, cluttered with books and papers. Outside, the Charles River is gray and choppy. C.S. Peirce sits in a leather armchair, looking frailer than his sixty-eight years, his hands trembling slightly as he holds a pipe he isn't lighting. William James paces near the fireplace, energetic, sleeves rolled up.*

  **James:** You look cold, Charles. Let me stoke this up.

  **Peirce:** The fire is adequate, William. It is the atmosphere that chills. I have been reading your lectures. *Pragmatism*.

  **James:** (Smiling, though cautiously) And? The public seems to think I've finally given them a philosophy they can use without a dictionary.

  **Peirce:** The public is notorious for preferring candy to meat. But we are not the public. We are the authors of this… movement. Though I notice you have kept the name.

  **James:** It is a good name. It sticks.

  **Peirce:** It is a name I coined in the sixties, in the Metaphysical Club, to describe a method for clarifying ideas. A logical maxim. You have turned it into a theory of truth. And in doing so, you have made it subjective. You have made truth a matter of personal solvency. "Cash-value."

  **James:** (Stops pacing, leans against the mantel) It is a metaphor, Charles. A way to drag abstractions down to earth. When a man believes something, he wants to know: what difference does it make? If two beliefs lead to the exact same conduct, the same sensory expectations, where is the "truth" between them? It's a distinction without a difference.

  **Peirce:** But "difference in conduct" is not the same as "expediency." You write that truth is what is "expedient in the way of thinking." William, a lie can be expedient. A comforting delusion can guide a man through his life without collision. If a paranoid man believes his neighbors are plotting against him, and this belief makes him lock his doors and stay alert, and thus he remains safe… has his belief become *true*?

  **James:** It has become true *for him*, insofar as it successfully pilots him through the stream of experience. But you are assuming the "lie" is a lie because *you* know the neighbors are innocent.

  **Peirce:** Precisely! There is a fact of the matter. The neighbors *are* innocent. The reality stands there, stubborn, independent of his thinking or yours or mine. Your definition risks collapsing truth into satisfaction. It makes truth a property of the belief, rather than a relation between the belief and an external permanence.

  **James:** (Waves a hand) External permanence! There it is. The Scholastic Realist peeking out from behind the pragmatist curtain. You want a Truth with a capital T, sitting on a throne, waiting for us to converge upon it. But where is this throne?

  **Peirce:** It is in the nature of inquiry. Inquiry is not a solitary game. It is a community stretching across time. Truth is the opinion fated to be agreed upon by all who investigate, in the ideal limit.

  **James:** (Laughs softly) "Fated." "Ideal limit." Charles, listen to yourself. That is not logic; that is theology. It is a regulative fiction. You have replaced the Christian Heaven with the End of Inquiry. It gives the living believer nothing. I am a man standing in the mud, trying to decide whether to believe in free will or determinism. Your "final opinion" is at the end of infinity. It offers me no guidance for the choice I must make *today*.

  **Peirce:** It offers you the discipline of humility. It reminds you that your current satisfaction is not the measure of the universe. If you define truth as what works *now*, you cut off the possibility that you are wrong. You seal yourself in your own skin.

  **James:** And if you define truth as what happens when we are all dead and inquiry has ceased, you make truth irrelevant to life! Truth *happens* to an idea. It becomes true, is made true by events. It is a process of verification. When I say "cash-value," I mean the sensory receipts, the logical connections. If my belief leads me to a sensory experience that clashes with expectation, it is false. I am not ignoring reality, Charles. I am insisting that reality is only known *in* the experience of it.

  **Peirce:** But experience is not just your experience. It is not just human experience. There is Secondness—brute facticity. The stone is hard whether you kick it or I kick it. Your pragmatism, as you present it, smells of Nominalism. It suggests that generals, laws, habits… they are just names we give to similarities.

  **James:** They are tools we use to navigate.

  **Peirce:** They are *real*. Laws of nature are real generals. They govern the future. If you reduce truth to human utility, you lose the reality of the law itself. You make the universe plastic to human needs.

  **James:** (Steps closer, voice intensifying) I make the universe *pluralistic*. Not a block universe, not a monolithic Absolute waiting for us to discover it. The world is still in the making. It is ambiguous. In places, it waits for our contribution. If believing in my own freedom gives me the moral strength to act rightly, and that action changes the world… in what sense was that belief "false" because it didn't match some pre-existing script? You want a world that is finished. I live in a world that is growing.

  **Peirce:** A world that grows is fine. But it grows according to tendencies, to habits of nature. If you ignore the independence of those habits, you invite disaster. You speak of "working." But working for whom? For the individual? For the class? For the species? You leave the standard vague. My standard is precise: the community of inquirers, unlimited by time, bound by the method of science.

  **James:** And I say that "community of inquirers" is a phantom. There is no single method of science that covers the moral, religious, and personal dimensions of life. You are trying to apply the logic of the laboratory to the logic of the soul. When a man faces a "genuine option"—living, forced, momentous—and cannot decide on intellectual grounds, he has the right to believe at his own risk. Your "fated opinion" denies the right to believe. It demands we wait for evidence that may never come.

  **Peirce:** It demands we wait for *truth*.

  **James:** It demands we wait for *certainty*. And in waiting, we let the fruit rot.

  **Peirce:** (Leans forward, gripping the arms of the chair) You accuse me of theology. But look at your "expedience." Is it not a theology of the Self? You make man the measure of all things. I am trying to save realism. I call my view "Pragmaticism" now—a name ugly enough to be safe from kidnappers like you and Schiller. Because I must distinguish my logical maxim from your theory of truth.

  **James:** (Sighs, sits on the edge of his desk) "Pragmaticism." Yes. You told me. You said it was ugly. I think it is precise. But Charles, precision without vitality is a corpse. You want to save the objectivity of truth, but you risk making it so distant it ceases to function as truth for a finite creature. I want to save the function of truth, even if I must loosen the grip on its absolute objectivity.

  **Peirce:** If you loosen that grip, it slips away entirely.

  **James:** Or it becomes something we can actually hold.

  *(A silence settles between them. The fire crackles. Peirce looks at his hands; James looks at the fire.)*

  **Peirce:** We are at an impasse, William. You see my "final opinion" as a theological retreat. I see your "cash-value" as a psychological capitulation.

  **James:** Perhaps. Though I suspect we are both trying to kill the same dragon: the idea that truth is a static copy of reality, inert and dead.

  **Peirce:** Agreed. Truth is living. But it lives in the growth of concrete reasonableness, not in the satisfaction of the individual will.

  **James:** And I say reasonableness is nothing if it does not serve the will to live.

  **Peirce:** (Nods slowly) Then we shall have to let the future decide. Since, apparently, that is the only authority we both respect, however differently we conceive it.

  **James:** (Smiles, sadly) The ideal limit, or the stream of experience?

  **Peirce:** Precisely.

  **James:** Well. The tea is cold, but I believe there is a fresh pot in the kitchen. Will you join me? It works well enough to warm the bones.

  **Peirce:** (A faint, dry smile) In that specific sense, William, I suppose it is true.

  *(Peirce rises slowly. James moves to help him, then thinks better of it, letting Peirce find his own balance. They exit the study together, the argument unresolved, the friendship intact.)*

  **[END]**
