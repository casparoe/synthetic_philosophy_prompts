prompt: |-
  for my social ontology seminar we've been comparing bratman's reductive account of shared intention to gilbert's plural subject theory and searle's stuff on we-intentions, and honestly i can't decide who actually wins this. bratman wants shared intention to just be a structure of interlocking i-intentions (i intend that we J, you intend that we J) plus common knowledge and meshing sub-plans, no extra ontology needed. gilbert says that misses the normativity - once we've jointly committed to doing something, we're each entitled to expect the other to follow through and can rebuke them if they dont, and that obligation doesnt seem to fall out of a pile of individual intentions. searle meanwhile just insists that we-intentions are a primitive "we mode" that cant be paraphrased into i-intend-that-we-type language at all.

  can you write me an essay that actually takes a side? use the classic case of two people carrying a sofa/walking together, plus a case with zero prior discussion (like two strangers who spontaneously start pushing a stalled car), to test whether bratman's machinery can generate gilbert's obligations or whether you need something more primitive like searle's we-intentions. dont just land on "they're all sort of right" - i want a real verdict defended against the strongest objections, even if it ends up qualified.
