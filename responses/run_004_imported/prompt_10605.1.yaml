answer: |-
  **Title:** The Normative Glue: Why Gilbert's Plural Subject Theory Wins the Social Ontology Debate

  **Introduction**

  The question of shared intention is the cornerstone of social ontology. When we say "we intend to J," what metaphysical and psychological architecture supports that claim? The contemporary debate is dominated by three heavyweights: Michael Bratman, who offers a reductive planning theory; John Searle, who posits a primitive biological "we-mode"; and Margaret Gilbert, who argues for a normative plural subject. Bratman provides the most detailed mechanics of coordination, and Searle captures the phenomenology of togetherness, but both ultimately fail to account for the distinctive deontic structure of shared agency. While Bratman's interlocking intentions explain how we coordinate and Searle's primitivism names the phenomenon, only Margaret Gilbert's Plural Subject Theory successfully explains *why* we are bound to one another. By examining the standard case of carrying a sofa alongside the stress-test of spontaneously pushing a stalled car, this essay argues that Gilbert wins the debate. Shared intention is not merely a alignment of individual psychologies (Bratman) nor a brute biological fact (Searle); it is the creation of a new normative entity wherein participants incur obligations to one another. Without this normative glue, we do not have shared intention; we merely have coincidental cooperation.

  **Bratman's Reduction and the Sofa Case**

  Michael Bratman's account is the gold standard for parsimony. He seeks to demystify "we-intentions" without inflating our ontology. For Bratman, "we intend to J" is nothing over and above a structure of interlocking "I-intentions." In the classic case of two people carrying a sofa, Bratman analyzes the situation as follows: I intend that we carry the sofa; you intend that we carry the sofa; these intentions are common knowledge between us; and crucially, our sub-plans mesh (I lift the left, you lift the right, and neither plan undermines the other).

  This works beautifully for predicting behavior. It explains why I adjust my pace when you slow down. However, Bratman's account hits a wall when we introduce the normative dimension of social interaction. Suppose we are halfway down the hallway, and I suddenly drop my end of the sofa and walk away. On Bratman's account, I have certainly been irrational. I had an intention (that we carry the sofa), and I acted against it. I have also frustrated your intention, since your intention was conditional on mine.

  But Gilbert asks a sharper question: Do you have a *right* to rebuke me? If we are truly sharing an intention, my abandonment isn't just a frustration of your plans; it is a violation of a commitment *to you*. In Bratman's reductive framework, I owe it to myself to be consistent, and I might owe you a moral apology for being unhelpful, but I have not violated a specific obligation generated by the shared intention itself. Bratman reduces the social bond to a web of individual rationalities. He explains the *coordination*, but he cannot explain the *entitlement*. If shared intention is genuinely social, it must generate duties that do not exist in solitary intention. Bratman's account fails this test.

  **Searle's Primitivism and the Biological Dead End**

  John Searle avoids Bratman's reductionism by swinging the pendulum to the other extreme. Searle argues that "we-intentions" are primitive states in the individual mind. Just as I can have an "I-intention" to raise my arm, I can have a "we-intention" to carry a sofa, and this cannot be paraphrased into "I-intend-that-we-do" without loss of meaning. For Searle, this is a biological capacity, likely rooted in neurobiology.

  Searle gets the phenomenology right. When we carry the sofa, it does not feel like I am simulating your mind and aligning my plans; it feels like we are doing it together. However, Searle's account is ontologically thin regarding normativity. By locating the "we" entirely inside the individual head as a brute fact of biology, Searle creates a black box. He asserts that we-intentions have a "sense of doing something together," but he offers no mechanism for why this sense generates obligations.

  If the we-intention is just a biological primitive, why does dropping the sofa constitute a betrayal rather than just a biological shift in state? Searle identifies the *experience* of shared agency but fails to explain its *structure*. He tells us that we-intentions exist, but he doesn't tell us what they *do*. In a seminar on social ontology, appealing to a brute biological fact is less an explanation and more a conversation stopper. It leaves the normative gap just as wide as Bratman's.

  **The Stress Test: The Spontaneous Car Case**

  The decisive battleground between these theories is the case of zero prior discussion. Imagine two strangers at a red light see a car stall in the intersection. Without speaking, they both exit their vehicles and begin pushing the car to the curb.

  Bratman handles this case with ease. I see you pushing; I form the intention that we push; I see you see me pushing; common knowledge is established instantly. Our sub-plans mesh (we push from the back). Bratman's machinery hums along.

  Gilbert, conversely, faces a challenge. Her theory relies on "joint commitment," which sounds like a contract. Did these strangers sign a contract? Gilbert's defense, however, is robust. She argues that joint commitment does not require explicit verbal agreement. It requires only that each party expresses readiness to enter the commitment in conditions of common knowledge. In the car case, the act of moving toward the car and placing hands on the trunk is the expression of readiness. By engaging in the action, we signal to each other, "I am ready to do this as part of a 'we'."

  Here is why Gilbert wins this specific case: Consider what happens if one stranger stops pushing halfway to the curb, not out of exhaustion, but out of spite. The other stranger is not merely surprised (Bratman); they feel *wronged*. They might shout, "Hey! Why did you stop?" This rebuke is intelligible only if there was a mutual obligation.

  If Bratman were right, the rebuke would be nonsensical. The rebuker would be saying, "You violated the consistency of your own intention!" But that's not what happens. The rebuke is, "You left *me* hanging." This implies that the intention belonged to *us*, not just to me and you separately. Searle would say the stranger simply lost his primitive we-intention, but that doesn't explain why the other stranger feels entitled to demand an explanation. Only Gilbert's joint commitment explains why the spontaneity of the action does not negate the normativity of the bond. The commitment is formed in the doing, not before it.

  **Defending Gilbert Against the "Over-Intellectualization" Objection**

  The strongest objection to Gilbert is that she over-intellectualizes social life. Do I really form a "joint commitment" every time I walk in step with a crowd or dance at a club? It seems too heavy, too legalistic. If Gilbert wins, does every casual interaction become a binding contract?

  This objection misunderstands the scope of Gilbert's claim. She is not analyzing mere behavioral synchronization (walking in step); she is analyzing *shared intention*. There is a difference between walking near you and walking *with* you. In the car case, the stakes are higher, and the intention is explicit. But even in lower-stakes cases, if I am walking *with* you, I cannot simply veer off without a word. If I do, you will look for me. If I don't return, you will feel I abandoned you.

  Gilbert's theory is superior precisely because it distinguishes between "I intend to do my part while you do yours" (Bratman) and "We are committed to doing this" (Gilbert). The objection that this is too heavy is actually an argument *for* Gilbert. Shared intention *is* a heavy ontological lift. It creates a new subject—the "plural subject"—that constrains individual freedom. If a theory of shared intention doesn't feel like it imposes a constraint, it isn't describing shared intention; it's describing parallel play. Bratman's account is popular because it is comfortable for methodological individualists, but it comforts us by removing the very thing that makes social action social: the mutual obligation.

  **The Verdict**

  So, who wins? Searle is the runner-up. He correctly identifies that the "we" cannot be fully eliminated, but by making it a biological primitive, he renders it philosophically inert. It explains nothing about the normative relations between agents.

  Bratman loses because his reductionism is too successful. He explains how individuals coordinate, but he explains away the social bond. In his world, obligations to others in shared action are always derivative of individual morality or prudence, never constitutive of the action itself. He cannot account for the specific right to rebuke that defines our experience of letting a partner down.

  **Margaret Gilbert takes the prize.** Her Plural Subject Theory is the only account that treats the "we" as ontologically significant without resorting to mysticism. She demonstrates that shared intention creates a new deontic reality. In the sofa case, she explains the right to rebuke. In the car case, she explains how spontaneity can generate binding obligations through mutual expression of readiness.

  To accept Gilbert is to accept that when we share an intention, we are no longer just two individuals acting in proximity. We have created a singular agency with its own normative force. This is a heavier ontology than Bratman's, but it is the price of admission for a truly social ontology. If we want to explain why we feel bound to each other when we act together, we cannot rely on interlocking "I's." We must acknowledge the "We." Gilbert is the only one who takes that "We" seriously enough to give it teeth.
