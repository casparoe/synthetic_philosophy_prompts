      *   **Key Tests:** Use the "carrying a sofa/walking together" case and a "spontaneous car pushing" case (zero prior discussion).
      *   **Core Question:** Can Bratman's interlocking I-intentions generate Gilbert's normativity, or do we need Searle's primitive We-mode?
      *   **Tone:** Academic but engaging (seminar paper style), decisive, defended against objections.

  2.  **Evaluate the Contenders:**
      *   *Bratman:* Strong on agency and coordination. Weak on normativity (obligation to others). His "meshing sub-plans" and "common knowledge" explain *how* we coordinate, but not *why* I owe it to you to keep going.
      *   *Gilbert:* Strong on normativity (joint commitment creates obligations). Weak on spontaneity (does a joint commitment really happen without explicit agreement?). Can feel too legalistic.
      *   *Searle:* Strong on phenomenology (it *feels* like a "we"). Weak on mechanism (it's a brute fact of biology/neurology). Doesn't explain the *normative force* as well as Gilbert.

  3.  **Determine the Verdict:**
      *   *Option A (Bratman):* Hard to defend against the normativity objection. Gilbert's rebuke case is strong.
      *   *Option B (Searle):* Hard to defend against the "mystical" objection. It stops inquiry too early.
      *   *Option C (Gilbert):* Strongest on the specific criterion of *obligation*, which is the crux of the user's prompt ("Gilbert says that misses the normativity"). However, Gilbert struggles with the spontaneous car case.
      *   *Option D (Synthesis with a Lean):* The prompt asks to *take a side*. A pure synthesis is a cop-out. I need to argue that one framework is the *best foundation*, even if it needs tweaking.
      *   *Decision:* I will argue for **Gilbert**, but with a specific modification regarding spontaneity. Why? Because the defining feature of *shared* intention (vs. parallel individual intention) is the mutual obligation. Bratman describes parallel intention that happens to align. Searle describes a psychological state but lacks the deontic structure. Gilbert captures the *social* in social ontology. I need to show how Gilbert can handle the spontaneous car case better than Bratman can handle the obligation case.

      *Wait, let's reconsider.* Bratman is the standard "reductive" view. Gilbert is the "normative" view. Searle is the "primitive" view.
      If I argue for Gilbert, I have to explain how a "joint commitment" arises in the car case without explicit talk. Gilbert actually addresses this (conditional readiness).
      If I argue for Bratman, I have to explain where the obligation comes from (maybe moral principles rather than constitutive rules?). This is harder.
      If I argue for Searle, I have to defend biological primitivism.
      *Best Argumentative Path:* Gilbert wins on the *ontology* of the social group, even if Bratman wins on the *psychology* of the individual. But the prompt asks about *shared intention*. The core of shared intention is the "togetherness." Gilbert defines "togetherness" as mutual obligation. Bratman defines it as coordination.
      *Verdict:* **Gilbert is the winner.** The normativity is the dealbreaker. Without obligation, it's just coincidental cooperation, not shared agency. I will argue that Bratman's account is sufficient for *coordinated action* but fails as an account of *shared intention* proper because it lacks the deontic glue. Searle identifies the phenomenon but fails to explain it. Gilbert explains the glue.

  4.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy. "The Normative Glue," "Beyond Interlocking Intentions."
      *   **Introduction:** Set the stage. The three contenders. The core tension (reductionism vs. normativity vs. primitivism). State the thesis: Gilbert's Plural Subject Theory provides the most robust account because only it captures the distinctive deontic structure of shared agency, which Bratman reduces away and Searle mystifies.
      *   **Bratman's Account (The Setup):** Explain the "I intend that we J" + meshing subplans + common knowledge. Use the Sofa case. Show where it works (coordination) and where it fails (the right to rebuke).
      *   **The Normativity Objection (Gilbert's Strike):** The "Walking Together" case. If I just stop, Bratman says I'm irrational relative to my plan. Gilbert says I violate *you*. The obligation is *to the other*, not just to consistency.
      *   **The Spontaneity Challenge (The Car Case):** This is the hardest part for Gilbert. How do strangers form a joint commitment? I need to use Gilbert's concept of "openness" and "conditional commitment." Bratman handles this easily (I see you pushing, I form an intention). I need to argue Bratman's ease here is superficial—it describes *helping*, not *sharing*.
      *   **Searle's Primitive We (The Alternative):** Acknowledge Searle. He gets the phenomenology right. But "brute biology" is a conversation stopper. It doesn't explain *why* the obligation exists.
      *   **Defense of Gilbert:** Address the main objection (that joint commitment is too heavy/contractual). Argue that implicit signaling is enough.
      *   **Conclusion:** Reiterate the verdict. Shared intention isn't just about doing the same thing; it's about being bound to each other.

  5.  **Refining the Argument (Self-Correction during drafting):**
