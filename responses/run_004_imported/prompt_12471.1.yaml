          *   *Cons:* Acausal threateners (simulators/AIs) are likely to have extreme inference capabilities. Hiding values from a perfect predictor is impossible. Also hinders cooperation with allies.
          *   *Verdict:* Low efficacy against the specific threat model (superior predictors).

      *   **5. Coordinating on Shared Norms:**
