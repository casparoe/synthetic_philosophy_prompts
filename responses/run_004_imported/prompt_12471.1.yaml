          *   *Cons:* Coordination is hard. Requires enforcement. Acausal coordination is even harder (need to know others are doing it). One defector ruins it.
          *   *Verdict:* Strong in theory (Nash equilibrium shifting), but high coordination cost. Often seen as complementary to precommitment.

      *   **6. Randomizing Responses:**
          *   *Concept:* Be unpredictable.
          *   *Pros:* Makes modeling harder.
          *   *Cons:* Acausal threateners rely on *logical* correlation, not just empirical prediction. If your randomization algorithm is known, they can still model the distribution. Also, randomizing might mean you pay sometimes anyway, keeping the incentive alive.
