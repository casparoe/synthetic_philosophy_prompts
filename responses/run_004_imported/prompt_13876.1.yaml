      *   (3) Sofia: The "fine-grained outcomes" defense is standard and valid within the vNM framework. **Sofia** wins on technical consistency.
      *   (4) Rahul: This is the killer point. It shows the theorem doesn't *settle* the normative debate; it just pushes it back. **Rahul** wins on philosophical depth.
      *   (5) Sofia: She concedes the normative point but holds the formal ground. It's a draw, but she's retreating. **Rahul** has the better of the *argument*, Sofia has the better of the *theorem*. I should nuance this.

  4.  **Identify What Both Overlook:**
      *   *Interpersonal Comparisons:* Harsanyi requires cardinal utility. Where do the weights come from? Both assume the weights are just "plug-ins," but determining weights is the hardest part of utilitarianism.
      *   *Uncertainty vs. Risk:* Harsanyi uses "ethical observer" behind a veil of ignorance (sometimes). Diamond talks about objective probabilities. There's a distinction between *risk* (known probs) and *uncertainty* (unknown probs).
