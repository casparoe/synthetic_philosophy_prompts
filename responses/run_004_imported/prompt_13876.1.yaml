      *   *Specific Overlook:* **The source of the weights.** Harsanyi's theorem gives $W = \sum a_i U_i$. It does *not* say $a_i$ must be equal (classical utilitarianism). It allows weighted utilitarianism. Sofia claims it settles it in favor of "utilitarianism" (implying equal weights or standard welfare max), but the theorem allows arbitrary weights. Rahul focuses on fairness of procedure, but ignores that the weights themselves are a source of unfairness.
      *   *Better Overlook:* **The distinction between ex ante and ex post.** Harsanyi is often interpreted as ex ante (expected utility). Diamond is ex post (realized outcomes). But there's a deeper issue: **Information and Invariance.** Both assume the utility functions are fixed and known. They overlook the *measurement problem*. Also, they overlook **Sen's critique of welfarism**. The debate assumes social choice *must* be based on utility aggregation. Sen argues we need to look at functionings/capabilities.
