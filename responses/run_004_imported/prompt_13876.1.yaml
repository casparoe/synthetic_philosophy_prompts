      *(Self-Correction during drafting)*: In Move 1, I need to be careful. Harsanyi's theorem *does* imply the social utility function is a linear combination. Sofia is mathematically right. But she equates "linear combination" with "utilitarianism" in the moral sense. I should note that distinction.
      In Move 4, Rahul's point is essentially that "welfarism" is being smuggled in via the outcome description.
