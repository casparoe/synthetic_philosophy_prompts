      *   *Key Distinction:* Epistemic indistinguishability vs. Ontological identity.

  4.  **Identify the Key Disjunctivist Moves:**
      *   **Epistemic vs. Ontological:** Indistinguishability is an *epistemic* notion (I can't tell them apart), not necessarily an *ontological* one (they don't have to be made of the same stuff).
      *   **The "Highest Common Factor" Fallacy:** Just because two things share a property (indistinguishability), it doesn't mean they share a *constituent* or a *genus*.
      *   **Explanation of Indistinguishability:** How does the disjunctivist explain *why* they are indistinguishable if they aren't the same state?
          *   *Option A:* The illusion is a failure to perceive, but it mimics the veridical case.
          *   *Option B:* Indistinguishability is defined negatively (I can't know which is which), not positively (they share a quale).
      *   **McDowell vs. Martin:**
          *   *McDowell:* Focuses on epistemic standing. In the good case, the fact itself is manifest. In the bad case, it merely seems so.
          *   *Martin:* Focuses on the nature of the experience. Hallucination has no positive nature in common with perception; it is defined by what it is *not* (not perceiving).

  5.  **Drafting the Response (Iterative Process):**

      *   *Acknowledge the intuition:* Validate that this is the *central* objection to disjunctivism. It's not just the user; this is the "screening off" problem.
      *   *Clarify the Disjunctivist Stance:* They accept indistinguishability but reinterpret what it means.
      *   *The Crucial Distinction:* Epistemic vs. Metaphysical.
          *   *Analogy:* A real diamond vs. a perfect fake. They look the same (indistinguishable to the layperson), but one is carbon crystal, the other is glass. They don't share a "common kind" of material constitution, even if they share an appearance.
          *   *Refinement:* The disjunctivist says the "appearance" isn't a mental object shared by both.
      *   *Martin's Negative Account:* This is the strongest technical answer. A hallucination is not a state with its own positive phenomenology that matches perception. It is a state that is *indistinguishable* from perception. The property is relational/negative, not intrinsic.
      *   *McDowell's Epistemic Account:* The good case provides justification the bad case doesn't. The indistinguishability doesn't level the epistemic playing field.
      *   *Addressing the "Cost":* Is it a cost? Yes, it's counter-intuitive. It requires giving up the idea that phenomenology is purely internal. But disjunctivists argue the cost of *accepting* CKA (skepticism, loss of direct contact with world) is higher.

  6.  **Refining the Explanation of "Indistinguishability":**
      *   This is the trickiest part. If I can't tell them apart, isn't there *something* in my mind that is the same?
