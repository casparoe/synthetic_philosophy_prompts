answer: |-
  You have put your finger on the exact nerve of the debate. This is not a misunderstanding on your part; it is the single most persistent and powerful objection to disjunctivism. In the literature, this is often framed as the challenge of explaining **how** two ontologically distinct states can be subjectively indistinguishable without positing a common factor.

  If you are prepping a lecture, it is crucial to clarify that disjunctivists do *not* deny the indistinguishability. They deny the **inference** from indistinguishability to a common ontological kind.

  Here is the breakdown of the move you are looking for, how they explain indistinguishability without the Common Kind Assumption (CKA), and how to frame the "cost" for your students.

  ### 1. The Core Move: Epistemic vs. Ontological
  The disjunctivist blocks the argument by insisting that **indistinguishability is an epistemic notion, not an ontological one.**

  *   **The Argument from Illusion assumes:** If I cannot tell Case A (veridical) and Case B (illusion) apart from the inside, there must be a shared mental ingredient (a sense-datum, a quale, a representational content) that constitutes the "what it is like" for both. This is the **Highest Common Factor** conception.
  *   **The Disjunctivist Response:** "Indistinguishable" simply means that the subject cannot know, by reflection alone, which case they are in. It does **not** entail that the two cases share a fundamental mental nature.

  **The Analogy for your Lecture:**
  Consider a real diamond and a perfect cubic zirconia. To the naked eye (and even to a jeweler without tools), they are indistinguishable.
  *   **CKA View:** Because they look the same, they must share the property of "shininess" as an intrinsic, shared material constituent.
  *   **Disjunctivist View:** One is carbon crystal under pressure; the other is zirconium dioxide. They do not share a fundamental material kind. The fact that they look the same is a fact about the *observer's limitations*, not a fact about a shared *substance*.

  Disjunctivists argue that the Argument from Illusion conflates "looking the same to the subject" with "being the same kind of mental state."

  ### 2. How Do They Explain the Indistinguishability?
  This is the specific move you feel you might be missing. If there is no common mental state, *why* can't I tell them apart? Disjunctivists generally take one of two paths here (often associated with John McDowell and M.G.F. Martin).

  #### A. Martin's "Negative Account" of Hallucination
  M.G.F. Martin offers the most radical solution. He argues that we should not think of the hallucinatory experience as having a positive nature that *matches* the veridical one.
  *   **The Move:** A hallucination has **no positive phenomenal nature of its own.**
  *   **The Definition:** The only thing we can say about the mental nature of a hallucination is that it is a state that is *indistinguishable* from a veridical perception.
  *   **The Implication:** Indistinguishability is not explained by a shared property $X$. It is a primitive, relational fact. The hallucination is defined negatively: it is a state that is *not* a perception but cannot be told apart from one. Therefore, there is no "shared nature" to posit. The "feeling" of the veridical case is the world itself making itself manifest. The "feeling" of the illusion is merely the inability to rule out that the world is making itself manifest.

  #### B. McDowell's Epistemic Account
  McDowell focuses on justification. He argues that in the veridical case, the fact itself (e.g., *that there is a candle*) is made manifest to the subject. In the illusory case, it merely *seems* so.
  *   **The Move:** The indistinguishability does not imply that the subject has the same *evidence* in both cases.
  *   **The Implication:** In the good case, my evidence is the fact itself. In the bad case, I have no evidence, only the illusion of evidence. The fact that I can't tell them apart doesn't mean my epistemic standing is the same; it just means I am fallible. The "inner life" is not a veil that stands between me and the world in both cases; in the good case, the inner life *is* the openness to the world.

  ### 3. Is This Simply a "Cost"?
  You asked if this is a cost disjunctivists have to accept. The answer is **yes, but they argue it is a necessary cost to avoid a greater disaster.**

  **The Cost (The Counter-Intuition):**
  It requires accepting that introspection is not infallible regarding the *nature* of one's own mind. It feels intuitive that if two things feel exactly the same, they must be the same kind of mental thing. Disjunctivism asks us to swallow the idea that the "phenomenology" of the veridical case is constituted by the external object, while the "phenomenology" of the illusion is... something else entirely (or nothing positive at all). This violates the "Internalist Intuition" that mental states are determined solely by what is inside the head.

  **The Benefit (The Payoff):**
  Disjunctivists argue the cost of *accepting* the Common Kind Assumption is much higher:
  1.  **Skepticism:** If the veridical and illusory cases are the same fundamental kind, then your experience in the veridical case provides no better evidence for the external world than the illusory case does. This leads to skepticism.
  2.  **Loss of Direct Realism:** If CKA is true, we never directly perceive the world; we only perceive the "common kind" (sense-data/representations) which is caused by the world. Disjunctivism saves Direct Realism.

  ### 4. Summary for Your Lecture
  To address your nagging feeling directly in class, you can frame it like this:

  1.  **The Objection:** "If I can't tell them apart, isn't there *something* in my mind that is the same?"
  2.  **The Disjunctivist Reply:** "No. 'Indistinguishable' describes your **epistemic access**, not the **metaphysical constitution** of the experience."
  3.  **The Explanation:** In the veridical case, your experience is constituted by the object. In the illusory case, your experience is a state that *mimics* that relation without the object. The mimicry is perfect enough to fool you, but that doesn't mean the mimicry and the real thing share a fundamental genus.
  4.  **The Trade-off:** Disjunctivism sacrifices the intuition that "same feel = same mental state" to save the intuition that "perception puts us in direct contact with reality."

  ### Recommended Reading for Prep
  If you want to dig into the specific mechanism of the "negative account," look at:
  *   **M.G.F. Martin, "The Limits of Self-Awareness" (2004).** This is the definitive text on why hallucinations need no positive common nature.
  *   **John McDowell, "Criteria, Defeasibility, and Knowledge" (1982).** For the epistemic angle.

  You aren't missing a move; you are grappling with the price of admission for disjunctivism. The position is coherent, but it demands we radically rethink what we mean by "what an experience is like."
