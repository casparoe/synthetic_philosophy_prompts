answer: |-
  Good evening. For those who don't know me, I had the privilege of being [Bride] and [Groom]'s professor during their graduate studies. Usually, when a former advisor speaks at a wedding, the advice is generic: "Communicate," or "Never go to bed angry." But knowing this couple, particularly [Bride], who wrote her dissertation on Jean-Paul Sartre, I know that generic advice won't pass muster. [Bride] would spot a philosophical inconsistency from across the room, and I'd rather not start your marriage with a critique of my logic.

  So, I want to talk about vows. Specifically, a difficult idea from Sartre.

  Sartre argued that no past resolution—including a vow—can truly bind your future freedom. He used the illustration of a gambler who sincerely swears off gambling. He means it. But when he stands before the table the next day, he discovers that yesterday's resolve has no grip on today's choice. He feels a kind of anguish because he realizes he is not *made* to walk away; he must *choose* to walk away, all over again.

  Now, the comfortable thing to tell a newlywed couple is that the vow settles the matter. That because you said "I do" today, you are now bound, secured, and finished. That the work is done.

  But Sartre would call that "bad faith." It is a comforting lie to pretend that love is a contract that executes itself. If your vow acted like a chain, forcing you to stay regardless of your will, it wouldn't be love anymore. It would be gravity. It would be physics.

  And this, I believe, is the profound gift you are giving each other.

  Because Sartre is right: The vow you make today will not force you to love each other tomorrow. The ceremony does not cast a spell. And that is exactly why your love is so magnificent.

  It means that ten years from now, or fifty, you will not be together because a piece of paper from this afternoon forced you to be. You will be together because, on that Tuesday morning over coffee, or that difficult evening after a long week, you looked at each other and *chose* each other again.

  The anguish Sartre speaks of is the weight of that responsibility. But at a wedding, we call that weight "devotion."

  So, my wish for you is not that you rest on the promise of today. My wish is that you find the joy in the freedom of tomorrow. May you never feel trapped by your vow, but may you feel liberated by it, knowing that every single morning you wake up beside one another, you are free to leave, and yet, you are free to stay.

  To [Bride] and [Groom]: May you never stop choosing. Cheers.
