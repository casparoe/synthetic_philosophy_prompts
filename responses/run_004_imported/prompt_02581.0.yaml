answer: |-
  The room smelled of ozone and old paper, the scent of a bureaucracy that administered reality itself. Elias stood on the circular dais, the Ontological Scale humming beneath his boots. Across the glass partition, Adjudicator Voss watched him with the weary eyes of a man who had categorized too many souls.

  "Final declaration, Mr. Vance," Voss said, his voice tinny over the intercom. "The Scale is sensitive to self-conception. Don't try to game it. It measures causal continuity, not just intent."

  Elias looked at the console screen. Two options glowed amber.

  **CLASS A: TRANSWORLD IDENTITY.**
  *Subject is numerically identical to Origin-Entity. Legal continuity maintained. Liabilities and assets transferable. Extradition applicable.*

  **CLASS B: COUNTERPART DESIGNATION.**
  *Subject is qualitatively similar but numerically distinct. Legal continuity severed. Liabilities void. Assets frozen. Immigration status: Alien.*

  "My family," Elias said. His voice cracked. "If I choose Class A... the Dividend transfers automatically. They get the rations. They survive the winter."

  "Correct," Voss said. "Because you are still *you*. You haven't died; you've just relocated. Your obligations travel with you. The State garnishes your wages here to support your dependents there."

  "And if I choose Class B?"

  "Then you are a new person," Voss said, tapping his stylus on the glass. "A David Vance-2. The David Vance-1 back in Sector 4 is legally deceased. The Dividend stops. Your wife and daughter lose their housing allocation. They starve."

  Elias closed his eyes. He could hear the wind howling outside the safe zone of Sector 7, a sound that didn't exist in the dying Sector 4. He had run. He had found a crack in the modal barrier, a place where the worlds brushed against each other like pages in a book. He had stepped through.

  But he hadn't expected the Border Control to ask *what* had stepped through.

  "There's a third option," Elias whispered. "I send them money privately. If I'm a Counterpart, I'm free. I can work. I can send credits across the barrier."

  Voss sighed. "We've heard it before. The Humphrey Objection, we call it. Your wife doesn't want charity from a stranger who looks like her husband. She wants *you*. And the system knows it. If you declare Counterpart, the transfer channels lock. You can't send money to a ghost. The only way they eat is if the system recognizes you as the provider. Which requires Class A."

  Elias looked down at his hands. They were the same hands that had held his daughter's feverish brow three days ago. But were they? In Sector 4, those hands were still there, holding hers. If he was Class A, those hands were *his* hands, and he had pulled them away. He had abandoned them. He was a deserter.

  If he was Class B, those hands belonged to someone else. A counterpart. A man who stayed. A man who was dying with them. Elias was just a copy who got lucky.

  "It's not a metaphysical question, Elias," Voss said softly. "It's a moral one. Lewis or Kripke? Are you world-bound, or are you universal?"

  "If I choose A," Elias said, "I admit I left them. I admit I'm the same man who walked out. I go to prison for desertion."

  "Minimum security," Voss corrected. "But yes. You serve time. They get the Dividend."

  "If I choose B... I walk free. They die."

  "Technically, *he* dies. The guy back there. You're safe."

  Elias thought of his wife, Sarah. He remembered an argument they'd had years ago, before the blight. She'd said, *"If you ever leave me, don't tell me it's for the best. Don't tell me someone else will love me better. I don't want a better love. I want you."*

  That was the Humphrey Objection in a nutshell. Hubert Humphrey wouldn't care if a counterpart won the election. He cared if *he* won. Sarah wouldn't care if a counterpart sent credits. She needed *him*.

  But if he was *him*, he was a monster who let them starve while he ate synthetic steak in Sector 7.

  The hum of the Scale intensified. It was waiting for his cognitive resonance. It could feel the fracture in his selfhood.

  "Time," Voss said.

  Elias realized the trap. The metaphysics wasn't just background; it was the mechanism of the trap. If the universe was Lewisian, he was already free. He was a new entity. He couldn't be punished for the sins of a counterpart. He could choose B and live with the guilt, knowing that objectively, he hadn't abandoned anyone. He was just a guy who showed up.

  But if the universe was Kripkean, he was the same substance. Choosing B would be a lie the Scale would reject. He would be forced into A.

  So the choice only existed if Lewis was right.

  If Lewis was right, he could choose to be a stranger. He could choose to sever the tie. He could save himself and let the "other" man die with his family.

  If Kripke was right, he had no choice. He was already responsible.

  Elias stepped forward. He placed his palm on the scanner. He thought about the man in Sector 4. He thought about the cold. He thought about the guilt that would eat him alive in Sector 7 if he walked away, knowing that the only reason he *could* walk away was because he claimed he wasn't the man who stayed.

  It was a loophole in reality. A way to launder guilt through ontology.

  "I..." Elias started.

  The comms crackled. A voice cut through. Not Voss. It was a recording, pulled from his personal logs. Sarah's voice.

  *"Elias? If you're hearing this, the barrier breached. Don't come back. Just... live. But don't you dare pretend you're not us. Don't you dare become a stranger to save your skin."*

  She knew. She knew the temptation. To become a counterpart was to become innocent. To claim you were a different person was the only way to survive the guilt of survival.

  Elias looked at Voss. "If I choose A... do they know I'm in prison?"

  "They get a notification. 'Provider Relocated.' They know you're alive."

  "And if I choose B?"

  "They get a death certificate."

  Elias closed his eyes. He could feel the Scale probing his history, looking for the thread. If he severed it, the thread would snap. If he pulled it, it would hold.

  He realized then that the metaphysics didn't matter. The *claim* mattered. By claiming Identity, he bound himself. By claiming Counterpart, he freed himself. The universe was waiting for him to decide what kind of creature he was.

  Was he a substance that persisted through worlds? Or was he a momentary cluster of qualities, bound to a specific coordinate?

  He wanted to be the latter. God, he wanted to be the latter. He wanted to be Elias-2, the lucky immigrant, not Elias-1, the deserter.

  But Sarah's voice echoed in the sterile room. *Don't you dare become a stranger.*

  To be a stranger was to survive. To be the same was to suffer.

  Elias pressed his hand down hard.

  "Class A," he said. "Transworld."

  The Scale flared blue. Continuity confirmed. The hum dropped to a satisfied purr.

  "Liabilities accepted," Voss said, his voice devoid of judgment. "Guards will escort you to Processing. The Dividend has been released to Sector 4."

  Elias nodded. He had just condemned himself to prison. He had just admitted he was the man who left. He had rejected the loophole that would have let him live with a clean conscience.

  As the guards took his arms, he felt lighter. Not because he was free, but because he was still *him*. He was the man who loved them enough to admit he abandoned them.

  "Wait," Voss said, just as Elias reached the door.

  Elias turned.

  "You know," Voss said, looking down at his datapad. "Sector 4 collapsed ten minutes ago. Atmospheric failure."

  The room went silent. The hum of the Scale seemed to stop.

  "The Dividend," Voss continued. "It transferred. But there was no one left to receive it."

  Elias stared at him. The metaphysics held. He was the same man. The obligation was real. But the object of the obligation was gone. He had chosen guilt for nothing.

  "Then why..." Elias whispered.

  "Because you didn't know," Voss said. "And the Scale measures intent, not outcome. You chose Identity. You chose responsibility. Even if it was empty."

  Voss tapped the glass. "Lewis would say you're suffering for a ghost. Kripke would say you're honoring a truth."

  Elias looked at his hands again. They were just hands. But they were *his* hands.

  "Take me away," Elias said.

  As they led him out, he didn't look back at the door to Sector 7. He kept his eyes on the floor, carrying the weight of a world that no longer existed, because it was the only way to prove he had ever been there at all.
