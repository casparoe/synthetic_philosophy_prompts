answer: |-
  The image that haunts you is the same one that has haunted philosophers and neuroscientists for half a century: a patient, seated before a screen, asked what they saw. Their mouth says "Nothing," while their left hand points to "Something." It is a violation of our most basic intuition—that the "I" speaking is the same "I" acting. This intuition is the bedrock of our legal systems, our moral reasoning, and our private sense of self. When the corpus callosum is severed, that bedrock cracks.

  To answer your question, we must first dismantle the vague notion of "unity." In the philosophy of mind, unity of consciousness generally relies on one of two criteria: **phenomenal unity** (the feeling that experiences belong to a single field) or **access unity** (the ability of different cognitive systems to share and report on information). The debate over split-brain patients is essentially a debate over which of these criteria is essential for being a "subject."

  Here is the landscape of the debate, followed by the verdict the evidence demands.

  ### The Case for Two Subjects
  The argument for two distinct subjects of experience rests on **informational encapsulation**. This view, championed early on by Roger Sperry and Michael Gazzaniga, posits that a "subject" is defined by the boundary of its knowledge. If Hemisphere A sees a snow scene and Hemisphere B sees a chicken claw, and there is no physical pathway for A to know what B sees, then there is no single entity that sees "a snow scene and a chicken claw." There are two entities, each with a partial view.

  The strongest evidence here is behavioral conflict. In classic experiments, patients have been known to button a shirt with their right hand while the left hand unbuttons it, or to reach for one object while verbally denying wanting it. If there were truly one subject, this would be a form of paralysis or profound confusion. But the behavior looks like competition. The left hand acts on visual data the speaking mouth does not possess. If consciousness requires a unified field of access, and the access is physically bisected, the consciousness must be bisected as well. This position assumes that **unity requires communication.** No communication, no unity.

  ### The Case for One Subject
  The counter-argument, gaining traction with recent work by researchers like Yaïr Pinto and philosopher Elizabeth Schechtman, suggests that the "two minds" view is an artifact of restrictive experimental design. This position argues that the patient remains **one subject with disrupted coordination.**

  Proponents point out that in naturalistic settings, split-brain patients behave coherently. They walk, talk, and eat without their hands fighting. Furthermore, Pinto's 2017 research demonstrated that under certain conditions (specifically when stimuli are presented for longer durations or allow for eye movement), patients *can* integrate information across the midline. This suggests that subcortical pathways (like the superior colliculus) or residual callosal fibers maintain a thread of integration.

  This view assumes that **unity requires a single biological organism and a continuous phenomenological report.** Since the patients report feeling like one person, and since their brainstem (which regulates arousal and basic awareness) remains intact, the "self" persists. The dissociation is merely a failure of data transfer, like a computer with two monitors that can't share files, but is still running one operating system.

  ### The Case for Indeterminacy
  The third position, famously articulated by Thomas Nagel and Derek Parfit, is that the question itself is flawed. This view argues that "subject of experience" is a concept we invented to describe ordinary human functioning, and it simply has no application in extraordinary cases.

  If you cut a worm in half, do you have one worm or two? It depends on what you need the word "worm" to do. Similarly, if you bisect a brain, asking if there is "one person" is asking for a metaphysical fact that doesn't exist. There are only physical facts: there is one body, two hemispheres, limited information transfer, and conflicting behavioral outputs. To demand a count of "subjects" is to demand a **further fact** beyond the physical and functional description. This position assumes that **unity is a vague concept** that breaks down at the boundaries of biological engineering.

  ### The Verdict: Two Subjects of Experience
  While the "One Subject" view is more comforting and the "Indeterminate" view is philosophically cautious, I commit to the **Two Subjects** verdict, specifically **during the conditions of lateralized testing.**

  When a split-brain patient is set up in a lab to ensure visual information is sent exclusively to one hemisphere (preventing eye movement cross-over), there are two distinct loci of conscious awareness.

  My defense rests on the definition of consciousness as **access.** To be a subject of experience is not just to process data; it is to *have* that data available for report, reasoning, and voluntary action. In the lab, the left hemisphere (which usually controls speech) constructs a narrative based solely on left-visual-field data. It lies, confabulates, and guesses to explain the actions of the right hand, which it cannot see or control. Meanwhile, the right hemisphere demonstrates comprehension through pointing tasks that the left hemisphere cannot explain.

  If I cannot know what you see, I cannot feel what you feel, and I cannot veto your actions, I am not you. In the split-brain lab setup, the left hemisphere meets none of the criteria for being the same subject as the right hemisphere. They are epistemically sealed. To claim they are one subject is to prioritize the *label* of the person over the *reality* of the experience.

  ### Defending the Verdict
  The strongest objection to this verdict comes from the Pinto study and patient testimony. Patients say they feel like one person. Pinto shows they can integrate some data. Does this not prove unity?

  No. First, patient testimony is unreliable here because speech is lateralized to the left hemisphere. When a patient says "I feel like one person," it is the left hemisphere speaking. The left hemisphere is what Gazzaniga called the "Interpreter"—a module dedicated to weaving coherence out of chaos. It does not have access to the right hemisphere's isolation, so it honestly reports a unity it assumes exists. The silence of the right hemisphere (which is largely non-verbal) cannot testify to its own isolation.

  Second, regarding Pinto's findings: Subcortical integration does not equal conscious unity. The superior colliculus can coordinate eye movements and simple orienting responses without generating a unified *phenomenal field*. A reflex is not a subject. If the right hemisphere sees a threat and flinches, but the left hemisphere asks "Why did I flinch?", the *experience* of the threat was not shared. The coordination was mechanical, not conscious. Therefore, the existence of subcortical bridges does not negate the bisection of the *conscious subject.*

  ### Implications for the Ordinary Brain
  If I am right that the split-brain patient harbors two subjects during testing, what does that imply for you and me, with our intact corpus callosums?

  It implies that **unity of consciousness is a matter of bandwidth, not metaphysics.**

  We tend to think of our unity as a fundamental, magical property of the soul or the self. The split-brain case suggests it is merely a functional achievement. Your left and right hemispheres are likely distinct processing streams with their own specialized competencies, much like the split-brain patient. The only reason you feel like one subject is that your corpus callosum transfers information so rapidly (milliseconds) that the lag is imperceptible.

  We are not singular, monadic selves. We are a coalition. In the ordinary brain, the coalition is so tightly integrated that the partners are indistinguishable. In the split-brain patient, the phone lines are cut, and the partners reveal themselves as distinct entities.

  This demystifies the "self." It suggests that consciousness is not a thing you *have*, but a relationship you *maintain*. The horror of the split-brain case is not that it creates two people where there was one; it is that it reveals there was never just one person to begin with. We are all, always, a society of minds held together by the fragile architecture of neural connectivity. The split-brain patient simply shows us what happens when the architecture fails: the society dissolves into its constituent members.

  So, to answer your dinner argument: In the lab, under strict lateralization, there are two subjects. They share a skull, but they do not share a world. And in your own skull, right now, there is likely a similar multiplicity, singing in such perfect unison that you mistake the chorus for a soloist.
