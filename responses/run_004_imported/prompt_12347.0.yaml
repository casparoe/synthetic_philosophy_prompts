  3.  **Deconstruct Bentham's Core Principles:**
      *   **Utilitarianism:** Maximize pleasure, minimize pain.
      *   **Felicific Calculus:** Intensity, Duration, Certainty, Propinquity, Fecundity, Purity, Extent.
      *   **Harm Principle (anticipating Mill):** Law should only intervene to prevent harm to others.
      *   **Interests:** Only beings that can suffer have interests.
      *   **Security and Expectation:** Crucial for legal stability and social order.
