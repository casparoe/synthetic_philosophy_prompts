answer: |-
  This is a fantastic detail to hang a character on. You have spotted a genuine, rich tension in Williams's thought: the man who spent his career arguing against tidy, abstract moral systems (like utilitarianism) found his spiritual home in an art form that is inherently excessive, emotional, and structurally "unrealistic."

  The book you are looking for is **"On Opera"** (2006), edited by his wife Patricia Williams after his death. The central essay you want to mine is **"Opera and the World of Feeling."**

  Here is the deep dive on Williams's specific arguments, tailored to help you give your critic character some genuine philosophical ammunition.

  ### 1. The Core Argument: Opera is Not "Broken Drama"
  Williams's primary target is the **Reformist Tradition** (Gluck, Wagner, Verismo). This tradition argues that opera is embarrassing because people don't sing in real life, so we must try to make opera as "dramatically sensible" as possible to justify it.

  Williams flips this. He argues that **opera is not a sub-species of drama.** It is a distinct form where the "impossibility" is the mechanism of truth.
  *   **The Argument:** In realistic drama (plays/novels), characters are constrained by social norms. They lie, they hedge, they stay silent. In opera, the music forces **radical exteriority**. The music *is* the emotional truth, often overriding what the text says.
  *   **For your character:** She shouldn't apologize for the singing. She should argue that speech is the lie. When a character sings, they are no longer bound by the social contract of conversation. The music reveals what they *cannot* say in a play.

  ### 2. The Ensemble: Simultaneity of Consciousness
  You hit on the exact structural advantage Williams identified. In a play, dialogue is **sequential**. Character A speaks, then Character B. Even in a fast argument, time is linear.

  Williams argues that the operatic ensemble (especially in Mozart, like *Così*) creates a **psychological simultaneity** that is impossible in spoken theater.
  *   **The Mechanism:** In a trio or quartet, Character A can be vowing revenge, Character B can be pleading for mercy, and Character C can be laughing at them both—all at the same time.
  *   **The Philosophical Point:** Williams suggests this mirrors how we actually experience complex emotional situations. We don't just feel one thing at a time; we feel conflicting pressures simultaneously. Spoken drama forces us to untangle these threads one by one (linearizing the emotion). Opera allows us to feel the **contradiction** as a unified whole.
  *   **The "Truth":** The music harmonizes these conflicting emotions. It tells the audience: "All of these things are true at once." It validates the complexity of the human interior in a way sequential dialogue cannot.

  ### 3. Time and the "Psychological Moment"
  Williams writes about how opera manipulates time. In real life, a realization takes a split second. In opera, it takes a six-minute aria.
  *   **The Argument:** This isn't "slowing down" the action; it is **expanding the significance**. The aria isn't about how long it takes to say the words; it's about the *weight* of the decision.
  *   **For your character:** She can argue that realism is actually *superficial* because it respects clock time over psychological time. Opera respects the time it takes to *feel* a truth, not just say it.

  ### 4. Connection to His Moral Philosophy (The "Internal Reasons" Link)
  This is the "philosophical bone" your character can really lean on.
  *   In his moral philosophy, Williams argued against "external reasons" (you should do X because it is universally Right) and for **"internal reasons"** (you do X because it aligns with your subjective motivational set—your desires, emotions, commitments).
  *   **The Opera Link:** Opera is the art form of **Internal Reasons**. It doesn't care about the utilitarian outcome of the plot (who lives, who dies). It cares about the *subjective experience* of the agents.
  *   **The Critic's Voice:** Your character can say that modern audiences want opera to be moralistic or realistic (External), but opera is only true when it is selfishly, passionately subjective (Internal). The "irrationality" of falling in love in five minutes is valid because *emotionally*, that is how it feels. The music validates the internal reason, even if the plot logic fails.

  ### 5. Specific Notes on *Così fan tutte*
  Since your friend is directing *Così*, your character might reference it. Williams had a complex relationship with *Così*.
  *   He acknowledged it can seem cynical (the "bet" about fidelity).
  *   But he argued that the **music** saves it from being a cruel joke. The music grants the characters genuine dignity and pain, even when the plot treats them as puppets.
  *   **Key Insight:** The music tells us their feelings are real, even if the social situation is artificial. This supports the idea that **Music > Libretto** in terms of truth-telling.

  ### Drafting the Monologue: Key Phrases & Concepts
  Here are some conceptual hooks your character can use to sound like she's read Williams, not just *About Opera*:

  *   **"The Lie of Realism":** She should scoff at directors who try to make opera "grounded."
      *   *Line idea:* "If I wanted to watch people talk like humans, I'd watch a courtroom drama. Opera is the only place where we admit that feelings are louder than words."
  *   **"The Harmony of Contradiction":** Regarding ensembles.
      *   *Line idea:* "In a play, they take turns lying to each other. In a Mozart ensemble, they sing the truth of their own hearts all at once, and the music proves they can coexist. It's the only time we get to hear the whole room's conscience in a single chord."
  *   **"Impossible Objects":**
      *   *Line idea:* "Williams knew it. Opera is an impossible object. It shouldn't work. But it works *because* it breaks the rules of how humans communicate. It bypasses the social contract and goes straight for the nervous system."
  *   **"Time":**
      *   *Line idea:* "Realism is obsessed with the clock. Opera is obsessed with the weight. Five minutes to say 'I leave you'? No. Five minutes to dismantle a life."

  ### A Sample Snippet for Your Critic
  *Here is a taste of how this might sound in her voice, channeling Williams's skepticism of neat theories:*

  > "You think it's silly that she sings while she's dying? Of course it's silly. People don't sing when they die. People don't sing when they fall in love, either. They stammer. They shut up. They lie.
  >
  > "That's why we have opera. Because speech is a tool for social management, but music is a tool for psychological exposure. When the tenor holds that high C, he isn't telling you how long it took him to decide to fight the duel. He's telling you the weight of the decision.
  >
  > "And don't get me started on the ensembles. In your little student production, if you try to make them act like they're having a normal conversation during the quartet, you'll kill it. In a play, truth is sequential. One person speaks, then the next. But in opera, the music allows three people to be completely, utterly wrong about each other, and completely right about themselves, all in the same measure. The harmony doesn't resolve their differences; it validates the contradiction. That is the only thing opera can do that a novel cannot. It tells you that conflicting truths can occupy the same space without destroying the world.
  >
  > "Williams knew this. He knew that trying to make opera 'sensible' is like trying to make a dream obey the laws of physics. You might get a realistic dream, but you'll wake up empty."

  ### Summary for Your Research
  *   **Book:** *On Opera* by Bernard Williams (2006).
  *   **Key Essay:** "Opera and the World of Feeling."
  *   **Key Concept:** Opera creates a "world of feeling" distinct from the "world of action."
  *   **Key Structural Advantage:** Simultaneity of conflicting emotions (Ensembles) vs. Sequential dialogue.
  *   **Key Stance:** Anti-Realism. The "absurdity" is the gateway to emotional truth.

  This should give your character enough heft to sound like she's not just defending a hobby, but defending a specific way of understanding human psychology.
