  **Move-by-Move Justification**

  *   **Move 1 (Leah: +2):** This is the standard "Argument from Child Development" (famously advanced by Coady and Burge). It effectively targets *Global Reductionism*. If justification requires an inductive track record, children—who lack the cognitive capacity to compile one—would be unjustified in almost everything they believe. Since we intuitively think children *are* justified, the Humean requirement seems too strong. Leah lands a solid opening blow.
  *   **Move 2 (Owen: +1):** Owen makes a crucial distinction between psychological immediacy and epistemic grounding. Citing "epistemic vigilance" (e.g., work by Koenig or Harris) is a smart empirical counter: children aren't *blank slates*, they do track reliability cues. However, he risks conflating externalist reliabilism with internalist reductionism. If the tracking is sub-personal, it's unclear if it satisfies the Humean demand for *reasons*.
  *   **Move 3 (Leah: +2):** Leah correctly identifies the theoretical slippage in Owen's defense. Classical reductionism (Hume/Fricker) is typically internalist—it requires the hearer to have access to positive reasons. If the mechanism is sub-personal and inaccessible, Owen has shifted to externalist reliabilism. As Leah notes, many anti-reductionists (like Burge) are happy to accept reliabilist accounts of *how* we track truth, so this doesn't save reductionism as a distinct normative thesis about *reasons*.
  *   **Move 4 (Owen: +1):** This is the strongest move for the reductionist, appealing to Elizabeth Fricker's *Local Reductionism*. By shifting the burden from a global track record of testimony to local, case-specific checks (sincerity, plausibility), Owen avoids the developmental objection. It is a viable position, but it leaves him vulnerable to the regress problem regarding the *source* of the background beliefs used to make those local checks.
  *   **Move 5 (Leah: +2):** This is the "Circularity" or "Bootstrapping" objection, and it is the hardest hurdle for local reductionism. To judge a claim "mundane" or a speaker "sincere," I must rely on background beliefs about the world and human psychology. Since nearly all of those background beliefs are themselves testimonially acquired, the reductionist account appears to presuppose the very thing it tries to justify. Leah forces the regress dilemma cleanly.
  *   **Move 6 (Owen: 0):** Owen pivots to coherentism. While philosophically defensible (many epistemologists accept that justification is holistic), this effectively concedes the debate. Reductionism traditionally seeks to ground testimony in *non-testimonial* sources (perception/induction) to stop the regress. By admitting that perception and testimony both bottom out in coherence, Owen abandons the core reductionist claim that testimony is derivative. It's an honest retreat, but it doesn't win the argument for reductionism.

  **Overall Analysis**

  **Does this map cleanly onto the textbook divide?**
  No. This exchange demonstrates why the textbook binary (Global Reductionism vs. Anti-Reductionism) is largely obsolete in contemporary literature.
  *   **Leah** argues for a view close to Burge's "Acceptance Principle" (testimony is *a priori* justified unless defeated), but she pushes it toward a regress argument that threatens *all* foundationalism.
  *   **Owen** starts as a Humean but migrates through Local Reductionism (Fricker) to Coherentism.
  The debate shows that "Local Reductionism" is the only viable reductionist stance, but as Leah's Move 5 highlights, it is unstable. If the background beliefs required for local checks are themselves testimonial, Local Reductionism collapses into a form of Anti-Reductionism or Coherentism. The divide breaks down because the "reduction" base (perception/induction) cannot be isolated from the testimonial web it is supposed to support.

  **Is there a point either of them is missing?**
  Yes, two significant ones:
  1.  **The Assurance View:** Neither mentions the second-personal nature of testimony (associated with Richard Moran or Edward Hinchman). On this view, testimony isn't just evidence transmission (which invites the reductionist/anti-reductionist debate about *evidence*); it is an act of *assurance* where the speaker takes responsibility for the truth. This bypasses the need for inductive tracking because the justification comes from the interpersonal commitment, not the reliability of the channel.
  2.  **The Distinction between Global and Local:** Owen introduces Local Reductionism late (Move 4). Had this distinction been explicit from the start, Leah's Move 1 (which targets Global Reductionism) would have been less decisive. The real contemporary debate isn't "Reductionism vs. Anti-Reductionism" but "Local Reductionism vs. Transmission/Entitlement Views," with the status of background beliefs (Leah's Move 5) being the central battleground.
