prompt: |-
  okay so a bit of context: a few of us started a lunchtime podcast for our school's philosphy/poli-sci club (very low budget, recorded on someone's phone lol), and next week were interviewing a local philosophy grad student who's a total Nozick stan, like entitlement theory of justice is basically her whole personality. we already read the Wilt Chamberlain bit from Anarchy, State, and Utopia for class, so I know the 25-cents-a-head thing is gonna come up in like the first two minutes, and I really don't want the whole episode to just be her re-explaining that to us again.

  can you draft like 8-10 interview questions that go past that setup? I want at least one on the patterned-vs-historical distinction and whether "liberty upsets patterns" actually proves what Nozick thinks it proves, one on the Lockean proviso and whether the weaker "doesn't worsen others' situations" version he uses lets in way more redistribution than he'd want, one bringing up G.A. Cohen's objection that a pattern could just be restored afterward without interfering in every single transaction the way Nozick implies, and one on the rectification problem -- since pretty much all real property has theft or conquest somewhere in its history, doesn't Nozick's own three-part theory end up licensing huge redistribution, and isn't it kind of telling that he floats using Rawls's difference principle as a rough stand-in for rectification in a footnote? if there's room throw in something about Nozick basically backing off libertarianism later in The Examined Life too, I think that's a good curveball. for each question can you also add a quick follow-up based on whatever answer she'd probably give, so I'm not just standing there if she dodges it
