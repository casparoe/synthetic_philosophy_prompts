answer: |-
  **Setting:** *A quiet courtyard in Mithilā, circa 12th century. Two scholars sit on woven mats. One is **Nyāyavadin**, a proponent of the New Nyāya (Navya-Nyāya), precise and ontologically robust. The other is **Pramāṇavadin**, a follower of the Dignāga-Dharmakīrti tradition, parsimonious and causal-minded. A scribe sits between them, ready to record the *vāda*.*

  **Nyāyavadin:** Let us dispense with pleasantries. My dissertation hangs on this knot. You Buddhists insist on shaving reality down to two *pramāṇas*: Perception (*pratyakṣa*) and Inference (*anumāna*). When I speak, and you understand me, you claim this is merely inference. I say *śabda* (testimony) is a distinct eye, not a mirror reflecting inference.

  **Pramāṇavadin:** And I say you are multiplying entities without necessity. Tell me, when I say, "There is fire on the mountain," what occurs in your mind?

  **Nyāyavadin:** I grasp the relation between the words "fire" and "mountain" based on prior convention (*saṅketa*). I know the fire is there.

  **Pramāṇavadin:** Do you? Or do you grasp *my intention* to inform you of the fire? The words themselves are just sound (*dhvani*). They are impermanent. They vanish the moment they are uttered. How can a vanished sound carry meaning? It cannot. What carries meaning is the *liṅga*—the sign. Your utterance is a sign of your knowledge. I infer the fire on the mountain because I infer you are a competent speaker who would not say "fire" unless you knew fire. This is *svārthānumāna* (inference for oneself). The speaker is the *hetu* (reason); the fact spoken is the *sādhya* (probandum).

  **Nyāyavadin:** You reduce the word to smoke. But smoke and fire are connected by natural pervasion (*vyāpti*). Words and meanings are connected by convention (*saṅketa*), established by God or ancient agreement. But let us look closer at the *process*. When I hear a sentence, "Bring the cow," do I perform a syllogism? "This person is speaking; competent speakers speak truth; therefore, I should bring the cow"?

  **Pramāṇavadin:** Not a formal syllogism, no. It is a rapid, habitual inference. Just as you see smoke and immediately think fire without reciting the *vyāpti*, you hear speech and immediately infer the state of affairs. The mechanism is causal. The sound causes a memory trace of the meaning, which leads to the inference of the speaker's intention, which yields knowledge of the object. It fits within *anumāna*.

  **Nyāyavadin:** Here is where your reduction fractures. Consider the four conditions required for sentence comprehension (*śābdabodha*). We require *ākāṅkṣā* (syntactic expectancy), *yogyatā* (semantic compatibility), *sannidhi* (temporal proximity), and *tātparya* (sentence intention).

  If testimony were inference, these would need to map onto the conditions of inference. But they do not. *Ākāṅkṣā* is not *vyāpti*. If I say "Cow...", your mind waits for a verb. If I say "He wets with fire," you reject it due to lack of *yogyatā*. In inference, if I see smoke, I do not wait for a "verb" to appear before inferring fire. Smoke is sufficient in itself. Language requires a mutual fitting together of parts that inference does not.

  **Pramāṇavadin:** A clever distinction, but superficial. *Ākāṅkṣā* is simply the requirement for the *hetu* to be unambiguous. If I show you a wet rock, you might infer rain. But if I show you a wet rock in a cave, the inference is blocked. That is my *yogyatā*. The conditions you list are merely conditions for a *successful* inference from signs. They do not prove a separate *pramāṇa*. They only prove that linguistic inference is complex.

  **Nyāyavadin:** Complex, yes. Distinct, also yes. Consider the *tātparya*. For you, *tātparya* is the psychological intention of the speaker, which I must infer. For Nyāya, *tātparya* is a quality of the sentence itself, understood directly through the words.

  Here is the spear point: The Stranger Argument. I walk into a village I have never visited. A man I have never seen, whose character I do not know, shouts, "The bridge is broken!" I turn back. I have not established a *vyāpti* between "This Specific Man" and "Truth." I have no inductive history with him. If *śabda* were *anumāna*, I should remain ignorant until I verified his reliability. But I am not ignorant. I know the bridge is broken. The knowledge arises immediately from the words, not from an inference about the man.

  **Pramāṇavadin:** You assume the inference must be about the *specific* man. It is not. It is about the *class* of speakers. You rely on a general *vyāpti*: "Human speech, uttered with assertive tone, is generally caused by a desire to communicate reality." This is a natural correlation observed in the world. Unless you have specific defeaters (you know he is a liar, or he is joking), the default inference holds. You do not need to test every fire to know smoke indicates it; you rely on the general relation. Similarly, you rely on the general reliability of speech acts.

  **Nyāyavadin:** But that general relation is shaky! Humans lie. Humans err. Smoke *always* indicates fire (in the Nyāya view of natural *vyāpti*). Speech does *not* always indicate truth. If the *hetu* (the utterance) is sometimes present without the *sādhya* (the truth), then it is a fallacious reason (*hetvābhāsa*). If testimony is inference, then all testimony is potentially fallacious inference until verified.

  Yet, we treat testimony as *prima facie* valid (*svataḥ prāmāṇya*). We do not say, "I infer this might be true." We say, "I know this." The phenomenology is different. In inference, I feel the pull of the reason. In testimony, I feel the grasp of the meaning. The cognition "He is speaking" is distinct from the cognition "The bridge is broken." In inference, the cognition of the reason and the probandum are linked in a single movement. In testimony, the words vanish, yet the meaning remains, unmediated by a constant reminder of the speaker's reliability.

  **Pramāṇavadin:** You cling to phenomenology as if it were ontology. Just because a magic trick *looks* like instant teleportation doesn't mean it isn't mechanics.

  Let me press you on *yogyatā*. You say semantic compatibility is unique to language. But consider this: I tell you, "Sprinkle the field with fire." You reject this. Why? Because you know fire is dry and water is wet. This knowledge comes from perception and prior inference about the nature of elements. Your rejection of the sentence is based on an *inference* that the statement contradicts established facts. Thus, the validation of testimony is governed by inference. If inference can veto testimony, how can testimony be independent?

  **Nyāyavadin:** Inference can veto perception too. If I see a mirage, inference corrects it. Does that make perception a species of inference? No. It means *pramāṇas* have different domains. *Yogyatā* is not an inference; it is a negative condition. It is the *absence* of a blocker.

  But let us return to the *ākāṅkṣā*. In inference, the *liṅga* (sign) is complete in itself. Smoke is the sign. In language, a single word is not a sign of the sentence meaning. "Cow" does not mean "Bring the cow." The meaning arises only from the *relation* between words. This relation is not causal in the way smoke and fire are causal. It is normative. Words *demand* other words. This normative structure (*vidhi*) is not found in nature. It is found only in *śabda*. To reduce this normative expectancy to natural causation is to confuse grammar with physics.

  **Pramāṇavadin:** Is it? Or is grammar just the physics of the mind? The "demand" you speak of is a causal habit (*vāsanā*). Because you have heard "cow" followed by verbs in the past, the hearing of "cow" causes an expectation. This is cause and effect.

  You Nyāyikas want *śabda* to be independent because you want to protect the Vedas. If testimony is just inference, then Vedic statements must be checked against reality. If *śabda* is independent, the Vedas are self-validating. I see your ontology protecting your theology.

  **Nyāyavadin:** And I see your parsimony starving the world of meaning. You reduce everything to causality because you deny universals (*sāmānya*). If there are no real universals, then convention is impossible, and your "inference from speech" collapses because words would have no stable connection to meanings. You need *my* ontology to make your reduction work!

  But put aside the Vedas. Take secular testimony. A child asks, "What is this?" I say, "A mango." The child knows. Has the child inferred my reliability? No. The child lacks the capacity for such complex inference. Yet the knowledge arises. If *śabda* were *anumāna*, the child would be epistemically blind until they developed logic. But they learn language *through* testimony. Testimony is the foundation upon which inference is built, not the other way around. You cannot use inference to explain the very tool that teaches you what inferences are possible.

  **Pramāṇavadin:** The child's learning is a gradual calibration of signs. It is a primitive inference, refined over time. Just because the process is subconscious does not make it a separate *pramāṇa*.

  However, I will grant you this: The *experience* of testimony is distinct. But epistemology is not about experience; it is about the *generation* of valid knowledge (*pramā*). If the causal chain of testimony can be fully analyzed as: Sound → Memory of Convention → Inference of Intention → Knowledge of Object, then the *pramāṇa* is the inference step. The rest are auxiliary causes (*sahakāri-kāraṇa*).

  You argue that the "Stranger" gives knowledge without prior reliability tracking. I argue that the *absence* of defeaters is itself a positive sign. In my system, we call this *avinābhāva* (non-deviation). In the absence of reasons to doubt, speech deviates not from truth.

  **Nyāyavadin:** "Absence of defeaters" is a negative safeguard. It is not a generative cause. The generative cause of my knowledge is your *statement*, not my *lack of suspicion*.

  Consider *sannidhi* (proximity). If you speak the words "Cook" and "Rice" an hour apart, I do not understand "Cook the rice." They must be proximate. In inference, if I see smoke today, and remember fire from yesterday, I can still infer. The temporal strictness of language suggests a unique structure of meaning-combination (*anvaya*) that inference does not possess. Inference links properties (*dharma*). Testimony links *actions* and *objects* in a normative command structure.

  **Pramāṇavadin:** You describe the *syntax* of the sign, not the *epistemology* of the knowledge. A code requires proximity to be decoded. That does not make decoding a separate source of knowledge from the inference that the code represents.

  I will push back on your "immediate grasp." When you hear a sentence in a language you do not know, do you grasp the meaning?

  **Nyāyavadin:** No.

  **Pramāṇavadin:** Why? The sounds are perceived. The *śabda-pramāṇa* should work if it is independent.

  **Nyāyavadin:** Because the convention (*saṅketa*) is missing.

  **Pramāṇavadin:** Exactly. You need the memory of the convention to bridge the sound to the meaning. That bridge is an inferential link. "This sound is associated with this object." That is a relation of pervasion. You are inferring the meaning from the sound based on the pervasion established by convention. You are describing inference, Nyāyavadin, but you are dressing it in grammatical clothes.

  **Nyāyavadin:** I am describing a *unique* pervasion! A pervasion that is not natural but imposed. A pervasion that requires *ākāṅkṣā* to function. A pervasion that works on strangers without inductive tracking of their character. If you call this inference, you have stretched the definition of *anumāna* until it snaps. You have made "inference" mean "any cognitive process that isn't direct perception." If you do that, you have won the debate by definition, but lost the insight.

  **Pramāṇavadin:** And if you posit a new *pramāṇa* for every distinct cognitive feel, you will have a hundred *pramāṇas*. One for memory, one for doubt, one for dreams. We cut with Occam's razor to keep the path to liberation clear. Knowledge comes from seeing what is (perception) and seeing what is connected to what (inference). Speech is just seeing the connection between a speaker and the world.

  **Nyāyavadin:** And I say liberation comes from right knowledge, and right knowledge requires acknowledging the tools we actually use. We navigate the world by trusting words, not by constantly inferring the psychological states of our neighbors. To treat my mother's warning as a hypothesis to be tested is not parsimony; it is paranoia.

  **Pramāṇavadin:** To treat it as absolute is not wisdom; it is dogmatism.

  *(The scribe looks up, brush hovering. The sun has moved across the courtyard.)*

  **Nyāyavadin:** Then we are at the limit of the *vāda*. You see the mechanism of causality behind the veil of language. I see the veil itself as a distinct fabric.

  **Pramāṇavadin:** Perhaps. But until you can show me how *ākāṅkṣā* exists without a mind to expect it, I will maintain that the machinery is inferential, even if the gears are linguistic.

  **Nyāyavadin:** And until you can explain how I understand a stranger's command without a prior *vyāpti* of their character, I will maintain that *śabda* carries its own authority.

  **Pramāṇavadin:** Then the dissertation remains unwritten?

  **Nyāyavadin:** No. The dissertation is the record of this friction. The truth is not in the concession, but in the tension.

  *(Both nod. The scribe dips the brush.)*
