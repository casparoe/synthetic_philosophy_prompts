answer: |-
  Here is a mundane, everyday example that follows the exact same logical structure as the Oswald case but avoids all the "famous puzzle" baggage.

  ### The Example: The Burnt Toast

  Imagine you are in the kitchen. You know for a fact that you set the toaster dial too high (**Antecedent is true**), and you know for a fact that the toast is burnt (**Consequent is true**).

  Now, compare these two sentences:

  1.  **Indicative:** "If I **didn't** set the dial too high, something else **burnt** the toast."
  2.  **Counterfactual:** "If I **hadn't** set the dial too high, something else **would have burnt** the toast."

  **The Verdict:**
  *   Most ordinary speakers will judge sentence (1) as **True**. (Since the toast *is* burnt, if you weren't the cause, some other cause must exist.)
  *   Most ordinary speakers will judge sentence (2) as **False**. (If you hadn't messed with the dial, the toast would be perfectly fine; nothing else was going to burn it.)

  ### Why This Works (The Philosophy Bit)

  You remembered the core distinction correctly: **Indicatives are epistemic; counterfactuals are metaphysical.**

  *   **The Indicative (Sentence 1)** operates on what you *know* to be true in the actual world. You know the toast is burnt. When you say "If I didn't do it...", you are holding the *outcome* (burnt toast) fixed and reasoning backward about the cause. Since the outcome is a fixed fact, the statement is true.
  *   **The Counterfactual (Sentence 2)** operates on *causal dependencies* in nearby possible worlds. When you say "If I hadn't done it...", you are asking the listener to imagine a world where you acted differently. In that closest possible world, you don't touch the dial, so the toaster works normally, and the toast does **not** burn. Because the outcome changes in that world, the statement is false.

  Jordan is treating them as the same claim because they share the same vocabulary, but they perform different logical jobs: one updates on **evidence** (the burnt toast is here), while the other updates on **history** (what if I hadn't touched the dial?). Since evidence and history can come apart, the truth values come apart too.
