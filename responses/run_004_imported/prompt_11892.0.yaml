prompt: |-
  I serve on my university's research-integrity appeals panel, a five-member faculty committee that hears the final internal review before a misconduct finding is forwarded to the funding agency. Under the policy we operate by -- in a structure common to many research-misconduct frameworks -- a finding against a respondent requires the panel to be satisfied of two distinct elements: first, that the respondent fabricated or falsified data, and second, that they did so knowingly or recklessly rather than through honest error or ordinary carelessness. I have sat on this panel for two years without this procedural question ever actually mattering to an outcome.

  That changed with the case we are now closing out: a biologist accused of manipulating gel images in a grant renewal application. An informal straw poll among the panel has yielded an awkward pattern. On the falsification question, panelists A, B, and C are convinced the images were altered, while D and E are not. On the intent question, A, D, and E are convinced any alteration would have been reckless, while B and C are not persuaded. So only A judges both elements to be satisfied; B and C accept falsification but not recklessness, D and E accept recklessness but not falsification, and everyone agrees both elements are required for a finding. Our bylaws leave open two ways to tally this, and they point in opposite directions. Vote element-by-element and apply the definition mechanically, and both elements clear their 3-2 majority, sustaining the finding. Ask each panelist instead for a single up-or-down vote on the charge itself, and only A votes to sustain, so the finding fails four to one. Some on the panel insist on the element-by-element vote, since only that keeps the verdict tied to the shared definition rather than to five unstated private theories of guilt; others insist on the direct vote on the charge, since we were convened to judge this named colleague rather than to certify sub-findings nobody asked us to rule on separately, and manufacturing a finding by splitting the question into pieces strikes them as a due-process problem in its own right.

  Please draft the short memo I will circulate to the panel ahead of next week's meeting. It should recommend a specific way of resolving this case -- including which procedure to use and the resulting verdict -- and it should engage the losing side's argument seriously enough that a colleague who holds that view would recognize their own reasoning in it rather than a caricature. If you think the better answer is a standing rule for how we vote in future cases rather than an ad hoc call on this one, say so and explain why, but either way I need something the panel can act on.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a 5-person university research-integrity appeals panel.
      *   **Task:** Draft a short memo to the panel for the next meeting.
      *   **Context:** A specific case involving alleged gel image manipulation.
      *   **The Problem:** A voting paradox (discursive dilemma/doctrinal paradox).
          *   Element 1 (Falsification): A, B, C say Yes (3-2).
          *   Element 2 (Intent): A, D, E say Yes (3-2).
          *   Overall Verdict (if voted directly): Only A says Yes (1-4).
          *   Policy Requirement: Both elements must be proven for a finding.
      *   **The Conflict:**
          *   *Option 1 (Element-by-Element):* Mechanical application of the definition. Result: Finding Sustained. Argument: Adheres to the shared definition, avoids private theories.
          *   *Option 2 (Direct Verdict):* Holistic judgment. Result: Finding Dismissed. Argument: Due process, judging the colleague not sub-findings, avoiding "manufactured" findings.
      *   **Requirements:**
          *   Recommend a specific resolution (procedure + verdict).
          *   Engage the losing side's argument seriously (steel-manning, not straw-manning).
          *   Decide whether this should be an ad hoc decision or a standing rule (and explain why).
          *   Tone: Professional, collegial, decisive but respectful, suitable for faculty governance.

  2.  **Determine the Recommendation:**
      *   *Legal/Procedural Precedent:* In administrative law and jury verdicts, the "doctrinal paradox" is a known issue. Generally, due process favors the *direct verdict* approach in criminal contexts (unanimity on the outcome), but administrative hearings often rely on *preponderance of evidence* on specific elements. However, in research misconduct (ORI guidelines, etc.), the standard is usually "preponderance of evidence" for the *charge*.
      *   *Ethical/Practical Consideration:* A finding of research misconduct is career-ending. The stakes are incredibly high. The "manufactured majority" problem (where no majority agrees on the *guilt* of the person, only on the components) is a significant due process concern. If 4 out of 5 members do not believe the colleague should be sanctioned, sanctioning them based on a combinatorial logic feels unjust.
      *   *Decision:* I should recommend the **Direct Verdict (Option 2)** approach for this case, resulting in **Dismissal**.
      *   *Reasoning:* The stakes (career ruin) demand a high bar for consensus on the *outcome*. A "fractured majority" finding lacks moral legitimacy even if it fits a mechanical logic. Furthermore, this should be codified as a **standing rule** to prevent future ambiguity and ensure fairness.

      *Wait, let me reconsider the "Element-by-Element" argument.*
      *   Argument: The policy defines misconduct as $A + B$. If the committee finds $A$ is true (by majority) and $B$ is true (by majority), then logically $A + B$ is true. To vote otherwise is to ignore the policy definition.
      *   Counter-argument: The policy defines the *standard*, not the *voting mechanism*. The committee's duty is to reach a collective judgment. If the collective judgment is "not guilty" (4-1), overriding that with a logical construction that no individual member subscribes to (except A) undermines the committee's role as a body of judgment, not a logic gate.
      *   *Stronger Argument for Direct Vote:* In quasi-judicial proceedings involving severe reputational harm, the "reasonable doubt" equivalent suggests we should not sanction unless a majority agrees on the sanction. The "Doctrinal Paradox" literature often suggests that when individual rights are at stake, the conclusion-based (direct) approach is preferred over the premise-based (element) approach to protect against error aggregation.

      *Decision Refinement:* I will recommend adopting a **standing rule** requiring a majority vote on the **ultimate finding** (Direct Verdict), not just the elements. For *this* case, that means dismissing the charge. This provides closure and future clarity.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** Acknowledge the difficulty of the situation and the uniqueness of this case.
      *   **The Procedural Question:** Clearly state the two options without bias initially.
      *   **The Recommendation:** State clearly: Direct vote on the charge. Result: No finding.
      *   **Addressing the "Element" Side (The Losers here):** Acknowledge their point. It's not illogical; it's textualist. It respects the policy definition. It prevents hiding behind vague holistic judgments. *Crucial:* Validate that their concern about "private theories" is legitimate.
      *   **The Argument for "Direct Vote" (The Winners here):** Focus on due process, the severity of the consequence, and the nature of the committee as a deliberative body. The "manufactured majority" issue.
      *   **Future Policy:** Argue why this shouldn't just be for this case. Ambiguity helps no one.
      *   **Closing:** Call to action for the meeting.

  4.  **Refining the Tone:**
      *   Avoid "I win, you lose."
      *   Use phrases like "collegial obligation," "reputational stakes," "procedural legitimacy."
      *   Ensure the "Element" proponents feel heard. "Your concern is that..." rather than "You are wrong because..."
      *   Make sure the "Direct Vote" proponents don't feel like they are ignoring the policy. "The policy sets the standard, but our vote expresses the judgment."

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "standing rule" vs. "ad hoc" requirement? *Yes, I need to explicitly argue for a standing rule.*
      *   *Check:* Is the verdict clear? *Yes, dismissal.*
      *   *Check:* Is the steel-manning of the opposing view strong enough? *I need to make sure I don't dismiss the logical validity of the element-based approach. It is logically sound, just procedurally risky for the respondent.*
      *   *Check:* Is the length appropriate? *Keep it tight. Faculty read memos quickly.*

  6.  **Final Polish:** (Mental check of the specific voting math).
      *   Element 1 (Falsification): A, B, C = Yes. (3-2)
      *   Element 2 (Intent): A, D, E = Yes. (3-2)
      *   Overall (Direct): A = Yes. (1-4)
      *   Recommendation: Direct Vote -> 1-4 -> Dismissal.
      *   Standing Rule: Future cases require majority on the ultimate finding.

      *(Self-Correction on Standing Rule)*: Actually, recommending a standing rule *now* might be seen as changing the rules mid-game. However, the prompt says "If you think the better answer is a standing rule... say so." The bylaws leave it open. Clarifying the bylaws now resolves the current impasse and sets the future. I will frame it as "clarifying our operating procedure to resolve the current impasse and guide future work."

      *(Refining the "Losing Side" engagement)*: The prompt asks to engage the losing side's argument seriously. If I recommend the Direct Vote, the Element Vote side loses. I need to explain why their logic is *good* but ultimately *insufficient* for the stakes.
      *   Their point: Consistency with policy definition.
      *   My counter: The policy defines *misconduct*, not *voting aggregation*. The committee's judgment is the final filter.

      *(Wait, one nuance)*: If I recommend a standing rule, does that apply to *this* case? Yes, because the bylaws are currently open. We are interpreting the bylaws now. So we interpret them to mean Direct Vote, apply it now, and keep it for later.

      *Let's write.*

      *Subject:* Procedural Resolution for Case [ID/Name] and Voting Protocol
      *To:* Research Integrity Appeals Panel
      *From:* [My Name]
      *Date:* [Date]

      *Opening:* We face a rare doctrinal paradox.
      *Analysis:* Two valid methods.
      *Recommendation:* Direct vote.
      *Reasoning:* Due process > Mechanical logic.
      *Opposing View:* Acknowledge the textual fidelity argument.
      *Future:* Codify this.

      *Wait, looking closer at the prompt:* "If you think the better answer is a standing rule for how we vote in future cases rather than an ad hoc call on this one, say so and explain why."
      Okay, I will argue for a standing rule *because* the ambiguity in the bylaws is the root cause of this distress, and we owe it to future respondents and panelists to remove it.

      *Final check on the "Losing Side":* The losing side (Element voters) argue that Direct Vote allows panelists to ignore the definition. I need to acknowledge that. "You worry that a holistic vote allows members to bypass the two-element test based on intuition." I will address that by saying the two elements remain the *standard of proof*, but the *vote* confirms the conclusion.

      *Okay, ready to draft.*
answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Appeals Panel
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Procedural Resolution for Case [ID Number] and Voting Protocol

  Colleagues,

  As we prepare for next week's meeting to close Case [ID Number], we face a procedural impasse that, while theoretically possible, none of us anticipated encountering in practice. We agree on the standard of proof: a finding requires proof of both falsification *and* intent. We disagree on how to aggregate our individual judgments to reach a collective verdict.

  As the straw poll indicates, a majority finds falsification (A, B, C), and a majority finds intent (A, D, E), but only a minority (A) supports a finding of misconduct when voting on the charge directly. We have two paths: a premise-based vote (tallying elements) which sustains the finding, or a conclusion-based vote (tallying the verdict) which dismisses it.

  I recommend we adopt a **conclusion-based voting procedure** for this case and codify it as a **standing rule** for future panels. Under this procedure, we vote directly on whether to sustain the finding of misconduct. Based on our current positions, this results in a **dismissal of the charge (1-4)**.

  I urge this course for three reasons, while acknowledging the strength of the counter-argument.

  **1. The Stakes Demand Consensus on the Outcome**
  A finding of research misconduct is career-altering. In quasi-judicial proceedings where the respondent faces severe reputational and professional harm, procedural due process generally favors requiring a majority agreement on the *outcome*, not just the components leading to it. When no majority of the committee actually believes the colleague is guilty of misconduct (as is the case here, with four of five voting against the direct charge), issuing a finding feels less like a judgment and more like a logical artifact. We are convened as a body of expert judgment, not a logic gate; our collective conclusion should reflect the actual consensus of the members.

  **2. Addressing the "Element-Based" Concern**
  I understand the objection to this approach. Colleagues favoring the element-by-element vote argue rightly that the policy definition is the only shared standard we have. You worry that a direct vote allows panelists to bypass the two-element test based on unstated intuitions or "private theories of guilt," potentially ignoring the policy's specific requirements. That is a valid concern regarding accountability. However, the two-element test remains the *standard of proof* we must apply during deliberation. A direct vote does not discard the standard; it simply requires that a majority of us agree that the standard has been met in this specific instance. It ensures that the policy definition is not just mechanically satisfied, but collectively endorsed.

  **3. The Need for a Standing Rule**
  We should not treat this as an ad hoc exception. The ambiguity in our bylaws is the source of this distress. Leaving this unresolved invites inconsistency and exposes the university to legal challenge in future cases. By establishing a standing rule now that requires a majority vote on the ultimate finding, we protect future respondents from "manufactured majorities" and protect future panelists from this exact paradox. We can simultaneously clarify that deliberations must explicitly address each element to ensure the direct vote is informed by the policy criteria.

  **Next Steps**
  At next week's meeting, I will move that we interpret our bylaws to require a majority vote on the ultimate finding of misconduct. If passed, we will immediately apply this to Case [ID Number], record the dismissal, and forward the clarified voting protocol to the Research Integrity Officer for inclusion in future panel charters.

  This path prioritizes the legitimacy of our verdict over mechanical consistency. I look forward to discussing this with you.

  Regards,

  [Your Name]
