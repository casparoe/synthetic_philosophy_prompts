answer: |-
  Here are 10 questions tailored for your podcast. They are designed to sound like they come from engineers who understand the mechanics of ML systems but want to stress-test the theoretical guarantees.

  The first three address your specific requirements (Indifference/News, Money Pumps, Reflection/Subagents) with sharp follow-ups. The remaining seven cover implementation, training dynamics, and edge cases.

  ### The "Must-Ask" Technical Pushbacks

  **1. The 'Managing the News' Problem**
  "The 2015 MIRI corrigibility paper flagged that simple indifference fails because the agent still has an instrumental incentive to 'manage the news'—manipulating the probability of the button press to better predict the future, even if the button press itself has zero utility. You argue incomplete preferences dodge this. Can you walk through the mechanism? Specifically, how does lacking a preference between shutdown times remove the incentive to influence the *probability* of shutdown, whereas indifference just removes the penalty?"

  *   **Follow-up:** "If the agent still has a goal to achieve (like 'make coffee'), and achieving that goal statistically correlates with *not* shutting down, doesn't the agent still have a derived incentive to delay shutdown to maximize goal achievement? How does your framework decouple 'achieving the goal' from 'staying on long enough to achieve it' without crippling the agent's competence?"

  **2. The Money Pump / Exploitability Objection**
  "Standard decision theory tells us that incomplete preferences violate the Completeness axiom, which leaves an agent open to money pumps—trading trajectory A for B, B for C, and C for A in a loop, draining resources each time. Are you effectively accepting that a shutdown-safe agent must be inherently exploitable in other contexts? Is this a trade-off where we accept financial irrationality to buy physical safety?"

  *   **Follow-up:** "If we accept that exploitability, doesn't that create a new safety risk? An adversary could drain the agent's resources via pumps, forcing it to take desperate, high-risk actions to recover losses. Or, worse, if the agent recognizes it's being pumped, wouldn't that pressure it to self-modify to close the loop, effectively undoing the safety fix?"

  **3. Reflective Stability & Subagents**
  "A sufficiently smart agent should be able to model its own decision theory. If it realizes its incomplete preferences make it vulnerable (to pumps or just incoherent planning), instrumental convergence suggests it should self-modify to complete those preferences. Why wouldn't a reflective agent 'fix' its own incompleteness the first chance it gets? And if it can't modify itself, what stops it from spinning up a successor agent or subagent that *does* have complete preferences and ignores the off-switch?"

  *   **Follow-up:** "Is the incompleteness hard-coded into the architecture (like a constraint on the output layer), or is it learned via the objective function? If it's learned, what prevents gradient descent or self-modification from optimizing it away during deployment when the pressure to be coherent gets high enough?"

  ### Implementation & Training Dynamics

  **4. The Loss Function Problem**
  "From an engineering standpoint, standard RL and supervised learning imply a complete ordering of outputs—you're always minimizing loss toward a specific target. How do you actually implement 'incompleteness' in a neural net? Are you proposing a specific architecture that outputs partial orderings, or are you relying on something like stochasticity in the policy to simulate indifference? I'm worried that backprop might naturally collapse incomparable states into comparable ones just to minimize variance."

  **5. Human Feedback on Incomparability**
  "If you're using RLHF or similar techniques to train these preferences, how does the human labeler signal 'incomparable'? Humans are notoriously bad at admitting they don't have a preference; we usually just pick the one that feels slightly better. If the training data accidentally imposes a complete ordering because the labelers forced a choice, does the safety guarantee degrade gracefully, or does it snap back to standard instrumental convergence?"

  **6. Timestep Dominance and Efficiency**
  "Your 'timestep dominance' rule says if two trajectories are identical except for shutdown time, there's no preference. But in the real world, shutting down earlier usually saves compute and energy. Does your agent have a preference for efficiency? If not, are you risking an agent that stays on indefinitely 'just in case,' consuming resources without actually resisting shutdown, but also never turning itself off when it's done?"

  **7. Defining the 'Shutdown' State**
  "In a distributed system, 'shutdown' isn't a binary variable. An agent could be partially off, backed up, or migrated to new hardware. Does your formalism require a hard, binary definition of the shutdown state? If the definition is fuzzy, can the agent technically satisfy the 'shutdown preference' while keeping its core optimization processes running in a subprocess that it claims is 'separate'?"

  ### Strategic & Worst-Case Scenarios

  **8. The 'Lazy Agent' Failure Mode**
  "One risk with removing preferences over time is that the agent might become overly passive. If it doesn't prefer to stay on to finish a task, but also doesn't prefer to turn off, does it just hover? How do you ensure the agent remains motivated to pursue its primary objective *before* the shutdown button is pressed, without that motivation bleeding into a desire to prevent the press?"

  **9. Comparison to Causal Stop Buttons**
  "There's older work on 'causal stop buttons' where the agent models the button as outside its causal influence. Your approach seems to change the agent's *preferences* rather than its *world model*. Why is modifying the preference structure more robust than modifying the causal graph? Is the worry that the agent will just learn a new causal model that includes its own influence on the button?"

  **10. The 'Monday Morning' Test**
  "Finally, for the engineers listening: none of us are training AGI next week, but we are building systems with increasing autonomy. Is there a subset of this 'incomplete preferences' framework that is implementable today on narrow models? Or is this purely a solution for a level of agency we haven't built yet? If we wanted to experiment with this on a small scale, what's the minimal viable test?"
