      *Let's try a scenario involving **Moral Disgust**.*
      *Scenario:* A scene depicts a character casually kicking a stray dog. The viewer feels a visceral lurch of disgust and anger.
      *Walton:* No dog was kicked. It is fictional that a dog was kicked. Your disgust is make-believe.
      *Thought Theory:* The *concept* of dog-kicking triggers real disgust.
      *This is the standard paradox.* I need something more specific to force the wedge.

