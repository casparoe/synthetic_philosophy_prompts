  2.  **Deconstruct the Theories:**
      *   **Walton (Make-Believe):** Emotional responses to fiction are *quasi-emotions*. They lack the motivational component of real emotions (you don't call the police when a character is murdered). They are generated by principles of generation within a game of make-believe. The key is the *absence of belief* in the existence of the object.
      *   **Lamarque/Carroll (Thought Theory):** We can have *real* emotions directed at thoughts/contents, not just existent objects. The cognitive content of the emotion is the thought of the situation, not the belief in its existence. Therefore, pity for Anna Karenina is real pity, even if we know she doesn't exist.

