prompt: |-
  I'm writing a novel in which two philosophers of art meet again at a conference after years apart: an aesthetician who has built her career on Kendall Walton's make-believe account of fiction, and her former student, now a convert to the "thought theory" associated with Peter Lamarque and Noël Carroll. I need their disagreement to turn on a genuine case, not a rehearsal of positions everyone already knows, so please construct a single, compact scenario — not Anna Karenina, and not Walton's own case of Charles and the green slime — in which someone has an emotional response to a fictional or partly fictional character or event, built so that the two theories genuinely diverge on it: one committed to calling the response a mere quasi-emotion confined to a game of make-believe, the other to calling it a real, garden-variety emotion. Sketch the scenario in a few sentences, then explain, in one tight paragraph per theory, exactly what each view is committed to saying about it and why the verdicts actually come apart rather than being two labels for the same fact. I'll handle turning it into dialogue myself.
