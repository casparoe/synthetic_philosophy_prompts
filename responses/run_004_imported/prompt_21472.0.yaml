      *Refinement:* Let's make it more immediate. A "Mockumentary" style scene where a character is cruelly pranked, but the viewer is *told* halfway through that the prank was staged (fictional), yet the cringe remains.
      *Better Refinement:* Let's look for a case where the *motivational* aspect is the key differentiator. Walton hinges heavily on the lack of action tendencies.
      *Let's try a scenario involving *anticipatory anxiety* for a fictional character in a suspense situation where the outcome is known but the *process* is visceral.*
      *Actually, the "Paradox of Fiction" usually hinges on pity/fear.* Let's try **Vicarious Guilt**.
      *Scenario:* A viewer watches a drama where a protagonist commits a subtle, cruel act of betrayal against a friend. The viewer recognizes this act as identical to something *they themselves* did in real life. The viewer feels a pang of guilt/shame while watching.
