answer: |-
  David Lewis's **Principal Principle (PP)** and Bas van Fraassen's **Reflection Principle (RP)** are two of the most influential norms in formal epistemology. Both function as principles of **expert deference**: they instruct an agent to align their subjective credence with a privileged quantity deemed to have epistemic authority. For Lewis, the expert is **objective chance**; for van Fraassen, the expert is the agent's **own future credence**.

  While both principles offer compelling idealizations of rationality, their unrestricted forms face devastating counterexamples. Lewis's principle falters on **undermining futures**, while van Fraassen's falters on **anticipated irrationality**. The following analysis details the specific features of the evidence that generate these problems, the standard fixes proposed for each, and an evaluation of whether these fixes represent the same underlying philosophical move.

  ---

  ### 1. The Principal Principle and the Problem of Undermining

  **The Principle:**
  Lewis's original Principal Principle states that if $X$ is the proposition that the objective chance of $A$ is $x$, and $E$ is any "admissible" evidence, then a rational agent's credence $C$ should satisfy:
  $$C(A \mid X \land E) = x$$
  Roughly: If you know the chance of $A$ is $x$, your credence in $A$ should be $x$, provided your other evidence doesn't "override" the chance.

  **The Problematic Evidence (Undermining):**
  The trouble arises from Lewis's commitment to **Humean Supervenience**, the view that objective chances supervene on the total history of particular matters of fact (the "Humean Mosaic"). On this view, the chance function is determined by the pattern of events in the world.

  The counterexample involves **undermining futures**. Suppose the current chance function $P$ assigns a non-zero probability to a specific future history $H$. However, if $H$ were to actually occur, the total pattern of events in the world would be such that $P$ would *not* be the true chance function (perhaps $H$ contains a statistical regularity that would make a *different* chance function the best systematization of the world).
  *   **The Feature:** The problematic evidence is information about the **total future history**. Because chances supervene on history, knowing the future history fixes the chances. In an undermining case, the evidence $H$ entails that $X$ ("The chance is $P$") is false.
  *   **The Contradiction:** The unrestricted PP implies $C(H \mid X) = P(H) > 0$. But since $H$ entails $\neg X$, logically $C(H \mid X) = 0$. The principle demands a credence that is both positive and zero.

  **The Standard Fix (The New Principle):**
  Lewis's own solution was to replace the Principal Principle with the **New Principle (NP)**. The NP modifies the right-hand side of the equation to condition the chance function on the proposition that it is indeed the chance function:
  $$C(A \mid X) = P(A \mid X)$$
  Here, $P(A \mid X)$ is the value the chance function $P$ assigns to $A$, *conditional on* $P$ being the true chance function. Since $P$ acknowledges (via Humean Supervenience) that it might be undermined by future history, $P(X) < 1$. This allows the chance function to assign a low probability to histories that would undermine it, thereby avoiding the contradiction. The fix acknowledges that the "expert" (Chance) is fallible regarding its own status as the expert.

  ---

  ### 2. The Reflection Principle and the Problem of Irrationality

  **The Principle:**
  Van Fraassen's Reflection Principle states that if $C_0$ is your current credence function and $C_t$ is your future credence function, then for any proposition $A$ and value $x$:
  $$C_0(A \mid C_t(A) = x) = x$$
  Roughly: If you currently know that your future credence in $A$ will be $x$, your current credence in $A$ should also be $x$. You should defer to your future self.

  **The Problematic Evidence (Anticipated Irrationality):**
  The counterexamples involve cases where an agent rationally anticipates that their future self will be **epistemically compromised**. Classic examples include forgetting, sleeping, or intoxication.
  *   **The Feature:** The problematic evidence is information about the **etiology of the belief change**. It is not merely that the credence will change, but *how* it will change. For example, "I will believe I can drive safely ($C_t(\text{Safe}) = 0.9$) because I will be drunk."
  *   **The Contradiction:** If I know I will be drunk, I know my future credence is not formed by processing new evidence about the world, but by chemical distortion. Deferring to that future credence ($C_0(\text{Safe}) = 0.9$) would be irrational, violating the norm that credence should track evidence.

  **The Standard Fix (Special Reflection):**
  The standard fix restricts the principle to cases where the agent expects to update **rationally**, specifically via **conditionalization**. This is often called the **Special Reflection Principle**:
  $$C_0(A \mid C_t(A) = x \land \text{Update is by Conditionalization}) = x$$
  Alternatively, it is formulated as: You should only defer to your future self if you expect your future self to be at least as informed and rational as your current self. The fix excludes cases where the link between the future credence and the truth is severed by irrational processes.

  ---

  ### 3. Comparison: Are the Fixes the Same Philosophical Move?

  At first glance, the problems seem distinct: Lewis's is metaphysical (about the supervenience of chance on history), while van Fraassen's is psychological (about the rationality of belief revision). However, under closer scrutiny, the fixes amount to **the same fundamental philosophical move**, though applied to different domains.

  **The Structural Parallel:**
  Both principles rely on a **screening-off** assumption.
  *   **PP:** Objective chance is supposed to screen off the world from your credence. Once you know the chance, nothing else (admissible evidence) should matter.
  *   **RP:** Future credence is supposed to screen off your current evidence. Once you know what you will believe (rationally), your current evidence shouldn't add anything.

  In both counterexamples, the screening-off fails because the conditioning information (the "expert's" verdict) carries **defeating information** about the expert's own authority.
  *   In **Undermining**, the chance function $P$ assigns probability to a history that makes $P$ false. The expert undermines its own authority.
  *   In **Irrationality**, the future self holds a credence caused by a process that makes the credence unreliable. The expert undermines its own authority.

  **The Unified Move:**
  The fix in both cases is to **condition the deference on the reliability of the expert.**
  *   Lewis's **New Principle** changes the instruction from "Match $P(A)$" to "Match $P(A \mid P \text{ is true})$." It tells the agent to defer to the chance function *only to the extent that the chance function itself predicts it is the true chance function.*
  *   Van Fraassen's **Special Reflection** changes the instruction from "Match $C_t(A)$" to "Match $C_t(A)$ *given that you updated rationally*." It tells the agent to defer to the future self *only to the extent that the future self is reached via truth-tracking methods.*

  **Conclusion:**
  The parallel holds. Both fixes acknowledge that the "expert" quantity (Chance or Future Credence) is not intrinsically authoritative; its authority is contingent on the relationship between that quantity and the truth. The unrestricted principles assume this authority is automatic. The counterexamples show that the conditioning evidence can sever the link between the expert and the truth. Therefore, the fixes are identical in logical form: **restrict the norm of deference to contexts where the expert's validity is preserved.**

  Lewis's fix handles this by modifying the *value* to which one defers (conditioning the chance on the chance hypothesis), while van Fraassen's fix handles this by modifying the *condition* under which one defers (restricting to rational updates). Despite this syntactic difference, both moves serve the same philosophical purpose: they save the norm of expert deference by excluding cases where the expert is known to be misleading. They transform the principles from unconditional commands into **conditional norms of reliability**.
