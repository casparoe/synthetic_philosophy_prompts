answer: |-
  **Cambridge, 1906**

  **WILLIAM JAMES:** Charlie, you must understand. When I gave those lectures at Stanford, I wasn't trying to codify a logic of science. I was trying to open a window. People are suffocating in absolutes, in systems that tell them their deepest hopes are meaningless unless they can be weighed on a grocer's scale. I tell them that if a belief in God carries them through a dark night, that belief has *cash value*. It works. In that sense, it is true.

  **CHARLES SANDERS PEIRCE:** And that, William, is precisely why I had to burn the bridge. You have taken a maxim designed to clarify concepts and turned it into a license for sentiment. You say truth is what works? For whom? For when? If a man finds comfort in believing the moon is made of cheese, does the moon acquiesce?

  **JAMES:** Don't be obtuse. I speak of human truth. Truth *happens* to an idea. It becomes true, is made true by events. If I believe I can leap this crevice, and that belief gives me the confidence to jump, and I land—well, the belief was true because it worked. Why must truth be some static idol waiting for us in the infinite future?

  **PEIRCE:** Because if truth is merely what satisfies you *now*, it is not truth at all. It is psychology. It is wish-fulfillment. My pragmatic maxim was meant to show that the meaning of a concept lies in its conceivable practical bearings. But those bearings must be public. They must be testable. Truth is not what satisfies *you*; it is the opinion which is fated to be ultimately agreed to by all who investigate. It is the destination of the community of inquirers.

  **JAMES:** There it is. The "final opinion." The "community." Charlie, look at me. We are not the community. We are two men in a study, aging, broke, worried. Your "final opinion" is a theological construct. It's the Absolute in disguise. You've smuggled in a metaphysical guarantee that inquiry *must* converge. How do you cash *that* out? Where is the practical difference between your "fated final opinion" and the old-fashioned "God's Eye View" you claim to reject?

  **PEIRCE:** (Pauses, lighting his pipe) The difference is that my view requires work, not faith. It requires the scientific method. It requires us to submit to external permanency, to reality that kicks back. Your view allows a man to say, "It is true for me." My view says, "You are wrong, and the long run will prove it." I needed a name for this view that was distinct from your... humanitarianism. So I call it *Pragmaticism*.

  **JAMES:** (Laughs) An ugly name.

  **PEIRCE:** It is ugly. I made it so. It is ugly enough that no self-respecting kidnapper would bother stealing it. I wanted to ensure no one could appropriate it for the sort of literary ease you peddle.

  **JAMES:** And yet, who paid for your lectures? Who lobbied for your position when you were starving? I peddle "literary ease," as you say, but I put food on your table. And I ask you again: What is the *use* of your truth? If the final opinion is in the infinite long run, none of us will ever see it. It has no bearing on how I live my life today. My pragmatism helps a man decide whether to marry, to fight, to pray. Yours tells him to wait for a consensus he will never witness. Which of us is truly being pragmatic?

  **PEIRCE:** (Softening) I do not deny your generosity, William. You have kept me from the gutter. And I grant you, my truth is a regulative ideal. It is the hope that makes inquiry possible. Without it, why bother? If truth is just what works for you today, then when it stops working, truth changes. Reality becomes putty.

  **JAMES:** Reality isn't putty. It resists. But our *access* to it is human, all too human. You want to save the objectivity of truth by pushing it off the horizon. I want to save the *life* of truth by bringing it into the room. You fear I make truth too soft. I fear you make it too dead.

  **PEIRCE:** Then we are at an impasse. I will keep my Pragmaticism. It is narrow, hard, and logical.

  **JAMES:** And I will keep my Pragmatism. It is wide, warm, and human. But Charlie... don't think I haven't stolen your best tools. I just use them to build houses for people to live in, rather than monuments for them to worship.

  **PEIRCE:** (A faint smile) Just ensure the foundations hold, William. Reality has a way of settling debts, eventually.

  **JAMES:** Then let us hope the final opinion is a kind one.
