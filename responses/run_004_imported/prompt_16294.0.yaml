prompt: |-
  My great-aunt died last week — she taught Islamic philosophy for something like 30 years and her whole thing, not just professionally but like actually believed it, was al-Ghazali's occasionalism. She'd get genuinely annoyed if you said the kettle "caused" the water to boil. I got asked to give the eulogy, which is funny timing because I'm in a philosophy of religion seminar right now and we just finished the unit on Ghazali and causation. She left a note saying whoever eulogizes her can't say the usual stuff, like "she shaped so many students" or "her influence lives on," because that gives a creature real causal power, and on her view she was never a cause, only ever an occasion for whatever God habitually chose to do around her. Also nothing carries its own power forward from one moment to the next on her view anyway, its all just getting recreated by God each instant, so even "her effect continues" isn't a comfort she'd have accepted. Can someone write this eulogy so it actually respects that instead of quietly ignoring it, but still lands for a room that's mostly non-philosopher family plus a few of her old colleagues who will absolutely clock it if the doctrine's wrong. Needs to be about 5 minutes spoken.
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Great-aunt, Islamic philosophy professor (30 years), devout believer in al-Ghazali's occasionalism.
      *   **Core Doctrine:** Occasionalism (no created causes, God is the only true cause, constant recreation of the universe).
      *   **Constraint 1 (The Note):** No standard causal language ("she shaped students," "her influence lives on," "legacy"). These imply created things have power.
      *   **Constraint 2 (The Doctrine):** Nothing carries power forward; everything is recreated each instant. So, "her effect continues" is theologically incorrect from her perspective.
      *   **Audience:** Mixed. Mostly non-philosopher family (need emotional resonance, accessibility) + colleagues (need doctrinal accuracy, won't tolerate errors).
      *   **Tone:** Respectful, accurate to her beliefs, comforting without violating the theology, slightly humorous (given the "funny timing" of the user's seminar).
      *   **Length:** About 5 minutes spoken (approx. 600-750 words).

  2.  **Deconstruct Occasionalism for the Eulogy:**
      *   *Standard View:* A causes B (Fire burns cotton).
      *   *Ghazalian View:* God creates the contact of fire and cotton, and God creates the burning. Habitual sequence, not necessary connection.
      *   *Application to Life:* She didn't *teach* students; God created the teaching occasion and the learning occasion. She didn't *love* family; God created the love in our hearts at the moment of interaction.
      *   *Application to Death:* Death isn't an end caused by illness/time; it's God choosing not to recreate her in the next moment.
      *   *Comfort:* If God is the only agent, we are never truly alone. Every moment of connection was directly sustained by Him. Her absence now is just a change in God's habitual manifestation.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty. Mention the specific constraint (the note). This sets the tone and shows respect for her intellect.
      *   **The Core Theology (Gentle Explanation):** Need to explain occasionalism without sounding like a lecture. Use the "kettle" example she loved. Frame it as *dependence* on God, not *negation* of her value.
      *   **Her Life/Teaching:** How to praise her without saying she "caused" change? Focus on her *presence* as an occasion. She was a mirror, a locus of manifestation.
      *   **The Family Connection:** How to express love? God placed love in our hearts when we were near her. It was real, just not *her* power generating it.
      *   **Death & Continuity:** Address the "influence lives on" ban. Instead, focus on God's consistency (Habit of God). We remember her because God sustains the memory *now*.
      *   **Closing:** A prayer (Dua) consistent with the theology. Asking God to continue the pattern of mercy.

  4.  **Refining the Language (The "Clock It" Test):**
      *   *Avoid:* "She inspired," "She taught," "Her legacy," "She made us better," "Impact," "Influence."
      *   *Use:* "She was a vessel," "God chose to work through her," "An occasion for mercy," "God sustained," "Habitual grace."
      *   *Nuance:* Make sure it doesn't sound like she was a robot. She *chose*, but her choice was also created. Focus on her *willing submission* as the occasion for divine action.

  5.  **Drafting - Attempt 1 (Mental Outline):**
      Hi everyone. She told me not to say she caused anything. She believed only God causes. So I won't say she taught well. I will say God made knowledge appear when she was there. She loved the kettle example. She is gone now because God stopped recreating her. But we still love her because God keeps that love. Thank you.

      *Critique 1:* Too blunt. Needs warmth. The family needs to feel the loss, not just the logic. The colleagues need to see the *Ash'ari* nuance.

  6.  **Drafting - Attempt 2 (Adding Warmth & Theology):**
      Start with the note. It's a final lesson. Explain the kettle. She wasn't passive; she was a willing servant. When she taught, it was God teaching through her. When we hug, it's God putting love in us. She isn't "gone" in a material sense, but God's pattern changed. We ask God to keep the pattern of mercy.

      *Critique 2:* Better. Need to ensure the transition from "no causation" to "real love" is clear. The love is real, the *source* is what's debated.

  7.  **Final Polish (Timing & Flow):**
      *   Check word count.
      *   Ensure the "kettle" anecdote is included (it's specific to the prompt).
      *   Make sure the ending feels like a eulogy, not a dissertation.
      *   *Self-Correction on "Choice":* In Ghazali's view, humans have "acquisition" (kasb). She chose to be a good occasion. I should mention her *willingness* to be a vessel.

  8.  **Writing the Script (incorporating the above):**
      *   *Intro:* The note.
      *   *Body 1:* The Kettle/Causation.
      *   *Body 2:* Her role (Occasion for Grace).
      *   *Body 3:* Grief & Memory (God sustaining the memory).
      *   *Conclusion:* Dua/Prayer.

      *(Self-Correction during drafting)*: Be careful not to sound like I'm saying *we* are God. We are the loci. God is the Agent.
      *(Refining the "Legacy" ban)*: Instead of "legacy," use "God's continuing habit."

  9.  **Final Review against Constraints:**
      *   5 mins? (Yes, ~700 words).
      *   No "shaped/influenced/caused"? (Checked).
      *   Ghazalian accuracy? (Yes, emphasis on habit/custom of God).
      *   Emotional resonance? (Hopefully, by framing God's direct involvement as intimate).

  10. **Final Polish:** Add stage directions for pacing. (Proceed to generate output).

  *(Post-Drafting Thought)*: I need to make sure I don't accidentally use causal language in the transition phrases. Instead of "Because she believed," use "In her view." Instead of "This brings us comfort," use "There is comfort in this."

  Let's write it.cw
answer: |-
  **Title:** The Occasion of Mercy
  **Time:** Approx. 5 Minutes
  **Tone:** Reverent, Intellectually Precise, Warm

  [Stand comfortably at the podium. Take a moment of silence before beginning.]

  Assalamu Alaikum to everyone. For those who don't know me, I am [Your Name], her great-nephew/niece.

  Usually, this is the part of the service where I tell you about the impact my aunt had on the world. I am supposed to tell you how she shaped minds, how she influenced her students, and how her legacy will live on through us.

  But, as many of you know, she left specific instructions for this moment. And to ignore them would be to dishonor the very truth she spent thirty years teaching.

  She wrote to me: "Do not attribute power to the creature. I did not cause knowledge. I did not cause love. I was merely the occasion."

  For those of you who weren't in her philosophy seminars, this might sound strange. She used to get genuinely annoyed if anyone said a kettle "caused" water to boil. To her, the fire touches the cotton, and the water heats up, but not because the fire has power. It happens because God, in His infinite wisdom and habit, creates the heat at the moment the fire touches the cotton.

  She believed that nothing in this universe has its own power. Not the fire. Not the kettle. And not her.

  So, I cannot stand here and say she *made* us better people. I cannot say her wisdom *transferred* to her students. Because on her view—and on the view of al-Ghazali she held so dear—created things do not transfer power. There is only One Agent.

  But please do not hear this as saying she was passive. She was not a puppet. She was a willing vessel.

  When she stood in a lecture hall, she prepared meticulously. She showed up. She spoke. She offered herself as an occasion for God's grace to appear. And God, in His generosity, habitually chose to reveal knowledge in the hearts of her students when she was present.

  She didn't *give* the knowledge. But she was the place where God chose to put it.

  And that, I think, is where the comfort lies for us today.

  If she were the cause of our happiness, then her death would mean the end of that happiness. If her love was a power she generated, then that power would have died with her.

  But her love for us was not hers. It was God's love, manifested through her. And God's love does not die.

  When we hug our cousins today, and we feel warmth, that warmth is not generated by our muscles. It is created by God, at that moment, as an occasion of our closeness. When we remember her stories tonight, and we feel joy, that joy is not stored in our brains like a battery. It is being freshly created by God, right now, as we honor her memory.

  She taught us that we are never alone, because nothing ever happens without God's direct will. There is no second cause to hide behind. When she held our hands, it was God holding our hands through her. When she fed us, it was God providing sustenance through her.

  She was a mirror. And a mirror does not claim the light as its own. It simply stays polished, stays ready, and reflects the light as purely as possible. She spent eighty years polishing that mirror.

  So, I will not say her influence lives on. Influence implies a chain of cause and effect that she controls.

  Instead, I will say this: We ask God to continue His habit of mercy toward us, just as He did when she was here. We ask that He continues to create knowledge in the minds of her students, not because of her, but because He is Generous, and He promised to sustain those who seek Him.

  We ask that He recreates love in our hearts when we think of her, not because memory has power, but because He is the Turner of Hearts.

  She has reached the end of her occasions. God has chosen not to recreate her in the next moment of time, but to recreate her in a state of rest.

  Thank you for being the occasion for this gathering. May God create peace in this room, and may He create mercy for her, as He always has.

  Wa Alaikum Assalam.
