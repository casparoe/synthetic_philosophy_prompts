  hey so for my phil of language seminar we're in the unity-of-the-proposition unit and I keep getting tangled on this one debate. one camp says Bradleys regress gets blocked because Fregean concepts are "unsaturated," so you don't need some extra relating-relation to glue the proposition together. the other camp (more Russell-ish, multiple relation theory of judgment) says that's kind of a dodge, and the real unifier has to be the act of judging itself rather than anything sitting inside the proposition. could you write me a dialogue where a defender of each view actually argues it out with the other instead of just talking past each other? I specifically want the judgment-theorist to press the unsaturation person on the concept horse problem (if concepts are unsaturated, how are we even managing to refer to them as concepts right now, like I just did?), and I want the unsaturation person to hit back with the direction problem for multiple relation theory (nothing about "judging a, R, b" seems to fix it as judging that aRb rather than bRa, or even rules out nonsense combos). neither one should cave easily or dodge - I want real back-and-forth where they actually respond to each other's point instead of just restating their own view.
