          *   Section 1: Sleep/Mad/Drunk (Possession vs. Use).
          *   Section 2: Actors/Empedocles (Verbal vs. Integrated).
          *   Section 3: Universal/Particular vs. Hyperbolic Discounting (The Showdown).
