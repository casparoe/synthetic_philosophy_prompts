answer: |-
  It is a pleasure to correspond with someone who has spent a lifetime at the bench and now finds equal satisfaction in the armchair. The transition from pipette to precept is a rare one, and your reflection on the tension between experimental pragmatism and decision-theoretic idealism strikes at the heart of scientific methodology.

  Your postdoc has sent you a profound piece of work. I. J. Good's 1967 theorem on the expected value of information is indeed a cornerstone of Bayesian decision theory. However, I believe your interpretation of its implications for your old laboratory debates rests on a single, critical condition of the theorem that is often elided in casual discussion.

  Good's proof demonstrates that for a rational agent, the expected utility of obtaining a new piece of evidence is greater than or equal to the expected utility of acting without it **if and only if that evidence is costless.**

  In the abstract space of logic, information is free. In the space of experimental biology, it is never free. It costs money, certainly, but in your specific context, it cost time, opportunity (what other experiments were not run), and, most significantly, the lives and welfare of the animals under your care.

  Therefore, Good's theorem does not vindicate your postdoc's call for infinite cohorts, nor does it condemn your prudence as a "failure of nerve." Rather, it provides the precise mathematical framework to resolve your debate by introducing a cost function. A "Good's-theorem-respecting" stopping rule is not "collect until impossible"; it is "collect until the marginal cost of the next datum exceeds its marginal expected value."

  Here is how such a disciplined programme would look, and where it finds the entitlement to stop.

  ### 1. The Utility Function must include Cost
  In your old arguments, you were implicitly optimizing for *efficiency* (results per dollar), while your postdoc was optimizing for *certainty* (minimizing error). Good's theorem requires a unified utility function, $U$.

  For a lab director, $U$ must look something like this:
  $$ U(Action, State) - Cost(Data) $$

  Where $Cost(Data)$ includes the financial expense of the cohort, the time delay in publishing or applying the findings, and an ethical penalty term for animal usage. If the cost of the next cohort is $C$, and the expected increase in utility from making a better-informed decision due to that cohort is $E[\Delta U]$, you are rationally compelled to stop when:
  $$ C > E[\Delta U] $$

  Your postdoc was correct that $E[\Delta U]$ is never negative (you never expect to be less informed). But you were correct that $C$ is always positive. The stopping point is the intersection of these two curves.

  ### 2. A Sequential Bayesian Design
  To implement this, the laboratory would have to abandon the classical frequentist "fixed sample size" design (e.g., "we will run 3 cohorts of 20 mice") in favor of a sequential Bayesian design.

  *   **Prior:** Before the first cohort, you encode existing knowledge into a prior distribution.
  *   **Update:** After each cohort, you update to a posterior distribution.
  *   **Decision Check:** At each interim point, you calculate the Value of Information (VoI) for the *next* cohort. You ask: "If I run cohort $N+1$, how likely is it to change my decision regarding the hypothesis?"
  *   **Stopping Rule:** If the posterior probability is already so concentrated that further data is unlikely to shift the decision threshold (e.g., from "abandon drug" to "proceed to trial"), the VoI drops toward zero. Once VoI < Cost, the study is finished.

  This is not a failure of nerve; it is a saturation point. When the curve of knowledge flattens, the "expected utility" of the next data point becomes negligible, even if the data itself is costless. But since the data is *not* costless, the stopping point arrives even sooner.

  ### 3. The Ethical Constraint (The 3 Rs)
  As a biologist, you know that "possible" is not a sufficient condition for "permissible." In animal research, the principle of **Reduction** (from the 3 Rs: Replacement, Reduction, Refinement) mandates using the minimum number of animals necessary to achieve scientific objectives.

  A strict adherence to Good's theorem without a cost term would violate the Reduction principle. It would demand sacrificing animals even when the expected gain in knowledge is trivial. Therefore, a philosophically disciplined lab must treat animal welfare as a high-cost term in the utility function. In this light, your "budgetary" worry was actually an ethical imperative. To continue collecting data when the VoI is low is not just fiscally imprudent; it is ethically wasteful.

  ### 4. Bounded Rationality and Opportunity Cost
  There is a second-order cost often ignored in these theorems: the cost of computation and the cost of delay.
  *   **Opportunity Cost:** Money and time spent on Cohort 5 cannot be spent on a new, potentially more fruitful line of inquiry. A rational lab manages a *portfolio* of questions. Good's theorem applies to a single decision in isolation. In a working programme, the "cost" of continuing one study includes the potential value of the *other* studies you are preventing by tying up resources.
  *   **Diminishing Returns:** You mentioned chasing diminishing returns. Mathematically, this is the concavity of the information gain. The first cohort moves your posterior distribution massively. The tenth cohort might move it imperceptibly. Good's theorem accounts for this: the *expected* utility of the tenth cohort is low. If it is lower than the cost, you stop.

  ### Conclusion: When are you entitled to stop?
  To answer your specific question: A programme is entitled to stop gathering evidence when the **marginal expected gain in decision quality falls below the marginal cost of acquisition.**

  Your postdoc was right that information is inherently valuable. You were right that resources are inherently scarce. Good's theorem does not demand you collect data until it is physically impossible to do so; it demands you collect data until it is *economically and ethically irrational* to do so.

  In your decades of running the lab, when you halted a study because the budget was tight or the trends were clear enough, you were not acting irrationally. You were implicitly assigning a cost to information that your postdoc was ignoring. You were practicing what we might call "ecological rationality"—making the best decisions within the constraints of a real, resource-limited environment, rather than an idealized mathematical void.

  The theorem does not prove you lacked nerve. It proves that your intuition about diminishing returns was a practical application of decision theory that accounted for the one variable Good's idealized agent ignores: **cost.**

  You may write back to your postdoc with my compliments, and tell him that while his math is perfect, his accounting is incomplete.
