      *   Why? Because to increase truth content, you generally have to strengthen the theory. Strengthening a false theory expands its falsity content. You can't expand truth content without expanding falsity content *unless* you eliminate the original falsity. But if you eliminate the original falsity, you aren't building on $A$'s content in the way Popper's subset rule requires.
