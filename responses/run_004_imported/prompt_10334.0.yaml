      *   Instead of sets of sentences, look at the "distance" between the theory's description of the world and the actual world.
      *   *Does it solve it?* Yes, it avoids the Tichý/Miller collapse because it doesn't rely on the subset relation of consequences.
      *   *Does it relocate the problem?* Yes. Now the problem is: How do you define "distance" between worlds? How do you weight errors? (Is getting the temperature wrong worse than getting the wind wrong?) This introduces subjectivity/metric dependence that Popper wanted to avoid. Popper wanted an objective logical measure; similarity measures require a prior similarity metric.

