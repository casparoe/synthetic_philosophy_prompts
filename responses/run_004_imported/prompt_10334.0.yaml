      *   Let $A$ and $B$ be two theories.
      *   $Ct_T(A)$ = Truth content of $A$ (set of true consequences).
      *   $Ct_F(A)$ = Falsity content of $A$ (set of false consequences).
      *   Popper's condition for $B$ being closer to truth than $A$ ($Vs(B) > Vs(A)$):
          1.  $Ct_T(A) \subseteq Ct_T(B)$ (B has at least all the truths of A)
          2.  $Ct_F(B) \subseteq Ct_F(A)$ (B has no more falsehoods than A)
          3.  At least one inclusion is proper (strict).
      *   *The Collapse:* If both $A$ and $B$ are false, this definition implies you can't compare them meaningfully to say one is *better*. In fact, Tichý and Miller showed that if $A$ is false, no false $B$ can be closer to the truth than $A$ under this definition.

