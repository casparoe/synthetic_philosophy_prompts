              *   A implies $r$. B implies $\neg r$.
              *   Does A have more truth content than B? A implies $r$ (True). B implies $\neg r$ (False). So A has truth content B lacks.
              *   Does B have more truth content than A? No.
              *   So A is not closer than B under Popper's definition (because B doesn't include A's truth content).
              *   Is B closer than A? B has less truth content. So no.
              *   They are incomparable.
          *   *The Collapse:* Tichý showed that for *any* two false theories, you can't satisfy the subset conditions.
          *   *Why?* Because if $A$ is false, it implies a falsehood $f$. If $B$ is to have $A$'s truth content, $B$ must imply all truths $A$ implies. But since $A$ is false, the "content" is mixed.
          *   *Simpler explanation:* If $A$ is false, it entails $f$. If $B$ entails all of $A$'s truths, does it entail $f$? Not necessarily. But if $B$ is to be "closer," it must not entail *more* falsehoods.
          *   *Miller's point:* If $A$ is false, there is a true statement $t$ and a false statement $f$ such that $A$ is equivalent to $t \land f$ (roughly). If $B$ is closer, it must keep $t$ and drop $f$. But if $B$ drops $f$, it changes the logical structure.
          *   *Actually, the strongest intuition is about logical strength:* To get more truth, you must make stronger claims. To make stronger claims when you are already wrong is to compound the error. To reduce error, you must weaken claims (say less). You can't simultaneously say *more* (to get more truth) and say *less* (to avoid falsity) unless you hit the exact truth.

