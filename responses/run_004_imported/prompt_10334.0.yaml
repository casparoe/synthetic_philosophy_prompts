      *   *The Logic of Consequences:* Theories imply *everything*. If a theory is false, it implies at least one falsehood. But in classical logic, a falsehood combined with anything implies *everything* (Principle of Explosion / *Ex Falso Quodlibet*)? No, wait, Popper isn't using inconsistent theories necessarily. He's using false but consistent theories.
      *   *The Intersection Problem:* Think about the space of all statements. There's the set of True statements ($T$) and False statements ($F$).
      *   A theory is a subset of statements closed under deduction.
      *   If Theory $A$ is false, it has some chunk of $F$. If Theory $B$ is false, it has some chunk of $F$.
      *   Popper requires $Ct_F(B) \subseteq Ct_F(A)$. So $B$ must make *fewer* mistakes.
      *   Popper also requires $Ct_T(A) \subseteq Ct_T(B)$. So $B$ must get *more* rights.
      *   *The Catch:* In classical logic, adding content (making stronger claims) tends to increase *both* truth and falsity content simultaneously.
      *   *Example:* "It is raining" vs. "It is raining and cold."
          *   If it is raining and cold: Both true. Second has more truth content, same falsity content (empty). Good.
          *   If it is raining but warm:
              *   Theory 1: "It is raining." (True)
              *   Theory 2: "It is raining and cold." (False)
              *   Here T1 is true, T2 is false. T1 is better.
          *   If it is not raining:
              *   Theory 1: "It is raining." (False)
