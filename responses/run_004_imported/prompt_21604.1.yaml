  Here is a draft for a eulogy. It is written to be read aloud at a moderate, contemplative pace. It aims to validate the complexity of the week without forcing a medical or philosophical conclusion, focusing instead on Carol's character and the reality of the family's grief.

  ***

  **Eulogy for Carol**

  Thank you all for being here.

  We are gathered to honor Carol. But I think we all know that honoring Carol this week has been… complicated. Grief is rarely a straight line, but this last fortnight has felt less like a line and more like a knot.

  For those of us who loved her, the end of a life is supposed to be a moment. A final breath. A hand letting go. But Carol's goodbye was not a single moment. It was a span of time. It was a Tuesday, and it was a Friday. It was the silence of a mind that had finished its work, and it was the rhythm of a heart that refused to stop beating.

  I know there has been talk about when exactly she left us. I know that for some, the loss happened when the doctors said her brain was gone. And I know that for others, the loss didn't feel real until the machines were quiet and the monitor flatlined days later.

  I am not going to stand here and try to solve that puzzle. I don't think medicine can solve it, and I certainly don't think philosophy can. The truth is, Carol was a woman who defied simple definitions while she was here, and perhaps she decided to defy them as she left, too.

  What I do know is this: I know that Carol's body was strong. Even at the very end, even when the person we knew had already stepped out of the room, her body kept working. It kept warm. It kept breathing. It fought. That was who she was. She was resilient. She was a fighter. Her physiology was as stubborn and generous as her spirit.

  And I know that she chose to give. She signed that donor card not because it was easy, but because she understood that her life was meant to be useful. Those extra days on the ventilator were not just a medical limbo. They were a final act of service. In that space between the Tuesday and the Friday, in that strange, suspended time where her heart beat for the last time, she was already giving pieces of herself to strangers she would never meet.

  So, if you are someone who believes she left us on Tuesday, you are right. The light behind her eyes was gone. The conversation was over.
  And if you are someone who believes she left us on Friday, you are right, too. Because until that heart stopped, she was still physically here, still warm to the touch, still part of the biological world we all share.

  We don't need to agree on the timestamp to agree on the loss.

  The difficulty of this week doesn't diminish the reality of her life. Carol was not defined by how she died, or by the mechanics of her organs. She was defined by the way she made us feel when she walked into a room. She was defined by her laugh, which was too loud for quiet places. She was defined by the way she remembered birthdays, and the way she could make a pot of coffee smell like comfort.

  That Carol is still here.

  The hard truth of death is that it forces us to confront the limits of our understanding. We want to know when the soul departs. We want to know when the body becomes a memory. But maybe the boundary isn't as sharp as we want it to be. Maybe love is the only thing that doesn't obey the clock.

  To her daughter, who held her hand through both the Tuesday and the Friday: Your grief is valid. You watched the whole journey.
  To her husband, who had to make the impossible calls: Your understanding is valid. You protected her wishes.
  To all of us: Our confusion is valid. It is okay to feel unsettled by how this happened. It is okay to feel that the timeline was wrong.

  Carol's body has stopped now. The struggle is over. But the giving continues. There are people in this city, right now, who are waking up with better eyes, better kidneys, better hearts because Carol's body kept working long enough to save them. In a very real way, she is still beating. She is still breathing. Just not in a hospital bed.

  So let us not fight over the hour of her departure. Let us honor the duration of her arrival. She was here for [Number] years. She loved us. She fed us. She argued with us. She gave to us. And in the end, even when the science got complicated, she gave to us one last time.

  Rest now, Carol. The machines are off. The noise is gone. You are whole again.

  Thank you.
