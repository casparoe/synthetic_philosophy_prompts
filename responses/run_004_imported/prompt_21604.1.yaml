prompt: |-
  So this is a strange thing to be asking an AI for help with, but here we are. My aunt Carol died about two and a half weeks ago — massive stroke, rushed to the hospital, and after roughly two days the neuro team declared her brain dead. Except her heart kept beating on the ventilator, she was warm, her chest was rising and falling, all of it, and because she was a registered organ donor they kept her on the machines for three more days to match her organs before actually withdrawing support. So there were basically two "deaths" that week: the Tuesday when the doctors did the brain death exam and pronounced her, and the Friday when the vent finally got switched off after the organs were taken. My uncle keeps saying she died Tuesday, that that's just what brain death is, full stop. My cousin (her daughter) can't except that and insists her mom didn't actually leave until the heart monitor flatlined on Friday. And it's not only semantics, because if she wasn't really dead yet on Wednesday when they took the organs, that's kind of a different, much dicier story.

  This whole thing turned into a two hour argument with my friend Priya, who's in med school, about whether brain death is real death or just a useful legal fiction everyone's agreed to so transplant medicine can actually function. She kept giving me the standard line, that once the brain (brainstem included) is irreversibly gone, the organism as a whole loses its integrating center and stops being a unified living thing even though individual organs are still ticking along fine. I kept bringing up half remembered stuff about a neurologist, Shewmon I think, who documented brain dead bodies doing things they're not supposed to be able to do without a working brain, sometimes for years afterward — healing wounds, fighting infections, even gestating a pregnancy to term in one case — plus the Jahi McMath case, where the family moved her to New Jersey specifically because it has a religious exemption to the brain death standard, and she apparently went through puberty at some point while still being legally deceased. Neither of us budged, we just both got more stubborn about it, and I don't think either of us actually changed the other person's mind at all.

  Anyway, I'm the one giving the eulogy at the actual funeral this weekend (the one after Friday, obviously), and I don't want to default to comfortable sounding nothing about her "passing peacefully" that papers over what was honestly a pretty disputed, strange week. At the same time I am not about to get up in front of grieving people, half of them firmly team-Tuesday and half firmly team-Friday, and try to referee a philosophy of death debate over her casket. Could you draft me a eulogy, maybe 5ish minutes read out loud, that's honest enough that Priya and I wouldn't wince at it, but that still works as an actual eulogy for a room of normal grieving non-philosophers — something that can hold both Tuesday and Friday as real without resolving which one was "the" moment, and without it being obvious that it's carefully avoiding resolving that?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Context:** The user's Aunt Carol died 2.5 weeks ago. She was declared brain dead on a Tuesday, but life support was maintained until Friday for organ donation.
      *   **Conflict:** There's a family split. The uncle says she died Tuesday (brain death). The cousin (daughter) says she died Friday (cardiac death). This isn't just semantic; it touches on the ethics of organ donation and the definition of life/death.
      *   **User's Stance:** The user had a debate with a med school friend (Priya) about this. The user knows the counter-arguments (Shewmon, Jahi McMath) but acknowledges the medical/legal standard (brain death = death).
      *   **Task:** Write a eulogy (approx. 5 minutes spoken).
      *   **Constraints:**
          *   Must be honest (not gloss over the complexity with "passed peacefully").
          *   Must *not* be a philosophical debate/referee match.
          *   Must accommodate both "Tuesday" and "Friday" perspectives without explicitly resolving which one is "true."
          *   Must work for a grieving audience (normal non-philosophers).
          *   Tone: Respectful, poignant, unifying, acknowledging the difficulty without causing division.

  2.  **Deconstruct the Challenge:**
      *   *The Elephant in the Room:* Everyone knows the timeline was complicated. Ignoring it feels fake. Addressing it directly risks reopening the wound/argument.
      *   *The Solution:* Focus on the *continuity* of Carol's love and legacy rather than the *mechanics* of her cessation. Acknowledge the "long goodbye" without labeling the exact moment of death. Frame the medical intervention as an extension of her generosity (organ donation) rather than a state of limbo.
      *   *Key Themes:* Generosity, the body vs. the person, the lingering presence, the difficulty of letting go.
      *   *Avoid:* Words like "brain dead," "vegetative," "legal fiction," "Tuesday vs. Friday," "machines kept her alive."
      *   *Include:* Acknowledgment of the struggle, the gift of donation, the enduring spirit.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the difficulty of the last few weeks. Validate the confusion and pain without getting technical.
          *   *Idea:* Start with the idea that goodbyes are rarely clean.
      *   **The Middle (The Complicated Week):** Address the timeline subtly. Frame it as a period of transition and generosity.
          *   *Idea:* The body stayed, the spirit moved. The time on the ventilator wasn't just "waiting," it was "giving." This validates the Friday crowd (heart beating) and the Tuesday crowd (she was gone) by focusing on the *purpose* of that time (donation).
      *   **The Middle (Her Character):** Who was Carol? Need to ground this in her life, not just her death.
          *   *Idea:* She was a giver. This final act fits who she was.
      *   **The Resolution (Unifying Tuesday and Friday):** How to bridge the gap?
          *   *Idea:* Death isn't a single switch; it's a process. The love remains regardless of the timestamp. Acknowledge that different people hold different memories of the end, and both are valid experiences of loss.
      *   **Closing:** A send-off that looks forward.
          *   *Idea:* She lives on in the recipients (organ donation) and in the family.

  4.  **Refining the Tone (Iterative Process):**
      *   *Critique:* Is it too clinical?
      *   *Fix:* Add more warmth. Use metaphors of light, echoes, gifts.
      *   *Critique:* Is it too vague?
      *   *Fix:* Be specific about the *feeling* of that week. The waiting, the hope, the resignation.
      *   *Critique:* Does it address the "Tuesday vs. Friday" split without saying it?
      *   *Fix:* Use phrasing like "For some of us, she left us when the mind went quiet. For others, she left us when the heart slowed." No, that's too explicit. Better: "There is no single moment that captures it all." "The timeline of loss doesn't always match the timeline of medicine."

  5.  **Drafting the Content (Mental or Scratchpad):**
      *   *Start:* We are here after a hard week.
      *   *Body:* Carol was generous. She signed that donor card. The last few days were hard. The machines made it confusing. But her generosity was clear.
      *   *Philosophy:* When does someone die? When they stop talking? When the heart stops? Maybe it's both. Maybe it's neither.
      *   *End:* She is in the people she saved. She is in us.

  6.  **Polishing for the "Shewmon/Priya" Constraint:**
      *   The user wants something that wouldn't make Priya (med school) wince (so, scientifically literate enough to not deny brain death outright) but also acknowledges the user's skepticism (that the body did things brains shouldn't do).
      *   *Strategy:* Focus on the *organism* vs. the *person*. Acknowledge the body's resilience without calling it "life" in the personal sense. "Her body worked to her very last breath, just as she always did." This satisfies the "body was alive" view without denying the "person was gone" view.

  7.  **Final Review against Constraints:**
      *   5 minutes? (Approx 700-800 words).
      *   No "passed peacefully"? (Check).
      *   No refereeing the debate? (Check).
      *   Honors the donation? (Check).
      *   Honors the grief? (Check).

  8.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure not to imply the organs were taken *before* death, which is the legal/ethical line. Phrase it as "in the space between."
      *   *Correction:* Ensure the cousin (daughter) feels heard. Her experience of watching the heart stop is valid grief. Ensure the uncle feels heard. His understanding of the medical reality is valid.
      *   *Key Phrase:* "The clock of the heart and the clock of the soul do not always strike the same hour."

  9.  **Final Output Generation:** (Proceeding to write the eulogy based on these thoughts.)
