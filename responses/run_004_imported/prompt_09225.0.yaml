answer: |-
  It is a pleasure to meet a colleague from the other side of the epistemic divide. Thirty-five years of Bayesian parameter estimation gives you a claim to intuition that most armchair philosophers would kill for. You have lived the diachronic update; they merely write papers about it.

  Your annoying friend (solid-state physicists do tend to be annoyingly precise about edge cases) has served you a classic counterexample, one that has kept epistemologists busy for decades. But the conclusion you are drawing—that this sinks the Dutch Book argument entirely and perhaps undermines synchronic probabilism—is too pessimistic.

  Here is the breakdown of why your intuition was right for the observatory, why the Reflection Principle needs a "calibration filter," and why the synchronic Dutch Book argument is safer than you fear.

  ### 1. The Brainwashing Case and the Scope of Reflection
  You are correct that the "cult/brainwashing" case violates the naive formulation of Van Fraassen's Reflection Principle. If the principle were simply "match your future credence," it would demand epistemic suicide whenever you anticipate irrationality.

  However, most contemporary Bayesians (including Van Fraassen in later clarifications, and critics like David Christensen and Adam Elga) agree that this counterexample does not kill Reflection; it **delimits** it.

  Reflection is not a principle about *temporal identity*; it is a principle about *epistemic trust*. The formal principle is usually written as:
  $$ P_{now}(A \mid P_{future}(A) = r) = r $$
  The crucial hidden premise in your working rule at the observatory was not just that the data would arrive, but that the data would be the result of a **calibrated instrument measuring reality**.

  In the brainwashing case, you have positive evidence that the causal process producing your future credence is *decoupled* from the truth of the matter (the moon landing). You know the future credence is generated by noise/manipulation, not evidence. Therefore, the condition $P_{future}(A) = 0.95$ is not treated as evidence about $A$; it is treated as evidence about your brain state.

  **The Fix:** Reflection holds only when you regard your future self as a **rational updater** relative to your current self. If you know your future self will be irrational (brainwashed, tired, drunk, or reading tabloids), you are not required to reflect. In fact, coherence demands you *don't*.

  So, your friend is right that the *unrestricted* principle is false. But the *restricted* principle (Reflection for rational updates) stands. Your intuition wasn't wrong; it was implicitly restricted to "trust the posterior... [assuming the data release is valid]."

  ### 2. Does this sink the Diachronic Dutch Book?
  The Diachronic Dutch Book argument says: If you violate Reflection (or Conditionalization), a bookie can construct a series of bets available at different times that guarantee you a loss.

  The brainwashing case shows that a Diachronic Dutch Book can only be constructed if the agent *should* have updated. If I know I am about to be brainwashed, and I refuse to update my credence to match my future brainwashed self, I am not irrational; I am sane. A bookie cannot Dutch Book me for refusing to align with a known irrational future state.

  This doesn't make the Diachronic Dutch Book a "dud"; it just means the vulnerability only exists when the agent lacks definitive evidence that their updating mechanism is compromised. In your work, you never had evidence the next data release was "brainwashing." You assumed it was signal. Under that assumption, the Diachronic Dutch Book argument remains robust.

  ### 3. The Worry About Synchronic Probabilism
  This is the more serious part of your worry: *If the diachronic argument is shaky, is the synchronic one (probabilism) also compromised?*

  The consensus in formal epistemology is **no**. The two arguments rely on different structures.

  *   **Synchronic Dutch Book (Probabilism):** This relies on the logical relationships between propositions *at a single time*. If your credences violate the axioms of probability (e.g., $P(A) + P(\neg A) \neq 1$), you can be booked *immediately*. It doesn't matter how you got there, or where you are going. It is a static inconsistency, like asserting $X$ and $\neg X$ simultaneously.
  *   **Diachronic Dutch Book (Reflection/Conditionalization):** This relies on the relationship between time-slices. It assumes a connection between the agent at $t_1$ and the agent at $t_2$.

  The brainwashing case severs the normative connection between $t_1$ and $t_2$. It does not sever the logical connection between $A$ and $\neg A$ at $t_1$.

  Think of it like instrument calibration:
  *   **Synchronic:** If your voltmeter reads +5V and -5V across the same terminals at the same instant, the meter is broken. (Violates Probability).
  *   **Diachronic:** If your voltmeter read 0V yesterday and reads 10V today, is it broken? Only if you know the circuit didn't change. If someone swapped the circuit (brainwashing), the change is justified. If the circuit was static and the meter jumped, it's drift (violation of Conditionalization).

  The fact that "swapping the circuit" excuses the change doesn't mean the voltmeter doesn't need to be internally consistent at any given moment.

  ### 4. Why Your Intuition Felt Right
  You mentioned your working rule: *"Trust the posterior after the next data release over your current hunch."*

  This worked for 35 years because in radio astronomy, you operate under a **presumption of rationality** regarding the instrument. You assume:
  1.  The noise is random (stochastic), not adversarial.
  2.  The calibration pipeline is truth-tracking.
  3.  The future data is *evidence*, not *cause*.

  Van Fraassen's Reflection Principle is essentially the mathematical formalization of that presumption. It says: "Treat your future self as a calibrated instrument." When your physicist friend introduces the cult, he is effectively saying, "What if the instrument is being deliberately recalibrated by a saboteur?"

  Of course the rule fails then! But that doesn't mean the rule was useless for the previous 35 years. It means the rule is *context-sensitive*.

  ### Summary
  1.  **The Counterexample:** Your friend is right that the *unrestricted* Reflection Principle is false. You should not align with a future self you know to be irrational.
  2.  **The Principle's Status:** Reflection survives as a norm for *rational* learning. It requires that you view your future credence as a response to evidence, not a causal manipulation.
  3.  **The Dutch Book:** The Diachronic Dutch Book argument holds only when the update is meant to be evidential. The Synchronic Dutch Book argument (for basic probabilism) remains untouched because it relies on logical consistency, not temporal trust.
  4.  **Your Intuition:** Your professional heuristic was correct *within its domain*. You implicitly conditioned on "the data is real." Epistemology just makes that condition explicit.

  You can tell your reading group that the Reflection Principle isn't dead; it just requires a "System Health Check" before application. If the check passes (no cults, no brainwashing, no known calibration drift), the Dutch Bookie is still waiting for anyone who violates it.
