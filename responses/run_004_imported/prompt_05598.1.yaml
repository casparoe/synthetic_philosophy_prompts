  8.  **Self-Correction during drafting:** I initially thought he might accept the zombie as proof of dualism. But wait, if the zombie behaves *exactly* like a human, including language, Descartes' criterion for a soul is met. So he must deny the *possibility* of the zombie, not accept its implications. That's the key tension. Chalmers says "Zombies are conceivable." Descartes says "A language-using machine is *inconceivable*." That's the conflict.

  9.  **Finalizing the Output Structure:**
      *   Executive Summary.
      *   Three Core Philosophical Pushbacks (Language, Theology, Epistemology).
      *   The "Beast-Machine" Reframing.
      *   Dialogue/Scene Beats.
      *   The Verdict.

