answer: |-
  **Title:** The Ledger of Liberty: Adam Smith's Radical Case Against Empire in *The Wealth of Nations*

  **Introduction**
  In Book IV, Chapter VII of *The Wealth of Nations*, Adam Smith opens his discussion of colonies with a statement that seems to celebrate imperialism: he calls the discovery of America and the passage to the East Indies the "two greatest and most important events recorded in the history of mankind." It is easy to read this as an endorsement of European expansion. However, to stop there is to ignore the devastating economic and moral audit that follows. While standard interpretations often cast Smith as a mere critic of mercantilist *management*—suggesting he would support an empire run on free-trade principles—a close reading of Books IV and V reveals a far more radical position. Smith does not simply want to fix the British Empire; he argues that empire itself is economically irrational and morally indefensible. Through his analysis of defense costs, his condemnation of the East India Company, his historical comparison of Greek and Roman colonies, and his impractical proposal for parliamentary representation, Smith constructs a *reductio ad absurdum* against imperial retention. He is not an architect of a benevolent empire, but a theorist of decolonization.

  **The Economic Ledger: Defense and the "Nation of Shopkeepers"**
  Smith's primary weapon against empire is the balance sheet. In the mercantilist view, colonies exist to enrich the metropole through monopoly trade. Smith dismantles this by shifting the focus from private profit to public cost. He argues that when the cost of defending and administering the colonies is factored in, the empire yields a net loss for Britain. The monopoly profits accrue to a small class of merchants, while the burden of defense falls on the public treasury.

  This leads to Smith's famous, often misquoted description of Britain as a "nation of shopkeepers." In context, this is not merely a descriptor but a critique of imperial overreach. Smith writes that governing distant colonies is "altogether unfit" for a nation of shopkeepers, not because they are inherently ignoble, but because their interest lies in cheap goods and peaceful commerce, not in the expensive project of military domination. By framing imperial governance as a distraction from domestic capital accumulation, Smith argues that empire is a drag on the very wealth it claims to generate. If the economic purpose of the state is the wealth of the people, and empire drains that wealth to pay for garrisons, then empire is a policy failure.

  **Corporate Sovereignty and the Bengal Catastrophe**
  If the economic argument suggests empire is foolish, Smith's analysis of the East India Company (EIC) argues that it is tyrannical. In Book V, Smith turns his gaze to Bengal, offering a brutal critique of corporate sovereignty. He posits a fundamental incompatibility between the character of a merchant and the character of a sovereign. A merchant's goal is profit maximization, often through monopoly and exploitation; a sovereign's goal is the welfare of the subjects.

  Smith writes that when a company of merchants becomes a sovereign, "they consider the country as a shop," and the inhabitants as inventory to be liquidated. He details how the EIC's rule in Bengal led to famine and devastation, not through accident, but through structural necessity. A trading company cannot govern justly because its incentives are perverse. This is not an argument for better regulation of the EIC; it is an argument that a monopoly trading company makes "about the worst possible sovereign." By extension, Smith suggests that an empire reliant on such corporate vehicles is inherently corrupt. There is no "free trade" version of the EIC's rule in Bengal; the structure of corporate imperialism precludes justice.

  **Historical Precedent: Greece vs. Rome**
  Smith anchors these economic and moral arguments in historical precedent, specifically comparing the colonial practices of ancient Greece and Rome. He notes that Greek city-states treated their colonies like children who, upon reaching maturity, were emancipated to form independent republics. These colonies retained cultural and commercial ties with the mother city but were politically sovereign. In contrast, Rome treated colonies as subordinate garrisons, bound by force and administration.

  Smith clearly favors the Greek model. He observes that the Greek colonies flourished precisely because they were free, while the Roman model sowed the seeds of future conflict and collapse. By highlighting the Greek example, Smith provides a blueprint for British policy that looks suspiciously like independence. He implies that the natural state of a successful colony is independence, and that holding them by force (the Roman model) is both unnatural and unsustainable. This historical analogy serves to normalize the idea of separation, framing it not as a loss of British power, but as a return to the natural order of political development.

  **The Representation Trap**
  The strongest evidence for Smith's radicalism, however, lies in his proposed solution to the colonial crisis. In Book IV, Smith suggests that if Britain wishes to retain the colonies, it must grant them representation in Parliament proportional to their tax contribution. He calls this the only "great charter of security" for the colonies. On the surface, this looks like a reformist plea to keep the empire together. However, Smith immediately undercuts the proposal by admitting it is politically impossible. He acknowledges that the British aristocracy would never dilute their power by allowing American or Indian representatives into Westminster.

  This proposal functions as a *reductio ad absurdum*. Smith sets up a condition for legitimate imperial rule (representation) that he knows the metropole will never accept. By establishing that taxation without representation is tyranny, and that representation is impossible, he logically leaves only one remaining option: separation. He is not seriously proposing a trans-Atlantic parliament; he is demonstrating that the political distance between London and the colonies is unbridgeable. The "plan" is actually a polite way of arguing that Britain should let the colonies go before they are forced to by violence.

  **Conclusion**
  Returning to Smith's opening claim that the discovery of the Americas was one of humanity's greatest events, we must read this not as an endorsement of empire, but as an acknowledgment of historical inevitability. Smith recognizes that global connection is irreversible, but he vehemently argues that political domination is not. The "greatness" of the event lies in the potential for global commerce and human improvement, not in the subjugation of one people by another.

  Adam Smith is often remembered as the prophet of the invisible hand, but in *The Wealth of Nations*, he is also the auditor of imperial bankruptcy. By demonstrating that colonies are a net economic loss, that corporate sovereignty is inherently abusive, and that political retention requires impossible reforms, Smith moves beyond mere anti-mercantilism. He presents a case that empire is incompatible with both justice and economic rationality. His professor is correct to hint at Smith's radicalism: Smith does not want to manage the British Empire better; he wants to dismantle it, arguing that a "nation of shopkeepers" should be wise enough to let its children go.
