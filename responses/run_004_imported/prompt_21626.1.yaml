      *   *The "Last Message" Logic:* This is the crux. Focus on the sender of the final message. They are always in the dark.
      *   *Why it feels wrong:* Probability vs. Certainty. In fiction, characters usually gamble. In theory, they are perfectly rational and risk-averse.
      *   *Writing Advice:* How to translate this into a scene. Anxiety, the diminishing returns of messages, the realization that they are stuck in a loop.

  6.  **Refining the "Common Knowledge" Explanation:**
      *   *Mutual Knowledge:* I know X. You know X.
      *   *Common Knowledge:* I know X. You know X. I know that you know X. You know that I know X. I know that you know that I know X... (Infinite).
      *   *Analogy:* It's like looking in two mirrors facing each other. The reflection goes on forever. If the glass is dirty (unreliable courier), you can never see the infinite depth.

  7.  **Addressing the Novel Context (WWII Resistance):**
