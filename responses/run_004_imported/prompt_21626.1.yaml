  10. **Self-Correction/Nuance:** I need to make sure I don't say it's *impossible to coordinate ever*. It's impossible to coordinate with *guaranteed certainty*. Real humans take risks. The theoretical problem assumes perfectly rational actors who refuse to act without 100% assurance. I need to make sure the author understands that their characters *can* act, but they must accept the risk, which is the source of the drama. The "wall" they hit is the realization that perfection is impossible, not that action is impossible.

