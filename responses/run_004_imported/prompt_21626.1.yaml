answer: |-
  You are absolutely remembering correctly. This is a famous thought experiment in computer science and game theory called the **Two Generals' Problem**.

  It is one of the few times in mathematics where the answer isn't "it's really hard," but rather "it is strictly impossible."

  Here is the explanation of why it breaks, why it feels wrong, and how to write your characters hitting that wall.

  ### 1. The Logic: The "Last Message" Paradox
  The intuition tells us that 10 confirmations are safer than 1. Mathematically, regarding *probability*, you are right. But regarding *certainty*, you are not.

  To understand why, you have to look at the chain of messages from the **end** backward, not the beginning forward.

  Let's say Cell A and Cell B are exchanging messages via a courier who has a 10% chance of capture.
  *   **Message 1 (A to B):** "Attack at dawn."
      *   *Problem:* A doesn't know if B got it. A won't attack alone.
  *   **Message 2 (B to A):** "Received. Attack at dawn."
      *   *Problem:* B knows A sent the plan, but B doesn't know if A received this confirmation. If A didn't receive it, A won't attack. So B won't attack alone.
  *   **Message 3 (A to B):** "Received your confirmation."
      *   *Problem:* A doesn't know if B got *this* message. If B didn't get it, B thinks A never got Message 2, so B won't attack. So A won't attack.

  **Here is the killer:**
  Imagine they decide to stop after **100 messages**.
  The sender of Message 100 has no way of knowing if that message arrived. Because they don't know if it arrived, they cannot be certain that the *other* cell knows the plan is a "go." Because they aren't certain the other cell knows, they won't attack (fearing they'll attack alone and die).

  But if the sender of Message 100 won't attack, then the receiver of Message 100 (who is waiting for the sender to act) knows the sender is hesitant. So the receiver won't attack either.

  If the 100th message doesn't guarantee safety, then the 99th message (which confirms the 98th) is useless, because it relies on the 100th to seal the deal. The uncertainty unravels the entire chain backward like a pulled thread in a sweater.

  No matter how long the chain is, the **last sender is always in the dark.** And if the last sender is in the dark, the coordination fails.

  ### 2. Mutual Knowledge vs. Common Knowledge
  This is the technical distinction you recalled.

  *   **Mutual Knowledge:** I know the plan. You know the plan.
  *   **Common Knowledge:** I know the plan. You know the plan. **I know that you know the plan. You know that I know the plan. I know that you know that I know the plan...** (ad infinitum).

  To attack simultaneously without fear, you need **Common Knowledge**.
  Unreliable couriers can only ever create **Mutual Knowledge**.

  Every time a courier successfully runs the blockade, you add one more layer to the stack ("I know that you know..."). But because the courier *might* be caught, the stack is always finite. It never becomes infinite. And in strict game theory, a finite stack collapses to zero certainty.

  ### 3. Why It Feels Counterintuitive
  It feels wrong because in real life, **we deal in probabilities, not certainties.**

  If you tell a human, "There is a 99.999% chance your partner knows the plan," they will attack. The mathematical proof assumes "perfectly rational actors" who will *never* act without 100% guarantee because the cost of failure (death/capture) is infinite.

  Your characters feel the tension between the math and the gut. Their guts say, "Three confirmations is enough." Their training says, "If there is any doubt, we hold."

  ### 4. Writing the Scene: How to Make it Real
  Since you want them to hit this wall for real reasons, the drama shouldn't be "Oh no, the courier was caught!" The drama should be **Paralysis by Analysis.**

  Here is how you can stage that realization:

  **The Setup:**
  They have agreed on a protocol. "We will exchange three confirmations, then strike."
  The third courier leaves Cell A to go to Cell B.

  **The Conflict:**
  Time passes. The courier hasn't returned to Cell A to confirm delivery.
  *   **Cell A Leader:** "He hasn't come back. Maybe he was caught. If he was caught, Cell B never got the third message."
  *   **Cell B Leader (simultaneously):** "We got the third message. But Cell A doesn't know we got it. If we attack, and Cell A thinks the courier was caught, they won't attack. We'll be alone."

  **The Realization:**
  Have one character (maybe a radio operator or a strategist) realize the infinite loop.
  *"It doesn't matter if we send ten more couriers. The last one sent is always the weak link. The sender never knows if the receiver got the final 'Go'. And if the sender doesn't know, they won't pull the trigger. And if they won't pull the trigger, neither can we."*

  **The Resolution (for the novel):**
  Since the math says they can't do it, how do they do it? **They gamble.**
  This is where character comes in. To break the theoretical deadlock, a human must introduce **irrational trust.**
  One leader has to say: *"Theoretically, we can't be sure. But if we wait for certainty, the war ends before we fire a shot. We assume the message got through. We attack."*

  That creates beautiful tension: They aren't attacking because they *know* it will work. They are attacking because they *accept* they might die alone. That is the essence of resistance.

  ### Summary for your notes:
  1.  **The Problem:** Two Generals' Problem.
  2.  **The Glitch:** The sender of the final message never knows if it arrived. Therefore, they never act. Therefore, no one acts.
  3.  **The Concept:** You can never turn "Mutual Knowledge" into "Common Knowledge" over an unreliable channel.
  4.  **The Scene:** The horror isn't interception; it's the realization that **perfection is impossible.** They must choose to act on faith, not logic.
