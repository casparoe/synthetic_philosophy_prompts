answer: |-
  First off, your obsession is not weird at all. In fact, you have stumbled onto one of the most vibrant debates in contemporary social ontology. The reason this feels so visceral to you is that it touches on the difference between being *inconvenienced* by an individual and being *wronged* by a partner.

  Your housemate gave you a solid summary. To answer your request, I'm going to break down exactly how Bratman and Gilbert would diagnose your bassist's text message, explain the specific mechanics of why Bratman rejects Gilbert's "permission" requirement, and then offer an evaluation of which theory holds more water generally.

  ### 1. Michael Bratman: The Planning Theory of Shared Intention

  **The Mechanics:**
  For Bratman, there is no such thing as a "group mind" or a "plural subject." There is only you, the bassist, the drummer, and the guitarist. "Shared intention" is just a specific structure of interlocking individual intentions.
  *   **You intend** that *we* play the gig.
  *   **The Bassist intends** that *we* play the gig.
  *   **Crucially:** You both know the other intends this, and you both intend to do your part *because* the other is doing theirs (interdependence).
  *   **Meshing Sub-plans:** Your plan (practice songs) and his plan (show up with bass) fit together to achieve the goal.

  **The Verdict on Your Bassist:**
  Under Bratman's view, did your bassist need permission to quit? **No.**
  Bratman is a libertarian about individual agency. You cannot be held hostage by a past intention. If the bassist no longer intends to play, he simply... doesn't intend to play. The "shared intention" dissolves because one of the necessary individual components is gone.

  **So why were you right to be angry?**
  Bratman argues that intentions aren't just wishes; they are **planning states**. Once I form an intention, I create a framework for my future action and, crucially, for *your* reliance on me.
  *   **Norm of Stability:** We are rational agents. We are supposed to stick to our plans so others can coordinate around them.
  *   **Norm of Coordination:** If you must change your plan, you have an obligation to communicate that change in a way that allows the others to adjust *their* plans.

  Your bassist didn't break a "contract"; he violated the **norms of planning agency**. By texting four days out with no discussion, he failed his duty of coordination. He knew you were relying on his stability to plan your set, your travel, and your expectations. He didn't need your permission to leave, but he *did* owe you a process of negotiation to minimize the damage to your planning structure. He treated a shared plan as a private preference, which is a rational failure.

  ### 2. Margaret Gilbert: The Joint Commitment Theory

  **The Mechanics:**
  Gilbert argues that Bratman's view is too thin. She says you can have interlocking intentions without feeling obligated to each other (e.g., two strangers walking in the same direction might have interlocking intentions to avoid colliding, but they don't owe each other anything).
  For Gilbert, when you formed the band and agreed to take the gig, you didn't just align your individual minds; you created a **Plural Subject**. This is a new ontological entity—a "We."
  *   This "We" is constituted by a **Joint Commitment**.
  *   A joint commitment is not the sum of two personal commitments; it is a single commitment owned by the pool of all parties.
  *   **Normativity:** This creates obligations *sui generis* (in a class of their own). You don't just owe it to the band to show up; you owe it to *me* as a co-creator of this commitment.

  **The Verdict on Your Bassist:**
  Under Gilbert's view, did your bassist need permission to quit? **Yes.**
  This is the hardline part. Because the commitment belongs to the "We," no single individual has the authority to dissolve it.
  *   To quit legitimately, the bassist needed to propose the dissolution of the joint commitment.
  *   The rest of the band needed to concur (release him).
  *   Until that moment of mutual release, he remained bound.

  **Why you were right to be angry:**
  For Gilbert, your anger isn't just about reliance or inconvenience; it's about **rights**. As a co-member of the plural subject, you had a *right* to his performance. By texting "can't do it, sorry," he didn't just change his mind; he usurped authority he didn't have. He treated a joint obligation as if it were his personal property to discard. He didn't just let you down; he violated the normative structure of the group itself.

  ### 3. The Crux: Why Bratman Thinks Gilbert is "Too Strong"

  You asked specifically for Bratman's argument against Gilbert's permission requirement. This is the technical heart of the debate.

  Bratman argues that Gilbert's requirement for mutual consent to withdraw makes joint action **too rigid** to match how human agency actually works. He uses examples like "Going for a Walk."

  **The Walk Example:**
  Imagine you and I form a joint commitment to go for a walk together. Halfway through, I get a cramp.
  *   **Gilbert's View:** Technically, I am still bound by the joint commitment. To stop walking, I need your concurrence to dissolve the commitment. If I just stop, I am violating the commitment.
  *   **Bratman's View:** This is absurd. I should be able to stop walking if I have a good reason, provided I communicate it. I don't need your *permission* to end my participation; I just need to fulfill my obligation of *coordination* (telling you so you aren't left confused).

  **Bratman's Critique:**
  1.  **Paralysis:** If every joint action required mutual consent to end, we would be paralyzed. It gives every participant a veto power over the others' future autonomy.
  2.  **Unnecessary Metaphysics:** Bratman is an Occam's Razor guy. He thinks we can explain the obligation (the anger you feel) without inventing a "Plural Subject." The obligation comes from the **harm done to the other's planning agency**, not from breaking a mystical group bond.
  3.  **The "Right to Unilaterally Withdraw":** Bratman argues that in informal contexts (like a band or a walk), individuals retain a right to withdraw unilaterally *if* they handle the social fallout correctly (apologizing, compensating, warning). Gilbert's view erases that right.

  In your case, Bratman would say Gilbert is wrong to claim the bassist *couldn't* leave without permission. He *could*. But he failed to manage the withdrawal in a way that respected you as a planning agent.

  ### 4. Which Account is Closer to Right?

  This is the evaluation you asked for. I am going to side with **Bratman**, but with a significant caveat regarding your specific emotional experience.

  **Why Bratman wins on General Theory:**
  Bratman's theory is more robust because it scales better to the messy reality of human life. Gilbert's theory works beautifully for high-stakes, formalized groups (a marriage, a military unit, a legal partnership). But for the vast majority of human "joint action"—friends meeting for dinner, a casual band, a pickup basketball game—Gilbert's requirement for mutual consent to withdraw is too heavy.
  If Gilbert is right, then every time a friend leaves a dinner party early without asking everyone if it's okay, they are committing a normative violation of the "plural subject." That dilutes the meaning of obligation. Bratman captures the nuance: you have an obligation to *coordinate*, not an obligation to *stay*. This preserves individual autonomy while still explaining why we get mad when people flake.

  **Why Gilbert wins on Phenomenology (The Feeling):**
  However, Gilbert explains *your anger* better than Bratman does.
  Bratman explains why the bassist was *irrational* or *uncooperative*. Gilbert explains why he was *faithless*.
  When you say it felt like he "specifically wronged the rest of us," you are describing a violation of a relationship, not just a disruption of a plan. Bratman reduces the band to a web of individual utilities. Gilbert acknowledges that the band became a "We" that had a claim on him. Your intuition that he needed "permission" (or at least a negotiation) aligns with Gilbert's view that the commitment wasn't his alone to break.

  **The Synthesis:**
  As a general theory of action, **Bratman is closer to right.** It avoids the metaphysical bloat of the "Plural Subject" and accounts for the fluidity of informal cooperation. It correctly identifies that the bassist *could* leave, but *shouldn't have* done it that way.

  However, as a theory of **moral obligation within close groups**, Gilbert captures something Bratman misses. In a band that has been together for three years, you aren't just planning agents; you are partners. In that specific context, Gilbert is right that the obligation feels like a bond that requires mutual dissolution.

  **Conclusion for your situation:**
  Philosophically, the bassist was wrong on both accounts.
  *   **On Bratman's view:** He failed the norms of stability and coordination, sabotaging your ability to plan.
  *   **On Gilbert's view:** He violated a joint commitment he had no right to dissolve unilaterally.

  You don't need to choose a side to validate your anger. But if you want to understand *why* it hurt so much: It's because human beings naturally operate on something like Gilbert's intuition (we feel bonded), even if Bratman is right about the mechanics of how that bonding works. He treated a "We" problem as an "I" solution. That is the definition of betrayal, contract or no contract.
