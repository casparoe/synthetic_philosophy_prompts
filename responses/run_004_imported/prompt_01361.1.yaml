      *   *Nuance:* Nietzsche distinguishes between the "freedom of the will" (theological) and "freedom from the will" (psychological liberation).
      *   *Key Insight:* Strawson says "You can't be responsible." Nietzsche says "You *are* responsible, just not in the way you think. You are responsible as a manifestation of necessity." Actually, better: Nietzsche says "Responsibility is for the strong to impose on themselves, not a metaphysical fact to be discovered."
      *   *Wait, check BGE 21:* Nietzsche explicitly says the problem of free will is a theological trap. He wants to abolish the "guilt" aspect. So he *does* agree that *moral* responsibility (guilt) is impossible/undesirable. But he wants *aesthetic* responsibility (ownership).
      *   *Decision:* The Nietzschean character should argue that Strawson is stuck in the moral framework he's trying to dismantle. Strawson is sad that *causa sui* is impossible. Nietzsche is *relieved*.

