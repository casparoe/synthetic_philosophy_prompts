answer: |-
  Your friend is right, but with some important caveats that validate your skepticism. You have stumbled upon a classic problem in **game theory** and **mechanism design**, and the solution your friend is describing is a real, well-studied concept.

  Your intuition—that revealing information invites exploitation—is correct. However, your conclusion—that this makes a fair solution impossible—is where the theory proves you wrong. It is possible to design a set of rules (a "mechanism") that aligns your incentives so that honesty becomes the safest strategy, even without trust.

  Here is the breakdown of who is right, why it works, and exactly how you can implement it at your mediation next week.

  ### The Verdict: Your Friend is Theoretically Correct

  Your friend is describing a **Sealed-Bid Double Auction** (sometimes called a "Blind Bidding" mechanism). This is a standard tool in mechanism design used to solve exactly the problem you face: bilateral trade with asymmetric information.

  Your skepticism relies on the idea that if the rule uses your private information, you will lie to game the system. Mechanism design counters this by structuring the payoffs so that **lying creates a risk of losing the deal entirely.**

  *   **If you (the Buyer) bid too low:** You risk your bid falling below your sister's ask, causing the deal to fail. You then fall back to the market sale, which you presumably want to avoid.
  *   **If your sister (the Seller) bids too high:** She risks her ask rising above your bid, also causing the deal to fail. She then has to wait for a market sale, incurring more taxes and mediator fees.

  Because both of you face a penalty for being too greedy (the collapse of the deal and a return to the costly status quo), the rules pressure you both toward your true "walk-away" numbers.

  ### The Mechanism: How It Works in Practice

  To satisfy your requirement that neither of you is ever *worse off* than the market sale (the "fallback"), you need to add a **Market Reserve** to the bidding process.

  Here is a workable protocol you can propose to your mediator:

  #### Step 1: Establish the "Fallback Number"
  Before any bidding, you must agree on the net proceeds you would each receive if the house were sold on the open market today.
  *   **Action:** Hire an independent appraiser or get three real estate agent opinions. Average them to determine the **Market Value ($V_m$)**.
  *   **The Safety Net:** Calculate your individual share: $F = V_m / 2$.
  *   **Agreement:** You both sign a clause stating: *"Under no circumstances will this private settlement result in the Sister receiving less than $F$, nor the Brother paying more than his true valuation allows."* (The mechanism enforces the first part; your discipline enforces the second).

  #### Step 2: The Sealed Bids
  You both write down a number on a piece of paper, seal it in an envelope, and hand it to the mediator. You do not see each other's numbers.
  *   **Your Bid ($B$):** The maximum amount you are willing to pay your sister for her 50% share.
  *   **Sister's Bid ($A$):** The minimum amount she is willing to accept for her 50% share.

  *Crucial Incentive:* Tell your sister she should not bid less than $F$ (the fallback), and you should not bid more than the house is truly worth to you.

  #### Step 3: The Rule of Exchange
  The mediator opens the envelopes simultaneously.
  *   **Scenario 1: No Deal ($B < A$).**
      If your maximum bid is lower than her minimum ask, there is no overlap. The mechanism terminates.
      *   **Outcome:** The house goes on the open market immediately.
      *   **Safety:** Neither of you is forced into a bad deal. You are exactly where you started (the fallback).
  *   **Scenario 2: Deal ($B \ge A$).**
      If your bid is equal to or higher than her ask, a trade occurs.
      *   **Price:** The buyout price is set at the **midpoint**: $P = (B + A) / 2$.
      *   **Outcome:** You pay your sister $P$. You keep the house. She gets the cash.
      *   **Safety:** Since $B \ge P \ge A$, you pay less than your max, and she gets more than her min.

  ### Why This Solves Your Problem

  1.  **No Trust Required:** You do not need to believe her number, and she does not need to believe yours. The mediator handles the verification.
  2.  **No Revelation:** You never have to say, "I love this house and will pay anything." You just submit a number. If the deal happens, you know you paid less than your limit. If it doesn't, she never knows how high you would have gone.
  3.  **Guaranteed Safety (Individual Rationality):**
      *   **For her:** She controls her bid $A$. If she sets $A = F$ (the market fallback), she is mathematically guaranteed to never receive less than the market split. If you bid higher, she gets a premium.
      *   **For you:** You control your bid $B$. If you set $B$ at your true maximum, you are guaranteed to never overpay. If she asks less, you get a discount.
  4.  **Potential Improvement:** If you value the house at \$300k (for her share) and she values it at \$200k (for her share), but the market is only \$200k:
      *   She bids \$200k. You bid \$300k.
      *   Deal happens at \$250k.
      *   She gets \$50k *more* than the market sale.
      *   You pay \$50k *less* than your limit.
      *   The house stays in the family (efficient outcome).

  ### The Catch (Where Your Skepticism Was Valid)

  Your friend omitted one technical limitation known as the **Myerson-Satterthwaite Theorem**. It proves that no mechanism can guarantee a deal happens *every single time* it theoretically should (i.e., whenever you value the house more than she does).

  Because you both have an incentive to "shade" your bids slightly to get a better price (you bid a bit lower, she asks a bit higher), there is a "zone of failure."
  *   *Example:* You are willing to pay \$250k. She is willing to take \$240k. There is a \$10k surplus.
  *   *But:* You bid \$230k (hoping for a bargain). She asks \$260k (hoping for a premium).
  *   *Result:* Bids don't cross. No deal. You both lose the \$10k surplus and go to market.

  This is the trade-off. You cannot guarantee a deal *and* guarantee perfect honesty simultaneously. However, this mechanism **does guarantee** that you will never be exploited, and it **often** finds the deal when the gap in valuations is large enough to absorb your strategic shading.

  ### Recommendation for Next Week

  Go to the mediator and propose the **"Sealed-Bid Buyout with Market Reserve."**

  1.  **Acknowledge the stalemate:** "We recognize that open negotiation is failing because neither of us wants to reveal our bottom line."
  2.  **Propose the rule:** "We want to use a blind-bidding mechanism. We will both submit sealed numbers. If they cross, we split the difference. If they don't, we list the house."
  3.  **Set the floor:** "To ensure fairness, we will agree on a market appraisal first. My sister's minimum bid will be anchored to that appraisal so she is never worse off than selling."

  This moves the conversation from "How much do you trust me?" to "Do you trust the math?" It removes the emotional burden of negotiation and replaces it with a procedural solution. Your friend was right: you don't need trust to solve this; you just need the right rules.
