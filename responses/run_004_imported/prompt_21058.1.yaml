answer: |-
  **Setting:** *A crowded coffee shop. There is one small table left, with two chairs. One chair faces the window; the other faces the wall. ALEX (the Lewisian) and SAM (the Evolutionary Game Theorist) are standing over it, bags in hand.*

  **Alex:** You take the window seat. You like the light.

  **Sam:** No, you take it. You're the one who needs to read. I just need to talk.

  **Alex:** We're going to be here all day if we do this politely. Let's just sit.

  **Sam:** See? That's the problem. We have a regularity—polite hovering—that persists because we expect the other to hover, and we prefer to hover given that expectation. But it's inefficient. According to your guy Lewis, we can't break it until we have common knowledge that we're both willing to sit.

  **Alex:** It's not just about willingness, Sam. It's about *reasons*. I sit because I expect you to sit, and I know you expect me to sit. That recursive loop is the glue. Without common knowledge, we're just two people guessing.

  **Sam:** But the glue holds without the recursion. That's my point. Think of a population of bees, or even dumb reinforcement learners. They settle into stable patterns. They avoid collisions. They don't represent "I know that you know." They just react to payoffs. So why insist that human conventions require this high-cognition common knowledge machinery? It looks like a philosopher's just-so story.

  **Alex:** Because bees don't have *conventions*. They have instincts or conditioned responses. A convention is a rational solution to a coordination problem. If I step aside because I'm hardwired to, I'm not following a convention; I'm following a program. Lewis is interested in the normative force—the reason *why* I ought to conform. That "ought" comes from the reasoning loop.

  **Sam:** But the stability is identical. If I train a neural net to play traffic coordination, it'll drive on the right. If I evolve a population of beetles to avoid fights, they'll adopt an "owner wins" strategy. The pattern is self-perpetuating and arbitrary. If it walks like a convention and quacks like a convention, why does it matter if the agents are doing higher-order logic in their heads?

  **Alex:** It matters because without the reasoning, the pattern is fragile in a specific way. If the environment shifts slightly, the beetle crashes. A rational agent, possessing common knowledge of the convention, can *anticipate* the shift and adjust together. But let's grant your point about the cognitive load for a second. What about the game structure? Lewis insists conventions solve *coordination* problems—where our interests coincide. You work in EGT. You know most real-world "conventions" aren't pure coordination.

  **Sam:** Exactly. Take the ownership convention. "Whoever possesses the resource first keeps it." That's the Bourgeois strategy in Maynard Smith's Hawk-Dove game. It's evolutionarily stable. It avoids costly fights. But it is *not* a coincidence of interest in the encounter. If I'm the intruder, I want the resource. If you're the owner, you want the resource. Our interests are directly opposed. Lewis's definition excludes this, which means it excludes most property norms.

  **Alex:** I don't think Lewis would exclude it, but he'd reframe it. Yes, in the specific encounter, we have conflicting interests over the object. But we have a higher-order coincidence of interest regarding the *system*. We both prefer a world where we don't fight over every scrap to a world of constant violence. The convention coordinates us on *which* equilibrium to pick to avoid the war of all against all.

  **Sam:** That's a convenient retreat to a meta-game. But the arbitrariness condition is what makes it a convention for Lewis, right? There has to be an alternative regularity that would have worked just as well.

  **Alex:** Correct. We could have chosen "Intruder wins." That would also avoid fights. So the choice of "Owner wins" is arbitrary relative to the goal of peace. That fits Lewis's criteria.

  **Sam:** Does it? In the Hawk-Dove game, "Owner wins" isn't arbitrary in the same way "drive on the right" is. It leverages an asymmetry that's already there—possession. It's cheaper to enforce. "Intruder wins" is actually less stable in many biological models because it encourages constant displacement. So it's not truly arbitrary; it's selected for efficiency. And again, no one is reasoning about it. The selection pressure does the work.

  **Alex:** But if it's selected for efficiency, it's not purely arbitrary, and Lewis says convention *must* be arbitrary. If "Owner wins" is strictly better than "Intruder wins" because of transaction costs, then it's dictated by interest, not convention. It becomes a technical solution, like using a lever to lift a rock.

  **Sam:** Now you're splitting hairs to save the theory. In the real world, "Owner wins" feels arbitrary to the participants. I didn't choose to be the owner; I just got here first. Why should that give me rights? It's a Schelling point, sure, but it's sustained by the threat of violence, not by our shared desire to be nice. Lewis wants conventions to be about shared expectations facilitating cooperation. Ownership is about asymmetric power facilitating avoidance of conflict.

  **Alex:** Avoidance of conflict *is* cooperation in this context. But here's where I think the common knowledge requirement bites back. In your EGT model, the strategy persists because mutants who fight get eaten. In a human society, the convention persists because I know *you know* that fighting is taboo. If I think you're going to fight despite being the owner, I might preemptively attack. The stability relies on my certainty about your expectations.

  **Sam:** But that certainty doesn't come from a logical deduction of common knowledge. It comes from history. "We've always done it this way." That's a causal chain, not a rational one. I expect you to conform because you're a product of a society that punishes deviators. You don't need to know that I know. You just need to know the cost of deviation.

  **Alex:** But "We've always done it this way" *functions* as common knowledge. It's a public signal. Lewis isn't saying we sit around and write out the logic proof every morning. He's saying the state of affairs is such that the reasoning is available to us. If I violate the convention, I'm not just risking punishment; I'm being irrational relative to our shared expectations. That's the difference between a convention and a habit. A habit is personal; a convention is interpersonal reasoning.

  **Sam:** I think you're conflating the *justification* with the *mechanism*. You can justify it with Lewisian logic after the fact. But the mechanism that gets it off the ground and keeps it there is evolutionary or reinforcement-based. My worry is that by insisting on the common knowledge machinery, you make conventions too fragile. You imply that if people stop believing in the common knowledge, the convention collapses. But conventions often survive cynicism. People follow norms they don't believe in, just because everyone else does.

  **Alex:** That's the "prefer to conform given that expectation" clause. I might hate the norm, but if I expect you to follow it, my best response is to follow it. That's still game-theoretic rationality. But without the common knowledge of the expectation, how do we recover from a shock? Say, a new technology disrupts the ownership norm.

  **Sam:** We drift into a new equilibrium through trial and error. Chaos, then stabilization. No meeting of minds required.

  **Alex:** That sounds like war.

  **Sam:** It sounds like history. Look, Alex, I'm not saying Lewis is wrong about *some* conventions. Meeting me at the train station at 6 PM? Sure, that's pure coordination, common knowledge, arbitrary. But when you try to stretch that to cover property, language, or law, you're importing a rationalist ideal onto processes that are fundamentally messy and conflict-driven.

  **Alex:** And I'm saying that without the rationalist ideal, you can't explain why we feel *bound* by these rules. If it's just selection pressure, then breaking a convention is just a mutation. But we treat it as a violation. We say, "You *shouldn't* have cut in line." That "should" implies a shared reasoning space.

  **Sam:** The "should" is just a threat. "You shouldn't" means "If you do, we will make you regret it."

  **Alex:** Then why do *I* feel regret when I do it, even if no one sees me?

  **Sam:** Internalized punishment. You've trained yourself.

  **Alex:** *(Sighs, finally sitting in the window chair)* You're reducing everything to mechanics.

  **Sam:** *(Sitting in the wall-facing chair)* And you're inflating everything to logic.

  **Alex:** So, is this a convention? That I took the window?

  **Sam:** It's an equilibrium. We avoided the awkward dance.

  **Alex:** But do you know that I know that you know I wanted this seat?

  **Sam:** I know that you sat down. And I know I'm tired.

  **Alex:** That's not common knowledge.

  **Sam:** It's stable. Pass the sugar.

  **Alex:** *(Slides the sugar bowl over)* There. Coordination achieved.

  **Sam:** See? No common knowledge required. Just payoff maximization.

  **Alex:** Or, I knew you'd expect me to pass it because I'm a gentleman.

  **Sam:** Or because you want me to stop talking about bees.

  **Alex:** Touché.
