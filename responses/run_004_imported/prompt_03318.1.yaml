answer: |-
  This is a sharp reading, and you are right to be wary of the "standard line" (the soul-integrity argument) as the *sole* engine of *Contra Mendacium*. You have correctly identified a shift in emphasis between *De Mendacio* (more metaphysical/psychological) and *Contra Mendacium* (more ecclesial/pastoral).

  Here is a stress-test of your three specific concerns, along with a recommendation on how to frame the paper so you don't get dinged on scholarship or scope.

  ### 1. Is the "Two Strands" reading supported by the text?
  **Verdict:** Yes, but with a caveat. You aren't inventing a tension, but you might be setting up a false dichotomy.

  In *De Mendacio*, Augustine is indeed obsessed with the ontology of the sign: a lie is a *voluntas fallendi* (will to deceive) coupled with a sign that contradicts the mind. It is an offense against the order of creation.

  However, in *Contra Mendacium* (written much later, c. 420 AD), the context is pastoral. When addressing Consentius, Augustine *does* argue exactly as you say: if Catholics use *dolus* (deceit) to catch Priscillianists, they validate the Priscillianist hermeneutic of suspicion. He argues that the Church is a "community of truth" (*societas veritatis*). If the medium of the Church (speech/truth) is corrupted to save the Church, the Church ceases to be itself.

  **The Caveat:** Augustine would likely say these aren't two different arguments, but the same argument applied at different levels.
  *   *Level 1 (Individual):* Lying disorders the individual soul (words ≠ thoughts).
  *   *Level 2 (Ecclesial):* Lying disorders the Body of Christ (witness ≠ Gospel).
  If you frame it as "Augustine abandons the soul argument for the pragmatic argument," a sharp grader might push back. If you frame it as "Augustine extends the ontology of the lie into the sociology of the Church," you are on firmer ground. The "pragmatic" worry (we lose standing to condemn them) is actually a *consequence* of the metaphysical reality (truth is the substance of communion).

  ### 2. Is the Lying-vs-Killing asymmetry a known problem?
  **Verdict:** Yes, it is a classic crux in Augustinian ethics. Do not present it as a "discovery," or you will look like you haven't done the secondary reading.

  **The Standard Response (The "Signification" Defense):**
  Scholars like John Burnaby (*Amor Dei*) and Oliver O'Donovan (*Resurrection and Moral Order*) have addressed this. The principled distinction lies in **natural teleology**.
  *   **Killing:** Taking life is not intrinsically disordered in Augustine's view; it is a neutral act that becomes evil based on *intent* and *authority*. God kills; the state kills (Rom 13); soldiers kill. The physical act of life-taking does not inherently contradict a natural purpose, provided it serves the *ordo pacis* (order of peace).
  *   **Lying:** Speech, by its very nature (*natura*), is instituted to signify what is in the mind. To use speech to signify what is *not* in the mind is to violate the *telos* of the faculty itself. It is a misuse of the instrument, not just a misuse of the act.
  *   **The Asymmetry:** You can kill *for* peace (preserving the order). You cannot lie *for* truth (destroying the medium of truth to save the content).

  **How to handle this in the paper:**
  Acknowledge the tension. You can write something like: *"While Augustine permits lethal force in a just war, he forbids lying even to save a life. This is not merely inconsistent rigorism; it stems from his semiotics. War preserves the external order of peace; lying destroys the internal order of signification upon which that peace depends."*
  If you acknowledge the scholarship (even generally), you turn a potential "gotcha" into a sophisticated analysis of his semiotic ethics.

  ### 3. Is this a stronger topic than the "Soul-Purity" essay?
  **Verdict:** Yes, absolutely. Half your class will write about "lying hurts the liar." That is the *De Mendacio* summary. A paper on *Contra Mendacium* focusing on **ecclesial integrity and the coherence of witness** is much more compelling.

  **However, there is a scope risk.**
  3-4 pages is very short.
  *   **Risk:** If you try to do the Exegesis of Consentius' letter *plus* the Just War asymmetry, you will run out of space and do neither well.
  *   **Recommendation:** Make the "Ecclesial Integrity/Priscillianist Entrapment" argument your **main thesis**. Use the Just War asymmetry as a **counter-objection** in the final paragraph to show you've thought about the limits of his consistency.

  **Proposed Thesis Structure:**
  1.  **Intro:** Standard reading says Augustine bans lying to protect the individual soul. But in *Contra Mendacium*, the stakes are higher: it's about the integrity of the Church's witness.
  2.  **Body 1:** Explain the Consentius scenario. Show how Augustine argues that using Priscillianist methods (dissimulation) validates Priscillianist theology. You cannot defend Truth by abandoning the medium of Truth.
  3.  **Body 2:** Connect this to his semiotics. The Church is a community bound by signs. Corrupting the sign corrupts the community. (This bridges the "soul" and "church" arguments).
  4.  **Conclusion/Stress Test:** Address the Just War asymmetry. Acknowledge it looks like a double standard. Resolve it briefly by noting that killing defends the *order* of peace, while lying destroys the *means* of peace (communication). Therefore, the prohibition on lying is actually *more* absolute because it strikes at the root of human society itself.

  ### Specific Holes to Patch Before Friday
  1.  **Don't ignore *De Mendacio* entirely.** You need to acknowledge that the "words must match thoughts" definition is the *foundation*, but argue that *Contra Mendacium* reveals the *social consequence* of that foundation.
  2.  **Be careful with "Just War."** Augustine's Just War theory is scattered across *Contra Faustum*, *City of God*, and letters. Don't imply he has a tidy "Just War Treatise" that he is contradicting. Frame it as "Augustine's broader ethical permissions regarding violence."
  3.  **The "Gap" vs. "Principle":** If you conclude it's a "real gap," you risk sounding like you think Augustine just failed. If you argue it's a "principled distinction based on semiotics," you show you understand his system. The latter is a higher-grade argument.

  **Bottom Line:** Your instinct about the Consentius letter is correct. The "you become what you hunt" argument is the unique contribution of *Contra Mendacium*. Lean into that. It's a much better paper than "Augustine says lying is bad for your soul." Just make sure you cite the asymmetry as a known tension that you are resolving via his theory of signs, rather than a contradiction you found that no one else noticed.

  Good luck. You have enough time to pivot if you stick to the Ecclesial Integrity angle and keep the Just War point as a supporting nuance.
