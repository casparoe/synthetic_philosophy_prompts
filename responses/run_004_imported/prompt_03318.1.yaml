          *   Is the Just War comparison fair? Killing is an external act; lying is an internal corruption of the faculty of communication.
          *   Is the user conflating *Contra Mendacium* with later Just War developments? (Augustine's Just War thought is scattered).

  6.  **Refining the Advice (Self-Correction during drafting):**
      *   *Correction:* Make sure to emphasize that *Contra Mendacium* is later than *De Mendacio*. The development of his thought matters.
      *   *Correction:* The "signification" argument is the key to the asymmetry. Words *mean* truth by nature. Swords don't *mean* death by nature. This is the principled distinction the user is looking for.
      *   *Warning:* Don't let the Just War point overwhelm the exegesis of *Contra Mendacium*. The prompt is on the lying material.

  7.  **Final Polish:** Check the tone. Ensure it sounds like a helpful colleague/TA. (Proceed to generate output based on these thoughts).

      *   *Key Scholarly References to drop:* John Burnaby (*Amor Dei*), Oliver O'Donovan (*The Problem of Self-Love in St. Augustine* or *Resurrection and Moral Order*), maybe Joseph Lieberg.
      *   *Key Textual Point:* Augustine distinguishes between *officium* (duty) and *mendacium* (lie).
      *   *Key Distinction:* Signification vs. Action.

  8.  **Final Review against constraints:** 3-4 pages is short. The user needs to be careful not to bite off more than they can chew. The "Ecclesial Integrity" angle is perfect for that length. The "Just War" angle might be too big. I should advise them to use Just War as a counter-objection they resolve, not the main thesis.

