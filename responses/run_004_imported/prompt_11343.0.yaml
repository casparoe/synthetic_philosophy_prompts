  *(Self-Correction during drafting)*: I need to make sure I don't sound *too* much like a tech manual. The audience is the Board. They care about liability and preservation. The technical explanation must serve those masters. The phrase "eliciting latent knowledge" shouldn't appear explicitly, but the *concept* must drive the logic.

