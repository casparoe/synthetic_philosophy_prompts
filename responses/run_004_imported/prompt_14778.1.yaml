answer: |-
  You have encountered one of the most famous and robust results in social choice theory. To answer your question directly: **It is not a sign of poor design.** You have not failed to find the "right" counting method; rather, you have bumped up against a mathematical impossibility theorem.

  The deeper reason you are looking for is formalized in the **Gibbard-Satterthwaite Theorem**.

  Independently proved by Allan Gibbard (1973) and Mark Satterthwaite (1975), this theorem demonstrates that for any voting system that selects a single winner from three or more candidates based on **ordinal rankings** (i.e., ranking candidates from first to last), there is no method that is simultaneously:

  1.  **Non-dictatorial** (no single voter determines the outcome);
  2.  **Onto** (every candidate has a chance to win); and
  3.  **Strategy-proof** (no voter ever has an incentive to misrepresent their preferences).

  In plain English: If you have more than two options and you ask people to rank them, there will *always* be some configuration of preferences under which a voter can achieve a better outcome by lying about their true preferences.

  ### Why Your Redesigns Failed

  You noted that you tried alternative procedures, including elimination rounds, and still found vulnerabilities. The theorem explains why:

  *   **Point-Based Systems (Borda Count):** This is what you originally used. It is notoriously susceptible to "burying." A voter can rank a strong competitor last (even if they aren't the voter's last choice) to reduce their point total, exactly as your committee member did.
  *   **Elimination Rounds (Instant Runoff/Hare System):** These are susceptible to different forms of strategy. For example, a voter might rank a weak candidate higher to ensure a strong rival gets eliminated in an earlier round, or they might truncate their ballot (refusing to rank lower choices) to prevent their vote from transferring to a competitor.
  *   **Condorcet Methods:** Even systems designed to elect the candidate who would beat all others in head-to-head matchups (Condorcet winners) are vulnerable to strategic entry or strategic voting cycles that prevent a Condorcet winner from emerging.

  ### A Nuance: Ordinal vs. Cardinal

  The Gibbard-Satterthwaite theorem applies specifically to **ordinal** voting systems (ranking). It does not technically apply to **cardinal** systems (such as Approval Voting or Score Voting), where voters rate candidates independently rather than ranking them against one another.

  However, while cardinal systems escape the strict bounds of Gibbard-Satterthwaite, they are not immune to strategy. In Score Voting, for example, the optimal strategy often devolves into "min-maxing" (giving your favorite a maximum score and everyone else a zero), which effectively recreates a plurality dynamic. So, while the *mathematical* impossibility is specific to ranking, the *practical* incentive to strategize is ubiquitous in almost all collective choice mechanisms.

  ### Implications for Committee Chairing

  As a political scientist, you likely know that institutions are not just about mechanics; they are about norms. Since you cannot mathematically eliminate the incentive for strategic voting, your goal as a chair shifts from **mechanism design** to **institutional management**.

  Here is how you might frame this for your department (and your own peace of mind):

  1.  **Accept Imperfection:** You can reassure your colleagues that the vulnerability they encountered is a feature of collective choice, not a bug of your specific design. There is no "perfect" voting system for this context.
  2.  **Transparency Over Complexity:** In small committees (unlike mass elections), complex voting rules often obscure accountability. A simpler rule (like plurality or Borda) combined with open deliberation is often superior to a complex "strategy-proof" algorithm that no one understands.
  3.  **Deliberation vs. Aggregation:** In a small graduate committee, the vote should ideally be the *end* of a deliberative process, not the *substitute* for one. If members feel the need to vote strategically, it often indicates a failure of consensus-building prior to the ballot. Encouraging discussion about *why* certain candidates are preferred can reduce the perceived need for tactical maneuvering.
  4.  **Secret vs. Open Ballots:** In small groups, strategic voting is often curbed by social pressure. An open ballot might discourage the behavior your colleague admitted to, though it introduces other risks (coercion, groupthink).

  ### Conclusion

  You have independently rediscovered a foundational insight of social choice theory. Your colleague's admission was not a moral failing unique to her, but a rational response to the incentives built into any ordinal voting system with more than two options.

  For your own research and your role as chair, you can take comfort in the fact that no amount of tinkering with the counting rules would have solved this. The "deeper reason" is that when preferences are diverse and outcomes are deterministic, the incentive to game the system is mathematically inevitable.

  **Recommended Reading:**
  If you haven't already, you might enjoy *The Theory of Social Choice* by Peter C. Fishburn or *Social Choice and the Mathematics of Manipulation* by Alan D. Taylor. They provide excellent formalizations of exactly the problem you faced.
