prompt: |-
  For an independent project in a philosophy-of-science elective at my high school, I've been working through the Scholium to the Definitions at the start of Newton's Principia, and I've gotten stuck on the paragraph about the spinning bucket of water — the one that's supposed to be the classic argument for absolute space. Here it is, in the Motte translation as revised by Cajori:

  "The effects which distinguish absolute from relative motion are, the forces of receding from the axis of circular motion. For there are no such forces in a circular motion purely relative, but in a true and absolute circular motion, they are greater or less, according to the quantity of the motion. If a vessel, hung by a long cord, is so often turned about that the cord is strongly twisted, then filled with water, and held at rest together with the water; thereupon, by the sudden action of another force, it is whirled about the contrary way, and while the cord is untwisting itself, the vessel continues for some time in this motion; the surface of the water will at first be plain, as before the vessel began to move; but after that, the vessel, by gradually communicating its motion to the water, will make it begin sensibly to revolve, and recede by little and little from the middle, and ascend to the sides of the vessel, forming itself into a concave figure (as I have experienced), and the swifter the motion becomes, the higher will the water rise, till at last, performing its revolutions in the same times with the vessel, it becomes relatively at rest in it. This ascent of the water shows its endeavor to recede from the axis of its motion; and the true and absolute circular motion of the water, which is here directly contrary to the relative, becomes known, and may be measured by this endeavor. At first, when the relative motion of the water in the vessel was greatest, it produced no endeavor to recede from the axis; the water showed no tendency to the circumference, nor any ascent towards the sides of the vessel, but remained of a plain surface, and therefore its true circular motion had not yet begun. But afterwards, when the relative motion of the water had decreased, the ascent thereof towards the sides of the vessel proved its endeavor to recede from the axis; and this endeavor showed the real circular motion of the water continually increasing, till it had acquired its greatest quantity, when the water rested relatively in the vessel. And therefore this endeavor does not depend upon any translation of the water in respect of the ambient bodies, nor can true circular motion be defined by such translation."

  I think I follow the basic setup: the water's motion relative to the bucket is greatest exactly when the surface is flat, and drops to zero exactly when the surface is most concave, so the concavity can't be tracking the water's rotation relative to the bucket itself. What I can't figure out is why this is supposed to show that the water is rotating relative to absolute space specifically, rather than relative to something else that simply stays put for the whole experiment — the room, the earth, or the fixed stars, say. Nothing in this paragraph seems to rule that possibility out on its own. Is Newton relying on some assumption established earlier in the Scholium to close that gap, or is there something already in the logic of the bucket argument that excludes those alternatives and I'm just not seeing it?
