answer: |-
  This is excellent material for a grad seminar. You are hitting on the exact nerve that keeps metaethicists up at night, and your intuition that the "textbook closure" on this is premature is well-founded. The standard intro-level narrative often presents quasi-realism as having "solved" Frege-Geach by redefining consistency, without sufficiently probing whether that redefinition is adequate.

  Here is the breakdown you asked for, including the literature check and the hard pushback on the Gibbard section.

  ### (a) Accuracy of Representation

  Your summaries are **accurate enough for seminar purposes**, though there are nuances you might want to flag depending on how deep you want to go.

  *   **Blackburn:** You have correctly captured the *Spreading the Word* / "Attitudes and Contents" strategy. Blackburn argues that we can explain the "inconsistency" of accepting $P$, accepting $If P then Q$, and denying $Q$ as a clash of higher-order attitudes (specifically, a clash between a first-order attitude and a higher-order attitude about combinations of attitudes). You are right that he trades "truth-conditional validity" for "attitudinal coherence."
  *   **Gibbard:** Your description of the hyperplan machinery (from *Wise Choices, Apt Feelings* and *Thinking How to Live*) is also accurate. Gibbard expands the semantic parameter from just possible worlds to world-norm (or world-plan) pairs. Inconsistency is defined as there being no admissible pair that satisfies the set of commitments.

  **One nuance to consider:** You might want to distinguish between *early* Gibbard (hyperplans as psychological states of planning) and *late* Gibbard (*Expressive Normativity*, 2011). In the later work, Gibbard moves closer to a truth-conditional semantics for normative claims to specifically dodge the worry you raise. If your notes conflate the two, a sharp student might point out that the later Gibbard essentially concedes that we need a logic of "normative facts" (albeit expressively construed). But for the purpose of critiquing the "classic" expressivist fix, your summary holds.

  ### (b) The "Logical vs. Practical Inconsistency" Worry

  You are absolutely right that this is a recognized, major problem. You are also right about **Mark van Roojen**.

  *   **The Reference:** The paper you are looking for is likely **Mark van Roojen, "Expressive Logic" (2005, *Philosophical Studies*)**. Van Roojen argues precisely that expressivists conflate *logical* inconsistency (a relation between propositions/contents) with *psychological* inconsistency (a relation between mental states). He argues that explaining why it is irrational to hold conflicting attitudes does not explain why the *contents* of those attitudes are logically inconsistent.
  *   **Other Key Players:**
      *   **Bob Hale:** "Can There Be a Logic of Attitudes?" (1993). Hale argues that validity requires truth-preservation. If expressivism denies truth-conditions to moral claims, it cannot account for validity, only rationality.
      *   **Mark Schroeder:** *Being For* (2008). This is the technical heavyweight on this issue. Schroeder's "Negation Problem" is a more granular version of your worry. He argues that Blackburn's higher-order attitudes cannot generate enough distinct mental states to match the logical complexity of embedded sentences (e.g., distinguishing "not wrong" from "wrong" in a way that preserves logical relations).
      *   **Jamie Dreier:** "Expressive-Assertivism" (2006). Dreier tries to show that expressivists can have it both ways, but he acknowledges the tension you're highlighting.

  **How Sophisticated Expressivists Answer:**
  1.  **Redefining Logic:** They argue that logic is not essentially about truth-preservation. Logic is about the structure of rational commitment. If the structure of planning/believing obeys certain rules, that *is* logic. (Gibbard's line).
  2.  **The Fregean Point:** Content is determined by inferential role. If the expressivist can show that moral sentences play the *same inferential role* as descriptive sentences (i.e., they embed in conditionals, support modus ponens, etc.), then they have the same content-type relevant to logic. (Blackburn's line).
  3.  **Bilateralism:** Some (like Schroeder, ironically, and Price) suggest we need a semantics that treats assertion and denial as equally primitive, which might dissolve the need for truth-conditions to explain negation/conditionals.

  ### (c) Hard Pushback on the Hyperplan Paragraph

  You asked me to find the hole in your hyperplan argument. Here is where a sophisticated Gibbardian (or a careful student) could push back. Your claim is: *"The individuation of 'plans'... still has to bottom out in the same practical facts... in which case the hyperplan move hasn't answered the objection, just buried it."*

  **Pushback 1: You are begging the question against "Planning Logic."**
  Your argument assumes that "real" logic must be truth-conditional (about the world) and that planning consistency is merely "psychological." Gibbard's core philosophical claim is that **rationality is normative**, and the logic of planning is *sui generis*.
  *   *The Counter:* It is not a "psychological fact" that I cannot plan to $A$ and plan not to $A$ simultaneously. It is a **constitutive norm of planning**. Just as belief "aims at truth," planning "aims at coherence." Gibbard would argue that the constraint isn't bottoming out in "practical facts" about what I happen to want; it's bottoming out in the *concept* of a plan. A "plan" that contradicts itself isn't a plan; it's noise. Therefore, the inconsistency is formal relative to the domain of plans, not merely a psychological clash.
  *   *The Hole:* You treat the "world-plan" pair as if the 'plan' part is fuzzy/psychological and the 'world' part is rigid/logical. But for Gibbard, the logic of plans is just as rigid as the logic of worlds.

  **Pushback 2: The Model-Theoretic Defense.**
  You suggest the formalism is "cosmetic." But Gibbard (especially in *Expressive Normativity*) provides a full model-theoretic semantics.
  *   *The Counter:* In standard semantics, validity is defined as truth-preservation across all models. In Gibbard's semantics, validity is defined as **acceptance-preservation across all admissible world-plan pairs**. This *is* a formal definition of validity. It satisfies the requirement that modus ponens holds regardless of content.
  *   *The Hole:* You claim the individuation of plans relies on "practical facts." But in the formalism, plans are individuated by their **conditions of applicability**. If Plan $X$ rules out World $W$, and Plan $Y$ permits World $W$, they are formally distinct regardless of the agent's psychology. The inconsistency is located in the *semantic values* (the sets of world-plan pairs), not the agent's head. You are attacking the metaphysical grounding of the semantics, but the semantics itself *does* deliver formal validity.

  **Pushback 3: The "Fact-Plan" Gap is a Feature, Not a Bug.**
  Your worry is that mixing worlds (facts) and plans (norms) in one parameter is suspicious.
  *   *The Counter:* This is exactly the point. The Frege-Geach problem arises because we try to force normative language into a fact-only semantics. By expanding the semantic parameter to include plans, Gibbard makes the logic of normative language **homogenous** with descriptive language. Both are evaluated against a parameter (one has a trivial plan component, the other doesn't).
  *   *The Hole:* If you argue this "doesn't explain validity," you need to explain why preservation of "acceptance" across world-plan pairs isn't validity. If you say "because it's not truth," Gibbard replies: "Normative sentences aren't in the business of stating truths, they're in the business of expressing plans. So validity for them *just is* plan-preservation." To reject this is to insist on a truth-conditional monopoly on logic, which is precisely what expressivism denies.

  ### Summary for your Seminar Notes

  Your notes are strong, but to bulletproof them against a smart grad student:

  1.  **Cite van Roojen explicitly.** It validates your intuition and gives them a reading path.
  2.  **Soften the "Psychological" charge against Blackburn.** Acknowledge that Blackburn claims this *is* a logic of attitudes, but maintain the critique that it fails to explain the *normativity* of logic (why we *ought* to reason validly, not just why we feel weird if we don't).
  3.  **Refine the Gibbard critique.** Instead of saying the formalism is "cosmetic," argue that it **shifts the metaphysical burden**. It solves the logical problem by positing "plan-worlds," but then faces the metaphysical problem: "What are these things, and how do we access them?" If they are just psychological states, we are back to psychologism. If they are abstract objects, expressivism looks suspiciously like realism. This is the **Ontological Worry** that underlies your Logical Worry.

  This distinction (Logical vs. Ontological) might be the most productive angle for the seminar. You're arguing that Gibbard solves the logic by smuggling in ontology that expressivism supposedly rejects. That's a killer objection.
