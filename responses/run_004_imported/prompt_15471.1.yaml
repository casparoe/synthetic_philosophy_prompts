prompt: |-
  So I'm on my high school's honor council (the student board that hears academic integrity cases) and we've got a case splitting the group in half. A girl reported a guy for using his phone during a chem quiz, but it turns out she copied a lab report last year and never got caught, so now he's arguing she has no right to even bring the case since she's a hypocrite. Half the council thinks that's irrelevant to whether the phone thing actually happened, the other half thinks its a real problem and maybe we shouldn't hear the case at all. I need to bring a one-page memo to our meeting Thursday that actually recommends something (hear it normally, dismiss it, whatever) with real reasons, and it can't just say "two wrongs don't make a right" and stop there bc that dodges the hard part of the hypocrisy argument -- can you draft it for me?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** High school Honor Council member.
      *   **Task:** Draft a one-page memo for the upcoming council meeting.
      *   **Situation:** A cheating case (boy used phone during quiz) reported by a girl who previously cheated (copied lab report) without consequence.
      *   **Conflict:** Council is split. Half say her past is irrelevant to the facts of the current case. Half say her hypocrisy undermines the process/authority.
      *   **Requirement:** Must make a specific recommendation (hear, dismiss, etc.) with strong reasoning. Cannot rely on clichés like "two wrongs don't make a right." Must address the "hard part" of the hypocrisy argument (legitimacy, fairness, culture).
      *   **Tone:** Professional, persuasive, balanced, appropriate for a high school student leadership context.

  2.  **Determine the Stance/Recommendation:**
      *   *Option A: Dismiss the case.* This validates the "unclean hands" doctrine. However, it lets the boy off for cheating just because the accuser cheated. This undermines the integrity policy itself.
      *   *Option B: Hear the case normally.* This treats the facts as paramount. However, it ignores the damage to the council's credibility if the accuser is known to be unpunished for similar acts.
      *   *Option C: Hear the case, but address the accuser's status separately.* This is the most nuanced and robust approach. It upholds the rule of law (cheating is still cheating regardless of who reports it) while acknowledging the equity issue (the accuser should also be held accountable).
      *   *Decision:* Option C is the strongest. It allows the council to fulfill its duty (adjudicate the phone incident) without ignoring the systemic fairness issue (the unreported lab report). It shows leadership.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Subject).
      *   **Opening/Executive Summary:** State the purpose and the recommendation clearly upfront.
      *   **The Core Issue:** Acknowledge the split. Define the tension between *procedural integrity* (did he cheat?) and *perceived legitimacy* (does she have standing?).
      *   **Addressing the "Hypocrisy" Argument (The Hard Part):**
          *   Why does it matter? It looks like selective enforcement. It damages trust in the Council.
          *   Why is dismissing the case wrong? It makes integrity contingent on the accuser's purity, not the respondent's actions. It creates a "who's worse" contest rather than a fact-finding mission.
      *   **The Recommendation:**
          1.  Proceed with the hearing regarding the phone usage.
          2.  Simultaneously initiate a review of the accuser's past alleged violation (if evidence exists/is admissible under school policy).
          3.  Emphasize that the Council's job is upholding standards, not judging moral worthiness of reporters.
      *   **Closing:** Reiterate the goal (fairness, culture of integrity).

  4.  **Refining the Argument (Avoiding Clichés):**
      *   Instead of "two wrongs don't make a right," focus on *institutional credibility*.
      *   Instead of "she's a hypocrite," focus on *selective enforcement*.
      *   Instead of "he cheated," focus on *evidence-based adjudication*.
      *   *Key Insight:* The Council represents the *school's* integrity, not the *reporter's* integrity. The reporter is a witness, not the prosecutor.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey council. We need to decide on the phone case.
      *   Some say drop it because she cheated before.
      *   I say hear it. If we drop it, cheating is okay if the snitch isn't perfect.
      *   But we also need to look at her cheating. We can't ignore that.
      *   So, hear the guy's case. Then look at her case.
      *   This keeps us fair.

  6.  **Drafting - Iteration 2 (Adding Polish and Professionalism):**
      *   Make it sound like a formal memo.
      *   Use terms like "procedural integrity," "selective enforcement," "institutional trust."
      *   Ensure it fits on one page (approx. 400-500 words).

  7.  **Final Review against Constraints:**
      *   One page? Yes, if kept concise.
      *   Specific recommendation? Yes (Hear the case + Investigate accuser).
      *   Addresses hypocrisy deeply? Yes (discusses legitimacy and selective enforcement).
      *   No clichés? Yes.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like I'm accusing the girl definitively. It's an *allegation* or *report* about her past. Use careful language ("alleged prior violation").
      *   *Correction:* Ensure the recommendation is actionable. The Council needs to know *what to do* Thursday.

  9.  **Final Output Generation:** (This matches the provided good response.)
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council Members
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation Regarding Case #24-09 (Chemistry Quiz Incident)

  **Purpose**
  This memo addresses the procedural deadlock regarding Case #24-09. The Council is divided on whether to adjudicate the reported phone usage by the respondent due to the reporting student's alleged unadjudicated academic integrity violation from the prior academic year. My recommendation is to **proceed with the hearing for the current case** while simultaneously **referring the reporter's prior conduct for separate review.**

  **The Core Conflict: Procedural Integrity vs. Perceived Legitimacy**
  The argument to dismiss the case rests on the concept of "unclean hands"—the idea that a reporter who has violated the same standards lacks the moral standing to accuse others. This concern is valid. If the Honor Council appears to tolerate selective enforcement, our legitimacy erodes. Students must believe that rules apply equally to everyone, regardless of who is reporting them.

  However, dismissing the current case based on the reporter's conduct creates a more dangerous precedent: it suggests that academic integrity is contingent on the moral purity of the accuser rather than the actions of the respondent. If we dismiss this case, we establish that a student can cheat without consequence provided they can later identify another cheater. This shifts the Council's role from fact-finders to arbiters of "who is worse," which undermines the Honor Code itself.

  **Recommendation**
  To uphold both fairness and institutional trust, I propose the following two-step approach:

  1.  **Adjudicate Case #24-09 on its merits.** The Council's primary duty is to determine if the Honor Code was violated in the specific instance before us. The evidence regarding the phone usage must be evaluated independently of the reporter's history. The reporter acts as a witness to the incident, not the prosecutor; the Council represents the School's integrity, not the reporter's.
  2.  **Initiate a separate review of the reporter's prior conduct.** We cannot ignore the allegation that the reporter copied a lab report without consequence. If credible evidence exists, this constitutes a separate violation. Addressing this concurrently demonstrates that the Council does not protect "snitches" or "cheaters" but upholds the Code uniformly.

  **Conclusion**
  Dismissing the case punishes the community by allowing a potential violation to go unaddressed. Hearing the case without addressing the reporter's history punishes the community by suggesting rules are applied selectively. By doing both, we reinforce that the Honor Code is absolute. We must separate the *act* of reporting from the *character* of the reporter to ensure our rulings remain defensible and our culture remains one of genuine integrity.

  I urge the Council to vote to proceed with the hearing under these conditions.
