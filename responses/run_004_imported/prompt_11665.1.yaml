prompt: |-
  So we just finished the accuracy-first epistemology unit in my epistemic utility theory seminar and I'm still stuck on Berker's seperateness-of-propositions objection to the whole program. Can you write me a dialogue between a committed veritist (think Joyce/Pettigrew-style accuracy-first epistemologist) and someone pressing that objection on them? I don't want the veritist to just fold immediately - have them push back on whether "trading off" accuracy on one proposition against some totally unrelated one is really as illegitimate as the utilitarianism/separateness-of-persons analogy makes it sound, and have the objector actually respond to whatever move the veritist makes, instead of both of them just repeating their opening speech. Doesn't need to be long, half a page or so is fine, but neither of them should come off as the strawman - i want real back-and-forth, not two people talking past each other.
