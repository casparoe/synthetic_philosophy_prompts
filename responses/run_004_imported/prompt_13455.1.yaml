      *   *Continuity of Identity:* "You" aren't a single thread. You are a pattern. If 99.99% of the measure dies, the "you" that survives is a vastly diminished fraction of the total future existence associated with your current state.
      *   *Suffering/Quality of Life:* Survival isn't binary. You can survive maimed, in pain, or in a vegetative state. QI doesn't guarantee *good* survival, just *some* survival.
      *   *Decision Theory (UDT/TDT):* From a pre-commitment perspective, an agent should act to maximize expected utility across *all* branches, weighted by measure. Caring only about the survival branch is a form of indexical selfishness that contradicts standard rationalist decision theories.
      *   *The "Probability 1" Illusion:* Just because you *can't experience* death doesn't mean death doesn't happen to the entity that was you. The "you" reading this now has a future measure that splits. Most of that measure ends.

