          *   Ramban: Sacrifices predate idolatry (Abel, Noah). The altar is not trivial. Source: Commentary on Leviticus 1:9.
          *   Tension: Rambam's *Mishneh Torah* predicts the Messiah will rebuild the Temple and restore sacrifices, which seems contradictory if sacrifices are just a temporary concession to idolatry.
          *   Ramban's Positive View: What *do* sacrifices accomplish if not just weaning off idolatry? (Needs to be articulated clearly, likely focusing on *Kavanah*, submission, or metaphysical influence).
      *   **Format:** A dialogue between the two sages (anachronistic meeting).
      *   **Tone:** Respectful, rigorous, intellectually honest. No strawmen. No clear winner.
      *   **Constraint:** Both must be portrayed as deep thinkers. Rambam must defend his *Mishneh Torah* consistency. Ramban must offer more than just critique.

  2.  **Character Voices & Philosophies:**
