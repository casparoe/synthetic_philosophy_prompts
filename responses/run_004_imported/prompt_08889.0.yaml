      *   *Address Bounded Rationality:* Humans aren't ideal agents.
      *   *Conclusion:* The friend's argument is a classic "map vs. territory" error. It applies to idealized math agents, not humans. Disagreement doesn't prove irrationality; it proves the idealized conditions aren't met.

