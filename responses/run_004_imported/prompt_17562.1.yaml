  *Ending:* Needs to be somber. She submits the report stating the impossibility. The administration has to choose the parameter. She washes her hands of the "math solution."

  *Let's go.*
answer: |-
  The whiteboard in the data science lab was already a constellation of dry-erase smudges when Elena started drawing the curves. Outside, the rain battered the windows of St. Jude's Memorial, matching the rhythm of the server fans humming in the closet.

  "It's calibrated," Elena said, capping the black marker. "Look. For patients from the North District, if the model says 20% risk of septic shock, 20% go into shock. For the South District, same thing. If it says 20%, 20% crash. The probabilities mean what they say."

  Mark, the hospital's chief of staff and her reluctant partner in this pilot program, leaned against the doorframe. He held two styrofoam cups of coffee. He handed one to Elena. "So it's accurate."

  "It's statistically calibrated," she corrected. "But look at the error rates." She switched to a red marker. "Because the base rate of severe sepsis is higher in the South District—patients arrive later due to transport issues—the model assigns higher scores on average. If we set a single threshold for intervention, say 0.5, we catch most South District cases, but we miss too many North District cases. The False Negative Rate is skewed."

  "So lower the threshold for the North District," Mark suggested, taking a sip. "Tweak the knob."

  Elena uncapped the blue marker. "If I lower the threshold for the North to catch more sick people, I flag healthy people. The False Positive Rate spikes. Now I'm pulling nurses away from critical cases to check on stable patients. But if I adjust the thresholds to equalize the False Positive and False Negative rates across both districts..." She drew two intersecting bell curves, then crossed them out violently. "...then the score loses its meaning. A 0.6 risk for a North patient isn't the same as a 0.6 risk for a South patient. The calibration breaks."

  Mark frowned. "That sounds like a data problem. Maybe we aren't capturing the right features. If we had better intake data—"

  "We have perfect data, Mark," Elena said, her voice quiet. "That's the nightmare. I ran the simulation on synthetic data where the model knew the true physiological state perfectly. No bias in the measurements. No historical prejudice in the training labels. Just pure physiology and arrival times."

  She turned back to the board. "The theorem holds. Kleinberg, Mullainathan, Raghavan. Chouldechova. It doesn't matter how good the data is. If the prevalence of the outcome differs between groups, you cannot have calibration and error rate balance simultaneously. You have to choose which definition of 'fair' you want to violate."

  Mark set his coffee down. The hum of the servers seemed to grow louder. "So you're telling me the math says we have to be unfair?"

  "I'm telling you the math says 'fair' is not a single point," Elena said. "It's a frontier. We can be fair to the individual's probability assessment—calibration. Or we can be fair to the group error rates—equalized odds. But not both. Not unless the disease affects both districts equally, or unless I build a crystal ball."

  She spent the next three nights in the lab. It wasn't about finding a bug; it was about grieving the loss of a solution. She wrote scripts to optimize for calibration. The error rates diverged. She wrote scripts to balance the false negatives. The calibration plots twisted, lying to the doctors about the actual risk.

  On Thursday, she invited the ethics board. There were six of them, sitting around a conference table that smelled of lemon polish. Elena stood at the head, no whiteboard this time, just a slide deck.

  "We built the SepsisWatch algorithm," she began. "It predicts shock six hours before onset. It works. But it forces a choice."

  She clicked to a slide showing two paths.

  "Path A," she said. "We keep the scores calibrated. When the screen tells a doctor '40% risk,' it is 40% risk, regardless of where the patient lives. This preserves trust in the number. However, because South District patients arrive sicker, the model will flag them more often. To maintain calibration, the False Positive Rate for the South District will be higher. We will subject more healthy South District patients to unnecessary invasive tests."

  A woman in a grey suit raised her hand. "Resource allocation. That burdens the South District clinics."

  "Path B," Elena continued. "We adjust the thresholds to ensure equal False Positive and False Negative rates. Every district gets the same error profile. But now, the score is relative. A '40% risk' in the North might mean something different than '40% risk' in the South. The doctors can no longer trust the absolute number. They have to know the patient's zip code to interpret the risk."

  A silence settled over the room. It was the sound of people realizing that efficiency was a myth.

  "Can't we just... weight the loss function?" asked a young resident. "Penalize the errors in the South District more?"

  Elena shook her head. "That moves us along the curve. It doesn't dissolve the curve. If I penalize false negatives in the South, I increase false positives in the North. I am shifting the burden, not removing it. The tension is baked into the conditional probabilities. It's not a bug in the code. It's a property of the population."

  She thought of her study partner from grad school, the one who insisted better data would fix everything. She had believed him once. She had thought fairness was a cleaning problem, that if you scrubbed the dataset hard enough, the bias would wash out. But this wasn't dirt. It was geometry.

  "So what do you recommend?" the board chair asked. He looked tired. He wanted a signature on a form that said *Safe to Deploy*.

  Elena looked at her hands. She had wanted to build a machine that made the hard choices obsolete. She wanted to outsource the ethics to the optimization function. But the optimization function had handed the ethics back to her, wrapped in a proof of impossibility.

  "I cannot recommend a configuration," Elena said. "Because I cannot calculate the cost of a false negative versus a false positive in human terms. That is not a parameter I can tune. That is a value judgment."

  She clicked to the final slide. It was blank except for a single equation: $P(Y=1|S=s, A=a) = s$. Below it, the inequality showing the divergence of error rates.

  "If we choose calibration," Elena said, "we tell the truth about risk, but we accept disparate impacts on workflow and testing burdens. If we choose error balance, we equalize the burden, but we obscure the truth about risk. Both are unfair. One lies to the doctor. The other burdens the patient."

  The chair sighed, taking off his glasses. "So the algorithm doesn't decide."

  "No," Elena said. "The algorithm just reveals the trade-off. We have to decide. And we have to admit that whatever we choose, someone gets the short end of the stick. Not because the model is broken, but because the world is."

  She packed her laptop away. The rain had stopped. As she walked out of the hospital, she passed the ER intake desk. A triage nurse was arguing with a patient's family about priority. There was no algorithm there, just a human being making a impossible choice with incomplete information.

  Elena realized then that the theorem hadn't created the tension. It had just illuminated it. The impossibility was never in the math; it was in the triage. The math just refused to let them look away.

  She got into her car and drove home. She didn't turn on the radio. She let the silence sit in the passenger seat, heavy and unresolved. There was no fix coming. There was only the choice, and the morning shift where they would have to live with it.
