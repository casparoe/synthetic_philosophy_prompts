answer: |-
  Thank you all for being here. To the brothers and sisters from the motorcycle club: thank you for riding with him, and for riding with us now. To my family, thank you for holding each other up when the ground fell out.

  We are here to remember Walter. And I know that for all of us, the memory of this week is complicated. We are carrying two days in our heads: Tuesday, when the doctors spoke their piece, and Wednesday, when the machines were finally quiet. I know there is pain in that gap. I know there are questions about when exactly he left us.

  As someone who studies these questions for a living, I am often asked to explain the difference between a heartbeat and a life. But today, I am not standing here as a professor. I am standing here as his nephew. And because I love him, and because I love you, I am not going to offer you a seminar. I am going to offer you the truth as best as we can hold it.

  Walter died on Tuesday.

  I say this plainly, not to dismiss what anyone saw or felt, but to honor who Walter was. When we speak of a person, we speak of a mind, a spirit, a connection. We speak of the uncle who told bad jokes, the rider who leaned into the curves, the man who made the choice to donate his organs so that others might live. That man—that specific, irreplaceable person—died on Tuesday. When his brain died, the light that was Walter went out.

  I know this is hard to accept, Aunt Deb. I know you sat with him. I know you felt the warmth of his hand and saw the rise of his chest. That was not a lie. That was his body, magnificent and resilient, continuing a rhythm that had served him for decades. But a body can beat without the person being home. To say he died on Tuesday is not to say your vigil was a fiction. It is to say that the Walter you loved was already gone, and what remained was the vessel he chose to leave behind for one final act of generosity.

  And Mark, you stood on the other side of this, seeing the clinical reality. You knew that the organism as a whole had ceased. You carried the weight of that knowledge so the rest of us didn't have to.

  By committing to Tuesday, we protect the sanctity of his gift. If Walter was alive on Wednesday, then the surgery took his life. But because he died on Tuesday, the surgery honored his wish. He did not give his life for those organs; he gave his organs after his life was over. That distinction matters. It matters for the record, but more importantly, it matters for our peace. It means we do not have to carry the burden of thinking he was taken from us too soon. He was gone. And in that grace, he saved lives.

  To the riders here: Walter didn't like long goodbyes. He liked the open road, and he liked knowing that when the ride ended, he left the bike in good shape for the next person. In a way, that is what he did. On Tuesday, his ride ended. On Wednesday, he passed the helmet on.

  So, let us not split our memories between two days. Let us agree that Tuesday was the end of his struggle, and Wednesday was the beginning of his legacy.

  Walter is not in the cold ground we will look at in a moment. He is in the recipient who wakes up breathing for the first time in years. He is in the memory of a engine roaring down the highway. He is in the love we still feel, which proves that while the brain may die, the connection does not.

  Rest easy, Uncle Walter. The engine is off. The ride was good. And we will take it from here.
