answer: |-
  You are absolutely right, and your flatmate is falling for a very common misconception.

  The **Sunk Cost Fallacy** is a *psychological* error: "I've already spent $50, so I must spend $10 more to make that $50 worth it." It's internal and emotional.

  The **Dollar Auction** is a *structural* trap. Even a perfectly rational robot with no feelings about "wasted effort" would get caught in it. Why? Because the rules of the game change the math of the *next* move. Once you are the second-highest bidder, quitting guarantees a loss. Bidding higher offers a *probability* of a smaller loss (or a win). As long as there is a chance the opponent will fold, bidding higher is the mathematically dominant strategy.

  Here is a realistic, non-monetary example that captures this rival-driven escalation, where calling it "sunk cost" misses the point entirely.

  ### The Example: The "Public Correction" Feud (Professional Reputation)

  Imagine two experts in a niche field (say, cybersecurity or academic economics) who get into a public disagreement on a platform like LinkedIn or X (Twitter).

  **The Setup:**
  *   **The Prize:** Professional status. Being seen as the authority who is "right."
  *   **The Bid:** Each public reply/thread. The "cost" is time, stress, and the risk of looking petty or obsessive to the wider audience.
  *   **The Dollar Auction Rule:**
      *   **Highest Bidder (Last person standing):** Gets the "last word." The audience generally assumes the person who didn't reply further conceded the point. You maintain your status.
      *   **Second-Highest Bidder (The one who stops first):** You don't just fail to win; you actively *lose* status. By going silent, you implicitly admit defeat. Your past replies now look like the flailing of someone who ran out of arguments.

  **The Escalation:**
  Expert A posts a critique. Expert B rebuts. Expert A rebuts the rebuttal.
  Now they are 10 tweets deep. Both are looking slightly unhinged to the audience. A rational observer would say, "Stop, you're both damaging your brands."

  **The Trap:**
  Expert A considers stopping.
  *   **If A stops now:** A looks like they lost the argument. Their reputation takes a hit (e.g., -10 reputation points). The time spent on the previous 10 tweets is "wasted" in the eyes of the public.
  *   **If A tweets one more time:** A risks looking *more* obsessive (-2 reputation points for the tweet). BUT, if this tweet is strong enough, it might force Expert B to stop. If B stops, B takes the -10 hit, and A recovers their status.

  **Why Expert A tweets again:**
  It isn't because A is emotionally attached to the first 10 tweets (Sunk Cost).
  It is because A calculates: *"If I stop, I definitely lose 10 points. If I tweet again, I might lose 2 points now, but I have a 40% chance of forcing B to fold, which saves my reputation."*

  Expert A is bidding not to recoup the past, but to **minimize the inevitable loss** based on Expert B's likely behavior.

  ### Why "Sunk Cost Fallacy" is the Wrong Label

  If you label this as Sunk Cost, you are assuming the escalation is driven by **backward-looking emotion** ("I can't waste all that typing I already did!").

  If you label it as a Dollar Auction/War of Attrition, you recognize the escalation is driven by **forward-looking strategy** ("If I quit now, my rival wins by default. I must bid higher to test their breaking point.").

  **The Critical Difference:**
  1.  **Sunk Cost:** I continue because *I* feel bad about my past investment. (Internal)
  2.  **Dollar Auction:** I continue because *you* are still in the game, and quitting right now is the most expensive option available to me. (External/Strategic)

  In the Dollar Auction, a rational player *should* escalate once the bidding passes $1.00.
  *   **Bid $1.00 vs $1.05:**
      *   If you are at $1.00 and quit: You lose $1.00.
      *   If you bid $1.05 and win: You pay $1.05, get $1.00. Net loss = $0.05.
      *   **Losing $0.05 is better than losing $1.00.**

  Therefore, the escalation is **locally rational**. Your flatmate is mistaking a *game theory equilibrium* for a *cognitive bias*. The tragedy of the Dollar Auction isn't that people are irrational; it's that the rules of the game make rationality look like madness.

  ### Summary for your Flatmate
  Tell him: "Sunk cost is about not wanting to waste *my* past effort. The Dollar Auction is about realizing that if I stop now, *you* win, and I pay the penalty for losing. I'm not bidding to save my past bids; I'm bidding to force you to fold so I lose less than you do."
