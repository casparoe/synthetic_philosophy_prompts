          *   *Indeterminism:* Imagine two identical twins, Alice and Betty. I tell you "One of them will commit a crime tomorrow." If I can't tell you *which* one, is the future determined?
          *   *Refining for Spacetime:* The points are the twins. The metric/field values are the properties (committing the crime). If points are real individuals, swapping the metric field between Point A and Point B is like swapping the "crime" property between Alice and Betty. If the theory doesn't tell us *which* point gets the curvature, the future of *that specific point* is undetermined.
