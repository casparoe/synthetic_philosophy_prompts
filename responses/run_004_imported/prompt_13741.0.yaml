      *   *Check:* Did I explain why Earman/Norton revived it? Yes, to attack substantivalism specifically.
      *   *Check:* Is the distinction between "redundancy" and "indeterminism" clear? Redundancy = same state, different math. Indeterminism = different states, same past. The substantivalist is forced into the latter.
