      *   *The User's Confusion:* If the two models agree on all observables, why does it matter that they differ mathematically? Isn't that just gauge freedom?
      *   *The Substantivalist's Trap:* If spacetime points are *real things* (substances), then swapping properties between them makes a real difference, even if we can't see it.
