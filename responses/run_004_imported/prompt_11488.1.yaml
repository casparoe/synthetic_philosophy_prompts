answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Rain taps against the window. Dr. Elena Vance (Knowledge Norm) and Dr. Marcus Thorne (Truth Norm) are finishing a pot of coffee.*

  **Elena Vance:** You're making my job difficult, Marcus. I'm trying to draft guidelines for scientific press releases, and every time I write "experts should only state what they know," you send me a paper arguing that truth is the only metric that matters.

  **Marcus Thorne:** Because it *is* the only metric that matters, Elena. If the goal of communication is to share information, why gatekeep it behind the speaker's internal mental state? If a statement is true, asserting it improves the common stock of knowledge. If it's false, it degrades it. The speaker's epistemic position is secondary.

  **Elena:** Secondary? That's dangerous. Assertion isn't just data transfer; it's a social act. When I assert $P$, I invite you to rely on $P$. I'm giving you my word. If I don't know $P$, I'm misleading you about the strength of my position, even if $P$ turns out to be true.

  **Marcus:** That sounds like a worry about trust, not truth. Let's test it. Take the lottery case. A fair lottery, one million tickets. Ticket #452 is in the draw. The odds of it losing are 99.9999%. It is, for all practical purposes, certain that Ticket #452 has lost. In fact, let's stipulate: it *has* lost. It is true. Why, on your view, is it improper for me to walk up to the ticket holder and flatly assert, "Your ticket has lost"?

  **Elena:** Because you don't *know* it. You have statistical evidence, not knowledge.

  **Marcus:** But why not? The probability is higher than many things we claim to know. I know my car is parked outside, but the probability of it being stolen since I checked is non-zero. Yet I'll assert, "My car is outside." Why is the lottery different? If my claim is true, and the evidence is overwhelming, what harm is done?

  **Elena:** The harm is in the *basis* of the claim. If you assert your car is outside, you're relying on memory and perception. If I challenge you, you say, "I saw it there." If you assert the lottery ticket lost, you're relying on odds. If the ticket holder asks, "How do you know?" you have to say, "Well, statistically..." And if they say, "But it could be the winner," you have to concede, "Yes, technically." That concession undermines the assertion. It shows you didn't have the authority to assert it flatly.

  **Marcus:** I think you're conflating *asserting* with *guaranteeing*. Look, this is the hard spot for your view, Elena, but it's actually the hard spot for mine too, so let me be honest. I admit, it feels weird to assert the lottery loss. But I don't think it violates a norm of *truth*. I think it violates a norm of *helpfulness*.

  **Elena:** How so?

  **Marcus:** If I tell you the ticket lost, I'm not giving you new information you can act on. You already know the odds. But more importantly, if I'm wrong—if by some miracle it *is* the winning ticket—I've caused you to throw away a winning ticket. But suppose I'm right. The proposition is true. On my account, the assertion was proper *ex post facto*. The impropriety you feel is pragmatic. You feel I'm misleading you into thinking I have inside information.

  **Elena:** But that "misleading" feeling *is* the ethical violation! In scientific communication, if a press release says, "This drug is safe," based solely on statistical models that haven't been clinically verified, they are asserting a "lottery proposition." It might be true. The drug might be safe. But if they don't *know* it—if they haven't ruled out the defeaters—they shouldn't assert it.

  **Marcus:** I see your point on safety. But let's push the lottery intuition. Suppose the lottery has already happened. The results are in a sealed envelope. I haven't seen the envelope. You have. You know Ticket #452 lost. I assert, "Ticket #452 lost." You know I'm guessing. But I happen to be right. Did I lie? No. Did I speak falsely? No. On your Knowledge Norm, I violated a rule. On my Truth Norm, I did nothing wrong, though I was reckless.

  **Elena:** You were reckless *because* you violated the rule! The rule exists to prevent recklessness. But let's move to the case that keeps me up at night. The one you love. Jennifer Lackey's science teacher.

  **Marcus:** Ah, the creationist teacher.

  **Elena:** Exactly. A high school biology teacher. She is professionally competent. She knows the evidence for evolution is overwhelming. She presents the theory to her class, explains the mechanisms, cites the fossils. She asserts, "Humans evolved from earlier hominids." But, due to her private religious convictions, she does not *believe* this. She thinks it's false, even though she admits the scientific evidence is solid.

  **Marcus:** And she teaches it anyway. Because it's her job. And she's right to.

  **Elena:** That's the problem. She is asserting $P$. $P$ is true. But she does not believe $P$. If she doesn't believe it, she cannot *know* it. Knowledge entails belief. So, on the Knowledge Norm, she is asserting improperly. She is violating the norm of assertion. But intuitively, Marcus, she is doing the *right* thing. She is being a responsible educator.

  **Marcus:** Precisely. This is why the Truth Norm is superior for expert communication. She is conveying truth to the students. Her internal psychological state is irrelevant to the students' need for accurate information. If you enforce the Knowledge Norm, you force her to either lie about her beliefs or stay silent. Both options deprive the students of the truth.

  **Elena:** I'm not sure I have to accept that conclusion. It's the hardest case for me, I grant you. But consider: when she stands in that classroom, is she speaking as *herself*? Or is she speaking as a conduit for the scientific community?

  **Marcus:** That sounds like a dodge. She's the one opening her mouth.

  **Elena:** Is it? When a pilot reads a pre-flight checklist, she asserts, "Cabin pressure is normal." She might not have checked it herself; she trusts the sensor. If the sensor is right, she knows. But suppose the sensor is glitchy, yet the pressure *is* normal. If she asserts it, is she lying? In the teacher's case, she is asserting on behalf of the discipline. The "speaker" isn't the individual woman; it's the institution of science.

  **Marcus:** That's a nice metaphysical trick, Elena, but it doesn't hold up under pressure. The students look at *her*. If she says, "I don't believe this, but science says it's true," she undermines the lesson. To teach effectively, she must assert it flatly. "Evolution occurred." If the Knowledge Norm says she shouldn't do that because she lacks personal belief, then the Knowledge Norm is an obstacle to education.

  **Elena:** Okay, let me concede a point. Perhaps "knowledge" in a professional context isn't identical to "personal belief." Perhaps she *does* know, in her capacity as a teacher, because she possesses the evidence, even if her personal worldview resists it.

  **Marcus:** Now you're stretching the definition of knowledge to fit the norm. You're saying she "knows" even though she doesn't believe? That contradicts the standard analysis of knowledge.

  **Elena:** Or it suggests that assertion in expert contexts isn't about the individual's mind. But let me turn the screw back on you. The Teacher case works for you because the claim is *true*. Evolution is real. But imagine a variation. Suppose the teacher is teaching a theory that is currently accepted, well-supported, but actually *false*. Like Newtonian physics before Einstein. She asserts, "Mass is constant." It's false. But she has the same evidence the scientific community had at the time.

  **Marcus:** If it's false, she shouldn't assert it as absolute truth.

  **Elena:** But she has the same epistemic position as the evolution teacher! By your lights, the evolution teacher is proper because the fact is true. The Newtonian teacher is improper because the fact is false. But they have the exact same evidence, the same justification, the same lack of belief. The only difference is the state of the universe.

  **Marcus:** Yes. Because the norm is truth.

  **Elena:** But how can a norm be something the speaker *cannot check*? I can check if I have evidence. I can check if I believe. I cannot check if $P$ is true in a mind-independent way before I assert it. If the norm is truth, then no one ever knows if they are following the norm until after the fact. That makes it useless as a guide for action.

  **Marcus:** It's not useless. It sets the standard. We aim for truth. We use evidence as the proxy. In the Newtonian case, she asserts what is, at the time, the best approximation of truth. If we discover later it was false, we correct the record. But in the Lottery case, Elena, you still haven't satisfied me. Why is it *wrong* to assert the ticket lost? If the norm is knowledge, and knowledge requires ruling out alternatives, you can't rule out the ticket winning. So you can't assert. But if I'm a journalist reporting on the lottery odds, I say, "Ticket 452 is almost certainly a loser." That's fine. Why can't I drop the "almost certainly"?

  **Elena:** Because "almost certainly" signals the probabilistic basis. Dropping it signals knowledge. When you drop the hedge, you change the social contract. You're saying, "I have a position that excludes the alternative." In the lottery, you don't. In the teacher case, the teacher *does* have a position that excludes the alternative—she has the scientific evidence. Her personal belief is the outlier.

  **Marcus:** So you're admitting that evidence matters more than belief?

  **Elena:** I'm admitting that *warrant* matters. Knowledge is warranted true belief. The teacher has the warrant. The lottery player has statistical warrant, which is different. Statistical warrant doesn't support knowledge of specific instances.

  **Marcus:** We're going in circles. You're protecting the Knowledge Norm by tweaking the definition of knowledge or the speaker. I'm protecting the Truth Norm by appealing to the value of information flow.

  **Elena:** It seems we value different things. I'm worried about the erosion of trust. If experts assert things they don't know, and they turn out to be wrong—even if they were statistically likely to be right—the public loses faith. The Knowledge Norm is a shield for the audience.

  **Marcus:** And I'm worried about the stagnation of information. If experts are afraid to assert truths because they lack some internal state of "certainty" or "belief," we lose the benefit of their access to facts. The Truth Norm is a bridge for the audience.

  **Elena:** So, for the press release?

  **Marcus:** Write: "Assert what is true."

  **Elena:** And I'll write: "Assert what you know."

  **Marcus:** And the difference?

  **Elena:** *Huge.*

  **Marcus:** *(Smiles)* Coffee?

  **Elena:** Yes. I think we're both going to need it.
