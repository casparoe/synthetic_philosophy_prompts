answer: |-
  **Setting:** *A small, insulated observation chamber. The thermostat is set to a slow, automated climb from 5°C to 40°C over the course of an hour. **ELENA** sits on a metal chair, wrapped in a thin blanket. **MARCUS** stands by a control panel with a timer. He holds a clipboard.*

  **Marcus:** (Checking watch) Time zero. Temperature is five degrees. Elena, do you feel cold?

  **Elena:** (Shivering slightly) Obviously. My teeth are chattering.

  **Marcus:** And do you *know* that you feel cold?

  **Elena:** Marcus, we've been over this. It's a mental state. If I feel it, I know it. That's the definition of luminosity. The light is on, so I see the light.

  **Marcus:** So, you satisfy the KK principle? If you know you're cold, you know that you know?

  **Elena:** In this case, yes. There's no gap between the sensation and the awareness of the sensation. It's immediate. I don't need to infer it from my shivering. I just *know*.

  **Marcus:** (Makes a note) Okay. Let's wait three minutes. The heater ramps up by half a degree.

  *(Silence. The hum of the ventilation system shifts pitch. Elena pulls the blanket tighter, but her shivering subsides.)*

  **Marcus:** Time $t_1$. Three minutes in. Do you feel cold?

  **Elena:** Yes. Still cold.

  **Marcus:** Do you know you feel cold?

  **Elena:** Yes.

  **Marcus:** Here's the problem, El. Consider time $t_2$, three minutes from now. You admit the change is gradual. Phenomenologically, $t_1$ and $t_2$ are indistinguishable. You can't tell the difference between your current state and the state you'll be in three minutes from now.

  **Elena:** I don't need to tell the difference between *times* to know my current state. I'm reporting on *now*.

  **Marcus:** But knowledge requires safety. To know you're cold at $t_1$, your belief has to be safe. It couldn't easily have been wrong. But since $t_1$ is indistinguishable from $t_2$, for all you know, you could be at $t_2$. And if the heating continues, eventually you won't be cold. If you can't distinguish the cold moment from the not-cold moment nearby, you don't have a margin for error.

  **Elena:** You're treating my mind like a thermometer. A thermometer needs a margin of error because it's measuring an external variable. I'm not measuring my coldness; I'm *inhabiting* it. The state is self-intimating.

  **Marcus:** (Steps closer) Let's push it. Suppose you claim to know you're cold at every single minute where you feel cold. We have a sequence: $t_1, t_2, t_3$... all the way to $t_{100}$, where you're sweating profusely. If luminosity holds, and you know at $t_1$, and $t_1$ is relevantly similar to $t_2$, then you must know at $t_2$. By transitivity, you'd have to know you're cold at $t_{100}$. But at $t_{100}$, you're hot. So you'd know a falsehood. Which is impossible.

  **Elena:** (Wiping her forehead) So you're saying knowledge cuts off before the feeling does?

  **Marcus:** I'm saying knowledge requires a buffer. To know you're cold, you have to be in a state where you *couldn't easily* be not cold. But in a gradual transition, every moment is a moment where you *could easily* be slightly warmer.

  **Elena:** That assumes "knowing" is the same as "being able to discriminate." Maybe I can know I'm cold even if I can't tell the exact boundary where coldness ends. Why does my inability to spot the cutoff negate my awareness of the present?

  **Marcus:** Because if you can't spot the cutoff, you can't rule out that you've already crossed it. Imagine a sorites heap. If you can't tell the difference between one grain and two, you can't know when the heap begins. Your internal access isn't magic; it's subject to the same vagueness as the external world.

  **Elena:** (Shifts uncomfortably) It's getting stuffy. But... I still feel a chill.

  **Marcus:** Time $t_{10}$. Fifteen minutes in. Do you feel cold?

  **Elena:** (Pauses) I... I think so?

  **Marcus:** "I think so"? A minute ago you said "Obviously."

  **Elena:** It's less sharp. The signal is noisier.

  **Marcus:** Exactly. The luminosity is fading before the sensation has fully gone. This is the margin-for-error principle in action. As you get closer to the boundary, your confidence drops *before* the state changes. You lose the knowledge before you lose the cold.

  **Elena:** Or maybe... maybe I'm just bad at introspection. Maybe the KK principle fails because *I'm* flawed, not because knowledge itself requires a margin.

  **Marcus:** Williamson's point is that it's not about *you* being flawed. It's about the nature of knowledge. Knowledge is a non-luminous state. Even an ideal agent in this room would lose knowledge of the cold before the cold disappears, because the nearby possible worlds where they are slightly warmer are too close to rule out. You can't be in a position to know $p$ if $p$ is too unstable.

  **Elena:** (Stands up, pacing) But that makes the mind opaque. If I can't know when I'm in pain, or when I'm cold, or when I'm doubting... then I'm a stranger to myself. That's a hard pill for an internalist to swallow.

  **Marcus:** It's not that you're a stranger. It's that you're not a glass house. You're a biological system with resolution limits.

  **Marcus:** (Checks timer) Thirty minutes. Halfway. Temperature is 22 degrees. Room temperature. Do you feel cold?

  **Elena:** No.

  **Marcus:** Do you know you don't feel cold?

  **Elena:** (Hesitates) I know I feel neutral. But did I *know* the exact second the cold stopped?

  **Marcus:** No.

  **Elena:** So there was a period where I felt cold, but I didn't know I felt cold?

  **Marcus:** Or a period where you knew, and then stopped knowing, while the feeling persisted. The alignment isn't perfect.

  **Elena:** (Sits back down, fanning herself) It's weird. I came in here sure that my mind was the one place I had authority. That if I said "I am in state X," I was right by definition.

  **Marcus:** And now?

  **Elena:** Now I'm sweating, and I'm not entirely sure when the chill actually left. I feel like I missed the exit.

  **Marcus:** That's the interoceptive gap. You're trying to measure the vessel while you're inside the vessel. You need a margin for error because you're part of the system you're measuring.

  **Elena:** So Williamson wins. Luminosity is dead.

  **Marcus:** (Smiles) Knowledge isn't about being luminous, El. It's about being reliable. And right now, your reliability is overheating.

  **Elena:** (Laughs weakly) Turn the heat down, Marcus. I know I'm hot.

  **Marcus:** Are you sure?

  **Elena:** ...Give me a minute. I need a margin for error.
