answer: |-
  You have done your homework. The irony you've spotted is real: the ethos of the Rationalist community (and the name "LessWrong" itself) relies on the intuitive notion that false beliefs can be ordered by their distance from the truth. Yet, the formal philosophical project intended to ground exactly that intuition is widely considered to be in a state of severe crisis, if not outright failure.

  You asked for the **strongest version of the argument** that verisimilitude is a dead end. I will lay that out for you. This is the "Skeptical Case," drawing primarily on the work of David Miller and the implications of the Tichý proof.

  Here is the argument for why "Theory A is objectively closer to the truth than Theory B" is ill-defined when both are false.

  ### 1. The Popperian Collapse (The Content Problem)
  First, we must concede the point you already found: Popper's original definition is mathematically dead.
  Popper defined verisimilitude ($Vs$) using sets of consequences. A theory $A$ has higher $Vs$ than $B$ if $A$ has more *true* consequences and no more *false* consequences (or equal true and fewer false).

  **The Tichý/Miller Proof (1974):**
  They proved that for any two false theories, this ordering collapses.
  *   If Theory $A$ is false, it has at least one false consequence.
  *   If you try to make $A$ "closer" to the truth by adding more true consequences, you inevitably expand the logical content of the theory.
  *   In classical logic, expanding the content of a false theory *necessarily* expands its falsity content as well (because a false premise combined with valid inference rules can generate infinite false consequences).
  *   **Result:** Under Popper's definition, no false theory can ever be ranked as having more verisimilitude than another false theory. They are all incomparable. Since, as you noted, fallibilism suggests *all* our comprehensive theories are false, Popper's metric renders scientific progress impossible to measure.

  ### 2. The Similarity Rescue (and The Language Trap)
  Philosophers like Ilkka Niiniluoto and Graham Oddie tried to save the concept by shifting from "logical content" to "similarity."
  *   **The Idea:** Imagine all possible states of the world as points in a logical space. The "Truth" is one specific point. A theory is a region or a point in that space.
  *   **The Metric:** Theory $A$ is closer to the truth than Theory $B$ if $A$ is "physically" or "logically" nearer to the True state of affairs (e.g., it gets more atomic facts right).

  **The Miller Language Dependence Argument:**
  This is the hammer blow. David Miller showed that "similarity" is not an objective feature of the world; it is a feature of the *language* you use to describe the world. There is no "privileged" language that God uses; there are only human descriptions.

  **The Weather Example:**
  Imagine the true state of the weather is: **Hot ($h$), Rainy ($r$), Windy ($w$).**
  *   **Theory 1:** $\neg h, r, w$ (It is not hot, but rainy and windy). **Error count: 1.**
  *   **Theory 2:** $h, \neg r, \neg w$ (It is hot, but not rainy and not windy). **Error count: 2.**

  Intuitively, Theory 1 is closer to the truth. It only misses on temperature. Theory 2 misses on rain and wind.

  Now, let's change the language. We keep the same physical reality, but we change our primitive predicates. Let's define a new property, "Minnesotan" ($m$), such that $m \leftrightarrow (h \leftrightarrow r)$. (Roughly: $m$ is true if it is both hot and rainy, or neither).
  *   **True State:** $h$ (T), $r$ (T), $w$ (T). Therefore $m$ is **True**.
  *   **Theory 1:** $\neg h$ (F), $r$ (T), $w$ (T). Since $h$ is F and $r$ is T, $m$ becomes **False**.
      *   Theory 1 errors in new language: $h$ (wrong), $m$ (wrong). **Error count: 2.**
  *   **Theory 2:** $h$ (T), $\neg r$ (F), $\neg w$ (F). Since $h$ is T and $r$ is F, $m$ becomes **False**.
      *   Theory 2 errors in new language: $r$ (wrong), $w$ (wrong), $m$ (wrong). **Error count: 3.**

  Wait, Theory 1 is still better? Let's try a different translation. Define "Arizonan" ($a$) such that $a \leftrightarrow (h \leftrightarrow w)$.
  Through specific logical translations (which Miller formalized), you can construct a language where **Theory 2 appears closer to the truth than Theory 1.**

  **The Implication:**
  If "closeness to truth" flips depending on whether you describe the weather using {Hot, Rainy, Windy} or {Hot, Minnesotan, Arizonan}, then verisimilitude is **language-relative**. It is not an objective relation between theory and world; it is a relation between theory, world, *and vocabulary*.

  ### 3. The "Natural Kinds" Defense (and Why It Fails)
  Defenders of verisimilitude (like Niiniluoto) argue: "Sure, language matters, but the *world* has a structure. Some languages 'carve nature at its joints' (Natural Kinds). We should measure distance using the *correct* primitive predicates (e.g., mass, charge, spin), not gerrymandered ones like 'Minnesotan'."

  **The Skeptical Counter-Argument:**
  This defense renders verisimilitude useless for the history and progress of science.
  1.  **Epistemic Circularity:** To know which language is the "correct" one (which predicates are the Natural Kinds), you essentially need to know the Truth already. If you knew the true ontology of the universe, you wouldn't need a metric to tell you which theory is closer to it.
  2.  **Incommensurability:** Science changes its ontology. Newtonian physics uses "mass" and "force." General Relativity uses "spacetime curvature." Quantum Mechanics uses "wavefunctions." These are different languages. If verisimilitude requires a fixed language to measure distance, you cannot compare Newton to Einstein. You cannot say Einstein is *closer* to the truth; you can only say he is closer *relative to a specific linguistic framework*.
  3.  **No Neutral Ground:** There is no theory-neutral language. Any choice of "basic predicates" presupposes a theory about what is fundamental. Therefore, measuring verisimilitude presupposes the truth of the very theory you are trying to test.

  ### 4. The Access Problem
  Even if we grant that there *is* an objective fact of the matter about which theory is closer (metaphysical verisimilitude), there is a stronger argument that the concept is a dead end for *science* (epistemic verisimilitude).

  To calculate the distance from the truth, you must know the coordinates of the Truth.
  *   If you know the Truth, you don't need science.
  *   If you don't know the Truth, you cannot calculate the distance.

  Therefore, verisimilitude cannot be a *criterion* for theory choice. It might be a *goal*, but it cannot be a tool. You can never look at two false theories and say, "My calculations show A is 15% closer to reality than B." You can only say, "A fits the current data better," which is just empirical adequacy, not truthlikeness.

  ### 5. The Synthesis: Why It's a Dead End
  Putting these together, the strongest argument that the project is a dead end is this:

  1.  **Formal Instability:** Any formal definition of "closeness" between false theories is vulnerable to language dependence (Miller). There is no mathematical way to fix the primitives without begging the question.
  2.  **Epistemic Inaccessibility:** Any definition that relies on comparing theories to the "True State of Affairs" requires knowledge of the True State of Affairs, which is ex hypothesi unavailable to fallible agents.
  3.  **Historical Inapplicability:** Because scientific revolutions change the language/ontology itself (Kuhnian incommensurability), there is no stable metric space across which to measure progress from Aristotle to Newton to Quantum Field Theory.

  **Conclusion:** The statement "Theory A is objectively closer to the truth than Theory B" is **ill-defined**. It looks like a meaningful sentence, but it lacks a truth condition that can be grounded without circularity or language-relativity.

  ### The Uncomfortable Implication for "LessWrong"
  You noted the irony regarding the site's name. If the skeptics are right, the phrase "Less Wrong" is metaphorically useful but formally incoherent.
  *   You can be **more empirically adequate** (predict data better).
  *   You can be **more logically consistent**.
  *   You can be **more useful**.
  *   But you cannot be **ontologically closer** in a way that is objective, language-independent, and measurable.

  ### A Necessary Caveat (The State of the Field)
  I must add a footnote for intellectual honesty: While the arguments above are the *strongest case for skepticism*, the debate is not universally settled.
  *   **Niiniluoto** has spent decades refining "min-sum" measures and arguing that if we restrict ourselves to "similarity classes" based on causal structures, language dependence can be mitigated.
  *   **Oddie** argues that some concepts are genuinely more natural than others, and we can have fallible access to which ones they are.
  *   **Bayesian Approaches:** Some modern rationalists sidestep Popper entirely. They don't talk about "truth content"; they talk about **probability assignments**. In Bayesianism, you don't need to measure distance to the truth; you just update your credence based on evidence. A model with higher posterior probability is "preferred," regardless of its ontological truthlikeness.

  **Verdict:** If you demand an *objective, language-independent, formal metric* for comparing the truthlikeness of two false theories, the project is a dead end. The Tichý/Miller proofs and the Language Dependence argument effectively kill that specific hope. If you are willing to accept a pragmatic, language-relative, or Bayesian proxy for "closeness," the concept survives, but it loses the strong realist bite that Popper (and likely the founders of LessWrong) intended.

  So, is "Less Wrong" a lie? Formally, yes. Pragmatically, it's a shorthand for "Higher Posterior Probability," which is coherent, but it's not the same as "Closer to the Truth."
