prompt: |-
  So I'm on my school's Honor Council (it's the student group that hears academic integrity cases and recommends sanctions to the dean) and we've got a case this week that's got us stuck. Five kids in AP Chem used a group chat to divide up a take-home problem set that was supposed to be done individually, then everybody copied everyone else's answers before turning it in -- except two of them insist there was never an actual agreement to do this, they say it just snowballed out of a chat people normally use to ask for hints. Half the council wants to treat this as five seperate cheating violations and scale the punishment to how much each person copied; the other half thinks that misses the point, since this was fundamentally something they did together, and we should be judging the group act itself, maybe holding the two who organized the chat more responsible than the ones who barely contributed. Our honor code just says 'collaborating on individually assigned work is a violation' and doesn't say anything about how to handle a group case like this one. Can you write the memo I have to bring to wednesdays meeting -- it needs to actually recommend concrete sanctions (and when they'd kick in), not just 'it depends,' and it has to seriously deal with the side that says we should just treat this as five individual violations?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the School's Honor Council.
      *   **Task:** Write a memo for the upcoming Wednesday meeting regarding a specific academic integrity case.
      *   **Case Details:** 5 students in AP Chem used a group chat to divide up a take-home problem set (individual work). All copied answers. 2 claim no agreement (say it "snowballed" from a hint chat).
      *   **The Conflict:** Half the council wants to treat it as 5 separate violations (scaled by individual copying). The other half wants to treat it as a group act (potentially holding organizers more responsible).
      *   **Honor Code:** "Collaborating on individually assigned work is a violation." (Vague on group dynamics).
      *   **Requirements:**
          *   Recommend *concrete sanctions* (and timing).
          *   Do *not* say "it depends."
          *   Seriously address/counter the argument for treating them as 5 individual violations.
          *   Tone: Professional, persuasive, fair, administrative.

  2.  **Determine the Stance/Recommendation:**
      *   The prompt asks me to write the memo *I* have to bring. I need to pick a side to make a concrete recommendation.
      *   *Option A (5 Individual Violations):* Easier to administer, strictly textualist. But ignores the conspiracy aspect and the "organizer vs. follower" dynamic.
      *   *Option B (Group Conspiracy with Differential Responsibility):* Acknowledges the collective harm, addresses the "organizer" vs. "passive participant" nuance, but risks looking like "gang punishment."
      *   *Decision:* The prompt implies the council is stuck. A good memo should bridge the gap but make a firm recommendation. The most equitable approach in student conduct is usually recognizing the *collusion* as the primary violation while differentiating based on *intent and leadership*. However, the prompt specifically asks to "seriously deal with the side that says we should just treat this as five individual violations."
      *   *Strategy:* I will recommend a hybrid approach that acknowledges the collective nature of the violation (collusion) but applies sanctions individually based on evidence of intent/leadership. This addresses the "group act" concern while satisfying the due process need for individual accountability. I need to make sure I don't waffle. I will recommend finding all 5 responsible, but with tiered sanctions.
      *   *Wait, looking closer at the prompt:* "The other half thinks... we should be judging the group act itself, maybe holding the two who organized the chat more responsible."
      *   *My Recommendation:* I will side with the "Group Act/Differential Responsibility" model but ensure it's grounded in individual evidence. Why? Because treating it as 5 separate isolated incidents ignores the *collusion* element which makes the violation worse than just one kid copying from a key. It was a coordinated effort to bypass the learning objective.
      *   *Addressing the Opposition:* I need to explicitly explain why the "5 separate violations" model is insufficient (it misses the conspiracy aspect, it fails to deter organized cheating).

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose (recommendation for Case #X).
      *   **Case Summary:** Briefly recap the facts (5 students, AP Chem, group chat, divided labor, copied answers, 2 deny agreement).
      *   **The Core Question:** Individual vs. Collective responsibility.
      *   **Addressing the Counter-Argument (Crucial Step):** I need to validate the "5 individual violations" view (it ensures due process, aligns with the text of the code) but explain why it falls short here (ignores the *agreement* to cheat, minimizes the harm of organized collusion).
      *   **Recommendation:**
          *   Finding: All 5 responsible.
          *   Sanctions: Tiered. Organizers (if proven) get heavier sanctions. Followers get standard sanctions.
          *   Specifics: Failing grade on assignment? Course failure? Suspension? Probation? Let's go with a standard progression: F on assignment + Educational sanction for followers; F on assignment + Probation/Suspension for organizers.
          *   Timing: Immediate.
      *   **Addressing the "Two Deniers":** How to handle the 2 who say it "snowballed"? If the chat logs show division of labor, the "snowball" defense is weak. I need to recommend treating the *action* (dividing work) as the proof of agreement, regardless of verbal confirmation.
      *   **Conclusion:** Call to vote.

  4.  **Refining the Tone:**
      *   Must sound like a student leader but professional.
      *   Must be decisive ("I recommend," not "We could").
      *   Must be empathetic but firm on integrity.

  5.  **Self-Correction/Review during drafting:**
      *   *Critique:* Did I give concrete sanctions?
      *   *Fix:* Ensure I specify "Zero on the assignment," "Academic Probation," etc.
      *   *Critique:* Did I address the "5 individual violations" side?
