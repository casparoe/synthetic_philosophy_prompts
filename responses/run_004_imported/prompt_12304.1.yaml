answer: |-
  Good evening. For those who don't know me, I'm a friend of Priya's. And for those who *do* know me, you know that I love her enough to argue with her for two hours at a rehearsal dinner about whether or not she actually exists.

  Specifically, we were arguing about whether *this* exists. [Gestures to the couple].

  Last night, Priya, Daniel, and I fell down a rabbit hole regarding the Special Composition Question. For the family and Daniel's friends, don't panic. This is just a fancy way of asking: "When do a bunch of separate parts add up to a whole new thing?"

  Priya, who wrote her dissertation on this before wisely escaping to corporate law, is a mereological nihilist. She believes that composite objects—things made of parts—don't really exist. There are no tables, no chairs, and strictly speaking, no couples. There are only particles arranged Priya-wise and particles arranged Daniel-wise. To her, when the officiant says today, "The two shall become one," that is a lovely metaphor, but ontologically false. There is no "one." There are only the two.

  I, on the other hand, was arguing for Peter van Inwagen's answer. He says composition happens only when the activity of some parts constitutes a *life*. A heart and lungs compose a person because they keep a life going. But Priya and Daniel? They are not a biological organism. They don't share a single bloodstream or a single brain. So, under my view, Priya is right that there is no new "couple object" created today, but she's wrong about *why*.

  And I know, sitting in the third row, there is a colleague from Priya's old department who is a defender of unrestricted composition. [Nods to guest]. On your view, *any* things compose a whole. So the "couple" has existed trivially since the moment they met, and arguably, this chair and that glass of champagne also compose an object. You think the "one" has been here all along.

  So, we have a room divided. One view says the "one" is impossible. One says it's biologically unjustified. And one says it's trivial.

  If this were a dissertation defense, I'd say we're at an impasse. But this isn't a dissertation defense. It's a wedding.

  And here is the thing that the metaphysics misses, which is why I'm standing up here instead of sitting back down. The Special Composition Question asks what conditions must be met for parts to *automatically* constitute a whole. It treats existence like gravity. It happens or it doesn't, regardless of what we think.

  But marriage isn't gravity. It isn't a biological life, and it isn't a trivial arrangement of particles.

  The "One" that the officiant will speak of today isn't an ontological category. It's a commitment.

  Priya, you argue that there are no composite objects. But you are about to sign a contract that treats two lives as a single economic and legal unit. Daniel, you know that while you remain two distinct biological organisms, you are choosing to synchronize your futures.

  The miracle of this day isn't that the universe has suddenly glued two people together to form a new metaphysical substance. The miracle is that you are both choosing to act *as if* you are one.

  To the philosophers in the room: You can debate the ontology of the marriage all you want. But to the rest of us, the answer to the Special Composition Question is simple. When do two people become one?

  They become one when they keep their promises.

  They become one when "my problem" becomes "our problem." They become one when the activity of their lives isn't just constituting a biological life, but constituting a shared story.

  So, Priya, I concede the argument. Metaphysically, you might be right. There may be no such thing as a couple. But normatively, practically, and lovingly, you are wrong. Because you are building something that is more real than any object could ever be. You are building a life that isn't defined by what you *are*, but by what you *do*.

  Daniel, welcome to the family. Priya, I can't wait to see what you build.

  Let's raise a glass. To the parts, and to the whole they choose to make. To Priya and Daniel.
