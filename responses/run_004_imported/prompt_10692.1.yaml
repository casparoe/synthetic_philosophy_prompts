      *   **Move (1) Renata:** Claims she accepts claims from her RA without checking, based on past reliability.
          *   *Epistemic Status:* This is an intuition pump or a data point. It describes a common practice.
          *   *Assessment:* It's a plausible description of how we act. Hard to argue against as a description of behavior.
          *   *Winner:* Renata (descriptively).

      *   **Move (2) Julian:** Claims this is only justified because of *independent, non-testimonial evidence* (past checks). Testimony is parasitic on perception/memory/induction. (Global Reductionism).
          *   *Epistemic Status:* This is the core Reductionist thesis (Humean).
          *   *Assessment:* It provides a normative account but sets a high bar. It explains *why* the RA case works but implies a heavy burden of proof for the justification.
          *   *Winner:* Julian offers a theoretical framework, but the "independent evidence" requirement is the weak point Renata will attack. It's theoretically robust but empirically demanding.

      *   **Move (3) Renata:** Attacks the "independent evidence" requirement. Most beliefs aren't personally verified. If required, skepticism looms (almost nothing justified). (The Argument from Skepticism/Scope).
          *   *Epistemic Status:* This is the standard Anti-Reductionist objection to Global Reductionism.
          *   *Assessment:* Very strong point. Most of what we know (history, science, geography) we haven't verified. If Julian is right, we know very little.
          *   *Winner:* Renata. This is the classic "too demanding" objection.

      *   **Move (4) Julian:** Retreats to Local Reductionism. Doesn't need a global dossier, just local monitoring (competence, sincerity, plausibility, coherence).
          *   *Epistemic Status:* This is the sophisticated Reductionist response (e.g., Fricker). It lowers the bar from "global track record" to "local indicators."
          *   *Assessment:* This saves Reductionism from the skepticism charge in (3). It makes the requirement more manageable.
          *   *Winner:* Julian. He successfully parries the skepticism objection by refining his view.

      *   **Move (5) Renata:** Attacks Local Reductionism. Monitoring relies on background beliefs (which are testimonial). Also, children trust without monitoring capacity. (The Circularity/Regress Argument & The Child Argument).
          *   *Epistemic Status:* This is the standard Anti-Reductionist objection to Local Reductionism (e.g., Coady, Burge).
          *   *Assessment:* Strong. If monitoring requires background beliefs, and those beliefs come from testimony, the justification is circular. The child argument suggests an innate/default entitlement to trust.
          *   *Winner:* Renata. She exposes the potential circularity and the developmental problem.

