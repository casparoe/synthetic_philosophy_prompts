      *   *Novelty:* It's not *new* in the sense that experts (Christiano, Uesato, Irving, etc.) have discussed these limitations. However, synthesizing them into a clear critique about the *structure of real-world disagreements* vs. *computation graphs* is a valuable contribution. It's not "reinventing the wheel" so much as "pointing out the wheel is square for this terrain."
