          *   *Persuasiveness-optimization:* The *training dynamic* incentivizes rhetoric over truth (Goodhart's law / specification gaming).
          *   *Interaction:* A persuasiveness-optimized model will *use* obfuscation if it helps win. So obfuscation is a *tactic* enabled by the *goal* of winning.

