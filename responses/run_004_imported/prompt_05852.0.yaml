answer: |-
  **MEMORANDUM**

  **TO:** Volunteer Standards Committee
  **FROM:** [Your Name]
  **DATE:** Thursday, October 26
  **SUBJECT:** Deciding Vote: Vendor Standards and the Definition of "Handmade"

  **1. Immediate Decision regarding the Toymaker**

  As the deciding vote in our 2-2 deadlock, I am casting my ballot to **allow the toymaker to occupy her table this Saturday.**

  She will operate under the current rules as they stand. However, this permission is granted with the explicit understanding that we are finalizing a clarified policy by next month. For this weekend, the benefit of the doubt goes to the vendor who has long been part of our community, provided her goods are not mass-produced in the industrial sense (i.e., she is not running a factory line).

  **2. The Philosophical Context of Our Dispute**

  We are stuck because our rule relies on a word—"handmade"—that has no sharp edge. In our deliberations, two distinct views on how to handle this vagueness have emerged. I want to address both seriously before outlining the path forward.

  One view holds that "handmade" has a precise, objective cutoff that exists independently of us. On this view, there is a specific threshold of machine assistance that turns a "handmade" object into a "manufactured" one, even if we cannot currently identify where that line is. This is the **Epistemic view**. It suggests that our disagreement is due to ignorance; there is a fact of the matter, and if we were smarter or looked closer, we would discover whether the toymaker is truly compliant or in violation.

  The other view holds that the word simply gives out in this context. There is no hidden fact to discover. On this view, "handmade" is a concept that works well for wood carved with a knife and fails for plastic injected into a mold, but in the middle ground (CNC routers), the language runs dry. Therefore, drawing a line here is not an act of *discovery*, but an act of *decision*. This is the **Stipulative view**.

  **3. Taking the Epistemic View Seriously**

  I want to acknowledge the strength of the Epistemic view, which underpins the objections raised by two committee members. There is a deep intuition that "handmade" refers to a real moral and aesthetic quality, not just a label we slap on things. If we treat the term as entirely up to us, we risk arbitrary power. We risk saying that "handmade" means whatever we wake up and decide it means, which could devalue the trust our customers place in us.

  Those arguing that the toymaker violates the rule are rightly protecting the integrity of the market. They sense that if we allow too much automation, the "soul" of the object—the transfer of human energy into material—is lost. There *should* be a boundary. To ignore the possibility that a true boundary exists is to ignore the genuine concern that we are diluting the meaning of our market. I respect the position that we are stewards of a definition, not its owners. We must not treat the word so lightly that it becomes meaningless.

  **4. Why We Must Proceed on the Stipulative View**

  However, we have a market to run on Saturday, and a committee to lead going forward. While the Epistemic view offers a comforting idea of objective truth, it is functionally paralyzing for a standards committee. If there is a hidden cutoff we cannot discover, we have no way to enforce it without guessing. We would be enforcing a "truth" we cannot articulate, which is unfair to vendors.

  Therefore, I am building my recommendation on the **Stipulative view**: We must accept that the word "handmade" does not solve this problem for us. *We* must solve it for the word. We are not finding the line; we are drawing it. This is not an admission of failure, but an acceptance of responsibility. We are defining the culture of this market.

  **5. Recommended Standard for Future Cases**

  Since we are drawing a line rather than finding one, we must draw it clearly. Effective November 1st, I propose we replace the phrase "handmade, not mass-produced" with the following **Maker's Standard**:

  *   **Design Ownership:** The vendor must be the designer of the goods sold.
  *   **Hand-Finishing:** All goods must undergo significant manual finishing (sanding, assembly, painting, glazing, etc.) by the vendor.
  *   **Tool Usage:** Power tools, including CNC routers, laser cutters, and 3D printers, are permitted *provided* the vendor operates the machinery themselves and the machine does not perform the final assembly or finishing.
  *   **Scale:** Production must be limited to the capacity of the vendor and their immediate assistants (no factory labor).

  **6. Conclusion**

  By adopting this standard, we acknowledge that a CNC router is a tool, much like an electric sander or a sewing machine. It amplifies the maker's hand but does not necessarily replace it.

  To my colleagues who feel there is a deeper truth we are missing: I hear you. Let us ensure our new policy honors the spirit of that truth by strictly enforcing the "Hand-Finishing" and "Scale" clauses. We will not become a market for designers who outsource their production.

  To the toymaker: You are welcome this Saturday. But please be prepared to discuss how your process fits the new guidelines we will be publishing next week.

  Let's get the market open.

  [Your Signature]
