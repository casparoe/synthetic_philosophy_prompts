prompt: |-
  I'm a junior on my high school's Honor Council, the student-run body that hears academic integrity cases and recommends sanctions to the Dean of Students. Next week's case has split us down the middle. A sophomore was reported for texting exam answers to a friend during chemistry. The complainant is a classmate who, it turns out from her own texts, did the identical thing on a different exam last year and was never caught — including by herself, until now. The accused isn't claiming innocence. Her defense is that the complaint itself is illegitimate: whoever brings a charge like this needs standing to, and given her history, the complainant doesn't have it. Half the council thinks that's beside the point, since cheating is cheating no matter who reports it; the other half thinks a report from someone guilty of the identical, undisclosed offense taints the whole hearing, or should at least soften the sanction. Could you draft the short written opinion I'll bring to our meeting? It should recommend whether the case proceeds, is dismissed, or proceeds with a reduced sanction, address what, if anything, should happen to the complainant, and take the standing objection seriously enough to say exactly what work it can and can't do, rather than just asserting that two wrongs don't make a right.
reasoning: |-
  Here's a thinking process that leads to the suggested opinion:

  1.  **Analyze the Request:**
      *   **Role:** Junior on a High School Honor Council.
      *   **Task:** Draft a short written opinion for an upcoming meeting.
      *   **Case:** Sophomore accused of texting exam answers (admits guilt). Complainant is a classmate who also cheated previously (undisclosed/uncharged) and admitted it via texts during the investigation.
      *   **Conflict:** Council is split 50/50.
          *   Side A: Cheating is cheating; reporter's history is irrelevant.
          *   Side B: Reporter's hypocrisy taints the process/should reduce sanction.
      *   **Key Requirement:** Address the "standing" objection seriously (don't just say "two wrongs don't make a right"). Define what work the standing objection *can* and *cannot* do.
      *   **Recommendations Needed:** Proceed/Dismiss/Reduce sanction? What happens to the complainant?

  2.  **Determine the Stance:**
      *   *Option 1: Dismiss.* Too risky. The accused admitted guilt. Dismissing based on the reporter's hypocrisy undermines the Honor Code itself. It suggests cheating is only wrong if "pure" people report it.
      *   *Option 2: Proceed with Full Sanction.* Legally sound regarding the accused, but ignores the equity issue regarding the complainant. Might feel unjust to the council members concerned about fairness.
      *   *Option 3: Proceed with Reduced Sanction.* Problematic. It punishes the accused for the complainant's actions. The accused *did* cheat. Mitigation usually applies to the offender's intent/circumstances, not the reporter's history.
      *   *Option 4: Proceed with Full Sanction for Accused + Separate Investigation for Complainant.* This is the most principled approach. It upholds the Code (cheating is wrong regardless of who reports it) while addressing the hypocrisy (the complainant is now subject to the Code). It treats the "standing" objection as a procedural trigger rather than a substantive defense.

      *Decision:* I will argue for **proceeding with the standard sanction for the accused** but **immediately referring the complainant for investigation**. I will frame the "standing" argument as invalid for *dismissal* but valid for *institutional integrity*.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard memo format (To, From, Date, Re).
      *   **Introduction:** State the recommendation clearly upfront.
      *   **The Standing Objection (The Core Requirement):**
          *   Acknowledge the intuition behind it (unclean hands).
          *   Explain why it doesn't grant *immunity* to the accused (the act violated the Code regardless of the reporter).
          *   Explain what work it *does* do: It triggers a duty for the Council to investigate the reporter. It challenges the *culture*, not the specific verdict.
      *   **The Accused (The Sophomore):**
          *   She admitted guilt.
          *   The violation is objective.
          *   Reducing her sanction sets a bad precedent (punishing based on who caught you, not what you did).
      *   **The Complainant (The Classmate):**
          *   She has self-incriminated.
          *   She must be treated under the same Code.
          *   This resolves the "hypocrisy" concern without letting the accused off the hook.
      *   **Conclusion:** Summarize the path forward. Uphold the Code for everyone.

  4.  **Refining the Tone:**
      *   Needs to sound like a high school student leader (earnest, thoughtful, principled) but also formal enough for an Honor Council opinion.
      *   Avoid legalese where possible, but use precise reasoning.
      *   Ensure the "standing" analysis is nuanced as requested.

  5.  **Self-Correction/Review during Drafting:**
      *   *Critique:* Is dismissing the standing argument too harsh?
      *   *Fix:* No, I need to validate the *feeling* behind it while rejecting the *legal effect*. I'll use the phrase "unclean hands" to show I understand the principle.
      *   *Critique:* Should I recommend a reduced sanction to compromise?
      *   *Fix:* No, the prompt asks me to take a stand. Compromising on the sanction undermines the integrity of the finding. The compromise lies in how we treat the complainant.
      *   *Check:* Did I answer all parts of the prompt?
          *   Proceed/Dismiss/Reduce? (Proceed/Standard)
          *   What about complainant? (Investigate/Sanction)
          *   Address standing seriously? (Yes, defined its limits and utility).

  6.  **Final Polish:** Check word count and flow. Ensure the distinction between *procedural standing* and *moral authority* is clear. (The resulting draft focuses on the idea that the Honor Code belongs to the community, not just the enforcers.)

  7.  **Final Output Generation** (similar to the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Honor Council
  **FROM:** [Your Name], Junior Council Member
  **DATE:** October 26, 2023
  **RE:** Opinion on Case #24-09 (Chemistry Exam Integrity)

  **Recommendation**
  I recommend that the Council **proceed with the hearing** for the accused sophomore and apply the **standard sanction** for academic dishonesty regarding the current charge. However, I further recommend that we **immediately open a separate investigation** into the complainant based on the evidence uncovered during this process.

  **The Standing Objection: What It Can and Cannot Do**
  The defense argues that the complainant lacks "standing" because she has violated the Honor Code herself. This argument relies on the doctrine of "unclean hands"—the idea that one cannot seek justice for a wrong they have also committed. We must take this seriously, not as a loophole, but as a matter of institutional integrity.

  However, we must be precise about the work this objection can do.
  1.  **It cannot negate the violation.** The Honor Code is a covenant between each student and the school, not a contract between students. A breach of that covenant is objective. If the sophomore cheated, she violated the Code regardless of who reported it, or even if no one reported it at all. To dismiss the case would be to argue that cheating is only punishable if the accuser is perfect. That lowers our standard of integrity to the level of our worst offender.
  2.  **It *does* trigger institutional duty.** While the complainant's history does not exonerate the accused, it does implicate the complainant. The standing objection functions here not as a shield for the accused, but as a spotlight on the complainant. It reveals a failure in our culture where violations are normalized until they become convenient weapons.

  **Regarding the Accused**
  The accused has admitted to the conduct. Mitigating sanctions based on the reporter's behavior sets a dangerous precedent: it suggests that sanctions are negotiable based on external factors rather than the violation itself. If we reduce her sanction, we are effectively punishing her for the complainant's actions, which is its own form of injustice. The integrity of our process depends on consistent application of sanctions for admitted violations.

  **Regarding the Complainant**
  The texts provided during this investigation constitute a self-report of a prior Honor Code violation. We cannot ignore this without hypocrisy. If we sanction the sophomore for texting answers while allowing the complainant to retain her standing without consequence, we validate the very cynicism the defense is raising.

  Therefore, the Council should vote to refer the complainant to the Dean of Students for a separate inquiry into her past conduct. She should be subject to the same Code she is invoking.

  **Conclusion**
  We resolve the tension in this room not by letting the accused off the hook, but by ensuring the complainant is held to the same standard. We uphold the Code by applying it to everyone involved, not by selectively enforcing it based on who is pointing the finger.

  **Vote:** Proceed with standard sanction for Accused; Refer Complainant for Investigation.
