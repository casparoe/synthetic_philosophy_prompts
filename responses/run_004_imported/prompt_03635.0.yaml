answer: |-
  The whiteboard was the only light source in the room, a glowing rectangle of white against the dorm's peeling beige paint. Elias stood before it, the scent of dry-erase solvent sharp in the back of his throat, stinging his eyes. It was 3:17 AM. The rest of the floor was asleep, or pretending to be.

  He had been chasing the proof for six hours.

  It started as a dare from Dr. Aris, the philosophy club sponsor. *Gödel didn't just do incompleteness,* she had said, sliding a packet of photocopies across the table. *He tried to fix the hole in the universe with logic. See if he succeeded.*

  Elias rubbed his temples. The symbols were clean. Too clean. They didn't look like arguments; they looked like blueprints.

  *Def. 1: x is God-like iff x possesses every positive property.*
  *Ax. 1: If a property is positive, its negation is not positive.*
  *Ax. 2: A property is positive if it necessarily follows from a positive property.*

  He had written them in blue. The theorems were in red. The logic flowed like water downhill, inevitable, gathering speed. He was at Theorem 4 now. *Necessary Existence.*

  The marker squeaked as he wrote the box symbol: $\square$. Necessity.

  In modal logic, usually, there's a distinction between what *is* true and what *must* be true. It rains today. That's true. But it *could* have been sunny. That's a different possible world. A branching path. The comfort of the "might have been" is the oxygen of human life. It allows for regret. It allows for hope. It allows for the idea that tomorrow could be different from today.

  Elias stared at the derivation. Gödel's axioms were squeezing the system. If a God-like being exists, it exists necessarily. It cannot *not* exist. And if a being with all positive properties exists necessarily, then the properties that define the world are anchored by that necessity.

  He remembered the footnote Dr. Aris had mentioned in passing, casually, as if noting a typo in a menu. *Sobel (1987) suggests these axioms entail modal collapse.*

  Elias lowered the marker. His hand was trembling, just slightly.

  He turned to the clean space on the right side of the board. He began to sketch the implication.

  If God exists necessarily, and God's nature entails the state of the world (because a positive property implies a positive state of affairs, and the actual world is the expression of those affairs), then the actual world is necessary.

  He wrote: $\square P$. For all P that are true.

  If $P$ is true, then $P$ is necessarily true.

  The silence in the room deepened. It wasn't just quiet; it was a vacuum. The hum of the mini-fridge in the corner sounded suddenly aggressive, a mechanical drone that had no choice but to hum.

  Elias stepped back. The whiteboard glowed.

  If this proof held, if the architecture was sound, then there were no other possible worlds. There was only this one. The concept of "could have been otherwise" was a grammatical error. A glitch in the language, not a feature of reality.

  He looked at the coffee mug on his desk. It was chipped on the rim. He remembered dropping it last semester, during finals week. He had been stressed. He had slipped.

  *Could I have held on tighter?*

  The question hung in the air, but it felt hollow now. Like asking if $2+2$ could have equaled $5$ in a universe where math was the same. If the proof was true, the drop was necessary. The chip was necessary. The stress was necessary. The specific angle at which the ceramic shattered was necessary.

  There was no version of Elias where he caught the mug. That Elias was not a possibility; he was a fiction. A ghost.

  Elias walked to the window. Outside, the campus was dark, slick with rain. A streetlamp flickered on the wet pavement.

  *Did it have to rain tonight?*

  In the old way of thinking, a low-pressure system moved in, conditions were right, but maybe a degree of warmth could have turned it to mist. Maybe the wind could have shifted.

  But if modal collapse was real, the rain was as fixed as the number pi. It wasn't just that causes led to effects. It was that the entire timeline was a single, solid object. A crystal. You couldn't scratch it. You couldn't imagine a scratch that wasn't already part of the structure.

  He felt a coldness seep into his chest, heavier than fatigue. It was the feeling of walls closing in, but the walls were made of time.

  He thought about his sister. She lived in Chicago. They hadn't spoken in three months. Not because of a fight, just... drift. Life.

  *Could I call her?*

  He looked at his phone on the desk. Black screen.

  If he picked it up, would he be making a choice? Or would he be fulfilling a coordinate? If he didn't pick it up, was that a failure? Or was it the only thing that ever could have happened?

  The moral weight of the universe seemed to evaporate, replaced by a terrifying geometric perfection. Guilt requires the belief that you could have done better. If you couldn't have done better, guilt is just pain without purpose.

  Elias turned back to the board. The symbols seemed to pulse. They weren't describing the world anymore. They were *holding* it.

  He realized then why the idea scared him more than the God part. A God who judges you is terrifying, but a God who makes you a puppet is worse. But this wasn't even a puppet master. This was a script written in invisible ink that only became visible once you read it.

  He reached for the eraser. He meant to wipe away Theorem 4. He meant to find the flaw. He needed to find the flaw. If he didn't, the room would stop being a room and start being a cell.

  His hand hovered over the board.

  But he stopped.

  Because to erase it, he had to believe he *could* erase it. He had to believe in a future where the board was clean, a future that branched off from this moment. But if the proof was true, the future where he erases the board is only real if it happens. And the future where he doesn't is only real if that happens.

  And which one was it?

  He looked at his hand. It felt heavy. Not tired, but *dense*. As if every atom in his body was locked into a specific trajectory that had been set before the stars ignited.

  He thought about the word "random." A quantum fluctuation. A roll of the dice.

  *No,* the board whispered. *There are no dice.*

  The rain against the window didn't sound like weather anymore. It sounded like typing. Constant, relentless input.

  Elias lowered the eraser. He didn't wipe the board. He couldn't verify the flaw. Not because he wasn't smart enough, but because the flaw might not be there. And if it wasn't there, then his standing here, staring at it, was the only thing that could be happening.

  He capped the marker. The *click* was incredibly loud. It sounded like a lock engaging.

  He sat down on the floor, leaning back against the bedframe. He looked at the whiteboard one last time. The blue and red lines intersected, forming a cage of logic that stretched out from the room, through the university, through the sky, encompassing everything that ever was or would be.

  He waited for the panic to come. He waited for the scream to rise in his throat.

  It didn't.

  Instead, a strange calm settled over him. If everything was necessary, then there was nothing to worry about. Worry implies you can change the outcome. Fear implies a future that can be avoided.

  There was no avoiding. There was only *is*.

  Elias closed his eyes. He listened to the rain. He listened to the hum of the fridge. He listened to his own breath, moving in and out, a tide that had no choice but to turn.

  He wondered if he would go to class tomorrow. He wondered if he would drop out. He wondered if he would die young or old.

  The questions felt different now. They weren't inquiries about possibilities. They were just requests for data. The answers were already written. They were just waiting for him to walk past them.

  He opened his eyes. The whiteboard was still glowing. The symbols hadn't moved. They didn't need to. They were true.

  Elias lay back on the carpet. It was rough against his neck. He stared at the ceiling, at the water stain in the corner that looked like a map of a country that didn't exist.

  He thought about how he had planned to wash his sheets this weekend. He thought about how he had planned to tell Sarah he loved her last year.

  None of it was a plan. None of it was a regret. It was just the shape of the thing.

  He took a breath. He let it out.

  It was the only breath he could have taken. And somehow, in the crushing weight of that certainty, it was enough. It had to be.
