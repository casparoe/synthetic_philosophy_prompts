answer: |-
  This is not just you being salty. This is one of the central, unresolved tensions in modern higher education governance. You are bumping up against the collision between **traditional shared governance models** (designed for a homogeneous body of permanent faculty) and **contemporary academic labor reality** (a stratified body of permanent, contingent, and student labor).

  To answer your specific question: No, it does not have to collapse into arbitrary line-drawing. There are established political and ethical frameworks you can use to articulate why the vote felt illegitimate. However, you also need to understand the counter-principles the tenure-line is using to justify the exclusion, so you can anticipate their defense.

  Here is a breakdown of the principled arguments on both sides, and how to reframe your objection for maximum impact.

  ### 1. The Principled Argument for Inclusion (Your Side)

  If you want to move beyond "it doesn't feel right," you can lean on three specific ethical frameworks:

  **A. The All-Affected Principle**
  In democratic theory, the "All-Affected Principle" states that anyone significantly affected by a decision should have a say in making it.
  *   **The Argument:** A core requirement dictates curriculum, workload, and pedagogical approach. Adjuncts are affected because it dictates their hiring and teaching load. TAs are affected because it dictates their labor. Students are affected because it dictates their education.
  *   **The Soundbite:** "Governance legitimacy derives from stakeholder impact. By excluding the primary implementers and the primary recipients, we have created a democratic deficit in the decision."

  **B. The Epistemic Authority of Implementation**
  Tenure-line faculty often claim authority based on *disciplinary expertise* (knowing the subject). Adjuncts and TAs often possess greater *pedagogical expertise* regarding the specific student population (knowing how to teach the subject to *these* students).
  *   **The Argument:** A core requirement is not just a list of topics; it is a logistical and pedagogical engine. Those who teach the majority of the sections possess superior data on feasibility, student preparedness, and workload. Excluding them isn't just unfair; it makes the decision *epistemically weaker*.
  *   **The Soundbite:** "We are designing a machine without consulting the engineers who have to build it every day. This isn't just a labor issue; it's a quality control issue."

  **C. The AAUP Standard on Shared Governance**
  The American Association of University Professors (AAUP) has long held statements on shared governance. While they prioritize tenure-line faculty on long-term commitments, they explicitly state that contingent faculty should have participation rights in matters directly affecting their professional responsibilities (like curriculum they teach).
  *   **The Argument:** You aren't inventing a new radical idea; you are pointing out a deviation from established norms of the profession.

  ### 2. The Principled Argument for Exclusion (Their Side)

  To argue effectively, you must understand the logic you are fighting. It isn't just power-hoarding; it's based on a specific (albeit outdated) view of institutional stewardship.

  **A. The Stewardship/Continuity Principle**
  *   **The Logic:** You mentioned this requirement binds students for a *decade*. Tenure-line faculty are the only group with a contractual commitment that matches that timeline. Adjuncts are often hired semester-to-semester. Students leave in four years.
  *   **The Defense:** The institution argues that only those with long-term skin in the game (tenure-line) can be trusted to vote on long-term structural changes, because they are the only ones who will be around to fix it if it breaks in year seven.
  *   **The Weakness:** This assumes adjuncts are transient by nature rather than by design. It penalizes faculty for the precarity the institution imposes on them.

  **B. The Accountability Principle**
  *   **The Logic:** Tenure-line faculty bear the reputational risk of the degree. If the core requirement fails, the department's standing drops, affecting the tenure-line's research environment and hiring power. Adjuncts, theoretically, can just leave for another contract.
  *   **The Defense:** Voting rights are coupled with long-term liability.

  ### 3. Does it collapse into arbitrariness?

  It feels arbitrary because the **material reality of the faculty has changed, but the governance map has not.**

  Thirty years ago, "Faculty" was a mostly unified class of people with similar job security and roles. Today, "Faculty" is a caste system. When you draw a line around "Tenure-Line Faculty" and call them "The Department," you are drawing a legalistic boundary that no longer matches the functional reality of the department.

  It is not *arbitrary* (there is a logic to it), but it is *anachronistic*. It is a governance model from 1975 applied to a labor market from 2024.

  ### 4. How to Argue This Next Time (Without Sounding Salty)

  If you raise "Legitimacy," people hear "Revolution." If you raise "Feasibility," people hear "Risk Management." Administrators and senior faculty care deeply about Risk Management.

  **Don't argue:** "It was undemocratic."
  **Do argue:** "It lacks implementation buy-in."

  Here is how you frame the principled objection in a way that lands in a committee meeting:

  1.  **Shift from Rights to Risk:** "By excluding the colleagues who teach 60% of these sections from the vote, we have created a high risk of non-compliance or inconsistent delivery. We need a mechanism for adjunct consultation to ensure the policy is actually viable."
  2.  **Demand Advisory Voting:** "I understand the final vote rests with the permanent faculty for stewardship reasons. However, standard shared governance suggests a consultative vote from contingent faculty and TAs. If the implementers vote 'no' in a consultative capacity, that should trigger a mandatory review."
  3.  **The "Sunset" Clause:** "If we are claiming stewardship authority to exclude others, we must accept accountability. Let's put a sunset clause on this requirement. If it isn't working in 3 years, it expires automatically. If we aren't willing to do that, we shouldn't be passing it without the implementers' consent."

  ### Summary

  Your feeling of illegitimacy is grounded in the **All-Affected Principle**, which is a robust philosophical stance. The counter-argument relies on **Institutional Stewardship**, which is valid but increasingly brittle given the reliance on contingent labor.

  It is not arbitrary line-drawing; it is **political boundary-maintenance.** The tenure-line maintains power by defining the "constituency" narrowly. The most effective way to challenge this is not to demand the vote be thrown out (which they will ignore), but to demand that **consultative mechanisms** be codified for future decisions.

  You aren't salty; you're noticing that the governance software is running on hardware that no longer exists. That's a valid critique.
