prompt: |-
  So I'm a novelist, but I got roped into doing an onstage interview at a little books-and-ideas festival next month -- they're pairing novelists with philosophers for a strand called 'Character,' and my guest has spent her career defending virtue ethics against the situationist critique (the Milgram/Asch/Darley-and-Batson stuff that supposedly proves stable character traits are basically a myth). I really dont want this to turn into her just restating 'virtue is an acquired disposition' while I nod along in front of a room of writers. Can you draft me 8-10 questions that actually press on this? I want at least one built around the Good Samaritan seminary study specifically (too perfect not to use on that crowd), one on whether retreating to 'local' traits just quietly concedes the situationists point, and one on whether Aristotle's phronimos was ever meant to describe most people or was always meant as a rare ideal. For each, give me a likely follow-up depending on which way she dodges.
reasoning: |-
  Here's a thinking process that leads to the suggested questions:

  1.  **Analyze the Request:**
      *   **User:** Novelist attending a books-and-ideas festival.
      *   **Context:** Onstage interview paired with a philosopher.
      *   **Theme:** 'Character'.
      *   **Guest's Stance:** Defends virtue ethics against situationist critiques (Milgram, Asch, Darley & Batson).
      *   **User's Goal:** Avoid a boring "virtue is real, nod along" session. Wants pressing, challenging questions.
      *   **Specific Requirements:**
          *   8-10 questions total.
          *   Must include one on the Good Samaritan seminary study.
          *   Must include one on "local traits" vs. conceding to situationists.
          *   Must include one on Aristotle's *phronimos* (ideal vs. average).
          *   For each question, provide a likely follow-up based on how she might dodge.
      *   **Tone:** Intellectual but accessible (festival setting), engaging for writers, respectful but probing.

  2.  **Deconstruct the Philosophical Conflict:**
      *   *Virtue Ethics (Aristotelian):* Character consists of stable, global traits (courage, honesty) that determine behavior across situations.
      *   *Situationism (Social Psychology):* Behavior is determined more by situational factors than internal traits. Experiments (Milgram, Stanford Prison, Good Samaritan) show "good people" doing bad things (or vice versa) based on context.
      *   *The Guest's Likely Defense:* Virtues are *acquired* (not innate), they are *robust* but not *perfect*, they might be *local* (context-specific), or the experiments don't capture *real* virtue (idealization).
      *   *The Novelist's Angle:* Writers create characters. Do characters need consistency to be believable? Is "character arc" just moving from situation-dependent to virtue-possessing? Does fiction lie about human nature by exaggerating consistency?

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Good Samaritan Study.*
          *   *Context:* Seminary students rushing to give a talk. Some stopped to help a slumped man, others didn't. Variable: How late they thought they were.
          *   *Draft:* What about the seminary study? They were religious but didn't help.
          *   *Refinement:* Make it about the tension between identity and urgency.
          *   *Follow-up:* If she says "they weren't truly virtuous," ask how we identify virtue if it's invisible until the perfect moment.

      *   *Requirement 2: Local Traits.*
          *   *Context:* Some virtue ethicists argue traits are "local" (honest-at-work) not "global" (honest-everywhere).
          *   *Draft:* If you say traits are local, aren't you agreeing with the situationists?
          *   *Refinement:* Frame it as a retreat. Is "local virtue" just a fancy way of saying situationism wins?
          *   *Follow-up:* If she says "local is enough," ask if fiction should stop writing "heroic" characters who are good everywhere.

      *   *Requirement 3: Aristotle's Phronimos.*
          *   *Context:* The person of practical wisdom.
          *   *Draft:* Was Aristotle's ideal guy real or just a dream?
          *   *Refinement:* Is the *phronimos* a blueprint for education or a statistical outlier? If it's an outlier, is virtue ethics useless for most?
          *   *Follow-up:* If she says "it's an ideal," ask if novels should depict ideals or realities.

      *   *Requirement 4: The Novelist's Craft (Consistency).*
          *   *Idea:* Writers are told to make characters consistent. Psychology says people aren't.
          *   *Draft:* Should I stop writing consistent characters?
          *   *Refinement:* Does the demand for narrative consistency force writers to lie about human psychology?
          *   *Follow-up:* If she says "art needs order," ask if that makes fiction propaganda for a false view of self.

      *   *Requirement 5: The "Acquired" Defense.*
          *   *Idea:* She says virtue is acquired/hard.
          *   *Draft:* So it takes time?
          *   *Refinement:* If virtue is a high bar reached by few, why base an ethical system on it?
          *   *Follow-up:* If she says "we strive," ask if guilt is the main outcome of her ethics.

      *   *Requirement 6: Milgram/Obedience.*
          *   *Idea:* Ordinary people shocked others.
          *   *Draft:* Milgram proved we are sheep.
          *   *Refinement:* In Milgram, the "situation" was an authority figure. Is virtue just the ability to say no to authority?
          *   *Follow-up:* If she says "yes," ask if virtue is just contrarianism.

      *   *Requirement 7: Moral Luck.*
          *   *Idea:* Sometimes you don't get tested.
          *   *Draft:* What if you're never tested?
          *   *Refinement:* If I live in a peaceful time, am I less virtuous than a war hero? Does situationism make virtue dependent on luck?
          *   *Follow-up:* If she says "potential matters," ask how we judge character without action.

      *   *Requirement 8: The "Fragmentation" of Self.*
          *   *Idea:* We act differently with mom vs. boss.
          *   *Draft:* We wear masks.
          *   *Refinement:* If character fragments by context, is there a "core self" for the novelist to write?
          *   *Follow-up:* If she says "no core," ask what the subject of a biography is.

      *   *Requirement 9: Emotion vs. Reason.*
          *   *Idea:* Virtue isn't just doing, it's feeling.
          *   *Draft:* Do you have to feel good doing it?
          *   *Refinement:* Situationism triggers stress. Does virtue require emotional regulation that biology might not support?
          *   *Follow-up:* If she says "training helps," ask if some people are biologically excluded.

      *   *Requirement 10: The "Why Bother?" Question.*
          *   *Idea:* Practical application.
          *   *Draft:* What should we do?
          *   *Refinement:* If situations control us, should we fix situations instead of people?
          *   *Follow-up:* If she says "both," ask which is the priority for policy/art.

  4.  **Review and Refine:**
      *   Check against constraints: 8-10 questions? Yes. Specific topics included? Yes. Follow-ups included? Yes. Tone appropriate? Needs to be sharp but polite.
      *   *Self-Correction on Tone:* Ensure the questions don't sound hostile, but rather like a curious novelist probing the implications for storytelling and human understanding. The user wants to avoid "nodding along," so the questions need to expose tensions, not just ask for definitions.

  5.  **Final Polish:** Organize clearly with the "Trap/Dodge" dynamic for the follow-ups. (Proceeding to generate output based on this plan).

      *   *Check:* Did I include the Good Samaritan one? Yes.
      *   *Check:* Did I include the Local Traits one? Yes.
      *   *Check:* Did I include the Phronimos one? Yes.
      *   *Check:* Are there follow-ups for *different* dodge directions? Yes, I will structure them as "If she says X... If she says Y..."

  6.  **Final Output Generation** (Drafting the response).
answer: |-
  Here are 9 questions designed to keep the conversation dynamic, specifically tailored to your position as a novelist interrogating a philosopher. They move from the specific experiments to the implications for storytelling and human nature.

  ### 1. The Good Samaritan (Required)
  "In the famous Princeton seminary study, students preparing to give a talk on the Good Samaritan parable stepped over a slumped, coughing man in the alley. The deciding factor wasn't their religiosity or their personality; it was whether they thought they were late. If a hurry can override a lifetime of religious formation, does that suggest virtue isn't a *possession* we carry, but a luxury we can only afford when time permits?"

  *   **If she argues they weren't 'truly' virtuous yet:** "So virtue is invisible until the moment it's successfully exercised? As a novelist, if I can't see the virtue before the test, how do I write the character without resorting to hindsight bias?"
  *   **If she argues the situation was unfairly overwhelming:** "But isn't life mostly unfairly overwhelming? If virtue only functions in calibrated environments, is it ethics, or is it hygiene?"

  ### 2. The "Local Traits" Retreat (Required)
  "Some defenders of virtue ethics respond to situationism by scaling back. They argue we don't have 'global' traits like Honesty, but 'local' ones like 'Honesty-With-Friends-When-Not-Tired.' But doesn't retreating to local traits quietly concede the situationist's main point? If my character is brave in the courtroom but a coward in the nursery, in what sense do they possess the virtue of Courage at all?"

  *   **If she says local traits are sufficient for a good life:** "Then should novelists stop writing cohesive characters? Should I be writing fragmented protagonists who are effectively different people in different rooms?"
  *   **If she says global traits are still possible but rare:** "If they're rare, is virtue ethics a theory for everyone, or just an aristocratic ideal for the lucky few?"

  ### 3. Aristotle's *Phronimos* (Required)
  "Aristotle grounds his ethics in the *phronimos*—the person of practical wisdom who judges correctly. But reading the experiments, one wonders: Was the *phronimos* ever meant to be a realistic description of human potential, or was it always a regulatory ideal, like a perfect circle in physics? If 95% of people fail the Milgram experiment, is the *phronimos* a blueprint or a myth?"

  *   **If she says it's an aspirational ideal:** "If it's an ideal most will never reach, does virtue ethics risk becoming a machine for generating guilt rather than a guide for action?"
  *   **If she says it's a realistic average for well-raised people:** "Then the theory relies entirely on upbringing. Does that mean ethics is just sociology by another name?"

  ### 4. Narrative Consistency vs. Psychological Reality
  "As a novelist, I'm taught that a character must be 'consistent' to be believable. Readers reject characters who act randomly. But if situationism is right, 'consistency' is a lie we tell to make sense of chaos. By writing consistent characters, am I inadvertently reinforcing a false folk-psychology that your opponents are trying to dismantle?"

  *   **If she says art requires order unlike life:** "So fiction is essentially propaganda for a view of human nature that doesn't exist? Does that undermine the moral value of literature?"
  *   **If she says consistency is possible with effort:** "Then is the 'Character Arc' just the process of moving from being situation-dependent to situation-proof? Is that a realistic arc for a 300-page novel?"

  ### 5. The "Acquired Disposition" Defense
  "You've argued that virtue is an acquired disposition, not an innate trait. But the situationist data suggests that even long-term training can collapse under specific situational pressures. If a disposition can be switched off by a uniform, a siren, or a deadline, how robust is the acquisition? Are we building character, or just building habits that work in calm weather?"

  *   **If she compares it to physical training (muscles):** "Muscles fail under enough weight, yes. But if the weight is 'ordinary life,' is the muscle useful? Should we be focusing on fixing the weights instead of the muscles?"
  *   **If she says true virtue is immune to pressure:** "Then we are back to the 'No True Scotsman' fallacy. If everyone who fails the test lacked 'true virtue,' how do we identify the virtue without the test?"

  ### 6. Moral Luck and Opportunity
  "Situationism implies a heavy dose of moral luck. I might be 'honest' simply because I've never been in a situation where lying would save my life. If virtue requires action, but situations dictate opportunity, am I virtuous, or just untested? How do you distinguish between a saint and a person who simply never met their match?"

  *   **If she says intention matters:** "But the situationists show intentions are notoriously poor predictors of action. Can I intend to be brave and still be a coward?"
  *   **If she says we must create opportunities:** "That places a burden on the moral agent to seek out trouble. Is the virtuous life essentially a quest for obstacles?"

  ### 7. Authority and Autonomy
  "In the Milgram experiments, the situation was defined by authority. The subjects surrendered their agency to the scientist. If virtue is the capacity to act according to reason, isn't the primary modern virtue simply the ability to disobey? Is your defense of virtue essentially a defense of contrarianism?"

  *   **If she says it's about discernment, not disobedience:** "But in the experiments, the 'discernment' of the average person was to obey. What cognitive tool does the virtuous person have that the subject lacked?"
  *   **If she says community support helps resistance:** "Then virtue isn't internal. It's external. It's a network, not a trait. Does that dissolve the individual self you're trying to defend?"

  ### 8. The Fragmentation of the Self
  "Psychologists talk about the 'fragmented self'—we act differently with our parents than with our boss. Virtue ethics seems to require a unified self. If I write a character who is generous to strangers but cruel to their spouse, modern psychology says 'that's normal.' Virtue ethics says 'that's a contradiction.' Who is right? Is the unified self a fiction?"

  *   **If she says the unified self is the goal:** "Is it a achievable goal? Or is the 'unified self' just another name for the *phronimos* that nobody actually becomes?"
  *   **If she says we are naturally fragmented:** "Then why base an ethical system on integration? Should we instead build an ethics of fragmentation that accepts we will fail in some contexts?"

  ### 9. The Policy Implication (The "So What?")
  "Finally, if the situationists are even partially right, the most efficient way to improve human behavior isn't moral education; it's situation design. Remove the rush, remove the uniforms, remove the ambiguity. If you spend your career defending the internal character, are you distracting us from the external fixes that actually work?"

  *   **If she says we need both:** "Resources are finite. If we have to choose between teaching virtue and redesigning the hallway so people aren't in a rush, which one gets the money?"
  *   **If she says character resists bad situations:** "But the data says it mostly doesn't. Are you betting on a horse that has lost every race?"
