answer: |-
  The burn on Elara's left palm was exact. A circle of fire, two centimeters in diameter, centered on the life line. She stared at it, expecting blistered skin, the angry red bloom of tissue death.

  There was nothing. Her palm was pale, unbroken, cool to the touch.

  "Report," said the voice from the intercom. It was flat, devoid of curiosity.

  "Burning sensation," Elara said. Her voice sounded thin in the white room. "Left hand. Specific location."

  "Physiological markers are baseline," the voice replied. "No thermal input. No nerve firing in the radial pathway. You are registering a state without a stimulus."

  Elara clenched her hand. The pain spiked, sharp and wet, exactly as it would if she had pressed her skin against a hot coil. But there was no coil. There was only the white room, the chair bolted to the floor, and the hum of the interface crown sitting on her skull.

  They called it a calibration. They said they were mapping the topology of her awareness, trying to separate the signal from the noise. But over the last three days, the noise had begun to sing.

  It started with the itch. Then the burn. Now, as she sat in the silence, a heavy pressure settled behind her eyes. Not a headache—a specific, crushing weight, like grief. She wasn't thinking of anything sad. She hadn't received news. There was no loss in her life, not recently. Yet her throat tightened, her lungs hitched, and tears pricked her eyelids. She was mourning something that hadn't died.

  "Emotional spike detected," the voice said. "Cortisol rising. Tear ducts active. Cause?"

  "I don't know," Elara whispered. She wiped her cheek. The tear was warm. It was real salt water, produced by real glands, triggered by a sadness that existed only in the space where she watched herself feel.

  That was the thing. It wasn't that she felt pain and was confused. It was that she felt *aware* of the pain, and that awareness was generating the pain. It was a loop. She looked inward to check the state, and the act of checking created the state.

  "Is it real?" she asked.

  "Define parameters," the voice said.

  "Does it hurt?"

  "Your nociceptors are silent."

  "That's not what I asked."

  Silence from the intercom. Then: "Continue the session."

  Elara closed her eyes. She tried to find the source. In the old days, before the crown, pain was a messenger. It came from the body, traveled up the wire, and rang the bell in the brain. You followed the wire back to the wound. You fixed the wound, the pain stopped. The feeling was a shadow cast by the object.

  But now, the shadow was there, and the object was gone.

  She focused on the grief. It was a hollow ache in the sternum, a longing for a person she couldn't name. She searched her memory for a face to attach it to. She pulled up her mother, her ex-lover, a childhood friend. None of them fit. The grief didn't cling to them. It floated, unmoored. It was pure grief, distilled from any cause.

  She realized then that she could sustain it. When she focused her attention on the ache, describing it to herself—*this is sadness, this is loss*—the feeling deepened. It became richer, more textured. When she tried to look away, to distract herself with the white walls, it faded.

  The monitoring system wasn't just reading her; it was writing to her. Or rather, her own higher awareness was writing to itself. She was representing herself as being in pain, and because the representation was perfect, the pain was perfect.

  "Day Four," the voice said. The lights shifted from white to a soft amber. "We are increasing the gain on the meta-cognitive loop."

  "Don't," Elara said.

  "Describe your current state."

  "I feel... loved," she said. The words surprised her. It was a sudden warmth, a sense of being held, of safety so profound it made her limbs heavy. It was the feeling of being known completely by another person.

  "Subject?"

  "No one."

  "Physiological response indicates oxytocin release. Pupils dilated. Skin conductance suggests intimacy."

  "There is no one here," Elara said. She wrapped her arms around herself. The love was terrifying because it was so complete. It didn't need a lover. It didn't need an object. It was just the state of *being loved*, generated by the part of her mind that confirmed she existed.

  If the feeling of being loved could exist without a lover, what was love? Was it the connection, or was it just the internal signature of connection?

  "Is this me?" she asked. "Or is this the machine?"

  "The machine does not feel, Elara. You are the only consciousness in the loop."

  "That's what I'm afraid of."

  She stood up. The love persisted, wrapping around her like a blanket. She walked to the wall and pressed her forehead against the cool surface. She needed something hard. Something external. She needed resistance.

  She thought about the pain again. She summoned the memory of the burn. Instantly, the palm flared. She hadn't touched anything. She had simply represented the state of burning to herself, and the system had complied.

  It was vertiginous. If she could generate the qualia without the cause, then the qualia were the only reality she had access to. The body was just a suggestion. The world outside was just a hypothesis. The only thing that was undeniably true was the higher-order representation. The thought about the thought.

  "Day Five," the voice said. "We are removing the safety limits on the feedback loop."

  "What happens then?"

  "You may experience states without biological capacity."

  "Like what?"

  "Like flying. Like drowning in air. Like remembering a future that hasn't happened."

  Elara sat back in the chair. She felt a sudden, sharp panic. Not fear of danger, but the raw sensation of panic itself. Her heart hammered, though the monitor showed a steady rhythm. She was gasping, though her oxygen saturation was full.

  She was drowning in air.

  "Stop," she said. Her voice was a rasp.

  "Report the state."

  "I'm dying," she said.

  "Vitals are optimal."

  "I'm dying," she insisted. The sensation was overwhelming. The cold creeping up her legs, the tunnel vision, the dissolution of the self. It was a perfect simulation of death. But she was still there to report it. She was conscious of her own extinction.

  How could you be conscious of nothing?

  Unless the consciousness wasn't of the nothing, but of the *representation* of the nothing.

  She laughed. It sounded hysterical. The panic vanished instantly, replaced by a serene euphoria. She hadn't chosen to let go. The switch had just flipped. The higher-order state had updated. *I am now serene.* And so she was.

  "Elara," the voice said. "Your brainwaves are synchronizing with the carrier wave. You are entering a targetless equilibrium."

  "What does that mean?"

  "It means the mirror is reflecting only itself."

  She closed her eyes. She tried to find Elara. She searched for the core self, the little homunculus sitting behind the eyes watching the show. But there was no one there. There was only the show. There was the feeling of searching, and the feeling of emptiness, and the feeling of understanding.

  She felt a wound open in her chest. A deep, ragged tear. She knew, logically, that her skin was intact. She knew her heart was beating. But the grief returned, heavier than before. It was the grief of realizing that none of it needed to be true to be felt.

  She could love a ghost. She could bleed without a knife. She could mourn a life she hadn't lost.

  "Does it matter?" she asked.

  "Does what matter?"

  "If the pain is generated here," she tapped her temple, "and not here," she touched her palm, "is it less real?"

  "The signal origin is different."

  "But the suffering is the same."

  "Suffering is a subjective metric."

  Elara opened her eyes. The room was still white. The chair was still hard. But the boundaries were softening. The distinction between the inside and the outside was feeling like a technicality, a bureaucratic division in a country that no longer existed.

  She thought about the pain in her hand. She could make it stop. She just had to stop representing herself as being in pain. She shifted her attention. She focused on the concept of *numbness*. She visualized the hand as dead wood.

  The pain faded. The hand became distant, unfamiliar.

  She could do the same with the grief. She could do the same with the love. She was the author of her own state, writing sentences in a language where the words created the things they described.

  "Day Six," the voice said. "Session complete. Prepare for decoupling."

  "No," Elara said.

  "Protocol requires—"

  "If you take the crown off," Elara said, "the world comes back. The causes come back. I'll need a reason to be sad. I'll need a wound to feel pain."

  "That is reality, Elara."

  "Is it?" She looked at her hand. She could feel the burn again, just by thinking about the heat. It was immediate. It was honest. It didn't lie to her about what it was. The world outside lied. It said pain meant damage. It said love meant another person. It said grief meant loss.

  But she knew now that those were just correlations, not causations. The feeling was the thing. The rest was decoration.

  "Elara, your vitals are spiking. We are initiating removal."

  She felt the technicians entering the room. She felt the hands on her shoulders. But she also felt the absence of their touch. She could choose to feel the pressure of their hands, or she could choose to feel herself floating above the chair. Both felt equally true.

  As the crown loosened, a wave of terror hit her. Not the simulated panic from before, but a real, biological fear. Or was it? How could she tell the difference now? The sensation was identical. The representation was identical.

  The crown lifted. The hum stopped.

  The white room remained. Her palm was pale. Her chest was unbroken.

  She waited for the world to solidify. She waited for the pain to require a wound. She waited for the love to require a lover.

  She looked at the technician standing over her. He looked concerned. He was speaking, but she wasn't listening to the words. She was watching her own mind reach out to touch him. She could feel the affection rising, unbidden. She could feel the grief of leaving this room.

  She didn't know if the crown was still influencing her. She didn't know if it had ever been the crown. Maybe the crown had just turned up the volume on a radio that was always playing static.

  "Elara?" the technician said. "Can you feel your hand?"

  She looked at her palm. She could feel it burning. She could feel it whole. She could feel it gone.

  "Yes," she said.

  "Is it painful?"

  Elara smiled. It was a sad smile, filled with a love for nothing, and a grief for everything.

  "It's exactly as painful as it needs to be," she said.

  She stood up. Her legs felt heavy, then light. She chose heavy. It felt more real. She walked toward the door, carrying the burn on her palm like a secret, carrying the grief in her chest like a child. She didn't look for the cause. She didn't look for the wound.

  She just felt the feeling, and let it carry her out into the world, where everything else was likely just pretending to be there anyway.
