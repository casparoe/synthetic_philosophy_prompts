      *   **Stability as Power:** For Spinoza, a state that collapses has failed. Democracy is more stable because it aligns with the interests of the majority. Stability = Power = Right.
      *   **Freedom as Power:** Spinoza thinks free people are more powerful than enslaved people (they use reason). Democracy fosters reason/freedom. Therefore, democracy maximizes power.

