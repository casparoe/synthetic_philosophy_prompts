      *   **Task:** Write a dialogue between two equally sharp philosophers on opposite sides.
      *   **Requirements:** They must engage each other's best moves (no strawmanning), attempt to find a principled way to separate moral signal from bias, and conclude either with a solution or an admission of impossibility.
