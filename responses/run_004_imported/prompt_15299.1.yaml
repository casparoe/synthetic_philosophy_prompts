answer: |-
  It is completely understandable why you would read the debate that way, especially coming from a scientific background. In physics, and in utilitarian ethics, we are trained to look at systems, inputs, outputs, and net outcomes. If $A$ causes $X$ deaths, but prevents $Y$ deaths (where $Y > X$), the equation balances. From that perspective, Anscombe's protest looks like a miscalculation of the variables.

  However, if you view Anscombe's objection as a consequentialist argument (a bet on body counts), you are actually attributing to her the very ethical framework she spent her career dismantling.

  Anscombe's argument in *Mr. Truman's Degree* (1956) does not hold up **if** you assume morality is a calculus of outcomes. But her entire philosophical project was to argue that morality is **not** a calculus of outcomes. To understand why she thinks the "saved lives" defense is irrelevant, you have to look at her distinction between *intention* and *foresight*, and her rejection of consequentialism.

  Here is why the "body count" defense doesn't pull the rug out from under her.

  ### 1. Consequentialism vs. Absolute Prohibitions
  The standard defense of Truman is utilitarian: the morality of the act is determined by the net reduction in suffering.
  Anscombe operates within a Natural Law / Deontological framework (heavily influenced by Aquinas and Wittgenstein). In this view, certain actions are **intrinsically wrong**, regardless of their consequences.

  For Anscombe, the intentional killing of the innocent (civilians) is murder. It is an absolute prohibition. If an act is intrinsically evil, no amount of good consequence can justify it. To use her own analogy: you cannot commit murder to save a nation, just as you cannot bear false witness to save a nation.

  Therefore, when historians argue that the invasion of Japan (Operation Downfall) would have cost 500,000 or 1 million Allied lives (plus Japanese casualties), Anscombe would reply: **"That is irrelevant."** You are not permitted to purchase a victory with the blood of the innocent, even if the alternative is costly.

  ### 2. The Principle of Double Effect
  This is the technical philosophical engine of her argument. Anscombe relies heavily on the distinction between:
  1.  **Intended effects:** What you aim to bring about.
  2.  **Foreseen side effects:** What you know will happen, but do not aim for.

  In just war theory (and Anscombe's ethics), it is sometimes permissible to attack a military target where civilian death is a *foreseen but unintended* side effect (collateral damage). It is **never** permissible to make civilian death the *intended means* to an end.

  Anscombe's specific charge against Truman was not just that civilians died, but that they were **targeted**. The strategic logic of the atomic bombings (and the firebombing of Tokyo preceding them) was explicitly to break the enemy's will by demonstrating the vulnerability of their civilian population. The death of civilians was not a side effect; it was the mechanism of coercion.

  For Anscombe, this turns the act from "warfare" into "mass murder." Once it is classified as murder, the utilitarian calculus is off the table. You cannot justify murder by saying it had a high ROI (Return on Investment) in lives saved.

  ### 3. "Necessity" vs. "Justification"
  In the pamphlet, Anscombe does address the historical claims of military necessity, but she does so to undermine the *excuse*, not to set up a counter-calculation.

  She argues that by 1945, Japan was already effectively defeated (their navy was destroyed, oil was cut off), and the demand for "unconditional surrender" was the only thing prolonging the war. She suggests the bombs were used not strictly to end the war, but to intimidate the Soviet Union.

  However, even if we grant the premise that the bombs *were* the only way to end the war immediately, Anscombe maintains that this does not justify the means. She writes:

  > *"It is unlawful to kill the innocent. Whom does this exclude? It excludes those who are not engaged in unjust aggression... The people of Hiroshima were not engaged in unjust aggression."*

  She anticipates the utilitarian objection. She knows people will say, "But it shortened the war." Her response is essentially: *"Come what may, one must not do evil that good may come."*

  ### 4. Why this matters for Oxford
  Her protest wasn't just about history; it was about the integrity of the university. She argued that by granting an honorary degree, Oxford was signaling that "success" (winning the war) washes away moral guilt.

  She feared that if Oxford honored Truman, it was endorsing the idea that heads of state are exempt from the moral laws that bind ordinary individuals. If a private citizen killed 100,000 civilians to save 1 million others, we would still call it murder (albeit perhaps with mitigation in sentencing). Anscombe demanded that we apply the same moral categories to politicians.

  ### 5. Does her argument "hold up"?
  You asked if her argument holds up anymore. That depends entirely on which ethical framework you accept.

  *   **If you are a Consequentialist:** Her argument fails. If the net reduction in suffering is the metric, and the bombings achieved that, then the act was morally right (or at least permissible). The historical estimates of invasion casualties are the critical variables here.
  *   **If you are a Deontologist / Natural Law Theorist:** Her argument remains robust. The historical casualty estimates are irrelevant variables. The act violated an absolute constraint on human action (targeting the innocent).

  Given your background in physics, you might find the consequentialist view more natural because it treats ethics like an optimization problem. Anscombe's point is that ethics is not an optimization problem; it is a system of constraints.

  ### Summary
  You aren't missing the history; you are missing the meta-ethics. Anscombe isn't arguing that Truman got the math wrong. She is arguing that **there is no math to be done.**

  She would say that by engaging in the "body count" debate, we have already conceded too much. We have accepted the premise that human lives are fungible units that can be traded against each other by state actors. Her pamphlet is a refusal to accept that premise. So, no, the historical data on Operation Downfall casualties does not refute her, because she denies that those casualties justify the intentional killing of civilians at Hiroshima and Nagasaki.

  It is worth noting that this pamphlet preceded her famous paper *"Modern Moral Philosophy"* (1958), where she argues that concepts like "moral obligation" make no sense without a divine lawgiver or a robust teleology. *Mr. Truman's Degree* is essentially the practical application of that emerging thought: without a framework that prohibits certain acts absolutely, morality collapses into mere statecraft and calculation.
