answer: |-
  **Title:** The Uncrossable Line: Anscombe, Truman, and the Morality of Intention

  In 1956, the University of Oxford prepared to award an honorary degree to Harry S. Truman. To most, it was a recognition of leadership during a global crisis; to the philosopher Elizabeth Anscombe, it was a moral obscenity. She led a protest that resulted in one of the most famous pamphlets in modern ethics, *Mr. Truman's Degree*. While the historical debate over the atomic bombings of Hiroshima and Nagasaki usually devolves into a grim utilitarian calculus—counting the dead of the bombing against the hypothetical dead of an invasion—Anscombe refused to touch the abacus. Her argument was not about numbers; it was about nature. She argued that Truman was guilty of murder because he intentionally targeted the innocent, and that no outcome, however beneficial, could cleanse that act. Engaging with Anscombe's deontological framework reveals a uncomfortable truth: while the consequentialist defense of the bomb is pragmatically compelling, it relies on a moral logic that, if accepted, erodes the very concept of war crimes. Ultimately, Anscombe is correct. The intentional slaughter of civilians is an intrinsic evil that cannot be justified by consequences, and upholding this absolute prohibition is more vital to human ethics than the strategic expediencies of 1945.

  To understand Anscombe's fury, one must understand her rejection of consequentialism. The standard defense of the atomic bomb is purely utilitarian: the bombings ended the war swiftly, preventing Operation Downfall (the invasion of Japan), which would have cost hundreds of thousands of American lives and millions of Japanese lives. In this view, the 200,000 civilians killed in Hiroshima and Nagasaki are a tragic but necessary cost to save a greater number. Anscombe dismisses this reasoning entirely. For her, morality is not a math problem where innocent lives can be traded like currency. She posits an absolute prohibition: it is never permissible to intentionally kill the innocent.

  Anscombe's argument hinges on the concept of *intention*. In the bombing of Japanese cities, the destruction of civilian life was not an unfortunate side effect (collateral damage); it was the mechanism of victory. The United States targeted city centers to break the enemy's will through terror and devastation. Anscombe argues that when you make the death of innocents the *means* to your end, you commit murder. It does not matter if the end is "peace" or "saving lives." To argue otherwise is to adopt the maxim "do evil that good may come," which Anscombe views as the corruption of all moral reasoning. By granting Truman a degree, Oxford was not just honoring a man; it was endorsing the principle that heads of state are exempt from the moral laws that bind ordinary individuals.

  The consequentialist counter-argument is powerful because it is rooted in the visceral reality of 1945. Defenders argue that in a "total war" against a militaristic regime that utilized civilian labor and fought to the death (as seen at Iwo Jima and Okinawa), the distinction between combatant and non-combatant had already blurred. Furthermore, they argue that inaction is also a choice with consequences. By refusing to drop the bomb, Truman would have been responsible for the deaths resulting from a prolonged blockade or invasion. From this viewpoint, Anscombe's stance is dangerously abstract. It prioritizes the moral purity of the actor over the actual survival of thousands of soldiers and civilians who would have died in a continued conflict. If ethics ignores the outcome, does it not become irrelevant in the face of catastrophe?

  However, this critique misunderstands the function of Anscombe's absolute prohibition. The danger of the consequentialist defense is not just in 1945, but in the precedent it sets for all future warfare. If the intentional killing of innocents is permissible whenever the leader calculates that it will save more lives in the long run, then the concept of a "war crime" ceases to exist. Any atrocity can be justified by a hypothetical future good. Anscombe warns that once we accept that the ends justify the means, we lose the ability to condemn the very fascism the Allies fought. The Nazis also believed they were securing a future for their people through the extermination of "undesirables." While the scale and ideology differ, the logical structure—sacrificing the innocent for the greater good of the nation—is identical.

  Therefore, the verdict must side with Anscombe, not because the Allied cause was unjust, but because the method employed breached a boundary that must remain uncrossed. Truman's decision may have been strategically effective, and it may have indeed shortened the war, but it was morally indefensible. To argue otherwise is to accept that human rights are conditional, dependent on a leader's calculation of utility. Anscombe forces us to confront the idea that some actions are intrinsically wrong, regardless of the pressure of the moment. If we allow the "necessity" of total war to override the prohibition against murdering civilians, we concede that in the realm of statecraft, might makes right.

  Anscombe's protest was not merely about Harry Truman; it was about the soul of post-war civilization. She understood that the victory over fascism would be hollow if the victors adopted the fascist logic that human beings are expendable resources for state objectives. The consequentialist argument asks us to look at the body count and choose the smaller pile. Anscombe asks us to look at the act itself and recognize that some things cannot be done, even to win. In the end, preserving the absolute moral law against the intentional killing of the innocent is more important than the strategic victories of the past. Truman's action was murder, and honoring it whitewashes a crime that no amount of "necessity" can erase. We must accept the heavy weight of this judgment, for only by maintaining these absolute boundaries can we prevent the logic of the atomic bomb from becoming the standard logic of the future.
