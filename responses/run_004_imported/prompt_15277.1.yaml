answer: |-
  The radio on the counter crackled with the static of the incoming storm, cutting in and out between weather alerts and the NPR segment. Elias was staring at the form on the kitchen table. It was thick, cream-colored paper, embossed with the logo of the *Aethelgard Perpetual Trust*.

  "Eighty billion," Elias said. He didn't look up from the pen in his hand.

  Sarah was loading the dishwasher, the clatter of ceramic masking the rain against the window. "What?"

  "The UN estimate. The eighty-billionth human being was born this morning. In Bosnia, or maybe India. They picked a baby at random to symbolize it."

  "That's nice, Eli. Can you pass the rinse aid?"

  Elias capped the pen. He pushed the trust fund brochure aside. "It's not nice. It's data."

  Sarah turned, drying her hands on a towel. She looked at the brochure, then at Elias's face. She knew that look. It was the same look he'd had when he'd calculated the actuarial tables for his life insurance, the look of a man trying to solve an equation where the variables were made of flesh.

  "You're not going to let this go," she said.

  "If I am a random sample from the set of all humans who will ever live," Elias said, his voice level, "then my position in the sequence tells me something about the length of the sequence."

  "We've had this conversation. It's the Doomsday Argument. It's a parlor trick."

  "It's Bayesian inference," he corrected. "Think about it. Sixty billion humans have lived and died before us. We are alive now. If humanity survives for another million years, colonizing the galaxy, the total number of humans will be in the trillions. If that's the case, what are the odds that I just *happen* to be among the first 5%? It's like drawing a red ball from an urn on your first try and assuming the urn is mostly red."

  Sarah leaned against the counter. "So because you were born early, you think the urn is small?"

  "I think the probability shifts. Significantly. If the total number of humans is going to be huge, it is incredibly unlikely that I would find myself so near the beginning. The fact that I *am* near the beginning suggests the total number isn't going to be huge." Elias tapped the brochure. "This trust is for our granddaughter. It locks capital away for a hundred and twenty years. If the Carter-Leslie formulation holds, the odds of there being a civilization stable enough to honor this in 2150 are... low."

  Sarah walked over and placed a hand on his shoulder. Her touch was warm, grounding. "You're using the Self-Sampling Assumption. You're assuming you're a random observer drawn from the set of all observers."

  "I am."

  "But why?" Sarah asked. "That's the reference class problem, Eli. Who counts as an observer? If we upload our minds, or genetically engineer children who live for centuries, do they count as one human each? Or do they count as a thousand? If you change the reference class, your birth rank changes. You're assuming 'human' means 'biological Homo sapiens with a lifespan of eighty years.' That's an arbitrary cutoff."

  Elias rubbed his temples. "Even if you adjust for post-humans, the math still penalizes long futures. The more observers there are, the less likely I am to be *me*."

  "That's where you're wrong," Sarah said softly. "That's the Self-Indication Assumption. You're forgetting to update on the fact that you exist at all."

  Elias looked up. "SIA?"

  "You're more likely to exist in a universe with a lot of observers than in one with a few," Sarah said. "In a huge, thriving civilization with trillions of people, there are simply more slots for 'Elias' to occupy. In a short, doomed civilization, there are fewer. The fact that you are here, thinking this thought, is evidence that the universe is large enough to support you."

  Elias stared at her. The rain hammered the glass. "So SIA cancels SSA?"

  "Philosophers have been arguing about it for thirty years," Sarah said. "Bostrom thinks one way, others think another. There is no consensus. You're trying to use a paradox to plan a retirement fund."

  "It's not a paradox. It's probability."

  "It's a mirror," Sarah said. "You look into it and you see the end. I look into it and I see the necessity of existence. Neither of us knows which reflection is real."

  Elias looked down at the form. The line for the signature was a stark black bar. If he signed, he was betting on continuity. He was betting that the sequence was long, that the urn was deep, that the eighty-billionth baby was just the start of a chorus and not the final verse. If he didn't sign, if he liquidated the savings and took the trip to Patagonia they'd talked about, he was betting on the precipice. He was betting that the view from the edge was worth more than the path forward.

  He picked up the pen. The weight of it felt significant, arbitrary.

  "If I sign," Elias said, "and you're right about SIA, we secure her future."

  "And if I'm wrong," Sarah said, "and you're right about SSA, the money doesn't matter, because there won't be anyone to spend it. But you'll have died knowing you acted *as if* there was a future."

  Elias hovered the pen over the paper. The ink gathered at the nib, a tiny, dark sphere threatening to fall.

  The radio hissed. A weatherman was talking about pressure systems, about how the storm was expected to break by morning, leaving clear skies. A local prediction. A short-term forecast.

  "You know," Elias said, his voice barely audible over the rain. "Gott used this to predict the run of Broadway shows. He got most of them right. But he missed the ones that became institutions."

  "Are we a Broadway show, Eli?"

  "No," he said. He looked at Sarah, really looked at her, seeing the lines around her eyes that hadn't been there five years ago, the biological clock ticking in a way no statistic could capture. "We're the audience."

  He lowered the pen. The ink touched the paper. He didn't sign immediately. He let the nib rest there, bleeding a tiny, microscopic dot into the cream fiber, a small stain of the present moment.

  "I'm signing," he said.

  "Because you believe me?"

  "Because I can't live in the probability," he said. "I can only live in the sample."

  He signed his name. It looked permanent, but they both knew the paper could burn, the bank could fail, the species could fade. The math remained suspended in the air between them, unresolved, a ghost in the machine of the kitchen, watching them with the neutral eyes of a statistician who knows that eventually, the sample size always reaches N.

  Elias capped the pen. The click sounded like a gavel.

  "Patagonia next year?" Sarah asked.

  "If we can get the time off," Elias said.

  He turned off the radio. The silence rushed in, heavy and full of the sound of breathing, of two people waiting to see if the next number in the sequence would be drawn.
