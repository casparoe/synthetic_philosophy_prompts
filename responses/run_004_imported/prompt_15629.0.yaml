  5.  **Refining the "Missing Context":**
      *   They are treating the department like a mini-democracy (nation-state model).
      *   But a department is a *professional association* managing a *credentialing process*.
      *   Key distinction: **Governance vs. Expertise.** Voting on curriculum is often about ensuring the degree meets external standards (accreditation, disciplinary norms), not just internal fairness.
      *   Key distinction: **Service Obligation.** Tenure-track contracts explicitly include "service" (governance). Postdoc contracts usually do not; they are research/teaching focused. Giving a vote adds a service burden they weren't hired for.
      *   Key distinction: **The Student Role.** David treats students as potential voters to show absurdity. Ines treats them as non-subjects. Both miss that students are the *purpose* of the curriculum, not the *architects*.

