answer: |-
  Your advisor is **mostly right, but your nagging memory is also right.** This is one of the few areas in statistics where both sides of the fence have a valid point, but they are talking past each other about different goals (evidence quantification vs. long-run error control).

  Here is the breakdown of why the Likelihood Principle (LP) makes your advisor feel safe, why the "foregone conclusion" critique exists, and what actually needs to be true for your lab's practice to be safe.

  ### 1. The Advisor's Argument: The Likelihood Principle
  The Likelihood Principle states that all the evidence provided by the data is contained in the likelihood function. Crucially, **the stopping rule is not part of the likelihood function.**

  *   **Frequentist logic:** To calculate a $p$-value, you must calculate the probability of getting data *this extreme or more extreme* under the null. "More extreme" depends on what you *would have done* if the data hadn't been significant (i.e., your stopping rule). If you peek, you change the sample space, inflating the Type I error rate.
  *   **Bayesian logic:** The Bayes Factor (BF) is simply a ratio of how well two hypotheses predict the **actual observed data**. It does not care about data you *could have* collected but didn't.
      *   Mathematically: $BF = \frac{P(Data | H_1)}{P(Data | H_0)}$.
      *   The stopping rule affects the probability of *collecting* the data, but it cancels out in the ratio (or is irrelevant to the likelihood of the data at hand).

  **Verdict:** On pure philosophical grounds, your advisor is correct. If you observe a BF of 10, it means the data are 10 times more likely under $H_1$ than $H_0$, regardless of whether you planned to collect $N=100$ or decided to stop at $N=43$ because the BF hit 10. The *interpretation* of the BF number does not change.

  ### 2. The Critique: "Sampling to a Foregone Conclusion"
  Your memory likely refers to critiques from error-statisticians (like Deborah Mayo) or pragmatic Bayesians who care about calibration. The argument isn't that the BF math is wrong, but that **optional stopping can bias the long-run behavior of your decisions if your priors are weak.**

  Here is the catch: While the *value* of the BF is valid under the LP, the **rate at which you encounter misleading evidence** can be influenced by optional stopping if you care about frequency properties.

  If you peek continuously and stop the moment $BF > 6$, you are essentially filtering for noise fluctuations that temporarily favor one hypothesis.
  *   **With P-values:** This guarantees you will reject the null eventually (Type I error $\to$ 100%).
  *   **With Bayes Factors:** It doesn't guarantee you will find evidence for $H_1$, *but* it can inflate the rate of "false positives" (deciding $H_1$ is true when $H_0$ is true) **if your priors are not robust.**

  ### 3. When Does It Bite You? (The Real Risks)
  Your lab's practice is "kosher" only if specific conditions regarding your **priors** and **decision thresholds** are met.

  #### A. Prior Sensitivity (The Big One)
  The BF is a ratio of *predictive performance*. If your prior on the alternative hypothesis ($H_1$) is too diffuse (e.g., a very wide Cauchy distribution), the model predicts almost anything, diluting its predictive density. This biases the BF toward the Null (Lindley's Paradox).
  *   **The Risk:** If you use a "default" prior that doesn't match the plausible effect size in your field, optional stopping can lead you to stop early on noise.
  *   **The Fix:** You must use **informed priors** or robust default priors (e.g., the JZS prior with a reasonable scale parameter). If your prior is garbage, optional stopping amplifies the garbage.

  #### B. Calibration vs. Evidence
  A BF of 10 implies 10:1 odds. But is it *actually* 10:1 in the real world?
  *   Simulations (e.g., by Schönbrodt, Rouder, & Wagenmakers) show that BFs are generally robust to optional stopping **provided the priors are reasonable.** The rate of misleading evidence stays relatively low compared to $p$-values.
  *   **However:** If you stop *exactly* at the threshold, you introduce a bias in the **effect size estimation**. The effect size at the moment you cross the BF threshold will be an overestimate of the true effect (the "winner's curse").
  *   **Implication:** If your lab stops data collection and immediately reports the point estimate from that dataset, you are publishing inflated effect sizes.

  #### C. The "Foregone Conclusion" Specifics
  This critique holds water if you use **improper priors** or if you update your prior *based on the data* (which is cheating).
  *   If you set a prior that is essentially a point mass on the effect you hope to find, you can indeed sample to a foregone conclusion.
  *   If you use standard default priors (e.g., Cauchy(0, 0.707)), simulations suggest you *cannot* easily game the system to find evidence for a false hypothesis just by peeking, provided you also have a stopping boundary for the Null (e.g., stop if $BF < 1/6$).

  ### 4. Practical Recommendations for Your Lab
  You don't need to start a revolution in the lab meeting, but you can suggest "best practices" that protect you from the critiques without abandoning the advisor's workflow.

  1.  **Set Two Boundaries:** Don't just stop when $BF > 6$ (evidence for $H_1$). Also stop if $BF < 1/6$ (evidence for $H_0$). If you only stop for significance, you introduce bias. If you allow stopping for *either*, the error rates remain controlled.
  2.  **Maximum Sample Size Cap:** Set a hard $N_{max}$. If you hit $N_{max}$ and the BF is inconclusive (e.g., between 1/3 and 3), you stop and report "insensitive data." This prevents infinite peeking.
  3.  **Prior Predictive Checks:** Before running the study, simulate data from your prior and your model. Ensure that the BF behaves as expected under optional stopping *for your specific design*. (R code for this is widely available in the `BayesFactor` or `brms` ecosystems).
  4.  **Report the Trajectory:** In the paper, state: "We used sequential analysis with monitoring every X participants." Transparency neutralizes most "questionable research practice" accusations.
  5.  **Don't Trust the Point Estimate:** If you stop early based on BF, acknowledge that the effect size estimate is likely inflated. Report the credible interval, not just the mean.

  ### Summary
  *   **Is the advisor right?** Yes, regarding the *interpretation* of the Bayes Factor. The LP protects the validity of the evidence ratio itself.
  *   **Is your worry valid?** Yes. Optional stopping can lead to inflated effect sizes and misleading decisions if priors are poor or if you lack a stopping rule for the Null.
  *   **The Condition:** It is safe **if** you use reasonable priors, monitor for evidence of *both* hypotheses (not just the alternative), and cap the maximum sample size.

  If your lab does those three things, you are statistically safer than 90% of frequentist papers using fixed-$N$ designs. If they don't, you are technically "Bayesian," but practically "p-hacking with extra steps."
