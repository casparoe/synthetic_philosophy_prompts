answer: |-
  You have stumbled directly into one of the most famous and vexing problems in modern decision theory. You are not crazy, and your intuition is not merely a "feeling." What this researcher is doing has a name: **Pascal's Mugging.**

  It was coined by the philosopher Nick Bostrom (ironically, a giant in the very field this researcher is championing) to describe a scenario where a agent is threatened (or promised) an astronomically large payoff/punishment with a vanishingly small probability, such that the *expected value* still dominates any rational decision.

  The fact that his arithmetic ($Probability \times Impact$) is technically correct is irrelevant. The flaw lies in **epistemology** (how we know the numbers) and **decision theory** (how we act on them).

  Here are five principled arguments you can use on your call to dismantle the spreadsheet without dismissing AI safety itself.

  ### 1. The Calibration Problem (Garbage In, Garbage Out)
  The researcher's arithmetic is correct, but his inputs are unjustified. Human beings are terrible at estimating probabilities in the extreme tails.
  *   **The Argument:** When someone says "1 in 100 million," they usually mean "I can't rule this out, but it seems unlikely." They do not mean they have a frequency-based model that would see this event occur once in 100 million trials.
  *   **The Counter:** Ask him: *"What is your calibration track record for 1-in-100-million predictions?"* The answer is none. No human has the data to distinguish between a $10^{-8}$ probability and a $10^{-12}$ probability. When you are dealing with numbers that small, you are not doing math; you are dressing up a guess in a lab coat. If the probability is actually $10^{-15}$ (which is indistinguishable to the human mind from $10^{-8}$), the expected value collapses.

  ### 2. The Complexity Prior (Occam's Razor)
  This is the strongest technical objection. In Bayesian reasoning, the more complex a hypothesis is, the lower its prior probability should be.
  *   **The Argument:** To save $10^{30}$ lives, a specific chain of events must occur: AI must be built, it must be misaligned in this specific way, your specific intervention must fix it, humanity must expand to the stars, etc.
  *   **The Counter:** Every additional assumption required to make the $10^{30}$ number real should cut the probability exponentially. Philosopher Robin Hanson has argued that the probability of a claim should decrease exponentially with the amount of information required to specify it.
  *   **The Punchline:** If the "size" of the claim (the $10^{30}$ lives) grows linearly or polynomially, but the *complexity* of the story required to achieve it grows exponentially, the probability should drop faster than the utility rises. You should penalize the probability *because* the payoff number is so absurdly large. A claim that big is inherently less credible.

  ### 3. Knightian Uncertainty vs. Risk
  The researcher is treating **uncertainty** as if it were **risk**.
  *   **Risk** is when you know the odds (like a roulette wheel or flood insurance). Flood insurance works because insurance companies have actuarial tables based on millions of data points.
  *   **Uncertainty** (Knightian Uncertainty) is when you don't know the odds, or even the full set of possible outcomes.
  *   **The Counter:** *"You are using expected value maximization, which works for risk. But this is deep uncertainty. We don't know the sample space. When model uncertainty is this high, 'maximizing expected value' is not the rational strategy; 'satisficing' or choosing robust options is."*
  *   **Analogy:** You don't buy flood insurance from a guy on a street corner who *says* he has an actuarial table. You buy it from an institution with a track record. Mosquito nets have a track record. His spreadsheet does not.

  ### 4. The "Many Muggers" Objection
  If you accept this logic, you become paralyzed.
  *   **The Argument:** There is no limit to how large a number someone can write down. If you meet ten people, each with a different project claiming $10^{30}$ lives at $1/10^8$ odds, do you split your money ten ways? What if the eleventh person claims $10^{40}$ lives?
  *   **The Counter:** *"If I accept your logic, I cannot donate to you, because someone else will inevitably come along with a bigger number. If the logic leads to paralysis or constant switching based on who tells the biggest story, it is not action-guiding. A decision theory that tells you to do everything (or nothing) tells you nothing."*

  ### 5. Robustness and Opportunity Cost
  This is the Effective Altruism (EA) counter-argument from within the movement itself. Organizations like GiveWell explicitly reject this kind of reasoning for exactly the reasons you suspect.
  *   **The Argument:** Donating to mosquito nets is **robust**. Even if your model of the world is slightly wrong, nets still stop mosquitoes and save lives. The AI safety project is **fragile**. If the model is 1% wrong (e.g., the catastrophe doesn't happen, or the intervention doesn't scale), the value drops to zero.
  *   **The Counter:** *"In a world of high model uncertainty, we should prioritize robustness over fragility. Mosquito nets work even if I'm wrong about the future. Your project only works if I'm right about everything. Given that I am probably wrong about many things, the robust option has higher expected value."*

  ### How to Handle the Call
  You do not need to bite the bullet. In fact, most serious longtermist philosophers (including Bostrom and William MacAskill) acknowledge Pascal's Mugging as a problem that needs solving, not a directive to follow.

  **Suggested script for the call:**
  > "I've looked into the decision theory behind your pitch. It's a classic case of Pascal's Mugging. The issue isn't the multiplication; it's that human probability calibration breaks down completely at $10^{-8}$, and we should apply a complexity penalty that scales with the size of the claim. Until your project has a track record that moves this from 'uncertainty' to 'risk,' expected value maximization isn't the right tool. I'm prioritizing robustness."

  **Summary:** The math isn't wrong, but the **inputs** are epistemically bankrupt. You are not refusing to care about the future; you are refusing to be held hostage by uncalibrated guesses dressed up as calculations.
