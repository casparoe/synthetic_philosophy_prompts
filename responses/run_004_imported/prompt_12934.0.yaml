prompt: |-
  In my social choice theory seminar this week we covered Harsanyi's 1955 utilitarian aggregation theorem: if both individual and social preferences over lotteries satisfy the von Neumann–Morgenstern axioms, and the social ordering also satisfies Pareto indifference, then the social utility function must be an affine combination of the individual utility functions. Our professor presented this as putting utilitarianism on rigorous axiomatic foundations, but I've become skeptical of that reading. Please argue that the theorem does not actually license any interpersonal comparison of utility, and therefore does not establish utilitarianism either: because each individual's von Neumann–Morgenstern utility function is unique only up to its own independent positive affine transformation, the weights the theorem assigns to different people are artifacts of whichever representative of each person's scale happens to be chosen, rather than a substantive fact about how much any one person's welfare should count relative to another's.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Social choice theory seminar, Harsanyi's 1955 Aggregation Theorem.
      *   **Standard Interpretation:** The theorem provides rigorous axiomatic foundations for utilitarianism (social utility = weighted sum of individual utilities).
      *   **User's Skepticism:** The theorem does *not* license interpersonal comparisons of utility (ICU). Since vNM utilities are unique only up to positive affine transformations (scale and origin), the weights assigned to individuals are arbitrary artifacts of the chosen scales, not substantive moral facts.
      *   **Task:** Argue *for* the user's skeptical reading. Specifically, demonstrate that without independent normalization or interpersonal comparability, the theorem is mathematically valid but ethically empty regarding utilitarianism.

  2.  **Deconstruct Harsanyi's Theorem:**
      *   **Premises:**
          1.  Individual preferences satisfy vNM axioms (representable by $U_i$).
          2.  Social preferences satisfy vNM axioms (representable by $W$).
          3.  Pareto Indifference (if everyone is indifferent between lotteries $L$ and $L'$, society is indifferent).
          4.  (Often implied/added) Pareto Efficiency (if everyone prefers $L$ to $L'$, society prefers $L$ to $L'$).
      *   **Conclusion:** $W = \sum a_i U_i + b$.
      *   **The Crux:** The coefficients $a_i$ are the "weights." In utilitarianism, these weights represent the moral importance of each individual.

  3.  **Identify the Core Problem (The User's Point):**
      *   vNM utility functions are ordinal *with respect to risk*, but cardinal *within an individual*.
      *   Transformation: $U'_i = \alpha_i U_i + \beta_i$ (where $\alpha_i > 0$).
      *   If we change the scale for person $i$, the weight $a_i$ must change to compensate ($a'_i = a_i / \alpha_i$) to keep $W$ invariant.
      *   Therefore, the magnitude of $a_i$ depends entirely on the arbitrary choice of $\alpha_i$.
      *   Without a rule to fix $\alpha_i$ across individuals (interpersonal comparability), the weights are meaningless for moral aggregation.

  4.  **Drafting the Argument - Step-by-Step:**

      *   **Introduction:** Acknowledge the standard reading but validate the user's skepticism. State the thesis: The theorem is a representation result, not a normative justification, because it lacks a mechanism for interpersonal comparison.

      *   **Point 1: The Nature of vNM Utility.**
          *   Explain that vNM utility measures strength of preference *within* a person (risk attitudes).
          *   It does not measure "happiness units" comparable *between* people.
          *   Analogy: Temperature scales. Celsius vs. Fahrenheit. If I measure Person A in C and Person B in F, adding them is nonsense.

      *   **Point 2: The Arbitrariness of Weights.**
          *   Show the math. $W = \sum a_i U_i$.
          *   Apply affine transformation $U^*_i = \alpha_i U_i + \beta_i$.
          *   Show that to maintain the same social ordering, $a^*_i$ must adjust.
          *   Conclusion: The ratio $a_i / a_j$ is not fixed by the axioms. It depends on the arbitrary scaling of $U_i$ vs $U_j$.

      *   **Point 3: Pareto Indifference is Too Weak.**
          *   Pareto only tells us what to do when interests align or are neutral.
          *   It doesn't tell us how to trade off Person A's gain against Person B's loss.
          *   Utilitarianism is fundamentally about trade-offs. Harsanyi's axioms don't constrain the trade-off rates without fixed scales.

      *   **Point 4: Harsanyi's Own Response (and why it might fail).**
          *   Harsanyi tried to fix this with the "equiprobability assumption" (veil of ignorance) in later work (1953/1977).
          *   But the 1955 theorem *alone* doesn't include this.
          *   Even with the veil of ignorance, one needs to assume that "probability of being person $i$" translates to comparable utility units. This begs the question of comparability.

      *   **Point 5: The "Formal vs. Substantive" Distinction.**
          *   The theorem proves the *form* of the aggregation must be linear.
          *   It does not prove the *content* (the specific weights) required for classical utilitarianism (equal weights).
          *   A dictator satisfies the theorem (weight 1 for dictator, 0 for others). This is technically "utilitarian" in form but not in spirit.

      *   **Conclusion:** Summarize. The theorem shows that *if* you have comparable utilities, you must sum them. But it doesn't tell you *how* to make them comparable. Therefore, it doesn't ground utilitarianism on its own.

  5.  **Refining the Tone:**
      *   Academic, rigorous, supportive of the user's critical thinking.
      *   Use precise terminology (positive affine transformation, cardinal unit comparability, etc.).
      *   Ensure the distinction between the *structure* of aggregation and the *inputs* to aggregation is clear.

  6.  **Self-Correction/Nuance Check:**
      *   *Did Harsanyi claim the 1955 theorem alone solves ICU?* He often combined it with the veil of ignorance. I need to make sure I focus on the 1955 aggregation theorem as presented in the seminar, while acknowledging that Harsanyi had other moves.
      *   *Is the user right?* Yes, standard social choice literature (e.g., Sen, Weymark) acknowledges that Harsanyi's theorem requires "Cardinal Unit Comparability" (CUC) to yield ethical utilitarianism. Without CUC, the weights are indeterminate.
      *   *Make sure to mention the Dictatorship possibility.* If weights can be anything, a dictatorship is a valid affine combination. This highlights the moral emptiness of the theorem without further constraints.

  7.  **Final Polish:** Organize into clear sections. Ensure the mathematical argument is accessible but precise. (Proceed to generate output based on this structure).

      *   *Key Concept to introduce:* Cardinal Unit Comparability (CUC). The theorem assumes vNM (cardinal measurability) but lacks CUC.
      *   *Key Reference:* Amartya Sen's critique is the standard backing for this view.

