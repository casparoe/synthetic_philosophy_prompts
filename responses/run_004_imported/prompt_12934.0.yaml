answer: |-
  Your skepticism is well-founded and aligns with a major strand of critique in modern social choice theory, most notably articulated by Amartya Sen and John Weymark. While Harsanyi's 1955 Aggregation Theorem is mathematically elegant, your intuition is correct: **the theorem alone does not solve the problem of interpersonal comparison of utility (ICU), and without ICU, it cannot substantively justify utilitarianism.**

  Here is an argument supporting your reading, structured around the indeterminacy of the weights, the nature of vNM utility, and the distinction between functional form and moral content.

  ### 1. The Indeterminacy of Weights under Affine Transformations
  The core of your argument rests on the measurement properties of von Neumann–Morgenstern (vNM) utility functions. As you noted, a vNM utility function $U_i$ for individual $i$ is unique only up to a **positive affine transformation**. That is, if $U_i$ represents $i$'s preferences, then $U^*_i = \alpha_i U_i + \beta_i$ (where $\alpha_i > 0$) represents the exact same preferences.

  Harsanyi's theorem concludes that the social welfare function $W$ must take the form:
  $$W = \sum_{i=1}^n a_i U_i + b$$

  The utilitarian interpretation relies on the coefficients $a_i$ representing the moral weight of each individual. However, because each $U_i$ can be rescaled independently without changing the underlying preferences, the coefficients $a_i$ are mathematically coupled to those arbitrary scales.

  If we rescale individual $i$'s utility by doubling it ($\alpha_i = 2$), the weight $a_i$ must be halved to preserve the same social ordering over lotteries. Consequently, the ratio of weights between any two individuals, $a_i / a_j$, is not fixed by the axioms of rationality or Pareto efficiency. It is entirely dependent on the arbitrary choice of the zero-point ($\beta$) and the unit-size ($\alpha$) for each individual's utility scale.

  Without an independent axiom that fixes these scales relative to one another (a normalization rule), the weights are **artifacts of measurement**, not moral facts. You could make a dictator out of anyone simply by choosing a utility scale for them that is sufficiently large relative to everyone else's.

  ### 2. Cardinal Measurability $\neq$ Interpersonal Comparability
  Harsanyi's theorem establishes **cardinal measurability** (because vNM utilities reflect risk attitudes, not just ordinal rankings), but it does not establish **cardinal unit comparability**.

  *   **Cardinal Measurability:** I can say that Person A gains twice as much utility from outcome $X$ as from outcome $Y$.
  *   **Interpersonal Comparability:** I can say that Person A's gain from $X$ is equal to Person B's gain from $Z$.

  The 1955 theorem assumes the former but lacks the machinery for the latter. To derive classical utilitarianism (where everyone counts for one and no one for more than one), we need to know that a "util" for Person A is the same size as a "util" for Person B. The vNM axioms are silent on this. They only govern consistency within an individual's preference ordering over lotteries.

  As Sen (1970, 1979) argued, Harsanyi's result shows that *if* utilities are interpersonally comparable, *then* the aggregation must be utilitarian. But the theorem does not prove *that* they are comparable. It essentially says: "If you can compare utilities, here is how you must do it." It does not tell you how to bridge the gap between separate minds.

  ### 3. The Pareto Axiom is Morally Neutral
  The normative force of the theorem is often attributed to the Pareto Indifference (or Pareto Efficiency) axiom. However, Pareto principles are notoriously weak when it comes to distributional justice.

  Pareto Indifference states that if everyone is indifferent between two social states, society should be indifferent. This rules out social preferences that are purely contrarian, but it does not constrain trade-offs. It does not tell us how to weigh Person A's intense pleasure against Person B's mild pain.

  Because the Pareto axiom is satisfied by **any** affine combination, it is satisfied by a **dictatorship**. If we set $a_1 = 1$ and $a_{i>1} = 0$, the social welfare function is simply $W = U_1$. This satisfies vNM rationality and Pareto efficiency (since if everyone prefers $X$, Person 1 prefers $X$).

  Since the theorem permits a dictatorship just as easily as it permits equal-weight utilitarianism, the theorem itself cannot be said to establish utilitarianism. It merely establishes linearity. The move from linearity to *equal-weight* linearity requires a moral premise external to the theorem (such as anonymity or impartiality), which the 1955 formalism does not contain.

  ### 4. Harsanyi's Later "Veil of Ignorance" Move Admits the Deficit
  It is telling that in later work (e.g., Harsanyi 1953, 1977), Harsanyi attempted to bolster the 1955 theorem by adding a "veil of ignorance" argument. He argued that if an observer assigns an equal probability of being any person in society, they should maximize the average utility.

  However, critics point out that this move essentially **begs the question** of interpersonal comparison. To say that an observer should maximize the *average* utility assumes that the utility units across different people are already commensurable. If I cannot compare the utility units of Person A and Person B, I cannot calculate an average, even behind a veil of ignorance. By needing to add this extra layer to get to utilitarianism, Harsanyi implicitly acknowledged that the 1955 Aggregation Theorem alone was insufficient to license interpersonal comparisons.

  ### Conclusion
  Your seminar professor presented the theorem as putting utilitarianism on "rigorous axiomatic foundations." A more precise reading is that the theorem puts **linear aggregation** on rigorous foundations.

  The theorem demonstrates that **if** we accept:
  1.  vNM rationality for individuals and society,
  2.  Pareto Indifference,
  3.  **And** a specific normalization rule that makes utility units interpersonally comparable...

  **Then** the social welfare function must be utilitarian.

  Without premise #3, the weights $a_i$ are indeterminate. The theorem shows that utilitarianism is the *only* coherent way to aggregate *comparable* cardinal utilities, but it provides no internal resource for establishing that comparability. Therefore, the theorem does not solve the fundamental metaphysical and epistemological problem of utilitarianism; it merely pushes it back a step. Your skepticism is not only justified; it is necessary for a rigorous understanding of the theorem's normative limits.
