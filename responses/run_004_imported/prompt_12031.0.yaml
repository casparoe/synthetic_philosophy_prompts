  2. **Pluto:** Like the hot dog, this is a scientific classification decision based on agreed-upon criteria rather than a discovery of new physical properties of the dwarf planet itself.
  3. **Ship of Theseus:** While often treated as deep metaphysics, much of the disagreement dissolves when parties clarify whether they prioritize material continuity or functional/formal continuity, though some ontological commitment remains.
  4. **Statue/Clay:** This leans substantive because the two entities appear to have different modal properties (e.g., survival conditions), suggesting a real difference beyond just labeling.
  5. **Scattered objects:** This is the core case for quantifier variance; whether a "trout-turkey" exists often depends entirely on the linguistic framework used to parse existence, rather than a physical discovery.
  6. **Numbers:** While deflationists argue this is linguistic, the indispensability of mathematics to science suggests the disagreement tracks a real feature of reality regarding abstract objects.
  7. **Free will:** Although definitions vary, once terminology is fixed, the disagreement concerns causal structures and moral responsibility, which are not merely linguistic choices.

  **Verdict:** You are basically right overall. While your friend correctly identifies that many ontological disputes (like the ship or scattered objects) soften under charitable interpretation, her claim that "almost all" dissolve is an overextension of quantifier variance; cases like mathematical existence and moral responsibility retain a hard substantive core that semantics alone cannot explain away.
