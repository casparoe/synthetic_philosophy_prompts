  **What Both Missed:** Neither addresses the **deterrence function** of liability, which operates regardless of moral blame by incentivizing safety investments. Additionally, they overlook **process liability** (negligence in training data curation or safety validation), which offers a middle ground between strict product liability and the search for a specific "design decision."
