  ### (c) PrudentBot: Exploiting CooperateBot

  FairBot has a weakness: it is "too nice." It cooperates with **CooperateBot** ($CB$), which always outputs $C$ regardless of input.
  *   $FB$ vs $CB$: $FB$ proves $\square (CB(FB) = C)$ (trivially true). $FB$ Cooperates.
  *   Payoff: $(R, R)$ (Reward, Reward).
  *   Missed Opportunity: Against $CB$, you should Defect to get $(T, S)$ (Temptation, Sucker).

  **PrudentBot ($PB$)** is designed to cooperate with FairBot (maintaining Löbian cooperation) but defect against CooperateBot (exploiting the sucker).

  #### 1. The Definition
  PrudentBot adds a second condition to FairBot's logic. It cooperates only if the opponent reciprocates cooperation **AND** the opponent is not an unconditional cooperator. A standard way to formalize "not an unconditional cooperator" is to check if the opponent defects against a pure Defector ($DB$).

  $$ PB(X) = C \iff \underbrace{\square (X(PB) = C)}_{\text{Reciprocity}} \land \underbrace{\square (X(DB) = D)}_{\text{Non-Suckerness}} $$

  #### 2. Against CooperateBot ($CB$)
  *   **Reciprocity:** $\square (CB(PB) = C)$. This is **True** (CB always cooperates).
  *   **Non-Suckerness:** $\square (CB(DB) = D)$. This is **False**. $CB$ always cooperates, so it is provable that $CB(DB) = C$. Therefore, it is not provable that $CB(DB) = D$ (assuming PA is consistent).
  *   **Result:** The conjunction is False. $PB$ **Defects**.
  *   **Payoff:** $PB$ gets $T$ (Temptation), $CB$ gets $S$ (Sucker). $PB$ successfully exploits $CB$.

  #### 3. Against FairBot ($FB$)
  We need to ensure $PB$ still cooperates with $FB$.
  *   **Non-Suckerness Check:** Does $\square (FB(DB) = D)$ hold?
      *   $FB$ against $DB$: $FB$ checks $\square (DB(FB) = C)$. Since $DB$ always defects, this is unprovable. So $FB$ defects.
      *   Since $FB$'s source code is known and deterministic, PA can prove that $FB$ will defect against $DB$.
      *   So, $\square (FB(DB) = D)$ is **True**.
  *   **Reciprocity Check:** We are left with the condition $\square (FB(PB) = C)$.
      *   $FB$'s rule: $FB(PB) = C \iff \square (PB(FB) = C)$.
      *   $PB$'s rule (simplified, since the second condition is True): $PB(FB) = C \iff \square (FB(PB) = C)$.
      *   Let $p \equiv (PB(FB) = C)$ and $q \equiv (FB(PB) = C)$.
      *   We have the coupled system:
          $$ p \iff \square q $$
          $$ q \iff \square p $$
      *   Substituting $q$ into $p$: $p \iff \square (\square p)$.
      *   By a generalization of Löb's Theorem (which applies to nested boxes $\square \square p \to p$), this system implies $\text{PA} \vdash p$ and $\text{PA} \vdash q$.
  *   **Result:** Both proofs exist. $PB$ and $FB$ **Cooperate**.
  *   **Payoff:** $(R, R)$.

  ### Summary
  1.  **FairBot** uses Löb's Theorem to turn the statement "I cooperate if you prove you cooperate" into a self-fulfilling prophecy of mutual cooperation ($\phi \leftrightarrow \square \phi \implies \phi$).
  2.  **Simulation** fails due to infinite recursion (dynamic execution); **Provability** succeeds because it searches for static mathematical certificates of behavior, avoiding the need to run the opponent.
  3.  **PrudentBot** adds a conjunct to the cooperation condition ($\square (X(DB)=D)$). This condition is false for CooperateBot (forcing Defection) but true for FairBot (allowing the Löbian cooperation loop to re-establish).

  This framework demonstrates that rational agents with access to each other's source code can achieve cooperative outcomes that are impossible in classical game theory, provided they reason about each other using logic rather than simulation.
