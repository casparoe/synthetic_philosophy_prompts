  2.  **Recall/Research Lewis's Definition of Convention:**
      *   Lewis defines a convention as a solution to a *coordination problem*.
      *   Key conditions (roughly, from *Convention*):
          1.  There is a regularity $R$ in behavior.
          2.  There is common knowledge (or mutual expectation) that others follow $R$.
          3.  There is a preference for conformity (conditional preference): I prefer to follow $R$ *if* others follow $R$.
          4.  There is an alternative regularity $R'$ that *could* have worked just as well (arbitrariness).
          5.  The problem involves conflicting or mixed interests (in the "impure" case) or pure coordination.
      *   *Crucial Concept:* **Salience / Focal Points.** Lewis draws heavily on Schelling. For a convention to start, there needs to be something that makes one solution stand out as the "natural" choice before the convention is established.
      *   *Crucial Concept:* **Common Knowledge.** Everyone needs to know that everyone knows... that this is the rule.
      *   *Crucial Concept:* **Precedent.** Past instances of coordination reinforce the expectation.

  3.  **Analyze the Telephone Case (Lewis's Example):**
      *   **Structure:** Two parties.
      *   **Roles:** Asymmetric. One is the "Caller" (initiator), one is the "Callee" (receiver).
      *   **Preference:** Both want to talk. Both prefer the *other* to pay the cost (dialing, tying up the line, effort). This makes it an *impure* coordination problem (Battle of the Sexes structure mixed with Coordination).
      *   **Solution:** "Caller calls back."
      *   **Why it works:** The asymmetry of roles provides a **salient** distinguishing feature. It breaks the symmetry. Without this asymmetry, both would wait (silence) or both would dial (busy signal/clash). The "original caller" status is a piece of *common knowledge* derived from the history of the specific interaction.

  4.  **Analyze the Video Call Case:**
      *   **Structure:** Multiple parties (often >2).
      *   **Roles:** Symmetric. Everyone joins a link. There is no "host" in the technical sense of telephony (usually), or if there is a "host," they might not be the one who sent the link, or the host might be the one whose internet crashed.
      *   **Preference:** Everyone wants to resume. Everyone prefers someone else to do the work (restart, wait for others, check tech).
      *   **Current State:** Chaos/Pileup. No consistent regularity.
      *   **Lewis's Criteria Check:**
          *   Is there a regularity $R$? No.
          *   Is there common knowledge of $R$? No.
          *   Is there a preference for conformity? Hard to say, because there's no $R$ to conform to.
          *   *Why no $R$?*

  5.  **Identify the Missing Ingredient (Lewisian Analysis):**
      *   Lewis emphasizes that conventions solve *coordination problems*. A coordination problem requires equilibrium points.
      *   In the telephone case, the asymmetry (Caller vs. Callee) creates a unique equilibrium that is **salient**.
      *   In the video call case, the participants are **symmetric** regarding the reconnection action. Everyone has the link. Everyone has the capability to restart.
      *   Lewis argues that for a convention to emerge (especially in impure coordination problems where interests conflict slightly regarding *who* bears the cost), there must be a **salient feature** to correlate expectations.
      *   *Schelling's Focal Point:* Lewis relies on Schelling. If I don't know what you will do, I look for a clue. "Caller" is a clue. "Host" *could* be a clue, but in practice, "Host" is often ambiguous (is it the scheduler? the tech owner? the first joiner?).
      *   *Common Knowledge of the Distinguishing Feature:* In the telephone case, both parties *know* who called whom. In the video call, do we all know who is "responsible"? Often no.
      *   *The "Impure" Aspect:* Lewis notes the telephone case is impure (I prefer you call). In video calls, it's also impure (I prefer you restart). To solve an impure coordination problem, you need a way to assign the cost. The telephone asymmetry assigns the cost to the Caller. The video call symmetry leaves the cost unassigned.
      *   *Precedent:* Conventions grow from precedent. Because the first few times video calls dropped, people acted randomly, no precedent was set. But *why* did they act randomly? Because there was no salient feature to guide the first choice.

      *   *Refining the "Missing Ingredient":* It's not just "asymmetry." It's **salient asymmetry that is common knowledge**.
      *   In the telephone case, the history of the call provides common knowledge of the asymmetry.
      *   In the video call case, the technology (shared link) erases the history of initiation. The roles are functionally identical.
      *   Lewis would argue that without a **salient correlating device** (a way to distinguish agents that everyone recognizes), expectations cannot converge.
      *   Specifically, Lewis discusses the need for a **unique equilibrium** selected by salience. In the video call, there are multiple potential equilibria (Person A restarts, Person B restarts, Host restarts), but none are *salient* enough to become common knowledge *ex ante*.

