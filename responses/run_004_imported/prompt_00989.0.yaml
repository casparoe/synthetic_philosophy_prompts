      *   Lewis says impure coordination needs a way to correlate strategies.
      *   The missing ingredient is a **publicly salient asymmetry** to serve as a **correlation device**.

  8.  **Final Polish:**
      *   Make sure to explicitly mention *Convention*.
      *   Ensure the distinction between the telephone (asymmetric roles) and video (symmetric roles) is central.
      *   Conclude that without this salience, common knowledge of expectations cannot form, preventing the regularity from becoming a convention.

