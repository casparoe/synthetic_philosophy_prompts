prompt: |-
  Having followed rationalist blogs and forums for a long time, I've noticed that van Fraassen's Reflection Principle (from his 1984 paper "Belief and the Will") and Yudkowsky's "Conservation of Expected Evidence" (from the Sequences) tend to get treated as though they were the same insight. Van Fraassen's principle says, roughly, that if you are now certain your credence in P at some future time will equal x, your current credence in P conditional on that supposition must already equal x — and this is meant to hold no matter how that future credence comes about. Yudkowsky's principle, derived from the law of total probability, claims only that your expected posterior must equal your prior when the future credence results from conditionalizing on evidence. Compare the two in some depth: is Reflection simply this Bayesian result restated in more general, temporal terms, or does its indifference to the source of the future credence make it a substantially stronger and more easily refuted claim? Illustrate the difference with a case where credence shifts for a reason other than rational updating — anticipated memory loss or persuasion by a bad argument, say — and state which principle better survives it.
reasoning: |-
  Here's a thinking process that leads to the comparison between van Fraassen's Reflection Principle and Yudkowsky's Conservation of Expected Evidence:

  1.  **Deconstruct the Prompt:**
      *   **Topic:** Compare Bas van Fraassen's Reflection Principle (1984) and Eliezer Yudkowsky's Conservation of Expected Evidence (CoEE).
      *   **Common Perception:** They are often treated as the same insight in rationalist circles.
      *   **Core Definitions:**
          *   *Reflection:* If I am certain now that my future credence in $P$ will be $x$, my current credence in $P$ (conditional on that future credence being $x$) must be $x$. Holds regardless of *how* the future credence arises.
          *   *CoEE:* Expected posterior = Prior. Derived from Law of Total Probability. Holds *only* if the update is via conditionalization on evidence.
      *   **Key Question:** Is Reflection just CoEE restated temporally, or is it stronger/more vulnerable due to indifference to the source of belief change?
      *   **Task:** Illustrate the difference with a specific case (non-rational updating, e.g., memory loss, bad argument) and determine which principle survives.

  2.  **Analyze the Principles:**

      *   **Conservation of Expected Evidence (CoEE):**
          *   Mathematical basis: $E[P(H|E)] = P(H)$.
          *   Assumption: The agent updates via Bayesian Conditionalization.
          *   Implication: You cannot predict the *direction* of your belief change in advance. If you could, you should update now.
          *   Scope: Limited to rational learning processes (gathering evidence).

      *   **Van Fraassen's Reflection Principle:**
          *   Formulation: $P_{now}(A | P_{future}(A) = x) = x$.
          *   Assumption: The agent treats their future self as an expert *regardless of why* the belief changed.
          *   Implication: Synchronic coherence between current and anticipated future beliefs.
          *   Scope: Universal (applies to *any* change in credence, rational or not).

  3.  **Identify the Crucial Difference:**
      *   CoEE is a theorem of probability theory *given* Bayesian updating. It describes how beliefs *should* move if one is rational.
      *   Reflection is a normative constraint on rationality *itself*. It demands that you respect your future self's beliefs even if they aren't formed by evidence.
      *   *The Gap:* CoEE breaks if you anticipate irrational updating. Reflection *demands* you anticipate irrational updating as if it were authoritative.
      *   Therefore, Reflection is **stronger** (makes more demands) and **more easily refuted** (because it forces you to respect irrational changes).

  4.  **Develop a Counter-Example (The "Acid Test"):**
      *   Need a scenario where future credence changes, but *not* due to evidence.
      *   *Scenario 1: Memory Loss.* (Christensen's example is classic). If I know I will forget evidence, my future credence might drop, but I shouldn't lower my credence now.
      *   *Scenario 2: Brainwashing/Manipulation.* If I know I will be tortured into believing $P$, should I believe $P$ now? Reflection says yes (if I'm certain I'll believe it). Intuition says no.
      *   *Scenario 3: Self-Fulfilling Prophecy.* (Less relevant to the specific prompt's examples).
      *   *Selection:* The prompt suggests "anticipated memory loss or persuasion by a bad argument." Let's use the **Memory Loss** case (often associated with David Christensen's critique) or the **Drunk/Impaired** case. Let's go with a "Cognitive Decline/Drug" scenario as it clearly separates evidence from mechanism.
      *   *Scenario:* I know I will take a pill tomorrow that makes me believe the moon is made of cheese ($P$) with credence 0.9, without providing evidence.
      *   *CoEE:* Does not apply. No evidence is being conditionalized on.
      *   *Reflection:* Says $P_{now}(P | P_{future}(P)=0.9) = 0.9$. Since I know I'll take the pill, $P_{now}(P) = 0.9$.
      *   *Verdict:* Reflection leads to absurdity here. CoEE remains silent (or rather, isn't violated because the precondition isn't met).

  5.  **Drafting the Comparison:**

      *   **Introduction:** Acknowledge the overlap (both deal with diachronic coherence) but state the thesis: They are distinct. CoEE is a mathematical consequence of conditionalization; Reflection is a normative principle that extends beyond conditionalization. Reflection is stronger and more vulnerable.
      *   **Section 1: Conservation of Expected Evidence (CoEE).**
          *   Define it mathematically ($E[P_{new}] = P_{old}$).
          *   Emphasize the precondition: Updating on *evidence*.
          *   Explain the intuition: You can't predict bias in evidence.
      *   **Section 2: Van Fraassen's Reflection.**
          *   Define it ($P_{now}(A | P_{future}(A)=x) = x$).
          *   Emphasize the lack of precondition: Applies to *any* future credence.
          *   Explain the intuition: Deference to future self as epistemic authority.
      *   **Section 3: The Divergence (The "Why").**
          *   CoEE is descriptive of ideal Bayesian agents.
          *   Reflection is prescriptive for agents who might deviate from ideal Bayesianism.
          *   Reflection implies CoEE (if updating is by conditionalization), but CoEE does not imply Reflection.
      *   **Section 4: The Counter-Example (Memory Loss/Manipulation).**
          *   Construct the "Forgetful Driver" or "Brainwashing" case.
          *   Apply CoEE: N/A (no evidence).
          *   Apply Reflection: Forces current belief to match future irrational belief.
          *   Show why this is problematic (violates externalist justification).
      *   **Section 5: Conclusion.**
          *   Reflection is not just CoEE restated.
          *   Reflection is a stronger claim that fails in cases of anticipated irrationality.
          *   CoEE survives because it limits its scope to rational updating.

  6.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does Reflection imply CoEE?* If I assume my future self updates by conditionalization, then Reflection entails that my current belief must align with the expected posterior. So yes, in the domain of rational updating, they converge.
      *   *Is Reflection "refuted"?* Van Fraassen knew it was controversial. It's often treated as a constraint on *ideal* rationality. Critics (Christensen, Talbott) argue it fails in cases of self-doubt or memory loss. I should frame it as "Reflection makes a claim that is intuitively false in specific cases, whereas CoEE remains mathematically robust within its domain."
      *   *Clarify the "Certainty" condition:* The prompt says "if you are now certain your credence... will equal x". Strict Reflection usually involves a probability distribution over future credences, but the certainty version is the strongest and easiest to test. I will stick to the prompt's formulation.
      *   *Rationalist Community Context:* Acknowledge that LW (LessWrong) often conflates them because they focus on ideal agents. For an ideal agent who never forgets and never gets brainwashed, they collapse into the same thing. The distinction matters for non-ideal agents.

  7.  **Final Polish:**
      *   Ensure the tone is analytical and philosophical.
      *   Check mathematical notation for clarity.
      *   Make sure the conclusion directly answers the prompt's specific question ("which principle better survives it").

  8.  *(Self-Correction during drafting)*: I need to be careful not to say CoEE is "silent." CoEE says "If you update on evidence, expectation is conserved." If you *don't* update on evidence, CoEE doesn't tell you what to do. Reflection tells you what to do (match the future self). That's the key difference. Reflection is action-guiding in irrational scenarios; CoEE is not.

  9.  **Final Plan:**
      *   Intro: Distinguish the two.
      *   CoEE: Math of Conditionalization.
      *   Reflection: Norm of Self-Deference.
      *   Case Study: The "Amnesia Pill".
      *   Analysis: Reflection fails, CoEE is inapplicable (thus not violated).
      *   Conclusion: Reflection is stronger but false; CoEE is weaker but true.

  (Proceed to generate output based on this structure.)
answer: |-
  The conflation of Bas van Fraassen's **Reflection Principle** and Eliezer Yudkowsky's **Conservation of Expected Evidence (CoEE)** is a common occurrence in rationalist discourse. Both principles address the relationship between current beliefs and anticipated future beliefs, and both warn against predicting specific directions of belief change without cause. However, treating them as identical obscures a critical philosophical distinction.

  While CoEE is a mathematical theorem derived from the laws of probability *given* Bayesian conditionalization, Reflection is a normative principle of epistemic rationality that demands deference to one's future self *regardless* of how that future state is reached. Consequently, Reflection is a substantially stronger claim than CoEE. It extends the requirement of coherence into domains where CoEE does not apply, making Reflection more vulnerable to counter-examples involving anticipated irrationality, memory loss, or manipulation.

  ### 1. Conservation of Expected Evidence (CoEE)
  CoEE is a direct consequence of the law of total probability. It states that for any hypothesis $H$ and a set of possible pieces of evidence $E_i$ you might encounter, your current credence in $H$ must equal the weighted sum of your possible future credences:

  $$ P_{now}(H) = \sum_i P_{future}(H | E_i) \cdot P_{now}(E_i) $$

  In simpler terms: **Your current credence is the expectation of your future credence.**

  **The Crucial Constraint:** CoEE holds *only* if the transition from $P_{now}$ to $P_{future}$ occurs via **Bayesian Conditionalization** on new evidence. It describes the behavior of an ideal agent processing information. If you anticipate receiving evidence that pushes your belief up, you must also anticipate receiving evidence that pushes it down, weighted by likelihood, such that the net expected change is zero. If you could predict a systematic drift in your beliefs without new evidence, CoEE implies you are not currently Bayesian; you should update *now*.

  ### 2. Van Fraassen's Reflection Principle
  Van Fraassen's principle is formulated as a synchronic constraint on diachronic beliefs. In the strong form cited in your prompt:

  $$ P_{now}(H \mid P_{future}(H) = x) = x $$

  If you are certain now that your future credence in $H$ will be $x$, your current credence in $H$ (conditional on that prediction) must be $x$.

  **The Crucial Difference:** Reflection contains **no constraint on the mechanism** of belief change. It does not require that the future credence result from evidence. It relies on the presumption that your future self is an epistemic authority to whom your current self should defer. Van Fraassen argued this is required for diachronic coherence: if you now disagree with what you know you will believe later, you are effectively calling your future self irrational, which undermines the stability of your agency over time.

  ### 3. The Divergence: Rational vs. Irrational Updating
  The principles converge when the agent is ideal. If you know you will update only by conditionalizing on evidence, Reflection and CoEE yield the same result: your current belief should match the expected value of your future belief.

  However, they diverge sharply when the source of the future credence is **not** rational evidence gathering.
  *   **CoEE** is silent. Since the precondition (updating on evidence) is not met, the theorem does not apply. It does not tell you what to do if you anticipate brainwashing.
  *   **Reflection** is active. It commands you to align your current belief with the anticipated future belief, even if that future belief is the product of error, fatigue, or manipulation.

  This makes Reflection a **stronger** claim (it governs more scenarios) but also a **more easily refuted** one (it governs scenarios where intuition rebels against it).

  ### 4. Case Study: The Amnesia Pill
  To illustrate the difference, consider a case of anticipated cognitive degradation, often discussed by David Christensen.

  **The Scenario:**
  You are a detective investigating a crime. You have strong evidence that the Butler did it ($B$). Your current credence $P_{now}(B) = 0.9$.
  You know that in one hour, you will be required to take a mandatory "Amnesia Pill" as part of a medical trial. This pill is known to wipe specific short-term memories regarding the investigation without providing any new evidence about the crime. Due to this memory loss, you know with certainty that your future credence will drop to $P_{future}(B) = 0.5$, simply because you will forget the evidence you currently hold.

  **Applying Conservation of Expected Evidence:**
  CoEE asks: "Will you update on evidence?"
  *   **Answer:** No. You are losing information, not gaining it.
  *   **Result:** CoEE is inapplicable. It does not demand your current credence equal your expected future credence because the process is not conditionalization. It allows you to maintain $P_{now}(B) = 0.9$ despite knowing $P_{future}(B) = 0.5$.

  **Applying the Reflection Principle:**
  Reflection asks: "Are you certain your future credence will be 0.5?"
  *   **Answer:** Yes.
  *   **Result:** Reflection demands $P_{now}(B \mid P_{future}(B)=0.5) = 0.5$. Since you are certain of the future state, your current credence must drop to 0.5 immediately.

  **The Verdict:**
  Intuitively, the Reflection Principle fails here. You should not lower your credence that the Butler did it simply because you know you are about to forget your evidence. Your current high credence is justified by the evidence you *currently* possess. The future low credence is the result of a defect (memory loss), not a refinement of knowledge.

  By forcing you to defer to a future self that you *know* will be less informed, Reflection violates the externalist intuition that beliefs should track truth-conducive processes. It forces a form of "epistemic humility" that amounts to self-sabotage.

  CoEE, by contrast, survives unscathed. Because it restricts its scope to rational updating, it correctly identifies that memory loss is not a learning event. It does not command you to lower your credence, preserving the rationality of holding onto evidence until it is actually lost.

  ### 5. Why the Confusion Persists
  The rationalist community often conflates these principles because they primarily model **ideal agents**. In a world where agents do not suffer memory loss, are not subject to brainwashing, and update strictly via Bayesian conditionalization, Reflection and CoEE collapse into the same constraint. For an ideal agent, the only reason for credence to change is evidence; therefore, deferring to the future self (Reflection) is equivalent to deferring to the expected result of evidence processing (CoEE).

  However, real agents (and the study of rationality as a practice) must account for non-ideal conditions.

  ### Conclusion
  Van Fraassen's Reflection Principle is **not** simply Conservation of Expected Evidence restated in temporal terms.
  *   **CoEE** is a mathematical truth about probability distributions under the assumption of conditionalization. It is robust but limited in scope.
  *   **Reflection** is a normative philosophical claim about the authority of the future self. It is broader in scope but demonstrably false in cases of anticipated irrationality or information loss.

  In the case of the Amnesia Pill (or persuasion by a bad argument), **Conservation of Expected Evidence better survives.** It correctly remains silent, allowing the agent to maintain justified beliefs despite anticipating future error. Reflection fails because it demands that an agent treat their own future cognitive decline as authoritative evidence, conflating *predicting* a belief with *justifying* it.
