answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and apparently, I lost a vote somewhere along the line because I'm the one holding the microphone.

  A while back, I found a copy of a book called *On Old Age* by the Roman philosopher Cicero. It's two thousand years old. I bought it as a joke, but I actually read it. And the reason I'm mentioning a dead Roman senator at my dad's 80th birthday is that Cicero breaks down exactly what we're supposed to dread about getting old. He lists four complaints: That old age withdraws us from active life, that it makes the body weaker, that it deprives us of physical pleasures, and that it is near to death.

  Now, my dad has made it very clear that if I stand up here and tell him "80 is the new 60," he will walk out. He's right. That's a lie we tell to avoid the reality. 80 is 80. The body *does* wear out. So, I'm not going to tell you that. Instead, I want to look at how my dad answers those four complaints, not with philosophy, but with forty-five years of running a hardware store.

  Cicero argues that old age removes you from action. But look at Dad. He sold the business last year. Officially, he's retired. Unofficially, he shows up twice a week to "make sure they're not screwing it up." Cicero wrote about a blind senator who was carried into the house because his counsel was still needed. Well, we don't have a Senate here, we have a payroll and a inventory system, but the principle is the same. Dad isn't leading legions anymore, but his experience is still the backbone of that place. He hasn't withdrawn; he's just changed his post.

  Cicero's second complaint is physical decay. I'm not going to lie and say your knees work like they did in the Army, Dad. They don't. But Cicero suggests that while the vessel weakens, the character doesn't have to. You've traded lifting heavy boxes for lifting the weight of the family. That's a different kind of strength, but it counts.

  The third complaint is the loss of pleasure. Cicero admits you can't enjoy the feasts of youth. But he argues you find better pleasures. For Dad, that hasn't been banquets; it's been competence. It's the pleasure of fixing a lawnmower engine that everyone else said was trash. It's the pleasure of seeing the cousins here, and the old buddies over there, and knowing you built a life that holds all of us.

  And finally, the fourth complaint: Death. Cicero says there are only two options. Either the soul goes somewhere better, or it ceases to exist. If it goes somewhere better, it's a gain. If it ceases to exist, there's no pain to feel. So, there is nothing to dread. Now, Dad isn't a philosopher, and he's not a rich Roman landowner planting trees he'll never see grow. He's a guy from [Hometown] who worked with his hands. But he did plant trees. He built a business that will outlast him. He raised kids who are standing here. He knows that even when he's gone, the work remains.

  So, I'm not going to wish you "many more years" as if that's the only metric that matters. I'm going to wish you exactly what Cicero argued for: A respect for the age you are, not the age you wish you were.

  To Dad. Who knows that 80 isn't the new 60. It's the new 80. And he's making it look pretty damn good.

  Cheers.
