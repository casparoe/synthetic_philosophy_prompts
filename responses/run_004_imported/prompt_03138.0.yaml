answer: |-
  **Setting:** *The 24-Hour Metaphysic Diner. 2:00 AM. Fluorescent lights hum. Ted (Universalist, Sider-adjacent) has the pan-seared trout. Petra (Organicist, van Inwagen defender) has the turkey club. The check sits untouched between them.*

  **Ted:** *(Gesturing with his fork)* You're pushing the trout around, Petra. You know what that means, don't you?

  **Petra:** Don't start.

  **Ted:** Strictly speaking, there is an object composed of your turkey club and my trout. Right now. In this booth. It's a scattered particular. It has parts separated by space, but composition is unrestricted. So, the Trout-Turkey exists.

  **Petra:** The Trout-Turkey is an ontological crime scene, Ted. It's a gerrymandered mess. There's nothing *holding* those parts together. No causal unity. No internal principle of rest or motion. It's just "stuff" because your logic says there has to be a referent for the sum.

  **Ted:** It's not about logic demanding a referent. It's about existence not being a matter of degree. Look, we've been stuck on this for three sessions. Van Inwagen's whole pitch in *Material Beings* is that moderate views fail because they make existence vague. If composition happens at "contact," then there's a borderline case where it's indeterminate if the atoms are touching. If it's indeterminate if they're touching, it's indeterminate if there's an object there. If it's indeterminate if there's an object there, the *number* of objects in the room is vague. And you can't have a vague number of objects. Bivalence dies.

  **Petra:** I know the argument. "Vague existence implies vague identity implies vague cardinality." It's the standard line. That's why Peter goes with Life.

  **Ted:** Exactly. He dodges the vagueness bullet by jumping to Organicism. Simples compose something iff their activity constitutes a life. But here's the problem, and you know it: "Life" is just as vague as "Contact."

  **Petra:** It's not.

  **Ted:** Come on. Viruses. Are they alive? Prions? What about a human in a persistent vegetative state? Is the activity of those simples constituting a life *now*, or did it stop three years ago? If there's a borderline case where it's indeterminate whether the activity constitutes a life, then you're back in the soup. You've got vague existence. You've got a vague number of things in the hospital room. You haven't solved the problem; you've just moved the vagueness from the spatial boundaries of the object to the functional boundaries of the system.

  **Petra:** You're conflating epistemic vagueness with ontic vagueness, Ted. Just because *we* argue about whether a virus is alive doesn't mean the world is vague. Van Inwagen's point is that 'constitutes a life' is a primitive. It carves nature at a joint that isn't dependent on our semantic indecision. When a zygote begins to metabolize and divide, there is a fact of the matter. It might be hard for *us* to pinpoint the nanosecond, but that's an limitation of our measurement, not a gap in reality.

  **Ted:** That sounds like a Hail Mary. You're saying "Life" is a magical stopper for vagueness? Why does *that* predicate get to be precise when "fastening" doesn't? Fastening is physical. Life is... what? A special kind of event?

  **Petra:** It's a specific kind of causal unity. When simples act in a way that catches each other's effects to sustain a single event—a life—they become a substance. When they don't, they're just a heap. The Trout-Turkey doesn't catch its own effects. The trout doesn't feed the turkey. But my immune system? That's catching effects. That's real unity. You're willing to say the Trout-Turkey exists just to save your quantifiers from having restrictions. I'm willing to say existence is restricted to save ontology from being trivial.

  **Ted:** But you're not saving it from vagueness! That's the point of the seminar paper you're writing, right? If you admit there's even one borderline case of "Life"—and there are thousands, biologically speaking—then you admit there's a case where it's indeterminate if an object exists. And if existence is indeterminate, then classical logic fails. I'd rather accept the Trout-Turkey than give up bivalence. The Trout-Turkey is weird, sure. It's not *natural*. I'll grant you that.

  **Petra:** "Not natural" is doing a lot of work there.

  **Ted:** It's doing all the work! Look, Sider's move. Existence is easy. Unrestricted. Anyone can have that. What matters is *structure*. What matters is which objects are *natural*. The Trout-Turkey exists, but it's a terrible object. It doesn't enter into laws of nature. It has no causal powers over and above its parts. But *you*, Petra, you're a natural object. You're a life. Your ontology is sparse, but you're paying for it by making the boundary of 'you' potentially vague. I'm paying for my crisp boundaries by accepting a bloated universe of junk. Which tax do you want to pay?

  **Petra:** I'm paying the tax that acknowledges reality isn't just a logical grid. You treat existence like a checkbox on a form. "Does the sum exist? Check." But existence should track *unity*. If I accept the Trout-Turkey, I lose the distinction between an *organism* and an *accident*. If the Trout-Turkey exists in the same sense I do, then "object" doesn't mean anything anymore. It just means "non-empty set of coordinates."

  **Ted:** But if you restrict composition to Life, you make God's job hard. God has to look at the universe and decide, "Hmm, is that swirling storm a life? Is that galaxy a life?" If He hesitates, He's violating the law of non-contradiction. If I'm a Universalist, God creates the atoms, and the rest is free. He doesn't have to decide where the objects stop because *everything* is an object. The vagueness is purely in our language, not in the world.

  **Petra:** And that's why you're a nihilist about structure. You save logic by killing ontology. You say the Trout-Turkey exists, but then you immediately say, "But it's not natural, don't worry about it." So why call it existence at all? Why not just say, "There are atoms arranged trout-wise and turkey-wise," and leave it there?

  **Ted:** Because "there are atoms arranged X-wise" *entails* "there is an object composed of those atoms." The quantifier ranges over everything. If I say "There is nothing in the box" but there are atoms in the box, I'm lying.

  **Petra:** You're lying only if you think "thing" means "logical sum." I think "thing" means "substance." And substances are rare. They're lives.

  **Ted:** *(Cuts a piece of trout)* So, if I eat this trout, and it becomes part of my metabolic activity...

  **Petra:** ...It becomes part of your life. The simples that were trout-wise are now Ted-wise. They compose you, not the trout.

  **Ted:** See, that's the other bullet. You have to say the trout *ceases to exist* when I eat it. The atoms don't die, but the substance vanishes.

  **Petra:** Correct. The activity that constituted the life of the trout is over. The simples are now caught up in *your* life.

  **Ted:** And if I get a tumor? Is the tumor *me*? Is it a separate life? Parasites, Petra. Tapeworms. Are they parts of me or separate substances? If they're separate lives, they aren't parts of me. If they're parts of me, they aren't lives. Your criterion forces you to say I don't have a tapeworm; I just have a tapeworm-shaped region of space where a different substance is located inside my skin.

  **Petra:** *(Smiles)* That's a feature, not a bug. It explains why my immune system attacks it. It recognizes it as *other*. Your view says the tapeworm is just as much a part of Ted as my liver is. That dissolves the boundary between self and world.

  **Ted:** I dissolve the boundary to save the logic. You keep the boundary but make it fuzzy. Look, we're at an impasse. I accept the Trout-Turkey to keep existence precise. You reject the Trout-Turkey to keep substances meaningful, but you risk making existence vague.

  **Petra:** I don't think 'Life' is vague. I think it's fundamental. You think 'Existence' is fundamental. We're just picking different primitives.

  **Ted:** *(Signals for the check)* I think you're smuggling vagueness in through the side door of biology. But... *(He points at the bill)* ...there is definitely an object composed of this bill and the pen.

  **Petra:** *(Puts her hand over the pen)* There is a bill. There is a pen. There is no "Bill-Pen." And if you try to pay with the sum of the two, the waitress is going to think you're insane.

  **Ted:** She'll think I'm a Universalist. There's a difference.

  **Petra:** Not to her. She wants cash or card. Not ontological commitments.

  **Ted:** *(Laughs)* Fair enough. I'll pay for the Trout-Turkey. You pay for the Club.

  **Petra:** Deal. Just don't ask me to split the tip. The tip-atom sum is definitely vague.

  **Ted:** Don't tempt me.
