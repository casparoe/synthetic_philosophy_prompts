      *   **The Vagueness Attack (Ted):** Ted should start by pointing out that "Life" is just as vague as "Contact." When does a virus become alive? When does brain death occur? If existence can't be vague, Organicism fails just like Contact.
      *   **The Defense (Petra):** Petra needs to argue that "Life" isn't a semantic vagueness but an ontological primitive or a "joint in nature." It's not about our *concept* of life, but the *fact* of causal unity. She needs to distinguish between epistemic vagueness and ontic vagueness.
      *   **The Counter-Attack (Petra):** Turn to Universalism. The Trout-Turkey. What *is* that object? It has no causal unity. It's ontological junk.
