      *   *Option 2: Proportional Split.* ($1800/$3100 = ~58%). Denise gets ~$700, Marcus ~$520, Priya ~$580. Similar issues to equal split.
      *   *Option 3: Prioritize based on "Preventing Catastrophe" (The User's intuition).*
          *   Denise's situation involves a cascade risk: No car -> No job -> No rent -> No home. This is an existential threat to her stability.
          *   Marcus's situation is acute suffering and work performance, but less likely to cause immediate homelessness.
          *   Priya's situation is emotional/social burden. While deeply important, the financial burden of a funeral, while stressful, usually doesn't threaten immediate housing/employment stability in the same way (though this is an assumption, it's a standard triage heuristic).
          *   *Decision:* Prioritize Denise (Job/Housing security), then Marcus (Health/Work ability), then Priya (One-time expense).
          *   *Proposed Split:*
              *   Denise: $1,200 (Full request). Secures job and home.
