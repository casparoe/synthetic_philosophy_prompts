          *   Priya: Low leverage (financially). Money helps with costs, but doesn't prevent a spiral.
      *   **The Recommendation:** Specific numbers.
      *   **Addressing the Objection:** Explicitly state: "We are not saying Priya's loss matters less. We are saying our limited dollars stop a fire better here than there."
      *   **Closing:** Call to action for Friday.

