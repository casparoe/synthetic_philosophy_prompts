              *   *Let's look at the "Compare Suffering" objection.* The memo needs to acknowledge that we *aren't* comparing the *value* of their pain, but the *leverage* of the funds.
              *   *Final Decision for Memo:* Denise $1,200. Marcus $600. Priya $0. (This is the most decisive "Impact" stance).
