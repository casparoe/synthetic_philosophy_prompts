              *   *Rationale:* This maximizes the prevention of cascading hardship.
              *   *Wait, one more consideration:* Is there a way to give Priya something without sacrificing Denise? No, math is math.
              *   *Okay, I will write the memo advocating for an Impact-Based Triage approach.*

  3.  **Drafting the Memo - Section by Section:**
      *   **Header:** Standard Memo format.
      *   **Opening:** Acknowledge the difficulty. Validate the "Equality" argument (it comes from a good place).
      *   **The Core Argument:** Distinguish between "Comparing Suffering" (which is hard) and "Comparing Impact" (which is necessary).
