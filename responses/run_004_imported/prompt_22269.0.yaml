  I am a retired experimental physicist who, since leaving the lab, has been working through the classical sources in philosophy of mind. Rereading Turing's 1950 paper "Computing Machinery and Intelligence" last month, I was struck by the ninth and final objection he considers, the Argument from Extrasensory Perception: Turing declares the statistical evidence for telepathy "overwhelming," calls the objection "quite a strong one," and proposes housing the human and machine contestants in a "telepathy-proof room" so the game stays fair. Having spent a career worrying about systematic error and significance thresholds, I find I cannot simply file this away as a period curiosity.

