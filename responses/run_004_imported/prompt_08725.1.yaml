          *   *Key Distinction:* For Hume, "A causes B" is never strictly true in a necessary sense. For Ghazālī, "God causes B at the occasion of A" is strictly true and necessary (contingent on God's will, but real). Ghazālī preserves miracles (disruption of habit) without denying God's power. Hume denies miracles based on uniform experience.

      *   **Point 2: *ʿĀda* (Habit) vs. Custom:**
          *   *Hume's Custom:* Psychological mechanism. Explains *why we believe* in causation. It's subjective.
