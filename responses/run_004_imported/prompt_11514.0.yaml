answer: |-
  **The Zero Branch**

  The basement of the physics building smelled of ozone and stale coffee. It was 3:17 AM. On the steel table sat the Apparatus: a black box roughly the size of a toaster, wired to a heavy-duty solenoid aimed at a sandbag, and a fiber-optic cable running to a single atom of tritium trapped in a magnetic field.

  The protocol was simple. Every sixty seconds, the spin of the tritium nucleus would be measured along the z-axis. If spin-up, the circuit remained open. If spin-down, the capacitor discharged. A lethal voltage, instant and painless. Or so the literature claimed.

  Elara sat in the chair before the table. She wore a hairnet and a grim smile.

  "You don't have to watch," she said, not looking up from the voltmeter.

  "I'm not watching the gun," Julian said, leaning against the doorframe. He was older than Elara, his tenure secure enough to allow him the luxury of orthodoxy. "I'm watching a colleague walk into a statistical woodchipper."

  "It's not a woodchipper, Julian. It's a filter."

  Silas sat in the corner, arms crossed. He hadn't spoken in twenty minutes. He was the quietest of the three, a man who believed the universe was a clockwork mechanism disguised as a casino.

  "Elara," Julian said, pushing off the doorframe. "Let's state the case one last time. You are operating under the Everett interpretation. You believe the wavefunction never collapses. You believe that upon measurement, the universe branches. In one branch, the nucleus decays, the current flows, and you die. In the other, it doesn't, and you live."

  "Correct."

  "And your claim is that because a branch exists where you survive, your conscious experience *must* follow that branch."

  "My conscious experience is a physical process substrate-dependent on my brain state," Elara recited. "A dead brain supports no experience. Therefore, the only first-person perspective available to me is the one where the brain continues to function. From my point of view, survival isn't probable. It's certain."

  Julian rubbed his temples. "This is where you lose the plot. You're treating the wavefunction as a physical object that carries you along all paths. It isn't. It's a catalog of potentials. When the measurement happens, nature *chooses*. The Born rule isn't a map of where you go; it's the law of what becomes real. The other possibility doesn't wait for you in a parallel world. It vanishes. It becomes nothing."

  "So you deny the unitary evolution," Elara said.

  "I deny that it applies to macroscopic objects without a cut," Julian snapped. "There is a measurement. There is a collapse. There is a 50 percent chance that in one minute, you are a corpse. If you pull this lever ten times, your chance of survival is one in a thousand. If you pull it a hundred times, it is effectively zero. You are betting your life on a miracle."

  "Not a miracle," Elara said. "A certainty."

  "Julian is wrong, but not for the right reason," Silas said from the corner. His voice was low, gravelly. He stood up and walked to the table, keeping his distance from the Apparatus.

  Elara looked at him. "Enlighten me, Silas."

  "Julian thinks the future is open," Silas said, pointing at the black box. "He thinks the universe rolls dice. I don't. The particle has a position. It always has a position. The wavefunction is real, yes, but it's a pilot wave. It guides the particle. The particle is either going to decay or it isn't. That fact is already determined by the initial configuration of the universe. We just don't know it."

  "So you agree I might die," Elara said.

  "I agree that *you*—the specific configuration of particles that makes up Elara—have one future," Silas corrected. "There are no other branches for you to occupy. The wavefunction might split, mathem speaking. The 'empty wave' might go off into the void. But there are no particles there. No atoms. No neurons. No *you*. You are the particles. If the particles in the detector trigger the current, you die. If they don't, you live. There is no multiverse of Elaras. There is only this one, walking a single, narrow path."

  Julian threw his hands up. "So we agree! She dies or she lives. The odds are 50-50. Elara, listen to us. Whether the probability is ontic, like I say, or epistemic, like Silas says, the result is the same. You are playing Russian Roulette with a quantum revolver."

  "The result is not the same," Elara said softly. She placed her hand on the manual override lever. "If Julian is right, and I die, then I cease to exist. Full stop. If Silas is right, and I die, I cease to exist. Full stop. But if *I* am right, then the version of me that dies is a distinct entity from the version of me that speaks to you now. I will not experience death. I will only experience the click."

  "You won't experience the click either, if the voltage hits you before the neural signal processes the sound," Silas said.

  "Semantics."

  "Ontology," Silas corrected.

  "Time," Julian said, checking his watch. "Thirty seconds to the next window."

  Elara took a deep breath. She didn't look afraid. That was the most unsettling part. She looked like someone about to step through a doorway they had walked through a thousand times before.

  "Think about what you're asking us to witness," Julian said, his voice dropping. "If you're right, then every time you do this, you are pruning yourself from our reality. You stay alive in your branch, but to us, you are subjectively immortal only as long as we share a branch with you. Eventually, the measure of the branch where we are both alive and you are unharmed becomes vanishingly small. You might survive, Elara, but you'll be alone. You'll outlive us all. Is that what you want? To be a ghost in your own world?"

  "If I'm right, the world is bigger than you think," Elara said.

  "If you're right," Silas said, "then you are misunderstanding what 'you' are. You think consciousness rides the wave. It doesn't. It rides the configuration. If the configuration is destroyed, the ride is over. Don't confuse the map for the terrain."

  "Ten seconds," Julian warned.

  Elara's finger tightened on the lever. The hum of the equipment seemed to grow louder, filling the silence between the three of them.

  "Julian believes I am gambling," Elara said. "Silas believes I am uncovering a hidden fact. I believe I am navigating."

  "Five seconds."

  "If you die," Julian said, and for the first time he sounded desperate, "there is no coming back. The collapse is final."

  "If you die," Silas said, "the trajectory ends. There is no continuation."

  "If I die," Elara said, "I won't know it."

  She pulled the lever.

  There was a sharp *clack* from the solenoid. The light on the console blinked green. No discharge.

  Elara exhaled, a long, shuddering sound. She looked at her hands, then at her colleagues.

  "Round one," she said.

  Julian let out a breath he seemed to have been holding for a minute. He ran a hand through his hair. "Fifty percent. It was fifty percent. You got lucky. That's all that was."

  "The particle was in the up state," Silas said, staring at the box. "It was always in the up state. We just didn't know."

  "It was in a superposition," Elara countered, her voice trembling slightly now, the adrenaline hitting. "And I am in the branch where it resolved up. Which means the conditions are set for Round Two."

  "Stop," Julian said. "You proved nothing. One trial means nothing."

  "It means the branch exists," Elara said. She reached for the reset switch.

  "Elara," Silas said. He stepped forward, not to stop her, but to look her in the eye. "In my view, you just walked past a mine that didn't explode. The ground is still mined. In Julian's view, you flipped a coin and it landed heads. The next flip is independent. But in your view... in your view, the coin *must* land heads forever, for you to keep seeing it."

  "Yes."

  "Then you are trapped," Silas said. "If you are right, you cannot choose to stop. Because there is no branch where you choose to stop and live. If you try to stop, you will find yourself forced to continue, or you will die. You've traded free will for immortality."

  Elara paused. Her hand hovered over the reset switch.

  "Or," she said, "I am free, and I choose to verify the nature of reality."

  "You're verifying that you're willing to kill yourself to win an argument," Julian muttered. He turned toward the door. "I'm not watching Round Two. When you die, I want to be able to say I wasn't complicit in a suicide pact."

  "Julian," Elara said.

  He stopped, back to her.

  "If I'm right," she said, "you never see me die. You just stop seeing me. One day, I'll be here, and then I'll be... elsewhere. You'll think I left. Or died mysteriously. But I'll know."

  "That's not comforting," Julian said. He opened the door. "Silas?"

  Silas looked at the Apparatus, then at Elara. He didn't move to leave. He pulled a notebook from his pocket and uncapped a pen.

  "I want to record the initial conditions," Silas said quietly. "If she survives ten thousand trials, the probability in my model is $1$ in $2^{10000}$. It is effectively impossible. If it happens, my model is broken. If she dies, hers is."

  "And if I survive?" Elara asked.

  "Then I will have to calculate the trajectory of a ghost," Silas said.

  Julian left. The door clicked shut. The lock engaged.

  Elara looked at the timer. Twenty seconds to the next window.

  "Are you staying?" she asked Silas.

  "Someone has to witness the configuration," he said. He didn't look up from his notebook. "Don't think I'm on your side, Elara. I'm just checking the math."

  She placed her hand on the lever again. The metal was cold. She thought about Julian's fear, Silas's determinism, and her own infinite corridor of survival. She wondered, for a fleeting second, if the version of her that died felt pain, or if the cut was truly clean.

  "Ten seconds," Silas said.

  Elara closed her eyes. She didn't pray. She didn't hope. She simply prepared to update her location.

  "Five."

  She gripped the lever.

  "Three."

  She wondered if the sound of the click would be different in the branch where she died.

  "Two."

  "See you in the morning, Silas," she said.

  "One."

  She pulled.

  The hum of the ventilation system seemed to swallow the sound of the mechanism. Silas didn't look up from his notebook. He just kept writing, the scratch of the pen the only sound in the room, marking time in a universe that might be singular, or might be splitting, or might be collapsing, waiting for the light on the console to turn either red or green.

  The light flickered.

  Silas stopped writing. He looked up.

  "What?" Elara asked. Her voice sounded strange. Distant.

  Silas stared at the console. He stared at Elara. He looked back at the console.

  "The light," Silas said.

  "What about it?"

  "It didn't change," he said.

  Elara looked. The light was yellow. A standby color. Not green. Not red.

  "That's not part of the protocol," Elara said.

  "No," Silas said. He stood up slowly. "It isn't."

  The hum of the ventilation stopped. The silence that rushed in was heavy, absolute. Outside the basement, the city lights flickered and went dark, one by one, like stars being snuffed out by a wet thumb.

  "Did we..." Elara started, but her voice had no echo.

  Silas looked at his pen. The ink was frozen in the nib. He looked at Elara. She was still reaching for the lever, her expression caught between anticipation and confusion.

  "Elara," Silas said. "In my model, the particles move."

  "And in mine," Elara said, "the wave evolves."

  "Neither of those," Silas said, watching the dust motes hang suspended in the air between them, "accounts for the experiment stopping."

  Elara tried to pull the lever. It didn't move. It wasn't locked; it simply offered no resistance, and no purchase. Her hand passed through the metal as if it were smoke.

  She looked at Silas. He was fading, not like a ghost, but like a sketch being erased.

  "Which branch is this?" Elara asked.

  Silas looked at her, his eyes sad. "I don't think," he said, his voice thinning, "that we're in a branch anymore."

  The console went dark. The only light left was the glow of the tritium in the trap, burning steady, undecayed, waiting for a universe that had forgotten how to choose.
