      *   *The New Problem:* Now, what does "Rationality" mean? If I pass at Node 1, am I irrational, or just maximizing differently? If we allow for irrationality, BI is no longer the *unique* solution. We might get cooperation.
      *   *Pettit & Sugden's Critique:* They often argue that these fixes change the subject. They move from "What does CKR imply?" to "What does CKR + small probability of error imply?" The paradox reveals that pure CKR is incompatible with extensive form reasoning where off-path behavior matters.

