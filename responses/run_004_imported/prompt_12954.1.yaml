  2.  **Deconstruct Kavka's Toxin Puzzle:**
      *   *The Setup:* A billionaire offers you $1 million if, at midnight tonight, you *intend* to drink a nasty toxin tomorrow at noon.
      *   *The Catch:* The money is deposited in the morning based on the intention. You don't actually have to drink the toxin to keep the money.
      *   *The Paradox:* If you know you won't drink it (because there's no incentive once you have the money), you can't sincerely intend to drink it. If you can't intend it, you don't get the money.
      *   *The Core Insight:* It's about commitment, trust, and the rationality of binding oneself to a future action even when immediate incentives change. It's about the value of "irrational" commitment in relationships.

  3.  **Bridge the Puzzle to Marriage:**
      *   *Marriage Parallel:* Marriage is essentially a binding commitment to stick around even when the "incentives" might fluctuate (sickness, hard times, boredom).
      *   *The "Toxin":* Life's difficulties, sacrifices, the hard stuff.
      *   *The "Intention":* The vow.
      *   *The Twist:* In the puzzle, the intention is impossible because it's purely transactional. In marriage, the intention *becomes* possible because the relationship changes the incentives. You *want* to drink the toxin (make the sacrifice) because you love the person. Or, more accurately, marriage is the solution to the puzzle: it creates a structure where intending the hard thing is rational.
      *   *Better Angle:* Marriage is about making a promise where the "payoff" isn't the avoidance of pain, but the shared life. It's about resolving the paradox through love/trust.
