      *   **The Turn to Marriage:** How does this relate to [Couple]? Marriage looks like the puzzle from the outside. You promise to stick around "in sickness and health."
      *   **The Resolution:** In the puzzle, you can't win alone. It's a paradox of individual rationality. In marriage, you win *together*. The "toxin" (hard times) doesn't matter as much because you aren't alone. The commitment changes the payoff structure.
      *   **The Compliment:** Specific traits of the couple that show they solve this puzzle. They don't calculate; they commit.
      *   **The Toast:** Raise a glass.

