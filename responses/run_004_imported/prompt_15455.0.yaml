      *   *Role of the State:* To stamp and certify the weight, not to assign arbitrary value.
      *   *Consequences of Debasing:* If you lower silver content but keep face value, prices rise (inflation), trade suffers, and wealth is redistributed arbitrarily. It's a breach of contract/property rights.
      *   *Underlying Assumption:* Value is objective and rooted in physical scarcity. Money is a measure of value, like a ruler is a measure of length (you don't change the inches on a ruler).

  3.  **Deconstruct Berkeley's Position:**
