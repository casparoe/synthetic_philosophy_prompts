answer: |-
  Elias tapped the face of his wrist-comp, the *Mnemosyne*. It woke instantly, displaying the day's agenda in crisp haptic text against his skin. For five years, the device had satisfied every condition Clark and Chalmers laid out for the extended mind. It was always on his wrist (constant availability). It unlocked with a pulse (easy access). Every entry had been typed and confirmed by him personally (past endorsement). Most importantly, he never questioned the data. When the *Mnemosyne* said "Meeting at 2," Elias didn't think, "The device says 2"; he thought, "I have a meeting at 2." The information was automatically trusted, functioning exactly like biological recall. The *Mnemosyne* wasn't a tool; it was part of his cognitive architecture.

  Today, Elias needed to meet his sister at the art gallery. He was running late. He didn't panic; he simply queried the *Mnemosyne*. His thumb swiped the interface. *Gallery Entrance B, 3:00 PM.*

  He began to walk, his feet moving on autopilot. In his mind, the location was fixed. He was functionally equivalent to Inga, who would simply recall the address from biological neurons. Elias's neurons extended into the silicon on his wrist. The glue held.

  Then, a chime. A red notification pulsed against his skin.

  *SYSTEM ALERT: Sync Conflict Detected. Entry #4092 modified by external source. Verification Required.*

  Elias stopped. The crowd flowed around him. He looked at the text on his wrist. *Gallery Entrance B.* It looked the same as it had ten seconds ago. But the context had shifted. The condition of automatic trust was severed.

  Previously, retrieving the information was transparent. He looked *through* the device to the fact. Now, he was looking *at* the device as an object separate from himself. The alert introduced a gap between the data and his belief. He could no longer simply endorse the information upon retrieval. The "glue" had dissolved.

  He stood on the sidewalk, paralyzed not by a lack of information, but by a lack of cognitive integration. If this were biological memory, a doubt like this would be akin to realizing you might be dreaming. You cannot act on the memory until the reliability is restored.

  Elias raised his other hand to call his sister. This action confirmed the retraction of his mind. If the *Mnemosyne* were still part of his cognitive system, calling her would be redundant, like checking your memory by asking your memory again. But now, the *Mnemosyne* was merely an external source, like asking a stranger on the street. He had to cross-reference the device against another external source to establish truth.

  "Hey, it's Elias," he said when she picked up. "I'm looking at my schedule, but I got a glitch. Are we at Entrance B?"

  "Entrance A," she said. "I texted you an update this morning."

  Elias frowned. He hadn't seen the text. He hadn't endorsed the update. But more importantly, even if he had seen it, the *Mnemosyne* had failed the trust condition. The system required him to critically scrutinize the data before acting. By Clark and Chalmers' logic, the moment he had to verify the entry, the *Mnemosyne* ceased to be part of his mind. It was just a notebook again.

  "Okay," Elias said. "Entrance A. I'm coming."

  He lowered his arm. The *Mnemosyne* still displayed *Entrance B*. Before the alert, that text would have dictated his movement instantly. Now, it was just ink on a page, irrelevant noise. He walked toward Entrance A, relying on the conversation he just had, which was now stored in his biological brain.

  The tragedy wasn't that the device was broken; the interface still worked perfectly. The tragedy was epistemological. The *Mnemosyne* remained available, accessible, and originally endorsed by him. But without automatic trust, the coupling was broken. He felt smaller, somehow. His world had shrunk back inside his skull. He tapped the screen one last time to dismiss the alert, treating the device with the suspicion one accords a liar, not a memory. He walked alone, his mind no longer extended.
