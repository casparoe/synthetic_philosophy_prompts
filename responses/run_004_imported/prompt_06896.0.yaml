      *   *Best idea for Trust:* He finds out someone else has been editing it. If he knows someone else edited it, he can no longer *automatically endorse* it as his own belief. He has to verify it.
      *   *Alternative:* The prompt asks to break *one* condition so it *stops counting*.
      *   Let's try breaking **Constant Availability**. He leaves it behind. But that's boring.
      *   Let's try breaking **Automatic Endorsement**. He gets a notification that the data might be corrupted. Now he hesitates.
      *   Let's try breaking **Past Endorsement**. New info appears that he didn't endorse. But the prompt says the thing *stops* counting. If *some* info isn't endorsed, does the whole thing stop counting? Maybe.
