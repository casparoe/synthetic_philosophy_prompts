      *Wait, let's look closer at the prompt:* "something happens that breaks just ONE of those conditions... make it clear in the story which condition breaks."
      *   If I break "Trust," the character must consciously stop trusting it.
      *   If I break "Access," it becomes hard to use.
      *   If I break "Availability," he doesn't have it.
      *   If I break "Endorsement," the info isn't his.

      *Decision:* I will break the **Automatic Trust** condition. This is the most philosophically rich. If you have to verify the notebook, it's like asking another person, not like recalling memory.
      *   *Setup:* Elias relies on his "CipherPad" for his schedule and facts. It meets all criteria.
      *   *Inciting Incident:* He gets a security alert. "Potential Unauthorized Edit Detected."
      *   *Result:* He looks at the address. He *wants* to go there, but now he hesitates. He has to cross-reference. The transparency is gone. The Pad is now an external tool, not part of his mind.

  4.  **Drafting - Section by Section:**
      *   **Intro:** Establish Elias and the CipherPad. Show, don't just tell, the 4 conditions. He carries it (Availability), flips open instantly (Access), believes it immediately (Trust), wrote the entries himself (Endorsement).
      *   **Middle:** The routine. He needs to get to the Museum of Modern Art. He checks the Pad. It says "Meet at MoMA, 2 PM."
      *   **The Turn:** A notification pops up. "Integrity Compromised. Entry #402 flagged."
      *   **The Break:** He looks at the entry. He realizes he can't just *know* it's true anymore. He has to call his friend to verify. The cognitive process changes from *recall* to *verification*.
      *   **Conclusion:** He realizes the Pad is now just a notebook, not his memory. The mind has retracted.

  5.  **Refining the Word Count and Philosophy:**
      *   Need to ensure the distinction is sharp. Inga (biological) just remembers. Otto (extended) uses the book. If Otto doubts the book, he's no longer functionally equivalent to Inga.
      *   Word count target: ~700.
