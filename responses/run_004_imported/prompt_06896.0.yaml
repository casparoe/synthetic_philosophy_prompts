prompt: |-
  ok so in my philosophy elective we just read the Clark and Chalmers piece on the extended mind (the Otto and Inga thing with the notebook) and for our final project we have to write a short story that actually engages with their argument instead of just doing a generic "my phone is basically my brain" story. can you write one for me (maybe 700ish words)? it needs a character whose notebook/phone/whatever genuinely meets all four of the "trust and glue" conditions they give for why Otto's notebook counts as literally part of his mind — its always with him, easy to check, he trusts what it says without double-checking, and he endorsed the info in it himself at some point in the past. then partway through the story something happens that breaks just ONE of those conditions, so that by Clark and Chalmers own logic the thing stops counting as part of his mind anymore. make it clear in the story which condition breaks and why, not just vague "technology and memory" vibes.
