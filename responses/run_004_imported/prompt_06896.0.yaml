  2.  **Recall Clark & Chalmers' Criteria (The "Trust and Glue" Conditions):**
      *   Actually, C&C (1998) specify three main conditions for the external vehicle to count as part of the cognitive system (often summarized as four in later discussions or classrooms):
          1.  Constant availability (typically carried around).
          2.  Easy access (directly accessible without difficulty).
          3.  Automatic endorsement (information retrieved is automatically trusted, not subject to critical scrutiny each time).
          4.  Past endorsement (the information was consciously endorsed by the agent at some point).
