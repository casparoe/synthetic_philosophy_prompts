answer: |-
  Good evening, everyone. For those who don't know me, I'm Elena's sibling. It is a profound honor to stand here and say a few words about my sister and her new husband.

  Now, anyone who knows Daniel knows that he takes truth seriously. Specifically, he takes metaphysical truth seriously. When Elena asked me to give this toast, she gave me one guideline: it had to be sentimental. Daniel gave me another: it had to be true. And given that Daniel wrote his senior thesis on David Lewis's modal realism, I realized quickly that I had to walk a very specific line.

  For the half of the room currently checking their watches: don't worry. I'm not going to give a lecture. But for the other half of the room currently checking for modal errors: I promise I'm being careful.

  You see, in a standard wedding toast, I would be expected to say that Elena and Daniel were "meant to be." I would say that they beat the odds, that destiny brought them together, or that they are "the one" for each other in some cosmic, universal sense. But if I said that, Daniel would be obligated to correct me during the cake cutting. And nobody wants that.

  On Daniel's view—and he's right about this—"Actual" is just an indexical term. It's like saying "here" or "now." There are other places besides "here," and other times besides "now," and they are all real. In the grand scheme of things, there is no magic spotlight picking out this specific world as the only one that matters. There are countless other worlds, just as real as this one, where counterparts of Elena and Daniel never met. Where they met but didn't fall in love. Where they fell in love but didn't make it to this Saturday.

  So, if there is no cosmic fate, and no privileged world, why are we here? Why does this moment matter?

  I think the answer lies in that very word: *Here.*

  Just because "there" exists doesn't mean "here" doesn't matter. In fact, it means the opposite. The fact that "actual" is indexical means that significance isn't something found in the stars; it's something created by presence. We are not celebrating a pre-written script that the universe forced upon them. We are celebrating a choice.

  In a multiverse of infinite possibilities, Elena and Daniel are not together because they had to be. They are together because, in *this* world, in *this* location of logical space, they have chosen to build a life that makes the word "actual" mean something beautiful.

  There are worlds where they didn't work out. I'm sure of it. But those worlds are *over there*. They are not *here*. And love, real love, is a local phenomenon. It requires a "here." It requires showing up in this specific world, with all its specific constraints, and deciding that this reality is the one you want to inhabit together.

  To the relatives in the back: What this means, in plain English, is that their love isn't special because it was inevitable. It's special because it is fragile, and contingent, and chosen. It is a triumph of the specific over the general.

  To Daniel: You teach us that all worlds are real. But Elena has taught you, and all of us, that not all worlds are *home*. Home is an indexical too. It's wherever you are together.

  So, I am not going to wish you luck, because luck implies a roll of the dice that has already happened across the multiverse. Instead, I will wish you presence. May you continue to look at this world, with all its alternatives fading into the background, and say, "This is where I want to be." May you continue to make this indexical location—the "here" and the "now"—the most vibrant, kind, and loving world possible.

  Please raise your glasses. To Elena and Daniel: May your actual world be the only one that matters to you, for as long as you live.

  To Elena and Daniel!
