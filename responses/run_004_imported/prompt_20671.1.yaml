      *   The "test" they are looking for (a neutral algorithm to separate truth from bias) likely doesn't exist in the way they hope.
      *   *Key Concept:* Reflective Equilibrium. We test intuitions against principles and other intuitions, not against an external "bias detector."
      *   *Key Concept:* Epistemic Humility vs. Moral Commitment.
