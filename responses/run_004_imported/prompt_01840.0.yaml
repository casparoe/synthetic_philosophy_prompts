      *   *Character B (The Stalnaker Critic):* Let's call him **Marcus**. He focuses on epistemic logic, belief revision, and the semantic meaning of "knowledge" when contradictions arise. He cares about what happens *if* the game deviates.

  3.  **Setting the Scene:**
