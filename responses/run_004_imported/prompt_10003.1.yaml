prompt: |-
  I am teaching a graduate seminar this term on Quine's philosophy of language, and we have just worked through the chapter on radical translation in *Word and Object* alongside the earlier essay "Two Dogmas of Empiricism." A disagreement broke out in our last session that I would like some outside perspective on before we meet again. Several students maintain that the indeterminacy of translation thesis — illustrated by the gavagai case, where rival translation manuals for a native speaker's utterances can fit all possible behavioral evidence equally well without agreeing on what any given sentence means — is really nothing more than a special instance of the underdetermination of theory by evidence that Quine had already defended through confirmation holism and what is now called the Duhem-Quine thesis. On this reading, once you grant that no finite body of evidence ever fixes a unique theory, indeterminacy of translation simply falls out as soon as that general epistemological point is applied to the domain of meaning and reference. Other students, leaning on the objections Quine faced from critics such as Chomsky and Putnam, insist that this runs together two genuinely different claims, and that Quine himself resisted treating indeterminacy of translation as just another case of ordinary underdetermination.

  I would like your help settling this for the class. Please compare Quine's indeterminacy of translation with the underdetermination of theory by evidence, and spell out as precisely as you can in which respects, if any, indeterminacy of translation is a stronger or otherwise distinct thesis rather than a mere application of ordinary underdetermination to the domain of language. In particular, please address the "no fact of the matter" language Quine reserves for translation: is an analogous claim available, or even coherent, for underdetermined physical theories, and if not, what exactly keeps the two cases apart? I would like an answer detailed enough that I could turn it directly into a handout, since a couple of my sharper students are sure to press on any point where the distinction is merely asserted rather than actually demonstrated.
reasoning: |-
  Here's a thinking process that leads to the suggested handout:

  1.  **Analyze the Request:**
      *   **Context:** Graduate seminar on Quine's philosophy of language (*Word and Object*, "Two Dogmas").
      *   **Problem:** Student disagreement on the relationship between the Indeterminacy of Translation (IT) and the Underdetermination of Theory by Evidence (UTE).
      *   **Positions:**
          *   Group A: IT is just a special case of UTE (applied to linguistics/meaning).
          *   Group B: IT is distinct from/stronger than UTE (Quine resisted conflating them).
      *   **Task:** Compare IT and UTE, explain distinctions (if any), address the "no fact of the matter" claim, and determine if IT is stronger/distinct.
      *   **Format:** Detailed enough to be turned directly into a handout for graduate students.
      *   **Tone:** Academic, precise, nuanced, suitable for a graduate seminar.

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Quine's View:* Quine explicitly distinguishes IT from UTE. He calls IT "more startling."
      *   *UTE (Duhem-Quine Thesis):* Scientific theories are underdetermined by data. Multiple theories can fit the evidence. However, there *is* a fact of the matter about the world; we just can't know which theory is true. Realism is compatible with UTE.
      *   *IT (Radical Translation):* Multiple translation manuals fit all behavioral evidence. Crucially, Quine claims there is *no fact of the matter* regarding which manual is correct. Meaning isn't just unknowable; it's indeterminate.
      *   *Key Distinction:* Epistemological (UTE) vs. Ontological (IT).
      *   *Critics:* Chomsky (IT is false/absurd), Putnam (model theoretic arguments), Davidson (coherence theory).
      *   *Structure of the Handout:*
          1.  Title/Introduction.
          2.  Defining the Theses (UTE vs. IT).
          3.  The Standard Conflation (Why students think they are the same).
          4.  Quine's Distinction (The "No Fact of the Matter" claim).
          5.  Ontological vs. Epistemological.
          6.  The Role of Behaviorism/Physicalism.
          7.  Objections & Counter-arguments (Chomsky/Putnam).
          8.  Conclusion/Seminar Questions.

  3.  **Drafting Content - Section by Section:**

      *   *Introduction:* Acknowledge the sophistication of the question. It's a classic debate in Quine scholarship.
      *   *Definitions:* Need precise definitions.
          *   UTE: For any theory $T$ and evidence $E$, there is a rival $T'$ compatible with $E$.
          *   IT: For any translation manual $M$ and behavioral evidence $B$, there is a rival $M'$ compatible with $B$, *and* there is no fact of the matter to decide between them.
      *   *The Conflation:* Why does it look like UTE? Both involve holistic confirmation, both involve rival systems fitting evidence. Linguistics looks like a science.
      *   *The Crucial Distinction:* This is the core.
          *   UTE = Ignorance. There is a truth, we can't reach it.
          *   IT = Non-existence. There is no truth to be had about meaning (beyond behavior).
          *   Quote Quine: "Underdetermination... leaves the world unchanged; indeterminacy... denies the status of fact."
      *   *Why the Distinction?* Quine's Behaviorism/Physicalism.
          *   Physics describes the world. Meaning is not part of the fundamental furniture.
          *   "Meaning" is a derivative notion. If behavior fixes everything physical, and behavior doesn't fix meaning, then meaning isn't real.
          *   In physics, we assume there *is* a physical reality beyond the evidence. In semantics, behavior *is* the reality.
      *   *Gavagai vs. Physics:*
          *   Physics: Electrons exist even if we can't distinguish between two theories about them.
          *   Gavagai: "Rabbit" vs. "Undetached rabbit part." If behavior doesn't distinguish, there is no *fact* about what the native means.
      *   *Critics:*
          *   Chomsky: IT implies skepticism or behaviorism that is too strong. He thinks there *are* facts (mental states).
          *   Putnam: Model theoretic arguments suggest reference is magical or indeterminate everywhere (model theoretic argument), but Quine wants to save physics.
      *   *Scholarly Consensus:* Most agree Quine intended a strong distinction. The debate is whether he was *justified* in making it.

  4.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to be careful not to say Quine *succeeded* in proving the distinction, but rather that he *claimed* it and argued for it. The prompt asks to settle the disagreement based on Quine's philosophy, but also acknowledges critics.
      *   *Nuance:* Is IT *just* UTE applied to linguistics? Quine says no. Linguistics is not like physics in this regard. Physics has an ontology; linguistics (semantics) does not, on Quine's view.
      *   *Key Phrase:* "Epistemological vs. Ontological." This is the standard shorthand. I need to unpack it.
      *   *Handout Style:* Needs clear headings, bullet points for readability, but dense enough for grad students. Include primary text references (*Word and Object*, "On the Reasons for the Indeterminacy of Translation").

  5.  **Final Review against Prompt:**
      *   Compare IT and UTE? Yes.
      *   Spell out respects in which IT is stronger/distinct? Yes (Ontological claim).
      *   Address "no fact of the matter"? Yes, this is the centerpiece.
      *   Is analogous claim coherent for physics? Quine says no. Explain why.
      *   Detailed enough for a handout? Yes.

  6.  **Writing the Handout:** (Mental Draft -> Final Polish)
      *   Start with a clear thesis statement.
      *   Use bold text for key concepts.
      *   Include a section on "Why the Confusion Arises" (validating Group A).
      *   Include a section on "Quine's Rebuttal" (validating Group B).
      *   Add discussion questions to facilitate the seminar.

      *(Self-Correction during drafting)*: Make sure to mention *Word and Object* §12 vs. later essays where Quine clarifies the distinction (e.g., "On the Reasons for the Indeterminacy of Translation" 1970). Quine realized people were conflating them and wrote specifically to distinguish them. This is crucial evidence for Group B.

      *(Refining the Physics Analogy)*: In UTE, we assume the world is one way, but our maps differ. In IT, Quine argues the "territory" of meaning doesn't exist independently of the "map" of behavior.

      *(Final Polish)*: Ensure the tone is neutral but authoritative, suitable for a professor to distribute.

  7.  **Final Output Generation** (Proceeding to generate the response based on these thoughts).
answer: |-
  **SEMINAR HANDOUT: INDETERMINACY VS. UNDERDETERMINATION**
  **Course:** Graduate Seminar on Quine's Philosophy of Language
  **Topic:** The Relation Between the Indeterminacy of Translation and the Underdetermination of Theory
  **Primary Texts:** *Word and Object* (§12–13); "On the Reasons for the Indeterminacy of Translation" (1970); "Two Dogmas of Empiricism"

  ---

  ### 1. The Core Disagreement
  In our last session, a division emerged regarding the logical status of Quine's **Indeterminacy of Translation (IT)**.
  *   **Position A (Reductionist):** IT is merely a specific application of the **Underdetermination of Theory by Evidence (UTE)** to the field of linguistics. If all theories are underdetermined, translation manuals (as theories of meaning) must be too.
  *   **Position B (Distinctness):** IT is a stronger, ontologically distinct thesis. Quine explicitly resisted conflating the two, arguing that UTE leaves reality intact while IT denies the existence of specific semantic facts.

  **The Task:** To determine whether IT is simply UTE applied to language, or whether it entails a unique philosophical claim about the nature of meaning.

  ---

  ### 2. Defining the Theses

  #### A. Underdetermination of Theory by Evidence (UTE)
  *   **The Claim:** For any consistent formulation of a scientific theory $T$ and any body of empirical evidence $E$ compatible with $T$, there exists a rival theory $T'$ that is logically incompatible with $T$ but equally compatible with $E$.
  *   **The Status of Truth:** UTE is an **epistemological** thesis. It claims we cannot *know* which theory is true based on evidence. It does **not** deny that one theory is actually true. There is a "fact of the matter" regarding the physical world; we simply lack the evidence to discern it.
  *   **Quine's Commitment:** Quine accepts UTE for natural science (physics, etc.). He remains a scientific realist regarding physics: there is a physical world, even if our theories about it are underdetermined.

  #### B. Indeterminacy of Translation (IT)
  *   **The Claim:** For any manual of translation $M$ relating a source language to a target language, and any body of behavioral evidence $B$ (stimulus meanings), there exists a rival manual $M'$ compatible with $B$ that yields incompatible translations for certain sentences (e.g., *Gavagai* = "Rabbit" vs. "Undetached rabbit part").
  *   **The Status of Truth:** IT is an **ontological** thesis. Quine claims there is **no fact of the matter** as to which manual is correct. It is not that we cannot know the meaning; it is that meaning (as distinct from behavior) does not exist to be known.
  *   **Quine's Commitment:** Quine accepts IT for semantics. He is an anti-realist regarding *meanings*, *propositions*, and *reference* (in isolation from behavior).

  ---

  ### 3. Why the Confusion Arises (The Case for Position A)

  Students arguing for Position A are correct to notice deep structural similarities. Quine derives IT using the same methodological tools he uses for UTE:

  1.  **Confirmation Holism:** In both cases, sentences/theories do not face the tribunal of experience alone but as a corporate body.
  2.  **Behavioral Constraints:** Both scientific theories and translation manuals must ultimately answer to sensory evidence (observation sentences/stimulus meanings).
  3.  **Infinite Rivals:** In both cases, one can construct infinitely many systems (theories or manuals) that save the phenomena.

  **The Reductionist Argument:**
  If physics is underdetermined, and linguistics is a science, then linguistics is underdetermined. If "meaning" is just a theoretical posit within linguistics, then "indeterminacy" is just the label we give to underdetermination in this specific domain. On this reading, "no fact of the matter" is merely rhetorical flair for "no *discoverable* fact."

  ---

  ### 4. Quine's Distinction (The Case for Position B)

  Quine explicitly addressed this conflation in later essays (most notably "On the Reasons for the Indeterminacy of Translation," 1970), insisting that IT is "more startling" than UTE.

  #### A. Epistemology vs. Ontology
  *   **UTE (Physics):** Suppose two physical theories posit different entities (e.g., particles vs. fields) but predict the same observations. Quine says: *One of them is true, the other false, but we cannot tell which.* The world is one way or the other.
  *   **IT (Semantics):** Suppose two translation manuals translate *Gavagai* differently ("Rabbit" vs. "Rabbit part") and are behaviorally equivalent. Quine says: *Neither is true, neither is false.* There is no objective semantic reality to make one true.

  **Key Quote:**
  > "The indeterminacy of translation is not just an implication of the underdetermination of scientific theory. It is something over and above that... In the case of translation, there is no fact of the matter right or wrong." (*Word and Object*, §12; cf. 1970 essay)

  #### B. The Role of Physicalism
  The distinction rests on Quine's physicalism.
  1.  **Physics:** Describes the fundamental furniture of the universe. Even if underdetermined, we presume physical facts exist independent of our theories.
  2.  **Linguistics/Meaning:** For Quine, there are no "meanings" in the ontology. There are only speakers, sounds, and physical stimuli.
  3.  **The Argument:** If all physical facts (including behavioral dispositions) are fixed, and two translation manuals differ while remaining compatible with all physical facts, then the difference between the manuals corresponds to **nothing in physical reality**. Therefore, the difference is not a real difference.

  In physics, underdetermination implies a gap between *evidence* and *reality*. In translation, indeterminacy implies a gap between *reality* (behavior) and *pseudo-reality* (meaning).

  #### C. Is an Analogous Claim Coherent for Physics?
  Could we say of physics what Quine says of translation: "There is no fact of the matter whether electrons exist"?
  *   **Quine's Answer:** No. To deny facts in physics is to deny the world. To deny facts in semantics is to deny a myth (the myth of meaning).
  *   **Why?** Because for Quine, the only legitimate "facts" are physical facts. Semantics is not fundamental. If semantic facts supervene on physical facts, and the physical facts (behavior) do not determine the semantic facts, then the semantic facts do not exist. Physical facts, however, do not supervene on anything more basic; they are the base.

  ---

  ### 5. Critical Objections (Why Position A Persists)

  Despite Quine's insistence, many critics (including Chomsky, Putnam, and Davidson) argue the distinction is unstable.

  #### A. Chomsky's Objection
  Chomsky argues that Quine's behaviorism is false. If we accept that speakers have internal mental states (a "language of thought" or Universal Grammar), then there *is* a fact of the matter about what *Gavagai* means—it is determined by the speaker's internal cognitive state, even if behavioral evidence cannot access it.
  *   **Implication:** If mental states are real physical/biological states, then IT collapses back into UTE. We just lack the neurological evidence to fix the translation.

  #### B. Putnam's Model-Theoretic Argument
  Hilary Putnam argued that if IT holds for translation, a similar argument should hold for reference in our *own* language (the "model-theoretic argument"). If reference is indeterminate for the native, it is indeterminate for us.
  *   **Implication:** This threatens to make *all* theory underdetermination ontological, not just linguistics. If reference is indeterminate everywhere, then physics is also "no fact of the matter," undermining Quine's scientific realism.

  #### C. The "Linguistics as Science" Problem
  If linguistics is a branch of science (as Quine sometimes suggests), why is it exempt from the realism we grant physics?
  *   **Tension:** Quine wants to naturalize epistemology (make it part of science) but treats semantics as normatively indeterminate in a way physics is not. Critics argue this is an inconsistent dualism.

  ---

  ### 6. Summary Table for Seminar Discussion

  | Feature | Underdetermination (UTE) | Indeterminacy (IT) |
  | :--- | :--- | :--- |
  | **Domain** | Natural Science (Physics, etc.) | Semantics / Translation |
  | **Relation to Evidence** | Evidence insufficient to prove theory. | Evidence insufficient to prove manual. |
  | **Rival Systems** | Incompatible theories ($T_1$ vs $T_2$). | Incompatible manuals ($M_1$ vs $M_2$). |
  | **Fact of the Matter?** | **Yes.** One theory is true. | **No.** Neither manual is uniquely correct. |
  | **Type of Thesis** | Epistemological (about knowledge). | Ontological (about existence of meaning). |
  | **Quine's Realism** | Realist about physical objects. | Anti-realist about meanings/propositions. |
  | **Reason** | Physical world exceeds evidence. | Meaning is nothing over and above behavior. |

  ---

  ### 7. Questions for Further Discussion

  1.  **The Coherence of "No Fact of the Matter":** Is Quine's claim that there is "no fact of the matter" regarding meaning coherent without presupposing a verificationist theory of meaning (which Quine claims to reject in "Two Dogmas")?
  2.  **The Physicalist Basis:** Does Quine's physicalism successfully support the distinction? If mental states are physical states, does IT collapse into UTE?
  3.  **Self-Application:** If indeterminacy applies to radical translation, does it apply to domestic language use? If so, does this undermine the determinacy required for Quine's own philosophical arguments to be understood?
  4.  **Charity:** How does the "Principle of Charity" function in this distinction? Is Charity a methodological tool for resolving UTE, or a constitutive principle that makes IT possible?

  ---

  ### 8. Suggested Reading for Next Session
  *   Quine, W.V.O. "On the Reasons for the Indeterminacy of Translation," *Journal of Philosophy* (1970). [Crucial for Quine's explicit distinction].
  *   Chomsky, Noam. "Quine's Empirical Assumptions," *Synthese* (1968). [The primary critique of the behaviorist foundation].
  *   Davidson, Donald. "On the Very Idea of a Conceptual Scheme," *Proceedings and Addresses of the APA* (1974). [On the coherence of rival manuals].

  ---

  **Instructor's Note:** *When discussing this, ensure students do not treat "no fact of the matter" as skepticism. Skepticism says "There is a truth, but we can't find it." Indeterminacy says "There is no truth to find." This is the pivot point of the entire debate.*
