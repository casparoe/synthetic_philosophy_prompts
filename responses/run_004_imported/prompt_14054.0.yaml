answer: |-
  The clink of Theo's fork against his wine glass stopped the conversation, but not the tension. Claire and Ben sat frozen, forks halfway to their mouths, watching the married couple across the table forget they had guests.

  "You're doing it again," Mara said, her voice low, eyes locked on Theo. "You're weighting the hypothesis by the headcount."

  "It's called Bayesian updating, Mara," Theo said, leaning back, swirling his Pinot. "If you exist, you're more likely to exist in a world where existence is abundant. It's not magic, it's math."

  "It's arrogance," Mara shot back. "You're sitting at a dinner party in 2024 deducing the size of the cosmos because you're uncomfortable with being ordinary. You're the Presumptuous Philosopher, Theo. You always have been. You think because you're here, the universe *must* be big enough to justify you."

  Theo laughed, a sharp, familiar sound. "And you're still betting on the funeral. Admit it. Every time we look at a crowd, you're calculating the expiration date. The Doomsday Argument. You've been carrying that coffin since Princeton. 'Oh, we're likely near the median observer, so humanity must be wrapping up soon.' It's morbid."

  "It's conditioning on information," Mara said, stabbing a carrot. "If humanity expands to the stars, the number of future observers dwarfs us. If I'm a random sample, the odds of me being born *now*, in the infancy, are infinitesimal. The fact that I am here suggests the future population isn't that big. It's not morbid, it's statistical humility."

  "Statistical humility?" Theo leaned forward. "It's a self-fulfilling prophecy. You refuse to believe in a large future because it makes your presence unlikely. I'm willing to accept the likelihood of my presence because I believe in the future."

  "You're willing to accept it because it lets you ignore the prior," Mara said. "You'd believe in a universe with a trillion trillion observers over one with a billion, solely because you exist. You don't need evidence, Theo. You just need a headcount. That's not science, that's solipsism with extra steps."

  "And your view is any better?" Theo's voice rose. Claire cleared her throat softly; neither philosopher noticed. "You walk around acting like we're living in a closing room. It colors everything. The kids, the retirement, the *wine*. You treat every moment like it's sampled from a shrinking set."

  "I treat every moment like it's real," Mara said. "You treat every moment like it's a lottery ticket you've already won because there are too many tickets in the drawer. You want to know why I don't want to buy the vacation home? Because according to your math, the probability of us enjoying it is diluted by every possible version of us that exists in every possible universe. I'm staying in the actual one."

  "The actual one is likely huge!"

  "Prove it without using your own existence as the proof!"

  "I don't have to prove the universe is big to know you're wrong about the doom," Theo said, pointing his fork. "You've never been able to handle the ambiguity of the reference class. You pick the class that makes you feel significant in the narrative of decline. I pick the class that acknowledges the possibility of growth."

  "I pick the class that exists," Mara said. "You pick the class that *could*."

  "Could is where the probability lives!"

  "Could is where the ghosts live," Mara countered. "And you're haunted, Theo. You've been haunted by the possibility of being insignificant since the day we met."

  Theo opened his mouth, then closed it. The silence stretched, heavy and awkward. Ben slowly lowered his wine glass.

  "So," Claire said, her voice an octave too high. "We were thinking of trying that new Italian place next week. Anyone... interested?"

  Mara and Theo blinked, simultaneously returning to the room. They looked at each other, the heat receding into a weary, familiar truce.

  "SSA says we probably won't make it," Mara muttered, picking up her glass.

  "SIA says there's a universe where we already did," Theo replied, pouring more wine. "Pass the bread."
