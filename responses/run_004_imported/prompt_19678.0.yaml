answer: |-
  Immanuel Kant's ethical framework is renowned for its rigorous grounding of moral status in rational autonomy, a feature that notoriously excludes non-human animals from the sphere of direct moral concern. Christine Korsgaard, a prominent contemporary Kantian, has challenged this exclusion, arguing that Kant's own principles, properly understood, entail direct duties to sentient beings. While Korsgaard's argument successfully remedies the counter-intuitive implications of Kant's view regarding animal suffering, a close examination reveals that her revision comes at a cost. Korsgaard does not merely extend Kant's ethics; she fundamentally alters the criterion for moral standing. Consequently, while she succeeds in deriving direct duties from premises that are *plausibly* Kantian, she tacitly abandons what is most distinctive about Kant's grounding of moral status: the strict identification of moral community with the reciprocity of rational self-legislation.

  To understand the magnitude of Korsgaard's revision, one must first grasp the architecture of Kant's original position. For Kant, duties in the strict sense are relations between rational wills. In the *Metaphysics of Morals*, Kant argues that only beings capable of autonomy—of giving themselves the moral law through reason—possess dignity and are "ends in themselves." Animals, lacking rationality and freedom, are classified as "things." They have a relative value (a price) determined by their utility to rational beings, but they possess no intrinsic worth that commands respect.

  Therefore, Kant maintains that we have no direct duties to animals. As he famously notes in the *Lectures on Ethics*, duties regarding animals are indirect duties to humanity. Cruelty to animals is forbidden not because it wrongs the animal, but because it damages the moral character of the human agent. Kant illustrates this with the poignant example of the aging dog: a man who shoots his faithful dog because it can no longer serve him violates no duty to the dog, but he weakens the "kindly and humane qualities" in himself that he ought to cultivate in relation to other humans. On this view, the animal is a prop in the moral development of the human; the suffering of the animal is morally relevant only insofar as it impacts the rational agent's capacity for sympathy.

  Korsgaard challenges this framework in works such as "Kantianism, Utilitarianism, and the Status of Animals." She argues that Kant conflates two distinct questions: what is the *source* of moral value, and what are the *objects* of moral concern. Kant assumes that because rational nature is the source of value (the condition of the good), only rational nature can be the object of ultimate moral concern (an end in itself). Korsgaard disentangles these. She argues that rational beings necessarily value their own natural, sentient existence as a condition of exercising their rationality. If I am to value my rational capacity, I must value the animal life that sustains it.

  From this premise, Korsgaard derives a consistency requirement. If my own suffering matters to me because I am a sentient being, and I acknowledge that my sentience is the ground of that value, I must acknowledge that the suffering of other sentient beings matters to them for the same reason. Thus, sentient animals become "ends in themselves" not because they can legislate laws, but because their natural goods (freedom from pain, flourishing) are objectively valuable to them. Korsgaard claims this follows from the Formula of Humanity: we must treat humanity as an end, and since our "humanity" encompasses our animal nature, we must respect the animal nature in ourselves and others.

  Korsgaard's argument is undeniably powerful in its ethical implications; it grants animals direct moral standing without resorting to utilitarianism. However, the prompt asks whether this derivation rests on *genuinely Kantian premises* or abandons Kant's distinctive grounding. Here, the analysis must turn critical. Kant's distinctive grounding of moral status is not merely that rational beings are valuable, but that moral obligation arises specifically from the *reciprocity of legislation*. In the "Kingdom of Ends," every member is both sovereign and subject; they bind themselves to laws they could will for all other rational beings.

  Korsgaard's revision breaks this reciprocity. By grounding direct duties in *sentience* rather than *rational agency*, she includes beings in the moral community who cannot participate in the legislation of the moral law. For Kant, a "duty" implies a constraint on the will imposed by reason. An animal cannot impose a constraint on a human will through reason because the animal has no rational will. In Korsgaard's model, the duty is grounded in the *value of the animal's experience*, not the *authority of the animal's will*. This shifts the ground of obligation from a deontological relation between wills (Kant) to a value-theoretic relation between a valuer and a good (closer to Aristotelian or utilitarian concerns, albeit framed in Kantian language).

  Furthermore, Kant explicitly rejects the idea that sentience alone confers moral standing. For Kant, "humanity" (*Menschheit*) is a technical term referring to the capacity to set ends through reason, not biological species membership or sentient capacity. When Korsgaard argues that we must value our animal nature to value our rational nature, she expands the definition of "humanity" in the Formula of Humanity beyond Kant's usage. Kant would likely argue that while we have a prudential interest in preserving our animal nature, the *moral* obligation to respect "humanity" applies only to the rational capacity that elevates us above nature. To extend the protection of the moral law to beings who cannot comprehend the law is, for Kant, to confuse moral duty with benevolence or instinct.

  Therefore, Korsgaard does not succeed in deriving direct duties from *strictly* Kantian premises. She succeeds in deriving them from premises that are *compatible* with a broader Kantian emphasis on reason and consistency, but she achieves this by modifying the necessary condition for moral status. Kant's system is binary: one is either a person (rational) or a thing (non-rational). Korsgaard introduces a tripartite or gradient structure where sentient things have a claim on rational persons. This is a philosophical improvement regarding animals, but it is an exegetical departure. She abandons the thesis that moral status is exclusively the correlate of moral agency.

  In conclusion, Korsgaard's argument is a brilliant reconstruction that saves the Kantian spirit from its own harsh conclusions regarding animals. However, it does so by sacrificing the letter of Kant's law. By grounding direct duties in the value of sentience rather than the authority of rational will, she tacitly abandons the distinctive Kantian claim that the moral community is a exclusive fellowship of co-legislators. Korsgaard offers us a compelling "Kantian-inspired" ethics of animal rights, but to call it strictly Kantian is to overlook the fact that Kant's rigidity regarding rational agency was not an oversight to be corrected, but the foundational pillar of his entire moral metaphysics.
