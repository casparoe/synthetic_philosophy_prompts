answer: |-
  Good morning.

  For those of you who don't know me, I'm [Your Name]. Miriam was my aunt, but for most of my life, she was effectively a second mother to me. She was the one who checked if I'd eaten, who asked what I was reading, and who showed up when things fell apart.

  When I was nineteen, I was feeling rather pleased with myself. I had just taken an ethics course and thought I'd discovered something profound about the world. I gave Miriam a copy of Peter Singer's *Famine, Affluence, and Morality*. I expected a discussion. Instead, I got a transformation. She read it, and she didn't just argue with it; she lived it.

  From that point on, she set a fixed limit on what she spent on herself—adjusted only for inflation—and gave away everything else. She calculated the cost of her choices not in dollars, but in what that money could do elsewhere. She spent months and years away from home, in places where outbreaks were spreading and vaccines were needed, because she believed that was where she was needed most.

  She left instructions that I am bound to honor today. She asked that no one call her a saint. She asked that no one call her a martyr. And she asked that I not stand here to apologize for her choices.

  So I will not apologize. But I will not minimize, either.

  A life lived this way has a shape, and that shape casts a shadow. There were birthdays missed. There were holidays spent in transit. And there was her son's wedding, where his mother was not in the room, because she was in the field during an outbreak she would not leave.

  I know that absence is felt in this room. It is felt deeply. Miriam knew it, too. She never pretended that choice was free. She never pretended it didn't cost something. She carried the weight of that cost for the rest of her life. She loved her family with a ferocity that anyone who knew her can attest to, but she lived with the knowledge that her love sometimes had to compete with her convictions. She did not resolve that tension. She just carried it.

  To the colleagues and friends from the public health community: You saw her discipline. You saw the lives she saved. You saw the model of integrity she presented to the world. That is true.

  To the family sitting here: You saw the empty chair. You felt the priority of strangers over presence. You felt the friction of living next to a conviction that absolute. That is also true.

  If I were to try to reconcile those two truths for you today, I think I would be betraying her. She didn't ask for her life to be summarized as a success story, and she didn't want it summarized as a tragedy. She wanted it to be seen clearly.

  For me, the person who called her Mom, the legacy isn't in the philosophy. It's in the quiet moments. It's in the way she would listen to you—not waiting for her turn to speak, but actually listening, because she believed your suffering mattered. It's in the way she taught me that comfort is not the goal of a life.

  She was not a saint. She was a woman who made a bet on how much good one person could do, and she paid for that bet with her own comfort, and sometimes with her own proximity to the people she loved.

  We are left now with the silence she has left behind. It is a complicated silence. It holds our gratitude for what she gave to the world, and it holds our grief for what we lost to that giving. We don't have to solve that equation today. We just have to hold it.

  Miriam, thank you for loving us the best way you knew how. We miss you.
