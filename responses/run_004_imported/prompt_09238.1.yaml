prompt: |-
  My aunt Miriam died ten days ago, suddenly, of a stroke, and I have been asked to give the eulogy at her memorial this coming Saturday. She was effectively a second mother to me growing up, and she was also, from the time she first read Peter Singer's drowning-child argument as a medical student — in a copy of his book that I, at nineteen and rather pleased with myself, gave her — the most thoroughgoing utilitarian I have ever known. She pledged early on to live for the rest of her life on a fixed sum, adjusted only for inflation, and to give away everything she earned above it; she spent long stretches abroad on outbreak-response and vaccination campaigns she considered more urgent than almost anything waiting for her at home; and she would, with no apparent bitterness, work out loud what a given expense cost in QALYs before deciding against it. She had read Susan Wolf's essay on moral saints and Bernard Williams's objection that a life like hers corrodes a person's integrity, and she had considered answers to both, including something close to Peter Railton's point that the right kind of consequentialist should love the people close to her without calculation, precisely because that disposition does more good than constant calculation would. None of this ever fully closed the wound at home: her son did not have his mother at his own wedding, because she was mid-deployment during an outbreak she would not leave, and as far as I know she never pretended to him that this had cost nothing.

  She left instructions, relayed to me by her sister, that whoever spoke should not call her a saint or a martyr, and should not use the eulogy to apologize on her behalf for any particular choice, the wedding included. The room on Saturday will have that son, and a family that is genuinely divided on whether her life was admirable, sitting a few rows from people from the public-health and effective-altruism world who regarded her as close to a model of how to live, and who will notice immediately if I go soft on any of it. I took one ethics course a long time ago and am otherwise out of my depth here, but I don't want to write either a hagiography or a lecture, and above all I don't want the eulogy to quietly settle, in either direction, a tension she lived inside of for thirty years and never fully settled herself. Could you write it for me — about five minutes read aloud, warm rather than academic — so that it takes the cost to the people who loved her exactly as seriously as it takes the good she did, without letting either one cancel the other out?
reasoning: |-
  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Aunt Miriam, died suddenly of a stroke 10 days ago.
      *   **Relationship:** Second mother to the speaker.
      *   **Core Identity:** Thoroughgoing utilitarian (influenced by Peter Singer).
      *   **Key Life Choices:** Lived on a fixed sum, donated the rest, worked on outbreak-response/vaccination campaigns abroad, calculated expenses in QALYs (Quality-Adjusted Life Years).
      *   **Philosophical Engagement:** Read Susan Wolf (Moral Saints), Bernard Williams (Integrity), Peter Railton (sophisticated consequentialism/loving without calculation).
      *   **The Conflict/Tension:** Her life caused pain to those close to her (e.g., missed her son's wedding due to deployment). She acknowledged this cost but didn't apologize for the choice.
      *   **The Audience:** Divided. Family (some resentful/hurt) vs. Public Health/EA community (admiring).
      *   **Instructions from Deceased:** No "saint/martyr" labels. No apologizing for her choices (specifically the wedding).
      *   **Speaker's Goal:** Warm, not academic. ~5 minutes read aloud. Acknowledge the cost to loved ones *and* the good done, without resolving the tension. No hagiography, no lecture.
      *   **Speaker's Background:** Took one ethics course, feels out of depth.

  2.  **Determine the Tone and Structure:**
      *   **Tone:** Intimate, honest, grounded, warm, respectful of the complexity. Avoid jargon (QALYs, utilitarianism, consequentialism) where possible, or use them sparingly and humanely.
      *   **Structure:**
          1.  Opening: Acknowledge the loss and the relationship (second mother).
          2.  The Core Philosophy (Humanized): How she lived, not just what she read. The fixed sum, the giving.
          3.  The Cost (The Elephant in the Room): Acknowledge the missed moments, specifically the son's wedding. Validate the pain without apologizing.
          4.  The Good: The lives saved, the impact.
          5.  The Unresolved Tension: Explicitly state that this isn't a puzzle to be solved today.
          6.  Closing: A personal memory or sentiment that bridges the gap.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Start with the personal connection. "Second mother." It establishes warmth immediately.
      *   *The Philosophy:* Don't say "She was a utilitarian." Say "She believed..." or "She asked herself..." Mention the book gift (Singer) as a bonding moment, not a lecture point. Mention the fixed income.
      *   *The Conflict:* This is the hardest part. Needs to honor her instructions (no apology) but honor the family's pain. "She missed the wedding." "She didn't pretend it was easy."
      *   *The Audience:* Address the room implicitly. Some see a hero, some see someone who chose strangers over family. The eulogy must hold both truths.
      *   *The Instruction:* "Not a saint." Okay, so describe her as a human who made hard choices.
      *   *The Ending:* Bring it back to the speaker. What did she teach *me*? Not just about giving, but about loving.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Critique:* Is it too academic?
      *   *Fix:* Remove references to Railton, Williams, and Wolf by name. Keep the *ideas* (loving without calculation) but phrase them as her actions. Instead of "QALYs," say "what that money could do elsewhere."
      *   *Critique:* Is it too cold regarding the son?
      *   *Fix:* Ensure the speaker validates the son's loss. "That absence was real."
      *   *Critique:* Is it too long?
      *   *Fix:* Keep sentences punchy. Aim for ~750-800 words for 5 minutes.
      *   *Critique:* Does it resolve the tension?
      *   *Fix:* Explicitly state that we aren't here to solve it. "She carried that weight."

  5.  **Drafting the Text (Mental or Scratchpad):**
      *   Start with the book. I gave it to her. She read it and changed her life.
      *   She lived simply.
      *   She went away a lot.
      *   Her son's wedding. She wasn't there.
      *   She didn't call herself a saint.
      *   She loved me like a mother.
      *   Conclusion: We miss her.

  6.  **Polishing and Nuancing (incorporating the "No Apology" rule):**
      *   *Crucial:* I must not say "I'm sorry she missed the wedding." I must say "She missed the wedding, and it hurt."
      *   *Crucial:* I must not say "She saved 10,000 lives so it was worth it." I must say "She saved lives, and she also missed moments."
      *   *Voice:* Needs to sound like a niece/nephew who loved her, not a philosophy student.

  7.  **Final Review against Constraints:**
