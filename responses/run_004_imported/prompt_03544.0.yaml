answer: |-
  You are correct to feel that averaging your probabilities is arbitrary. You are trying to solve a **value conflict** (different stakes) with an **epistemic solution** (combining beliefs). That is why it feels unsatisfying.

  In decision theory terms, you have **heterogeneous priors** (different beliefs about acceptance) and **heterogeneous utility functions** (different costs/benefits of the outcome). There is no mathematical formula that spits out a "correct" joint decision without explicitly negotiating the trade-offs.

  However, there is a principled framework to handle this, specifically within the norms of academic economics. Here is how to decompose the problem and reach a decision that is rational rather than just a compromise.

  ### 1. Stop Averaging Probabilities
  Averaging your 15% and her 70% to get 42.5% is methodologically flawed.
  *   **Epistemic Deference:** You admitted she is better calibrated. In a rational division of labor, you should defer to her expertise on the *probability* of acceptance. Treat the probability as 70% (or perhaps slightly discounted, see below).
  *   **The Real Conflict:** Even if you both agree the probability is 70%, you might still disagree on the submission. If the cost of rejection for you is "unemployed" and for her is "minor annoyance," a 70% gamble might be rational for her but irrational for you.

  ### 2. Map the Expected Utilities
  You need to explicitly quantify the payoffs. Let's simplify the options to **Top Journal** vs. **Safe Journal**.

  **For You (Job Market Candidate):**
  *   **Top Accept:** Huge utility boost (likely tenure-track offer).
  *   **Top Reject:** High cost (6–12 month delay, signal of rejection to market, stress).
  *   **Safe Accept:** Moderate utility (signals competence, secures a baseline).
  *   **Safe Reject:** Low cost (quick turnaround, try again).

  **For Her (Tenured):**
  *   **Top Accept:** Moderate utility (prestige, CV line).
  *   **Top Reject:** Low cost (time lost, but tenure is secure).
  *   **Safe Accept:** Low utility (nice to have).
  *   **Safe Reject:** Low cost.

  **The Decision Rule:**
  A joint decision is rational if it maximizes the **sum of utilities**, provided it meets the **individual rationality constraint** (neither party ends up with a net negative outcome they can't tolerate).
  *   Because your downside risk (career trajectory) is exponentially higher than hers, your "cost of rejection" weight is much heavier.
  *   Even with a 70% acceptance rate, if the *cost* of the 30% failure case is catastrophic for you and trivial for her, the Expected Utility (EU) for the *team* might still favor the safe option.

  ### 3. The "Junior Priority" Norm
  In economics, there is a strong, unwritten normative rule: **When stakes are asymmetric, the junior scholar's career needs take precedence.**

  This isn't just charity; it is efficient for the profession.
  *   Her tenure is already secured. The marginal utility of one more top publication is diminishing.
  *   Your job market outcome is binary and path-dependent. A bad market year can scar a career permanently.
  *   Therefore, the "principled" solution is often to treat the junior co-author as the **residual claimant** on risk. She has the tenure buffer to absorb risk; you do not.

  If she pushes for the top journal despite your job market status, she is effectively asking you to subsidize her risk preference with your career capital.

  ### 4. Mechanisms for Agreement (Side Payments)
  If you decide to go against your preference (e.g., you agree to shoot for the top journal to keep her happy, or she agrees to go safe to help you), you need **side payments** to balance the utility.

  *   **Author Order:** If you go for the Safe Journal (her lower preference), you should arguably be First Author. If you go for the Top Journal (your higher risk), she might take First Author as compensation for "mentoring" you through the risk.
  *   **Future Projects:** "We submit this to the Safe Journal now. On the next project, where I am more established, we swing for the fences and I follow your lead."
  *   **The "Desk Reject" Clause:** Agree to submit to the Top Journal *only* if she handles the revision/resubmission workload if it gets a "Revise & Resubmit" while you are on the market. (Though be careful; an R&R at a top journal is still gold for the market).

  ### 5. A Reality Check on the 70%
  You mentioned she is better calibrated, but in the current economics publishing environment, **a 70% acceptance probability at a "flashy top journal" is statistically anomalous.**
  *   Even for excellent papers, acceptance rates at Top 5 econ journals are typically 5–10%.
  *   If she means 70% chance of a *Top Field* journal, that is plausible.
  *   If she means 70% at a *General Interest Top* (AER, QJE, JPE, etc.), her calibration may be specific to her tenure track, not the current market.
  *   **Suggestion:** Ask her to bet. "If you are truly 70% sure, are you willing to cover the cost of a professional edit or pay for the open access fees if it gets accepted?" (Metaphorically). Or, ask her to list the last 5 papers she thought were 70% locks and what happened to them.

  ### Recommended Path Forward

  1.  **Acknowledge her calibration:** "I trust your judgment on the quality more than mine. Let's assume the probability of acceptance is high."
  2.  **State your constraint:** "However, my utility function is different. Because I am on the market, the variance of this outcome matters more to me than the expected value. A rejection delays my entry into the profession, which has a high long-term cost."
  3.  **Invoke the norm:** "Standard practice in our field is that the junior partner's timeline dictates the submission strategy when stakes are asymmetric."
  4.  **Propose the Trade:**
      *   **Option A (Her Preference):** Submit Top. You concede, *but* you get first authorship (if not already decided) or she commits to doing the bulk of the revision work if an R&R comes during your interviews.
      *   **Option B (Your Preference):** Submit Safe. She concedes, *but* you agree to lead the next high-risk project with her.
      *   **Option C (The Hybrid):** Submit to the Top Journal, but **only** if the turnaround time is known to be fast (some journals have expedited tracks for job market papers), or submit to a high-tier Field journal that counts as "Top" for your specific market niche but has better odds/turnaround.

  **Verdict:** You are not just negotiating; you are managing a portfolio with two investors who have different risk tolerances. The investor with the shorter time horizon and lower risk capacity (you) should generally dictate the asset allocation. If she is truly a rational collaborator, she should recognize that maximizing *your* expected utility maximizes the *collaboration's* long-term value.
