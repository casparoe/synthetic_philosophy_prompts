      *   **Expected Utility Theory (EUT):** The standard rational choice framework.
      *   **Pareto Efficiency:** A decision is good if it makes one person better off without making the other worse off (hard here since it's a joint decision).
      *   **Nash Bargaining Solution:** A game-theoretic approach to cooperative bargaining.
      *   **Side Payments/Transfers:** Can one compensate the other? (In academia, this is tricky but possible via author order, future projects, etc.).

  5.  **Develop Specific Steps/Strategies:**

