  **What They Are Missing:**
  Both debaters are grappling with **W.D. Ross's distinction between *prima facie* duties and *actual* duties**. Noah assumes obligations are all-or-nothing (actual duties only). Ella intuitively grasps that a *prima facie* duty (the promise to the brother) remains binding even when overridden by a stronger *actual* duty (the hospital). They also lack the specific terminology: Noah is defending **Agglomeration**, while Ella is describing **Moral Residue**. Recognizing these concepts would clarify that Maren's guilt isn't a logical error, but a recognition of the moral cost inherent in tragic choices.
