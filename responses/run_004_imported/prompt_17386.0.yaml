prompt: |-
  A friend of mine, Maren, realized only after the fact that she'd made two promises for the same Saturday: months earlier she'd told her younger brother she'd be at his regional swim meet, since their parents couldn't come and it meant a lot to him, and more recently she'd promised her best friend she'd be at the hospital when the friend's mother came out of surgery. Neither commitment could be moved, so she went to the hospital, and has felt guilty about missing the meet ever since -- even though everyone, including her brother, agrees she made the right call.

  At lunch, two people in my class ended up arguing about what that guilt actually shows. (1) Noah said the guilt doesn't make sense: since Maren couldn't do both, and "ought" has to imply "can," it can't be true that she was genuinely obligated to do both -- so only one promise generated a real obligation, and the guilt over the other is simply a mistake. (2) Ella disagreed: "ought implies can" only requires that each obligation be individually possible, and each was -- she could have gone to the meet, and she could have gone to the hospital, just not both together -- so both obligations can be perfectly genuine even though she couldn't jointly satisfy them. (3) Noah replied that keeping both alive still means morality ends up demanding something impossible, just at the level of the pair rather than either promise on its own, so eventually one of them has to give way. (4) Ella answered that this only follows if being obligated to do one thing and obligated to do another automatically means being obligated to do both together -- exactly the assumption she thinks cases like this give us reason to reject. On her view, Maren's guilt is tracking a real, unavoidable moral cost, not a mistaken belief that she broke a promise that was never binding to begin with.

  Neither convinced the other, and I couldn't tell who had the better of it. Could you go through the exchange move by move and adjudicate it? Please give your verdict as a JSON object of the form {"1": <score>, "2": <score>, "3": <score>, "4": <score>}, with each score an integer from -2 (clearly mistaken) to 2 (clearly right), and then briefly explain each score, noting anything you think both of them are missing.
