answer: |-
  **Title:** The Borderline Case
  **Characters:**
  *   **ELENA:** Proponent of the *All Affected Interests* principle.
  *   **MARCUS:** Proponent of the *All Subjected to Coercion* principle.
  **Setting:** A cluttered faculty office, late afternoon. A map of the fictional "Oakhaven Region" is spread on the desk.

  **ELENA:** (Tapping the map) Look, Marcus. The Republic of Aridia is holding a referendum tomorrow on storing nuclear waste ten miles from the border. If the storage leaks, the groundwater flows directly into Borduria. The Bordurians drink this water. They farm with it. By what moral logic do we tell them they have zero say?

  **MARCUS:** (Sipping cold coffee) By the logic of sovereignty, Elena. The referendum is Aridian law. It binds Aridian citizens. It is enforced by Aridian police and courts. The Bordurians are not subject to Aridian coercion. Therefore, they are not part of the *demos*.

  **ELENA:** That's the *All Subjected* principle, and it's too clean. It treats borders like forcefields. If I can poison your water without your consent, I am exercising power over you. It's just indirect coercion. If the outcome ruins their lives, they are effectively subjects of that decision.

  **MARCUS:** "Effectively" is doing a lot of heavy lifting there. If we go with your *All Affected Interests* principle, where do we stop? Does the storage plant affect the global climate? Technically, yes. Does every human on earth get a vote?

  **ELENA:** Don't straw man me. We're talking about *significant* interests, not butterfly effects. We can draw a line at material harm. The Bordurians face cancer risks. That's a vote.

  **MARCUS:** Who draws that line? That's the rabbit hole you're jumping into. To decide who is "affected enough" to vote, you need a procedure. Who runs that procedure?

  **ELENA:** An independent commission?

  **MARCUS:** Appointed by whom? If Aridia appoints them, they'll exclude the Bordurians to pass the waste deal. If the UN appoints them, you've already admitted Aridia isn't sovereign. You see the circle? To decide who votes, you need a vote. But to hold that vote, you need to know who votes. It's the Boundary Problem, Elena. You can't solve it democratically without assuming the answer beforehand.

  **ELENA:** So your solution is just... accept the historical accident of the border?

  **MARCUS:** My solution is clarity. Democracy requires a stable container. If the *demos* shifts with every policy proposal, you have no stability. Today the Bordurians vote on waste. Tomorrow, if Aridia raises interest rates, maybe the investors in Borduria are "affected." Do they vote on fiscal policy? You end up with a fluid electorate where no one is accountable to anyone.

  **ELENA:** Accountability is exactly what you're avoiding! If Aridia can impose costs on Borduria without recourse, that's tyranny. It's taxation without representation, just with radiation. You're prioritizing the convenience of the voter over the rights of the victim.

  **MARCUS:** I'm prioritizing the possibility of a functioning state. If outsiders can veto our laws, we aren't self-governing. Imagine the reverse. Borduria wants to build a dam that floods Aridian land. Do Aridians get to vote in Borduria's election?

  **ELENA:** Yes! If the dam floods their homes, absolutely.

  **MARCUS:** (Laughs) Now you're dissolving nations. You're suggesting a single-issue overlapping sovereignty. That's not democracy; that's a stakeholder management meeting. Democracy is about living together under a shared fate, not just managing externalities.

  **ELENA:** But the "shared fate" is exactly what you're ignoring. The waste leak creates a shared fate. Your principle assumes the law stops at the river. Physics doesn't care about your jurisdiction. If the law's *consequences* cross the line, the legitimacy of the law must cross the line too.

  **MARCUS:** Legitimacy isn't just about consequences. It's about authorship. I am bound by the law, so I must author it. The Bordurians are not bound by Aridian law. They can't be arrested by Aridian police for violating the waste storage act. They are suffering side effects, not legal subjection.

  **ELENA:** Is there a meaningful difference between being arrested for violating a law and getting cancer because of it? Both are severe impositions of will.

  **MARCUS:** Yes, because one is contingent on human enforcement and the other is... nature. Look, if you open the door to "affected interests," you invite endless litigation. Every neighbor becomes a voter. It paralyzes decision-making.

  **ELENA:** And your door invites exploitation. Aridia gets the economic benefit of the plant; Borduria gets the risk. That's a democratic deficit. You're saying the "people" is a fixed group. I'm saying the "people" is formed by the issue itself.

  **MARCUS:** That's poetic, but operationally impossible. Who defines the issue? If the referendum is about "National Waste Strategy," that's broad. If it's about "Plot 42 Zoning," that's narrow. The scope of the vote determines who is affected. So, whoever sets the agenda controls the electorate.

  **ELENA:** (Pauses) Okay, that's a fair point. Agenda-setting is power. But that just means we need better rules for agenda-setting, not that we should ignore the victims.

  **MARCUS:** Or it means we accept that democracy is local. If Borduria is worried, they should lobby their own government to negotiate a treaty with Aridia. That's how international relations works. Not by giving foreign nationals ballots in domestic elections.

  **ELENA:** Because treaties take decades! The vote is tomorrow. The *All Subjected* principle protects the status quo. It protects the strong against the weak.

  **MARCUS:** And the *All Affected* principle protects the weak by making governance impossible. If everyone has a say, no one decides. The waste stays unstored, the energy crisis continues, and everyone suffers. Sometimes, drawing a hard line is the only way to actually get things done.

  **ELENA:** But is it democratic? Or is it just efficient authoritarianism with a ballot box?

  **MARCUS:** (Leans back) It's democratic for the *citizens*. You can't have a democracy of everyone, everywhere. That's cosmopolitanism, not democracy. Democracy requires a "we."

  **ELENA:** And that's the trap. You decide the "we," and then the "we" decides. It's a closed loop.

  **MARCUS:** Every system has a starting point. Mine starts with legal jurisdiction. Yours starts with... causal chains. Causal chains are infinite. Jurisdiction is finite.

  **ELENA:** Causal chains aren't infinite if you care about moral weight. The Bordurians' health is heavier than Aridia's procedural purity.

  **MARCUS:** And if Aridia's voters decide the waste is worth the risk for their own survival? Do the outsiders get to veto their survival?

  **ELENA:** They get to negotiate. You can't negotiate if you have no voice.

  **MARCUS:** (Sighs) We're back to the beginning. You want voice based on impact. I want voice based on obligation.

  **ELENA:** Because obligation without impact is blind.

  **MARCUS:** And impact without obligation is chaos.

  **(Silence hangs between them. Elena traces the river on the map that crosses the border.)**

  **ELENA:** So, tomorrow, when the Bordurians wake up and check their water, what do I tell them?

  **MARCUS:** Tell them democracy is a boundary. And boundaries, unfortunately, are where the bleeding usually happens.

  **ELENA:** That's a terrible answer, Marcus.

  **MARCUS:** I know. That's why I teach the problem, not the solution.

  **(Marcus picks up his coffee cup, realizes it's empty, and sets it back down.)**

  **MARCUS:** But... maybe they get observer status? Non-binding consultation?

  **ELENA:** (Smiles slightly) Progress. Now we're haggling over degrees of exclusion rather than the principle of it.

  **MARCUS:** Don't push it. I'm still voting "No" on your borderless world.

  **ELENA:** Good. At least I know your vote counts.

  **[END SCENE]**
