  So this is kind of a random ask but bear with me. In my philosophy of religion elective (yes my school actually offers one, i got lucky with scheduling this year) we just finished a unit on arguments against God's existence, and the one that's stuck with me is the "hiddenness argument" from this guy Schellenberg. Basically his point is that if a perfectly loving God existed, then anyone who genuinely wanted to believe and wasnt being stubborn or resistant about it on purpose would end up believing, since a loving God would make sure a real relationship was possible for them — he's even got a specific term for these people, "nonresistant nonbelievers." But since there are obviously people like that who still dont believe no matter how hard they try, he concludes a perfectly loving God probably doesnt exist. We also covered some of the classic comebacks to this, like the "epistemic distance" response, which is basically that God stays hidden on purpose so our belief in him can be free instead of forced, since if the evidence was undeniable we wouldnt really have a choice in the matter.

  Next week a few of us have to give short presentations arguing for/against theism, and I got assigned to argue against while my friend Marcus is arguing for. I wanna open with a joke to loosen the room up a bit and also mildly troll him. Could you write me a joke about divine hiddenness? Not like a generic "why doesnt god just show himself" one liner that literally anyone who's never taken the class could come up with, i want it to actually engage with the specifics, like the nonresistant nonbeliever thing or the epistemic distance/free will response, so that people who actually sat through the unit will get why its funny and not just people who think its a normal athiesm joke. If you can, also throw in like a one sentence explanation of the logic behind the joke in case i need to explain it to Marcus afterward lol.
