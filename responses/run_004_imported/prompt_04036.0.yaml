  9.  **Final Polish:** Ensure the distinction between *normative* (Lewis) and *descriptive/causal* (Skyrms) is clear. This is the philosophical crux.

  **(Self-Correction on the "Verdict"):** I need to be careful not to say Lewis is useless. His definition defines the *endpoint* (what counts as a convention), while Skyrms defines the *trajectory*. But the user asks about "what's going on when a population converges." That is a process question. Skyrms wins on process.

