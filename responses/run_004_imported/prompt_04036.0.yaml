answer: |-
  This is one of the sharpest tensions in the philosophy of game theory, and you have hit on exactly why reading the actual text of *Convention* feels jarring after years of citing it in RL papers.

  Here is the verdict you asked for, stripped of the diplomatic "both sides make good points" hedging:

  **Brian Skyrms's account gives the better picture of what is actually happening during convergence in biological or artificial populations. David Lewis's account describes the *normative status* of the resulting equilibrium, not the *causal mechanism* of its emergence.**

  In the context of Multi-Agent RL (MARL) and evolutionary biology, **Common Knowledge (CK) is not doing the necessary work Lewis thought it was.** It is a post-hoc rationalization, not a prerequisite.

  Here is the head-to-head breakdown of why Skyrms wins on the mechanics of convergence, and where Lewis actually still matters (which is important for your paper's discussion section).

  ### 1. The Problem: Equilibrium Selection vs. Equilibrium Convergence

  **Lewis (The Rationalist Account):**
  Lewis was solving a philosophical puzzle: *Why do we stick to one equilibrium when others are equally good?* (e.g., why drive on the right when the left works just as well?)
  For Lewis, agents are hyper-rational reasoners. If there are multiple Nash equilibria, rationality alone doesn't tell you which to pick. Lewis argued that **Common Knowledge** acts as the tie-breaker. I follow the rule because I know you follow it, and I know you know I know, ad infinitum. Without CK, the expectation collapses, and the convention dissolves.
  *   **Role of CK:** Causal precondition. No CK = No Convention.

  **Skyrms (The Naturalist Account):**
  Skyrms asks a different question: *How do populations settle on an equilibrium without explicit reasoning?*
  In replicator dynamics or reinforcement learning, agents don't "select" equilibria via reasoning. They drift toward them via **basins of attraction**. If a signaling system yields a higher payoff, the frequency of that strategy increases. Path dependence and historical accident determine *which* equilibrium is hit, not common knowledge.
  *   **Role of CK:** Irrelevant to convergence. Potentially emergent, but not causal.

  ### 2. Why CK Fails in MARL and Evolution

  Your intuition about your neural nets is correct. Your agents cannot satisfy Lewis's definition.

  1.  **No Belief States:** Lewis's definition requires agents to hold beliefs about the world and beliefs about other agents' beliefs. Your neural nets optimize weights to maximize a scalar reward. They do not model "I know that you know." They model "Input $X$ maps to Output $Y$ yields Reward $Z$."
  2.  **No Infinite Regress:** CK requires an infinite hierarchy of knowledge ($K_i K_j K_i \dots$). In deep RL, we struggle to model first-order theory of mind. Expecting emergent communication protocols to rest on infinite epistemic recursion is computationally implausible and architecturally unsupported.
  3.  **Convergence without Consensus:** In Skyrms's models (and your RL runs), conventions often stabilize even when agents have *false* beliefs or no beliefs at all. A population can converge on a signaling system where agents simply react to stimuli. The regularity exists, the payoff is high, but the epistemic condition Lewis demands is absent.

  If Lewis were right, your agents shouldn't be able to form conventions. They do. Therefore, Lewis's condition is too strong for the phenomenon of *emergence*.

  ### 3. Does Skyrms "Vindicate" Lewis? (The "As If" Argument)

  Some philosophers (and likely your advisor) might argue that Skyrms vindicates Lewis by showing that stable equilibria **function as if** there is common knowledge. Once a signaling system is stable in a population, my expectation that you will signal correctly is reliable enough that I don't need to verify the infinite regress. The *dynamics* create a state that mimics the *epistemic security* of CK.

  **Verdict on Vindication:** This is a category error.
  Showing that dynamics produce a stable state that *looks like* a Lewisian convention does not vindicate the claim that CK is *constitutive* of convention.
  *   **Analogy:** A thermostat maintains a stable temperature. You could describe the stable temperature using the language of human homeostasis ("the room wants to be 72 degrees"). But explaining the thermostat via thermodynamics (Skyrms) is causally accurate; explaining it via desire (Lewis) is metaphorical.
  *   In your RL setup, the gradient descent *is* the thermodynamics. CK is the metaphor.

  ### 4. Where Lewis Still Wins (The Normative Gap)

  If Skyrms is right about convergence, why does everyone cite Lewis? Because Skyrms fails to explain **normativity**.

  In Skyrms's world, a convention is just a stable habit. If a mutant strategy appears that pays off better, the convention should break. But human conventions often persist *even when* they are suboptimal, because breaking them violates a social expectation.
  *   **Lewis:** Explains why we feel *obligated* to follow the convention (because of the mutual expectations/CK).
  *   **Skyrms:** Explains why we are *inclined* to follow the convention (because of reward history).

  For human sociology, Lewis is indispensable. For artificial agents and biological evolution, Lewis is an anthropomorphic projection.

  ### 5. Recommendation for Your Research

  Since you are writing a PhD thesis in MARL, here is how you should position this:

  1.  **Acknowledge the Mismatch:** Explicitly state that Lewis's definition is normative/epistemic, while your work is descriptive/dynamic.
  2.  **Adopt Skyrms as the Mechanism:** Use Skyrms to explain *how* the protocols emerge (basins of attraction, reward shaping, population pressure).
  3.  **Use Lewis as the Limit Case:** Use Lewis to define what counts as a "full" convention vs. a mere "regularity." You can argue that your agents achieve **Lewisian Conventions minus the Common Knowledge**.
      *   *Innovation Opportunity:* If you want to make a theoretical contribution, investigate whether adding explicit belief modeling (Theory of Mind architectures) to your agents moves them closer to Lewis's definition, and if that makes the conventions more robust to noise or adversarial agents.
  4.  **The Verdict in Text:** "While Lewis provides the normative definition of convention, Skyrms provides the causal mechanism for emergence. In the context of deep RL, where agents lack epistemic states, Skyrms's evolutionary account is the empirically valid model, rendering Common Knowledge an emergent property of stability rather than a precondition for coordination."

  ### Summary
  Lewis describes the **logic** of convention. Skyrms describes the **physics** of convention.
  Since you are building the physics (RL/Evolution), **Skyrms is the correct account.** Lewis's Common Knowledge is not the engine of convergence; it is the passenger that shows up once the car has already stopped.
