      *   *Key Distinction:* Distinguish between *Equilibrium Selection* (Lewis's problem) and *Equilibrium Convergence* (Skyrms's solution). Lewis assumes agents need a reason to pick one. Skyrms shows history/path-dependence picks it for them.
