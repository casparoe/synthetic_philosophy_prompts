answer: |-
  Good evening, everyone. Faculty, family, friends, and the Class of 2024.

  If you're a parent or a sibling sitting out there, you've probably spent the last few months asking us one question: "So, what's the plan?" And if you're a philosophy major sitting here, you've probably spent the last few months asking yourself a harder question: "Which plan is the *right* one?"

  We are trained to look for reasons. We want the argument that proves Option A is better than Option B. We assume that if we can't find that argument, it's because we're missing something. Maybe we're too ignorant, or maybe the two options are exactly equal—a perfect tie.

  But during my time here, specifically in a seminar on practical reason, I learned something that changed how I see this moment. It comes from the philosopher Ruth Chang. She argues that when we face a "hard choice"—like choosing between a stable career and a risky passion, or law school and a PhD—it's not because we're ignorant, and it's not a tie.

  It's because the options are what she calls "on a par."

  See, we usually think value works in a trichotomy: one thing is better, worse, or equal to another. Chang says there's a fourth relation. Two things can be in the same neighborhood of value, comparable, but neither is better than the other, and they aren't equal.

  How do we know? There's a test we call the "small-improvement argument." Imagine you're choosing between two careers. If they were truly *equal*, like two identical weights on a scale, then adding even a tiny benefit to one of them—say, a slightly higher salary or a better coffee machine—should tip the scale. That option should suddenly become the winner.

  But in the choices that actually keep us up at night, a small improvement doesn't tip the scale. If you offer a philosopher a bit more money, they don't instantly become "better" than the lawyer. If you offer the lawyer a bit more free time, they don't instantly become "better" than the philosopher. The scale doesn't tip. That tells us the options weren't equal to begin with. They were on a par.

  Now, why does this matter for a graduation speech? Why should the people who didn't major in philosophy care?

  Because if the options are on a par, it means reason alone cannot tell you what to do. There is no "correct" answer waiting for you to find it. And that sounds terrifying. We want to be told we're making the right move.

  But Chang suggests this is actually where our power lies. When reasons run out, *we* begin.

  When you choose between options that are on a par, you aren't discovering a reason that was already there. You are *creating* a reason. By committing to one path, by pouring your agency into it, you make it the right choice. You become the author of the value in your life.

  So, my advice to my cohort is this: Do not fear the gut-wrenching choice. Do not wait for the world to tell you which path is "better." If the choice is hard, it means the options are on a par. It means you are free.

  To the parents and families: When we hesitate, it's not because we're confused. It's because we recognize that the future isn't a math problem to be solved. It's a commitment to be made.

  To my fellow graduates: We spent four years learning how to analyze the world. Now, we get to build it. When you face that hard choice in the coming months, don't look for the light to guide you. Be the light. Commit to your path, and in doing so, make it the right one.

  Thank you, and congratulations.
