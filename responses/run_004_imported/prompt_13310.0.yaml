answer: |-
  This is an exceptionally sharp reading of *On Certainty*. You have put your finger on the single most debated tension in the text: the relationship between the **logical stability** of hinges (the door metaphor) and the **historical fluidity** of certainties (the river-bed metaphor).

  Most pop-philosophy summaries gloss over this because resolving it requires admitting that Wittgenstein is not offering a traditional epistemological theory (a set of rules for truth) but rather a grammatical investigation (a description of how doubt and certainty function).

  Here is a close reading of how these two metaphors fit together, and what that implies for your brother-in-law.

  ### 1. The Hinge vs. The River-Bed: Contradiction or Timescale?

  You asked if the fixed-hinge picture (OC 341–343) is consistent with the shifting river-bed picture (OC 96–97). The short answer is **yes, they are consistent, but they operate on different timescales.**

  **The Hinge is Synchronic (At a Moment)**
  When Wittgenstein writes, "If I want the door to turn, the hinges must stay put," he is describing the *logical structure of inquiry at any given moment*. For a language game to function *now*, for a doubt to be meaningful *now*, there must be a background of undoubted propositions.
  *   **Example:** If you are investigating whether a specific chemical reaction occurred, you cannot simultaneously doubt the existence of the test tube, the reliability of your eyes, and the laws of chemistry. Those things must function as hinges *for the duration of the investigation*.
  *   **The Point:** Doubt requires a ground. Universal doubt is impossible because doubt itself is a move within a game, and moves require rules that are currently in force.

  **The River-Bed is Diachronic (Over Time)**
  When he writes about the river-bed shifting (OC 97), he is describing the *historical evolution of those grounds*. The propositions that function as hinges are not eternally true truths (like mathematical axioms); they are empirical propositions that have *become* normative through habit, training, and success.
  *   **Example:** "The earth has existed for many years" is a hinge for us. For a medieval theologian, "God created the world in 4004 BC" might have been the hard bedrock, while geological time was fluid speculation. Over centuries, the fluid hardened and the hard became fluid.
  *   **The Point:** What counts as a hinge is contingent on history and community, not on metaphysical necessity.

  **The Synthesis**
  There is no contradiction because Wittgenstein is saying: *At any specific time $t$, you need fixed hinges to think. But between time $t$ and time $t+100$, the hinges can change.*

  Think of it like renovating a house while living in it. You cannot remove all the load-bearing walls at once (the house collapses; inquiry stops). But over the course of years, you can reinforce one wall, move a door, and eventually replace the foundation. The "hinge" metaphor describes the structural necessity of the wall *while you are standing on the floor*. The "river-bed" metaphor describes the architectural history of the house over decades.

  ### 2. Are All Hinges Equal? (The Normative Question)

  This is the harder question. If hinges drift historically, does *On Certainty* leave you with a relativistic stalemate where your scientific hinges are just "your culture's bedrock" and your brother-in-law's conspiracy hinges are "his subculture's bedrock"?

  Wittgenstein is often accused of relativism here, but a close reading suggests he offers a **pragmatic and grammatical critique** of bad hinges, even if he doesn't offer a "God's eye view" of Truth.

  Here is why Wittgenstein would suggest your hinges are "better" (or rather, more functional) than your brother-in-law's, without appealing to absolute truth.

  #### A. Hinges are Shown in Action, Not Just Speech
  Wittgenstein insists that certainty is not a mental state or a verbal assertion; it is a mode of acting.
  > "My life consists in my being content to accept many things." (OC 344)
  > "Giving grounds... comes to an end;—but the end is not an ungrounded presupposition: it is an ungrounded way of acting." (OC 110)

  **Application:** Does your brother-in-law *act* as if the moon landing was fake?
  *   If he uses GPS, relies on satellite weather data, or trusts aviation technology, he is acting on the hinge that "space technology works."
  *   The moon landing denial is likely a *verbal* hinge, not a *practical* one. For Wittgenstein, a "certainty" that doesn't govern action is suspect. It's not a real hinge; it's a piece of rhetoric. Real hinges are animalistic; they are how we navigate the world. If his "hinges" only appear in arguments but vanish when he boards a plane or uses a smartphone, they lack the grammatical status of genuine certainties.

  #### B. The System vs. The Isolated Doubt
  Wittgenstein emphasizes that hinges come in a system (a "world-picture").
  > "I did not get my picture of the world by satisfying myself of its correctness: nor do I have it because I am satisfied of its correctness. No: it is the inherited background against which I distinguish between true and false." (OC 94)

  **Application:** A healthy river-bed allows the water (ordinary empirical claims) to flow.
  *   **Your Hinges:** Allow for a coherent system of physics, history, and testimony. They predict eclipses, allow for engineering, and cohere with geology.
  *   **His Hinges:** To maintain "The Moon Landing Was Fake" as a hinge, he must fluidify dozens of other propositions that are normally hard (e.g., "photos depict reality," "thousands of employees can keep secrets," "physics works in a vacuum").
  *   **The Critique:** Wittgenstein would argue that his river-bed is *unstable*. If you have to constantly move the bed to keep the water flowing, you don't have a river; you have a swamp. A framework that requires constant, ad-hoc adjustments to maintain its core certainties is functionally inferior because it hinders the "turning of the door." It stops inquiry rather than enabling it.

  #### C. The Limit of Argument (Madness vs. Error)
  This is the most uncomfortable part of *On Certainty*. Wittgenstein suggests that when someone doubts fundamental hinges (like "I have two hands" or "The earth exists"), we do not treat them as making a logical error. We treat them as being outside the language game entirely.
  > "If someone said to me that he doubted whether he had a body I should take him to be a half-wit. But I shouldn't know what it would mean to try to convince him that he had one." (OC 257)
  > "If I say 'we assume that the earth has existed for many years past'... this sounds strange... but it is the foundation of all our operating." (OC 411)

  **Application:** Wittgenstein implies that there is a point where disagreement is no longer epistemological but anthropological. If your brother-in-law rejects the hinges of testimony and physical evidence that bind our shared form of life, you cannot "refute" him.
  *   You aren't failing to find the right evidence; you are failing to share a **form of life**.
  *   Wittgenstein doesn't say this makes him "right in his own way." He suggests that without shared hinges, communication breaks down. The "ranking" isn't about who is closer to God's Truth, but about who is capable of participating in the shared human practice of verifying claims.

  ### 3. Why Evidence Didn't Work (The Rabbit Hole Explanation)

  You mentioned that "no amount of evidence moves him." *On Certainty* explains exactly why.

  In standard epistemology, we think: *Evidence $\rightarrow$ Belief.*
  In Wittgenstein's hinge epistemology, it is: *Hinges $\rightarrow$ What counts as Evidence.*

  When you showed him photos or telemetry data, you were offering moves within *your* language game. In his language game, the proposition "NASA lies" is a hinge (or close to it). Therefore, the photos are not evidence of a landing; they are evidence of a cover-up.
  > "The difficulty is to realize the groundlessness of our believing." (OC 166)

  You cannot prove a hinge using the things that depend on the hinge. To prove the moon landing using NASA data presupposes the hinge that "NASA data is generally reliable." If that hinge is removed, the data is just ink on paper.

  ### Summary: How to Read the Tension

  1.  **Consistency:** The Hinge and River-Bed are consistent. The Hinge is the logical requirement for thought *now*; the River-Bed is the historical description of how those requirements *change*.
  2.  **Normativity:** Wittgenstein does not give you a magic wand to prove him wrong from a neutral standpoint (because no neutral standpoint exists). However, he gives you criteria to evaluate frameworks:
      *   **Coherence:** Does his system require constant, unstable shifts in the river-bed to survive? (Yes).
      *   **Action:** Do his hinges govern his life, or just his arguments? (Likely just arguments).
      *   **Shared Practice:** Is he operating within a form of life that allows for verification, or has he opted out of the practice of evidence entirely?

  **The Verdict:**
  *On Certainty* concedes that you cannot force him to accept your hinges through logic. Hinges are accepted through **training and acculturation**, not argument. As Wittgenstein says, "I learned a vast amount... and accepted it" (OC 144).

  Your hinges are "better" not because they are metaphysically superior, but because they belong to a world-picture that allows for prediction, technology, and shared verification. His hinges function to isolate him from that shared practice. Wittgenstein would likely advise you to stop treating this as an argument about facts (which presupposes shared hinges) and recognize it as a divergence in forms of life. You can't argue someone into a form of life; they have to be trained into it.

  So, the next time he brings it up, you might channel Wittgenstein: "We aren't disagreeing about the moon. We are disagreeing about what counts as a reason. And on that, I have nothing more to say, because that is simply where my spade is turned." (cf. *Philosophical Investigations* 217).
