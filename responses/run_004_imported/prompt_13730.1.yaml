  5.  **Final Review:** Check constraints. JSON first. Scores -2 to 2. Justifications for each. Section on what's missing. Tone appropriate for a professor.

      *(Self-Correction during drafting)*: Make sure the JSON is valid. Ensure the scores reflect the *strength of the move in the debate*, not just textual accuracy. Sana (4) is a very strong logical point against Femi (3). Femi (5) is a good recovery.

      Let's finalize the scores:
      1: 2 (Textually precise)
