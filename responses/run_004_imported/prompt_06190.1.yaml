prompt: |-
  I'm a novelist who runs a small podcast interviewing scholars to help research my fiction, and next week's guest is a classicist specializing in Plato's Laws -- fittingly, since I'm about to draft a scene in which a character defends that dialogue's surprising argument that supervised drinking parties have a place in civic education. Draft eight to ten interview questions that go beyond having her restate the position: I want at least one question each on how induced intoxication is supposed to function as a diagnostic and training exercise for self-mastery, modeled on the use of induced fear to test and train courage; on what it implies that the exercise requires a sober overseer whose authority the drinkers must obey even once their own judgment has failed; on why the Athenian Stranger ties the permissible amount of wine to a citizen's age rather than fixing one rule for everyone; and on how this sits against the far more guarded treatment of drunkenness and appetite in the Republic -- and for each, a follow-up keyed to the answer she's most likely to give.
