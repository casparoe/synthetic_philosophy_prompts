      *   *Check:* Is the distinction clear? *Correction:* Use the "Gambler vs. Puppeteer" analogy. Maya is a gambler betting on the user; a controller is a puppeteer moving the user.
      *   *Check:* Did I answer the specific question? "What actually makes them different?" *Correction:* Explicitly list the factors (Counterfactual possibility, Source of motivation, Risk).

