      *   **Justice & Natural Liberty:** Smith was a moral philosopher (*Theory of Moral Sentiments*). He speaks of "savage injustice." He believes in natural liberty and fair play.
      *   **Responsibility of Government:** The sovereign has a duty to protect justice and administer public works/institutions that benefit the whole.
      *   **Critique of Monopoly/Privilege:** He hates artificial advantages gained through state power (mercantilism). The colonial system was a monopoly that hurt the British public *and* the colonies.
