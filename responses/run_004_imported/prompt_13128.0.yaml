    },
    {
      "part": "c",
      "points_awarded": 3,
      "comment": "Good summary of the game setup, but incorrect conclusion on confidence. The paper implies willingness to shut down decreases as confidence increases; student claimed confidence does not matter."
    }
  ]
  ```

  ### Instructor's Note
  This is a strong paper. The student clearly grasps the Soares et al. formalism very well (parts a and b are flawless). The slip-up in part (c) is a common misconception—the Hadfield-Menell result is often oversimplified as "uncertainty solves corrigibility," when the more nuanced takeaway is "uncertainty allows corrigibility, but learning erodes uncertainty, so corrigibility is temporary." I'd recommend highlighting that distinction in feedback so they don't walk away thinking uncertainty is a permanent fix.
