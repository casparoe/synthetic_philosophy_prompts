answer: |-
  For those of you who don't know me, I'm the groom's older brother. And for the last two years, whenever [Groom] and [Bride] talked about getting married, our family dinners didn't sound like wedding planning. They sounded like a graduate seminar.

  Specifically, they sounded like [Groom] obsessing over something called "Kavka's Toxin Puzzle."

  For the half of you who are philosophers: yes, I know the setup. For the rest of you: imagine an eccentric billionaire offers you a million dollars. He says, "I will pay you tomorrow morning if, tonight, you genuinely *intend* to drink this nasty, harmless toxin tomorrow afternoon." Here's the catch: You don't actually have to drink it to get the money. You just have to intend to.

  The puzzle is that you can't win. Because once tomorrow comes, you either have the money or you don't. Drinking the stuff just makes you sick. So, a rational person knows they won't drink it. And if you know you won't drink it, you can't honestly intend to. So you never get the money. It's a loop about commitment and rationality.

  [Groom] has been worried about this loop for years. He worries about how you promise today to do something tomorrow, when tomorrow you might not feel like it.

  But standing here, watching the two of them, I think I finally have an answer to the puzzle. And it's the answer they're going to give in a few moments.

  The puzzle assumes you are alone. It assumes you are a rational agent calculating costs and benefits. But marriage isn't a calculation. It's a binding.

  When you say "I do," you aren't just predicting your future feelings. You are actively changing your future reasons. You are telling your future self: "It doesn't matter if I'm tired, or annoyed, or if the toxin looks nasty. I made a promise to *us*."

  [Bride], you brought [Groom] into philosophy. But today, [Groom], you get to show her that some things are more important than being rational.

  The philosophers in the back might say you can't intend to drink the toxin. But [Groom] and [Bride] are saying something braver. They are saying: "Even if the moment comes when it's hard, even when the rational choice is to walk away, we won't. Because the promise we made today is stronger than the logic of tomorrow."

  So, [Groom], you don't need a million dollars to form the intention. You just need her. And [Bride], you don't need to know if the toxin is harmless. You just need to know he's the one holding the glass.

  Let's get on with the vows.
