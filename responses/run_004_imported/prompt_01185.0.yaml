      Actually, the avalanche story is better. Let's call it "The Echo."
      Proposition: "My voice broke the ridge."

      *Wait, one more check on Nagarjuna:*
      Nagarjuna's tetralemma is often used to show that things lack inherent existence (svabhava).
      If X has inherent existence, it must be findable in one of the four corners.
      If none of the four corners hold, X is empty.
      So the story needs to show the character trying to find the "Truth" of the event, and failing to locate it in any of the four positions.

