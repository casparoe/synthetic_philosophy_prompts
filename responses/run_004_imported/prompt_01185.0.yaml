      - **Ending:** He steps out. No answer. Just the work of digging.

      *Refining the Collapse:*
      Nagarjuna's point isn't just "it's complicated." It's that the concepts themselves fail under analysis.
      - *Is:* If the shout is the cause, why didn't previous shouts cause it? If the cause exists inherently, it should always produce the effect.
      - *Is Not:* If the shout is not the cause, why did the effect follow immediately? Denying connection denies experience.
      - *Both:* If both are causes, there are two causes for one effect. Do they act together or separately? If together, they are one. If separately, each should suffice.
      - *Neither:* If neither, then the effect arises without cause. Chaos. But there is order.
      *Wait, I need to weave this into narrative, not logic textbook.*
      The character's *certainty* must collapse.

