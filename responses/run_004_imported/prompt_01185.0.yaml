      *   *Let's try:* **The status of a Boundary.** "Is this wall mine?"
      *   *Let's try:* **The status of an Injury.** "Did I hurt you?"
      *   *Decision:* **Did I hurt you?** (Specifically, emotional harm via silence). The protagonist is trying to determine if their silence constituted harm. This allows for subjective/objective tension.
      *   *Actually, let's make it more concrete:* **The status of a specific object's function.** "Is this key?" (It opens some doors, not others).
      *   *Better:* **The status of a Journey's End.** "Have I arrived?" (Perfect for Nagarjuna, who critiques motion).
      *   *Let's go with:* **The status of a Fire.** "Is the fire burning?" (Classic example in Madhyamaka). But needs to be story-driven.
      *   *Let's go with:* **The status of a Debt.** "Do I owe him?"
      *   *Let's go with:* **The status of a Verdict.** "Is he guilty?"
      *   *Okay, let's settle on:* **The status of an Action's Completion.** "Did I finish the work?"
