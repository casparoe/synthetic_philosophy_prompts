answer: |-
  This is a profound and unsettling moment, precisely because your colleague articulated one of the most durable problems in moral philosophy: the problem of **constitutive luck** and **ultimate responsibility**.

  Your colleague was essentially channeling Galen Strawson's "Basic Argument" (or perhaps a Rawlsian critique of natural assets). The logic is sound: if my character is the product of genetics and environment, and I did not choose those, then I am not *ultimately* responsible for my character. Therefore, I cannot be ultimately responsible for the actions that flow from that character. If this holds, "desert" in a deep metaphysical sense evaporates for everyone, not just the privileged.

  You felt reduced to "practical necessity" because, in the face of hard incompatibilism, practical necessity is often the only ground left. However, you do not need to retreat to mere pragmatism. There are principled ways to navigate this that preserve the distinction between grit and privilege without requiring you to solve the problem of free will on the spot.

  Here are three philosophical frameworks you can use to acquit yourself next time, ranging from the political to the metaphysical.

  ### 1. The Rawlsian Shift: From Moral Desert to Fair Equality of Opportunity
  Your colleague is correct that neither candidate *morally deserves* their traits in a cosmic sense. But John Rawls, who agrees with that premise, would still argue for prioritizing the second candidate.

  Rawls distinguishes between **moral desert** (what you inherently deserve) and **legitimate expectations** (what you are entitled to under just rules). He argues that natural talents and social starting points are "morally arbitrary." We don't deserve them. However, a just society is not one that ignores these arbitrarities, but one that mitigates their effects.

  **The Argument:**
  We are not rewarding the candidate for being a "better person" in the eyes of the universe. We are designing an institution to satisfy **Fair Equality of Opportunity**.
  *   Candidate A's achievement was *subsidized* by social contingency (wealth, schools).
  *   Candidate B's achievement was *resisted* by social contingency (poverty, instability).
  *   If we treat them as equal, we are effectively allowing social contingency to determine the outcome. By weighting the selection toward Candidate B, we are not rewarding "luck" over "luck"; we are **canceling out the distorting noise of social circumstance** to get a clearer measure of potential.

  **The Takeaway:** You aren't judging their souls; you are correcting for a biased measurement tool. Candidate B's transcript is a "noisier" signal. Adjusting for that noise is a principle of justice, not just mercy.

  ### 2. The Compatibilist Distinction: Circumstantial vs. Constitutive Luck
  Your colleague conflated two types of luck to make his point. Philosophers often distinguish between **constitutive luck** (who you are: temperament, intelligence) and **circumstantial luck** (what you face: obstacles, resources).

  While it is true that both candidates are subject to constitutive luck (neither chose their tenacity or their wealth), they are not equally subject to *friction*.

  **The Argument:**
  Agency is not about being an "unmoved mover" (which is impossible); it is about the relationship between an agent and their obstacles.
  *   Candidate A's will met little resistance. We cannot know how strong their will is because it was never stress-tested.
  *   Candidate B's will met significant resistance and prevailed.
  *   Even if the *capacity* for tenacity was lucky, the **exercise** of that capacity in the face of friction is a distinct factual event that Candidate A did not participate in.

  **The Takeaway:** We are not rewarding the *possession* of tenacity (which is luck); we are rewarding the *realization* of potential despite friction. In a graduate program, friction is guaranteed. Candidate B has a proven track record of navigating friction; Candidate A has only a track record of navigating ease. Betting on B is a principled inference about future performance, not a metaphysical judgment on past desert.

  ### 3. The Expressivist/Functionalist View: What is a Fellowship For?
  This is a refinement of your "practical necessity" argument, but given a principled coat. It asks: What is the social function of praise and reward?

  If the function of a fellowship is to recognize metaphysical moral worth, your colleague wins. But that is not what a fellowship is. A fellowship is a **forward-looking investment**.

  **The Argument:**
  Praise and reward are not merely backward-looking reports on causality; they are forward-looking tools for shaping a community.
  *   When we reward grit, we are signaling what traits the academic community needs to survive.
  *   Graduate school is a place of hardship, rejection, and uncertainty. The trait of "tenacity in the face of hardship" is instrumentally valuable to the institution.
  *   Candidate A has not demonstrated this specific instrumental value. Candidate B has.

  **The Takeaway:** You can tell your colleague: "You are treating this as a court of ultimate justice, where we judge the soul's origin. But this is a hiring committee. We are not asking 'Who is more holy?' We are asking 'Who is more likely to finish the dissertation?' The history of overcoming adversity is the best predictor we have for that."

  ### How to Handle the "Unsettling" Generalization
  You asked if this line of questioning ought to unsettle our ordinary practices of praising and blaming.

  The honest answer is: **Yes, it should, but not paralyze us.**
  If you accept your colleague's premise fully, it undermines retributive justice (punishment for crimes) and perhaps even meritocratic distribution. This is the "hard incompatibilist" bullet.

  However, most philosophers (and most people) are **compatibilists**. We accept that our choices are caused, but we maintain that choices caused by *our own internal reasoning processes* are different from choices caused by *external coercion*.
  *   Candidate A was not coerced, but their path was lubricated.
  *   Candidate B was not coerced, and their path was obstructed.

  The distinction remains meaningful even if determinism is true. The "self" that acts is still the locus of action, even if that "self" was formed by prior causes. To deny the distinction between "overcoming an obstacle" and "having no obstacle" is to make the concept of an "obstacle" meaningless.

  ### A Script for Next Time
  If this arises again, you might say something like this:

  > "I think my colleague is right that neither candidate chose their starting equipment, whether that's wealth or tenacity. If we are looking for 'ultimate moral desert,' neither of them has it.
  >
  > "But this committee isn't a tribunal of ultimate justice. We are stewards of an institution. Our goal is Fair Equality of Opportunity. Candidate A's achievements are deeply confounded by their privilege; we can't tell how much of their success is *them* and how much is their *environment*. Candidate B's achievements have been stress-tested against a hostile environment.
  >
  > "We aren't rewarding the luck of having tenacity. We are acknowledging that tenacity is the specific resource this program requires to succeed, and Candidate B has provided evidence of that resource under conditions where Candidate A has not. To ignore the friction Candidate B overcame would be to ignore the data we actually have."

  This allows you to concede the metaphysical point (which is strong) without surrendering the practical and political principle (which is necessary). It moves the debate from "Who is better?" to "What are we trying to do?"—which is where it belongs.
