prompt: |-
  My friend Priya and I got into a whole thing last night (three glasses of wine deep, so maybe not our finest philosophical hour) about whether I'm being irrational for keeping a big chunk of my savings in a boring diversified index fund plus a cash buffer, instead of putting more into the riskier stuff she's into, even though by her math the expected return on going heavier into the risky portfolio is clearly higher over a 20-year horizon. My whole point was that there's something rational about caring about the shape of the entire range of possible outcomes and not just the mean, and that this isn't just "loss aversion" or some behavioral bias I need to be talked out of. She said that's exactly the kind of thing behavioral econ has already debunked, and that real rationality just is maximizing expected utility, full stop, end of story.

  This morning I fell down a rabbit hole and found out there's an actual decision theory built around formalizing something like my side of this, called "risk-weighted expected utility," from a philosopher named Lara Buchak I think? Apparently it adds some kind of "risk function" on top of standard expected utility theory, and it gets brought up in discussions of stuff like why the same person might rationally buy both insurance and a lottery ticket, or the Allais paradox thing. I only skimmed a couple of summaries though so I dont really get the moving parts, like how big a departure it actually is from normal decision theory or what it costs you to adopt it.

  Could you go through the most important implications of risk-weighted expected utility theory for an argument like the one Priya and I had? I'm mainly trying to figure out two things: first, does this theory actually vindicate treating risk-aversion about the whole distribution of outcomes as rational in its own right, or is it more complicated than that once you look at what the theory has to give up to make room for the risk function; and second, what's genuinely different between "REU-style" risk aversion and just having a normal concave utility function (i.e. garden-variety diminishing marginal utility of money) - that's the exact point where Priya and I definately talked past each other.
