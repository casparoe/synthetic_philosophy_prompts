      *   *The "Cost":* Acknowledge the dynamic inconsistency issue. It's not a free lunch. It makes you vulnerable to certain kinds of exploitation *if* you aren't careful about planning.
      *   *Application to Investing:* How does REU apply to the 20-year horizon argument? Priya says "Law of Large Numbers, time in the market." REU says "I care about the sequence of returns risk or the specific worst-case tail, regardless of the mean."

