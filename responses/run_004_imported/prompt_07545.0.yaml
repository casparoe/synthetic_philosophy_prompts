      *   *Refining the "Concave Utility" point:* In EUT, if you reject a 50/50 bet to lose $100/gain $110, you must also reject a 50/50 bet to lose $1000/gain ∞. This is absurd. REU avoids this. This is the "Rabin Calibration Theorem" point. I must mention this as it destroys Priya's "just adjust your utility curve" argument.

