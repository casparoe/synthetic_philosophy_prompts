answer: |-
  **The Covenant and the Charter: Adjudicating the Douglass-Garrison Schism**

  The schism between William Lloyd Garrison and Frederick Douglass over the Constitution is often framed as a tactical disagreement: one man wanted to burn the system down, the other wanted to seize the levers of power. But as your book club intuited, this was a deeper jurisprudential fight. It was a debate over the nature of law itself. Is a legal document a historical artifact, bound by the sins and compromises of its drafters? Or is it a normative promise, defined by the capacity of its text to transcend its origins?

  To adjudicate this, we must strip away the moral posturing and look at the constitutional reasoning. Garrison argued from **historical intent and functional consequence**. Douglass, channeling Lysander Spooner, argued from **textual autonomy and principled potential**.

  While Garrison's reading is historically more accurate regarding the Framers' motivations, Douglass's mature position represents the superior piece of constitutional reasoning. Garrison offers a brilliant historical critique that leads to legal nihilism; Douglass offers a jurisprudence of redemption that saves the rule of law from being held hostage by original sin.

  ### The Case for the Covenant: Garrison's Pro-Slavery Compact

  Garrison's argument rests on a theory of constitutional interpretation that prioritizes **context and consequence** over strict textualism. For Garrison, a document cannot be understood in a vacuum; it must be understood by what it *did* and what its architects *meant* it to do.

  The strongest version of the Garrisonian indictment relies on the structural realities of the 1787 Convention. The Constitution was not handed down from heaven; it was a negotiated treaty between free and slave states. Garrison pointed to the "three-fifths clause" (Article I, Section 2), which boosted the political power of slaveholding states in the House and Electoral College. He pointed to the Fugitive Slave Clause (Article IV, Section 2), which mandated that free states actively participate in the recapture of human beings. He pointed to the Slave Trade Clause (Article I, Section 9), which forbade Congress from banning the importation of enslaved people for twenty years.

  Garrison's interpretive principle here is **functional realism**. He argued that the euphemisms ("Person held to Service," "other Persons") were not legal shields for liberty, but cowardly shrouds for property rights. If the text avoids the word "slave" to spare the conscience of the North while securing the property of the South, the silence is not an absence of authorization; it is a deliberate, coded ratification.

  Furthermore, Garrison leaned on the **Insurrection Clause** (Article I, Section 8), which authorized the use of the militia to "suppress Insurrections." In the context of the 1791 Haitian Revolution and constant fear of slave revolts, everyone knew this meant federalizing the suppression of slave uprisings.

  For Garrison, the Constitution was a "covenant with death" because its operational machinery required Northern complicity in Southern slavery. To vote under this Constitution was to swear an oath to uphold a pro-slavery order. His reasoning is sociologically robust: if the document functions to protect slavery, it *is* pro-slavery, regardless of what the preamble says.

  ### The Case for the Charter: Douglass's Liberty Document

  Douglass's mature argument, developed in his 1860 speech *"The Constitution of the United States: Is It Pro-Slavery or Anti-Slavery?"*, rests on a theory of **textual autonomy**. He concedes the historical point: the Framers were compromised men. But he argues that the law is not the men; the law is the text they ratified.

  Douglass's interpretive principle is **strict constructionism in service of liberty**. He notes that the Constitution nowhere establishes a "right to property in man." In a legal system based on English common law, property rights must be explicitly codified. By omitting the words "slave" and "slavery," the Framers did not merely hide their shame; they failed to grant the legal sanction necessary to hold human beings as property.

  Douglass leans heavily on the **Preamble** ("secure the Blessings of Liberty") and the **Fifth Amendment** (no person shall be deprived of life, liberty, or property without due process). His argument is that these are universal guarantees. If "Person" in the Fugitive Slave Clause means a human being, then "Person" in the Fifth Amendment must also mean a human being. You cannot have it both ways: you cannot define the escapee as a "Person" when you want to return him, and a "thing" when you want to hold him.

  This is where Spooner's influence is vital. Spooner argued that because slavery is a violation of natural law, no statute can authorize it unless it does so in explicit, undeniable terms. Ambiguity must always be resolved in favor of liberty. Therefore, the "evasiveness" Douglass identifies is not a pro-slavery compromise, but an anti-slavery firewall. The text creates a legal environment where slavery exists only as a local state anomaly, vulnerable to federal restriction and eventual extinction.

  Douglass's reasoning transforms the Constitution from a contract of compromise into a **charter of aspiration**. He argues that we are not bound by the secret intentions of the dead, but by the public words they enacted. If those words promise liberty, we are obligated to enforce that promise, even against the descendants of the Framers.

  ### The Verdict: Why Douglass Wins on Constitutional Theory

  This is the crux of the matter. If we are writing a history book, Garrison wins. The Framers *did* compromise. The Constitution *did* protect slavery in practice for 70 years. Garrison's reading is the superior *historical* analysis.

  But the prompt asks for the better *constitutional reasoning*. On that metric, **Douglass is unequivocally right, and Garrison is wrong.**

  Garrison's error is a category mistake: he conflates the Constitution with the political regime that operated under it. He judges the law by the behavior of the violators. By that logic, no law against murder is "anti-murder" if murders still occur. Garrison's interpretive method—binding the text permanently to the racist intentions of its drafters—leads to **constitutional nihilism**. If the sins of the founders invalidate the text, then the text has no authority. If the text has no authority, there is no law, only power. Garrison's position leaves abolitionists with no legal ground to stand on, only the ground of moral witness. It is a philosophy of exit, not engagement.

  Douglass, conversely, understands that a Constitution is a **performative speech act**. It does not describe the country as it is; it commands the country as it ought to be. His reasoning anticipates the modern distinction between "original intent" and "original public meaning," but pushes it further. He argues that the *textual silence* on slavery is legally load-bearing. By refusing to name slavery, the Constitution refused to normalize it as a national institution.

  Douglass's reading is superior because it acknowledges the **autonomy of law**. Once a law is ratified, it escapes the control of its authors. The words "We the People" and "Blessings of Liberty" belong to the citizens who inherit them, not the slaveholders who drafted them. Douglass realized that if he accepted Garrison's view, he conceded the Constitution to the slave power forever. By claiming the text, he turned the master's tools against the master's house.

  This was proven by history. The Garrisonian path led to disunion and moral purity, but it offered no legal mechanism to end slavery within the Union. The Douglassian path provided the legal architecture for the Republican Party, for Lincoln's Emancipation Proclamation (justified as a war measure under the Commander in Chief clause), and for the 13th, 14th, and 15th Amendments. Douglass didn't just wish for liberty; he found the legal hooks for it in the text.

  ### Conclusion

  Garrison was right that the Constitution was born in sin. But Douglass was right that it could be redeemed by its text.

  The verdict must land on Douglass because constitutional interpretation requires a commitment to the **potential of the text to constrain power**. Garrison's view makes the Constitution a prisoner of 1787; Douglass's view makes it a weapon for 1860 and beyond. To accept Garrison's reasoning is to admit that law is merely a reflection of existing power dynamics. To accept Douglass's reasoning is to affirm that law can be a higher standard that power must eventually meet.

  Douglass's "about-face" was not a betrayal of principle, but a deepening of it. He realized that calling the Constitution a "covenant with death" surrendered the future to the dead. By calling it a "glorious liberty document," he seized the future for the living. In the end, the Constitution is not what the Framers meant; it is what we can make it mean. On that crucial legal truth, Douglass stands alone.
