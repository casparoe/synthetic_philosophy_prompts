answer: |-
  This is a profound difficulty, and you have put your finger on the exact hinge where Borges's essay turns from analytic philosophy into metaphysical poetry. Many readers stumble at the same point: the move from "there is no thinker" to "there is no thinking in time" feels like a non sequitur unless one accepts a very specific, radical premise about the nature of relations.

  To assist your novelistic reconstruction, I will break this down into the logical mechanism of the refutation (the "how") and the existential function of the reversal (the "why").

  ### 1. The Logical Leap: From No-Self to No-Succession

  Your intuition is sound: in modern philosophy of mind, one could easily argue for an "ownerless sequence." One could say, "Perception A happens, then Perception B happens. No one needs to own them for the sequence to exist."

  However, Borges is working within a strict **Berkeleyan-Humean Idealism**, which carries a hidden premise about what constitutes a "sequence."

  **The Premise of Relations**
  For Berkeley and Hume, relations (such as causality, identity, or temporal succession) are not "out there" in the world. They are mental acts. To say "A comes before B" is not to observe a physical tether between two objects; it is an act of comparison performed by a mind.

  **The Atomization of the Present**
  Borges takes Hume's bundle theory to its atomic limit. If the self is nothing but a bundle of perceptions, and there is no underlying substance (no soul, no brain, no matter) to hold the bundle together, then the "self" at Moment 1 is fundamentally distinct from the "self" at Moment 2.
  *   **Moment 1:** A perception of heat. (This perception *is* the self).
  *   **Moment 2:** A perception of cold. (This perception *is* a new self).

  **The Collapse of Succession**
  Here is the critical inferential step: For succession to be real, there must be a **continuity of consciousness** that witnesses the transition from A to B.
  *   If the "I" of Moment 1 dies when Moment 1 ends, and the "I" of Moment 2 is born anew with Moment 2, there is no single entity that experiences the *flow*.
  *   Without a continuous observer, Moment 2 does not "follow" Moment 1; it simply *is*.
  *   Since "time" is defined as the relation of succession, and succession requires a mind to bridge the gap between discrete moments, the dissolution of the continuous self dissolves the bridge.
  *   **Result:** You are left not with a river of time, but with a scattered archipelago of isolated "Nows." Each "Now" is a self-contained universe. In a universe of isolated Nows, nothing changes, because change requires duration. If nothing changes, time does not exist.

  **Why not an "Ownerless Sequence"?**
  Borges would argue that a sequence without an integrator is a contradiction in terms. A sequence is a unity. If you remove the unifier (the self), you don't have a sequence; you have a heap. A heap of perceptions does not constitute time any more than a heap of bricks constitutes a house without the mortar of design. For Borges, time is not a container things sit in; it is a form of intuition (to borrow Kant's term) that requires a subject to intuit it. No subject, no form.

  ### 2. The Closing Reversal: Retraction or Transcendence?

  The ending of the essay (specifically the 1946 version, which is the standard text) is one of the most famous passages in Borges's oeuvre:

  > *"And yet, and yet... To deny temporal succession, to deny the self, to deny the astronomical universe, are apparent desperations and secret consolations... Time is the substance I am made of. Time is a river which sweeps me along, but I am the river; it is a tiger which destroys me, but I am the tiger; it is a fire which consumes me, but I am the fire."*

  This is not a logical retraction. Borges does not say, "My logic was wrong." He says, in effect, "My logic is valid, but life is stronger."

  **The "Secret Consolation"**
  Borges identifies the refutation of time as a "secret consolation." Why? Because if time is unreal, then death is unreal. If the self is an illusion, then the loss of the self is meaningless. Idealism is a defense mechanism against mortality. It is a intellectual fortress where death cannot enter.

  **The Existential Affirmation**
  When Borges concedes, "Time is the substance I am made of," he is shifting from **epistemology** (what we can know/prove) to **ontology** (what we feel/endure).
  *   He chooses the "terrifying" reality of time over the "comforting" illusion of eternity.
  *   He accepts that he is subject to decay, loss, and history, even if his intellect can deconstruct those concepts.
  *   The metaphor of the river/tiger/fire is pantheistic. He dissolves the dualism between subject and object not by denying the subject (as Hume did), but by expanding the subject to *be* the object. He *is* the time that destroys him.

  **What is this doing in the essay?**
  It transforms the essay from a puzzle into a tragedy. The structure is:
  1.  **Intellect:** I can prove I am immortal and time is false.
  2.  **Flesh:** I feel myself dying and time passing.
  3.  **Synthesis:** I accept the flesh over the intellect.

  For a novelist, this is the crucial emotional beat. It suggests that truth is not found in the coherence of an argument, but in the weight of an experience.

  ### 3. Implications for Your Novel

  Given your themes of recurrence and the dissolution of the self, Borges's maneuver offers a specific architecture for your characters:

  **The Trap of Recurrence**
  If your characters seek recurrence (Nietzsche's Eternal Return), they are seeking a way to make time circular so that nothing is lost. But Borges suggests that if the self is dissolved, recurrence is meaningless. If "I" am just a momentary perception, "I" cannot recur. Only the *pattern* recurs, but without a witness, the pattern is invisible.
  *   *Novelistic tension:* A character who intellectually understands the dissolution of the self but emotionally cannot bear the loss of their own continuity.

  **The Logic vs. The Wound**
  You can structure your narrative around the gap Borges identifies.
  *   **Act I:** The character constructs a worldview where time/self is an illusion (perhaps to cope with trauma or grief). This is the "Refutation."
  *   **Act II:** The character lives within this logic, finding it cold and sterile.
  *   **Act III:** The "And yet..." moment. The character accepts the pain of time and the reality of the self, not because it is logically provable, but because it is the only way to make their suffering meaningful.

  **The "Ownerless Sequence" as Horror**
  You mentioned the "ownerless sequence." In a horror or speculative context, this is a terrifying state. Imagine a character who *achieves* the state Borges describes logically: they perceive moments without connection. They do not remember the past; they only inhabit the present. They are immortal, but they are also dead. This could be the fate of a character who succeeds too well in dissolving their self.

  ### Summary for your Preparation

  1.  **The Logic:** Time requires a unifier. If the self is just discrete perceptions, there is no unifier. Without a unifier, there is no succession. Without succession, there is no time. (It relies on the idea that relations are mental, not physical).
  2.  **The Reversal:** It is not a logical failure but an existential choice. Borges rejects the "consolation" of idealism in favor of the "terror" of reality. He chooses to be mortal.
  3.  **The Theme:** The dissolution of the self is intellectually defensible but existentially intolerable. The "I" is a fiction we must believe in to suffer, love, and die.

  Borges is ultimately telling you that while the labyrinth of time can be deconstructed, the Minotaur inside it (death/change) is real. Your novel might explore what happens when a character tries to starve the Minotaur with logic, only to find it still waiting in the dark.
