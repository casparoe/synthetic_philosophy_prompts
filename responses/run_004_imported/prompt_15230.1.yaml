  2.  **Deconstruct the Philosophy:**
      *   *Money Pump:* Cyclical preferences leading to exploitation/loss.
      *   *Diachronic Rationality:* Rationality over time, not just in the moment.
      *   *Naive:* Doesn't see the trap. Follows immediate preference. Gets pumped.
      *   *Sophisticated:* Sees the trap. Plans around future self's weakness. Might avoid the deal entirely or bind hands.
      *   *Resolute:* Makes a plan. Sticks to it even when future self wants to deviate. Trusts the past commitment over the present whim.

  3.  **Map Philosophy to Marriage:**
      *   *Naive:* "We'll just see how it goes." "Love is a feeling." (Risky, vulnerable to life's ups and downs).
      *   *Sophisticated:* "Marriage is a contract. We need prenups and exit clauses because people change." (Cynical, protective, but maybe lacks the leap of faith).
