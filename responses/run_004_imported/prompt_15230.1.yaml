          *   *Resolute:* The sweet spot. Keeping a promise *because* it was made.
      *   **Application to the Couple:** How do the bride and groom fit the "Resolute" model? It's not about ignoring feelings, but binding oneself to a path.
      *   **Conclusion:** Raise a glass. Tie it back to love as a rational commitment over time.

  5.  **Refining the Tone:**
      *   *Avoid:* "As my sister argues in chapter 4..." (Too academic).
