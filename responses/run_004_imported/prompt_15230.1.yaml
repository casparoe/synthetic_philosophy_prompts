answer: |-
  Good evening. For those who don't know me, I'm the brother of the bride. I'm also a software engineer, which means I spend my days telling computers exactly what to do, while my sister spends her days asking why humans do what they do.

  For the last decade, family dinners have been… educational. While most sisters talk about their dating life, [Sister's Name] talked about "diachronic rationality." While most people worry about being exploited in a relationship, she worries about being exploited by a sequence of rational choices. Specifically, she studies the "money pump."

  For the half of the room currently checking their watches: don't worry. I'm not going to give a seminar. But the basics are actually quite simple. A money pump happens when you prefer A to B, B to C, and C to A. If you just follow your preferences in the moment, someone can trade you in a circle, charging you a fee every time, until you have nothing left. You made a "rational" choice at every step, but you ended up ruined.

  For the philosophers in the room: you know the trilemma. For the rest of you: the lesson is that being rational *right now* doesn't guarantee you'll be okay *later*.

  [Sister's Name] argues there are three ways to handle this over time.

  First, there's the **Naive** agent. The Naive agent lives entirely in the present. They think, "I prefer this option right now, so I'll take it." They don't anticipate that their preferences will change tomorrow. In love, the Naive agent says, "Follow your heart." It sounds romantic. But if your heart changes direction every time things get difficult, or every time someone slightly more attractive walks into the room, you get pumped. You trade your relationship for a moment of excitement, then trade that for comfort, then trade that for nostalgia, until you've lost the person you actually wanted to be with.

  Second, there's the **Sophisticated** agent. The Sophisticate sees the trap coming. They know their future self might be weak or fickle. So, they plan around it. They bind their hands. In love, the Sophisticate says, "Marriage is a contract. We need exit clauses, prenups, and contingency plans because people change." It's safe. It's logically sound. But it lacks a certain… trust. It assumes your future self is an adversary you need to outsmart.

  And then, there's the **Resolute** agent. This is my sister's favorite. The Resolute agent makes a plan when they are clear-headed and calm, and they stick to it even when their future self wants to quit. They don't ignore their new feelings; they just don't let those feelings veto the promise.

  When I look at [Sister's Name] and [Partner's Name], I don't see Naive optimism. They know life is hard. They know preferences change. I don't see pure Sophistication, either. They aren't standing here hedging their bets.

  I see Resoluteness.

  To the non-philosophers: this is what those vows actually are. They aren't a description of how you feel today. If they were, you wouldn't need to say them; you'd just feel them. The vows are a technology for time travel. They are a message from your current, clear-headed selves to your future, tired, stressed, confused selves.

  There will be days when one of you is the Naive agent, wanting to abandon ship because the seas are rough. There will be days when one of you is the Sophisticated agent, calculating the cost of staying versus leaving.

  But the promise you make today is a Resolute one. It says: "I am choosing a path, and I will not be pumped out of it by the temporary preferences of a Tuesday afternoon." It is the understanding that being rational over a lifetime sometimes means ignoring the "rational" choice of the moment.

  [Sister's Name], you've spent five years proving that Resoluteness is the only way to avoid being exploited by time itself. [Partner's Name], you have signed up to be the co-pilot in that project.

  So, if I could ask everyone to raise a glass.

  To the Naive, may you find joy in the moment.
  To the Sophisticated, may you find safety in your plans.
  But to the Bride and Groom: May you be Resolute. May you honor the promises you make today, especially on the days when your future selves would prefer to break them. May you never be pumped for value, but always enriched by time.

  To [Sister's Name] and [Partner's Name].
