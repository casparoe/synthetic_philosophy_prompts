          *   *Correction:* The limitation is that the chain must terminate or the agents become too weak to perform useful tasks. The student says "lineage... can keep doing this indefinitely." This is factually incorrect regarding the standard ordinal hierarchy limitation in this context.
          *   *Score:* Strategy described well, but the limitation analysis is flawed/optimistic. They were asked to note a limitation, and they essentially said "there isn't really one because ordinals go on forever." (Constructive ordinals don't, and practical utility does). 3/5.

  4.  **Drafting the Feedback:**
      *   Need to be encouraging but precise. The TA is shaky, so the feedback needs to explain *why* the grade is what it is so the TA can learn too.
