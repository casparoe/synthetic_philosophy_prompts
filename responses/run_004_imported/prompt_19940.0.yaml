  ### TA-to-TA Advice
  Since you mentioned you're feeling shaky on the material:
  1.  **Löb vs. Gödel:** Remember that Gödel II says "I can't prove I'm consistent." Löb says "I can't even prove that 'if I prove it, it's true' unless I already prove it." Löb is the stronger claim.
  2.  **The Ordinal Problem:** In AI safety (specifically the MIRI/FLI tiling agents work), the big headache is that if Agent 1 trusts Agent 2 because Agent 2 is *weaker*, and Agent 2 trusts Agent 3 because Agent 3 is *weaker*, eventually you get an Agent $N$ that is too stupid to be useful. You can't make an infinite chain of *useful* agents this way. The student missed this, which is why I docked points heavily there.

