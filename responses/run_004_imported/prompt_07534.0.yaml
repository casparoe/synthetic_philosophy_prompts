prompt: |-
  My nephew's bar mitzvah is coming up and I got roped into giving the d'var torah (little speech on that week's torah portion) since apparently being able to debug production code at 2am makes me "the smart one" in this family. His portion is Vayikra, which is basically all animal sacrifice laws, so I went down a rabbit hole and found out Maimonides argued in the Guide for the Perplexed that sacrifices were basically a concession — God meeting the Israelites where they were and weaning them off the idol-sacrifice habit everyone around them had, kind of like weaning a baby off milk. Except in his other major book, the Mishneh Torah, he says flat out that the messiah is going to rebuild the Temple and we'll go back to literally sacrificing animals, no metaphor about it. My grandma says that exact prayer every week and means it completely literally, and shes going to be sitting in the front row. My cousin who did a few years of yeshiva will also be there and will absolutely catch it if I fudge this. Can you write me something around 5 minutes long that's honest about that tension, without turning into "ancient people just needed training wheels" (kind of rude to grandma) or some sanded-down "it's all just symbolic" version that isn't really what's going on?
