  so from what i understand, split-brain patients (people who've had their corpus callosum severed) end up with two fully separate conscious minds in one head, each aware and thinking independently, and thats just permanently how they are after the surgery. doesn't that basically settle the unity of consciousness debate -- i.e. prove our normal sense of being "one mind" is really just two minds wired together, and we only feel unified because the corpus callosum stitches two selves into one? kinda surprised philosophers still argue about this when the split-brain evidence already seems to answer it.
