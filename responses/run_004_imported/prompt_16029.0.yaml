answer: |-
  You have raised a very common and intuitive objection to Schellenberg's argument. It is excellent that you are looking closely at the premises. However, there are a few crucial nuances in Schellenberg's formulation that address your concern directly. Philosophers take the argument seriously not because they think atheism has always been the majority view, but because of how Schellenberg defines **God**, **belief**, and **nonbelief**.

  Here is a breakdown of why your objection, while logical on the surface, doesn't quite land on Schellenberg's specific argument, and why the argument remains a potent challenge to theism.

  ### 1. The Definition of "God" Matters
  Your objection rests on the idea that belief in a "higher power" has been the norm throughout history. Schellenberg would agree with that statistic, but he would argue it is irrelevant to his premise.

  Schellenberg's argument is not directed at belief in *any* divine force, spirit, ancestor, or karma. It is directed specifically at the **God of classical theism**: a personal, omnipotent, omniscient, and **perfectly loving** being.

  *   **Historical Context:** For much of human history, people believed in polytheistic pantheons, capricious spirits, or impersonal cosmic forces. Belief in a *single, perfectly loving personal Father* who desires a reciprocal relationship with every human is a specific theological claim (mostly associated with Judaism, Christianity, and Islam).
  *   **The Mismatch:** A person in ancient Greece who believed in Zeus, or a person in traditional animist cultures, does not count as a "believer" in the context of Schellenberg's argument. They did not believe in the specific God whose existence is being tested. Therefore, the fact that "religiosity" is common does not mean "belief in the perfectly loving God of theism" is universal.

  ### 2. "Non-Resistant Nonbelief" vs. Simple Atheism
  This is the most important philosophical distinction in Schellenberg's work. You are interpreting the argument as relying on the *number* of atheists. Schellenberg actually argues from the *existence* of a specific *kind* of nonbeliever.

  He distinguishes between:
  *   **Resistant Nonbelief:** People who actively reject God, hate God, or ignore evidence because they don't *want* God to exist.
  *   **Non-Resistant Nonbelief:** People who are open to a relationship with God, seek the truth, and would believe if they found adequate evidence, but simply cannot find it.

  Schellenberg's core premise is not "Most people don't believe." It is: **"There exist people who do not believe through no fault of their own."**

  Even if 99% of humanity believed in God, if there is even *one* sincere seeker who wants to love God but finds only silence, Schellenberg argues this is incompatible with a "perfectly loving" God. A perfectly loving parent does not hide from a child who is crying out for them. Therefore, the existence of *any* non-resistant nonbelievers is the problem, not the statistical majority.

  ### 3. Belief vs. Relationship
  Schellenberg emphasizes that the goal of a perfectly loving God would not merely be intellectual assent (believing "God exists" is true). The goal would be a **conscious, meaningful relationship**.

  Many philosophers of religion point out that throughout history, even within theistic cultures, many people have held a nominal belief in God without ever experiencing a conscious relationship with the Divine. They may believe God exists because their culture tells them so, but they lack the experiential knowledge of God's love that Schellenberg argues a loving God would make available to all.

  If a person lives in a theistic culture but feels spiritually abandoned, confused, or unable to pray to a God they cannot sense, they functionally fit the category of "hiddenness" victims, even if they technically check the box for "religious."

  ### 4. The Modern Context Strengthens the Premise
  While your historical point has merit regarding ancient anthropology, the premise of the argument is arguably stronger today than in the past.

  *   **Secularization:** In the modern era, explicit nonbelief (atheism, agnosticism, secular humanism) is not a rare minority phenomenon. In many highly developed nations, non-religious populations are the majority or a very large plurality.
  *   **Access to Information:** We live in an age of information. If God wanted to be known, the argument goes, the digital age provides unprecedented means for revelation. The fact that nonbelief is thriving in an age of connectivity makes the "hiddenness" more pronounced, not less.

  ### 5. Why Philosophers Take It Seriously
  Philosophers treat this as a serious challenge for three main reasons:

  1.  **It Internalizes the Critique:** Unlike the Problem of Evil, which attacks God's goodness from the outside, the Argument from Hiddenness uses the theist's own definition of God (Perfect Love) to show a contradiction. It says, "Given *your* definition of God, this state of affairs shouldn't exist."
  2.  **It Shifts from Pain to Love:** The Problem of Evil asks, "Why is there suffering?" Theists often have robust defenses for this (free will, soul-making, etc.). The Argument from Hiddenness asks, "Why is there silence?" It is harder to argue that silence is necessary for free will or soul-making than it is to argue that pain is.
  3.  **It Addresses Soteriology (Salvation):** If a relationship with God is necessary for the ultimate good (salvation/enlightenment/heaven), then divine hiddenness effectively bars people from that ultimate good through no fault of their own. This creates a tension with the idea of a just and loving God.

  ### Summary
  Your intuition that "humans are generally religious" is correct, but Schellenberg's argument is more precise. He is not arguing that humans don't believe in *spirits*; he is arguing that humans cannot find the *specific, perfectly loving God of theism* despite looking.

  Because "non-resistant nonbelief" clearly exists (even if it isn't the majority), and because a perfectly loving being presumably would prevent even a single instance of such isolation, philosophers view this as a logically valid and emotionally resonant challenge to classical theism. It forces theists to explain not why people hate God, but why God remains obscure to those who love Him.
