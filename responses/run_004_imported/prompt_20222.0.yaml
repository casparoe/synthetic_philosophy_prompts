      *   *Addressing the "Enormous Surplus":* Moore doesn't necessarily give a causal mechanism (that would be naturalistic). He claims it's an intuitive truth. However, the philosophical payoff is that it blocks hedonism (pleasure alone isn't the sole good) and intellectualism (truth alone isn't the sole good). It requires the *union*.

  3.  **Deconstruct Problem 2: The Isolation Test (Uninhabited Worlds):**
      *   *The Thought Experiment:* Beautiful world vs. Ugly world, no observers. Which is better?
