answer: |-
  This is a compelling topic for a graduate term paper. Harsanyi's Aggregation Theorem (1955) is indeed one of the most significant formal results in social choice theory and moral philosophy. It provides a bridge between individual rationality (VNM expected utility) and social rationality (Utilitarianism).

  However, to write a successful **graduate-level** paper, you must navigate a specific tension. While your proposed thesis (that the theorem forces non-utilitarians into irrationality) is a standard interpretation of Harsanyi's own view, the contemporary literature is rich with objections that challenge whether the axioms truly capture "rationality" in a moral context. If you present the argument as settled fact without acknowledging the specific points of contention, you risk overlooking the very debates your professor likely expects you to engage with.

  Below, I have laid out the argument rigorously as you requested, formalizing the premises and the derivation. Following that, I have included a section on **"Critical Vulnerabilities"** which you should address to ensure your paper is robust. A strong paper doesn't just state the argument; it anticipates where the opposition will dig in and explains why their resistance fails (or requires a high cost).

  ---

  ### Part 1: The Formal Argument for Utilitarianism via Harsanyi's Theorem

  To argue that non-utilitarian theories are committed to technical irrationality, you must first establish that the axioms leading to Utilitarianism are constitutive of rationality itself.

  #### 1. The Framework
  Let $I = \{1, \dots, n\}$ be a set of individuals.
  Let $X$ be a set of certain social outcomes.
  Let $L$ be a set of lotteries (probability distributions) over $X$.
  Let $\succeq_i$ denote individual $i$'s preference ordering over $L$.
  Let $\succeq_S$ denote the social preference ordering over $L$.

  #### 2. The Premises (The Axioms of Rationality)

  **Premise 1: Individual Rationality (VNM Axioms)**
  For every individual $i \in I$, the preference relation $\succeq_i$ satisfies the von Neumann–Morgenstern axioms:
  *   **Completeness:** For all $p, q \in L$, either $p \succeq_i q$ or $q \succeq_i p$.
  *   **Transitivity:** For all $p, q, r \in L$, if $p \succeq_i q$ and $q \succeq_i r$, then $p \succeq_i r$.
  *   **Continuity:** For all $p, q, r \in L$, if $p \succ_i q \succ_i r$, there exists a probability $\alpha \in (0,1)$ such that $q \sim_i \alpha p + (1-\alpha)r$.
  *   **Independence:** For all $p, q, r \in L$ and $\alpha \in (0,1]$, $p \succ_i q \iff \alpha p + (1-\alpha)r \succ_i \alpha q + (1-\alpha)r$.

  *Implication:* By the VNM Representation Theorem, for each $i$, there exists a utility function $u_i: X \to \mathbb{R}$ unique up to positive affine transformation such that $p \succeq_i q \iff E[u_i(p)] \geq E[u_i(q)]$.

  **Premise 2: Social Rationality (VNM Axioms)**
  The social preference relation $\succeq_S$ also satisfies Completeness, Transitivity, Continuity, and Independence over $L$.

  *Implication:* There exists a social utility function $W: X \to \mathbb{R}$ such that $p \succeq_S q \iff E[W(p)] \geq E[W(q)]$.

  **Premise 3: The Pareto Principle (under Uncertainty)**
  This is the bridge between individual and social rationality.
  *   **Weak Pareto:** If for all $i \in I$, $p \succ_i q$, then $p \succ_S q$.
  *   **Indifference:** If for all $i \in I$, $p \sim_i q$, then $p \sim_S q$.

  *Ethical Justification:* If every individual agrees that one prospect is better than another (given their own interests), it is irrational (or authoritarian) for the social planner to disagree.

  #### 3. The Derivation (Harsanyi's Aggregation Theorem)

  **Theorem:** If Premises 1, 2, and 3 hold, then the social utility function $W$ must be a linear combination of individual utility functions $u_i$.

  **Proof Sketch:**
  1.  Since $\succeq_S$ and all $\succeq_i$ satisfy VNM, they can be represented by expected utility functions.
  2.  Consider the vector of individual expected utilities for any lottery $p$: $V(p) = (E[u_1(p)], \dots, E[u_n(p)])$.
  3.  The Pareto Principle implies that the social ordering respects the ordering of these vectors. Specifically, if $V(p) > V(q)$ (component-wise), then $W(p) > W(q)$.
  4.  Mathematically, this structure forces $W$ to be linear in the $u_i$'s. If $W$ were non-linear (e.g., concave to represent egalitarianism), one could construct lotteries that satisfy Pareto for individuals but violate the social ordering, or vice versa.
  5.  Therefore, there exist constants $a_1, \dots, a_n$ and $b$ such that for all $x \in X$:
      $$W(x) = \sum_{i=1}^n a_i u_i(x) + b$$
      Where $a_i \geq 0$.

  #### 4. The Conclusion: Utilitarianism
  By normalizing the utility functions (setting zero points and units), the social welfare function becomes a weighted sum of individual utilities. If we assume equal moral weight (a separate ethical premise often added to Harsanyi's formal result), $a_i = a_j$ for all $i,j$.
  $$W(x) = \sum_{i=1}^n u_i(x)$$
  This is the definition of **Classical Utilitarianism**.

  #### 5. The Charge of Irrationality
  Your thesis rests on the claim that critics (prioritarians, egalitarians) must reject one of the premises to avoid this conclusion.
  *   **If they reject Individual VNM:** They claim individuals are irrational to maximize expected utility (e.g., they prefer Allais-paradox style choices). This undermines standard decision theory.
  *   **If they reject Social VNM:** They claim the *society* should not maximize expected social value. This implies the social planner should accept "money pumps" or dominated strategies at the aggregate level.
  *   **If they reject Pareto:** They claim that even if *everyone* is better off in expectation, the social planner might rationally prefer the worse option. This is a very hard pill to swallow, as it implies paternalism or anti-welfarism.

  Therefore, the non-utilitarian is forced to admit that their theory requires violating standard norms of rational choice.

  ---

  ### Part 2: Critical Vulnerabilities (Essential for a Graduate Paper)

  To receive a high grade, you cannot simply present the above as uncontested truth. You must demonstrate awareness of *why* philosophers reject the conclusion. You can argue these objections fail, but you must state them.

  #### 1. The Ex Ante vs. Ex Post Pareto Conflict
  This is the strongest objection (associated with Peter Diamond and Amartya Sen).
  *   **The Problem:** Harsanyi's theorem relies on *Ex Ante Pareto* (if everyone prefers the lottery, society prefers the lottery). However, Egalitarians care about *Ex Post* outcomes (the actual distribution of welfare after the risk is resolved).
  *   **Diamond's Example:** Imagine two people and one indivisible good (a life-saving drug).
      *   Option A: Give to Person 1 (deterministic).
      *   Option B: Give to Person 2 (deterministic).
      *   Option C: Flip a fair coin.
      *   Individuals prefer C over A or B (Ex Ante, they get a 50% chance of life).
      *   But Ex Post, C results in one person dying and one living, just like A and B. An egalitarian might argue C is fairer, but Harsanyi's theorem treats C as strictly better because of the Ex Ante preference.
  *   **Counter-Strategy for your paper:** Argue that *Ex Ante* Pareto is the only version of Pareto compatible with respecting individual sovereignty under uncertainty. To reject it is to say individuals are mistaken about their own good under risk.

  #### 2. The Comparability of Utility
  Harsanyi's theorem assumes individual utility functions $u_i$ are cardinally measurable and comparable enough to be summed.
  *   **The Objection:** VNM utilities are unique only up to positive affine transformation ($u' = au + b$). The "weights" $a_i$ in the aggregation formula depend on how we scale these functions. Without an independent theory of interpersonal utility comparison, the theorem yields "Weighted Utilitarianism" where weights are arbitrary.
  *   **Counter-Strategy:** Argue that in the "veil of ignorance" formulation (Harsanyi 1953), rational agents would choose identical scaling, effectively solving the weighting problem.

  #### 3. State-Dependent Preferences
  The theorem assumes preferences depend only on the outcome, not the state of the world.
  *   **The Objection:** If my utility depends on whether I am alive or dead, or who I am, the linear aggregation might fail or require modification.
  *   **Counter-Strategy:** Argue that for the purpose of *social policy*, we should abstract from idiosyncratic state-dependence to find a common metric of welfare.

  #### 4. Mongin's Critique (The "Spurious Generality")
  Philippe Mongin (1994) argued that Harsanyi's theorem is mathematically valid but ethically empty because the "weights" can absorb almost any ethical theory.
  *   **The Objection:** If you can adjust the weights $a_i$ based on who is worse off, you can mimic Prioritarianism within the weighted sum structure.
  *   **Counter-Strategy:** Distinguish between *weights based on identity* (which is still utilitarian) and *weights based on utility levels* (which violates the linearity required by the VNM social axioms). If the weight changes as the utility level changes, the function is non-linear, violating Social Independence.

  ---

  ### Part 3: Suggested Thesis Statement

  To make your paper nuanced yet strong, consider a thesis that acknowledges the burden of proof rather than claiming absolute closure.

  > **Draft Thesis:** "While Harsanyi's Aggregation Theorem does not logically preclude non-utilitarian theories, it demonstrates that such theories incur a heavy 'rationality cost.' By showing that Utilitarianism is the unique consequence of combining Individual Rationality, Social Rationality, and the Pareto Principle, Harsanyi forces critics to explicitly defend the rejection of standard decision-theoretic axioms. This paper argues that rejecting these axioms—particularly the Pareto Principle under uncertainty—undermines the coherence of social choice to a greater degree than accepting the counter-intuitive implications of Utilitarianism."

  ### Summary of Advice for the Paper
  1.  **Formalize Early:** Use the notation provided in Part 1 to show technical competence.
  2.  **Define "Irrationality":** Be precise. You mean "violation of VNM axioms," not "stupidity."
  3.  **Address Diamond:** You cannot ignore the Diamond (1967) critique in a graduate paper on this topic. Addressing it and arguing why Harsanyi's Ex Ante approach is superior will strengthen your position.
  4.  **Distinguish Weights:** Clarify that Weighted Utilitarianism is still Utilitarianism in the structural sense (additive), even if it isn't Classical Utilitarianism (equal weights).

  This approach allows you to make the strong argument you want to make while demonstrating the critical awareness expected at the graduate level.
