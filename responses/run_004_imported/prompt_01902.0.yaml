answer: |-
  This is one of the best "wait, hold on" moments in modern social science, and your intuition is spot on: it feels like a glitch in the matrix because it exposes a language barrier between physics and economics.

  Since you're a backend engineer, I'm going to skip the econ jargon and explain this using system architecture, because the core disagreement is actually about **concurrency vs. sequential processing.**

  Here is the breakdown you can use over drinks.

  ### 1. The Bug Report: Ensemble vs. Time
  The coin flip example you cited is the "Hello World" of ergodicity economics.
  *   **Heads:** Wealth $\times 1.5$
  *   **Tails:** Wealth $\times 0.6$

  **The Ensemble Average (Parallelism):**
  Imagine you spin up 1,000 containers (people). Each flips the coin *once*.
  500 containers get $\times 1.5$, 500 get $\times 0.6$.
  Average multiplier: $(1.5 + 0.6) / 2 = 1.05$.
  **System Status:** Healthy. Average wealth grows 5% per round.

  **The Time Average (Sequential):**
  Imagine you spin up *one* container. It flips the coin 1,000 times *in a row*.
  Because multiplication is compounding, the order doesn't matter, but the *count* does. You will get roughly 500 heads and 500 tails.
  Your wealth is multiplied by $1.5^{500} \times 0.6^{500} = (1.5 \times 0.6)^{500} = 0.9^{500}$.
  **System Status:** Critical Failure. $0.9^{500}$ is effectively zero.

  **Peters' Point:** Mainstream economics often calculates the **Ensemble Average** (what happens across a population) and assumes it applies to the **Time Average** (what happens to one person over a lifetime).
  In physics, a system where "Average across space = Average across time" is called **Ergodic**.
  Peters says: Wealth creation is **Non-Ergodic**. Therefore, using Ensemble averages to make decisions for a single life is a category error. It's like looking at the average depth of a river (3 feet) and deciding it's safe to cross, ignoring that the middle is 10 feet deep and you will drown.

  ### 2. The Claim: "Objective Rationality"
  This is where the fight starts.

  **Peters' Claim:**
  Since we all live in time (sequentially), not in parallel universes, the only math that matters for decision-making is the Time Average growth rate.
  If a bet has a positive Ensemble Average but negative Time Average, taking it is **objectively irrational**, regardless of your "risk preference." It's not that you are "risk-averse"; it's that you are mathematically guaranteed to go broke.
  Therefore, maximizing the geometric mean (Kelly betting) isn't a "preference" for log-utility; it is the physics of survival.

  **Samuelson's Claim (The Mainstream Defense):**
  Samuelson (and most economists) argue that "Rationality" isn't about maximizing wealth; it's about maximizing **Utility** (satisfaction/outcome).
  Utility is subjective.
  *   **Scenario A:** You are poor. You need \$10 million to save your kid's life. A slow, steady Kelly strategy will take 50 years. You don't have 50 years. You need a moonshot. Taking the "negative time-average" bet is actually the *rational* choice because the "safe" bet fails your specific goal.
  *   **Scenario B:** You have finite time. You aren't playing infinite rounds. If you only play 5 rounds, the Ensemble Average might actually be a better predictor of your outcome than the long-run Time Average.

  Samuelson's one-syllable paper was essentially saying: *"Just because the log strategy wins in the long run does not mean it gives you the most happiness. You might prefer a high chance of being mediocre over a low chance of being a god."*

  ### 3. The Engineer Analogy
  Here is how you explain the disagreement to your friend:

  Imagine you are designing a database cluster.

  **Peters is the SRE (Site Reliability Engineer):**
  He says, "We cannot look at the average throughput across 1,000 nodes if a single node crashing wipes out the whole customer session. We must optimize for the single sequential user journey. If the 99th percentile latency causes a timeout, the 'average' performance is irrelevant. We must prevent 'ruin' (downtime) at all costs."
  *   **Philosophy:** Survival is the prerequisite for everything else. Don't blow up the production environment.

  **Samuelson is the Product Manager:**
  He says, "I understand the risk of downtime. But if we play it too safe (Kelly), we grow too slowly and a competitor will eat us. Some users are willing to accept a higher crash rate in exchange for a chance at 10x feature speed. That is a valid business requirement. You can't say their requirement is 'objectively wrong' just because it risks a crash."
  *   **Philosophy:** Optimization depends on the goal function (Utility), which varies by user.

  ### 4. So, is it a deep hole or just dressing?
  It's a bit of both.

  **Where Peters is Right (The Deep Hole):**
  He successfully exposed that economics has been sloppy with its language. For decades, textbooks treated "Expected Value" as the default metric for rationality without explicitly stating the assumption that the process is ergodic.
  In fields like finance and risk management, Peters' critique is huge. It validates why "Risk of Ruin" matters more than "Expected Return." It explains why leverage kills you even on positive EV bets. He forced economists to admit that **time matters.**

  **Where Peters is Overreaching (The Dressing):**
  He claims he has solved the "foundations of economics" by proving Kelly is *objectively* rational.
  Most economists think this is a category error.
  *   **Physics vs. Preferences:** Physics tells you what *will* happen (wealth goes to zero). Economics tells you what you *should do* given what you want. If I want to gamble for a Hail Mary because I'm desperate, physics says I'll likely lose, but economics says my choice is still "rational" relative to my utility function.
  *   **The "Log" Assumption:** Peters argues that because time-average growth equals log-utility growth, everyone *should* have log utility. Economists argue: "No, some people have S-shaped utility functions, some have linear, some have binary (all-or-nothing). Log is just one shape."

  ### The Drink-Summary
  If you're explaining this at a bar, say this:

  > "Peters found a real bug in how economists talk about risk. They were using 'average outcome across a crowd' to predict 'outcome for one person over time,' which is mathematically wrong for compounding systems. He's right that this leads to dangerous risk-taking.
  >
  > But he goes too far by saying this makes Kelly betting the *only* rational strategy. That's like saying 'driving 20mph is the only rational speed because it minimizes crash risk.' It ignores that sometimes you need to get somewhere fast.
  >
  > Samuelson wasn't defending bad math; he was defending the idea that people have different goals. Peters says 'Don't crash.' Samuelson says 'Some people are willing to crash if the prize is big enough.' Both are right, depending on whether you ask a physicist or a human."

  **Verdict:** Peters reinvented the wheel, but he pointed out that the wheel was square and economists were pretending it was round. The wheel is rounder now, but it's not the *only* wheel.
