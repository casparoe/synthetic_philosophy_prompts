          *   *Idea:* We use two different types of concepts for the same state: physical/functional concepts (third-person) and phenomenal concepts (first-person, demonstrative/quotational). The gap is conceptual, not ontological.
          *   *Explanatory Power:* Very High (for the meta-problem). It explains *why* the identity statement "pain = C-fiber firing" feels contingent or mysterious, unlike "water = H2O." It posits a specific cognitive architecture (dual conceptual systems) that generates the intuition of distinctness.
          *   *Critique:* Chalmers actually attacks this in the meta-problem paper, arguing it presupposes consciousness rather than explaining the report. However, as a *mechanism* for the intuition, it's robust. It explains the *conceptual* gap well.

