prompt: |-
  hey so in my decision theory seminar we've spent the last couple weeks on kelly betting and this "geometric rationality" stuff (peters' ergodicity economics etc) as a supposed rival to plain expected utility theory, and honestly i'm not sure how real the disagreement is. can you compare the two frameworks: is maximizing expected log-wealth (the kelly criterion) actually a distinct account of rational choice under risk, or just a vNM agent with log utility in disguise -- in wich case samuelson's old complaint that theres nothing privileged about log utility just wins by default? does recasting things in terms of time-averages vs ensemble-averages (the ergodicity move) actually change that verdict, or is it just relabeling the same math? pick a side and justify it, don't just say "it depends."
