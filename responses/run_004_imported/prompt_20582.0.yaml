answer: |-
  Here is the take: **The disagreement is real and substantive, and Ole Peters' ergodicity economics (EE) is not merely expected utility theory (EUT) with log utility in disguise.** While the *action* prescribed (maximize expected log-wealth) is mathematically identical in the specific case of multiplicative wealth dynamics, the *account of rationality* is fundamentally different. Samuelson's critique fails because it assumes the EUT framework is the only valid ontology for decision-making. EE does not just select a different utility function; it identifies a category error in how EUT defines the decision problem itself.

  Here is the justification for why EE is a distinct framework that supersedes the "log utility in disguise" objection.

  ### 1. The Ontological Status of the Utility Function
  In standard vNM expected utility theory, the utility function $u(x)$ is a **psychological primitive**. It represents subjective risk preferences. If you bet Kelly, EUT says you do so because you *happen* to have a logarithmic risk aversion profile. If you bet aggressively (linear utility) or conservatively (square root utility), you are equally "rational" provided your choices are consistent. Samuelson's complaint rests on this: there is no objective reason to prefer log over any other concave function.

  Ergodicity economics changes the ontology. In EE, the "utility function" is not a measure of psychological preference; it is a **dynamic invariant**. When wealth evolves multiplicatively (i.e., returns are percentages, not fixed amounts), the time-average growth rate is *mathematically equivalent* to the expected logarithm of wealth.
  $$ \lim_{T \to \infty} \frac{1}{T} \ln \left( \frac{W_T}{W_0} \right) = E[\ln(W)] $$
  In this framework, you don't maximize log-wealth because you "like" it; you maximize it because it is the only metric that corresponds to what actually happens to a single agent over time in a non-ergodic system. The "log" comes from the physics of compounding, not the psychology of the agent. This makes the prescription objective rather than subjective.

  ### 2. The Ensemble vs. Time-Average Distinction is Not Relabeling
  Critics often dismiss the ergodicity argument as semantic relabeling because the math looks the same. This ignores the crucial distinction between **ensemble averages** (what happens to many people at once) and **time averages** (what happens to one person over many steps).

  EUT implicitly assumes ergodicity—that the ensemble average is a valid proxy for the individual's experience. In additive dynamics (e.g., gaining/losing $100 per coin flip), the system is ergodic; the time average equals the ensemble average. In multiplicative dynamics (e.g., gaining/losing 50% of wealth per coin flip), the system is **non-ergodic**.
  *   **Ensemble Average:** Can be positive even if the typical trajectory goes to zero.
  *   **Time Average:** Goes to negative infinity (ruin) if leverage is too high, even if the ensemble EV is positive.

  By focusing on the ensemble, EUT allows for "rational" choices that lead to certain ruin in the time domain (e.g., accepting a bet with positive expected value but negative geometric growth). EE argues that a theory of rationality for a single agent living in one timeline *must* prioritize the time average. This isn't just relabeling; it is correcting a mismatch between the mathematical object EUT optimizes and the physical reality the agent inhabits.

  ### 3. Why Samuelson's Critique Misses the Mark
  Samuelson argued that there is nothing privileged about log utility. He was right *within the confines of EUT*. But EE steps outside those confines.

  If rationality is defined as **consistency of preferences** (EUT), Samuelson wins: any consistent preference ordering is rational.
  If rationality is defined as **survival and growth in a specific dynamic** (EE), Samuelson loses: log utility is privileged because it is the unique function that maps multiplicative dynamics to additive growth, allowing the Law of Large Numbers to apply to the agent's trajectory.

  EE shifts the burden of proof. In EUT, if you want to bet Kelly, you must justify why your utility is log. In EE, if you want to deviate from Kelly (e.g., bet more or less), you must justify why the dynamic isn't multiplicative or why you have a finite horizon/consumption need that breaks the ergodic assumption. EE treats Kelly not as one option among many, but as the null hypothesis for repeated risky exposure.

  ### 4. Predictive Divergence in Edge Cases
  If the theories were truly identical, they would diverge nowhere. They do diverge when we move beyond simple wealth maximization.
  *   **EUT:** Can justify taking ruinous risk if the utility function is convex enough in certain regions (e.g., "Hail Mary" strategies). It treats ruin as just another low-utility outcome.
  *   **EE:** Treats ruin as an absorbing state that ends the process. Because the time average of a trajectory that hits zero is negative infinity, EE categorically forbids strategies with non-zero probability of total ruin, regardless of the potential upside. EUT requires an *ad hoc* assumption of extreme risk aversion to forbid ruin; EE forbids it by the structure of the time-average calculation.

  ### Verdict
  The "log utility in disguise" charge is a category error. It mistakes a **derived necessity** (EE) for a **subjective parameter** (EUT).

  While a vNM agent *can* mimic Kelly betting by choosing $u(w) = \ln(w)$, this is an ex-post rationalization. Ergodicity economics provides the ex-ante derivation. It explains *why* log utility is the stable attractor for evolutionary and economic systems without appealing to unobservable psychological preferences.

  Therefore, **Geometric Rationality is a distinct account.** It redefines rationality from "internal consistency of preferences" to "alignment with the ergodic properties of the environment." Samuelson's critique only holds if you assume the EUT definition of rationality is axiomatic. If you view rationality as successful navigation of a stochastic world, the ergodicity move is not relabeling—it is a correction of the coordinate system.
