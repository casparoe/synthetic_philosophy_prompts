      *   **Constraint:** "Pick a side and justify it, don't just say 'it depends'."

  2.  **Deconstruct the Competing Frameworks:**
      *   **Expected Utility Theory (EUT):** Von Neumann-Morgenstern (vNM). Rationality = maximizing $E[u(x)]$. Utility function $u(x)$ represents risk preferences. If $u(x) = \ln(x)$, you get Kelly betting. Samuelson's critique: Why log? It's just one specific risk aversion profile among many.
      *   **Ergodicity Economics (EE) / Geometric Rationality:** Ole Peters et al. Rationality = maximizing time-average growth rate. For multiplicative dynamics (wealth grows by percentages), the time-average growth rate is the geometric mean, which corresponds to expected log-wealth. Claim: This isn't about risk preference; it's about physics/dynamics. Log utility isn't a preference; it's a property of the dynamic.
      *   **The Conflict:** EUT says risk aversion is subjective (psychological). EE says risk aversion (specifically log) is objective (mathematical necessity for non-ruin in multiplicative processes).

