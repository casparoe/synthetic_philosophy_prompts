answer: |-
  This is a fantastic question. It cuts right to the bone of the difference between **Bayesian statistics as a tool** (which you use at work) and **Bayesianism as a theory of rational inference** (which philosophers wrestle with).

  In your daily work, you likely treat $P(E)$ as a normalizing constant or a marginal likelihood that you integrate over. You rarely worry about whether $P(E) = 1$ because you are usually comparing models or estimating parameters given data that *just arrived*.

  But in philosophy of science, we are talking about **confirmation**: Does $E$ provide rational support for $H$? And that is where the "Problem of Old Evidence" (POE), famously articulated by Clark Glymour in 1980, becomes a genuine headache.

  Here is the breakdown of why the "obvious fix" fails, and how logical omniscience is the real culprit.

  ---

  ### 1. The Formal Block
  Let's look at the math you already know, but interpret the terms as **degrees of belief** rather than model frequencies.

  Bayes' Theorem:
  $$P(H|E) = \frac{P(E|H)P(H)}{P(E)}$$

  For $E$ to confirm $H$, we need the posterior to be higher than the prior: $P(H|E) > P(H)$.
  Looking at the equation, this only happens if:
  $$\frac{P(E|H)}{P(E)} > 1 \implies P(E|H) > P(E)$$

  **The Problem:**
  If $E$ is "old evidence" (e.g., the anomalous precession of Mercury's perihelion), it is already known to be true. In a Bayesian framework representing your current state of knowledge, if you are certain of $E$, then **$P(E) = 1$**.

  Furthermore, if the new theory $H$ (General Relativity) entails $E$, then **$P(E|H) = 1$**.

  Plug those in:
  $$P(H|E) = \frac{1 \cdot P(H)}{1} = P(H)$$

  **Result:** The posterior equals the prior. The known evidence $E$ provides **zero** confirmation for $H$. This contradicts the historical reality that Mercury's orbit was a massive boost for GR.

  ### 2. Why the "Obvious Fix" Fails
  Your intuition is the standard first-line defense: *"Well, obviously $P(E)$ shouldn't be 1. We should evaluate the probability of $E$ relative to a state of ignorance before we observed it."*

  This is called the **Counterfactual Approach**. It suggests we should calculate confirmation based on what our probabilities *would have been* had we not known $E$.

  Here is why philosophers and methodologists find this unsatisfactory:

  #### A. The "Un-knowing" Problem (Psychological Impossibility)
  To apply this fix, you have to mentally erase $E$ from your knowledge base to reconstruct a "prior" state. But human belief is holistic. Knowing $E$ often changes how you understand other background facts.
  *   **Example:** Once you know Mercury's orbit is anomalous, you might have already discarded Newtonian auxiliaries. Trying to reconstruct a "pre-Mercury" belief state is arbitrary. There is no unique, objective way to "un-know" a fact. If two scientists reconstruct their "ignorant priors" differently, they get different confirmation values for the same theory. That makes confirmation subjective, not logical.

  #### B. The Timing Problem
  Confirmation feels like a dynamic event that happens *now*. When Einstein realized GR explained Mercury, the support for GR increased *at that moment*.
  The counterfactual approach says the support existed back when Mercury was discovered (or rather, in a hypothetical past). It fails to explain why the *discovery of the theory* triggers an update in confidence given *old data*.

  #### C. The "Gaming" Problem
  If we allow agents to arbitrarily assign $P(E) < 1$ for known facts just to make the math work, we open the door to manipulation. I could propose a crackpot theory, claim that "if I didn't know the data, I would have thought this data was unlikely," and thus claim my theory is confirmed. We lose the constraint that $P(E)$ should reflect actual uncertainty.

  ### 3. The Bonus: Logical Omniscience
  This is where the problem gets deep. The Problem of Old Evidence is actually a symptom of a larger assumption in standard Bayesian epistemology: **Logical Omniscience.**

  Standard Bayesian agents are assumed to know all the logical consequences of their beliefs immediately.
  *   If you believe $H$, and $H$ logically entails $E$, a logically omniscient agent *must* assign $P(E|H) = 1$ immediately.
  *   Furthermore, if $H$ entails $E$, and you know $E$ is true ($P(E)=1$), a logically omniscient agent should have already accounted for this relationship in their prior $P(H)$.

  **The Reality of Science:**
  Scientists are **not** logically omniscient.
  1.  Einstein proposed GR ($H$).
  2.  At time $t_1$, he did not know that $H \implies E$ (Mercury's orbit).
  3.  At time $t_2$, he performed the derivation and realized $H \implies E$.
  4.  His confidence in $H$ went up.

  **The Crucial Insight:**
  Einstein did not update on $E$ (he already knew $E$). **He updated on the logical relationship $(H \implies E)$.**

  Standard Bayes' Theorem doesn't have a slot for "learning a logical implication." It only allows conditioning on empirical propositions.
  *   If you treat $(H \implies E)$ as the new evidence $E^*$, then you can run Bayes on $E^*$.
  *   But standard Bayesianism assumes logical truths have probability 1 always. You can't "update" on a logical truth because you were supposed to know it all along.

  ### 4. How Practitioners vs. Philosophers Handle This
  Since you do this for work, it's worth distinguishing the contexts:

  **In Applied Bayesian Statistics (Your Work):**
  You rarely face POE because you aren't modeling "Truth." You are modeling data generation.
  *   When you fit a model, you treat the data $y$ as fixed. You compute $P(\theta | y) \propto P(y | \theta) P(\theta)$.
  *   You don't care about $P(y)$ (the marginal likelihood) unless you are doing model comparison.
  *   If you *are* doing model comparison (Bayes Factors), you are comparing $P(y | M_1)$ vs $P(y | M_2)$. Here, $y$ is "old," but you are evaluating how *surprising* $y$ would be under each model. You are effectively asking: "If I had generated data from $M_1$, how likely is this specific $y$?" You are simulating the counterfactual naturally via the likelihood function. The "Problem" dissolves because you aren't updating a degree of belief in the *truth* of the model based on the *certainty* of the data; you are assessing predictive fit.

  **In Philosophy of Science:**
  The goal is to explain rational belief change in theories about the world.
  *   **Garber's Solution:** One popular philosophical fix (Daniel Garber, 1983) suggests we expand the language of probability. We allow agents to assign probabilities to sentences like "H entails E."
      *   Initially, $P(H \text{ entails } E) < 1$.
      *   Einstein learns $H \text{ entails } E$.
      *   He updates on *that* logical fact, not on $E$ itself.
      *   This bypasses logical omniscience by admitting that learning logic is a probabilistic process for humans.

  ### Summary
  The Problem of Old Evidence is hard because it exposes a crack in the foundation of Bayesian epistemology:
  1.  **Mathematically:** If $P(E)=1$, the likelihood ratio is 1, and no learning occurs.
  2.  **Psychologically:** We can't genuinely "un-know" evidence to fix the priors (Counterfactual failure).
  3.  **Logically:** Standard Bayes assumes we know all entailments instantly (Logical Omniscience). Real science involves *deriving* entailments over time.

  For your work, you can sleep soundly: you are using Bayes as an engine for **coherence and prediction**, not as a complete philosophical model of **scientific discovery**. But if you ever find yourself justifying why a model fits historical data well, remember: you are implicitly relying on the fact that your model *didn't know* that data beforehand, even if you did.
