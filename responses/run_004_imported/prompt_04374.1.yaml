answer: |-
  **Setting:** *A quiet corner of a university faculty lounge, 1958. Coffee cups sit untouched. Two legal philosophers, **HERBERT** (representing H.L.A. Hart) and **LON** (representing Lon Fuller), are picking up a debate that has been simmering since a recent lecture.*

  **HERBERT:** You're smiling, Lon, but I can't shake the feeling that the German court's reasoning in that Bamberg case is a muddle. A dangerous muddle. They convicted that woman of unlawful deprivation of liberty under the Penal Code of 1871. But to do so, they had to declare the Nazi statute she relied on—which mandated the reporting of disloyal remarks—was "not law." They called it contrary to the "sound conscience and sense of justice of all decent human beings."

  **LON:** And you find that phrasing too vague?

  **HERBERT:** I find it dishonest. By positivist standards, which the German courts themselves recognized at the time, that Nazi statute *was* law. It was enacted by a sovereign power, it was obeyed, it was enforced. To say it wasn't law is to confuse what the law *is* with what the law *ought* to be. The woman did exactly what the regime commanded. She broke no law in 1944.

  **LON:** She broke no *command*, Herbert. But did she operate within a *legal* system? That is the question.

  **HERBERT:** That's the natural law evasion. If you tell a citizen, "That was valid law then, but we are going to punish you for following it now," you are at least being clear. You are admitting you are using a retroactive statute to achieve a moral end. The court dodged the dilemma. They wanted to punish her—which I agree is morally desirable—but they wanted to do it without dirtying their hands with retroactivity. So they pretended the Nazi rule never existed. That sacrifices clarity for comfort.

  **LON:** It sacrifices nothing of the sort. It preserves the integrity of the concept of law itself. Look, Herbert, law is not merely a system of orders backed by threats. It is an enterprise of subjecting human conduct to the governance of rules. When the Nazi regime used statutes as instruments of terror, to settle private grudges and enforce silence through denunciation, they weren't just making *bad* law. They were perverting the very machinery of law.

  **HERBERT:** But that's where you lose me. If a rule is posited by the sovereign and effective, it is law. Wicked, yes. But law. If you tell judges they can void a statute because it violates "the conscience of all decent human beings," you give them a license to strike down any law they dislike. You wreck legal certainty. The next time a legislature passes an unpopular tax, a judge might decide it violates his conscience and declare it void.

  **LON:** I'm not arguing for a judge's personal moral whim. I'm arguing for the *inner morality of law*. There are principles—generality, publicity, non-retroactivity, congruence between declared rule and official action—that make law possible. The Nazi statute in question wasn't just unjust in outcome; it turned the legal process into a trap. It invited citizens to use the machinery of the state for private malice. If a rule is so contrary to the purpose of law that it destroys the bond between citizen and state, can we really call it "law"? Or is it just force wearing a mask?

  **HERBERT:** It was force wearing a mask, I agree. But it was *legal* force. And here is my worry, Lon: Your solution is arguably more dangerous than the retroactive punishment I propose. You say, "Let judges decide when a law is too wicked to be law." I say, "Let the legislature admit they are passing a retroactive punishment." Why? Because retroactivity is a known evil. We can debate it. We can limit it. But if you empower judges to invalidate valid statutes based on moral repugnance, you undermine the separation of powers. You make the law unpredictable. Is that really better?

  **LON:** Is it better to tell the German people that the rules which governed their lives for twelve years, which sent their neighbors to camps and silenced their husbands, were "valid law"? If you validate the Nazi statute as law, you teach the citizen that law is nothing but power. You teach them that fidelity to law is a fool's errand.

  **HERBERT:** I teach them that law is a distinct social phenomenon! I teach them that we must have the courage to say, "This is law, and it is too wicked to be obeyed." That clarifies the moral choice. Your way muddies it. You say, "This isn't law, so you didn't really have a choice." But she *did* have a choice. She chose to denounce her husband.

  **LON:** She chose within a system that had already abandoned legality.

  **HERBERT:** Let's press the point on retroactivity, then. You recoil at it. But in this specific case, isn't retroactive punishment the lesser of two evils? If we admit the Nazi statute was law, we must pass a new statute today to punish her. It would be retroactive, yes. But it would be an open, honest moral decision by the legislature. Instead, the court engaged in a fiction. They pretended the 1871 Code was always in force without interruption. That isn't fidelity to law; that's falsifying history. So I ask you directly: Is retroactive punishment fine as long as you're upfront about it?

  **LON:** It is never "fine," Herbert. It strikes at the root of the reciprocity between government and citizen. Law guides conduct. If you punish conduct that was authorized when performed, you tell the citizen that the guide was a mirage.

  **HERBERT:** But you *are* punishing her! You're just dressing it up differently.

  **LON:** Am I? If I declare the Nazi statute void *ab initio*, I am saying the legal order *survived* the Nazi interregnum. I am saying that the German Republic never truly accepted that perversion as part of its legal continuity. By punishing her under the 1871 Code, the court is restoring the rule of law, not breaking it. If I pass a retroactive statute, I admit the rule of law was suspended. I admit that we are now acting outside the law to get her. Why should a court admit the system failed, when it can affirm the system endured?

  **HERBERT:** Because the system *did* fail! That's the reality! The Nazis didn't just park their tanks on the lawn; they rewrote the rules. To pretend otherwise is to engage in a "sweetening pill" fiction. And here is the danger: If you let judges decide that "extreme injustice is no law," where is the line? You say the Nazi statute failed the inner morality. But what about a statute that is merely harsh? Merely unfair? If you blur the line between law and morals to solve this hard case, you weaken the shield law provides in easy cases. A positivist judge can say, "This law is valid, but I will interpret it narrowly." A natural law judge says, "This law is invalid." The latter invites chaos.

  **LON:** And the positivist judge invites complicity. If you insist that law is merely a matter of social fact, of pedigree and sovereignty, you leave the citizen with no ground to stand on when the sovereign commands evil. You say, "It is law, obey it or suffer." I say the very nature of law contains a moral promise. When the state breaks that promise fundamentally, it forfeits the claim to be obeyed *as law*.

  **HERBERT:** But who decides when the promise is broken?

  **LON:** The courts, guided by the principles of legality themselves. Not by external moral codes, but by asking: "Could this rule function as law? Did it allow the citizen to plan their life? Or was it a trap?" The Bamberg statute was a trap. It turned the neighbor into the spy. It destroyed the congruence between the law's purpose and its operation.

  **HERBERT:** I concede the Nazi regime was monstrous. But I maintain that the court's reasoning was a "cloak." They wanted to punish her without the odium of retroactivity. My proposal forces the legislature to take responsibility. It says: "We know this is retroactive. We know it violates the principle that law should guide conduct. But the moral necessity of punishing this grievous wrong outweighs the legal principle in this specific instance." That is a tragic choice, Lon. But it is an *honest* one. Your way pretends there is no tragedy.

  **LON:** It pretends nothing. It recognizes that there are two types of continuity. There is the continuity of rules, and the continuity of the legal order's purpose. If you preserve the rules but lose the purpose, you have a hollow shell. By declaring that statute void, the court affirmed that the German legal order is defined by justice, not just power.

  **HERBERT:** And if a future court decides a socialist land reform statute is "contrary to the conscience of decent human beings" and voids it? You have given them the weapon you used against the Nazis.

  **LON:** Then they must argue based on the inner morality of law, not their personal politics. They must show how the statute fails to guide conduct, or creates contradictions, or acts as a tool of oppression rather than governance. It is a high bar, Herbert. It is not for every unjust law. It is for the laws that make law impossible.

  **HERBERT:** A high bar that is nonetheless subjective. I prefer the cold clarity of positivism. It forces us to see that law and morality are separate. Sometimes they clash. In the Grudge Informer case, morality won. But let's not pretend morality *was* the law. Let's call it what it was: a moral override of the law.

  **LON:** And I say that when the clash is that severe, the "law" has already ceased to exist. You cannot have a law that commands you to betray your humanity and call it a rule of conduct.

  **HERBERT:** (Sighs, picking up his coffee) We are at an impasse. You fear that validating wicked law corrupts the concept of law. I fear that invalidating it corrupts the clarity of law.

  **LON:** Perhaps. But consider the citizen, Herbert. Which message do we want to send? "The law was valid, but we punished you anyway"? Or "What was done to you was never law at all"?

  **HERBERT:** I want to send the message: "The law was valid, which is why we must be vigilant against it." You want to send the message: "True law can never be wicked."

  **LON:** I want to send the message: "Law is a partnership between ruler and ruled. When the ruler turns predator, the partnership dissolves."

  **HERBERT:** Well. I suppose we can agree the woman deserved punishment.

  **LON:** On that, at least, the law and morality agree.

  **HERBERT:** (A wry smile) Even if we disagree on whether it was "law" that sent her to prison.

  **LON:** Or perhaps, Herbert, especially because we disagree. It keeps us honest.
