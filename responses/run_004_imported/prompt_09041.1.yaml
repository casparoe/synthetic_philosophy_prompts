      *   *Option C: Reframe Infinity.* Shift from "infinite sum" to "unbounded potential within a finite container." Acknowledge Marcus's point but pivot to the *human* experience of time.
      *   *Selected Approach:* Option C with a heavy dose of Option B. Acknowledge the philosophical trap explicitly but gently (nod to Marcus), then pivot to the idea that the *value* of a life isn't in its aggregable sum, but in its narrative arc and the quality of the "now." This satisfies the philosophers (shows understanding) and the relatives (remains sentimental).

