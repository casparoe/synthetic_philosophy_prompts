  7.  **Final Polish:** Check against the user's specific request ("go through the exchange step by step," "who's right about what," "more defensible position"). Ensure the distinction between "biological death" and "legal death" is clear. (Self-correction: Make sure to mention the Uniform Determination of Death Act (UDDA)).

