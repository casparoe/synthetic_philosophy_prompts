      *   Let's have Elara be the protagonist. She has to overrule Kael. She chooses SSA (Conservation). They survive in the dark.
      *   The ending: She wonders if they just condemned themselves to eternal loneliness because she was too afraid to trust the math of existence.
      *   That feels more "Ted Chiang" – melancholic and contemplative.

      *   *Wait, one nuance:* The Presumptuous Philosopher argument is that SIA *overpowers* the prior. Even if the prior for Dense is tiny, SIA makes it huge.
      *   I need to make sure the "Physical Evidence" is truly equal.
