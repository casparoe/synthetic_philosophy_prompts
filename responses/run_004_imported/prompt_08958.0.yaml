  5.  **Final Polish:** Check word count. Ensure no "simulation" talk. Ensure the philosophy drives the action.

  *(Self-Correction during drafting)*: Make sure the dialogue doesn't get too expository. Use metaphors. "Lottery tickets," "Seats in a theater."

