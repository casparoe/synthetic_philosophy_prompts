answer: |-
  Here is a structured argument designed for your meetup context. It validates your intuition that the arbitrariness has merely been relocated, while grounding that intuition in standard metaethical taxonomy and engaging directly with Yudkowsky's semantic machinery.

  ***

  ### The Argument: Anthropocentric Indexicality Masquerading as Realism

  The core charge against Yudkowsky's metaethics is that it constitutes a sophisticated form of **Indexical Relativism** (or Response-Dependence Theory) that appropriates the semantic structure of Non-Naturalist Realism without securing its metaphysical payoff. While Yudkowsky successfully argues that moral statements have truth conditions, he fails to secure **Normative Authority** independent of contingent human psychology. Consequently, he has not dissolved the realism/anti-realism debate; he has defined realism in a way that renders it compatible with anti-realist metaphysics, effectively changing the subject.

  Here is the breakdown of that argument across three fronts: the failure of the Natural Kind analogy, the relocation of arbitrariness, and the implications of *Three Worlds Collide*.

  #### 1. The Disanalogy of Rigid Designation (Water vs. Right)
  Yudkowsky relies heavily on the Kripke-Putnam causal theory of reference: just as "water" rigidly designates H2O based on our causal interaction with it, "right" rigidly designates the output of our extrapolated moral cognition. He argues that once the reference is fixed, the truth is objective.

  **The Counter:** The analogy breaks down because natural kinds possess **mind-independent essences**, whereas Yudkowsky's moral referent possesses a **mind-dependent essence**.

  *   **Water:** If humans had never evolved, H2O would still exist. The reference is fixed by our interaction, but the *referent* is ontologically independent of us.
  *   **Right:** On Yudkowsky's account, if humans (or relevantly similar agents) had never evolved, the computation "right" refers to would not exist. There is no "moral H2O" waiting to be discovered. The referent is constituted by the psychological architecture of the specifier.

  This makes "right" less like "water" and more like "delicious." "Delicious" rigidly designates "what pleases the human palate." It is an objective fact that chocolate triggers this response. But calling deliciousness "objective" in the same sense as water is misleading, because the *standard* of evaluation is internal to the evaluator. Yudkowsky grants that the *computation* is objective (once run), but the *selection of the computation* is entirely contingent on the species running it. This is not realism; it is **idealized subjectivism**.

  #### 2. The Relocation of Arbitrariness and the Open Question
  You mentioned feeling that Yudkowsky "moves the arbitrariness back a step." Metaethically, this is the precise problem.

  Realism typically demands that the *grounds* of morality be non-arbitrary. If I ask, "Why should I be moral?", a realist wants an answer that appeals to reasons external to my current desires. Yudkowsky's answer is effectively: "Because 'morality' is defined as what you would desire upon reflection."

  This invites a revived **Open Question Argument**. G.E. Moore asked, "I know X is pleasant, but is X good?" Yudkowsky replies, "Good *means* what you would endorse on reflection." But the skeptic can still ask: "I know my extrapolated volition endorses X, but **why should I care about my extrapolated volition?**"

  *   **Yudkowsky's Defense:** To ask that is to step outside the definition of "right." It's like asking, "I know this is a bachelor, but is he unmarried?"
  *   **The Rebuttal:** Moral concepts carry a **normative force** that bachelorhood does not. When we debate morality, we are not merely cataloging our psychological outputs; we are asking for *authority*. By grounding authority in the very psychology being questioned, Yudkowsky creates a closed loop. He secures semantic consistency at the cost of normative traction. The arbitrariness isn't in the *output* of the computation; it is in the **decision to treat that computation as authoritative**. That decision is not itself justified by the computation; it is a pre-moral commitment.

  Therefore, his position inherits the standard problem of naturalism: it explains the *semantics* of moral talk but fails to explain the *normativity* of moral obligation without begging the question.

  #### 3. *Three Worlds Collide* as the Smoking Gun
  The strongest evidence that Yudkowsky is a relativist in realist clothing comes from his own fiction, *Three Worlds Collide*. In the story, humans, Babyeaters, and Superhappies possess irreconcilable moral architectures.

  *   **The Realist Expectation:** If moral realism were true in the standard sense, one party should be objectively mistaken about the moral landscape, analogous to one party being wrong about the presence of water.
  *   **Yudkowsky's Resolution:** The protagonist does not prove the Babyeaters are "wrong" in a universal sense. He argues for the *triumph of human values* because they are *human*. The story explicitly acknowledges that if the Babyeaters had won, "Right" would have meant something else.

  This confirms the **Indexical** nature of his theory. "Right" effectively means "Right-for-Humans."
  *   If Yudkowsky claims the Babyeaters are *objectively* wrong, he requires a standard outside human psychology (which he rejects).
  *   If he claims they are *subjectively* wrong (relative to us), he is a relativist.

  In *Three Worlds Collide*, the conflict is resolved not by discovering a universal moral truth, but by a power struggle and negotiation between different moral ontologies. The "truth" of human morality is secured only by the causal victory of human agents. This undermines the claim that he has dissolved the realism debate. He has instead offered a **species-relative realism**, which is taxonomically a form of relativism.

  ### Conclusion: A Semantic Victory, Not a Metaphysical One
  Yudkowsky's move is to define "realism" as "the existence of truth-conditions for moral statements within a fixed reference class." By this definition, he is a realist. But the traditional realism/anti-realism debate is not about whether moral statements have truth conditions (even expressivists can grant that); it is about whether those truth conditions are **mind-independent**.

  Yudkowsky concedes mind-dependence. He admits that if the causal history of *Homo sapiens* had been different, "Right" would refer to something else. Therefore, the "objectivity" he claims is merely the objectivity of a mirror: it is objectively true that the mirror reflects your face, but the image is not independent of you.

  Your intuition is correct: he has not escaped the dilemma. He has argued that we should stop caring about mind-independence. That is a valid philosophical position (a form of Cornell Realism or Response-Dependence), but it is not a *dissolution* of the debate. It is a defense of one side (anti-realism/relativism) using the vocabulary of the other (realism/rigid designation). The arbitrariness hasn't vanished; it has been buried in the evolutionary contingency of the reference-fixing event.
