prompt: |-
  I sit on my university's student senate elections committee, and i'm taking a Democratic Theory seminar this same semester, which makes this feel a little too on-the-nose. We're running a referendum on a $150/semester fee for a new rec center, and the committee cant agree who gets to vote. The proposal is to let anyone "currently enrolled" vote -- but that means graduating seniors get a ballot even though they'll never see the building finished, while the ~600 students already admitted for next fall don't get one, even though they're the ones who'll actually pay the fee and use it. Half the committee thinks "enrolled" is just the obvious neutral line; the other half thinks it's arbitrary. We vote on the real policy Thursday -- can you draft the memo I'm supposed to bring, recommending where to draw the line, and taking the case for the incoming students seriously instead of just waving it off?
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of the University Student Senate Elections Committee.
      *   **Context:** Taking a Democratic Theory seminar (adds a layer of theoretical depth/scrutiny).
      *   **Issue:** A referendum on a $150/semester fee for a new rec center.
      *   **Conflict:** Who gets to vote?
          *   Option A: "Currently Enrolled" (includes graduating seniors, excludes incoming admitted students).
          *   Problem: Seniors won't use it/pay long-term; Incoming students will pay/use it but can't vote.
      *   **Committee Split:** Half say "enrolled" is neutral/obvious; half say it's arbitrary.
      *   **Task:** Draft a memo recommending where to draw the line.
      *   **Key Requirement:** Take the case for incoming students seriously (don't wave it off).
      *   **Deadline:** Vote is Thursday (needs to be actionable and persuasive).
      *   **Tone:** Professional, analytical, grounded in democratic theory (given the user's seminar), but practical for a student committee.

  2.  **Determine the Core Democratic Theory Concepts:**
      *   Since the user is in a Democratic Theory seminar, weaving in relevant concepts will make the memo stronger and more resonant for them.
      *   *All-Affected Principle:* Everyone affected by a decision should have a say. (Strongest argument for incoming students).
      *   *All-Subjected Principle:* Everyone subject to the coercive power of the decision. (Strong argument for incoming students who are committed).
      *   *Administrative Feasibility/Bright Lines:* The need for clear rules to prevent manipulation. (Argument for "currently enrolled").
      *   *Temporal Justice:* Intergenerational equity (seniors vs. freshmen vs. incoming).

  3.  **Evaluate the Options:**
      *   *Status Quo ("Currently Enrolled"):* Easy to administer. Excludes those who will pay the most (incoming). Includes those who pay the least (seniors).
      *   *Expanded ("Enrolled + Admitted"):* More democratic under the "all-affected" principle. Harder to verify? (Actually, admissions lists are usually solid). Risks setting a precedent for non-students voting? (Mitigated by "admitted" status).
      *   *Restricted ("Underclassmen Only"):* Too exclusionary, administratively nightmarish for a referendum.

  4.  **Formulate the Recommendation:**
      *   The prompt asks to take the incoming students' case *seriously*. This implies the recommendation should likely favor including them, or at least propose a hybrid that acknowledges the flaw in the status quo.
      *   *Best Path:* Recommend expanding the franchise to include admitted students who have paid a deposit. This aligns with the "All-Affected Principle."
      *   *Counter-argument:* Acknowledge the administrative burden but argue it's surmountable. Acknowledge the "slippery slope" but define the boundary clearly (deposit paid = commitment).

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Executive Summary:** Briefly state the problem and the recommendation.
      *   **Context:** The Rec Center Fee Referendum.
      *   **The Democratic Problem:** Frame it using theory (All-Affected Principle). Highlight the discrepancy between *liability* (paying the fee) and *franchise* (voting).
      *   **Analysis of Options:**
          *   Option 1: Current Policy (Enrolled Only). Pros: Clear. Cons: Violates "no taxation without representation" for incoming class.
          *   Option 2: Expanded Franchise (Enrolled + Admitted/Deposited). Pros: Aligns cost/benefit. Cons: Slightly more admin work.
      *   **Recommendation:** Go with Option 2.
      *   **Implementation:** How to verify admitted students (deposit status).
      *   **Conclusion:** Final persuasive push.

  6.  **Refining the Tone:**
      *   Needs to sound like a student leader, but a thoughtful one.
      *   Avoid overly academic jargon, but use the *logic* of the seminar (e.g., mentioning "constituency," "affected interests," "legitimacy").
      *   Ensure the argument for incoming students is robust, not tokenistic.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "admitted" too vague? Some get admitted but don't come.
      *   *Fix:* Specify "admitted *and* enrolled" or "admitted who have paid a commitment deposit." Let's use "Confirmed Incoming Students" (admitted + deposit).
      *   *Critique:* What about the seniors?
      *   *Fix:* Acknowledge they have a stake (spring semester use), but note the imbalance. The memo should focus on *adding* the incoming, not necessarily subtracting seniors (which is harder legally), but highlight the moral weight of the incoming class.
      *   *Critique:* Make sure to mention the $150 fee specifically. That's a tangible cost.

  8.  **Final Polish:** Check the formatting. Ensure the "Democratic Theory" angle is subtle but present (legitimacy, consent of the governed). (Decided to explicitly mention the "All-Affected Principle" as it bridges the user's seminar and the committee work).

  9.  **Final Output Generation:** (This matches the provided good response).
answer: |-
  **MEMORANDUM**

  **TO:** Student Senate Elections Committee
  **FROM:** [Your Name], Committee Member
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Voter Eligibility for Rec Center Fee Referendum

  ### Executive Summary

  The Committee is currently divided on voter eligibility for the upcoming $150/semester Rec Center fee referendum. The default standard ("currently enrolled") creates a democratic deficit: it grants voting power to graduating seniors who will bear the cost for only one semester (or less), while excluding incoming students who will bear the cost for four years without granting them a voice.

  This memo recommends **expanding voter eligibility to include "Confirmed Incoming Students"** (those admitted for the Fall semester who have paid an enrollment deposit). This adjustment aligns the franchise with the *all-affected principle* of democratic theory, ensuring that those most subject to the financial liability of the measure have representation in its passage.

  ### Context and Problem Definition

  We are tasked with setting the constituency for a binding referendum. Unlike a candidate election, which selects representation for a fixed term, this is a *policy referendum* with long-term financial implications.

  *   **The Cost:** $150/semester, recurring.
  *   **The Timeline:** Construction will likely begin next academic year; completion expected in 2–3 years.
  *   **The Discrepancy:**
      *   **Graduating Seniors:** Pay the fee for potentially one remaining semester. They will not use the facility.
      *   **Confirmed Incoming Students:** Will pay the fee for 8+ semesters. They will be the primary users. Under current rules, they cannot vote.

  Half the committee argues that "currently enrolled" is a neutral, administrative bright line. The other half argues it is arbitrary in this specific context. We must recognize that administrative convenience cannot override the legitimacy of the vote. If the group paying the bill is excluded from the decision, the referendum risks being perceived as illegitimate taxation without representation.

  ### Democratic Analysis: The "All-Affected" Principle

  In democratic theory, the most robust standard for determining the franchise is the **All-Affected Principle**: *Everyone whose interests are significantly affected by a decision should have a right to participate in making it.*

  1.  **Interest at Stake:** The interest here is financial liability and access to amenities.
  2.  **Magnitude of Effect:** An incoming freshman is affected *eight times more* financially than a graduating senior.
  3.  **Current Policy Failure:** By restricting the vote to "currently enrolled," we are prioritizing *administrative status* over *affected interest*. We are privileging the convenience of the Registrar's database over the consent of the governed.

  While "currently enrolled" is a clear line, it is not a *neutral* one. It systematically disenfranchises the cohort with the highest stake in the outcome.

  ### Options Analysis

  **Option 1: Status Quo ("Currently Enrolled" Only)**
  *   *Pros:* Easiest to administer; voter list is immediately available from the Registrar.
  *   *Cons:* Violates the principle of no taxation without representation for incoming students. Risks low legitimacy if the fee passes primarily on the backs of students who won't pay it long-term.
  *   *Verdict:* Administratively efficient, democratically deficient.

  **Option 2: Expanded Franchise ("Currently Enrolled" + "Confirmed Incoming")**
  *   *Pros:* Aligns voting power with financial liability. Increases the legitimacy of the result. Honors the commitment incoming students have already made to the university (via deposit).
  *   *Cons:* Requires coordination with Admissions/Registrar to generate a list of students who have paid deposits but not yet started classes.
  *   *Verdict:* Slightly higher administrative lift, but necessary for a fair vote on a long-term fee.

  **Option 3: Exclusion of Seniors (Underclassmen + Incoming Only)**
  *   *Pros:* Maximizes alignment of cost/benefit.
  *   *Cons:* Highly contentious; likely violates Senate bylaws regarding "enrolled" student rights; creates a two-tier citizenship among current students.
  *   *Verdict:* Not recommended. It is easier to add incoming students than to subtract current seniors.

  ### Recommendation

  I recommend the Committee adopt **Option 2**.

  We should define eligible voters as: **"All students currently enrolled in good standing, PLUS all students admitted for the upcoming Fall semester who have submitted a non-refundable enrollment deposit."**

  **Addressing Administrative Concerns:**
  The argument against Option 2 is usually administrative burden. However, the Admissions office already maintains a verified list of "committed" students for orientation and housing purposes. Providing this list to the Elections Committee for ballot distribution is a low-lift data transfer that does not require new infrastructure.

  **Addressing the "Slippery Slope" Argument:**
  Some may worry this sets a precedent for non-students voting. It does not. This exception is specific to *fee referenda* with long-term liabilities. "Confirmed Incoming" students are distinct from the general public; they have a contractual relationship with the university and have financially committed to attendance. They are, for all intents regarding tuition and fees, already members of the community.

  ### Conclusion

  We have an opportunity to ensure this referendum is not just procedurally correct, but democratically robust. If we pass a fee that binds incoming students without letting them vote, we undermine the Senate's credibility.

  By including Confirmed Incoming Students, we acknowledge that the community is not just those physically on campus today, but those who have committed to the institution's future. I move that we draft the resolution to reflect this expanded eligibility.

  I am available to discuss the specific language for the resolution before Thursday's vote.
