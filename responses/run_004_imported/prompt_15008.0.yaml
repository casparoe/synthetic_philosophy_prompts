  Ok, weird one that's been bugging me all week – curious what you make of it. My brother-in-law says he'll pay off the rest of my car loan tonight, no strings attached, if I can get him to genuinely believe, right now, that I intend to run his marathon relay leg in June (the brutal hilly leg he always weasels out of). He's known me since I was a kid and swears he can always tell when Im just saying words to get the money, so it only counts if I actually intend it, not just claim to. Catch is, once he transfers the cash tonight there's no getting it back, and he's told me flat out he won't be mad or ask for it back if I bail come June. So on race morning I'll have zero actual reason left to drag myself up that hill, and sitting here now I can already predict that future-me isn't going to show. Can present-me still form a real, sincere intention to run it, even while predicting I'll flake on it later? Does it even matter whether I go through with it, if the whole deal was supposed to be sealed just by sincerely intending? Somethings messing with my head here, and I literally teach philosophy for a living – what's actually going on, and should I take the deal?
