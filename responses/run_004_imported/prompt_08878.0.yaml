      *   *Is "Source Code" analogous to "Covenant"?* A covenant is a promise. Source code is a binding mechanism. But who compiles it?
      *   *Key Insight:* PE solves the *incentive* problem but not the *epistemic* or *infrastructure* problem. Hobbes argues the epistemic/infrastructure problem (diffidence, inability to know the future/other's intent) is the root cause.

  9.  **Final Polish:** Ensure the distinction between "Rational Cooperation" and "Political Obligation" is clear. Hobbes isn't just solving a game; he's founding a Commonwealth.

