  *(Self-Correction Note during drafting the passion section)*: I need to make sure Elias doesn't just say "people will be better." He needs to acknowledge the danger. Weil herself was aware of human frailty. His argument should be that parties *exploit* frailty, whereas a party-less system demands strength, which is risky but necessary.

