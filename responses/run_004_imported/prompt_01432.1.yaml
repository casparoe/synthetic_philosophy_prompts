      *   *Key Reference:* Mention *Theories and Things* or his comments on normativity.
      *   *Alternative:* Mention Hilary Putnam. Putnam is the guy who actually used Quinean holism to attack the fact/value dichotomy explicitly (*The Collapse of the Fact/Value Dichotomy*).
      *   *Advice for the Writeup:* Frame it as "Quine opened the door" rather than "Quine walked through it." Or, "Quine's framework allows it, even if he was hesitant."

  6.  **Refining the Tone:**
