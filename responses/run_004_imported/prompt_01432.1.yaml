answer: |-
  You have a sharp instinct for the philosophical lineage here, but **yes, you are likely overselling Quine's own conclusion**, even if the logical trajectory of his arguments points that way.

  Here's the nuance you need to keep your writeup accurate:

  ### 1. Where you're right (The Holism)
  You are absolutely correct that Quine's **confirmation holism** (the "web of belief") puts pressure on the fact/value distinction. If no statement is immune to revision in the face of recalcitrant experience (not even logic), and if statements face the tribunal of experience as a corporate body, then the hard wall between "descriptive" (scientific) and "normative" (ethical) statements does get porous.

  Many contemporary naturalists argue that Quine *should* have been a moral realist based on this framework. If ethics is part of the web, and the web is judged by how well it predicts and handles experience, then ethical claims have an empirical dimension.

  ### 2. Where you're overselling (Quine's Actual Metaethics)
  Quine himself did **not** conclude that ethics was as objective or truth-apt as physics. In fact, he was quite skeptical about moral claims.

  *   **Ontological Commitment:** Quine's criterion for what exists is "to be is to be the value of a bound variable." We commit to entities that are indispensable to our best *scientific* theories. Quine did not think moral properties (like "goodness" or "rightness") were indispensable to physics or natural science. Therefore, he didn't grant them the same ontological status as electrons or forces.
  *   **Non-Cognitivism Leanings:** In various passages (e.g., in *Theories and Things*), Quine treats moral statements more like expressions of sentiment or directives for behavior rather than propositions with truth values. He tended to view ethics as a matter of social conditioning and sentiment, not empirical discovery.
  *   **The Is-Ought Gap:** Quine didn't believe that dissolving the analytic/synthetic distinction automatically dissolved Hume's Is-Ought gap. He maintained that science tells us what *is*, and while our values must be consistent with what *is*, science cannot dictate the values themselves.

  ### 3. The Better Candidate for Your Piece
  If you want a philosopher who explicitly used Quinean holism to demolish the fact/value distinction and argue for the objectivity of ethics, you want **Hilary Putnam**.

  Putnam was deeply influenced by Quine but broke with him on this exact point. In *The Collapse of the Fact/Value Dichotomy* (2002), Putnam argues explicitly that:
  1.  Quine was right about holism.
  2.  Therefore, the fact/value distinction is untenable.
  3.  Ethical reasoning is cognitive and objective, just not "scientific" in the reductionist sense.

  Putnam is the one who says, "Quine killed the first dogma, so let's kill the second one too." Quine killed the first dogma and kind of shrugged about the second one.

  ### Suggested Nuance for Your Writeup
  You can keep the angle, but tweak the claim from **historical attribution** to **theoretical implication**.

  *   **Don't say:** "Quine proved ethics is objective."
  *   **Do say:** "Quine's demolition of the analytic/synthetic distinction removed the logical barrier protecting the fact/value dichotomy, even if Quine himself hesitated to cross that bridge. It left the door open for naturalists (like Putnam) to argue that moral claims, like scientific ones, are judged by how well they cohere with our total experience of the world."

  This way, you credit Quine with the dynamite (destroying the dichotomy) without falsely crediting him with the renovation (moral objectivity).
