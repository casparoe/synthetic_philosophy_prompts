answer: |-
  This is a classic and deeply substantive debate. Your friend is right to be suspicious from the standpoint of standard bivalent logic: if you treat Nāgārjuna's propositions as standard truth-apt claims about the world, he is indeed violating the Law of Excluded Middle (LEM) and the Law of Non-Contradiction (LNC).

  However, the "conservative" or "classical-minded" reconstruction (championed by scholars like T.R.V. Murti, C.W. Huntington, and to an extent B.K. Matilal) argues that Nāgārjuna isn't playing a metaphysical game where he asserts counter-theses; he is playing a *semantic* and *therapeutic* game. He is diagnosing a category error in the questions themselves.

  Here is a reconstruction of that logical story, broken down by your three specific points, followed by an assessment of the paraconsistent alternative.

  ---

  ### 1. The Logic of Negation: *Prasajya* vs. *Paryudāsa*

  The linchpin of the non-paraconsistent reading is the distinction between two types of negation found in Indian logic (Nyāya and Mīmāṃsā), which Nāgārjuna exploits.

  *   **Paryudāsa-pratiṣedha (Implicative Negation):** This is a "term negation." To say "X is not Y" implies "X is some Z other than Y."
      *   *Example:* "This is not a Brahmin."
      *   *Implication:* This commits you to the existence of the subject and implies it belongs to another caste. It asserts a positive alternative.
  *   **Prasajya-pratiṣedha (Non-Implicative Negation):** This is a "propositional negation" or pure denial. It denies the predicate without implying an alternative.
      *   *Example:* "It is not the case that the son of a barren woman is dark."
      *   *Implication:* You are not claiming the son is light-skinned; you are denying the presupposition that there is a son at all.

  **How this saves the Tetralemma:**
  In the *Mūlamadhyamakakārikā* (MMK), when Nāgārjuna rejects the four *koṭis* (e.g., regarding nirvāṇa), the conservative reading argues he is using *prasajya* negation for the ultimate truth.

  1.  **Exists:** Rejected (*prasajya*).
  2.  **Does not exist:** Rejected (*prasajya*).
  3.  **Both:** Rejected (*prasajya*).
  4.  **Neither:** Rejected (*prasajya*).

  If these were *paryudāsa* negations, rejecting (1) would force you to accept (2), violating LEM. But if they are *prasajya*, Nāgārjuna is not asserting (2) when he denies (1). He is saying, "The predicate 'exists' (inherently) does not apply." When he denies (2), he is saying, "The predicate 'does not exist' (inherently) *also* does not apply."

  **Logical Consequence:** This moves the discussion out of bivalent logic (True/False) into a logic of **inapplicability**. The tetralemma isn't a set of four truth-values; it is an exhaustive list of possible conceptual relations to reality. By rejecting all four via *prasajya*, Nāgārjuna isn't creating a contradiction; he is demonstrating that the conceptual framework required to generate the four options is itself defective when applied to the ultimate.

  ### 2. The Target of Negation: *Svabhāva* vs. Existence

  Your friend's objection assumes the predicate is $E(x)$ ("x exists"). If Nāgārjuna denies $E(x)$ and $\neg E(x)$, he is breaking logic. But the conservative reading insists the predicate is actually $S(x)$ ("x exists with *svabhāva*").

  *Svabhāva* means intrinsic, independent, uncaused, and permanent existence.

  *   **Koṭi 1:** Nirvāṇa has *svabhāva*. (Denied: Nirvāṇa is not an independent entity.)
  *   **Koṭi 2:** Nirvāṇa lacks *svabhāva* (in the sense of being a distinct nothingness). (Denied: Emptiness is not a "thing" or a void.)
  *   **Koṭi 3:** It is both. (Denied: Logically incoherent combination of the above.)
  *   **Koṭi 4:** It is neither. (Denied: Still a conceptual position.)

  **Why this matters:**
  By fixing the target as *svabhāva*, Nāgārjuna avoids nihilism. He can deny that nirvāṇa *exists* (inherently) without denying that it is *experienced* or *attained* conventionally.

  If the friend asks, "But does nirvāṇa exist or not?" the Madhyamaka reply is, "Existence is a dependent concept. To ask if the dependent has independent existence is a category error." This is akin to asking, "Is the number 7 married or unmarried?" Denying both "7 is married" and "7 is unmarried" isn't a logical violation; it's a rejection of the predicate's domain.

  ### 3. Two Truths: Equivocation or Scope Distinction?

  The charge of equivocation is that Nāgārjuna uses "exists" to mean one thing in conventional truth (*saṃvṛti-satya*) and another in ultimate truth (*paramārtha-satya*), switching between them to avoid refutation.

  The conservative reconstruction argues this is not a fallacy of equivocation but a **parameterized semantics**.

  *   **Conventional Truth:** The domain of dependent origination (*pratītyasamutpāda*). Here, "exists" means "functions causally." A table exists because it holds tea. Nirvāṇa exists because it ends suffering.
  *   **Ultimate Truth:** The domain of analysis into final constituents. Here, "exists" means "exists inherently." A table does not exist because it is only wood/nails/concept. Nirvāṇa does not exist because it is the cessation of grasping, not a graspable object.

  **MMK 24.18** is the key text here: *"That which is dependent origination, we call it emptiness. That is a dependent designation; that itself is the middle path."*

  This verse collapses the distinction. Ultimate truth isn't a *different place* where things don't exist; it is the *nature* of conventional things. Therefore, Nāgārjuna isn't equivocating; he is asserting that **conventional existence *just is* the lack of inherent existence.**

  *   **Friend's Objection:** "So you're saying it exists and doesn't exist."
  *   **Reply:** "I am saying it functions (conventionally) precisely *because* it lacks inherent nature (ultimately). If it had inherent nature, it could not change, interact, or cease, and thus could not function."

  This avoids the "rescue maneuver" charge because the two truths are defined relationally from the start, not introduced ad hoc when the logic gets tight.

  ---

  ### Assessment: Conservative vs. Paraconsistent (Garfield/Priest)

  Now, to your final question: Does this conservative reconstruction hold water, or do Jay Garfield and Graham Priest have the upper hand with their dialetheist (true contradiction) reading?

  **The Case for Garfield/Priest (Paraconsistent):**
  Garfield and Priest argue that the conservative reading is too "tame." They point out that Nāgārjuna sometimes seems to affirm the third *koṭi* (both) or fourth *koṭi* (neither) in ways that look like genuine contradictions.
  *   **Strength:** It takes the text's radicalism seriously. It explains why Nāgārjuna seems to push language to the point of breakdown. If reality is empty, perhaps it *cannot* be captured by consistent logic, so the only honest description is a contradiction.
  *   **Weakness:** It risks reifying "contradiction." If you say "True contradictions exist," have you not just assigned *svabhāva* to "contradiction"? It turns Madhyamaka into a metaphysics of inconsistency, whereas Nāgārjuna's goal is soteriological (ending suffering), not metaphysical.

  **The Case for the Conservative (*Prasajya*) Reading:**
  *   **Strength:** It aligns better with the Indian logical context. The *prasajya/paryudāsa* distinction was available to Nāgārjuna (or his commentators) and solves the logical problems without requiring us to abandon LNC. It treats Madhyamaka as a therapy for *prapañca* (conceptual proliferation). The goal isn't to find the *true* description of reality (even a contradictory one), but to stop describing reality conceptually altogether.
  *   **Weakness:** It can feel like a "get out of logic free" card. If every negation is *prasajya*, does Nāgārjuna assert *anything*? (He anticipates this in MMK 24: "If I had a thesis, I would be at fault.")

  **My Verdict:**
  The **conservative *prasajya* reconstruction is logically more robust** against the charge of mysticism, specifically for a dialogue with a formal logician.

  Here is why: The paraconsistent reading accepts that the contradictions are *true*. The conservative reading argues that the contradictions are *ill-formed*.
  If your friend is a logician, they care about the conditions under which a proposition has a truth value. The conservative reading argues that Nāgārjuna is challenging the **truth-aptness** of the propositions, not their truth values.

  *   **Paraconsistent:** "P and not-P" is True.
  *   **Conservative:** "P" presupposes *svabhāva*. Since *svabhāva* is empty, "P" lacks a truth condition. Therefore, "P and not-P" is not a contradiction; it is a dissolution of the terms.

  The paraconsistent reading is philosophically exciting and captures the *feeling* of the text's radicalism. However, the conservative reading better captures the *method*. Nāgārjuna is not building a system (even a paraconsistent one); he is dismantling the impulse to systematize.

  **Recommendation for your next dinner:**
  Tell your friend: "Nāgārjuna isn't violating the Law of Non-Contradiction; he's violating the Law of Bivalence by challenging the presuppositions of the predicates. He's not saying 'A and not-A are both true.' He's saying 'A assumes intrinsic existence. Intrinsic existence is a null reference. Therefore A is neither true nor false; it is inapplicable.' The Two Truths aren't two worlds; they are two ways of looking at the same world—one that reifies concepts and one that sees their dependency. It's not mysticism; it's semantic therapy."

  That should keep the argument going for at least another course.
