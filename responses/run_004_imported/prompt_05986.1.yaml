answer: |-
  **Setting:** *The hotel bar, downstairs from the conference hall. It is loud, clinking with ice and post-presentation adrenaline. Elena (a Williamsian internalist) and Marcus (a Parfitian externalist) are standing near a high table, nursing cheap wine.*

  **Marcus:** That was a vigorous defense of Williams up there, Elena. I particularly liked the bit about the "sound deliberative route" not being a Trojan horse for external norms. But you knew I'd come at you with Parfit's Tuesday man.

  **Elena:** I did. And I know the standard move. The agent who cares about everything in his future except future Tuesdays is irrational. Therefore, there must be an objective reason to care about future Tuesdays. Therefore, Williams is wrong.

  **Marcus:** Roughly. Parfit's point is that this agent isn't making a factual error. He knows it's Tuesday. He knows pain hurts. He isn't suffering from a failure of imagination. He just doesn't care. If Internalism says reasons are grounded in the *Subjective Motivational Set* (the *S*), and his *S* lacks concern for future Tuesdays, then Internalism says he has no reason to avoid Tuesday pain. But that's absurd. He *does* have a reason. So reasons must be external to the *S*.

  **Elena:** It is absurd. I grant you that. But the leap from "he is irrational" to "therefore external reasons exist" is where I dig in. Williams allows for substantive irrationality, not just instrumental failure. If I desire to drink gin but believe this is petrol, I'm instrumentally irrational. But Williams also talks about the deliberative route including imagination and coherence.

  **Marcus:** But coherence with *what*? If his *S* is coherent—he wants pleasure on Mondays, Wednesdays, Sundays, but explicitly excludes Tuesdays—where is the inconsistency? It's arbitrary, yes. But arbitrariness isn't logical contradiction.

  **Elena:** Here's where I have to stretch the "sound deliberative route" without breaking it. I'd argue that the Tuesday-indifferent man is failing to recognize a constitutive feature of his own agency. To be a prudential agent—to have an *S* that projects into the future at all—is to acknowledge the normative significance of temporal location *as such*. If he grants reasons to his future self on Monday but denies them to his future self on Tuesday, he is treating his own future existence as fragmented in a way that contradicts the very act of planning.

  **Marcus:** That sounds suspiciously like a Kantian constitutive aim argument smuggled into Williams's Humean framework. You're saying there's a norm of "temporal neutrality" built into agency itself. If that's true, isn't that an external reason? It binds him regardless of whether he currently desires to be temporally neutral.

  **Elena:** Not necessarily. Think of it as a condition of intelligibility. If his *S* contains a desire for "my well-being," the content of that concept imposes constraints. If he says, "I want my well-being, except on Tuesdays," he isn't just having a weird desire; he's misusing the concept of "my well-being." The reason to avoid Tuesday pain is internal because it's derived from what he *already* wills (his well-being), once we correct the conceptual confusion. It's not an external norm imposed from the sky; it's an internal norm of coherence within the *S*.

  **Marcus:** But Parfit anticipates this. He'd say the man can simply say, "I don't care about 'well-being' as a unified concept. I care about *me-now* and *me-on-non-Tuesdays*." As long as he's clear about that, where is the error? You're relying on the intuition that he *ought* to care about the Tuesday self. That "ought" is doing all the work. If you strip away the intuition, all you have left is a description of a man with a peculiar motivational set.

  **Elena:** If I strip away the intuition, I still have the deliberative failure. But let me turn the pressure back on you, Marcus. You say there's a reason-constituting fact: "Future pain is a reason to avoid it." But when we look at the Tuesday man, what are we actually observing? We observe a violation of our shared normative expectations. We feel blame. We feel he's defective. Parfit says that's because he's violating an objective truth. But isn't it equally plausible that we're just projecting our own evolved prudence onto him? We are hardwired to care about our futures. He isn't. We call that "irrational" because it threatens social coordination and empathy. Why posit a spooky normative fact when "socially disruptive psychological anomaly" explains the data?

  **Marcus:** Because "socially disruptive" doesn't capture the *normativity*. If he were alone on a desert island, indifferent to his future Tuesday pain, we'd still say he's making a mistake. Not a strategic mistake, but a rational one. If reasons were just projections of our dispositions, then if we all evolved to be Tuesday-indifferent, it would be *rational* to be Tuesday-indifferent. But Parfit's claim is that it would still be irrational, even if the whole human race did it. The reason exists independently of our dispositions.

  **Elena:** That's the "queerness" worry, though. If this reason exists independently of our dispositions, how does it connect to action? Williams's killer point: An external reason statement must be able to explain an action. If the Tuesday man has no motivation to avoid Tuesday pain, and you say "You have a reason to," what does that mean? It means "You would have a reason if you were rational." But if rationality itself requires a motivation he lacks, you're just defining him out of the club. You have a reason statement that can never motivate the person it addresses. It's a reason in name only.

  **Marcus:** I concede that's the hardest hill for Externalism to climb. But I'd refine the view. It's not that the reason *motivates* him magically. It's that the reason *justifies* the criticism of his lack of motivation. The normativity isn't a causal push; it's a standard of assessment. You Internalists are so worried about the "guidance" function of reasons that you sacrifice the "assessment" function. We need to be able to say he *ought* to care, even if he doesn't. If Internalism can't say that without referencing a desire he doesn't have, Internalism is toothless.

  **Elena:** But if I say "He ought to care," I mean "He would care if he deliberated soundly from his existing *S*." I'm trying to keep the tether to motivation. If you cut that tether, you solve the problem of arbitrariness, but you create the problem of alienation. Why should *I* care about your objective facts? If they don't hook into my *S*, they aren't reasons *for me*. They're just facts.

  **Marcus:** And that's the standoff, isn't it? You're willing to let the Tuesday man off the hook of "objective irrationality" to save the link between reasons and motivation. I'm willing to accept that reasons might not always motivate to save the idea that some things are genuinely worth caring about.

  **Elena:** Not quite. I'm not letting him off the hook. I'm saying his irrationality is internal—a failure to see that his own commitment to prudence undermines his Tuesday indifference. But I admit, Marcus, that to make that stick, I have to make "sound deliberation" do a lot of heavy lifting. It starts to look like I'm smuggling in an objective norm of temporal neutrality and calling it "internal coherence." If I admit that, the distinction blurs.

  **Marcus:** And I admit, Elena, that if I can't explain how these objective reasons relate to the agent's psychology without sounding like I'm invoking magic, my view remains metaphysically extravagant. Perhaps the truth is that reasons require *both* an objective ground (the badness of pain) and a subjective capacity to recognize it (the *S*).

  **Elena:** So you'd concede that without the *S*, the reason is inert?

  **Marcus:** I'd concede that without the *S*, the reason doesn't *explain* action. But I won't concede that without the *S*, the reason doesn't *exist*. The Tuesday man has a reason to avoid the pain, even if he burns his hand on purpose. That's the line I won't cross.

  **Elena:** And I won't cross the line that says a reason exists for an agent that could never, even under ideal reflection, motivate them. If ideal reflection from his *S* leaves him indifferent, then for him, it's not a reason. It might be a reason for *us*, judging him. But not for *him*.

  **Marcus:** So we agree that the Tuesday man is a disaster. We just disagree on whether the disaster is that he's violating a law of the normative universe, or that he's failing to live up to the internal logic of his own agency.

  **Elena:** And whether "the internal logic of his own agency" is just a polite way of saying "the law of the normative universe."

  **Marcus:** *(Raises glass)* To the unresolved tension.

  **Elena:** *(Clinks glass)* To the sound deliberative route. Though I suspect we're still on it.
