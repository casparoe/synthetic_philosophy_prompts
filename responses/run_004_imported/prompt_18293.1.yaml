          *   *Critic:* Presses the WKR objection.
      *   **Key Arguments/Examples:**
          *   Critic opens with the "Demon/Mud" case (admiring mud for money).
          *   Defender distinguishes between object-given reasons (value-relevant) and state-given reasons (incidental benefits).
          *   Critic challenges whether this distinction presupposes value (circularity) and extends the problem to belief (Pascal's Wager/Pragmatic Encroachment).
      *   **Ending:** No clear winner; agreement on what the distinction needs to deliver to succeed.
      *   **Format:** Dialogue.

  2.  **Character Conception:**
      *   *Defender (Let's call her Elena):* Analytical, precise, committed to reducing value to reasons. Wants to avoid primitive value properties.
