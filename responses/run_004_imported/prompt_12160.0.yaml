answer: |-
  **Setting:** *The lobby bar of the Marriott. It's 11:30 PM on the second night of the American Society for Bioethics and Humanities annual meeting. The ice in Elena's gin and tonic has melted slightly. Marcus is nursing a scotch, neat. They are both wearing lanyards that have slid around to the back of their necks.*

  **Marcus:** You let him off too easy on the panel, Elena. When he asked about the ISS [Idiopathic Short Stature] cases, you retreated straight to Daniels.

  **Elena:** I didn't retreat. I entrenched. Norman Daniels is the only reason we have a budget for pediatric endocrinology at all. If we lose the "restoring normal functioning" distinction, we're adrift.

  **Marcus:** But that's exactly the point. The ISS kid and the GHD [Growth Hormone Deficiency] kid are standing next to each other in the clinic. They are both three standard deviations below the mean. They both get the same nightly injections. They both gain the same two inches. To the world, they are both "short kids who are now less short." But according to your framework, one is a matter of justice, and the other is… what? Consumer luxury?

  **Elena:** It's not about the height, Marcus. You're conflating the *trait* with the *mechanism*. Boorse gets this right. Health is normal species functioning. The GHD kid has a broken subsystem. The pituitary isn't doing what pituitaries are designed to do. The ISS kid's pituitary is working fine; the bones just aren't responding, or it's a polygenic tail-end variation. Medicine's mandate is to fix broken subsystems, not to optimize traits.

  **Marcus:** "Broken subsystems." That's the patch, isn't it? You're trying to save the theory by zooming in on the physiology and ignoring the social reality. I've been reading the literature on this for years, and I keep coming back to the same snag: If the goal of healthcare justice is to protect Fair Equality of Opportunity—as Daniels claims—why does the *cause* of the opportunity loss matter?

  **Elena:** Because if the cause doesn't matter, you've medicalized all disadvantage. If being short limits your opportunity because society is heightist, and we treat the shortness, we are subsidizing prejudice. We should be fighting the prejudice. But we make an exception for the GHD kid because his opportunity range is compromised by *pathology*, not just statistics. He is inside the normal opportunity range *for his species* but can't access it due to disease. The ISS kid is arguably outside the normal range of the species, but healthy.

  **Marcus:** But that's the fiction! The ISS kid *is* pathological by Boorse's own statistical definition. If you set the reference class as "male, age 10," and the kid is below the 1st percentile, Boorse's Biostatistical Theory calls that a dysfunction of the growth process relative to the class. The only reason we call it "idiopathic" and not "disease" is because we can't find the broken gene *yet*. You're drawing a moral line based on current technological ignorance.

  **Elena:** That's a fair critique of Boorse, I'll grant you. But Daniels patches it. We don't treat the statistics; we treat the interference with functioning. Look, if we fund the ISS kid, where do we stop? Do we give GH to the kid at the 5th percentile? The 10th? Do we give cognitive enhancers to the kid at the 10th percentile of working memory? The "normal functioning" line is fuzzy, yes, but it's a bright line compared to "welfare." If you ground this in welfare or direct opportunity, every social disadvantage becomes a medical claim.

  **Marcus:** I'm not saying every disadvantage is medical. I'm saying your "bright line" is morally arbitrary in this specific case. You're telling me the GHD kid is *owed* the drug as a matter of justice, but the ISS kid is not, even though the ISS kid faces the exact same bullying, the exact same hiring discrimination, the exact same psychological burden.

  **Elena:** I am telling you that justice in healthcare is not justice *simpliciter*. It's a specific sphere. If we turn healthcare into a general compensator for all bad luck, the concept collapses. The GHD kid has a claim because his internal assets are damaged. The ISS kid has bad brute luck, sure, but his internal assets are intact.

  **Marcus:** "Internal assets." There it is. You're fetishizing the mechanism. Let me hit you with the *reductio*. Imagine we discover tomorrow that 90% of ISS cases are actually caused by a subtle receptor polymorphism we couldn't detect before. Suddenly, it's "pathological." Suddenly, it's justice. Did the moral status of those children change overnight? No. Only our lab tech changed. That suggests your "normal functioning" criterion is epistemically unstable. It can't bear the normative weight you're putting on it.

  **Elena:** *(Takes a sip, considers)* Okay. That lands. If the moral status hinges on finding a receptor, that's shaky. But here's the counter: The line isn't about the *discovery*; it's about the *limit*. If we admit the ISS kid based on outcome alone, we admit the kid at the 3rd percentile. Then the 5th. Then we are treating height as a positional good. We are entering an arms race. The "broken mechanism" constraint is a firewall against the medicalization of normal variation. It's a triage protocol for a world of limited resources.

  **Marcus:** A firewall that burns the people standing right next to the hole. You're prioritizing the integrity of the *system* over the welfare of the *child*. And honestly, Elena, I think the "subsidizing prejudice" argument you made earlier cuts the other way. If we treat the GHD kid but not the ISS kid, we are effectively saying, "We will help you overcome this stigma, but only if your stigma is caused by a sickness." We are validating the stigma as rational for the ISS kid.

  **Elena:** No, we're saying society doesn't owe you a specific height. It owes you a functioning growth axis.

  **Marcus:** But why? Why is the axis the moral unit and not the person? This is where I think we need to drop Boorse entirely. We should be looking at a Capabilities Approach. What is this child capable of doing? If shortness restricts their capability to navigate the social world without harassment, that's a justice issue. Maybe we don't solve it with GH. Maybe we solve it with anti-discrimination law. But to say the GHD kid gets the GH *and* the justice, while the ISS kid gets neither, is incoherent.

  **Elena:** Because the Capabilities Approach has no off-switch. If height restricts capability, does being ugly restrict capability? Do we fund plastic surgery? If you ground this in "opportunity," you have to define the "normal opportunity range" without referencing "normal functioning." And you can't do it. You end up just saying "whatever gives them the best life." That's not healthcare; that's wish-fulfillment.

  **Marcus:** I'm not saying wish-fulfillment. I'm saying consistency. If the justification for treating GHD is to prevent a life of diminished opportunity due to physical stature, then ISS falls under that umbrella. If the justification is to fix a broken hormone loop, then it's purely biological fetishism. I suspect it's the former, but we pretend it's the latter to save money.

  **Elena:** *(Laughs softly)* We pretend it's the latter to save the concept of medicine. Look, Marcus, I know the ISS case haunts you. It haunts me too. But consider the alternative. If we decouple treatment from pathology, we hand the definition of "need" over to the market. The wealthy will always get the enhancement. By insisting on pathology, we create a category of care that insurance *must* cover. If we blur the line, the GHD kid might lose coverage because the ISS kid diluted the pool. The "normal functioning" line protects the sickest, even if it leaves out the unlucky.

  **Marcus:** That's a pragmatic argument, not a moral one. You're saying, "We lie about the moral theory to protect the budget for the truly sick."

  **Elena:** I'm saying the moral theory *is* that we have a special obligation to repair damage, not to optimize potential. The ISS kid wasn't damaged. He was just dealt a bad hand. Life deals bad hands. Medicine repairs the cheaters and the accidents.

  **Marcus:** But growth isn't an accident. It's a lottery. The GHD kid lost the genetic lottery just like the ISS kid. One lost on the GH gene, one lost on the receptor sensitivity gene. Why is one "damage" and the other "variation"? Because Boorse says so?

  **Elena:** Because one is a deviation from the species design, and the other is the edge of the species design.

  **Marcus:** And who wrote the design specs? Nature? Evolution? Evolution designed us to survive to reproduction, not to get a job at a corporate law firm. If "normal functioning" is evolutionary, neither kid needs GH. They both would have survived in the Pleistocene. So "normal functioning" is already socially constructed. We've just hidden the construction behind a microscope.

  **Elena:** *(Pauses, swirls her drink)* Okay. You've got me on the evolutionary definition. Boorse struggles there. But if we abandon the species-typical functioning line, what's the stopping point? Give me a principle that covers the GHD kid, excludes the kid who is 5'9" and wants to be 6'2", but includes the ISS kid.

  **Marcus:** Thresholds. Not of mechanism, but of harm. If your height places you below a threshold where social functioning is severely compromised—say, below the 1st percentile—you qualify for intervention, regardless of mechanism. Above that, it's enhancement.

  **Elena:** So you're replacing a biological bright line with a statistical bright line.

  **Marcus:** Yes. But it's an honest one. It admits we are treating the *social disadvantage of shortness*, not the *hormone*.

  **Elena:** And who sets the threshold? The 1st percentile? The 3rd? That's a political decision, not a medical one. By keeping it tied to pathology, we keep it in the clinic. If we move it to "social harm," we move it to the legislature. Do you want politicians deciding who is short enough to deserve state aid?

  **Marcus:** *(Sighs)* No. I don't. But I also don't want endocrinologists playing god with a moral theory that doesn't hold water.

  **Elena:** Then we're stuck. We need the fiction of the "broken mechanism" to protect the GHD kid's coverage, even if we know the ISS kid is morally similar.

  **Marcus:** Or we admit that "health" is a normative concept, not a scientific one, and stop pretending Boorse gives us an escape from value judgments.

  **Elena:** *(Raises her glass)* To value judgments, then. And to the hope that the next generation of ethicists finds a better map than Daniels.

  **Marcus:** *(Clinks glass)* To the kids who are still short, regardless of the mechanism.

  **Elena:** Cheers.

  *(They drink. The silence between them is comfortable, the kind shared by people who know the problem won't be solved tonight, but glad they aren't ignoring it.)*
