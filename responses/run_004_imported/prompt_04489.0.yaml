answer: |-
  First off, do not worry about the density of that text. You are reading 17th-century metaphysical correspondence that was often written in a kind of shorthand between two geniuses who shared a specific theological and philosophical vocabulary. It is supposed to be hard. You have also stumbled onto one of the most significant fault lines in the history of modal logic (the logic of possibility and necessity).

  Let's tackle your questions in order: the grammatical gap, the metaphysical distinction you're sensing, and whether this ancient fight actually matters for the David Lewis stuff you started with.

  ### 1. The Grammatical Gap: "Derived from his..."

  You asked what the sentence "all which can be attributed to him may be derived from his..." is supposed to end with.

  In the standard translations of the Leibniz-Arnauld correspondence (specifically the letter to Arnauld from April 30, 1687), the missing word is **"concept"** (or sometimes translated as **"notion"**).

  In Latin, Leibniz writes *ex ejus notione* ("from his notion/concept").

  This is the key to the whole passage. Leibniz is arguing for what scholars call the **Complete Individual Concept (CIC)**. His theory is that an individual substance (like you, or Adam) isn't just a "thing" that *has* properties. Rather, the individual *is* the sum total of all their properties—past, present, and future—wrapped up in a single conceptual package.

  So, the sentence means: If you have the full, complete concept of Adam, you could logically derive every single thing that ever happens to him (eating the apple, having Cain as a son, etc.) just by analyzing that concept.

  ### 2. Reading 1 vs. Reading 2: Is Leibniz Sliding?

  You asked if Leibniz is saying:
  1.  **Metaphysical Impossibility:** The actual Adam *cannot* turn up in another history (Counterpart style).
  2.  **Strict Essentialism:** Adam *could* exist elsewhere, but his properties are so fixed he wouldn't be different.

  You suspect these are different claims and that Leibniz slides between them. Here is the scholarly consensus: **For Leibniz, these two claims collapse into the same thing.**

  In modern philosophy (post-Kripke), we tend to think of a person as a "substrate" or a "hook" that holds properties. We think, "I am me, and I *happen* to have brown hair, but I could have had blonde hair." That is Transworld Identity (Reading 2, loosely).

  Leibniz rejects the "substrate" view. For him, **you are your properties.** There is no "you" underneath the properties. If you change the properties, you have literally changed the subject.

  So, to answer your specific worry: Leibniz is not being careless. He is arguing that Reading 2 is incoherent. You cannot say "Adam exists but with different circumstances." If the circumstances are different, the *concept* is different. If the concept is different, it is not Adam.

  Therefore, he lands firmly on **Reading 1**. The "Adam" who doesn't eat the apple is not the *same* Adam who did eat the apple, merely in a different situation. It is a *different individual concept* entirely. In God's mind, there is a concept "Adam-Eats-Apple" and a concept "Adam-Does-Not-Eat-Apple." They are as distinct as you and your neighbor.

  This is why he says: *"if he had had other circumstances, this would not have been our Adam, but another."* He isn't saying Adam is too stubborn to change; he's saying "Adam" is defined by the change.

  ### 3. Leibniz vs. Lewis: Is it the same debate?

  You asked if this matters for the modern David Lewis debate, or if it's a distinction without a difference.

  It matters immensely, but there is a crucial twist.

  **David Lewis (Counterpart Theory):**
  Lewis says you cannot be in another world because worlds are **spatiotemporally isolated**. You are made of *this* stuff in *this* spacetime. A guy in another spacetime made of *that* stuff cannot be *you*, no matter how similar. He is your "counterpart."
  *   **Why?** Because of physics and the nature of concrete reality.

  **Leibniz (Complete Concept Theory):**
  Leibniz says you cannot be in another world because you are a **logical concept**. Your identity is constituted by your entire history. To change the history is to change the identity.
  *   **Why?** Because of logic and the nature of predication.

  **The Similarity:**
  Both Leibniz and Lewis deny **Transworld Identity**. They both agree with your intuition: asking "What if *I* had done X?" is technically referring to a different entity (a counterpart or a different individual concept), not the literal "you."

  **The Difference (Where it matters):**
  For Lewis, the other worlds are **real**. That counterpart is flesh and blood, living a real life somewhere in the pluriverse.
  For Leibniz, the other "Adams" are **ideas in the mind of God**. They are possible, but they are not actualized. Only one "Adam" gets created (the one in the "Best of All Possible Worlds").

  So, when you ask, "Doesn't that make 'what if' questions pointless?"
  *   **Lewis says:** No, because that counterpart is real! It's just not *you*.
  *   **Leibniz says:** No, because God considered that other Adam and rejected him. The "what if" is a study in God's wisdom, not a literal alternate reality.

  ### 4. Why your intuition is actually Kripkean

  The reason Lewis's view (and Leibniz's) feels "off" to you is that you are intuitively siding with **Saul Kripke**, the philosopher who revolutionized this debate in the 1970s (in *Naming and Necessity*).

  Kripke argued against the Leibniz/Lewis view. He said: "When I say 'Nixon might have lost the election,' I am talking about *Nixon*. I am not talking about a 'counterpart Nixon' or a 'concept of Nixon.' I am talking about the man himself, in a counterfactual situation."

  Kripke argued that we can identify individuals across worlds without needing all their properties to match. He called this **Rigid Designation**.

  So, the fight you are reading about in the 1680s (Leibniz vs. Arnauld) is the exact same fight that happened in the 1970s (Lewis vs. Kripke).
  *   **Leibniz/Lewis:** Identity is tied to properties/descriptions. (No Transworld Identity).
  *   **Arnauld/Kripke:** Identity is tied to the origin/essence of the thing itself. (Transworld Identity is possible).

  ### Summary

  1.  **The Grammar:** The sentence ends with "concept" or "notion." It refers to the Complete Individual Concept.
  2.  **The Metaphysics:** Leibniz isn't sliding between your two readings. He believes Reading 2 is impossible. If the properties change, the individual changes. Therefore, Transworld Identity is impossible (Reading 1).
  3.  **The Relevance:** This is the direct ancestor of the Lewis/Kripke debate. Your feeling that Lewis's view makes "what if" questions feel weird is the exact objection Kripke raised against Lewis. Leibniz would tell you that your feeling is an illusion caused by thinking of "Adam" as a vague sketch rather than a complete logical package.

  You aren't missing a subtlety; you're noticing that Leibniz's definition of "self" is much stricter than our modern intuition allows. We think we are the *actors*; Leibniz thinks we are the *scripts*. If you change a line in the script, it's a different play.
