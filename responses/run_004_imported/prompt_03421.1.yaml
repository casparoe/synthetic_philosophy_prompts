prompt: |-
  For my seminar on formal epistemology, I've been comparing David Lewis's Principal Principle—that credence in a proposition should match its known objective chance—with Bas van Fraassen's Reflection Principle, which requires current credence to defer to one's own anticipated future credence. Several commentators treat these as two instances of a single, more general norm of "expert deference," and I'd like your help assessing that claim: what, precisely, does each principle add to the bare idea of deferring to an expert, and are the two really on a par? In particular, memory-loss cases such as Sleeping-Beauty-style scenarios are often presented as counterexamples to Reflection without posing any obvious analogous threat to the Principal Principle. Can you explain this asymmetry, and say whether it reflects a genuinely different justification behind each principle, or only a technical difference in how they are formulated?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**
      *   **Topic:** Formal Epistemology (David Lewis's Principal Principle vs. Bas van Fraassen's Reflection Principle).
      *   **Core Question:** Are these two principles really instances of a single "expert deference" norm, or are they fundamentally different?
      *   **Specific Focus:** The asymmetry regarding memory-loss cases (e.g., Sleeping Beauty). Reflection seems vulnerable here; Principal Principle (PP) does not.
      *   **Task:** Explain what each adds to "expert deference," assess if they are on a par, explain the asymmetry in memory-loss cases, and determine if this reflects a justificatory difference or just a technical formulation difference.
      *   **Context:** Seminar on formal epistemology (needs high-level, precise, philosophical analysis).

  2.  **Initial Knowledge Retrieval & Structuring:**
      *   *Principal Principle (PP):* $C(A | Ch(A)=x \land E) = x$. Credence ($C$) should match objective chance ($Ch$) given admissible evidence ($E$). Chance is an "expert" about truth.
      *   *Reflection Principle (RP):* $C_t(A | C_{t'}(A)=x) = x$. Current credence ($C_t$) should match anticipated future credence ($C_{t'}$). Future self is an "expert" about truth (assuming no irrationality/forgetting).
      *   *Expert Deference:* General schema $C(A | Expert(A)=x) = x$.
      *   *The "Single Norm" Claim:* Many (e.g., Hall, Arntzenius) argue they are unified under a general deference principle.
      *   *The Asymmetry:* Sleeping Beauty (SB) violates RP (on some interpretations) but PP holds. Why? SB involves self-locating uncertainty and memory loss. RP assumes a continuous, rational agent. PP relies on objective chances which don't care about the agent's memory.
      *   *Justification:* PP is metaphysical/semantic (chance *means* something about credence). RP is diachronic rationality (planning/commitment).

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. State the thesis: While they share a formal structure of conditionalization on an "expert" variable, they differ fundamentally in the *nature* of the expert and the *source* of the norm. The asymmetry in memory-loss cases reveals this deep justificatory split.

      *   **Section 1: The Common Structure (Expert Deference):**
          *   Define the general schema: $C(P | \text{Expert says } P \text{ is } x) = x$.
          *   For PP: Expert = Objective Chance.
          *   For RP: Expert = Future Self.
          *   Why the unification looks plausible: Both constrain current credence based on an external (or quasi-external) authority.

      *   **Section 2: What Each Adds (Specific Nuances):**
          *   *PP:* Adds the concept of *admissibility*. Not all info is compatible with chance. It links metaphysics (chance) to epistemology (credence). It's synchronic (at a time) but relates to future outcomes.
          *   *RP:* Adds the concept of *diachronic coherence*. It's about temporal consistency of the *same* agent. It assumes rationality is preserved over time.

      *   **Section 3: The Asymmetry (Sleeping Beauty & Memory Loss):**
          *   *The Case:* Beauty wakes up. She knows she might have been woken before (memory wipe).
          *   *RP Violation:* On Sunday, she knows her Monday credence in Heads will be 1/2 (say). But on Monday, her credence might be 1/3 (Thirder view). If she knows on Sunday that on Monday she will be 1/3, RP says she should be 1/3 on Sunday. But standard Elga argument suggests she should be 1/2 on Sunday. Or, conversely, if she plans to update on new self-locating info, RP fails because the future self has *less* information (indexical uncertainty) or different context.
          *   *Actually, the standard counterexample:* RP fails when the agent anticipates *irrationality* or *information loss*. In SB, is it information loss? Yes, she loses track of *which* awakening.
          *   *PP Stability:* Chance of Heads is 1/2. Beauty knows this. PP says $C(\text{Heads} | Ch=1/2) = 1/2$. This remains stable regardless of her memory state. The chance function doesn't change based on her memory.
          *   *Why the difference?* RP requires the future self to be a *strictly better* or *equal* epistemic agent regarding the proposition. Memory loss breaks the "future self is an expert" link. PP requires Chance to be an expert. Chance is not affected by the agent's memory.

      *   **Section 4: Justification vs. Formulation:**
          *   Is it just technical? No.
          *   *PP Justification:* Humean Best System or Primitivism. Chance *defines* rational credence. It's a bridge principle between ontology and epistemology.
          *   *RP Justification:* Dutch Book / Diachronic Coherence. It's about avoiding sure loss in betting across time. It relies on the agent's identity persisting without epistemic degradation.
          *   *Conclusion on Asymmetry:* The asymmetry reflects the fact that *objective chance* is robust against agent-centered ignorance, whereas *future credence* is sensitive to agent-centered ignorance (memory loss, self-location).

      *   **Section 5: Synthesis/Assessment:**
          *   Are they on a par? Formally, yes. Normatively/Metaphysically, no.
          *   PP is a constraint on how we relate to the world.
          *   RP is a constraint on how we relate to our future selves.
          *   The "General Expert Deference" view (e.g., Hall 1994) is useful heuristically but masks the fragility of RP in self-locating contexts.

  4.  **Refining the Argument (Self-Correction/Nuance Check):**
      *   *Correction on SB:* Be careful with the SB details. The conflict is usually between RP and Conditionalization in SB. If Beauty is a Thirder, she violates RP (Sunday credence 1/2, expects Monday credence 1/3). If she is a Halfer, she might satisfy RP but violate Conditionalization on new self-locating info.
      *   *Key Insight:* The "Expert" in RP is *indexical*. The "Expert" in PP is *objective*.
      *   *Arntzenius/Hall:* Mention that some philosophers try to save RP by refining the proposition (adding time indices), but this complicates the "simple deference" view.
      *   *Admissibility:* Don't forget to mention that PP has the "admissible evidence" clause, which is its own technical hurdle, distinct from RP's hurdles.

