answer: |-
  Your discomfort is well-founded. In fact, your intuition aligns with the consensus of modern statistical reformers, methodologists, and the broader movement to address the replication crisis.

  To give you the short answer first: **The student's approach was statistically invalid for the metric she used (the p-value), and your colleague's defense mixes two incompatible statistical philosophies in a way that excuses bad practice.**

  Here is the breakdown of why this is problematic, why the Bayesian argument is technically true but practically misleading in this context, and what this says about the philosophical divide.

  ### 1. The Frequentist Problem: Why the p-value is broken here
  The student reported a **p-value** ($p=.03$). P-values are a **frequentist** tool. In frequentist statistics, a p-value is not just a measure of the data you have; it is a measure of the data you *could have had* under a specific procedure.

  A p-value answers the question: *"If the null hypothesis were true, what is the probability of obtaining a result this extreme or more extreme, given the specific sampling plan I committed to?"*

  By checking the data at $n=40$, seeing it wasn't significant, and then continuing to $n=76$, the student engaged in **optional stopping** (often called "p-hacking" or "peeking").
  *   **The Inflation:** Every time you check the data, you give chance another opportunity to hand you a "significant" result. If you check after every participant, you can eventually force *any* dataset to cross $p < .05$ purely by noise.
  *   **The Lie:** By reporting $p=.03$ without correcting for the multiple "peeks," the student is claiming a false positive rate of 3%. In reality, because of the optional stopping, the actual false positive rate for that procedure might be 15%, 20%, or higher.
  *   **The Verdict:** Under the rules of the game she chose to play (NHST/p-values), she cheated. The number she reported is mathematically meaningless.

  ### 2. The Bayesian Defense: What your colleague got right (and wrong)
  Your colleague argued that "the data is what it is" and that a Bayesian analysis wouldn't care about the stopping rule. This is based on the **Likelihood Principle**.

  *   **The Theory:** In Bayesian inference, you update your prior beliefs using the likelihood of the observed data. The Likelihood Principle states that all the evidence relevant to the hypothesis is contained in the likelihood function of the *observed* data. How you decided to stop collecting data (the stopping rule) does not change the likelihood of the data you actually observed. Therefore, a pure Bayesian calculation of the posterior probability would indeed yield the same number regardless of whether she stopped at 40 or 76.
  *   **The Catch:** The student did **not** report a Bayesian analysis. She reported a p-value. You cannot use Bayesian theory to justify frequentist errors. It is like playing poker, drawing extra cards when you don't like your hand, and then defending yourself by saying, "Well, in Chess, moving pieces like that is fine."
  *   **The Nuance:** Even Bayesians acknowledge that while the *evidence* (the posterior) might be valid, the *decision process* matters. If you decide to stop collecting data only when the Bayes Factor favors your hypothesis, you can still bias the literature, though generally less severely than with p-values.

  ### 3. Why this fuels the Replication Crisis
  You suspected this is exactly the sort of thing blamed for the replication crisis. You are correct.

  This specific practice (optional stopping without correction) is a **Questionable Research Practice (QRP)**.
  *   **False Positives:** It systematically inflates the number of false positives published in the literature.
  *   **Non-Replication:** When other labs try to replicate the study, they (hopefully) use a fixed sample size. Because the original result was a false positive generated by peeking, the replication fails.
  *   **Reform:** This is precisely why **preregistration** has become the gold standard in psychology. Researchers must declare their sample size and stopping rules *before* collecting data to prevent exactly this behavior.

  ### 4. The Philosophical Disagreement: Error vs. Evidence
  Since you teach philosophy, this distinction might resonate: The conflict here is between **Procedural Reliability** (Frequentism) and **Evidential Support** (Bayesianism).

  *   **Frequentism (Error Statistics):** Focuses on the *process*. "Was the procedure reliable enough that, in the long run, we won't be wrong too often?" The stopping rule matters because it changes the long-run error properties of the test. The student's process was unreliable.
  *   **Bayesianism (Confirmation Theory):** Focuses on the *product*. "Given this specific data, how much should I believe the hypothesis?" The stopping rule is irrelevant to the logical relationship between the data and the hypothesis.

  Your colleague is arguing from the Bayesian perspective of *evidential support* ("The data supports the hypothesis regardless of when we stopped"). However, she is dismissing the frequentist concern of *error control* ("We cannot trust this claim because the process guarantees too many false alarms").

  In a field like psychology, which relies on NHST (p-values) to make claims about general truths, error control is paramount. Dismissing it because "Bayesians wouldn't care" is a category error.

  ### 5. How to push back (if you choose to)
  If this comes up again, you don't need to be a statistician to make the philosophical point. You can say:

  1.  **The Metric Mismatch:** "If she wanted to use a stopping-rule-irrelevant framework, she should have reported a Bayes Factor. By reporting a p-value, she invoked frequentist error rates, which this procedure violates."
  2.  **The Long-Run Consequence:** "Even if the evidence in *this* dataset is strong, allowing this practice ensures that the literature will be filled with false positives. We are optimizing for publishable results rather than reliable knowledge."
  3.  **The ASA Statement:** You can cite the American Statistical Association's 2016 statement on p-values, which explicitly warns that p-values lose their meaning if the stopping rule is not accounted for.

  ### Summary
  Your intuition was correct. The student's approach is a textbook example of p-hacking. Your colleague is theoretically correct that Bayesian *evidence* doesn't depend on stopping rules, but she is practically wrong to suggest that this excuses the student's reporting of a frequentist p-value. This behavior undermines the reliability of scientific claims and is a known driver of the replication crisis.

  You aren't suffering from "frequentist intuition" that doesn't survive scrutiny; you are recognizing a breach of scientific integrity that the field is currently trying to fix.
