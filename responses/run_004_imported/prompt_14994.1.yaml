      *   **Bayesian Perspective:**
          *   Bayesian inference updates beliefs based on likelihoods ($P(Data|Hypothesis)$).
          *   The Likelihood Principle states that all evidence in the data is contained in the likelihood function.
          *   Stopping rules are generally irrelevant to the *interpretation of the evidence* (the posterior distribution) *if* the stopping rule is non-informative (i.e., doesn't depend on the parameter value in a way that biases the likelihood).
          *   *However:* While the *interpretation* of the final data might be robust, the *decision process* (stopping when significant) can still lead to misleading conclusions if priors are weak or if one treats the Bayes Factor like a p-value.
