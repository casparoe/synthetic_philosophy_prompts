      *   **Bayesianism:** Focuses on degree of belief in the specific hypothesis given the specific data (evidential support). "Given *this* data, how likely is the hypothesis?" Stopping rules don't change the likelihood of the observed data.
      *   **The Conflict:** The colleague is technically right about the *Likelihood Principle* (Bayesian view), but wrong to dismiss the practical consequences (Frequentist view) in a field dominated by NHST.
