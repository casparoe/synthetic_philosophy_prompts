answer: |-
  # The Price of Coherence: Why Logical Induction Is Pragmatics, Not Epistemology

  It is easy to see why your coworker was excited. The 2016 Logical Induction paper by Garrabrant et al. is a genuine intellectual landmark. For decades, the intersection of Bayesian probability and mathematical logic was a wasteland. Standard Bayesianism demands "logical omniscience"—if you believe $A$ and you believe $A \implies B$, you are logically required to believe $B$ instantly, with probability 1. Since no human or computer can do this, standard probability theory technically labels all bounded agents as "irrational."

  Logical Induction (LI) seemed to fix this. By modeling beliefs as prices in a prediction market of computable traders, it offered a way to assign probabilities to logical statements (like the digits of Pi or the truth of P vs NP) that evolves over time. The headline theorem—that no efficiently computable trader can exploit the market for unbounded profit—felt like a holy grail. It promised a Dutch Book argument for beings who aren't logically omniscient.

  However, your skepticism cuts to the bone of the matter. You asked whether the "no-exploitation" guarantee makes these market prices *justified beliefs*, or whether it is merely a pragmatic property of a betting game. You further noted that the asymptotic nature of the guarantee allows for uncomputable periods of confident error.

  Here is the verdict: **You are right.** The Logical Induction criterion establishes a standard of *computational coherence*, not *epistemic justification*. Treating LI market prices as "rational credences" in the truth-tracking sense is a category error. The framework tells a bounded agent how to avoid being money-pumped, but it does not tell them how to be right. It is a theory of consistent betting, not a theory of knowledge.

  ### The Epistemic Promise
  To understand where the overreach happens, we have to look at what LI proponents claim. The argument runs like this: In standard decision theory, if your probabilities don't obey the axioms, a clever bookie can construct a "Dutch Book"—a set of bets that guarantees you lose money regardless of the outcome. Therefore, obeying probability axioms is a requirement for rationality.

  LI extends this to logical uncertainty. If your beliefs about mathematical statements aren't "logically inducible," a computable trader can exploit you. Therefore, being a logical inducer is the requirement for rationality when you can't compute all logical consequences instantly. The market prices *are* your beliefs because they represent the only stable state where you aren't leaving money on the table for smarter algorithms.

  This is seductive. It suggests that if you just run the market, the resulting prices are the "rational" degrees of belief for a computer with your limitations. It turns epistemology into an equilibrium condition.

  ### The Pragmatic Objection
  Your objection relies on a classic distinction in philosophy: the gap between *pragmatics* (action/utility) and *epistemology* (truth/justification).

  A Dutch Book argument shows that inconsistent beliefs lead to bad outcomes (losing money). It does not show that consistent beliefs lead to good outcomes (finding truth). You can be perfectly coherent and completely wrong. If I am convinced the moon is made of cheese, and I assign probability 1.0 to that claim and all its logical consequences, I am immune to a Dutch Book. I am coherent. But I am not rational in the sense of tracking reality.

  LI attempts to patch this by forcing the market to interact with the "truth" over time (as proofs are discovered). But as you noted, the guarantee is asymptotic. The theorem states that exploitation becomes impossible *in the limit*. It explicitly admits there is no computable bound on *when* the market corrects itself.

  This is fatal for an epistemic interpretation. Epistemology is about what you should believe *now*, given your evidence *now*. If the LI market can sit at 99% confidence on a falsehood for a million years without being "exploited" (because the trader that would punish it hasn't run fast enough or hasn't been invented yet), then those prices cannot be called "justified beliefs." They are merely *unpenalized* beliefs.

  ### The Best Defense: Coherence as the Only Game in Town
  To be fair, the defenders of LI have a strong counter-argument. They would say you are holding the framework to an impossible standard.

  For a bounded agent, "truth-tracking" is undefined. You cannot check if a statement is true if you can't compute it. So, what is the alternative? If you can't access the truth directly, the only normative standard available is *internal consistency*. If you can't be money-pumped by any strategy you could have realistically thought of (i.e., any efficient computable trader), then you are doing the best any agent in your position *could* do.

  From this view, "rationality" isn't about matching the world; it's about optimizing your cognitive machinery given your constraints. If LI prices are the only ones that survive the evolutionary pressure of the market, they are, by definition, the rational credences for a bounded being. To ask for more is to ask for logical omniscience, which is impossible.

  ### The Verdict: A Category Error
  This defense is sophisticated, but it ultimately fails to bridge the gap. It conflates *survival* with *justification*.

  The core issue is that the LI market prices depend heavily on the *specific set of traders* present in the market, not just on the logical evidence available. The "no exploitation" theorem only protects you from traders that are efficiently computable *relative to the market*. If the "truth-telling" trader is computationally too expensive to participate effectively in the short term, the market price will drift away from the truth, and the theorem says this is fine.

  This means LI prices are relative to the *algorithm*, not the *world*. A belief system that tracks the balance of power in a specific betting market is not a belief system that tracks mathematical reality. It is a system of *operational credences*—numbers you should use to place bets so you don't go bankrupt. They are guides for action, not measures of truth.

  Furthermore, the uncomputable convergence bound is not a minor technicality; it is an epistemic black hole. If I cannot know *when* my beliefs will converge to the truth, I cannot claim my current beliefs are approximations of the truth. I might be in the "confidently wrong" phase that lasts for eons. An epistemic theory that allows an agent to be confidently wrong for an unbounded amount of time without violating any norms of rationality has ceased to be a theory of rationality. It has become a theory of stability.

  ### Conclusion
  Your coworker is right that Logical Induction is a brilliant piece of mathematical engineering. It solves the problem of how to build a reasoning system that doesn't crash when faced with its own ignorance. It provides a robust criterion for *computational coherence*.

  But you are right that it does not solve the problem of *logical uncertainty* in the epistemic sense. The "no-exploitation" guarantee is a pragmatic shield, not an epistemic beacon. It ensures you won't be fooled by a specific class of adversaries, but it does not ensure you are seeing the world clearly.

  So, the verdict is definite: **Logical Induction prices are not rational beliefs.** They are safe betting odds for a bounded agent. They tell you how to keep your wallet safe in a market of algorithms, but they do not tell you what is true. You can tell your coworker that while the paper is a masterpiece of decision theory, it doesn't get to steal the name "epistemology." You can now close the tab and get back to work.
