answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], and I have the distinct honor of being the child of the man of the hour.

  When I was asked to give this toast, I wanted to do something different. I didn't want to just say "90 years is a long time." So, I went to the library. I know, shocking. I pulled a book I read last year by the Roman statesman Cicero called *De Senectute*—"On Old Age."

  Now, Uncle Ray is somewhere in the back row. Ray, if I butcher the pronunciation, please wait until I'm finished to correct my Latin. For everyone else: Cicero wrote this essay 2,000 years ago, arguing that getting old isn't a tragedy. He uses a character named Cato the Elder to list the four big complaints people have about aging, and then he shoots every single one of them down.

  And the crazy thing is, looking at my dad's last few years, he has lived through all four complaints exactly as Cicero described them. So, I want to walk through Cicero's defense of old age, and how my dad proves the Roman philosopher right.

  **Complaint number one:** Cicero says people think old age withdraws you from "active employment." You can't work like you used to. You're out of the game.
  **Dad's version:** Two years ago, Dad handed the keys to the hardware store over to my brother. He stopped stacking lumber. He stopped manning the register.
  **Cicero's answer:** He says you aren't retired from *purpose*. You just switch from doing the heavy lifting to guiding the people who do.
  **The Reality:** Dad might not be cutting keys anymore, but try making a decision in that family business without texting him first. He hasn't withdrawn from active affairs; he's just moved from the floor to the boardroom of the living room. He's not the laborer; he's the architect.

  **Complaint number two:** The body gets weak.
  **Dad's version:** We know the hip is shot. We know the walking stick isn't just a fashion accessory anymore.
  **Cicero's answer:** Cicero admits this one. He says, "Yes, you aren't a wrestler anymore." But he argues that old age doesn't need the strength of a young man any more than a young man needs the strength of an elephant. You use the strength you have.
  **The Reality:** Dad might not be running marathons, but his mental stamina puts people half his age to shame. He might move slower, but he's still standing. And honestly, watching him navigate this room tonight with that hip? That's not weakness. That's grit.

  **Complaint number three:** Old age deprives us of physical pleasures.
  **Dad's version:** Since the surgery, Dad's been pretty vocal that the steak doesn't taste as good, and the wine doesn't hit the same.
  **Cicero's answer:** This is my favorite part. Cicero actually says, "Good riddance!" He calls physical pleasures the "crimes of youth." He argues that when you lose the hunger for the feast, you gain the appetite for conversation.
  **The Reality:** Sure, the food might taste different to him. But look around this room. Dad is feasting on something better than steak. He's feasting on us. He's trading the taste of wine for the taste of company. And if you ask me, the company in this room is a much better vintage.

  **Complaint number four:** This is the big one. Cicero says the final complaint is that old age is too close to death.
  **Dad's version:** Dad handles this by telling everyone he's "stopped buying green bananas."
  **Cicero's answer:** Now, Cicero gets poetic here. He says a life well-lived is like a ripe fruit. It doesn't fall off the tree because it's destroyed; it falls because it's ready. It's natural.
  **The Reality:** But Dad is a little superstitious, so we aren't going to talk about falling off trees. We're going to talk about the ripeness. Cicero argues that the proximity to the end doesn't matter if the living is good. And Dad, you have made the living very good. You aren't counting the days; you're making the days count. You're not waiting for the end; you're enjoying the harvest.

  So, Cicero wrote 2,000 years ago that old age isn't a decline. It's a change of station. It's wisdom over strength. It's conversation over consumption. It's enjoying the fruit because it's finally ripe.

  Dad, you've proven a Roman philosopher right. You've built a life that doesn't fear the numbers, even the big ones.

  Uncle Ray, how was my accent?
  Everyone else, please raise your glasses.

  To the man who knows better than to buy green bananas. To the man who knows that while the body slows down, the spirit doesn't have to. To my father. Happy 90th Birthday.
