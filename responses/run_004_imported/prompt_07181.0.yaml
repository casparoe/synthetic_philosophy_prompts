      *   *Typicality Reasoning:* The friend uses typicality to generate the BB problem (in eternal equilibrium, BBs are typical). But she rejects typicality when it comes to the PH (we are atypical in time). This is inconsistent.
      *   *The "Indexical" Shift:* The BB argument relies on a specific reference class. If I define the reference class as "observers with coherent memories of a low entropy past," BBs are *not* typical. The orthodox argument forces a reference class of "all conscious moments." Why is that the right one?
      *   *Empirical Defeat vs. Rational Prohibition:* The BB hypothesis is empirically defeated (we see a structured past, not random noise), not rationally prohibited. The friend confuses "unlikely given the data" with "irrational to consider."

