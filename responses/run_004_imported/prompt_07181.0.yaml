      *   **Point 1: The Typicality Double Standard.** Standard stat mech uses typicality to predict the future. The BB argument uses typicality to diagnose the past. If typicality is valid for physics, it must apply to the observer too. Rejecting it only when it yields uncomfortable results is ad hoc.
