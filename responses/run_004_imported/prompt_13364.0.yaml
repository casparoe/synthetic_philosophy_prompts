answer: |-
  As a fellow traveler in statistical mechanics, you recognize immediately that the core tension here is not about finance or psychology, but about the definition of an **observable**.

  Samuelson's 1971 critique rests on the implicit assumption that the economic system is ergodic, or that the distinction between time and ensemble averages is irrelevant to rational choice. He treats Expected Utility Theory (EUT) as the axiomatic bedrock of rationality, where the "expectation" is an ensemble average over possible states of the world. Peters' contribution is to point out that for multiplicative wealth dynamics, this assumption is physically false.

  Here is the strongest case for Peters, framed in the language of statistical physics, arguing that Samuelson's dismissal fails because it optimizes for a phantom ensemble rather than the physical trajectory.

  ### 1. The Ergodicity Breach: Observable vs. Expectation
  In statistical mechanics, you know that we care about the ensemble average $\langle A \rangle$ only because we assume (or prove) it equals the time average $\bar{A}$ in the long limit. If a system is non-ergodic, the ensemble average is a mathematical abstraction that no single instrument measuring a single trajectory will ever record.

  Wealth dynamics in gambling and investing are typically multiplicative:
  $$ W_{t+1} = W_t \cdot (1 + f \cdot x_t) $$
  where $x_t$ is the stochastic return.

  Samuelson evaluates rationality based on $\mathbb{E}[W_t]$, the ensemble average wealth at time $t$. For multiplicative processes with volatility, $\mathbb{E}[W_t]$ is dominated by the far right tail of the distribution (the "lucky" trajectories). It grows exponentially at a rate determined by the arithmetic mean of returns.

  However, the **time-average growth rate** for a single trajectory is determined by the geometric mean (or the expectation of the logarithm):
  $$ \bar{g} = \lim_{T \to \infty} \frac{1}{T} \ln \left( \frac{W_T}{W_0} \right) = \mathbb{E}[\ln(1 + f \cdot x)] $$

  Because $\ln(\mathbb{E}[W]) \neq \mathbb{E}[\ln(W)]$ (Jensen's inequality), the system is **non-ergodic**.
  *   **Samuelson's Error:** He prescribes maximizing $\mathbb{E}[U(W)]$. If $U(W) = W$ (risk neutrality), you maximize the ensemble average. But no individual *experiences* the ensemble average. They experience one trajectory. By optimizing for the ensemble, Samuelson is optimizing for a quantity that is physically unobservable to the agent.
  *   **Peters' Correction:** Rationality should be defined by maximizing the observable quantity. For an individual embedded in time, the only observable is the time-average growth rate. Maximizing this yields the Kelly criterion (log utility) naturally, without invoking psychological risk aversion.

  ### 2. Typicality vs. The Mean
  In your field, you are wary of systems where the mean is not typical. In multiplicative wealth processes, the distribution of wealth across the ensemble becomes log-normal (or heavier tailed). As $t \to \infty$, the median wealth diverges exponentially from the mean wealth.

  The ensemble average $\mathbb{E}[W_t]$ is driven by an exponentially vanishing fraction of agents who achieve astronomically high returns. For the **typical** agent (the mode or median of the distribution), wealth grows at the geometric rate.

  Samuelson's argument implies that a rational agent should act as if they have access to the ensemble average. But unless the agent can replicate themselves across parallel universes and average their wealth, the ensemble mean is irrelevant. Peters argues that decision theory must respect **typicality**. A strategy that maximizes the ensemble mean often maximizes the probability of ruin for the typical trajectory. Peters restores the focus to the typical trajectory, which is the only one the decision-maker will inhabit.

  ### 3. The Absorbing Boundary Condition
  In physics, boundary conditions dictate the solution. In wealth dynamics, $W=0$ is an absorbing boundary (bankruptcy). Once hit, the trajectory ends; $W_t$ remains 0 forever.

  *   **Ensemble View (Samuelson):** The ensemble average can remain positive and growing even if 99% of the trajectories have hit zero, provided the remaining 1% have grown enough to compensate. EUT allows for strategies that risk ruin if the expected payoff is sufficiently high.
  *   **Time View (Peters):** For the single trajectory, hitting the absorbing boundary is irreversible. The time-average growth rate becomes $-\infty$.

  Peters' framework inherently penalizes strategies that risk hitting the absorbing boundary because they destroy the time average. Samuelson's framework only penalizes them if the utility function is arbitrarily chosen to be concave enough (like log utility). Peters shows that avoiding ruin isn't a "risk preference"; it is a requirement for maintaining a non-zero time average in the presence of an absorbing state. This makes the Kelly criterion a structural necessity for survival, not a psychological option.

  ### 4. Utility as a Coordinate Transformation, Not a Preference
  This is the deepest conceptual shift. In EUT, utility functions $U(W)$ are subjective representations of preference. Why log wealth? Because you happen to be risk-averse.

  In Ergodicity Economics, the logarithm is not a preference; it is the **coordinate transformation that restores ergodicity**.
  For multiplicative dynamics $W_{t+1} = W_t \cdot \beta_t$, the process is non-ergodic in $W$. However, in the variable $x = \ln W$, the dynamics become additive:
  $$ \ln W_{t+1} = \ln W_t + \ln \beta_t $$
  Additive processes with independent increments are ergodic (by the Law of Large Numbers). The time average of $\ln \beta$ converges to the ensemble average of $\ln \beta$.

  Therefore, maximizing $\mathbb{E}[\ln W]$ is equivalent to maximizing the time-average growth rate of the system in its ergodic coordinate. Peters argues that rational agents should optimize the growth rate of their wealth in the coordinate system where the dynamics are ergodic. This removes the "ad hoc" nature of log utility. It is not one utility function among many; it is the unique function that linearizes the dynamics of compounding, making the time average well-defined and maximizable.

  ### 5. Refuting Samuelson's "Finite Horizon" Objection
  Samuelson's blunt title ("The Fallacy...") relied heavily on the idea that the "long run" is a misleading abstraction for finite decisions. He argued that for any finite $N$, there is a non-zero probability that the geometric mean strategy underperforms other strategies, so it cannot be universally rational.

  Peters counters this by distinguishing between **convergence in probability** and **typicality**.
  While it is true that for finite $N$ the ensemble average of a risky strategy might exceed the Kelly strategy, the *probability* of achieving that ensemble average outcome approaches zero as $N$ increases.
  Peters' argument is not solely about the limit $N \to \infty$. It is about the **dominance of the time-average rate** for any $N$ large enough for the Law of Large Numbers to begin concentrating the measure. For any realistic investment horizon where compounding matters, the time-average growth rate is the robust predictor of the outcome. Samuelson's objection holds only for very short horizons where compounding has not yet exerted its geometric force, or for agents who can diversify across uncorrelated parallel trajectories (which individuals cannot).

  ### Conclusion: The Physicist's Verdict
  Samuelson's dismissal fails because it treats a dynamical problem as a static optimization problem. He assumes the probability space is the primary reality. Peters correctly identifies that for an individual agent, the **trajectory** is the primary reality.

  By ignoring the non-ergodic nature of multiplicative wealth, standard decision theory (à la Samuelson) optimizes for a "ghost" average that exists only across the ensemble, not in time. Peters demonstrates that when you respect the temporal sequence of decisions and the non-ergodicity of the dynamics, the logarithm emerges not as a subjective taste, but as the objective measure of sustainable growth.

  For a statistical mechanician, the choice is clear: Do you trust the ensemble average of a non-ergodic system, or the time average along the trajectory? Peters is right because he is the only one treating the economic agent as a physical system evolving in time, subject to the same ergodic constraints as the systems you studied for thirty years. Samuelson optimized for the multiverse; Peters optimized for the universe we actually live in.
