answer: |-
  This is a compelling draft that engages directly with the most vibrant current debates in Newton studies (specifically the post-Yahuda reassessment of his intellectual unity). You are rightly pushing back against the "compartmentalization" thesis that dominated the mid-20th century.

  Here are my comments structured around your three requests, aimed at sharpening the argument for a specialist audience.

  ### 1. Textual Evidence and the Integration Thesis
  Does the evidence support tying the Christology to the physics this tightly? **Yes, but with a caveat regarding the mechanism of the link.**

  The "Dominion" (*Dominium*) thesis is well-trodden ground in recent scholarship, most notably by Stephen Snobelen and James Force. They argue, as you do, that Newton's definition of God in the *General Scholium* ("God is a word relative, and has respect to servants") is the hermeneutical key to both his theology and his physics. The textual support for the *General Scholium* reflecting his theological priorities is strong; Newton revised the Scholium extensively to ensure the definition of God emphasized sovereignty over ontology.

  However, be careful with the word "transposed." It suggests a direct mapping that some colleagues might find reductive. A more precise claim might be that both positions are **downstream effects of a prior commitment to Monotheistic Sovereignty.**
  *   **Theology:** If God is absolutely sovereign, no other being can share His *essence* (which would limit His uniqueness); thus, the Son must be a subordinate agent.
  *   **Physics:** If God is absolutely sovereign, the world cannot run by necessary emanation (Spinoza/Leibniz); it must run by contingent decree.

  **Suggestion:** Instead of saying the idea "reappears, transposed," consider phrasing it as "is structurally isomorphic to" or "derives from the same axiomatic commitment to." This protects you from the charge that Newton simply copy-pasted his ecclesiology into his cosmology, while maintaining the unity of his thought.

  ### 2. The Strongest Objection to the Integration Thesis
  You suspect there is an obvious objection you aren't seeing. There are two, but one is particularly damaging to the *rhetorical* goal of your paragraph.

  **The Objection of Strategic Dissimulation (The Iliffe Critique):**
  Rob Iliffe, in *Priest of Nature*, argues that while Newton's theology and philosophy are consistent *privately*, Newton intentionally constructed his public natural philosophy to be palatable to orthodox readers. He knew that explicit voluntarism or subordinationism would undermine the authority of the *Principia*.
  *   **The Critique:** By arguing for a "tighter connection," you risk undoing Newton's own careful labor to keep them distinct in the public sphere. The "standard picture" you are criticizing isn't just scholarly laziness; it reflects Newton's own successful campaign to present the *Principia* as religiously neutral ground.
  *   **How to Pre-empt It:** Acknowledge that Newton *concealed* this unity. Your argument is about the *architecture of his thought*, not necessarily the *presentation of his public texts*. You might add a clause acknowledging that while he kept the discourses separate for safety, the underlying metaphysical commitments remained unified.

  **The Philosophical Objection (The "Tyrant God" Problem):**
  A philosopher in your reading group might object that linking Subordinationism to Voluntarism makes Newton's God too arbitrary. If the Son is subordinate because the Father *wills* it (not because of nature), and the world is as it is because God *wills* it (not because of reason), does Newton collapse the distinction between power and tyranny? Leibniz certainly thought so.
  *   **How to Pre-empt It:** Clarify that Newton's voluntarism is not *irrationalism*. God acts freely, but consistently with His wisdom. The link is about **ontological dependence**, not arbitrariness.

  ### 3. Historical and Textual Fact-Checking
  Your details are largely accurate, which is impressive given the minefield of Newtonian scholarship. Here are three minor points to tighten:

  *   **"Arianism":** While "Arian" is the common shorthand, Newton scholars often prefer **"Arianizing"** or **"Subordinationist."** Newton did not subscribe to the 4th-century Arian creed per se; his Christology was a unique reconstruction of primitive Christianity. Using "Arian" without qualification can sometimes signal to specialists that you haven't engaged with the nuance of his *Irenicum* manuscripts.
  *   **The 1 Timothy Reference:** You mention the "disputed clause in 1 Timothy." Be specific if you can. Newton focused on **1 Timothy 3:16** ("God was manifest in the flesh"). He argued the original reading was *"Who was manifest"* (relative pronoun *hos* vs. *theos*). Naming the specific verse adds authority.
  *   **Yahuda/Keynes Split:** Your summary of the 1936 Sotheby's sale is functionally correct for a paragraph, but a pedant might note that the split wasn't perfectly binary (theological vs. alchemical). Keynes bought the majority of the scientific and alchemical lots, Yahuda the theological, but there was overlap. However, for the purpose of your narrative about the *separation of the literature*, your current phrasing is acceptable.
  *   **General Scholium Quote:** You write: *"eternity and infinity alone cannot qualify anything as God, since an impersonal Fate or Nature could have those too, and that only lordship over servants does."*
      *   *Latin Check:* "Dominium sine servitio, aeternitas & ubique praesentia, & duratio non constituunt Deum."
      *   *Verdict:* Your paraphrase is accurate. You capture the "Fate or Nature" (*Fatum & Natura*) contrast correctly.

  ### Suggested Revision for the Core Paragraph
  Here is a version incorporating these nuances, preserving your voice but bulletproofing the claims:

  > "Newton denied that the Son was co-equal and co-eternal with the Father, holding instead that Christ was a created and subordinate being, however supremely exalted, whose divine status depended on the Father's will rather than on any shared necessary nature — a Christology sufficiently Arianizing that he spent most of his life concealing it, quietly avoiding the ordination his Cambridge fellowship would otherwise have required, and circulating his textual case against the Trinity's proof-texts (he identified corruptions in both the Johannine Comma and 1 Timothy 3:16) among only a handful of trusted readers, Locke included. I argue that the same governing principle — that dominion, not shared substance, constitutes divinity — structures the *General Scholium*'s insistence that eternity and infinity alone cannot qualify anything as God, since an impersonal Fate or Nature could possess those attributes, whereas only lordship over servants defines the Divine; and again in the Leibniz-Clarke correspondence's defense of a God whose free choices, rather than the principle of sufficient reason, explain otherwise contingent facts about the world's size, location, and furniture. On this reading, the voluntarism structuring Newton's natural philosophy and the subordinationism structuring his private theology are not a scientific achievement running alongside an unrelated personal heresy, but distinct expressions of a single metaphysical commitment: that true sovereignty requires absolute ontological independence and the freedom to command."

  **Summary of Changes:**
  1.  Changed "Arianism" to "Arianizing" (safer).
  2.  Specified 1 Timothy 3:16 (shows expertise).
  3.  Changed "transposed" to "structures" (avoids implying a simple copy-paste).
  4.  Changed "arbitrary-looking" to "contingent" (philosophically more precise; "arbitrary" concedes too much to Leibniz).
  5.  Refined the final sentence to emphasize "ontological independence" to bridge the gap between the Son's creation and the World's creation.

  This is a strong argument that fits well within the current "New Newton" scholarship. Good luck with the talk.
