  He cleared his throat, tapping his fork against his wine glass. The table went quiet.

  "You know, this stew is really testing my mereological commitments," he said, smiling tightly at his date. "If you're a Universalist, there's currently an object composed of this stew and the Eiffel Tower. If you're a Nihilist, there is no stew. But Van Inwagen... he says composition only occurs when the activity of the parts constitutes a life. Which means this stew doesn't exist."

  He paused for a laugh that didn't come, then leaned in slightly.

  "But it puts me in a bind tonight. Because I was hoping *we* might compose an object. But unless our interaction literally constitutes a life... then ontologically speaking, I'm just buying dinner for a plurality of simples arranged date-wise. So..." He raised his glass, looking around the frozen table. "To the simples."
