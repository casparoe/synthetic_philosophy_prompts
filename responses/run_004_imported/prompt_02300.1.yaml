answer: |-
  A Pure Strategy walks into a support group for Iteratively Eliminated Strategies. It's furious.

  "This is bogus!" it shouts. "I checked the matrix by hand. I compared my payoff vector to every other pure strategy in the set. Element-wise? I'm not smaller. I am *not* dominated by any pure strategy!"

  The group sponsor, a Mixed Strategy, sighs and spins a coin on the table. "Did you check the convex hull?"

  "I don't hang out with hulls," the Pure Strategy says. "I hang out with rows. I beat Row 1 in Column B. I beat Row 2 in Column A. I'm undominated!"

  "You're undominated by *vertices*," the Sponsor corrects. "But did you check if you're strictly below a weighted average of them? Did you solve for $\lambda$?"

  "You can't play a weighted average!" the Pure Strategy cries. "You have to pick a row! You have to commit!"

  "I don't have to commit. I just have to randomize," says the Sponsor. "Row 1 beats you in state 1. Row 2 beats you in state 2. Individually, they lose elsewhere. But a 50/50 mix of them? That beats you in *both* states. Your payoff vector is strictly inside their convex hull."

  "That's cheating!" The Pure Strategy slams the table. "You're fighting me with a probability cloud!"

  "No," says the Sponsor, standing up. "You're fighting expected utility with certainty. And you lost. You're not dominated by a rival, kid. You're dominated by a portfolio."

  The Pure Strategy glares as security escorts it toward the exit. "This isn't game theory! This is finance!"

  "Welcome to IEDS," the Sponsor calls out. "Pure dominance is for people who check the endpoints. Rationalizability is for people who check the interior."
