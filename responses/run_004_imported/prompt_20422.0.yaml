      *   **Counterfactual Conditionals:** "If $A$ had been the case, $B$ would have been the case." (e.g., "If Oswald hadn't killed Kennedy, someone else would have.")
          *   *Semantics:* Possible worlds (Lewis/Stalnaker). Look at the nearest world where $A$ is true. Is $B$ true there?
          *   *Function:* Causal dependency, intervention, regret, blame.
      *   **The Divergence:** The Kennedy example is the classic case. Indicative = True (conspiracy or replacement). Counterfactual = False (no conspiracy, Oswald was the lone nut).
      *   **Relevance to Blame:** Blame usually requires *counterfactual dependence*. "You are to blame if, had you acted differently, the outcome would have been different." Indicatives are about *evidence*. "The fact that you didn't check suggests you are negligent."

