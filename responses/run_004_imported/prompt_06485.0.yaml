answer: |-
  The fluorescent lights in the corridor hummed, a low-frequency vibration that seemed to rattle the paper cups on the vending machine. Behind the door to Room 304, their father's breathing was ragged, rhythmic, and monitored.

  Sarah leaned against the wall, arms crossed over her scrubs. She looked exhausted, but it was a clean exhaustion, the kind that comes from a shift well-worked. David paced the length of the linoleum, stopping only to rub his face. He looked like he hadn't slept in days, though he'd done nothing but sit.

  "You keep saying it's a tragedy," Sarah said. Her voice was low, calibrated not to carry through the door. "For him. Not for us. For him."

  "Because it is," David said.

  "Okay. Walk me through the mechanics of that."

  David stopped pacing. "Mechanics?"

  "You're a philosopher, Dave. You care about precision. So tell me: when does the harm occur?"

  David blinked. "What?"

  "The harm. You say death is bad for him. Badness is something that happens to a subject. So point to the timestamp. When does he get hurt?"

  "When he dies," David said.

  "No," Sarah said, pushing off the wall. "When he dies, he's gone. There is no 'him' to be the recipient of the badness. You can't harm a ghost. So is it before he dies? While he's still here?"

  "Well, obviously not while he's alive. That's just... anticipating."

  "Exactly. So if it's not before, because he's still alive, and it's not after, because he doesn't exist... there is no time at which death is bad for him. It's a ghost harm. It haunts a house that doesn't exist."

  David sighed, running a hand through his hair. "You're treating 'badness' like a bruise. Like it has to be felt to be real."

  "If it's not felt, who is it for?"

  "It's comparative," David said, his voice tightening. "It's not about a sensation of pain. It's about the subtraction of possibility. Look, imagine he was going to recover. Imagine he had ten years left. Good years. Coffee on the porch. Arguing with us. Death takes that away. The badness lies in the difference between the life he has and the life he *would have had*."

  "But who registers the difference?" Sarah pressed. "You need a subject to hold the two lives up against each other. The living dad and the dead dad. But the dead dad isn't there to see what he's missing. You're saying it's bad for him to lose the future, but you've eliminated the only person who could experience the loss."

  "You're assuming the subject has to exist *at the time of the loss* to be the victim of it," David said. "Think about betrayal. If someone betrays me behind my back, and I never find out, I never feel the pain. But I've still been harmed. The harm is in the fact of the betrayal, not my awareness of it."

  "That's different," Sarah said. "You're still alive to be betrayed. Death isn't a betrayal. It's an eviction. You can't be evicted from a house you don't inhabit."

  "It's not an eviction, it's a truncation," David countered. "The badness isn't an event *in* his life. It's a fact *about* his life. It's a relational property. Just like 'being shorter than' is a property, even if the taller person isn't in the room. Death makes his life shorter than it could have been. That is a deficit. It belongs to him, even if he isn't around to audit the books."

  Sarah shook her head, a small, sad smile touching her lips. "You're smuggling him back in, Dave. You're keeping him on the hook just long enough to suffer the accounting. But the Epicureans had this right two thousand years ago. Where death is, I am not. You can't have a deficit if you don't have a balance sheet."

  She took a step toward him. "And if you won't buy the timing argument, buy the symmetry. Lucretius. Think about the time before you were born. The eons of it. Does it bother you? Does it feel like a loss to you that you weren't here for the Roman Empire? For the signing of the Declaration?"

  "No," David said.

  "Why not?"

  "Because I wasn't... ready? No, that's not it."

  "Because it's nothing to you," Sarah said. "It's the same nothing. The non-existence after death is identical to the non-existence before birth. Infinite dark on both sides. If you don't mourn the past eternity, why mourn the future one? It's just bias. Because we happen to be standing on this side of the birth canal, we think the other side is a theft. But it's just the same silence."

  David looked at the closed door. The monitor inside beeped, a slow, laborious sound.

  "The symmetry argument is elegant," David said quietly. "But it fails on the direction of time."

  "How?"

  "Because death and prenatal non-existence aren't mirror images. They look the same from the outside—non-existence—but they relate to the subject differently. Prenatal non-existence is the time before the subject *could* exist. There was no 'David' waiting in the wings to be deprived of the Roman Empire. I wasn't denied anything, because there was no me to be the recipient of goods."

  "And after death?"

  "After death, there *was* a trajectory," David said. "There was a subject who had established a foothold in the world, who had possibilities that were genuinely open to him. Death closes doors that were open. Birth doesn't close doors; it opens them. The time before I was born wasn't a loss because those goods weren't accessible to me. The time after I die is a loss because I *had* access to it, and it was taken."

  "So it's about ownership?" Sarah asked. "You own the future, but you don't own the past?"

  "I own the potential," David said. "Look, I know it sounds abstract. But if you tell me a child died today, you don't say, 'Well, they don't exist anymore, so it's fine.' You say, 'They lost everything.' You intuitively understand deprivation. You know that the value of a life isn't just in the experiencing of it, but in the continuation of it."

  "I intuitively understand grief," Sarah corrected. "That's the point. I know what it looks like when *we* lose *them*. But I've sat with three hundred people who died, Dave. I watch the moment the tension leaves the face. I watch the family project their horror onto that body. But the person in the bed? They're fine. They've arrived at the place they were before they were conceived. Why do we insist on making their nothingness into a kind of suffering? It's arrogant. We think the universe owes us duration."

  "We don't owe the universe duration," David said. "The universe owes us nothing. But that doesn't mean losing duration isn't bad."

  "It implies the badness is only for the witnesses."

  "No. It means the badness is objective." David leaned against the wall opposite her, mirroring her posture. "If a book is missing its final chapter, the story is incomplete. It doesn't matter if the book doesn't know it's incomplete. The incompleteness is a fact about the book."

  "But the book isn't a person," Sarah said. "A person isn't a narrative to be completed. We're biological events. When the event stops, the harm stops. To say otherwise is to say that ghosts have rights."

  David looked down the long, empty corridor. "Maybe. Or maybe it's to say that being alive is the only chance we get to be anything at all. And cutting that chance short is the only absolute wrong there is. Even if the victim isn't there to file the complaint."

  "So you're the prosecutor for a client who's deceased," Sarah said.

  "Someone has to be."

  The monitor inside Room 304 changed its rhythm. A sharper alert. Both of them turned toward the door, the argument instantly suspended, hanging in the air between them, unresolved and heavy. Neither moved to go in immediately. They stood in the hum of the lights, holding the silence, waiting to see if the silence on the other side of the door was about to become permanent.
