      David: "It's not a feeling."
      Sarah: "Then what is it?"
      David: "It's a subtraction."

      *(Drafting the Symmetry exchange)*:
      Sarah: "What about before you were born?"
      David: "That's different because..." (Needs to be strong). "Because death interrupts a project. Prenatal time doesn't."

      *(Ending)*: Bring it back to the father. The machine beeps. The argument hangs unresolved.

  7.  **Final Review against constraints:**
      *   Epicurean uses Timing Problem? Yes.
      *   Epicurean uses Symmetry? Yes.
      *   Deprivationist addresses Timing (atemporal badness)? Yes.
      *   Deprivationist addresses Symmetry earnestly? Yes.
      *   No knockout? Yes.
      *   Novelistic tone? Yes.

