prompt: |-
  So I'm a retired molecular biologist, and now that I've got the time I've finally been reading the philosophy stuff I always felt too busy for. Been going back through Darwin's Descent of Man lately (partly nostalgia, partly because half the philosophy-of-biology essays I've been picking up quote him), and I got stuck on this passage from the chapter on the moral sense:

  "It must not be forgotten that although a high standard of morality gives but a slight or no advantage to each individual man and his children over the other men of the same tribe, yet that an increase in the number of well-endowed men and advancement in the standard of morality will certainly give an immense advantage to one tribe over another. A tribe including many members who, from possessing in a high degree the spirit of patriotism, fidelity, obedience, courage, and sympathy, were always ready to give aid to each other and to sacrifice themselves for the common good, would be victorious over most other tribes; and this would be natural selection."

  The biology here is fine, its basically a group-selection story before anyone had that term. What's tripping me up is that I keep seeing this exact kind of passage cited as background for "evolutionary debunking arguments" against moral realism, like the causal story is supposed to make trouble for the idea that our moral judgements are true or justified. But a causal explanation of why we believe X seems totally silent on whether X is true, so where's the missing premise that turns this into a debunking argument instead of just a fancy genetic fallacy? And does Darwin's specific tribe-vs-tribe selection mechanism actually add anything to that argument that a plainer story (morality helps individuals survive) wouldn't already give you?
