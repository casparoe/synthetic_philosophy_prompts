      *   **The Missing Premise (Epistemology):** Explain the shift from "origin" to "reliability/tracking." Use the Street/Joyce framework. The argument isn't "Evolution caused it, therefore false." It's "Evolution caused it *independently of truth*, therefore we have no reason to trust it." (The Benacerraf-Field challenge).
      *   **Darwin's Specific Contribution (Group Selection):**
          *   *Self-Sacrifice:* Highlights the disconnect between individual welfare and moral duty.
          *   *Parochialism:* Tribal virtues (patriotism) vs. Universal virtues. This is a strong debunking point against realist claims of universality.
          *   *Non-Truth-Aptness:* Suggests morality is more like a "useful fiction" or adaptive heuristic than a perception of fact.
