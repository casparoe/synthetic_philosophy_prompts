      *   Owen: Kempe proof (experts thought it was unassailable).
      *   Nadia: Kempe's error was in complex manipulation; the *correction* required insight. Also, 'unassailable' means 'upon reflection,' not 'first pass.'
      *   Owen: But how do you distinguish 'upon reflection' from 'more computation'?
      *   Nadia: Phenomenology of understanding.
      *   Owen: Phenomenology isn't metaphysics.
