answer: |-
  **Setting:** *A quiet corner of a university coffee shop, shortly after a colloquium on the philosophy of biology. Two colleagues, ELENA (a mathematical platonist) and MARCUS (a nominalist/fictionalist in the vein of Hartry Field), are finishing their espresso.*

  **Elena:** You were quiet during the Q&A, Marcus. I expected you to pounce on the speaker's use of the cicada case. It's practically a batting tee for the Indispensability Argument these days.

  **Marcus:** It's a tempting pitch, I'll admit. But swinging too hard at Baker's cicada argument often makes the nominalist look like they're denying the biology. I'm not denying the cicadas, or the cycles, or the predation pressures. I'm denying the ontology of the *explanation*.

  **Elena:** But that's exactly where Baker pins you. He isn't just saying math is indispensable for *formulating* the theory. He's saying the mathematical fact—that 13 and 17 are prime—is doing the *explanatory work*. If you remove the number theory, you don't just lose elegance; you lose the reason *why* those specific cycles were selected over, say, 12 or 14 years.

  **Marcus:** I need to be careful here. I agree that "13 is prime" is part of the derivation. But being part of a derivation isn't the same as being a causal or structural driver in the world. Look, as a biologist might put it: the cicadas didn't sit around consulting a number theorist. They evolved under pressure from predators with shorter life cycles—2, 3, 4, 5 years. The ones that synchronized least with those predators survived.

  **Elena:** Precisely! And *why* do they synchronize least with 2, 3, 4, and 5 year predators? Because 13 and 17 have no common divisors with those numbers. That lack of common divisors *is* primality. The biological mechanism tracks the mathematical truth. If 12 were prime, the cicadas would have evolved 12-year cycles. The counterfactual depends on the math, not just the physics.

  **Marcus:** There's the move I expected. You're reifying the counterfactual. Let's try to paraphrase, as Field would suggest. We don't need to say "13 is prime." We can say: "A 13-year cycle results in fewer intersection points with predator cycles of length 2 through 6 than a 12-year cycle does." That statement is purely about physical temporal overlaps. It's about events coinciding in spacetime.

  **Elena:** But that paraphrase is clumsy, Marcus. And clumsiness isn't my objection; *incompleteness* is. Your paraphrase lists the overlaps. It doesn't explain the *pattern* of overlaps. To explain why 13 works and 14 doesn't, you have to list the divisors for every possible predator cycle. The mathematical explanation captures a general constraint: *for any* predator cycle $p$ less than the cicada cycle $c$, if $c$ is prime, the overlap is minimized. That generality is what explains the stability. Your nominalist paraphrase turns a general law into a brute conjunction of physical facts.

  **Marcus:** Is it brute, though? Or is it just that the physical world instantiates that structure? I'm not saying the math is wrong. I'm saying the math is a conservative extension of the physical facts. The physical facts about predator-prey synchronization *already entail* the survival of the 13-year brood. The number theory just allows us, finite thinkers, to deduce that entailment quickly. The "explanatory work" you're sensing is cognitive efficiency, not ontological depth.

  **Elena:** Cognitive efficiency? That's the old "math is just a calculating device" line. Baker specifically dismantled that. If I explain why a bridge didn't collapse by citing the load-bearing equations, you wouldn't say, "Oh, the equations are just a efficient way of describing the steel." The constraints imposed by the equations are why the steel holds. Similarly, the number-theoretic constraints are why the evolutionary trajectory converged on 13 and 17. The evolutionary search space is structured by arithmetic.

  **Marcus:** I'd push back on the "search space" metaphor. Evolution doesn't search a space of *numbers*; it searches a space of *phenotypes* expressed in time. The "structure" you see is a projection we lay over the physical interactions. Here's my worry, Elena: If you say the primality *causes* the survival, you're committing to abstract objects having causal efficacy. How does the property of "being divisible only by 1 and itself" reach out and stop a bird from eating a nymph?

  **Elena:** I'm not proposing magical causation. I'm proposing structural explanation. Think of it like a key fitting a lock. The shape of the key explains why it opens the lock. The shape isn't "causing" the opening in a push-pull sense; it's a geometric constraint. Primality is an arithmetic constraint. The biological system is sensitive to that constraint. If you deny the reality of the constraint, you're left saying the cicadas just *happened* to hit 13 and 17, and the math is just a post-hoc label we stick on it.

  **Marcus:** Not "happened," but "selected." And the selection criterion is physical intersection frequency. I can grant you that the explanation is *distinctively mathematical* in its formulation without granting you Platonism. Mary Leng has argued this well: we can have mathematical explanations without mathematical truth-makers. The explanation works because the mathematical model accurately represents the physical relations. The "primality" is a feature of the model that maps onto the "low-intersection-frequency" feature of the world.

  **Elena:** But why does that feature of the model work? Because the world *is* mathematical. If the physical world didn't instantiate arithmetic truths, the model wouldn't map. You're trying to have your cake and eat it too. You want the explanatory power of the math—which relies on the necessity of arithmetic truths—while claiming the math is just a fiction. If it's a fiction, why does the biological system obey it so strictly? Why didn't a 14-year brood survive? 14 isn't prime, but it's not *that* composite.

  **Marcus:** Because 14 shares a factor of 2 with every 2-year predator. That's a physical fact. A predator emerging every 2 years meets a 14-year cicada every 14 years. A 13-year cicada meets them every 26 years (LCM). The difference in predation pressure is the physical driver. I can state all of that without quantifying over numbers as objects. I quantify over events and intervals. "For every interval of predator emergence..." I don't need "13" to exist as an abstract entity to count the intervals.

  **Elena:** You're quantifying over intervals *as numbers*, Marcus. You're using the logic of arithmetic to define your intervals. You can't strip the arithmetic out of the "physical" description without leaving the description empty. When you say "LCM" (Lowest Common Multiple), you are invoking number theory. If you try to cash that out purely physically, you end up with an infinite list of conditionals: "If a predator comes every 2 years, they meet every 26... if every 3 years, they meet every 39..." The mathematical explanation unifies these. That unification is the explanation.

  **Marcus:** Unification is a virtue of theories, not necessarily of ontology. I can unify physical phenomena with a false theory if it's useful. But let's press your point about the infinite list. A nominalist doesn't need to list every conditional. We can use modal logic. "Necessarily, for any physical predator cycle $p$, if $p$ divides $c$, overlap is high." That modal claim is about physical possibilities, not abstract numbers.

  **Elena:** But what grounds that necessity? Why is it necessary that if $p$ divides $c$, overlap is high? Because of the nature of divisibility. And divisibility is a relation between numbers. You're grounding physical necessity in mathematical necessity. If you cut the anchor to the math, the physical necessity floats away. You're implicitly relying on the reality of the math to make your nominalist explanation hold water.

  **Marcus:** I'm relying on the *logical* structure of the physical world. I don't need the numbers to exist separately to acknowledge that physical quantities stand in ratio relations. Look, Elena, I respect the biologist in you—the one who knows that 13 and 17 aren't just labels, they're functional constraints. But I think you're conflating "indispensable for explanation" with "ontologically real." I can admit that I cannot explain the cicada phenomenon *to you* without using primes. That shows something about our cognitive architecture and the utility of math. It doesn't prove that primes exist in a realm outside spacetime.

  **Elena:** And I think you're conflating "ontologically real" with "spatiotemporal." If the best explanation of a concrete, biological phenomenon invokes an abstract property, and that invocation cannot be paraphrased away without loss of explanatory generality, then we are warranted in believing in that property. The cicadas are the empirical evidence for the reality of primes. It's not a priori; it's empirical.

  **Marcus:** It's empirical evidence for the *utility* of primes. The cicadas don't care about Platonism. They care about not getting eaten. As long as I can model the "not getting eaten" part using concrete events and modal relations, I remain agnostic about the numbers. I'll keep using the primes, Elena. I'll even teach them. I just won't swear an oath to their existence.

  **Elena:** *(Smiling)* And I'll keep publishing the papers arguing that your oath is already implied by your models.

  **Marcus:** Then I suppose the cicadas will keep emerging, regardless of whether we think they're counting or just surviving.

  **Elena:** Indeed. Though if they *are* counting, I'd wager they're Platonists.

  **Marcus:** Or pragmatic fictionalists. They use the count, but they don't worry about what's doing the counting.

  *(They clink coffee cups, the disagreement unresolved but the terms clearly drawn.)*
