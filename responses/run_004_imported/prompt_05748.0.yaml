      *   **Move 4 (Nominalist):** Address the counterfactual. We can state counterfactuals about physical overlaps without invoking "Prime" as an object. Use "overlap minimization" directly.
      *   **Move 5 (Platonist):** The Generality Objection. To explain *why* overlap is minimized, you need the general rule about divisors. Physicalizing it requires an infinite list of physical scenarios. Math captures the *pattern*.
