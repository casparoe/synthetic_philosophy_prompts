      *   **Nominalist (Fictionalist):** Mathematical entities do not exist. Math is a useful fiction. In the cicada case, the explanation must be reducible to physical interactions (predator/prey overlap frequencies) without ontological commitment to numbers. (Key figure: Hartry Field, Joseph Melia, Mary Leng).
