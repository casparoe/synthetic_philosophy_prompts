      *   **Move 7 (Platonist):** The "Explanatory Depth" rebuttal. Efficiency isn't explanation. Knowing *that* they don't overlap isn't knowing *why*. The "why" is the number theoretic constraint.
      *   **Move 8 (Nominalist):** Distinguish "mathematical why" from "causal why." Biology cares about causal mechanisms (predation pressure), not abstract constraints.
