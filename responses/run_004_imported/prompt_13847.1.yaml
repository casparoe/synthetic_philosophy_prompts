answer: |-
  This is a fantastic intersection of intellectual history and meta-science. You are absolutely right to push back against the sanitized "Sidgwick the Dry Utilitarian" caricature. The man was haunted. As he wrote in a letter to John Addington Symonds, he was plagued by a "fundamental puzzle" about the universe, and his investment in the SPR was not a hobby but a desperate epistemic lifeline. If the universe is morally ordered (i.e., if virtue is eventually rewarded, perhaps in an afterlife), then Rational Egoism and Utilitarianism converge. If not, reason is fractured.

  If we transport Sidgwick to 2011 to watch the Daryl Bem *Feeling the Future* saga unfold, his reaction would likely be a complex mixture of methodological vindication and metaphysical despair. Here is how I think that plays out.

  ### 1. The Bem Saga: Methodological Vindication, Ontological Defeat

  Sidgwick would be fascinated by the *structure* of the controversy, perhaps more than the result itself.

  **On the Initial Publication:**
  Sidgwick would understand why Bem's paper was accepted. It used the standard tools of the trade. In the 1880s, the SPR struggled with the fact that "respectable" witnesses could give contradictory testimony. Sidgwick would see Bem's use of standard psychological protocols as the modern equivalent of "respectable testimony." It passes the social proof test.

  **On the Bayesian Reanalysis (Wagenmakers et al.):**
  This is where Sidgwick would nod vigorously. One of Sidgwick's core principles in the SPR was that the *improbability* of the claim must be weighed against the *reliability* of the evidence. He knew that human testimony is notoriously leaky.
  When Wagenmakers argued that the prior probability of precognition is so low that standard p-values are insufficient, Sidgwick would see this as a mathematical formalization of his own heuristic: *"The evidence for telepathy must be strong enough to outweigh the antecedent improbability."* He would agree that a p-value of .05 is not enough to overturn the laws of causality any more than a single credible witness is enough to prove a miracle.

  **On the Failed Replications:**
  This would be the crushing blow. The SPR spent decades collecting case studies (*Phantasms of the Living*), but they always suffered from the "elusiveness" problem. Phenomena would occur under informal conditions but vanish under strict laboratory control.
  Watching the replication crisis play out, Sidgwick would see the Bem failure not as a scandal, but as the inevitable result of "flexible" methodology. He would recognize the failure to replicate as the modern version of the medium who performs in the parlor but fails in the controlled cabinet.

  **Verdict:** He would be **less hopeful about psi**, because the modern machinery of science, which is far more robust than the SPR's cross-examination committees, still failed to capture the phenomenon reliably. But he would be **more hopeful about Science** as an institution. The fact that the field self-corrected (eventually) via the replication reforms would validate his belief in rigorous, dispassionate inquiry.

  ### 2. SPR Methodology vs. Modern Meta-Science

  Does Sidgwick's 1880s methodology hold up? Surprisingly, yes in *spirit*, but no in *mechanics*.

  **Where Sidgwick Looks Prescient:**
  *   **Fraud Detection:** Sidgwick and the SPR were obsessed with fraud. They exposed the Coulomb sisters and were deeply skeptical of Eusapia Palladino (until some members, like Myers, got too invested). Sidgwick understood that the incentive to deceive is high. This aligns perfectly with the modern focus on p-hacking and data manipulation as forms of "unconscious fraud."
  *   **Negative Results:** Sidgwick insisted on recording failures. The SPR archives are full of busted mediums. This anticipates the modern push for publication bias correction.
  *   **Interdisciplinary Scrutiny:** He brought physicists, philosophers, and psychologists together. This mirrors the modern push for diverse teams to check blind spots.

  **Where Sidgwick Looks Credulous:**
  *   **Testimony as Data:** *Phantasms of the Living* relies heavily on anecdotal collection. By modern standards, this is the bottom of the evidence pyramid. Sidgwick trusted human memory and honesty more than a modern meta-scientist would. He didn't have the concept of "selection bias" in the statistical sense, only in the testimonial sense.
  *   **Lack of Preregistration:** The SPR often designed tests *after* observing phenomena. Sidgwick would immediately grasp the value of **preregistration**. In fact, he would likely champion it as the solution to the "file drawer problem" that plagued the SPR (where successful sittings were reported and dull ones ignored).
  *   **Statistical Naivety:** They didn't have null hypothesis significance testing. They relied on "moral certainty." Sidgwick would accept that this was a weakness. He was a mathematician by training; he would embrace Bayesian updating as a superior tool for weighing the "Dualism" evidence.

  ### 3. The Impact on the Dualism of Practical Reason

  This is the tragic core of your question. Sidgwick turned to psi because *Methods of Ethics* left him with a wound: Reason tells us to be good, but Reason also tells us to look out for ourselves, and the universe doesn't guarantee these align.

  **If Bem Had Replicated:**
  Sidgwick would have been ecstatic. Empirical proof of precognition implies a breakdown of standard causality, which opens the door for a non-materialist ontology. If the mind can transcend time, the "soul" becomes a scientifically viable hypothesis. If the soul exists, divine justice (and the reconciliation of Egoism/Utilitarianism) becomes possible.

  **Since Bem Failed (and the Replication Crisis ensued):**
  Sidgwick is left in the dark. The Bem saga demonstrates that even with modern tools, we cannot pierce the veil.
  *   **The Ethical Consequence:** He must accept that the "Dualism of Practical Reason" remains unresolved *empirically*.
  *   **The Philosophical Consequence:** However, Sidgwick might find a strange comfort in the *process*. The Replication Crisis reforms (preregistration, open data) represent a collective commitment to truth over comfort.
  *   **The "Noble Lie":** In his later years, Sidgwick admitted he might have to rely on "hope" rather than "knowledge." Watching the scientific community tear apart Bem's work, then rebuild stronger standards, might convince him that while we cannot *prove* a moral order, the *practice* of rigorous truth-seeking is itself a moral good. It doesn't solve the Dualism, but it makes the Utilitarian commitment to truth more robust.

  ### 4. The "ACX-Brain" Synthesis

  Here is the synthesis that I think fits your framing:

  Sidgwick would view the Bem saga as a **tragedy of epistemic hygiene.**

  He would realize that the SPR failed not because they were stupid, but because the signal (if it exists) is weaker than the noise of human cognition. The Bem study proved that *standard scientific practice is not rigorous enough to detect psi*, because standard practice allows for enough noise to generate false positives.

  The reforms that followed (the "Replication Revolution") are exactly what Sidgwick would have demanded if he had the statistical tools. He would see preregistration as the technological fix for the human tendency toward self-deception—a tendency he spent his life fighting in mediums and in himself.

  **Final Verdict:**
  *   **On Psi:** Deeply pessimistic. The bar has been raised, and psi still hasn't cleared it.
  *   **On Ethics:** Resigned. The empirical bridge between Egoism and Utilitarianism remains unbuilt.
  *   **On Methodology:** Vindicated. His instinct that "extraordinary claims require extraordinary safeguards" is now encoded in the infrastructure of modern psychology.

  Sidgwick's tragedy was that he needed the universe to be magical to make his ethics work, but he was too honest to pretend it was magical without proof. Watching the Bem saga, he would see his own life's struggle played out in fast-forward: the tantalizing hint, the rigorous dismantling, and the sober acceptance that the universe might not care about our moral accounting. He would likely conclude that we must be good *even if* the evidence for a moral order remains forever out of reach—which, ironically, is the only truly Kantian solution to the problem he spent his life trying to solve empirically.
