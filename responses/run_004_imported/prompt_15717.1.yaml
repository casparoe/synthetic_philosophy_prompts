prompt: |-
  So a few of us met through a local forecasting/rationalist-adjacent meetup (we've got a group chat where we constantly put probabilities on stuff and place little play-money bets, very Metaculus/Manifold-brained group). My friend Theo and I have this running disagreement that's honestly been bugging me all week: we each put a number on whether our mutual friend's startup is still going to exist in 18 months. I said 70%, he said 35%. So we got on a call and actually walked through our full reasoning for like two hours — his contacts inside the company, my read of their public metrics and hiring page, both our general priors about how startups like this tend to go. We basically laid our entire models out on the table for each other. And at the end we STILL landed on different numbers, barely moved from where we started. Theo, who's way more into the LessWrong-y stuff then I am, said that this alone proves one of us has to be irrational — he brought up some theorem (Aumann's? I think that's the name) that's supposed to show two honest rational people who share all their info can't just keep disagreeing, because a truly rational person would update just from the fact that the other person still disagrees. He thinks the fact that we're still apart means one of us has a hidden bias or isn't being fully straight about our own reasoning.

  Here's the thing though — I don't think I'm being irrational, and I genuinely don't think Theo's lying or hiding info either, he's not like that. I just can't articulate why it's okay for us to end up in genuinely different places here, and it's honestly making me kind of dread our next meetup since he clearly thinks he's "won" this. So I guess my actual question is: is Theo's argument as airtight as he thinks, or is there something baked into that theorem that two guys on a phone call very obviously aren't satisfying? And if the math really does say two rational people should converge, what's that actually supposed to tell us to do differently next time — keep hashing it out until the numbers match, split the difference, something else? I'd rather get a real answer than the standard "you're both entitled to your opinion," because I'm not convinced that's actually true here.
