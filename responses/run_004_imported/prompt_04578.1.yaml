  The Allen wrench slipped for the third time, scraping Alex's knuckle. They hissed through their teeth, staring at the half-assembled *Björkudden* table.

  "Pass me the simples arranged screwdriver-wise," Alex said, not looking up.

  Jamie handed over the tool. "You mean the screwdriver. And for the last time, the table exists. The parts are composing a whole right in front of you."

  "The parts are touching," Alex corrected, tightening a bolt. "There are particles here, arranged table-wise. But there is no *table*. Composition is restricted. If there were no minds to perceive this arrangement, there would just be wood and metal, not a 'furniture object.'"

  Jamie leaned against the wall, crossing their arms. "That's the van Inwagen line. But it's arbitrary. Why stop at living organisms? Why not say any plurality composes a whole? Unrestricted composition is cleaner. Before we even opened the box, there was an object composed of those particle-simples and the Eiffel Tower. A scattered object, sure. But an object."

  "That's reductio ad absurdum, not a feature," Alex said, finally looking up. "You're multiplying entities beyond necessity. You're committed to an infinity of gerrymandered monsters just to save a linguistic intuition."

  "I'm committed to logical consistency," Jamie countered. "You're the one positing a magical 'glue' that only activates when particles are fastened together, but not when they're loose in the bag. What's the metaphysical cutoff? How tight does the screw need to turn before *being* kicks in?"

  Alex sighed, rubbing the bruised knuckle. "Maybe there is no cutoff. Maybe the question is defective. Look, when you say 'there exists an object composed of the screws and the Eiffel Tower,' and I say 'there does not,' are we actually disagreeing about the world? Or are we just using 'exists' differently?"

  Jamie frowned. "Are you going Hirsch on me? Quantifier variance?"

  "Why not?" Alex shrugged. "In your linguistic framework, 'exists' is unrestricted. In mine, it's restricted to commonsense kinds. Both frameworks are internally consistent. Both allow us to navigate the world. So, in your language, it's true that the table exists. In mine, it's true that it doesn't. We're both right. The dispute is merely verbal."

  Jamie pushed off the wall and picked up a leftover dowel, turning it over in their hands. "That's the charitable move. It saves face for both of us. But it assumes all languages are on equal footing. What if one carves reality at the joints and the other doesn't?"

  "Joints?" Alex scoffed. "You sound like Sider. You think there's an 'Ontologese'—a perfect, structure-mirroring language—and that in *that* language, the universalist quantifier is the correct one?"

  "I think structure matters," Jamie said. "If reality has a fundamental structure, then some ways of speaking track it better than others. If the universe doesn't care about my 'table' versus 'particles arranged table-wise' distinction, then maybe the unrestricted quantifier is the only one that doesn't impose human categories on the void. Or maybe your restriction is the one that tracks causal powers. But one of us has to be wrong about the *structure*, not just the vocabulary."

  "But how would we know?" Alex asked, gesturing at the finished table. "If I sit on it, it holds me. If you sit on it, it holds you. The physics is identical. The only difference is whether we label the configuration an 'object.' If the empirical predictions are the same, and the logic is valid in both systems, insisting on a 'joint-carving' fact of the matter feels like... theology. You're positing a metaphysical reality that makes no difference to anything."

  "It makes a difference to truth," Jamie said. "If I say 'there is a chair' and you say 'there is no chair,' we can't both be stating the fundamental truth of the situation. One of those sentences corresponds to the world's structure. The other is a useful fiction."

  Alex ran a hand over the tabletop. It was smooth, solid. "But if Hirsch is right, 'corresponds to the world's structure' is just another way of speaking within a language. There's no view from nowhere to check the joints."

  "And if Sider is right," Jamie said, "then saying it's all just language is a cop-out to avoid the hard work of figuring out what's actually there."

  They stood in silence for a moment. The room was full of objects, or particles, or both.

  "So," Alex said softly. "Does the table exist?"

  Jamie looked at the table, then at Alex, then back at the table. "In Ontologese? I don't know if I speak it. In English? Yes."

  "In English?" Alex smiled tiredly. "Or just 'particles arranged table-wise'?"

  "Maybe those are the same thing. Maybe they aren't." Jamie picked up the Allen wrench and dropped it back into the box. "I don't know if we're fighting about the world, or just fighting about how to fight about the world."

  Alex sat down on the new table. It didn't collapse. "Well. It supports my weight."

  "Structurally," Jamie said.

  "Structurally," Alex agreed.

  Neither of them moved to clear the cardboard boxes.
