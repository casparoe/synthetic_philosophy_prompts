          *   Wealth after $N$ flips: $W_N = W_0 \cdot (1+f)^H \cdot (1-f)^T$, where $H$ is heads count, $T$ is tails count.
          *   EV of one bet: $0.7(1+f) + 0.3(1-f) = 1 + 0.4f$. This is linear in $f$. To maximize EV of *one* bet, set $f=1$.
          *   EV of $N$ bets (arithmetic mean): $E[W_N] = W_0 \cdot (1 + 0.4f)^N$. This is maximized at $f=1$.
          *   *However*, the *median* outcome or the *typical* outcome depends on the geometric mean.
          *   Geometric Growth Rate: $g(f) = (1+f)^{0.7} \cdot (1-f)^{0.3}$.
          *   Kelly Criterion maximizes this geometric growth rate.
      *   *The Friend's Argument:* The friend says there's an "objective" sense where maximizing typical long-run outcome is rational, independent of utility. This points towards **Ergodicity Economics** (Ole Peters et al.).
