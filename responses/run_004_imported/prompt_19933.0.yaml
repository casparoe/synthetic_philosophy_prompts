answer: |-
  Your intuition is correct, and your simulation is telling you the truth. Your friend is also correct, but likely for deeper reasons than they might realize. This is not merely a disagreement about "risk tolerance"; it is a fundamental disagreement about the nature of probability, time, and rationality.

  You have stumbled upon one of the most significant blind spots in classical economics and probability theory. The conflict you are feeling arises because standard Expected Value (EV) theory assumes a property called **ergodicity**, but your coin-flip game is **non-ergodic**.

  Here is the breakdown of why maximizing EV fails here, why your friend's claim about "objectivity" holds water, and what actually replaces Expected Value in this context.

  ### 1. The Two Averages: Ensemble vs. Time

  To understand the disagreement, we have to distinguish between two ways of calculating an "average."

  **The Ensemble Average (What EV measures)**
  Imagine 1 million people walk into a room. Each person bets 100% of their money on one coin flip. 700,000 double their money; 300,000 go to zero.
  *   Total wealth in the room: $700,000 \times 2 + 300,000 \times 0 = 1.4$ million units.
  *   Average wealth per person: 1.4 units.
  *   **Expected Value:** +40%.

  If you look at the system from the outside, across many parallel people, betting 100% creates massive wealth on average. This is what your friend calculated.

  **The Time Average (What you experience)**
  Now imagine *you* are the only person in the room. You bet 100% of your money. You flip 100 times.
  *   If you hit a single Tail, you have zero.
  *   If you have zero, you cannot bet again.
  *   Your wealth trajectory is a single path through time.

  In this scenario, the "average" outcome isn't the arithmetic mean of all possible paths; it is the **geometric mean** of the single path you actually walk. Because multiplication is involved (compounding), one zero anywhere in the chain turns the entire product to zero.

  **The Crucial Insight:** In standard statistics, we assume the "Ensemble Average" (average across people) equals the "Time Average" (average across time for one person). This is called **ergodicity**.
  *   **Additive processes are ergodic:** If you win or lose $10 on a flat bet, the average across 1 million people is the same as the average across 1 million flips for one person.
  *   **Multiplicative processes are non-ergodic:** If you bet a *fraction* of your bankroll, the order of wins and losses matters, and ruin is absorbing (once you hit zero, you stay there). The ensemble average diverges from the time average.

  Your friend is right: Using standard Expected Value here is a category error. It applies an ensemble average to a time-dependent problem.

  ### 2. Is This Just "Risk Aversion"?

  This is the core of your philosophical objection. You asked: *Is my friend smuggling in a preference and dressing it up as objectivity?*

  In classical economics (Von Neumann-Morgenstern utility theory), the answer would be **yes**. They would argue:
  1.  Maximizing EV is the only mathematically "rational" objective.
  2.  If you choose not to bet 100%, it is because you have a "concave utility function" (you value the 10th dollar less than the 1st).
  3.  Therefore, betting less is a subjective preference for safety over growth.

  **However, your friend is channeling a newer perspective (often associated with Ergodicity Economics and physicists like Ole Peters).** From this viewpoint, the answer is **no**. It is not about preference; it is about physical reality.

  Here is why:
  If you bet 100% every time, your **expected long-term growth rate is negative infinity**. You will go broke.
  If you bet a specific fraction (around 40% in this case), your **long-term growth rate is maximized**.

  This is not a trade-off. It is not "I am sacrificing some growth to be safe." It is "If I bet more than this optimal fraction, I actually grow *slower*."

  *   **Betting 10%:** You grow, but too conservatively.
  *   **Betting 40%:** You grow at the maximum possible speed.
  *   **Betting 100%:** You grow fast for a few rounds, then hit zero and stop growing forever.

  Because betting more than the optimal fraction *reduces* your long-term return, choosing the optimal fraction isn't an expression of "risk aversion." It is simply the strategy that yields the highest return for a single agent operating through time. In this sense, your friend is right: it is objective. It is a mathematical property of compounding, not a psychological preference.

  ### 3. What Replaces Expected Value?

  If we can't use Arithmetic Expected Value, what should we maximize?

  We need a metric that converts the multiplicative process into an additive one, so that time averages and ensemble averages align again. The mathematical tool that turns multiplication into addition is the **logarithm**.

  Instead of maximizing $E[\text{Wealth}]$, you maximize $E[\log(\text{Wealth})]$.

  Why?
  1.  $\log(A \times B) = \log(A) + \log(B)$.
  2.  By maximizing the expected change in the *log* of your wealth, you are maximizing the **geometric growth rate**.
  3.  This leads directly to the **Kelly Criterion**.

  For your specific game (70% win chance, even money payout), the Kelly formula tells you to bet:
  $$f^* = p - q$$
  $$f^* = 0.7 - 0.3 = 0.4$$

  You should bet **40%** of your bankroll.

  If you bet 40% every time:
  *   You will never go to zero (you always have 60% left).
  *   Your wealth will fluctuate wildly, but the *trend* will be upward at the maximum possible rate.
  *   After 100 flips, your *median* outcome will be vastly higher than any other strategy.

  ### 4. Resolving the Disagreement

  You asked whether there is a sense in which one strategy is "more rational" independent of utility.

  **Yes.** Rationality is about selecting the best means to achieve an end.
  *   If your end is "maximize the average wealth of a room full of strangers," bet 100%.
  *   If your end is "maximize the wealth of *me*, specifically, over the course of my life," bet 40%.

  Standard Expected Value theory implicitly assumes you can average across parallel universes. But you cannot. You live in one universe, through one timeline. When a process is non-ergodic (like compounding wealth), the "Ensemble Expectation" becomes physically irrelevant to the individual agent.

  Your friend's claim holds up: Treating ordinary Expected Value as the gold standard in multiplicative, repeated games is a mistake about the nature of expectation. It conflates "what happens on average across many people" with "what happens to me over time."

  ### Summary

  1.  **Your Simulation:** Correct. Betting 100% leads to ruin because the process is multiplicative and non-ergodic.
  2.  **The EV Trap:** Expected Value calculates the average of *parallel outcomes*. In compounding, the single path you actually take (Time Average) matters more than the average of all possible paths.
  3.  **Risk vs. Rationality:** This is not about risk tolerance. Betting more than the Kelly fraction (40%) actually *lowers* your long-term growth rate. Therefore, betting 40% is objectively superior for wealth accumulation, not just "safer."
  4.  **The Fix:** Maximize the expected logarithm of wealth, not the expected value of wealth. This aligns your math with the reality of time.

  Your friend is right that this is a substantive philosophical point, not just a trick. It highlights a flaw in how we traditionally teach rational choice: we often teach people to optimize for the ensemble, when they actually live in time.
