      *   **Friend's Claim:** Maximize Expected Value (EV) $\rightarrow$ Bet 100% of bankroll every time.
      *   **User's Simulation:** Betting 100% leads to ruin (one Tail wipes you out). Betting a fraction leads to profit in most runs, though lower *average* payout across all simulations.
