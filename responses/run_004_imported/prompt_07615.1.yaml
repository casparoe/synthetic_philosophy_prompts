  7.  **Final Polish:** Check against the user's constraints ("not just 'it depends'"). I need to take a stand. The stand is: In the context of forecasting/calibration, the Bayesian view is the operational one. Marcus is philosophically consistent but practically useless for their specific goal.

      *(Self-Correction)*: Wait, I should check the "deterministic" aspect. An exam is already graded or will be. It's not random. This is the "Propensity vs. Epistemic" distinction. I need to make sure I clarify that probability lives in the *mind*, not the *exam*.

