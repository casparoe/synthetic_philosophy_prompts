      *   *The Counter-Argument (Drory/others):* You can define a distribution over lines that is invariant but yields 1/3 or 1/4. For example, mixing distributions or choosing specific parameterizations that respect symmetry but differ in "shape."
      *   *The Empirical Twist:* Why do straws give 1/2? The Skeptic needs to argue this is about the *throwing mechanism*, not the geometry itself. The Jaynesian argues the throwing mechanism *is* the physical instantiation of the symmetry.

