  *(Self-Correction during final polish)*: Make sure Alex doesn't just say "Jaynes is right." Alex needs to explain *why* the other invariant measures are invalid from an information-theoretic standpoint. Sam needs to make sure they don't just say "math is arbitrary," but rather "the mapping from math to physics is the arbitrary part."

