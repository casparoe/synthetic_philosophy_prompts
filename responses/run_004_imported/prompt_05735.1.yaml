prompt: |-
  So I went down a wikipedia rabbit hole last night on Henry Sidgwick, the Victorian utilitarian who wrote The Methods of Ethics, and found out he was a founding member and the first president of the Society for Psychical Research -- spent a big chunk of his later career personally investigating mediums, telepathy claims, haunted houses, the whole nine yards, alongside people like Frederic Myers and his own wife Eleanor. Feels like a wild move for a guy whose whole reputation is built on being maybe the most careful, rigorous philosopher of his era.

  Digging a bit more, apparently people who study him connect this to a problem he raised in his own ethics, something called the "dualism of practical reason" -- basically he couldnt find a rational proof that self-interest and morality always recommend the same action, and he seemed to hope actual scientific evidence of an afterlife could close that gap in a way pure argument never could.

  Can you write me an essay on whether Sidgwick's psychical research was a defensible, rational move given his own standards of evidence, or whether it was really motivated reasoning from a brilliant guy who couldn't stomach where his own arguments left him? Weigh both sides properly, but don't cop out with an "it's complicated, both sides have a point" ending -- actually land on and defend a specific verdict.
reasoning: |-
  Here's a thinking process that leads to the essay:

  1.  **Analyze the Request:**
      *   **Subject:** Henry Sidgwick (Victorian utilitarian philosopher, author of *The Methods of Ethics*, founding member/president of the Society for Psychical Research [SPR]).
      *   **Core Question:** Was Sidgwick's involvement in psychical research a defensible, rational move based on his own standards of evidence, or was it motivated reasoning (a brilliant man unable to accept the implications of his own "dualism of practical reason")?
      *   **Constraint:** Weigh both sides, but *do not* cop out with a neutral "it's complicated" conclusion. I must land on and defend a specific verdict.
      *   **Tone:** Analytical, philosophical, engaging (matching the user's "rabbit hole" discovery vibe).

  2.  **Deconstruct the Arguments:**

      *   **Side A: It was Rational/Defensible.**
          *   *Context:* Victorian era, rise of scientific naturalism, crisis of faith.
          *   *Sidgwick's Method:* Empiricist, rigorous, anti-dogmatic. He applied the same scrutiny to spiritualism as he did to ethics.
          *   *The Stakes:* If morality requires self-sacrifice but offers no reward (not even divine justice), rational egoism wins. This undermines the utilitarian project.
          *   *Evidence:* He was skeptical. He exposed frauds. He didn't believe blindly; he sought *proof*. If an afterlife exists, it changes the calculus of self-interest.
          *   *Consistency:* It aligns with his commitment to finding the truth, wherever it leads.

      *   **Side B: It was Motivated Reasoning/Desperation.**
          *   *The "Dualism":* Sidgwick admitted he couldn't reconcile duty and self-interest rationally.
          *   *The Wish:* He *needed* the afterlife to exist to save ethics from collapse.
          *   *The Shift:* Moving from armchair philosophy to investigating table-rapping seems like a category error or a descent into wishful thinking.
          *   *Outcome:* He never found conclusive proof. He invested massive time/energy into a field that yielded little scientific fruit, suggesting an emotional drive rather than a purely evidential one.
          *   *Psychology:* Fear of the "abyss" of nihilism or irrational morality.

  3.  **Determine the Verdict:**
      *   *Option 1 (Rational):* Hard to defend fully because the SPR largely failed to produce the goods, and the leap from ethics to ghosts is tenuous.
      *   *Option 2 (Motivated Reasoning):* Stronger case. The *need* for the conclusion (to save ethics) preceded the investigation. The investigation was a search for a specific type of evidence to solve a philosophical problem, not an open-ended scientific inquiry.
      *   *Nuance:* It wasn't "irrational" in the sense of being crazy, but it was *teleologically* driven. He wasn't asking "Do ghosts exist?" He was asking "Can I find evidence that saves morality?"
      *   *Decision:* I will argue that while Sidgwick maintained his *methodological* rigor, the enterprise itself was fundamentally an act of **desperate motivated reasoning**. It was a philosophical Hail Mary disguised as empirical science. He couldn't stomach the "dualism," so he went looking for a metaphysical loophole.

  4.  **Drafting - Section by Section:**

      *   **Title:** Needs to be punchy. Something about the Philosopher and the Ghosts.
      *   **Introduction:** Hook with the contrast (rigorous ethicist vs. ghost hunter). Introduce the "Dualism of Practical Reason." State the thesis clearly (it was motivated reasoning).
      *   **Body Paragraph 1: The Philosophical Trap.** Explain the Dualism. Why does utilitarianism fail without an afterlife? (The conflict between Rational Egoism and Universal Good). This sets the *motive*.
      *   **Body Paragraph 2: The SPR and Methodological Rigor.** Acknowledge the counter-argument. He *was* careful. He exposed fraud. He demanded evidence. This makes him look rational on the surface.
      *   **Body Paragraph 3: The Teleological Flaw.** Why the rigor doesn't save him. The inquiry wasn't open-ended. It was solution-oriented. He was looking for a specific key to fit a specific lock. This biases the interpretation of ambiguous evidence.
      *   **Body Paragraph 4: The Historical/Personal Context.** The Victorian crisis of faith. The personal toll (his own religious struggles). This adds weight to the emotional/motivated aspect.
      *   **Conclusion:** Reiterate the verdict. It wasn't madness, but it was a failure of philosophical courage. He tried to empirical his way out of a metaphysical corner.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Am I being too harsh? Sidgwick was genuinely skeptical.
      *   *Adjustment:* Acknowledge his skepticism. He didn't believe everything. But the *drive* to investigate was the issue, not the gullibility. The investment of resources into a low-probability field to solve a high-stakes philosophical problem is the definition of motivated reasoning.
      *   *Check:* Did I avoid the "it's complicated" cop-out?
      *   *Adjustment:* Ensure the final paragraph is decisive. "Sidgwick was not a credulous mystic, but he was a desperate philosopher."

  6.  **Final Polish:**
      *   Check tone. Ensure it sounds academic but accessible.
      *   Verify facts: Sidgwick, *Methods of Ethics*, SPR, Myers, Eleanor Sidgwick, Dualism of Practical Reason.
      *   Make sure the link between the afterlife and the reconciliation of self-interest/morality is clear (Kantian postulate vibe).

  7.  **Final Review against constraints:**
      *   Essay format? Yes.
      *   Weigh both sides? Yes.
      *   Specific verdict? Yes (Motivated Reasoning).
      *   No "both sides have a point" ending? Yes.

  *(Self-Correction Note)*: I need to make sure I don't confuse Sidgwick with Kant. Kant postulated God/Immortality to solve the Highest Good. Sidgwick found he *couldn't* prove it rationally (unlike Kant who said we must assume it), so he went looking for empirical proof instead. That's the crucial distinction. Sidgwick is an empiricist stuck in a rationalist's problem.

