  Here are a few attempts, ranging from the "dev-focused" to the "philosophy-focused," all trying to land on that specific mechanic of trading actions you personally view as worthless.

  **Option 1: The "Dev" Angle (since you mentioned load balancing)**
  "Moral trade is basically ethical load-balancing between two servers that are convinced the other one is running corrupted data.
  'I'll process your request to save the whales, even though I think the whale database is empty, provided you process my request to stop the singularity, even though you think the AI table is null.'
  We call it 'Pareto Optimal,' but mostly it's just two processes handshaking over a connection they both agree shouldn't exist."

  **Option 2: The "Hallucination" Angle (hits the "100% confident" constraint)**
  "I finally explained moral trade to my wife. She asked, 'So you're paying him to do something you think is useless, so he'll pay you to do something he thinks is useless?'
  I said, 'Exactly.'
  She said, 'That's not ethics, that's a money-laundering scheme for virtue.'
  I said, 'No, it's mutually subsidizing each other's moral hallucinations.'"

  **Option 3: The "Confessional" Angle (short & punchy)**
  "Moral trade is just secular indulgences.
  It's two atheists swapping penance: 'I'll pretend to care about your chickens if you pretend to care about my robots.'
  The only difference is, in Catholicism, God is supposed to be watching. In Effective Altruism, we're just hoping the other guy doesn't check the source code."

  **Option 4: The One-Liner**
  "Moral trade is the only time in philosophy where you can look your friend in the eye and say, 'I am fully willing to fund your delusion, provided you fund mine,' and call it a cooperative equilibrium."

  **My recommendation:**
  **Option 2** or **4** probably lands best for an EA friend. The phrase **"mutually subsidizing each other's moral hallucinations"** captures the exact weirdness you described: the fact that the trade works *despite* both parties being certain the other's cause has zero objective value. It highlights that the "value" isn't in the act, but in the *trade itself*.
