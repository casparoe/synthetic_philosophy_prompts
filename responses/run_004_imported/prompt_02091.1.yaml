answer: |-
  You are right to feel like something was off. Your friend is conflating two distinct arguments made by John Harsanyi, and more importantly, she is glossing over the fundamental disagreement Rawls had with the *decision rule* used behind the veil.

  Here is the breakdown you need to settle the argument.

  ### 1. The Conflation: Aggregation Theorem vs. Impartial Observer
  Your friend's first technical error is mixing up Harsanyi's **Aggregation Theorem (1955)** with his **Impartial Observer Argument (1953)**.

  *   **The Aggregation Theorem:** This is the math-heavy one. It states that if individuals have von Neumann-Morgenstern (vNM) rational preferences, and society satisfies the Pareto principle (if everyone prefers X to Y, society prefers X to Y), then the social welfare function must be a **weighted sum** of individual utilities ($W = \sum a_i U_i$).
      *   *Crucial Detail:* This theorem **does not** contain the "equal chance of being anyone" move. It does not require probabilities at all. It also does not prove *classical* utilitarianism (equal weights); it only proves *weighted* utilitarianism. To get equal weights, Harsanyi needs an additional ethical postulate about impartiality.
  *   **The Impartial Observer Argument:** This is where the "Veil of Ignorance" move happens. Harsanyi argues that an impartial observer imagines they have an **equal probability ($1/n$)** of being any person in society. If that observer maximizes *expected utility*, they will choose the arrangement that maximizes the average utility (Utilitarianism).

  **The Tiebreaker Point:** Your friend claimed the "equal chance" move is part of the Aggregation Theorem. **It is not.** She is merging two different papers. The Aggregation Theorem relies on Pareto + Rationality; the Impartial Observer relies on Equiprobability + Expected Utility.

  ### 2. The Crux: Risk vs. Radical Uncertainty
  Even if we grant your friend the Impartial Observer argument (where the "equal chance" move actually lives), she is wrong that Rawls is being inconsistent. Rawls explicitly rejects the mathematical assumption Harsanyi uses.

  This is the philosophical heart of the disagreement: **Risk vs. Uncertainty.**

  *   **Harsanyi (Risk):** Harsanyi assumes that behind the veil, you can apply the **Principle of Insufficient Reason**. Since you don't know who you are, you should assign an equal probability to being everyone. This turns the problem into a decision under **risk**. If you are rational (in the vNM sense) and face risk, you maximize *expected utility*. Mathematically, this leads to Utilitarianism.
  *   **Rawls (Uncertainty):** Rawls argues that the Original Position is not a situation of *risk* (where probabilities are known or calculable), but of **radical uncertainty** (where probabilities are meaningless). You cannot say there is a "1 in 300 million" chance of being you, because there is no objective basis for that probability distribution in a constitutional choice.
      *   Because there are no objective probabilities, the **Expected Utility rule is invalid.**
      *   Instead, Rawls argues for the **Maximin Rule** (maximize the minimum position).

  ### 3. Why Maximin? (The "Stakes" Argument)
  Rawls anticipates the exact argument your friend made. In *A Theory of Justice* (§26), he explains why a rational person behind the veil would *not* gamble on average utility. He lists three conditions for Maximin to be rational:

  1.  **No Reliable Probabilities:** (As mentioned above).
  2.  **Guaranteeable Minimum:** The chooser cares little for potential gains above the minimum guarantee.
  3.  **Unacceptable Outcomes:** The alternatives involve risks that could result in outcomes the chooser cannot accept (e.g., slavery, loss of basic liberty, destitution).

  **The Analogy:**
  *   **Harsanyi:** Choosing a society is like choosing which lottery ticket to buy. You play the odds to get the highest average payout.
  *   **Rawls:** Choosing a society is like choosing the rules of a game where the loser might be enslaved. You don't maximize the average payoff; you ensure the loser doesn't starve.

  Rawls argues that because the "veil" covers **basic liberties and life prospects**, the stakes are too high to treat social choice as a gambling scenario. If you guess wrong in Harsanyi's model, you might end up poor. If you guess wrong in Rawls's model, you might end up a serf. Therefore, Utilitarianism is "unreasonable" because it allows the sacrifice of the few for the greater good, which is an unacceptable risk to take with your basic rights.

  ### 4. Interpersonal Utility
  There is one more technical wedge.
  *   **Harsanyi** requires **cardinal utility** that is comparable across persons to do the summation ($\sum U_i$). He believes we can scientifically measure and compare how much you like ice cream vs. how much I like it.
  *   **Rawls** rejects this. He thinks comparing utility functions is impossible and philosophically suspect. Instead of "utility," Rawls uses **Primary Goods** (rights, liberties, opportunities, income, wealth). The Difference Principle maximizes the index of primary goods for the worst-off, not the sum of subjective utility.

  ### The Verdict for Your Argument
  You can tell your friend this:

  1.  **Technical Correction:** The "equal chance" assumption is **not** in Harsanyi's Aggregation Theorem. It is in his separate Impartial Observer argument. The Aggregation Theorem only proves a *weighted* sum, not necessarily a utilitarian one, without adding ethical postulates.
  2.  **Philosophical Disagreement:** Rawls is not inconsistent; he explicitly argues that the **Expected Utility axiom** (which Harsanyi relies on) is irrational under conditions of radical uncertainty regarding basic rights.
  3.  **The Real Split:** Harsanyi treats the Veil as a **lottery** (maximize average gain). Rawls treats the Veil as a **constitutional safeguard** (prevent catastrophic loss).

  **Who won?**
  You win on the textual accuracy (Rawls is not inconsistent; he disagrees with the premises). She wins on the mathematical consistency *if* you accept Harsanyi's premises (vNM rationality + equiprobability). But since the debate is about which premises are appropriate for justice, Rawls's critique of the "gambling" model is the standard counter-argument.

  **TL;DR:** She conflated two Harsanyi theorems. Rawls rejects the "equal probability" move as irrational for fundamental rights, preferring Maximin over Expected Utility. It's not a contradiction; it's a disagreement on decision theory under uncertainty.
