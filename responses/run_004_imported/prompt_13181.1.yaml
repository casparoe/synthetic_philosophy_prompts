      *   *Concept:* Moral trade (often associated with Toby Ord, William MacAskill, or general effective altruism discussions) is about cooperating to maximize expected value across different moral frameworks. It relies on *moral uncertainty* or simply differing weightings of values.
      *   *Definition Accuracy:* Generally correct. It's about maximizing expected choiceworthiness across different moral theories or individual moral preferences.
      *   *Example Accuracy:* The Alice/Bob example is the classic textbook example for this (often attributed to discussions on moral compromise).
