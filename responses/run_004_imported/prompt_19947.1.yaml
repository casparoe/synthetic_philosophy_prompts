answer: |-
  Your friend is correct, and their claim is not self-contradictory. It is a direct consequence of how Expected Value (EV) functions behave in polarized spots, specifically a mathematical property called **convexity**.

  The confusion you are feeling is natural. It stems from looking at specific matchups ("this medium bet beats this call") rather than the aggregate Expected Value of your entire range against your opponent's optimal response.

  Here is the breakdown of why the solver ignores medium sizes, why your friend's logic holds up, and how you can use this at the table without a computer.

  ### 1. The Math: Why a "Mix" Beats a "Middle"
  Your friend's claim relies on the shape of the EV curve. In polarized river spots, the relationship between **Bet Size** and **Range EV** is typically **convex** (U-shaped), not linear or concave (inverted U).

  Imagine a graph where the X-axis is Bet Size (from 0% to 150% pot) and the Y-axis is your Range EV.
  *   **At 0% (Check):** You realize some equity by showdown or induce bluffs. EV is high.
  *   **At 150% (Overbet):** You extract maximum value from calls and generate maximum folds. EV is high.
  *   **At 50% (Medium):** You are in the "dip" of the U-curve.

  If the curve is U-shaped, a straight line drawn between the two endpoints (Check and Overbet) will pass *above* the curve in the middle.
  *   **Solver Logic:** The solver is allowed to play a mixed strategy (e.g., 40% Check, 60% Overbet). This places its EV on that straight line connecting the endpoints.
  *   **Medium Bet Logic:** Committing to a medium bet forces you to a specific point on the curve (the dip).

  Therefore, it is mathematically possible (and common) for a 50/50 mix of Check/Overbet to have higher EV than a 100% Medium bet, even if the Medium bet looks "okay" in isolation. You aren't losing to Check *or* Overbet individually; you are losing to the **efficiency of separating your range.**

  ### 2. The Poker Logic: Risk vs. Reward Mismatch
  Why does the curve dip in the middle? It comes down to the conflicting goals of your value hands and your bluffs.

  **Value Hands (The Nuts)**
  *   **Goal:** Get called by as many worse hands as possible for as much money as possible.
  *   **Preference:** They generally prefer larger bets. If the opponent will call a 50% bet, they will often call a 125% bet. If you bet 50%, you leave money on the table.

  **Bluffs (The Air)**
  *   **Goal:** Make the opponent fold better hands.
  *   **Preference:** They want the highest **Fold Equity per Chip Risked**.
      *   To bluff 50% pot, you need the opponent to fold 33% of the time to break even.
      *   To bluff 150% pot, you need the opponent to fold 60% of the time.
      *   *However*, in polarized spots, your opponent's calling threshold often doesn't shift linearly. A medium bet might not fold out enough hands to justify the risk, while an overbet might panic them into folding the exact hands you need them to.
      *   More importantly, by checking some of your bluffs (or weak value), you protect your checking range.

  **The Medium Bet Problem**
  A medium bet is the "worst of both worlds" in a polarized spot:
  1.  **For Value:** It charges less than the opponent might be willing to pay (leaving EV on the table).
  2.  **For Bluffs:** It risks more chips than a small bet without necessarily generating proportionally more folds than an overbet.
  3.  **For Balance:** It makes your range easier to read. A medium bet often signals "I want a call but I'm scared," which allows a thinking opponent to exploit you by folding hands that would fold to an overbet and calling hands that would fold to a check.

  By splitting your strategy between **Check** and **Overbet**, you force the opponent to defend two completely different thresholds. They must defend loosely against the overbet (to prevent you from printing value) and defend aggressively against the check (to prevent you from bluffing too much). A medium bet allows them to settle into one comfortable calling frequency that exploits the middle of your range.

  ### 3. Resolving Your Paradox
  You asked: *"How can a single option lose to a combination of two alternatives if it doesn't lose to either alternative by itself?"*

  You are likely evaluating this by looking at specific slices of the opponent's range.
  *   *Example:* "Against his top pair, my medium bet gets called, but my overbet folds him out." -> Medium looks better here.
  *   *Example:* "Against his bluff-catcher, my check loses to his bluff, but my medium bet wins." -> Medium looks better here.

  The solver aggregates **all** of these scenarios weighted by how often the opponent actually holds those hands.
  *   The Overbet loses value against Top Pair (they fold), but it extracts 3 big bets from Two Pair.
  *   The Check loses to bluffs, but it saves money when you are behind and allows you to bluff-catch.
  *   The Medium bet gets 1.5 big bets from Two Pair (less than overbet) and still loses to bluffs when you check behind (sometimes).

  The "Mix" allows you to assign specific hands to the action that maximizes *their* specific EV. Your strongest hands Overbet. Your medium-strong hands Check (to induce). Your bluffs Overbet (to maximize fold equity). Your medium-bluffs Check (to give up).
  A Medium bet forces **all** those hands into one action, dragging down the total average.

  ### 4. Practical Takeaways for Human Play
  You cannot run a solver at the table, and humans cannot perfectly balance frequencies. However, understanding *why* the solver does this gives you robust heuristics.

  **A. Embrace Bimodal Sizing**
  In polarized river spots, stop reaching for "standard" sizes like 1/3 pot, 1/2 pot, or 3/4 pot. Train yourself to think in extremes:
  *   **Small/Check:** For inducing bluffs or realizing equity with medium strength.
  *   **Large/Overbet:** For maximizing value with nuts or maximizing fold equity with pure bluffs.
  *   *Rule of Thumb:* If you are polarized, ask yourself: "Do I want a call or a fold?" If you want a call, bet big (often pot+). If you want a fold, bet big. If you want to see a showdown cheaply, check. The middle is for merged ranges, not polarized ones.

  **B. Reduce Cognitive Load**
  Solver outputs that look complex (mixing 3 sizes) are often artifacts of the solver trying to be unexploitable. Against humans, **simplification is profitable.**
  *   If you decide your range is polarized, commit to a single large size (e.g., 125% pot).
  *   This makes your decision tree easier. You don't have to calculate "what size represents my flush best?" You just fire the big bet with your flushes and your air.
  *   This consistency makes you harder to read. If you always bet big when polarized, opponents can't size-read you.

  **C. Exploitative Adjustment**
  Solvers assume your opponent plays GTO (perfectly). Humans do not.
  *   **Humans fold too much to overbets.** A solver might mix in checks to prevent the opponent from folding 100% of the time. Against a human who folds 70% of the time to an overbet, you should overbet *more* than the solver suggests.
  *   **Humans call too much to small bets.** If you know your opponent is a calling station, a medium bet might actually be better than the solver's check/overbet mix because they will call the medium bet but fold to the overbet.
  *   *Takeaway:* Use the solver's "extremes" logic as a baseline, but adjust based on opponent tendencies. If they fold too much, overbet more. If they call too much, value bet bigger.

  **D. Narrative Consistency**
  Medium bets often tell a confusing story.
  *   "Why bet 60%? Do you want me to call or fold?"
  *   An overbet says: "I have the nuts or nothing."
  *   A check says: "I have a medium hand or a bluff catcher."
  *   By using the extremes, your betting tells a clearer story, which paradoxically makes you harder to play against because your actions align with optimal theory. Opponents who try to "put you on a hand" will get confused by the polarization.

  ### Summary
  Your friend is right. The medium bet is dominated because the EV function in polarized spots is convex. The "blend" of extremes allows you to maximize the efficiency of your value hands (getting paid max) and your bluffs (optimal risk/reward), whereas a medium bet compromises both.

  **For your game:** Stop fearing the overbet on the river. When your range is polarized, default to checking or betting large. Abandon the "feel-good" 2/3 pot bet unless you have a specific read that your opponent will call it with worse but fold to a larger size. The solver isn't just calculating; it's teaching you that in high-stakes poker, **timidity (medium sizing) is often more expensive than aggression or passivity.**
