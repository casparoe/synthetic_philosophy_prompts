          *   *Refined Recommendation:* **The "Facts-First, Preferences-Second" Protocol.**
              1.  Round 1: Open discussion focused *strictly* on reporting quality, accuracy, and merits. No statements of voting intent.
              2.  Round 2: Simultaneous, private ballot.
              3.  Round 3: If the vote is split or a factual dispute arises, reopen discussion.
