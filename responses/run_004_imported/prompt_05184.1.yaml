              4.  Round 3: Final Vote (can be live or blind).
          *   *Simpler Hybrid:* **Discussion First (No Preferences), Simultaneous Vote.** This allows the "fabricated quote" issue to come up *before* the vote is locked, but prevents the first speaker from anchoring the *choice*.
          *   *Wait, if I discuss first, doesn't the first speaker still anchor?* Yes, if they say "This piece is great."
          *   *Ideal Solution:* **Silent Scoring -> Discussion -> Vote.** Or **Discussion (Facilitated to prevent anchoring) -> Blind Vote.**
          *   *Let's go with the "Blind Straw Poll + Discussion + Final Vote" model.* This is common in academic hiring and editorial boards. It captures the initial independent impulse (stopping the cascade) but ensures the discussion happens *before* the final binding decision (allowing error correction).
