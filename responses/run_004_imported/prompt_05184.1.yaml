          *   *Let's tailor it to the specific "Fabricated Quote" fear.* The Chair wants discussion to catch errors. The User wants to avoid social pressure.
          *   *Proposal:* **Simultaneous "Straw Poll" -> Discussion -> Final Simultaneous Vote.**
