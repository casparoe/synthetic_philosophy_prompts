      *   **Point 1: The Purpose of Money (Tool vs. Commodity).** Berkeley: Money is a ticket to call upon labor. Bitcoin: Money is a store of value (digital gold). This is the fundamental clash.
      *   **Point 2: Elasticity vs. Scarcity.** Berkeley wanted money supply to expand with industry. If Ireland produces more, it needs more tickets. Bitcoin's hard cap prevents this. It chokes growth.
      *   **Point 3: Mining (Real Labor vs. Virtual Labor).** Berkeley valued labor that produces goods/consumables. Mining burns energy to solve math puzzles. To Berkeley, this is unproductive labor.
      *   **Point 4: Hoarding.** "HODL" is the enemy of circulation. Berkeley wanted velocity.
      *   **Counter-argument (and rebuttal):** What about the "no intrinsic value" point? Yes, he'd like that, but it's not enough to save it. The *structure* is wrong.
