      *   *Core Tenet 2:* Wealth = Industry/Production. A nation is rich if its people are employed and producing, not if its vaults are full.
      *   *Core Tenet 3:* Credit/Trust. Money works based on public faith and government backing.
      *   *Core Tenet 4:* Circulation. Money must move. Hoarding is bad. Velocity matters.
      *   *Context:* He was trying to fix Ireland's poverty. He wanted to stimulate activity, not accumulate specie (gold/silver).

  3.  **Analyze Bitcoin/Crypto through Berkeley's Lens:**
      *   *Aspect 1: Dematerialization.* Bitcoin is purely digital. No gold, no silver. This aligns with Berkeley's idea that money doesn't need intrinsic material value.
      *   *Aspect 2: Scarcity Mechanism.* Bitcoin has a hard cap (21 million). This mimics the gold standard. Berkeley hated the gold standard because it tied money supply to a physical resource rather than economic need.
      *   *Aspect 3: Mining.* Proof of Work burns energy to create tokens. Berkeley would ask: "Does this mining produce real wealth (goods/services) or just the ticket itself?"
      *   *Aspect 4: Hoarding vs. Circulation.* "HODLing" culture vs. Berkeley's desire for velocity.
      *   *Aspect 5: Backing.* Bitcoin is backed by math/consensus. Berkeley's proposed bank was backed by the *productive capacity of the nation* (land/labor).

  4.  **Formulate the Verdict (The "No Cop-Out" Requirement):**
