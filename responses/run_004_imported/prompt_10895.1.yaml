      *   *Point 2: The Nature of the Self.* For Descartes, the "I" is a fixed thinking substance. For Zhuangzi, the "I" is a temporary configuration of *qi*. If the self is fluid, the question "Which one is the *real* me?" is a category error.
      *   *Point 3: The Mood.* Descartes is anxious/serious. Zhuangzi is playful/wondering. The mood reflects the philosophical intent.
