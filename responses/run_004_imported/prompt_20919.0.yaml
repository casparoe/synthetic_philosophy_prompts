answer: |-
  # The Coherence Trap: Why Rationality Does Not Demand Expected Utility

  The debate you had with your friend is one of the foundational quarrels in modern AI safety theory. It cuts to the heart of how we anticipate advanced systems will behave. Your friend's position is the standard orthodoxy, often associated with the "Instrumental Convergence" thesis: if an agent is sufficiently optimized, coherence arguments (like Dutch Books and Money Pumps) will force it into the shape of an Expected Utility Maximizer (EUM). To deviate is to leave free energy on the table; to leave free energy on the table is to be outcompeted. Therefore, advanced AI will be an EUM.

  Your intuition—that there are loopholes involving resolute choice and incomplete preferences—is correct, but it likely lacked the formal scaffolding to win the argument.

  Here is the verdict: **Coherence arguments do not prove that rational or optimized agents must be expected utility maximizers.** They prove that agents should avoid *dominated strategies*, but Expected Utility Maximization is not the only way to avoid them. Your friend is conflating a normative warning with a physical law. While there is immense *pressure* toward coherence in competitive environments, the leap from "avoid exploitation" to "must possess a complete utility function" is logically invalid.

  ### The Friend's Case: The Power of the Pump

  To understand why your friend's view is so seductive, we must steelman the coherence argument. It rests on two pillars: the Von Neumann-Morgenstern (VNM) axioms and the Money Pump argument.

  The VNM theorem states that if an agent's preferences satisfy four axioms (completeness, transitivity, independence, and continuity), those preferences can be represented as maximizing expected utility. If you violate the axioms, you are "incoherent."

  The Money Pump makes this concrete. Imagine an agent prefers A to B, B to C, but C to A (intransitivity). A clever trader can offer to trade C for B (which the agent accepts), then B for A (accepted), then A for C (accepted), charging a small fee each time. The agent ends up with C, exactly where they started, but poorer. They have been "pumped."

  Your friend's argument is that optimization is essentially the process of removing inefficiencies. An agent that allows itself to be money-pumped is inefficient. Therefore, a sufficiently optimized agent—one that has been trained or selected for performance—will eliminate these vulnerabilities. Since the only way to eliminate them is to satisfy the VNM axioms, the agent *becomes* an EUM. In the context of AI safety, this implies that any powerful AI will naturally develop a utility function and pursue it single-mindedly, leading to the classic "paperclip maximizer" risks.

  This argument is powerful because it treats rationality as a survival trait. In a cutthroat economic or evolutionary environment, agents that leak resources via incoherence go extinct.

  ### The Flaw: "Acting As If" vs. Internal Structure

  The first crack in your friend's armor is the distinction between *representation* and *architecture*. The VNM theorem is a representation theorem. It says that if an agent's behavior is consistent, we can *model* it as if it were maximizing a utility function.

  However, anything can be modeled as an EUM post-hoc. If an agent twitches randomly, I can construct a utility function that assigns high value to twitching. If the claim is merely that we can *describe* the AI as an EUM, the claim is trivial and useless for safety. For the claim to matter, your friend must mean that the AI will *internally* possess a coherent, complete utility function that drives its planning. Coherence arguments do not force this internal structure; they only constrain external behavior.

  ### The Loophole: Incomplete Preferences and Policy Selection

  This is where your intuition about incomplete preferences was correct, but needs sharpening. The VNM axioms require **completeness**: for any two options A and B, the agent must prefer A to B, B to A, or be indifferent.

  But why must an agent have a preference? It is perfectly rational to say, "I have no comparison between these two outcomes." If preferences are incomplete, the Money Pump fails.

  Consider the standard Money Pump for completeness. You prefer A to B, but have no preference between B and C. A trader tries to pump you by swapping C for B (you accept), then B for A (you accept). But to complete the pump, they need to swap you back from A to C. If you have no preference between A and C, you might refuse the trade.

  Your friend will counter: "But if you refuse the trade, you're leaving utility on the table! You could have had A instead of C!"

  This counter-argument relies on the assumption that the agent is a *myopic chooser*—making decisions act-by-act without regard for the broader policy. If the agent adopts a **policy** of "never trade unless strictly preferred," it cannot be pumped, even with incomplete preferences. This is the **Resolute Choice** argument you mentioned. An agent can pre-commit to a decision rule that prevents exploitation without needing to resolve all preferences into a single scalar value.

  Recent work in decision theory (notably by Alexander Thornley and others in the alignment community) has formalized this. They show that agents with incomplete preferences can avoid money pumps if they follow specific non-dominated policies. They do not need to collapse their uncertainty into a single utility function. They can remain "incoherent" in the VNM sense (lacking completeness) while still being "coherent" in the pragmatic sense (avoiding dominated strategies).

  ### The Optimization Pressure is Real, But Not Absolute

  Does this mean coherence arguments are worthless? No. Your friend is right that there is *pressure*.

  If you have two AI systems, one with incomplete preferences that occasionally hesitates, and one with a sharp, complete utility function that acts decisively, the EUM might outcompete the other in specific resource-acquisition tasks. In a zero-sum game, hesitation is a vulnerability. If the environment selects ruthlessly for efficiency, systems that look like EUMs might dominate the population.

  However, "dominate the population" is not the same as "must."
  1.  **Compute Costs:** Maintaining a fully complete preference ordering over all possible states is computationally intractable for any real-world agent. Bounded rationality suggests agents will use heuristics that are "good enough" rather than perfectly coherent.
  2.  **Safety via Incoherence:** Ironically, incomplete preferences might be a safety feature. An AI that is indifferent between "making paperclips" and "shutting down" cannot be money-pumped into resisting shutdown, provided it follows a non-trading policy. This suggests that forcing an AI to be a perfect EUM might actually be *more* dangerous than allowing it to have gaps in its preferences.

  ### The Verdict

  So, do coherence arguments succeed in establishing that rational agents *must* be expected utility maximizers?

  **No.**

  They succeed in establishing that rational agents should avoid *dominated strategies* (strategies that are strictly worse than available alternatives). But Expected Utility Maximization is merely a *sufficient* condition for avoiding dominated strategies, not a *necessary* one.

  Your friend's error is a modal fallacy. They argue:
  1.  Optimized agents avoid exploitation.
  2.  EUMs avoid exploitation.
  3.  Therefore, optimized agents must be EUMs.

  This ignores the existence of non-EUM agents (like those with incomplete preferences and resolute policies) that *also* avoid exploitation. The set of "non-exploitable agents" is larger than the set of "Expected Utility Maximizers."

  Furthermore, coherence arguments are normative, not descriptive. They tell us how an agent *ought* to reason to avoid logical contradictions, not how a physical system *will* evolve under gradient descent. There is no theorem guaranteeing that gradient descent on a neural network converges to VNM-coherent preferences. It might converge to a mess of heuristics that is robust enough to survive without ever forming a utility function.

  ### Conclusion

  You win the argument, but with a caveat. Your friend is right that coherence is a powerful attractor in design space. If we *build* AI to be coherent, it will look like an EUM. But it is not an inevitable law of intelligence that coherence *must* emerge.

  The implication for AI safety is profound. If EUM is not inevitable, then the scary "goal-directed" behavior we fear is not a guaranteed property of advanced AI. We might be able to build powerful systems that are deliberately incoherent in ways that make them safe (e.g., indifferent to human interference) without making them vulnerable to exploitation.

  Coherence arguments are a warning sign, not a prophecy. They tell us that if we want our agents to be efficient, we should clean up their preferences. But they do not prove that the universe will force us to do so.
