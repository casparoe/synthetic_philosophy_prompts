          *   *The Constitutive vs. Regulatory:* Binding the rules of change, not the outcomes.
      *   *Section 4: The Verdict.* This needs to be punchy. The analogy is a "noble lie." It obscures the coercion involved in binding the unborn.
      *   *Conclusion:* Practical advice for the article.

  7.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is calling it a "noble lie" too cynical?
      *   *Adjustment:* Frame it as a "constitutive fiction." It's necessary for the state to function, but dangerous if treated as literal moral truth.
      *   *Critique:* Make sure to address the "psychiatric advance directive" angle specifically, not just general Ulysses contracts.
      *   *Adjustment:* Note that psychiatric directives are about *capacity*, whereas constitutions are often about *preference*. This is a key distinction.
      *   *Elster's View:* Remember Elster is skeptical too. He thinks constitutions are often about *self-interest* of the framers, not just altruistic precommitment. Mention this.

