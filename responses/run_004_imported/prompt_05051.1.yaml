answer: |-
  Here are ten interview questions designed for a philosophy-focused audience, incorporating your mandatory topics and tailored to a guest defending the coherence of Penal Substitutionary Atonement (PSA) via David Lewis's framework.

  ### 1. The Debt-Guilt Disanalogy
  **Question:** David Lewis leans heavily on the analogy between paying a fine for a friend and Christ paying the penalty for sin. But as Lewis himself notes, there is a stark disanalogy: debts are external obligations that can be transferred, whereas guilt seems to be an internal moral state tied to the agent. How does your account bridge this gap without simply stipulating that guilt *is* transferable?

  **Follow-up:** *(Anticipating she will appeal to a legal fiction or "imputation" mechanism)*: If the transfer relies on a legal fiction—where God treats Christ as guilty when He is not—does that preserve justice, or does it merely mask a violation of the principle that punishment requires actual culpability?

  ### 2. Ontological Status of the Sinner
  **Question:** I want to press on the outcome of this transaction. On your view, does the atonement remove the sinner's *guilt* (the *reatus culpae*), or does it only remove the liability to *suffering* (the *reatus poenae*)? In other words, is the believer actually innocent, or merely pardoned while remaining guilty?

  **Follow-up:** *(Anticipating she will argue guilt is removed via union with Christ)*: If guilt is removed, what happens to the moral history of the agent? If I committed a murder but am treated as never having been guilty, does that not sever the link between moral agency and moral identity that Lewis's own metaphysics usually protects?

  ### 3. The Criminal Law Objection
  **Question:** Lewis worries that if we accept penal substitution in theology, we risk licensing it in ordinary criminal law. If a willing innocent substitute can satisfy justice in the divine court, why does the same move not work for human incarceration? What is the principled difference that stops this from justifying a system where the rich buy innocent surrogates to serve their prison time?

  **Follow-up:** *(Anticipating she will argue God has prerogatives humans lack, such as ownership of life)*: If the difference rests on God's sovereignty or ownership of life, does that render divine justice categorically different from human justice? If so, can we still use our human intuitions about justice to evaluate God's actions in the first place?

  ### 4. Falsification and Defeaters
  **Question:** Analytic philosophy often asks what evidence or argument would compel us to abandon a hypothesis. What specific logical contradiction, moral intuition, or textual evidence would change your mind about the coherence of this project? Is there a "breaker" for your theory?

  **Follow-up:** *(Anticipating she might say only a logical contradiction would suffice, not moral intuition)*: If moral intuitions cannot falsify the theory because they are fallen or finite, does that insulate the doctrine from philosophical critique entirely, turning it into a fideistic claim rather than a philosophical one?

  ### 5. Lewis's Caution vs. Your Confidence
  **Question:** Lewis's 1997 piece is famously cautious; he suggests the doctrine might be coherent but at a "cost" to our understanding of justice. You argue we should accept that cost. Why do you think Lewis was too timid here? Did he underestimate the resources available to systematic theology, or overestimate the stability of our secular intuitions about punishment?

  **Follow-up:** *(Anticipating she will argue Lewis underestimated the flexibility of retributive justice)*: If our secular intuitions about punishment are unstable, on what grounds do we build the argument? Are we deriving the nature of justice from the atonement, rather than testing the atonement against an independent standard of justice?

  ### 6. The Nature of Retribution
  **Question:** Penal substitution seems to require a strongly retributive view of justice—that wrongs *must* be punished, not just rehabilitated or deterred. Does your revival of Lewis commit you to retributivism as the sole valid theory of punishment? If a consequentialist view of punishment is true, does your account collapse?

  **Follow-up:** *(Anticipating she will affirm retributivism is necessary for PSA)*: If retributivism is necessary, how do you respond to the critique that retributivism is essentially institutionalized vengeance? Does making Christ the object of that vengeance sanctify vengeance as a moral good?

  ### 7. Trinitarian Coherence
  **Question:** A common philosophical objection to PSA is that if Christ is God, then God is punishing God. This raises issues of identity and division within the Trinity. Does your Lewisian framework require a specific account of the Trinity to function, or is this compatible with any model where the Father and Son are distinct persons?

  **Follow-up:** *(Anticipating she will rely on distinct persons within one essence)*: If the Father and Son share the same divine will, is the punishment truly "substitutionary," or is it merely self-punishment? If it is self-punishment, does that satisfy the requirement of a substitute bearing the penalty *in the place of* another?

  ### 8. The Antinomian Worry
  **Question:** One of the oldest objections to substitutionary atonement is the moral hazard: if the penalty is fully paid by another, what rational constraint remains on the sinner to avoid future sin? Does your account require an additional mechanism, like sanctification, to prevent the coherence of atonement from leading to antinomianism?

  **Follow-up:** *(Anticipating she will argue gratitude or union prevents license)*: If the constraint is psychological (gratitude) rather than logical (liability), does that mean the system is practically effective but theoretically unstable? Could a perfectly rational agent, on your view, choose to sin freely knowing the debt is pre-paid?

  ### 9. The Rationalist Reception
  **Question:** You mentioned this paper made the rounds on rationalist blogs and forums. These communities often prioritize logical coherence over tradition. Why do you think this specific argument—reviving Lewis's analytic approach—resonated with that audience more than traditional theological defenses of the atonement?

  **Follow-up:** *(Anticipating she will say it treats theology as a rigorous system)*: Does that reception suggest a hunger for "systematic" theology that behaves like analytic metaphysics? Do you worry that optimizing for logical coherence might strip the doctrine of its existential or liturgical power?

  ### 10. The Cost of Coherence
  **Question:** Lewis flagged that making this coherent comes with a "cost." Now that you've argued the position is tenable, what do you view as the highest price tag on your account? What is the most counter-intuitive or difficult implication of your view that you wish didn't have to be true, but accept as necessary?

  **Follow-up:** *(Anticipating she will admit it strains our understanding of personal identity)*: If the cost is a strained view of personal identity or guilt, does that suggest the problem isn't with our philosophy, but with the doctrine itself? At what point does the "cost" become too high for the theory to remain plausible?
