      *   **Observation:** Noted a specific pattern in credibility assessment (calm/consistent = coached/dishonest; distressed/inconsistent = genuine).
      *   **Conflict:** This pattern contradicts psychological literature on trauma/memory and ignores cultural variations in emotional expression.
      *   **Counter-argument:** A caseworker friend argues this is "unavoidable due diligence" (credibility *must* be judged).
      *   **Goal:** The user suspects something deeper is wrong than just an "imperfect heuristic." They want help articulating *exactly* what is wrong with this practice and whether the "we have to judge somehow" defense holds water.
      *   **Tone:** Academic, critical, empathetic, nuanced, ethically grounded.

  2.  **Deconstruct the Core Issue:**
      *   The core issue is the *epistemology of credibility* in asylum procedures.
      *   It involves the clash between *legal/administrative requirements* (certainty, consistency) and *psychological/cultural realities* (trauma responses, narrative styles).
      *   It touches on *power dynamics* (who defines truth?).
      *   It raises *ethical concerns* (potential for refoulement/wrongful denial).

  3.  **Brainstorming the "What is Wrong" (Critique of the Practice):**
      *   *Epistemic Injustice:* The applicant is not seen as a "knower." Their testimony is filtered through a Western lens. (Miranda Fricker's concepts).
      *   *The "Ideal Victim" Script:* There's an implicit stereotype of how a "real" refugee should behave (traumatized, shaky, inconsistent).
      *   *Cultural Bias:* Emotional display rules vary. In some cultures, stoicism is respect; in others, emotion is expected.
      *   *Trauma Psychology:* Trauma can cause fragmentation (inconsistency) *or* dissociation/numbing (calmness). Both are valid.
      *   *Institutional Logic:* Bureaucracies prefer neat narratives. Ambiguity is seen as risk.
      *   *The "Culture of Disbelief":* Asylum systems often start from a presumption of fraud rather than protection.

  4.  **Brainstorming the "We Have to Judge Somehow" (Critique of the Defense):**
      *   *False Dichotomy:* It's not "judge badly" vs. "don't judge." It's "judge badly" vs. "judge better."
      *   *Systemic Responsibility:* If the tool is flawed, the system is obligated to fix the tool, not just use it because it exists.
      *   *Consequences:* The stakes are life/death. "Imperfect heuristic" is unacceptable when the cost is refoulement.
      *   *Circular Logic:* We judge this way because we've always judged this way.

  5.  **Structuring the Response:**
