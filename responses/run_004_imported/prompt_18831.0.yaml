      *   **Conceptual Framework 2: The "Ideal Victim" & Cultural Scripts:** Discuss how the state imposes a narrative script.
      *   **Conceptual Framework 3: Trauma & Memory:** Briefly reinforce the science (dissociation vs. hyperarousal).
      *   **Addressing the Caseworker's Defense:** Dismantle the "unavoidable due diligence" argument. It's a category error.
