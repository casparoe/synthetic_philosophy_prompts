answer: |-
  **Setting:** *The faculty lounge, 4:30 PM. The remains of cheap departmental wine and stale cookies sit on a side table. The colloquium audience has mostly dispersed, leaving MARIA (neo-Aristotelian) and ALEX (situationist) standing by the whiteboard, which is still covered in diagrams from the talk.*

  **Alex:** (Swirling a plastic cup of red) I have to say, Maria, that was a sophisticated defense. Much better than the usual "Aristotle knows best" shrug. But I worry you're conceding too much on the psychology to save the normativity.

  **Maria:** (Laughing) If I don't concede something, I'll be here all night. But which part? The data?

  **Alex:** The data is the data. Look, I know we're all tired of Milgram. Everyone knows the obedience studies. But when you look at something like Darley and Batson's "Good Samaritan" study, it's harder to wave away. You had seminarians, people explicitly training for a vocation of care, preparing a talk on the Good Samaritan parable.

  **Maria:** And many of them stepped over the slumped victim because they were told they were late. I know the study.

  **Alex:** It's not just that they failed. It's that the variable predicting helping behavior wasn't their religious commitment, or their score on a compassion scale, or their moral reasoning stage. It was *hurry*. A situational variable swamped the dispositional one. If virtue ethics requires cross-situationally consistent character traits—what we call "global traits"—this study suggests those traits are empirically vacuous. They don't do the explanatory work you need them to do.

  **Maria:** Okay, but let's slow down on what "explanatory work" means here. You're assuming that for a trait to be real, it has to be the *primary* predictor of behavior in a high-pressure, isolated scenario. But consider Isen and Levin.

  **Alex:** The dime in the phone booth?

  **Maria:** Right. Finding a dime makes you more likely to help someone pick up dropped papers. A trivial mood inducer dictates moral action. You use this to say character is fragmented. I see it differently. I see evidence that moral behavior is *reasons-responsive*, but that the "reasons" are often subtle perceptual cues. The person who finds the dime isn't acting out of "helpfulness" as a global mechanical disposition; they are acting out of a temporary openness to the environment.

  **Alex:** But that's my point! If your "virtue" turns on and off with a ten-cent coin, it's not a stable property of the agent. It's a property of the agent-plus-environment system. Doris's argument isn't that people are evil; it's that the *structure* of their psychology isn't integrated the way virtue ethics assumes. You assume integration; the data shows fragmentation.

  **Maria:** Here's where I think you're leaning on a specific definition of "integration" that Aristotle never signed up for. You're attacking what Sreenivasan called the "consistency requirement." The situationist argument relies on the idea that if I help in situation A but not in situation B, I don't have the virtue of generosity. But Sreenivasan points out that this sets the bar for trait attribution higher than we set it for *any* other psychological trait.

  **Alex:** How so?

  **Maria:** If I'm generally honest, but I lie to protect a friend from a murderer, you don't say "honesty doesn't exist." You say the situation changed the *reasons* for action. The situationist treats morally relevant situational features as *noise* interfering with the trait. The Aristotelian treats them as *input* for the trait. *Phronesis* is the capacity to read the situation. If the seminarians were rushing, they weren't exhibiting a lack of compassion; they were exhibiting a conflict of duties where the situational pressure of "being late" overwhelmed their perceptual capacity to see the victim.

  **Alex:** But that sounds like a retreat. If *phronesis* is so sensitive to context that it disappears under mild pressure—like being five minutes late—what is it? You're making virtue so context-sensitive that it loses its predictive power. If I can't predict that a "compassionate" person will help a victim unless I know their exact schedule, stress levels, and whether they found a dime... in what sense is the virtue *in* them?

  **Maria:** It's not about prediction in the nomological sense. It's about explanation of *action* versus *movement*. But let's go deeper. I think you're conflating *arete* (full virtue) with *enkrateia* (continence).

  **Alex:** Walk me through that.

  **Maria:** Aristotle is quite clear: full virtue is rare. Most people are not *phronimoi*. Most are either *akratic* (weak-willed) or *enkratic* (continently struggling against desire). The seminarians in the Darley study? That sounds like *akrasia*. They knew the right thing, but the pressure of the situation overrode it. Or maybe they were merely *enkratic* and the pressure was too high.

  **Alex:** So your defense is that virtue ethics only applies to the saints?

  **Maria:** No, my defense is that virtue ethics is a *developmental* theory. It posits a target. The empirical literature shows that most people haven't hit the target. That doesn't mean the target is incoherent. You're treating the failure of most people to achieve integrated character as proof that integrated character is impossible. I'm saying the data proves it's *hard*, which is exactly what Aristotle said.

  **Alex:** But there's a normative cost here. If the empirical reality is that behavior is fragmented, then moral education shouldn't focus on "building character" in the internalist sense. It should focus on situation design. If I want people to help, I shouldn't pray for them to become virtuous; I should ensure they aren't in a hurry, or I should put signs up. The locus of control shifts from the agent to the architecture.

  **Maria:** I'll grant you that situation design is part of *phronesis*. A virtuous person *knows* they are susceptible to situational pressure and structures their life to mitigate it. But you can't separate the architecture from the agent who builds it. Why did one seminarian stop and the other didn't, even in the "high hurry" condition?

  **Alex:** Statistical noise?

  **Maria:** Or residual differences in disposition! The data doesn't show a *zero* correlation between disposition and behavior; it shows a *lower* correlation than folk psychology assumes. Situationism relies on a dichotomy: either behavior is 100% determined by situation, or it's determined by global traits. But if traits are real but fragile, and require *phronesis* to activate, then your data just shows a lack of *phronesis*, not a lack of potential for virtue.

  **Alex:** I'm worried that "fragile" is doing too much work. Let's look at Sreenivasan again, since you brought him up. He argues that situationists mischaracterize trait attribution. He says we attribute traits based on a pattern of *reasons*, not just behavior.

  **Maria:** Exactly.

  **Alex:** But here's the rub. In the dime study, the *reason* for helping is arguably "I feel good because I found a dime," not "That person needs help." The motivation is morally incidental. If the psychological mechanism driving the "virtuous" act is a mood boost from currency, can we really call it an expression of a moral trait? Or is it just a causal chain where morality is the byproduct?

  **Maria:** That's the challenge of moral luck, isn't it? But consider this: If I help you because I'm in a good mood, and I fail to help you when I'm in a bad mood, Sreenivasan would say we need to look at the *counterfactuals*. If I were in a bad mood but *recognized* that I ought to help, would I? The experiments test actual behavior, not the underlying structure of practical reasoning. They capture snapshots, not the narrative of a life.

  **Alex:** But we only have the snapshots! We don't have access to the "narrative of a life" in a controlled experiment. And if the snapshots don't cohere, we have no empirical warrant to posit the narrative. It feels like you're positing a noumenal self that has virtue, even if the phenomenal behavior is fragmented.

  **Maria:** (Pauses, picks up a cookie, puts it down) I'm not positing a noumenal self. I'm positing that the experiments measure *performance*, not *competence*. Just because a pianist plays poorly under stress doesn't mean they lack the competence. It means performance is context-dependent. Virtue is a competence. The situationist data shows that performance is unreliable.

  **Alex:** But if the performance is *that* unreliable, does the competence exist in a way that matters for ethics? If I can't rely on my friend to be honest unless the lighting is right and they found a quarter... do I trust them? Or do I trust the lighting?

  **Maria:** You trust them to *try* to get the lighting right. That's the agency part you're missing. The situationist treats the agent as a passive vessel for situational variables. The Aristotelian treats the agent as responsible for managing those variables. The failure to do so is a moral failure, not a proof of impossibility.

  **Alex:** So we're back to "most people are morally failing."

  **Maria:** Most people are untrained.

  **Alex:** (Sighs) Look, I think we might be hitting a wall. You're willing to restrict the scope of "true virtue" to a rare, highly cultivated state that is resilient to situational pressure, and interpret all the data as showing we haven't reached that state. I'm saying that if that state is so rare it's empirically elusive, and if the mechanisms we *do* observe are situation-dependent, then "character" is the wrong unit of analysis for moral theory.

  **Maria:** And I'm saying that if you abandon character, you abandon the idea that we can be responsible for anything other than our immediate reactions. You lose the project of self-constitution.

  **Alex:** Maybe. Or maybe we just stop blaming people for being human and start building better phone booths.

  **Maria:** (Smiles) I don't think Aristotle would object to better phone booths. But he'd ask who built them, and why.

  **Alex:** And I'd ask if it matters, if the builder is just as situationally determined as the user.

  *(They stand in silence for a moment, looking at the whiteboard. The diagrams of "Trait Attribution Conditions" and "Situational Variables" seem to overlap messily.)*

  **Maria:** We're not going to solve this tonight.

  **Alex:** No. But I think I've forced you to admit that virtue is rarer than the folk think.

  **Maria:** And I think I've forced you to admit that fragmentation doesn't equal non-existence.

  **Alex:** Touché. Another glass?

  **Maria:** Please. But only if the department bought the good stuff. I don't want my mood influenced by cheap merlot.

  **Alex:** (Laughing) See? Situationist.

  **Maria:** Or just *phronimos* about wine.

  *(They move toward the table, the argument suspended but the tension remaining, unresolved, in the air.)*
