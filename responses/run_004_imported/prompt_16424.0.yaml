answer: |-
  This is an exceptionally sharp observation, and you have correctly identified one of the most persistent and vexing problems in tort theory. The tension you describe—often called the "collapse thesis"—suggests that in omission cases, the inquiry into cause-in-fact is normatively loaded to the point of redundancy with duty. As you note, under a strict counterfactual (but-for) test, the world is full of causes (everyone who didn't save the drowning victim), but the law selects only one based on prior normative commitments (duty).

  If your premise is correct—that cause-in-fact in omission cases is merely duty by another name—why does the literature persist in maintaining the distinction? There are several theoretical, doctrinal, and functional reasons scholars defend the separateness of the elements, even while acknowledging the overlap. For a dissertation, engaging with these justifications (and their critiques) will be crucial.

  Here are the primary arguments for maintaining the distinction, along with the relevant scholarly debates you should engage.

  ### 1. The Unity of Tort Theory (Commissions vs. Omissions)
  The strongest argument for keeping cause-in-fact separate is to preserve a unified theory of negligence that applies to both commissions and omissions.

  *   **The Argument:** In commission cases (e.g., speeding driver hits a pedestrian), cause-in-fact does independent work. We can establish the driver's speed was a but-for cause of the injury without reference to whether they owed a duty. If we collapse causation into duty for omissions, we create a disunified theory of torts: one model for acts and another for omissions.
  *   **The Scholarly Defense:** Scholars like **Michael Moore** (*Causation and Responsibility*) argue fiercely for a realist view of causation. He contends that causation is a metaphysical relation independent of normative duties. To collapse them is to surrender to skepticism. For Moore, the lifeguard is a cause and the sunbather is a cause *metaphysically*, but the sunbather is not liable because of a lack of duty, not a lack of causation. Maintaining the distinction preserves the integrity of the metaphysical inquiry, even if the legal outcome relies on duty.
  *   **Dissertation Angle:** You might critique whether a "unified" theory is actually desirable if it obscures the normative work being done. Is unity a virtue if it masks the reality of judicial reasoning?

  ### 2. The Definition of the "Omission" Itself
  You noted that the counterfactual test asks: "Would the harm have occurred had the agent acted?" But this raises the question: *Acted how?*

  *   **The Argument:** To apply the but-for test to an omission, we must construct a hypothetical world where the defendant acted. We cannot construct that hypothetical without knowing what the defendant was *required* to do. Therefore, duty logically precedes causation in omission cases.
  *   **The Scholarly Defense:** Scholars like **Jane Stapleton** argue that causation in law is not a metaphysical fact but a legal construct designed to allocate responsibility. She suggests that what we call "cause-in-fact" is often a conclusion about the scope of the risk. However, even she acknowledges the utility of keeping the *labels* separate to distinguish between "no obligation to act" (duty) and "the act wouldn't have changed the outcome" (causation).
  *   **Dissertation Angle:** This is fertile ground. If the content of the hypothetical act is defined by the duty, is the causation inquiry truly separate? Or is it a "check" to ensure the duty was not illusory? (i.e., Did the lifeguard's attention *actually* have the capacity to save the victim, or was the drowning inevitable?)

  ### 3. The "Risk Realization" Account (Scope of Duty)
  Many modern scholars attempt to solve your problem by reframing causation not as a counterfactual physical link, but as a normative link regarding risk.

  *   **The Argument:** The lifeguard is liable not just because they didn't act, but because the *risk that materialized* (drowning due to lack of supervision) is the exact risk that justified the duty. The sunbather had no duty, so no risk was legally cognizable.
  *   **The Scholarly Defense:** **Richard Wright** (proponent of the NESS test) and others argue that the but-for test is insufficient. They propose that we look at whether the defendant's conduct (or omission) was a necessary element of a set of conditions sufficient for the occurrence. However, in omission cases, this often circles back to duty. A more promising avenue for you might be the **"Risk Within the Rule"** analysis. This suggests that cause-in-fact in omissions is really asking: *Did the harm occur in the way the duty was designed to prevent?*
  *   **Dissertation Angle:** This allows you to argue that cause-in-fact in omissions is not about *physical* causation, but about *normative* causation. It remains a separate element because it asks a different question: Duty asks "Was there an obligation?"; Causation asks "Did the breach of that obligation connect to this harm in the specific way contemplated?"

  ### 4. Corrective Justice and Bipolarity
  From a corrective justice perspective (e.g., **Ernest Weinrib**, **Stephen Perry**), the structure of the lawsuit matters.

  *   **The Argument:** Tort law is bipolar; it links a specific plaintiff to a specific defendant. Duty establishes the normative relationship, but causation establishes the *factual* narrative that links the breach to the injury. Even if the causation inquiry is normatively constrained, it serves a rhetorical and structural function in corrective justice. It tells a story of how the defendant's wrong *became* the plaintiff's harm.
  *   **The Scholarly Defense:** If we fold causation into duty, the inquiry becomes purely about the defendant's status (e.g., "Is this person a lifeguard?"). By keeping causation separate, the law requires a narrative showing how the specific failure of *this* defendant resulted in the harm to *this* plaintiff. It prevents liability from attaching solely based on status.
  *   **Dissertation Angle:** Does the "narrative" function of causation justify its separateness even if the underlying logic is circular? Is the "storytelling" aspect of causation essential to the legitimacy of tort judgments?

  ### 5. Evidentiary and Procedural Utility
  Finally, there is a pragmatic, doctrinal reason for the distinction that scholars often highlight.

  *   **The Argument:** Separating duty and causation allocates burdens of proof and standards of review differently.
      *   **Duty** is often a question of law (for the judge).
      *   **Cause-in-fact** is typically a question of fact (for the jury).
  *   **The Scholarly Defense:** By maintaining the distinction, courts can dismiss cases early where no duty exists (e.g., no special relationship between sunbather and swimmer) without needing to litigate complex counterfactuals. Conversely, if there is a duty (lifeguard), the jury can still find no liability if the evidence shows the drowning was inevitable even with supervision (no cause-in-fact). Collapsing the elements muddies the water for summary judgment and jury instructions.
  *   **Dissertation Angle:** You can argue that while the *theoretical* distinction collapses in omissions, the *procedural* distinction remains vital for the administration of justice.

  ### Suggested Directions for Your Dissertation

  Given your focus, here are three specific avenues you might explore to advance the debate:

  1.  **The "Hypothetical Act" Problem:** Dive deep into the logic of the counterfactual test in omissions. Argue that the "act" in the counterfactual antecedent is *constituted* by the duty. Therefore, cause-in-fact in omissions is not a test of physical causation, but a test of **efficacy**. The question isn't "Did they cause it?" but "Would the performance of the duty have prevented it?" This reframes causation as an evidentiary hurdle within the duty analysis, rather than a separate metaphysical element.
  2.  **Comparative Institutional Competence:** Analyze *why* courts insist on the separate element. Is it to empower juries? Is it to allow for incremental development of duty without exploding liability? You might argue that scholars keep them separate because the *doctrine* requires it for manageability, even if *theory* suggests they are one.
  3.  **The NESS Test vs. But-For:** Engage with Richard Wright's NESS test. Does it solve the lifeguard/sunbather problem? (Wright would argue the sunbather's omission was not a necessary element of a sufficient set because the sunbather's action wasn't part of the relevant causal set). Critiquing whether NESS actually escapes the normative pull of duty would be a significant contribution.

  ### Key Literature to Engage
  *   **H.L.A. Hart & Tony Honoré, *Causation in the Law*:** The classic text on common sense causation and omissions.
  *   **Jane Stapleton, "Legal Cause: Cause-in-Fact and the Scope of Liability for Consequences" (2001):** Argues for a unified "risk" approach that essentially collapses the distinctions.
  *   **Michael Moore, *Causation and Responsibility*:** The strongest realist defense of keeping causation metaphysical and separate.
  *   **Richard Wright, "The NESS Account of Natural Causation":** The leading alternative to but-for.
  *   **John Gardner, "Omissions and Breach of Duty":** Excellent on the normative structure of omissions.
  *   **Stephen Perry, "The Moral Foundations of Tort Law":** For the corrective justice perspective on the link between duty and causation.

  **Summary:** Scholars bother treating them separately because (1) it preserves a unified theory for commissions/omissions, (2) it serves procedural functions (judge vs. jury), and (3) it maintains the conceptual distinction between "obligation" and "connection." However, your dissertation is well-positioned to argue that in the specific context of *omissions*, this distinction is indeed a fiction that masks the normative work of duty. The value of your work will be in explaining *why* that fiction is maintained and whether it should be.
