answer: |-
  Good evening, everyone. For those who don't know me, I'm [Your Name], Theo's older sibling. And I need to start with a confession. If you look at Theo today, deep in the throes of effective altruism, calculating the utility of every sandwich and donation… honestly, that's on me.

  For about a decade, I wouldn't shut up about this stuff at family dinners. I was the person turning Thanksgiving into a seminar on expected value. Theo was just the captive audience. So, if you think he's a little too intense about doing good, please direct your concerns to me. I accept donations of forgiveness.

  But watching Theo and Ada together over the last few years, I've realized something important. And I want to be careful how I say this, because I know half this room speaks "philosophy" and the other half speaks "family."

  Theo and Ada see the world differently. Theo is focused on animals; Ada is focused on human health and the long-term future. If you listen to them debate, it sounds intense. They argue about where help is needed most. They argue about numbers, and scale, and urgency. In any other relationship, this kind of fundamental disagreement about what matters most in life could be a wedge. It could be a source of resentment.

  But with them, it's become a source of strength.

  There's a concept some of our friends here will recognize. It's often called "moral trade." But that sounds cold. It sounds like a business deal. *I'll scratch your back if you scratch mine.* That is not what this is.

  What Theo and Ada do is much more beautiful. They have learned that loving someone means letting their values take up space in your life, even when they don't perfectly align with your own.

  Theo went vegan. Now, for Theo, that's a relatively easy change. But he did it because it matters deeply to Ada. He made a small cost to himself to grant her a huge peace of mind. And Ada, in turn, directs a significant portion of her giving to global health causes. Not because she thinks animal welfare is worthless, but because she knows how much it burns in Theo's chest. She supports his mission because she supports *him*.

  To our family here: This isn't a transaction. It's a translation. They are translating their love into a language the other person understands.

  To our EA friends: They aren't just maximizing utility; they are minimizing the distance between their hearts.

  I think this is the secret. We often think marriage is about finding someone who agrees with you on everything. Who votes the same, prays the same, and worries about the same things. But Theo and Ada show us that marriage is actually about finding someone whose disagreements you can hold with gentleness.

  It's easy to love someone when you want the exact same future. It is much harder, and much braver, to love someone when you are trying to save different parts of the world, yet you still choose to build one life together.

  They don't try to win the arguments anymore. They've realized that the only thing that needs to be optimized is their kindness toward each other. They've figured out that the most effective altruism starts at the dinner table. It starts with saying, "What matters to you, matters to me, because you matter to me."

  So, if I taught Theo to care about doing good, then Ada taught him that doing good includes being good to the person standing right next to you.

  Theo, Ada: May your arguments be lively, may your compromises be generous, and may you always remember that the best cause you can prioritize is each other.

  To the happy couple.
