      *   *The Method:* Newton believed in a "prisca sapientia" (ancient wisdom) given by God to Noah/Moses, corrupted over time, but recoverable.
      *   *Continuity:* Scholars (like Betty Jo Teeter Dobbs, Stephen Snobelen, Rob Iliffe) argue strongly for continuity between his science and his theology. He wasn't "switching hats"; he was applying the same empirical/inductive reasoning to different data sets.
      *   *The "Code":* He didn't see it as arbitrary allegory. He saw it as a *language* designed by God. If nature has laws, revelation has grammar.

  3.  **Synthesize the Answer:**

      *   **Direct Answer:** It's the latter. It *is* science to him. There is deep continuity.
      *   **Key Concept 1: The Unity of Truth.** God wrote two books: Nature (*Principia*) and Scripture (Prophecy). Both come from the same Author, so both must be consistent, rational, and decipherable.
      *   **Key Concept 2: Inductive Reasoning.** Newton hated hypotheses ("Hypotheses non fingo"). In theology, he didn't want mystical intuition; he wanted to gather "data" (verses), find patterns, and derive rules (like the Sun/King rule). The quoted passage *is* the derivation of a law.
      *   **Key Concept 3: The "World Politic" as a System.** Just as gravity governs the physical world, divine providence governs history. The symbols aren't poetic; they are technical terms in a divine language.
