answer: |-
  This is a fantastic question, and it cuts to the very heart of the modern struggle to understand Newton. To a 21st-century reader, the *Principia* and the *Observations upon the Prophecies* look like they were written by two different people: one a rationalist genius, the other a mystic obsessive.

  But to answer your core question: **No, they are not separate people.** In Newton's mind, there is a profound, unbroken continuity of method between the *Principia* and the Prophecies. He is not doing "allegorical exegesis" in the literary or theological sense; he is doing **cryptanalysis.**

  Here is how you can get inside his head for the novel, specifically regarding that passage and his mindset in the 1690s.

  ### 1. The Two Books of God
  To understand Newton, you have to understand his fundamental axiom: **God is rational.**

  Newton believed God wrote two books:
  1.  **The Book of Nature:** The physical universe (studied via physics/math).
  2.  **The Book of Scripture:** Divine revelation (studied via prophecy/chronology).

  Since both books were written by the same Author, they must follow the same rules of consistency, logic, and design. You wouldn't expect God to be sloppy in physics, so why would He be sloppy in prophecy?

  When Newton writes that passage about the Sun being Kings and the Moon being the Common People, he does not view this as poetic metaphor. He views it as **defining terms.** Just as he had to define *vis inertiae* (force of inertia) before he could calculate motion, he has to define "Sun" and "Moon" before he can calculate history. He is building a lexicon for a divine language.

  ### 2. "Hypotheses Non Fingo" Applies to the Bible, Too
  You likely know his famous phrase from the *Principia*: *"Hypotheses non fingo"* (I frame no hypotheses). He hated guessing. He wanted to derive laws from phenomena.

  He applies this exact same empiricism to the Bible.
  *   **The Data:** The verses of Daniel and Revelation.
  *   **The Pattern:** He notices that whenever "Sun" appears in a specific context, "King" is the subject of the action.
  *   **The Law:** Therefore, Sun = King.

  In the 1690s, he isn't "interpreting" scripture in the way a priest does (seeking spiritual edification). He is **decoding** it. He believes the prophets spoke in a specific, technical cipher that was understood by the initiates of the ancient priesthood but lost to the modern corrupt church.

  When you write him, don't have him sound mystical, dreamy, or "inspired." Have him sound **frustrated by sloppy code-breaking.** He should sound like a man cleaning up a mess left by idiots. To him, the Trinity (which he secretly hated as idolatrous) was a corruption of the original data, just as bad astronomy was a corruption of the data of the stars.

  ### 3. The "World Politic" as a Physical System
  The passage you quoted hinges on the analogy between the "world natural" and the "world politic."

  For Newton, this isn't just a simile. It's an ontological claim. The structure of the heavens *is* the structure of authority.
  *   **Gravity** holds the physical solar system together.
  *   **Providence** holds the political solar system together.

  When the prophets talk about stars falling, they aren't describing astronomy; they are describing regime change. But crucially, Newton believes this happens with the same inevitability as a planet leaving its orbit. History has laws. If you can crack the code, you can predict the future just as accurately as you can predict the return of a comet.

  In the 1690s, Newton was deeply anxious about the state of the world. He believed he was living in the "End Times" (specifically looking at dates around 1800 and beyond). Decoding these prophecies wasn't an academic hobby; it was a way to map the timeline of God's judgment on a corrupt world.

  ### 4. The Stakes: Heresy and Secrecy
  This is crucial for your novel's tension. In the 1690s, Newton is Lucasian Professor at Cambridge. To hold that chair, he had to be ordained in the Church of England.

  **Newton was an Arian.** He did not believe in the Trinity. He believed Christ was a created being, subordinate to the Father. This was heresy. If it had come out, he would have been stripped of his position, ruined socially, and possibly imprisoned.

  This context changes how he writes those manuscripts.
  *   **The Tone:** It is cautious, dense, and circular. He often writes in code or leaves gaps.
  *   **The Motivation:** He is trying to prove that the "corruption" of the Church (the Trinity) was predicted in Daniel. He is using prophecy to vindicate his own heresy. He believes *he* is the one restoring the "ancient truth" that was lost.

  ### 5. Character Notes for the Novelist
  Here are a few specific ways to translate this into character voice and action:

  *   **He is a Detective, not a Mystic:** When he looks at a verse, he shouldn't look like he's praying. He should look like he's cross-referencing ledgers. He compares verses like he compares experimental data points. If two verses contradict, one must be a copyist error or a corruption. He "fixes" the Bible text to make the math work.
  *   **The "Noise" vs. "Signal":** He views the history of the Church as static interference. The Roman Catholic Church, the Trinity, the idolatry—it's all noise obscuring the true signal of the Prophets. His work is filtering.
  *   **Confidence:** That "flat confidence" you noticed in the passage is key. He doesn't say, "It might mean this." He says, "In sacred Prophecy... the Sun *is* put for the whole species." He has derived a law. He is as sure of this as he is of gravity.
  *   **The Physicality:** In the 1690s, he is often working late, surrounded by piles of manuscripts. He is prone to digestive issues, insomnia, and mercury poisoning (from alchemy). The line between his alchemical lab and his theological desk is thin. Both involve fire, purification, and searching for the hidden "spirit" within the matter/text.
  *   **Dialogue Tip:** If he speaks about this to a confidant (like Fatio de Duillier, if you include him), he shouldn't use religious language. He should use legal or mechanical language. "The text is corrupted here." "The analogy does not hold." "We must establish the rule before we can apply it."

  ### Recommended Reading for Texture
  If you want to deepen this specific voice, I highly recommend looking at the work of **Rob Iliffe** (specifically *Priest of Nature: The Religious Worlds of Isaac Newton*) and **Stephen Snobelen**. They are the leading scholars on Newton's manuscripts (the "Newton Project").

  Iliffe describes Newton's theology not as a retreat from science, but as an extension of it. He notes that Newton believed the corruption of doctrine was analogous to the corruption of nature after the Fall. Restoring true religion was a restorative act of natural philosophy.

  **Summary for your draft:**
  The Newton writing that passage is the *same* Newton who wrote the *Principia*. He is applying the rigorous, inductive method of the new science to the text of the Bible. He believes he has found the grammar of God's language. He is not guessing; he is calculating. And he is doing it in secret, knowing that if the wrong people read his "calculations," his life is over.

  That tension—the cold, hard certainty of the method vs. the dangerous, heretical content—is where the gold is for your novel.
