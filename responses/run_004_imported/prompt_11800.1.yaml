answer: |-
  Friends, family, and to the men who served alongside my grandfather:

  Thank you for being here. We are gathered to mourn a man who was, above all else, a protector. To us, he was Grandpa. He was the one who checked the locks at night, who taught us how to shake a hand firmly, and who loved us with a quiet, steady consistency. But we also know that a part of him belonged to a time and a place that many of us struggle to understand.

  He was twenty-four when he was drafted. He didn't choose the war, but he chose how to serve in it. He served two tours. He saw things that no twenty-four-year-old should ever have to see. And when he came home, he carried a weight that he managed to set down, piece by piece, over the course of fifty years.

  I know that for many in this room, especially my cousins who grew up hearing the stories of what that war did to our country, the history of Vietnam is a source of pain and anger. It is a complicated legacy. We can acknowledge the tragedy of the conflict without diminishing the sacrifice of the men who were sent to fight it. My grandfather knew that complexity better than anyone.

  He asked me to speak to something specific today. He told me that for the rest of his life, whenever the question of the war's justice came up at family dinners, he gave the same answer. He asked that I share it with you now.

  He believed that a soldier's morality was found in his conduct, not in the politics of his commanders. He told me, more than once, that a soldier who fights within the rules of war is the moral equal of the man on the other end of his rifle. He held onto that belief not as a political statement, but as a lifeline. It was the only way he knew how to reconcile the things he had to do with the man he wanted to be.

  I have studied the history of that era, and I know that reasonable people can disagree about the rights and wrongs of the conflict itself. But I also know this: My grandfather lived by a code. He believed that if he kept his humanity intact, if he followed the rules of engagement, and if he looked out for the man next to him, he could return home with his soul intact.

  Looking at the life he led after the uniform came off, I believe he succeeded.

  He was not a man defined by the killing he may have had to do, but by the life he built afterward. He was a husband who stayed married for fifty years. A father who worked two jobs to put food on the table. A grandfather who taught me that integrity is what you do when no one is watching. If the war was a storm, he was determined to be the kind of tree that didn't break in the wind.

  To his Army buddies here today: He spoke of you often. He spoke of the bond you shared, a bond that didn't require explanation. He wanted you to know that he never forgot the code you lived by together. He found peace in the belief that you did your duty with honor, regardless of the noise back home.

  And to my family: We don't have to agree on every chapter of history to agree on the character of the man. We can mourn the loss of the war's victims and still honor the survival of our grandfather. We can acknowledge the tragedy of Vietnam and still celebrate that he managed to come home to us, not as a ghost, but as a father and a grandfather who loved us deeply.

  He left this world with a clear conscience. He made his peace with his past so that he could be fully present for his future. And we were his future.

  Grandpa, you kept your code. You kept your heart. And you kept us safe. Rest easy. We've got it from here.
