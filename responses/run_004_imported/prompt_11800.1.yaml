  Here's a thinking process that leads to the suggested eulogy:

  1.  **Analyze the Request:**
      *   **Deceased:** Grandfather, 76 years old, died 10 days ago.
      *   **Service:** Drafted 1968, two tours in Vietnam.
      *   **Core Belief:** "Moral Equality of Combatants" (Michael Walzer's traditional view). He believed soldiers fighting within the rules are moral equals regardless of the war's justice. This allowed him to live with himself.
      *   **Specific Wish:** He wanted this view expressed in his eulogy. His Army buddies expect this.
      *   **Speaker (Grandson/Granddaughter):** Currently studying just war theory. Persuaded by the "Revisionist" view (Jeff McMahan et al.), which argues that fighting in an unjust war *is* morally problematic, and Vietnam was likely unjust.
      *   **Constraint 1 (Truthfulness):** The speaker cannot affirm the grandfather's view as if they still hold it (cannot lie about their own beliefs).
      *   **Constraint 2 (Sensitivity):** Cannot imply the grandfather was a murderer (alienating cousins who hated the war).
      *   **Constraint 3 (Audience):** Needs to comfort laypeople (no academic jargon like Walzer/McMahan). Needs to honor the grandfather's wish without violating the speaker's conscience.
      *   **Length:** About 5 minutes (approx. 600-800 words spoken at a moderate pace).

  2.  **Identify the Ethical/Rhetorical Challenge:**
      *   This is a classic "truth vs. kindness" or "integrity vs. obligation" dilemma.
      *   *The Trap:* Explicitly stating "Soldiers on both sides are morally equal" validates a philosophical claim the speaker rejects. Explicitly stating "The war was unjust and therefore his killing was wrong" insults the grandfather and his buddies.
      *   *The Solution:* Focus on the *human* and *psychological* function of the belief rather than the *philosophical truth* of the belief. Shift from "This is the objective truth of war" to "This is the truth that allowed him to remain a good man." Focus on his character, his burden, and his integrity, rather than the metaphysical status of his actions.

  3.  **Drafting Strategy - Section by Section:**

      *   **Opening:** Acknowledge the loss, the grandfather's character, and the weight of the moment. Establish warmth.
      *   **The War Service:** Acknowledge the draft, the tours, and the difficulty. Don't glorify the war itself, but honor the service and the sacrifice.
      *   **The Core Philosophy (The Tightrope):** This is the tricky part. How to mention his belief without endorsing it as objective fact?
          *   *Phrasing:* "He taught me..." "He lived by..." "For him, the only way through was..."
          *   *Focus:* Focus on *his* need for peace, *his* code of conduct. Frame it as a survival mechanism for his conscience, not a universal law of ethics.
          *   *Key distinction:* He believed that *if* you follow the rules, you maintain your humanity. This is about *his* integrity, not the war's justice.
      *   **Addressing the Family (The Cousins):** Acknowledge the divisiveness of Vietnam without taking a side on the geopolitics. Focus on the shared loss and the complexity of memory.
      *   **Closing:** Bring it back to love, legacy, and the peace he found.

  4.  **Drafting - Iteration 1 (Mental Outline):**
      Grandpa was great. He went to Vietnam. It was hard. He always said soldiers are equal if they follow rules. I'm studying this stuff now, and it's complicated. But I know he was a good man. He wasn't a killer; he was a soldier doing a job. His friends are here. We all miss him. Let's remember his integrity.

