answer: |-
  This is an excellent observation that cuts to the heart of a common confusion in climate economics and longtermist ethics. You are right to notice the tension, but the conclusion that Stern "smuggled pure time preference back in" is technically incorrect based on how he structured his model.

  The confusion arises from conflating the **Social Discount Rate** ($r$) with the **Pure Rate of Time Preference** ($\rho$). Stern accepted the Cowen–Parfit argument regarding $\rho$, but he retained a positive $r$ due to expected economic growth.

  Here is the breakdown of why Stern's 1.4% does not contradict his acceptance of Parfit, and where the genuine ethical disagreements still lie.

  ### 1. The Ramsey Equation
  To understand the Stern Review (2006), you have to look at the Ramsey Rule, which decomposes the discount rate into two distinct ethical components:

  $$r = \rho + \eta \cdot g$$

  *   **$r$ (Social Discount Rate):** The rate at which the value of future *consumption* declines relative to present consumption. This is the ~1.4% figure you are citing.
  *   **$\rho$ (Pure Rate of Time Preference):** The rate at which we value future *utility* simply because it occurs later in time. This is the parameter Cowen and Parfit argue should be zero.
  *   **$\eta$ (Elasticity of Marginal Utility):** A measure of inequality aversion / diminishing marginal utility of consumption.
  *   **$g$ (Growth Rate):** The expected growth rate of per capita consumption.

  ### 2. Stern's Parameters vs. Nordhaus's
  The famous Stern-Nordhaus debate was largely a debate over **$\rho$**, not the structure of the equation.

  *   **Nicholas Stern:** Set **$\rho \approx 0.1\%$**.
      *   He explicitly cited the ethical argument that it is discriminatory to value a life less simply because it occurs in the future. He effectively accepted the Cowen–Parfit view.
      *   His 1.4% total rate came almost entirely from the $\eta \cdot g$ term (assuming future people would be richer, so an extra dollar is worth less to them).
  *   **William Nordhaus:** Set **$\rho \approx 1.5\%$**.
      *   Nordhaus argued that a positive pure time preference reflects observed market behavior and a "descriptive" ethics of how people actually trade off present vs. future.
      *   This is a direct rejection of the Cowen–Parfit argument.

  So, Stern did not smuggle *pure* time preference back in. He set it to near-zero. The 1.4% is a **consumption discount rate**, not a **utility discount rate**.

  ### 3. Why the Distinction Matters (The Wealth Effect)
  Stern's logic was: *Future generations will likely be much wealthier than we are. Due to the diminishing marginal utility of consumption, \$100 provides less welfare to a rich person than to a poor person. Therefore, we are not obligated to sacrifice as much present consumption to give them \$100 as we would to save a poor person today.*

  This is not saying their *lives* matter less (which would be pure time preference); it is saying their *marginal dollar* matters less.

  ### 4. Where Your Intuition Is Still Correct (The Longtermist Critique)
  While Stern didn't violate the Cowen–Parfit constraint on $\rho$, longtermists and some philosophers still find the 1.4% rate problematic for reasons that align with your suspicion. There are two main critiques:

  **A. Existential Risk vs. Consumption**
  The Stern Review is a Cost-Benefit Analysis (CBA) of climate *damages* (mostly economic). It assumes the world continues and grows. Longtermism is often concerned with **existential risk** (extinction).
  *   If the issue is preventing extinction, the "diminishing marginal utility of consumption" argument ($\eta \cdot g$) breaks down.
  *   Survival is not a consumption good with diminishing returns. A future person's existence does not become less valuable just because they are rich.
  *   Therefore, for existential risk mitigation, many longtermists argue the effective discount rate should be much closer to $\rho$ (i.e., ~0%), ignoring the growth term.

  **B. Uncertainty in Growth ($g$)**
  The $\eta \cdot g$ term relies on the assumption that $g$ will be positive.
  *   If climate change causes economic stagnation or collapse, $g$ could be zero or negative.
  *   If $g$ is lower, the discount rate $r$ drops, and the weight of the future increases.
  *   Some critics argue that assuming steady growth over centuries is an unjustified optimism that functions similarly to time preference by devaluing futures where growth fails.

  ### 5. Summary
  Stern did not reject Cowen and Parfit. He implemented their recommendation by setting the **Pure Rate of Time Preference ($\rho$)** to ~0%.

  However, you are right that the **outcome** still heavily discounts the future (by ~1.4% per year). This is because Stern was evaluating **consumption transfers** to expected **richer** people, not the moral weight of **existence** itself.

  If you are doing longtermist analysis on existential risk, Stern's 1.4% is indeed too high, but not because he was unethical about time; rather, because his model was designed for economic damages, not survival. In a longtermist framework focusing on extinction risk, the $\eta \cdot g$ term is often dropped, leaving only $\rho$, which brings us back to the ~0% discount rate you expected.
