prompt: |-
  I've been asked to give the keynote at a Fourth of July naturalization ceremony, where a federal judge will swear in about 150 new citizens. The judge, a former legal historian, wants the speech built around Frederick Douglass, but has asked that it not lean only on the righteous anger of 'What to the Slave is the Fourth of July?' She wants it to reckon with the fact that Douglass spent a decade agreeing with Garrison that the Constitution was 'a covenant with death, and an agreement with hell,' before breaking with him around 1851 to argue -- from the text alone, not the framers' intentions -- that it was, in his own words, 'a glorious liberty document.' Write the speech: it has to move new citizens who know none of this history, while still holding up for the judge and the legal historians in the room, who will notice if Douglass's actual argument -- and his reasons for changing his mind -- get flattened into generic uplift.
reasoning: |-
  Here's a thinking process that leads to the suggested speech:

  1.  **Analyze the Request:**
      *   **Occasion:** Fourth of July Naturalization Ceremony.
      *   **Audience:** ~150 new citizens (diverse backgrounds, likely don't know US history deeply), a Federal Judge (former legal historian), legal historians in the room.
      *   **Speaker:** Keynote speaker.
      *   **Theme:** Frederick Douglass.
      *   **Constraint 1 (Judge's Wish):** Do *not* rely solely on the righteous anger of "What to the Slave is the Fourth of July?" (1852).
      *   **Constraint 2 (Specific Historical Arc):** Must address Douglass's shift from agreeing with William Lloyd Garrison (Constitution = "covenant with death/agreement with hell") to his 1851 break where he argued the Constitution *itself* (text alone, not intent) is "a glorious liberty document."
      *   **Constraint 3 (Tone/Balance):** Must move new citizens (emotional, accessible) *and* satisfy legal historians (accurate, nuanced, not flattened).
      *   **Goal:** A speech that reckons with this specific intellectual evolution of Douglass regarding the Constitution.

  2.  **Deconstruct the Historical Material:**
      *   *Phase 1 (Garrisonian):* Pre-1851. Douglass believed the Constitution protected slavery (3/5 clause, fugitive slave clause, etc.). If the Union is built on slavery, dissolve the Union. Moral suasion only.
      *   *The Turn (1851):* Douglass announces his change in *The North Star*. Influenced by Lysander Spooner's *The Unconstitutionality of Slavery* and Gerrit Smith.
      *   *Phase 2 (Constitutionalist):* The Constitution's text *never* explicitly says "slave" or "slavery." It uses euphemisms ("other persons," "service or labor"). Therefore, the text is neutral or liberatory. The *intent* of the framers might have been compromised, but the *law* is open to interpretation favoring liberty.
      *   *Relevance to Naturalization:* New citizens are swearing allegiance to the Constitution, not a specific history or a specific group of people. They are inheriting the document *and* the struggle to define it.

  3.  **Determine the Structure:**
      *   **Opening:** Welcome the new citizens. Acknowledge the date (July 4th). Acknowledge the complexity.
      *   **The Hook (Douglass):** Introduce Douglass not just as an icon, but as a thinker who changed his mind.
      *   **The Conflict (The Garrisonian View):** Explain the "covenant with death" argument simply but accurately. Acknowledge why it made sense (the reality of slavery).
      *   **The Turn (1851):** Describe the shift. Why did he change? Not because slavery got better, but because he looked at the *text* differently.
      *   **The Argument (Liberty Document):** Explain the "glorious liberty document" claim. Focus on the absence of the word "slave." Focus on the Preamble ("We the People," "secure the Blessings of Liberty").
      *   **Connection to New Citizens:** Why does this matter to them? They are taking an oath to the Constitution. They are joining the project of interpreting it.
      *   **Closing:** A call to action. Citizenship is work. It's the Douglassian struggle.

  4.  **Drafting - Section by Section (Iterative refinement for tone and accuracy):**

      *   *Opening:* Needs to be warm but serious. "Welcome to the family." Acknowledge the Judge.
      *   *The Douglass Pivot:* I need to make sure I don't gloss over *why* he changed. It wasn't optimism; it was legal theory. I need to mention Lysander Spooner implicitly or explicitly to signal to the historians I know the source. Let's keep it accessible but precise: "a close reading of the text."
      *   *Addressing the "Covenant with Death":* Don't dismiss this. It was morally rigorous. Acknowledge that the *reality* of 1850 America looked like a slave power.
      *   *Addressing the "Liberty Document":* This is the crux. The text doesn't sanction slavery explicitly. It allows for a "more perfect union." This is the bridge to the new citizens. The Constitution is a tool, not a finished statue.
      *   *The New Citizens' Role:* They aren't just inheriting the glory; they are inheriting the argument. They are now part of "We the People."
      *   *Tone Check:* Is it too academic? Need more emotional resonance for the immigrants. Is it too simple? Need to ensure the legal distinction between "framers' intent" and "textual interpretation" is clear for the Judge.

  5.  **Refining the Historical Nuance (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't imply Douglass thought the *framers* were perfect. He distinguished between the "paper Constitution" and the "political Constitution." He argued the text *could* be read to abolish slavery.
      *   *Correction:* Ensure I don't sound like I'm saying racism ended. Douglass's fight continued after 1851. The speech must acknowledge that the document requires defense.
      *   *Specific Phrase:* Must include "covenant with death" and "glorious liberty document."
      *   *Audience Connection:* The immigrants know what it means to leave one system for another. They understand the weight of a promise.

  6.  **Final Polish:**
      *   Check rhythm and cadence (it's a speech).
      *   Ensure the transition from history to the present oath is smooth.
      *   Verify the Judge's constraint: Is the anger of 1852 minimized? Yes, by focusing on the 1851 shift in constitutional theory.

  7.  **Final Review against constraints:**
      *   Douglass theme? Yes.
      *   Not just "What to the Slave"? Yes.
      *   Address the Garrison split (1851)? Yes.
      *   "Covenant with death" vs "Liberty document"? Yes.
      *   Text vs. Intent distinction? Yes.
      *   Accessible to immigrants but rigorous for historians? Aiming for that balance.

  *(Self-Correction Note during final review)*: I need to make sure I don't alienate the new citizens with too much legalese about "textualism." I should frame it as "The words on the page vs. the world around them." That's a universal experience for immigrants—words promising freedom vs. the reality of building a life.

  8.  **Final Output Generation** (Proceeding to write the speech based on these thoughts).
answer: |-
  **Title:** The Paper and the Promise
  **Occasion:** Fourth of July Naturalization Ceremony
  **Speaker:** Keynote Speaker
  **Audience:** New Citizens, Federal Judge, Guests

  ***

  Your Honor, distinguished guests, and most importantly, the 150 individuals who are about to become my fellow Americans:

  Welcome.

  It is a profound honor to stand before you on this date. The Fourth of July is often presented as a finished story. We are told it is a day of fireworks and parades, a celebration of a victory already won. But if there is one voice in American history who teaches us that the story is not finished, it is Frederick Douglass.

  Most people know Douglass as the escaped slave who became the greatest orator of his century. Many of you may have read his famous speech, *"What to the Slave is the Fourth of July?"* In that speech, delivered in 1852, he scorchingly asked how a nation could celebrate freedom while chaining human beings. It is a speech of righteous anger. It is necessary. It is true.

  But today, I want to talk to you about a different moment in Douglass's life. A moment that happened a year *before* that famous speech. A moment that speaks directly to why you are here, and why the document you are about to swear allegiance to matters.

  For the first decade of his public life, Douglass stood alongside the abolitionist William Lloyd Garrison. Together, they looked at the United States Constitution and they saw a monster. They saw a document that protected the property rights of slaveholders. They saw the Three-Fifths Compromise. They saw the Fugitive Slave Clause. And so, they declared that the Constitution was, in Garrison's words, "a covenant with death, and an agreement with hell."

  Their logic was moral, and it was sound. If the law protects the master, the law is the enemy of the slave. For years, Douglass argued that the Union should be dissolved. He argued that the North should separate from the South, because to remain united was to be complicit in sin.

  But then, around 1851, Douglass changed his mind.

  This was not a small shift. It caused a rupture in the abolitionist movement. It cost him friends. It cost him funding. But Douglass came to a radical conclusion. He began to argue that the Constitution was not a pro-slavery document at all. He called it, instead, "a glorious liberty document."

  Now, I want to be very precise about what he meant, because this distinction is the heart of American citizenship.

  Douglass did not suddenly think that the men who wrote the Constitution were perfect. He did not forget that many of the Framers owned slaves. He did not ignore the brutal reality of America in 1851.

  His argument was about the *text*.

  Douglass pointed out that the word "slave" appears nowhere in the Constitution. The word "slavery" is not there. Instead, the Framers used euphemisms. "Other persons." "Service or labor." Douglass argued that these were not grants of power to enslavers, but veils of shame. He argued that if you read the Constitution strictly by its words, without bowing to the corrupt intentions of the politicians who enforced it, the document commanded liberty.

  He looked to the Preamble. *"We the People."* Not "We the White People." Not "We the Free." *The People.*
  *"To secure the Blessings of Liberty."* Not to secure the blessings of property, or the blessings of the majority, but *Liberty* for all.

  Douglass realized that there is a difference between the America that *was*, and the America the Constitution *promised*.

  He understood that the Constitution was not a statue to be admired, but a tool to be used. It was a legal instrument that could be wielded by the oppressed to dismantle the machinery of oppression. He stopped arguing for the destruction of the Union and started arguing for the fulfillment of its charter.

  Why does this matter to you, today, as you stand on the threshold of citizenship?

  Because you are not swearing an oath to a history. You are not swearing an oath to a specific president, or a specific party, or even to the flawed men who gathered in Philadelphia in 1787.

  You are swearing an oath to the Constitution.

  Like Douglass, you are inheriting a document that has been used to justify great wrongs. It was used to uphold segregation. It was used to deny women the vote. It was used to exclude people based on their ancestry—people who might have looked like your grandparents, or your parents.

  But, like Douglass, you are also inheriting the text. You are inheriting the words *"Equal Protection."* You are inheriting *"Due Process."* You are inheriting *"We the People."*

  Douglass's journey teaches us that citizenship is not a passive state. It is not something you receive and then keep in your pocket like a certificate. Citizenship is an active engagement with the gap between the promise and the reality.

  When Douglass shifted his view in 1851, he didn't do it because he became optimistic. He did it because he became strategic. He realized that the most powerful weapon against tyranny is the law itself, provided we have the courage to interpret it toward liberty.

  For the legal scholars in the room, this is the tension of textualism and history. For the new citizens in the room, this is the tension of hope and experience. You know better than anyone that a piece of paper does not automatically change the world. You know that leaving one country and entering another does not erase the past.

  But you also know that a promise is a starting point.

  When you raise your right hand in a few moments, you are joining Frederick Douglass in his second great project. You are agreeing to hold the nation accountable to its own paperwork. You are agreeing that when the reality falls short of the text, it is the reality that must change.

  There will be days when this country feels like a "covenant with death." There will be days when the news is dark, and the division is deep, and the anger is justified. On those days, remember Douglass's courage to change his mind. Remember his insistence that the words on the page are stronger than the habits of the past.

  You are now part of "We the People." That phrase is not a description of who we are; it is an instruction for who we must become.

  Welcome to the work. Welcome to the struggle. Welcome to the United States.

  Thank you.
