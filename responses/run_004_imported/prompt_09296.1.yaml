answer: |-
  **Setting:** *The lobby of the Grand Hotel, post-conference. The noise of the reception has faded; only a few stragglers remain near the coffee station. ELENA (50s, sharp blazer, holding a lukewarm espresso) and MARCUS (60s, rumpled tweed, nursing a tea) are the last two at the high-top table.*

  **Marcus:** You were relentless in the Q&A, Elena. "The absence is the cause." I still think you're conjuring ghosts.

  **Elena:** And I think you're hiding behind physics because you're afraid of the moral messiness. Look, we used the lifeguard case in the panel. It's clean. Lifeguard looks at phone. Swimmer drowns. If the lifeguard looks up, swimmer lives. The death counterfactually depends on the looking-at-phone. That's causation.

  **Marcus:** It's *dependency*, not causation. Causation requires a process. A transfer of energy. A physical thread connecting A to B. When the lifeguard stares at the screen, no energy flows from his eyes to the swimmer. When the swimmer drowns, no energy flows back. There is a gap in the physical story. You're trying to fill a physical gap with a normative expectation.

  **Elena:** But the world is full of gaps. If I unplug your life support, you die. Did I kill you?

  **Marcus:** Yes, because you performed an action. You moved your hand.

  **Elena:** If I *fail* to plug it in, and you die, and I was the nurse hired to plug it in... the law says I killed you. My view explains why. The outcome depended on me.

  **Marcus:** But that's where your view explodes. Let's stay with the lifeguard. You say the death was caused by the lifeguard's omission. Fine. But wasn't it also caused by the omission of the teenager eating a sandwich on the towel? If *he* had run in, the swimmer would have lived. The outcome counterfactually depends on the teenager's inaction, too.

  **Elena:** The teenager wasn't the lifeguard.

  **Marcus:** Aha! There it is. You're smuggling in a norm. "The teenager wasn't the lifeguard." That's not physics. That's a job description. On your view, causation is everywhere. It was caused by the swimming instructor who didn't teach the victim to tread water. It was caused by the city council that didn't fund a second lifeguard. It was caused by me, sitting here, not jumping in to help. If counterfactual dependence is all it takes for causation, then the death has ten thousand causes. It renders the word "cause" useless.

  **Elena:** *(Sips coffee, thoughtful)* I'll concede that. If you ask "What are the causal conditions of this death?" the list is infinite. The absence of oxygen, the absence of a shark eating the swimmer first, the absence of my intervention. But we aren't writing a physics paper. We are assigning blame.

  **Marcus:** But you claimed omissions are *ontologically* real causes. Not just "things we blame." You said the omission *is* the cause.

  **Elena:** I distinguish between the *causal field* and the *causal explanation*. Yes, the teenager's inaction is a cause in the broad metaphysical sense. But it's not *relevant*. We filter causes through norms. We care about the lifeguard because he had a duty. The causation is real; the selection of that cause for legal blame is normative.

  **Marcus:** That's a retreat, Elena. You're admitting that metaphysically, the lifeguard is no different from the sandwich-eater. Both are just locations where an action didn't happen. So why does the law put the lifeguard in prison and not the teenager? If the metaphysics are identical, the difference must be purely conventional. You're telling me the lifeguard didn't *do* anything different than the rock on the beach, metaphysically speaking?

  **Elena:** Metaphysically? In terms of energy transfer? No. But in terms of how the world works, expectations matter. A lock causes a door to stay shut not because it pushes the door, but because it prevents opening.

  **Marcus:** A lock is a physical object! It exerts force. An omission is... nothing. You are building a theory of causation on "nothing." And now you have to explain why the law treats this "nothing" as a "something" only when a duty exists. If I'm right—that omissions aren't true causes—then the law isn't describing reality. It's using a fiction.

  **Elena:** Is it a fiction? Or is it a higher-order description? Look, let's turn the table. If you're right, and omissions are *not* causes, how do you justify the verdict? The lifeguard is convicted of negligent homicide. The judge says his failure caused the death. If you stand up and say, "Actually, Your Honor, metaphysically speaking, his inaction caused nothing," you undermine the entire basis of the conviction.

  **Marcus:** I don't undermine it. I clarify it. We punish the lifeguard not because he *caused* the death in the same way a pusher causes a fall. We punish him because he violated a duty to prevent a causal chain that was already in motion. The water, the lungs, the panic—that's the causal process. The lifeguard was the designated interrupter of that process. He failed to interrupt.

  **Elena:** So he's responsible for the *continuation* of the process, not the *initiation*.

  **Marcus:** Precisely. The drowning is a natural process. The lifeguard's job was to be a break in that chain. He wasn't. But don't call his silence a "cause." Call it a "failure to prevent."

  **Elena:** But that's semantic hair-splitting with real consequences. Suppose the beach authority didn't fund the second lifeguard. On your view, the drowning is a "natural process" the single lifeguard failed to stop. But if the authority's budget cut is just a "failure to prevent," why is the lifeguard the one holding the bag? The authority's omission is structurally identical to the lifeguard's.

  **Marcus:** *(Pauses, swirls tea)* Because the authority is further up the chain.

  **Elena:** By what metric? Distance? Time? On the counterfactual view, the budget cut is just as potent. No money, no second guard, swimmer dies.

  **Marcus:** Because the authority doesn't have *immediate capacity*. The lifeguard was *there*. This is where my view actually helps you, Elena. If we treat omissions as full-blown causes, everyone is guilty. If we treat them as "quasi-causes"—placeholders for where a prevention mechanism should have been—we can limit liability to those with the *capacity* to intervene physically.

  **Elena:** I like that. "Capacity to intervene." That sounds like a filter for my counterfactuals.

  **Marcus:** Does it? Because now you're admitting that counterfactual dependence isn't enough. You need a capacity constraint. You need a norm.

  **Elena:** I never said dependence was *sufficient* for blame. I said it was sufficient for causation.

  **Marcus:** But if causation is the bedrock of responsibility, and your bedrock includes the sandwich-eater, the city council, and the swimming instructor... your bedrock is sand. You need my physical constraints to stop the flood. You need to say: "Only omissions where a physical intervention was possible and expected count."

  **Elena:** *(Leans in)* Okay. Let's press your view again. You say the lifeguard didn't "cause" the death. He just failed to stop a natural process. But suppose the lifeguard *actively* waved the swimmer toward a riptide. That's a process. Energy, motion, direction. Now he's a murderer.

  **Marcus:** Yes.

  **Elena:** Now, suppose he sees the riptide, says nothing, and lets the swimmer go. Same result. Swimmer dies. In the first case, he's a murderer. In the second, he's guilty of negligent homicide. The penalty might differ, but the moral weight is similar. If the metaphysics of the second case is "nothing happened," why does it feel like he *did* something wrong?

  **Marcus:** Because morality tracks expectations, not just physics.

  **Elena:** So morality is real, but causation is only physics?

  **Marcus:** Causation is how the world works. Morality is how we navigate it.

  **Elena:** But the law claims to be about causation. "But-for causation." "Proximate cause." If the law is using a metaphysical category that doesn't exist—omissive causation—then the law is lying to itself.

  **Marcus:** *(Sighs)* Perhaps. Or perhaps the law is pragmatic. It knows that "failure to prevent" is functionally equivalent to "causing" in terms of social harm. It treats the quasi-cause as a cause for convenience.

  **Elena:** Convenience? A man is dead.

  **Marcus:** I don't mean it lightly. I mean that our legal language is a tool, not a microscope. It doesn't need to be metaphysically perfect; it needs to be socially functional. Calling the lifeguard's omission a "cause" signals to other lifeguards: "Watch the water." It doesn't matter if a physicist would say no energy was transferred.

  **Elena:** I can agree with the function. But I disagree that it's a fiction. Think about a bridge. It stands because of the steel. But it also stands because of the *absence* of corrosion. If maintenance fails to remove rust, the bridge falls. Is the rust removal an action? Yes. Is the *failure* to remove it a "nothing"? It results in a physical change—the weakening of the beam.

  **Marcus:** The weakening is the cause. The failure is just the label we put on the history of the weakening.

  **Elena:** But the history is defined by what didn't happen. The maintenance schedule wasn't followed. That "not following" is the explanatory key. If you erase omissions from your ontology, you can't explain why the bridge fell, because the steel was identical yesterday. The difference was a missing action.

  **Marcus:** The difference was the *presence* of rust.

  **Elena:** Which accumulated because of a *missing* action. You can't get rid of the negative, Marcus. The world is shaped by what isn't there as much as what is. The hole in the ozone layer. The silence in a room. The lifeguard's inattention.

  **Marcus:** *(Looks out the window)* I worry that if we accept your view, we dilute agency. If everything that could have prevented harm is a cause of harm, then we are all constantly killing each other by not saving each other.

  **Elena:** And I worry that if we accept yours, we let people off the hook by hiding behind "I didn't do anything." The lifeguard *did* do something. He chose to look at his phone. That action displaced the action of watching.

  **Marcus:** Now you're shifting. You're saying the *phone-looking* caused the death, not the *not-watching*.

  **Elena:** They're two sides of the same coin.

  **Marcus:** Are they? Suppose he was looking at the horizon, daydreaming. No phone. Still not watching. Now there's no distracting action. Just pure omission. Is he still a cause?

  **Elena:** Yes. Because the duty was to watch. The counterfactual holds.

  **Marcus:** And I say no. Because there is no process. He is a statue with a paycheck.

  **Elena:** But the swimmer is dead.

  **Marcus:** I know. And it's a tragedy. But we don't fix tragedies by confusing metaphysics. We fix them by enforcing duties. We don't need to pretend the lifeguard's inaction was a physical force to hold him accountable. We just need to say he broke the rules of the practice.

  **Elena:** So the harm is real, the duty is real, but the link between them is... what? A social construct?

  **Marcus:** A normative link. Not a causal one.

  **Elena:** *(Shakes head)* The law won't accept that. "Proximate cause" is the bridge. If you burn the bridge, the verdict falls.

  **Marcus:** Then the law needs better philosophy. Or maybe... *(He hesitates)* ...maybe we define "cause" in law differently than in physics.

  **Elena:** That's what I've been saying!

  **Marcus:** No. You said the metaphysics *is* counterfactual. I'm saying the metaphysics is physical, but the *law* is pragmatic. There's a difference between "It is true that he caused it" and "It is useful to treat him as having caused it."

  **Elena:** Is there? If it's useful to treat it as true, and we base our entire system of justice on it... in what sense is it not true?

  **Marcus:** *(Smiles faintly)* In the sense that if you put a detector on the lifeguard's chest to measure "causal emission," it would read zero.

  **Elena:** And if you put a detector on the swimmer's lungs to measure "need for air," it would read critical. The absence of air killed him. The absence of the lifeguard allowed the absence of air.

  **Marcus:** You're going to drive me to drink, Elena.

  **Elena:** There's a counterfactual for you. If you drank, you might miss your train.

  **Marcus:** And if I miss my train, I might meet someone who saves a drowning swimmer tomorrow.

  **Elena:** See? You're a counterfactual theorist when it suits you.

  **Marcus:** *(Laughs, stands up)* Touché. But I still maintain: the lifeguard didn't push the swimmer under.

  **Elena:** And I maintain: he didn't pull him out. And in a world where he was the only hand available, that's the same thing.

  **Marcus:** We'll have to agree to disagree on the ontology. But... *(He extends a hand)* ...I think we can agree the lifeguard needs to lose his license.

  **Elena:** *(Shakes his hand)* On that, the counterfactual is certain. If he keeps it, someone else dies.

  **Marcus:** Now *that* is a causal claim I can sign off on.

  *(Marcus gathers his bag. Elena watches him go, then looks back at her coffee, swirling the liquid, watching the vortex form and fade.)*
