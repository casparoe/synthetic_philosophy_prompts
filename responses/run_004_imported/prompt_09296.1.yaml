          *   Elena: If the lifeguard looked up, swimmer lives. Therefore, omission caused death.
          *   Marcus: Nothing happened. No energy transfer. You're confusing causation with expectation.
      *   **Round 2: The Counterfactual Objection (Over-permissiveness).**
