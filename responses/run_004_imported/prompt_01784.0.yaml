prompt: |-
  so my school's philosophy club has been on this whole Doomsday Argument kick lately and two people in it got into an argument that never rlly got resolved. Kai's point was: something like 117 billion humans have ever been born and only ~8 billion of us are alive right now, so if humanity's actually got some huge future ahead of it (like trillions of people eventually spreading across the galaxy), then you and me being born this early would be a crazy coincidence -- meaning we should update toward humanity ending relatively soon instead of lasting forever. Mia said thats a trick, because a hypothesis where way more humans end up existing also means way more 'slots' that could've been you, and once you weight the hypotheses by how many observers each one predicts, the update completely cancels out. Kai came back that her fix has the same problem in disguise: if you always favor whatever theory predicts more observers, you'd end up believing wild stuff about the size of the universe purely bc it implies more people exist, without any actual evidence for it -- which is arguably crazier than just accepting doom. Mia's comeback was that Kai's whole setup already smuggled in a choice, since he's comparing himself to 'all humans' specifically, and if you pick a different reference class (like all observers ever, or humans born after 1900) you get a totally different answer, so his side was never the neutral default either. neither of them backed down. can you go through it move by move and say who's got the better argument at each step, plus anything you think both of them are missing?
