  *Drafting thought:* The "Report" is the physical symbol of the objective attitude.
  *Drafting thought:* Mark's demeanor should be calm, not robotic, but *relieved* of responsibility.
  *Drafting thought:* Elena's internal struggle is the core. She wants to be angry. She is *forbidden* from being angry by love and science.

  *Word Count Strategy:*
  - Intro/Setting: 300 words
  - The Report/Explanation: 400 words
  - The Interaction/Conflict: 500 words
  - Resolution/Ending: 400 words
  Total approx 1600.

  Let's begin.

  *Wait, one more check on Strawson:* Strawson says the objective attitude is an *impoverishment*. So the story must feel like something valuable is lost, even if peace is gained. The loss is the *relationship* itself, which relies on mutual accountability.

