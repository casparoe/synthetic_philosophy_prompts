answer: |-
  The envelope sat on the kitchen table, white and heavy, next to the fruit bowl. It was the only thing in the room that felt solid. Outside, the rain blurred the garden into a watercolor of greens and grays, but inside, the air was filtered and still.

  Elena stood by the counter, holding a mug of tea that had gone cold. She was waiting for the anger to arrive. It was a familiar guest, one that usually kicked open the door after a night like Tuesday's. Tuesday had been the anniversary dinner. Tuesday was when David had looked across the candlelight, listened to her talk about her mother's failing health, and checked his watch. When she had stopped speaking, hurt tightening her throat, he had said, "We need to leave. The traffic peak is calculable. Your emotional state is not."

  It was cruel. It was the kind of cruelty that demanded a shout, a slammed door, a night on the couch. It demanded that he feel the weight of her pain and recognize it as something he had caused.

  But the envelope on the table contained the results of the Neuro-Behavioral Integration Assessment. And according to the envelope, David hadn't caused anything. He had merely functioned.

  David entered the kitchen. He moved quietly, his socks silent on the hardwood. He looked rested. He wore the same soft gray sweater he'd worn on Tuesday, but the tension that usually knotted his shoulders was gone. He poured himself coffee.

  "The therapist called," Elena said. Her voice sounded thin to her own ears. "She said we should review the findings together."

  David nodded, leaning against the counter. He didn't look guilty. He looked like a mechanic reviewing a diagnostic printout for a car that had stalled. "I've read them. It's clarifying."

  "Clarifying."

  "It explains the latency in my empathy centers during high-stress social rituals," David said. He took a sip of coffee. "When you spoke about your mother, my cortisol spiked. My brain prioritized exit strategies. It wasn't a choice, El. It was a trajectory."

  Elena gripped the mug. She tried to summon the heat she had felt on Tuesday night. She tried to picture his face as it had been then—tight, impatient, closed off. She wanted to feel the sting of indignation. Indignation was a bridge. It required two people standing on opposite sides, acknowledging that one had wronged the other. It required the belief that he *could* have done otherwise.

  "So," she said. "You couldn't help it."

  "I could not," David said. He reached out and touched her arm. His hand was warm, dry, and steady. "Knowing this helps you, doesn't it? The resentment is based on a false premise. You've been angry at a wave for crashing."

  "It feels like I'm angry at the weather," Elena said.

  "Exactly. And you don't hate the weather. You just prepare for it."

  That was the gain. That was the thing the brochure had promised. The end of the futile war against nature. No more shouting matches about character flaws. No more nights spent dissecting motives until both of them were bleeding. If David was a system of inputs and outputs, then Elena was no longer a victim; she was an operator. She just needed to adjust the variables.

  "I brought the schedule," David said, reaching into his pocket. He pulled out a small card. "For the holidays. I've mapped out the social interactions where my tolerance threshold is likely to breach. If we limit exposure to your sister to forty-five minutes, and ensure I have a quiet room available at your parents' house, the incident won't recur."

  He offered the card like a peace offering. It was a solution. It was rational. It was perfect.

  Elena took the card. The paper was thick, expensive. She looked at the typed times and boundaries. It was a management plan.

  "David," she said. "Do you love me?"

  He didn't hesitate. "Yes. The bonding protocols are stable. My commitment is absolute."

  "Protocols."

  "Chemical and psychological dependencies formed over eight years. They are robust."

  She looked at him, really looked at him. He was safe. He would never hurt her intentionally again, because the concept of 'intentionally' had been surgically removed from their marriage. He was a force of nature, like a tree that drops a branch on your car. You don't hate the tree. You don't forgive the tree. You just move the car.

  She realized then that she was lonely. She was standing in her kitchen with her husband of eight years, and she was entirely alone.

  The loss wasn't in the safety. The loss was in the possibility of forgiveness. You cannot forgive a storm. You cannot feel gratitude when a machine gives you what you need. Gratitude requires a gift, and a gift requires a giver who could have kept it. David couldn't keep anything back anymore; he was transparent, determined, fixed.

  "I miss the apology," she said softly.

  David frowned, a flicker of confusion crossing his face. "An apology implies fault. The assessment says there is no fault. There is only function."

  "I know."

  "If I apologize, I am lying. I am accepting blame for a structural inevitability. That would be dishonest."

  "Yes," Elena said. "It would be."

  She put the card down on the table. It landed next to the envelope. The silence stretched between them, clean and sterile. There was no tension in the air. The threat of violence, of screaming, of divorce, had evaporated. They were compatible. They were optimized.

  She thought about the last time they had made up after a fight. Three years ago. He had brought her flowers, stupid red roses that shed petals everywhere. He had looked ashamed, his eyes wet. He had said, *I was a jerk. I'm sorry.* She had felt the anger dissolve, replaced by a rush of warmth because he had chosen to come back. He had chosen her over his pride.

  That choice was gone now. He was here because his neural pathways led here.

  "Are you happy?" she asked.

  David considered this. He looked around the kitchen, at the rain against the window, at the clean counters. "I am unburdened. I don't carry the weight of being a monster anymore. I'm just me."

  He smiled. It was a gentle smile, devoid of defensiveness. He loved her in the way a gardener loves a plant—by ensuring the soil is correct, by managing the light.

  "That's good," Elena said. "I'm glad you're unburdened."

  She picked up her cold tea and walked to the sink. She poured it out. The liquid swirled down the drain, dark and bitter. She rinsed the mug and placed it in the dishwasher. A small task. A manageable task.

  "Should we look at the calendar for next week?" David asked. "I have a window on Thursday evening where my serotonin levels should be optimal for conversation."

  Elena dried her hands on the towel. She turned to face him. He was waiting for her input. He wanted her to collaborate on the management of their life. He wanted her to be a partner in the objective stance. To look at themselves from the outside, two organisms navigating a shared environment.

  She could do that. She could live like this. She could be safe. She could be understood without ever being known.

  "Thursday works," she said.

  "Excellent." David pushed off the counter. "I'm going to read in the study. Let me know if you need anything."

  "I will."

  He walked out of the kitchen. His steps were even, rhythmic. There was no heaviness in his tread. He was free.

  Elena stayed in the kitchen. She looked at the envelope again. She wanted to tear it open, to scramble the papers inside, to find a loophole that would allow him to be cruel again. She wanted him to be capable of malice so that she could be capable of mercy.

  She picked up the card he had left. *Limit exposure to forty-five minutes.*

  She put it in her pocket. She walked to the window and watched the rain. It fell without reason, without intent, without care for the garden below. It was honest. It was inevitable.

  She placed her hand against the glass. It was cold. She waited for the chill to bother her, but it didn't. She was warm enough. She was safe. She stood there for a long time, watching the water run down the pane, tracing paths that were already decided, waiting for nothing to change.
