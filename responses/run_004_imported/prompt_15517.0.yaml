answer: |-
  This is a profound question that sits exactly at the intersection of your field (behavioral economics) and moral philosophy. Your housemates are reenacting a classic debate between **deontology** (motives define moral worth) and **consequentialism** (outcomes define moral worth). As you suspect, both fail to capture the phenomenology of long-term care.

  In behavioral economics, you model "impure altruism" to predict *behavior*. In ethics, we often worry about impure altruism to judge *character*. The disconnect arises because caregiving is not a one-shot donation game; it is a repeated, high-cost, relational interaction where **sustainability** is a moral variable in itself.

  Here is a more precise framework for analyzing your aunt's situation, drawing on care ethics, virtue ethics, and institutional economics. You can use these three dimensions to move the conversation past "it's complicated."

  ### 1. Motivational Redundancy as Robustness
  Your first housemate assumes that self-interested motives *subtract* from moral worth. A more sophisticated view is that in long-term care, motivational pluralism adds **robustness**.

  In engineering terms, this is "redundancy." If your aunt cared *only* out of pure love, she would be vulnerable to caregiver burnout, compassion fatigue, or the natural erosion of affection over four years of difficult labor. If she cared *only* for the inheritance, she might provide the bare minimum to keep the estate viable (a principal-agent problem).

  Because she has *both* (plus guilt/social pressure), the care arrangement is more stable.
  *   **The Argument:** Mixed motives are not a dilution of virtue; they are a structural necessity for sustainability. A motive of "guilt avoidance" acts as a commitment device that keeps her showing up on days when "love" feels exhausted.
  *   **The Economic Parallel:** Think of this as a contract with multiple enforcement mechanisms (reputational, financial, and internal). The care is *more* secure because the motives are mixed, not less.

  ### 2. The Quality of Attention (Phenomenology vs. Outcome)
  Your second housemate argues that only the outcome matters (the mother-in-law is fed and medicated). This ignores the **quality of the interaction**, which is central to care ethics.

  Care is not just a service delivery; it is a relational state. If the self-interested motive becomes dominant, it can subtly distort the care without changing the observable outcome. For example, an inheritance-focused caregiver might over-sedate a patient to reduce their own workload, preserving the asset (the mother-in-law's health) but diminishing her lived experience.

  However, your aunt's statement that she "doesn't trust any other relative to give her the attention she needs" suggests she holds an internal standard of care that transcends the transaction.
  *   **The Argument:** We should not ask "Are the motives pure?" but rather "Do the self-interested motives corrupt the *nature* of the care?"
  *   **The Distinction:** There is a difference between *instrumentalizing* the patient (treating them as a means to an inheritance) and *integrating* the self-interest into a commitment to the patient's flourishing. As long as the self-interest requires the patient's well-being to be realized (i.e., she only gets the inheritance if the mother-in-law is well-cared-for until death), the incentives are aligned.

  ### 3. Relational Constitution vs. Transactional Exchange
  Your housemates are treating the aunt and mother-in-law as distinct, atomic agents engaging in a transaction. Care ethics (think Carol Gilligan or Eva Feder Kittay) argues that in dependency relationships, the selves are **constitutively intertwined**.

  Your aunt's "self-interest" is not separate from her mother-in-law's welfare. Her identity is now partially constituted by her role as a caregiver. The "warm glow" you model in economics is often treated as a private consumption good. In caregiving, the "glow" (or the avoidance of guilt) is actually a signal of her attachment to the relationship.
  *   **The Argument:** Guilt, in this context, is not just a negative emotion; it is the psychic cost of violating a relational norm she values. To feel guilt at the prospect of stopping means she acknowledges a duty that is part of her self-conception.
  *   **The Nuance:** The inheritance motive is the most ethically fraught, but it also signals a long-term time horizon. It suggests she is planning for a future where this relationship matters. The moral risk isn't the expectation of reward; it's **contingency**. (i.e., "If I found out I was cut from the will, would I stop?")

  ### Synthesizing the Response
  Next time this comes up, you can articulate it this way:

  > "Both of you are applying frameworks designed for one-off interactions to a long-term dependency relationship.
  >
  > To the first point: Moral purity is fragile. In four years of caregiving, love fluctuates. Having 'impure' motives like guilt-avoidance or financial expectation acts as a commitment device that ensures the care continues when the emotional 'warm glow' fades. That redundancy makes the care more reliable, which is a moral good in itself.
  >
  > To the second point: Outcomes aren't all that matter because care is relational, not just mechanical. We have to ensure the self-interested motives don't distort the *quality* of the attention. But as long as the aunt's self-interest (inheritance, reputation) is tied to the mother-in-law's actual well-being, the incentives are aligned.
  >
  > The real ethical question isn't about purity. It's about **alignment and monitoring**. We should be grateful for the mixed motives that keep the system stable, but we (the wider family) have a duty to monitor that the financial motive doesn't eventually override the care motive. Her honesty about her motives actually makes her more trustworthy, not less, because she isn't hiding the potential conflicts of interest."

  ### A Note for Your Own Reflection
  As an economist, you know that "incentive compatibility" is often the best we can hope for. Your aunt has created a situation where her self-interest is compatible with her mother-in-law's welfare.

  The only danger zone is if the motives become **decoupled**. For example, if the estate is settled early, or if the care becomes so burdensome that the inheritance no longer compensates for it. The "honesty" your aunt displayed is a protective factor; it allows the family to discuss support systems (respite care, financial help) without shattering her self-image as a "saint." By admitting she isn't a saint, she allows herself to be a sustainable caregiver.

  In short: **Purity is for statues; redundancy is for systems.** Your aunt is running a system, not posing for a statue.
