answer: |-
  This is an incredibly sharp observation. You have intuitively grasped one of the most fertile intersections in modern political theory and bioethics. The analogy between psychiatric advance directives (Ulysses contracts) and constitutional precommitment is not just a metaphor; it is a structural identity that philosophers like Jon Elster, Stephen Holmes, and Cass Sunstein have spent decades unpacking.

  You are right to feel that the comparison is both illuminating and slightly "off." The friction points you identified—revocability, identity, and the justification for overriding the present self—are exactly where the theory gets difficult.

  Here is a breakdown of how the analogy holds, where it fractures, and what Jon Elster actually adds to the conversation beyond the mast-and-sirens image.

  ### 1. The Core Mechanism: Precommitment Against "Time Inconsistency"
  Jon Elster's seminal work, *Ulysses Unbound* (2000), is the text you encountered in your rabbit hole. His central argument is that rational agents often suffer from **time inconsistency**. This means what we want at Time A (stable) conflicts with what we want at Time B (passionate/impaired), and if we don't bind ourselves at Time A, Time B will ruin our long-term interests.

  *   **In Politics:** The Founding Fathers (Time A) feared that a future Congress (Time B), swept up in populist passion or factional fury, would violate fundamental rights. They created a Constitution with high amendment thresholds (supermajorities) to "cool" the passions of the future legislature.
  *   **In Psychiatry:** Your brother (Time A, stable) knows that his manic self (Time B, impaired) will prioritize immediate gratification or delusional goals over long-term health. He signs a contract to bind his future self.

  **Where it holds:** Both systems admit that "democracy" (or autonomy) in the immediate moment can be self-destructive. Both rely on the idea that **procedural hurdles** (a supermajority vote / a legal document + medical evaluation) protect **substantive values** (free speech / mental health).

  ### 2. The Breakdown: Identity and Authorship
  This is the most profound philosophical divergence you noticed.

  **The Political Version:**
  In constitutional theory, the "future Congress" is considered the **legitimate successor** to the "Founding Generation." They are the same sovereign entity. When the Supreme Court strikes down a law, it is essentially saying, "The current majority is violating the rules agreed upon by the sovereign people over time." The future legislature *does* have a vote on overturning the Constitution (via amendment); it is just made very expensive (2/3 vote + 3/4 states).

  **The Psychiatric Version:**
  Here, the "same person" question is metaphysical and legal.
  *   **Legal View:** The law generally treats your brother as one continuous legal person. However, it utilizes a **competency switch**. When stable, he has full autonomy. When manic, he is deemed "incompetent," and his legal agency is suspended.
  *   **Philosophical View:** Many bioethicists argue that severe mania creates a **discontinuity of self**. The "manic brother" is not making a free choice; he is acting under a pathological compulsion. Therefore, honoring the Ulysses contract isn't overriding *him*; it's honoring his *authentic* self against a *hijacked* self.

  **The Friction:**
  In politics, we acknowledge the future Congress has a legitimate voice, we just weight it less. In psychiatry, the Ulysses contract often removes the future self's voice *entirely* during the crisis. If your brother is manic and screams "I revoke the contract!", the contract is designed to make that revocation invalid. In a constitution, if 90% of the country wants to amend the Bill of Rights, they theoretically *can*. In a Ulysses contract, even if 100% of the "manic self" wants out, he is locked out.

  **Why the difference?** Because the political system assumes the future legislature is *rational but passionate*. The psychiatric system assumes the manic self is *irrational and impaired*. The constitutional bind is a speed bump; the psychiatric bind is a wall.

  ### 3. Revocability and Rigidity
  You noted that constitutions can be amended, but the contract is designed so he "doesn't get a vote." This is the distinction between **soft precommitment** and **hard precommitment**.

  *   **Constitutions (Soft):** They raise the cost of changing your mind. This prevents whim, but allows for evolution.
  *   **Ulysses Contracts (Hard):** They often attempt to remove the option of changing your mind *during the episode*.

  **Elster's Warning:**
  This is where Elster is crucial. He warns that **total precommitment is dangerous.** If Ulysses ties himself too tightly, and the ship encounters a storm (a medical complication, a change in treatment efficacy) that Ulysses couldn't foresee, he might drown.
  *   **Political Risk:** If a Constitution is too hard to amend, it leads to revolution (because the only way to change the rules is to break the system).
  *   **Psychiatric Risk:** If a Ulysses contract is too rigid, it can lead to trauma or loss of trust in the treatment team.

  **The Solution:** Modern psychiatric advance directives often include "sunset clauses" or require a specific re-evaluation process. They try to mimic the Constitutional Amendment process: "You can't revoke this just by saying so while manic, but if two independent doctors agree you are stable, the contract is void." This restores a bit of the "supermajority" logic rather than the "total lockout."

  ### 4. Justification: Why override the present self?
  You asked what justifies overriding someone's stated present-tense wishes.

  **The Political Justification:**
  We override the current Congress to protect the **continuity of the Republic**. If a temporary majority could abolish elections, the democracy ends. We bind the present to save the future system.

  **The Psychiatric Justification:**
  We override the manic patient to protect **autonomy itself**. This is the paradox of Ulysses.
  *   If we let the manic brother drive to Vegas, he is exercising "local autonomy" (doing what he wants now).
  *   But that action will likely destroy his "global autonomy" (his ability to make choices in the future, his financial stability, his health).
  *   Therefore, enforcing the contract is actually *maximizing* his autonomy over time, even if it violates it in the moment.

  **The Danger Zone:**
  The risk, as political theorists note, is **Paternalism Creep.** Who decides when the "sirens" are playing?
  *   In politics, the Supreme Court decides if a law is unconstitutional.
  *   In psychiatry, the doctor decides if you are manic.
  If the definition of "mania" becomes too broad, the Ulysses contract becomes a tool for doctors/families to override *any* unpopular decision the patient makes. (e.g., "He's not manic, he just disagrees with us.") This is why the criteria for triggering the contract must be as specific as a constitutional clause.

  ### 5. What Elster Adds Beyond the Metaphor
  You mentioned not totally getting Elster's angle. Here is the specific value he adds:

  1.  **Removing Options vs. Raising Costs:** Elster distinguishes between *throwing away the key* (hard precommitment) and *making it hard to get the key* (raising costs). He argues hard precommitment is rarely rational because we can't predict the future. He would likely advise your brother's contract to have "escape hatches" (e.g., "I can revoke this if I can demonstrate to a third-party advocate that I understand the consequences").
  2.  **The Source of Passion:** Elster analyzes *why* we need binding. In politics, it's collective passion. In psychiatry, it's internal chemical dysregulation. He notes that internal binding is harder because the "enemy" is inside the decision-making apparatus itself.
  3.  **Self-Binding vs. Other-Binding:** A constitution binds *others* (future legislators) on behalf of the people. A Ulysses contract binds *yourself*. Elster points out that self-binding is psychologically harder to maintain because we are more forgiving of our own transgressions than those of others. This is why external enforcement (the psychiatrist/family) is necessary.

  ### Summary of the Analogy

  | Feature | Constitutional Precommitment | Psychiatric Ulysses Contract |
  | :--- | :--- | :--- |
  | **Goal** | Protect long-term values from short-term passion. | Protect long-term health from short-term mania. |
  | **The "Future Self"** | Future Legislature (Competent but passionate). | Manic Self (Deemed incompetent/impaired). |
  | **Revocability** | Possible but difficult (Supermajority). | Often impossible *during* the crisis. |
  | **Enforcement** | Courts, Political Culture, Inertia. | Doctors, Police, Physical Restraint. |
  | **Risk** | Rigidity leading to revolution/obsolescence. | Trauma, loss of trust, paternalistic abuse. |
  | **Legitimacy** | Derived from "The People" over time. | Derived from "Competent Self" vs. "Pathological Self." |

  ### A Thought for Your Family
  The analogy suggests that for this contract to be ethical and effective, it needs to function less like a **lockout** and more like a **Constitution**.

  1.  **Define the Triggers Clearly:** Just as the Constitution defines "Treason" or "Impeachment," the contract should define exactly what behaviors trigger it (e.g., "Spending >$5k in 24 hours" or "Refusing sleep for 48 hours"). This prevents the "tyranny" of vague interpretations.
  2.  **Allow for "Amendment":** Can the contract include a provision where, if he is stable for 6 months, he can renegotiate the terms? This acknowledges that the "stable self" evolves, not just the manic self.
  3.  **Third-Party Review:** In the US, the Supreme Court checks Congress. In this contract, is there a patient advocate or a second doctor who must agree that the "sirens are playing" before the contract is enforced? This prevents the family/doctor from becoming a tyrannical majority.

  Your brother's psychiatrist is suggesting a tool that treats his autonomy as a **temporal project** rather than a momentary state. It is a profound recognition that "freedom" isn't just doing what you want *now*; it's having the power to ensure your future self can also do what *you* want. But as the political theorists warn: bind yourself too tightly, and you cannot breathe. Bind yourself too loosely, and the sirens will win.

  *Disclaimer: I am an AI, not a lawyer or a doctor. This analysis is theoretical and philosophical. Specific legal and medical decisions regarding Ulysses contracts vary wildly by jurisdiction and should be handled with professional counsel.*
