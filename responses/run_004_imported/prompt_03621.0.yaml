      *   *Refining the "Principle":* Let's call it the **Principle of Non-Transferable Moral Experience**. Or better, the distinction between **Compensatory Liability** and **Retributive Suffering**.
      *   *Wait, Lewis says fines are punitive.* Okay, so they aren't compensatory.
