  ### A Note for You
  It is natural to feel a protective instinct over the "truth" of these definitions right now. The student's error in Part (a)—confusing a ventilator-supported chest rise with brainstem function—is the exact confusion that families often struggle with in the ICU. While the grade reflects the academic error, please know that your clarity on this distinction is hard-won. You are doing important work helping students understand this precisely so they don't make these mistakes when they are in the room with families.

