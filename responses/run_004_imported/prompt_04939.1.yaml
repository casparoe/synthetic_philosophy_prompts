answer: |-
  **TO:** Bioethics Committee
  **FROM:** [Your Name], Academic Ethicist
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Charter Language Regarding Ethics Consultation Weight

  **Recommendation**
  I recommend that the committee **reject** the proposed amendment stating "the consultant's documented recommendation shall guide the treatment team's course of action absent a documented clinical contraindication."

  Instead, I propose we adopt language that formalizes the *advisory* nature of the service while mandating *rationale engagement* by the treating team. Specifically, the charter should require that when a team implements an ethics recommendation, their documentation must reflect alignment with the underlying ethical reasoning, not merely the clinical action.

  **Reasoning**
  This issue is not merely administrative; it is epistemic. The proposal to treat ethics consults like cardiology consults rests on a category error regarding the type of expertise being offered. I offer three points for the committee's consideration.

  **1. The Epistemic Distinction: Technical Facts vs. Moral Justifications**
  When Internal Medicine consults Cardiology, they are requesting *technical data* or *protocol application* (e.g., "The ejection fraction is 20%," or "Administer Drug X"). A treating physician can act on this testimony without understanding the underlying physiology because the authority rests on access to specialized facts.

  Ethics consultations do not provide new *facts*; they provide *justifications*. As philosopher Alison Hills argues, there is a distinction between *moral knowledge* (knowing *that* an action is right) and *moral understanding* (knowing *why* it is right). Technical testimony transmits knowledge; moral testimony cannot transmit understanding. If a team implements a withdrawal of life support solely because "Ethics said so," they possess knowledge of the directive but lack understanding of the justification. In a dispute with a family or a review by risk management, "Ethics told us to" is an appeal to authority, not an ethical defense. Only the team's own grasp of the *why* allows them to defend the decision morally.

  **2. The Risk of Moral Deskilling**
  Formalizing deference risks "moral deskilling" the clinical staff. If the charter codifies that the ethics recommendation is binding absent *clinical* contraindications, it implies that ethical contraindications are insufficient grounds for deviation. This subtly shifts the service's authority from *moral* to *administrative*. We become a compliance hurdle rather than a resource for moral reasoning. Over time, this encourages clinicians to outsource moral distress rather than resolving it, leaving them less capable of handling the inevitable cases where an ethics consultant is unavailable.

  **3. Steelmanning the Efficiency Argument**
  Proponents of the "shall guide" language argue for consistency and speed. They are correct that ambiguity causes friction. In high-stakes cases, clinicians often feel abandoned when told "this is up to you." A binding recommendation offers psychological cover and reduces variation in care. There is a genuine good in ensuring that two patients with identical clinical profiles do not receive different ethical treatments based on which fellow is on call. We must acknowledge that demanding "understanding" from an exhausted night team carries a real cost in time and cognitive load.

  **4. Why Efficiency is a False Economy Here**
  However, efficiency in ethics is not analogous to efficiency in pharmacy. A speedier ethical decision is not a better one if it is unowned by the agents executing it. If the team does not comprehend the rationale, they cannot adapt it when the clinical picture shifts slightly. Furthermore, the "clinical contraindication" clause in the proposed language is dangerous: it suggests that the only valid reason to override ethics is physiological. Often, a team may override an ethics recommendation because they perceive a competing *ethical* obligation (e.g., loyalty to a long-term patient relationship) that the consultant weighed differently. The charter must leave space for ethical disagreement, not just clinical feasibility.

  **Proposed Charter Language**
  To balance the need for clarity with the necessity of moral agency, I propose the following text replace the contested section:

  > **Section X: Weight of Recommendation**
  > (a) The Ethics Consultation Service provides advisory analysis regarding the ethical dimensions of clinical care. The treating team retains ultimate responsibility for the care plan.
  > (b) Ethics recommendations shall include the underlying ethical rationale.
  > (c) When implementing an ethics recommendation, the treating team's documentation should reflect alignment with the provided ethical rationale.
  > (d) The treating team may deviate from the ethics recommendation when they identify competing clinical or ethical obligations. In such cases, the medical record should articulate the basis for the deviation.

  **Conclusion**
  This language preserves the service's moral authority by grounding it in the quality of our reasoning rather than the binding nature of our verdicts. It respects the clinicians' role as moral agents while ensuring they cannot simply hide behind us. I look forward to discussing this at the vote.
