prompt: |-
  Sidgwick, and later Parfit, both argue that pure time preference — giving a future benefit or harm less weight simply because it lies further from the present, apart from any accompanying change in its magnitude or probability — has no rational or ethical basis, and this argument is now widely treated as more or less decisive within moral philosophy. Given that, I have never understood why economists such as Nordhaus continue to build positive discount rates for future generations' welfare into their climate-policy models: doesn't any positive rate simply smuggle back in, under another name, the very pure time preference that Sidgwick and Parfit refuted? I would value your assessment of whether mainstream climate economics is quietly resting on a premise that moral philosophy has already discredited.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**
      *   **Core Premise:** Sidgwick and Parfit argue that *pure time preference* (discounting the future just because it's in the future) is ethically indefensible. This view is dominant in moral philosophy.
      *   **Observation:** Economists (specifically citing Nordhaus) use positive discount rates in climate policy models (Integrated Assessment Models or IAMs).
      *   **Question/Challenge:** Doesn't using a positive discount rate just smuggle in the ethically refuted pure time preference? Is mainstream climate economics resting on a discredited philosophical premise?
      *   **Goal:** Assess the validity of this tension between moral philosophy and climate economics.

  2.  **Initial Assessment & Fact-Checking:**
      *   *Sidgwick/Parfit:* Yes, they argue against pure time preference (PTP). Parfit's *Reasons and Persons* is the key text here. The "argument from bias" suggests favoring the present over the future is arbitrary, like favoring people closer in space.
      *   *Nordhaus/Economics:* Yes, William Nordhaus (Nobel laureate) uses discounting in his DICE/RICE models. The Ramsey Rule is central here ($r = \delta + \eta g$).
      *   *The Tension:* This is a famous debate, often framed as the "Stern vs. Nordhaus" debate (following the Stern Review on the Economics of Climate Change, 2006).
      *   *Is it "smuggling"?* It's more complex. Economists distinguish between *pure time preference* ($\delta$) and *discounting due to expected growth/opportunity cost*.
      *   *Is philosophy "decisive"?* Philosophers think so, but economists have practical and descriptive reasons for discounting.

  3.  **Key Concepts to Explain:**
      *   **Pure Time Preference ($\delta$):** The ethical parameter. Stern set this near zero; Nordhaus sets it higher (around 1-1.5%).
      *   **Elasticity of Marginal Utility ($\eta$):** How much less value an extra dollar gives to a richer person.
      *   **Growth Rate ($g$):** Future generations are expected to be richer.
      *   **The Ramsey Equation:** $r = \delta + \eta \times g$. This is crucial. It shows that a positive discount rate ($r$) doesn't *necessarily* imply a positive pure time preference ($\delta$).
      *   **Descriptive vs. Prescriptive:** Economists often argue they should match market rates (descriptive) vs. what is ethically right (prescriptive).
      *   **Uncertainty/Risk:** Discounting can also reflect the probability that the benefit won't materialize (though the prompt excludes probability, it's relevant to the economic justification).
      *   **Opportunity Cost:** Capital invested now grows.

  4.  **Structure the Response:**
      *   **Acknowledge and Validate:** Confirm the user's understanding is sharp and identifies a genuine, famous conflict (Stern vs. Nordhaus).
      *   **The Ramsey Rule Breakdown:** Explain *why* economists use positive rates. Distinguish between $\delta$ (pure time preference) and the growth component.
      *   **The Ethical Defense (Nordhaus side):** Why do they keep $\delta > 0$? (Risk of extinction, myopia, opportunity cost of capital).
      *   **The Ethical Attack (Stern/Philosophy side):** Why is $\delta \approx 0$ required? (Intergenerational equity, Parfit's arguments).
      *   **Beyond Pure Time Preference:** Discuss "wealth effects" (future people will be richer, so money matters less to them). This is often the biggest driver of discounting, not PTP.
      *   **Uncertainty and Catastrophe:** Mention Weitzman's critique (fat tails) and how discounting interacts with existential risk.
      *   **Conclusion:** Assess the user's specific question. Is economics resting on a discredited premise? Partially, but with nuances. It's a clash of methodologies (optimization vs. ethical duty).

  5.  **Drafting the Content (Iterative refinement):**

      *   *Refining the "Smuggling" accusation:* It's not exactly smuggling if they admit it. Nordhaus admits he uses a positive $\delta$. He justifies it differently than Parfit rejects it.
      *   *The "Growth" argument:* This is the strongest economic counter to the philosophical objection. If future people are richer, a dollar helps them less. This isn't PTP; it's diminishing marginal utility. I need to make sure this distinction is clear.
      *   *The "Opportunity Cost" argument:* If we invest \$100 now, it becomes \$105 next year. If we wait, we lose that growth. This justifies a discount rate based on productivity, not just time bias.
      *   *The "Descriptive" argument:* Markets show people *do* discount the future. Should policy match behavior or lead it?
      *   *The Stern Review:* This is the pivotal moment in this debate. Stern used $\delta = 0.1\%$. Nordhaus criticized this as implying unrealistically high savings rates for the present generation.
      *   *Philosophy's limit:* Philosophers deal with *ought*, economists deal with *feasibility* and *trade-offs*. If $\delta = 0$, the required sacrifice from the current poor might be ethically problematic too.

  6.  **Synthesizing the Assessment:**
      *   The user is right that *pure* time preference is ethically shaky.
      *   However, the *total* discount rate in economics isn't just pure time preference.
      *   Even the pure time preference component ($\delta$) in economics is often justified by "probability of existence" or "societal myopia," not just "time matters."
      *   The conflict is real: "Optimal Savings Rate" vs. "Intergenerational Justice."
      *   Verdict: Mainstream climate economics (Nordhaus) prioritizes consistency with current market behavior and avoids imposing extreme burdens on the present, whereas the philosophical view (Stern/Parfit) prioritizes intergenerational neutrality. It's not necessarily "discredited," but it is "contested" on different grounds.

  7.  **Final Polish:**
      *   Ensure tone is respectful and analytical.
      *   Use clear headings.
      *   Check names (Sidgwick, Parfit, Nordhaus, Stern, Ramsey).
      *   Make sure to answer the specific question: "Is it resting on a discredited premise?" (Answer: It depends on how you define the premise and the purpose of the model).

  8.  *(Self-Correction during drafting)*: I should be careful not to say economists are *wrong*. Nordhaus won the Nobel partly for this work. I need to present the *justification* economists give, even if philosophers reject it. The justification is often about *feasibility* and *opportunity cost*, not just ethical time bias. Also, distinguish between *consumption* discounting and *utility* discounting.

