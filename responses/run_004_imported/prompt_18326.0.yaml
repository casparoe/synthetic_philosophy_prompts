answer: |-
  You have identified one of the most significant and enduring fault lines in the intersection of ethics and economics. Your intuition is sharp: there is indeed a profound tension between the consensus in moral philosophy (championed by Sidgwick, Ramsey, and Parfit) and the standard practice in neoclassical climate economics (exemplified by Nordhaus).

  However, whether mainstream climate economics is "quietly resting on a premise that moral philosophy has already discredited" requires a nuanced answer. It is not simply a case of economists ignoring philosophy; rather, they are operating with a different set of constraints, definitions, and objectives.

  Here is an assessment of the conflict, broken down by the economic mechanisms at play, the ethical justifications offered by economists, and the validity of your critique.

  ### 1. The Ramsey Rule: Disentangling the Discount Rate
  To understand the disagreement, we must look at the formula economists use to determine the discount rate, known as the **Ramsey Rule**:

  $$r = \delta + \eta \times g$$

  Where:
  *   $r$ is the social discount rate.
  *   $\delta$ (delta) is the **pure rate of time preference**.
  *   $\eta$ (eta) is the **elasticity of marginal utility of consumption** (how much less value an extra dollar gives to a richer person).
  *   $g$ is the expected **growth rate of consumption** (future generations are expected to be richer).

  **Your critique targets $\delta$.** Parfit and Sidgwick argue $\delta$ should be zero. If $\delta = 0$, we treat the welfare of a person in 2100 exactly the same as a person in 2024, provided they have the same level of wealth.

  **However, economists argue that $r$ can be positive even if $\delta$ is zero.**
  If future generations are richer ($g > 0$) and money matters less to rich people ($\eta > 0$), then transferring resources from the rich future to the poor present is ethically permissible (or even required). This is not "pure time preference"; it is a **wealth effect**.

  *   **The Philosophical View:** Discounting based on time ($\delta$) is discrimination.
  *   **The Economic View:** Discounting based on expected wealth ($\eta \times g$) is redistribution.

  Nordhaus does not rely solely on $\delta$. A significant portion of the discount rate in his DICE model comes from the assumption that future people will be wealthier than us, so a dollar of climate damage hurts them less than a dollar of mitigation costs hurts us today.

  ### 2. Why Nordhaus Keeps $\delta > 0$
  Even separating out the wealth effect, Nordhaus and other mainstream economists typically set $\delta$ around 1% to 1.5%, whereas the **Stern Review** (which aligned closer to Parfit's philosophy) set it at 0.1%. Nordhaus criticizes the Stern approach not because he rejects Parfit's ethics outright, but for three pragmatic reasons:

  **A. Descriptive vs. Prescriptive**
  Philosophers tend to be *prescriptive* (how we *ought* to value the future). Economists often claim to be *descriptive* (how society *does* value the future). Nordhaus argues that if policy models assume a discount rate of near-zero, they imply savings and investment rates that no democratic society would ever accept. If the model demands the current generation sacrifice 50% of consumption to save the future, the policy is politically infeasible. He argues the discount rate should reflect the "opportunity cost of capital" observed in actual markets.

  **B. The Risk of Extinction**
  Some economists argue that a positive $\delta$ acts as a proxy for existential risk. There is a non-zero probability that humanity will not exist in 200 years due to nuclear war, asteroids, or other catastrophes unrelated to climate. Therefore, investing heavily for a future that might not exist is irrational. (Philosophers counter that this should be modeled as explicit probability, not a time discount, but economists often bundle it into $\delta$).

  **C. Intergenerational Equity (The Reverse Argument)**
  Parfit focuses on the rights of the future. Nordhaus focuses on the rights of the present. If $\delta = 0$, the "tyranny of the future" emerges. Because the future is infinite (or very long), a zero discount rate implies the present generation should sacrifice almost everything to marginally improve the lives of trillions of future people who will likely be richer than us. Nordhaus views this as unethical toward the current poor.

  ### 3. Is the Premise "Discredited"?
  You ask if climate economics is resting on a discredited premise. The answer depends on which branch of economics you look at.

  **The "Yes" Argument:**
  In **welfare economics** and **moral philosophy**, the case against pure time preference is indeed considered decisive. The Stern Review (2006) was a direct attempt to bring Parfit's reasoning into economics. It concluded that because $\delta$ should be near zero, we should take drastic, immediate action on climate change. When philosophers critique Nordhaus, they are correct that his choice of $\delta$ cannot be justified by *pure ethics* alone; it requires a utilitarian calculation that weighs current suffering heavily against future suffering.

  **The "No" Argument:**
  In **policy analysis**, the premise is not "time preference is ethically good," but rather "policy must be consistent with observed human behavior and capital constraints."
  1.  **Opportunity Cost:** Capital invested today yields returns. If the market return is 4%, delaying investment costs 4% per year. This is a technological fact, not an ethical bias.
  2.  **Diminishing Marginal Utility:** As noted above, most of the discounting in climate models is due to the expectation that future generations will be richer. This is ethically defensible even if pure time preference is not.

  ### 4. The "Weitzman-Gollier" Complication
  There is a further technical layer that complicates your assessment. Martin Weitzman and others have argued that under deep uncertainty (which characterizes climate change), the discount rate should actually **decline over time**.

  If there is a small chance that economic growth will be very low (or negative) in the future, the "wealth effect" ($\eta \times g$) disappears. In those bad states of the world, future people are poor, and we should value their welfare highly. This leads to a "hyperbolic" discounting curve where the far future is discounted *less* than the near future.

  Interestingly, this economic argument converges with the philosophical one: for very long time horizons (like climate change), the effective discount rate should be very low. Nordhaus has adjusted his models over time to acknowledge this, though he remains more conservative than the philosophers.

  ### Assessment
  Is mainstream climate economics quietly resting on a discredited premise?

  **Partially, but with a caveat.**

  1.  **On Pure Time Preference ($\delta$):** You are correct. The use of a positive $\delta$ (e.g., 1.5%) is difficult to defend using Sidgwick/Parfit-style deontological or impartial utilitarian ethics. It privileges the present generation simply because they exist now. In this specific narrow sense, economics is ignoring a philosophical consensus.
  2.  **On the Total Discount Rate ($r$):** You are less correct. The bulk of the discounting in models like Nordhaus's comes from expected economic growth and diminishing marginal utility, not pure time preference. This rests on empirical assumptions about GDP growth, not just ethical axioms.
  3.  **On Methodology:** The conflict is not merely ethical; it is methodological. Philosophy asks, "What is the right thing to do?" Economics asks, "What is the optimal path given constraints on savings and investment?" Nordhaus argues that a philosophically "pure" model (Stern/Parfit) yields policy recommendations that are economically incoherent (implying negative consumption or impossible savings rates).

  **Conclusion:**
  Mainstream climate economics does incorporate a parameter ($\delta$) that moral philosophy considers ethically arbitrary. However, economists defend this not as an ethical truth, but as a pragmatic necessity to ensure policy recommendations are feasible and do not impose catastrophic costs on the current generation.

  The tension you identified is real and is the central reason why climate policy recommendations vary wildly (from 1% of GDP to 5% of GDP) depending on which discount rate is chosen. It is less that economics is "wrong" and more that it is solving a different problem: **political feasibility** vs. **moral idealism**.

  If one accepts Parfit's view that morality must be impartial across time, then Nordhaus's models are indeed ethically compromised. But if one accepts that policy must balance the welfare of the living against the welfare of the unborn, the positive discount rate remains a tool for managing that trade-off, even if it lacks "pure" ethical foundations.
