answer: |-
  This is a fantastic angle for a piece, and you are right to be skeptical of the "refutation" narrative. The surge of interest in Kelly and ergodicity economics is well-deserved, but the claim that it renders standard expected-utility theory (EUT) "wrong" or exposes a "math error" in economics is a significant overreach. It conflates a specific *objective* (maximizing long-term growth) with the broader *framework* of rational choice.

  Here is a pressure-test of the framing, broken down into the mathematical truths, the philosophical overreach, and the practical realities you can use to nuance the story.

  ### 1. The Core Truth: Time Averages vs. Ensemble Averages
  The strongest, most defensible part of the "geometric rationality" argument (championed by Ole Peters and others) concerns **ergodicity**.

  *   **The Standard View (Ensemble Average):** Traditional expected value (EV) asks: "If 100 parallel versions of me took this bet once, what would the average outcome be?"
  *   **The Kelly/Ergodic View (Time Average):** Real life asks: "If *one* version of me takes this bet 100 times in a row, what happens to my wealth path?"

  In additive systems (win \$10 or lose \$10), these averages converge. In multiplicative systems (win 10% or lose 10%), they diverge wildly. If you bet your whole bankroll on a coin flip that pays 2:1 on heads but loses everything on tails, the *ensemble* expected value is positive (0.5 * 200% + 0.5 * 0% = 100% gain). But the *time* average is bankruptcy (geometric mean is zero).

  **The Verdict:** It is accurate to say that for repeated, multiplicative betting (investing), maximizing arithmetic expected value is mathematically suicidal. Maximizing the geometric mean (or expected log wealth) is the correct strategy for maximizing long-term growth rates. **This part of the narrative is solid.**

  ### 2. The Overreach: "Refuting" Expected Utility Theory
  This is where the popular narrative gets into trouble. The claim that Kelly "refutes" EUT or that diminishing marginal utility was a "clumsy workaround" is controversial and arguably incorrect for three reasons:

  **A. Kelly is *Inside* EUT, Not Outside It**
  Expected Utility Theory does not mandate a specific utility function. It simply says a rational agent maximizes $E[U(W)]$.
  *   If your utility function is linear ($U(W) = W$), you maximize arithmetic mean (and go bust).
  *   If your utility function is logarithmic ($U(W) = \ln W$), you maximize geometric mean (and arrive at the Kelly criterion).

  Therefore, Kelly betting is not a refutation of EUT; it is the **specific application of EUT with a logarithmic utility function.** When Ed Thorp or Claude Shannon used Kelly, they were effectively saying, "My utility function is log-wealth." The "geometric rationalists" argue that *everyone* should have a log-wealth utility function. That is a normative claim about goals, not a proof that the EUT framework is broken.

  **B. The "Bernoulli Error" Claim**
  Ole Peters argues that Daniel Bernoulli (in 1738) invented utility theory to solve the St. Petersburg Paradox because he confused time averages with ensemble averages. Peters claims that if Bernoulli had understood ergodicity, he wouldn't have needed "utility" at all; he just would have averaged correctly over time.

  **Counter-argument:** Economists argue that utility captures *preferences*, not just physics. Even if the math of compounding is fixed, a human might still prefer a smoother consumption path over a volatile one, even if the volatile one has a higher growth rate. Utility theory allows for risk aversion that is *stronger* than log (more conservative than Kelly) or *weaker* (more aggressive). Calling this a "math error" dismisses the psychological and biological reality of risk tolerance.

  **C. Samuelson's Critique**
  The economist Paul Samuelson famously critiqued the Kelly criterion in the 1970s. He argued that maximizing the *rate* of growth (Kelly) is not the same as maximizing the *expected value* of terminal wealth. For a finite horizon (a human lifespan), a strategy slightly riskier than Kelly might actually yield higher expected wealth, albeit with higher risk of ruin. Samuelson argued that there is no "one true" rational strategy; it depends on the investor's specific utility function. The "geometric rationality" crowd dismisses this, but it remains a standard defense in academic finance.

  ### 3. The Practical Reality: "Full Kelly" is Rarely Used
  If you interview successful practitioners (including Ed Thorp himself), you will find almost none of them bet "Full Kelly." They bet "Fractional Kelly" (e.g., half-Kelly or quarter-Kelly).

  **Why?**
  1.  **Estimation Error:** Kelly requires precise knowledge of your edge. If you overestimate your edge even slightly, Full Kelly becomes over-betting, which drastically increases ruin risk and reduces growth.
  2.  **Volatility Drag:** Full Kelly implies massive drawdowns. A Full Kelly bettor should expect to see their bankroll drop by 50% at some point. Most humans (and fund investors) will panic and fire the manager before the "long run" arrives.
  3.  **Finite Horizons:** Kelly is optimal as time $t \to \infty$. Humans die. If you need the money in 20 years, the asymptotic optimality of Kelly matters less than the distribution of outcomes in year 20.

  **Journalistic Hook:** The "geometric rationality" proponents often speak of Kelly as a moral imperative for rationality. In practice, the most "rational" investors use Kelly as a *ceiling*, not a target.

  ### 4. How to Frame the Story Accurately
  To avoid the hype while keeping the drama, consider this framing:

  *   **Don't say:** "Kelly proves economists wrong."
  *   **Do say:** "Kelly highlights a blind spot in how we teach risk." Standard econ 101 often focuses on single-shot expected value. Kelly forces the conversation toward *repetition* and *survival*.
  *   **Don't say:** "Utility theory was a mistake."
  *   **Do say:** "Ergodicity economics suggests that what we called 'risk aversion' might actually be 'survival instinct'." Instead of saying humans are irrationally afraid of loss, this framework suggests they are rationally avoiding non-ergodic traps (ruin).
  *   **Don't say:** "Everyone should bet Kelly."
  *   **Do say:** "Kelly provides the mathematical speed limit for compounding, but most drivers stay under the limit to avoid crashing."

  ### 5. Key Sources/Voices to Balance the Narrative
  *   **The Proponents:** Ole Peters (London Mathematical Laboratory), Ed Thorp (for the practical application), William Poundstone (*Fortune's Formula* is the bible of this genre).
  *   **The Skeptics:** Paul Samuelson (his 1971 papers on the "fallacy" of maximizing geometric mean), Harry Markowitz (who argued for mean-variance optimization rather than pure growth).
  *   **The Synthesis:** Look for writers who discuss **"Fractional Kelly."** This acknowledges the mathematical insight of Kelly while accepting the practical constraints of utility and estimation error.

  ### Summary for your Piece
  The "geometric rationality" movement has performed a valuable service by dragging the concept of **ergodicity** into the mainstream. It correctly identifies that in a multiplicative world, avoiding ruin is more important than maximizing average returns.

  However, the claim that this *refutes* expected utility theory is a category error. Log-utility (Kelly) is a valid subset of EUT. The real insight isn't that economists got the math wrong, but that they often prioritized **ensemble averages** (what happens across parallel universes) over **time averages** (what happens to one person over a lifetime).

  The most accurate headline isn't "Kelly Proves Economists Wrong," but rather: **"Kelly Reminds Us That In Investing, Survival Precedes Success."** This captures the drama without making indefensible mathematical claims.
