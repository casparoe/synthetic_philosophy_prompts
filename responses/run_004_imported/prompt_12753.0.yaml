      *   **Utility Functions:** EUT allows *any* concave utility function. Log utility ($U(W) = \ln(W)$) is one of them. Kelly is equivalent to maximizing Expected Log Utility. So Kelly *fits inside* EUT, it doesn't necessarily break it.
      *   **The "Refutation" Narrative:** Peters argues that Bernoulli introduced utility to solve the St. Petersburg paradox, but actually, the problem was non-ergodicity. If you fix the averaging method, you don't *need* utility. This is the "math error" claim.
      *   **Practical Reality:** Full Kelly is incredibly volatile (50% drawdowns are common). Most investors (even Thorp) use fractional Kelly. Why? Because humans have finite lifespans and low tolerance for ruin, even if "theoretical ruin" is avoided.

  4.  **Drafting the Response - Section by Section:**

