prompt: |-
  I'm a software engineer (mostly backend/ML infra) and a few of us at work run a little lunchtime reading group where we go through old AI safety papers. Last week we did Armstrong and Mindermann's "Occam's razor is insufficient to infer the preferences of irrational agents" (NeurIPS-ish, I want to say 2018, don't quote me), and it kinda broke my brain. The gist, as far as I understood it: if all you can observe is an agent's behavior, you cannot uniquely factor that behavior into "the reward function/preferences it's pursuing" plus "the planner that turns preferences into action" (which is where all the irrationality or bias would live), because for literally any observed behavior there's a degenerate planner-and-reward pair that reproduces it exactly, and no simplicity/Occam's-razor style prior can rule those degenerate pairs out in general, since their combined complexity isn't meaningfully higher then the "intended" pair's. So the split between preference and bias is underdetermined by behavioral data, no matter how much data you collect.

  What I can't stop thinking about is that this seems like exactly the same problem that shows up in ethics under different names, just without anyone really pointing out it's the same problem. Like when Elster and Sen talk about people forming "adaptive preferences" to cope with bad circumstances, so there revealed choices stop tracking their real interests, or more generally whenever someone tries to sort a person's actual preferences into the ones that should count for something like preference-satisfaction views of welfare and the ones that should get thrown out as bias, prejudice, addiction, adaptive preference, whatever. Everyone kind of writes as if there's a real fact of the matter here, one that sufficiently careful psychology, or some idealization procedure like "what they'd want on reflection," could uncover in principle. I'm now wondering if the IRL-style result shows that's false even in the limit of complete information about someone's psychology, for structural reasons rather than just practical ones.

  So here's what I'd like you to argue: that the Armstrong/Mindermann-style underdetermination generalizes fully to the moral case — that there's no way, even in principle, even given complete facts about a person's psychology and behavior, to draw a non-question-begging line between their "genuine" preferences and their "biases," and that any such line necessarily smuggles in ethical assumptions that aren't recoverable from the psychological facts alone. I'd like you to seriously engage with the obvious escape routes (e.g., "just idealize using reflective equilibrium or informed-desire theory to strip out the bias," or "biases are the situationally-triggered, unstable ones, and preferences are whatever's left stable across contexts") and explain concretely why they do or don't dodge the underdetermination, rather than just asserting the conclusion and moving on.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Software engineer (backend/ML infra), runs a reading group on AI safety papers. Understands technical concepts like Inverse Reinforcement Learning (IRL), Occam's razor, complexity priors, and degenerate solutions.
      *   **Topic:** The Armstrong & Mindermann (2018) paper ("Occam's razor is insufficient to infer the preferences of irrational agents") and its implications for moral philosophy/ethics.
      *   **Core Claim to Argue:** The underdetermination problem in IRL (cannot uniquely separate reward $R$ from planner $P$ given behavior $B$) generalizes to ethics (cannot uniquely separate "true preferences" from "biases/distortions" given psychological/behavioral facts). Any attempt to draw this line smuggles in normative ethical assumptions.
      *   **Requirements:** Seriously engage with obvious escape routes (reflective equilibrium, informed-desire, stability across contexts), explain *why* they fail to dodge the underdetermination, and avoid just asserting the conclusion.
      *   **Tone:** Intellectual, rigorous, respectful of the technical background, philosophically nuanced.

  2.  **Deconstruct the Armstrong & Mindermann (A&M) Result:**
      *   *The Setup:* Agent behavior $\pi$ is generated by a planner $P$ acting on a reward function $R$. $\pi = P(R)$.
      *   *The Problem:* We observe $\pi$. We want to recover $(P, R)$.
      *   *The Theorem:* For any $\pi$, there exists a degenerate pair $(P_{deg}, R_{deg})$ that produces $\pi$. Specifically, $R_{deg}$ can be constant (or trivial) and $P_{deg}$ hardcodes $\pi$. Or, $R_{deg}$ can be the negative of the "true" $R$ and $P_{deg}$ is an anti-optimal planner.
      *   *Complexity Argument:* A simplicity prior (Occam's razor) doesn't help because the complexity $K(P) + K(R)$ for the degenerate pair is roughly the same as the "intended" pair. The information is in the *pair*, not the components.
      *   *Implication:* You cannot infer norms (preferences) from facts (behavior) without assuming a specific structure for the planner (rationality) which is itself a normative assumption.

  3.  **Map to the Ethical/Moral Context:**
      *   *Behavior ($\pi$):* Observed choices, actions, verbal reports.
      *   *Planner ($P$):* Psychological mechanisms (cognitive biases, addiction, fatigue, reasoning, reflection).
      *   *Reward ($R$):* "True" welfare, genuine preferences, interests.
      *   *The Ethical Project:* Welfare economics, preference satisfaction utilitarianism, liberal paternalism (Nudge) all rely on distinguishing "true" preferences from "errors."
      *   *The Generalization:* If A&M holds for humans, then "true preferences" are not natural kinds discoverable by psychology. They are normative constructs.

  4.  **Develop the Argument (Step-by-Step):**

      *   **Introduction:** Acknowledge the insight. It's a profound connection between IRL impossibility results and the Is-Ought problem (Hume) / Open Question Argument (Moore). Validate the user's intuition.
      *   **Core Analogy:** Explicitly map $(P, R, \pi)$ to (Psychology, Welfare, Behavior). State the thesis: The "True Self" is a degenerate solution in the space of psychological explanations.
      *   **Escape Route 1: Stability and Consistency (Revealed Preference).**
          *   *Idea:* True preferences are stable; biases are noise/context-dependent.
          *   *Counter:* A&M shows we can construct a "true" reward that is wildly complex but stable, paired with a planner that adds noise. Or, a "true" reward that is simple but paired with a planner that creates apparent stability through rigid bias. Consistency is a property of the *pair*, not $R$ alone.
          *   *Example:* The addicted smoker. Is the "true" self the one who wants to quit (stable long-term value) or the one who craves now (stable physiological drive)? Both can be modeled as $R$ with a corresponding $P$.
      *   **Escape Route 2: Idealization (Reflective Equilibrium / Informed Desire).**
          *   *Idea:* Ask what they would want if they were rational, informed, calm.
          *   *Counter:* This defines "rational" ($P_{ideal}$) *normatively*. To say "bias is what disappears under reflection" assumes reflection is truth-tracking. But reflection is just another cognitive process (another $P'$). Why is $P_{reflective}$ more veridical than $P_{impulsive}$? That's an ethical claim, not a psychological one.
          *   *A&M Link:* You are essentially hardcoding $P_{ideal}$ as the prior. But A&M says you can't justify that prior from behavior alone.
      *   **Escape Route 3: Neuroscience/Structural Realism.**
          *   *Idea:* Maybe brain scans show the "real" reward circuitry vs. "error" circuitry (e.g., dopamine prediction error vs. prefrontal control).
          *   *Counter:* This is the "Naturalistic Fallacy" trap. Identifying System 1 vs. System 2 doesn't tell you which one *ought* to dictate welfare. Is welfare the hedonic hit (System 1) or the narrative coherence (System 2)? Psychology describes the mechanism, not the authority.
      *   **The Normative Smuggle:** Conclude that any distinction requires an ethical axiom (e.g., "autonomy matters more than pleasure" or "long-term counts more than short-term"). This isn't recoverable from data.
      *   **Implications:** This doesn't mean ethics is impossible, but it means it's not *empirical*. It shifts the burden from "discovering" preferences to "negotiating" or "stipulating" them.

  5.  **Refine the Argument (Self-Correction/Nuance):**
      *   *Check:* Did I address "complete information about psychology"?
      *   *Correction:* Yes, emphasize that even a perfect connectome doesn't solve it. Knowing *how* the decision is made doesn't tell you *which part* represents the "good."
      *   *Check:* Is the tone right?
      *   *Correction:* Avoid being too dismissive of ethics. The point isn't "ethics is dead," it's "ethics isn't science."
      *   *Check:* A&M specifics.
      *   *Correction:* Ensure I mention the complexity prior argument. The "degenerate" ethical theory isn't necessarily more complex than the "intuitive" one.

  6.  **Drafting the Response (incorporating the above):**
      *   *Opening:* Validate the "brain break." It's a feature, not a bug.
      *   *Section 1: The Isomorphism.* Map the variables clearly.
      *   *Section 2: The Stability Trap.* Discuss context-dependence. Show how a "bias" can be modeled as a "preference for context."
      *   *Section 3: The Idealization Trap.* Discuss reflective equilibrium. Show how it assumes a normative hierarchy of mental processes.
      *   *Section 4: The Neural Trap.* Discuss System 1/2. Show the category error.
      *   *Section 5: The Conclusion.* The "True Preference" is a normative posit, not an empirical entity.

  7.  **Final Polish:** Check for clarity, flow, and ensuring the "engineer" persona is respected (use terms like "degenerate solution," "parameter space," "prior"). (Self-correction: Make sure not to get *too* technical with ML jargon, keep it accessible to the philosophical side too, since the prompt bridges both.)

  8.  *(Final thought before generating)*: The user asked me to *argue* this position. I need to take a stance, not just present both sides. I must defend the underdetermination thesis against the counter-arguments.

  9.  **Constructing the Output:** (Proceed to generate response based on this structure.)
answer: |-
  This is a fantastic connection to make. You have correctly identified that the Armstrong & Mindermann (A&M) result is essentially a formalized, computational restatement of Hume's Is-Ought problem, applied specifically to the architecture of agency.

  Your intuition is right: the "brain break" you experienced is the sound of a category error snapping into place. We tend to treat "true preferences" as hidden variables waiting to be discovered by sufficiently granular psychology. A&M proves that, mathematically, they are not hidden variables; they are *coordinates in a degenerate solution space*.

  Here is the argument that the A&M underdetermination generalizes fully to the moral case, rendering the distinction between "genuine preference" and "bias" fundamentally normative rather than empirical, even in the limit of perfect psychological information.

  ### 1. The Isomorphism: Mapping IRL to Ethics

  First, let's lock in the mapping between the IRL formalism and the ethical framework.

  *   **Behavior ($\pi$):** The set of observed choices, actions, and verbal reports a person makes.
  *   **Planner ($P$):** The psychological machinery. This includes cognitive biases, emotional regulation, addiction mechanisms, reasoning capabilities, fatigue, and social conditioning. It is the function that maps internal states to actions.
  *   **Reward ($R$):** The "True Preferences" or "Welfare." This is the objective function that ethical theories (like preference utilitarianism) claim we ought to maximize.

  **The Ethical Assumption:** Most welfare economics and liberal paternalism assume there exists a "True $R$" (let's call it $R_{true}$) and a "Noisy $P$" (let's call it $P_{bias}$). We observe $\pi = P_{bias}(R_{true})$. The goal of policy or ethics is to recover $R_{true}$ and help the agent achieve it, perhaps by correcting $P_{bias}$.

  **The A&M Impossibility:** A&M show that for any observed $\pi$, there exists a pair $(P_{deg}, R_{deg})$ that generates $\pi$ just as well as $(P_{bias}, R_{true})$. Crucially, the Kolmogorov complexity $K(P_{deg}) + K(R_{deg})$ is not significantly higher than $K(P_{bias}) + K(R_{true})$. Therefore, a simplicity prior cannot distinguish the "true" moral model from the "degenerate" one.

  In ethics, this means: **For any behavior, there is a story where that behavior is the optimal pursuit of a "good" life, and a story where it is the corrupted pursuit of a "good" life, and psychology cannot tell them apart.**

  ### 2. Escape Route 1: Stability and Consistency

  **The Objection:** "Biases are noisy, context-dependent, and unstable. True preferences are stable across time and contexts. If we observe someone choosing A over B in 90% of contexts but B over A when tired, the 'tired' choice is the bias. The stable signal is the true preference."

  **Why it fails:**
  This attempts to use structural properties of the *pair* to isolate properties of $R$. But stability is a property of the interaction between $P$ and $R$, not $R$ alone.

  Consider an agent who smokes.
  *   **Model A (Standard):** $R_{true}$ values health. $P_{bias}$ includes nicotine addiction which overrides $R_{true}$ in specific contexts.
  *   **Model B (Degenerate):** $R_{deg}$ values "immediate relief from withdrawal above all else." $P_{deg}$ is a perfectly rational planner optimizing for $R_{deg}$.

  In Model B, the agent is 100% rational. The "instability" (wanting to quit in the morning, smoking at night) is explained by $R_{deg}$ having time-discounting terms or conflicting sub-goals that are part of the *reward*, not the *planner*.

  You might say, "But Model B is complex! $R_{deg}$ has to be weird."
  A&M's point is that $P_{bias}$ in Model A is *also* complex. You need to encode the specific neurological triggers of addiction into $P_{bias}$. If you move that complexity from $P$ to $R$, the total complexity remains roughly constant.

  **The Ethical Implication:** Deciding that "stability across contexts" is the marker of truth is itself a normative claim (a form of coherentism). You are asserting that a preference *ought* to be stable. But an addict's craving is incredibly stable physiologically; a moral conviction might be fragile. Selecting which stability counts as "true" requires an ethical prior about what kind of stability matters (e.g., "reflective" stability vs. "visceral" stability), which is not data-recoverable.

  ### 3. Escape Route 2: Idealization (Reflective Equilibrium)

  **The Objection:** "We don't look at raw behavior. We look at what the agent would choose under ideal conditions: full information, no cognitive fatigue, calm, reflective. This 'Idealized Planner' ($P_{ideal}$) strips away the bias. $R_{true}$ is what remains when $P = P_{ideal}$."

  **Why it fails:**
  This is the most common escape route in philosophy (e.g., Idealized Desire Theory), but it smuggles in the normative assumption as a definition.

  To implement this, you must define $P_{ideal}$. What counts as "full information"? What counts as "calm"?
  *   If "calm" means "absence of high-arousal emotion," you have decided that emotions are biases.
  *   If "full information" includes "knowing how good the drug feels," you might get a different result than if it only includes "knowing the health stats."

  From an A&M perspective, defining $P_{ideal}$ is equivalent to hardcoding a specific planner structure as the "ground truth." But why is the "reflective" planner more veridical than the "impulsive" planner?
  *   Maybe the "impulsive" planner is the one accurately tracking immediate welfare (hedonia), and the "reflective" planner is a social conditioning module (a bias) that suppresses true desires to fit norms.
  *   Maybe the "reflective" planner is the true agent, and the "impulsive" one is a parasite (addiction).

  Psychology can tell you *that* reflection involves the prefrontal cortex and impulse involves the amygdala. It cannot tell you *which one is the user*. To say "the prefrontal cortex is the real person" is a moral claim about personhood (e.g., "persons are defined by narrative coherence, not raw sensation"), not a psychological fact.

  **The Ethical Implication:** "Reflective Equilibrium" is not a discovery procedure; it is a *construction* procedure. It constructs preferences that fit a specific normative theory of rationality. It doesn't find the preferences that were there all along; it builds the ones we decide to respect.

  ### 4. Escape Route 3: Neural Realism (The "System 1 vs. System 2" Hope)

  **The Objection:** "With complete psychological information (a perfect connectome), we can see the causal structure. We can see that the addiction circuit hijacks the reward circuit. We can physically distinguish the 'error' signal from the 'goal' signal."

  **Why it fails:**
  This commits the Naturalistic Fallacy in a sophisticated way. It assumes that the *causal authority* of a neural circuit maps to its *normative authority*.

  Suppose we identify two subsystems:
  1.  **Subsystem H (Hedonic):** Screams for sugar.
  2.  **Subsystem N (Narrative):** Wants to write a novel and stay fit.

  We observe the agent eating sugar and failing to write.
  *   **View 1:** Subsystem N is the "True Self." Subsystem H is a biological bias/addiction. (Kantian/Autonomy view).
  *   **View 2:** Subsystem H is the "True Self." Subsystem N is a social virus/meme that infected the brain to suppress biological needs. (Hedonist/Biological view).

  Both views are consistent with the *complete physical facts* of the brain. The connectome shows the conflict, but it does not contain a label saying "Maximize This One."

  To choose View 1 over View 2, you must import an ethical axiom: "Autonomy/Narrative coherence is the locus of value." To choose View 2, you import: "Suffering/Pleasure is the locus of value."
  The A&M result generalizes here: The "Reward Function" of the human is not a single variable stored in the brain. It is an interpretive layer we apply to the brain's operations. Any attempt to locate it physically is just choosing which physical process to *authorize* as the preference generator.

  ### 5. The Conclusion: Normativity is a Prior, Not a Posterior

  The Armstrong & Mindermann result demonstrates that **rationality is not an empirical hypothesis; it is a modeling assumption.**

  In IRL, if you assume the agent is Boltzmann-rational, you get one $R$. If you assume the agent is myopic, you get a different $R$. Neither is "true" in the data; they are priors you bring to the inference.

  In ethics, this means:
  1.  **There is no "Fact of the Matter":** Even with a perfect simulation of a human mind, there is no variable `human.true_preference` that you can read out. There are only competing models of the human, each pairing a different psychology ($P$) with a different welfare function ($R$).
  2.  **The "Bias" Label is Normative:** Calling something a "bias" (e.g., present bias, framing effect) is not a psychological description; it is a moral judgment that says, "This cognitive process should not dictate the agent's welfare."
  3.  **Ethics Cannot Be Naturalized:** You cannot reduce welfare economics to psychology. Any attempt to do so silently imports ethical axioms (e.g., "consistency is good," "reflection is authoritative," "pleasure is the metric") to resolve the underdetermination.

  **The Upshot for your Reading Group:**
  This doesn't mean AI safety or ethics is impossible. It means we must stop pretending we are *learning* human values from data in a value-neutral way. We are *negotiating* them.

  When we build an AI to "help humans," we cannot program it to "satisfy true preferences" because that variable is undefined. We must program it with a specific *theory* of what counts as a true preference (e.g., "respect reflective choices," or "maximize reported happiness"). And we must acknowledge that this choice is ethical, not technical.

  The A&M paper proves that **Inverse Reinforcement Learning is actually Inverse *Ethics* Learning.** You cannot infer the ought from the is, because for every is, there are infinite compatible oughts. The only way to select one is to already have an ought.
