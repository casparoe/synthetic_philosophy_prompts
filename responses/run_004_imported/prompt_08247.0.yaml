answer: |-
  This is a incredibly delicate situation, and your disorientation is completely understandable. You are dealing with a collision between legitimate emotional hurt and a high-level philosophical framework that your brother is using to process his life.

  To answer your question directly: **He is citing a real Buddhist concept, but he is likely applying it in a way that contradicts the deeper ethical and practical teachings of Buddhism.**

  In Buddhist circles, what he is doing is often called **"Spiritual Bypassing."** This occurs when spiritual ideas are used to avoid facing unresolved emotional issues, psychological wounds, or interpersonal responsibilities.

  Here is a breakdown of where he is right, where he is missing the point, and how you might navigate this.

  ### 1. The Grain of Truth: *Anatta* (No-Self)
  Your brother is correct that *anatta* (no-self) is a core Buddhist doctrine. The teaching suggests that there is no permanent, unchanging "soul" or fixed identity. We are indeed a stream of changing mental and physical states.

  From a meditative perspective, realizing this can be liberating. It helps people stop identifying with their past mistakes as a permanent stain on their character. For someone recovering from addiction and shame, realizing "I am not my past actions" is a vital tool for staying sober and mentally healthy. If he believed he was fundamentally a "bad person," he might relapse.

  So, his sincerity is likely genuine. He isn't trying to gaslight you maliciously; he is trying to protect his own peace and articulate his transformation.

  ### 2. Where the Application Fails
  While the metaphysics are real, the application in a relationship context is flawed for several reasons rooted in Buddhist philosophy itself.

  **A. The Two Truths Doctrine**
  Buddhism distinguishes between *Ultimate Truth* (emptiness, no-self) and *Conventional Truth* (the world of names, forms, people, and consequences).
  *   **Ultimate Truth:** There is no fixed self.
  *   **Conventional Truth:** You lent money to a person, and that person did not pay it back. You invited a brother to a wedding, and he did not come.
  You cannot live your life solely in Ultimate Truth. If you step in front of a bus, the bus doesn't care about "no-self"; it will hit you. Similarly, in conventional reality, promises were broken and trust was damaged. Using Ultimate Truth to dismiss Conventional Truth is considered a misunderstanding of how the two interact.

  **B. Karma and Cause/Effect**
  Buddhism places massive emphasis on *Karma* (cause and effect). Even if the "self" is a stream, the *ripples* of actions continue down that stream.
  *   The money was taken.
  *   The wedding seat was empty.
  *   The trust was broken.
  Those are karmic seeds that were planted. Even if the "gardener" has changed, the plants are still growing in your yard. Acknowledging *anatta* does not erase the karmic consequences of past actions on others. In fact, part of clearing one's karma is making amends (in Buddhism, this is often related to *Right Action* and *Right Speech*).

  **C. Compassion (*Karuna*) vs. Intellect (*Prajna*)**
  Buddhism requires a balance of wisdom and compassion. Wisdom sees the nature of reality; compassion feels the suffering of others.
  By telling you that your hurt is a "leftover habit of thinking," he is prioritizing his intellectual understanding of wisdom over compassion for your suffering. He is essentially invalidating your pain by labeling it as "delusion." A mature practice usually leads to *more* humility and a greater desire to alleviate the suffering of others, not a philosophical shield to explain why their suffering doesn't matter.

  ### 3. Spiritual Bypassing
  The term was coined by psychologist John Welwood to describe exactly this scenario. It happens when people use spirituality to transcend feelings they haven't yet processed or to avoid the messy work of relationships.

  Recovery from addiction often involves deep shame. It is very possible that hearing you say "I'm still hurt" triggers his shame. His meditation practice has given him a vocabulary to neutralize that shame instantly ("That wasn't me, that was a past aggregate stream!"). It protects him, but it isolates you.

  ### 4. How to Move Forward
  You probably don't want to get into a theological debate with him, and you shouldn't have to. Here is how you might frame it:

  *   **Validate his growth, hold your boundary:** You can acknowledge his transformation without accepting the philosophical dismissal.
      *   *"I am so proud of how far you've come. I know the person you are today is different from the person you were then. But in the conventional world where we live as brothers, actions have impacts. The money is still gone, and I was still alone at my wedding."*
  *   **Shift from "Self" to "Impact":**
      *   *"Whether or not the 'self' is real, the impact on me was real. An apology isn't about defining who you are; it's about acknowledging what happened to me."*
  *   **The "Amends" Aspect:** In 12-step programs (which often overlap with Buddhist recovery), making amends is crucial. You might gently point out that in many recovery paths, acknowledging the harm done to others is part of the practice, not separate from it.
      *   *"I know your practice teaches you about no-self. But doesn't it also teach compassion? When I tell you I'm hurting, the compassionate response is to listen, not to tell me my hurt is based on a false premise."*

  ### Summary
  He is not making up the philosophy, but he is **weaponizing it.** He is using a sledgehammer of Ultimate Truth to crack a nut of Conventional Relationship dynamics.

  Real spiritual maturity usually looks like being able to hold both truths at once: *"I know there is no fixed self, AND I know I broke my brother's trust, and I am sorry for the pain that caused."*

  You are not wrong for wanting an apology. You are not wrong for feeling that his explanation feels like a dodge. You can honor his recovery while still asking for the basic relational courtesy of accountability.
