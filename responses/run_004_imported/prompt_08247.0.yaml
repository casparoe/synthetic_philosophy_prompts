prompt: |-
  My younger brother had a really rough stretch in his early twenties - some addiction and depression stuff - and during that time he did a couple of things that hurt our relationship pretty badly: he borrowed around $4k from me that never got paid back, and he no-showed my wedding without even a text until the next day. He's completely turned his life around since then - several years sober, way more stable, and for the last couple years he's gotten really serious about Buddhist meditation - like, multiple retreats a year serious about it.

  This all came up again over Christmas dinner, of all things. I mentioned, gently I thought, that I still feel weird about the money and the wedding and wouldn't mind actually hearing "sorry" at some point. He told me his practice has genuinely shown him that there's no continuous self, just a stream of mental states arising and passing away, so the "him" who did those things isn't really the same person as the "him" sitting across the table from me, and that staying hurt about the actions of a self that doesnt exist anymore is basically a leftover habit of thinking in terms of a fixed self that isn't really there. He wasn't being a jerk about it either, he seemed completely sincere, which somehow makes it more disorienting.

  I've dabbled in meditation myself but I honestly don't know enough about the underlying philosophy to tell if he's applying the idea correctly or just picked up a convenient half-version of it from a retreat and a meditation app. Is he onto something real here, or is he missing something important about how this concept is actually supposed to work?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
