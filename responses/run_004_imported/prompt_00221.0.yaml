answer: |-
  Here is the strongest case for the Grounding Objection, structured to dismantle the Molinist position that Counterfactuals of Creaturely Freedom (CCFs) can be true prior to God's creative decree without collapsing into determinism.

  ### The Core Principle: Truth Supervenes on Being
  To land the killer blow, you must start with a metaphysical axiom that is difficult to deny without embracing magic: **The Truthmaker Principle.**

  Simply put: *Truth requires a ground.* A proposition cannot be true unless there is something in reality (an ontological ground) that makes it true. If I say, "The cat is on the mat," that statement is true only if there is an actual cat and an actual mat arranged in that specific way. Truth does not float in the ether; it supervenes on being.

  The Molinist claims that CCFs (e.g., "If Peter were in circumstance C, he would freely deny Christ") are **contingently true** logically *prior* to God's decree to create. This is the linchpin of Middle Knowledge. If these aren't true beforehand, God can't use them to orchestrate providence. If they *are* true beforehand, we must ask: **What makes them true?**

  Here is the trilemma that breaks Molinism.

  ### 1. God Cannot Be the Ground (Or Freedom Dies)
  If God is the ontological ground of the truth of CCFs, then God determines their truth value. If God makes it true that "Peter would freely deny Christ," then Peter's action is ultimately grounded in God's will, not Peter's.

  This collapses Molinism into theological determinism (essentially Calvinism). If God determines the truth of the counterfactual, He determines the choice. The Molinist wants to say God *knows* these truths but doesn't *make* them. But if God is the only thing existing logically prior to creation, and He is the ground of all truth, He must be the ground of this truth. If you concede this to save the truth of CCFs, you sacrifice Libertarian Free Will (LFW).

  ### 2. The Creature Cannot Be the Ground (Or Existence Fails)
  The Molinist will insist the ground is the creature. They argue the truth is grounded in the agent's freedom. But this faces a fatal timing problem.

  Logically prior to the creative decree, **the creature does not exist.** Nothingness cannot ground truth. You cannot say, "Peter makes it true that he would deny Christ," when there is no Peter.
  *   **The "Essence" Defense:** Molinists (like Plantinga) often argue that CCFs are grounded in the *essence* of the agent, which exists in the mind of God.
  *   **The Rebuttal:** An essence defines *what* a thing is (e.g., rational, human), not *what specific undetermined choices* it makes. If Peter's essence necessitates that he denies Christ in circumstance C, then Peter is not free to do otherwise. His nature would determine the action. If his essence *doesn't* determine the action, then the essence cannot ground the specific truth of the counterfactual. An essence that leaves the choice open cannot make the proposition "He *would* do X" true rather than "He *would* do Y."

  ### 3. The "Brute Fact" Defense (Or Rationality Fails)
  If the Molinist admits God doesn't ground it and the non-existent creature doesn't ground it, they are forced to claim CCFs are **brute facts**. They just *are* true, without any ontological grounding.

  This is metaphysically disastrous. It posits an infinite array of contingent truths about non-existent agents that are true for no reason at all.
  *   **Violation of PSR:** This violates the Principle of Sufficient Reason. There is no explanation for why *this* counterfactual is true and not its contradictory.
  *   **Epistemic Inaccessibility:** Even if these brute facts existed, how could God know them? Knowledge requires a connection between the knower and the truthmaker. If there is no truthmaker (no ground), there is nothing for God's intellect to "latch onto." God cannot "observe" truths that are ungrounded. To claim He knows them is to claim He has knowledge of nothing.

  ### The Knockout Punch: The "Truth Before Being" Paradox
  Here is the argument you can put directly to your friend:

  > "You claim CCFs are true prior to the decree. For a proposition to be true, reality must be a certain way. Logically prior to the decree, the only reality is God. Therefore, either:
  >
  > 1.  **God makes them true:** In which case He determines the will, and Libertarian Freedom is an illusion.
  > 2.  **They are true without a maker:** In which case you are positing 'free-floating' truths detached from reality. This is metaphysical magic. If they aren't grounded in being, they aren't truths, they are fictions.
  >
  > If they are fictions, God can't know them. If they are determined by God, man isn't free. Molinism tries to walk between these two horns, but the Grounding Objection shows there is no space between them. You cannot have truth without a truthmaker, and prior to creation, there is nothing available to be the truthmaker for a specific free action except God Himself."

  ### Conclusion
  The Molinist wants a "free lunch." They want the exhaustiveness of divine providence (because God knows the future via CCFs) without the cost of determinism (because humans make the choices).

  The Grounding Objection proves this is incoherent. By placing the truth of CCFs *before* the divine decree, Molinism severs the link between truth and reality. To restore that link, you must either anchor the truth in God (determinism) or admit the truth doesn't exist yet (Open Theism or Simple Foreknowledge). There is no stable middle ground. The counterfactuals of freedom are either authored by God or they are nothing at all.
