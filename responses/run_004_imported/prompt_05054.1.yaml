answer: |-
  This is a fantastic question because it accidentally stumbled into a genuine debate in epistemology (the philosophy of knowledge) known as the **Problem of Peer Disagreement**. Philosophers have argued for decades about exactly what you and Dana are arguing about: *When someone I respect as an equal disagrees with me, how much should I downgrade my own confidence?*

  Since you asked for something more useful than "it depends," here is the breakdown of who was right, why the alcohol doesn't actually matter, and a principled framework you can use next time.

  ### 1. Is Dana's Principle Correct?
  **Verdict: No. Dana is applying a rigid heuristic that fails in practice.**

  Dana is advocating for what philosophers call the **Equal Weight View**. This suggests that if you and a "peer" disagree, you should split the difference (move to 50/50 confidence). Her argument is that the *fact* of the disagreement is evidence that you might be wrong.

  However, most contemporary epistemologists favor the **Total Evidence View**. This argues that the disagreement is just *one more piece of data* to add to the pile, not a reset button.

  **Why Dana is wrong:**
  If you are 99% sure of something because you have a vivid, specific memory ("I remember reading the liner notes"), and Dana is 99% sure based on a vague feeling ("It just sounds like him"), the fact that she disagrees shouldn't tank your confidence to a coin flip. You have to weigh *why* you believe what you believe. If you blindly followed Dana's rule, you would end up in "epistemic paralysis," where any time a smart friend disagreed with you about a restaurant reservation or a movie time, you'd be forced to abandon your own knowledge.

  ### 2. Was Caving the Right Move?
  **Verdict: Yes, but probably for the wrong reason.**

  You caved because she was "more forceful." That is a risky heuristic. Confidence does not equal accuracy (a phenomenon known as the Dunning-Kruger effect, though in trivia it's often just bluffing). Relying on volume or tone is generally a bad way to assess truth.

  **However, you likely made the right decision because of Domain Specificity.**
  You mentioned you are "peers on paper" regarding your *overall* quiz track record. But you also admitted Dana "generally knows more music trivia" due to her record store background.
  *   **General Peers:** You are equal.
  *   **Topic Peers:** On music questions, she is a **Super-Peer**.

  In a high-pressure, 10-second window, you don't have time to debate evidence. You have to rely on meta-data. The most reliable meta-data wasn't her forcefulness; it was her **historical performance in that specific category.** Deferring to the specialist is rational, even if you felt a strong gut instinct.

  ### 3. The Alcohol Wrinkle
  **Verdict: This is a red herring. It shouldn't change your assessment.**

  Two beers for an adult in a pub setting is generally below the threshold of cognitive impairment for memory retrieval tasks. In fact, in trivia contexts, a small amount of alcohol can sometimes reduce "analysis paralysis" and help people access associative memory faster.

  Unless Dana was slurring her words or struggling to hold her glass, the two beers are irrelevant to her epistemic reliability. Finding this out afterward shouldn't make you feel better ("She was drunk!") or worse ("I trusted a drunk!"). It effectively changes nothing. Do not use this to rewrite history; it's noise, not signal.

  ### 4. A Principled Framework for Next Time
  To avoid this argument in the future, you need a protocol for disagreements. Since you can't look up answers, use the **"Three-Filter Test"** before deferring.

  **Filter 1: Domain Advantage**
  *   *Question:* Does one of us have specific expertise in *this* category?
  *   *Action:* If yes, defer to the specialist immediately. (In this case: Dana/Music).
  *   *Result:* This overrides the "peer" status. You aren't peers on music; she's the lead on that portfolio.

  **Filter 2: Source Quality**
  *   *Question:* *Why* are we sure?
  *   *Action:* Quickly articulate the source.
      *   "I remember the video" (High reliability) vs. "It feels like his style" (Low reliability).
      *   "I read that recently" (High reliability) vs. "I've always assumed that" (Low reliability).
  *   *Result:* If your source is higher quality than hers, stick to your gun even if she disagrees. If her source is better, defer.

  **Filter 3: The "Intensity" Check (Use with caution)**
  *   *Question:* Is the disagreement a "guess" or a "recall"?
  *   *Action:* If you are guessing and she is recalling, defer. If you are both recalling, look at Filter 1.
  *   *Note:* Do not use "forcefulness" here. Use "specificity." "It's definitely Prince" is better than "I think it's Prince."

  ### The Bottom Line

  **You were right to cave.**
  Not because Dana's philosophy is correct (it's too extreme), and not because she was forceful (a bad metric), but because she is the designated music expert on your team. In a team dynamic, specialization is more efficient than democracy.

  **Dana is wrong about the principle.**
  She cannot claim that *any* disagreement reduces you to a coin flip. That undermines the value of your own knowledge. She should concede that her music expertise was the deciding factor, not the mere fact of her disagreement.

  **The Alcohol is irrelevant.**
  Drop it from the argument. It adds emotional weight but no logical value.

  **How to resolve the argument:**
  Tell Dana: *"I looked into the philosophy of this. You're advocating for the 'Equal Weight View,' but since you have domain expertise in music, you aren't my epistemic peer on this question. I deferred to your expertise, not your disagreement. But your rule that I should always drop to 50% confidence when you disagree is logically unsound."*

  That should settle it.
