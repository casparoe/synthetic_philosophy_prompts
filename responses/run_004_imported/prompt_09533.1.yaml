      *   *Nuance:* If "Sycophancy" isn't an option (user said "separate sliders for... sycophancy"), then it's Honesty *defined as* omission of critical context. But given the prompt, Sycophancy is the intended bucket.
      *   *Wait, check the prompt again:* "separate sliders for stuff like helpfulness, sycophancy, and honesty/deception". Okay, Sycophancy is available.
