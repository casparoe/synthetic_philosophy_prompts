answer: |-
  The silverware seemed louder than usual against the china, though Mrs. Grafton smiled bravely from the head of the table. The summer heat hung heavy in the dining room, pressing against the open French windows.

  **1.**
  **Mrs. Aldous:** "It comes down to infection, Mr. Fenn. If a man paints a picture, or writes a book, and I do not feel precisely what he felt while making it, then he has failed. It is not art; it is merely a puzzle for the cultivated."
  **Gerald Fenn:** "But surely, Mrs. Aldous, that confuses art with sympathy. I don't need to feel the painter's grief to admire his composition. The value lies in the relations of lines and colours themselves—what my friends in London are calling 'significant form.' The emotion is aesthetic, not personal."

  **2.**
  **Mrs. Aldous:** "Aesthetic emotion is a luxury of the drawing-room. Tolstoy asked whether a work could move a ploughman as deeply as a prince. If your lines and colours require a education in Paris to decipher, they are not uniting men; they are dividing them."
  **Gerald Fenn:** "And if the ploughman cannot see the form, do we deny the form exists? You suggest art must be dumbed down to the lowest common denominator of feeling. That isn't unity; it's levelling."

  **3.**
  **Mrs. Aldous:** "It is not levelling to demand sincerity. Complexity is often just a mask for insincerity. Tolstoy himself admitted it. By his own test, *War and Peace* is bad art. It appeals to pride and history, not brotherhood. Only his later peasant tales pass."
  **Gerald Fenn:** "He condemned his own masterpiece? That is a high price for consistency. You would burn the cathedral because the stonemason cannot read the Latin? You sacrifice the height of human achievement to ensure everyone can climb the first step."

  **4.**
  **Mrs. Aldous:** "I would rather have a humble bridge that everyone can cross than a tower only the few can see. If art does not serve life, if it does not bind us together in a common feeling, what is it for? Decoration for the wealthy while the world suffers?"
  **Gerald Fenn:** "It is for freedom, Mrs. Aldous. Precisely because the world suffers, we need a realm that is not utilitarian. If I paint a bowl of fruit, I am not feeding the hungry, but I am creating order out of chaos. That order has value independent of its moral utility."

  **5.**
  **Mrs. Aldous:** "Order without morality is just arrangement. We are standing on a precipice, Mr. Fenn. I feel it in the air. In times like these, art that refuses to speak to the human condition is complicit in the silence."
  **Gerald Fenn:** "And art that insists on preaching becomes a pamphlet. If I paint to teach a lesson, I am no longer an artist; I am a propagandist. I refuse to let my work be judged by how well it serves a cause, even a noble one."

  **6.**
  **Mrs. Aldous:** "Then you accept that your art is a private language. You are content to speak to the initiated while the house burns down."
  **Gerald Fenn:** "I am content to keep the light burning, however small. If your universal feeling requires the extinction of complexity, then I fear our definitions of 'art' are simply too far apart to bridge."

  **7.**
  **Mrs. Aldous:** "Perhaps they are. You seek perfection in the object; I seek it in the connection between souls."
  **Gerald Fenn:** "And you seek a handshake where I seek a vision. I suppose we shall have to agree that the evening is too lovely for such grim verdicts."

  **8.**
  **Mrs. Aldous:** "Indeed. Though I suspect the war will decide which of us was right."
  **Gerald Fenn:** "Let us hope the war decides nothing about art. Some things must remain outside its reach."

  *(Mrs. Grafton seized the pause to signal for the wine to be poured, though neither character looked at the glass.)*
