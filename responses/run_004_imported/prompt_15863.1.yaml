answer: |-
  Good morning, and welcome to "Testing for Hidden Minds."

  Looking around this room, I see a divide that is often treated as a chasm. On one side, we have researchers for whom intelligence is an engineering problem, defined and resolved by performance on benchmarks. On the other, we have philosophers and investigators concerned with the nature of mind itself, including colleagues who study anomalous cognition through carefully pre-registered protocols.

  Usually, these groups talk past one another. The machine learning researchers view the philosophers as obsessed with unmeasurable ghosts. The philosophers view the engineers as behaviorists ignoring the black box.

  But I want to start with a historical footnote that suggests we are all standing on the same shaky ground.

  We are gathered under the shadow of Alan Turing's 1950 paper, "Computing Machinery and Intelligence." It is the founding text for the benchmark approach. Yet, many of us forget that the same paper contains Turing's extended treatment of the "Argument from Extrasensory Perception."

  Turing did not dismiss ESP out of hand. He did not mock it. Instead, he treated it as a legitimate statistical objection to his own Imitation Game. He worried that if telepathy were real, a human contestant could use it to guess cards or read the interrogator's mind, thereby outperforming a machine not through intelligence, but through a hidden channel. He took the card-guessing statistics seriously enough to worry that a telepathic human would make the game unfair to the machine. He even half-seriously proposed running the test inside what he called a "telepathy-proof room."

  Why does this matter for us, today?

  For my colleagues in machine learning: Turing's digression is a reminder that behavioral sufficiency is not ontological proof. You argue that if a model behaves intelligently, it is intelligent. But Turing recognized that behavior can be confounded by hidden variables. If a human wins the game via telepathy, the behavioral output is identical to high intelligence, but the mechanism is entirely different. A benchmark measures output, not process. It assumes a closed system. Turing knew that if the system isn't closed—if there are hidden minds or hidden channels—the benchmark breaks. It should make us a little less smug about what a score actually settles.

  For my colleagues in philosophy and parapsychology: Turing's approach offers a mirror. He did not ask whether ESP was *true* in a metaphysical sense. He asked whether it was a *nuisance variable* that needed controlling. This is the heart of your work with pre-registration and ganzfeld protocols. You are attempting to build Turing's "telepathy-proof room" using statistics rather than lead lining.

  But here is the candid truth we must face: Pre-registration controls for bias, but it does not control for ontology. Just as a benchmark cannot prove a machine understands, a statistically significant anomaly cannot prove psi exists. It only proves that the current model of the world is incomplete. Turing was willing to accept ESP as a possibility *if* the statistics held, but he remained agnostic on the mechanism. We must be equally candid. Methodological rigor narrows the field of doubt, but it does not eliminate the need for interpretation.

  So, what brings us together?

  We are all in the business of inference. We are trying to detect a hidden property—whether we call it intelligence, consciousness, or anomalous cognition—using visible proxies. We are all struggling with the same problem: How do we test for a hidden mind when the test itself might be leaking?

  The ML researchers here are testing for a hidden mind inside the silicon. The parapsychologists are testing for a hidden mind inside the human that bypasses the senses. Both efforts require us to admit that our tests are imperfect maps of reality.

  Turing's legacy is not just the test that bears his name. It is the intellectual humility to admit that even the best test can be confounded by things we do not yet understand. He didn't shut down the conversation about ESP; he invited it into the room so he could control for it.

  Over the next two days, I ask that we do the same. Let us not use our methodologies as shields. Let the engineers admit that benchmarks do not capture the whole of mind. Let the philosophers admit that statistical significance does not capture the whole of truth.

  If we can treat each other's "hidden variables" with the same serious, agnostic rigor that Turing applied to telepathy, this workshop will be a success.

  Thank you, and let's begin.
