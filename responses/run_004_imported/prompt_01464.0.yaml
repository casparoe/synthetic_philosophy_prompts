answer: |-
  The smoke in the Eagle and Child hung low, a blue-grey ceiling over the wooden settles. It was past eight. The Convocation had adjourned an hour before, the result tallied, the noise of the crowd still ringing in their ears.

  Arthur stirred his bitter, staring into the foam. Bernard lit a pipe, the match flare illuminating a face tired from shouting.

  "You know," Bernard said, tapping the ash into the tray, "when people write the history of this university, they'll mention the vote. They'll mention the four names. Yours among them."

  "Someone had to register the dissent," Arthur said quietly. "If the University of Oxford confers honors without regard for justice, it ceases to be a university. It becomes a trade guild for politicians."

  "Truman is a politician who ended a war," Bernard countered. "A war that, by the autumn of '45, had already consumed sixty million souls. You speak of justice. I speak of the alternative. Operation Downfall. The projections were half a million American dead. Millions of Japanese. Civilians included, Arthur. In the invasion, there is no double effect. There is only slaughter."

  "And so we accept the principle that one may murder the innocent to save the guilty?" Arthur looked up. "That is what Truman did. He chose the atomic destruction of Hiroshima and Nagasaki not as a side effect of hitting a military target, but as the very method of coercion. He chose to kill the innocent as a means to his ends. That is always murder."

  Bernard leaned forward. "Let's be precise about your 'innocent.' You don't mean sinless. A civilian working in a munitions factory is hardly a pacifist."

  "I mean 'not harming,'" Arthur corrected. "It is a technical distinction. A soldier who has surrendered is innocent, though he was guilty an hour prior. A civilian making shells is contributing to harm, yes. But the populations of those cities were not targeted because they were making shells. They were targeted *because* they were civilians. The terror was the point. To blur that distinction is to say there is no limit to what may be done in war."

  "The distinction was blurred long before Truman," Bernard said, exhaling a cloud of tobacco. "Dresden. Tokyo. The Blockade of Germany. We were fighting total war. The enemy made no distinction; why should we bind our hands while they sharpened their knives? If you insist on fighting with one hand tied behind your back because the other hand might touch a non-combatant, you lose. And if you lose, the tyrant wins. Is that the moral outcome you desire?"

  "It is not about winning at any cost," Arthur said. "It is about what kind of victory you claim. And do not pretend Hiroshima was inevitable. It was a consequence of the policy of Unconditional Surrender. That was a choice, Bernard. A political choice. We could have negotiated terms that guaranteed the Emperor's position earlier. We chose a policy that required the total subjugation of the enemy, and then we used the bomb to enforce that specific policy. We cannot claim the bomb was the only way when we closed the other doors ourselves."

  Bernard swirled his drink. "Armchair statecraft. It's easy to negotiate when you aren't the one signing the burial orders for the boys on the beaches. You think I like the calculus? I don't. But leadership is the burden of choosing the least terrible option in a world that has gone mad."

  "Is it?" Arthur pressed. "Let's test your calculus. Suppose you could prevent a disaster befalling a million people only by boiling one baby alive. Would you do it?"

  Bernard paused. The smoke seemed to thicken. "That is a grotesque hypothetical."

  "It is the logical endpoint of your position. If the good of the million outweighs the rights of the one, you must boil the baby. If you say you wouldn't, you admit there is a line that cannot be crossed, regardless of the consequences. And if there is a line, Truman crossed it."

  "I would not boil the baby," Bernard said slowly. "But I would drop the bomb to stop a war that was already boiling millions. There is a difference between active cruelty and the tragic acceptance of collateral damage in the cessation of hostilities."

  "There is no difference in the intention," Arthur insisted. "In both cases, you are using the death of the non-harming as a tool. If Oxford honors that, we tell the world that effectiveness sanctifies the method. We tell the next Truman that if the numbers are big enough, murder becomes statecraft."

  "And if we *don't* honor him?" Bernard asked, his voice hardening. "We signal that we believe purity of conscience is more valuable than the peace that followed. You sit here, safe in your common room, protected by the very order Truman helped secure. You can afford to be absolute. I have to live in the world he saved, even if it's stained."

  Arthur finished his beer and set the glass down firmly. "Then we are at an impasse. You think I am complicit in future deaths by refusing to honor a murderer. I think you are complicit in past murders by honoring him."

  "Perhaps," Bernard said, signaling for another round. "But history is written by the survivors, Arthur. Not the pure."

  "Then let us hope," Arthur replied, picking up his cap, "that history remembers more than just who survived."

  They sat in silence as the match flared again, two shadows on the wall, neither yielding an inch.
