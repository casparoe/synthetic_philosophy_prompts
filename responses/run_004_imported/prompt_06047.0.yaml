prompt: |-
  A friend and I spent most of a long dinner arguing about whether there is any principled way to stop expected-value reasoning from being hijacked once the claimed stakes get large enough, and I left the table unconvinced by my own side of it -- which is inconvenient, since a version of exactly that disagreement has landed on my desk this week in a form I actually have to resolve.

  I sit on the five-person allocations committee of a small philanthropic foundation (roughly $4 million a year) whose charter commits us to funding "neglected, high-uncertainty research with the greatest expected impact on human welfare," ranked each cycle by a standard cost-effectiveness model. This round we received a proposal from a credentialed physicist requesting $2.4 million -- three-fifths of our entire budget -- to fund a legal and public-advocacy campaign aimed at delaying a newly proposed particle collider experiment. The proposal accepts the experiment's own safety review, which concludes the risk is not credible, but argues that "not credible" is not the same as "zero," and assigns the possibility of a stable, Earth-consuming micro black hole a probability of one in ten billion per run of the machine -- a figure derived from a minority reading of the physics that most physicists reject but cannot entirely disprove. Run through our own cost-effectiveness model, the proposal's expected value swamps every other line item combined, including our two best-evidenced grants -- a bed-net distribution program and a lead-paint remediation program -- each with a well-documented, modest, per-dollar impact. Three committee members want to fund it, on the grounds that the whole point of binding ourselves to a model is to follow it precisely when its conclusion feels wrong, not only when it happens to agree with our intuitions. The other two call it a textbook Pascal's mugging and want to reject it, but under questioning neither could produce a rule for doing so that would not also have zeroed out, ex ante, a pandemic-early-warning grant we made years ago that looks structurally identical on paper and that most of us now count among our best decisions.

  Could you draft the memo I need to bring to Monday's meeting? I need a specific recommendation on this proposal -- fund it, reject it, or fund some capped amount, and why -- a decision rule the committee could state and apply consistently to future proposals of this shape, and a fair, undefensive treatment of the strongest argument for simply trusting the number wherever it leads.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user sits on a 5-person allocations committee for a small philanthropic foundation ($4M/year budget).
      *   **Charter:** "Neglected, high-uncertainty research with the greatest expected impact on human welfare," ranked by a standard cost-effectiveness model.
      *   **The Proposal:** $2.4M (60% of budget) for a legal/advocacy campaign to delay a particle collider.
      *   **The Claim:** Risk of Earth-consuming micro black hole is 1 in 10 billion per run. Safety review says "not credible," but proponent says "not zero."
      *   **The Math:** Expected Value (EV) calculation swamps all other grants (bed nets, lead paint, etc.).
      *   **The Conflict:** 3 members want to fund (follow the model); 2 members want to reject (Pascal's Mugging).
      *   **The Problem:** The "reject" side can't articulate a rule that doesn't also kill a past successful grant (pandemic early-warning) that looked similar structurally.
      *   **The Task:** Draft a memo for Monday's meeting.
      *   **Requirements:**
          1.  Specific recommendation (Fund, Reject, or Cap).
          2.  Decision rule for future consistency.
          3.  Fair treatment of the "trust the number" argument.
          4.  Resolve the user's personal uncertainty (they were unconvinced by their own side in the dinner argument).

  2.  **Deconstruct the Ethical/Decision-Theoretic Problem:**
      *   **Pascal's Mugging:** This is the core philosophical issue. When low probability $\times$ high stakes $>$ high probability $\times$ low stakes, does the model break?
      *   **The "Pandemic Grant" Counter-Example:** This is crucial. It shows that *some* low-probability/high-impact bets are good. The distinction must lie in the *quality of evidence* for the probability estimate, not just the structure of low $P$ $\times$ high $V$.
      *   **Epistemic Humility vs. Model Blindness:** Blindly following the model ignores the uncertainty *in the probability estimate itself*. A claimed $10^{-9}$ risk based on a "minority reading" is epistemically different from a $10^{-9}$ risk based on robust statistical modeling.
      *   **Opportunity Cost:** Funding this uses 60% of the budget. If the probability is wrong (which is likely, given the physics consensus), the opportunity cost is massive (bed nets, lead paint).
      *   **Institutional Role:** The foundation's charter mentions "high-uncertainty research," but also "greatest expected impact." Does advocacy count as research? (The prompt says "legal and public-advocacy campaign," but the charter says "research." This might be a technicality, but the core issue is the EV calculation). Let's assume the advocacy is the means to the end (safety).
      *   **The "Credence" vs. "Probability" Distinction:** The model treats the input probability as a hard number. In reality, it's a *distribution* of credence. If the physics community rejects the premise, the "true" probability is likely orders of magnitude lower, or the argument is category-error nonsense.

  3.  **Formulate the Recommendation:**
      *   *Option A: Fund.* Risks wasting 60% of budget on a likely false premise. Undermines actual impact.
      *   *Option B: Reject.* Risks ignoring tail risks. Needs a robust rule to avoid killing the pandemic grant.
      *   *Option C: Cap/Fund Partial.* Doesn't solve the EV problem (if EV is infinite/high, any amount is justified).
      *   *Decision:* **Reject.** But with a nuanced rationale that saves the pandemic grant precedent.
      *   *Why?* The probability estimate lacks *epistemic justification*. It is not just "uncertain"; it is *contested by the relevant epistemic authority* without new evidence. The pandemic grant likely had a stronger evidentiary basis for its risk assessment (e.g., historical data on zoonotic spillover vs. speculative minority physics).

  4.  **Develop the Decision Rule:**
      *   Need to distinguish between "Knightian Uncertainty" (unknown unknowns) and "Speculative Tail Risk" (known unknowns with weak priors).
      *   **Rule:** *Epistemic Weighting.* Probabilities used in EV calculations must be discounted by the *consensus confidence* in the underlying model generating that probability.
      *   **Alternative Rule:** *Bounded Rationality / Kelly Criterion approach.* Don't bet the farm on a single low-credence hypothesis.
      *   **Best Rule for this Context:** **The "Epistemic Robustness Threshold."** A probability estimate $P$ can only be entered into the EV model if it meets a minimum standard of evidentiary support (e.g., peer consensus, historical frequency, or reproducible modeling). If $P$ is derived from a minority view rejected by domain experts without new data, it is treated as "unquantified uncertainty" rather than a numeric probability.
      *   *How this saves the Pandemic Grant:* Pandemic risk is based on historical frequency and epidemiological models (robust). Collider risk is based on a theoretical outlier (non-robust).

  5.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Executive Summary:** Clear recommendation (Reject).
      *   **The Core Tension:** Acknowledge the Pascal's Mugging vs. Longtermism debate. Validate the "trust the model" side (it's intellectually honest).
      *   **Analysis of the Probability:** This is the pivot point. The $10^{-9}$ isn't a "risk," it's a "claim." Distinguish between *aleatory uncertainty* (inherent randomness) and *epistemic uncertainty* (we don't know the model). The collider risk is almost entirely epistemic.
      *   **The Decision Rule:** Propose the "Epistemic Robustness" filter.
      *   **Addressing the Pandemic Precedent:** Explain why that grant passes the filter (empirical basis vs. theoretical speculation).
      *   **Opportunity Cost:** Remind them of the bed nets/lead paint.
      *   **Conclusion:** Reiterate the commitment to the charter without falling into the trap.

  6.  **Refining the Tone:**
      *   Must be respectful to the 3 members who want to fund. Their position is philosophically defensible (longtermism).
      *   Must be firm on the decision.
      *   Must sound like it comes from a committee chair/peer, not an outside lecturer.
      *   Needs to address the user's personal doubt (the "dinner argument"). The memo should help *them* feel confident in the rejection.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is "Epistemic Robustness" too vague?
      *   *Fix:* Define it concretely. Requires alignment with domain consensus or empirical baseline rates.
      *   *Critique:* Does this violate the "high-uncertainty" charter?
      *   *Fix:* No. "High-uncertainty" refers to *outcomes*, not *premises*. We can be uncertain if a drug works, but we must be certain the biology is plausible.
      *   *Critique:* What if the physicist is right?
      *   *Fix:* Acknowledge the regret risk. But institutional decision-making requires process integrity over single-outcome luck.

  8.  **Final Polish:** Check against all constraints in the prompt.
      *   Specific recommendation? Yes (Reject).
      *   Decision rule? Yes (Epistemic Robustness/Consensus Discount).
      *   Fair treatment of "trust the number"? Yes (Section on "The Integrity of the Model").
      *   Address the pandemic grant? Yes.

  9.  *(Final thought on the "Dinner Argument"):* The user was unconvinced by their own side (presumably the "reject" side). The memo needs to provide the intellectual ammunition they lacked at dinner. The key insight is that *probabilities are not inputs, they are outputs of a model.* If the model is disputed, the input is invalid.

  10. **Drafting the Content:** (Proceeding to generate the memo based on these thoughts.)
answer: |-
  **MEMORANDUM**

  **TO:** Allocations Committee
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Proposal 24-B (Particle Collider Advocacy) and Decision Rule for Tail-Risk Modeling

  ### Executive Summary

  After reviewing the cost-effectiveness model, the physics literature, and our charter commitments, I recommend we **reject** Proposal 24-B in its current form.

  While the proposal's expected value (EV) calculation mathematically dominates our portfolio, the input probability ($1 \times 10^{-9}$) lacks the *epistemic robustness* required for institutional decision-making. Treating a contested theoretical claim as a hard probability input violates the spirit of our cost-effectiveness model, which relies on estimable risks, not unverified speculation.

  To resolve the tension between this decision and our past support for the pandemic early-warning grant, I propose we adopt a formal **Epistemic Robustness Threshold**. This rule allows us to fund high-impact, low-probability interventions without succumbing to Pascal's Mugging, ensuring consistency for future cycles.

  ### The Core Tension: Model Integrity vs. Model Blindness

  The argument for funding this proposal is intellectually serious and deserves a fair hearing. It rests on two pillars:

  1.  **Consistency:** Our charter commits us to maximizing expected impact. If we ignore the model when the conclusion feels counterintuitive, we are effectively substituting our gut feelings for our agreed-upon methodology.
  2.  **Asymmetry of Error:** If we reject this grant and the catastrophe occurs, the cost is infinite (human extinction). If we fund it and the risk was nonexistent, the cost is limited ($2.4M). In a strict EV framework, the infinite downside of inaction swamps the finite cost of action.

  These points are valid. A foundation that only funds "safe" bets fails its mandate to address neglected, high-uncertainty risks. If we dismiss this proposal solely because the probability feels too small, we risk blinding ourselves to genuine existential threats that initially appear improbable.

  However, there is a distinction between *trusting the model* and *trusting the input*. Our cost-effectiveness model is a tool for processing evidence, not a generator of truth. It assumes the inputs reflect the best available knowledge. In this case, the input probability does not reflect the best available knowledge; it reflects a minority hypothesis explicitly rejected by the relevant epistemic authority (the broader physics community and the experiment's safety review).

  ### The Decision Rule: Epistemic Robustness Threshold

  To distinguish this proposal from the pandemic early-warning grant (which we correctly funded), we must distinguish between **aleatory uncertainty** (inherent randomness in a known system) and **epistemic uncertainty** (ignorance about how the system works).

  **The Rule:**
  *For any proposal where the Expected Value is driven primarily by a low-probability, high-stakes scenario, the probability estimate ($P$) must meet an Epistemic Robustness Threshold. $P$ is admissible only if:*
  1.  *It is derived from empirical frequency data (e.g., historical pandemic rates); OR*
  2.  *It is derived from a model that represents the consensus view of domain experts; OR*
  3.  *If it relies on a minority view, it must present new empirical evidence that materially shifts the prior probability, rather than merely reinterpreting existing theory.*

  **Application to Proposal 24-B:**
  The $1 \times 10^{-9}$ risk figure fails this test. It is based on a theoretical reinterpretation of existing physics without new empirical data. The consensus of the relevant domain is that the risk is negligible. Therefore, the number cannot be entered into the EV model as a hard probability. It must be treated as "unquantified uncertainty," which does not justify displacing high-confidence interventions.

  **Application to the Pandemic Grant (Precedent):**
  Our pandemic early-warning grant passes this test. The probability of zoonotic spillover was not based on a minority theoretical reading, but on historical frequency data (aleatory uncertainty) and epidemiological models that represent the consensus view. The *outcome* was uncertain, but the *risk model* was robust.

  ### Opportunity Cost and Institutional Mandate

  We must also consider the opportunity cost in light of our charter. We have $4 million to deploy toward "human welfare."

  *   **Scenario A (Fund Proposal 24-B):** We allocate 60% of our budget to delay a machine that experts say is safe. If the physics consensus is correct (as it has been repeatedly for decades), we have sacrificed thousands of lives saved via bed nets and lead remediation for a risk that did not exist.
  *   **Scenario B (Reject Proposal 24-B):** We fund proven interventions. If the minority physicists are right, the consequences are catastrophic.

  However, as a foundation, we are not buying insurance for the universe; we are allocating capital to improve welfare based on the *best available evidence*. If we allocate capital based on every non-zero probability claim that cannot be strictly disproven, we will be paralyzed by the sum of infinite speculative risks. We must act on the weight of evidence, not the mere possibility of error.

  ### Recommendation

  **1. Reject Proposal 24-B.**
  The probability input is epistemically unsupported. Funding it would set a precedent that allows any applicant to bypass evidence-based prioritization by positing an unfalsifiable catastrophe.

  **2. Adopt the Epistemic Robustness Threshold.**
  Formalize the rule outlined above for future cycles. This protects us from Pascal's Mugging while preserving our ability to fund genuine tail-risk mitigation (like pandemic preparedness or asteroid deflection) where the risk models are empirically grounded.

  **3. Engage the Proponent.**
  We should invite the physicist to resubmit if they can produce new empirical data or a consensus shift among domain experts that satisfies the Robustness Threshold. We are not rejecting the *concern*; we are rejecting the *evidentiary standard* currently offered.

  ### Conclusion

  We are not abandoning expected-value reasoning; we are refining it. A model is only as good as its inputs. By requiring epistemic robustness for probability estimates, we honor our commitment to high-uncertainty research without surrendering our judgment to speculative mathematics. This allows us to sleep at night knowing we maximized impact based on what we *know*, rather than what we *fear*.

  I look forward to discussing this framework on Monday.
