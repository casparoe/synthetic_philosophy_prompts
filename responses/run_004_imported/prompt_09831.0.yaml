  7.  (Mental Check of the "Weak Discernibility" technicality): Saunders (2006) is the big name here. He argues fermions are weakly discernible. Bosons are the problem. Some argue bosons are weakly discernible via occupation numbers, but that shifts the ontology from particles to fields/modes. I should mention that shifting ontology is an admission that PII fails for *particles*.

  8.  **Finalizing the Argument Structure:**
