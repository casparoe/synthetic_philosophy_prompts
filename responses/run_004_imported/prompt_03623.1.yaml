      Actually, a stronger version of the objection (Briggs) is that the Reflection DDB requires the Bookie to know the Agent's future credence *at the time of the initial bet* to construct the specific combination of bets, whereas in Conditionalization, the Bookie can construct a strategy that covers all possible $E$'s (a "master strategy") without knowing which $E$ will occur.
