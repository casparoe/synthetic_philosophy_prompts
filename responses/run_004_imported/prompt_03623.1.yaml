      If the Bookie doesn't know whether $P_1(A)=r$ will obtain, can they offer the bet? Yes, it's a conditional bet. "I bet you \$10 that A is true, *if* your credence in A tomorrow is 0.8."
      The problem arises at settlement ($t_1$). The Bookie needs to know if the condition "$P_1(A)=0.8$" was met. The Agent knows. The Bookie doesn't. The Agent has an incentive to lie to void the bet if it's losing for them.
