answer: |-
  This is a profound tension, and you have put your finger on exactly the spot where Hume's political philosophy is both most brilliant and most vulnerable. As a moderator, you are living through a Humean case study: you are watching a "convention" (in Hume's specific sense) collide with the expectation of explicit governance.

  To answer your question directly: **No, it is not a logical gap in Hume's argument, but it is a psychological leap that relies on a specific theory of human sentiment.** Lewis clarifies the *mechanics* of the convention (how we know without talking), but he deliberately sidesteps the *normativity* (why we feel bound) that Hume is trying to construct.

  Here is how to reconcile Hume's "mutual expression" without promises, how he gets from prudence to justice, and where Lewis fits in.

  ### 1. What "Mutually Express'd" Means (Without Speech)

  Your confusion stems from reading "express'd" as a speech act (like saying "I agree"). For Hume, following his empiricist constraints, "expression" here is **behavioral signaling.**

  When Hume says the sense of interest is "mutually express'd," he does not mean a town hall meeting or a written charter. He means that Agent A acts in a way that signals their interest, and Agent B observes it and reciprocates.

  Consider the rowing example Hume uses. Rower A pulls hard. Rower B sees this, realizes the boat will spin if he doesn't match the rhythm, and pulls hard. Rower A sees B matching him and continues.
  *   **The Expression:** A's stroke *expresses* "I am committing to this rhythm."
  *   **The Knowledge:** B *knows* A is committed because A is doing it.
  *   **The Agreement:** The synchronization itself *is* the agreement.

  In your online community, the "unwritten rule" was expressed not by a post stating the rule, but by thousands of instances of people following it and receiving positive reinforcement (likes, lack of conflict, smooth discussion). The "expression" is the pattern of behavior itself. When you break the rule now, you aren't just breaking a rule; you are disrupting the signal that holds the coordination together.

  ### 2. From Self-Interest to Obligation (The Normative Leap)

  This is the harder part. How does "it is wise to coordinate" become "it is *unjust* to defect"?

  Hume is an anti-rationalist about morality. He doesn't believe obligation descends from reason or divine law. For Hume, **obligation is a sentiment.**

  1.  **Stage 1: Prudence.** Initially, the convention is merely self-interested. I respect your property (or follow your forum rule) because it benefits me to live in a stable system. If I defect, I might gain short-term, but I risk the system collapsing.
  2.  **Stage 2: Sympathy and Time.** Over time (the "slow progression" Hume mentions), we develop a sympathy for the public good. We see that the *system* of rules benefits everyone, including those not currently involved in a specific transaction.
  3.  **Stage 3: Artificial Virtue.** Hume calls justice an "artificial virtue." It is constructed. Once the convention is established, our psychological machinery re-codes the violation. It is no longer just "unwise" (bad for me); it becomes "vice" (painful to the spectator).

  So, the "normative standing" doesn't come from the convention itself magically creating duty. It comes from **human psychology reacting to the utility of the convention.** When you break the unwritten rule, you cause a specific kind of pain to the community: the anxiety of uncertainty. Hume argues we are wired to feel moral disapproval toward actions that cause that specific social anxiety.

  Therefore, the "gap" you perceive is actually Hume's bridge: **Utility + Sympathy + Time = Moral Obligation.**

  ### 3. Does Lewis Close the Gap?

  David Lewis's *Convention* (1969) is often read as a modernization of Hume, but it is actually a **reduction** of Hume.

  **What Lewis Solves:**
  Lewis solves the epistemic puzzle you identified: *How can we coordinate without communicating?*
  He introduces **Common Knowledge**.
  *   I know that you know that I know... that we both prefer to coordinate.
  *   Lewis uses Game Theory to show that once a Coordination Equilibrium is reached, it becomes rational to stay there.
  *   This technically formalizes Hume's "mutually express'd and known." It explains *how* the unwritten rule sticks without a vote.

  **Where Lewis Retreats:**
  Lewis explicitly strips away Hume's moral project. Lewis is analyzing *rationality*, not *justice*.
  *   For Lewis, a convention creates a **rational requirement** (if you want to coordinate, you ought to follow the rule), but not necessarily a **moral obligation**.
  *   Lewis admits that conventions can be arbitrary. (We drive on the left or the right; it doesn't matter, as long as we agree).
  *   Hume, however, is trying to prove that property and justice are *necessary* for society, not arbitrary.

  **The Verdict on Lewis:**
  Lewis does not close the normative gap; he **relocates** it. He explains perfectly why your community follows the rule (it's a coordination equilibrium supported by common knowledge). But he cannot explain why breaking it feels *unjust* rather than just *inefficient*. To get the "unjust" part, you still need Hume's theory of moral sentiments.

  If you rely only on Lewis, the person breaking the rule can say: *"I have found a new equilibrium that works better for me. The old rule was arbitrary."* Lewis has no answer to this other than "you might fail to coordinate." Hume has an answer: *"You are damaging the fabric of trust that allows society to function, and that triggers our moral disapproval."*

  ### 4. Application to Your Community

  You are stuck because you are looking for a Lewisian solution (explicit agreement, voting, codification) to a Humean problem (the erosion of a tacit convention).

  *   **The Grip of the Rule:** The rule has grip not because it is "right" in the abstract, but because it is a **focal point** (to use Thomas Schelling's term, influenced by Lewis). It is the solution everyone expects everyone else to use.
  *   **The Controversy:** The controversy exists because the "common sense of interest" is no longer common. A subset of the community no longer feels the utility of the rule, or the "expression" of the rule has become ambiguous.
  *   **The Moderator's Dilemma:** If you try to codify the rule (make it a promise/contract), you change its nature. You move it from a Humean *convention* (based on shared sentiment and utility) to a Hobbesian *law* (based on authority and sanction).
      *   **Humean approach:** Remind the community of the *utility* of the rule. Re-establish the "common sense of interest." Show how the rule benefits the collective peace.
      *   **Lewisian approach:** Treat it as a coordination game. If the community is split between two equilibria (Old Rule vs. New Rule), you must act as a signal to push everyone to one focal point.

  ### Summary

  Hume is not contradicting himself. "Mutually express'd" refers to **tacit behavioral signaling**, not explicit speech. The move from self-interest to obligation is achieved through **time and moral sentiment**, not logic.

  Lewis provides the technical machinery for how the signaling works (Common Knowledge), but he abandons Hume's attempt to ground moral obligation in that signaling. Lewis explains why we *do* follow the rule; Hume explains why we feel we *should*.

  In your community, the "unwritten rule" is losing its grip because the **common knowledge** is fracturing (people no longer know if others support it) and the **sense of common interest** is disputed. You cannot restore it by appealing to logic (Lewis); you must restore it by re-aligning the community's sentiment regarding their shared interest (Hume).
