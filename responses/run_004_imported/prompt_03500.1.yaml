answer: |-
  Your intuition is sharp, and your friend is also right. The situation is one of those subtle moments in theoretical economics where **logical equivalence does not imply conceptual identity.**

  You are correct that in the specific context of ordinal voting with three or more alternatives, the two theorems are mathematically intertwined. You *can* prove Gibbard-Satterthwaite (GS) using Arrow (often via an intermediate result called the Muller-Satterthwaite theorem), and vice versa.

  However, calling GS a "footnote" to Arrow misses the forest for the trees. They are doing genuinely different conceptual work, addressing different questions, and relying on distinct axioms. The 20-year gap wasn't just a delay in mathematical derivation; it was a paradigm shift from **welfare economics** to **game theory.**

  Here is the breakdown of why they are distinct landmarks, why your friend is right about IIA vs. Strategy-Proofness, and why we teach both.

  ### 1. The Conceptual Divide: Consistency vs. Incentives
  This is the biggest difference.

  *   **Arrow (1951)** is about **Social Rationality.** It asks: *Can we aggregate individual preferences into a coherent "social preference" that behaves like an individual's preference?*
      *   The villain in Arrow's theorem is **inconsistency.** We want the social ranking to be transitive and complete. We want the rule to respect unanimity (Pareto). We want the rule to be context-independent (IIA). Arrow shows you can't have a consistent social "mind" without a dictator.
      *   **Vibe:** Political Philosophy / Welfare Economics. "What is the Will of the People?"

  *   **Gibbard-Satterthwaite (1973/75)** is about **Incentive Compatibility.** It asks: *If we ask people for their preferences to pick a winner, will they tell the truth?*
      *   The villain in GS is **manipulation.** We want a rule where truth-telling is a dominant strategy. GS shows that if you want to pick a single winner without a dictator, someone will eventually have an incentive to lie.
      *   **Vibe:** Game Theory / Mechanism Design. "How do I build a voting machine people can't game?"

  **Why this matters:** Arrow tells us that "Society" is a fiction. Gibbard-Satterthwaite tells us that "Voting" is a game. These are fundamentally different insights about human organization, even if the math converges on "Dictatorship."

  ### 2. The Axioms: IIA is NOT Strategy-Proofness
  Your friend was right to push back here. **Independence of Irrelevant Alternatives (IIA)** and **Strategy-Proofness (SP)** are not the same condition described in different vocabularies. They are structurally different constraints.

  *   **IIA (Arrow):** This is a static property of the aggregation function. It says the social ranking between $A$ and $B$ should depend *only* on how individuals rank $A$ and $B$. It forbids the social ranking from being influenced by a "spoiler" candidate $C$.
  *   **Strategy-Proofness (GS):** This is a counterfactual property involving utilities. It says that for any agent, reporting their true preferences yields an outcome they prefer (or like equally) compared to reporting false preferences, *regardless of what others do*.

  **The Crucial Distinction:**
  It is possible to conceive of rules that satisfy one but not the other (outside the specific impossibility setup).
  *   **IIA without SP:** A dictatorship satisfies IIA and is also Strategy-Proof (the dictator tells the truth, others don't matter). But consider a rule that picks the top choice of Agent 1, unless Agent 2 prefers $B$ over $A$, then it picks $B$. This might violate IIA but could be constructed to be manipulable or not depending on specifics.
  *   **SP without IIA:** This is harder to isolate in voting, but in mechanism design (like auctions), we often design SP mechanisms (VCG auctions) that definitely do not satisfy Arrow-style IIA conditions regarding social rankings.

  The reason they *feel* the same in your class is that **in the specific domain of ordinal social choice functions with $\ge 3$ alternatives, imposing SP forces the function to behave *as if* it satisfied IIA.**

  To prove GS using Arrow, you have to do some heavy lifting: you take a Strategy-Proof *Choice Function* (picks a winner) and artificially construct a *Welfare Function* (picks a ranking) from it. You then prove that if the Choice Function was Strategy-Proof, the constructed Welfare Function must satisfy IIA. *Then* you invoke Arrow.

  That construction step is the "work." It's not a trivial corollary; it's a bridge between two different conceptual worlds (Choosing vs. Ranking).

  ### 3. The Output: Rankings vs. Winners
  There is a technical distinction that often gets glossed over.

  *   **Arrow** deals with **Social Welfare Functions (SWF).** The output is a **full ranking** of all alternatives ($A \succ B \succ C$).
  *   **Gibbard-Satterthwaite** deals with **Social Choice Functions (SCF).** The output is a **single winner** ($A$).

  This matters because we often care about one but not the other.
  *   If I am forming a committee to make ongoing decisions, I care about the ranking (Arrow).
  *   If I am holding a presidential election, I only care about the winner (GS).

  It turns out that avoiding dictatorship is *harder* when you only want a winner (GS) than when you want a ranking (Arrow), because GS requires **Surjectivity** (every candidate must be capable of winning). Arrow requires **Pareto Efficiency**. While similar, they constrain the function differently.

  ### 4. Why the 20-Year Gap? (It wasn't laziness)
  If GS is derivable from Arrow, why did it take until the 1970s?

  **Because Game Theory didn't exist yet.**

  In 1951, when Arrow published, the formal language of "strategies," "dominant strategies," and "incentive compatibility" had not been fully developed. Nash Equilibrium was only just emerging (1950). Economists were thinking in terms of **Social Welfare** (normative: what *should* happen), not **Mechanism Design** (positive/strategic: what *will* happen).

  Gibbard and Satterthwaite didn't just find a math trick; they applied a new lens. They looked at Arrow's setup and asked, "Wait, if the rule isn't a dictator, does that mean I can lie to get my way?"

  That question changes everything. It moves Social Choice Theory out of Political Philosophy and into **Information Economics.** It explains *why* real-world voting systems look the way they do (e.g., why we use plurality or runoff instead of Borda count—not just because of consistency, but because of vulnerability to tactical voting).

  ### 5. Summary: Why Teach Both?
  If your professor said you can prove GS via Arrow, they were technically correct. But if they implied GS is unimportant because of that, they were wrong.

  1.  **Different Questions:** Arrow answers "Can we define a social will?" GS answers "Can we design a truthful voting system?"
  2.  **Different Fields:** Arrow is the foundation of Welfare Economics. GS is the foundation of Mechanism Design (which won Hurwicz, Maskin, and Myerson the Nobel in 2007).
  3.  **Different Intuitions:** IIA is about **informational efficiency** (we shouldn't need to know preferences over irrelevant options). SP is about **behavioral stability** (agents shouldn't want to lie).

  **Verdict:**
  You aren't missing the math; you're sensing the logical equivalence. But your friend is right that the *concepts* are distinct. They are like the **Heisenberg Uncertainty Principle** and **Wave-Particle Duality** in physics. They describe the same underlying reality (quantum mechanics), and you can derive insights about one from the other, but they address fundamentally different questions (measurement limits vs. nature of matter).

  Arrow tells us democracy is logically inconsistent. Gibbard-Satterthwaite tells us democracy is strategically vulnerable. Both are devastating, but they kill different hopes.
