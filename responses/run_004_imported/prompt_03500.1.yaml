  4.  **Fleshing out the Details (Self-Correction/Refinement):**

      *   *Point 1: IIA vs. Strategy-Proofness.*
          *   IIA: Social ranking of $x$ vs $y$ depends *only* on individual rankings of $x$ vs $y$.
          *   SP: No agent can benefit by lying about their preferences.
          *   *Crucial distinction:* IIA is about the *structure* of the aggregation rule. SP is about the *behavior* of agents given the rule.
          *   *Example:* A rule can satisfy IIA but be manipulable? Actually, under Arrow's conditions, if it satisfies IIA + Pareto, it's a dictatorship, which is SP. But conceptually, they target different things.
          *   *Wait, check the equivalence:* In the specific domain of ordinal preferences with $\ge 3$ alternatives, SP + Surjectivity $\iff$ Dictatorship. IIA + Pareto + UD $\iff$ Dictatorship.
          *   *Why aren't they the same condition?* IIA restricts how inputs map to outputs. SP restricts the *utility* outcomes based on inputs. SP requires a utility assumption (ordinal is enough for ranking, but SP implies "getting a higher ranked outcome is better"). Actually, SP is defined over ordinal preferences too (manipulation means getting a strictly preferred winner).
