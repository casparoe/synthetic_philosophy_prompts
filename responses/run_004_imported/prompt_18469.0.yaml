      *   *Section 2: The Physics Analogy.* Equilibrium. Conservation of expected utility. Trading on info alone is like trying to build a perpetual motion machine using only internal heat.
      *   *Section 3: Where it Breaks.* List the assumptions. Highlight "Heterogeneous Priors" (we see the world differently) and "Noise Traders/Liquidity" (I'm not trading to beat you, I'm trading to buy a house). This explains the volume.
