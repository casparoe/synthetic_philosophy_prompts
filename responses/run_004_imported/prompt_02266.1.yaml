answer: |-
  At first glance, Pascal's fragments on "the reason of effects" present a political theology that seems indistinguishable from the cynical realpolitik of Machiavelli. In Brunschvicg 294 and 326, Pascal dismantles the pretensions of earthly justice, arguing that "we cannot make what is just strong, so we have made what is strong just." He observes that custom, which is essentially force habituated over time, serves as the "mystical foundation of authority." Most provocatively, he insists that "it is dangerous to tell the people that the laws are unjust," and that legislators must conceal the usurpation at the origin of law to prevent sedition. To the secular reader, this appears to be a classic endorsement of the "noble lie": an enlightened elite, aware that justice is a fiction, manages the illusions of the masses to maintain order.

  However, to classify Pascal's counsel as Machiavellian is to mistake a theology of misery for a strategy of power. While Machiavelli and Pascal agree on the diagnosis—that political order rests on force rather than intrinsic right—they diverge radically on the prescription and the moral status of those who know the truth. For Machiavelli, the concealment of truth is an instrument of statecraft wielded by the Prince to secure his dominion. For Pascal, the concealment of truth is a necessary accommodation to human fallenness, accepted by the wise not to rule, but to endure. Pascal's theology of the Fall and concupiscence transforms what looks like political manipulation into an act of humility and charity. The "noble lie" is not a tool for the elite to control the many, but a shared burden of a corrupted humanity that must be borne until the arrival of true Justice in God.

  The divergence begins with the purpose of the concealment. In Machiavellian thought, the "lie" is functional; it preserves the regime. If the people knew the laws were based on usurpation, they would revolt, and the Prince would lose power. The danger is primarily to the sovereign. In Pascal's *Pensées*, however, the danger of revealing the injustice of laws is ontological and spiritual. Pascal writes that it is "dangerous to tell the people that the laws are unjust" because the people lack the capacity to sustain the vision of their own wretchedness without Grace. Earthly justice, though a fiction, acts as a restraint on concupiscence—the self-love and lust for domination that defines fallen man.

  If the "wise" were to strip away the illusion of justice, they would not liberate the people; they would unleash their concupiscence. Without the "mystical foundation" of custom to check human violence, society would revert to a state of war. Thus, the concealment is not merely about preventing sedition for the sake of the state's longevity (a Machiavellian end), but about preventing the total moral collapse of humanity (a theological end). Pascal is not advising legislators on how to secure their grip on power; he is describing the tragic necessity of order in a world where true justice is impossible. The concealment is a dam against the flood of sin, not a wall around a prince's palace.

  Furthermore, the moral character of the "wise" differs fundamentally in Pascal's system. In a Machiavellian framework, the enlightened few stand *above* the lie. They know the truth, they manipulate the falsehood, and they benefit from the stability it produces. They are the architects of the illusion. For Pascal, the Christian wise man does not stand above the law; he submits to it alongside the common people. Pascal insists that the wise should teach obedience "because they are laws," not because they are just. This obedience is not a calculated performance to keep the peace, but a recognition of God's ordinance in a fallen world.

  This is where the theology of the Fall becomes decisive. For Pascal, the corruption of human nature means that reason is too weak to establish true justice, and will is too corrupt to desire it. Therefore, earthly laws are a "punishment" and a "remedy" permitted by God. When the Christian obeys an unjust law because it is the law, he is not participating in a deception; he is accepting the condition of his exile. He acknowledges that in the absence of the City of God, the City of Man must rely on force to prevent greater evils. The "concealment" of the law's origin is not a secret kept by the elite to patronize the masses; it is a truth that the elite themselves must treat with reverence, recognizing that to expose it is to tempt God by demanding a perfection the world cannot bear. The wise man obeys the custom not because he is fooled by it, but because he understands its necessity as a check on universal concupiscence, his own included.

  Moreover, Pascal's counsel removes the pride inherent in the Machiavellian position. Machiavelli's Prince derives a sense of superiority from his knowledge of the "effectual truth" behind the moral veil. Pascal's Christian, by contrast, derives only humility. Knowing that "custom creates the whole of equity" does not make the wise man a ruler; it makes him a penitent. He sees that his own obedience is part of the "punishment of human vanity after the Fall." To reveal the usurpation at the heart of the law would be an act of pride, implying that human reason could rectify the disorder of the world. By keeping the mystery concealed, the wise man acknowledges that the resolution to the contradiction between force and justice lies not in political reform, but in Redemption.

  Finally, we must engage directly with the notion that legislators "should conceal the law's origin." In a Machiavellian reading, this is an instruction to fabricate myths of origin to legitimize power. In Pascal's theological reading, this is an acknowledgment that all earthly authority is, in the final analysis, illegitimate before God, yet permitted by Him. The "usurpation" is not just a historical event (a king stealing a throne); it is the metaphysical condition of human authority after Eden. No human has a divine right to rule another. Therefore, *all* law originates in a kind of usurpation. To reveal this is to reveal that all authority is void, which leads to anarchy.

  Pascal argues that we must treat customs and laws *as if* they were just, not to deceive, but to maintain the "peace of the kingdom" which is a shadow of the peace of God. The concealment is an act of charity toward the weak, who need the crutch of custom to avoid the abyss of despair or the chaos of license. It is not a "noble lie" in the sense of a fabricated story told by the strong to the weak; it is a shared silence regarding the tragic gap between human ambition and divine justice.

  In conclusion, while Pascal utilizes the language of political realism, he subverts its intent through his theology of the Fall. The Machiavellian noble lie is a technique of governance designed to preserve power by managing truth. Pascal's counsel of concealment is a theology of suffering designed to preserve order by managing sin. The "danger" in telling the people the laws are unjust is not merely the risk of revolution, but the risk of exposing fallen humanity to a truth it is too corrupted to handle without grace. The wise do not conceal the truth to rule the people; they conceal it to serve them, obeying the laws "because they are laws" as an act of submission to the mysterious providence that allows force to stand in for justice until the end of time. Thus, Pascal transforms the cynicism of the "reason of effects" into a humble acceptance of human misery, stripping the elite of their claim to mastery and placing them, like the people, under the judgment and mercy of God.
