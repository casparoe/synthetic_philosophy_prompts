      *Key distinction:* Machiavelli says "Lie to keep power." Pascal says "Accept the lie because true power belongs to God and we are fallen." The attitude toward the lie is different. One wields it; one bears it.

  7.  **Final Polish:** Check flow and clarity. Ensure the distinction between "political order as an end" (Machiavelli) and "political order as a restraint on sin" (Pascal) is clear. (Proceed to generate output).

