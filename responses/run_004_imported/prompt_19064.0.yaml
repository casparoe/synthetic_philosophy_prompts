answer: |-
  Here are 9 questions designed to move past the introductory exposition and press the specific vulnerabilities in the semicompatibilist position. They are ordered to build dialectical pressure, starting with the metaphysics of the cases and moving toward the normative implications of control.

  ### 1. The Dilemma Defense (Determinism vs. Indeterminism)
  **Question:** "One of the strongest objections to Frankfurt cases is the 'Dilemma Defense.' If the prior sign that triggers Black's intervention is causally sufficient, the case presupposes determinism, which begs the question against the incompatibilist. But if the sign isn't causally sufficient, Jones retains the ability to do otherwise at the moment of the sign, preserving PAP. How does your specific formulation of the case avoid this dilemma without simply stipulating that determinism is true from the outset?"

  *   **Likely Answer:** She will likely argue that we can construct the case using "counterfactual intervener" logic that doesn't require global determinism, only local reliability, or she will bite the bullet that the case shows PAP is false *even if* determinism is true, so begging the question isn't fatal to the *conceptual* point.
  *   **Follow-up:** "If you rely on local reliability without global determinism, doesn't that reintroduce a window of alternative possibility at the moment of the sign? And if you concede the case assumes determinism to make the intervention reliable, aren't you essentially asking the incompatibilist to grant the truth of determinism to prove that determinism doesn't matter? How is that dialectically fair?"

  ### 2. The Robustness of "Flickers"
  **Question:** "Critics argue that even in successful Frankfurt cases, there remain 'flickers of freedom'—for example, the difference between Jones deciding on his own versus Jones deciding because Black forced him. Why should we accept that these flickers are too normatively insignificant to ground responsibility? If the agent is responsible in the actual sequence, isn't it precisely because they *could* have entered the alternative sequence where they were forced, and that alternative is what makes the actual one praiseworthy?"

  *   **Likely Answer:** She will likely argue that these flickers are not "robust" alternatives. To ground PAP, an alternative must allow the agent to avoid responsibility entirely. Since Jones is responsible in both the actual and counterfactual sequences, the alternative isn't robust.
  *   **Follow-up:** "But isn't 'robustness' defined exactly to rule out the flickers? If the only alternative available is one where I am coerced, isn't the ability to avoid coercion itself a morally significant alternative possibility? Why does the alternative need to allow for *total exculpation* to count as a relevant freedom?"

  ### 3. Cashing Out Guidance vs. Regulative Control
  **Question:** "You distinguish between 'guidance control' (actual sequence) and 'regulative control' (alternative sequences). Skeptics worry this is merely a verbal distinction to salvage responsibility after conceding we lack the freedom to do otherwise. Can you give us a concrete example of a moral intuition that is satisfied by guidance control but would be *frustrated* if we discovered regulative control was impossible? In other words, what work is the distinction actually doing?"

  *   **Likely Answer:** She will likely focus on "ownership." Guidance control ensures the action issues from the agent's own moderately reasons-responsive mechanism. Regulative control is about the world's layout, not the agent's agency.
  *   **Follow-up:** "If the agent's mechanism is reasons-responsive but the agent literally cannot do otherwise due to prior causes, in what sense is the mechanism truly 'theirs' in a way that satisfies retributive or desert-based intuitions? Does guidance control ultimately shift the justification of responsibility from 'desert' to 'forward-looking social regulation'?"

  ### 4. The Sourcehood Intuition
  **Question:** "Many incompatibilists argue that the deep intuition driving PAP isn't about alternative possibilities per se, but about 'ultimate sourcehood.' Even if Jones has guidance control, if determinism is true, the source of his mechanism traces back to factors outside his control. Does semicompatibilism have the resources to address the sourcehood worry, or does it simply change the subject from 'freedom' to 'responsibility'?"

  *   **Likely Answer:** She will likely argue that "ultimate sourcehood" is an incoherent or impossible standard (regress problem) and that we should settle for "actual sourcehood" (the action comes from me now).
  *   **Follow-up:** "If we settle for 'actual sourcehood,' how do you distinguish the responsible agent from a sophisticated robot that also processes reasons and acts without alternative possibilities? Is the distinction merely biological, or is there a metaphysical difference in the 'source'?"

  ### 5. Reasons-Responsiveness and Compulsion
  **Question:** "Your account relies heavily on the mechanism being 'moderately reasons-responsive.' Consider a case of a deeply ingrained phobia or addiction where the agent acts on their own mechanism, without an intervener, but cannot resist the impulse. They have guidance control but seem coerced. How does your view distinguish between internal compulsion and genuine moral agency if alternative possibilities aren't the deciding factor?"

  *   **Likely Answer:** She will likely argue that in compulsion cases, the mechanism is *not* reasons-responsive (it wouldn't respond to sufficient reasons to do otherwise), whereas in normal agency, it is.
  *   **Follow-up:** "But how do we test that counterfactual responsiveness without looking at whether they *could* have done otherwise in those specific circumstances? If we can't observe the alternative possibility, aren't we just labeling the mechanism 'responsive' when we want to blame them and 'unresponsive' when we don't?"

  ### 6. Praiseworthiness vs. Blameworthiness
  **Question:** "Most Frankfurt cases focus on blameworthiness (e.g., killing a victim). There is some literature suggesting that alternative possibilities are more crucial for *praiseworthiness* than blameworthiness. If an agent saves a child but couldn't have done otherwise, do they deserve the same moral credit as one who could have let the child die? Does semicompatibilism risk creating an asymmetry where we are responsible for our sins but not our saints?"

  *   **Likely Answer:** She will likely argue for symmetry. If guidance control is sufficient for blame, it is sufficient for praise. The "could have done otherwise" condition isn't necessary for either.
  *   **Follow-up:** "If that's the case, does this diminish the value of moral heroism? If a saint literally could not have been selfish, our gratitude seems to lose its object. Are you comfortable with a theory where moral luck determines the *capacity* for virtue, even if responsibility remains?"

  ### 7. The "Could Have Done Otherwise" Locution
  **Question:** "In ordinary discourse, when we hold someone responsible, we often explicitly say, 'You could have done otherwise.' If semicompatibilism is true, this statement is literally false in determined cases. Should we revise our ordinary moral language to avoid this claim, or are you proposing a compatibilist reinterpretation of the word 'could' that laypeople would find unintuitive?"

  *   **Likely Answer:** She will likely argue for a reinterpretation. "Could" refers to the capacities of the agent, not the metaphysical openness of the future.
  *   **Follow-up:** "If the layperson understands 'could' as 'metaphysically open,' and you tell them 'You are responsible even though you couldn't have done otherwise,' aren't you inviting a sense of injustice? Does your theory require an error theory of ordinary moral practice?"

  ### 8. Manipulation Arguments
  **Question:** "Consider a manipulation case where a team of neuroscientists designs Jones's character so that he freely chooses to kill, without any Frankfurt-style intervener present. He has guidance control and no alternative possibilities. Most intuitions suggest he isn't responsible because his history is manipulated. How does your actual-sequence approach distinguish the Frankfurt agent from the Manipulated agent without appealing to the history of how the mechanism was acquired?"

  *   **Likely Answer:** She will likely appeal to "history-sensitive" conditions or argue that manipulation undermines reasons-responsiveness in a way that normal determinism does not.
  *   **Follow-up:** "If you add historical conditions to guidance control, aren't you smuggling in a requirement for the *origin* of the will that looks suspiciously like the incompatibilist's 'ultimate sourcehood'? Where do you draw the line between causal determination and manipulation?"

  ### 9. The Consequence Argument Interface
  **Question:** "Finally, how does semicompatibilism sit with the Consequence Argument? Incompatibilists argue that if determinism is true, our actions are consequences of the past and laws of nature. You accept determinism might be true but deny it undermines responsibility. Do you reject the Consequence Argument's inference rule, or do you accept its conclusion (we can't do otherwise) but deny its implication (that we lack responsibility)?"

  *   **Likely Answer:** She will likely accept the conclusion that we can't do otherwise (under determinism) but deny that this implies a lack of responsibility. She separates the freedom to do otherwise from the control required for responsibility.
  *   **Follow-up:** "If you grant the Consequence Argument shows we lack the freedom to do otherwise, why do you think the incompatibilist is wrong to call that 'freedom' a necessary condition for responsibility? Is the dispute merely terminological, or is there a substantive disagreement about the *function* of moral responsibility?"
