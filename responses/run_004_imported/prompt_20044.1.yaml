prompt: |-
  My college roommate Priya is getting married in June and asked me to give the toast, which is a genuinely terrifying ask because she just filed her philosophy dissertation — 250-odd pages that are basically one long argument with David Lewis's book Convention — and about fifteen of the ninety-ish guests are going to be her cohort and her committee, people who will absolutely clock the difference between a coordination equilibrium and a mere accidental regularity if I fudge it. Everyone else is her fiancé Marcus's family, his adult-league soccer team, and my own thoroughly non-academic parents, who just want a nice cry. I'm a novelist, not a philosopher, and I'm mid-revision on book three right now, which is exactly the wrong week to also be loosing sleep over five minutes of spoken word, but I've sat through enough of Priya's rants over the years that I don't want to just toss off a "haha marriage is a social construct" line and sit down — I want Lewis's actual account to constrain what I'm allowed to say, not just decorate it.

  Here's where I'm stuck. I don't think I'm allowed to say they were "meant to be" or that this was always going to happen, because the whole point of a convention on Lewis's view is that it's arbitrary and self-perpetuating rather than necessary — sustained by precedent and mutual expectation, not fate. But then what do I do with the vows themselves? Standing up in front of everyone and swapping promises looks exactly like the explicit agreement that Priya says Lewis was trying to explain conventions without presupposing, since agreement already requires the kind of shared language whose conventionality was the whole thing he was trying to explain in the first place. So is the ceremony even allowed to matter, on this view, or does making a big deal of the vows quietly break the whole framework? They also have this small dumb ritual — Marcus says "see you on the other side" every time either of them leaves for the airport, for a reason nobody remembers anymore — that I'd like to use as my one concrete worked example.

  Could you write me the actual toast — five minutes, meant to be read aloud, not sat with on the page? It should reward the fifteen philosophers for catching the real bones of it (arbitrariness, precedent, common knowledge, coordination equilibrium — real vocabulary is fine once or twice) without ever sounding like a seminar, and it still has to make my mother cry.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Novelist (roommate of the bride), mid-revision, stressed but caring.
      *   **Audience:** Mixed. 15 philosophers (Priya's cohort/committee, experts on David Lewis), Marcus's family/soccer team (non-academic), Speaker's parents (non-academic, want emotion).
      *   **Occasion:** Priya's wedding toast (June).
      *   **Constraint 1 (Philosophical):** Must accurately reflect David Lewis's *Convention* (1969). No "fate/meant to be" (contingency/arbitrariness). Must address the tension between vows (explicit agreement) and Lewis's project (explaining convention *without* presupposing agreement).
      *   **Constraint 2 (Emotional):** Must make the mother cry (needs heart, warmth, connection).
      *   **Constraint 3 (Style):** 5 minutes spoken (approx. 750-900 words). Not a seminar, but philosophically rigorous enough for the experts. Use specific vocabulary sparingly (coordination equilibrium, common knowledge, precedent).
      *   **Specific Detail:** Include the "see you on the other side" airport ritual.

  2.  **Deconstruct David Lewis's *Convention* (Key Concepts):**
      *   **Coordination Problem:** A situation where people benefit from doing the same thing (e.g., driving on the right side of the road).
      *   **Equilibrium:** A stable state where no one benefits from changing their behavior unilaterally.
      *   **Arbitrariness:** The solution could have been different (driving on the left), but *consistency* matters more than the specific choice.
      *   **Precedent:** Past solutions guide future expectations.
      *   **Common Knowledge:** Everyone knows, everyone knows that everyone knows, etc.
      *   **The "Agreement" Objection:** Lewis argues conventions arise *without* explicit promises. Promises presuppose language conventions. So, how to handle wedding vows?
      *   **Resolution for the Toast:** The vows aren't the *origin* of the convention; they are a public signaling event that solidifies *common knowledge* of their commitment to the equilibrium. The marriage *is* the convention, sustained by love and daily coordination.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the pressure. Humor about the philosopher audience. Establish the novelist vs. philosopher dynamic.
      *   **The Core Argument (Lewisian Framework):** Address the "meant to be" trap. Marriage isn't fate; it's a choice sustained by repetition. Introduce the concept of *arbitrariness* but frame it romantically (it could have been anyone, but it's *you*).
      *   **The Ritual ("See you on the other side"):** Use this as the concrete example of a convention. It's arbitrary (why that phrase?) but meaningful because it's *theirs*. It creates a mini-equilibrium.
      *   **The Vows (The Tricky Part):** Address the philosophical tension. The vows aren't creating the rule from scratch; they are making their private coordination *common knowledge* to the room. It's a public signal.
      *   **The Emotional Turn (For the Parents):** Shift from logic to feeling. Why do we do this? Because the equilibrium is love. The stability is safety.
      *   **Closing:** A wish for the future. Sustaining the precedent.

  4.  **Refining the Tone:**
      *   *Risk:* Sounding too dry/academic.
      *   *Fix:* Use metaphors. Keep sentences rhythmic for speech. Ensure the "mother cry" moment lands on the *value* of the routine, not just the logic.
      *   *Risk:* Offending the philosophers.
      *   *Fix:* Use the terms correctly. Acknowledge the "agreement" objection explicitly but resolve it poetically.

  5.  **Drafting - Iteration 1 (Mental Outline):**
      Hi everyone. Priya asked me to speak. I'm scared because 15 of you know Lewis better than me. Marriage isn't fate, it's a convention. Like driving on the right. You chose each other arbitrarily but now it's precedent. Like the airport phrase. The vows look like an agreement, but Lewis says agreements need language. So think of vows as making common knowledge. I love you both. Cheers.
      *Critique:* Too dry. Needs more soul for the parents. Needs to flow better as speech.

  6.  **Drafting - Iteration 2 (Focusing on Flow and Emotion):**
      Start with the dissertation. Priya fought Lewis on paper; now she lives the theory. The "meant to be" line is false. It's a coordination equilibrium. But don't worry, Mom, it's still romantic. The airport phrase is the perfect example of an arbitrary signal that means safety. The vows? They aren't the start, they are the public announcement of the equilibrium.
      *Critique:* Better. Need to make sure the "agreement" objection is handled gently. Lewis says conventions solve coordination problems *without* prior agreement. But weddings *are* agreements. The trick is to frame the wedding as the *signal* that cements the common knowledge, not the logical foundation of the language itself.

  7.  **Final Polish (incorporating the "Novelist" voice):**
      *   Make it sound like a story.
      *   Ensure the transition from "coordination equilibrium" to "making my mother cry" is smooth. The logic *is* the romance. Stability *is* love.
      *   Check word count (approx. 800 words for 5 mins).

  8.  **Addressing the Specific Philosophical Puzzle:**
      *   *Problem:* Vows look like explicit agreement. Lewis says convention explains agreement, not vice versa.
      *   *Solution:* Frame the vows not as the *origin* of the convention, but as a *focal point* (Schelling point) that generates the *common knowledge* required to sustain the equilibrium. The relationship existed; the wedding makes it known to all that it exists, stabilizing expectations.

  9.  **Writing the Toast (incorporating the above):**
      *   *Hook:* The dissertation/Lewis fear.
      *   *Body:* Arbitrariness of love (it didn't have to be this way, but it is). The Airport Ritual (the mini-convention). The Vows (Common Knowledge).
      *   *Heart:* Why we want this stability.
      *   *Toast:* To the precedent.

  10. **Review against constraints:**
      *   5 mins? Yes.
      *   Lewis accurate? Yes (Arbitrariness, Equilibrium, Common Knowledge, Precedent).
      *   Mom cry? Yes (focus on safety/return).
      *   Philosophers satisfied? Yes (acknowledges the agreement objection).
      *   Ritual included? Yes.

  *(Self-Correction during drafting)*: Make sure I don't get bogged down in the "agreement" paradox. Keep it light. The point is that the *marriage* is the convention, the *wedding* is the signal.

  Let's write it.cw
answer: |-
  Good evening. For those who don't know me, I'm [Your Name]. I'm a novelist, and I'm Priya's college roommate. And for the fifteen people in this room who just felt a spike of cortisol at the thought of a novelist interpreting David Lewis: I see you. I have spent the last week reading *Convention* instead of revising my third act, and I promise I will not misuse the term "coordination equilibrium."

  Priya asked me to talk about how they met, and how they got here. And usually, at a wedding, this is the part where I'm supposed to tell you they were "meant to be." That this was destiny. But having lived with Priya for four years, and knowing the work she's just finished, I know I can't say that. Not if I want to keep her committee from rolling their eyes.

  On Lewis's view, a convention isn't fate. It's arbitrary. There was no cosmic necessity that Priya and Marcus end up on the same side of the road. They could have driven on the left. They could have never met. But they *did* meet. And once they found a way to coordinate their lives that worked—a way where neither of them benefits from unilaterally changing course—they stuck with it. That's the romance, I think. It's not that the universe demanded they be together. It's that in a world of infinite possibilities, they chose the same solution, again and again, until it became their world.

  You see this in the small things. Like the ritual they have when one of them leaves for the airport. Marcus says, "See you on the other side."

  Now, why that phrase? There's no deep reason. It's arbitrary. They could have said "Bon voyage" or "Text me when you land." But it doesn't matter *what* they say, only that they say the *same* thing. It's a signal. When Marcus says it, Priya knows he expects to return. When Priya hears it, she knows he expects her to wait. It's a tiny coordination equilibrium that turns a scary departure into a predictable return. It creates safety out of thin air, just by precedent.

  But I know what the philosophers in the back are thinking. I can hear the objection. "Wait a minute. Lewis argues that conventions arise *without* explicit agreement, because agreements already require language conventions. So what are we doing here? What is this ceremony?"

  If you stand up and swap vows, isn't that an explicit agreement? Doesn't that break the framework?

  Here is how I, the novelist, resolve the paradox for the philosophers: The vows aren't the origin of their convention. Their love is already the precedent. The vows are something else. The vows are about *Common Knowledge*.

  Before today, Priya and Marcus knew they loved each other. They knew the other knew. But today, in front of Marcus's soccer team, Priya's department, and our parents, they have made it *common knowledge*. Everyone here now knows that they know. We are all witnesses to the equilibrium. We are the external enforcement mechanism. By standing up and saying it aloud, they aren't creating the rule from scratch; they are signaling to the entire community that this coordination is stable, public, and expected.

  And for the rest of you—my parents, Marcus's family, who just want to know if this is real: It is.

  Because here is the thing Lewis missed, the thing you can't put in a 250-page dissertation. We don't just want coordination. We don't just want a stable equilibrium. We want to come home.

  When my mother looks at Priya and Marcus, she doesn't see a game theory model. She sees two people who have decided that no matter how chaotic the world gets, they will be the constant for each other. She sees that "See you on the other side" isn't just a phrase about an airport. It's a promise that when life gets hard, when the dissertation is late, when the book isn't selling, when the knees ache and the years pile up... you will still be on the other side. Waiting.

  That is why we gather. Not to watch a contract being signed. But to watch two people voluntarily bind themselves to a future where they don't have to navigate the coordination problem alone.

  So, if we could all raise a glass.

  To Priya and Marcus. May your precedents be kind, may your expectations always be met, and may you always, always find each other on the other side.
