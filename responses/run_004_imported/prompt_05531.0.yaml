prompt: |-
  I'm a senior engineer and one of five members of my company's architecture review board (ARB), which has to sign off on any RFC for a significant system change before a team is allowed to start building it. The process has always been informal: someone posts a design doc, the five of us leave comments and an explicit approve or request-changes verdict over a few days, and everything is visible in real time, so by the time the fourth or fifth reviewer opens the doc, they can already see two staff engineers' approvals sitting at the top of the thread.

  This came under real scrutiny after we approved an RFC to replace our internal job queue with a different message broker. It picked up four approvals within a day, including two from staff engineers, and shipped a week later. The new broker's delivery guarantees turned out to be weaker than the doc had assumed, and for about two weeks a small fraction of jobs silently vanished under load instead of being retried. In the retro, three of the five reviewers admitted they'd separately noticed the delivery-guarantee mismatch while reading the doc, but each had talked themselves out of flagging it once they saw that the staff engineers had already signed off. The board is now split. Two of us want every reviewer to write and submit an independent assessment before anyone can see what the others said, on the theory that the current setup lets the first couple of opinions quietly determine everyone else's. The other two think that's a solution in search of a problem: deferring to colleagues' judgment instead of re-deriving everything from scratch is exactly what expertise and trust within a team are for, and blind review will mainly slow down the RFCs that most need to move fast. Someone wrote "information cascade" in the retro doc, half-joking, and the phrase stuck, though none of us actually know whether that's the right diagnosis or what would follow from it if it is.

  Could you draft the short memo I'll bring to the ARB's next meeting? It should recommend what our review process should actually be going forward -- keep it as is, move to independent blind assessments, or something in between -- with a concrete rollout timeline, and reasoning solid enough that the "this is just healthy deference to expertise" camp would feel genuinely engaged with rather than overruled.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Senior Engineer, ARB Member (1 of 5).
      *   **Audience:** The other 4 ARB members (split 2 vs. 2, with the user likely being the tie-breaker or consensus builder).
      *   **Problem:** A recent incident (message broker swap causing data loss) revealed an "information cascade" effect. Reviewers deferred to early approvals (especially from Staff Engineers) instead of critically evaluating the design, even when they spotted issues.
      *   **Conflict:**
          *   Camp A (2 members): Wants independent blind assessments (no seeing others' comments before submitting) to prevent bias.
          *   Camp B (2 members): Wants to keep it as is (transparent, real-time). Argues that deference to expertise is efficient and necessary; blind review slows things down.
      *   **Goal:** Draft a short memo recommending a path forward (keep, change, or hybrid), including a rollout timeline and reasoning that engages Camp B (the "trust/efficiency" camp) without dismissing their concerns.
      *   **Tone:** Professional, collaborative, evidence-based, pragmatic (Senior Engineer level).

  2.  **Diagnose the Core Issue:**
      *   Is it *really* an information cascade? Yes, the retro admits reviewers saw the issue but stayed silent because others approved. This is classic social proof/authority bias.
      *   Is Camp B wrong? Not entirely. Deference to expertise *is* efficient. Re-deriving everything is wasteful. The problem isn't trust; it's *abdication* of responsibility.
      *   Is Camp A right? Blind reviews solve the bias but introduce friction and delay. It might be overkill for *every* RFC.
      *   **Solution:** A hybrid approach. "Blind" for high-risk changes, transparent for low/medium risk. Or, a "sealed envelope" period for the first 24 hours. Or, structured checklists.
      *   *Best Approach:* A phased or risk-based approach. Let's aim for a "Structured Independence" model. We need to preserve the efficiency of transparency while mitigating the silence of conformity.
      *   *Key Insight:* The problem wasn't that they saw the comments; it's that they didn't feel psychological safety to dissent *after* seeing approval. However, blind reviews are heavy. A lighter touch might be: "Initial Independent Window." Everyone has 24 hours to submit a verdict/comment before seeing others'. After that, it's open collaboration. This balances independence with collaboration.

  3.  **Drafting Strategy - Section by Section:**
      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Context:** Briefly acknowledge the incident and the retro findings (the "information cascade").
      *   **Objective:** Balance risk mitigation with velocity/trust.
      *   **Recommendation:** Propose a hybrid model ("The 24-Hour Independent Window").
      *   **Reasoning:** Address both camps.
          *   To Camp A: Solves the cascade bias.
          *   To Camp B: Preserves collaboration after the window, doesn't slow down *all* RFCs indefinitely, respects expertise but validates it.
      *   **Implementation/Timeline:** Concrete steps.
      *   **Review Metric:** How we know it's working.

  4.  **Refining the Argument (Engaging Camp B):**
      *   Avoid saying "You were wrong to trust."
      *   Say "Trust is vital, but process should support *verified* trust."
      *   Acknowledge that blind reviews *can* slow things down, so limit the "blind" phase.
      *   Emphasize that the goal isn't to catch every bug (impossible) but to ensure diverse perspectives are voiced *before* convergence.
      *   Use the term "Cognitive Diversity" rather than just "Bias."

  5.  **Drafting - Iteration 1 (Mental Outline):**
      *   Hey team, the broker thing sucked. We found out we all followed the leaders.
      *   Camp A wants blind reviews. Camp B wants speed.
      *   I propose: First 24 hours, comments are hidden. Then they show up.
      *   This stops the cascade but lets us collaborate later.
      *   Let's try it for 3 months.
      *   Thoughts?

  6.  **Drafting - Iteration 2 (Adding Senior Engineer Polish):**
      *   Need to sound more nuanced. The "24-hour window" is good.
      *   Need to explicitly address the "deference to expertise" argument. It's valid, but expertise varies by domain. The Staff Engineer who approved might be great at APIs but weak on Message Broker durability.
      *   The memo needs to be persuasive, not dictatorial.
      *   Include a "Risk Tier" concept? Maybe too complex. Let's stick to the "Independent Window" for *all* significant RFCs (since ARB only sees significant ones anyway).

  7.  **Finalizing the Content:**
      *   **Subject:** ARB Process Evolution: Balancing Independence and Collaboration.
      *   **Opening:** Acknowledge the tension.
      *   **The Diagnosis:** Validate the "information cascade" but frame it as a systemic risk, not individual failure.
      *   **The Proposal:** "Delayed Visibility" (not fully blind, just delayed).
      *   **Why this works:** It gives space for independent thought (Camp A) but allows collaborative refinement (Camp B).
      *   **Timeline:** 2 weeks to setup, 3 month trial.
      *   **Success Criteria:** Fewer "I saw that but didn't say anything" moments in retros.

  8.  **Review against Constraints:**
      *   Short memo? Yes.
      *   Concrete timeline? Yes.
      *   Engage Camp B? Yes, by emphasizing collaboration *after* the window and efficiency.
      *   Address the incident? Yes.

  9.  **Final Polish:** Check tone. Ensure it doesn't sound like a blame assignment. Make sure the "Staff Engineer" dynamic is handled delicately (authority bias). *Self-Correction:* Make sure to mention that this applies to ARB members, not necessarily the whole company, keeping the scope tight.

      *(Self-Correction during drafting)*: Wait, if I propose a 24-hour window, Camp B might say "That blocks everything for a day." Is that true? If the ARB has 5 people, and we need 5 approvals, yes. But usually, we need consensus. Let's frame it as "Initial Assessment Period." Also, acknowledge that for *urgent* fixes, we can waive it. That shows pragmatism.

      *Refining the "Camp B" engagement:* Explicitly state that deference is good *after* independent verification. We want to avoid "blind deference," not "informed trust."

      *Final Plan:*
      1. Context & Incident Learnings.
      2. Proposal: The "Independent Assessment Window."
      3. Rationale (addressing both sides).
      4. Rollout Plan.
      5. Success Metrics.

      Let's write it.cw
answer: |-
  **MEMORANDUM**

  **TO:** Architecture Review Board (ARB)
  **FROM:** [Your Name]
  **DATE:** October 26, 2023
  **SUBJECT:** Proposal: Evolving ARB Review Process to Mitigate Information Cascades

  ### Context
  Following the recent message broker incident, our retro identified a specific process failure: an **information cascade**. Multiple reviewers identified the delivery-guarantee mismatch but deferred to early approvals from senior colleagues. While deference to expertise is generally efficient, in this case, it suppressed critical dissent and allowed a high-risk assumption to go unchallenged.

  We are currently split between maintaining our transparent, real-time process (prioritizing velocity and trust) and moving to independent blind assessments (prioritizing unbiased verification). This memo proposes a hybrid approach to satisfy both objectives.

  ### Recommendation: The "Independent Assessment Window"
  I recommend we adopt a **24-hour Independent Assessment Window** for all RFCs entering ARB review, followed by open collaboration.

  **The Process:**
  1.  **Submission:** Author posts RFC.
  2.  **Window (Hours 0–24):** ARB members submit initial verdicts and comments. These are **hidden** from other reviewers and the author.
  3.  **Reveal (Hour 24+):** All comments and verdicts become visible.
  4.  **Collaboration:** Standard open discussion resumes to resolve conflicts or refine the design.
  5.  **Expedited Path:** For P0/incident-response RFCs, the Lead Architect can waive the window.

  ### Rationale
  This approach addresses the concerns of both factions within the board:

  **For the "Independent Assessment" camp:**
  *   **Breaks the Cascade:** By hiding early approvals, we remove the social pressure to conform. Reviewers must commit to a stance based on the doc, not the thread.
  *   **Psychological Safety:** It creates a safe space to flag risks without feeling like you are contradicting a Staff Engineer publicly.

  **For the "Trust & Velocity" camp:**
  *   **Preserves Collaboration:** Unlike full blind review, we still collaborate openly after the window. We leverage our collective expertise to solve problems, not just find them.
  *   **Minimal Velocity Impact:** A 24-hour hold is negligible for significant architectural changes, which should not be rushed. It prevents the *false velocity* of approving a flawed design quickly only to fix it post-ship.
  *   **Validates Expertise:** Deference is healthy *after* independent verification. This ensures that when we do defer, it is because the argument holds up, not because of who made it.

  ### Rollout Timeline
  *   **Week 1 (Nov 1–7):** Update RFC template to include a "Risk & Failure Mode" section (forcing explicit consideration of guarantees like delivery/ordering). Configure tooling (GitHub/GitLab/Docs) to support delayed comment visibility.
  *   **Week 2–10 (Nov 8–Jan 8):** Trial period. All ARB RFCs subject to the 24-hour window.
  *   **Week 11 (Jan 9):** Review retrospective. We will measure success not by the number of RFCs rejected, but by the quality of discourse (e.g., are risks being flagged earlier?).

  ### Success Metrics
  We will consider this successful if:
  1.  **No Recurrence:** We avoid incidents where multiple reviewers later admit they "saw it but didn't say it."
  2.  **Efficiency:** Average time-to-approval does not increase by more than 10% over the trial period.
  3.  **Engagement:** All 5 ARB members submit comments on >80% of RFCs (preventing passive approval).

  ### Next Steps
  I request we vote on adopting this trial process at the start of our next meeting. If the tooling configuration proves too burdensome in Week 1, we will revert to a "Honors System" where we agree not to view comments until submitting our own, but I believe enforcing this via tooling removes the cognitive load of discipline.

  Let's build a process that leverages our expertise without relying on it as a safety net.
