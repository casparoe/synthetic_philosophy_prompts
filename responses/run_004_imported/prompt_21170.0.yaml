answer: |-
  The tension you describe lies at the fault line between decision theory and statistical physics. On one side stands the orthodox Expected Utility Maximization (EUM) framework, where Kelly betting is a derived consequence of a specific, contingent preference structure (logarithmic utility). On the other stands the ergodicity-economics framework (championed by Ole Peters), which posits that Kelly betting is a physical necessity imposed by the non-ergodic nature of multiplicative wealth dynamics, independent of subjective preference.

  To answer your question directly: **These are genuinely distinct normative theories, but their divergence is confined to the boundaries of the "infinite horizon, pure reinvestment" assumption.** In the canonical setting repeated ad infinitum on rationalist forums, they are mathematically isomorphic. However, once we introduce finite horizons, consumption, or bounded goals, the theories issue conflicting advice. In those conflicts, **EUM is normatively superior** because it correctly accounts for the agent's actual constraints and values, whereas the ergodicity story mistakenly conflates the dynamics of the *wealth* with the objectives of the *agent*.

  Here is the detailed comparison, the specific divergence, and the verdict on what is purchased by the ergodic reframing.

  ### 1. The Isomorphism: Why They Look the Same
  In the standard setup—a sequence of independent, identically distributed (i.i.d.) multiplicative bets with infinite reinvestment—the two stories converge perfectly.

  *   **The Orthodox Story:** An agent maximizes $E[U(W_T)]$. If $U(W) = \ln(W)$, the first-order condition for the optimal bet fraction $f$ yields the Kelly criterion.
  *   **The Ergodic Story:** The wealth process $W_t$ is non-ergodic; the ensemble average (expected wealth) diverges from the time-average (what one person experiences over time). However, the transformation $\ln(W_t)$ *is* ergodic. Therefore, the only meaningful observable growth rate is the time-average of the log-wealth. Maximizing this growth rate yields the Kelly criterion.

  Mathematically, by the Law of Large Numbers, the time-average growth rate $\lim_{T \to \infty} \frac{1}{T} \ln(W_T/W_0)$ converges to the expected log-return per step $E[\ln(W_1/W_0)]$. Thus, in this specific limit, maximizing time-average growth is identical to maximizing expected log-utility. This is why the "physicist's coat" fits so well: in the domain of infinite compounding, log-utility is not just a preference; it is the *eigenfunction* of the multiplicative operator.

  ### 2. The Divergence: Where the Coat Tears
  The divergence arises because EUM is a theory of *choice* (mapping states to values), while ergodicity economics is ostensibly a theory of *dynamics* (mapping processes to observables). The ergodicity argument claims that because the dynamics demand log-growth maximization, rational agents *must* adopt this objective. EUM counters that agents may have objectives other than long-run wealth maximization.

  #### The Conflict Scenario: The "EA Grant" Finite Horizon
  Consider an Effective Altruism grantmaker or a trader with a specific, bounded goal.
  *   **The Setup:** You have \$100,000. You face a series of 10 investment rounds (a finite horizon, $T=10$). In each round, you can bet a fraction $f$ on a 60/40 favorable coin flip (double or nothing).
  *   **The Goal:** You need to reach \$1,000,000 to fund a critical project. If you end with \$999,999, the project fails (Utility = 0). If you end with \$1,000,000 or more, the project succeeds (Utility = 1). Any wealth above \$1M provides no additional value.
  *   **The Ergodic Prescription:** The dynamics are multiplicative. The ergodic observable is the log-growth rate. To maximize the time-average growth rate, you must bet the Kelly fraction (20% in this case) every round.
  *   **The EUM Prescription:** Your utility function is a step function (bounded). Maximizing $E[U(W_{10})]$ means maximizing the *probability* of crossing the \$1M threshold.
      *   If you are far behind (e.g., after 5 rounds you have only \$200k), Kelly betting is too conservative; the probability of reaching \$1M with 20% bets is near zero. EUM dictates **overbetting** (increasing variance) to give yourself a fighting chance.
      *   If you are just below the target (e.g., \$950k), Kelly betting risks dropping you below the threshold. EUM dictates **underbetting** or stopping entirely to lock in the win.

  **Who gets it right?**
  **EUM gets it right.** The ergodicity argument fails here because it assumes the agent's objective is *unbounded growth*. It prescribes a strategy optimized for $T \to \infty$ to an agent operating at $T=10$ with a bounded utility function. The ergodicity framework, in its pure form, has no mechanism to incorporate the "step" in utility; it treats the \$1M target as just another point on the log-curve. If an ergodicity proponent adjusts the model to account for the target, they are implicitly reintroducing a utility function, thereby conceding the core claim that utility is unnecessary.

  ### 3. What Is Purchased by the Reframing?
  If the ergodicity story collapses into EUM with log utility in the infinite case, and fails to handle bounded goals in the finite case, what value does it add? It purchases three specific conceptual clarifications, though none amount to a overthrow of decision theory.

  **A. The Origin of Risk Aversion**
  Orthodox EUM treats risk aversion as a psychological primitive ("I happen to dislike variance"). Ergodicity economics reframes risk aversion as a **physical constraint**. In a multiplicative world, volatility drag is a real, measurable reduction in time-average growth. You don't need to *feel* risk-averse to avoid ruin; the math of compounding punishes variance regardless of your feelings. This is a powerful pedagogical tool for rationalist communities prone to viewing risk preferences as mere "tastes." It grounds the Kelly criterion in the territory (the dynamics) rather than the map (the preferences).

  **B. The Critique of Ensemble Averages**
  Peters' strongest contribution is the demolition of the "expected value" fallacy in non-ergodic contexts. Standard economics often justifies risky bets by pointing to a positive ensemble average (e.g., "The average outcome across 1,000 parallel universes is rich"). Peters correctly notes that the agent lives in *one* universe over *time*. If the time-average trajectory leads to zero, the ensemble average is irrelevant. This validates the Kelly instinct against "maximize expected dollar value" arguments without needing to invoke utility curvature.

  **C. The "Default" Utility**
  The ergodicity argument successfully promotes Log Utility from "one arbitrary choice among many" to "the natural null hypothesis for wealth accumulation." It suggests that unless you have a specific reason to deviate (like the EA grant target above), you should assume log utility because it aligns with the physics of the asset class. It shifts the burden of proof: instead of asking "Why log?", we ask "Why *not* log?"

  ### 4. Verdict: Physicist's Coat, Not a New Body
  The ergodicity-economics story is **the orthodox story wearing a physicist's coat.** It is not a distinct normative theory capable of overriding utility maximization; rather, it is a derivation of *which* utility function is appropriate for a specific class of dynamic processes.

  Samuelson was ultimately correct that Kelly betting is not universally rational; it is only rational for an agent who wants to maximize long-run geometric growth. Peters is correct that for multiplicative wealth processes, geometric growth is the only coherent time-average observable. But **coherence of the observable does not dictate the objective of the agent.**

  An agent may rationally choose to sacrifice long-run growth rate for a higher probability of meeting a short-term need (the EA grant), or for consumption flow (retirement), or to avoid psychological distress (sleeping well at night). The ergodicity argument cannot adjudicate these trade-offs because it lacks a theory of value—it only has a theory of dynamics.

  **Conclusion:**
  The "doctrinal status" of Kelly on rationalist forums is partially justified by the ergodicity insight: in the absence of specific constraints (finite horizon, consumption needs, bounded goals), Log Utility is the unique utility function consistent with the ergodic properties of multiplicative wealth. However, elevating this to a universal moral imperative ("*the* rational bet size") is a category error. The ergodicity story explains why risk aversion is physically grounded, but it does not absolve the agent of the responsibility to define their own utility. When the two diverge—as in the finite-horizon, bounded-goal scenario—Expected Utility Maximization remains the sovereign framework, because physics can tell you how the world moves, but only utility can tell you where you want to go.
