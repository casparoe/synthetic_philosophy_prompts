answer: |-
  Here is an argument structured for your philosophy club presentation. It is designed to be rigorous enough for a philosophy audience but clear enough to follow in a spoken presentation.

  ***

  # Title: The Price of Escape: Why the Non-Propositionalist Restriction Fails as a General Semantics

  ## 1. Introduction: The Triviality Trap
  To understand the stakes, we must first recall the problem David Lewis posed in 1976. We intuitively believe **The Equation**: the probability of a conditional ("If A, then C") should equal the conditional probability of the consequent given the antecedent ($P(C|A)$).

  However, Lewis proved that if conditionals are standard propositions (things that are simply true or false) and they obey The Equation, probability theory collapses. The only way to save The Equation is to accept that our probability distributions are "trivial" (i.e., we can only be certain about everything, which is absurd).

  **The Adams/Edgington Solution:** To avoid triviality, Ernest Adams and Dorothy Edgington argue that indicative conditionals **do not express propositions**. They have no truth conditions. Instead, they express degrees of belief. Crucially, to avoid logical paradoxes arising from this view, they restrict The Equation to **unembedded conditionals** (those standing alone as the main connective).

  **My Thesis:** This restriction is not a minor technical adjustment. It is a fundamental concession that abandons the project of providing a general semantics for the English word "if." By limiting the theory to unembedded cases, the non-propositionalist account describes a rule of *assertion*, not a meaning of a *connective*.

  ## 2. The Principle of Compositionality
  The primary goal of formal semantics is to explain **compositionality**: how the meaning of a complex sentence is derived from the meanings of its parts.

  In natural language, words are recursive tools. We expect the meaning of "if" to remain stable whether it appears in a simple sentence or nested inside a complex one.
  *   **Simple:** "If it rains, the match is cancelled."
  *   **Embedded:** "I doubt that **if it rains, the match is cancelled**."

  If a semantic theory says "if" has a specific probabilistic meaning in the first case, but has *no propositional content* in the second case (because it cannot be the object of "doubt" without truth conditions), that theory violates compositionality. It suggests that "if" changes its fundamental logical category depending on where it sits in the sentence. A semantics that cannot account for the recursive nature of language is not a semantics of the language; it is a semantics of a specific *fragment*.

  ## 3. The Linguistic Data: We Do Embed Conditionals
  The Adams/Edgington view implies that embedding conditionals under negation, disjunction, or other operators should be semantically defective or require radical paraphrasing. However, linguistic intuition suggests otherwise. Consider these natural English constructions:

  1.  **Negation:** "It is **not** the case that if you study, you will fail."
  2.  **Disjunction:** "**Either** if John comes we eat pizza, **or** if Mary comes we eat pasta."
  3.  **Quantification:** "**Every** student will succeed if they study."
  4.  **Higher-Order Conditionals:** "If, **if it rains, the match is cancelled**, then we should buy tickets now."

  If the non-propositionalist view is correct, these sentences should be notoriously difficult to interpret or logically incoherent, because you cannot negate or disjoin something that lacks a truth value. Yet, competent speakers understand these sentences immediately.

  To maintain their view, Adams and Edgington must argue that these sentences are either:
  *   Elliptical for more complex propositions.
  *   Governed by a different logic entirely.
  *   Pragmatically acceptable but semantically void.

  This is an ad hoc defense. It forces the theory to treat clear data as exceptions, rather than treating the data as evidence against the theory.

  ## 4. Confusing Semantics with Pragmatics
  The core strength of the Adams/Edgington view is that it captures the **assertibility conditions** of conditionals. It explains *when we are willing to say* "If A, then C." (Answer: When $P(C|A)$ is high).

  However, **semantics is not just about assertion.** It is about **content**.
  *   **Assertion:** A speech act performed by a speaker.
  *   **Content:** The information conveyed that can be manipulated, negated, questioned, or embedded.

  By restricting their account to unembedded conditionals, Adams and Edgington conflate the *use* of the conditional with its *meaning*. They provide a brilliant theory of how we *use* "if" to update beliefs, but they fail to provide a theory of what "if" *means* in the grammar of English.

  When I say, "I doubt that if A, B," I am not asserting the conditional. I am reporting an attitude toward the content of the conditional. If the conditional has no propositional content (as non-propositionalism claims), it is unclear what the object of my doubt is. The restriction to unembedded cases effectively admits: "We can tell you how to use 'if' to make a claim, but we cannot tell you what claim is being made."

  ## 5. The "Fragment" Concession
  Finally, we must address the scope of the debate. The philosophy of language seeks to explain natural language. Natural language is characterized by **productivity** and **recursion**.

  If a semantic theory works only for the "main clause fragment" of English, it has effectively conceded the debate. It admits that:
  1.  The word "if" does not have a unified meaning.
  2.  The logic of English conditionals cannot be integrated into the logic of English negation or disjunction.
  3.  The Equation ($P(A \to C) = P(C|A)$) is not a law of semantics, but merely a heuristic for isolated assertions.

  This is too high a price to pay to save The Equation. It is better to modify The Equation (as Angelika Kratzer does by treating "if" as a restrictor on modals rather than a sentential connective) or to accept a possible-worlds semantics (like Stalnaker) that allows for propositions while explaining away the triviality result through context sensitivity.

  ## 6. Conclusion
  David Lewis's triviality result presents a hard choice: either give up The Equation or give up the idea that conditionals are propositions. Adams and Edgington choose the latter, restricting their account to unembedded conditionals to avoid logical collapse.

  However, this restriction is fatal to the project of a general semantics. A theory that cannot explain how "if" functions under negation, within disjunctions, or inside attitude reports is not a theory of the English conditional. It is a theory of a specific speech act involving the word "if."

  By restricting the domain to avoid triviality, the non-propositionalist saves the probability equation but loses the language. In doing so, they concede that their account is not a semantics for "if," but merely a pragmatics for asserting it. For a philosophy of language that aims to explain meaning, that is a concession too far.
