      *   *Ontic vs. Epistemic:* The philosopher is talking about *ontic* probability (the state of the mathematical universe). The mathematician is talking about *epistemic* probability (the state of human knowledge).
      *   *Bayesianism:* This is the key framework. Bayesian probability allows for degrees of belief in logical truths based on incomplete information.
      *   *Logical Uncertainty:* This is a specific field in philosophy/AI. How do we assign probabilities to logical statements we haven't proved yet?
