      *   *Davidson (Radical Interpretation):* Extends Quine. To interpret a speaker, we must assign beliefs and meanings. These are holistically connected.
      *   *The Constraint:* Principle of Charity (or Principle of Rationality). We must interpret the speaker as having mostly true beliefs and logical consistency *by our own lights*. We maximize agreement.
      *   *The Goal:* Not just prediction, but making the speaker intelligible as a rational agent.

