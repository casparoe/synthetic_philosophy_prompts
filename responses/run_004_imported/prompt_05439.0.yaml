      *   Mark: "That's cheating."
      *   Sarah: "So is yours."

  5.  **Refining - Adding Voice and Texture:**
      *   Make it sound like siblings. Interrupting, finishing sentences, referencing past fights.
      *   Use specific terminology correctly but naturally.
      *   Add sensory details (warm wine, dad's laugh, noise).
      *   *Correction:* Make sure the Brother's argument about PP is structural. It's about *empirical closure*. If SIA is true, we don't need telescopes.
      *   *Correction:* Make sure the Sister's argument about Reference Class is sharp. SSA creates "magical" correlations (Adam & Eve).

  6.  **Drafting the Dialogue (incorporating the above):**
