      *   *Mark:* "It's a prior that swamps data. That's not science, that's numerology."
      *   *Elena:* "Okay, Mr. SSA. Doomsday boy. Define your class."
      *   *Mark:* "Observers."
      *   *Elena:* "Which ones? Conscious? Carbon-based? People who like dad's punch?"
      *   *Mark:* "Don't be glib."
      *   *Elena:* "If you narrow it to 'people named Mark,' Doomsday vanishes. If you widen it to 'mammals,' humanity looks like a blip. You pick the class to get the result you want."
      *   *Mark:* "At least I don't believe in magic deer." (Reference to Adam/Eve).
      *   *Elena:* "At least I don't need the universe to end soon to make my math work."

  7.  **Polishing:**
      *   Tighten the rhythm. Make the interruptions more natural.
      *   Ensure the "Presumptuous Philosopher" specific point lands: The idea that *existence itself* is evidence for a larger universe is what bothers him.
      *   Ensure the "Reference Class" point lands: SSA is arbitrary.
      *   Add the Dad element to ground it.

  8.  **Final Review against constraints:**
