answer: |-
  The bass from the playlist Dad insisted on choosing thumped through the floorboards, vibrating the ice in Elena's wine glass. Across the kitchen island, Mark was staring at her like she'd just claimed the earth was flat.

  "You're actually sticking with it," Mark said. He was holding a beer he hadn't taken a sip of in ten minutes. "After Bostrom? After the Presumptuous Philosopher?"

  "The Presumptuous Philosopher isn't a reductio, Mark. It's a feature." Elena leaned back against the counter, watching their father hold court in the living room. "If SIA is correct, the fact that I exist *is* data. It favors hypotheses with more observers. It's just Bayesian updating."

  "It's not updating, it's cheating," Mark snapped, lowering his voice as their aunt walked past with a plate of deviled eggs. "Think about the structure, El. Theory One says the universe has a trillion observers. Theory Two says a trillion trillion. According to you, I don't need a telescope. I don't need a particle collider. I can just sit in an armchair, reason that I exist, and conclude Theory Two is a trillion times more likely. You're saying armchair metaphysics overrides empirical measurement."

  "I'm saying the measurement is already happening. I'm the measurement."

  "You're a bias!" He tapped the counter. "It implies we can rule out small-universe theories *a priori*. It closes off inquiry. If you're right, physics is done. We just count heads and call it a day."

  "Better than the alternative," she shot back. "Which is you, huddled in the corner, waiting for the apocalypse because you got the reference class wrong."

  Mark rolled his eyes. "Here we go."

  "SSA requires a reference class, Mark. Define it. Go."

  "Observers. Conscious agents."

  "Too broad. Include chimps? Include aliens? Include simulations?" Elena swirled her wine. "If you include simulations, the Doomsday Argument evaporates because the class is infinite. If you exclude them, you're assuming physicalism without proof. You're rigging the denominator."

  "I'm not rigging anything. I'm being conservative. I'm saying I should reason as if I'm a random sample from the people who *actually exist*."

  "Which people? Past, present, future?"

  "Obviously future is probabilistic, that's the point—"

  "No, listen," she cut in, leaning forward. "If you define the class as 'humans born after 1950,' the Doomsday clock moves. If you define it as 'sentient beings in the Milky Way,' humanity is a blip, and your birth rank means nothing. You pick the reference class that gives you the existential dread you crave. It's ad hoc. At least with SIA, the math is consistent. I don't have to draw arbitrary lines around who counts as 'me.'"

  "You have to accept that a philosopher can prove the universe is infinite without looking out the window!" Mark hissed. "That's not consistency, that's megalomania. It's the Presumptuous Philosopher. You're presuming the universe is built to maximize the probability of *you*."

  "I'm presuming nothing. I'm acknowledging that existence is more likely in a world where there's more of it."

  "That is literally the definition of presumption!"

  A roar of laughter went up from the living room. Dad was telling the story about the tenure committee again. They both paused, watching him. He looked small in the armchair, surrounded by people who didn't know he'd spent the last decade worrying about the heat death of the universe.

  Mark turned back to her, softer now. "It's the Adam and Eve problem, El. You know it. If you follow SIA to its logical conclusion, you get magical correlations. A single hunter-gatherer can reason that a deer won't bite him, because if it did, he wouldn't be an ancestor of billions. You're buying into anthropic magic."

  "And you're buying into a self-fulfilling prophecy where the universe has to end soon so your statistics don't break," Elena said. "We're both picking our poison. I'd rather live in a big universe than a short one."

  "It's not about preference. It's about whether science is possible."

  "Science is possible," she said, finishing her wine. "It just requires you to admit that *you* are part of the data set."

  "I'm the observer, not the data."

  "Same thing."

  "No," Mark said, picking up his warm beer. "It's not."

  They stood there in the kitchen noise, the argument hanging between them, unresolved, as the party swelled around them.
