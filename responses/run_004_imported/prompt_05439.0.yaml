  So I'm drafting a chapter where two ex-academic siblings (she's a cosmologist, he dropped out of a philosophy phd) get into it at their dad's retirement party over anthropic reasoning—it's a weird hill for them to die on but that's kind of the joke. She's the self-indication assumption type, made peace with the presumptuous philosopher ages ago and doesn't think its even that weird; he's SSA through and through, doomsday-pilled, thinks she's nuts for believing the universe basically has to be huge just from armchair reasoning. Can you write their argument for me? I want him to actually pin her down on the presumptuous philosopher specifically—not just "that sounds crazy" but the real structure of why its supposed to be a problem—and I want her to have something sharper than "I just accept it," maybe using the reference class mess in SSA to turn it back on him. Should read like two people who've had this fight before, not a philosophy 101 explainer. A page or so is plenty, and it doesn't need to resolve.
