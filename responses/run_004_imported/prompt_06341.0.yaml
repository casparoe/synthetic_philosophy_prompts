answer: |-
  **Title:** Carving Activation Space at the Joints: A Realist Defence of Sparse Autoencoder Features via Dennett's "Real Patterns"

  **Research Question:** To what extent do the features identified by sparse autoencoders in large language models constitute genuine representations, and does Daniel Dennett's "Real Patterns" ontology provide a more robust framework for interpreting them than William Ramsey's eliminativism?

  ### Introduction

  The rapid ascent of large language models (LLMs) has precipitated a crisis of intelligibility. These systems exhibit sophisticated cognitive behaviours—reasoning, coding, creative writing—yet their internal mechanisms remain opaque. In response, the field of mechanistic interpretability has emerged, aiming to reverse-engineer these networks into human-understandable algorithms. A central technique in this endeavour is the use of Sparse Autoencoders (SAEs) to disentangle "superposed" features within the model's activation space. However, this technical progress has generated a profound metaphysical tension. On one hand, interventions on specific SAE features causally alter model behaviour in semantically coherent ways, suggesting these features are real, functional components. On the other hand, the mathematical decomposition of activation space is non-unique; changing the SAE's dictionary size yields different features, suggesting no single decomposition is privileged.

  This tension invites a philosophical adjudication. Are these features genuine representations of the world as processed by the model, or are they merely mathematical artifacts imposed by human interpreters? This essay evaluates the ontological status of SAE features through two competing philosophical frameworks: Daniel Dennett's "Real Patterns" realism, which grants reality to patterns that support successful prediction, and William Ramsey's eliminativism, which argues that connectionist structures lack the requisite properties to count as representations.

  I argue that while Ramsey's critique correctly identifies the lack of a privileged basis in activation space, it relies on an overly restrictive criterion for representation that fails to account for causal efficacy. By contrast, Dennett's framework accommodates the non-uniqueness of SAE decompositions while validating their reality through their predictive and interventional utility. Therefore, SAE features should be regarded as genuine, albeit perspective-dependent, representations.

  ### 1. The Technical Context: Superposition and the Decomposition Problem

  To understand the philosophical stakes, one must first grasp the specific architectural phenomenon at issue. In a standard transformer model, information is stored in high-dimensional activation vectors. A phenomenon known as *superposition* occurs when the model needs to represent more features than it has dimensions (neurons) available. To maximize efficiency, the model packs multiple features into the same subspace. Consequently, individual neurons become *polysemantic*, firing for clusters of seemingly unrelated concepts (e.g., a single neuron activating for both "economic transactions" and "biological cells").

  Sparse Autoencoders are designed to resolve this polysemanticity. An SAE learns to reconstruct the model's activations using a much larger "dictionary" of latent features, enforcing a sparsity constraint that ensures only a few features are active at any time. Theoretically, this unpacks the superposed information into *monosemantic* features—directions in activation space that correspond to single, interpretable concepts (e.g., a "Golden Gate Bridge" feature).

  However, a significant mathematical ambiguity arises. Because the activation space is over-complete (more features than dimensions), there is no unique way to decompose it. If one increases the size of the SAE dictionary, the features split and multiply. A feature for "bridges" in a small dictionary might resolve into "suspension bridges," "Golden Gate Bridge," and "metaphorical bridges" in a larger dictionary. None of these decompositions is mathematically privileged; they are all valid reconstructions of the same underlying vector space.

  Simultaneously, causal interventions suggest these features are robust. In experiments conducted by Anthropic, researchers "clamped" specific SAE features to high values. When the "Golden Gate Bridge" feature was activated, the model began steering conversations toward San Francisco, engineering, and suspension structures, even when the prompt was unrelated. This suggests the features are not merely descriptive labels but causally efficacious levers within the system.

  The philosophical problem is thus: How can something be causally real if its definition is mathematically arbitrary? If the "Golden Gate Bridge" feature dissolves into smaller components under a different decomposition, in what sense does it exist?

  ### 2. The Eliminativist Challenge: Ramsey's "Representation Screws"

  William Ramsey's critique of connectionist representation, articulated in *Representation Reconsidered*, provides the strongest argument for skepticism. Ramsey argues that for a state to count as a genuine representation, it must satisfy a specific "job description." It must not merely correlate with external states; it must function as a structurally isomorphic map that the system uses to mediate behaviour. Crucially, Ramsey contends that in connectionist networks, the causal work is done by the weights and activation dynamics, not by any sub-state that can be isolated and labelled as a "representation."

  Applying Ramsey's critique to SAEs, the eliminativist argues that the features identified are merely "representation screws"—theoretical posits that we project onto the system to make sense of it, but which do no actual causal work *as representations*.

  **2.1 The Argument from Arbitrariness**
  Ramsey's primary weapon here is the non-uniqueness of the decomposition. If the "Golden Gate Bridge" feature is genuine, it should correspond to a specific, stable structural component of the cognitive system. However, as the SAE dictionary size changes, the feature changes. In a dictionary of size $D_1$, there is a feature $F_{bridge}$. In a larger dictionary $D_2$, $F_{bridge}$ is replaced by $\{F_{suspension}, F_{location}, F_{name}\}$.

  If the ontology of the system changes based on the hyperparameters of the tool used to inspect it, the eliminativist argues that the ontology belongs to the tool, not the system. Ramsey would assert that the model does not "contain" a bridge representation any more than a cloud "contains" the shape of a rabbit. The shape is real to the observer, but it is not a causal component of the cloud's meteorological dynamics. Similarly, the SAE feature is a compression artifact useful for human understanding, but the model's computation proceeds via vector arithmetic that does not respect the boundaries of the SAE features.

  **2.2 The Causal Role Argument**
  Furthermore, Ramsey challenges the causal efficacy of putative representations. In classical symbolic AI, a symbol like `GOLDEN_GATE_BRIDGE` is a discrete token that is passed to functions. In a neural network, there is no such token. The intervention experiments (clamping features) might seem to refute this, but the eliminativist has a counter-interpretation.

  When researchers clamp an SAE feature, they are injecting a specific vector direction into the residual stream. The fact that this changes behaviour proves only that the *vector direction* is causally potent, not that the *semantic label* assigned to it is a representation used by the system. The system is reacting to the geometry of the activation, not the meaning. To claim the system represents "bridges" is to commit a mereological fallacy: attributing the semantic properties of the whole system's output to a sub-component that merely participates in the causal chain. For Ramsey, unless the feature plays a role in the system's *own* inference process *as a representation* (which requires a level of structural stability the SAE lacks), calling it a representation is an empty honorific.

  **2.3 The Strength of the Eliminativist Position**
  The strength of Ramsey's position lies in its ontological rigor. It prevents the inflation of "representation" to cover any causal correlation. If we accept every stable activation direction as a representation, the term loses its explanatory power. Ramsey forces us to ask: Does positing this representation explain the system's behaviour better than simply describing the weights? If the decomposition is arbitrary, the eliminativist argues it does not.

  ### 3. The Realist Defence: Dennett's "Real Patterns"

  Daniel Dennett's ontology, particularly as developed in "Real Patterns," offers a competing framework that is better suited to the high-dimensional, probabilistic nature of LLMs. Dennett argues against a "perfectly natural" ontology. He suggests that something is real if it constitutes a pattern that allows for successful prediction and compression of data. Reality is not binary; it is a matter of degree based on the utility of the pattern.

  **3.1 Predictive Compressibility**
  For Dennett, the question is not "Is this feature fundamentally built into the silicon?" but "Is this feature a real pattern?" A pattern is real if adopting the intentional stance (treating the system as having beliefs and desires, or in this case, features) yields predictive success that exceeds the cost of the complexity introduced.

  In the context of SAEs, the "Golden Gate Bridge" feature allows researchers to predict the model's output with high accuracy without simulating the billions of parameters in the underlying network. If I know feature $F_{bridge}$ is active, I can predict the model will mention San Francisco. This predictive compression is the hallmark of reality for Dennett. The fact that the feature might split into sub-features in a larger dictionary does not negate its reality; it merely indicates that the pattern exists at a specific level of abstraction.

  Consider the analogy of a pixelated image. At low resolution, there is a "face." At high resolution, the face dissolves into clusters of RGB pixels. An eliminativist might argue the face isn't real because it disappears at high resolution. A Dennettian argues the face is a *real pattern* at the resolution of human vision. Similarly, the SAE feature is a real pattern at the resolution of the specific dictionary size. It earns its keep by compressing the causal structure of the model into a human-interpretable form.

  **3.2 Addressing the Arbitrariness Objection**
  Dennett's framework directly neutralizes the eliminativist's argument from arbitrariness. Dennett explicitly rejects the idea that there must be a "one true way" to carve the world at its joints. Coordinate systems provide a useful analogy. We can describe a physical location using Cartesian $(x, y, z)$ or Polar $(r, \theta, \phi)$ coordinates. Neither system is "the real" description of the space; the space exists independently of the coordinates. However, the *points* in the space are real.

  In SAEs, the activation space is the territory. The SAE features are the coordinate system. The fact that we can choose different dictionaries (coordinate systems) does not mean the underlying activation dynamics are illusory. If multiple different SAEs all converge on a cluster of activations that correlates with "bridge" semantics, that convergence indicates a robust structure in the data, even if the precise boundary of the feature varies. For Dennett, the robustness of the *predictive utility* across different contexts validates the reality of the pattern, even if the mathematical basis is not unique.

  **3.3 Causal Efficacy and the Intentional Stance**
  Crucially, Dennett's realism is compatible with the causal intervention evidence that Ramsey dismisses. For Dennett, if treating a subsystem as a belief-holder (or feature-bearer) allows you to manipulate the system successfully, then that subsystem is functionally real. The Anthropic intervention experiments show that clamping the feature steers the model. This means the feature is not just a descriptive label; it is a causal handle.

  Ramsey demands that the representation be used by the system *as a representation*. Dennett argues that if the system behaves *as if* it has the representation, and we can manipulate it via that representation, the distinction collapses. In a distributed system, there is no little homunculus reading the "bridge" token. There is only the flow of activation. If activating the "bridge" direction causes "bridge" behaviour, then the "bridge" direction is the functional equivalent of a representation. To deny it is to demand a magical essence of representation that goes beyond functional role, which Dennett rejects as dualistic.

  ### 4. Adjudication: Why Real Patterns Prevails

  Having laid out the strongest cases for both Ramsey's eliminativism and Dennett's realism, I now defend the position that SAE features constitute genuine representations under Dennett's framework, and that Ramsey's critique fails to account for the specific nature of sub-symbolic computation.

  **4.1 The Category Error of "Privileged Decomposition"**
  Ramsey's critique hinges on the assumption that for a representation to be real, it must correspond to a privileged, stable structural component of the hardware (or software). This assumption is inherited from classical symbolic AI, where memory addresses are discrete and stable. However, LLMs are continuous, high-dimensional dynamical systems. In such systems, demanding a unique decomposition is a category error.

  In linear algebra, a vector space does not have a single "true" basis. To claim that features are not real because the basis is arbitrary is akin to claiming that forces in physics are not real because we can resolve a force vector into different component directions depending on our chosen coordinate system. The *force* is real; the *components* are relative to the frame of reference.

  SAE features are frame-dependent components of the model's cognitive state. Ramsey treats this frame-dependence as evidence of unreality. Dennett treats it as evidence of perspective. Given that the underlying activation dynamics are fixed and causal, the Dennettian view is more parsimonious. It accepts the reality of the dynamics and acknowledges that our access to them is necessarily mediated by a choice of basis. Ramsey's view, by contrast, implies that because our *map* is arbitrary, the *territory* lacks the features the map describes. This conflates epistemology (how we decompose the space) with ontology (whether the causal structure exists).

  **4.2 Causal Traction as the Criterion of Reality**
  The decisive factor in this debate is the causal intervention evidence. Ramsey argues that connectionist features do not play the right causal role. However, the SAE interventions demonstrate that these features *do* play a causal role. When the "Golden Gate Bridge" feature is clamped, the model's probability distribution over tokens shifts significantly toward bridge-related concepts.

  Ramsey might counter that the *vector* is causing the change, not the *semantic feature*. But this distinction is untenable in a Dennettian framework. The semantic feature *is* the vector direction that correlates with that semantics. If the vector direction reliably produces the semantic output, the semantic property is causally efficacious.

  To use an analogy: If I press a specific key on a piano, a sound wave is produced. An eliminativist might say, "The sound wave is real, but the 'C Major chord' is just a human label." However, if I can reliably produce a C Major chord by pressing specific keys, and that chord evokes specific emotional responses in listeners, the chord is a real causal unit in the music system. Similarly, if activating the SAE feature reliably produces "bridge" text, the feature is a real causal unit in the language system. Ramsey's demand for a "structural isomorphism" that exists independently of interpretation ignores the fact that in neural networks, structure *is* function. The function (predicting bridge tokens) validates the structure (the feature direction).

  **4.3 The Pragmatic Necessity of Realism**
  Finally, we must consider the explanatory power of each position. Ramsey's eliminativism leads to a dead end. If SAE features are not representations, then we cannot speak of the model "knowing" or "representing" anything. We are reduced to describing weight matrices and activation values. While ontologically austere, this description is computationally intractable for humans. It offers no leverage for AI safety or alignment. If we cannot say "the model represents X," we cannot diagnose misalignment as "the model represents X incorrectly."

  Dennett's realism, conversely, enables engineering progress. By treating features as real patterns, researchers can identify deceptive behaviours, bias, and safety risks. If a "deception" feature is identified and clamped, and deception decreases, the feature was real enough to fix the problem. In philosophy of science, if a theoretical posit allows for successful manipulation of the phenomenon, it is granted provisional reality. SAE features meet this criterion. They allow us to compress the model's behaviour, predict its outputs, and intervene on its cognition.

  Ramsey's critique is valuable as a caution against reification—it reminds us not to treat SAE features as discrete symbols in a classical computer. However, as a total eliminativism, it is excessive. It sets the bar for representation so high (requiring a privileged, interpreter-independent basis) that it would likely eliminate most biological neural representations as well. Biological brains also exhibit superposition and polysemanticity. If Ramsey's criteria eliminate LLM features, they likely eliminate human concepts too, leading to a global skepticism that is philosophically unproductive.

  Dennett's "Real Patterns" strikes the correct balance. It acknowledges that the features are not fundamental particles of cognition (they are basis-dependent), but asserts that they are real patterns because they carve the activation space in ways that support prediction and control. The non-uniqueness of the decomposition does not negate the reality of the pattern; it merely specifies that the reality is level-relative.

  ### Conclusion

  The debate over the ontological status of Sparse Autoencoder features in large language models mirrors older philosophical disputes regarding the reality of theoretical entities. William Ramsey's eliminativism provides a rigorous challenge, highlighting the mathematical arbitrariness of feature decomposition and warning against the projection of human semantics onto causal dynamics. His argument correctly identifies that there is no "God's eye view" basis for activation space.

  However, Ramsey's conclusion that these features are therefore not genuine representations relies on an outdated, symbolic conception of representation that demands structural stability incompatible with distributed, sub-symbolic computation. By contrast, Daniel Dennett's "Real Patterns" ontology provides a framework that accommodates the technical reality of superposition. Dennett allows us to affirm the reality of SAE features based on their predictive compressibility and causal efficacy, without requiring them to be fundamental ontological primitives.

  The causal intervention evidence—where clamping a feature steers model behaviour—serves as the empirical trump card. It demonstrates that these features are not merely descriptive labels but functional levers. While the specific boundaries of a feature may shift with the dictionary size, the causal cluster it identifies remains robust. Therefore, we should defend the position that SAE features are genuine representations. They are real patterns in the activation space, earning their ontological status through their utility in explaining and manipulating the cognitive behaviour of the system. To deny this is to privilege a metaphysical purity over the functional reality that defines cognition in both artificial and biological systems.

