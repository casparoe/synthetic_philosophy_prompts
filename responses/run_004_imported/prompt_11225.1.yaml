      *Wait, one more thing:* The prompt asks for "ordinary physical objects." A slime mould is biological. Is that okay? Yes, van Inwagen's organicism *is* about biology. The "ordinary objects" (chairs) are the ones that *don't* exist. The story must show the contrast. I will include a chair in the room to emphasize its non-existence compared to the mould.

      *Let's write.*

      *(Drafting thought)*: Make sure not to get too bogged down in jargon. Keep it narrative.

      *(Final Plan)*:
      1. Introduction to the Bureau of Ontology.
