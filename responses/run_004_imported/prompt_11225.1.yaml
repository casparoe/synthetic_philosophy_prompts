answer: |-
  **The Census of the Viscous**

  In the Bureau of Ontological Census, we do not count chairs. To count a chair would be a category error, a lie of the tongue. There are only simples arranged chairwise: atoms of wood, molecules of varnish, electrons in spin, resting in a specific relation. They do not compose an object. They merely lie side by side. According to the Doctrine of Organicism, codified by the High Metaphysician van Inwagen, composition occurs only when the activity of the simples constitutes a life. Thus, the only composite objects in the universe are living organisms. I, as a Junior Taxonomist, am tasked with verifying the boundaries of these objects.

  My station is a sterile room containing a single oak desk (which does not exist), a lamp (which does not exist), and Petri Dish 404. Inside the dish lies Specimen 89-B, a plasmodial slime mould, *Physarum polycephalum*.

  The slime mould is a taxonomist's nightmare. It is a single cell, macroscopic and yellow, pulsing with the flow of protoplasm. It contains millions of nuclei, drifting freely within a shared membrane. It is, by the Doctrine, a composite object. The activity of its constituent simples constitutes a life. Therefore, it is a *y* composed of many *xs*. It is real. The dish it sits in is not. The agar it feeds upon is not, save for the bacteria living upon it, which are themselves real objects.

  My task was simple: monitor the continuity of Specimen 89-B. Objecthood, under Organicism, is tethered to the singular event of a life. If the life ends, the object ceases to exist. If the life continues, the object persists. But the *Physarum* does not respect the geometry of identity.

  On the third day, I placed two oat flakes at opposite ends of the dish. The mould, sensing the nutrients, extended two pseudopodia. It flowed toward them, a yellow river dividing around a central island of empty agar. Slowly, the main mass thinned. The connection between the left lobe and the right lobe stretched until it was a filament no wider than a human hair.

  Here lay the mereological precipice. If the filament snapped, the life would bifurcate. We would have Life A and Life B. But what of Object Y?

  If Object Y is defined strictly by the activity constituting *a* life, then at the moment of fission, does Object Y vanish? Does one object die so that two new ones may be born? Or does Object Y persist in both, implying that one object can be in two places at once, violating the transitivity of identity?

  I watched the filament tremble. In the corner of the room sat a wooden stool. I knew, intellectually, that the stool was not there. There were only stool-wise simples. Yet, if I were to kick it, my foot would hurt. The pain would be real, the simples arranging themselves into a nerve-impulse pattern. But the stool itself remained a fiction. The slime mould, however, was a truth. It was the only thing in the room, besides myself, that possessed the metaphysical dignity of unity.

  The filament snapped.

  The left lobe retracted, engulfing the oat. The right lobe did the same. Two distinct pulses now thrummed in the dish. Two lives.

  I opened my ledger to record the death of Specimen 89-B and the birth of 89-B-1 and 89-B-2. But my pen hovered. I looked closer. The mould was not merely dividing; it was exploring. An hour later, the two lobes extended new tendrils. They crept around the perimeter of the dish and met again on the far side, fusing into a ring.

  Now, the activity of the simples constituted a life that was topologically a donut. The simples in the left lobe were exchanging cytoplasm with the simples in the right lobe. The life was continuous again. Had Object Y returned? Or was this a new object, Object Z, composed of the parts of the previous two?

  If Organicism is true, the identity of the object is the identity of the life. But lives are processes, not substances. They are flames, not stones. If I light a candle from another candle, is it the same flame? The Doctrine offers no guidance on the topology of lives. It only states: *composition occurs when the activity of the xs constitutes a life.*

  I decided to test the boundary of "activity." I took a scalpel—real, insofar as I am a living organism wielding it—and severed a small fragment of the mould. I placed this fragment on a non-existent glass slide. It continued to pulse. It was alive. Therefore, it was an object.

  But consider the fragment I removed. Was it part of the original object? Before the cut, the simples in that fragment were participating in the life of the whole. Their activity was caught up in the greater flow. They were parts of Y. After the cut, their activity constituted a new, smaller life. They were now parts of X.

  This implies that the parts of an object can cease to be parts of that object without the object ceasing to exist, and without the parts ceasing to be objects themselves. This is permissible. But what if I place the fragment back?

  I nudged the fragment against the main mass. They fused. The cytoplasm mingled. The activity of the fragment's simples was once again subsumed into the greater flow. Did the fragment cease to exist? Yes. Did the main object cease to exist? No.

  The horror of Organicism is not that chairs do not exist. It is that the existence of the things that *do* exist is terrifyingly fluid. I looked at my own hand. It is a composite object. The cells are dying and being replaced. The simples are scattering and reassembling. I am a wave pattern in a field of atoms.

  I returned my gaze to the dish. The slime mould had solved the maze of oats. It had formed a network of efficient tubes. It was a single object, vast and distributed. But then, I noticed a speck of dust that had fallen into the dish. It was inert. It was not alive. It was merely dust-wise simples.

  The mould flowed over the dust. It engulfed the speck. The speck was now inside the membrane. Was the speck now a part of the object?

  Van Inwagen's criterion is strict: composition occurs when the activity constitutes a life. The dust speck was not active. It was not participating in the life; it was merely being carried by it. It was a passenger, not a part. If I swallow a coin, I do not become a composite object of flesh and metal. The coin remains outside the scope of my composition.

  But the boundary was blurring. The mould began to secrete enzymes onto the dust, breaking it down, absorbing the minerals. At what precise moment did the dust cease to be dust-wise simples and become mould-wise simples? When the chemical bond broke? When the atom entered the membrane? When it was incorporated into the metabolic flow?

  There is no sharp line in nature, yet Organicism demands one. To say the object exists is to draw a circle around a flame and say, "Here, and only here, is the fire."

  I closed my ledger. The lamp above me flickered. It does not exist, yet it casts a shadow. The slime mould pulses, and it does exist, yet it has no fixed shape. I realized then that the Special Composition Question is not a question about the world, but a question about our hunger for nouns. We want there to be *things*. We want the chair to be a chair. We want the mould to be one mould.

  The Doctrine grants existence only to the struggle against entropy. The slime mould is a localized rebellion against decay. That is why it is an object. The chair is not fighting; it is merely surrendering slowly.

  I watched the two lobes of the mould fuse again, completing the ring. One life. One object. For now. Tomorrow, it might dry out. It might split into a thousand spores. Object Y would vanish, and a thousand new objects would scream into existence, born of the same activity, heirs to the same flow.

  I picked up the non-existent pen and wrote in the real ledger: *Specimen 89-B persists.* It was a lie, of course. It was not the same specimen. It was the same life. And in this world, that is the only truth we are allowed to hold. I capped the pen and sat in the silence of the room, surrounded by a million invisible chairs, waiting for the next breath to compose me anew.
