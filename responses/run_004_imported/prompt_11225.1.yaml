      *(Refining the Plot)*: Let's make the narrator someone who has to *destroy* non-composite objects. A janitor of ontology. He finds a slime mould that merges with a dead leaf. Is the leaf now part of the object? No, only if it participates in the life. But what if the mould *becomes* the shape of a chair? Does a chair exist then? No, because no life. But what if the mould *is* the life?
      Okay, the strongest puzzle is the *fission* problem. If Object O is defined by Life L, and L splits into L1 and L2, does O survive?
