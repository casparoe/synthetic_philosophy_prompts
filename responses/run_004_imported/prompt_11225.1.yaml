  1.  **Analyze the Request:**
      *   **Topic:** Mereology, specifically Peter van Inwagen's Special Composition Question (SCQ).
      *   **Specific Theory:** Organicism (composition occurs *only* when the activity of the parts constitutes a life).
      *   **Competing Theories:** Universalism (everything composes something), Nihilism (nothing composes anything).
      *   **Constraint:** 1,000 - 1,500 words.
      *   **Style:** Borges or Calvino (intellectual, fable-like, focused on the abstract puzzle, not heavy psychology or standard plot).
      *   **Content:** Dramatize a "hard case" for the "life" criterion (slime mould, coral, conjoined twins, lichen, etc.).
      *   **Avoid:** Robots/AI discovering consciousness (focus on ordinary physical objects/biology).

  2.  **Select the "Hard Case":**
      *   *Slime mould:* Good candidate. It's a single cell with many nuclei (plasmodium) or a collection of individuals coming together. It blurs the line between "one" and "many."
      *   *Coral:* A colony of polyps acting as a reef.
      *   *Lichen:* A symbiosis of fungus and algae. Is it one organism or two?
      *   *Selection:* The Slime Mould (*Physarum polycephalum*). It offers a visceral image of something that flows, divides, and rejoins. It challenges the "life" criterion because when it splits, does the object cease to exist? When it merges, does a new object arise? It fits the Borges/Calvino vibe of a strange natural history.

  3.  **Determine the Plot/Structure:**
      *   Needs to be conceptual. A narrator observing or interacting with the phenomenon.
      *   Let's create a setting: An archive, a garden, or a laboratory that feels like a library. Let's go with a "Garden of Parts."
      *   Protagonist: A curator or taxonomist of existence.
      *   Conflict: The classification of a specific entity that defies the Organicism rule.
      *   Ending: Ambiguous or revealing the absurdity of the strict criterion.

  4.  **Drafting - Section by Section:**

      *   **Introduction:** Establish the world where van Inwagen's theory is literal law or dogma. The "Ontological Census." Introduce the narrator's task.
      *   **The Theory:** Briefly explain Organicism within the narrative context. Chairs don't exist; people do.
      *   **The Specimen:** Introduce the slime mould. Describe its behavior (merging, splitting).
      *   **The Problem:** If life is the criterion, what happens when the life divides? Is it one object becoming two? Or does the object vanish and two new ones appear?
      *   **The Climax:** A moment of decision or observation where the definition breaks down. The mould consumes something "non-existent" (like a chair/stone).
      *   **Conclusion:** Reflection on the nature of boundaries.

  5.  **Refining the Style (Borges/Calvino):**
      *   Use precise, slightly detached language.
      *   Focus on taxonomy and logic.
      *   Avoid emotional angst; focus on ontological anxiety.
      *   Metaphors should be geometric or botanical.

  6.  **Writing - First Pass (Mental or rough notes):**
