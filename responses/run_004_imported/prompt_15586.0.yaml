              1.  The "Habit" move vs. Hume's regularity theory (God as constant conjunction).
              2.  Ibn Rushd's (Averroes) objection regarding scientific knowledge/secondary causes.
              3.  The *kasb* (acquisition) doctrine and human moral responsibility.
              4.  Falsifiability/Evidence against occasionalism.
