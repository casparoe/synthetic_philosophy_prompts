      *   *Motivation:* Preserve divine omnipotence and sovereignty against the Neoplatonic/Aristotelian necessity of the philosophers.
      *   *Mechanism:* "Custom" (*adah*) of God. Things happen in sequence, but not *because* of the sequence.
      *   *Human Action:* *Kasb* (acquisition). God creates the act, human "acquires" it (makes it theirs morally).
      *   *Critiques:* Makes science impossible (why study nature if it does nothing?), makes morality incoherent (why punish us if God did the act?), makes God deceptive (why create the *appearance* of causality?).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Question 1: The Hume Connection (Required).*
          *   *Idea:* Al-Ghazali says "habit." Hume says "custom." Is this just the same thing with a theological wrapper?
