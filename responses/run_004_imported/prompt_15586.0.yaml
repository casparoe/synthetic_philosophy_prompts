          *   *Follow-up:* If she says "Science describes patterns," ask why we need the "God" variable if the patterns are stable enough to model without Him.
          *   *Drafting:* Use the chemist background. "Predictive power vs. Explanatory power."

      *   *Question 3: Moral Responsibility/Kasb (Required).*
          *   *Idea:* If I raise my hand, God creates the motion. If I steal, God creates the theft. How am I responsible?
          *   *Follow-up:* If she explains *kasb* (acquisition), ask what *work* acquisition does. Is it just a label?
          *   *Drafting:* Focus on the "locus of agency."

      *   *Question 4: Falsifiability/Evidence (Required).*
          *   *Idea:* What would prove you wrong? If a miracle happens, you say "God changed habit." If normalcy, "God kept habit."
          *   *Follow-up:* If she says "Miracles," ask how we distinguish a miracle from a random fluctuation without assuming causality.
          *   *Drafting:* Frame it as a "closed loop" problem.

      *   *Question 5: Divine Deception.*
          *   *Idea:* God makes it *look* exactly like causality. Is God deceiving us?
          *   *Follow-up:* If she says "No, it's a test," ask why truth about physics matters less than truth about salvation.
          *   *Drafting:* Connect to the "veracity of God."

      *   *Question 6: The Problem of Evil/Pain.*
          *   *Idea:* If I touch fire and burn, God is directly causing my pain every instant. Doesn't this make God the immediate author of suffering more than occasionalism admits?
          *   *Follow-up:* If she says "Suffering is soul-making," ask why the *mechanism* needs to be direct divine action rather than natural consequence.
          *   *Drafting:* Focus on the immediacy of divine action in pain.

      *   *Question 7: Ontological Parsimony (Ockham's Razor).*
