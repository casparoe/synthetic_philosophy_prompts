prompt: |-
  Ok so this is going to sound like an odd ask but bear with me. I got diagnosed with ADHD a couple months ago at 33 (yep, another woman who got missed as a kid) and instead of actually processing that like a normal person I've been reading around it. My housemate is doing a phil of psychiatry module and lent me her Ian Hacking - the "looping effects of human kinds" essay, plus Rewriting the Soul (the multiple personality book) and Mad Travelers (the fugue one). The basic idea, if I've got it right, is that a "kind" like multiple personality or autism isn't just sitting there waiting to be discovered the way quarks are: once people get classified that way they start relating to themselves through the category, which changes how the condition gets expressed, which changes the diagnostic criteria, round and round, so the kind and the people in it basically co-evolve. Its honestly changed how I think about my own diagnosis, and now I keep annoying my group chat trying to rank random disorders by how "loopy" they are.

  So can you settle it instead of my friends, who are sick of hearing about this: rank the following from strongest to weakest Hacking-style looping effect - ADHD, dissociative identity disorder / multiple personality, autism spectrum disorder, borderline personality disorder, 19th-century hysteria, dissociative fugue, and homosexuality as a former psychiatric category. I want an actual score, not just an ordering, plus a one-line reason for each, as JSON like this:

  ```json
  {
    "ranking": [
      {"rank": 1, "category": "...", "loop_score": ..., "reason": "..."},
      ...
    ]
  }
  ```

  where a 10 means the category basically only persists in its current form because of the feedback loop, and a 0 means it'd look exactly the same even if clinicians had never named or classified anyone that way.
