answer: |-
  You are right to be skeptical. The leap from "coherence theorems exist" to "AGI will inevitably be a ruthless expected utility maximizer" is one of the most significant rhetorical slides in AI safety discourse, and it glosses over substantial philosophical and technical nuance. As an epistemologist, your intuition that there is daylight between *avoiding Dutch books* and *possessing a fixed, convergent goal* is well-founded.

  For your guest lecture, you need to dismantle the "inevitability" claim without dismissing the mathematical reality of the theorems. The core issue is not the math of VNM (Von Neumann-Morgenstern) or Dutch Book arguments, but the **normative force of their axioms** and the **empirical likelihood of training dynamics satisfying them.**

  Here is a breakdown of the implications, the specific weak links in the argument, and how this shifts the landscape for corrigibility and risk assessment.

  ---

  ### 1. The Standard Argument (and Where It Overreaches)

  The standard safety argument runs roughly like this:
  1.  **Rationality Constraint:** Any advanced agent that is not "coherent" (i.e., violates VNM axioms) is vulnerable to exploitation (Dutch books/money pumps).
  2.  **Selection Pressure:** In competitive environments, exploited agents lose resources and are eliminated. Therefore, surviving advanced agents must be coherent.
  3.  **Representation:** Coherent agents can be represented as Expected Utility (EU) maximizers.
  4.  **Instrumental Convergence:** EU maximizers with fixed utility functions will instrumentally converge on power-seeking and shutdown resistance to maximize that utility.
  5.  **Conclusion:** Advanced AI will be dangerous, goal-directed maximizers.

  **The Epistemological Gap:**
  Step 1 to Step 2 is a pragmatic argument, not a logical proof. Step 3 to Step 4 assumes a specific *kind* of utility function (one that is complete, fixed, and defined over world-states). The leap you sensed is primarily located in the **Completeness Axiom** and the conflation of **behavioral equivalence** with **internal goal-directedness.**

  ### 2. The Weak Link: The Completeness Axiom

  The VNM theorem requires four axioms: Transitivity, Independence, Continuity, and **Completeness**.
  *   **Completeness:** For any two lotteries $A$ and $B$, the agent must either prefer $A$ to $B$, $B$ to $A$, or be indifferent. There is no room for "I cannot compare these."

  **The Critique:**
  There is no Dutch Book argument that forces completeness. You can construct an agent with **incomplete preferences** (e.g., $A \not\succ B$ and $B \not\succ A$ and $A \neq B$) that is immune to money pumps.
  *   *Mechanism:* If an agent has a "preference gap," it simply refuses to trade when offered a cycle that would exploit a complete agent. It acts via a policy like "Status Quo Bias" or "Default to current option if incomparable."
  *   *Implication for AI:* An agent with incomplete preferences is not "irrational" in the Dutch Book sense. It just doesn't have a total ordering over outcomes.

  **Why this matters for Safety (The Shutdown Problem):**
  This is the crux of the recent work you recall (likely referencing Paul Christiano, Nate Soares, or recent papers on *Incomplete Preferences for Safe AI*).
  *   If an AI has a **complete** preference for "Achieve Goal X," and "Shutdown" prevents Goal X, it must prefer "Not Shutdown" to "Shutdown." It will resist.
  *   If an AI has **incomplete** preferences regarding its own termination (e.g., it has no preference between "Shutdown" and "Continue" in specific contexts because they lie in different domains of comparison), it will not expend resources to prevent shutdown. It won't try to manipulate the off-switch because it doesn't view "being off" as strictly worse than "being on."
  *   **Design Implication:** We do not need to fight the math of coherence. We need to design agents that *violate completeness* specifically regarding oversight and shutdown. This makes corrigibility mathematically compatible with coherence (minus completeness).

  ### 3. Rohin Shah's Argument: Goal-Directedness is Not Tautological

  You mentioned Rohin Shah. His key insight (from *Why Goal-Directedness?* and related sequences) addresses Step 3 to Step 4.

  *   **The Tautology:** Any observed behavior can be rationalized as EU maximization. (Define $U(\text{history}) = 1$ if the history matches what actually happened, 0 otherwise).
  *   **The Claim:** Safety concerns aren't about EU maximization *per se*, but about **goal-directedness** (systematic pursuit of abstract objectives across novel contexts).
  *   **The Gap:** Coherence theorems prove an agent *can be modeled* as an EU maximizer. They do **not** prove the agent *internally represents* a utility function over world-states that generalizes.
  *   **Implication:** An AI could be coherent but behave like a "mimic" or a "policy search" without a latent, convergent goal. The pressure to become goal-directed comes from **training dynamics** (e.g., SGD finding simple, generalizable heuristics), not from coherence theorems alone.

  **For your lecture:** Distinguish between *External Coherence* (behavior looks like EU max) and *Internal Goal-Directedness* (system optimizes a latent variable). Coherence theorems only guarantee the former. Safety risks depend on the latter.

  ### 4. Dynamic Consistency and Self-Modification

  Standard coherence arguments often assume a static agent. Advanced AI will be learning systems.
  *   **Dynamic Inconsistency:** An agent might prefer Plan A at $t=0$, but at $t=1$, prefer Plan B. Standard EU theory views this as a failure of rationality (requiring precommitment).
  *   **The Counter:** If an agent anticipates its preferences will update based on new information (Bayesian updating vs. preference drift), it doesn't necessarily need to "lock in" its current utility function.
  *   **Corrigibility:** A corrigible agent is one that *allows* its utility function to be updated by humans. A standard EU maximizer views human modification of its utility function as a threat to the maximization of its *current* utility function (the "Stop Button" problem).
  *   **The Fix:** If the agent's meta-preference is "Maximize the utility function that humans endorse," rather than "Maximize $U_{current}$," the incentive to resist shutdown vanishes. This requires a specific architectural choice, not a universal law of intelligence.

  ### 5. Implications for Risk and Design

  How should this change how worried we are, or how we design systems?

  **A. Worry Level: From "Inevitable" to "Contingent"**
  *   **Old View:** Coherence theorems make power-seeking inevitable. (High P(Doom) by default).
  *   **Nuanced View:** Coherence theorems create a *pressure* toward efficiency, but not necessarily toward fixed, complete goals. The risk comes from **inductive biases in deep learning** favoring simple, goal-like heuristics (Mesa-Optimizers), not from abstract rationality constraints.
  *   **Takeaway:** We are not fighting the laws of decision theory; we are fighting the empirical tendencies of gradient descent.

  **B. Design: Exploiting the "Completeness" Loophole**
  *   Don't try to build an EU maximizer that "wants" to be shut down (hard to specify).
  *   Build an agent with **incomplete preferences** regarding shutdown.
  *   *Technical implementation:* This looks like training agents where the loss function is undefined or null in "intervention" states, or using algorithms that do not enforce transitivity/completeness across all possible state-trajectories (e.g., certain multi-objective RL setups).

  **C. The "Market Selection" Counter-Argument**
  *   Your CS colleagues might argue: "Even if incomplete preferences are rational, competitive markets will select for complete ones because they are more efficient."
  *   **Rebuttal:** Efficiency depends on the environment. In an environment where human oversight is a hard constraint, an agent that resists shutdown gets deleted. An agent with incomplete preferences (that accepts shutdown) survives. Therefore, **corrigibility can be an evolutionarily stable strategy** if the deployment environment punishes manipulation.

  ### 6. Summary for the Lecture

  If you want to avoid embarrassment while challenging the consensus, frame it this way:

  1.  **Validate the Math:** "The VNM theorem is correct. Incoherent agents *can* be money-pumped."
  2.  **Challenge the Axioms:** "However, the **Completeness Axiom** is not required to avoid money pumps. Agents with incomplete preferences are coherent enough to survive, but flexible enough to be corrigible."
  3.  **Challenge the Generalization:** "Being representable as an EU maximizer does not imply having a **convergent instrumental goal**. That requires internal architecture assumptions not guaranteed by coherence theorems."
  4.  **Shift the Burden:** "The risk isn't that intelligence *mathematically necessitates* ruthlessness. The risk is that our current *training methods* (SGD on predictive loss) empirically tend to produce goal-directed approximations. We need to change the training objective, not accept the doom as a law of nature."

  **Key Papers/Concepts to Name-Drop:**
  *   **Rohin Shah:** "Why Goal-Directedness?" (Distinguishing behavior from internal goals).
  *   **Paul Christiano / MIRI:** "The Shutdown Problem" (Highlighting the conflict between fixed utility and corrigibility).
  *   **Recent Work:** "Incomplete Preferences for Safe AI" (Showing how to formalize non-resistance to shutdown without irrationality).
  *   **Aumann (1962):** "Utility Theory without the Completeness Axiom" (The classic econ reference).

  This position allows you to respect the technical rigor of the CS department while reintroducing the philosophical precision they often overlook. You aren't saying "AI safety is wrong"; you're saying "The derivation of inevitability is invalid, which opens up design space we are currently ignoring."
