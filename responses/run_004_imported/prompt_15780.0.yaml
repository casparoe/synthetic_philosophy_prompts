      *   **Introduction:** Hook with the user's anecdote (the writing group joke). State the thesis: Rousseau's position is not merely hypocritical but represents a tragic tension between moral philosophy and artistic practice. The distinction rests on the *mode of engagement* (interiority vs. spectacle) and the *state of the audience* (preservation vs. triage).
      *   **The Case Against Theatre:** Detail the *Lettre à d'Alembert* arguments. Focus on "pity as expenditure" and the *Misanthrope* critique. Emphasize the *political* stakes for Geneva.
      *   **The Case for the Novel (The Defense):** Analyze the Preface to *Julie*. The "corrupt age" argument. The "innocent girl" warning. The idea of the book as a mirror.
