          *   *The Actor vs. The Writer:* Rousseau accuses actors of counterfeiting. Is the novelist not counterfeiting passions on the page?
      *   **The Verdict:** Is it coherent?
          *   *Argument for Coherence:* He distinguishes between *institutionalizing* vice (a theatre in Geneva) and *addressing* individuals in a fallen world. The novel is a private confession; the theatre is a public institution.
          *   *Argument for Incoherence:* The emotional mechanism is the same. If pity in theatre discharges moral duty, pity in *Julie* does too. The "corrupt age" excuse is a get-out-of-jail-free card that undermines the universal moral claim.
          *   *Synthesis:* It's not hypocrisy, but a tragic compromise. He sacrifices the ideal (no art) for the possible (art that seeks truth). But ultimately, the distinction collapses under the weight of the emotional effect.

