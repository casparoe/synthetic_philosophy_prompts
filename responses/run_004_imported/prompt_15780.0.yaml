      *   Strongest distinction? Yes (Public Institution vs. Private Communion / Preservation vs. Triage).
      *   Verdict? Yes (Coherent politically, incoherent psychologically).
      *   Text-based? Yes.

  *(Self-Correction Note)*: I need to make sure I don't just say "he's a hypocrite." That's too easy. The prompt asks to work out the *strongest principled distinction*. I need to steelman his defense before knocking it down. The distinction is between *founding* a society (Geneva) and *navigating* a fallen one (Europe). Theatre is foundational (shapes the polis); the novel is palliative (treats the individual).

