      *   *The Medium:* Reading is solitary, interior, slow. Theatre is collective, external, immediate.

  4.  **Develop the "Strongest Principled Distinction":**
      *   *Option A: Corruption Level.* Geneva (uncorrupted) vs. Europe (corrupted). Theatre introduces corruption to purity. Novels manage corruption in an already fallen world.
