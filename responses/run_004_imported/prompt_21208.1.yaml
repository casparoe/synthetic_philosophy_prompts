answer: |-
  **Setting:** *A dimly lit diner, 2:00 AM. Two empty coffee pots sit between **Olivia** (Ockhamist) and **Sam** (Supervaluationist). Napkins are covered in branching time diagrams.*

  **Olivia:** Look, I'm going to say it again. "There will be a sea battle tomorrow." Either that sentence corresponds to the way the world is going to be, or it doesn't. If the world is going to contain a battle, it's true. If not, it's false. To deny that is to deny reality.

  **Sam:** To deny that is to deny *indeterminism*. You're treating the future like a hidden present. You think the battle is already "there" in the timeline, we just haven't walked to it yet. But if the future is genuinely open, there *is* no single timeline. There's a branching structure. And in a branching structure, a statement about a specific branch can't be true simpliciter.

  **Olivia:** Why not? Because of your Thin Red Line objection? You keep saying positing a privileged actual future is "cheating." But isn't it more cheating to say that reality hasn't decided between battle and no-battle, yet logic demands we treat the disjunction "Battle or No-Battle" as true? I'm keeping Bivalence. You're keeping Excluded Middle but sacrificing Truth.

  **Sam:** I'm not sacrificing truth, I'm refining it. I'm offering *supertruth*. A proposition is supertrue if it's true on all histories passing through this moment. Now, "Battle or No-Battle" is supertrue. So logic is safe. But "There will be a battle" is not true on all histories. So it's not supertrue. It's indeterminate.

  **Olivia:** But that's not *truth*, Sam. That's validity. If I assert "There will be a battle," and you say, "That's not true, it's indeterminate," you're telling me I'm wrong to assert it. But intuitively, I'm not wrong! One of those futures is *going to happen*. My assertion is aiming at that one. Your supertruth aims at *every* possible future. That's why your view feels like a trick. You've defined truth in a way that makes it impossible for any contingent future claim to ever be true today.

  **Sam:** Because there *is* nothing to make it true today! That's the metaphysical bedrock. Truth supervenes on being. What exists right now that makes "Sea Battle" true? The present causes? They're insufficient. The laws of nature? They allow both outcomes. So where is the truth-maker? You Ockhamists just paste a label on one branch and call it "Actual." But if I'm standing at the node, looking at the branches, what physical property distinguishes the Thin Red Line from the others?

  **Olivia:** It's not a physical property. It's an indexical one. Think about "here." If I'm in Chicago and you're in St. Louis, is there a physical property of space that makes Chicago "here" and St. Louis "there"? No. "Here" is just where I am. The Thin Red Line is just the future of *this* moment. It's the branch we are *on*.

  **Sam:** That's the "Actualist" move. But it collapses under pressure. If the TRL is just indexical, then when I say "There will be a battle," I'm saying "On the actual history, there is a battle." Fine. But if the future is open, *which* history is actual is not settled. You're saying there is a fact of the matter about which branch is actual, even though nothing in the universe determines it. That's metaphysical surplus. It's a ghost line. Belnap and Green nailed this: if you can't detect it, even in principle, and it does no causal work, why posit it?

  **Olivia:** Because it explains assertion! When I bet you $100 on the battle, I'm not betting on "all histories." I'm betting on the one that happens. If tomorrow there is a battle, I win. If you come to me tomorrow and say, "Ha! But yesterday it wasn't *supertrue* that you'd win," I'll laugh. I'll say, "It was *true*. You just didn't know it." Your view makes truth epistemic. You're confusing "We can't know which branch is real" with "No branch is real."

  **Sam:** I'm not making it epistemic. I'm making it semantic. The problem is your notion of "winning." On my view, if the battle happens, your assertion *becomes* true. It wasn't true yesterday. It wasn't false yesterday. It was undefined. You're insisting it had a truth value yesterday. Why? Because you're terrified of the Law of Excluded Middle failing? I saved Excluded Middle! $p \lor \neg p$ is supertrue.

  **Olivia:** You saved the formula, not the intuition. Excluded Middle is only useful if it tracks reality. If $p$ is indeterminate and $\neg p$ is indeterminate, but $p \lor \neg p$ is "supertrue," you've turned logic into a game of symbols. The intuition behind Bivalence is that the world is a certain way. Even if it's random, even if it's uncaused, *something* will happen. If something will happen, then the proposition describing it is either correct or incorrect. To deny that is to say the future is less real than the present.

  **Sam:** The future *is* less real than the present! That's the point of branching time. The present is the trunk; the future is the foliage. You're trying to flatten the tree into a single wire. And don't give me the "indexical" defense again. If the TRL is indexical, it shifts. As time moves, the TRL shifts. But if the TRL shifts, then yesterday's TRL might not match today's. If I said yesterday "There will be a battle," and the TRL shifts to a no-battle history tonight, was I lying yesterday?

  **Olivia:** No, because the TRL doesn't shift. The TRL is the history that *is* actual. If the future is open, the TRL is the history that *will be* actual. Wait, that sounds circular. Let me put it this way: The TRL is the unique history that shares the present moment and extends into the future. There is only one way the world *will* be. You're obsessed with the *possibilities* of how it could be. I'm talking about how it *shall* be.

  **Sam:** "Shall" is doing too much work. You're smuggling in determinism. If you say there is a unique history that *will* be, you're saying the branching is illusory. You're saying the other branches are fake possibilities. But if they are fake, why can't we navigate them? Why does deliberation feel like choosing between real options?

  **Olivia:** Because deliberation is about causation, not truth! I can deliberate between options because my choice determines which branch becomes the TRL. But before I choose, God—or the universe—doesn't need to wait to see which one I pick to know that one of them *is* the pick. Look, let's hit my main worry again. Your supertruth. If I say "It is true that $p$," on your view, I am saying "$p$ is true on all branches." But I never mean that. I never mean "It is inevitable." I mean "It is the case." By redefining truth as supertruth, you've changed the subject. You're not solving the Sea Battle; you're dissolving it by changing the definition of "true."

  **Sam:** I'm not changing the definition. I'm contextualizing it. In a branching world, the classical definition of truth (correspondence to *the* world) breaks because there isn't *one* world yet. There's a manifold. Supertruth is the only robust notion of truth that survives the branching. Your "Ockhamist truth" is fragile. It relies on a metaphysical miracle—that one branch is glowing red while the others are grey, even though they are qualitatively identical.

  **Olivia:** They aren't qualitatively identical! One of them contains my future actions. The others contain... what? Ghosts? Counterfactuals? The TRL isn't a label we paste on; it's the path of causal continuity. The branch where I drink this coffee is actual. The branch where I don't is not. Why? Because I'm drinking it! The actuality is grounded in the present experience of unfolding.

  **Sam:** But that's presentism. You're grounding the future's truth in the present's unfolding. But the proposition is about *tomorrow*. What about tomorrow grounds it? Nothing! That's my point. If the battle hasn't happened, and nothing necessitates it, there is no fact of the matter. You're saying there *is* a fact of the matter, it's just inaccessible. That's a mystery. I'm offering a model where there is no mystery, just structure.

  **Olivia:** Your model has a mystery too. It's why we assert things. If I say "It will rain," and you say "That's neither true nor false," but then it rains, you have to say "Oh, it *became* true." But truth isn't a property that things acquire like a tan. If it's true today, it's true because of how the world is. If the world is indeterminate, then the proposition lacks a truth value. Fine. But then logic breaks. If $p$ is neither true nor false, then $\neg p$ is neither true nor false. So $p \lor \neg p$ should be neither true nor false. But you say it's supertrue. That's the trick. You're evaluating the disjunction globally (across all branches) but the disjuncts locally (on specific branches). It's a bait and switch.

  **Sam:** It's not a switch, it's supervaluation. It's the standard way to handle vagueness or indeterminacy. You preserve the tautologies without committing to the specifics. It's the most honest way to handle an open future. You want to have your cake (open future) and eat it too (bivalence). I'm telling you: pick one. Open future means no bivalence for contingents. Bivalence means no open future.

  **Olivia:** I pick open future *and* bivalence. Because "open" means undetermined by the *past*, not undetermined by *reality*. The truth of the future isn't fixed by the past; it's fixed by the future. And the future *will* be a certain way. So the statement about it is *now* true or false, because truth is timeless. You're conflating "settledness" with "truth."

  **Sam:** And you're conflating "truth" with "settledness." If it's not settled, it's not true. That's the Aristotelian insight you're ignoring. Aristotle rejected bivalence for future contingents precisely to save freedom and openness. You're saving logic at the cost of metaphysics. I'm saving metaphysics at the cost of classical logic.

  **Olivia:** I'm not saving logic at the cost of metaphysics. I'm saying your metaphysics is incomplete. You have the branching structure, but you forgot the traveler. The traveler is on one path. For the traveler, that path is the Thin Red Line. Not because it's metaphysically distinct from the outside, but because it's the only one they can walk.

  **Sam:** But the traveler doesn't know which path they're on until they walk it. So asserting they are on it *now* is empty.

  **Olivia:** It's not empty. It's the condition of agency. If I don't assume one future is mine to make, I can't act. Your supertruth gives me a logic of possibilities. My TRL gives me a world to live in.

  **Sam:** And my world is honest about its openness. Yours is honest about its logic, but haunted by a line it can't see.

  **Olivia:** *[Sips cold coffee]* Maybe. But I'd rather be haunted by a line than live in a gap.

  **Sam:** *[Smiles]* Then we're back where we started. Two hours later, and neither of us has budged an inch.

  **Olivia:** That's because the sea battle hasn't happened yet. Check me tomorrow.

  **Sam:** I will. But don't ask me if you were right until the smoke clears. Until then, it's just supertrue that one of us is.
