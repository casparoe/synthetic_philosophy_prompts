prompt: |-
  ok so I had this whole argument with my friend last night about David Lewis's Principal Principle (the rule that you should set your credence equal to the objective chance whenever you know it) and we got stuck on the "undermining" worry that Lewis himself raised about his own view later on. His account of chance is Humean, so chances are grounded in the whole history of the world, past AND future, which means a chancy process could in principle produce a future that undermines the very chance distribution that was supposed to generate it in the first place - and that seems to mess with what evidence even counts as "admissible" for the principle to work at all. i kinda get the idea in the abstract but couldn't come up with an actual example on the spot, and my friend wasn't convinced its a real problem rather than some technicality someone dreamed up. can you give me a concrete example - an actual chance setup plus a specific bit of future evidence - where trying to apply the principal principle runs into this undermining issue, and explain why it actually breaks something rather than just being a nitpick?
