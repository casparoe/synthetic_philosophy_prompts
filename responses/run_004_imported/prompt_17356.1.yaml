answer: |-
  This is one of the deepest rabbit holes in modern metaphysics, and your friend is right that it *sounds* like a technicality, but you are right that it strikes at the heart of what "chance" means. Lewis himself called it "the bug" in his system and admitted it was a serious problem.

  The issue is that the Principal Principle (PP) assumes that **current chances** and **future outcomes** are logically compatible. But if chances are Humean (based on the Best System of the *entire* history), they aren't.

  Here is a concrete example you can use to show your friend exactly where the logic snaps.

  ### The Setup: A Finite Humean World

  Imagine a tiny, finite universe to make the math easy.
  1.  **The Mosaic:** The universe consists of exactly **1,000 coin tosses**. That's it. No other events.
  2.  **Humean Chance:** According to Lewis's "Best System Analysis," the objective chance of Heads is whatever probability assignment appears in the system that best balances **simplicity** and **strength** (fit) to the *total* pattern of the 1,000 tosses.
  3.  **Current State:** We are at toss #1. We have looked at the patterns of similar worlds or the physical setup, and the Best System currently says this is a **fair coin**.
      *   So, the objective chance of Heads ($Ch$) = **0.5**.

  ### The Undermining Future

  Now, consider a specific possible future history, let's call it **$F_{weird}$**.
  *   **$F_{weird}$:** The coin lands Heads on *every single one* of the 1,000 tosses.

  **Here is the Humean Catch:**
  If $F_{weird}$ actually happens, look at the *total* history of the world (all 1,000 tosses). It is 1,000 Heads.
  Does the "Best System" for a world of 1,000 Heads say "Chance of Heads = 0.5"? **No.**
  A system that says "Chance of Heads = 1.0" is simpler and fits the data perfectly. A system saying "0.5" fits the data terribly.
  Therefore, in the world where $F_{weird}$ happens, the objective chance of Heads was **never 0.5**. It was 1.0.

  ### Where the Principal Principle Breaks

  The Principal Principle says:
  $$C(F_{weird} \mid Ch = 0.5) = 0.5^{1000}$$
  *(Translation: Given that the current chance is 0.5, your rational credence in getting 1,000 Heads should be the chance of that happening, which is tiny but **non-zero**.)*

  **However**, given Humean Supervenience:
  The proposition "The Chance is 0.5" and the proposition "The Future is $F_{weird}$" are **logically incompatible**.
  *   If $Ch = 0.5$ is true, then the Best System is the Fair Coin system.
  *   If $F_{weird}$ is true, then the Best System is the Biased Coin system ($Ch = 1.0$).
  *   They cannot both be true.

  So, logically:
  $$C(F_{weird} \mid Ch = 0.5) = 0$$
  *(Translation: Given that the Chance is 0.5, the probability of a future that makes the Chance 1.0 is **zero**, because that future would make your starting assumption false.)*

  **The Contradiction:**
  *   **Principal Principle says:** Your credence should be $0.5^{1000}$ (a small positive number).
  *   **Logic + Humeanism says:** Your credence should be $0$.
  *   **Result:** You cannot follow the Principal Principle. It gives contradictory instructions.

  ### Why This Isn't Just a Nitpick

  Your friend might say, "Okay, but $0.5^{1000}$ is so small, who cares?" Here is why it matters philosophically:

  **1. It makes "Chance" Incoherent**
  The whole point of the Principal Principle is to define what we *mean* by objective chance. Chance is supposed to be the thing that guides rational belief. If a theory of chance (Humeanism) makes it impossible to follow the rule that defines chance, then Humeanism has failed to capture what chance *is*. It's not a calculation error; it's a category error.

  **2. It Breaks "Admissibility"**
  Lewis tried to fix PP by saying it only applies when you have "admissible" evidence (usually past/present info). He assumed information about the *future* is inadmissible.
  But in this example, you don't *have* information about the future. You are just assigning a probability to a possible future. The PP is supposed to tell you how to weigh possibilities. The undermining problem shows that under Humeanism, **some possible futures are logically ruled out by the current chance assignment itself.** This means the "space of possibilities" changes depending on which chance hypothesis you pick, which destroys the standard probability calculus PP relies on.

  **3. Lewis Conceded**
  This is your trump card. Lewis didn't dismiss this. In his paper *"A Subjectivist's Guide to Objective Chance"* (1980), he raised it, but in *"New Work for a Theory of Universals"* (1994) and later correspondence, he admitted:
  > "I am unable to make the Principal Principle consistent with Humean Supervenience... I have to say that the Principal Principle, as I stated it, is false."

  He had to propose a **"New Principal Principle"** that conditioned on the chance *and* the claim that the chance wasn't undermined. But many philosophers argue this patched version is ad hoc and loses the elegant connection between belief and reality that the original PP had.

  ### Summary for your Friend
  Tell them: "If chances are just summaries of the whole history (past and future), then the current chance depends on the future. But the Principal Principle says we use current chances to predict the future. If the future you predict would change the current chance you started with, the math creates a contradiction. It's not a calculation error; it means Humean chances can't do the job Lewis wanted them to do."
