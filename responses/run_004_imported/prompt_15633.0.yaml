answer: |-
  This is a fantastic pedagogical hurdle to encounter. You are right to sense that if "standing" is just a slogan, the whole distinction collapses into a *tu quoque* fallacy. The student's pushback is the exact right instinct: if the proposition "You did wrong" is true, why does the speaker's biography matter?

  To rescue the seminar, you need to shift the students' focus from the **epistemic status of the blame** (is the content true?) to the **normative status of the act** (is the performance authorized?).

  Here is a granular breakdown of the mechanism, the distinction between Wallace and Fritz & Miller, and the asymmetry with praise, structured for your prep.

  ### 1. Escaping *Tu Quoque*: Truth vs. Felicity
  The student's worry relies on a category error. They are treating blame as a **constative speech act** (a statement of fact) rather than an **illocutionary speech act** (a performance of authority).

  *   **The *Tu Quoque* Fallacy:** "You say smoking is bad, but you smoke. Therefore, smoking is *not bad*." This attacks the truth of the proposition based on the speaker. This is invalid.
  *   **The Standing Objection:** "You say smoking is bad, but you smoke. Therefore, you lack the *authority to sanction me* for smoking." This attacks the **felicity conditions** of the speech act.

  **The Mechanism:** Think of a referee in a soccer match. If a referee calls a foul, the proposition "That was a foul" can be objectively true. However, if that referee is secretly betting on the other team, or if they are not certified by the league, they lack the *standing* to make the call count. The foul remains a foul, but the *whistle* is illegitimate.

  In moral blame, the "whistle" is the demand for accountability. The standing objection says the hypocrite blows the whistle without a badge. The student's job is to understand why the badge is missing.

  ### 2. Wallace: The Implicit Exemption Claim
  R. Jay Wallace's account ("Hypocrisy, Moral Address, and the Equality of Persons") is the dominant framework here. His mechanism is rooted in **moral equality** and **authority**.

  *   **The Act of Blame:** For Wallace, blame is not just assessing someone negatively; it is a form of **moral address**. It is an implicit demand that the target acknowledge a shared moral norm. When I blame you, I am saying, "We are both subject to this norm, and you have violated our shared agreement."
  *   **The Hypocrite's Move:** When a hypocrite blames, they perform a contradiction in their **will**.
      1.  By blaming you, they implicitly affirm: "This norm binds us both equally."
      2.  By violating the norm themselves (without excuse), they implicitly claim: "This norm does not bind me (or binds me less)."
  *   **The Mechanism of Disqualification:** The hypocrite is making an **implicit claim of exemption**. They are asserting authority over you (holding you to the standard) while denying that same authority to you over them (by not holding themselves to it).
  *   **Why it's not *Tu Quoque*:** It's not that their claim about *your* action is false. It's that their claim about *the relationship between you* is false. They claim a relationship of moral equality while acting out a relationship of moral hierarchy.
  *   **Teaching Analogy:** The "Special Plea." Imagine a citizen demanding you pay taxes to fund a road, while they secretly drive on it for free using a loophole they created. The road still needs funding (the content is true), but they lack the standing to demand *your* payment because they have exempted themselves from the shared burden.

  ### 3. Fritz & Miller: The Fairness/Commitment Account
  Brandt Fritz and Daniel Miller ("Hypocrisy and the Proportionality of Blame," etc.) offer a slightly different mechanism, focusing more on **fairness** and **commitment** than strict equality of status.

  *   **The Move:** They argue that blame imposes a **burden**. It creates guilt, social friction, and demands justification.
  *   **The Mechanism:** It is unfair to impose a burden on someone for violating a norm that you are unwilling to bear yourself. Blame manifests a commitment to the norm. If I blame you for lying, I manifest a commitment to truth-telling. If I lie, I manifest a lack of commitment.
  *   **The Disqualification:** To blame hypocritically is to engage in a **unilateral imposition of burden**. It treats the blamee as a subject of the norm while treating oneself as an exception. This violates a principle of reciprocity.
  *   **Difference from Wallace:** Wallace is about the *status* of the persons (equality). Fritz & Miller are about the *distribution of burdens* (fairness). Wallace says the hypocrite insults your equality; F&M say the hypocrite treats you unfairly.
  *   **Does it escape *Tu Quoque*?** Yes, because fairness is a condition of permissible interaction. I can tell the truth about you, but I cannot *punish* you unfairly. Hypocritical blame is a kind of moral punishment; if it's unfair, it's impermissible, even if accurate.

  ### 4. Summary for the Board: What is the Hypocrite *Doing*?
  If you need to write this on the board to clarify the mechanism:

  1.  **Proposition:** "You violated Norm N." (True/False independent of speaker).
  2.  **Performance:** "I hold you accountable for violating Norm N." (Dependent on speaker's standing).
  3.  **The Hypocrite's Contradiction:**
      *   In the **Performance**, they assert: "Norm N is binding on us."
      *   In their **Conduct**, they assert: "Norm N is not binding on me."
      *   **Result:** The Performance is infelicitous because it contradicts the Conduct. The authority claimed in the Performance is undermined by the Conduct.

  ### 5. The Side Question: The Blame/Praise Asymmetry
  This is a sharp observation. The literature is indeed skewed toward blame. There are principled reasons for this, revolving around **Demands vs. Ideals** and **Burdens vs. Benefits**.

  **A. The Burden Argument (Fritz & Miller style)**
  *   **Blame** imposes a cost (guilt, sanction, relationship strain). Normative theories generally agree that imposing costs requires stricter justification (standing/authority) than conferring benefits.
  *   **Praise** confers a benefit. If I praise you for donating to charity while I don't donate, I am giving you a gift. It might be insincere, but it doesn't *harm* you or impose a burden. Therefore, "standing" is less critical.

  **B. The Equality/Demand Argument (Wallace style)**
  *   **Blame** presupposes a **mandatory norm**. "You *must* not steal." We are all equally subject to moral obligations. If I demand you meet an obligation I ignore, I violate equality.
  *   **Praise** often targets **supererogatory acts** (going above and beyond). "You *ought* to be kind, but you *did* something saintly."
  *   **The Asymmetry:** I can acknowledge you are a saint even if I am a sinner, because I am not claiming you *failed* a duty that I am exempt from. I am simply acknowledging you exceeded a duty that binds us both.
      *   *Exception:* If I praise you for doing the *bare minimum* that I refuse to do ("Great job not stealing today!"), that *does* feel hypocritical. This supports the theory: standing issues arise in praise only when the praise implies a mandatory norm that the praiser is violating.

  **C. The "Jurisdiction" Point**
  *   Blame functions like a verdict. It claims jurisdiction over the other.
  *   Praise functions like a testimonial. It offers appreciation.
  *   We need a license to judge (blame); we do not need a license to appreciate (praise).

  ### 6. Suggested Classroom Move
  To stop the "re-describing the phenomenon" problem, try this thought experiment with the students:

  **The "Clean Hands" Policy:**
  Ask the students: *Imagine a government passes a law against littering. The government officials litter constantly. They fine a citizen for littering.*
  1.  **Is the citizen guilty?** Yes. (The content is true).
  2.  **Is the fine valid?** Legally, maybe. Morally? No.
  3.  **Why?** Because the officials have signaled that the law is merely a tool for controlling *others*, not a shared standard of conduct.
  4.  **Connect to Wallace:** When the official issues the fine, they say "We are all subject to the law." Their littering says "We are not." The fine is an act of power, not an act of justice.

  **The "Tu Quoque" Trap:**
  Ask the student: *If I say "You shouldn't hit people," and I hit people, am I saying hitting is okay?*
  *   If they say "Yes," they misunderstand hypocrisy (the hypocrite usually thinks hitting is wrong).
  *   If they say "No," then ask: *So why can't I blame you?*
  *   Guide them to: *Because my blaming you implies I respect the rule enough to enforce it, but my hitting shows I don't. I am using the rule as a weapon against you, not a shield for us.*

  This shifts the focus from the *truth of the rule* to the *integrity of the enforcer*, which is exactly where "standing" lives.
