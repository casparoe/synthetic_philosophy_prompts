      *   **Context:** Grad seminar on blame and hypocrisy.
      *   **Problem:** The instructor struggles to explain *why* hypocritical blame lacks "standing" without just restating the phenomenon or falling into *tu quoque*. Students are pushing back on the "standing" concept.
      *   **Key Question:** What is the *mechanism*? What is the hypocrite *doing* in the act of blaming that disqualifies them, specifically in Wallace's view vs. Fritz & Miller's view? Does this escape the *tu quoque* charge?
      *   **Side Question:** Why is standing an issue for blame but not praise? Is there a principled asymmetry?
      *   **Tone:** Academic, precise, granular, helpful for a seminar leader (needs to be teachable).

  2.  **Deconstruct the "Standing" Problem:**
      *   *The Student's Objection:* "You did it too" sounds like *ad hominem*. The truth of the blame (X did wrong) remains true regardless of who says it. So why can't the hypocrite blame?
      *   *The Core Distinction:* Truth of the proposition vs. Authority/Permission to assert it. (Analogy: A judge who breaks the law can still sentence you, but maybe not if they broke the *same* law in a way that undermines the court's integrity? Or better: A parent disciplining a child for smoking while smoking themselves.)
      *   *The Mechanism:* It's not about the *content* of the blame, it's about the *normative relationship* between blamer and blamee.

  3.  **Analyze Wallace's Account (Equal Standing):**
      *   *Key Text:* "Hypocrisy, Moral Address, and the Equality of Persons."
      *   *The Move:* Blame is a moral address that presupposes equality.
      *   *The Mechanism:* When I blame you, I implicitly claim authority. If I violate the same norm, I implicitly claim an *exemption* for myself. This exemption claim denies our moral equality.
      *   *Why it's not Tu Quoque:* It's not "You did it too, so your claim is false." It's "You claim authority over me while denying I have the same authority over you (by exempting yourself)." It attacks the *relationship*, not the *fact*.
      *   *Teaching Analogy:* The "Special Plea."

  4.  **Analyze Fritz & Miller's Account (Fairness/Commitment):**
      *   *Key Text:* "Hypocrisy and the Proportionality of Blame" (and related work on fairness).
      *   *The Move:* Focus on the unfairness of the burden.
      *   *The Mechanism:* Blame imposes a burden (guilt, sanction). It is unfair to impose a burden on someone for violating a norm you are unwilling to bear yourself. It's a violation of reciprocity.
      *   *Difference from Wallace:* Wallace is about *status/authority* (equality). F&M are about *burdens/fairness* (reciprocity).
      *   *Tu Quoque Escape:* It's not irrelevant because the *act of blaming* itself becomes a moral violation (unfairness) if done hypocritically.

  5.  **Address the "Tu Quoque" Worry Directly:**
      *   Standard *tu quoque*: "You smoke, so your claim that smoking is bad is false." (Fallacious).
      *   Standing objection: "You smoke, so you lack the *authority* to demand I stop." (Not fallacious, because authority is conditional).
      *   *Crucial distinction:* Truth conditions vs. Felicity conditions (Austin). Blame is a speech act. It needs felicity conditions to be appropriate, even if true.

  6.  **Address the Side Question (Blame vs. Praise Asymmetry):**
      *   *Why no standing for praise?*
      *   *Reason 1: Burdens.* Blame imposes costs (guilt, sanction, relationship strain). Praise confers benefits. Fairness/Authority matters more when imposing costs.
      *   *Reason 2: Authority claims.* Blame claims a kind of jurisdiction. Praise is often just appreciation.
      *   *Reason 3: The "Moral Law" aspect.* We are all equally subject to moral demands (Wallace). We are not all equally capable of moral excellence (Supererogation). I can praise you for being a saint even if I'm a sinner, because I'm not claiming exemption from the demand to be good, I'm just admitting I failed to meet it. But if I blame you for sinning while I sin, I'm claiming the rule doesn't bind me.
      *   *Counter-examples?* "Fake praise" (flattery). But that's usually about insincerity, not hypocrisy of action.

  7.  **Drafting the Response:**
      *   *Introduction:* Validate the instructor's struggle. It's a common pedagogical hurdle.
      *   *Section 1: The Tu Quoque Distinction.* Clear up the logical category error first (Truth vs. Standing/Felicity). Use the Speech Act analogy.
      *   *Section 2: Wallace's Mechanism.* Focus on "Implicit Exemption" and "Moral Equality." Use the "Address" model.
      *   *Section 3: Fritz & Miller's Mechanism.* Focus on "Unfair Burden" and "Commitment." Contrast with Wallace.
      *   *Section 4: Does it escape Tu Quoque?* Yes, by shifting from epistemic truth to normative authority.
      *   *Section 5: The Blame/Praise Asymmetry.* Burdens vs. Benefits, Demands vs. Ideals.
      *   *Conclusion/Teaching Tip:* Suggest a specific classroom analogy (The Referee or The Parent).

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I explain *what the hypocrite is doing*? Yes, making an implicit exemption claim (Wallace) or imposing an unfair burden (F&M).
      *   *Check:* Is the distinction between Wallace and F&M clear? Wallace = Status/Authority. F&M = Fairness/Reciprocity.
      *   *Check:* Is the praise asymmetry handled carefully? Avoid saying it *never* happens, but explain why it's not the *standard* problem. (Actually, there *is* literature on hypocritical praise, but it's rarer. Stick to the principled reasons why it's less intuitive).
      *   *Tone Check:* Keep it collegial but rigorous. Avoid overly dense jargon where possible, but don't dumb it down (it's for a grad seminar).

  9.  **Final Polish:** Ensure the distinction between the *proposition* (You did wrong) and the *performance* (I blame you) is front and center. That's the key to unlocking the student's confusion. (Add a note on Austin/Illocutionary force).

  10. **Final Review against constraints:** Granular explanation? Yes. Wallace vs. F&M? Yes. Tu Quoque escape? Yes. Praise asymmetry? Yes.

  *(Self-Correction on Praise)*: Wait, is there hypocritical praise? "Great job quitting smoking!" (said by a smoker). It sounds odd, but usually, we call that "insincerity" or "patronizing," not lack of standing. The key is that praise doesn't demand compliance. I need to emphasize the *demand* aspect of blame.

  *(Refining Wallace)*: Make sure to mention the "moral community" aspect. Blame is an invitation to acknowledge a shared norm. Hypocrisy rejects the shared nature of the norm.

  *(Refining F&M)*: They focus on the *commitment* to the norm. If you aren't committed, you can't hold others to it.

