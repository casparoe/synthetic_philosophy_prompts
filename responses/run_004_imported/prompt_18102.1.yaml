answer: |-
  **Discord Voice Channel: `#quantum-foundations`**
  **Participants:** B (Bohmian), E (Everettian)
  **Time:** 02:14 AM

  **B:** Look, I'm just saying, Maudlin isn't wrong because he's bad at math. He's wrong because he's assuming there's only one outcome. But if you look at the structure of Bell's proof, the inequality follows from Local Causality. $P(A, B | a, b, \lambda) = P(A | a, \lambda) P(B | b, \lambda)$. If you violate that, you're nonlocal. Period.

  **E:** But that factorizability condition assumes a single joint probability distribution for definite outcomes $A$ and $B$. MWI says there is no single $A$. There's a superposition of $A$'s. So the derivation doesn't even get off the ground. You're trying to apply a theorem about functions mapping to scalars onto a theory where the map goes to vectors in a Hilbert space.

  **B:** That feels like wordplay. "Oh, there's no single outcome, so Bell doesn't apply." But you still have to recover the Born rule. You still have to explain why, when I look at my branch, my result is correlated with yours in a way that violates CHSH. If Alice is on a branch where she saw Spin-Up, she *must* find Bob on a branch where he saw Spin-Down (for a singlet). What enforces that matching? If the branching happens locally at Alice's detector, and locally at Bob's, what guarantees the global consistency?

  **E:** The consistency is in the initial state. The entanglement isn't created at measurement; it's created at the source. The wavefunction evolves locally via the Schrödinger equation. When Alice measures, her state becomes entangled with the particle. That's a local interaction. When Bob measures, his state becomes entangled with his particle. Also local. The correlation isn't "sent" between them. It's revealed. The "matching" you're worried about is just the structure of the decohered components of the universal wavefunction.

  **B:** But that structure is global. You're saying the wavefunction is the ontology. Fine. But the wavefunction lives on configuration space, not 3-space. If the ontology is a field on a $3N$-dimensional space, then by definition, a change in one part of configuration space is a change in the whole field. That's nonlocality by another name. You've just moved the nonlocality from "particles influencing each other" to "the wavefunction being a non-separable object."

  **E:** I'd say it's *non-separable*, sure. But is it *non-local* in the sense of signaling? No. And this is where Jarrett helps. Remember, he split Bell's "Local Causality" into Parameter Independence (PI) and Outcome Independence (OI).
  PI says: The probability of my outcome doesn't depend on your *setting*.
  OI says: The probability of my outcome doesn't depend on your *outcome*.
  Standard QM—and MWI—violates OI but respects PI. Bohm violates PI.

  **B:** I'll grant you that. In Bohm, the velocity of particle 1 explicitly depends on the magnetic field setting at particle 2. That is a nonlocal dependency. I own that. But here's my steelman: That dependency is screened off by the Quantum Equilibrium Hypothesis. We can't *know* the initial positions precisely enough to exploit it. So empirically, PI holds. Ontologically, it doesn't.
  Your move is the reverse. You say PI holds ontologically because there's no single outcome to influence. But you still have to explain the OI violation. If my outcome doesn't depend on your setting, why does it depend on your outcome? In MWI, "my outcome" is just which branch I'm on. What determines which branch I'm on relative to you?

  **E:** Because the branches *are* the correlation. Think about the Deutsch-Hayden formulation. In the Heisenberg picture, the information about the measurement is contained in local descriptors. The information doesn't flow superluminally. The correlation is established when the systems interacted in the past. When we compare notes later, we bring our local records together. The "spooky" part is just that the records were correlated at the source.

  **B:** But in a Bell test, the settings are chosen at space-like separation. The source doesn't know what settings we're going to pick. If the source encoded the correlation for *all possible settings*, that's superdeterminism, and I know you hate that as much as I do. So the wavefunction has to accommodate the specific settings we choose. In Bohm, the pilot wave updates instantly to reflect the new boundary conditions of the magnets. In MWI... what updates?

  **E:** Nothing updates nonlocally. The wavefunction already contains the amplitude for every possible setting combination. When you choose setting $a$, you aren't changing the wavefunction; you're selecting a basis in which the local interaction happens. The unitary evolution handles the rest. There's no collapse, so there's no need for a signal to tell Bob's particle to "snap" into a state. Bob's particle is already in a superposition relative to Alice.

  **B:** Okay, let's press on the "realness" of the nonlocality. You look down on Bohm because the nonlocal influence is unsignaling. You call it "hidden." But in MWI, the "branching" is also unsignaling. I can't signal to my other branches. So why is my unsignaling influence "ontologically nonlocal" but your unsignaling branching "ontologically local"?
  It feels like you're defining "local" as "no signaling + unitary evolution" and I'm defining "local" as "no dependencies in the equations of motion for beables."
  My beables (particles) have nonlocal equations. Your beables (wavefunction) have local equations, but the beable itself is a global object. Who's actually paying the metaphysical price?

  **E:** That's... actually a fair point. The price has to be paid somewhere. If I say the wavefunction is real, I accept a high-dimensional ontology. If you say particles are real, you accept nonlocal dynamics.
  But here's where I dig in: In Bohm, the nonlocality is *causal*. The setting at B *causes* the trajectory at A to change. Even if I can't use it to send a message, the causal arrow is there. In MWI, there is no causal arrow between the wings. There is only a common cause in the past.
  If I can't send a message, and there's no causal influence, calling it "nonlocal" seems to stretch the word until it breaks. It becomes a synonym for "correlated."

  **B:** But correlations at space-like separation *are* the definition of the problem Bell identified! If the correlation isn't explained by a common cause (which Bell ruled out for local hidden variables) and it isn't explained by signaling, then either you accept nonlocal causation (Bohm) or you deny there's a fact of the matter about the correlation until the light cones meet (MWI).
  Wait. Do you deny there's a fact of the matter?

  **E:** I deny there's a *single* fact. There's a fact for the branch.

  **B:** But the branch structure itself has to be consistent. If Alice-Up meets Bob-Up in one branch, that branch has zero amplitude for a singlet state. It doesn't exist. So the "structure of the wavefunction" forbids it. What enforces that forbiddance across space-like separation?
  I'm starting to think we're fighting over the definition of "influence." In Bohm, the influence is in the guidance equation. In MWI, the "influence" is in the decoherence basis selection.
  If I can't measure the influence in your theory, and I can't measure it in mine... are we arguing about physics? Or are we arguing about which story makes us feel less uncomfortable with the word "nonlocal"?

  **E:** *Pause.* I mean... Eliezer would say we're arguing about the map. The territory is the Hilbert space dynamics. We both agree on the dynamics. We both agree on the Born rule statistics (eventually).
  You posit particles + wave. I posit just wave.
  You say the wave guides particles nonlocally. I say the wave evolves locally but is high-dimensional.
  When you say "Nature is nonlocal," you mean "The guidance equation couples distant coordinates."
  When I say "Nature is local," I mean "The Hamiltonian is a sum of local terms."
  We're both looking at the same equation, $i\hbar \partial_t \Psi = \hat{H} \Psi$, and pointing at different parts of it.

  **B:** Exactly. And Bell's theorem? It rules out Local Hidden Variables.
  I have Hidden Variables (particles), so I must be Nonlocal.
  You have Locality (Hamiltonian), so you must be... No Hidden Variables? No, you have the wavefunction as the variable. So you're Non-Real in the single-outcome sense.
  So Bell's theorem is basically a triangle: Locality, Realism (single outcome), and Quantum Predictions. You can only pick two.
  I pick Realism + Predictions. I drop Locality.
  You pick Locality + Predictions. You drop Realism (single outcome).

  **E:** That's the cleanest I've heard it put. We're just optimizing for different virtues. You want definite outcomes more than you want locality. I want local dynamics more than I want definite outcomes.
  But does that mean your "nonlocality" is... real? If the Quantum Equilibrium holds forever, that nonlocality is empirically ghostly. It does no work. It's like an invisible dragon that doesn't breathe heat.

  **B:** And your "branches" are empirically ghostly. I can't talk to them. They don't interact. They're causally closed off. You're positing an infinity of invisible universes to save locality. I'm positing one invisible nonlocal connection to save definite outcomes.
  We're both positing invisible machinery.
  So when Maudlin says "Bell proves Nonlocality," he's implicitly assuming "Realism = Single Outcome." If he assumed "Realism = Wavefunction," he'd conclude Locality.

  **E:** So the argument isn't about the physics. It's about bookkeeping. It's about what we allow ourselves to call "a thing."
  If "a thing" must be a localized chunk of stuff in 3D space, you win, and nature is nonlocal.
  If "a thing" can be a field in configuration space evolving via local differential operators, I win, and nature is local.

  **B:** *Sighs.* I hate that. I want the world to be made of stuff I can point to. Particles. Not... amplitude distributions. But I guess I can't fault you for consistency. If you take the wavefunction seriously as the ontology, you don't need collapse, and you don't need action-at-a-distance in the dynamics.
  But I still think "non-separable" is just "nonlocal" with a thesaurus.

  **E:** And I still think "guidance equation" is just "magic" with a math degree.
  But... okay. We agree on the CHSH value. We agree on the Tsirelson bound. We agree on the Schrödinger equation.
  We're just fighting over whether the universe is a single story with plot holes (nonlocality) or a library of every possible story (branching).

  **B:** Basically. So, are we done? Did we solve Bell's theorem?

  **E:** No. We just solved why we're angry at each other. Bell's theorem doesn't tell us what the world *is*. It tells us what the world *isn't*. It isn't Local AND Single-Outcome.
  You chose to keep Single-Outcome. I chose to keep Local.
  Neither of us is wrong about the math. We're just wrong about the other guy's priorities.

  **B:** Alright. I can live with that. But if you ever try to tell me my particles aren't real, I'm leaving the server.

  **E:** And if you tell me my branches are "metaphysical excess," I'm muting you.
  Same time next week?

  **B:** Yeah. Same time.

  **[Call Ended]**
