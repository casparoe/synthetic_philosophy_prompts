answer: |-
  The short answer is **no**. The historical evidence regarding alternative strategies does not vindicate Truman over Anscombe *by her own lights*, because your friend's interpretation of Anscombe's argument is fundamentally mistaken.

  To claim that Anscombe's protest was an "empirical wager about body counts" is to attribute to her a **consequentialist** ethical framework (specifically utilitarianism). However, G.E.M. Anscombe was one of the 20th century's most fierce critics of consequentialism. Her objection to Truman was not primarily that the atomic bombs killed *more* people than an invasion would have; it was that the deliberate killing of innocent civilians is intrinsically evil, regardless of the consequences.

  Here is a breakdown of why the historical evidence is largely irrelevant to Anscombe's specific philosophical condemnation.

  ### 1. The Category Error: Consequentialism vs. Deontology
  Your friend's argument rests on the idea that Anscombe was weighing Option A (Atomic Bomb) against Option B (Blockade/Invasion) to see which produced the lowest death toll. If Option B would have killed more people, your friend argues, then Truman was morally right to choose Option A.

  This is a utilitarian calculation. Anscombe, however, was a proponent of **Natural Law ethics** and a precursor to modern **virtue ethics**. In her famous pamphlet *Mr. Truman's Degree* (1956), she argues that certain actions are forbidden by absolute moral rules, regardless of their outcomes.

  For Anscombe, the mass killing of non-combatants is **murder**. In her framework, you cannot commit murder to prevent other deaths. To use her own analogy: if a sheriff lynches an innocent hostage to stop a riot that would otherwise kill more people, the sheriff is still a murderer. The fact that the lynching "saved lives" does not vindicate the sheriff; it merely means he committed a murder that had a beneficial side effect.

  Therefore, even if historians prove conclusively that an invasion would have killed 5 million Japanese civilians while the bombs killed 200,000, Anscombe would argue that Truman is still guilty of the intentional murder of 200,000 innocents. The body count of the alternative scenario does not cleanse the moral stain of the act itself.

  ### 2. The Doctrine of Double Effect
  Anscombe was a staunch defender of the **Doctrine of Double Effect**. This principle distinguishes between:
  1.  Foreseeing that civilians will die as a side effect of a military action (e.g., bombing a munitions factory located in a city).
  2.  Intending the death of civilians as a means to an end (e.g., bombing a city specifically to terrorize the population into surrender).

  Anscombe argued that the atomic bombings fell squarely into the second category. The destruction of civilian life was not an unfortunate accident; it was the mechanism by which the surrender was to be achieved. For Anscombe, this intention makes the act inherently immoral, irrespective of whether it shortened the war. Historical evidence about how long the war *would* have lasted otherwise addresses the *necessity* of the act, but not its *permissibility*.

  ### 3. Did Anscombe Make an Empirical Claim?
  It is true that Anscombe did dispute the *necessity* of the bombs. In her pamphlet, she writes:
  > "It is not for me to discuss the military necessity... But I will say this: that if the only way to win the war was to massacre the inhabitants of Hiroshima and Nagasaki, then it would have been better to lose the war."

  This quote highlights the core of the disagreement. Your friend interprets Anscombe as saying, "The massacre wasn't necessary because other options existed." But her deeper point is, **"Even if it was necessary, it was forbidden."**

  She anticipates the "it saved lives" argument and explicitly rejects it as a valid moral justification. She writes that Truman's defense relies on the idea that "the end justifies the means," which she calls "a phrase that has made modern morality rotten."

  ### 4. Why the Historical Debate Doesn't Settle It
  The historical debate you mention (whether Operation Downfall or a blockade would have caused higher casualties) is a debate about **prudence and strategy**. Anscombe's protest was about **justice and moral law**.

  *   **If the historians are right** (that invasion would have killed more): A utilitarian says Truman is vindicated. Anscombe says Truman is still a mass murderer, though perhaps one who faced a tragic dilemma (which she would argue he created by adopting an immoral strategy).
  *   **If the historians are wrong** (that Japan was ready to surrender anyway): A utilitarian says Truman is condemned for inefficiency. Anscombe says Truman is condemned for murder *and* inefficiency.

  In neither scenario is Truman vindicated *by Anscombe's lights*. The only way Truman is vindicated in Anscombe's framework is if one can prove the victims were not "innocents" in the moral sense (i.e., they were combatants), which she argues is impossible for the populations of Hiroshima and Nagasaki.

  ### Conclusion
  You have come around to your friend's view, but your friend has misread Anscombe. They have treated her as a utilitarian calculator who got the math wrong (or right, depending on the historian). In reality, Anscombe was arguing that the calculator itself is immoral.

  To say that historical evidence vindicates Truman over Anscombe is to assume that the morality of the atomic bombings depends entirely on the net reduction of suffering. Anscombe's entire philosophical career was dedicated to arguing that **morality does not depend entirely on the net reduction of suffering.**

  So, by her own lights, the body counts of alternative strategies are irrelevant. Truman ordered the intentional killing of the innocent. For Anscombe, that is a moral absolute that no amount of historical counterfactuals can overturn.
