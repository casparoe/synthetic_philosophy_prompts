answer: |-
  Good morning. For those who don't know me, my name is [Your Name]. Forty years ago, I was a twenty-something reporter with a notebook and a lot of nerves, and Helen was the one who let me wander around her lab, explaining the birth of stars to a guy who barely understood high school physics. She was my mentor, my friend, and the person who taught me that you can look at the cold hard data of the universe and still find a reason to be warm.

  Helen left very specific instructions for this room. She told her family, and she told me, that there are to be no platitudes today. She banned the phrase "watching over us." She banned "at peace now." She reckoned that if we're honest about the universe, we don't need those things to be okay. And knowing Helen, if I stood here and told you she was floating above us right now, she'd probably roll her eyes so hard it would disturb the local gravity.

  So, instead, I want to talk about her favorite party trick. For forty years, at dinners, at conferences, at family gatherings, Helen would paraphrase a piece by the mathematician and philosopher Frank Ramsey. She called it his "Epilogue."

  Now, half of you know Ramsey's work, and the other half might be wondering why we're doing philosophy at a funeral. But Helen didn't use Ramsey to be clever. She used him to keep from being afraid. And I think, if we listen to what she loved about his argument, it might help us keep from being afraid, too.

  Ramsey's point, as Helen told it, was about scale. We live in a universe that is terrifyingly large and terrifyingly old. When we look up at the night sky, it is very easy to feel small. It is easy to feel like a glitch, a momentary spark in a dark room that will eventually switch off.

  But Helen would stop you there. She'd say: Yes, the stars are big. Yes, they burn for billions of years. But they cannot think. They cannot love. They cannot wonder at their own existence.

  In Ramsey's view, significance isn't a matter of physical mass or duration. It's a matter of consciousness. The universe may be vast, but it is mostly dead matter. We are the rare exception. We are the part of the universe that woke up. When Helen looked at a star, she didn't feel small; she felt privileged. Because for a brief moment, the universe had eyes to see itself, and she was one of them.

  To her colleagues: You know the math. The probability of consciousness is vanishingly small.
  To her family: You know the woman. You know that a mind that can comprehend a black hole is the same mind that remembered your birthday, that laughed at bad jokes, that held your hand when you were sick.

  Helen wanted us to know that being "small" in space doesn't make you insignificant. If you can love, you are the biggest thing in the room.

  The second part of her argument was about time. Helen was a cosmologist; she knew how the story ends. She knew about entropy. She knew about the heat death of the universe, that distant point where the lights go out for good. Some people find that terrifying. They think, "If it all ends, what's the point of today?"

  Helen used an economist's analogy for this. She talked about "present value." In finance, if I promise you a million dollars a hundred years from now, that promise is worth nothing today. You can't spend it. You can't live on it. You discount it to zero.

  Helen said the heat death of the universe is so far away—so many orders of magnitude beyond human comprehension—that its "present value" rounds to zero. It is not a debt we need to pay. It is not a shadow we need to live in.

  She would say: "Don't bother discounting your Tuesday for it."

  Don't let the inevitable end of all things subtract from the value of your coffee this morning. Don't let the entropy of the cosmos subtract from the hug you give your teenager, even if they roll their eyes. Don't let the fact that we die subtract from the fact that we are here, now, together.

  Helen lived this. She didn't live for the legacy of her papers, though she wrote brilliant ones. She didn't live for the distant future of physics. She lived for the Tuesday. She lived for the lab banter, for the stubbornness of a difficult equation, for the wine after the seminar, for the sound of her sister's voice, for the chaos of her grandchildren.

  She knew that when she died, she wouldn't be watching over us. She wouldn't be anywhere. But she also knew that it didn't matter, because what she *did* while she was here is still here.

  The love she gave didn't vanish. It transferred. It's in the students she taught who are now teaching others. It's in the data she analyzed that helps us understand where we came from. And mostly, it's in this room. It's in the way her grandkids look at the stars. It's in the way her colleagues check their work for elegance, not just accuracy. It's in the way I'm standing here, trying to be as honest as she taught me to be.

  Ramsey argued that the shape of a life is what matters, not its duration relative to the cosmos. Helen's life had a beautiful shape. It was curved by curiosity and filled with gravity—she pulled people toward her.

  So, how do we say goodbye to someone who doesn't believe in "going to a better place"?

  We say it by acknowledging that this place, right here, was made better because she was in it.

  We don't need to pretend she's listening. We don't need to pretend death isn't real. Helen faced the dark with her eyes open, and she found it didn't scare her, because she had lit her own candle.

  To her physics family: We lost a brilliant mind. But the questions she asked are still in the air. We keep asking them. That is how we honor the thought.

  To her family: We lost a mother, a sister, a grandmother. But the love she gave is still in the room. We keep giving it. That is how we honor the heart.

  Helen told me once that the universe doesn't owe us meaning. We have to make it. She made hers. She took the cold vacuum of space and filled it with warmth. She took the silence of the cosmos and filled it with laughter.

  She doesn't need our prayers. She doesn't need our platitudes. She just needs us to remember the trick.

  When you feel small, remember: You can think, and the stars can't.
  When you feel afraid of the end, remember: The end is so far away that it has no claim on your Tuesday.

  Helen was okay with dying. Let's be okay with missing her. Let's be okay with the silence, and then, let's break it. Let's go have a coffee. Let's look at the sky. Let's love each other while the lights are still on.

  Thank you, Helen. For the lab. For the lessons. For the Tuesday.
