prompt: |-
  I cover science and ideas and I've got a guest lined up for the podcast next week -- a philosopher of biology who's just published a book trying to rescue Karl Popper's whole messy back-and-forth on natural selection: the 'almost a tautology' line, the 'metaphysical research programme' verdict, and then his supposed recantation in that 1977 Darwin lecture. Her pitch is basically that both the creationists who love quoting the tautology bit and the biologists who wrote Popper off entirely are missing what he was actually doing. Can you draft me 8-9 interview questions that don't just let her restate that thesis? I want atleast one that presses on whether the tautology charge was even fairly aimed to begin with (the propensity interpretation of fitness gets at this from a totally different angle), one on whether the 1978 recantation was a real change of mind given that he immediately swapped in a reformulated version of the principle that he himself apparently thought was false, one on his 'situational logic' move -- borrowed from his social science work -- as a way of explaining adaptations without citing actual laws, and one tying the whole thing back to his evolutionary epistemology, since 'conjectures and refutations' is pitched as basically Darwinian itself, which feels like it creates a weird loop. For each question, note what shes likely to say in response and give me a sharper follow-up.
