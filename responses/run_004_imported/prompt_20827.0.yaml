      *   *Section 1: The Mechanics (Why posteriors suffice).*
          *   Define the state space $\Omega$.
          *   Define partitions $P_1, P_2$.
          *   Define the Meet $M = P_1 \wedge P_2$.
          *   Explain that within a cell of the Meet, the posterior is constant (measurable).
          *   The "Averaging Argument": The posterior is the conditional expectation of the indicator variable. Conditional expectations over a coarser sigma-algebra (the Meet) must agree.
          *   *Addressing the "Evidence" point:* The posterior *encodes* the evidence relative to the prior. Knowing the posterior + Prior = Knowing the Likelihood Ratio. Common knowledge means we both know we are in the same "informational bucket."
      *   *Section 2: The "Free Lunch" and Common Knowledge.*
