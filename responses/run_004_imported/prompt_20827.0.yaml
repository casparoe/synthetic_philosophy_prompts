          *   The Identification Problem: You cannot empirically distinguish "different priors" from "different information" without assuming one or the other. It's a modeling choice (Harsanyi Doctrine).
          *   This is where the philosophical bite lies: Do we believe rational agents *should* share priors?
      *   *Section 4: Philosophical Conclusion.*
