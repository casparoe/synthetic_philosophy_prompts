answer: |-
  The reel-to-reel spun with a low, hypnotic whir, the magnetic tape catching the light from the single kerosene lamp. The humidity in the hut was thick enough to taste, sticking the shirt to Marcus's back. He leaned forward, hand hovering over the pause button, but Elena shook her head.

  "Let it run," she said. Her voice was flat, stripped of the exhaustion that lined her eyes. "Just listen to the spacing."

  On the tape, the crackle of the jungle night was punctuated by the informant's voice. *Kema gavagai.* Then the scuffle of feet, a laugh, the rustle of the rabbit disappearing into the undergrowth.

  "Rabbit," Marcus said. He reached for his notebook. "Context is clear. Stimulus is present. Gloss: *Oryctolagus cuniculus*."

  Elena didn't look up from the waveform monitor. "Gloss: *Undetached rabbit part*."

  Marcus stopped his pen. "Here we go."

  "Or *rabbit stage*," she continued, finally turning to him. "A temporal slice of rabbithood. Why is your hand writing 'rabbit' as if the physics of the situation dictates it?"

  "Because the physics of the situation involves a whole animal running across a clearing, not a disembodied paw," Marcus said. He kept his voice low, but the tension that had been tightening the air between them for weeks snapped taut. "We've been over this, Elena. Quine's example is a logical puzzle, not a fieldwork manual."

  "It's the foundation of translation," she corrected. "And you're violating it. You're assuming that because *you* see an object, *he* names an object. But look at the stimulus meaning. If I point to the ear, he assents to *gavagai*. If I point to the tail, he assents. If I point to the whole thing, he assents. The behavioral data is identical for 'rabbit,' 'part,' and 'stage.'"

  "The behavioral data for *today* is identical," Marcus said, tapping the recorder. "Quine assumes we leave tomorrow. He assumes the linguist is a ghost who can only point and nod. We aren't ghosts. We're staying for six months. We're going to hear *gavagai* used in sentences. We're going to hear if it takes a plural marker. We're going to see if they cook *gavagai* or if they cook *rabbits*."

  Elena leaned back, crossing her arms. "And when you find a plural marker, you'll translate it as 'plural.' But how do you know their apparatus of individuation matches yours? To ask him, 'Is this *gavagai* the same as that *gavagai*?' presupposes you've already translated 'same.' You're smuggling in your own ontology of identity to test his ontology of identity. It's circular, Marcus. You're just painting your own categories onto him and calling it discovery."

  "I'm not smuggling anything. I'm using the Principle of Charity." Marcus stood up and walked to the window, looking out into the dark. "We assume the speaker is rational and talking about the world as it is. If we assume he's talking about rabbit-stages, we make his language wildly complex for no gain. If we assume 'rabbit,' his sentences cohere with ours. Charity isn't fiat; it's the only bridge that allows understanding to happen."

  "Charity is colonization," Elena said softly. "It's saying, 'You must mean what I would mean in this situation.' Quine's point isn't that we can't guess. It's that there is *no fact of the matter* to be right or wrong about. There is no rabbit-in-itself waiting for us to find it. There is only the web of belief, and his web is woven differently. By insisting on 'rabbit,' you aren't finding the truth. You're just choosing the manual that makes him sound most like an Englishman."

  Marcus turned back, the shadows cutting across his face. "So what's your alternative? Do we gloss it as *null*? Do we write down the sound and admit we know nothing? That's not linguistics, Elena. That's skepticism masquerading as rigor."

  "It's honesty," she shot back. "Quine allows that we can translate for pragmatic purposes. I'm not saying we can't communicate. I'm saying you claim you're finding *the* meaning. You think there's a lock in his head and your key fits. But the lock doesn't exist. The meaning is indeterminate."

  "The indeterminacy exists only if you accept Quine's austerity of evidence," Marcus said, stepping closer to the table. He planted his hands on the wood. "He bans questions about cognitive state. He bans questions about cultural context regarding mereology. He restricts the linguist to stimulus and response. I reject the restriction. If I watch him skin a rabbit, and he uses *gavagai* to refer to the meat, but *kema* to refer to the live animal, the 'part' hypothesis dies. That's not circular. That's data."

  "But *kema* might mean 'alive'," Elena countered instantly. "Or 'moving.' Or 'agent.' You resolve one ambiguity by creating three others. You push the indeterminacy back a step, but you never eliminate it. You just get tired of pushing and call it 'resolved.'"

  "I call it 'working,'" Marcus said. "Language isn't a logical calculus. It's a tool people use to get things done. If I treat *gavagai* as 'rabbit,' and I hunt with him, and we eat, and we talk, the translation works. The cash value of the meaning is in the success of the interaction. If the 'rabbit-stage' hypothesis doesn't change how we interact, it's noise. Why carry it?"

  "Because it changes how you view *him*," Elena said. "If you think he sees objects, you think he sees the world like you. If he sees processes, or parts, his reality is fundamentally different. By flattening that difference for the sake of 'working,' you erase the very thing we came here to study. You want a mirror, Marcus. I want a window."

  "I want to not drown in solipsism," Marcus snapped. "You treat the gap between us like it's a virtue. It's not. It's an obstacle. And we have hammers to break it down."

  "You have hammers," Elena said, reaching out to stop the tape. The machine clicked off. The silence of the hut rushed back in, heavy and sudden. "I have a map that shows the gap is unbridgeable. Not because it's too wide. But because there's no ground on the other side."

  Marcus stared at her for a long moment, then picked up his pen. He opened the notebook to the page where he'd written *gavagai = rabbit*. He didn't cross it out, but he didn't add anything else.

  "Tomorrow," Marcus said, his voice tight, "we follow the trail. We see if he tracks the *rabbit* or the *parts*."

  "We'll see what you decide he's doing," Elena said, turning off the lamp. "Regardless of what he says."

  In the dark, the only sound was the insects, chanting their own indecipherable syntax, indifferent to whether they were named.
