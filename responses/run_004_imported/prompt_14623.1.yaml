  9.  **Final Polish:** Check the rhythm of the speech. Make sure they interrupt each other or pause meaningfully. (e.g., the sound of the tape recorder spinning).

  *(Self-Correction Note)*: Make sure Marcus doesn't just say "We'll ask about plurals." Elena will shut that down (mass nouns don't take plurals but refer to objects, e.g., 'water'). Marcus needs to argue that the *network* of language eventually makes the 'part' hypothesis untenable without fiat. Or, more strongly, that Quine's behavioral restriction is the flaw. Let's go with the idea that Quine's "radical translation" is a fiction that ignores the *humanity* of the informant.

  *Wait, better angle for Marcus:* Quine treats the native as a black box of stimuli. Marcus argues that the native is a *teacher*. The interaction itself creates the meaning.
  *Better angle for Elena:* Even a teacher teaches within *their* ontology, which remains inaccessible to us without circularity.

