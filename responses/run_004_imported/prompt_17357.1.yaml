prompt: |-
  I'm on the search committee for my philosophy department's tenure-track opening in philosophy of mind. Our strongest finalist works on integrated information theory: her job talk defended IIT's causal-structure account of consciousness against the 'unfolding argument' and argued that deriving the theory from phenomenological axioms is a virtue, not the liability critics take it to be. Several senior colleagues want to rank her below our second finalist -- a philosopher of neuroscience uncommitted to any single theory of consciousness. Their reasoning: IIT was publicly branded pseudoscience in a widely covered 2023 open letter signed by well over a hundred consciousness researchers, timed to get ahead of adversarial-collaboration results some read as partly vindicating the theory, and a decades-long hire built on it is a bad bet against the field's own verdict. Others on the committee think deferring to a letter-writing campaign is exactly what a philosophy department shouldn't do, and that the demarcation question is one we're better placed than most to adjudicate on the merits. I need to circulate a memo before Monday's full-department vote recommending how to rank the two finalists: it should reach a specific recommendation, and it should treat the pseudoscience charge seriously enough to say what would actually have to be true of her work for it to count as a good reason to rank her lower, rather than waving the charge away or letting it settle the matter by itself.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** Philosophy department tenure-track hiring committee (Philosophy of Mind).
      *   **Candidates:**
          *   Finalist A (Strongest): Works on Integrated Information Theory (IIT). Defended IIT against the "unfolding argument." Argues deriving IIT from phenomenological axioms is a virtue.
          *   Finalist B (Second): Philosopher of neuroscience, uncommitted to specific consciousness theories (theoretical pluralist/eclectic).
      *   **Conflict:** Senior colleagues want to rank A below B because IIT was branded "pseudoscience" in a 2023 open letter (signed by 100+ researchers). They see hiring based on IIT as a bad bet. Others argue philosophy shouldn't defer to letter campaigns and should adjudicate on merits.
      *   **Task:** Write a memo for the full-department vote (before Monday).
      *   **Requirements:**
          *   Reach a *specific recommendation* (Rank A over B, or B over A).
          *   Treat the "pseudoscience" charge seriously (don't wave it away, don't let it settle the matter automatically).
          *   Define what would *actually* have to be true of her work for the charge to be a valid reason to rank her lower.
          *   Tone: Professional, philosophical, administrative, persuasive but balanced.

  2.  **Determine the Recommendation:**
      *   *Option 1 (Rank B over A):* This aligns with the risk-averse senior colleagues. It prioritizes departmental reputation and "safety." However, it risks capitulating to external pressure without philosophical engagement, which contradicts the mission of a philosophy department.
      *   *Option 2 (Rank A over B):* This aligns with the "philosophical merit" argument. It acknowledges the controversy but asserts the department's role is to evaluate arguments, not popularity contests. Given the prompt describes A as the "strongest finalist" (implying better teaching, research quality, fit, *except* for the IIT stigma), this is the more philosophically robust stance. It allows for a nuanced discussion of *why* the pseudoscience charge might not apply to *her specific philosophical work*, even if the theory is controversial.
      *   *Decision:* I will recommend ranking Finalist A (IIT) higher. This allows for a richer memo that addresses the prompt's requirement to treat the charge seriously while defending the integrity of philosophical inquiry. It's the harder but more defensible position for a *philosophy* department.

  3.  **Structure of the Memo:**
      *   **Header:** To, From, Date, Subject.
      *   **Opening:** State the purpose (recommendation on ranking) and the specific recommendation clearly.
      *   **Acknowledgment of Controversy:** Validate the senior colleagues' concerns. The 2023 letter is real and significant. Ignoring it is naive.
      *   **Philosophical Adjudication (The Core):** Define criteria for when "pseudoscience" claims should impact hiring.
          *   Is the candidate engaging critically or dogmatically?
          *   Is the work philosophically rigorous regardless of empirical outcome?
          *   Is the "pseudoscience" label accurate regarding *philosophical* contributions vs. *scientific* claims?
      *   **Evaluation of Finalist A:** Apply the criteria. She defends against the unfolding argument (argumentative rigor). She argues for axiomatic derivation (methodological clarity). This looks like philosophy, not just cheerleading.
      *   **Evaluation of Finalist B:** Acknowledge strengths (safety, breadth) but note potential lack of distinctive theoretical contribution compared to A.
      *   **Departmental Mission:** Remind colleagues that philosophy departments evaluate arguments, not just consensus.
      *   **Conclusion:** Reiterate recommendation.

  4.  **Drafting - Section by Section:**

      *   *Header:* Standard formal memo format.
      *   *Opening:* "I recommend we rank Finalist A above Finalist B."
      *   *The "Pseudoscience" Charge:* Need to address the 2023 open letter. It's not just noise; it signals a rift in the field. But does it disqualify a philosopher?
      *   *Criteria for Relevance:* When does a scientific controversy matter for a philosophy hire?
          1.  **Dogmatism vs. Critical Engagement:** Is she immune to counter-evidence? (Her job talk suggests otherwise; she engaged the unfolding argument).
          2.  **Category Error:** Is IIT being judged as empirical science or metaphysical framework? Philosophy can study the latter even if the former fails.
          3.  **Intellectual Risk:** Tenure tracks are long. Is this too risky? (All cutting-edge work is risky).
      *   *Applying to Candidate A:* She treats IIT as a philosophical framework derived from axioms. This is a legitimate philosophical move (phenomenological structuralism). Even if IIT is empirically false, the *argumentation* has value.
      *   *Applying to Candidate B:* Safe, but does "uncommitted" mean "lack of distinctive voice"?
      *   *The Verdict:* We hire for philosophical acumen, not alignment with current empirical consensus.
      *   *Caveat:* We must ensure she is hired to do *philosophy*, not to defend a specific scientific theory at all costs.

  5.  **Refining the Tone:**
      *   Avoid being dismissive of the senior colleagues. Their concern about reputation is valid.
      *   Avoid being a zealot for IIT. Acknowledge the theory is controversial.
      *   Focus on the *nature of philosophical work*. The key distinction is between doing philosophy *of* a theory vs. doing propaganda *for* a theory.
      *   *Self-Correction during drafting:* I need to make sure I don't just say "Philosophy is different from Science." I need to explain *why* that difference protects her candidacy. The prompt asks to treat the charge seriously. So, I must admit: *If* her work were merely apologetic, the charge would stick. *But*, since her work is argumentative/axiomatic, it doesn't.

  6.  **Final Polish:**
      *   Check against constraints: Specific recommendation? Yes. Treat pseudoscience charge seriously? Yes. Define conditions for validity? Yes.
      *   Ensure the "2023 open letter" is referenced accurately (without getting bogged down in the specifics of the adversarial collaboration, just the fact of the controversy).
      *   Ensure the "unfolding argument" is mentioned as evidence of her engagement.

  7.  **Final Review against the Prompt:**
      *   "Reach a specific recommendation": Rank A > B.
      *   "Treat the pseudoscience charge seriously": Dedicate a section to "Criteria for Relevance."
      *   "Say what would actually have to be true... for it to count as a good reason": Dogmatism, lack of argumentative rigor, conflation of normative/descriptive.

      *(Self-Correction)*: I should be careful not to make the memo *too* long. It needs to be readable before a Monday vote. Keep it punchy but substantive.

      *(Refining the Recommendation)*: I will recommend ranking the IIT candidate (Finalist A) first. This takes a stand, which is what a memo is for.

      *(Key Argument)*: The "pseudoscience" label applies to empirical claims. Her work is on axiomatic derivation and causal structure metaphysics. Even if the empirical theory fails, the philosophical work survives. Therefore, the label is category-mistaken regarding her specific contribution.

      *(Addressing the Risk)*: Acknowledge the risk. But hiring the "safe" candidate (B) might mean hiring someone with less impact/promise. Philosophy departments should take intellectual risks on strong thinkers.

      *(Final Polish of the text)*: Ensure the distinction between "IIT as empirical science" and "IIT as philosophical framework" is clear.

  8.  **Drafting the Content:** (Mental outline of the text to be generated)
      *   To: Search Committee / Department
      *   From: [My Name/Role]
      *   Subject: Recommendation on Ranking Finalists
      *   Intro: Recommendation (A > B).
      *   Section 1: The Objection (The 2023 Letter). Acknowledge weight.
      *   Section 2: Criteria for Evaluation. When does scientific controversy impact philosophy hiring? (Dogmatism, Category Errors, Argumentative Quality).
      *   Section 3: Application to Finalist A. She meets the criteria for good philosophy (engaging objections, axiomatic method).
      *   Section 4: Comparison with Finalist B. B is safer but A is stronger philosophically.
      *   Section 5: Departmental Mission. We judge arguments, not consensus.
      *   Closing: Vote for A.

      *Wait, one nuance:* The prompt says "Our strongest finalist works on IIT." This implies A is already judged stronger on merit *aside* from the controversy. The memo needs to leverage that. The controversy shouldn't override the merit assessment unless the merit is *constituted* by the pseudoscience.

      *Okay, ready to write.*
answer: |-
  **MEMORANDUM**

  **TO:** Department of Philosophy
  **FROM:** [Your Name], Search Committee Chair
  **DATE:** Sunday, [Date]
  **SUBJECT:** Recommendation on Ranking of Philosophy of Mind Finalists

  **Recommendation**
  After deliberation with the search committee, I recommend that the department rank **Finalist A (the IIT specialist)** above **Finalist B (the philosopher of neuroscience)** for our tenure-track position.

  This recommendation is made with full awareness of the controversy surrounding Integrated Information Theory (IIT), specifically the 2023 open letter branding it pseudoscience. The committee believes that while this controversy is significant, it does not warrant downgrading Finalist A's candidacy, provided we distinguish between the empirical status of IIT and the philosophical rigor of Finalist A's work.

  **The Objection: The "Pseudoscience" Charge**
  Several senior colleagues have rightly noted that hiring a scholar whose research program is anchored in IIT carries reputational and intellectual risk. The 2023 open letter, signed by over a hundred researchers, reflects a deep fracture in the field. If IIT is demonstrably pseudoscientific, a tenure-line investment in its defense could prove embarrassing for the department and professionally limiting for the hire.

  However, deferring to this charge requires us to clarify what would actually make it a valid reason to reject a philosophy candidate. We cannot treat the open letter as a verdict that settles the matter for us; to do so would be to outsource our philosophical judgment to a consensus statement.

  **Criteria for Relevance**
  For the "pseudoscience" label to justify ranking Finalist A lower, one of the following conditions would need to be true of her work:

  1.  **Dogmatism over Argument:** Her work must show an immunity to counter-evidence or argument, prioritizing the preservation of the theory over truth-seeking. If her methodology is apologetic rather than critical, she is not doing philosophy.
  2.  **Category Confusion:** Her work must conflate normative/phenomenological claims with empirical predictions in a way that renders it untestable and unfalsifiable *by design*. If the work relies on scientific authority to settle metaphysical questions, it fails as philosophy.
  3.  **Lack of Transferable Rigor:** Her technical skills and argumentative structures must be so specific to IIT that they would hold no value if the theory were discarded.

  **Evaluation of Finalist A**
  Finalist A's job talk and publication record suggest she does not meet these negative criteria.

  *   **Engagement with Objections:** Her defense against the "unfolding argument" was not a dismissal but a technical engagement with the causal-structure implications of the objection. This demonstrates the critical responsiveness required of a philosopher.
  *   **Axiomatic Method:** Her argument that deriving IIT from phenomenological axioms is a virtue positions her work within a tradition of transcendental argumentation, not merely empirical modeling. Even if the empirical predictions of IIT fail, the philosophical work regarding the structural requirements of consciousness remains a coherent contribution to metaphysics and phenomenology.
  *   **Philosophical Value:** She is not hired to validate IIT as a scientific instrument, but to explore the implications of causal-structure accounts of mind. This is a legitimate philosophical inquiry regardless of the outcome of adversarial collaborations.

  **Comparison with Finalist B**
  Finalist B offers a safer profile. Their pluralism aligns better with current empirical consensus and minimizes reputational risk. However, "uncommitted" can sometimes signal a lack of distinctive theoretical voice. Finalist A presents a sharper, more defined research agenda. In a tenure-track hire, we are betting on potential for impact. Finalist A's work, precisely because it is controversial, has higher potential to generate significant philosophical discourse, citations, and student interest.

  **Departmental Mission**
  We are a philosophy department, not a grant review board for empirical science. Our expertise lies in adjudicating the structure of arguments, the coherence of axioms, and the validity of inferences. If we reject a candidate because their preferred theory is currently out of favor with a segment of the scientific community, we risk prioritizing consensus over rigor. History is replete with philosophical work that was initially at odds with scientific orthodoxy.

  **Conclusion**
  The 2023 open letter is a data point, not a verdict. It signals that Finalist A's research area is high-risk, but high-reward. Because her work demonstrates critical rigor, avoids dogmatism, and contributes to metaphysical debates independent of IIT's empirical fate, the "pseudoscience" charge does not apply to her *philosophical* candidacy.

  I urge the department to rank Finalist A first, signaling that we evaluate candidates on the quality of their argumentation, not the popularity of their preferred theories.

  **Recommendation:** Rank Finalist A > Finalist B.
