answer: |-
  Here are eight interview questions designed to press the epistemic account of moral luck, including the anticipated replies and follow-ups to prevent retreat into abstraction.

  ### 1. The "Perfect Knowledge" Resultant Luck Case
  **Question:** Let's tighten the classic reckless driver case. Usually, you argue the bad outcome provides *evidence* of a worse mental state. But suppose we stipulate a "God's-eye view" where we know via brain scan and telemetry that both drivers were *antecedently identical* in their recklessness, attention, and risk-assessment. The only difference is the pedestrian stepped out. If the outcome is no longer evidence of a hidden difference in will, does the blameworthiness remain perfectly equal?

  *   **Likely Reply:** "Yes. If the internal states are identical, the moral status is identical. The intuition that the killer is worse is just a cognitive bias."
  *   **Follow-up:** "If the blameworthiness is identical, then the moral *debts* must be identical. But the killer owes restitution to a grieving family, and the survivor does not. Are you prepared to say that the killer's duty to compensate is purely pragmatic, with no root in moral desert? If so, doesn't that sever the link between blame and the actual harm done?"

  ### 2. Circumstantial Luck and the Missing Act
  **Question:** I want to move to circumstantial luck. Consider the 'Nazi Emigrant' case: a man moves to Argentina in 1930 and lives a quiet life, while his twin stays in Germany and becomes a camp guard. On your view, we blame the guard for his actions. But what is the outcome evidencing in the emigrant's case? There is no completed act, no harm, and no trial of character that actually occurred. What is the *evidence* of blameworthiness for the man who never faced the test?

  *   **Likely Reply:** "We blame him for the disposition he *would have* manifested. The counterfactual truth grounds the blame."
  *   **Follow-up:** "But counterfactuals depend entirely on the circumstance obtaining. If morality is about how we engage with the actual world, aren't you saying that a person is blameworthy for a crime that never happened, solely based on a hypothetical? Doesn't this collapse the distinction between *thinking* about doing evil and *doing* evil, which the Control Principle was meant to protect?"

  ### 3. Constitutive Luck and the Source of Disposition
  **Question:** Your strategy grounds blame in the agent's dispositions or will, treating outcomes as external. But those dispositions themselves are products of constitutive luck—genetics, upbringing, and neurobiology that the agent did not choose. If you rule out outcome luck because it is outside the agent's control, why does the 'control' stop at the boundary of the skin? Why is an unchosen temperament a valid ground for blame when an unchosen outcome is not?

  *   **Likely Reply:** "Because the temperament is *internal* to the agency. It constitutes who the agent is, whereas the outcome is outside the agency."
  *   **Follow-up:** "But the Control Principle cites *control*, not *internality*. I have no more control over my impulse control than I do over a pedestrian stepping into the road. If you admit constitutive luck is real luck, haven't you just pushed the problem back one step? Why is 'internal luck' permissible but 'external luck' forbidden?"

  ### 4. The Phenomenology of Guilt
  **Question:** Let's talk about the agent's own experience. In the driver case, the driver who kills typically experiences profound guilt that the safe driver does not. On your epistemic view, this guilt is mistaken, because their blameworthiness is equal. Are you committed to the view that the core emotional response of moral agents—their own conscience—is systematically irrational in cases of resultant luck?

  *   **Likely Reply:** "Not irrational, just sensitive to evidence. The killer has more evidence of their own capacity for harm."
  *   **Follow-up:** "But the killer knows the safe driver was equally reckless. If they know the antecedent states were identical, yet still feel uniquely guilty, that guilt cannot be evidentiary. If your theory requires agents to suppress their own moral phenomenology to be consistent, isn't the theory failing to describe morality as it is lived?"

  ### 5. Legal Practice and Attempted Crimes
  **Question:** Our legal systems punish completed crimes more severely than attempted crimes, even when the intent is proven identical. Many philosophers argue the law tracks moral desert. If your view is correct, the law is fundamentally unjust in punishing the successful murderer more than the failed one. Do you advocate for a radical revision of legal sentencing to align with your epistemic view, or do you concede the law is tracking something real about blame that you are explaining away?

  *   **Likely Reply:** "The law is forward-looking and pragmatic; it's not a perfect mirror of moral blameworthiness."
  *   **Follow-up:** "But retributive elements of the law are explicitly backward-looking, based on desert. If the desert is identical, retributive punishment for the killer is unjust excess. Are you willing to say that our current retributive practices for homicide are morally illegitimate because they conflate evidence with desert?"

  ### 6. Agent-Regret and Restitution
  **Question:** Bernard Williams discussed 'agent-regret'—a special regret only the person who caused the harm can feel. The killer driver feels they owe something to the victim's family that the safe driver does not. If this isn't a difference in blameworthiness, what is it? If it's just a social convention, does that mean moral obligations to victims are arbitrary depending on how the dice roll?

  *   **Likely Reply:** "It's a special obligation, but not a moral *fault*. It's about repairing the world, not punishing the will."
  *   **Follow-up:** "But if I accidentally break your vase, I owe you a vase. If I accidentally kill your brother, I owe you... what? If the blameworthiness is the same as the safe driver, why does the debt exist? You seem to be creating a category of 'moral debt without moral fault,' which sounds like moral luck by another name."

  ### 7. The Definition of Blame
  **Question:** You argue that we don't *actually* blame the killer more, we just *infer* more. But if I ask a crowd, 'Who is more blameworthy?', and they point to the killer, aren't they reporting a fact about our concept of blame? By redefining blame to exclude outcomes, are you analyzing our current moral concepts, or are you proposing we stop using the word 'blame' the way we currently do?

  *   **Likely Reply:** "I'm clarifying the concept to match the Control Principle, which is a precondition of morality."
  *   **Follow-up:** "If the clarification diverges from every actual usage of the term in human practice, law, and emotion, isn't the Control Principle functioning as a stipulative definition rather than a discovery? If you have to explain away all the data to save the theory, is the theory still doing any work?"

  ### 8. The Falsifiability Challenge
  **Question:** Finally, I want to ask about the scope of your claim. You argue that every standard case of moral luck is merely epistemic. What would count, in principle, as a genuine, non-explained-away case of ontic moral luck? Is there any scenario you can describe where an outcome *actually changes* blameworthiness, or is your theory structured such that any apparent case will always be reinterpreted as epistemic?

  *   **Likely Reply:** "If I could show an outcome changing blameworthiness without any change in evidence or will, that would falsify it. But I don't think such a case exists."
  *   **Follow-up:** "If no such case can be conceived, then the claim 'blameworthiness never depends on luck' becomes a tautology true by definition. If the theory is unfalsifiable because you define blame in a way that excludes luck by fiat, have you actually solved the problem of moral luck, or just defined it out of existence?"
