      *   Did I reference Ginet/Kane's line of reasoning? Yes.
      *   Is it helpful for a novelist? Yes, by clarifying the stakes of agency.

      *(Self-Correction during drafting)*: I need to be careful not to conflate "moral responsibility" with "legal guilt." The novel has a legal climax. Philosophy deals with moral responsibility. I should note that distinction. The philosophical argument might suggest she isn't *morally* responsible in the libertarian sense, which complicates the *legal* or *narrative* judgment.

      *(Refining the Ginet/Kane argument)*: Ginet's specific objection to blockage is often about the *explanation* of the blockage. If the blockage is a prior event, and it guarantees the action, it determines the action. If it doesn't determine the action, it doesn't guarantee it. There is no middle ground where it guarantees the action *without* determining it (unless one accepts compatibilism, which Kane/Ginet reject). I need to make sure this "no middle ground" point is clear.

