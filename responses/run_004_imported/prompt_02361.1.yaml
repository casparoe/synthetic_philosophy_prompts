      *   *Wait, check the user's goal:* The user wants the ending to establish that "nothing she could have done differently... would have changed the outcome." They want to justify the moral weight. If the philosophical argument shows this setup *undermines* moral weight (by making it determinism), that is crucial information for the novelist.
