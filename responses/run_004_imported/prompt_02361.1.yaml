          *   *Horn B (Non-Causal/Logical Blockage):* If the blockage is not causally sufficient (just a logical constraint or a "brute fact"), then why couldn't the agent have acted differently earlier to avoid the block? Or, if the block is truly inert until the moment of choice, does it actually remove the *ability* to do otherwise in the relevant sense?
      *   *Step 3: The "Prior Sign" Problem Returns.* Even without a watcher, there must be a *state of the agent* that constitutes the block. Let's call it State S.
          *   Is State S sufficient to cause the action? If yes -> Determinism.
          *   Is State S not sufficient? Then the agent could have been in State S and *not* acted. Then PAP survives.
      *   *Step 4: The Timing Issue (Ginet's Focus).* Ginet emphasizes that freedom is about the *moment of action*. If the blockage happens at $t_1$ and the action at $t_2$, and the link is causal, the agent at $t_2$ is a puppet of $t_1$. If the link isn't causal, the blockage is irrelevant to the *power* to act at $t_2$.
