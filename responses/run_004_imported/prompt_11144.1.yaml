      *   **Goal:** 8-10 sharp interview questions that engage with the substance of her view, avoiding softballs or biographical fluff.
      *   **Specific Requirements:**
          *   Must include a question on Alan Shewmon's "chronic brain death" cases (somatically surviving brain-dead bodies).
          *   Must include a question on Normothermic Regional Perfusion (NRP) in Donation after Circulatory Death (DCD).
          *   Must include a question on the distinction between "permanent" and "irreversible."
          *   Each question needs a specific follow-up designed to counter likely deflections (e.g., "measurement problem," "brain as integrator").
      *   **Tone:** Professional, probing, knowledgeable, slightly adversarial but respectful (journalistic).

  2.  **Deconstruct the Bioethicist's Position (The "Whole-Brain" Defender):**
      *   *Core Argument:* Death is the loss of the organism as a whole. The brain is the critical integrator. Without it, the body is just a collection of cells, even if machines keep some functions going.
      *   *Common Defenses:*
          *   "Spinal reflexes don't count as integration."
          *   "Hormonal regulation can be replaced artificially."
          *   "Shewmon's cases are outliers or misdiagnosed."
          *   "NRP doesn't restore *brain* function, so the person is still dead."
          *   "Permanent vs. Irreversible is about intent not to resuscitate, not biological impossibility."

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Shewmon/Chronic Brain Death.*
          *   *Draft 1:* What about Shewmon's patients who lived a long time?
          *   *Critique:* Too soft. Needs to challenge the "integrative unity" concept.
          *   *Refinement:* Focus on somatic integration (healing, gestation). If the body integrates itself without the brain, is the brain really the *sine qua non* of organismal unity?
          *   *Follow-up:* She'll say it's artificial support. Counter: The support is the same for any ICU patient; the *internal* regulation is what matters.

      *   *Requirement 2: NRP (Normothermic Regional Perfusion).*
          *   *Draft 1:* Is NRP ethical?
          *   *Critique:* Too broad. Needs to focus on the "dead donor rule" and the definition of death.
          *   *Refinement:* In NRP, you restore circulation to the abdomen/thorax after declaring cardiac death. If circulation is restored, wasn't the cessation "permanent"? It looks like we are manipulating the definition to get organs.
          *   *Follow-up:* She'll say the brain is excluded. Counter: If the body is alive, why does the brain's exclusion make the *organism* dead?

      *   *Requirement 3: Permanent vs. Irreversible.*
          *   *Draft 1:* What's the difference between permanent and irreversible?
          *   *Critique:* Too textbook. Needs to pin down the legal/moral weight.
          *   *Refinement:* "Irreversible" means it *can't* come back. "Permanent" means we *won't* try to bring it back. If death hinges on "permanent," isn't death a normative decision rather than a biological fact?
          *   *Follow-up:* She'll say it's about clinical context. Counter: Then we are essentially executing patients for their organs based on a policy choice.

      *   *Filling the remaining 5-7 questions:*
          *   Need to cover: Jahi McMath (religious exemption), the "organizing principle" of the body, the "dead donor rule," public trust, and the "higher brain" vs. "whole brain" distinction.
          *   *Question 4 (Jahi/Religious):* New Jersey allows religious objection. Does this admit that brain death is a philosophical/religious line, not a medical fact?
          *   *Question 5 (Integration):* If a brain-dead body can regulate temperature or heal, where is the "loss of integration"? Is it just about consciousness?
          *   *Question 6 (Dead Donor Rule):* Do we need the Dead Donor Rule? Would it be more honest to say we kill these patients for organs but with good reason? (The "moral fiction" angle).
          *   *Question 7 (Higher Brain):* Why not just say death is loss of consciousness (neocortical)? Why cling to the brainstem if the person is gone?
          *   *Question 8 (Public Trust):* If the public knew how organs are harvested (NRP, etc.), would they trust the system? Is opacity necessary for donation rates?
          *   *Question 9 (Technology):* As tech improves (better life support), does the line of death move? If death moves with tech, is it real?
          *   *Question 10 (The "Organism" definition):* What specifically makes the body an "organism" rather than a "collection of tissues"? If the heart beats, isn't it an organism?

  4.  **Refining and Polishing:**
