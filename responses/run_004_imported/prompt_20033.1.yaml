prompt: |-
  A friend and I spent an entire dinner arguing about whether a chatbot can be said to believe that Paris is the capital of France. She invoked Dennett's intentional stance in its strongest form: if ascribing beliefs and desires is simply the strategy that best predicts a system's behavior, then the metaphysical question is already settled. I wanted to object that this makes a language model no different from Dennett's own thermostat, which he was willing to count as a believer of the most minimal sort, but I could not articulate why that comparison should trouble her.

  I host a small philosophy podcast, and next week's guest defends exactly her position: that large language models are "true believers" in Dennett's sense, not merely convenient fictions. Draft eight to ten interview questions that go beyond letting him restate the thesis. Include at least one question on what an LLM has that a thermostat lacks, given that Dennett's own grading of intentional systems already lets the thermostat count as a genuine, if degenerate, first-order believer; one on whether the "real patterns" criterion for belief-realism -- that the intentional-level description must earn its keep by compressing prediction better than noise -- survives a model that affirms and denies the same claim under mere rephrasing; and one on whether real belief requires the second-order capacity to represent one's own beliefs as beliefs, which is exactly where these systems tend to confabulate. Give each of those three a follow-up keyed to the answer he is most likely to give, and close with a question asking what observation would actually lead him to withdraw the attribution.
