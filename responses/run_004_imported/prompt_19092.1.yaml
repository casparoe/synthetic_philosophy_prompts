answer: |-
  First off, huge congratulations. You have independently rediscovered one of the most famous and debated solutions to this problem in the philosophy of science.

  Your intuition is spot-on, and your hesitation is also shared by professional philosophers. You have stumbled directly onto what is known as the **Garber Solution** (proposed by Daniel Garber in 1983).

  Here is the breakdown of why your fix works, where the bodies are buried, and how it handles your specific doubts about "math probabilities" and "cheating."

  ### 1. You are right: The "New Evidence" is the Entailment
  Your proposed fix is exactly Garber's argument. Standard Bayesianism assumes **Logical Omniscience**. It assumes that if you believe Theory $H$, you automatically believe every logical consequence of $H$. If you believe $H$, and $H$ logically implies $E$, a perfect Bayesian agent *already* knows $E$ is true with probability 1 given $H$.

  But humans aren't logically omniscient. We can hold a theory in our heads without knowing everything it implies.
  *   **Before Einstein:** Astronomers knew $E$ (Mercury's wobble). They didn't know $H$ (GR). Crucially, they did not know the relationship $H \to E$.
  *   **After Einstein:** They learned that $H \to E$.

  Garber argued that we should expand our Bayesian language. Instead of updating on $E$ (which is old), we update on $E^*$, where $E^*$ is the proposition **"Theory $H$ entails Evidence $E$."**

  Before Einstein did the math, the probability that "GR entails Mercury's wobble" was *not* 1. It was uncertain. When Einstein finished the derivation, the scientific community updated their probability for $E^*$ to 1. That update is what drives the increase in probability for $H$.

  ### 2. Addressing Doubt #1: "Probabilities for Mathematical Facts"
  You asked: *"Now you need some probability for a mathematical fact before you've even checked whether it's true, and I don't know what that would even mean."*

  This is the crux of the technical objection. In classical logic, a mathematical truth is necessarily true. It can't have a probability of 0.5. It's either 1 or 0.

  **The Fix:** This solution requires adopting **Subjective Bayesianism** rather than Objective Bayesianism.
  In this framework, probability doesn't measure the "truth frequency" of the math; it measures your **state of knowledge** about the math.
  *   Before I check the sum, I am not certain that $123 \times 456 = 56088$.
  *   I might assign it a probability of 0.9 (I'm pretty sure I won't make a calculation error).
  *   When I check it, I update to 1.0.

  Garber's solution requires us to admit that Bayesian agents are limited. We don't know all logical truths instantly. Therefore, assigning a probability $<1$ to a logical entailment before deriving it is perfectly valid *epistemologically*, even if it's weird *logically*.

  **Has this been shot down?**
  Not shot down, but it is controversial. Some purists argue this "changes the subject." They say Bayesian confirmation theory is supposed to be about how evidence supports theories in the world, not about how we learn about our own equations. However, most working scientists and modern philosophers agree that if a theory of rationality doesn't allow for learning logical connections, it's a bad theory of rationality. So, your fix holds water.

  ### 3. Addressing Doubt #2: "The Cheating Problem"
  You asked: *"If you built the theory specifically to hit a number you already knew, does 'discovering' that it hits the number really deserve the same credit as an actual prediction?"*

  This is a different problem known as the **Accommodation vs. Prediction** debate (or Use-Novelty).

  Your fix solves the *logical* paradox (showing that old evidence *can* confirm > 0), but it doesn't automatically solve the *methodological* worry (that accommodation confirms *less* than prediction).

  Here is the consensus view:
  1.  **Logical Confirmation:** Your fix is correct. Accommodating old evidence *does* increase the probability of the theory. It is not zero. Mercury's wobble *did* confirm GR.
  2.  **Methodological Weight:** Novel prediction is often still weighted higher. Why? Because of **Degrees of Freedom**.
      *   If I build a theory *after* seeing the data, I might have tweaked parameters to fit the noise (overfitting).
      *   If I predict data *before* seeing it, I couldn't have tweaked parameters to fit it.
      *   Therefore, while $P(H|E_{old})$ goes up, $P(H|E_{new})$ might go up *more*, because $E_{new}$ rules out the possibility that you just curve-fitted the past.

  So, your fix doesn't open the door to cheating; it just opens the door to *credit*. Whether that credit is full price or discount price depends on how many free parameters the theory had to absorb the old data.

  ### 4. Why nobody explains this well online
  You mentioned: *"nobody online actually explains it in a way that satisfied me, they just state it and move on."*

  This is because the "Old Evidence" problem sits at the intersection of math, logic, and philosophy.
  *   **Mathematicians** hate the idea that logical truths have probabilities $<1$.
  *   **Philosophers** love arguing about whether "learning a logical truth" counts as empirical evidence.
  *   **Scientists** (like the election forecasters you follow) usually just ignore it. They use "Bayesian-ish" updating where they treat old data as a likelihood check without worrying about the $P(E)=1$ paradox. They effectively do what you suggested without formalizing it.

  ### Summary
  1.  **Is your fix real?** Yes. It is the Garber Solution (1983).
  2.  **Is it accepted?** It is the leading solution among those who think the problem needs solving, though it requires accepting that agents aren't logically omniscient.
  3.  **Does it allow cheating?** No. It proves old evidence *counts*, but it doesn't prove old evidence counts *as much as* novel prediction. That distinction remains valid to prevent overfitting.
  4.  **The "Math Probability" issue:** This is resolved by interpreting probability as "degree of belief" rather than "frequency of truth." You can be uncertain about a math problem you haven't solved yet.

  You didn't just find a hole in Bayesianism; you found the exact spot where 40 years of philosophy of science literature is concentrated. Your intuition is solid.
