answer: |-
  The heat in the negotiation tent was a physical weight, pressing down on the maps spread across the low table. Dust motes danced in the shafts of light piercing the canvas, settling on the inked lines that represented a world no one quite lived in anymore.

  Elara sat between the delegations, her notebook open, her pen hovering. To her left sat Kaelen, representing the Lowlanders who followed the water. To her right, Torin, of the Highlanders who followed the stone. Between them lay the Treaty of the Twin Banks, signed forty years ago after the Civil Severance. It stated simply: *The border is the River Aeth.*

  Everyone agreed on the physics. Everyone agreed on the history. Three years ago, the monsoon swelled the Aeth until it burst its banks, carving a new channel three miles east. The old bed dried to dust. The Shrine of Whispers, once on an island in the mid-channel, now sat on dry ground, firmly attached to the Lowlanders' side of the new water.

  "The Shrine is ours," Kaelen said, his voice rough with fatigue. "The Treaty says the border is the Aeth. The Aeth flows here, now. The Shrine is on our bank."

  "The Treaty says the border is the Aeth," Torin countered, tapping the map where the old, dry channel was drawn in faded ink. "The Aeth is the path cut by our ancestors. This new trickle is a usurper. The Shrine remains in the Aeth's bed. The bed is ours."

  Elara translated for the record, but her pen stalled. In the Old Tongue, both men had used the same word: *Aeth*. But she knew, having grown up on the border, that Kaelen's *Aeth* meant *current-water-flow*, while Torin's *Aeth* meant *historical-channel*.

  "Can we pause?" Elara asked.

  The two elders glared at her. She was merely the translator, a linguistic bridge, not a participant. But the stalemate had lasted weeks.

  "Proceed," Kaelen said.

  "I need to clarify the term *Aeth*," Elara said. "When you say the Shrine is 'in the Aeth,' Commander Kaelen, do you mean 'within fifty yards of the current water surface'?"

  "I mean," Kaelen said slowly, "that the border is where the water runs. Where the water runs, the Lowlands end and the Highlands begin. The Shrine is on the Lowland side of the water."

  "And Commander Torin? When you say the Shrine is 'in the Aeth,' do you mean 'within the geological depression carved by the river prior to the third monsoon of the fortieth year'?"

  Torin nodded. "The river is its bed. The water is just its skin. You do not say a man has changed because he sheds a coat. The bed remains. The Shrine is in the bed."

  Elara looked down at her notebook. She had spent the last month creating a glossary, trying to find neutral terms to map the two dialects. She turned to a fresh page and drew two columns.

  In the left column, she wrote: *Kaelen's Fact Set.*
  1. Water currently flows at Coordinate X.
  2. Shrine is at Coordinate Y.
  3. Coordinate Y is west of Coordinate X.
  4. Treaty binds border to 'Aeth'.
  5. 'Aeth' = Current Water Flow.
  6. Conclusion: Shrine is in Lowlands.

  In the right column, she wrote: *Torin's Fact Set.*
  1. Water currently flows at Coordinate X.
  2. Shrine is at Coordinate Y.
  3. Coordinate Y is within the Historical Channel.
  4. Treaty binds border to 'Aeth'.
  5. 'Aeth' = Historical Channel.
  6. Conclusion: Shrine is in Highlands.

  She stared at the page. Rows one, two, and three were identical. Both men agreed on the coordinates. Both agreed on the hydrology. Both agreed on the text of the Treaty. The only divergence was in row five.

  It wasn't a dispute about the world. It was a dispute about the label *Aeth*.

  For days, Elara worked late into the night by lantern light. She interviewed the scouts, the farmers, the elders. She found that when she forced them to speak without the word *Aeth*, using only descriptions of water and stone, the anger dissipated. A Lowlander farmer would say, "The water moved east," and a Highlander shepherd would nod and say, "Yes, the water moved east." They agreed on the movement. They agreed on the location. They only fought when they tried to summarize those facts using the word *River*.

  It was like watching two people argue over whether a picture was hanging on the wall. One defined "wall" as the plaster surface; the other defined it as the structural studs behind the plaster. The picture was on the plaster. Both agreed on the picture's position. They were only fighting over which layer deserved the name.

  On the fourth day, Elara brought her glossary to the table. She had replaced every instance of *Aeth* in the draft agreement with either *Current-Flow* or *Historical-Bed*, leaving blanks for the negotiators to fill.

  "There is no factual disagreement," Elara said, her voice steady despite the trembling in her hands. "Commander Kaelen believes the border follows the water. Commander Torin believes the border follows the bed. You both agree on where the water is. You both agree on where the bed is. You disagree only on which one the Treaty meant by the word *Aeth*."

  She slid the paper across the table. "If the Treaty means *Current-Flow*, the Lowlanders win. If it means *Historical-Bed*, the Highlanders win. But there is no further fact to discover. The water does not care what you call it. The stone does not care."

  Silence stretched across the tent. The dust motes seemed to freeze.

  Kaelen picked up the paper. He read it slowly. Torin leaned forward, his eyes narrowing.

  "You are saying," Torin said, his voice low, "that this is merely a confusion of tongues? That we agree on the world, and differ only on the noise we make to describe it?"

  "I am saying," Elara replied, "that if you strip away the word *Aeth*, you agree on everything else."

  Kaelen looked at Torin. "Is this true? Do you agree the water moved?"

  "I agree the water moved," Torin said. "Do you agree the bed remains?"

  "I agree the bed remains," Kaelen said.

  "Then the translator is correct," Torin said. "There is no metaphysical dispute. The river is not a spirit that chose a new path. It is water in a channel."

  Elara felt a surge of triumph. She had done it. She had dissolved the knot. The Hirschian realization—that the dispute was merely verbal—had landed. The ontological weight lifted. There was no hidden fact about "Riverhood" waiting to be found. There was only the choice of language.

  "So," Elara said, leaning forward. "Now that we know the disagreement is verbal, we can choose the definition that best serves peace. We can split the Shrine's custody. Or we can declare it neutral ground, since the border definition is ambiguous."

  Kaelen laughed. It was a dry, brittle sound. Torin did not laugh at all. He pushed the paper back across the table.

  "You have done good work, translator," Kaelen said. "You have shown us that we speak different dialects. But you have not solved the problem."

  "But the dispute was about the border," Elara said. "If the border is verbally indeterminate, then the ownership is indeterminate."

  "The border is not the problem," Torin said softly. "The Shrine is."

  Elara blinked. "I don't understand."

  "We did not come here to argue about hydrology," Kaelen said. "We came here because the Shrine contains the bones of the First Fathers. It is not about whether the word *Aeth* applies to the water or the bed. It is about who holds the bones."

  "But the Treaty..." Elara started.

  "The Treaty was a tool," Torin said. "We used the River because it was a clear line. Now the line is blurred. You have shown us that the blur is in our words, not in the earth. But the earth still holds the bones. And my people will not leave them in your hands."

  "So the verbal dispute..." Elara trailed off.

  "Was a vessel," Kaelen said. "Now the vessel is broken. We must forge a new one. But do not think, girl, that because you found our words were slippery, that our claim is weak. We claim the Shrine not because the River is here, but because the Dead are here."

  Elara sat back. She had expected the realization to dissolve the conflict. If there was no fact of the matter about the river, there could be no fact of the matter about the border, and thus no fact of the matter about the Shrine. But the entitlement wasn't derived from the ontology. The ontology was just the clothing the entitlement wore.

  She looked at Torin. He was staring at the map, his finger resting on the dry channel. "However," Torin said, "you say there is no fact about the River. That both ways of speaking are equal."

  "I said they describe the same physical facts," Elara corrected.

  "Are they equal?" Torin asked. He looked up, his eyes sharp. "Is it truly the case that one carves the world no better than the other? Or is one way... truer?"

  Elara hesitated. This was the edge of the cliff she had avoided. "True in what sense?"

  "In the sense of nature," Torin said. "When I look at the dry bed, I see the history of the land. When Kaelen looks at the water, he sees the moment. Is it possible that the bed is the *real* river, and the water is just a visitor? Or is he right, that the water is the *real* river, and the bed is just a scar? You say it is only words. But I wonder if you are blind to the joints of the world."

  Kaelen shifted. "And I say the water is the life. Without water, it is a ditch. Is it possible my tongue cuts closer to the bone?"

  Elara looked between them. She had assumed that because the dispute was verbal, neither side was metaphysically privileged. That was the deflationist comfort: no one is wrong, everyone is just speaking different languages. But Torin was asking if one language might be *better* at capturing reality. If Sider was right, one of them was carving at the joints, and the other was hacking at the gristle.

  Does it matter? Elara thought. If the practical outcome is the same—if they still fight over the bones—does it matter if one definition is metaphysically privileged?

  But then she looked at the map. If one definition was objectively true, if the River *really* was the Bed, then the Treaty gave the Shrine to the Highlands by right of nature, not just convention. If the River *Really* was the Water, the Lowlands held it by natural law. The verbal dissolution removed the certainty that it was *just* words. It left open the terrifying possibility that one side was ontologically correct, and thus morally entitled, even if they couldn't prove it empirically.

  "I cannot answer that," Elara said. "I can only translate what you say. I cannot tell you what the world is."

  "Then we are back where we started," Kaelen said, standing up. "Except now we know the words are ours, not the world's. That makes the choice harder, not easier."

  "Meet again tomorrow," Torin said. "Bring the glossary. But leave the hope that it will save us."

  They left the tent. Elara remained alone with the maps. The dust settled on the inked lines. She looked at the dry channel, then at the new water.

  She had proven that the disagreement was verbal. She had shown that the physical facts were neutral. But she hadn't resolved the claim. If anything, she had made it heavier. If the border was just a choice of language, then choosing the border was an act of power, not discovery. But if one language carved deeper than the other, then the choice was an act of recognition.

  She closed her notebook. Outside, the wind blew across the dry bed of the old Aeth, making a sound like a low voice. It sounded like it was speaking the Old Tongue. Or maybe it was just wind.

  Elara packed her things. She would return tomorrow. She would translate their words. She would map their facts. But she would not tell them whether the River was real. She would leave that question hanging in the dust, where it belonged, heavy and unresolved, the only thing in the valley that remained truly untouched by the flood.
