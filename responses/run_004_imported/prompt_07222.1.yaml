answer: |-
  **Setting:** *A university coffee shop, late afternoon. Two graduate students, Alex and Jordan, are clearing away empty espresso cups. Their seminar on Value Theory just let out.*

  **Alex:** Okay, I know the room was split on this, but I think you're being too hard on the Buck-Passing account. The Rabinowicz and Rönnow-Rasmussen paper actually gives us the tools to solve the Demon case. It's just a matter of applying the Object-Given/State-Given distinction rigorously.

  **Jordan:** Rigorously? That's the problem. The distinction looks clean on a whiteboard, but when you try to apply it without smuggling in the very notion of value you're trying to reduce, it dissolves. You're trying to save the reductive project, Alex. I'm telling you, the cost of saving it is higher than just accepting Fittingness-First.

  **Alex:** That's a bold claim. Look, the Buck-Passing account says $X$ is good if and only if $X$ provides reasons for pro-attitudes toward $X$. The Demon case threatens this because the demon provides a reason to admire him (to avoid torture), but he isn't good. The OG/SG fix says: The threat is a reason for the *state* of admiring, not a reason grounded in the *object*. It's state-given. We filter those out, and the extensional adequacy holds.

  **Jordan:** But *how* do you filter them out? That's the circularity charge. To say a reason is "object-given," you have to say it bears a specific relation to the object's properties. But which properties? The demon has the property of "being able to torture you." That is a property of the object. So, if I admire him because he can torture me, isn't that a response to a property of the object?

  **Alex:** No, because the reason isn't counting in favor of the *admiration* being correct; it's counting in favor of the *benefits of having* the admiration. Scanlon's formulation is key here. A reason is object-given if it bears on the correctness of the attitude. The threat bears on the prudential rationality of holding the attitude.

  **Jordan:** There it is. "Correctness." You just snuck "fittingness" in through the back door. You're distinguishing object-given from state-given reasons by asking: "Does this reason make the attitude *correct*?" But if you need a prior notion of correctness to sort your reasons, you can't use the reasons to define value or correctness. You've presupposed the normative relation you're trying to analyze.

  **Alex:** I'm not presupposing it; I'm analyzing it in terms of the structure of reasons. Look, there's a formal difference. An object-given reason is one where the property $P$ is a property of $O$ (the object), and $P$ makes $O$ a suitable target of attitude $A$. A state-given reason is where property $Q$ is a property of *having* attitude $A$. The demon's threat is a property of *having* the admiration (i.e., you stay alive), not a property of the demon that makes him admirable.

  **Jordan:** But how do you know which properties count as making an object a "suitable target"? If I say, "The demon is dangerous, therefore I fear him," that's object-given. Fear is fitting for dangerous things. If I say, "The demon is dangerous, therefore I *admire* him to avoid pain," you say that's state-given. Why? Because admiration isn't the right attitude for danger. But how do you know that without already knowing what admiration is *for*?

  **Alex:** Because admiration has a constitutive aim. It aims at the admirable.

  **Jordan:** Exactly! And what is the admirable? The good. So you're defining the good in terms of reasons for attitudes, but sorting the reasons requires knowing what the good (or the admirable) is. It's a circle. Rabinowicz and Rönnow-Rasmussen try to patch this by saying we need a "double fit"—the attitude must fit the object, and the reason must fit the attitude. But that just multiplies the primitives. If you're going to have a primitive fitting relation between attitude and object, why bother reducing value to reasons at all? Just go Fittingness-First. Say $X$ is good iff it is fitting to favor $X$, and leave "fitting" unanalyzed.

  **Alex:** Because "fitting" is obscure! It's a normative primitive that hangs in the air. The Buck-Passing account is attractive because it unifies value theory with the theory of practical reasons. It naturalizes value into the economy of reasoning. If I accept your Fittingness-First view, I lose that unity. I have to say there are "reasons" and then there are these mysterious "fittingness relations" that aren't reducible to reasons. That's ontologically profligate.

  **Jordan:** Is it profligate, or is it honest? You're trying to reduce the normative to the normative. You're saying Value = Reasons. But to make that equation work against the WKR problem, you have to constrain "Reasons" to "Right Kind of Reasons." And the only way to identify the Right Kind is to ask, "Does this reason make the attitude fitting?" So, Value = Reasons that make attitudes fitting. But "Reasons that make attitudes fitting" is just a periphrasis for "Value." You haven't reduced anything; you've just added syllables.

  **Alex:** That's too quick. It's not just a periphrasis. It explains *why* value is normative. If $X$ is good, it *must* provide reasons. The Buck-Passing account captures the necessary connection between value and rationality. Your Fittingness-First view allows for a gap. Could something be fitting to favor but provide no reason to favor it?

  **Jordan:** No, fittingness *is* a normative notion. If it's fitting to favor $X$, you have a normative reason to favor $X$. But the *source* of the normativity is the fittingness, not the reason itself. Look, consider the "Cloning Case." Suppose a neuroscientist clones the demon's threatening properties onto a harmless statue. The statue has the property "looks like it can torture you." If I admire the statue to avoid pain (because the scientist is watching), that's state-given. But if the property is identical, how does the ontology of the property determine the kind of reason?

  **Alex:** Because in the statue case, the property isn't *actually* making the statue a target of admiration. It's making the *situation* one where admiration is prudent. The distinction relies on the content of the attitude. Admiration represents its object as having excellence. The threat doesn't confer excellence.

  **Jordan:** "Represents its object as having excellence." Alex, "excellence" is a value term! You are defining value in terms of attitudes that represent value. That's blatantly circular. To defend Buck-Passing, you have to describe the attitudes in non-evaluative terms. But you can't describe admiration without saying it's a response to perceived value.

  **Alex:** I can describe it functionally. Admiration is a disposition to praise, emulate, etc.

  **Jordan:** And the demon threat gives you a reason to emulate him? Technically, yes. To save your skin. So the functional description doesn't filter the Wrong Kind of Reasons either. You need the normative filter. You need to say, "Emulation *merited* by the object." And there we are again. Merit. Fittingness. Value.

  **Alex:** Okay, let's grant for a moment that there is a slight circularity, or at least a interdependence. Isn't it a virtuous circle? We illuminate value by linking it to reasons, and we illuminate the relevant reasons by linking them to the nature of the attitudes. It's a reflective equilibrium. Your Fittingness-First approach just stops the inquiry early. It says, "It's just primitive." That's a conversation stopper.

  **Jordan:** It's not a conversation stopper; it's a boundary marker. It tells us where analysis ends and intuition begins. The Buck-Passer claims to be giving an analysis, but if the analysis relies on a distinction (OG/SG) that can only be drawn by appealing to the analysandum (value/fittingness), then it's not an analysis. It's a disguise. I'd rather take the primitive. It's more parsimonious to admit one normative primitive (fittingness) than to pretend you have none while secretly relying on one to sort your reasons.

  **Alex:** But the payoff for Buck-Passing is explaining the "normative force" of value. If value is just primitive fittingness, why does it bind us?

  **Jordan:** Because fittingness *is* a normative relation. It binds us by definition. Just like logical entailment binds belief. You don't ask why logical entailment provides a reason for belief; it's constitutive of belief. Why can't value be constitutive of the rationality of attitudes?

  **Alex:** Because then you lose the ability to explain *degrees* of value in terms of the *weight* of reasons. The Buck-Passing account lets us say $X$ is better than $Y$ because there are weightier reasons to favor $X$.

  **Jordan:** And the Fittingness-First theorist says $X$ is better than $Y$ because it is *more fitting* to favor $X$, which corresponds to weightier reasons. We get the same result. You haven't gained explanatory power; you've just added a layer of machinery (the OG/SG distinction) that requires constant maintenance to keep the WKR problem from breaking it. Every time someone comes up with a new Demon case, you have to tweak the definition of "object-given."

  **Alex:** That's just philosophical progress! We refine the theory. R&R refined it from simple object-properties to reasons that bear the right relation to the object.

  **Jordan:** And what determines the "right relation"?

  **Alex:** *Sighs.* The relation that makes the attitude fitting.

  **Jordan:** There it is. You said it yourself.

  **Alex:** Fine. But I still think the integration with practical reason is worth the cost. It keeps value from being a spooky, non-natural property floating above the realm of reasons. It anchors value in what agents have reason to do.

  **Jordan:** And I think anchoring value in fittingness keeps it from being collapsed into mere prudence. The Demon case shows that reasons can be divorced from value. If you try to glue them back together with the OG/SG distinction, you're using value-glue. Just admit the glue is primitive.

  **Alex:** So we're at a stalemate. I'm willing to accept a thin notion of fittingness to sort reasons if it saves the reductive link to rationality. You're willing to sever the reductive link to preserve the purity of the analysis.

  **Jordan:** Not sever the link. Just reverse the order of explanation. It's not Value because Reasons. It's Reasons because Value (via Fittingness).

  **Alex:** Well, until the next seminar. I'll be reading the next paper on whether "fittingness" can be analyzed in terms of "correctness conditions."

  **Jordan:** And I'll be checking to see if "correctness" presupposes "value." Coffee's on you if I find a circularity.

  **Alex:** Deal. But only if you admit that the OG/SG distinction handles the standard Demon case.

  **Jordan:** It handles it by assuming the solution. That doesn't count.

  **Alex:** Typical primitivist.

  **Jordan:** Typical reductionist.
