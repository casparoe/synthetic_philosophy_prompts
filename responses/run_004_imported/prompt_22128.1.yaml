answer: |-
  Thank you all for being here. My father was a man who valued precision, even—perhaps especially—when facing the end. Before he died, he gave me specific instructions for this moment. He asked that I not offer you the usual comforts. He did not want me to tell you he is in a "better place," nor that he is "watching over us." He felt those phrases, while kind, were logically imprecise and emotionally vague.

  He also knew who would be in this room. To my aunt, my cousins, and the family: he loved you deeply, though he often spoke in a language of symbols and axioms rather than sentiment. To his colleagues and students: he trusted you to listen without flinching.

  My father was a logician. For him, the structure of reality was not a matter of faith, but of consistency. In his retirement, he became absorbed in the unpublished notebooks and private correspondence of Kurt Gödel. Many of you know Gödel for the Incompleteness Theorems, or for his formal Ontological Proof for the existence of God. My father was careful to distinguish his own views from both. He was not a conventional Catholic, though he respected the tradition of his youth. And he insisted that Gödel's proof of God was a separate mathematical exercise from Gödel's reflections on the human mind.

  What my father adopted as his own considered view was a specific argument regarding rationality and survival. He believed that if the universe is genuinely rational—if it is governed by laws that can be understood—then it cannot contain a fundamental contradiction. He argued that a conscious mind capable of perceiving eternal truths cannot itself be entirely transient. To him, the annihilation of a rational observer by a rational universe would be an inconsistency, a logical error in the system itself.

  He did not believe this because he was afraid of dying. He did not bet on an afterlife as a form of insurance, as in Pascal's Wager. He believed it because he thought the alternative was incoherent. He often told me that truth does not expire, and if the human mind can grasp truth, the mind must participate in something that does not expire.

  This was not a cold abstraction for him. It was the source of his courage. Because he viewed survival not as a reward, but as a logical necessity of a rational world, he faced his illness without panic. He did not look for signs. He did not ask for mercy. He simply maintained that the equation must balance.

  I know this might sound distant to some of you. You might wish I had said he is at peace, or that he is free from pain. But to my father, "peace" was not the absence of struggle; it was the presence of consistency. To tell you he is "gone" would be, in his view, a false statement. To tell you he is "here" in a spiritualist sense would be equally imprecise.

  He taught me that we honor a thinker not by softening their edges, but by engaging with them. So, I will not ask you to pray for his soul, as his logic did not require intercession. I will not ask you to imagine him looking down, as his logic did not permit a spatial heaven.

  Instead, I ask you to remember his integrity. He spent his life ensuring that his conclusions followed from his premises, and that his life followed from his conclusions. In a world that often prefers comfortable lies to difficult truths, he chose the truth. He believed that the rational structure of the world sustains us, even when our biological functions cease.

  To his colleagues: I have done my best to represent his position without reducing it to theology or sentiment. I know he would appreciate that accuracy.

  To my family: He loved you. That was an axiom he never questioned.

  We miss him. We feel the absence of his voice, his quiet humor, and his fierce intellect. But if he was right—if rationality implies continuity—then we are not saying goodbye to a vanished thing. We are acknowledging a change of state in a system that remains consistent.

  Thank you for coming to witness this. He would have wanted you to know exactly where he stood. And he would have wanted you to keep thinking, clearly and bravely, in your own lives.

  Thank you.
