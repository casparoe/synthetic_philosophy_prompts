  **Move 1 (Owen): Score 1**
  Owen accurately articulates Galen Strawson's "Basic Argument." It is a coherent metaphysical claim: if your actions flow from your character, and you didn't choose your character, you aren't *ultimately* responsible. It's not "true" in an objective sense (since free will is unresolved), but it is philosophically sound within its framework.

  **Move 2 (Lucia): Score 0**
  This is an appeal to consequences (or a Moorean shift). Saying a conclusion is "too big a bullet to bite" doesn't make it false, just unpalatable. While practically useful, it doesn't engage with Owen's metaphysical logic, so it stalls the debate rather than advancing it.

  **Move 3 (Owen): Score 2**
  Owen correctly identifies that Compatibilists usually reject the requirement for "ultimate" responsibility. He lays out the regress problem clearly: to choose your character, you'd need a prior character to choose with. Logically, this is the strongest version of the hard incompatibilist position.

  **Move 4 (Lucia): Score 1**
  This is the "Argument from Reason" or self-defeat objection. It's a clever trap: if all thoughts are determined, why trust this one? However, it risks the genetic fallacy (confusing the cause of a belief with its validity), which weakens it slightly as a logical refutation, even if it's rhetorically effective.

  **Move 5 (Owen): Score 2**
  Owen makes a crucial epistemological distinction: the *causal history* of a belief doesn't determine its *truth value*. A calculator is determined to give the right answer, but the answer is still right. This successfully deflects the self-defeat charge in Move 4.

  **Move 6 (Lucia): Score 2**
  This is the strongest move in the exchange. Lucia spots an asymmetry: if causal determination doesn't undermine *epistemic* norms (truth/justification), why does it undermine *moral* norms (praise/blame)? This forces Owen to explain why reasoning survives determinism but morality doesn't, which is a difficult tension for naturalists to resolve.

  **What They're Both Missing**
  They are talking past each other on the definition of "control." Owen assumes responsibility requires *metaphysical* freedom (being an uncaused cause), while Lucia assumes it requires *functional* freedom (acting according to your desires without coercion). They miss the Compatibilist middle ground: that "desert" isn't about metaphysics, but about whether a person is responsive to reasons and social norms. Owen ignores that praise *changes* future behavior (making it useful), and Lucia ignores that our intuition of "ultimate" desert might just be an illusion we can't shake.
