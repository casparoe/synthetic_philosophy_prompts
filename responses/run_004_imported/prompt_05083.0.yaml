  2.  **Analyze the Norms:**
      *   (1) Knowledge Norm (KN): Assert $p$ only if you know $p$. (Williamson)
      *   (2) Truth Norm (TN): Assert $p$ only if $p$ is true.
      *   (3) Justified Belief Norm (JBN): Assert $p$ only if you are justified in believing $p$.
      *   (4) Belief Norm (BN): Assert $p$ only if you believe $p$.

  3.  **Analyze the Cases:**
      *   (i) **Lottery Case:** True, justified belief (statistical), but intuitively improper to assert before announcement.
          *   KN: Predicts improper (no knowledge). -> Matches intuition.
          *   TN: Predicts proper (it is true). -> Mismatches intuition.
          *   JBN: Predicts proper (justified). -> Mismatches intuition.
          *   BN: Predicts proper (believed). -> Mismatches intuition.
      *   (ii) **Selfless Assertion (Lackey):** Teacher asserts evolution (true, justified) but doesn't believe it.
          *   KN: Predicts improper (no knowledge if knowledge requires belief). -> Mismatches intuition (assertion seems proper/professional). *Note: Some argue she knows, but standard Lackey setup implies no belief thus no knowledge.*
          *   TN: Predicts proper (true). -> Matches intuition.
          *   JBN: Predicts proper (justified). -> Matches intuition.
          *   BN: Predicts improper (no belief). -> Mismatches intuition.
      *   (iii) **Gettier Case:** True, justified, no knowledge (luck).
          *   KN: Predicts improper (no knowledge). -> Matches intuition (usually considered improper to assert Gettiered propositions).
          *   TN: Predicts proper (true). -> Mismatches intuition.
          *   JBN: Predicts proper (justified). -> Mismatches intuition.
          *   BN: Predicts proper (believed). -> Mismatches intuition.
      *   (iv) **Expert Witness/Statistical Evidence:** DNA match statistic (high prob), true, justified, but often considered insufficient for knowledge/assertion without individualized evidence (similar to lottery).
          *   KN: Predicts improper (statistical evidence often deemed insufficient for knowledge). -> Matches intuition.
          *   TN: Predicts proper (true). -> Mismatches intuition.
          *   JBN: Predicts proper (justified). -> Mismatches intuition.
          *   BN: Predicts proper (believed). -> Mismatches intuition.

  4.  **Evaluate Defensibility:**
      *   **Knowledge Norm (KN):**
          *   Pros: Handles Lottery (i), Gettier (iii), Expert Witness (iv) perfectly. These are the classic arguments *for* KN.
          *   Cons: Struggles with Selfless Assertion (ii). Requires explaining away the intuition that the teacher is doing nothing wrong (e.g., she *does* know, or the assertion is excusable but not permissible).
          *   Overall: Generally considered the front-runner in contemporary literature (Williamson, etc.) despite the Lackey challenge.
      *   **Justified Belief Norm (JBN):**
          *   Pros: Handles Selfless Assertion (ii).
          *   Cons: Fails Lottery (i), Gettier (iii), Expert Witness (iv). These are the classic arguments *against* JBN (too weak).
          *   Overall: Strong contender, but lottery/Gettier cases are usually seen as decisive against it.
      *   **Truth Norm (TN):**
          *   Pros: Handles Selfless Assertion (ii).
          *   Cons: Fails Lottery (i) (if true), Gettier (iii), Expert Witness (iv). Also violates the "ought implies can" principle often (you can't always know if it's true).
          *   Overall: Generally considered too weak and externalist in a way that disconnects from the speaker's perspective.
      *   **Belief Norm (BN):**
          *   Pros: Simple.
          *   Cons: Fails Lottery (i), Gettier (iii), Expert Witness (iv), and Selfless Assertion (ii). It's too weak (allows false beliefs) and too strong (blocks selfless assertion).
          *   Overall: Generally considered the least defensible among serious candidates.

