      *   3: Truth Norm. It permits selfless assertion but incorrectly validates lucky true assertions and violates the requirement that norms be within the speaker's cognitive grasp.
      *   4: Belief Norm. It is too permissive regarding false beliefs and too restrictive regarding selfless assertion, failing to match intuitions across almost all provided cases.

