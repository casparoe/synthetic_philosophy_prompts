      *   **2nd:** Justified Belief Norm. It captures the internalist intuition and handles Selfless Assertion, but falls to the Lottery/Gettier cases which are widely regarded as showing justification isn't enough.
      *   **3rd:** Truth Norm. It handles Selfless Assertion but fails the Lottery/Gettier cases and faces the "ought implies can" objection (you can't obey it if you don't know the truth).
      *   **4th:** Belief Norm. Too permissive (allows asserting false things you believe) and too restrictive (blocks Selfless Assertion). Fails almost all the specific test cases provided.

