      *   *Draft 1 (Knowledge):* The knowledge norm best explains the impropriety of lottery and Gettier assertions while offering plausible explanations for selfless assertion cases via excusability or contextualist knowledge attributions.
      *   *Draft 2 (Justified Belief):* Justified belief handles selfless assertion well but fails to explain why assertions based on mere statistical evidence or Gettierized beliefs feel intuitively improper.
      *   *Draft 3 (Truth):* The truth norm avoids restricting selfless assertion but collapses because it permits asserting lucky truths and violates the principle that norms must be followable by the speaker.
      *   *Draft 4 (Belief):* The belief norm is the weakest because it permits asserting false propositions and forbids professionally responsible selfless assertions, failing every test case except standard believable truths.

      *Refining for brevity and punchiness:*
