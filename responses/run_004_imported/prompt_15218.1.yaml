answer: |-
  This is a classic "peer review dilemma." You want to be supportive of your friend, but you also want to be accurate so you both learn (and so you don't get in trouble if the teacher checks your grading logic).

  Your friend's answer is **statistically intuitive but terminologically flawed.** She understands the *math* and the *conclusion* perfectly, but she misidentifies the *type of variable*, which is the core concept of this specific unit. In AP Stats, distinguishing between a **confounding/lurking variable** and a **mediating variable** is a key learning objective.

  Here is a fair, defensible grade breakdown that rewards her logic but penalizes the vocabulary error.

  ### **Grade: 17 / 20 (B+)**

  ### **JSON Rubric**
  ```json
  {
    "assignment": "Simpson's Paradox Written Response",
    "total_points": 20,
    "score": 17,
    "breakdown": [
      {
        "category": "Identification of Phenomenon",
        "points_possible": 2,
        "points_earned": 2,
        "comment": "Correctly identifies Simpson's Paradox immediately."
      },
      {
        "category": "Data Evidence (Subgroups)",
        "points_possible": 4,
        "points_earned": 4,
        "comment": "Accurately cites the 75% vs 65% and 95% vs 85% comparisons."
      },
      {
        "category": "Data Evidence (Aggregate)",
        "points_possible": 2,
        "points_earned": 2,
        "comment": "Correctly notes the reversal in the total rates (81% vs 79%)."
      },
      {
        "category": "Explanation of Imbalance",
        "points_possible": 6,
        "points_earned": 6,
        "comment": "Excellent explanation of why the totals are misleading (Program A took more struggling students)."
      },
      {
        "category": "Statistical Terminology (Confounder vs. Mediator)",
        "points_possible": 4,
        "points_earned": 1,
        "comment": "Major error: Calls starting ability a 'mediating variable.' It is a confounder/lurking variable. A mediator is caused by the treatment; starting score exists before the program. Deducted heavily here as this is the unit's core concept."
      },
      {
        "category": "Conclusion & Lesson",
        "points_possible": 2,
        "points_earned": 2,
        "comment": "Recommendation (Program A) is correct based on the subgroup data. General lesson on splitting data is accurate."
      }
    ]
  }
  ```

  ### **Feedback Breakdown (What to tell her)**

  If you write this in pen on her paper, keep it constructive. Here is a script you can adapt:

  **The Good Stuff (Write this first):**
  > "You nailed the hard part! Your identification of Simpson's Paradox is perfect, and your explanation of *why* the totals are misleading (the imbalance of struggling vs. strong students) is exactly what the teacher is looking for. Your final recommendation to pick Program A is 100% correct because you controlled for the subgroups."

  **The Correction (The reason for the point deduction):**
  > "I had to deduct a few points on the **Statistical Terminology** section. You referred to 'Starting Ability' as a *mediating variable*, but in this unit, it is classified as a *confounding* (or lurking) variable.
  >
  > *   **Confounder:** Exists *before* the study and affects both group selection and results (This is what Starting Ability is).
  > *   **Mediator:** Is caused *by* the treatment and then affects the result (e.g., if the Program *improved* the ability, which then improved the score).
  >
  > Since the diagnostic score happens 'going in,' it can't be a mediator. You did use the term 'lurking variable' correctly in the next sentence, so you clearly get the concept, but make sure to stick with 'confounder/lurking' on the test to be safe!"

  ### **Why this grade is fair (For your peace of mind)**

  1.  **Logic vs. Vocab:** She gets full credit for the logic (14/14 points on logic/math). This shows you aren't being mean; you value her understanding of the situation.
  2.  **Unit Focus:** The prompt says the class just wrapped up the unit on **confounding/lurking variables**. If she calls it a "mediating variable," she is technically using the wrong vocabulary for the unit. In AP Stats, vocab is usually worth specific points.
  3.  **Contradiction:** She calls it a "mediating variable" in one sentence and a "lurking variable" in the next. These are mutually exclusive definitions. Pointing this out helps her avoid losing points on the actual exam.

  **Final Verdict:** Give her the **17/20**. It signals "This is an A-quality understanding with a B-quality vocabulary slip." If she argues, you can show her the definition of a mediator vs. confounder—it's an objective statistical fact, not an opinion!
