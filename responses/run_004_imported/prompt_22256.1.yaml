  My mom's been seeing a naturopath for her chronic back pain for a couple years now (acupuncture, weird supplements, the whole nine yards) and says it's basically given her life back - less pain, sleeping way better, feels like a new person. My brother, who's doing his medical residency, thinks this is nuts since none of it has ever held up in an actual clinical trial, and he says feeling better isn't the same thing as something actually being true. I see where both of them are coming from but cant tell whos actually right here, or if theyre even disagreeing about the same thing.
