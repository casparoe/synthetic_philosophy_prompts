answer: |-
  The rain against the hospital window sounded like static, a white noise filling the silence between Sarah and the man sitting in the plastic chair. He wore the same flannel shirt he'd vanished in five years ago, though the fabric was frayed now, stained with salt and something darker. He held his hands clasped, staring at the knuckles. There was a scar on the left index finger, white and jagged, from a kitchen knife slip in 2018. Sarah remembered the blood on the linoleum. She remembered stitching it herself.

  The man looked up. His eyes were the same hazel, flecked with gold near the pupil. But the eyes held a hesitation she didn't recognize.

  "The doctor says the window is closing," Sarah said. Her voice sounded thin in the corridor. "Leo needs the transplant within forty-eight hours. You're a match. The blood work proves it."

  "The blood work proves I'm similar," the man said. He didn't sound like Elias. Elias's voice had a gravelly warmth; this voice was flat, careful. "DNA isn't a name, Sarah. It's just code."

  "The bank didn't care about the difference," Sarah snapped, the exhaustion finally cracking her composure. "When you walked into the branch yesterday, they froze the accounts. They said Elias Thorne is deceased. They said you're a John Doe with his face."

  "Because I am."

  "No." Sarah stepped closer, invading the space between the chairs. She wanted to shake him, to rattle the bones until they sounded like the man she'd mourned. "You know where the spare key is hidden. You know what I whispered to you on the boat before the engine failed. You know the scar on my hip."

  "I know those things," he admitted. He looked down at his hands again. "I remember them happening. But I remember them happening to *him*. To the Elias who went out on the water in this world. I woke up on a shore three days ago, in a place where the sky is a different shade of violet. I walked until I found a door that led here. I'm not him. I'm the person who looks like him."

  Sarah gripped the clipboard on her lap. The consent form for the bone marrow harvest was clipped to the top. Below the medical jargon, there was a line for *Legal Guardian/Next of Kin*. It required a signature. It required authority.

  "If you sign that," Sarah said, tapping the paper, "you are accepting liability. You are accepting that you are the father of that boy in there. If you sign as Elias Thorne, and you are legally a stranger, it's fraud. The hospital could void the procedure. They could sue us."

  "Then don't let me sign."

  "Leo needs his father's consent for the anesthesia risk. I have sole custody because Elias is dead. If Elias is alive, I don't have sole custody. If you are Elias, you have the right to say no to the risk. If you are a stranger, you have no right at all." She leaned in, her voice dropping to a whisper. "But if you are a stranger, you can't be held responsible for the debt either. The mortgage. The loans. The insurance claim we collected to keep the house. If you are Elias, the insurance company wants their money back. They want everything back. If you are a stranger, you walk away clean. You can leave. You can go find that violet sky."

  The man flinched. It was a small movement, but Sarah saw it. The mention of the debt was the gravity well. It was the anchor.

  "I don't want the debt," he said.

  "I know."

  "I don't want the house."

  "I know."

  "I don't want to be responsible for a life I didn't choose to begin." He looked toward the door where Leo lay sleeping, hooked to machines that beeped in a rhythmic, fragile tempo. "In my world... I didn't have a son. I never met you. I was alone."

  Sarah felt a coldness spread through her chest, colder than the rain outside. "So you're saying you're just a visitor. A tourist in a life that isn't yours."

  "I'm saying I'm not him."

  "Leo doesn't care about metaphysics," Sarah said, her voice trembling. "He wakes up screaming for his dad. He doesn't dream about a counterpart. He dreams about you. When you walked in here yesterday, he didn't ask who you were. He asked why you were late."

  She unclipped the pen from the clipboard and held it out. The plastic was cheap, blue, disposable.

  "If you sign," she said, "you owe everything. The bank, the insurance, the court. You inherit the mess. You inherit the grief I've lived for five years. You inherit the guilt of leaving us."

  "And if I don't?"

  "Then Leo waits for another donor. Maybe one comes. Maybe it doesn't. And you walk away with clean hands. You're free."

  The man looked at the pen. He looked at the scar on his finger, the white line that matched the memory of the knife. He looked at Sarah, really looked at her, seeing the lines of stress around her mouth, the gray in her hair that hadn't been there when he left.

  "Humphrey," he said suddenly.

  "What?"

  "Nothing." He shook his head. "I just... I keep thinking about how much it hurts. Here." He pressed a hand to his chest. "If I'm just a copy, why does it hurt? Why do I feel guilty for a debt I didn't sign? Why do I feel like I'm abandoning a child I never knew?"

  "Because you're him," Sarah said. "Not because you look like him. Because you carry the weight."

  She placed the pen in his hand. His fingers closed around it. The warmth of his skin was familiar. It was the temperature of the man who had held her on their wedding night, the man who had held Leo when he was born.

  "The insurance will take the house," Sarah warned. "We'll have to move. We'll have to start over."

  "We?" he asked.

  "If you sign," she said. "It's us. If you don't, it's just me."

  The hallway lights flickered. The beep of the monitor inside the room seemed to speed up, or maybe it was just Sarah's heart.

  The man looked at the line on the paper. *Elias Thorne*.

  If he wrote the name, he was claiming a history that wasn't technically his. He was claiming a continuity of identity that physics might deny. He was saying that a person is not just a collection of atoms in a specific location, but a thread that can weave through impossible spaces and still remain the same thread. He was saying that obligation binds tighter than reality.

  He uncapped the pen.

  "I'm not doing it for the debt," he said.

  "I know."

  "I'm not doing it for the house."

  "I know."

  He lowered the pen to the paper. The ink flowed, dark and permanent. He didn't hesitate on the signature. He didn't write *John Doe* or *Counterpart*. He wrote the name that bound him to the mortgage, to the marriage license, to the birth certificate, to the grave marker that was currently empty because the body had never been found.

  *Elias Thorne.*

  He capped the pen and set it down. The sound was final, like a gavel strike.

  "They'll come for the money," he said, his voice heavier now, grounded.

  "Let them come," Sarah said, taking the clipboard from him. Her hand brushed his, and she didn't pull away. "We'll deal with it. Together."

  She turned to the door, the form clutched against her chest like a shield. She didn't look back to see if he followed. She didn't need to. The signature on the page was a promise, and promises only hold if the person making them is the same person who broke the last one.

  She opened the door to the room. The machines beeped on, steady and sure. Behind her, the chair scraped against the floor as he stood up. He was coming. He was coming home.
