      3.  Base it on "Functional Impairment" (Nordenfelt-lite).
      4.  Address the "Medicalization of Normality" risk (Boorse) by requiring psychosocial documentation.

  7.  **Final Review against Prompt:** "I want it to take the strongest objection from the losing side seriously."
      *   If I recommend Approval, the Losing Side is the Denial (Boorse). Their strongest objection is: "This turns social preferences into medical necessities and drains resources from the truly sick."
      *   I must show how my conditions prevent that.

      *Let's write it.*

      *Wait, one nuance:* The prompt asks for "one of three outcomes." I will choose **Approve Subject to Specific Conditions**. This allows for the most robust engagement with both philosophical positions.

      *Structure:*
