answer: |-
  **Setting:** *A quiet corner of the university faculty lounge. It's late afternoon. Elias (Epistemicist) is grading papers; Sarah (Supervaluationist) is staring into a mug of tea.*

  **Sarah:** You're still thinking about it, aren't you? The hair count.

  **Elias:** *(Without looking up)* 5,432.

  **Sarah:** *(Laughs)* See, that's exactly the problem. You just pulled a number out of thin air. If I asked you to justify why a man with 5,432 hairs is bald but a man with 5,433 is not, you couldn't do it. Not even in principle.

  **Elias:** I don't need to justify the specific number to justify the *existence* of the number. That's the distinction you keep glossing over, Sarah. My inability to identify the cutoff doesn't entail the cutoff's non-existence. It entails my ignorance.

  **Sarah:** But it's not just ignorance, Elias. It's indeterminacy. Look, on supervaluationism, "bald" is true of a guy if he's bald on *all* admissible precisifications of the term. It's false if he's bald on *none*. But for the guy in the middle—the penumbral case—he's bald on some precisifications and not on others. So, there is no fact of the matter. It's not that we don't know; it's that the world + language hasn't settled it.

  **Elias:** And that's where you break classical logic. If there's no fact of the matter, then for that middle guy, "He is bald or he is not bald" fails to be true. You're rejecting bivalence. You're saying the Law of Excluded Middle doesn't hold for vague predicates. That is a massive cost. I'm willing to swallow the counter-intuitive pill of a sharp cutoff to save the foundation of logic. You're burning down the house to keep the furniture arranged nicely.

  **Sarah:** I'm not burning down the house; I'm renovating. We preserve classical logic for *precise* statements. "Bald" is super-true if it's true on all precisifications. The tautologies hold. But you're missing the arbitrariness objection. Let's grant, for argument's sake, that there is a sharp cutoff. What *fixes* it? Is it a metaphysical fact? A semantic fact? If usage determines meaning, and our usage is clearly tolerant—meaning we treat 5,432 and 5,433 the same—how does the language suddenly snap from "bald" to "not bald" at exactly one hair?

  **Elias:** Usage fixes it, but usage is messy. Think of reference magnetism. The word "bald" is trying to latch onto a property in the world. There are physical facts about hair density, light reflection, social perception. All of those facts supervene on the physical state. There is a specific configuration of particles where the cluster of properties we associate with "baldness" ceases to apply. It might be chaotic, it might shift slightly depending on context, but at any fixed context, there is a boundary. The fact that we can't calculate it doesn't mean it isn't there.

  **Sarah:** Okay, but now let's push to higher-order vagueness. This is where your view really starts to bleed. You say there's a sharp boundary between the bald and the non-bald. Fine. Is there a sharp boundary between the *definitely* bald and the *borderline* cases?

  **Elias:** Yes.

  **Sarah:** And a sharp boundary between the *definitely borderline* and the... what? The vaguely borderline?

  **Elias:** If you want to put it that way. There is a boundary between cases where "bald" is definitely true and cases where it is not definitely true.

  **Sarah:** But Elias, "definitely" is vague! "Sharp cutoff" is a vague notion. If you say there's a precise number where "bald" stops applying, you now need a precise number where "the precise cutoff" stops applying. You've just pushed the Sorites back a level. You now have a Sorites series for the location of the boundary. Are you committed to an infinite hierarchy of sharp boundaries?

  **Elias:** I am. And I don't see the problem.

  **Sarah:** You don't see the problem? It's absurd on its face. It implies that for every level of higher-order vagueness, there is a magical hair count that demarcates it. It makes the semantics of natural language look like a digital computer running on analog hardware. It violates the phenomenology of how we experience vagueness. We don't experience a series of sharp jumps; we experience a fade.

  **Elias:** Phenomenology is a guide to psychology, not metaphysics. Just because the fade *feels* smooth doesn't mean the underlying reality is. Think about a digital image that looks like a smooth gradient. Zoom in enough, it's pixels. You're insisting the image must be ontologically smooth because it looks smooth to the naked eye. I'm saying the pixels are there, we just lack the resolution to see them.

  **Sarah:** But with the image, we *can* zoom in. With "bald," you're saying we *cannot* zoom in. Not just practically, but in principle. That's the margin-for-error move, right?

  **Elias:** Exactly. Knowledge requires safety. To know that a man with $n$ hairs is bald, you must be in a position where you couldn't easily be wrong. But if $n$ is near the boundary, a difference of one hair could make you wrong. Since you can't discriminate one hair visually, you can't satisfy the margin-for-error principle near the boundary. Therefore, the boundary is unknowable. That explains the "fade" without positing indeterminacy. The fade is the erosion of knowledge, not the erosion of truth.

  **Sarah:** Here's the rub with that, though. If I can't know the boundary, can I be said to possess the concept? If part of understanding "bald" is knowing its extension, and the extension has a sharp edge I'm blind to, in what sense do I mean the same thing by "bald" as you do?

  **Elias:** You mean the same thing because you're embedded in the same linguistic community with the same causal interactions with the world. We both latch onto the same property. The fact that the property has a sharp edge we can't locate doesn't change the property.

  **Sarah:** But on supervaluationism, we don't need to locate the edge to use the term correctly. I can say "A man with 10 hairs is bald" and that's super-true. I can say "A man with 10,000 hairs is not bald" and that's super-true. I can say "A man with 5,000 hairs is bald" and that's neither true nor false. This captures our actual linguistic behavior. We hesitate. We say "kind of." You have to say we're just ignorant. But when I hesitate, I'm not expressing ignorance of a fact; I'm expressing that there *is* no fact.

  **Elias:** But if there's no fact, what are you hesitating *about*? If I ask, "Is he bald?" and you say, "Well, it's indeterminate," I ask, "So, is the proposition 'He is bald' true?" You say no. "Is it false?" You say no. So what is it? A truth-value gap?

  **Sarah:** It's a gap in the world-language fit.

  **Elias:** Which collapses into saying the proposition lacks a truth value. And if $P$ lacks a truth value, then $P \lor \neg P$ is not true. You've lost Excluded Middle. You've lost proof by contradiction for vague terms. You can't reason classically about hair. I can. My logic works everywhere. Your logic works only when the precisifications align.

  **Sarah:** I preserve classical logic for the *determinate* cases, which is 95% of usage. You preserve classical logic at the cost of making language metaphysically monstrous. You're positing magic boundaries fixed by... what? Cosmic chance? If usage is tolerant, and the world is continuous, where does the precision come from? It feels like you're positing a hidden variable in semantics.

  **Elias:** It's not a hidden variable; it's a complex function of usage and world. Look, Sarah, consider the alternative. If you're right, then there are two men, identical down to the atom, side by side. One has 5,432 hairs, one has 5,433. On your view, it could be that for *every* admissible precisification, the first is bald and the second is not. Or, on some precisifications, the first is bald and the second is bald. But if you admit there is *no* precisification where the first is not-bald and the second is bald, you've admitted a sharp cutoff exists across the set of precisifications!

  **Sarah:** *(Pauses)* That's the "penumbral connection" argument. You're saying that even across precisifications, the ordering must be preserved.

  **Elias:** Precisely. If "bald" is sensitive to hair count, any admissible precisification must respect the ordering. You can't have a precisification where 5,000 hairs is bald but 4,999 is not. So, across the set of all precisifications, there is a range where truth value shifts. But if the shift happens across the set, there must be a point where *all* precisifications say "bald" and a point where *not all* do. That transition point is your sharp boundary, even in supervaluationism. You haven't escaped the cutoff; you've just hidden it in the meta-language.

  **Sarah:** *(Taps her mug)* That's a strong point, I'll give you that. The boundaries of the "super-true" region are themselves sharp. But here's my counter: That meta-boundary is not part of the object language. It's a fact about our semantics, not a fact about the man's head. The epistemicist says the fact is about the *man*. I say the fact is about the *word*.

  **Elias:** But the word applies to the man. If the fact is about the word, and the word is vague, then the fact is... vague?

  **Sarah:** No, the fact about the word is precise. The set of admissible precisifications is a precise set. It's just that the set contains multiple options.

  **Elias:** And what determines the set? What makes a precisification "admissible"?

  **Sarah:** Linguistic competence. Rules of use.

  **Elias:** And are those rules sharp? Is there a sharp boundary between a competent speaker and an incompetent one?

  **Sarah:** *(Smiles)* Ah. Now you're trying to Sorites me on competence.

  **Elias:** It's the only move I have! If competence is vague, then the set of admissible precisifications is vague. If that set is vague, then "super-truth" is vague. And if super-truth is vague, you have higher-order vagueness again. And if you have higher-order vagueness, you need a boundary for *that*. Eventually, Sarah, you either accept a sharp boundary somewhere, or you accept that logic dissolves entirely. I choose the boundary.

  **Sarah:** And I choose to live with the dissolution at the margins because it respects the nature of the concept. Look, Elias, imagine we find a planet where the inhabitants have no concept of numbers, only "few" and "many." They look at a pile of sand. Is there a sharp cutoff between few and many grains on that planet?

  **Elias:** If they use the terms to refer to objective quantities, yes.

  **Sarah:** But their usage is explicitly tolerant! They would never count. They would slap your hand if you tried to count. Their practice *rules out* a sharp cutoff. In that case, positing a sharp cutoff isn't saving logic; it's imposing an alien structure on their form of life. "Bald" is like that. It's a practice of not counting. By insisting there's a number, you're violating the practice.

  **Elias:** I'm not violating the practice; I'm analyzing the conditions of its success. The practice works *because* we don't encounter the boundary often. We don't count hairs. We look. The margin-for-error principle explains *why* the practice works without counting. We stay far away from the boundary. The fact that the boundary exists doesn't disrupt the practice, it explains why the practice is safe. We stay in the safe zone.

  **Sarah:** But you can't define the safe zone! That's the higher-order vagueness again. How far is "far away"?

  **Elias:** There is a distance. We don't know it. But there is one.

  **Sarah:** *(Sighs)* You're like a wall. "There is a fact, we just can't know it."

  **Elias:** And you're like smoke. "There's no fact, so we don't need to know it."

  **Sarah:** *(Laughs)* Fair. Look, I think the stalemate comes down to this: I prioritize the intuition that meaning is grounded in use, and use is tolerant. You prioritize the intuition that reality is determinate and logic is universal.

  **Elias:** Correct. I'd rather believe in magical hair counts than give up Excluded Middle.

  **Sarah:** And I'd rather give up Excluded Middle for penumbral cases than believe in magical hair counts.

  **Elias:** *(Closes his gradebook)* Well. At least we agree the guy with 10 hairs is bald.

  **Sarah:** Super-true.

  **Elias:** True.

  **Sarah:** *(Stands up)* See you at the seminar, Elias. Try not to count anyone's hairline.

  **Elias:** Only if you promise not to call it "indeterminate" when I'm clearly balding.

  **Sarah:** No promises. It depends on the precisification.

  *(Sarah exits. Elias looks at his reflection in the darkened window, touches his hairline, and frowns.)*
