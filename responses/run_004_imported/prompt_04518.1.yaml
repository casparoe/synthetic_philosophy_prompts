prompt: |-
  So I've been falling down a Schopenhauer rabbit hole for a piece I'm writing on why music seems to hit people so much more directly than other art forms. I get that he ranked music above painting, poetry, even tragedy, but I'm hazy on the actual mechanics of why. Something about how every other art is a copy of the Platonic Ideas, which are themselves just the Will objectified, wheras music somehow skips that whole step and counts as a direct copy of the Will itself, no middleman involved? Could you actually unpack what work that "skipping" move is doing, and why it's supposed to make music's effect so much more powerful, rather than just hand-waving toward "music = pure emotion, man"? Also, here's the bit I can't square: he seems to want "pure" instrumental music with no story attached as the real deal. So what happens to the theory once you get to program music, stuff that's explicitly trying to depict a thunderstorm, or a march to the scaffold? Does that break it, or is there a standard fix philosophers reach for?
