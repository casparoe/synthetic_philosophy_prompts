answer: |-
  This is a classic debate in contemporary philosophy of logic, and Priya has deployed what is known as the **Shapiro-Ketland Conservativeness Argument**. It is widely considered the strongest objection to deflationism. She is mathematically correct: if you add a compositional truth theory to Peano Arithmetic (PA) and allow induction over the truth predicate, the resulting system is non-conservative (it proves Con(PA)).

  However, she is philosophically vulnerable on *why* that matters. The deflationist does not need to deny the math; they need to deny the inference from "non-conservative" to "substantive metaphysical property."

  Here is the strongest possible deflationist comeback, structured to give you the vocabulary and the argumentative arc to take back to her.

  ### 1. The Core Pivot: Conservativeness is the Wrong Metric
  Priya's argument relies on a hidden premise: **A logical device is only "thin" if it is conservative.**
  The deflationist comeback is to reject this. Conservativeness is a proof-theoretic property; deflationism is an *ontological* thesis.

  Deflationism claims that "truth" does not name a robust, causal, or explanatory property in the world (like "mass" or "charge"). It does *not* claim that adding the word "true" to a language is logically inert.
  *   **The Argument:** Logical tools often expand what you can prove without committing you to new *objects*.
  *   **Example:** If I add a symbol for "exponentiation" to a theory of arithmetic that only had addition and multiplication, I can prove new things faster or more elegantly. Does that mean exponentiation is a "substantive metaphysical property"? No, it's just a functional expansion of the language.
  *   **Application:** Truth allows us to express *infinite conjunctions* (e.g., "All theorems of PA are true"). The fact that this allows us to prove Con(PA) shows that truth is *useful*, not that it is *substantive*.

  ### 2. The "Implicit Commitment" Argument (The Heavy Hitter)
  This is the specific response to the Con(PA) problem. It addresses your intuition about the difference between "new facts about numbers" and "consistency statements."

  **The Argument:**
  When you accept PA as a correct theory of arithmetic, you are not just accepting the axioms; you are implicitly accepting that the axioms are *sound*. If you believe the axioms are sound, you logically must believe they are consistent. Therefore, any rational agent who accepts PA *already* accepts Con(PA).

  **The Role of Truth:**
  PA cannot *express* Con(PA) within its own language (due to Gödel). It lacks the vocabulary to talk about its own provability.
  *   The truth predicate provides the vocabulary to express what you **already believed**.
  *   Adding truth doesn't give you *new* mathematical commitments; it gives you the **reflective capacity** to articulate your existing commitments.

  **The Analogy:**
  Imagine you believe "All swans are white." You see a bird in the distance. You believe "That bird is white."
  If I give you a telescope (the truth predicate), you can now *see* and verify that the bird is white. The telescope didn't change the color of the bird (the math), and it didn't change your belief (you already thought it was white). It just allowed you to extend your vision to a distance your naked eye (PA) couldn't reach.
  Priya is arguing that because the telescope lets you see something you couldn't see before, the glass must be made of "substantive metaphysical material." The deflationist says: "No, the glass is thin; it just lets me see what was already there."

  ### 3. Distinguishing Ontological Weight from Proof-Theoretic Strength
  You mentioned you felt there was a difference between "new proof-theoretic muscle" and "new substantive facts." Here is the vocabulary to formalize that intuition:

  *   **Ontological Commitment:** Does using this concept force me to believe in a new *kind of thing* existing in the universe? (e.g., Does "truth" exist like an electron exists?)
  *   **Proof-Theoretic Strength:** Does adding this concept allow me to derive more sentences?

  **The Deflationist Move:**
  Deflationism is a thesis about **Ontological Commitment**, not Proof-Theoretic Strength.
  Priya is conflating the two. She is arguing:
  1.  Truth theories have high Proof-Theoretic Strength (they prove Con(PA)).
  2.  Therefore, Truth has high Ontological Commitment (it is a substantive property).

  The deflationist denies step 2. We can have high Proof-Theoretic Strength with zero Ontological Commitment.
  *   **Why?** Because the "strength" comes from the **Induction Schema**, not the Truth predicate itself.
  *   When we add truth to PA, we usually extend the induction schema to include formulas with the truth predicate. *That* is where the power comes from.
  *   The deflationist argues that extending induction is a logical rule, not a metaphysical discovery. We are just applying the same logical rule (induction) to a slightly richer language. That doesn't make "truth" a heavy property; it makes "induction" a powerful rule.

  ### 4. The "Price of Admission" Counter-Challenge
  To really put Priya on the defensive, turn the burden of proof around.

  If Priya insists that truth must be conservative to be deflationary, she forces deflationism to be **useless**.
  *   A strictly conservative truth theory (one that doesn't allow induction over the truth predicate) cannot prove generalizations like "Everything the Pope said is true." It can only handle finite lists.
  *   If deflationism requires conservativeness, then deflationism cannot account for the primary function of the word "true," which is generalization.
  *   **The Dilemma for Priya:** Either she accepts that truth is non-conservative (and thus her argument kills deflationism), or she accepts that truth is conservative (and thus truth cannot be used for generalization, which is absurd).
  *   **The Solution:** The only way out is to admit that **non-conservativeness is compatible with deflationism**, provided the non-conservativeness arises from logical reflection (implicit commitment) rather than metaphysical discovery.

  ### Summary: Your "Elevator Pitch" to Priya
  Here is how you package this for the next conversation:

  > "Priya, you're right that truth theories are non-conservative over PA. But you're wrong that this kills deflationism. You're conflating **proof-theoretic strength** with **ontological substantivity**.
  >
  > When I accept PA, I implicitly accept that PA is consistent. I just lack the vocabulary to say it. The truth predicate is just the linguistic tool that lets me express my implicit commitment to the soundness of my own axioms.
  >
  > Proving Con(PA) using truth isn't discovering a new fact about numbers; it's making explicit what was already implicit in accepting the numbers in the first place. If you demand that 'truth' be conservative, you're demanding that it be useless for generalization. I'd rather keep a deflationism that works than a conservativeness constraint that breaks the concept."

  ### Recommended Reading (If she asks for sources)
  If she wants to read the actual papers, point her toward:
  *   **Volker Halbach:** *Axiomatic Theories of Truth*. (He argues deflationists can accept non-conservative truth theories).
  *   **Leon Horsten:** *The Tarskian Turn*. (Defends a form of deflationism that accommodates these results).
  *   **Stewart Shapiro:** (This is her side, *Philosophy of Mathematics: Structure and Ontology*, so know she'll cite this).

  The deflationist position survives not by denying the math, but by denying that the math implies metaphysics. Truth is a mirror, not a magnifying glass that creates new objects. It just lets you see the whole room at once.
