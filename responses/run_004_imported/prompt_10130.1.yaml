      *   **Background:** Self-taught philosophy of mind (Wikipedia, SEP, YouTube), no formal training.
      *   **Core Issue:** The Causal Exclusion Argument (Kim's Argument).
      *   **Interpretation:** If physical causes are sufficient, mental causes (thoughts, decisions, willpower) are epiphenomenal (do nothing).
      *   **Emotional Impact:** "Freaked me out," feels like it proves free will/agency is an illusion.
