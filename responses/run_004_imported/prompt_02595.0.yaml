      *   **Paternalism:** Soft vs. Hard. The state enforcing a restriction the individual *asked* for is often called "soft paternalism" or "libertarian paternalism" (nudging), but the *enforcement* against current wishes looks like hard paternalism.
      *   **Autonomy:** Diachronic autonomy (autonomy over time) vs. Synchronic autonomy (autonomy at a specific moment). Ulysses pacts.
      *   **Personal Identity:** Is the 40-year-old the "same person" as the 25-year-old? (Locke, Parfit).
      *   **Commitment/Contract:** The moral weight of voluntary agreements, especially those designed to limit future freedom.
      *   **Administrative/Rule Utilitarianism:** The systemic cost of making exceptions.

  3.  **Evaluate the Friend's Claim (The Autonomy/Change Argument):**
