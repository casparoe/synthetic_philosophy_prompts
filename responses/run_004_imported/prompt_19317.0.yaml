      *   **The Dummett Reference:** Bring in Michael Dummett. He's the bridge. He loved Frege, then was horrified. What did he do? He didn't throw the books away; he acknowledged the tragedy.
      *   **The Core Argument (The Position):**
          *   Frege's logic seeks purity, universality, and objective truth.
          *   Frege's diary is particular, hateful, and subjective.
          *   *The Position:* We cannot separate them cleanly, but we also don't have to reject the logic. Instead, we read the logic *in the shadow* of the diary. The logic becomes a testament to what he *aspired* to be (rational, universal) versus what he *was*.
          *   Avoid "man of his time." Many contemporaries weren't monsters.
          *   Avoid "guilt by association." The logic doesn't entail the politics.
      *   **The Task for the Weekend:** How does this change the work? It makes it heavier, more human. It requires vigilance.
      *   **Conclusion:** Bring it back to the room. We are here to think *with* him, critically.

  4.  **Drafting - Refining the Tone:**
