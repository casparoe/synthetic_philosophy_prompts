answer: |-
  Good morning. Mara asked me to speak first, I think, because I'm the only person in this room who isn't trying to prove a theorem. I'm a novelist. I've spent the last few years living inside the head of a fictional genius—a man whose public brilliance masked a private monstrosity. So, when Mara told me about the split in this room—the veterans who've compartmentalized Frege, and the newcomers who feel a bit sick finding out the father of modern logic spent his twilight years writing vicious anti-Semitic propaganda and mourning the loss of monarchy—I didn't feel like an outsider. I felt like I'd been preparing for this specific conversation.

  We need to address the question a couple of you have already asked, half-jokingly but entirely seriously: *Are we still allowed to like the* Begriffsschrift?

  The easy answer—the one that gets us to coffee break fastest—is to say that logic is timeless and biography is incidental. That we can put the diary in one drawer and the sense/reference distinction in another. I'm here to suggest that is intellectually dishonest. But the opposite answer—that the poison of the diary seeps into the logic, rendering it suspect—is equally wrong. It lets us off the hook too easily, or it burdens the work with a guilt it doesn't carry.

  So, here is the position I want to offer you for this weekend: We do not read Frege *despite* the diary. We read him *in the shadow* of it.

  Michael Dummett, perhaps the greatest Frege scholar of the last century, faced this crisis when the diaries became public. He didn't look away. He didn't say, "Well, he was a man of his time." As if being a man of that time necessitated hating Jews or despising democracy. Many of his contemporaries didn't. Dummett recognized it for what it was: a tragedy. He saw that a mind capable of such piercing clarity about the structure of truth could be so blind to the humanity of the people around him.

  If we separate the man from the work entirely, we turn Frege into a machine, and we lie about what philosophy is. Philosophy is a human act. It is an aspiration toward universality. And that is where the tension lies. Frege's logic is a project of universal communication, a system where meaning is objective and shareable. Yet, his diary is a record of exclusion, of insisting that some people *do not belong* in the sphere of rational discourse.

  There is a contradiction there. Not a logical contradiction, but a moral one.

  So, are you allowed to love the *Begriffsschrift*? Yes. But your relationship to it has to change. When you read his proofs now, you aren't just admiring a perfect system. You are witnessing a man trying to build a cathedral of pure reason while living in a house of hate. The logic becomes even more precious because it represents what Frege *aspired* to be: rigorous, fair, bound only by the laws of truth. It is his best self, arguing against his worst self.

  If we whitewash the diary, we lose the warning. If we cancel the logic, we lose the tool.

  This weekend, we aren't here to worship Frege. We aren't here to try him in a court of law, either. We are here to do the work he started, but to do it with eyes open. We acknowledge that the tools we are using were forged by a flawed hand. That doesn't break the tools. But it does mean we have to hold them with more care, and more humility, than the generation before us.

  Mara built this workshop to think through Frege. I'm asking you to think through him, too. Don't lock the diary away. Keep it on the desk. Let it make you uncomfortable. Let it remind you that clarity of thought does not guarantee clarity of character. And then, look at the logic again. See if it holds. See if it can carry the weight of the man who wrote it.

  I think you'll find the logic survives. But I hope you leave here understanding that surviving isn't the same as being innocent.

  Thank you, and let's get to work.
