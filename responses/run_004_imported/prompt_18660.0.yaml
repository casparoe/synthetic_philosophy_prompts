answer: |-
  This is a fantastic opportunity. Since you've actually read the text, you're already ahead of 90% of undergrads. The key to interviewing a grad student is to show you understand the *mechanism* of their view, then point out where the gears grind. You want to avoid "What do you think about X?" and instead ask, "How does your view handle X without collapsing into Y?"

  Here are 10 substantive questions (5 main lines of inquiry, each with a prepared follow-up) tailored to the specific objections you mentioned.

  ### 1. The Circularity of the Causal Chain
  **The Setup:** Kripke says we refer to Aristotle not because we know descriptions of him, but because we are linked to him via a chain of communication. But to pass the name along, don't I need to describe the link?

  *   **Question 1:** "In the causal-historical picture, reference is passed from link to link. But when I borrow the name 'Aristotle' from my teacher, isn't my intention effectively descriptive? I'm thinking, 'I want to refer to whoever *my teacher* is referring to.' If every link in the chain relies on a description of the previous link to fix the reference, haven't we just smuggled descriptivism back into the causal chain?"
  *   **Follow-up 1:** "If you say that intention isn't descriptive, how do you distinguish a successful causal link from noise? If I hear a name in a crowd and repeat it without knowing who baptized it, am I referring to the same person, or have I started a new, empty chain?"

  ### 2. The Gödel-Schmidt Case (What exactly dies?)
  **The Setup:** Kripke argues that if Schmidt proved the incompleteness theorem and Gödel stole it, "Gödel" still refers to Gödel, not Schmidt. Descriptivists disagree.

  *   **Question 2:** "Everyone knows the Gödel-Schmidt intuition pump, but I want to pin down what it actually kills. Does this case refute the claim that descriptions are *synonymous* with names, or does it refute the stronger claim that descriptions are used to *fix the reference*? Because a descriptivist could concede synonymy fails but insist we still use descriptions to lock onto the object initially."
  *   **Follow-up 2:** "If they retreat to that position—that descriptions fix reference but aren't synonymous—does your modal argument (about possible worlds) still do the heavy lifting, or does the causal story become independent of the necessity claims?"

  ### 3. The Madagascar Problem (Evans's Objection)
  **The Setup:** Marco Polo heard natives say "Madagascar" referring to the mainland, but he thought they meant the island. The name stuck to the island. There was no "baptism" of the island, just a mistake.

  *   **Question 3:** "Gareth Evans's Madagascar example seems to break the pure causal picture. Polo didn't baptize the island; he misidentified the natives' reference. Yet the name 'Madagascar' successfully shifted to the island through error, not a new causal baptism. Doesn't this suggest that community usage and descriptive identification matter more than the historical chain?"
  *   **Follow-up 3:** "A Kripkean might say a new chain started with Polo. But isn't that ad hoc? If we have to posit a new 'baptism' every time reference shifts due to mistake, doesn't the causal theory lose its explanatory power over the descriptivist cluster view?"

  ### 4. Natural Kinds: Water vs. Jade
  **The Setup:** "Water is H2O" is necessary. But "Jade" refers to two distinct minerals (jadeite and nephrite). If natural kind terms are rigid, how do we handle disjunctive kinds?

  *   **Question 4:** "You defend 'Water is H2O' as a necessary a posteriori truth because water is a unified natural kind. But consider 'Jade.' It turned out to be two distinct minerals, jadeite and nephrite. Is 'Jade' a rigid designator? If it rigidly designates a disjunction, doesn't that weaken the analogy between proper names and natural kind terms?"
  *   **Follow-up 4:** "If you say 'Jade' is just ambiguous and not a real kind term, where do we draw the line? How do we know 'Water' won't turn out to be disjunctive in some future science? Does the rigid designator status depend on the current state of our chemistry?"

  ### 5. Two-Dimensionalism (The Rescue Mission?)
  **The Setup:** Two-dimensional semantics (Chalmers, Jackson) tries to save descriptivism by distinguishing epistemic possibility from metaphysical possibility.

  *   **Question 5:** "Near the end of our reading, we touched on two-dimensional semantics. It seems like this framework allows descriptivists to capture the *epistemic* intuition of Kripke's cases (that 'Water is H2O' feels contingent) without denying the *metaphysical* necessity. Does this effectively rescue descriptivism, making the debate over rigid designation merely verbal?"
  *   **Follow-up 5:** "If two-dimensionalism works, does Kripke's attack on descriptivism only succeed because he conflates the primary intension (how we identify water) with the secondary intension (what water is across worlds)? Is that a fair critique of *Naming and Necessity*?"

  ***

  ### Tips for the Interviewer
  *   **Listen to the "Out":** Grad students are trained to make distinctions. If she says, "Well, it depends on what you mean by 'description'," that's your cue to use the Follow-up to pin her down.
  *   **Don't Fear Silence:** After you ask a hard question, let it sit for a second. It shows you're confident in the question.
  *   **The "We" Frame:** Notice I phrased the questions as "We were struggling..." or "It seems like..." This makes it a club inquiry rather than you vs. her. It lowers the defenses while keeping the pressure on the logic.
  *   **If She Stumps You:** If she gives an answer you don't fully grasp, it's okay to say, "That distinction is new to me; could you give a concrete example of how that works in the Madagascar case?"

  Good luck. If you ask these, you're going to have a hell of a meeting.
