answer: |-
  **Aria:** (Wrapping her cardigan tighter) I know I'm cold. And I know that I know it. The coffee's gone lukewarm, but this chill is immediate.

  **Ben:** (Staring into his mug) Immediate, sure. But look at the sun. It's climbing. In an hour, you'll be warm. You won't be cold anymore.

  **Aria:** Obviously. Thermal states change.

  **Ben:** Gradually, though. There's no snap. No specific second where 'cold' becomes 'not cold.' It's a continuum. Now, suppose you claim to know you're cold at every moment until you don't. There must be a last moment, $t_n$, where you know you're cold, followed by $t_{n+1}$ where you don't feel cold but can't tell the difference.

  **Aria:** So? I know I'm cold now. Why does the future matter?

  **Ben:** Because of KK. If knowing you're cold puts you in a position to know *that* you know it, your access to the state must be robust. But if the change is gradual, your ability to discriminate the state is limited. At $t_n$, you feel almost exactly as you do at $t_{n+1}$. If you believe you're cold at $t_n$, you'd likely believe it at $t_{n+1}$ too, since the feeling is nearly identical. But at $t_{n+1}$, you're wrong.

  **Aria:** You're invoking safety. You think my belief at $t_n$ isn't knowledge because in a nearby possible world—like $t_{n+1}$—I'd be wrong.

  **Ben:** Exactly. Knowledge requires safety. You couldn't easily have been wrong. But since you can't discriminate $t_n$ from $t_{n+1}$, your belief at $t_n$ isn't safe. If you can't tell the difference between feeling cold and not-quite-feeling-cold, you don't know which one you're in.

  **Aria:** That works for external objects. I can't tell if that leaf is moving or if it's a trick of the light. But this isn't external. The feeling *constitutes* the knowledge. I'm not inferring I'm cold from evidence; I'm living it. Why should my inability to discriminate a future state undermine my current access?

  **Ben:** Because reliability isn't suspended for introspection. Your cognitive mechanism for detecting coldness has a margin for error. If the mechanism fires when you're cold, but would also fire when you're barely not cold, it's not reliable enough to yield knowledge in the borderline zones. And if KK holds, you'd have to know you're in the clear zone. But you can't know that, because you can't discriminate the clear zone from the borderline.

  **Aria:** You're assuming knowledge requires discriminability between nearby phenomenal states. I deny that. I can know I'm in pain even if I can't tell this pain from a slightly lesser pain moments later. The presence of the state guarantees the truth of the belief. That's luminosity.

  **Ben:** But luminosity leads to contradiction given gradual change. If you know you're cold, you're in a position to know it. That means you satisfy the safety condition. But safety requires that in nearby cases where you believe you're cold, you *are* cold. Since the change is gradual, there are nearby cases where you believe you're cold but aren't. Therefore, you don't know.

  **Aria:** Maybe the boundary is sharp, even if the feeling isn't. Maybe there *is* a last moment of coldness, and my knowledge cuts off there.

  **Ben:** Then you don't know *where* the boundary is. So you don't know that you know. KK fails. You might know you're cold, but you can't know that you know it, because you can't rule out being in the borderline case where you're wrong.

  **Aria:** (Takes a sip of cold coffee) So you're saying my introspective authority is an illusion because the world changes slowly? That seems like you're letting metaphysics bully epistemology.

  **Ben:** I'm saying knowledge is a factual state, not a phenomenal glow. Facts are sharp; feelings are fuzzy. When you try to map the fuzzy onto the sharp using KK, the map tears.

  **Aria:** Or maybe knowledge is fuzzy too. Maybe "knowing" fades out just like the cold.

  **Ben:** (Smiles) Now you're sounding like me. Knowledge is factive. You can't vaguely know a fact. Either you know or you don't. The sun's winning, Aria. Your cardigan isn't enough.

  **Aria:** (Shifts in her chair) Maybe. But I still know I'm shivering. And I know I'm not convinced.

  **Ben:** That much, at least, is safe.
