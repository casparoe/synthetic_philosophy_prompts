  7.  **Final Polish:** Check against the prompt requirements (move-by-move, who has the better of it, what they are missing). Ensure the advice is actionable for a corporate working group. (The prompt asks for "who has the better of it at each point," so I need to be decisive in each round while maintaining nuance).

