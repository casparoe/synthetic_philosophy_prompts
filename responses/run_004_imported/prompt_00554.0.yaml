  8.  **Finalizing the Verdict:** The verdict will be that coherence arguments establish *pragmatic vulnerability*, not *normative irrationality*. They show that incoherent agents are subsidizers, not that they are logically inconsistent in a way that violates reason itself.

  9.  **Writing the Essay.** (Proceed to generate output based on this plan.)
answer: |-
  **Title:** The Pragmatic Limit of Coherence: Why Dutch Books Do Not Ground Rationality

  **Abstract:**
  Coherence arguments, ranging from classical Dutch Book theorems to modern money-pump scenarios, occupy a central place in the foundations of decision theory. They are frequently invoked to establish Expected Utility Maximization (EUM) not merely as a useful modeling tool, but as a constitutive requirement of rationality. This essay argues that these arguments fail to bear the normative weight often assigned to them. While coherence theorems successfully demonstrate that agents violating axioms like completeness and transitivity are *pragmatically vulnerable* to exploitation in specific institutional contexts, they do not establish that such violations are *irrational*. The decisive consideration is the optionality of trade: rational agents may legitimately refuse transactions that exploit preference incompleteness or dynamic inconsistency. Consequently, coherence arguments should be viewed as diagnostic tools for institutional design rather than foundational norms of agency.

  ***

  ### Introduction

  The allure of coherence arguments in formal epistemology is their promise of a "pragmatic vindication" of rationality. Unlike substantive theories of the good, which must argue for specific ends, coherence arguments appear to derive normative force from the structural requirements of agency itself. The logic is seductive: if your degrees of belief violate the probability calculus, a bookie can construct a Dutch Book against you, guaranteeing a loss. If your preferences violate transitivity or completeness, a money pump can drain your resources. Therefore, to be rational is to be coherent, and to be coherent is to maximize expected utility.

  However, as you have noted in your seminar, this inference from "vulnerable to loss" to "irrational" is increasingly contested. Critics argue that these arguments smuggle in substantive assumptions about the nature of preference, the necessity of trade, and the metrics of value. In this essay, I defend the view that coherence arguments fail to establish EUM as a requirement of rationality. They succeed only in showing that incoherent agents are inefficient in competitive markets where trade is mandatory. The decisive failure lies in the treatment of the **completeness axiom** and the **dynamic structure of choice**. Once we acknowledge that rational agents can refuse trades and adopt resolute choice strategies, the money pump loses its teeth, and the bridge from coherence to rationality collapses.

  ### The Pragmatic Illusion

  To understand where the argument fails, we must first grant where it succeeds. The Dutch Book and money-pump arguments are mathematically sound. If an agent's betting quotients violate the probability axioms, there exists a set of bets that guarantees a loss. If an agent prefers A to B, B to C, but C to A, a series of trades can leave them with their original asset and less money.

  The normative leap occurs when we interpret this guaranteed loss as a marker of *irrationality* rather than mere *misfortune*. The standard defense, articulated by philosophers like David Lewis and Brian Skyrms, is that the loss is "sure" and "foreseeable." A rational agent, knowing the setup, should avoid the state that makes the loss possible. Thus, coherence is framed as a constraint of instrumental rationality: if you want to achieve your ends (whatever they are), you must not sabotage yourself with incoherent preferences.

  However, this defense relies on a hidden premise: that the agent is *compelled* to engage in the series of trades that constitute the pump. The argument assumes that if an agent prefers A to B, they *must* accept a trade from B to A when offered. This is where the coherence argument begins to beg the question against the very incoherence it seeks to prohibit.

  ### The Completeness Objection

  The most vulnerable point in the armor of coherence arguments is the axiom of completeness (the requirement that for any two options A and B, an agent must either prefer A to B, B to A, or be indifferent). In the classical vNM and Savage frameworks, completeness is often treated as a trivial requirement of decision-making: you must choose, therefore you must have a preference.

  But consider the phenomenon of **incommensurability**. As a philosopher, you might face a choice between two career paths: one offering high academic prestige but low pay, the other high social impact but low prestige. It is not obviously irrational to have no determinate preference between these. You might judge them incomparable.

  The money-pump argument against incompleteness runs as follows: If you prefer A to B, but have no preference between B and C, a clever bookie can trade you A for B (since you prefer A), then B for C (since you are indifferent/undecided), and then C for A minus a small fee (since you prefer A to C). You end up with A and less money.

  The flaw here, forcefully argued by recent decision theorists like Johan Gustafsson and Anna Mahtani, is the assumption that "no preference" implies "willingness to swap." If my preference between B and C is incomplete, I am not indifferent; I am *undecided*. A rational response to an offer to swap B for C is not to accept, but to decline. If I can refuse the trade, the pump stops.

  The coherence theorist might reply that refusing the trade is itself a choice that reveals a preference (e.g., a preference for the status quo). But this moves the goalposts. It redefines rationality as "having a complete ordering over all possible status-quo transitions," which is a substantive claim about the structure of value, not a formal requirement of consistency. If it is rational to hold that some goods are incomparable, then it is rational to refuse trades that presuppose comparability. The money pump does not show that incompleteness is irrational; it shows that incompleteness is *expensive* in a market that demands comparability. But why must the rational agent submit to that market?

  ### Dynamic Choice and Resoluteness

  Even if we grant transitivity, coherence arguments face a second, perhaps deeper, hurdle in the realm of dynamic choice. Money pumps often rely on **diachronic inconsistency**. An agent might plan to choose A tomorrow, but when tomorrow comes, their preferences reverse, leading to a suboptimal outcome. The standard EUM solution is **sophisticated choice** (backward induction) or **resolute choice** (sticking to a plan).

  Coherence arguments suggest that to avoid being pumped, an agent must have preferences that satisfy the **Separability Principle**: preferences at a node should depend only on the future consequences from that node, not on the path taken to get there. If you violate separability (e.g., due to regret or temptation), you can be pumped.

  However, this conflates *local* consistency with *global* rationality. Edward McClennen's work on resolute choice demonstrates that an agent can avoid exploitation without satisfying the separability condition required by standard EUM. A resolute agent commits to a plan at time *t1* and adheres to it at *t2*, even if their local preferences at *t2* would dictate otherwise.

  The coherence theorist objects that resolute choice is "magical"—how can a past preference bind a future self? But this objection assumes a Humean theory of agency where the self is merely a sequence of momentary preference sets. If we view agency as temporally extended, resolute choice is not a violation of rationality but its expression. The money pump exploits the gap between temporal slices of the agent. Closing that gap via resolution avoids the pump without requiring the agent to possess a transitive, complete preference ordering at every single moment.

  If an agent can avoid exploitation through resolute planning, then the coherence axioms (specifically separability and the reduction of compound lotteries) are not necessary conditions for avoiding sure loss. They are merely *sufficient* conditions. Since the normative force of the coherence argument rests on the claim that violating the axioms *leads* to sure loss, the existence of alternative avoidance strategies (like resolute choice) undermines the claim that EUM is the *unique* requirement of rationality.

  ### The Gap Between Consistency and Maximization

  Finally, we must address the gap between "avoiding sure loss" and "maximizing expected utility." Coherence arguments are negative; they identify conditions under which an agent is guaranteed to fare worse than they could have. EUM is positive; it prescribes a specific method for ranking options under uncertainty.

  Even if we concede that rational agents must avoid sure losses (a weak norm of prudence), it does not follow that they must maximize expected utility. There are decision rules, such as **Minimax Regret** or **Interval Dominance**, that can avoid Dutch Books in many contexts without adhering to the strict linearity of EUM.

  The leap from coherence to EUM relies on representation theorems (like Savage's) which assume that if an agent's preferences satisfy the axioms, they *act as if* they are maximizing expected utility. But this is a modeling claim, not a normative one. It tells us that coherent behavior is *isomorphic* to EUM. It does not tell us that agents *ought* to be coherent in the first place, nor that EUM captures the full normative landscape of rational choice.

  For instance, in the AI safety context, it is often claimed that any sufficiently capable agent will "converge" to EUM because non-EUM agents are eliminated by selection pressure. But this is an evolutionary claim, not a rational one. A non-EUM agent that refuses certain trades (due to incomplete preferences) might survive perfectly well in an environment where trade is optional. The convergence thesis assumes a hostile environment where exploitation is inevitable. But rationality is not defined solely by survival in hostile markets; it is defined by the appropriate relation between an agent's reasons and actions. If an agent has good reasons to refuse a trade (e.g., the trade violates a deontological constraint or relies on incommensurable values), losing money is not a sign of irrationality. It is a sign that money is not their only value.

  ### The Decisive Consideration: Optionality

  The most decisive consideration against the normative force of coherence arguments is the **optionality of trade**. The Dutch Book and money-pump scenarios are constructed environments where the agent is presented with a menu of bets or trades and is assumed to be compelled to accept or reject them based solely on their local preferences.

  In the real world, and in any robust conception of agency, an agent has the capacity to step back from the menu. They can refuse to play the game. If a bookie offers a Dutch Book, the rational response is not to fix your credences to avoid the loss; it is to tell the bookie to go away.

  The coherence argument only works if we assume the agent *must* bet. But why must they? If rationality is about responding correctly to reasons, and the bookie offers no reason to bet other than the structure of the bet itself, refusal is the rational option. By assuming the agent must engage, the coherence argument presupposes a context (a forced-choice market) that is not constitutive of rationality itself.

  Therefore, coherence arguments establish that EUM is a **strategy for efficiency in mandatory trading environments**, not a **constitutive norm of rational agency**. They show that if you choose to enter the casino, you should count cards. They do not show that you are irrational for staying home.

  ### Conclusion

  The coherence arguments of Ramsey, vNM, and Savage are monumental achievements in formal logic, but they are poor foundations for normative epistemology. They fail to establish Expected Utility Maximization as a requirement of rationality because they rely on question-begging assumptions about the completeness of preferences and the necessity of trade.

  The strongest objection is not technical but conceptual: rationality involves the management of reasons, not just the consistency of choices. An agent with incomplete preferences who refuses a money pump is not inconsistent; they are protecting the structure of their values from being flattened into a single metric. An agent who uses resolute choice to avoid dynamic inconsistency is not violating separability; they are exercising diachronic agency.

  For the PhD student in philosophy, the takeaway is this: do not let the elegance of the representation theorems seduce you into thinking they capture the whole of rationality. Coherence arguments are powerful diagnostic tools. They tell us where we are vulnerable. But vulnerability is not irrationality. We can acknowledge that violating the axioms makes us susceptible to exploitation in specific contexts without conceding that rationality *requires* us to be immune to all possible exploitation. The cost of coherence may be the loss of genuine normative distinctions (like incommensurability), and a rational agent may well decide that price is too high to pay.

  **Verdict:** Coherence arguments fail to ground EUM as a universal requirement of rationality. They demonstrate pragmatic costs, not normative errors. Rationality permits incoherence when that incoherence reflects a reasoned stance on the structure of value or the optionality of engagement.
