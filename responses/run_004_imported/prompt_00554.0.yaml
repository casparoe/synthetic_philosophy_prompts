      *   *Critique 2 (Dynamic Choice):* McClennen's resolute choice. If I know I'll be pumped, I pre-commit. Does this violate separability? Maybe, but it preserves the goal. This suggests rationality is diachronic, not just synchronic coherence.
      *   *Critique 3 (Normative Force):* Even if I lose money, is it *irrational* or just *expensive*? If I value fairness over money, paying to be fair isn't irrational. The arguments assume money/utility is the only metric.
