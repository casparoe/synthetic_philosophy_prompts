      *   **Thesis:** The political side is *internal* to the philosophy, not incidental. Anti-metaphysics serves rational social organization.
      *   **Specific Problem/Objection:** Carnap's non-cognitivism/expressivism about ethics (values aren't truth-apt) seems to undermine the claim that socialism/planning is the "rational" or "scientific" choice. If values aren't factual, how can science dictate politics?
      *   **Tasks:**
