              1.  *Instrumentalism:* Science doesn't pick the ends (socialism), but it clears the debris (metaphysics/religion) that prevents rational pursuit of *any* ends. Metaphysics is associated with reactionary/conservative forces.
              2.  *Neurath vs. Carnap:* Neurath was more overtly political. Carnap was more cautious but still saw metaphysics as socially harmful.
              3.  *The "Decision" Point:* Carnap's *Logical Syntax* and later work treat normative commitments as decisions. The "rationality" lies in the consistency and empirical grounding of the *implementation*, not the ultimate value itself.
              4.  *Enlightenment Legacy:* They saw themselves as completing the Enlightenment. Metaphysics = superstition = oppression. Science = clarity = liberation.
          *   *Key nuance:* They didn't argue socialism is *true* in the same way gravity is true. They argued socialism is the *compatible* system with a scientific worldview, whereas fascism/theocracy relies on myth.

