answer: |-
  This is a perfect real-world example of the **Reference Class Problem**, and it is genuinely hilarious that this is hitting you during an epistemology seminar. You should absolutely bring this up in class.

  To answer your core question directly: **No, there is no single "fact of the matter" about which percentage is correct.**

  Here is the breakdown of why your roommate is chasing a ghost, framed in terms you can use in your seminar.

  ### 1. The Reference Class Problem
  This is the specific philosophical hurdle your roommate has stumbled into. Coined by Hans Reichenbach, the problem states that to assign a frequentist probability to a single event (like *this* game), you must place that event into a reference class of similar past events to calculate a frequency.

  But every event belongs to infinite reference classes:
  *   Class A: All games this player has ever played (Career Average).
  *   Class B: All games this player has played this season (Form).
  *   Class C: All games running backs have played against this defense (Matchup).
  *   Class D: All games this player has played against this defense (History).

  As you've seen, each class yields a different frequency (10%, 18%, 27%, 42%). There is no logical rule for determining which reference class is the "right" one. Choosing one over the other is an arbitrary methodological decision, not a discovery of objective truth.

  ### 2. Ontic vs. Epistemic Probability
  Your seminar has likely touched on the distinction between how the world *is* versus what we *know*.

  *   **Ontic Probability (Propensity):** This views probability as a physical property of the setup (like the propensity of a biased coin to land heads). Does the player/defense matchup have a physical "tendency" to produce >20 points? Maybe. But unlike a coin flip, this setup is never repeated under identical conditions. The weather, the player's sleep, the referee crew, and the game script change every week. Therefore, a stable, objective "propensity" is arguably unknowable or non-existent for a single game.
  *   **Epistemic Probability (Credence):** This views probability as a measure of rational belief given available evidence. Under this view, the "correct" probability isn't a number hidden in the universe waiting to be found; it is the degree of confidence a rational agent should have given their total evidence.

  If you take the **Epistemic** view (which most Bayesians do), the "correct" number isn't one of the four he found. It is a synthesis of all of them. By picking just one (e.g., "I only care about career average"), he is ignoring relevant evidence (e.g., "But he's playing a terrible defense this week"), which makes his belief irrational.

  ### 3. The Single-Case Problem
  Strict frequentists actually argue that it is **meaningless** to assign a probability to a single, non-repeatable event.
  *   To a strict frequentist, "The probability of this game is 27%" is nonsense.
  *   The only meaningful statement is: "In the long run, similar matchups result in >20 points 27% of the time."
  *   Once the game is played, the probability collapses to 0 (he didn't do it) or 1 (he did).

  However, in practical decision theory (and gambling), we act *as if* single-case probabilities exist. We treat epistemic credence as a guide for action. So, while it might not "make sense" ontologically, it makes sense pragmatically.

  ### The Verdict for Your Roommate
  There is no "true" number. The universe does not contain a hidden variable labeled `P(Points > 20)`.

  *   **If he bets based on the 42%:** He is ignoring the small sample size of the player-vs-defense history.
  *   **If he bets based on the 10%:** He is ignoring the specific weakness of the current opponent.
  *   **The Rational Move:** He needs to treat those four numbers as *inputs* for a model, not competing truths. A sophisticated approach would weight them (e.g., "Current season form is more relevant than career average," or "Matchup data is more predictive than general history").

  **A note on the betting:** Since you mentioned he wants to bet on it, remind him that the "Vegas line" is essentially the market's synthesized probability (adjusted for profit). If his number is vastly different from the implied probability of the betting line, either he has found an edge (unlikely given the reference class confusion) or he is overconfident in his epistemology.

  **TL;DR:** Tell him he's experiencing the **Reference Class Problem**. There is no fact of the matter. Probability in this context is a measure of his uncertainty, not a property of the football game. He should probably stop looking for the "true" number and start looking at the betting odds to see where the value lies—or better yet, keep his wallet shut.
