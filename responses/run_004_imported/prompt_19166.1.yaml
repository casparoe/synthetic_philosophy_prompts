      *   **Key Concept:** Single-case probabilities (can we assign probabilities to unique events?).

  3.  **Evaluate the "Fact of the Matter" Question:**
      *   *Is there one true number?* No. Not in an objective, mind-independent sense for a single, non-repeatable (in the exact same conditions) event.
      *   *Why?* Because probability isn't a physical property like mass or charge. It's a relationship between evidence/hypothesis or a long-run frequency.
      *   *The Reference Class Problem:* To calculate a frequency, you need a class of events. Which class? Career games? This season's games? Games against this defense? Each choice yields a different frequency. There is no algorithmic way to choose the "right" class without arbitrary judgment.

  4.  **Connect to Epistemology Seminar:**
