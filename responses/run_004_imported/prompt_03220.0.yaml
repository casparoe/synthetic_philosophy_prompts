      *   **Key Distinction 1: Metaphysics vs. Epistemology.** Both are necessary (metaphysics), but they differ in how we know them (epistemology).
      *   **Key Distinction 2: One Name vs. Two Names.** 'Hesperus is Hesperus' is a logical truth of language. 'Hesperus is Phosphorus' is a discovery about the world.
      *   **The "Guarantee" Test:** Does knowing the meaning of the words guarantee the truth? Yes for H=H. No for H=P.
      *   **Conclusion:** Summarize the takeaway.

  6.  **Self-Correction/Nuance Check:**
