answer: |-
  This is a classic and deeply instructive stalemate in contemporary metaphysics. You and your friend have identified the two most potent internal critiques of the dominant theories of lawhood: the **Inference Problem** for Armstrong's Dretske-Tooley-Armstrong (DTA) view, and the **Circularity/Smuggling Objection** for Lewis's Best System Analysis (BSA).

  To determine which theory is better positioned, we must assess not just the severity of the objections, but what each theory must sacrifice to survive them. Specifically, we need to ask: *Does the fix destroy the core motivation of the view?*

  Here is the comparison and evaluation.

  ### 1. Armstrong and the Inference Problem
  Your friend defends the view that laws are relations of nomic necessitation, $N(F, G)$, between universals. The core selling point of this view is that it explains *why* regularities hold and grounds counterfactuals: the glass broke because it was *governed* by a law, not just because it happened to fit a pattern.

  **The Objection:**
  Bas van Fraassen's "Inference Problem" asks: What is the relation $N$?
  1.  If $N(F, G)$ does not logically entail the corresponding regularity ($\forall x, Fx \rightarrow Gx$), then it fails to be a law of *nature* (it doesn't guarantee the behavior).
  2.  If $N(F, G)$ does entail the regularity, it must do so in virtue of the meaning of $N$. But then $N$ is just a label for "whatever entails the regularity."
  3.  Armstrong admits the connection is brute. He posits that it is simply the nature of $N$ that if $N(F, G)$ holds, then all $F$s are $G$s.

  **The Damage:**
  This objection strikes at the *explanatory mechanism* of the theory. Armstrong introduces a primitive to explain necessity, but then admits the operation of that primitive is itself a brute, unexplainable fact. As van Fraassen quipped, it is as if Armstrong says, "It is a law that Fs are Gs," and then adds, "And by the way, 'law' means 'must'." It risks being a "mock explanation" that posits a hidden gear ($N$) which turns simply because we stipulate that it turns.

  **The Fix:**
  Armstrong must bite the bullet: $N$ is a primitive, irreducible modal relation. We cannot analyze it further.
  **Cost:** This concedes that modality is fundamental. It saves the "governing" intuition but at the price of intelligibility. The theory remains robustly **Anti-Humean**, but it looks like a theory that explains mystery with deeper mystery.

  ### 2. Lewis and the Perfectly Natural Properties (PNP) Objection
  You defend the view that laws are the axioms of the deductive system that best balances simplicity and strength in describing the "Humean mosaic" of particular facts.

  **The Objection:**
  Your friend argues that without restricting the vocabulary of these systems, BSA fails. A system using gerrymandered predicates (like Goodman's "grue") could be incredibly simple and strong (e.g., "Everything is grue" covers all data points trivially). To avoid this, Lewis restricts the competing systems to those formulated in terms of **Perfectly Natural Properties** (PNPs)—the objective "joints of nature."
  The worry is: If PNPs are required to *select* the best system, they cannot be *derived* from the best system. They must be fixed prior to the systematization. But if there is an objective fact about which properties are "natural" independent of the system, haven't we smuggled in the very non-Humean structure (objective modal/natural structure) that Humeanism sought to eliminate?

  **The Damage:**
  This objection strikes at the *ontological purity* of the view. Lewis wants laws to supervene on the mosaic of local qualities. But if the "qualities" themselves come with a primitive, objective ranking of "naturalness" that isn't determined by the mosaic's patterns, then the mosaic is not the sole fundamental layer. There is a layer of "naturalness facts" hovering above the particular facts.

  **The Fix:**
  Lewis must admit that PNPs are fundamental categorical properties. They are not reducible to patterns of resemblance; they *ground* resemblance.
  **Cost:** This concedes that the world has primitive qualitative structure. However, Lewis insists these properties are **categorical**, not modal. They describe *what things are like*, not *what they must do*.

  ### 3. Comparative Evaluation: Which Theory Survives Better?

  When pressed hard, **Lewis's Best System Analysis is better positioned than Armstrong's Necessitarianism.** Here is the justification:

  #### A. The Nature of the Primitive
  Both theories end up requiring primitives to function. Armstrong needs a primitive **modal** relation ($N$); Lewis needs primitive **categorical** properties (PNPs).
  *   **Armstrong's Cost:** Irreducible modality. This is a massive metaphysical commitment. It posits "connections" between distinct existences, which violates the Humean dictum (and general empiricist caution) that there are no necessary connections between distinct existences.
  *   **Lewis's Cost:** Irreducible qualitative distinction. This posits that some properties are objectively more "joint-carving" than others.
  *   **Verdict:** Lewis's cost is lower. Positing objective similarity (PNPs) is less metaphysically extravagant than positing objective necessitation ($N$). A Humean can tolerate primitive qualities; they cannot tolerate primitive "musts."

  #### B. The Functionality of the Mechanism
  *   **Armstrong:** The Inference Problem suggests the mechanism *doesn't work*. If $N(F, G)$ is brute, it doesn't actually *explain* the regularity; it just names it. The theory promises governance but delivers stipulation.
  *   **Lewis:** The PNP objection suggests the *foundation* is richer than advertised, but the mechanism *works*. Once you fix the PNPs, the BSA successfully generates laws, distinguishes them from accidents, and grounds counterfactuals without logical gaps. The systematization procedure is coherent; it just requires a richer base ontology than strict "mosaic-only" Humeanism might hope for.

  #### C. The "Smuggling" Charge vs. Humean Supervenience
  Your friend's worry is that Lewis smuggles in non-Humean structure. This is true, but it depends on how we define "Humean."
  *   **Strict Humeanism:** No primitive structure other than the distribution of local matters of fact. (Lewis loses this).
  *   **Lewisian Humeanism:** No irreducible *modality*. All modal truths (including laws) supervene on non-modal truths. (Lewis keeps this).

  Lewis can argue that PNPs are part of the "local qualities" of the mosaic. They are not a separate layer of governance; they are the *ingredients* of the mosaic. The fact that property $P$ is "natural" is a brute fact about $P$, not a relation of necessitation between $P$ and $Q$. Therefore, Lewis retains **Humean Supervenience regarding modality**. Laws still supervene on the non-modal base. Armstrong, conversely, makes laws (or the relations grounding them) part of the fundamental base.

  ### 4. Conclusion: The Verdict

  **Lewis's theory is better positioned.**

  While the PNP objection successfully shows that Lewis cannot be a *reductive* Humean about *properties*, he remains a Humean about *laws*. The restriction to Perfectly Natural Properties is a constraint on description, not a mechanism of governance. It ensures the system captures objective resemblance without invoking "must."

  Armstrong's theory, conversely, fails to solve the problem it was built to solve. The Inference Problem shows that $N(F, G)$ cannot bridge the gap between universals and instances without a brute stipulation that renders the relation opaque. Armstrong saves the "governing" intuition only by making it unintelligible.

  **Can Lewis still deliver a recognizably Humean picture?**
  **Yes,** provided we define Humeanism primarily as the denial of irreducible modality (Anti-Necessitarianism).
  *   **The Fix:** Lewis accepts that the "mosaic" is composed of specific, primitive categorical properties (PNPs) rather than unstructured "stuff."
  *   **The Result:** Laws still supervene on the arrangement of these properties. There is no "governing" relation. Counterfactuals are still analyzed via similarity of worlds (which relies on PNPs and laws), not via direct modal access.
  *   **The Compromise:** It is a "modest" Humeanism. It concedes that nature has objective joints (PNPs), but denies that those joints are connected by modal glue.

  **Final Justification:**
  It is preferable to have a theory that works (BSA) but requires a richer ontology of properties, than a theory that has a leaner ontology but a broken mechanism (Armstrong). Lewis's "smuggled" structure is categorical and static; Armstrong's "primitive" structure is modal and dynamic. In metaphysics, paying for your laws with categorical properties is a cheaper price than paying for them with irreducible necessity. Lewis wins because his primitives are quieter: they carve the world, but they do not push it.
