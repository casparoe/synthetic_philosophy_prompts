answer: |-
  **MEMORANDUM**

  **TO:** Pretrial Risk Assessment Oversight Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Recidivism-Risk Instrument Certification and Audit Findings

  ### Executive Summary

  The independent statistical audit of our certified risk assessment instrument presents a difficult but mathematically consistent finding: the tool is calibrated across racial groups, but produces disparate false-positive rates for Black defendants due to differing base rates of rearrest. We face three divergent paths: equalizing error rates via race-specific thresholds (Option 1), maintaining calibration (Option 2), or decertifying the tool in favor of judicial discretion (Option 3).

  **I recommend the Board adopt Option 2: Maintain Calibration as a non-negotiable standard, conditional on the implementation of strict procedural safeguards.**

  This position preserves the legal viability of the instrument and the integrity of risk communication, while acknowledging that calibration alone is insufficient to ensure justice. To mitigate the disparate impact of false positives, this recommendation requires that risk scores never serve as the sole determinant for detention and mandates enhanced judicial training on base-rate fallacies. We cannot mathematically engineer away societal disparities without violating Constitutional equal-protection norms, but we can policy-engineer our response to them.

  ### Background

  Two years ago, this Board certified a vendor-built risk instrument to bring evidence-based consistency to bail decisions. Last month's audit confirmed the tool functions as designed: a specific risk score predicts rearrest at the same rate regardless of the defendant's race (Calibration). However, because Black defendants in our jurisdiction are rearrested at a higher baseline rate than White defendants—reflecting broader societal and policing disparities—the tool inevitably flags a higher percentage of Black defendants as "high risk" who will not actually be rearrested (False Positives).

  Our consultants confirm this is not a bug but a mathematical constraint: one cannot simultaneously maintain calibration and equalize error rates across groups with different base rates. We must choose which statistical property to prioritize.

  ### Analysis of Options

  **1. Rejection of Option 3 (Return to Discretion)**
  We must dismiss the proposal to decertify the tool and return to unstructured judicial discretion. Our Board's own prior findings established that unstructured discretion produced racial disparities equal to or greater than the tool's, with the added detriment of being opaque and un-auditable. Abandoning actuarial data does not remove bias; it merely hides it behind judicial intuition. This option is empirically regressive.

  **2. Rejection of Option 1 (Equalized Error Rates)**
  The proposal to mandate equal false-positive rates by adjusting thresholds for different races is morally intuitive but legally perilous. To achieve this, the state would have to apply different legal standards to defendants based explicitly on race. This invites a strict scrutiny challenge under the Equal Protection Clause. While the goal—preventing the disproportionate detention of Black defendants—is just, the mechanism (race-norming thresholds) classifies citizens by race to determine liberty interests. Furthermore, this approach undermines the utility of the score: a "7" would no longer communicate a specific probability of risk to a judge, eroding the shared language necessary for consistent bail setting.

  **3. Recommendation of Option 2 (Maintain Calibration)**
  Maintaining calibration ensures that a risk score means the same thing for every defendant. This is the only option that aligns with current Equal Protection jurisprudence regarding race-neutral state action. It allows judges to assess risk accurately without engaging in explicit racial classification. However, choosing this option requires us to confront an uncomfortable truth: **Calibration ensures fairness in *prediction*, but it does not guarantee fairness in *outcome*.**

  ### Engaging the Counter-Argument

  I must engage honestly with the strongest argument for Option 1, which I am asking the Board to reject. Proponents of equalizing error rates argue that a higher false-positive rate for Black defendants results in a tangible, disparate deprivation of liberty. If the tool causes more innocent Black defendants to be detained pretrial than innocent White defendants, the system is perpetuating inequality, regardless of the mathematical "correctness" of the calibration.

  This is a valid moral claim. By choosing Option 2, this Board is effectively accepting that the tool will contribute to a disparate impact on Black defendants' liberty in the short term. We cannot dismiss this as merely a "mathematical consequence." It is a human cost. However, we must weigh this against the risk of Option 1: if race-specific thresholds are struck down by courts, we lose the tool entirely, likely reverting to Option 3 (discretion), which we know produces worse disparities. Therefore, Option 2 is the only sustainable path, provided we do not treat the score as a verdict.

  ### Mitigation Strategy and Implementation

  To adopt Option 2 responsibly, the Board must decouple the *risk score* from the *detention decision*. A high risk score indicates a probability of failure to appear or rearrest; it does not dictate that detention is the only appropriate response. We can mitigate the false-positive disparity through policy, not algorithmic adjustment.

  **Implementation Timetable**

  *   **November 15, 2023 (Board Vote):** Board votes to recertify the instrument with the conditions outlined below.
  *   **December 1, 2023 (Policy Directive):** Issue a binding directive to all participating counties: Risk scores shall be **presumptive, not dispositive**. No defendant shall be detained solely on the basis of a risk score. Judges must articulate specific, non-score aggravating factors to override a presumptive release recommendation.
  *   **January 15, 2024 (Judicial Training):** Launch mandatory continuing education for all bench officers. Curriculum must cover:
      *   Interpretation of calibrated risk scores.
      *   The "Base Rate Fallacy": Understanding how societal disparities influence input data.
      *   Explicit instruction that high-risk scores should prioritize *supportive conditions* (e.g., reminders, social work) rather than *detention* where possible.
  *   **March 1, 2024 (Vendor Adjustment):** Require the vendor to modify reporting outputs. Instead of a single "High/Medium/Low" label, reports must display confidence intervals and explicitly state the false-positive rate associated with the score for the relevant population.
  *   **June 1, 2024 (Compliance Audit):** Board staff to review a random sample of detention orders where high-risk scores were present. Ensure judicial findings articulate reasons beyond the score itself.
  *   **October 2024 (Re-evaluation):** Board to reconvene and review disparate impact data. If false-positive disparities widen despite safeguards, the Board will consider decertification at that time.

  ### Conclusion

  We cannot fix systemic inequality through algorithmic calibration alone. The disparate base rates driving these false positives are a product of policing, economics, and social policy, not merely code. If we attempt to force the tool to solve this by breaking calibration or race-norming thresholds, we risk legal collapse or predictive uselessness.

  By maintaining calibration, we preserve a transparent, auditable standard. By mandating that the score never be the sole reason for detention, we protect individual liberty against the inevitability of statistical error. This path requires humility: we must admit the tool is imperfect and ensure it serves the court, rather than the court serving the tool.

  I move that the Board adopt Option 2 with the mitigation safeguards and timetable described above.
