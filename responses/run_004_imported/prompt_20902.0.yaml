      *   *Axiom 1:* If $P(\phi)$ and $\phi$ entails $\psi$, then $P(\psi)$. (Positive properties are closed under entailment).
      *   *Axiom 2:* $P(\neg \phi) \iff \neg P(\phi)$. (A property is positive iff its negation isn't).
      *   *Theorem 1:* It is possible that a God-like being exists ($\diamond \exists x G(x)$).
      *   *Definition 2:* Essence ($ess$). $\phi$ is an essence of $x$ if $\phi(x)$ and for all $\psi$, if $\psi(x)$ then $\square \forall y (\phi(y) \rightarrow \psi(y))$. (Roughly: $\phi$ entails all properties of $x$ necessarily).
      *   *Theorem 2:* Being God-like is an essence of any God-like being.
      *   *Definition 3:* Necessary Existence ($NE$). $x$ has $NE$ if for every essence $\phi$ of $x$, $\square \exists y \phi(y)$. (Roughly: If you have an essence, you exist necessarily).
      *   *Axiom 3:* $P(NE)$. (Necessary existence is positive).
      *   *Conclusion:* $\square \exists x G(x)$. (God exists necessarily).

  3.  **Identify the Source of Modal Collapse:**
