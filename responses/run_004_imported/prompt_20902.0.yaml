      *   *Implication:* If $x$ is God-like, then $G(x)$ entails *every* property $\psi$ that $x$ has, *necessarily*.
      *   *The Problem:* What counts as a property $\psi$? In higher-order logic (which Gödel uses), *any* predicate definable in the system is a property.
      *   *The Collapse Step:* Suppose some contingent fact is true, e.g., "It is raining." Can we make a property out of this? "The property of existing in a world where it is raining."
