answer: |-
  **MEMORANDUM**

  **TO:** Effective Giving Society Membership
  **FROM:** Grants Subcommittee (Philosophy, Economics, CS Reps)
  **DATE:** May 15, 2024
  **SUBJECT:** Recommendation for Spring Grant Allocation ($18,000)

  ### 1. Executive Summary

  After reviewing proposals, conducting due diligence, and deliberating on the strategic allocation of this year's $18,000 fund, the Grants Subcommittee recommends a full allocation to **Option A: [Name of Cash Transfer Partner]**, a provider of unconditional cash transfers to low-income households.

  We recognize this decision rejects **Option B: [Name of AI/Biosecurity Outfit]**, a longtermist intervention aimed at reducing existential risk. This was not a unanimous decision. The philosophical disagreement at the heart of this choice concerns the "Cluelessness Objection": whether the unknown long-term consequences of cash transfers negate their verified near-term benefits.

  While we acknowledge the theoretical force of the longtermist position, this memo argues that under conditions of deep moral and empirical uncertainty, **epistemic robustness** should act as a tie-breaker. We recommend Option A because it secures high-confidence value across a wider range of moral worldviews, whereas Option B relies on causal models that are currently too fragile to justify displacing robust near-term welfare gains.

  ### 2. The Candidates

  *   **Option A (Cash Transfers):** An evidence-backed charity providing direct unconditional cash.
      *   *Claim:* Immediate, verifiable increase in recipient welfare (consumption, health, agency).
      *   *Evidence:* Multiple RCTs confirming short-to-medium term benefits.
      *   *Uncertainty:* Long-term downstream effects (population growth, carbon footprint, geopolitical stability) are unknown.
  *   **Option B (Existential Risk Reduction):** A small outfit working on AI governance/biosecurity.
      *   *Claim:* Marginal reduction in the probability of human extinction or civilizational collapse.
      *   *Evidence:* Theoretical models; no direct empirical verification of risk reduction is possible.
      *   *Uncertainty:* The causal link between specific interventions and global risk reduction is highly speculative; the magnitude of the benefit is astronomical but the probability of success is opaque.

  ### 3. The Core Philosophical Disagreement: Cluelessness

  The subcommittee's deliberation centered on the "Cluelessness Objection," famously articulated by Hilary Greaves. The argument posits that we are fundamentally clueless about the long-term consequences of *any* action. Saving a life today alters population dynamics, consumption patterns, and emissions trajectories in ways that could theoretically be positive or negative centuries hence.

  If we are clueless about the long-term effects of cash transfers, the argument goes, we cannot claim they are "better" than AI safety interventions simply because the benefits are sooner. If the long-term effects dominate the value of the world (as longtermism suggests), and those effects are unknown for *both* options, then we should maximize Expected Value (EV) based on the *potential* magnitude of the outcome. Since preventing extinction dwarfs saving lives in EV terms, Option B should win.

  **The Subcommittee's Rebuttal:**
  We accept the premise that we are clueless about the *specific* long-term consequences of cash transfers. However, we reject the conclusion that this renders the choice symmetric. We rely on two distinctions:

  **A. Stochastic Noise vs. Targeted Trajectory Change**
  While we cannot predict the specific long-term effects of cash transfers, there is a strong prior that these effects function as **stochastic noise** within a complex system. Saving a life changes *who* exists and *when*, but without a specific mechanism directing that change toward a particular value-laden outcome (e.g., specific political ideologies or technological trajectories), the expected value of these downstream effects tends toward zero relative to the certainty of the near-term welfare gain.

  In contrast, Option B is explicitly attempting a **targeted trajectory change**. It is not hoping for a random positive side effect; it is intervening in a specific causal chain to lower a specific probability parameter (risk of extinction). The problem is not that the effects are unknown, but that the *causal model itself* is unverified. We are not just clueless about the consequences; we are clueless about the *efficacy of the intervention*.

  **B. Moral Uncertainty and Robustness**
  As a society, we hold diverse moral views. Some members prioritize near-term welfare; others prioritize the long-term future.
  *   If Near-Term Welfarism is true: Option A is vastly superior. Option B may have zero impact.
  *   If Longtermism is true: Option B *could* be superior, but only if the specific intervention works. Given the lack of feedback loops in AI safety, our credence in the intervention's efficacy should be heavily discounted. Option A still retains *some* long-term value (a flourishing population is arguably more resilient than an extinct one).

  Under moral uncertainty, Option A is the **robust choice**. It performs well across multiple moral frameworks. Option B performs optimally only under a specific conjunction of longtermist axioms *and* a specific, unverified causal model of risk reduction.

  ### 4. Steelmanning the Rejected View (Option B)

  We owe it to the proponents of Option B to articulate why their position is compelling, even if we ultimately reject it for this grant cycle.

  The case for Option B rests on the **Astronomical Value Thesis**. If humanity has a future lasting millions of years, the number of future lives is orders of magnitude larger than the number of lives we can save today. Even a 0.0001% reduction in extinction risk outweighs billions of lives saved in the present. From this perspective, prioritizing cash transfers is akin to rearranging deck chairs on the Titanic.

  Furthermore, the "Cluelessness" argument is not merely a shield for inaction; it is a sword against near-term bias. If we admit we don't know the long-term effects of cash, we cannot claim the "ground truth" of welfare is on our side. Increased consumption could accelerate climate change or resource depletion, potentially *increasing* existential risk. If cash transfers inadvertently shorten the timeline to catastrophe, their value is negative. Option B is the only option explicitly designed to safeguard the condition for all future value.

  We acknowledge that if a member holds >90% credence in strong longtermism and trusts the specific causal models of the AI safety outfit, voting for Option A is irrational. We respect that position. However, for the society as a collective, adopting that level of confidence in unverified causal chains is epistemically premature.

  ### 5. Recommendation and Vote

  We recommend allocating the full **$18,000 to Option A (Cash Transfers)**.

  This decision is not a denial of the importance of the long-term future. It is a commitment to **epistemic humility**. In the absence of verifiable feedback loops, we should prioritize interventions where we can confirm we are doing good, rather than interventions where we must take on faith that we are doing good. We can revisit Option B when the organization can provide stronger evidence of tractability or when the society wishes to allocate a specific "high-risk/high-reward" portion of its fund.

  **Action Required:**
  Please cast your vote by Tuesday at 5:00 PM.
  *   **YES:** Approve the Subcommittee recommendation (Option A).
  *   **NO:** Reject the recommendation (Triggers a floor vote between Option A and Option B).

  Respectfully submitted,

  The Grants Subcommittee
