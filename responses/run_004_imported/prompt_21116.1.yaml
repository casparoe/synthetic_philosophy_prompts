prompt: |-
  Okay so this is going to sound random but stick with me. A couple months ago I watched a guy trip and fall pretty hard getting off the train and I just... froze and didn't help, some other person did. I've spent way too long since then turning it over in my head, cause I genuinely think of myself as a helpful, dependable person, and in the moment none of that seemed to matter. A friend who's doing a psych PhD sent me down a rabbit hole of Milgram/bystander-effect stuff, which is how I ended up reading about the situationist critique of virtue ethics -- the Doris/Harman line that stable character traits might basically not exist, and that believing in them is maybe just an instance of the fundamental attribution error dressed up as ethics.

  Anyway, kind of a wild coincidence, but I co-host a tiny philosophy podcast, and next month's guest is a philosopher who's built her whole career defending Aristotelian-style virtue ethics against exactly this challenge (think somewhere between Julia Annas and Christian Miller in terms of the actual position, but she's an invented stand-in, not a real specific person -- I don't want to put words in some living philosopher's mouth). I don't want to just let her say "traits are probabilistic and context-indexed, situationism is attacking a strawman" and move to the next question, because that's the reply I already know is coming and it kinda dodges why the empirical results are as damning as they are.

  Could you draft me 8-10 interview questions that actually press on this? I want at least one question that makes her engage with an actual specific study rather than "situationism" in the abstract -- something like the Isen & Levin dime-in-a-phone-booth helping experiment, or the Darley & Batson seminary-student "Good Samaritan" study where being in a hurry predicted helping way better than anything about the person's character (some of these guys were literally on their way to give a talk on the Good Samaritan parable). I also want one question on whether Harman's stronger claim -- that trait-attribution itself is basically a cognitive bias -- is meaningfully different from the weaker claim that traits just exist but are heavily context-dependent, one on whether leaning on something like Mischel and Shoda's CAPS model rescues stable character or just quietly redefines "trait" into something Aristotle wouldn't recognize, and one on what moral education or cultivating phronesis could even mean if situational variables really do swamp dispositional ones the way these studies suggest. For each question, please add a short follow-up keyed to whatever answer she's most likely give, the kind of pushback a good interviewer includes instead of just nodding along.
reasoning: |-
  Here's a thinking process that leads to the suggested interview questions:

  1.  **Analyze the User and Request:**
      *   **User:** Co-host of a tiny philosophy podcast.
      *   **Context:** Recently experienced a personal moral failure (froze when someone fell on a train), leading to existential doubt about their own character. This personal stake makes the interview more than just academic; it's personal.
      *   **Topic:** Situationist critique of virtue ethics (Doris/Harman) vs. Aristotelian defense (Annas/Miller style).
      *   **Guest:** An invented philosopher defending virtue ethics against situationism.
      *   **Goal:** 8-10 interview questions that *press* the guest, avoiding easy outs ("situationism attacks a strawman").
      *   **Specific Requirements:**
          *   At least one question on a specific study (Isen & Levin, Darley & Batson, etc.).
          *   One question on Harman's strong claim (trait attribution as bias) vs. weak claim (context-dependence).
          *   One question on Mischel & Shoda's CAPS model (does it save traits or redefine them?).
          *   One question on moral education/*phronesis* given situational swamping.
          *   Each question needs a specific follow-up/pushback.
      *   **Tone:** Intellectual, probing, empathetic but rigorous (matching a philosophy podcast).

  2.  **Deconstruct the Philosophical Landscape:**
      *   *Situationism:* Empirical evidence suggests behavior is driven more by situational factors than stable traits. Therefore, global traits don't exist (Harman) or are rare (Doris). This challenges Virtue Ethics (VE), which relies on stable character.
      *   *Virtue Ethics Defense:* Traits are probabilistic, not deterministic. They are sensitive to context (which is rational). The experiments often measure trivial helping, not deep virtue. *Phronesis* (practical wisdom) involves navigating situations.
      *   *CAPS Model (Mischel & Shoda):* "If... then..." signatures of personality. Behavior is consistent *given* the psychological features of the situation.
      *   *User's Personal Stake:* The "freeze" response. This is a classic bystander effect/freeze response. It needs to be acknowledged but perhaps not made the *entire* focus, as the user wants to interview the guest, not therapize themselves (though the intro might touch on it).

  3.  **Drafting the Questions (Iterative Process):**

      *   *Requirement 1: Specific Study.*
          *   *Idea:* Darley & Batson (Good Samaritan). It's the most damning for VE because the subjects were theology students.
          *   *Draft:* What about the Good Samaritan study?
          *   *Refinement:* Make it sharper. Focus on the fact that *hurriedness* outweighed *religious disposition*.
          *   *Follow-up:* If she says "it was a trivial situation," push back that moral life is often trivial moments.

      *   *Requirement 2: Harman's Strong vs. Weak Claim.*
          *   *Idea:* Is believing in traits just a bias?
          *   *Draft:* Harman says traits are a illusion. Is that different from saying they are context dependent?
          *   *Refinement:* Distinguish between ontological claim (traits don't exist) and epistemic claim (we can't see them). If it's a cognitive bias (Fundamental Attribution Error), does VE rest on a mistake?
          *   *Follow-up:* If she says "It's just a bias in *observation*," ask if the *normative* force of VE survives if the descriptive base is shaky.

      *   *Requirement 3: CAPS Model.*
          *   *Idea:* Mischel and Shoda. Does this save traits?
          *   *Draft:* What about the CAPS model? Is that Aristotelian?
          *   *Refinement:* Does reducing traits to "if-then" behavioral signatures strip them of the *unity* Aristotle wanted? Is it just behaviorism with extra steps?
          *   *Follow-up:* If she says "It adds nuance," ask if "nuance" dissolves the *hexis* (stable state) required for eudaimonia.

      *   *Requirement 4: Moral Education/Phronesis.*
          *   *Idea:* How do we teach virtue if situations rule?
          *   *Draft:* How do we teach phronesis then?
          *   *Refinement:* If situational variables swamp disposition, what is the *mechanism* of improvement? Is it just engineering environments rather than souls?
          *   *Follow-up:* If she says "We teach awareness," ask if that turns ethics into risk management rather than character cultivation.

      *   *Filling the remaining 4-6 questions:*
          *   Need to cover: The "Freeze" response (personal connection), Global vs. Local traits, The definition of "Trait," The role of emotion, The "Fragmentation" of the self, and A closing normative question.
          *   *Q5 (Global vs. Local):* Doris argues for local traits. Does a "helping-in-low-cost-situations" trait count as virtue?
          *   *Q6 (The Freeze Response):* Connect to the user's experience. Is "freezing" a failure of character or biology?
          *   *Q7 (Fragmentation):* If I help in context A but not B, am I fragmented? Does VE require a unified self that doesn't exist?
          *   *Q8 (Normative vs. Descriptive):* Is VE a psychological theory or a normative ideal? If the latter, does psychology matter?
          *   *Q9 (The "Strawman" Defense):* Pre-empt the "Situationists attack a strawman" move. In what specific way is the Aristotelian trait *not* global?
          *   *Q10 (Closing/Hope):* What should the listener take away about their own moral worth?

  4.  **Review and Refine:**
      *   *Check Constraints:* 8-10 questions? Yes. Specific study included? Yes (Darley & Batson). Harman strong/weak claim? Yes. CAPS model? Yes. Moral education? Yes. Follow-ups included? Yes.
      *   *Tone Check:* Ensure the follow-ups aren't hostile but philosophically rigorous ("steel-manning" the situationist critique).
      *   *Personal Touch:* Acknowledge the user's intro story in the first question or intro note to validate their experience without making the interview *about* them. (Decided to put the personal angle in Q1 to ground it).

  5.  **Final Polish:**
      *   Make sure the follow-ups anticipate the *standard* VE defenses (e.g., "Virtue is rare," "Traits are probabilistic").
      *   Ensure the distinction between Harman (eliminativist) and Doris (sceptic) is clear where needed.
      *   Verify the CAPS question accurately reflects the tension between psychological consistency and Aristotelian unity.

  6.  **Final Output Generation:** (Proceeding to generate the response based on these thoughts.)
answer: |-
  This is a incredibly rich setup for an interview. You're bridging the gap between high-level meta-ethics and the visceral, gut-punch reality of moral failure (your experience on the train). That tension is exactly where the best philosophy happens.

  The challenge here is to prevent your guest from retreating into the standard "Situationists are attacking a caricature of Aristotle" defense, which is often true but can be used to dismiss the empirical data too easily. You want to force her to reconcile the *ideal* of virtue with the *reality* of human psychology.

  Here are 10 interview questions designed to press on those fault lines, including the specific constraints you asked for, with follow-ups designed to keep the pressure on.

  ### 1. The "Freeze" and the Biology of Character
  **Question:** "I want to start with the phenomenology of moral failure. Many of us think of ourselves as 'good people' until a moment of crisis—like seeing someone fall on a train track—where we simply freeze. Neurobiologically, that's often an amygdala hijack, not a characterological choice. If virtue is a *hexis* (a stable state), how does Aristotelian ethics account for physiological responses that bypass deliberation entirely? Is the person who freezes morally culpable, or is the virtue ethics model simply asking for a level of biological control humans don't possess?"

  **Follow-up:** "If you say they aren't culpable because it was automatic, doesn't that concede that 'character' is only operative in low-stakes, low-arousal situations? And if virtue only functions when the stakes are low, is it still doing the heavy lifting we want it to do?"

  ### 2. The Darley & Batson "Good Samaritan" Study
  **Question:** "I'd like to drill down on a specific study: Darley and Batson's 1973 'Good Samaritan' experiment. Seminary students were sent to give a talk on the Good Samaritan parable. Some were told they were late; some were told they had time. The variable that predicted helping a slumped victim wasn't religious devotion or personality scores; it was purely whether they were in a hurry. If a situational variable like 'time pressure' can swamp a dispositional variable like 'religious vocation,' what work is left for the trait to do?"

  **Follow-up:** "A common reply is that 'virtue is rare.' But these were theology students *on their way to preach about helping*. If the trait doesn't manifest in the population most primed to have it, are we defending the existence of traits, or just defending the *possibility* of traits that we almost never see?"

  ### 3. Harman's Strong Claim: Trait Attribution as Bias
  **Question:** "Gilbert Harman makes a stronger claim than John Doris. Doris says traits are fragmented; Harman suggests that believing in global traits is essentially the Fundamental Attribution Error dressed up as ethics. He argues we are committing a cognitive bias when we say 'she is honest' rather than 'she acted honestly in context X.' Is there a meaningful difference between the claim that traits are context-dependent and the claim that trait-attribution itself is a psychological illusion?"

  **Follow-up:** "If it is a cognitive bias, then Virtue Ethics isn't just empirically challenged; it's built on a perceptual error. Can a normative theory survive if its descriptive foundation is a known cognitive glitch?"

  ### 4. The CAPS Model and the Definition of "Trait"
  **Question:** "Walter Mischel and Yuichi Shoda proposed the CAPS model (Cognitive-Affective Personality System), suggesting personality is a stable set of 'if-then' behavioral signatures rather than global consistency. Some defenders say this saves character. But does adopting a CAPS model rescue Aristotelian virtue, or does it quietly redefine 'trait' into something Aristotle wouldn't recognize? If my 'virtue' is just a complex algorithm of situational responses, where is the *unity* of the self that *eudaimonia* requires?"

  **Follow-up:** "Aristotle wants the virtuous agent to have a unified orientation toward the good. If the CAPS model suggests I'm honest in context A but dishonest in context B based on environmental cues, haven't we replaced the 'unified self' with a fragmented collection of behavioral triggers?"

  ### 5. Moral Education and Environmental Engineering
  **Question:** "If situational variables swamp dispositional ones, the most effective way to increase moral behavior isn't cultivating character; it's engineering environments. We don't teach people to be less hurried; we remove time pressure. If situationism is right, does moral education shift from 'becoming a better person' to 'designing better contexts'? And if so, is Virtue Ethics still the right framework, or should we be looking at structural ethics?"

  **Follow-up:** "You might say we need both. But if resources are limited, and situational tweaks yield higher moral returns than character cultivation, does Virtue Ethics become a luxury good—something nice to think about, but inefficient for actual moral progress?"

  ### 6. The "Strawman" Defense and Global Traits
  **Question:** "Many virtue ethicists argue Situationists attack a strawman because no serious Aristotelian claims traits are 'global' across all situations. But Aristotle does speak of the 'unity of virtues'—that you can't truly have one without the others. If you concede that traits are highly local (e.g., 'honest-on-weekdays-but-not-when-tired'), haven't you surrendered the unity thesis? How do you maintain the unity of virtues without conceding to the situationist's fragmentation critique?"

  **Follow-up:** "If the unity of virtues is broken, then *phronesis* (practical wisdom) can't be a master virtue that guides all others. It becomes just another local skill. Does that collapse the entire architecture of Nicomachean Ethics?"

  ### 7. Probabilistic Traits vs. Predictive Power
  **Question:** "Defenders often say traits are probabilistic, not deterministic. But for a trait to be ethically useful, it needs some predictive power. If my 'honesty' only raises the probability of honest behavior by 5% over a baseline, is that enough to ground moral responsibility? At what point does a 'probabilistic trait' become statistically indistinguishable from noise?"

  **Follow-up:** "If it's indistinguishable from noise in a single instance, how can we justify praise or blame in that moment? Are we praising the noise?"

  ### 8. The Role of Emotion and "Cold" Cognition
  **Question:** "Situationist studies often rely on 'cold' cognitive tasks or brief encounters. Virtue ethicists argue these miss the 'hot' emotional engagement of true virtue. But isn't that a moving goalpost? If virtue only appears in high-engagement, emotionally salient moments, doesn't that make virtue incredibly rare? Most of morality is boring, low-salience routine. Is Virtue Ethics a theory for moral heroes only?"

  **Follow-up:** "If it's a theory for heroes, what guidance does it offer the average person who just wants to be decent? Does it inadvertently encourage moral elitism?"

  ### 9. Normative Ideals vs. Descriptive Psychology
  **Question:** "Is Virtue Ethics a descriptive psychological theory or a normative ideal? If it's normative, does the empirical data matter? You could argue that even if humans *can't* consistently be virtuous, they *ought* to try. But if the 'ought' implies 'can,' and situationism suggests we *can't* consistently be virtuous, aren't we setting people up for the exact kind of shame and paralysis I felt on that train?"

  **Follow-up:** "So, is the practical upshot of Virtue Ethics that we should judge ourselves less harshly? And if we judge ourselves less harshly, do we lose the motivational drive to improve?"

  ### 10. The "Fragmented Self" and Integrity
  **Question:** "Finally, the deepest worry: Situationism suggests the self is fragmented. I am one person on the train, another in the classroom, another with my family. Aristotle's *eudaimonia* relies on a narrative unity of a life. If the situationist is right, is 'integrity' actually possible? Or is integrity just the story we tell ourselves to hide the fact that we are just reacting to stimuli?"

  **Follow-up:** "If integrity is a narrative construct rather than a metaphysical reality, is it still worth pursuing? Or should we accept ourselves as fragmented and stop trying to force a unity that isn't there?"

  ***

  ### A Note for the Host
  Since you mentioned your own experience on the train: **Use it.** You don't have to make the interview about you, but your vulnerability gives you license to ask the "naive" questions that often cut the deepest.

  When she gives the standard "Virtue is hard/rare" answer, you have the standing to say, *"I hear that intellectually, but experientially, when I froze on that platform, knowing virtue is 'rare' didn't help me reconcile my self-image with my action. How does your philosophy help the person in that specific moment of shame?"*

  That moves the conversation from abstract meta-ethics to lived moral psychology, which is where your listeners will be living. Good luck with the recording.
