answer: |-
  Thank you. I am honoured to stand here, and I know I speak for everyone in this room when I say that the silence Miriam has left behind is deafening. Three weeks is not enough time to process a shock like this. Sixty-one years is not enough time for a life like hers.

  We are a department of formal epistemology. We spend our careers worrying about credences, updating functions, and the coherence of belief. We know better than most that the world does not owe us a logical narrative. Sometimes, the probability distribution collapses in a way no one predicted. There is no argument I can construct that will make the suddenness of Miriam's stroke make sense.

  But Miriam would not have wanted senselessness to be the last word. She would have wanted us to check our premises.

  Many of you know that Miriam's bread and butter was the Ramsey-de Finetti tradition on subjective probability. She taught us how rational agents should navigate uncertainty. But those of you who joined her at the pub on a Friday evening know that her true creed wasn't found in her papers. It was found in a single, stray paragraph by Frank Ramsey, written when he was barely older than an undergraduate.

  She recited it so often it became a ritual. It's the passage where Ramsey describes his picture of the world as being drawn in *perspective* rather than to *scale*. In such a picture, he noted, the distant stars appear no larger than threepenny bits. He argued that we make a category error when we look at those stars and feel humbled by their vastness. Size, he said, is not a property that can be impressive. Vastness is not value.

  "Thinking and loving," Ramsey wrote, "are the things that matter. And stars can't do either."

  Miriam wasn't joking when she said this should be read at her funeral. But I know there is a danger in using these words today. Ramsey wrote them as a vibrant young man who didn't know he would be dead within four years. To stand here, looking at an empty chair, and talk about refusing to be humbled by the universe can sound like bravado. It can sound like we are trying to talk ourselves out of grief.

  I want to suggest that Miriam loved this argument not because it denied death, but because it protected life.

  To the logicians in the room: Miriam knew that to confuse magnitude with significance is a fundamental error. It is a confusion of metrics. If we measure a life by the duration of time it occupies, or the physical space it consumes, then yes, we are insignificant. Compared to the timeline of the cosmos, sixty-one years is a rounding error. Compared to the mass of a galaxy, a human being is less than a threepenny bit.

  But that is only if we accept the universe's metric. And Miriam refused to accept the universe's metric. She argued that value is not an intrinsic property of matter; it is a relation generated by minds. A star is a burning ball of gas. It is massive, but it is mute. It cannot hold a belief. It cannot update on evidence. It cannot love a partner, mentor a student, or argue about decision theory over a pint.

  To the family and friends here: This is where the logic turns into comfort. We are gathered here because Miriam could do the things the stars cannot do. She could think, and she could love.

  The tragedy of her death is not that the universe has swallowed her up. The tragedy is that a specific, unique capacity for thought and love has been extinguished. But Ramsey's point—and Miriam's—was that the *capacity itself* is the victory. The fact that we are here, capable of feeling this loss, capable of remembering her wit and her rigour, proves that the "threepenny bits" of our lives are actually the only things in the cosmos that have any weight at all.

  The universe is vast, but it is cold. Miriam was small, in the grand scheme, but she was warm. And warmth matters more than size.

  There is a temptation, when someone dies suddenly, to look up at the vastness of things and feel small. To feel that our grief is insignificant against the backdrop of eternity. Miriam would tell us that is a perspective trick. It is drawing the picture to scale when we should be drawing it in perspective. In *her* picture of the world—the one we are inhabiting right now—she is not a speck. She is in the foreground. She is the size she needs to be.

  She did not need the universe to be impressed by her. She needed us to think clearly and love deeply. She did that. She demanded rigor from us, but she offered generosity. She taught us that while we cannot control the probabilities of our survival, we can control the coherence of our values.

  So, we will not be humbled by the silence of the stars today. We will not look at the vastness of the loss and let it dwarf the memory of the person. The stars are big, but they are dead. Miriam was finite, but she was alive.

  She taught us that meaning is not found in the scale of the canvas, but in the quality of the brushstrokes. Her canvas was sixty-one years. Her strokes were sharp, kind, and brilliant. She thought. She loved. And in a universe of cold, silent giants, that is the only thing that ever truly counts.

  Rest well, Miriam. The picture is drawn.
