      *   *Key Argument:* Keynes's failure wasn't primarily economic (growth happened); it was anthropological and moral. He underestimated the *stickiness* of the "money motive."
      *   *Nuance:* Make sure to distinguish between what Keynes *predicted* vs. what he *hoped*. The essay is as much a moral plea as a forecast.

  5.  **Self-Correction/Check during drafting:**
