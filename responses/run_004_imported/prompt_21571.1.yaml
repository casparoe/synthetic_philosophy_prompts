      *   **Constraint:** "Built around one real joke."

  2.  **Deconstruct the Philosophy (Wittgenstein's Private Language Argument):**
      *   *What is it?* In *Philosophical Investigations* (roughly §§243-315), Wittgenstein argues that a language understandable only to one person is impossible.
      *   *Why?* Meaning requires rules. Rules require public checkability. If I invent a word "S" for a private sensation, how do I know I'm using "S" correctly tomorrow? I can't check against a public standard. I might *think* I'm right, but "right" loses its meaning if there's no possibility of being wrong.
      *   *The Beetle in the Box:* (§293) If everyone had a box with something inside called a "beetle," but no one could look inside anyone else's box, the word "beetle" couldn't refer to the object inside. The object cancels out. The meaning is in the *use* of the word in the public game, not the private sensation.
      *   *Rule-Following:* To follow a rule (like a language rule) is a practice, a custom, an institution. It requires a community.
      *   *Implication for the Couple:* They *don't* have a private language. Their "language" works precisely because it *isn't* private. It's shared. It's public (within their community of two, which expands to friends/family). The fact that we (the friends) understand *that* they have a language proves it's public.

