answer: |-
  The whiteboard still smelled of dry-erase solvent, a sharp chemical tang that clung to the back of the throat. It was past eight. The rest of the co-op had gone home, leaving only the hum of the servers and the glow of the open-plan floor.

  Aviva was wiping down the board, erasing the Q3 revenue projections. Marcus sat at the long communal table, staring at the laptop screen where the Jira backlog stretched into infinity, a canyon of gray tickets.

  "You didn't sign off on the patronage dividend," Aviva said, not turning around. The rag squeaked against the board.

  "I looked at the formula," Marcus said. "Every dollar of surplus distributed. I get it. It's clean. It's mathematically pure."

  "And morally significant." Aviva turned, leaning the rag against the tray. "That's what we agreed. No retained earnings sitting in a vault while a board decides bonuses. We generated the value, we took the value. That's the definition of ending exploitation, Marcus. There is no class siphoning off the surplus labor time."

  "There's no *owner* siphoning it," Marcus corrected. He closed the laptop. "But the market is still siphoning *us*."

  Aviva walked over and pulled out a chair, the legs scraping loudly on the concrete. "Here we go. The market isn't a person. It's a context. We choose which contracts to sign."

  "Do we?" Marcus rubbed his eyes. "Look at the backlog. Sixty percent of this sprint is for LogiCorp. We didn't choose LogiCorp. Sales chose LogiCorp because LogiCorp pays the rate that keeps the internal capital accounts solvent. We are voting on how to shackle ourselves, Aviva. That's not freedom. That's just democratized desperation."

  "It's discipline," Aviva said, her voice flat. "And yes, it's hard. But tell me: if we rejected LogiCorp, and the surplus dropped to zero, and we had to dip into reserves to pay salaries... who is less alienated then? The well-paid worker who has to fix a bug they didn't write, or the unemployed worker who owns a share of a bankrupt entity?"

  "That's a false dichotomy." Marcus leaned forward. "You're treating exploitation and alienation like they're separate line items on a balance sheet. You think because we fixed the exploitation column—the money—the alienation column should just sort itself out. But Marx wasn't talking about accounting. He was talking about the activity of labor itself."

  "I know what he was talking about," Aviva snapped. "I'm talking about what we can actually change. We abolished the extraction of surplus value. That is the material base. Everything else—the sprint deadlines, the ticket silos, the fact that you hate working on the API integration—that's superstructure. It's leftover friction. We can fix that with better job rotation. We can redesign the roles."

  "Can we?" Marcus challenged. "Or is the rigidity necessary for the surplus to exist at all? If we let everyone work on whatever fulfills their 'species-being,' as the clients put it, we miss the deadline. If we miss the deadline, we lose the contract. If we lose the contract, there is no surplus to distribute. So the market discipline *creates* the exploitation of our time, even if the money comes back to us."

  Aviva poured two glasses of water from the pitcher on the sideboard. She slid one toward him. "So what's the alternative? We become a commune? We stop selling software?"

  "I'm asking you to look at the mechanism," Marcus said, ignoring the water. "Take the task bidding system. Senior devs bid first. They take the interesting architecture work. The juniors get the maintenance tickets. The gap widens. We're recreating a hierarchy based on skill scarcity, not need. You say exploitation is gone because the money is shared. But if I spend eight hours a day doing work that deadens me, work that I have no say in designing because the *client* designed it in a RFP three months ago... I am estranged from the product. I am estranged from my own capacity."

  "You're estranged from the *client's* vision," Aviva corrected. "That's not the same as being estranged from your labor. You get to write the code. You own the code. When you leave this co-op, you walk away with your internal capital account payout. You take a piece of the accumulated wealth with you."

  Marcus laughed, a short, dry sound. "The exit clause. Right. If I leave, I get paid out over five years. And if the co-op folds in year two, I get nothing. So I'm bound to the firm's success just as tightly as I was to a boss. I can't just walk away from a bad situation. I have to nurse the firm to keep my equity liquid. That's not ownership, Aviva. That's golden handcuffs we forged ourselves."

  "It's stability," Aviva said, her jaw tightening. "It prevents raiding. It keeps us long-term oriented."

  "It keeps us captive," Marcus said. "Okay, let's press this. I want to know if your theory can even be falsified. You say exploitation is abolished because the surplus is distributed. I'm asking you: Is it possible for this firm to be wholly non-exploitative by your numbers—perfect distribution, total transparency—and still be a thoroughgoing engine of alienation? Or is that combination incoherent to you?"

  Aviva paused. She traced the rim of her glass. "If the money is truly distributed, and the voting is truly one-member-one-vote... then the alienation is self-imposed. It's a political failure, not an economic one. If we feel like cogs, it's because we voted for a system that treats us like cogs to maximize efficiency. We can vote to be inefficient. We can vote to make less money and work on open source."

  "But we won't," Marcus said. "Because we need the surplus to validate the ownership. You've circularly defined freedom as the thing that pays the dividend. If we voted to make less money, you'd call it irresponsible stewardship. So the market is still the boss. The market is the dictator, and we are just the committee managing its will."

  "The market is reality," Aviva said, her voice rising slightly. "Socialism in one company doesn't abolish gravity, Marcus. We exist in a capitalist ecosystem. We have to compete to survive. The miracle isn't that we still feel stress; the miracle is that when the profit comes, it doesn't go to a shareholder in a penthouse. It goes to the person who fixed the database migration. That is a material change in the world."

  "It's a change in who gets the crumbs," Marcus said. "Not a change in the bakery."

  "That's cynical."

  "It's precise." Marcus stood up and walked to the window. The city lights were blurred by rain. "You say alienation is a separate problem. I'm saying it's the root. If the labor process is fragmented—if I don't see my will in the product because the product is dictated by a client's profit motive—then paying me a dividend at the end of the year is just a bribe to accept the estrangement. It's hush money."

  Aviva stood as well. She walked over to the whiteboard, looking at the faint ghost of the numbers she'd just erased. "If it's hush money, why are you still here? Why did you put in twelve years?"

  "Because I thought we were building the new thing," Marcus said, turning back to her. "Not optimizing the old thing. I stay because I hope you're right. But I need to know: if we hit ten million in surplus next year, and we all get fat checks, and we're all still miserable, staring at Jira tickets we didn't choose, answering to account managers we didn't hire... do you admit then that we failed? Or do you say the checks prove we succeeded?"

  Aviva looked at him, her expression hardening into something tired and defensive. "If we hit ten million in surplus, and we distribute it, and we're all still miserable... then we have a culture problem. We have a management problem. But we don't have an *exploitation* problem. And I would rather be a miserable owner than a happy slave."

  "Is that the bar?" Marcus asked quietly. "Is that the horizon? Just owning the chains?"

  "The bar is that the chains are ours to break," Aviva said. "We can vote to break them tomorrow. We can vote to shut this place down. Can you say that at your old job?"

  "No," Marcus admitted. "I couldn't."

  "Then the structure matters," Aviva said. "The feeling matters, Marcus, I know it does. But the structure is the only thing that protects us when the feeling goes bad. When we're tired, when we hate the work, the structure ensures we still get the value. If we base everything on the *feeling* of non-alienation, we're just chasing a mood. If we base it on the distribution of surplus, we're building a floor."

  Marcus picked up his backpack. "A floor is not a foundation, Aviva. You can build a prison on a floor just as easily as a home."

  "Then stop acting like a prisoner," she said, turning off the main lights. The room plunged into the blue glow of the standby servers. "Help me redesign the bidding system. If the hierarchy bothers you, change it. You have the vote."

  "I have a vote," Marcus said, stepping into the hallway. "But I don't have a veto on the market. And until I do, the dividend is just a consolation prize."

  "Maybe," Aviva said, locking the door. "But it's *our* consolation prize. And that has to count for something."

  "It counts," Marcus said, waiting for the elevator. "It just doesn't count for everything."

  The elevator dinged. He stepped in. The doors closed between them, leaving Aviva standing in the dark corridor, the silence of the office pressing in, heavy with the weight of the surplus they hadn't yet earned.
