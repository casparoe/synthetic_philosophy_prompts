answer: |-
  **Critic:** Let's begin with *Mencius* 7A35. Shun's father kills a man; Shun's minister Gao Yao must arrest him. Mencius says Shun should abdicate and flee with his father. Liu Qingping calls this "consanguinitism": a clear instance where blood ties override public justice. If Ames and Rosemont claim Confucianism has no universal principles, how do you explain this? It looks exactly like a universal rule: *When kinship conflicts with law, choose kinship.*

  **Defender:** You are mistaking a specific resolution for a general code. For Ames and Rosemont, there is no abstract "Shun" standing behind the roles to choose between them; Shun *is* the sum of his relationships. He does not break the law; he removes himself from the role that enforces it. By abdicating, he allows Gao Yao to fulfill the role of Judge without obstruction. It is not a hierarchy of values, but a situational optimization where Shun maximizes his role as Son without forcing Gao Yao to fail in his role as Minister.

  **Critic:** But that optimization is instructive. We are told Shun is a sage, a model for others. If his action is praiseworthy, it implies that any agent in a "relevantly similar" position ought to do the same. That creates a class of cases governed by a standing norm. If the norm is "abdicate to save your father," you have smuggled in a universal principle that prioritizes private roles over public ones, which contradicts the claim that role ethics avoids such rankings.

  **Defender:** The instruction is not in the *content* of the act—fleeing—but in the *focus* of the discernment. Role ethics teaches *yi*, or appropriateness to the specific context. The lesson is to attend to the most pressing relational demand, not to apply a rule like "save kin." In Shun's unique position as Sovereign *and* Son, the father-son bond is the root of his moral personhood. The lesson for a commoner, or a judge, would be entirely different. You are looking for a algorithm; we are offering a grammar of living.

  **Critic:** Yet the criterion for what counts as "most pressing" is never neutral. In every paradigmatic case of conflict in the tradition, the biological role wins. If the criterion for "pressing" is consistently determined by consanguinity, then "blood is thicker than law" *is* the algorithm, regardless of whether you call it a rule or a focus. You claim there is no standing ranking of roles, but your explanation of Shun relies on the implicit premise that the Son-role is metaphysically weightier than the King-role.

  **Defender:** It is not a metaphysical weight, but a constitutive necessity. Shun can cease to be King; he cannot cease to be a Son without ceasing to be Shun. Ames and Rosemont argue that roles are not hats we wear, but what we are. To violate the father-son role is to annihilate the moral agent himself. The political order can survive a missing king; the person cannot survive the destruction of their foundational relational root. That isn't a ranking of value, but an ontology of personhood.

  **Critic:** That distinction *is* the ranking. You have just privileged biological roles over political ones by defining the former as "constitutive" and the latter as "contingent." This licenses corruption. If a modern official embezzles funds to feed their parents and claims they are "optimizing their constitutive role," your framework seems forced to praise them as acting like Shun. By denying a public standard of justice that stands independent of roles, you leave no ground to criticize nepotism.

  **Defender:** You ignore the rest of the narrative. Gao Yao is *also* praised. He does not let Shun stop the arrest; he prepares to detain the father impartially. The harmony lies in both men fulfilling their specific roles completely. If a modern official embezzles, they are not fulfilling their role as Official; they are distorting it. Shun does not distort the law; he vacates the office so the law remains intact. The integrity of the public role is preserved precisely because Shun leaves it.

  **Critic:** But the law is *not* intact if the criminal escapes justice. The victim remains uncompensated because the killer fled. By framing Shun's flight as praiseworthy, the tradition accepts that the victim's claim to justice is secondary to the killer's claim to filial care. This confirms Liu Qingping's charge: the public good is sacrificed for private affection. If role ethics cannot adjudicate this sacrifice without appealing to the primacy of kinship, it is functionally identical to consanguinitism.

  **Defender:** You assume justice is solely retributive. For Confucians, justice is the restoration of relational harmony. If Shun arrests his father, he severs the root of *ren* (humaneness) that makes any justice possible. A state ruled by a son who prosecutes his own father is a state built on moral coldness, which leads to greater disorder. Preserving the moral vitality of the agent is not a "private" good; it is the precondition for any public order. You want to sacrifice the root to save the branch.

  **Critic:** Calling filial piety the "root" is just a metaphor for a transcendental principle. You've smuggled in a universal good—"the preservation of moral personhood via kinship"—to override the particular law. If this "root" always trumps the "branch" in hard cases, then you *do* have a transcendent principle, exactly what Ames and Rosemont deny. You can't have it both ways: either there are no universal principles, or Shun's action is justified by one.

  **Defender:** It is not transcendent; it is immanent. It does not stand above the situation like a Platonic form; it arises from the specific gravity of *this* relationship. There is no "Kinship > Law" rule. There is only the recognition that in *this* field of forces, the father-son relation carries a specific historical and existential weight that cannot be discarded without collapsing the agent. We are not subsuming the case under a principle; we are reading the unique topology of the situation.

  **Critic:** But by holding up *this* topology as the ideal, you normalize it. If the "unique topology" of every conflict involving family results in the family being saved, the uniqueness is illusory. The pattern *is* the principle. Until you can admit that the tradition establishes a standing priority for kinship that licenses agents to override public duty, you are merely dressing up consanguinitism in the language of situational discernment.

  **Defender:** And until you recognize that personhood is relational rather than atomic, you will keep looking for a "self" to follow rules. Shun does not "override" duty; he navigates the only path that keeps the web of relationships from tearing. If you demand a universal guarantee that the law always wins, you are asking for an ethic divorced from the lived reality of human connections. We accept the tragedy of the conflict; you demand a logic that erases it.
