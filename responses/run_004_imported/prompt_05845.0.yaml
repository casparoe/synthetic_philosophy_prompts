answer: |-
  This is a fantastic observation. You've stumbled into one of the deepest rabbit holes in collecting, which is essentially a practical application of the **Ship of Theseus** paradox. The question isn't just about watches; it's about what constitutes the "identity" of an object. Is an object the sum of its atoms, or is it the story of those atoms?

  Here is a breakdown of their exchange move-by-move, evaluating who held the stronger ground at each step, followed by what both of them are missing.

  ### Round 1: The Definition of "Real"
  **Ollie's Move:** He argues that value lies in **provenance and continuity**. A watch isn't just a collection of parts; it is a specific historical artifact. If the case was born in January 1965 and the dial in June 1965, and they were married in 2020, the object "1965 Watch X" never existed. Therefore, calling it that is a lie.
  **Marcus's Move:** He argues from **survivorship and function**. He points out that *no* 60-year-old mechanical object is truly untouched. Service parts (crowns, crystals) are swapped constantly, even by the manufacturer. Therefore, Ollie's standard of "unbroken history" is impossible to meet.

  **Who had the better of it?**
  *   **Philosophically: Ollie.** He is correct that an artifact's value is often tied to its specific narrative. A painting restored with new paint is worth less than one with original patina; a watch assembled from donors is not the same object as one that survived intact.
  *   **Practically: Marcus.** He wins on the reality of aging. If Ollie's standard were applied strictly, 95% of vintage watches would be "fake." Marcus correctly identifies that *some* level of part replacement is inherent to the category of "vintage mechanical object."

  **Verdict:** **Draw.** Ollie defined the ideal, but Marcus proved the ideal is impossible.

  ### Round 2: Maintenance vs. Manufacturing
  **Ollie's Move:** He draws a line between **sanctioned repair** and **private synthesis**. An authorized service center replacing a mainspring is "continuing the story" under the brand's umbrella. A private seller marrying a rare dial to a common case is "manufacturing a past" to inflate value. It's about *intent* and *authority*.
  **Marcus's Move:** He attacks **verifiability**. He argues that you cannot prove a watch was only serviced by authorized centers. Paperwork can be faked or lost. Therefore, Ollie is trusting a "paper trail" that is just as unprovable as the physical assembly of the Frankenwatch.

  **Who had the better of it?**
  *   **Marcus.** This was his strongest point. Ollie is relying on trust in a system (authorized service records) that is notoriously leaky. In the vintage market, a watch with a 1980s Rolex service card is treated as "original," but there is no way to guarantee that service didn't involve swapping a dial for a newer one. Marcus exposes that Ollie's distinction is often based on *faith*, not fact.

  **Verdict:** **Marcus.** He successfully undermined the reliability of Ollie's "authorized service" exception.

  ### Round 3: Disclosure vs. Intrinsic Value
  **Ollie's Move:** (Implied) The watch is inherently less valuable because its history is fabricated.
  **Marcus's Move:** He shifts the ethical burden to **disclosure**. He argues that if everyone knows the watch is a Franken (case, dial, hands, movement all period-correct), then no one is being lied to. If the market knows what it is and buys it anyway, the "lie" is gone. The problem isn't the watch; it's the honesty of the seller.

  **Who had the better of it?**
  *   **Marcus.** This is the most mature point of the debate. If a car is rebuilt with original parts and sold as a "rebuilt," it has a market value. If it's sold as "original," it's fraud. Marcus correctly identifies that the *sin* is usually misrepresentation, not assembly. If Marcus is transparent that it's a Franken, Ollie's moral objection loses its teeth.

  **Verdict:** **Marcus.** He moved the goalpost from "what the watch is" to "how the watch is sold," which is where the actual money and ethics change hands.

  ---

  ### What Both of Them Are Missing

  While they argued in circles, there are three crucial concepts neither of them fully addressed.

  **1. The "Marriage" vs. "Franken" Distinction**
  There is a nuance in the hobby they glossed over.
  *   A **Frankenwatch** is usually assembled to *deceive*. It takes a rare dial and puts it on a case it never belonged to make a rare combination.
  *   A **Married Watch** is often assembled to *save*. Sometimes two broken watches are combined to make one working watch so that the parts don't end up in a landfill.
  Neither Marcus nor Ollie asked *why* this watch was built. If it was built to deceive, Ollie is right. If it was built to preserve functioning history from scrap, Marcus is right. The intent of the assembler matters more than the assembly itself.

  **2. The Market *Is* the Reality**
  They are arguing about ontology (what the watch *is*), but collecting is about economics (what the watch *is worth*).
  In the vintage market, consensus is reality. If the collective consensus of collectors is that a Frankenwatch is worth 40% of an original one, then it *is* worth 40%, regardless of whether the parts are genuine. Marcus argues it shouldn't be worth less if you know the truth; Ollie argues it *is* worth less because the history is gone.
  **The missing point:** Ollie is right about the *market value* (Frankens trade lower), but Marcus is right about the *horological value* (it tells time just as well and looks just as good). They are arguing past each other about two different types of value.

  **3. The Museum Standard vs. The Wrist Standard**
  This connects to your thought about old photographs and books.
  *   **Museum Standard (Ollie):** An object is a historical document. Altering it destroys its evidentiary value. A book with reprinted pages is not a first edition.
  *   **Wrist Standard (Marcus):** An object is a tool to be enjoyed. A watch is meant to be worn, serviced, and kept running. If it looks correct and runs well, it fulfills its purpose.
  Your uncle eating his sandwich was probably the wisest move. He likely knows that if you want an investment, you listen to Ollie. If you want a watch to wear and love for 20 years without worrying about scratches or history, you listen to Marcus.

  ### Summary
  *   **Ollie** won on **Definition and Market Reality**. He is right that the object is not historically "original" and will command a lower price.
  *   **Marcus** won on **Ethics and Practicality**. He is right that "originality" is a myth in vintage mechanics and that transparency solves the moral issue.

  **The Verdict:**
  If you are buying an investment to sell later: **Ollie is right.**
  If you are buying a watch to keep, wear, and enjoy: **Marcus is right.**

  The friction comes because the vintage watch hobby tries to be both an investment bank and a gentleman's club at the same time. Your uncle knew better than to pick a side in a war between money and passion.
