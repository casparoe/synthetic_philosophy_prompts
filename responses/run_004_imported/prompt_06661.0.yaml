answer: |-
  Good evening, everyone. For those who don't know me, I'm the older sibling. Which, in this family, mostly means I'm the one who didn't get a PhD, but I did do the reading.

  Standing here, I'm acutely aware that about half the room could fact-check me in real-time. I know that [Sister's Name] studies behavioral ecology, and I know that [Groom's Name] has built a career on costly signaling theory. Specifically, why gazelles stot. For the rest of the family: that's the stiff-legged jump they do when a predator is nearby. It wastes energy. It slows them down. It seems insane. But as [Groom] has argued, that's exactly the point. It tells the predator, "I am so fit, I can afford to waste energy and still outrun you." It is a signal that cannot be faked, because it is too expensive to fake.

  And that presents a problem for me. Because normally, a wedding toast is composed entirely of what a behavioral ecologist would call "cheap talk." I could stand here and say, "They are perfect for each other," or "I've never seen him happier." But if you apply [Groom]'s own research to this room, there is no principled reason for you to believe me. Words are low-cost. Low-cost signals are unreliable.

  So, I didn't want to just tell you they are committed. I wanted to show you. And to do that, I have to talk about three years ago.

  They were in the thick of a long-distance relationship that was stretching thin. Fieldwork on separate continents. Phone calls at impossible hours. And then, [Groom] had a decision to make. He was offered a postdoc. It was prestigious, it was high-impact, it was the kind of opportunity you don't say no to. But it was in the wrong city.

  So he turned it down.

  He took a weaker position, with less funding, in [Sister's Name]'s city. He sacrificed career capital for proximity.

  Now, for my grandmother and the non-scientists in the room: that is what we call a grand romantic gesture. But for the colleagues in the back: this distinguishes the signal from a Fisherian runaway process. This wasn't just a trait correlated with a preference, spiraling because it looked nice. This was a handicap. It reduced his immediate fitness options to ensure the bond remained honest. He put skin in the game.

  He didn't just say he was devoted. He paid for it.

  And that is why I am so confident standing here today. In a world where it is easy to say the right thing, [Groom] did the hard thing. He stotted. He showed us that his signal is honest because it cost him something to send it.

  [Sister] and [Groom], you have already proven that your bond can withstand the pressure of distance and the pull of ambition. May your life together be full of joy, may your signals always be clear, and may you never have to outrun a cheetah to prove it.

  To the happy couple.
