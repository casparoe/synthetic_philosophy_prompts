answer: |-
  **Setting:** *A university courtyard, late evening. The seminar ended hours ago. The streetlights are humming. Elena (defending the reality of resultant moral luck) and Marcus (defending the Control Principle) are sitting on a bench, coffee cups long empty.*

  **Elena:** You're still holding onto the Control Principle like it's a life raft, Marcus. But we both know the water is already over our heads. The reckless driver case isn't a puzzle to be solved; it's a reductio of the whole Kantian project. Two drivers, same negligence, same speed, same intoxication level. One goes home, drinks a beer, and sleeps. The other goes to prison for vehicular manslaughter. If morality is about the quality of the will, as you say, their moral status is identical. But nobody *believes* that. Not really.

  **Marcus:** People believe a lot of things that aren't philosophically robust. Look, the intuition that the second driver is *worse* is powerful, I grant you. But powerful intuitions aren't always truth-tracking. They're often just emotional reflexes. The Control Principle says: you are only morally assessable for what is within your control. The child running into the road was not within the driver's control. Therefore, the *moral blameworthiness* of the agent must be identical.

  **Elena:** "Moral blameworthiness of the agent." There it is. You're retreating into the interior. You're saying, "Okay, fine, we'll lock him up, we'll treat him differently, the parents will hate him more, but *deep down*, in the metaphysical ledger of the universe, he's no worse than the other guy." That's what Williams meant by the "morality system." It's a fantasy purification. It tries to create a sanctuary where the world can't touch you. But the world *does* touch you. That's the point of agent-regret.

  **Marcus:** Agent-regret isn't moral blame, Elena. Williams is clear on that. It's a specific first-person sentiment. I can feel agent-regret for breaking a vase I didn't mean to break. That doesn't make me a vandal. It acknowledges causal involvement without implying malicious intent. We can keep the Control Principle for *blame* while accepting agent-regret for *outcomes*.

  **Elena:** But why draw the line there? Why is regret moral-adjacent but blame moral-pure? Think about Gauguin. Williams' point wasn't just that Gauguin felt regret. It was that Gauguin's decision to leave his family is *justified* only if he succeeds as a painter. If he fails, he's just a deserter. The outcome retroactively alters the moral quality of the initial choice. If success can justify the risk, failure must condemn it. That's resultant luck. It's not just about how we feel; it's about the truth conditions of the action itself. The driver who kills the child didn't just perform a "risk"; he performed a "killing." The identity of the act depends on the luck.

  **Marcus:** I see the move. You're saying the description of the action changes based on the outcome. "Driving recklessly" vs. "Killing a child." But this conflates the *act-token* with the *agent's character*. Here's where I think we can salvage the Control Principle without ignoring reality. We can say the *event* is worse—one involves a death, one doesn't. That is an objective fact. We can even say the *act* is worse in terms of harm done. But the *blameworthiness of the agent* remains constant.

  **Elena:** You're splitting the atom to save the equation.

  **Marcus:** Hear me out. We punish the outcome because consequences matter for social regulation and justice for victims. But if we ask, "Is the driver who hit the child a more vicious human being?" the answer has to be no. If we accept resultant luck, we admit that two people can be equally vicious, but one is morally damned and the other isn't, purely based on chance. That makes morality arbitrary. I'd rather say: "The outcome is tragic and demands restitution," without saying "The agent is now a worse soul."

  **Elena:** But that's not how blame works, Marcus. Blame isn't just a tax on harm. It's a response to the agent. When the parent of the dead child looks at the driver, they aren't thinking, "Your will was identical to the other guy, but the consequences were worse." They are thinking, "You killed my child." And they are right. By engaging in the risky behavior, the driver surrendered the right to claim immunity from the outcome. The luck isn't external to the agency; it's the medium in which agency happens. You can't separate the will from the world and say, "Only this bit counts."

  **Marcus:** But if you don't separate them, you lose the ability to criticize the luck itself! If the driver who hit the kid is genuinely *more blameworthy*, then justice requires we treat him harsher. And we do. But if the other driver had hit the kid, *he* would be more blameworthy. So blameworthiness becomes a lottery. It undermines the very concept of desert. If I can become a murderer through no fault of my own other than bad timing, then "murderer" isn't a moral category, it's a status.

  **Elena:** Maybe it is a status. Maybe that's what being an agent *is*. It's being exposed to the world. You're worried that resultant luck makes morality arbitrary. I'm worried that denying it makes morality irrelevant. Your version of the Control Principle creates a sterile zone where nothing real happens. You want to judge the "will" in a vacuum. But the will is only visible in its results.
  Let's use your distinction: Act vs. Agent. You say the Act is worse, but the Agent is the same. But if I repeatedly perform "Acts" that turn out disastrous due to luck, at what point does the "Agent" absorb that? If I'm a surgeon who takes the same risky cut on ten patients, and five die due to unforeseen complications (luck), and another surgeon takes the same cut and zero die... are they equally skilled? Equally responsible?

  **Marcus:** In terms of *competence*, maybe. In terms of *moral record*, yes. But here is the hard line I'm trying to hold: We can acknowledge that the driver who killed the child has a special obligation that the other doesn't. He has to live with the death. He owes restitution to the family. That is a *moral* difference. I don't need resultant *blame* to explain that. I just need resultant *responsibility*.

  **Elena:** Responsibility and blame are woven together, Marcus. You can't have the heavy lifting of responsibility without the weight of blame. You're trying to have it both ways. You want to say, "He isn't a worse person," to save your Control Principle, but then you say, "He owes a debt of life," which is the heaviest moral burden there is. That *is* blame. You're just renaming it to keep the Kantian ghost alive.
  Williams' point was that we should stop trying to defend morality against luck. We should admit that luck permeates it. It's tragic, yes. It's unfair, yes. But it's true. The driver who hit the kid *is* burdened in a way the other isn't, and that burden isn't just "sadness." It's a moral stain.

  **Marcus:** "Moral stain." That's exactly the language I'm avoiding. Because a stain implies a defect in the substance. If the luck is resultant, the defect isn't in the choice, it's in the universe. Why should the agent carry the defect of the universe?
  Look, I'll concede this: Your view captures the phenomenology better. It describes how we *feel* and how our practices *work*. My view captures the normative ideal. It describes how we *ought* to judge if we want fairness.
  But here is my counter-move to your Gauguin point. Gauguin's justification isn't moral. It's aesthetic or existential. He escapes moral criticism by succeeding, yes, but that shows the limits of morality, not the presence of luck within it. He steps *outside* the moral realm. The reckless driver doesn't step outside. He stays squarely within it. And within the moral realm, the Control Principle is the only thing preventing it from becoming a tyranny of chance.

  **Elena:** But if the only way to save fairness is to ignore the bodies on the road, is it really fairness? Or is it just insulation?
  You say the agent doesn't carry the defect of the universe. But the agent *caused* the death. Not the universe. The driver did. The luck was the *presence* of the child, but the *death* was the driver. To say the driver isn't more blameworthy is to say the death doesn't attach to the agency. And that feels like a lie.

  **Marcus:** It attaches to the *causality*, Elena. Not the *culpability*. Culpability is about the choice. Causality is about the world. We can mourn the causality without inflating the culpability.
  I think this is where we're stuck. You think separating them is a fantasy that denies the reality of agency. I think merging them is a fantasy that denies the reality of justice.
  If I accept your view, I have to tell the driver who *didn't* hit the kid, "You got off easy morally, but you were just as ready to kill."
  If you accept my view, you have to tell the parents, "Your grief is valid, but your judgment of him as uniquely monstrous is technically irrational."

  **Elena:** Exactly. And notice which one of those sentences sounds like something a human being can actually say to another human being.
  "Technically irrational." That's the tell. You're prioritizing the system over the life.
  I'm not saying we should lynch the driver. I'm saying the moral difference is real. The driver who killed the child has entered a different moral relationship with the community. He is now "the one who killed." That isn't luck *undermining* morality; that's luck *constituting* the moral situation.

  **Marcus:** And I'm saying that if we accept that, we lose the ability to say anyone is truly innocent until the dice land.
  Maybe the standoff is the point. We need the Control Principle to keep from crushing ourselves with guilt over things we couldn't prevent. But we need the acknowledgement of Resultant Luck to take responsibility for the world we actually touch.
  We can't live entirely by Williams, or we drown in contingency. We can't live entirely by Kant, or we float away from reality.

  **Elena:** So we drive with the tension.

  **Marcus:** We drive with the tension. But I still think the driver who didn't hit the kid is luckier, not better.

  **Elena:** And I think that in the eyes of the world, "luckier" and "better" end up looking exactly the same. Which is the problem.

  *They sit in silence for a moment. A car passes on the street beyond the courtyard, tires humming on the asphalt. Neither checks their phone.*

  **Marcus:** Same time next week?

  **Elena:** Yeah. But we're reading something easier. Aristotle, maybe.

  **Marcus:** Deal.
