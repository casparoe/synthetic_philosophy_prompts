          *   *Better:* She became a scientist not because it was the optimal adaptation, but because of constraints (e.g., she was good at arguing, or she fell into it).
          *   *Best:* The joke should be that her *fame* is the spandrel, or that her career is a byproduct of her stubbornness. Let's go with the idea that her career wasn't "designed" for greatness, but was a structural necessity of her personality meeting a specific historical moment.
          *   *Wait, the prompt says:* "built around one good joke about her own career having been a spandrel."
          *   *Drafting the Joke:* "If we are being truly Gouldian, we must admit that [Name]'s career wasn't an adaptation for producing knowledge. It was a structural byproduct of her refusal to accept 'just because' as an answer, which happened to find a niche in academia."
      *   **Addressing the Rivals:** Acknowledge the adaptationists in the room. Playful ribbing.
      *   **Addressing the Family:** Thank them for being the "environment" that supported the organism.
      *   **Closing:** A toast that avoids destiny.

  4.  **Refining the Tone:**
      *   *Avoid:* "She was born to do this." "It was fate." "Perfectly designed."
      *   *Embrace:* "Contingency," "Constraint," "Exaptation," "Happy Accident," "Structure."
      *   *Warmth:* Ensure the intellectual rigidity doesn't freeze out the family. Connect the science to human resilience.

  5.  **Drafting - Iteration 1 (Mental Outline):**
