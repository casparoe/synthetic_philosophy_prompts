prompt: |-
  My PhD advisor in evolutionary developmental biology is retiring after thirty-five years, and as the most senior PhD student in her lab I've been asked to give the toast at her retirement dinner. Her reputation rests on a lifelong defense of the Gould-Lewontin spandrels critique: the claim that not every trait -- and, she likes to add while eyeing her own CV, not every career -- is an adaptation; some things are simply byproducts of other constraints, later co-opted for functions nobody designed them for. She is delighted rather than embarrassed that architectural purists insist San Marco's arches are technically pendentives, not spandrels, and treats this as a standing lesson in how a flawed metaphor can still carry a true argument. Half the room will be evo-devo colleagues, including several strict adaptationists she has sparred with for decades, who will catch every reference; the other half is family, who have heard her say 'spandrel' at every holiday dinner for twenty years without quite absorbing what it means. The obvious toast -- 'every step led perfectly to this moment' -- is exactly the Panglossian narrative she has spent her career arguing against, and she will notice if I tell it. Please write a five-minute toast built around one good joke about her own career having been a spandrel, warm enough for the family and precise enough that the evo-devo contingent doesn't wince, while staying true to what she actually thinks careers -- like traits -- are made of.
reasoning: |-
  Here's a thinking process that leads to the suggested toast:

  1.  **Analyze the Request:**
      *   **Speaker:** Senior PhD student in an Evo-Devo lab.
      *   **Honoree:** Retiring PhD advisor (35 years).
      *   **Key Theme:** The Gould-Lewontin "Spandrels of San Marco" critique (anti-adaptationism).
      *   **Specific Constraint 1 (The Joke):** Must include one good joke about *her* career being a spandrel.
      *   **Specific Constraint 2 (Audience):** Mixed audience (Evo-Devo colleagues/adaptationist rivals + Family). Needs to be accessible to family but technically precise enough for colleagues.
      *   **Specific Constraint 3 (Tone):** Warm, respectful, but intellectually honest. Avoid the "Panglossian narrative" (everything happened for a perfect reason).
      *   **Specific Constraint 4 (Philosophy):** Stay true to her view that careers/traits are made of constraints, byproducts, and co-options, not just optimal design.
      *   **Duration:** ~5 minutes (approx. 750-900 words spoken at a moderate pace).

  2.  **Deconstruct the Science/Philosophy:**
      *   *The Spandrels Paper (1979):* Gould and Lewontin argued against pan-selectionism (the idea that every trait is an optimal adaptation). They used the architectural term "spandrel" (the space between arches) to show that some features are necessary byproducts of structure, not designed for a specific purpose. Later, they can be exapted (co-opted) for use.
      *   *The Advisor's Twist:* She loves that San Marco's "spandrels" are technically pendentives. It proves the metaphor is flawed but the *point* remains true.
      *   *The Career Metaphor:* A career isn't a straight line of optimization. It's a series of constraints, accidents, and co-options.
      *   *The Trap:* Do not say "She was destined for this" or "Every step prepared her perfectly." That is adaptationism/Panglossianism.

