answer: |-
  **Setting:** *A university coffee shop, late afternoon. Two graduate students, **Bohm** (a proponent of de Broglie-Bohm pilot-wave theory) and **Ever** (a proponent of the Everettian/Many-Worlds interpretation), are decompressing after a particularly intense seminar on Bell's Theorem.*

  **Bohm:** I'll give you this much: the professor was right to say Bell's theorem is a Rorschach test. You look at it and see what you're already willing to sacrifice.

  **Ever:** And what are you sacrificing today?

  **Bohm:** Locality. Openly. Gladly. Look, if I want particles to have definite positions—which I do, because I see definite pointers on measuring devices—I have to accept the guiding equation. And the guiding equation is explicitly nonlocal. The velocity of particle A depends instantaneously on the position of particle B, regardless of distance. I'm not going to pretend that's compatible with the spirit of Special Relativity. It's not. It requires a preferred foliation of spacetime. I own that.

  **Ever:** I appreciate the honesty. Most Bohmians try to wiggle out of it by talking about "signal locality" versus "influence locality." But you're right. You have a nonlocal mechanism.

  **Bohm:** Exactly. But that's why I'm skeptical of your camp's marketing. You guys walk around claiming MWI is the *only* interpretation that saves locality. You say, "No collapse, no action-at-a-distance, just unitary evolution." But when I look under the hood, it smells like you're hiding the nonlocality in the furniture.

  **Ever:** Hiding it where?

  **Bohm:** In configuration space. Your ontology is the universal wavefunction. That thing doesn't live in 3D space; it lives in a $3N$-dimensional configuration space. If your fundamental reality is a field on configuration space, then "locality" in 3D space is already an emergent, approximate concept. When two particles are entangled, your wavefunction is a single object spanning that high-D space. A "local" interaction in configuration space can correspond to action-at-a-distance in 3D space. So, are you really local, or have you just redefined space so that nonlocality looks like geometry?

  **Ever:** That's a common objection, but I think it conflates the *space the state lives in* with the *structure of the dynamics*. Yes, the wavefunction is on configuration space. But the Hamiltonian—the thing that dictates how the state changes—is local. It's a sum of local terms. Interactions happen where the fields overlap in 3D space. The entanglement is a correlation established by past local interactions. There is no superluminal *influence* propagating between the wings of a Bell experiment.

  **Bohm:** But there's no definite outcome, either. That's the trade. Bell's theorem assumes "single outcomes." You deny that assumption. But if there's no single outcome, what does "local" even mean? Locality is usually a constraint on causal influences between distinct events. If "events" are just branch-relative, and the branching structure itself is determined by the global entanglement of the wavefunction, haven't you just pushed the nonlocality into the definition of a "world"?

  **Ever:** Not into the definition. Into the *supervenience*. The branches aren't fundamental; they're emergent structures within the wavefunction. The fundamental level—the Schrödinger evolution—is strictly local in the sense that the time-evolution of the state at a region depends only on the state in its immediate neighborhood. You're demanding that "locality" include "locality of outcomes." But outcomes aren't fundamental in my ontology. Only the state is.

  **Bohm:** See, that feels like a motte-and-bailey. When you talk to experimentalists, you talk about "worlds" where detectors click. But when a philosopher asks about Bell, you retreat to "the unitary evolution is local." But the *experience* of the detector clicking—the thing we're actually trying to explain—requires a branch decomposition. And that decomposition relies on decoherence. Decoherence isn't instantaneous. It relies on the environment. But the *selection* of the preferred basis—the pointer states—that depends on the global stability of the state.

  **Ever:** It depends on the local interaction Hamiltonian between the system and the environment. That's the point of einselection. The environment monitors the system locally. The pointer basis is determined by which observables commute with the interaction Hamiltonian. That's a local dynamical fact.

  **Bohm:** Is it? Consider a Bell pair. Alice measures spin-up. In your view, the universe branches. But for the branching to be consistent with the correlations Bell talks about, Bob's branch has to "match" Alice's. If the branching is local, how does Bob's side know to split into the anti-correlated branch instantly? If you say "they were already correlated," fine. But in my theory, the particle *moves* differently based on what Alice does. In yours, the wavefunction evolves locally, but the *structure of the branches* seems to require a global consistency condition.

  **Ever:** No global consistency condition is imposed. It's all in the initial state. The entangled state $\frac{1}{\sqrt{2}}(|\uparrow\downarrow\rangle - |\downarrow\uparrow\rangle)$ already contains the correlation. When Alice interacts with her particle, she becomes entangled with it. The state becomes $\frac{1}{\sqrt{2}}(|A_\uparrow\rangle|\uparrow\downarrow\rangle - |A_\downarrow\rangle|\downarrow\uparrow\rangle)$. Nothing happens at Bob's end yet. Bob is still described by a reduced density matrix that hasn't changed. There is no physical change at Bob's location. Locality is preserved because the local state at Bob's end is invariant under Alice's choice of measurement.

  **Bohm:** But that's just "no-signaling." Bell proved that no-signaling isn't enough to save locality if you want single outcomes. You keep no-signaling by ditching single outcomes. But here's the rub: If I'm an observer on Alice's branch, I know with certainty what Bob *will* find. That counterfactual certainty feels like a nonlocal constraint. In Bohmian mechanics, I explain it by saying the quantum potential connects them. In MWI, you say "it's all in the wavefunction." But the wavefunction is a global object. If the fundamental ontology is global, can you really claim the theory is local?

  **Ever:** I'd argue you have it backward. In Bohmian mechanics, you have particles in 3D space, which looks local, but you add a "quantum potential" that acts instantaneously across the universe. That's explicit nonlocality. In MWI, I have a state in a Hilbert space. Hilbert space has a tensor product structure. Locality is defined by that structure—by which subsystems interact. The fact that the state is entangled doesn't make the *dynamics* nonlocal. Entanglement is a resource, not a signal.

  **Bohm:** But the tensor product structure itself—isn't that chosen based on spatial separation? You define "subsystems" based on where they are in space. If space is emergent from the wavefunction, as some of your colleagues claim, then "locality" is just a story you tell about the peaks of the wavefunction.

  **Ever:** Even if space is emergent, the Hamiltonian respects the causal structure of that emergent space. Look, let's talk about Lorentz invariance. Your theory requires a preferred frame to make sense of the instantaneous guidance. You break Lorentz invariance at the fundamental level. My theory doesn't. The Schrödinger equation (or the Dirac equation in QFT) is Lorentz covariant. I don't need a preferred foliation. Isn't that a stronger form of locality?

  **Bohm:** It's a stronger form of *symmetry*, maybe. But does it capture *causal* locality? If I accept a preferred foliation, I can tell a clear story about cause and effect, even if it's superluminal. In your view, "cause and effect" gets murky. If all outcomes happen, what does it mean to say Alice's measurement didn't *cause* Bob's outcome? It seems like you're saving locality by making causation illusory.

  **Ever:** I'm not making causation illusory. I'm making *uniqueness* illusory. Causation is about the flow of information and energy. In MWI, information flows locally. Energy flows locally. The "splitting" isn't a physical process that propagates; it's a change in the description of the observer relative to the system.

  **Bohm:** Relative to the system... that's the phrase that worries me. "Relative." It sounds like you're smuggling in a subject-dependent reality. If physics is about the world, not just the observer's relation to the world, then there's a fact of the matter about whether an event happened here or there. In my theory, the particle is *here*. In yours, the particle is *everywhere* until an observer gets tangled up with it. That sounds like the observer is doing a lot of heavy lifting to define "local events."

  **Ever:** The observer isn't special. Any macroscopic system with enough degrees of freedom does the same thing. A photon hitting a dust grain causes decoherence. No consciousness required. The "local event" is the establishment of a stable record in a local subsystem. That happens locally.

  **Bohm:** But the *correlation* between records is what Bell is about. And that correlation is encoded in the global wavefunction. You're claiming locality because the *evolution* is local, but the *ontology* is a global object that determines all correlations at once. It feels like you're defining locality as "nothing travels faster than light" while ignoring that the "thing" governing the physics is inherently non-separable.

  **Ever:** Non-separable, yes. Nonlocal, no. Separability is the assumption that the state of the whole is determined by the states of the parts. Quantum mechanics violates separability. Bell's theorem proves that. I accept that. But "non-separable" is not the same as "nonlocal influence." Bohmian mechanics accepts non-separability *and* adds nonlocal influences to guide the particles. I just drop the particles and keep the non-separable state. Why pay the price for the particles if they're empirically redundant?

  **Bohm:** Because they give me a world where things happen in specific places! You have a wavefunction that spreads out forever. You have to explain why *I* experience a specific click. You do that with branches. But if the branching is just a feature of the wavefunction, and the wavefunction is non-separable, then the "branch" I'm on is defined by a global property.

  **Ever:** The branch is defined by the local decoherence history.

  **Bohm:** Which depends on the environment. Which is everywhere.

  **Ever:** Which interacts locally.

  **Bohm:** *[Sips coffee]* We're going in circles. You define locality by the Hamiltonian's structure. I define it by the trajectory of the stuff in 3D space.

  **Ever:** Because you're attached to classical intuitions about "stuff."

  **Bohm:** And you're attached to classical intuitions about "fields" and "unitary evolution." Look, I think we agree on the math. We agree on the predictions. We disagree on what exists. If I posit particles, I must accept nonlocality. If you posit only the wave, you claim locality but lose definite outcomes.

  **Ever:** I don't lose outcomes. I multiply them.

  **Bohm:** Which is why I suspect your "locality" is bought with a currency I'm not willing to spend. You say the theory is local because the wave evolves locally. But the *phenomena*—the clicks, the tracks, the us talking about them—require a cut. And where that cut happens, and how the branches align, feels dependent on the global state.

  **Ever:** And I suspect your "nonlocality" is a symptom of trying to force a single trajectory onto a multi-threaded reality. You see a ghostly force acting at a distance. I see a single state evolving smoothly, where the "distance" is just a metric on the configuration space, and the correlations were baked in at the source.

  **Bohm:** Maybe. But until you can tell me what a "world" is without referencing an observer or an approximate basis, I'm sticking with my particles. They're nonlocal, sure. But at least I know where they are.

  **Ever:** And I'll stick with the wave. It's local, unitary, and complete. Even if "where" is a question that doesn't always have a singular answer.

  **Bohm:** Cheers to that.

  **Ever:** Cheers.

  *[They clink coffee cups. Neither looks convinced.]*
