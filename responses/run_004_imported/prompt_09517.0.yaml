answer: |-
  Based on a close reading of Frege's mature texts, particularly "The Thought" (1918) and "On Sense and Reference" (1892), Frege would **reject** the two-dimensionalist rescue attempt, specifically the epistemic primary intension championed by Jackson and Chalmers. He would judge it not as a rigorous formalization of his theory of sense, but as a sophisticated regression into the **psychologism** he spent his career eradicating.

  While two-dimensionalism aims to preserve Fregean cognitive significance, it does so by grounding semantic values in *epistemic possibilities* defined by what an idealized reasoner can conceive or rule out *a priori*. For Frege, this makes the "sense" dependent on the cognitive capacities of minds, whereas he insists that Thoughts (*Gedanken*) belong to a "third realm" that is objective, mind-independent, and timeless. Frege would argue that two-dimensionalism conflates the *act of grasping* a Thought with the *Thought itself*, thereby collapsing the Third Realm back into the sphere of the mental.

  Here is the defense of this verdict, structured around three core Fregean doctrines: the ontology of the Third Realm, the nature of cognitive significance, and the handling of indexicality.

  ### 1. The Ontological Clash: Third Realm vs. Epistemic Scenarios
  The fundamental incompatibility lies in the ontological status of the semantic values. In "The Thought," Frege is explicit: a Thought is not the content of a consciousness. He writes, "A thought is not the content of a consciousness, but rather its object." Thoughts exist timelessly; they do not come into being when we grasp them, nor do they perish when we stop thinking them. They are objective entities in a Platonic realm.

  In contrast, the Chalmers/Jackson primary intension is defined over *epistemically possible scenarios*. A scenario is possible if it is not ruled out *a priori* by an idealized reasoner. This defines the semantic value relative to a subject's information state or rational capacities. Even if the reasoner is "idealized," the domain of evaluation is still defined by *conceivability*—a mental act.

  Frege would argue that this renders the primary intension subjective in the forbidden sense. If the truth-conditions of an expression depend on what a reasoner can *conceive*, then the semantic value is tethered to the psychology of reasoning. For Frege, the Thought that "water is H2O" is true regardless of whether any mind, ideal or otherwise, can conceive of water not being H2O. By making the primary intension sensitive to *a priori* knowability, two-dimensionalism makes the "sense" dependent on the *mode of access* rather than the *object accessed*. Frege would view this as a category mistake: epistemology (how we know) is being used to define metaphysics (what the Thought is). He would insist that the Primary Intension is not a Thought, but a description of how minds *relate* to Thoughts.

  ### 2. Cognitive Significance: A Relation, Not a Structure
  Two-dimensionalism attempts to solve the puzzle of informative identities (like "Hesperus is Phosphorus") by positing that while the secondary intensions (references) are identical, the primary intensions (epistemic senses) differ. This builds cognitive significance directly into the semantic machinery.

  Frege would reject this structural solution. For Frege, cognitive significance is not a property of the Thought's internal structure, but a property of the *relation between a thinker and a Thought*. In "On Sense and Reference," the difference in cognitive value between "a=a" and "a=b" arises because the *senses* differ. However, Fregean senses are modes of presentation of the reference, not maps of epistemic scenarios.

  More critically, Frege distinguishes sharply between the Thought and the *grasping* of the Thought. In "The Thought," he compares grasping a Thought to seeing the moon: the moon (Thought) exists independently, but the act of seeing (grasping) involves a retinal image (mental idea/*Vorstellung*). Two-dimensionalism, by defining the primary intension via epistemic scenarios, effectively treats the "sense" as a formalized version of the retinal image—a representation of how the world appears to a reasoner *a priori*, rather than the objective state of affairs itself.

  Frege would argue that the informativeness of "Hesperus is Phosphorus" is explained by the fact that a thinker grasps two distinct objective Senses that happen to determine the same Reference. We do not need a second dimension of intension to explain this; we only need to acknowledge that Senses are distinct objective entities. To introduce an "epistemic intension" is to try to capture the *act of grasping* within the *object grasped*. Frege would see this as a confusion of the psychological act with the logical content, violating his central injunction: "Always separate sharply the psychological from the logical."

  ### 3. Indexicals: Stabilizing the Thought vs. Modeling Context
  The prompt notes Frege's handling of "today" and "yesterday." In "The Thought," Frege argues that to express the *same* Thought on different days, one must change the words (from "today" to "yesterday"). This reveals that for Frege, the *Thought itself* is timeless and context-free. The context-sensitivity belongs to the *expression*, not the Thought. The linguistic adjustment is required to ensure the *objective Thought* remains constant.

  Kaplan's distinction between Character (linguistic rule) and Content (proposition) parallels this, but two-dimensionalism goes further by treating the Character (or primary intension) as a genuine semantic intension that contributes to truth-conditions in epistemic scenarios.

  Frege would view Kaplan's "Character" as a pragmatic rule for *expressing* Thoughts, not as a layer of semantic content on par with the Thought. For Frege, the "Thought" is the only true bearer of truth values. If the primary intension varies across epistemic scenarios, it is not a Thought in Frege's sense, because Thoughts are timelessly true or false. A proposition that is true in one epistemic scenario and false in another (because the reasoner's information differs) is, for Frege, not a Thought at all, but a *Vorstellung* masquerading as logic.

  Frege's solution to indexicals is to strip them away in a perfect logical language (*Begriffsschrift*). He tolerates them in natural language only with the caveat that they require supplementation to express a complete Thought. He would likely view the two-dimensionalist apparatus as an elaborate mechanism for codifying the imperfections of natural language, rather than a discovery about the nature of Thoughts. He would say: "Do not build the context-dependence into the Thought; rather, recognize that the Thought expressed is different, or that the language is imperfect."

  ### Conclusion: The Verdict
  Frege would acknowledge that two-dimensionalists are grappling with genuine problems regarding cognitive significance and modality that his own system left open (particularly regarding the necessary *a posteriori*). However, he would ultimately condemn the solution.

  By grounding the primary intension in *epistemic possibility* and *conceivability*, Jackson and Chalmers make the "sense" dependent on the cognitive architecture of an idealized reasoner. For Frege, this is psychologism in disguise. It treats the Third Realm as if it were constituted by the limits of rational conception, rather than as a domain of objective truths that stand regardless of whether they can be conceived. Frege would insist that we can preserve cognitive significance simply by acknowledging distinct objective Senses, without resorting to an epistemic dimension that ties the existence of those Senses to the *a priori* capacities of a mind. He would conclude that two-dimensionalism saves the phenomena of language at the cost of the ontology of thought, sacrificing the mind-independence of the Third Realm to save the informativeness of identity statements.
