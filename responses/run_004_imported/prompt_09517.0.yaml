      *Key Textual Reference:* "The Thought" (Der Gedanke). Frege's distinction between *grasping* a thought and the thought itself. The thought is not the *content of a consciousness*.

      *Argument:* 2D semantics makes the "Sense" (Primary Intension) dependent on the conditions of *grasping* (epistemic scenarios). Frege insists the Thought is independent of being grasped.

