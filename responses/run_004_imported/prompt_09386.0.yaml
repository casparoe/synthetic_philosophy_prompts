answer: |-
  The cursor blinked against the white void of the document. *Incident Report 8940-B: Subject Thorne, E.*

  Elias Thorne stared at it until the letters swam. He was a man who had built a career on the verification principle. If a statement could not be empirically tested or analytically true, it was, in his view, not just false, but meaningless. Metaphysics was a cough in the concert hall of science—unfortunate, biological, but devoid of content.

  Now, his heart was beating at a steady sixty-five beats per minute, according to the monitor beside the bed. He had been at zero for four minutes and twelve seconds. The defibrillator logs were immutable. The biology was settled.

  The problem was the four minutes.

  In the sterile silence of the recovery ward, Elias tried to recall the sensation without using the words his brain immediately supplied. He hadn't seen a light. There were no tunnels, no dead relatives waiting in a queue. Instead, there had been a sensation of *structure*. It was as if the noise of his consciousness had suddenly been tuned to a frequency where the static resolved into a signal. He hadn't met a god; he had felt *received*. There was a distinct, undeniable intelligence on the other side of the veil, not benevolent or malevolent, but attentive. It was the feeling of a equation being balanced by a hand that wasn't his own.

  He looked back at the screen.

  *Describe subjective experience during cardiac arrest.*

  If he wrote *I felt witnessed by a non-corporeal intelligence*, the report would be flagged. His colleagues would pity him. Hypoxia. Temporal lobe firing. Neurochemical cascade. They would be right, technically. There was no way to verify the "witness." There was no way to falsify the "cascade." By the rules of his own life, the experience was indistinguishable from a dream. It was private data. It had no public truth value.

  But it felt heavier than data.

  Elias typed: *Visual and auditory hallucinations consistent with cerebral anoxia.*

  He stopped. His finger hovered over the backspace key. That was the lie. Not the conclusion—the conclusion was likely correct—but the certainty. To label it *hallucination* with a period at the end of the sentence implied the investigation was closed. It implied that the internal quality of the experience was irrelevant because the external cause was known.

  Ayer, he thought suddenly. The old philosopher. He'd read the essay once, years ago, dismissing it as the ramblings of a dying man seeking relevance. Now, lying under the thin hospital sheet, Elias understood the trap. If he admitted the experience meant nothing, he was denying the only thing he actually knew for sure: the qualia itself. If he admitted it meant something, he was abandoning the only tool he had to measure meaning.

  He deleted the sentence.

  He tried again. *Subject reported high-fidelity complex imagery during flatline. No physiological correlate found.*

  That was better. It was dry. It was safe. But it missed the weight of it. The feeling that the universe was not a cold machine, but a house where someone was home.

  Elias sat up, wincing as the IV pulled at his arm. He opened a new document. This one wouldn't be filed. It was a private log, encrypted, accessible only to him. Here, the verification principle held no sway. Here, he could speak of the *attitude*.

  He typed: *The event did not provide evidence. It provided a perspective.*

  That was the distinction. His friend, if he were here, would argue this was semantic hedging. *You either believe in the soul or you don't, Elias. You can't have it both ways.*

  But Elias knew that belief wasn't a binary switch. It was a tension. Before the flatline, his atheism was a wall. He leaned against it, and it did not move. Now, the wall was still there. He still believed that when his brain stopped, his mind would end. He still believed that "spirit" was a word for things we didn't yet understand physically. The data hadn't changed. The probability of an afterlife remained negligible.

  But the wall was no longer stone. It was glass. He could still see through it, but he knew it could shatter.

  He looked back at the official report. He needed to finish it. He needed to maintain the integrity of the methodology. If he allowed anecdote to contaminate the data set, he undermined the very science that had restarted his heart.

  He typed into the official log: *Experience categorized as neurobiological artifact. Recommendation: No further inquiry.*

  It was the correct scientific statement. It was the truthful empirical statement. And yet, as he hit *Save*, Elias felt a small, quiet fracture in his own rigidity. He had not changed his mind about the universe. He had only changed his mind about how firmly he could hold it.

  He closed the laptop. The room was quiet. The monitor beeped, a steady, rhythmic confirmation of life. Elias lay back and closed his eyes. He didn't pray. He didn't know how. But for the first time in forty years, when he listened to the silence of the room, he didn't assume he was the only one listening. He simply left the question open, hanging in the air like a note that hadn't yet resolved.

  It wasn't faith. It was just a lack of certainty. And for a man who demanded proof for everything, that sliver of doubt felt more like grace than any revelation could have.
