      *   Key phrase to echo: "Inflexible attitude."

  9.  **Drafting the Content (incorporating sensory details):**
      *   The smell of ozone.
      *   The blinking cursor.
      *   The temptation to write "soul" vs. the necessity of writing "neural misfire."
      *   The distinction: The data hasn't changed, but the *weight* of the null hypothesis has shifted.

  10. **Polishing:**
