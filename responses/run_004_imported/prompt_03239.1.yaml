answer: |-
  Here is the position: **If you dropped Hume into the contemporary debate, he would side with the Humeans (Lewis, Loewer, Hall) on the theory of *laws*, even if your colleague is right that the "New Hume" reading is historically accurate regarding *causation*.**

  However, he would not be a Lewisian metaphysician. He would be a **methodological Humean**. He would reject Armstrong and Bird not because he knows necessary connections *don't* exist (the Old Hume dogmatic reading), but because positing them violates the rules of meaningful discourse and adds zero explanatory value to science (the New Hume pragmatic reading).

  Here is the argument for why Hume lands in the Humean Supervenience (HS) camp, and why quantum entanglement wouldn't shake him.

  ### 1. The Old/New Hume Distinction is Ontological; The Laws Debate is Epistemological
  Your colleague is correct that the "New Hume" reading (Strawson, Wright, Kail) has serious textual backing. In *Enquiry* Section VII, Hume says we have no *idea* of necessary connection, but he leaves open whether there is a *something* in objects that corresponds to our feeling of determination. He is a skeptical realist about causal *powers*, but an empiricist about causal *concepts*.

  However, the contemporary debate between Lewis and Armstrong isn't primarily about whether powers exist in the noumenal dark; it's about **what laws of nature *do* in our best theories.**

  *   **Armstrong/Bird (Anti-Humeans):** Laws are relations between universals or dispositions that *govern* events. They explain *why* the regularities hold.
  *   **Lewis (Humean):** Laws are the axioms of the Best System that summarizes the mosaic. They don't govern; they describe.

  Hume would slam the table on Lewis's side here. Why? Because of the **Copy Principle**. Even if there is a "necessary connection" out there (New Hume), we have no impression of it. Therefore, the term "necessitation relation between universals" is, for Hume, cognitively empty. It sounds like meaning, but it refers to no idea.

  If you tell Hume, "Armstrong's necessitation relation explains why the billiard ball moves," Hume replies: "It explains nothing to *us*." An explanation must connect ideas we possess. Positing a metaphysical glue we cannot conceive is what Hume calls "hypothetical reasoning" disguised as insight. It is "occult."

  Lewis's Best System Analysis (BSA) is essentially a formalization of Hume's psychological account of lawhood. For Hume, lawhood is a feature of how the mind organizes constant conjunctions to maximize predictive utility. For Lewis, lawhood is a feature of the system that best balances strength and simplicity to summarize the mosaic. Both agree: **Laws are tools for systematization, not metaphysical governors.**

  So, even if Hume admits (privately, as a New Humean) that there might be "oomph" in the objects, he would argue that **a theory of *laws* must be Humean** because laws belong to the domain of human science, not the domain of unknowable noumena. He would tell Armstrong: "You are trying to build a science out of materials you admit we cannot experience. That is not metaphysics; it is sophistry."

  ### 2. The "Supervenience" Base: Where Hume Diverges from Lewis
  This is the crucial nuance. Hume would agree with Lewis that laws supervene on the "mosaic." But he would disagree with Lewis on what the mosaic *is*.

  Lewis defines the mosaic as **local matters of particular fact** (intrinsic properties at spacetime points). This is a specific metaphysical commitment. Hume defines the mosaic as **the totality of perceptions/impressions**.

  If quantum mechanics shows that the world is not locally separable (more on that in a moment), Lewis has a problem because his specific definition of the mosaic is threatened. Hume does not. For Hume, the "mosaic" is just "what happens." If "what happens" turns out to be non-local entangled states, then the mosaic is non-local.

  Hume's supervenience claim is weaker and more robust than Lewis's: **Laws supervene on the empirical data.** He doesn't care if the data is local or non-local, intrinsic or relational, as long as it is empirical. He would tell Lewis: "Don't get dogmatic about the atoms of the mosaic. Just ensure the laws summarize the phenomena."

  ### 3. The Quantum Entanglement Bonus
  Tim Maudlin's argument is that quantum entanglement violates Humean Supervenience because the state of an entangled pair does not supervene on the intrinsic properties of the individual particles at their respective locations. The whole is not determined by the local parts.

  If you resurrect Hume, he would not see this as a dent in his view. He would see it as a dent in **Lewis's specific metaphysics of locality**, not in **Humean regularity theory**.

  Here is why Hume shrugs off Maudlin:
  1.  **Hume is not committed to Locality:** Hume's skepticism applies to *causal mechanisms*. He never proved that causes must be local contact; he argued that we only *observe* constant conjunction. If quantum mechanics presents us with a constant conjunction that is non-local, Hume accepts it. He doesn't have a priori reason to demand locality.
  2.  **The Wave Function is a Systematizing Tool:** Hume would look at the quantum wave function and ask: "Is this a description of hidden machinery, or a mathematical tool for predicting impressions?" He would side with the Psi-epistemic or Pragmatist readings (like Healey or Friederich). The wave function is part of the "Best System" for summarizing the empirical mosaic. It is not a "law" in the Armstrongian sense (a governing universal); it is a rule in the system.
  3.  **No "Oomph" Required:** Anti-Humeans use entanglement to argue that there must be a holistic law governing the system. Hume replies: "There is a holistic *regularity*. Why do you need to add a 'governing law' on top of the regularity?"

  Hume's response to Maudlin would be: "You are assuming that for the regularity to hold, there must be a local mechanism. I told you 250 years ago there is no impression of mechanism. If the regularity is non-local, then the Best System will have non-local axioms. That does not require necessitation; it just requires updating the mosaic."

  ### The Verdict
  Your colleague is right that "Humean Supervenience" is a historically loaded term. If "Humean" means "Denies the existence of causal powers," then Lewis is a more dogmatic Humean than Hume was (given the New Hume reading).

  **But**, if "Humean" means "Denies that causal powers have a legitimate role in the formulation of scientific laws and metaphysical explanation," then Hume is the original Humean Supervenientist.

  **Hume's Position:**
  1.  **On Laws:** He endorses the Best System Analysis. Laws are summaries, not governors. (Side: Lewis).
  2.  **On Powers:** He remains agnostic about their existence but insists they are meaningless for science. (Side: New Hume, but functionally Old Hume).
  3.  **On Quantum:** He accepts non-local regularities as part of the mosaic. He rejects the idea that entanglement proves "governing laws" in the Armstrongian sense. (Side: HS, but with a revised definition of the mosaic).

  **Tell your colleague:** The name "Humean Supervenience" is justified not because Hume held Lewis's specific metaphysics of local qualities, but because he held the **methodological priority of the mosaic over the laws**. Whether the mosaic is made of local qualities or entangled fields, Hume insists the laws must supervene on *that*, not on some separate realm of necessitating universals. The Anti-Humeans want laws to explain the mosaic; Hume (and Lewis) insist the mosaic explains the laws (by making them true). On that fundamental direction of explanation, Hume is 100% in the Lewis camp.
