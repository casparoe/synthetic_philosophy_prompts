answer: |-
  You win the argument. Sam is conflating a **technical tool** with a **metaphysical commitment**.

  While they are closely related in the work of philosophers like Graham Priest, they are logically distinct categories. To put it in the driest terms possible: **Paraconsistency is a property of a logical system; Dialetheism is a thesis about the world (or truth).**

  Here is the breakdown you can send Sam to settle this, including the concrete cases and the verdict on the "cost" of each position.

  ---

  ### 1. The Category Mistake
  Sam's error is thinking that adopting a logic is the same as adopting an ontology.

  *   **Paraconsistent Logic** is defined negatively. A logic is paraconsistent if its consequence relation ($\vdash$) is **non-explosive**. That is, it denies the Principle of Explosion: $\{A, \neg A\} \nvdash B$. It simply means that if you feed a contradiction into the system, the system doesn't crash (it doesn't validate every sentence). It says nothing about whether the contradiction is *true*, only that the system can *tolerate* it.
  *   **Dialetheism** is defined positively. It is the metaphysical/semantic thesis that there are **true contradictions**. That is, there exists some sentence $A$ such that both $A$ and $\neg A$ are true (often written as $True(A \land \neg A)$).

  **The Analogy:**
  Think of paraconsistent logic like a **fireproof safe**. Think of dialetheism like **keeping dynamite in the safe**.
  *   You can buy a fireproof safe (paraconsistent logic) to protect important documents from a fire next door, without ever putting dynamite (contradictions) inside it.
  *   If you *do* keep dynamite inside (dialetheism), you *must* have a fireproof safe (paraconsistent logic), or else the dynamite will blow up the whole house (trivialism).

  ### 2. Direction One: Paraconsistency WITHOUT Dialetheism
  **Does holding a paraconsistent logic commit you to dialetheism?**
  **No.** This is where Sam is most clearly wrong. Many logicians use paraconsistent systems instrumentally without believing a single contradiction is true.

  **The Concrete Case: Inconsistent Databases (or Belief Revision)**
  Imagine you are an AI engineer designing a database for a hospital.
  *   **Scenario:** Due to a sensor glitch, the system records that "Patient X is in Room 101" ($A$) and, simultaneously, "Patient X is not in Room 101" ($\neg A$).
  *   **The Problem:** If your database runs on classical logic, the Principle of Explosion applies. From this glitch, the database could infer "Patient X has blue hair," "The moon is made of cheese," or "Prescribe 500mg of Cyanide." The system becomes **trivial** and useless.
  *   **The Solution:** You implement a paraconsistent logic (like $LP$ or Relevant Logic) for the database inference engine. This quarantines the contradiction. The system acknowledges the inconsistency but refuses to derive arbitrary conclusions from it.
  *   **The Commitment:** Do you, the engineer, believe it is *true* that the patient is both in and not in the room? **No.** You believe there is an error in the data. You are using paraconsistent logic to manage **epistemic inconsistency** (inconsistent information), not **ontological inconsistency** (inconsistent reality).

  **Philosophical Precedent:** This is often called the "Epistemic" or "Instrumentalist" view of paraconsistency. Philosophers like **Bas van Fraassen** or **Bas van Fraassen**-adjacent constructive empiricists might tolerate inconsistent models because they find them useful for prediction, without committing to the literal truth of the contradictory entities.

  ### 3. Direction Two: Dialetheism WITHOUT Paraconsistency?
  **Does holding dialetheism commit you to paraconsistent logic?**
  **Yes, effectively.** This is the only place Sam has a tiny foothold, but it still doesn't make them the "same move."

  If you are a dialetheist, you believe some contradictions are true ($A \land \neg A$).
  *   If you try to hold this view while using **Classical Logic**, you are forced into **Trivialism**.
  *   Classical logic dictates: If $A \land \neg A$ is true, then $B$ is true (for any $B$).
  *   So, a "Classical Dialetheist" must believe *everything* is true (that you are a poached egg, that 2+2=5, etc.).

  Since Trivialism is philosophically untenable (you can't argue for it without assuming some things aren't true), any viable dialetheist **must** adopt a paraconsistent logic to block the explosion.

  **However,** this doesn't make them the same thing. It just means dialetheism *requires* paraconsistency as a prerequisite, much like "being a marathon runner" requires "having legs," but "having legs" does not mean you are a marathon runner.

  ### 4. The Verdict: What is the "Extra Cost"?
  You asked if dialetheism is just "paraconsistency plus a change of attitude." It is more than an attitude; it is an **ontological tax**.

  Here is the specific weirdness a dialetheist signs up for that a mere paraconsistent logician does not:

  1.  **Rejection of the Law of Non-Contradiction (LNC) as an Ontological Principle:**
      *   The **Paraconsistent Logician** says: "The LNC might be a good rule for reasoning, but if we violate it, the world doesn't end." They treat LNC as a normative rule for thought.
      *   The **Dialetheist** (like Graham Priest) says: "The LNC is false. Reality itself is contradictory." They treat LNC as a descriptive claim about the world that happens to be wrong.

  2.  **The Truth Value Glut:**
      *   Standard logic assumes truth values are exclusive (True XOR False).
      *   The Dialetheist must argue that truth conditions can **overlap**. For the Liar Sentence ("This sentence is false"), the dialetheist argues it is *both* True and False. This requires a radical revision of the semantic concept of truth (e.g., using a 3-valued logic where the third value is "Both").
      *   The Paraconsistent Logician can say: "I use a 3-valued logic to handle undefined states," without claiming the third value represents a *real* state of affairs in the world.

  3.  **Rational Acceptance:**
      *   The Paraconsistent Logician says: "It is rational to *tolerate* contradictions in our theories temporarily."
      *   The Dialetheist says: "It is rational to *accept* contradictions as final."

  ### Summary for Sam
  Tell Sam this:

  1.  **Paraconsistency is about consequence:** It says contradictions don't imply everything.
  2.  **Dialetheism is about truth:** It says some contradictions are actually the case.
  3.  **The Relationship:** All viable dialetheists are paraconsistent logicians, but **most paraconsistent logicians are not dialetheists.**
  4.  **The Cost:** Paraconsistency is cheap (it's just a safer logic tool). Dialetheism is expensive (it claims the world is contradictory).

  **The Tiebreaker:**
  If Sam thinks they are the same, ask him if he believes the patient in the database example is *actually, metaphysically* in both rooms at once.
  *   If he says **No**: He admits you can have paraconsistency without dialetheism. (You win).
  *   If he says **Yes**: He is a dialetheist about hospital databases, which is absurd. (You still win).

  Graham Priest invokes paraconsistent logic *because* he is a dialetheist, but he didn't invent paraconsistent logic *for* dialetheists alone. It is used widely in computer science and legal theory by people who think contradictions are mistakes to be managed, not truths to be embraced.

  **Verdict:** You are right. Sam owes you dinner.
