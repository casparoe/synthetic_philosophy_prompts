      *   *Step 1: Physical Antipathy.* The act is "odious and disgusting" *to the observer*, not the actor (who gets pleasure).
      *   *Step 2: Irrelevance of Disgust.* Bentham argues this *should* be irrelevant ("nothing to the purpose"). Analogy: A man loves carrion (rotten meat). It disgusts me, but I eat fresh meat. His pleasure doesn't harm me.
      *   *Step 3: The Psychological Leap.* "From a man's possessing a thorough aversion to a practice himself, the transition is but too natural to his wishing to see all others punished who give into it."
      *   *Step 4: The Search for Pretext.* People look for a "pretence, however slight" to justify punishing based on this feeling.
      *   *Step 5: The James I Anecdotes.*
          *   Case A (Anabaptists): Antipathy + Favorable Circumstances (religious persecution allowed) = Burning.
          *   Case B (Tobacco): Antipathy + Unfavorable Circumstances (couldn't burn smokers) = Writing a book.
      *   *Conclusion:* The severity of punishment depends on the *opportunity* to gratify antipathy, not the harm of the act.

  3.  **Reconstructing the Psychological Mechanism (Bentham's View):**
      *   *Utilitarian Framework:* Pain and Pleasure.
      *   *The Error:* People confuse their own *pain* (disgust at seeing/thinking about the act) with *harm* done to society.
      *   *The Mechanism:*
          1.  **Sensory Reaction:** Observer feels physical revulsion (nausea, disgust).
          2.  **Egoistic Projection:** Observer assumes their feeling is universal or objective. "If I hate it, it must be bad."
          3.  **Sympathetic Pain (or lack thereof):** Bentham usually talks about sympathy, but here he highlights *antipathy*. The observer feels pain merely by the *knowledge* of the act.
          4.  **Rationalization:** To punish without a reason is tyranny. So, the mind seeks a "pretence" (a moral or legal excuse).
          5.  **Action:** Punishment is inflicted not to prevent harm (utilitarian goal), but to relieve the observer's psychological discomfort (gratification of antipathy).
      *   *Key Benthamite Concept:* "The principle of sympathy and antipathy." (He critiques this in *Introduction to the Principles of Morals and Legislation*). It's a "principle" that isn't really a principle—it's just caprice disguised as morality.

  4.  **Analyzing the James I Anecdotes:**
      *   *Why James I?* He was known for intellectual pedantry and personal whims rather than systematic cruelty (like Mary I or Henry VIII). This fits Bentham's point that the *motivation* is personal antipathy, not state security.
      *   *Anabaptists:* Religious difference. Ground for punishment existed (heresy laws). Result: Death.
      *   *Tobacco:* Personal dislike (wrote *A Counterblaste to Tobacco*). Ground for punishment *didn't* exist (no law against smoking). Result: Ranting (book).
      *   *The "Clincher":* The *act* (smoking vs. praying differently) didn't determine the punishment. The *opportunity* to punish determined the outcome. If he could have burned smokers, he would have. This proves the motivation was *antipathy*, not *justice* or *harm prevention*.
      *   *Argumentative Work:* It isolates the variable. Same King, Same Psychology (antipathy). Different Circumstances (legal/social ability to punish). Different Outcomes. Therefore, the punishment is contingent on power/opportunity, not the nature of the "offence."

  5.  **Drafting the Response (Iterative Process):**
