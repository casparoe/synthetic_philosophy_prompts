          *   Nozick's actual objection (pp. 39-40): He finds it "uncomfortable" or "unsatisfying" because it seems arbitrary to switch moral theories based on species. More importantly, he argues that if we accept utilitarianism for animals, we might be forced to accept it for humans who lack certain capacities (e.g., marginal cases like infants or severely cognitively impaired humans). If we treat marginal humans utilitarianly, we violate their rights. If we treat them Kantianly, why not animals with similar capacities?
          *   *The "Utility Monster" Connection:* The Utility Monster argument (pp. 40-45) is generally used to attack utilitarianism *globally*, showing that aggregation can justify horrific sacrifices. While related to the general anti-utilitarian stance, it is *not* the specific reason Nozick gives for rejecting the *hybrid* view in that specific passage.
