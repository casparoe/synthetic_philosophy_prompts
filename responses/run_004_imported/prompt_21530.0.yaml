  Here is a concrete example designed for your feature, distinct from the highway scenario but isomorphic in structure. It uses a **"High-Stakes Heist"** narrative to make the decision points tangible, followed by the precise mathematical divergence you requested.

  ### The Scenario: The Amnesiac Vault Cracker

  Imagine a master thief who has been hired to breach a secure facility. The vault is protected by a **two-stage digital lock**. To open it, the thief must bypass the first firewall (Node 1) and then the second firewall (Node 2).

  **The Constraint (Self-Locating Uncertainty):**
  Due to a neural dampener field in the vault, the thief suffers from transient amnesia. Every time they successfully bypass a firewall, their memory is wiped. Furthermore, the interface for both firewalls is identical: a black screen with a single green button labeled **"PROCEED"**.
  *   If the thief presses **"PROCEED"**, they attempt to bypass the current firewall and move to the next stage.
  *   If the thief presses **"ABORT"**, they stop the process, download the data accessible at that stage, and escape.

  Because the screens are identical and the thief has no memory of previous actions, they cannot distinguish the first firewall from the second. They must adopt a **single mixed strategy**: a fixed probability $p$ of pressing "PROCEED" that applies to *whichever* firewall they are facing.

  **The Payoffs:**
  1.  **Abort at Firewall 1:** You escape with the guest server data. **Payoff: \$1 million.**
  2.  **Abort at Firewall 2:** You escape with the main vault data. **Payoff: \$4 million.**
  3.  **Proceed past Firewall 2:** You trigger a silent alarm and are caught. **Payoff: \$0.**

  ---

  ### 1. The Advance-Commitment Strategy (Ex-Ante)

  Before entering the vault, the thief plans their strategy. They want to maximize their **Total Expected Wealth**. They know that to get to Firewall 2, they must have pressed "PROCEED" at Firewall 1.

  Let $p$ be the probability of pressing "PROCEED". Consequently, $(1-p)$ is the probability of pressing "ABORT".

  *   **Probability of stopping at Firewall 1:** $(1-p)$
      *   *Contribution to Expected Value:* $(1-p) \times \$1\text{m}$
  *   **Probability of stopping at Firewall 2:** $p \times (1-p)$
      *   (Must Proceed at 1 AND Abort at 2)
      *   *Contribution to Expected Value:* $p(1-p) \times \$4\text{m}$
  *   **Probability of getting caught:** $p \times p$
      *   (Proceed at 1 AND Proceed at 2)
      *   *Contribution to Expected Value:* $p^2 \times \$0$

  **The Planning Objective Function:**
  $$E_{\text{total}}(p) = 1(1-p) + 4(p - p^2) = 1 - p + 4p - 4p^2 = 1 + 3p - 4p^2$$

  To find the optimal commitment, we take the derivative with respect to $p$ and set it to zero:
  $$\frac{dE_{\text{total}}}{dp} = 3 - 8p = 0$$
  $$8p = 3 \implies p = \frac{3}{8} = \mathbf{0.375}$$

  **The Planner's Conclusion:** "To maximize my total expected take, I should program my neural implant to press 'PROCEED' with a **37.5%** probability at every screen."

  ---

  ### 2. The In-the-Moment Strategy (Ex-Interim)

  Now, imagine the thief is standing in front of a black screen. The amnesia has kicked in. They do not know if this is Firewall 1 or Firewall 2. They only know: *"I am at a firewall."*

  From this perspective, the thief reasons about what looks optimal **right now**. They calculate the expected payoff *conditional on being at a decision point*. This changes the weighting of the outcomes because the thief effectively "counts" each visit to a screen as a separate opportunity.

  **Updating Beliefs:**
  If the thief follows the planned strategy of $p = 0.375$:
  *   The probability of reaching Firewall 1 is $1$ (you always start there).
  *   The probability of reaching Firewall 2 is $p = 0.375$.
  *   The total "probability mass" of being at *a* firewall is $1 + p = 1.375$.

  Using Bayes' rule, the thief's belief about their location is:
  *   $P(\text{Firewall 1} | \text{At Screen}) = \frac{1}{1+p}$
  *   $P(\text{Firewall 2} | \text{At Screen}) = \frac{p}{1+p}$

  **The Action Objective Function:**
  The thief now maximizes the **Conditional Expected Utility** ($E_{\text{cond}}$), which is the average payoff per visit to a screen.

  $$E_{\text{cond}}(p) = \frac{E_{\text{total}}(p)}{P(\text{At Screen})} = \frac{1 + 3p - 4p^2}{1 + p}$$

  To find what looks optimal *at the screen*, we maximize this function with respect to $p$. Using the quotient rule:

  $$\frac{dE_{\text{cond}}}{dp} = \frac{(1+p)(3 - 8p) - (1 + 3p - 4p^2)(1)}{(1+p)^2}$$

  Setting the numerator to zero:
  $$(3 - 8p + 3p - 8p^2) - (1 + 3p - 4p^2) = 0$$
  $$3 - 5p - 8p^2 - 1 - 3p + 4p^2 = 0$$
  $$2 - 8p - 4p^2 = 0$$
  $$2p^2 + 4p - 1 = 0$$

  Solving for $p$ using the quadratic formula ($\frac{-b \pm \sqrt{b^2 - 4ac}}{2a}$):
  $$p = \frac{-4 + \sqrt{16 - 4(2)(-1)}}{4} = \frac{-4 + \sqrt{24}}{4} \approx \frac{-4 + 4.899}{4} \approx \mathbf{0.225}$$

  **The Actor's Conclusion:** "Standing here, looking at this screen, the strategy that maximizes my expected return *for this specific decision* is to press 'PROCEED' with only a **22.5%** probability."

  ---

  ### 3. The Divergence: Where and Why

  You now have the precise divergence for your feature:

  *   **Optimal Commitment (Planning):** $p = 0.375$ (37.5%)
  *   **Optimal Action (In-the-Moment):** $p \approx 0.225$ (22.5%)

  **Why they diverge:**
  The divergence stems from **how the probabilities are weighted**.

  1.  **The Planner (Ex-Ante)** cares about the **Path**. They recognize that increasing $p$ increases the chance of reaching the high-value Firewall 2, but also increases the chance of the catastrophic "Proceed-Proceed" crash. They balance the *frequency of paths*.
  2.  **The Actor (Ex-Interim)** cares about the **Node**. When standing at the screen, the thief treats their current location as a fixed fact ("I am here"). By maximizing conditional utility, they implicitly treat every visit to a screen as equally important.
      *   Because the strategy $p$ determines how often they visit the second screen, a higher $p$ "dilutes" the average payoff per screen visit (since the second screen is associated with higher risk of the \$0 crash).
      *   Consequently, the actor feels more risk-averse than the planner. The actor thinks, "I'm already here; why risk the crash?" whereas the planner thinks, "I need to risk it sometimes to get to the second node at all."

  **The Paradox:**
  If the thief commits to $37.5\%$ in advance, the moment they stand before the first screen, their own calculation tells them they should be deviating to $22.5\%$. The strategy that is optimal for the *life of the heist* is not the strategy that looks optimal for the *decision at hand*. This is the essence of self-locating uncertainty: the agent's perspective shifts from a god's-eye view of the tree to a worm's-eye view of the node, and the math no longer aligns.
