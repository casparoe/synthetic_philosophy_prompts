  ### The Missing Move: Pooling the Evidence (The Total Evidence View)

  Neither Mara nor Theo made the move that most epistemologists would suggest is actually prior to the conciliation/steadfastness debate: **sharing their underlying reasoning.**

  They treated their estimates as opaque outputs (400 vs. 1800) and fought over whose *status* or which *rule* should govern the aggregation. A better move, aligned with the **Total Evidence View**, would have been to spend the 30 seconds before submitting comparing *how* they got their numbers.

  If Mara's forecast model relies on customer turnover rates and Theo's inventory logic relies on keg capacity and turnover, pooling that data might reveal that one of them made a calculation error, or that their evidence actually points to a third number entirely. In peer disagreement cases, sharing the *first-order evidence* often dissolves the disagreement rather than requiring a mechanical compromise (averaging) or a status contest (who has the better job). It transforms the situation from a "disagreement between peers" into a "collaborative inquiry," which bypasses the need for conciliationist norms altogether.
