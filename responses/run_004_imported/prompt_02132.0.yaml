prompt: |-
  So I'm writing a novel where my main character, who's bipolar, signs one of those psychiatric advance directives before things get bad -- basically pre-authorizing her doctors to hospitalize her even if she's begging them not to once she's manic. I guess these are sometimes called Ulysses contracts, after Ulysses having his men tie him to the mast so he couldnt give in to the sirens later. What I actually want to understand for the book, not just the dictionary version, is the philosophical crux of it: whose autonomy is even being honored when an earlier self gets to override a later self thats objecting in real time? Is there a principled reason to trust the calmer self over the manic one, or does the whole setup just quietly assume that answer instead of arguing for it? Don't dumb it down, I can handle the weeds on this one.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** Writing a novel featuring a protagonist with bipolar disorder.
      *   **Plot Point:** The protagonist signs a psychiatric advance directive (PAD) / Ulysses contract, authorizing involuntary hospitalization during manic episodes despite contemporaneous objection.
      *   **Core Question:** What is the *philosophical crux* of this arrangement? Whose autonomy is being honored (past self vs. present self)? Is there a principled reason to privilege the "euthymic" (stable) self over the "manic" self, or is it an assumption?
      *   **Tone/Level:** "Don't dumb it down," "I can handle the weeds." This requires a sophisticated, nuanced, and academically grounded discussion, not just a surface-level summary.

  2.  **Deconstruct the Philosophical Problem:**
      *   **The Conflict:** Personal Identity over Time vs. Competency/Capacity.
      *   **Key Concepts:**
          *   Autonomy (Diachronic vs. Synchronic).
          *   Competency/Capacity (Decision-making ability).
          *   Personal Identity (Is the manic self the "same" person as the stable self?).
          *   Paternalism (Soft vs. Hard).
          *   Authenticity (Which self represents the "true" will?).

  3.  **Identify Key Philosophical Perspectives/Arguments:**
      *   *The Precedent Autonomy Argument (Dworkin):* Ronald Dworkin's distinction between "experiential interests" (what feels good now) and "critical interests" (what makes life good overall). The stable self holds the critical interests.
      *   *The Competency/Capacity Argument:* Mania impairs cognition (delusions, impulsivity, lack of insight). Therefore, the manic self lacks the *capacity* for autonomy, making the intervention not a violation of autonomy but a protection of it.
      *   *The Personal Identity Argument (Parfit/Psycho-continuity):* If the manic self is psychologically discontinuous with the stable self, are they the same moral agent? If not, the stable self is making decisions for a "different" person.
      *   *The Authenticity Argument:* Which desires are "authentic"? Manic desires are often chemically induced and fleeting. Stable desires are reflective and enduring.
      *   *The Counter-Arguments (Critiques):*
          *   *The "Right to Madness" (Foucault/Szasz):* Is mania a valid state of being? Is pathologizing it a form of social control?
          *   *The Epistemic Problem:* How do we know the stable self is right? What if the manic self has insights?
          *   *The Slippery Slope:* Who defines "stable"?
          *   *Ulysses Contracts as Self-Binding:* Jon Elster's work on pre-commitment strategies.

  4.  **Structure the Response:**
      *   **Introduction:** Acknowledge the depth of the question. Validate the "Ulysses Contract" analogy but note its limitations in psychiatry.
      *   **Dimension 1: Diachronic Autonomy vs. Synchronic Autonomy:** Define the tension. Past self (stable) vs. Present self (manic).
      *   **Dimension 2: Competence and Capacity:** The legal/medical justification. Mania as a defeater of rationality.
      *   **Dimension 3: Authenticity and "True" Self:** Dworkin's critical interests. Which desires count as *hers*?
      *   **Dimension 4: Personal Identity:** Is the manic self the same person? (Psychological continuity).
      *   **Dimension 5: The Counter-View (The Critique):** Why this might be problematic (neurodiversity, epistemic humility, trauma of coercion).
      *   **Application to Fiction:** How to dramatize this conflict without resolving it neatly.

  5.  **Drafting the Content (Iterative refinement for tone and depth):**
      *   *Tone Check:* Ensure I'm not sounding like a medical textbook. Use philosophical terminology (diachronic, phenomenology, constitutive luck) but explain them in context.
      *   *Specific References:* Mention Ronald Dworkin (*Life's Dominion*), Jon Elster (*Ulysses and the Sirens*), maybe Rebecca Dresser (critic of advance directives in dementia/psychiatry).
      *   *Nuance:* Avoid saying "The stable self is definitely right." Instead, frame it as "The stable self claims authority based on X, but the manic self challenges it based on Y."
      *   *The "Weeds":* Discuss the difference between *preference* and *values*. Discuss the concept of *anosognosia* (lack of insight) as it relates to autonomy.

  6.  **Refining the Argument (Self-Correction during drafting):**
