      *   *Initial thought:* Treat bipolar mania as purely negative.
      *   *Correction:* Acknowledge the seductive nature of mania (creativity, euphoria) to make the conflict real for the novel. The "loss" the character feels during hospitalization must be palpable.
      *   *Key Distinction:* Make sure to distinguish between *Ulysses contracts* (pre-commitment) and standard *involuntary commitment*. The Ulysses element is the *consent* given beforehand. That's the philosophical hook.

  7.  **Final Polish:** Check against the prompt's constraints.
